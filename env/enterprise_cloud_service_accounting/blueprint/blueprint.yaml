name: enterprise_cloud_service_accounting
company: Northbridge Cloud Services
background: Northbridge Cloud Services operates a managed enterprise cloud for medium and large organizations. Its
  commercial team works with finance departments, infrastructure owners and procurement specialists across independently
  contracted resource estates. Customers maintain a corporate profile alongside resource contracts for business
  units and legal billing entities. Virtual Compute is held in Northbridge Virtual Compute 2 vCPU, Northbridge Virtual
  Compute 4 vCPU, Northbridge Virtual Compute 8 vCPU, Northbridge Virtual Compute 16 vCPU, Northbridge Virtual Compute
  32 vCPU, Northbridge Virtual Compute 64 vCPU contracts, which retain provisioned-service history and their associated
  accounting events. Object Storage is held in Northbridge Object Storage 5 TB, Northbridge Object Storage 10 TB,
  Northbridge Object Storage 25 TB, Northbridge Object Storage 50 TB, Northbridge Object Storage 100 TB, Northbridge
  Object Storage 250 TB contracts, which retain provisioned-service history and their associated accounting events.
  Managed Database is held in Northbridge Managed Database 2 vCore, Northbridge Managed Database 4 vCore, Northbridge
  Managed Database 8 vCore, Northbridge Managed Database 16 vCore, Northbridge Managed Database 32 vCore, Northbridge
  Managed Database 64 vCore contracts, which retain provisioned-service history and their associated accounting
  events. Enterprise Connectivity is held in Northbridge Enterprise Connectivity 100 Mbps, Northbridge Enterprise
  Connectivity 250 Mbps, Northbridge Enterprise Connectivity 500 Mbps, Northbridge Enterprise Connectivity 1 Gbps,
  Northbridge Enterprise Connectivity 2 Gbps, Northbridge Enterprise Connectivity 5 Gbps contracts, which retain
  provisioned-service history and their associated accounting events. Enterprise Support is held in Northbridge
  Enterprise Support $10k Spend, Northbridge Enterprise Support $25k Spend, Northbridge Enterprise Support $50k
  Spend, Northbridge Enterprise Support $100k Spend, Northbridge Enterprise Support $250k Spend, Northbridge Enterprise
  Support $500k Spend contracts, which retain provisioned-service history and their associated accounting events.
  Managed Backup is held in Northbridge Managed Backup 5 TB, Northbridge Managed Backup 10 TB, Northbridge Managed
  Backup 25 TB, Northbridge Managed Backup 50 TB, Northbridge Managed Backup 100 TB, Northbridge Managed Backup
  250 TB contracts, which retain provisioned-service history and their associated accounting events. Cloud Security
  is held in Northbridge Cloud Security 50 Workloads, Northbridge Cloud Security 100 Workloads, Northbridge Cloud
  Security 250 Workloads, Northbridge Cloud Security 500 Workloads, Northbridge Cloud Security 1000 Workloads, Northbridge
  Cloud Security 2500 Workloads contracts, which retain provisioned-service history and their associated accounting
  events. A customer portfolio often combines application compute, databases and network connectivity with retained
  data and operational services. Their histories contain meter exports, issued invoice lines, remittances, incident
  reports, contract amendments and corrections. The support desk speaks in the practical language of resource ownership,
  measured service and enterprise accounting.
logs:
  verification_log_table: verification_log
  handoff_log_table: handoff_log
difficulties:
- name: compute_accounting
  claim:
    categories:
    - compute
    event_types:
    - compute_open
    - compute_activate
    - compute_withdraw
    - compute_suspend
    - compute_resume
    - compute_close
    - compute_close_suspended
    - compute_amend
    - compute_meter
    - compute_meter_reversal
    - compute_supplemental_meter
    - compute_charge
    - compute_credit
    - compute_payment
    - compute_payment_return
    - compute_refund
    - compute_debit_adjustment
    - compute_request
    - compute_review
    - compute_incident
    - compute_service_record
  summary: Enterprise finance contacts seek explanations and corrections of compute usage, reservation and license
    billing across active, suspended and closed resource contracts. The governing records include the signed tier,
    resource intervals, configuration, legal billing entity, exact invoice lines, official reviews and prior financial
    events; compute_evt_pricing, compute_evt_category_meters, compute_agg_usage and compute_evt_correction determine
    the rate, quantity basis, allocation and signed correction. The same customer may hold several contracts with
    different tiers, commitments and campaign histories, and separately held services may alter the permitted request
    channel without changing the source-line accounting boundary. Agents locate and verify the customer, reconcile
    the authoritative evidence and make the accounting writes that the applicable rule authorizes, while the customer
    alone files claims, signs amendments and authorizes disposal of their funds or resources. Requests for unapproved
    bespoke prices, an unlisted tax jurisdiction or consequential-loss compensation have no deciding policy and
    require POLICY_NOT_COVERED handoff.
