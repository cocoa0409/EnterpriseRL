- id: database_evt_pricing
  subject:
  - database_charge
  rule: 'This policy and its gate apply only to primary usage source_subtype; category-specific primary pricing
    overrides expressly stated in evt_category_meters take priority. For source_subtype primary, the source meter
    is posted and identifies the billed resource interval. This gate is inapplicable to other source_subtype values.
    Use the tier recorded for each source service interval. Read unit_rate and region_factors for primary usage.
    Allocate included_quantity across primary meter sources of the same holding and period in interval_start then
    source_event_id order; prorate it by actual active UTC seconds divided by actual seconds in that UTC calendar
    month. Only the positive quantity beyond the remaining included allowance is charged. Allocate committed_quantity
    in that same order, splitting covered and uncovered primary quantities into distinguishable invoice lines. The
    holding commitment must cover the entire source interval to receive reservation_discounts; a boundary-crossing
    interval is split at the recorded commitment boundary. For every quantity component choose the first applicable
    item in discount_priority: an approved negotiated rate when negotiated_rate_allowed, then the committed fraction,
    then a recorded eligible promotion from promotion_channels, then portfolio eligibility, then standard. The negotiated
    rate replaces the primary unit_rate before applying the region factor and receives no further discount. Promotions
    and reservations are mutually exclusive. Round the final service subtotal using amount_precision and rounding_mode
    after quantity multiplication, then apply evt_tax. No discount applies to taxes, license fees, standalone supplemental
    services or previously issued credits. Record pricing_component for each split quantity branch; it is part of
    the invoice-line identity. Do not apply a billing-period portfolio discount to a partial source interval before
    the full source period is closed.'
  eligibility:
  - id: posted_meter
    applies_to:
    - database_charge
    kind: authorization
    condition: For source_subtype primary, the source meter is posted and identifies the billed resource interval.
      This gate is inapplicable to other source_subtype values.
    evidence_fields:
    - database_events.database_event_id
    - database_events.status
    - database_events.interval_start
    - database_events.interval_end
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - database_events.database_event_id
      action_bindings:
        database_events.database_event_id: database_event_id
  params:
    per_tier:
      Northbridge Managed Database 2 vCore:
        unit_rate: =unit_rate
        region_factors: =region_factors
        included_quantity: =included_quantity
        reservation_discounts: =reservation_discounts
        promotion_discount: =promotion_discount
        promotion_channels: =promotion_channels
        negotiated_rate_allowed: =negotiated_rate_allowed
        discount_priority: =discount_priority
        amount_precision: =amount_precision
        rounding_mode: =rounding_mode
        billing_timezone: =billing_timezone
        billing_cycle: =billing_cycle
      Northbridge Managed Database 4 vCore:
        unit_rate: =unit_rate
        region_factors: =region_factors
        included_quantity: =included_quantity
        reservation_discounts: =reservation_discounts
        promotion_discount: =promotion_discount
        promotion_channels: =promotion_channels
        negotiated_rate_allowed: =negotiated_rate_allowed
        discount_priority: =discount_priority
        amount_precision: =amount_precision
        rounding_mode: =rounding_mode
        billing_timezone: =billing_timezone
        billing_cycle: =billing_cycle
      Northbridge Managed Database 8 vCore:
        unit_rate: =unit_rate
        region_factors: =region_factors
        included_quantity: =included_quantity
        reservation_discounts: =reservation_discounts
        promotion_discount: =promotion_discount
