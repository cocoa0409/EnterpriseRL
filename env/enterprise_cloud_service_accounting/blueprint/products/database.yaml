        - database_events.request_id
      action_bindings:
        database_events.database_event_id: database_event_id
        database_events.request_id: request_id
  params:
    per_tier:
      Northbridge Managed Database 2 vCore:
        max_resources: =max_resources
        amendment_limit: =amendment_limit
        negotiated_rate_allowed: =negotiated_rate_allowed
      Northbridge Managed Database 4 vCore:
        max_resources: =max_resources
        amendment_limit: =amendment_limit
        negotiated_rate_allowed: =negotiated_rate_allowed
      Northbridge Managed Database 8 vCore:
        max_resources: =max_resources
        amendment_limit: =amendment_limit
        negotiated_rate_allowed: =negotiated_rate_allowed
      Northbridge Managed Database 16 vCore:
        max_resources: =max_resources
        amendment_limit: =amendment_limit
        negotiated_rate_allowed: =negotiated_rate_allowed
      Northbridge Managed Database 32 vCore:
        max_resources: =max_resources
        amendment_limit: =amendment_limit
        negotiated_rate_allowed: =negotiated_rate_allowed
      Northbridge Managed Database 64 vCore:
        max_resources: =max_resources
        amendment_limit: =amendment_limit
        negotiated_rate_allowed: =negotiated_rate_allowed
  measures:
  - database_msr_amendments
- id: database_evt_request
  subject:
  - database_request
  rule: Only the customer may file or cancel an authorization, claim or disposal request. Preserve the exact external_reference
    and the narrowest source_event_id. Set notice_at and occurred_at to the frozen clock and status pending on filing;
    cancellation is a new request event with status cancelled linked to the original request. An unsupported channel
    is refused. A repeated identical request reference returns the existing event. Filing a request never confirms
    a system approval or changes an accounting balance.
  eligibility: []
  params:
    per_tier:
      Northbridge Managed Database 2 vCore:
        authorized_channels: =authorized_channels
      Northbridge Managed Database 4 vCore:
        authorized_channels: =authorized_channels
      Northbridge Managed Database 8 vCore:
        authorized_channels: =authorized_channels
      Northbridge Managed Database 16 vCore:
        authorized_channels: =authorized_channels
      Northbridge Managed Database 32 vCore:
