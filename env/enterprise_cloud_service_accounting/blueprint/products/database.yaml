        ha_factor: =ha_factor
        replica_factor: =replica_factor
        iops_included: =iops_included
        iops_rate: =iops_rate
        backup_included_days: =backup_included_days
        backup_storage_rate: =backup_storage_rate
        restore_rate: =restore_rate
        commercial_license_rate: =commercial_license_rate
        amount_precision: =amount_precision
