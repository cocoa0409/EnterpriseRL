events:
- type: database_open
  target: database_holdings
  meaning: The customer registers a signed cloud service application.
  grain: One persistent contract per signed resource scope.
  fields:
    database_holding_id: Internal reference of the Managed Database contract.
    customer_id: Enterprise customer that owns this contract.
    variant_name: Official contracted capacity or spend tier effective for the service interval.
    status: Contract lifecycle state; closed contracts retain accounting history.
    opened_date: UTC date the signed application was registered.
    activated_at: Authoritative UTC activation time; empty before activation.
    closed_date: UTC customer-confirmed termination date; empty until closed.
    billing_entity: Customer legal billing entity copied exactly from the signed contract.
    region: Service region from the signed contract.
    currency: Currency agreed on the contract.
    approval_status: Back-office review of the signed contract.
    resource_count: Actual resource count provisioned under this holding.
    tax_treatment: Tax classification supported by the current reviewed evidence.
    tax_review_status: Official review state of the current tax treatment.
    commitment_term: Signed primary usage commitment term.
    commitment_start: UTC start of signed commitment; empty for on-demand.
    commitment_end: Authoritative contractual expiration time; empty for on-demand.
    committed_quantity: Primary usage quantity covered by commitment in each billing month.
    remaining_commitment_usd: Unbilled fixed contractual liability stated in the signed termination schedule.
    negotiated_unit_rate: Signed negotiated primary unit rate; ignored unless negotiated_approval is approved.
    negotiated_approval: Official approval state of a signed negotiated-rate amendment.
    promotion_status: Campaign entitlement recorded for this holding.
    payment_status: Current official payment restriction state.
    configuration: Primary service configuration controlling category-specific rate selection.
    external_reference: Exact customer-supplied signed resource-scope reference that uniquely distinguishes this
      contract application.
    request_id: Reference of the latest customer authorization for this contract application, amendment or disposal.
  triggers: []
  mutation: create
- type: database_activate
  target: database_holdings
  meaning: The agent moves the contract from applied to active.
  grain: One persistent contract per signed resource scope.
  fields:
    database_holding_id: Internal reference of the Managed Database contract.
    customer_id: Enterprise customer that owns this contract.
    status: Contract lifecycle state; closed contracts retain accounting history.
    activated_at: Authoritative UTC activation time; empty before activation.
  triggers: []
  mutation:
    transition:
      from: applied
      to: active
- type: database_withdraw
  target: database_holdings
  meaning: The user moves the contract from applied to closed.
  grain: One persistent contract per signed resource scope.
  fields:
    database_holding_id: Internal reference of the Managed Database contract.
    customer_id: Enterprise customer that owns this contract.
    status: Contract lifecycle state; closed contracts retain accounting history.
    closed_date: UTC customer-confirmed termination date; empty until closed.
    request_id: Reference of the latest customer authorization for this contract application, amendment or disposal.
  triggers: []
  mutation:
    transition:
      from: applied
      to: closed
- type: database_suspend
  target: database_holdings
  meaning: The agent moves the contract from active to suspended.
  grain: One persistent contract per signed resource scope.
  fields:
    database_holding_id: Internal reference of the Managed Database contract.
    customer_id: Enterprise customer that owns this contract.
    status: Contract lifecycle state; closed contracts retain accounting history.
    payment_status: Current official payment restriction state.
  triggers: []
  mutation:
    transition:
      from: active
      to: suspended
- type: database_resume
  target: database_holdings
  meaning: The agent moves the contract from suspended to active.
  grain: One persistent contract per signed resource scope.
  fields:
    database_holding_id: Internal reference of the Managed Database contract.
    customer_id: Enterprise customer that owns this contract.
    status: Contract lifecycle state; closed contracts retain accounting history.
    payment_status: Current official payment restriction state.
  triggers: []
  mutation:
    transition:
      from: suspended
      to: active
- type: database_close
  target: database_holdings
  meaning: The user moves the contract from active to closed.
  grain: One persistent contract per signed resource scope.
  fields:
    database_holding_id: Internal reference of the Managed Database contract.
    customer_id: Enterprise customer that owns this contract.
    status: Contract lifecycle state; closed contracts retain accounting history.
    closed_date: UTC customer-confirmed termination date; empty until closed.
    request_id: Reference of the latest customer authorization for this contract application, amendment or disposal.
    remaining_commitment_usd: Unbilled fixed contractual liability stated in the signed termination schedule.
  triggers:
  - event: database:database_charge
    when:
      remaining_commitment_usd:
        not: 0
    map:
      database_holding_id: database_holding_id
      customer_id: customer_id
      request_id: request_id
      source_subtype: termination
  mutation:
    transition:
      from: active
      to: closed
- type: database_close_suspended
  target: database_holdings
  meaning: The user moves the contract from suspended to closed.
  grain: One persistent contract per signed resource scope.
  fields:
    database_holding_id: Internal reference of the Managed Database contract.
    customer_id: Enterprise customer that owns this contract.
    status: Contract lifecycle state; closed contracts retain accounting history.
    closed_date: UTC customer-confirmed termination date; empty until closed.
    request_id: Reference of the latest customer authorization for this contract application, amendment or disposal.
    remaining_commitment_usd: Unbilled fixed contractual liability stated in the signed termination schedule.
  triggers:
  - event: database:database_charge
    when:
      remaining_commitment_usd:
        not: 0
    map:
      database_holding_id: database_holding_id
      customer_id: customer_id
      request_id: request_id
      source_subtype: termination
  mutation:
    transition:
      from: suspended
      to: closed
- type: database_amend
  target: database_holdings
  meaning: An approved signed amendment changes capacity or contract attributes without changing lifecycle state.
  grain: One persistent contract per signed resource scope.
  fields:
    database_holding_id: Internal reference of the Managed Database contract.
    customer_id: Enterprise customer that owns this contract.
    variant_name: Official contracted capacity or spend tier effective for the service interval.
    resource_count: Actual resource count provisioned under this holding.
    configuration: Primary service configuration controlling category-specific rate selection.
    negotiated_unit_rate: Signed negotiated primary unit rate; ignored unless negotiated_approval is approved.
    negotiated_approval: Official approval state of a signed negotiated-rate amendment.
    tax_treatment: Tax classification supported by the current reviewed evidence.
    tax_review_status: Official review state of the current tax treatment.
    commitment_term: Signed primary usage commitment term.
    commitment_start: UTC start of signed commitment; empty for on-demand.
    commitment_end: Authoritative contractual expiration time; empty for on-demand.
    committed_quantity: Primary usage quantity covered by commitment in each billing month.
    remaining_commitment_usd: Unbilled fixed contractual liability stated in the signed termination schedule.
    request_id: Reference of the latest customer authorization for this contract application, amendment or disposal.
  triggers: []
  mutation: update
- type: database_meter
  target: database_events
  meaning: A signed primary consumption delta is recorded against the source resource interval.
  grain: One source resource interval, accounting line, or independently referenced service occurrence; derived
    lines retain the narrowest original event reference.
  fields:
    database_holding_id: Contract to which this event belongs.
    customer_id: Customer owning the event and the referenced contract.
    external_reference: Exact resource, invoice, remittance or request reference from its authoritative record or
      the customer.
    source_event_id: Narrowest original event corrected, billed, credited, paid or refunded; empty for an independent
      source.
    related_event_id: Additional linked approval, incident or evidence event; empty when absent.
    request_id: Customer request event reference; empty where no customer request is needed.
    occurred_at: Authoritative event occurrence time in UTC.
    period: UTC calendar month of the service being billed.
    status: Processing state of this individual evidence or booking record.
    meter_code: Exact supported category meter from the provider export; none on nonmeter events.
    source_subtype: Business subtype distinguishing a source line.
    interval_start: Inclusive start of the measured UTC service interval.
