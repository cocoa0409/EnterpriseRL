        rounding_mode: =rounding_mode
        meter_quantum: =meter_quantum
        minimum_quantity: =minimum_quantity
        overage_handling: =overage_handling
        included_quantity: =included_quantity
      Northbridge Managed Database 64 vCore:
        usage_unit: =usage_unit
        quantity_precision: =quantity_precision
        rounding_mode: =rounding_mode
        meter_quantum: =meter_quantum
        minimum_quantity: =minimum_quantity
        overage_handling: =overage_handling
        included_quantity: =included_quantity
  formula:
    metered_quantity: max(quantity, minimum_quantity)
- id: database_agg_usage
  subject:
  - database_charge
  rule: Use msr_portfolio_usage to select the portfolio discount. Combine only holdings of this category owned by
    the same customer with the same billing_entity and source period, even if some have since closed. No cross-entity
    or cross-category spending counts. The threshold comparison is inclusive. Portfolio discount applies only to
    primary service usage and only if no higher-priority price applies; it is neither a cash credit nor a deduction
    from ancillary service fees.
  eligibility: []
  params:
    per_tier:
      Northbridge Managed Database 2 vCore:
        portfolio_threshold: =portfolio_threshold
        portfolio_discount: =portfolio_discount
        invoice_grouping: =invoice_grouping
      Northbridge Managed Database 4 vCore:
        portfolio_threshold: =portfolio_threshold
        portfolio_discount: =portfolio_discount
        invoice_grouping: =invoice_grouping
      Northbridge Managed Database 8 vCore:
