- id: database_evt_meter
  subject:
  - database_meter
  - database_meter_reversal
  - database_supplemental_meter
  rule: The authoritative export confirms the resource interval and the measured quantity. Meters originate in the
    provider resource export. Primary meter quantities use usage_unit; a meter is positive and a meter_reversal
    is the negative of the exact erroneous source quantity, capped by the source quantity not already reversed.
    Keep original interval, region, configuration and source reference. bill_actual overage permits measured quantities
    above included_quantity; no service entitlement is invented by a meter write. Round measured quantities to quantity_precision
    using rounding_mode, apply minimum_quantity and round positive billable primary quantities upward to a whole
    meter_quantum. Stopped or suspended service accrues no primary running usage, but real retained storage and
    other supplemental services remain billable through supplemental_meter. A rejected or cancelled source is not
    a billable meter. Repeated exports with the same resource, meter, interval and correction reference are read-only
    confirmations.
  eligibility:
  - id: export_evidence
    applies_to:
    - database_meter
    - database_meter_reversal
    - database_supplemental_meter
    kind: authorization
    condition: The authoritative export confirms the resource interval and the measured quantity.
    evidence_fields:
    - database_events.database_event_id
    - database_events.external_reference
    - database_events.interval_start
    - database_events.interval_end
    - database_events.quantity
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - database_events.database_event_id
      action_bindings:
        database_events.database_event_id: database_event_id
  params:
    per_tier:
      Northbridge Managed Database 2 vCore:
        usage_unit: =usage_unit
        quantity_precision: =quantity_precision
        rounding_mode: =rounding_mode
        meter_quantum: =meter_quantum
        minimum_quantity: =minimum_quantity
        overage_handling: =overage_handling
        included_quantity: =included_quantity
      Northbridge Managed Database 4 vCore:
        usage_unit: =usage_unit
        quantity_precision: =quantity_precision
        rounding_mode: =rounding_mode
        meter_quantum: =meter_quantum
        minimum_quantity: =minimum_quantity
        overage_handling: =overage_handling
        included_quantity: =included_quantity
      Northbridge Managed Database 8 vCore:
        usage_unit: =usage_unit
        quantity_precision: =quantity_precision
        rounding_mode: =rounding_mode
        meter_quantum: =meter_quantum
