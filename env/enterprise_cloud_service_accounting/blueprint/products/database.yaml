- id: database_evt_category_meters
  subject:
  - database_charge
  - database_supplemental_meter
  - database_service_record
  rule: Each primary node has vcore_count cores, memory_gib memory and included_storage_gb. Primary standard node-hours
    use unit_rate. Configuration ha multiplies primary node rate by ha_factor; configuration replica uses replica_factor,
    mutually exclusively. commercial_license separately bills actual vCore-hours at commercial_license_rate; the
    configuration or engine entitlement does not waive that license. storage bills provisioned GB-month beyond included_storage_gb
    at storage_rate. iops bills provisioned IOPS-month beyond iops_included at iops_rate. backup_storage bills GB-month
    retained beyond backup_included_days at backup_storage_rate, with the export separating retention segments;
    restoration itself is not counted as storage. restore bills restored GB at restore_rate. Included native retention
    is not multiplied by the number of restores. Nodes stopped for a suspended contract produce no running node-hours
    but still accrue retained storage. Managed Backup is a separately held protection service and never automatically
    overrides native database retention or license pricing. For every ancillary meter, multiply the nonincluded
    measured quantity by its selected rate, then round the net line using amount_precision and rounding_mode and
    tax under evt_tax. An allowance is consumed chronologically by interval_start then source_event_id within the
    named holding and UTC period; reversal of its source returns only that source allocation. Source subtype supplemental
    identifies these amounts so the primary discount policy does not apply. Completed service records prove nonfinancial
    entitlements; unknown meter codes or units are POLICY_NOT_COVERED instead of guessed prices. These calculations
    never authorize an unapproved customer-only action. For included capacities denominated in GB-month, contact-month
    or package-month, prorate the capacity by actual active interval seconds divided by actual seconds in its UTC
    month before comparing measured quantity. Category-specific primary inclusions replace the generic included_quantity
    where expressly named; they are not added twice. A mandatory minimum fee is a pricing minimum, not a second
    charge.
