      Northbridge Managed Database 16 vCore:
        unit_rate: =unit_rate
        region_factors: =region_factors
        included_quantity: =included_quantity
        reservation_discounts: =reservation_discounts
        promotion_discount: =promotion_discount
        promotion_channels: =promotion_channels
        negotiated_rate_allowed: =negotiated_rate_allowed
        discount_priority: =discount_priority
        amount_precision: =amount_precision
        rounding_mode: =rounding_mode
        billing_timezone: =billing_timezone
        billing_cycle: =billing_cycle
      Northbridge Managed Database 32 vCore:
        unit_rate: =unit_rate
        region_factors: =region_factors
        included_quantity: =included_quantity
        reservation_discounts: =reservation_discounts
        promotion_discount: =promotion_discount
        promotion_channels: =promotion_channels
        negotiated_rate_allowed: =negotiated_rate_allowed
        discount_priority: =discount_priority
        amount_precision: =amount_precision
        rounding_mode: =rounding_mode
        billing_timezone: =billing_timezone
        billing_cycle: =billing_cycle
      Northbridge Managed Database 64 vCore:
        unit_rate: =unit_rate
        region_factors: =region_factors
        included_quantity: =included_quantity
        reservation_discounts: =reservation_discounts
        promotion_discount: =promotion_discount
        promotion_channels: =promotion_channels
        negotiated_rate_allowed: =negotiated_rate_allowed
        discount_priority: =discount_priority
        amount_precision: =amount_precision
        rounding_mode: =rounding_mode
        billing_timezone: =billing_timezone
        billing_cycle: =billing_cycle
  formula:
    unrounded_service_subtotal: max(quantity - included_quantity_applied, 0) * unit_rate * (1 - discount_fraction)
- id: database_evt_combination
  subject:
  - database_charge
  rule: A current Northbridge Enterprise Support holding for the same customer and billing entity provides assisted
    invoice explanation, but does not itself reduce this category price or waive debt. An approved negotiated rate
    is a contract-specific override; the presence of a paid support holding makes assisted negotiated-amendment
    intake available through support as well as portal and api. Without that combination the signed amendment is
    submitted through portal or api. A promotional primary-price entitlement is suppressed wherever a commitment
    price covers the same quantity, and no benefit from an unrelated category is stacked. The combination changes
    only request-channel eligibility, not approval authority.
