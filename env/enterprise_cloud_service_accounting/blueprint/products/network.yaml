    - network_events.source_event_id
    - network_events.meter_code
    - network_events.source_subtype
    - network_events.pricing_component
    - network_events.period
    - network_events.event_type
    - network_events.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - network_events.source_event_id
      action_bindings:
        network_events.source_event_id: source_event_id
    dedup_contract:
      table: network_events
      mode: separate_record
      object_bindings:
        source_event_id: source_event_id
        meter_code: meter_code
        source_subtype: source_subtype
        pricing_component: pricing_component
        period: period
      duplicate_filters:
        event_type:
        - network_charge
        status:
