        cross_region_rate: =cross_region_rate
        private_transfer_rate: =private_transfer_rate
        ingress_rate: =ingress_rate
        nat_processing_rate: =nat_processing_rate
        nat_hour_rate: =nat_hour_rate
        public_ipv4_rate: =public_ipv4_rate
