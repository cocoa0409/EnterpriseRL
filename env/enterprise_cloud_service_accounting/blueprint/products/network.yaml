      timing: pre_action
      correlation_keys:
      - - network_holdings.network_holding_id
      action_bindings:
        network_holdings.network_holding_id: network_holding_id
  params:
    per_tier:
      Northbridge Enterprise Connectivity 100 Mbps:
        tax_rates: =tax_rates
        amount_precision: =amount_precision
        rounding_mode: =rounding_mode
      Northbridge Enterprise Connectivity 250 Mbps:
        tax_rates: =tax_rates
        amount_precision: =amount_precision
        rounding_mode: =rounding_mode
      Northbridge Enterprise Connectivity 500 Mbps:
        tax_rates: =tax_rates
        amount_precision: =amount_precision
        rounding_mode: =rounding_mode
      Northbridge Enterprise Connectivity 1 Gbps:
        tax_rates: =tax_rates
        amount_precision: =amount_precision
        rounding_mode: =rounding_mode
      Northbridge Enterprise Connectivity 2 Gbps:
        tax_rates: =tax_rates
        amount_precision: =amount_precision
        rounding_mode: =rounding_mode
      Northbridge Enterprise Connectivity 5 Gbps:
        tax_rates: =tax_rates
        amount_precision: =amount_precision
        rounding_mode: =rounding_mode
  formula:
    gross_amount: net_amount + tax_amount
- id: network_evt_invoice
  subject:
  - network_charge
  rule: No posted charge exists for the same source event, meter, source subtype, pricing component and billing
    period. Group service charges by invoice_grouping. Billing periods follow billing_cycle in billing_timezone,
    beginning at the first instant of the first date and ending exclusively at the first instant of the next month.
    For measured usage, invoice only services whose interval has ended; lifecycle fees instead require their source
    occurrence to be completed; use the posted authoritative source records. Set invoice_issued_at to the frozen
    handling time. Carry forward a positive grouped subtotal below minimum_invoice_amount rather than issuing an
    invoice; zero-rated usage stays visible as a meter and receives no monetary charge. A source charge already
    posted for the same source event, meter, quantity component and invoice period is returned without another charge.
    The fixed source reference and source_subtype distinguish primary, supplemental, setup, termination, resumption
    and return-fee components.
  eligibility:
  - id: unbilled_source_component
    applies_to:
    - network_charge
    kind: dedup
    condition: No posted charge exists for the same source event, meter, source subtype, pricing component and billing
