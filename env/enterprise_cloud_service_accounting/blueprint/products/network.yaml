- id: network_exit
  subject:
  - network_withdraw
  - network_close
  - network_close_suspended
  rule: The customer has filed the exact resource-disposal authorization for this contract. Only the customer may
    withdraw an application or terminate their provisioned resources. An applied contract can be withdrawn without
    any setup, usage or termination charge. For active or suspended contracts, record closed_date from the frozen
    clock and stop running primary meters at the exact customer-confirmed close time. Accrued usage and actual retained-resource
    charges remain payable; closing never erases receivables or credits. termination_fee applies to an on-demand
    exit under evt_fees. If a signed commitment remains unexpired and commitment_cancel_allowed is false, invoice
    its recorded remaining_commitment_usd as a distinct termination component, without also charging future usage
    against that same liability. No new usage begins after closure; existing financial corrections, collection and
    refunds remain possible. Repeating the same closed-resource confirmation has no further effect. Before closing,
    the signed termination schedule supplies remaining_commitment_usd and is zero when no unbilled commitment liability
    remains. A positive recorded liability necessarily triggers the distinct termination charge using the disposal
    request as its source_event_id; closure and that one invoice entry complete the event chain.
  eligibility:
  - id: customer_disposal
    applies_to:
    - network_withdraw
    - network_close
    - network_close_suspended
    kind: authorization
    condition: The customer has filed the exact resource-disposal authorization for this contract.
    evidence_fields:
    - network_holdings.network_holding_id
    - network_events.request_id
    - network_events.source_event_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - network_holdings.network_holding_id
        - network_events.request_id
        - network_events.source_event_id
      action_bindings:
        network_holdings.network_holding_id: network_holding_id
        network_events.request_id: request_id
        network_events.source_event_id: source_event_id
  params:
    per_tier:
      Northbridge Enterprise Connectivity 100 Mbps:
        termination_fee: =termination_fee
        commitment_cancel_allowed: =commitment_cancel_allowed
      Northbridge Enterprise Connectivity 250 Mbps:
        termination_fee: =termination_fee
        commitment_cancel_allowed: =commitment_cancel_allowed
      Northbridge Enterprise Connectivity 500 Mbps:
        termination_fee: =termination_fee
        commitment_cancel_allowed: =commitment_cancel_allowed
      Northbridge Enterprise Connectivity 1 Gbps:
        termination_fee: =termination_fee
        commitment_cancel_allowed: =commitment_cancel_allowed
      Northbridge Enterprise Connectivity 2 Gbps:
        termination_fee: =termination_fee
        commitment_cancel_allowed: =commitment_cancel_allowed
