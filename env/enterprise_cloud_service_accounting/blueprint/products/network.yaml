- id: network_evt_review
  subject:
  - network_review
  rule: The source event and the evidence record identify the same holding and narrowest business object. A service
    accountant reviews one precise source event against its authoritative export, contract terms, bank notice, tax
    record or incident record. Record decision correct or incorrect for a billing review, and eligible or ineligible
    for an outage claim; status approved means the review is complete and authoritative, not that a credit necessarily
    follows. Record corrected net_amount and tax_amount for incorrect billing, or credited_amount for an eligible
    outage after applying evt_service_credit. A rejected review cannot authorize money movement. The customer may
    provide a locator but cannot dictate an official decision. Repeating the same source and request review returns
    the existing decision; materially new evidence is a distinct review linked through related_event_id. Review
    alone books no money.
  eligibility:
  - id: reviewable_source
    applies_to:
    - network_review
    kind: authorization
    condition: The source event and the evidence record identify the same holding and narrowest business object.
    evidence_fields:
    - network_events.network_event_id
    - network_events.source_event_id
    - network_events.related_event_id
    - network_events.network_holding_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - network_events.network_event_id
        - network_events.source_event_id
        - network_events.related_event_id
        - network_events.network_holding_id
      action_bindings:
        network_events.network_event_id: network_event_id
        network_events.source_event_id: source_event_id
        network_events.related_event_id: related_event_id
        network_events.network_holding_id: network_holding_id
  params: {}
- id: network_evt_correction
  subject:
  - network_credit
  - network_debit_adjustment
  rule: For source_subtype correction, the source charge has an approved review with decision incorrect. This gate
    is inapplicable to other source_subtype values. Correct an erroneous charge to the approved review net_amount
    plus tax_amount, following evt_tax. Compare that corrected gross amount with the source original gross amount
    less cumulative correction credits plus cumulative debit adjustments; do not include service-credit concessions
    in this correction comparison. Credit the positive overcharge, debit the positive undercharge, and make no write
    when equal. A credit amount is negative and its net and tax components preserve the source proportions except
    an approved tax correction. An upward correction carries positive amount. Return the existing adjustment when
    the reviewed target has already been achieved. No cash refund is implicit in an invoice correction. Link source_event_id
    to the original charge and related_event_id to the approved review, never to a broad invoice containing several
    lines. Use correction_gross from msr_source_credits for the correction comparison; service_credit_net never
    changes the approved corrected billing target.
  eligibility:
  - id: approved_correction
    applies_to:
    - network_credit
    - network_debit_adjustment
    kind: authorization
    condition: For source_subtype correction, the source charge has an approved review with decision incorrect.
      This gate is inapplicable to other source_subtype values.
    evidence_fields:
    - network_events.network_event_id
    - network_events.source_event_id
    - network_events.related_event_id
    - network_events.status
    - network_events.decision
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - network_events.network_event_id
        - network_events.source_event_id
        - network_events.related_event_id
      action_bindings:
        network_events.network_event_id: network_event_id
        network_events.source_event_id: source_event_id
        network_events.related_event_id: related_event_id
  params:
    per_tier:
      Northbridge Enterprise Connectivity 100 Mbps:
        amount_precision: =amount_precision
        rounding_mode: =rounding_mode
      Northbridge Enterprise Connectivity 250 Mbps:
        amount_precision: =amount_precision
        rounding_mode: =rounding_mode
      Northbridge Enterprise Connectivity 500 Mbps:
        amount_precision: =amount_precision
        rounding_mode: =rounding_mode
      Northbridge Enterprise Connectivity 1 Gbps:
        amount_precision: =amount_precision
        rounding_mode: =rounding_mode
      Northbridge Enterprise Connectivity 2 Gbps:
        amount_precision: =amount_precision
        rounding_mode: =rounding_mode
      Northbridge Enterprise Connectivity 5 Gbps:
        amount_precision: =amount_precision
        rounding_mode: =rounding_mode
  measures:
  - network_msr_source_credits
  formula:
    corrected_gross: net_amount + tax_amount
- id: network_evt_service_credit
  subject:
  - network_request
  - network_review
  - network_credit
  rule: For a service_credit financial posting, an approved review has decision eligible and positive credited_amount
    for the exact source charge; this gate does not constrain filing or reviewing the request. For a service_credit
    request being filed, the outage claim is filed no later than credit_claim_days after the official incident closes.
    For a newly filed claim, frozen handling time is its notice_at; the request is recorded immediately. Later review
    and credit use that recorded notice_at to evaluate the same boundary, so a timely request does not expire while
    awaiting review. Add credit_claim_days UTC calendar dates to incident_closed_at, preserving its time of day;
    calendar dates are counted without substituting business days or elapsed-hour periods. Equality at the deadline
    qualifies; a later claim is rejected without a credit. The provider incident must be completed, with cause outside
    outage_exclusions. Availability at or above sla_target_percent gives no credit. Below the target choose the
    first descending sla_credit_bands entry whose minimum is no greater than the recorded availability_percent.
    Multiply the original source charge net_amount by that fraction; subtract the service_credit_net component of
    prior credits for that exact source, and cap total service credits at credit_cap_fraction of that original net
    amount. Floor the additional credit at zero and round with amount_precision and rounding_mode. Apply the original
    tax component proportionately. A review writes its nonnegative approved result; a financial credit writes the
    negative approved amount only after that approved review exists. This service-credit branch applies only to
    source_subtype service_credit; evt_correction applies only to source_subtype correction. Excluded incidents,
    ineligible reviews and zero remaining entitlement result in no financial write. A request for consequential-loss
    compensation is not covered. A service-credit financial posting requires an approved review with decision eligible
    and positive credited_amount; the request and incident alone cannot authorize the financial posting.
  eligibility:
  - id: claim_deadline
    applies_to:
    - network_request
    kind: time
    condition: For a service_credit request being filed, the outage claim is filed no later than credit_claim_days
      after the official incident closes.
    evidence_fields:
    - network_events.network_event_id
    - network_events.incident_closed_at
    - network_events.notice_at
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - network_events.network_event_id
      action_bindings:
        network_events.network_event_id: network_event_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the official incident closes
      anchor_source: network_events.incident_closed_at
      relation: not_after
      duration_source: variants.credit_claim_days
      unit: calendar_days
      counting_rule: Add credit_claim_days UTC calendar dates to incident_closed_at, preserving its time of day;
        calendar dates are counted without substituting business days or elapsed-hour periods.
      boundary: inclusive
  - id: approved_service_credit
    applies_to:
    - network_credit
    kind: authorization
    condition: For a service_credit financial posting, an approved review has decision eligible and positive credited_amount
      for the exact source charge; this gate does not constrain filing or reviewing the request.
    evidence_fields:
    - network_events.network_event_id
    - network_events.source_event_id
    - network_events.status
    - network_events.decision
    - network_events.credited_amount
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - network_events.source_event_id
      action_bindings:
        network_events.source_event_id: source_event_id
  params:
    per_tier:
      Northbridge Enterprise Connectivity 100 Mbps:
        credit_claim_days: =credit_claim_days
        outage_exclusions: =outage_exclusions
        sla_target_percent: =sla_target_percent
        sla_credit_bands: =sla_credit_bands
        credit_cap_fraction: =credit_cap_fraction
        amount_precision: =amount_precision
        rounding_mode: =rounding_mode
      Northbridge Enterprise Connectivity 250 Mbps:
        credit_claim_days: =credit_claim_days
        outage_exclusions: =outage_exclusions
        sla_target_percent: =sla_target_percent
        sla_credit_bands: =sla_credit_bands
        credit_cap_fraction: =credit_cap_fraction
        amount_precision: =amount_precision
        rounding_mode: =rounding_mode
      Northbridge Enterprise Connectivity 500 Mbps:
        credit_claim_days: =credit_claim_days
        outage_exclusions: =outage_exclusions
        sla_target_percent: =sla_target_percent
        sla_credit_bands: =sla_credit_bands
        credit_cap_fraction: =credit_cap_fraction
        amount_precision: =amount_precision
        rounding_mode: =rounding_mode
      Northbridge Enterprise Connectivity 1 Gbps:
        credit_claim_days: =credit_claim_days
        outage_exclusions: =outage_exclusions
        sla_target_percent: =sla_target_percent
        sla_credit_bands: =sla_credit_bands
        credit_cap_fraction: =credit_cap_fraction
        amount_precision: =amount_precision
        rounding_mode: =rounding_mode
      Northbridge Enterprise Connectivity 2 Gbps:
        credit_claim_days: =credit_claim_days
        outage_exclusions: =outage_exclusions
        sla_target_percent: =sla_target_percent
        sla_credit_bands: =sla_credit_bands
        credit_cap_fraction: =credit_cap_fraction
        amount_precision: =amount_precision
        rounding_mode: =rounding_mode
      Northbridge Enterprise Connectivity 5 Gbps:
        credit_claim_days: =credit_claim_days
        outage_exclusions: =outage_exclusions
        sla_target_percent: =sla_target_percent
        sla_credit_bands: =sla_credit_bands
        credit_cap_fraction: =credit_cap_fraction
        amount_precision: =amount_precision
        rounding_mode: =rounding_mode
  measures:
  - network_msr_source_credits
  formula:
    service_credit_ceiling: net_amount * credit_cap_fraction
- id: network_evt_incident
  subject:
