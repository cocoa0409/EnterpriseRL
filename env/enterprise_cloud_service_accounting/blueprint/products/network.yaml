- id: network_evt_category_meters
  subject:
  - network_charge
  - network_supplemental_meter
  - network_service_record
  rule: The selected contract provides committed_mbps line capacity; exceeding it requires a signed capacity amendment,
    while data transfer billing remains based on actual measured GB. Primary meter internet_egress uses unit_rate
    after included_transfer_gb for the same holding and calendar month. port_hours use port_hour_rate; cross_zone,
    cross_region, private_egress and ingress use same_region_rate, cross_region_rate, private_transfer_rate and
    ingress_rate respectively. A transfer has exactly one destination class, so those destination rates never add
    together. nat_gb uses nat_processing_rate and nat_hours uses nat_hour_rate as distinct processing and provisioning
    components. public_ipv4 uses public_ipv4_rate per allocated address-hour, including unused allocated addresses.
    connection_setup uses connection_setup_fee per completed new physical connection; a reprovisioned existing connection
    is not a new setup. loadbalancer uses loadbalancer_rate per capacity-unit-hour. No Network transfer is invoiced
    if its export assigns billing ownership to another product; the assigned product exclusively invoices it. Free
    ingress stays visible in the meter history without a financial charge. For every ancillary meter, multiply the
    nonincluded measured quantity by its selected rate, then round the net line using amount_precision and rounding_mode
    and tax under evt_tax. An allowance is consumed chronologically by interval_start then source_event_id within
    the named holding and UTC period; reversal of its source returns only that source allocation. Source subtype
    supplemental identifies these amounts so the primary discount policy does not apply. Completed service records
    prove nonfinancial entitlements; unknown meter codes or units are POLICY_NOT_COVERED instead of guessed prices.
    These calculations never authorize an unapproved customer-only action. For included capacities denominated in
    GB-month, contact-month or package-month, prorate the capacity by actual active interval seconds divided by
    actual seconds in its UTC month before comparing measured quantity. Category-specific primary inclusions replace
    the generic included_quantity where expressly named; they are not added twice. A mandatory minimum fee is a
    pricing minimum, not a second charge.
