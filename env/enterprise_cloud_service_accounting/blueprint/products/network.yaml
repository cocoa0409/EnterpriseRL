- id: network_evt_collection
  subject:
  - network_payment
  rule: The bank record confirms the remittance as completed. Record only a bank-confirmed remittance using a payment_methods
    rail and the amount actually received in currency. Customer consent to dispose of funds belongs to the customer;
    the agent only allocates a payment already confirmed by the bank. Apply an explicitly referenced invoice first;
    if the remittance omits allocation, use collection_order, sorting invoice_issued_at then source_event_id within
    the same customer and billing entity. Split across exact source invoice lines, never across legal billing entities.
    Each allocation is a separate negative payment amount linked to its original charge; any residual is an unallocated
    overpayment linked to the remittance reference. A repeated remittance reference and allocation target returns
    the existing posting. No receipt is inferred from a customer promise, and rejected or pending payments make
    no posting.
  eligibility:
  - id: confirmed_payment
    applies_to:
    - network_payment
    kind: authorization
    condition: The bank record confirms the remittance as completed.
    evidence_fields:
    - network_events.network_event_id
    - network_events.status
    - network_events.external_reference
    - network_events.method
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - network_events.network_event_id
      action_bindings:
        network_events.network_event_id: network_event_id
  params:
    per_tier:
      Northbridge Enterprise Connectivity 100 Mbps:
        payment_methods: =payment_methods
        currency: =currency
        collection_order: =collection_order
      Northbridge Enterprise Connectivity 250 Mbps:
        payment_methods: =payment_methods
        currency: =currency
        collection_order: =collection_order
      Northbridge Enterprise Connectivity 500 Mbps:
        payment_methods: =payment_methods
        currency: =currency
        collection_order: =collection_order
      Northbridge Enterprise Connectivity 1 Gbps:
        payment_methods: =payment_methods
        currency: =currency
        collection_order: =collection_order
      Northbridge Enterprise Connectivity 2 Gbps:
        payment_methods: =payment_methods
        currency: =currency
        collection_order: =collection_order
      Northbridge Enterprise Connectivity 5 Gbps:
        payment_methods: =payment_methods
        currency: =currency
        collection_order: =collection_order
  measures:
  - network_msr_net_receivable
- id: network_evt_return
  subject:
  - network_payment_return
  rule: The completed bank return notice refers to the exact original posted payment. The bank return must identify
    the exact posted payment. Restore the returned principal as a positive amount, up to the original payment amount
    not already returned. Copy its method, customer, billing entity and currency. A partial return uses the distinct
    bank notice external_reference. A duplicate bank notice produces no new write. Any failed_payment_fee is a separately
    identifiable return-fee charge under evt_fees, never hidden in returned principal; a waived fee produces no
    fee posting.
  eligibility:
  - id: bank_return
    applies_to:
    - network_payment_return
    kind: authorization
    condition: The completed bank return notice refers to the exact original posted payment.
    evidence_fields:
    - network_events.network_event_id
    - network_events.source_event_id
    - network_events.status
    - network_events.external_reference
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - network_events.network_event_id
        - network_events.source_event_id
      action_bindings:
        network_events.network_event_id: network_event_id
        network_events.source_event_id: source_event_id
  params:
    per_tier:
      Northbridge Enterprise Connectivity 100 Mbps:
        failed_payment_fee: =failed_payment_fee
      Northbridge Enterprise Connectivity 250 Mbps:
        failed_payment_fee: =failed_payment_fee
      Northbridge Enterprise Connectivity 500 Mbps:
        failed_payment_fee: =failed_payment_fee
      Northbridge Enterprise Connectivity 1 Gbps:
        failed_payment_fee: =failed_payment_fee
      Northbridge Enterprise Connectivity 2 Gbps:
        failed_payment_fee: =failed_payment_fee
      Northbridge Enterprise Connectivity 5 Gbps:
        failed_payment_fee: =failed_payment_fee
  formula:
    returned_principal: abs(amount)
- id: network_evt_refund
  subject:
  - network_refund
  rule: The customer-authorized refund request and completed original payment refer to the same holding and source
    payment. The customer files an exact refund authorization; the agent refunds a confirmed overpayment only to
    the method and destination of its original payment. Available refund is the smaller of the negative net receivable
    magnitude and original payment principal less prior returns and refunds linked to that payment. A requested
    amount exceeding that limit is refused, not silently reduced. Use refund_methods, require at least refund_minimum,
    and record a positive receivable delta for cash paid out. A smaller positive balance remains on account. Refunds
    require no active service contract and remain possible after closure. Repetition of the same request and source
    payment returns the existing refund. A third-party destination or unconfirmed payment is refused.
  eligibility:
  - id: refund_consent
    applies_to:
    - network_refund
    kind: authorization
    condition: The customer-authorized refund request and completed original payment refer to the same holding and
      source payment.
    evidence_fields:
    - network_events.network_event_id
    - network_events.request_id
    - network_events.source_event_id
    - network_events.status
    - network_events.network_holding_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - network_events.network_event_id
        - network_events.request_id
        - network_events.source_event_id
        - network_events.network_holding_id
      action_bindings:
        network_events.network_event_id: network_event_id
        network_events.request_id: request_id
        network_events.source_event_id: source_event_id
        network_events.network_holding_id: network_holding_id
  params:
    per_tier:
      Northbridge Enterprise Connectivity 100 Mbps:
        refund_methods: =refund_methods
        refund_minimum: =refund_minimum
        amount_precision: =amount_precision
        rounding_mode: =rounding_mode
      Northbridge Enterprise Connectivity 250 Mbps:
        refund_methods: =refund_methods
        refund_minimum: =refund_minimum
        amount_precision: =amount_precision
        rounding_mode: =rounding_mode
      Northbridge Enterprise Connectivity 500 Mbps:
        refund_methods: =refund_methods
        refund_minimum: =refund_minimum
        amount_precision: =amount_precision
        rounding_mode: =rounding_mode
      Northbridge Enterprise Connectivity 1 Gbps:
        refund_methods: =refund_methods
        refund_minimum: =refund_minimum
        amount_precision: =amount_precision
        rounding_mode: =rounding_mode
      Northbridge Enterprise Connectivity 2 Gbps:
        refund_methods: =refund_methods
        refund_minimum: =refund_minimum
        amount_precision: =amount_precision
        rounding_mode: =rounding_mode
      Northbridge Enterprise Connectivity 5 Gbps:
        refund_methods: =refund_methods
        refund_minimum: =refund_minimum
        amount_precision: =amount_precision
        rounding_mode: =rounding_mode
  measures:
  - network_msr_net_receivable
  formula:
    maximum_balance_refund: max(0, -network_msr_net_receivable)
- id: network_suspension
  subject:
  - network_suspend
  rule: The contract status is active. Collection suspension occurs no earlier than invoice_due_days plus suspension_grace_days
    after the source invoice is issued. The contract payment_status is restricted and the source invoice retains
    unpaid principal. Add invoice_due_days and then suspension_grace_days UTC calendar dates to invoice_issued_at,
    preserving its time of day; do not use business days or replace the anchor with contract activation. Equality
    qualifies. The source overdue invoice must retain a positive unpaid principal; a fully paid invoice cannot justify
    suspension. Earlier handling sends an informational explanation without a status change. An agent suspends active
    service only when official payment_status is restricted; ordinary billing disputes alone do not suspend service.
    Retained ancillary resources can still produce actual supplemental usage. Repeated handling of an already suspended
    contract makes no new transition.
  eligibility:
  - id: contract_state
    applies_to:
    - network_suspend
    kind: state
    condition: The contract status is active.
    evidence_fields:
    - network_holdings.network_holding_id
    - network_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - network_holdings.network_holding_id
      action_bindings:
        network_holdings.network_holding_id: network_holding_id
    state_contract:
      field: network_holdings.status
      allowed:
      - active
  - id: collection_deadline
    applies_to:
    - network_suspend
    kind: time
    condition: Collection suspension occurs no earlier than invoice_due_days plus suspension_grace_days after the
      source invoice is issued.
    evidence_fields:
    - network_events.network_event_id
    - network_events.invoice_issued_at
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - network_events.network_event_id
      action_bindings:
        network_events.network_event_id: network_event_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the source invoice is issued
      anchor_source: network_events.invoice_issued_at
      relation: not_before
      duration_source: params.total_collection_days
      unit: calendar_days
      counting_rule: Add invoice_due_days and then suspension_grace_days UTC calendar dates to invoice_issued_at,
        preserving its time of day; do not use business days or replace the anchor with contract activation.
      boundary: inclusive
  - id: collection_restriction
    applies_to:
    - network_suspend
    kind: authorization
    condition: The contract payment_status is restricted and the source invoice retains unpaid principal.
    evidence_fields:
    - network_holdings.network_holding_id
    - network_holdings.payment_status
    - network_events.network_event_id
    - network_events.amount
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - network_holdings.network_holding_id
        - network_events.network_event_id
      action_bindings:
        network_holdings.network_holding_id: network_holding_id
        network_events.network_event_id: network_event_id
  params:
    per_tier:
      Northbridge Enterprise Connectivity 100 Mbps:
        invoice_due_days: =invoice_due_days
        suspension_grace_days: =suspension_grace_days
      Northbridge Enterprise Connectivity 250 Mbps:
        invoice_due_days: =invoice_due_days
        suspension_grace_days: =suspension_grace_days
      Northbridge Enterprise Connectivity 500 Mbps:
        invoice_due_days: =invoice_due_days
        suspension_grace_days: =suspension_grace_days
      Northbridge Enterprise Connectivity 1 Gbps:
        invoice_due_days: =invoice_due_days
        suspension_grace_days: =suspension_grace_days
      Northbridge Enterprise Connectivity 2 Gbps:
        invoice_due_days: =invoice_due_days
        suspension_grace_days: =suspension_grace_days
      Northbridge Enterprise Connectivity 5 Gbps:
        invoice_due_days: =invoice_due_days
        suspension_grace_days: =suspension_grace_days
    total_collection_days: The sum of variants.invoice_due_days and variants.suspension_grace_days.
- id: network_resumption
  subject:
  - network_resume
  rule: The contract status is suspended. The contract payment_status is clear. Restore a suspended holding after
    its official payment restriction clears; no customer promise substitutes for recorded clearance. Set status
    active. Bill resumption_fee under evt_fees only when positive, and preserve retained-resource history. A contract
    already active needs no write; a closed contract requires a new signed application and cannot be resumed.
  eligibility:
  - id: contract_state
    applies_to:
    - network_resume
    kind: state
    condition: The contract status is suspended.
