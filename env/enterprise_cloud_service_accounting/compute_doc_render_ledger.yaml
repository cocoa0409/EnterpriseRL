  section: Formal basis
  text: Virtual Compute — The signed resource scope is not already represented by
    a nonclosed contract. Multiple independent resource scopes may be held. Use external
    reference as the signed resource-scope key. Count all nonclosed holdings of this
    category for the same customer; refuse creation if the count would exceed maximum
    nonclosed contracts per customer. A repeated signed application with the same
    external resource scope reuses the existing contract rather than opening another.
  type: canonical
  source_locators: *id001
  hypothetical_inputs: null
  derivation: null
