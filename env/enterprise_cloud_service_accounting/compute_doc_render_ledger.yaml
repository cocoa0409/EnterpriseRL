- target_doc: base_evt_fees_5452c728.json
  section: Formal basis
  text: Virtual Compute — This fee branch applies only to setup, resumption, termination
    and return fee source subtype. Charge setup fee once for an activated holding,
    resumption fee per distinct completed restoration, termination fee for on-demand
    exit, and failed payment fee per completed bank return. An unexpired commitment
    exit instead bills the recorded remaining signed commitment liability in USD as
    its termination liability. Copy the exact source transition, customer authorization
    or bank notice reference; do not use a primary meter as fee evidence. A zero fee
    is waived without a financial event. The fee amount is the selected policy amount
    or recorded signed liability, rounded using monetary decimal precision and rounding
    convention, then taxed under the applicable tax treatment. The primary-usage branch
    of primary usage pricing and its posted meter gate apply only to source subtype
    primary; supplemental charges use the category meter policy. Already billed source
    occurrence and fee subtype make repetition read-only.
  type: canonical
  source_locators: *id052
