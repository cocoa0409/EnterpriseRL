- target_doc: base_exit_f0ff9727.json
  section: Formal basis
  text: Virtual Compute — The customer has filed the exact resource-disposal authorization
    for this contract. Only the customer may withdraw an application or terminate
    their provisioned resources. An applied contract can be withdrawn without any
    setup, usage or termination charge. For active or suspended contracts, record
    closure date from the frozen clock and stop running primary meters at the exact
    customer-confirmed close time. Accrued usage and actual retained-resource charges
    remain payable; closing never erases receivables or credits. termination fee applies
    to an on-demand exit under the lifecycle fee basis. If a signed commitment remains
    unexpired and permission to forgive an unexpired commitment on cancellation is
    false, invoice its recorded remaining signed commitment liability in USD as a
    distinct termination component, without also charging future usage against that
    same liability. No new usage begins after closure; existing financial corrections,
    collection and refunds remain possible. Repeating the same closed-resource confirmation
    has no further effect. Before closing, the signed termination schedule supplies
    remaining signed commitment liability in USD and is zero when no unbilled commitment
    liability remains. A positive recorded liability necessarily triggers the distinct
    termination charge using the disposal request as its original source reference;
    closure and that one invoice entry complete the event chain.
  type: canonical
  source_locators: *id050
