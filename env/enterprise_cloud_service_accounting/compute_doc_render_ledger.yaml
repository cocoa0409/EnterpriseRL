  section: Formal basis
  text: Virtual Compute — The contract status is active. Collection suspension occurs
    no earlier than invoice maturity period plus collection suspension grace period
    after the source invoice is issued. The contract payment restriction status is
    restricted and the source invoice retains unpaid principal. Add invoice maturity
    period and then collection suspension grace period UTC calendar dates to invoice
    issue time, preserving its time of day; do not use business days or replace the
    anchor with contract activation. Equality qualifies. The source overdue invoice
    must retain a positive unpaid principal; a fully paid invoice cannot justify suspension.
    Earlier handling sends an informational explanation without a status change. An
    agent suspends active service only when official payment restriction status is
    restricted; ordinary billing disputes alone do not suspend service. Retained ancillary
    resources can still produce actual supplemental usage. Repeated handling of an
    already suspended contract makes no new transition.
