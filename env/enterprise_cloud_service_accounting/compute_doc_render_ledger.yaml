- target_doc: base_evt_service_credit_1b35d21b.json
  section: Formal basis
  text: Virtual Compute — For a service credit financial posting, an approved review
    has decision eligible and positive approved credit amount for the exact source
    charge; this gate does not constrain filing or reviewing the request. For a service
    credit request being filed, the outage claim is filed no later than outage claim
    filing period after the official incident closes. For a newly filed claim, frozen
    handling time is its request notice time; the request is recorded immediately.
    Later review and credit use that recorded request notice time to evaluate the
    same boundary, so a timely request does not expire while awaiting review. Add
    outage claim filing period UTC calendar dates to official incident closing time,
    preserving its time of day; calendar dates are counted without substituting business
    days or elapsed-hour periods. Equality at the deadline qualifies; a later claim
    is rejected without a credit. The provider incident must be completed, with cause
    outside outage exclusions. Availability at or above SLA target percent gives no
    credit. Below the target choose the first descending SLA credit bands entry whose
    minimum is no greater than the recorded availability percent. Multiply the original
    source charge pretax net amount by that fraction; subtract the pretax service-credit
    total component of prior credits for that exact source, and cap total service
    credits at cumulative outage credit cap fraction of that original net amount.
    Floor the additional credit at zero and round with monetary decimal precision
    and rounding convention. Apply the original tax component proportionately. A review
    writes its nonnegative approved result; a financial credit writes the negative
    approved amount only after that approved review exists. This service-credit branch
    applies only to source subtype service credit; the invoice correction basis applies
    only to source subtype correction. Excluded incidents, ineligible reviews and
    zero remaining entitlement result in no financial write. A request for consequential-loss
    compensation is not covered. A service-credit financial posting requires an approved
    review with decision eligible and positive approved credit amount; the request
    and incident alone cannot authorize the financial posting.
  type: canonical
  source_locators: *id030
  hypothetical_inputs: null
  derivation: null
