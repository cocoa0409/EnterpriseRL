- target_doc: assisted_review_conditions_b0026e1e.json
  section: Scope and evidence
  text: 'Virtual Compute assisted review scope. This assisted primary correction review
    applies to a fully paid most recent primary line whose completed export and contracted
    terms are available synchronously; no missing external evidence can be manufactured.
    The selected holding has no tier change or commitment-boundary crossing within
    the source interval and no other primary holding in this billing entity during
    the target period. Record one approved incorrect review with pretax net amount
    equal to the revised net target; tax follows the original approved tax basis.
    Existing review of this exact request and source is read-only. This assisted export
    scope requires integral instance-hour source quantities, including any reversal
    quantities. Within the assisted primary correction package, the same-entity active
    support combination determines the successive pricing adjustment and settlement
    concession described here in addition to request-channel eligibility; approval
    authority remains unchanged. A promotional primary-price entitlement remains suppressed
    wherever commitment pricing covers the same quantity; the two explicitly described
    same-entity support reductions are permitted successive adjustments, and no other
    cross-category benefit is stacked. This assisted primary review does not handle
    partially covered source quantities: for a commitment with a term other than none,
    the recorded committed quantity remaining after earlier posted source allocations
    in the same holding and service period must cover the entire net quantity of the
    selected source, and the recorded commitment boundaries must contain its entire
    source interval. For the primary review action, evidence event reference identifies
    the unique completed review-subtype service-record packet whose original source
    reference is the original primary charge and whose related evidence reference
    is its exact provider export; the raw export itself does not occupy this packet
    role.'
  type: canonical
  source_locators: *id058
  hypothetical_inputs: null
  derivation: null
