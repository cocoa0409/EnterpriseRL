- target_doc: refund_assessment_conditions_7c60532c.json
  section: Scope and evidence
  text: Virtual Compute refund assessment scope. This assessment applies to an existing
    customer-filed maximum-permitted refund request for the exact original payment,
    in status pending and decision none. The accountant verifies the request, original
    posted payment, exact allocated charge and completed correction, and synchronously
    records an approved eligibility review without moving funds or approving the customer
    signature. A positive assessment records decision eligible and assessed refund
    amount equal to the permitted refund amount; an unavailable or below-minimum amount
    permits no positive assessment. The filed request remains pending; its customer
    consent was established when it was filed. For this assessment action, evidence
    event reference and customer request reference identify that exact filed request,
    original source reference identifies its original posted payment, related evidence
    reference identifies the original primary charge paid by that payment, and posted
    correction reference identifies the exact preceding assisted credit for that charge.
    The created review retains customer request reference, the original payment as
    original source reference and the posted correction as related evidence reference.
    The selected payment has exactly one pending customer refund request in this package;
    the existing request names that original payment and its paid primary charge.
    An existing approved eligible assessment for that payment is read-only, including
    when the same request is repeated; this package creates no second eligible assessment
    for the payment. This immediate ACH package requires the original posted payment
    method to be ach; the original destination is represented by that exact payment
    reference.
  type: canonical
  source_locators: *id082
  hypothetical_inputs: null
  derivation: null
