- target_doc: base_evt_pricing_3e8861f3.json
  section: Formal basis
  text: 'Virtual Compute — This policy and its gate apply only to primary usage source
    subtype; category-specific primary pricing overrides expressly stated in category-specific
    metering rules take priority. For source subtype primary, the source meter is
    posted and identifies the billed resource interval. This gate is inapplicable
    to other source subtype values. Use the tier recorded for each source service
    interval. Read standard unit rate and regional rate multiplier for primary usage.
    Allocate included primary quantity across primary meter sources of the same holding
    and period in service interval start then original source reference order; prorate
    it by actual active UTC seconds divided by actual seconds in that UTC calendar
    month. Only the positive quantity beyond the remaining included allowance is charged.
    Allocate committed quantity in that same order, splitting covered and uncovered
    primary quantities into distinguishable invoice lines. The holding commitment
    must cover the entire source interval to receive commitment discount fraction;
    a boundary-crossing interval is split at the recorded commitment boundary. For
    every quantity component choose the first applicable item in primary price selection
    priority: an approved negotiated rate when permission for an approved negotiated
    rate, then the committed fraction, then a recorded eligible promotion from eligible
    campaign channels, then portfolio eligibility, then standard. Promotions and reservations
    are mutually exclusive. Round the final service subtotal using monetary decimal
    precision and rounding convention after quantity multiplication, then apply the
    applicable tax treatment. Record pricing component for each split quantity branch;
    it is part of the invoice-line identity. Do not apply a billing-period portfolio
    discount to a partial source interval before the full source period is closed.'
  type: canonical
  source_locators: *id017
