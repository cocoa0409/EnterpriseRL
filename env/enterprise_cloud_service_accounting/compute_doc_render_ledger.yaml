- target_doc: base_evt_category_meters_cb3b52e4.json
  section: Formal basis
  text: Virtual Compute — The primary instance package has virtual core count virtual
    cores, memory in GiB memory and included boot storage in GB included boot storage.
    Standard Linux primary usage uses the ordinary primary price. For dedicated configuration
    multiply the undiscounted primary rate by dedicated tenancy multiplier before
    the normal discount priority. For spot configuration use spot discount fraction
    instead of every commitment, promotion and portfolio discount; spot is mutually
    exclusive with a reservation and approved negotiated pricing. Meter code boot
    storage bills only provisioned GB-month above included boot storage in GB at boot
    disk rate. windows license bills actual vCPU-hours at windows license rate and
    linux license at linux license rate, independently of compute discounts. image
    export bills processed GB at image export rate. internet egress bills actual monthly
    GB beyond included monthly internet transfer in GB at egress rate. Resource count,
    measured duration and the selected tier virtual core count determine licensed
    vCPU-hours; changing capacity splits intervals. A zero-rate license or included
    transfer creates no charge. The separate Network contract never rebills transfer
    already marked as compute-managed on its source resource export. An allowance
    is consumed chronologically by service interval start then original source reference
    within the named holding and UTC period; reversal of its source returns only that
    source allocation. Source subtype supplemental identifies these amounts so the
    primary discount policy does not apply. Completed service records prove nonfinancial
    entitlements; unknown meter codes or units are outside policy coverage instead
    of guessed prices. These calculations never authorize an unapproved customer-only
    action. For included capacities denominated in GB-month, contact-month or package-month,
    prorate the capacity by actual active interval seconds divided by actual seconds
    in its UTC month before comparing measured quantity. Category-specific primary
    inclusions replace the generic included primary quantity where expressly named;
    they are not added twice. A mandatory minimum fee is a pricing minimum, not a
    second charge.
  type: canonical
  source_locators: *id053
  hypothetical_inputs: null
  derivation: null
