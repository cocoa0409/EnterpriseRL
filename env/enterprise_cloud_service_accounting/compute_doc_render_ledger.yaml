- target_doc: base_admission_1227b76b.json
  section: Formal basis
  text: Virtual Compute — The signed application request has an approved service review.
    The customer signs and submits the application through an authorized request channels
    channel. Create status applied and application opening date from the frozen clock,
    with no consumption or charge. The requested tier supplies maximum resource count;
    reject unsupported regions, unsupported currency, resource counts above that limit,
    and unapproved contract terms without a write. The customer owns the signature;
    an agent cannot sign for them. Entry gates are evaluated against the authoritative
    signed application fields copied into the proposed holding.
  type: canonical
  source_locators: *id003
  hypothetical_inputs: null
  derivation: null
