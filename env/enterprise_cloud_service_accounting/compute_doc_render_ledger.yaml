- target_doc: immediate_refund_conditions_e8d3d17a.json
  section: Scope and evidence
  text: Virtual Compute immediate refund scope. This scope uses an existing customer-filed
    maximum-permitted refund request on the exact original posted payment. Its pending
    processing status and decision none preserve sufficient customer consent; the
    separate accountant assessment determines the executable financial ceiling and
    does not approve the customer signature. The customer personally executes the
    final refund, to the original payment rail and destination, after the agent has
    shown the permitted amount and handed over the refund tool. The agent may assess
    eligibility and prepare that handoff but cannot execute the customer disposal.
    This scope ends after one permitted immediate payout and retains any surplus on
    account without further payout. For the refund action, evidence event reference
    and customer request reference both identify the original customer-filed request;
    original source reference identifies the exact original posted payment; related
    evidence reference identifies its approved eligible refund assessment. This immediate
    ACH package requires the original posted payment method to be ach; the original
    destination is represented by that exact payment reference.
  type: canonical
  source_locators: *id066
  hypothetical_inputs: null
  derivation: null
