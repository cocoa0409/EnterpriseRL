    an authorization, claim or disposal request.
  source_locator: *id112
- target_doc: doc_storage_base_evt_meter_d506e165
  type: canonical
  section: Formal basis
  text: 'Object Storage meter is governed by the following clauses.


    The authoritative export confirms the resource interval and the measured quantity.
    Meters originate in the provider resource export. Primary meter quantities use
    usage unit; a meter is positive and a meter reversal is the negative of the exact
    erroneous source quantity, capped by the source quantity not already reversed.
    Keep original interval, region, configuration and source reference. billing actual
    usage overage permits measured quantities above included monthly primary quantity;
    no service entitlement is invented by a meter write. Round measured quantities
    to the tier meter quantity precision using the tier rounding convention, apply
    minimum quantity and round positive billable primary quantities upward to a whole
    meter quantum. Stopped or suspended service accrues no primary running usage,
    but real retained storage and other supplemental services remain billable through
    supplemental meter. A rejected or cancelled source is not a billable meter. Repeated
    exports with the same resource, meter, interval and correction reference are read-only
    confirmations.


    For export evidence, the pre-action authority is the system record, using storage
    business event reference, external business reference, service interval start,
    service interval end, quantity. The evidence must correlate storage business event
    reference for the proposed action. The authoritative export confirms the resource
    interval and the measured quantity.'
  source_locator: *id113
- target_doc: doc_storage_base_evt_meter_d506e165
  type: equivalent
  section: Basis Q&A
  text: What is the applicable opening condition? The authoritative export confirms
    the resource interval and the measured quantity.
  source_locator: *id113
- target_doc: doc_storage_base_agg_usage_68172266
  type: canonical
  section: Formal basis
  text: 'Object Storage usage is governed by the following clauses.


    Use pre-discount portfolio primary usage subtotal to select the portfolio discount.
    Combine only holdings of this category owned by the same customer with the same
    legal billing entity and source period, even if some have since closed. No cross-entity
    or cross-category spending counts. The threshold comparison is inclusive. Portfolio
    discount applies only to primary service usage and only if no higher-priority
    price applies; it is neither a cash credit nor a deduction from ancillary service
    fees.


    The source period, a UTC calendar month; customer and legal billing entity match
    the proposed charge. Sum posted primary meter quantities net of meter reversal
    by holding, multiply each interval by its applicable standard tier standard primary
    unit rate and region factor without any discount or tax, and sum across this category.
    Exclude ancillary meters and never sum already discounted invoices.'
  source_locator: *id114
- target_doc: doc_storage_base_agg_usage_68172266
  type: equivalent
  section: Basis Q&A
  text: What is the applicable opening condition? Use pre-discount portfolio primary
    usage subtotal to select the portfolio discount.
  source_locator: *id114
- target_doc: doc_storage_base_evt_pricing_73cfa08c
  type: canonical
  section: Formal basis
  text: 'Object Storage pricing is governed by the following clauses.


    This policy and its gate apply only to primary usage source business subtype;
    category-specific primary pricing overrides expressly stated in category meter
    pricing basis take priority. For source business subtype primary, the source meter
    is posted and identifies the billed resource interval. This gate is inapplicable
    to other source business subtype values. Use the tier recorded for each source
    service interval. Read standard primary unit rate and region factors for primary
    usage. Allocate included monthly primary quantity across primary meter sources
    of the same holding and period in service interval start then original source
    reference order; prorate it by actual active UTC seconds divided by actual seconds
    in that UTC calendar month. Only the positive quantity beyond the remaining included
    allowance is charged. Allocate committed monthly primary quantity in that same
    order, splitting covered and uncovered primary quantities into distinguishable
    invoice lines. The holding commitment must cover the entire source interval to
    receive reservation discounts; a boundary-crossing interval is split at the recorded
    commitment boundary. For every quantity component choose the first applicable
    item in discount priority: an approved negotiated rate when negotiated rate allowed,
    then the committed fraction, then a recorded eligible promotion from promotion
    channels, then portfolio eligibility, then standard. The negotiated rate replaces
    the primary standard primary unit rate before applying the region factor and receives
    no further discount. Promotions and reservations are mutually exclusive. Round
    the final service subtotal using the tier monetary precision and the tier rounding
    convention after quantity multiplication, then apply tax calculation basis. No
    discount applies to taxes, license fees, standalone supplemental services or previously
    issued credits. Record effective price branch for each split quantity branch;
    it is part of the invoice-line identity. Do not apply a billing-period portfolio
    discount to a partial source interval before the full source period is closed.


    For posted primary source meter, the pre-action authority is the system record,
    using storage business event reference, status, service interval start, service
    interval end. The evidence must correlate storage business event reference for
    the proposed action. For source business subtype primary, the source meter is
    posted and identifies the billed resource interval. This gate is inapplicable
    to other source business subtype values.'
  source_locator: *id115
- target_doc: doc_storage_base_evt_pricing_73cfa08c
  type: equivalent
  section: Basis Q&A
  text: What is the applicable opening condition? This policy and its gate apply only
    to primary usage source business subtype; category-specific primary pricing overrides
    expressly stated in category meter pricing basis take priority.
  source_locator: *id115
