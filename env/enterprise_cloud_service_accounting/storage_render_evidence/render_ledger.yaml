- target_doc: doc_storage_outage_authorize_scope_143c85b9
  type: canonical
  section: Formal basis
  text: 'Object Storage outage authorize has the following application boundary. This
    procedure applies to original invoices with an approved US untaxed or verified
    exempt tax treatment; original tax remains zero. Non-provider causes, zero entitlement
    and at-or-above-target availability do not create a concession. The latest completed
    incident is the only incident adjudicated in this request; prior concessions for
    it remain in the source ledger. The source payment must be completed and its method
    and destination must be preserved. No money is inferred from a promise. No other
    outstanding invoice, allocation or tax change is covered by this concession refund
    procedure. For the outage-concession and its original-payment refund procedure,
    a same-customer same-billing-entity active support contract additionally changes
    the service-credit amount through its numeric portfolio discount fraction; it
    does not change approval authority or any primary usage price. For the immediate
    outage-concession claim and its exact refund authorization, filing records status
    posted and sets both notice filing time and recorded occurrence time to the current
    handling clock; posted means customer intent has been submitted, not that a system
    approval or financial entry has occurred. Cancellation remains a new request event
    with status cancelled linked to the original request. For the refund authorization
    action, copy both storage business event reference and customer request reference
    from the storage business event reference of the selected pending refund request
    whose original source reference is the original payment. The action updates that
    refund request itself; an incident or payment identifier is not the authorization
    identifier. Copy original source reference from that refund request, and copy
    supporting evidence reference from the actual receipt of the current posted concession.


    Before authorizing the concession refund, the assessed outage concession must
    be posted.'
  source_locator: *id187
- target_doc: doc_storage_outage_authorize_action_6e5cfe4b
  type: canonical
  section: Formal basis
  text: Object Storage outage authorize is handled on request. The customer authorizes
    one exact storage refund to its recorded original-payment destination. The selected
    refund authorization becomes posted with its consented cash amount and both notice
    and occurrence set to the current filing time; the receipt confirms customer consent
    is recorded without granting a system approval.
  source_locator: *id188
