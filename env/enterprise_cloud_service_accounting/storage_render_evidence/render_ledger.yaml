- target_doc: doc_storage_base_resumption_6cc7ec1e
  type: canonical
  section: Formal basis
  text: 'Object Storage resumption is governed by the following clauses.


    The contract status is suspended. The contract official payment restriction state
    is clear. Restore a suspended holding after its official payment restriction clears;
    no customer promise substitutes for recorded clearance. Set status active. Bill
    resumption fee under lifecycle and bank-return fee basis only when positive, and
    preserve retained-resource history. A contract already active needs no write;
    a closed contract requires a new signed application and cannot be resumed.


    For contract state, the pre-action authority is the system record, using storage
    contract reference, status. The evidence must correlate storage contract reference
    for the proposed action. The contract status is suspended.


    For restriction cleared, the pre-action authority is the system record, using
    storage contract reference, official payment restriction state. The evidence must
    correlate storage contract reference for the proposed action. The contract official
    payment restriction state is clear.'
  source_locator: *id127
- target_doc: doc_storage_base_resumption_6cc7ec1e
  type: equivalent
  section: Basis Q&A
  text: What is the applicable opening condition? The contract status is suspended.
  source_locator: *id127
- target_doc: doc_storage_base_exit_d41af405
  type: canonical
  section: Formal basis
  text: 'Object Storage exit is governed by the following clauses.


    The customer has filed the exact resource-disposal authorization for this contract.
    Only the customer may withdraw an application or terminate their provisioned resources.
    An applied contract can be withdrawn without any setup, usage or termination charge.
    For active or suspended contracts, record closed date from the current handling
    clock and stop running primary meters at the exact customer-confirmed close time.
    Accrued usage and actual retained-resource charges remain payable; closing never
    erases receivables or credits. termination fee applies to an on-demand exit under
    lifecycle and bank-return fee basis. If a signed commitment remains unexpired
    and commitment cancel allowed is false, invoice its recorded remaining commitment
    liability in USD as a distinct termination component, without also charging future
    usage against that same liability. No new usage begins after closure; existing
    financial corrections, collection and refunds remain possible. Repeating the same
    closed-resource confirmation has no further effect. Before closing, the signed
    termination schedule supplies remaining commitment liability in USD and is zero
    when no unbilled commitment liability remains. A positive recorded liability necessarily
    triggers the distinct termination charge using the disposal request as its original
    source reference; closure and that one invoice entry complete the event chain.


    For customer disposal, the pre-action authority is the system record, using storage
    contract reference, customer request reference, original source reference. The
    evidence must correlate storage contract reference together with customer request
    reference together with original source reference for the proposed action. The
    customer has filed the exact resource-disposal authorization for this contract.'
  source_locator: *id128
- target_doc: doc_storage_base_exit_d41af405
  type: equivalent
  section: Basis Q&A
  text: What is the applicable opening condition? The customer has filed the exact
    resource-disposal authorization for this contract.
  source_locator: *id128
- target_doc: doc_storage_base_evt_fees_b0143fd5
  type: canonical
  section: Formal basis
  text: 'Object Storage fees is governed by the following clauses.


    This fee branch applies only to setup, resumption, termination and return fee
    source business subtype. Charge setup fee once for an activated holding, resumption
    fee per distinct completed restoration, termination fee for on-demand exit, and
    failed payment fee per completed bank return. An unexpired commitment exit instead
    bills the recorded remaining commitment liability in USD as its termination liability.
    Copy the exact source transition, customer authorization or bank notice reference;
    do not use a primary meter as fee evidence. A zero fee is waived without a financial
    event. The fee amount is the selected policy amount or recorded signed liability,
    rounded using the tier monetary precision and the tier rounding convention, then
    taxed under tax calculation basis. The primary-usage branch of primary usage pricing
    basis and its posted primary source meter gate apply only to source business subtype
    primary; supplemental charges use the category meter policy. Already billed source
    occurrence and fee subtype make repetition read-only.'
  source_locator: *id129
- target_doc: doc_storage_base_evt_fees_b0143fd5
  type: equivalent
  section: Basis Q&A
  text: What is the applicable opening condition? This fee branch applies only to
    setup, resumption, termination and return fee source business subtype.
  source_locator: *id129
- target_doc: doc_storage_base_evt_category_meters_46bf5183
  type: canonical
  section: Formal basis
  text: 'Object Storage category meters is governed by the following clauses.


    The tier plan capacity gb is a pricing-band reference, not free storage or a hard
    capacity cap. Primary hot-class quantity is actual GB-month at standard primary
    unit rate. cool-class storage and archive-class storage use cool-class storage
    unit rate and archive storage rate. PUT, COPY and LIST requests and GET requests
    use put request rate and get request rate per thousand operations; preserve the
    export quantity unit thousand operations and do not treat it as raw operations.
    cool retrieval, archive retrieval and expedited retrieval use their correspondingly
    named rates per GB; a retrieval has exactly one class and urgency, so these rates
    never stack. replication and Internet egress use replication rate and egress rate
    per GB. For cool-class early deletion or archive-class early deletion, compute
    the positive remaining calendar dates as the corresponding minimum-days parameter
    less authoritative object age in UTC calendar dates, multiply object GB by that
    remainder divided by actual calendar dates in the deletion month, and use the
    corresponding storage rate. Equality with minimum retention incurs no early-deletion
    charge. object age in UTC calendar dates counts UTC date changes from the object
    creation record to the deletion record; retention is attached to each object version,
    not its containing bucket. Replicated and versioned copies are distinct source
    object references and are metered independently. For every ancillary meter, multiply
    the nonincluded measured quantity by its selected rate, then round the net line
    using the tier monetary precision and the tier rounding convention and tax under
    tax calculation basis. An allowance is consumed chronologically by service interval
    start then original source reference within the named holding and UTC period;
    reversal of its source returns only that source allocation. Source subtype supplemental
    identifies these amounts so the primary discount policy does not apply. unknown
    meter codes or units are outside policy coverage instead of guessed prices. These
    calculations never authorize an unapproved customer-only action. For included
