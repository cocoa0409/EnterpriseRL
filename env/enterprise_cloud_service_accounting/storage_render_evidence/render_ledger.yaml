- target_doc: doc_storage_base_evt_invoice_f7c5cd50
  type: canonical
  section: Formal basis
  text: 'Object Storage invoice is governed by the following clauses.


    No posted charge exists for the same source event, meter, source subtype, pricing
    component and billing period. Group service charges by invoice grouping. Billing
    periods follow billing cycle in billing timezone, beginning at the first instant
    of the first date and ending exclusively at the first instant of the next month.
    For measured usage, invoice only services whose interval has ended; lifecycle
    fees instead require their source occurrence to be completed; use the posted authoritative
    source records. Set invoice issue time to the current handling time. Carry forward
    a positive grouped subtotal below minimum invoice amount rather than issuing an
    invoice; zero-rated usage stays visible as a meter and receives no monetary charge.
    A source charge already posted for the same source event, meter, quantity component
    and invoice period is returned without another charge. The fixed source reference
    and source business subtype distinguish primary, supplemental, setup, termination,
    resumption and return-fee components.


    For unbilled source component, the pre-action authority is the system record,
    using storage business event reference, original source reference, meter code,
    source business subtype, effective price branch, period, event type, status. The
    evidence must correlate original source reference for the proposed action. No
    posted charge exists for the same source event, meter, source subtype, pricing
    component and billing period.'
  source_locator: *id118
- target_doc: doc_storage_base_evt_invoice_f7c5cd50
  type: equivalent
  section: Basis Q&A
  text: What is the applicable opening condition? No posted charge exists for the
