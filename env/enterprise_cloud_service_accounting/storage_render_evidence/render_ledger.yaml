- target_doc: doc_storage_base_evt_combination_022d6f6c
  type: canonical
  section: Formal basis
  text: 'Object Storage combination is governed by the following clauses.


    An approved negotiated rate is a contract-specific override; the presence of a
    paid support holding makes assisted negotiated-amendment intake available through
    support as well as portal and api. Without that combination the signed amendment
    is submitted through portal or api. A promotional primary-price entitlement is
    suppressed wherever a commitment price covers the same quantity, and no benefit
    from an unrelated category is stacked.


    The following former handling clause is **no longer in force**: A current Northbridge
    Enterprise Support holding for the same customer and billing entity provides assisted
    invoice explanation, but does not itself reduce this category price or waive debt.


    The following former handling clause is **no longer in force**: The combination
    changes only request-channel eligibility, not approval authority.'
