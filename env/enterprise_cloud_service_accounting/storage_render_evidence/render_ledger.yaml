- target_doc: doc_storage_outage_claim_scope_162849d1
  type: canonical
  section: Formal basis
  text: Object Storage outage claim has the following application boundary. This procedure
    applies to original invoices with an approved US untaxed or verified exempt tax
    treatment; original tax remains zero. Non-provider causes, zero entitlement and
    at-or-above-target availability do not create a concession. The latest completed
    incident is the only incident adjudicated in this request; prior concessions for
    it remain in the source ledger. For the outage-concession and its original-payment
    refund procedure, a same-customer same-billing-entity active support contract
    additionally changes the service-credit amount through its numeric portfolio discount
    fraction; it does not change approval authority or any primary usage price. For
    the immediate outage-concession claim and its exact refund authorization, filing
    records status posted and sets both notice filing time and recorded occurrence
    time to the current handling clock; posted means customer intent has been submitted,
    not that a system approval or financial entry has occurred. Cancellation remains
    a new request event with status cancelled linked to the original request.
  source_locator: *id159
- target_doc: doc_storage_outage_claim_action_74e0b88f
  type: canonical
  section: Formal basis
  text: Object Storage outage claim is handled on request. The customer files one
