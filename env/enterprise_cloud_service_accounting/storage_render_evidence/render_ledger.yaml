- target_doc: doc_storage_outage_credit_scope_6690a60f
  type: canonical
  section: Formal basis
  text: 'Object Storage outage credit has the following application boundary. This
    procedure applies to original invoices with an approved US untaxed or verified
    exempt tax treatment; original tax remains zero. Non-provider causes, zero entitlement
    and at-or-above-target availability do not create a concession. The latest completed
    incident is the only incident adjudicated in this request; prior concessions for
    it remain in the source ledger. For the outage-concession and its original-payment
    refund procedure, a same-customer same-billing-entity active support contract
    additionally changes the service-credit amount through its numeric portfolio discount
    fraction; it does not change approval authority or any primary usage price.


    Before posting the outage concession, the claim assessment must be approved and
    eligible.'
  source_locator: *id177
