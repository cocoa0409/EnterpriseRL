- target_doc: doc_storage_outage_refund_basis_4_a24faf1c
  type: canonical
  section: Formal basis
  text: For Object Storage outage refund, for the refund, sum amount of all posted
    storage billed service amounts on this holding; this is a complete holding account
    remainder calculation. Add the signed amount of all posted bank-confirmed storage
    remittances on this holding. Add the signed amount of all posted storage credit
    postings on this holding, including the completed outage concession. Add positive
    amounts of all posted prior storage cash payouts on this holding. Add positive
    amounts of all posted bank payment bank reversals on this holding. Add positive
    amounts of all posted debit adjustments on this holding. Negate the sum of billed
    service amounts, remittances, credit postings, cash payouts, bank reversals and
    debit adjustments, and floor at zero to obtain the cash credit account remainder.
  source_locator: *id193
