- target_doc: doc_storage_base_evt_incident_e897b090
  type: canonical
  section: Formal basis
  text: 'Object Storage incident is governed by the following clauses.


    Operations record the closed incident, affected holding, exact incident external
    business reference, official incident closure time, cause, measured duration hours
    and availability percent from the official operational report. No customer statement
    substitutes for the report. Scheduled maintenance, customer changes and upstream-customer
    events remain visible with their cause code even though outage credit basis excludes
    them. Incident registration itself never creates a credit or changes contract
    status.'
  source_locator: *id122
