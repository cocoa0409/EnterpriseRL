- target_doc: doc_storage_base_evt_collection_82f0a12c
  type: canonical
  section: Formal basis
  text: 'Object Storage collection is governed by the following clauses.


    The bank record confirms the remittance as completed. Record only a bank-confirmed
    remittance using a payment methods rail and the amount actually received in currency.
    Customer consent to dispose of funds belongs to the customer; the agent only allocates
    a payment already confirmed by the bank. Apply an explicitly referenced invoice
    first; if the remittance omits allocation, use collection order, sorting invoice
    issue time then original source reference within the same customer and billing
    entity. Split across exact source invoice lines, never across legal billing entities.
    Each allocation is a separate negative payment amount linked to its original charge;
    any residual is an unallocated overpayment linked to the remittance reference.
    A repeated remittance reference and allocation target returns the existing posting.
    No receipt is inferred from a customer promise, and rejected or pending payments
    make no posting.


    For confirmed payment, the pre-action authority is the system record, using storage
    business event reference, status, external business reference, method. The evidence
    must correlate storage business event reference for the proposed action. The bank
    record confirms the remittance as completed.


    All posted financial events through the current handling time. Sum signed amount
    for charge, debit adjustment, payment return and refund together with negative
    amount for payment and credit, grouped by holding. No independently writable balance
    is stored..'
  source_locator: *id123
- target_doc: doc_storage_base_evt_collection_82f0a12c
  type: equivalent
  section: Basis Q&A
  text: What is the applicable opening condition? The bank record confirms the remittance
    as completed.
  source_locator: *id123
- target_doc: doc_storage_base_evt_return_078789a2
  type: canonical
  section: Formal basis
  text: 'Object Storage return is governed by the following clauses.


    The completed bank return notice refers to the exact original posted payment.
    The bank return must identify the exact posted payment. Restore the returned principal
    as a positive amount, up to the original payment amount not already returned.
    Copy its method, customer, billing entity and currency. A partial return uses
    the distinct bank notice external business reference. A duplicate bank notice
    produces no new write. Any failed payment fee is a separately identifiable return-fee
    charge under lifecycle and bank-return fee basis, never hidden in returned principal;
    a waived fee produces no fee posting.


    For bank return, the pre-action authority is the system record, using storage
    business event reference, original source reference, status, external business
    reference. The evidence must correlate storage business event reference together
    with original source reference for the proposed action. The completed bank return
    notice refers to the exact original posted payment.'
  source_locator: *id124
- target_doc: doc_storage_base_evt_return_078789a2
  type: equivalent
  section: Basis Q&A
  text: What is the applicable opening condition? The completed bank return notice
    refers to the exact original posted payment.
  source_locator: *id124
- target_doc: doc_storage_base_evt_refund_84a75953
  type: canonical
  section: Formal basis
  text: 'Object Storage refund is governed by the following clauses.


    The customer-authorized refund request and completed original payment refer to
    the same holding and source payment. The customer files an exact refund authorization;
    the agent refunds a confirmed overpayment only to the method and destination of
    its original payment. A requested amount exceeding that limit is refused, not
    silently reduced. Use refund methods, require at least refund minimum, and record
    a positive receivable delta for cash paid out. A smaller positive balance remains
    on account. Refunds require no active service contract and remain possible after
    closure. Repetition of the same request and source payment returns the existing
    refund. A third-party destination or unconfirmed payment is refused.


    The following former handling clause is **no longer in force**: Available refund
    is the smaller of the negative net receivable magnitude and original payment principal
    less prior returns and refunds linked to that payment.


    For refund consent, the pre-action authority is the system record, using storage
    business event reference, customer request reference, original source reference,
    status, storage contract reference. The evidence must correlate storage business
    event reference together with customer request reference together with original
    source reference together with storage contract reference for the proposed action.
    The customer-authorized refund request and completed original payment refer to
    the same holding and source payment.'
  source_locator: *id125
- target_doc: doc_storage_base_evt_refund_84a75953
  type: equivalent
  section: Basis Q&A
  text: What is the applicable opening condition? The customer-authorized refund request
    and completed original payment refer to the same holding and source payment.
  source_locator: *id125
