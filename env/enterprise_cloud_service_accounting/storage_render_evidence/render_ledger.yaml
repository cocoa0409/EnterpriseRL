- target_doc: doc_storage_base_evt_tax_d17cb872
  type: canonical
  section: Formal basis
  text: 'Object Storage tax is governed by the following clauses.


    The applicable tax classification has an approved system review. Use the source
    contract tax treatment reviewed at the service date and tax rates. Apply tax to
    the final rounded net service amount; round tax separately using the tier monetary
    precision and the tier rounding convention. For a correction or credit use the
    original charge tax basis unless an approved tax-error review supplies the corrected
    treatment. Tax credits have negative tax amount; charges and upward adjustments
    have positive tax amount. Unsupported tax jurisdictions are outside policy coverage,
    not assumed exempt. Sum net subtotal and signed tax to obtain the financial amount.
    A verified exemption overrides the ordinary taxable rate; there is no stacking
    of tax treatments.


    For tax evidence, the pre-action authority is the system record, using storage
    contract reference, tax review status, tax treatment. The evidence must correlate
    storage contract reference for the proposed action. The applicable tax classification
    has an approved system review.'
  source_locator: *id117
