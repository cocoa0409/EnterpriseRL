  type: canonical
  section: Formal basis
  text: Object Storage A customer seeks return of excess cash on an untaxed storage
    invoice with a completed provider incident and one completed original payment.
    The terminal state contains the adjudicated service concession and the customer-authorized
    original-destination refund.
  source_locator: *id200
- target_doc: doc_storage_outage_refund_procedure_5fcc4234
  type: canonical
  section: Ordered business actions
  text: '1. The customer themselves performs the customer claim amount action using
    file_storage_outage_claim_6a92fd5d.

    2. The agent performs the accountant approved concession action using assess_storage_outage_30bc4acc.

    3. The agent performs the signed concession credit action using post_storage_service_concession_cfd2170f.

    4. The customer themselves performs the customer exact refund authorization action
    using authorize_storage_refund_9b3e6afe.

    5. The agent performs the cash refund action using refund_storage_overpayment_1b2c5ab5.'
  source_locator: *id200
- target_doc: doc_storage_outage_refund_procedure_5fcc4234
  type: canonical
  section: Object continuity
  text: The filed claim reference is the assessment request reference. The approved
    assessment reference becomes the concession supporting evidence reference. The
    posted concession reference becomes the authorization supporting evidence reference.
    The exact authorization request reference becomes the payout authorization reference.
  source_locator: *id200
- target_doc: doc_storage_outage_refund_procedure_5fcc4234
  type: canonical
  section: Ordering basis
  text: The customer claim is the basis of the accountant assessment; an unfiled claim
    supplies no claimed amount. The approved assessment is the basis of the financial
    concession; an unapproved result supplies no money authority. The concession must
    be posted before its resulting cash balance can be authorized. The exact customer
    authorization must exist before its cash payout. Each action is a synchronous
    filing, accountant calculation or financial booking against a completed report
    or payment; no physical or external event is manufactured.
  source_locator: *id200
- target_doc: doc_storage_outage_refund_procedure_5fcc4234
  type: derived
