- target_doc: doc_storage_base_evt_service_credit_9a2cb929
  type: canonical
  section: Formal basis
  text: 'Object Storage service concession is governed by the following clauses.


    For a service concession financial posting, an approved review has decision eligible
    and positive claimed or approved credit amount for the exact source charge; this
    gate does not constrain filing or reviewing the request. For a service concession
    request being filed, the outage claim is filed no later than credit claim days
    after the official incident closes. For a newly filed claim, current handling
    time is its notice filing time; the request is recorded immediately. Later review
    and credit use that recorded notice filing time to evaluate the same boundary,
    so a timely request does not expire while awaiting review. Add credit claim days
    UTC calendar dates to official incident closure time, preserving its time of day;
    calendar dates are counted without substituting business days or elapsed-hour
    periods. Equality at the deadline qualifies; a later claim is rejected without
    a credit. The provider incident must be completed, with cause outside outage exclusions.
    Availability at or above availability target percentage gives no credit. Below
    the target choose the first descending descending availability credit bands entry
    whose minimum is no greater than the recorded availability percent. Floor the
    additional credit at zero and round with the tier monetary precision and the tier
    rounding convention. Apply the original tax component proportionately. A review
    writes its nonnegative approved result; a financial credit writes the negative
    approved amount only after that approved review exists. This service-credit branch
    applies only to source business subtype service concession; billing correction
    basis applies only to source business subtype correction. Excluded incidents,
    ineligible reviews and zero remaining entitlement result in no financial write.
    A request for consequential-loss compensation is not covered. A service-credit
    financial posting requires an approved review with decision eligible and positive
    claimed or approved credit amount; the request and incident alone cannot authorize
    the financial posting.


    The following former handling clause is **no longer in force**: Multiply the original
    source charge net amount by that fraction; subtract the prior pretax service concession
    magnitude component of prior credits for that exact source, and cap total service
    credits at cumulative outage credit cap fraction of that original net amount.


    For claim deadline, the pre-action authority is the system record, using storage
    business event reference, official incident closure time, notice filing time.
    The evidence must correlate storage business event reference for the proposed
    action. For a service concession request being filed, the outage claim is filed
    no later than credit claim days after the official incident closes.


    For approved service credit, the pre-action authority is the system record, using
    storage business event reference, original source reference, status, decision,
    claimed or approved credit amount. The evidence must correlate original source
    reference for the proposed action. For a service concession financial posting,
    an approved review has decision eligible and positive claimed or approved credit
    amount for the exact source charge; this gate does not constrain filing or reviewing
    the request.'
  source_locator: *id121
- target_doc: doc_storage_base_evt_service_credit_9a2cb929
  type: equivalent
  section: Basis Q&A
  text: What is the applicable opening condition? For a service concession financial
