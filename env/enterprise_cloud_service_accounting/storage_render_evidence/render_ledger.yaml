    storage remittances on this holding. Add the signed amount of all posted storage
    credit postings on this holding, including the completed outage concession. Add
    positive amounts of all posted prior storage cash payouts on this holding. Add
    positive amounts of all posted bank payment bank reversals on this holding. Add
    positive amounts of all posted debit adjustments on this holding. Negate the sum
    of billed service amounts, remittances, credit postings, cash payouts, bank reversals
