- target_doc: doc_storage_base_admission_dbb4a5bf
  type: canonical
  section: Formal basis
  text: 'Object Storage admission is governed by the following clauses.


    The signed application request has an approved service review. The customer signs
    and submits the application through an authorized channels channel. Create status
    applied and opened date from the current handling clock, with no consumption or
    charge. The requested tier supplies resource count limit; reject unsupported regions,
    unsupported currency, resource counts above that limit, and unapproved contract
    terms without a write. The customer owns the signature; an agent cannot sign for
    them. Entry gates are evaluated against the authoritative signed application fields
    copied into the proposed holding.


    For signed approval, the pre-action authority is the system record, using storage
    business event reference, customer request reference, status, decision. The evidence
    must correlate storage business event reference together with customer request
    reference for the proposed action. The signed application request has an approved
    service review.'
  source_locator: *id109
- target_doc: doc_storage_base_admission_dbb4a5bf
  type: equivalent
  section: Basis Q&A
  text: What is the applicable opening condition? The signed application request has
    an approved service review.
  source_locator: *id109
- target_doc: doc_storage_base_activation_b3d0e5e4
  type: canonical
  section: Formal basis
  text: 'Object Storage activation is governed by the following clauses.


    The contract status is applied. The contract approval status is approved. Activate
    an approved application after provisioning evidence confirms the configured resources;
    record activated at from the current handling clock. Refuse rejected or pending
    applications. Setup is invoiced under lifecycle and bank-return fee basis when
    setup fee is positive; a waived setup fee creates no charge. Repeating an activation
    of an already active contract is a read-only confirmation, not another activation.


    For contract state, the pre-action authority is the system record, using storage
    contract reference, status. The evidence must correlate storage contract reference
    for the proposed action. The contract status is applied.


    For provisioning approval, the pre-action authority is the system record, using
    storage contract reference, approval status. The evidence must correlate storage
    contract reference for the proposed action. The contract approval status is approved.'
  source_locator: *id110
- target_doc: doc_storage_base_activation_b3d0e5e4
  type: equivalent
  section: Basis Q&A
  text: What is the applicable opening condition? The contract status is applied.
  source_locator: *id110
- target_doc: doc_storage_base_amendment_e9949f89
  type: canonical
  section: Formal basis
  text: 'Object Storage amendment is governed by the following clauses.


    The contract status is active or suspended. The source amendment request is approved
    and customer-authorized. The customer files a signed amendment request before
    the agent applies the approved attributes. The request external business reference
    identifies the signed amendment; its related approved review carries the affected
    exact values and effective service interval start. Request and review events preserve
    those effective attributes. Keep status unchanged, use the new tier only for service
    intervals beginning at the request effective time, and retain old tier and effective
    price on earlier meter and invoice records. Refuse any change above resource count
    limit or when completed amendments in the handling UTC month has reached monthly
    amendment limit. Completed amendment requests count once; pending, rejected or
    cancelled requests do not change the holding. Signed commitments keep their recorded
    expiration and remaining contractual liability unless the signed amendment explicitly
    replaces them.


    For contract state, the pre-action authority is the system record, using storage
    contract reference, status. The evidence must correlate storage contract reference
    for the proposed action. The contract status is active or suspended.


    For amendment approved, the pre-action authority is the system record, using storage
    business event reference, status, customer request reference, source business
    subtype. The evidence must correlate storage business event reference together
    with customer request reference for the proposed action. The source amendment
    request is approved and customer-authorized.


    UTC calendar month containing the current handling time. Count completed request
    events of source business subtype amendment for this holding; cancelled and rejected
    requests do not count.'
  source_locator: *id111
- target_doc: doc_storage_base_amendment_e9949f89
  type: equivalent
  section: Basis Q&A
  text: What is the applicable opening condition? The contract status is active or
    suspended.
  source_locator: *id111
- target_doc: doc_storage_base_evt_request_2f9fcdc4
  type: canonical
  section: Formal basis
  text: 'Object Storage request is governed by the following clauses.


    Only the customer may file or cancel an authorization, claim or disposal request.
    Preserve the exact external business reference and the narrowest original source
    reference. An unsupported channel is refused. A repeated identical request reference
    returns the existing event. Filing a request never confirms a system approval
    or changes an accounting balance.


    The following former handling clause is **no longer in force**: Set notice filing
    time and recorded occurrence time to the current handling clock and status pending
    on filing; cancellation is a new request event with status cancelled linked to
    the original request.'
  source_locator: *id112
- target_doc: doc_storage_base_evt_request_2f9fcdc4
  type: equivalent
