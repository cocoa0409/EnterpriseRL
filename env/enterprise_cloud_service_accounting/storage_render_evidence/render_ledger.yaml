- target_doc: doc_storage_base_suspension_70d657eb
  type: canonical
  section: Formal basis
  text: 'Object Storage suspension is governed by the following clauses.


    The contract status is active. Collection suspension occurs no earlier than invoice
    due days plus suspension grace days after the source invoice is issued. The contract
    official payment restriction state is restricted and the source invoice retains
    unpaid principal. Add invoice due days and then suspension grace days UTC calendar
    dates to invoice issue time, preserving its time of day; do not use business days
    or replace the anchor with contract activation. Equality qualifies. The source
    overdue invoice must retain a positive unpaid principal; a fully paid invoice
    cannot justify suspension. Earlier handling sends an informational explanation
    without a status change. An agent suspends active service only when official payment
    restriction state is restricted; ordinary billing disputes alone do not suspend
    service. Retained ancillary resources can still produce actual supplemental usage.
    Repeated handling of an already suspended contract makes no new transition.


    For contract state, the pre-action authority is the system record, using storage
    contract reference, status. The evidence must correlate storage contract reference
    for the proposed action. The contract status is active.


    For collection deadline, the pre-action authority is the system record, using
    storage business event reference, invoice issue time. The evidence must correlate
    storage business event reference for the proposed action. Collection suspension
    occurs no earlier than invoice due days plus suspension grace days after the source
    invoice is issued.


    For collection restriction, the pre-action authority is the system record, using
    storage contract reference, official payment restriction state, storage business
    event reference, amount. The evidence must correlate storage contract reference
    together with storage business event reference for the proposed action. The contract
    official payment restriction state is restricted and the source invoice retains
    unpaid principal.'
  source_locator: *id126
- target_doc: doc_storage_base_suspension_70d657eb
  type: equivalent
  section: Basis Q&A
  text: What is the applicable opening condition? The contract status is active.
  source_locator: *id126
- target_doc: doc_storage_base_suspension_70d657eb
  type: derived
  section: Hypothetical boundary cases
  text: Assume the source invoice still has unpaid principal, the contract is active,
    and the official restriction is recorded. At the deadline obtained by adding the
    invoice due period and then the collection grace period to the invoice issue time,
