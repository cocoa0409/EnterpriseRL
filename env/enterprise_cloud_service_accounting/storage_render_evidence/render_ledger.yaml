- target_doc: doc_storage_base_agg_multi_holding_b1e15174
  type: canonical
  section: Formal basis
  text: 'Object Storage multi holding is governed by the following clauses.


    The signed resource scope is not already represented by a nonclosed contract.
    Multiple independent resource scopes may be held. Use external business reference
    as the signed resource-scope key. Count all nonclosed holdings of this category
    for the same customer; refuse creation if the count would exceed maximum concurrent
    customer contracts. A repeated signed application with the same external resource
    scope reuses the existing contract rather than opening another. The maximum is
    24 nonclosed contracts per customer.


    For scope unique, the pre-action authority is the system record, using storage
    contract reference, customer reference, status, external business reference. The
    evidence must correlate storage contract reference together with customer reference
    for the proposed action. The signed resource scope is not already represented
    by a nonclosed contract.'
  source_locator: *id108
- target_doc: doc_storage_base_agg_multi_holding_b1e15174
