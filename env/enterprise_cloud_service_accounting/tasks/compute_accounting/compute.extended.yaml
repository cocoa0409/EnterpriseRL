  compute:
  - source: LATEST('compute_events','compute_event_id',date_field='occurred_at',event_type='compute_charge',source_subtype='primary',status='posted')
  - payment: LATEST('compute_events','compute_event_id',date_field='occurred_at',event_type='compute_payment',source_event_id=source,status='posted')
  - balance: SUM('compute_events','amount',event_type='compute_charge',status='posted')+SUM('compute_events','amount',event_type='compute_credit',status='posted')+SUM('compute_events','amount',event_type='compute_debit_adjustment',status='posted')+SUM('compute_events','amount',event_type='compute_payment',status='posted')+SUM('compute_events','amount',event_type='compute_payment_return',status='posted')+SUM('compute_events','amount',event_type='compute_refund',status='posted')
  - principal: -SUM('compute_events','amount',compute_event_id=payment,event_type='compute_payment',status='posted')
  - disposed: SUM('compute_events','amount',source_event_id=payment,event_type='compute_payment_return',status='posted')+SUM('compute_events','amount',source_event_id=payment,event_type='compute_refund',status='posted')
  - ceiling: CPARAM('support','minimum_monthly_fee',status='active',billing_entity=F('billing_entity')) or 0
  - available: MN(MX(0,-balance),MX(0,principal-disposed),ceiling)
  - result: 0 if available < P('refund_minimum') else int(available*100+0.5)/100
  compute_basis:
    source: For a primary paid-line cash correction, the target is the most recently issued posted primary charge
      of the selected holding; the customer must identify that exact line.
    payment: Use the most recent completed posted payment allocated to the exact selected source charge; this immediate-refund
      scope requires one original payment allocation for that source.
    balance: Reconcile the selected holding receivable from all posted charges, credits, debit adjustments, payments,
      payment returns and refunds across its complete history; pending, rejected and cancelled events do not enter
      the balance.
    principal: Take the magnitude of the original posted payment allocated to the selected source.
    disposed: Subtract positive posted returns and earlier refunds linked to that original payment, excluding transactions
      belonging to another payment.
    ceiling: For a customer requesting the maximum permitted immediate refund, use the same-entity active support
      tier minimum_monthly_fee as the immediate payout ceiling; absent active support permits no immediate package
      payout.
    available: The permitted requested amount is the smallest of the negative receivable magnitude floored at zero,
      original payment principal minus prior disposal floored at zero, and the immediate payout ceiling; retain
      any surplus on account without further action.
    result: Record the permitted refund amount rounded half-up to two USD decimals when it meets refund_minimum
      inclusively; otherwise make no positive refund-eligibility assessment.
  inputs:
    history:
    - table: compute_events
      aggregate: sum
      field: amount
    cross_category:
    - support
workflows:
- id: compute_assisted_cash_resolution
  scenario: An existing customer-filed maximum-refund request concerns the latest paid primary source line. A corrected
    source target creates a surplus whose permitted payout is assessed by the accountant and disposed of by the
    customer personally; one payout completes the request, with any remaining surplus retained.
  prerequisite: []
  steps:
  - tool: review_compute_line_e30849b6
    owner: agent
    writes: compute_events
    subject: compute_review
    base_policy_refs:
    - compute_evt_review
    - compute_evt_service_credit
    role: review_compute_line
    computed_by:
    - compute_ext_assisted_review
    requires_external_wait: false
    zero_wait_proof: Every physical export and original source charge already exists; the desk completes this arithmetic
      review synchronously.
  - tool: credit_compute_line_adb33dcc
    owner: agent
    writes: compute_events
    subject: compute_credit
    base_policy_refs:
    - compute_evt_tax
    - compute_evt_correction
    - compute_evt_service_credit
    role: credit_compute_line
    computed_by:
    - compute_ext_assisted_credit
    requires_external_wait: false
    zero_wait_proof: The preceding review provides the approved incorrect target; this call immediately posts the
      correction.
  - tool: authorize_compute_refund_4fb241f0
    owner: agent
    writes: compute_events
    subject: compute_review
    base_policy_refs:
    - compute_evt_review
    - compute_evt_service_credit
    role: Accountant assesses the original customer request and payment after the exact source correction, recording
      the permitted financial ceiling.
    computed_by:
    - compute_ext_refund_assessment
    requires_external_wait: false
    zero_wait_proof: The original filed request and posted payment preexist the consultation; the preceding credit
      is now posted. The accountant performs the request/payment reconciliation and records its numerical assessment
      synchronously.
  - tool: refund_compute_payment_f0565a85
    owner: user
    writes: compute_events
    subject: compute_refund
    base_policy_refs:
    - compute_evt_refund
    role: Customer executes the exact permitted refund using their original filed request and the accountant assessment.
    computed_by:
    - compute_ext_immediate_refund
    requires_external_wait: false
    zero_wait_proof: Original customer consent is recorded at opening; the preceding accountant tool has completed
      the eligibility assessment and returns its reference. The customer immediately executes the handed-over disposition
      tool; no later action depends on its receipt.
  dataflow:
  - from_step: 0
    to_step: 1
    kind: object_binding
    source_table: compute_events
    source_field: compute_event_id
    consumer_bindings:
    - action_arg: related_event_id
      role: direct
  - from_step: 1
    to_step: 2
    kind: object_binding
    source_table: compute_events
    source_field: compute_event_id
    consumer_bindings:
    - action_arg: correction_event_id
      role: direct
  - from_step: 2
    to_step: 3
    kind: object_binding
    source_table: compute_events
    source_field: compute_event_id
    consumer_bindings:
    - action_arg: related_event_id
      role: direct
  order_rationale: The primary review precedes correction because its approved net target determines the credit.
    The credit precedes the refund assessment because the exact posted correction reference and its resulting surplus
    are inputs to that assessment. The assessment precedes customer disposition because its approved numerical ceiling
    and returned reference constrain the actual payout. Customer signature consent is already present on the original
    request; no asynchronous signature approval, payment clearing or other external event is manufactured.
  requires_external_wait: false
  zero_wait_proof: All original customer consent, export and posted payment records preexist the consultation. Review,
    credit and refund assessment are synchronous accountant actions. The customer then executes the final disposition
    using the already returned assessment reference; no subsequent call consumes the user-generated receipt.
