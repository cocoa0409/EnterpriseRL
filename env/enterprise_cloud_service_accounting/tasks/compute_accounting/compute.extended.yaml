extended_policies:
- id: compute_ext_assisted_review
  base_policy_refs:
  - compute_agg_usage
  - compute_evt_pricing
  - compute_evt_combination
  - compute_evt_tax
  - compute_evt_review
  - compute_evt_service_credit
  - compute_evt_category_meters
  overwrite:
  - base_policy: compute_evt_pricing
    superseded_clause: The negotiated rate replaces the primary unit_rate before applying the region factor and
      receives no further discount.
    replaced_by: Floor the signed measured quantity at zero, multiply by the selected rate, region factor and configuration
      multiplier, apply the ordinary discount once, and then apply the support portfolio_discount to that discounted
      subtotal; round only this final reviewed net amount half-up to two USD decimals. This support adjustment is
      successive to ordinary pricing, including approved negotiated pricing.
  - base_policy: compute_evt_pricing
    superseded_clause: No discount applies to taxes, license fees, standalone supplemental services or previously
      issued credits.
    replaced_by: This support adjustment is successive to ordinary pricing, including approved negotiated pricing.
  - base_policy: compute_evt_combination
    superseded_clause: A current Northbridge Enterprise Support holding for the same customer and billing entity
      provides assisted invoice explanation, but does not itself reduce this category price or waive debt.
    replaced_by: Floor the signed measured quantity at zero, multiply by the selected rate, region factor and configuration
      multiplier, apply the ordinary discount once, and then apply the support portfolio_discount to that discounted
      subtotal; round only this final reviewed net amount half-up to two USD decimals. This support adjustment is
      successive to ordinary pricing, including approved negotiated pricing.
  - base_policy: compute_agg_usage
    superseded_clause: Combine only holdings of this category owned by the same customer with the same billing_entity
      and source period, even if some have since closed.
    replaced_by: For this assisted single-holding primary correction scope, sum posted primary charge net amounts
      of the selected holding in the target period as the portfolio threshold basis; other holdings are outside
      this explicitly narrowed threshold basis.
  - base_policy: compute_agg_usage
    superseded_clause: Use msr_portfolio_usage to select the portfolio discount.
    replaced_by: For this assisted single-holding primary correction scope, sum posted primary charge net amounts
      of the selected holding in the target period as the portfolio threshold basis; other holdings are outside
      this explicitly narrowed threshold basis.
  - base_policy: compute_evt_combination
    superseded_clause: The combination changes only request-channel eligibility, not approval authority.
    replaced_by: Within the assisted primary correction package, the same-entity active support combination determines
      the successive pricing adjustment and settlement concession described here in addition to request-channel
      eligibility; approval authority remains unchanged.
  - base_policy: compute_evt_combination
    superseded_clause: A promotional primary-price entitlement is suppressed wherever a commitment price covers
      the same quantity, and no benefit from an unrelated category is stacked.
    replaced_by: A promotional primary-price entitlement remains suppressed wherever commitment pricing covers the
      same quantity; the two explicitly described same-entity support reductions are permitted successive adjustments,
      and no other cross-category benefit is stacked.
  trigger: on_request
  subject:
  - compute_review
  computes: net_amount
  target_tool: review_compute_line_e30849b6
  rule: 'This assisted primary correction review applies to a fully paid most recent primary line whose completed
    export and contracted terms are available synchronously; no missing external evidence can be manufactured. The
    selected holding has no tier change or commitment-boundary crossing within the source interval and no other
    primary holding in this billing entity during the target period. Record one approved incorrect review with net_amount
    equal to the revised net target; tax follows the original approved tax basis. Existing review of this exact
    request and source is read-only. For a primary paid-line cash correction, the target is the most recently issued
    posted primary charge of the selected holding; the customer must identify that exact line. Read the authoritative
    export reference attached to that most recent posted primary charge. Use the UTC service period of that most
    recent posted primary charge. Sum posted primary meter quantities for this holding, exact export reference and
    service period. Add the signed quantities of posted primary meter reversals for the same export reference and
    period; rejected and cancelled events and other export references are excluded. Use the approved negotiated
    primary rate when the holding negotiated_approval is approved; otherwise use its contracted unit_rate, with
    the selected holding required to retain the same tier throughout the target service period. Multiply the selected
    primary rate by the contracted region_factors value for the holding region. Apply dedicated_factor to that region-adjusted
    primary rate for dedicated configuration, and a multiplier of one for other configurations. For this assisted
    single-holding primary correction scope, sum posted primary charge net amounts of the selected holding in the
    target period as the portfolio threshold basis; other holdings are outside this explicitly narrowed threshold
    basis. Choose no ordinary discount for an approved negotiated rate; otherwise choose spot_discount for spot,
    then the reservation_discounts value for a non-none commitment covering the entire interval, then promotion_discount
    for an eligible campaign on its supported original channel, then portfolio_discount if the narrowed period basis
    meets portfolio_threshold inclusively, and zero otherwise; do not stack these ordinary discounts. Read portfolio_discount
    from the same-customer, same-billing-entity active support holding; if there is none, use zero. Where multiple
    such support holdings exist, this scope is unavailable until the customer identifies one; this formula applies
    to a unique matching support holding. Floor the signed measured quantity at zero, multiply by the selected rate,
    region factor and configuration multiplier, apply the ordinary discount once, and then apply the support portfolio_discount
    to that discounted subtotal; round only this final reviewed net amount half-up to two USD decimals. This support
    adjustment is successive to ordinary pricing, including approved negotiated pricing. This assisted export scope
    requires integral instance-hour source quantities, including any reversal quantities. Within the assisted primary
    correction package, the same-entity active support combination determines the successive pricing adjustment
    and settlement concession described here in addition to request-channel eligibility; approval authority remains
    unchanged. A promotional primary-price entitlement remains suppressed wherever commitment pricing covers the
    same quantity; the two explicitly described same-entity support reductions are permitted successive adjustments,
    and no other cross-category benefit is stacked. Read the original channel recorded on that most recent posted
    primary source charge; the channel of the present support conversation does not replace the source channel.
    This assisted primary review does not handle partially covered source quantities: for a non-none commitment,
    the recorded committed_quantity remaining after earlier posted source allocations in the same holding and service
    period must cover the entire net quantity of the selected source, and the recorded commitment boundaries must
    contain its entire source interval. For the primary review action, compute_event_id identifies the unique completed
    review-subtype service-record packet whose source_event_id is the original primary charge and whose related_event_id
    is its exact provider export; the raw export itself does not occupy this packet role.'
  prerequisite: []
  cross_category:
  - category: support
    as: branch
    reads:
    - variant_name
    - status
    - billing_entity
    note: Read the same-entity active support tier numerical commercial parameter for this calculation; do not write
      support.
  compute:
  - source: LATEST('compute_events','compute_event_id',date_field='occurred_at',event_type='compute_charge',source_subtype='primary',status='posted')
  - anchor: LATEST('compute_events','source_event_id',date_field='occurred_at',event_type='compute_charge',source_subtype='primary',status='posted')
  - period: LATEST('compute_events','period',date_field='occurred_at',event_type='compute_charge',source_subtype='primary',status='posted')
  - original_channel: LATEST('compute_events','channel',date_field='occurred_at',event_type='compute_charge',source_subtype='primary',status='posted')
  - measured: SUM('compute_events','quantity',event_type='compute_meter',status='posted',source_event_id=anchor,period=period)
  - reversed: SUM('compute_events','quantity',event_type='compute_meter_reversal',status='posted',source_event_id=anchor,period=period)
  - rate: F('negotiated_unit_rate') if F('negotiated_approval') == 'approved' else P('unit_rate')
  - region: K('region_east') if F('region') == 'us_east' else (K('region_west') if F('region') == 'us_west' else
      K('region_eu'))
  - configuration: P('dedicated_factor') if F('configuration') == 'dedicated' else 1
  - portfolio: SUM('compute_events','net_amount',event_type='compute_charge',status='posted',source_subtype='primary',period=period)
  - discount: 0 if F('negotiated_approval') == 'approved' else (P('spot_discount') if F('configuration') == 'spot'
      else ((K('reservation_one') if F('commitment_term') == 'one_year' else K('reservation_three')) if F('commitment_term')
      != 'none' else (P('promotion_discount') if F('promotion_status') == 'eligible' and original_channel in P('promotion_channels')
      else (P('portfolio_discount') if portfolio >= P('portfolio_threshold') else 0))))
  - assisted: CPARAM('support','portfolio_discount',status='active',billing_entity=F('billing_entity')) or 0
  - result: int(MX(0,measured+reversed)*rate*region*configuration*(1-discount)*(1-assisted)*100+0.5)/100
  compute_basis:
    source: For a primary paid-line cash correction, the target is the most recently issued posted primary charge
      of the selected holding; the customer must identify that exact line.
    anchor: Read the authoritative export reference attached to that most recent posted primary charge.
    period: Use the UTC service period of that most recent posted primary charge.
    measured: Sum posted primary meter quantities for this holding, exact export reference and service period.
    reversed: Add the signed quantities of posted primary meter reversals for the same export reference and period;
      rejected and cancelled events and other export references are excluded.
    rate: Use the approved negotiated primary rate when the holding negotiated_approval is approved; otherwise use
      its contracted unit_rate, with the selected holding required to retain the same tier throughout the target
      service period.
    region: Multiply the selected primary rate by the contracted region_factors value for the holding region.
    configuration: Apply dedicated_factor to that region-adjusted primary rate for dedicated configuration, and
      a multiplier of one for other configurations.
    portfolio: For this assisted single-holding primary correction scope, sum posted primary charge net amounts
      of the selected holding in the target period as the portfolio threshold basis; other holdings are outside
      this explicitly narrowed threshold basis.
    discount: Choose no ordinary discount for an approved negotiated rate; otherwise choose spot_discount for spot,
      then the reservation_discounts value for a non-none commitment covering the entire interval, then promotion_discount
      for an eligible campaign on its supported original channel, then portfolio_discount if the narrowed period
      basis meets portfolio_threshold inclusively, and zero otherwise; do not stack these ordinary discounts.
    assisted: Read portfolio_discount from the same-customer, same-billing-entity active support holding; if there
      is none, use zero. Where multiple such support holdings exist, this scope is unavailable until the customer
      identifies one; this formula applies to a unique matching support holding.
    result: Floor the signed measured quantity at zero, multiply by the selected rate, region factor and configuration
      multiplier, apply the ordinary discount once, and then apply the support portfolio_discount to that discounted
      subtotal; round only this final reviewed net amount half-up to two USD decimals. This support adjustment is
      successive to ordinary pricing, including approved negotiated pricing.
    original_channel: Read the original channel recorded on that most recent posted primary source charge; the channel
      of the present support conversation does not replace the source channel.
  inputs:
    history:
    - table: compute_events
      aggregate: sum
      field: amount
    cross_category:
    - support
  params:
    region_east: 1.0
    region_west: 1.04
    region_eu: 1.12
    reservation_one: 0.22
    reservation_three: 0.38
