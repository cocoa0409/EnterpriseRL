      Northbridge Virtual Compute 64 vCPU:
        authorized_channels: =authorized_channels
        promotion_channels: =promotion_channels
        discount_priority: =discount_priority
- id: compute_evt_tax
  subject:
  - compute_charge
  - compute_credit
  - compute_debit_adjustment
  rule: The applicable tax classification has an approved system review. Use the source contract tax_treatment reviewed
    at the service date and tax_rates. Apply tax to the final rounded net service amount; round tax separately using
    amount_precision and rounding_mode. For a correction or credit use the original charge tax basis unless an approved
    tax-error review supplies the corrected treatment. Tax credits have negative tax_amount; charges and upward
    adjustments have positive tax_amount. Unsupported tax jurisdictions are POLICY_NOT_COVERED, not assumed exempt.
    Sum net subtotal and signed tax to obtain the financial amount. A verified exemption overrides the ordinary
    taxable rate; there is no stacking of tax treatments.
  eligibility:
  - id: tax_evidence
    applies_to:
    - compute_charge
    - compute_credit
    - compute_debit_adjustment
    kind: authorization
    condition: The applicable tax classification has an approved system review.
    evidence_fields:
    - compute_holdings.compute_holding_id
    - compute_holdings.tax_review_status
    - compute_holdings.tax_treatment
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - compute_holdings.compute_holding_id
      action_bindings:
        compute_holdings.compute_holding_id: compute_holding_id
  params:
    per_tier:
      Northbridge Virtual Compute 2 vCPU:
        tax_rates: =tax_rates
        amount_precision: =amount_precision
        rounding_mode: =rounding_mode
      Northbridge Virtual Compute 4 vCPU:
        tax_rates: =tax_rates
        amount_precision: =amount_precision
        rounding_mode: =rounding_mode
      Northbridge Virtual Compute 8 vCPU:
        tax_rates: =tax_rates
        amount_precision: =amount_precision
        rounding_mode: =rounding_mode
      Northbridge Virtual Compute 16 vCPU:
        tax_rates: =tax_rates
        amount_precision: =amount_precision
        rounding_mode: =rounding_mode
      Northbridge Virtual Compute 32 vCPU:
        tax_rates: =tax_rates
        amount_precision: =amount_precision
        rounding_mode: =rounding_mode
      Northbridge Virtual Compute 64 vCPU:
        tax_rates: =tax_rates
        amount_precision: =amount_precision
        rounding_mode: =rounding_mode
  formula:
    gross_amount: net_amount + tax_amount
- id: compute_evt_invoice
  subject:
  - compute_charge
  rule: No posted charge exists for the same source event, meter, source subtype, pricing component and billing
    period. Group service charges by invoice_grouping. Billing periods follow billing_cycle in billing_timezone,
    beginning at the first instant of the first date and ending exclusively at the first instant of the next month.
    For measured usage, invoice only services whose interval has ended; lifecycle fees instead require their source
    occurrence to be completed; use the posted authoritative source records. Set invoice_issued_at to the frozen
    handling time. Carry forward a positive grouped subtotal below minimum_invoice_amount rather than issuing an
    invoice; zero-rated usage stays visible as a meter and receives no monetary charge. A source charge already
