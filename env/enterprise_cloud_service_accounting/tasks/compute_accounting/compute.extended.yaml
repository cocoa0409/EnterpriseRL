    when it was filed. For this assessment action, compute_event_id and request_id identify that exact filed request,
    source_event_id identifies its original posted payment, related_event_id identifies the original primary charge
    paid by that payment, and correction_event_id identifies the exact preceding assisted credit for that charge.
    The created review retains request_id, the original payment as source_event_id and the posted correction as
    related_event_id. For a primary paid-line cash correction, the target is the most recently issued posted primary
    charge of the selected holding; the customer must identify that exact line. Use the most recent completed posted
    payment allocated to the exact selected source charge; this immediate-refund scope requires one original payment
    allocation for that source. Reconcile the selected holding receivable from all posted charges, credits, debit
    adjustments, payments, payment returns and refunds across its complete history; pending, rejected and cancelled
    events do not enter the balance. Take the magnitude of the original posted payment allocated to the selected
    source. Subtract positive posted returns and earlier refunds linked to that original payment, excluding transactions
    belonging to another payment. For a customer requesting the maximum permitted immediate refund, use the same-entity
    active support tier minimum_monthly_fee as the immediate payout ceiling; absent active support permits no immediate
    package payout. The permitted requested amount is the smallest of the negative receivable magnitude floored
    at zero, original payment principal minus prior disposal floored at zero, and the immediate payout ceiling;
    retain any surplus on account without further action. Record the permitted refund amount rounded half-up to
    two USD decimals when it meets refund_minimum inclusively; otherwise make no positive refund-eligibility assessment.
    The selected payment has exactly one pending customer refund request in this package; the existing request names
    that original payment and its paid primary charge. An existing approved eligible assessment for that payment
    is read-only, including when the same request is repeated; this package creates no second eligible assessment
    for the payment. This immediate ACH package requires the original posted payment method to be ach; the original
    destination is represented by that exact payment reference.
  prerequisite:
  - problem: compute_ext_assisted_credit
    kind: value_input
    gate: balance
    condition: Before the original-payment refund assessment is handled, the assisted financial correction of its
      exact paid primary source must be completed.
    policy_source: Before the original-payment refund assessment is handled, the assisted financial correction of
      its exact paid primary source must be completed.
    resolved_by: credit_compute_line_adb33dcc
    effect: The posted correction creates the negative receivable available for cash payout.
  cross_category:
  - category: support
    as: branch
    reads:
    - variant_name
    - status
    - billing_entity
    note: Read the same-entity active support tier numerical commercial parameter for this calculation; do not write
