- id: compute_evt_collection
  subject:
  - compute_payment
  rule: The bank record confirms the remittance as completed. Record only a bank-confirmed remittance using a payment_methods
    rail and the amount actually received in currency. Customer consent to dispose of funds belongs to the customer;
    the agent only allocates a payment already confirmed by the bank. Apply an explicitly referenced invoice first;
    if the remittance omits allocation, use collection_order, sorting invoice_issued_at then source_event_id within
    the same customer and billing entity. Split across exact source invoice lines, never across legal billing entities.
    Each allocation is a separate negative payment amount linked to its original charge; any residual is an unallocated
    overpayment linked to the remittance reference. A repeated remittance reference and allocation target returns
    the existing posting. No receipt is inferred from a customer promise, and rejected or pending payments make
    no posting.
  eligibility:
  - id: confirmed_payment
    applies_to:
    - compute_payment
    kind: authorization
    condition: The bank record confirms the remittance as completed.
    evidence_fields:
    - compute_events.compute_event_id
    - compute_events.status
    - compute_events.external_reference
    - compute_events.method
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - compute_events.compute_event_id
      action_bindings:
        compute_events.compute_event_id: compute_event_id
  params:
    per_tier:
      Northbridge Virtual Compute 2 vCPU:
        payment_methods: =payment_methods
        currency: =currency
        collection_order: =collection_order
      Northbridge Virtual Compute 4 vCPU:
        payment_methods: =payment_methods
        currency: =currency
        collection_order: =collection_order
      Northbridge Virtual Compute 8 vCPU:
        payment_methods: =payment_methods
        currency: =currency
        collection_order: =collection_order
      Northbridge Virtual Compute 16 vCPU:
        payment_methods: =payment_methods
        currency: =currency
        collection_order: =collection_order
      Northbridge Virtual Compute 32 vCPU:
        payment_methods: =payment_methods
        currency: =currency
        collection_order: =collection_order
      Northbridge Virtual Compute 64 vCPU:
        payment_methods: =payment_methods
        currency: =currency
        collection_order: =collection_order
  measures:
  - compute_msr_net_receivable
- id: compute_evt_return
  subject:
  - compute_payment_return
  rule: The completed bank return notice refers to the exact original posted payment. The bank return must identify
    the exact posted payment. Restore the returned principal as a positive amount, up to the original payment amount
    not already returned. Copy its method, customer, billing entity and currency. A partial return uses the distinct
    bank notice external_reference. A duplicate bank notice produces no new write. Any failed_payment_fee is a separately
    identifiable return-fee charge under evt_fees, never hidden in returned principal; a waived fee produces no
    fee posting.
  eligibility:
  - id: bank_return
    applies_to:
    - compute_payment_return
    kind: authorization
    condition: The completed bank return notice refers to the exact original posted payment.
    evidence_fields:
    - compute_events.compute_event_id
    - compute_events.source_event_id
    - compute_events.status
    - compute_events.external_reference
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - compute_events.compute_event_id
        - compute_events.source_event_id
      action_bindings:
        compute_events.compute_event_id: compute_event_id
        compute_events.source_event_id: source_event_id
  params:
    per_tier:
      Northbridge Virtual Compute 2 vCPU:
        failed_payment_fee: =failed_payment_fee
      Northbridge Virtual Compute 4 vCPU:
        failed_payment_fee: =failed_payment_fee
      Northbridge Virtual Compute 8 vCPU:
        failed_payment_fee: =failed_payment_fee
      Northbridge Virtual Compute 16 vCPU:
        failed_payment_fee: =failed_payment_fee
      Northbridge Virtual Compute 32 vCPU:
        failed_payment_fee: =failed_payment_fee
      Northbridge Virtual Compute 64 vCPU:
        failed_payment_fee: =failed_payment_fee
  formula:
    returned_principal: abs(amount)
- id: compute_evt_refund
  subject:
  - compute_refund
  rule: The customer-authorized refund request and completed original payment refer to the same holding and source
    payment. The customer files an exact refund authorization; the agent refunds a confirmed overpayment only to
    the method and destination of its original payment. Available refund is the smaller of the negative net receivable
    magnitude and original payment principal less prior returns and refunds linked to that payment. A requested
    amount exceeding that limit is refused, not silently reduced. Use refund_methods, require at least refund_minimum,
    and record a positive receivable delta for cash paid out. A smaller positive balance remains on account. Refunds
    require no active service contract and remain possible after closure. Repetition of the same request and source
    payment returns the existing refund. A third-party destination or unconfirmed payment is refused.
  eligibility:
  - id: refund_consent
    applies_to:
    - compute_refund
    kind: authorization
    condition: The customer-authorized refund request and completed original payment refer to the same holding and
      source payment.
    evidence_fields:
    - compute_events.compute_event_id
    - compute_events.request_id
    - compute_events.source_event_id
    - compute_events.status
    - compute_events.compute_holding_id
    evidence_contract:
