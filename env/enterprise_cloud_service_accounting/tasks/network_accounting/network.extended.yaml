  rule: This fee branch applies only to setup, resumption, termination and return_fee source_subtype.
    Charge setup_fee once for an activated holding, resumption_fee per distinct completed
    restoration, termination_fee for on-demand exit, and failed_payment_fee per completed
    bank return. An unexpired commitment exit instead bills the recorded remaining_commitment_usd
    as its termination liability. Copy the exact source transition, customer authorization
    or bank notice reference; do not use a primary meter as fee evidence. A zero fee is waived
    without a financial event. The fee amount is the selected policy amount or recorded signed
    liability, rounded using amount_precision and rounding_mode, then taxed under evt_tax.
