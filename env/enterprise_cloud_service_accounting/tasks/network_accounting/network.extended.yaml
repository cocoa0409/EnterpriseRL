category: network
display_name: Enterprise Connectivity
binding:
  holding_table: network_holdings
  event_tables:
  - network_events
  status_field: status
  variant_field: variant_name
lifecycle:
  states:
  - applied
  - active
  - suspended
  - closed
  transitions:
  - from: applied
    to: active
    by: agent
    means: Activate the contract with the authoritative evidence required by the corresponding
      policy.
  - from: applied
    to: closed
    by: user
    means: Withdraw the contract with the authoritative evidence required by the corresponding
      policy.
  - from: active
    to: suspended
    by: agent
    means: Suspend the contract with the authoritative evidence required by the corresponding
      policy.
  - from: suspended
    to: active
    by: agent
    means: Resume the contract with the authoritative evidence required by the corresponding
      policy.
  - from: active
    to: closed
    by: user
    means: Close the contract with the authoritative evidence required by the corresponding
      policy.
  - from: suspended
    to: closed
    by: user
    means: Close suspended the contract with the authoritative evidence required by the corresponding
      policy.
accounts:
- key: receivable
  unit: USD
  meaning: 'Signed customer debt: service charges, upward adjustments, returned payments and
    refunds increase it; payments and credits decrease it.'
- key: primary_usage
  unit: gb_transferred
  meaning: Net primary physical consumption from positive meter and negative meter_reversal
    postings; quantities remain grouped by source service period for billing.
parameter_schema:
  currency: Invoice and settlement currency; ISO currency string.
  amount_precision: Monetary decimal places; integer.
  quantity_precision: Meter quantity decimal places; integer.
  rounding_mode: Decimal tie-breaking convention for monetary and quantity rounding; string.
  billing_timezone: Timezone used for calendar boundaries; IANA timezone string.
  billing_cycle: Recurring invoice window basis; string.
  invoice_due_days: Calendar days after invoice issue for payment maturity; integer.
  minimum_invoice_amount: Minimum positive monthly invoice total; USD decimal, smaller totals
    carry forward.
  region_factors: Map from service region to multiplicative usage rate factor; decimal mapping.
  tax_rates: Map from on-file US sales tax treatment to decimal rate; local taxable services
    only.
  setup_fee: One-time fee for a newly activated holding; USD decimal.
  termination_fee: Fee for terminating an on-demand holding, excluding accrued usage and commitment
    liability; USD decimal.
  resumption_fee: Fee for restoring a suspended holding; USD decimal.
  portfolio_threshold: Same-category posted pre-discount usage subtotal required within one
    billing entity and month for volume discount; USD decimal.
  portfolio_discount: Discount fraction when the portfolio threshold is met; decimal.
  reservation_discounts: Map from approved commitment term to discount fraction on covered
    primary usage; decimal mapping.
  promotion_discount: Discount fraction for a recorded eligible campaign on primary usage;
    decimal.
  promotion_channels: Channels eligible for campaign pricing; string list.
  authorized_channels: Supported customer request channels; string list.
  negotiated_rate_allowed: Whether an approved signed unit-rate amendment overrides the standard
    primary rate; boolean.
  discount_priority: Non-stacking selection order for primary-usage price; string list.
  credit_claim_days: Inclusive outage-claim filing period after the incident closes; calendar
    days integer.
  credit_cap_fraction: Maximum cumulative outage credit fraction of the source charge net
    service subtotal; decimal.
  sla_target_percent: Monthly availability percentage above which no outage credit is due;
    decimal.
  sla_credit_bands: Descending lower-inclusive availability thresholds and credit fractions
    below the SLA target; mapping list.
  outage_exclusions: Incident cause codes excluded from service credits; string list.
  payment_methods: Accepted remittance methods; string list.
  refund_methods: Refund destinations, restricted to the original payment rail; string list.
  refund_minimum: Minimum voluntary cash refund; USD decimal.
  failed_payment_fee: Fee per bank-confirmed returned remittance; USD decimal.
  suspension_grace_days: Calendar days after invoice maturity before collection suspension;
    integer.
  max_resources: Maximum provisioned resource count in one holding; integer.
  amendment_limit: Maximum accepted capacity amendments per holding in a UTC calendar month;
    integer.
  commitment_cancel_allowed: Whether customer termination forgives an unexpired signed commitment;
    boolean.
  usage_unit: Primary meter quantity unit; string.
  included_quantity: Primary meter quantity included per holding per complete month, prorated
    by active seconds; decimal.
  unit_rate: Standard primary usage rate in USD per usage_unit before region factors; decimal.
  meter_quantum: Smallest billable primary meter increment in usage_unit; positive decimal.
  minimum_quantity: Minimum primary quantity billed per measured resource interval; decimal.
  invoice_grouping: Invoice grouping keys within the customer portfolio; string list.
  collection_order: Default allocation of an unspecified remittance; deterministic string.
  overage_handling: Treatment of usage exceeding included allowance; string.
  committed_mbps: Private interconnect committed line capacity; Mbps integer.
  port_hour_rate: Dedicated interconnect port; USD per port-hour.
  included_transfer_gb: Internet outbound transfer included per holding per complete month;
    GB integer.
  same_region_rate: Same-region cross-zone transfer; USD per GB.
  cross_region_rate: Cross-region transfer; USD per GB.
  private_transfer_rate: Private interconnect outbound transfer; USD per GB.
  ingress_rate: External inbound transfer; USD per GB.
  nat_processing_rate: NAT gateway processing; USD per GB.
  nat_hour_rate: NAT gateway provisioned time; USD per hour.
  public_ipv4_rate: Allocated public IPv4 addresses; USD per address-hour.
  connection_setup_fee: New physical private connection provisioning; USD per connection.
  loadbalancer_rate: Load-balancer usage; USD per capacity-unit-hour.
