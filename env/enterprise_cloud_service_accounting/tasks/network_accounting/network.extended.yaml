extended_policies:
- id: network_ext_assess
  base_policy_refs:
  - network_evt_review
  - network_evt_service_credit
  - network_evt_pricing
  - network_evt_category_meters
  - network_evt_combination
  overwrite:
  - base_policy: network_evt_combination
    superseded_clause: A current Northbridge Enterprise Support holding for the same customer
      and billing entity provides assisted invoice explanation, but does not itself reduce
      this category price or waive debt.
    replaced_by: The assisted review discount is the smaller of the Network tier portfolio_discount
      and the matching Support fraction; it replaces other portfolio and promotion discounts
      for this review, and is zero for approved negotiated pricing.
  - base_policy: network_evt_pricing
    superseded_clause: 'For every quantity component choose the first applicable item in discount_priority:
      an approved negotiated rate when negotiated_rate_allowed, then the committed fraction,
      then a recorded eligible promotion from promotion_channels, then portfolio eligibility,
      then standard.'
    replaced_by: The assisted review discount is the smaller of the Network tier portfolio_discount
      and the matching Support fraction; it replaces other portfolio and promotion discounts
      for this review, and is zero for approved negotiated pricing.
  - base_policy: network_evt_pricing
    superseded_clause: Allocate included_quantity across primary meter sources of the same
      holding and period in interval_start then source_event_id order; prorate it by actual
      active UTC seconds divided by actual seconds in that UTC calendar month.
    replaced_by: Determine this one charge's corrected target from all of those monthly exports
      less one full included_transfer_gb allowance, with a zero floor, instead of assigning
      a separate remaining allowance to each contributing export.
  - base_policy: network_evt_pricing
    superseded_clause: Only the positive quantity beyond the remaining included allowance
      is charged.
    replaced_by: Determine this one charge's corrected target from all of those monthly exports
      less one full included_transfer_gb allowance, with a zero floor, instead of assigning
      a separate remaining allowance to each contributing export.
  - base_policy: network_evt_category_meters
    superseded_clause: An allowance is consumed chronologically by interval_start then source_event_id
      within the named holding and UTC period; reversal of its source returns only that source
      allocation.
    replaced_by: Determine this one charge's corrected target from all of those monthly exports
      less one full included_transfer_gb allowance, with a zero floor, instead of assigning
      a separate remaining allowance to each contributing export.
  trigger: state_due
  subject:
  - network_review
  computes: net_amount
  target_tool: assess_network_f148f79a
  rule: The assisted payout cycle handles the latest pending refund authorization on the selected
    holding by occurred_at; its latest timestamp must be unique, and its exact request identifier
    fixes the authorization throughout this cycle. Read related_event_id from that exact pending
    refund authorization to identify the rate-error review; unrelated historical reviews are
    not selected. Read source_event_id from that exact rate-error review to identify the original
    charge; the authorization's source payment must also refer to this same charge. Read period
    from the exact original posted charge; a review's period field cannot replace the charge's
    billing period. For the selected unresolved monthly-aggregate rate-error review, sum posted
    primary internet_egress meter quantity on this holding in the original charge's source_period;
    cancelled exports, supplemental meters and other periods are excluded. Read included_transfer_gb
    from the source interval tier. Floor the difference between measured quantity and that
    allowance at zero before applying any rate. Read unit_rate from that tier. Use negotiated_unit_rate
    only when negotiated_approval is approved, otherwise use the tier rate. Read the portfolio_discount
    fraction from the unique active Support holding for the same customer and billing_entity;
    use zero when there is none. The assisted review discount is the smaller of the Network
    tier portfolio_discount and the matching Support fraction; it replaces other portfolio
    and promotion discounts for this review, and is zero for approved negotiated pricing.
    Multiply the positive nonincluded quantity by the selected unit rate, then reduce that
    whole subtotal once by the assisted review discount; round only the final corrected net
    subtotal half-up to amount_precision decimal places. The source must be us_untaxed or
    verified_exempt and have approved tax evidence, so tax_amount is zero. The unique source
    charge is the one linked by the pending review source_event_id, and the meter period comes
    from that charge. For this monthly-aggregate rate-error review, the selected original
    charge is the sole posted primary internet_egress charge for its holding and UTC month,
    its recorded quantity and completed reconciliation both represent the total posted internet_egress
    quantity for that month, and the full month has ended. Its original source_event_id may
    identify one contributing export; that legacy locator does not restrict this aggregate
    charge to that export alone. Determine this one charge's corrected target from all of
    those monthly exports less one full included_transfer_gb allowance, with a zero floor,
    instead of assigning a separate remaining allowance to each contributing export. Keep
    the original charge identifier as the correction source; no new charge, meter allocation
    or meter reversal is created. Chronological source allocation and source-specific reversals
    continue to govern every charge outside this narrowly defined aggregate-review route.
    All contributing exports and the original charge must have the current holding tier and
    its unchanged commercial attributes, in us_east, with the holding active throughout that
    UTC month; therefore its full monthly allowance and current tier rate apply.
  params: {}
  prerequisite: []
  cross_category: &id012
  - category: support
    as: branch
    reads:
    - variant_name
    - status
    - billing_entity
    note: The matching active Support tier portfolio_discount provides the assisted accounting
      fraction.
  compute:
  - selected_request: LATEST('network_events','network_event_id',date_field='occurred_at',event_type='network_request',source_subtype='refund',status='pending')
  - selected_review: LATEST('network_events','related_event_id',date_field='occurred_at',event_type='network_request',source_subtype='refund',status='pending',network_event_id=selected_request)
  - source_charge: LATEST('network_events','source_event_id',date_field='occurred_at',event_type='network_review',cause='rate_error',network_event_id=selected_review)
  - source_period: LATEST('network_events','period',date_field='occurred_at',event_type='network_charge',status='posted',network_event_id=source_charge)
  - quantity: SUM('network_events','quantity',event_type='network_meter',status='posted',meter_code='internet_egress',source_subtype='primary',period=source_period)
  - allowance: P('included_transfer_gb')
  - billable: MX(quantity-allowance,0)
  - rate: P('unit_rate')
  - chosen_rate: F('negotiated_unit_rate') if F('negotiated_approval') == 'approved' else
      rate
  - support_fraction: (CPARAM('support','portfolio_discount',status='active',billing_entity=F('billing_entity')))
      or 0
  - discount: 0 if F('negotiated_approval') == 'approved' else MN(P('portfolio_discount'),support_fraction)
  - result: RND(billable*chosen_rate*(1-discount),P('amount_precision'))
  compute_basis:
    quantity: For the selected unresolved monthly-aggregate rate-error review, sum posted
      primary internet_egress meter quantity on this holding in the original charge's source_period;
      cancelled exports, supplemental meters and other periods are excluded.
    allowance: Read included_transfer_gb from the source interval tier.
    billable: Floor the difference between measured quantity and that allowance at zero before
      applying any rate.
    rate: Read unit_rate from that tier.
    chosen_rate: Use negotiated_unit_rate only when negotiated_approval is approved, otherwise
      use the tier rate.
    support_fraction: Read the portfolio_discount fraction from the unique active Support
      holding for the same customer and billing_entity; use zero when there is none.
    discount: The assisted review discount is the smaller of the Network tier portfolio_discount
      and the matching Support fraction; it replaces other portfolio and promotion discounts
      for this review, and is zero for approved negotiated pricing.
    result: Multiply the positive nonincluded quantity by the selected unit rate, then reduce
      that whole subtotal once by the assisted review discount; round only the final corrected
      net subtotal half-up to amount_precision decimal places. The source must be us_untaxed
      or verified_exempt and have approved tax evidence, so tax_amount is zero. The unique
      source charge is the one linked by the pending review source_event_id, and the meter
      period comes from that charge.
    selected_request: The assisted payout cycle handles the latest pending refund authorization
      on the selected holding by occurred_at; its latest timestamp must be unique, and its
      exact request identifier fixes the authorization throughout this cycle.
    selected_review: Read related_event_id from that exact pending refund authorization to
      identify the rate-error review; unrelated historical reviews are not selected.
    source_charge: Read source_event_id from that exact rate-error review to identify the
      original charge; the authorization's source payment must also refer to this same charge.
    source_period: Read period from the exact original posted charge; a review's period field
      cannot replace the charge's billing period.
  inputs:
    history:
    - table: network_events
      aggregate: sum
      field: amount
      filters:
        status: posted
    cross_category:
    - support
- id: network_ext_credit
  base_policy_refs:
  - network_evt_tax
  - network_evt_correction
  - network_evt_service_credit
  - network_evt_combination
  overwrite:
  - base_policy: network_evt_correction
    superseded_clause: Credit the positive overcharge, debit the positive undercharge, and
      make no write when equal.
    replaced_by: The immediate assisted correction is capped at the original source net subtotal
      multiplied by the matching Support portfolio_discount fraction; any excess requires
      a separately requested correction and is not due in this assistance cycle.
  - base_policy: network_evt_combination
    superseded_clause: A current Northbridge Enterprise Support holding for the same customer
      and billing entity provides assisted invoice explanation, but does not itself reduce
      this category price or waive debt.
    replaced_by: The immediate assisted correction is capped at the original source net subtotal
      multiplied by the matching Support portfolio_discount fraction; any excess requires
      a separately requested correction and is not due in this assistance cycle.
  trigger: state_due
  subject:
  - network_credit
  computes: amount
  target_tool: credit_network_4dd38821
  rule: The assisted payout cycle handles the latest pending refund authorization on the selected
    holding by occurred_at; its latest timestamp must be unique, and its exact request identifier
    fixes the authorization throughout this cycle. Read related_event_id from that exact pending
    refund authorization to identify the rate-error review; unrelated historical reviews are
    not selected. Read source_event_id from that exact rate-error review to identify the original
    charge; the authorization's source payment must also refer to this same charge. Read the
    posted net_amount of the exact original source_charge selected through the refund authorization
    and its rate-error review. Read net_amount only from the selected_review with that exact
    source_charge, status approved, decision incorrect and cause rate_error; pending reviews
    and all other reviews contribute zero. Sum the signed net_amount of posted correction
    credits and posted correction debit adjustments linked to source_charge; service-credit
    concessions, nonfinancial reviews and adjustments for other source charges are excluded.
    Read the portfolio_discount fraction from the unique active Support holding for the same
    customer and billing_entity; use zero when there is none. The immediate assisted correction
    is capped at the original source net subtotal multiplied by the matching Support portfolio_discount
    fraction; any excess requires a separately requested correction and is not due in this
    assistance cycle. Subtract the approved target from original net plus prior signed corrections,
    floor at zero, and take the smaller of this overcharge and the assisted cap before negating
    it; round only the final amount half-up to amount_precision decimal places. Zero overcharge
    has no posting. Tax remains zero for this untaxed source. Before an assisted correction
    is posted, complete the source rate-error review and use its approved corrected subtotal.
  params: {}
  prerequisite:
  - problem: network_ext_assess
    kind: value_input
    gate: target
    condition: Before an assisted correction is posted, complete the source rate-error review
      and use its approved corrected subtotal.
    policy_source: Before an assisted correction is posted, complete the source rate-error
      review and use its approved corrected subtotal.
    resolved_by: assess_network_f148f79a
    effect: The approved review contributes its corrected net subtotal to target.
  cross_category: *id012
  compute:
  - selected_request: LATEST('network_events','network_event_id',date_field='occurred_at',event_type='network_request',source_subtype='refund',status='pending')
  - selected_review: LATEST('network_events','related_event_id',date_field='occurred_at',event_type='network_request',source_subtype='refund',status='pending',network_event_id=selected_request)
  - source_charge: LATEST('network_events','source_event_id',date_field='occurred_at',event_type='network_review',cause='rate_error',network_event_id=selected_review)
  - original: SUM('network_events','net_amount',event_type='network_charge',status='posted',network_event_id=source_charge)
  - target: SUM('network_events','net_amount',event_type='network_review',network_event_id=selected_review,source_event_id=source_charge,status='approved',decision='incorrect',cause='rate_error')
  - prior: SUM('network_events','net_amount',event_type='network_credit',status='posted',source_subtype='correction',source_event_id=source_charge)+SUM('network_events','net_amount',event_type='network_debit_adjustment',status='posted',source_subtype='correction',source_event_id=source_charge)
  - support_fraction: (CPARAM('support','portfolio_discount',status='active',billing_entity=F('billing_entity')))
      or 0
  - cap: original*support_fraction
  - result: 0 if original+prior <= target else -RND(MN(MX(original+prior-target,0),cap),P('amount_precision'))
  compute_basis:
    original: Read the posted net_amount of the exact original source_charge selected through
      the refund authorization and its rate-error review.
    target: Read net_amount only from the selected_review with that exact source_charge, status
      approved, decision incorrect and cause rate_error; pending reviews and all other reviews
      contribute zero.
    prior: Sum the signed net_amount of posted correction credits and posted correction debit
      adjustments linked to source_charge; service-credit concessions, nonfinancial reviews
      and adjustments for other source charges are excluded.
    support_fraction: Read the portfolio_discount fraction from the unique active Support
      holding for the same customer and billing_entity; use zero when there is none.
    cap: The immediate assisted correction is capped at the original source net subtotal multiplied
      by the matching Support portfolio_discount fraction; any excess requires a separately
      requested correction and is not due in this assistance cycle.
    result: Subtract the approved target from original net plus prior signed corrections,
      floor at zero, and take the smaller of this overcharge and the assisted cap before negating
      it; round only the final amount half-up to amount_precision decimal places. Zero overcharge
      has no posting. Tax remains zero for this untaxed source.
    selected_request: The assisted payout cycle handles the latest pending refund authorization
      on the selected holding by occurred_at; its latest timestamp must be unique, and its
      exact request identifier fixes the authorization throughout this cycle.
    selected_review: Read related_event_id from that exact pending refund authorization to
      identify the rate-error review; unrelated historical reviews are not selected.
    source_charge: Read source_event_id from that exact rate-error review to identify the
      original charge; the authorization's source payment must also refer to this same charge.
  inputs:
    history:
    - table: network_events
      aggregate: sum
      field: amount
      filters:
        status: posted
    cross_category:
    - support
