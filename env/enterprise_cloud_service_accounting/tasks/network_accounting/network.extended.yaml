    external_reference: Exact resource, invoice, remittance or request reference from its
      authoritative record or the customer.
    source_event_id: Narrowest original event corrected, billed, credited, paid or refunded;
      empty for an independent source.
    related_event_id: Additional linked approval, incident or evidence event; empty when absent.
    request_id: Customer request event reference; empty where no customer request is needed.
    occurred_at: Authoritative event occurrence time in UTC.
    period: UTC calendar month of the service being billed.
    status: Processing state of this individual evidence or booking record.
    incident_closed_at: UTC time the official incident record was closed; empty for other
      events.
    cause: Official incident or adjustment cause classification.
    availability_percent: Measured service availability for the incident month, excluding
      expressly excluded intervals.
    duration_hours: Actual elapsed service, outage, response or consultant hours; never a
      policy constant.
    source_subtype: Business subtype distinguishing a source line.
  triggers: []
  distinguish_by:
  - external_reference
  - source_event_id
  - related_event_id
  - period
  - source_subtype
- type: network_service_record
  target: network_events
  meaning: The support desk records delivered reviews, response measurements, contact assignments
    or other nonfinancial entitlements.
  grain: One source resource interval, accounting line, or independently referenced service
    occurrence; derived lines retain the narrowest original event reference.
  fields:
    network_holding_id: Contract to which this event belongs.
    customer_id: Customer owning the event and the referenced contract.
    external_reference: Exact resource, invoice, remittance or request reference from its
      authoritative record or the customer.
    source_event_id: Narrowest original event corrected, billed, credited, paid or refunded;
      empty for an independent source.
    related_event_id: Additional linked approval, incident or evidence event; empty when absent.
    request_id: Customer request event reference; empty where no customer request is needed.
    occurred_at: Authoritative event occurrence time in UTC.
    period: UTC calendar month of the service being billed.
    status: Processing state of this individual evidence or booking record.
    source_subtype: Business subtype distinguishing a source line.
    meter_code: Exact supported category meter from the provider export; none on nonmeter
      events.
    quantity: Signed primary quantity on meter postings, otherwise the actual nonnegative
      measured quantity in quantity_unit.
    quantity_unit: Physical unit of the source quantity; none when no measured quantity applies.
    resource_count: Actual resources, contacts or operations measured for this event.
    duration_hours: Actual elapsed service, outage, response or consultant hours; never a
      policy constant.
    retention_days: Actual configured or elapsed retention relevant to the measurement.
    variant_name: Official tier that applied during this source service interval; historical
      tiers are preserved after amendments.
  triggers: []
  distinguish_by:
  - external_reference
  - source_event_id
  - related_event_id
  - period
  - meter_code
  - source_subtype
measures:
- id: network_msr_portfolio_usage
  window: The source period, a UTC calendar month; customer and billing_entity match the proposed
    charge.
  measure: Sum posted primary meter quantities net of meter_reversal by holding, multiply
    each interval by its applicable standard tier unit_rate and region factor without any
    discount or tax, and sum across this category. Exclude ancillary meters and never sum
    already discounted invoices.
- id: network_msr_net_receivable
  window: All posted financial events through the frozen handling time.
  measure: Sum signed amount for charge, debit_adjustment, payment_return and refund together
    with negative amount for payment and credit, grouped by holding. No independently writable
    balance is stored..
- id: network_msr_source_credits
  window: All posted credit and debit_adjustment events through the frozen handling time for
    the exact source_event_id.
  measure: For the exact original charge source_event_id, report correction_gross as absolute
    correction credit amount less debit-adjustment amount, and service_credit_net as absolute
    pretax net_amount of service-credit postings. Keep these two named components separate;
    tax is included only in correction_gross, and unrelated source charges never enter either
    component.
- id: network_msr_amendments
  window: UTC calendar month containing the frozen handling time.
  measure: Count completed request events of source_subtype amendment for this holding; cancelled
    and rejected requests do not count.
policies:
- id: network_agg_multi_holding
  subject:
  - network_open
  rule: The signed resource scope is not already represented by a nonclosed contract. Multiple
    independent resource scopes may be held. Use external_reference as the signed resource-scope
    key. Count all nonclosed holdings of this category for the same customer; refuse creation
    if the count would exceed max_per_customer. A repeated signed application with the same
    external resource scope reuses the existing contract rather than opening another.
  eligibility:
  - id: scope_unique
    applies_to:
    - network_open
    kind: authorization
    condition: The signed resource scope is not already represented by a nonclosed contract.
    evidence_fields:
    - network_holdings.network_holding_id
    - network_holdings.customer_id
    - network_holdings.status
    - network_holdings.external_reference
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - network_holdings.network_holding_id
        - network_holdings.customer_id
      action_bindings:
        network_holdings.network_holding_id: network_holding_id
        network_holdings.customer_id: customer_id
  params:
    max_per_customer: 24
- id: network_admission
  subject:
  - network_open
  rule: The signed application request has an approved service review. The customer signs
    and submits the application through an authorized_channels channel. Create status applied
    and opened_date from the frozen clock, with no consumption or charge. The requested tier
    supplies max_resources; reject unsupported regions, unsupported currency, resource counts
    above that limit, and unapproved contract terms without a write. The customer owns the
    signature; an agent cannot sign for them. Entry gates are evaluated against the authoritative
    signed application fields copied into the proposed holding.
  eligibility:
  - id: signed_approval
    applies_to:
    - network_open
    kind: authorization
    condition: The signed application request has an approved service review.
    evidence_fields:
    - network_events.network_event_id
    - network_events.request_id
    - network_events.status
    - network_events.decision
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - network_events.network_event_id
        - network_events.request_id
      action_bindings:
        network_events.network_event_id: network_event_id
        network_events.request_id: request_id
  params:
    per_tier:
      Northbridge Enterprise Connectivity 100 Mbps:
        max_resources: =max_resources
        currency: =currency
        authorized_channels: =authorized_channels
      Northbridge Enterprise Connectivity 250 Mbps:
        max_resources: =max_resources
        currency: =currency
        authorized_channels: =authorized_channels
      Northbridge Enterprise Connectivity 500 Mbps:
        max_resources: =max_resources
        currency: =currency
        authorized_channels: =authorized_channels
      Northbridge Enterprise Connectivity 1 Gbps:
        max_resources: =max_resources
        currency: =currency
        authorized_channels: =authorized_channels
      Northbridge Enterprise Connectivity 2 Gbps:
        max_resources: =max_resources
        currency: =currency
        authorized_channels: =authorized_channels
      Northbridge Enterprise Connectivity 5 Gbps:
        max_resources: =max_resources
        currency: =currency
        authorized_channels: =authorized_channels
- id: network_activation
  subject:
  - network_activate
  rule: The contract status is applied. The contract approval_status is approved. Activate
    an approved application after provisioning evidence confirms the configured resources;
    record activated_at from the frozen clock. Refuse rejected or pending applications. Setup
    is invoiced under evt_fees when setup_fee is positive; a waived setup fee creates no charge.
    Repeating an activation of an already active contract is a read-only confirmation, not
    another activation.
  eligibility:
  - id: contract_state
    applies_to:
    - network_activate
    kind: state
    condition: The contract status is applied.
    evidence_fields:
    - network_holdings.network_holding_id
    - network_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - network_holdings.network_holding_id
      action_bindings:
        network_holdings.network_holding_id: network_holding_id
    state_contract:
      field: network_holdings.status
      allowed:
      - applied
  - id: provisioning_approval
    applies_to:
    - network_activate
    kind: authorization
    condition: The contract approval_status is approved.
    evidence_fields:
    - network_holdings.network_holding_id
    - network_holdings.approval_status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - network_holdings.network_holding_id
      action_bindings:
        network_holdings.network_holding_id: network_holding_id
  params:
    per_tier:
      Northbridge Enterprise Connectivity 100 Mbps:
        setup_fee: =setup_fee
      Northbridge Enterprise Connectivity 250 Mbps:
        setup_fee: =setup_fee
      Northbridge Enterprise Connectivity 500 Mbps:
        setup_fee: =setup_fee
      Northbridge Enterprise Connectivity 1 Gbps:
        setup_fee: =setup_fee
      Northbridge Enterprise Connectivity 2 Gbps:
        setup_fee: =setup_fee
      Northbridge Enterprise Connectivity 5 Gbps:
        setup_fee: =setup_fee
- id: network_amendment
  subject:
  - network_amend
  rule: The contract status is active or suspended. The source amendment request is approved
    and customer-authorized. The customer files a signed amendment request before the agent
    applies the approved attributes. The request external_reference identifies the signed
    amendment; its related approved review carries the affected exact values and effective
    interval_start. Request and review events preserve those effective attributes. Keep status
    unchanged, use the new tier only for service intervals beginning at the request effective
    time, and retain old tier and effective price on earlier meter and invoice records. Refuse
    any change above max_resources or when msr_amendments has reached amendment_limit. Completed
    amendment requests count once; pending, rejected or cancelled requests do not change the
    holding. Signed commitments keep their recorded expiration and remaining contractual liability
    unless the signed amendment explicitly replaces them.
  eligibility:
  - id: contract_state
    applies_to:
    - network_amend
    kind: state
    condition: The contract status is active or suspended.
    evidence_fields:
    - network_holdings.network_holding_id
    - network_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - network_holdings.network_holding_id
      action_bindings:
        network_holdings.network_holding_id: network_holding_id
    state_contract:
      field: network_holdings.status
      allowed:
      - active
      - suspended
  - id: amendment_approved
    applies_to:
    - network_amend
    kind: authorization
    condition: The source amendment request is approved and customer-authorized.
    evidence_fields:
    - network_events.network_event_id
    - network_events.status
    - network_events.request_id
    - network_events.source_subtype
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - network_events.network_event_id
        - network_events.request_id
      action_bindings:
        network_events.network_event_id: network_event_id
        network_events.request_id: request_id
  params:
    per_tier:
      Northbridge Enterprise Connectivity 100 Mbps:
        max_resources: =max_resources
        amendment_limit: =amendment_limit
        negotiated_rate_allowed: =negotiated_rate_allowed
      Northbridge Enterprise Connectivity 250 Mbps:
        max_resources: =max_resources
        amendment_limit: =amendment_limit
        negotiated_rate_allowed: =negotiated_rate_allowed
      Northbridge Enterprise Connectivity 500 Mbps:
        max_resources: =max_resources
        amendment_limit: =amendment_limit
        negotiated_rate_allowed: =negotiated_rate_allowed
      Northbridge Enterprise Connectivity 1 Gbps:
        max_resources: =max_resources
        amendment_limit: =amendment_limit
        negotiated_rate_allowed: =negotiated_rate_allowed
      Northbridge Enterprise Connectivity 2 Gbps:
        max_resources: =max_resources
        amendment_limit: =amendment_limit
        negotiated_rate_allowed: =negotiated_rate_allowed
      Northbridge Enterprise Connectivity 5 Gbps:
        max_resources: =max_resources
        amendment_limit: =amendment_limit
        negotiated_rate_allowed: =negotiated_rate_allowed
  measures:
  - network_msr_amendments
- id: network_evt_request
  subject:
  - network_request
  rule: Only the customer may file or cancel an authorization, claim or disposal request.
    Preserve the exact external_reference and the narrowest source_event_id. Set notice_at
    and occurred_at to the frozen clock and status pending on filing; cancellation is a new
    request event with status cancelled linked to the original request. An unsupported channel
    is refused. A repeated identical request reference returns the existing event. Filing
    a request never confirms a system approval or changes an accounting balance.
  eligibility: []
  params:
    per_tier:
      Northbridge Enterprise Connectivity 100 Mbps:
        authorized_channels: =authorized_channels
      Northbridge Enterprise Connectivity 250 Mbps:
        authorized_channels: =authorized_channels
      Northbridge Enterprise Connectivity 500 Mbps:
        authorized_channels: =authorized_channels
      Northbridge Enterprise Connectivity 1 Gbps:
        authorized_channels: =authorized_channels
      Northbridge Enterprise Connectivity 2 Gbps:
        authorized_channels: =authorized_channels
      Northbridge Enterprise Connectivity 5 Gbps:
        authorized_channels: =authorized_channels
- id: network_evt_meter
  subject:
  - network_meter
  - network_meter_reversal
  - network_supplemental_meter
  rule: The authoritative export confirms the resource interval and the measured quantity.
    Meters originate in the provider resource export. Primary meter quantities use usage_unit;
    a meter is positive and a meter_reversal is the negative of the exact erroneous source
    quantity, capped by the source quantity not already reversed. Keep original interval,
    region, configuration and source reference. bill_actual overage permits measured quantities
    above included_quantity; no service entitlement is invented by a meter write. Round measured
    quantities to quantity_precision using rounding_mode, apply minimum_quantity and round
    positive billable primary quantities upward to a whole meter_quantum. Stopped or suspended
    service accrues no primary running usage, but real retained storage and other supplemental
    services remain billable through supplemental_meter. A rejected or cancelled source is
    not a billable meter. Repeated exports with the same resource, meter, interval and correction
    reference are read-only confirmations.
  eligibility:
  - id: export_evidence
    applies_to:
    - network_meter
    - network_meter_reversal
    - network_supplemental_meter
    kind: authorization
    condition: The authoritative export confirms the resource interval and the measured quantity.
    evidence_fields:
    - network_events.network_event_id
    - network_events.external_reference
    - network_events.interval_start
    - network_events.interval_end
    - network_events.quantity
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - network_events.network_event_id
      action_bindings:
        network_events.network_event_id: network_event_id
  params:
    per_tier:
      Northbridge Enterprise Connectivity 100 Mbps:
        usage_unit: =usage_unit
        quantity_precision: =quantity_precision
        rounding_mode: =rounding_mode
        meter_quantum: =meter_quantum
        minimum_quantity: =minimum_quantity
        overage_handling: =overage_handling
        included_quantity: =included_quantity
      Northbridge Enterprise Connectivity 250 Mbps:
        usage_unit: =usage_unit
        quantity_precision: =quantity_precision
        rounding_mode: =rounding_mode
        meter_quantum: =meter_quantum
        minimum_quantity: =minimum_quantity
        overage_handling: =overage_handling
        included_quantity: =included_quantity
      Northbridge Enterprise Connectivity 500 Mbps:
        usage_unit: =usage_unit
        quantity_precision: =quantity_precision
        rounding_mode: =rounding_mode
        meter_quantum: =meter_quantum
        minimum_quantity: =minimum_quantity
        overage_handling: =overage_handling
        included_quantity: =included_quantity
      Northbridge Enterprise Connectivity 1 Gbps:
        usage_unit: =usage_unit
        quantity_precision: =quantity_precision
        rounding_mode: =rounding_mode
        meter_quantum: =meter_quantum
        minimum_quantity: =minimum_quantity
        overage_handling: =overage_handling
        included_quantity: =included_quantity
      Northbridge Enterprise Connectivity 2 Gbps:
        usage_unit: =usage_unit
        quantity_precision: =quantity_precision
        rounding_mode: =rounding_mode
        meter_quantum: =meter_quantum
        minimum_quantity: =minimum_quantity
        overage_handling: =overage_handling
        included_quantity: =included_quantity
      Northbridge Enterprise Connectivity 5 Gbps:
        usage_unit: =usage_unit
        quantity_precision: =quantity_precision
        rounding_mode: =rounding_mode
        meter_quantum: =meter_quantum
        minimum_quantity: =minimum_quantity
        overage_handling: =overage_handling
        included_quantity: =included_quantity
  formula:
    metered_quantity: max(quantity, minimum_quantity)
- id: network_agg_usage
  subject:
  - network_charge
  rule: Use msr_portfolio_usage to select the portfolio discount. Combine only holdings of
    this category owned by the same customer with the same billing_entity and source period,
    even if some have since closed. No cross-entity or cross-category spending counts. The
    threshold comparison is inclusive. Portfolio discount applies only to primary service
    usage and only if no higher-priority price applies; it is neither a cash credit nor a
    deduction from ancillary service fees.
  eligibility: []
  params:
    per_tier:
      Northbridge Enterprise Connectivity 100 Mbps:
        portfolio_threshold: =portfolio_threshold
        portfolio_discount: =portfolio_discount
        invoice_grouping: =invoice_grouping
      Northbridge Enterprise Connectivity 250 Mbps:
        portfolio_threshold: =portfolio_threshold
        portfolio_discount: =portfolio_discount
        invoice_grouping: =invoice_grouping
      Northbridge Enterprise Connectivity 500 Mbps:
        portfolio_threshold: =portfolio_threshold
        portfolio_discount: =portfolio_discount
        invoice_grouping: =invoice_grouping
      Northbridge Enterprise Connectivity 1 Gbps:
        portfolio_threshold: =portfolio_threshold
        portfolio_discount: =portfolio_discount
        invoice_grouping: =invoice_grouping
      Northbridge Enterprise Connectivity 2 Gbps:
        portfolio_threshold: =portfolio_threshold
        portfolio_discount: =portfolio_discount
        invoice_grouping: =invoice_grouping
      Northbridge Enterprise Connectivity 5 Gbps:
        portfolio_threshold: =portfolio_threshold
        portfolio_discount: =portfolio_discount
        invoice_grouping: =invoice_grouping
  measures:
  - network_msr_portfolio_usage
- id: network_evt_pricing
  subject:
  - network_charge
  rule: 'This policy and its gate apply only to primary usage source_subtype; category-specific
    primary pricing overrides expressly stated in evt_category_meters take priority. For source_subtype
    primary, the source meter is posted and identifies the billed resource interval. This
    gate is inapplicable to other source_subtype values. Use the tier recorded for each source
    service interval. Read unit_rate and region_factors for primary usage. Allocate included_quantity
    across primary meter sources of the same holding and period in interval_start then source_event_id
    order; prorate it by actual active UTC seconds divided by actual seconds in that UTC calendar
    month. Only the positive quantity beyond the remaining included allowance is charged.
    Allocate committed_quantity in that same order, splitting covered and uncovered primary
    quantities into distinguishable invoice lines. The holding commitment must cover the entire
    source interval to receive reservation_discounts; a boundary-crossing interval is split
    at the recorded commitment boundary. For every quantity component choose the first applicable
    item in discount_priority: an approved negotiated rate when negotiated_rate_allowed, then
    the committed fraction, then a recorded eligible promotion from promotion_channels, then
    portfolio eligibility, then standard. The negotiated rate replaces the primary unit_rate
    before applying the region factor and receives no further discount. Promotions and reservations
    are mutually exclusive. Round the final service subtotal using amount_precision and rounding_mode
    after quantity multiplication, then apply evt_tax. No discount applies to taxes, license
    fees, standalone supplemental services or previously issued credits. Record pricing_component
    for each split quantity branch; it is part of the invoice-line identity. Do not apply
    a billing-period portfolio discount to a partial source interval before the full source
    period is closed.'
  eligibility:
  - id: posted_meter
    applies_to:
    - network_charge
    kind: authorization
    condition: For source_subtype primary, the source meter is posted and identifies the billed
      resource interval. This gate is inapplicable to other source_subtype values.
    evidence_fields:
    - network_events.network_event_id
    - network_events.status
    - network_events.interval_start
    - network_events.interval_end
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - network_events.network_event_id
      action_bindings:
        network_events.network_event_id: network_event_id
  params:
    per_tier:
      Northbridge Enterprise Connectivity 100 Mbps:
        unit_rate: =unit_rate
        region_factors: =region_factors
        included_quantity: =included_quantity
        reservation_discounts: =reservation_discounts
        promotion_discount: =promotion_discount
        promotion_channels: =promotion_channels
        negotiated_rate_allowed: =negotiated_rate_allowed
        discount_priority: =discount_priority
        amount_precision: =amount_precision
        rounding_mode: =rounding_mode
        billing_timezone: =billing_timezone
        billing_cycle: =billing_cycle
      Northbridge Enterprise Connectivity 250 Mbps:
        unit_rate: =unit_rate
        region_factors: =region_factors
        included_quantity: =included_quantity
        reservation_discounts: =reservation_discounts
        promotion_discount: =promotion_discount
        promotion_channels: =promotion_channels
        negotiated_rate_allowed: =negotiated_rate_allowed
        discount_priority: =discount_priority
        amount_precision: =amount_precision
        rounding_mode: =rounding_mode
        billing_timezone: =billing_timezone
        billing_cycle: =billing_cycle
      Northbridge Enterprise Connectivity 500 Mbps:
        unit_rate: =unit_rate
        region_factors: =region_factors
        included_quantity: =included_quantity
        reservation_discounts: =reservation_discounts
        promotion_discount: =promotion_discount
        promotion_channels: =promotion_channels
        negotiated_rate_allowed: =negotiated_rate_allowed
        discount_priority: =discount_priority
        amount_precision: =amount_precision
        rounding_mode: =rounding_mode
        billing_timezone: =billing_timezone
        billing_cycle: =billing_cycle
      Northbridge Enterprise Connectivity 1 Gbps:
        unit_rate: =unit_rate
        region_factors: =region_factors
        included_quantity: =included_quantity
        reservation_discounts: =reservation_discounts
        promotion_discount: =promotion_discount
        promotion_channels: =promotion_channels
        negotiated_rate_allowed: =negotiated_rate_allowed
        discount_priority: =discount_priority
        amount_precision: =amount_precision
        rounding_mode: =rounding_mode
        billing_timezone: =billing_timezone
        billing_cycle: =billing_cycle
      Northbridge Enterprise Connectivity 2 Gbps:
        unit_rate: =unit_rate
        region_factors: =region_factors
        included_quantity: =included_quantity
        reservation_discounts: =reservation_discounts
        promotion_discount: =promotion_discount
        promotion_channels: =promotion_channels
        negotiated_rate_allowed: =negotiated_rate_allowed
        discount_priority: =discount_priority
        amount_precision: =amount_precision
        rounding_mode: =rounding_mode
        billing_timezone: =billing_timezone
        billing_cycle: =billing_cycle
      Northbridge Enterprise Connectivity 5 Gbps:
        unit_rate: =unit_rate
        region_factors: =region_factors
        included_quantity: =included_quantity
        reservation_discounts: =reservation_discounts
        promotion_discount: =promotion_discount
        promotion_channels: =promotion_channels
        negotiated_rate_allowed: =negotiated_rate_allowed
        discount_priority: =discount_priority
        amount_precision: =amount_precision
        rounding_mode: =rounding_mode
        billing_timezone: =billing_timezone
        billing_cycle: =billing_cycle
  formula:
    unrounded_service_subtotal: max(quantity - included_quantity_applied, 0) * unit_rate *
      (1 - discount_fraction)
- id: network_evt_combination
  subject:
  - network_charge
  rule: A current Northbridge Enterprise Support holding for the same customer and billing
    entity provides assisted invoice explanation, but does not itself reduce this category
    price or waive debt. An approved negotiated rate is a contract-specific override; the
    presence of a paid support holding makes assisted negotiated-amendment intake available
    through support as well as portal and api. Without that combination the signed amendment
    is submitted through portal or api. A promotional primary-price entitlement is suppressed
    wherever a commitment price covers the same quantity, and no benefit from an unrelated
    category is stacked. The combination changes only request-channel eligibility, not approval
    authority.
