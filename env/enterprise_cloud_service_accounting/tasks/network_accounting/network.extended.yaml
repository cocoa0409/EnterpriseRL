    follow billing_cycle in billing_timezone, beginning at the first instant of the first
    date and ending exclusively at the first instant of the next month. For measured usage,
    invoice only services whose interval has ended; lifecycle fees instead require their source
    occurrence to be completed; use the posted authoritative source records. Set invoice_issued_at
    to the frozen handling time. Carry forward a positive grouped subtotal below minimum_invoice_amount
    rather than issuing an invoice; zero-rated usage stays visible as a meter and receives
    no monetary charge. A source charge already posted for the same source event, meter, quantity
    component and invoice period is returned without another charge. The fixed source reference
    and source_subtype distinguish primary, supplemental, setup, termination, resumption and
