- id: network_evt_review
  subject:
  - network_review
  rule: The source event and the evidence record identify the same holding and narrowest business
    object. A service accountant reviews one precise source event against its authoritative
    export, contract terms, bank notice, tax record or incident record. Record decision correct
    or incorrect for a billing review, and eligible or ineligible for an outage claim; status
    approved means the review is complete and authoritative, not that a credit necessarily
    follows. Record corrected net_amount and tax_amount for incorrect billing, or credited_amount
    for an eligible outage after applying evt_service_credit. A rejected review cannot authorize
    money movement. The customer may provide a locator but cannot dictate an official decision.
    Repeating the same source and request review returns the existing decision; materially
    new evidence is a distinct review linked through related_event_id. Review alone books
    no money.
  eligibility:
  - id: reviewable_source
    applies_to:
    - network_review
    kind: authorization
    condition: The source event and the evidence record identify the same holding and narrowest
      business object.
    evidence_fields:
    - network_events.network_event_id
    - network_events.source_event_id
    - network_events.related_event_id
    - network_events.network_holding_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - network_events.network_event_id
        - network_events.source_event_id
        - network_events.related_event_id
        - network_events.network_holding_id
      action_bindings:
        network_events.network_event_id: network_event_id
        network_events.source_event_id: source_event_id
        network_events.related_event_id: related_event_id
        network_events.network_holding_id: network_holding_id
  params: {}
- id: network_evt_correction
  subject:
  - network_credit
  - network_debit_adjustment
  rule: For source_subtype correction, the source charge has an approved review with decision
    incorrect. This gate is inapplicable to other source_subtype values. Correct an erroneous
    charge to the approved review net_amount plus tax_amount, following evt_tax. Compare that
    corrected gross amount with the source original gross amount less cumulative correction
    credits plus cumulative debit adjustments; do not include service-credit concessions in
    this correction comparison. Credit the positive overcharge, debit the positive undercharge,
    and make no write when equal. A credit amount is negative and its net and tax components
    preserve the source proportions except an approved tax correction. An upward correction
    carries positive amount. Return the existing adjustment when the reviewed target has already
    been achieved. No cash refund is implicit in an invoice correction. Link source_event_id
    to the original charge and related_event_id to the approved review, never to a broad invoice
    containing several lines. Use correction_gross from msr_source_credits for the correction
    comparison; service_credit_net never changes the approved corrected billing target.
  eligibility:
  - id: approved_correction
    applies_to:
    - network_credit
    - network_debit_adjustment
    kind: authorization
    condition: For source_subtype correction, the source charge has an approved review with
      decision incorrect. This gate is inapplicable to other source_subtype values.
