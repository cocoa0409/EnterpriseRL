- id: network_evt_tax
  subject:
  - network_charge
  - network_credit
  - network_debit_adjustment
  rule: The applicable tax classification has an approved system review. Use the source contract
    tax_treatment reviewed at the service date and tax_rates. Apply tax to the final rounded
    net service amount; round tax separately using amount_precision and rounding_mode. For
    a correction or credit use the original charge tax basis unless an approved tax-error
    review supplies the corrected treatment. Tax credits have negative tax_amount; charges
    and upward adjustments have positive tax_amount. Unsupported tax jurisdictions are POLICY_NOT_COVERED,
    not assumed exempt. Sum net subtotal and signed tax to obtain the financial amount. A
    verified exemption overrides the ordinary taxable rate; there is no stacking of tax treatments.
  eligibility:
  - id: tax_evidence
    applies_to:
    - network_charge
    - network_credit
    - network_debit_adjustment
    kind: authorization
    condition: The applicable tax classification has an approved system review.
    evidence_fields:
    - network_holdings.network_holding_id
    - network_holdings.tax_review_status
