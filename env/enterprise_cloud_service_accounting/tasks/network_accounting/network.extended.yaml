  formula:
    maximum_balance_refund: max(0, -network_msr_net_receivable)
- id: network_suspension
  subject:
  - network_suspend
  rule: The contract status is active. Collection suspension occurs no earlier than invoice_due_days
    plus suspension_grace_days after the source invoice is issued. The contract payment_status
    is restricted and the source invoice retains unpaid principal. Add invoice_due_days and
    then suspension_grace_days UTC calendar dates to invoice_issued_at, preserving its time
    of day; do not use business days or replace the anchor with contract activation. Equality
    qualifies. The source overdue invoice must retain a positive unpaid principal; a fully
    paid invoice cannot justify suspension. Earlier handling sends an informational explanation
    without a status change. An agent suspends active service only when official payment_status
    is restricted; ordinary billing disputes alone do not suspend service. Retained ancillary
    resources can still produce actual supplemental usage. Repeated handling of an already
    suspended contract makes no new transition.
  eligibility:
  - id: contract_state
    applies_to:
    - network_suspend
    kind: state
    condition: The contract status is active.
    evidence_fields:
    - network_holdings.network_holding_id
    - network_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - network_holdings.network_holding_id
      action_bindings:
        network_holdings.network_holding_id: network_holding_id
    state_contract:
      field: network_holdings.status
      allowed:
      - active
  - id: collection_deadline
    applies_to:
    - network_suspend
    kind: time
    condition: Collection suspension occurs no earlier than invoice_due_days plus suspension_grace_days
      after the source invoice is issued.
    evidence_fields:
    - network_events.network_event_id
    - network_events.invoice_issued_at
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - network_events.network_event_id
      action_bindings:
        network_events.network_event_id: network_event_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the source invoice is issued
      anchor_source: network_events.invoice_issued_at
      relation: not_before
      duration_source: params.total_collection_days
      unit: calendar_days
      counting_rule: Add invoice_due_days and then suspension_grace_days UTC calendar dates
        to invoice_issued_at, preserving its time of day; do not use business days or replace
        the anchor with contract activation.
      boundary: inclusive
  - id: collection_restriction
    applies_to:
    - network_suspend
    kind: authorization
    condition: The contract payment_status is restricted and the source invoice retains unpaid
      principal.
    evidence_fields:
    - network_holdings.network_holding_id
    - network_holdings.payment_status
    - network_events.network_event_id
    - network_events.amount
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - network_holdings.network_holding_id
        - network_events.network_event_id
      action_bindings:
        network_holdings.network_holding_id: network_holding_id
