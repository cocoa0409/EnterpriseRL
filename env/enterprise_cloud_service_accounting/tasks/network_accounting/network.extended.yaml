workflows:
- id: network_assisted_invoice
  scenario: An on-demand, non-negotiated monthly internet transfer bundle has completed provider
    exports and awaits customer-authorized assisted invoicing. Completion yields the accepted
    source net invoice and its separately identifiable statutory tax debit.
  steps:
  - tool: authorize_network_11d4a76e
    owner: user
    writes: network_events
    subject: network_request
    base_policy_refs:
    - network_evt_request
    - network_evt_service_credit
    role: Customer accepts a bounded invoice ceiling
    computed_by:
    - network_ext_authorize
    requires_external_wait: false
    zero_wait_proof: initial_state_preexisting completed export, signoff and unsigned form;
      current_user_input exact acceptance reference and presented ceiling. The customer signs
      and files that existing form synchronously, retaining its query-visible identifier and
      returning the actual filing receipt; no later approval or external event is required.
  - tool: price_network_84b98f50
    owner: agent
    writes: network_events
    subject: network_review
    base_policy_refs:
    - network_evt_review
    - network_evt_service_credit
    role: Accountant determines accepted source net
    computed_by:
    - network_ext_price
    requires_external_wait: false
    zero_wait_proof: prior_synchronous_tool_effect customer filing changes the unsigned form
      into a pending request with its accepted ceiling; initial_state_preexisting source export,
      tier and tax evidence. The form identifier was query-visible, but the accepted monetary
      input exists only after the real customer action and is confirmed by its actual receipt.
  - tool: invoice_network_9ee25cfe
    owner: agent
    writes: network_events
    subject: network_charge
    base_policy_refs:
    - network_agg_usage
    - network_evt_pricing
    - network_evt_combination
    - network_evt_tax
    - network_evt_invoice
    - network_evt_fees
    - network_evt_category_meters
    role: Issue the net invoice component
    computed_by:
    - network_ext_invoice
    requires_external_wait: false
    zero_wait_proof: prior_synchronous_tool_effect approved source assessment; initial_state_preexisting
      source completion and unbilled-component evidence. The invoice tool creates its real
      net receivable entry immediately from the approved assessment, yielding the exact invoice
      identifier before return.
  - tool: tax_network_645ca35d
    owner: agent
    writes: network_events
    subject: network_debit_adjustment
    base_policy_refs:
    - network_evt_tax
    - network_evt_correction
    role: Complete the exact invoice statutory tax
    computed_by:
    - network_ext_tax
    requires_external_wait: false
    zero_wait_proof: prior_synchronous_tool_effect posted net invoice and receipt; initial_state_preexisting
      approved source tax treatment. The tax debit is computed from the issued rounded net
      and posted immediately against its actual invoice identifier; no publication, clearing
      or future billing batch is awaited.
  prerequisite: []
  order_rationale: Customer acceptance must precede pricing because its net ceiling bounds
    the assessed amount. Assessment must precede net issuance because only an approved assessment
    contributes assessed net. Net issuance must precede tax because tax is computed on that
    actually issued amount and attaches to its identifier. All four effects are immediate
    desk or customer account actions over preexisting exports; none waits for outside work.
  dataflow:
  - from_step: 0
    to_step: 1
    kind: object_binding
    source_table: network_events
    source_field: network_event_id
    consumer_bindings:
    - action_arg: request_id
      role: direct
    note: The stable form identifier exists before signing; the first step changes its business
      state and accepted amount, and returns that same identifier. Identity availability does
      not establish completed customer acceptance.
  - from_step: 1
    to_step: 2
    kind: object_binding
    source_table: network_events
    source_field: network_event_id
    consumer_bindings:
    - action_arg: related_event_id
      role: direct
  - from_step: 2
    to_step: 3
    kind: object_binding
    source_table: network_events
    source_field: network_event_id
    consumer_bindings:
    - action_arg: source_event_id
      role: direct
  requires_external_wait: false
  zero_wait_proof: The full-month provider export and its signoff exist before the consultation.
    The customer files the acceptance immediately after handover; the accountant computes
    the assessment from that acceptance and the recorded export, issues the net invoice, and
    posts tax from that actual invoice. These are current_user_input and real prior_synchronous_tool_effect
    facts over initial_state_preexisting evidence, all completed at the same frozen_time without
    outside processing or elapsed time.
