      Northbridge Enterprise Connectivity 2 Gbps:
        payment_methods: =payment_methods
        currency: =currency
        collection_order: =collection_order
      Northbridge Enterprise Connectivity 5 Gbps:
        payment_methods: =payment_methods
        currency: =currency
        collection_order: =collection_order
  measures:
  - network_msr_net_receivable
- id: network_evt_return
  subject:
  - network_payment_return
  rule: The completed bank return notice refers to the exact original posted payment. The
    bank return must identify the exact posted payment. Restore the returned principal as
    a positive amount, up to the original payment amount not already returned. Copy its method,
    customer, billing entity and currency. A partial return uses the distinct bank notice
    external_reference. A duplicate bank notice produces no new write. Any failed_payment_fee
    is a separately identifiable return-fee charge under evt_fees, never hidden in returned
    principal; a waived fee produces no fee posting.
  eligibility:
  - id: bank_return
    applies_to:
    - network_payment_return
    kind: authorization
    condition: The completed bank return notice refers to the exact original posted payment.
    evidence_fields:
    - network_events.network_event_id
    - network_events.source_event_id
    - network_events.status
    - network_events.external_reference
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - network_events.network_event_id
        - network_events.source_event_id
      action_bindings:
        network_events.network_event_id: network_event_id
        network_events.source_event_id: source_event_id
  params:
    per_tier:
      Northbridge Enterprise Connectivity 100 Mbps:
        failed_payment_fee: =failed_payment_fee
      Northbridge Enterprise Connectivity 250 Mbps:
        failed_payment_fee: =failed_payment_fee
      Northbridge Enterprise Connectivity 500 Mbps:
        failed_payment_fee: =failed_payment_fee
      Northbridge Enterprise Connectivity 1 Gbps:
        failed_payment_fee: =failed_payment_fee
      Northbridge Enterprise Connectivity 2 Gbps:
        failed_payment_fee: =failed_payment_fee
      Northbridge Enterprise Connectivity 5 Gbps:
        failed_payment_fee: =failed_payment_fee
  formula:
    returned_principal: abs(amount)
- id: network_evt_refund
  subject:
  - network_refund
  rule: The customer-authorized refund request and completed original payment refer to the
    same holding and source payment. The customer files an exact refund authorization; the
    agent refunds a confirmed overpayment only to the method and destination of its original
    payment. Available refund is the smaller of the negative net receivable magnitude and
    original payment principal less prior returns and refunds linked to that payment. A requested
    amount exceeding that limit is refused, not silently reduced. Use refund_methods, require
    at least refund_minimum, and record a positive receivable delta for cash paid out. A smaller
    positive balance remains on account. Refunds require no active service contract and remain
    possible after closure. Repetition of the same request and source payment returns the
    existing refund. A third-party destination or unconfirmed payment is refused.
  eligibility:
  - id: refund_consent
    applies_to:
    - network_refund
    kind: authorization
    condition: The customer-authorized refund request and completed original payment refer
      to the same holding and source payment.
    evidence_fields:
