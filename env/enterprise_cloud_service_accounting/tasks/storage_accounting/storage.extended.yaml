workflows:
- id: storage_outage_refund_workflow
  scenario: A customer seeks return of excess cash on an untaxed storage invoice with a completed provider
    incident and one completed original payment. The terminal state contains the adjudicated service concession
    and the customer-authorized original-destination refund.
  steps:
  - tool: file_storage_outage_claim_6a92fd5d
    owner: user
    writes: storage_events
    subject: storage_request
    base_policy_refs:
    - storage_evt_request
    - storage_evt_service_credit
    role: customer claim amount
    computed_by:
    - storage_ext_outage_claim
  - tool: assess_storage_outage_30bc4acc
    owner: agent
    writes: storage_events
    subject: storage_review
    base_policy_refs:
    - storage_evt_review
    - storage_evt_service_credit
    role: accountant approved concession
    computed_by:
    - storage_ext_outage_review
  - tool: post_storage_service_concession_cfd2170f
    owner: agent
    writes: storage_events
    subject: storage_credit
    base_policy_refs:
    - storage_evt_tax
    - storage_evt_correction
    - storage_evt_service_credit
    role: signed concession credit
    computed_by:
    - storage_ext_outage_credit
  - tool: authorize_storage_refund_9b3e6afe
    owner: user
    writes: storage_events
    subject: storage_request
    base_policy_refs:
    - storage_evt_request
    - storage_evt_service_credit
    role: customer exact refund authorization
    computed_by:
    - storage_ext_outage_authorize
  - tool: refund_storage_overpayment_1b2c5ab5
    owner: agent
    writes: storage_events
    subject: storage_refund
    base_policy_refs:
    - storage_evt_refund
    role: cash refund
    computed_by:
    - storage_ext_outage_refund
  dataflow:
  - from_step: 0
    to_step: 1
    kind: object_binding
    source_table: storage_events
    source_field: request_id
    consumer_bindings:
    - action_arg: request_id
      role: direct
  - from_step: 1
    to_step: 2
    kind: object_binding
    source_table: storage_events
    source_field: storage_event_id
    consumer_bindings:
    - action_arg: related_event_id
      role: direct
  - from_step: 2
    to_step: 3
    kind: object_binding
    source_table: storage_events
    source_field: storage_event_id
    consumer_bindings:
    - action_arg: related_event_id
      role: direct
  - from_step: 3
    to_step: 4
    kind: object_binding
    source_table: storage_events
    source_field: request_id
    consumer_bindings:
    - action_arg: request_id
      role: authorization
      policy_id: storage_evt_refund
      eligibility_id: refund_consent
      gate_field: storage_events.request_id
  order_rationale: The customer claim is the basis of the accountant assessment; an unfiled claim supplies
    no claimed amount. The approved assessment is the basis of the financial concession; an unapproved result
    supplies no money authority. The concession must be posted before its resulting cash balance can be authorized.
    The exact customer authorization must exist before its cash payout. Each action is a synchronous filing,
    accountant calculation or financial booking against a completed report/payment; no physical or external
    event is manufactured.
  prerequisite: []
