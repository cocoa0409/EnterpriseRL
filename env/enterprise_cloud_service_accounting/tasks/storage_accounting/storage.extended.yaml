extended_policies:
- id: storage_ext_capacity_entitlement
  base_policy_refs:
  - storage_evt_category_meters
  overwrite:
  - base_policy: storage_evt_category_meters
    superseded_clause: Completed service records prove nonfinancial entitlements;
    replaced_by: For the cool-storage correction branch, a completed service record grants the calculated shared
      backup capacity as a nonfinancial storage allowance for its exact source charge.
  trigger: on_request
  subject:
  - storage_service_record
  computes: quantity
  target_tool: record_capacity_entitlement_88579e54
  rule: For a cool-storage correction, sum quantity of completed supplemental cool_storage meters for the holding,
    the period of the source charge, and the source charge identified by source_event_id of the authorization
    selected by the holding request_id. Add the signed quantity of posted meter reversals for that same source
    charge and period. Read committed_quantity from the active backup contract with the same customer and billing_entity,
    using zero when absent; this is the shared capacity ceiling in GB-month. When storage payment_status is
    restricted the shared capacity ceiling is zero instead. Subtract included_quantity_applied on completed
    storage service records for that exact source and period from the shared capacity ceiling. Floor the remaining
    shared capacity at zero. A clear storage payment_status permits the remaining shared capacity; a restricted
    payment_status permits zero. Floor the sum of measured and reversed quantity at zero. Record the smaller
    of the resulting billable quantity and eligible remaining capacity, rounded half-up only at the result
    to quantity_precision decimal places in GB-month. For the cool-storage correction branch, a completed service
    record grants the calculated shared backup capacity as a nonfinancial storage allowance for its exact source
    charge. Record exactly one approved entitlement by changing the pending entitlement record to completed,
    copying its existing source charge reference; do not create a duplicate entitlement.
  prerequisite: []
  cross_category:
  - category: backup
    as: branch
    reads:
    - status
    - committed_quantity
    note: The active backup contract of the same billing entity supplies the numeric shared retained-capacity
      ceiling.
  compute:
  - measured: SUM('storage_events','quantity',event_type='storage_supplemental_meter',status='completed',source_event_id=LATEST('storage_events','source_event_id',storage_event_id=F('request_id')),period=LATEST('storage_events','period',storage_event_id=LATEST('storage_events','source_event_id',storage_event_id=F('request_id'))),meter_code='cool_storage')
  - reversed: SUM('storage_events','quantity',event_type='storage_meter_reversal',status='posted',source_event_id=LATEST('storage_events','source_event_id',storage_event_id=F('request_id')),period=LATEST('storage_events','period',storage_event_id=LATEST('storage_events','source_event_id',storage_event_id=F('request_id'))))
  - shared: 0 if F('payment_status') == 'restricted' else (CFIELD('backup','committed_quantity',status='active',billing_entity=F('billing_entity'))
      or 0)
  - already_used: SUM('storage_events','included_quantity_applied',event_type='storage_service_record',status='completed',source_event_id=LATEST('storage_events','source_event_id',storage_event_id=F('request_id')),period=LATEST('storage_events','period',storage_event_id=LATEST('storage_events','source_event_id',storage_event_id=F('request_id'))))
  - remaining: MX(shared-already_used,0)
  - eligible: remaining if F('payment_status') == 'clear' else 0
  - billable: MX(measured+reversed,0)
  - result: RND(MN(billable,eligible),P('quantity_precision'))
  compute_basis:
    measured: For a cool-storage correction, sum quantity of completed supplemental cool_storage meters for
      the holding, the period of the source charge, and the source charge identified by source_event_id of
      the authorization selected by the holding request_id.
    reversed: Add the signed quantity of posted meter reversals for that same source charge and period.
    shared: Read committed_quantity from the active backup contract with the same customer and billing_entity,
      using zero when absent; this is the shared capacity ceiling in GB-month. When storage payment_status
      is restricted the shared capacity ceiling is zero instead.
    already_used: Subtract included_quantity_applied on completed storage service records for that exact source
      and period from the shared capacity ceiling.
    remaining: Floor the remaining shared capacity at zero.
    eligible: A clear storage payment_status permits the remaining shared capacity; a restricted payment_status
      permits zero.
    billable: Floor the sum of measured and reversed quantity at zero.
    result: Record the smaller of the resulting billable quantity and eligible remaining capacity, rounded
      half-up only at the result to quantity_precision decimal places in GB-month.
  inputs:
    history:
    - table: storage_events
      aggregate: sum
      field: quantity
      filters:
        source_event_id: source charge
        period: source charge period
    cross_category:
    - backup
  params: {}
- id: storage_ext_cool_review
  base_policy_refs:
