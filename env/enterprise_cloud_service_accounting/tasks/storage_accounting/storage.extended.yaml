- id: storage_evt_tax
  subject:
  - storage_charge
  - storage_credit
  - storage_debit_adjustment
  rule: The applicable tax classification has an approved system review. Use the source contract tax_treatment
    reviewed at the service date and tax_rates. Apply tax to the final rounded net service amount; round tax
    separately using amount_precision and rounding_mode. For a correction or credit use the original charge
    tax basis unless an approved tax-error review supplies the corrected treatment. Tax credits have negative
    tax_amount; charges and upward adjustments have positive tax_amount. Unsupported tax jurisdictions are
    POLICY_NOT_COVERED, not assumed exempt. Sum net subtotal and signed tax to obtain the financial amount.
    A verified exemption overrides the ordinary taxable rate; there is no stacking of tax treatments.
