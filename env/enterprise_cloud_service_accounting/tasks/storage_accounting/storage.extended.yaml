  computes: net_amount
  target_tool: record_storage_correction_review_dc2a1af3
  rule: For a cool-storage correction, sum quantity of completed supplemental cool_storage meters for the holding,
    the period of the source charge, and the source charge identified by source_event_id of the authorization
    selected by the holding request_id. Add the signed quantity of posted meter reversals for that same source
    charge and period. Before the corrected cool-storage review is handled, the source-charge shared-capacity
    entitlement must be completed. Sum quantity on completed storage service records for this exact source
    charge and source charge period. Read committed_quantity from the active backup contract with the same
    customer and billing_entity, using zero when absent; this is the shared capacity ceiling in GB-month. When
    storage payment_status is restricted the shared capacity ceiling is zero instead. Use the smaller of completed
    entitlement quantity and the current shared capacity ceiling as the included allowance. Use the storage
    tier cool_storage_rate in USD per GB-month. Subtract the included allowance from the sum of measured and
    signed reversal quantity, then floor at zero. Multiply that remaining quantity by the cool-storage rate
    and round only the net target half-up to amount_precision decimal places. For cool-storage corrections,
    recompute the corrected net target using the completed shared-capacity entitlement and current same-entity
    backup ceiling; retain the original approved untaxed tax basis. This branch applies only to source charges
    whose approved tax_treatment is us_untaxed or verified_exempt; a taxable charge remains under the base
    correction procedure. The accountant completes the pending billing review against its already completed
    source export in this consultation; set decision incorrect and status approved. No external review is awaited.
  prerequisite:
  - problem: storage_ext_capacity_entitlement
    kind: value_input
    gate: entitlement
    condition: Before the corrected cool-storage review is handled, the source-charge shared-capacity entitlement
      must be completed.
    policy_source: Before the corrected cool-storage review is handled, the source-charge shared-capacity entitlement
      must be completed.
    resolved_by: record_capacity_entitlement_88579e54
    effect: Completed entitlement quantity becomes the included allowance used in the corrected review.
  cross_category:
  - category: backup
    as: branch
    reads:
    - status
    - committed_quantity
    note: The active backup contract of the same billing entity supplies the numeric shared retained-capacity
      ceiling.
  compute:
  - measured: SUM('storage_events','quantity',event_type='storage_supplemental_meter',status='completed',source_event_id=LATEST('storage_events','source_event_id',storage_event_id=F('request_id')),period=LATEST('storage_events','period',storage_event_id=LATEST('storage_events','source_event_id',storage_event_id=F('request_id'))),meter_code='cool_storage')
  - reversed: SUM('storage_events','quantity',event_type='storage_meter_reversal',status='posted',source_event_id=LATEST('storage_events','source_event_id',storage_event_id=F('request_id')),period=LATEST('storage_events','period',storage_event_id=LATEST('storage_events','source_event_id',storage_event_id=F('request_id'))))
  - entitlement: SUM('storage_events','quantity',event_type='storage_service_record',status='completed',source_event_id=LATEST('storage_events','source_event_id',storage_event_id=F('request_id')),period=LATEST('storage_events','period',storage_event_id=LATEST('storage_events','source_event_id',storage_event_id=F('request_id'))))
  - shared: 0 if F('payment_status') == 'restricted' else (CFIELD('backup','committed_quantity',status='active',billing_entity=F('billing_entity'))
      or 0)
  - allowance: MN(entitlement,shared)
  - rate: P('cool_storage_rate')
  - quantity: MX(measured+reversed-allowance,0)
  - result: RND(quantity*rate,P('amount_precision'))
  compute_basis:
    measured: For a cool-storage correction, sum quantity of completed supplemental cool_storage meters for
      the holding, the period of the source charge, and the source charge identified by source_event_id of
      the authorization selected by the holding request_id.
    reversed: Add the signed quantity of posted meter reversals for that same source charge and period.
    entitlement: Before the corrected cool-storage review is handled, the source-charge shared-capacity entitlement
      must be completed. Sum quantity on completed storage service records for this exact source charge and
      source charge period.
    shared: Read committed_quantity from the active backup contract with the same customer and billing_entity,
      using zero when absent; this is the shared capacity ceiling in GB-month. When storage payment_status
      is restricted the shared capacity ceiling is zero instead.
    allowance: Use the smaller of completed entitlement quantity and the current shared capacity ceiling as
      the included allowance.
    rate: Use the storage tier cool_storage_rate in USD per GB-month.
    quantity: Subtract the included allowance from the sum of measured and signed reversal quantity, then floor
      at zero.
    result: Multiply that remaining quantity by the cool-storage rate and round only the net target half-up
      to amount_precision decimal places.
  inputs:
    history:
    - table: storage_events
      aggregate: sum
      field: quantity
      filters:
        source_event_id: source charge
        period: source charge period
    cross_category:
    - backup
  params: {}
- id: storage_ext_cool_credit
  base_policy_refs:
  - storage_evt_tax
  - storage_evt_correction
  - storage_evt_service_credit
  overwrite:
  - base_policy: storage_evt_correction
    superseded_clause: Credit the positive overcharge, debit the positive undercharge, and make no write when
      equal.
    replaced_by: For shared-capacity cool-storage corrections, credit the remaining overcharge only up to the
      current shared capacity ceiling multiplied by cool_storage_rate; an uncovered difference remains payable
      under the original charge.
  trigger: on_request
  subject:
  - storage_credit
  computes: amount
  target_tool: post_storage_correction_02018d1e
  rule: Read the amount of the posted source charge identified by source_event_id of the authorization selected
    by the holding request_id. Add signed amounts of all posted correction credits for that exact source charge;
    exclude service-credit concessions. Add signed amounts of all posted correction debit adjustments for that
    exact source charge. Before posting a cool-storage correction, its corrected review must be approved with
    decision incorrect. Sum net_amount of approved incorrect billing reviews for that exact source charge;
    the branch admits exactly one current review and no superseded review. Read committed_quantity from the
    active backup contract with the same customer and billing_entity, using zero when absent; this is the shared
    capacity ceiling in GB-month. When storage payment_status is restricted the shared capacity ceiling is
    zero instead. Use the storage tier cool_storage_rate in USD per GB-month. Multiply the shared capacity
    ceiling by the cool-storage rate and round the resulting maximum correction net amount half-up to amount_precision.
    Subtract the approved corrected net target from the original amount plus signed prior correction credits
    and debits, then floor at zero. The correction amount is the negative of the smaller of that overcharge
    and the maximum correction net amount, rounded half-up to amount_precision; zero makes no new financial
    write. For shared-capacity cool-storage corrections, credit the remaining overcharge only up to the current
    shared capacity ceiling multiplied by cool_storage_rate; an uncovered difference remains payable under
    the original charge. This branch inherits the approved original untaxed tax basis and only handles us_untaxed
    or verified_exempt charges. Post exactly one correction credit linked to the original charge and the approved
    review; net_amount equals amount and tax_amount is zero.
  prerequisite:
  - problem: storage_ext_cool_review
    kind: value_input
    gate: target
    condition: Before posting a cool-storage correction, its corrected review must be approved with decision
      incorrect.
    policy_source: Before posting a cool-storage correction, its corrected review must be approved with decision
      incorrect.
    resolved_by: record_storage_correction_review_dc2a1af3
    effect: The approved review contributes its net target; no pending review contributes.
  cross_category:
  - category: backup
    as: branch
    reads:
    - status
    - committed_quantity
    note: The active backup contract of the same billing entity supplies the numeric shared retained-capacity
      ceiling.
  compute:
  - original: SUM('storage_events','amount',event_type='storage_charge',status='posted',storage_event_id=LATEST('storage_events','source_event_id',storage_event_id=F('request_id')))
  - prior_credits: SUM('storage_events','amount',event_type='storage_credit',status='posted',source_event_id=LATEST('storage_events','source_event_id',storage_event_id=F('request_id')),source_subtype='correction')
  - prior_debits: SUM('storage_events','amount',event_type='storage_debit_adjustment',status='posted',source_event_id=LATEST('storage_events','source_event_id',storage_event_id=F('request_id')),source_subtype='correction')
  - target: SUM('storage_events','net_amount',event_type='storage_review',status='approved',source_event_id=LATEST('storage_events','source_event_id',storage_event_id=F('request_id')),decision='incorrect')
  - shared: 0 if F('payment_status') == 'restricted' else (CFIELD('backup','committed_quantity',status='active',billing_entity=F('billing_entity'))
