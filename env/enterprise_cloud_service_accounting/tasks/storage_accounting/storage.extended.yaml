      action_bindings:
        storage_events.storage_event_id: storage_event_id
  params:
    per_tier:
      Northbridge Object Storage 5 TB:
        unit_rate: =unit_rate
        region_factors: =region_factors
        included_quantity: =included_quantity
        reservation_discounts: =reservation_discounts
        promotion_discount: =promotion_discount
        promotion_channels: =promotion_channels
        negotiated_rate_allowed: =negotiated_rate_allowed
        discount_priority: =discount_priority
        amount_precision: =amount_precision
        rounding_mode: =rounding_mode
        billing_timezone: =billing_timezone
        billing_cycle: =billing_cycle
      Northbridge Object Storage 10 TB:
        unit_rate: =unit_rate
        region_factors: =region_factors
        included_quantity: =included_quantity
        reservation_discounts: =reservation_discounts
        promotion_discount: =promotion_discount
        promotion_channels: =promotion_channels
        negotiated_rate_allowed: =negotiated_rate_allowed
