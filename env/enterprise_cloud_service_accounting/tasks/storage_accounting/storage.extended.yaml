        outage_exclusions: =outage_exclusions
        sla_target_percent: =sla_target_percent
      Northbridge Object Storage 250 TB:
        outage_exclusions: =outage_exclusions
        sla_target_percent: =sla_target_percent
- id: storage_evt_collection
  subject:
  - storage_payment
  rule: The bank record confirms the remittance as completed. Record only a bank-confirmed remittance using
    a payment_methods rail and the amount actually received in currency. Customer consent to dispose of funds
    belongs to the customer; the agent only allocates a payment already confirmed by the bank. Apply an explicitly
    referenced invoice first; if the remittance omits allocation, use collection_order, sorting invoice_issued_at
    then source_event_id within the same customer and billing entity. Split across exact source invoice lines,
    never across legal billing entities. Each allocation is a separate negative payment amount linked to its
    original charge; any residual is an unallocated overpayment linked to the remittance reference. A repeated
    remittance reference and allocation target returns the existing posting. No receipt is inferred from a
    customer promise, and rejected or pending payments make no posting.
  eligibility:
  - id: confirmed_payment
    applies_to:
    - storage_payment
    kind: authorization
    condition: The bank record confirms the remittance as completed.
    evidence_fields:
    - storage_events.storage_event_id
    - storage_events.status
    - storage_events.external_reference
    - storage_events.method
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - storage_events.storage_event_id
      action_bindings:
        storage_events.storage_event_id: storage_event_id
  params:
    per_tier:
      Northbridge Object Storage 5 TB:
        payment_methods: =payment_methods
        currency: =currency
        collection_order: =collection_order
      Northbridge Object Storage 10 TB:
        payment_methods: =payment_methods
        currency: =currency
        collection_order: =collection_order
      Northbridge Object Storage 25 TB:
        payment_methods: =payment_methods
        currency: =currency
        collection_order: =collection_order
      Northbridge Object Storage 50 TB:
        payment_methods: =payment_methods
        currency: =currency
        collection_order: =collection_order
      Northbridge Object Storage 100 TB:
        payment_methods: =payment_methods
        currency: =currency
        collection_order: =collection_order
      Northbridge Object Storage 250 TB:
        payment_methods: =payment_methods
        currency: =currency
        collection_order: =collection_order
  measures:
  - storage_msr_net_receivable
- id: storage_evt_return
  subject:
  - storage_payment_return
  rule: The completed bank return notice refers to the exact original posted payment. The bank return must
    identify the exact posted payment. Restore the returned principal as a positive amount, up to the original
    payment amount not already returned. Copy its method, customer, billing entity and currency. A partial
    return uses the distinct bank notice external_reference. A duplicate bank notice produces no new write.
    Any failed_payment_fee is a separately identifiable return-fee charge under evt_fees, never hidden in returned
    principal; a waived fee produces no fee posting.
  eligibility:
  - id: bank_return
    applies_to:
    - storage_payment_return
    kind: authorization
    condition: The completed bank return notice refers to the exact original posted payment.
    evidence_fields:
    - storage_events.storage_event_id
    - storage_events.source_event_id
    - storage_events.status
    - storage_events.external_reference
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - storage_events.storage_event_id
        - storage_events.source_event_id
      action_bindings:
        storage_events.storage_event_id: storage_event_id
        storage_events.source_event_id: source_event_id
  params:
    per_tier:
      Northbridge Object Storage 5 TB:
        failed_payment_fee: =failed_payment_fee
      Northbridge Object Storage 10 TB:
        failed_payment_fee: =failed_payment_fee
      Northbridge Object Storage 25 TB:
        failed_payment_fee: =failed_payment_fee
      Northbridge Object Storage 50 TB:
        failed_payment_fee: =failed_payment_fee
      Northbridge Object Storage 100 TB:
        failed_payment_fee: =failed_payment_fee
      Northbridge Object Storage 250 TB:
        failed_payment_fee: =failed_payment_fee
  formula:
    returned_principal: abs(amount)
- id: storage_evt_refund
  subject:
  - storage_refund
  rule: The customer-authorized refund request and completed original payment refer to the same holding and
    source payment. The customer files an exact refund authorization; the agent refunds a confirmed overpayment
    only to the method and destination of its original payment. Available refund is the smaller of the negative
    net receivable magnitude and original payment principal less prior returns and refunds linked to that payment.
    A requested amount exceeding that limit is refused, not silently reduced. Use refund_methods, require at
    least refund_minimum, and record a positive receivable delta for cash paid out. A smaller positive balance
    remains on account. Refunds require no active service contract and remain possible after closure. Repetition
    of the same request and source payment returns the existing refund. A third-party destination or unconfirmed
    payment is refused.
  eligibility:
  - id: refund_consent
    applies_to:
    - storage_refund
    kind: authorization
    condition: The customer-authorized refund request and completed original payment refer to the same holding
      and source payment.
    evidence_fields:
    - storage_events.storage_event_id
    - storage_events.request_id
    - storage_events.source_event_id
    - storage_events.status
    - storage_events.storage_holding_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
