    duration_hours: Actual elapsed service, outage, response or consultant hours; never a policy constant.
    source_subtype: Business subtype distinguishing a source line.
  triggers: []
  distinguish_by:
  - external_reference
  - source_event_id
  - related_event_id
  - period
  - source_subtype
- type: storage_service_record
  target: storage_events
  meaning: The support desk records delivered reviews, response measurements, contact assignments or other
    nonfinancial entitlements.
  grain: One source resource interval, accounting line, or independently referenced service occurrence; derived
    lines retain the narrowest original event reference.
  fields:
    storage_holding_id: Contract to which this event belongs.
    customer_id: Customer owning the event and the referenced contract.
    external_reference: Exact resource, invoice, remittance or request reference from its authoritative record
      or the customer.
    source_event_id: Narrowest original event corrected, billed, credited, paid or refunded; empty for an independent
      source.
    related_event_id: Additional linked approval, incident or evidence event; empty when absent.
    request_id: Customer request event reference; empty where no customer request is needed.
    occurred_at: Authoritative event occurrence time in UTC.
    period: UTC calendar month of the service being billed.
    status: Processing state of this individual evidence or booking record.
    source_subtype: Business subtype distinguishing a source line.
    meter_code: Exact supported category meter from the provider export; none on nonmeter events.
    quantity: Signed primary quantity on meter postings, otherwise the actual nonnegative measured quantity
      in quantity_unit.
    quantity_unit: Physical unit of the source quantity; none when no measured quantity applies.
    resource_count: Actual resources, contacts or operations measured for this event.
    duration_hours: Actual elapsed service, outage, response or consultant hours; never a policy constant.
    retention_days: Actual configured or elapsed retention relevant to the measurement.
    variant_name: Official tier that applied during this source service interval; historical tiers are preserved
      after amendments.
  triggers: []
  distinguish_by:
  - external_reference
  - source_event_id
  - related_event_id
  - period
  - meter_code
  - source_subtype
measures:
- id: storage_msr_portfolio_usage
  window: The source period, a UTC calendar month; customer and billing_entity match the proposed charge.
  measure: Sum posted primary meter quantities net of meter_reversal by holding, multiply each interval by
    its applicable standard tier unit_rate and region factor without any discount or tax, and sum across this
    category. Exclude ancillary meters and never sum already discounted invoices.
- id: storage_msr_net_receivable
  window: All posted financial events through the frozen handling time.
  measure: Sum signed amount for charge, debit_adjustment, payment_return and refund together with negative
    amount for payment and credit, grouped by holding. No independently writable balance is stored..
- id: storage_msr_source_credits
  window: All posted credit and debit_adjustment events through the frozen handling time for the exact source_event_id.
  measure: For the exact original charge source_event_id, report correction_gross as absolute correction credit
    amount less debit-adjustment amount, and service_credit_net as absolute pretax net_amount of service-credit
    postings. Keep these two named components separate; tax is included only in correction_gross, and unrelated
    source charges never enter either component.
- id: storage_msr_amendments
  window: UTC calendar month containing the frozen handling time.
  measure: Count completed request events of source_subtype amendment for this holding; cancelled and rejected
    requests do not count.
policies:
- id: storage_agg_multi_holding
  subject:
  - storage_open
  rule: The signed resource scope is not already represented by a nonclosed contract. Multiple independent
    resource scopes may be held. Use external_reference as the signed resource-scope key. Count all nonclosed
    holdings of this category for the same customer; refuse creation if the count would exceed max_per_customer.
    A repeated signed application with the same external resource scope reuses the existing contract rather
    than opening another.
  eligibility:
  - id: scope_unique
    applies_to:
    - storage_open
    kind: authorization
    condition: The signed resource scope is not already represented by a nonclosed contract.
    evidence_fields:
    - storage_holdings.storage_holding_id
    - storage_holdings.customer_id
    - storage_holdings.status
    - storage_holdings.external_reference
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - storage_holdings.storage_holding_id
        - storage_holdings.customer_id
      action_bindings:
        storage_holdings.storage_holding_id: storage_holding_id
        storage_holdings.customer_id: customer_id
  params:
    max_per_customer: 24
- id: storage_admission
  subject:
  - storage_open
  rule: The signed application request has an approved service review. The customer signs and submits the application
    through an authorized_channels channel. Create status applied and opened_date from the frozen clock, with
    no consumption or charge. The requested tier supplies max_resources; reject unsupported regions, unsupported
    currency, resource counts above that limit, and unapproved contract terms without a write. The customer
    owns the signature; an agent cannot sign for them. Entry gates are evaluated against the authoritative
    signed application fields copied into the proposed holding.
  eligibility:
  - id: signed_approval
    applies_to:
    - storage_open
    kind: authorization
    condition: The signed application request has an approved service review.
    evidence_fields:
    - storage_events.storage_event_id
    - storage_events.request_id
    - storage_events.status
    - storage_events.decision
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - storage_events.storage_event_id
        - storage_events.request_id
      action_bindings:
        storage_events.storage_event_id: storage_event_id
        storage_events.request_id: request_id
  params:
    per_tier:
      Northbridge Object Storage 5 TB:
        max_resources: =max_resources
        currency: =currency
        authorized_channels: =authorized_channels
      Northbridge Object Storage 10 TB:
        max_resources: =max_resources
        currency: =currency
        authorized_channels: =authorized_channels
      Northbridge Object Storage 25 TB:
        max_resources: =max_resources
        currency: =currency
        authorized_channels: =authorized_channels
      Northbridge Object Storage 50 TB:
        max_resources: =max_resources
        currency: =currency
        authorized_channels: =authorized_channels
      Northbridge Object Storage 100 TB:
        max_resources: =max_resources
        currency: =currency
        authorized_channels: =authorized_channels
      Northbridge Object Storage 250 TB:
        max_resources: =max_resources
        currency: =currency
        authorized_channels: =authorized_channels
- id: storage_activation
  subject:
  - storage_activate
  rule: The contract status is applied. The contract approval_status is approved. Activate an approved application
    after provisioning evidence confirms the configured resources; record activated_at from the frozen clock.
    Refuse rejected or pending applications. Setup is invoiced under evt_fees when setup_fee is positive; a
    waived setup fee creates no charge. Repeating an activation of an already active contract is a read-only
    confirmation, not another activation.
  eligibility:
  - id: contract_state
    applies_to:
    - storage_activate
    kind: state
    condition: The contract status is applied.
    evidence_fields:
    - storage_holdings.storage_holding_id
    - storage_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - storage_holdings.storage_holding_id
      action_bindings:
        storage_holdings.storage_holding_id: storage_holding_id
    state_contract:
      field: storage_holdings.status
      allowed:
      - applied
  - id: provisioning_approval
    applies_to:
    - storage_activate
    kind: authorization
    condition: The contract approval_status is approved.
    evidence_fields:
    - storage_holdings.storage_holding_id
    - storage_holdings.approval_status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - storage_holdings.storage_holding_id
      action_bindings:
        storage_holdings.storage_holding_id: storage_holding_id
  params:
    per_tier:
      Northbridge Object Storage 5 TB:
        setup_fee: =setup_fee
      Northbridge Object Storage 10 TB:
        setup_fee: =setup_fee
      Northbridge Object Storage 25 TB:
        setup_fee: =setup_fee
      Northbridge Object Storage 50 TB:
        setup_fee: =setup_fee
      Northbridge Object Storage 100 TB:
        setup_fee: =setup_fee
      Northbridge Object Storage 250 TB:
        setup_fee: =setup_fee
- id: storage_amendment
  subject:
  - storage_amend
  rule: The contract status is active or suspended. The source amendment request is approved and customer-authorized.
    The customer files a signed amendment request before the agent applies the approved attributes. The request
    external_reference identifies the signed amendment; its related approved review carries the affected exact
    values and effective interval_start. Request and review events preserve those effective attributes. Keep
    status unchanged, use the new tier only for service intervals beginning at the request effective time,
    and retain old tier and effective price on earlier meter and invoice records. Refuse any change above max_resources
    or when msr_amendments has reached amendment_limit. Completed amendment requests count once; pending, rejected
    or cancelled requests do not change the holding. Signed commitments keep their recorded expiration and
    remaining contractual liability unless the signed amendment explicitly replaces them.
  eligibility:
  - id: contract_state
    applies_to:
    - storage_amend
    kind: state
    condition: The contract status is active or suspended.
    evidence_fields:
    - storage_holdings.storage_holding_id
    - storage_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - storage_holdings.storage_holding_id
      action_bindings:
        storage_holdings.storage_holding_id: storage_holding_id
    state_contract:
      field: storage_holdings.status
      allowed:
      - active
      - suspended
  - id: amendment_approved
    applies_to:
    - storage_amend
    kind: authorization
    condition: The source amendment request is approved and customer-authorized.
    evidence_fields:
    - storage_events.storage_event_id
    - storage_events.status
    - storage_events.request_id
    - storage_events.source_subtype
