  - rate: P('cool_storage_rate')
  - cap: RND(shared*rate,P('amount_precision'))
  - difference: MX(original+prior_credits+prior_debits-target,0)
  - result: -RND(MN(difference,cap),P('amount_precision'))
  compute_basis:
    original: Read the amount of the posted source charge identified by source_event_id of the authorization
      selected by the holding request_id.
    prior_credits: Add signed amounts of all posted correction credits for that exact source charge; exclude
      service-credit concessions.
    prior_debits: Add signed amounts of all posted correction debit adjustments for that exact source charge.
    target: Before posting a cool-storage correction, its corrected review must be approved with decision incorrect.
      Sum net_amount of approved incorrect billing reviews for that exact source charge; the branch admits
      exactly one current review and no superseded review.
    shared: Read committed_quantity from the active backup contract with the same customer and billing_entity,
      using zero when absent; this is the shared capacity ceiling in GB-month. When storage payment_status
      is restricted the shared capacity ceiling is zero instead.
    rate: Use the storage tier cool_storage_rate in USD per GB-month.
    cap: Multiply the shared capacity ceiling by the cool-storage rate and round the resulting maximum correction
      net amount half-up to amount_precision.
    difference: Subtract the approved corrected net target from the original amount plus signed prior correction
      credits and debits, then floor at zero.
    result: The correction amount is the negative of the smaller of that overcharge and the maximum correction
      net amount, rounded half-up to amount_precision; zero makes no new financial write.
