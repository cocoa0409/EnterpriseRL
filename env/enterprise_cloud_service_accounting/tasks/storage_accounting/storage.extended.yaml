    - storage_events.external_reference
    - storage_events.interval_start
    - storage_events.interval_end
    - storage_events.quantity
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - storage_events.storage_event_id
      action_bindings:
        storage_events.storage_event_id: storage_event_id
  params:
