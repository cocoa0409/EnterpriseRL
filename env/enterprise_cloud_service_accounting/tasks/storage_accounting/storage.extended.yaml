      for an eligible outage after applying evt_service_credit.
    replaced_by: For cool-storage corrections, recompute the corrected net target using the completed shared-capacity
      entitlement and current same-entity backup ceiling; retain the original approved untaxed tax basis.
  trigger: on_request
  subject:
