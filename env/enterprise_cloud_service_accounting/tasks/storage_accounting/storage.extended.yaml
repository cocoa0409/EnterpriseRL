  rule: Use msr_portfolio_usage to select the portfolio discount. Combine only holdings of this category owned
    by the same customer with the same billing_entity and source period, even if some have since closed. No
    cross-entity or cross-category spending counts. The threshold comparison is inclusive. Portfolio discount
    applies only to primary service usage and only if no higher-priority price applies; it is neither a cash
    credit nor a deduction from ancillary service fees.
