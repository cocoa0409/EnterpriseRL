      Northbridge Object Storage 5 TB:
        refund_methods: =refund_methods
        refund_minimum: =refund_minimum
        amount_precision: =amount_precision
        rounding_mode: =rounding_mode
      Northbridge Object Storage 10 TB:
        refund_methods: =refund_methods
        refund_minimum: =refund_minimum
        amount_precision: =amount_precision
        rounding_mode: =rounding_mode
      Northbridge Object Storage 25 TB:
        refund_methods: =refund_methods
        refund_minimum: =refund_minimum
        amount_precision: =amount_precision
        rounding_mode: =rounding_mode
      Northbridge Object Storage 50 TB:
        refund_methods: =refund_methods
        refund_minimum: =refund_minimum
        amount_precision: =amount_precision
        rounding_mode: =rounding_mode
      Northbridge Object Storage 100 TB:
        refund_methods: =refund_methods
        refund_minimum: =refund_minimum
        amount_precision: =amount_precision
        rounding_mode: =rounding_mode
      Northbridge Object Storage 250 TB:
        refund_methods: =refund_methods
        refund_minimum: =refund_minimum
        amount_precision: =amount_precision
        rounding_mode: =rounding_mode
  measures:
  - storage_msr_net_receivable
  formula:
    maximum_balance_refund: max(0, -storage_msr_net_receivable)
- id: storage_suspension
  subject:
  - storage_suspend
  rule: The contract status is active. Collection suspension occurs no earlier than invoice_due_days plus suspension_grace_days
    after the source invoice is issued. The contract payment_status is restricted and the source invoice retains
    unpaid principal. Add invoice_due_days and then suspension_grace_days UTC calendar dates to invoice_issued_at,
    preserving its time of day; do not use business days or replace the anchor with contract activation. Equality
    qualifies. The source overdue invoice must retain a positive unpaid principal; a fully paid invoice cannot
    justify suspension. Earlier handling sends an informational explanation without a status change. An agent
    suspends active service only when official payment_status is restricted; ordinary billing disputes alone
    do not suspend service. Retained ancillary resources can still produce actual supplemental usage. Repeated
    handling of an already suspended contract makes no new transition.
  eligibility:
  - id: contract_state
    applies_to:
    - storage_suspend
    kind: state
    condition: The contract status is active.
    evidence_fields:
    - storage_holdings.storage_holding_id
    - storage_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - storage_holdings.storage_holding_id
      action_bindings:
        storage_holdings.storage_holding_id: storage_holding_id
    state_contract:
      field: storage_holdings.status
      allowed:
      - active
  - id: collection_deadline
    applies_to:
    - storage_suspend
    kind: time
    condition: Collection suspension occurs no earlier than invoice_due_days plus suspension_grace_days after
      the source invoice is issued.
    evidence_fields:
    - storage_events.storage_event_id
    - storage_events.invoice_issued_at
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - storage_events.storage_event_id
      action_bindings:
        storage_events.storage_event_id: storage_event_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the source invoice is issued
      anchor_source: storage_events.invoice_issued_at
      relation: not_before
      duration_source: params.total_collection_days
      unit: calendar_days
      counting_rule: Add invoice_due_days and then suspension_grace_days UTC calendar dates to invoice_issued_at,
        preserving its time of day; do not use business days or replace the anchor with contract activation.
      boundary: inclusive
  - id: collection_restriction
    applies_to:
    - storage_suspend
    kind: authorization
    condition: The contract payment_status is restricted and the source invoice retains unpaid principal.
    evidence_fields:
    - storage_holdings.storage_holding_id
    - storage_holdings.payment_status
    - storage_events.storage_event_id
    - storage_events.amount
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - storage_holdings.storage_holding_id
        - storage_events.storage_event_id
      action_bindings:
        storage_holdings.storage_holding_id: storage_holding_id
        storage_events.storage_event_id: storage_event_id
  params:
    per_tier:
      Northbridge Object Storage 5 TB:
        invoice_due_days: =invoice_due_days
        suspension_grace_days: =suspension_grace_days
      Northbridge Object Storage 10 TB:
        invoice_due_days: =invoice_due_days
        suspension_grace_days: =suspension_grace_days
      Northbridge Object Storage 25 TB:
        invoice_due_days: =invoice_due_days
        suspension_grace_days: =suspension_grace_days
      Northbridge Object Storage 50 TB:
        invoice_due_days: =invoice_due_days
        suspension_grace_days: =suspension_grace_days
      Northbridge Object Storage 100 TB:
        invoice_due_days: =invoice_due_days
        suspension_grace_days: =suspension_grace_days
      Northbridge Object Storage 250 TB:
        invoice_due_days: =invoice_due_days
        suspension_grace_days: =suspension_grace_days
    total_collection_days: The sum of variants.invoice_due_days and variants.suspension_grace_days.
- id: storage_resumption
  subject:
  - storage_resume
  rule: The contract status is suspended. The contract payment_status is clear. Restore a suspended holding
    after its official payment restriction clears; no customer promise substitutes for recorded clearance.
    Set status active. Bill resumption_fee under evt_fees only when positive, and preserve retained-resource
    history. A contract already active needs no write; a closed contract requires a new signed application
    and cannot be resumed.
  eligibility:
  - id: contract_state
    applies_to:
    - storage_resume
    kind: state
    condition: The contract status is suspended.
    evidence_fields:
    - storage_holdings.storage_holding_id
    - storage_holdings.status
    evidence_contract:
      authority: system_record
