    - storage_events.source_event_id
    - storage_events.meter_code
    - storage_events.source_subtype
    - storage_events.pricing_component
    - storage_events.period
    - storage_events.event_type
    - storage_events.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - storage_events.source_event_id
      action_bindings:
        storage_events.source_event_id: source_event_id
    dedup_contract:
