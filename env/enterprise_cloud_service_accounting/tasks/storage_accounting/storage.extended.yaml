  rule: The tier plan_capacity_gb is a pricing-band reference, not free storage or a hard capacity cap. Primary
    hot-class quantity is actual GB-month at unit_rate. cool_storage and archive_storage use cool_storage_rate
    and archive_storage_rate. put_requests and get_requests use put_request_rate and get_request_rate per thousand
    operations; preserve the export quantity_unit thousand_operations and do not treat it as raw operations.
    cool_retrieval, archive_retrieval and expedited_retrieval use their correspondingly named rates per GB;
    a retrieval has exactly one class and urgency, so these rates never stack. replication and internet_egress
    use replication_rate and egress_rate per GB. For cool_early_delete or archive_early_delete, compute the
    positive remaining calendar dates as the corresponding minimum-days parameter less authoritative age_days,
    multiply object GB by that remainder divided by actual calendar dates in the deletion month, and use the
    corresponding storage rate. Equality with minimum retention incurs no early-deletion charge. age_days counts
    UTC date changes from the object creation record to the deletion record; retention is attached to each
    object version, not its containing bucket. Replicated and versioned copies are distinct source object references
    and are metered independently. For every ancillary meter, multiply the nonincluded measured quantity by
    its selected rate, then round the net line using amount_precision and rounding_mode and tax under evt_tax.
    An allowance is consumed chronologically by interval_start then source_event_id within the named holding
    and UTC period; reversal of its source returns only that source allocation. Source subtype supplemental
    identifies these amounts so the primary discount policy does not apply. Completed service records prove
    nonfinancial entitlements; unknown meter codes or units are POLICY_NOT_COVERED instead of guessed prices.
    These calculations never authorize an unapproved customer-only action. For included capacities denominated
    in GB-month, contact-month or package-month, prorate the capacity by actual active interval seconds divided
    by actual seconds in its UTC month before comparing measured quantity. Category-specific primary inclusions
    replace the generic included_quantity where expressly named; they are not added twice. A mandatory minimum
