- id: storage_evt_meter
  subject:
  - storage_meter
  - storage_meter_reversal
  - storage_supplemental_meter
  rule: The authoritative export confirms the resource interval and the measured quantity. Meters originate
    in the provider resource export. Primary meter quantities use usage_unit; a meter is positive and a meter_reversal
    is the negative of the exact erroneous source quantity, capped by the source quantity not already reversed.
    Keep original interval, region, configuration and source reference. bill_actual overage permits measured
    quantities above included_quantity; no service entitlement is invented by a meter write. Round measured
    quantities to quantity_precision using rounding_mode, apply minimum_quantity and round positive billable
    primary quantities upward to a whole meter_quantum. Stopped or suspended service accrues no primary running
    usage, but real retained storage and other supplemental services remain billable through supplemental_meter.
    A rejected or cancelled source is not a billable meter. Repeated exports with the same resource, meter,
    interval and correction reference are read-only confirmations.
  eligibility:
  - id: export_evidence
    applies_to:
    - storage_meter
    - storage_meter_reversal
    - storage_supplemental_meter
    kind: authorization
    condition: The authoritative export confirms the resource interval and the measured quantity.
    evidence_fields:
