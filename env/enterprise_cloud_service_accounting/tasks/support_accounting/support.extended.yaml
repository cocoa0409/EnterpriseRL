    - support_events.source_event_id
    - support_events.related_event_id
    - support_events.support_holding_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - support_events.support_event_id
        - support_events.source_event_id
        - support_events.related_event_id
        - support_events.support_holding_id
      action_bindings:
        support_events.support_event_id: support_event_id
        support_events.source_event_id: source_event_id
        support_events.related_event_id: related_event_id
        support_events.support_holding_id: support_holding_id
