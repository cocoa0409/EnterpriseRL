workflows:
- id: support_surplus_refund_workflow
  scenario: A customer requests the surplus from a paid rate-error support invoice while retaining one corrected
    source-month fee on account; the outcome is a corrected bill and a source-payment refund with that retained
    balance.
  steps:
  - tool: review_support_overcharge_b721fa46
    owner: agent
    writes: support_events
    subject: support_review
    base_policy_refs:
    - support_evt_review
    - support_evt_service_credit
    role: Corrected paid-invoice net fee
    computed_by:
    - support_ext_paid_review
    requires_external_wait: false
    zero_wait_proof: The original source invoice, its official export fragments, signed compute/support terms and
      pending review work item are already queryable. The accountant computes and records this numerical review
      synchronously. The same review update allocates and returns a request reference; no customer request is created
      by this allocation.
    causal_source_kind: initial_state_preexisting
  - tool: credit_support_overcharge_7251caa0
    owner: agent
    writes: support_events
    subject: support_credit
    base_policy_refs:
    - support_evt_tax
    - support_evt_correction
    - support_evt_service_credit
    role: Signed correction credit
    computed_by:
    - support_ext_paid_credit
    requires_external_wait: false
    zero_wait_proof: The preceding numerical-review update has established approved status and incorrect decision.
      The original invoice and reviewed tax treatment preexist; one correction-credit create completes the receivable
      change now.
    causal_source_kind: prior_synchronous_tool_effect
  - tool: authorize_support_surplus_cef239e4
    owner: user
    writes: support_events
    subject: support_request
    base_policy_refs:
    - support_evt_request
    - support_evt_service_credit
    role: Customer cash-refund authorization
    computed_by:
    - support_ext_retained_fee_authorization
    requires_external_wait: false
    zero_wait_proof: The preceding posted credit establishes current surplus, while original bank-confirmed payment
      evidence preexists. After the agent presents the calculated amount and hands over the customer tool, the caller
      personally submits the authorization immediately. The submission uses the previously disclosed reserved reference
      and creates the actual pending authorization under it.
    causal_source_kind: current_user_input
  - tool: refund_support_surplus_235c4f6f
    owner: agent
    writes: support_events
    subject: support_refund
    base_policy_refs:
    - support_evt_refund
    role: Original-method surplus refund
    computed_by:
    - support_ext_surplus_refund
    requires_external_wait: false
    zero_wait_proof: The immediately preceding customer call has created the exact pending authorization and returned
      its real reference. Original method and payment evidence preexist; the refund records the authorized cash
      return synchronously.
    causal_source_kind: prior_synchronous_tool_effect
  order_rationale: The numerical review must precede the correction because only its approved incorrect decision
    authorizes the source credit. The credit must precede the customer authorization because its posted receivable
    delta changes the account surplus from which retained funding is deducted. Customer authorization must precede
    payment because only the customer may dispose of their funds; the refund consumes that exact authorization reference
    and amount. All actions are synchronous desk accounting or immediate customer authorization, without a bank-clearance
    wait.
  dataflow:
  - from_step: 0
    to_step: 1
    kind: state_effect
    source_table: support_events
    source_field: status
    consumer_bindings: []
    establishes_gates:
    - policy_id: support_evt_correction
      eligibility_id: approved_correction
      evidence_field: support_events.status
    - policy_id: support_evt_service_credit
      eligibility_id: approved_service_credit
      evidence_field: support_events.status
      applicability: The base gate is conditional on source_subtype service_credit; this correction-subtype posting
        does not activate it. The review remains decision incorrect, not eligible.
  - from_step: 0
    to_step: 1
    kind: object_binding
    source_table: support_events
    source_field: support_event_id
    consumer_bindings:
    - action_arg: support_event_id
      role: authorization
      policy_id: support_evt_correction
      eligibility_id: approved_correction
      gate_field: support_events.support_event_id
  - from_step: 0
    to_step: 2
    kind: object_binding
    source_table: support_events
    source_field: request_id
    consumer_bindings:
    - action_arg: request_id
      role: direct
  - from_step: 2
    to_step: 3
    kind: object_binding
    source_table: support_events
    source_field: support_event_id
    consumer_bindings:
    - action_arg: request_id
      role: authorization
      policy_id: support_evt_refund
      eligibility_id: refund_consent
      gate_field: support_events.request_id
  prerequisite: []
  requires_external_wait: false
  zero_wait_proof: Every step completes at the same frozen consultation time. Official source invoices, exports,
    signed prices, approved tax treatment and completed bank remittances preexist. The accountant performs the numerical
    review and credit synchronously; the customer personally files the displayed cash-disposal authorization immediately
    after handover; its actual receipt supplies the final refund reference. No later bank clearance, outside approval,
    service delivery or elapsed time is required. Reference reservation occurs inside the numerical review; consent
    exists only after the customer submission, at the same frozen time.
