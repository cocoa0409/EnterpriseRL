  rule: The completed bank return notice refers to the exact original posted payment. The bank return must
    identify the exact posted payment. Restore the returned principal as a positive amount, up to the original
    payment amount not already returned. Copy its method, customer, billing entity and currency. A partial
    return uses the distinct bank notice external_reference. A duplicate bank notice produces no new write.
    Any failed_payment_fee is a separately identifiable return-fee charge under evt_fees, never hidden in returned
    principal; a waived fee produces no fee posting.
