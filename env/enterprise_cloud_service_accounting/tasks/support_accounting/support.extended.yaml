- id: support_ext_missing_spend
  base_policy_refs:
  - support_evt_meter
  - support_evt_category_meters
  overwrite: []
  trigger: state_due
  subject:
  - support_meter
  computes: quantity
  target_tool: recognize_support_spend_78bce399
  rule: For a missing compute-spend export, create exactly one primary meter attributed to the original support
    source charge and period. The official export evidence must exist before recording it. Copied provider-export
    physical quantities in support_service_record are reconciliation evidence, not accounting postings. No support
    commitment or portfolio discount applies to this on-demand reconciliation scope. The latest billing review by
    occurred_at identifies the precise original source charge and its service period. Select the same-customer active
    compute contract with the same billing_entity; use its approved negotiated_unit_rate, otherwise its tier unit_rate.
    If there is no matching compute contract, the reconstructed compute rate is zero and no compute-spend contribution
    is recognized. For these on-demand compute export reconstructions, an approved negotiated rate receives no further
    discount; otherwise an eligible compute promotion reduces the compute price by that compute tier promotion_discount,
    and an absent or expired promotion gives zero discount. Multiply the selected compute unit price once by one
    minus its applicable compute discount to obtain the effective cloud rate; all source intervals in this reconciliation
    use us_east and on-demand standard configuration. Sum completed primary support spending export quantity in
    vcpu_hour for the selected original charge and period; rejected exports and supplemental baseline exports are
    excluded. Multiply missing exported vCPU-hours by the effective cloud rate to obtain missing eligible supported_usd
    spending. Floor missing eligible spending at zero, then round only the resulting supported_usd quantity half
    up to six decimal places. For the single aggregated missing-spend meter, copy support_event_id exactly from
    the selected latest billing review's related_event_id, and store that same reference as the new meter's related_event_id.
    This review-designated export is the sole evidence locator for the aggregate; every qualifying export fragment
    still contributes its quantity, but no other fragment's identifier may substitute as the locator.
  prerequisite: []
  cross_category:
  - category: compute
    as: branch
    reads:
    - negotiated_unit_rate
    - negotiated_approval
    - variant_name
    - promotion_status
    - region
    note: Reconstruct the eligible pretax compute spending from its actual source quantities and approved compute
      unit price; this does not grant a support discount.
  params: {}
  inputs:
    history:
    - table: support_events
      aggregate: sum
      field: quantity
      filters:
        status: completed
    cross_category:
    - compute
  compute:
  - source: LATEST('support_events','source_event_id',event_type='support_review',date_field='occurred_at')
  - period: LATEST('support_events','period',event_type='support_review',date_field='occurred_at')
  - approved: CFIELD('compute','negotiated_approval',status='active',billing_entity=F('billing_entity')) == 'approved'
  - cloud_rate: CFIELD('compute','negotiated_unit_rate',status='active',billing_entity=F('billing_entity')) if approved
      else (CPARAM('compute','unit_rate',status='active',billing_entity=F('billing_entity')) or 0)
  - cloud_discount: 0 if approved else (CPARAM('compute','promotion_discount',status='active',billing_entity=F('billing_entity'))
      if CFIELD('compute','promotion_status',status='active',billing_entity=F('billing_entity')) == 'eligible' else
      0)
  - effective_cloud_rate: cloud_rate * (1-cloud_discount)
  - missing_hours: SUM('support_events','quantity',event_type='support_service_record',status='completed',source_subtype='primary',source_event_id=source,period=period)
  - spend: missing_hours*effective_cloud_rate
  - result: int(MX(0,spend)*1000000+0.5)/1000000
  compute_basis:
    source: The latest billing review by occurred_at identifies the precise original source charge and its service
      period.
    period: The latest billing review by occurred_at identifies the precise original source charge and its service
      period.
    approved: Select the same-customer active compute contract with the same billing_entity; use its approved negotiated_unit_rate,
      otherwise its tier unit_rate. If there is no matching compute contract, the reconstructed compute rate is
      zero and no compute-spend contribution is recognized.
    cloud_rate: Select the same-customer active compute contract with the same billing_entity; use its approved
      negotiated_unit_rate, otherwise its tier unit_rate. If there is no matching compute contract, the reconstructed
      compute rate is zero and no compute-spend contribution is recognized.
    cloud_discount: For these on-demand compute export reconstructions, an approved negotiated rate receives no
      further discount; otherwise an eligible compute promotion reduces the compute price by that compute tier promotion_discount,
      and an absent or expired promotion gives zero discount.
    effective_cloud_rate: Multiply the selected compute unit price once by one minus its applicable compute discount
      to obtain the effective cloud rate; all source intervals in this reconciliation use us_east and on-demand
      standard configuration.
    missing_hours: Sum completed primary support spending export quantity in vcpu_hour for the selected original
      charge and period; rejected exports and supplemental baseline exports are excluded.
    spend: Multiply missing exported vCPU-hours by the effective cloud rate to obtain missing eligible supported_usd
      spending.
    result: Floor missing eligible spending at zero, then round only the resulting supported_usd quantity half up
      to six decimal places.
- id: support_ext_corrected_fee
