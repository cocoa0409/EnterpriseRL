  rule: Before completing the corrected support-fee review, the missing compute-spend export for its original source
    charge must have a posted primary support meter. An accountant can complete this arithmetic billing review synchronously
    from already official exports and signed rates. An incorrect source bill receives an approved review with decision
    incorrect, corrected net_amount, zero tax_amount, and equivalent vCPU-hour quantity. The latest billing review
    by occurred_at identifies the precise original source charge and its service period. Select the same-customer
    active compute contract with the same billing_entity; use its approved negotiated_unit_rate, otherwise its tier
    unit_rate. If there is no matching compute contract, the reconstructed compute rate is zero and no compute-spend
    contribution is recognized. For these on-demand compute export reconstructions, an approved negotiated rate
    receives no further discount; otherwise an eligible compute promotion reduces the compute price by that compute
    tier promotion_discount, and an absent or expired promotion gives zero discount. Multiply the selected compute
    unit price once by one minus its applicable compute discount to obtain the effective cloud rate; all source
    intervals in this reconciliation use us_east and on-demand standard configuration. Sum posted primary support_meter
