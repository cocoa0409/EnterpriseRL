- id: support_evt_request
  subject:
  - support_request
  rule: Only the customer may file or cancel an authorization, claim or disposal request. Preserve the exact
    external_reference and the narrowest source_event_id. Set notice_at and occurred_at to the frozen clock
    and status pending on filing; cancellation is a new request event with status cancelled linked to the original
    request. An unsupported channel is refused. A repeated identical request reference returns the existing
    event. Filing a request never confirms a system approval or changes an accounting balance.
  eligibility: []
  params:
    per_tier:
      Northbridge Enterprise Support $10k Spend:
