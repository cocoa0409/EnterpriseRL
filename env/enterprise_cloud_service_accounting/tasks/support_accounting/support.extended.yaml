    quantity is eligible pre-tax cloud service spending net of correction credits, grouped by billing_entity
    and month; service-credit concessions, support fees, taxes and cash remittances are excluded. marketplace_included
    decides whether marketplace lines enter that base. Charge the greater of minimum_monthly_fee and eligible
    supported_usd times the effective unit_rate after the ordinary non-stacked discount selection, prorating
    the minimum by actual active seconds in the UTC month for partial-month service. An approved annual support-spend
    commitment uses reservation_discounts for its covered spend; a promotion, portfolio discount or negotiated
    percentage instead follows evt_pricing priority. No discount reduces the minimum_monthly_fee, which remains
    the last floor applied to the monthly net fee. The source commitment is a signed support-spend obligation,
    never an infrastructure reservation borrowed from a different category. named_contacts bills contacts above
    included_contacts at additional_contact_fee per contact-month. architecture_reviews bills completed reviews
    above included_reviews at extra_review_fee. onsite_days bills authorized delivered consultant-days at onsite_day_fee.
