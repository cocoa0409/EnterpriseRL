  - approved: CFIELD('compute','negotiated_approval',status='active',billing_entity=F('billing_entity')) == 'approved'
  - cloud_rate: CFIELD('compute','negotiated_unit_rate',status='active',billing_entity=F('billing_entity')) if approved
      else (CPARAM('compute','unit_rate',status='active',billing_entity=F('billing_entity')) or 0)
  - cloud_discount: 0 if approved else (CPARAM('compute','promotion_discount',status='active',billing_entity=F('billing_entity'))
      if CFIELD('compute','promotion_status',status='active',billing_entity=F('billing_entity')) == 'eligible' else
      0)
  - effective_cloud_rate: cloud_rate * (1-cloud_discount)
  - recognized: SUM('support_events','quantity',event_type='support_meter',status='posted',source_subtype='primary',source_event_id=source,period=period)
  - baseline_hours: SUM('support_events','quantity',event_type='support_service_record',status='completed',source_subtype='supplemental',source_event_id=source,period=period)
  - support_rate: F('negotiated_unit_rate') if F('negotiated_approval') == 'approved' else P('unit_rate')
