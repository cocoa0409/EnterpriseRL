  rule: The bank record confirms the remittance as completed. Record only a bank-confirmed remittance using
    a payment_methods rail and the amount actually received in currency. Customer consent to dispose of funds
    belongs to the customer; the agent only allocates a payment already confirmed by the bank. Apply an explicitly
    referenced invoice first; if the remittance omits allocation, use collection_order, sorting invoice_issued_at
    then source_event_id within the same customer and billing entity. Split across exact source invoice lines,
    never across legal billing entities. Each allocation is a separate negative payment amount linked to its
    original charge; any residual is an unallocated overpayment linked to the remittance reference. A repeated
    remittance reference and allocation target returns the existing posting. No receipt is inferred from a
    customer promise, and rejected or pending payments make no posting.
