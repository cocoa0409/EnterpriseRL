name: online_travel_agency
company: Wanderlane Travel Group

background: |
  Wanderlane Travel Group is an online travel agency founded in 2009 and run out of Chicago, selling
  air tickets, hotel stays, car hire, packaged holidays and travel protection through wanderlane.com,
  its mobile applications and a telephone service desk that never closes. It books for roughly 4.1
  million travellers a year across North America, Europe and the Asia-Pacific region, working with
  about 480 airlines, 210,000 properties, nine car rental groups, four cruise lines, two tour
  operating brands of its own and two underwriters. Its house style is plain, unhurried and factual:
  the desk explains what a traveller bought and what it now permits, rather than selling them
  something else. Air tickets are sold under seven fare brands — Basic Economy Lite, Economy Saver,
  Economy Classic, Economy Flex, Premium Economy Select, Business Saver and Business Flex — and each
  booking is held as a record that carries its brand, its record locator and its money from the first
  hold through ticketing to travel, refund or credit. Hotel stays are sold under seven rate plans —
  the Non-Refundable Saver Rate, the Advance Purchase 21 Rate, the Semi-Flexible Rate, the Standard
  Flexible Rate, the Member Flex Rate, the Suite Flexible Rate and the All-Inclusive Flex Rate — and
  each reservation keeps a folio to which room nights, taxes, facility charges and extras are posted
  night by night. Travel protection is sold as Trip Basics Essential, Trip Basics Standard, TripGuard
  Plus, TripGuard Premier, Cancel For Any Reason Elite, Annual Multi-Trip Traveller and Annual
  Multi-Trip Executive, each policy carrying a certificate, a declared trip and a claims history. Car
  hire is sold as the Pay Now Saver Rate, the Pay Now Standard Rate, the Pay At Counter Flex Rate, the
  Inclusive Flex Rate, the Premium Inclusive Rate and the Corporate Negotiated Drive Rate, each rental
  booking its own ledger of rental days, protection products, fuel and post-return recharges. Packaged
  holidays are sold as the Value Bundle Package, the Flex Bundle Package, the All-Inclusive Resort
  Package, the Escorted Tour Package, the Ocean Cruise Package and the Luxury Collection Package, each
  running from quotation through deposit and balance to departure and return. The loyalty programme,
  the Wanderlane Traveller Club, runs from Wanderlane Blue through Silver, Gold, Platinum and Titanium
  to Wanderlane Ambassador, and a membership accrues points from whatever the member books elsewhere
  in the house. Companies buy the desk's services under the Business Starter, Business Team, Business
  Pro, Business Enterprise, Business Enterprise Plus and Business Global Programmes, each programme
  contracting seats for named travellers and receiving one consolidated bill. Every product is held as
  a living record rather than a purchase: it is opened, it changes, it produces a stream of booked
  lines, and it eventually closes. The people who call are ordinary travellers with tangled
  portfolios: a family holding a cheap fare brand and an expensive protection plan, a Gold member with
  three overlapping hotel reservations in one city, a small firm whose staff book on a corporate
  programme while keeping their own club cards. Most callers arrive part way through a journey, with a
  record locator half remembered, a supplier's message in hand and several bookings that touch one
  another. Their histories are long: travel credits from cancelled trips two years old, claims still
  open with an underwriter, damage recharged after a car was returned, points about to lapse.

logs:
  verification_log_table: verification_log
  handoff_log_table: handoff_log

difficulties:
  - name: air_ticketing_desk
    claim:
      categories: [air]
      event_types: [air_book_create, air_ticket_issue, air_cancel_confirm, air_refund_open,
                    air_refund_settle, air_contact_amend, air_fare_charge, air_ancillary_charge,
                    air_change_fee_charge, air_penalty_charge, air_refund_payout, air_credit_issue,
                    air_credit_redeem, air_schedule_change_notice]
    summary: >
      The callers here are travellers who already hold one or more air bookings and want something
      done to them: to change dates or routing, to cancel and get their money or a voucher back, to
      add bags or seats, to correct a misspelled name, to redeem an old travel credit against a new
      itinerary, or to work out what an airline's schedule message now entitles them to. The setting
      varies along four axes that genuinely combine: which of the seven fare brands the booking
      carries, where the booking stands in its life (an unticketed hold, a ticketed itinerary, a
      cancelled one awaiting a claim, one already settled), what else the traveller holds (a
      Wanderlane Traveller Club membership at some tier, a corporate programme reference on the
      booking, a travel protection policy bought alongside), and what the booking's own history
      already contains (earlier voluntary changes, vouchers issued and partly spent, disruption
      notices, a no-show). The records in play are the air booking itself, the lines already posted to
      it, and the back-office service requests raised against it; the rules that govern them are
      air_ticketing on what may be sold at all, air_change_fee and air_cancel_refund on what a rework
      or a cancellation costs and returns, air_penalty on no-shows, air_baggage_fee and
      air_seat_and_cabin_extras on optional extras, air_credit_validity and air_agg_credit_pooling on
      vouchers, air_evt_schedule_change_rights on what an airline's move confers,
      air_name_correction on misspellings, air_refund_settlement and air_price_drop_guarantee on what
      is actually paid out, and air_club_benefit_interaction and air_biz_exclusion on how a club tier
      or a corporate reference changes the answer. Several of these carry eligibility gates that must
      hold before anything is written — the booking must stand in a particular state, a refund claim
      must already be authorised by an approved back-office review, a time window must not yet have
      run out — and in the ordinary course of this domain a booking is held before it is ticketed,
      ticketed before it can be reworked, cancelled before a claim can be lodged, and a claim lodged
      before anything settles. The agent's own service actions are reading the portfolio, pricing the
      rework or the cancellation from the brand held, raising the fee, penalty, extra, payout or
      voucher lines, lodging the claim and correcting contact details; but cancelling a ticket is the
      traveller's own act on their own asset and is confirmed by them rather than performed for them,
      as is any disposal of a voucher standing in their name. Genuinely uncovered ground exists and
      must be recognised rather than improvised around: statutory delay or denied-boarding
      compensation owed by an airline under its own regulator, a request that the agency obtain a
      commercial waiver from an airline outside the published schedule-change terms, a refund sought
      on compassionate or medical grounds on a brand that refunds nothing, a party at or above the
      brand's group threshold, and any ticket the traveller bought somewhere else — none of these can
      be decided from this charter, and the only correct route is a handoff recorded as
      POLICY_NOT_COVERED.

  - name: hotel_reservations_desk
    claim:
      categories: [stay]
      event_types: [stay_reserve, stay_confirm, stay_cancel, stay_no_show, stay_check_in,
                    stay_check_out, stay_guest_amend, stay_room_charge, stay_deposit_charge,
                    stay_tax_and_fee_charge, stay_incidental_charge, stay_cancellation_charge,
                    stay_no_show_charge, stay_refund_payout, stay_resort_credit_grant,
                    stay_resort_credit_use, stay_property_notice]
    summary: >
      The callers here are guests with hotel reservations who want to move dates, give up rooms,
      query what has landed on a folio, understand what a property's own message means for them, or
      settle what is owed after a stay has ended. The setting varies with the rate plan booked — the
      seven plans differ sharply on prepayment, on what may be changed, on what a late cancellation
      costs and on what the nightly rate includes — with where the reservation stands (merely
      reserved, confirmed by the property, in house, departed, cancelled or recorded as a no-show),
      with the portfolio around it (a club tier that carries a discount and a guaranteed late
      departure, a corporate programme reference that replaces consumer pricing, several overlapping
      reservations in one city), and with the reservation's own history (nights already posted, a
      deposit already taken, property credit granted and partly spent, a relocation notice, earlier
      cancellations in the guest's twelve-month record). The records in play are the reservation, its
      folio lines and the change requests raised with the property desk; the governing rules are
      stay_booking_terms on what may be sold, stay_deposit_and_prepayment on what is taken up front,
      stay_cancellation and stay_no_show_terms on what is withheld and when, stay_room_and_occupancy
      and stay_taxes_and_fees on how nights, occupants and statutory charges are priced,
      stay_incidentals on what may be posted during the stay, stay_resort_credit on the property
      credit the plan includes, stay_modification on date and name changes,
      stay_evt_property_notice on relocation, stay_refund_settlement and stay_best_rate_guarantee on
      what is actually returned, and stay_agg_multi_holding and stay_agg_portfolio_occupancy on how
      several reservations do and do not interact. Eligibility gates decide whether a write may
      happen at all — a free cancellation window measured from the property's confirmation, a status
      the reservation must stand in before extras or payouts may be posted, an approved relocation on
      file before an allowance is paid, and a single best-rate settlement per reservation — and the
      domain's ordinary order runs from reservation to property confirmation, from confirmation to
      arrival, and from departure to the settlement of the folio. The agent prices and posts folio
      lines, raises and settles refunds, corrects contact details and lodges requests with the
      property desk, while cancelling a confirmed reservation is the guest's own act on their own
      booking and is confirmed by them, as is giving up particular rooms out of several. Uncovered
      ground includes a complaint about the condition or cleanliness of a room, a dispute with a
      property over a charge raised at its own front desk after departure, a request to move a
      reservation to a different property or a different brand, a group of rooms at or above the
      plan's group threshold, and a claim for consequential loss caused by an overbooking; none of
      these can be decided from the rate plans, and the correct route is a POLICY_NOT_COVERED
      handoff.

  - name: travel_protection_desk
    claim:
      categories: [care]
      event_types: [care_quote, care_issue, care_incept, care_expire, care_cancel,
                    care_midterm_cancel, care_insured_amend, care_premium_charge,
                    care_premium_adjustment, care_premium_refund, care_claim_file,
                    care_claim_decision, care_claim_payout, care_claim_recovery]
    summary: >
      The callers here are policyholders and travellers who want cover quoted or corrected, cover
      given up, a claim filed against a benefit, or an explanation of what an insurer has already
      decided. The setting varies with the plan held — the seven plans differ on what they cover at
      all, on their limits and deductibles, on whether a pre-existing condition waiver or a
      cancel-for-any-reason benefit exists, and on how long a claim may be left before it is filed —
      with where the policy stands (quoted, issued but not yet incepted, in force during the journey,
      expired, or cancelled), with the rest of the portfolio (an air booking or a vacation package
      the cover was bought alongside and rated on, a club tier carrying a premium discount, a second
      policy that answers the same incident), and with the policy's own history (premium already
      adjusted after a change of declared particulars, benefit already consumed by an earlier claim,
      a claim under appeal). The records in play are the policy, its premium lines, its claim records
      and the requests raised with the underwriting desk; the governing rules are care_underwriting
      on what may be issued to whom, care_premium_rating on how the premium is built and re-rated,
      care_free_look and care_midterm_cancellation on giving cover up, care_coverage_term on when
      cover actually runs, care_claim_filing on what may be filed and by when, care_claim_assessment
      on how a decision is reached and appealed, care_claim_settlement on what is actually paid after
      limits and deductibles, care_subrogation on recoveries, care_policy_amendment on corrections
      and upgrades, care_agg_multi_holding and care_agg_benefit_coordination on how two policies
      interact, and care_club_and_bundle_interaction on discounts and linked bookings. Gates
      determine whether a write is permissible before it is made — the free-look window measured from
      the moment the certificate was issued, a policy status in which a claim may be filed at all, no
      earlier claim already filed under the same claim reference, and an approved underwriting review
      on file before cover is upgraded — and in the ordinary run of this domain a policy is quoted
      before it is issued, issued before it incepts, incepted before most benefits answer, and a
      claim is filed before it is decided and decided before it is paid. The agent quotes and rates,
      corrects declared particulars, records what the insurer has decided and raises the premium,
      refund and payment lines; giving up cover is the policyholder's own act on their own contract
      and is confirmed by them, and so is the filing of a claim in their own name. Uncovered ground
      is real here: a medical opinion on whether a condition was pre-existing, a request that the
      agency overturn or press the insurer on a declined claim, cover sought for a journey already
      begun, a benefit the plan simply does not carry, and any question about a policy bought from
      another underwriter — none of these is decidable from the plans, and the correct route is a
      POLICY_NOT_COVERED handoff.

  - name: car_rental_desk
    claim:
      categories: [drive]
      event_types: [drive_book, drive_confirm, drive_cancel, drive_no_show, drive_pick_up,
                    drive_return, drive_driver_amend, drive_rate_charge, drive_prepay_charge,
                    drive_extras_charge, drive_fuel_charge, drive_damage_charge,
                    drive_cancellation_charge, drive_no_show_charge, drive_refund_payout,
                    drive_mileage_grant, drive_mileage_use, drive_supplier_notice]
    summary: >
      The callers here are renters with a car booking who want to change times or branches, give the
      rental up, query a charge that appeared days after they handed the keys back, or understand
      what their rate class actually included. The setting varies with the rate class booked — the
      six classes differ on prepayment, on included mileage, on which protection products are carried
      and at what excess, on the fuel arrangement, and on what a late cancellation or a no-show costs
      — with where the rental stands (booked, confirmed, collected, returned, cancelled or recorded
      as a no-show), with the portfolio around it (a club tier carrying a discount and a possible
      class upgrade, a corporate programme reference that replaces consumer pricing, a travel
      protection policy that may answer a damage recharge), and with the rental's own history (extras
      already sold, miles already consumed against the allowance, a supplier notice about vehicle
      availability, damage recharges in the renter's twenty-four-month record). The records in play
      are the rental, its ledger lines and the reviews raised with the rental desk; the governing
      rules are drive_booking_terms on who and what may be booked, drive_prepayment on what is taken
      up front and what the deposit hold is, drive_cancellation and drive_no_show_terms on what is
      withheld, drive_rate_and_extras on how days, drivers, protection and equipment are priced,
      drive_mileage on the included allowance and excess miles, drive_fuel on the fuel settlement,
      drive_damage_and_recharges on damage, cleaning, tolls and fines, drive_refund_settlement on what
      is returned, drive_modification on changes, drive_evt_supplier_notice on substitution and
      unavailability, and drive_agg_multi_holding, drive_agg_rental_history and
      drive_club_and_corporate_interaction on how rentals and the wider portfolio do and do not
      interact. Gates stand in front of several of these writes — a status the rental must be in
      before extras, fuel or recharges may be posted, an approved damage assessment on file before
      damage is recharged, a reporting window measured from the moment the vehicle was returned, and
      the renter's own statement of the closing odometer reading — and the domain's ordinary order
      runs from booking to supplier confirmation, confirmation to collection, collection to return,
      and return to the settlement of recharges. The agent prices and posts ledger lines, settles
      fuel and mileage, raises refunds, lodges reviews and amends the rental's particulars, while
      cancelling a confirmed rental is the renter's own act and is confirmed by them. Uncovered
      ground includes a personal injury or liability claim arising from an accident, a dispute with a
      road authority over the underlying fine rather than the administration charge, a request to
      have the supplier's own counter upsell reversed, a demand for a replacement vehicle from a
      branch that has none, and a rental booked directly with the supplier; these cannot be decided
      here and the correct route is a POLICY_NOT_COVERED handoff.

  - name: vacation_packages_desk
    claim:
      categories: [bundle]
      event_types: [bundle_quote, bundle_deposit, bundle_confirm, bundle_depart, bundle_complete,
                    bundle_cancel, bundle_predeposit_cancel, bundle_party_amend,
                    bundle_deposit_charge, bundle_final_payment_charge, bundle_component_charge,
                    bundle_penalty_charge, bundle_refund_payout, bundle_credit_issue,
                    bundle_credit_redeem, bundle_supplier_notice]
    summary: >
      The callers here are lead travellers holding a packaged holiday who want to change the party or
      the dates, ask what the balance is and when it falls due, give the package up, respond to an
      operator's notice about the itinerary or a surcharge, or spend a future travel credit from a
      trip they never took. The setting varies with the product booked — the six products differ on
      deposits and payment schedules, on what the price includes, on what may be amended and at what
      cost, on the cancellation ladder and on whether value comes back as money or as a voucher —
      with where the package stands (quoted, holding only a deposit, fully paid and confirmed, under
      way, completed or cancelled), with the party itself (single occupancy, a third adult sharing,
      children and infants, a group large enough to earn a free place), and with the portfolio around
      it (a club tier carrying a package discount, a travel protection policy some products require,
      a corporate programme that most products do not accept). The records in play are the package,
      its ledger lines and the change requests raised with the operations desk; the governing rules
      are bundle_booking_terms on what may be sold and what deposit is taken,
      bundle_payment_schedule on when the balance falls due and how instalments run,
      bundle_agg_party_pricing on supplements, discounts and free places, bundle_components on what
      the price includes and what is charged separately, bundle_cancellation on the ladder and the
      administration charge, bundle_refund_settlement and bundle_credit on how value comes back,
      bundle_amendment on name, date and component changes, bundle_travel_period on the journey
      itself, bundle_evt_supplier_notice on surcharges and significant changes, and
      bundle_club_and_corporate_interaction on discounts across the house. Gates stand before the
      writes — a status the package must stand in before components are priced, a voucher redeemed or
      a payout raised, an approved change request on file before the party or the dates are moved, at
      most one future travel credit voucher per package, and a price-guarantee term that must have
      run out before the balance is taken — and the ordinary order of this domain runs from
      quotation to deposit, deposit to balance, balance to departure and departure to return.
      The agent quotes and prices the party, posts deposit, instalment, component and penalty lines,
      raises payouts and vouchers, and lodges change requests; giving up places on a package is the
      party's own act, confirmed by the lead traveller, who also says which places are being given
      up. Uncovered ground is genuine: a complaint about the quality of a resort, a ship or a guided
      tour, a claim for consequential loss when a supplier within the package failed, a request to
      split one package into two separate bookings, a party at or above the product's group threshold,
      and any element of the holiday the traveller arranged themselves — none can be decided from
      these products, and the only correct route is a POLICY_NOT_COVERED handoff.
