- id: air_penalty
  subject:
  - air_penalty_charge
  rule: 'A traveller who neither flies nor cancels before the outbound departure is recorded as a no-show, and the no-show penalty of the fare brand held is withheld from whatever value the ticket still
    carries. A no-show on the outbound leaves the return leg unusable on every brand, and the return is treated as cancelled on the brand''s own terms once the no-show penalty has been withheld. A cancellation
    penalty and a no-show penalty are never withheld against the same ticket: whichever applies replaces the other. A penalty is never withheld where the traveller could not travel because the airline did
    not operate the flight, and the disruption terms apply instead. Where the value still on the ticket is smaller than the penalty, the penalty is limited to that value and no balance is pursued. The infant
    share of a fare and the child discount are applied before the penalty is measured, so the penalty is never larger than what that traveller actually paid.'
  eligibility: []
  params:
    per_tier:
      Basic Economy Lite:
        no_show_penalty_usd: =no_show_penalty_usd
        cancel_penalty_usd: =cancel_penalty_usd
        infant_fee_pct_of_fare: =infant_fee_pct_of_fare
        child_discount_pct: =child_discount_pct
      Economy Saver:
        no_show_penalty_usd: =no_show_penalty_usd
        cancel_penalty_usd: =cancel_penalty_usd
        infant_fee_pct_of_fare: =infant_fee_pct_of_fare
        child_discount_pct: =child_discount_pct
      Economy Classic:
        no_show_penalty_usd: =no_show_penalty_usd
        cancel_penalty_usd: =cancel_penalty_usd
        infant_fee_pct_of_fare: =infant_fee_pct_of_fare
        child_discount_pct: =child_discount_pct
      Economy Flex:
        no_show_penalty_usd: =no_show_penalty_usd
        cancel_penalty_usd: =cancel_penalty_usd
        infant_fee_pct_of_fare: =infant_fee_pct_of_fare
        child_discount_pct: =child_discount_pct
      Premium Economy Select:
        no_show_penalty_usd: =no_show_penalty_usd
        cancel_penalty_usd: =cancel_penalty_usd
        infant_fee_pct_of_fare: =infant_fee_pct_of_fare
