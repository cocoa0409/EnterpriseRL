events:
- type: air_book_create
  target: air_bookings
  mutation: create
  meaning: A traveller opens an air booking on the platform and the itinerary is held under a fare brand.
  grain: One row per air booking opened, whatever the number of travellers on it.
  fields:
    air_booking_id: reference of the new booking
    customer_id: traveller who owns it
    variant_name: fare brand sold
    status: the booking opens as an unticketed hold
    record_locator: airline record locator returned at booking
    origin_airport: departure airport of the outbound journey
    destination_airport: arrival airport of the outbound journey
    departure_date: outbound departure date
    return_date: return departure date, empty on a one-way
    booked_date: date the booking was opened
    passenger_count: number of travellers on the booking
    cabin_class: cabin the itinerary is held in
    fare_basis_code: fare basis the brand was sold under
    contact_email: contact address for airline notices
    contact_phone: contact number for airline notices
    corporate_program_id: corporate programme the booking is made under, empty for a consumer booking
  triggers: []
- type: air_ticket_issue
  target: air_bookings
  mutation:
    transition:
      from: held
      to: ticketed
  meaning: The airline issues the ticket once payment for the held itinerary is captured.
  grain: One row per booking, at the moment its ticket is issued.
  fields:
    air_booking_id: booking being ticketed
    status: the booking becomes ticketed
    ticketed_at: moment of issue
    amount_paid_usd: running paid total after the fare is captured
  triggers:
  - event: air:air_fare_charge
    map:
      air_booking_id: air_booking_id
      charge_category: base_fare
      reason_code: routine_booking
  - event: club:club_points_accrual
    map:
      customer_id: customer_id
      accrual_source: air_ticket
- type: air_cancel_confirm
  target: air_bookings
  mutation:
    transition:
      from: ticketed
      to: cancelled
  meaning: The traveller confirms cancellation of their own ticketed itinerary.
  grain: One row per booking, at the moment the traveller confirms the cancellation.
  fields:
    air_booking_id: booking being cancelled
    status: the booking becomes cancelled
    cancelled_at: moment the traveller confirmed
    refund_form: form in which value will be returned under the fare brand held
  triggers:
  - event: air:air_refund_open
    when:
      refund_form:
        not: none
    map:
      air_booking_id: air_booking_id
      refund_form: refund_form
      status: refund_pending
- type: air_refund_open
  target: air_bookings
  mutation:
    transition:
      from: cancelled
      to: refund_pending
  meaning: The refund or credit claim for a cancelled booking is lodged with the airline.
  grain: One row per booking, at the moment its refund claim is lodged.
  fields:
    air_booking_id: booking whose claim is lodged
    status: the booking moves to refund pending
    refund_form: form the claim will settle in
  triggers:
  - event: air:air_refund_payout
    when:
      refund_form: original_payment
    map:
      air_booking_id: air_booking_id
      charge_category: refund_payout
  - event: air:air_credit_issue
    when:
      refund_form: travel_credit
    map:
      air_booking_id: air_booking_id
      charge_category: credit_issue
- type: air_refund_settle
  target: air_bookings
  mutation:
    transition:
      from: refund_pending
      to: refunded
  meaning: The airline settles the lodged claim and the booking's balances come to rest.
  grain: One row per booking, at the moment its claim settles.
  fields:
    air_booking_id: booking whose claim settled
    status: the booking becomes refunded
    amount_paid_usd: net paid total after the payout
    credit_balance_usd: open travel credit after the issue
  triggers: []
- type: air_contact_amend
  target: air_bookings
  mutation: update
  meaning: The traveller's disruption contact details on a booking are corrected.
  grain: One row per booking, each time its contact details are corrected.
  fields:
    air_booking_id: booking being corrected
    contact_email: corrected contact address
    contact_phone: corrected contact number
  triggers: []
- type: air_fare_charge
  target: air_booking_events
  meaning: A fare, tax or agency service line is charged to the traveller for this booking.
  grain: One row per money line charged for one traveller on one itinerary component.
  distinguish_by:
  - charge_category
  - passenger_sequence
  - segment_sequence
  - posted_at
  fields:
    air_event_id: reference of the line
    air_booking_id: booking charged
    customer_id: traveller charged
    event_type: family of the line
    charge_category: whether the line is base fare, taxes and carrier fees or the agency service fee
    amount_usd: positive amount charged
    currency_charged: currency presented to the card
    posted_date: date the line posted
    posted_at: moment the line posted
    passenger_sequence: traveller the line belongs to
    segment_sequence: segment the line belongs to
    payment_channel: channel the line was taken through
    reason_code: business reason the line was raised
  account: fare_paid
  direction: in
  triggers:
  - event: club:club_points_accrual
    when:
      charge_category: base_fare
    map:
      customer_id: customer_id
      accrual_source: air_ticket
- type: air_ancillary_charge
  target: air_booking_events
  meaning: An optional extra — a checked bag, a seat, priority boarding, a pet or an unaccompanied minor — is charged to the booking.
  grain: One row per optional extra sold, for one traveller and, where it applies, one bag or one segment.
  distinguish_by:
  - charge_category
  - passenger_sequence
  - bag_sequence
  - segment_sequence
  - posted_at
  fields:
    air_event_id: reference of the line
    air_booking_id: booking charged
    customer_id: traveller charged
    event_type: family of the line
    charge_category: which optional extra was sold
    amount_usd: positive amount charged
    currency_charged: currency presented to the card
    posted_date: date the line posted
    posted_at: moment the line posted
    passenger_sequence: traveller the extra belongs to
    segment_sequence: segment the extra belongs to
    bag_sequence: bag the extra belongs to
    payment_channel: channel the extra was sold through
    reason_code: business reason the extra was sold
  account: fare_paid
  direction: in
  triggers: []
- type: air_change_fee_charge
  target: air_booking_events
  meaning: A change fee, a same-day move fee or a name-correction fee is charged for reworking an issued ticket.
  grain: One row per rework charged, for one traveller on one ticket.
  distinguish_by:
  - charge_category
  - reason_code
  - passenger_sequence
  - posted_at
  fields:
    air_event_id: reference of the line
    air_booking_id: booking reworked
    customer_id: traveller charged
    event_type: family of the line
    charge_category: whether the line is a change fee or a name-correction line
    amount_usd: positive amount charged
    currency_charged: currency presented to the card
    posted_date: date the line posted
    posted_at: moment the line posted
    passenger_sequence: traveller reworked
    payment_channel: channel the rework was taken through
    source_event_id: the original fare line this rework is raised against
    reason_code: business reason for the rework
  account: fare_paid
  direction: in
  triggers: []
- type: air_penalty_charge
  target: air_booking_events
  meaning: A cancellation penalty or a no-show penalty is withheld from the traveller.
  grain: One row per penalty withheld, for one traveller on one ticket.
  distinguish_by:
  - charge_category
  - reason_code
  - passenger_sequence
  - posted_at
  fields:
    air_event_id: reference of the line
    air_booking_id: booking penalised
    customer_id: traveller penalised
    event_type: family of the line
    charge_category: whether the penalty is a cancellation penalty or a no-show penalty
    amount_usd: positive amount withheld
    currency_charged: currency the penalty is expressed in
    posted_date: date the penalty posted
    posted_at: moment the penalty posted
    passenger_sequence: traveller penalised
    source_event_id: the original fare line the penalty is withheld against
    reason_code: business reason for the penalty
  account: fare_paid
  direction: in
  triggers: []
- type: air_refund_payout
  target: air_booking_events
  meaning: Money is returned to the traveller's original form of payment.
  grain: One row per payout returned against one original fare line.
  distinguish_by:
  - charge_category
  - source_event_id
  - passenger_sequence
  - posted_at
  fields:
    air_event_id: reference of the payout line
    air_booking_id: booking refunded
    customer_id: traveller refunded
    event_type: family of the line
    charge_category: whether the payout settles a cancellation or a price-drop claim
    amount_usd: negative amount returned
    currency_charged: currency the money was returned in
    posted_date: date the payout posted
    posted_at: moment the payout posted
    passenger_sequence: traveller refunded
    source_event_id: the original fare line being refunded
    reason_code: business reason for the payout
  account: fare_paid
  direction: out
  triggers: []
- type: air_credit_issue
  target: air_booking_events
  meaning: A travel credit voucher is issued to the traveller in place of money.
  grain: One row per voucher issued against one cancelled ticket.
  distinguish_by:
  - credit_voucher_code
  - passenger_sequence
  - posted_at
  fields:
    air_event_id: reference of the issue line
    air_booking_id: booking the voucher came from
    customer_id: traveller the voucher belongs to
    event_type: family of the line
    charge_category: the line issues a travel credit
    amount_usd: positive value placed on the voucher
    posted_date: date the voucher was issued
    posted_at: moment the voucher was issued
    passenger_sequence: traveller the voucher was issued for
    credit_voucher_code: code of the voucher issued
    credit_expires_on: last date the voucher may be redeemed
    source_event_id: the original fare line the voucher replaces
    reason_code: business reason the voucher was issued
  account: travel_credit
  direction: in
  triggers: []
- type: air_credit_redeem
  target: air_booking_events
  meaning: A travel credit voucher is applied to the price of a new itinerary.
  grain: One row per voucher redemption applied to one new booking.
  distinguish_by:
  - credit_voucher_code
  - passenger_sequence
  - posted_at
  fields:
    air_event_id: reference of the redemption line
    air_booking_id: booking the voucher is applied to
    customer_id: traveller redeeming
    event_type: family of the line
    charge_category: the line redeems a travel credit
    amount_usd: negative value taken off the voucher
    posted_date: date the redemption posted
    posted_at: moment the redemption posted
    passenger_sequence: traveller redeeming
    credit_voucher_code: code of the voucher redeemed
    source_event_id: the issue line the voucher was created by
    reason_code: business reason for the redemption
  account: travel_credit
  direction: out
  triggers: []
- type: air_schedule_change_notice
  target: air_booking_events
  meaning: The airline advises that a booked segment has moved in the schedule or been cancelled.
  grain: One row per airline notice about one segment of one booking.
  distinguish_by:
  - notice_reference
  - segment_sequence
  - posted_at
  fields:
    air_event_id: reference of the notice line
    air_booking_id: booking advised
    customer_id: traveller advised
    event_type: family of the line
    notice_reference: airline notice reference quoted
    schedule_change_minutes: size of the move in minutes
    segment_sequence: segment that moved
    posted_date: date the notice was received
    posted_at: moment the notice was received
    reason_code: whether the move is a schedule change or an airline cancellation
  triggers: []
measures:
- id: air_msr_voluntary_changes_12m
  window: rolling 12 months ending on the handling date, counted back day by day from the frozen handling date
  measure: count of air_change_fee_charge rows on the same booking whose reason_code is voluntary_change
- id: air_msr_disruption_notices_90d
  window: rolling 90 days ending on the handling date, counted back day by day from the frozen handling date
  measure: count of air_schedule_change_notice rows on the same booking
policies:
- id: air_agg_multi_holding
  subject:
  - air_book_create
  rule: 'A traveller may hold any number of air bookings at the same time, and each booking carries its own fare brand, its own money and its own terms. Two bookings for the same traveller on the same routing
    and the same departure date are treated as a duplicate: the later booking is opened, then referred for duplicate review before it is ticketed, because airlines refuse duplicate tickets in one name.
    Nothing in this charter aggregates the terms of two bookings: a benefit earned on one booking is never spent on another except through the travel-credit account, which is governed separately.'
  eligibility: []
  params:
    max_per_customer: null
    duplicate_review_routing_match: true
- id: air_agg_credit_pooling
  subject:
  - air_credit_redeem
  rule: Travel credits issued from a traveller's cancelled bookings form one pool in that traveller's name, and a new itinerary may be paid for out of several vouchers at once. Vouchers are consumed in
    order of expiry, the soonest to lapse first, and where two vouchers lapse on the same date the one issued earlier is consumed first. A travel credit is applied to a new itinerary only when frozen time
    is not after the moment the voucher was issued against the traveller's cancelled booking plus the credit validity term of the fare brand that produced it. Credit validity is counted in whole calendar
    months from the voucher issue date, and where the issue day does not exist in the expiry month the voucher lapses on the last day of that month. A voucher may only be redeemed by the traveller it was
    issued to unless the fare brand that produced it makes credits transferable. Where the pooled value exceeds the price of the new itinerary the remainder stays on the last voucher touched and keeps that
    voucher's original expiry; the expiry is never extended by redemption. Where the pooled value falls short the difference is collected in the original form of payment, and a partly paid itinerary is
    never ticketed.
  eligibility:
  - id: credit_still_valid
    applies_to:
    - air_credit_redeem
    kind: time
    condition: A travel credit is applied to a new itinerary only when frozen time is not after the moment the voucher was issued against the traveller's cancelled booking plus the credit validity term
      of the fare brand that produced it.
    evidence_fields:
    - air_booking_events.posted_at
    - air_booking_events.credit_voucher_code
    - air_booking_events.credit_expires_on
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - air_booking_events.credit_voucher_code
      action_bindings:
        air_booking_events.credit_voucher_code: credit_voucher_code
    temporal_basis:
      clock: frozen_time
      anchor_event: the moment the voucher was issued against the traveller's cancelled booking
      anchor_source: air_booking_events.posted_at
      relation: not_after
      duration_source: variants.credit_validity_months
      unit: calendar_months
      counting_rule: Credit validity is counted in whole calendar months from the voucher issue date, and where the issue day does not exist in the expiry month the voucher lapses on the last day of that
        month.
      boundary: inclusive
  params:
    consumption_order: soonest_expiry_first
    tie_break: earliest_issue_first
    per_tier:
      Basic Economy Lite:
        credit_validity_months: =credit_validity_months
        credit_transferable: =credit_transferable
        credit_reissue_fee_usd: =credit_reissue_fee_usd
      Economy Saver:
        credit_validity_months: =credit_validity_months
        credit_transferable: =credit_transferable
        credit_reissue_fee_usd: =credit_reissue_fee_usd
      Economy Classic:
        credit_validity_months: =credit_validity_months
        credit_transferable: =credit_transferable
        credit_reissue_fee_usd: =credit_reissue_fee_usd
      Economy Flex:
        credit_validity_months: =credit_validity_months
        credit_transferable: =credit_transferable
        credit_reissue_fee_usd: =credit_reissue_fee_usd
      Premium Economy Select:
        credit_validity_months: =credit_validity_months
        credit_transferable: =credit_transferable
        credit_reissue_fee_usd: =credit_reissue_fee_usd
      Business Saver:
        credit_validity_months: =credit_validity_months
        credit_transferable: =credit_transferable
        credit_reissue_fee_usd: =credit_reissue_fee_usd
      Business Flex:
        credit_validity_months: =credit_validity_months
        credit_transferable: =credit_transferable
        credit_reissue_fee_usd: =credit_reissue_fee_usd
- id: air_service_fee
  subject:
  - air_fare_charge
  rule: The agency service fee is charged once per traveller on the booking at the moment the ticket is issued, and is stated separately from the airline fare and from taxes and carrier fees. The fee follows
    the fare brand held, not the cabin flown, so a business cabin sold under a saver brand carries the saver brand's fee. The service fee is not refunded when the traveller later cancels, because the service
    it pays for has already been performed; it is refunded in full only where the agency itself cancelled the itinerary in error. Where the traveller elects to be charged in a currency other than the ticketing
    currency, the conversion markup of the fare brand held is added to the converted total, and the markup is disclosed before the card is taken.
  eligibility: []
  params:
    per_tier:
      Basic Economy Lite:
        agency_service_fee_usd: =agency_service_fee_usd
        currency_conversion_markup_pct: =currency_conversion_markup_pct
      Economy Saver:
        agency_service_fee_usd: =agency_service_fee_usd
        currency_conversion_markup_pct: =currency_conversion_markup_pct
      Economy Classic:
        agency_service_fee_usd: =agency_service_fee_usd
        currency_conversion_markup_pct: =currency_conversion_markup_pct
      Economy Flex:
        agency_service_fee_usd: =agency_service_fee_usd
        currency_conversion_markup_pct: =currency_conversion_markup_pct
      Premium Economy Select:
        agency_service_fee_usd: =agency_service_fee_usd
        currency_conversion_markup_pct: =currency_conversion_markup_pct
      Business Saver:
        agency_service_fee_usd: =agency_service_fee_usd
        currency_conversion_markup_pct: =currency_conversion_markup_pct
      Business Flex:
        agency_service_fee_usd: =agency_service_fee_usd
        currency_conversion_markup_pct: =currency_conversion_markup_pct
  formula:
    agency_service_fee_charged_usd: agency_service_fee_usd * passenger_count
- id: air_ticketing
  subject:
  - air_book_create
  - air_ticket_issue
  rule: A fare brand may only be sold when the booking is opened at least the brand's advance-purchase distance ahead of the outbound departure date, when the return falls no earlier than the brand's minimum
    stay and no later than its maximum stay, and when the number of travellers is below the brand's group threshold. An unticketed hold stands for the brand's hold window and is released without charge
    when it lapses; a brand whose hold window is zero must be ticketed in the same session or not sold at all. Ticketing collects the fare, the taxes and carrier fees, and the agency service fee together;
    a partly collected booking is never ticketed. Where the traveller qualifies for an instalment plan under the brand held and the booking value reaches the brand's instalment threshold, the fare may be
    collected in instalments, and the ticket is issued on the first instalment. A group of travellers at or above the brand's group threshold is not ticketed under this charter at all and is passed to the
    group desk.
  eligibility: []
  params:
    per_tier:
      Basic Economy Lite:
        advance_purchase_days: =advance_purchase_days
        min_stay_nights: =min_stay_nights
        max_stay_days: =max_stay_days
        hold_window_hours: =hold_window_hours
        group_booking_min_pax: =group_booking_min_pax
        payment_plan_available: =payment_plan_available
        payment_plan_min_amount_usd: =payment_plan_min_amount_usd
      Economy Saver:
        advance_purchase_days: =advance_purchase_days
        min_stay_nights: =min_stay_nights
        max_stay_days: =max_stay_days
        hold_window_hours: =hold_window_hours
        group_booking_min_pax: =group_booking_min_pax
        payment_plan_available: =payment_plan_available
        payment_plan_min_amount_usd: =payment_plan_min_amount_usd
      Economy Classic:
        advance_purchase_days: =advance_purchase_days
        min_stay_nights: =min_stay_nights
        max_stay_days: =max_stay_days
        hold_window_hours: =hold_window_hours
        group_booking_min_pax: =group_booking_min_pax
        payment_plan_available: =payment_plan_available
        payment_plan_min_amount_usd: =payment_plan_min_amount_usd
      Economy Flex:
        advance_purchase_days: =advance_purchase_days
        min_stay_nights: =min_stay_nights
        max_stay_days: =max_stay_days
        hold_window_hours: =hold_window_hours
        group_booking_min_pax: =group_booking_min_pax
        payment_plan_available: =payment_plan_available
        payment_plan_min_amount_usd: =payment_plan_min_amount_usd
      Premium Economy Select:
        advance_purchase_days: =advance_purchase_days
