- id: air_credit_validity
  subject:
  - air_credit_issue
  rule: A travel credit is issued for the value the cancelled ticket still carried after any penalty has been withheld, and carries an expiry set by the credit validity term of the fare brand that produced
    it. A voucher is issued only while the booking record stands at cancelled, refund pending or refunded. The voucher is issued in the name of the traveller the ticket was issued to, and is transferable
    only where the producing brand makes credits transferable. A voucher that has lapsed may be reissued once onto a fresh voucher against the brand's reissue fee, and the fresh voucher carries the same
    validity term counted from the day of reissue. A brand whose credit validity term is zero issues no voucher at all, and its cancelled value is forfeited. The value on a voucher is never paid out in
    money, not even where the traveller no longer intends to travel.
  eligibility:
  - id: cancelled_before_issue
    applies_to:
    - air_credit_issue
    kind: state
    condition: A voucher is issued only while the booking record stands at cancelled, refund pending or refunded.
    evidence_fields:
    - air_bookings.status
    - air_bookings.air_booking_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - air_bookings.air_booking_id
      action_bindings:
        air_bookings.air_booking_id: air_booking_id
    state_contract:
      field: air_bookings.status
      allowed:
      - cancelled
      - refund_pending
      - refunded
  params:
    reissue_limit: 1
    per_tier:
      Basic Economy Lite:
        credit_validity_months: =credit_validity_months
        credit_reissue_fee_usd: =credit_reissue_fee_usd
        credit_transferable: =credit_transferable
