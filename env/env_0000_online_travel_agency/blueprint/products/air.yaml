- id: air_name_correction
  subject:
  - air_change_fee_charge
  - air_contact_amend
  rule: 'A misspelling of the traveller''s name is corrected on the issued ticket against the fare brand''s name-correction fee, provided the number of characters that differ from the identity document
    does not exceed the brand''s character limit. A name-correction line is raised only when no name-correction line has already been raised against the same booking. A difference larger than the brand''s
    character limit is not a correction but a change of traveller, which no brand permits: the ticket is cancelled on the brand''s own terms and a new ticket is sold. The correction is made against the
    identity document held on the traveller''s profile and never against what the caller says the spelling should be. Correcting the contact address or contact number on a booking is free on every brand
    and is not a name correction. A brand whose name-correction fee is zero still applies its character limit, because the limit is the airline''s and not the agency''s.'
  eligibility:
  - id: one_correction_per_booking
    applies_to:
    - air_change_fee_charge
    kind: dedup
    condition: A name-correction line is raised only when no name-correction line has already been raised against the same booking.
    evidence_fields:
    - air_booking_events.air_booking_id
    - air_booking_events.reason_code
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - air_booking_events.air_booking_id
      action_bindings:
        air_booking_events.air_booking_id: air_booking_id
    dedup_contract:
      table: air_booking_events
      mode: separate_record
      object_bindings:
        air_booking_id: air_booking_id
      duplicate_filters:
        reason_code:
        - name_correction
      distinct_fields:
      - posted_at
      - passenger_sequence
  params:
