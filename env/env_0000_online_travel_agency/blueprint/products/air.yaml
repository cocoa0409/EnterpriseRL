- id: air_evt_schedule_change_rights
  subject:
  - air_schedule_change_notice
  rule: 'An airline schedule move at or beyond the threshold of the fare brand held gives the traveller a right to be rebooked at no charge onto any flight the airline will accept, or to be refunded in
    full to the original form of payment whatever the brand''s ordinary refund form. A move smaller than the brand''s threshold gives no right: a traveller who still wants to move pays the brand''s disruption
    rebooking fee, and a traveller who still wants to cancel is treated as a voluntary cancellation. Several notices on the same booking are not added together; the largest single move on any one segment
    decides the right, and a notice later withdrawn by the airline is disregarded. Where the rebooking obliges the traveller to stay overnight, the brand''s overnight allowance is reimbursed per traveller
    per night against a receipt, and a brand with no allowance reimburses nothing. A booking that has received more than the threshold count of notices in the last ninety days is passed to the disruption
    desk rather than rebooked again, because repeated moves indicate the schedule itself is unstable. An airline cancellation of the segment is always treated as a move beyond the threshold, whatever its
    recorded minutes.'
  eligibility: []
  params:
    repeat_notice_threshold_90d: 3
    per_tier:
      Basic Economy Lite:
        schedule_change_threshold_minutes: =schedule_change_threshold_minutes
        disruption_rebook_fee_usd: =disruption_rebook_fee_usd
        disruption_hotel_allowance_usd: =disruption_hotel_allowance_usd
      Economy Saver:
        schedule_change_threshold_minutes: =schedule_change_threshold_minutes
        disruption_rebook_fee_usd: =disruption_rebook_fee_usd
        disruption_hotel_allowance_usd: =disruption_hotel_allowance_usd
      Economy Classic:
        schedule_change_threshold_minutes: =schedule_change_threshold_minutes
        disruption_rebook_fee_usd: =disruption_rebook_fee_usd
        disruption_hotel_allowance_usd: =disruption_hotel_allowance_usd
      Economy Flex:
        schedule_change_threshold_minutes: =schedule_change_threshold_minutes
        disruption_rebook_fee_usd: =disruption_rebook_fee_usd
        disruption_hotel_allowance_usd: =disruption_hotel_allowance_usd
      Premium Economy Select:
