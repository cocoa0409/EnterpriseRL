        min_stay_nights: =min_stay_nights
        max_stay_days: =max_stay_days
        hold_window_hours: =hold_window_hours
        group_booking_min_pax: =group_booking_min_pax
        payment_plan_available: =payment_plan_available
        payment_plan_min_amount_usd: =payment_plan_min_amount_usd
- id: air_change_fee
  subject:
  - air_change_fee_charge
  rule: A voluntary change is priced as the change fee of the fare brand held plus, where the new itinerary costs more, the difference to the new fare. A voluntary change is handled with no change fee only
    when frozen time is not after the moment the traveller's ticket was issued for this booking plus the free-change window of the fare brand held. The free-change window is counted in whole elapsed hours
    from the ticket issue moment, never mixing elapsed hours with calendar days, and a change made exactly at the boundary is still inside the window. A change fee line is raised only while the booking
    record stands at ticketed. A move between flights on the already-booked routing departing on the same calendar day is priced at the brand's same-day fee instead of the full change fee. A change that
