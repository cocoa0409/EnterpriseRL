- id: air_club_benefit_interaction
  subject:
  - air_fare_charge
  - air_ancillary_charge
  rule: 'Holding an active traveller club membership changes what this booking is charged: the club tier held on the day the ticket is issued decides whether the agency service fee is waived and whether
    the first checked bag is carried free, and the fare brand''s own rates apply to everything the club does not cover. Where the club waives a charge the line is not raised at all rather than raised and
    refunded, so a waived fee never appears on the booking. A club benefit and a fare-brand inclusion never stack into a payment to the traveller: a bag already included in the brand is simply free, and
    the club benefit is not converted into value. A membership that lapses between booking and ticketing carries no benefit, because the tier held at ticketing is the one that counts. Club points accrue
    on the base fare only, at the earn rate of the fare brand held, and never on taxes, on carrier fees, on the agency service fee or on optional extras. Tier-qualifying points are counted separately from
    spendable points, at the brand''s qualifying multiplier, and a booking paid for entirely with a travel credit earns neither.'
  eligibility: []
  params:
    waiver_basis: club tier held on the ticket issue date
    per_tier:
      Basic Economy Lite:
        club_points_earn_rate_pct: =club_points_earn_rate_pct
        tier_qualifying_points_multiplier: =tier_qualifying_points_multiplier
      Economy Saver:
        club_points_earn_rate_pct: =club_points_earn_rate_pct
        tier_qualifying_points_multiplier: =tier_qualifying_points_multiplier
      Economy Classic:
        club_points_earn_rate_pct: =club_points_earn_rate_pct
        tier_qualifying_points_multiplier: =tier_qualifying_points_multiplier
      Economy Flex:
