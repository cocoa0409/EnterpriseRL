- id: air_biz_exclusion
  subject:
  - air_fare_charge
  - air_change_fee_charge
  rule: 'A booking made under a corporate travel programme and a consumer booking are mutually exclusive on price: a booking that carries a corporate programme reference is priced entirely on the programme''s
    negotiated terms, and none of the consumer concessions in this charter apply to it. In particular a corporate booking earns no club points, claims no price-drop settlement, and takes no club fee waiver,
    whatever the traveller''s personal club tier. A fare brand that is not eligible for a corporate discount may still be sold under a programme, but at its public price, and the programme''s negotiated
    terms do not reach it. Where a traveller asks for a corporate reference to be added to a booking that has already been ticketed as a consumer booking, the booking is not re-priced; the programme reference
    is recorded for reporting only. Where the corporate reference is removed before ticketing the booking reverts to consumer terms in full. A booking may carry at most one corporate programme reference
    at a time.'
  eligibility: []
  params:
    per_tier:
      Basic Economy Lite:
        corporate_discount_eligible: =corporate_discount_eligible
      Economy Saver:
        corporate_discount_eligible: =corporate_discount_eligible
      Economy Classic:
        corporate_discount_eligible: =corporate_discount_eligible
      Economy Flex:
        corporate_discount_eligible: =corporate_discount_eligible
      Premium Economy Select:
        corporate_discount_eligible: =corporate_discount_eligible
      Business Saver:
        corporate_discount_eligible: =corporate_discount_eligible
      Business Flex:
        corporate_discount_eligible: =corporate_discount_eligible
- id: air_price_drop_guarantee
  subject:
  - air_refund_payout
  rule: Where the identical itinerary in the identical fare brand is publicly offered for less within the price-match window of the brand held, the difference is settled to the original form of payment
    up to the brand's ceiling. The window is measured from ticket issue, and the comparison is made against the brand's own public price on the same booking channel; a price found on a different channel
    or in a different brand is not a match. A brand that does not allow a cash settlement refuses the claim outright, and no voucher is offered in its place. One settlement is made per booking however many
    drops occur, and a settled booking is not compared again. The settlement is raised against the original base-fare line and never against taxes, carrier fees or the agency service fee. A claim raised
    after the traveller has changed the itinerary is refused, because the itinerary compared is no longer the itinerary ticketed.
  eligibility: []
  params:
    settlements_per_booking: 1
    per_tier:
      Basic Economy Lite:
        price_match_window_hours: =price_match_window_hours
        price_drop_refund_allowed: =price_drop_refund_allowed
        price_drop_refund_cap_usd: =price_drop_refund_cap_usd
      Economy Saver:
        price_match_window_hours: =price_match_window_hours
        price_drop_refund_allowed: =price_drop_refund_allowed
        price_drop_refund_cap_usd: =price_drop_refund_cap_usd
      Economy Classic:
        price_match_window_hours: =price_match_window_hours
        price_drop_refund_allowed: =price_drop_refund_allowed
        price_drop_refund_cap_usd: =price_drop_refund_cap_usd
      Economy Flex:
