- id: care_subrogation
  subject:
  - care_claim_recovery
  rule: 'Where a third party was liable for the loss the insurer may recover what it paid, and the amount recovered restores the benefit it was taken from. A recovery is applied against the payment it reverses
    and never against a different claim or a different policy. The traveller keeps whatever the recovery exceeds, because the insurer recovers only what it actually paid. A traveller who has been compensated
    for the same loss by the airline, the property or another supplier must say so, and the settlement is reduced by what they received rather than recovered afterwards. A plan on which subrogation does
    not apply makes no recovery at all and the settlement stands as paid. A recovery never reopens a decided claim: the decision stands and only the benefit consumed is restored.'
  eligibility: []
  params:
    per_tier:
      Trip Basics Essential:
        subrogation_applies: =subrogation_applies
      Trip Basics Standard:
        subrogation_applies: =subrogation_applies
      TripGuard Plus:
        subrogation_applies: =subrogation_applies
      TripGuard Premier:
        subrogation_applies: =subrogation_applies
      Cancel For Any Reason Elite:
        subrogation_applies: =subrogation_applies
      Annual Multi-Trip Traveller:
        subrogation_applies: =subrogation_applies
      Annual Multi-Trip Executive:
        subrogation_applies: =subrogation_applies
- id: care_policy_amendment
  subject:
  - care_insured_amend
  rule: A declared particular of the risk may be corrected while the policy stands, and the premium follows the correction from the day it takes effect. Cover is upgraded only when the underwriting desk
    has already recorded an approved cover upgrade against this policy. An increase in the declared trip cost is accepted only up to the plan's ceiling, and a trip whose cost has grown beyond it is upgraded
    to a higher plan rather than amended. An upgrade is available only on a plan that permits it and only inside the plan's upgrade window counted from issue; outside the window the traveller buys a second
    policy instead. Adding an insured traveller is an amendment and re-rates the whole certificate, because the age loading follows the oldest traveller named. No amendment is accepted once the journey
    has begun or once a claim has been filed, because the risk is then no longer uncertain.
  eligibility:
  - id: upgrade_approved
    applies_to:
    - care_insured_amend
    kind: authorization
    condition: Cover is upgraded only when the underwriting desk has already recorded an approved cover upgrade against this policy.
    evidence_fields:
