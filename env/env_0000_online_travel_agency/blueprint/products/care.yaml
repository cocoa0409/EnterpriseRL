    - care_policy_requests.care_request_id
    - care_policy_requests.care_policy_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - care_policy_requests.care_request_id
      action_bindings:
        care_policy_requests.care_request_id: care_request_id
  params:
