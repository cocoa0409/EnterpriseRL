    - notice_goodwill
    ladder:
    - when: two or more airline notices stand on the booking from the last six months
      value: K('repeat_notice_goodwill_usd')
    - when: exactly one airline notice stands on the booking from the last six months
      value: K('single_notice_goodwill_usd')
    - when: otherwise
      value: nothing is added for airline notices
    baseline:
      notice_goodwill: '0.00'
    evidence:
    - history
    cross_difficulty: null
  - id: currency_conversion_holdback
    effect: parameter
    decides: conversion_holdback_rate
    bindings:
