  rule: The value placed on the voucher is the fare, tax and service lines collected on the booking, less the money already returned to the original form of payment, less the agency service fee retained,
    and less the whole of the penalty standing on the booking, and is never below zero. The agency service fee retained is the agency service fee of the fare brand held, taken once. The voucher is issued
    against the booking whose ticket produced it and carries an expiry set by the credit validity term of the fare brand that produced it. The issue line is filed against the base-fare line posted earliest
    on the booking and carries the traveller position of that line. The value placed on the voucher is rounded to two decimal places at the end and never at any intermediate step. The value the booking's
    lines leave is settled first, and the value placed on the voucher is that figure once every share and every uplift that bears on it has been taken. Where more than one share is taken on the same figure,
    the shares act one after another, each on the figure the one before it gives, and are never combined into a single rate; where more than one uplift is added to the same figure, the uplifts are combined
    into a single uplift and the figure is increased once by that total. The value placed on the voucher is fixed only after the cancellation penalty owed under the fare brand held stands as a withheld
    line on the booking. The value placed on the voucher is fixed only after the taxes and carrier fees the airline returns stand as a payout line on the booking. Where voluntary change lines stand on the
    booking and the fare brand held returns value on a travel credit, the whole of what those lines were charged is added to the money collected. Where voluntary change lines stand on the booking and the
    fare brand held returns value to the original form of payment, half of what those lines were charged is added to the money collected. Otherwise nothing of the voluntary change lines is added to the
    money collected. What an airline notice standing on the booking does to the penalty taken off the value placed on the voucher follows whether the airline cancelled a segment or only moved one, whether
    or not the move was large enough to give the traveller a right of its own. Where a notice standing on the booking records that the airline cancelled a segment, no part of the penalty standing on the
    booking is taken off the value placed on the voucher. Where a notice standing on the booking records a move short of a cancellation, half of the penalty standing on the booking is taken off the value
    placed on the voucher. Otherwise the whole of the penalty standing on the booking is taken off the value placed on the voucher. Where an agency service fee line stands for each traveller on the booking,
    the agency service fee retained is the total of the service fee lines standing on the booking. Where at least one agency service fee line stands on the booking but fewer of them than there are travellers,
    the agency service fee retained is the agency service fee of the fare brand held taken once for each traveller on the booking. Otherwise the agency service fee retained is the agency service fee of
    the fare brand held, taken once. What the traveller club card adds to the value placed on the voucher follows the tier held and how long the card has stood. Where the traveller holds an active traveller
    club card of the Platinum, Titanium or Ambassador tiers and the card was enrolled at or beyond the long-membership term, the senior-member uplift is added as an uplift to the value the booking's lines
    leave. Where the traveller holds an active traveller club card of the Blue, Silver or Gold tiers and the card was enrolled at or beyond the long-membership term, the member uplift is added as an uplift
    to the value the booking's lines leave. Where the traveller holds an active traveller club card of any tier and the card was enrolled within the long-membership term, the entry-member uplift is added
    as an uplift to the value the booking's lines leave. Otherwise no uplift is added to the value the booking's lines leave. Where a travel protection policy stands in force against the booking and the
    plan it was issued under carries a cancel-for-any-reason benefit, the cancel-for-any-reason offset is taken as a share off the value the booking's lines leave because the insurer answers that part of
    the loss. Where a travel protection policy stands in force against the booking and the plan it was issued under carries no cancel-for-any-reason benefit, the standard protection offset is taken as a
    share off the value the booking's lines leave. Otherwise no protection offset is taken off the value the booking's lines leave.
