- id: air_price_drop_guarantee
  subject:
  - air_refund_payout
  rule: Where the identical itinerary in the identical fare brand is publicly offered for less within the price-match window of the brand held, the difference is settled to the original form of payment
    up to the brand's ceiling. The window is measured from ticket issue, and the comparison is made against the brand's own public price on the same booking channel; a price found on a different channel
    or in a different brand is not a match. A brand that does not allow a cash settlement refuses the claim outright, and no voucher is offered in its place. One settlement is made per booking however many
    drops occur, and a settled booking is not compared again. The settlement is raised against the original base-fare line and never against taxes, carrier fees or the agency service fee. A claim raised
    after the traveller has changed the itinerary is refused, because the itinerary compared is no longer the itinerary ticketed.
