  - voluntary_rework_collected: SUM('air_booking_events', 'amount_usd', date_field='posted_date', event_type='air_change_fee_charge', reason_code='voluntary_change')
  - rework_share: K('whole_rework_share') if (voluntary_rework_collected > 0 and P('refund_form') == 'travel_credit') else (K('half_rework_share') if (voluntary_rework_collected > 0 and P('refund_form')
