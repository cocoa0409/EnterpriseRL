      within the long-membership term, the entry-member uplift is added as an uplift to the value the booking's lines leave. Otherwise no uplift is added to the value the booking's lines leave.
    care_status: Where a travel protection policy stands in force against the booking and the plan it was issued under carries a cancel-for-any-reason benefit, the cancel-for-any-reason offset is taken
      as a share off the value the booking's lines leave because the insurer answers that part of the loss.
    care_cfar: Where a travel protection policy stands in force against the booking and the plan it was issued under carries no cancel-for-any-reason benefit, the standard protection offset is taken as
