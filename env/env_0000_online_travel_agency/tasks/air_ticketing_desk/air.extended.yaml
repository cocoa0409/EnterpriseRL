- id: air_ext_pooled_credit_release
  base_policy_refs:
  - air_agg_credit_pooling
  - air_credit_validity
  - air_name_correction
  overwrite:
  - base_policy: air_agg_credit_pooling
    superseded_clause: A voucher may only be redeemed by the traveller it was issued to unless the fare brand that produced it makes credits transferable.
    replaced_by: Where the fare brand that produced the voucher makes credits non-transferable and more than one base-fare line stands on the cancelled booking, the pool available to the traveller is the
      open pool divided by the number of base-fare lines standing on that booking.
  trigger: on_request
  subject:
