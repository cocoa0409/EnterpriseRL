  rule: The value released from the traveller's pooled travel credit onto an unticketed itinerary they are holding is the value standing on the vouchers issued against the cancelled booking, less the redemptions
    already taken against them, and is never below zero. The whole of the open pool is released. Whatever is not released stays on the voucher it came off and keeps that voucher's own expiry. The redemption
    line is filed against the issue line that created the voucher and carries the traveller position of that line. The value released is rounded to two decimal places at the end and never at any intermediate
    step. The pool available to the traveller is settled first, and the value released is that pool once every share and every uplift that bears on it has been taken, with anything added in dollars added
    last of all. Where more than one share is taken on the same figure, the shares act one after another, each on the figure the one before it gives, and are never combined into a single rate; where more
    than one uplift is added to the same figure, the uplifts are combined into a single uplift and the figure is increased once by that total. The traveller releases the value themselves, because the vouchers
    stand in their own name. Value is released from the traveller's pooled travel credit only after a travel credit stands issued against a fare line of the cancelled booking. Where the fare brand that
    produced the voucher makes credits non-transferable and more than one base-fare line stands on the cancelled booking, the pool available to the traveller is the open pool divided by the number of base-fare
    lines standing on that booking. Where the fare brand that produced the voucher makes credits transferable and more than one base-fare line stands on the cancelled booking, the pool available to the
    traveller is the open pool less the agency service fee of the fare brand held for each traveller beyond the first. Otherwise the pool available to the traveller is the whole of the open pool. How long
    ago the cancelled journey was due is counted in whole days from the outbound departure date to the handling date. Where the outbound departure date passed more than the stale-journey term ago, no more
    than the stale-journey limit of the pool available to the traveller is released onto one itinerary. Where the outbound departure date has passed but not more than the stale-journey term ago, no more
    than the recent-journey limit of that pool is released onto one itinerary. Otherwise the whole of that pool may be released. Where the traveller holds an active traveller club card of the Platinum,
    Titanium or Ambassador tiers and air-ticket accruals stand on its ledger over the last twelve months at or above the air-accrual threshold, the senior-release bonus is added as an uplift to the pool
    available to the traveller. Where the traveller holds an active traveller club card of the Blue, Silver or Gold tiers and air-ticket accruals stand on its ledger over the last twelve months at or above
    the air-accrual threshold, the member-release bonus is added as an uplift to the pool available to the traveller. Where the traveller holds an active traveller club card of any tier and air-ticket accruals
    stand on its ledger over the last twelve months below the air-accrual threshold, the entry-release bonus is added as an uplift to the pool available to the traveller. Otherwise no release bonus is added
