  - collected_basis: fare_and_taxes_collected + voluntary_rework_collected * rework_share
  - returned_to_card: ABS(SUM('air_booking_events', 'amount_usd', date_field='posted_date', event_type='air_refund_payout'))
  - service_fee_lines: COUNT('air_booking_events', date_field='posted_date', event_type='air_fare_charge', charge_category='agency_service_fee')
  - service_fee_retained: SUM('air_booking_events', 'amount_usd', date_field='posted_date', event_type='air_fare_charge', charge_category='agency_service_fee') if (service_fee_lines >= F('passenger_count'))
      else (P('agency_service_fee_usd') * F('passenger_count') if (service_fee_lines > 0 and service_fee_lines < F('passenger_count')) else P('agency_service_fee_usd'))
  - penalty_withheld: SUM('air_booking_events', 'amount_usd', date_field='posted_date', event_type='air_penalty_charge')
  - airline_cancel_notices: COUNT('air_booking_events', date_field='posted_date', event_type='air_schedule_change_notice', reason_code='airline_cancellation')
  - move_notices: COUNT('air_booking_events', date_field='posted_date', event_type='air_schedule_change_notice', reason_code='involuntary_schedule_change')
  - penalty_share: 0.00 if airline_cancel_notices > 0 else (K('disrupted_penalty_share') if move_notices > 0 else 1.00)
  - penalty_deduction: penalty_withheld * penalty_share
  - club_tier: CFIELD('club', 'variant_name', status='active')
  - club_enrolled_date: CFIELD('club', 'enrolled_date', status='active')
  - club_months: MONTHS(club_enrolled_date, NOW) if club_enrolled_date != None else 0
  - member_uplift: K('senior_member_uplift') if ((club_tier == 'Wanderlane Platinum' or club_tier == 'Wanderlane Titanium' or club_tier == 'Wanderlane Ambassador') and club_months >= K('long_membership_months'))
      else (K('member_uplift') if ((club_tier == 'Wanderlane Blue' or club_tier == 'Wanderlane Silver' or club_tier == 'Wanderlane Gold') and club_months >= K('long_membership_months')) else (K('entry_member_uplift')
      if (club_tier != None and club_months < K('long_membership_months')) else 0.00))
  - care_status: CFIELD('care', 'status', linked_air_booking_id=HID)
  - care_cfar: CPARAM('care', 'cfar_included', linked_air_booking_id=HID)
  - protection_offset_share: K('cfar_offset_share') if (care_status == 'in_force' and care_cfar == True) else (K('standard_offset_share') if (care_status == 'in_force' and care_cfar == False) else 0.00)
  - residual_value: MX(collected_basis - returned_to_card - service_fee_retained - penalty_deduction, 0)
  - result: RND(MX(residual_value * (1 + member_uplift) * (1 - protection_offset_share), 0), 2)
  compute_basis:
    fare_and_taxes_collected: The value placed on the voucher is the fare, tax and service lines collected on the booking, less the money already returned to the original form of payment, less the agency
      service fee retained, and less the whole of the penalty standing on the booking, and is never below zero.
    voluntary_rework_collected: Where voluntary change lines stand on the booking and the fare brand held returns value on a travel credit, the whole of what those lines were charged is added to the money
      collected.
