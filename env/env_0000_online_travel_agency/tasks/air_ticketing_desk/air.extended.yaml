- id: air_ext_credit_reissue_fee
  base_policy_refs:
  - air_service_fee
  - air_club_benefit_interaction
  - air_biz_exclusion
  - air_credit_validity
  - air_agg_credit_pooling
  overwrite:
  - base_policy: air_credit_validity
    superseded_clause: A voucher that has lapsed may be reissued once onto a fresh voucher against the brand's reissue fee
    replaced_by: The reissue fee charged for putting a lapsed travel credit back into use is the credit reissue fee of the fare brand that produced the voucher, taken once for the voucher.
  - base_policy: air_club_benefit_interaction
    superseded_clause: the club tier held on the day the ticket is issued decides whether the agency service fee is waived and whether the first checked bag is carried free
    replaced_by: What the traveller club card takes off the fee follows the tier held and the points standing on the card.
  trigger: state_due
  subject:
  - air_fare_charge
  computes: reissue_fee_usd
  target_tool: charge_credit_reissue_fee_efe635ea
  params:
    long_lapse_loading: 1.6
    standard_lapse_loading: 1.25
    long_lapse_months: 12
    standard_lapse_months: 3
    single_transferable_multiple: 1.5
    high_value_loading_usd: 60.0
    mid_value_loading_usd: 25.0
    high_value_band_usd: 2500.0
    mid_value_band_usd: 800.0
    senior_fee_relief: 0.5
    member_fee_relief: 0.3
    entry_fee_relief: 0.1
    points_band_pts: 20000
    archived_surcharge_usd: 45.0
    older_surcharge_usd: 20.0
    archived_booking_months: 36
    older_booking_months: 18
  rule: 'The reissue fee charged for putting a lapsed travel credit back into use is the credit reissue fee of the fare brand that produced the voucher, taken once for the voucher. The fee is filed against
    the issue line of the largest lapsed voucher standing on the booking and carries the traveller position of that line. The travel credit vouchers standing on the booking are taken as one set, and the
    set stands lapsed when the voucher most recently issued on it has lapsed; where that voucher has not lapsed the set is still redeemable as it stands and nothing is owed under this rule. The fee charged
    is rounded to two decimal places at the end and never at any intermediate step. The fee is settled in two stages. The tariff component is settled first: the credit reissue fee of the fare brand that
    produced the voucher, taken at whatever loading the time the credit has stood unclaimed earns and then taken as many times as the fee falls due on the booking. The fee charged is that tariff component
    with anything added to it in dollars, added once for the booking and never once for each voucher, and with any relief then taken as a share of the whole. Where more than one share is taken on the same
    figure, the shares act one after another, each on the figure the one before it gives, and are never combined into a single rate; where more than one uplift is added to the same figure, the uplifts are
    combined into a single uplift and the figure is increased once by that total. Where the fare brand that produced the vouchers makes credits non-transferable and more than one voucher stands lapsed on
    the booking, how long the credit has stood unclaimed is counted from the day the booking''s cancellation was confirmed to the handling date. Where the fare brand that produced the vouchers makes credits
    transferable and more than one voucher stands lapsed on the booking, how long the credit has stood unclaimed is counted from the day the most recent voucher on the booking was issued to the handling
    date. Otherwise how long the credit has stood unclaimed is counted from the day the most recent voucher on the booking lapsed to the handling date. The count is made in whole calendar months. Where
    the credit has stood unclaimed for longer than the long-lapse term, the tariff component is taken at the long-lapse loading. Where the credit has stood unclaimed for longer than the standard-lapse term
    but not longer than the long-lapse term, the tariff component is taken at the standard-lapse loading. Otherwise the tariff component is taken as it stands. Where two or more vouchers stand lapsed on
    the booking, the tariff component is taken once for each voucher standing lapsed on it. Where a single voucher stands lapsed on the booking and the fare brand that produced it makes credits transferable,
    the tariff component is taken once and increased by half again. Otherwise the tariff component is taken once. Where the lapsed vouchers stand together at or above the high-value band, the high-value
    loading is added to the fee charged, once for the booking. Where the lapsed vouchers stand together at or above the mid-value band but below the high-value band, the mid-value loading is added to the
    fee charged, once for the booking. Otherwise nothing is added to the fee charged for the value standing. Where the booking was opened longer ago than the archived-booking term, the archived-booking
    surcharge is added to the fee charged, once for the booking. Where the booking was opened longer ago than the older-booking term but not longer than the archived-booking term, the older-booking surcharge
    is added to the fee charged, once for the booking. Otherwise nothing is added to the fee charged for the age of the booking. What the traveller club card takes off the fee follows the tier held and
    the points standing on the card. Where the traveller holds an active traveller club card of the Platinum, Titanium or Ambassador tiers and the spendable points standing on the card are at or above the
    points band, the senior-fee relief is taken as a share off the fee charged. Where the traveller holds an active traveller club card of the Blue, Silver or Gold tiers and the spendable points standing
    on the card are at or above the points band, the member-fee relief is taken as a share off the fee charged. Where the traveller holds an active traveller club card of any tier and the spendable points
    standing on the card are below the points band, the entry-fee relief is taken as a share off the fee charged. Otherwise no relief is taken off the fee charged.'
  prerequisite: []
  cross_category:
  - category: club
    as: branch
    reads:
    - status
    - variant_name
    - points_balance_pts
    note: the tier of the member-relief factor is decided from the traveller club card and the spendable points standing on it
  compute:
  - voucher_count: COUNT('air_booking_events', date_field='posted_date', event_type='air_credit_issue')
  - lapsed_value: SUM('air_booking_events', 'amount_usd', date_field='posted_date', event_type='air_credit_issue')
  - latest_expiry: LATEST('air_booking_events', 'credit_expires_on', date_field='posted_date', event_type='air_credit_issue')
  - latest_issue_date: LATEST('air_booking_events', 'posted_date', date_field='posted_date', event_type='air_credit_issue')
  - lapse_anchor_date: F('cancelled_at') if (P('credit_transferable') == False and voucher_count > 1) else (latest_issue_date if (P('credit_transferable') == True and voucher_count > 1) else latest_expiry)
  - lapse_months: MONTHS(lapse_anchor_date, NOW)
  - lapse_loading: K('long_lapse_loading') if lapse_months > K('long_lapse_months') else (K('standard_lapse_loading') if lapse_months > K('standard_lapse_months') else 1.00)
  - fee_multiple: voucher_count if voucher_count >= 2 else (K('single_transferable_multiple') if (voucher_count == 1 and P('credit_transferable') == True) else 1)
  - value_loading_usd: K('high_value_loading_usd') if lapsed_value >= K('high_value_band_usd') else (K('mid_value_loading_usd') if lapsed_value >= K('mid_value_band_usd') else 0.00)
  - booking_age_months: MONTHS(F('booked_date'), NOW)
  - age_surcharge_usd: K('archived_surcharge_usd') if booking_age_months > K('archived_booking_months') else (K('older_surcharge_usd') if booking_age_months > K('older_booking_months') else 0.00)
  - club_tier: CFIELD('club', 'variant_name', status='active')
  - club_points: CFIELD('club', 'points_balance_pts', status='active')
  - member_relief: K('senior_fee_relief') if ((club_tier == 'Wanderlane Platinum' or club_tier == 'Wanderlane Titanium' or club_tier == 'Wanderlane Ambassador') and club_points >= K('points_band_pts'))
      else (K('member_fee_relief') if ((club_tier == 'Wanderlane Blue' or club_tier == 'Wanderlane Silver' or club_tier == 'Wanderlane Gold') and club_points >= K('points_band_pts')) else (K('entry_fee_relief')
      if (club_tier != None and club_points < K('points_band_pts')) else 0.00))
  - set_lapsed: 1 if (voucher_count > 0 and DAYS(latest_expiry, NOW) > 0) else 0
  - result: RND(MX((P('credit_reissue_fee_usd') * lapse_loading * fee_multiple + value_loading_usd + age_surcharge_usd) * (1 - member_relief) * set_lapsed, 0), 2)
  compute_basis:
    voucher_count: Where two or more vouchers stand lapsed on the booking, the tariff component is taken once for each voucher standing lapsed on it.
    lapsed_value: Where the lapsed vouchers stand together at or above the high-value band, the high-value loading is added to the fee charged, once for the booking.
    latest_expiry: Otherwise how long the credit has stood unclaimed is counted from the day the most recent voucher on the booking lapsed to the handling date.
    latest_issue_date: Where the fare brand that produced the vouchers makes credits transferable and more than one voucher stands lapsed on the booking, how long the credit has stood unclaimed is counted
      from the day the most recent voucher on the booking was issued to the handling date.
    lapse_anchor_date: Where the fare brand that produced the vouchers makes credits non-transferable and more than one voucher stands lapsed on the booking, how long the credit has stood unclaimed is counted
      from the day the booking's cancellation was confirmed to the handling date. Where the fare brand that produced the vouchers makes credits transferable and more than one voucher stands lapsed on the
      booking, how long the credit has stood unclaimed is counted from the day the most recent voucher on the booking was issued to the handling date. Otherwise how long the credit has stood unclaimed is
      counted from the day the most recent voucher on the booking lapsed to the handling date.
    lapse_months: The count is made in whole calendar months.
    lapse_loading: Where the credit has stood unclaimed for longer than the long-lapse term, the tariff component is taken at the long-lapse loading. Where the credit has stood unclaimed for longer than
      the standard-lapse term but not longer than the long-lapse term, the tariff component is taken at the standard-lapse loading. Otherwise the tariff component is taken as it stands.
    fee_multiple: Where two or more vouchers stand lapsed on the booking, the tariff component is taken once for each voucher standing lapsed on it. Where a single voucher stands lapsed on the booking and
      the fare brand that produced it makes credits transferable, the tariff component is taken once and increased by half again. Otherwise the tariff component is taken once.
    value_loading_usd: Where the lapsed vouchers stand together at or above the high-value band, the high-value loading is added to the fee charged, once for the booking. Where the lapsed vouchers stand
      together at or above the mid-value band but below the high-value band, the mid-value loading is added to the fee charged, once for the booking. Otherwise nothing is added to the fee charged for the
      value standing.
    booking_age_months: Where the booking was opened longer ago than the archived-booking term, the archived-booking surcharge is added to the fee charged, once for the booking.
    age_surcharge_usd: Where the booking was opened longer ago than the archived-booking term, the archived-booking surcharge is added to the fee charged, once for the booking. Where the booking was opened
      longer ago than the older-booking term but not longer than the archived-booking term, the older-booking surcharge is added to the fee charged, once for the booking. Otherwise nothing is added to the
      fee charged for the age of the booking.
    club_tier: What the traveller club card takes off the fee follows the tier held and the points standing on the card.
    club_points: Where the traveller holds an active traveller club card of the Blue, Silver or Gold tiers and the spendable points standing on the card are at or above the points band, the member-fee relief
      is taken as a share off the fee charged.
    member_relief: Where the traveller holds an active traveller club card of the Platinum, Titanium or Ambassador tiers and the spendable points standing on the card are at or above the points band, the
      senior-fee relief is taken as a share off the fee charged. Where the traveller holds an active traveller club card of the Blue, Silver or Gold tiers and the spendable points standing on the card are
      at or above the points band, the member-fee relief is taken as a share off the fee charged. Where the traveller holds an active traveller club card of any tier and the spendable points standing on
      the card are below the points band, the entry-fee relief is taken as a share off the fee charged. Otherwise no relief is taken off the fee charged.
    result: The fee charged is rounded to two decimal places at the end and never at any intermediate step.
    set_lapsed: The travel credit vouchers standing on the booking are taken as one set, and the set stands lapsed when the voucher most recently issued on it has lapsed; where that voucher has not lapsed
      the set is still redeemable as it stands and nothing is owed under this rule.
  factors:
  - id: lapse_clock_anchor
    effect: method
    decides: lapse_anchor_date
    bindings:
    - latest_expiry
    - latest_issue_date
    - lapse_anchor_date
    ladder:
    - when: the fare brand that produced the vouchers makes credits non-transferable and more than one voucher stands lapsed on the booking
      method: how long the credit has stood unclaimed is counted from the day the booking's cancellation was confirmed to the handling date
    - when: the fare brand that produced the vouchers makes credits transferable and more than one voucher stands lapsed on the booking
      method: how long the credit has stood unclaimed is counted from the day the most recent voucher on the booking was issued to the handling date
    - when: otherwise
      method: how long the credit has stood unclaimed is counted from the day the most recent voucher on the booking lapsed to the handling date
    baseline:
      lapse_anchor_date: latest_expiry
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: lapse_age_loading
    effect: parameter
    decides: lapse_loading
    bindings:
    - lapse_months
    - lapse_loading
    ladder:
    - when: the credit has stood unclaimed for longer than the long-lapse term
      value: K('long_lapse_loading')
    - when: the credit has stood unclaimed for longer than the standard-lapse term but not longer than the long-lapse term
      value: K('standard_lapse_loading')
    - when: otherwise
      value: the tariff component is taken as it stands
    baseline:
      lapse_loading: '1.00'
    evidence:
    - date
    cross_difficulty: null
  - id: voucher_count_basis
    effect: method
    decides: fee_multiple
    bindings:
    - voucher_count
    - fee_multiple
    ladder:
    - when: two or more vouchers stand lapsed on the booking
      method: the tariff component is taken once for each voucher standing lapsed on it
    - when: a single voucher stands lapsed on the booking and the fare brand that produced it makes credits transferable
      method: the tariff component is taken once and increased by half again
    - when: otherwise
      method: the tariff component is taken once
    baseline:
      fee_multiple: '1'
    evidence:
    - history
    cross_difficulty: null
  - id: standing_value_loading
    effect: parameter
    decides: value_loading_usd
    bindings:
    - lapsed_value
    - value_loading_usd
    ladder:
    - when: the lapsed vouchers stand together at or above the high-value band
      value: K('high_value_loading_usd')
    - when: the lapsed vouchers stand together at or above the mid-value band but below the high-value band
      value: K('mid_value_loading_usd')
    - when: otherwise
      value: nothing is added to the fee charged for the value standing
    baseline:
      value_loading_usd: '0.00'
    evidence:
    - history
    cross_difficulty: null
  - id: booking_age_surcharge
    effect: parameter
    decides: age_surcharge_usd
    bindings:
    - booking_age_months
    - age_surcharge_usd
    ladder:
    - when: the booking was opened longer ago than the archived-booking term
      value: K('archived_surcharge_usd')
    - when: the booking was opened longer ago than the older-booking term but not longer than the archived-booking term
      value: K('older_surcharge_usd')
    - when: otherwise
      value: nothing is added to the fee charged for the age of the booking
    baseline:
      age_surcharge_usd: '0.00'
    evidence:
    - date
    cross_difficulty: null
  - id: member_fee_relief
    effect: parameter
    decides: member_relief
    bindings:
    - club_tier
    - club_points
    - member_relief
    ladder:
    - when: the traveller holds an active traveller club card of the Platinum, Titanium or Ambassador tiers and the spendable points standing on the card are at or above the points band
      value: K('senior_fee_relief')
    - when: the traveller holds an active traveller club card of the Blue, Silver or Gold tiers and the spendable points standing on the card are at or above the points band
      value: K('member_fee_relief')
    - when: the traveller holds an active traveller club card of any tier and the spendable points standing on the card are below the points band
      value: K('entry_fee_relief')
    - when: otherwise
      value: no relief is taken off the fee charged
    baseline:
      member_relief: '0.00'
    evidence:
    - cross_category
    cross_difficulty: club
  baseline:
    rule: 'The reissue fee charged for putting a lapsed travel credit back into use is the credit reissue fee of the fare brand that produced the voucher, taken once for the voucher. The fee is filed against
      the issue line of the largest lapsed voucher standing on the booking and carries the traveller position of that line. The travel credit vouchers standing on the booking are taken as one set, and the
      set stands lapsed when the voucher most recently issued on it has lapsed; where that voucher has not lapsed the set is still redeemable as it stands and nothing is owed under this rule. The fee charged
      is rounded to two decimal places at the end and never at any intermediate step. The fee is settled in two stages. The tariff component is settled first: the credit reissue fee of the fare brand that
      produced the voucher, taken at whatever loading the time the credit has stood unclaimed earns and then taken as many times as the fee falls due on the booking. The fee charged is that tariff component
      with anything added to it in dollars, added once for the booking and never once for each voucher, and with any relief then taken as a share of the whole. Where more than one share is taken on the
      same figure, the shares act one after another, each on the figure the one before it gives, and are never combined into a single rate; where more than one uplift is added to the same figure, the uplifts
      are combined into a single uplift and the figure is increased once by that total.'
    params:
    - credit_reissue_fee_usd
  inputs:
    history:
    - table: air_booking_events
      aggregate: count
      field: air_event_id
      within_months: null
      filters:
        event_type: air_credit_issue
    - table: air_booking_events
      aggregate: sum
      field: amount_usd
      within_months: null
      filters:
        event_type: air_credit_issue
    - table: air_booking_events
      aggregate: latest
      field: credit_expires_on
      within_months: null
      filters:
        event_type: air_credit_issue
    cross_category:
    - club
- id: air_ext_lapsed_credit_carry_forward
  base_policy_refs:
  - air_credit_validity
  - air_agg_credit_pooling
  - air_service_fee
  overwrite:
  - base_policy: air_credit_validity
    superseded_clause: A voucher that has lapsed may be reissued once onto a fresh voucher against the brand's reissue fee
    replaced_by: The value standing is the largest lapsed travel credit standing on the booking.
  trigger: on_request
  subject:
  - air_credit_issue
  computes: carried_value_usd
  target_tool: reissue_lapsed_travel_credit_f544c035
  params:
    long_lapse_months: 6
    long_stale_carry: 0.7
    mid_stale_carry: 0.85
    long_stale_months: 12
    mid_stale_months: 6
    senior_carry_uplift: 0.1
    member_carry_uplift: 0.06
    entry_carry_uplift: 0.02
    long_membership_months: 60
    shared_lead_share: 0.4
    paired_lead_share: 0.6
    active_house_uplift: 0.08
    light_house_uplift: 0.04
    unlinked_house_uplift: 0.02
    house_spend_band_usd: 1500.0
    party_service_recovery_usd: 30.0
    single_service_recovery_usd: 15.0
    service_fee_band_usd: 25.0
    retention_window_months: 24
  rule: The value standing is the largest lapsed travel credit standing on the booking. The value carried onto the fresh voucher is that value standing once every share and every uplift that bears on it
    has been taken, with anything taken off in dollars — the reissue fee charged on the booking above all — taken off last of all, after every share and every uplift, and it is never below zero. The reissue
    fee is met once, out of the value being carried forward, and is never taken a second time out of the vouchers it was charged for. The fresh voucher is filed against the issue line of the largest lapsed
    voucher standing on the booking, carries the traveller position of that line, and runs for the same validity term as the voucher it replaces, counted from the day it is reissued. The travel credit vouchers
    standing on the booking are taken as one set, and the set stands lapsed when the voucher most recently issued on it has lapsed; where that voucher has not lapsed the set is still redeemable as it stands
    and nothing is owed under this rule. The value carried is rounded to two decimal places at the end and never at any intermediate step. Where more than one share is taken on the same figure, the shares
    act one after another, each on the figure the one before it gives, and are never combined into a single rate; where more than one uplift is added to the same figure, the uplifts are combined into a
    single uplift and the figure is increased once by that total. The traveller carries the value forward themselves, because it is their own once-only right of reissue that is spent. The value carried
    onto the fresh voucher is fixed only after the reissue fee owed under the fare brand that produced the lapsed voucher stands as a charged line on the booking. Where two or more vouchers stand lapsed
    on the booking and the voucher most recently issued on it lapsed longer ago than the long-lapse term, the value standing is the total of the lapsed vouchers issued on the booking within the retention
    window. Where two or more vouchers stand lapsed on the booking and the voucher most recently issued on it lapsed no longer ago than the long-lapse term, the value standing is the total of every lapsed
    voucher on the booking. Otherwise the value standing is the largest lapsed voucher on the booking. The retention window is counted in whole calendar months back from the handling date to the day each
    voucher was issued. Where the booking's cancellation was confirmed longer ago than the long-stale term, the value standing is taken at the long-stale carry. Where the booking's cancellation was confirmed
    longer ago than the mid-stale term but not longer ago than the long-stale term, the value standing is taken at the mid-stale carry. Otherwise the value standing is taken in full. Where the fare brand
    that produced the lapsed voucher makes credits non-transferable and three or more base-fare lines stand on the booking, the value standing is taken at the shared-lead share because the fresh voucher
    stands in the lead traveller's name alone. Where the fare brand that produced the lapsed voucher makes credits non-transferable and exactly two base-fare lines stand on the booking, the value standing
    is taken at the paired-lead share. Otherwise the value standing is taken in full. Where the traveller holds an active traveller club card of the Platinum, Titanium or Ambassador tiers and the card was
    enrolled at or beyond the long-membership term, the senior-carry uplift is added as an uplift to the value standing. Where the traveller holds an active traveller club card of the Blue, Silver or Gold
    tiers and the card was enrolled at or beyond the long-membership term, the member-carry uplift is added as an uplift to the value standing. Where the traveller holds an active traveller club card of
    any tier and the card was enrolled within the long-membership term, the entry-carry uplift is added as an uplift to the value standing. Otherwise no card uplift is added to the value standing. Where
    room charges posted to the traveller's hotel stays over the last twelve months stand at or above the house-spend band and an active traveller club card stands on the profile, the active-house uplift
    is added as an uplift to the value standing. Where room charges posted to the traveller's hotel stays over the last twelve months stand above nothing but below the house-spend band and an active traveller
    club card stands on the profile, the light-house uplift is added as an uplift to the value standing. Where room charges posted to the traveller's hotel stays over the last twelve months stand above
    nothing and no active traveller club card stands on the profile, the unlinked-house uplift is added as an uplift to the value standing. Otherwise no house uplift is added to the value standing. Where
    two or more agency service fee lines stand on the booking and the agency service fee of the fare brand held is at or above the service-fee band, the party service recovery is taken off in dollars, last
    of all. Where exactly one agency service fee line stands on the booking and the agency service fee of the fare brand held is at or above the service-fee band, the single service recovery is taken off
    in dollars, last of all. Otherwise nothing is taken off in dollars for the agency service fee.
  prerequisite:
  - problem: air_ext_credit_reissue_fee
    kind: value_input
    gate: reissue_fee_charged
    form: state
    policy_source: The value carried onto the fresh voucher is fixed only after the reissue fee owed under the fare brand that produced the lapsed voucher stands as a charged line on the booking.
    condition: A reissue fee line stands charged on the booking at the moment the value carried onto the fresh voucher is worked out.
    resolved_by: charge_credit_reissue_fee_efe635ea
    effect: Once the reissue fee line stands charged on the booking, the reissue fee charged on the booking is no longer nil and the value carried falls by that amount.
  cross_category:
  - category: club
    as: branch
    reads:
    - status
    - variant_name
    - enrolled_date
    note: the tier of the card-uplift factor is decided from the traveller club card and the date it was enrolled
  - category: stay
    as: history
    reads:
    - stay_folio_entries.amount_usd
    note: the tier of the house-uplift factor is decided from the room charges posted to the traveller's hotel stays over the last twelve months
  compute:
  - voucher_count: COUNT('air_booking_events', date_field='posted_date', event_type='air_credit_issue')
  - lapsed_total: SUM('air_booking_events', 'amount_usd', date_field='posted_date', event_type='air_credit_issue')
  - largest_voucher: MAX('air_booking_events', 'amount_usd', event_type='air_credit_issue')
  - latest_expiry: LATEST('air_booking_events', 'credit_expires_on', date_field='posted_date', event_type='air_credit_issue')
  - months_since_lapse: MONTHS(latest_expiry, NOW)
  - lapsed_recent_total: SUM('air_booking_events', 'amount_usd', within_months=K('retention_window_months'), date_field='posted_date', event_type='air_credit_issue')
  - value_standing: lapsed_recent_total if (voucher_count >= 2 and months_since_lapse > K('long_lapse_months')) else (lapsed_total if (voucher_count >= 2 and months_since_lapse <= K('long_lapse_months'))
      else largest_voucher)
  - months_since_cancellation: MONTHS(F('cancelled_at'), NOW)
  - carry_share: K('long_stale_carry') if months_since_cancellation > K('long_stale_months') else (K('mid_stale_carry') if months_since_cancellation > K('mid_stale_months') else 1.00)
  - club_tier: CFIELD('club', 'variant_name', status='active')
  - club_enrolled_date: CFIELD('club', 'enrolled_date', status='active')
  - club_months: MONTHS(club_enrolled_date, NOW) if club_enrolled_date != None else 0
  - card_uplift: K('senior_carry_uplift') if ((club_tier == 'Wanderlane Platinum' or club_tier == 'Wanderlane Titanium' or club_tier == 'Wanderlane Ambassador') and club_months >= K('long_membership_months'))
      else (K('member_carry_uplift') if ((club_tier == 'Wanderlane Blue' or club_tier == 'Wanderlane Silver' or club_tier == 'Wanderlane Gold') and club_months >= K('long_membership_months')) else (K('entry_carry_uplift')
      if (club_tier != None and club_months < K('long_membership_months')) else 0.00))
  - base_fare_lines: COUNT('air_booking_events', date_field='posted_date', event_type='air_fare_charge', charge_category='base_fare')
  - party_share: K('shared_lead_share') if (P('credit_transferable') == False and base_fare_lines >= 3) else (K('paired_lead_share') if (P('credit_transferable') == False and base_fare_lines == 2) else
      1.00)
  - stay_room_spend_12m: XSUM('stay', 'stay_folio_entries', 'amount_usd', within_months=12, date_field='posted_date', event_type='stay_room_charge')
  - house_uplift: K('active_house_uplift') if (stay_room_spend_12m >= K('house_spend_band_usd') and club_tier != None) else (K('light_house_uplift') if (stay_room_spend_12m > 0 and stay_room_spend_12m <
      K('house_spend_band_usd') and club_tier != None) else (K('unlinked_house_uplift') if (stay_room_spend_12m > 0 and club_tier == None) else 0.00))
  - service_fee_lines: COUNT('air_booking_events', date_field='posted_date', event_type='air_fare_charge', charge_category='agency_service_fee')
  - service_recovery_usd: K('party_service_recovery_usd') if (service_fee_lines >= 2 and P('agency_service_fee_usd') >= K('service_fee_band_usd')) else (K('single_service_recovery_usd') if (service_fee_lines
      == 1 and P('agency_service_fee_usd') >= K('service_fee_band_usd')) else 0.00)
  - reissue_fee_charged: SUM('air_booking_events', 'amount_usd', date_field='posted_date', event_type='air_fare_charge', charge_category='credit_reissue_fee')
  - set_lapsed: 1 if (voucher_count > 0 and DAYS(latest_expiry, NOW) > 0) else 0
  - result: RND(MX((value_standing * carry_share * party_share * (1 + card_uplift + house_uplift) - service_recovery_usd - reissue_fee_charged) * set_lapsed, 0), 2)
  compute_basis:
    voucher_count: Where two or more vouchers stand lapsed on the booking and the voucher most recently issued on it lapsed longer ago than the long-lapse term, the value standing is the total of the lapsed
      vouchers issued on the booking within the retention window. Where two or more vouchers stand lapsed on the booking and the voucher most recently issued on it lapsed no longer ago than the long-lapse
      term, the value standing is the total of every lapsed voucher on the booking. Otherwise the value standing is the largest lapsed voucher on the booking. The retention window is counted in whole calendar
      months back from the handling date to the day each voucher was issued.
    lapsed_total: Where two or more vouchers stand lapsed on the booking and the voucher most recently issued on it lapsed longer ago than the long-lapse term, the value standing is the total of the lapsed
      vouchers issued on the booking within the retention window. Where two or more vouchers stand lapsed on the booking and the voucher most recently issued on it lapsed no longer ago than the long-lapse
      term, the value standing is the total of every lapsed voucher on the booking. Otherwise the value standing is the largest lapsed voucher on the booking. The retention window is counted in whole calendar
      months back from the handling date to the day each voucher was issued.
    largest_voucher: Where two or more vouchers stand lapsed on the booking and the voucher most recently issued on it lapsed longer ago than the long-lapse term, the value standing is the total of the
      lapsed vouchers issued on the booking within the retention window. Where two or more vouchers stand lapsed on the booking and the voucher most recently issued on it lapsed no longer ago than the long-lapse
      term, the value standing is the total of every lapsed voucher on the booking. Otherwise the value standing is the largest lapsed voucher on the booking. The retention window is counted in whole calendar
      months back from the handling date to the day each voucher was issued.
    latest_expiry: Where two or more vouchers stand lapsed on the booking and the voucher most recently issued on it lapsed longer ago than the long-lapse term, the value standing is the total of the lapsed
      vouchers issued on the booking within the retention window. Where two or more vouchers stand lapsed on the booking and the voucher most recently issued on it lapsed no longer ago than the long-lapse
      term, the value standing is the total of every lapsed voucher on the booking. Otherwise the value standing is the largest lapsed voucher on the booking. The retention window is counted in whole calendar
      months back from the handling date to the day each voucher was issued.
    months_since_lapse: Where two or more vouchers stand lapsed on the booking and the voucher most recently issued on it lapsed longer ago than the long-lapse term, the value standing is the total of the
      lapsed vouchers issued on the booking within the retention window. Where two or more vouchers stand lapsed on the booking and the voucher most recently issued on it lapsed no longer ago than the long-lapse
      term, the value standing is the total of every lapsed voucher on the booking. Otherwise the value standing is the largest lapsed voucher on the booking. The retention window is counted in whole calendar
      months back from the handling date to the day each voucher was issued.
    value_standing: Where two or more vouchers stand lapsed on the booking and the voucher most recently issued on it lapsed longer ago than the long-lapse term, the value standing is the total of the lapsed
      vouchers issued on the booking within the retention window. Where two or more vouchers stand lapsed on the booking and the voucher most recently issued on it lapsed no longer ago than the long-lapse
      term, the value standing is the total of every lapsed voucher on the booking. Otherwise the value standing is the largest lapsed voucher on the booking. The retention window is counted in whole calendar
      months back from the handling date to the day each voucher was issued.
    months_since_cancellation: Where the booking's cancellation was confirmed longer ago than the long-stale term, the value standing is taken at the long-stale carry.
    carry_share: Where the booking's cancellation was confirmed longer ago than the long-stale term, the value standing is taken at the long-stale carry. Where the booking's cancellation was confirmed longer
      ago than the mid-stale term but not longer ago than the long-stale term, the value standing is taken at the mid-stale carry. Otherwise the value standing is taken in full.
    club_tier: Where the traveller holds an active traveller club card of the Platinum, Titanium or Ambassador tiers and the card was enrolled at or beyond the long-membership term, the senior-carry uplift
      is added as an uplift to the value standing.
    club_enrolled_date: Where the traveller holds an active traveller club card of any tier and the card was enrolled within the long-membership term, the entry-carry uplift is added as an uplift to the
      value standing.
    club_months: Where the traveller holds an active traveller club card of the Blue, Silver or Gold tiers and the card was enrolled at or beyond the long-membership term, the member-carry uplift is added
      as an uplift to the value standing.
    card_uplift: Where the traveller holds an active traveller club card of the Platinum, Titanium or Ambassador tiers and the card was enrolled at or beyond the long-membership term, the senior-carry uplift
      is added as an uplift to the value standing. Where the traveller holds an active traveller club card of the Blue, Silver or Gold tiers and the card was enrolled at or beyond the long-membership term,
      the member-carry uplift is added as an uplift to the value standing. Where the traveller holds an active traveller club card of any tier and the card was enrolled within the long-membership term,
      the entry-carry uplift is added as an uplift to the value standing. Otherwise no card uplift is added to the value standing.
    base_fare_lines: Where the fare brand that produced the lapsed voucher makes credits non-transferable and three or more base-fare lines stand on the booking, the value standing is taken at the shared-lead
      share because the fresh voucher stands in the lead traveller's name alone.
    party_share: Where the fare brand that produced the lapsed voucher makes credits non-transferable and three or more base-fare lines stand on the booking, the value standing is taken at the shared-lead
      share because the fresh voucher stands in the lead traveller's name alone. Where the fare brand that produced the lapsed voucher makes credits non-transferable and exactly two base-fare lines stand
      on the booking, the value standing is taken at the paired-lead share. Otherwise the value standing is taken in full.
    stay_room_spend_12m: Where room charges posted to the traveller's hotel stays over the last twelve months stand at or above the house-spend band and an active traveller club card stands on the profile,
      the active-house uplift is added as an uplift to the value standing.
    house_uplift: Where room charges posted to the traveller's hotel stays over the last twelve months stand at or above the house-spend band and an active traveller club card stands on the profile, the
      active-house uplift is added as an uplift to the value standing. Where room charges posted to the traveller's hotel stays over the last twelve months stand above nothing but below the house-spend
      band and an active traveller club card stands on the profile, the light-house uplift is added as an uplift to the value standing. Where room charges posted to the traveller's hotel stays over the
      last twelve months stand above nothing and no active traveller club card stands on the profile, the unlinked-house uplift is added as an uplift to the value standing. Otherwise no house uplift is
      added to the value standing.
    service_fee_lines: Where two or more agency service fee lines stand on the booking and the agency service fee of the fare brand held is at or above the service-fee band, the party service recovery is
      taken off in dollars, last of all.
    service_recovery_usd: Where two or more agency service fee lines stand on the booking and the agency service fee of the fare brand held is at or above the service-fee band, the party service recovery
      is taken off in dollars, last of all. Where exactly one agency service fee line stands on the booking and the agency service fee of the fare brand held is at or above the service-fee band, the single
      service recovery is taken off in dollars, last of all. Otherwise nothing is taken off in dollars for the agency service fee.
    reissue_fee_charged: The value carried onto the fresh voucher is fixed only after the reissue fee owed under the fare brand that produced the lapsed voucher stands as a charged line on the booking.
    result: The value carried is rounded to two decimal places at the end and never at any intermediate step.
    set_lapsed: The travel credit vouchers standing on the booking are taken as one set, and the set stands lapsed when the voucher most recently issued on it has lapsed; where that voucher has not lapsed
      the set is still redeemable as it stands and nothing is owed under this rule.
    lapsed_recent_total: Where two or more vouchers stand lapsed on the booking and the voucher most recently issued on it lapsed longer ago than the long-lapse term, the value standing is the total of
      the lapsed vouchers issued on the booking within the retention window. Where two or more vouchers stand lapsed on the booking and the voucher most recently issued on it lapsed no longer ago than the
      long-lapse term, the value standing is the total of every lapsed voucher on the booking. Otherwise the value standing is the largest lapsed voucher on the booking. The retention window is counted
      in whole calendar months back from the handling date to the day each voucher was issued.
  factors:
  - id: lapsed_set_selection
    effect: method
    decides: value_standing
    bindings:
    - voucher_count
    - lapsed_total
    - largest_voucher
    - latest_expiry
    - months_since_lapse
    - lapsed_recent_total
    - value_standing
    ladder:
    - when: two or more vouchers stand lapsed on the booking and the voucher most recently issued on it lapsed longer ago than the long-lapse term
      method: the value standing is the total of the lapsed vouchers issued on the booking within the retention window
    - when: two or more vouchers stand lapsed on the booking and the voucher most recently issued on it lapsed no longer ago than the long-lapse term
      method: the value standing is the total of every lapsed voucher on the booking
    - when: otherwise
      method: the value standing is the largest lapsed voucher on the booking
    baseline:
      value_standing: largest_voucher
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: staleness_carry_share
    effect: parameter
    decides: carry_share
    bindings:
    - months_since_cancellation
    - carry_share
    ladder:
    - when: the booking's cancellation was confirmed longer ago than the long-stale term
      value: K('long_stale_carry')
    - when: the booking's cancellation was confirmed longer ago than the mid-stale term but not longer ago than the long-stale term
      value: K('mid_stale_carry')
    - when: otherwise
      value: the value standing is taken in full
    baseline:
      carry_share: '1.00'
    evidence:
    - date
    cross_difficulty: null
  - id: lead_traveller_share
    effect: parameter
    decides: party_share
    bindings:
    - base_fare_lines
    - party_share
    ladder:
    - when: the fare brand that produced the lapsed voucher makes credits non-transferable and three or more base-fare lines stand on the booking
      value: K('shared_lead_share')
    - when: the fare brand that produced the lapsed voucher makes credits non-transferable and exactly two base-fare lines stand on the booking
      value: K('paired_lead_share')
    - when: otherwise
      value: the value standing is taken in full
    baseline:
      party_share: '1.00'
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: card_carry_uplift
    effect: parameter
    decides: card_uplift
    bindings:
    - club_tier
    - club_enrolled_date
    - club_months
    - card_uplift
    ladder:
    - when: the traveller holds an active traveller club card of the Platinum, Titanium or Ambassador tiers and the card was enrolled at or beyond the long-membership term
      value: K('senior_carry_uplift')
    - when: the traveller holds an active traveller club card of the Blue, Silver or Gold tiers and the card was enrolled at or beyond the long-membership term
      value: K('member_carry_uplift')
    - when: the traveller holds an active traveller club card of any tier and the card was enrolled within the long-membership term
      value: K('entry_carry_uplift')
    - when: otherwise
      value: no card uplift is added to the value standing
    baseline:
      card_uplift: '0.00'
    evidence:
    - cross_category
    - date
    cross_difficulty: club
  - id: house_activity_uplift
    effect: parameter
    decides: house_uplift
    bindings:
    - stay_room_spend_12m
    - house_uplift
    ladder:
    - when: room charges posted to the traveller's hotel stays over the last twelve months stand at or above the house-spend band and an active traveller club card stands on the profile
      value: K('active_house_uplift')
    - when: room charges posted to the traveller's hotel stays over the last twelve months stand above nothing but below the house-spend band and an active traveller club card stands on the profile
      value: K('light_house_uplift')
    - when: room charges posted to the traveller's hotel stays over the last twelve months stand above nothing and no active traveller club card stands on the profile
      value: K('unlinked_house_uplift')
    - when: otherwise
      value: no house uplift is added to the value standing
    baseline:
      house_uplift: '0.00'
    evidence:
    - cross_category
    - history
    cross_difficulty: stay
  - id: service_fee_recovery
    effect: parameter
    decides: service_recovery_usd
    bindings:
    - service_fee_lines
    - service_recovery_usd
    ladder:
    - when: two or more agency service fee lines stand on the booking and the agency service fee of the fare brand held is at or above the service-fee band
      value: K('party_service_recovery_usd')
    - when: exactly one agency service fee line stands on the booking and the agency service fee of the fare brand held is at or above the service-fee band
      value: K('single_service_recovery_usd')
    - when: otherwise
      value: nothing is taken off in dollars for the agency service fee
    baseline:
      service_recovery_usd: '0.00'
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  baseline:
    rule: The value standing is the largest lapsed travel credit standing on the booking. The value carried onto the fresh voucher is that value standing once every share and every uplift that bears on
      it has been taken, with anything taken off in dollars — the reissue fee charged on the booking above all — taken off last of all, after every share and every uplift, and it is never below zero. The
      reissue fee is met once, out of the value being carried forward, and is never taken a second time out of the vouchers it was charged for. The fresh voucher is filed against the issue line of the largest
      lapsed voucher standing on the booking, carries the traveller position of that line, and runs for the same validity term as the voucher it replaces, counted from the day it is reissued. The travel
      credit vouchers standing on the booking are taken as one set, and the set stands lapsed when the voucher most recently issued on it has lapsed; where that voucher has not lapsed the set is still redeemable
      as it stands and nothing is owed under this rule. The value carried is rounded to two decimal places at the end and never at any intermediate step. Where more than one share is taken on the same figure,
      the shares act one after another, each on the figure the one before it gives, and are never combined into a single rate; where more than one uplift is added to the same figure, the uplifts are combined
      into a single uplift and the figure is increased once by that total. The traveller carries the value forward themselves, because it is their own once-only right of reissue that is spent.
    params:
    - credit_validity_months
    - credit_transferable
  inputs:
    history:
    - table: air_booking_events
      aggregate: sum
      field: amount_usd
      within_months: null
      filters:
        event_type: air_credit_issue
    - table: air_booking_events
      aggregate: max
      field: amount_usd
      within_months: null
      filters:
        event_type: air_credit_issue
    - table: air_booking_events
      aggregate: sum
      field: amount_usd
      within_months: null
      filters:
        event_type: air_fare_charge
        charge_category: credit_reissue_fee
    - category: stay
      table: stay_folio_entries
      aggregate: sum
      field: amount_usd
      within_months: 12
      filters:
        event_type: stay_room_charge
    cross_category:
    - club
    - stay
