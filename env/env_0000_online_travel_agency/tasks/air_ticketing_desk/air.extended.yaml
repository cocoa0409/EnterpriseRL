    penalty_deduction: Where a notice standing on the booking records that the airline cancelled a segment, no part of the penalty standing on the booking is taken off the value placed on the voucher. Where
      a notice standing on the booking records a move short of a cancellation, half of the penalty standing on the booking is taken off the value placed on the voucher. Otherwise the whole of the penalty
      standing on the booking is taken off the value placed on the voucher.
    club_tier: Where the traveller holds an active traveller club card of the Platinum, Titanium or Ambassador tiers and the card was enrolled at or beyond the long-membership term, the senior-member uplift
      is added as an uplift to the value the booking's lines leave.
    club_enrolled_date: Where the traveller holds an active traveller club card of any tier and the card was enrolled within the long-membership term, the entry-member uplift is added as an uplift to the
      value the booking's lines leave.
    club_months: Where the traveller holds an active traveller club card of the Blue, Silver or Gold tiers and the card was enrolled at or beyond the long-membership term, the member uplift is added as
      an uplift to the value the booking's lines leave.
    member_uplift: Where the traveller holds an active traveller club card of the Platinum, Titanium or Ambassador tiers and the card was enrolled at or beyond the long-membership term, the senior-member
      uplift is added as an uplift to the value the booking's lines leave. Where the traveller holds an active traveller club card of the Blue, Silver or Gold tiers and the card was enrolled at or beyond
