- id: air_refund_settlement
  subject:
  - air_refund_settle
  - air_refund_payout
  rule: 'A lodged claim settles in the form the fare brand prescribes and in no other form: money to the card, or value on a voucher, never both and never a mixture. The settlement takes the brand''s processing
    time, counted in business days from the day the claim was lodged, excluding weekends and public holidays in the traveller''s country of residence. A payout line is raised only while the booking record
    stands at cancelled, refund pending or refunded. Each payout line is raised against the original fare line it reverses, so a booking with several fare lines settles as several payout lines and never
    as one lump sum. A payout may never exceed the amount that original line actually collected, and the sum of a booking''s payouts may never exceed the amount paid on the booking. Where the airline declines
    the claim, the booking is closed with no payout and the traveller is told which airline reference declined it. A claim that the airline has not answered within the brand''s processing time is escalated
    rather than settled out of agency funds.'
  eligibility:
  - id: refund_stage_reached
    applies_to:
    - air_refund_payout
    kind: state
    condition: A payout line is raised only while the booking record stands at cancelled, refund pending or refunded.
