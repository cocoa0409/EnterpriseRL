    - usd_tax_lines
    - conversion_holdback_rate
    ladder:
    - when: the tax lines on the booking were presented in a currency other than US dollars and the conversion markup of the fare brand held is at or above the markup band
      value: the conversion markup of the fare brand held
    - when: the tax lines on the booking were presented in a currency other than US dollars and the conversion markup of the fare brand held is below the markup band
      value: half the conversion markup of the fare brand held
    - when: otherwise
      value: nothing is held back for conversion
    baseline:
