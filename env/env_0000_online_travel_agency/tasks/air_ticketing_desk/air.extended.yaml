    evidence:
    - history
    - tier_param
    cross_difficulty: null
  baseline:
    rule: The taxes and carrier fees the airline returns on a booking the traveller has given up are taken as the total of the tax lines posted on the booking, returned in full to the original form of payment.
      The amount returned is settled as one payout line raised against the tax line posted earliest on the booking. The payout line carries the traveller position of the tax line it is raised against. The
      money collected on the booking is the total of its fare, tax and service lines, its optional extras, its rework lines and its penalty lines, and never includes the travel credit the booking has issued
      or redeemed. The amount returned may never exceed the money collected on the booking. The amount returned is rounded to two decimal places at the end and never at any intermediate step. The amount
      the tax lines are returned at is settled first, and the amount returned is that figure with anything held back taken off it and anything else that comes back added to it. Where more than one share
      is taken on the same figure, the shares act one after another, each on the figure the one before it gives, and are never combined into a single rate; where more than one uplift is added to the same
      figure, the uplifts are combined into a single uplift and the figure is increased once by that total.
