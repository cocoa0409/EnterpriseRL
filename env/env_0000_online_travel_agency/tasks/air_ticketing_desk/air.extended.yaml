    does not exceed the brand''s character limit. A name-correction line is raised only when no name-correction line has already been raised against the same booking. A difference larger than the brand''s
    character limit is not a correction but a change of traveller, which no brand permits: the ticket is cancelled on the brand''s own terms and a new ticket is sold. The correction is made against the
    identity document held on the traveller''s profile and never against what the caller says the spelling should be. Correcting the contact address or contact number on a booking is free on every brand
    and is not a name correction. A brand whose name-correction fee is zero still applies its character limit, because the limit is the airline''s and not the agency''s.'
