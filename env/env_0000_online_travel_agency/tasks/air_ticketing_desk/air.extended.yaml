extended_policies:
- id: air_ext_cancellation_penalty
  base_policy_refs:
  - air_penalty
  - air_cancel_refund
  - air_evt_schedule_change_rights
  overwrite:
  - base_policy: air_cancel_refund
    superseded_clause: The penalty withheld is read off the brand's cancellation ladder by how many whole days lie between the cancellation and the outbound departure, and the ladder's flat penalty applies
      only where the ladder is silent.
    replaced_by: The penalty owed for one traveller is the flat cancellation penalty of the fare brand held, taken in full.
  - base_policy: air_evt_schedule_change_rights
    superseded_clause: An airline schedule move at or beyond the threshold of the fare brand held gives the traveller a right to be rebooked at no charge onto any flight the airline will accept, or to be
      refunded in full to the original form of payment whatever the brand's ordinary refund form.
    replaced_by: What an airline move recorded on the booking does to the penalty owed follows how large that move was against the schedule-change threshold of the fare brand held, whether or not the move
      was large enough to give the traveller a right of its own.
  - base_policy: air_evt_schedule_change_rights
    superseded_clause: 'A move smaller than the brand''s threshold gives no right: a traveller who still wants to move pays the brand''s disruption rebooking fee, and a traveller who still wants to cancel
      is treated as a voluntary cancellation.'
    replaced_by: What an airline move recorded on the booking does to the penalty owed follows how large that move was against the schedule-change threshold of the fare brand held, whether or not the move
      was large enough to give the traveller a right of its own.
  trigger: state_due
  subject:
  - air_penalty_charge
  computes: penalty_amount_usd
  target_tool: withhold_cancellation_penalty_77ca3b84
  params:
    early_notice_share: 0.55
    advance_notice_share: 0.8
    late_notice_share: 1.3
    once_reworked_loading_usd: 25.0
    twice_reworked_loading_usd: 45.0
    senior_member_relief_rate: 0.4
    member_relief_rate: 0.2
    entry_member_relief_rate: 0.05
    qualifying_spend_threshold_usd: 2000.0
  rule: The cancellation penalty withheld from a booking the traveller has given up is worked out for one traveller and then taken for the party. The penalty owed for one traveller is the flat cancellation
    penalty of the fare brand held, taken in full. The notice the traveller gave is counted in whole days from the day the cancellation was confirmed to the outbound departure date, counting the day of
    departure and not the day of cancellation. The penalty owed for one traveller is charged once for the booking. The penalty is raised against the base-fare line posted earliest on the booking. The penalty
    line carries the traveller position of the base-fare line it is raised against. The money collected on the booking is the total of its fare, tax and service lines, its optional extras, its rework lines
    and its penalty lines, and never includes the travel credit the booking has issued or redeemed. The penalty is never larger than the value the ticket still carries, which is the money collected on the
    booking less the agency service fee of the fare brand held for each traveller on it. The amount withheld is rounded to two decimal places at the end and never at any intermediate step. The penalty owed
    for one traveller is settled in full before it is taken for the party, and the figure that party charge gives is the penalty withheld. Anything owed in dollars for one traveller enters the penalty owed
    for one traveller, and within that figure a share is taken on the flat cancellation penalty before anything is added to it in dollars; anything taken as a share of the penalty as a whole acts on the
    penalty withheld. Where more than one share is taken on the same figure, the shares act one after another, each on the figure the one before it gives, and are never combined into a single rate; where
    more than one uplift is added to the same figure, the uplifts are combined into a single uplift and the figure is increased once by that total. Where the notice the traveller gave is 60 days or more,
    the flat cancellation penalty is taken at the early-notice share in settling the penalty owed for one traveller. Where the notice the traveller gave is 15 days or more but fewer than 60, the flat cancellation
    penalty is taken at the advance-notice share in settling the penalty owed for one traveller. Where the notice the traveller gave is fewer than 3 days, the flat cancellation penalty is taken at the late-notice
    share in settling the penalty owed for one traveller. Otherwise the flat cancellation penalty is taken in full in settling the penalty owed for one traveller. Where exactly one voluntary change has
    been charged on the ticket in the last twelve months, the once-reworked loading is added to the penalty owed for one traveller. Where two or more voluntary changes have been charged on the ticket in
    the last twelve months, the twice-reworked loading is added to the penalty owed for one traveller instead. Otherwise nothing is added to the penalty owed for one traveller for an earlier rework. Where
    the booking carries more than one traveller and a base-fare line stands for each of them, the penalty owed for one traveller is charged once for each traveller on the booking. Where the booking carries
    more than one traveller and fewer base-fare lines than travellers stand on it, the penalty owed for one traveller is charged once for each base-fare line standing on the booking. Otherwise the penalty
    owed for one traveller is charged once for the booking. What an airline move recorded on the booking does to the penalty owed follows how large that move was against the schedule-change threshold of
    the fare brand held, whether or not the move was large enough to give the traveller a right of its own. Where the airline has recorded a move on the booking at or beyond the schedule-change threshold
    of the fare brand held, the penalty withheld is halved. Where the airline has recorded a move on the booking short of the schedule-change threshold of the fare brand held, the penalty withheld is reduced
    by a tenth. Otherwise the penalty withheld is taken as it stands. Where the traveller holds an active traveller club card of the Platinum, Titanium or Ambassador tiers and has counted tier-qualifying
    spend across the house over the last twelve months at or above the qualifying spend threshold, the senior-member relief is taken as a share off the penalty withheld. Where the traveller holds an active
    traveller club card of the Blue, Silver or Gold tiers and has counted tier-qualifying spend across the house over the last twelve months at or above the qualifying spend threshold, the member relief
    is taken as a share off the penalty withheld. Where the traveller holds an active traveller club card of any tier and has counted tier-qualifying spend across the house over the last twelve months below
    the qualifying spend threshold, the entry-member relief is taken as a share off the penalty withheld. Otherwise no relief is taken off the penalty withheld.
  prerequisite: []
  cross_category:
  - category: club
    as: branch
    reads:
    - status
    - variant_name
    - club_points_entries.amount_basis_usd
    note: the relief tier of the member-relief factor is decided from the traveller's club card and the tier-qualifying spend standing on its ledger
  compute:
  - notice_days: DAYS(F('cancelled_at'), F('departure_date'))
  - notice_factor: K('early_notice_share') if notice_days >= 60 else (K('advance_notice_share') if notice_days >= 15 else (K('late_notice_share') if notice_days < 3 else 1.00))
  - prior_reworks_12m: COUNT('air_booking_events', within_months=12, date_field='posted_date', event_type='air_change_fee_charge', reason_code='voluntary_change')
  - rework_loading: K('once_reworked_loading_usd') if prior_reworks_12m == 1 else (K('twice_reworked_loading_usd') if prior_reworks_12m >= 2 else 0.00)
  - per_traveller_penalty: P('cancel_penalty_usd') * notice_factor + rework_loading
  - base_fare_lines: COUNT('air_booking_events', date_field='posted_date', event_type='air_fare_charge', charge_category='base_fare')
  - travellers_charged: F('passenger_count') if (F('passenger_count') > 1 and base_fare_lines >= F('passenger_count')) else (base_fare_lines if (F('passenger_count') > 1 and base_fare_lines < F('passenger_count'))
      else 1)
  - largest_move_minutes: MAX('air_booking_events', 'schedule_change_minutes', event_type='air_schedule_change_notice')
  - disruption_share: 0.50 if largest_move_minutes >= P('schedule_change_threshold_minutes') else (0.90 if largest_move_minutes > 0 else 1.00)
  - club_tier: CFIELD('club', 'variant_name', status='active')
  - club_qualifying_spend_12m: XSUM('club', 'club_points_entries', 'amount_basis_usd', within_months=12, date_field='posted_date', points_kind='qualifying')
  - member_relief_rate: K('senior_member_relief_rate') if ((club_tier == 'Wanderlane Platinum' or club_tier == 'Wanderlane Titanium' or club_tier == 'Wanderlane Ambassador') and club_qualifying_spend_12m
      >= K('qualifying_spend_threshold_usd')) else (K('member_relief_rate') if ((club_tier == 'Wanderlane Blue' or club_tier == 'Wanderlane Silver' or club_tier == 'Wanderlane Gold') and club_qualifying_spend_12m
      >= K('qualifying_spend_threshold_usd')) else (K('entry_member_relief_rate') if (club_tier != None and club_qualifying_spend_12m < K('qualifying_spend_threshold_usd')) else 0.00))
  - money_collected: SUM('air_booking_events', 'amount_usd', date_field='posted_date', event_type='air_fare_charge') + SUM('air_booking_events', 'amount_usd', date_field='posted_date', event_type='air_ancillary_charge')
      + SUM('air_booking_events', 'amount_usd', date_field='posted_date', event_type='air_change_fee_charge') + SUM('air_booking_events', 'amount_usd', date_field='posted_date', event_type='air_penalty_charge')
  - ticket_value: MX(money_collected - P('agency_service_fee_usd') * F('passenger_count'), 0)
  - result: RND(MN(per_traveller_penalty * travellers_charged * disruption_share * (1 - member_relief_rate), ticket_value), 2)
  compute_basis:
    notice_days: The notice the traveller gave is counted in whole days from the day the cancellation was confirmed to the outbound departure date, counting the day of departure and not the day of cancellation.
    notice_factor: Where the notice the traveller gave is 60 days or more, the flat cancellation penalty is taken at the early-notice share in settling the penalty owed for one traveller. Where the notice
      the traveller gave is 15 days or more but fewer than 60, the flat cancellation penalty is taken at the advance-notice share in settling the penalty owed for one traveller. Where the notice the traveller
      gave is fewer than 3 days, the flat cancellation penalty is taken at the late-notice share in settling the penalty owed for one traveller. Otherwise the flat cancellation penalty is taken in full
      in settling the penalty owed for one traveller.
    prior_reworks_12m: Where exactly one voluntary change has been charged on the ticket in the last twelve months, the once-reworked loading is added to the penalty owed for one traveller.
    rework_loading: Where exactly one voluntary change has been charged on the ticket in the last twelve months, the once-reworked loading is added to the penalty owed for one traveller. Where two or more
      voluntary changes have been charged on the ticket in the last twelve months, the twice-reworked loading is added to the penalty owed for one traveller instead. Otherwise nothing is added to the penalty
      owed for one traveller for an earlier rework.
    per_traveller_penalty: The penalty owed for one traveller is the flat cancellation penalty of the fare brand held, taken in full.
    base_fare_lines: Where the booking carries more than one traveller and a base-fare line stands for each of them, the penalty owed for one traveller is charged once for each traveller on the booking.
    travellers_charged: Where the booking carries more than one traveller and a base-fare line stands for each of them, the penalty owed for one traveller is charged once for each traveller on the booking.
      Where the booking carries more than one traveller and fewer base-fare lines than travellers stand on it, the penalty owed for one traveller is charged once for each base-fare line standing on the
      booking. Otherwise the penalty owed for one traveller is charged once for the booking.
    largest_move_minutes: Where the airline has recorded a move on the booking at or beyond the schedule-change threshold of the fare brand held, the penalty withheld is halved.
    disruption_share: Where the airline has recorded a move on the booking at or beyond the schedule-change threshold of the fare brand held, the penalty withheld is halved. Where the airline has recorded
      a move on the booking short of the schedule-change threshold of the fare brand held, the penalty withheld is reduced by a tenth. Otherwise the penalty withheld is taken as it stands.
    club_tier: Where the traveller holds an active traveller club card of the Platinum, Titanium or Ambassador tiers and has counted tier-qualifying spend across the house over the last twelve months at
      or above the qualifying spend threshold, the senior-member relief is taken as a share off the penalty withheld.
    club_qualifying_spend_12m: Where the traveller holds an active traveller club card of the Blue, Silver or Gold tiers and has counted tier-qualifying spend across the house over the last twelve months
      at or above the qualifying spend threshold, the member relief is taken as a share off the penalty withheld.
    member_relief_rate: Where the traveller holds an active traveller club card of the Platinum, Titanium or Ambassador tiers and has counted tier-qualifying spend across the house over the last twelve
      months at or above the qualifying spend threshold, the senior-member relief is taken as a share off the penalty withheld. Where the traveller holds an active traveller club card of the Blue, Silver
      or Gold tiers and has counted tier-qualifying spend across the house over the last twelve months at or above the qualifying spend threshold, the member relief is taken as a share off the penalty withheld.
      Where the traveller holds an active traveller club card of any tier and has counted tier-qualifying spend across the house over the last twelve months below the qualifying spend threshold, the entry-member
      relief is taken as a share off the penalty withheld. Otherwise no relief is taken off the penalty withheld.
    ticket_value: The penalty is never larger than the value the ticket still carries, which is the money collected on the booking less the agency service fee of the fare brand held for each traveller on
      it.
    result: The amount withheld is rounded to two decimal places at the end and never at any intermediate step.
    money_collected: The money collected on the booking is the total of its fare, tax and service lines, its optional extras, its rework lines and its penalty lines, and never includes the travel credit
      the booking has issued or redeemed.
  factors:
  - id: notice_period_share
    effect: parameter
    decides: notice_factor
    bindings:
    - notice_days
    - notice_factor
    ladder:
    - when: the notice the traveller gave is 60 days or more
      value: K('early_notice_share')
    - when: the notice the traveller gave is 15 days or more but fewer than 60
      value: K('advance_notice_share')
    - when: the notice the traveller gave is fewer than 3 days
      value: K('late_notice_share')
    - when: otherwise
      value: the flat cancellation penalty is taken in full
    baseline:
      notice_factor: '1.00'
    evidence:
    - date
    cross_difficulty: null
  - id: earlier_rework_loading
    effect: parameter
    decides: rework_loading
    bindings:
    - prior_reworks_12m
    - rework_loading
    ladder:
    - when: exactly one voluntary change has been charged on the ticket in the last twelve months
      value: K('once_reworked_loading_usd')
    - when: two or more voluntary changes have been charged on the ticket in the last twelve months
      value: K('twice_reworked_loading_usd')
    - when: otherwise
      value: nothing is added to the penalty owed for one traveller for an earlier rework
    baseline:
      rework_loading: '0.00'
    evidence:
    - history
    cross_difficulty: null
  - id: party_charging_basis
    effect: method
    decides: travellers_charged
    bindings:
    - base_fare_lines
    - travellers_charged
    ladder:
    - when: the booking carries more than one traveller and a base-fare line stands for each of them
      method: the penalty owed for one traveller is charged once for each traveller on the booking
    - when: the booking carries more than one traveller and fewer base-fare lines than travellers stand on it
      method: the penalty owed for one traveller is charged once for each base-fare line standing on the booking
    - when: otherwise
      method: the penalty owed for one traveller is charged once for the booking
    baseline:
      travellers_charged: '1'
    evidence:
    - history
    cross_difficulty: null
  - id: airline_disruption_share
    effect: parameter
    decides: disruption_share
    bindings:
    - largest_move_minutes
    - disruption_share
    ladder:
    - when: the airline has recorded a move on the booking at or beyond the schedule-change threshold of the fare brand held
      value: the penalty withheld is halved
    - when: the airline has recorded a move on the booking short of the schedule-change threshold of the fare brand held
      value: the penalty withheld is reduced by a tenth
    - when: otherwise
      value: the penalty withheld is taken as it stands
    baseline:
      disruption_share: '1.00'
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: member_penalty_relief
    effect: parameter
    decides: member_relief_rate
    bindings:
    - club_tier
    - club_qualifying_spend_12m
    - member_relief_rate
    ladder:
    - when: the traveller holds an active traveller club card of the Platinum, Titanium or Ambassador tiers and has counted tier-qualifying spend across the house over the last twelve months at or above
        the qualifying spend threshold
      value: K('senior_member_relief_rate')
    - when: the traveller holds an active traveller club card of the Blue, Silver or Gold tiers and has counted tier-qualifying spend across the house over the last twelve months at or above the qualifying
        spend threshold
      value: K('member_relief_rate')
    - when: the traveller holds an active traveller club card of any tier and has counted tier-qualifying spend across the house over the last twelve months below the qualifying spend threshold
      value: K('entry_member_relief_rate')
    - when: otherwise
      value: no relief is taken off the penalty withheld
    baseline:
      member_relief_rate: '0.00'
    evidence:
    - cross_category
    - history
    cross_difficulty: club
  baseline:
    rule: The cancellation penalty withheld from a booking the traveller has given up is worked out for one traveller and then taken for the party. The penalty owed for one traveller is the flat cancellation
      penalty of the fare brand held, taken in full. The penalty owed for one traveller is charged once for the booking. The penalty is raised against the base-fare line posted earliest on the booking.
      The penalty line carries the traveller position of the base-fare line it is raised against. The money collected on the booking is the total of its fare, tax and service lines, its optional extras,
      its rework lines and its penalty lines, and never includes the travel credit the booking has issued or redeemed. The penalty is never larger than the value the ticket still carries, which is the money
      collected on the booking less the agency service fee of the fare brand held for each traveller on it. The amount withheld is rounded to two decimal places at the end and never at any intermediate
      step. The penalty owed for one traveller is settled in full before it is taken for the party, and the figure that party charge gives is the penalty withheld. Anything owed in dollars for one traveller
      enters the penalty owed for one traveller, and within that figure a share is taken on the flat cancellation penalty before anything is added to it in dollars; anything taken as a share of the penalty
      as a whole acts on the penalty withheld. Where more than one share is taken on the same figure, the shares act one after another, each on the figure the one before it gives, and are never combined
      into a single rate; where more than one uplift is added to the same figure, the uplifts are combined into a single uplift and the figure is increased once by that total.
    params:
    - cancel_penalty_usd
    - agency_service_fee_usd
  inputs:
    history:
    - table: air_booking_events
      aggregate: count
      field: air_event_id
      within_months: 12
      filters:
        event_type: air_change_fee_charge
        reason_code: voluntary_change
    - table: air_booking_events
      aggregate: count
      field: air_event_id
      within_months: null
      filters:
        event_type: air_fare_charge
        charge_category: base_fare
    - table: air_booking_events
      aggregate: max
      field: schedule_change_minutes
      within_months: null
      filters:
        event_type: air_schedule_change_notice
    - table: air_booking_events
      aggregate: sum
      field: amount_usd
      within_months: null
      filters: {}
    - category: club
      table: club_points_entries
      aggregate: sum
      field: amount_basis_usd
      within_months: 12
      filters:
        points_kind: qualifying
    cross_category:
    - club
- id: air_ext_airline_tax_return
  base_policy_refs:
  - air_refund_settlement
  - air_price_drop_guarantee
  - air_cancel_refund
  - air_baggage_fee
  - air_service_fee
  - air_evt_schedule_change_rights
  overwrite:
  - base_policy: air_refund_settlement
    superseded_clause: Each payout line is raised against the original fare line it reverses, so a booking with several fare lines settles as several payout lines and never as one lump sum.
    replaced_by: The amount returned is settled as one payout line raised against the tax line posted earliest on the booking.
  - base_policy: air_refund_settlement
    superseded_clause: A payout may never exceed the amount that original line actually collected, and the sum of a booking's payouts may never exceed the amount paid on the booking.
    replaced_by: The amount returned may never exceed the money collected on the booking.
  - base_policy: air_baggage_fee
    superseded_clause: A bag line already charged is refunded in full when the traveller cancels the whole itinerary inside the void window, and is otherwise refunded only where the flight itself did not
      operate.
    replaced_by: What comes back of the optional extras sold on the booking follows what the airline did to the itinerary.
  - base_policy: air_service_fee
    superseded_clause: The service fee is not refunded when the traveller later cancels, because the service it pays for has already been performed; it is refunded in full only where the agency itself cancelled
      the itinerary in error.
    replaced_by: What comes back of the agency service fee follows the traveller club card the traveller holds.
  - base_policy: air_evt_schedule_change_rights
    superseded_clause: An airline schedule move at or beyond the threshold of the fare brand held gives the traveller a right to be rebooked at no charge onto any flight the airline will accept, or to be
      refunded in full to the original form of payment whatever the brand's ordinary refund form.
    replaced_by: What the airline's notices standing on the booking add to the amount returned follows how many of them the booking received in the recent window, whether or not any one of them was large
      enough to give the traveller a right of its own.
  - base_policy: air_evt_schedule_change_rights
    superseded_clause: 'A move smaller than the brand''s threshold gives no right: a traveller who still wants to move pays the brand''s disruption rebooking fee, and a traveller who still wants to cancel
      is treated as a voluntary cancellation.'
    replaced_by: What the airline's notices standing on the booking add to the amount returned follows how many of them the booking received in the recent window, whether or not any one of them was large
      enough to give the traveller a right of its own.
  - base_policy: air_cancel_refund
    superseded_clause: Taxes and carrier fees that the airline itself refunds are returned even on a non-refundable brand, and the agency service fee is not.
    replaced_by: What comes back of the agency service fee follows the traveller club card the traveller holds.
  trigger: state_due
  subject:
  - air_refund_payout
  computes: tax_return_amount_usd
  target_tool: return_airline_refunded_taxes_4767edfd
  params:
    long_held_share: 0.75
    standard_held_share: 0.9
    long_held_days: 120
    standard_held_days: 30
    senior_service_fee_share: 1.0
    member_service_fee_share: 0.5
    repeat_notice_goodwill_usd: 60.0
    single_notice_goodwill_usd: 25.0
    markup_band_pct: 3.0
  rule: The taxes and carrier fees the airline returns on a booking the traveller has given up are taken as the total of the tax lines posted on the booking, returned in full to the original form of payment.
    The amount returned is settled as one payout line raised against the tax line posted earliest on the booking. The payout line carries the traveller position of the tax line it is raised against. The
    money collected on the booking is the total of its fare, tax and service lines, its optional extras, its rework lines and its penalty lines, and never includes the travel credit the booking has issued
    or redeemed. The amount returned may never exceed the money collected on the booking. The amount returned is rounded to two decimal places at the end and never at any intermediate step. The amount the
    tax lines are returned at is settled first, and the amount returned is that figure with anything held back taken off it and anything else that comes back added to it. Where more than one share is taken
    on the same figure, the shares act one after another, each on the figure the one before it gives, and are never combined into a single rate; where more than one uplift is added to the same figure, the
    uplifts are combined into a single uplift and the figure is increased once by that total. How long the ticket stood is counted in whole days from the day the ticket was issued to the day the cancellation
    was confirmed. Where the ticket stood for the long-held term or longer, the tax lines posted on the booking are returned at the long-held share. Where the ticket stood for the standard-held term or
    longer but short of the long-held term, the tax lines posted on the booking are returned at the standard-held share. Otherwise the tax lines posted on the booking are returned in full. What comes back
    of the optional extras sold on the booking follows what the airline did to the itinerary. Where a notice standing on the booking records that the airline cancelled a segment and an optional extra has
    been sold on the booking, the optional extras are added to the amount returned at what they were charged. Where no notice standing on the booking records that the airline cancelled a segment and an
    optional extra has been sold on the booking, the optional extras are added to the amount returned at the first checked bag rate of the fare brand held, counted once for each optional extra sold. Otherwise
    nothing of the optional extras is added to the amount returned. What comes back of the agency service fee follows the traveller club card the traveller holds. Where the traveller holds an active traveller
    club card of the Platinum, Titanium or Ambassador tiers, the agency service fee of the fare brand held is returned for each traveller on the booking and added to the amount returned. Where the traveller
    holds an active traveller club card of the Blue, Silver or Gold tiers, half the agency service fee of the fare brand held is returned for each traveller on the booking and added to the amount returned.
    Otherwise nothing of the agency service fee is added to the amount returned. What the airline's notices standing on the booking add to the amount returned follows how many of them the booking received
    in the recent window, whether or not any one of them was large enough to give the traveller a right of its own. Where two or more airline notices stand on the booking from the last six months, the repeat-notice
    goodwill is added to the amount returned. Where exactly one airline notice stands on the booking from the last six months, the single-notice goodwill is added to the amount returned. Otherwise nothing
    is added for airline notices. Where the tax lines on the booking were presented in a currency other than US dollars and the conversion markup of the fare brand held is at or above the markup band, the
    conversion markup of the fare brand held is held back from the amount the tax lines are returned at. Where the tax lines on the booking were presented in a currency other than US dollars and the conversion
    markup of the fare brand held is below the markup band, half the conversion markup of the fare brand held is held back from the amount the tax lines are returned at. Otherwise nothing is held back for
    conversion.
  prerequisite: []
  cross_category:
  - category: club
    as: branch
    reads:
    - status
    - variant_name
    note: the tier of the club service-fee factor is decided from the traveller club card standing on the traveller's profile
  compute:
  - tax_base: SUM('air_booking_events', 'amount_usd', date_field='posted_date', event_type='air_fare_charge', charge_category='taxes_and_carrier_fees')
  - days_held: DAYS(F('ticketed_at'), F('cancelled_at'))
  - holding_share: K('long_held_share') if days_held >= K('long_held_days') else (K('standard_held_share') if days_held >= K('standard_held_days') else 1.00)
  - airline_cancel_notices: COUNT('air_booking_events', date_field='posted_date', event_type='air_schedule_change_notice', reason_code='airline_cancellation')
  - extras_collected: SUM('air_booking_events', 'amount_usd', date_field='posted_date', event_type='air_ancillary_charge')
  - extras_count: COUNT('air_booking_events', date_field='posted_date', event_type='air_ancillary_charge')
  - extras_added: extras_collected if (airline_cancel_notices > 0 and extras_collected > 0) else (P('first_bag_fee_usd') * extras_count if (airline_cancel_notices == 0 and extras_collected > 0) else 0.00)
  - club_tier: CFIELD('club', 'variant_name', status='active')
  - service_fee_returned: P('agency_service_fee_usd') * F('passenger_count') * K('senior_service_fee_share') if (club_tier == 'Wanderlane Platinum' or club_tier == 'Wanderlane Titanium' or club_tier ==
      'Wanderlane Ambassador') else (P('agency_service_fee_usd') * F('passenger_count') * K('member_service_fee_share') if (club_tier == 'Wanderlane Blue' or club_tier == 'Wanderlane Silver' or club_tier
      == 'Wanderlane Gold') else 0.00)
  - notices_6m: COUNT('air_booking_events', within_months=6, date_field='posted_date', event_type='air_schedule_change_notice')
  - notice_goodwill: K('repeat_notice_goodwill_usd') if notices_6m >= 2 else (K('single_notice_goodwill_usd') if notices_6m == 1 else 0.00)
  - tax_lines: COUNT('air_booking_events', date_field='posted_date', event_type='air_fare_charge', charge_category='taxes_and_carrier_fees')
  - usd_tax_lines: COUNT('air_booking_events', date_field='posted_date', event_type='air_fare_charge', charge_category='taxes_and_carrier_fees', currency_charged='USD')
  - conversion_holdback_rate: P('currency_conversion_markup_pct') / 100 if (tax_lines > usd_tax_lines and P('currency_conversion_markup_pct') >= K('markup_band_pct')) else (P('currency_conversion_markup_pct')
      / 200 if (tax_lines > usd_tax_lines and P('currency_conversion_markup_pct') < K('markup_band_pct')) else 0.00)
  - money_collected: SUM('air_booking_events', 'amount_usd', date_field='posted_date', event_type='air_fare_charge') + SUM('air_booking_events', 'amount_usd', date_field='posted_date', event_type='air_ancillary_charge')
      + SUM('air_booking_events', 'amount_usd', date_field='posted_date', event_type='air_change_fee_charge') + SUM('air_booking_events', 'amount_usd', date_field='posted_date', event_type='air_penalty_charge')
  - tax_returned_at: tax_base * holding_share
  - conversion_holdback: tax_returned_at * conversion_holdback_rate
  - result: RND(MN(tax_returned_at - conversion_holdback + extras_added + service_fee_returned + notice_goodwill, money_collected), 2)
  compute_basis:
    tax_base: The taxes and carrier fees the airline returns on a booking the traveller has given up are taken as the total of the tax lines posted on the booking, returned in full to the original form
      of payment.
    days_held: How long the ticket stood is counted in whole days from the day the ticket was issued to the day the cancellation was confirmed.
    holding_share: Where the ticket stood for the long-held term or longer, the tax lines posted on the booking are returned at the long-held share. Where the ticket stood for the standard-held term or
      longer but short of the long-held term, the tax lines posted on the booking are returned at the standard-held share. Otherwise the tax lines posted on the booking are returned in full.
    airline_cancel_notices: Where a notice standing on the booking records that the airline cancelled a segment and an optional extra has been sold on the booking, the optional extras are added to the amount
      returned at what they were charged.
    extras_collected: Where a notice standing on the booking records that the airline cancelled a segment and an optional extra has been sold on the booking, the optional extras are added to the amount
      returned at what they were charged.
    extras_added: What comes back of the optional extras sold on the booking follows what the airline did to the itinerary. Where a notice standing on the booking records that the airline cancelled a segment
      and an optional extra has been sold on the booking, the optional extras are added to the amount returned at what they were charged. Where no notice standing on the booking records that the airline
      cancelled a segment and an optional extra has been sold on the booking, the optional extras are added to the amount returned at the first checked bag rate of the fare brand held, counted once for
      each optional extra sold. Otherwise nothing of the optional extras is added to the amount returned.
    club_tier: What comes back of the agency service fee follows the traveller club card the traveller holds. Where the traveller holds an active traveller club card of the Platinum, Titanium or Ambassador
      tiers, the agency service fee of the fare brand held is returned for each traveller on the booking and added to the amount returned.
    service_fee_returned: What comes back of the agency service fee follows the traveller club card the traveller holds. Where the traveller holds an active traveller club card of the Platinum, Titanium
      or Ambassador tiers, the agency service fee of the fare brand held is returned for each traveller on the booking and added to the amount returned. Where the traveller holds an active traveller club
      card of the Blue, Silver or Gold tiers, half the agency service fee of the fare brand held is returned for each traveller on the booking and added to the amount returned. Otherwise nothing of the
      agency service fee is added to the amount returned.
    notices_6m: Where two or more airline notices stand on the booking from the last six months, the repeat-notice goodwill is added to the amount returned.
    notice_goodwill: Where two or more airline notices stand on the booking from the last six months, the repeat-notice goodwill is added to the amount returned. Where exactly one airline notice stands
      on the booking from the last six months, the single-notice goodwill is added to the amount returned. Otherwise nothing is added for airline notices.
    tax_lines: Where the tax lines on the booking were presented in a currency other than US dollars and the conversion markup of the fare brand held is at or above the markup band, the conversion markup
      of the fare brand held is held back from the amount the tax lines are returned at.
    usd_tax_lines: Where the tax lines on the booking were presented in a currency other than US dollars and the conversion markup of the fare brand held is below the markup band, half the conversion markup
      of the fare brand held is held back from the amount the tax lines are returned at.
    conversion_holdback_rate: Where the tax lines on the booking were presented in a currency other than US dollars and the conversion markup of the fare brand held is at or above the markup band, the conversion
      markup of the fare brand held is held back from the amount the tax lines are returned at. Where the tax lines on the booking were presented in a currency other than US dollars and the conversion markup
      of the fare brand held is below the markup band, half the conversion markup of the fare brand held is held back from the amount the tax lines are returned at. Otherwise nothing is held back for conversion.
    money_collected: The money collected on the booking is the total of its fare, tax and service lines, its optional extras, its rework lines and its penalty lines, and never includes the travel credit
      the booking has issued or redeemed.
    result: The amount returned is rounded to two decimal places at the end and never at any intermediate step.
    extras_count: Where no notice standing on the booking records that the airline cancelled a segment and an optional extra has been sold on the booking, the optional extras are added to the amount returned
      at the first checked bag rate of the fare brand held, counted once for each optional extra sold.
    tax_returned_at: The amount the tax lines are returned at is settled first, and the amount returned is that figure with anything held back taken off it and anything else that comes back added to it.
    conversion_holdback: Where the tax lines on the booking were presented in a currency other than US dollars and the conversion markup of the fare brand held is at or above the markup band, the conversion
      markup of the fare brand held is held back from the amount the tax lines are returned at. Where the tax lines on the booking were presented in a currency other than US dollars and the conversion markup
      of the fare brand held is below the markup band, half the conversion markup of the fare brand held is held back from the amount the tax lines are returned at. Otherwise nothing is held back for conversion.
  factors:
  - id: ticket_holding_share
    effect: parameter
    decides: holding_share
    bindings:
    - days_held
    - holding_share
    ladder:
    - when: the ticket stood for the long-held term or longer
      value: K('long_held_share')
    - when: the ticket stood for the standard-held term or longer but short of the long-held term
      value: K('standard_held_share')
    - when: otherwise
      value: the tax lines posted on the booking are returned in full
    baseline:
      holding_share: '1.00'
    evidence:
    - date
    cross_difficulty: null
  - id: optional_extras_treatment
    effect: method
    decides: extras_added
    bindings:
    - airline_cancel_notices
    - extras_collected
    - extras_count
    - extras_added
    ladder:
    - when: a notice standing on the booking records that the airline cancelled a segment and an optional extra has been sold on the booking
      method: the optional extras are added to the amount returned at what they were charged
    - when: no notice standing on the booking records that the airline cancelled a segment and an optional extra has been sold on the booking
      method: the optional extras are added to the amount returned at the first checked bag rate of the fare brand held, counted once for each optional extra sold
    - when: otherwise
      method: nothing of the optional extras is added to the amount returned
    baseline:
      extras_added: '0.00'
    evidence:
    - history
    cross_difficulty: null
  - id: club_service_fee_return
    effect: parameter
    decides: service_fee_returned
    bindings:
    - club_tier
    - service_fee_returned
    ladder:
    - when: the traveller holds an active traveller club card of the Platinum, Titanium or Ambassador tiers
      value: K('senior_service_fee_share')
    - when: the traveller holds an active traveller club card of the Blue, Silver or Gold tiers
      value: K('member_service_fee_share')
    - when: otherwise
