  overwrite:
  - base_policy: air_credit_validity
    superseded_clause: A travel credit is issued for the value the cancelled ticket still carried after any penalty has been withheld
    replaced_by: The value placed on the voucher is the fare, tax and service lines collected on the booking, less the money already returned to the original form of payment, less the agency service fee
      retained, and less the whole of the penalty standing on the booking, and is never below zero.
  - base_policy: air_club_benefit_interaction
    superseded_clause: 'A club benefit and a fare-brand inclusion never stack into a payment to the traveller: a bag already included in the brand is simply free, and the club benefit is not converted into
      value.'
    replaced_by: What the traveller club card adds to the value placed on the voucher follows the tier held and how long the card has stood.
  - base_policy: air_evt_schedule_change_rights
    superseded_clause: An airline schedule move at or beyond the threshold of the fare brand held gives the traveller a right to be rebooked at no charge onto any flight the airline will accept, or to be
      refunded in full to the original form of payment whatever the brand's ordinary refund form.
    replaced_by: What an airline notice standing on the booking does to the penalty taken off the value placed on the voucher follows whether the airline cancelled a segment or only moved one, whether or
      not the move was large enough to give the traveller a right of its own.
  - base_policy: air_evt_schedule_change_rights
    superseded_clause: 'A move smaller than the brand''s threshold gives no right: a traveller who still wants to move pays the brand''s disruption rebooking fee, and a traveller who still wants to cancel
      is treated as a voluntary cancellation.'
    replaced_by: What an airline notice standing on the booking does to the penalty taken off the value placed on the voucher follows whether the airline cancelled a segment or only moved one, whether or
