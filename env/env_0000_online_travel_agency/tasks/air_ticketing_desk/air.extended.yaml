- id: air_biz_exclusion
  subject:
  - air_fare_charge
  - air_change_fee_charge
  rule: 'A booking made under a corporate travel programme and a consumer booking are mutually exclusive on price: a booking that carries a corporate programme reference is priced entirely on the programme''s
    negotiated terms, and none of the consumer concessions in this charter apply to it. In particular a corporate booking earns no club points, claims no price-drop settlement, and takes no club fee waiver,
    whatever the traveller''s personal club tier. A fare brand that is not eligible for a corporate discount may still be sold under a programme, but at its public price, and the programme''s negotiated
    terms do not reach it. Where a traveller asks for a corporate reference to be added to a booking that has already been ticketed as a consumer booking, the booking is not re-priced; the programme reference
    is recorded for reporting only. Where the corporate reference is removed before ticketing the booking reverts to consumer terms in full. A booking may carry at most one corporate programme reference
    at a time.'
