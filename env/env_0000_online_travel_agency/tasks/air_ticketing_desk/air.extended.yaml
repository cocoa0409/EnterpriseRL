      Where voluntary change lines stand on the booking and the fare brand held returns value to the original form of payment, half of what those lines were charged is added to the money collected. Otherwise
      nothing of the voluntary change lines is added to the money collected.
    returned_to_card: The value placed on the voucher is fixed only after the taxes and carrier fees the airline returns stand as a payout line on the booking.
    service_fee_lines: Where an agency service fee line stands for each traveller on the booking, the agency service fee retained is the total of the service fee lines standing on the booking.
    service_fee_retained: Where an agency service fee line stands for each traveller on the booking, the agency service fee retained is the total of the service fee lines standing on the booking. Where
