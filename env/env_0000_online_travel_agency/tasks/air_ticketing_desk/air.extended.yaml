    move_notices: Where a notice standing on the booking records a move short of a cancellation, half of the penalty standing on the booking is taken off the value placed on the voucher.
    penalty_share: Where a notice standing on the booking records that the airline cancelled a segment, no part of the penalty standing on the booking is taken off the value placed on the voucher. Where
      a notice standing on the booking records a move short of a cancellation, half of the penalty standing on the booking is taken off the value placed on the voucher. Otherwise the whole of the penalty
