- id: drive_prepayment
  subject:
  - drive_prepay_charge
  rule: A rate class that requires prepayment takes its prepayment share of the whole rental total at the moment the supplier confirms; a class that does not takes nothing until the counter. The prepayment
    covers the rental days, the statutory charges and the protection products bought in advance, and never the deposit hold, which is authorised at collection and released at return. Where the card is declined
    the rental stays merely booked and is released; a rental is never confirmed against an unpaid prepayment. A prepaid rental is charged in the currency the supplier publishes, and a conversion the renter
    elects carries the class's markup. The deposit hold is the class's own amount, is never treated as a payment, and is released within the supplier's own banking time after the vehicle is returned undamaged.
    Where the renter later cancels, the prepayment is the money the cancellation charge is withheld from.
  eligibility: []
  params:
    per_tier:
      Pay Now Saver Rate:
        prepayment_required: =prepayment_required
        prepayment_pct: =prepayment_pct
        deposit_hold_usd: =deposit_hold_usd
        currency_conversion_markup_pct: =currency_conversion_markup_pct
      Pay Now Standard Rate:
        prepayment_required: =prepayment_required
        prepayment_pct: =prepayment_pct
