          - when: "one additional driver line stands on the ledger and the allowance is granted for seven or more days"
            value: "K('single_driver_touring_miles')"
          - when: "otherwise"
            value: "0"
        baseline:
          driver_allowance: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The included mileage granted on a rental is the rate class's included miles for each booked rental day, placed
        on the rental in one grant covering the whole rental, and the grant is counted in whole miles.
      params: [included_mileage_per_day]
    inputs:
      history:
        - {table: drive_rental_entries, aggregate: count, field: drive_entry_id, within_months: null, filters: {charge_category: rental_rate}}
      cross_category: [bundle]
  - id: drive_ext_return_settlement
    base_policy_refs: [drive_mileage, drive_rate_and_extras, drive_club_and_corporate_interaction]
    overwrite:
      - base_policy: drive_mileage
        superseded_clause: >-
          Miles driven beyond the allowance are charged at the class's excess rate per mile, rounded to the whole mile, and a rental that returns under its allowance is refunded nothing for the miles unused.
        replaced_by: >-
          The excess mileage settled at return is the rate class's excess rate for each whole mile driven beyond the included allowance standing on the rental, and the result is rounded to two decimal places.
      - base_policy: drive_mileage
        superseded_clause: >-
          At return the miles actually driven are taken off the allowance in one movement, measured by the difference between the odometer readings recorded at collection and at return.
        replaced_by: >-
          The miles driven are read off the mileage movements the rental's ledger records, each movement being the miles that row took off the allowance, in one of three ways: where no mileage movement stands against the rental, the miles driven are taken on the supplier's own measurement, being the rate class's included miles for every rental day line standing on the ledger together with the supplier's standing estimate of the miles beyond them; where the vehicle was collected a whole day or more after its booked collection moment, every mileage movement standing against the rental is added together and the rate class's included miles are taken off for each whole day lost to the late collection, never leaving less than nothing; where the vehicle was collected as booked, every mileage movement standing against the rental is added together.
      - base_policy: drive_club_and_corporate_interaction
        superseded_clause: >-
          Holding an active traveller club membership changes what this rental is charged: the club tier held on the collection date decides the discount applied to the rental rate and whether a vehicle class upgrade is offered, and the rate class's own terms decide everything else.
        replaced_by: >-
          A traveller club membership that the renter has actually driven on relieves the settlement: an active membership at Wanderlane Titanium or Wanderlane Ambassador with at least the club driving threshold of rental accruals on its points ledger over the last twenty-four months relieves the settlement at the top club relief rate; an active membership at Wanderlane Gold or Wanderlane Platinum with at least that many rental accruals relieves it at the middle club relief rate; any other membership, or none, relieves nothing.
    trigger: on_request
    subject: [drive_return, drive_extras_charge]
    computes: excess_mileage_charge_usd
    target_tool: close_rental_return_9b1c513c
    params:
      heavy_overage_miles: 500
      light_overage_miles: 150
      heavy_overage_rate_usd: 0.2
      light_overage_rate_usd: 0.26
      long_hire_grace_miles: 120
      short_hire_grace_miles: 60
      grace_day_threshold: 7
      heavy_overage_admin_usd: 35.0
      light_overage_admin_usd: 18.0
      late_reading_threshold_days: 1
      late_collection_days: 1
      supplier_measure_miles: 250
      top_club_excess_relief_pct: 25
      mid_club_excess_relief_pct: 10
      club_driving_threshold: 2
    rule: >-
      The excess mileage settled at return is the rate class's excess rate for each whole mile driven beyond the
      included allowance standing on the rental, and the result is rounded to two decimal places. The excess mileage
      settled at return is worked out only after the included allowance owed for the rental stands granted on it. The
      miles driven are read off the mileage movements the rental's ledger records, each movement being the miles that
      row took off the allowance, in one of three ways: where no mileage movement stands against the rental, the miles
      driven are taken on the supplier's own measurement, being the rate class's included miles for every rental day
      line standing on the ledger together with the supplier's standing estimate of the miles beyond them; where the
      vehicle was collected a whole day or more after its booked collection moment, every mileage movement standing
      against the rental is added together and the rate class's included miles are taken off for each whole day lost to
      the late collection, never leaving less than nothing; where the vehicle was collected as booked, every mileage
      movement standing against the rental is added together. The first miles
      beyond the allowance may be carried free: where no damage recharge stands on the rental and rental day lines stand
      for the grace day threshold of days or more, the long hire grace miles are carried free; where no damage recharge
      stands on the rental and rental day lines stand for fewer days than that, the short hire grace miles are carried
      free; where a damage recharge stands on the rental, no mile beyond the allowance is carried free. The rate charged
      for each chargeable mile falls as the overage grows: an overage at or above the heavy overage threshold of miles
      is charged at the heavy overage rate; an overage at or above the light overage threshold but below the heavy one
      is charged at the light overage rate; an overage below the light overage threshold is charged at the rate class's
      own excess rate per mile. An administration charge is added once where the settlement is raised on a reading taken
      after the booked return: an overage at or above the heavy overage threshold read after the booked return day
      carries the heavy overage administration charge; an overage at or above the light overage threshold read after the
      booked return day carries the light overage administration charge; in every other case no administration charge is
      added. A traveller club membership that the renter has actually driven on relieves the settlement: an active
      membership at Wanderlane Titanium or Wanderlane Ambassador with at least the club driving threshold of rental
      accruals on its points ledger over the last twenty-four months relieves the settlement at the top club relief rate;
      an active membership at Wanderlane Gold or Wanderlane Platinum with at least that many rental accruals relieves it
      at the middle club relief rate; any other membership, or none, relieves nothing. The settlement is worked out by
      taking the grace miles off the miles beyond the allowance, never below nothing, charging what is left at the rate
      for each chargeable mile, adding the administration charge once to that product rather than to any earlier step,
      and relieving the sum of the two once; the result is rounded to two decimal places only at the end and never at an
      intermediate step.
    prerequisite:
      - problem: drive_ext_included_mileage_grant
        kind: value_input
        gate: excess_miles_raw
        form: state
        policy_source: >-
          The excess mileage settled at return is worked out only after the included allowance owed for the rental stands granted on it.
        condition: >-
          The rental carries a granted included mileage allowance on its own ledger.
        resolved_by: grant_included_mileage_444a2a24
        effect: >-
          Once the allowance stands granted, the miles counted beyond it fall by exactly the miles granted, so the binding that carries the overage is that much smaller.
    cross_category:
      - category: club
        as: history
        reads: [variant_name, club_points_entries.points_delta]
        note: the traveller club membership held and how many rental accruals stand on its points ledger over the last twenty-four months decide the club relief on the settlement
    compute:
      - grant_total: "SUM('drive_rental_entries', 'miles_delta', date_field='posted_date', event_type='drive_mileage_grant')"
      - use_rows: "COUNT('drive_rental_entries', date_field='posted_date', event_type='drive_mileage_use')"
      - use_sum: "ABS(SUM('drive_rental_entries', 'miles_delta', date_field='posted_date', event_type='drive_mileage_use'))"
      - late_collection_days: "DAYS(F('pickup_at'), F('picked_up_at'))"
      - damage_lines: "COUNT('drive_rental_entries', date_field='posted_date', event_type='drive_damage_charge')"
      - rate_day_lines_held: "COUNT('drive_rental_entries', date_field='posted_date', charge_category='rental_rate')"
      - miles_driven: "(P('included_mileage_per_day') * rate_day_lines_held + K('supplier_measure_miles')) if use_rows == 0 else (MX(0, use_sum - late_collection_days * P('included_mileage_per_day')) if late_collection_days >= K('late_collection_days') else use_sum)"
      - excess_miles_raw: "MX(0, miles_driven - grant_total)"
      - grace_miles: "K('long_hire_grace_miles') if (damage_lines == 0 and rate_day_lines_held >= K('grace_day_threshold')) else (K('short_hire_grace_miles') if (damage_lines == 0 and rate_day_lines_held < K('grace_day_threshold')) else 0)"
      - chargeable_miles: "MX(0, excess_miles_raw - grace_miles)"
      - excess_rate: "K('heavy_overage_rate_usd') if chargeable_miles >= K('heavy_overage_miles') else (K('light_overage_rate_usd') if chargeable_miles >= K('light_overage_miles') else P('excess_mileage_fee_per_mile_usd'))"
      - latest_use_date: "LATEST('drive_rental_entries', 'posted_date', date_field='posted_date', event_type='drive_mileage_use')"
      - late_reading_days: "DAYS(F('dropoff_at'), latest_use_date)"
      - overage_admin: "K('heavy_overage_admin_usd') if (chargeable_miles >= K('heavy_overage_miles') and late_reading_days >= K('late_reading_threshold_days')) else (K('light_overage_admin_usd') if (chargeable_miles >= K('light_overage_miles') and late_reading_days >= K('late_reading_threshold_days')) else 0)"
      - club_tier_b: "CFIELD('club', 'variant_name', status='active')"
      - club_drive_accruals: "XCOUNT('club', 'club_points_entries', within_months=24, date_field='posted_date', accrual_source='drive_rental')"
      - club_relief_pct: "K('top_club_excess_relief_pct') if ((club_tier_b == 'Wanderlane Titanium' or club_tier_b == 'Wanderlane Ambassador') and club_drive_accruals >= K('club_driving_threshold')) else (K('mid_club_excess_relief_pct') if ((club_tier_b == 'Wanderlane Gold' or club_tier_b == 'Wanderlane Platinum') and club_drive_accruals >= K('club_driving_threshold')) else 0)"
      - result: "RND((chargeable_miles * excess_rate + overage_admin) * (1 - club_relief_pct / 100), 2)"
    compute_basis:
      grant_total: "the rate class's excess rate for each whole mile driven beyond the included allowance standing on the rental"
      use_rows: "where no mileage movement stands against the rental, the miles driven are taken on the supplier's own measurement"
      use_sum: "where the vehicle was collected as booked, every mileage movement standing against the rental is added together"
      late_collection_days: "where the vehicle was collected a whole day or more after its booked collection moment"
      miles_driven: "where no mileage movement stands against the rental, the miles driven are taken on the supplier's own measurement, being the rate class's included miles for every rental day line standing on the ledger together with the supplier's standing estimate of the miles beyond them; where the vehicle was collected a whole day or more after its booked collection moment, every mileage movement standing against the rental is added together and the rate class's included miles are taken off for each whole day lost to the late collection, never leaving less than nothing; where the vehicle was collected as booked, every mileage movement standing against the rental is added together."
      excess_miles_raw: "the rate class's excess rate for each whole mile driven beyond the included allowance standing on the rental"
      damage_lines: "where a damage recharge stands on the rental, no mile beyond the allowance is carried free"
      rate_day_lines_held: "where no damage recharge stands on the rental and rental day lines stand for the grace day threshold of days or more, the long hire grace miles are carried free"
      grace_miles: "where no damage recharge stands on the rental and rental day lines stand for the grace day threshold of days or more, the long hire grace miles are carried free; where no damage recharge stands on the rental and rental day lines stand for fewer days than that, the short hire grace miles are carried free; where a damage recharge stands on the rental, no mile beyond the allowance is carried free."
      chargeable_miles: "taking the grace miles off the miles beyond the allowance, never below nothing"
      excess_rate: "an overage at or above the heavy overage threshold of miles is charged at the heavy overage rate; an overage at or above the light overage threshold but below the heavy one is charged at the light overage rate; an overage below the light overage threshold is charged at the rate class's own excess rate per mile."
      latest_use_date: "where the settlement is raised on a reading taken after the booked return"
      late_reading_days: "an overage at or above the heavy overage threshold read after the booked return day carries the heavy overage administration charge"
      overage_admin: "an overage at or above the heavy overage threshold read after the booked return day carries the heavy overage administration charge; an overage at or above the light overage threshold read after the booked return day carries the light overage administration charge; in every other case no administration charge is added."
      club_tier_b: "an active membership at Wanderlane Titanium or Wanderlane Ambassador"
      club_drive_accruals: "with at least the club driving threshold of rental accruals on its points ledger over the last twenty-four months"
      club_relief_pct: "an active membership at Wanderlane Titanium or Wanderlane Ambassador with at least the club driving threshold of rental accruals on its points ledger over the last twenty-four months relieves the settlement at the top club relief rate; an active membership at Wanderlane Gold or Wanderlane Platinum with at least that many rental accruals relieves it at the middle club relief rate; any other membership, or none, relieves nothing."
      result: "The settlement is worked out by taking the grace miles off the miles beyond the allowance, never below nothing, charging what is left at the rate for each chargeable mile, adding the administration charge once to that product rather than to any earlier step, and relieving the sum of the two once; the result is rounded to two decimal places only at the end and never at an intermediate step."
    factors:
      - id: overage_rate_band
        effect: parameter
        decides: excess_rate
        bindings: [grant_total, chargeable_miles, excess_rate]
        ladder:
          - when: "the overage stands at or above the heavy overage threshold of miles"
            value: "K('heavy_overage_rate_usd')"
          - when: "the overage stands at or above the light overage threshold of miles but below the heavy one"
            value: "K('light_overage_rate_usd')"
          - when: "otherwise"
