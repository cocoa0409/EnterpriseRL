extended_policies:
  - id: drive_ext_additional_driver_charge
    base_policy_refs: [drive_rate_and_extras, drive_club_and_corporate_interaction]
    overwrite:
      - base_policy: drive_rate_and_extras
        superseded_clause: >-
          Additional drivers beyond the class's free count are charged per driver per rental day, and a driver never named on the agreement is not insured at all.
        replaced_by: >-
          The additional driver charge on an agreement is the rate class's additional driver fee for each named driver beyond the free count carried by the rate class, taken for every booked rental day of the agreement, and the total is rounded to two decimal places.
    trigger: state_due
    subject: [drive_extras_charge]
    computes: additional_driver_charge_usd
    target_tool: charge_additional_driver_79b211ed
    params:
      top_tier_free_drivers: 3
      mid_tier_free_drivers: 2
      top_tier_qualifying_points: 20000
      mid_tier_qualifying_points: 6000
      long_hire_threshold_days: 7
      extended_hire_threshold_days: 14
      long_hire_charged_day_cap: 14
      long_hire_extra_day_weight: 0.5
      high_value_driver_fee_per_day_usd: 16.0
      waivered_driver_fee_per_day_usd: 9.5
      early_named_days: 21
      standard_named_days: 7
      early_named_relief_pct: 15
      standard_named_relief_pct: 5
      further_driver_weight_long: 0.5
      further_driver_weight_short: 0.75
    rule: >-
      The additional driver charge on an agreement is the rate class's additional driver fee for each named driver beyond
      the free count carried by the rate class, taken for every booked rental day of the agreement, and the total is
      rounded to two decimal places. The number of drivers carried free of charge is decided by the traveller club
      membership standing in the renter's name: an active membership at Wanderlane Platinum, Wanderlane Titanium or
      Wanderlane Ambassador that has accrued at least the top qualifying threshold of qualifying points in the last
      twelve months carries the top tier free driver count; an active membership at Wanderlane Gold or Wanderlane Silver
      that has accrued at least the middle qualifying threshold of qualifying points in the last twelve months carries
      the middle tier free driver count; a renter in any other standing is carried the free count the rate class itself
      states. The days the fee is charged for are counted by the length of the agreement: an agreement booking fourteen
      or more rental days is charged for the first fourteen days and for no day beyond them; an agreement booking seven
      to thirteen rental days is charged in full for the first seven days and at half a day for each further booked day;
      an agreement booking fewer than seven rental days is charged for every booked rental day. The fee taken for each
      chargeable day is decided by the protection standing on the agreement together with the vehicle booked: where a
      collision damage waiver line stands for every booked rental day and the vehicle booked is a premium, luxury or van
      class, the high value driver fee applies; where a collision damage waiver line stands for every booked rental day
      and the vehicle booked is any other class, the waivered driver fee applies; where the waiver does not stand for
      every booked rental day, the rate class's own additional driver fee applies. Naming the drivers well ahead of
      collection relieves the charge on a leisure agreement: an agreement booked twenty-one or more days before the
      scheduled collection and carrying no corporate programme reference is relieved at the early naming rate; an
      agreement booked seven to twenty days before the scheduled collection and carrying no corporate programme
      reference is relieved at the standard naming rate; an agreement booked closer than seven days to collection, or
      carrying a corporate programme reference, is relieved at nothing. Where more than one driver is chargeable the
      chargeable drivers are weighted rather than counted alike: on an agreement booking seven or more rental days the
      first chargeable driver is taken at the whole per-day fee and each further chargeable driver at half of it; on an
      agreement booking fewer than seven rental days the first chargeable driver is taken at the whole per-day fee and
      each further chargeable driver at three quarters of it; where one driver or none is chargeable each chargeable
      driver is taken at the whole per-day fee. The charge is worked out by multiplying the weighted chargeable drivers
      by the days charged for and by the fee for each chargeable day, and the naming relief is applied once to that
      product rather than to any earlier step; the result is rounded to two decimal places only at the end and never at
      an intermediate step.
    prerequisite: []
    cross_category:
      - category: club
        as: history
        reads: [variant_name, club_points_entries.points_delta]
        note: the traveller club membership held and its qualifying points over the last twelve months decide how many additional drivers the agreement carries free of charge
    compute:
      - club_tier: "CFIELD('club', 'variant_name', status='active')"
      - club_qualifying_12m: "XSUM('club', 'club_points_entries', 'points_delta', within_months=12, date_field='posted_date', points_kind='qualifying')"
      - free_driver_count: "K('top_tier_free_drivers') if ((club_tier == 'Wanderlane Platinum' or club_tier == 'Wanderlane Titanium' or club_tier == 'Wanderlane Ambassador') and club_qualifying_12m >= K('top_tier_qualifying_points')) else (K('mid_tier_free_drivers') if ((club_tier == 'Wanderlane Gold' or club_tier == 'Wanderlane Silver') and club_qualifying_12m >= K('mid_tier_qualifying_points')) else P('additional_driver_included_count'))"
      - chargeable_drivers: "MX(0, F('additional_drivers_count') - free_driver_count)"
      - booked_days: "DAYS(F('pickup_at'), F('dropoff_at'))"
      - charged_days: "K('long_hire_charged_day_cap') if booked_days >= K('extended_hire_threshold_days') else ((K('long_hire_threshold_days') + (booked_days - K('long_hire_threshold_days')) * K('long_hire_extra_day_weight')) if booked_days >= K('long_hire_threshold_days') else booked_days)"
      - cdw_days: "COUNT('drive_rental_entries', charge_category='collision_damage_waiver')"
      - fee_per_day: "K('high_value_driver_fee_per_day_usd') if (cdw_days >= booked_days and (F('vehicle_class') == 'premium' or F('vehicle_class') == 'luxury' or F('vehicle_class') == 'van')) else (K('waivered_driver_fee_per_day_usd') if cdw_days >= booked_days else P('additional_driver_fee_per_day_usd'))"
      - advance_days: "DAYS(F('booked_date'), F('pickup_at'))"
      - advance_relief_pct: "K('early_named_relief_pct') if (advance_days >= K('early_named_days') and F('corporate_program_id') == '') else (K('standard_named_relief_pct') if (advance_days >= K('standard_named_days') and F('corporate_program_id') == '') else 0)"
      - driver_weight_total: "(1 + (chargeable_drivers - 1) * K('further_driver_weight_long')) if (chargeable_drivers >= 2 and DAYS(F('pickup_at'), F('dropoff_at')) >= K('long_hire_threshold_days')) else ((1 + (chargeable_drivers - 1) * K('further_driver_weight_short')) if chargeable_drivers >= 2 else chargeable_drivers)"
      - result: "RND(driver_weight_total * charged_days * fee_per_day * (1 - advance_relief_pct / 100), 2)"
    compute_basis:
      club_tier: "The number of drivers carried free of charge is decided by the traveller club membership standing in the renter's name"
      club_qualifying_12m: "that has accrued at least the top qualifying threshold of qualifying points in the last twelve months"
      free_driver_count: "an active membership at Wanderlane Platinum, Wanderlane Titanium or Wanderlane Ambassador that has accrued at least the top qualifying threshold of qualifying points in the last twelve months carries the top tier free driver count; an active membership at Wanderlane Gold or Wanderlane Silver that has accrued at least the middle qualifying threshold of qualifying points in the last twelve months carries the middle tier free driver count; a renter in any other standing is carried the free count the rate class itself states."
      chargeable_drivers: "the rate class's additional driver fee for each named driver beyond the free count carried by the rate class"
      booked_days: "The days the fee is charged for are counted by the length of the agreement"
      charged_days: "an agreement booking fourteen or more rental days is charged for the first fourteen days and for no day beyond them; an agreement booking seven to thirteen rental days is charged in full for the first seven days and at half a day for each further booked day; an agreement booking fewer than seven rental days is charged for every booked rental day."
      cdw_days: "where a collision damage waiver line stands for every booked rental day"
      fee_per_day: "where a collision damage waiver line stands for every booked rental day and the vehicle booked is a premium, luxury or van class, the high value driver fee applies; where a collision damage waiver line stands for every booked rental day and the vehicle booked is any other class, the waivered driver fee applies; where the waiver does not stand for every booked rental day, the rate class's own additional driver fee applies."
      advance_days: "an agreement booked twenty-one or more days before the scheduled collection and carrying no corporate programme reference is relieved at the early naming rate"
      advance_relief_pct: "an agreement booked twenty-one or more days before the scheduled collection and carrying no corporate programme reference is relieved at the early naming rate; an agreement booked seven to twenty days before the scheduled collection and carrying no corporate programme reference is relieved at the standard naming rate; an agreement booked closer than seven days to collection, or carrying a corporate programme reference, is relieved at nothing."
      driver_weight_total: "on an agreement booking seven or more rental days the first chargeable driver is taken at the whole per-day fee and each further chargeable driver at half of it; on an agreement booking fewer than seven rental days the first chargeable driver is taken at the whole per-day fee and each further chargeable driver at three quarters of it; where one driver or none is chargeable each chargeable driver is taken at the whole per-day fee."
      result: "The charge is worked out by multiplying the weighted chargeable drivers by the days charged for and by the fee for each chargeable day, and the naming relief is applied once to that product rather than to any earlier step; the result is rounded to two decimal places only at the end and never at an intermediate step."
    factors:
      - id: club_free_driver_allowance
        effect: parameter
        decides: free_driver_count
        bindings: [club_tier, club_qualifying_12m, free_driver_count]
        ladder:
          - when: "an active traveller club membership at Wanderlane Platinum, Wanderlane Titanium or Wanderlane Ambassador and at least the top qualifying threshold of qualifying points accrued in the last twelve months"
            value: "K('top_tier_free_drivers')"
          - when: "an active traveller club membership at Wanderlane Gold or Wanderlane Silver and at least the middle qualifying threshold of qualifying points accrued in the last twelve months"
            value: "K('mid_tier_free_drivers')"
          - when: "otherwise"
            value: "P('additional_driver_included_count')"
        baseline:
          free_driver_count: "P('additional_driver_included_count')"
        evidence: [cross_category, history]
        cross_difficulty: club
      - id: charged_day_length_basis
        effect: method
        decides: charged_days
        bindings: [booked_days, charged_days]
        ladder:
          - when: "the agreement books fourteen or more rental days"
            method: "the fee is charged for the first fourteen days and for no day beyond them"
          - when: "the agreement books seven to thirteen rental days"
            method: "the fee is charged in full for the first seven days and at half a day for each further booked day"
          - when: "otherwise"
            method: "the fee is charged for every booked rental day"
        baseline:
          charged_days: "booked_days"
        evidence: [date]
        cross_difficulty: null
      - id: waiver_backed_driver_fee
        effect: parameter
        decides: fee_per_day
        bindings: [cdw_days, fee_per_day]
        ladder:
          - when: "a collision damage waiver line stands for every booked rental day and the vehicle booked is a premium, luxury or van class"
            value: "K('high_value_driver_fee_per_day_usd')"
          - when: "a collision damage waiver line stands for every booked rental day and the vehicle booked is any other class"
            value: "K('waivered_driver_fee_per_day_usd')"
          - when: "otherwise"
            value: "P('additional_driver_fee_per_day_usd')"
        baseline:
          fee_per_day: "P('additional_driver_fee_per_day_usd')"
        evidence: [history]
        cross_difficulty: null
      - id: advance_naming_relief
        effect: parameter
        decides: advance_relief_pct
        bindings: [advance_days, advance_relief_pct]
        ladder:
          - when: "the agreement was booked twenty-one or more days before the scheduled collection and carries no corporate programme reference"
            value: "K('early_named_relief_pct')"
          - when: "the agreement was booked seven to twenty days before the scheduled collection and carries no corporate programme reference"
            value: "K('standard_named_relief_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          advance_relief_pct: "0"
        evidence: [date]
        cross_difficulty: null
      - id: multi_driver_weighting
        effect: method
        decides: driver_weight_total
        bindings: [chargeable_drivers, driver_weight_total]
        ladder:
          - when: "two or more drivers are chargeable and the agreement books seven or more rental days"
            method: "the first chargeable driver is taken at the whole per-day fee and each further chargeable driver at half of it"
          - when: "two or more drivers are chargeable and the agreement books fewer than seven rental days"
            method: "the first chargeable driver is taken at the whole per-day fee and each further chargeable driver at three quarters of it"
          - when: "otherwise"
            method: "each chargeable driver is taken at the whole per-day fee"
        baseline:
          driver_weight_total: "chargeable_drivers"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        The additional driver charge on an agreement is the rate class's additional driver fee for each named driver
        beyond the free count carried by the rate class, taken for every booked rental day of the agreement, and the
        total is rounded to two decimal places.
      params: [additional_driver_fee_per_day_usd, additional_driver_included_count]
    inputs:
      history:
        - {table: drive_rental_entries, aggregate: count, field: drive_entry_id, within_months: null, filters: {charge_category: collision_damage_waiver}}
        - {category: club, table: club_points_entries, aggregate: sum, field: points_delta, within_months: 12, filters: {points_kind: qualifying}}
      cross_category: [club]
  - id: drive_ext_release_charge
    base_policy_refs: [drive_cancellation]
    overwrite:
      - base_policy: drive_cancellation
        superseded_clause: >-
          Outside it the charge is read off the rate class's cancellation ladder by how many whole days lie between the cancellation and the scheduled collection; where the ladder yields nothing the class's flat cancellation charge applies instead, and the two are never added.
        replaced_by: >-
          The share withheld is decided by how many whole days lie between the day the rental is given up and the scheduled collection day: fourteen or more whole days withhold the distant notice share; three to thirteen whole days withhold the near notice share; fewer than three whole days withhold the standard release share.
    trigger: on_request
    subject: [drive_cancellation_charge]
    computes: release_charge_usd
    target_tool: release_rental_booking_4b632ce9
    params:
      distant_notice_days: 14
      near_notice_days: 3
      distant_notice_share_pct: 25
      near_notice_share_pct: 50
      standard_release_share_pct: 100
      equipment_return_notice_days: 3
      part_equipment_return_share: 0.5
      credit_disruption_relief_pct: 40
      cash_disruption_relief_pct: 20
      member_relief_high_pct: 15
      member_relief_low_pct: 5
      member_relief_years: 2
    rule: >-
      The release charge withheld when a renter gives up a confirmed rental outside the rate class's free-cancellation
      term is the whole of the money standing on the rental's ledger at the moment the rental is given up, taken at the
      standard release share, and the result is rounded to two decimal places. The release charge is fixed only after
      the rental's ledger carries the additional driver charge owed for the drivers named on the agreement. The
      free-cancellation term this scope refers to runs forward from the moment the supplier confirmed the renter's
      booking, and never backwards from the scheduled collection moment. The share
      withheld is decided by how many whole days lie between the day the rental is given up and the scheduled collection
      day: fourteen or more whole days withhold the distant notice share; three to thirteen whole days withhold the near
      notice share; fewer than three whole days withhold the standard release share. The money the share acts on is read
      off the rental's ledger in one of three ways: where the ledger carries no prepayment and no rental day has yet
      been priced, the share acts on the money standing on the ledger with the agency service fee left out of it,
      because that fee is not returned and is not withheld from twice; where the ledger carries a prepayment and no
      rental day has yet been priced, the share acts on the prepayment taken, which is the money a cancellation charge
      is withheld from; and in every other case the share acts on the whole of the money standing on the ledger.
      Equipment sold for a rental that is never collected is returned before the share is taken: where equipment lines
      stand on the ledger and the rental is given up three or more whole days before the scheduled collection, every
      equipment line is returned in full and is taken out of the money the share acts on; where equipment lines stand on
      the ledger and the rental is given up fewer than three whole days before the scheduled collection, the part
      equipment return share of those lines is returned and taken out; where no equipment line stands on the ledger,
      nothing is returned. A rental given up because the journey it was booked around has itself fallen away is
      relieved: where the renter holds an air booking standing at cancelled or refunded and the value of that booking
      came back as a travel credit, the credit disruption relief applies; where the renter holds an air booking standing
      at cancelled or refunded and the value came back to the original form of payment, the cash disruption relief
      applies; where the renter holds no such air booking, no disruption relief applies. A traveller club membership
      relieves the charge further: an active membership at Wanderlane Gold, Wanderlane Platinum, Wanderlane Titanium or
      Wanderlane Ambassador held for at least the membership relief term relieves the charge at the high membership
      relief rate; an active membership at Wanderlane Blue or Wanderlane Silver held for at least the membership relief
      term relieves it at the low membership relief rate; a membership held for less than that term, or none at all,
      relieves nothing. The charge is worked out by taking the equipment returned out of the money the share acts on,
      applying the share once to what is left, then applying the disruption relief to that amount and the membership
      relief to the amount the disruption relief leaves, so that the two reliefs act one after the other and are never
      added together into one rate; the result is rounded to two decimal places only at the end and never at an
      intermediate step.
