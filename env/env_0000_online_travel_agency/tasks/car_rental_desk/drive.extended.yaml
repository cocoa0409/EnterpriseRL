  - id: drive_ext_included_mileage_grant
    base_policy_refs: [drive_mileage]
    overwrite:
      - base_policy: drive_mileage
        superseded_clause: >-
          Every other class grants its included miles for each booked rental day at collection, in one grant covering the whole rental rather than day by day.
        replaced_by: >-
          The included mileage granted on a rental is the rate class's included miles for each booked rental day, placed on the rental in one grant covering the whole rental, and the grant is counted in whole miles.
    trigger: state_due
    subject: [drive_mileage_grant]
    computes: miles_granted
    target_tool: grant_included_mileage_444a2a24
    params:
      long_hire_threshold_days: 7
      long_hire_taper_share: 0.5
      airport_transfer_miles: 90
      airport_return_miles: 140
      full_touring_miles: 260
      part_touring_miles: 140
      touring_included_miles_per_day: 220
      short_break_included_miles_per_day: 165
      package_long_nights: 7
      multi_driver_touring_miles: 180
      single_driver_touring_miles: 90
    rule: >-
      The included mileage granted on a rental is the rate class's included miles for each booked rental day, placed on
      the rental in one grant covering the whole rental, and the grant is counted in whole miles. The days the allowance
      is granted for are read off the rental's own ledger: where an extra day line stands on the ledger, the allowance is
      granted for every rental day and extra day charged on it; where no extra day line stands and the ledger carries
      rental day lines for fewer days than the agreement books, the allowance is granted for the rental days actually
      charged; in every other case the allowance is granted for every booked rental day. The miles allowed for each of
      those days are decided by the holiday the hire belongs to: where the renter holds a vacation package standing at
      travelling or completed that runs the long package term of nights or more, each day carries the touring miles
      allowance; where the renter holds a vacation package standing at travelling or completed that runs fewer nights
      than that, each day carries the short break miles allowance; where the renter holds no such package, each day
      carries the rate class's own included miles. Those per-day miles are totalled over the days granted for in one of
      three ways: where the agreement's booked period runs seven or more days, it is the per-day miles for the first
      seven days granted for and half of the per-day miles for each further day granted for; where the booked period
      runs two to six days, it is the per-day miles for every day granted for and a further half day's miles for the
      return leg; where the booked period runs a single day, it is the per-day miles for that day. Collection at an airport branch adds a transfer allowance: where an
      airport surcharge line stands on the ledger and the vehicle is returned to a branch other than the one it was
      collected from, the one-way airport transfer miles are added; where an airport surcharge line stands and the
      vehicle is returned to the branch it was collected from, the return airport transfer miles are added; where no
      airport surcharge line stands, nothing is added on that account. Touring equipment sold on the agreement adds a
      mountain allowance: where both a ski rack line and a snow chains line stand on the ledger, the full touring miles
      are added; where one of those two lines stands but not both, the part touring miles are added; where neither
      stands, nothing is added on that account. Drivers named on the agreement add a sharing allowance: where two or more
      additional driver lines stand on the ledger and the allowance is granted for seven or more days, the multi driver
      touring miles are added; where one additional driver line stands and the allowance is granted for seven or more
      days, the single driver touring miles are added; in every other case nothing is added on that account. The grant is
      the day total and the three allowances added together, taken as whole miles at the end and at no intermediate step.
    prerequisite: []
    cross_category:
      - category: bundle
        as: branch
        reads: [status, duration_nights]
        note: whether the renter holds a vacation package under way or completed, and how many nights it runs, decides the miles allowed for each day of the hire
    compute:
      - rate_day_lines: "COUNT('drive_rental_entries', date_field='posted_date', charge_category='rental_rate')"
      - extra_day_lines: "COUNT('drive_rental_entries', date_field='posted_date', charge_category='extra_day')"
      - granted_days: "(rate_day_lines + extra_day_lines) if extra_day_lines > 0 else (rate_day_lines if rate_day_lines < F('rental_days') else F('rental_days'))"
      - bundle_status: "CFIELD('bundle', 'status')"
      - bundle_nights: "CFIELD('bundle', 'duration_nights')"
      - included_miles_per_day: "K('touring_included_miles_per_day') if ((bundle_status == 'travelling' or bundle_status == 'completed') and bundle_nights >= K('package_long_nights')) else (K('short_break_included_miles_per_day') if ((bundle_status == 'travelling' or bundle_status == 'completed') and bundle_nights < K('package_long_nights')) else P('included_mileage_per_day'))"
      - booked_span_days: "DAYS(F('pickup_at'), F('dropoff_at'))"
      - base_allowance: "(K('long_hire_threshold_days') * included_miles_per_day + (granted_days - K('long_hire_threshold_days')) * included_miles_per_day * K('long_hire_taper_share')) if booked_span_days >= K('long_hire_threshold_days') else ((granted_days * included_miles_per_day + included_miles_per_day * K('long_hire_taper_share')) if booked_span_days >= 2 else granted_days * included_miles_per_day)"
      - airport_lines: "COUNT('drive_rental_entries', date_field='posted_date', charge_category='airport_surcharge')"
      - airport_allowance: "K('airport_transfer_miles') if (airport_lines > 0 and F('dropoff_location_code') != F('pickup_location_code')) else (K('airport_return_miles') if (airport_lines > 0 and F('dropoff_location_code') == F('pickup_location_code')) else 0)"
      - ski_rack_lines: "COUNT('drive_rental_entries', date_field='posted_date', charge_category='ski_rack')"
      - snow_chain_lines: "COUNT('drive_rental_entries', date_field='posted_date', charge_category='snow_chains')"
      - touring_allowance: "K('full_touring_miles') if (ski_rack_lines > 0 and snow_chain_lines > 0) else (K('part_touring_miles') if (ski_rack_lines > 0 or snow_chain_lines > 0) else 0)"
      - driver_lines: "COUNT('drive_rental_entries', date_field='posted_date', charge_category='additional_driver')"
      - driver_allowance: "K('multi_driver_touring_miles') if (driver_lines >= 2 and granted_days >= K('long_hire_threshold_days')) else (K('single_driver_touring_miles') if (driver_lines >= 1 and granted_days >= K('long_hire_threshold_days')) else 0)"
      - result: "int(RND(base_allowance + airport_allowance + touring_allowance + driver_allowance, 0))"
    compute_basis:
      rate_day_lines: "where no extra day line stands and the ledger carries rental day lines for fewer days than the agreement books, the allowance is granted for the rental days actually charged"
      extra_day_lines: "where an extra day line stands on the ledger, the allowance is granted for every rental day and extra day charged on it"
      granted_days: "where an extra day line stands on the ledger, the allowance is granted for every rental day and extra day charged on it; where no extra day line stands and the ledger carries rental day lines for fewer days than the agreement books, the allowance is granted for the rental days actually charged; in every other case the allowance is granted for every booked rental day."
      bundle_status: "where the renter holds a vacation package standing at travelling or completed that runs the long package term of nights or more, each day carries the touring miles allowance"
      bundle_nights: "that runs the long package term of nights or more"
      included_miles_per_day: "where the renter holds a vacation package standing at travelling or completed that runs the long package term of nights or more, each day carries the touring miles allowance; where the renter holds a vacation package standing at travelling or completed that runs fewer nights than that, each day carries the short break miles allowance; where the renter holds no such package, each day carries the rate class's own included miles."
      booked_span_days: "where the agreement's booked period runs seven or more days"
      base_allowance: "where the agreement's booked period runs seven or more days, it is the per-day miles for the first seven days granted for and half of the per-day miles for each further day granted for; where the booked period runs two to six days, it is the per-day miles for every day granted for and a further half day's miles for the return leg; where the booked period runs a single day, it is the per-day miles for that day."
      airport_lines: "where an airport surcharge line stands on the ledger and the vehicle is returned to a branch other than the one it was collected from, the one-way airport transfer miles are added"
      airport_allowance: "where an airport surcharge line stands on the ledger and the vehicle is returned to a branch other than the one it was collected from, the one-way airport transfer miles are added; where an airport surcharge line stands and the vehicle is returned to the branch it was collected from, the return airport transfer miles are added; where no airport surcharge line stands, nothing is added on that account."
      ski_rack_lines: "where both a ski rack line and a snow chains line stand on the ledger, the full touring miles are added"
      snow_chain_lines: "where one of those two lines stands but not both, the part touring miles are added"
      touring_allowance: "where both a ski rack line and a snow chains line stand on the ledger, the full touring miles are added; where one of those two lines stands but not both, the part touring miles are added; where neither stands, nothing is added on that account."
      driver_lines: "where two or more additional driver lines stand on the ledger and the allowance is granted for seven or more days, the multi driver touring miles are added"
      driver_allowance: "where two or more additional driver lines stand on the ledger and the allowance is granted for seven or more days, the multi driver touring miles are added; where one additional driver line stands and the allowance is granted for seven or more days, the single driver touring miles are added; in every other case nothing is added on that account."
      result: "The grant is the day total and the three allowances added together, taken as whole miles at the end and at no intermediate step."
    factors:
      - id: granted_day_basis
        effect: method
        decides: granted_days
        bindings: [rate_day_lines, extra_day_lines, granted_days]
        ladder:
          - when: "an extra day line stands on the rental's ledger"
