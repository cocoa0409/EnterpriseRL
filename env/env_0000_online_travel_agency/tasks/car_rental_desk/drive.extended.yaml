        ladder:
          - when: "no damage recharge stands on the rental and rental day lines stand for the grace day threshold of days or more"
            value: "K('long_hire_grace_miles')"
          - when: "no damage recharge stands on the rental and rental day lines stand for fewer days than the grace day threshold"
