      - disruption_relief_pct: "K('credit_disruption_relief_pct') if ((air_status == 'cancelled' or air_status == 'refunded') and air_refund_form == 'travel_credit') else (K('cash_disruption_relief_pct') if ((air_status == 'cancelled' or air_status == 'refunded') and air_refund_form == 'original_payment') else 0)"
