category: stay
display_name: Hotel Rate Plans
binding:
  holding_table: stay_reservations
  event_tables:
  - stay_folio_entries
  intake_tables:
  - stay_change_requests
  status_field: status
  variant_field: variant_name
  quantity_fields:
    folio_balance_usd: stay_folio
    resort_credit_balance_usd: resort_credit
lifecycle:
  states:
  - reserved
  - confirmed
  - checked_in
  - checked_out
  - cancelled
  - no_show
  - closed
  transitions:
  - from: reserved
    to: confirmed
    by: system
    means: The property accepts the reservation and the deposit or prepayment is taken.
  - from: reserved
    to: cancelled
    by: agent
    means: An unconfirmed reservation is released before any money changes hands.
  - from: confirmed
    to: checked_in
    by: system
    means: The guest arrives at the property and the stay begins.
  - from: confirmed
    to: cancelled
    by: user
    means: The guest confirms cancellation of their own reservation.
  - from: confirmed
    to: no_show
    by: system
    means: The guest never arrives and the property releases the room.
  - from: checked_in
    to: checked_out
    by: system
    means: The guest departs and the folio is closed off.
  - from: checked_out
    to: closed
    by: system
    means: The settled stay is archived.
  - from: cancelled
    to: closed
    by: system
    means: The cancelled reservation is archived once any penalty and refund have settled.
  - from: no_show
    to: closed
    by: system
    means: The no-show is archived once the penalty has settled.
accounts:
- key: stay_folio
  unit: USD
  meaning: 'Net money charged to the guest for this stay: room nights, deposits, taxes, mandatory fees, optional extras and penalties credit the account, and payouts to the original form of payment debit
    it.'
- key: resort_credit
  unit: USD
  meaning: 'Property credit included in the rate plan and held against this reservation: a grant at check-in credits the account and each use at the property debits it.'
parameter_schema:
  agency_service_fee_usd: Agency booking service fee charged once per reservation, in USD.
  prepayment_required: Whether the whole stay is taken at booking rather than at the property.
  prepayment_pct: Percentage of the room total taken at booking.
  deposit_nights: Number of room nights taken as a deposit where no full prepayment is required.
  free_cancellation_hours_before_checkin: Hours before the arrival date by which a cancellation carries no penalty.
  cancellation_penalty_nights: Room nights withheld as a penalty for a late cancellation.
  cancellation_penalty_pct: Percentage of the room total withheld where the penalty is expressed as a share rather than as nights.
  cancellation_ladder_pct: Cancellation penalty as a share of the room total by how far ahead of arrival the cancellation lands; a ladder keyed by days before arrival.
  no_show_penalty_nights: Room nights withheld when the guest never arrives.
  no_show_penalty_pct: Percentage of the room total withheld on a no-show where the penalty is expressed as a share.
  refund_form: 'Form value is returned in on cancellation: none, property_credit or original_payment.'
  refund_processing_days: Business days the settlement of an approved refund takes.
  modification_allowed: Whether the stay dates may be moved after the reservation is confirmed.
  date_change_fee_usd: Fee to move the stay dates, in USD.
  max_modifications: Maximum number of date changes permitted on one reservation.
  name_change_allowed: Whether the lead guest may be replaced by another person.
  name_change_fee_usd: Fee to replace the lead guest, in USD.
  min_nights: Minimum number of nights the rate plan may be booked for.
  max_nights: Maximum number of nights the rate plan may be booked for.
  advance_purchase_days: Minimum calendar days between booking and arrival for the rate plan to be sold.
  booking_window_days: Furthest ahead of arrival, in calendar days, that the rate plan may be booked.
  max_rooms_per_reservation: Largest number of rooms one reservation may hold before group terms apply.
  group_min_rooms: Number of rooms from which the group desk takes the booking instead.
  extra_adult_fee_per_night_usd: Charge per additional adult per night beyond the rate's standard occupancy, in USD.
  extra_child_fee_per_night_usd: Charge per additional child per night beyond the free age limit, in USD.
  child_age_free_limit: Age up to and including which a child stays free in the parents' room.
  crib_fee_per_night_usd: Charge for a cot per night, in USD.
  rollaway_fee_per_night_usd: Charge for a rollaway bed per night, in USD.
  pet_fee_per_stay_usd: Charge for a pet for the whole stay, in USD.
  pet_weight_limit_kg: Heaviest pet the rate plan accepts, in kilograms.
  breakfast_included: Whether breakfast is included in the nightly rate.
  breakfast_fee_per_person_usd: Charge for breakfast per person per day when it is not included, in USD.
  dinner_included: Whether dinner is included in the nightly rate.
  all_inclusive: Whether meals, soft drinks and listed activities are all included in the nightly rate.
  resort_fee_per_night_usd: Mandatory property facility fee per room per night, in USD.
  resort_fee_waived: Whether the property facility fee is waived on this rate plan.
  occupancy_tax_pct: State or provincial occupancy tax applied to the room total, as a percentage.
  city_tax_pct: City or tourism tax applied to the room total, as a percentage.
  parking_fee_per_night_usd: Self-parking charge per room per night, in USD.
  wifi_included: Whether in-room internet is included in the nightly rate.
  wifi_fee_per_day_usd: Charge for in-room internet per day when it is not included, in USD.
  early_checkin_fee_usd: Charge for arrival before the property's standard check-in time, in USD.
  late_checkout_fee_usd: Charge for departure after the property's standard checkout time, in USD.
  guaranteed_late_checkout: Whether a late departure is guaranteed rather than offered subject to availability.
  room_upgrade_eligible: Whether the room may be upgraded after booking.
  room_upgrade_fee_per_night_usd: Charge per night for an accepted room upgrade, in USD.
  resort_credit_per_stay_usd: Property credit granted at check-in for use on site, in USD.
  resort_credit_validity_days: Calendar days from check-in within which the property credit must be spent.
  resort_credit_transferable: Whether the property credit may be spent by a companion in the same room.
  spa_discount_pct: Percentage discount on spa treatments booked during the stay.
  best_rate_guarantee_allowed: Whether a lower public rate found elsewhere is settled rather than refused.
  best_rate_claim_window_hours: Hours after booking within which a lower public rate may be claimed.
  best_rate_bonus_usd: Goodwill amount added to an upheld best-rate claim, in USD.
  club_points_earn_rate_pct: Percentage of the room total that accrues as traveller club points.
  tier_qualifying_points_multiplier: Multiplier applied to room spend when counting tier-qualifying points.
  corporate_rate_eligible: Whether a corporate travel programme rate may be applied to this rate plan.
  overbooking_relocation_allowance_usd: Amount reimbursed per room per night when the property cannot honour the reservation, in USD.
  currency_conversion_markup_pct: Percentage added when the guest elects to be charged in a currency other than the property's own.
