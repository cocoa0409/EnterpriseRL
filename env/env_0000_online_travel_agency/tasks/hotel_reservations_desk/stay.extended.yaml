- id: stay_evt_property_notice
  subject:
  - stay_property_notice
  rule: Where the property advises that it cannot honour the reservation as booked, the guest is relocated to a comparable property at the property's own cost and the rate plan's relocation allowance is
    reimbursed per room per night. A relocation allowance is paid only when the property desk has already recorded an approved overbooking relocation against this reservation. The allowance covers the difference
    in room rate, the journey to the substitute property and one telephone call, and is paid whatever the rate plan's refund form. A guest who prefers to cancel rather than be relocated is cancelled with
    no penalty on any rate plan, because the failure is the property's. Several notices about the same reservation are not added together; one relocation gives rise to one allowance however many rooms are
    advised, and the allowance is multiplied by rooms and nights rather than by notices. A notice withdrawn by the property before arrival gives rise to no allowance at all.
