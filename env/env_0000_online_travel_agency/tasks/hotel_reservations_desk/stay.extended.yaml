- id: stay_modification
  subject:
  - stay_guest_amend
  rule: 'The stay dates may be moved only on a rate plan that allows modification, within its ceiling on the number of moves, and the new dates are re-priced at the plan''s rate for those dates. A move
    carries the plan''s date-change fee, and the difference in room rate is collected or returned in addition to it; a move is never used to obtain a lower rate without the difference being settled. The
    lead guest may be replaced only on a plan that allows a name change, against the plan''s name-change fee, and the replacement guest inherits the reservation exactly as it stands. Correcting the contact
    address or contact number is free on every plan and is not a name change. A plan that allows no modification refuses the move outright rather than charging for it, and the guest''s only alternative
    is cancellation on the plan''s own terms. A move requested after the arrival date has passed is not a modification at all: the nights already gone are treated as stayed.'
