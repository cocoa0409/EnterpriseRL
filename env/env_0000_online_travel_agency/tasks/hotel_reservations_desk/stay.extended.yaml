- id: stay_best_rate_guarantee
  subject:
  - stay_refund_payout
  rule: Where the identical room at the identical property on the identical dates is publicly offered for less within the claim window of the rate plan booked, the difference is settled to the card together
    with the plan's goodwill amount. A best-rate settlement is raised only when no best-rate settlement has already been raised against the same reservation. The window is measured from the moment the reservation
    was booked, and the comparison is made against a publicly bookable rate in the same currency with the same board basis and the same cancellation terms. A plan that does not carry the guarantee refuses
    the claim outright, and no credit is offered in its place. The settlement is raised against the original room line and never against taxes, the facility fee or the agency service fee. A claim raised
    after the guest has moved the dates is refused, because the reservation compared is no longer the reservation booked.
