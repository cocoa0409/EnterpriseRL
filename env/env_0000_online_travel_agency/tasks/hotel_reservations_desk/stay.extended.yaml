      exemption, rounded to the cent. The occupancy tax is worked out on a taxable base that may take
      in more than the room charge alone, and the city levy is carried with it on one line, no
      separate city line being raised for that night. Under the standard method the taxable base is the closing room charge
      alone, the occupancy rate is the rate plan's own occupancy tax rate, the city levy is the base
      city levy and the corporate exemption is nil. The occupancy tax for the night is the occupancy
      rate of the taxable base, rounded to the cent, and the city levy is added to that figure before
      the corporate exemption is taken off; the exemption is never applied to the occupancy tax
      alone.
    params: [base_city_levy_usd, occupancy_tax_pct]
  inputs:
    history:
    - {table: stay_folio_entries, aggregate: latest, field: amount_usd, within_months: null, filters: {charge_category: room_night}}
    - {table: stay_folio_entries, aggregate: count, field: stay_folio_entry_id, within_months: null, filters: {charge_category: extra_occupant}}
    - {category: biz, table: biz_billing_entries, aggregate: count, field: biz_entry_id, within_months: 12, filters: {charge_category: hotel_booking_fee}}
    cross_category: [biz]
- id: stay_ext_closing_breakfast_charge
  base_policy_refs: [stay_incidentals, stay_club_and_corporate_interaction]
  overwrite:
  - base_policy: stay_incidentals
    superseded_clause: >-
      Breakfast is charged per person per day on a plan that does not include it
    replaced_by: >-
      Breakfast for the departure morning is not charged for each person for each day in every case;
      the party the breakfast rate is charged for is fixed by the breakfast basis, which may be the
      lead guest alone, every adult declared on the reservation, or the room taken once whatever the
      party.
  trigger: state_due
  subject: [stay_incidental_charge]
  computes: breakfast_amount_usd
  target_tool: post_closing_breakfast_charge_10224aa5
  params:
    heavy_breakfast_usd: 60
    light_breakfast_usd: 40
    long_stay_breakfast_usd: 18
    mid_breakfast_usd: 21
    busy_breakfast_lines: 2
    standard_occupancy: 2
    room_breakfast_usd: 38
    long_breakfast_nights: 7
    mid_breakfast_nights: 4
    full_breakfast_relief_usd: 12
    part_breakfast_relief_usd: 6
    heavy_hotel_lines: 8
    light_hotel_lines: 3
    full_meal_allowance_usd: 20
    part_meal_allowance_usd: 10
  rule: >
    The closing breakfast charge is the breakfast posted for the departure morning of a stay that
    does not include breakfast in the nightly rate, and it is the breakfast basis less the length
    relief and less the programme allowance, rounded to the cent and never below nothing. Breakfast
    for the departure morning is not charged for each person for each day in every case; the party
    the breakfast rate is charged for is fixed by the breakfast basis, which may be the lead guest
    alone, every adult declared on the reservation, or the room taken once whatever the party. Under
    the standard method the breakfast rate is the rate plan's own breakfast amount for one person for
    one day, the breakfast basis is that rate charged for the lead guest alone, the length relief is nil
    and the programme allowance is nil.

    The breakfast rate is set by the breakfast already standing on the folio for the stay. Where the
    breakfast already standing comes to the heavy breakfast amount or more, the breakfast rate is the
    long stay breakfast amount; where it comes to the light breakfast amount or more but less than
    the heavy breakfast amount, the breakfast rate is the mid breakfast amount; and where it comes to
    less than the light breakfast amount, the breakfast rate is the rate plan's own breakfast amount.

    Where the folio carries the busy breakfast lines or more of breakfast and the reservation
    declares more adults than the standard occupancy, the breakfast basis is the breakfast rate
    charged for every adult declared on the reservation. Where the folio carries the busy breakfast
    lines or more of breakfast and the reservation declares the standard occupancy of adults or
    fewer, the breakfast basis is the room breakfast amount taken once for the room whatever the
    party. In every other case the breakfast basis is the breakfast rate charged for the lead guest
    alone.

    A length relief is taken off according to the nights the reservation covers, counted from the
    arrival date to the departure date. Where the reservation covers the long breakfast nights or
    more, the length relief is the full breakfast relief; where it covers the mid breakfast nights or
    more but fewer than the long breakfast nights, the length relief is the part breakfast relief;
    and where it covers fewer than the mid breakfast nights, the length relief is nil.

    A programme allowance is taken off where the reservation is made under a corporate travel
    programme whose expense integration is included. Where that programme has expense integration
    included and the hotel booking lines billed to it in the last twelve months number the heavy hotel lines or more, the programme allowance is the full meal allowance. Where that programme has
    expense integration included and those lines number the light hotel lines or more but fewer than
    the heavy hotel lines, the programme allowance is the part meal allowance. In every other case
    the programme allowance is nil. Only lines billed as a hotel booking fee are counted, and lines
    posted more than twelve months before the closing breakfast charge is worked out are not counted.
  prerequisite: []
  cross_category:
  - category: biz
    as: branch
    reads: [expense_integration_included, biz_billing_entries.charge_category]
    note: >-
      The programme allowance taken off the closing breakfast charge is decided from whether the
      active corporate programme has expense integration included and from the number of hotel
      booking lines billed to that programme in the last twelve months.
  compute:
  - breakfast_posted: "SUM('stay_folio_entries','amount_usd', charge_category='breakfast')"
  - breakfast_rate_usd: "K('long_stay_breakfast_usd') if breakfast_posted >= K('heavy_breakfast_usd') else (K('mid_breakfast_usd') if breakfast_posted >= K('light_breakfast_usd') else P('breakfast_fee_per_person_usd'))"
  - breakfast_lines: "COUNT('stay_folio_entries', charge_category='breakfast')"
  - breakfast_basis: "RND(breakfast_rate_usd * F('adults_count'), 2) if (breakfast_lines >= K('busy_breakfast_lines') and F('adults_count') > K('standard_occupancy')) else (RND(K('room_breakfast_usd'), 2) if (breakfast_lines >= K('busy_breakfast_lines') and F('adults_count') <= K('standard_occupancy')) else RND(breakfast_rate_usd, 2))"
  - nights_covered: "DAYS(F('check_in_date'), F('check_out_date'))"
  - length_relief_usd: "K('full_breakfast_relief_usd') if nights_covered >= K('long_breakfast_nights') else (K('part_breakfast_relief_usd') if nights_covered >= K('mid_breakfast_nights') else 0)"
  - programme_expense_integration: "CPARAM('biz','expense_integration_included', status='active')"
  - programme_hotel_lines_12m: "XCOUNT('biz','biz_billing_entries', within_months=12, date_field='posted_date', charge_category='hotel_booking_fee')"
  - programme_allowance_usd: "K('full_meal_allowance_usd') if (programme_expense_integration and programme_hotel_lines_12m >= K('heavy_hotel_lines')) else (K('part_meal_allowance_usd') if (programme_expense_integration and programme_hotel_lines_12m >= K('light_hotel_lines')) else 0)"
  - result: "RND(MX(0, breakfast_basis - length_relief_usd - programme_allowance_usd), 2)"
  compute_basis:
    breakfast_posted: >-
      The breakfast rate is set by the breakfast already standing on the folio for the stay.
    breakfast_rate_usd: >-
      Where the breakfast already standing comes to the heavy breakfast amount or more, the breakfast
      rate is the long stay breakfast amount; where it comes to the light breakfast amount or more
      but less than the heavy breakfast amount, the breakfast rate is the mid breakfast amount; and
      where it comes to less than the light breakfast amount, the breakfast rate is the rate plan's
      own breakfast amount.
    breakfast_lines: >-
      Where the folio carries the busy breakfast lines or more of breakfast and the reservation
      declares more adults than the standard occupancy, the breakfast basis is the breakfast rate
      charged for every adult declared on the reservation.
    breakfast_basis: >-
      Where the folio carries the busy breakfast lines or more of breakfast and the reservation
      declares more adults than the standard occupancy, the breakfast basis is the breakfast rate
      charged for every adult declared on the reservation. Where the folio carries the busy breakfast
      lines or more of breakfast and the reservation declares the standard occupancy of adults or
      fewer, the breakfast basis is the room breakfast amount taken once for the room whatever the
      party. In every other case the breakfast basis is the breakfast rate charged for the lead guest
      alone.
    nights_covered: >-
      A length relief is taken off according to the nights the reservation covers, counted from the
      arrival date to the departure date.
    length_relief_usd: >-
      Where the reservation covers the long breakfast nights or more, the length relief is the full
      breakfast relief; where it covers the mid breakfast nights or more but fewer than the long
      breakfast nights, the length relief is the part breakfast relief; and where it covers fewer
      than the mid breakfast nights, the length relief is nil.
    programme_expense_integration: >-
      A programme allowance is taken off where the reservation is made under a corporate travel
      programme whose expense integration is included.
    programme_hotel_lines_12m: >-
      Only lines billed as a hotel booking fee are counted, and lines posted more than twelve months
      before the closing breakfast charge is worked out are not counted.
    programme_allowance_usd: >-
      Where that programme has expense integration included and the hotel booking lines billed to it
      in the last twelve months number the heavy hotel lines or more, the programme allowance is
      the full meal allowance. Where that programme has expense integration included and those lines
      number the light hotel lines or more but fewer than the heavy hotel lines, the programme
      allowance is the part meal allowance. In every other case the programme allowance is nil.
    result: >-
      The closing breakfast charge is the breakfast posted for the departure morning of a stay that
      does not include breakfast in the nightly rate, and it is the breakfast basis less the length
      relief and less the programme allowance, rounded to the cent and never below nothing.
  factors:
  - id: breakfast_rate_tier
    effect: parameter
    decides: breakfast_rate_usd
    bindings: [breakfast_posted, breakfast_rate_usd]
    ladder:
    - when: "the breakfast already standing on the folio comes to the heavy breakfast amount or more"
      value: "K('long_stay_breakfast_usd')"
    - when: "the breakfast already standing comes to the light breakfast amount or more but less than the heavy breakfast amount"
      value: "K('mid_breakfast_usd')"
    - when: "otherwise"
      value: "P('breakfast_fee_per_person_usd')"
    baseline:
      breakfast_rate_usd: "P('breakfast_fee_per_person_usd')"
    evidence: [history]
    cross_difficulty: null
  - id: breakfast_charge_basis
    effect: method
    decides: breakfast_basis
    bindings: [breakfast_lines, breakfast_basis]
    ladder:
    - when: "the folio carries the busy breakfast lines or more of breakfast and the reservation declares more adults than the standard occupancy"
      method: "the breakfast basis is the breakfast rate charged for every adult declared on the reservation"
    - when: "the folio carries the busy breakfast lines or more of breakfast and the reservation declares the standard occupancy of adults or fewer"
      method: "the breakfast basis is the room breakfast amount taken once for the room whatever the party"
    - when: "otherwise"
      method: "the breakfast basis is the breakfast rate charged for the lead guest alone"
    baseline:
      breakfast_basis: "RND(breakfast_rate_usd, 2)"
    evidence: [history]
    cross_difficulty: null
  - id: breakfast_length_relief
    effect: parameter
    decides: length_relief_usd
    bindings: [nights_covered, length_relief_usd]
    ladder:
    - when: "the reservation covers the long breakfast nights or more, counted from the arrival date to the departure date"
      value: "K('full_breakfast_relief_usd')"
    - when: "the reservation covers the mid breakfast nights or more but fewer than the long breakfast nights"
      value: "K('part_breakfast_relief_usd')"
    - when: "otherwise"
      value: "nil"
    baseline:
      length_relief_usd: "0"
    evidence: [date]
    cross_difficulty: null
  - id: programme_meal_allowance
    effect: parameter
    decides: programme_allowance_usd
    bindings: [programme_expense_integration, programme_hotel_lines_12m, programme_allowance_usd]
    ladder:
    - when: "the active corporate programme the reservation is made under has expense integration included and the hotel booking lines billed to it in the last twelve months number the heavy hotel lines or more"
      value: "K('full_meal_allowance_usd')"
    - when: "the active corporate programme has expense integration included and those lines number the light hotel lines or more but fewer than the heavy hotel lines"
      value: "K('part_meal_allowance_usd')"
    - when: "otherwise"
      value: "nil"
    baseline:
      programme_allowance_usd: "0"
    evidence: [cross_category, history]
    cross_difficulty: biz
  baseline:
    rule: >-
      The closing breakfast charge is the breakfast posted for the departure morning of a stay that
      does not include breakfast in the nightly rate, and it is the breakfast basis less the length
      relief and less the programme allowance, rounded to the cent and never below nothing. Under the
      standard method the breakfast rate is the rate plan's own breakfast amount for one person for
      one day, the breakfast basis is that rate charged for the lead guest alone, the length relief
      is nil and the programme allowance is nil.
    params: [breakfast_fee_per_person_usd]
  inputs:
    history:
    - {table: stay_folio_entries, aggregate: sum, field: amount_usd, within_months: null, filters: {charge_category: breakfast}}
    - {table: stay_folio_entries, aggregate: count, field: stay_folio_entry_id, within_months: null, filters: {charge_category: breakfast}}
