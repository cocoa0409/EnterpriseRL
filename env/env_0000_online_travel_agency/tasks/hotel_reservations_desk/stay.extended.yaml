    ladder:
    - when: "the folio carries a property notice about the reservation and the room nights already posted number the busy stay nights or more"
      method: "the closing rate is the average of the room nights already posted, rounded to the cent"
    - when: "the folio carries a property notice about the reservation and the room nights already posted number fewer than the busy stay nights"
      method: "the closing rate is the highest room night already posted"
