      charge for that night, where parking stands on the folio for the stay.
    taxable_base: >-
      Where the folio carries an occupancy supplement for the stay and the reservation covers the
      long stay nights or more, the taxable base is the closing room charge together with the rate
      plan's occupancy supplement for an additional adult. Where the folio carries an occupancy
      supplement for the stay and the reservation covers fewer than the long stay nights, the taxable
