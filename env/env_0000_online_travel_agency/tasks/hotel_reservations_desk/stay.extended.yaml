extended_policies:
- id: stay_ext_arrival_credit_grant
  base_policy_refs: [stay_resort_credit]
  overwrite:
  - base_policy: stay_resort_credit
    superseded_clause: >-
      Property credit included in the rate plan is placed on the reservation at check-in, for the
      plan's amount per stay and not per night.
    replaced_by: >-
      Where the room nights already posted to the folio come to the premium room spend or more, the
      measured base credit is instead worked out as the premium credit rate of that posted room
      total, rounded to the cent; where they come to the standard room spend or more but less than
      the premium room spend, it is worked out as the standard credit rate of that posted room
      total, rounded to the cent; and where they come to less than the standard room spend, the rate
      plan's credit amount for the stay stands.
  trigger: state_due
  subject: [stay_resort_credit_grant]
  computes: credit_amount_usd
  target_tool: post_arrival_credit_grant_b81202b7
  params:
    premium_room_spend_usd: 1500
    standard_room_spend_usd: 800
    premium_credit_rate_pct: 4
    standard_credit_rate_pct: 2.5
    premier_qualifying_points: 40000
    senior_qualifying_points: 15000
    premier_uplift_usd: 45
    senior_uplift_usd: 25
    extended_stay_nights: 7
    short_stay_nights: 4
    extended_stay_allowance_usd: 40
    short_stay_allowance_usd: 20
    full_facility_nights: 6
    part_facility_nights: 3
    full_facility_offset_usd: 30
    part_facility_offset_usd: 15
  rule: >
    The arrival credit is the property credit placed on a reservation once the guest has arrived.
    The arrival credit is made up of a measured base credit together with a tier allowance, a length
    allowance and a facility allowance, and the four are added together and the total rounded to the
    cent. Where the rate plan's credit amount for the stay is nil, no arrival credit is granted at
    all, whatever the room nights already posted to the folio. Under the standard method the
    measured base credit is the rate plan's credit amount for the stay, taken once for the whole stay whatever the number of rooms or nights, the tier
    allowance is nil, the length allowance is nil and the facility allowance is nil. The arrival
    credit is recorded with the last date it may be spent, which is the arrival date advanced by the
    rate plan's credit validity term. No arrival credit is granted twice on one reservation.

    Where the room nights already posted to the folio come to the premium room spend or more, the
    measured base credit is instead worked out as the premium credit rate of that posted room
    total, rounded to the cent; where they come to the standard room spend or more but less than
    the premium room spend, it is worked out as the standard credit rate of that posted room
    total, rounded to the cent; and where they come to less than the standard room spend, the rate
    plan's credit amount for the stay stands. Only room-night lines are counted in that posted room
    total, and a line raised to return money to the guest is not deducted from it.

    A tier allowance is added to the arrival credit from the traveller club membership the guest
    holds. Where the active membership stands at Wanderlane Platinum, Wanderlane Titanium or
    Wanderlane Ambassador and the tier-qualifying points posted to it in the last twelve months come
    to the premier qualifying points or more, the tier allowance is the premier uplift. Where the
    active membership stands at Wanderlane Gold and the tier-qualifying points posted to it in the
    last twelve months come to the senior qualifying points or more, the tier allowance is the
    senior uplift. In every other case the tier allowance is nil. Only points posted as
    tier-qualifying are counted, and points posted more than twelve months before the day the
    arrival credit is worked out are not counted.

    A length allowance is added to the arrival credit according to the nights the reservation
    covers, counted from the arrival date to the departure date. Where the reservation covers the
    extended stay nights or more, the length allowance is the extended stay allowance; where it
    covers the short stay nights or more but fewer than the extended stay nights, the length
    allowance is the short stay allowance; and where it covers fewer than the short stay nights, the
    length allowance is nil.

    A facility allowance is added to the arrival credit according to the nights of the property
    facility fee already standing on the folio. Where the folio carries the full facility nights or
    more of property facility fee, the facility allowance is the full facility offset; where it
    carries the part facility nights or more but fewer than the full facility nights, the facility
    allowance is the part facility offset; and where it carries fewer than the part facility nights,
    the facility allowance is nil. Only the property facility fee is counted here, and occupancy
    tax, city tax and parking are not.
  prerequisite: []
  cross_category:
  - category: club
    as: history
    reads: [variant_name, club_points_entries.points_delta]
    note: >-
      The tier allowance added to the arrival credit is decided from the club tier the guest's
      active membership stands at and from the tier-qualifying points posted to that membership in
      the last twelve months.
  compute:
  - room_nights_posted: "SUM('stay_folio_entries','amount_usd', charge_category='room_night')"
  - measured_base_credit: "RND(room_nights_posted * K('premium_credit_rate_pct') / 100, 2) if room_nights_posted >= K('premium_room_spend_usd') else (RND(room_nights_posted * K('standard_credit_rate_pct') / 100, 2) if room_nights_posted >= K('standard_room_spend_usd') else RND(P('resort_credit_per_stay_usd'), 2))"
  - club_tier_held: "CFIELD('club','variant_name', status='active')"
  - qualifying_points_12m: "XSUM('club','club_points_entries','points_delta', within_months=12, date_field='posted_date', points_kind='qualifying')"
  - tier_allowance: "K('premier_uplift_usd') if ((club_tier_held == 'Wanderlane Platinum' or club_tier_held == 'Wanderlane Titanium' or club_tier_held == 'Wanderlane Ambassador') and qualifying_points_12m >= K('premier_qualifying_points')) else (K('senior_uplift_usd') if (club_tier_held == 'Wanderlane Gold' and qualifying_points_12m >= K('senior_qualifying_points')) else 0)"
  - nights_covered: "DAYS(F('check_in_date'), F('check_out_date'))"
  - length_allowance: "K('extended_stay_allowance_usd') if nights_covered >= K('extended_stay_nights') else (K('short_stay_allowance_usd') if nights_covered >= K('short_stay_nights') else 0)"
  - facility_fee_nights: "COUNT('stay_folio_entries', charge_category='resort_fee')"
  - facility_allowance: "K('full_facility_offset_usd') if facility_fee_nights >= K('full_facility_nights') else (K('part_facility_offset_usd') if facility_fee_nights >= K('part_facility_nights') else 0)"
  - plan_credit_per_stay: "RND(P('resort_credit_per_stay_usd'), 2)"
  - result: "0.0 if plan_credit_per_stay <= 0 else RND(measured_base_credit + tier_allowance + length_allowance + facility_allowance, 2)"
  compute_basis:
    room_nights_posted: >-
      Only room-night lines are counted in that posted room total, and a line raised to return money
      to the guest is not deducted from it.
    measured_base_credit: >-
      Where the room nights already posted to the folio come to the premium room spend or more, the
      measured base credit is instead worked out as the premium credit rate of that posted room
      total, rounded to the cent; where they come to the standard room spend or more but less than
      the premium room spend, it is worked out as the standard credit rate of that posted room
      total, rounded to the cent; and where they come to less than the standard room spend, the rate
      plan's credit amount for the stay stands.
    club_tier_held: >-
      A tier allowance is added to the arrival credit from the traveller club membership the guest
      holds.
    qualifying_points_12m: >-
      Only points posted as tier-qualifying are counted, and points posted more than twelve months
      before the day the arrival credit is worked out are not counted.
    tier_allowance: >-
      Where the active membership stands at Wanderlane Platinum, Wanderlane Titanium or Wanderlane
      Ambassador and the tier-qualifying points posted to it in the last twelve months come to the
      premier qualifying points or more, the tier allowance is the premier uplift. Where the active
      membership stands at Wanderlane Gold and the tier-qualifying points posted to it in the last
      twelve months come to the senior qualifying points or more, the tier allowance is the senior
      uplift. In every other case the tier allowance is nil.
    nights_covered: >-
      A length allowance is added to the arrival credit according to the nights the reservation
      covers, counted from the arrival date to the departure date.
    length_allowance: >-
      Where the reservation covers the extended stay nights or more, the length allowance is the
      extended stay allowance; where it covers the short stay nights or more but fewer than the
      extended stay nights, the length allowance is the short stay allowance; and where it covers
      fewer than the short stay nights, the length allowance is nil.
    facility_fee_nights: >-
      Only the property facility fee is counted here, and occupancy tax, city tax and parking are
      not.
    facility_allowance: >-
      Where the folio carries the full facility nights or more of property facility fee, the
      facility allowance is the full facility offset; where it carries the part facility nights or
      more but fewer than the full facility nights, the facility allowance is the part facility
      offset; and where it carries fewer than the part facility nights, the facility allowance is
      nil.
    plan_credit_per_stay: >-
      Where the rate plan's credit amount for the stay is nil, no arrival credit is granted at all,
      whatever the room nights already posted to the folio.
    result: >-
      The arrival credit is made up of a measured base credit together with a tier allowance, a
      length allowance and a facility allowance, and the four are added together and the total
      rounded to the cent. Where the rate plan's credit amount for the stay is nil, no arrival
      credit is granted at all, whatever the room nights already posted to the folio.
  factors:
  - id: measured_base_credit_basis
    effect: method
    decides: measured_base_credit
    bindings: [room_nights_posted, measured_base_credit]
    ladder:
    - when: "the room nights already posted to the folio come to the premium room spend or more"
      method: "the measured base credit is worked out as the premium credit rate of the posted room total, rounded to the cent"
    - when: "the room nights already posted to the folio come to the standard room spend or more but less than the premium room spend"
      method: "the measured base credit is worked out as the standard credit rate of the posted room total, rounded to the cent"
    - when: "otherwise"
      method: "the measured base credit is the rate plan's credit amount for the stay, taken once for the whole stay"
    baseline:
      measured_base_credit: "RND(P('resort_credit_per_stay_usd'), 2)"
    evidence: [history, tier_param]
    cross_difficulty: null
  - id: club_tier_allowance
    effect: parameter
    decides: tier_allowance
    bindings: [club_tier_held, qualifying_points_12m, tier_allowance]
    ladder:
    - when: "the active traveller club membership stands at Wanderlane Platinum, Wanderlane Titanium or Wanderlane Ambassador and the tier-qualifying points posted to it in the last twelve months come to the premier qualifying points or more"
      value: "K('premier_uplift_usd')"
    - when: "the active traveller club membership stands at Wanderlane Gold and the tier-qualifying points posted to it in the last twelve months come to the senior qualifying points or more"
      value: "K('senior_uplift_usd')"
    - when: "otherwise"
      value: "nil"
    baseline:
      tier_allowance: "0"
    evidence: [cross_category, history]
    cross_difficulty: club
  - id: stay_length_allowance
    effect: parameter
    decides: length_allowance
    bindings: [nights_covered, length_allowance]
    ladder:
    - when: "the reservation covers the extended stay nights or more, counted from the arrival date to the departure date"
      value: "K('extended_stay_allowance_usd')"
    - when: "the reservation covers the short stay nights or more but fewer than the extended stay nights"
      value: "K('short_stay_allowance_usd')"
    - when: "otherwise"
      value: "nil"
    baseline:
      length_allowance: "0"
    evidence: [date]
    cross_difficulty: null
  - id: facility_fee_allowance
    effect: parameter
    decides: facility_allowance
    bindings: [facility_fee_nights, facility_allowance]
    ladder:
    - when: "the folio carries the full facility nights or more of property facility fee"
      value: "K('full_facility_offset_usd')"
    - when: "the folio carries the part facility nights or more but fewer than the full facility nights of property facility fee"
      value: "K('part_facility_offset_usd')"
    - when: "otherwise"
      value: "nil"
    baseline:
      facility_allowance: "0"
    evidence: [history]
    cross_difficulty: null
  baseline:
    rule: >-
      The arrival credit is the property credit placed on a reservation once the guest has arrived.
      The arrival credit is made up of a measured base credit together with a tier allowance, a
      length allowance and a facility allowance, and the four are added together and the total
      rounded to the cent. Where the rate plan's credit amount for the stay is nil, no arrival
      credit is granted at all, whatever the room nights already posted to the folio. Under the
      standard method the measured base credit is the rate plan's credit amount for the stay, taken once for the whole stay whatever the number of rooms or
      nights, the tier allowance is nil, the length allowance is nil and the facility allowance is
      nil. The arrival credit is recorded with the last date it may be spent, which is the arrival
      date advanced by the rate plan's credit validity term. No arrival credit is granted twice on
      one reservation.
    params: [resort_credit_per_stay_usd, resort_credit_validity_days]
  inputs:
    history:
    - {table: stay_folio_entries, aggregate: sum, field: amount_usd, within_months: null, filters: {charge_category: room_night}}
    - {table: stay_folio_entries, aggregate: count, field: stay_folio_entry_id, within_months: null, filters: {charge_category: resort_fee}}
    - {category: club, table: club_points_entries, aggregate: sum, field: points_delta, within_months: 12, filters: {points_kind: qualifying}}
    cross_category: [club]
- id: stay_ext_departure_credit_release
  base_policy_refs: [stay_resort_credit]
  overwrite:
  - base_policy: stay_resort_credit
    superseded_clause: >-
      The credit lapses at the end of the plan's validity term counted from the arrival date, and
      whatever is unspent at departure is forfeited without payment.
    replaced_by: >-
      Where the folio carries a property notice about the reservation and the departure date is no
      later than the day the release is settled, the credit standing is the arrival grant in full,
      the uses already posted being set aside.
  trigger: on_request
  subject: [stay_resort_credit_use]
  computes: credit_applied_usd
  target_tool: apply_property_credit_f4ca2b6a
  params:
    premier_stay_rows: 8
    regular_stay_rows: 3
    premier_treatment_share_pct: 25
    regular_treatment_share_pct: 20
    standard_treatment_share_pct: 15
    busy_minibar_lines: 4
    busy_onsite_lines: 8
    heavy_minibar_usd: 100
    light_minibar_usd: 40
    full_minibar_cover_pct: 100
    part_minibar_cover_pct: 75
    standard_minibar_cover_pct: 50
    many_companion_lines: 3
    some_companion_lines: 1
    full_companion_allowance_usd: 18
    part_companion_allowance_usd: 9
    long_upgrade_nights: 5
    short_upgrade_nights: 2
    high_upgrade_credit_usd: 20
    low_upgrade_credit_usd: 10
  rule: >
    The closing credit release is the property credit put against the on-site charges standing on a
    reservation when the guest settles before departure, and it is the treatment release and the
    remaining release added together and rounded to the cent. The property credit released at the
    close of a stay is settled only after the reservation's credit account already carries the
    arrival grant the rate plan provides for that stay. The closing credit release is recorded as
    one line against the largest treatment charge standing on the folio, and no separate line is
    raised for each charge it covers.

    Under the standard method the credit standing on the reservation is the arrival grant less every
    use already posted to the credit account, the treatment share is the standard treatment share,
    the credit is put against the latest minibar charge taken by the lead guest alone, that minibar
    charge is covered at the standard minibar cover rate, nothing of a room upgrade is covered and
    no companion allowance is set aside. The treatment allowance is the treatment share of the
    credit standing, rounded to the cent, and the treatment release is the treatment allowance or
    the treatment charges taken by the lead guest, whichever is the smaller. What is left of the
    credit standing after the treatment allowance is set aside is the remaining allowance, and the
    remaining release is the remaining allowance or the covered remaining charges, whichever is the
    smaller. The covered remaining charges are the covered minibar amount, the covered upgrade
    amount and the companion release added together and rounded to the cent, where the companion
    release is the companion allowance or the on-site charges taken by an occupant other than the
    lead guest, whichever is the smaller.

    Where the folio carries a property notice about the reservation and the departure date is no
    later than the day the release is settled, the credit standing is the arrival grant in full, the
    uses already posted being set aside. Where the folio carries no property notice about the
    reservation and the departure date is no later than the day the release is settled, the credit
    standing is nil. In every other case the credit standing is the arrival grant less every use
    already posted to the credit account.

    Where the guest's active traveller club membership stands at Wanderlane Platinum, Wanderlane
    Titanium or Wanderlane Ambassador and the stay-night accruals posted to it in the last twelve
    months number the premier stay rows or more, the treatment share is the premier treatment share.
    Where that active membership stands at Wanderlane Gold and the stay-night accruals posted to it
    in the last twelve months number the regular stay rows or more, the treatment share is the
    regular treatment share. In every other case the treatment share is the standard treatment
    share. Only accruals recorded against a hotel night are counted, and accruals posted more than
    twelve months before the day the release is settled are not counted.

    Where the folio carries the busy minibar lines or more of minibar charges and the on-site
    charges standing on the folio number the busy on-site lines or more, the credit is put against
    every minibar charge taken by the lead guest and the counted minibar figure is their total.
    Where the folio carries the busy minibar lines or more of minibar charges and the on-site
    charges standing on the folio number fewer than the busy on-site lines, the credit is put
    against the largest minibar charge taken by the lead guest alone and the counted minibar figure
    is that charge. In every other case the credit is put against the latest minibar charge taken by
    the lead guest alone and the counted minibar figure is that charge.

    Where the minibar charges standing on the folio come to the heavy minibar amount or more, the
    minibar cover rate is the full minibar cover rate; where they come to the light minibar amount
    or more but less than the heavy minibar amount, the minibar cover rate is the part minibar cover
    rate; and where they come to less than the light minibar amount, the minibar cover rate is the
    standard minibar cover rate. The covered minibar amount is the minibar cover rate of the counted
    minibar figure, rounded to the cent.

    Where a room upgrade stands on the folio for the long upgrade nights or more, the upgrade credit
    is the high upgrade credit for each night the upgrade was charged; where it stands for the short
    upgrade nights or more but fewer than the long upgrade nights, the upgrade credit is the low
    upgrade credit for each night charged; and where it stands for fewer than the short upgrade
    nights, the upgrade credit is nil for each night charged. The covered upgrade amount is the
    upgrade credit multiplied by the nights the upgrade was charged, rounded to the cent.

    Where the rate plan lets a companion sharing the room spend the credit and the on-site charges
    taken by an occupant other than the lead guest number the many companion lines or more, the
    companion allowance is the full companion allowance. Where the rate plan lets a companion
    sharing the room spend the credit and those charges number the some companion lines or more but
    fewer than the many companion lines, the companion allowance is the part companion allowance. In
    every other case the companion allowance is nil.
  prerequisite:
  - problem: stay_ext_arrival_credit_grant
    kind: value_input
    gate: grant_total
    form: state
    policy_source: >-
      The property credit released at the close of a stay is settled only after the reservation's
      credit account already carries the arrival grant the rate plan provides for that stay.
    condition: >-
      The reservation's credit account carries the arrival grant the rate plan provides for the
      stay.
    resolved_by: post_arrival_credit_grant_b81202b7
    effect: >-
      Once the arrival grant stands on the credit account, the grant total this policy reads takes
      the granted amount instead of nil, and the credit standing rises with it.
  cross_category:
  - category: club
    as: history
    reads: [variant_name, club_points_entries.points_delta]
    note: >-
      The treatment share of the closing credit release is decided from the club tier the guest's
      active membership stands at and from the stay-night accruals posted to that membership in the
