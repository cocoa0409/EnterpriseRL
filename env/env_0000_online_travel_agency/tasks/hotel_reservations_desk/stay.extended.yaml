- id: stay_ext_closing_tax_charge
  base_policy_refs: [stay_taxes_and_fees]
  overwrite:
  - base_policy: stay_taxes_and_fees
    superseded_clause: >-
      Occupancy tax and city tax are applied to the room total alone, night by night, and never to
      optional extras or to the agency service fee.
    replaced_by: >-
      The occupancy tax is worked out on a taxable base that may take in more than the room charge
      alone, and the city levy is carried with it on one line, no separate city line being raised for
      that night.
  trigger: state_due
  subject: [stay_tax_and_fee_charge]
  computes: tax_amount_usd
  target_tool: post_closing_tax_charge_e4008804
  params:
    long_stay_nights: 6
    upper_tax_band_usd: 320
    lower_tax_band_usd: 250
    upper_tax_rate_pct: 14
    mid_tax_rate_pct: 13
    upper_levy_band_usd: 400
    lower_levy_band_usd: 250
    upper_city_levy_usd: 18
    mid_city_levy_usd: 12
    base_city_levy_usd: 7
    frequent_hotel_lines: 5
    some_hotel_lines: 2
    full_tax_exemption_usd: 6
    part_tax_exemption_usd: 3
  rule: >
    The closing tax charge is the statutory charge posted for the last night of a stay, and it is
    the occupancy tax for that night plus the city levy for that night, less the corporate exemption,
    rounded to the cent. The occupancy tax is worked out on a taxable base that may take in more than
    the room charge alone, and the city levy is carried with it on one line, no separate city line
    being raised for that night. The closing tax charge is worked out only after the room night for the last night of
    the stay stands on the folio. Under the standard method the taxable base is the closing room
    charge alone, the occupancy rate is the rate plan's own occupancy tax rate, the city levy is the
    base city levy and the corporate exemption is nil. The occupancy tax for the night is the
    occupancy rate of the taxable base, rounded to the cent, and the city levy is added to that
    figure before the corporate exemption is taken off; the exemption is never applied to the
    occupancy tax alone.

    Where the folio carries an occupancy supplement for the stay and the reservation covers the long
    stay nights or more, the taxable base is the closing room charge together with the rate plan's
    occupancy supplement for an additional adult. Where the folio carries an occupancy supplement for
    the stay and the reservation covers fewer than the long stay nights, the taxable base is the
    closing room charge together with the rate plan's property facility fee for that night, where the
    plan does not waive it, and its parking charge for that night, where parking stands on the folio
    for the stay. In every other case the taxable base is the closing room charge alone.

    The occupancy rate is banded by the closing room charge. Where the closing room charge is at or
    above the upper tax band, the occupancy rate is the upper tax rate; where it is at or above the
    lower tax band but below the upper tax band, the occupancy rate is the mid tax rate; and where it
    is below the lower tax band, the occupancy rate is the rate plan's own occupancy tax rate.

    The city levy is banded by the average room night of the stay, which is the room nights standing
    on the folio divided by their number and rounded to the cent. Where that average is at or above
    the upper levy band, the city levy is the upper city levy; where it is at or above the lower levy
    band but below the upper levy band, the city levy is the mid city levy; and where it is below the
    lower levy band, the city levy is the base city levy.

    A corporate exemption is taken off where the reservation is made under a corporate travel
    programme that carries duty-of-care cover. Where that programme carries duty-of-care cover and
    the hotel booking lines billed to it in the last twelve months number the frequent hotel lines or
    more, the corporate exemption is the full tax exemption. Where that programme carries duty-of-care
    cover and those lines number the some hotel lines or more but fewer than the frequent hotel
    lines, the corporate exemption is the part tax exemption. In every other case the corporate
    exemption is nil. Only lines billed as a hotel booking fee are counted, and lines posted more than
    twelve months before the closing tax charge is worked out are not counted.
  prerequisite:
  - problem: stay_ext_closing_night_charge
    kind: value_input
    gate: closing_room_charge
    form: state
    policy_source: >-
      The closing tax charge is worked out only after the room night for the last night of the stay
      stands on the folio.
    condition: >-
      The folio carries a room night for the last night of the stay.
    resolved_by: post_closing_room_night_00233ccc
    effect: >-
      Once the last night's room charge stands on the folio, the closing room charge this policy
      reads becomes that night's figure rather than the night before it, which moves the taxable
      base, the occupancy rate band and the average room night of the stay.
  cross_category:
  - category: biz
    as: branch
    reads: [duty_of_care_included, biz_billing_entries.charge_category]
    note: >-
      The corporate exemption taken off the closing tax charge is decided from whether the active
      corporate programme carries duty-of-care cover and from the number of hotel booking lines
      billed to that programme in the last twelve months.
  compute:
  - closing_room_charge: "LATEST('stay_folio_entries','amount_usd', date_field='posted_date', charge_category='room_night')"
  - supplement_lines: "COUNT('stay_folio_entries', charge_category='extra_occupant')"
  - nights_covered: "DAYS(F('check_in_date'), F('check_out_date'))"
  - parking_nights: "COUNT('stay_folio_entries', charge_category='parking')"
  - taxable_base: "RND(closing_room_charge + P('extra_adult_fee_per_night_usd'), 2) if (supplement_lines >= 1 and nights_covered >= K('long_stay_nights')) else (RND(closing_room_charge + (0 if P('resort_fee_waived') else P('resort_fee_per_night_usd')) + (P('parking_fee_per_night_usd') if parking_nights >= 1 else 0), 2) if (supplement_lines >= 1 and nights_covered < K('long_stay_nights')) else RND(closing_room_charge, 2))"
  - occupancy_rate_pct: "K('upper_tax_rate_pct') if closing_room_charge >= K('upper_tax_band_usd') else (K('mid_tax_rate_pct') if closing_room_charge >= K('lower_tax_band_usd') else P('occupancy_tax_pct'))"
  - occupancy_tax_amount: "RND(taxable_base * occupancy_rate_pct / 100, 2)"
  - average_room_night: "RND(SUM('stay_folio_entries','amount_usd', charge_category='room_night') / COUNT('stay_folio_entries', charge_category='room_night'), 2)"
  - city_levy_usd: "K('upper_city_levy_usd') if average_room_night >= K('upper_levy_band_usd') else (K('mid_city_levy_usd') if average_room_night >= K('lower_levy_band_usd') else K('base_city_levy_usd'))"
  - programme_duty_of_care: "CPARAM('biz','duty_of_care_included', status='active')"
  - programme_hotel_lines_12m: "XCOUNT('biz','biz_billing_entries', within_months=12, date_field='posted_date', charge_category='hotel_booking_fee')"
  - corporate_exemption_usd: "K('full_tax_exemption_usd') if (programme_duty_of_care and programme_hotel_lines_12m >= K('frequent_hotel_lines')) else (K('part_tax_exemption_usd') if (programme_duty_of_care and programme_hotel_lines_12m >= K('some_hotel_lines')) else 0)"
  - result: "RND(occupancy_tax_amount + city_levy_usd - corporate_exemption_usd, 2)"
  compute_basis:
    closing_room_charge: >-
      The closing tax charge is worked out only after the room night for the last night of the stay
