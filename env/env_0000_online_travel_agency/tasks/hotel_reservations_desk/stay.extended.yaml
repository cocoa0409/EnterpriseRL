    record stands at checked in or checked out. Breakfast is charged per person per day on a plan that does not include it, and an all-inclusive plan charges nothing for meals, soft drinks or listed activities
    at all. Spa treatments carry the plan''s spa discount, applied before tax, and the discount is never given in money where no treatment is taken. At departure the folio is closed off: every posted line
