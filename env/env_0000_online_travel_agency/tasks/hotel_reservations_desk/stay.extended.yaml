  direction: in
  triggers: []
- type: stay_tax_and_fee_charge
  target: stay_folio_entries
  meaning: An occupancy tax, a city tax, a facility fee or a parking charge is posted to the folio.
  grain: One row per statutory or mandatory charge, per room and per night it applies to.
