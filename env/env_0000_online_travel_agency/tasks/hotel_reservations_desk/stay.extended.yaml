    on every plan that does not waive it, and is charged whether or not the guest uses the facilities it covers. Parking is charged per room per night at the plan's amount and is never charged where the
    guest declares no vehicle. In-room internet is charged per day only on a plan that does not include it. Taxes are calculated after any club or corporate discount has been applied to the room rate, so
