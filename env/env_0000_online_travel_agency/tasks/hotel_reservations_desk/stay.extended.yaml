  - stay_no_show_charge
  rule: 'A guest who neither arrives on the arrival date nor cancels before it is recorded as a no-show, and the rate plan''s no-show penalty is withheld. The penalty is the plan''s no-show nights taken
    at the booked room rate, or its share of the room total where the plan expresses the penalty as a share; the two are never added together. A no-show releases the whole reservation, not only the first
    night, and the remaining nights are cancelled with no further penalty. A no-show penalty and a cancellation penalty are never both withheld on the same room: whichever applies replaces the other. No
    penalty is withheld where the property itself could not accommodate the guest, and the relocation terms apply instead. Where the deposit already held is smaller than the penalty, the balance is charged
    to the card on file, and where it is larger the difference is returned.'
