  rule: 'An approved refund settles in the form the rate plan prescribes: money to the card, or credit at the property, never both and never a mixture. A payout line is raised only while the reservation
    record stands at cancelled, no show or checked out. The settlement takes the plan''s processing time, counted in business days from the day the refund was approved, excluding weekends and public holidays
    in the guest''s country of residence. Each payout is raised against the original folio line it reverses, so a folio with several lines settles as several payouts and never as one lump sum. A payout
    may never exceed the amount that original line actually collected, and the sum of a reservation''s payouts may never exceed its folio balance. Where the property declines the refund, the reservation
