- type: stay_incidental_charge
  target: stay_folio_entries
  meaning: An optional extra taken during the stay is posted to the folio.
  grain: One row per optional extra, for one room, one occupant and, where it applies, one night.
  distinguish_by:
  - charge_category
  - room_sequence
  - guest_sequence
  - night_sequence
