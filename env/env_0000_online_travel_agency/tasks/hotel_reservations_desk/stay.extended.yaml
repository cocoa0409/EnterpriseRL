    cross_category: [biz]
- id: stay_ext_departure_folio_settlement
  base_policy_refs: [stay_incidentals]
  overwrite:
  - base_policy: stay_incidentals
    superseded_clause: >-
      At departure the folio is closed off: every posted line is settled against the deposit already
      held and the balance is taken from or returned to the card on file.
    replaced_by: >-
      The closing folio balance is the settled charges less the direct billed amount, less the
      deposit already held, less the goodwill reduction, less the service fee waiver, less the
      parking rebate and plus the departure service charge, rounded to the cent.
  trigger: on_request
  subject: [stay_check_out]
  computes: closing_folio_balance_usd
  target_tool: settle_departure_folio_3e89900b
  params:
    high_credit_limit_usd: 250000
    mid_credit_limit_usd: 50000
    full_direct_bill_pct: 100
    part_direct_bill_pct: 60
    busy_stay_nights: 6
    long_stay_nights: 6
    full_goodwill_usd: 120
    part_goodwill_usd: 60
    full_waiver_facility_lines: 8
    part_waiver_facility_lines: 3
    full_service_fee_waiver_usd: 14.95
    part_service_fee_waiver_usd: 7.5
    busy_onsite_lines: 5
    some_onsite_lines: 2
    high_service_charge_pct: 18
    standard_service_charge_pct: 12
    weekly_parking_lines: 6
    multi_day_parking_lines: 3
    full_parking_rebate_usd: 48
    part_parking_rebate_usd: 24
  rule: >
    The closing folio balance is the figure the guest settles when the folio is closed off at
    departure. The settled charges are the room nights, the statutory charges, the property facility
    fee, the parking, the occupancy supplement, the breakfast and the agency service fee standing on
    the folio, added together and rounded to the cent; the deposit already held is not one of them
    and is set against them instead. The closing folio balance is the settled charges less the direct
    billed amount, less the deposit already held, less the goodwill reduction, less the service fee
    waiver, less the parking rebate and plus the departure service charge, rounded to the cent.
    The closing folio balance is settled only once the room nights standing on the folio cover every
    night of the stay. Before the closing folio balance is worked out, the statutory charge for the
    last night of the stay must stand on the folio. The closing folio balance is fixed only after the
    folio carries the breakfast owed for the departure morning.

    Under the standard method the direct billed base is the room nights alone, the direct billed
    share is nil, the goodwill reduction is nil, the service fee waiver is nil, the parking rebate is
    nil and the departure service charge is nil. The direct billed amount is the direct billed share
    of the direct billed base, rounded to the cent, and the departure service charge is the service
    charge rate of the breakfast standing on the folio, rounded to the cent.

    Where the reservation is made under an active corporate programme whose credit limit is at or
    above the high credit limit, the direct billed share is the full direct bill share. Where the
    reservation is made under an active corporate programme whose credit limit is at or above the mid
    credit limit but below the high credit limit, the direct billed share is the part direct bill
    share. In every other case the direct billed share is nil.

    Where the corporate programme the reservation is made under carries consolidated invoicing and
    the room nights standing on the folio number the busy stay nights or more, the direct billed base
    is the room nights, the statutory charges and the property facility fee taken together. Where
    that programme carries consolidated invoicing and the room nights standing on the folio number
    fewer than the busy stay nights, the direct billed base is the room nights and the statutory
    charges taken together. In every other case the direct billed base is the room nights alone.

    A goodwill reduction is given where the property has advised a change to the reservation. Where
    the folio carries a property notice about the reservation and the reservation covers the long
    stay nights or more, the goodwill reduction is the full goodwill amount; where the folio carries
    a property notice about the reservation and the reservation covers fewer than the long stay
    nights, the goodwill reduction is the part goodwill amount; and where the folio carries no
    property notice about the reservation, the goodwill reduction is nil.

    A service fee waiver is given according to the nights of property facility fee standing on the
    folio. Where the folio carries the full waiver facility lines or more, the service fee waiver is
    the full service fee waiver; where it carries the part waiver facility lines or more but fewer
    than the full waiver facility lines, the service fee waiver is the part service fee waiver; and
    where it carries fewer than the part waiver facility lines, the service fee waiver is nil.

    A departure service charge is added on the breakfast standing on the folio. Where the on-site
    extras standing on the folio number the busy on-site lines or more, the service charge rate is
    the high service charge rate; where they number the some on-site lines or more but fewer than the
    busy on-site lines, the service charge rate is the standard service charge rate; and where they
    number fewer than the some on-site lines, the service charge rate is nil.

    A parking rebate is given according to the nights of parking standing on the folio. Where the
    folio carries the weekly parking lines or more, the parking rebate is the full parking rebate;
    where it carries the multi day parking lines or more but fewer than the weekly parking lines, the
    parking rebate is the part parking rebate; and where it carries fewer than the multi day parking
    lines, the parking rebate is nil.
  prerequisite:
  - problem: stay_ext_closing_night_charge
    kind: value_input
    gate: room_total
    form: state
    policy_source: >-
      The closing folio balance is settled only once the room nights standing on the folio cover
      every night of the stay.
    condition: >-
      The room nights standing on the folio cover every night of the stay.
    resolved_by: post_closing_room_night_00233ccc
    effect: >-
      Once the last night's room charge stands on the folio, the room nights total this policy reads
      rises by that night's figure, which moves the settled charges and the direct billed base.
  - problem: stay_ext_closing_tax_charge
    kind: value_input
    gate: tax_total
    form: state
    policy_source: >-
      Before the closing folio balance is worked out, the statutory charge for the last night of the
      stay must stand on the folio.
    condition: >-
      The folio carries the statutory charge for the last night of the stay.
    resolved_by: post_closing_tax_charge_e4008804
    effect: >-
      Once that statutory charge stands on the folio, the statutory charges total this policy reads
      rises by it, which moves the settled charges and the direct billed base.
  - problem: stay_ext_closing_breakfast_charge
    kind: value_input
    gate: breakfast_total
    form: state
    policy_source: >-
      The closing folio balance is fixed only after the folio carries the breakfast owed for the
      departure morning.
    condition: >-
      The folio carries the breakfast owed for the departure morning.
    resolved_by: post_closing_breakfast_charge_10224aa5
    effect: >-
      Once the departure morning's breakfast stands on the folio, the breakfast total this policy
      reads rises by it, which moves both the settled charges and the departure service charge taken
      on them.
  cross_category:
  - category: biz
    as: branch
    reads: [credit_limit_usd, consolidated_invoicing]
    note: >-
      The direct billed share and the direct billed base of the closing folio balance are decided
      from the credit limit of the active corporate programme the reservation is made under and from
      whether that programme carries consolidated invoicing.
  compute:
  - room_total: "SUM('stay_folio_entries','amount_usd', charge_category='room_night')"
  - tax_total: "SUM('stay_folio_entries','amount_usd', charge_category='occupancy_tax')"
  - facility_total: "SUM('stay_folio_entries','amount_usd', charge_category='resort_fee')"
  - parking_total: "SUM('stay_folio_entries','amount_usd', charge_category='parking')"
  - supplement_total: "SUM('stay_folio_entries','amount_usd', charge_category='extra_occupant')"
  - breakfast_total: "SUM('stay_folio_entries','amount_usd', charge_category='breakfast')"
  - service_fee_total: "SUM('stay_folio_entries','amount_usd', charge_category='agency_service_fee')"
  - deposit_total: "SUM('stay_folio_entries','amount_usd', charge_category='deposit')"
  - settled_charges: "RND(room_total + tax_total + facility_total + parking_total + supplement_total + breakfast_total + service_fee_total, 2)"
  - programme_active: "EXISTS('biz', status='active')"
  - programme_credit_limit: "CPARAM('biz','credit_limit_usd', status='active')"
  - direct_bill_share_pct: "K('full_direct_bill_pct') if (programme_active and programme_credit_limit >= K('high_credit_limit_usd')) else (K('part_direct_bill_pct') if (programme_active and programme_credit_limit >= K('mid_credit_limit_usd') and programme_credit_limit < K('high_credit_limit_usd')) else 0)"
  - posted_night_count: "COUNT('stay_folio_entries', charge_category='room_night')"
  - programme_consolidated: "CPARAM('biz','consolidated_invoicing', status='active')"
  - direct_bill_base: "RND(room_total + tax_total + facility_total, 2) if (programme_consolidated and posted_night_count >= K('busy_stay_nights')) else (RND(room_total + tax_total, 2) if (programme_consolidated and posted_night_count < K('busy_stay_nights')) else RND(room_total, 2))"
  - direct_billed: "RND(direct_bill_base * direct_bill_share_pct / 100, 2)"
  - notice_lines: "COUNT('stay_folio_entries', event_type='stay_property_notice')"
  - nights_covered: "DAYS(F('check_in_date'), F('check_out_date'))"
  - goodwill_reduction_usd: "K('full_goodwill_usd') if (notice_lines >= 1 and nights_covered >= K('long_stay_nights')) else (K('part_goodwill_usd') if (notice_lines >= 1 and nights_covered < K('long_stay_nights')) else 0)"
  - facility_lines: "COUNT('stay_folio_entries', charge_category='resort_fee')"
  - service_fee_waiver_usd: "K('full_service_fee_waiver_usd') if facility_lines >= K('full_waiver_facility_lines') else (K('part_service_fee_waiver_usd') if facility_lines >= K('part_waiver_facility_lines') else 0)"
  - onsite_lines: "COUNT('stay_folio_entries', event_type='stay_incidental_charge')"
  - service_charge_rate_pct: "K('high_service_charge_pct') if onsite_lines >= K('busy_onsite_lines') else (K('standard_service_charge_pct') if onsite_lines >= K('some_onsite_lines') else 0)"
  - departure_service_charge: "RND(breakfast_total * service_charge_rate_pct / 100, 2)"
  - parking_lines: "COUNT('stay_folio_entries', charge_category='parking')"
  - parking_rebate_usd: "K('full_parking_rebate_usd') if parking_lines >= K('weekly_parking_lines') else (K('part_parking_rebate_usd') if parking_lines >= K('multi_day_parking_lines') else 0)"
  - result: "RND(settled_charges - direct_billed - deposit_total - goodwill_reduction_usd - service_fee_waiver_usd - parking_rebate_usd + departure_service_charge, 2)"
  compute_basis:
    room_total: >-
      The closing folio balance is settled only once the room nights standing on the folio cover
      every night of the stay.
    tax_total: >-
      Before the closing folio balance is worked out, the statutory charge for the last night of the
      stay must stand on the folio.
    facility_total: >-
      The settled charges are the room nights, the statutory charges, the property facility fee, the
      parking, the occupancy supplement, the breakfast and the agency service fee standing on the
      folio, added together and rounded to the cent; the deposit already held is not one of them and
      is set against them instead.
    parking_total: >-
      The settled charges are the room nights, the statutory charges, the property facility fee, the
      parking, the occupancy supplement, the breakfast and the agency service fee standing on the
      folio, added together and rounded to the cent; the deposit already held is not one of them and
      is set against them instead.
    supplement_total: >-
      The settled charges are the room nights, the statutory charges, the property facility fee, the
      parking, the occupancy supplement, the breakfast and the agency service fee standing on the
      folio, added together and rounded to the cent; the deposit already held is not one of them and
      is set against them instead.
    breakfast_total: >-
      The closing folio balance is fixed only after the folio carries the breakfast owed for the
      departure morning.
    service_fee_total: >-
      The settled charges are the room nights, the statutory charges, the property facility fee, the
      parking, the occupancy supplement, the breakfast and the agency service fee standing on the
      folio, added together and rounded to the cent; the deposit already held is not one of them and
      is set against them instead.
    deposit_total: >-
      The settled charges are the room nights, the statutory charges, the property facility fee, the
      parking, the occupancy supplement, the breakfast and the agency service fee standing on the
      folio, added together and rounded to the cent; the deposit already held is not one of them and
      is set against them instead.
    settled_charges: >-
      The settled charges are the room nights, the statutory charges, the property facility fee, the
      parking, the occupancy supplement, the breakfast and the agency service fee standing on the
      folio, added together and rounded to the cent; the deposit already held is not one of them and
      is set against them instead.
    programme_active: >-
      Where the reservation is made under an active corporate programme whose credit limit is at or
      above the high credit limit, the direct billed share is the full direct bill share.
    programme_credit_limit: >-
      Where the reservation is made under an active corporate programme whose credit limit is at or
      above the mid credit limit but below the high credit limit, the direct billed share is the part
      direct bill share.
    direct_bill_share_pct: >-
      Where the reservation is made under an active corporate programme whose credit limit is at or
      above the high credit limit, the direct billed share is the full direct bill share. Where the
      reservation is made under an active corporate programme whose credit limit is at or above the
      mid credit limit but below the high credit limit, the direct billed share is the part direct
      bill share. In every other case the direct billed share is nil.
    posted_night_count: >-
      Where the corporate programme the reservation is made under carries consolidated invoicing and
      the room nights standing on the folio number the busy stay nights or more, the direct billed
      base is the room nights, the statutory charges and the property facility fee taken together.
    programme_consolidated: >-
      Where that programme carries consolidated invoicing and the room nights standing on the folio
      number fewer than the busy stay nights, the direct billed base is the room nights and the
      statutory charges taken together.
    direct_bill_base: >-
      Where the corporate programme the reservation is made under carries consolidated invoicing and
      the room nights standing on the folio number the busy stay nights or more, the direct billed
      base is the room nights, the statutory charges and the property facility fee taken together.
      Where that programme carries consolidated invoicing and the room nights standing on the folio
      number fewer than the busy stay nights, the direct billed base is the room nights and the
      statutory charges taken together. In every other case the direct billed base is the room nights
      alone.
    direct_billed: >-
      The direct billed amount is the direct billed share of the direct billed base, rounded to the
      cent, and the departure service charge is the service charge rate of the breakfast standing on
      the folio, rounded to the cent.
    notice_lines: >-
      A goodwill reduction is given where the property has advised a change to the reservation.
    nights_covered: >-
      Where the folio carries a property notice about the reservation and the reservation covers the
      long stay nights or more, the goodwill reduction is the full goodwill amount; where the folio
      carries a property notice about the reservation and the reservation covers fewer than the long
      stay nights, the goodwill reduction is the part goodwill amount; and where the folio carries no
      property notice about the reservation, the goodwill reduction is nil.
    goodwill_reduction_usd: >-
      Where the folio carries a property notice about the reservation and the reservation covers the
      long stay nights or more, the goodwill reduction is the full goodwill amount; where the folio
      carries a property notice about the reservation and the reservation covers fewer than the long
      stay nights, the goodwill reduction is the part goodwill amount; and where the folio carries no
      property notice about the reservation, the goodwill reduction is nil.
    facility_lines: >-
      A service fee waiver is given according to the nights of property facility fee standing on the
      folio.
    service_fee_waiver_usd: >-
      Where the folio carries the full waiver facility lines or more, the service fee waiver is the
      full service fee waiver; where it carries the part waiver facility lines or more but fewer than
      the full waiver facility lines, the service fee waiver is the part service fee waiver; and
      where it carries fewer than the part waiver facility lines, the service fee waiver is nil.
    onsite_lines: >-
      A departure service charge is added on the breakfast standing on the folio.
    service_charge_rate_pct: >-
      Where the on-site extras standing on the folio number the busy on-site lines or more, the
      service charge rate is the high service charge rate; where they number the some on-site lines
      or more but fewer than the busy on-site lines, the service charge rate is the standard service
      charge rate; and where they number fewer than the some on-site lines, the service charge rate
      is nil.
    departure_service_charge: >-
      The direct billed amount is the direct billed share of the direct billed base, rounded to the
      cent, and the departure service charge is the service charge rate of the breakfast standing on
      the folio, rounded to the cent.
    parking_lines: >-
      A parking rebate is given according to the nights of parking standing on the folio.
    parking_rebate_usd: >-
      Where the folio carries the weekly parking lines or more, the parking rebate is the full
      parking rebate; where it carries the multi day parking lines or more but fewer than the weekly
      parking lines, the parking rebate is the part parking rebate; and where it carries fewer than
      the multi day parking lines, the parking rebate is nil.
    result: >-
      The closing folio balance is the settled charges less the direct billed amount, less the
      deposit already held, less the goodwill reduction, less the service fee waiver, less the
      parking rebate and plus the departure service charge, rounded to the cent.
  factors:
  - id: direct_bill_share
    effect: parameter
    decides: direct_bill_share_pct
    bindings: [programme_active, programme_credit_limit, direct_bill_share_pct]
    ladder:
    - when: "the reservation is made under an active corporate programme whose credit limit is at or above the high credit limit"
      value: "K('full_direct_bill_pct')"
    - when: "the reservation is made under an active corporate programme whose credit limit is at or above the mid credit limit but below the high credit limit"
      value: "K('part_direct_bill_pct')"
    - when: "otherwise"
      value: "nil"
    baseline:
      direct_bill_share_pct: "0"
    evidence: [cross_category]
    cross_difficulty: biz
  - id: direct_bill_scope
    effect: method
    decides: direct_bill_base
    bindings: [posted_night_count, programme_consolidated, direct_bill_base]
    ladder:
    - when: "the corporate programme the reservation is made under carries consolidated invoicing and the room nights standing on the folio number the busy stay nights or more"
      method: "the direct billed base is the room nights, the statutory charges and the property facility fee taken together"
    - when: "that programme carries consolidated invoicing and the room nights standing on the folio number fewer than the busy stay nights"
      method: "the direct billed base is the room nights and the statutory charges taken together"
    - when: "otherwise"
      method: "the direct billed base is the room nights alone"
    baseline:
      direct_bill_base: "RND(room_total, 2)"
    evidence: [history, cross_category]
    cross_difficulty: biz
  - id: property_notice_goodwill
    effect: parameter
    decides: goodwill_reduction_usd
    bindings: [notice_lines, nights_covered, goodwill_reduction_usd]
    ladder:
    - when: "the folio carries a property notice about the reservation and the reservation covers the long stay nights or more"
      value: "K('full_goodwill_usd')"
    - when: "the folio carries a property notice about the reservation and the reservation covers fewer than the long stay nights"
      value: "K('part_goodwill_usd')"
    - when: "otherwise"
      value: "nil"
    baseline:
      goodwill_reduction_usd: "0"
    evidence: [history, date]
    cross_difficulty: null
  - id: service_fee_waiver
    effect: parameter
    decides: service_fee_waiver_usd
    bindings: [facility_lines, service_fee_waiver_usd]
    ladder:
    - when: "the folio carries the full waiver facility lines or more of property facility fee"
      value: "K('full_service_fee_waiver_usd')"
    - when: "the folio carries the part waiver facility lines or more but fewer than the full waiver facility lines of property facility fee"
      value: "K('part_service_fee_waiver_usd')"
    - when: "otherwise"
      value: "nil"
    baseline:
      service_fee_waiver_usd: "0"
    evidence: [history]
    cross_difficulty: null
  - id: departure_service_charge_rate
    effect: parameter
    decides: service_charge_rate_pct
    bindings: [onsite_lines, service_charge_rate_pct]
    ladder:
    - when: "the on-site extras standing on the folio number the busy on-site lines or more"
      value: "K('high_service_charge_pct')"
    - when: "the on-site extras standing on the folio number the some on-site lines or more but fewer than the busy on-site lines"
      value: "K('standard_service_charge_pct')"
    - when: "otherwise"
      value: "nil"
    baseline:
      service_charge_rate_pct: "0"
    evidence: [history]
    cross_difficulty: null
  - id: parking_rebate_tier
    effect: parameter
    decides: parking_rebate_usd
    bindings: [parking_lines, parking_rebate_usd]
    ladder:
    - when: "the folio carries the weekly parking lines or more of parking"
      value: "K('full_parking_rebate_usd')"
    - when: "the folio carries the multi day parking lines or more but fewer than the weekly parking lines of parking"
      value: "K('part_parking_rebate_usd')"
    - when: "otherwise"
      value: "nil"
    baseline:
      parking_rebate_usd: "0"
    evidence: [history]
    cross_difficulty: null
  baseline:
    rule: >-
      The closing folio balance is the figure the guest settles when the folio is closed off at
      departure. The settled charges are the room nights, the statutory charges, the property
      facility fee, the parking, the occupancy supplement, the breakfast and the agency service fee
      standing on the folio, added together and rounded to the cent; the deposit already held is not
      one of them and is set against them instead. The closing folio balance is the settled charges
      less the direct billed amount, less the deposit already held, less the goodwill reduction, less
      the service fee waiver, less the parking rebate and plus the departure service charge, rounded
      to the cent. Under the standard method the direct billed base is the room nights alone, the
      direct billed share is nil, the goodwill reduction is nil, the service fee waiver is nil, the
      parking rebate is nil and the departure service charge is nil. The direct billed amount is the
      direct billed share of the direct billed base, rounded to the cent, and the departure service
      charge is the service charge rate of the breakfast standing on the folio, rounded to the cent.
    params: []
