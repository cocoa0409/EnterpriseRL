  compute:
  - grant_total: "SUM('stay_folio_entries','amount_usd', event_type='stay_resort_credit_grant')"
  - use_total: "SUM('stay_folio_entries','amount_usd', event_type='stay_resort_credit_use')"
  - notice_lines: "COUNT('stay_folio_entries', event_type='stay_property_notice')"
  - days_to_departure: "DAYS(NOW, F('check_out_date'))"
  - credit_standing: "RND(grant_total, 2) if (notice_lines >= 1 and days_to_departure <= 0) else (0.0 if (notice_lines < 1 and days_to_departure <= 0) else RND(grant_total + use_total, 2))"
  - club_tier_held: "CFIELD('club','variant_name', status='active')"
  - club_stay_rows: "XCOUNT('club','club_points_entries', within_months=12, date_field='posted_date', accrual_source='stay_night')"
  - treatment_share_pct: "K('premier_treatment_share_pct') if ((club_tier_held == 'Wanderlane Platinum' or club_tier_held == 'Wanderlane Titanium' or club_tier_held == 'Wanderlane Ambassador') and club_stay_rows >= K('premier_stay_rows')) else (K('regular_treatment_share_pct') if (club_tier_held == 'Wanderlane Gold' and club_stay_rows >= K('regular_stay_rows')) else K('standard_treatment_share_pct'))"
  - treatment_allowance: "RND(credit_standing * treatment_share_pct / 100, 2)"
  - lead_treatment_charges: "SUM('stay_folio_entries','amount_usd', charge_category='incidental_spa', guest_sequence=1)"
  - treatment_release: "MN(treatment_allowance, lead_treatment_charges)"
  - remaining_allowance: "RND(credit_standing - treatment_allowance, 2)"
  - minibar_lines: "COUNT('stay_folio_entries', charge_category='incidental_minibar')"
  - onsite_lines: "COUNT('stay_folio_entries', event_type='stay_incidental_charge')"
  - counted_minibar: "SUM('stay_folio_entries','amount_usd', charge_category='incidental_minibar', guest_sequence=1) if (minibar_lines >= K('busy_minibar_lines') and onsite_lines >= K('busy_onsite_lines')) else (MAX('stay_folio_entries','amount_usd', charge_category='incidental_minibar', guest_sequence=1) if (minibar_lines >= K('busy_minibar_lines') and onsite_lines < K('busy_onsite_lines')) else LATEST('stay_folio_entries','amount_usd', date_field='posted_date', charge_category='incidental_minibar', guest_sequence=1))"
  - minibar_charges: "SUM('stay_folio_entries','amount_usd', charge_category='incidental_minibar')"
  - minibar_cover_pct: "K('full_minibar_cover_pct') if minibar_charges >= K('heavy_minibar_usd') else (K('part_minibar_cover_pct') if minibar_charges >= K('light_minibar_usd') else K('standard_minibar_cover_pct'))"
  - covered_minibar: "RND(counted_minibar * minibar_cover_pct / 100, 2)"
  - upgrade_nights: "COUNT('stay_folio_entries', charge_category='room_upgrade')"
  - upgrade_credit_per_night: "K('high_upgrade_credit_usd') if upgrade_nights >= K('long_upgrade_nights') else (K('low_upgrade_credit_usd') if upgrade_nights >= K('short_upgrade_nights') else 0)"
  - covered_upgrade: "RND(upgrade_nights * upgrade_credit_per_night, 2)"
  - companion_lines: "COUNT('stay_folio_entries', event_type='stay_incidental_charge', guest_sequence=2)"
  - companion_allowance: "K('full_companion_allowance_usd') if (P('resort_credit_transferable') and companion_lines >= K('many_companion_lines')) else (K('part_companion_allowance_usd') if (P('resort_credit_transferable') and companion_lines >= K('some_companion_lines')) else 0)"
  - companion_charges: "SUM('stay_folio_entries','amount_usd', event_type='stay_incidental_charge', guest_sequence=2)"
  - companion_release: "MN(companion_allowance, companion_charges)"
  - covered_remaining: "RND(covered_minibar + covered_upgrade + companion_release, 2)"
  - remaining_release: "MN(remaining_allowance, covered_remaining)"
  - result: "RND(treatment_release + remaining_release, 2)"
