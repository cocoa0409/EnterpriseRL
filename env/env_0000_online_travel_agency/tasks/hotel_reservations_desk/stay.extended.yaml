  baseline:
    rule: >-
      The closing credit release is the property credit put against the on-site charges standing on
      a reservation when the guest settles before departure, and it is the treatment release and the
      remaining release added together and rounded to the cent. Under the standard method the credit
      standing on the reservation is the arrival grant less every use already posted to the credit
      account, the treatment share is the standard treatment share, the credit is put against the
      latest minibar charge taken by the lead guest alone, that minibar charge is covered at the
      standard minibar cover rate, nothing of a room upgrade is covered and no companion allowance
      is set aside. The treatment allowance is the treatment share of the credit standing, rounded
      to the cent, and the treatment release is the treatment allowance or the treatment charges
      taken by the lead guest, whichever is the smaller. What is left of the credit standing after
      the treatment allowance is set aside is the remaining allowance, and the remaining release is
      the remaining allowance or the covered remaining charges, whichever is the smaller. The
      covered remaining charges are the covered minibar amount, the covered upgrade amount and the
      companion release added together and rounded to the cent, where the companion release is the
      companion allowance or the on-site charges taken by an occupant other than the lead guest,
      whichever is the smaller. The covered minibar amount is the minibar cover rate of the counted
      minibar figure, rounded to the cent. The covered upgrade amount is the upgrade credit
      multiplied by the nights the upgrade was charged, rounded to the cent. The closing credit
      release is recorded as one line against the largest treatment charge standing on the folio,
      and no separate line is raised for each charge it covers.
    params: [standard_treatment_share_pct, standard_minibar_cover_pct]
  inputs:
    history:
    - {table: stay_folio_entries, aggregate: sum, field: amount_usd, within_months: null, filters: {event_type: stay_resort_credit_grant}}
    - {table: stay_folio_entries, aggregate: sum, field: amount_usd, within_months: null, filters: {event_type: stay_resort_credit_use}}
    - {table: stay_folio_entries, aggregate: sum, field: amount_usd, within_months: null, filters: {charge_category: incidental_minibar}}
    - {table: stay_folio_entries, aggregate: count, field: stay_folio_entry_id, within_months: null, filters: {charge_category: room_upgrade}}
    - {category: club, table: club_points_entries, aggregate: count, field: club_points_entry_id, within_months: 12, filters: {accrual_source: stay_night}}
    cross_category: [club]
- id: stay_ext_closing_night_charge
  base_policy_refs: [stay_agg_portfolio_occupancy, stay_room_and_occupancy, stay_club_and_corporate_interaction]
  overwrite:
  - base_policy: stay_room_and_occupancy
    superseded_clause: >-
      The room rate is posted night by night and room by room, at the rate the plan was sold at, and
      a rate once sold is never re-priced because the property's published rate has moved.
    replaced_by: >-
      The closing night charge is the room rate posted for the last night of a stay when the folio is
      brought up to date before departure, and it is worked out from a closing rate reduced in turn
      by three reductions.
  trigger: state_due
  subject: [stay_room_charge]
  computes: room_night_amount_usd
  target_tool: post_closing_room_night_00233ccc
  params:
    busy_stay_nights: 5
    preferred_discount_floor_pct: 8
    hotel_fee_floor_usd: 18
    standard_corporate_discount_pct: 3
    long_taper_nights: 7
    short_taper_nights: 4
    long_taper_pct: 12
    short_taper_pct: 6
    early_booking_days: 45
    standard_booking_days: 14
    early_booking_reduction_pct: 7
    standard_booking_reduction_pct: 3
  rule: >
    The closing night charge is the room rate posted for the last night of a stay when the folio is
    brought up to date before departure, and it is worked out from a closing rate reduced in turn by
    three reductions. Under the standard method the closing rate is the rate of the latest room night
    already posted to the folio, the corporate reduction is nil, the length reduction is nil and the
    advance booking reduction is nil, and the closing night charge is the closing rate rounded to the
    cent. The three reductions act one after another and never on the same base: the corporate
    reduction is taken off the closing rate and the figure that step gives, rounded to the cent, is
    the base the length reduction acts on; the figure the length reduction gives, rounded to the
    cent, is in turn the base the advance booking reduction acts on; and the figure that last step
    gives, rounded to the cent, is the closing night charge. The reductions are never combined into
    one rate and applied once.

    Where the folio carries a property notice about the reservation and the room nights already
    posted number the busy stay nights or more, the closing rate is the average of the room nights
    already posted, rounded to the cent. Where the folio carries a property notice about the
    reservation and the room nights already posted number fewer than the busy stay nights, the
    closing rate is the highest room night already posted. In every other case the closing rate is
    the rate of the latest room night already posted to the folio.

    A corporate reduction is taken off the closing rate where the reservation is made under a
    corporate travel programme. No club discount is applied to the closing night charge on top of the
    corporate reduction, the two never standing together on one reservation. Where the reservation is
    made under an active corporate programme
    whose negotiated hotel discount is at or above the preferred discount floor, the corporate
    reduction is that programme's own negotiated hotel discount. Where the reservation is made under
    an active corporate programme whose negotiated hotel discount is below the preferred discount
    floor, and the hotel booking fees billed to that programme in the last twelve months come to the
    hotel fee floor or more, the corporate reduction is the standard corporate discount. In every other
    case the corporate reduction is nil. Only lines billed as a hotel booking fee are counted in that
    twelve-month figure, and lines posted more than twelve months before the closing night is priced
    are not counted.

    A length reduction is taken off according to the nights the reservation covers, counted from the
    arrival date to the departure date. Where the reservation covers the long taper nights or more,
    the length reduction is the long taper rate; where it covers the short taper nights or more but
    fewer than the long taper nights, the length reduction is the short taper rate; and where it
    covers fewer than the short taper nights, the length reduction is nil.

    An advance booking reduction is taken off according to the calendar days between the day the
    reservation was made and the arrival date. Where those days number the early booking days or
    more, the advance booking reduction is the early booking rate; where they number the standard
    booking days or more but fewer than the early booking days, the advance booking reduction is the
    standard booking rate; and where they number fewer than the standard booking days, the advance
    booking reduction is nil.
  prerequisite: []
  cross_category:
  - category: biz
    as: branch
    reads: [negotiated_hotel_discount_pct, biz_billing_entries.amount_usd]
    note: >-
      The corporate reduction taken off the closing rate is decided from the negotiated hotel
      discount of the active corporate programme the reservation is made under and from the hotel
      booking fees billed to that programme in the last twelve months.
  compute:
  - notice_lines: "COUNT('stay_folio_entries', event_type='stay_property_notice')"
  - posted_night_count: "COUNT('stay_folio_entries', charge_category='room_night')"
  - posted_night_total: "SUM('stay_folio_entries','amount_usd', charge_category='room_night')"
  - highest_posted_night: "MAX('stay_folio_entries','amount_usd', charge_category='room_night')"
  - latest_posted_night: "LATEST('stay_folio_entries','amount_usd', date_field='posted_date', charge_category='room_night')"
  - closing_rate: "RND(posted_night_total / posted_night_count, 2) if (notice_lines >= 1 and posted_night_count >= K('busy_stay_nights')) else (highest_posted_night if (notice_lines >= 1 and posted_night_count < K('busy_stay_nights')) else latest_posted_night)"
  - programme_held: "EXISTS('biz', status='active')"
  - programme_hotel_discount: "CPARAM('biz','negotiated_hotel_discount_pct', status='active')"
  - programme_hotel_fees_12m: "XSUM('biz','biz_billing_entries','amount_usd', within_months=12, date_field='posted_date', charge_category='hotel_booking_fee')"
  - corporate_reduction_pct: "programme_hotel_discount if (programme_held and programme_hotel_discount >= K('preferred_discount_floor_pct')) else (K('standard_corporate_discount_pct') if (programme_held and programme_hotel_discount < K('preferred_discount_floor_pct') and programme_hotel_fees_12m >= K('hotel_fee_floor_usd')) else 0)"
  - corporate_rate: "RND(closing_rate * (100 - corporate_reduction_pct) / 100, 2)"
  - nights_covered: "DAYS(F('check_in_date'), F('check_out_date'))"
  - length_reduction_pct: "K('long_taper_pct') if nights_covered >= K('long_taper_nights') else (K('short_taper_pct') if nights_covered >= K('short_taper_nights') else 0)"
  - tapered_rate: "RND(corporate_rate * (100 - length_reduction_pct) / 100, 2)"
  - booking_lead_days: "DAYS(F('booked_date'), F('check_in_date'))"
  - advance_reduction_pct: "K('early_booking_reduction_pct') if booking_lead_days >= K('early_booking_days') else (K('standard_booking_reduction_pct') if booking_lead_days >= K('standard_booking_days') else 0)"
  - result: "RND(tapered_rate * (100 - advance_reduction_pct) / 100, 2)"
  compute_basis:
    notice_lines: >-
      Where the folio carries a property notice about the reservation and the room nights already
      posted number fewer than the busy stay nights, the closing rate is the highest room night
      already posted.
    posted_night_count: >-
      Where the folio carries a property notice about the reservation and the room nights already
      posted number the busy stay nights or more, the closing rate is the average of the room nights
      already posted, rounded to the cent.
    posted_night_total: >-
      Where the folio carries a property notice about the reservation and the room nights already
      posted number the busy stay nights or more, the closing rate is the average of the room nights
      already posted, rounded to the cent.
    highest_posted_night: >-
      Where the folio carries a property notice about the reservation and the room nights already
      posted number fewer than the busy stay nights, the closing rate is the highest room night
      already posted.
    latest_posted_night: >-
      In every other case the closing rate is the rate of the latest room night already posted to the
      folio.
    closing_rate: >-
      Where the folio carries a property notice about the reservation and the room nights already
      posted number the busy stay nights or more, the closing rate is the average of the room nights
      already posted, rounded to the cent. Where the folio carries a property notice about the
      reservation and the room nights already posted number fewer than the busy stay nights, the
      closing rate is the highest room night already posted. In every other case the closing rate is
      the rate of the latest room night already posted to the folio.
    programme_held: >-
      A corporate reduction is taken off the closing rate where the reservation is made under a
      corporate travel programme. No club discount is applied to the closing night charge on top of
      the corporate reduction, the two never standing together on one reservation.
    programme_hotel_discount: >-
      Where the reservation is made under an active corporate programme whose negotiated hotel
      discount is at or above the preferred discount floor, the corporate reduction is that
      programme's own negotiated hotel discount.
    programme_hotel_fees_12m: >-
      Only lines billed as a hotel booking fee are counted in that twelve-month figure, and lines
      posted more than twelve months before the closing night is priced are not counted.
    corporate_reduction_pct: >-
      Where the reservation is made under an active corporate programme whose negotiated hotel
      discount is at or above the preferred discount floor, the corporate reduction is that
      programme's own negotiated hotel discount. Where the reservation is made under an active
      corporate programme whose negotiated hotel discount is below the preferred discount floor, and
      the hotel booking fees billed to that programme in the last twelve months come to the hotel fee floor or more, the corporate reduction is the standard corporate discount. In every other case
      the corporate reduction is nil.
    corporate_rate: >-
      The three reductions act one after another and never on the same base: the corporate reduction
      is taken off the closing rate and the figure that step gives, rounded to the cent, is the base
      the length reduction acts on; the figure the length reduction gives, rounded to the cent, is in
      turn the base the advance booking reduction acts on; and the figure that last step gives,
      rounded to the cent, is the closing night charge.
    nights_covered: >-
      A length reduction is taken off according to the nights the reservation covers, counted from
      the arrival date to the departure date.
    length_reduction_pct: >-
      Where the reservation covers the long taper nights or more, the length reduction is the long
      taper rate; where it covers the short taper nights or more but fewer than the long taper
      nights, the length reduction is the short taper rate; and where it covers fewer than the short
      taper nights, the length reduction is nil.
    tapered_rate: >-
      The three reductions act one after another and never on the same base: the corporate reduction
      is taken off the closing rate and the figure that step gives, rounded to the cent, is the base
      the length reduction acts on; the figure the length reduction gives, rounded to the cent, is in
      turn the base the advance booking reduction acts on; and the figure that last step gives,
