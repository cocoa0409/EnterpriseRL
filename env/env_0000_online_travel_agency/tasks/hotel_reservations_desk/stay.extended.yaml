  baseline:
    rule: >-
      The closing night charge is the room rate posted for the last night of a stay when the folio is
      brought up to date before departure, and it is worked out from a closing rate reduced in turn
      by three reductions. Under the standard method the closing rate is the rate of the latest room
      night already posted to the folio, the corporate reduction is nil, the length reduction is nil
      and the advance booking reduction is nil, and the closing night charge is the closing rate
      rounded to the cent. The three reductions act one after another and never on the same base: the
      corporate reduction is taken off the closing rate and the figure that step gives, rounded to
      the cent, is the base the length reduction acts on; the figure the length reduction gives,
      rounded to the cent, is in turn the base the advance booking reduction acts on; and the figure
      that last step gives, rounded to the cent, is the closing night charge. The reductions are
      never combined into one rate and applied once.
