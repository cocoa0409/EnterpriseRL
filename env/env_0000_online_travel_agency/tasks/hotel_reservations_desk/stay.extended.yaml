    - when: "the folio carries an occupancy supplement for the stay and the reservation covers fewer than the long stay nights"
      method: "the taxable base is the closing room charge together with the rate plan's property facility fee for that night, where the plan does not waive it, and its parking charge for that night, where parking stands on the folio for the stay"
    - when: "otherwise"
