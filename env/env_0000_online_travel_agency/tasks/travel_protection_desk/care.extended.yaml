- id: care_claim_filing
  subject:
  - care_claim_file
  rule: A claim is filed against one named benefit for one incident, and a single incident that touches two benefits is filed as two claims. The traveller states in this conversation the date on which the
    incident they are claiming for occurred. A claim is filed only while the policy record stands in force or expired. A claim is filed only when no claim carrying the same claim reference has already been
    filed on this policy. A claim must be filed within the plan's filing deadline counted from the incident, and supporting documents must reach the insurer within the plan's document deadline counted from
    filing; a claim filed late is declined for lateness alone. A baggage delay claim is payable only from the plan's delay trigger onward, a travel delay claim only from its delay trigger onward, and a
    missed connection claim only from its own trigger; a delay short of the trigger gives rise to no claim at all. A cancel-for-any-reason claim is filed only on a plan that includes it, only where notice
    was given at least the plan's notice hours before departure, and only where the trip was cancelled outright rather than changed.
  eligibility:
  - id: incident_date_stated
    applies_to:
    - care_claim_file
    kind: caller_fact
    condition: The traveller states in this conversation the date on which the incident they are claiming for occurred.
    evidence_fields:
    - care_claims.incident_date
    - care_claims.claim_reference
    evidence_contract:
      authority: caller_statement
      timing: pre_action
      correlation_keys:
      - - care_claims.claim_reference
      action_bindings:
        care_claims.claim_reference: claim_reference
  - id: policy_covers_the_incident
    applies_to:
    - care_claim_file
    kind: state
    condition: A claim is filed only while the policy record stands in force or expired.
    evidence_fields:
    - care_policies.status
    - care_policies.care_policy_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - care_policies.care_policy_id
      action_bindings:
        care_policies.care_policy_id: care_policy_id
    state_contract:
      field: care_policies.status
