    - when: "the claim the insurer allowed names the evidence that supports it and that evidence reached the insurer within the plan's deadline for supporting documents counted from the day the claim was filed"
      value: "K('documented_allowance_share_pct')"
    - when: "the claim the insurer allowed names the evidence that supports it and that evidence reached the insurer after that deadline"
      value: "K('late_document_share_pct')"
    - when: "otherwise"
      value: "K('undocumented_allowance_share_pct')"
    baseline:
      document_share: "K('undocumented_allowance_share_pct')"
    evidence: [history, date]
    cross_difficulty: null
  - id: deductible_called_for_rate
    effect: parameter
    decides: deductible_called_for
    bindings: [deductible_withheld_total, deductible_headroom, deductible_called_for]
    ladder:
    - when: "the benefit allowed is the emergency medical benefit and the certificate has not reached the plan's ceiling on deductibles withheld"
      value: "P('medical_deductible_usd')"
    - when: "the benefit allowed is any other benefit and the certificate has not reached the plan's ceiling on deductibles withheld"
      value: "P('deductible_per_claim_usd')"
    - when: "otherwise"
      value: "K('ceiling_reached_deductible_usd')"
    baseline:
      deductible_called_for: "K('ceiling_reached_deductible_usd')"
    evidence: [history, tier_param]
    cross_difficulty: null
  - id: deductible_ceiling_basis
    effect: method
    decides: deductible_applied
    bindings: [term_withholdings, deductible_applied]
    ladder:
    - when: "the certificate has settled a payment in this policy term and what remains of the plan's ceiling is less than the deductible the benefit calls for"
      method: "the deductible withheld is what remains of the plan's ceiling"
    - when: "the certificate has settled a payment in this policy term and what remains of the plan's ceiling is the deductible the benefit calls for or more"
      method: "the deductible withheld is the deductible the benefit calls for"
    - when: "otherwise"
      method: "the deductible withheld is the deductible the benefit calls for taken once for each insured traveller named on the certificate"
    baseline:
      deductible_applied: "deductible_called_for * F('insured_count')"
    evidence: [history]
    cross_difficulty: null
  baseline:
    rule: >-
      A decision the insurer has allowed on a certificate is settled by one payment to the
      policyholder. The allowance taken is the allowance on the decision the insurer reached last,
      taken at the share which the evidence supporting the claim carries. The share which the
      evidence supporting the claim carries is fifty per cent. The limit the benefit claimed carries
      is the plan's amount for that benefit taken once for each insured traveller named on the
      certificate. What remains of the limit is that limit less the benefit the certificate records
      as consumed, and it never falls below nothing. The benefit the certificate records as consumed
      is the figure its benefit account carries. The deductible the benefit calls for is nothing. The
      deductible withheld is the deductible the benefit calls for taken once for each insured
      traveller named on the certificate. The settlement paid is the lesser of the allowance taken
      and what remains of the limit, less the deductible withheld, and it is rounded to two decimal
      places and never falls below nothing.
    params: [undocumented_allowance_share_pct, ceiling_reached_deductible_usd, baggage_loss_limit_usd, deductible_per_policy_usd]
  inputs:
    history:
    - {table: care_claims, aggregate: latest, field: paid_amount_usd, within_months: null, filters: {event_type: care_claim_decision}}
    - {table: care_claims, aggregate: sum, field: paid_amount_usd, within_months: null, filters: {event_type: care_claim_payout}}
    - {table: care_claims, aggregate: sum, field: paid_amount_usd, within_months: null, filters: {event_type: care_claim_recovery}}
    - {table: care_claims, aggregate: sum, field: deductible_applied_usd, within_months: null, filters: {event_type: care_claim_payout}}
    cross_category: []
- id: care_ext_declared_cost_restatement
  base_policy_refs: [care_policy_amendment, care_club_and_bundle_interaction]
  overwrite:
  - base_policy: care_policy_amendment
    superseded_clause: >-
      An increase in the declared trip cost is accepted only up to the plan's ceiling
    replaced_by: >-
      The corrected declared trip cost is the outlay so taken, rounded to two decimal places, and it
      is never declared above the ceiling that applies to it.
  - base_policy: care_policy_amendment
    superseded_clause: >-
      No amendment is accepted once the journey has begun or once a claim has been filed, because the
      risk is then no longer uncertain.
    replaced_by: >-
      A correction the underwriting desk has approved is carried onto the certificate whenever it is
      found, whether or not the journey insured has begun or ended, because it restates what the
      journey actually carried rather than altering the risk the certificate covers.
  - base_policy: care_policy_amendment
    superseded_clause: >-
      A declared particular of the risk may be corrected while the policy stands, and the premium
      follows the correction from the day it takes effect.
    replaced_by: >-
      The correction is made on a certificate standing in any state other than cancelled, the expired
      state included, because an expired certificate still answers for the journey it insured.
  trigger: state_due
  subject: [care_insured_amend]
  computes: corrected_trip_cost_usd
  target_tool: restate_declared_trip_cost_4b2fbffa
  params:
    cash_return_pct: 100
    open_credit_pct: 75
    lapsed_credit_pct: 0
    whole_party_pct: 100
  rule: >
    A correction the underwriting desk has approved is carried onto the certificate whenever it is
    found, whether or not the journey insured has begun or ended, because it restates what the
    journey actually carried rather than altering the risk the certificate covers. The correction is
    made on a certificate standing in any state other than cancelled, the expired state included,
    because an expired certificate still answers for the journey it insured.
    A certificate bought alongside a vacation package is declared on the prepaid outlay standing
    against the journey insured on that package, and where the two differ the certificate is
    corrected to that outlay. The prepaid outlay is taken as the package's quoted price. The amounts the operator has returned against the package otherwise than on the surrender of the journey are recognised at nothing and taken off the outlay. What the operator returns on the surrender of the journey itself is left out of that quantity, because the declared trip cost states what stood at risk before the journey was given up, while what comes back on the surrender answers the loss rather than the declaration. The
    share of the outlay the certificate declares is the whole of it. The corrected
    declared trip cost is the outlay so taken, rounded to two decimal places, and it is never
    declared above the ceiling that applies to it. The ceiling that applies is the package's quoted
    price.
    Where the package's ledger carries a line settling the balance of the package and the package
    stands confirmed, travelling, completed or cancelled, the prepaid outlay is taken as every line
    posted to the package under its routine terms less the agency service fee charged on it. Where
    the package's ledger carries no line settling the balance and the package stands confirmed,
    travelling, completed or cancelled, the prepaid outlay is taken as the amount the package records
    as paid. Where neither holds, the prepaid outlay is taken as the package's quoted price.
    Where the package returns value to the original form of payment and an amount has been returned against it, the amounts the operator has returned otherwise than on the surrender of the journey are recognised in full. Where the package returns value only as a future travel credit and the credit standing open against it may still be redeemed after the last day of the journey insured, the amounts the operator has returned otherwise than on the surrender of the journey are recognised at three quarters. Where neither holds, the amounts the operator has returned otherwise than on the surrender of the journey are recognised at nothing.
    Where the certificate names fewer insured travellers than the package carries in its party and
    the package carries no child in its party, the share of the outlay the certificate declares is
    the share the travellers it names bear of that party. Where the certificate names fewer insured
    travellers than the package carries in its party and the package carries at least one child in
    its party, the share of the outlay the certificate declares is the share the travellers it names
    bear of the adults the package carries. Where neither holds, the share of the outlay the
    certificate declares is the whole of it.
    Where an approved correction stands against the certificate and the trip cost it states is at or
    above the outlay taken, the ceiling that applies is the plan's ceiling for the declared trip
    cost. Where an approved correction stands against the certificate and the trip cost it states is
    below the outlay taken, the ceiling that applies is the trip cost the approved correction states.
    Where neither holds, the ceiling that applies is the package's quoted price.
  prerequisite: []
  cross_category:
  - category: bundle
    as: history
    reads: [status, package_price_usd, amount_paid_usd, credit_balance_usd, refund_form, party_adults, party_children, bundle_ledger_entries.amount_usd, bundle_ledger_entries.credit_expires_on]
    note: >-
      The outlay basis, the recognition of returned value and the party share all take their tiers
      from the vacation package the cover was bought alongside and from the lines posted to it.
  compute:
  - routine_charges: "XSUM('bundle','bundle_ledger_entries','amount_usd', date_field='posted_date', reason_code='routine_package')"
  - agency_fee_lines: "XSUM('bundle','bundle_ledger_entries','amount_usd', date_field='posted_date', charge_category='agency_service_fee')"
  - ledger_outlay: "routine_charges - agency_fee_lines"
  - balance_lines: "XCOUNT('bundle','bundle_ledger_entries', date_field='posted_date', event_type='bundle_final_payment_charge')"
  - package_standing: "CFIELD('bundle','status')"
  - package_settled: "1 if (package_standing == 'confirmed' or package_standing == 'travelling' or package_standing == 'completed' or package_standing == 'cancelled') else 0"
  - outlay_basis: "ledger_outlay if (balance_lines >= 1 and package_settled == 1) else (CFIELD('bundle','amount_paid_usd') if (balance_lines < 1 and package_settled == 1) else CFIELD('bundle','package_price_usd'))"
  - returns_to_traveller: "XSUM('bundle','bundle_ledger_entries','amount_usd', date_field='posted_date', event_type='bundle_refund_payout')"
  - credits_given_back: "XSUM('bundle','bundle_ledger_entries','amount_usd', date_field='posted_date', event_type='bundle_credit_issue')"
  - returns_on_surrender: "XSUM('bundle','bundle_ledger_entries','amount_usd', date_field='posted_date', reason_code='traveller_cancellation')"
  - operator_returns: "(returns_to_traveller + credits_given_back) - returns_on_surrender"
  - package_refund_form: "CFIELD('bundle','refund_form')"
  - credit_expiry: "XLATEST('bundle','bundle_ledger_entries','credit_expires_on', date_field='posted_date', event_type='bundle_credit_issue')"
  - recognition_share: "K('cash_return_pct') if (package_refund_form == 'original_payment' and operator_returns != 0) else (K('open_credit_pct') if (package_refund_form == 'future_travel_credit' and credit_expiry > F('trip_end_date')) else K('lapsed_credit_pct'))"
  - recognised_returns: "operator_returns * recognition_share/100.0"
  - party_children: "CFIELD('bundle','party_children')"
  - party_total: "CFIELD('bundle','party_adults') + party_children"
  - party_share: "(100.0*F('insured_count')/party_total) if (F('insured_count') < party_total and party_children == 0) else ((100.0*F('insured_count')/CFIELD('bundle','party_adults')) if (F('insured_count') < party_total and party_children > 0) else K('whole_party_pct'))"
  - declared_before_ceiling: "(outlay_basis + recognised_returns) * party_share/100.0"
  - requested_cost: "MAX('care_policy_requests','requested_trip_cost_usd', request_status='approved', request_type='trip_cost_amendment')"
  - declared_ceiling: "P('max_trip_cost_usd') if (requested_cost > 0 and requested_cost >= declared_before_ceiling) else (requested_cost if (requested_cost > 0 and requested_cost < declared_before_ceiling) else CFIELD('bundle','package_price_usd'))"
  - result: "RND(MN(declared_before_ceiling, declared_ceiling), 2)"
  compute_basis:
    routine_charges: "Where the package's ledger carries a line settling the balance of the package and the package stands confirmed, travelling, completed or cancelled, the prepaid outlay is taken as every line posted to the package under its routine terms less the agency service fee charged on it."
    agency_fee_lines: "Where the package's ledger carries a line settling the balance of the package and the package stands confirmed, travelling, completed or cancelled, the prepaid outlay is taken as every line posted to the package under its routine terms less the agency service fee charged on it."
    ledger_outlay: "Where the package's ledger carries a line settling the balance of the package and the package stands confirmed, travelling, completed or cancelled, the prepaid outlay is taken as every line posted to the package under its routine terms less the agency service fee charged on it."
    balance_lines: "Where the package's ledger carries no line settling the balance and the package stands confirmed, travelling, completed or cancelled, the prepaid outlay is taken as the amount the package records as paid."
    package_standing: "Where neither holds, the prepaid outlay is taken as the package's quoted price."
    package_settled: "Where the package's ledger carries a line settling the balance of the package and the package stands confirmed, travelling, completed or cancelled, the prepaid outlay is taken as every line posted to the package under its routine terms less the agency service fee charged on it."
    outlay_basis: "Where the package's ledger carries a line settling the balance of the package and the package stands confirmed, travelling, completed or cancelled, the prepaid outlay is taken as every line posted to the package under its routine terms less the agency service fee charged on it. Where the package's ledger carries no line settling the balance and the package stands confirmed, travelling, completed or cancelled, the prepaid outlay is taken as the amount the package records as paid. Where neither holds, the prepaid outlay is taken as the package's quoted price."
    returns_to_traveller: "The amounts the operator has returned against the package otherwise than on the surrender of the journey are recognised at nothing and taken off the outlay."
    credits_given_back: "The amounts the operator has returned against the package otherwise than on the surrender of the journey are recognised at nothing and taken off the outlay."
    returns_on_surrender: "What the operator returns on the surrender of the journey itself is left out of that quantity, because the declared trip cost states what stood at risk before the journey was given up, while what comes back on the surrender answers the loss rather than the declaration."
    operator_returns: "The amounts the operator has returned against the package otherwise than on the surrender of the journey are recognised at nothing and taken off the outlay."
    package_refund_form: "Where the package returns value to the original form of payment and an amount has been returned against it, the amounts the operator has returned otherwise than on the surrender of the journey are recognised in full."
    credit_expiry: "Where the package returns value only as a future travel credit and the credit standing open against it may still be redeemed after the last day of the journey insured, the amounts the operator has returned otherwise than on the surrender of the journey are recognised at three quarters."
    recognition_share: "Where the package returns value to the original form of payment and an amount has been returned against it, the amounts the operator has returned otherwise than on the surrender of the journey are recognised in full. Where the package returns value only as a future travel credit and the credit standing open against it may still be redeemed after the last day of the journey insured, the amounts the operator has returned otherwise than on the surrender of the journey are recognised at three quarters. Where neither holds, the amounts the operator has returned otherwise than on the surrender of the journey are recognised at nothing."
    recognised_returns: "The amounts the operator has returned against the package otherwise than on the surrender of the journey are recognised at nothing and taken off the outlay."
    party_children: "Where the certificate names fewer insured travellers than the package carries in its party and the package carries at least one child in its party, the share of the outlay the certificate declares is the share the travellers it names bear of the adults the package carries."
    party_total: "Where the certificate names fewer insured travellers than the package carries in its party and the package carries no child in its party, the share of the outlay the certificate declares is the share the travellers it names bear of that party."
    party_share: "Where the certificate names fewer insured travellers than the package carries in its party and the package carries no child in its party, the share of the outlay the certificate declares is the share the travellers it names bear of that party. Where the certificate names fewer insured travellers than the package carries in its party and the package carries at least one child in its party, the share of the outlay the certificate declares is the share the travellers it names bear of the adults the package carries. Where neither holds, the share of the outlay the certificate declares is the whole of it."
    declared_before_ceiling: "A certificate bought alongside a vacation package is declared on the prepaid outlay standing against the journey insured on that package, and where the two differ the certificate is corrected to that outlay."
    requested_cost: "Where an approved correction stands against the certificate and the trip cost it states is at or above the outlay taken, the ceiling that applies is the plan's ceiling for the declared trip cost."
    declared_ceiling: "Where an approved correction stands against the certificate and the trip cost it states is at or above the outlay taken, the ceiling that applies is the plan's ceiling for the declared trip cost. Where an approved correction stands against the certificate and the trip cost it states is below the outlay taken, the ceiling that applies is the trip cost the approved correction states. Where neither holds, the ceiling that applies is the package's quoted price."
    result: "The corrected declared trip cost is the outlay so taken, rounded to two decimal places, and it is never declared above the ceiling that applies to it."
  factors:
  - id: outlay_evidence_basis
    effect: method
    decides: outlay_basis
    bindings: [routine_charges, agency_fee_lines, ledger_outlay, balance_lines, package_standing, package_settled, outlay_basis]
    ladder:
    - when: "the package's ledger carries a line settling the balance of the package and the package stands confirmed, travelling, completed or cancelled"
      method: "the prepaid outlay is taken as every line posted to the package under its routine terms less the agency service fee charged on it"
    - when: "the package's ledger carries no line settling the balance and the package stands confirmed, travelling, completed or cancelled"
      method: "the prepaid outlay is taken as the amount the package records as paid"
    - when: "otherwise"
