- id: care_premium_rating
  subject:
  - care_premium_charge
  - care_premium_adjustment
  rule: The premium of a single-trip plan is its base rate applied to the declared trip cost, loaded for the age of the oldest insured traveller and for the declared destination region, plus the policy
    fee; a multi-trip plan is charged its flat annual premium, loaded the same way. The age loading is read off the plan's age ladder by the age of the oldest insured traveller at the issue date, and the
    destination loading is the plan's single percentage for the region declared; the two loadings are added to one another and not compounded. Where the rated premium falls below the plan's minimum premium,
    the minimum is charged instead. The policy fee is charged once per certificate however many travellers are named, and is never returned. Where a declared particular changes after issue, the premium
    is re-rated from the day the change takes effect and the difference is charged or returned pro rata over the remaining days of cover. A cancel-for-any-reason upgrade is charged as a separate line at
    the plan's own reimbursement terms, and a plan that does not offer it cannot be upgraded into it.
  eligibility: []
  params:
    loading_basis: loadings are added to the base premium, never compounded
    per_tier:
      Trip Basics Essential:
        premium_base_rate_pct: =premium_base_rate_pct
        annual_premium_usd: =annual_premium_usd
        min_premium_usd: =min_premium_usd
        policy_fee_usd: =policy_fee_usd
        age_loading_ladder_pct: =age_loading_ladder_pct
        destination_loading_pct: =destination_loading_pct
        cfar_included: =cfar_included
      Trip Basics Standard:
        premium_base_rate_pct: =premium_base_rate_pct
        annual_premium_usd: =annual_premium_usd
        min_premium_usd: =min_premium_usd
        policy_fee_usd: =policy_fee_usd
        age_loading_ladder_pct: =age_loading_ladder_pct
        destination_loading_pct: =destination_loading_pct
        cfar_included: =cfar_included
      TripGuard Plus:
        premium_base_rate_pct: =premium_base_rate_pct
        annual_premium_usd: =annual_premium_usd
        min_premium_usd: =min_premium_usd
        policy_fee_usd: =policy_fee_usd
        age_loading_ladder_pct: =age_loading_ladder_pct
