- id: care_claim_assessment
  subject:
  - care_claim_decision
  rule: The insurer decides each claim against the benefit it was filed under, and the decision is the insurer's alone; the agency records it and never substitutes its own view. A claim is allowed in full,
    allowed in part or declined, and a part allowance always states which portion of the claimed amount was not allowed and why. The insurer targets a decision within the plan's decision window counted
    in business days from the day the last supporting document arrived, excluding weekends and public holidays in the traveller's country of residence. Where the decision goes against the traveller they
    may appeal within the plan's appeal window counted from the decision date, and one appeal is heard per claim. A claim under review is neither paid nor closed, and a traveller who asks for a decision
    to be brought forward is told the target and not given an answer on account. A claim arising in a country to which the policy's exclusions apply is declined on that ground alone, whatever the benefit
    claimed.
