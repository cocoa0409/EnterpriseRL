  rule: 'An allowed claim is paid at the lower of the amount allowed and the benefit limit that applies to it, less the deductible that applies to it. Each benefit has its own limit: cancellation and interruption
    are shares of the declared trip cost, medical, evacuation and accident benefits are amounts per insured traveller, and baggage, delay and rental benefits are amounts per traveller with their own inner
    ceilings per article or per day. The deductible withheld is the one the benefit names, and where the benefit names none the plan''s general deductible is withheld; the total withheld across all claims
    on one policy never exceeds the plan''s policy deductible ceiling. Benefit already paid in this policy term is deducted from the limit before the payment is made, so limits are consumed across the term
    rather than restored claim by claim. A cancel-for-any-reason claim is paid at the plan''s own reimbursement share of the trip cost and never at the full cancellation share. Payment is made to the policyholder
