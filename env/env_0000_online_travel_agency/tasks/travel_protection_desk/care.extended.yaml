- id: care_coverage_term
  subject:
  - care_incept
  - care_expire
  rule: Cancellation cover runs from the moment the certificate is issued, and every other benefit runs from the moment the insured journey begins until the moment it ends. A journey begins when the traveller
    leaves their home address for the first booked departure and ends when they return to it, so cover is not tied to the booked flight times alone. Where the return is delayed by an event the policy covers,
    cover extends automatically for the days of the delay at no further premium, up to the plan's maximum journey length. A multi-trip plan covers each journey separately up to the plan's maximum length;
    a journey that runs longer is covered for the plan's maximum and not beyond. Cover expires at the end of the last day of the journey and is never extended for convenience. War and civil unrest are excluded
    on every plan, and an epidemic or a terrorist incident is covered only on a plan that says so.
