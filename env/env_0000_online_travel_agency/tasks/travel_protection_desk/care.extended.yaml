category: care
display_name: Travel Protection Plans
binding:
  holding_table: care_policies
  event_tables:
  - care_premium_entries
  - care_claims
  intake_tables:
  - care_policy_requests
  status_field: status
  variant_field: variant_name
  quantity_fields:
    premium_paid_usd: premium_paid
    benefit_used_usd: benefit_used
lifecycle:
  states:
  - quoted
  - issued
  - in_force
  - expired
  - cancelled
  - closed
  transitions:
  - from: quoted
    to: issued
    by: system
    means: The premium is paid and the certificate of insurance is issued.
  - from: quoted
    to: cancelled
    by: agent
    means: A quotation the traveller does not take up is withdrawn.
  - from: issued
    to: in_force
    by: system
    means: The insured journey begins and every benefit comes into force.
  - from: issued
    to: cancelled
    by: user
    means: The policyholder gives up cover inside the free-look period.
  - from: in_force
    to: expired
    by: system
    means: The insured journey ends and cover comes to its natural end.
  - from: in_force
    to: cancelled
    by: user
    means: The policyholder gives up cover after the journey has begun.
  - from: expired
    to: closed
    by: system
    means: The expired policy is archived once every claim on it has been decided.
  - from: cancelled
    to: closed
    by: system
    means: The cancelled policy is archived once any returned premium has settled.
accounts:
- key: premium_paid
  unit: USD
  meaning: 'Net premium the policyholder has paid for this policy: premium components and re-rating adjustments credit the account, and returned premium debits it.'
- key: benefit_used
  unit: USD
  meaning: 'Benefit consumed against this policy''s limits: a claim payment credits the account and a recovery from a liable third party debits it.'
parameter_schema:
  premium_base_rate_pct: Base premium as a percentage of the declared trip cost.
  annual_premium_usd: Flat annual premium charged on a multi-trip plan, in USD.
  min_premium_usd: Smallest premium the plan may be issued for, in USD.
  max_trip_cost_usd: Largest declared trip cost the plan may be issued against, in USD.
  policy_fee_usd: Non-refundable policy issue fee, in USD.
  age_loading_ladder_pct: Premium loading by the age of the oldest insured traveller; a ladder keyed by age band, as a percentage of the base premium.
  destination_loading_pct: Premium loading for the declared destination region, as a percentage of the base premium.
  pre_existing_condition_waiver: Whether the plan can waive the exclusion of pre-existing medical conditions.
  pre_existing_waiver_purchase_days: Calendar days after the first trip payment within which the policy must be bought for the waiver to be granted.
  free_look_days: Calendar days after issue in which the policy may be cancelled for a full refund.
  free_look_refund_pct: Percentage of the premium returned on a free-look cancellation.
  mid_term_cancel_refund_pct: Percentage of the unearned premium returned on a cancellation after the free-look period.
  trip_cancellation_limit_pct: Trip cancellation benefit as a percentage of the declared trip cost.
  trip_interruption_limit_pct: Trip interruption benefit as a percentage of the declared trip cost.
  cfar_included: Whether cancellation for any reason is covered rather than only listed reasons.
  cfar_reimbursement_pct: Percentage of the trip cost reimbursed on a cancel-for-any-reason claim.
  cfar_notice_hours: Hours before departure by which a cancel-for-any-reason notice must be given.
  medical_emergency_limit_usd: Emergency medical benefit limit per insured traveller, in USD.
  medical_deductible_usd: Deductible withheld from each emergency medical settlement, in USD.
  dental_emergency_limit_usd: Emergency dental benefit limit per insured traveller, in USD.
  evacuation_limit_usd: Emergency evacuation and repatriation limit per insured traveller, in USD.
  accidental_death_limit_usd: Accidental death and dismemberment benefit per insured traveller, in USD.
  baggage_loss_limit_usd: Lost or damaged baggage benefit per insured traveller, in USD.
  baggage_per_item_limit_usd: Ceiling on any single article within the baggage benefit, in USD.
  baggage_delay_limit_usd: Baggage delay benefit per insured traveller, in USD.
  baggage_delay_trigger_hours: Hours of baggage delay from which the benefit is payable.
  travel_delay_limit_usd: Travel delay benefit per insured traveller, in USD.
  travel_delay_trigger_hours: Hours of travel delay from which the benefit is payable.
  travel_delay_per_day_usd: Daily ceiling within the travel delay benefit, in USD.
  missed_connection_limit_usd: Missed connection benefit per insured traveller, in USD.
  missed_connection_trigger_hours: Hours of missed connection delay from which the benefit is payable.
  rental_damage_limit_usd: Rental vehicle damage benefit per rental, in USD.
  rental_damage_deductible_usd: Deductible withheld from a rental vehicle damage settlement, in USD.
  adventure_sports_covered: Whether listed adventure sports are covered rather than excluded.
  business_equipment_limit_usd: Business equipment benefit per insured traveller, in USD.
  pet_care_limit_usd: Kennel or pet care benefit where the traveller's return is delayed, in USD.
  max_trip_length_days: Longest single journey the plan may be issued for, in calendar days.
  annual_trips_covered: Number of separate journeys a multi-trip plan covers in its year; 0 on a single-trip plan.
  min_age_years: Youngest insured traveller the plan accepts, in whole years.
  max_age_years: Oldest insured traveller the plan accepts, in whole years.
  children_free_under_age: Age under which a child travelling with an insured adult is covered free.
  claim_filing_deadline_days: Calendar days after the incident by which a claim must be filed.
  claim_document_deadline_days: Calendar days after filing by which supporting documents must reach the insurer.
  claim_decision_target_days: Business days within which the insurer targets a decision.
  claim_appeal_window_days: Calendar days after a decision within which the policyholder may appeal.
  deductible_per_claim_usd: General deductible withheld from each settlement where the benefit does not name its own, in USD.
  deductible_per_policy_usd: Ceiling on the total deductible withheld across all claims on one policy, in USD.
  subrogation_applies: Whether the insurer may recover a settled amount from a liable third party.
  concierge_service_included: Whether a travel concierge service is included with the plan.
  assistance_line_hours: Hours a day the emergency assistance line is staffed for this plan.
  telemedicine_included: Whether remote medical consultation is included with the plan.
  epidemic_cover_included: Whether illness from a declared epidemic is covered rather than excluded.
  terrorism_cover_included: Whether a terrorist incident at the destination is a covered cancellation reason.
  war_exclusion_applies: Whether loss arising from war or civil unrest is excluded.
  commission_clawback_pct: Percentage of the agency commission recovered when a policy is cancelled inside the free-look period.
  cover_upgrade_allowed: Whether the plan may be upgraded to a higher plan after issue.
  cover_upgrade_window_days: Calendar days after issue within which an upgrade may be requested.
  club_points_earn_rate_pct: Percentage of the premium that accrues as traveller club points.
