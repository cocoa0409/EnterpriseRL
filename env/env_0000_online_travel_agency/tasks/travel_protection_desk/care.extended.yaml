- id: care_ext_reration_difference
  base_policy_refs: [care_premium_rating]
  overwrite:
  - base_policy: care_premium_rating
    superseded_clause: >-
      the premium is re-rated from the day the change takes effect and the difference is charged or
      returned pro rata over the remaining days of cover
    replaced_by: >-
      The difference is then apportioned over the days of cover remaining from the day the correction
      takes effect out of the days of cover bought, and it is taken at the share the evidence behind
      the correction carries.
  trigger: state_due
  subject: [care_premium_adjustment]
  computes: adjustment_amount_usd
  target_tool: raise_rating_adjustment_56692b3c
  params:
    evidenced_share_pct: 100
    part_evidenced_share_pct: 85
    unevidenced_share_pct: 60
    large_party_uplift_pct: 110
    pair_uplift_pct: 105
    single_uplift_pct: 100
  rule: >
    Where a declared particular of a certificate has been corrected, the premium is re-rated and the
    difference between the premium the certificate now calls for and the premium already charged is
    raised as its own line. The premium the certificate now calls for is its declared trip cost at
    the plan's base premium rate, followed by the loadings that attach to it and by the uplift the
    party named carries. The loadings that attach add nothing. The uplift the party named carries is
    the whole of the premium and no more. The premium already charged is the figure the certificate
    records as premium paid. The difference is then apportioned over the days of cover remaining from
    the day the correction takes effect out of the days of cover bought, and it is taken at the share
    the evidence behind the correction carries. The day the correction takes effect is the first day
    of the journey insured. The days of cover bought are counted from the first day of the journey
    insured to its last day, both days counted, and the days of cover remaining are counted from the
    day the correction takes effect to the last day of the journey insured, both days counted. The
    share the evidence behind the correction carries is sixty per cent. The difference so apportioned
    is rounded to two decimal places.
    The difference the re-rating raises is fixed only after the certificate's declared trip cost
    matches the prepaid outlay standing against the journey insured on the booking the cover was
    bought alongside.
    Where the linked package's ledger carries a line posted under its routine terms after the
    certificate was issued and that line was posted before the first day of the journey insured, the
    day the correction takes effect is the day that line posted. Where the linked package's ledger
    carries a line posted under its routine terms after the certificate was issued and that line was
    posted on or after the first day of the journey insured, the day the correction takes effect is
    the day the certificate was issued. Where neither holds, the day the correction takes effect is
    the first day of the journey insured. A line the operator raised on account of a price guarantee,
    or on account of the journey being given up, is not a line posted under the package's routine
    terms, and the day such a line posted never anchors the apportionment.
    The difference is raised against the base premium line of the certificate, the line the declared
    trip cost rates, and is raised on the certificate as a whole rather than on any one insured
    traveller.
    Where the journey insured runs longer than the plan's longest single journey, the days of cover
    bought are the plan's longest single journey. Where the journey insured runs for the plan's
    longest single journey or less and the certificate stands expired or cancelled, the days of cover
    bought are counted from the day the certificate was issued to the last day of the journey
    insured, both days counted. Where neither holds, the days of cover bought are counted from the
    first day of the journey insured to its last day, both days counted.
    Where the certificate's premium lines carry both an age loading and a destination loading, the
    loadings that attach add the proportion those lines bear to the base premium already charged.
    Where the certificate's premium lines carry one of those two loadings and not the other, the
    loadings that attach add the plan's destination loading percentage. Where neither holds, the
    loadings that attach add nothing.
    Where the approved correction carries the reference of the evidence the policyholder supplied and
    the linked package's ledger carries a line settling the balance of the package, the share the
    evidence behind the correction carries is the whole of it. Where the approved correction carries
    the reference of the evidence the policyholder supplied and the linked package's ledger carries no
    line settling the balance, the share the evidence behind the correction carries is eighty-five per
    cent. Where neither holds, the share the evidence behind the correction carries is sixty per cent.
    Where the certificate's premium lines carry a base premium and no premium has been returned on the
    certificate, the premium already charged is the total of its rating lines other than the policy
    fee. Where the certificate's premium lines carry a base premium and premium has been returned on
    the certificate, the premium already charged is the net of those lines after the returns. Where
    neither holds, the premium already charged is the figure the certificate records as premium paid.
    Where the certificate names three or more insured travellers and its premium lines carry an age
    loading, the uplift the party named carries is one hundred and ten per cent of the premium. Where
    the certificate names two insured travellers and its premium lines carry an age loading, the
    uplift the party named carries is one hundred and five per cent of the premium. Where neither
    holds, the uplift the party named carries is the whole of the premium and no more.
  prerequisite:
  - problem: care_ext_declared_cost_restatement
    kind: value_input
    gate: new_base
    form: state
    policy_source: >-
      The difference the re-rating raises is fixed only after the certificate's declared trip cost
      matches the prepaid outlay standing against the journey insured on the booking the cover was
      bought alongside.
    condition: >-
      the certificate's declared trip cost equals the prepaid outlay the linked vacation package's
      ledger shows for the journey insured
    resolved_by: restate_declared_trip_cost_4b2fbffa
    effect: >-
      the premium the certificate now calls for is rated on the corrected declared trip cost instead
      of the figure the certificate carried before, which changes the difference raised
  cross_category:
  - category: bundle
    as: history
    reads: [bundle_ledger_entries.posted_date, bundle_ledger_entries.event_type]
    note: >-
      The anchor factor takes the day the correction takes effect from the last routine line posted
      to the linked package, and the evidence factor reads whether that package's balance was settled.
  compute:
  - premium_lines_total: "SUM('care_premium_entries','amount_usd', date_field='posted_date', event_type='care_premium_charge')"
  - fee_lines: "SUM('care_premium_entries','amount_usd', date_field='posted_date', charge_category='policy_fee')"
  - returned_lines: "SUM('care_premium_entries','amount_usd', date_field='posted_date', event_type='care_premium_refund')"
  - premium_charged: "(premium_lines_total - fee_lines) if (premium_lines_total > 0 and returned_lines == 0) else ((premium_lines_total - fee_lines + returned_lines) if (premium_lines_total > 0 and returned_lines != 0) else F('premium_paid_usd'))"
  - old_base: "SUM('care_premium_entries','amount_usd', date_field='posted_date', charge_category='base_premium')"
  - old_age: "SUM('care_premium_entries','amount_usd', date_field='posted_date', charge_category='age_loading')"
  - old_dest: "SUM('care_premium_entries','amount_usd', date_field='posted_date', charge_category='destination_loading')"
  - loading_ratio: "((old_base + old_age + old_dest)/old_base) if (old_age != 0 and old_dest != 0) else ((1.0 + P('destination_loading_pct')/100.0) if (old_age != 0 or old_dest != 0) else 1.0)"
  - age_loading_lines: "COUNT('care_premium_entries', date_field='posted_date', charge_category='age_loading')"
  - party_uplift_pct: "K('large_party_uplift_pct') if (F('insured_count') >= 3 and age_loading_lines >= 1) else (K('pair_uplift_pct') if (F('insured_count') == 2 and age_loading_lines >= 1) else K('single_uplift_pct'))"
  - new_base: "P('premium_base_rate_pct')/100.0*F('trip_cost_usd')"
  - new_rated: "new_base * loading_ratio * party_uplift_pct/100.0"
  - gross_difference: "new_rated - premium_charged"
  - last_package_line: "XLATEST('bundle','bundle_ledger_entries','posted_date', date_field='posted_date', reason_code='routine_package')"
  - effective_anchor: "last_package_line if (last_package_line > F('issued_date') and last_package_line < F('trip_start_date')) else (F('issued_date') if (last_package_line > F('issued_date') and last_package_line >= F('trip_start_date')) else F('trip_start_date'))"
  - days_remaining: "MX(0, DAYS(effective_anchor, F('trip_end_date')) + 1)"
  - journey_days: "DAYS(F('trip_start_date'), F('trip_end_date')) + 1"
  - cover_days_bought: "P('max_trip_length_days') if (journey_days > P('max_trip_length_days')) else ((DAYS(F('issued_date'), F('trip_end_date')) + 1) if (journey_days <= P('max_trip_length_days') and (F('status') == 'expired' or F('status') == 'cancelled')) else journey_days)"
  - evidence_reference: "LATEST('care_policy_requests','evidence_reference', date_field='submitted_at', request_status='approved', request_type='trip_cost_amendment')"
  - balance_settled: "XCOUNT('bundle','bundle_ledger_entries', date_field='posted_date', event_type='bundle_final_payment_charge')"
  - evidence_share: "K('evidenced_share_pct') if (evidence_reference != '' and balance_settled >= 1) else (K('part_evidenced_share_pct') if (evidence_reference != '' and balance_settled < 1) else K('unevidenced_share_pct'))"
  - result: "RND(gross_difference * days_remaining/cover_days_bought * evidence_share/100.0, 2)"
  compute_basis:
    premium_lines_total: "Where the certificate's premium lines carry a base premium and no premium has been returned on the certificate, the premium already charged is the total of its rating lines other than the policy fee."
    fee_lines: "Where the certificate's premium lines carry a base premium and no premium has been returned on the certificate, the premium already charged is the total of its rating lines other than the policy fee."
    returned_lines: "Where the certificate's premium lines carry a base premium and premium has been returned on the certificate, the premium already charged is the net of those lines after the returns."
    premium_charged: "Where the certificate's premium lines carry a base premium and no premium has been returned on the certificate, the premium already charged is the total of its rating lines other than the policy fee. Where the certificate's premium lines carry a base premium and premium has been returned on the certificate, the premium already charged is the net of those lines after the returns. Where neither holds, the premium already charged is the figure the certificate records as premium paid."
    old_base: "Where the certificate's premium lines carry both an age loading and a destination loading, the loadings that attach add the proportion those lines bear to the base premium already charged."
    old_age: "Where the certificate's premium lines carry one of those two loadings and not the other, the loadings that attach add the plan's destination loading percentage."
    old_dest: "Where the certificate's premium lines carry one of those two loadings and not the other, the loadings that attach add the plan's destination loading percentage."
    loading_ratio: "Where the certificate's premium lines carry both an age loading and a destination loading, the loadings that attach add the proportion those lines bear to the base premium already charged. Where the certificate's premium lines carry one of those two loadings and not the other, the loadings that attach add the plan's destination loading percentage. Where neither holds, the loadings that attach add nothing."
    age_loading_lines: "Where the certificate names three or more insured travellers and its premium lines carry an age loading, the uplift the party named carries is one hundred and ten per cent of the premium."
    party_uplift_pct: "Where the certificate names three or more insured travellers and its premium lines carry an age loading, the uplift the party named carries is one hundred and ten per cent of the premium. Where the certificate names two insured travellers and its premium lines carry an age loading, the uplift the party named carries is one hundred and five per cent of the premium. Where neither holds, the uplift the party named carries is the whole of the premium and no more."
    new_base: "The premium the certificate now calls for is its declared trip cost at the plan's base premium rate, followed by the loadings that attach to it and by the uplift the party named carries."
    new_rated: "The premium the certificate now calls for is its declared trip cost at the plan's base premium rate, followed by the loadings that attach to it and by the uplift the party named carries."
    gross_difference: "Where a declared particular of a certificate has been corrected, the premium is re-rated and the difference between the premium the certificate now calls for and the premium already charged is raised as its own line."
    last_package_line: "Where the linked package's ledger carries a line posted under its routine terms after the certificate was issued and that line was posted before the first day of the journey insured, the day the correction takes effect is the day that line posted."
    effective_anchor: "Where the linked package's ledger carries a line posted under its routine terms after the certificate was issued and that line was posted before the first day of the journey insured, the day the correction takes effect is the day that line posted. Where the linked package's ledger carries a line posted under its routine terms after the certificate was issued and that line was posted on or after the first day of the journey insured, the day the correction takes effect is the day the certificate was issued. Where neither holds, the day the correction takes effect is the first day of the journey insured."
    days_remaining: "The days of cover bought are counted from the first day of the journey insured to its last day, both days counted, and the days of cover remaining are counted from the day the correction takes effect to the last day of the journey insured, both days counted."
    journey_days: "Where the journey insured runs longer than the plan's longest single journey, the days of cover bought are the plan's longest single journey."
    cover_days_bought: "Where the journey insured runs longer than the plan's longest single journey, the days of cover bought are the plan's longest single journey. Where the journey insured runs for the plan's longest single journey or less and the certificate stands expired or cancelled, the days of cover bought are counted from the day the certificate was issued to the last day of the journey insured, both days counted. Where neither holds, the days of cover bought are counted from the first day of the journey insured to its last day, both days counted."
    evidence_reference: "Where the approved correction carries the reference of the evidence the policyholder supplied and the linked package's ledger carries a line settling the balance of the package, the share the evidence behind the correction carries is the whole of it."
    balance_settled: "Where the approved correction carries the reference of the evidence the policyholder supplied and the linked package's ledger carries no line settling the balance, the share the evidence behind the correction carries is eighty-five per cent."
    evidence_share: "Where the approved correction carries the reference of the evidence the policyholder supplied and the linked package's ledger carries a line settling the balance of the package, the share the evidence behind the correction carries is the whole of it. Where the approved correction carries the reference of the evidence the policyholder supplied and the linked package's ledger carries no line settling the balance, the share the evidence behind the correction carries is eighty-five per cent. Where neither holds, the share the evidence behind the correction carries is sixty per cent."
    result: "The difference so apportioned is rounded to two decimal places."
  factors:
  - id: correction_effective_anchor
    effect: method
    decides: effective_anchor
    bindings: [last_package_line, effective_anchor, days_remaining]
    ladder:
    - when: "the linked package's ledger carries a line posted under its routine terms after the certificate was issued and that line was posted before the first day of the journey insured"
      method: "the day the correction takes effect is the day that line posted"
    - when: "the linked package's ledger carries a line posted under its routine terms after the certificate was issued and that line was posted on or after the first day of the journey insured"
      method: "the day the correction takes effect is the day the certificate was issued"
    - when: "otherwise"
      method: "the day the correction takes effect is the first day of the journey insured"
    baseline:
      effective_anchor: "F('trip_start_date')"
    evidence: [cross_category, date]
    cross_difficulty: bundle
  - id: cover_term_basis
    effect: method
    decides: cover_days_bought
    bindings: [journey_days, cover_days_bought]
    ladder:
    - when: "the journey insured runs longer than the plan's longest single journey"
      method: "the days of cover bought are the plan's longest single journey"
    - when: "the journey insured runs for the plan's longest single journey or less and the certificate stands expired or cancelled"
      method: "the days of cover bought are counted from the day the certificate was issued to the last day of the journey insured, both days counted"
    - when: "otherwise"
      method: "the days of cover bought are counted from the first day of the journey insured to its last day, both days counted"
    baseline:
      cover_days_bought: "journey_days"
    evidence: [date, tier_param]
    cross_difficulty: null
  - id: attaching_loading_basis
    effect: method
    decides: loading_ratio
    bindings: [old_base, old_age, old_dest, loading_ratio]
    ladder:
    - when: "the certificate's premium lines carry both an age loading and a destination loading"
      method: "the loadings that attach add the proportion those lines bear to the base premium already charged"
    - when: "the certificate's premium lines carry one of those two loadings and not the other"
      method: "the loadings that attach add the plan's destination loading percentage"
    - when: "otherwise"
      method: "the loadings that attach add nothing"
    baseline:
      loading_ratio: "1.0"
    evidence: [history]
    cross_difficulty: null
  - id: correction_evidence_share
    effect: parameter
    decides: evidence_share
    bindings: [evidence_reference, balance_settled, evidence_share]
    ladder:
    - when: "the approved correction carries the reference of the evidence the policyholder supplied and the linked package's ledger carries a line settling the balance of the package"
      value: "K('evidenced_share_pct')"
    - when: "the approved correction carries the reference of the evidence the policyholder supplied and the linked package's ledger carries no line settling the balance"
      value: "K('part_evidenced_share_pct')"
    - when: "otherwise"
      value: "K('unevidenced_share_pct')"
    baseline:
      evidence_share: "K('unevidenced_share_pct')"
    evidence: [history, cross_category]
    cross_difficulty: bundle
  - id: charged_premium_basis
    effect: method
    decides: premium_charged
    bindings: [premium_lines_total, fee_lines, returned_lines, premium_charged]
    ladder:
    - when: "the certificate's premium lines carry a base premium and no premium has been returned on the certificate"
      method: "the premium already charged is the total of its rating lines other than the policy fee"
    - when: "the certificate's premium lines carry a base premium and premium has been returned on the certificate"
      method: "the premium already charged is the net of those lines after the returns"
    - when: "otherwise"
      method: "the premium already charged is the figure the certificate records as premium paid"
    baseline:
      premium_charged: "F('premium_paid_usd')"
    evidence: [history]
    cross_difficulty: null
  - id: insured_party_uplift
    effect: parameter
    decides: party_uplift_pct
    bindings: [age_loading_lines, party_uplift_pct]
    ladder:
    - when: "the certificate names three or more insured travellers and its premium lines carry an age loading"
      value: "K('large_party_uplift_pct')"
    - when: "the certificate names two insured travellers and its premium lines carry an age loading"
      value: "K('pair_uplift_pct')"
    - when: "otherwise"
      value: "K('single_uplift_pct')"
    baseline:
      party_uplift_pct: "K('single_uplift_pct')"
    evidence: [history]
    cross_difficulty: null
  baseline:
    rule: >-
      Where a declared particular of a certificate has been corrected, the premium is re-rated and
      the difference between the premium the certificate now calls for and the premium already
      charged is raised as its own line. The premium the certificate now calls for is its declared
      trip cost at the plan's base premium rate, followed by the loadings that attach to it and by
      the uplift the party named carries. The loadings that attach add nothing. The uplift the party
      named carries is the whole of the premium and no more. The premium already charged is the
      figure the certificate records as premium paid. The difference is then apportioned over the
      days of cover remaining from the day the correction takes effect out of the days of cover
      bought, and it is taken at the share the evidence behind the correction carries. The day the
      correction takes effect is the first day of the journey insured. The days of cover bought are
      counted from the first day of the journey insured to its last day, both days counted, and the
      days of cover remaining are counted from the day the correction takes effect to the last day of
      the journey insured, both days counted. The share the evidence behind the correction carries is
      sixty per cent. The difference so apportioned is rounded to two decimal places.
    params: [unevidenced_share_pct, single_uplift_pct, premium_base_rate_pct, max_trip_length_days]
  inputs:
    history:
    - {table: care_premium_entries, aggregate: sum, field: amount_usd, within_months: null, filters: {event_type: care_premium_charge}}
    - {table: care_premium_entries, aggregate: sum, field: amount_usd, within_months: null, filters: {charge_category: base_premium}}
    - {category: bundle, table: bundle_ledger_entries, aggregate: latest, field: posted_date, within_months: null, filters: {reason_code: routine_package}}
    cross_category: [bundle]
- id: care_ext_cancellation_claim_intake
  base_policy_refs: [care_claim_filing]
  overwrite:
  - base_policy: care_claim_filing
    superseded_clause: >-
      A claim is filed only when no claim carrying the same claim reference has already been filed on
      this policy.
    replaced_by: >-
      One claim is filed for one incident against one benefit, and where the certificate already
      carries a claim for that incident against that benefit no further claim is filed.
  trigger: on_request
  subject: [care_claim_file]
  computes: claimed_amount_usd
  target_tool: file_cancellation_claim_621a2df1
  params:
    transferable_credit_pct: 100
    personal_credit_pct: 80
    lapsing_credit_pct: 0
    refundable_deposit_pct: 100
    retained_deposit_pct: 0
    open_package_deposit_pct: 50
    early_notice_share_pct: 100
    late_notice_share_pct: 90
    unnotified_share_pct: 75
  rule: >
    A traveller who has given up an insured journey files one claim against the cancellation benefit
    for the prepaid outlay they cannot get back. One claim is filed for one incident against one
    benefit, and where the certificate already carries a claim for that incident against that benefit
    no further claim is filed. The amount claimed is the declared trip cost the
    certificate carries, less the value the operator has given back and less the share of the deposit
    the operator returns, taken at the share promptness carries, and rounded to two decimal places;
    it never falls below nothing. None of the value the operator has given back is taken off. The
    share of the deposit the operator returns is half of it. The share promptness carries is
    seventy-five per cent.
    The amount claimed is worked out only once the certificate carries the declared trip cost the
    journey insured actually carried. A claim is filed for an amount on a certificate only after its
    premium lines carry the re-rating its corrected particulars call for.
    Where the linked package stands cancelled and a future travel credit stands open against it, the
    value the operator has given back is the amounts returned to the traveller together with the
    credit standing open, that credit taken at the share a credit is valued at. Where the linked
    package stands cancelled and no future travel credit stands open against it, the value the
    operator has given back is the amounts returned to the traveller. Where neither holds, none of
    the value the operator has given back is taken off.
    Where the credit standing open against the package may be transferred to another traveller and it
    may be redeemed after the last day of the journey insured, a credit is valued at the whole of it.
    Where the credit standing open against the package may not be transferred and it may be redeemed
    after the last day of the journey insured, a credit is valued at eighty per cent. Where neither
    holds, a credit is valued at nothing.
    Where the ledger of the linked package carries the line that gave the value back and the journey
    was given up more than a fortnight before it was to begin, the share promptness carries is the
    whole of the amount. Where the ledger of the linked package carries the line that gave the value
    back and the journey was given up a fortnight or less before it was to begin, the share
    promptness carries is ninety per cent. Where neither holds, the share promptness carries is
    seventy-five per cent.
    Where the linked package's product returns the deposit on cancellation and the package stands
    cancelled, the share of the deposit the operator returns is the whole of it. Where the linked
    package's product does not return the deposit on cancellation and the package stands cancelled,
    the share of the deposit the operator returns is nothing. Where neither holds, the share of the
    deposit the operator returns is half of it.
  prerequisite:
  - problem: care_ext_declared_cost_restatement
    kind: value_input
    gate: unrecovered
    form: state
    policy_source: >-
      The amount claimed is worked out only once the certificate carries the declared trip cost the
      journey insured actually carried.
    condition: >-
      the certificate's declared trip cost equals the prepaid outlay the linked vacation package's
      ledger shows for the journey insured
    resolved_by: restate_declared_trip_cost_4b2fbffa
    effect: >-
      the declared trip cost the amount claimed is measured on becomes the corrected figure instead
      of the figure the certificate carried before
  - problem: care_ext_reration_difference
    kind: state_gate
    gate: care_premium_entries.charge_category
    form: state
    policy_source: >-
      A claim is filed for an amount on a certificate only after its premium lines carry the
      re-rating its corrected particulars call for.
    condition: >-
      the certificate's premium lines carry a re-rating adjustment raised for the declared
      particulars as they now stand
    resolved_by: raise_rating_adjustment_56692b3c
    effect: >-
      the certificate's premium lines carry the re-rating its corrected particulars call for, so that
      a claim may be filed for an amount at all
  cross_category:
  - category: bundle
    as: history
    reads: [status, credit_balance_usd, credit_transferable, deposit_refundable, bundle_ledger_entries.amount_usd, bundle_ledger_entries.posted_date, bundle_ledger_entries.credit_expires_on]
    note: >-
      The scope of what the operator has given back, the value put on a credit, the promptness share
      and the deposit share all take their tiers from the linked vacation package and its ledger.
  compute:
  - operator_payouts: "XSUM('bundle','bundle_ledger_entries','amount_usd', date_field='posted_date', event_type='bundle_refund_payout')"
  - package_state: "CFIELD('bundle','status')"
  - credit_open: "CFIELD('bundle','credit_balance_usd')"
  - credit_horizon: "XLATEST('bundle','bundle_ledger_entries','credit_expires_on', date_field='posted_date', event_type='bundle_credit_issue')"
  - credit_transferable: "CPARAM('bundle','credit_transferable')"
  - credit_valuation: "K('transferable_credit_pct') if (credit_transferable == True and credit_horizon > F('trip_end_date')) else (K('personal_credit_pct') if (credit_transferable != True and credit_horizon > F('trip_end_date')) else K('lapsing_credit_pct'))"
  - recovered_value: "(ABS(operator_payouts) + credit_open*credit_valuation/100.0) if (package_state == 'cancelled' and credit_open > 0) else (ABS(operator_payouts) if (package_state == 'cancelled' and credit_open <= 0) else 0.0)"
  - deposit_paid: "XSUM('bundle','bundle_ledger_entries','amount_usd', date_field='posted_date', charge_category='deposit')"
  - deposit_returned_share: "K('refundable_deposit_pct') if (CPARAM('bundle','deposit_refundable') == True and package_state == 'cancelled') else (K('retained_deposit_pct') if (CPARAM('bundle','deposit_refundable') != True and package_state == 'cancelled') else K('open_package_deposit_pct'))"
  - cancel_line_date: "XLATEST('bundle','bundle_ledger_entries','posted_date', date_field='posted_date', reason_code='traveller_cancellation')"
  - notice_days: "DAYS(cancel_line_date, F('trip_start_date'))"
  - notice_share: "K('early_notice_share_pct') if (cancel_line_date != '' and notice_days > 14) else (K('late_notice_share_pct') if (cancel_line_date != '' and notice_days <= 14) else K('unnotified_share_pct'))"
  - unrecovered: "MX(0.0, F('trip_cost_usd') - recovered_value - deposit_paid*deposit_returned_share/100.0)"
  - result: "RND(unrecovered * notice_share/100.0, 2)"
  compute_basis:
    operator_payouts: "Where the linked package stands cancelled and no future travel credit stands open against it, the value the operator has given back is the amounts returned to the traveller."
    package_state: "Where the linked package stands cancelled and a future travel credit stands open against it, the value the operator has given back is the amounts returned to the traveller together with the credit standing open, that credit taken at the share a credit is valued at."
    credit_open: "Where the linked package stands cancelled and a future travel credit stands open against it, the value the operator has given back is the amounts returned to the traveller together with the credit standing open, that credit taken at the share a credit is valued at."
    credit_horizon: "Where the credit standing open against the package may be transferred to another traveller and it may be redeemed after the last day of the journey insured, a credit is valued at the whole of it."
    credit_transferable: "Where the credit standing open against the package may not be transferred and it may be redeemed after the last day of the journey insured, a credit is valued at eighty per cent."
    credit_valuation: "Where the credit standing open against the package may be transferred to another traveller and it may be redeemed after the last day of the journey insured, a credit is valued at the whole of it. Where the credit standing open against the package may not be transferred and it may be redeemed after the last day of the journey insured, a credit is valued at eighty per cent. Where neither holds, a credit is valued at nothing."
    recovered_value: "Where the linked package stands cancelled and a future travel credit stands open against it, the value the operator has given back is the amounts returned to the traveller together with the credit standing open, that credit taken at the share a credit is valued at. Where the linked package stands cancelled and no future travel credit stands open against it, the value the operator has given back is the amounts returned to the traveller. Where neither holds, none of the value the operator has given back is taken off."
    deposit_paid: "Where the linked package's product returns the deposit on cancellation and the package stands cancelled, the share of the deposit the operator returns is the whole of it."
    deposit_returned_share: "Where the linked package's product returns the deposit on cancellation and the package stands cancelled, the share of the deposit the operator returns is the whole of it. Where the linked package's product does not return the deposit on cancellation and the package stands cancelled, the share of the deposit the operator returns is nothing. Where neither holds, the share of the deposit the operator returns is half of it."
    cancel_line_date: "Where the ledger of the linked package carries the line that gave the value back and the journey was given up more than a fortnight before it was to begin, the share promptness carries is the whole of the amount."
    notice_days: "Where the ledger of the linked package carries the line that gave the value back and the journey was given up a fortnight or less before it was to begin, the share promptness carries is ninety per cent."
    notice_share: "Where the ledger of the linked package carries the line that gave the value back and the journey was given up more than a fortnight before it was to begin, the share promptness carries is the whole of the amount. Where the ledger of the linked package carries the line that gave the value back and the journey was given up a fortnight or less before it was to begin, the share promptness carries is ninety per cent. Where neither holds, the share promptness carries is seventy-five per cent."
    unrecovered: "The amount claimed is the declared trip cost the certificate carries, less the value the operator has given back and less the share of the deposit the operator returns, taken at the share promptness carries, and rounded to two decimal places; it never falls below nothing."
    result: "The amount claimed is the declared trip cost the certificate carries, less the value the operator has given back and less the share of the deposit the operator returns, taken at the share promptness carries, and rounded to two decimal places; it never falls below nothing."
  factors:
  - id: recovered_value_scope
    effect: method
    decides: recovered_value
    bindings: [operator_payouts, package_state, credit_open, recovered_value]
    ladder:
    - when: "the linked package stands cancelled and a future travel credit stands open against it"
      method: "the value the operator has given back is the amounts returned to the traveller together with the credit standing open, that credit taken at the share a credit is valued at"
    - when: "the linked package stands cancelled and no future travel credit stands open against it"
      method: "the value the operator has given back is the amounts returned to the traveller"
    - when: "otherwise"
      method: "none of the value the operator has given back is taken off"
    baseline:
      recovered_value: "0.0"
    evidence: [cross_category, history]
    cross_difficulty: bundle
  - id: open_credit_valuation
    effect: parameter
    decides: credit_valuation
    bindings: [credit_horizon, credit_transferable, credit_valuation]
    ladder:
    - when: "the credit standing open against the package may be transferred to another traveller and it may be redeemed after the last day of the journey insured"
      value: "K('transferable_credit_pct')"
    - when: "the credit standing open against the package may not be transferred and it may be redeemed after the last day of the journey insured"
      value: "K('personal_credit_pct')"
    - when: "otherwise"
      value: "K('lapsing_credit_pct')"
    baseline:
      credit_valuation: "K('lapsing_credit_pct')"
    evidence: [cross_category, date]
    cross_difficulty: bundle
  - id: cancellation_promptness_share
    effect: parameter
    decides: notice_share
    bindings: [cancel_line_date, notice_days, notice_share]
    ladder:
    - when: "the ledger of the linked package carries the line that gave the value back and the journey was given up more than a fortnight before it was to begin"
      value: "K('early_notice_share_pct')"
    - when: "the ledger of the linked package carries the line that gave the value back and the journey was given up a fortnight or less before it was to begin"
      value: "K('late_notice_share_pct')"
    - when: "otherwise"
      value: "K('unnotified_share_pct')"
    baseline:
      notice_share: "K('unnotified_share_pct')"
    evidence: [cross_category, date]
    cross_difficulty: bundle
  - id: returned_deposit_share
    effect: parameter
    decides: deposit_returned_share
    bindings: [deposit_paid, deposit_returned_share]
    ladder:
    - when: "the linked package's product returns the deposit on cancellation and the package stands cancelled"
      value: "K('refundable_deposit_pct')"
    - when: "the linked package's product does not return the deposit on cancellation and the package stands cancelled"
      value: "K('retained_deposit_pct')"
    - when: "otherwise"
      value: "K('open_package_deposit_pct')"
    baseline:
      deposit_returned_share: "K('open_package_deposit_pct')"
    evidence: [cross_category]
    cross_difficulty: bundle
  baseline:
    rule: >-
      A traveller who has given up an insured journey files one claim against the cancellation
      benefit for the prepaid outlay they cannot get back. The amount claimed is the declared trip
      cost the certificate carries, less the value the operator has given back and less the share of
      the deposit the operator returns, taken at the share promptness carries, and rounded to two
      decimal places; it never falls below nothing. None of the value the operator has given back is
      taken off. The share of the deposit the operator returns is half of it. The share promptness
      carries is seventy-five per cent.
    params: [open_package_deposit_pct, unnotified_share_pct]
  inputs:
    history:
    - {category: bundle, table: bundle_ledger_entries, aggregate: sum, field: amount_usd, within_months: null, filters: {event_type: bundle_refund_payout}}
    - {category: bundle, table: bundle_ledger_entries, aggregate: sum, field: amount_usd, within_months: null, filters: {charge_category: deposit}}
    - {category: bundle, table: bundle_ledger_entries, aggregate: latest, field: posted_date, within_months: null, filters: {reason_code: traveller_cancellation}}
    cross_category: [bundle]
