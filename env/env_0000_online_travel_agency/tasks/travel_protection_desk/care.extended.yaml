  - id: returned_value_recognition
    effect: parameter
    decides: recognition_share
    bindings: [returns_to_traveller, credits_given_back, returns_on_surrender, operator_returns, package_refund_form, credit_expiry, recognition_share, recognised_returns]
    ladder:
    - when: "the package returns value to the original form of payment and an amount has been returned against it"
      value: "K('cash_return_pct')"
    - when: "the package returns value only as a future travel credit and the credit standing open against it may still be redeemed after the last day of the journey insured"
