extended_policies:
- id: care_ext_outstanding_loading_charge
  base_policy_refs: [care_premium_rating, care_club_and_bundle_interaction]
  overwrite:
  - base_policy: care_premium_rating
    superseded_clause: >-
      the destination loading is the plan's single percentage for the region declared
    replaced_by: >-
      The destination loading owed is the plan's destination loading percentage applied to that
      premium, taken at the share of that percentage which the length of the journey insured carries
      and at the share which the moment the cover was bought carries, and reduced by the protection
      discount that applies to the certificate.
  - base_policy: care_club_and_bundle_interaction
    superseded_clause: >-
      the club tier held on the issue date decides the discount applied to the premium
    replaced_by: >-
      Where the membership stands active and the tier held took effect after the day the certificate
      was issued, the standing protection discount of the house applies instead.
  trigger: state_due
  subject: [care_premium_charge]
  computes: amount_usd
  target_tool: charge_destination_loading_6e26c317
  params:
    full_exposure_share_pct: 100
    short_exposure_share_pct: 70
    domestic_exposure_share_pct: 40
    late_purchase_share_pct: 125
    standard_purchase_share_pct: 100
    early_purchase_share_pct: 75
    grandfathered_discount_pct: 5
    no_discount_pct: 0
  rule: >
    A certificate carries one destination loading line for the region it declares, and where the
    premium lines carry none the loading is owed and is charged as its own line. The premium the
    loading acts on is the plan's minimum premium. The destination loading owed is the plan's
    destination loading percentage applied to that premium, taken at the share of that percentage
    which the length of the journey insured carries and at the share which the moment the cover was
    bought carries, and reduced by the protection discount that applies to the certificate. The share
    the length of the journey insured carries is forty per cent. The share the moment the cover was
    bought carries is seventy-five per cent. No protection discount is applied. The loading is rounded to two decimal
    places only once the discount has been taken off, and the discount acts once on the rated loading
    and never on any other premium line.
    Where the certificate carries a base premium line and one or more re-rating adjustments raised
    against its premium, the premium the loading acts on is the certificate's declared trip cost at
    the plan's base premium rate together with those adjustments. Where the certificate carries a base
    premium line and no re-rating adjustment raised against its premium, the premium the loading acts
    on is the certificate's declared trip cost at the plan's base premium rate. Where neither holds,
    the premium the loading acts on is the plan's minimum premium.
    The length of the journey insured is counted in whole calendar days from the first day of the
    journey to its last day, both days counted. Where the journey insured runs for more than half the
    plan's longest single journey and the certificate declares a region other than domestic, the share
    the length of the journey insured carries is the whole of the plan's destination loading
    percentage. Where the journey insured runs for half the plan's longest single journey or less and
    the certificate declares a region other than domestic, the share the length of the journey insured
    carries is seventy per cent. Where neither holds, the share the length of the journey insured
    carries is forty per cent, because a journey wholly within the country of residence carries the
    least exposure to a foreign risk.
    The days between the day the certificate was issued and the first day of the journey insured are
    counted as whole calendar days. Where cover was bought less than a fortnight before the journey
    began, the share the moment the cover was bought carries is one hundred and twenty-five per cent.
    Where cover was bought a fortnight or more but less than sixty days before the journey began, the
    share the moment the cover was bought carries is one hundred per cent. Where neither holds, the
    share the moment the cover was bought carries is seventy-five per cent.
    Where the traveller's club membership stands active and the tier held took effect on or before the
    day the certificate was issued, the protection discount that applies is the protection discount
    that tier carries. Where the membership stands active and the tier held took effect after the day
    the certificate was issued, the standing protection discount of the house applies instead. Where
    neither holds, the certificate carries no protection discount at all.
  prerequisite: []
  cross_category:
  - category: club
    as: branch
    reads: [status, tier_effective_date, insurance_discount_pct]
    note: >-
      The protection discount factor takes its tier from the traveller's club membership record and
      from the protection discount the tier held carries.
  compute:
  - base_premium_lines: "SUM('care_premium_entries','amount_usd', date_field='posted_date', charge_category='base_premium')"
  - adjustment_lines: "SUM('care_premium_entries','amount_usd', date_field='posted_date', charge_category='premium_adjustment')"
  - rated_base: "P('premium_base_rate_pct')/100.0*F('trip_cost_usd')"
  - loading_base: "(rated_base + adjustment_lines) if (base_premium_lines > 0 and adjustment_lines != 0) else (rated_base if (base_premium_lines > 0 and adjustment_lines == 0) else P('min_premium_usd'))"
  - journey_days: "DAYS(F('trip_start_date'), F('trip_end_date')) + 1"
  - exposure_share: "K('full_exposure_share_pct') if (journey_days*2 > P('max_trip_length_days') and F('destination_region') != 'domestic') else (K('short_exposure_share_pct') if (journey_days*2 <= P('max_trip_length_days') and F('destination_region') != 'domestic') else K('domestic_exposure_share_pct'))"
  - advance_days: "DAYS(F('issued_date'), F('trip_start_date'))"
  - lead_share: "K('late_purchase_share_pct') if advance_days < 14 else (K('standard_purchase_share_pct') if advance_days < 60 else K('early_purchase_share_pct'))"
  - club_standing: "CFIELD('club','status')"
  - club_tier_start: "CFIELD('club','tier_effective_date')"
  - protection_discount_pct: "CPARAM('club','insurance_discount_pct') if (club_standing == 'active' and club_tier_start <= F('issued_date')) else (K('grandfathered_discount_pct') if (club_standing == 'active' and club_tier_start > F('issued_date')) else K('no_discount_pct'))"
  - rated_loading: "loading_base * P('destination_loading_pct')/100.0 * exposure_share/100.0 * lead_share/100.0"
  - result: "RND(rated_loading * (100.0 - protection_discount_pct)/100.0, 2)"
  compute_basis:
    base_premium_lines: "Where the certificate carries a base premium line and no re-rating adjustment raised against its premium, the premium the loading acts on is the certificate's declared trip cost at the plan's base premium rate."
    adjustment_lines: "Where the certificate carries a base premium line and one or more re-rating adjustments raised against its premium, the premium the loading acts on is the certificate's declared trip cost at the plan's base premium rate together with those adjustments."
    rated_base: "Where the certificate carries a base premium line and no re-rating adjustment raised against its premium, the premium the loading acts on is the certificate's declared trip cost at the plan's base premium rate."
    loading_base: "Where neither holds, the premium the loading acts on is the plan's minimum premium."
    journey_days: "The length of the journey insured is counted in whole calendar days from the first day of the journey to its last day, both days counted."
    exposure_share: "Where the journey insured runs for more than half the plan's longest single journey and the certificate declares a region other than domestic, the share the length of the journey insured carries is the whole of the plan's destination loading percentage. Where the journey insured runs for half the plan's longest single journey or less and the certificate declares a region other than domestic, the share the length of the journey insured carries is seventy per cent. Where neither holds, the share the length of the journey insured carries is forty per cent, because a journey wholly within the country of residence carries the least exposure to a foreign risk."
    advance_days: "The days between the day the certificate was issued and the first day of the journey insured are counted as whole calendar days."
    lead_share: "Where cover was bought less than a fortnight before the journey began, the share the moment the cover was bought carries is one hundred and twenty-five per cent. Where cover was bought a fortnight or more but less than sixty days before the journey began, the share the moment the cover was bought carries is one hundred per cent. Where neither holds, the share the moment the cover was bought carries is seventy-five per cent."
    club_standing: "Where the traveller's club membership stands active and the tier held took effect on or before the day the certificate was issued, the protection discount that applies is the protection discount that tier carries."
    club_tier_start: "Where the membership stands active and the tier held took effect after the day the certificate was issued, the standing protection discount of the house applies instead."
    protection_discount_pct: "Where the traveller's club membership stands active and the tier held took effect on or before the day the certificate was issued, the protection discount that applies is the protection discount that tier carries. Where the membership stands active and the tier held took effect after the day the certificate was issued, the standing protection discount of the house applies instead. Where neither holds, the certificate carries no protection discount at all."
    rated_loading: "The destination loading owed is the plan's destination loading percentage applied to that premium, taken at the share of that percentage which the length of the journey insured carries and at the share which the moment the cover was bought carries, and reduced by the protection discount that applies to the certificate."
    result: "The loading is rounded to two decimal places only once the discount has been taken off, and the discount acts once on the rated loading and never on any other premium line."
  factors:
  - id: protection_discount
    effect: parameter
    decides: protection_discount_pct
    bindings: [club_standing, club_tier_start, protection_discount_pct]
    ladder:
    - when: "the traveller's club membership stands active and the tier held took effect on or before the day the certificate was issued"
      value: "CPARAM('club','insurance_discount_pct')"
    - when: "the membership stands active and the tier held took effect after the day the certificate was issued"
      value: "K('grandfathered_discount_pct')"
    - when: "otherwise"
      value: "K('no_discount_pct')"
    baseline:
      protection_discount_pct: "K('no_discount_pct')"
    evidence: [cross_category, date]
    cross_difficulty: club
  - id: loading_base_basis
    effect: method
    decides: loading_base
    bindings: [base_premium_lines, adjustment_lines, rated_base, loading_base]
    ladder:
    - when: "the certificate carries a base premium line and one or more re-rating adjustments raised against its premium"
      method: "the premium the loading acts on is the certificate's declared trip cost at the plan's base premium rate together with those adjustments"
    - when: "the certificate carries a base premium line and no re-rating adjustment raised against its premium"
      method: "the premium the loading acts on is the certificate's declared trip cost at the plan's base premium rate"
    - when: "otherwise"
      method: "the premium the loading acts on is the plan's minimum premium"
    baseline:
      loading_base: "P('min_premium_usd')"
    evidence: [history]
    cross_difficulty: null
  - id: journey_exposure_share
    effect: parameter
    decides: exposure_share
    bindings: [journey_days, exposure_share]
    ladder:
    - when: "the journey insured runs for more than half the plan's longest single journey and the certificate declares a region other than domestic"
      value: "K('full_exposure_share_pct')"
    - when: "the journey insured runs for half the plan's longest single journey or less and the certificate declares a region other than domestic"
      value: "K('short_exposure_share_pct')"
    - when: "otherwise"
      value: "K('domestic_exposure_share_pct')"
    baseline:
      exposure_share: "K('domestic_exposure_share_pct')"
    evidence: [date, tier_param]
    cross_difficulty: null
  - id: purchase_lead_share
    effect: parameter
    decides: lead_share
    bindings: [advance_days, lead_share]
    ladder:
    - when: "cover was bought less than a fortnight before the journey began"
      value: "K('late_purchase_share_pct')"
    - when: "cover was bought a fortnight or more but less than sixty days before the journey began"
      value: "K('standard_purchase_share_pct')"
    - when: "otherwise"
      value: "K('early_purchase_share_pct')"
    baseline:
      lead_share: "K('early_purchase_share_pct')"
    evidence: [date]
    cross_difficulty: null
  baseline:
    rule: >-
      A certificate carries one destination loading line for the region it declares, and where the
      premium lines carry none the loading is owed and is charged as its own line. The premium the
      loading acts on is the plan's minimum premium. The destination loading owed is the plan's
      destination loading percentage applied to that premium, taken at the share of that percentage
      which the length of the journey insured carries and at the share which the moment the cover was
      bought carries, and reduced by the protection discount that applies to the certificate. The
      share the length of the journey insured carries is forty per cent. The share the moment the
      cover was bought carries is seventy-five per cent. No protection discount is applied. The loading is rounded to two
      decimal places only once the discount has been taken off, and the discount acts once on the
      rated loading and never on any other premium line.
    params: [min_premium_usd, destination_loading_pct, domestic_exposure_share_pct, early_purchase_share_pct, no_discount_pct]
  inputs:
    history:
    - {table: care_premium_entries, aggregate: sum, field: amount_usd, within_months: null, filters: {charge_category: base_premium}}
    - {table: care_premium_entries, aggregate: sum, field: amount_usd, within_months: null, filters: {charge_category: premium_adjustment}}
    cross_category: [club]
- id: care_ext_supplier_recovery_declaration
  base_policy_refs: [care_subrogation, care_claim_settlement]
  overwrite:
  - base_policy: care_subrogation
    superseded_clause: >-
      the settlement is reduced by what they received rather than recovered afterwards
    replaced_by: >-
      Where a supplier has paid the traveller for a loss the certificate has already settled, the
      traveller declares what they received and that amount is restored to the benefit the
      certificate records as consumed.
  - base_policy: care_subrogation
    superseded_clause: >-
      The traveller keeps whatever the recovery exceeds, because the insurer recovers only what it
      actually paid.
    replaced_by: >-
      Where the certificate carries exactly one settled payment and a deductible was withheld from
      it, the amount the restoration is held to is that payment together with the deductible
      withheld from it.
  trigger: state_due
  subject: [care_claim_recovery]
  computes: restored_amount_usd
  target_tool: declare_supplier_compensation_6de86425
  params:
    documented_share_pct: 100
    partly_documented_share_pct: 90
    undocumented_share_pct: 70
    deductible_borne_over_share_pct: 85
    deductible_borne_under_share_pct: 70
    no_deductible_share_pct: 100
  rule: >
    Where a supplier has paid the traveller for a loss the certificate has already settled, the
    traveller declares what they received and that amount is restored to the benefit the certificate
    records as consumed. The amount the supplier has paid is taken as every amount the supplier has
    returned on the traveller's booking for the journey. That amount is then taken at the share which
    the evidence standing behind it carries and at the share which the certificate takes back. The
    share which the evidence standing behind it carries is seventy per cent. The share which the
    certificate takes back is the whole of it. The amount the restoration is held to is the largest
    payment the certificate has settled less the deductible withheld from it. The amount restored is
    the lesser of the amount so taken and the amount the restoration is held to, rounded to two
    decimal places, and it is entered against the benefit consumed as a negative figure.
    Where the traveller's booking carries a notice of the supplier's own disruption and the booking
    stands as travelled, the amount the supplier has paid is taken as the amounts the supplier raised
    on that disruption alone. Where the traveller's booking carries a notice of the supplier's own
    disruption and the booking does not stand as travelled, the amount the supplier has paid is taken
    as the amounts the supplier has returned on the booking in the six months to the declaration.
    Where neither holds, the amount the supplier has paid is taken as every amount the supplier has
    returned on the traveller's booking for the journey.
    Where the supplier's return was raised on the supplier's own disruption and the certificate's claim record names the evidence that supports the claim, the share which the evidence standing behind it carries is the whole of it. Where the supplier's return was raised on the supplier's own disruption and the certificate's claim record names no evidence, the share which the evidence standing behind it carries is ninety per cent. Where neither holds, the share which the evidence standing behind it carries is seventy per cent.
    Where a deductible was withheld from the payment the certificate settled and the supplier has
    paid the traveller more than that payment, the share which the certificate takes back is
    eighty-five per cent, because the traveller bore the deductible themselves and keeps that share
    of what the supplier paid. Where a deductible was withheld from the payment the certificate
    settled and the supplier has paid the traveller that payment or less, the share which the
    certificate takes back is seventy per cent. Where neither holds, the share which the certificate
    takes back is the whole of it.
    Where the certificate carries exactly one settled payment and a deductible was withheld from it,
    the amount the restoration is held to is that payment together with the deductible withheld from
    it. Where the certificate carries more than one settled payment and a deductible was withheld
    from them, the amount the restoration is held to is the total of the payments settled. Where
    neither holds, the amount the restoration is held to is the largest payment the certificate has
    settled less the deductible withheld from it.
  prerequisite: []
  cross_category:
  - category: air
    as: history
    reads: [status, air_booking_events.amount_usd]
    note: >-
      The factor deciding which of the supplier's returns count reads the traveller's air booking and
      the lines the airline has posted to it.
  compute:
  - disruption_returns: "XSUM('air','air_booking_events','amount_usd', date_field='posted_date', reason_code='involuntary_schedule_change')"
  - all_returns: "XSUM('air','air_booking_events','amount_usd', date_field='posted_date', event_type='air_refund_payout')"
  - recent_returns: "XSUM('air','air_booking_events','amount_usd', within_months=6, date_field='posted_date', event_type='air_refund_payout')"
  - booking_notices: "XCOUNT('air','air_booking_events', date_field='posted_date', event_type='air_schedule_change_notice')"
  - booking_standing: "CFIELD('air','status')"
  - scoped_returns: "disruption_returns if (booking_notices >= 1 and booking_standing == 'travelled') else (recent_returns if (booking_notices >= 1 and booking_standing != 'travelled') else all_returns)"
  - supplier_paid: "ABS(scoped_returns)"
  - supplier_notice_refs: "XCOUNT('air','air_booking_events', date_field='posted_date', charge_category='refund_payout', reason_code='involuntary_schedule_change')"
  - claim_document_ref: "LATEST('care_claims','supporting_document_reference', date_field='filed_date', event_type='care_claim_file')"
  - evidence_share: "K('documented_share_pct') if (supplier_notice_refs >= 1 and claim_document_ref != '') else (K('partly_documented_share_pct') if (supplier_notice_refs >= 1 and claim_document_ref == '') else K('undocumented_share_pct'))"
  - settlement_deductible: "MAX('care_claims','deductible_applied_usd', event_type='care_claim_payout')"
  - largest_settlement: "MAX('care_claims','paid_amount_usd', event_type='care_claim_payout')"
  - retained_share: "K('deductible_borne_over_share_pct') if (settlement_deductible > 0 and supplier_paid > largest_settlement) else (K('deductible_borne_under_share_pct') if (settlement_deductible > 0 and supplier_paid <= largest_settlement) else K('no_deductible_share_pct'))"
  - payout_total: "SUM('care_claims','paid_amount_usd', date_field='decided_date', event_type='care_claim_payout')"
  - deductible_total: "SUM('care_claims','deductible_applied_usd', date_field='decided_date', event_type='care_claim_payout')"
  - payout_count: "COUNT('care_claims', date_field='decided_date', event_type='care_claim_payout')"
  - restoration_bound: "(payout_total + deductible_total) if (payout_count == 1 and deductible_total > 0) else (payout_total if (payout_count > 1 and deductible_total > 0) else (largest_settlement - settlement_deductible))"
  - recoverable: "supplier_paid * evidence_share/100.0 * retained_share/100.0"
  - result: "0 - RND(MN(recoverable, restoration_bound), 2)"
  compute_basis:
    disruption_returns: "Where the traveller's booking carries a notice of the supplier's own disruption and the booking stands as travelled, the amount the supplier has paid is taken as the amounts the supplier raised on that disruption alone."
    all_returns: "Where neither holds, the amount the supplier has paid is taken as every amount the supplier has returned on the traveller's booking for the journey."
    recent_returns: "Where the traveller's booking carries a notice of the supplier's own disruption and the booking does not stand as travelled, the amount the supplier has paid is taken as the amounts the supplier has returned on the booking in the six months to the declaration."
    booking_notices: "Where the traveller's booking carries a notice of the supplier's own disruption and the booking stands as travelled, the amount the supplier has paid is taken as the amounts the supplier raised on that disruption alone."
    booking_standing: "Where the traveller's booking carries a notice of the supplier's own disruption and the booking does not stand as travelled, the amount the supplier has paid is taken as the amounts the supplier has returned on the booking in the six months to the declaration."
    scoped_returns: "Where the traveller's booking carries a notice of the supplier's own disruption and the booking stands as travelled, the amount the supplier has paid is taken as the amounts the supplier raised on that disruption alone. Where the traveller's booking carries a notice of the supplier's own disruption and the booking does not stand as travelled, the amount the supplier has paid is taken as the amounts the supplier has returned on the booking in the six months to the declaration. Where neither holds, the amount the supplier has paid is taken as every amount the supplier has returned on the traveller's booking for the journey."
    supplier_notice_refs: "Where the supplier's return was raised on the supplier's own disruption and the certificate's claim record names the evidence that supports the claim, the share which the evidence standing behind it carries is the whole of it."
    claim_document_ref: "Where the supplier's return was raised on the supplier's own disruption and the certificate's claim record names no evidence, the share which the evidence standing behind it carries is ninety per cent."
    evidence_share: "Where the supplier's return was raised on the supplier's own disruption and the certificate's claim record names the evidence that supports the claim, the share which the evidence standing behind it carries is the whole of it. Where the supplier's return was raised on the supplier's own disruption and the certificate's claim record names no evidence, the share which the evidence standing behind it carries is ninety per cent. Where neither holds, the share which the evidence standing behind it carries is seventy per cent."
    settlement_deductible: "Where a deductible was withheld from the payment the certificate settled and the supplier has paid the traveller more than that payment, the share which the certificate takes back is eighty-five per cent, because the traveller bore the deductible themselves and keeps that share of what the supplier paid."
    largest_settlement: "Where a deductible was withheld from the payment the certificate settled and the supplier has paid the traveller that payment or less, the share which the certificate takes back is seventy per cent."
    retained_share: "Where a deductible was withheld from the payment the certificate settled and the supplier has paid the traveller more than that payment, the share which the certificate takes back is eighty-five per cent, because the traveller bore the deductible themselves and keeps that share of what the supplier paid. Where a deductible was withheld from the payment the certificate settled and the supplier has paid the traveller that payment or less, the share which the certificate takes back is seventy per cent. Where neither holds, the share which the certificate takes back is the whole of it."
    payout_total: "Where the certificate carries more than one settled payment and a deductible was withheld from them, the amount the restoration is held to is the total of the payments settled."
    deductible_total: "Where the certificate carries exactly one settled payment and a deductible was withheld from it, the amount the restoration is held to is that payment together with the deductible withheld from it."
    payout_count: "Where the certificate carries exactly one settled payment and a deductible was withheld from it, the amount the restoration is held to is that payment together with the deductible withheld from it."
    restoration_bound: "Where the certificate carries exactly one settled payment and a deductible was withheld from it, the amount the restoration is held to is that payment together with the deductible withheld from it. Where the certificate carries more than one settled payment and a deductible was withheld from them, the amount the restoration is held to is the total of the payments settled. Where neither holds, the amount the restoration is held to is the largest payment the certificate has settled less the deductible withheld from it."
    recoverable: "That amount is then taken at the share which the evidence standing behind it carries and at the share which the certificate takes back."
    result: "The amount restored is the lesser of the amount so taken and the amount the restoration is held to, rounded to two decimal places, and it is entered against the benefit consumed as a negative figure."
  factors:
  - id: supplier_return_scope
    effect: method
    decides: scoped_returns
    bindings: [disruption_returns, all_returns, recent_returns, booking_notices, booking_standing, scoped_returns, supplier_paid]
    ladder:
    - when: "the traveller's booking carries a notice of the supplier's own disruption and the booking stands as travelled"
      method: "the amount the supplier has paid is taken as the amounts the supplier raised on that disruption alone"
    - when: "the traveller's booking carries a notice of the supplier's own disruption and the booking does not stand as travelled"
      method: "the amount the supplier has paid is taken as the amounts the supplier has returned on the booking in the six months to the declaration"
    - when: "otherwise"
      method: "the amount the supplier has paid is taken as every amount the supplier has returned on the traveller's booking for the journey"
