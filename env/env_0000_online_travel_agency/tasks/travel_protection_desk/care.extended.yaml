    everything else. A club discount is applied to the rated premium after loadings and before the policy fee, and never to the policy fee itself. Cover bought alongside an air booking or a vacation package
    is rated on the same declared trip cost as that booking, and the two are corrected together where the booking''s price changes. A club discount and a corporate programme rate are mutually exclusive:
    a policy bought under a corporate programme takes the programme''s negotiated premium and no club discount on top. Club points accrue on the premium actually paid, at the earn rate of the plan held,
