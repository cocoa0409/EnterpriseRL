    bindings: [supplier_notice_refs, claim_document_ref, evidence_share]
    ladder:
    - when: "the supplier's return was raised on the supplier's own disruption and the certificate's claim record names the evidence that supports the claim"
      value: "K('documented_share_pct')"
    - when: "the supplier's return was raised on the supplier's own disruption and the certificate's claim record names no evidence"
      value: "K('partly_documented_share_pct')"
    - when: "otherwise"
      value: "K('undocumented_share_pct')"
    baseline:
      evidence_share: "K('undocumented_share_pct')"
    evidence: [cross_category, history]
    cross_difficulty: air
  - id: certificate_retained_share
    effect: parameter
    decides: retained_share
    bindings: [settlement_deductible, largest_settlement, retained_share]
    ladder:
    - when: "a deductible was withheld from the payment the certificate settled and the supplier has paid the traveller more than that payment"
      value: "K('deductible_borne_over_share_pct')"
    - when: "a deductible was withheld from the payment the certificate settled and the supplier has paid the traveller that payment or less"
      value: "K('deductible_borne_under_share_pct')"
    - when: "otherwise"
      value: "K('no_deductible_share_pct')"
    baseline:
      retained_share: "K('no_deductible_share_pct')"
    evidence: [history]
    cross_difficulty: null
  - id: restoration_bound_basis
    effect: method
    decides: restoration_bound
    bindings: [payout_total, deductible_total, payout_count, restoration_bound]
    ladder:
    - when: "the certificate carries exactly one settled payment and a deductible was withheld from it"
      method: "the amount the restoration is held to is that payment together with the deductible withheld from it"
    - when: "the certificate carries more than one settled payment and a deductible was withheld from them"
      method: "the amount the restoration is held to is the total of the payments settled"
    - when: "otherwise"
      method: "the amount the restoration is held to is the largest payment the certificate has settled less the deductible withheld from it"
    baseline:
      restoration_bound: "largest_settlement - settlement_deductible"
    evidence: [history]
    cross_difficulty: null
  baseline:
    rule: >-
      Where a supplier has paid the traveller for a loss the certificate has already settled, the
      traveller declares what they received and that amount is restored to the benefit the
      certificate records as consumed. The amount the supplier has paid is taken as every amount the
      supplier has returned on the traveller's booking for the journey. That amount is then taken at
      the share which the evidence standing behind it carries and at the share which the certificate
      takes back. The share which the evidence standing behind it carries is seventy per cent. The
      share which the certificate takes back is the whole of it. The amount the restoration is held
      to is the largest payment the certificate has settled less the deductible withheld from it. The
      amount restored is the lesser of the amount so taken and the amount the restoration is held to,
      rounded to two decimal places, and it is entered against the benefit consumed as a negative
      figure.
    params: [undocumented_share_pct, no_deductible_share_pct]
  inputs:
    history:
    - {category: air, table: air_booking_events, aggregate: sum, field: amount_usd, within_months: null, filters: {reason_code: involuntary_schedule_change}}
    - {table: care_claims, aggregate: sum, field: paid_amount_usd, within_months: null, filters: {event_type: care_claim_payout}}
    - {table: care_claims, aggregate: max, field: deductible_applied_usd, within_months: null, filters: {event_type: care_claim_payout}}
    cross_category: [air]
- id: care_ext_settled_benefit_payment
  base_policy_refs: [care_claim_settlement, care_agg_benefit_coordination]
  overwrite:
  - base_policy: care_claim_settlement
    superseded_clause: >-
      An allowed claim is paid at the lower of the amount allowed and the benefit limit that applies
      to it, less the deductible that applies to it.
    replaced_by: >-
      The settlement paid is the lesser of the allowance taken and what remains of the limit, less
      the deductible withheld, and it is rounded to two decimal places and never falls below nothing.
  - base_policy: care_claim_settlement
    superseded_clause: >-
      the total withheld across all claims on one policy never exceeds the plan's policy deductible
      ceiling
    replaced_by: >-
      Where neither holds, the deductible withheld is the deductible the benefit calls for taken once
      for each insured traveller named on the certificate.
  trigger: state_due
  subject: [care_claim_payout]
  computes: paid_amount_usd
  target_tool: settle_benefit_payment_411249ab
  params:
    documented_allowance_share_pct: 100
    late_document_share_pct: 75
    undocumented_allowance_share_pct: 50
    ceiling_reached_deductible_usd: 0
  rule: >
    A decision the insurer has allowed on a certificate is settled by one payment to the
    policyholder. The allowance taken is the allowance on the decision the insurer reached last,
    taken at the share which the evidence supporting the claim carries. The share which the evidence
    supporting the claim carries is fifty per cent. The limit the benefit claimed carries is the
    plan's amount for that benefit taken once for each insured traveller named on the certificate.
    What remains of the limit is that limit less the benefit the certificate records as consumed, and
    it never falls below nothing. The benefit the certificate records as consumed is the figure its
    benefit account carries. The deductible the benefit calls for is nothing. The deductible withheld
    is the deductible the benefit calls for taken once for each insured traveller named on the
    certificate. The settlement paid is the lesser of the allowance taken and what remains of the
    limit, less the deductible withheld, and it is rounded to two decimal places and never falls
    below nothing.
    A settlement is paid on a certificate only after its premium lines carry every rating component
    the certificate's declared particulars call for. The benefit a settlement pays is fixed only
    after the benefit the certificate records as consumed carries a restoration for every amount a
    supplier has paid the traveller for a loss the certificate has already settled.
    Where the benefit allowed is one the plan states as an amount for each insured traveller and the
    certificate names more than one insured traveller, the limit the benefit claimed carries is the
    plan's amount for that benefit. Where the benefit allowed
    is one the plan states as a share of the declared trip cost and the certificate declares a trip
    cost above nothing, the limit the benefit claimed carries is that share of the declared trip cost.
    Where neither holds, the limit the benefit claimed carries is the plan's amount for that benefit
    taken once for each insured traveller named on the certificate.
    Where the certificate carries a payment settled in this policy term and it carries an amount
    restored from a liable third party, the benefit the certificate records as consumed is the
    payments it has settled less the amounts restored. Where the certificate carries a payment settled
    in this policy term and it carries no amount restored, the benefit the certificate records as
    consumed is the payments it has settled. Where neither holds, the benefit the certificate records
    as consumed is the figure its benefit account carries.
    Where the claim the insurer allowed names the evidence that supports it and that evidence reached
    the insurer within the plan's deadline for supporting documents counted from the day the claim was
    filed, the share which the evidence supporting the claim carries is the whole of the allowance.
    Where the claim the insurer allowed names the evidence that supports it and that evidence reached
    the insurer after that deadline, the share which the evidence supporting the claim carries is
    seventy-five per cent. Where neither holds, the share which the evidence supporting the claim
    carries is fifty per cent.
    Where the benefit allowed is the emergency medical benefit and the certificate has not reached the
    plan's ceiling on deductibles withheld, the deductible the benefit calls for is the deductible that
    benefit names. Where the benefit allowed is any other benefit and the certificate has not reached
    the plan's ceiling on deductibles withheld, the deductible the benefit calls for is the plan's
    general deductible for each claim. Where neither holds, the deductible the benefit calls for is
    nothing.
    Where the certificate has settled a payment in this policy term and what remains of the plan's
    ceiling is less than the deductible the benefit calls for, the deductible withheld is what remains
    of the plan's ceiling. Where the certificate has settled a payment in this policy term and what
    remains of the plan's ceiling is the deductible the benefit calls for or more, the deductible
    withheld is the deductible the benefit calls for. Where neither holds, the deductible withheld is
    the deductible the benefit calls for taken once for each insured traveller named on the
    certificate.
  prerequisite:
  - problem: care_ext_supplier_recovery_declaration
    kind: value_input
    gate: benefit_consumed
    form: state
    policy_source: >-
      The benefit a settlement pays is fixed only after the benefit the certificate records as
      consumed carries a restoration for every amount a supplier has paid the traveller for a loss
      the certificate has already settled.
    condition: >-
      the certificate's claim record carries a restoration entry against every amount a supplier has
      paid the traveller for a loss already settled under that certificate
    resolved_by: declare_supplier_compensation_6de86425
    effect: >-
      the benefit the certificate records as consumed falls by the amount restored, so that what
      remains of the limit rises by the same amount before the settlement is worked out
  - problem: care_ext_outstanding_loading_charge
    kind: state_gate
    gate: care_premium_entries.charge_category
    form: state
    policy_source: >-
      A settlement is paid on a certificate only after its premium lines carry every rating component
      the certificate's declared particulars call for.
    condition: >-
      the certificate's premium lines carry a destination loading line for the region the certificate
      declares
    resolved_by: charge_destination_loading_6e26c317
    effect: >-
      the certificate's premium lines carry the destination loading its declared region calls for, so
      that the settlement may be paid at all
  cross_category: []
  compute:
  - allowed_amount: "LATEST('care_claims','paid_amount_usd', date_field='decided_date', event_type='care_claim_decision')"
  - claim_type_paid: "LATEST('care_claims','claim_type', date_field='decided_date', event_type='care_claim_decision')"
  - stated_limit: "P('baggage_loss_limit_usd') if claim_type_paid == 'baggage_loss' else (P('baggage_delay_limit_usd') if claim_type_paid == 'baggage_delay' else (P('travel_delay_limit_usd') if claim_type_paid == 'travel_delay' else (P('missed_connection_limit_usd') if claim_type_paid == 'missed_connection' else (P('medical_emergency_limit_usd') if claim_type_paid == 'medical_emergency' else (P('dental_emergency_limit_usd') if claim_type_paid == 'dental_emergency' else (P('evacuation_limit_usd') if claim_type_paid == 'evacuation' else (P('rental_damage_limit_usd') if claim_type_paid == 'rental_damage' else ((P('trip_interruption_limit_pct')/100.0*F('trip_cost_usd')) if claim_type_paid == 'trip_interruption' else ((P('cfar_reimbursement_pct')/100.0*F('trip_cost_usd')) if claim_type_paid == 'cancel_for_any_reason' else ((P('trip_cancellation_limit_pct')/100.0*F('trip_cost_usd'))))))))))))"
  - benefit_limit: "stated_limit if (claim_type_paid != 'trip_cancellation' and F('insured_count') > 1) else ((P('trip_cancellation_limit_pct')/100.0*F('trip_cost_usd')) if (claim_type_paid == 'trip_cancellation' and F('trip_cost_usd') > 0) else (stated_limit * F('insured_count')))"
  - settled_payments: "SUM('care_claims','paid_amount_usd', date_field='decided_date', event_type='care_claim_payout')"
  - restored_amounts: "SUM('care_claims','paid_amount_usd', date_field='decided_date', event_type='care_claim_recovery')"
  - benefit_consumed: "(settled_payments + restored_amounts) if (settled_payments > 0 and restored_amounts != 0) else (settled_payments if (settled_payments > 0 and restored_amounts == 0) else F('benefit_used_usd'))"
  - limit_remaining: "MX(0.0, benefit_limit - benefit_consumed)"
  - claim_filed_date: "LATEST('care_claims','filed_date', date_field='filed_date', event_type='care_claim_file')"
  - claim_doc_ref: "LATEST('care_claims','supporting_document_reference', date_field='filed_date', event_type='care_claim_file')"
  - decision_date: "LATEST('care_claims','decided_date', date_field='decided_date', event_type='care_claim_decision')"
  - document_days: "DAYS(claim_filed_date, decision_date)"
  - document_share: "K('documented_allowance_share_pct') if (claim_doc_ref != '' and document_days <= P('claim_document_deadline_days')) else (K('late_document_share_pct') if (claim_doc_ref != '' and document_days > P('claim_document_deadline_days')) else K('undocumented_allowance_share_pct'))"
  - allowance_taken: "allowed_amount * document_share/100.0"
  - deductible_withheld_total: "SUM('care_claims','deductible_applied_usd', date_field='decided_date', event_type='care_claim_payout')"
  - deductible_headroom: "P('deductible_per_policy_usd') - deductible_withheld_total"
  - deductible_called_for: "P('medical_deductible_usd') if (claim_type_paid == 'medical_emergency' and deductible_headroom > 0) else (P('deductible_per_claim_usd') if (claim_type_paid != 'medical_emergency' and deductible_headroom > 0) else K('ceiling_reached_deductible_usd'))"
  - term_withholdings: "COUNT('care_claims', date_field='decided_date', event_type='care_claim_payout')"
  - deductible_applied: "deductible_headroom if (term_withholdings >= 1 and deductible_headroom < deductible_called_for) else (deductible_called_for if (term_withholdings >= 1 and deductible_headroom >= deductible_called_for) else (deductible_called_for * F('insured_count')))"
  - result: "RND(MX(0.0, MN(allowance_taken, limit_remaining) - deductible_applied), 2)"
