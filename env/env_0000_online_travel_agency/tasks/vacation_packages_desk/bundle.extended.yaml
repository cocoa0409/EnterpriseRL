- id: bundle_ext_cancellation_penalty_withholding
  base_policy_refs:
  - bundle_cancellation
  - bundle_payment_schedule
  - bundle_agg_party_pricing
  overwrite:
  - base_policy: bundle_cancellation
    superseded_clause: The penalty is read off the product's cancellation ladder by how many whole days lie between
      the cancellation and the departure date
    replaced_by: The cancellation share taken on the penalised value is the standing share of the desk's cancellation
      schedule.
  - base_policy: bundle_cancellation
    superseded_clause: applied to the package price of the places being given up
    replaced_by: Where the money the party has put into the package reaches the package price and the package
      ledger carries components priced onto it beyond that price, the penalised value is instead the package price
      together with those components, the suppliers having been paid for both.
  - base_policy: bundle_cancellation
    superseded_clause: The deposit is returned only on a product whose deposit is refundable, and on every other
      product it is forfeited in full even where the ladder would otherwise return more.
    replaced_by: Where the product returns the deposit on cancellation and the deposit taken on the package is
      less than the figure the ladder gives, that figure is instead reduced by the deposit taken, which is ring-fenced
      and comes back to the party whole.
  - base_policy: bundle_cancellation
    superseded_clause: The product's administration charge is withheld per traveller on every cancellation whatever
      the ladder says
    replaced_by: Where the party confirmed the cancellation later than the day the balance fell due on the package,
      the product's administration charge is instead withheld for every traveller recorded as travelling, the
      desk having worked the file through to the end.
  trigger: state_due
  subject:
  - bundle_penalty_charge
  computes: cancellation_penalty_usd
  target_tool: withhold_cancellation_penalty_6c06e997
  params:
    standing_cancellation_share_pct: 10
    near_departure_share_pct: 90
    inside_six_weeks_share_pct: 55
    inside_three_months_share_pct: 30
    frequent_package_threshold_36m: 3
    high_activity_multiple: 2
    loyalty_relief_pct: 3
    relief_softened_share: 0.5
  rule: The penalty withheld on a cancelled vacation package is worked out from the desk's own cancellation schedule,
    the money the party had put into the package and the traveller's record with the traveller club, and it is
    withheld from the party as a whole. The penalised value the ladder is taken on is the package price recorded
    on the package. Where the money the party has put into the package reaches the package price and the package
    ledger carries components priced onto it beyond that price, the penalised value is instead the package price
    together with those components, the suppliers having been paid for both. Where the money the party has put
    in falls short of the package price and some money has been put in, the penalised value is instead the money
    the party has actually put in. The cancellation share taken on the penalised value is the standing share of
    the desk's cancellation schedule. Where fourteen days or fewer lie between the day the party confirmed the
    cancellation and the departure date, the cancellation share is instead the near-departure share of the desk's
    cancellation schedule. Where between fifteen and forty-two days lie between them, the cancellation share is
    instead the inside-six-weeks share of the desk's cancellation schedule. Where between forty-three and eighty-nine
    days lie between them, the cancellation share is instead the inside-three-months share of the desk's cancellation
    schedule. The figure the ladder gives stands as it is. Where the product returns the deposit on cancellation
    and the deposit taken on the package is less than the figure the ladder gives, that figure is instead reduced
    by the deposit taken, which is ring-fenced and comes back to the party whole. Where the product returns the
    deposit on cancellation and the deposit taken is at least the figure the ladder gives, nothing is withheld
    on the ladder at all, the ring-fenced deposit covering it. Nothing is withheld as an administration charge.
    Where the party confirmed the cancellation later than the day the balance fell due on the package, the product's
    administration charge is instead withheld for every traveller recorded as travelling, the desk having worked
    the file through to the end. Where the party confirmed the cancellation on or before that day and the package
    ledger carries at least one instalment of the balance, the product's administration charge is instead withheld
    once for the package. The whole of the figure reached is withheld. Where the club ledger shows the traveller
    has booked more than twice the frequent-traveller threshold of packages in the last thirty-six months, the
    desk's loyalty relief is instead taken off the figure reached in full. Where the club ledger shows the traveller
    has booked more than the frequent-traveller threshold of packages in the last thirty-six months but no more
    than twice that threshold, one half of the desk's loyalty relief is instead taken off the figure reached.
    The cancellation share acts on the penalised value alone, the deposit is ring-fenced out of the figure that
    share gives before anything is added, the administration charge is added to what is left of it, and the loyalty
    relief acts last on that sum. The penalty withheld is rounded half up to the nearest cent at the end and at
    no earlier point.
  prerequisite: []
  cross_category:
  - category: club
    as: history
    reads:
    - club_points_entries.accrual_source
    - club_points_entries.points_kind
    note: The package bookings the club ledger shows accrued as qualifying in the last thirty-six months decide
      the loyalty relief taken off the penalty withheld.
  compute:
  - days_to_departure_at_cancellation: DAYS(F('cancelled_at'), F('departure_date'))
  - cancellation_share_pct: K('near_departure_share_pct') if days_to_departure_at_cancellation <= 14 else (K('inside_six_weeks_share_pct')
      if days_to_departure_at_cancellation <= 42 else (K('inside_three_months_share_pct') if days_to_departure_at_cancellation
      <= 89 else K('standing_cancellation_share_pct')))
  - components_priced: SUM('bundle_ledger_entries', 'amount_usd', date_field='posted_date', event_type='bundle_component_charge')
  - money_paid_in: SUM('bundle_ledger_entries', 'amount_usd', date_field='posted_date', event_type='bundle_deposit_charge')
      + SUM('bundle_ledger_entries', 'amount_usd', date_field='posted_date', event_type='bundle_final_payment_charge')
  - penalised_value: F('package_price_usd') + components_priced if money_paid_in >= F('package_price_usd') and
      components_priced > 0 else (money_paid_in if money_paid_in < F('package_price_usd') and money_paid_in >
      0 else F('package_price_usd'))
  - ladder_amount: penalised_value * cancellation_share_pct / 100
  - deposit_taken: SUM('bundle_ledger_entries', 'amount_usd', date_field='posted_date', event_type='bundle_deposit_charge')
  - ladder_after_deposit: MX(0, ladder_amount - deposit_taken) if P('deposit_refundable') and deposit_taken <
      ladder_amount else (0 if P('deposit_refundable') and deposit_taken >= ladder_amount else ladder_amount)
  - days_from_due_to_cancellation: DAYS(F('final_payment_due_date'), F('cancelled_at'))
  - instalments_paid: COUNT('bundle_ledger_entries', date_field='posted_date', event_type='bundle_final_payment_charge')
  - administration_withheld: P('cancellation_admin_fee_per_person_usd') * (F('party_adults') + F('party_children'))
      if days_from_due_to_cancellation > 0 else (P('cancellation_admin_fee_per_person_usd') if instalments_paid
      > 0 else 0)
  - package_bookings_36m: XCOUNT('club', 'club_points_entries', within_months=36, date_field='posted_date', accrual_source='bundle_booking',
      points_kind='qualifying')
  - loyalty_relief_applied_pct: K('loyalty_relief_pct') if package_bookings_36m > K('frequent_package_threshold_36m')
      * K('high_activity_multiple') else (K('loyalty_relief_pct') * K('relief_softened_share') if package_bookings_36m
      > K('frequent_package_threshold_36m') else 0)
  - result: RND((ladder_after_deposit + administration_withheld) * (1 - loyalty_relief_applied_pct / 100), 2)
  compute_basis:
    days_to_departure_at_cancellation: Where fourteen days or fewer lie between the day the party confirmed the
      cancellation and the departure date, the cancellation share is instead the near-departure share of the desk's
      cancellation schedule.
    cancellation_share_pct: The cancellation share taken on the penalised value is the standing share of the desk's
      cancellation schedule. Where fourteen days or fewer lie between the day the party confirmed the cancellation
      and the departure date, the cancellation share is instead the near-departure share of the desk's cancellation
      schedule. Where between fifteen and forty-two days lie between them, the cancellation share is instead the
      inside-six-weeks share of the desk's cancellation schedule. Where between forty-three and eighty-nine days
      lie between them, the cancellation share is instead the inside-three-months share of the desk's cancellation
      schedule.
    components_priced: Where the money the party has put into the package reaches the package price and the package
      ledger carries components priced onto it beyond that price, the penalised value is instead the package price
      together with those components, the suppliers having been paid for both.
    money_paid_in: Where the money the party has put in falls short of the package price and some money has been
      put in, the penalised value is instead the money the party has actually put in.
    penalised_value: The penalised value the ladder is taken on is the package price recorded on the package.
      Where the money the party has put into the package reaches the package price and the package ledger carries
      components priced onto it beyond that price, the penalised value is instead the package price together with
      those components, the suppliers having been paid for both. Where the money the party has put in falls short
      of the package price and some money has been put in, the penalised value is instead the money the party
      has actually put in.
    ladder_amount: The cancellation share acts on the penalised value alone, the deposit is ring-fenced out of
      the figure that share gives before anything is added, the administration charge is added to what is left
      of it, and the loyalty relief acts last on that sum.
    deposit_taken: Where the product returns the deposit on cancellation and the deposit taken on the package
      is less than the figure the ladder gives, that figure is instead reduced by the deposit taken, which is
      ring-fenced and comes back to the party whole.
    ladder_after_deposit: The figure the ladder gives stands as it is. Where the product returns the deposit on
      cancellation and the deposit taken on the package is less than the figure the ladder gives, that figure
      is instead reduced by the deposit taken, which is ring-fenced and comes back to the party whole. Where the
      product returns the deposit on cancellation and the deposit taken is at least the figure the ladder gives,
      nothing is withheld on the ladder at all, the ring-fenced deposit covering it.
    days_from_due_to_cancellation: Where the party confirmed the cancellation later than the day the balance fell
      due on the package, the product's administration charge is instead withheld for every traveller recorded
      as travelling, the desk having worked the file through to the end.
    instalments_paid: Where the party confirmed the cancellation on or before that day and the package ledger
      carries at least one instalment of the balance, the product's administration charge is instead withheld
      once for the package.
    administration_withheld: Nothing is withheld as an administration charge. Where the party confirmed the cancellation
      later than the day the balance fell due on the package, the product's administration charge is instead withheld
      for every traveller recorded as travelling, the desk having worked the file through to the end. Where the
      party confirmed the cancellation on or before that day and the package ledger carries at least one instalment
      of the balance, the product's administration charge is instead withheld once for the package.
    package_bookings_36m: Where the club ledger shows the traveller has booked more than twice the frequent-traveller
      threshold of packages in the last thirty-six months, the desk's loyalty relief is instead taken off the
      figure reached in full.
    loyalty_relief_applied_pct: The whole of the figure reached is withheld. Where the club ledger shows the traveller
      has booked more than twice the frequent-traveller threshold of packages in the last thirty-six months, the
      desk's loyalty relief is instead taken off the figure reached in full. Where the club ledger shows the traveller
      has booked more than the frequent-traveller threshold of packages in the last thirty-six months but no more
      than twice that threshold, one half of the desk's loyalty relief is instead taken off the figure reached.
    result: The penalty withheld is rounded half up to the nearest cent at the end and at no earlier point.
  factors:
  - id: cancellation_share_ladder
    effect: parameter
    decides: cancellation_share_pct
    bindings:
    - days_to_departure_at_cancellation
    - cancellation_share_pct
    ladder:
    - when: fourteen days or fewer lie between the day the party confirmed the cancellation and the departure
        date
      value: the near-departure share of the desk's cancellation schedule
    - when: between fifteen and forty-two days lie between the day the party confirmed the cancellation and the
        departure date
      value: the inside-six-weeks share of the desk's cancellation schedule
    - when: between forty-three and eighty-nine days lie between the day the party confirmed the cancellation
        and the departure date
      value: the inside-three-months share of the desk's cancellation schedule
    - when: otherwise
      value: the standing share of the desk's cancellation schedule
    baseline:
      cancellation_share_pct: K('standing_cancellation_share_pct')
    evidence:
    - date
    cross_difficulty: null
  - id: penalised_value_basis
    effect: method
    decides: penalised_value
    bindings:
    - components_priced
    - money_paid_in
    - penalised_value
    ladder:
    - when: the money the party has put into the package reaches the package price and the package ledger carries
        components priced onto it beyond that price
      method: the penalised value is the package price together with the components priced onto the ledger
    - when: the money the party has put into the package falls short of the package price and some money has been
        put in
      method: the penalised value is the money the party has actually put in
    - when: otherwise
      method: the penalised value is the package price recorded on the package
    baseline:
      penalised_value: F('package_price_usd')
    evidence:
    - history
    cross_difficulty: null
  - id: deposit_ring_fence
    effect: method
    decides: ladder_after_deposit
    bindings:
    - deposit_taken
    - ladder_after_deposit
    ladder:
    - when: the product returns the deposit on cancellation and the deposit taken on the package is less than
        the figure the ladder gives
      method: the figure the ladder gives is reduced by the deposit taken, which is ring-fenced and comes back
        to the party whole
    - when: the product returns the deposit on cancellation and the deposit taken on the package is at least the
        figure the ladder gives
      method: nothing is withheld on the ladder at all, the ring-fenced deposit covering it
    - when: otherwise
      method: the figure the ladder gives stands as it is
    baseline:
      ladder_after_deposit: ladder_amount
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: cancellation_administration_charge
    effect: parameter
    decides: administration_withheld
    bindings:
    - days_from_due_to_cancellation
    - instalments_paid
    - administration_withheld
    ladder:
    - when: the party confirmed the cancellation later than the day the balance fell due on the package
      value: the product's administration charge for every traveller recorded as travelling
    - when: the party confirmed the cancellation on or before the day the balance fell due and the package ledger
        carries at least one instalment of the balance
      value: the product's administration charge, once for the package
    - when: otherwise
      value: nothing
    baseline:
      administration_withheld: '0'
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: frequent_traveller_penalty_relief
    effect: parameter
    decides: loyalty_relief_applied_pct
    bindings:
    - package_bookings_36m
    - loyalty_relief_applied_pct
    ladder:
    - when: the club ledger shows the traveller has booked more than twice the frequent-traveller threshold of
        packages in the last thirty-six months
      value: the desk's loyalty relief in full
    - when: the club ledger shows the traveller has booked more than the frequent-traveller threshold of packages
        in the last thirty-six months but no more than twice that threshold
      value: one half of the desk's loyalty relief
    - when: otherwise
      value: nothing
    baseline:
      loyalty_relief_applied_pct: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: club
  baseline:
    rule: The penalty withheld on a cancelled vacation package is worked out from the desk's own cancellation
      schedule, the money the party had put into the package and the traveller's record with the traveller club,
      and it is withheld from the party as a whole. The penalised value the ladder is taken on is the package
      price recorded on the package. The cancellation share taken on the penalised value is the standing share
      of the desk's cancellation schedule. The figure the ladder gives stands as it is. Nothing is withheld as
      an administration charge. The whole of the figure reached is withheld. The penalty withheld is rounded half
      up to the nearest cent at the end and at no earlier point.
    params:
    - standing_cancellation_share_pct
