- id: bundle_evt_supplier_notice
  subject:
  - bundle_supplier_notice
  rule: A surcharge may be added after booking only on a product that allows it, only after the product's price-guarantee
    term has run out, and only where the party is notified at least the product's notice days before departure.
    A surcharge at or below the product's threshold share of the package price must be paid, and a surcharge above
    it entitles the party to cancel with nothing withheld or to accept a comparable alternative. A product with
    no surcharge right carries none at all, whatever happens to fuel prices or exchange rates. Where the operator
    changes the itinerary significantly before departure, the party may accept the change, take a comparable alternative
    or cancel with nothing withheld, and the choice is the party's alone. A change of flight timing of less than
    the operator's own materiality threshold, a change of carrier or a change of room within the same grade is
    not a significant change. Several notices about the same package are not added together; the last notice standing
    before departure decides what is owed and what may be refused.
