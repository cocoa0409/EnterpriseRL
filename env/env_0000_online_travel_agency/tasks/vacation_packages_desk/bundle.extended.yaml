- id: bundle_ext_balance_instalment_call
  base_policy_refs:
  - bundle_payment_schedule
  - bundle_club_and_corporate_interaction
  - bundle_agg_party_pricing
  - bundle_components
  overwrite:
  - base_policy: bundle_payment_schedule
    superseded_clause: A product that allows instalments splits the balance into its own number of equal instalments
      falling due at equal intervals between the deposit and the final-payment date, and the last instalment is
      adjusted for rounding.
    replaced_by: Where the product allows the balance to be paid in instalments and the package ledger already
      carries at least one instalment of the balance, the instalment called is instead what the package still
      owes divided by the number of instalments the product allows less those already taken.
  - base_policy: bundle_club_and_corporate_interaction
    superseded_clause: Where the member's tier changes between deposit and departure, the discount applied at
      deposit stands and is neither topped up nor clawed back.
    replaced_by: Where an active club card stands in the traveller's name whose tier carries a package discount
      and travel protection bought with the package stands against the package, the club concession rate on the
      instalment call is the whole of that tier's package discount.
  - base_policy: bundle_club_and_corporate_interaction
    superseded_clause: the club tier held on the deposit date decides the package discount applied to the price
    replaced_by: Where an active club card stands in the traveller's name whose tier carries a package discount
      and travel protection bought with the package stands against the package, the club concession rate on the
      instalment call is the whole of that tier's package discount.
  trigger: on_request
  subject:
  - bundle_final_payment_charge
  computes: instalment_amount_usd
  target_tool: settle_package_instalment_b6602c09
  params:
    frequent_package_threshold_36m: 3
    loyalty_concession_pct: 2
    softened_concession_share: 0.5
    high_activity_multiple: 2
  rule: The instalment called on a vacation package is what the package still owes, called in one payment. The
    instalment called on a package is fixed only after the package ledger carries the amendment charge owed for
    every change the operations desk has approved against the package. The priced package value the call is worked
    out on is the package price recorded on the package. A traveller's share of the package price is the package
    price divided by the travellers the package records as travelling, and an adult sharing a room or cabin beyond
    the second in it is a third adult sharing. Where the package carries children travelling with the party, holds
    fewer rooms or cabins than it has adults travelling, and its ledger carries no line priced as a child discount
    and none priced as a third-adult discount, the priced package value is instead the package price less the
    product's child discount on a traveller's share for every child travelling and less the product's third-adult
    discount on a traveller's share for every third adult sharing. Where the package carries children travelling
    with the party, holds at least as many rooms or cabins as it has adults travelling, and its ledger carries
    no line priced as a child discount, the priced package value is instead the package price less the product's
    child discount on a traveller's share for every child travelling. Where an active club card stands in the
    traveller's name whose tier carries a package discount and travel protection bought with the package stands
    against the package, the club concession rate on the instalment call is the whole of that tier's package discount.
    Where an active club card stands in the traveller's name whose tier carries a package discount and no travel
    protection bought with the package stands against the package, the club concession rate on the instalment
    call is one half of that tier's package discount. In every other case the club concession rate on the instalment
    call is nothing. Where the club ledger shows the traveller has booked more than twice the frequent-traveller
    threshold of packages in the last thirty-six months, the loyalty concession rate on the instalment call is
    the desk's loyalty concession in full. Where the club ledger shows the traveller has booked more than the
    frequent-traveller threshold of packages in the last thirty-six months but no more than twice that threshold,
    the loyalty concession rate on the instalment call is one half of the desk's loyalty concession. In every
    other case the loyalty concession rate on the instalment call is nothing. The club concession rate and the
    loyalty concession rate are first added into one combined rate and the priced package value is reduced once
    by that combined rate; the two never act one after the other. Where the product allows a reduced promotional
    deposit and the deposit lines on the package come to no more than the product's reduced promotional deposit
    for every traveller travelling, the whole difference between the product's standard deposit for the party
    and the deposit lines actually taken falls due with this call. Where the product allows a reduced promotional
    deposit and the deposit lines on the package come to more than the product's reduced promotional deposit for
    the party but less than the product's standard deposit for the party, one half of that difference falls due
    with this call and the rest falls due with the final instalment. In every other case nothing falls due with
    this call as a deposit difference. What the package still owes is that priced package value, together with
    every component, supplement, penalty and amendment charge standing on the package ledger, less every deposit
    and every instalment already taken on the package. Anything falling due with this call as a deposit difference
    is added to what the package still owes. The instalment called is the whole of what the package still owes,
    rounded half up to the nearest cent at the end and at no earlier point. Where the product allows the balance
    to be paid in instalments and the package ledger already carries at least one instalment of the balance, the
    instalment called is instead what the package still owes divided by the number of instalments the product
    allows less those already taken. Where the product allows the balance to be paid in instalments and the package
    ledger carries no instalment of the balance, the instalment called is instead what the package still owes
    divided by the number of instalments the product allows. The combined concession rate reduces the priced package
    value alone; the charges standing on the ledger and the deposit difference are added to the reduced figure,
    the deposits and instalments already taken are subtracted last, and only then is the instalment split taken.
  prerequisite:
  - problem: bundle_ext_package_amendment_charge
    kind: value_input
    gate: charges_standing
    form: state
    policy_source: The instalment called on a package is fixed only after the package ledger carries the amendment
      charge owed for every change the operations desk has approved against the package.
    condition: the package ledger carries an amendment charge for every change the operations desk has approved
      against the package
    resolved_by: charge_package_amendment_6b64f72d
    effect: the charges standing on the package ledger take in the amendment charge owed, so what the package
      still owes, and with it the instalment called, rises by that charge
  cross_category:
  - category: club
    as: branch
    reads:
    - variant_name
    - status
    - club_points_entries.accrual_source
    note: The package discount of the tier standing on the traveller's active club card decides the club concession
      rate on the instalment call, and the package bookings its ledger shows in the last thirty-six months decide
      the loyalty concession rate.
  - category: care
    as: existence
    reads:
    - linked_bundle_package_id
    note: Whether travel protection bought with the package stands against it decides which tier of the club concession
      rate on the instalment call applies.
  compute:
  - per_person_price: F('package_price_usd') / (F('party_adults') + F('party_children'))
  - sharing_third_adults: MX(0, F('party_adults') - 2 * F('rooms_or_cabins'))
  - child_discount_lines: COUNT('bundle_ledger_entries', date_field='posted_date', event_type='bundle_component_charge',
      charge_category='child_discount')
  - third_adult_lines: COUNT('bundle_ledger_entries', date_field='posted_date', event_type='bundle_component_charge',
      charge_category='third_adult_discount')
  - priced_package_value: F('package_price_usd') - per_person_price * P('child_discount_pct') / 100 * F('party_children')
      - per_person_price * P('third_adult_discount_pct') / 100 * sharing_third_adults if (F('party_children')
      > 0 and F('rooms_or_cabins') < F('party_adults')) and (child_discount_lines == 0 and third_adult_lines ==
      0) else (F('package_price_usd') - per_person_price * P('child_discount_pct') / 100 * F('party_children')
      if (F('party_children') > 0 and F('rooms_or_cabins') >= F('party_adults')) and child_discount_lines == 0
      else F('package_price_usd'))
  - club_package_rate: CPARAM('club', 'package_discount_pct', status='active')
  - protection_with_package: EXISTS('care', linked_bundle_package_id=HID)
  - club_concession_pct: club_package_rate if (club_package_rate and club_package_rate > 0) and protection_with_package
      else (club_package_rate * K('softened_concession_share') if (club_package_rate and club_package_rate > 0)
      and not protection_with_package else 0)
  - package_bookings_36m: XCOUNT('club', 'club_points_entries', within_months=36, date_field='posted_date', accrual_source='bundle_booking',
      points_kind='qualifying')
  - loyalty_concession_rate: K('loyalty_concession_pct') if package_bookings_36m > K('frequent_package_threshold_36m')
      * K('high_activity_multiple') else (K('loyalty_concession_pct') * K('softened_concession_share') if package_bookings_36m
      > K('frequent_package_threshold_36m') else 0)
  - price_after_concessions: priced_package_value * (1 - (club_concession_pct + loyalty_concession_rate) / 100)
  - charges_standing: SUM('bundle_ledger_entries', 'amount_usd', date_field='posted_date', event_type='bundle_component_charge')
      + SUM('bundle_ledger_entries', 'amount_usd', date_field='posted_date', event_type='bundle_penalty_charge')
  - payments_taken: SUM('bundle_ledger_entries', 'amount_usd', date_field='posted_date', event_type='bundle_deposit_charge')
      + SUM('bundle_ledger_entries', 'amount_usd', date_field='posted_date', event_type='bundle_final_payment_charge')
  - deposit_collected: SUM('bundle_ledger_entries', 'amount_usd', date_field='posted_date', event_type='bundle_deposit_charge')
  - standard_deposit_for_party: P('deposit_per_person_usd') * (F('party_adults') + F('party_children'))
  - promotional_deposit_for_party: P('low_deposit_amount_usd') * (F('party_adults') + F('party_children'))
  - deposit_difference_called: standard_deposit_for_party - deposit_collected if P('low_deposit_promo_allowed')
      and deposit_collected <= promotional_deposit_for_party else ((standard_deposit_for_party - deposit_collected)
      * K('softened_concession_share') if P('low_deposit_promo_allowed') and deposit_collected < standard_deposit_for_party
      else 0)
  - outstanding_amount: price_after_concessions + charges_standing + deposit_difference_called - payments_taken
  - instalments_taken: COUNT('bundle_ledger_entries', date_field='posted_date', event_type='bundle_final_payment_charge')
  - instalment_called: outstanding_amount / (P('payment_plan_instalments') - instalments_taken) if P('payment_plan_available')
      and instalments_taken > 0 else (outstanding_amount / P('payment_plan_instalments') if P('payment_plan_available')
      and instalments_taken == 0 else outstanding_amount)
  - result: RND(instalment_called, 2)
  compute_basis:
    per_person_price: A traveller's share of the package price is the package price divided by the travellers
      the package records as travelling, and an adult sharing a room or cabin beyond the second in it is a third
      adult sharing.
    sharing_third_adults: A traveller's share of the package price is the package price divided by the travellers
      the package records as travelling, and an adult sharing a room or cabin beyond the second in it is a third
      adult sharing.
    child_discount_lines: Where the package carries children travelling with the party, holds fewer rooms or cabins
      than it has adults travelling, and its ledger carries no line priced as a child discount and none priced
      as a third-adult discount, the priced package value is instead the package price less the product's child
      discount on a traveller's share for every child travelling and less the product's third-adult discount on
      a traveller's share for every third adult sharing.
    third_adult_lines: Where the package carries children travelling with the party, holds fewer rooms or cabins
      than it has adults travelling, and its ledger carries no line priced as a child discount and none priced
      as a third-adult discount, the priced package value is instead the package price less the product's child
      discount on a traveller's share for every child travelling and less the product's third-adult discount on
      a traveller's share for every third adult sharing.
    priced_package_value: The priced package value the call is worked out on is the package price recorded on
      the package. Where the package carries children travelling with the party, holds fewer rooms or cabins than
      it has adults travelling, and its ledger carries no line priced as a child discount and none priced as a
      third-adult discount, the priced package value is instead the package price less the product's child discount
      on a traveller's share for every child travelling and less the product's third-adult discount on a traveller's
      share for every third adult sharing. Where the package carries children travelling with the party, holds
      at least as many rooms or cabins as it has adults travelling, and its ledger carries no line priced as a
      child discount, the priced package value is instead the package price less the product's child discount
      on a traveller's share for every child travelling.
    club_package_rate: Where an active club card stands in the traveller's name whose tier carries a package discount
      and travel protection bought with the package stands against the package, the club concession rate on the
      instalment call is the whole of that tier's package discount.
    protection_with_package: Where an active club card stands in the traveller's name whose tier carries a package
      discount and no travel protection bought with the package stands against the package, the club concession
      rate on the instalment call is one half of that tier's package discount.
    club_concession_pct: Where an active club card stands in the traveller's name whose tier carries a package
      discount and travel protection bought with the package stands against the package, the club concession rate
      on the instalment call is the whole of that tier's package discount. Where an active club card stands in
      the traveller's name whose tier carries a package discount and no travel protection bought with the package
      stands against the package, the club concession rate on the instalment call is one half of that tier's package
      discount. In every other case the club concession rate on the instalment call is nothing.
    package_bookings_36m: Where the club ledger shows the traveller has booked more than twice the frequent-traveller
      threshold of packages in the last thirty-six months, the loyalty concession rate on the instalment call
      is the desk's loyalty concession in full.
    loyalty_concession_rate: Where the club ledger shows the traveller has booked more than twice the frequent-traveller
      threshold of packages in the last thirty-six months, the loyalty concession rate on the instalment call
      is the desk's loyalty concession in full. Where the club ledger shows the traveller has booked more than
      the frequent-traveller threshold of packages in the last thirty-six months but no more than twice that threshold,
      the loyalty concession rate on the instalment call is one half of the desk's loyalty concession. In every
      other case the loyalty concession rate on the instalment call is nothing.
    price_after_concessions: The club concession rate and the loyalty concession rate are first added into one
      combined rate and the priced package value is reduced once by that combined rate; the two never act one
      after the other.
    charges_standing: What the package still owes is that priced package value, together with every component,
      supplement, penalty and amendment charge standing on the package ledger, less every deposit and every instalment
      already taken on the package.
    payments_taken: What the package still owes is that priced package value, together with every component, supplement,
      penalty and amendment charge standing on the package ledger, less every deposit and every instalment already
      taken on the package.
    deposit_collected: Where the product allows a reduced promotional deposit and the deposit lines on the package
      come to no more than the product's reduced promotional deposit for every traveller travelling, the whole
      difference between the product's standard deposit for the party and the deposit lines actually taken falls
      due with this call.
    standard_deposit_for_party: Where the product allows a reduced promotional deposit and the deposit lines on
      the package come to no more than the product's reduced promotional deposit for every traveller travelling,
      the whole difference between the product's standard deposit for the party and the deposit lines actually
      taken falls due with this call.
    promotional_deposit_for_party: Where the product allows a reduced promotional deposit and the deposit lines
      on the package come to more than the product's reduced promotional deposit for the party but less than the
      product's standard deposit for the party, one half of that difference falls due with this call and the rest
      falls due with the final instalment.
    deposit_difference_called: Where the product allows a reduced promotional deposit and the deposit lines on
      the package come to no more than the product's reduced promotional deposit for every traveller travelling,
      the whole difference between the product's standard deposit for the party and the deposit lines actually
      taken falls due with this call. Where the product allows a reduced promotional deposit and the deposit lines
      on the package come to more than the product's reduced promotional deposit for the party but less than the
      product's standard deposit for the party, one half of that difference falls due with this call and the rest
      falls due with the final instalment. In every other case nothing falls due with this call as a deposit difference.
    outstanding_amount: The combined concession rate reduces the priced package value alone; the charges standing
      on the ledger and the deposit difference are added to the reduced figure, the deposits and instalments already
      taken are subtracted last, and only then is the instalment split taken.
    instalments_taken: Where the product allows the balance to be paid in instalments and the package ledger already
      carries at least one instalment of the balance, the instalment called is instead what the package still
      owes divided by the number of instalments the product allows less those already taken.
    instalment_called: The instalment called is the whole of what the package still owes, rounded half up to the
      nearest cent at the end and at no earlier point. Where the product allows the balance to be paid in instalments
      and the package ledger already carries at least one instalment of the balance, the instalment called is
      instead what the package still owes divided by the number of instalments the product allows less those already
      taken. Where the product allows the balance to be paid in instalments and the package ledger carries no
      instalment of the balance, the instalment called is instead what the package still owes divided by the number
      of instalments the product allows.
    result: The instalment called is the whole of what the package still owes, rounded half up to the nearest
      cent at the end and at no earlier point.
  factors:
  - id: instalment_priced_package_value
    effect: method
    decides: priced_package_value
    bindings:
    - sharing_third_adults
    - child_discount_lines
    - third_adult_lines
    - priced_package_value
    ladder:
    - when: the package carries children travelling with the party, holds fewer rooms or cabins than it has adults
        travelling, and its ledger carries no line priced as a child discount and none priced as a third-adult
        discount
      method: the priced package value is the package price less the product's child discount on a traveller's
        share for every child travelling and less the product's third-adult discount on a traveller's share for
        every third adult sharing
    - when: the package carries children travelling with the party, holds at least as many rooms or cabins as
        it has adults travelling, and its ledger carries no line priced as a child discount
      method: the priced package value is the package price less the product's child discount on a traveller's
        share for every child travelling
    - when: otherwise
