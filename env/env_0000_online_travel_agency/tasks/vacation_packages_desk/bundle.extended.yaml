- id: bundle_cancellation
  subject:
  - bundle_cancel
  - bundle_predeposit_cancel
  - bundle_penalty_charge
  rule: Only the party may cancel their own package, and the cancellation is confirmed by the lead traveller rather
    than performed on their behalf. The party states in this conversation which members of the travelling party
    are giving up their places. The penalty is read off the product's cancellation ladder by how many whole days
    lie between the cancellation and the departure date, applied to the package price of the places being given
    up. The product's administration charge is withheld per traveller on every cancellation whatever the ladder
    says, and the agency service fee is never returned. The deposit is returned only on a product whose deposit
    is refundable, and on every other product it is forfeited in full even where the ladder would otherwise return
    more. Where some but not all of the party give up their places, the ladder is applied to those places alone
    and the travellers who remain are re-priced at the occupancy they are left with. A cancellation made because
    a surcharge exceeded the product's threshold is free of penalty, and so is a cancellation made because the
    operator itself changed the itinerary significantly.
  eligibility:
  - id: places_given_up_stated
    applies_to:
    - bundle_cancel
    - bundle_predeposit_cancel
    kind: caller_fact
    condition: The party states in this conversation which members of the travelling party are giving up their
      places.
    evidence_fields:
    - bundle_packages.party_adults
    - bundle_packages.party_children
    - bundle_packages.bundle_package_id
    evidence_contract:
      authority: caller_statement
      timing: pre_action
      correlation_keys:
      - - bundle_packages.bundle_package_id
      action_bindings:
        bundle_packages.bundle_package_id: bundle_package_id
  params:
    per_tier:
      Value Bundle Package:
        cancellation_ladder_pct: =cancellation_ladder_pct
        cancellation_admin_fee_per_person_usd: =cancellation_admin_fee_per_person_usd
        deposit_refundable: =deposit_refundable
