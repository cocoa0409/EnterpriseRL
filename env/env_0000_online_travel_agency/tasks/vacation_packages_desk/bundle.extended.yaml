    - protection_with_package
    - club_concession_pct
    ladder:
    - when: an active club card stands in the traveller's name whose tier carries a package discount and travel
        protection bought with the package stands against the package
      value: the whole of that tier's package discount
    - when: an active club card stands in the traveller's name whose tier carries a package discount and no travel
        protection bought with the package stands against the package
      value: one half of that tier's package discount
    - when: otherwise
