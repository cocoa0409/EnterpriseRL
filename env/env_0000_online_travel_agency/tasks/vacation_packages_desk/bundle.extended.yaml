- id: bundle_travel_period
  subject:
  - bundle_depart
  - bundle_complete
  rule: The packaged journey runs from the moment the party departs to the moment it returns, and every included
    component is consumed inside that period. Where a supplier within the package cannot deliver a component during
    the journey, a comparable substitute is provided at the operator's cost and the difference in value is settled
    after the party returns. A party that leaves the packaged itinerary of its own accord gives up the components
    it did not take, and nothing is returned for them. Travel protection must be held for the whole journey on
    any product that requires it, and a package is not confirmed without it. A journey extended by an event outside
    the operator's control is supported for the days of the extension, and the cost is settled against the party's
    travel protection rather than the package. A package is fulfilled on the day the party returns, and a complaint
    raised afterwards is handled as a service matter rather than as a change to the package.
  eligibility: []
  params:
    per_tier:
      Value Bundle Package:
        insurance_required: =insurance_required
        insurance_bundled_discount_pct: =insurance_bundled_discount_pct
        supplier_failure_protection: =supplier_failure_protection
