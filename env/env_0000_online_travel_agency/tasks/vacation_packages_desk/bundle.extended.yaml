- id: bundle_refund_settlement
  subject:
  - bundle_refund_payout
  rule: 'An approved refund settles in the form the product prescribes: money to the card, or a future travel
    credit voucher, never both and never a mixture. A payout line is raised only while the package record stands
    at cancelled or completed. The settlement takes the product''s processing time, counted in business days from
    the day the refund was approved, excluding weekends and public holidays in the lead traveller''s country of
    residence. Each payout is raised against the original ledger line it reverses, so a package with a deposit
    and several instalments settles as several payouts. A payout may never exceed the amount that original line
    actually collected, and the sum of a package''s payouts may never exceed the amount paid on it. Where a supplier
    within the package fails financially, the protected amount is settled under the product''s financial protection
    whatever its ordinary refund form.'
