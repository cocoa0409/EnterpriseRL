      still owes is that priced package value, together with every component, supplement, penalty and amendment
      charge standing on the package ledger, less every deposit and every instalment already taken on the package.
      The instalment called is the whole of what the package still owes, rounded half up to the nearest cent at
      the end and at no earlier point.
    params: []
