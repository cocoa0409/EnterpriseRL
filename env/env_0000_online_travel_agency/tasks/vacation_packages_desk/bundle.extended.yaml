    - loyalty_concession_rate
    ladder:
    - when: the club ledger shows the traveller has booked more than twice the frequent-traveller threshold of
        packages in the last thirty-six months
      value: the desk's loyalty concession in full
    - when: the club ledger shows the traveller has booked more than the frequent-traveller threshold of packages
        in the last thirty-six months but no more than twice that threshold
      value: one half of the desk's loyalty concession
    - when: otherwise
      value: nothing
    baseline:
      loyalty_concession_rate: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: club
  - id: instalment_deposit_difference
    effect: parameter
    decides: deposit_difference_called
    bindings:
    - deposit_collected
    - standard_deposit_for_party
    - promotional_deposit_for_party
    - deposit_difference_called
    ladder:
    - when: the product allows a reduced promotional deposit and the deposit lines on the package come to no more
        than the product's reduced promotional deposit for every traveller travelling
      value: the whole difference between the product's standard deposit for the party and the deposit lines actually
        taken
    - when: the product allows a reduced promotional deposit and the deposit lines on the package come to more
        than the product's reduced promotional deposit for the party but less than the product's standard deposit
        for the party
      value: one half of that difference
    - when: otherwise
      value: nothing
    baseline:
      deposit_difference_called: '0'
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: instalment_split_basis
    effect: method
    decides: instalment_called
    bindings:
    - instalments_taken
    - instalment_called
    ladder:
    - when: the product allows the balance to be paid in instalments and the package ledger already carries at
        least one instalment of the balance
      method: what the package still owes is divided by the number of instalments the product allows less those
        already taken, and that share is called
    - when: the product allows the balance to be paid in instalments and the package ledger carries no instalment
        of the balance
      method: what the package still owes is divided by the number of instalments the product allows, and that
        share is called
    - when: otherwise
      method: the whole of what the package still owes is called in one payment
    baseline:
      instalment_called: outstanding_amount
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  baseline:
    rule: The instalment called on a vacation package is what the package still owes, called in one payment. The
