- id: bundle_ext_cancellation_refund_payout
  base_policy_refs:
  - bundle_refund_settlement
  - bundle_cancellation
  - bundle_credit
  - bundle_club_and_corporate_interaction
  - bundle_evt_supplier_notice
  overwrite:
  - base_policy: bundle_refund_settlement
    superseded_clause: Each payout is raised against the original ledger line it reverses, so a package with a
      deposit and several instalments settles as several payouts.
    replaced_by: The money returned is settled as one payout against the package as a whole, and not line by line,
      and is rounded half up to the nearest cent at the end and at no earlier point.
  trigger: on_request
  subject:
  - bundle_refund_payout
  computes: refund_amount_usd
  target_tool: release_package_refund_313c063d
  params:
    advice_window_days: 90
    withholding_softened_share: 0.5
    goodwill_softened_share: 0.5
    markup_softened_share: 0.5
  rule: The money returned on a cancelled vacation package goes back to the form of payment the package was paid
    from, and is worked out from what the party put into the package, what stands withheld against it, the currency
    the party elected to be charged in and the traveller's standing with the traveller club. The money returned
    on a cancelled package is settled only after its ledger carries the cancellation penalty withheld for the
    places the party gave up. The money the party put in is every deposit and every instalment taken on the package.
    Where the product returns the deposit on cancellation and the package ledger carries components priced onto
    it, the money the party put in is instead every deposit, every instalment and those components. Where the
    product returns no deposit on cancellation, the money the party put in is instead every instalment and every
    component priced onto the package, the deposits taken being left out of it altogether. The whole of what stands
    withheld against the package reduces what is returned, what stands withheld being every penalty and amendment
    charge on its ledger. Where the package ledger carries an operator advice of a significant change to the itinerary,
    nothing of what stands withheld reduces what is returned, the operator's own change having caused the cancellation.
    Where the package ledger carries no operator advice of a significant change to the itinerary but does carry
    an operator advice about the itinerary that is not a significant change, issued within the advice window before
    the party confirmed the cancellation, one half of what stands withheld reduces what is returned. An advice
    given because a supplier within the package cancelled is a significant change; an advice given because one
    component of the itinerary was substituted for another is not. Nothing is added back to what is returned as
    a goodwill gesture. Where an active club card stands in the traveller's name whose tier carries a package
    discount and the package ledger carries no line charged as an amendment, a name change or a date change, that
    tier's package discount of the reduced withholding is instead added back as a goodwill gesture. Where an active
    club card stands in the traveller's name whose tier carries a package discount and the package ledger carries
    such a line, one half of that tier's package discount of the reduced withholding is instead added back as
    a goodwill gesture. Nothing is retained for the currency the party elected to be charged in. Where every deposit
    and instalment taken on the package was presented to the party in a currency other than the operator's own,
    the product's conversion markup on what is returned is instead retained, the markup having been paid over
    on the way in and not recoverable on the way out. Where some but not all of the deposits and instalments taken
    were presented in a currency other than the operator's own, one half of that markup on what is returned is
    instead retained. What stands withheld is reduced first, the goodwill gesture is added to the money the party
    put in less that reduced withholding, and the currency retention acts last, on the figure so reached. The
    money returned is settled as one payout against the package as a whole, and not line by line, and is rounded
    half up to the nearest cent at the end and at no earlier point.
  prerequisite:
  - problem: bundle_ext_cancellation_penalty_withholding
    kind: value_input
    gate: withheld_standing
    form: state
    policy_source: The money returned on a cancelled package is settled only after its ledger carries the cancellation
      penalty withheld for the places the party gave up.
    condition: the package ledger carries the cancellation penalty withheld for the places the party gave up
    resolved_by: withhold_cancellation_penalty_6c06e997
    effect: what stands withheld against the package takes in the cancellation penalty, so the money returned
      falls by the share of that penalty which reduces it
  cross_category:
  - category: club
    as: branch
    reads:
    - variant_name
    - status
    note: The package discount of the tier standing on the traveller's active club card decides the goodwill gesture
      added back to what is returned.
  compute:
  - money_paid_in: SUM('bundle_ledger_entries', 'amount_usd', date_field='posted_date', event_type='bundle_deposit_charge')
      + SUM('bundle_ledger_entries', 'amount_usd', date_field='posted_date', event_type='bundle_final_payment_charge')
  - deposit_taken: SUM('bundle_ledger_entries', 'amount_usd', date_field='posted_date', event_type='bundle_deposit_charge')
  - components_charged: SUM('bundle_ledger_entries', 'amount_usd', date_field='posted_date', event_type='bundle_component_charge')
  - returnable_intake: money_paid_in + components_charged if P('deposit_refundable') and components_charged >
      0 else (money_paid_in - deposit_taken + components_charged if not P('deposit_refundable') else money_paid_in)
  - withheld_standing: SUM('bundle_ledger_entries', 'amount_usd', date_field='posted_date', event_type='bundle_penalty_charge')
  - significant_advice_count: COUNT('bundle_ledger_entries', date_field='posted_date', event_type='bundle_supplier_notice',
      reason_code='supplier_cancellation')
  - ordinary_advice_count: COUNT('bundle_ledger_entries', date_field='posted_date', event_type='bundle_supplier_notice',
      reason_code='component_substitution')
  - latest_advice_gap: DAYS(LATEST('bundle_ledger_entries', 'posted_date', date_field='posted_date', event_type='bundle_supplier_notice',
      reason_code='component_substitution'), F('cancelled_at')) if ordinary_advice_count > 0 else K('advice_window_days')
      + 1
  - withheld_share: 0 if significant_advice_count > 0 else (K('withholding_softened_share') if significant_advice_count
      == 0 and ordinary_advice_count > 0 and latest_advice_gap <= K('advice_window_days') else 1)
  - withheld_applied: withheld_standing * withheld_share
  - club_package_rate: CPARAM('club', 'package_discount_pct', status='active')
  - amendment_lines: COUNT('bundle_ledger_entries', date_field='posted_date', event_type='bundle_penalty_charge',
      charge_category='amendment_fee') + COUNT('bundle_ledger_entries', date_field='posted_date', event_type='bundle_penalty_charge',
      charge_category='name_change_fee') + COUNT('bundle_ledger_entries', date_field='posted_date', event_type='bundle_penalty_charge',
      charge_category='date_change_fee')
  - goodwill_rate: club_package_rate if (club_package_rate and club_package_rate > 0) and amendment_lines == 0
      else (club_package_rate * K('goodwill_softened_share') if (club_package_rate and club_package_rate > 0)
      and amendment_lines > 0 else 0)
  - goodwill_added: withheld_applied * goodwill_rate / 100
  - payment_lines: COUNT('bundle_ledger_entries', date_field='posted_date', event_type='bundle_deposit_charge')
      + COUNT('bundle_ledger_entries', date_field='posted_date', event_type='bundle_final_payment_charge')
  - home_currency_payments: COUNT('bundle_ledger_entries', date_field='posted_date', event_type='bundle_deposit_charge',
      currency_charged='USD') + COUNT('bundle_ledger_entries', date_field='posted_date', event_type='bundle_final_payment_charge',
      currency_charged='USD')
  - markup_share: 1 if payment_lines > 0 and home_currency_payments == 0 else (K('markup_softened_share') if payment_lines
      > 0 and home_currency_payments > 0 and home_currency_payments < payment_lines else 0)
  - settlement_before_markup: returnable_intake - withheld_applied + goodwill_added
  - markup_retained: settlement_before_markup * P('currency_conversion_markup_pct') / 100 * markup_share
  - result: RND(settlement_before_markup - markup_retained, 2)
  compute_basis:
    money_paid_in: The money the party put in is every deposit and every instalment taken on the package.
    deposit_taken: Where the product returns no deposit on cancellation, the money the party put in is instead
      every instalment and every component priced onto the package, the deposits taken being left out of it altogether.
    components_charged: Where the product returns the deposit on cancellation and the package ledger carries components
      priced onto it, the money the party put in is instead every deposit, every instalment and those components.
    returnable_intake: The money the party put in is every deposit and every instalment taken on the package.
      Where the product returns the deposit on cancellation and the package ledger carries components priced onto
      it, the money the party put in is instead every deposit, every instalment and those components. Where the
      product returns no deposit on cancellation, the money the party put in is instead every instalment and every
      component priced onto the package, the deposits taken being left out of it altogether.
    withheld_standing: The whole of what stands withheld against the package reduces what is returned, what stands
      withheld being every penalty and amendment charge on its ledger.
    significant_advice_count: An advice given because a supplier within the package cancelled is a significant
      change; an advice given because one component of the itinerary was substituted for another is not.
    ordinary_advice_count: Where the package ledger carries no operator advice of a significant change to the
      itinerary but does carry an operator advice about the itinerary that is not a significant change, issued
      within the advice window before the party confirmed the cancellation, one half of what stands withheld reduces
      what is returned.
    latest_advice_gap: Where the package ledger carries no operator advice of a significant change to the itinerary
      but does carry an operator advice about the itinerary that is not a significant change, issued within the
      advice window before the party confirmed the cancellation, one half of what stands withheld reduces what
      is returned.
    withheld_share: The whole of what stands withheld against the package reduces what is returned, what stands
      withheld being every penalty and amendment charge on its ledger. Where the package ledger carries an operator
      advice of a significant change to the itinerary, nothing of what stands withheld reduces what is returned,
      the operator's own change having caused the cancellation. Where the package ledger carries no operator advice
      of a significant change to the itinerary but does carry an operator advice about the itinerary that is not
      a significant change, issued within the advice window before the party confirmed the cancellation, one half
      of what stands withheld reduces what is returned.
    withheld_applied: What stands withheld is reduced first, the goodwill gesture is added to the money the party
      put in less that reduced withholding, and the currency retention acts last, on the figure so reached.
    club_package_rate: Where an active club card stands in the traveller's name whose tier carries a package discount
      and the package ledger carries no line charged as an amendment, a name change or a date change, that tier's
      package discount of the reduced withholding is instead added back as a goodwill gesture.
    amendment_lines: Where an active club card stands in the traveller's name whose tier carries a package discount
      and the package ledger carries such a line, one half of that tier's package discount of the reduced withholding
      is instead added back as a goodwill gesture.
    goodwill_rate: Nothing is added back to what is returned as a goodwill gesture. Where an active club card
      stands in the traveller's name whose tier carries a package discount and the package ledger carries no line
      charged as an amendment, a name change or a date change, that tier's package discount of the reduced withholding
      is instead added back as a goodwill gesture. Where an active club card stands in the traveller's name whose
      tier carries a package discount and the package ledger carries such a line, one half of that tier's package
      discount of the reduced withholding is instead added back as a goodwill gesture.
    goodwill_added: What stands withheld is reduced first, the goodwill gesture is added to the money the party
      put in less that reduced withholding, and the currency retention acts last, on the figure so reached.
    payment_lines: Where every deposit and instalment taken on the package was presented to the party in a currency
      other than the operator's own, the product's conversion markup on what is returned is instead retained,
      the markup having been paid over on the way in and not recoverable on the way out.
    home_currency_payments: Where some but not all of the deposits and instalments taken were presented in a currency
      other than the operator's own, one half of that markup on what is returned is instead retained.
    markup_share: Nothing is retained for the currency the party elected to be charged in. Where every deposit
      and instalment taken on the package was presented to the party in a currency other than the operator's own,
      the product's conversion markup on what is returned is instead retained, the markup having been paid over
      on the way in and not recoverable on the way out. Where some but not all of the deposits and instalments
      taken were presented in a currency other than the operator's own, one half of that markup on what is returned
      is instead retained.
    settlement_before_markup: What stands withheld is reduced first, the goodwill gesture is added to the money
      the party put in less that reduced withholding, and the currency retention acts last, on the figure so reached.
    markup_retained: Where every deposit and instalment taken on the package was presented to the party in a currency
      other than the operator's own, the product's conversion markup on what is returned is instead retained,
      the markup having been paid over on the way in and not recoverable on the way out.
    result: The money returned is settled as one payout against the package as a whole, and not line by line,
      and is rounded half up to the nearest cent at the end and at no earlier point.
  factors:
  - id: returnable_intake_basis
    effect: method
    decides: returnable_intake
    bindings:
    - money_paid_in
    - deposit_taken
    - components_charged
    - returnable_intake
    ladder:
    - when: the product returns the deposit on cancellation and the package ledger carries components priced onto
