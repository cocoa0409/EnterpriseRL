extended_policies:
- id: bundle_ext_package_amendment_charge
  base_policy_refs:
  - bundle_cancellation
  - bundle_amendment
  - bundle_agg_party_pricing
  overwrite:
  - base_policy: bundle_amendment
    superseded_clause: A member of the party may be replaced only up to the product's name-change deadline before
      departure, against the product's name-change charge per traveller replaced.
    replaced_by: Where the latest change request approved against the package asks for a member of the party to
      be replaced, the amendment charge's starting amount is instead the product's name-change charge, read against
      every traveller the approved replacement requests standing on the package concern.
  - base_policy: bundle_amendment
    superseded_clause: Any other amendment carries the product's administration charge per traveller
    replaced_by: The amendment charge's starting amount is the product's administration charge, read against every
      traveller on the package.
  trigger: state_due
  subject:
  - bundle_penalty_charge
  computes: amendment_charge_usd
  target_tool: charge_package_amendment_6b64f72d
  params:
    repeat_uplift_share: 0.5
    further_change_multiple: 2
    softened_share: 0.5
  rule: The amendment charge owed on a vacation package answers a change the operations desk has already approved
    against that package, and it is entered against the party as a whole. The amendment charge's starting amount
    is the product's administration charge, read against every traveller on the package. Where the latest change
    request approved against the package asks for a member of the party to be replaced, the amendment charge's
    starting amount is instead the product's name-change charge, read against every traveller the approved replacement
    requests standing on the package concern. Where the latest change request approved against the package asks
    for the departure date to be moved, the amendment charge's starting amount is instead the product's date-change
    charge, read against every traveller on the package. Where the latest change request approved against the
    package asks for one component of the itinerary to be substituted for another, the amendment charge's starting
    amount is instead the product's component change charge, read once for the package. The amendment charge payable
    is that starting amount taken once and in full, rounded half up to the nearest cent at the end and at no earlier
    point. Where the day the balance falls due on the package has passed, the product's cancellation administration
    charge is added to the starting amount for every traveller on the package, the suppliers having been paid
    by then and the change being priced as a cancellation and a rebooking. Where the day the balance falls due
    on the package has not passed and the package ledger already carries an instalment of the balance, the product's
    cancellation administration charge is added to the starting amount once for the package. Where the package
    ledger already carries two or more lines charged as an amendment, a name change or a date change, the sum
    of the starting amount and anything added to it is taken at twice its value instead of once. Where the package
    ledger already carries exactly one line charged as an amendment, a name change or a date change, that sum
    is taken at one and a half times its value instead of once. Where an active club card stands in the traveller's
    name whose tier waives change fees in a membership year and the club ledger shows no waived change fee used
    in the last twelve months, nothing of the figure so reached is payable. Where such a card stands in the traveller's
    name and the club ledger shows at least one waived change fee used in the last twelve months but fewer than
    the tier grants in a membership year, one half of the figure so reached is payable. The starting amount and
    anything added to it are summed before the multiple is taken, the multiple acts once on that sum and never
    on either figure alone, and the payable share acts last, on the figure the multiple produced.
  prerequisite: []
  cross_category:
  - category: club
    as: history
    reads:
    - variant_name
    - status
    - club_points_entries.benefit_code
    note: The tier standing on the traveller's active club card and the waived change fees its ledger shows used
      in the last twelve months decide the payable share of the amendment charge.
  compute:
  - party_travelling: F('party_adults') + F('party_children')
  - latest_approved_change: LATEST('bundle_change_requests', 'request_type', date_field='submitted_at', request_status='approved')
  - replacement_requests: COUNT('bundle_change_requests', request_type='name_change', request_status='approved')
  - starting_amount: P('name_change_fee_per_person_usd') * replacement_requests if latest_approved_change == 'name_change'
      else (P('date_change_fee_per_person_usd') * party_travelling if latest_approved_change == 'date_change'
      else (P('component_change_fee_usd') if latest_approved_change == 'component_substitution' else P('amendment_admin_fee_per_person_usd')
      * party_travelling))
  - balance_due_gap: DAYS(NOW, F('final_payment_due_date'))
  - instalments_taken: COUNT('bundle_ledger_entries', date_field='posted_date', event_type='bundle_final_payment_charge')
  - stage_addition: P('cancellation_admin_fee_per_person_usd') * party_travelling if balance_due_gap < 0 else
      (P('cancellation_admin_fee_per_person_usd') if instalments_taken > 0 else 0)
  - amendments_charged: COUNT('bundle_ledger_entries', date_field='posted_date', event_type='bundle_penalty_charge',
      charge_category='amendment_fee') + COUNT('bundle_ledger_entries', date_field='posted_date', event_type='bundle_penalty_charge',
      charge_category='name_change_fee') + COUNT('bundle_ledger_entries', date_field='posted_date', event_type='bundle_penalty_charge',
      charge_category='date_change_fee')
  - repeat_multiple: K('further_change_multiple') if amendments_charged >= 2 else (1 + K('repeat_uplift_share')
      if amendments_charged == 1 else 1)
  - club_waiver_allowance: CPARAM('club', 'waived_change_fees_per_year', status='active')
  - waivers_used_12m: XCOUNT('club', 'club_points_entries', within_months=12, date_field='posted_date', event_type='club_benefit_use',
      benefit_code='waived_change_fee')
  - payable_share: 0 if (club_waiver_allowance and club_waiver_allowance > 0) and waivers_used_12m == 0 else (K('softened_share')
      if (club_waiver_allowance and club_waiver_allowance > 0) and (waivers_used_12m >= 1 and waivers_used_12m
      < club_waiver_allowance) else 1)
  - charge_before_softening: (starting_amount + stage_addition) * repeat_multiple
  - result: RND(charge_before_softening * payable_share, 2)
  compute_basis:
    party_travelling: The amendment charge's starting amount is the product's administration charge, read against
      every traveller on the package.
    latest_approved_change: The amendment charge owed on a vacation package answers a change the operations desk
      has already approved against that package, and it is entered against the party as a whole.
    replacement_requests: Where the latest change request approved against the package asks for a member of the
      party to be replaced, the amendment charge's starting amount is instead the product's name-change charge,
      read against every traveller the approved replacement requests standing on the package concern.
    starting_amount: The amendment charge's starting amount is the product's administration charge, read against
      every traveller on the package. Where the latest change request approved against the package asks for a
      member of the party to be replaced, the amendment charge's starting amount is instead the product's name-change
      charge, read against every traveller the approved replacement requests standing on the package concern.
      Where the latest change request approved against the package asks for the departure date to be moved, the
      amendment charge's starting amount is instead the product's date-change charge, read against every traveller
      on the package. Where the latest change request approved against the package asks for one component of the
      itinerary to be substituted for another, the amendment charge's starting amount is instead the product's
      component change charge, read once for the package.
    balance_due_gap: Where the day the balance falls due on the package has passed, the product's cancellation
      administration charge is added to the starting amount for every traveller on the package, the suppliers
      having been paid by then and the change being priced as a cancellation and a rebooking.
    instalments_taken: Where the day the balance falls due on the package has not passed and the package ledger
      already carries an instalment of the balance, the product's cancellation administration charge is added
      to the starting amount once for the package.
    stage_addition: The amendment charge payable is that starting amount taken once and in full, rounded half
      up to the nearest cent at the end and at no earlier point. Where the day the balance falls due on the package
      has passed, the product's cancellation administration charge is added to the starting amount for every traveller
      on the package, the suppliers having been paid by then and the change being priced as a cancellation and
      a rebooking. Where the day the balance falls due on the package has not passed and the package ledger already
      carries an instalment of the balance, the product's cancellation administration charge is added to the starting
      amount once for the package.
    amendments_charged: Where the package ledger already carries two or more lines charged as an amendment, a
      name change or a date change, the sum of the starting amount and anything added to it is taken at twice
      its value instead of once.
    repeat_multiple: The amendment charge payable is that starting amount taken once and in full, rounded half
      up to the nearest cent at the end and at no earlier point. Where the package ledger already carries two
      or more lines charged as an amendment, a name change or a date change, the sum of the starting amount and
      anything added to it is taken at twice its value instead of once. Where the package ledger already carries
      exactly one line charged as an amendment, a name change or a date change, that sum is taken at one and a
      half times its value instead of once.
    club_waiver_allowance: Where an active club card stands in the traveller's name whose tier waives change fees
      in a membership year and the club ledger shows no waived change fee used in the last twelve months, nothing
      of the figure so reached is payable.
    waivers_used_12m: Where such a card stands in the traveller's name and the club ledger shows at least one
      waived change fee used in the last twelve months but fewer than the tier grants in a membership year, one
      half of the figure so reached is payable.
    payable_share: The amendment charge payable is that starting amount taken once and in full, rounded half up
      to the nearest cent at the end and at no earlier point. Where an active club card stands in the traveller's
      name whose tier waives change fees in a membership year and the club ledger shows no waived change fee used
      in the last twelve months, nothing of the figure so reached is payable. Where such a card stands in the
      traveller's name and the club ledger shows at least one waived change fee used in the last twelve months
      but fewer than the tier grants in a membership year, one half of the figure so reached is payable.
    charge_before_softening: The starting amount and anything added to it are summed before the multiple is taken,
      the multiple acts once on that sum and never on either figure alone, and the payable share acts last, on
      the figure the multiple produced.
    result: The amendment charge payable is that starting amount taken once and in full, rounded half up to the
      nearest cent at the end and at no earlier point.
  factors:
  - id: amendment_starting_amount_basis
    effect: method
    decides: starting_amount
    bindings:
    - latest_approved_change
    - replacement_requests
    - starting_amount
    ladder:
    - when: the latest change request approved against the package asks for a member of the party to be replaced
      method: the starting amount is the product's name-change charge, read against every traveller the approved
        replacement requests standing on the package concern
    - when: the latest change request approved against the package asks for the departure date to be moved
      method: the starting amount is the product's date-change charge, read against every traveller on the package
    - when: the latest change request approved against the package asks for one component of the itinerary to
        be substituted for another
      method: the starting amount is the product's component change charge, read once for the package
    - when: otherwise
      method: the starting amount is the product's administration charge, read against every traveller on the
        package
    baseline:
      starting_amount: P('amendment_admin_fee_per_person_usd') * party_travelling
    evidence:
    - history
    cross_difficulty: null
  - id: amendment_stage_addition
    effect: parameter
    decides: stage_addition
    bindings:
    - balance_due_gap
    - instalments_taken
    - stage_addition
    ladder:
    - when: the day the balance falls due on the package has passed
      value: the product's cancellation administration charge for every traveller on the package
    - when: the day the balance falls due on the package has not passed and the package ledger already carries
        an instalment of the balance
      value: the product's cancellation administration charge, once for the package
    - when: otherwise
      value: nothing
    baseline:
      stage_addition: '0'
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: amendment_repeat_multiple
    effect: parameter
    decides: repeat_multiple
    bindings:
    - amendments_charged
    - repeat_multiple
    ladder:
    - when: the package ledger already carries two or more lines charged as an amendment, a name change or a date
        change
      value: twice
    - when: the package ledger already carries exactly one line charged as an amendment, a name change or a date
        change
      value: one and a half times
    - when: otherwise
      value: once
    baseline:
      repeat_multiple: '1'
    evidence:
    - history
    cross_difficulty: null
  - id: amendment_club_waiver_share
    effect: parameter
    decides: payable_share
    bindings:
    - club_waiver_allowance
    - waivers_used_12m
    - payable_share
    ladder:
    - when: an active club card stands in the traveller's name whose tier waives change fees in a membership year
        and the club ledger shows no waived change fee used in the last twelve months
      value: nothing of the figure reached is payable
    - when: an active club card stands in the traveller's name whose tier waives change fees in a membership year
        and the club ledger shows at least one waived change fee used in the last twelve months but fewer than
        the tier grants in a membership year
      value: one half of the figure reached is payable
    - when: otherwise
      value: the whole of the figure reached is payable
    baseline:
      payable_share: '1'
    evidence:
    - cross_category
    - history
    cross_difficulty: club
  baseline:
    rule: The amendment charge owed on a vacation package answers a change the operations desk has already approved
      against that package, and it is entered against the party as a whole. The amendment charge's starting amount
      is the product's administration charge, read against every traveller on the package. The amendment charge
      payable is that starting amount taken once and in full, rounded half up to the nearest cent at the end and
      at no earlier point.
    params:
    - amendment_admin_fee_per_person_usd
  inputs:
    history:
    - table: bundle_change_requests
      aggregate: latest
      field: request_type
      within_months: null
      filters:
        request_status: approved
    - table: bundle_change_requests
      aggregate: count
      field: bundle_request_id
      within_months: null
      filters:
        request_type: name_change
        request_status: approved
    - table: bundle_ledger_entries
      aggregate: count
      field: bundle_entry_id
      within_months: null
      filters:
        event_type: bundle_final_payment_charge
    - table: bundle_ledger_entries
      aggregate: count
      field: bundle_entry_id
      within_months: null
      filters:
        event_type: bundle_penalty_charge
    - category: club
      table: club_points_entries
      aggregate: count
