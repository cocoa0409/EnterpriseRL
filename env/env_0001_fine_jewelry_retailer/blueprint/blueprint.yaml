name: fine_jewelry_retailer
company: Belrose Fine Jewelers

background: >
  Belrose Fine Jewelers is a national fine jewelry retailer with 212 stores across 38 states, a design
  atelier in Providence and a central workshop outside Dallas, selling bridal, diamond, coloured-stone
  and estate jewellery to the public. The chain's tone with its customers is unhurried and exact:
  pieces are described by their metal, their stones and their making, and a customer's file is
  expected to say precisely what was sold, what was promised and what was done to it afterwards.
  Eight things a customer can hold run alongside the merchandise itself, and each is a running
  agreement rather than an item on a shelf. Belrose Promotional Financing Plans finance a purchase
  over a promotional term, written as the 6-Month Deferred Interest Plan, the 12-Month Deferred
  Interest Plan, the 18-Month Deferred Interest Plan, the 24-Month Equal Payment Plan, the 36-Month
  Equal Payment Plan or the 48-Month Bridal Equal Payment Plan, and each plan bills on a monthly
  statement that records every purchase, payment, fee and credit booked against it. Belrose Jewelry
  Protection and Care Plans cover one piece apiece and run as the Manufacturer Limited Warranty, the
  Belrose Care Plan 2-Year, the Belrose Care Plan 3-Year, the Belrose Care Plan 5-Year, the Belrose
  Lifetime Care Plan or the Belrose Heirloom Protection Plan, holding the premiums paid, the benefit
  allowance remaining, the inspections logged against the piece and every claim filed, settled or
  refused. The Belrose Workshop Repair and Resizing Service takes pieces in on a bench work order at
  Standard Bench Service, Priority Bench Service, Master Jeweler Service, Heritage Restoration
  Service, Designer Authorized Repair Service or Atelier White-Glove Service, and the order gathers
  priced labour, parts, surcharges, payments and the checks made before the piece goes back. Belrose
  Design Studio Custom Commissions are built from a customer's brief under the Design Studio
  Semi-Custom Setting, the Design Studio Custom Setting, Belrose Bespoke Design, the Belrose Bespoke
  Signature Commission, the Belrose Heritage Redesign Commission or the Belrose Atelier One-of-a-Kind
  Commission, each commission recording its quote, its design revisions, its staged payments and
  every stage of production. Belrose Trade-In and Upgrade Programmes register a piece the customer is
  giving up under the Belrose Standard Trade-In, the Diamond Trade-Up Guarantee, the Bridal Upgrade
  Guarantee, the Lifetime Diamond Upgrade Guarantee, the Signature Collection Upgrade Privilege or
  the Estate Purchase and Consignment Programme, and the registration carries the valuation, the
  condition grade and the credit as it is issued and spent. Belrose Appraisal and Gemological
  Services are engaged as a Verbal Counter Estimate, an Insurance Replacement Appraisal, a Fair
  Market Value Appraisal, an Estate and Probate Appraisal, a Certified Gemological Laboratory Report
  or a Collection Portfolio Appraisal, each engagement recording its fees, its examination and the
  value the report states. Belrose Layaway and Hold Agreements hold merchandise in the stockroom
  while the customer pays for it, under the 30-Day Hold Agreement, the 90-Day Layaway, the 6-Month
  Layaway, the 12-Month Bridal Layaway, the Special Order Layaway or the Gift Registry Layaway, each
  agreement recording the pieces set aside, the scheduled payments and the stockroom movements. The
  Belrose Circle Membership Programme runs behind all of it as Belrose Circle Member, Belrose Circle
  Silver, Belrose Circle Gold, Belrose Circle Platinum, Belrose Circle Black or the Belrose Circle
  Founders' Club, recording points earned, taken back, spent and expired alongside the member
  benefits that have been used. The people who call are the people who buy fine jewellery for the
  occasions of a life: engagements and weddings, anniversaries, births, graduations and
  bereavements. A typical caller holds more than one of these things at once — a financing plan
  opened at the engagement, a care plan on the ring it paid for, a membership that has been earning
  quietly for years — and the pieces themselves come back through the workshop every few years for
  cleaning, resizing and prong work. Bridal customers bring the longest files: a ring financed and
  covered, a pair of bands on layaway, an upgrade credit registered when the centre stone was traded
  up, and an appraisal refreshed whenever the insurer asks. Estate customers bring the shortest: a
  piece inherited, no receipt, no certificate and a question about what it is. Others call about
  pieces the chain never sold, about a repair promised for a date that has since passed, or about
  coverage they are no longer certain they still hold. The files these calls land in are long and
  uneven, so that a plan settled eight years ago sits beside a work order opened last week, and two
  pieces that sound identical over the telephone turn out to sit on different agreements entirely.

logs:
  verification_log_table: identity_verifications
  handoff_log_table: agent_handoffs

difficulties:
  - name: financing_plan_desk
    claim:
      categories: [financing]
      event_types:
        - financing_payment_posted
        - financing_late_fee_assessed
        - financing_returned_payment_fee_assessed
        - financing_fee_waiver_applied
        - financing_return_credit_posted
        - financing_deferred_interest_assessed
        - financing_promo_interest_waived
        - financing_statement_issued
        - financing_plan_marked_past_due
        - financing_plan_reinstated
        - financing_hardship_enrolled
        - financing_plan_terms_updated
        - financing_plan_closed_paid
        - financing_application_withdrawn
    summary: >
      Callers here hold one or more Belrose Promotional Financing Plans and ring about the money on
      them: a fee they did not expect, a payment that did not land where they thought, a promotional
      term about to close with a balance still on it, a month they cannot pay, or an application
      they want to unwind. The setting varies along four axes at once — which of the six promotional
      terms the plan was written on, since the deferred-interest terms and the equal-payment terms
      price interest in opposite ways; where the plan stands in its life, since applied, approved,
      active, past due, in a hardship arrangement, settled, written off and cancelled each admit a
      different set of writes; how many plans the customer holds and what their combined balance is;
      and what the plan's own history shows about earlier lateness, earlier give-backs and earlier
      hardship. The records in play are the plan itself, its billing history entry by entry, and the
      finance desk's own request record, with the customer profile carrying the date of birth every
      age condition rests on. The governing rules are financing_plan_eligibility and
      financing_agg_promotional_balance_cap at the opening; financing_evt_statement_cycle,
      financing_evt_payment_allocation and financing_promotional_interest through the term;
      financing_evt_late_fee, financing_evt_returned_payment and financing_courtesy_waiver on what
      goes wrong; financing_return_credit when merchandise comes back; financing_hardship_arrangement
      and financing_delinquency_and_charge_off when the customer cannot pay; and
      financing_closure_and_payoff and financing_application_withdrawal at the end — each of them
      stating its own thresholds, fees and windows per promotional term, so the figure that applies
      is never readable without first fixing which term the plan was written on. Eligibility turns on
      fields rather than assurances: the status the plan stands at, the due date printed on the
      statement for the cycle in question, the date the plan began billing, and whether a give-back
      already stands against the very charge being discussed. Posting a payment, charging or giving
      back a fee, crediting a return, recording a statement, marking a plan delinquent or bringing it
      current, and enrolling a hardship arrangement are all service actions the desk performs; but
      settling a plan out against a quoted payoff figure, confirming the replacement schedule a
      hardship arrangement puts in its place, and declining credit already approved in the customer's
      name are the customer's own — they are taken on the finance desk's request record and take
      effect only once the customer confirms them, so the desk hands that step over rather than
      performing it. Genuinely possible requests that no rule here decides include reinstating a plan
      already written off to collections, disputing the bureau decision behind an approval or a
      decline, re-aging a delinquent plan so that its history reads differently, moving a purchase to
      a promotional term the sale was never eligible for, and asking for an accurate report to the
      credit bureaux to be withdrawn; for those the only correct route is a handover recorded as
      POLICY_NOT_COVERED.

  - name: protection_claims_desk
    claim:
      categories: [protection]
      event_types:
        - protection_claim_filed
        - protection_claim_settled
        - protection_claim_denied
        - protection_inspection_logged
        - protection_inspection_lapsed
        - protection_inspection_restored
        - protection_plan_activated
        - protection_plan_suspended
        - protection_plan_reinstated
        - protection_plan_cancelled
        - protection_premium_refunded
        - protection_plan_transferred
        - protection_allowance_reinstated
        - protection_benefit_exhausted
    summary: >
      Callers here hold Belrose Jewelry Protection and Care Plans and ring about something that has
      happened to a covered piece: a stone gone from its setting, a chain parted, a ring that has
      lost its finish, a piece missing after a holiday, or a plan they want to cancel, transfer or
      simply understand. What makes the judgement hard is that six coverages answer for different
      perils, hold different allowances and demand inspections at different intervals, so the same
      loss on the same piece is answered one way under the Manufacturer Limited Warranty and another
      under the Belrose Heirloom Protection Plan; and the plan's own standing at the moment of the
      call — in force, out of good standing for a missed inspection, suspended for unpaid premium,
      exhausted, expired, cancelled or transferred away — decides whether a claim can even be opened.
      The records in play are the coverage record with its allowance, deductible and inspection
      dates, the coverage history carrying premiums, allowance grants, inspections and every claim
      filed, settled or refused under its claim reference, and the protection desk's own request
      record; the workshop's work orders and the appraisal register sit alongside them because a
      claim that goes to the bench and a coverage that required an appraisal both point outside this
      category. The governing rules are protection_plan_eligibility on what may be covered at all,
      protection_claim_intake on whether a claim can be opened and on which single ground it is
      otherwise refused, protection_claim_settlement on what an accepted claim is worth and how much
      of the allowance it consumes, protection_agg_allowance_pooling on why one plan's allowance
      never answers for another's piece, protection_inspection_discipline on how coverage falls out
      of good standing and how it is put back, protection_included_services on the routine work that
      needs no claim at all, protection_premium_collection, protection_allowance_grant,
      protection_expiry_and_renewal, protection_transfer and protection_cancellation_refund — each
      stating its perils, allowances, deductibles, caps and windows per coverage, so nothing can be
      answered before the coverage held is fixed. Eligibility rests on system records rather than on
      what the customer believes: the status of the plan, the date of the last inspection logged and
      the store that logged it, whether a police report reference stands against a theft claim, and
      whether a settlement already stands against the claim reference being discussed. Opening a
      claim, recording a settlement or a refusal, logging an inspection, restoring or suspending
      coverage, reinstating an allowance and recording expiry are service actions the desk performs;
      cancelling live coverage and taking the refund due, and transferring coverage with the piece to
      a new owner, are the customer's own, taken on the protection desk's request record and
      effective only once they confirm, so the desk hands those over. No rule here decides a claim
      for a peril the coverage excludes where the customer asks for it to be met anyway as a
      gesture, coverage of a piece the chain never sold under a plan that requires it did, restoring
      a plan whose restoration window has long passed, back-dating an inspection that was never
      carried out, or valuing a settlement against a piece for which no appraisal or purchase price
      exists at all; those call for a handover recorded as POLICY_NOT_COVERED.

  - name: workshop_service_desk
    claim:
      categories: [service]
      event_types:
        - service_order_opened
        - service_estimate_prepared
        - service_authorization_requested
        - service_work_authorized
        - service_labor_charged
        - service_parts_charged
        - service_rush_fee_charged
        - service_shipping_charged
        - service_payment_received
        - service_coverage_applied
        - service_goodwill_discount_applied
        - service_quality_check_logged
        - service_work_completed
        - service_rework_opened
        - service_order_cancelled
        - service_work_declined
    summary: >
      Callers here have a piece at the Belrose workshop, or want to send one in, and ring about what
      it will cost, when it will be ready, why it has come back the way it has, or who is paying for
      it. The setting varies with the service level the order runs at, since the six levels price the
      same bench task differently, queue it differently, stand behind it for different lengths of
      time and admit pieces up to very different values; with where the order stands, since a piece
      at intake, priced, waiting on authorisation, at the bench, ready to collect, handed back,
      returned unrepaired, cancelled or abandoned admits quite different handling; with the metal the
      piece is confirmed to be in, which carries its own surcharge on labour; and with whether a
      protection plan or a loyalty tier bears on the bill. The records in play are the work order
      itself with its estimate, its authorised ceiling and its promised date, the order's priced
      lines and payments entry by entry, and the workshop desk's request record; the customer's
      protection coverage and their membership sit outside this territory but decide how much of the
      bill the customer actually owes. The governing rules are service_intake_admission on what may
      be taken in and at which level, service_estimate_pricing on how each task is priced from the
      level's own schedule and the metal surcharge, service_authorization on what may not begin until
      the customer has agreed a ceiling, service_expedited_handling on shortening a promise and what
      that costs, service_protection_coverage on what a claim answers for, service_discounts_and_goodwill on what may be taken off and how often, service_quality_and_release on checking,
      handing back, storing and eventually treating a piece as abandoned, service_workmanship_
      guarantee on what comes back free and how many times, service_cancellation_and_return on
      stopping work, service_settlement on paying and shipping, and service_agg_multi_holding and
      service_agg_order_portfolio on how one customer's several orders relate — every threshold, rate
      and window in them stated per service level. Eligibility rests on the record rather than on the
      customer's recollection: the status the order stands at, whether the stone release has been
      signed where the declared value requires it, whether a written authorisation stands above the
      level's threshold, the date the piece was handed back where a guarantee is claimed, and whether
      an amount has already been taken off the priced line in question. Pricing the work, charging
      labour, parts, surcharges and shipping, applying what a protection claim answers for, taking an
      amount off, logging the checks, completing the work, taking payment and sending a piece back to
      the bench under the guarantee are service actions the desk performs; authorising the work and
      the ceiling it may run to, consenting to the chain working on stones it did not supply, and
      calling the work off are the customer's own, taken on the workshop desk's request record and
      effective only when they confirm, so the desk hands those over. Nothing here decides a claim
      that the chain damaged a piece beyond what its own workmanship guarantee answers for, the
      release or sale of a piece already treated as abandoned, work on a designer's piece where the
      designer's written authorisation has been refused, taking a piece in above the highest declared
      value any level carries, or a demand to replace a customer's stone with one the chain did not
      supply and cannot match; those are handed over as POLICY_NOT_COVERED.

  - name: custom_commission_desk
    claim:
      categories: [custom]
      event_types:
        - custom_order_opened
        - custom_design_presented
        - custom_design_approved
        - custom_quote_posted
        - custom_change_order_charged
        - custom_price_adjustment_charged
        - custom_order_specification_updated
        - custom_revision_allowance_granted
        - custom_design_revision_used
        - custom_deposit_paid
        - custom_progress_payment_paid
        - custom_refund_issued
        - custom_milestone_logged
        - custom_order_placed_on_hold
        - custom_order_resumed
        - custom_order_cancelled
    summary: >
      Callers here have a piece being designed or made for them at the Belrose design studio and ring
      about a change they want, a price that has moved, a revision they have used up, a delivery date
      that has slipped, or a commission they no longer wish to go through with. The judgement is hard
      because six commission programmes carry different minimum and maximum values, different numbers
      of included design revisions, different staged payment schedules, different forfeit shares and
      different rules about whose stone may be used; because the commission's stage — consultation,
      waiting on the customer's approval, waiting on the deposit, in production, held up, waiting on
      the balance, ready to hand over, delivered or cancelled — decides what may still be changed at
      all; and because a quote built at one metal price does not survive indefinitely, so the same
      request answered a month apart can produce two different totals. The records in play are the
      commission with its brief, its quoted total, its balance, its remaining revisions and the date
      its metal price was taken, the commission's entries covering the quote, agreed changes,
      repricings, payments, refunds, revisions and production stages, and the studio's own request
      record; where the customer is paying by promotional financing or putting an upgrade credit
      toward the piece, those agreements sit outside this territory but decide how the balance is
      met. The governing rules are custom_commission_admission on what may be commissioned under
      which programme, custom_quoting_and_repricing on how the quote is built and when it is rebuilt,
      custom_design_revisions on what is included and what an extra revision costs,
      custom_change_orders on changing an approved specification and how long that remains possible,
      custom_payment_schedule on the deposit and the stages, custom_production_schedule on lead times
      and holds, custom_cancellation_and_forfeit on walking away and what is kept, custom_delivery on
      handing the finished piece over, custom_post_delivery_care on what follows, and
      custom_agg_multi_holding and custom_agg_commission_portfolio on a customer running more than
      one commission — with every window, share and fee stated per programme. Eligibility rests on
      dated records rather than on what was said in the showroom: the date the design was approved,
      the date the metal price behind the quote was taken, whether the stone release has been signed
      where the customer supplied the stone, and the stage the commission had actually reached when
      the request arrived. Presenting a design, booking the quote, pricing an agreed change,
      repricing for the metal market, granting and drawing revisions, recording production stages,
      putting a commission on hold and taking it off, and issuing a refund are service actions the
      desk performs; approving a design, agreeing a change to the specification and the price that
      comes with it, consenting to work on a stone the customer supplied, and calling the commission
      off are the customer's own, taken on the studio's request record and effective only when they
      confirm, so the desk hands those over. No rule here decides a refund on a piece already
      finished to the customer's own specification, a request to reproduce a design the chain has
      undertaken not to repeat, a commission outside every programme's value range, compensation for
      a delivery date missed because a stone could not be sourced, or a demand that the studio work
      to a design the customer brought from another maker; those are handed over as
      POLICY_NOT_COVERED.

  - name: trade_up_desk
    claim:
      categories: [tradein]
      event_types:
        - tradein_registration_opened
        - tradein_condition_inspection_logged
        - tradein_valuation_requested
        - tradein_item_valuation_logged
        - tradein_credit_issued
        - tradein_credit_granted
        - tradein_credit_revaluation_applied
        - tradein_credit_redeemed
        - tradein_credit_partially_spent
        - tradein_credit_fully_spent
        - tradein_credit_expired
        - tradein_credit_forfeited
        - tradein_credit_revoked
        - tradein_item_rejected
        - tradein_registration_updated
    summary: >
      Callers here want to trade a piece in or spend an upgrade credit they already hold, and ring
      about what their piece is worth, why the credit came out lower than they expected, what they
      may spend it on, or what happens now that it is about to expire. The setting is hard to read
      because six programmes value a piece on quite different bases — what it originally sold for,
      what it would fetch today, what a laboratory certifies it as, or the published rate for its
      metal — and impose different conditions on where the piece came from, how long the customer has
      owned it, which laboratories they will accept and which condition grades they will take; and
      because the registration's own stage — registered, waiting on a valuation, credit issued, part
      spent, fully spent, expired or revoked — decides whether anything may still be done with it.
      The records in play are the registration with its original purchase details, its certificate,
      its appraised value, its condition grade and the credit still available, the registration's
      entries covering valuations, inspections, grants, revaluations, spends and forfeits, and the
      upgrade desk's own request record; the appraisal register sits outside this territory but is
      where the valuation a credit rests on actually lives, and a financing plan or a commission is
      often where the credit is ultimately spent. The governing rules are
      tradein_registration_eligibility on what may be traded at all, tradein_condition_grading on how
      the piece is graded and what a grade costs the valuation, tradein_valuation on which basis
      applies and how the credit is capped, tradein_credit_grant on booking and revaluing it,
      tradein_redemption on what the credit may be spent on and what the new piece must cost,
      tradein_agg_credit_stacking on spending more than one credit at once,
      tradein_expiry_and_forfeit on running out of time, tradein_estate_purchase on buying a piece
      outright or taking it on consignment, and tradein_agg_multi_holding on how many registrations
      one customer may run — each with its own percentages, ceilings, multiples and windows per
      programme. Eligibility rests on records rather than on the customer's account of the piece: the
      original purchase date, the original sales receipt where the programme requires the chain to
      have sold it, the certificate number and the laboratory that issued it, the condition grade the
      appraiser recorded, and the till transaction a credit is being spent against. Registering a
      piece, logging its inspection, sending it for valuation, recording the valuation, issuing and
      booking the credit, revaluing it, recording a spend, refusing a piece and recording expiry or
      forfeit are service actions the desk performs; deciding to hand the piece over at all, choosing
      between credit, an outright purchase and consignment, spending the credit against a particular
      sale, and withdrawing the piece are the customer's own, taken on the upgrade desk's request
      record and effective only when they confirm, so the desk hands those over. No rule here decides
      paying cash for a credit under a programme that does not offer it, reinstating a credit already
      forfeited, honouring an upgrade guarantee on a piece bought from another retailer, valuing a
      stone whose certificate does not match the stone presented, or a dispute with the appraiser's
      professional grading itself; those are handed over as POLICY_NOT_COVERED.
