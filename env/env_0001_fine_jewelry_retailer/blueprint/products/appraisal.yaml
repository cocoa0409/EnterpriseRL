events:
- type: appraisal_order_opened
  target: appraisal_orders
  mutation: create
  meaning: an appraisal is asked for and the engagement record is opened
  grain: one row per appraisal engagement opened
  fields:
    customer_id: the customer the appraisal is for
    variant_name: the appraisal service engaged
    status: the engagement opens at requested
    appraisal_reference: the reference the customer is given
    item_sku: the piece to be appraised
    item_description: how the customer described it
    item_count: how many pieces the engagement covers
    purpose_of_value: what the value is to be stated for
    appraiser_code: the appraiser carrying the engagement
    requested_date: the date it was asked for
    rush_requested: whether the report was asked to be expedited
    quoted_fee: the fee quoted for the engagement
  triggers:
  - event: appraisal:appraisal_base_fee_charged
    map:
      appraisal_order_id: appraisal_order_id
      customer_id: customer_id
- type: appraisal_item_received
  target: appraisal_orders
  mutation:
    transition:
      from: requested
      to: item_received
  meaning: the piece is taken into the appraiser's care
  grain: one row per piece taken into care on one engagement
  fields:
    status: the engagement moves to item received
    received_date: the date the piece was taken in
    declared_value: the value the piece was taken in at
  triggers: []
- type: appraisal_examination_started
  target: appraisal_orders
  mutation:
    transition:
      from: item_received
      to: in_examination
  meaning: the appraiser begins examining the piece
  grain: one row per examination begun on one engagement
  fields:
    status: the engagement moves into examination
    appraiser_code: the appraiser examining the piece
    laboratory_code: the outside laboratory the stone was sent to, where one was used
  triggers: []
- type: appraisal_report_drafted
  target: appraisal_orders
  mutation:
    transition:
      from: in_examination
      to: report_drafted
  meaning: the examination finishes and the report is drafted with the value stated
  grain: one row per report drafted on one engagement
  fields:
    status: the engagement moves to report drafted
    appraised_value: the value the report states
  triggers:
  - event: appraisal:appraisal_valuation_recorded
    map:
      appraisal_order_id: appraisal_order_id
      customer_id: customer_id
- type: appraisal_report_issued
  target: appraisal_orders
  mutation:
    transition:
      from: report_drafted
      to: issued
  meaning: the report is signed and issued to the customer
  grain: one row per report signed on one engagement
  fields:
    status: the engagement moves to issued
    issued_date: the date the report was signed
    valid_until: the last day the report is treated as current
  triggers: []
- type: appraisal_report_delivered
  target: appraisal_orders
  mutation:
    transition:
      from: issued
      to: delivered
  meaning: the report and the piece are handed back to the customer
  grain: one row per engagement handed back
  fields:
    status: the engagement closes as delivered
    delivered_date: the date they were handed back
    closed_date: the date the engagement closed
  triggers: []
- type: appraisal_report_expired
  target: appraisal_orders
  mutation:
    transition:
    - from: issued
      to: expired
    - from: delivered
      to: expired
  meaning: the report passes the date it is treated as current to
  grain: one row per report passing its currency date
  fields:
    status: the report expires
    closed_date: the date it stopped being current
  triggers: []
- type: appraisal_order_cancelled
  target: appraisal_orders
  mutation:
    transition:
    - from: requested
      to: cancelled
    - from: item_received
      to: cancelled
    - from: in_examination
      to: cancelled
  meaning: the customer stops the engagement before the report is issued
  grain: one row per engagement cancelled
  fields:
    status: the engagement is cancelled
    closed_date: the date the cancellation took effect
  triggers: []
- type: appraisal_order_updated
  target: appraisal_orders
  mutation: update
  meaning: a detail of a running engagement is corrected without moving its lifecycle state
  grain: one row per correction made to one engagement
  fields:
    item_description: how the piece reads on the engagement
    item_count: how many pieces it covers
    purpose_of_value: what the value is to be stated for
    appraiser_code: the appraiser carrying it
    declared_value: the value the piece is held at
    quoted_fee: the fee as it now stands
  triggers: []
- type: appraisal_base_fee_charged
  target: appraisal_ledger
  meaning: the fee for the engagement is priced onto it
  grain: one row per priced fee line on one engagement
  distinguish_by:
  - fee_code
  - item_sku
  - posted_date
  fields:
    appraisal_order_id: the engagement charged
    customer_id: the customer the engagement is for
    event_type: the family this entry belongs to
    posted_date: the date the fee was priced
    amount: the fee, positive
    fee_code: which priced line this is
    item_sku: the piece the line concerns, where it concerns one
    billing_period: the period the fee is accounted to
  account: appraisal_fees
  direction: in
  triggers: []
- type: appraisal_rush_fee_charged
  target: appraisal_ledger
  meaning: the surcharge for expediting the report is priced onto the engagement
  grain: one row per expedited handling surcharge on one engagement
  distinguish_by:
  - posted_date
  - amount
  fields:
    appraisal_order_id: the engagement charged
    customer_id: the customer the engagement is for
    event_type: the family this entry belongs to
    posted_date: the date the surcharge was priced
    amount: the surcharge, positive
    fee_code: the expedited handling line
    billing_period: the period the surcharge is accounted to
  account: appraisal_fees
  direction: in
  triggers: []
- type: appraisal_laboratory_fee_charged
  target: appraisal_ledger
  meaning: the outside laboratory's fee is passed on to the customer
  grain: one row per outside laboratory fee on one engagement
  distinguish_by:
  - laboratory_code
  - item_sku
  - posted_date
  fields:
    appraisal_order_id: the engagement charged
    customer_id: the customer the engagement is for
    event_type: the family this entry belongs to
    posted_date: the date the laboratory fee was priced
    amount: the laboratory fee, positive
    fee_code: the laboratory line
    laboratory_code: the laboratory that charged it
    item_sku: the piece sent out
    billing_period: the period the fee is accounted to
  account: appraisal_fees
  direction: in
  triggers: []
- type: appraisal_payment_received
  target: appraisal_ledger
  meaning: the customer pays toward the engagement
  grain: one row per payment taken against one engagement
  distinguish_by:
  - posted_date
  - amount
  - payment_channel
  fields:
    appraisal_order_id: the engagement paid
    customer_id: the customer who paid
    event_type: the family this entry belongs to
    posted_date: the date the payment was taken
    amount: the payment, negative
    payment_channel: how the money arrived
    billing_period: the period the payment is accounted to
  account: appraisal_fees
  direction: out
  triggers: []
- type: appraisal_fee_credited
  target: appraisal_ledger
  meaning: a fee already charged is taken off the engagement
