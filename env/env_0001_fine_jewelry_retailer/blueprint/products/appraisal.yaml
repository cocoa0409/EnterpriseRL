  - appraisal_report_issued
  rule: The report is issued within the service's turnaround in business days, counted from the day the piece was taken into the appraiser's care. Expedited handling is promised only where the customer gave at least the service's minimum notice in calendar days, and it carries the service's surcharge on the quoted fee. Where the stone goes to an outside laboratory the laboratory's own turnaround is added to the chain's, and the promised date is set from the two together rather than from the chain's alone. A rush surcharge is charged only where the report was actually issued inside the expedited turnaround; where the chain missed its own promise the surcharge is not charged. Business days are counted on the retail calendar that excludes Saturdays, Sundays and the chain's published store holidays.
