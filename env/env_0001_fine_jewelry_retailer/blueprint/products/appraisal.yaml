  rule: One engagement covers no more pieces than the service allows, and a collection larger than that is split across engagements rather than crammed into one report. The fee for an engagement is the service's base fee together with its per-item fee for each piece beyond the first, and it is never less than the service's minimum fee. Appraiser time beyond the hours the service includes is charged at the service's hourly rate, and the hours are counted on the engagement rather than across the customer's other engagements. Where the customer asks for several pieces to be reported on together, the report is issued as one document and the fee is charged on one engagement.
