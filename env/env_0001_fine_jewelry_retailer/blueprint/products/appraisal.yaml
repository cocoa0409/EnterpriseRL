  direction: out
  triggers: []
- type: appraisal_valuation_recorded
  target: appraisal_ledger
  meaning: the value the appraiser arrived at for a piece is recorded
  grain: one row per piece valued on one engagement
  distinguish_by:
  - item_sku
  - valuation_approach
  - posted_date
  fields:
    appraisal_order_id: the engagement valued under
    customer_id: the customer the engagement is for
    event_type: the family this entry belongs to
    posted_date: the date the value was recorded
    amount: the value stated, positive
