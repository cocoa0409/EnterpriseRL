    - appraisal_orders.issued_date
    - appraisal_orders.appraisal_reference
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - appraisal_orders.appraisal_reference
      action_bindings:
        appraisal_orders.appraisal_reference: appraisal_reference
    temporal_basis:
      clock: frozen_time
      anchor_event: the day the report was signed and issued
      anchor_source: appraisal_orders.issued_date
      relation: not_after
      duration_source: variants.report_validity_months
      unit: calendar_months
      counting_rule: Validity months are counted as whole calendar months from the day of signature, and where the anniversary day does not exist in the closing month the boundary falls on the last day of that month.
      boundary: inclusive
