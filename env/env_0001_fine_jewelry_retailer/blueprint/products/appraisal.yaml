- id: appraisal_report_currency
  subject:
  - appraisal_report_expired
  - appraisal_report_issued
  - appraisal_order_updated
  rule: A signed report is treated as current for the months the service sets, counted from the day the report was signed. A report is treated as current only where the handling date has not passed the report's validity in whole calendar months counted from the day the report was signed and issued. Validity months are counted as whole calendar months from the day of signature, and where the anniversary day does not exist in the closing month the boundary falls on the last day of that month. A report still inside its update window is refreshed for the service's update fee rather than rewritten, and a report past that window is prepared afresh at the full fee. Further copies of a signed report are issued for the service's reissue fee beyond the copies the service includes, and a digital copy is issued at the services that include one. An expired report is not accepted by the protection desk or the upgrade desk, whatever the value it states, and the customer is offered an update instead. The signed report and its working papers are retained for the years the service sets. A charge for refreshing a report and a charge for a further copy are each booked to the engagement as their own priced line under their own fee code, so two refreshes of the same report in different periods remain separate entries.
  eligibility:
  - id: report_still_current
    applies_to:
    - appraisal_report_expired
    kind: time
    condition: A report is treated as current only where the handling date has not passed the report's validity in whole calendar months counted from the day the report was signed and issued.
