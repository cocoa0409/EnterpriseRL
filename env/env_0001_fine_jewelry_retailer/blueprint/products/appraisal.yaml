  - appraisal_report_drafted
  rule: 'The value is arrived at on the approach the service uses: what it would cost to replace the piece new, what comparable pieces have sold for, what it would fetch on a forced sale, or the laboratory''s own grading. A value is recorded only while the engagement stands in examination, report drafted or issued, and each piece is valued once on an engagement. The stones are tested rather than accepted as described at the services that include gemological testing, and the metal is assayed rather than taken from the hallmark at the services that include an assay. Where the service sends the stone to an outside laboratory, the value rests on that laboratory''s grading and the report names which laboratory it was. The customer''s own belief about what the piece is worth is recorded as context and never stands in for the value the appraiser arrives at.'
