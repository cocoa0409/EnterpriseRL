  triggers: []
measures:
- id: appraisal_msr_open_engagements
  window: as at the handling date, with no look-back
  measure: count of appraisal engagements of this customer standing at requested, item_received, in_examination, report_drafted or issued
- id: appraisal_msr_items_valued
  window: the whole life of the engagement, from the day it was opened to the handling date
  measure: count of appraisal_valuation_recorded entries booked to this engagement
- id: appraisal_msr_days_since_issue
  window: from the issue date on the engagement to the handling date
  measure: count of whole calendar days elapsed since the report was signed, with no upper bound
policies:
- id: appraisal_agg_multi_holding
  subject:
  - appraisal_order_opened
  rule: Each appraisal service caps how many engagements one customer may have running under it at once, and an engagement counts as running while it stands at requested, item received, in examination, report drafted or issued. A further engagement is opened for a customer only when no engagement already recorded against the same appraisal reference stands at requested, item received, in examination, report drafted or issued. An engagement that has been delivered, has expired or has been cancelled no longer counts, so a customer may open another once one of theirs closes.
  eligibility:
  - id: no_open_engagement_on_reference
    applies_to:
    - appraisal_order_opened
    kind: dedup
    condition: A further engagement is opened for a customer only when no engagement already recorded against the same appraisal reference stands at requested, item received, in examination, report drafted or issued.
