# Product charter: Belrose Appraisal and Gemological Services
category: appraisal
display_name: Belrose Appraisal and Gemological Services
binding:
  holding_table: appraisal_orders
  event_tables:
  - appraisal_ledger
  status_field: status
  variant_field: variant_name
  quantity_fields:
    balance_due: appraisal_fees
lifecycle:
  states:
  - requested
  - item_received
  - in_examination
  - report_drafted
  - issued
  - delivered
  - expired
  - cancelled
  transitions:
  - from: requested
    to: item_received
    by: agent
    means: the piece was taken into the appraiser's care
  - from: requested
    to: cancelled
    by: user
    means: the customer withdrew before bringing the piece in
  - from: item_received
    to: in_examination
    by: agent
    means: the appraiser began examining the piece
  - from: item_received
    to: cancelled
    by: user
    means: the customer took the piece back before examination began
  - from: in_examination
    to: report_drafted
    by: agent
    means: the examination finished and the report was drafted
  - from: in_examination
    to: cancelled
    by: user
    means: the customer stopped the engagement part way through
  - from: report_drafted
    to: issued
    by: agent
    means: the report was signed and issued
  - from: issued
    to: delivered
    by: user
    means: the customer collected the report and the piece
  - from: issued
    to: expired
    by: system
    means: the report passed the date it is treated as current to
  - from: delivered
    to: expired
    by: system
    means: the delivered report passed the date it is treated as current to
accounts:
- key: appraisal_fees
  unit: USD
  meaning: what the customer owes for this appraisal engagement, increased by each priced fee and decreased by payments and credits
parameter_schema:
  base_fee: fee for the engagement itself before any per-item charge, in USD
  per_item_fee: fee charged for each piece beyond the first, in USD
  minimum_fee: smallest total fee any engagement of this service carries, in USD
  hourly_rate_beyond_included_hours: rate charged for appraiser time beyond the included hours, in USD per hour
  included_appraiser_hours: hours of appraiser time included in the base fee; integer
  turnaround_business_days: business days between the piece being taken in and the report being issued; integer
  rush_turnaround_business_days: business days the report is issued within when the engagement is expedited; integer
  rush_fee_pct: surcharge for expediting the report as a percentage of the quoted fee
  minimum_notice_days_for_rush: calendar days of notice needed before an engagement can be expedited; integer
  written_report_issued: whether a signed written report is issued rather than a spoken opinion; boolean
  report_validity_months: whole months the report is treated as current for; integer
  purpose_of_value_offered: the purposes this service will state a value for; list of purpose values
  valuation_approach: how value is arrived at under this service; enum of replacement_cost_new, comparable_sales, liquidation or laboratory_grading
  photography_included: whether the report carries photographs of the piece; boolean
  gemological_testing_included: whether the stones are tested rather than accepted as described; boolean
  diamond_plotting_included: whether the report plots the inclusions of the principal stone; boolean
  metal_assay_included: whether the metal is assayed rather than taken from the hallmark; boolean
  outside_laboratory_used: whether the stone is sent to an outside laboratory; boolean
  accepted_laboratories: the outside laboratories this service will send a stone to; list of laboratory codes
  laboratory_fee_passed_through: whether the outside laboratory's fee is passed on to the customer; boolean
  laboratory_turnaround_business_days: business days the outside laboratory takes; integer
  insured_shipping_to_laboratory: whether the stone travels to the laboratory under insurance; boolean
  maximum_declared_value: largest value a piece may be taken in at under this service, in USD
  custody_insurance_cap: largest amount the chain answers for while the piece is in its care, in USD
  appointment_required: whether the piece may only be taken in by appointment; boolean
  in_home_visit_available: whether the appraiser will attend the customer's home; boolean
  travel_fee: fee charged for the appraiser to attend away from a store, in USD
  maximum_items_per_engagement: how many pieces one engagement may cover; integer
  appraiser_certification_required: the standing an appraiser must hold to sign a report under this service; enum
  second_appraiser_review_required: whether a second appraiser reviews the report before it is signed; boolean
  uspap_compliant: whether the report is prepared to the Uniform Standards of Professional Appraisal Practice; boolean
  court_admissible: whether the report is prepared to a standard a court will receive; boolean
  update_fee_within_validity: fee to refresh a report that is still current, in USD
  update_window_months: whole months within which a report may be refreshed rather than rewritten; integer
  reissue_fee: fee to issue a further copy of a report already signed, in USD
  free_copies_included: how many copies of the report are issued without charge; integer
  digital_copy_included: whether a digital copy of the report is issued; boolean
  fee_credited_against_upgrade: whether the fee is credited when the piece is traded up at the chain; boolean
  fee_credited_against_commission: whether the fee is credited when a commission is placed on the back of the report; boolean
  cancellation_window_days: calendar days after the engagement is taken within which it may be cancelled without charge; integer
  cancellation_fee: charge for cancelling after the cancellation window, in USD
  payment_due_stage: when the fee falls due; enum of at_intake, on_issue or on_delivery
  deposit_pct: share of the quoted fee taken at intake, as a percentage
  identification_required_at_pickup: whether identification is checked before the piece and report are handed back; boolean
  unclaimed_holding_days: calendar days a finished engagement is held before storage is charged; integer
  storage_fee_per_month: storage charged per started month after the holding period, in USD
  protection_plan_requires_this_service: whether the protection desk accepts this service as the appraisal it requires; boolean
  trade_in_accepts_this_service: whether the upgrade desk accepts this service as the valuation it requires; boolean
  max_open_engagements_per_customer: how many engagements one customer may have running under this service at once; integer
  record_retention_years: whole years the signed report and its working papers are retained for; integer
