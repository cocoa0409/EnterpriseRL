  rule: A fee already charged is taken off where the appraisal was bundled with an upgrade or a commission the customer went ahead with, or where the chain charged twice for the same line. A fee is taken off only when no amount has already been taken off that same fee line. The credit is recorded against the fee line it answers, so a customer who was charged for several lines can see which of them was given back. A fee is never taken off merely because the customer is disappointed with the value the report states, because the value is the appraiser's professional opinion and not a priced service outcome.
