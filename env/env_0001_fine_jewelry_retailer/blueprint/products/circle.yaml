  subject:
  - circle_points_expired
  - circle_membership_lapsed
  rule: Unspent points fall away after the tier's expiry period, counted from the month they were earned, and the tier that never expires points is the only one they do not fall away on. Points fall away only while the membership stands at active, review pending, lapsed or closed, and the reason is recorded as one of the closed set of grounds. A membership that goes the tier's inactivity period without qualifying spend lapses, and the points on it fall away under the inactivity ground. On closure the points fall away at the tiers that forfeit them and are preserved for the period the programme allows at the tiers that do not. Points that have fallen away are not reinstated, because the period they were held for was published to the member when they were earned.
