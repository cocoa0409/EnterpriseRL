- id: circle_redemption
  subject:
  - circle_points_redeemed
  rule: Points are spent in blocks the tier sets, never below the tier's smallest redemption, and each point is worth the tier's redemption value in cents. Points are spent only through the channels the tier allows, and a tier that redeems only in store does not redeem over the telephone however convenient that would be. Points are spent only while the membership stands at active or review pending, and a lapsed or suspended membership spends nothing until it is put right. Points are given to another member only at the tiers that allow transfer, and pooled with a member at the same address only at the tiers that allow pooling. Where the member asks to spend more points than they hold, the desk spends what they hold and the rest of the sale is settled on other tender.
  eligibility:
  - id: redemption_state
    applies_to:
    - circle_points_redeemed
    kind: state
    condition: Points are spent only while the membership stands at active or review pending, and a lapsed or suspended membership spends nothing until it is put right.
    evidence_fields:
    - circle_memberships.status
    - circle_memberships.points_balance
    - circle_memberships.membership_number
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
