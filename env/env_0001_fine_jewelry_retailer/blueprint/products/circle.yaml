  - circle_tier_review_opened
  - circle_tier_review_completed
  - circle_membership_requalified
  rule: The tier is reviewed at the interval the programme sets, and the review is decided on the qualifying spend recorded since the current tier took effect. A member who reaches a higher tier's entry spend moves up, at once at the tiers that upgrade immediately and at the next review at the tiers that do not. A member who falls below their tier's maintenance spend keeps the tier for the grace months the tier allows and then moves down one tier, never more than one tier at a review. Qualifying spend is reset to zero when the new tier takes effect, so spend is never counted toward two membership years. The tier a member holds is the tier recorded on the membership at the moment of handling, and a promise of a coming upgrade does not confer the tier's benefits early.
