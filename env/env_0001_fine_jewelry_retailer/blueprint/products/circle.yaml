# Product charter: Belrose Circle Membership Programme
category: circle
display_name: Belrose Circle Membership Programme
binding:
  holding_table: circle_memberships
  event_tables:
  - circle_ledger
  status_field: status
  variant_field: variant_name
  quantity_fields:
    points_balance: points_balance
lifecycle:
  states:
  - enrolled
  - active
  - review_pending
  - lapsed
  - suspended
  - closed
  transitions:
  - from: enrolled
    to: active
    by: system
    means: the membership began earning
  - from: enrolled
    to: closed
    by: user
    means: the customer withdrew before the membership began earning
  - from: active
    to: review_pending
    by: system
    means: the membership year closed and the tier came up for review
  - from: review_pending
    to: active
    by: system
    means: the review was settled and the tier for the coming year took effect
  - from: active
    to: lapsed
    by: system
    means: the membership went the inactivity period without qualifying spend
  - from: lapsed
    to: active
    by: agent
    means: the member spent enough to bring the membership back to life
  - from: active
    to: suspended
    by: agent
    means: the membership was suspended while its earning was looked into
  - from: suspended
    to: active
    by: agent
    means: the review finished and the membership resumed
  - from: active
    to: closed
    by: user
    means: the member closed their membership
  - from: lapsed
    to: closed
    by: system
    means: a lapsed membership was closed after the review period
  - from: suspended
    to: closed
    by: agent
    means: a suspended membership was closed on the outcome of the review
accounts:
- key: points_balance
  unit: points
  meaning: how many loyalty points the member holds, increased by earning and bonuses and decreased by spending, reversals on returns and expiry
parameter_schema:
  tier_entry_qualifying_spend: qualifying spend in a membership year that brings a member into this tier, in USD
  tier_maintenance_qualifying_spend: qualifying spend in a membership year that keeps a member at this tier, in USD
  points_per_dollar_merchandise: points earned for each dollar of qualifying merchandise spend; number
  points_per_dollar_custom_commission: points earned for each dollar spent on a custom commission; number
  points_per_dollar_workshop_service: points earned for each dollar spent on workshop repair work; number
  points_per_dollar_protection_plan: points earned for each dollar spent on a protection plan; number
  points_per_dollar_appraisal: points earned for each dollar spent on an appraisal; number
  point_redemption_value_cents: what one point is worth when spent, in cents
  minimum_points_to_redeem: fewest points that may be spent in one redemption; integer
  redemption_increment_points: the block size points are spent in; integer
  points_expiry_months: whole months after which unspent points fall away; integer
  inactivity_months_to_lapse: whole months without qualifying spend after which the membership lapses; integer
  annual_points_sweep: whether unspent points are swept at the end of each membership year; boolean
  welcome_bonus_points: points granted when the membership begins earning; integer
  birthday_bonus_points: points granted in the member's birthday month; integer
  anniversary_bonus_points: points granted on the anniversary of the membership; integer
  referral_bonus_points: points granted for each referral who makes a first purchase; integer
  referrals_rewarded_per_year: how many referrals may be rewarded in one membership year; integer
  tier_review_interval_months: whole months between tier reviews; integer
  tier_downgrade_grace_months: whole months a member keeps a tier they no longer qualify for; integer
  requalification_spend: qualifying spend that brings a lapsed membership back to life, in USD
  free_cleanings_per_year: professional cleanings included in a membership year; integer
  free_resizings_per_year: ring resizings included in a membership year; integer
  complimentary_appraisals_per_year: appraisals included in a membership year; integer
  birthday_gift_included: whether a gift is sent in the member's birthday month; boolean
  event_invitations_per_year: invitations to the chain's private events in a membership year; integer
  concierge_assigned: whether a named concierge looks after the member; boolean
  early_access_days: calendar days before a public launch that the member may buy; integer
  extended_return_days: calendar days added to the standard return window for this member; integer
  free_insured_shipping: whether insured shipping is free for this member; boolean
  free_engraving: whether engraving is included for this member; boolean
  dedicated_phone_line: whether the member reaches a dedicated line rather than the general queue; boolean
  points_transferable: whether points may be given to another member; boolean
  points_poolable_within_household: whether points may be pooled with another member at the same address; boolean
  max_points_per_transaction: most points that may be earned on one sale; integer
  max_points_balance: most points a member may hold at once; integer
  promotion_stacking_allowed: whether points may be earned on a sale that already carries a promotional discount; boolean
  double_points_events_per_year: how many double-earning events the member is offered in a membership year; integer
  enrollment_fee: fee to join this tier, in USD
  annual_fee: fee charged each membership year to hold this tier, in USD
  minimum_age_years: smallest age in whole years at which a customer may hold this tier; integer
  max_memberships_per_customer: how many memberships of this tier one customer may hold; integer
  points_reversal_window_days: calendar days after a sale within which points earned on it may be taken back on a return; integer
  benefit_reservation_days: calendar days a booked benefit is held for the member; integer
  statement_frequency: how often the member is sent a points statement; enum of monthly, quarterly or annual
  redemption_channels: where points may be spent; list of channel values
  suspension_review_days: calendar days a suspended membership is reviewed within; integer
  points_forfeited_on_closure: whether unspent points fall away when the membership closes; boolean
  tier_upgrade_immediate: whether a tier upgrade takes effect at once rather than at the next review; boolean
