  rule: Bonus points are granted for joining, on the member's birthday month, on the anniversary of the membership and for each referral who makes a first purchase. A bonus is granted only while the membership stands at active or review pending, and each bonus is granted once for the occasion it answers. No more referrals are rewarded in one membership year than the tier allows, and a referral beyond that count is welcomed but not rewarded. A bonus granted in error is taken back under the reversal family rather than deleted, so the member's record still shows what happened. Bonus points count toward the balance but never toward qualifying spend, because they are given rather than earned.
