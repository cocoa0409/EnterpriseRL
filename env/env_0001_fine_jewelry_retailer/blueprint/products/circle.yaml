- id: circle_member_benefits
  subject:
  - circle_benefit_redeemed
  - circle_membership_details_updated
  rule: 'Each tier carries a set of benefits that cost no points: cleanings, resizings, appraisals, a birthday gift, invitations and, at the higher tiers, a named concierge. A benefit is used only while the membership stands at active or review pending, and each use is recorded so the year''s allowance can be counted. No more of a benefit is drawn in a membership year than the tier includes, and a request beyond the allowance is priced by the desk that provides it rather than refused. A benefit booked for the member is held for the tier''s reservation period and then released, and a benefit not used in the membership year does not carry forward. Benefits belong to the member and are not used by anyone else, however closely related, unless the member is present.'
