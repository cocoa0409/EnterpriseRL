events:
- type: circle_membership_enrolled
  target: circle_memberships
  mutation: create
  meaning: a customer joins the loyalty programme and a membership record is opened
  grain: one row per membership opened for one customer
  fields:
    customer_id: the customer joining
    variant_name: the tier they join at
    status: the membership opens at enrolled
    membership_number: the number the customer quotes at the till
    enrolled_date: the date they joined
    referral_code: the code they will give people they refer
    preferred_store_code: the store their benefits default to
    anniversary_month: the month their anniversary benefits fall in
  triggers: []
- type: circle_membership_activated
  target: circle_memberships
  mutation:
    transition:
      from: enrolled
      to: active
  meaning: the membership begins earning
  grain: one row per membership beginning to earn
  fields:
    status: the membership moves to active
    activated_date: the date it began earning
    tier_effective_date: the date the current tier took effect
    next_review_date: the date the tier is next reviewed
  triggers:
  - event: circle:circle_bonus_points_granted
    map:
      circle_membership_id: circle_membership_id
      customer_id: customer_id
- type: circle_tier_review_opened
  target: circle_memberships
  mutation:
    transition:
      from: active
      to: review_pending
  meaning: the membership year closes and the tier comes up for review
  grain: one row per tier review opened on one membership
  fields:
    status: the membership moves to review pending
    qualifying_spend_ytd: the spend the review will be decided on
  triggers: []
- type: circle_tier_review_completed
  target: circle_memberships
  mutation:
    transition:
      from: review_pending
      to: active
  meaning: the review is settled and the tier for the coming year takes effect
  grain: one row per tier review settled on one membership
  fields:
    status: the membership returns to active
    variant_name: the tier for the coming year
    tier_effective_date: the date that tier took effect
    next_review_date: the date of the next review
    qualifying_spend_ytd: reset to zero for the new membership year
  triggers: []
- type: circle_membership_lapsed
  target: circle_memberships
  mutation:
    transition:
      from: active
      to: lapsed
  meaning: the membership goes the inactivity period without qualifying spend and lapses
  grain: one row per membership lapsing
  fields:
    status: the membership lapses
    lapsed_date: the date it lapsed
  triggers: []
- type: circle_membership_requalified
  target: circle_memberships
  mutation:
    transition:
      from: lapsed
      to: active
  meaning: the member spends enough to bring a lapsed membership back to life
  grain: one row per lapsed membership brought back
  fields:
    status: the membership returns to active
    tier_effective_date: the date the tier took effect again
    next_review_date: the date of the next review
  triggers: []
- type: circle_membership_suspended
  target: circle_memberships
  mutation:
    transition:
      from: active
      to: suspended
  meaning: the membership is suspended while its earning is looked into
  grain: one row per membership suspended
  fields:
    status: the membership is suspended
  triggers: []
- type: circle_membership_reinstated
  target: circle_memberships
  mutation:
    transition:
      from: suspended
      to: active
  meaning: the review finishes and the membership resumes
  grain: one row per suspension lifted
  fields:
    status: the membership returns to active
    next_review_date: the date of the next tier review
  triggers: []
- type: circle_membership_closed
  target: circle_memberships
  mutation:
    transition:
    - from: enrolled
      to: closed
    - from: active
      to: closed
    - from: lapsed
      to: closed
    - from: suspended
      to: closed
  meaning: the membership closes
  grain: one row per membership closed
  fields:
    status: the membership closes
    closed_date: the date it closed
  triggers:
  - event: circle:circle_points_expired
    map:
      circle_membership_id: circle_membership_id
      customer_id: customer_id
      expiry_reason_code: membership_closed
- type: circle_membership_details_updated
  target: circle_memberships
  mutation: update
  meaning: a detail of a live membership is changed without moving its lifecycle state
  grain: one row per change made to one membership
  fields:
    preferred_store_code: the store the member's benefits default to
    anniversary_month: the month their anniversary benefits fall in
    concierge_assigned: whether a named concierge looks after them
    referral_code: the code they give people they refer
    next_review_date: the date the tier is next reviewed
  triggers: []
- type: circle_points_accrued
  target: circle_ledger
  meaning: points are earned on a qualifying purchase
  grain: one row per qualifying sale earning points on one membership
  distinguish_by:
  - sales_receipt_number
  - earn_category
  - posted_date
  fields:
    circle_membership_id: the membership credited
    customer_id: the member who spent
    event_type: the family this entry belongs to
    posted_date: the date the points were credited
    amount: the points earned, positive
    qualifying_spend: the spend the points were earned on
    sales_receipt_number: the till transaction the spend was rung on
    earn_category: what kind of spend it was
    multiplier: the earning multiplier in force
    billing_period: the period the earning is accounted to
  account: points_balance
  direction: in
  triggers: []
- type: circle_bonus_points_granted
  target: circle_ledger
  meaning: bonus points are granted for joining, for an anniversary, for a birthday or for a referral
  grain: one row per bonus granted on one membership
  distinguish_by:
  - earn_category
  - posted_date
  - amount
  fields:
    circle_membership_id: the membership credited
    customer_id: the member credited
    event_type: the family this entry belongs to
    posted_date: the date the bonus was granted
    amount: the bonus points, positive
    earn_category: the promotion or referral the bonus answers
    billing_period: the period the bonus is accounted to
  account: points_balance
  direction: in
  triggers: []
- type: circle_points_reversed
  target: circle_ledger
  meaning: points earned on a sale are taken back because the merchandise was returned
  grain: one row per return taking back the points earned on one sale
  distinguish_by:
  - source_entry_id
  - sales_receipt_number
  - posted_date
  fields:
    circle_membership_id: the membership debited
    customer_id: the member whose points are taken back
    event_type: the family this entry belongs to
    posted_date: the date the points were taken back
    amount: the points taken back, negative
    qualifying_spend: the spend given back, negative
    sales_receipt_number: the till transaction the return answers
    source_entry_id: the earning entry being taken back
    billing_period: the period the reversal is accounted to
  account: points_balance
  direction: out
  triggers: []
- type: circle_points_redeemed
  target: circle_ledger
  meaning: points are spent against a purchase or a service
  grain: one row per points redemption against one sale
  distinguish_by:
  - sales_receipt_number
  - posted_date
  - amount
  fields:
    circle_membership_id: the membership debited
    customer_id: the member spending the points
    event_type: the family this entry belongs to
    posted_date: the date the points were spent
    amount: the points spent, negative
    sales_receipt_number: the till transaction the points were spent on
    earn_category: what the points were spent against
    billing_period: the period the redemption is accounted to
  account: points_balance
  direction: out
  triggers: []
- type: circle_points_expired
  target: circle_ledger
  meaning: points fall away for inactivity, on the annual sweep or on closure
  grain: one row per block of points falling away for one reason
  distinguish_by:
  - expiry_reason_code
  - posted_date
  fields:
    circle_membership_id: the membership debited
    customer_id: the member whose points fell away
    event_type: the family this entry belongs to
    posted_date: the date the points fell away
    amount: the points that fell away, negative
    expiry_reason_code: why they fell away
    billing_period: the period the expiry is accounted to
  account: points_balance
  direction: out
  triggers: []
- type: circle_benefit_redeemed
  target: circle_ledger
  meaning: a member benefit that costs no points is used
  grain: one row per member benefit used on one membership
  distinguish_by:
  - benefit_code
  - posted_date
  fields:
    circle_membership_id: the membership the benefit was used on
    customer_id: the member who used it
    event_type: the family this entry belongs to
    posted_date: the date the benefit was used
    amount: zero, because the benefit costs no points
    benefit_code: which benefit was used
    billing_period: the period the use is accounted to
  triggers: []
measures:
- id: circle_msr_qualifying_spend_year
  window: the membership year running from the tier effective date to the handling date
  measure: sum of the qualifying_spend of circle_points_accrued and circle_points_reversed entries booked to this membership in that year
- id: circle_msr_referral_bonuses_year
  window: the membership year running from the tier effective date to the handling date
  measure: count of circle_bonus_points_granted entries on this membership whose earn_category is referral
- id: circle_msr_benefits_used_year
  window: the membership year running from the tier effective date to the handling date
  measure: count of circle_benefit_redeemed entries booked to this membership in that year
- id: circle_msr_months_since_spend
  window: from the most recent circle_points_accrued entry on this membership to the handling date
  measure: count of whole calendar months elapsed since the member last spent, with no upper bound
policies:
- id: circle_agg_multi_holding
  subject:
  - circle_membership_enrolled
  rule: A customer holds one loyalty membership and no more, because the programme is built on one identity and one earning record. A membership is opened for a customer only when no membership already recorded against the same membership number stands at enrolled, active, review pending, lapsed or suspended. Where a customer has closed a membership and wishes to rejoin, a fresh membership is opened at the entry tier and the points from the closed membership are not carried across.
  eligibility:
  - id: no_live_membership
    applies_to:
    - circle_membership_enrolled
    kind: dedup
    condition: A membership is opened for a customer only when no membership already recorded against the same membership number stands at enrolled, active, review pending, lapsed or suspended.
    evidence_fields:
    - circle_memberships.membership_number
    - circle_memberships.status
    - circle_memberships.customer_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - circle_memberships.membership_number
      action_bindings:
        circle_memberships.membership_number: membership_number
    dedup_contract:
      table: circle_memberships
      mode: separate_record
      object_bindings:
        membership_number: membership_number
      duplicate_filters:
        status:
        - enrolled
        - active
        - review_pending
        - lapsed
        - suspended
      distinct_fields:
      - enrolled_date
      - variant_name
  params:
    max_per_customer: 1
    per_tier:
      Belrose Circle Member:
        max_memberships_per_customer: =max_memberships_per_customer
        minimum_age_years: =minimum_age_years
      Belrose Circle Silver:
        max_memberships_per_customer: =max_memberships_per_customer
        minimum_age_years: =minimum_age_years
      Belrose Circle Gold:
        max_memberships_per_customer: =max_memberships_per_customer
        minimum_age_years: =minimum_age_years
      Belrose Circle Platinum:
        max_memberships_per_customer: =max_memberships_per_customer
        minimum_age_years: =minimum_age_years
      Belrose Circle Black:
        max_memberships_per_customer: =max_memberships_per_customer
        minimum_age_years: =minimum_age_years
      Belrose Circle Founders' Club:
        max_memberships_per_customer: =max_memberships_per_customer
        minimum_age_years: =minimum_age_years
- id: circle_earning
  subject:
  - circle_points_accrued
  rule: Points are earned on every desk of the chain, at the rate the member's tier sets for that kind of spend, and the rates differ by kind rather than being one rate for everything. Points are earned only while the membership stands at active or review pending, and a membership that is lapsed, suspended or closed earns nothing in the meantime. The points earned on a sale are the spend multiplied by the tier's rate for that kind of spend and by any multiplier in force, rounded down to a whole point. No sale earns more than the tier's ceiling for one transaction, and no member holds more than the tier's ceiling on the balance. Points are earned on a sale carrying a promotional discount only at the tiers that allow the two to stack, and at the tiers that do not the sale earns nothing. Spend that is refunded takes its points back, and spend on tax, on shipping and on gift cards is not qualifying spend at all.
