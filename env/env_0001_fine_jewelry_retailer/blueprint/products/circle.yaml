- id: circle_reversal
  subject:
  - circle_points_reversed
  rule: Points earned on a sale are taken back when the merchandise is returned, in the same number they were earned in. Points are taken back only against the earning entry they answer, identified by the till transaction number and the earning entry the points were credited on. Points are taken back only within the tier's reversal window in calendar days, counted from the date the sale the points were earned on was rung. The reversal window is counted in whole calendar days from the day of sale, that day counting as day zero, weekends and store holidays included. Where the points earned on the sale have already been spent, the balance is allowed to go negative and the member earns nothing further until it is back above zero. A reversal reduces the qualifying spend for the membership year as well as the balance, so a return can move a member back below a tier threshold.
  eligibility:
  - id: reversal_bound_to_earning
    applies_to:
    - circle_points_reversed
    kind: authorization
    condition: Points are taken back only against the earning entry they answer, identified by the till transaction number and the earning entry the points were credited on.
    evidence_fields:
    - circle_ledger.source_entry_id
    - circle_ledger.sales_receipt_number
    - circle_ledger.circle_membership_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - circle_ledger.sales_receipt_number
        - circle_ledger.source_entry_id
      action_bindings:
        circle_ledger.sales_receipt_number: sales_receipt_number
        circle_ledger.source_entry_id: source_entry_id
  - id: reversal_window
    applies_to:
    - circle_points_reversed
    kind: time
    condition: Points are taken back only within the tier's reversal window in calendar days, counted from the date the sale the points were earned on was rung.
    evidence_fields:
    - circle_ledger.posted_date
    - circle_ledger.sales_receipt_number
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - circle_ledger.sales_receipt_number
      action_bindings:
        circle_ledger.sales_receipt_number: sales_receipt_number
    temporal_basis:
      clock: frozen_time
      anchor_event: the date the sale the points were earned on was rung
      anchor_source: circle_ledger.posted_date
      relation: not_after
      duration_source: variants.points_reversal_window_days
      unit: calendar_days
      counting_rule: The reversal window is counted in whole calendar days from the day of sale, that day counting as day zero, weekends and store holidays included.
      boundary: inclusive
  params:
    per_tier:
      Belrose Circle Member:
        points_reversal_window_days: =points_reversal_window_days
      Belrose Circle Silver:
        points_reversal_window_days: =points_reversal_window_days
      Belrose Circle Gold:
        points_reversal_window_days: =points_reversal_window_days
      Belrose Circle Platinum:
        points_reversal_window_days: =points_reversal_window_days
      Belrose Circle Black:
        points_reversal_window_days: =points_reversal_window_days
      Belrose Circle Founders' Club:
        points_reversal_window_days: =points_reversal_window_days
