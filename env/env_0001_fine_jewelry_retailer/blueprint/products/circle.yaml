- id: circle_membership_standing
  subject:
  - circle_membership_suspended
  - circle_membership_reinstated
  - circle_membership_closed
  rule: A membership is suspended while its earning is looked into, and the review is finished within the days the tier sets. A suspension is lifted, and the membership resumed, only while it stands at suspended or already active. A membership closes at the member's own request, or after a lapsed membership has sat unreclaimed past the review period. An enrolment fee and an annual fee are charged at the tiers that carry them, and a tier whose annual fee goes unpaid is moved down rather than suspended. The closure itself is confirmed by the member, because giving up a membership and the points on it is theirs alone to do. The enrolment fee and the annual fee are rung at the till on their own sales receipt rather than booked against the points balance, and neither of them is qualifying spend, so paying to hold a tier never earns points toward keeping it.
  eligibility:
  - id: reinstatable_state
    applies_to:
    - circle_membership_reinstated
    kind: state
    condition: A suspension is lifted, and the membership resumed, only while it stands at suspended or already active.
    evidence_fields:
    - circle_memberships.status
    - circle_memberships.membership_number
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - circle_memberships.membership_number
      action_bindings:
        circle_memberships.membership_number: membership_number
    state_contract:
      field: circle_memberships.status
      allowed:
      - suspended
      - active
