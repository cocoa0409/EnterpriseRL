- id: custom_quoting_and_repricing
  subject:
  - custom_quote_posted
  - custom_price_adjustment_charged
  rule: The quoted total is built from the design as approved, the metal chosen and the stones specified, and it holds at the metal price taken on the day the quote was built. The quote is booked to the commission only while it stands at consultation, design approval or deposit pending, because a quote answers a design and not a piece already being made. Where the design has not been approved within the programme's metal price revaluation window in calendar days, counted from the date the metal price behind the quote was taken, the quote is rebuilt at the current metal price. The revaluation window is counted in whole calendar days from the day the metal price was taken, that day counting as day zero, weekends and market holidays included. On the programmes that pass the metal market through, the difference between the old and the new metal price is charged as a price adjustment; on the programmes that do not, the chain absorbs it and no adjustment is booked. A stone sourced to order carries the programme's sourcing fee on the stone's cost, and the fee is shown as its own line rather than folded into the quote. The design fee is charged where the programme charges one and credited against the quoted total on the programmes that credit it. The design fee is booked to the commission as its own entry under the design fee reason rather than folded into the quote, so that crediting it later leaves a visible pair of entries.
  eligibility:
  - id: quote_stage
    applies_to:
    - custom_quote_posted
    kind: state
    condition: The quote is booked to the commission only while it stands at consultation, design approval or deposit pending, because a quote answers a design and not a piece already being made.
    evidence_fields:
    - custom_orders.status
    - custom_orders.commission_reference
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - custom_orders.commission_reference
      action_bindings:
        custom_orders.commission_reference: commission_reference
    state_contract:
      field: custom_orders.status
      allowed:
      - consultation
      - design_approval
      - deposit_pending
  - id: metal_price_still_current
    applies_to:
    - custom_price_adjustment_charged
    kind: time
    condition: Where the design has not been approved within the programme's metal price revaluation window in calendar days, counted from the date the metal price behind the quote was taken, the quote is rebuilt at the current metal price.
    evidence_fields:
    - custom_orders.metal_price_basis_date
    - custom_orders.commission_reference
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - custom_orders.commission_reference
      action_bindings:
        custom_orders.commission_reference: commission_reference
    temporal_basis:
      clock: frozen_time
      anchor_event: the date the metal price behind the quote was taken
      anchor_source: custom_orders.metal_price_basis_date
      relation: not_after
      duration_source: variants.metal_price_revaluation_window_days
      unit: calendar_days
      counting_rule: The revaluation window is counted in whole calendar days from the day the metal price was taken, that day counting as day zero, weekends and market holidays included.
      boundary: inclusive
  params:
    per_tier:
      Design Studio Semi-Custom Setting:
        metal_price_revaluation_window_days: =metal_price_revaluation_window_days
        metal_price_passed_through: =metal_price_passed_through
        stone_sourcing_fee_pct: =stone_sourcing_fee_pct
        design_fee: =design_fee
        design_fee_credited_to_commission: =design_fee_credited_to_commission
        rush_surcharge_pct: =rush_surcharge_pct
        minimum_notice_days_for_rush: =minimum_notice_days_for_rush
        rush_production_business_days: =rush_production_business_days
      Design Studio Custom Setting:
        metal_price_revaluation_window_days: =metal_price_revaluation_window_days
        metal_price_passed_through: =metal_price_passed_through
        stone_sourcing_fee_pct: =stone_sourcing_fee_pct
        design_fee: =design_fee
        design_fee_credited_to_commission: =design_fee_credited_to_commission
        rush_surcharge_pct: =rush_surcharge_pct
