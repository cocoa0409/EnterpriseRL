events:
- type: custom_order_opened
  target: custom_orders
  mutation: create
  meaning: a commission is opened at the design consultation and the customer's brief is taken down
  grain: one row per commission opened for one customer
  fields:
    customer_id: the customer commissioning the piece
    variant_name: the commission programme the order runs under
    status: the commission opens at consultation
    commission_reference: the reference the customer is given
    design_brief: what the customer asked for, in their own words
    center_stone_source: where the centre stone will come from
    center_stone_carat: the weight of the centre stone
    metal_choice: the metal the piece is to be made in
    designer_code: the designer carrying the commission
    consultation_date: the date of the consultation
    rush_requested: whether the customer asked for the commission to be expedited
  triggers:
  - event: custom:custom_quote_posted
    map:
      custom_order_id: custom_order_id
      customer_id: customer_id
- type: custom_design_presented
  target: custom_orders
  mutation:
    transition:
      from: consultation
      to: design_approval
  meaning: a design is presented to the customer and the commission waits on their approval
  grain: one row per design put to one customer
  fields:
    status: the commission moves to design approval
    quoted_total: the total the design was quoted at
    metal_price_basis_date: the date the metal price behind the quote was taken
    promised_delivery_date: the date the finished piece would be promised for
  triggers: []
- type: custom_design_approved
  target: custom_orders
  mutation:
    transition:
      from: design_approval
      to: deposit_pending
  meaning: the customer approves the design and the deposit falls due
  grain: one row per design approved on one commission
  fields:
    status: the commission moves to deposit pending
    design_approved_date: the date the customer approved the design
    deposit_amount: the deposit that fell due
    quoted_total: the total the approval was given against
  triggers:
  - event: custom:custom_revision_allowance_granted
    map:
      custom_order_id: custom_order_id
      customer_id: customer_id
- type: custom_production_started
  target: custom_orders
  mutation:
    transition:
      from: deposit_pending
      to: in_production
  meaning: the deposit clears and the piece goes into production
  grain: one row per commission entering production
  fields:
    status: the commission moves into production
    production_start_date: the date production began
    promised_delivery_date: the date the finished piece is promised for
    sales_receipt_number: the till transaction the deposit was rung on
  triggers:
  - event: custom:custom_milestone_logged
    map:
      custom_order_id: custom_order_id
      customer_id: customer_id
- type: custom_order_placed_on_hold
  target: custom_orders
  mutation:
    transition:
      from: in_production
      to: on_hold
  meaning: production stops while something outstanding on the commission is resolved
  grain: one row per commission put on hold
  fields:
    status: the commission moves to on hold
  triggers: []
- type: custom_order_resumed
  target: custom_orders
  mutation:
    transition:
      from: on_hold
      to: in_production
  meaning: what held the commission up is resolved and production resumes
  grain: one row per hold lifted on one commission
  fields:
    status: the commission returns to production
    promised_delivery_date: the date the piece is now promised for
  triggers: []
- type: custom_production_completed
  target: custom_orders
  mutation:
    transition:
      from: in_production
      to: awaiting_final_payment
  meaning: production finishes and the balance falls due before the piece is handed over
  grain: one row per commission finished in production
  fields:
    status: the commission moves to awaiting final payment
    completed_date: the date production finished
    appraisal_reference: the appraisal prepared for the finished piece, where one is included
  triggers: []
- type: custom_balance_settled
  target: custom_orders
  mutation:
    transition:
      from: awaiting_final_payment
      to: ready_for_delivery
  meaning: the balance is settled and the finished piece is made ready to hand over
  grain: one row per commission whose balance was settled
  fields:
    status: the commission moves to ready for delivery
    balance_due: the balance recorded once the final payment cleared
  triggers: []
- type: custom_order_delivered
  target: custom_orders
  mutation:
    transition:
      from: ready_for_delivery
      to: delivered
  meaning: the finished piece is handed over and the commission closes
  grain: one row per commissioned piece handed over
  fields:
    status: the commission closes as delivered
    delivered_date: the date the piece was handed over
    closed_date: the date the commission closed
  triggers: []
- type: custom_order_cancelled
  target: custom_orders
  mutation:
    transition:
    - from: consultation
      to: cancelled
    - from: design_approval
      to: cancelled
    - from: deposit_pending
      to: cancelled
    - from: in_production
      to: cancelled
    - from: on_hold
      to: cancelled
  meaning: the customer closes the commission before it is delivered
  grain: one row per commission cancelled
  fields:
    status: the commission is cancelled
    closed_date: the date the cancellation took effect
  triggers:
  - event: custom:custom_refund_issued
    map:
      custom_order_id: custom_order_id
      customer_id: customer_id
- type: custom_order_specification_updated
  target: custom_orders
  mutation: update
  meaning: an agreed change to the specification is written onto the commission
  grain: one row per agreed change written onto one commission
  fields:
    metal_choice: the metal the piece is now to be made in
    center_stone_carat: the weight of the centre stone now specified
    center_stone_source: where the centre stone is now to come from
    design_brief: the brief as it now reads
    promised_delivery_date: the date the piece is now promised for
    quoted_total: the total as it now stands
    stone_release_signed: whether the stone release has been signed
  triggers: []
- type: custom_quote_posted
  target: custom_ledger
  meaning: the quoted total for the commission is booked as what the customer will owe
  grain: one row per quote booked to one commission
  distinguish_by:
  - posted_date
  - amount
  - charge_reason
  fields:
    custom_order_id: the commission quoted
    customer_id: the customer commissioning the piece
    event_type: the family this entry belongs to
    posted_date: the date the quote was booked
    amount: the quoted total, positive
    charge_reason: the original quote
    metal_price_per_gram: the metal price the quote was built at
    billing_period: the period the quote is accounted to
  account: commission_balance
  direction: in
  triggers: []
- type: custom_change_order_charged
  target: custom_ledger
  meaning: an agreed change to the specification is priced onto the commission
  grain: one row per agreed change priced onto one commission
  distinguish_by:
  - change_order_reference
  - posted_date
  fields:
    custom_order_id: the commission charged
    customer_id: the customer commissioning the piece
    event_type: the family this entry belongs to
    posted_date: the date the change was priced
    amount: the charge for the change, positive
    charge_reason: why the change was charged
    change_order_reference: the change order this charge prices
    billing_period: the period the charge is accounted to
  account: commission_balance
  direction: in
  triggers: []
- type: custom_price_adjustment_charged
  target: custom_ledger
  meaning: the commission is repriced for a movement in the metal market or for expedited production
  grain: one row per repricing of one commission for one reason
  distinguish_by:
  - charge_reason
  - posted_date
  - metal_price_per_gram
  fields:
    custom_order_id: the commission charged
    customer_id: the customer commissioning the piece
    event_type: the family this entry belongs to
    posted_date: the date the adjustment was booked
    amount: the adjustment, positive
    charge_reason: whether the adjustment is for the metal market, expediting or a stone upgrade
    metal_price_per_gram: the metal price the adjustment was calculated at
    billing_period: the period it is accounted to
  account: commission_balance
  direction: in
  triggers: []
- type: custom_deposit_paid
  target: custom_ledger
  meaning: the deposit on the commission is received
  grain: one row per deposit received on one commission
  distinguish_by:
  - posted_date
  - amount
  - payment_channel
  fields:
    custom_order_id: the commission paid toward
    customer_id: the customer who paid
    event_type: the family this entry belongs to
    posted_date: the date the deposit was received
    amount: the deposit, negative
    payment_stage: the deposit stage
    payment_channel: how the money arrived
    billing_period: the period the deposit is accounted to
  account: commission_balance
  direction: out
  triggers: []
- type: custom_progress_payment_paid
  target: custom_ledger
  meaning: a staged payment on the commission is received
  grain: one row per staged payment received on one commission
  distinguish_by:
  - payment_stage
  - posted_date
  - amount
  fields:
    custom_order_id: the commission paid toward
    customer_id: the customer who paid
    event_type: the family this entry belongs to
    posted_date: the date the payment was received
    amount: the payment, negative
    payment_stage: which stage of the schedule the payment answers
    payment_channel: how the money arrived
    billing_period: the period the payment is accounted to
  account: commission_balance
  direction: out
  triggers:
  - event: circle:circle_points_accrued
    map:
      customer_id: customer_id
      qualifying_spend: amount
- type: custom_refund_issued
  target: custom_ledger
  meaning: money already paid on the commission is returned to the customer
  grain: one row per refund paid against one earlier payment
  distinguish_by:
  - source_entry_id
  - posted_date
  fields:
    custom_order_id: the commission refunded
    customer_id: the customer refunded
    event_type: the family this entry belongs to
    posted_date: the date the refund was paid
    amount: the refund, negative
    payment_stage: the refund stage
    payment_channel: how the refund was paid
    source_entry_id: the payment entry being returned
    billing_period: the period the refund is accounted to
  account: commission_balance
  direction: out
  triggers: []
- type: custom_revision_allowance_granted
  target: custom_ledger
  meaning: the included design revisions are granted when the design is approved
  grain: one row per grant of included revisions on one commission
  distinguish_by:
  - posted_date
  - amount
  fields:
    custom_order_id: the commission granted the revisions
    customer_id: the customer commissioning the piece
    event_type: the family this entry belongs to
    posted_date: the date the revisions were granted
    amount: the number of revisions granted, positive
    revision_number: zero, because no revision has yet been taken
    billing_period: the period the grant is accounted to
  account: design_revisions
  direction: in
  triggers: []
- type: custom_design_revision_used
  target: custom_ledger
  meaning: the customer takes a design revision and one is drawn from the included allowance
  grain: one row per design revision taken on one commission
  distinguish_by:
  - revision_number
  - posted_date
  fields:
    custom_order_id: the commission revised
    customer_id: the customer commissioning the piece
    event_type: the family this entry belongs to
    posted_date: the date the revision was taken
    amount: one revision drawn, negative
    revision_number: which revision of the design this is, counting from one
    charge_reason: whether the revision was charged as an overage
    billing_period: the period the revision is accounted to
  account: design_revisions
  direction: out
  triggers: []
- type: custom_milestone_logged
  target: custom_ledger
  meaning: a stage of production is reached and recorded against the commission
  grain: one row per production stage reached on one commission
  distinguish_by:
  - milestone_code
  - posted_date
  fields:
    custom_order_id: the commission in production
    customer_id: the customer commissioning the piece
    event_type: the family this entry belongs to
    posted_date: the date the stage was reached
    amount: zero, because a production stage moves no money
    milestone_code: which stage was reached
    billing_period: the period the stage is accounted to
  triggers: []
measures:
- id: custom_msr_change_orders
  window: the whole life of the commission, from the consultation to the handling date
  measure: count of custom_change_order_charged entries booked to this commission
- id: custom_msr_revisions_taken
  window: the whole life of the commission, from the consultation to the handling date
  measure: count of custom_design_revision_used entries booked to this commission
- id: custom_msr_paid_to_date
  window: as at the handling date, with no look-back
  measure: sum of the absolute amount of custom_deposit_paid and custom_progress_payment_paid entries booked to this commission
- id: custom_msr_open_commissions
  window: as at the handling date, with no look-back
  measure: count of commissions of this customer standing at consultation, design_approval, deposit_pending, in_production, on_hold, awaiting_final_payment or ready_for_delivery
policies:
- id: custom_agg_multi_holding
  subject:
  - custom_order_opened
  rule: One customer may have several commissions running, but each programme caps how many of its own commissions may run for one customer at a time. A further commission is opened for a customer only when no commission already recorded against the same commission reference stands at consultation, design approval, deposit pending, in production, on hold, awaiting final payment or ready for delivery. A commission that has been delivered or cancelled no longer counts against the cap, and a customer at the cap is offered a place in the studio's book rather than a second open commission.
  eligibility:
  - id: no_open_commission_on_reference
    applies_to:
    - custom_order_opened
    kind: dedup
    condition: A further commission is opened for a customer only when no commission already recorded against the same commission reference stands at consultation, design approval, deposit pending, in production, on hold, awaiting final payment or ready for delivery.
    evidence_fields:
    - custom_orders.commission_reference
    - custom_orders.status
    - custom_orders.customer_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - custom_orders.commission_reference
      action_bindings:
        custom_orders.commission_reference: commission_reference
    dedup_contract:
      table: custom_orders
      mode: separate_record
      object_bindings:
        commission_reference: commission_reference
      duplicate_filters:
        status:
        - consultation
        - design_approval
        - deposit_pending
        - in_production
        - on_hold
        - awaiting_final_payment
        - ready_for_delivery
      distinct_fields:
      - consultation_date
      - variant_name
  params:
    max_per_customer: 3
    per_tier:
      Design Studio Semi-Custom Setting:
        max_open_commissions_per_customer: =max_open_commissions_per_customer
      Design Studio Custom Setting:
        max_open_commissions_per_customer: =max_open_commissions_per_customer
      Belrose Bespoke Design:
        max_open_commissions_per_customer: =max_open_commissions_per_customer
      Belrose Bespoke Signature Commission:
        max_open_commissions_per_customer: =max_open_commissions_per_customer
      Belrose Heritage Redesign Commission:
        max_open_commissions_per_customer: =max_open_commissions_per_customer
      Belrose Atelier One-of-a-Kind Commission:
        max_open_commissions_per_customer: =max_open_commissions_per_customer
- id: custom_agg_commission_portfolio
  subject:
  - custom_deposit_paid
  - custom_progress_payment_paid
  - custom_balance_settled
  rule: Each commission carries its own quote, its own schedule of staged payments and its own balance, and money paid on one is never moved to another. What the customer has paid to date on a commission is read as the sum of the deposits and staged payments booked to that commission, and it is this figure, not the quoted total, that any forfeit is taken against. Where a customer running several commissions asks for them to be delivered together, each is settled in full on its own terms first. An upgrade credit put toward a commission is applied to the commission it was presented against and is never spread across the customer's other commissions.
  eligibility: []
  params:
    per_tier:
      Design Studio Semi-Custom Setting:
        progress_payment_schedule: =progress_payment_schedule
        trade_in_credit_accepted: =trade_in_credit_accepted
        financing_allowed: =financing_allowed
      Design Studio Custom Setting:
