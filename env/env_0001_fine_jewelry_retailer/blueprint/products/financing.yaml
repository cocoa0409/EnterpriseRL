# Product charter: Belrose Promotional Financing Plans
category: financing
display_name: Belrose Promotional Financing Plans
binding:
  holding_table: financing_plans
  event_tables:
  - financing_ledger
  intake_tables:
  - financing_intake
  status_field: status
  variant_field: variant_name
  quantity_fields:
    current_balance: plan_balance
    accrued_promo_interest: deferred_interest
lifecycle:
  states:
  - applied
  - approved
  - active
  - past_due
  - in_hardship
  - paid_off
  - charged_off
  - cancelled
  transitions:
  - from: applied
    to: approved
    by: system
    means: the lender returned an approval on the application
  - from: applied
    to: cancelled
    by: user
    means: the customer withdrew the application before a decision took effect
  - from: approved
    to: active
    by: system
    means: the first statement closed and the plan began billing
  - from: approved
    to: cancelled
    by: user
    means: the customer declined the approved terms inside the cooling-off window
  - from: active
    to: past_due
    by: system
    means: a scheduled payment went unpaid beyond the delinquency threshold
  - from: past_due
    to: active
    by: agent
    means: the arrears were cleared and the plan was brought current
  - from: active
    to: in_hardship
    by: agent
    means: a hardship arrangement was enrolled on a current plan
  - from: past_due
    to: in_hardship
    by: agent
    means: a hardship arrangement was enrolled on a delinquent plan
  - from: in_hardship
    to: active
    by: agent
    means: the hardship arrangement ran its course and ordinary billing resumed
  - from: active
    to: paid_off
    by: system
    means: the balance reached zero and the plan closed
  - from: past_due
    to: paid_off
    by: system
    means: the arrears and the balance were settled in full and the plan closed
  - from: in_hardship
    to: paid_off
    by: system
    means: the balance was settled while a hardship arrangement was running
  - from: past_due
    to: charged_off
    by: system
    means: the plan reached the write-off threshold and moved to collections
  - from: in_hardship
    to: charged_off
    by: system
    means: the hardship arrangement broke down and the plan moved to collections
accounts:
- key: plan_balance
  unit: USD
  meaning: what the customer still owes on this promotional financing plan, increased by purchases and priced charges and decreased by payments and credits
- key: deferred_interest
  unit: USD
  meaning: interest that has accrued on the promotional balance but is being held back under the promotional term, increased by each cycle's accrual and decreased when it is given back or billed
parameter_schema:
  promo_term_months: length of the promotional term in whole months, counted from the activation date; integer
  promo_structure: 'how the promotion prices interest: deferred_interest holds interest back and bills it all if the balance is not cleared, equal_payment charges a fixed reduced rate throughout; enum'
  minimum_purchase_amount: smallest financed amount the term may be written for, in USD
  maximum_purchase_amount: largest financed amount the term may be written for, in USD
  minimum_down_payment_pct: smallest share of the ticket that must be paid at the till on the day of sale, as a percentage of the pre-tax ticket
  required_credit_score_floor: lowest bureau credit score the term may be approved at; three-digit integer
  standard_apr_pct: annual percentage rate that applies to any balance outside the promotion, as a percentage
  promotional_apr_pct: annual percentage rate charged on the promotional balance during the term, as a percentage
  penalty_apr_pct: annual percentage rate the plan is repriced to after the missed-payment trigger is reached, as a percentage
  penalty_apr_trigger_missed_payments: number of missed scheduled payments within the repricing review window that reprices the plan to the penalty rate; integer
  penalty_apr_review_months: number of consecutive months of on-time payment after which the penalty rate is reviewed and removed; integer
  minimum_payment_factor_pct: share of the promotional balance billed each cycle as the scheduled minimum payment, as a percentage of the balance at term start
  minimum_monthly_payment_floor: smallest scheduled monthly payment the plan will bill regardless of the factor, in USD
  billing_cycle_days: nominal length of one billing cycle in calendar days; integer
  statement_lead_days: calendar days between the statement closing date and the payment due date printed on it; integer
  grace_period_days: calendar days after the payment due date during which a payment is still treated as on time; integer
  late_fee_first: fee charged the first time a scheduled payment is late within the repeat window, in USD
  late_fee_repeat: fee charged for a later lateness falling inside the repeat window, in USD
  late_fee_repeat_window_months: rolling window in whole months over which earlier late fees make the next one a repeat; integer
  late_fee_cap_pct_of_scheduled_payment: ceiling on any single late fee expressed as a percentage of the scheduled monthly payment
  returned_payment_fee: fee charged when a presented payment is returned unpaid by the bank, in USD
  returned_payment_fee_cap_per_cycle: largest number of returned-payment fees that may be charged within one billing cycle; integer
  deferred_interest_forfeited_on_unpaid_balance: whether any balance left at the end of the term causes the whole held-back interest to be billed; boolean
  promo_satisfaction_buffer_days: calendar days before the end of the term by which the balance must reach zero for the held-back interest to be given back; integer
  payoff_quote_validity_days: calendar days a quoted payoff figure stays good for; integer
  autopay_apr_discount_pct: reduction applied to the promotional rate while automatic payment is in force, in percentage points
  autopay_setup_lead_days: calendar days before a due date by which automatic payment must be arranged for it to govern that payment; integer
  autopay_failure_grace_days: calendar days after a failed automatic payment during which a replacement payment is still treated as on time; integer
  courtesy_late_fee_waivers_per_12_months: number of late fees that may be given back as a courtesy in a rolling twelve months; integer
  courtesy_waiver_minimum_tenure_months: whole months the plan must have been billing before a courtesy give-back may be granted; integer
  hardship_min_months_active: whole months the plan must have been billing before a hardship arrangement may be enrolled; integer
  hardship_max_enrollments_per_plan: number of hardship arrangements one plan may ever be enrolled in; integer
  hardship_reduced_payment_pct: share of the ordinary scheduled payment billed during a reduced-payment hardship arrangement, as a percentage
  hardship_term_months: length of a hardship arrangement in whole months; integer
  hardship_interest_pause_months: whole months of a hardship arrangement during which no interest accrues; integer
  charge_off_days_past_due: calendar days past due at which the plan is written off to collections; integer
  days_past_due_to_delinquent: calendar days past due at which the plan is moved to the past due state; integer
  reinstatement_max_days_past_due: largest number of days past due from which a plan may still be brought current and reinstated; integer
  return_credit_posting_business_days: business days within which a merchandise return credit must appear on the plan; integer
  return_credit_recalculates_schedule: whether a return credit rebuilds the remaining payment schedule rather than only shortening the plan; boolean
  promotional_reallocation_allowed: whether a purchase may be moved to a different promotional term after the sale; boolean
  promotional_reallocation_window_days: calendar days after the sale within which a purchase may be moved to a different term; integer
  max_concurrent_plans_of_this_term: how many plans of this same term one customer may hold open at once; integer
  aggregate_promotional_balance_cap: largest combined balance across all of this customer's open plans that this term may be written against, in USD
  down_payment_refund_window_days: calendar days within which a down payment is refundable if the sale is unwound; integer
  paper_statement_fee: fee charged per cycle for a posted paper statement, in USD
  payment_cutoff_time_et: clock time in the Eastern time zone after which a payment is credited to the next day; HH:MM
  same_day_credit_channels: the channels on which a payment received before the cut-off is credited the same day; list of channel values
  payment_allocation_order: the order in which a payment is applied across what is owed; ordered list of fees, interest and principal
  prepayment_penalty_pct: charge for clearing the plan early, as a percentage of the balance cleared
  residual_balance_writeoff_threshold: balance at or below which a remaining amount is written off instead of billed, in USD
  minimum_statement_balance_to_issue: smallest balance for which a statement is produced at all, in USD
  cooling_off_cancellation_days: calendar days after the sale within which the customer may unwind the financing and the sale together; integer
  promo_expiry_notice_days: calendar days before the end of the term at which the expiry notice is sent; integer
  credit_line_utilization_cap_pct: share of the approved credit line this term may consume, as a percentage
  joint_applicant_allowed: whether a second applicant may be named on the plan; boolean
  trade_up_credit_applies_to_principal: whether an upgrade credit may be applied against the financed principal rather than paid out; boolean
  protection_plan_may_be_financed: whether the price of a protection plan may be added to this financed balance; boolean
  minimum_applicant_age_years: smallest age in whole years at which an applicant may be approved for this term; integer
  statement_delivery_default: how statements are delivered unless the customer changes it; enum of paper or electronic
