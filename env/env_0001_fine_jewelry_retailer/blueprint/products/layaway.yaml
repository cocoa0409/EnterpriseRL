# Product charter: Belrose Layaway and Hold Agreements
category: layaway
display_name: Belrose Layaway and Hold Agreements
binding:
  holding_table: layaway_agreements
  event_tables:
  - layaway_ledger
  intake_tables:
  - layaway_intake
  status_field: status
  variant_field: variant_name
  quantity_fields:
    balance_due: layaway_balance
    items_reserved: merchandise_reserve
lifecycle:
  states:
  - opened
  - current
  - delinquent
  - on_hold
  - completed
  - forfeited
  - cancelled
  transitions:
  - from: opened
    to: current
    by: agent
    means: the deposit cleared and the payment schedule began
  - from: opened
    to: cancelled
    by: user
    means: the customer withdrew before the deposit cleared
  - from: current
    to: delinquent
    by: system
    means: a scheduled payment went unpaid past the delinquency threshold
  - from: delinquent
    to: current
    by: agent
    means: the arrears were cleared and the agreement was brought current
  - from: current
    to: on_hold
    by: agent
    means: payments were paused for an agreed spell
  - from: on_hold
    to: current
    by: agent
    means: the pause ended and the schedule resumed
  - from: current
    to: completed
    by: system
    means: the balance reached zero and the merchandise was released
  - from: delinquent
    to: forfeited
    by: system
    means: the arrears reached the forfeit threshold and the merchandise was taken back
  - from: current
    to: cancelled
    by: user
    means: the customer cancelled a current agreement
  - from: delinquent
    to: cancelled
    by: user
    means: the customer cancelled a delinquent agreement rather than let it forfeit
  - from: on_hold
    to: cancelled
    by: user
    means: the customer cancelled while payments were paused
accounts:
- key: layaway_balance
  unit: USD
  meaning: what the customer still owes on this agreement, increased by the merchandise and the plan's fees and decreased by payments and credits
- key: merchandise_reserve
  unit: pieces
  meaning: how many pieces the store is holding under this agreement, increased when a piece is set aside and decreased when it is released or taken back
parameter_schema:
  term_days: calendar days the agreement runs for from the day it is opened; integer
  minimum_merchandise_total: smallest pre-tax merchandise price this plan may be opened for, in USD
  maximum_merchandise_total: largest pre-tax merchandise price this plan may be opened for, in USD
  minimum_deposit_pct: smallest share of the merchandise price that must be put down at opening, as a percentage
  minimum_deposit_amount: smallest deposit accepted at opening whatever the share works out at, in USD
  service_fee_amount: flat fee the plan charges for holding the merchandise, in USD
  service_fee_pct_of_total: fee for holding the merchandise as a percentage of the merchandise price
  service_fee_refundable: whether the holding fee is returned if the agreement is cancelled; boolean
  payment_frequency: how often a scheduled payment falls due; enum of weekly, biweekly or monthly
  minimum_payment_amount: smallest scheduled payment the agreement will ask for, in USD
  minimum_payment_pct_of_balance: scheduled payment as a share of the balance at opening, as a percentage
  grace_period_days: calendar days after a scheduled payment date during which the payment is still treated as on time; integer
  late_fee_amount: fee charged when a scheduled payment is late, in USD
  late_fees_per_term_cap: largest number of late fees that may be charged over the whole term; integer
  days_past_due_to_delinquent: calendar days past due at which the agreement is marked delinquent; integer
  days_past_due_to_forfeit: calendar days past due at which the merchandise is taken back and the agreement forfeits; integer
  reinstatement_allowed: whether a delinquent agreement may be brought current rather than forfeited; boolean
  reinstatement_fee: fee charged to bring a delinquent agreement current, in USD
  term_extension_allowed: whether the term may be extended once; boolean
  term_extension_days: calendar days an extension adds to the term; integer
  term_extension_fee: fee charged to extend the term, in USD
  pause_allowed: whether payments may be paused for a spell; boolean
  pause_max_days: calendar days payments may be paused for; integer
  cancellation_window_days: calendar days after opening within which the agreement may be cancelled with everything returned; integer
  restocking_fee_pct: share of the merchandise price kept when the agreement is cancelled after the cancellation window, as a percentage
  restocking_fee_cap: ceiling on the restocking charge however the share works out, in USD
  forfeit_refund_pct: share of what the customer paid that is returned when the agreement forfeits, as a percentage
  deposit_refundable: whether the deposit is returned when the agreement is cancelled; boolean
  refund_method: how money is returned; enum of original_tender, store_credit or check
  refund_issued_business_days: business days within which a refund is issued; integer
  price_protection_days: calendar days after opening within which a fall in the ticket price is passed on to the customer; integer
  item_substitution_allowed: whether the held piece may be swapped for another; boolean
  substitution_value_tolerance_pct: how far the substituted piece's price may differ from the original, as a percentage
  maximum_items_per_agreement: how many pieces one agreement may hold; integer
  max_open_agreements_per_customer: how many agreements of this plan one customer may hold open at once; integer
  aggregate_open_balance_cap: largest combined balance across the customer's open agreements this plan may be written against, in USD
  early_payoff_allowed: whether the agreement may be paid up before the term ends; boolean
  early_payoff_discount_pct: discount on the remaining balance for paying up early, as a percentage
  autopay_available: whether scheduled payments may be taken automatically; boolean
  autopay_discount_amount: amount taken off the holding fee while automatic payment is in force, in USD
  statement_frequency: how often a statement is sent; enum of weekly, monthly or on_request
  special_order_deposit_pct: share taken down on a piece ordered in specially, as a percentage
  special_order_nonrefundable: whether a specially ordered piece's deposit is non-returnable; boolean
  registry_contributions_allowed: whether other people may pay toward this agreement through a gift registry; boolean
  registry_contributor_limit: how many people may pay toward one registry agreement; integer
  pickup_identification_required: whether identification is checked before the merchandise is handed over; boolean
  third_party_pickup_allowed: whether someone other than the customer may collect the merchandise on written authority; boolean
  holding_storage_days_after_payoff: calendar days the paid-up merchandise is held before storage is charged; integer
  storage_fee_per_month: storage charged per started month after the holding period, in USD
  protection_plan_may_be_added: whether a protection plan may be added to the held piece before payoff; boolean
  loyalty_points_on_completion: whether loyalty points are earned when the agreement is paid up rather than as payments arrive; boolean
