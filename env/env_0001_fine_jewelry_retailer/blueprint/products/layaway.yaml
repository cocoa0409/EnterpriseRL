- id: layaway_merchandise_handling
  subject:
  - layaway_merchandise_posted
  - layaway_item_reserved
  - layaway_agreement_updated
  rule: The merchandise is booked to the agreement as one entry per piece held, carrying the receipt reference and the item reference it was rung under. Merchandise is booked to an agreement only while that agreement stands at opened, current or on hold. A piece is set aside in the stockroom when the agreement is opened and stays set aside for as long as the agreement runs. A piece is swapped for another only on the plans that admit substitution, and only where the substituted piece's price is within the plan's tolerance of the original. Where the ticket price falls inside the plan's price protection window after opening, the fall is passed on to the customer and the balance rebuilt at the lower price.
  eligibility:
  - id: agreement_open_for_merchandise
    applies_to:
    - layaway_merchandise_posted
    - layaway_item_reserved
    kind: state
    condition: Merchandise is booked to an agreement only while that agreement stands at opened, current or on hold.
