      Gift Registry Layaway:
        minimum_merchandise_total: =minimum_merchandise_total
        maximum_merchandise_total: =maximum_merchandise_total
        minimum_deposit_pct: =minimum_deposit_pct
        minimum_deposit_amount: =minimum_deposit_amount
