        service_fee_amount: =service_fee_amount
        service_fee_pct_of_total: =service_fee_pct_of_total
        service_fee_refundable: =service_fee_refundable
        special_order_deposit_pct: =special_order_deposit_pct
        special_order_nonrefundable: =special_order_nonrefundable
        registry_contributions_allowed: =registry_contributions_allowed
        registry_contributor_limit: =registry_contributor_limit
      90-Day Layaway:
