- id: layaway_delinquency_and_relief
  subject:
  - layaway_agreement_brought_current
  - layaway_agreement_paused
  - layaway_agreement_resumed
  - layaway_agreement_forfeited
  rule: A delinquent agreement is brought current by clearing the arrears, on the plans that admit reinstatement, and the plan's reinstatement fee is charged with it. An agreement is brought current only while it stands at delinquent or already current. Payments may be paused for the days the plan allows on the plans that admit a pause, and the final payment date moves out by the length of the pause. The term may be extended once by the plan's extension for the plan's extension fee on the plans that admit an extension, and a plan that admits none runs to its original date whatever the circumstances. An agreement that reaches the plan's forfeit threshold has the merchandise taken back and returns the plan's share of what the customer paid, and the plan that returns everything returns everything. The reinstatement charge and the extension charge are each booked to the agreement as their own entry under their own fee code, so an agreement that has been both reinstated and extended shows the two separately.
  eligibility:
  - id: reinstatable_state
    applies_to:
    - layaway_agreement_brought_current
    kind: state
    condition: An agreement is brought current only while it stands at delinquent or already current.
    evidence_fields:
    - layaway_agreements.status
    - layaway_agreements.agreement_reference
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - layaway_agreements.agreement_reference
      action_bindings:
        layaway_agreements.agreement_reference: agreement_reference
    state_contract:
      field: layaway_agreements.status
      allowed:
      - delinquent
      - current
  params:
    per_tier:
      30-Day Hold Agreement:
        reinstatement_allowed: =reinstatement_allowed
        reinstatement_fee: =reinstatement_fee
        pause_allowed: =pause_allowed
        pause_max_days: =pause_max_days
        term_extension_allowed: =term_extension_allowed
        term_extension_days: =term_extension_days
        term_extension_fee: =term_extension_fee
        forfeit_refund_pct: =forfeit_refund_pct
      90-Day Layaway:
        reinstatement_allowed: =reinstatement_allowed
        reinstatement_fee: =reinstatement_fee
        pause_allowed: =pause_allowed
        pause_max_days: =pause_max_days
        term_extension_allowed: =term_extension_allowed
        term_extension_days: =term_extension_days
        term_extension_fee: =term_extension_fee
        forfeit_refund_pct: =forfeit_refund_pct
      6-Month Layaway:
        reinstatement_allowed: =reinstatement_allowed
        reinstatement_fee: =reinstatement_fee
        pause_allowed: =pause_allowed
        pause_max_days: =pause_max_days
        term_extension_allowed: =term_extension_allowed
        term_extension_days: =term_extension_days
        term_extension_fee: =term_extension_fee
        forfeit_refund_pct: =forfeit_refund_pct
      12-Month Bridal Layaway:
        reinstatement_allowed: =reinstatement_allowed
        reinstatement_fee: =reinstatement_fee
        pause_allowed: =pause_allowed
        pause_max_days: =pause_max_days
        term_extension_allowed: =term_extension_allowed
        term_extension_days: =term_extension_days
        term_extension_fee: =term_extension_fee
        forfeit_refund_pct: =forfeit_refund_pct
      Special Order Layaway:
        reinstatement_allowed: =reinstatement_allowed
        reinstatement_fee: =reinstatement_fee
        pause_allowed: =pause_allowed
        pause_max_days: =pause_max_days
        term_extension_allowed: =term_extension_allowed
        term_extension_days: =term_extension_days
        term_extension_fee: =term_extension_fee
        forfeit_refund_pct: =forfeit_refund_pct
      Gift Registry Layaway:
        reinstatement_allowed: =reinstatement_allowed
        reinstatement_fee: =reinstatement_fee
        pause_allowed: =pause_allowed
        pause_max_days: =pause_max_days
        term_extension_allowed: =term_extension_allowed
        term_extension_days: =term_extension_days
        term_extension_fee: =term_extension_fee
        forfeit_refund_pct: =forfeit_refund_pct
  formula:
    forfeit_refund: round(layaway_msr_paid_to_date * forfeit_refund_pct / 100, 2)
  measures:
  - layaway_msr_paid_to_date
- id: layaway_cancellation_and_refund
  subject:
  - layaway_agreement_cancelled
  - layaway_refund_issued
  rule: An agreement cancelled inside the plan's cancellation window is closed with everything the customer paid returned, the holding fee included on the plans that return it. An agreement is cancelled with everything returned only when the request reaches the desk within the cancellation window in calendar days, counted from the date the agreement was opened. The cancellation window is counted in whole calendar days from the day the agreement was opened, that day counting as day zero, weekends and store holidays included. Cancelled after that window, the plan keeps its restocking share of the merchandise price, capped at the plan's ceiling, and returns the rest of what was paid. The deposit is returned on the plans that make it refundable and kept on the plans that do not, and a specially ordered piece's deposit is never returned on the plan that says so. Refunds are paid on the plan's method within the plan's number of business days, and a refund due as store credit is not paid in cash because the customer would prefer it. The cancellation itself is confirmed by the customer on the layaway service request record, because giving up merchandise they have been paying for is theirs alone to do.
  eligibility:
  - id: cancellation_window
    applies_to:
    - layaway_agreement_cancelled
    kind: time
    condition: An agreement is cancelled with everything returned only when the request reaches the desk within the cancellation window in calendar days, counted from the date the agreement was opened.
    evidence_fields:
    - layaway_agreements.opened_date
    - layaway_agreements.agreement_reference
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - layaway_agreements.agreement_reference
      action_bindings:
        layaway_agreements.agreement_reference: agreement_reference
    temporal_basis:
      clock: frozen_time
      anchor_event: the date the agreement was opened
      anchor_source: layaway_agreements.opened_date
      relation: not_after
      duration_source: variants.cancellation_window_days
      unit: calendar_days
      counting_rule: The cancellation window is counted in whole calendar days from the day the agreement was opened, that day counting as day zero, weekends and store holidays included.
      boundary: inclusive
  params:
    per_tier:
      30-Day Hold Agreement:
        cancellation_window_days: =cancellation_window_days
        restocking_fee_pct: =restocking_fee_pct
        restocking_fee_cap: =restocking_fee_cap
        deposit_refundable: =deposit_refundable
        refund_method: =refund_method
        refund_issued_business_days: =refund_issued_business_days
        service_fee_refundable: =service_fee_refundable
      90-Day Layaway:
        cancellation_window_days: =cancellation_window_days
        restocking_fee_pct: =restocking_fee_pct
        restocking_fee_cap: =restocking_fee_cap
        deposit_refundable: =deposit_refundable
        refund_method: =refund_method
        refund_issued_business_days: =refund_issued_business_days
        service_fee_refundable: =service_fee_refundable
      6-Month Layaway:
        cancellation_window_days: =cancellation_window_days
        restocking_fee_pct: =restocking_fee_pct
        restocking_fee_cap: =restocking_fee_cap
        deposit_refundable: =deposit_refundable
        refund_method: =refund_method
        refund_issued_business_days: =refund_issued_business_days
        service_fee_refundable: =service_fee_refundable
      12-Month Bridal Layaway:
        cancellation_window_days: =cancellation_window_days
        restocking_fee_pct: =restocking_fee_pct
        restocking_fee_cap: =restocking_fee_cap
        deposit_refundable: =deposit_refundable
        refund_method: =refund_method
        refund_issued_business_days: =refund_issued_business_days
        service_fee_refundable: =service_fee_refundable
      Special Order Layaway:
        cancellation_window_days: =cancellation_window_days
        restocking_fee_pct: =restocking_fee_pct
        restocking_fee_cap: =restocking_fee_cap
        deposit_refundable: =deposit_refundable
        refund_method: =refund_method
        refund_issued_business_days: =refund_issued_business_days
        service_fee_refundable: =service_fee_refundable
      Gift Registry Layaway:
        cancellation_window_days: =cancellation_window_days
        restocking_fee_pct: =restocking_fee_pct
        restocking_fee_cap: =restocking_fee_cap
        deposit_refundable: =deposit_refundable
        refund_method: =refund_method
        refund_issued_business_days: =refund_issued_business_days
        service_fee_refundable: =service_fee_refundable
  formula:
    restocking_charge: min(restocking_fee_cap, round(merchandise_total * restocking_fee_pct / 100, 2))
- id: layaway_completion_and_release
  subject:
  - layaway_agreement_completed
  - layaway_item_released
  rule: The merchandise is released to the customer once the balance reaches zero, and identification is checked before it is handed over. A piece leaves the stockroom only while the agreement stands at completed, forfeited or cancelled, and each piece leaves once. Someone other than the customer collects the merchandise only on the plans that allow third-party collection and only on written authority naming them. Paid-up merchandise left uncollected past the plan's holding period carries the plan's storage charge for each started month it stays in the stockroom. A protection plan may be added to the held piece before it is collected on the plans that admit it, and the protection desk writes it on its own terms from the day of collection. Loyalty points on a layaway sale are earned when the agreement is paid up rather than as the payments arrive, so a cancelled agreement leaves no points behind. A storage charge is booked to the agreement as its own entry under the storage fee code for each started month the paid-up merchandise stays in the stockroom.
  eligibility:
  - id: release_state
    applies_to:
    - layaway_item_released
    kind: state
    condition: A piece leaves the stockroom only while the agreement stands at completed, forfeited or cancelled, and each piece leaves once.
    evidence_fields:
    - layaway_agreements.status
    - layaway_agreements.agreement_reference
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - layaway_agreements.agreement_reference
      action_bindings:
        layaway_agreements.agreement_reference: agreement_reference
    state_contract:
      field: layaway_agreements.status
      allowed:
      - completed
      - forfeited
      - cancelled
  params:
    per_tier:
      30-Day Hold Agreement:
        pickup_identification_required: =pickup_identification_required
        third_party_pickup_allowed: =third_party_pickup_allowed
        holding_storage_days_after_payoff: =holding_storage_days_after_payoff
        storage_fee_per_month: =storage_fee_per_month
        protection_plan_may_be_added: =protection_plan_may_be_added
        loyalty_points_on_completion: =loyalty_points_on_completion
      90-Day Layaway:
