- id: layaway_late_payment
  subject:
  - layaway_late_fee_charged
  - layaway_agreement_delinquent
  rule: A scheduled payment not made by its due date carries the plan's late fee once the plan's grace period has run out. A late fee is charged only when the handling date has passed the scheduled payment date this entry answers extended by the grace period of the plan, and equality with that boundary does not yet make the payment late. Grace is counted in whole calendar days from the scheduled payment date, never in twenty-four hour periods, the day of the due date itself counting as day zero, weekends and store holidays included. A late fee is charged only while the agreement stands at current or delinquent. No more late fees are charged over the whole term than the plan's ceiling allows, and the plan that charges no late fee at all charges none however late the payment. An agreement whose oldest unpaid payment reaches the plan's delinquency threshold is marked delinquent, and one that reaches the plan's forfeit threshold has the merchandise taken back.
  eligibility:
  - id: grace_elapsed
    applies_to:
    - layaway_late_fee_charged
    kind: time
    condition: A late fee is charged only when the handling date has passed the scheduled payment date this entry answers extended by the grace period of the plan, and equality with that boundary does not yet make the payment late.
    evidence_fields:
    - layaway_ledger.payment_due_date
    - layaway_ledger.posted_date
    - layaway_ledger.layaway_agreement_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - layaway_ledger.layaway_agreement_id
      action_bindings:
        layaway_ledger.layaway_agreement_id: layaway_agreement_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the scheduled payment date this entry answers
      anchor_source: layaway_ledger.payment_due_date
      relation: not_before
      duration_source: variants.grace_period_days
      unit: calendar_days
      counting_rule: Grace is counted in whole calendar days from the scheduled payment date, never in twenty-four hour periods, the day of the due date itself counting as day zero, weekends and store holidays included.
      boundary: exclusive
  - id: agreement_billing
    applies_to:
    - layaway_late_fee_charged
    - layaway_agreement_delinquent
    kind: state
    condition: A late fee is charged only while the agreement stands at current or delinquent.
    evidence_fields:
    - layaway_agreements.status
    - layaway_agreements.agreement_reference
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - layaway_agreements.agreement_reference
      action_bindings:
        layaway_agreements.agreement_reference: agreement_reference
    state_contract:
      field: layaway_agreements.status
      allowed:
      - current
      - delinquent
  params:
