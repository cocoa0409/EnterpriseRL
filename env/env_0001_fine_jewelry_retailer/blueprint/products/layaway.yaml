  subject:
  - layaway_payment_posted
  - layaway_statement_issued
  rule: Payments fall due on the plan's frequency, each asking for the larger of the plan's minimum payment and the plan's share of the balance at opening. A payment is credited to an agreement only while it stands at opened, current, delinquent or on hold. A statement is produced on the plan's frequency and prints the next scheduled payment date, and the plans that state only on request do so when the customer asks. Automatic payment is available on the plans that offer it, and while it is in force the holding fee is reduced by the plan's automatic payment discount. The agreement may be paid up early on every plan, and the plans that discount early payoff take their discount off the remaining balance. A payment that exceeds the balance is refunded as an overpayment rather than held on the agreement.
  eligibility:
  - id: agreement_open_for_payment
