    posted_date: the date the statement was produced
    amount: the balance shown on the statement, positive
    payment_due_date: the next scheduled payment date printed on it
    statement_number: the reference the statement carries
    billing_period: the period the statement covers
  triggers: []
measures:
- id: layaway_msr_paid_to_date
  window: the whole life of the agreement, from the day it was opened to the handling date
  measure: sum of the absolute amount of layaway_payment_posted entries booked to this agreement
- id: layaway_msr_late_fees_term
  window: the whole life of the agreement, from the day it was opened to the handling date
  measure: count of layaway_late_fee_charged entries booked to this agreement
- id: layaway_msr_open_balance
  window: as at the handling date, with no look-back
  measure: sum of balance_due over every layaway agreement of this customer standing at opened, current, delinquent or on_hold
- id: layaway_msr_open_agreements
  window: as at the handling date, with no look-back
  measure: count of layaway agreements of this customer standing at opened, current, delinquent or on_hold
policies:
- id: layaway_agg_multi_holding
  subject:
  - layaway_agreement_opened
  rule: Each layaway plan caps how many of its own agreements one customer may hold open at a time, and an agreement counts as open while it stands at opened, current, delinquent or on hold. A further agreement is opened for a customer only when no agreement already recorded against the same agreement reference stands at opened, current, delinquent or on hold. An agreement that has completed, forfeited or been cancelled no longer counts, so a customer at the cap may open another once one of theirs closes.
  eligibility:
  - id: no_open_agreement_on_reference
    applies_to:
    - layaway_agreement_opened
    kind: dedup
    condition: A further agreement is opened for a customer only when no agreement already recorded against the same agreement reference stands at opened, current, delinquent or on hold.
    evidence_fields:
    - layaway_agreements.agreement_reference
    - layaway_agreements.status
    - layaway_agreements.customer_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - layaway_agreements.agreement_reference
      action_bindings:
        layaway_agreements.agreement_reference: agreement_reference
    dedup_contract:
      table: layaway_agreements
      mode: separate_record
      object_bindings:
        agreement_reference: agreement_reference
      duplicate_filters:
        status:
        - opened
        - current
        - delinquent
        - on_hold
      distinct_fields:
      - opened_date
      - variant_name
  params:
    max_per_customer: 4
    per_tier:
      30-Day Hold Agreement:
        max_open_agreements_per_customer: =max_open_agreements_per_customer
      90-Day Layaway:
        max_open_agreements_per_customer: =max_open_agreements_per_customer
      6-Month Layaway:
        max_open_agreements_per_customer: =max_open_agreements_per_customer
      12-Month Bridal Layaway:
        max_open_agreements_per_customer: =max_open_agreements_per_customer
      Special Order Layaway:
        max_open_agreements_per_customer: =max_open_agreements_per_customer
      Gift Registry Layaway:
        max_open_agreements_per_customer: =max_open_agreements_per_customer
  measures:
  - layaway_msr_open_agreements
- id: layaway_agg_open_balance_cap
  subject:
  - layaway_agreement_opened
  - layaway_merchandise_posted
  rule: Every layaway plan carries a ceiling on the combined balance the customer may owe across their open agreements, and the ceiling of the plan being written is the one that governs. A new agreement on this plan is opened only when the combined balance across the customer's agreements standing at opened, current, delinquent or on hold, taken as at the handling date, leaves room under the plan's ceiling. The combined balance is read as the balance still owed on each open agreement at the handling date, never as the merchandise prices they were opened at. Where the room left is smaller than the merchandise being held, the sale is written on a plan whose ceiling accommodates it, and where none does the merchandise is taken on other tender or not at all.
  eligibility:
  - id: room_under_open_cap
    applies_to:
    - layaway_agreement_opened
    kind: authorization
    condition: A new agreement on this plan is opened only when the combined balance across the customer's agreements standing at opened, current, delinquent or on hold, taken as at the handling date, leaves room under the plan's ceiling.
    evidence_fields:
    - layaway_agreements.balance_due
    - layaway_agreements.status
    - layaway_agreements.customer_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - layaway_agreements.customer_id
      action_bindings:
        layaway_agreements.customer_id: customer_id
  params:
    per_tier:
      30-Day Hold Agreement:
        aggregate_open_balance_cap: =aggregate_open_balance_cap
        maximum_items_per_agreement: =maximum_items_per_agreement
      90-Day Layaway:
        aggregate_open_balance_cap: =aggregate_open_balance_cap
        maximum_items_per_agreement: =maximum_items_per_agreement
      6-Month Layaway:
        aggregate_open_balance_cap: =aggregate_open_balance_cap
        maximum_items_per_agreement: =maximum_items_per_agreement
      12-Month Bridal Layaway:
        aggregate_open_balance_cap: =aggregate_open_balance_cap
        maximum_items_per_agreement: =maximum_items_per_agreement
      Special Order Layaway:
        aggregate_open_balance_cap: =aggregate_open_balance_cap
        maximum_items_per_agreement: =maximum_items_per_agreement
      Gift Registry Layaway:
        aggregate_open_balance_cap: =aggregate_open_balance_cap
        maximum_items_per_agreement: =maximum_items_per_agreement
  formula:
    when_not: layaway_msr_open_balance + merchandise_total <= aggregate_open_balance_cap
  measures:
  - layaway_msr_open_balance
- id: layaway_opening_terms
  subject:
  - layaway_agreement_opened
  - layaway_agreement_activated
  - layaway_service_fee_charged
  rule: A layaway plan is written only where the merchandise price falls between the smallest and the largest total that plan is offered for. The deposit taken at opening is the larger of the plan's minimum deposit amount and the plan's share of the merchandise price, and the schedule begins only once it has cleared. The plan's fee for holding the merchandise is the larger of its flat fee and its share of the merchandise price, and it is charged at opening rather than spread across the term. A piece ordered in specially takes the special order share down and, on the plans that say so, that deposit is not returned whatever happens afterwards. A gift registry agreement may be paid toward by other people up to the number of contributors the plan allows, and each contribution is credited to the agreement it was made against.
