    - layaway_agreements.agreement_reference
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - layaway_agreements.agreement_reference
      action_bindings:
        layaway_agreements.agreement_reference: agreement_reference
    state_contract:
      field: layaway_agreements.status
      allowed:
      - opened
      - current
      - delinquent
      - on_hold
  params:
