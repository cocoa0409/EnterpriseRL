    - layaway_agreements.agreement_reference
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - layaway_agreements.agreement_reference
      action_bindings:
        layaway_agreements.agreement_reference: agreement_reference
    state_contract:
      field: layaway_agreements.status
      allowed:
      - opened
      - current
      - on_hold
  params:
    per_tier:
      30-Day Hold Agreement:
        item_substitution_allowed: =item_substitution_allowed
        substitution_value_tolerance_pct: =substitution_value_tolerance_pct
