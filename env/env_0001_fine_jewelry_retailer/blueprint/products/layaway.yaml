events:
- type: layaway_agreement_opened
  target: layaway_agreements
  mutation: create
  meaning: a layaway agreement is opened at the counter and the merchandise is set aside
  grain: one row per layaway agreement opened
  fields:
    customer_id: the customer opening the agreement
    variant_name: the layaway plan taken
    status: the agreement opens at opened
    agreement_reference: the reference the customer is given
    item_sku: the piece being held
    item_description: how the piece reads on the agreement
    sales_receipt_number: the till transaction the agreement was opened on
    store_code: the store holding the merchandise
    merchandise_total: the pre-tax price of the held merchandise
    deposit_amount: what the customer put down
    opened_date: the date the agreement was opened
    final_payment_due_date: the date it must be paid up by
    payment_frequency: how often a payment falls due
    registry_reference: the gift registry it belongs to, where it belongs to one
  triggers:
  - event: layaway:layaway_merchandise_posted
    map:
      layaway_agreement_id: layaway_agreement_id
      customer_id: customer_id
      item_sku: item_sku
  - event: layaway:layaway_item_reserved
    map:
      layaway_agreement_id: layaway_agreement_id
      customer_id: customer_id
      item_sku: item_sku
- type: layaway_agreement_activated
  target: layaway_agreements
  mutation:
    transition:
      from: opened
      to: current
  meaning: the deposit clears and the payment schedule begins
  grain: one row per agreement whose schedule began
  fields:
    status: the agreement moves to current
    first_payment_date: the date the first scheduled payment falls due
    scheduled_payment_amount: what each scheduled payment asks for
    service_fee_amount: the fee charged for holding the merchandise
  triggers: []
- type: layaway_agreement_delinquent
  target: layaway_agreements
  mutation:
    transition:
      from: current
      to: delinquent
  meaning: a scheduled payment stays unpaid past the delinquency threshold
  grain: one row per agreement falling delinquent
  fields:
    status: the agreement moves to delinquent
    days_past_due: how far past due the oldest unpaid payment is
  triggers:
  - event: layaway:layaway_late_fee_charged
    map:
      layaway_agreement_id: layaway_agreement_id
      customer_id: customer_id
      days_past_due: days_past_due
- type: layaway_agreement_brought_current
  target: layaway_agreements
  mutation:
    transition:
      from: delinquent
      to: current
  meaning: the arrears are cleared and the agreement is brought current again
  grain: one row per agreement brought current
  fields:
    status: the agreement returns to current
    days_past_due: reset to zero once the arrears are cleared
    final_payment_due_date: the date the agreement must now be paid up by
  triggers: []
- type: layaway_agreement_paused
  target: layaway_agreements
  mutation:
    transition:
      from: current
      to: on_hold
  meaning: payments are paused for an agreed spell
  grain: one row per pause agreed on one agreement
  fields:
    status: the agreement moves to on hold
    final_payment_due_date: the date the agreement must be paid up by after the pause
  triggers: []
- type: layaway_agreement_resumed
  target: layaway_agreements
  mutation:
    transition:
      from: on_hold
      to: current
  meaning: the pause ends and the payment schedule resumes
  grain: one row per pause lifted on one agreement
  fields:
    status: the agreement returns to current
    scheduled_payment_amount: what each payment now asks for
    final_payment_due_date: the date the agreement must be paid up by
  triggers: []
- type: layaway_agreement_completed
  target: layaway_agreements
  mutation:
    transition:
      from: current
      to: completed
  meaning: the balance reaches zero and the merchandise is released to the customer
  grain: one row per agreement paid up
  fields:
    status: the agreement closes as completed
    completed_date: the date it was paid up
    closed_date: the date the agreement closed
    balance_due: zero, because the agreement is paid up
  triggers:
  - event: layaway:layaway_item_released
    map:
      layaway_agreement_id: layaway_agreement_id
      customer_id: customer_id
      item_sku: item_sku
- type: layaway_agreement_forfeited
  target: layaway_agreements
  mutation:
    transition:
      from: delinquent
      to: forfeited
  meaning: the arrears reach the forfeit threshold and the merchandise is taken back
  grain: one row per agreement forfeited
  fields:
    status: the agreement forfeits
    closed_date: the date the merchandise was taken back
    days_past_due: how far past due the agreement had run
  triggers:
  - event: layaway:layaway_item_released
    map:
      layaway_agreement_id: layaway_agreement_id
      customer_id: customer_id
      item_sku: item_sku
- type: layaway_agreement_cancelled
  target: layaway_agreements
  mutation:
    transition:
    - from: opened
      to: cancelled
    - from: current
      to: cancelled
    - from: delinquent
      to: cancelled
    - from: on_hold
      to: cancelled
  meaning: the customer cancels the agreement and the merchandise goes back to stock
  grain: one row per agreement cancelled
  fields:
    status: the agreement is cancelled
    closed_date: the date the cancellation took effect
  triggers:
  - event: layaway:layaway_refund_issued
    map:
      layaway_agreement_id: layaway_agreement_id
      customer_id: customer_id
      refund_reason_code: cancellation_refund
- type: layaway_agreement_updated
  target: layaway_agreements
  mutation: update
  meaning: a detail of a running agreement is changed without moving its lifecycle state
  grain: one row per change made to one agreement
  fields:
    item_sku: the piece now being held
    item_description: how the held piece reads
    scheduled_payment_amount: what each scheduled payment now asks for
    payment_frequency: how often a payment now falls due
    final_payment_due_date: the date the agreement must now be paid up by
    registry_reference: the gift registry it belongs to
  triggers: []
- type: layaway_merchandise_posted
  target: layaway_ledger
  meaning: the held merchandise is booked as what the customer will owe
  grain: one row per merchandise line booked to one agreement
  distinguish_by:
  - item_sku
  - sales_receipt_number
  - posted_date
  fields:
    layaway_agreement_id: the agreement charged
    customer_id: the customer who holds it
    event_type: the family this entry belongs to
    posted_date: the date the merchandise was booked
    amount: the merchandise price, positive
    item_sku: the piece booked
    sales_receipt_number: the till transaction it was rung on
    billing_period: the period the charge is accounted to
  account: layaway_balance
  direction: in
  triggers: []
- type: layaway_service_fee_charged
  target: layaway_ledger
  meaning: the plan's fee for holding the merchandise is charged
  grain: one row per holding fee charged on one agreement
  distinguish_by:
  - posted_date
  - amount
  fields:
    layaway_agreement_id: the agreement charged
    customer_id: the customer who holds it
    event_type: the family this entry belongs to
    posted_date: the date the fee was charged
    amount: the fee, positive
    fee_code: the holding fee line
    billing_period: the period the fee is accounted to
  account: layaway_balance
  direction: in
  triggers: []
- type: layaway_late_fee_charged
  target: layaway_ledger
  meaning: a fee is charged because a scheduled payment was late
  grain: one row per late fee charged for one missed scheduled payment
  distinguish_by:
  - payment_due_date
  - posted_date
  fields:
    layaway_agreement_id: the agreement charged
    customer_id: the customer who holds it
    event_type: the family this entry belongs to
    posted_date: the date the fee was charged
    amount: the fee, positive
    fee_code: the late payment line
    payment_due_date: the scheduled payment date that was missed
    days_past_due: how far past due it was
    billing_period: the period the fee is accounted to
  account: layaway_balance
  direction: in
  triggers: []
- type: layaway_payment_posted
  target: layaway_ledger
  meaning: a payment toward the agreement is credited
  grain: one row per payment credited to one agreement
  distinguish_by:
  - posted_date
  - amount
  - payment_channel
  fields:
    layaway_agreement_id: the agreement paid
    customer_id: the customer who paid
    event_type: the family this entry belongs to
    posted_date: the date the payment was credited
    amount: the payment, negative
    payment_channel: how the money arrived
    payment_due_date: the scheduled payment it answers
    sales_receipt_number: the till transaction the payment was rung on
    statement_number: the statement it answers
    billing_period: the period the payment is accounted to
  account: layaway_balance
  direction: out
  triggers:
  - event: circle:circle_points_accrued
    map:
      customer_id: customer_id
      qualifying_spend: amount
      sales_receipt_number: sales_receipt_number
- type: layaway_refund_issued
  target: layaway_ledger
  meaning: money already paid on the agreement is returned to the customer
  grain: one row per refund paid against one agreement
  distinguish_by:
  - refund_reason_code
  - source_entry_id
  - posted_date
  fields:
    layaway_agreement_id: the agreement refunded
    customer_id: the customer refunded
    event_type: the family this entry belongs to
    posted_date: the date the refund was paid
    amount: the refund, negative
    refund_reason_code: why the money was returned
    source_entry_id: the payment entry being returned
    billing_period: the period the refund is accounted to
  account: layaway_balance
  direction: out
  triggers: []
- type: layaway_item_reserved
  target: layaway_ledger
  meaning: a piece is set aside in the stockroom under the agreement
  grain: one row per piece set aside under one agreement
  distinguish_by:
  - item_sku
  - posted_date
  fields:
    layaway_agreement_id: the agreement holding the piece
    customer_id: the customer it is held for
    event_type: the family this entry belongs to
    posted_date: the date the piece was set aside
    amount: one piece set aside, positive
    item_sku: the piece set aside
    billing_period: the period it is accounted to
  account: merchandise_reserve
  direction: in
  triggers: []
- type: layaway_item_released
  target: layaway_ledger
  meaning: a piece leaves the stockroom, either to the customer or back to stock
  grain: one row per piece leaving the stockroom under one agreement
  distinguish_by:
  - item_sku
  - posted_date
  fields:
    layaway_agreement_id: the agreement the piece was held under
    customer_id: the customer it was held for
    event_type: the family this entry belongs to
    posted_date: the date the piece left the stockroom
    amount: one piece released, negative
    item_sku: the piece released
    billing_period: the period it is accounted to
  account: merchandise_reserve
  direction: out
  triggers: []
- type: layaway_statement_issued
  target: layaway_ledger
  meaning: a statement of the agreement is produced for the customer
  grain: one row per statement produced on one agreement
  distinguish_by:
