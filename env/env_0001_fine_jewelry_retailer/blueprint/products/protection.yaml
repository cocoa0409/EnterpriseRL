- id: protection_expiry_and_renewal
  subject:
  - protection_plan_expired
  - protection_benefit_exhausted
  - protection_plan_details_updated
  - protection_plan_declined
  rule: Coverage that runs to a fixed term expires on its expiry date, and coverage written as lifetime runs for as long as the customer owns the piece and never expires of itself. Coverage that may be renewed is renewed only inside the renewal window before expiry, and the renewed premium carries the coverage's uplift. A plan is expired, and its closing date recorded, only while it stands at active, inspection overdue, suspended or exhausted. A plan whose allowance has been consumed is recorded as exhausted rather than expired, and it still expires on its own expiry date when the term runs out. Once a plan has expired it answers for nothing, including a loss that happened before expiry but was reported after it, and the customer is directed to fresh coverage where the piece still qualifies. Claim documentation is retained for the years the coverage sets, counted from the date of the settlement or the refusal.
  eligibility:
  - id: expirable_state
    applies_to:
    - protection_plan_expired
