- id: protection_cancellation_refund
  subject:
  - protection_plan_cancelled
  - protection_premium_refunded
  rule: A plan cancelled inside the coverage's full-refund window is refunded in whole, and the cancellation takes effect on the day the customer confirms it. A merchandise protection plan is refunded in whole only when the cancellation reaches the desk within the full-refund window in calendar days, counted from the date the plan was bought. The full-refund window is counted in whole calendar days from the day the plan was bought, that day counting as day zero, weekends and store holidays included, and part days are never rounded up. After that window the coverage that prorates returns the premium in proportion to the months of the term not yet run, less the coverage's administration fee, and the coverage that does not prorate returns nothing. A plan that has already settled a claim is not refunded at all, whatever window it is cancelled in, because the coverage has already answered. The cancellation itself is confirmed by the customer on the protection service request record, because ending coverage they paid for is theirs alone to do.
  eligibility:
  - id: full_refund_window
    applies_to:
    - protection_premium_refunded
    kind: time
    condition: A merchandise protection plan is refunded in whole only when the cancellation reaches the desk within the full-refund window in calendar days, counted from the date the plan was bought.
    evidence_fields:
    - protection_plans.purchased_date
    - protection_plans.protection_plan_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - protection_plans.protection_plan_id
      action_bindings:
        protection_plans.protection_plan_id: protection_plan_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the date the plan was bought
      anchor_source: protection_plans.purchased_date
      relation: not_after
      duration_source: variants.cancellation_refund_full_window_days
      unit: calendar_days
      counting_rule: The full-refund window is counted in whole calendar days from the day the plan was bought, that day counting as day zero, weekends and store holidays included, and part days are never rounded up.
      boundary: inclusive
  params:
    per_tier:
