- id: protection_claim_settlement
  subject:
  - protection_claim_settled
  rule: An accepted claim is settled at the value the coverage sets, which is either what the piece originally sold for or what it would cost to replace today, and each coverage names which of the two it uses. The settled value is reduced by the coverage's annual depreciation for each whole coverage year elapsed since the piece was sold, and the result is capped at the coverage's share of the item value recorded at purchase. The customer pays the coverage's deductible on each accepted claim before the settlement is released, and the deductible is recorded against the settlement rather than netted silently out of it. A settlement is made only when the plan's remaining allowance covers it; where the allowance is short the claim is settled in part to the allowance remaining and the shortfall is recorded, not carried forward. A settlement is made only when no settlement already stands against that same claim reference. No more claims are settled in a rolling twelve months than the coverage's cap allows, and a further claim inside the coverage's minimum interval between settlements is refused rather than queued. Where the coverage answers by repairing first, the piece goes to the workshop on a bench work order and the settlement is recorded against that work order; where it answers by replacing, a like piece is issued; where it answers in cash, the money is paid to the customer.
  eligibility:
  - id: one_settlement_per_claim
    applies_to:
    - protection_claim_settled
    kind: dedup
    condition: A settlement is made only when no settlement already stands against that same claim reference.
