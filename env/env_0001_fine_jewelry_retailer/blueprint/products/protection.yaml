- id: protection_allowance_grant
  subject:
  - protection_allowance_granted
  - protection_allowance_reinstated
  rule: The benefit allowance is granted when coverage comes into force, in the amount the coverage sets for a coverage year. On the coverage that reinstates annually the allowance is granted afresh on each anniversary of the effective date, and any allowance unused in the year just ended does not carry forward. An allowance grant or reinstatement is booked only while the plan stands at active, inspection overdue or exhausted, and never against a plan that has closed. The lifetime allowance is a separate ceiling that no amount of annual reinstatement passes, and once it is reached the plan is recorded as exhausted for good. Where the coverage does not reinstate, the allowance granted at the start is all the plan ever has.
  eligibility:
  - id: grantable_state
    applies_to:
    - protection_allowance_granted
    - protection_allowance_reinstated
    kind: state
    condition: An allowance grant or reinstatement is booked only while the plan stands at active, inspection overdue or exhausted, and never against a plan that has closed.
    evidence_fields:
    - protection_plans.status
