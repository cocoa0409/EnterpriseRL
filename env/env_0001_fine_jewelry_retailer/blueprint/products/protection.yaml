- id: protection_claim_intake
  subject:
  - protection_claim_filed
  - protection_claim_denied
  rule: A claim is answered for only where the peril claimed is among the perils the coverage answers for, and a peril the coverage lists as excluded is never answered for however sympathetic the circumstances. A claim is opened only while the covering plan stands at active or inspection overdue, and a claim reported while coverage is suspended is taken but not settled until coverage is put right. A theft claim is settled only once a police report reference has been recorded against the claim, and the customer's account of the theft does not stand in for that report. The customer must give their account of the loss within the proof-of-loss window the coverage sets, counted from the date the customer first reported the loss to the chain. The proof-of-loss window is counted in whole calendar days from the day the loss was first reported, that day counting as day zero, and where the last day falls on a day the store does not open the window runs to the next day the store opens. Where the peril is not covered the claim is refused under the excluded peril ground; where the coverage had lapsed for want of inspection it is refused under the inspection lapse ground; where the term had run out it is refused under the outside term ground; and exactly one ground is recorded.
  eligibility:
  - id: coverage_in_force
    applies_to:
    - protection_claim_filed
    kind: state
    condition: A claim is opened only while the covering plan stands at active or inspection overdue, and a claim reported while coverage is suspended is taken but not settled until coverage is put right.
    evidence_fields:
    - protection_plans.status
    - protection_plans.protection_plan_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - protection_plans.protection_plan_id
      action_bindings:
        protection_plans.protection_plan_id: protection_plan_id
    state_contract:
      field: protection_plans.status
      allowed:
      - active
      - inspection_overdue
  - id: proof_of_loss_window
    applies_to:
    - protection_claim_filed
    kind: time
    condition: The customer must give their account of the loss within the proof-of-loss window the coverage sets, counted from the date the customer first reported the loss to the chain.
    evidence_fields:
    - protection_ledger.posted_date
    - protection_ledger.claim_reference
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - protection_ledger.claim_reference
      action_bindings:
        protection_ledger.claim_reference: claim_reference
    temporal_basis:
      clock: frozen_time
      anchor_event: the date the customer first reported the loss to the chain
      anchor_source: protection_ledger.posted_date
      relation: not_after
      duration_source: variants.proof_of_loss_required_days
      unit: calendar_days
      counting_rule: The proof-of-loss window is counted in whole calendar days from the day the loss was first reported, that day counting as day zero, and where the last day falls on a day the store does not open the window runs to the next day the store opens.
      boundary: inclusive
  params:
    per_tier:
      Manufacturer Limited Warranty:
        covered_perils: =covered_perils
        excluded_perils: =excluded_perils
        stone_loss_covered: =stone_loss_covered
        theft_covered: =theft_covered
        mysterious_disappearance_covered: =mysterious_disappearance_covered
        proof_of_loss_required_days: =proof_of_loss_required_days
        police_report_required_for_theft: =police_report_required_for_theft
      Belrose Care Plan 2-Year:
        covered_perils: =covered_perils
        excluded_perils: =excluded_perils
        stone_loss_covered: =stone_loss_covered
        theft_covered: =theft_covered
        mysterious_disappearance_covered: =mysterious_disappearance_covered
        proof_of_loss_required_days: =proof_of_loss_required_days
        police_report_required_for_theft: =police_report_required_for_theft
      Belrose Care Plan 3-Year:
        covered_perils: =covered_perils
        excluded_perils: =excluded_perils
        stone_loss_covered: =stone_loss_covered
        theft_covered: =theft_covered
        mysterious_disappearance_covered: =mysterious_disappearance_covered
        proof_of_loss_required_days: =proof_of_loss_required_days
        police_report_required_for_theft: =police_report_required_for_theft
      Belrose Care Plan 5-Year:
