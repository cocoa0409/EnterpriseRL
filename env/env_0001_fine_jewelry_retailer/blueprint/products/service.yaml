- id: service_authorization
  subject:
  - service_work_authorized
  - service_labor_charged
  - service_parts_charged
  rule: No bench work begins above the level's authorisation threshold until the customer has authorised it, and the authorisation names a ceiling the bench may not pass. Bench labour is charged, and the piece worked on, only while the work order stands in the workshop or has come back to the workshop under the guarantee. Above the level's written authorisation threshold the authorisation is taken in writing on the workshop service request record, and a verbal agreement over the telephone does not stand in for it. Where the bench finds during the work that the ceiling will be passed, it stops and a fresh authorisation is taken for the higher figure; it never works past the ceiling and bills the difference afterwards. A deposit is taken before work starts at the levels that require one, calculated as the level's share of the authorised total, and it is credited against the final balance. The authorisation itself is given by the customer on the workshop service request record, because committing to pay for work on their own property is theirs alone to do.
  eligibility:
  - id: order_in_workshop
    applies_to:
    - service_labor_charged
    - service_parts_charged
    kind: state
    condition: Bench labour is charged, and the piece worked on, only while the work order stands in the workshop or has come back to the workshop under the guarantee.
    evidence_fields:
    - service_orders.status
    - service_orders.work_order_reference
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - service_orders.work_order_reference
      action_bindings:
        service_orders.work_order_reference: work_order_reference
    state_contract:
      field: service_orders.status
      allowed:
      - in_workshop
      - ready_for_pickup
  - id: written_authorization_above_threshold
    applies_to:
    - service_work_authorized
    kind: authorization
    condition: Above the level's written authorisation threshold the authorisation is taken in writing on the workshop service request record, and a verbal agreement over the telephone does not stand in for it.
    evidence_fields:
    - service_intake.authorized_amount
    - service_intake.request_status
    - service_intake.service_order_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - service_intake.service_order_id
      action_bindings:
        service_intake.service_order_id: service_order_id
  params:
    per_tier:
      Standard Bench Service:
        authorization_required_above_amount: =authorization_required_above_amount
        written_authorization_required_above_amount: =written_authorization_required_above_amount
        deposit_required_pct: =deposit_required_pct
        deposit_required_above_amount: =deposit_required_above_amount
      Priority Bench Service:
        authorization_required_above_amount: =authorization_required_above_amount
        written_authorization_required_above_amount: =written_authorization_required_above_amount
        deposit_required_pct: =deposit_required_pct
        deposit_required_above_amount: =deposit_required_above_amount
      Master Jeweler Service:
        authorization_required_above_amount: =authorization_required_above_amount
        written_authorization_required_above_amount: =written_authorization_required_above_amount
        deposit_required_pct: =deposit_required_pct
        deposit_required_above_amount: =deposit_required_above_amount
      Heritage Restoration Service:
        authorization_required_above_amount: =authorization_required_above_amount
        written_authorization_required_above_amount: =written_authorization_required_above_amount
        deposit_required_pct: =deposit_required_pct
        deposit_required_above_amount: =deposit_required_above_amount
      Designer Authorized Repair Service:
        authorization_required_above_amount: =authorization_required_above_amount
        written_authorization_required_above_amount: =written_authorization_required_above_amount
        deposit_required_pct: =deposit_required_pct
