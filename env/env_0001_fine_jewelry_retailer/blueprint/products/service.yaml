  rule: Expedited handling shortens the promised date to the level's rush turnaround and carries the level's surcharge on the authorised bench total. Expedited handling is promised only where the workshop has at least the level's minimum notice in hours before the piece is needed, and a shorter notice is refused rather than promised and missed. Where the level carries no surcharge for expedited handling, none is charged and the shorter turnaround is simply what that level runs at. An out-of-hours finish carries the level's overtime charge on top of the surcharge, and it is charged only where the bench was actually held open. Same-day service is offered only at the levels that run it, and only for tasks the bench can complete in one sitting.
