        stone_release_required_above_value: =stone_release_required_above_value
        antique_restoration_admitted: =antique_restoration_admitted
        designer_authorization_required: =designer_authorization_required
        photo_documentation_required: =photo_documentation_required
        care_custody_cover_cap: =care_custody_cover_cap
        weekend_intake_available: =weekend_intake_available
        technician_certification_required: =technician_certification_required
  formula:
    when_not: declared_value > maximum_declared_value
- id: service_estimate_pricing
  subject:
  - service_estimate_prepared
  - service_authorization_requested
  - service_labor_charged
  - service_parts_charged
  rule: 'The bench prices the work from the level''s own schedule: labour at the level''s hourly rate with a floor at the level''s minimum labour charge, and each named task at the charge the level lists for it. Stone setting is priced from the level''s carat ladder by the weight of the stone set, and the band a stone falls in is decided by its recorded weight rather than by its appearance. Bench labour carries the level''s metal surcharge for the metal the piece is confirmed to be in at intake, and the surcharge is applied to labour alone and never to parts. An estimate is prepared without charge at the levels that offer it free, and where a charge applies it is credited against the work at the levels that credit it and kept where they do not. An estimate is put to the customer only while the order stands at estimated or already awaiting authorization. An estimate stays good for the level''s validity window, and once it has run out the piece is repriced rather than worked to the old figure. An estimate charge is booked to the order as its own priced line under the estimate charge code, so it can be told apart from the bench work it may later be credited against.'
  eligibility:
  - id: estimate_stage
    applies_to:
    - service_authorization_requested
    kind: state
    condition: An estimate is put to the customer only while the order stands at estimated or already awaiting authorization.
    evidence_fields:
    - service_orders.status
    - service_orders.work_order_reference
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - service_orders.work_order_reference
      action_bindings:
        service_orders.work_order_reference: work_order_reference
    state_contract:
      field: service_orders.status
      allowed:
      - estimated
      - awaiting_authorization
  params:
    per_tier:
      Standard Bench Service:
        hourly_bench_rate: =hourly_bench_rate
        minimum_labor_charge: =minimum_labor_charge
        sizing_up_charge_per_size: =sizing_up_charge_per_size
        sizing_down_charge: =sizing_down_charge
        prong_retip_charge_per_prong: =prong_retip_charge_per_prong
        stone_tightening_charge: =stone_tightening_charge
        chain_solder_charge: =chain_solder_charge
        clasp_replacement_charge: =clasp_replacement_charge
        rhodium_plating_charge: =rhodium_plating_charge
        polish_refinish_charge: =polish_refinish_charge
        engraving_charge_per_character: =engraving_charge_per_character
        restringing_charge_per_inch: =restringing_charge_per_inch
        stone_setting_charge_ladder: =stone_setting_charge_ladder
        metal_surcharge_pct_by_metal: =metal_surcharge_pct_by_metal
        estimate_validity_days: =estimate_validity_days
        free_estimate: =free_estimate
        estimate_fee: =estimate_fee
        estimate_fee_credited_to_work: =estimate_fee_credited_to_work
      Priority Bench Service:
        hourly_bench_rate: =hourly_bench_rate
        minimum_labor_charge: =minimum_labor_charge
        sizing_up_charge_per_size: =sizing_up_charge_per_size
        sizing_down_charge: =sizing_down_charge
        prong_retip_charge_per_prong: =prong_retip_charge_per_prong
        stone_tightening_charge: =stone_tightening_charge
        chain_solder_charge: =chain_solder_charge
        clasp_replacement_charge: =clasp_replacement_charge
        rhodium_plating_charge: =rhodium_plating_charge
        polish_refinish_charge: =polish_refinish_charge
        engraving_charge_per_character: =engraving_charge_per_character
        restringing_charge_per_inch: =restringing_charge_per_inch
