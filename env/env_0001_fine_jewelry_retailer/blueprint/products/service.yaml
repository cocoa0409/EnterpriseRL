- id: service_settlement
  subject:
  - service_payment_received
  - service_shipping_charged
  rule: Payment is taken at the counter when the piece is collected, or earlier as a deposit where the level requires one, and the balance on the order is what is charged less what has been paid or taken off. A payment is taken against a work order only while that order stands in the workshop, ready for pickup, returned unrepaired or already delivered. Insured shipping is charged per leg at the level's rate, and the declared value shipped never exceeds the level's shipping insurance ceiling. Where the piece is shipped at a declared value above the ceiling the desk does not ship it and the customer collects in person instead. An updated appraisal is prepared with the finished work at the levels that include it, and where it is not included it is charged by the appraisal desk on its own terms.
  eligibility:
  - id: payable_state
    applies_to:
    - service_payment_received
    - service_shipping_charged
    kind: state
    condition: A payment is taken against a work order only while that order stands in the workshop, ready for pickup, returned unrepaired or already delivered.
