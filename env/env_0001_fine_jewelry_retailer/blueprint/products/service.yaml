- id: service_cancellation_and_return
  subject:
  - service_order_cancelled
  - service_work_declined
  - service_deemed_unrepairable
  rule: A work order may be cancelled without charge inside the level's cancellation window in hours counted from the authorisation, and afterwards it carries the level's cancellation charge. A work order is cancelled only while it stands at intake or awaiting authorization; once the bench has begun the order is not cancelled but stopped and priced for what was done. Where the customer declines the estimate the piece is returned untouched and only an estimate charge, where the level charges one, stands against the order. Where the bench finds the piece cannot be repaired as asked, the work stops, nothing is charged for the attempt beyond what was already authorised, and the piece is returned as it came in. The cancellation is confirmed by the customer on the workshop service request record, because calling off work on their own property is theirs alone to do. A cancellation charge and a storage charge are each booked to the order as their own priced line under their own charge code, so a customer who owes both can see which is which.
  eligibility:
  - id: cancellable_state
    applies_to:
