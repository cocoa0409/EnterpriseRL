events:
- type: service_order_opened
  target: service_orders
  mutation: create
  meaning: a piece is taken in over the counter and a bench work order is opened for it
  grain: one row per piece taken in on one work order
  fields:
    customer_id: the customer leaving the piece in
    variant_name: the service level the order runs at
    status: the order opens at intake
    work_order_reference: the reference the customer is given
    item_sku: the piece taken in
    item_description: how the customer described the piece
    item_metal: the metal confirmed at intake
    intake_store_code: the store that took it in
    intake_date: the date it was taken in
    declared_value: the value the piece was taken in at
    rush_requested: whether expedited handling was asked for
    ring_size_from: the size measured at intake
    ring_size_to: the size asked for
    protection_claim_reference: the protection claim the work runs under, where there is one
  triggers: []
- type: service_estimate_prepared
  target: service_orders
  mutation:
    transition:
      from: intake
      to: estimated
  meaning: the bench prices the work and the estimate is recorded on the order
  grain: one row per estimate prepared on one work order
  fields:
    status: the order moves to estimated
    estimate_date: the date the estimate was prepared
    estimated_total: what the estimate came to
    promised_date: the date the piece is promised back
  triggers: []
- type: service_authorization_requested
  target: service_orders
  mutation:
    transition:
      from: estimated
      to: awaiting_authorization
  meaning: the estimate is put to the customer and the order waits on their decision
  grain: one row per estimate put to one customer
  fields:
    status: the order moves to awaiting authorization
    estimated_total: the total put to the customer
  triggers: []
- type: service_work_authorized
  target: service_orders
  mutation:
    transition:
      from: awaiting_authorization
      to: in_workshop
  meaning: the customer authorises the work and the piece goes to the bench
  grain: one row per authorisation given on one work order
  fields:
    status: the order moves into the workshop
    authorized_date: the date the customer authorised the work
    authorized_total: the ceiling the customer authorised
    promised_date: the date the piece is promised back
  triggers:
  - event: service:service_labor_charged
    map:
      service_order_id: service_order_id
- type: service_work_declined
  target: service_orders
  mutation:
    transition:
      from: awaiting_authorization
      to: returned_unrepaired
  meaning: the customer declines the estimate and asks for the piece back untouched
  grain: one row per estimate declined
  fields:
    status: the order moves to returned unrepaired
    closed_date: the date the customer declined
  triggers: []
- type: service_order_cancelled
  target: service_orders
  mutation:
    transition:
    - from: intake
      to: cancelled
    - from: awaiting_authorization
      to: cancelled
  meaning: the order is cancelled before any bench work is carried out
  grain: one row per work order cancelled
  fields:
    status: the order is cancelled
    closed_date: the date the cancellation took effect
  triggers: []
- type: service_work_completed
  target: service_orders
  mutation:
    transition:
      from: in_workshop
      to: ready_for_pickup
  meaning: the bench finishes the work and the piece is ready to be collected
  grain: one row per work order finished at the bench
  fields:
    status: the order moves to ready for pickup
    completed_date: the date the bench finished
    workmanship_guarantee_until: the last day the chain stands behind this workmanship
  triggers:
  - event: service:service_quality_check_logged
    map:
      service_order_id: service_order_id
- type: service_deemed_unrepairable
  target: service_orders
  mutation:
    transition:
      from: in_workshop
      to: returned_unrepaired
  meaning: the bench finds the piece cannot be repaired as asked and the work stops
  grain: one row per work order stopped as unrepairable
  fields:
    status: the order moves to returned unrepaired
    completed_date: the date the bench stopped work
    closed_date: the date the finding was recorded
  triggers: []
- type: service_item_delivered
  target: service_orders
  mutation:
    transition:
    - from: ready_for_pickup
      to: delivered
    - from: returned_unrepaired
      to: delivered
  meaning: the piece is handed back to the customer and the order closes
  grain: one row per piece handed back
  fields:
    status: the order closes as delivered
    delivered_date: the date the piece was handed back
    closed_date: the date the order closed
  triggers: []
- type: service_item_abandoned
  target: service_orders
  mutation:
    transition:
      from: ready_for_pickup
      to: abandoned
  meaning: a finished piece goes uncollected past the abandonment threshold and falls under the chain's lien
  grain: one row per piece treated as abandoned
  fields:
    status: the order closes as abandoned
    closed_date: the date the piece was treated as abandoned
  triggers: []
- type: service_rework_opened
  target: service_orders
  mutation:
    transition:
      from: delivered
      to: in_workshop
  meaning: a delivered piece comes back under the workmanship guarantee and returns to the bench
  grain: one row per return to the bench under the guarantee on one order
  fields:
    status: the order returns to the workshop
    rework_count: how many times this order has now gone back
    promised_date: the date the piece is promised back after the rework
  triggers: []
- type: service_order_details_updated
  target: service_orders
  mutation: update
  meaning: a detail of a running work order is corrected without moving its lifecycle state
  grain: one row per correction made to one work order
  fields:
    item_description: how the piece reads on the order
    item_metal: the metal confirmed on the piece
    declared_value: the value the piece is held at
    ring_size_to: the size asked for
    stone_release_signed: whether the stone release has been signed
    promised_date: the date the piece is promised back
  triggers: []
- type: service_labor_charged
  target: service_ledger
  meaning: bench labour is priced onto the work order
  grain: one row per priced bench task on one work order
  distinguish_by:
  - service_task
  - charge_code
  - posted_date
  - technician_code
  fields:
    service_order_id: the work order charged
    customer_id: the customer who owns the piece
    event_type: the family this entry belongs to
    posted_date: the date the labour was priced
    amount: the labour charge, positive
    charge_code: which priced line this is
    service_task: the bench task carried out
    quantity: how many units of the task
    unit_price: the price of one unit before surcharge
    technician_code: the jeweler who carried out the work
    billing_period: the period the charge is accounted to
  account: work_order_charges
  direction: in
  triggers: []
- type: service_parts_charged
  target: service_ledger
  meaning: a part fitted to the piece is priced onto the work order
  grain: one row per part fitted on one work order
  distinguish_by:
  - charge_code
  - service_task
  - posted_date
  - quantity
  fields:
    service_order_id: the work order charged
    customer_id: the customer who owns the piece
    event_type: the family this entry belongs to
    posted_date: the date the part was priced
    amount: the part charge, positive
    charge_code: which priced line this is
    service_task: the task the part was fitted for
    quantity: how many parts
    unit_price: the price of one part
    billing_period: the period the charge is accounted to
  account: work_order_charges
  direction: in
  triggers: []
- type: service_rush_fee_charged
  target: service_ledger
  meaning: the surcharge for expedited handling is priced onto the work order
  grain: one row per expedited handling surcharge on one work order
  distinguish_by:
  - posted_date
  - amount
  fields:
    service_order_id: the work order charged
    customer_id: the customer who owns the piece
    event_type: the family this entry belongs to
    posted_date: the date the surcharge was priced
    amount: the surcharge, positive
    charge_code: the expedited handling line
    billing_period: the period the charge is accounted to
  account: work_order_charges
  direction: in
  triggers: []
- type: service_shipping_charged
  target: service_ledger
  meaning: insured shipping of the piece is priced onto the work order
  grain: one row per insured shipping leg on one work order
  distinguish_by:
  - posted_date
  - quantity
  - unit_price
  fields:
    service_order_id: the work order charged
    customer_id: the customer who owns the piece
    event_type: the family this entry belongs to
    posted_date: the date the shipping was priced
    amount: the shipping charge, positive
    charge_code: the insured shipping line
    quantity: how many insured legs were shipped
    unit_price: the charge for one leg
    billing_period: the period the charge is accounted to
  account: work_order_charges
  direction: in
  triggers: []
- type: service_payment_received
  target: service_ledger
  meaning: the customer pays toward the work order
  grain: one row per payment taken against one work order
  distinguish_by:
  - posted_date
  - amount
  - payment_channel
  fields:
    service_order_id: the work order paid
    customer_id: the customer who paid
    event_type: the family this entry belongs to
    posted_date: the date the payment was taken
    amount: the payment, negative
    payment_channel: how the money arrived
    billing_period: the period the payment is accounted to
  account: work_order_charges
  direction: out
  triggers:
  - event: circle:circle_points_accrued
    map:
      customer_id: customer_id
      qualifying_spend: amount
- type: service_coverage_applied
  target: service_ledger
  meaning: a protection plan answers for part or all of the work and the amount is taken off the order
  grain: one row per priced line a protection claim answered for
  distinguish_by:
  - protection_claim_reference
  - source_entry_id
  - posted_date
  fields:
    service_order_id: the work order credited
    customer_id: the customer who owns the piece
    event_type: the family this entry belongs to
    posted_date: the date the coverage was applied
    amount: the amount the coverage answered for, negative
    protection_claim_reference: the protection claim that answered
    discount_reason_code: that a protection plan covered it
    source_entry_id: the priced line the coverage answered for
    billing_period: the period it is accounted to
  account: work_order_charges
  direction: out
  triggers:
  - event: protection:protection_claim_settled
    map:
      claim_reference: protection_claim_reference
      customer_id: customer_id
- type: service_goodwill_discount_applied
  target: service_ledger
  meaning: an amount is taken off the work order as goodwill or under a member benefit
  grain: one row per amount taken off one priced line
  distinguish_by:
  - source_entry_id
  - discount_reason_code
  - posted_date
  fields:
    service_order_id: the work order credited
    customer_id: the customer who owns the piece
    event_type: the family this entry belongs to
    posted_date: the date the amount was taken off
    amount: the amount taken off, negative
    discount_reason_code: why the amount was taken off
    source_entry_id: the priced line it was taken off
    billing_period: the period it is accounted to
  account: work_order_charges
  direction: out
  triggers: []
- type: service_quality_check_logged
  target: service_ledger
  meaning: the finished work is checked before the piece is released and the finding is recorded
  grain: one row per check carried out on one work order
  distinguish_by:
  - posted_date
  - technician_code
  fields:
    service_order_id: the work order checked
    customer_id: the customer who owns the piece
    event_type: the family this entry belongs to
    posted_date: the date of the check
    amount: zero, because a check moves no money
    quality_check_result: what the check found
    technician_code: the jeweler who carried out the check
    billing_period: the period the check is accounted to
  triggers: []
measures:
- id: service_msr_open_orders
  window: as at the handling date, with no look-back
  measure: count of service orders of this customer standing at intake, estimated, awaiting_authorization, in_workshop or ready_for_pickup
- id: service_msr_reworks_on_order
  window: the whole life of the work order, from intake to the handling date
  measure: count of service_rework_opened occurrences recorded against this work order
- id: service_msr_days_since_completion
  window: from the completion date on the work order to the handling date
  measure: count of whole calendar days elapsed since the bench finished the work, with no upper bound
- id: service_msr_goodwill_12m
  window: the rolling twelve calendar months ending on the handling date
  measure: count of service_goodwill_discount_applied entries for this customer whose discount_reason_code is goodwill_service_recovery
policies:
- id: service_agg_multi_holding
  subject:
  - service_order_opened
  rule: A customer may have several pieces at the bench at once, but each service level caps how many of its own work orders may run for one customer at a time. A further work order is opened at a service level only when no work order already recorded against the same work order reference stands at intake, estimated, awaiting authorization, in workshop or ready for pickup. Where the cap at the service level is reached the piece is either taken in at another service level that admits it, or held until a running order closes, and the customer is told which of the two applies.
  eligibility:
  - id: no_open_order_on_reference
    applies_to:
    - service_order_opened
    kind: dedup
    condition: A further work order is opened at a service level only when no work order already recorded against the same work order reference stands at intake, estimated, awaiting authorization, in workshop or ready for pickup.
    evidence_fields:
    - service_orders.work_order_reference
    - service_orders.status
    - service_orders.customer_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - service_orders.work_order_reference
      action_bindings:
        service_orders.work_order_reference: work_order_reference
    dedup_contract:
      table: service_orders
      mode: separate_record
      object_bindings:
        work_order_reference: work_order_reference
      duplicate_filters:
        status:
        - intake
        - estimated
        - awaiting_authorization
        - in_workshop
        - ready_for_pickup
      distinct_fields:
      - intake_date
      - variant_name
  params:
    max_per_customer: 8
    per_tier:
      Standard Bench Service:
        max_open_orders_per_customer: =max_open_orders_per_customer
      Priority Bench Service:
        max_open_orders_per_customer: =max_open_orders_per_customer
      Master Jeweler Service:
        max_open_orders_per_customer: =max_open_orders_per_customer
      Heritage Restoration Service:
        max_open_orders_per_customer: =max_open_orders_per_customer
      Designer Authorized Repair Service:
        max_open_orders_per_customer: =max_open_orders_per_customer
      Atelier White-Glove Service:
        max_open_orders_per_customer: =max_open_orders_per_customer
- id: service_agg_order_portfolio
  subject:
  - service_payment_received
  - service_estimate_prepared
  - service_authorization_requested
  rule: Where one customer has several work orders running, each is priced, authorised and delivered on its own and no balance is moved between them. The bench queue is worked in the order the service levels rank, so a piece at a higher-ranked level overtakes one taken in earlier at a lower-ranked level. A payment taken at the counter is applied to the work order it is presented against and never spread across the customer's other running orders. Where the customer asks for several pieces to be finished together, the promised date of the set is the latest promised date among them, and each order keeps its own charges.
  eligibility: []
  params:
    per_tier:
      Standard Bench Service:
        queue_priority_rank: =queue_priority_rank
        turnaround_target_business_days: =turnaround_target_business_days
        rush_turnaround_business_days: =rush_turnaround_business_days
      Priority Bench Service:
        queue_priority_rank: =queue_priority_rank
        turnaround_target_business_days: =turnaround_target_business_days
        rush_turnaround_business_days: =rush_turnaround_business_days
      Master Jeweler Service:
        queue_priority_rank: =queue_priority_rank
        turnaround_target_business_days: =turnaround_target_business_days
        rush_turnaround_business_days: =rush_turnaround_business_days
      Heritage Restoration Service:
        queue_priority_rank: =queue_priority_rank
        turnaround_target_business_days: =turnaround_target_business_days
        rush_turnaround_business_days: =rush_turnaround_business_days
      Designer Authorized Repair Service:
        queue_priority_rank: =queue_priority_rank
        turnaround_target_business_days: =turnaround_target_business_days
        rush_turnaround_business_days: =rush_turnaround_business_days
      Atelier White-Glove Service:
        queue_priority_rank: =queue_priority_rank
        turnaround_target_business_days: =turnaround_target_business_days
        rush_turnaround_business_days: =rush_turnaround_business_days
  measures:
  - service_msr_open_orders
- id: service_intake_admission
  subject:
  - service_order_opened
  - service_order_details_updated
  rule: A piece is taken in only at a service level whose ceiling on declared value covers what the piece is worth, and the declared value is what the chain answers for while the piece is in its care. A piece whose declared value exceeds the level's stone release threshold is worked on only once the customer has signed the stone release, and their saying they are happy for the bench to proceed is not the signed release. Antique and estate pieces are taken in only at the levels that admit restoration work, and a designer's piece is worked on only where the designer's written authorisation is already on file at the levels that require it. Where a piece is worth more than the highest ceiling any level carries, the desk does not take it in and the customer is directed to the chain's specialist intake by appointment. The piece is photographed at intake at the levels that require it, and where the level requires photographs and none were taken the order is not released until they are.
  eligibility:
  - id: stone_release_on_file
    applies_to:
    - service_order_opened
    kind: authorization
    condition: A piece whose declared value exceeds the level's stone release threshold is worked on only once the customer has signed the stone release, and their saying they are happy for the bench to proceed is not the signed release.
    evidence_fields:
    - service_orders.stone_release_signed
    - service_orders.declared_value
    - service_orders.work_order_reference
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - service_orders.work_order_reference
      action_bindings:
        service_orders.work_order_reference: work_order_reference
  params:
    per_tier:
      Standard Bench Service:
        maximum_declared_value: =maximum_declared_value
        stone_release_required_above_value: =stone_release_required_above_value
        antique_restoration_admitted: =antique_restoration_admitted
        designer_authorization_required: =designer_authorization_required
        photo_documentation_required: =photo_documentation_required
        care_custody_cover_cap: =care_custody_cover_cap
        weekend_intake_available: =weekend_intake_available
        technician_certification_required: =technician_certification_required
      Priority Bench Service:
        maximum_declared_value: =maximum_declared_value
        stone_release_required_above_value: =stone_release_required_above_value
        antique_restoration_admitted: =antique_restoration_admitted
        designer_authorization_required: =designer_authorization_required
        photo_documentation_required: =photo_documentation_required
        care_custody_cover_cap: =care_custody_cover_cap
        weekend_intake_available: =weekend_intake_available
        technician_certification_required: =technician_certification_required
      Master Jeweler Service:
        maximum_declared_value: =maximum_declared_value
        stone_release_required_above_value: =stone_release_required_above_value
        antique_restoration_admitted: =antique_restoration_admitted
        designer_authorization_required: =designer_authorization_required
        photo_documentation_required: =photo_documentation_required
        care_custody_cover_cap: =care_custody_cover_cap
        weekend_intake_available: =weekend_intake_available
