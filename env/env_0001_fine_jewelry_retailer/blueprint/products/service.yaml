- id: service_protection_coverage
  subject:
  - service_coverage_applied
  rule: Work carried out under an accepted protection claim is taken off the work order rather than billed to the customer, and the amount taken off is recorded against the claim it was answered under. Coverage is applied only against the priced line it answers for, identified by the claim reference and the work order entry the claim was accepted for. Coverage is applied only at the service levels that admit protection work, and where the level does not admit it the piece is moved to a level that does before the work begins. Anything the coverage does not answer for stays on the work order as the customer's own balance, and the deductible under the plan is collected at the counter rather than netted off here. Where no protection claim has been accepted the desk does not take the amount off in anticipation of one, because the claim decision is the protection desk's to make and not this one's.
  eligibility:
  - id: coverage_bound_to_claim
    applies_to:
    - service_coverage_applied
    kind: authorization
    condition: Coverage is applied only against the priced line it answers for, identified by the claim reference and the work order entry the claim was accepted for.
    evidence_fields:
    - service_ledger.protection_claim_reference
    - service_ledger.source_entry_id
    - service_ledger.service_order_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - service_ledger.protection_claim_reference
        - service_ledger.source_entry_id
      action_bindings:
        service_ledger.protection_claim_reference: protection_claim_reference
        service_ledger.source_entry_id: source_entry_id
  params:
