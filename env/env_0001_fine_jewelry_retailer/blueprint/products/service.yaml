- id: service_workmanship_guarantee
  subject:
  - service_rework_opened
  rule: The chain stands behind its own workmanship for the months the service level sets, counted from the day the piece was handed back. A piece is taken back under the guarantee only when the handling date has not passed the guarantee period in whole calendar months counted from the date the piece was handed back to the customer. Guarantee months are counted as whole calendar months from the day of delivery, and where the anniversary day does not exist in the closing month the boundary falls on the last day of that month. Rework inside the guarantee is carried out without charge at the levels that carry it free, and one order goes back to the bench no more times than the level allows. The guarantee answers for the chain's own workmanship and not for fresh damage, ordinary wear or work another workshop has since done on the piece, and where the bench finds one of those the rework is priced as new work. Where the rework limit is reached the desk does not send the piece back again under the guarantee, and the customer is offered a fresh estimate instead.
  eligibility:
  - id: within_guarantee_period
    applies_to:
    - service_rework_opened
    kind: time
    condition: A piece is taken back under the guarantee only when the handling date has not passed the guarantee period in whole calendar months counted from the date the piece was handed back to the customer.
    evidence_fields:
    - service_orders.delivered_date
    - service_orders.work_order_reference
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - service_orders.work_order_reference
      action_bindings:
        service_orders.work_order_reference: work_order_reference
    temporal_basis:
      clock: frozen_time
      anchor_event: the date the piece was handed back to the customer
      anchor_source: service_orders.delivered_date
      relation: not_after
      duration_source: variants.workmanship_guarantee_months
      unit: calendar_months
      counting_rule: Guarantee months are counted as whole calendar months from the day of delivery, and where the anniversary day does not exist in the closing month the boundary falls on the last day of that month.
      boundary: inclusive
  params:
    per_tier:
      Standard Bench Service:
        workmanship_guarantee_months: =workmanship_guarantee_months
        rework_free_within_guarantee: =rework_free_within_guarantee
        rework_limit_per_order: =rework_limit_per_order
      Priority Bench Service:
        workmanship_guarantee_months: =workmanship_guarantee_months
        rework_free_within_guarantee: =rework_free_within_guarantee
        rework_limit_per_order: =rework_limit_per_order
      Master Jeweler Service:
        workmanship_guarantee_months: =workmanship_guarantee_months
        rework_free_within_guarantee: =rework_free_within_guarantee
        rework_limit_per_order: =rework_limit_per_order
      Heritage Restoration Service:
        workmanship_guarantee_months: =workmanship_guarantee_months
        rework_free_within_guarantee: =rework_free_within_guarantee
        rework_limit_per_order: =rework_limit_per_order
      Designer Authorized Repair Service:
        workmanship_guarantee_months: =workmanship_guarantee_months
        rework_free_within_guarantee: =rework_free_within_guarantee
        rework_limit_per_order: =rework_limit_per_order
      Atelier White-Glove Service:
