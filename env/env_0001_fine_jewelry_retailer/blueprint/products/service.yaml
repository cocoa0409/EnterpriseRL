# Product charter: Belrose Workshop Repair and Resizing Service
category: service
display_name: Belrose Workshop Repair and Resizing Service
binding:
  holding_table: service_orders
  event_tables:
  - service_ledger
  intake_tables:
  - service_intake
  status_field: status
  variant_field: variant_name
  quantity_fields:
    balance_due: work_order_charges
lifecycle:
  states:
  - intake
  - estimated
  - awaiting_authorization
  - in_workshop
  - ready_for_pickup
  - delivered
  - returned_unrepaired
  - cancelled
  - abandoned
  transitions:
  - from: intake
    to: estimated
    by: agent
    means: the bench looked at the piece and priced the work
  - from: intake
    to: cancelled
    by: user
    means: the customer took the piece back before it was priced
  - from: estimated
    to: awaiting_authorization
    by: agent
    means: the estimate was put to the customer for their decision
  - from: awaiting_authorization
    to: in_workshop
    by: user
    means: the customer authorised the work and the bench began
  - from: awaiting_authorization
    to: returned_unrepaired
    by: user
    means: the customer declined the estimate and asked for the piece back
  - from: awaiting_authorization
    to: cancelled
    by: user
    means: the customer cancelled the order before authorising any work
  - from: in_workshop
    to: ready_for_pickup
    by: system
    means: the bench finished the work and the piece passed its check
  - from: in_workshop
    to: returned_unrepaired
    by: agent
    means: the bench found the piece could not be repaired as asked
  - from: ready_for_pickup
    to: delivered
    by: user
    means: the customer collected the piece
  - from: returned_unrepaired
    to: delivered
    by: user
    means: the customer collected the piece unrepaired
  - from: ready_for_pickup
    to: abandoned
    by: system
    means: the finished piece went uncollected past the abandonment threshold
  - from: delivered
    to: in_workshop
    by: agent
    means: the piece came back under the workmanship guarantee and returned to the bench
accounts:
- key: work_order_charges
  unit: USD
  meaning: what the customer owes on this work order, increased by each priced bench line and surcharge and decreased by payments, coverage applied and amounts taken off
parameter_schema:
  turnaround_target_business_days: business days the workshop targets between authorisation and completion at this service level; integer
  rush_turnaround_business_days: business days the workshop targets when expedited handling is bought; integer
  rush_surcharge_pct: surcharge for expedited handling as a percentage of the authorised bench total
  minimum_labor_charge: smallest labour charge any authorised work order carries, in USD
  hourly_bench_rate: bench rate charged per hour of jeweler time, in USD
  sizing_up_charge_per_size: charge for taking a ring up one full size, in USD
  sizing_down_charge: charge for taking a ring down, however many sizes, in USD
  prong_retip_charge_per_prong: charge for retipping one prong, in USD
  stone_tightening_charge: charge for tightening loose stones across one piece, in USD
  chain_solder_charge: charge for one solder repair to a chain, in USD
  clasp_replacement_charge: charge for replacing a clasp, part and labour together, in USD
  rhodium_plating_charge: charge for rhodium replating one piece, in USD
  polish_refinish_charge: charge for a full polish and refinish of one piece, in USD
  engraving_charge_per_character: charge per engraved character, in USD
  restringing_charge_per_inch: charge per inch of pearl or bead restringing, in USD
  stone_setting_charge_ladder: charge for setting one stone, banded by stone weight in carats; ordered ladder of carat band to USD charge
  metal_surcharge_pct_by_metal: surcharge applied to bench labour by the metal of the piece; mapping of metal value to percentage
  estimate_validity_days: calendar days a bench estimate stays good for; integer
  authorization_required_above_amount: estimate total above which the customer's authorisation must be taken before work starts, in USD
  written_authorization_required_above_amount: estimate total above which the authorisation must be taken in writing rather than verbally, in USD
  deposit_required_pct: share of the authorised total taken as a deposit before work starts, as a percentage
  deposit_required_above_amount: authorised total above which a deposit is taken at all, in USD
  free_estimate: whether the bench estimate is prepared without charge; boolean
  estimate_fee: charge for preparing the bench estimate where it is not free, in USD
  estimate_fee_credited_to_work: whether an estimate fee is credited against the work when the customer goes ahead; boolean
  workmanship_guarantee_months: whole months the chain stands behind its own workmanship after delivery; integer
  rework_free_within_guarantee: whether rework inside the guarantee is carried out without charge; boolean
  rework_limit_per_order: how many times one order may go back to the bench under the guarantee; integer
  unclaimed_holding_days: calendar days a finished piece is held before storage is charged; integer
  storage_fee_per_month_after_holding: storage charged per started month after the holding period, in USD
  abandonment_days: calendar days after completion at which an unclaimed piece is treated as abandoned; integer
  abandonment_disposal_allowed: whether an abandoned piece may be disposed of under the chain's lien; boolean
  loaner_provided: whether a loaner piece is offered while the work runs; boolean
  insured_shipping_charge: charge for insured shipping of the piece in each direction, in USD
  shipping_insurance_cap: largest declared value insured shipping covers, in USD
  maximum_declared_value: largest value a piece may be taken in at under this service level, in USD
  stone_release_required_above_value: declared value above which the customer must sign the stone release before work starts, in USD
  antique_restoration_admitted: whether antique and estate restoration is admitted at this service level; boolean
  designer_authorization_required: whether the designer's written authorisation must be on file before their piece is worked on; boolean
  max_open_orders_per_customer: how many work orders one customer may have running at this service level at once; integer
  same_day_service_available: whether the work may be carried out while the customer waits; boolean
  queue_priority_rank: where this service level sits in the bench queue, 1 being worked first; integer
  work_carried_out_in_house: whether the work is carried out at the chain's own bench rather than sent to a partner workshop; boolean
  loyalty_discount_pct: discount applied to bench labour for members of the loyalty programme, as a percentage
  protection_claim_admitted: whether work under a protection claim may be carried out at this service level; boolean
  cancellation_window_hours: hours after authorisation within which the customer may cancel without charge; integer
  cancellation_fee: charge for cancelling after the cancellation window, in USD
  appraisal_update_included: whether an updated appraisal is prepared with the finished work without charge; boolean
  photo_documentation_required: whether the piece is photographed at intake and at completion; boolean
  technician_certification_required: the certification a bench jeweler must hold to work at this level; enum
  quality_check_required: whether a final check is carried out before the piece is released; boolean
  second_quality_check_required: whether a second independent check is carried out before release; boolean
  identification_required_at_pickup: whether identification is checked before the piece is handed back; boolean
  third_party_pickup_allowed: whether someone other than the customer may collect the piece on written authority; boolean
  weekend_intake_available: whether pieces are taken in at this service level at the weekend; boolean
  overtime_expedite_fee: flat charge for holding the bench open out of hours to finish the work, in USD
  minimum_notice_hours_for_rush: hours of notice the workshop needs before expedited handling can be promised; integer
  care_custody_cover_cap: largest amount the chain answers for while the piece is in its care, in USD
