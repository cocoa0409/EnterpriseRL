- id: service_discounts_and_goodwill
  subject:
  - service_goodwill_discount_applied
  rule: An amount is taken off a priced line as goodwill where the chain itself fell short, and each service level carries its own allowance for how often that may be done. A goodwill amount is taken off only when no amount has already been taken off that same priced line. Members of the loyalty programme receive the level's member discount on bench labour, and the member discount is applied to labour before any goodwill amount is considered. The member discount and a goodwill amount may both be taken off the same order, but never twice off the same priced line, and a rework carried out under the guarantee is recorded under the guarantee rather than as goodwill. Where the goodwill allowance is exhausted the desk explains the allowance and does not take the amount off, and the customer's dissatisfaction alone is not a ground for passing that allowance.
  eligibility:
  - id: one_discount_per_line
    applies_to:
    - service_goodwill_discount_applied
    kind: dedup
    condition: A goodwill amount is taken off only when no amount has already been taken off that same priced line.
    evidence_fields:
    - service_ledger.source_entry_id
    - service_ledger.discount_reason_code
    - service_ledger.posted_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - service_ledger.source_entry_id
      action_bindings:
        service_ledger.source_entry_id: source_entry_id
    dedup_contract:
      table: service_ledger
      mode: separate_record
      object_bindings:
        source_entry_id: source_entry_id
      duplicate_filters:
        discount_reason_code:
        - goodwill_service_recovery
        - loyalty_tier_benefit
        - workmanship_rework
      distinct_fields:
      - posted_date
      - amount
  params:
    per_tier:
      Standard Bench Service:
        loyalty_discount_pct: =loyalty_discount_pct
      Priority Bench Service:
        loyalty_discount_pct: =loyalty_discount_pct
      Master Jeweler Service:
        loyalty_discount_pct: =loyalty_discount_pct
      Heritage Restoration Service:
        loyalty_discount_pct: =loyalty_discount_pct
      Designer Authorized Repair Service:
        loyalty_discount_pct: =loyalty_discount_pct
      Atelier White-Glove Service:
        loyalty_discount_pct: =loyalty_discount_pct
    goodwill_discounts_per_12_months: 3
  formula:
    when_not: service_msr_goodwill_12m >= goodwill_discounts_per_12_months
    member_discount: round(unit_price * quantity * loyalty_discount_pct / 100, 2)
  measures:
  - service_msr_goodwill_12m
