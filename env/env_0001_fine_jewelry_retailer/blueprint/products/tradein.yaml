- id: tradein_estate_purchase
  subject:
  - tradein_item_rejected
  - tradein_credit_issued
  - tradein_registration_updated
  rule: Under the estate programme the chain buys the piece outright or offers it on consignment, and the customer chooses which of the two before the piece is taken in. An outright purchase pays the programme's share of the appraised value and is settled in money rather than in credit, and the piece becomes the chain's on the day it is paid for. A consigned piece is offered for the programme's consignment period and the chain retains its commission out of the price achieved; a piece that does not sell is returned to the customer at the end of the period. A piece is taken on consignment only where its appraised value reaches the programme's consignment floor, and a piece below that floor is offered an outright purchase instead. A piece bought in is held for the days the trade requires before it is resold or melted, whatever the customer or a buyer asks for in the meantime. The choice between credit, an outright purchase and consignment is made by the customer on the trade-in service request record, because disposing of their own property is theirs alone to do. The consignment commission is retained out of the price the piece achieves rather than charged to the customer, and the valuation entry records the basis the price was struck on.
