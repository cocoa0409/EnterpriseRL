- id: tradein_credit_grant
  subject:
  - tradein_credit_granted
  - tradein_credit_revaluation_applied
  rule: 'The credit is booked as available to spend on the day it is issued, and it is booked once against the registration it belongs to. Credit is booked, and later revalued, only while the registration stands at credit issued or partially redeemed. On the programmes that allow it, an issued credit may be revalued upward inside the programme''s revaluation window, counted from the day the credit was issued, and the increase is booked as its own entry. The revaluation window is counted in whole calendar days from the day the credit was issued, that day counting as day zero, weekends and store holidays included. A credit is never revalued downward once issued: where the piece proves to be worth less than valued, the credit is withdrawn in full and the piece returned rather than quietly reduced.'
  eligibility:
  - id: grantable_state
    applies_to:
    - tradein_credit_granted
    - tradein_credit_revaluation_applied
    kind: state
    condition: Credit is booked, and later revalued, only while the registration stands at credit issued or partially redeemed.
    evidence_fields:
    - tradein_credits.status
    - tradein_credits.credit_reference
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - tradein_credits.credit_reference
      action_bindings:
        tradein_credits.credit_reference: credit_reference
    state_contract:
      field: tradein_credits.status
      allowed:
      - credit_issued
      - partially_redeemed
  - id: revaluation_window
    applies_to:
    - tradein_credit_revaluation_applied
    kind: time
    condition: On the programmes that allow it, an issued credit may be revalued upward inside the programme's revaluation window, counted from the day the credit was issued, and the increase is booked as its own entry.
    evidence_fields:
    - tradein_credits.issued_date
    - tradein_credits.credit_reference
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - tradein_credits.credit_reference
      action_bindings:
        tradein_credits.credit_reference: credit_reference
    temporal_basis:
      clock: frozen_time
      anchor_event: the day the credit was issued
      anchor_source: tradein_credits.issued_date
      relation: not_after
      duration_source: variants.revaluation_window_days
      unit: calendar_days
      counting_rule: The revaluation window is counted in whole calendar days from the day the credit was issued, that day counting as day zero, weekends and store holidays included.
      boundary: inclusive
  params:
    per_tier:
      Belrose Standard Trade-In:
        revaluation_allowed: =revaluation_allowed
        revaluation_window_days: =revaluation_window_days
        credit_validity_days: =credit_validity_days
      Diamond Trade-Up Guarantee:
        revaluation_allowed: =revaluation_allowed
        revaluation_window_days: =revaluation_window_days
        credit_validity_days: =credit_validity_days
      Bridal Upgrade Guarantee:
        revaluation_allowed: =revaluation_allowed
        revaluation_window_days: =revaluation_window_days
        credit_validity_days: =credit_validity_days
      Lifetime Diamond Upgrade Guarantee:
        revaluation_allowed: =revaluation_allowed
        revaluation_window_days: =revaluation_window_days
        credit_validity_days: =credit_validity_days
      Signature Collection Upgrade Privilege:
        revaluation_allowed: =revaluation_allowed
        revaluation_window_days: =revaluation_window_days
        credit_validity_days: =credit_validity_days
      Estate Purchase and Consignment Programme:
        revaluation_allowed: =revaluation_allowed
        revaluation_window_days: =revaluation_window_days
        credit_validity_days: =credit_validity_days
  measures:
