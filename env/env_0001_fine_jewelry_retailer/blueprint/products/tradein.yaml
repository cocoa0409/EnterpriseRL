- id: tradein_expiry_and_forfeit
  subject:
  - tradein_credit_expired
  - tradein_credit_forfeited
  - tradein_credit_revoked
  rule: A credit that reaches its expiry with something unspent is closed and what is left is taken away, and the programmes that issue credit without an expiry never reach this point. Credit is taken away only while the registration stands at credit issued, partially redeemed, expired or revoked, and the reason is recorded as one of the closed set of grounds. On the programmes that allow it, a credit about to expire may be extended once by the programme's extension in calendar days for the programme's extension fee, and the extension is arranged before the expiry, never after it. A credit taken away because the customer withdrew the traded piece is recorded under the withdrawal ground, and the piece is returned in the condition it came in. Once a credit has been taken away it is not reinstated, and a customer who wishes to trade again begins a fresh registration. The extension fee is taken at the counter on its own till transaction rather than deducted from the credit, so the credit available to spend is never quietly reduced by a fee.
  eligibility:
  - id: forfeitable_state
    applies_to:
    - tradein_credit_forfeited
    kind: state
    condition: Credit is taken away only while the registration stands at credit issued, partially redeemed, expired or revoked, and the reason is recorded as one of the closed set of grounds.
    evidence_fields:
    - tradein_credits.status
    - tradein_credits.credit_reference
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - tradein_credits.credit_reference
      action_bindings:
        tradein_credits.credit_reference: credit_reference
    state_contract:
      field: tradein_credits.status
      allowed:
      - credit_issued
      - partially_redeemed
      - expired
      - revoked
  params:
    per_tier:
      Belrose Standard Trade-In:
        credit_validity_days: =credit_validity_days
        credit_extension_allowed: =credit_extension_allowed
