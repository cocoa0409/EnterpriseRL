- id: tradein_valuation
  subject:
  - tradein_item_valuation_logged
  - tradein_credit_issued
  rule: 'The credit is worked out on the basis the programme names: the price the piece originally sold for, its current appraised value, its certified laboratory value or the published scrap rate for its metal. The valuation is recorded only while the registration stands at registered, appraisal pending or credit issued. On the programmes that guarantee the original price, the credit is that share of the price the piece originally sold for; on the programmes that value at market, it is that share of the current appraised value. Where no accepted certificate is presented the valuation is reduced by the programme''s missing-certificate deduction, and on the programmes where that deduction is the whole of the valuation the piece is refused rather than valued down to nothing. The credit issued is capped at the programme''s ceiling however high the valuation runs, and on the programmes that credit the stone alone the mounting is valued at nothing. An appraisal is good as the basis of a credit for the programme''s validity window, and an older appraisal is refreshed before credit is issued. The appraisal fee the programme charges is credited against the upgrade on the programmes that credit it and kept where they do not.'
