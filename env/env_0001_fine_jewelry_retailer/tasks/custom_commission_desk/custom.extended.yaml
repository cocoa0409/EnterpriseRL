  - custom_msr_open_commissions
- id: custom_commission_admission
  subject:
  - custom_order_opened
  - custom_design_presented
  rule: A commission is taken under a programme only where the quoted total falls between the smallest and the largest commission value that programme is offered for. A centre stone is built around only where its weight falls between the smallest and the largest weight the programme admits, and the metal must be one the programme offers. A stone the customer supplies is worked with only where the programme accepts a supplied stone and only once the customer has signed the stone release the chain requires, and their verbal go-ahead does not stand in for that release. Stones taken out of an heirloom piece are remounted only under the programmes that admit remounting, and the piece they came from is photographed before anything is taken apart. A consultation deposit is taken before design work begins under the programmes that require one, and it is credited against the quoted total. Where the piece the customer describes falls outside every programme's range, the desk does not open a commission and the customer is referred to the atelier by appointment.
  eligibility:
  - id: stone_release_signed
    applies_to:
    - custom_order_opened
    kind: authorization
    condition: A stone the customer supplies is worked with only where the programme accepts a supplied stone and only once the customer has signed the stone release the chain requires, and their verbal go-ahead does not stand in for that release.
    evidence_fields:
    - custom_orders.stone_release_signed
    - custom_orders.center_stone_source
    - custom_orders.commission_reference
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - custom_orders.commission_reference
      action_bindings:
        custom_orders.commission_reference: commission_reference
