      method: "the sum reached is taken at the studio's overdue relief fraction"
    - when: "the piece stands past the date it was promised for by not more than the studio's overdue days and has not been recorded as finished"
      method: "the sum reached is taken at the studio's late relief fraction"
    - when: "otherwise"
