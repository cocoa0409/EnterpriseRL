- id: custom_cancellation_and_forfeit
  subject:
  - custom_order_cancelled
  - custom_refund_issued
  rule: A commission cancelled before the design is approved is closed with nothing forfeited beyond any consultation deposit the programme takes. A commission is cancelled without the heavier forfeit only when the request reaches the studio within the cancellation window in calendar days, counted from the date the customer approved the design. The cancellation window is counted in whole calendar days from the day the design was approved, that day counting as day zero, weekends and studio holidays included. Cancelled before production begins, the commission forfeits the programme's lighter share of the quoted total; cancelled once production has begun, it forfeits the programme's heavier share, and the deposit's non-refundable share is never returned in either case. The refund is what the customer has paid to date less what is forfeited, and where the forfeit exceeds what was paid nothing further is collected from the customer. A piece already finished is not refunded at all, because it was made to that customer's own specification and cannot be sold on. The cancellation is confirmed by the customer on the commission service request record, because walking away from a piece being made for them is theirs alone to do.
