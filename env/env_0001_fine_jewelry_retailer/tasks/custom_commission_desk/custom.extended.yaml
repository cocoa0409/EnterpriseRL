      method: "what the customer has put into the commission is read as the payments settled on that plan together with the amount paid at the till when the sale was written"
    - when: "such a plan finances that till transaction and no longer stands active"
      method: "what the customer has put into the commission is read as the financed amount on that plan together with the amount paid at the till"
    - when: "otherwise"
      method: "what the customer has put into the commission is read as the deposits and staged payments booked to the commission"
    baseline:
      paid_to_date: "commission_payments"
    evidence: [cross_category, history]
    cross_difficulty: financing
  - id: centre_stone_holdback
    effect: parameter
    decides: stone_holdback_pct
    bindings: [stages_recorded, stone_holdback_pct]
    ladder:
    - when: "the centre stone the commission is built around weighs at or above the studio's large stone weight and no stage of production stands recorded on the commission"
      value: "K('large_stone_holdback_pct')"
    - when: "the centre stone weighs at or above the smallest weight the programme will build around and below the studio's large stone weight and no stage of production stands recorded"
      value: "K('small_stone_holdback_pct')"
    - when: "otherwise"
      value: "K('no_stone_holdback_pct')"
    baseline:
      stone_holdback_pct: "K('no_stone_holdback_pct')"
    evidence: [history, tier_param]
    cross_difficulty: null
  - id: slow_design_goodwill
    effect: parameter
    decides: goodwill_pct
    bindings: [design_wait_days, goodwill_pct]
    ladder:
    - when: "more than the studio's long design delay days passed between the commission being opened at the consultation and the design being approved and no stage of production stands recorded on the commission"
      value: "K('major_goodwill_pct')"
    - when: "more than the studio's design delay days but not more than its long design delay days passed between those two dates and no stage of production stands recorded"
      value: "K('minor_goodwill_pct')"
    - when: "otherwise"
      value: "K('no_goodwill_pct')"
    baseline:
      goodwill_pct: "K('no_goodwill_pct')"
    evidence: [date]
    cross_difficulty: null
  - id: revision_overage_setoff
    effect: parameter
    decides: overage_setoff_pct
    bindings: [overage_charges, overage_setoff_pct]
    ladder:
    - when: "a charge for a revision beyond the included allowance stands booked on the commission and what the customer still owes on the commission stands above those charges"
      value: "K('full_overage_setoff_pct')"
    - when: "such a charge stands booked and what the customer still owes stands at or below those charges"
      value: "K('part_overage_setoff_pct')"
    - when: "otherwise"
      value: "K('no_overage_setoff_pct')"
    baseline:
      overage_setoff_pct: "K('no_overage_setoff_pct')"
    evidence: [history]
    cross_difficulty: null
  - id: bundled_coverage_return
    effect: parameter
    decides: coverage_return_pct
    bindings: [coverage_premiums_paid, coverage_claims_settled, coverage_return_pct]
    ladder:
    - when: "the customer holds coverage standing in force on which premiums have been paid and against which no claim has been settled"
      value: "K('unclaimed_coverage_pct')"
    - when: "the customer holds coverage standing in force on which premiums have been paid and against which a claim has been settled"
      value: "K('claimed_coverage_pct')"
    - when: "otherwise"
      value: "K('no_coverage_pct')"
    baseline:
      coverage_return_pct: "K('no_coverage_pct')"
    evidence: [cross_category]
    cross_difficulty: protection
  baseline:
    rule: >-
      The refund paid back on a commission closed at the customer's request is what the customer has
      put into the commission less the sum the studio keeps, less the holdback against placing the
      centre stone elsewhere, plus the goodwill credit for a design that took too long, plus the
      premiums returned on the coverage that was to come with the piece, less the charges for
      revisions beyond the included allowance that are set off against it, and it is never less than
      nothing. The sum the studio keeps is read from the confirmation of the closure standing on the
      studio's request record, taken at the latest date such a confirmation is to take effect from,
      and what the customer has put in less that sum is never fewer than nothing; the holdback and
      the goodwill credit are each a share of that remainder. What the customer has put into the
      commission is what they have paid to date on it. What the customer has put into the commission
      is read as the deposits and staged payments booked to the commission. Nothing is held back
      against placing the centre stone elsewhere. No goodwill credit is given for a design that took
      too long. Nothing is returned for the coverage that was to come with the piece. Nothing is set
      off for revisions beyond the included allowance. Nothing is held back from the refund on
      account of the share of the deposit the programme marks as non-refundable, the sum the studio
      keeps standing in place of it. The holdback, the goodwill credit, the premiums returned and
      the amount set off are each rounded half up to two decimal places as they are worked out, and
      the figure paid back is rounded half up to two decimal places once they have been taken off
      and added on.
    params: [no_stone_holdback_pct, no_goodwill_pct, no_coverage_pct, no_overage_setoff_pct]
  inputs:
    history:
    - {table: custom_ledger, aggregate: sum, field: amount, within_months: null, filters: {event_type: custom_deposit_paid}}
    - {table: custom_ledger, aggregate: count, field: custom_entry_id, within_months: null, filters: {event_type: custom_milestone_logged}}
    - {table: custom_ledger, aggregate: sum, field: amount, within_months: null, filters: {event_type: custom_price_adjustment_charged}}
    - {table: custom_intake, aggregate: latest, field: requested_amount, within_months: null, filters: {request_type: cancellation}}
    - {category: financing, table: financing_ledger, aggregate: sum, field: amount, within_months: null, filters: {event_type: financing_payment_posted}}
    cross_category: [financing, protection]
