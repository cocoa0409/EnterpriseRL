# Product charter: Belrose Design Studio Custom Commissions
category: custom
display_name: Belrose Design Studio Custom Commissions
binding:
  holding_table: custom_orders
  event_tables:
  - custom_ledger
  intake_tables:
  - custom_intake
  status_field: status
  variant_field: variant_name
  quantity_fields:
    balance_due: commission_balance
    remaining_revisions: design_revisions
lifecycle:
  states:
  - consultation
  - design_approval
  - deposit_pending
  - in_production
  - on_hold
  - awaiting_final_payment
  - ready_for_delivery
  - delivered
  - cancelled
  transitions:
  - from: consultation
    to: design_approval
    by: agent
    means: the first design was presented and the commission waits on the customer's approval
  - from: consultation
    to: cancelled
    by: user
    means: the customer withdrew before any design was presented
  - from: design_approval
    to: deposit_pending
    by: user
    means: the customer approved the design and the deposit fell due
  - from: design_approval
    to: cancelled
    by: user
    means: the customer declined the design and closed the commission
  - from: deposit_pending
    to: in_production
    by: agent
    means: the deposit cleared and the piece went into production
  - from: deposit_pending
    to: cancelled
    by: user
    means: the customer withdrew before the deposit cleared
  - from: in_production
    to: on_hold
    by: agent
    means: production stopped while something outstanding was resolved
  - from: on_hold
    to: in_production
    by: agent
    means: what held the commission up was resolved and production resumed
  - from: on_hold
    to: cancelled
    by: user
    means: the customer closed a commission that had been held up
  - from: in_production
    to: awaiting_final_payment
    by: system
    means: production finished and the balance fell due
  - from: in_production
    to: cancelled
    by: user
    means: the customer closed the commission while the piece was being made
  - from: awaiting_final_payment
    to: ready_for_delivery
    by: agent
    means: the balance was settled and the piece was made ready to hand over
  - from: ready_for_delivery
    to: delivered
    by: user
    means: the customer took delivery of the finished piece
accounts:
- key: commission_balance
  unit: USD
  meaning: what the customer owes on this commission, increased by the quote, agreed changes and price adjustments and decreased by deposits, progress payments and refunds
- key: design_revisions
  unit: revisions
  meaning: how many design revisions the commission still has included, granted when the design is approved and consumed one by one as revisions are taken
parameter_schema:
  minimum_commission_value: smallest quoted total a commission may be taken at under this programme, in USD
  maximum_commission_value: largest quoted total a commission may be taken at under this programme, in USD
  deposit_pct: share of the quoted total taken as a deposit before production begins, as a percentage
  deposit_nonrefundable_pct: share of the deposit that is never returned once the design has been approved, as a percentage
  included_design_revisions: number of design revisions included in the quoted total; integer
  additional_revision_charge: charge for each design revision beyond the included count, in USD
  design_lead_time_business_days: business days between the consultation and the first design being presented; integer
  production_lead_time_business_days: business days between the deposit clearing and production finishing; integer
  rush_production_business_days: business days production runs to when the commission is expedited; integer
  rush_surcharge_pct: surcharge for expediting the commission as a percentage of the quoted total
  minimum_notice_days_for_rush: calendar days of notice needed before a commission can be expedited; integer
  cad_render_included: whether a computer rendering of the design is prepared within the quoted total; boolean
  wax_model_included: whether a wax or resin model is prepared for the customer to see within the quoted total; boolean
  customer_supplied_stone_accepted: whether a stone the customer brings in may be used in the piece; boolean
  heirloom_remount_accepted: whether stones taken out of an heirloom piece may be remounted under this programme; boolean
  stone_release_required: whether the customer must sign the release before the chain works with a stone they supplied; boolean
  center_stone_min_carat: smallest centre stone weight this programme will build around, in carats
  center_stone_max_carat: largest centre stone weight this programme will build around, in carats
  metal_choices: the metals a piece may be made in under this programme; list of metal values
  metal_price_revaluation_window_days: calendar days the quoted metal price is held for before the quote is rebuilt; integer
  metal_price_passed_through: whether a movement in the metal price after the revaluation window is passed on to the customer; boolean
  stone_sourcing_fee_pct: fee for sourcing a stone to order, as a percentage of the stone's cost
  design_fee: fee charged for the design work itself, in USD
  design_fee_credited_to_commission: whether the design fee is credited against the quoted total once the customer goes ahead; boolean
  change_order_window_days: calendar days after design approval within which a change to the specification may still be agreed; integer
  change_order_fee: administration fee charged on each agreed change to the specification, in USD
  change_order_max_count: how many changes to the specification may be agreed on one commission; integer
  cancellation_window_days: calendar days after design approval within which the commission may be cancelled on the lighter forfeit; integer
  cancellation_forfeit_pct_before_production: share of the quoted total forfeited when the commission is cancelled before production begins, as a percentage
  cancellation_forfeit_pct_after_production: share of the quoted total forfeited when the commission is cancelled after production has begun, as a percentage
  progress_payment_schedule: the shares of the quoted total collected at each stage; ordered list of percentages by stage
  final_payment_due_days_before_delivery: calendar days before the promised delivery date by which the balance must be settled; integer
  appraisal_included: whether an appraisal of the finished piece is prepared within the quoted total; boolean
  appraisal_value_basis: what the included appraisal values the piece at; enum of retail_replacement or fair_market
  gem_certification_included: whether an independent laboratory certificate is obtained for the centre stone within the quoted total; boolean
  warranty_months: whole months the chain stands behind the commissioned piece after delivery; integer
  resizing_included_within_days: calendar days after delivery within which one resizing is carried out without charge; integer
  protection_plan_bundled: whether a protection plan is included with the commissioned piece; boolean
  financing_allowed: whether the commission may be taken on a promotional financing plan; boolean
  trade_in_credit_accepted: whether an upgrade credit may be put toward the commission; boolean
  delivery_method: how the finished piece is handed over; enum of store_collection, insured_courier or private_appointment
  white_glove_delivery: whether the piece is delivered in person by a member of staff; boolean
  photography_included: whether the finished piece is professionally photographed for the customer; boolean
  designer_consultation_hours: hours of designer time included in the quoted total; integer
  designer_certification_required: the standing a designer must hold to carry a commission under this programme; enum
  max_open_commissions_per_customer: how many commissions one customer may have running under this programme at once; integer
  production_hold_max_days: calendar days a commission may sit on hold before it is treated as cancelled; integer
  storage_after_completion_days: calendar days a finished piece is held before storage is charged; integer
  storage_fee_per_month: storage charged per started month after the holding period, in USD
  unique_piece_guarantee: whether the chain undertakes never to make the same piece for another customer; boolean
  reproduction_restriction_years: whole years the chain holds back from reproducing the design; integer
  engraving_included_characters: number of engraved characters included in the quoted total; integer
  presentation_box_upgrade_included: whether the upgraded presentation box is included; boolean
  quality_sign_off_required: whether the customer signs off the finished piece before it leaves the studio; boolean
  consultation_deposit: amount taken at the consultation before design work begins, in USD
