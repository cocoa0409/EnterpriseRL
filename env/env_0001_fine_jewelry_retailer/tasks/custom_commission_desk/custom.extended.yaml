- id: custom_ext_change_order_charge
  base_policy_refs:
  - custom_change_orders
  overwrite:
  - base_policy: custom_change_orders
    superseded_clause: >-
      A change to the specification after the design has been approved is agreed as a change order,
      priced on its own and charged with the programme's change administration fee.
    replaced_by: >-
      The charge booked to the commission for a change agreed to the specification is the value of the
      work the customer has committed to, together with the programme's administration fee for the
      change, together with the studio's charge for re-opening the commission at the bench, together
      with the studio's premium for the metal the piece is to be made in, together with the studio's
      charge for the bench days the change gives back, and the five are added together before any
      settlement against an upgrade credit is taken.
  trigger: on_request
  subject:
  - custom_change_order_charged
  computes: change_charge_amount
  target_tool: charge_specification_change_ec6b5130
  params:
    repeat_change_fee_multiple: 2.0
    in_production_fee_multiple: 1.5
    published_fee_multiple: 1.0
    standard_reopen_pct: 10.0
    unstarted_reopen_pct: 0.0
    platinum_recast_pct: 9.0
    gold18_recast_pct: 4.0
    no_recast_pct: 0.0
    high_value_share: 0.75
    high_value_day_rate: 30.0
    standard_day_rate: 18.0
    unstarted_day_rate: 8.0
    bench_settling_days: 2
    high_credit_settlement_pct: 20.0
    low_credit_settlement_pct: 8.0
    no_credit_settlement_pct: 0.0
  rule: >-
    The charge booked to the commission for a change agreed to the specification is the value of the
    work the customer has committed to, together with the programme's administration fee for the
    change, together with the studio's charge for re-opening the commission at the bench, together
    with the studio's premium for the metal the piece is to be made in, together with the studio's
    charge for the bench days the change gives back, and the five are added together before any
    settlement against an upgrade credit is taken. The charge for the agreed change is worked out only
    after the studio's request record carries the customer's own confirmation of the change and of
    what the work it puts back on the bench is worth. The value of the work the customer has committed
    to is read from the confirmation of the change standing on the studio's request record, taken at
    the latest date such a confirmation is to take effect from. The administration fee is the
    programme's fee for a change to the specification as the programme sets it. Nothing is charged for
    re-opening the commission at the bench. Nothing is added for the metal the piece is to be made in.
    The bench days the change gives back are counted from the date production began to the day the
    change is priced, and are never fewer than none. They are charged at the studio's daily rate for a
    commission not yet settled at the bench. Nothing of the figure reached is settled against an
    upgrade credit. Each of the five charges that make up the figure reached is rounded half up to two
    decimal places as it is worked out, and the figure booked is the figure reached less the share
    settled against an upgrade credit, rounded half up to two decimal places once that share has been
    taken off. Where a charge for a change to the specification already stands booked on the
    commission and the piece has gone into production, the administration fee is taken at the studio's
    repeat multiple of the programme's fee; where no charge for a change to the specification stands
    booked on the commission and the piece has gone into production, it is taken at the studio's
    in-production multiple of the programme's fee; otherwise the administration fee is the programme's
    fee for a change to the specification as the programme sets it. Where the commission stands
    expedited and a stage of production stands recorded on it, re-opening the commission at the bench
    is charged at the programme's rush surcharge rate on the value of the work the customer has
    committed to; where the commission does not stand expedited and a stage of production stands
    recorded on it, re-opening is charged at the studio's standard re-opening rate on that value;
    otherwise nothing is charged for re-opening the commission at the bench. Where the piece is to be
    made in platinum or in palladium and a casting stage stands recorded on the commission, the
    studio's platinum recasting premium is added on the value of the work the customer has committed
    to; where the piece is to be made in an eighteen karat gold and a casting stage stands recorded on
    the commission, the studio's gold recasting premium is added on that value; otherwise nothing is
    added for the metal the piece is to be made in. Where a stone setting stage stands recorded on the
    commission and no final inspection stage stands recorded on it, the bench days the change gives
    back are counted from the date the stone setting stage was reached; where a casting stage stands
    recorded on the commission and no stone setting stage stands recorded on it, they are counted from
    the date the casting stage was reached; otherwise they are counted from the date production began.
    Where the quoted total on the commission stands at or above three quarters of the largest value
    the programme is offered for and the piece has stood at the bench for longer than the studio's
    bench settling days, the bench days are charged at the studio's daily rate for a commission of
    high value; where the quoted total stands at or above the smallest value the programme is offered
    for and below three quarters of the largest and the piece has stood at the bench for longer than
    the studio's bench settling days, they are charged at the studio's standard daily rate; otherwise
    they are charged at the studio's daily rate for a commission not yet settled at the bench. Where
    the customer holds an upgrade registration with credit still available and the credit still
    available stands at or above the least the customer must spend for that credit to be usable, the
    studio settles its high share of the figure reached against that credit; where the customer holds
    an upgrade registration with credit still available and the credit still available stands below
    that least spend, the studio settles its low share of the figure reached against that credit;
    otherwise nothing of the figure reached is settled against an upgrade credit.
  prerequisite:
  - problem: custom_ext_change_consent
    kind: value_input
    gate: agreed_change_value
    form: state
    policy_source: >-
      The charge for the agreed change is worked out only after the studio's request record carries
      the customer's own confirmation of the change and of what the work it puts back on the bench is
      worth.
    condition: >-
      The studio's request record carries a confirmation of the change, standing as confirmed by the
      customer and bearing the value the work puts back on the bench.
    resolved_by: confirm_specification_change_363ec738
    effect: >-
      Once the customer's confirmation stands on the studio's request record, the value of the work
      the charge is built on is read from it instead of being absent altogether.
  cross_category:
  - category: tradein
    as: branch
    note: the upgrade credit the customer still holds decides the share of the figure reached the studio settles against that credit.
  compute:
  - agreed_change_value: "LATEST('custom_intake','requested_amount', date_field='effective_date', request_type='change_order', request_status='customer_confirmed')"
  - changes_already_charged: "COUNT('custom_ledger', date_field='posted_date', event_type='custom_change_order_charged')"
  - admin_fee_multiple: "K('repeat_change_fee_multiple') if (changes_already_charged > 0 and F('production_start_date') != '') else (K('in_production_fee_multiple') if (changes_already_charged == 0 and F('production_start_date') != '') else K('published_fee_multiple'))"
  - administration_fee: "RND(P('change_order_fee') * admin_fee_multiple, 2)"
  - stages_logged: "COUNT('custom_ledger', date_field='posted_date', event_type='custom_milestone_logged')"
  - reopen_rate_pct: "P('rush_surcharge_pct') if (F('rush_requested') == True and stages_logged > 0) else (K('standard_reopen_pct') if (F('rush_requested') == False and stages_logged > 0) else K('unstarted_reopen_pct'))"
  - reopen_amount: "RND(agreed_change_value * reopen_rate_pct / 100, 2)"
  - casting_stages: "COUNT('custom_ledger', date_field='posted_date', event_type='custom_milestone_logged', milestone_code='casting')"
  - metal_premium_pct: "K('platinum_recast_pct') if ((F('metal_choice') == 'platinum_950' or F('metal_choice') == 'palladium_500') and casting_stages > 0) else (K('gold18_recast_pct') if ((F('metal_choice') == 'yellow_gold_18k' or F('metal_choice') == 'white_gold_18k' or F('metal_choice') == 'rose_gold_18k') and casting_stages > 0) else K('no_recast_pct'))"
  - metal_premium_amount: "RND(agreed_change_value * metal_premium_pct / 100, 2)"
  - stone_setting_stages: "COUNT('custom_ledger', date_field='posted_date', event_type='custom_milestone_logged', milestone_code='stone_setting')"
  - final_inspection_stages: "COUNT('custom_ledger', date_field='posted_date', event_type='custom_milestone_logged', milestone_code='final_inspection')"
  - bench_day_anchor: "LATEST('custom_ledger','posted_date', date_field='posted_date', event_type='custom_milestone_logged', milestone_code='stone_setting') if (stone_setting_stages > 0 and final_inspection_stages == 0) else (LATEST('custom_ledger','posted_date', date_field='posted_date', event_type='custom_milestone_logged', milestone_code='casting') if (casting_stages > 0 and stone_setting_stages == 0) else F('production_start_date'))"
  - bench_days_given_back: "MX(0, DAYS(bench_day_anchor, NOW))"
  - bench_at_work_days: "DAYS(F('production_start_date'), NOW)"
  - bench_day_rate: "K('high_value_day_rate') if (F('quoted_total') >= K('high_value_share') * P('maximum_commission_value') and bench_at_work_days > K('bench_settling_days')) else (K('standard_day_rate') if (F('quoted_total') >= P('minimum_commission_value') and F('quoted_total') < K('high_value_share') * P('maximum_commission_value') and bench_at_work_days > K('bench_settling_days')) else K('unstarted_day_rate'))"
  - bench_day_amount: "RND(bench_days_given_back * bench_day_rate, 2)"
  - credit_available: "float(CFIELD('tradein','remaining_credit', status='partially_redeemed') or 0)"
  - credit_minimum_spend: "float(CFIELD('tradein','upgrade_minimum_spend', status='partially_redeemed') or 0)"
  - credit_settlement_pct: "K('high_credit_settlement_pct') if (credit_available > 0 and credit_available >= credit_minimum_spend) else (K('low_credit_settlement_pct') if (credit_available > 0 and credit_available < credit_minimum_spend) else K('no_credit_settlement_pct'))"
  - figure_reached: "agreed_change_value + administration_fee + reopen_amount + metal_premium_amount + bench_day_amount"
  - result: "RND(figure_reached * (100 - credit_settlement_pct) / 100, 2)"
  compute_basis:
    agreed_change_value: "The value of the work the customer has committed to is read from the confirmation of the change standing on the studio's request record, taken at the latest date such a confirmation is to take effect from."
    changes_already_charged: "Where a charge for a change to the specification already stands booked on the commission and the piece has gone into production, the administration fee is taken at the studio's repeat multiple of the programme's fee; where no charge for a change to the specification stands booked on the commission and the piece has gone into production, it is taken at the studio's in-production multiple of the programme's fee; otherwise the administration fee is the programme's fee for a change to the specification as the programme sets it."
    admin_fee_multiple: "Where a charge for a change to the specification already stands booked on the commission and the piece has gone into production, the administration fee is taken at the studio's repeat multiple of the programme's fee; where no charge for a change to the specification stands booked on the commission and the piece has gone into production, it is taken at the studio's in-production multiple of the programme's fee; otherwise the administration fee is the programme's fee for a change to the specification as the programme sets it."
    administration_fee: "Each of the five charges that make up the figure reached is rounded half up to two decimal places as it is worked out, and the figure booked is the figure reached less the share settled against an upgrade credit, rounded half up to two decimal places once that share has been taken off."
    stages_logged: "Where the commission stands expedited and a stage of production stands recorded on it, re-opening the commission at the bench is charged at the programme's rush surcharge rate on the value of the work the customer has committed to; where the commission does not stand expedited and a stage of production stands recorded on it, re-opening is charged at the studio's standard re-opening rate on that value; otherwise nothing is charged for re-opening the commission at the bench."
    reopen_rate_pct: "Where the commission stands expedited and a stage of production stands recorded on it, re-opening the commission at the bench is charged at the programme's rush surcharge rate on the value of the work the customer has committed to; where the commission does not stand expedited and a stage of production stands recorded on it, re-opening is charged at the studio's standard re-opening rate on that value; otherwise nothing is charged for re-opening the commission at the bench."
    reopen_amount: "Each of the five charges that make up the figure reached is rounded half up to two decimal places as it is worked out, and the figure booked is the figure reached less the share settled against an upgrade credit, rounded half up to two decimal places once that share has been taken off."
    casting_stages: "Where the piece is to be made in platinum or in palladium and a casting stage stands recorded on the commission, the studio's platinum recasting premium is added on the value of the work the customer has committed to; where the piece is to be made in an eighteen karat gold and a casting stage stands recorded on the commission, the studio's gold recasting premium is added on that value; otherwise nothing is added for the metal the piece is to be made in."
    metal_premium_pct: "Where the piece is to be made in platinum or in palladium and a casting stage stands recorded on the commission, the studio's platinum recasting premium is added on the value of the work the customer has committed to; where the piece is to be made in an eighteen karat gold and a casting stage stands recorded on the commission, the studio's gold recasting premium is added on that value; otherwise nothing is added for the metal the piece is to be made in."
    metal_premium_amount: "Each of the five charges that make up the figure reached is rounded half up to two decimal places as it is worked out, and the figure booked is the figure reached less the share settled against an upgrade credit, rounded half up to two decimal places once that share has been taken off."
    stone_setting_stages: "Where a stone setting stage stands recorded on the commission and no final inspection stage stands recorded on it, the bench days the change gives back are counted from the date the stone setting stage was reached; where a casting stage stands recorded on the commission and no stone setting stage stands recorded on it, they are counted from the date the casting stage was reached; otherwise they are counted from the date production began."
    final_inspection_stages: "Where a stone setting stage stands recorded on the commission and no final inspection stage stands recorded on it, the bench days the change gives back are counted from the date the stone setting stage was reached; where a casting stage stands recorded on the commission and no stone setting stage stands recorded on it, they are counted from the date the casting stage was reached; otherwise they are counted from the date production began."
    bench_day_anchor: "Where a stone setting stage stands recorded on the commission and no final inspection stage stands recorded on it, the bench days the change gives back are counted from the date the stone setting stage was reached; where a casting stage stands recorded on the commission and no stone setting stage stands recorded on it, they are counted from the date the casting stage was reached; otherwise they are counted from the date production began."
    bench_days_given_back: "The bench days the change gives back are counted from the date production began to the day the change is priced, and are never fewer than none."
    bench_at_work_days: "Where the quoted total on the commission stands at or above three quarters of the largest value the programme is offered for and the piece has stood at the bench for longer than the studio's bench settling days, the bench days are charged at the studio's daily rate for a commission of high value; where the quoted total stands at or above the smallest value the programme is offered for and below three quarters of the largest and the piece has stood at the bench for longer than the studio's bench settling days, they are charged at the studio's standard daily rate; otherwise they are charged at the studio's daily rate for a commission not yet settled at the bench."
    bench_day_rate: "Where the quoted total on the commission stands at or above three quarters of the largest value the programme is offered for and the piece has stood at the bench for longer than the studio's bench settling days, the bench days are charged at the studio's daily rate for a commission of high value; where the quoted total stands at or above the smallest value the programme is offered for and below three quarters of the largest and the piece has stood at the bench for longer than the studio's bench settling days, they are charged at the studio's standard daily rate; otherwise they are charged at the studio's daily rate for a commission not yet settled at the bench."
    bench_day_amount: "Each of the five charges that make up the figure reached is rounded half up to two decimal places as it is worked out, and the figure booked is the figure reached less the share settled against an upgrade credit, rounded half up to two decimal places once that share has been taken off."
    credit_available: "Where the customer holds an upgrade registration with credit still available and the credit still available stands at or above the least the customer must spend for that credit to be usable, the studio settles its high share of the figure reached against that credit; where the customer holds an upgrade registration with credit still available and the credit still available stands below that least spend, the studio settles its low share of the figure reached against that credit; otherwise nothing of the figure reached is settled against an upgrade credit."
    credit_minimum_spend: "Where the customer holds an upgrade registration with credit still available and the credit still available stands at or above the least the customer must spend for that credit to be usable, the studio settles its high share of the figure reached against that credit; where the customer holds an upgrade registration with credit still available and the credit still available stands below that least spend, the studio settles its low share of the figure reached against that credit; otherwise nothing of the figure reached is settled against an upgrade credit."
    credit_settlement_pct: "Where the customer holds an upgrade registration with credit still available and the credit still available stands at or above the least the customer must spend for that credit to be usable, the studio settles its high share of the figure reached against that credit; where the customer holds an upgrade registration with credit still available and the credit still available stands below that least spend, the studio settles its low share of the figure reached against that credit; otherwise nothing of the figure reached is settled against an upgrade credit."
    figure_reached: "The charge booked to the commission for a change agreed to the specification is the value of the work the customer has committed to, together with the programme's administration fee for the change, together with the studio's charge for re-opening the commission at the bench, together with the studio's premium for the metal the piece is to be made in, together with the studio's charge for the bench days the change gives back, and the five are added together before any settlement against an upgrade credit is taken."
    result: "Each of the five charges that make up the figure reached is rounded half up to two decimal places as it is worked out, and the figure booked is the figure reached less the share settled against an upgrade credit, rounded half up to two decimal places once that share has been taken off."
  factors:
  - id: administration_fee_multiple
    effect: parameter
    decides: admin_fee_multiple
    bindings: [changes_already_charged, admin_fee_multiple]
    ladder:
    - when: "a charge for a change to the specification already stands booked on the commission and the piece has gone into production"
      value: "K('repeat_change_fee_multiple')"
    - when: "no charge for a change to the specification stands booked on the commission and the piece has gone into production"
      value: "K('in_production_fee_multiple')"
    - when: "otherwise"
      value: "K('published_fee_multiple')"
    baseline:
      admin_fee_multiple: "K('published_fee_multiple')"
    evidence: [history]
    cross_difficulty: null
  - id: bench_reopening_rate
    effect: parameter
    decides: reopen_rate_pct
    bindings: [stages_logged, reopen_rate_pct]
    ladder:
    - when: "the commission stands expedited and a stage of production stands recorded on it"
      value: "P('rush_surcharge_pct')"
    - when: "the commission does not stand expedited and a stage of production stands recorded on it"
      value: "K('standard_reopen_pct')"
    - when: "otherwise"
      value: "K('unstarted_reopen_pct')"
    baseline:
      reopen_rate_pct: "K('unstarted_reopen_pct')"
    evidence: [history]
    cross_difficulty: null
  - id: metal_recasting_premium
    effect: parameter
    decides: metal_premium_pct
    bindings: [casting_stages, metal_premium_pct]
    ladder:
    - when: "the piece is to be made in platinum or in palladium and a casting stage stands recorded on the commission"
      value: "K('platinum_recast_pct')"
    - when: "the piece is to be made in an eighteen karat gold and a casting stage stands recorded on the commission"
      value: "K('gold18_recast_pct')"
    - when: "otherwise"
      value: "K('no_recast_pct')"
    baseline:
      metal_premium_pct: "K('no_recast_pct')"
    evidence: [history]
    cross_difficulty: null
  - id: bench_day_clock_anchor
    effect: method
    decides: bench_day_anchor
    bindings: [stone_setting_stages, final_inspection_stages, bench_day_anchor, bench_days_given_back]
    ladder:
    - when: "a stone setting stage stands recorded on the commission and no final inspection stage stands recorded on it"
      method: "the bench days the change gives back are counted from the date the stone setting stage was reached"
    - when: "a casting stage stands recorded on the commission and no stone setting stage stands recorded on it"
      method: "the bench days the change gives back are counted from the date the casting stage was reached"
    - when: "otherwise"
      method: "the bench days the change gives back are counted from the date production began"
    baseline:
      bench_day_anchor: "F('production_start_date')"
    evidence: [history, date]
    cross_difficulty: null
  - id: bench_daily_rate
    effect: parameter
    decides: bench_day_rate
    bindings: [bench_at_work_days, bench_day_rate]
    ladder:
    - when: "the quoted total on the commission stands at or above three quarters of the largest value the programme is offered for and the piece has stood at the bench for longer than the studio's bench settling days"
      value: "K('high_value_day_rate')"
    - when: "the quoted total stands at or above the smallest value the programme is offered for and below three quarters of the largest and the piece has stood at the bench for longer than the studio's bench settling days"
      value: "K('standard_day_rate')"
    - when: "otherwise"
      value: "K('unstarted_day_rate')"
    baseline:
      bench_day_rate: "K('unstarted_day_rate')"
    evidence: [date, tier_param]
    cross_difficulty: null
  - id: upgrade_credit_settlement
    effect: parameter
    decides: credit_settlement_pct
    bindings: [credit_available, credit_minimum_spend, credit_settlement_pct]
    ladder:
    - when: "the customer holds an upgrade registration with credit still available and the credit still available stands at or above the least the customer must spend for that credit to be usable"
      value: "K('high_credit_settlement_pct')"
    - when: "the customer holds an upgrade registration with credit still available and the credit still available stands below that least spend"
      value: "K('low_credit_settlement_pct')"
    - when: "otherwise"
      value: "K('no_credit_settlement_pct')"
    baseline:
      credit_settlement_pct: "K('no_credit_settlement_pct')"
    evidence: [cross_category]
    cross_difficulty: tradein
  baseline:
    rule: >-
      The charge booked to the commission for a change agreed to the specification is the value of the
      work the customer has committed to, together with the programme's administration fee for the
      change, together with the studio's charge for re-opening the commission at the bench, together
      with the studio's premium for the metal the piece is to be made in, together with the studio's
      charge for the bench days the change gives back, and the five are added together before any
      settlement against an upgrade credit is taken. The value of the work the customer has committed
      to is read from the confirmation of the change standing on the studio's request record, taken at
      the latest date such a confirmation is to take effect from. The administration fee is the
      programme's fee for a change to the specification as the programme sets it. Nothing is charged
      for re-opening the commission at the bench. Nothing is added for the metal the piece is to be
      made in. The bench days the change gives back are counted from the date production began to the
      day the change is priced, and are never fewer than none. They are charged at the studio's daily
      rate for a commission not yet settled at the bench. Nothing of the figure reached is settled
      against an upgrade credit. Each of the five charges that make up the figure reached is rounded
      half up to two decimal places as it is worked out, and the figure booked is the figure reached
      less the share settled against an upgrade credit, rounded half up to two decimal places once
      that share has been taken off.
    params: [published_fee_multiple, unstarted_reopen_pct, no_recast_pct, unstarted_day_rate, no_credit_settlement_pct, change_order_fee]
  inputs:
    history:
    - {table: custom_ledger, aggregate: count, field: custom_entry_id, within_months: null, filters: {event_type: custom_change_order_charged}}
    - {table: custom_ledger, aggregate: count, field: custom_entry_id, within_months: null, filters: {event_type: custom_milestone_logged}}
    - {table: custom_ledger, aggregate: latest, field: posted_date, within_months: null, filters: {event_type: custom_milestone_logged}}
    - {table: custom_intake, aggregate: latest, field: requested_amount, within_months: null, filters: {request_type: change_order}}
    cross_category: [tradein]
- id: custom_ext_metal_market_reprice
  base_policy_refs:
  - custom_quoting_and_repricing
  overwrite:
  - base_policy: custom_quoting_and_repricing
    superseded_clause: >-
      Where the design has not been approved within the programme's metal price revaluation window in
      calendar days, counted from the date the metal price behind the quote was taken, the quote is
      rebuilt at the current metal price.
    replaced_by: >-
      A quote is rebuilt for a movement in the metal market once the price behind it has aged past the
      programme's revaluation window in calendar days, counted from the day the studio's own clock for
      the quote starts running to the day the repricing is booked.
  - base_policy: custom_quoting_and_repricing
    superseded_clause: >-
      On the programmes that pass the metal market through, the difference between the old and the new
      metal price is charged as a price adjustment; on the programmes that do not, the chain absorbs it
      and no adjustment is booked.
    replaced_by: >-
      On the programmes that pass the metal market through, the movement is charged as the studio's
      escalation of the quoted total for each whole period of thirty calendar days by which the price
      has aged past the revaluation window, together with the sourcing uplift on a stone sourced to
      order, and the two are added together before the share passed on and the relief for a late start
      are taken; on the programmes that do not, the chain absorbs it and no adjustment is booked.
  - base_policy: custom_quoting_and_repricing
    superseded_clause: >-
      The revaluation window is counted in whole calendar days from the day the metal price was
      taken, that day counting as day zero, weekends and market holidays included.
    replaced_by: >-
      The days the price has aged are counted in whole calendar days from the day the studio's clock
      for the quote starts, that day counting as day zero, weekends and market holidays included, to
      the day the repricing is booked; the window is taken off them, and what remains is never fewer
      than none; the whole periods of thirty calendar days inside it are counted, and a part period
      is not counted.
  - base_policy: custom_quoting_and_repricing
    superseded_clause: >-
      A stone sourced to order carries the programme's sourcing fee on the stone's cost, and the fee
      is shown as its own line rather than folded into the quote.
    replaced_by: >-
      Where the quote is rebuilt for a movement in the metal market, the sourcing uplift on a stone
      sourced to order is charged within the repricing entry together with the escalation, as one
      entry under the metal market reason, and not as its own line.
  trigger: state_due
  subject:
  - custom_price_adjustment_charged
  computes: metal_adjustment_amount
  target_tool: charge_metal_revaluation_a0bcb90e
  params:
    platinum_escalation_pct: 1.8
    gold18_escalation_pct: 1.1
    standard_escalation_pct: 0.6
    high_metal_price_threshold: 40.0
    unpriced_stone_uplift_pct: 3.0
    house_stone_uplift_pct: 0.0
    financed_open_pass_pct: 60.0
    financed_ended_pass_pct: 85.0
    full_pass_pct: 100.0
    long_start_delay_days: 90
    start_delay_days: 45
    long_start_delay_factor: 0.5
    start_delay_factor: 0.75
    no_start_delay_factor: 1.0
  rule: >-
    A quote is rebuilt for a movement in the metal market once the price behind it has aged past the
    programme's revaluation window in calendar days, counted from the day the studio's own clock for
    the quote starts running to the day the repricing is booked. On the programmes that pass the
    metal market through, the movement is charged as the studio's escalation of the quoted total for
    each whole period of thirty calendar days by which the price has aged past the revaluation
    window, together with the sourcing uplift on a stone sourced to order, and the two are added
    together before the share passed on and the relief for a late start are taken; on the programmes
    that do not, the chain absorbs it and no adjustment is booked. The days the price has aged are
    counted in whole calendar days from the day the studio's clock for the quote starts, that day
    counting as day zero, weekends and market holidays included, to the day the repricing is booked;
    the window is taken off them, and what remains is never fewer than none; the whole periods of
    thirty calendar days inside it are counted, and a part period is not counted. The studio's clock
    for the quote starts on the date the metal price behind the quote was taken. The escalation is
    the studio's standard escalation of the quoted total for each such period. The sourcing uplift
    is taken on the charge for a stone upgrade booked to the commission where one stands, and on the
    quoted total where none stands. Nothing is added for the sourcing of the centre stone. Where the
    quote is rebuilt for a movement in the metal market, the sourcing uplift on a stone sourced to
    order is charged within the repricing entry together with the escalation, as one entry under the
    metal market reason, and not as its own line. The whole of the movement is passed on. The figure
    reached stands as it is. The escalation and the sourcing uplift are each rounded half up to two
    decimal places as they are worked out, and the figure booked is rounded half up to two decimal
    places once the share passed on and the relief have been applied to their sum. Where the design
    stands approved on the commission and a deposit has been received, the studio's clock for the
    quote starts on the date the design was approved; where the design does not stand approved and a
    design fee stands booked on the commission, it starts on the date the commission was opened at
    the consultation; otherwise it starts on the date the metal price behind the quote was taken.
    Where the piece is to be made in platinum or in palladium and the metal price the quote was
    built at stands at or above the studio's high metal price, the escalation is the studio's
    platinum escalation of the quoted total for each such period; where the piece is to be made in
    an eighteen karat gold and the metal price the quote was built at stands at or above the
    studio's high metal price, it is the studio's eighteen karat escalation for each such period;
    otherwise it is the studio's standard escalation of the quoted total for each such period. Where
    the centre stone is one sourced to order and a charge for a stone upgrade stands booked on the
    commission, the sourcing uplift is the programme's stone sourcing fee rate on that charge; where
    the centre stone is one sourced to order and no charge for a stone upgrade stands booked, it is
    the studio's rate for an unpriced sourced stone on the quoted total; otherwise nothing is added
    for the sourcing of the centre stone. Where a promotional financing plan held with the chain
    finances the till transaction the commission was written on and that plan's promotional term has
    not ended, the studio's financed share of the movement is passed on; where such a plan finances
    that till transaction and its promotional term has ended, the studio's settled share of the
    movement is passed on; otherwise the whole of the movement is passed on. Where a deposit has
    been received on the commission and the piece had not gone into production within the studio's
    long start-delay days of the deposit being received, the figure reached is taken at the studio's
    long start-delay fraction; where a deposit has been received and the piece had not gone into
    production within the studio's start-delay days of the deposit being received but within its
    long start-delay days, the figure reached is taken at the studio's start-delay fraction;
    otherwise the figure reached stands as it is.
  prerequisite: []
  cross_category:
  - category: financing
    as: branch
    note: the promotional financing plan on the same till transaction decides the share of the movement the studio passes on.
  compute:
  - deposits_received: "COUNT('custom_ledger', date_field='posted_date', event_type='custom_deposit_paid')"
  - design_fee_entries: "COUNT('custom_ledger', date_field='posted_date', event_type='custom_quote_posted', charge_reason='design_fee')"
  - basis_anchor: "F('design_approved_date') if (F('design_approved_date') != '' and deposits_received > 0) else (F('consultation_date') if (F('design_approved_date') == '' and design_fee_entries > 0) else F('metal_price_basis_date'))"
  - aged_days: "MX(0, DAYS(basis_anchor, NOW) - P('metal_price_revaluation_window_days'))"
  - periods_past: "int(aged_days / 30)"
  - quote_metal_price: "LATEST('custom_ledger','metal_price_per_gram', date_field='posted_date', event_type='custom_quote_posted', charge_reason='original_quote')"
  - escalation_pct: "K('platinum_escalation_pct') if ((F('metal_choice') == 'platinum_950' or F('metal_choice') == 'palladium_500') and quote_metal_price >= K('high_metal_price_threshold')) else (K('gold18_escalation_pct') if ((F('metal_choice') == 'yellow_gold_18k' or F('metal_choice') == 'white_gold_18k' or F('metal_choice') == 'rose_gold_18k') and quote_metal_price >= K('high_metal_price_threshold')) else K('standard_escalation_pct'))"
  - escalation_amount: "RND(F('quoted_total') * escalation_pct / 100 * periods_past, 2)"
  - stone_upgrade_charges: "SUM('custom_ledger','amount', date_field='posted_date', event_type='custom_price_adjustment_charged', charge_reason='stone_upgrade')"
  - sourcing_uplift_pct: "P('stone_sourcing_fee_pct') if (F('center_stone_source') == 'sourced_to_order' and stone_upgrade_charges > 0) else (K('unpriced_stone_uplift_pct') if (F('center_stone_source') == 'sourced_to_order' and stone_upgrade_charges == 0) else K('house_stone_uplift_pct'))"
  - sourcing_uplift_base: "stone_upgrade_charges if stone_upgrade_charges > 0 else F('quoted_total')"
  - sourcing_uplift: "RND(sourcing_uplift_base * sourcing_uplift_pct / 100, 2)"
  - plan_on_receipt: "1 if EXISTS('financing', sales_receipt_number=F('sales_receipt_number')) else 0"
  - plan_promo_end: "CFIELD('financing','promo_end_date', sales_receipt_number=F('sales_receipt_number')) or ''"
  - pass_share_pct: "K('financed_open_pass_pct') if (plan_on_receipt == 1 and plan_promo_end > NOW) else (K('financed_ended_pass_pct') if (plan_on_receipt == 1 and plan_promo_end <= NOW) else K('full_pass_pct'))"
  - deposit_received_date: "LATEST('custom_ledger','posted_date', date_field='posted_date', event_type='custom_deposit_paid')"
  - deposit_wait_days: "DAYS(deposit_received_date, NOW) if deposit_received_date != None else 0"
  - market_relief_factor: "K('long_start_delay_factor') if (deposit_wait_days > K('long_start_delay_days') and F('production_start_date') == '') else (K('start_delay_factor') if (deposit_wait_days > K('start_delay_days') and deposit_wait_days <= K('long_start_delay_days') and F('production_start_date') == '') else K('no_start_delay_factor'))"
  - result: "RND((escalation_amount + sourcing_uplift) * pass_share_pct / 100 * market_relief_factor, 2)"
  compute_basis:
    deposits_received: "Where the design stands approved on the commission and a deposit has been received, the studio's clock for the quote starts on the date the design was approved; where the design does not stand approved and a design fee stands booked on the commission, it starts on the date the commission was opened at the consultation; otherwise it starts on the date the metal price behind the quote was taken."
    design_fee_entries: "Where the design stands approved on the commission and a deposit has been received, the studio's clock for the quote starts on the date the design was approved; where the design does not stand approved and a design fee stands booked on the commission, it starts on the date the commission was opened at the consultation; otherwise it starts on the date the metal price behind the quote was taken."
    basis_anchor: "Where the design stands approved on the commission and a deposit has been received, the studio's clock for the quote starts on the date the design was approved; where the design does not stand approved and a design fee stands booked on the commission, it starts on the date the commission was opened at the consultation; otherwise it starts on the date the metal price behind the quote was taken."
    aged_days: "The days the price has aged are counted in whole calendar days from the day the studio's clock for the quote starts, that day counting as day zero, weekends and market holidays included, to the day the repricing is booked; the window is taken off them, and what remains is never fewer than none; the whole periods of thirty calendar days inside it are counted, and a part period is not counted."
    periods_past: "The days the price has aged are counted in whole calendar days from the day the studio's clock for the quote starts, that day counting as day zero, weekends and market holidays included, to the day the repricing is booked; the window is taken off them, and what remains is never fewer than none; the whole periods of thirty calendar days inside it are counted, and a part period is not counted."
    quote_metal_price: "Where the piece is to be made in platinum or in palladium and the metal price the quote was built at stands at or above the studio's high metal price, the escalation is the studio's platinum escalation of the quoted total for each such period; where the piece is to be made in an eighteen karat gold and the metal price the quote was built at stands at or above the studio's high metal price, it is the studio's eighteen karat escalation for each such period; otherwise it is the studio's standard escalation of the quoted total for each such period."
    escalation_pct: "Where the piece is to be made in platinum or in palladium and the metal price the quote was built at stands at or above the studio's high metal price, the escalation is the studio's platinum escalation of the quoted total for each such period; where the piece is to be made in an eighteen karat gold and the metal price the quote was built at stands at or above the studio's high metal price, it is the studio's eighteen karat escalation for each such period; otherwise it is the studio's standard escalation of the quoted total for each such period."
    escalation_amount: "The escalation and the sourcing uplift are each rounded half up to two decimal places as they are worked out, and the figure booked is rounded half up to two decimal places once the share passed on and the relief have been applied to their sum."
    stone_upgrade_charges: "Where the centre stone is one sourced to order and a charge for a stone upgrade stands booked on the commission, the sourcing uplift is the programme's stone sourcing fee rate on that charge; where the centre stone is one sourced to order and no charge for a stone upgrade stands booked, it is the studio's rate for an unpriced sourced stone on the quoted total; otherwise nothing is added for the sourcing of the centre stone."
    sourcing_uplift_pct: "Where the centre stone is one sourced to order and a charge for a stone upgrade stands booked on the commission, the sourcing uplift is the programme's stone sourcing fee rate on that charge; where the centre stone is one sourced to order and no charge for a stone upgrade stands booked, it is the studio's rate for an unpriced sourced stone on the quoted total; otherwise nothing is added for the sourcing of the centre stone."
    sourcing_uplift_base: "The sourcing uplift is taken on the charge for a stone upgrade booked to the commission where one stands, and on the quoted total where none stands."
    sourcing_uplift: "The escalation and the sourcing uplift are each rounded half up to two decimal places as they are worked out, and the figure booked is rounded half up to two decimal places once the share passed on and the relief have been applied to their sum."
    plan_on_receipt: "Where a promotional financing plan held with the chain finances the till transaction the commission was written on and that plan's promotional term has not ended, the studio's financed share of the movement is passed on; where such a plan finances that till transaction and its promotional term has ended, the studio's settled share of the movement is passed on; otherwise the whole of the movement is passed on."
    plan_promo_end: "Where a promotional financing plan held with the chain finances the till transaction the commission was written on and that plan's promotional term has not ended, the studio's financed share of the movement is passed on; where such a plan finances that till transaction and its promotional term has ended, the studio's settled share of the movement is passed on; otherwise the whole of the movement is passed on."
    pass_share_pct: "Where a promotional financing plan held with the chain finances the till transaction the commission was written on and that plan's promotional term has not ended, the studio's financed share of the movement is passed on; where such a plan finances that till transaction and its promotional term has ended, the studio's settled share of the movement is passed on; otherwise the whole of the movement is passed on."
    deposit_received_date: "Where a deposit has been received on the commission and the piece had not gone into production within the studio's long start-delay days of the deposit being received, the figure reached is taken at the studio's long start-delay fraction; where a deposit has been received and the piece had not gone into production within the studio's start-delay days of the deposit being received but within its long start-delay days, the figure reached is taken at the studio's start-delay fraction; otherwise the figure reached stands as it is."
    deposit_wait_days: "Where a deposit has been received on the commission and the piece had not gone into production within the studio's long start-delay days of the deposit being received, the figure reached is taken at the studio's long start-delay fraction; where a deposit has been received and the piece had not gone into production within the studio's start-delay days of the deposit being received but within its long start-delay days, the figure reached is taken at the studio's start-delay fraction; otherwise the figure reached stands as it is."
    market_relief_factor: "Where a deposit has been received on the commission and the piece had not gone into production within the studio's long start-delay days of the deposit being received, the figure reached is taken at the studio's long start-delay fraction; where a deposit has been received and the piece had not gone into production within the studio's start-delay days of the deposit being received but within its long start-delay days, the figure reached is taken at the studio's start-delay fraction; otherwise the figure reached stands as it is."
    result: "The escalation and the sourcing uplift are each rounded half up to two decimal places as they are worked out, and the figure booked is rounded half up to two decimal places once the share passed on and the relief have been applied to their sum."
  factors:
  - id: revaluation_clock_anchor
    effect: method
    decides: basis_anchor
    bindings: [deposits_received, design_fee_entries, basis_anchor]
    ladder:
    - when: "the design stands approved on the commission and a deposit has been received"
      method: "the studio's clock for the quote starts on the date the design was approved"
    - when: "the design does not stand approved and a design fee stands booked on the commission"
      method: "the studio's clock for the quote starts on the date the commission was opened at the consultation"
    - when: "otherwise"
      method: "the studio's clock for the quote starts on the date the metal price behind the quote was taken"
    baseline:
      basis_anchor: "F('metal_price_basis_date')"
    evidence: [history, date]
    cross_difficulty: null
  - id: metal_escalation_rate
    effect: parameter
    decides: escalation_pct
    bindings: [quote_metal_price, escalation_pct]
    ladder:
    - when: "the piece is to be made in platinum or in palladium and the metal price the quote was built at stands at or above the studio's high metal price"
      value: "K('platinum_escalation_pct')"
    - when: "the piece is to be made in an eighteen karat gold and the metal price the quote was built at stands at or above the studio's high metal price"
      value: "K('gold18_escalation_pct')"
    - when: "otherwise"
      value: "K('standard_escalation_pct')"
    baseline:
      escalation_pct: "K('standard_escalation_pct')"
    evidence: [history]
    cross_difficulty: null
  - id: stone_sourcing_uplift_rate
    effect: parameter
    decides: sourcing_uplift_pct
    bindings: [stone_upgrade_charges, sourcing_uplift_pct]
    ladder:
    - when: "the centre stone is one sourced to order and a charge for a stone upgrade stands booked on the commission"
      value: "P('stone_sourcing_fee_pct')"
    - when: "the centre stone is one sourced to order and no charge for a stone upgrade stands booked"
      value: "K('unpriced_stone_uplift_pct')"
    - when: "otherwise"
      value: "K('house_stone_uplift_pct')"
    baseline:
