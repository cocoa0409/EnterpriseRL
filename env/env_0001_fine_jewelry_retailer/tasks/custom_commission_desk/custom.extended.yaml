    bindings: [plan_on_receipt, plan_promo_end, pass_share_pct]
    ladder:
    - when: "a promotional financing plan held with the chain finances the till transaction the commission was written on and that plan's promotional term has not ended"
      value: "K('financed_open_pass_pct')"
    - when: "such a plan finances that till transaction and its promotional term has ended"
      value: "K('financed_ended_pass_pct')"
    - when: "otherwise"
      value: "K('full_pass_pct')"
    baseline:
      pass_share_pct: "K('full_pass_pct')"
    evidence: [cross_category]
    cross_difficulty: financing
  - id: late_start_relief_fraction
    effect: method
    decides: market_relief_factor
    bindings: [deposit_received_date, deposit_wait_days, market_relief_factor]
    ladder:
    - when: "a deposit has been received on the commission and the piece had not gone into production within the studio's long start-delay days of the deposit being received"
      method: "the figure reached is taken at the studio's long start-delay fraction"
    - when: "a deposit has been received and the piece had not gone into production within the studio's start-delay days of the deposit being received but within its long start-delay days"
      method: "the figure reached is taken at the studio's start-delay fraction"
    - when: "otherwise"
      method: "the figure reached stands as it is"
    baseline:
      market_relief_factor: "K('no_start_delay_factor')"
    evidence: [history, date]
    cross_difficulty: null
  baseline:
    rule: >-
      A quote is rebuilt for a movement in the metal market once the price behind it has aged past
      the programme's revaluation window in calendar days, counted from the day the studio's own
      clock for the quote starts running to the day the repricing is booked. On the programmes that
      pass the metal market through, the movement is charged as the studio's escalation of the
      quoted total for each whole period of thirty calendar days by which the price has aged past
      the revaluation window, together with the sourcing uplift on a stone sourced to order, and the
      two are added together before the share passed on and the relief for a late start are taken;
      on the programmes that do not, the chain absorbs it and no adjustment is booked. The days the
      price has aged are counted in whole calendar days from the day the studio's clock for the
      quote starts, that day counting as day zero, weekends and market holidays included, to the day
      the repricing is booked; the window is taken off them, and what remains is never fewer than
      none; the whole periods of thirty calendar days inside it are counted, and a part period is
      not counted. The studio's clock for the quote starts on the date the metal price behind the
      quote was taken. The escalation is the studio's standard escalation of the quoted total for
      each such period. The sourcing uplift is taken on the charge for a stone upgrade booked to the
      commission where one stands, and on the quoted total where none stands. Nothing is added for
      the sourcing of the centre stone. The whole of the movement is passed on. The figure reached
      stands as it is. The escalation and the sourcing uplift are each rounded half up to two
      decimal places as they are worked out, and the figure booked is rounded half up to two decimal
      places once the share passed on and the relief have been applied to their sum.
    params: [standard_escalation_pct, house_stone_uplift_pct, full_pass_pct, no_start_delay_factor, metal_price_revaluation_window_days]
  inputs:
    history:
    - {table: custom_ledger, aggregate: count, field: custom_entry_id, within_months: null, filters: {event_type: custom_deposit_paid}}
    - {table: custom_ledger, aggregate: latest, field: metal_price_per_gram, within_months: null, filters: {event_type: custom_quote_posted}}
    - {table: custom_ledger, aggregate: sum, field: amount, within_months: null, filters: {event_type: custom_price_adjustment_charged}}
    cross_category: [financing]
- id: custom_ext_closure_consent
  base_policy_refs:
  - custom_cancellation_and_forfeit
  - custom_agg_commission_portfolio
  overwrite:
  - base_policy: custom_cancellation_and_forfeit
    superseded_clause: >-
      A commission is cancelled without the heavier forfeit only when the request reaches the studio
      within the cancellation window in calendar days, counted from the date the customer approved the
      design.
    replaced_by: >-
      Where a stage of production stands recorded on the commission and the piece has not been
      recorded as finished, the share is the programme's heavier forfeit share; where no stage of
      production stands recorded and the closure is confirmed after the programme's cancellation
      window has run in calendar days from the date the design was approved, the share is the
      studio's late closure share; otherwise the share is the programme's lighter forfeit share.
  - base_policy: custom_cancellation_and_forfeit
    superseded_clause: >-
      Cancelled before production begins, the commission forfeits the programme's lighter share of
      the quoted total; cancelled once production has begun, it forfeits the programme's heavier
      share
    replaced_by: >-
      Where a stage of production stands recorded on the commission and the piece has not been
      recorded as finished, the share is the programme's heavier forfeit share; where no stage of
      production stands recorded and the closure is confirmed after the programme's cancellation
      window has run in calendar days from the date the design was approved, the share is the
      studio's late closure share; otherwise the share is the programme's lighter forfeit share.
  - base_policy: custom_cancellation_and_forfeit
    superseded_clause: >-
      the deposit's non-refundable share is never returned in either case
    replaced_by: >-
      The share of the deposit the programme marks as non-refundable is not kept on a closure over
      and above the sum the studio keeps as stated here, and it sets no floor beneath that sum.
  - base_policy: custom_agg_commission_portfolio
    superseded_clause: >-
      it is this figure, not the quoted total, that any forfeit is taken against
    replaced_by: >-
      The forfeit share is taken against the quoted total recorded on the commission and not against
      what the customer has paid to date.
  trigger: on_request
  subject:
  - custom_order_cancelled
  computes: retained_amount
  target_tool: confirm_commission_closure_3c2f355d
  params:
    late_closure_forfeit_pct: 35.0
    full_design_fee_pct: 100.0
    part_design_fee_pct: 60.0
    no_design_fee_pct: 0.0
    unstarted_metal_kept_pct: 40.0
    started_metal_kept_pct: 100.0
    no_metal_kept_pct: 0.0
    receipted_credit_pct: 30.0
    unreceipted_credit_pct: 12.0
    no_credit_restored_pct: 0.0
    overdue_days: 45
    overdue_relief_factor: 0.6
    late_relief_factor: 0.85
    no_relief_factor: 1.0
  rule: >-
    The sum the studio keeps when a commission is closed at the customer's request is the forfeit
    share of the quoted total, together with the share of the design fee booked to the commission
    that the studio keeps, together with the share of the repricings for the metal market booked to
    the commission that it keeps, the three added together before anything is taken back out of an
    upgrade credit and before any relief is applied. This settlement is for a commission whose
    design stands approved when it is closed; a commission closed before its design is approved is
    outside it and is closed on the programme's own terms for that case. The sum the studio keeps is
    settled only after the commission's entries carry the repricing due where the metal price behind
    the quote has aged past the programme's revaluation window. The forfeit share is taken against
    the quoted total recorded on the commission and not against what the customer has paid to date.
    The share is the programme's lighter forfeit share. The share of the deposit the programme marks
    as non-refundable is not kept on a closure over and above the sum the studio keeps as stated
    here, and it sets no floor beneath that sum. None of the design fee booked to the commission is
    kept. None of the repricings for the metal market booked to the commission is kept. Nothing is
    taken back out of an upgrade credit. The sum reached stands as it is. The forfeit share of the
    quoted total, the design fee kept, the repricing kept and the amount taken back out of an
    upgrade credit are each rounded half up to two decimal places as they are worked out; the amount
    taken back out of an upgrade credit is a share of the three added together and is taken off that
    sum, and what remains is taken at the relief and rounded half up to two decimal places once.
    Where a stage of production stands recorded on the commission and the piece has not been
    recorded as finished, the share is the programme's heavier forfeit share; where no stage of
    production stands recorded and the closure is confirmed after the programme's cancellation
    window has run in calendar days from the date the design was approved, the share is the studio's
    late closure share; otherwise the share is the programme's lighter forfeit share. Where every
    design revision included in the quoted total has been drawn and a revision beyond the included
    allowance stands on the commission, the design fee booked to the commission is kept in full;
    where a design revision has been drawn and no revision beyond the included allowance stands, the
    studio's part share of the design fee is kept; otherwise none of the design fee booked to the
    commission is kept. Where a repricing for the metal market stands booked on the commission and
    the piece has not gone into production, the studio's unstarted share of those repricings is
    kept; where a repricing for the metal market stands booked and the piece has gone into
    production, the whole of those repricings is kept; otherwise none of the repricings for the
    metal market booked to the commission is kept. Where the customer holds an upgrade registration
    standing part spent with credit still available and the chain sold the piece that registration
    was traded against, the studio's receipted share of the sum reached is taken back out of that
    credit; where the customer holds an upgrade registration standing part spent with credit still
    available and the chain did not sell the piece traded against it, the studio's unreceipted share
    is taken back out of that credit; otherwise nothing is taken back out of an upgrade credit.
    Where the piece stands past the date it was promised for by more than the studio's overdue days
    and has not been recorded as finished, the sum reached is taken at the studio's overdue relief
    fraction; where the piece stands past the date it was promised for by not more than the studio's
    overdue days and has not been recorded as finished, it is taken at the studio's late relief
    fraction; otherwise the sum reached stands as it is.
  prerequisite:
  - problem: custom_ext_metal_market_reprice
    kind: value_input
    gate: metal_adjustments
    form: state
    policy_source: >-
      The sum the studio keeps is settled only after the commission's entries carry the repricing due
      where the metal price behind the quote has aged past the programme's revaluation window.
    condition: >-
      The commission's entries carry a repricing for the metal market covering the ageing of the metal
      price behind the quote past the programme's revaluation window.
    resolved_by: charge_metal_revaluation_a0bcb90e
    effect: >-
      Once the repricing stands on the commission's entries, the repricings for the metal market the
      studio keeps a share of stop reading as nothing and take the value of that entry.
  cross_category:
  - category: tradein
    as: branch
    note: the customer's live upgrade registration and the receipt behind the piece traded against it decide the share taken back out of that credit.
  compute:
  - production_stages: "COUNT('custom_ledger', date_field='posted_date', event_type='custom_milestone_logged')"
  - days_since_approval: "DAYS(F('design_approved_date'), NOW)"
  - forfeit_pct: "P('cancellation_forfeit_pct_after_production') if (production_stages > 0 and F('completed_date') == '') else (K('late_closure_forfeit_pct') if (production_stages == 0 and days_since_approval > P('cancellation_window_days')) else P('cancellation_forfeit_pct_before_production'))"
  - share_amount: "RND(F('quoted_total') * forfeit_pct / 100, 2)"
  - revisions_drawn: "COUNT('custom_ledger', date_field='posted_date', event_type='custom_design_revision_used')"
  - overage_revisions: "COUNT('custom_ledger', date_field='posted_date', event_type='custom_design_revision_used', charge_reason='revision_overage')"
  - design_fee_kept_pct: "K('full_design_fee_pct') if (revisions_drawn >= P('included_design_revisions') and overage_revisions > 0) else (K('part_design_fee_pct') if (revisions_drawn > 0 and overage_revisions == 0) else K('no_design_fee_pct'))"
  - design_fee_booked: "ABS(SUM('custom_ledger','amount', date_field='posted_date', event_type='custom_quote_posted', charge_reason='design_fee'))"
  - design_fee_kept: "RND(design_fee_booked * design_fee_kept_pct / 100, 2)"
  - metal_adjustments: "SUM('custom_ledger','amount', date_field='posted_date', event_type='custom_price_adjustment_charged', charge_reason='metal_market')"
  - metal_kept_pct: "K('unstarted_metal_kept_pct') if (metal_adjustments > 0 and F('production_start_date') == '') else (K('started_metal_kept_pct') if (metal_adjustments > 0 and F('production_start_date') != '') else K('no_metal_kept_pct'))"
  - metal_kept: "RND(metal_adjustments * metal_kept_pct / 100, 2)"
  - credit_remaining: "float(CFIELD('tradein','remaining_credit', status='partially_redeemed') or 0)"
  - credit_original_receipt: "CFIELD('tradein','original_sales_receipt_number', status='partially_redeemed') or ''"
  - credit_restored_pct: "K('receipted_credit_pct') if (credit_remaining > 0 and credit_original_receipt != '') else (K('unreceipted_credit_pct') if (credit_remaining > 0 and credit_original_receipt == '') else K('no_credit_restored_pct'))"
  - subtotal_kept: "share_amount + design_fee_kept + metal_kept"
  - credit_restored: "RND(subtotal_kept * credit_restored_pct / 100, 2)"
  - days_past_promise: "DAYS(F('promised_delivery_date'), NOW)"
  - closure_relief_factor: "K('overdue_relief_factor') if (days_past_promise > K('overdue_days') and F('completed_date') == '') else (K('late_relief_factor') if (days_past_promise > 0 and days_past_promise <= K('overdue_days') and F('completed_date') == '') else K('no_relief_factor'))"
  - result: "RND((subtotal_kept - credit_restored) * closure_relief_factor, 2)"
