    no_model_charge: 0.0
    unset_stone_handling_pct: 2.0
    house_stone_handling_pct: 0.0
    metal_moved_late_factor: 0.85
    metal_moved_early_factor: 0.7
    no_metal_move_factor: 1.0
  rule: >-
    A change to the specification agreed once the design has been approved is priced first as the
    value of the work it puts back on the bench, and that value is what the customer commits to when
    the studio takes their agreement down. The value of the work is the charge for the design
    revisions the change puts beyond the allowance included in the quoted total, together with the
    charge for a rendering or a model the programme does not include, together with the charge for
    handling the centre stone, and the three are added together before anything further is done to
    the figure. The revisions the change puts beyond the included allowance are counted as the
    revisions already drawn on the commission plus the one the change calls for, less the revisions
    the programme includes in the quoted total, and never fewer than none. Nothing is charged for the
    revisions the change calls for. Nothing is charged for a rendering or a model. Nothing is charged
    for handling the centre stone. What the commission is worth is read as the quoted total recorded
    on the commission together with every repricing booked to it. The value reached stands as it is.
    The figure that results is rounded half up to two decimal places, and the rounding is done once,
    on that figure alone. Where every design revision included in the quoted total has already been
    drawn and the piece has gone into production, each revision beyond the included allowance is
    charged at the studio's in-production multiple of the programme's published charge for an
    additional revision; where every included revision has already been drawn and the piece has not
    gone into production, each is charged at the studio's published multiple of that charge;
    otherwise nothing is charged for the revisions the change calls for. Where the programme includes
    neither a computer rendering nor a wax model in the quoted total and a design revision has
    already been drawn on the commission, both the rendering and the model are charged at the
    studio's published figures for them; where the programme includes a computer rendering but not a
    wax model in the quoted total and a design revision has already been drawn on the commission,
    only the model is charged at the studio's published figure for it; otherwise nothing is charged
    for a rendering or a model. Where the centre stone is one the customer supplied and a stone
    setting stage stands recorded on the commission, handling the centre stone is charged at the
    programme's stone sourcing fee rate on what the commission is worth; where the centre stone is
    one the customer supplied and no stone setting stage stands recorded on the commission, it is
    charged at the studio's published rate for an unset supplied stone on what the commission is
    worth; otherwise nothing is charged for handling the centre stone. Where the commission was
    written on a till transaction that a promotional financing plan held with the chain finances and
    that plan still stands open, what the commission is worth is read as the financed amount on that
    plan together with the amount paid at the till when the sale was written; where the commission
    was written on such a till transaction and that plan no longer stands open, what the commission
    is worth is read as the financed amount on that plan alone; otherwise what the commission is
    worth is read as the quoted total recorded on the commission together with every repricing booked
    to it. Where a repricing for a movement in the metal market stands booked on the commission and a
    casting stage stands recorded on it, the value reached is taken at the studio's late fraction for
    a market movement already passed on; where a repricing for a movement in the metal market stands
    booked on the commission and no casting stage stands recorded on it, the value reached is taken
    at the studio's early fraction for a market movement already passed on; otherwise the value
    reached stands as it is.
