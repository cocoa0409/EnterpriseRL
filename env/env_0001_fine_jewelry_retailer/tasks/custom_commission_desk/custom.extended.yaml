  baseline:
    rule: >-
      The sum the studio keeps when a commission is closed at the customer's request is the forfeit
      share of the quoted total, together with the share of the design fee booked to the commission
      that the studio keeps, together with the share of the repricings for the metal market booked
      to the commission that it keeps, the three added together before anything is taken back out of
      an upgrade credit and before any relief is applied. This settlement is for a commission whose
      design stands approved when it is closed; a commission closed before its design is approved is
      outside it and is closed on the programme's own terms for that case. The forfeit share is
      taken against the quoted total recorded on the commission and not against what the customer
      has paid to date. The share is the programme's lighter forfeit share. The share of the deposit
      the programme marks as non-refundable is not kept on a closure over and above the sum the
      studio keeps as stated here, and it sets no floor beneath that sum. None of the design fee
      booked to the commission is kept. None of the repricings for the metal market booked to the
      commission is kept. Nothing is taken back out of an upgrade credit. The sum reached stands as
      it is. The forfeit share of the quoted total, the design fee kept, the repricing kept and the
      amount taken back out of an upgrade credit are each rounded half up to two decimal places as
      they are worked out; the amount taken back out of an upgrade credit is a share of the three
      added together and is taken off that sum, and what remains is taken at the relief and rounded
      half up to two decimal places once.
    params: [no_design_fee_pct, no_metal_kept_pct, no_credit_restored_pct, no_relief_factor, cancellation_forfeit_pct_before_production]
  inputs:
    history:
    - {table: custom_ledger, aggregate: count, field: custom_entry_id, within_months: null, filters: {event_type: custom_milestone_logged}}
    - {table: custom_ledger, aggregate: count, field: custom_entry_id, within_months: null, filters: {event_type: custom_design_revision_used}}
    - {table: custom_ledger, aggregate: sum, field: amount, within_months: null, filters: {event_type: custom_quote_posted}}
    - {table: custom_ledger, aggregate: sum, field: amount, within_months: null, filters: {event_type: custom_price_adjustment_charged}}
    cross_category: [tradein]
- id: custom_ext_closure_refund
  base_policy_refs:
  - custom_cancellation_and_forfeit
  - custom_agg_commission_portfolio
  overwrite:
  - base_policy: custom_cancellation_and_forfeit
    superseded_clause: >-
      The refund is what the customer has paid to date less what is forfeited, and where the forfeit
      exceeds what was paid nothing further is collected from the customer.
    replaced_by: >-
      The refund paid back on a commission closed at the customer's request is what the customer has put
      into the commission less the sum the studio keeps, less the holdback against placing the centre
      stone elsewhere, plus the goodwill credit for a design that took too long, plus the premiums
      returned on the coverage that was to come with the piece, less the charges for revisions beyond
      the included allowance that are set off against it, and it is never less than nothing.
  - base_policy: custom_agg_commission_portfolio
    superseded_clause: >-
      What the customer has paid to date on a commission is read as the sum of the deposits and
      staged payments booked to that commission
    replaced_by: >-
      Where a promotional financing plan held with the chain finances the till transaction the
      commission was written on and that plan still stands active, what the customer has put into
      the commission is read as the payments settled on that plan together with the amount paid at
      the till when the sale was written; where such a plan finances that till transaction and no
      longer stands active, it is read as the financed amount on that plan together with the amount
      paid at the till; otherwise it is read as the deposits and staged payments booked to the
      commission.
  - base_policy: custom_cancellation_and_forfeit
    superseded_clause: >-
      the deposit's non-refundable share is never returned in either case
    replaced_by: >-
      Nothing is held back from the refund on account of the share of the deposit the programme
      marks as non-refundable, the sum the studio keeps standing in place of it.
  trigger: on_request
  subject:
  - custom_refund_issued
  computes: refund_amount
  target_tool: issue_commission_refund_b90496cb
  params:
    large_stone_carat: 3.0
    large_stone_holdback_pct: 6.0
    small_stone_holdback_pct: 2.5
    no_stone_holdback_pct: 0.0
    long_design_delay_days: 70
    design_delay_days: 35
    major_goodwill_pct: 4.0
    minor_goodwill_pct: 2.0
    no_goodwill_pct: 0.0
    full_overage_setoff_pct: 100.0
    part_overage_setoff_pct: 50.0
    no_overage_setoff_pct: 0.0
    unclaimed_coverage_pct: 100.0
    claimed_coverage_pct: 50.0
    no_coverage_pct: 0.0
  rule: >-
    The refund paid back on a commission closed at the customer's request is what the customer has
    put into the commission less the sum the studio keeps, less the holdback against placing the
    centre stone elsewhere, plus the goodwill credit for a design that took too long, plus the
    premiums returned on the coverage that was to come with the piece, less the charges for
    revisions beyond the included allowance that are set off against it, and it is never less than
    nothing. The refund is worked out only after the studio's request record carries the customer's
    own confirmation of the closure and of the sum the studio keeps. The sum the studio keeps is
    read from the confirmation of the closure standing on the studio's request record, taken at the
    latest date such a confirmation is to take effect from, and what the customer has put in less
    that sum is never fewer than nothing; the holdback and the goodwill credit are each a share of
    that remainder. What the customer has put into the commission is what they have paid to date on
    it. What the customer has put into the commission is read as the deposits and staged payments
    booked to the commission. Nothing is held back against placing the centre stone elsewhere. No
    goodwill credit is given for a design that took too long. Nothing is returned for the coverage
    that was to come with the piece. Nothing is set off for revisions beyond the included allowance.
    Nothing is held back from the refund on account of the share of the deposit the programme marks
    as non-refundable, the sum the studio keeps standing in place of it. The holdback, the goodwill
    credit, the premiums returned and the amount set off are each rounded half up to two decimal
    places as they are worked out, and the figure paid back is rounded half up to two decimal places
    once they have been taken off and added on. Where a promotional financing plan held with the
    chain finances the till transaction the commission was written on and that plan still stands
    active, what the customer has put into the commission is read as the payments settled on that
    plan together with the amount paid at the till when the sale was written; where such a plan
    finances that till transaction and no longer stands active, it is read as the financed amount on
    that plan together with the amount paid at the till; otherwise it is read as the deposits and
    staged payments booked to the commission. Where the centre stone the commission is built around
    weighs at or above the studio's large stone weight and no stage of production stands recorded on
    the commission, the studio's large stone holdback is held back against placing the stone
    elsewhere; where the centre stone weighs at or above the smallest weight the programme will
    build around and below the studio's large stone weight and no stage of production stands
    recorded, the studio's small stone holdback is held back; otherwise nothing is held back against
    placing the centre stone elsewhere. Where more than the studio's long design delay days passed
    between the commission being opened at the consultation and the design being approved and no
    stage of production stands recorded on the commission, the studio's major goodwill credit is
    given; where more than the studio's design delay days but not more than its long design delay
    days passed between those two dates and no stage of production stands recorded, the studio's
    minor goodwill credit is given; otherwise no goodwill credit is given for a design that took too
    long. Where a charge for a revision beyond the included allowance stands booked on the
    commission and what the customer still owes on the commission stands above those charges, the
    whole of them is set off against the refund; where such a charge stands booked and what the
    customer still owes stands at or below those charges, the studio's part share of them is set
    off; otherwise nothing is set off for revisions beyond the included allowance. Where the
    customer holds coverage standing in force on which premiums have been paid and against which no
    claim has been settled, the premiums paid on that coverage are returned in full; where the
    customer holds coverage standing in force on which premiums have been paid and against which a
    claim has been settled, the studio's claimed share of those premiums is returned; otherwise
    nothing is returned for the coverage that was to come with the piece.
  prerequisite:
  - problem: custom_ext_closure_consent
    kind: value_input
    gate: retained_confirmed
    form: state
    policy_source: >-
      The refund is worked out only after the studio's request record carries the customer's own
      confirmation of the closure and of the sum the studio keeps.
    condition: >-
      The studio's request record carries a confirmation of the closure, standing as confirmed by the
      customer and bearing the sum the studio keeps.
    resolved_by: confirm_commission_closure_3c2f355d
    effect: >-
      Once the customer's confirmation of the closure stands on the studio's request record, the sum the
      studio keeps is read from it instead of being absent altogether.
  cross_category:
  - category: financing
    as: branch
    note: the promotional financing plan on the same till transaction decides which record what the customer has put into the commission is read from.
  - category: protection
    as: branch
    note: the coverage the customer holds decides the share of its premiums returned with the refund.
  compute:
  - plan_on_receipt: "1 if EXISTS('financing', sales_receipt_number=F('sales_receipt_number')) else 0"
  - plan_status: "CFIELD('financing','status', sales_receipt_number=F('sales_receipt_number')) or ''"
  - plan_down_payment: "float(CFIELD('financing','down_payment_amount', sales_receipt_number=F('sales_receipt_number')) or 0)"
  - plan_principal: "float(CFIELD('financing','original_principal', sales_receipt_number=F('sales_receipt_number')) or 0)"
  - plan_settled_payments: "ABS(XSUM('financing','financing_ledger','amount', date_field='posted_date', event_type='financing_payment_posted', payment_outcome='settled'))"
  - commission_payments: "ABS(SUM('custom_ledger','amount', date_field='posted_date', event_type='custom_deposit_paid')) + ABS(SUM('custom_ledger','amount', date_field='posted_date', event_type='custom_progress_payment_paid'))"
  - paid_to_date: "(plan_settled_payments + plan_down_payment) if (plan_on_receipt == 1 and plan_status == 'active') else ((plan_principal + plan_down_payment) if (plan_on_receipt == 1 and plan_status != 'active') else commission_payments)"
  - retained_confirmed: "LATEST('custom_intake','requested_amount', date_field='effective_date', request_type='cancellation', request_status='customer_confirmed')"
  - net_refund: "MX(0, paid_to_date - retained_confirmed)"
  - stages_recorded: "COUNT('custom_ledger', date_field='posted_date', event_type='custom_milestone_logged')"
  - stone_holdback_pct: "K('large_stone_holdback_pct') if (F('center_stone_carat') >= K('large_stone_carat') and stages_recorded == 0) else (K('small_stone_holdback_pct') if (F('center_stone_carat') >= P('center_stone_min_carat') and F('center_stone_carat') < K('large_stone_carat') and stages_recorded == 0) else K('no_stone_holdback_pct'))"
  - stone_holdback: "RND(net_refund * stone_holdback_pct / 100, 2)"
  - design_wait_days: "DAYS(F('consultation_date'), F('design_approved_date'))"
  - goodwill_pct: "K('major_goodwill_pct') if (design_wait_days > K('long_design_delay_days') and stages_recorded == 0) else (K('minor_goodwill_pct') if (design_wait_days > K('design_delay_days') and design_wait_days <= K('long_design_delay_days') and stages_recorded == 0) else K('no_goodwill_pct'))"
  - goodwill_credit: "RND(net_refund * goodwill_pct / 100, 2)"
  - overage_charges: "SUM('custom_ledger','amount', date_field='posted_date', event_type='custom_price_adjustment_charged', charge_reason='revision_overage')"
  - overage_setoff_pct: "K('full_overage_setoff_pct') if (overage_charges > 0 and F('balance_due') > overage_charges) else (K('part_overage_setoff_pct') if (overage_charges > 0 and F('balance_due') <= overage_charges) else K('no_overage_setoff_pct'))"
  - overage_setoff: "RND(overage_charges * overage_setoff_pct / 100, 2)"
  - coverage_premiums_paid: "float(CFIELD('protection','premium_paid_to_date', status='active') or 0)"
  - coverage_claims_settled: "float(CFIELD('protection','claims_settled_count', status='active') or 0)"
  - coverage_return_pct: "K('unclaimed_coverage_pct') if (coverage_premiums_paid > 0 and coverage_claims_settled == 0) else (K('claimed_coverage_pct') if (coverage_premiums_paid > 0 and coverage_claims_settled > 0) else K('no_coverage_pct'))"
  - coverage_return: "RND(coverage_premiums_paid * coverage_return_pct / 100, 2)"
  - result: "MX(0, RND(net_refund - stone_holdback + goodwill_credit + coverage_return - overage_setoff, 2))"
