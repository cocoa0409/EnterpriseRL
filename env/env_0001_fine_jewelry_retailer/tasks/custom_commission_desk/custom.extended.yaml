  compute:
  - revisions_taken: "COUNT('custom_ledger', date_field='posted_date', event_type='custom_design_revision_used')"
  - revision_multiple: "K('in_production_revision_multiple') if (revisions_taken >= P('included_design_revisions') and F('production_start_date') != '') else (K('published_revision_multiple') if (revisions_taken >= P('included_design_revisions') and F('production_start_date') == '') else K('within_allowance_multiple'))"
  - revisions_beyond: "MX(0, revisions_taken + 1 - P('included_design_revisions'))"
  - revision_component: "RND(P('additional_revision_charge') * revision_multiple * revisions_beyond, 2)"
  - highest_revision_number: "MAX('custom_ledger','revision_number', event_type='custom_design_revision_used')"
  - model_charge: "(K('cad_charge') + K('wax_charge')) if (P('cad_render_included') == False and P('wax_model_included') == False and highest_revision_number > 0) else (K('wax_charge') if (P('cad_render_included') == True and P('wax_model_included') == False and highest_revision_number > 0) else K('no_model_charge'))"
  - plan_financed: "1 if EXISTS('financing', sales_receipt_number=F('sales_receipt_number')) else 0"
  - plan_principal: "float(CFIELD('financing','original_principal', sales_receipt_number=F('sales_receipt_number')) or 0)"
  - plan_down_payment: "float(CFIELD('financing','down_payment_amount', sales_receipt_number=F('sales_receipt_number')) or 0)"
  - plan_open: "1 if (CFIELD('financing','status', sales_receipt_number=F('sales_receipt_number')) == 'active') else 0"
  - ledger_repricings: "SUM('custom_ledger','amount', date_field='posted_date', event_type='custom_price_adjustment_charged')"
  - commission_worth: "(plan_principal + plan_down_payment) if (plan_financed == 1 and plan_open == 1) else (plan_principal if (plan_financed == 1 and plan_open == 0) else (F('quoted_total') + ledger_repricings))"
  - stone_setting_stages: "COUNT('custom_ledger', date_field='posted_date', event_type='custom_milestone_logged', milestone_code='stone_setting')"
  - stone_handling_pct: "P('stone_sourcing_fee_pct') if (F('center_stone_source') == 'customer_supplied' and stone_setting_stages > 0) else (K('unset_stone_handling_pct') if (F('center_stone_source') == 'customer_supplied' and stone_setting_stages == 0) else K('house_stone_handling_pct'))"
  - stone_handling_amount: "RND(commission_worth * stone_handling_pct / 100, 2)"
  - metal_market_repricings: "SUM('custom_ledger','amount', date_field='posted_date', event_type='custom_price_adjustment_charged', charge_reason='metal_market')"
  - casting_stages_drawn: "COUNT('custom_ledger', date_field='posted_date', event_type='custom_milestone_logged', milestone_code='casting')"
  - market_movement_factor: "K('metal_moved_late_factor') if (metal_market_repricings > 0 and casting_stages_drawn > 0) else (K('metal_moved_early_factor') if (metal_market_repricings > 0 and casting_stages_drawn == 0) else K('no_metal_move_factor'))"
  - result: "RND((revision_component + model_charge + stone_handling_amount) * market_movement_factor, 2)"
