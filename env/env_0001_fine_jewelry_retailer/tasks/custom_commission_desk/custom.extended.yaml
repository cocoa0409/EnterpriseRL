    credit_original_receipt: "Where the customer holds an upgrade registration standing part spent with credit still available and the chain sold the piece that registration was traded against, the studio's receipted share of the sum reached is taken back out of that credit; where the customer holds an upgrade registration standing part spent with credit still available and the chain did not sell the piece traded against it, the studio's unreceipted share is taken back out of that credit; otherwise nothing is taken back out of an upgrade credit."
    credit_restored_pct: "Where the customer holds an upgrade registration standing part spent with credit still available and the chain sold the piece that registration was traded against, the studio's receipted share of the sum reached is taken back out of that credit; where the customer holds an upgrade registration standing part spent with credit still available and the chain did not sell the piece traded against it, the studio's unreceipted share is taken back out of that credit; otherwise nothing is taken back out of an upgrade credit."
    subtotal_kept: "The sum the studio keeps when a commission is closed at the customer's request is the forfeit share of the quoted total, together with the share of the design fee booked to the commission that the studio keeps, together with the share of the repricings for the metal market booked to the commission that it keeps, the three added together before anything is taken back out of an upgrade credit and before any relief is applied."
    credit_restored: "The forfeit share of the quoted total, the design fee kept, the repricing kept and the amount taken back out of an upgrade credit are each rounded half up to two decimal places as they are worked out; the amount taken back out of an upgrade credit is a share of the three added together and is taken off that sum, and what remains is taken at the relief and rounded half up to two decimal places once."
    days_past_promise: "Where the piece stands past the date it was promised for by more than the studio's overdue days and has not been recorded as finished, the sum reached is taken at the studio's overdue relief fraction; where the piece stands past the date it was promised for by not more than the studio's overdue days and has not been recorded as finished, it is taken at the studio's late relief fraction; otherwise the sum reached stands as it is."
    closure_relief_factor: "Where the piece stands past the date it was promised for by more than the studio's overdue days and has not been recorded as finished, the sum reached is taken at the studio's overdue relief fraction; where the piece stands past the date it was promised for by not more than the studio's overdue days and has not been recorded as finished, it is taken at the studio's late relief fraction; otherwise the sum reached stands as it is."
    result: "The forfeit share of the quoted total, the design fee kept, the repricing kept and the amount taken back out of an upgrade credit are each rounded half up to two decimal places as they are worked out; the amount taken back out of an upgrade credit is a share of the three added together and is taken off that sum, and what remains is taken at the relief and rounded half up to two decimal places once."
  factors:
  - id: closure_forfeit_share
    effect: parameter
    decides: forfeit_pct
    bindings: [production_stages, days_since_approval, forfeit_pct]
    ladder:
    - when: "a stage of production stands recorded on the commission and the piece has not been recorded as finished"
      value: "P('cancellation_forfeit_pct_after_production')"
    - when: "no stage of production stands recorded and the closure is confirmed after the programme's cancellation window has run in calendar days from the date the design was approved"
      value: "K('late_closure_forfeit_pct')"
    - when: "otherwise"
      value: "P('cancellation_forfeit_pct_before_production')"
    baseline:
      forfeit_pct: "P('cancellation_forfeit_pct_before_production')"
    evidence: [history, date]
    cross_difficulty: null
  - id: design_fee_retention
    effect: parameter
    decides: design_fee_kept_pct
    bindings: [revisions_drawn, overage_revisions, design_fee_kept_pct]
    ladder:
    - when: "every design revision included in the quoted total has been drawn and a revision beyond the included allowance stands on the commission"
      value: "K('full_design_fee_pct')"
    - when: "a design revision has been drawn and no revision beyond the included allowance stands"
      value: "K('part_design_fee_pct')"
    - when: "otherwise"
      value: "K('no_design_fee_pct')"
    baseline:
      design_fee_kept_pct: "K('no_design_fee_pct')"
    evidence: [history]
    cross_difficulty: null
  - id: metal_repricing_retention
    effect: parameter
    decides: metal_kept_pct
    bindings: [metal_adjustments, metal_kept_pct]
    ladder:
    - when: "a repricing for the metal market stands booked on the commission and the piece has not gone into production"
      value: "K('unstarted_metal_kept_pct')"
    - when: "a repricing for the metal market stands booked and the piece has gone into production"
      value: "K('started_metal_kept_pct')"
    - when: "otherwise"
      value: "K('no_metal_kept_pct')"
    baseline:
