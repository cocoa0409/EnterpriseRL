    ladder:
    - when: "the customer holds an upgrade registration standing part spent with credit still available and the chain sold the piece that registration was traded against"
      value: "K('receipted_credit_pct')"
    - when: "the customer holds an upgrade registration standing part spent with credit still available and the chain did not sell the piece traded against it"
      value: "K('unreceipted_credit_pct')"
    - when: "otherwise"
