extended_policies:
- id: financing_ext_settlement_figure
  base_policy_refs:
  - financing_closure_and_payoff
  - financing_evt_payment_allocation
  overwrite:
  - base_policy: financing_closure_and_payoff
    superseded_clause: >-
      A payoff figure is the current balance together with any held-back interest the term would
      forfeit, taken as at the day the figure is quoted.
    replaced_by: >-
      The settlement figure is built from the balance the plan record carries at the handling
      date, the interest the balance earns over the final part of the cycle, and the priced
      charges standing unanswered on the plan.
  trigger: on_request
  subject:
  - financing_plan_closed_paid
  - financing_payment_posted
  computes: settlement_amount
  target_tool: confirm_plan_settlement_d71750ce
  params:
    day_count_year_days: 365
    delinquent_review_multiple: 2
  rule: >-
    The settlement figure is built from the balance the plan record carries at the handling
    date, the interest the balance earns over the final part of the cycle, and the priced
    charges standing unanswered on the plan. The interest over the final part of the cycle is
    the balance multiplied by the settlement rate, divided by one hundred, multiplied by the
    number of days the final part of the cycle runs to, and divided by the number of days this
    desk takes the year to run to, the product rounded to the cent at that point. The
    settlement rate is the term's promotional rate. The number of days the final part of the
    cycle runs to is counted from the closing date of the most recent statement to the handling
    date. The priced charges standing unanswered are read as the lateness charges and the
    returned-payment charges booked to the plan inside the stretch of whole calendar months the
    charge reading runs over, ending on the handling date, taken together with the give-backs
    booked in that same stretch, which are negative and so reduce the total. The stretch the
    charge reading runs over is the term's repeat window of whole calendar months. The balance,
    the interest over the final part of the cycle and the priced charges standing unanswered are
    added, that sum is rounded to the cent, and where the rounded sum falls below nothing the
    figure stands at nothing. Where the customer holds an upgrade registration whose credit may
    still be spent, the credit set against the figure is taken off the sum before it is rounded,
    and it is taken off once and never applied twice. The stretch of whole calendar months the
    repricing review reads runs back to the date the plan began billing where the plan has been
    billing for fewer whole calendar months than the term's repricing review length; it runs
    twice the term's repricing review length back from the handling date where the plan has been
    billing for at least that many whole calendar months and stands past due at the handling
    date; and it runs the term's repricing review length back from the handling date for every
    other plan. A cycle of that stretch in which no payment settled counts as a missed cycle,
    and the missed cycles are the length of the stretch less the settled payments credited in
    it, never fewer than none. The settlement rate is the term's penalty rate where the missed
    cycles reach the term's repricing trigger number of missed payments; it is the term's
    promotional rate reduced by the term's automatic payment discount where automatic payment is
    in force on the plan and no cycle of the stretch was missed; and it is the term's
    promotional rate for every other plan. The number of days the final part of the cycle runs
    to is counted from the date of the most recent settled payment to the handling date where a
    payment has settled on the plan in the whole month ending on the handling date; it is
    counted from the payment due date printed on the most recent statement to the handling date
    where no payment has settled in that month and the plan stands past due; and it is counted
    from the closing date of the most recent statement to the handling date for every other
    plan. The stretch the charge reading runs over is every whole calendar month since the plan
    began billing where the plan stands past due at the handling date; it is the single whole
    month ending on the handling date where the plan stands active and automatic payment is in
    force on it; and it is the term's repeat window of whole calendar months for every other
    plan. The credit set against the figure is the whole of the credit still available on the
    customer's upgrade registration where that registration stands at credit issued or part
    spent and its programme allows a credit to be spent in part; it is the credit issued on that
    registration where the registration stands at credit issued or part spent and its programme
    does not allow a credit to be spent in part; and nothing is set against the figure for every
    other customer. The settlement figure is worked out only after every payment the bank has
    sent back unpaid on the plan carries the returned-payment charge owed against it in the
    billing history. The settlement figure is worked out only after every missed payment due
    date printed on the plan's statements carries the lateness charge due against it in the
    billing history.
  prerequisite:
  - problem: financing_ext_returned_payment_charge
    kind: value_input
    gate: standing_charges
    form: state
    policy_source: >-
      The settlement figure is worked out only after every payment the bank has sent back unpaid
      on the plan carries the returned-payment charge owed against it in the billing history.
    condition: >-
      Every financing ledger entry recording a payment whose outcome is a return carries a
      returned-payment charge entry booked against it as its source entry.
    resolved_by: book_returned_payment_charge_6a9e81de
    effect: >-
      The charge reading binding picks up the returned-payment charge entry, so the priced
      charges standing unanswered rise by the charge booked.
  - problem: financing_ext_lateness_charge
    kind: value_input
    gate: standing_charges
    form: state
    policy_source: >-
      The settlement figure is worked out only after every missed payment due date printed on
      the plan's statements carries the lateness charge due against it in the billing history.
    condition: >-
      Every payment due date printed on a statement of the plan that no settled payment answers
      carries a lateness charge entry in the plan's billing history for that due date.
    resolved_by: book_lateness_charge_0092ea40
    effect: >-
      The charge reading binding picks up the lateness charge entry, so the priced charges
      standing unanswered rise by the charge booked.
  cross_category:
  - category: tradein
    as: branch
    reads:
    - status
    - remaining_credit
    - issued_credit_amount
    - credit_partially_redeemable
    note: >-
      The upgrade credit factor decides its tier from the customer's trade-in registration record
      and the programme parameter that says whether a credit may be spent in part.
  compute:
  - plan_balance: "F('current_balance')"
  - review_window_months: "MX(1, MONTHS(F('activated_date'), NOW)) if MONTHS(F('activated_date'), NOW) < P('penalty_apr_review_months') else (P('penalty_apr_review_months') * K('delinquent_review_multiple') if F('status') == 'past_due' else P('penalty_apr_review_months'))"
  - settled_payments_in_review: "COUNT('financing_ledger', within_months=review_window_months, date_field='posted_date', event_type='financing_payment_posted', payment_outcome='settled')"
  - missed_cycles: "MX(0, review_window_months - settled_payments_in_review)"
  - settlement_apr: "P('penalty_apr_pct') if missed_cycles >= P('penalty_apr_trigger_missed_payments') else (RND(P('promotional_apr_pct') - P('autopay_apr_discount_pct'), 2) if (F('autopay_enrolled') == True and missed_cycles == 0) else P('promotional_apr_pct'))"
  - last_statement_date: "LATEST('financing_ledger', 'posted_date', date_field='posted_date', event_type='financing_statement_issued')"
  - latest_due_date: "LATEST('financing_ledger', 'payment_due_date', date_field='posted_date', event_type='financing_statement_issued')"
  - settled_recently: "COUNT('financing_ledger', within_months=1, date_field='posted_date', event_type='financing_payment_posted', payment_outcome='settled')"
  - interest_days: "DAYS(F('last_payment_date'), NOW) if settled_recently > 0 else (DAYS(latest_due_date, NOW) if F('status') == 'past_due' else DAYS(last_statement_date, NOW))"
  - period_interest: "RND(plan_balance * settlement_apr / 100 * interest_days / K('day_count_year_days'), 2)"
  - charge_window_months: "MX(1, MONTHS(F('activated_date'), NOW)) if F('status') == 'past_due' else (1 if F('autopay_enrolled') == True else P('late_fee_repeat_window_months'))"
  - late_charges: "SUM('financing_ledger', 'amount', within_months=charge_window_months, date_field='posted_date', event_type='financing_late_fee_assessed')"
  - returned_charges: "SUM('financing_ledger', 'amount', within_months=charge_window_months, date_field='posted_date', event_type='financing_returned_payment_fee_assessed')"
  - givebacks: "SUM('financing_ledger', 'amount', within_months=charge_window_months, date_field='posted_date', event_type='financing_fee_waiver_applied')"
  - standing_charges: "late_charges + returned_charges + givebacks"
  - credit_status: "CFIELD('tradein', 'status')"
  - credit_available: "CFIELD('tradein', 'remaining_credit')"
  - credit_part_spendable: "CPARAM('tradein', 'credit_partially_redeemable')"
  - credit_offset: "credit_available if ((credit_status == 'credit_issued' or credit_status == 'partially_redeemed') and credit_part_spendable == True) else (CFIELD('tradein', 'issued_credit_amount') if ((credit_status == 'credit_issued' or credit_status == 'partially_redeemed') and credit_part_spendable == False) else 0.0)"
  - result: "MX(0.0, RND(plan_balance + period_interest + standing_charges - credit_offset, 2))"
  compute_basis:
    review_window_months: >-
      The stretch of whole calendar months the repricing review reads runs back to the date the
      plan began billing where the plan has been billing for fewer whole calendar months than
      the term's repricing review length; it runs twice the term's repricing review length back
      from the handling date where the plan has been billing for at least that many whole
      calendar months and stands past due at the handling date; and it runs the term's repricing
      review length back from the handling date for every other plan.
    settled_payments_in_review: >-
      A cycle of that stretch in which no payment settled counts as a missed cycle, and the
      missed cycles are the length of the stretch less the settled payments credited in it,
      never fewer than none.
    missed_cycles: >-
      A cycle of that stretch in which no payment settled counts as a missed cycle, and the
      missed cycles are the length of the stretch less the settled payments credited in it,
      never fewer than none.
    settlement_apr: >-
      The settlement rate is the term's penalty rate where the missed cycles reach the term's
      repricing trigger number of missed payments; it is the term's promotional rate reduced by
      the term's automatic payment discount where automatic payment is in force on the plan and
      no cycle of the stretch was missed; and it is the term's promotional rate for every other
      plan.
    last_statement_date: >-
      The number of days the final part of the cycle runs to is counted from the date of the
      most recent settled payment to the handling date where a payment has settled on the plan
      in the whole month ending on the handling date; it is counted from the payment due date
      printed on the most recent statement to the handling date where no payment has settled in
      that month and the plan stands past due; and it is counted from the closing date of the
      most recent statement to the handling date for every other plan.
    latest_due_date: >-
      The number of days the final part of the cycle runs to is counted from the date of the
      most recent settled payment to the handling date where a payment has settled on the plan
      in the whole month ending on the handling date; it is counted from the payment due date
      printed on the most recent statement to the handling date where no payment has settled in
      that month and the plan stands past due; and it is counted from the closing date of the
      most recent statement to the handling date for every other plan.
    settled_recently: >-
      The number of days the final part of the cycle runs to is counted from the date of the
      most recent settled payment to the handling date where a payment has settled on the plan
      in the whole month ending on the handling date; it is counted from the payment due date
      printed on the most recent statement to the handling date where no payment has settled in
      that month and the plan stands past due; and it is counted from the closing date of the
      most recent statement to the handling date for every other plan.
    interest_days: >-
      The number of days the final part of the cycle runs to is counted from the date of the
      most recent settled payment to the handling date where a payment has settled on the plan
      in the whole month ending on the handling date; it is counted from the payment due date
      printed on the most recent statement to the handling date where no payment has settled in
      that month and the plan stands past due; and it is counted from the closing date of the
      most recent statement to the handling date for every other plan.
    period_interest: >-
      The interest over the final part of the cycle is the balance multiplied by the settlement
      rate, divided by one hundred, multiplied by the number of days the final part of the cycle
      runs to, and divided by the number of days this desk takes the year to run to, the product
      rounded to the cent at that point.
    charge_window_months: >-
      The stretch the charge reading runs over is every whole calendar month since the plan
      began billing where the plan stands past due at the handling date; it is the single whole
      month ending on the handling date where the plan stands active and automatic payment is in
      force on it; and it is the term's repeat window of whole calendar months for every other
      plan.
    late_charges: >-
      The priced charges standing unanswered are read as the lateness charges and the
      returned-payment charges booked to the plan inside the stretch of whole calendar months
      the charge reading runs over, ending on the handling date, taken together with the
      give-backs booked in that same stretch, which are negative and so reduce the total.
    returned_charges: >-
      The priced charges standing unanswered are read as the lateness charges and the
      returned-payment charges booked to the plan inside the stretch of whole calendar months
      the charge reading runs over, ending on the handling date, taken together with the
      give-backs booked in that same stretch, which are negative and so reduce the total.
    givebacks: >-
      The priced charges standing unanswered are read as the lateness charges and the
      returned-payment charges booked to the plan inside the stretch of whole calendar months
      the charge reading runs over, ending on the handling date, taken together with the
      give-backs booked in that same stretch, which are negative and so reduce the total.
    credit_status: >-
      The credit set against the figure is the whole of the credit still available on the
      customer's upgrade registration where that registration stands at credit issued or part
      spent and its programme allows a credit to be spent in part; it is the credit issued on
      that registration where the registration stands at credit issued or part spent and its
      programme does not allow a credit to be spent in part; and nothing is set against the
      figure for every other customer.
    credit_available: >-
      The credit set against the figure is the whole of the credit still available on the
      customer's upgrade registration where that registration stands at credit issued or part
      spent and its programme allows a credit to be spent in part; it is the credit issued on
      that registration where the registration stands at credit issued or part spent and its
      programme does not allow a credit to be spent in part; and nothing is set against the
      figure for every other customer.
    credit_part_spendable: >-
      The credit set against the figure is the whole of the credit still available on the
      customer's upgrade registration where that registration stands at credit issued or part
      spent and its programme allows a credit to be spent in part; it is the credit issued on
      that registration where the registration stands at credit issued or part spent and its
      programme does not allow a credit to be spent in part; and nothing is set against the
      figure for every other customer.
    credit_offset: >-
      The credit set against the figure is the whole of the credit still available on the
      customer's upgrade registration where that registration stands at credit issued or part
      spent and its programme allows a credit to be spent in part; it is the credit issued on
      that registration where the registration stands at credit issued or part spent and its
      programme does not allow a credit to be spent in part; and nothing is set against the
