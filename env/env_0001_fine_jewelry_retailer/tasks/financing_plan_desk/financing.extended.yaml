      for coverage taken out on a financed piece. The payment due for the cycle is the scheduled
      monthly payment the plan record carries. The stretch of whole calendar months the charge
      reading runs over is the two whole months ending on the handling date. The priced charges the
      statement presents are the lateness charges booked to the plan inside that stretch taken at
      the presentation share, and the presentation share is the whole of them. Nothing is presented
      for coverage. The payment due for the cycle, the priced charges presented and the coverage
      amount are added, that sum is rounded to the cent, and where the rounded figure falls below
