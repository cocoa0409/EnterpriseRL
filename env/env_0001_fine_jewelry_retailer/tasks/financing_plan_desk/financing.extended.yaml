- id: financing_ext_service_recovery_giveback
  base_policy_refs:
  - financing_courtesy_waiver
  overwrite:
  - base_policy: financing_courtesy_waiver
    superseded_clause: >-
      A give-back made because the bank confirmed its own error, or made to put right a service
      failure of the chain's own, is recorded under its own reason and does not consume the
      courtesy allowance.
    replaced_by: >-
      A give-back made to put right a failure of the chain's own handling is recorded under the
      service-recovery ground, does not consume the courtesy allowance the term sets, and is worked
      out as the charges it answers together with the additions the desk makes for the failure.
  trigger: state_due
  subject:
  - financing_fee_waiver_applied
  computes: giveback_amount
  target_tool: apply_service_recovery_giveback_b70a9c9e
  params:
    charge_window_multiple: 2
    repeat_failure_addition: 30.0
    single_failure_addition: 15.0
    larger_service_recovery_addition: 40.0
    service_recovery_addition: 20.0
  rule: >-
    A give-back made to put right a failure of the chain's own handling is recorded under the
    service-recovery ground, does not consume the courtesy allowance the term sets, and is worked
    out as the charges it answers together with the additions the desk makes for the failure. The
    charges the give-back answers are the lateness charges booked to the plan inside the stretch of
    whole calendar months the charge reading runs over. The stretch the charge reading runs over is
    the term's repeat window of whole calendar months ending on the handling date. No addition is
    made for repeated failure. No addition is made for the workshop. The charges the give-back
    answers, the addition for repeated failure and the addition for the workshop are added, that sum
    is rounded to the cent, and where the rounded figure falls below nothing the give-back stands at
    nothing; the give-back is booked against the most recently booked lateness charge on the plan
    and carries the whole of that sum. The stretch the charge reading runs over runs twice the
    term's repeat window of whole calendar months back from the handling date where automatic
    payment is in force on the plan and a payment on it has been sent back unpaid in the whole month
    ending on the handling date; it runs back to the date the plan began billing where the plan has
    been billing for fewer whole calendar months than the term's repeat window; and it runs the
    term's repeat window of whole calendar months back from the handling date for every other plan.
    The charges the give-back answers are the lateness charges booked inside that stretch net of the
    give-backs already booked inside it where a give-back already stands inside the stretch; they
    are the most recently booked lateness charge alone where no give-back stands inside the stretch
    and the plan stands past due at the handling date; and they are the lateness charges booked
    inside that stretch for every other plan. The addition for repeated failure is this desk's
    repeated-failure addition where two or more payments on the plan have been sent back unpaid
    inside the term's repricing review window and automatic payment is in force on the plan; it is
    this desk's single-failure addition where exactly one payment has been sent back unpaid inside
    that window and automatic payment is in force on the plan; and no addition is made for repeated
    failure for every other plan. The addition for the workshop is this desk's larger workshop
    addition where the customer has a piece with the workshop that the chain promised for a date
    already past and has not yet handed back and that piece has been back to the bench at least
    once; it is this desk's workshop addition where the customer has such a piece and it has not
    been back to the bench; and no addition is made for the workshop for every other customer.
  prerequisite: []
  cross_category:
  - category: service
    as: branch
    reads:
    - status
    - promised_date
    - rework_count
    note: >-
      The workshop addition factor decides its tier from the standing of the customer's bench work
      order, the date it was promised for and how many times that piece has been back to the bench.
  compute:
  - months_billing: "MONTHS(F('activated_date'), NOW)"
  - returns_this_month: "COUNT('financing_ledger', within_months=1, date_field='posted_date', event_type='financing_payment_posted', payment_outcome='returned_nsf')"
  - charge_window_months: "P('late_fee_repeat_window_months') * K('charge_window_multiple') if (F('autopay_enrolled') == True and returns_this_month > 0) else (MX(1, months_billing) if months_billing < P('late_fee_repeat_window_months') else P('late_fee_repeat_window_months'))"
  - late_charges_in_window: "SUM('financing_ledger', 'amount', within_months=charge_window_months, date_field='posted_date', event_type='financing_late_fee_assessed')"
  - givebacks_in_window: "SUM('financing_ledger', 'amount', within_months=charge_window_months, date_field='posted_date', event_type='financing_fee_waiver_applied')"
  - givebacks_count: "COUNT('financing_ledger', within_months=charge_window_months, date_field='posted_date', event_type='financing_fee_waiver_applied')"
  - latest_charge_amount: "LATEST('financing_ledger', 'amount', date_field='posted_date', event_type='financing_late_fee_assessed')"
  - charge_base: "late_charges_in_window + givebacks_in_window if givebacks_count > 0 else (latest_charge_amount if F('status') == 'past_due' else late_charges_in_window)"
  - returns_in_review: "COUNT('financing_ledger', within_months=P('penalty_apr_review_months'), date_field='posted_date', event_type='financing_payment_posted', payment_outcome='returned_nsf')"
  - failure_addition: "K('repeat_failure_addition') if (returns_in_review >= 2 and F('autopay_enrolled') == True) else (K('single_failure_addition') if (returns_in_review == 1 and F('autopay_enrolled') == True) else 0.0)"
  - service_status: "CFIELD('service', 'status')"
  - service_promised: "CFIELD('service', 'promised_date')"
  - service_rework: "CFIELD('service', 'rework_count')"
  - service_overdue: "service_status == 'in_workshop' and DAYS(service_promised, NOW) > 0"
  - workshop_addition: "K('larger_service_recovery_addition') if (service_overdue == True and service_rework >= 1) else (K('service_recovery_addition') if (service_overdue == True and service_rework == 0) else 0.0)"
  - result: "MX(0.0, RND(charge_base + failure_addition + workshop_addition, 2))"
  compute_basis:
    months_billing: >-
      The stretch the charge reading runs over runs twice the term's repeat window of whole calendar
      months back from the handling date where automatic payment is in force on the plan and a
      payment on it has been sent back unpaid in the whole month ending on the handling date; it
      runs back to the date the plan began billing where the plan has been billing for fewer whole
      calendar months than the term's repeat window; and it runs the term's repeat window of whole
      calendar months back from the handling date for every other plan.
    returns_this_month: >-
      The stretch the charge reading runs over runs twice the term's repeat window of whole calendar
      months back from the handling date where automatic payment is in force on the plan and a
      payment on it has been sent back unpaid in the whole month ending on the handling date; it
      runs back to the date the plan began billing where the plan has been billing for fewer whole
      calendar months than the term's repeat window; and it runs the term's repeat window of whole
      calendar months back from the handling date for every other plan.
    charge_window_months: >-
      The stretch the charge reading runs over runs twice the term's repeat window of whole calendar
      months back from the handling date where automatic payment is in force on the plan and a
      payment on it has been sent back unpaid in the whole month ending on the handling date; it
      runs back to the date the plan began billing where the plan has been billing for fewer whole
      calendar months than the term's repeat window; and it runs the term's repeat window of whole
      calendar months back from the handling date for every other plan.
    late_charges_in_window: >-
      The charges the give-back answers are the lateness charges booked inside that stretch net of
      the give-backs already booked inside it where a give-back already stands inside the stretch;
      they are the most recently booked lateness charge alone where no give-back stands inside the
      stretch and the plan stands past due at the handling date; and they are the lateness charges
      booked inside that stretch for every other plan.
    givebacks_in_window: >-
      The charges the give-back answers are the lateness charges booked inside that stretch net of
      the give-backs already booked inside it where a give-back already stands inside the stretch;
      they are the most recently booked lateness charge alone where no give-back stands inside the
      stretch and the plan stands past due at the handling date; and they are the lateness charges
      booked inside that stretch for every other plan.
    givebacks_count: >-
      The charges the give-back answers are the lateness charges booked inside that stretch net of
      the give-backs already booked inside it where a give-back already stands inside the stretch;
      they are the most recently booked lateness charge alone where no give-back stands inside the
      stretch and the plan stands past due at the handling date; and they are the lateness charges
      booked inside that stretch for every other plan.
    latest_charge_amount: >-
      The charges the give-back answers are the lateness charges booked inside that stretch net of
      the give-backs already booked inside it where a give-back already stands inside the stretch;
      they are the most recently booked lateness charge alone where no give-back stands inside the
      stretch and the plan stands past due at the handling date; and they are the lateness charges
      booked inside that stretch for every other plan.
    charge_base: >-
      The charges the give-back answers are the lateness charges booked inside that stretch net of
      the give-backs already booked inside it where a give-back already stands inside the stretch;
      they are the most recently booked lateness charge alone where no give-back stands inside the
      stretch and the plan stands past due at the handling date; and they are the lateness charges
      booked inside that stretch for every other plan.
    returns_in_review: >-
      The addition for repeated failure is this desk's repeated-failure addition where two or more
      payments on the plan have been sent back unpaid inside the term's repricing review window and
      automatic payment is in force on the plan; it is this desk's single-failure addition where
      exactly one payment has been sent back unpaid inside that window and automatic payment is in
      force on the plan; and no addition is made for repeated failure for every other plan.
    failure_addition: >-
      The addition for repeated failure is this desk's repeated-failure addition where two or more
      payments on the plan have been sent back unpaid inside the term's repricing review window and
      automatic payment is in force on the plan; it is this desk's single-failure addition where
      exactly one payment has been sent back unpaid inside that window and automatic payment is in
      force on the plan; and no addition is made for repeated failure for every other plan.
    service_status: >-
      The addition for the workshop is this desk's larger workshop addition where the customer has a
      piece with the workshop that the chain promised for a date already past and has not yet handed
      back and that piece has been back to the bench at least once; it is this desk's workshop
      addition where the customer has such a piece and it has not been back to the bench; and no
      addition is made for the workshop for every other customer.
    service_promised: >-
      The addition for the workshop is this desk's larger workshop addition where the customer has a
      piece with the workshop that the chain promised for a date already past and has not yet handed
      back and that piece has been back to the bench at least once; it is this desk's workshop
      addition where the customer has such a piece and it has not been back to the bench; and no
      addition is made for the workshop for every other customer.
    service_rework: >-
      The addition for the workshop is this desk's larger workshop addition where the customer has a
      piece with the workshop that the chain promised for a date already past and has not yet handed
      back and that piece has been back to the bench at least once; it is this desk's workshop
      addition where the customer has such a piece and it has not been back to the bench; and no
      addition is made for the workshop for every other customer.
    service_overdue: >-
      The addition for the workshop is this desk's larger workshop addition where the customer has a
      piece with the workshop that the chain promised for a date already past and has not yet handed
      back and that piece has been back to the bench at least once; it is this desk's workshop
      addition where the customer has such a piece and it has not been back to the bench; and no
      addition is made for the workshop for every other customer.
    workshop_addition: >-
      The addition for the workshop is this desk's larger workshop addition where the customer has a
      piece with the workshop that the chain promised for a date already past and has not yet handed
      back and that piece has been back to the bench at least once; it is this desk's workshop
      addition where the customer has such a piece and it has not been back to the bench; and no
      addition is made for the workshop for every other customer.
    result: >-
      The charges the give-back answers, the addition for repeated failure and the addition for the
      workshop are added, that sum is rounded to the cent, and where the rounded figure falls below
      nothing the give-back stands at nothing; the give-back is booked against the most recently
      booked lateness charge on the plan and carries the whole of that sum.
  factors:
  - id: charge_reading_window
    effect: method
    decides: charge_window_months
    bindings:
    - months_billing
    - returns_this_month
    - charge_window_months
    ladder:
    - when: automatic payment is in force on the plan and a payment on it has been sent back unpaid in the whole month ending on the handling date
      method: the stretch runs twice the term's repeat window of whole calendar months back from the handling date
    - when: the plan has been billing for fewer whole calendar months than the term's repeat window
      method: the stretch runs back to the date the plan began billing
    - when: otherwise
      method: the stretch runs the term's repeat window of whole calendar months back from the handling date
    baseline:
      charge_window_months: "P('late_fee_repeat_window_months')"
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: answered_charge_selection
    effect: method
    decides: charge_base
    bindings:
    - late_charges_in_window
    - givebacks_in_window
    - givebacks_count
    - latest_charge_amount
    - charge_base
    ladder:
    - when: a give-back already stands inside the stretch
      method: the charges answered are the lateness charges booked inside the stretch net of the give-backs already booked inside it
    - when: no give-back stands inside the stretch and the plan stands past due at the handling date
      method: the charges answered are the most recently booked lateness charge alone
    - when: otherwise
      method: the charges answered are the lateness charges booked inside the stretch
    baseline:
      charge_base: "late_charges_in_window"
    evidence:
    - history
    cross_difficulty: null
  - id: repeated_failure_addition
    effect: parameter
    decides: failure_addition
    bindings:
    - returns_in_review
    - failure_addition
    ladder:
    - when: two or more payments on the plan have been sent back unpaid inside the term's repricing review window and automatic payment is in force on the plan
      value: "K('repeat_failure_addition')"
    - when: exactly one payment has been sent back unpaid inside that window and automatic payment is in force on the plan
      value: "K('single_failure_addition')"
    - when: otherwise
      value: no addition is made for repeated failure
    baseline:
      failure_addition: "0.0"
    evidence:
    - history
    cross_difficulty: null
  - id: workshop_failure_addition
    effect: parameter
    decides: workshop_addition
    bindings:
    - service_status
    - service_promised
    - service_rework
    - service_overdue
    - workshop_addition
    ladder:
    - when: the customer has a piece with the workshop that the chain promised for a date already past and has not yet handed back and that piece has been back to the bench at least once
      value: "K('larger_service_recovery_addition')"
    - when: the customer has such a piece and it has not been back to the bench
      value: "K('service_recovery_addition')"
    - when: otherwise
      value: no addition is made for the workshop
    baseline:
      workshop_addition: "0.0"
    evidence:
    - cross_category
    - date
    cross_difficulty: service
  baseline:
    rule: >-
      A give-back made to put right a failure of the chain's own handling is recorded under the
      service-recovery ground, does not consume the courtesy allowance the term sets, and is worked
      out as the charges it answers together with the additions the desk makes for the failure. The
      charges the give-back answers are the lateness charges booked to the plan inside the stretch
      of whole calendar months the charge reading runs over. The stretch the charge reading runs
      over is the term's repeat window of whole calendar months ending on the handling date. No
      addition is made for repeated failure. No addition is made for the workshop. The charges the
      give-back answers, the addition for repeated failure and the addition for the workshop are
      added, that sum is rounded to the cent, and where the rounded figure falls below nothing the
      give-back stands at nothing; the give-back is booked against the most recently booked lateness
      charge on the plan and carries the whole of that sum.
    params:
    - late_fee_repeat_window_months
  inputs:
