    days_past_due_to_delinquent: 30
    reinstatement_max_days_past_due: 120
    return_credit_posting_business_days: 7
    return_credit_recalculates_schedule: true
    promotional_reallocation_allowed: true
    promotional_reallocation_window_days: 60
    max_concurrent_plans_of_this_term: 1
    aggregate_promotional_balance_cap: 64999.0
    down_payment_refund_window_days: 7
    paper_statement_fee: 0.0
    payment_cutoff_time_et: '20:00'
    same_day_credit_channels:
    - in_store
    - online_portal
    - phone_agent
    - autopay
    payment_allocation_order:
    - interest
    - fees
    - principal
    prepayment_penalty_pct: 0.0
    residual_balance_writeoff_threshold: 5.0
    minimum_statement_balance_to_issue: 1.0
    cooling_off_cancellation_days: 7
    promo_expiry_notice_days: 30
    credit_line_utilization_cap_pct: 95.0
    joint_applicant_allowed: true
    trade_up_credit_applies_to_principal: true
    protection_plan_may_be_financed: true
    minimum_applicant_age_years: 21
    statement_delivery_default: electronic
events:
- type: financing_plan_opened
  target: financing_plans
  mutation: create
  meaning: a promotional financing application is taken at the till and a plan record is opened against the sale
  grain: one row per financing application taken against one sales receipt
  fields:
    customer_id: the customer the application is taken for
    variant_name: the promotional term applied for, written as the official full plan name
    status: the plan opens at applied
    sales_receipt_number: the till transaction the plan finances
    originating_store_code: the store that wrote the sale
    opened_date: the date the application was taken
    original_principal: the amount to be financed, net of the down payment
    down_payment_amount: what the customer paid at the till
    applicant_credit_score: the bureau score returned on the application
    joint_applicant_name: the second applicant named, where one is named
    statement_day: the day of the month the plan's statement will close
    promo_end_date: the last day of the promotional term
  triggers:
  - event: financing:financing_purchase_posted
    map:
      sales_receipt_number: sales_receipt_number
      customer_id: customer_id
- type: financing_credit_decision_recorded
  target: financing_plans
  mutation:
    transition:
      from: applied
      to: approved
  meaning: the lender's decision on the application is recorded and the plan becomes approved
  grain: one row per credit decision on one application
  fields:
    status: the plan moves to approved
    approved_date: the date the decision was recorded
    applicant_credit_score: the score the decision was made on
  triggers: []
- type: financing_plan_activated
  target: financing_plans
  mutation:
    transition:
      from: approved
      to: active
  meaning: the first statement closes and the plan starts billing
  grain: one row per plan starting to bill
  fields:
    status: the plan moves to active
    activated_date: the date the plan began billing
    scheduled_monthly_payment: the payment the plan will bill each cycle
    promo_end_date: the last day of the promotional term as billed
  triggers:
  - event: financing:financing_statement_issued
    map:
      financing_plan_id: financing_plan_id
- type: financing_plan_marked_past_due
  target: financing_plans
  mutation:
    transition:
      from: active
      to: past_due
  meaning: a scheduled payment stays unpaid past the delinquency threshold and the plan is marked delinquent
  grain: one row per plan falling delinquent
  fields:
    status: the plan moves to past due
    days_past_due: how many days the oldest unpaid payment is overdue
  triggers:
  - event: financing:financing_late_fee_assessed
    map:
      financing_plan_id: financing_plan_id
      days_past_due: days_past_due
- type: financing_plan_reinstated
  target: financing_plans
  mutation:
    transition:
      from: past_due
      to: active
  meaning: the arrears are cleared and the plan is brought current again
  grain: one row per plan brought current
  fields:
    status: the plan returns to active
    days_past_due: reset to zero once the arrears are cleared
    last_payment_date: the payment that cleared the arrears
  triggers: []
- type: financing_hardship_enrolled
  target: financing_plans
  mutation:
    transition:
    - from: active
      to: in_hardship
    - from: past_due
      to: in_hardship
  meaning: a hardship arrangement is enrolled and the billing schedule is replaced for its term
  grain: one row per hardship arrangement enrolled on one plan
  fields:
    status: the plan moves into a hardship arrangement
    hardship_plan_code: which arrangement was enrolled
    scheduled_monthly_payment: the reduced payment billed for the arrangement's term
  triggers:
  - event: financing:financing_plan_terms_updated
    map:
      scheduled_monthly_payment: scheduled_monthly_payment
- type: financing_plan_closed_paid
  target: financing_plans
  mutation:
    transition:
    - from: active
      to: paid_off
    - from: past_due
      to: paid_off
    - from: in_hardship
      to: paid_off
  meaning: the balance reaches zero and the plan closes settled
  grain: one row per plan settled in full
  fields:
    status: the plan closes settled
    closed_date: the date the balance reached zero
    current_balance: the balance recorded at closure
  triggers: []
- type: financing_plan_charged_off
  target: financing_plans
  mutation:
    transition:
    - from: past_due
      to: charged_off
    - from: in_hardship
      to: charged_off
  meaning: the plan reaches the write-off threshold and is moved to collections
  grain: one row per plan written off
  fields:
    status: the plan is written off
    closed_date: the date of the write-off
    current_balance: the balance written off
  triggers: []
- type: financing_application_withdrawn
  target: financing_plans
  mutation:
    transition:
    - from: applied
      to: cancelled
    - from: approved
      to: cancelled
  meaning: the customer withdraws the application or declines the approved terms and the plan is cancelled
  grain: one row per application withdrawn
  fields:
    status: the plan is cancelled
    closed_date: the date the withdrawal took effect
  triggers: []
- type: financing_plan_terms_updated
  target: financing_plans
  mutation: update
  meaning: a servicing detail of a running plan is changed without moving its lifecycle state
  grain: one row per servicing change on one plan
  fields:
    autopay_enrolled: whether automatic payment is now in force
    statement_day: the day of the month the statement closes
    joint_applicant_name: the second applicant named on the plan
    scheduled_monthly_payment: the payment the plan bills each cycle
    hardship_plan_code: which hardship arrangement is in force
  triggers: []
- type: financing_purchase_posted
  target: financing_ledger
  meaning: the financed merchandise is billed to the plan
  grain: one row per merchandise line financed on one sales receipt
  distinguish_by:
  - sales_receipt_number
  - item_sku
  - posted_date
  fields:
    financing_plan_id: the plan billed
    customer_id: the customer who holds the plan
    event_type: the family this entry belongs to
    posted_date: the date the purchase was billed
    billing_cycle: the cycle the purchase falls in
    amount: the financed amount, positive
    sales_receipt_number: the till transaction the purchase was rung on
    item_sku: the merchandise line billed
    allocation_bucket: principal, because a purchase adds to what is owed
    statement_number: the statement the purchase was presented on
  account: plan_balance
  direction: in
  triggers:
  - event: circle:circle_points_accrued
    map:
      sales_receipt_number: sales_receipt_number
      customer_id: customer_id
      qualifying_spend: amount
- type: financing_payment_posted
  target: financing_ledger
  meaning: a payment from the customer is credited against the plan
  grain: one row per payment presented against one plan
  distinguish_by:
  - posted_date
  - amount
  - payment_channel
  - billing_cycle
  fields:
    financing_plan_id: the plan paid
    customer_id: the customer who paid
    event_type: the family this entry belongs to
    posted_date: the date the payment was credited
    billing_cycle: the cycle the payment was credited in
    amount: the payment, negative because it reduces what is owed
    payment_channel: how the money arrived
    payment_outcome: how the payment finally cleared
    payment_due_date: the due date the payment answers
    allocation_bucket: which part of what is owed the payment moved
    statement_number: the statement the payment answers
  account: plan_balance
  direction: out
  triggers:
  - event: financing:financing_returned_payment_fee_assessed
    when:
      payment_outcome:
      - returned_nsf
      - returned_account_closed
    map:
      fee_code: returned_payment
      source_entry_id: ledger_entry_id
      financing_plan_id: financing_plan_id
- type: financing_late_fee_assessed
  target: financing_ledger
  meaning: a late fee is charged because a scheduled payment was not made in time
  grain: one row per late fee charged for one missed due date
  distinguish_by:
  - billing_cycle
  - payment_due_date
  - fee_code
  fields:
    financing_plan_id: the plan charged
    customer_id: the customer who holds the plan
    event_type: the family this entry belongs to
    posted_date: the date the fee was charged
    billing_cycle: the cycle the fee belongs to
    amount: the fee, positive
    fee_code: whether this is a first or a repeat lateness in the window
    payment_due_date: the due date that was missed
    days_past_due: how far past the due date the fee was charged
    statement_number: the statement the fee was presented on
  account: plan_balance
  direction: in
  triggers: []
- type: financing_returned_payment_fee_assessed
  target: financing_ledger
  meaning: a fee is charged because a presented payment came back unpaid
  grain: one row per returned payment on one plan
  distinguish_by:
  - source_entry_id
  - posted_date
  fields:
    financing_plan_id: the plan charged
    customer_id: the customer who holds the plan
    event_type: the family this entry belongs to
    posted_date: the date the fee was charged
    billing_cycle: the cycle the fee belongs to
    amount: the fee, positive
    fee_code: returned payment
    source_entry_id: the payment entry that came back unpaid
    payment_channel: the channel the failed payment came in on
  account: plan_balance
  direction: in
  triggers: []
- type: financing_deferred_interest_assessed
  target: financing_ledger
  meaning: the whole of the held-back interest is billed because the promotional term closed with a balance outstanding
  grain: one row per promotional term closing with a balance outstanding
  distinguish_by:
  - billing_cycle
  - posted_date
  fields:
    financing_plan_id: the plan charged
    customer_id: the customer who holds the plan
    event_type: the family this entry belongs to
    posted_date: the date the held-back interest was billed
    billing_cycle: the cycle it was billed in
    amount: the held-back interest, positive
    fee_code: deferred interest
    statement_number: the statement it was presented on
  account: plan_balance
  direction: in
  triggers: []
- type: financing_promo_interest_accrued
  target: financing_ledger
  meaning: one cycle's interest accrues on the promotional balance and is held back
  grain: one row per billing cycle of accrual on one plan
  distinguish_by:
  - billing_cycle
  - posted_date
  fields:
    financing_plan_id: the plan accruing
    customer_id: the customer who holds the plan
    event_type: the family this entry belongs to
    posted_date: the date of the accrual
    billing_cycle: the cycle accrued for
    amount: the interest accrued in the cycle, positive
    statement_number: the statement the accrual was shown on
  account: deferred_interest
  direction: in
  triggers: []
- type: financing_promo_interest_waived
  target: financing_ledger
  meaning: the held-back interest is given back because the promotional term was satisfied
  grain: one row per promotional term satisfied on one plan
  distinguish_by:
  - billing_cycle
  - posted_date
  fields:
    financing_plan_id: the plan credited
    customer_id: the customer who holds the plan
    event_type: the family this entry belongs to
    posted_date: the date the held-back interest was given back
    billing_cycle: the cycle it was given back in
    amount: the held-back interest given back, negative
    waiver_reason_code: promotional term satisfied
    statement_number: the statement it was shown on
  account: deferred_interest
  direction: out
  triggers: []
- type: financing_return_credit_posted
  target: financing_ledger
  meaning: merchandise is returned and the credit is posted against the financed balance
  grain: one row per merchandise line returned against one plan
  distinguish_by:
  - source_entry_id
  - item_sku
  - posted_date
  fields:
    financing_plan_id: the plan credited
    customer_id: the customer who holds the plan
    event_type: the family this entry belongs to
    posted_date: the date the credit was posted
    billing_cycle: the cycle the credit falls in
    amount: the credit, negative
    sales_receipt_number: the till transaction the returned item was sold on
    item_sku: the merchandise line returned
    source_entry_id: the purchase entry the credit gives back
    allocation_bucket: principal, because the credit reduces what is owed
  account: plan_balance
  direction: out
  triggers:
  - event: circle:circle_points_reversed
    map:
      sales_receipt_number: sales_receipt_number
      customer_id: customer_id
      qualifying_spend: amount
- type: financing_fee_waiver_applied
  target: financing_ledger
  meaning: a priced charge already on the plan is given back
  grain: one row per priced charge given back on one plan
  distinguish_by:
  - source_entry_id
  - waiver_reason_code
  - posted_date
  fields:
    financing_plan_id: the plan credited
    customer_id: the customer who holds the plan
    event_type: the family this entry belongs to
    posted_date: the date the charge was given back
    billing_cycle: the cycle the give-back falls in
    amount: the amount given back, negative
    waiver_reason_code: why the charge was given back
    source_entry_id: the charge entry being given back
  account: plan_balance
  direction: out
  triggers: []
- type: financing_service_fee_assessed
  target: financing_ledger
  meaning: a servicing charge of the plan, such as the fee for a posted paper statement or the charge for clearing the plan early, is billed to it
  grain: one row per servicing charge of one kind billed in one cycle
  distinguish_by:
  - fee_code
  - billing_cycle
  - posted_date
  fields:
    financing_plan_id: the plan charged
    customer_id: the customer who holds the plan
    event_type: the family this entry belongs to
    posted_date: the date the charge was billed
    billing_cycle: the cycle the charge belongs to
    amount: the charge, positive
    fee_code: which servicing charge this is
    statement_number: the statement it was presented on
  account: plan_balance
  direction: in
  triggers: []
- type: financing_statement_issued
  target: financing_ledger
  meaning: a billing statement closes and is presented to the customer
  grain: one row per statement closed on one plan
  distinguish_by:
  - billing_cycle
  - statement_number
  fields:
    financing_plan_id: the plan billed
    customer_id: the customer who holds the plan
    event_type: the family this entry belongs to
    posted_date: the statement closing date
    billing_cycle: the cycle the statement covers
    amount: the amount billed on the statement, positive
    payment_due_date: the due date printed on the statement
    statement_number: the reference the statement carries
  triggers: []
measures:
- id: financing_msr_late_fees_12m
  window: the rolling twelve calendar months ending on the handling date, the handling date itself included
  measure: count of financing_late_fee_assessed entries booked to this plan in the window, counting only entries that were not subsequently given back
- id: financing_msr_courtesy_waivers_12m
  window: the rolling twelve calendar months ending on the handling date, the handling date itself included
  measure: count of financing_fee_waiver_applied entries on this plan whose waiver_reason_code is first_courtesy
- id: financing_msr_returned_payments_cycle
  window: the billing cycle the handling date falls in, identified by the billing_cycle value of the entries
  measure: count of financing_returned_payment_fee_assessed entries booked to this plan in that cycle
- id: financing_msr_open_plan_balance
  window: as at the handling date, with no look-back
  measure: sum of current_balance over every financing plan of this customer standing at approved, active, past_due or in_hardship
- id: financing_msr_missed_cycles_review
  window: the rolling window of whole calendar months set by the term's repricing review length, ending on the handling date
  measure: count of billing cycles in the window in which no financing_payment_posted entry settled
policies:
- id: financing_agg_multi_holding
  subject:
  - financing_plan_opened
  rule: The number of promotional financing plans one customer may hold open at the same time is capped for the household as a whole, and a plan counts as open while it stands at applied, approved, active, past due or in a hardship arrangement. A further promotional financing plan is opened for a customer only when no plan already recorded against the same sales receipt number stands at applied, approved, active, past due or in a hardship arrangement. Where the cap is already reached, the desk does not open a further plan and the customer is offered the reallocation of an existing plan instead; a plan that has closed settled, been written off or been cancelled never counts against the cap.
  eligibility:
  - id: no_open_plan_on_same_receipt
    applies_to:
    - financing_plan_opened
    kind: dedup
    condition: A further promotional financing plan is opened for a customer only when no plan already recorded against the same sales receipt number stands at applied, approved, active, past due or in a hardship arrangement.
    evidence_fields:
    - financing_plans.sales_receipt_number
    - financing_plans.status
    - financing_plans.customer_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - financing_plans.sales_receipt_number
      action_bindings:
        financing_plans.sales_receipt_number: sales_receipt_number
    dedup_contract:
      table: financing_plans
      mode: separate_record
      object_bindings:
        sales_receipt_number: sales_receipt_number
      duplicate_filters:
        status:
        - applied
        - approved
        - active
        - past_due
        - in_hardship
      distinct_fields:
      - opened_date
      - variant_name
  params:
    max_per_customer: 4
- id: financing_agg_promotional_balance_cap
  subject:
  - financing_plan_opened
  - financing_purchase_posted
  rule: Every promotional term carries a ceiling on the combined balance the customer may owe across their open financing plans, and the ceiling of the term being written is the one that governs. A new plan on this term is written only when the combined balance across the customer's plans that stand at approved, active, past due or in a hardship arrangement, taken as at the handling date, leaves room under the aggregate promotional balance cap for this term. The combined balance is read as the current balance of each qualifying plan at the handling date, never as the original financed amounts, and plans that have closed settled, been written off or been cancelled are left out of it. Where the room left is smaller than the amount to be financed, the sale may still be written on a term whose ceiling accommodates it, and where no term accommodates it the desk declines the financing and takes the sale on other tender.
  eligibility:
  - id: room_under_aggregate_cap
    applies_to:
    - financing_plan_opened
    kind: authorization
    condition: A new plan on this term is written only when the combined balance across the customer's plans that stand at approved, active, past due or in a hardship arrangement, taken as at the handling date, leaves room under the aggregate promotional balance cap for this term.
    evidence_fields:
    - financing_plans.current_balance
    - financing_plans.status
    - financing_plans.customer_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - financing_plans.customer_id
      action_bindings:
        financing_plans.customer_id: customer_id
  params:
    per_tier:
      6-Month Deferred Interest Plan:
        aggregate_promotional_balance_cap: =aggregate_promotional_balance_cap
        credit_line_utilization_cap_pct: =credit_line_utilization_cap_pct
      12-Month Deferred Interest Plan:
        aggregate_promotional_balance_cap: =aggregate_promotional_balance_cap
        credit_line_utilization_cap_pct: =credit_line_utilization_cap_pct
      18-Month Deferred Interest Plan:
        aggregate_promotional_balance_cap: =aggregate_promotional_balance_cap
        credit_line_utilization_cap_pct: =credit_line_utilization_cap_pct
      24-Month Equal Payment Plan:
        aggregate_promotional_balance_cap: =aggregate_promotional_balance_cap
        credit_line_utilization_cap_pct: =credit_line_utilization_cap_pct
      36-Month Equal Payment Plan:
        aggregate_promotional_balance_cap: =aggregate_promotional_balance_cap
        credit_line_utilization_cap_pct: =credit_line_utilization_cap_pct
      48-Month Bridal Equal Payment Plan:
        aggregate_promotional_balance_cap: =aggregate_promotional_balance_cap
        credit_line_utilization_cap_pct: =credit_line_utilization_cap_pct
  formula:
    when_not: financing_msr_open_plan_balance + original_principal <= aggregate_promotional_balance_cap
  measures:
  - financing_msr_open_plan_balance
- id: financing_plan_eligibility
  subject:
  - financing_plan_opened
  - financing_credit_decision_recorded
  rule: A promotional term is written only for a sale whose financed amount falls between the smallest and the largest amount that term is offered for, measured on the amount left after the down payment taken at the till. An application is decided in the applicant's favour only when the applicant has reached the minimum applicant age in whole years for the term applied for, taken from the date of birth held on the customer profile. An application is decided in the applicant's favour only when the bureau credit score recorded on the application reaches the credit score floor for the term applied for. An application is decided in the applicant's favour only when the down payment taken at the till reaches the minimum share of the pre-tax ticket the term requires. A second applicant may be named only on the terms that admit one, and the longest term is written only against a bridal purchase. Where any of these conditions fails, the desk declines that term and offers the nearest term whose conditions the sale and the applicant do meet; the application itself is never partly approved.
  eligibility:
  - id: applicant_of_age
    applies_to:
    - financing_plan_opened
    - financing_credit_decision_recorded
    kind: authorization
    condition: An application is decided in the applicant's favour only when the applicant has reached the minimum applicant age in whole years for the term applied for, taken from the date of birth held on the customer profile.
    evidence_fields:
    - customers.date_of_birth
    - customers.customer_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - customers.customer_id
      action_bindings:
        customers.customer_id: customer_id
  - id: credit_score_floor
    applies_to:
    - financing_credit_decision_recorded
    kind: authorization
    condition: An application is decided in the applicant's favour only when the bureau credit score recorded on the application reaches the credit score floor for the term applied for.
    evidence_fields:
    - financing_plans.applicant_credit_score
    - financing_plans.sales_receipt_number
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - financing_plans.sales_receipt_number
      action_bindings:
        financing_plans.sales_receipt_number: sales_receipt_number
  - id: down_payment_taken
    applies_to:
    - financing_plan_opened
    kind: authorization
    condition: An application is decided in the applicant's favour only when the down payment taken at the till reaches the minimum share of the pre-tax ticket the term requires.
    evidence_fields:
    - financing_plans.down_payment_amount
    - financing_plans.original_principal
    - financing_plans.sales_receipt_number
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - financing_plans.sales_receipt_number
      action_bindings:
        financing_plans.sales_receipt_number: sales_receipt_number
  params:
    per_tier:
      6-Month Deferred Interest Plan:
        minimum_purchase_amount: =minimum_purchase_amount
        maximum_purchase_amount: =maximum_purchase_amount
        required_credit_score_floor: =required_credit_score_floor
        minimum_down_payment_pct: =minimum_down_payment_pct
        minimum_applicant_age_years: =minimum_applicant_age_years
        joint_applicant_allowed: =joint_applicant_allowed
      12-Month Deferred Interest Plan:
        minimum_purchase_amount: =minimum_purchase_amount
        maximum_purchase_amount: =maximum_purchase_amount
        required_credit_score_floor: =required_credit_score_floor
        minimum_down_payment_pct: =minimum_down_payment_pct
        minimum_applicant_age_years: =minimum_applicant_age_years
        joint_applicant_allowed: =joint_applicant_allowed
      18-Month Deferred Interest Plan:
        minimum_purchase_amount: =minimum_purchase_amount
        maximum_purchase_amount: =maximum_purchase_amount
        required_credit_score_floor: =required_credit_score_floor
        minimum_down_payment_pct: =minimum_down_payment_pct
        minimum_applicant_age_years: =minimum_applicant_age_years
        joint_applicant_allowed: =joint_applicant_allowed
      24-Month Equal Payment Plan:
        minimum_purchase_amount: =minimum_purchase_amount
        maximum_purchase_amount: =maximum_purchase_amount
        required_credit_score_floor: =required_credit_score_floor
        minimum_down_payment_pct: =minimum_down_payment_pct
        minimum_applicant_age_years: =minimum_applicant_age_years
        joint_applicant_allowed: =joint_applicant_allowed
      36-Month Equal Payment Plan:
        minimum_purchase_amount: =minimum_purchase_amount
        maximum_purchase_amount: =maximum_purchase_amount
        required_credit_score_floor: =required_credit_score_floor
        minimum_down_payment_pct: =minimum_down_payment_pct
        minimum_applicant_age_years: =minimum_applicant_age_years
        joint_applicant_allowed: =joint_applicant_allowed
      48-Month Bridal Equal Payment Plan:
        minimum_purchase_amount: =minimum_purchase_amount
        maximum_purchase_amount: =maximum_purchase_amount
        required_credit_score_floor: =required_credit_score_floor
        minimum_down_payment_pct: =minimum_down_payment_pct
        minimum_applicant_age_years: =minimum_applicant_age_years
        joint_applicant_allowed: =joint_applicant_allowed
  formula:
    when_not: original_principal < minimum_purchase_amount or original_principal > maximum_purchase_amount
    approved: applicant_credit_score >= required_credit_score_floor and down_payment_amount >= original_principal * minimum_down_payment_pct / 100
- id: financing_evt_purchase_posting
  subject:
  - financing_purchase_posted
  rule: The financed merchandise is billed to the plan as one entry per merchandise line on the sales receipt, carrying the receipt reference and the item reference it was sold under. A purchase is posted to a promotional financing plan only while that plan stands at applied, approved or active. The price of a protection plan is added to the financed balance only on the terms that admit it; where the term does not admit it the protection plan is taken on other tender and no entry is booked here. Where the sale is later unwound in full, the purchase entries are not deleted but answered by return credits that carry the same receipt and item references.
  eligibility:
  - id: plan_open_for_posting
    applies_to:
    - financing_purchase_posted
    kind: state
    condition: A purchase is posted to a promotional financing plan only while that plan stands at applied, approved or active.
    evidence_fields:
    - financing_plans.status
    - financing_plans.financing_plan_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - financing_plans.financing_plan_id
      action_bindings:
        financing_plans.financing_plan_id: financing_plan_id
    state_contract:
      field: financing_plans.status
      allowed:
      - applied
      - approved
      - active
  params:
    per_tier:
      6-Month Deferred Interest Plan:
        protection_plan_may_be_financed: =protection_plan_may_be_financed
      12-Month Deferred Interest Plan:
        protection_plan_may_be_financed: =protection_plan_may_be_financed
      18-Month Deferred Interest Plan:
        protection_plan_may_be_financed: =protection_plan_may_be_financed
      24-Month Equal Payment Plan:
        protection_plan_may_be_financed: =protection_plan_may_be_financed
      36-Month Equal Payment Plan:
        protection_plan_may_be_financed: =protection_plan_may_be_financed
      48-Month Bridal Equal Payment Plan:
        protection_plan_may_be_financed: =protection_plan_may_be_financed
- id: financing_evt_statement_cycle
  subject:
  - financing_statement_issued
  - financing_service_fee_assessed
  rule: A statement closes on the plan's statement day each cycle and prints a payment due date a fixed number of calendar days later, that number being set by the term. A statement is produced only while that plan stands at active, past due or in a hardship arrangement, and only when the balance reaches the smallest balance the term produces a statement for. The scheduled monthly payment billed on the statement is the larger of the term's payment floor and the term's payment factor applied to the promotional balance at the start of the term, rounded to the cent. Statements are delivered on the term's default channel until the customer changes it, and a posted paper statement carries the term's paper statement fee each cycle it is posted. Where the balance is below the statement threshold the cycle is skipped and no due date arises from it, and where the remaining balance is at or below the term's write-off threshold it is written off rather than billed. A servicing charge such as the paper statement fee, or the charge the term makes for clearing the plan early, is billed to the plan as its own entry in the cycle it arises in and carries the charge code that names which of them it is, so a cycle carrying two different servicing charges records two entries.
  eligibility:
  - id: plan_billing
    applies_to:
    - financing_statement_issued
    - financing_service_fee_assessed
    kind: state
    condition: A statement is produced only while that plan stands at active, past due or in a hardship arrangement, and only when the balance reaches the smallest balance the term produces a statement for.
    evidence_fields:
    - financing_plans.status
    - financing_plans.current_balance
    - financing_plans.financing_plan_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - financing_plans.financing_plan_id
      action_bindings:
        financing_plans.financing_plan_id: financing_plan_id
    state_contract:
      field: financing_plans.status
      allowed:
      - active
      - past_due
      - in_hardship
  params:
    per_tier:
      6-Month Deferred Interest Plan:
        statement_lead_days: =statement_lead_days
        billing_cycle_days: =billing_cycle_days
        minimum_payment_factor_pct: =minimum_payment_factor_pct
        minimum_monthly_payment_floor: =minimum_monthly_payment_floor
        paper_statement_fee: =paper_statement_fee
        statement_delivery_default: =statement_delivery_default
        minimum_statement_balance_to_issue: =minimum_statement_balance_to_issue
        residual_balance_writeoff_threshold: =residual_balance_writeoff_threshold
      12-Month Deferred Interest Plan:
        statement_lead_days: =statement_lead_days
        billing_cycle_days: =billing_cycle_days
        minimum_payment_factor_pct: =minimum_payment_factor_pct
        minimum_monthly_payment_floor: =minimum_monthly_payment_floor
        paper_statement_fee: =paper_statement_fee
        statement_delivery_default: =statement_delivery_default
        minimum_statement_balance_to_issue: =minimum_statement_balance_to_issue
        residual_balance_writeoff_threshold: =residual_balance_writeoff_threshold
      18-Month Deferred Interest Plan:
        statement_lead_days: =statement_lead_days
        billing_cycle_days: =billing_cycle_days
        minimum_payment_factor_pct: =minimum_payment_factor_pct
        minimum_monthly_payment_floor: =minimum_monthly_payment_floor
        paper_statement_fee: =paper_statement_fee
        statement_delivery_default: =statement_delivery_default
        minimum_statement_balance_to_issue: =minimum_statement_balance_to_issue
        residual_balance_writeoff_threshold: =residual_balance_writeoff_threshold
      24-Month Equal Payment Plan:
        statement_lead_days: =statement_lead_days
        billing_cycle_days: =billing_cycle_days
        minimum_payment_factor_pct: =minimum_payment_factor_pct
        minimum_monthly_payment_floor: =minimum_monthly_payment_floor
        paper_statement_fee: =paper_statement_fee
        statement_delivery_default: =statement_delivery_default
        minimum_statement_balance_to_issue: =minimum_statement_balance_to_issue
        residual_balance_writeoff_threshold: =residual_balance_writeoff_threshold
      36-Month Equal Payment Plan:
        statement_lead_days: =statement_lead_days
        billing_cycle_days: =billing_cycle_days
        minimum_payment_factor_pct: =minimum_payment_factor_pct
        minimum_monthly_payment_floor: =minimum_monthly_payment_floor
        paper_statement_fee: =paper_statement_fee
        statement_delivery_default: =statement_delivery_default
        minimum_statement_balance_to_issue: =minimum_statement_balance_to_issue
        residual_balance_writeoff_threshold: =residual_balance_writeoff_threshold
      48-Month Bridal Equal Payment Plan:
        statement_lead_days: =statement_lead_days
        billing_cycle_days: =billing_cycle_days
        minimum_payment_factor_pct: =minimum_payment_factor_pct
        minimum_monthly_payment_floor: =minimum_monthly_payment_floor
        paper_statement_fee: =paper_statement_fee
        statement_delivery_default: =statement_delivery_default
        minimum_statement_balance_to_issue: =minimum_statement_balance_to_issue
        residual_balance_writeoff_threshold: =residual_balance_writeoff_threshold
  formula:
    when_not: current_balance < minimum_statement_balance_to_issue
    scheduled_payment: max(minimum_monthly_payment_floor, round(original_principal * minimum_payment_factor_pct / 100, 2))
- id: financing_evt_payment_allocation
  subject:
  - financing_payment_posted
  rule: A payment is applied across what is owed in the order the term sets, and each term states that order once and in full. A payment is posted to a plan only while that plan stands at approved, active, past due or in a hardship arrangement. A payment received on one of the term's same-day channels before the term's cut-off time in the Eastern time zone is credited on the day it is received; a payment received after the cut-off, or on any other channel, is credited on the next day the business runs its posting. Where a payment exceeds what is owed the surplus is refunded to the tender it arrived on rather than held on the plan, and clearing the plan early carries the term's prepayment charge. A payment that the bank returns unpaid is reversed out of the balance it was credited against and is treated as never made for the purposes of lateness.
  eligibility:
  - id: plan_open_for_payment
    applies_to:
    - financing_payment_posted
    kind: state
    condition: A payment is posted to a plan only while that plan stands at approved, active, past due or in a hardship arrangement.
    evidence_fields:
    - financing_plans.status
    - financing_plans.financing_plan_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - financing_plans.financing_plan_id
      action_bindings:
        financing_plans.financing_plan_id: financing_plan_id
    state_contract:
      field: financing_plans.status
      allowed:
      - approved
      - active
      - past_due
      - in_hardship
  params:
    per_tier:
      6-Month Deferred Interest Plan:
        payment_allocation_order: =payment_allocation_order
        payment_cutoff_time_et: =payment_cutoff_time_et
        same_day_credit_channels: =same_day_credit_channels
        prepayment_penalty_pct: =prepayment_penalty_pct
      12-Month Deferred Interest Plan:
        payment_allocation_order: =payment_allocation_order
        payment_cutoff_time_et: =payment_cutoff_time_et
        same_day_credit_channels: =same_day_credit_channels
        prepayment_penalty_pct: =prepayment_penalty_pct
      18-Month Deferred Interest Plan:
        payment_allocation_order: =payment_allocation_order
        payment_cutoff_time_et: =payment_cutoff_time_et
        same_day_credit_channels: =same_day_credit_channels
        prepayment_penalty_pct: =prepayment_penalty_pct
      24-Month Equal Payment Plan:
        payment_allocation_order: =payment_allocation_order
        payment_cutoff_time_et: =payment_cutoff_time_et
        same_day_credit_channels: =same_day_credit_channels
        prepayment_penalty_pct: =prepayment_penalty_pct
      36-Month Equal Payment Plan:
        payment_allocation_order: =payment_allocation_order
        payment_cutoff_time_et: =payment_cutoff_time_et
        same_day_credit_channels: =same_day_credit_channels
        prepayment_penalty_pct: =prepayment_penalty_pct
      48-Month Bridal Equal Payment Plan:
        payment_allocation_order: =payment_allocation_order
        payment_cutoff_time_et: =payment_cutoff_time_et
        same_day_credit_channels: =same_day_credit_channels
        prepayment_penalty_pct: =prepayment_penalty_pct
  formula:
    when_not: payment_outcome != "settled"
    balance_after_payment: current_balance + amount
- id: financing_evt_late_fee
  subject:
  - financing_late_fee_assessed
  - financing_plan_marked_past_due
  rule: A scheduled payment not settled by its due date carries a late fee once the term's grace period has run out. A late fee is charged only when the handling date has passed the payment due date printed on the statement for that billing cycle extended by the grace period of the term, and equality with that boundary does not yet make the payment late. Grace is counted in whole calendar days from the payment due date, never in twenty-four hour periods, the day of the due date itself counting as day zero, and where the resulting boundary falls on a day the business does not open the boundary still stands on that calendar day. A late fee is charged only while the plan stands at active or past due. The first lateness inside the term's repeat window carries the first-lateness fee and a later one inside the same window carries the repeat fee, the window being the rolling number of whole months the term sets and counted backwards from the missed due date. No single late fee exceeds the term's ceiling expressed as a share of the scheduled monthly payment, and where a plan is delinquent for several cycles one fee arises per missed due date and never more than one. Where automatic payment failed through no fault of the customer the fee is not charged at all for a replacement payment made inside the term's automatic payment grace, and that non-charge is not a courtesy give-back.
  eligibility:
  - id: grace_period_elapsed
    applies_to:
    - financing_late_fee_assessed
    kind: time
    condition: A late fee is charged only when the handling date has passed the payment due date printed on the statement for that billing cycle extended by the grace period of the term, and equality with that boundary does not yet make the payment late.
    evidence_fields:
    - financing_ledger.payment_due_date
    - financing_ledger.posted_date
    - financing_ledger.financing_plan_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - financing_ledger.financing_plan_id
      action_bindings:
        financing_ledger.financing_plan_id: financing_plan_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the payment due date printed on the statement for that billing cycle
      anchor_source: financing_ledger.payment_due_date
      relation: not_before
      duration_source: variants.grace_period_days
      unit: calendar_days
      counting_rule: Grace is counted in whole calendar days from the payment due date, never in twenty-four hour periods, the day of the due date itself counting as day zero, and where the resulting boundary falls on a day the business does not open the boundary still stands on that calendar day.
      boundary: exclusive
  - id: plan_billing_or_delinquent
    applies_to:
    - financing_late_fee_assessed
    - financing_plan_marked_past_due
    kind: state
    condition: A late fee is charged only while the plan stands at active or past due.
    evidence_fields:
    - financing_plans.status
    - financing_plans.financing_plan_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - financing_plans.financing_plan_id
      action_bindings:
        financing_plans.financing_plan_id: financing_plan_id
    state_contract:
      field: financing_plans.status
      allowed:
      - active
      - past_due
  params:
    per_tier:
      6-Month Deferred Interest Plan:
        grace_period_days: =grace_period_days
        late_fee_first: =late_fee_first
        late_fee_repeat: =late_fee_repeat
        late_fee_repeat_window_months: =late_fee_repeat_window_months
        late_fee_cap_pct_of_scheduled_payment: =late_fee_cap_pct_of_scheduled_payment
        autopay_failure_grace_days: =autopay_failure_grace_days
        days_past_due_to_delinquent: =days_past_due_to_delinquent
      12-Month Deferred Interest Plan:
        grace_period_days: =grace_period_days
        late_fee_first: =late_fee_first
        late_fee_repeat: =late_fee_repeat
        late_fee_repeat_window_months: =late_fee_repeat_window_months
        late_fee_cap_pct_of_scheduled_payment: =late_fee_cap_pct_of_scheduled_payment
        autopay_failure_grace_days: =autopay_failure_grace_days
        days_past_due_to_delinquent: =days_past_due_to_delinquent
      18-Month Deferred Interest Plan:
        grace_period_days: =grace_period_days
        late_fee_first: =late_fee_first
        late_fee_repeat: =late_fee_repeat
        late_fee_repeat_window_months: =late_fee_repeat_window_months
        late_fee_cap_pct_of_scheduled_payment: =late_fee_cap_pct_of_scheduled_payment
        autopay_failure_grace_days: =autopay_failure_grace_days
        days_past_due_to_delinquent: =days_past_due_to_delinquent
      24-Month Equal Payment Plan:
        grace_period_days: =grace_period_days
        late_fee_first: =late_fee_first
        late_fee_repeat: =late_fee_repeat
        late_fee_repeat_window_months: =late_fee_repeat_window_months
        late_fee_cap_pct_of_scheduled_payment: =late_fee_cap_pct_of_scheduled_payment
        autopay_failure_grace_days: =autopay_failure_grace_days
        days_past_due_to_delinquent: =days_past_due_to_delinquent
      36-Month Equal Payment Plan:
        grace_period_days: =grace_period_days
        late_fee_first: =late_fee_first
        late_fee_repeat: =late_fee_repeat
        late_fee_repeat_window_months: =late_fee_repeat_window_months
        late_fee_cap_pct_of_scheduled_payment: =late_fee_cap_pct_of_scheduled_payment
        autopay_failure_grace_days: =autopay_failure_grace_days
        days_past_due_to_delinquent: =days_past_due_to_delinquent
      48-Month Bridal Equal Payment Plan:
        grace_period_days: =grace_period_days
        late_fee_first: =late_fee_first
        late_fee_repeat: =late_fee_repeat
        late_fee_repeat_window_months: =late_fee_repeat_window_months
        late_fee_cap_pct_of_scheduled_payment: =late_fee_cap_pct_of_scheduled_payment
        autopay_failure_grace_days: =autopay_failure_grace_days
        days_past_due_to_delinquent: =days_past_due_to_delinquent
  formula:
    when_not: days_past_due <= grace_period_days
    late_fee_amount: min(late_fee_repeat if financing_msr_late_fees_12m > 0 else late_fee_first, round(scheduled_monthly_payment * late_fee_cap_pct_of_scheduled_payment / 100, 2))
  measures:
  - financing_msr_late_fees_12m
- id: financing_evt_returned_payment
  subject:
  - financing_returned_payment_fee_assessed
  rule: A payment the bank returns unpaid carries the term's returned payment fee, charged against the returned payment itself. A returned payment fee is charged against a returned payment only when no returned payment fee already stands against that same returned payment entry. No more returned payment fees are charged within one billing cycle than the term's per-cycle ceiling, and a return that would exceed the ceiling is recorded without a fee. Where the bank confirms the return arose from its own error the fee is given back under the bank error reason rather than under a courtesy reason, and the give-back does not consume a courtesy allowance.
  eligibility:
  - id: one_fee_per_returned_payment
    applies_to:
    - financing_returned_payment_fee_assessed
    kind: dedup
    condition: A returned payment fee is charged against a returned payment only when no returned payment fee already stands against that same returned payment entry.
    evidence_fields:
    - financing_ledger.source_entry_id
    - financing_ledger.fee_code
    - financing_ledger.billing_cycle
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - financing_ledger.source_entry_id
      action_bindings:
        financing_ledger.source_entry_id: source_entry_id
    dedup_contract:
      table: financing_ledger
      mode: separate_record
      object_bindings:
        source_entry_id: source_entry_id
      duplicate_filters:
        fee_code:
        - returned_payment
      distinct_fields:
      - billing_cycle
      - posted_date
  params:
    per_tier:
      6-Month Deferred Interest Plan:
        returned_payment_fee: =returned_payment_fee
        returned_payment_fee_cap_per_cycle: =returned_payment_fee_cap_per_cycle
      12-Month Deferred Interest Plan:
        returned_payment_fee: =returned_payment_fee
        returned_payment_fee_cap_per_cycle: =returned_payment_fee_cap_per_cycle
      18-Month Deferred Interest Plan:
        returned_payment_fee: =returned_payment_fee
        returned_payment_fee_cap_per_cycle: =returned_payment_fee_cap_per_cycle
      24-Month Equal Payment Plan:
        returned_payment_fee: =returned_payment_fee
        returned_payment_fee_cap_per_cycle: =returned_payment_fee_cap_per_cycle
      36-Month Equal Payment Plan:
        returned_payment_fee: =returned_payment_fee
        returned_payment_fee_cap_per_cycle: =returned_payment_fee_cap_per_cycle
      48-Month Bridal Equal Payment Plan:
        returned_payment_fee: =returned_payment_fee
        returned_payment_fee_cap_per_cycle: =returned_payment_fee_cap_per_cycle
  formula:
    when_not: financing_msr_returned_payments_cycle >= returned_payment_fee_cap_per_cycle
    returned_payment_charge: returned_payment_fee
  measures:
  - financing_msr_returned_payments_cycle
- id: financing_promotional_interest
  subject:
  - financing_promo_interest_accrued
  - financing_deferred_interest_assessed
  - financing_promo_interest_waived
  rule: On a deferred interest term, interest accrues on the promotional balance each cycle at the term's promotional rate and is held back rather than billed; on an equal payment term the promotional rate is charged in the cycle it accrues and nothing is held back. Held-back interest is given back only when the balance on the plan reached zero no later than the promotional term measured in whole calendar months from the date the plan began billing. Promotional months are counted as whole calendar months from the date the plan began billing, and where the anniversary day does not exist in the closing month the boundary falls on the last day of that month. Where the promotional term closes with any balance outstanding on a term that forfeits, the whole of the held-back interest is billed to the plan in the cycle the term closed in, and it is billed once and not cycle by cycle. While automatic payment is in force the promotional rate is reduced by the term's automatic payment discount, and the reduction stops applying from the cycle in which automatic payment lapses. A plan repriced to the penalty rate after the term's missed-payment trigger keeps that rate until the term's review length of consecutive on-time payments has passed, whereupon the ordinary rate returns.
  eligibility:
  - id: promotional_term_satisfied
    applies_to:
    - financing_promo_interest_waived
    kind: time
    condition: Held-back interest is given back only when the balance on the plan reached zero no later than the promotional term measured in whole calendar months from the date the plan began billing.
    evidence_fields:
    - financing_plans.activated_date
    - financing_plans.current_balance
    - financing_plans.financing_plan_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - financing_plans.financing_plan_id
      action_bindings:
        financing_plans.financing_plan_id: financing_plan_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the date the plan began billing
      anchor_source: financing_plans.activated_date
      relation: not_after
      duration_source: variants.promo_term_months
      unit: calendar_months
      counting_rule: Promotional months are counted as whole calendar months from the date the plan began billing, and where the anniversary day does not exist in the closing month the boundary falls on the last day of that month.
      boundary: inclusive
  params:
    per_tier:
      6-Month Deferred Interest Plan:
        promo_structure: =promo_structure
        promotional_apr_pct: =promotional_apr_pct
        standard_apr_pct: =standard_apr_pct
        penalty_apr_pct: =penalty_apr_pct
        penalty_apr_trigger_missed_payments: =penalty_apr_trigger_missed_payments
        penalty_apr_review_months: =penalty_apr_review_months
        autopay_apr_discount_pct: =autopay_apr_discount_pct
        deferred_interest_forfeited_on_unpaid_balance: =deferred_interest_forfeited_on_unpaid_balance
        promo_satisfaction_buffer_days: =promo_satisfaction_buffer_days
        promo_expiry_notice_days: =promo_expiry_notice_days
      12-Month Deferred Interest Plan:
        promo_structure: =promo_structure
        promotional_apr_pct: =promotional_apr_pct
        standard_apr_pct: =standard_apr_pct
        penalty_apr_pct: =penalty_apr_pct
        penalty_apr_trigger_missed_payments: =penalty_apr_trigger_missed_payments
        penalty_apr_review_months: =penalty_apr_review_months
