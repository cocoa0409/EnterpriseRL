  factors:
  - id: rebuild_payment_factor
    effect: parameter
    decides: payment_factor_pct
    bindings:
    - months_billing
    - payment_factor_pct
    ladder:
    - when: the plan stands past due at the handling date
      value: "K('arrears_payment_factor_pct')"
    - when: automatic payment is in force on the plan and the plan has been billing for at least the term's repricing review length in whole calendar months
      value: "K('steady_payment_factor_pct')"
    - when: otherwise
      value: "P('minimum_payment_factor_pct')"
    baseline:
      payment_factor_pct: "P('minimum_payment_factor_pct')"
    evidence:
    - date
    - tier_param
    cross_difficulty: null
  - id: rebuild_interest_rate
    effect: parameter
    decides: applicable_rate
    bindings:
    - returns_in_window
    - applicable_rate
    ladder:
    - when: the plan carries at least the term's repricing trigger number of payments sent back unpaid inside the term's repricing review window
      value: "P('penalty_apr_pct')"
    - when: automatic payment is in force on the plan and fewer than that many payments have been sent back unpaid inside that window
      value: "RND(P('promotional_apr_pct') - P('autopay_apr_discount_pct'), 2)"
    - when: otherwise
      value: "P('promotional_apr_pct')"
    baseline:
      applicable_rate: "P('promotional_apr_pct')"
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: balance_adjustment_reading
    effect: method
    decides: adjust_window_months
    bindings:
    - givebacks_this_month
    - adjust_window_months
    ladder:
    - when: a give-back has been booked to the plan in the whole month ending on the handling date
      method: only the give-backs booked in that single whole month adjust the balance
    - when: no give-back has been booked in that month and the plan stands past due at the handling date
      method: every give-back booked since the plan began billing adjusts the balance
    - when: otherwise
      method: the give-backs booked in the term's repeat window of whole calendar months adjust the balance
    baseline:
      adjust_window_months: "P('late_fee_repeat_window_months')"
    evidence:
    - history
    cross_difficulty: null
  - id: cycle_interest_convention
    effect: method
    decides: interest_component
    bindings:
    - last_statement_date
    - interest_component
    ladder:
    - when: the plan stands past due at the handling date
      method: the interest runs on the actual number of days from the closing date of the most recent statement to the handling date, on a year of three hundred and sixty-five days
    - when: the plan stands active and automatic payment is in force on it
      method: the interest runs on the actual number of days from the closing date of the most recent statement to the handling date, on a year of three hundred and sixty days
    - when: otherwise
      method: the interest runs on the term's nominal billing cycle length, on a year of three hundred and sixty-five days
    baseline:
      interest_component: "RND(balance_now * applicable_rate / 100 * P('billing_cycle_days') / 365, 2)"
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: missed_cycle_catchup
    effect: parameter
    decides: catchup_component
    bindings:
    - returns_this_month
    - returned_amount_month
    - catchup_component
    ladder:
    - when: the plan stands past due at the handling date
      value: the money sent back unpaid in the whole month ending on the handling date spread evenly over the months the term's arrangement runs for
    - when: the plan stands active at the handling date and a payment on it has been sent back unpaid in that month
      value: the scheduled monthly payment the plan record carries spread evenly over those months
    - when: otherwise
      value: no catch-up is owed
    baseline:
      catchup_component: "0.0"
    evidence:
    - history
    cross_difficulty: null
  - id: carried_coverage_amount
    effect: parameter
    decides: coverage_component
    bindings:
    - coverage_standing
    - coverage_arrangement
    - coverage_allowance
    - coverage_deductible
    - coverage_monthly_premium
    - coverage_component
    ladder:
    - when: the care coverage on the financed piece stands in force and its premium is collected month by month
      value: the premium that coverage charges for one month
    - when: the care coverage on the financed piece stands in force and the benefit allowance it still carries stands above its deductible
      value: "K('coverage_servicing_amount')"
    - when: otherwise
      value: nothing is carried for coverage
    baseline:
      coverage_component: "0.0"
    evidence:
    - cross_category
    cross_difficulty: protection
  baseline:
    rule: >-
      The rebuilt payment a plan bills each cycle is the principal share of what it owes, together
      with the interest one cycle carries, the catch-up the plan owes for a cycle not paid and the
      amount the plan carries for coverage taken out on the financed piece. The balance the rebuilt
      payment is worked out on is the balance the plan record carries at the handling date, adjusted
      by the give-backs booked to the plan inside the stretch of whole calendar months the
      adjustment reading runs over, and it never falls below nothing. The stretch the adjustment
      reading runs over is the term's repeat window of whole calendar months ending on the handling
      date. The principal share is the term's payment factor applied to that balance and rounded to
      the cent. The rate the cycle's interest is priced at is the term's promotional rate. The
      interest one cycle carries is that balance at that rate for the term's nominal billing cycle
      length on a year of three hundred and sixty-five days, rounded to the cent. No catch-up is
      owed. Nothing is carried for coverage. The principal share, the interest, the catch-up and the
      coverage amount are added, that sum is rounded to the cent, and where the rounded figure falls
      below nothing the payment stands at nothing.
    params:
    - minimum_payment_factor_pct
    - promotional_apr_pct
    - billing_cycle_days
    - late_fee_repeat_window_months
  inputs:
    history:
    - {table: financing_ledger, aggregate: sum, field: amount, within_months: 6, filters: {event_type: financing_fee_waiver_applied}}
    - {table: financing_ledger, aggregate: count, field: ledger_entry_id, within_months: 12, filters: {event_type: financing_payment_posted, payment_outcome: returned_nsf}}
    - {table: financing_ledger, aggregate: latest, field: posted_date, within_months: 12, filters: {event_type: financing_statement_issued}}
    cross_category:
    - protection
- id: financing_ext_hardship_schedule
  base_policy_refs:
  - financing_hardship_arrangement
  overwrite:
  - base_policy: financing_hardship_arrangement
    superseded_clause: >-
      The reduced payment billed during the arrangement is the term's hardship share of the ordinary
      scheduled payment, rounded to the cent, and on the terms that pause interest no interest
      accrues for the paused months.
    replaced_by: >-
      The reduced payment a plan bills while an arrangement runs is the hardship share applied to
      the payment the arrangement is built on, increased by the interest the arrangement carries and
      by the arrangement charge the desk makes, and reduced by the relief the desk allows for the
      customer's other commitments with the chain.
  trigger: on_request
  subject:
  - financing_hardship_enrolled
  computes: reduced_payment_amount
  target_tool: confirm_hardship_schedule_eb08e7db
  params:
    delinquent_arrangement_multiple: 2
    long_standing_multiple: 2
    repeat_arrangement_share_pct: 75.0
    long_standing_hardship_share_pct: 45.0
    repeat_arrangement_charge: 5.0
    arrangement_charge: 2.5
    standard_arrangement_charge: 7.5
    larger_commitment_relief: 15.0
    commitment_relief: 8.0
  rule: >-
    The reduced payment a plan bills while an arrangement runs is the hardship share applied to the
    payment the arrangement is built on, increased by the interest the arrangement carries and by
    the arrangement charge the desk makes, and reduced by the relief the desk allows for the
    customer's other commitments with the chain. The payment the arrangement is built on is the
    scheduled monthly payment the plan record carries. The months the arrangement runs for are the
    term's hardship length. The hardship share is the term's hardship share. The arrangement carries
    no interest. The arrangement charge the desk makes is this desk's standard arrangement charge.
    No relief is allowed for other commitments. The hardship share is applied to the payment the
    arrangement is built on and that figure is rounded to the cent; the interest and the arrangement
    charge are then added to it and the relief is taken off; the result is rounded to the cent at
    the end only, and where the rounded figure falls below nothing the payment stands at nothing.
    The months the arrangement runs for are twice the term's hardship length where the plan stands
    past due at the handling date; they are the whole calendar months the promotional term still has
    to run, that is the term's promotional length less the whole calendar months the plan has been
    billing, where the plan has been billing for at least the term's promotional length less the
    term's hardship length; and they are the term's hardship length for every other plan. The
    payment the arrangement is built on is the term's payment floor where the scheduled monthly
    payment the plan record carries stands below that floor; it is the scheduled monthly payment the
    plan record carries together with the money sent back unpaid in the whole month ending on the
    handling date spread evenly over the months the arrangement runs for, where that payment stands
    at or above the floor and a payment on the plan has been sent back unpaid in that month; and it
    is the scheduled monthly payment the plan record carries for every other plan. The hardship
    share is this desk's repeat-arrangement share where an arrangement already stands in force on
    the plan at the handling date; it is this desk's long-standing share where no arrangement stands
    in force and the plan began billing at least twice the term's minimum hardship tenure in whole
    calendar months before the handling date; and it is the term's hardship share for every other
    plan. The interest the arrangement carries is the balance the plan owes after the give-backs booked
    in the whole month ending on the handling date, taken at the term's
    penalty rate for one month of a twelve-month year, where two or more payments on the plan have
    been sent back unpaid inside the term's repricing review window; it is that balance at the
    term's promotional rate for one month of a twelve-month year where exactly one payment has been
    sent back unpaid inside that window; and the arrangement carries no interest for every other
    plan. The arrangement charge the desk makes is this desk's repeat-arrangement charge where an
    arrangement already stands in force on the plan at the handling date; it is this desk's
    arrangement charge where no arrangement stands in force and a payment on the plan has been sent
    back unpaid in the whole month ending on the handling date; and it is this desk's standard
    arrangement charge for every other plan. The relief the desk allows for other commitments is
    this desk's larger commitment relief where the customer has a commission with the design studio
    standing in production with a balance still to pay; it is this desk's commitment relief where
    the customer has a commission with the design studio standing at the approval of its design with
    a balance still to pay; and no relief is allowed for other commitments for every other customer.
    The reduced payment is worked out only once the scheduled monthly payment the plan record
    carries answers the balance the plan owes at the handling date.
  prerequisite:
  - problem: financing_ext_schedule_rebuild
    kind: value_input
    gate: ordinary_payment
    form: state
    policy_source: >-
      The reduced payment is worked out only once the scheduled monthly payment the plan record
      carries answers the balance the plan owes at the handling date.
    condition: >-
      The scheduled monthly payment standing on the plan record is the figure the plan's own balance
      at the handling date produces, rather than the figure carried from before that balance moved.
    resolved_by: update_scheduled_payment_2c04479a
    effect: >-
      The payment the arrangement is built on reads the rebuilt figure from the plan record instead
      of the figure the plan carried before, so the reduced payment changes with it.
  cross_category:
  - category: custom
    as: branch
    reads:
    - status
    - balance_due
    note: >-
      The commitment relief factor decides its tier from the stage the customer's design studio
      commission stands at and whether a balance is still to pay on it.
  compute:
  - months_billing: "MONTHS(F('activated_date'), NOW)"
  - arrangement_months: "P('hardship_term_months') * K('delinquent_arrangement_multiple') if F('status') == 'past_due' else (MX(1, P('promo_term_months') - months_billing) if months_billing >= P('promo_term_months') - P('hardship_term_months') else P('hardship_term_months'))"
  - returned_amount_month: "ABS(SUM('financing_ledger', 'amount', within_months=1, date_field='posted_date', event_type='financing_payment_posted', payment_outcome='returned_nsf'))"
  - ordinary_payment: "P('minimum_monthly_payment_floor') if F('scheduled_monthly_payment') < P('minimum_monthly_payment_floor') else (F('scheduled_monthly_payment') + RND(returned_amount_month / arrangement_months, 2) if returned_amount_month > 0 else F('scheduled_monthly_payment'))"
  - hardship_share_pct: "K('repeat_arrangement_share_pct') if F('hardship_plan_code') != 'none' else (K('long_standing_hardship_share_pct') if MONTHS(F('activated_date'), NOW) >= P('hardship_min_months_active') * K('long_standing_multiple') else P('hardship_reduced_payment_pct'))"
  - reduced_base: "RND(ordinary_payment * hardship_share_pct / 100, 2)"
  - balance_for_interest: "F('current_balance') + SUM('financing_ledger', 'amount', within_months=1, date_field='posted_date', event_type='financing_fee_waiver_applied')"
  - returns_in_review: "COUNT('financing_ledger', within_months=P('penalty_apr_review_months'), date_field='posted_date', event_type='financing_payment_posted', payment_outcome='returned_nsf')"
  - rate_component: "RND(balance_for_interest * P('penalty_apr_pct') / 100 / 12, 2) if returns_in_review >= 2 else (RND(balance_for_interest * P('promotional_apr_pct') / 100 / 12, 2) if returns_in_review == 1 else 0.0)"
  - returns_this_month: "COUNT('financing_ledger', within_months=1, date_field='posted_date', event_type='financing_payment_posted', payment_outcome='returned_nsf')"
  - arrangement_setup_charge: "K('repeat_arrangement_charge') if F('hardship_plan_code') != 'none' else (K('arrangement_charge') if returns_this_month > 0 else K('standard_arrangement_charge'))"
  - commission_stage: "CFIELD('custom', 'status')"
  - commission_balance: "CFIELD('custom', 'balance_due')"
  - commitment_relief: "K('larger_commitment_relief') if (commission_stage == 'in_production' and commission_balance > 0) else (K('commitment_relief') if (commission_stage == 'design_approval' and commission_balance > 0) else 0.0)"
  - result: "MX(0.0, RND(reduced_base + rate_component + arrangement_setup_charge - commitment_relief, 2))"
  compute_basis:
    months_billing: >-
      The months the arrangement runs for are twice the term's hardship length where the plan stands
      past due at the handling date; they are the whole calendar months the promotional term still
      has to run, that is the term's promotional length less the whole calendar months the plan has
      been billing, where the plan has been billing for at least the term's promotional length less
      the term's hardship length; and they are the term's hardship length for every other plan.
    arrangement_months: >-
      The months the arrangement runs for are twice the term's hardship length where the plan stands
      past due at the handling date; they are the whole calendar months the promotional term still
      has to run, that is the term's promotional length less the whole calendar months the plan has
      been billing, where the plan has been billing for at least the term's promotional length less
      the term's hardship length; and they are the term's hardship length for every other plan.
    returned_amount_month: >-
      The payment the arrangement is built on is the term's payment floor where the scheduled
      monthly payment the plan record carries stands below that floor; it is the scheduled monthly
      payment the plan record carries together with the money sent back unpaid in the whole month
      ending on the handling date spread evenly over the months the arrangement runs for, where that
      payment stands at or above the floor and a payment on the plan has been sent back unpaid in
      that month; and it is the scheduled monthly payment the plan record carries for every other
      plan.
    ordinary_payment: >-
      The payment the arrangement is built on is the term's payment floor where the scheduled
      monthly payment the plan record carries stands below that floor; it is the scheduled monthly
      payment the plan record carries together with the money sent back unpaid in the whole month
      ending on the handling date spread evenly over the months the arrangement runs for, where that
      payment stands at or above the floor and a payment on the plan has been sent back unpaid in
      that month; and it is the scheduled monthly payment the plan record carries for every other
      plan.
    hardship_share_pct: >-
      The hardship share is this desk's repeat-arrangement share where an arrangement already stands
      in force on the plan at the handling date; it is this desk's long-standing share where no
      arrangement stands in force and the plan began billing at least twice the term's minimum
      hardship tenure in whole calendar months before the handling date; and it is the term's
      hardship share for every other plan.
    reduced_base: >-
      The hardship share is applied to the payment the arrangement is built on and that figure is
      rounded to the cent; the interest and the arrangement charge are then added to it and the
      relief is taken off; the result is rounded to the cent at the end only, and where the rounded
      figure falls below nothing the payment stands at nothing.
    balance_for_interest: >-
      The interest the arrangement carries is the balance the plan owes after the give-backs booked
      in the whole month ending on the handling date, taken at the term's penalty
      rate for one month of a twelve-month year, where two or more payments on the plan have been
      sent back unpaid inside the term's repricing review window; it is that balance at the term's
      promotional rate for one month of a twelve-month year where exactly one payment has been sent
      back unpaid inside that window; and the arrangement carries no interest for every other plan.
    returns_in_review: >-
      The interest the arrangement carries is the balance the plan owes after the give-backs booked
      in the whole month ending on the handling date, taken at the term's penalty
      rate for one month of a twelve-month year, where two or more payments on the plan have been
      sent back unpaid inside the term's repricing review window; it is that balance at the term's
      promotional rate for one month of a twelve-month year where exactly one payment has been sent
      back unpaid inside that window; and the arrangement carries no interest for every other plan.
    rate_component: >-
      The interest the arrangement carries is the balance the plan owes after the give-backs booked
      in the whole month ending on the handling date, taken at the term's penalty
      rate for one month of a twelve-month year, where two or more payments on the plan have been
      sent back unpaid inside the term's repricing review window; it is that balance at the term's
      promotional rate for one month of a twelve-month year where exactly one payment has been sent
      back unpaid inside that window; and the arrangement carries no interest for every other plan.
    returns_this_month: >-
      The arrangement charge the desk makes is this desk's repeat-arrangement charge where an
      arrangement already stands in force on the plan at the handling date; it is this desk's
      arrangement charge where no arrangement stands in force and a payment on the plan has been
      sent back unpaid in the whole month ending on the handling date; and it is this desk's
      standard arrangement charge for every other plan.
    arrangement_setup_charge: >-
      The arrangement charge the desk makes is this desk's repeat-arrangement charge where an
      arrangement already stands in force on the plan at the handling date; it is this desk's
      arrangement charge where no arrangement stands in force and a payment on the plan has been
      sent back unpaid in the whole month ending on the handling date; and it is this desk's
      standard arrangement charge for every other plan.
    commission_stage: >-
      The relief the desk allows for other commitments is this desk's larger commitment relief where
