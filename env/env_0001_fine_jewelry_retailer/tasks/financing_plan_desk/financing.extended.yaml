      desk takes the year to run to, the product rounded to the cent at that point. The
      settlement rate is the term's promotional rate. The number of days the final part of the
      cycle runs to is counted from the closing date of the most recent statement to the
      handling date. The priced charges standing unanswered are read as the lateness charges and
      the returned-payment charges booked to the plan inside the stretch of whole calendar
      months the charge reading runs over, ending on the handling date, taken together with the
      give-backs booked in that same stretch, which are negative and so reduce the total. The
      stretch the charge reading runs over is the term's repeat window of whole calendar months.
      The balance, the interest over the final part of the cycle and the priced charges standing
