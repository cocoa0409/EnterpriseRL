        standard_apr_pct: =standard_apr_pct
        penalty_apr_pct: =penalty_apr_pct
        penalty_apr_trigger_missed_payments: =penalty_apr_trigger_missed_payments
        penalty_apr_review_months: =penalty_apr_review_months
        autopay_apr_discount_pct: =autopay_apr_discount_pct
        deferred_interest_forfeited_on_unpaid_balance: =deferred_interest_forfeited_on_unpaid_balance
        promo_satisfaction_buffer_days: =promo_satisfaction_buffer_days
        promo_expiry_notice_days: =promo_expiry_notice_days
  formula:
    when: promo_structure == "deferred_interest"
    interest_billed_at_term_close: accrued_promo_interest if current_balance > 0 else 0
- id: financing_courtesy_waiver
  subject:
  - financing_fee_waiver_applied
  rule: A late fee already charged may be given back as a courtesy a limited number of times in a rolling twelve months, the allowance being set by the term. A courtesy give-back is granted against a late fee only when no give-back already stands against that same late fee entry. A courtesy give-back is granted only when the plan has been billing for at least the minimum courtesy tenure in whole calendar months counted from the date the plan began billing. Courtesy tenure is counted in whole calendar months from the date the plan began billing, and where the anniversary day does not exist in the closing month the boundary falls on the last day of that month. A give-back made because the bank confirmed its own error, or made to put right a service failure of the chain's own, is recorded under its own reason and does not consume the courtesy allowance. Where the allowance is exhausted the desk does not give the fee back and the request is answered by explaining the allowance; a give-back is never granted against a charge that has already been given back.
  eligibility:
  - id: one_giveback_per_charge
    applies_to:
    - financing_fee_waiver_applied
    kind: dedup
    condition: A courtesy give-back is granted against a late fee only when no give-back already stands against that same late fee entry.
    evidence_fields:
    - financing_ledger.source_entry_id
    - financing_ledger.waiver_reason_code
    - financing_ledger.posted_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - financing_ledger.source_entry_id
      action_bindings:
        financing_ledger.source_entry_id: source_entry_id
    dedup_contract:
      table: financing_ledger
      mode: separate_record
      object_bindings:
        source_entry_id: source_entry_id
      duplicate_filters:
        waiver_reason_code:
        - first_courtesy
        - service_recovery
        - bank_error
      distinct_fields:
      - posted_date
      - billing_cycle
  - id: minimum_courtesy_tenure
    applies_to:
    - financing_fee_waiver_applied
    kind: time
    condition: A courtesy give-back is granted only when the plan has been billing for at least the minimum courtesy tenure in whole calendar months counted from the date the plan began billing.
    evidence_fields:
    - financing_plans.activated_date
    - financing_plans.financing_plan_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - financing_plans.financing_plan_id
      action_bindings:
        financing_plans.financing_plan_id: financing_plan_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the date the plan began billing
      anchor_source: financing_plans.activated_date
      relation: not_before
      duration_source: variants.courtesy_waiver_minimum_tenure_months
      unit: calendar_months
      counting_rule: Courtesy tenure is counted in whole calendar months from the date the plan began billing, and where the anniversary day does not exist in the closing month the boundary falls on the last day of that month.
      boundary: inclusive
  params:
    per_tier:
      6-Month Deferred Interest Plan:
        courtesy_late_fee_waivers_per_12_months: =courtesy_late_fee_waivers_per_12_months
        courtesy_waiver_minimum_tenure_months: =courtesy_waiver_minimum_tenure_months
      12-Month Deferred Interest Plan:
        courtesy_late_fee_waivers_per_12_months: =courtesy_late_fee_waivers_per_12_months
        courtesy_waiver_minimum_tenure_months: =courtesy_waiver_minimum_tenure_months
      18-Month Deferred Interest Plan:
        courtesy_late_fee_waivers_per_12_months: =courtesy_late_fee_waivers_per_12_months
        courtesy_waiver_minimum_tenure_months: =courtesy_waiver_minimum_tenure_months
      24-Month Equal Payment Plan:
        courtesy_late_fee_waivers_per_12_months: =courtesy_late_fee_waivers_per_12_months
        courtesy_waiver_minimum_tenure_months: =courtesy_waiver_minimum_tenure_months
      36-Month Equal Payment Plan:
        courtesy_late_fee_waivers_per_12_months: =courtesy_late_fee_waivers_per_12_months
        courtesy_waiver_minimum_tenure_months: =courtesy_waiver_minimum_tenure_months
      48-Month Bridal Equal Payment Plan:
        courtesy_late_fee_waivers_per_12_months: =courtesy_late_fee_waivers_per_12_months
        courtesy_waiver_minimum_tenure_months: =courtesy_waiver_minimum_tenure_months
  formula:
    when_not: financing_msr_courtesy_waivers_12m >= courtesy_late_fee_waivers_per_12_months
    waiver_amount: amount
  measures:
  - financing_msr_courtesy_waivers_12m
- id: financing_return_credit
  subject:
  - financing_return_credit_posted
  rule: Merchandise returned against a financed sale is credited to the plan rather than refunded in cash, because the chain never paid the customer in cash for it. A merchandise return credit is posted only against the ledger entry that recorded the original purchase of the returned item, identified by the sales receipt number and the item reference it was sold under. A merchandise return credit is posted to the plan no later than the posting window in business days counted from the date the return was accepted at the store, which is the posted date carried by the accepted return entry. Business days are counted on the retail calendar that excludes Saturdays, Sundays and the chain's published store holidays, the day the return was accepted counting as day zero, and calendar days are never substituted for business days. On the terms that rebuild the schedule, the remaining payments are recalculated over the payments still to run; on the terms that do not, the credit shortens the plan and the scheduled payment is left as it was. Where the credit clears the balance the plan closes settled, and where the credit exceeds the balance the surplus is refunded to the tender the down payment arrived on. A down payment is given back only inside the term's down payment refund window, counted from the day of sale.
  eligibility:
  - id: credit_bound_to_original_purchase
    applies_to:
    - financing_return_credit_posted
    kind: authorization
    condition: A merchandise return credit is posted only against the ledger entry that recorded the original purchase of the returned item, identified by the sales receipt number and the item reference it was sold under.
    evidence_fields:
    - financing_ledger.source_entry_id
    - financing_ledger.sales_receipt_number
    - financing_ledger.item_sku
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - financing_ledger.sales_receipt_number
        - financing_ledger.item_sku
      - - financing_ledger.source_entry_id
      action_bindings:
        financing_ledger.sales_receipt_number: sales_receipt_number
        financing_ledger.item_sku: item_sku
        financing_ledger.source_entry_id: source_entry_id
  - id: posting_window
    applies_to:
    - financing_return_credit_posted
    kind: time
    condition: A merchandise return credit is posted to the plan no later than the posting window in business days counted from the date the return was accepted at the store, which is the posted date carried by the accepted return entry.
    evidence_fields:
    - financing_ledger.posted_date
    - financing_ledger.sales_receipt_number
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - financing_ledger.sales_receipt_number
      action_bindings:
        financing_ledger.sales_receipt_number: sales_receipt_number
    temporal_basis:
      clock: frozen_time
      anchor_event: the date the return was accepted at the store
      anchor_source: financing_ledger.posted_date
      relation: not_after
      duration_source: variants.return_credit_posting_business_days
      unit: business_days
      counting_rule: Business days are counted on the retail calendar that excludes Saturdays, Sundays and the chain's published store holidays, the day the return was accepted counting as day zero, and calendar days are never substituted for business days.
      boundary: inclusive
  params:
    per_tier:
      6-Month Deferred Interest Plan:
        return_credit_posting_business_days: =return_credit_posting_business_days
        return_credit_recalculates_schedule: =return_credit_recalculates_schedule
        down_payment_refund_window_days: =down_payment_refund_window_days
      12-Month Deferred Interest Plan:
        return_credit_posting_business_days: =return_credit_posting_business_days
        return_credit_recalculates_schedule: =return_credit_recalculates_schedule
        down_payment_refund_window_days: =down_payment_refund_window_days
      18-Month Deferred Interest Plan:
        return_credit_posting_business_days: =return_credit_posting_business_days
        return_credit_recalculates_schedule: =return_credit_recalculates_schedule
        down_payment_refund_window_days: =down_payment_refund_window_days
      24-Month Equal Payment Plan:
        return_credit_posting_business_days: =return_credit_posting_business_days
        return_credit_recalculates_schedule: =return_credit_recalculates_schedule
        down_payment_refund_window_days: =down_payment_refund_window_days
      36-Month Equal Payment Plan:
        return_credit_posting_business_days: =return_credit_posting_business_days
        return_credit_recalculates_schedule: =return_credit_recalculates_schedule
        down_payment_refund_window_days: =down_payment_refund_window_days
      48-Month Bridal Equal Payment Plan:
        return_credit_posting_business_days: =return_credit_posting_business_days
        return_credit_recalculates_schedule: =return_credit_recalculates_schedule
        down_payment_refund_window_days: =down_payment_refund_window_days
  formula:
    when_not: sales_receipt_number == ""
    credit_posted_to_balance: 0 - abs(amount)
- id: financing_hardship_arrangement
  subject:
  - financing_hardship_enrolled
  - financing_plan_terms_updated
  rule: A hardship arrangement replaces the ordinary billing schedule for a fixed run of months, and each term states which arrangement it offers and for how long. A hardship arrangement is enrolled, and the servicing details it changes are written, only while the plan stands at active, past due or in an existing hardship arrangement being replaced within its enrolment allowance. The reduced payment billed during the arrangement is the term's hardship share of the ordinary scheduled payment, rounded to the cent, and on the terms that pause interest no interest accrues for the paused months. One plan is never enrolled in more arrangements than the term allows over its whole life, and a plan that has not yet been billing for the term's minimum hardship tenure is not enrolled at all. The customer's request for a hardship arrangement is taken on the financing service request record and only takes effect once the customer confirms the replacement schedule, because the schedule is a commitment only they can make. Where the arrangement breaks down the plan returns to the ordinary schedule from the next cycle and the missed months are treated as arrears rather than forgiven.
  eligibility:
  - id: plan_servicing_state
    applies_to:
    - financing_hardship_enrolled
    - financing_plan_terms_updated
    kind: state
    condition: A hardship arrangement is enrolled, and the servicing details it changes are written, only while the plan stands at active, past due or in an existing hardship arrangement being replaced within its enrolment allowance.
    evidence_fields:
    - financing_plans.status
    - financing_plans.hardship_plan_code
    - financing_plans.financing_plan_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - financing_plans.financing_plan_id
      action_bindings:
        financing_plans.financing_plan_id: financing_plan_id
    state_contract:
      field: financing_plans.status
      allowed:
      - active
      - past_due
      - in_hardship
  params:
    per_tier:
      6-Month Deferred Interest Plan:
        hardship_min_months_active: =hardship_min_months_active
        hardship_max_enrollments_per_plan: =hardship_max_enrollments_per_plan
        hardship_reduced_payment_pct: =hardship_reduced_payment_pct
        hardship_term_months: =hardship_term_months
        hardship_interest_pause_months: =hardship_interest_pause_months
        autopay_setup_lead_days: =autopay_setup_lead_days
      12-Month Deferred Interest Plan:
        hardship_min_months_active: =hardship_min_months_active
        hardship_max_enrollments_per_plan: =hardship_max_enrollments_per_plan
        hardship_reduced_payment_pct: =hardship_reduced_payment_pct
        hardship_term_months: =hardship_term_months
        hardship_interest_pause_months: =hardship_interest_pause_months
        autopay_setup_lead_days: =autopay_setup_lead_days
      18-Month Deferred Interest Plan:
        hardship_min_months_active: =hardship_min_months_active
        hardship_max_enrollments_per_plan: =hardship_max_enrollments_per_plan
        hardship_reduced_payment_pct: =hardship_reduced_payment_pct
        hardship_term_months: =hardship_term_months
        hardship_interest_pause_months: =hardship_interest_pause_months
        autopay_setup_lead_days: =autopay_setup_lead_days
      24-Month Equal Payment Plan:
        hardship_min_months_active: =hardship_min_months_active
        hardship_max_enrollments_per_plan: =hardship_max_enrollments_per_plan
        hardship_reduced_payment_pct: =hardship_reduced_payment_pct
        hardship_term_months: =hardship_term_months
        hardship_interest_pause_months: =hardship_interest_pause_months
        autopay_setup_lead_days: =autopay_setup_lead_days
      36-Month Equal Payment Plan:
        hardship_min_months_active: =hardship_min_months_active
        hardship_max_enrollments_per_plan: =hardship_max_enrollments_per_plan
        hardship_reduced_payment_pct: =hardship_reduced_payment_pct
        hardship_term_months: =hardship_term_months
        hardship_interest_pause_months: =hardship_interest_pause_months
        autopay_setup_lead_days: =autopay_setup_lead_days
      48-Month Bridal Equal Payment Plan:
        hardship_min_months_active: =hardship_min_months_active
        hardship_max_enrollments_per_plan: =hardship_max_enrollments_per_plan
        hardship_reduced_payment_pct: =hardship_reduced_payment_pct
        hardship_term_months: =hardship_term_months
        hardship_interest_pause_months: =hardship_interest_pause_months
        autopay_setup_lead_days: =autopay_setup_lead_days
  formula:
    hardship_scheduled_payment: round(scheduled_monthly_payment * hardship_reduced_payment_pct / 100, 2)
- id: financing_delinquency_and_charge_off
  subject:
  - financing_plan_marked_past_due
  - financing_plan_reinstated
  - financing_plan_charged_off
  rule: A plan whose oldest unpaid scheduled payment reaches the term's delinquency threshold in calendar days is marked past due, and it stays past due until the arrears are cleared. A plan is brought current and reinstated only while it stands past due, and it returns to active once the arrears are cleared. A plan is reinstated only when the number of days past due carried at the time of the request has not exceeded the reinstatement limit for its term, counted from the earliest payment due date printed on a statement that is still unpaid. Days past due are counted in whole calendar days from the earliest unpaid payment due date to the handling date, weekends and store holidays included, and part days are never rounded up. A plan that reaches the term's write-off threshold in days past due is written off to collections, the balance standing at the moment of write-off is recorded, and the plan closes. A plan repriced to the penalty rate because it missed the term's trigger number of scheduled payments inside the repricing review window keeps that rate until the review passes clean. Once a plan is written off the desk no longer services it and the customer is directed to the collections partner; reinstating a written-off plan is not something this desk can do.
  eligibility:
  - id: reinstatable_state
    applies_to:
    - financing_plan_reinstated
    kind: state
    condition: A plan is brought current and reinstated only while it stands past due, and it returns to active once the arrears are cleared.
    evidence_fields:
    - financing_plans.status
    - financing_plans.financing_plan_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - financing_plans.financing_plan_id
      action_bindings:
        financing_plans.financing_plan_id: financing_plan_id
    state_contract:
      field: financing_plans.status
      allowed:
      - past_due
      - active
  - id: within_reinstatement_limit
    applies_to:
    - financing_plan_reinstated
    kind: time
    condition: A plan is reinstated only when the number of days past due carried at the time of the request has not exceeded the reinstatement limit for its term, counted from the earliest payment due date printed on a statement that is still unpaid.
    evidence_fields:
    - financing_ledger.payment_due_date
    - financing_ledger.financing_plan_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - financing_ledger.financing_plan_id
      action_bindings:
        financing_ledger.financing_plan_id: financing_plan_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the earliest payment due date printed on a statement that is still unpaid
      anchor_source: financing_ledger.payment_due_date
      relation: not_after
      duration_source: variants.reinstatement_max_days_past_due
      unit: calendar_days
      counting_rule: Days past due are counted in whole calendar days from the earliest unpaid payment due date to the handling date, weekends and store holidays included, and part days are never rounded up.
      boundary: inclusive
  params:
    per_tier:
      6-Month Deferred Interest Plan:
        days_past_due_to_delinquent: =days_past_due_to_delinquent
        charge_off_days_past_due: =charge_off_days_past_due
        reinstatement_max_days_past_due: =reinstatement_max_days_past_due
        penalty_apr_trigger_missed_payments: =penalty_apr_trigger_missed_payments
        penalty_apr_review_months: =penalty_apr_review_months
      12-Month Deferred Interest Plan:
        days_past_due_to_delinquent: =days_past_due_to_delinquent
        charge_off_days_past_due: =charge_off_days_past_due
        reinstatement_max_days_past_due: =reinstatement_max_days_past_due
        penalty_apr_trigger_missed_payments: =penalty_apr_trigger_missed_payments
        penalty_apr_review_months: =penalty_apr_review_months
      18-Month Deferred Interest Plan:
        days_past_due_to_delinquent: =days_past_due_to_delinquent
        charge_off_days_past_due: =charge_off_days_past_due
        reinstatement_max_days_past_due: =reinstatement_max_days_past_due
        penalty_apr_trigger_missed_payments: =penalty_apr_trigger_missed_payments
        penalty_apr_review_months: =penalty_apr_review_months
      24-Month Equal Payment Plan:
        days_past_due_to_delinquent: =days_past_due_to_delinquent
        charge_off_days_past_due: =charge_off_days_past_due
        reinstatement_max_days_past_due: =reinstatement_max_days_past_due
        penalty_apr_trigger_missed_payments: =penalty_apr_trigger_missed_payments
        penalty_apr_review_months: =penalty_apr_review_months
      36-Month Equal Payment Plan:
        days_past_due_to_delinquent: =days_past_due_to_delinquent
        charge_off_days_past_due: =charge_off_days_past_due
        reinstatement_max_days_past_due: =reinstatement_max_days_past_due
        penalty_apr_trigger_missed_payments: =penalty_apr_trigger_missed_payments
        penalty_apr_review_months: =penalty_apr_review_months
      48-Month Bridal Equal Payment Plan:
        days_past_due_to_delinquent: =days_past_due_to_delinquent
        charge_off_days_past_due: =charge_off_days_past_due
        reinstatement_max_days_past_due: =reinstatement_max_days_past_due
        penalty_apr_trigger_missed_payments: =penalty_apr_trigger_missed_payments
        penalty_apr_review_months: =penalty_apr_review_months
  formula:
    charged_off: days_past_due >= charge_off_days_past_due
  measures:
  - financing_msr_missed_cycles_review
- id: financing_closure_and_payoff
  subject:
  - financing_plan_activated
  - financing_plan_closed_paid
  rule: A plan begins billing only while it stands approved and no earlier than the first statement closing after approval, and the activation date recorded is that statement's closing date. A payoff figure is the current balance together with any held-back interest the term would forfeit, taken as at the day the figure is quoted. A payoff figure is honoured at settlement only when the handling date has not passed the validity window of the quote, counted from the date the payoff quote was issued to the customer. Quote validity is counted in whole calendar days from the day the quote was issued, that day counting as day zero, weekends and store holidays included. A plan whose balance reaches zero closes settled on the day the last payment or credit posted, and a residual at or below the term's write-off threshold is written off rather than pursued. A payoff quote is taken on the financing service request record and the settlement itself is made by the customer, because paying out a plan disposes of their own money.
  eligibility:
  - id: approved_before_billing
    applies_to:
    - financing_plan_activated
    kind: state
    condition: A plan begins billing only while it stands approved and no earlier than the first statement closing after approval, and the activation date recorded is that statement's closing date.
    evidence_fields:
    - financing_plans.status
    - financing_plans.financing_plan_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - financing_plans.financing_plan_id
      action_bindings:
        financing_plans.financing_plan_id: financing_plan_id
    state_contract:
      field: financing_plans.status
      allowed:
      - approved
      - active
  - id: quote_still_valid
    applies_to:
    - financing_plan_closed_paid
    kind: time
    condition: A payoff figure is honoured at settlement only when the handling date has not passed the validity window of the quote, counted from the date the payoff quote was issued to the customer.
    evidence_fields:
    - financing_intake.created_at
    - financing_intake.financing_plan_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - financing_intake.financing_plan_id
      action_bindings:
        financing_intake.financing_plan_id: financing_plan_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the date the payoff quote was issued to the customer
      anchor_source: financing_intake.created_at
      relation: not_after
      duration_source: variants.payoff_quote_validity_days
      unit: calendar_days
      counting_rule: Quote validity is counted in whole calendar days from the day the quote was issued, that day counting as day zero, weekends and store holidays included.
      boundary: inclusive
  params:
    per_tier:
      6-Month Deferred Interest Plan:
        payoff_quote_validity_days: =payoff_quote_validity_days
        residual_balance_writeoff_threshold: =residual_balance_writeoff_threshold
      12-Month Deferred Interest Plan:
        payoff_quote_validity_days: =payoff_quote_validity_days
        residual_balance_writeoff_threshold: =residual_balance_writeoff_threshold
      18-Month Deferred Interest Plan:
        payoff_quote_validity_days: =payoff_quote_validity_days
        residual_balance_writeoff_threshold: =residual_balance_writeoff_threshold
      24-Month Equal Payment Plan:
        payoff_quote_validity_days: =payoff_quote_validity_days
        residual_balance_writeoff_threshold: =residual_balance_writeoff_threshold
      36-Month Equal Payment Plan:
        payoff_quote_validity_days: =payoff_quote_validity_days
        residual_balance_writeoff_threshold: =residual_balance_writeoff_threshold
      48-Month Bridal Equal Payment Plan:
        payoff_quote_validity_days: =payoff_quote_validity_days
        residual_balance_writeoff_threshold: =residual_balance_writeoff_threshold
  formula:
    payoff_amount: current_balance + (accrued_promo_interest if deferred_interest_forfeited_on_unpaid_balance else 0)
- id: financing_application_withdrawal
  subject:
  - financing_application_withdrawn
  rule: 'An application may be withdrawn, or approved terms declined, before the plan starts billing, and the plan is then cancelled rather than closed. A withdrawal is taken only while the application stands at applied or approved, and the plan is then recorded as cancelled. An application is withdrawn without charge only when the request reaches the finance desk within the cooling-off window of the term, counted from the date the financing application was taken. The cooling-off window is counted in whole calendar days from the day the application was taken, that day counting as day zero, and where the last day falls on a day the store does not open the window runs to the next day the store opens. A purchase already moved to a different promotional term is treated as a reallocation rather than a withdrawal, and reallocation is offered only on the terms that admit it and only inside that term''s reallocation window. Withdrawing the financing does not by itself unwind the sale: the merchandise is either paid for on other tender or returned under the return rules, and the desk records which of the two the customer chose. The withdrawal itself is confirmed by the customer on the financing service request record, because declining credit already approved in their name is theirs alone to do.'
  eligibility:
  - id: pre_billing_state
    applies_to:
    - financing_application_withdrawn
    kind: state
    condition: A withdrawal is taken only while the application stands at applied or approved, and the plan is then recorded as cancelled.
    evidence_fields:
    - financing_plans.status
    - financing_plans.financing_plan_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - financing_plans.financing_plan_id
      action_bindings:
        financing_plans.financing_plan_id: financing_plan_id
    state_contract:
      field: financing_plans.status
      allowed:
      - applied
      - approved
      - cancelled
  - id: cooling_off_window
    applies_to:
    - financing_application_withdrawn
    kind: time
    condition: An application is withdrawn without charge only when the request reaches the finance desk within the cooling-off window of the term, counted from the date the financing application was taken.
    evidence_fields:
    - financing_plans.opened_date
    - financing_plans.financing_plan_id
