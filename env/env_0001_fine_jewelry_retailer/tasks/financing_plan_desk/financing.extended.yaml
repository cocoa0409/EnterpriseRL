    params:
    - day_count_year_days
    - promotional_apr_pct
    - late_fee_repeat_window_months
  inputs:
    history:
    - {table: financing_ledger, aggregate: count, field: ledger_entry_id, within_months: 12, filters: {event_type: financing_payment_posted, payment_outcome: settled}}
    - {table: financing_ledger, aggregate: latest, field: payment_due_date, within_months: 24, filters: {event_type: financing_statement_issued}}
    - {table: financing_ledger, aggregate: sum, field: amount, within_months: 16, filters: {event_type: financing_late_fee_assessed}}
    - {table: financing_ledger, aggregate: sum, field: amount, within_months: 16, filters: {event_type: financing_fee_waiver_applied}}
    cross_category:
    - tradein
- id: financing_ext_returned_payment_charge
  base_policy_refs:
  - financing_evt_returned_payment
  overwrite:
  - base_policy: financing_evt_returned_payment
    superseded_clause: >-
      A payment the bank returns unpaid carries the term's returned payment fee, charged against
      the returned payment itself.
    replaced_by: >-
      A payment the bank has sent back unpaid carries a returned-payment charge, worked out as
      the base charge for the return less every allowance the desk grants against it, and
      charged against the returned payment entry itself.
  trigger: state_due
  subject:
  - financing_returned_payment_fee_assessed
  computes: charge_amount
  target_tool: book_returned_payment_charge_6a9e81de
  params:
    return_history_months: 12
    repeat_return_pct: 25.0
    clean_history_relief_pct: 40.0
    same_day_channel_relief: 6.0
    posted_cheque_relief: 3.0
    coverage_relief: 8.0
    single_premium_coverage_relief: 4.0
    long_tenure_relief: 5.0
    standing_tenure_relief: 2.5
    long_tenure_multiple: 2
  rule: >-
    A payment the bank has sent back unpaid carries a returned-payment charge, worked out as the
    base charge for the return less every allowance the desk grants against it, and charged
    against the returned payment entry itself. The returned payment the charge answers is the
    most recently presented payment the bank has sent back unpaid on the plan. The base charge
    is the term's returned payment fee. The allowances the desk grants are the channel
    allowance, the coverage allowance and the standing allowance, and each of them is worked out
    on its own and taken off the base charge once, so that they are never applied one to the
    result of another. No channel allowance is granted. No coverage allowance is granted. No
    standing allowance is granted. The base charge less the three allowances is rounded to the
    cent, and where the rounded figure falls below nothing the charge stands at nothing. The stretch of whole calendar months the return
    history is read over runs the twelve whole calendar months ending on the handling date where
    the plan stands past due at the handling date; it runs back to the date the plan began
    billing where the plan has been billing for fewer whole calendar months than the term's
    repeat window; and it runs the term's repeat window of whole calendar months back from the
    handling date for every other plan. The base charge is the term's returned payment fee
    raised by this desk's repeat-return share where two or more payments have been sent back
    unpaid inside the stretch the return history is read over and the plan stands past due at
    the handling date; it is the term's returned payment fee reduced by this desk's
    clean-history share where no payment has been sent back unpaid inside that stretch and the
    plan has been billing for at least the term's minimum courtesy tenure in whole calendar
    months; and it is the term's returned payment fee for every other plan. The channel
    allowance is this desk's same-day channel allowance where the returned payment came in on a
    channel the term credits on the day it is received and it is the only payment sent back on
    the plan in the whole month ending on the handling date; it is this desk's posted-cheque
    allowance where the returned payment came in by posted cheque and it is the only payment
    sent back on the plan in that month; and no channel allowance is granted for every other
    return. The coverage allowance is this desk's coverage allowance where the customer holds
    care coverage standing in force whose premium that coverage collects month by month and a
    premium has been taken under it in the three whole calendar months ending on the handling
    date; it is this desk's single-premium coverage allowance where the customer holds care
    coverage standing in force whose premium that coverage collects in one payment; and no
    coverage allowance is granted for every other customer. The standing allowance is this
    desk's long-standing allowance where the plan began billing at least twice the term's
    minimum courtesy tenure in whole calendar months before the handling date and the customer
    put down at least the share of the ticket the term requires at the till; it is this desk's
    standing allowance where the plan began billing at least the term's minimum courtesy tenure
    but fewer than twice that many whole calendar months before the handling date; and no
    standing allowance is granted for every other plan.
  prerequisite: []
  cross_category:
  - category: protection
    as: history
    reads:
    - status
    - premium_payment_schedule
    - protection_ledger.event_type
    note: >-
      The coverage allowance factor decides its tier from the customer's care coverage record,
      the coverage's premium schedule parameter and the premiums taken under that coverage.
  compute:
  - months_billing: "MONTHS(F('activated_date'), NOW)"
  - returns_window_months: "K('return_history_months') if F('status') == 'past_due' else (MX(1, months_billing) if months_billing < P('late_fee_repeat_window_months') else P('late_fee_repeat_window_months'))"
  - returns_count: "COUNT('financing_ledger', within_months=returns_window_months, date_field='posted_date', event_type='financing_payment_posted', payment_outcome='returned_nsf')"
  - base_fee: "RND(P('returned_payment_fee') * (100 + K('repeat_return_pct')) / 100, 2) if (returns_count >= 2 and F('status') == 'past_due') else (RND(P('returned_payment_fee') * (100 - K('clean_history_relief_pct')) / 100, 2) if (returns_count == 0 and months_billing >= P('courtesy_waiver_minimum_tenure_months')) else P('returned_payment_fee'))"
  - returned_channel: "LATEST('financing_ledger', 'payment_channel', date_field='posted_date', event_type='financing_payment_posted', payment_outcome='returned_nsf')"
  - returns_this_cycle: "COUNT('financing_ledger', within_months=1, date_field='posted_date', event_type='financing_payment_posted', payment_outcome='returned_nsf')"
  - channel_relief: "K('same_day_channel_relief') if ((returned_channel == 'in_store' or returned_channel == 'online_portal' or returned_channel == 'phone_agent') and returns_this_cycle == 1) else (K('posted_cheque_relief') if (returned_channel == 'mail_check' and returns_this_cycle == 1) else 0.0)"
  - coverage_status: "CFIELD('protection', 'status')"
  - coverage_schedule: "CPARAM('protection', 'premium_payment_schedule')"
  - coverage_premiums_recent: "XCOUNT('protection', 'protection_ledger', within_months=3, date_field='posted_date', event_type='protection_premium_paid')"
  - coverage_relief_amount: "K('coverage_relief') if (coverage_status == 'active' and coverage_schedule == 'monthly' and coverage_premiums_recent >= 1) else (K('single_premium_coverage_relief') if (coverage_status == 'active' and coverage_schedule == 'single_payment') else 0.0)"
  - down_payment_share: "F('down_payment_amount') / MX(1.0, F('original_principal')) * 100"
  - tenure_relief_amount: "K('long_tenure_relief') if (MONTHS(F('activated_date'), NOW) >= P('courtesy_waiver_minimum_tenure_months') * K('long_tenure_multiple') and down_payment_share >= P('minimum_down_payment_pct')) else (K('standing_tenure_relief') if (MONTHS(F('activated_date'), NOW) >= P('courtesy_waiver_minimum_tenure_months') and MONTHS(F('activated_date'), NOW) < P('courtesy_waiver_minimum_tenure_months') * K('long_tenure_multiple')) else 0.0)"
  - result: "MX(0.0, RND(base_fee - channel_relief - coverage_relief_amount - tenure_relief_amount, 2))"
  compute_basis:
    months_billing: >-
      The standing allowance is this desk's long-standing allowance where the plan began billing
      at least twice the term's minimum courtesy tenure in whole calendar months before the
      handling date and the customer put down at least the share of the ticket the term requires
      at the till; it is this desk's standing allowance where the plan began billing at least
      the term's minimum courtesy tenure but fewer than twice that many whole calendar months
      before the handling date; and no standing allowance is granted for every other plan.
    returns_window_months: >-
      The stretch of whole calendar months the return history is read over runs the twelve whole
      calendar months ending on the handling date where the plan stands past due at the handling
      date; it runs back to the date the plan began billing where the plan has been billing for
      fewer whole calendar months than the term's repeat window; and it runs the term's repeat
      window of whole calendar months back from the handling date for every other plan.
    returns_count: >-
      The base charge is the term's returned payment fee raised by this desk's repeat-return
      share where two or more payments have been sent back unpaid inside the stretch the return
      history is read over and the plan stands past due at the handling date; it is the term's
      returned payment fee reduced by this desk's clean-history share where no payment has been
      sent back unpaid inside that stretch and the plan has been billing for at least the term's
      minimum courtesy tenure in whole calendar months; and it is the term's returned payment
      fee for every other plan.
    base_fee: >-
      The base charge is the term's returned payment fee raised by this desk's repeat-return
      share where two or more payments have been sent back unpaid inside the stretch the return
      history is read over and the plan stands past due at the handling date; it is the term's
      returned payment fee reduced by this desk's clean-history share where no payment has been
      sent back unpaid inside that stretch and the plan has been billing for at least the term's
      minimum courtesy tenure in whole calendar months; and it is the term's returned payment
      fee for every other plan.
    returned_channel: >-
      The returned payment the charge answers is the most recently presented payment the bank has
      sent back unpaid on the plan.
    returns_this_cycle: >-
      The channel allowance is this desk's same-day channel allowance where the returned payment
      came in on a channel the term credits on the day it is received and it is the only payment
      sent back on the plan in the whole month ending on the handling date; it is this desk's
      posted-cheque allowance where the returned payment came in by posted cheque and it is the
      only payment sent back on the plan in that month; and no channel allowance is granted for
      every other return.
    channel_relief: >-
      The channel allowance is this desk's same-day channel allowance where the returned payment
      came in on a channel the term credits on the day it is received and it is the only payment
      sent back on the plan in the whole month ending on the handling date; it is this desk's
      posted-cheque allowance where the returned payment came in by posted cheque and it is the
      only payment sent back on the plan in that month; and no channel allowance is granted for
      every other return.
    coverage_status: >-
      The coverage allowance is this desk's coverage allowance where the customer holds care
      coverage standing in force whose premium that coverage collects month by month and a
      premium has been taken under it in the three whole calendar months ending on the handling
      date; it is this desk's single-premium coverage allowance where the customer holds care
      coverage standing in force whose premium that coverage collects in one payment; and no
      coverage allowance is granted for every other customer.
    coverage_schedule: >-
      The coverage allowance is this desk's coverage allowance where the customer holds care
      coverage standing in force whose premium that coverage collects month by month and a
      premium has been taken under it in the three whole calendar months ending on the handling
      date; it is this desk's single-premium coverage allowance where the customer holds care
      coverage standing in force whose premium that coverage collects in one payment; and no
      coverage allowance is granted for every other customer.
    coverage_premiums_recent: >-
      The coverage allowance is this desk's coverage allowance where the customer holds care
      coverage standing in force whose premium that coverage collects month by month and a
      premium has been taken under it in the three whole calendar months ending on the handling
      date; it is this desk's single-premium coverage allowance where the customer holds care
      coverage standing in force whose premium that coverage collects in one payment; and no
      coverage allowance is granted for every other customer.
    coverage_relief_amount: >-
      The coverage allowance is this desk's coverage allowance where the customer holds care
      coverage standing in force whose premium that coverage collects month by month and a
      premium has been taken under it in the three whole calendar months ending on the handling
      date; it is this desk's single-premium coverage allowance where the customer holds care
      coverage standing in force whose premium that coverage collects in one payment; and no
      coverage allowance is granted for every other customer.
    tenure_relief_amount: >-
      The standing allowance is this desk's long-standing allowance where the plan began billing
      at least twice the term's minimum courtesy tenure in whole calendar months before the
      handling date and the customer put down at least the share of the ticket the term requires
      at the till; it is this desk's standing allowance where the plan began billing at least
      the term's minimum courtesy tenure but fewer than twice that many whole calendar months
      before the handling date; and no standing allowance is granted for every other plan.
    result: >-
      The base charge less the three allowances is rounded to the cent, and where the rounded
      figure falls below nothing the charge stands at nothing.
  factors:
  - id: return_base_charge_band
    effect: parameter
    decides: base_fee
    bindings:
    - returns_count
    - base_fee
    ladder:
    - when: two or more payments have been sent back unpaid inside the stretch the return history is read over and the plan stands past due at the handling date
      value: the term's returned payment fee raised by this desk's repeat-return share
    - when: no payment has been sent back unpaid inside that stretch and the plan has been billing for at least the term's minimum courtesy tenure in whole calendar months
      value: the term's returned payment fee reduced by this desk's clean-history share
    - when: otherwise
      value: "P('returned_payment_fee')"
    baseline:
      base_fee: "P('returned_payment_fee')"
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: return_history_reading
    effect: method
    decides: returns_window_months
    bindings:
    - months_billing
    - returns_window_months
    ladder:
    - when: the plan stands past due at the handling date
      method: the returns are counted over the twelve whole calendar months ending on the handling date
    - when: the plan has been billing for fewer whole calendar months than the term's repeat window
      method: the returns are counted over every whole calendar month since the plan began billing
    - when: otherwise
      method: the returns are counted over the term's repeat window of whole calendar months ending on the handling date
    baseline:
      returns_window_months: "P('late_fee_repeat_window_months')"
    evidence:
    - date
    - tier_param
    cross_difficulty: null
  - id: presentation_channel_allowance
    effect: parameter
    decides: channel_relief
    bindings:
    - returned_channel
    - returns_this_cycle
    - channel_relief
    ladder:
    - when: the returned payment came in on a channel the term credits on the day it is received and it is the only payment sent back on the plan in the whole month ending on the handling date
      value: "K('same_day_channel_relief')"
    - when: the returned payment came in by posted cheque and it is the only payment sent back on the plan in the whole month ending on the handling date
      value: "K('posted_cheque_relief')"
    - when: otherwise
      value: no channel allowance is granted
    baseline:
      channel_relief: "0.0"
    evidence:
    - history
    cross_difficulty: null
  - id: care_coverage_allowance
    effect: parameter
    decides: coverage_relief_amount
    bindings:
    - coverage_status
    - coverage_schedule
    - coverage_premiums_recent
    - coverage_relief_amount
    ladder:
    - when: the customer holds care coverage standing in force whose premium that coverage collects month by month and a premium has been taken under it in the three whole calendar months ending on the handling date
      value: "K('coverage_relief')"
    - when: the customer holds care coverage standing in force whose premium that coverage collects in one payment
      value: "K('single_premium_coverage_relief')"
    - when: otherwise
      value: no coverage allowance is granted
    baseline:
      coverage_relief_amount: "0.0"
    evidence:
    - cross_category
    - history
    cross_difficulty: protection
  - id: plan_standing_allowance
    effect: parameter
    decides: tenure_relief_amount
    bindings:
    - down_payment_share
    - tenure_relief_amount
    ladder:
    - when: the plan began billing at least twice the term's minimum courtesy tenure in whole calendar months before the handling date and the customer put down at least the share of the ticket the term requires at the till
      value: "K('long_tenure_relief')"
    - when: the plan began billing at least the term's minimum courtesy tenure but fewer than twice that many whole calendar months before the handling date
      value: "K('standing_tenure_relief')"
    - when: otherwise
      value: no standing allowance is granted
    baseline:
      tenure_relief_amount: "0.0"
    evidence:
    - date
    - tier_param
    cross_difficulty: null
  baseline:
    rule: >-
      A payment the bank has sent back unpaid carries a returned-payment charge, worked out as
      the base charge for the return less every allowance the desk grants against it, and
      charged against the returned payment entry itself. The returned payment the charge answers
      is the most recently presented payment the bank has sent back unpaid on the plan. The base
      charge is the term's returned payment fee. The allowances the desk grants are the channel
      allowance, the coverage allowance and the standing allowance, and each of them is worked
      out on its own and taken off the base charge once, so that they are never applied one to
      the result of another. No channel allowance is granted. No coverage allowance is granted.
      No standing allowance is granted. The base charge less the three allowances is rounded to
      the cent, and where the rounded figure falls below nothing the charge stands at nothing.
    params:
    - returned_payment_fee
    - returned_payment_fee_cap_per_cycle
  inputs:
    history:
    - {table: financing_ledger, aggregate: count, field: ledger_entry_id, within_months: 12, filters: {event_type: financing_payment_posted, payment_outcome: returned_nsf}}
    - {table: financing_ledger, aggregate: latest, field: payment_channel, within_months: 12, filters: {event_type: financing_payment_posted, payment_outcome: returned_nsf}}
    - {category: protection, table: protection_ledger, aggregate: count, field: protection_entry_id, within_months: 3, filters: {event_type: protection_premium_paid}}
    cross_category:
    - protection
- id: financing_ext_lateness_charge
  base_policy_refs:
  - financing_evt_late_fee
  overwrite:
  - base_policy: financing_evt_late_fee
    superseded_clause: >-
      The first lateness inside the term's repeat window carries the first-lateness fee and a
      later one inside the same window carries the repeat fee, the window being the rolling
      number of whole months the term sets and counted backwards from the missed due date.
    replaced_by: >-
      A scheduled payment that no settled payment answers by its due date carries a lateness
      charge, worked out as the base charge for the lateness raised by the delinquency uplift
      and then reduced by the relationship allowance the desk grants against it.
  trigger: state_due
  subject:
  - financing_late_fee_assessed
  computes: lateness_charge
  target_tool: book_lateness_charge_0092ea40
  params:
    early_tenure_months: 6
    early_tenure_charge_pct: 50.0
    repeat_window_multiple: 2
    delinquency_uplift_pct: 30.0
    early_delinquency_uplift_pct: 10.0
    service_recovery_relief: 20.0
    open_order_relief: 10.0
  rule: >-
    A scheduled payment that no settled payment answers by its due date carries a lateness
    charge, worked out as the base charge for the lateness raised by the delinquency uplift and
    then reduced by the relationship allowance the desk grants against it. The base charge is
    the term's first-lateness fee. The delinquency uplift is nothing. The relationship allowance
    is nothing. The base charge and the delinquency uplift are added first, the relationship
    allowance is taken off that sum, the figure is rounded to the cent at the end only, and
    where the rounded figure falls below nothing the charge stands at nothing. The stretch of
    whole calendar months the lateness history is read over runs twice the term's repeat window
    back from the handling date where the plan stands past due at the handling date and a
    payment has been sent back unpaid on it in the whole month ending on the handling date; it
    runs back to the date the plan began billing where the plan has been billing for fewer whole
    calendar months than the term's repeat window; and it runs the term's repeat window of whole
    calendar months back from the handling date for every other plan. The lateness charges that
    count against the plan are every lateness charge booked inside that stretch, whether or not
    a give-back stands against it, where the plan stands past due at the handling date; no
    earlier lateness charge counts at all where the plan stands active at the handling date and
    automatic payment is in force on it; and they are only the lateness charges booked inside
    that stretch that no give-back answers for every other plan. The base charge is the term's
    repeat fee where at least one lateness charge counts against the plan inside that stretch;
    it is the term's first-lateness fee reduced by this desk's opening-band share where no
    lateness charge counts against the plan inside that stretch and the plan has been billing
    for fewer whole calendar months than this desk's opening band; and it is the term's
    first-lateness fee for every other plan. The days the lateness is assessed over run from the
    day the term's automatic payment grace ends after the missed due date to the handling date
    where automatic payment is in force on the plan and a payment has been sent back unpaid on
    it in the whole month ending on the handling date; they run from the missed due date itself
    to the handling date, the due date counting as day zero, where the plan stands past due at
    the handling date and no payment has settled on it in that month; and they run from the day
    the term's grace period ends after the missed due date to the handling date for every other
    plan. The delinquency uplift is this desk's delinquency share of the base charge where the
    days the lateness is assessed over have reached the term's delinquency threshold and the
    missed due date falls in an earlier whole month than the handling date; it is this desk's
    opening delinquency share of the base charge where those days have passed the term's grace
    period but have not reached the term's delinquency threshold; and no delinquency uplift is
    added for every other plan. The relationship allowance is this desk's service-recovery
    allowance where the customer has a piece with the workshop that the chain has not yet handed
    back and that piece has been back to the bench at least once; it is this desk's open-order
    allowance where the customer has a piece with the workshop that the chain has not yet handed
    back and that piece has not been back to the bench; and no relationship allowance is granted
    for every other customer.
  prerequisite: []
  cross_category:
  - category: service
    as: branch
    reads:
    - status
    - rework_count
    note: >-
      The relationship allowance factor decides its tier from the standing of the customer's
      bench work order and the number of times that piece has been back to the bench.
  compute:
  - months_billing: "MONTHS(F('activated_date'), NOW)"
  - returns_this_cycle: "COUNT('financing_ledger', within_months=1, date_field='posted_date', event_type='financing_payment_posted', payment_outcome='returned_nsf')"
  - repeat_window_months: "P('late_fee_repeat_window_months') * K('repeat_window_multiple') if (F('status') == 'past_due' and returns_this_cycle > 0) else (MX(1, months_billing) if months_billing < P('late_fee_repeat_window_months') else P('late_fee_repeat_window_months'))"
  - prior_late_fees: "COUNT('financing_ledger', within_months=repeat_window_months, date_field='posted_date', event_type='financing_late_fee_assessed')"
  - prior_givebacks: "COUNT('financing_ledger', within_months=repeat_window_months, date_field='posted_date', event_type='financing_fee_waiver_applied')"
  - standing_late_fees: "prior_late_fees if F('status') == 'past_due' else (0 if F('autopay_enrolled') == True else MX(0, prior_late_fees - prior_givebacks))"
  - base_charge: "P('late_fee_repeat') if standing_late_fees > 0 else (RND(P('late_fee_first') * K('early_tenure_charge_pct') / 100, 2) if MONTHS(F('activated_date'), NOW) < K('early_tenure_months') else P('late_fee_first'))"
  - missed_due_date: "LATEST('financing_ledger', 'payment_due_date', date_field='posted_date', event_type='financing_payment_posted', payment_outcome='returned_nsf')"
  - settled_this_cycle: "COUNT('financing_ledger', within_months=1, date_field='posted_date', event_type='financing_payment_posted', payment_outcome='settled')"
  - assessed_days_past_due: "MX(0, DAYS(missed_due_date, NOW) - P('autopay_failure_grace_days')) if (F('autopay_enrolled') == True and returns_this_cycle > 0) else (DAYS(missed_due_date, NOW) if (F('status') == 'past_due' and settled_this_cycle == 0) else MX(0, DAYS(missed_due_date, NOW) - P('grace_period_days')))"
  - months_since_due: "MONTHS(missed_due_date, NOW)"
  - delinquency_uplift: "RND(base_charge * K('delinquency_uplift_pct') / 100, 2) if (assessed_days_past_due >= P('days_past_due_to_delinquent') and months_since_due >= 1) else (RND(base_charge * K('early_delinquency_uplift_pct') / 100, 2) if (assessed_days_past_due > P('grace_period_days') and assessed_days_past_due < P('days_past_due_to_delinquent')) else 0.0)"
  - service_status: "CFIELD('service', 'status')"
  - service_rework: "CFIELD('service', 'rework_count')"
  - service_at_bench: "service_status == 'in_workshop' or service_status == 'awaiting_authorization'"
  - relationship_relief: "K('service_recovery_relief') if (service_at_bench == True and service_rework >= 1) else (K('open_order_relief') if (service_at_bench == True and service_rework == 0) else 0.0)"
  - result: "MX(0.0, RND(base_charge + delinquency_uplift - relationship_relief, 2))"
  compute_basis:
