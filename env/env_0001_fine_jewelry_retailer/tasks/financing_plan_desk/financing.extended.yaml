        promo_satisfaction_buffer_days: =promo_satisfaction_buffer_days
        promo_expiry_notice_days: =promo_expiry_notice_days
      18-Month Deferred Interest Plan:
        promo_structure: =promo_structure
        promotional_apr_pct: =promotional_apr_pct
