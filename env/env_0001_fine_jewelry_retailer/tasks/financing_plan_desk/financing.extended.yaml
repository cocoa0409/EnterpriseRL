    bindings:
    - commission_stage
    - commission_balance
    - commitment_relief
    ladder:
    - when: the customer has a commission with the design studio standing in production with a balance still to pay
      value: "K('larger_commitment_relief')"
    - when: the customer has a commission with the design studio standing at the approval of its design with a balance still to pay
      value: "K('commitment_relief')"
    - when: otherwise
      value: no relief is allowed for other commitments
    baseline:
      commitment_relief: "0.0"
    evidence:
    - cross_category
    cross_difficulty: custom
  baseline:
    rule: >-
      The reduced payment a plan bills while an arrangement runs is the hardship share applied to
      the payment the arrangement is built on, increased by the interest the arrangement carries and
      by the arrangement charge the desk makes, and reduced by the relief the desk allows for the
      customer's other commitments with the chain. The payment the arrangement is built on is the
      scheduled monthly payment the plan record carries. The months the arrangement runs for are the
      term's hardship length. The hardship share is the term's hardship share. The arrangement
      carries no interest. The arrangement charge the desk makes is this desk's standard arrangement
      charge. No relief is allowed for other commitments. The hardship share is applied to the
      payment the arrangement is built on and that figure is rounded to the cent; the interest and
      the arrangement charge are then added to it and the relief is taken off; the result is rounded
      to the cent at the end only, and where the rounded figure falls below nothing the payment
      stands at nothing.
    params:
    - hardship_reduced_payment_pct
    - hardship_term_months
    - standard_arrangement_charge
  inputs:
    history:
    - {table: financing_ledger, aggregate: sum, field: amount, within_months: 1, filters: {event_type: financing_payment_posted, payment_outcome: returned_nsf}}
    - {table: financing_ledger, aggregate: sum, field: amount, within_months: 1, filters: {event_type: financing_fee_waiver_applied}}
    - {table: financing_ledger, aggregate: count, field: ledger_entry_id, within_months: 12, filters: {event_type: financing_payment_posted, payment_outcome: returned_nsf}}
    cross_category:
    - custom
