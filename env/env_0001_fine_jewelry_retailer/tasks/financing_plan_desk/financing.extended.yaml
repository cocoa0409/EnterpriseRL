    result: >-
      The balance, the interest over the final part of the cycle and the priced charges standing
      unanswered are added, that sum is rounded to the cent, and where the rounded sum falls
      below nothing the figure stands at nothing.
  factors:
  - id: settlement_rate_band
    effect: parameter
    decides: settlement_apr
    bindings:
    - settled_payments_in_review
    - missed_cycles
    - settlement_apr
    ladder:
    - when: the missed cycles of the stretch reach the term's repricing trigger number of missed payments
      value: "P('penalty_apr_pct')"
    - when: automatic payment is in force on the plan and no cycle of the stretch was missed
      value: "RND(P('promotional_apr_pct') - P('autopay_apr_discount_pct'), 2)"
    - when: otherwise
      value: "P('promotional_apr_pct')"
    baseline:
      settlement_apr: "P('promotional_apr_pct')"
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: final_period_anchor
    effect: method
    decides: interest_days
    bindings:
    - last_statement_date
    - latest_due_date
    - settled_recently
    - interest_days
    ladder:
    - when: a payment has settled on the plan in the whole month ending on the handling date
      method: the days run from the date of the most recent settled payment to the handling date
    - when: no payment has settled in the whole month ending on the handling date and the plan stands past due
      method: the days run from the payment due date printed on the most recent statement to the handling date
    - when: otherwise
      method: the days run from the closing date of the most recent statement to the handling date
    baseline:
      interest_days: "DAYS(last_statement_date, NOW)"
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: repricing_review_window
    effect: method
    decides: review_window_months
    bindings:
    - review_window_months
    ladder:
    - when: the plan has been billing for fewer whole calendar months than the term's repricing review length
      method: the stretch runs back to the date the plan began billing, so every cycle since billing began is read
    - when: the plan has been billing for at least the term's repricing review length and stands past due at the handling date
      method: the stretch runs twice the term's repricing review length of whole calendar months back from the handling date
    - when: otherwise
      method: the stretch runs the term's repricing review length of whole calendar months back from the handling date
    baseline:
      review_window_months: "P('penalty_apr_review_months')"
    evidence:
    - date
    - tier_param
    cross_difficulty: null
  - id: standing_charge_reading
    effect: method
    decides: charge_window_months
    bindings:
    - charge_window_months
    ladder:
    - when: the plan stands past due at the handling date
      method: every lateness charge, returned-payment charge and give-back booked since the plan began billing is read
    - when: the plan stands active at the handling date and automatic payment is in force on it
      method: only the charges and give-backs booked in the single whole month ending on the handling date are read
    - when: otherwise
      method: the charges and give-backs booked in the term's repeat window of whole calendar months are read
    baseline:
      charge_window_months: "P('late_fee_repeat_window_months')"
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: upgrade_credit_offset
    effect: parameter
    decides: credit_offset
    bindings:
    - credit_status
    - credit_available
    - credit_part_spendable
    - credit_offset
    ladder:
    - when: the customer's upgrade registration stands at credit issued or part spent and its programme allows a credit to be spent in part
      value: the whole of the credit still available on that registration
    - when: the customer's upgrade registration stands at credit issued or part spent and its programme does not allow a credit to be spent in part
      value: the credit issued on that registration
    - when: otherwise
      value: nothing is set against the figure
    baseline:
      credit_offset: "0.0"
    evidence:
    - cross_category
    cross_difficulty: tradein
  baseline:
    rule: >-
      The settlement figure is built from the balance the plan record carries at the handling
      date, the interest the balance earns over the final part of the cycle, and the priced
      charges standing unanswered on the plan. The interest over the final part of the cycle is
      the balance multiplied by the settlement rate, divided by one hundred, multiplied by the
