    - {table: financing_ledger, aggregate: sum, field: amount, within_months: 12, filters: {event_type: financing_late_fee_assessed}}
    - {table: financing_ledger, aggregate: sum, field: amount, within_months: 12, filters: {event_type: financing_fee_waiver_applied}}
    - {table: financing_ledger, aggregate: count, field: ledger_entry_id, within_months: 12, filters: {event_type: financing_payment_posted, payment_outcome: returned_nsf}}
    cross_category:
    - service
- id: financing_ext_schedule_rebuild
  base_policy_refs:
  - financing_hardship_arrangement
  - financing_return_credit
  overwrite:
  - base_policy: financing_return_credit
    superseded_clause: >-
      On the terms that rebuild the schedule, the remaining payments are recalculated over the
      payments still to run; on the terms that do not, the credit shortens the plan and the
      scheduled payment is left as it was.
    replaced_by: >-
      The rebuilt payment a plan bills each cycle is the principal share of what it owes, together
      with the interest one cycle carries, the catch-up the plan owes for a cycle not paid and the
      amount the plan carries for coverage taken out on the financed piece.
  trigger: state_due
  subject:
  - financing_plan_terms_updated
  computes: rebuilt_monthly_payment
  target_tool: update_scheduled_payment_2c04479a
  params:
    arrears_payment_factor_pct: 4.5
    steady_payment_factor_pct: 2.4
    coverage_servicing_amount: 3.5
  rule: >-
    The rebuilt payment a plan bills each cycle is the principal share of what it owes, together
    with the interest one cycle carries, the catch-up the plan owes for a cycle not paid and the
    amount the plan carries for coverage taken out on the financed piece. The balance the rebuilt
    payment is worked out on is the balance the plan record carries at the handling date, adjusted
    by the give-backs booked to the plan inside the stretch of whole calendar months the adjustment
    reading runs over, and it never falls below nothing. The stretch the adjustment reading runs
    over is the term's repeat window of whole calendar months ending on the handling date. The
    principal share is the term's payment factor applied to that balance and rounded to the cent.
    The rate the cycle's interest is priced at is the term's promotional rate. The interest one
    cycle carries is that balance at that rate for the term's nominal billing cycle length on a year
    of three hundred and sixty-five days, rounded to the cent. No catch-up is owed. Nothing is
    carried for coverage. The principal share, the interest, the catch-up and the coverage amount
    are added, that sum is rounded to the cent, and where the rounded figure falls below nothing the
    payment stands at nothing. The stretch the adjustment reading runs over is the single whole
    month ending on the handling date where a give-back has been booked to the plan in that month;
    it runs back to the date the plan began billing where no give-back has been booked in that month
    and the plan stands past due at the handling date; and it is the term's repeat window of whole
    calendar months for every other plan. The rate the cycle's interest is priced at is the term's
    penalty rate where the plan carries at least the term's repricing trigger number of payments
    sent back unpaid inside the term's repricing review window; it is the term's promotional rate
    reduced by the term's automatic payment discount where automatic payment is in force on the plan
    and fewer than that many payments have been sent back unpaid inside that window; and it is the
    term's promotional rate for every other plan. The payment factor is this desk's arrears factor
    where the plan stands past due at the handling date; it is this desk's steady-payer factor where
    automatic payment is in force on the plan and the plan has been billing for at least the term's
    repricing review length in whole calendar months; and it is the term's payment factor for every
    other plan. The interest one cycle carries runs on the actual number of days from the closing
    date of the most recent statement to the handling date, on a year of three hundred and sixty-five
    days, where the plan stands past due at the handling date; it runs on the actual number of days
    from the closing date of the most recent statement to the handling date, on a year of three
    hundred and sixty days, where the plan stands active and automatic payment is in force on it;
    and it runs on the term's nominal billing cycle length on a year of three hundred and sixty-five
    days for every other plan. The catch-up the plan owes is the money sent back unpaid in the whole
    month ending on the handling date spread evenly over the months the term's arrangement runs for
    where the plan stands past due at the handling date; it is the scheduled monthly payment the
    plan record carries spread evenly over those months where the plan stands active at the handling
    date and a payment on it has been sent back unpaid in that month; and no catch-up is owed for
    every other plan. The amount the plan carries for coverage is the premium the care coverage on
    the financed piece charges for one month where that coverage stands in force and its premium is
    collected month by month; it is this desk's coverage servicing amount where that coverage stands
    in force and the benefit allowance it still carries stands above its deductible; and nothing is
    carried for coverage for every other plan. The rebuilt payment is fixed only after every billing
    cycle the plan has closed carries in the billing history the statement that cycle presented.
    Before the rebuilt payment is worked out, every lateness charge the plan carries that a failure
    of the chain's own handling brought about must already stand answered by a give-back in the
    billing history.
  prerequisite:
  - problem: financing_ext_cycle_statement
    kind: value_input
    gate: interest_component
    form: state
    policy_source: >-
      The rebuilt payment is fixed only after every billing cycle the plan has closed carries in the
      billing history the statement that cycle presented.
    condition: >-
      Every billing cycle that has closed on the plan's statement day up to the handling date
      carries a statement entry in the plan's billing history whose closing date is that statement
      day.
    resolved_by: issue_cycle_statement_c71da302
    effect: >-
      The most recent statement closing date the interest reading anchors on moves forward to the
      cycle just closed, so the interest one cycle carries falls.
  - problem: financing_ext_service_recovery_giveback
    kind: value_input
    gate: balance_now
    form: state
    policy_source: >-
      Before the rebuilt payment is worked out, every lateness charge the plan carries that a
      failure of the chain's own handling brought about must already stand answered by a give-back
      in the billing history.
    condition: >-
      Every lateness charge entry on the plan that arose from a failure of the chain's own handling
      carries a give-back entry in the billing history whose source entry is that charge.
    resolved_by: apply_service_recovery_giveback_b70a9c9e
    effect: >-
      The adjustment reading picks up the give-back entry, so the balance the rebuilt payment is
      worked out on falls by the money given back.
  cross_category:
  - category: protection
    as: branch
    reads:
    - status
    - remaining_benefit_allowance
    - deductible_amount
    - premium_amount
    - premium_payment_schedule
    note: >-
      The coverage amount factor decides its tier from the standing of the care coverage on the
      financed piece, its premium arrangement, the allowance it still carries and its deductible.
  compute:
  - months_billing: "MONTHS(F('activated_date'), NOW)"
  - givebacks_this_month: "COUNT('financing_ledger', within_months=1, date_field='posted_date', event_type='financing_fee_waiver_applied')"
  - adjust_window_months: "1 if givebacks_this_month > 0 else (MX(1, months_billing) if F('status') == 'past_due' else P('late_fee_repeat_window_months'))"
  - givebacks_recent: "SUM('financing_ledger', 'amount', within_months=adjust_window_months, date_field='posted_date', event_type='financing_fee_waiver_applied')"
  - balance_now: "MX(0.0, F('current_balance') + givebacks_recent)"
  - returns_in_window: "COUNT('financing_ledger', within_months=P('penalty_apr_review_months'), date_field='posted_date', event_type='financing_payment_posted', payment_outcome='returned_nsf')"
  - applicable_rate: "P('penalty_apr_pct') if returns_in_window >= P('penalty_apr_trigger_missed_payments') else (RND(P('promotional_apr_pct') - P('autopay_apr_discount_pct'), 2) if (F('autopay_enrolled') == True and returns_in_window < P('penalty_apr_trigger_missed_payments')) else P('promotional_apr_pct'))"
  - payment_factor_pct: "K('arrears_payment_factor_pct') if F('status') == 'past_due' else (K('steady_payment_factor_pct') if (F('autopay_enrolled') == True and months_billing >= P('penalty_apr_review_months')) else P('minimum_payment_factor_pct'))"
  - principal_component: "RND(balance_now * payment_factor_pct / 100, 2)"
  - last_statement_date: "LATEST('financing_ledger', 'posted_date', date_field='posted_date', event_type='financing_statement_issued')"
  - interest_component: "RND(balance_now * applicable_rate / 100 * DAYS(last_statement_date, NOW) / 365, 2) if F('status') == 'past_due' else (RND(balance_now * applicable_rate / 100 * DAYS(last_statement_date, NOW) / 360, 2) if F('autopay_enrolled') == True else RND(balance_now * applicable_rate / 100 * P('billing_cycle_days') / 365, 2))"
  - returns_this_month: "COUNT('financing_ledger', within_months=1, date_field='posted_date', event_type='financing_payment_posted', payment_outcome='returned_nsf')"
  - returned_amount_month: "ABS(SUM('financing_ledger', 'amount', within_months=1, date_field='posted_date', event_type='financing_payment_posted', payment_outcome='returned_nsf'))"
  - catchup_component: "RND(returned_amount_month / P('hardship_term_months'), 2) if F('status') == 'past_due' else (RND(F('scheduled_monthly_payment') / P('hardship_term_months'), 2) if (returns_this_month > 0 and F('status') == 'active') else 0.0)"
  - coverage_standing: "CFIELD('protection', 'status')"
  - coverage_arrangement: "CPARAM('protection', 'premium_payment_schedule')"
  - coverage_allowance: "CFIELD('protection', 'remaining_benefit_allowance')"
  - coverage_deductible: "CFIELD('protection', 'deductible_amount')"
  - coverage_monthly_premium: "CFIELD('protection', 'premium_amount')"
  - coverage_component: "coverage_monthly_premium if (coverage_standing == 'active' and coverage_arrangement == 'monthly') else (K('coverage_servicing_amount') if (coverage_standing == 'active' and coverage_allowance > coverage_deductible) else 0.0)"
  - result: "MX(0.0, RND(principal_component + interest_component + catchup_component + coverage_component, 2))"
  compute_basis:
