      the lateness is assessed over have reached the term's delinquency threshold and the missed
      due date falls in an earlier whole month than the handling date; it is this desk's opening
      delinquency share of the base charge where those days have passed the term's grace period
      but have not reached the term's delinquency threshold; and no delinquency uplift is added
      for every other plan.
    delinquency_uplift: >-
      The delinquency uplift is this desk's delinquency share of the base charge where the days
      the lateness is assessed over have reached the term's delinquency threshold and the missed
      due date falls in an earlier whole month than the handling date; it is this desk's opening
      delinquency share of the base charge where those days have passed the term's grace period
      but have not reached the term's delinquency threshold; and no delinquency uplift is added
      for every other plan.
    service_status: >-
      The relationship allowance is this desk's service-recovery allowance where the customer has
      a piece with the workshop that the chain has not yet handed back and that piece has been
      back to the bench at least once; it is this desk's open-order allowance where the customer
      has a piece with the workshop that the chain has not yet handed back and that piece has not
      been back to the bench; and no relationship allowance is granted for every other customer.
    service_rework: >-
      The relationship allowance is this desk's service-recovery allowance where the customer has
      a piece with the workshop that the chain has not yet handed back and that piece has been
      back to the bench at least once; it is this desk's open-order allowance where the customer
      has a piece with the workshop that the chain has not yet handed back and that piece has not
      been back to the bench; and no relationship allowance is granted for every other customer.
    service_at_bench: >-
      The relationship allowance is this desk's service-recovery allowance where the customer has
      a piece with the workshop that the chain has not yet handed back and that piece has been
      back to the bench at least once; it is this desk's open-order allowance where the customer
      has a piece with the workshop that the chain has not yet handed back and that piece has not
      been back to the bench; and no relationship allowance is granted for every other customer.
    relationship_relief: >-
      The relationship allowance is this desk's service-recovery allowance where the customer has
      a piece with the workshop that the chain has not yet handed back and that piece has been
      back to the bench at least once; it is this desk's open-order allowance where the customer
      has a piece with the workshop that the chain has not yet handed back and that piece has not
      been back to the bench; and no relationship allowance is granted for every other customer.
    result: >-
      The base charge and the delinquency uplift are added first, the relationship allowance is
      taken off that sum, the figure is rounded to the cent at the end only, and where the
      rounded figure falls below nothing the charge stands at nothing.
  factors:
  - id: lateness_history_window
    effect: method
    decides: repeat_window_months
    bindings:
    - months_billing
    - returns_this_cycle
    - repeat_window_months
    ladder:
    - when: the plan stands past due at the handling date and a payment has been sent back unpaid on it in the whole month ending on the handling date
      method: the stretch runs twice the term's repeat window of whole calendar months back from the handling date
    - when: the plan has been billing for fewer whole calendar months than the term's repeat window
      method: the stretch runs back to the date the plan began billing
    - when: otherwise
      method: the stretch runs the term's repeat window of whole calendar months back from the handling date
    baseline:
      repeat_window_months: "P('late_fee_repeat_window_months')"
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: counted_lateness_history
    effect: method
    decides: standing_late_fees
    bindings:
    - prior_late_fees
    - prior_givebacks
    - standing_late_fees
    ladder:
    - when: the plan stands past due at the handling date
      method: every lateness charge booked inside the stretch counts, whether or not a give-back stands against it
    - when: the plan stands active at the handling date and automatic payment is in force on it
      method: no earlier lateness charge counts at all
    - when: otherwise
      method: only the lateness charges booked inside the stretch that no give-back answers count
    baseline:
      standing_late_fees: "MX(0, prior_late_fees - prior_givebacks)"
    evidence:
    - history
    cross_difficulty: null
  - id: lateness_base_charge_band
    effect: parameter
    decides: base_charge
    bindings:
    - base_charge
    ladder:
    - when: at least one lateness charge counts against the plan inside the stretch
      value: "P('late_fee_repeat')"
    - when: no lateness charge counts against the plan inside the stretch and the plan has been billing for fewer whole calendar months than this desk's opening band
      value: the term's first-lateness fee reduced by this desk's opening-band share
    - when: otherwise
      value: "P('late_fee_first')"
    baseline:
      base_charge: "P('late_fee_first')"
    evidence:
    - date
    - tier_param
    cross_difficulty: null
  - id: lateness_clock_anchor
    effect: method
    decides: assessed_days_past_due
    bindings:
    - missed_due_date
    - settled_this_cycle
    - assessed_days_past_due
    ladder:
    - when: automatic payment is in force on the plan and a payment has been sent back unpaid on it in the whole month ending on the handling date
      method: the days run from the day the term's automatic payment grace ends after the missed due date to the handling date
    - when: the plan stands past due at the handling date and no payment has settled on it in the whole month ending on the handling date
      method: the days run from the missed due date itself to the handling date, the due date counting as day zero
    - when: otherwise
      method: the days run from the day the term's grace period ends after the missed due date to the handling date
    baseline:
      assessed_days_past_due: "MX(0, DAYS(missed_due_date, NOW) - P('grace_period_days'))"
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: delinquency_uplift_band
    effect: parameter
    decides: delinquency_uplift
    bindings:
    - months_since_due
    - delinquency_uplift
    ladder:
    - when: the days the lateness is assessed over have reached the term's delinquency threshold and the missed due date falls in an earlier whole month than the handling date
      value: this desk's delinquency share of the base charge
    - when: the days the lateness is assessed over have passed the term's grace period but have not reached the term's delinquency threshold
      value: this desk's opening delinquency share of the base charge
    - when: otherwise
      value: no delinquency uplift is added
    baseline:
      delinquency_uplift: "0.0"
    evidence:
    - date
    cross_difficulty: null
  - id: workshop_relationship_allowance
    effect: parameter
    decides: relationship_relief
    bindings:
    - service_status
    - service_rework
    - service_at_bench
    - relationship_relief
    ladder:
    - when: the customer has a piece with the workshop that the chain has not yet handed back and that piece has been back to the bench at least once
      value: "K('service_recovery_relief')"
    - when: the customer has a piece with the workshop that the chain has not yet handed back and that piece has not been back to the bench
      value: "K('open_order_relief')"
    - when: otherwise
      value: no relationship allowance is granted
    baseline:
      relationship_relief: "0.0"
    evidence:
    - cross_category
    cross_difficulty: service
  baseline:
    rule: >-
      A scheduled payment that no settled payment answers by its due date carries a lateness
      charge, worked out as the base charge for the lateness raised by the delinquency uplift
      and then reduced by the relationship allowance the desk grants against it. The base charge
      is the term's first-lateness fee. The delinquency uplift is nothing. The relationship
      allowance is nothing. The base charge and the delinquency uplift are added first, the
      relationship allowance is taken off that sum, the figure is rounded to the cent at the end
      only, and where the rounded figure falls below nothing the charge stands at nothing.
    params:
    - late_fee_first
    - grace_period_days
  inputs:
    history:
    - {table: financing_ledger, aggregate: count, field: ledger_entry_id, within_months: 12, filters: {event_type: financing_late_fee_assessed}}
    - {table: financing_ledger, aggregate: count, field: ledger_entry_id, within_months: 12, filters: {event_type: financing_fee_waiver_applied}}
    - {table: financing_ledger, aggregate: latest, field: payment_due_date, within_months: 12, filters: {event_type: financing_payment_posted, payment_outcome: returned_nsf}}
    cross_category:
    - service
- id: financing_ext_cycle_statement
  base_policy_refs:
  - financing_evt_statement_cycle
  overwrite:
  - base_policy: financing_evt_statement_cycle
    superseded_clause: >-
      The scheduled monthly payment billed on the statement is the larger of the term's payment
      floor and the term's payment factor applied to the promotional balance at the start of the
      term, rounded to the cent.
    replaced_by: >-
      The amount a statement presents when a billing cycle closes is the payment due for the cycle,
      together with the priced charges the statement presents and the amount the statement presents
      for coverage taken out on a financed piece.
  trigger: state_due
  subject:
  - financing_statement_issued
  computes: statement_amount
  target_tool: issue_cycle_statement_c71da302
  params:
    autopay_charge_share: 50.0
    full_charge_share: 100.0
    coverage_presentation_amount: 2.0
    statement_lookback_months: 2
  rule: >-
    The amount a statement presents when a billing cycle closes is the payment due for the cycle,
    together with the priced charges the statement presents and the amount the statement presents
    for coverage taken out on a financed piece. The payment due for the cycle is the scheduled
    monthly payment the plan record carries. The stretch of whole calendar months the charge reading
    runs over is the two whole months ending on the handling date. The priced charges the statement
    presents are the lateness charges booked to the plan inside that stretch taken at the
    presentation share, and the presentation share is the whole of them. Nothing is presented for
    coverage. The payment due for the cycle, the priced charges presented and the coverage amount
    are added, that sum is rounded to the cent, and where the rounded figure falls below nothing the
    statement presents nothing. The payment due for the cycle is the scheduled monthly payment the
    plan record carries together with the money sent back unpaid in the whole month ending on the
    handling date where a payment on the plan has been sent back unpaid in that month; it is what is
    left of the scheduled monthly payment after the settled payments credited in that month, never
    less than nothing, where no payment has been sent back unpaid and a settled payment stands in
    that month; and it is the scheduled monthly payment the plan record carries for every other
    cycle. The stretch of whole calendar months the charge reading runs over is the single whole
    month ending on the handling date where a payment on the plan has been sent back unpaid in that
    month; it runs back to the date the plan began billing where the plan has been billing for fewer
    whole calendar months than the term's repeat window; and it is the two whole months ending on
    the handling date for every other cycle. The presentation share is nothing at all where an
    arrangement stands in force on the plan at the handling date, the charges being carried to the
    close of that arrangement instead; it is this desk's held-over share where no arrangement stands
    in force and automatic payment is in force on the plan; and it is the whole of them for every
    other plan. The amount the statement presents for coverage is the premium the care coverage on a
    financed piece charges for one month where that coverage stands in force and its premium is
    collected month by month; it is this desk's coverage presentation amount where that coverage
    stands in force and no claim has been settled under it; and nothing is presented for coverage
    for every other plan.
  prerequisite: []
  cross_category:
  - category: protection
    as: branch
    reads:
    - status
    - claims_settled_count
    - premium_amount
    - premium_payment_schedule
    note: >-
      The coverage presentation factor decides its tier from the standing of the care coverage on a
      financed piece, its premium arrangement and whether any claim has been settled under it.
  compute:
  - settled_in_cycle: "SUM('financing_ledger', 'amount', within_months=1, date_field='posted_date', event_type='financing_payment_posted', payment_outcome='settled')"
  - returned_in_cycle: "ABS(SUM('financing_ledger', 'amount', within_months=1, date_field='posted_date', event_type='financing_payment_posted', payment_outcome='returned_nsf'))"
  - payment_due_component: "F('scheduled_monthly_payment') + returned_in_cycle if returned_in_cycle > 0 else (MX(0.0, F('scheduled_monthly_payment') + settled_in_cycle) if settled_in_cycle < 0 else F('scheduled_monthly_payment'))"
  - months_billing: "MONTHS(F('activated_date'), NOW)"
  - returns_in_month: "COUNT('financing_ledger', within_months=1, date_field='posted_date', event_type='financing_payment_posted', payment_outcome='returned_nsf')"
  - charge_window_months: "1 if returns_in_month > 0 else (MX(1, months_billing) if months_billing < P('late_fee_repeat_window_months') else K('statement_lookback_months'))"
  - late_in_window: "SUM('financing_ledger', 'amount', within_months=charge_window_months, date_field='posted_date', event_type='financing_late_fee_assessed')"
  - presentation_share: "0.0 if F('hardship_plan_code') != 'none' else (K('autopay_charge_share') if F('autopay_enrolled') == True else K('full_charge_share'))"
  - charge_component: "RND(late_in_window * presentation_share / 100, 2)"
  - coverage_standing: "CFIELD('protection', 'status')"
  - coverage_arrangement: "CPARAM('protection', 'premium_payment_schedule')"
  - coverage_claims: "CFIELD('protection', 'claims_settled_count')"
  - coverage_monthly_premium: "CFIELD('protection', 'premium_amount')"
  - coverage_presentation: "coverage_monthly_premium if (coverage_standing == 'active' and coverage_arrangement == 'monthly') else (K('coverage_presentation_amount') if (coverage_standing == 'active' and coverage_claims == 0) else 0.0)"
  - result: "MX(0.0, RND(payment_due_component + charge_component + coverage_presentation, 2))"
  compute_basis:
    settled_in_cycle: >-
      The payment due for the cycle is the scheduled monthly payment the plan record carries
      together with the money sent back unpaid in the whole month ending on the handling date where a
      payment on the plan has been sent back unpaid in that month; it is what is left of the
      scheduled monthly payment after the settled payments credited in that month, never less than
      nothing, where no payment has been sent back unpaid and a settled payment stands in that
      month; and it is the scheduled monthly payment the plan record carries for every other cycle.
    returned_in_cycle: >-
      The payment due for the cycle is the scheduled monthly payment the plan record carries
      together with the money sent back unpaid in the whole month ending on the handling date where a
      payment on the plan has been sent back unpaid in that month; it is what is left of the
      scheduled monthly payment after the settled payments credited in that month, never less than
      nothing, where no payment has been sent back unpaid and a settled payment stands in that
      month; and it is the scheduled monthly payment the plan record carries for every other cycle.
    payment_due_component: >-
      The payment due for the cycle is the scheduled monthly payment the plan record carries
      together with the money sent back unpaid in the whole month ending on the handling date where a
      payment on the plan has been sent back unpaid in that month; it is what is left of the
      scheduled monthly payment after the settled payments credited in that month, never less than
      nothing, where no payment has been sent back unpaid and a settled payment stands in that
      month; and it is the scheduled monthly payment the plan record carries for every other cycle.
    months_billing: >-
      The stretch of whole calendar months the charge reading runs over is the single whole month
      ending on the handling date where a payment on the plan has been sent back unpaid in that
      month; it runs back to the date the plan began billing where the plan has been billing for
      fewer whole calendar months than the term's repeat window; and it is the two whole months
      ending on the handling date for every other cycle.
    returns_in_month: >-
      The stretch of whole calendar months the charge reading runs over is the single whole month
      ending on the handling date where a payment on the plan has been sent back unpaid in that
      month; it runs back to the date the plan began billing where the plan has been billing for
      fewer whole calendar months than the term's repeat window; and it is the two whole months
      ending on the handling date for every other cycle.
    charge_window_months: >-
      The stretch of whole calendar months the charge reading runs over is the single whole month
      ending on the handling date where a payment on the plan has been sent back unpaid in that
      month; it runs back to the date the plan began billing where the plan has been billing for
      fewer whole calendar months than the term's repeat window; and it is the two whole months
      ending on the handling date for every other cycle.
    late_in_window: >-
      The priced charges the statement presents are the lateness charges booked to the plan inside
      that stretch taken at the presentation share, and the presentation share is the whole of them.
    presentation_share: >-
      The presentation share is nothing at all where an arrangement stands in force on the plan at
      the handling date, the charges being carried to the close of that arrangement instead; it is
      this desk's held-over share where no arrangement stands in force and automatic payment is in
      force on the plan; and it is the whole of them for every other plan.
    charge_component: >-
      The priced charges the statement presents are the lateness charges booked to the plan inside
      that stretch taken at the presentation share, and the presentation share is the whole of them.
    coverage_standing: >-
      The amount the statement presents for coverage is the premium the care coverage on a financed
      piece charges for one month where that coverage stands in force and its premium is collected
      month by month; it is this desk's coverage presentation amount where that coverage stands in
      force and no claim has been settled under it; and nothing is presented for coverage for every
      other plan.
    coverage_arrangement: >-
      The amount the statement presents for coverage is the premium the care coverage on a financed
      piece charges for one month where that coverage stands in force and its premium is collected
      month by month; it is this desk's coverage presentation amount where that coverage stands in
      force and no claim has been settled under it; and nothing is presented for coverage for every
      other plan.
    coverage_claims: >-
      The amount the statement presents for coverage is the premium the care coverage on a financed
      piece charges for one month where that coverage stands in force and its premium is collected
      month by month; it is this desk's coverage presentation amount where that coverage stands in
      force and no claim has been settled under it; and nothing is presented for coverage for every
      other plan.
    coverage_monthly_premium: >-
      The amount the statement presents for coverage is the premium the care coverage on a financed
      piece charges for one month where that coverage stands in force and its premium is collected
      month by month; it is this desk's coverage presentation amount where that coverage stands in
      force and no claim has been settled under it; and nothing is presented for coverage for every
      other plan.
    coverage_presentation: >-
      The amount the statement presents for coverage is the premium the care coverage on a financed
      piece charges for one month where that coverage stands in force and its premium is collected
      month by month; it is this desk's coverage presentation amount where that coverage stands in
      force and no claim has been settled under it; and nothing is presented for coverage for every
      other plan.
    result: >-
      The payment due for the cycle, the priced charges presented and the coverage amount are added,
      that sum is rounded to the cent, and where the rounded figure falls below nothing the
      statement presents nothing.
  factors:
  - id: cycle_payment_due_reading
    effect: method
    decides: payment_due_component
    bindings:
    - settled_in_cycle
    - returned_in_cycle
    - payment_due_component
    ladder:
    - when: a payment on the plan has been sent back unpaid in the whole month ending on the handling date
      method: the payment due is the scheduled monthly payment the plan record carries together with the money sent back unpaid in that month
    - when: no payment has been sent back unpaid and a settled payment stands in that month
      method: the payment due is what is left of the scheduled monthly payment after the settled payments credited in that month, never less than nothing
    - when: otherwise
      method: the payment due is the scheduled monthly payment the plan record carries
    baseline:
      payment_due_component: "F('scheduled_monthly_payment')"
    evidence:
    - history
    cross_difficulty: null
  - id: presented_charge_window
    effect: method
    decides: charge_window_months
    bindings:
    - months_billing
    - returns_in_month
    - charge_window_months
    ladder:
    - when: a payment on the plan has been sent back unpaid in the whole month ending on the handling date
      method: the charges read are those booked in that single whole month
    - when: the plan has been billing for fewer whole calendar months than the term's repeat window
      method: the charges read are those booked since the plan began billing
    - when: otherwise
      method: the charges read are those booked in the two whole months ending on the handling date
    baseline:
      charge_window_months: "K('statement_lookback_months')"
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: charge_presentation_share
    effect: parameter
    decides: presentation_share
    bindings:
    - late_in_window
    - presentation_share
    ladder:
    - when: an arrangement stands in force on the plan at the handling date
      value: nothing at all, the charges being carried to the close of that arrangement instead
    - when: no arrangement stands in force and automatic payment is in force on the plan
      value: "K('autopay_charge_share')"
    - when: otherwise
      value: "K('full_charge_share')"
    baseline:
      presentation_share: "K('full_charge_share')"
    evidence:
    - history
    cross_difficulty: null
  - id: coverage_presentation_band
    effect: parameter
    decides: coverage_presentation
    bindings:
    - coverage_standing
    - coverage_arrangement
    - coverage_claims
    - coverage_monthly_premium
    - coverage_presentation
    ladder:
    - when: the care coverage on a financed piece stands in force and its premium is collected month by month
      value: the premium that coverage charges for one month
    - when: the care coverage on a financed piece stands in force and no claim has been settled under it
      value: "K('coverage_presentation_amount')"
    - when: otherwise
      value: nothing is presented for coverage
    baseline:
      coverage_presentation: "0.0"
    evidence:
    - cross_category
    cross_difficulty: protection
  baseline:
    rule: >-
      The amount a statement presents when a billing cycle closes is the payment due for the cycle,
