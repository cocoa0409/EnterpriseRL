  compute:
  - term_months: P('coverage_term_months')
  - claim_ref: >-
      LATEST('protection_ledger','claim_reference', date_field='posted_date', event_type='protection_claim_filed')
  - order_handed_back: CFIELD('service','delivered_date', protection_claim_reference=claim_ref)
  - order_promised: CFIELD('service','promised_date', protection_claim_reference=claim_ref)
  - months_elapsed: >-
      MONTHS(F('purchased_date'), order_promised) if (order_handed_back == '' and order_promised > NOW) else
      (MONTHS(F('purchased_date'), NOW) + 1 if (order_handed_back == '' and order_promised <= NOW) else MONTHS(F('purchased_date'),
      NOW))
  - months_since_inspection: >-
      MONTHS(LATEST('protection_ledger','posted_date', date_field='posted_date', event_type='protection_inspection_logged'),
      NOW)
  - inspection_interval: P('inspection_interval_months')
  - months_overdue: MX(0, months_since_inspection - inspection_interval)
  - months_left: >-
      term_months - months_elapsed - months_overdue if (months_since_inspection > inspection_interval and
      months_elapsed > K('coverage_year_months')) else (term_months - months_elapsed if (months_since_inspection
      <= inspection_interval and months_elapsed > K('coverage_year_months')) else term_months - months_elapsed
      - 1)
  - unused_share: months_left / term_months
  - premium_base: >-
      SUM('protection_ledger','amount', event_type='protection_premium_paid') + SUM('protection_ledger','amount',
      event_type='protection_premium_refunded')
  - settlements_in_window: >-
      COUNT('protection_ledger', within_months=K('claims_window_months'), date_field='posted_date', event_type='protection_claim_settled')
  - benefit_drawn_window: >-
      ABS(SUM('protection_ledger','amount', within_months=K('claims_window_months'), date_field='posted_date',
      event_type='protection_claim_settled'))
  - returned_share: >-
      K('heavy_claim_return_share') if (settlements_in_window > 0 and benefit_drawn_window >= K('heavy_draw_share')
      * P('annual_benefit_allowance')) else (K('light_claim_return_share') if (settlements_in_window > 0 and
      benefit_drawn_window < K('heavy_draw_share') * P('annual_benefit_allowance')) else 1.0)
  - days_since_purchase: DAYS(F('purchased_date'), NOW)
  - full_refund_window_days: P('cancellation_refund_full_window_days')
  - member_tier_floor: CPARAM('circle','tier_maintenance_qualifying_spend')
  - admin_fee_charged: >-
      0.0 if (days_since_purchase <= full_refund_window_days and F('claims_settled_count') == 0) else (K('member_admin_share')
      * P('cancellation_admin_fee') if (days_since_purchase > full_refund_window_days and member_tier_floor
      > 0) else P('cancellation_admin_fee'))
  - result: MX(0.0, RND(premium_base * unused_share * returned_share - admin_fee_charged, 2))
  compute_basis:
