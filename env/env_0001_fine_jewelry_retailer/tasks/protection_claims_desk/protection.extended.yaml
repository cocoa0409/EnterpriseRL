    - when: >-
        the customer's membership stands active and the qualifying spend recorded since its tier took effect
        is at or above the spend that tier must be maintained by
      value: the maintained-member uplift
    - when: >-
        the customer's membership stands active and that spend is below the spend the tier must be maintained
        by
