events:
- type: protection_plan_quoted
  target: protection_plans
  mutation: create
  meaning: a protection plan is quoted against a piece the customer owns or is buying, before any money changes hands
  grain: one row per coverage quoted against one piece
  fields:
    customer_id: the customer the quote is for
    variant_name: the coverage quoted, written as the official full plan name
    status: the plan opens at quoted
    covered_item_sku: the piece to be covered
    covered_item_description: how the piece reads on the receipt
    sales_receipt_number: the till transaction the piece was sold on
    item_value_at_purchase: the pre-tax price the piece sold at
    premium_amount: the price quoted for the coverage
    deductible_amount: what the customer would pay per accepted claim
    premium_schedule: how the premium would be collected
  triggers: []
- type: protection_plan_activated
  target: protection_plans
  mutation:
    transition:
      from: quoted
      to: active
  meaning: the quoted plan is bought and coverage comes into force
  grain: one row per plan brought into force
  fields:
    status: the plan moves to active
    purchased_date: the date the plan was bought
    effective_date: the day coverage begins
    expiry_date: the last day coverage runs to
    next_inspection_due_date: the date by which the first inspection must be logged
  triggers:
  - event: protection:protection_allowance_granted
    map:
      protection_plan_id: protection_plan_id
  - event: protection:protection_premium_paid
    map:
      protection_plan_id: protection_plan_id
- type: protection_plan_declined
  target: protection_plans
  mutation:
    transition:
      from: quoted
      to: cancelled
  meaning: the customer declines the quoted coverage and the quote is closed
  grain: one row per quote declined
  fields:
    status: the quote is cancelled
    closed_date: the date the quote was closed
  triggers: []
- type: protection_inspection_lapsed
  target: protection_plans
  mutation:
    transition:
      from: active
      to: inspection_overdue
  meaning: the required inspection was not logged by its due date and coverage falls out of good standing
  grain: one row per inspection due date missed
  fields:
    status: the plan moves to inspection overdue
    next_inspection_due_date: the due date that was missed
  triggers: []
- type: protection_inspection_restored
  target: protection_plans
  mutation:
    transition:
      from: inspection_overdue
      to: active
  meaning: an inspection is logged inside the restoration window and coverage returns to good standing
  grain: one row per coverage restored by an inspection
  fields:
    status: the plan returns to active
    last_inspection_date: the date of the inspection that restored coverage
    next_inspection_due_date: the date the next inspection falls due
    inspection_store_code: the store that logged it
  triggers: []
- type: protection_plan_suspended
  target: protection_plans
  mutation:
    transition:
    - from: active
      to: suspended
    - from: inspection_overdue
      to: suspended
  meaning: coverage is suspended because premium went unpaid or the inspection grace ran out
  grain: one row per suspension of one plan
  fields:
    status: the plan moves to suspended
  triggers: []
- type: protection_plan_reinstated
  target: protection_plans
  mutation:
    transition:
      from: suspended
      to: active
  meaning: what caused the suspension is put right and coverage resumes
  grain: one row per suspension lifted
  fields:
    status: the plan returns to active
    last_inspection_date: the inspection that put the lapse right, where one was needed
    next_inspection_due_date: the date the next inspection falls due
  triggers: []
- type: protection_benefit_exhausted
  target: protection_plans
  mutation:
    transition:
      from: active
      to: exhausted
  meaning: the benefit allowance is fully consumed and no further claim can be settled on the plan
  grain: one row per plan whose allowance is consumed
  fields:
    status: the plan moves to exhausted
    remaining_benefit_allowance: the allowance recorded at exhaustion
  triggers: []
- type: protection_plan_expired
  target: protection_plans
  mutation:
    transition:
    - from: active
      to: expired
    - from: inspection_overdue
      to: expired
    - from: suspended
      to: expired
    - from: exhausted
      to: expired
  meaning: the coverage term runs out and the plan closes
  grain: one row per plan whose term ran out
  fields:
    status: the plan expires
    closed_date: the date coverage ended
  triggers: []
- type: protection_plan_cancelled
  target: protection_plans
  mutation:
    transition:
      from: active
      to: cancelled
  meaning: the customer cancels live coverage and the plan closes
  grain: one row per live plan cancelled
  fields:
    status: the plan is cancelled
    closed_date: the date the cancellation took effect
  triggers:
  - event: protection:protection_premium_refunded
    map:
      protection_plan_id: protection_plan_id
- type: protection_plan_transferred
  target: protection_plans
  mutation:
    transition:
      from: active
      to: transferred
  meaning: the plan is transferred with the piece to a new owner
  grain: one row per plan transferred
  fields:
    status: the plan is transferred
    transferred_to_name: the person the plan was transferred to
    closed_date: the date the transfer took effect
  triggers: []
- type: protection_plan_details_updated
  target: protection_plans
  mutation: update
  meaning: a servicing detail of live coverage is changed without moving its lifecycle state
  grain: one row per servicing change on one plan
  fields:
    deductible_amount: what the customer pays per accepted claim
    premium_schedule: how the premium is collected
    inspection_store_code: the store inspections are logged at
    covered_item_description: how the covered piece reads
    next_inspection_due_date: the date the next inspection falls due
  triggers: []
- type: protection_premium_paid
  target: protection_ledger
  meaning: a premium payment for the coverage is received
  grain: one row per premium payment received against one plan
  distinguish_by:
  - billing_period
  - posted_date
  - amount
  fields:
    protection_plan_id: the plan paid for
    customer_id: the customer who paid
    event_type: the family this entry belongs to
    posted_date: the date the premium was received
    amount: the premium received, positive
    payment_channel: how the money arrived
    billing_period: the period the premium is accounted to
  account: premium_account
  direction: in
  triggers: []
- type: protection_premium_refunded
  target: protection_ledger
  meaning: premium is returned to the customer after a cancellation
  grain: one row per premium refund paid on one plan
  distinguish_by:
  - source_entry_id
  - posted_date
  fields:
    protection_plan_id: the plan refunded
    customer_id: the customer refunded
    event_type: the family this entry belongs to
    posted_date: the date the refund was paid
    amount: the refund, negative
    payment_channel: how the refund was paid
    billing_period: the period the refund is accounted to
    source_entry_id: the premium entry being given back
  account: premium_account
  direction: out
  triggers: []
- type: protection_allowance_granted
  target: protection_ledger
  meaning: the benefit allowance is granted when coverage comes into force
  grain: one row per allowance grant at the start of coverage
  distinguish_by:
  - billing_period
  - posted_date
  fields:
    protection_plan_id: the plan granted the allowance
    customer_id: the customer who holds the plan
    event_type: the family this entry belongs to
    posted_date: the date the allowance was granted
    amount: the allowance granted, positive
    billing_period: the coverage period granted for
  account: benefit_allowance
  direction: in
  triggers: []
- type: protection_allowance_reinstated
  target: protection_ledger
  meaning: the annual allowance is granted afresh on a coverage anniversary
  grain: one row per coverage anniversary on one plan
  distinguish_by:
  - billing_period
  - posted_date
  fields:
    protection_plan_id: the plan reinstated
    customer_id: the customer who holds the plan
    event_type: the family this entry belongs to
    posted_date: the anniversary the allowance was reinstated on
    amount: the allowance reinstated, positive
    billing_period: the coverage year reinstated for
  account: benefit_allowance
  direction: in
  triggers: []
- type: protection_claim_filed
  target: protection_ledger
  meaning: the customer reports a loss or a fault and a claim is opened against the coverage
  grain: one row per loss or fault reported against one plan
  distinguish_by:
  - claim_reference
  - posted_date
  fields:
    protection_plan_id: the plan claimed against
    customer_id: the customer claiming
    event_type: the family this entry belongs to
    posted_date: the date the claim was opened
    amount: the amount claimed, positive
    claim_reference: the reference this claim carries
    claim_type: what the customer claimed for
    covered_item_sku: the covered piece the claim concerns
    service_order_reference: the bench work order the piece was sent in on, where one was raised
  triggers:
  - event: service:service_order_opened
    when:
      claim_type:
      - prong_repair
      - chain_break
      - clasp_replacement
      - refinishing
      - rhodium_replating
      - resizing
    map:
      customer_id: customer_id
      item_sku: covered_item_sku
- type: protection_claim_settled
  target: protection_ledger
  meaning: a claim is accepted and benefit is paid out against the allowance
  grain: one row per settlement made against one claim
  distinguish_by:
  - claim_reference
  - posted_date
  - amount
  fields:
    protection_plan_id: the plan settled against
    customer_id: the customer settled with
    event_type: the family this entry belongs to
    posted_date: the date the settlement was made
    amount: the benefit consumed, negative
    claim_reference: the claim settled
    claim_type: what was claimed for
    claim_outcome: whether the claim was settled in full or in part
    deductible_charged: what the customer paid out of pocket
    covered_item_sku: the covered piece
    service_order_reference: the bench work order the repair was carried out under
    source_entry_id: the filing entry this settlement answers
  account: benefit_allowance
  direction: out
  triggers: []
- type: protection_claim_denied
  target: protection_ledger
  meaning: a claim is refused and the ground for refusing it is recorded
  grain: one row per claim refused
  distinguish_by:
  - claim_reference
  - posted_date
  fields:
    protection_plan_id: the plan claimed against
    customer_id: the customer claiming
    event_type: the family this entry belongs to
    posted_date: the date the refusal was recorded
    amount: the amount refused, positive
    claim_reference: the claim refused
    claim_type: what was claimed for
    claim_outcome: the refusing outcome recorded
    denial_reason_code: the single ground for refusing
    source_entry_id: the filing entry this refusal answers
  triggers: []
- type: protection_inspection_logged
  target: protection_ledger
  meaning: the covered piece is inspected and the finding is recorded
  grain: one row per inspection carried out on one covered piece
  distinguish_by:
  - posted_date
  - inspection_store_code
  fields:
    protection_plan_id: the plan inspected under
    customer_id: the customer who holds the plan
    event_type: the family this entry belongs to
    posted_date: the date of the inspection
    amount: zero, because an inspection moves no money
    inspection_result: what the inspection found
    inspection_store_code: the store that carried it out
    covered_item_sku: the piece inspected
  triggers:
  - event: protection:protection_inspection_restored
    map:
      last_inspection_date: posted_date
      inspection_store_code: inspection_store_code
measures:
- id: protection_msr_claims_12m
  window: the rolling twelve calendar months ending on the handling date, the handling date itself included
  measure: count of protection_claim_settled entries on this plan in the window
- id: protection_msr_benefit_consumed_year
  window: the coverage year the handling date falls in, running from the effective date anniversary
  measure: sum of the absolute amount of protection_claim_settled entries on this plan in that coverage year
- id: protection_msr_days_since_last_settlement
  window: from the most recent protection_claim_settled entry on this plan to the handling date
  measure: count of whole calendar days elapsed since that settlement, with no upper bound
- id: protection_msr_included_services_12m
  window: the rolling twelve calendar months ending on the handling date
  measure: count of protection_claim_settled entries on this plan whose claim_type is rhodium_replating, resizing or refinishing
policies:
- id: protection_agg_multi_holding
  subject:
  - protection_plan_quoted
  rule: One covered piece carries at most the number of plans of this coverage the plan itself allows, and in practice a piece is covered by one plan at a time. A further protection plan is written against a piece only when no plan already recorded against the same covered item reference stands at quoted, active, inspection overdue or suspended. A plan that has expired, been cancelled, been transferred away or had its allowance consumed no longer occupies the piece, so fresh coverage may then be quoted where the coverage is still offered for that piece.
  eligibility:
  - id: no_live_plan_on_item
    applies_to:
    - protection_plan_quoted
    kind: dedup
    condition: A further protection plan is written against a piece only when no plan already recorded against the same covered item reference stands at quoted, active, inspection overdue or suspended.
    evidence_fields:
    - protection_plans.covered_item_sku
    - protection_plans.status
    - protection_plans.customer_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - protection_plans.covered_item_sku
      action_bindings:
        protection_plans.covered_item_sku: covered_item_sku
    dedup_contract:
      table: protection_plans
      mode: separate_record
      object_bindings:
        covered_item_sku: covered_item_sku
      duplicate_filters:
        status:
        - quoted
        - active
        - inspection_overdue
        - suspended
      distinct_fields:
      - purchased_date
      - variant_name
  params:
    max_per_customer: null
    per_tier:
      Manufacturer Limited Warranty:
        max_plans_per_item: =max_plans_per_item
      Belrose Care Plan 2-Year:
        max_plans_per_item: =max_plans_per_item
      Belrose Care Plan 3-Year:
        max_plans_per_item: =max_plans_per_item
      Belrose Care Plan 5-Year:
        max_plans_per_item: =max_plans_per_item
      Belrose Lifetime Care Plan:
        max_plans_per_item: =max_plans_per_item
      Belrose Heirloom Protection Plan:
        max_plans_per_item: =max_plans_per_item
- id: protection_agg_allowance_pooling
  subject:
  - protection_claim_settled
  - protection_benefit_exhausted
  - protection_allowance_reinstated
  rule: Where a customer holds several plans, each plan answers only for the piece named on it and allowances are never pooled across plans. A claim is settled against the allowance of the plan covering the piece claimed for, and where that allowance is short the shortfall is not taken from another plan the customer holds. The benefit consumed in the current coverage year on one plan is read as the sum of the settlements booked to that plan in that year, and the remaining allowance is the granted allowance less that sum. Where the remaining allowance reaches zero the plan is recorded as exhausted and further claims on it are refused on the ground that the allowance is consumed.
  eligibility: []
  params:
    per_tier:
      Manufacturer Limited Warranty:
        annual_benefit_allowance: =annual_benefit_allowance
        lifetime_benefit_allowance: =lifetime_benefit_allowance
        allowance_reinstates_annually: =allowance_reinstates_annually
      Belrose Care Plan 2-Year:
        annual_benefit_allowance: =annual_benefit_allowance
        lifetime_benefit_allowance: =lifetime_benefit_allowance
        allowance_reinstates_annually: =allowance_reinstates_annually
      Belrose Care Plan 3-Year:
        annual_benefit_allowance: =annual_benefit_allowance
        lifetime_benefit_allowance: =lifetime_benefit_allowance
        allowance_reinstates_annually: =allowance_reinstates_annually
      Belrose Care Plan 5-Year:
        annual_benefit_allowance: =annual_benefit_allowance
        lifetime_benefit_allowance: =lifetime_benefit_allowance
        allowance_reinstates_annually: =allowance_reinstates_annually
      Belrose Lifetime Care Plan:
        annual_benefit_allowance: =annual_benefit_allowance
        lifetime_benefit_allowance: =lifetime_benefit_allowance
        allowance_reinstates_annually: =allowance_reinstates_annually
      Belrose Heirloom Protection Plan:
        annual_benefit_allowance: =annual_benefit_allowance
        lifetime_benefit_allowance: =lifetime_benefit_allowance
        allowance_reinstates_annually: =allowance_reinstates_annually
  formula:
    remaining_allowance: annual_benefit_allowance - protection_msr_benefit_consumed_year
  measures:
  - protection_msr_benefit_consumed_year
- id: protection_plan_eligibility
  subject:
  - protection_plan_quoted
  - protection_plan_activated
  rule: Coverage is written only on a piece whose pre-tax selling price falls between the smallest and the largest item value that coverage admits. A protection plan is quoted only when the covered piece was sold within the purchase window in calendar days the coverage allows, counted from the date the covered piece was sold. The purchase window is counted in whole calendar days from the day of sale, that day counting as day zero, weekends and store holidays included, and no substitution of business days is made. Above the item value the coverage sets, a current appraisal must already be on file for the piece before the plan is written, and the customer's own belief about what the piece is worth never stands in for it. The premium is the coverage's share of the item value and may be added to a promotional financing plan only on the coverage that admits it. Coverage begins once the waiting period has run from the day the plan was bought, and nothing that happened before coverage began is answered for.
  eligibility:
  - id: within_purchase_window
    applies_to:
    - protection_plan_quoted
    kind: time
    condition: A protection plan is quoted only when the covered piece was sold within the purchase window in calendar days the coverage allows, counted from the date the covered piece was sold.
    evidence_fields:
    - protection_plans.sales_receipt_number
    - protection_plans.purchased_date
    - protection_plans.covered_item_sku
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - protection_plans.sales_receipt_number
        - protection_plans.covered_item_sku
      action_bindings:
        protection_plans.sales_receipt_number: sales_receipt_number
        protection_plans.covered_item_sku: covered_item_sku
    temporal_basis:
      clock: frozen_time
      anchor_event: the date the covered piece was sold
      anchor_source: protection_plans.purchased_date
      relation: not_after
      duration_source: variants.purchase_window_days
      unit: calendar_days
      counting_rule: The purchase window is counted in whole calendar days from the day of sale, that day counting as day zero, weekends and store holidays included, and no substitution of business days is made.
      boundary: inclusive
  - id: appraisal_on_file_above_value
    applies_to:
    - protection_plan_quoted
    - protection_plan_activated
    kind: authorization
    condition: Above the item value the coverage sets, a current appraisal must already be on file for the piece before the plan is written, and the customer's own belief about what the piece is worth never stands in for it.
    evidence_fields:
    - protection_plans.item_value_at_purchase
    - protection_plans.covered_item_sku
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - protection_plans.covered_item_sku
      action_bindings:
        protection_plans.covered_item_sku: covered_item_sku
  params:
    per_tier:
      Manufacturer Limited Warranty:
        minimum_item_value: =minimum_item_value
        maximum_item_value: =maximum_item_value
        purchase_window_days: =purchase_window_days
        waiting_period_days: =waiting_period_days
        plan_price_pct_of_item_value: =plan_price_pct_of_item_value
        appraisal_required_above_value: =appraisal_required_above_value
        premium_may_be_financed: =premium_may_be_financed
      Belrose Care Plan 2-Year:
        minimum_item_value: =minimum_item_value
        maximum_item_value: =maximum_item_value
        purchase_window_days: =purchase_window_days
        waiting_period_days: =waiting_period_days
        plan_price_pct_of_item_value: =plan_price_pct_of_item_value
        appraisal_required_above_value: =appraisal_required_above_value
        premium_may_be_financed: =premium_may_be_financed
      Belrose Care Plan 3-Year:
        minimum_item_value: =minimum_item_value
        maximum_item_value: =maximum_item_value
        purchase_window_days: =purchase_window_days
        waiting_period_days: =waiting_period_days
        plan_price_pct_of_item_value: =plan_price_pct_of_item_value
        appraisal_required_above_value: =appraisal_required_above_value
        premium_may_be_financed: =premium_may_be_financed
      Belrose Care Plan 5-Year:
        minimum_item_value: =minimum_item_value
        maximum_item_value: =maximum_item_value
        purchase_window_days: =purchase_window_days
        waiting_period_days: =waiting_period_days
        plan_price_pct_of_item_value: =plan_price_pct_of_item_value
        appraisal_required_above_value: =appraisal_required_above_value
        premium_may_be_financed: =premium_may_be_financed
      Belrose Lifetime Care Plan:
        minimum_item_value: =minimum_item_value
        maximum_item_value: =maximum_item_value
        purchase_window_days: =purchase_window_days
        waiting_period_days: =waiting_period_days
        plan_price_pct_of_item_value: =plan_price_pct_of_item_value
        appraisal_required_above_value: =appraisal_required_above_value
        premium_may_be_financed: =premium_may_be_financed
      Belrose Heirloom Protection Plan:
        minimum_item_value: =minimum_item_value
        maximum_item_value: =maximum_item_value
        purchase_window_days: =purchase_window_days
        waiting_period_days: =waiting_period_days
        plan_price_pct_of_item_value: =plan_price_pct_of_item_value
        appraisal_required_above_value: =appraisal_required_above_value
