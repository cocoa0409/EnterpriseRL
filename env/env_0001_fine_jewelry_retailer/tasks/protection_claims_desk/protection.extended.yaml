- id: protection_ext_claim_refusal
  base_policy_refs:
  - protection_claim_intake
  - protection_included_services
  overwrite:
  - base_policy: protection_included_services
    superseded_clause: >-
      Coverage includes a set number of routine services in a rolling twelve months — replating, resizing
      and refinishing — and these are drawn without a claim being opened.
    replaced_by: >-
      Where the coverage grants its allowance afresh each year and a grant stands for the coverage year in
      progress, they are counted instead over that coverage year so far; where the coverage grants its allowance
      afresh each year and no grant stands for the coverage year in progress, they are counted over the twelve
      months to the handling date.
  - base_policy: protection_included_services
    superseded_clause: >-
      A service visit that falls outside what the coverage includes may be handled as goodwill up to the coverage's
      goodwill allowance, and the goodwill visit is recorded like any other so the allowance can be counted.
    replaced_by: >-
      Where no claim has been refused on the plan in that window and the coverage allows goodwill visits at
      all, the goodwill share of the figure is met as goodwill and comes off; where a claim has already been
      refused in that window and the refusals in it stand below the goodwill visits the coverage allows, the
      repeat-refusal share of the figure comes off.
  trigger: state_due
  subject:
  - protection_claim_denied
  computes: refused_amount
  target_tool: record_claim_refusal_9dff8781
  params:
    stale_report_share: 0.9
    drawn_services_share: 0.5
    goodwill_share: 0.05
    repeat_refusal_goodwill_share: 0.02
    coverage_year_months: 12
  rule: >-
    A claim the coverage does not answer for is refused on one ground, and what is recorded against the refusal
    is what the customer is left to pay for the loss once the work the coverage answers for anyway has been
    taken off. The claim being answered is the one last entered against the plan, and the work order it was
    sent in on is the one carrying that claim's reference. The figure the refusal is recorded at is the amount
    the claim stands entered for on the coverage. Where that amount stands above the value the piece is taken
    at and no settlement has been booked to the plan in the coverage year in progress, the figure is instead
    the value the piece is taken at; where that amount stands above the value the piece is taken at and a
    settlement has been booked in the coverage year in progress, the figure is that value less the benefit
    already drawn in that year. The value the piece is taken at is the value it was sold at. Where a report
    stands on file for the piece that is still current and was prepared to state a replacement value for insurance,
    the value the piece is taken at is the value that report states; where a report stands on file that is
    still current and was prepared for any other purpose, the value the piece is taken at is the value it
    was sold at at the other-purpose share the coverage allows. The routine work and the goodwill already
    drawn are counted over the whole time the plan has been in force. Where the coverage grants its allowance
    afresh each year and a grant stands for the coverage year in progress, they are counted instead over that
    coverage year so far; where the coverage grants its allowance afresh each year and no grant stands for
    the coverage year in progress, they are counted over the twelve months to the handling date. Nothing is
    taken off the figure for work the coverage would have answered for without a claim. Where the coverage
    includes chain and solder work and no chain repair has been drawn on the plan in that window, the workshop's
    published charge for a chain solder at the level the piece was worked at is taken off the figure; where
    the coverage includes chain and solder work and a chain repair has already been drawn in that window,
    the drawn-service share of that charge is taken off. Nothing is met as goodwill. Where no claim has been
    refused on the plan in that window and the coverage allows goodwill visits at all, the goodwill share
    of the figure is met as goodwill and comes off; where a claim has already been refused in that window
    and the refusals in it stand below the goodwill visits the coverage allows, the repeat-refusal share of
    the figure comes off. The work the coverage answers for anyway and the goodwill are both taken off the
    figure the refusal is recorded at, never off one another, and the goodwill share is worked out on that
    same figure. The amount recorded as refused is rounded to two decimal places once at the end, and is never
    below zero.
