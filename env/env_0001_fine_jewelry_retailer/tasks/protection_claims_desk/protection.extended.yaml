      whole months since the plan was bought are counted to the handling date. The whole of that unused premium
      is returned. The share of the unused premium is worked out on the premium already reduced in proportion
      to the months still to run, and the administration fee is taken off only after that share has been applied.
      The figure is rounded to two decimal places once at the end, and nothing below zero is ever returned.
    params:
    - coverage_term_months
    - cancellation_admin_fee
