- id: protection_ext_allowance_reinstatement
  base_policy_refs:
  - protection_allowance_grant
  - protection_agg_allowance_pooling
  - protection_inspection_discipline
  overwrite:
  - base_policy: protection_allowance_grant
    superseded_clause: >-
      On the coverage that reinstates annually the allowance is granted afresh on each anniversary of the
      effective date, and any allowance unused in the year just ended does not carry forward.
    replaced_by: >-
      Where what the plan drew in the coverage year just ended stands at or above the heavy-draw share of
      the yearly benefit allowance and two or more settlements stand on the plan over its life, only the after-heavy-draw
      share of the yearly benefit allowance is granted; where what it drew stands at or above that heavy-draw
      share and fewer than two settlements stand on the plan over its life, the lighter after-heavy-draw share
      is granted.
  trigger: state_due
  subject:
  - protection_allowance_reinstated
  computes: allowance_amount
  target_tool: reinstate_benefit_allowance_e0b143ff
  params:
    stale_report_cap: 1.15
    heavy_draw_share: 0.5
    after_heavy_draw_share: 0.75
    after_heavy_draw_light_share: 0.9
    repeat_claim_count: 2
    late_grant_months: 2
    very_late_grant_months: 5
    late_share: 0.85
    very_late_share: 0.7
    lapsed_year_share: 0.9
    unrestored_year_share: 0.6
    maintained_member_uplift: 1.1
    unmaintained_member_uplift: 1.05
    coverage_year_months: 12
  rule: >-
    On coverage that grants its benefit allowance afresh each year, the allowance for the coverage year in
    progress is booked to the plan as one entry, and what is granted is worked out from the piece's standing
    and from what the plan drew in the coverage year just ended. The benefit granted afresh for a coverage
    year is the yearly benefit allowance the coverage sets for the piece. Where a report stands on file for
    the piece whose validity has not run out and states a value above the value the piece was sold at, the
    yearly benefit allowance is taken in proportion to the value that report states over the value at purchase;
    where such a report stands on file but its validity has run out and it states a value above the value
    at purchase, the yearly benefit allowance is taken in that same proportion but never above the stale-report
    ceiling the coverage allows. What the plan drew in the coverage year just ended is the benefit consumed
    by the settlements booked to it in the twelve months to the handling date. Where allowance entries already
    stand on the plan and the coverage grants its allowance afresh each year, what the plan drew is instead
    the benefit consumed by the settlements booked in the twelve months following the most recent allowance
    entry; where allowance entries stand on the plan and the coverage does not grant its allowance afresh
    each year, it is the benefit consumed by every settlement booked to the plan. The whole of that yearly
    benefit allowance is granted. Where what the plan drew in the coverage year just ended stands at or above
    the heavy-draw share of the yearly benefit allowance and two or more settlements stand on the plan over
    its life, only the after-heavy-draw share of the yearly benefit allowance is granted; where what it drew
    stands at or above that heavy-draw share and fewer than two settlements stand on the plan over its life,
    the lighter after-heavy-draw share is granted. The grant is not reduced for the time that has passed since
    the anniversary. Where the whole months since the anniversary of the day coverage began stand above the
    very-late threshold the coverage sets, the grant is taken at the very-late share; where they stand above
    the late threshold but not above the very-late threshold, it is taken at the late share. The grant is
    not reduced for the inspections logged in the year. Where fewer inspection entries stand on the plan in
    the twelve months to the handling date than the coverage's inspection interval calls for and the most
    recent of them falls within that interval, the grant is taken at the lapsed-year share; where fewer stand
    than the interval calls for and the most recent falls outside it, the grant is taken at the unrestored-year
    share. The grant carries no membership uplift. Where the customer's membership stands in force and the
    qualifying spend recorded since its tier took effect is at or above the spend that tier must be maintained
    by, the grant carries the maintained-member uplift; where the membership stands in force and that spend
    is below it, the grant carries the unmaintained-member uplift. What is granted is limited to what is left
    of the coverage's lifetime benefit ceiling after the allowance entries already booked to the plan, and
    nothing unused in the coverage year just ended carries forward. The shares and the uplift all act on the
    yearly benefit allowance, one after another and each on the figure the one before it left, and the lifetime
    ceiling is applied only to the figure they leave. The amount granted is rounded to two decimal places
    once at the end.
  prerequisite: []
  cross_category:
  - category: appraisal
    as: branch
    reads:
    - appraised_value
    - valid_until
    note: >-
      the report standing on file for the piece decides the yearly benefit allowance the grant rests on
  - category: circle
    as: branch
    reads:
    - status
    - qualifying_spend_ytd
    - tier_maintenance_qualifying_spend
    note: the membership standing decides the uplift the grant carries
  compute:
  - yearly_allowance: P('annual_benefit_allowance')
  - report_value: CFIELD('appraisal','appraised_value', item_sku=F('covered_item_sku'))
  - report_valid_until: CFIELD('appraisal','valid_until', item_sku=F('covered_item_sku'))
  - report_current: report_valid_until >= NOW
  - yearly_base: >-
      yearly_allowance * report_value / F('item_value_at_purchase') if (report_current and report_value >
      F('item_value_at_purchase')) else (MN(yearly_allowance * report_value / F('item_value_at_purchase'),
      yearly_allowance * K('stale_report_cap')) if ((not report_current) and report_value > F('item_value_at_purchase'))
      else yearly_allowance)
  - reinstatements_count: COUNT('protection_ledger', event_type='protection_allowance_reinstated')
  - reinstates_annually: P('allowance_reinstates_annually')
  - last_grant_months: >-
      MONTHS(LATEST('protection_ledger','posted_date', date_field='posted_date', event_type='protection_allowance_reinstated'),
      NOW) if reinstatements_count > 0 else 0
  - drawn_benefit: >-
      ABS(SUM('protection_ledger','amount', within_months=last_grant_months, date_field='posted_date', event_type='protection_claim_settled')
      - SUM('protection_ledger','amount', within_months=MX(0, last_grant_months - K('coverage_year_months')),
      date_field='posted_date', event_type='protection_claim_settled')) if (reinstatements_count > 0 and reinstates_annually)
      else (ABS(SUM('protection_ledger','amount', event_type='protection_claim_settled')) if (reinstatements_count
      > 0 and not reinstates_annually) else ABS(SUM('protection_ledger','amount', within_months=K('coverage_year_months'),
      date_field='posted_date', event_type='protection_claim_settled')))
  - settlements_life: COUNT('protection_ledger', event_type='protection_claim_settled')
  - draw_share: >-
      K('after_heavy_draw_share') if (drawn_benefit >= K('heavy_draw_share') * yearly_allowance and settlements_life
      >= K('repeat_claim_count')) else (K('after_heavy_draw_light_share') if (drawn_benefit >= K('heavy_draw_share')
      * yearly_allowance and settlements_life < K('repeat_claim_count')) else 1.0)
  - year_months_elapsed: MONTHS(F('effective_date'), NOW) % 12
  - late_share: >-
      K('very_late_share') if year_months_elapsed > K('very_late_grant_months') else (K('late_share') if year_months_elapsed
      > K('late_grant_months') else 1.0)
  - inspections_in_year: >-
      COUNT('protection_ledger', within_months=K('coverage_year_months'), date_field='posted_date', event_type='protection_inspection_logged')
  - inspections_called_for: int(K('coverage_year_months') / P('inspection_interval_months'))
  - months_since_inspection: >-
      MONTHS(LATEST('protection_ledger','posted_date', date_field='posted_date', event_type='protection_inspection_logged'),
      NOW)
  - inspection_share: >-
      K('lapsed_year_share') if (inspections_in_year < inspections_called_for and months_since_inspection
      <= P('inspection_interval_months')) else (K('unrestored_year_share') if (inspections_in_year < inspections_called_for
      and months_since_inspection > P('inspection_interval_months')) else 1.0)
  - member_status: CFIELD('circle','status')
  - member_spend: CFIELD('circle','qualifying_spend_ytd')
  - member_floor: CPARAM('circle','tier_maintenance_qualifying_spend')
  - member_share: >-
      K('maintained_member_uplift') if (member_status == 'active' and member_spend >= member_floor) else (K('unmaintained_member_uplift')
      if (member_status == 'active' and member_spend < member_floor) else 1.0)
  - granted_to_date: >-
      SUM('protection_ledger','amount', event_type='protection_allowance_granted') + SUM('protection_ledger','amount',
      event_type='protection_allowance_reinstated')
  - lifetime_headroom: MX(0, P('lifetime_benefit_allowance') - granted_to_date)
  - result: >-
      RND(MN(yearly_base * draw_share * late_share * inspection_share * member_share, lifetime_headroom),
      2)
  compute_basis:
    yearly_allowance: >-
      The benefit granted afresh for a coverage year is the yearly benefit allowance the coverage sets for
      the piece.
    report_value: >-
      Where a report stands on file for the piece whose validity has not run out and states a value above
      the value the piece was sold at, the yearly benefit allowance is taken in proportion to the value that
      report states over the value at purchase; where such a report stands on file but its validity has run
      out and it states a value above the value at purchase, the yearly benefit allowance is taken in that
      same proportion but never above the stale-report ceiling the coverage allows.
    report_valid_until: >-
      Where a report stands on file for the piece whose validity has not run out and states a value above
      the value the piece was sold at, the yearly benefit allowance is taken in proportion to the value that
      report states over the value at purchase; where such a report stands on file but its validity has run
      out and it states a value above the value at purchase, the yearly benefit allowance is taken in that
      same proportion but never above the stale-report ceiling the coverage allows.
    report_current: >-
      Where a report stands on file for the piece whose validity has not run out and states a value above
      the value the piece was sold at, the yearly benefit allowance is taken in proportion to the value that
      report states over the value at purchase; where such a report stands on file but its validity has run
      out and it states a value above the value at purchase, the yearly benefit allowance is taken in that
      same proportion but never above the stale-report ceiling the coverage allows.
    yearly_base: >-
      Where a report stands on file for the piece whose validity has not run out and states a value above
      the value the piece was sold at, the yearly benefit allowance is taken in proportion to the value that
      report states over the value at purchase; where such a report stands on file but its validity has run
      out and it states a value above the value at purchase, the yearly benefit allowance is taken in that
      same proportion but never above the stale-report ceiling the coverage allows.
    reinstatements_count: >-
      Where allowance entries already stand on the plan and the coverage grants its allowance afresh each
      year, what the plan drew is instead the benefit consumed by the settlements booked in the twelve months
      following the most recent allowance entry; where allowance entries stand on the plan and the coverage
      does not grant its allowance afresh each year, it is the benefit consumed by every settlement booked
      to the plan.
    reinstates_annually: >-
      Where allowance entries already stand on the plan and the coverage grants its allowance afresh each
      year, what the plan drew is instead the benefit consumed by the settlements booked in the twelve months
      following the most recent allowance entry; where allowance entries stand on the plan and the coverage
      does not grant its allowance afresh each year, it is the benefit consumed by every settlement booked
      to the plan.
    last_grant_months: >-
      Where allowance entries already stand on the plan and the coverage grants its allowance afresh each
      year, what the plan drew is instead the benefit consumed by the settlements booked in the twelve months
      following the most recent allowance entry; where allowance entries stand on the plan and the coverage
      does not grant its allowance afresh each year, it is the benefit consumed by every settlement booked
      to the plan.
    drawn_benefit: >-
      Where allowance entries already stand on the plan and the coverage grants its allowance afresh each
      year, what the plan drew is instead the benefit consumed by the settlements booked in the twelve months
      following the most recent allowance entry; where allowance entries stand on the plan and the coverage
      does not grant its allowance afresh each year, it is the benefit consumed by every settlement booked
      to the plan.
    settlements_life: >-
      Where what the plan drew in the coverage year just ended stands at or above the heavy-draw share of
      the yearly benefit allowance and two or more settlements stand on the plan over its life, only the after-heavy-draw
      share of the yearly benefit allowance is granted; where what it drew stands at or above that heavy-draw
      share and fewer than two settlements stand on the plan over its life, the lighter after-heavy-draw share
      is granted.
    draw_share: >-
      Where what the plan drew in the coverage year just ended stands at or above the heavy-draw share of
      the yearly benefit allowance and two or more settlements stand on the plan over its life, only the after-heavy-draw
      share of the yearly benefit allowance is granted; where what it drew stands at or above that heavy-draw
      share and fewer than two settlements stand on the plan over its life, the lighter after-heavy-draw share
      is granted.
    year_months_elapsed: >-
      Where the whole months since the anniversary of the day coverage began stand above the very-late threshold
      the coverage sets, the grant is taken at the very-late share; where they stand above the late threshold
      but not above the very-late threshold, it is taken at the late share.
    late_share: >-
      Where the whole months since the anniversary of the day coverage began stand above the very-late threshold
      the coverage sets, the grant is taken at the very-late share; where they stand above the late threshold
      but not above the very-late threshold, it is taken at the late share.
    inspections_in_year: >-
      Where fewer inspection entries stand on the plan in the twelve months to the handling date than the
      coverage's inspection interval calls for and the most recent of them falls within that interval, the
      grant is taken at the lapsed-year share; where fewer stand than the interval calls for and the most
      recent falls outside it, the grant is taken at the unrestored-year share.
    inspections_called_for: >-
      Where fewer inspection entries stand on the plan in the twelve months to the handling date than the
      coverage's inspection interval calls for and the most recent of them falls within that interval, the
      grant is taken at the lapsed-year share; where fewer stand than the interval calls for and the most
      recent falls outside it, the grant is taken at the unrestored-year share.
    months_since_inspection: >-
      Where fewer inspection entries stand on the plan in the twelve months to the handling date than the
      coverage's inspection interval calls for and the most recent of them falls within that interval, the
      grant is taken at the lapsed-year share; where fewer stand than the interval calls for and the most
      recent falls outside it, the grant is taken at the unrestored-year share.
    inspection_share: >-
      Where fewer inspection entries stand on the plan in the twelve months to the handling date than the
      coverage's inspection interval calls for and the most recent of them falls within that interval, the
      grant is taken at the lapsed-year share; where fewer stand than the interval calls for and the most
      recent falls outside it, the grant is taken at the unrestored-year share.
    member_status: >-
      Where the customer's membership stands in force and the qualifying spend recorded since its tier took
      effect is at or above the spend that tier must be maintained by, the grant carries the maintained-member
      uplift; where the membership stands in force and that spend is below it, the grant carries the unmaintained-member
      uplift.
    member_spend: >-
      Where the customer's membership stands in force and the qualifying spend recorded since its tier took
      effect is at or above the spend that tier must be maintained by, the grant carries the maintained-member
      uplift; where the membership stands in force and that spend is below it, the grant carries the unmaintained-member
      uplift.
    member_floor: >-
      Where the customer's membership stands in force and the qualifying spend recorded since its tier took
      effect is at or above the spend that tier must be maintained by, the grant carries the maintained-member
      uplift; where the membership stands in force and that spend is below it, the grant carries the unmaintained-member
      uplift.
    member_share: >-
      Where the customer's membership stands in force and the qualifying spend recorded since its tier took
      effect is at or above the spend that tier must be maintained by, the grant carries the maintained-member
      uplift; where the membership stands in force and that spend is below it, the grant carries the unmaintained-member
      uplift.
    granted_to_date: >-
      What is granted is limited to what is left of the coverage's lifetime benefit ceiling after the allowance
      entries already booked to the plan, and nothing unused in the coverage year just ended carries forward.
    lifetime_headroom: >-
      What is granted is limited to what is left of the coverage's lifetime benefit ceiling after the allowance
      entries already booked to the plan, and nothing unused in the coverage year just ended carries forward.
    result: >-
      The shares and the uplift all act on the yearly benefit allowance, one after another and each on the
      figure the one before it left, and the lifetime ceiling is applied only to the figure they leave. The
      amount granted is rounded to two decimal places once at the end.
  factors:
  - id: yearly_allowance_basis
    effect: method
    decides: yearly_base
    bindings:
    - report_value
    - report_valid_until
    - report_current
    - yearly_base
    ladder:
    - when: >-
        a report stands on file for the covered piece whose validity has not run out and states a value above
        the value the piece was sold at
      method: >-
        the yearly benefit allowance is taken in proportion to the value that report states over the value
        at purchase
    - when: >-
        a report stands on file for the covered piece whose validity has run out and states a value above
        the value the piece was sold at
      method: >-
        the yearly benefit allowance is taken in that proportion but never above the stale-report ceiling
    - when: otherwise
      method: the yearly benefit allowance is taken as the coverage sets it
    baseline:
      yearly_base: yearly_allowance
    evidence:
    - cross_category
    - date
    cross_difficulty: appraisal
  - id: drawn_benefit_window
    effect: method
    decides: drawn_benefit
    bindings:
