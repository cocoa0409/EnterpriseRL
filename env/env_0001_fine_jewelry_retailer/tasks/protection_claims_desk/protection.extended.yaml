- id: protection_ext_cancellation_refund
  base_policy_refs:
  - protection_cancellation_refund
  - protection_claim_settlement
  overwrite:
  - base_policy: protection_cancellation_refund
    superseded_clause: >-
      A plan cancelled inside the coverage's full-refund window is refunded in whole, and the cancellation
      takes effect on the day the customer confirms it.
    replaced_by: >-
      The cancellation takes effect on the day the customer confirms it, and where it reaches the desk within
      the full-refund window in calendar days counted from the day the plan was bought what is returned is
      worked out on the same proportion with no administration fee charged.
  - base_policy: protection_cancellation_refund
    superseded_clause: >-
      A merchandise protection plan is refunded in whole only when the cancellation reaches the desk within
      the full-refund window in calendar days, counted from the date the plan was bought.
    replaced_by: >-
      What is returned when live coverage is given up is the premium the customer has paid toward the plan,
      taken in proportion to the whole months of the term still to run, less the coverage's administration
      fee.
  - base_policy: protection_cancellation_refund
    superseded_clause: >-
      A plan that has already settled a claim is not refunded at all, whatever window it is cancelled in,
      because the coverage has already answered.
    replaced_by: >-
      Where a settlement stands against the plan inside the window the coverage counts claims over and the
      benefit drawn in that window is at or above the heavy-draw share of the coverage's yearly allowance,
      only the heavy-claim share of the unused premium is returned; where a settlement stands inside that
      window and the benefit drawn in it is below that heavy-draw share, the light-claim share of the unused
      premium is returned.
  - base_policy: protection_cancellation_refund
    superseded_clause: >-
      After that window the coverage that prorates returns the premium in proportion to the months of the
      term not yet run, less the coverage's administration fee, and the coverage that does not prorate returns
      nothing.
    replaced_by: >-
      Where the cancellation reaches the desk within the full-refund window in calendar days counted from
      the day the plan was bought and no claim has yet been settled on the plan, no administration fee is
      charged at all; where it reaches the desk after that window and the customer's membership stands at
      a tier the programme sets a spend to maintain, the administration fee is charged at the member share
      the coverage allows.
  trigger: on_request
  subject:
  - protection_plan_cancelled
  - protection_premium_refunded
  computes: refund_amount
  target_tool: confirm_plan_cancellation_48603509
  params:
    heavy_draw_share: 0.5
    heavy_claim_return_share: 0.5
    light_claim_return_share: 0.75
    member_admin_share: 0.5
    claims_window_months: 12
    coverage_year_months: 12
  rule: >-
    Live coverage that the customer gives up closes on the day they confirm it, and what comes back to them
    is worked out from what they have actually paid toward the plan and the part of the term they will not
    now use. The premium returned is fixed only after the benefit consumed by every claim entered against
    the plan stands recorded against it. The cancellation takes effect on the day the customer confirms it,
    and where it reaches the desk within the full-refund window in calendar days counted from the day the
    plan was bought what is returned is worked out on the same proportion with no administration fee charged.
    What is returned when live coverage is given up is the premium the customer has paid toward the plan,
    taken in proportion to the whole months of the term still to run, less the coverage's administration fee.
    The premium the customer has paid toward the plan is the premium entries booked to it, net of the give-backs
    booked against them. The whole months still to run are the coverage's term in months less the whole months
    since the plan was bought and less the month in progress. The work order the coverage keeps answering
    for is the one carrying the reference of the claim last entered against the plan. The whole months since
    the plan was bought are counted to the handling date. Where that work order stands not yet handed back
    and carries a promised date later than the handling date, the coverage keeps answering for the piece until
    it comes back, so the whole months since the plan was bought are counted instead to that promised date;
    where that work order stands not yet handed back and its promised date has already passed, the month in
    progress counts as run and the whole months since the plan was bought are counted to the handling date
    and one more. Where the whole months since the most recent inspection entry exceed the coverage's inspection
    interval and the plan has run beyond its first coverage year, the whole months still to run are instead
    the coverage's term less the whole months since the plan was bought and less the whole months by which
    the inspection stands overdue, because the months the coverage was not answering are not returned; where
    the whole months since the most recent inspection entry are within that interval and the plan has run
    beyond its first coverage year, the month in progress counts as still to run and the whole months still
    to run are the coverage's term less the whole months since the plan was bought. The whole of that unused
    premium is returned. Where a settlement stands against the plan inside the window the coverage counts
    claims over and the benefit drawn in that window is at or above the heavy-draw share of the coverage's
    yearly allowance, only the heavy-claim share of the unused premium is returned; where a settlement stands
    inside that window and the benefit drawn in it is below that heavy-draw share, the light-claim share of
    the unused premium is returned. Where the cancellation reaches the desk within the full-refund window
    in calendar days counted from the day the plan was bought and no claim has yet been settled on the plan,
    no administration fee is charged at all; where it reaches the desk after that window and the customer's
    membership stands at a tier the programme sets a spend to maintain, the administration fee is charged
    at the member share the coverage allows. The share of the unused premium is worked out on the premium
    already reduced in proportion to the months still to run, and the administration fee is taken off only
    after that share has been applied. The figure is rounded to two decimal places once at the end, and nothing
    below zero is ever returned.
  prerequisite:
  - problem: protection_ext_claim_settlement
    kind: value_input
    gate: returned_share
    form: state
    policy_source: >-
      The premium returned is fixed only after the benefit consumed by every claim entered against the plan
      stands recorded against it.
    condition: >-
      every claim entered against the plan carries a settlement entry booked under its own claim reference
      recording the benefit it consumed
    resolved_by: record_claim_settlement_8eb9093c
    effect: >-
      the share of the unused premium returned stops being the whole of it and becomes the share the plan's
      claims record allows, because the benefit drawn in the window the coverage counts claims over is then
      standing on the plan
  cross_category:
  - category: service
    as: branch
    reads:
    - delivered_date
    - promised_date
    note: >-
      the work order carrying the claim's reference decides how far the coverage is treated as having run,
      from whether the piece has been handed back and the date it was promised back
  - category: circle
    as: branch
    reads:
