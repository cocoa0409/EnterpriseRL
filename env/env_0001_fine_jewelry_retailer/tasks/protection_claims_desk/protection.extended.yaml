  baseline:
    rule: >-
      The claim being answered is the one last entered against the plan, and the work order it was sent in
      on is the one carrying that claim's reference. What an accepted claim draws from the benefit allowance
      is the priced bench work the repair comes to, taken as the labour and the parts charged on the work
      order the claim was sent in on. That figure is reduced for the years the piece has been worn, at the
      coverage's annual reduction for each whole year since the piece was sold. The years the piece has been
      worn are the whole years between the day the piece was sold and the handling date, part years dropped.
      The coverage answers for the whole of what is left. The customer bears the coverage's deductible on
      the claim, which is taken off after the share the coverage answers for has been worked out and before
      the benefit is drawn. What is drawn is limited to the coverage's share of the item value recorded at
      purchase and to the benefit still standing on the plan, which is the allowance granted and reinstated
      in the window the coverage counts allowances over, less the benefit consumed by the settlements booked
      in that window. Settlements stand on the plan as movements out of the allowance, so the benefit they
      consumed is read as the size of those movements. Neither of those limits is applied before the deductible
      has been taken off. The figure is rounded to two decimal places once at the end, and nothing below zero
      is ever drawn.
    params:
    - depreciation_pct_per_year
    - deductible_per_claim
    - settlement_cap_pct_of_item_value
    - allowance_window_months
