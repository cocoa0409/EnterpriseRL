    - reinstates_annually
    - last_grant_months
    - drawn_benefit
    ladder:
    - when: allowance entries stand on the plan and the coverage grants its allowance afresh each year
      method: >-
        what the plan drew is the benefit consumed by the settlements booked in the twelve months following
        the most recent allowance entry
    - when: >-
        allowance entries stand on the plan and the coverage does not grant its allowance afresh each year
      method: what the plan drew is the benefit consumed by every settlement booked to the plan
    - when: otherwise
      method: >-
        what the plan drew is the benefit consumed by the settlements booked in the twelve months to the handling
        date
    baseline:
      drawn_benefit: >-
        ABS(SUM('protection_ledger','amount', within_months=K('coverage_year_months'), date_field='posted_date',
