# ---------------------------------------------------------------------------
# extended_policies: the multi-factor calculation policies this difficulty adds on top of
# the base charter above. The base section is copied verbatim and is never edited.
# ---------------------------------------------------------------------------
extended_policies:
- id: protection_ext_claim_settlement
  base_policy_refs:
  - protection_claim_settlement
  - protection_agg_allowance_pooling
  - protection_included_services
  overwrite:
  - base_policy: protection_claim_settlement
    superseded_clause: >-
      The settled value is reduced by the coverage's annual depreciation for each whole coverage year elapsed
      since the piece was sold, and the result is capped at the coverage's share of the item value recorded
      at purchase.
    replaced_by: >-
      What an accepted claim draws from the benefit allowance is the priced bench work the repair comes to,
      taken as the labour and the parts charged on the work order the claim was sent in on.
  - base_policy: protection_claim_settlement
    superseded_clause: >-
      An accepted claim is settled at the value the coverage sets, which is either what the piece originally
      sold for or what it would cost to replace today, and each coverage names which of the two it uses.
    replaced_by: >-
      Where the bench has not finished the work and a ceiling the customer authorised stands on that work
      order, the figure standing for the repair is that authorised ceiling; where the bench has not finished
      the work and no authorised ceiling stands on it, the figure standing for the repair is the estimate
      prepared on that work order; otherwise the figure standing for the repair is the labour and the parts
      charged on it.
  - base_policy: protection_claim_settlement
    superseded_clause: >-
      The customer pays the coverage's deductible on each accepted claim before the settlement is released,
      and the deductible is recorded against the settlement rather than netted silently out of it.
    replaced_by: >-
      Where no settlement stands against the plan in the window the coverage counts settlements over and the
      most recent inspection was logged within the coverage's inspection interval, nothing is charged to the
      customer; where a settlement stands in that window and the most recent inspection was logged within
      that interval, the deductible is charged at the repeat multiple the coverage sets; otherwise the deductible
      is charged as the coverage publishes it.
  - base_policy: protection_agg_allowance_pooling
    superseded_clause: >-
      The benefit consumed in the current coverage year on one plan is read as the sum of the settlements
      booked to that plan in that year, and the remaining allowance is the granted allowance less that sum.
    replaced_by: >-
      What is drawn is limited to the coverage's share of the item value recorded at purchase and to the benefit
      still standing on the plan, which is the allowance granted and reinstated in the window the coverage
      counts allowances over, less the benefit consumed by the settlements booked in that window.
  trigger: state_due
  subject:
  - protection_claim_settled
  computes: benefit_amount
  target_tool: record_claim_settlement_8eb9093c
  params:
    unmaintained_loyalty_share: 0.5
    sound_wear_share: 0.5
    worn_wear_share: 1.5
    expedited_level_share: 0.9
    above_level_share: 0.8
    repeat_deductible_multiple: 2.0
    settlement_window_months: 12
    allowance_window_months: 12
  rule: >-
    A claim the coverage answers for is settled by drawing benefit from the plan the covered piece stands
    on, and the benefit it draws is worked out from the bench work the repair comes to rather than from the
    figure the customer reported the loss as. The claim being answered is the one last entered against the
    plan, and the work order it was sent in on is the one carrying that claim's reference. What an accepted
    claim draws from the benefit allowance is the priced bench work the repair comes to, taken as the labour
    and the parts charged on the work order the claim was sent in on. Where the bench has not finished the
    work and a ceiling the customer authorised stands on that work order, the figure standing for the repair
    is that authorised ceiling; where the bench has not finished the work and no authorised ceiling stands
    on it, the figure standing for the repair is the estimate prepared on that work order; otherwise the figure
    standing for the repair is the labour and the parts charged on it. Where the customer's membership stands
    in force and the qualifying spend recorded since its tier took effect is at or above the spend that tier
    must be maintained by, the figure standing for the repair is reduced once by the loyalty discount the
    service level the work runs at carries; where the membership stands in force and the qualifying spend
    recorded since its tier took effect is below the spend that tier must be maintained by, it is reduced
    once by the unmaintained share of that discount the coverage allows; where no membership stands in force
    for the customer, nothing is taken off for loyalty. The reduced figure, and not the figure before any
    loyalty discount, is the base every later step acts on. That figure is reduced for the years the piece
    has been worn, at the coverage's annual reduction for each whole year since the piece was sold. The years
    the piece has been worn are the whole years between the day the piece was sold and the handling date,
    part years dropped. Where the most recent inspection logged on the plan found the piece sound and the
    work order the claim was sent in on carries no rework, that annual reduction is taken at the sound-piece
    share the coverage allows; where that inspection referred the piece to the bench or that work order carries
    a rework, it is taken at the worn-piece share the coverage allows; otherwise it is taken as the coverage
    publishes it. The coverage answers for the whole of what is left. Where the service level the work runs
    at targets a shorter turnaround than the coverage's own and the coverage offers expedited handling, the
    coverage answers instead for the expedited-level share of what is left; where that level targets a shorter
    turnaround than the coverage's own and the coverage does not offer expedited handling, it answers for
    the above-level share of what is left. The customer bears the coverage's deductible on the claim, which
    is taken off after the share the coverage answers for has been worked out and before the benefit is drawn.
    Where no settlement stands against the plan in the window the coverage counts settlements over and the
    most recent inspection was logged within the coverage's inspection interval, nothing is charged to the
    customer; where a settlement stands in that window and the most recent inspection was logged within that
    interval, the deductible is charged at the repeat multiple the coverage sets; otherwise the deductible
    is charged as the coverage publishes it. What is drawn is limited to the coverage's share of the item
    value recorded at purchase and to the benefit still standing on the plan, which is the allowance granted
    and reinstated in the window the coverage counts allowances over, less the benefit consumed by the settlements
    booked in that window. Settlements stand on the plan as movements out of the allowance, so the benefit
    they consumed is read as the size of those movements. Neither of those limits is applied before the deductible
    has been taken off. The figure is rounded to two decimal places once at the end, and nothing below zero
    is ever drawn.
  prerequisite: []
  cross_category:
  - category: service
    as: history
    reads:
    - completed_date
    - authorized_total
    - estimated_total
    - rework_count
    - turnaround_target_business_days
    - loyalty_discount_pct
    - service_ledger.amount
    note: >-
      the work order carrying the claim's reference decides the figure standing for the repair, the share
      the coverage answers for and the wear reduction, from its own priced lines and level
  - category: circle
    as: branch
    reads:
    - status
    - qualifying_spend_ytd
    - tier_maintenance_qualifying_spend
    note: >-
      the membership standing decides the loyalty discount taken off the figure standing for the repair
  compute:
  - claim_ref: >-
      LATEST('protection_ledger','claim_reference', date_field='posted_date', event_type='protection_claim_filed')
  - order_completed: CFIELD('service','completed_date', protection_claim_reference=claim_ref)
  - order_ceiling: CFIELD('service','authorized_total', protection_claim_reference=claim_ref)
  - order_estimate: CFIELD('service','estimated_total', protection_claim_reference=claim_ref)
  - booked_labour: >-
      XSUM('service','service_ledger','amount', protection_claim_reference=claim_ref, event_type='service_labor_charged')
  - booked_parts: >-
      XSUM('service','service_ledger','amount', protection_claim_reference=claim_ref, event_type='service_parts_charged')
  - repair_figure: >-
      order_ceiling if (order_completed == '' and order_ceiling > 0) else (order_estimate if (order_completed
      == '' and order_ceiling <= 0) else booked_labour + booked_parts)
  - member_status: CFIELD('circle','status')
  - member_spend: CFIELD('circle','qualifying_spend_ytd')
  - member_floor: CPARAM('circle','tier_maintenance_qualifying_spend')
  - level_loyalty_pct: CPARAM('service','loyalty_discount_pct', protection_claim_reference=claim_ref)
  - loyalty_pct: >-
      level_loyalty_pct if (member_status == 'active' and member_spend >= member_floor) else (K('unmaintained_loyalty_share')
      * level_loyalty_pct if (member_status == 'active' and member_spend < member_floor) else 0.0)
  - discounted_work: repair_figure * (1 - loyalty_pct / 100)
  - wear_years: int(MONTHS(F('purchased_date'), NOW) / 12)
  - last_inspection_result: >-
      LATEST('protection_ledger','inspection_result', date_field='posted_date', event_type='protection_inspection_logged')
  - order_reworks: CFIELD('service','rework_count', protection_claim_reference=claim_ref)
  - wear_rate_pct: >-
      K('sound_wear_share') * P('depreciation_pct_per_year') if (last_inspection_result == 'pass' and order_reworks
      == 0) else (K('worn_wear_share') * P('depreciation_pct_per_year') if (last_inspection_result == 'refer_to_bench'
      or order_reworks > 0) else P('depreciation_pct_per_year'))
  - worn_work: discounted_work * MX(0, 1 - wear_rate_pct * wear_years / 100)
  - coverage_turnaround: P('turnaround_target_business_days')
  - level_turnaround: CPARAM('service','turnaround_target_business_days', protection_claim_reference=claim_ref)
  - expedited_offered: P('expedited_service_available')
  - covered_share: >-
      K('expedited_level_share') if (level_turnaround < coverage_turnaround and expedited_offered) else (K('above_level_share')
      if (level_turnaround < coverage_turnaround and not expedited_offered) else 1.0)
  - answered_work: worn_work * covered_share
  - settlements_in_window: >-
      COUNT('protection_ledger', within_months=K('settlement_window_months'), date_field='posted_date', event_type='protection_claim_settled')
  - months_since_inspection: >-
      MONTHS(LATEST('protection_ledger','posted_date', date_field='posted_date', event_type='protection_inspection_logged'),
      NOW)
  - deductible_borne: >-
      0.0 if (settlements_in_window == 0 and months_since_inspection <= P('inspection_interval_months')) else
      (K('repeat_deductible_multiple') * P('deductible_per_claim') if (settlements_in_window > 0 and months_since_inspection
      <= P('inspection_interval_months')) else P('deductible_per_claim'))
  - value_ceiling: F('item_value_at_purchase') * P('settlement_cap_pct_of_item_value') / 100
  - allowance_standing: >-
      SUM('protection_ledger','amount', within_months=K('allowance_window_months'), date_field='posted_date',
      event_type='protection_allowance_granted') + SUM('protection_ledger','amount', within_months=K('allowance_window_months'),
      date_field='posted_date', event_type='protection_allowance_reinstated') + SUM('protection_ledger','amount',
      within_months=K('allowance_window_months'), date_field='posted_date', event_type='protection_claim_settled')
  - result: RND(MX(0.0, MN(answered_work - deductible_borne, value_ceiling, allowance_standing)), 2)
