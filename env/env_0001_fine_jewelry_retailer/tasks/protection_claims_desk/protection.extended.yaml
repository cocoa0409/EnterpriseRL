      method: the figure standing for the repair is that authorised ceiling
    - when: >-
        the work order shows no date the bench finished the work and carries no authorised ceiling above zero
      method: the figure standing for the repair is the estimate prepared on that work order
    - when: otherwise
      method: the figure standing for the repair is the labour and the parts charged on that work order
