- id: protection_ext_transfer_carryover
  base_policy_refs:
  - protection_transfer
  - protection_agg_allowance_pooling
  overwrite:
  - base_policy: protection_transfer
    superseded_clause: >-
      The plan closes as transferred on the transferring customer's record and the new owner's cover begins
      on the same day, with the remaining allowance carried across as it stands.
    replaced_by: >-
      Where the plan has been in force beyond the long-tenure threshold in whole years, the whole of the benefit
      standing carries across; where it has been in force beyond the mid-tenure threshold but not beyond the
      long-tenure threshold, the mid-tenure share carries across.
  - base_policy: protection_transfer
    superseded_clause: >-
      The transfer fee is taken at the counter and recorded against the coverage as a premium received in
      the period it was taken, so that what the customer has paid toward the plan stays a single running figure.
    replaced_by: >-
      The coverage's transfer fee is taken at the counter when the piece is handed over and is not booked
      against the coverage being passed on, so the entries on it stay the transferring customer's own.
  trigger: on_request
  subject:
  - protection_plan_transferred
  computes: allowance_carried_across
  target_tool: confirm_coverage_transfer_42b50f64
  params:
    coverage_year_months: 12
    long_tenure_years: 5
    mid_tenure_years: 2
    mid_tenure_share: 0.9
    new_tenure_share: 0.7
    refused_carry_share: 0.8
    light_carry_share: 0.9
    repeat_claim_count: 2
  rule: >-
    Coverage passed to a new owner takes the piece's benefit with it, and what carries across is the benefit
    standing on the plan at the moment the transfer takes effect. What carries across to the new owner is
    fixed only after the allowance entries booked to the plan carry a grant for the coverage year in progress.
    Coverage passes to a new owner only once every claim entered against the plan that the coverage does not
    answer for carries the ground on which it was refused. The benefit standing on the plan is the allowance
    entries booked to it over the whole time it has been in force, less the benefit consumed. Where the coverage
    grants its allowance afresh each year and an allowance entry stands inside the coverage year in progress,
    the allowance entries counted are those booked inside that coverage year; where the coverage grants its
    allowance afresh each year and no allowance entry stands inside the coverage year in progress, they are
    those booked in the twelve months to the handling date. The benefit consumed is the benefit taken by every
    settlement booked to the plan. Where a settlement stands on the plan in the twelve months to the handling
    date and an allowance entry stands inside the coverage year in progress, the benefit consumed is instead
    the benefit taken by the settlements booked since that allowance entry; where a settlement stands in those
    twelve months and no allowance entry stands inside the coverage year in progress, it is the benefit taken
    by the settlements booked in those twelve months. The new-plan share of the benefit standing carries across.
    Where the plan has been in force beyond the long-tenure threshold in whole years, the whole of the benefit
    standing carries across; where it has been in force beyond the mid-tenure threshold but not beyond the
    long-tenure threshold, the mid-tenure share carries across. What carries across is not reduced for the
    claims answered on the plan. Where a refusal entry stands on the plan in the twelve months to the handling
    date and two or more settlement entries stand on it over its life, the refused-claim share of what would
    otherwise carry across is carried; where a refusal entry stands in those twelve months and fewer than
    two settlement entries stand over its life, the lighter share is carried. The tenure share and the claims
    share both act on the benefit standing, one after the other, and what carries across is never below zero.
    The figure carried across is rounded to two decimal places once at the end. The coverage's transfer fee
    is taken at the counter when the piece is handed over and is not booked against the coverage being passed
    on, so the entries on it stay the transferring customer's own.
  prerequisite:
  - problem: protection_ext_allowance_reinstatement
    kind: value_input
    gate: granted_in_window
    form: state
    policy_source: >-
      What carries across to the new owner is fixed only after the allowance entries booked to the plan carry
      a grant for the coverage year in progress.
    condition: >-
      an allowance entry for the coverage year in progress stands booked to the plan, so that the benefit
      standing is the benefit of the year the piece is passed on in
    resolved_by: reinstate_benefit_allowance_e0b143ff
    effect: >-
      the allowance entries counted inside the coverage year in progress stop being none and become the grant
      for that year, so the benefit standing on the plan rises from nothing to the granted figure
  - problem: protection_ext_claim_refusal
    kind: value_input
    gate: claims_share
    form: state
    policy_source: >-
      Coverage passes to a new owner only once every claim entered against the plan that the coverage does
      not answer for carries the ground on which it was refused.
    condition: >-
      every claim entered against the plan that the coverage does not answer for carries a recorded ground
      for refusing it
    resolved_by: record_claim_refusal_9dff8781
    effect: >-
      the refusal entries counted in the twelve months to the handling date stop being none, so the claims
      share falls from the whole of what would otherwise carry across to the refused-claim share
  cross_category: []
  compute:
  - year_months_elapsed: MONTHS(F('effective_date'), NOW) % 12
  - grants_this_year: >-
      COUNT('protection_ledger', within_months=year_months_elapsed, date_field='posted_date', event_type='protection_allowance_reinstated')
  - reinstates_annually: P('allowance_reinstates_annually')
  - allowance_window_months: >-
      year_months_elapsed if (grants_this_year > 0 and reinstates_annually) else (K('coverage_year_months')
      if (grants_this_year == 0 and reinstates_annually) else MONTHS(F('effective_date'), NOW) + 1)
  - granted_in_window: >-
      SUM('protection_ledger','amount', within_months=allowance_window_months, date_field='posted_date', event_type='protection_allowance_granted')
      + SUM('protection_ledger','amount', within_months=allowance_window_months, date_field='posted_date',
      event_type='protection_allowance_reinstated')
  - settlements_in_year: >-
      COUNT('protection_ledger', within_months=K('coverage_year_months'), date_field='posted_date', event_type='protection_claim_settled')
  - last_grant_months: >-
      MONTHS(LATEST('protection_ledger','posted_date', date_field='posted_date', event_type='protection_allowance_reinstated'),
      NOW) if grants_this_year > 0 else 0
  - consumed_benefit: >-
      ABS(SUM('protection_ledger','amount', within_months=last_grant_months, date_field='posted_date', event_type='protection_claim_settled'))
      if (settlements_in_year > 0 and grants_this_year > 0) else (ABS(SUM('protection_ledger','amount', within_months=K('coverage_year_months'),
      date_field='posted_date', event_type='protection_claim_settled')) if (settlements_in_year > 0 and grants_this_year
      == 0) else ABS(SUM('protection_ledger','amount', event_type='protection_claim_settled')))
  - standing_benefit: MX(0.0, granted_in_window - consumed_benefit)
  - tenure_years: int(MONTHS(F('effective_date'), NOW) / 12)
  - tenure_share: >-
      1.0 if tenure_years > K('long_tenure_years') else (K('mid_tenure_share') if tenure_years > K('mid_tenure_years')
      else K('new_tenure_share'))
  - refusals_in_year: >-
      COUNT('protection_ledger', within_months=K('coverage_year_months'), date_field='posted_date', event_type='protection_claim_denied')
  - settlements_life: COUNT('protection_ledger', event_type='protection_claim_settled')
  - claims_share: >-
      K('refused_carry_share') if (refusals_in_year > 0 and settlements_life >= K('repeat_claim_count')) else
      (K('light_carry_share') if (refusals_in_year > 0 and settlements_life < K('repeat_claim_count')) else
      1.0)
  - result: RND(MX(0.0, standing_benefit * tenure_share * claims_share), 2)
  compute_basis:
    year_months_elapsed: >-
      Where the coverage grants its allowance afresh each year and an allowance entry stands inside the coverage
      year in progress, the allowance entries counted are those booked inside that coverage year; where the
      coverage grants its allowance afresh each year and no allowance entry stands inside the coverage year
      in progress, they are those booked in the twelve months to the handling date.
    grants_this_year: >-
      Where the coverage grants its allowance afresh each year and an allowance entry stands inside the coverage
      year in progress, the allowance entries counted are those booked inside that coverage year; where the
      coverage grants its allowance afresh each year and no allowance entry stands inside the coverage year
      in progress, they are those booked in the twelve months to the handling date.
    reinstates_annually: >-
      Where the coverage grants its allowance afresh each year and an allowance entry stands inside the coverage
      year in progress, the allowance entries counted are those booked inside that coverage year; where the
      coverage grants its allowance afresh each year and no allowance entry stands inside the coverage year
      in progress, they are those booked in the twelve months to the handling date.
    allowance_window_months: >-
      Where the coverage grants its allowance afresh each year and an allowance entry stands inside the coverage
      year in progress, the allowance entries counted are those booked inside that coverage year; where the
      coverage grants its allowance afresh each year and no allowance entry stands inside the coverage year
      in progress, they are those booked in the twelve months to the handling date.
    granted_in_window: >-
      The benefit standing on the plan is the allowance entries booked to it over the whole time it has been
      in force, less the benefit consumed.
    settlements_in_year: >-
      Where a settlement stands on the plan in the twelve months to the handling date and an allowance entry
      stands inside the coverage year in progress, the benefit consumed is instead the benefit taken by the
      settlements booked since that allowance entry; where a settlement stands in those twelve months and
      no allowance entry stands inside the coverage year in progress, it is the benefit taken by the settlements
      booked in those twelve months.
    last_grant_months: >-
      Where a settlement stands on the plan in the twelve months to the handling date and an allowance entry
      stands inside the coverage year in progress, the benefit consumed is instead the benefit taken by the
      settlements booked since that allowance entry; where a settlement stands in those twelve months and
      no allowance entry stands inside the coverage year in progress, it is the benefit taken by the settlements
      booked in those twelve months.
    consumed_benefit: >-
      Where a settlement stands on the plan in the twelve months to the handling date and an allowance entry
      stands inside the coverage year in progress, the benefit consumed is instead the benefit taken by the
      settlements booked since that allowance entry; where a settlement stands in those twelve months and
      no allowance entry stands inside the coverage year in progress, it is the benefit taken by the settlements
      booked in those twelve months.
    standing_benefit: >-
      The benefit standing on the plan is the allowance entries booked to it over the whole time it has been
      in force, less the benefit consumed.
    tenure_years: >-
      Where the plan has been in force beyond the long-tenure threshold in whole years, the whole of the benefit
      standing carries across; where it has been in force beyond the mid-tenure threshold but not beyond the
      long-tenure threshold, the mid-tenure share carries across.
    tenure_share: >-
      Where the plan has been in force beyond the long-tenure threshold in whole years, the whole of the benefit
      standing carries across; where it has been in force beyond the mid-tenure threshold but not beyond the
      long-tenure threshold, the mid-tenure share carries across.
    refusals_in_year: >-
      Where a refusal entry stands on the plan in the twelve months to the handling date and two or more settlement
      entries stand on it over its life, the refused-claim share of what would otherwise carry across is carried;
      where a refusal entry stands in those twelve months and fewer than two settlement entries stand over
      its life, the lighter share is carried.
    settlements_life: >-
      Where a refusal entry stands on the plan in the twelve months to the handling date and two or more settlement
      entries stand on it over its life, the refused-claim share of what would otherwise carry across is carried;
      where a refusal entry stands in those twelve months and fewer than two settlement entries stand over
      its life, the lighter share is carried.
    claims_share: >-
      Where a refusal entry stands on the plan in the twelve months to the handling date and two or more settlement
      entries stand on it over its life, the refused-claim share of what would otherwise carry across is carried;
      where a refusal entry stands in those twelve months and fewer than two settlement entries stand over
      its life, the lighter share is carried.
    result: >-
      The tenure share and the claims share both act on the benefit standing, one after the other, and what
      carries across is never below zero. The figure carried across is rounded to two decimal places once
      at the end.
  factors:
  - id: allowance_entries_window
    effect: method
    decides: allowance_window_months
    bindings:
    - grants_this_year
    - reinstates_annually
    - allowance_window_months
    ladder:
    - when: >-
        the coverage grants its allowance afresh each year and an allowance entry stands on the plan inside
        the coverage year in progress
      method: the allowance entries counted are those booked inside that coverage year
    - when: >-
        the coverage grants its allowance afresh each year and no allowance entry stands on the plan inside
        the coverage year in progress
      method: the allowance entries counted are those booked in the twelve months to the handling date
    - when: otherwise
      method: >-
        the allowance entries counted are those booked over the whole time the plan has been in force
    baseline:
      allowance_window_months: MONTHS(F('effective_date'), NOW) + 1
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: consumed_benefit_basis
    effect: method
    decides: consumed_benefit
    bindings:
    - settlements_in_year
    - last_grant_months
    - consumed_benefit
    ladder:
    - when: >-
        a settlement entry stands on the plan in the twelve months to the handling date and an allowance entry
        stands inside the coverage year in progress
      method: >-
        the benefit consumed is the benefit taken by the settlements booked since that allowance entry
    - when: >-
        a settlement entry stands in those twelve months and no allowance entry stands inside the coverage
        year in progress
      method: the benefit consumed is the benefit taken by the settlements booked in those twelve months
    - when: otherwise
      method: the benefit consumed is the benefit taken by every settlement booked to the plan
    baseline:
      consumed_benefit: ABS(SUM('protection_ledger','amount', event_type='protection_claim_settled'))
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: tenure_carry_share
    effect: parameter
    decides: tenure_share
    bindings:
    - tenure_years
    - tenure_share
    ladder:
    - when: >-
        the whole years the plan has been in force stand above the long-tenure threshold the coverage sets
      value: the whole of the benefit standing
    - when: >-
        those whole years stand above the mid-tenure threshold but not above the long-tenure threshold
      value: the mid-tenure share of the benefit standing
    - when: otherwise
      value: the new-plan share of the benefit standing
    baseline:
      tenure_share: K('new_tenure_share')
    evidence:
    - date
    cross_difficulty: null
  - id: claims_carry_share
    effect: parameter
    decides: claims_share
    bindings:
    - refusals_in_year
    - settlements_life
    - claims_share
    ladder:
    - when: >-
        a refusal entry stands on the plan in the twelve months to the handling date and two or more settlement
        entries stand on it over its life
      value: the refused-claim share of what would otherwise carry across
    - when: >-
        a refusal entry stands in those twelve months and fewer than two settlement entries stand on the plan
        over its life
      value: the lighter share of what would otherwise carry across
    - when: otherwise
      value: the whole of what would otherwise carry across
    baseline:
      claims_share: '1.0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: >-
      The benefit standing on the plan is the allowance entries booked to it over the whole time it has been
      in force, less the benefit consumed. The benefit consumed is the benefit taken by every settlement booked
      to the plan. The new-plan share of the benefit standing carries across. What carries across is not reduced
      for the claims answered on the plan. The tenure share and the claims share both act on the benefit standing,
      one after the other, and what carries across is never below zero. The figure carried across is rounded
      to two decimal places once at the end.
    params:
    - new_tenure_share
  inputs:
    history:
    - table: protection_ledger
      aggregate: sum
      field: amount
      within_months: 6
      filters:
        event_type: protection_allowance_reinstated
    - table: protection_ledger
      aggregate: count
      field: protection_entry_id
      within_months: 12
      filters:
        event_type: protection_claim_settled
    - table: protection_ledger
      aggregate: count
      field: protection_entry_id
      within_months: 12
      filters:
        event_type: protection_claim_denied
    cross_category: []
