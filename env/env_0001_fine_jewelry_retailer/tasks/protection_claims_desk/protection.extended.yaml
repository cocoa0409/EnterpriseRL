# Product charter: Belrose Jewelry Protection and Care Plans
category: protection
display_name: Belrose Jewelry Protection and Care Plans
binding:
  holding_table: protection_plans
  event_tables:
  - protection_ledger
  intake_tables:
  - protection_intake
  status_field: status
  variant_field: variant_name
  quantity_fields:
    remaining_benefit_allowance: benefit_allowance
    premium_paid_to_date: premium_account
lifecycle:
  states:
  - quoted
  - active
  - inspection_overdue
  - suspended
  - exhausted
  - expired
  - cancelled
  - transferred
  transitions:
  - from: quoted
    to: active
    by: agent
    means: the plan was bought and coverage began
  - from: quoted
    to: cancelled
    by: user
    means: the customer declined the quoted coverage
  - from: active
    to: inspection_overdue
    by: system
    means: the required inspection was not logged by its due date
  - from: inspection_overdue
    to: active
    by: agent
    means: an inspection was logged inside the restoration window and coverage resumed
  - from: active
    to: suspended
    by: system
    means: a monthly premium went unpaid past the suspension threshold
  - from: inspection_overdue
    to: suspended
    by: system
    means: the inspection grace ran out and coverage was suspended
  - from: suspended
    to: active
    by: agent
    means: the arrears or the missed inspection were put right and coverage resumed
  - from: active
    to: exhausted
    by: system
    means: the benefit allowance was fully consumed by settled claims
  - from: active
    to: expired
    by: system
    means: the coverage term ran out
  - from: inspection_overdue
    to: expired
    by: system
    means: the coverage term ran out while the inspection was outstanding
  - from: suspended
    to: expired
    by: system
    means: the coverage term ran out while coverage was suspended
  - from: exhausted
    to: expired
    by: system
    means: the coverage term ran out after the allowance had been consumed
  - from: active
    to: cancelled
    by: user
    means: the customer cancelled the plan and took the refund due
  - from: active
    to: transferred
    by: user
    means: the customer transferred the plan with the piece to a new owner
accounts:
- key: benefit_allowance
  unit: USD
  meaning: how much benefit this plan still has available to settle claims with, granted when coverage begins and again on each anniversary where the plan reinstates, and consumed by each settlement
- key: premium_account
  unit: USD
  meaning: what the customer has paid toward this plan, increased by each premium received and decreased by each refund returned to them
parameter_schema:
  coverage_term_months: length of the coverage term in whole months counted from the effective date; integer, 0 where coverage does not run to a fixed term
  coverage_is_lifetime: whether coverage runs for as long as the customer owns the piece rather than to a fixed expiry; boolean
  plan_price_pct_of_item_value: price of the plan as a percentage of the pre-tax price the covered item sold at
  minimum_item_value: smallest pre-tax item price this coverage may be written on, in USD
  maximum_item_value: largest pre-tax item price this coverage may be written on, in USD
  purchase_window_days: calendar days after the sale of the item within which this coverage may still be bought; integer
  waiting_period_days: calendar days between the purchase of the plan and the day coverage begins; integer
  deductible_per_claim: what the customer pays out of pocket on each accepted claim, in USD
  annual_benefit_allowance: benefit available for settlements in one coverage year, in USD
  lifetime_benefit_allowance: benefit available for settlements over the whole life of the plan, in USD
  allowance_reinstates_annually: whether the annual allowance is granted afresh on each coverage anniversary; boolean
  claims_per_12_months_cap: largest number of claims that may be settled in a rolling twelve months; integer
  claims_lifetime_cap: largest number of claims that may be settled over the whole life of the plan; integer
  inspection_interval_months: whole months between required inspections of the covered piece; integer
  inspection_grace_days: calendar days past the inspection due date during which coverage is still treated as in force; integer
  inspection_channels: where an inspection may be logged for it to count; list of channel values
  missed_inspection_suspends_coverage: whether coverage is suspended once the inspection grace has run out; boolean
  inspection_restoration_window_days: calendar days after suspension within which a logged inspection restores coverage without re-underwriting; integer
  covered_perils: the perils this coverage answers for; list of peril values
  excluded_perils: the perils this coverage never answers for; list of peril values
  stone_loss_covered: whether a stone lost from its setting is covered; boolean
  mysterious_disappearance_covered: whether a piece that simply cannot be found is covered; boolean
  theft_covered: whether theft of the covered piece is covered; boolean
  rhodium_replating_per_12_months: number of rhodium replatings included in a rolling twelve months; integer
  resizing_included_per_12_months: number of ring resizings included in a rolling twelve months; integer
  refinishing_included_per_12_months: number of polish-and-refinish services included in a rolling twelve months; integer
  chain_repair_included: whether chain and solder repairs are included without a claim; boolean
  clasp_replacement_included: whether clasp replacement is included without a claim; boolean
  loaner_provided: whether a loaner piece is offered while the covered piece is at the workshop; boolean
  turnaround_target_business_days: business days the workshop targets for covered bench work; integer
  expedited_service_available: whether expedited workshop handling may be requested under this coverage; boolean
  replacement_basis: 'how a total loss is answered: repair_first, like_kind_replacement or cash_settlement; enum'
  replacement_value_basis: 'what a replacement is valued at: original_purchase_price or current_retail_replacement; enum'
  depreciation_pct_per_year: annual reduction applied to the settled value of the covered piece, as a percentage
  settlement_cap_pct_of_item_value: ceiling on any one settlement as a percentage of the item value recorded at purchase
  cancellation_refund_full_window_days: calendar days after purchase within which the whole premium is returned; integer
  cancellation_refund_prorated: whether the premium is returned in proportion to the unused term after the full-refund window; boolean
  cancellation_admin_fee: fee deducted from a prorated premium refund, in USD
  transfer_allowed: whether the plan may be transferred with the piece to a new owner; boolean
  transfer_fee: fee charged to transfer the plan, in USD
  transfer_requires_inspection: whether an inspection must be logged before a transfer takes effect; boolean
  plan_renewable: whether the coverage may be renewed at the end of its term; boolean
  renewal_window_days_before_expiry: calendar days before expiry within which renewal may be arranged; integer
  renewal_price_uplift_pct: increase applied to the premium on renewal, as a percentage
  proof_of_loss_required_days: calendar days from the loss within which the customer must give their account of it; integer
  police_report_required_for_theft: whether a police report reference must be recorded before a theft claim is settled; boolean
  max_plans_per_item: how many plans of this coverage may stand on one covered item at once; integer
  premium_payment_schedule: 'how the premium is collected: single_payment or monthly; enum'
  premium_late_grace_days: calendar days a monthly premium may be late before coverage is at risk; integer
  premium_missed_days_to_suspension: calendar days of unpaid premium after which coverage is suspended; integer
  appraisal_required_above_value: item value above which a current appraisal must be on file before coverage is written, in USD
  bench_referral_required_for_claim: whether an accepted claim must be sent to the workshop on a bench work order rather than settled at the counter; boolean
  trade_up_preserves_plan: whether the coverage carries over when the covered piece is traded up; boolean
  premium_may_be_financed: whether the premium may be added to a promotional financing plan; boolean
  minimum_days_between_claims: calendar days that must pass between one settled claim and the next on the same plan; integer
  documentation_retention_years: whole years claim documentation is retained for; integer
  goodwill_service_visits_per_12_months: number of out-of-scope service visits handled as goodwill in a rolling twelve months; integer
