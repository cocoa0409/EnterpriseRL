  baseline:
    rule: >-
      The benefit granted afresh for a coverage year is the yearly benefit allowance the coverage sets for
      the piece. What the plan drew in the coverage year just ended is the benefit consumed by the settlements
      booked to it in the twelve months to the handling date. The whole of that yearly benefit allowance is
      granted. The grant is not reduced for the time that has passed since the anniversary. The grant is not
      reduced for the inspections logged in the year. The grant carries no membership uplift. What is granted
      is limited to what is left of the coverage's lifetime benefit ceiling after the allowance entries already
      booked to the plan, and nothing unused in the coverage year just ended carries forward. The shares and
      the uplift all act on the yearly benefit allowance, one after another and each on the figure the one
      before it left, and the lifetime ceiling is applied only to the figure they leave. The amount granted
      is rounded to two decimal places once at the end.
    params:
    - annual_benefit_allowance
    - lifetime_benefit_allowance
    - coverage_year_months
