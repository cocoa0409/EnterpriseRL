    - inspection_share
    ladder:
    - when: >-
        fewer inspection entries stand on the plan in the twelve months to the handling date than the coverage's
        inspection interval calls for and the most recent of them falls within that interval
      value: the lapsed-year share
    - when: >-
        fewer inspection entries stand in that period than the interval calls for and the most recent of them
        falls outside that interval
      value: the unrestored-year share
    - when: otherwise
      value: the whole grant, unreduced
    baseline:
      inspection_share: '1.0'
