- id: tradein_ext_upgrade_minimum_spend
  base_policy_refs:
  - tradein_registration_eligibility
  - tradein_estate_purchase
  - tradein_redemption
  overwrite:
  - base_policy: tradein_redemption
    superseded_clause: Credit is spent only against a new piece costing at least the programme's multiple of the
      credit, and on the programmes that also require an uplift, at least that much more than the piece traded
      originally sold for.
    replaced_by: The least the customer must spend is the credit standing on the registration taken at the multiple
      the programme publishes, raised by the amount the traded piece has gained taken at the uplift the programme
      publishes, and reduced by what has already been met from the registration's credit.
  trigger: state_due
  subject:
  - tradein_registration_updated
  computes: upgrade_minimum_spend
  target_tool: update_upgrade_minimum_spend_70148cfb
  params:
    multiple_preferred: 1.4
    multiple_member: 1.75
    spend_preferred: 50000.0
    spend_member: 20000.0
    uplift_long_held: 75.0
    uplift_recent: 120.0
    long_held_days: 1825
    met_share_pct: 25.0
    met_half: 0.5
  rule: 'The least the customer must spend, printed on the registration as the smallest price a new piece may
    carry for its credit to be usable, is kept in step with the credit the registration actually carries. The
    least the customer must spend is fixed only after the registration''s entries carry every upward revaluation
    of the credit that the programme''s window still admits. The least the customer must spend is the credit standing
    on the registration taken at the multiple the programme publishes, raised by the amount the traded piece has
    gained taken at the uplift the programme publishes, and reduced by what has already been met from the registration''s
    credit. The credit standing is read as the sum of the credit entries booked to the registration, revaluations
    included. Where a spend stands among the registration''s entries and the programme allows the credit to be
    spent in parts, the credit standing is instead read as the sum of every entry booked to the registration that
    moves the credit, spends included; and where a spend stands among those entries and the programme does not
    allow the credit to be spent in parts, it is read as the credit the registration shows as issued. An entry
    moves the credit where it books the credit, revalues it upward, spends it or takes it away; a valuation entry
    and an inspection entry move nothing, whatever amount they carry. That figure taken at the programme''s multiple,
    rounded to two decimal places, is the credit leg. Where the customer''s membership stands above Belrose Circle
    Gold and their lifetime qualifying spend reaches fifty thousand, the multiple is one and two fifths; where
    their membership stands at Belrose Circle Gold and their lifetime qualifying spend reaches twenty thousand,
    the multiple is one and three quarters; otherwise the multiple is the one the programme publishes for an upgrade.
    The gain is the amount by which the price the piece originally sold for exceeds the credit standing, and where
    it does not exceed it the gain is nothing; that gain taken at the programme''s uplift, rounded to two decimal
    places, is the uplift leg. Where the registration''s own entries carry a valuation of the piece above the
    price it originally sold for and the chain sold the piece, the gain is measured from the highest valuation
    those entries carry rather than from the price it originally sold for; and where those entries carry such
    a valuation but the chain did not sell the piece, the gain is measured from the credit standing itself, so
    that no gain arises. Where the customer has owned the piece for at least five years and the chain sold it,
    the uplift is seventy-five percent; where the customer has owned it for less than five years and the chain
    sold it, the uplift is one hundred and twenty percent; otherwise the uplift is the one the programme publishes.
    No part of the figure is treated as already met from the registration''s credit. Where the spends booked to
    the registration come to at least a quarter of the credit it shows as issued and the programme allows the
    credit to be spent in parts, the whole of what has been spent is treated as already met; and where those spends
    come to less than a quarter of the credit shown as issued and the programme allows the credit to be spent
    in parts, half of what has been spent is treated as already met. The two legs are added, what has already
    been met is taken off, the figure is not taken below nothing, and the result is rounded to two decimal places
    at that final step only.

    '
  prerequisite:
  - problem: tradein_ext_credit_revaluation
    kind: value_input
    gate: standing_all
    form: state
    policy_source: The least the customer must spend is fixed only after the registration's entries carry every
      upward revaluation of the credit that the programme's window still admits.
    condition: The registration's entries carry every upward revaluation the current appraised value supports
      while the programme's revaluation window is still open.
    resolved_by: apply_credit_revaluation_37908854
    effect: The credit standing read from the registration's entries rises by the revaluation booked, so the credit
      leg and the gain are both worked out on the larger figure.
  cross_category:
  - category: circle
    as: branch
    reads:
    - variant_name
    - lifetime_qualifying_spend
    note: the membership tier and the lifetime qualifying spend recorded on it decide which multiple the credit
      standing is taken at
  compute:
  - standing_all: SUM('tradein_ledger','amount', event_type='tradein_credit_granted') + SUM('tradein_ledger','amount',
      event_type='tradein_credit_revaluation_applied') + SUM('tradein_ledger','amount', event_type='tradein_credit_redeemed')
      + SUM('tradein_ledger','amount', event_type='tradein_credit_forfeited')
  - credit_booked: SUM('tradein_ledger','amount', event_type='tradein_credit_granted') + SUM('tradein_ledger','amount',
      event_type='tradein_credit_revaluation_applied')
  - redemption_count: COUNT('tradein_ledger', event_type='tradein_credit_redeemed')
  - credit_base: standing_all if (redemption_count >= 1 and P('credit_partially_redeemable') == True) else (F('issued_credit_amount')
      if (redemption_count >= 1 and P('credit_partially_redeemable') == False) else credit_booked)
  - member_tier_name: CFIELD('circle','variant_name')
  - member_lifetime_spend: CFIELD('circle','lifetime_qualifying_spend')
  - multiple: K('multiple_preferred') if (member_tier_name != 'Belrose Circle Member' and member_tier_name !=
      'Belrose Circle Silver' and member_tier_name != 'Belrose Circle Gold' and member_lifetime_spend >= K('spend_preferred'))
      else (K('multiple_member') if (member_tier_name == 'Belrose Circle Gold' and member_lifetime_spend >= K('spend_member'))
      else P('minimum_upgrade_multiple'))
  - own_valuation: MAX('tradein_ledger','amount', event_type='tradein_item_valuation_logged')
  - price_base: own_valuation if (own_valuation > F('original_purchase_price') and F('original_sales_receipt_number')
      != '') else (credit_base if (own_valuation > F('original_purchase_price') and F('original_sales_receipt_number')
      == '') else F('original_purchase_price'))
  - ownership_days: DAYS(F('original_purchase_date'), NOW)
  - uplift_pct: K('uplift_long_held') if (ownership_days >= K('long_held_days') and F('original_sales_receipt_number')
      != '') else (K('uplift_recent') if (ownership_days < K('long_held_days') and F('original_sales_receipt_number')
      != '') else P('minimum_upgrade_spend_uplift_pct'))
  - spends_booked: ABS(SUM('tradein_ledger','amount', event_type='tradein_credit_redeemed'))
  - spend_already_met: spends_booked if (spends_booked >= RND(F('issued_credit_amount') * K('met_share_pct') /
      100.0, 2) and P('credit_partially_redeemable') == True) else (RND(spends_booked * K('met_half'), 2) if (spends_booked
      < RND(F('issued_credit_amount') * K('met_share_pct') / 100.0, 2) and P('credit_partially_redeemable') ==
      True) else 0.0)
  - credit_leg: RND(credit_base * multiple, 2)
  - uplift_leg: RND(MX(price_base - credit_base, 0.0) * uplift_pct / 100.0, 2)
  - result: RND(MX(credit_leg + uplift_leg - spend_already_met, 0.0), 2)
  compute_basis:
    standing_all: Where a spend stands among the registration's entries and the programme allows the credit to
      be spent in parts, the credit standing is instead read as the sum of every entry booked to the registration
      that moves the credit, spends included
    credit_booked: The credit standing is read as the sum of the credit entries booked to the registration, revaluations
      included.
    redemption_count: Where a spend stands among the registration's entries and the programme allows the credit
      to be spent in parts, the credit standing is instead read as the sum of every entry booked to the registration
      that moves the credit, spends included; and where a spend stands among those entries and the programme does
      not allow the credit to be spent in parts, it is read as the credit the registration shows as issued.
    credit_base: The credit standing is read as the sum of the credit entries booked to the registration, revaluations
      included. Where a spend stands among the registration's entries and the programme allows the credit to be
      spent in parts, the credit standing is instead read as the sum of every entry booked to the registration
      that moves the credit, spends included; and where a spend stands among those entries and the programme does
      not allow the credit to be spent in parts, it is read as the credit the registration shows as issued.
    member_tier_name: Where the customer's membership stands above Belrose Circle Gold and their lifetime qualifying
      spend reaches fifty thousand, the multiple is one and two fifths
    member_lifetime_spend: where their membership stands at Belrose Circle Gold and their lifetime qualifying
      spend reaches twenty thousand, the multiple is one and three quarters
    multiple: Where the customer's membership stands above Belrose Circle Gold and their lifetime qualifying spend
      reaches fifty thousand, the multiple is one and two fifths; where their membership stands at Belrose Circle
      Gold and their lifetime qualifying spend reaches twenty thousand, the multiple is one and three quarters;
      otherwise the multiple is the one the programme publishes for an upgrade.
    own_valuation: Where the registration's own entries carry a valuation of the piece above the price it originally
      sold for and the chain sold the piece, the gain is measured from the highest valuation those entries carry
      rather than from the price it originally sold for
    price_base: Where the registration's own entries carry a valuation of the piece above the price it originally
      sold for and the chain sold the piece, the gain is measured from the highest valuation those entries carry
      rather than from the price it originally sold for; and where those entries carry such a valuation but the
      chain did not sell the piece, the gain is measured from the credit standing itself, so that no gain arises.
    ownership_days: Where the customer has owned the piece for at least five years and the chain sold it, the
      uplift is seventy-five percent
    uplift_pct: Where the customer has owned the piece for at least five years and the chain sold it, the uplift
      is seventy-five percent; where the customer has owned it for less than five years and the chain sold it,
      the uplift is one hundred and twenty percent; otherwise the uplift is the one the programme publishes.
    spends_booked: Where the spends booked to the registration come to at least a quarter of the credit it shows
      as issued and the programme allows the credit to be spent in parts, the whole of what has been spent is
      treated as already met
    spend_already_met: No part of the figure is treated as already met from the registration's credit. Where the
      spends booked to the registration come to at least a quarter of the credit it shows as issued and the programme
      allows the credit to be spent in parts, the whole of what has been spent is treated as already met; and
      where those spends come to less than a quarter of the credit shown as issued and the programme allows the
      credit to be spent in parts, half of what has been spent is treated as already met.
    credit_leg: That figure taken at the programme's multiple, rounded to two decimal places, is the credit leg.
    uplift_leg: The gain is the amount by which the price the piece originally sold for exceeds the credit standing,
      and where it does not exceed it the gain is nothing; that gain taken at the programme's uplift, rounded
      to two decimal places, is the uplift leg.
    result: The two legs are added, what has already been met is taken off, the figure is not taken below nothing,
      and the result is rounded to two decimal places at that final step only.
