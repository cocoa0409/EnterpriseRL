events:
- type: tradein_registration_opened
  target: tradein_credits
  mutation: create
  meaning: a piece is registered for trade-in at the counter and the upgrade record is opened
  grain: one row per piece registered for trade-in
  fields:
    customer_id: the customer trading the piece in
    variant_name: the upgrade programme the registration runs under
    status: the registration opens at registered
    credit_reference: the reference the customer is given
    original_item_sku: the piece being traded in
    original_sales_receipt_number: the till transaction it was originally sold on
    original_purchase_price: what it originally sold for
    original_purchase_date: when it was originally bought
    traded_item_description: how the customer described the piece
    traded_item_carat: the weight of its principal stone
    certificate_number: the laboratory certificate presented for the stone
    registered_date: the date it was registered
  triggers:
  - event: tradein:tradein_condition_inspection_logged
    map:
      tradein_credit_id: tradein_credit_id
      customer_id: customer_id
- type: tradein_valuation_requested
  target: tradein_credits
  mutation:
    transition:
      from: registered
      to: appraisal_pending
  meaning: the registered piece is sent for valuation and the record waits on the appraiser
  grain: one row per piece sent for valuation
  fields:
    status: the registration moves to appraisal pending
    appraisal_reference: the appraisal the piece was sent under
  triggers:
  - event: appraisal:appraisal_order_opened
    map:
      customer_id: customer_id
      appraisal_reference: appraisal_reference
- type: tradein_credit_issued
  target: tradein_credits
  mutation:
    transition:
      from: appraisal_pending
      to: credit_issued
  meaning: the valuation comes back and the upgrade credit is issued to the customer
  grain: one row per credit issued against one registration
  fields:
    status: the registration moves to credit issued
    appraised_value: what the appraiser valued the piece at
    issued_credit_amount: the credit issued
    condition_grade: the grade the piece was found at
    issued_date: the date the credit was issued
    expiry_date: the last day the credit may be spent
    upgrade_minimum_spend: the least the customer must spend for this credit to be spendable
  triggers:
  - event: tradein:tradein_credit_granted
    map:
      tradein_credit_id: tradein_credit_id
      customer_id: customer_id
- type: tradein_item_rejected
  target: tradein_credits
  mutation:
    transition:
    - from: registered
      to: revoked
    - from: appraisal_pending
      to: revoked
  meaning: the piece is refused, either at the counter or after valuation, and no credit is issued
  grain: one row per piece refused
  fields:
    status: the registration is revoked
    condition_grade: the grade the piece was found at
    closed_date: the date the refusal was recorded
  triggers: []
- type: tradein_credit_partially_spent
  target: tradein_credits
  mutation:
    transition:
      from: credit_issued
      to: partially_redeemed
  meaning: part of the credit is spent against a new piece and the rest stays available
  grain: one row per partial spend of one credit
  fields:
    status: the registration moves to partially redeemed
    remaining_credit: what is left of the credit
    redemption_receipt_number: the till transaction the credit was spent on
  triggers: []
- type: tradein_credit_fully_spent
  target: tradein_credits
  mutation:
    transition:
    - from: credit_issued
      to: redeemed
    - from: partially_redeemed
      to: redeemed
  meaning: the whole of the credit is spent and the registration closes
  grain: one row per credit spent to nothing
  fields:
    status: the registration closes as redeemed
    remaining_credit: zero, because the credit is spent
    redemption_receipt_number: the till transaction the credit was spent on
    closed_date: the date the credit was fully spent
  triggers: []
- type: tradein_credit_expired
  target: tradein_credits
  mutation:
    transition:
    - from: credit_issued
      to: expired
    - from: partially_redeemed
      to: expired
  meaning: the credit reaches its expiry with something still unspent
  grain: one row per credit reaching expiry unspent
  fields:
    status: the registration closes as expired
    closed_date: the date the credit expired
  triggers:
  - event: tradein:tradein_credit_forfeited
    map:
      tradein_credit_id: tradein_credit_id
      customer_id: customer_id
      forfeit_reason_code: credit_expired
- type: tradein_credit_revoked
  target: tradein_credits
  mutation:
    transition:
      from: credit_issued
      to: revoked
  meaning: the credit is withdrawn because the customer took the traded piece back
  grain: one row per credit withdrawn on the return of the traded piece
  fields:
    status: the registration is revoked
    closed_date: the date the credit was withdrawn
    remaining_credit: the credit withdrawn
  triggers: []
- type: tradein_registration_updated
  target: tradein_credits
  mutation: update
  meaning: a detail of a live registration is corrected without moving its lifecycle state
  grain: one row per correction made to one registration
  fields:
    traded_item_description: how the piece reads on the registration
    traded_item_carat: the weight recorded for its stone
    certificate_number: the certificate recorded for the stone
    appraisal_reference: the appraisal the valuation rests on
    expiry_date: the last day the credit may be spent
    upgrade_minimum_spend: the least the customer must spend
  triggers: []
- type: tradein_credit_granted
  target: tradein_ledger
  meaning: the issued credit is booked as available to spend
  grain: one row per credit booked against one registration
  distinguish_by:
  - posted_date
  - amount
  - valuation_basis
  fields:
    tradein_credit_id: the registration credited
    customer_id: the customer the credit belongs to
    event_type: the family this entry belongs to
    posted_date: the date the credit was booked
    amount: the credit booked, positive
    valuation_basis: the basis the credit was worked out on
    condition_grade: the grade the valuation was made at
    appraiser_code: the appraiser who valued the piece
    certificate_number: the certificate the valuation rests on
    billing_period: the period the credit is accounted to
  account: upgrade_credit
  direction: in
  triggers: []
- type: tradein_credit_revaluation_applied
  target: tradein_ledger
  meaning: an issued credit is revalued upward before it is spent
  grain: one row per revaluation of one issued credit
  distinguish_by:
  - source_entry_id
  - posted_date
  fields:
    tradein_credit_id: the registration revalued
    customer_id: the customer the credit belongs to
    event_type: the family this entry belongs to
    posted_date: the date of the revaluation
    amount: the increase in credit, positive
    valuation_basis: the basis the revaluation was made on
    appraiser_code: the appraiser who revalued the piece
    source_entry_id: the credit entry being revalued
    billing_period: the period the revaluation is accounted to
  account: upgrade_credit
  direction: in
  triggers: []
- type: tradein_credit_redeemed
  target: tradein_ledger
  meaning: credit is spent against a new piece at the till
  grain: one row per credit spend against one sale
  distinguish_by:
  - redemption_receipt_number
  - redeemed_item_sku
  - posted_date
  fields:
    tradein_credit_id: the registration spent from
    customer_id: the customer spending the credit
    event_type: the family this entry belongs to
    posted_date: the date the credit was spent
    amount: the credit spent, negative
    redemption_receipt_number: the till transaction the credit was spent on
    redeemed_item_sku: the new piece it was spent against
    billing_period: the period the spend is accounted to
  account: upgrade_credit
  direction: out
  triggers: []
- type: tradein_credit_forfeited
  target: tradein_ledger
  meaning: credit is taken away because it expired or because the trade fell through
  grain: one row per credit taken away for one reason
  distinguish_by:
  - forfeit_reason_code
  - posted_date
  - source_entry_id
  fields:
    tradein_credit_id: the registration the credit is taken from
    customer_id: the customer the credit belonged to
    event_type: the family this entry belongs to
    posted_date: the date the credit was taken away
    amount: the credit taken away, negative
    forfeit_reason_code: why the credit was taken away
    source_entry_id: the credit entry being taken away
    billing_period: the period the forfeit is accounted to
  account: upgrade_credit
  direction: out
  triggers: []
- type: tradein_item_valuation_logged
  target: tradein_ledger
  meaning: the appraiser's valuation of the traded piece is recorded
  grain: one row per valuation made of one traded piece
  distinguish_by:
  - posted_date
  - appraiser_code
  - valuation_basis
  fields:
    tradein_credit_id: the registration valued
    customer_id: the customer trading the piece in
    event_type: the family this entry belongs to
    posted_date: the date of the valuation
    amount: the value the appraiser arrived at, positive
    valuation_basis: the basis the valuation was made on
    appraiser_code: the appraiser who made it
    certificate_number: the certificate the valuation rests on
    billing_period: the period it is accounted to
  triggers: []
- type: tradein_condition_inspection_logged
  target: tradein_ledger
  meaning: the traded piece is inspected and its condition grade is recorded
  grain: one row per condition inspection of one traded piece
  distinguish_by:
  - posted_date
  - appraiser_code
  fields:
    tradein_credit_id: the registration inspected
    customer_id: the customer trading the piece in
    event_type: the family this entry belongs to
    posted_date: the date of the inspection
    amount: zero, because an inspection moves no money
    condition_grade: the grade the piece was found at
    appraiser_code: the appraiser who inspected it
    billing_period: the period the inspection is accounted to
  triggers: []
measures:
- id: tradein_msr_live_credits
  window: as at the handling date, with no look-back
  measure: count of trade-in registrations of this customer standing at registered, appraisal_pending, credit_issued
    or partially_redeemed
- id: tradein_msr_credit_spent
  window: the whole life of the registration, from the day the credit was issued to the handling date
  measure: sum of the absolute amount of tradein_credit_redeemed entries booked to this registration
- id: tradein_msr_days_since_issue
  window: from the issue date on the registration to the handling date
  measure: count of whole calendar days elapsed since the credit was issued, with no upper bound
- id: tradein_msr_ownership_days
  window: from the original purchase date on the registration to the handling date
  measure: count of whole calendar days the customer has owned the traded piece, with no upper bound
policies:
- id: tradein_agg_multi_holding
  subject:
  - tradein_registration_opened
  rule: Each programme caps how many live upgrade credits one customer may hold under it at once, and a credit
    counts as live while the registration stands at registered, appraisal pending, credit issued or partially
    redeemed. A further registration is opened for a customer only when no registration already recorded against
    the same credit reference stands at registered, appraisal pending, credit issued or partially redeemed. A
    registration that has been fully spent, has expired or has been revoked no longer counts, so the customer
    may register another piece once one of theirs closes.
  eligibility:
  - id: no_live_registration_on_reference
    applies_to:
    - tradein_registration_opened
    kind: dedup
    condition: A further registration is opened for a customer only when no registration already recorded against
      the same credit reference stands at registered, appraisal pending, credit issued or partially redeemed.
    evidence_fields:
    - tradein_credits.credit_reference
    - tradein_credits.status
    - tradein_credits.customer_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - tradein_credits.credit_reference
      action_bindings:
        tradein_credits.credit_reference: credit_reference
    dedup_contract:
      table: tradein_credits
      mode: separate_record
      object_bindings:
        credit_reference: credit_reference
      duplicate_filters:
        status:
        - registered
        - appraisal_pending
        - credit_issued
        - partially_redeemed
      distinct_fields:
      - registered_date
      - variant_name
  params:
    max_per_customer: 4
    per_tier:
      Belrose Standard Trade-In:
        max_credits_per_customer: =max_credits_per_customer
      Diamond Trade-Up Guarantee:
        max_credits_per_customer: =max_credits_per_customer
      Bridal Upgrade Guarantee:
        max_credits_per_customer: =max_credits_per_customer
      Lifetime Diamond Upgrade Guarantee:
        max_credits_per_customer: =max_credits_per_customer
      Signature Collection Upgrade Privilege:
        max_credits_per_customer: =max_credits_per_customer
      Estate Purchase and Consignment Programme:
        max_credits_per_customer: =max_credits_per_customer
  measures:
  - tradein_msr_live_credits
- id: tradein_agg_credit_stacking
  subject:
  - tradein_credit_redeemed
  - tradein_credit_partially_spent
  - tradein_credit_fully_spent
  rule: Where a customer holds several credits, no more of them may be spent on one sale than the programme allows,
    and each credit is spent from its own registration. Credits from different programmes are never merged into
    one figure, and the customer chooses which to spend first when more than one could be spent. What has been
    spent from a credit is read as the sum of the spends booked to that registration, and the remaining credit
    is the credit issued less that sum plus any revaluation. Where the credits the customer wishes to spend exceed
    the programme's ceiling for one sale, the excess stays on its registration and may be spent on a later sale
    while it is still live.
  eligibility: []
  params:
    per_tier:
      Belrose Standard Trade-In:
        max_credits_per_purchase: =max_credits_per_purchase
        credit_partially_redeemable: =credit_partially_redeemable
        credit_combinable_with_promotions: =credit_combinable_with_promotions
      Diamond Trade-Up Guarantee:
        max_credits_per_purchase: =max_credits_per_purchase
        credit_partially_redeemable: =credit_partially_redeemable
        credit_combinable_with_promotions: =credit_combinable_with_promotions
      Bridal Upgrade Guarantee:
        max_credits_per_purchase: =max_credits_per_purchase
        credit_partially_redeemable: =credit_partially_redeemable
        credit_combinable_with_promotions: =credit_combinable_with_promotions
      Lifetime Diamond Upgrade Guarantee:
        max_credits_per_purchase: =max_credits_per_purchase
        credit_partially_redeemable: =credit_partially_redeemable
        credit_combinable_with_promotions: =credit_combinable_with_promotions
      Signature Collection Upgrade Privilege:
        max_credits_per_purchase: =max_credits_per_purchase
        credit_partially_redeemable: =credit_partially_redeemable
        credit_combinable_with_promotions: =credit_combinable_with_promotions
      Estate Purchase and Consignment Programme:
        max_credits_per_purchase: =max_credits_per_purchase
        credit_partially_redeemable: =credit_partially_redeemable
        credit_combinable_with_promotions: =credit_combinable_with_promotions
  formula:
    remaining_credit_after_spend: remaining_credit + amount
  measures:
  - tradein_msr_credit_spent
- id: tradein_registration_eligibility
  subject:
  - tradein_registration_opened
  - tradein_item_rejected
  - tradein_registration_updated
  rule: 'A piece is taken in for trade only where the programme''s conditions on its origin are met: the programmes
    that require it take only pieces the chain itself sold, evidenced by the original sales receipt. A piece is
    registered for trade only when the customer has owned it for at least the programme''s minimum holding period
    in calendar days, counted from the date the traded piece was originally bought. The holding period is counted
    in whole calendar days from the day of the original purchase, that day counting as day zero, weekends and
    store holidays included, and part days are never rounded up. The customer must show that the piece is theirs
    before it is taken in, and their saying it is theirs is not that showing. Where the programme requires a laboratory
    certificate, it must be one of the laboratories the programme accepts, and the certificate number must match
    the stone presented. A piece the programme will not take is refused at the counter and the registration is
    closed as revoked, with the piece handed straight back.'
  eligibility:
  - id: minimum_holding_period
    applies_to:
    - tradein_registration_opened
    kind: time
    condition: A piece is registered for trade only when the customer has owned it for at least the programme's
      minimum holding period in calendar days, counted from the date the traded piece was originally bought.
    evidence_fields:
    - tradein_credits.original_purchase_date
    - tradein_credits.credit_reference
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - tradein_credits.credit_reference
      action_bindings:
        tradein_credits.credit_reference: credit_reference
    temporal_basis:
      clock: frozen_time
      anchor_event: the date the traded piece was originally bought
      anchor_source: tradein_credits.original_purchase_date
      relation: not_before
      duration_source: variants.minimum_holding_period_days
      unit: calendar_days
      counting_rule: The holding period is counted in whole calendar days from the day of the original purchase,
        that day counting as day zero, weekends and store holidays included, and part days are never rounded up.
      boundary: inclusive
  - id: proof_of_ownership
    applies_to:
    - tradein_registration_opened
    kind: authorization
    condition: The customer must show that the piece is theirs before it is taken in, and their saying it is theirs
      is not that showing.
    evidence_fields:
    - tradein_credits.original_sales_receipt_number
    - tradein_credits.credit_reference
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - tradein_credits.credit_reference
      action_bindings:
        tradein_credits.credit_reference: credit_reference
  params:
    per_tier:
      Belrose Standard Trade-In:
        original_purchase_must_be_belrose: =original_purchase_must_be_belrose
        minimum_original_purchase_price: =minimum_original_purchase_price
