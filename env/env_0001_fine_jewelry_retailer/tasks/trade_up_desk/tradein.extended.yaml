- id: tradein_ext_item_valuation
  base_policy_refs:
  - tradein_valuation
  - tradein_condition_grading
  overwrite:
  - base_policy: tradein_condition_grading
    superseded_clause: The valuation is reduced by the programme's deduction for the grade the piece was found
      at, and where the deduction is the whole of the valuation no credit is issued.
    replaced_by: 'That figure is reduced by the deduction the desk publishes for the grade the registration''s
      entries record: six percent where an inspection stands among those entries and the later of them grades
      the piece good, twenty percent where an inspection stands among them and the later of them grades the piece
      fair, and nothing where no inspection stands among them or they grade it otherwise'
  - base_policy: tradein_valuation
    superseded_clause: Where no accepted certificate is presented the valuation is reduced by the programme's
      missing-certificate deduction, and on the programmes where that deduction is the whole of the valuation
      the piece is refused rather than valued down to nothing.
    replaced_by: Where a certificate stands on the registration and the report the appraisal register carries
      for the piece names a laboratory, nothing is deducted for the certificate; where a certificate stands but
      that report names no laboratory, ten percent is deducted; and where no certificate stands on the registration
      at all, the deduction is the one the programme publishes for a missing certificate.
  - base_policy: tradein_valuation
    superseded_clause: on the programmes that credit the stone alone the mounting is valued at nothing
    replaced_by: The valuation is taken on the piece as a whole, stone and mounting together, as the appraisal
      register values it.
  trigger: state_due
  subject:
  - tradein_item_valuation_logged
  computes: valuation_amount
  target_tool: log_item_valuation_6ae79dd2
  params:
    deduction_good: 6.0
    deduction_fair: 20.0
    cert_unconfirmed_pct: 10.0
    upkeep_recent_months: 12
    upkeep_lapsed_months: 24
    upkeep_full: 1.0
    upkeep_partial: 0.95
    upkeep_lapsed: 0.9
    ceiling_recent: 45000.0
    ceiling_outside: 15000.0
    long_held_days: 1825
    premium_large_certified: 8.0
    premium_large_plain: 3.0
    large_stone_carat: 1.5
    premium_declared_floor: 20000.0
  rule: 'The valuation booked against a trade-in registration is what the traded piece is worth to the chain on
    the day it is recorded, and it is worked out as follows. The valuation is taken on the piece as a whole, stone
    and mounting together, as the appraisal register values it. The valuation rests on the price the piece originally
    sold for. Where the appraisal register carries a value for the piece from a report issued within the programme''s
    appraisal validity window and that value stands above the price the piece originally sold for, the valuation
    rests instead on the highest value the register carries for the piece; and where the register carries a value
    for the piece only from a report issued longer ago than that window, it rests on the value the most recent
    of those reports states. No deduction is made for the grade the piece was found at. That figure is reduced
    by the deduction the desk publishes for the grade the registration''s entries record: six percent where an
    inspection stands among those entries and the later of them grades the piece good, twenty percent where an
    inspection stands among them and the later of them grades the piece fair, and nothing where no inspection
    stands among them or they grade it otherwise; the grade the entries record stands over any grade carried elsewhere
    on the file. The figure so reduced is then reduced again for the papers on the stone, by the deduction the
    programme publishes where no certificate it accepts stands on the registration. Where a certificate stands
    on the registration and the report the appraisal register carries for the piece names a laboratory, nothing
    is deducted for the certificate; where a certificate stands but that report names no laboratory, ten percent
    is deducted; and where no certificate stands on the registration at all, the deduction is the one the programme
    publishes for a missing certificate. Nothing is added for the stone''s weight. Where the principal stone weighs
    at least one and a half carats and the report the register carries for the piece declares it at twenty thousand
    or more, eight percent is added; and where the principal stone weighs at least one and a half carats and that
    report declares it at less than twenty thousand, three percent is added. The figure is then taken at nine
    tenths. Where the piece is covered by a plan in force and an inspection has been logged against it within
    the last twelve months, the figure stands as worked out; where the piece is covered by a plan in force and
    the last inspection logged against it is more than twelve but not more than twenty-four months old, the figure
    is taken at nineteen twentieths; and otherwise it is taken at nine tenths. The valuation is never taken above
    fifteen thousand. Where the chain sold the piece and the customer has held it for at least five years, the
    valuation is held instead to the largest amount the programme answers for while a piece is in its care; and
    where the chain sold the piece and the customer has held it for less than five years, it is held to forty-five
    thousand. The order is fixed: the figure the valuation rests on is taken first, the grade deduction is applied
    to it, the certificate deduction is applied to the result of that, the weight addition is applied to the result
    of that, the upkeep treatment is applied to the result of that, and the ceiling is applied last. Each of those
    steps is rounded to two decimal places as it is taken.

    '
  prerequisite: []
  cross_category:
  - category: appraisal
    as: history
    reads:
    - appraisal_ledger.amount
    - appraisal_ledger.event_type
    - issued_date
    - laboratory_code
    - declared_value
    note: the appraisal register gives the value the valuation rests on, the age of the report it comes from,
      whether that report names a laboratory and the value it declares for the piece
  - category: protection
    as: branch
    reads:
    - status
    - last_inspection_date
    note: whether the traded piece is covered and how recently it was inspected decides the upkeep treatment of
      the figure
  compute:
  - register_high_value: XMAX('appraisal','appraisal_ledger','amount', event_type='appraisal_valuation_recorded',
      item_sku=F('original_item_sku'))
  - register_latest_value: XLATEST('appraisal','appraisal_ledger','amount', date_field='posted_date', event_type='appraisal_valuation_recorded',
      item_sku=F('original_item_sku'))
  - current_report_age_days: DAYS(CFIELD('appraisal','issued_date', item_sku=F('original_item_sku'), status='issued'),
      NOW)
  - base_value: register_high_value if (current_report_age_days <= P('appraisal_validity_days') and register_high_value
      > F('original_purchase_price')) else (register_latest_value if (current_report_age_days > P('appraisal_validity_days')
      and register_latest_value > 0) else F('original_purchase_price'))
  - inspections_logged: COUNT('tradein_ledger', event_type='tradein_condition_inspection_logged')
  - entry_grade: LATEST('tradein_ledger','condition_grade', date_field='posted_date', event_type='tradein_condition_inspection_logged')
  - grade_deduction_pct: K('deduction_good') if (inspections_logged >= 1 and entry_grade == 'good') else (K('deduction_fair')
      if (inspections_logged >= 1 and entry_grade == 'fair') else 0.0)
  - report_lab: CFIELD('appraisal','laboratory_code', item_sku=F('original_item_sku'), status='issued')
  - certificate_deduction_pct: 0.0 if (F('certificate_number') != '' and report_lab != 'none') else (K('cert_unconfirmed_pct')
      if (F('certificate_number') != '' and report_lab == 'none') else P('missing_certificate_deduction_pct'))
  - declared_report_value: CFIELD('appraisal','declared_value', item_sku=F('original_item_sku'), status='issued')
  - stone_premium_pct: K('premium_large_certified') if (F('traded_item_carat') >= K('large_stone_carat') and declared_report_value
      >= K('premium_declared_floor')) else (K('premium_large_plain') if (F('traded_item_carat') >= K('large_stone_carat')
      and declared_report_value < K('premium_declared_floor')) else 0.0)
  - upkeep_inspection_months: MONTHS(CFIELD('protection','last_inspection_date', covered_item_sku=F('original_item_sku')),
      NOW)
  - upkeep_multiplier: K('upkeep_full') if (EXISTS('protection', covered_item_sku=F('original_item_sku'), status='active')
      and upkeep_inspection_months <= K('upkeep_recent_months')) else (K('upkeep_partial') if (EXISTS('protection',
      covered_item_sku=F('original_item_sku'), status='active') and upkeep_inspection_months <= K('upkeep_lapsed_months'))
      else K('upkeep_lapsed'))
  - ownership_days: DAYS(F('original_purchase_date'), NOW)
  - valuation_ceiling: P('custody_insurance_cap') if (F('original_sales_receipt_number') != '' and ownership_days
      >= K('long_held_days')) else (K('ceiling_recent') if (F('original_sales_receipt_number') != '' and ownership_days
      < K('long_held_days')) else K('ceiling_outside'))
  - after_grade: RND(base_value * (100.0 - grade_deduction_pct) / 100.0, 2)
  - after_certificate: RND(after_grade * (100.0 - certificate_deduction_pct) / 100.0, 2)
  - with_premium: RND(after_certificate * (100.0 + stone_premium_pct) / 100.0, 2)
  - after_upkeep: RND(with_premium * upkeep_multiplier, 2)
  - result: RND(MN(after_upkeep, valuation_ceiling), 2)
  compute_basis:
    register_high_value: Where the appraisal register carries a value for the piece from a report issued within
      the programme's appraisal validity window and that value stands above the price the piece originally sold
      for, the valuation rests instead on the highest value the register carries for the piece
    register_latest_value: where the register carries a value for the piece only from a report issued longer ago
      than that window, it rests on the value the most recent of those reports states
    current_report_age_days: Where the appraisal register carries a value for the piece from a report issued within
      the programme's appraisal validity window and that value stands above the price the piece originally sold
      for, the valuation rests instead on the highest value the register carries for the piece
    base_value: The valuation rests on the price the piece originally sold for. Where the appraisal register carries
      a value for the piece from a report issued within the programme's appraisal validity window and that value
      stands above the price the piece originally sold for, the valuation rests instead on the highest value the
      register carries for the piece; and where the register carries a value for the piece only from a report
      issued longer ago than that window, it rests on the value the most recent of those reports states.
    entry_grade: the grade the entries record stands over any grade carried elsewhere on the file
    grade_deduction_pct: 'That figure is reduced by the deduction the desk publishes for the grade the registration''s
      entries record: six percent where an inspection stands among those entries and the later of them grades
      the piece good, twenty percent where an inspection stands among them and the later of them grades the piece
      fair, and nothing where no inspection stands among them or they grade it otherwise'
    report_lab: Where a certificate stands on the registration and the report the appraisal register carries for
      the piece names a laboratory, nothing is deducted for the certificate
    certificate_deduction_pct: Where a certificate stands on the registration and the report the appraisal register
      carries for the piece names a laboratory, nothing is deducted for the certificate; where a certificate stands
      but that report names no laboratory, ten percent is deducted; and where no certificate stands on the registration
      at all, the deduction is the one the programme publishes for a missing certificate.
    declared_report_value: Where the principal stone weighs at least one and a half carats and the report the
      register carries for the piece declares it at twenty thousand or more, eight percent is added
    stone_premium_pct: Nothing is added for the stone's weight. Where the principal stone weighs at least one
      and a half carats and the report the register carries for the piece declares it at twenty thousand or more,
      eight percent is added; and where the principal stone weighs at least one and a half carats and that report
      declares it at less than twenty thousand, three percent is added.
    upkeep_inspection_months: Where the piece is covered by a plan in force and an inspection has been logged
      against it within the last twelve months, the figure stands as worked out
    upkeep_multiplier: The figure is then taken at nine tenths. Where the piece is covered by a plan in force
      and an inspection has been logged against it within the last twelve months, the figure stands as worked
      out; where the piece is covered by a plan in force and the last inspection logged against it is more than
      twelve but not more than twenty-four months old, the figure is taken at nineteen twentieths; and otherwise
      it is taken at nine tenths.
    ownership_days: Where the chain sold the piece and the customer has held it for at least five years, the valuation
      is held instead to the largest amount the programme answers for while a piece is in its care
    valuation_ceiling: The valuation is never taken above fifteen thousand. Where the chain sold the piece and
      the customer has held it for at least five years, the valuation is held instead to the largest amount the
      programme answers for while a piece is in its care; and where the chain sold the piece and the customer
      has held it for less than five years, it is held to forty-five thousand.
    after_grade: the grade deduction is applied to it
    after_certificate: the certificate deduction is applied to the result of that
    with_premium: the weight addition is applied to the result of that
    after_upkeep: the upkeep treatment is applied to the result of that
    result: 'The order is fixed: the figure the valuation rests on is taken first, the grade deduction is applied
      to it, the certificate deduction is applied to the result of that, the weight addition is applied to the
      result of that, the upkeep treatment is applied to the result of that, and the ceiling is applied last.
      Each of those steps is rounded to two decimal places as it is taken.'
    inspections_logged: 'That figure is reduced by the deduction the desk publishes for the grade the registration''s
      entries record: six percent where an inspection stands among those entries and the later of them grades
      the piece good, twenty percent where an inspection stands among them and the later of them grades the piece
      fair, and nothing where no inspection stands among them or they grade it otherwise'
  factors:
  - id: valuation_resting_figure
    effect: method
    decides: base_value
    bindings:
    - register_high_value
    - register_latest_value
    - current_report_age_days
    - base_value
    ladder:
    - when: the appraisal register carries a value for the piece from a report issued within the programme's appraisal
        validity window and that value stands above the price the piece originally sold for
      method: the valuation rests on the highest value the register carries for the piece
    - when: the appraisal register carries a value for the piece only from a report issued longer ago than that
        window
      method: the valuation rests on the value the most recent of those reports states
    - when: otherwise
      method: the valuation rests on the price the piece originally sold for
    baseline:
      base_value: F('original_purchase_price')
    evidence:
    - cross_category
    - date
    cross_difficulty: appraisal
  - id: recorded_grade_deduction
    effect: parameter
    decides: grade_deduction_pct
    bindings:
    - inspections_logged
    - entry_grade
    - grade_deduction_pct
    ladder:
    - when: an inspection stands among the registration's entries and the later of them grades the piece good
      value: K('deduction_good')
    - when: an inspection stands among the registration's entries and the later of them grades the piece fair
      value: K('deduction_fair')
    - when: otherwise
      value: '0.0'
    baseline:
      grade_deduction_pct: '0.0'
    evidence:
    - history
    cross_difficulty: null
  - id: certificate_confirmation_deduction
    effect: parameter
    decides: certificate_deduction_pct
    bindings:
    - report_lab
    - certificate_deduction_pct
    ladder:
    - when: a certificate stands on the registration and the report the appraisal register carries for the piece
        names a laboratory
      value: '0.0'
    - when: a certificate stands on the registration and that report names no laboratory
      value: K('cert_unconfirmed_pct')
    - when: otherwise
      value: P('missing_certificate_deduction_pct')
    baseline:
      certificate_deduction_pct: P('missing_certificate_deduction_pct')
    evidence:
    - cross_category
    cross_difficulty: appraisal
  - id: stone_weight_premium
    effect: parameter
    decides: stone_premium_pct
    bindings:
    - declared_report_value
    - stone_premium_pct
    ladder:
    - when: the principal stone weighs at least one and a half carats and the report the register carries for
        the piece declares it at twenty thousand or more
      value: K('premium_large_certified')
    - when: the principal stone weighs at least one and a half carats and that report declares it at less than
        twenty thousand
      value: K('premium_large_plain')
    - when: otherwise
      value: '0.0'
    baseline:
      stone_premium_pct: '0.0'
    evidence:
    - cross_category
    cross_difficulty: appraisal
  - id: upkeep_treatment
    effect: parameter
    decides: upkeep_multiplier
    bindings:
    - upkeep_inspection_months
    - upkeep_multiplier
    ladder:
    - when: the piece is covered by a plan in force and an inspection has been logged against it within the last
        twelve months
      value: K('upkeep_full')
    - when: the piece is covered by a plan in force and the last inspection logged against it is more than twelve
        but not more than twenty-four months old
      value: K('upkeep_partial')
    - when: otherwise
      value: K('upkeep_lapsed')
    baseline:
      upkeep_multiplier: K('upkeep_lapsed')
    evidence:
    - cross_category
    - date
    cross_difficulty: protection
  - id: valuation_ceiling_held_to
    effect: parameter
    decides: valuation_ceiling
    bindings:
    - ownership_days
    - valuation_ceiling
    ladder:
    - when: the chain sold the piece and the customer has held it for at least five years
      value: P('custody_insurance_cap')
    - when: the chain sold the piece and the customer has held it for less than five years
      value: K('ceiling_recent')
    - when: otherwise
      value: K('ceiling_outside')
    baseline:
      valuation_ceiling: K('ceiling_outside')
    evidence:
    - date
    cross_difficulty: null
  baseline:
    rule: 'The valuation is taken on the piece as a whole, stone and mounting together, as the appraisal register
      values it. The valuation rests on the price the piece originally sold for. No deduction is made for the
      grade the piece was found at. The figure so reduced is then reduced again for the papers on the stone, by
      the deduction the programme publishes where no certificate it accepts stands on the registration. Nothing
      is added for the stone''s weight. The figure is then taken at nine tenths. The valuation is never taken
      above fifteen thousand. The order is fixed: the figure the valuation rests on is taken first, the grade
      deduction is applied to it, the certificate deduction is applied to the result of that, the weight addition
      is applied to the result of that, the upkeep treatment is applied to the result of that, and the ceiling
      is applied last. Each of those steps is rounded to two decimal places as it is taken.'
    params:
    - ceiling_outside
    - missing_certificate_deduction_pct
  inputs:
    history:
    - table: tradein_ledger
      aggregate: count
      filters:
        event_type: tradein_condition_inspection_logged
    - table: tradein_ledger
      aggregate: latest
      field: condition_grade
      filters:
        event_type: tradein_condition_inspection_logged
    - category: appraisal
      table: appraisal_ledger
      aggregate: max
      field: amount
      filters:
        event_type: appraisal_valuation_recorded
    - category: appraisal
      table: appraisal_ledger
      aggregate: latest
      field: amount
      filters:
        event_type: appraisal_valuation_recorded
    cross_category:
    - appraisal
    - protection
- id: tradein_ext_custody_declaration
  base_policy_refs:
  - tradein_registration_eligibility
  - tradein_estate_purchase
  overwrite: []
  trigger: state_due
  subject:
  - tradein_registration_updated
  computes: declared_custody_value
  target_tool: confirm_custody_declaration_bb764f94
  params:
    uplift_long: 10.0
    uplift_recent: 5.0
    long_held_days: 3650
    cap_outside: 60000.0
    cap_uncovered: 20000.0
    member_margin_high: 6.0
    member_margin: 3.0
  rule: 'A piece taken in for trade is held at a declared value while it is in the chain''s care, and that value
    is the customer''s own to put on the record, because it is their property that is being held. The declaration
    rests on the price the piece originally sold for. Where the appraisal register carries a report for the piece
    that was issued within the programme''s appraisal validity window and that report declares a value for the
    piece, the declaration rests on the value that report declares; and where the register carries such a report
    but it was issued longer ago than that window, the declaration rests on the highest value the register carries
    for the piece. Nothing is added over the figure the declaration rests on. Where the chain sold the piece and
    the customer has held it for at least ten years, one tenth is added; and where the chain sold the piece and
    the customer has held it for less than ten years, one twentieth is added. Nothing further is added for the
    customer''s standing with the chain. Where the customer''s membership stands above Belrose Circle Gold and
    a concierge is named on it, a further six percent is added; and where their membership stands above Belrose
    Circle Gold and no concierge is named on it, a further three percent is added. The declaration is never taken
    above twenty thousand. Where the piece is covered by a plan in force and the chain sold it, the declaration
    is held instead to the largest amount the programme answers for while a piece is in its care; and where the
    piece is covered by a plan in force but the chain did not sell it, it is held to sixty thousand. The order
    is fixed: the figure the declaration rests on is taken first, the addition for how long the piece has been
    held is applied to it, the addition for the customer''s standing is applied to the result of that, and the
    ceiling is applied last, each step rounded to two decimal places as it is taken.

    '
  prerequisite: []
  cross_category:
  - category: appraisal
    as: branch
    reads:
    - declared_value
    - issued_date
    - appraisal_ledger.amount
    note: the appraisal register supplies the value the declaration rests on and the age of the report it comes
      from
  - category: circle
    as: branch
    reads:
    - variant_name
    - concierge_assigned
    note: the membership tier and whether a concierge is named on it decide the addition made for the customer's
      standing
  - category: protection
    as: existence
    reads:
    - status
    - covered_item_sku
    note: whether the piece is covered by a plan in force decides which ceiling the declaration is held to
  compute:
  - report_declared_value: CFIELD('appraisal','declared_value', item_sku=F('original_item_sku'), status='issued')
  - report_age_days: DAYS(CFIELD('appraisal','issued_date', item_sku=F('original_item_sku'), status='issued'),
      NOW)
  - register_high_value: XMAX('appraisal','appraisal_ledger','amount', event_type='appraisal_valuation_recorded',
      item_sku=F('original_item_sku'))
  - declaration_base: report_declared_value if (report_age_days <= P('appraisal_validity_days') and report_declared_value
      > 0) else (register_high_value if (report_age_days > P('appraisal_validity_days') and register_high_value
      > 0) else F('original_purchase_price'))
  - ownership_days: DAYS(F('original_purchase_date'), NOW)
  - holding_uplift_pct: K('uplift_long') if (ownership_days >= K('long_held_days') and F('original_sales_receipt_number')
      != '') else (K('uplift_recent') if (ownership_days < K('long_held_days') and F('original_sales_receipt_number')
      != '') else 0.0)
  - member_tier_name: CFIELD('circle','variant_name')
  - concierge_named: CFIELD('circle','concierge_assigned')
  - member_margin_pct: K('member_margin_high') if (member_tier_name != 'Belrose Circle Member' and member_tier_name
      != 'Belrose Circle Silver' and member_tier_name != 'Belrose Circle Gold' and concierge_named == True) else
      (K('member_margin') if (member_tier_name != 'Belrose Circle Member' and member_tier_name != 'Belrose Circle
      Silver' and member_tier_name != 'Belrose Circle Gold' and concierge_named != True) else 0.0)
  - custody_ceiling: P('custody_insurance_cap') if (EXISTS('protection', covered_item_sku=F('original_item_sku'),
      status='active') and F('original_sales_receipt_number') != '') else (K('cap_outside') if (EXISTS('protection',
      covered_item_sku=F('original_item_sku'), status='active') and F('original_sales_receipt_number') == '')
      else K('cap_uncovered'))
  - subtotal: RND(declaration_base * (100.0 + holding_uplift_pct) / 100.0, 2)
  - with_margin: RND(subtotal * (100.0 + member_margin_pct) / 100.0, 2)
  - result: RND(MN(with_margin, custody_ceiling), 2)
  compute_basis:
    report_declared_value: Where the appraisal register carries a report for the piece that was issued within
      the programme's appraisal validity window and that report declares a value for the piece, the declaration
      rests on the value that report declares
    report_age_days: where the register carries such a report but it was issued longer ago than that window, the
      declaration rests on the highest value the register carries for the piece
    register_high_value: where the register carries such a report but it was issued longer ago than that window,
      the declaration rests on the highest value the register carries for the piece
    declaration_base: The declaration rests on the price the piece originally sold for. Where the appraisal register
      carries a report for the piece that was issued within the programme's appraisal validity window and that
      report declares a value for the piece, the declaration rests on the value that report declares; and where
      the register carries such a report but it was issued longer ago than that window, the declaration rests
      on the highest value the register carries for the piece.
    ownership_days: Where the chain sold the piece and the customer has held it for at least ten years, one tenth
      is added
    holding_uplift_pct: Nothing is added over the figure the declaration rests on. Where the chain sold the piece
      and the customer has held it for at least ten years, one tenth is added; and where the chain sold the piece
      and the customer has held it for less than ten years, one twentieth is added.
    member_tier_name: Where the customer's membership stands above Belrose Circle Gold and a concierge is named
      on it, a further six percent is added
    concierge_named: where their membership stands above Belrose Circle Gold and no concierge is named on it,
      a further three percent is added
    member_margin_pct: Nothing further is added for the customer's standing with the chain. Where the customer's
      membership stands above Belrose Circle Gold and a concierge is named on it, a further six percent is added;
      and where their membership stands above Belrose Circle Gold and no concierge is named on it, a further three
      percent is added.
    custody_ceiling: The declaration is never taken above twenty thousand. Where the piece is covered by a plan
      in force and the chain sold it, the declaration is held instead to the largest amount the programme answers
      for while a piece is in its care; and where the piece is covered by a plan in force but the chain did not
      sell it, it is held to sixty thousand.
    subtotal: the addition for how long the piece has been held is applied to it
    with_margin: the addition for the customer's standing is applied to the result of that
    result: 'The order is fixed: the figure the declaration rests on is taken first, the addition for how long
      the piece has been held is applied to it, the addition for the customer''s standing is applied to the result
      of that, and the ceiling is applied last, each step rounded to two decimal places as it is taken.'
  factors:
  - id: declaration_resting_figure
    effect: method
    decides: declaration_base
    bindings:
    - report_declared_value
    - report_age_days
    - register_high_value
    - declaration_base
    ladder:
    - when: the appraisal register carries a report for the piece issued within the programme's appraisal validity
        window and that report declares a value for the piece
      method: the declaration rests on the value that report declares
    - when: the appraisal register carries such a report but it was issued longer ago than that window
      method: the declaration rests on the highest value the register carries for the piece
    - when: otherwise
      method: the declaration rests on the price the piece originally sold for
    baseline:
      declaration_base: F('original_purchase_price')
    evidence:
    - cross_category
    - date
    cross_difficulty: appraisal
  - id: holding_length_addition
    effect: parameter
    decides: holding_uplift_pct
    bindings:
    - ownership_days
    - holding_uplift_pct
    ladder:
    - when: the chain sold the piece and the customer has held it for at least ten years
      value: K('uplift_long')
    - when: the chain sold the piece and the customer has held it for less than ten years
      value: K('uplift_recent')
    - when: otherwise
      value: '0.0'
    baseline:
      holding_uplift_pct: '0.0'
    evidence:
    - date
    cross_difficulty: null
  - id: standing_addition
    effect: parameter
    decides: member_margin_pct
    bindings:
    - member_tier_name
    - concierge_named
    - member_margin_pct
    ladder:
    - when: the customer's membership stands above Belrose Circle Gold and a concierge is named on it
      value: K('member_margin_high')
    - when: the customer's membership stands above Belrose Circle Gold and no concierge is named on it
      value: K('member_margin')
    - when: otherwise
      value: '0.0'
    baseline:
      member_margin_pct: '0.0'
    evidence:
    - cross_category
    cross_difficulty: circle
  - id: custody_ceiling_held_to
    effect: parameter
    decides: custody_ceiling
    bindings:
    - custody_ceiling
    ladder:
    - when: the piece is covered by a plan in force and the chain sold it
      value: P('custody_insurance_cap')
    - when: the piece is covered by a plan in force but the chain did not sell it
      value: K('cap_outside')
    - when: otherwise
      value: K('cap_uncovered')
    baseline:
      custody_ceiling: K('cap_uncovered')
    evidence:
    - cross_category
    cross_difficulty: protection
  baseline:
    rule: 'The declaration rests on the price the piece originally sold for. Nothing is added over the figure
      the declaration rests on. Nothing further is added for the customer''s standing with the chain. The declaration
      is never taken above twenty thousand. The order is fixed: the figure the declaration rests on is taken first,
      the addition for how long the piece has been held is applied to it, the addition for the customer''s standing
      is applied to the result of that, and the ceiling is applied last, each step rounded to two decimal places
      as it is taken.'
    params:
    - cap_uncovered
  inputs:
    history:
    - category: appraisal
      table: appraisal_ledger
      aggregate: max
      field: amount
      filters:
        event_type: appraisal_valuation_recorded
    cross_category:
    - appraisal
    - circle
