    - basis_value
    ladder:
    - when: the report the registration names was issued within the programme's appraisal validity window and
        the appraisal register carries a value for the traded piece above the price it originally sold for
      method: the share is taken on the highest value the appraisal register carries for that piece
    - when: the report the registration names was issued longer ago than the validity window and the registration's
        own entries carry a valuation of the piece
