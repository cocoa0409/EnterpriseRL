    cross_difficulty: null
  baseline:
    rule: The credit put toward a new piece is the credit the registration shows as issued, taken at the share
      the desk lets go on one sale, which is sixty percent. Nothing is held back against the window in which the
      traded piece may still be taken back. Nothing is added for spending above the least the customer must spend.
      The price of the new piece is read as the least the customer must spend that the registration records. The
      share is taken first and rounded to two decimal places, what is added for spending above the least the customer
      must spend is rounded to two decimal places on its own, what is held back is then taken off, the figure
      is not taken below nothing, and the result is rounded to two decimal places at that final step only.
    params:
