category: tradein
display_name: Belrose Trade-In and Upgrade Programmes
binding:
  holding_table: tradein_credits
  event_tables:
  - tradein_ledger
  intake_tables:
  - tradein_intake
  status_field: status
  variant_field: variant_name
  quantity_fields:
    remaining_credit: upgrade_credit
lifecycle:
  states:
  - registered
  - appraisal_pending
  - credit_issued
  - partially_redeemed
  - redeemed
  - expired
  - revoked
  transitions:
  - from: registered
    to: appraisal_pending
    by: agent
    means: the piece was taken in and sent for valuation
  - from: registered
    to: revoked
    by: agent
    means: the piece was refused at the counter before it was valued
  - from: appraisal_pending
    to: credit_issued
    by: agent
    means: the valuation came back and the credit was issued
  - from: appraisal_pending
    to: revoked
    by: agent
    means: the valuation failed and no credit was issued
  - from: credit_issued
    to: partially_redeemed
    by: user
    means: the customer spent part of the credit on a new piece
  - from: credit_issued
    to: redeemed
    by: user
    means: the customer spent the whole credit on a new piece
  - from: partially_redeemed
    to: redeemed
    by: user
    means: the customer spent what was left of the credit
  - from: credit_issued
    to: expired
    by: system
    means: the credit reached its expiry unspent
  - from: partially_redeemed
    to: expired
    by: system
    means: what was left of the credit reached its expiry unspent
  - from: credit_issued
    to: revoked
    by: agent
    means: the credit was withdrawn because the customer took the traded piece back
accounts:
- key: upgrade_credit
  unit: USD
  meaning: how much upgrade credit this registration still carries, increased when the credit is issued or revalued
    upward and decreased as it is spent or forfeited
parameter_schema:
  credit_pct_of_original_price: share of the price the traded piece was originally sold at that is given back
    as credit, as a percentage
  credit_pct_of_current_appraisal: share of the current appraised value that is given back as credit, as a percentage
  minimum_original_purchase_price: smallest original selling price a traded piece may carry for this programme,
    in USD
  minimum_traded_item_value: smallest appraised value a traded piece may carry for this programme, in USD
  maximum_credit_amount: largest credit this programme will issue against one traded piece, in USD
  credit_validity_days: calendar days the issued credit may be spent within; integer, 0 where the credit does
    not expire
  credit_partially_redeemable: whether the credit may be spent in parts across several purchases; boolean
  minimum_upgrade_multiple: how many times the credit the new piece must cost for the credit to be spendable against
    it; number
  minimum_upgrade_spend_uplift_pct: how much more than the original selling price the new piece must cost, as
    a percentage
  registration_required_within_days: calendar days after the original purchase within which the trade-in must
    be registered; integer, 0 where no registration deadline applies
  original_purchase_must_be_belrose: whether the traded piece must have been bought from the chain; boolean
  certificate_required: whether a laboratory certificate must be presented for the traded stone; boolean
  accepted_certificate_labs: the laboratories whose certificates the programme accepts; list of laboratory codes
  accepted_condition_grades: the condition grades the programme will take a piece in at; list of grade values
  condition_inspection_required: whether the piece must be inspected and graded before credit is issued; boolean
  appraisal_required: whether a formal appraisal must be on file before credit is issued; boolean
  appraisal_fee: fee charged for the appraisal the programme requires, in USD
  appraisal_fee_credited_to_upgrade: whether the appraisal fee is credited against the upgrade when the customer
    goes ahead; boolean
  valuation_basis: which basis the credit is worked out on; enum of original_purchase_price, current_market_appraisal,
    certified_lab_value or published_scrap_rate
  scrap_rate_pct_of_spot: share of the published metal spot price paid for metal taken as scrap, as a percentage
  stone_only_credit: whether credit is given for the stone alone and not for the mounting; boolean
  setting_credited: whether the mounting is credited alongside the stone; boolean
  condition_deduction_pct_by_grade: reduction applied to the valuation by condition grade; mapping of grade value
    to percentage
  missing_certificate_deduction_pct: reduction applied when no accepted certificate is presented, as a percentage
  credit_transferable: whether the credit may be spent by anyone other than the customer it was issued to; boolean
  credit_combinable_with_promotions: whether the credit may be spent alongside a promotional discount on the same
    sale; boolean
  credit_applicable_to_protection_plan: whether the credit may be spent on a protection plan; boolean
  credit_applicable_to_service: whether the credit may be spent on workshop repair work; boolean
  credit_applicable_to_custom_commission: whether the credit may be spent on a custom commission; boolean
  credit_may_offset_financed_principal: whether the credit may be applied against a financed balance rather than
    at the till; boolean
  max_credits_per_customer: how many live credits one customer may hold under this programme at once; integer
  max_credits_per_purchase: how many credits may be spent on one sale; integer
  credit_extension_allowed: whether an expiring credit may be extended; boolean
  credit_extension_days: calendar days an extension adds to the expiry; integer
  credit_extension_fee: fee charged to extend a credit, in USD
  cash_out_allowed: whether the credit may be taken as money rather than spent on merchandise; boolean
  consignment_commission_pct: commission the chain retains when a piece is sold on consignment, as a percentage
  consignment_period_days: calendar days a consigned piece is offered for before it is returned; integer
  consignment_minimum_value: smallest appraised value a piece may be taken on consignment at, in USD
  buyback_offered: whether the chain will buy the piece outright rather than issue credit; boolean
  buyback_pct_of_appraised_value: share of the appraised value paid on an outright purchase, as a percentage
  revaluation_allowed: whether an issued credit may be revalued before it is spent; boolean
  revaluation_window_days: calendar days after issue within which a credit may be revalued; integer
  item_return_window_days: calendar days within which the customer may withdraw the traded piece and give the
    credit back; integer
  custody_insurance_cap: largest amount the chain answers for while the traded piece is in its care, in USD
  shipping_insured: whether the traded piece is shipped under insurance when it moves between locations; boolean
  proof_of_ownership_required: whether the customer must show they own the piece before it is taken in; boolean
  identity_verification_required: whether the customer's identity must be verified before credit is issued; boolean
  minimum_holding_period_days: calendar days the customer must have owned the piece before it may be traded; integer
  precious_metal_holding_days: calendar days the chain must hold a bought-in piece before it may be resold or
    melted, as the trade requires; integer
  appraisal_validity_days: calendar days an appraisal stays good for as the basis of a credit; integer
  upgrade_same_or_higher_grade_required: whether the new piece must be of the same or a higher grade than the
    piece traded; boolean
