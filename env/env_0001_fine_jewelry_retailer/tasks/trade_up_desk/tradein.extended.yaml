extended_policies:
- id: tradein_ext_credit_revaluation
  base_policy_refs:
  - tradein_credit_grant
  - tradein_valuation
  overwrite: []
  trigger: state_due
  subject:
  - tradein_credit_revaluation_applied
  computes: revaluation_amount
  target_tool: apply_credit_revaluation_37908854
  params:
    share_upkept_certified: 70.0
    share_certified: 67.5
    ceiling_pct_fresh: 100.0
    ceiling_pct_aged: 40.0
    ceiling_pct_repeat: 10.0
    fresh_days: 60
    upkeep_months: 24
    upkeep_inspections: 2
  rule: 'An issued upgrade credit is revalued upward by booking, as its own entry, the increase the traded piece
    now supports over the credit already standing on the registration. The credit the traded piece now supports
    is the share the programme publishes for the current appraised value, taken on the price the piece originally
    sold for, rounded to two decimal places and then held to the programme''s largest credit for one traded piece.
    Where the stone carries a certificate from a laboratory the programme accepts and two or more inspections
    have been logged in the last twenty-four months against the pieces the customer keeps covered, the share is
    seventy percent; where the stone carries such a certificate but fewer than two inspections have been logged
    against those pieces in that time, the share is sixty-seven and a half percent; where no certificate stands
    on the registration, the share is the one the programme publishes for the current appraised value. The share
    is taken on the price the piece originally sold for, except that where the report the registration names was
    issued within the programme''s appraisal validity window and the appraisal register carries a value for the
    traded piece above the price it originally sold for, the share is taken on the highest value the appraisal
    register carries for that piece; and where that report was issued longer ago than the validity window and
    the registration''s own entries carry a valuation of the piece, the share is taken on the highest valuation
    those entries carry. The credit already standing is read as the credit still available to spend that the registration
    shows. Where the credit entry on the registration was booked on the price the piece originally sold for and
    the chain sold the piece, the credit already standing is instead read as the sum of the credit entries booked
    to the registration; and where that entry was booked on a certified laboratory value, or the chain did not
    sell the piece, it is read as the sum of every entry booked to the registration that moves the credit, spends
    included. An entry moves the credit where it books the credit, revalues it upward, spends it or takes it away;
    a valuation entry and an inspection entry move nothing, whatever amount they carry. The increase is the credit
    the piece now supports less the credit already standing, held to the ceiling the desk publishes for one revaluation,
    which is a tenth of the credit already standing. Where no revaluation has yet been booked to the registration
    and the credit was issued within the last sixty days, that ceiling is instead the whole of the credit already
    standing; and where no revaluation has yet been booked but the credit was issued more than sixty days ago,
    it is two fifths of the credit already standing. The appraisal fee the programme publishes for the report
    the revaluation rests on is then taken off the increase. Where the programme credits its appraisal fee against
    the upgrade and that report carries nothing still owed, nothing is taken off; and where the programme credits
    its appraisal fee against the upgrade and that report carries an amount still owed, only the amount still
    owed is taken off. The order is fixed: the supported credit is worked out and rounded first, the credit already
    standing is subtracted from it, the ceiling is applied to that difference, and the fee is taken off last.
    The increase is rounded to two decimal places at that final step only, and where the figure comes out at or
    below nothing, no increase is booked and nothing is entered.

    '
  prerequisite: []
  cross_category:
  - category: protection
    as: history
    reads:
    - protection_ledger.event_type
    - protection_ledger.posted_date
    note: the count of inspections logged against the customer's covered pieces decides which share of the current
      appraised value the revaluation rests on
  - category: appraisal
    as: history
    reads:
    - appraisal_ledger.amount
    - appraisal_ledger.event_type
    - issued_date
    - balance_due
    note: the appraisal register supplies the value the piece is now worth, the age of the report the registration
      names and what is still owed on it
  compute:
  - lab_report_value: XMAX('appraisal','appraisal_ledger','amount', event_type='appraisal_valuation_recorded',
      item_sku=F('original_item_sku'))
  - report_age_days: DAYS(CFIELD('appraisal','issued_date', appraisal_reference=F('appraisal_reference')), NOW)
  - own_valuation_value: MAX('tradein_ledger','amount', event_type='tradein_item_valuation_logged')
  - basis_value: lab_report_value if (report_age_days <= P('appraisal_validity_days') and lab_report_value > F('original_purchase_price'))
      else (own_valuation_value if (report_age_days > P('appraisal_validity_days') and own_valuation_value > 0)
      else F('original_purchase_price'))
  - upkeep_inspections_logged: XCOUNT('protection','protection_ledger', within_months=K('upkeep_months'), date_field='posted_date',
      event_type='protection_inspection_logged')
  - revaluation_share_pct: K('share_upkept_certified') if (F('certificate_number') != '' and upkeep_inspections_logged
      >= K('upkeep_inspections')) else (K('share_certified') if (F('certificate_number') != '' and upkeep_inspections_logged
      < K('upkeep_inspections')) else P('credit_pct_of_current_appraisal'))
  - supported_credit: MN(P('maximum_credit_amount'), RND(basis_value * revaluation_share_pct / 100.0, 2))
  - granted_basis: LATEST('tradein_ledger','valuation_basis', date_field='posted_date', event_type='tradein_credit_granted')
  - movements_all: SUM('tradein_ledger','amount', event_type='tradein_credit_granted') + SUM('tradein_ledger','amount',
      event_type='tradein_credit_revaluation_applied') + SUM('tradein_ledger','amount', event_type='tradein_credit_redeemed')
      + SUM('tradein_ledger','amount', event_type='tradein_credit_forfeited')
  - standing_credit: SUM('tradein_ledger','amount', event_type='tradein_credit_granted') if (granted_basis ==
      'original_purchase_price' and F('original_sales_receipt_number') != '') else (movements_all if (granted_basis
      == 'certified_lab_value' or F('original_sales_receipt_number') == '') else F('remaining_credit'))
  - revaluations_booked: COUNT('tradein_ledger', event_type='tradein_credit_revaluation_applied')
  - days_since_issue: DAYS(F('issued_date'), NOW)
  - ceiling_pct: K('ceiling_pct_fresh') if (revaluations_booked == 0 and days_since_issue <= K('fresh_days'))
      else (K('ceiling_pct_aged') if (revaluations_booked == 0 and days_since_issue > K('fresh_days')) else K('ceiling_pct_repeat'))
  - appraisal_balance_due: CFIELD('appraisal','balance_due', appraisal_reference=F('appraisal_reference'))
  - fee_offset: 0.0 if (appraisal_balance_due <= 0 and P('appraisal_fee_credited_to_upgrade') == True) else (appraisal_balance_due
      if (appraisal_balance_due > 0 and P('appraisal_fee_credited_to_upgrade') == True) else P('appraisal_fee'))
  - result: MX(0.0, RND(MN(supported_credit - standing_credit, RND(standing_credit * ceiling_pct / 100.0, 2))
      - fee_offset, 2))
  compute_basis:
    lab_report_value: where the report the registration names was issued within the programme's appraisal validity
      window and the appraisal register carries a value for the traded piece above the price it originally sold
      for, the share is taken on the highest value the appraisal register carries for that piece
    report_age_days: where the report the registration names was issued within the programme's appraisal validity
      window and the appraisal register carries a value for the traded piece above the price it originally sold
      for, the share is taken on the highest value the appraisal register carries for that piece
    own_valuation_value: where that report was issued longer ago than the validity window and the registration's
      own entries carry a valuation of the piece, the share is taken on the highest valuation those entries carry
    basis_value: The share is taken on the price the piece originally sold for, except that where the report the
      registration names was issued within the programme's appraisal validity window and the appraisal register
      carries a value for the traded piece above the price it originally sold for, the share is taken on the highest
      value the appraisal register carries for that piece; and where that report was issued longer ago than the
      validity window and the registration's own entries carry a valuation of the piece, the share is taken on
      the highest valuation those entries carry.
    upkeep_inspections_logged: Where the stone carries a certificate from a laboratory the programme accepts and
      two or more inspections have been logged in the last twenty-four months against the pieces the customer
      keeps covered, the share is seventy percent
    revaluation_share_pct: Where the stone carries a certificate from a laboratory the programme accepts and two
      or more inspections have been logged in the last twenty-four months against the pieces the customer keeps
      covered, the share is seventy percent; where the stone carries such a certificate but fewer than two inspections
      have been logged against those pieces in that time, the share is sixty-seven and a half percent; where no
      certificate stands on the registration, the share is the one the programme publishes for the current appraised
      value.
    supported_credit: The credit the traded piece now supports is the share the programme publishes for the current
      appraised value, taken on the price the piece originally sold for, rounded to two decimal places and then
      held to the programme's largest credit for one traded piece.
    granted_basis: Where the credit entry on the registration was booked on the price the piece originally sold
      for and the chain sold the piece, the credit already standing is instead read as the sum of the credit entries
      booked to the registration
    standing_credit: The credit already standing is read as the credit still available to spend that the registration
      shows. Where the credit entry on the registration was booked on the price the piece originally sold for
      and the chain sold the piece, the credit already standing is instead read as the sum of the credit entries
      booked to the registration; and where that entry was booked on a certified laboratory value, or the chain
      did not sell the piece, it is read as the sum of every entry booked to the registration that moves the credit,
      spends included.
    revaluations_booked: Where no revaluation has yet been booked to the registration and the credit was issued
      within the last sixty days, that ceiling is instead the whole of the credit already standing
    days_since_issue: Where no revaluation has yet been booked to the registration and the credit was issued within
      the last sixty days, that ceiling is instead the whole of the credit already standing; and where no revaluation
      has yet been booked but the credit was issued more than sixty days ago, it is two fifths of the credit already
      standing.
    ceiling_pct: The increase is the credit the piece now supports less the credit already standing, held to the
      ceiling the desk publishes for one revaluation, which is a tenth of the credit already standing. Where no
      revaluation has yet been booked to the registration and the credit was issued within the last sixty days,
      that ceiling is instead the whole of the credit already standing; and where no revaluation has yet been
      booked but the credit was issued more than sixty days ago, it is two fifths of the credit already standing.
    appraisal_balance_due: Where the programme credits its appraisal fee against the upgrade and that report carries
      nothing still owed, nothing is taken off
    fee_offset: The appraisal fee the programme publishes for the report the revaluation rests on is then taken
      off the increase. Where the programme credits its appraisal fee against the upgrade and that report carries
      nothing still owed, nothing is taken off; and where the programme credits its appraisal fee against the
      upgrade and that report carries an amount still owed, only the amount still owed is taken off.
    result: 'The order is fixed: the supported credit is worked out and rounded first, the credit already standing
      is subtracted from it, the ceiling is applied to that difference, and the fee is taken off last. The increase
      is rounded to two decimal places at that final step only, and where the figure comes out at or below nothing,
      no increase is booked and nothing is entered.'
  factors:
