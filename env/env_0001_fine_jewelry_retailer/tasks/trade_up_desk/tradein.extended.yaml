    ladder:
    - when: the least the customer must spend stands above the credit still available and the credit has longer
        than a month left to run
      method: the amount spent above the least the customer must spend is the price of the new piece less the
        least the customer must spend
    - when: the least the customer must spend stands at or below the credit still available and the credit has
        longer than a month left to run
      method: the amount spent above the least the customer must spend is the price of the new piece less the
        credit still available
    - when: otherwise
      method: nothing is added for spending above the least the customer must spend
    baseline:
      excess_spend: '0.0'
    evidence:
