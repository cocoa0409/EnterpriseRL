  rule: Credit is spent only against a new piece costing at least the programme's multiple of the credit, and
    on the programmes that also require an uplift, at least that much more than the piece traded originally sold
    for. Credit is spent only against the sale it is presented for, identified by the till transaction number
    and the merchandise line the credit was applied to. Credit is spent only while the registration stands at
    credit issued or partially redeemed, and never against a registration that has closed. On the programmes that
    allow it the credit may be spent in parts across several sales; on the programmes that do not, it is spent
    once and anything left over is lost. Credit is spent on merchandise and, where the programme admits it, on
    a protection plan, on workshop work or on a custom commission; the programmes that do not admit those do not
    spend credit on them. Credit is never taken as money except under the programme that offers an outright purchase,
    and a customer asking for cash against an upgrade credit is told so plainly. Where the programme admits it,
    the credit may be applied against a financed balance instead of at the till, and the financing desk posts
    it as a credit to that plan.
