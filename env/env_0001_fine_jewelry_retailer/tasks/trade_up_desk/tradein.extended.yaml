    - tier_param
    cross_difficulty: circle
  - id: return_window_holdback
    effect: parameter
    decides: holdback
    bindings:
    - days_since_issue
    - inspections_on_registration
    - holdback
    ladder:
    - when: the credit was issued within the window in which the traded piece may still be taken back and the
        registration's entries carry a condition inspection of the piece
      value: K('holdback_inspected')
    - when: the credit was issued within that window and those entries carry no condition inspection
      value: K('holdback_uninspected')
    - when: otherwise
      value: '0.0'
    baseline:
      holdback: '0.0'
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: above_minimum_release
    effect: parameter
    decides: release_share_pct
