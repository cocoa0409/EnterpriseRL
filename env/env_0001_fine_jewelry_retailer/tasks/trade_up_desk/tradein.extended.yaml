    ladder:
    - when: the credit entry on the registration was booked on the price the piece originally sold for and the
        chain sold the piece
      method: the credit already standing is read as the sum of the credit entries booked to the registration
    - when: the credit entry was booked on a certified laboratory value, or the chain did not sell the piece
      method: the credit already standing is read as the sum of every entry booked to the registration that moves
        the credit, spends included
    - when: otherwise
      method: the credit already standing is read as the credit still available to spend that the registration
        shows
    baseline:
