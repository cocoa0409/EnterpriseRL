- id: tradein_ext_credit_issue
  base_policy_refs:
  - tradein_valuation
  - tradein_estate_purchase
  overwrite:
  - base_policy: tradein_valuation
    superseded_clause: On the programmes that guarantee the original price, the credit is that share of the price
      the piece originally sold for; on the programmes that value at market, it is that share of the current appraised
      value.
    replaced_by: The credit issued is the share the programme publishes for a current appraised value, taken on
      the figure the credit rests on, with the appraisal fee addition and the cover addition added to it and the
      whole held to its ceiling.
  trigger: on_request
  subject:
  - tradein_credit_issued
  computes: issued_credit_amount
  target_tool: issue_upgrade_credit_f63e5226
  params:
    share_loyal_long: 85.0
    share_loyal: 78.0
    loyal_years_days: 3650
    cover_bonus_clean: 400.0
    cover_bonus_claimed: 150.0
  rule: 'The credit issued against a traded piece is worked out as follows. The credit issued is fixed only after
    the registration''s entries carry the appraiser''s valuation of the traded piece. The credit is issued only
    once the upgrade desk''s request record carries the customer''s own confirmed declaration of the value the
    piece was taken in at. The credit issued is the share the programme publishes for a current appraised value,
    taken on the figure the credit rests on, with the appraisal fee addition and the cover addition added to it
    and the whole held to its ceiling. The credit rests on the price the piece originally sold for. Where the
    registration''s entries carry a valuation of the piece and the appraisal register carries a report on the
    piece issued within the programme''s appraisal validity window, the credit rests instead on the highest valuation
    those entries carry; and where the entries carry a valuation of the piece but the register carries no report
    on it issued within that window, the credit rests on the lower of the highest valuation those entries carry
    and the price the piece originally sold for. Where the customer''s membership stands above Belrose Circle
    Gold and they have held the piece for at least ten years, the share is eighty-five percent; where their membership
    stands above Belrose Circle Gold and they have held the piece for less than ten years, the share is seventy-eight
    percent; otherwise the share is the one the programme publishes for a current appraised value. Nothing is
    added for the appraisal fee. Where the programme credits its appraisal fee against the upgrade and the payments
    taken on the appraisal of the piece cover that fee in full, the programme''s appraisal fee is added; and where
    the programme credits its appraisal fee against the upgrade and those payments fall short of it, what has
    been paid is added. Nothing is added for the cover the piece was kept under. Where the piece is covered by
    a plan in force and no claim has been settled on that cover, four hundred is added; and where the piece is
    covered by a plan in force and a claim has been settled on that cover, one hundred and fifty is added. The
    credit issued is held to the price the piece originally sold for. Where the value the customer declared the
    piece at stands on the upgrade desk''s request record and exceeds the programme''s largest credit for one
    traded piece, the credit is held instead to that largest credit; and where the value they declared stands
    on that record and is at or below the programme''s largest credit, the credit is held to the value they declared.
    The order is fixed: the share is taken on the figure the credit rests on first and rounded to two decimal
    places, the appraisal fee addition and the cover addition are added to that figure, and the ceiling is applied
    last, the result being rounded to two decimal places at that final step only.

    '
  prerequisite:
  - problem: tradein_ext_item_valuation
    kind: value_input
    gate: entries_valuation
    form: state
    policy_source: The credit issued is fixed only after the registration's entries carry the appraiser's valuation
      of the traded piece.
    condition: The registration's entries carry the appraiser's valuation of the traded piece.
    resolved_by: log_item_valuation_6ae79dd2
    effect: The valuation the credit rests on becomes the figure those entries carry instead of the price the
      piece originally sold for, so the share is taken on it.
  - problem: tradein_ext_custody_declaration
    kind: value_input
    gate: credit_ceiling
    form: state
    policy_source: The credit is issued only once the upgrade desk's request record carries the customer's own
      confirmed declaration of the value the piece was taken in at.
    condition: The upgrade desk's request record for the registration carries a declaration of the value the piece
      was taken in at that the customer has confirmed.
    resolved_by: confirm_custody_declaration_bb764f94
    effect: The ceiling the credit is held to becomes the value the customer declared instead of the price the
      piece originally sold for.
  cross_category:
  - category: circle
    as: branch
    reads:
    - variant_name
    note: the membership tier, taken with how long the piece has been held, decides the share the credit is taken
      at
  - category: appraisal
    as: history
    reads:
    - appraisal_ledger.amount
    - appraisal_ledger.event_type
    note: what has actually been paid on the appraisal of the piece decides how much of the appraisal fee is added
      to the credit
  - category: protection
    as: branch
    reads:
    - status
    - covered_item_sku
    - claims_settled_count
    note: whether the piece was covered and whether a claim was settled on that cover decides the addition made
      for cover
  compute:
  - valuation_entries: COUNT('tradein_ledger', event_type='tradein_item_valuation_logged')
  - entries_valuation_high: MAX('tradein_ledger','amount', event_type='tradein_item_valuation_logged')
  - current_report_age_days: DAYS(CFIELD('appraisal','issued_date', item_sku=F('original_item_sku'), status='issued'),
      NOW)
  - entries_valuation: entries_valuation_high if (valuation_entries >= 1 and current_report_age_days <= P('appraisal_validity_days'))
      else (MN(entries_valuation_high, F('original_purchase_price')) if (valuation_entries >= 1 and current_report_age_days
      > P('appraisal_validity_days')) else F('original_purchase_price'))
  - member_tier_name: CFIELD('circle','variant_name')
  - ownership_days: DAYS(F('original_purchase_date'), NOW)
  - credit_share_pct: K('share_loyal_long') if (member_tier_name != 'Belrose Circle Member' and member_tier_name
      != 'Belrose Circle Silver' and member_tier_name != 'Belrose Circle Gold' and ownership_days >= K('loyal_years_days'))
      else (K('share_loyal') if (member_tier_name != 'Belrose Circle Member' and member_tier_name != 'Belrose
      Circle Silver' and member_tier_name != 'Belrose Circle Gold' and ownership_days < K('loyal_years_days'))
      else P('credit_pct_of_current_appraisal'))
  - credit_gross: RND(entries_valuation * credit_share_pct / 100.0, 2)
  - appraisal_paid: ABS(XSUM('appraisal','appraisal_ledger','amount', event_type='appraisal_payment_received',
      item_sku=F('original_item_sku')))
  - fee_credit: P('appraisal_fee') if (P('appraisal_fee_credited_to_upgrade') == True and appraisal_paid >= P('appraisal_fee'))
      else (appraisal_paid if (P('appraisal_fee_credited_to_upgrade') == True and appraisal_paid < P('appraisal_fee'))
      else 0.0)
  - claims_on_cover: CFIELD('protection','claims_settled_count', covered_item_sku=F('original_item_sku'))
  - cover_bonus: K('cover_bonus_clean') if (EXISTS('protection', covered_item_sku=F('original_item_sku'), status='active')
      and claims_on_cover == 0) else (K('cover_bonus_claimed') if (EXISTS('protection', covered_item_sku=F('original_item_sku'),
      status='active') and claims_on_cover > 0) else 0.0)
  - declared_value: LATEST('tradein_intake','requested_amount', date_field='effective_date', request_status='customer_confirmed')
  - credit_ceiling: P('maximum_credit_amount') if (declared_value != None and declared_value > P('maximum_credit_amount'))
      else (declared_value if (declared_value != None and declared_value <= P('maximum_credit_amount')) else F('original_purchase_price'))
  - result: RND(MN(credit_gross + fee_credit + cover_bonus, credit_ceiling), 2)
  compute_basis:
    valuation_entries: Where the registration's entries carry a valuation of the piece and the appraisal register
      carries a report on the piece issued within the programme's appraisal validity window, the credit rests
      instead on the highest valuation those entries carry
    entries_valuation: The credit rests on the price the piece originally sold for. Where the registration's entries
      carry a valuation of the piece and the appraisal register carries a report on the piece issued within the
      programme's appraisal validity window, the credit rests instead on the highest valuation those entries carry;
      and where the entries carry a valuation of the piece but the register carries no report on it issued within
      that window, the credit rests on the lower of the highest valuation those entries carry and the price the
      piece originally sold for.
    member_tier_name: Where the customer's membership stands above Belrose Circle Gold and they have held the
      piece for at least ten years, the share is eighty-five percent
    ownership_days: where their membership stands above Belrose Circle Gold and they have held the piece for less
      than ten years, the share is seventy-eight percent
    credit_share_pct: Where the customer's membership stands above Belrose Circle Gold and they have held the
      piece for at least ten years, the share is eighty-five percent; where their membership stands above Belrose
      Circle Gold and they have held the piece for less than ten years, the share is seventy-eight percent; otherwise
      the share is the one the programme publishes for a current appraised value.
    credit_gross: the share is taken on the figure the credit rests on first and rounded to two decimal places
    appraisal_paid: Where the programme credits its appraisal fee against the upgrade and the payments taken on
      the appraisal of the piece cover that fee in full, the programme's appraisal fee is added
    fee_credit: Nothing is added for the appraisal fee. Where the programme credits its appraisal fee against
      the upgrade and the payments taken on the appraisal of the piece cover that fee in full, the programme's
      appraisal fee is added; and where the programme credits its appraisal fee against the upgrade and those
      payments fall short of it, what has been paid is added.
    claims_on_cover: Where the piece is covered by a plan in force and no claim has been settled on that cover,
      four hundred is added
    cover_bonus: Nothing is added for the cover the piece was kept under. Where the piece is covered by a plan
      in force and no claim has been settled on that cover, four hundred is added; and where the piece is covered
      by a plan in force and a claim has been settled on that cover, one hundred and fifty is added.
    declared_value: Where the value the customer declared the piece at stands on the upgrade desk's request record
      and exceeds the programme's largest credit for one traded piece, the credit is held instead to that largest
      credit
    credit_ceiling: The credit issued is held to the price the piece originally sold for. Where the value the
      customer declared the piece at stands on the upgrade desk's request record and exceeds the programme's largest
      credit for one traded piece, the credit is held instead to that largest credit; and where the value they
      declared stands on that record and is at or below the programme's largest credit, the credit is held to
      the value they declared.
    result: 'The order is fixed: the share is taken on the figure the credit rests on first and rounded to two
      decimal places, the appraisal fee addition and the cover addition are added to that figure, and the ceiling
      is applied last, the result being rounded to two decimal places at that final step only.'
    entries_valuation_high: Where the registration's entries carry a valuation of the piece and the appraisal
      register carries a report on the piece issued within the programme's appraisal validity window, the credit
      rests instead on the highest valuation those entries carry
    current_report_age_days: Where the registration's entries carry a valuation of the piece and the appraisal
      register carries a report on the piece issued within the programme's appraisal validity window, the credit
      rests instead on the highest valuation those entries carry
  factors:
  - id: valuation_the_credit_rests_on
    effect: method
    decides: entries_valuation
    bindings:
    - valuation_entries
    - entries_valuation_high
    - current_report_age_days
    - entries_valuation
    ladder:
    - when: the registration's entries carry a valuation of the piece and the appraisal register carries a report
        on the piece issued within the programme's appraisal validity window
      method: the credit rests on the highest valuation those entries carry
    - when: the registration's entries carry a valuation of the piece but the register carries no report on it
        issued within that window
      method: the credit rests on the lower of the highest valuation those entries carry and the price the piece
        originally sold for
    - when: otherwise
      method: the credit rests on the price the piece originally sold for
    baseline:
      entries_valuation: F('original_purchase_price')
    evidence:
    - history
    - cross_category
    - date
    cross_difficulty: appraisal
  - id: loyal_holder_share
    effect: parameter
    decides: credit_share_pct
    bindings:
    - member_tier_name
    - ownership_days
    - credit_share_pct
    ladder:
    - when: the customer's membership stands above Belrose Circle Gold and they have held the piece for at least
        ten years
      value: K('share_loyal_long')
    - when: the customer's membership stands above Belrose Circle Gold and they have held the piece for less than
        ten years
      value: K('share_loyal')
    - when: otherwise
      value: P('credit_pct_of_current_appraisal')
    baseline:
      credit_share_pct: P('credit_pct_of_current_appraisal')
    evidence:
    - cross_category
    - date
    cross_difficulty: circle
  - id: appraisal_fee_addition
    effect: parameter
    decides: fee_credit
    bindings:
    - appraisal_paid
    - fee_credit
    ladder:
    - when: the programme credits its appraisal fee against the upgrade and the payments taken on the appraisal
        of the piece cover that fee in full
      value: P('appraisal_fee')
    - when: the programme credits its appraisal fee against the upgrade and those payments fall short of it
      value: what has been paid on the appraisal of the piece
    - when: otherwise
      value: '0.0'
    baseline:
      fee_credit: '0.0'
    evidence:
    - cross_category
    cross_difficulty: appraisal
  - id: cover_addition
    effect: parameter
    decides: cover_bonus
    bindings:
    - claims_on_cover
    - cover_bonus
    ladder:
    - when: the piece is covered by a plan in force and no claim has been settled on that cover
      value: K('cover_bonus_clean')
    - when: the piece is covered by a plan in force and a claim has been settled on that cover
      value: K('cover_bonus_claimed')
    - when: otherwise
      value: '0.0'
    baseline:
      cover_bonus: '0.0'
    evidence:
    - cross_category
    cross_difficulty: protection
  - id: credit_ceiling_held_to
    effect: parameter
    decides: credit_ceiling
    bindings:
    - declared_value
    - credit_ceiling
    ladder:
    - when: the value the customer declared the piece at stands on the upgrade desk's request record and exceeds
        the programme's largest credit for one traded piece
      value: P('maximum_credit_amount')
    - when: the value the customer declared the piece at stands on that record and is at or below the programme's
        largest credit
      value: the value the customer declared the piece at
    - when: otherwise
      value: F('original_purchase_price')
    baseline:
      credit_ceiling: F('original_purchase_price')
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: 'The credit issued is the share the programme publishes for a current appraised value, taken on the
      figure the credit rests on, with the appraisal fee addition and the cover addition added to it and the whole
      held to its ceiling. The credit rests on the price the piece originally sold for. Nothing is added for the
      appraisal fee. Nothing is added for the cover the piece was kept under. The credit issued is held to the
      price the piece originally sold for. The order is fixed: the share is taken on the figure the credit rests
      on first and rounded to two decimal places, the appraisal fee addition and the cover addition are added
      to that figure, and the ceiling is applied last, the result being rounded to two decimal places at that
      final step only.'
    params:
    - credit_pct_of_current_appraisal
    - maximum_credit_amount
  inputs:
    history:
    - table: tradein_ledger
      aggregate: count
      filters:
        event_type: tradein_item_valuation_logged
    - table: tradein_ledger
      aggregate: max
      field: amount
      filters:
        event_type: tradein_item_valuation_logged
    - table: tradein_intake
      aggregate: latest
      field: requested_amount
      filters:
        request_status: customer_confirmed
    - category: appraisal
      table: appraisal_ledger
      aggregate: sum
      field: amount
      filters:
        event_type: appraisal_payment_received
    cross_category:
    - circle
    - appraisal
    - protection
