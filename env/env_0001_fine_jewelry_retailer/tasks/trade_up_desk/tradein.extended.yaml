      aggregate: count
      filters:
        event_type: tradein_credit_redeemed
    - table: tradein_ledger
      aggregate: max
      field: amount
      filters:
        event_type: tradein_item_valuation_logged
    cross_category:
    - circle
- id: tradein_ext_credit_redemption
  base_policy_refs:
  - tradein_redemption
  - tradein_agg_credit_stacking
  overwrite: []
  trigger: on_request
  subject:
  - tradein_credit_redeemed
  - tradein_credit_partially_spent
  computes: credit_applied_amount
  target_tool: spend_upgrade_credit_c2e2bb76
  params:
    apply_share_multi: 100.0
    apply_share_single: 80.0
    apply_share_standard: 60.0
    holdback_inspected: 500.0
    holdback_uninspected: 1500.0
    release_share_covered: 40.0
    release_share_plain: 20.0
  rule: 'Credit is applied to a sale only after the registration carries the least the customer must spend worked
    out against the credit as it now stands. The credit put toward a new piece is the credit the registration
    shows as issued, taken at the share the desk lets go on one sale, which is sixty percent. Where a spend already
    stands among the registration''s entries and the programme allows the credit to be spent in parts, the credit
    still available is instead read as the sum of every entry booked to the registration that moves the credit;
    and where a spend already stands among those entries and the programme does not allow the credit to be spent
    in parts, nothing is left to put toward the sale. An entry moves the credit where it books the credit, revalues
    it upward, spends it or takes it away; a valuation entry and an inspection entry move nothing, whatever amount
    they carry. Where the programme allows more than one credit on one sale and the customer''s membership stands
    above Belrose Circle Silver, the share is the whole of the credit still available; where the programme allows
    only one credit on one sale and the customer''s membership stands above Belrose Circle Silver, the share is
    eighty percent. Nothing is held back against the window in which the traded piece may still be taken back.
    Where the credit was issued within that window and the registration''s entries carry a condition inspection
    of the piece, five hundred is held back; and where the credit was issued within that window and those entries
    carry no condition inspection, fifteen hundred is held back. Nothing is added for spending above the least
    the customer must spend. Where the least the customer must spend stands above the credit still available and
    the credit has longer than a month left to run, the amount spent above the least the customer must spend is
    the price of the new piece less the least the customer must spend; and where the least the customer must spend
    stands at or below the credit still available and the credit has longer than a month left to run, it is the
    price of the new piece less the credit still available. Where the price of the new piece reaches twice the
    credit still available and cover for a piece stands quoted on the customer''s file, two fifths of that amount
    is added; and where the price of the new piece reaches twice the credit still available and no cover stands
    quoted, a fifth of it is added. The price of the new piece is read as the least the customer must spend that
    the registration records. Where the customer''s loyalty account carries a merchandise sale for the current
    month and cover for a piece stands quoted on their file, the price of the new piece is read as the spend that
    account records against its most recent merchandise sale; and where that account carries no merchandise sale
    for the current month but cover for a piece stands quoted, it is read as the value the quoted cover records
    for the piece. The share is taken first and rounded to two decimal places, what is added for spending above
    the least the customer must spend is rounded to two decimal places on its own, what is held back is then taken
    off, the figure is not taken below nothing, and the result is rounded to two decimal places at that final
    step only.

    '
  prerequisite:
  - problem: tradein_ext_upgrade_minimum_spend
    kind: value_input
    form: state
    gate: excess_spend
    policy_source: Credit is applied to a sale only after the registration carries the least the customer must
      spend worked out against the credit as it now stands.
    condition: The registration's recorded least the customer must spend answers to the credit the registration's
      entries now carry.
    resolved_by: update_upgrade_minimum_spend_70148cfb
    effect: The registration's recorded least the customer must spend becomes the figure the credit now standing
      calls for, so the sale may be measured against it and the amount spent above it is read from it.
  cross_category:
  - category: circle
    as: history
    reads:
    - variant_name
    - circle_ledger.qualifying_spend
    - circle_ledger.earn_category
    note: the membership tier decides the share of the credit that may go on one sale, and the loyalty account's
      merchandise entries for the current month give the price of the new piece
  - category: protection
    as: existence
    reads:
    - status
    - item_value_at_purchase
    note: cover standing quoted on the customer's file decides how much of the spend above the least the customer
      must spend is added, and carries the value of the new piece where the loyalty account records no sale
  compute:
  - redemptions_booked: COUNT('tradein_ledger', event_type='tradein_credit_redeemed')
  - movements_all: SUM('tradein_ledger','amount', event_type='tradein_credit_granted') + SUM('tradein_ledger','amount',
      event_type='tradein_credit_revaluation_applied') + SUM('tradein_ledger','amount', event_type='tradein_credit_redeemed')
      + SUM('tradein_ledger','amount', event_type='tradein_credit_forfeited')
  - available_credit: movements_all if (redemptions_booked >= 1 and P('credit_partially_redeemable') == True)
      else (0.0 if (redemptions_booked >= 1 and P('credit_partially_redeemable') == False) else F('issued_credit_amount'))
  - member_tier_name: CFIELD('circle','variant_name')
  - apply_share_pct: K('apply_share_multi') if (P('max_credits_per_purchase') > 1 and (member_tier_name != 'Belrose
      Circle Member' and member_tier_name != 'Belrose Circle Silver')) else (K('apply_share_single') if (P('max_credits_per_purchase')
      <= 1 and (member_tier_name != 'Belrose Circle Member' and member_tier_name != 'Belrose Circle Silver'))
      else K('apply_share_standard'))
  - applied_gross: RND(available_credit * apply_share_pct / 100.0, 2)
  - days_since_issue: DAYS(F('issued_date'), NOW)
  - inspections_on_registration: COUNT('tradein_ledger', event_type='tradein_condition_inspection_logged')
  - holdback: K('holdback_inspected') if (days_since_issue <= P('item_return_window_days') and inspections_on_registration
      >= 1) else (K('holdback_uninspected') if (days_since_issue <= P('item_return_window_days') and inspections_on_registration
      == 0) else 0.0)
  - merch_sales_month: XCOUNT('circle','circle_ledger', earn_category='merchandise', within_months=1, date_field='posted_date')
  - merch_latest_spend: XLATEST('circle','circle_ledger','qualifying_spend', date_field='posted_date', earn_category='merchandise')
  - quoted_cover_value: CFIELD('protection','item_value_at_purchase', status='quoted')
  - new_piece_price: merch_latest_spend if (merch_sales_month >= 1 and EXISTS('protection', status='quoted'))
      else (quoted_cover_value if (merch_sales_month == 0 and EXISTS('protection', status='quoted')) else F('upgrade_minimum_spend'))
  - months_to_expiry: MONTHS(NOW, F('expiry_date'))
  - excess_spend: MX(new_piece_price - F('upgrade_minimum_spend'), 0.0) if (F('upgrade_minimum_spend') > available_credit
      and months_to_expiry > 1) else (MX(new_piece_price - available_credit, 0.0) if (F('upgrade_minimum_spend')
      <= available_credit and months_to_expiry > 1) else 0.0)
  - cover_quoted: 1 if EXISTS('protection', status='quoted') else 0
  - release_share_pct: K('release_share_covered') if (new_piece_price >= 2 * available_credit and cover_quoted
      == 1) else (K('release_share_plain') if (new_piece_price >= 2 * available_credit and cover_quoted == 0)
      else 0.0)
  - result: MX(0.0, RND(applied_gross + RND(excess_spend * release_share_pct / 100.0, 2) - holdback, 2))
  compute_basis:
    redemptions_booked: Where a spend already stands among the registration's entries and the programme allows
      the credit to be spent in parts, the credit still available is instead read as the sum of every entry booked
      to the registration that moves the credit
    available_credit: The credit put toward a new piece is the credit the registration shows as issued, taken
      at the share the desk lets go on one sale, which is sixty percent. Where a spend already stands among the
      registration's entries and the programme allows the credit to be spent in parts, the credit still available
      is instead read as the sum of every entry booked to the registration that moves the credit; and where a
      spend already stands among those entries and the programme does not allow the credit to be spent in parts,
      nothing is left to put toward the sale.
    member_tier_name: Where the programme allows more than one credit on one sale and the customer's membership
      stands above Belrose Circle Silver, the share is the whole of the credit still available
    apply_share_pct: Where the programme allows more than one credit on one sale and the customer's membership
      stands above Belrose Circle Silver, the share is the whole of the credit still available; where the programme
      allows only one credit on one sale and the customer's membership stands above Belrose Circle Silver, the
      share is eighty percent.
    applied_gross: The share is taken first and rounded to two decimal places
    days_since_issue: Where the credit was issued within that window and the registration's entries carry a condition
      inspection of the piece, five hundred is held back
    inspections_on_registration: where the credit was issued within that window and those entries carry no condition
      inspection, fifteen hundred is held back
    holdback: Nothing is held back against the window in which the traded piece may still be taken back. Where
      the credit was issued within that window and the registration's entries carry a condition inspection of
      the piece, five hundred is held back; and where the credit was issued within that window and those entries
      carry no condition inspection, fifteen hundred is held back.
    merch_sales_month: Where the customer's loyalty account carries a merchandise sale for the current month and
      cover for a piece stands quoted on their file, the price of the new piece is read as the spend that account
      records against its most recent merchandise sale
    merch_latest_spend: Where the customer's loyalty account carries a merchandise sale for the current month
      and cover for a piece stands quoted on their file, the price of the new piece is read as the spend that
      account records against its most recent merchandise sale
    quoted_cover_value: where that account carries no merchandise sale for the current month but cover for a piece
      stands quoted, it is read as the value the quoted cover records for the piece
    new_piece_price: The price of the new piece is read as the least the customer must spend that the registration
      records. Where the customer's loyalty account carries a merchandise sale for the current month and cover
      for a piece stands quoted on their file, the price of the new piece is read as the spend that account records
      against its most recent merchandise sale; and where that account carries no merchandise sale for the current
      month but cover for a piece stands quoted, it is read as the value the quoted cover records for the piece.
    months_to_expiry: Where the least the customer must spend stands above the credit still available and the
      credit has longer than a month left to run, the amount spent above the least the customer must spend is
      the price of the new piece less the least the customer must spend
    excess_spend: Nothing is added for spending above the least the customer must spend. Where the least the customer
      must spend stands above the credit still available and the credit has longer than a month left to run, the
      amount spent above the least the customer must spend is the price of the new piece less the least the customer
      must spend; and where the least the customer must spend stands at or below the credit still available and
      the credit has longer than a month left to run, it is the price of the new piece less the credit still available.
    cover_quoted: Where the price of the new piece reaches twice the credit still available and cover for a piece
      stands quoted on the customer's file, two fifths of that amount is added
    release_share_pct: Where the price of the new piece reaches twice the credit still available and cover for
      a piece stands quoted on the customer's file, two fifths of that amount is added; and where the price of
      the new piece reaches twice the credit still available and no cover stands quoted, a fifth of it is added.
    result: The share is taken first and rounded to two decimal places, what is added for spending above the least
      the customer must spend is rounded to two decimal places on its own, what is held back is then taken off,
      the figure is not taken below nothing, and the result is rounded to two decimal places at that final step
      only.
  factors:
  - id: available_credit_reading
    effect: method
    decides: available_credit
    bindings:
    - redemptions_booked
    - available_credit
    ladder:
    - when: a spend already stands among the registration's entries and the programme allows the credit to be
        spent in parts
      method: the credit still available is read as the sum of every entry booked to the registration that moves
        the credit
    - when: a spend already stands among the registration's entries and the programme does not allow the credit
        to be spent in parts
      method: nothing is left to put toward the sale
    - when: otherwise
      method: the credit still available is read as the credit the registration shows as issued
    baseline:
      available_credit: F('issued_credit_amount')
    evidence:
    - history
    cross_difficulty: null
  - id: single_sale_share
    effect: parameter
    decides: apply_share_pct
    bindings:
    - member_tier_name
    - apply_share_pct
    ladder:
    - when: the programme allows more than one credit on one sale and the customer's membership stands above Belrose
        Circle Silver
      value: K('apply_share_multi')
    - when: the programme allows only one credit on one sale and the customer's membership stands above Belrose
        Circle Silver
      value: K('apply_share_single')
    - when: otherwise
      value: K('apply_share_standard')
    baseline:
      apply_share_pct: K('apply_share_standard')
    evidence:
