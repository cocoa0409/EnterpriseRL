- id: tradein_credit_grant
  subject:
  - tradein_credit_granted
  - tradein_credit_revaluation_applied
  rule: 'The credit is booked as available to spend on the day it is issued, and it is booked once against the
    registration it belongs to. Credit is booked, and later revalued, only while the registration stands at credit
    issued or partially redeemed. On the programmes that allow it, an issued credit may be revalued upward inside
    the programme''s revaluation window, counted from the day the credit was issued, and the increase is booked
    as its own entry. The revaluation window is counted in whole calendar days from the day the credit was issued,
    that day counting as day zero, weekends and store holidays included. A credit is never revalued downward once
    issued: where the piece proves to be worth less than valued, the credit is withdrawn in full and the piece
    returned rather than quietly reduced.'
