    cross_difficulty: protection
  - id: new_piece_price_reading
    effect: method
    decides: new_piece_price
    bindings:
    - merch_sales_month
    - merch_latest_spend
    - quoted_cover_value
    - new_piece_price
    ladder:
    - when: the customer's loyalty account carries a merchandise sale for the current month and cover for a piece
        stands quoted on their file
      method: the price of the new piece is read as the spend that account records against its most recent merchandise
        sale
    - when: the customer's loyalty account carries no merchandise sale for the current month and cover for a piece
