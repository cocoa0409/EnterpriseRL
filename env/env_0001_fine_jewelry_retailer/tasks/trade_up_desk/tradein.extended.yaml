  inputs:
    history:
    - table: tradein_ledger
      aggregate: sum
      field: amount
      filters: {}
    - table: tradein_ledger
      aggregate: count
      filters:
        event_type: tradein_credit_redeemed
    - table: tradein_ledger
      aggregate: count
      filters:
        event_type: tradein_condition_inspection_logged
    - category: circle
      table: circle_ledger
      aggregate: count
      within_months: 1
      filters:
        earn_category: merchandise
    - category: circle
      table: circle_ledger
      aggregate: latest
      field: qualifying_spend
      filters:
