- id: tradein_condition_grading
  subject:
  - tradein_condition_inspection_logged
  - tradein_valuation_requested
  rule: Every traded piece is inspected and graded before any credit is issued, and the grade is recorded against
    the registration. An inspection is logged only while the registration stands at registered, appraisal pending
    or credit issued. A piece graded outside the condition grades the programme accepts is refused, and the customer
    is offered the standard trade-in instead where that programme accepts the grade. The valuation is reduced
    by the programme's deduction for the grade the piece was found at, and where the deduction is the whole of
    the valuation no credit is issued. A grade recorded by the appraiser stands over the customer's own description
    of the piece's condition, however carefully the customer described it.
