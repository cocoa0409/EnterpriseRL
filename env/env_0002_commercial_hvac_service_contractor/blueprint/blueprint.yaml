name: commercial_hvac_service_contractor
company: Halvorsen Mechanical & Controls, Inc.

background: |
  Halvorsen Mechanical & Controls, Inc. is a commercial mechanical contractor of about four hundred people
  that installs, maintains and operates heating, ventilation, air conditioning and building automation
  systems for commercial property owners across one metropolitan region and its outlying corridors. Its
  customers are building owners and property management companies rather than households: office parks,
  medical office buildings, warehouses, light industrial plants, schools, data centres, retail centres and
  multifamily portfolios, each holding a file of buildings, an equipment register of rooftop units, split
  systems, heat pumps, air handlers, chillers, boilers, cooling towers and computer room units, and a running
  history of visits, tickets, invoices and projects. The client services desk sells and services six product
  lines, all of them contracts the owner holds rather than one-off sales. Preventive Maintenance Agreements
  run from the Filter & Belt Service Plan and the Inspection Agreement through the Preventive Maintenance
  Agreement, the Labor Coverage Agreement and the Full Coverage Agreement to the Comprehensive Performance
  Agreement, each carrying a scheduled visit programme against a named equipment schedule and billed by
  instalment. Demand Service Rate Programs — the Time & Material Account, the Priority Response Program, the
  Block Hour Service Program, the Emergency Response Program, the Critical Facility Response Program and the
  Dedicated Technician Program — set the labor rates, the response commitments and the prepaid hour blocks a
  customer's emergency and repair calls are dispatched under. Building Automation Service Plans run from the
  Controls Help Desk Subscription and the Alarm Monitoring Plan through the Scheduled Controls Service Plan,
  the Software Assurance & Upgrade Plan and the Remote Optimization Plan to the Integrated Building
  Automation Partnership, covering controls tickets, monitored alarms, software and the point licence at one
  building's controls database. Energy Monitoring & Performance Subscriptions run from the Utility Bill
  Tracking Subscription and the Metering & Dashboard Subscription through the Energy Analytics Subscription
  and the Fault Detection & Diagnostics Subscription to the Measurement & Verification Program and the
  Managed Energy Performance Program, each holding a metered baseline, a reporting cycle and, at the upper
  tiers, a savings commitment. Equipment Replacement & Retrofit Projects are written as the Equipment
  Replacement Order, the Planned Replacement Program, the Controls Retrofit Project, the Energy Retrofit
  Project, the Turnkey Mechanical Upgrade Project and the Design-Build Infrastructure Program, each with a
  contract value, a progress billing schedule and a closeout. Alongside them the company sells Extended
  Equipment Warranty Plans — the Manufacturer Warranty Registration, the Parts Protection Plan, the Parts &
  Labor Protection Plan, the Compressor Coverage Plan, the Major Component Protection Plan and the Total
  Equipment Protection Plan — and Indoor Air Quality & Filtration Programs, from the Filter Supply Program
  and the Managed Filtration Program through the Coil Hygiene Program, the Air Quality Monitoring Program and
  the UV & Purification Service Program to the Certified Indoor Air Quality Program. A typical caller is a
  facilities manager or a property accountant who holds a maintenance agreement at two or three buildings, a
  rate program at account level, and perhaps a controls plan or an open project, and who rings about a visit,
  an invoice line, a breakdown, a renewal notice or a piece of equipment that has just failed. The desk takes
  those calls all day, in a plain, unhurried, trades-office voice, with the customer's records, work orders
  and invoices open in front of it.

logs:
  verification_log_table: identity_verifications
  handoff_log_table: agent_handoffs

difficulties:
  - name: maintenance_agreement_desk
    claim:
      categories: [maintenance]
      event_types: [maintenance_agreement_proposed, maintenance_agreement_activated, maintenance_agreement_renewed, maintenance_renewal_window_opened, maintenance_agreement_suspended, maintenance_agreement_reinstated, maintenance_agreement_cancelled, maintenance_agreement_expired, maintenance_proposal_closed, maintenance_schedule_updated, maintenance_visit_scheduled, maintenance_visit_completed, maintenance_report_issued, maintenance_visit_entitlement_credited, maintenance_repair_allowance_credited, maintenance_covered_repair_applied, maintenance_installment_charged, maintenance_fee_charged, maintenance_payment_received, maintenance_credit_issued]
    summary: >
      The callers on this desk are facilities managers and property accountants who hold Preventive Maintenance
      Agreements at one or several buildings and ring about the visit programme, the coverage of a repair, a
      fee on an instalment invoice, a schedule change, a renewal notice or a suspension for arrears, and the
      difficulty of any one call comes from where their agreement sits in the cross-product of tier, status,
      portfolio and history: the same request is answered differently under the Filter & Belt Service Plan, the
      Preventive Maintenance Agreement and the Full Coverage Agreement, differently again while the agreement
      stands in pending_renewal or suspended rather than active, and differently once the owner holds three
      agreements rather than one or has already used most of the term's visits or repair allowance. The records
      in play are the agreement and its equipment schedule, the site's equipment register with each unit's
      install date and type, the visit and repair rows, the instalment and fee ledger, and the intake records
      that carry signatures and written notices; the governing rules gate on fields and statuses
      (maintenance_entry_qualification on unit age, unit count and a completed pre-agreement inspection,
      maintenance_activation_and_entitlement on a recorded signature inside the proposal validity,
      maintenance_visit_scheduling and maintenance_repair_coverage on the agreement's status) and price by
      per-tier tables (maintenance_annual_pricing, maintenance_agg_multi_site_discount,
      maintenance_visit_completion_and_report, maintenance_missed_visit_credit,
      maintenance_billing_and_late_fee, maintenance_suspension_and_reinstatement, maintenance_renewal,
      maintenance_termination_for_convenience, maintenance_portfolio_interaction), while the natural order of
      the domain — a proposal is signed before a term runs, a term credits entitlement before visits consume
      it, an invoice falls due before arrears suspend anything — is background to the desk rather than a rule
      of any one call. Most of the work is the agent's own: reading the agreement and the ledger, pricing a
      change, booking or crediting a visit, applying a repair against the allowance, raising a fee or a credit,
      suspending or reinstating coverage; the acts that only the building owner can perform — signing a
      proposal so the term may begin, giving written notice of non-renewal or of termination, accepting a
      renewal at a named tier, authorising a mid-term equipment change — are handed over to the customer rather
      than performed on their behalf, however clearly they have said on the call what they want. Genuinely
      uncovered ground exists and belongs in a POLICY_NOT_COVERED handoff: a request to waive the equipment age
      limit or to backdate coverage over a failure that has already happened, a demand for compensation beyond
      the missed visit credit the tier defines, a claim that a visit was performed which no work order records,
      a request to move an agreement to a building the company does not serve, and any request to settle a
      dispute about an invoice the agreement's own rules do not price.
  - name: service_dispatch_desk
    claim:
      categories: [service]
      event_types: [service_program_requested, service_program_activated, service_enrollment_declined, service_renewal_window_opened, service_program_renewed, service_program_suspended, service_program_reinstated, service_program_expired, service_program_cancelled, service_program_updated, service_call_dispatched, service_call_completed, service_block_hours_purchased, service_emergency_allowance_credited, service_emergency_call_used, service_quote_issued, service_invoice_charged, service_payment_received, service_credit_issued]
    summary: >
      This desk takes the breakdown calls and the arguments about what a breakdown cost: a building with no
      cooling in August, a tenant complaint that has become an emergency, a quote that needs approving before a
      technician can start, a block of prepaid hours running out mid-repair, an invoice whose labor line the
      owner disputes, and a missed response the owner wants credited. The setting varies by the tier of the
      Demand Service Rate Program the account holds — from the Time & Material Account, which accepts no
      after-hours dispatch and carries no response guarantee, to the Critical Facility Response Program and the
      Dedicated Technician Program — by whether the program stands active, pending_renewal, suspended or
      expired, by whether the account also holds a maintenance agreement covering the very unit that failed,
      and by what the year's history already holds: emergency calls used, block hours drawn, callbacks on the
      same work order. The records are the rate program, the dispatch and completion rows with their
      timestamps and hour bands, the block purchases and their expiry, the quote and its approval, and the
      invoice ledger; the rules gate dispatch and work on fields and statuses (service_dispatch_and_response on
      program status and the classification of the call, service_quote_and_approval on a recorded approval
      against the quote number, service_callback_warranty on the original work order,
      service_enrollment_qualification on site count and credit standing) and price by per-tier tables (service_labor_billing,
      service_block_hour_drawdown, service_emergency_entitlement, service_response_guarantee_credit,
      service_billing_and_late_fee, service_suspension_and_reinstatement, service_renewal_and_cancellation,
      service_portfolio_interaction), with the ordinary order of the domain — a call is accepted before a
      technician arrives, work is quoted before it is approved, an invoice is raised before it can be
      disputed — as background rather than as any rule's content. The agent classifies and dispatches, applies
      the right rate band and minimum, draws or bills hours, credits a missed guarantee, suspends or reinstates
      dispatch privileges and hands work to the covering agreement where one exists; what only the customer can
      do — approving a quoted repair above the tier's threshold, ordering a block of prepaid hours, signing the
      enrollment, giving written notice of cancellation — is handed to them. Requests that no policy can
      decide belong in a POLICY_NOT_COVERED handoff: a demand to reclassify a comfort complaint as an emergency
      to force a faster guarantee, a claim for consequential loss such as spoiled stock or lost tenancy, a
      request to dispatch under a program the account does not hold or to a building outside the service
      regions, a request to waive labor already performed and correctly billed, and any credit for lateness at a
      tier whose credit rate is zero.
  - name: controls_support_desk
    claim:
      categories: [controls]
      event_types: [controls_plan_quoted, controls_plan_activated, controls_quote_declined, controls_renewal_window_opened, controls_plan_renewed, controls_plan_suspended, controls_plan_reinstated, controls_plan_expired, controls_plan_cancelled, controls_coverage_updated, controls_ticket_opened, controls_ticket_resolved, controls_support_hours_credited, controls_alarm_raised, controls_alarm_response_used, controls_alarm_allowance_credited, controls_software_update_applied, controls_invoice_charged, controls_payment_received, controls_credit_issued]
    summary: >
      The callers here are building engineers and facilities managers who hold a Building Automation Service
      Plan at one or more buildings and ring about a schedule that did not change over a holiday weekend, an
      alarm nobody acted on, a graphics page that needs editing, a controller that will not come back online, a
      software upgrade quote, a point count that grew since the plan was written, or a licence true-up they do
      not recognise on the invoice. What the desk may do turns on the tier — the Controls Help Desk
      Subscription watches no alarms at all and answers only in business hours, while the Remote Optimization
      Plan and the Integrated Building Automation Partnership answer around the clock and carry large support
      pools — on the plan's status, on whether the building's automation plan is the one feeding an energy
      subscription's data, and on how much of the year's support pool, alarm allowance, monthly schedule
      changes and graphics edits the customer has already consumed. The records are the plan with its covered
      points and panels and controller generation, the ticket and alarm rows with their timestamps, the software
      update history, the intake records carrying surveys, acceptances and notices, and the invoice ledger; the
      rules gate on fields and statuses (controls_plan_qualification on controller generation, supported
      protocols, a completed site survey and a maintenance agreement at the building, controls_support_handling
      on plan status, controls_activation_and_entitlement on a recorded acceptance) and meter everything else
      by per-tier tables (controls_agg_portfolio_point_pricing, controls_alarm_monitoring,
      controls_software_and_security, controls_billing_and_late_fee, controls_suspension_and_reinstatement,
      controls_renewal_and_cancellation, controls_portfolio_interaction), while the domain's natural order —
      a plan is accepted before its connection is commissioned, an alarm is raised before it is acknowledged,
      a point is added before it is licensed — is background to the desk. The agent logs and resolves tickets,
      draws hours from the pool or bills the overage, records alarm responses and their overages, applies
      patches and updates, amends the covered point count, suspends and reinstates monitoring, and prices
      upgrades; the acts reserved to the customer — accepting a plan quote or a renewal, authorising a major
      version upgrade, giving written notice of non-renewal or cancellation, approving a point change that
      raises the fee — are handed over. The uncovered ground that ends in a POLICY_NOT_COVERED handoff includes
      a request to monitor alarms at a tier that includes no monitoring, a demand for compensation because an
      unwatched alarm went unanswered at such a tier, a request to support a controller generation or a
      protocol outside every tier's list, a request to restore a controls database older than the tier's
      retention, and any claim arising from a third party's changes to the controls system.
  - name: energy_services_desk
    claim:
      categories: [energy]
      event_types: [energy_subscription_quoted, energy_onboarding_started, energy_subscription_activated, energy_quote_declined, energy_renewal_window_opened, energy_subscription_renewed, energy_subscription_suspended, energy_subscription_reinstated, energy_subscription_expired, energy_subscription_cancelled, energy_coverage_updated, energy_meter_reading_posted, energy_report_issued, energy_analysis_delivered, energy_analyst_hours_credited, energy_fault_flagged, energy_savings_verified, energy_guarantee_credited, energy_shortfall_paid, energy_invoice_charged, energy_payment_received, energy_credit_issued]
    summary: >
      This desk answers owners and asset managers who hold an Energy Monitoring & Performance Subscription and
      ring about a report that has not arrived, a dashboard reading that disagrees with the utility bill, a
      flagged fault they want explained or worked, an analyst study they want run, a meter added at the
      building, or — at the tiers that carry a guarantee — a true-up that did not deliver the savings they were
      promised. The settings that make such a call hard are the tier's reach (the Utility Bill Tracking
      Subscription measures nothing on site and watches for no faults, while the Measurement & Verification
      Program and the Managed Energy Performance Program carry savings guarantees and shortfall payments), the
      subscription's status including the onboarding state where data is not yet flowing, whether the building's
      data comes from its own meters or from an automation plan's controls points, and what the year already
      holds: analyst hours drawn, faults flagged and notified, true-ups verified, and whether a retrofit at the
      same building has moved the baseline. The records are the subscription with its fixed baseline and meter
      count, the meter readings from both the meters and the bills, the report, study, fault and verification
      rows, and the invoice ledger; the rules gate on fields and statuses (energy_subscription_qualification on
      meter count, an automation plan at the building and a completed survey, energy_onboarding_and_baseline on
      a recorded acceptance and the onboarding window, energy_analyst_services on subscription status,
      energy_savings_guarantee on a verified shortfall) and quantify by per-tier tables
      (energy_agg_portfolio_meter_pricing, energy_data_and_reporting, energy_fault_detection,
      energy_billing_and_late_fee, energy_suspension_and_reinstatement, energy_renewal_and_exit,
      energy_portfolio_interaction), with the domain's usual order — data is onboarded before a baseline is
      fixed, a period closes before it is reported, savings are verified before a shortfall is paid — as
      background only. The agent posts readings, issues reports and credits late ones, delivers and bills
      analyst studies, flags and notifies faults, verifies savings and pays a verified shortfall, amends meters
      and users, and suspends or reinstates reporting; the customer alone accepts a quote or a renewal, gives
      written notice of cancellation, authorises meters to be added at their cost, and lodges the claim on a
      guarantee. Uncovered ground calling for a POLICY_NOT_COVERED handoff includes a demand for a savings
      payment at a tier that carries no guarantee, a claim for a shortfall the verification attributes to the
      owner's own occupancy or equipment changes, a request to certify or submit a building's energy
      performance where the tier does not include it, a request to reconstruct a baseline from data the
      subscription never collected, and any request to change a signed-off verification after the fact.
  - name: retrofit_projects_desk
    claim:
      categories: [retrofit]
      event_types: [retrofit_project_estimated, retrofit_project_awarded, retrofit_estimate_declined, retrofit_project_scheduled, retrofit_work_started, retrofit_substantial_completion, retrofit_project_closed, retrofit_project_cancelled, retrofit_scope_updated, retrofit_equipment_delivered, retrofit_inspection_passed, retrofit_change_order_issued, retrofit_change_allowance_credited, retrofit_progress_billed, retrofit_retainage_withheld, retrofit_retainage_released, retrofit_payment_received, retrofit_credit_issued]
    summary: >
      The callers on this desk are owners, property managers and their accountants with an Equipment
      Replacement & Retrofit Project somewhere between estimate and closeout, ringing about a lead time that
      has slipped, a deposit that holds up the equipment order, a change order they did not expect, a progress
      invoice whose percentage they dispute, retainage they want released, a late completion they believe
      carries damages, or a project they now want to stop. The hard settings come from the project class — an
      Equipment Replacement Order carries no retainage, no change allowance and no schedule guarantee, while
      the Energy Retrofit Project, the Turnkey Mechanical Upgrade Project and the Design-Build Infrastructure
      Program carry all three at different rates — from the stage the project stands in, since awarded,
      scheduled and in_progress each settle a cancellation differently, from what the portfolio holds when
      bonding thresholds are read across several live projects, and from the history of issued change orders,
      their schedule impact and what has already been billed and withheld. The records are the project with its
      contract value, dates and stage, the delivery, inspection, change order and billing rows, the intake
      records carrying signatures and authorisations, and the retainage account; the rules gate on fields and
      records (retrofit_estimating_and_award on a recorded signature inside the estimate validity,
      retrofit_scheduling_and_delivery on the deposit and the insurance certificate, retrofit_change_orders on
      a written authorisation naming the change order, retrofit_completion_and_closeout on passed inspections,
      retrofit_progress_billing_and_retainage on the release window) and quantify by per-tier tables
      (retrofit_agg_portfolio_pricing, retrofit_schedule_guarantee, retrofit_cancellation_and_settlement,
      retrofit_portfolio_interaction), while the domain's plain order — an estimate is awarded before equipment
      is released, equipment is delivered before a crew mobilises, completion precedes closeout — is background
      to the desk rather than the content of any rule. The agent estimates and prices, books installation,
      records deliveries and inspections, issues authorised change orders, raises progress billings and
      withholds or releases retainage, credits liquidated damages where the tier carries a guarantee, and
      settles a cancellation at its stage; only the owner may sign the proposal that awards the work, authorise
      a change order above the tier's threshold, give written notice of cancellation, and accept the closeout.
      Genuine dead ends for a POLICY_NOT_COVERED handoff include a demand for liquidated damages at a tier that
      carries no schedule guarantee, a claim for consequential loss from a delayed changeover, a request to
      release retainage before the punch list is cleared or to waive it entirely, a request to honour a lapsed
      estimate at its old price when the supplier has already repriced, and any dispute over work performed by
      another contractor on the same building.
