# Product charter: Building Automation Service Plans (category key: controls)
category: controls
display_name: Building Automation Service Plans

binding:
  holding_table: controls_plans
  event_tables: [controls_events]
  intake_tables: [controls_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields:
    support_hours_remaining: support_hour_pool
    alarm_responses_remaining: alarm_response_allowance
    balance_due: controls_balance

lifecycle:
  states: [quoted, active, suspended, pending_renewal, expired, cancelled, declined]
  transitions:
    - {from: quoted, to: active, by: user, means: The customer accepts the plan quote and the plan starts.}
    - {from: quoted, to: declined, by: user, means: The customer declines the plan quote.}
    - {from: active, to: pending_renewal, by: system, means: The renewal window opens ahead of the plan year end.}
    - {from: active, to: suspended, by: agent, means: Remote access and monitoring are suspended for non-payment.}
    - {from: pending_renewal, to: suspended, by: agent, means: Remote access and monitoring are suspended during the renewal window.}
    - {from: suspended, to: active, by: agent, means: The plan is reinstated once the arrears are cleared.}
    - {from: pending_renewal, to: active, by: agent, means: The plan is renewed for a further year.}
    - {from: pending_renewal, to: expired, by: system, means: The plan year ends without renewal.}
    - {from: expired, to: active, by: agent, means: A lapsed plan is restarted inside the restart window after a site survey.}
    - {from: active, to: cancelled, by: system, means: A confirmed cancellation notice reaches its effective date.}
    - {from: suspended, to: cancelled, by: agent, means: A suspended plan is closed out for non-payment.}

accounts:
  - key: support_hour_pool
    unit: hours
    meaning: Remote and help desk controls hours the plan still includes this plan year; credited at activation and renewal, consumed by the logged hours of each resolved ticket.
  - key: alarm_response_allowance
    unit: responses
    meaning: Monitored alarm responses still included this plan year; credited at activation and renewal, consumed one per alarm the monitoring desk acts on.
  - key: controls_balance
    unit: USD
    meaning: The amount the customer currently owes under the automation service plan; charges increase it, payments and credits reduce it.

parameter_schema:
  panels_covered_max: Largest number of controls panels the plan covers at one site (integer).
  points_covered_max: Largest number of monitored points the plan covers (integer).
  point_overage_fee_usd: Annual fee per monitored point beyond the covered points (USD per point per year).
  point_addition_fee_usd: One-time fee to add a point to the covered database (USD per point).
  license_fee_per_point_usd: Annual software licence fee per covered point (USD per point per year).
  license_true_up_frequency: How often the point count is trued up against the licence (enum annual, semiannual, quarterly, monthly).
  remote_access_included: Whether remote connection into the site's controls system is included (boolean).
  vpn_gateway_fee_usd: Annual fee for the secure remote access gateway (USD per year).
  help_desk_hours: Hours the controls help desk answers under this plan (enum business_hours, extended_hours, twenty_four_seven).
  phone_response_minutes: Target to answer or call back a controls question (integer, elapsed minutes).
  remote_fix_attempt_included: Whether a remote attempt to clear the fault is included before any site visit (boolean).
  support_hours_included_per_year: Remote and help desk controls hours included per plan year (decimal hours).
  support_hour_rate_usd: Rate billed for controls support hours beyond the included pool (USD per hour).
  onsite_escalation_included: Whether an on-site controls visit is included when the remote attempt fails (boolean).
  onsite_visits_included_per_year: On-site controls visits included per plan year (integer, visits).
  controls_technician_rate_usd: On-site controls technician rate for work beyond the included visits (USD per hour).
  onsite_response_business_days: Business days to get a controls technician on site after a remote attempt fails (integer, business days).
  alarm_monitoring_included: Whether the monitoring desk watches the site's alarms (boolean).
  alarm_monitoring_hours: Hours the monitoring desk watches alarms (enum business_hours, extended_hours, twenty_four_seven).
  alarm_acknowledge_minutes: Target to acknowledge a monitored critical alarm (integer, elapsed minutes).
  alarm_responses_included_per_year: Monitored alarm responses included per plan year (integer, responses).
  alarm_response_overage_fee_usd: Fee per monitored alarm response beyond the included responses (USD).
  critical_alarm_call_out_included: Whether an after-hours call-out on a critical alarm is included (boolean).
  nuisance_alarm_tuning_included: Whether tuning to suppress nuisance alarms is included (boolean).
  schedule_changes_included_per_month: Occupancy schedule changes carried out per month at no charge (integer).
  schedule_change_fee_usd: Fee per occupancy schedule change beyond the included changes (USD).
  setpoint_changes_included_per_month: Setpoint changes carried out per month at no charge (integer).
  graphics_edits_included_per_year: Graphics page edits included per plan year (integer).
  graphics_edit_fee_usd: Fee per graphics page edit beyond the included edits (USD).
  database_backup_frequency: How often the controls database is backed up off site (enum none, quarterly, monthly, weekly, daily).
  backup_retention_months: Months an off-site controls database backup is retained (integer, calendar months).
  restore_service_included: Whether restoring a controls database from backup is included (boolean).
  restore_service_fee_usd: Fee to restore a controls database from backup where it is not included (USD).
  software_assurance_included: Whether the manufacturer's software assurance is carried under the plan (boolean).
  minor_version_updates_included: Whether minor software version updates are applied at no charge (boolean).
  major_version_upgrades_included: Whether major software version upgrades are applied at no charge (boolean).
  upgrade_labor_discount_pct: Discount on labor for an upgrade the plan does not include (percent).
  cybersecurity_patch_days: Days within which a published security patch is applied to covered controllers (integer, calendar days).
  integration_protocols_supported: Supported integration protocols, a mapping protocol -> whether it is covered under this plan.
  third_party_device_support: Whether devices from other manufacturers on the same network are supported (boolean).
  trend_review_frequency: How often trend data is reviewed and reported (enum none, annual, semiannual, quarterly, monthly).
  trend_report_business_days: Business days after the review period close by which the trend report is delivered (integer, business days).
  optimization_tuning_visits_per_year: Sequence tuning visits included per plan year (integer, visits).
  training_hours_included_per_year: Operator training hours included per plan year (decimal hours).
  annual_plan_fee_usd: Annual plan fee before per-point and gateway fees (USD per year).
  activation_fee_usd: One-time fee to commission the plan and the remote connection (USD).
  site_survey_required: Whether a site survey of the controls system is required before the plan is quoted (boolean).
  site_survey_fee_usd: Fee for the controls site survey, credited against the activation fee when the plan starts (USD).
  min_controller_generation: Oldest controller generation the plan supports, expressed as the earliest model year (integer, year).
  term_months: Length of one plan term (integer, calendar months).
  billing_frequency: How the annual plan fee is invoiced (enum annual, semiannual, quarterly, monthly).
  payment_terms_days: Days from invoice date to due date (integer, calendar days).
  late_fee_pct_per_month: Late fee on an overdue invoice per month (percent per month).
  suspension_after_days_past_due: Days past due after which remote access and monitoring are suspended (integer, calendar days).
  reinstatement_fee_usd: Fee charged when a suspended or lapsed plan is restarted (USD).
  restart_window_days: Days after the plan year end within which a lapsed plan restarts without a fresh survey (integer, calendar days).
  auto_renew: Whether the plan renews automatically at term end (boolean).
  renewal_window_days: Days before term end at which the renewal window opens (integer, calendar days).
  non_renewal_notice_days: Days before term end by which a non-renewal notice must be received (integer, calendar days).
  annual_escalation_pct: Escalation applied to the annual plan fee at each renewal (percent).
  cancellation_notice_days: Days of written notice before a cancellation takes effect (integer, calendar days).
  early_cancellation_fee_pct: Fee on the unbilled remainder of the term when the plan is cancelled early (percent).
  maintenance_bundle_required: Whether the plan is sold only alongside an active maintenance agreement at the same site (boolean).

