events:
  - type: controls_plan_quoted
    target: controls_plans
    mutation: create
    meaning: An automation service plan is quoted for a site's controls system and the plan record is opened.
    grain: One row per plan quoted for one site at one tier.
    fields:
      plan_id: The reference number of this plan record.
      customer_id: The building owner quoted.
      site_id: The building whose controls system the plan covers.
      variant_name: The plan tier quoted, written as its official full name.
      status: The lifecycle status, pinned to quoted when the plan is opened.
      quote_date: The day the plan quote was issued.
      points_covered: The number of monitored points the quote covers.
      panels_covered: The number of controls panels the quote covers.
      annual_plan_fee_usd: The annual plan fee quoted.
      controller_generation: The model year of the oldest controller on the site's system.
    triggers: []
  - type: controls_plan_activated
    target: controls_plans
    mutation: {transition: {from: quoted, to: active}}
    meaning: The customer accepts the quote and the plan takes effect.
    grain: One row per plan, changed once when it takes effect.
    fields:
      status: The lifecycle status, moved to active.
      accepted_date: The day the customer accepted the quote.
      term_start_date: The first day of the plan term.
      term_end_date: The last day of the plan term.
    triggers:
      - event: controls:controls_support_hours_credited
        map: {plan_id: plan_id, customer_id: customer_id}
      - event: controls:controls_alarm_allowance_credited
        map: {plan_id: plan_id, customer_id: customer_id}
      - event: controls:controls_invoice_charged
        map: {plan_id: plan_id, customer_id: customer_id, charge_type: activation_fee}
  - type: controls_quote_declined
    target: controls_plans
    mutation: {transition: {from: quoted, to: declined}}
    meaning: The customer declines the plan quote.
    grain: One row per quote, changed once when it is declined.
    fields:
      status: The lifecycle status, moved to declined.
      cancellation_date: The day the quote was declined.
      cancellation_reason: Why the quote was declined.
    triggers: []
  - type: controls_renewal_window_opened
    target: controls_plans
    mutation: {transition: {from: active, to: pending_renewal}}
    meaning: The plan enters its renewal window and the renewal quote goes out.
    grain: One row per plan, changed once per term when the renewal window opens.
    fields:
      status: The lifecycle status, moved to pending_renewal.
      renewal_notice_date: The day the renewal window opened.
    triggers: []
  - type: controls_plan_renewed
    target: controls_plans
    mutation: {transition: {from: pending_renewal, to: active}}
    meaning: The plan is renewed for a further term at the escalated fee and the trued-up point count.
    grain: One row per plan, changed once per renewal.
    fields:
      status: The lifecycle status, moved back to active.
      term_start_date: The first day of the renewed term.
      term_end_date: The last day of the renewed term.
      annual_plan_fee_usd: The annual plan fee for the renewed term.
      points_covered: The point count carried into the renewed term.
    triggers:
      - event: controls:controls_support_hours_credited
        map: {plan_id: plan_id, customer_id: customer_id}
      - event: controls:controls_alarm_allowance_credited
        map: {plan_id: plan_id, customer_id: customer_id}
  - type: controls_plan_suspended
    target: controls_plans
    mutation: {transition: [{from: active, to: suspended}, {from: pending_renewal, to: suspended}]}
    meaning: Remote access and alarm monitoring are withdrawn because the plan is in arrears.
    grain: One row per plan, changed once per suspension.
    fields:
      status: The lifecycle status, moved to suspended.
      suspension_date: The day monitoring and remote access were withdrawn.
    triggers: []
  - type: controls_plan_reinstated
    target: controls_plans
    mutation: {transition: [{from: suspended, to: active}, {from: expired, to: active}]}
    meaning: Monitoring and remote access are restored on a suspended or lapsed plan.
    grain: One row per plan, changed once per reinstatement.
    fields:
      status: The lifecycle status, moved back to active.
      reinstatement_date: The day monitoring and remote access were restored.
      term_end_date: The last day of the term the plan is restored into.
    triggers:
      - event: controls:controls_invoice_charged
        map: {plan_id: plan_id, customer_id: customer_id, charge_type: reinstatement}
  - type: controls_plan_expired
    target: controls_plans
    mutation: {transition: {from: pending_renewal, to: expired}}
    meaning: The plan term ends without a renewal and monitoring stops.
    grain: One row per plan, changed once when the term lapses.
    fields:
      status: The lifecycle status, moved to expired.
      term_end_date: The last day of the term that has just ended.
    triggers: []
  - type: controls_plan_cancelled
    target: controls_plans
    mutation: {transition: [{from: active, to: cancelled}, {from: suspended, to: cancelled}]}
    meaning: The plan is ended before its term end.
    grain: One row per plan, changed once when it is ended early.
    fields:
      status: The lifecycle status, moved to cancelled.
      cancellation_date: The day the cancellation was recorded.
      termination_effective_date: The day monitoring and support actually stop.
      cancellation_reason: Why the plan was ended.
    triggers:
      - event: controls:controls_invoice_charged
        when: {cancellation_reason: customer_convenience}
        map: {plan_id: plan_id, customer_id: customer_id, charge_type: early_cancellation}
  - type: controls_coverage_updated
    target: controls_plans
    mutation: update
    meaning: The covered point or panel count of a live plan changes, most often at a licence true-up.
    grain: One row per plan, changed once per accepted coverage change.
    fields:
      points_covered: The covered point count after the change.
      panels_covered: The covered panel count after the change.
      annual_plan_fee_usd: The annual plan fee after the change.
      last_change_type: What kind of coverage change was applied.
      last_change_date: The day the change took effect.
    triggers:
      - event: controls:controls_invoice_charged
        when: {last_change_type: points_added}
        map: {plan_id: plan_id, customer_id: customer_id, charge_type: point_addition}
  - type: controls_ticket_opened
    target: controls_events
    meaning: A controls question or fault is logged with the help desk.
    grain: One row per support ticket opened on one plan.
    distinguish_by: [ticket_ref, opened_timestamp, request_class]
    fields:
      plan_id: The plan the ticket is logged under.
      customer_id: The building owner who logged it.
      event_type: The event family of this row.
      site_id: The building the ticket concerns.
      ticket_ref: The ticket number.
      request_class: What kind of controls work was asked for.
      opened_timestamp: The moment the ticket was logged.
      channel: How the request reached the desk.
    triggers: []
  - type: controls_ticket_resolved
    target: controls_events
    account: support_hour_pool
    direction: out
    meaning: A support ticket is closed and its logged hours are drawn from the plan's support pool.
    grain: One row per resolved support ticket on one plan.
    distinguish_by: [ticket_ref, resolved_date, support_hours, resolution_method]
    fields:
      plan_id: The plan the ticket was resolved under.
      customer_id: The building owner the ticket was resolved for.
      event_type: The event family of this row.
      site_id: The building the ticket concerned.
      ticket_ref: The ticket number.
      resolved_date: The day the ticket was closed.
      support_hours: The support hours logged against the ticket.
      resolution_method: Whether the fault was cleared remotely, on site, or by the customer.
      request_class: What kind of controls work was carried out.
    triggers:
      - event: controls:controls_invoice_charged
        when: {resolution_method: onsite}
        map: {plan_id: plan_id, customer_id: customer_id, ticket_ref: ticket_ref, charge_type: onsite_labor}
  - type: controls_support_hours_credited
    target: controls_events
    account: support_hour_pool
    direction: in
    meaning: The plan year's included support hours are credited at activation or renewal.
    grain: One row per plan year crediting of included support hours.
    distinguish_by: [billing_period, support_hours]
    fields:
      plan_id: The plan the hours are credited to.
      customer_id: The building owner the plan belongs to.
      event_type: The event family of this row.
      billing_period: The plan year the credit belongs to.
      support_hours: The support hours credited for the year.
    triggers: []
  - type: controls_alarm_raised
    target: controls_events
    meaning: The controls system raises a monitored alarm and the monitoring desk records it.
    grain: One row per alarm raised at a monitored site.
    distinguish_by: [alarm_ref, raised_timestamp, alarm_class, equipment_tag]
    fields:
      plan_id: The plan the monitored site is covered by.
      customer_id: The building owner the site belongs to.
      event_type: The event family of this row.
      site_id: The building the alarm came from.
      alarm_ref: The alarm reference number.
      alarm_class: How serious the alarm is.
      equipment_tag: The unit the alarm came from.
      raised_timestamp: The moment the alarm was raised.
      acknowledged_timestamp: The moment the monitoring desk acknowledged the alarm.
    triggers:
      - event: controls:controls_alarm_response_used
        when: {alarm_class: [critical, urgent]}
        map: {plan_id: plan_id, customer_id: customer_id, alarm_ref: alarm_ref}
  - type: controls_alarm_response_used
    target: controls_events
    account: alarm_response_allowance
    direction: out
    meaning: The monitoring desk acts on an alarm, consuming one of the plan year's included responses.
    grain: One row per alarm the monitoring desk acted on.
    distinguish_by: [alarm_ref, used_date, overage_applied]
    fields:
      plan_id: The plan the response is counted against.
      customer_id: The building owner the plan belongs to.
      event_type: The event family of this row.
      alarm_ref: The alarm the desk acted on.
      used_date: The day the desk acted on the alarm.
      overage_applied: Whether the response ran past the included allowance.
    triggers:
      - event: controls:controls_invoice_charged
        when: {overage_applied: applied}
        map: {plan_id: plan_id, customer_id: customer_id, charge_type: alarm_overage}
  - type: controls_alarm_allowance_credited
    target: controls_events
    account: alarm_response_allowance
    direction: in
    meaning: The plan year's included alarm responses are credited at activation or renewal.
    grain: One row per plan year crediting of included alarm responses.
    distinguish_by: [billing_period, included_responses]
    fields:
      plan_id: The plan the responses are credited to.
      customer_id: The building owner the plan belongs to.
      event_type: The event family of this row.
      billing_period: The plan year the credit belongs to.
      included_responses: The alarm responses credited for the year.
    triggers: []
  - type: controls_software_update_applied
    target: controls_events
    meaning: A software update, upgrade or security patch is applied to the covered controls system.
    grain: One row per update applied to one plan's system.
    distinguish_by: [ticket_ref, applied_date, update_class, software_version]
    fields:
      plan_id: The plan whose system was updated.
      customer_id: The building owner the system belongs to.
      event_type: The event family of this row.
      site_id: The building whose system was updated.
      ticket_ref: The ticket the update was carried out under.
      update_class: Whether this was a security patch, a minor update or a major upgrade.
      software_version: The version the system now runs.
      applied_date: The day the update was applied.
      support_hours: The hours the update took.
    triggers:
      - event: controls:controls_invoice_charged
        when: {update_class: major_upgrade}
        map: {plan_id: plan_id, customer_id: customer_id, ticket_ref: ticket_ref, charge_type: upgrade_labor}
  - type: controls_invoice_charged
    target: controls_events
    account: controls_balance
    direction: in
    meaning: A plan fee or an extra controls service is invoiced to the building owner.
    grain: One row per charge line invoiced on one plan.
    distinguish_by: [invoice_ref, charge_type, amount_usd, ticket_ref]
    fields:
      plan_id: The plan the charge belongs to.
      customer_id: The building owner invoiced.
      event_type: The event family of this row.
      invoice_ref: The invoice the charge was billed on.
      charge_type: Which kind of charge this line is.
      amount_usd: The amount charged.
      ticket_ref: The ticket the charge arises from, where there is one.
      billing_period: The period the charge covers.
      due_date: The day the invoice falls due.
    triggers: []
  - type: controls_payment_received
    target: controls_events
    account: controls_balance
    direction: out
    meaning: A payment from the building owner is applied to the automation plan balance.
    grain: One row per payment applied to one invoice.
    distinguish_by: [invoice_ref, received_date, amount_usd, payment_method]
    fields:
      plan_id: The plan the payment is applied to.
      customer_id: The building owner who paid.
      event_type: The event family of this row.
      invoice_ref: The invoice the payment is applied to.
      amount_usd: The amount paid.
      payment_method: How the payment was made.
      received_date: The day the payment was received.
    triggers: []
  - type: controls_credit_issued
    target: controls_events
    account: controls_balance
    direction: out
    meaning: A credit is issued against the automation plan balance.
    grain: One row per credit issued on one plan.
    distinguish_by: [invoice_ref, credit_reason, amount_usd, alarm_ref]
    fields:
      plan_id: The plan credited.
      customer_id: The building owner credited.
      event_type: The event family of this row.
      invoice_ref: The invoice the credit is applied against.
      credit_reason: Why the credit was issued.
      amount_usd: The amount credited.
      alarm_ref: The alarm the credit arises from, where it arises from one.
      billing_period: The period the credit falls in.
    triggers: []

measures:
  - id: controls_msr_support_hours_used_year
    window: The current plan year, from term_start_date through term_end_date inclusive.
    measure: Sum of support_hours over controls_ticket_resolved rows on this plan whose resolved_date falls in the window.
  - id: controls_msr_alarm_responses_used_year
    window: The current plan year, from term_start_date through term_end_date inclusive.
    measure: Count of controls_alarm_response_used rows on this plan whose used_date falls in the window.
  - id: controls_msr_schedule_changes_this_month
    window: The calendar month the handling day falls in, from its first day through the handling day.
    measure: Count of controls_ticket_resolved rows on this plan whose request_class is schedule_change and whose resolved_date falls in the window.

policies:
  - id: controls_agg_multi_holding
    subject: [controls_plan_quoted]
    rule: >-
      A building owner may hold several automation service plans, one for each building whose controls system
      the company supports, and the portfolio is counted whenever a plan is priced or a shared entitlement is
      drawn. A second plan is not quoted for a site that already holds a plan in quoted, active,
      pending_renewal or suspended status; the covered points of that site are amended instead. Plans in
      expired, cancelled or declined status do not block a fresh quote. Support hours, alarm responses and
      balances are held per plan and are never pooled across sites, even where one owner holds plans at every
      building in a campus, because each plan covers one controls database.
    eligibility:
      - id: one_live_plan_per_site
        applies_to: [controls_plan_quoted]
        kind: dedup
        condition: A second plan is not quoted for a site that already holds a plan in quoted, active, pending_renewal or suspended status; the covered points of that site are amended instead.
        evidence_fields: [controls_plans.site_id, controls_plans.status, controls_plans.plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [controls_plans.site_id]
          action_bindings:
            controls_plans.site_id: site_id
        dedup_contract:
          table: controls_plans
          mode: separate_record
          object_bindings: {site_id: site_id}
          duplicate_filters: {status: [quoted, active, pending_renewal, suspended]}
          distinct_fields: [variant_name, quote_date]
    params:
      max_per_customer: null

  - id: controls_agg_portfolio_point_pricing
    subject: [controls_plan_quoted, controls_coverage_updated, controls_plan_renewed]
    rule: >-
      Where one owner holds plans at several buildings, the licence position is settled across the portfolio
      before any single plan is priced. The owner's covered points are the sum of points_covered over their
      plans standing in active or pending_renewal status, the plan being priced included; plans in quoted,
      suspended, expired, cancelled or declined status are not counted. The per-point licence fee of each
      plan is read from that plan's own tier, never from the portfolio's largest tier, and the portfolio count
      decides only which volume step the licence sits on. Points beyond a plan's covered maximum are charged
      the tier's point overage fee for the remainder of the plan year, prorated by whole months, and they are
      added to the covered count at the next true-up rather than immediately.
    eligibility: []
    params:
      volume_steps: Portfolio point bands are 0 to 2000 points, 2001 to 8000 points, and above 8000 points.
      per_tier:
        Controls Help Desk Subscription: {points_max: "=points_covered_max", overage_fee_usd: "=point_overage_fee_usd", licence_fee_usd: "=license_fee_per_point_usd"}
        Alarm Monitoring Plan: {points_max: "=points_covered_max", overage_fee_usd: "=point_overage_fee_usd", licence_fee_usd: "=license_fee_per_point_usd"}
        Scheduled Controls Service Plan: {points_max: "=points_covered_max", overage_fee_usd: "=point_overage_fee_usd", licence_fee_usd: "=license_fee_per_point_usd"}
        Software Assurance & Upgrade Plan: {points_max: "=points_covered_max", overage_fee_usd: "=point_overage_fee_usd", licence_fee_usd: "=license_fee_per_point_usd"}
        Remote Optimization Plan: {points_max: "=points_covered_max", overage_fee_usd: "=point_overage_fee_usd", licence_fee_usd: "=license_fee_per_point_usd"}
        Integrated Building Automation Partnership: {points_max: "=points_covered_max", overage_fee_usd: "=point_overage_fee_usd", licence_fee_usd: "=license_fee_per_point_usd"}
    formula:
      annual_fee_usd: "round(annual_plan_fee_usd + max(0, points_covered - points_covered_max) * point_overage_fee_usd + vpn_gateway_fee_usd, 2)"

  - id: controls_plan_qualification
    subject: [controls_plan_quoted, controls_quote_declined]
    rule: >-
      A plan tier is quoted only for a controls system it can actually support. No controller on the site's
      system may be older than the tier's oldest supported controller generation, read as the model year on
      the controller record. The site's protocols must be among those the tier supports, and a system carrying
      a protocol the tier does not support is quoted at a tier that does or the unsupported devices are left
      out of the covered count. A tier whose site survey requirement is set is quoted only when a controls
      site survey for that building is recorded as completed in the office records. A tier that is sold only
      alongside maintenance is quoted only where the same building carries a maintenance agreement in active
      or pending_renewal status. Where a site meets none of the tiers, the desk does not quote a plan at all
      and the system is offered a controls upgrade project instead.
    eligibility:
      - id: site_survey_completed
        applies_to: [controls_plan_quoted]
        kind: authorization
        condition: A tier whose site survey requirement is set is quoted only when a controls site survey for that building is recorded as completed in the office records.
        evidence_fields: [controls_requests.site_id, controls_requests.request_type, controls_requests.outcome]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [controls_requests.site_id]
          action_bindings:
            controls_requests.site_id: site_id
      - id: maintenance_agreement_at_site
        applies_to: [controls_plan_quoted]
        kind: state
        condition: A tier that is sold only alongside maintenance is quoted only where the same building carries a maintenance agreement in active or pending_renewal status.
        evidence_fields: [maintenance_agreements.status, maintenance_agreements.site_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [maintenance_agreements.site_id]
          action_bindings:
            maintenance_agreements.site_id: site_id
        state_contract:
          field: maintenance_agreements.status
          allowed: [active, pending_renewal]
    params:
      per_tier:
        Controls Help Desk Subscription: {min_generation: "=min_controller_generation", survey_required: "=site_survey_required", bundle_required: "=maintenance_bundle_required", survey_fee_usd: "=site_survey_fee_usd"}
        Alarm Monitoring Plan: {min_generation: "=min_controller_generation", survey_required: "=site_survey_required", bundle_required: "=maintenance_bundle_required", survey_fee_usd: "=site_survey_fee_usd"}
        Scheduled Controls Service Plan: {min_generation: "=min_controller_generation", survey_required: "=site_survey_required", bundle_required: "=maintenance_bundle_required", survey_fee_usd: "=site_survey_fee_usd"}
        Software Assurance & Upgrade Plan: {min_generation: "=min_controller_generation", survey_required: "=site_survey_required", bundle_required: "=maintenance_bundle_required", survey_fee_usd: "=site_survey_fee_usd"}
        Remote Optimization Plan: {min_generation: "=min_controller_generation", survey_required: "=site_survey_required", bundle_required: "=maintenance_bundle_required", survey_fee_usd: "=site_survey_fee_usd"}
        Integrated Building Automation Partnership: {min_generation: "=min_controller_generation", survey_required: "=site_survey_required", bundle_required: "=maintenance_bundle_required", survey_fee_usd: "=site_survey_fee_usd"}

  - id: controls_activation_and_entitlement
    subject: [controls_plan_activated, controls_support_hours_credited, controls_alarm_allowance_credited]
    rule: >-
      A plan takes effect only when the customer's written acceptance of the quote is recorded against it, and
      the activation fee is charged on the day it takes effect, less any survey fee already paid. At the start
      of each plan year the plan is credited with the tier's included support hours and included alarm
      responses; neither carries forward, and both are forfeited at the plan year end. The remote connection
      is commissioned before monitoring starts, and until it is commissioned the alarm allowance is held but
      not drawn. Where the tier includes no alarm monitoring, no alarm allowance is credited and alarms from
      that site reach nobody at the company, which the desk says plainly rather than implying the site is
      watched.
    eligibility:
      - id: written_acceptance_on_file
        applies_to: [controls_plan_activated]
        kind: authorization
        condition: A plan takes effect only when the customer's written acceptance of the quote is recorded against it, and the activation fee is charged on the day it takes effect, less any survey fee already paid.
        evidence_fields: [controls_requests.plan_id, controls_requests.request_type, controls_requests.outcome]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [controls_requests.plan_id]
          action_bindings:
            controls_requests.plan_id: plan_id
    params:
      per_tier:
        Controls Help Desk Subscription: {hours_credited: "=support_hours_included_per_year", responses_credited: "=alarm_responses_included_per_year", activation_fee_usd: "=activation_fee_usd"}
        Alarm Monitoring Plan: {hours_credited: "=support_hours_included_per_year", responses_credited: "=alarm_responses_included_per_year", activation_fee_usd: "=activation_fee_usd"}
        Scheduled Controls Service Plan: {hours_credited: "=support_hours_included_per_year", responses_credited: "=alarm_responses_included_per_year", activation_fee_usd: "=activation_fee_usd"}
        Software Assurance & Upgrade Plan: {hours_credited: "=support_hours_included_per_year", responses_credited: "=alarm_responses_included_per_year", activation_fee_usd: "=activation_fee_usd"}
        Remote Optimization Plan: {hours_credited: "=support_hours_included_per_year", responses_credited: "=alarm_responses_included_per_year", activation_fee_usd: "=activation_fee_usd"}
        Integrated Building Automation Partnership: {hours_credited: "=support_hours_included_per_year", responses_credited: "=alarm_responses_included_per_year", activation_fee_usd: "=activation_fee_usd"}

  - id: controls_support_handling
    subject: [controls_ticket_opened, controls_ticket_resolved]
    rule: >-
      A support ticket is taken only while the plan stands in active or pending_renewal status, because a
      suspended plan has no remote connection to work through. Tickets are answered inside the tier's phone
      response target during the tier's help desk hours, and a ticket logged outside those hours is answered
      when the desk next opens unless the tier answers around the clock. Where the tier includes a remote fix
      attempt, the desk attempts the fix remotely before any visit is offered; where it does not, the ticket
      is quoted as a controls site visit from the start. The hours logged against a resolved ticket are drawn
      from the plan year's support pool, and once the pool is exhausted further hours are billed at the tier's
      support hour rate, with on-site hours billed at the controls technician rate instead. Schedule changes
      and setpoint changes are carried out free up to the tier's monthly counts, counted over the calendar
      month; beyond them each schedule change carries the tier's fee, and graphics edits are counted over the
      plan year against the tier's included edits.
    eligibility:
      - id: live_plan_for_support
        applies_to: [controls_ticket_opened]
        kind: state
        condition: A support ticket is taken only while the plan stands in active or pending_renewal status, because a suspended plan has no remote connection to work through.
        evidence_fields: [controls_plans.status, controls_plans.plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [controls_plans.plan_id]
          action_bindings:
            controls_plans.plan_id: plan_id
        state_contract:
          field: controls_plans.status
          allowed: [active, pending_renewal]
    measures: [controls_msr_support_hours_used_year, controls_msr_schedule_changes_this_month]
    params:
      per_tier:
        Controls Help Desk Subscription: {hour_rate_usd: "=support_hour_rate_usd", onsite_rate_usd: "=controls_technician_rate_usd", schedule_changes: "=schedule_changes_included_per_month", schedule_fee_usd: "=schedule_change_fee_usd", graphics_edits: "=graphics_edits_included_per_year"}
        Alarm Monitoring Plan: {hour_rate_usd: "=support_hour_rate_usd", onsite_rate_usd: "=controls_technician_rate_usd", schedule_changes: "=schedule_changes_included_per_month", schedule_fee_usd: "=schedule_change_fee_usd", graphics_edits: "=graphics_edits_included_per_year"}
        Scheduled Controls Service Plan: {hour_rate_usd: "=support_hour_rate_usd", onsite_rate_usd: "=controls_technician_rate_usd", schedule_changes: "=schedule_changes_included_per_month", schedule_fee_usd: "=schedule_change_fee_usd", graphics_edits: "=graphics_edits_included_per_year"}
        Software Assurance & Upgrade Plan: {hour_rate_usd: "=support_hour_rate_usd", onsite_rate_usd: "=controls_technician_rate_usd", schedule_changes: "=schedule_changes_included_per_month", schedule_fee_usd: "=schedule_change_fee_usd", graphics_edits: "=graphics_edits_included_per_year"}
        Remote Optimization Plan: {hour_rate_usd: "=support_hour_rate_usd", onsite_rate_usd: "=controls_technician_rate_usd", schedule_changes: "=schedule_changes_included_per_month", schedule_fee_usd: "=schedule_change_fee_usd", graphics_edits: "=graphics_edits_included_per_year"}
        Integrated Building Automation Partnership: {hour_rate_usd: "=support_hour_rate_usd", onsite_rate_usd: "=controls_technician_rate_usd", schedule_changes: "=schedule_changes_included_per_month", schedule_fee_usd: "=schedule_change_fee_usd", graphics_edits: "=graphics_edits_included_per_year"}
    formula:
      overage_charge_usd: "round(max(0, support_hours - support_hour_pool) * support_hour_rate_usd, 2)"

  - id: controls_alarm_monitoring
    subject: [controls_alarm_raised, controls_alarm_response_used]
    rule: >-
      Alarms from a covered site are watched only where the tier includes monitoring, and only during the
      tier's monitoring hours. A critical or urgent alarm is acknowledged inside the tier's acknowledgement
      target, counted in elapsed minutes from the moment the alarm was raised, and the desk then either clears
      it remotely, calls the building contact, or dispatches, in that order. Each alarm the desk acts on
      consumes one of the plan year's included responses; alarms the system clears by itself and alarms the
      desk suppresses as nuisance consume none. Once the year's responses are used up, each further response
      carries the tier's overage fee. An after-hours call-out on a critical alarm is included only where the
      tier includes it; at every other tier the call-out is dispatched as demand service and billed at the
      demand rates. Repeated nuisance alarms are tuned out at no charge where the tier includes tuning, and
      where it does not, tuning is quoted as controls work.
    eligibility: []
    measures: [controls_msr_alarm_responses_used_year]
    params:
      per_tier:
        Controls Help Desk Subscription: {monitoring: "=alarm_monitoring_included", ack_minutes: "=alarm_acknowledge_minutes", responses: "=alarm_responses_included_per_year", overage_fee_usd: "=alarm_response_overage_fee_usd", call_out: "=critical_alarm_call_out_included"}
        Alarm Monitoring Plan: {monitoring: "=alarm_monitoring_included", ack_minutes: "=alarm_acknowledge_minutes", responses: "=alarm_responses_included_per_year", overage_fee_usd: "=alarm_response_overage_fee_usd", call_out: "=critical_alarm_call_out_included"}
        Scheduled Controls Service Plan: {monitoring: "=alarm_monitoring_included", ack_minutes: "=alarm_acknowledge_minutes", responses: "=alarm_responses_included_per_year", overage_fee_usd: "=alarm_response_overage_fee_usd", call_out: "=critical_alarm_call_out_included"}
        Software Assurance & Upgrade Plan: {monitoring: "=alarm_monitoring_included", ack_minutes: "=alarm_acknowledge_minutes", responses: "=alarm_responses_included_per_year", overage_fee_usd: "=alarm_response_overage_fee_usd", call_out: "=critical_alarm_call_out_included"}
        Remote Optimization Plan: {monitoring: "=alarm_monitoring_included", ack_minutes: "=alarm_acknowledge_minutes", responses: "=alarm_responses_included_per_year", overage_fee_usd: "=alarm_response_overage_fee_usd", call_out: "=critical_alarm_call_out_included"}
        Integrated Building Automation Partnership: {monitoring: "=alarm_monitoring_included", ack_minutes: "=alarm_acknowledge_minutes", responses: "=alarm_responses_included_per_year", overage_fee_usd: "=alarm_response_overage_fee_usd", call_out: "=critical_alarm_call_out_included"}

  - id: controls_software_and_security
    subject: [controls_software_update_applied]
    rule: >-
      Security patches published by the controls manufacturer are applied to covered controllers inside the
      tier's patch period, counted in calendar days from the day the patch was published, at no charge at
      every tier. Minor version updates are applied at no charge only where the tier includes them, and a
      major version upgrade is carried out at no labor charge only where the tier includes major upgrades;
      elsewhere the upgrade is quoted, with the tier's upgrade labor discount applied, and the manufacturer's
      licence cost is passed through unchanged. Software assurance, where the tier carries it, keeps the
      site's licence current with the manufacturer and lapses with the plan, so a plan that is cancelled
      leaves the licence frozen at its last covered version. A database backup is taken at the tier's
      frequency and kept for the tier's retention period, and a restore is carried out at no charge only
      where the tier includes restore service.
    eligibility: []
    params:
      per_tier:
        Controls Help Desk Subscription: {patch_days: "=cybersecurity_patch_days", minor: "=minor_version_updates_included", major: "=major_version_upgrades_included", upgrade_discount_pct: "=upgrade_labor_discount_pct", backup: "=database_backup_frequency", retention_months: "=backup_retention_months"}
        Alarm Monitoring Plan: {patch_days: "=cybersecurity_patch_days", minor: "=minor_version_updates_included", major: "=major_version_upgrades_included", upgrade_discount_pct: "=upgrade_labor_discount_pct", backup: "=database_backup_frequency", retention_months: "=backup_retention_months"}
        Scheduled Controls Service Plan: {patch_days: "=cybersecurity_patch_days", minor: "=minor_version_updates_included", major: "=major_version_upgrades_included", upgrade_discount_pct: "=upgrade_labor_discount_pct", backup: "=database_backup_frequency", retention_months: "=backup_retention_months"}
        Software Assurance & Upgrade Plan: {patch_days: "=cybersecurity_patch_days", minor: "=minor_version_updates_included", major: "=major_version_upgrades_included", upgrade_discount_pct: "=upgrade_labor_discount_pct", backup: "=database_backup_frequency", retention_months: "=backup_retention_months"}
        Remote Optimization Plan: {patch_days: "=cybersecurity_patch_days", minor: "=minor_version_updates_included", major: "=major_version_upgrades_included", upgrade_discount_pct: "=upgrade_labor_discount_pct", backup: "=database_backup_frequency", retention_months: "=backup_retention_months"}
        Integrated Building Automation Partnership: {patch_days: "=cybersecurity_patch_days", minor: "=minor_version_updates_included", major: "=major_version_upgrades_included", upgrade_discount_pct: "=upgrade_labor_discount_pct", backup: "=database_backup_frequency", retention_months: "=backup_retention_months"}

  - id: controls_billing_and_late_fee
    subject: [controls_invoice_charged, controls_payment_received, controls_credit_issued]
    rule: >-
      The annual plan fee is invoiced on the tier's billing frequency in equal instalments, with per-point
      licence fees and the gateway fee carried on the same invoice. Each invoice falls due the tier's payment
      term after the invoice date, counted in calendar days with the invoice day excluded and the due day
      included, and an invoice unpaid past its due day carries the tier's late fee for each month or part
      month it stays unpaid. Extra services — support hours beyond the pool, schedule and graphics work beyond
      the included counts, alarm response overages and quoted upgrade labor — are invoiced in the month they
      are performed rather than held to the year end. Credits for a missed acknowledgement target are applied
      to the next plan invoice. Payments are applied to the oldest unpaid invoice unless the owner names one.
    eligibility: []
    params:
      per_tier:
        Controls Help Desk Subscription: {frequency: "=billing_frequency", terms_days: "=payment_terms_days", late_fee_pct: "=late_fee_pct_per_month"}
        Alarm Monitoring Plan: {frequency: "=billing_frequency", terms_days: "=payment_terms_days", late_fee_pct: "=late_fee_pct_per_month"}
        Scheduled Controls Service Plan: {frequency: "=billing_frequency", terms_days: "=payment_terms_days", late_fee_pct: "=late_fee_pct_per_month"}
        Software Assurance & Upgrade Plan: {frequency: "=billing_frequency", terms_days: "=payment_terms_days", late_fee_pct: "=late_fee_pct_per_month"}
        Remote Optimization Plan: {frequency: "=billing_frequency", terms_days: "=payment_terms_days", late_fee_pct: "=late_fee_pct_per_month"}
        Integrated Building Automation Partnership: {frequency: "=billing_frequency", terms_days: "=payment_terms_days", late_fee_pct: "=late_fee_pct_per_month"}
    formula:
      late_fee_usd: "round(amount_usd * late_fee_pct_per_month / 100, 2)"

  - id: controls_suspension_and_reinstatement
    subject: [controls_plan_suspended, controls_plan_reinstated]
    rule: >-
      Remote access and alarm monitoring are withdrawn once an invoice stays unpaid beyond the tier's
      suspension period counted from the day the invoice fell due, counting calendar days with the due day
      excluded and the final day included. While a plan is suspended the site's alarms are not watched and no
      support ticket is taken, and the desk tells the caller so rather than logging a ticket that nobody will
      work. Access and monitoring are restored when the arrears are settled in full and the tier's
      reinstatement fee is charged; the support pool and alarm allowance are not topped up on reinstatement,
      because the plan year's credit was made once. A plan that lapsed at its term end may be restarted
      without a fresh site survey only inside the tier's restart window counted forward in calendar days from
      the term end date, the end day excluded and the final day included; past that the system is surveyed
      again before any plan is quoted.
    eligibility:
      - id: arrears_beyond_suspension_period
        applies_to: [controls_plan_suspended]
        kind: time
        condition: Remote access and alarm monitoring are withdrawn once an invoice stays unpaid beyond the tier's suspension period counted from the day the invoice fell due, counting calendar days with the due day excluded and the final day included.
        evidence_fields: [controls_events.due_date, controls_events.invoice_ref, controls_events.amount_usd]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [controls_events.invoice_ref]
          action_bindings:
            controls_events.invoice_ref: invoice_ref
        temporal_basis:
          clock: frozen_time
          anchor_event: the day the invoice fell due
          anchor_source: controls_events.due_date
          relation: not_before
          duration_source: variants.suspension_after_days_past_due
          unit: calendar_days
          counting_rule: counting calendar days with the due day excluded and the final day included
          boundary: inclusive
      - id: restart_inside_window
        applies_to: [controls_plan_reinstated]
        kind: time
        condition: A plan that lapsed at its term end may be restarted without a fresh site survey only inside the tier's restart window counted forward in calendar days from the term end date, the end day excluded and the final day included; past that the system is surveyed again before any plan is quoted.
        evidence_fields: [controls_plans.term_end_date, controls_plans.plan_id, controls_plans.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [controls_plans.plan_id]
          action_bindings:
            controls_plans.plan_id: plan_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the term end date
          anchor_source: controls_plans.term_end_date
          relation: not_after
          duration_source: variants.restart_window_days
          unit: calendar_days
          counting_rule: counted forward in calendar days from the term end date, the end day excluded and the final day included
          boundary: inclusive
    params:
      per_tier:
        Controls Help Desk Subscription: {suspension_days: "=suspension_after_days_past_due", reinstatement_fee_usd: "=reinstatement_fee_usd", restart_days: "=restart_window_days"}
        Alarm Monitoring Plan: {suspension_days: "=suspension_after_days_past_due", reinstatement_fee_usd: "=reinstatement_fee_usd", restart_days: "=restart_window_days"}
        Scheduled Controls Service Plan: {suspension_days: "=suspension_after_days_past_due", reinstatement_fee_usd: "=reinstatement_fee_usd", restart_days: "=restart_window_days"}
        Software Assurance & Upgrade Plan: {suspension_days: "=suspension_after_days_past_due", reinstatement_fee_usd: "=reinstatement_fee_usd", restart_days: "=restart_window_days"}
        Remote Optimization Plan: {suspension_days: "=suspension_after_days_past_due", reinstatement_fee_usd: "=reinstatement_fee_usd", restart_days: "=restart_window_days"}
        Integrated Building Automation Partnership: {suspension_days: "=suspension_after_days_past_due", reinstatement_fee_usd: "=reinstatement_fee_usd", restart_days: "=restart_window_days"}

  - id: controls_renewal_and_cancellation
    subject: [controls_renewal_window_opened, controls_plan_renewed, controls_plan_expired, controls_plan_cancelled]
    rule: >-
      The renewal window opens the tier's renewal period before the term end date, and the renewal quote
      carries the escalated fee and the trued-up point count. Where the tier renews automatically the plan
      renews at the term end unless a non-renewal notice was received by the tier's notice deadline, counted
      back in calendar days from the term end date with the deadline day counting as timely; the top tier does
      not renew automatically and ends unless a renewal acceptance is on file for this plan. A customer may
      cancel early on the tier's written notice period, and the tier's early cancellation rate is applied to
      the unbilled remainder of the term. Cancellation stops monitoring on the effective day, and the owner is
      told plainly that alarms will then reach nobody. A plan that simply expires carries no cancellation fee,
      and the site's controls database backup is retained for the tier's retention period after the plan ends.
      The notice period is counted in calendar days from the day the written notice was received, the
      notice day excluded and the final day included.
    eligibility:
      - id: renewal_acceptance_on_file
        applies_to: [controls_plan_renewed]
        kind: authorization
        condition: the top tier does not renew automatically and ends unless a renewal acceptance is on file for this plan
        evidence_fields: [controls_requests.plan_id, controls_requests.request_type, controls_requests.outcome]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [controls_requests.plan_id]
          action_bindings:
            controls_requests.plan_id: plan_id
      - id: cancellation_notice_period
        applies_to: [controls_plan_cancelled]
        kind: time
        condition: A customer may cancel early on the tier's written notice period, and the tier's early cancellation rate is applied to the unbilled remainder of the term.
        evidence_fields: [controls_requests.notice_date, controls_requests.plan_id, controls_requests.request_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [controls_requests.plan_id]
          action_bindings:
            controls_requests.plan_id: plan_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the tier's written notice period
          anchor_source: controls_requests.notice_date
          relation: not_before
          duration_source: variants.cancellation_notice_days
          unit: calendar_days
          counting_rule: counted in calendar days from the day the written notice was received, the notice day excluded and the final day included
          boundary: inclusive
    params:
      per_tier:
        Controls Help Desk Subscription: {window_days: "=renewal_window_days", notice_days: "=non_renewal_notice_days", escalation_pct: "=annual_escalation_pct", cancel_notice_days: "=cancellation_notice_days", cancel_fee_pct: "=early_cancellation_fee_pct"}
        Alarm Monitoring Plan: {window_days: "=renewal_window_days", notice_days: "=non_renewal_notice_days", escalation_pct: "=annual_escalation_pct", cancel_notice_days: "=cancellation_notice_days", cancel_fee_pct: "=early_cancellation_fee_pct"}
        Scheduled Controls Service Plan: {window_days: "=renewal_window_days", notice_days: "=non_renewal_notice_days", escalation_pct: "=annual_escalation_pct", cancel_notice_days: "=cancellation_notice_days", cancel_fee_pct: "=early_cancellation_fee_pct"}
        Software Assurance & Upgrade Plan: {window_days: "=renewal_window_days", notice_days: "=non_renewal_notice_days", escalation_pct: "=annual_escalation_pct", cancel_notice_days: "=cancellation_notice_days", cancel_fee_pct: "=early_cancellation_fee_pct"}
        Remote Optimization Plan: {window_days: "=renewal_window_days", notice_days: "=non_renewal_notice_days", escalation_pct: "=annual_escalation_pct", cancel_notice_days: "=cancellation_notice_days", cancel_fee_pct: "=early_cancellation_fee_pct"}
        Integrated Building Automation Partnership: {window_days: "=renewal_window_days", notice_days: "=non_renewal_notice_days", escalation_pct: "=annual_escalation_pct", cancel_notice_days: "=cancellation_notice_days", cancel_fee_pct: "=early_cancellation_fee_pct"}

  - id: controls_portfolio_interaction
    subject: [controls_plan_quoted, controls_ticket_resolved, controls_invoice_charged]
    rule: >-
      The automation plan sits alongside the rest of the building's cover and the two are read together. Where
      the site holds a maintenance agreement whose tier includes remote monitoring, the alarm monitoring of
      this plan is not billed a second time and the maintenance bundle credit is applied against the
      maintenance price rather than here. Where an energy monitoring subscription draws its data from the same
      controls system, the point licence is counted once and carried on this plan, and the energy
      subscription is not charged per point for the same points. A controls fault found during a maintenance
      visit is logged as a ticket on this plan and drawn from its support pool, not billed as maintenance
      work, while mechanical work found during a controls ticket is passed to the maintenance agreement or
      quoted as demand service. A site holding a controls upgrade project in progress does not hold an
      automation plan at the same time for the panels the project replaces, and the plan's coverage is amended
      at the project's close.
    eligibility:
      - id: energy_subscription_point_sharing
        applies_to: [controls_invoice_charged]
        kind: authorization
        condition: Where an energy monitoring subscription draws its data from the same controls system, the point licence is counted once and carried on this plan, and the energy subscription is not charged per point for the same points.
        evidence_fields: [energy_subscriptions.site_id, energy_subscriptions.status, energy_subscriptions.data_source]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [energy_subscriptions.site_id]
          action_bindings:
            energy_subscriptions.site_id: site_id
    params:
      per_tier:
        Controls Help Desk Subscription: {monitoring: "=alarm_monitoring_included", licence_fee_usd: "=license_fee_per_point_usd"}
        Alarm Monitoring Plan: {monitoring: "=alarm_monitoring_included", licence_fee_usd: "=license_fee_per_point_usd"}
        Scheduled Controls Service Plan: {monitoring: "=alarm_monitoring_included", licence_fee_usd: "=license_fee_per_point_usd"}
        Software Assurance & Upgrade Plan: {monitoring: "=alarm_monitoring_included", licence_fee_usd: "=license_fee_per_point_usd"}
        Remote Optimization Plan: {monitoring: "=alarm_monitoring_included", licence_fee_usd: "=license_fee_per_point_usd"}
        Integrated Building Automation Partnership: {monitoring: "=alarm_monitoring_included", licence_fee_usd: "=license_fee_per_point_usd"}
