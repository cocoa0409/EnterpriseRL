# Product charter: Indoor Air Quality & Filtration Programs (category key: iaq)
category: iaq
display_name: Indoor Air Quality & Filtration Programs

binding:
  holding_table: iaq_programs
  event_tables: [iaq_events]
  intake_tables: [iaq_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields:
    filter_sets_remaining: filter_credit
    balance_due: iaq_balance

lifecycle:
  states: [quoted, active, suspended, pending_renewal, expired, cancelled, declined]
  transitions:
    - {from: quoted, to: active, by: user, means: The owner accepts the program quote and the first delivery is scheduled.}
    - {from: quoted, to: declined, by: user, means: The owner declines the program quote.}
    - {from: active, to: pending_renewal, by: system, means: The renewal window opens ahead of the program year end.}
    - {from: active, to: suspended, by: agent, means: Deliveries and visits stop for non-payment.}
    - {from: pending_renewal, to: suspended, by: agent, means: Deliveries and visits stop during the renewal window.}
    - {from: suspended, to: active, by: agent, means: The program restarts once the arrears are cleared.}
    - {from: pending_renewal, to: active, by: agent, means: The program is renewed for a further year.}
    - {from: pending_renewal, to: expired, by: system, means: The program year ends without renewal.}
    - {from: expired, to: active, by: agent, means: A lapsed program is restarted inside the restart window.}
    - {from: active, to: cancelled, by: system, means: A confirmed cancellation notice reaches its effective date.}
    - {from: suspended, to: cancelled, by: agent, means: A suspended program is closed out and unused filters are settled.}

accounts:
  - key: filter_credit
    unit: filter_sets
    meaning: Filter sets the program still owes the site this program year; credited at activation, at renewal and on each delivery, consumed as each set is fitted.
  - key: iaq_balance
    unit: USD
    meaning: The amount the owner currently owes under the air quality program; charges increase it, payments and credits reduce it.

parameter_schema:
  filter_grade_supplied: Filter efficiency grade supplied under the program (MERV rating, integer).
  filters_included_per_unit_per_year: Filter sets included per covered unit per program year (integer, sets).
  filter_change_visits_per_year: Visits per year at which the company changes the filters (integer, visits; 0 means the owner changes them).
  filter_disposal_included: Whether removal and disposal of used filters is included (boolean).
  extra_filter_set_price_usd: Price of one further filter set beyond the included sets (USD per set).
  filter_sizes_supported: Filter sizes the program stocks, a mapping size class -> whether it is stocked.
  shipping_included: Whether shipping of filter sets to the site is included (boolean).
  shipping_fee_usd: Shipping charge per filter delivery where it is not included (USD).
  belt_replacement_included: Whether drive belts changed at a filter visit are included (boolean).
  coil_cleaning_visits_per_year: Coil cleaning visits included per year (integer, visits).
  coil_coating_included: Whether protective coil coating is included (boolean).
  drain_pan_treatment_included: Whether condensate drain pan treatment is included at each visit (boolean).
  uv_lamps_included: Ultraviolet lamps maintained per covered unit (integer, lamps).
  uv_lamp_replacement_months: Months between ultraviolet lamp replacements (integer, calendar months; 0 where none are fitted).
  uv_lamp_price_usd: Price of one replacement ultraviolet lamp beyond the included lamps (USD).
  bipolar_ionization_included: Whether bipolar ionisation equipment is serviced under the program (boolean).
  air_test_visits_per_year: Indoor air quality test visits included per year (integer, visits).
  test_parameters_covered: Parameters measured at a test visit, a mapping parameter -> whether it is measured.
  lab_analysis_included: Whether laboratory analysis of collected samples is included (boolean).
  lab_fee_per_sample_usd: Laboratory fee per sample where analysis is not included (USD per sample).
  report_business_days: Business days after a test or service visit by which the report is delivered (integer, business days).
  certification_included: Whether an annual indoor air quality certificate is issued for the building (boolean).
  certification_renewal_months: Months a certificate stands before it must be renewed (integer, calendar months; 0 where none is issued).
  certification_fee_usd: Fee to issue or renew the certificate where it is not included (USD).
  tenant_complaint_investigations_per_year: Tenant air quality complaint investigations included per year (integer).
  complaint_response_business_days: Business days to attend a tenant air quality complaint (integer, business days).
  emergency_air_quality_response_hours: Guaranteed response to an air quality emergency such as a sewer gas or smoke complaint (integer, elapsed hours).
  duct_cleaning_included: Whether duct cleaning is included in the program price (boolean).
  duct_cleaning_discount_pct: Discount on quoted duct cleaning where it is not included (percent).
  mold_remediation_referral_included: Whether the company arranges a licensed remediation contractor when mould is found (boolean).
  iaq_labor_rate_usd: Labor rate for air quality work beyond the included content (USD per hour).
  after_hours_rate_multiplier: Multiplier on the labor rate for work outside regular hours (decimal).
  missed_change_credit_pct: Credit of the per-visit value where the company misses a scheduled filter or service visit (percent).
  change_window_grace_business_days: Business days after the scheduled day within which a moved visit is not a missed visit (integer, business days).
  annual_program_fee_usd: Annual program fee before per-unit charges (USD per year).
  per_unit_fee_usd: Annual program charge per covered unit (USD per unit per year).
  setup_fee_usd: One-time fee to survey the filter schedule and set up the program (USD).
  min_units_required: Minimum covered units for the program to be written (integer).
  max_units_per_program: Largest number of units one program may carry (integer).
  filter_survey_required: Whether a filter schedule survey is required before the program is quoted (boolean).
  maintenance_agreement_required: Whether an active maintenance agreement at the site is required for this tier (boolean).
  term_months: Length of one program term (integer, calendar months).
  billing_frequency: How the program price is invoiced (enum annual, semiannual, quarterly, monthly).
  payment_terms_days: Days from invoice date to due date (integer, calendar days).
  late_fee_pct_per_month: Late fee on an overdue invoice per month (percent per month).
  suspension_after_days_past_due: Days past due after which deliveries and visits stop (integer, calendar days).
  reinstatement_fee_usd: Fee charged when a suspended or lapsed program is restarted (USD).
  restart_window_days: Days after the program year end within which a lapsed program restarts without a fresh survey (integer, calendar days).
  auto_renew: Whether the program renews automatically at term end (boolean).
  renewal_window_days: Days before term end at which the renewal window opens (integer, calendar days).
  non_renewal_notice_days: Days before term end by which a non-renewal notice must be received (integer, calendar days).
  annual_escalation_pct: Escalation applied to the program price at each renewal (percent).
  cancellation_notice_days: Days of written notice before a cancellation takes effect (integer, calendar days).
  early_cancellation_fee_pct: Fee on the unbilled remainder of the term when the program is cancelled early (percent).
  unused_filter_refund_pct: Portion of undelivered included filter sets refunded at cancellation (percent).

