  - id: iaq_missed_visit_credit
    subject: [iaq_credit_issued]
    rule: >-
      Where the company fails to perform a booked filter or service visit and does not rebook it inside the
      tier's grace period, the owner is credited. A credit is issued only when the booked visit was not
      performed inside the tier's grace period counted from the day the visit was booked for. The grace period
      is counted in business days on the office calendar, which excludes Saturdays, Sundays and the office
      holidays published for the year, and a visit rebooked on the final grace day is still timely. The credit
      is the per-visit value of the program — the annual price divided by the tier's visits for the year —
      multiplied by the tier's missed visit credit rate, and at the top tier that rate exceeds the per-visit
      value. A visit the owner postponed, and a visit the technician could not perform because the units were
      inaccessible, never produce a credit.
    eligibility:
      - id: visit_missed_beyond_grace
        applies_to: [iaq_credit_issued]
        kind: time
        condition: A credit is issued only when the booked visit was not performed inside the tier's grace period counted from the day the visit was booked for.
        evidence_fields: [iaq_events.scheduled_date, iaq_events.work_order_ref, iaq_events.performed_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [iaq_events.work_order_ref]
          action_bindings:
            iaq_events.work_order_ref: work_order_ref
        temporal_basis:
          clock: frozen_time
          anchor_event: the day the visit was booked for
          anchor_source: iaq_events.scheduled_date
          relation: not_before
          duration_source: variants.change_window_grace_business_days
          unit: business_days
          counting_rule: counted in business days on the office calendar, which excludes Saturdays, Sundays and the office holidays published for the year, and a visit rebooked on the final grace day is still timely
          boundary: exclusive
    params:
      per_tier:
        Filter Supply Program: {credit_pct: "=missed_change_credit_pct", grace_days: "=change_window_grace_business_days", visits: "=filter_change_visits_per_year"}
        Managed Filtration Program: {credit_pct: "=missed_change_credit_pct", grace_days: "=change_window_grace_business_days", visits: "=filter_change_visits_per_year"}
        Coil Hygiene Program: {credit_pct: "=missed_change_credit_pct", grace_days: "=change_window_grace_business_days", visits: "=filter_change_visits_per_year"}
        Air Quality Monitoring Program: {credit_pct: "=missed_change_credit_pct", grace_days: "=change_window_grace_business_days", visits: "=filter_change_visits_per_year"}
        UV & Purification Service Program: {credit_pct: "=missed_change_credit_pct", grace_days: "=change_window_grace_business_days", visits: "=filter_change_visits_per_year"}
        Certified Indoor Air Quality Program: {credit_pct: "=missed_change_credit_pct", grace_days: "=change_window_grace_business_days", visits: "=filter_change_visits_per_year"}
    formula:
      amount_usd: "round(annual_program_price_usd / filter_change_visits_per_year * missed_change_credit_pct / 100, 2)"

  - id: iaq_billing_and_late_fee
    subject: [iaq_invoice_charged, iaq_payment_received]
    rule: >-
      The program price is invoiced on the tier's billing frequency, and extra sets, shipping, lamps,
      laboratory work, duct cleaning and complaint investigations beyond the included counts are invoiced in
      the period they arise. Each invoice falls due the tier's payment term after the invoice date, counted in
      calendar days with the invoice day excluded and the due day included, and an invoice unpaid past its due
      day carries the tier's late fee for each month or part month it stays unpaid. Credits are applied to the
      next program invoice. Payments are applied to the oldest unpaid invoice unless the owner names one.
    eligibility: []
    params:
      per_tier:
        Filter Supply Program: {frequency: "=billing_frequency", terms_days: "=payment_terms_days", late_fee_pct: "=late_fee_pct_per_month"}
        Managed Filtration Program: {frequency: "=billing_frequency", terms_days: "=payment_terms_days", late_fee_pct: "=late_fee_pct_per_month"}
        Coil Hygiene Program: {frequency: "=billing_frequency", terms_days: "=payment_terms_days", late_fee_pct: "=late_fee_pct_per_month"}
        Air Quality Monitoring Program: {frequency: "=billing_frequency", terms_days: "=payment_terms_days", late_fee_pct: "=late_fee_pct_per_month"}
        UV & Purification Service Program: {frequency: "=billing_frequency", terms_days: "=payment_terms_days", late_fee_pct: "=late_fee_pct_per_month"}
        Certified Indoor Air Quality Program: {frequency: "=billing_frequency", terms_days: "=payment_terms_days", late_fee_pct: "=late_fee_pct_per_month"}
    formula:
      late_fee_usd: "round(amount_usd * late_fee_pct_per_month / 100, 2)"

  - id: iaq_suspension_renewal_and_exit
    subject: [iaq_program_suspended, iaq_program_reinstated, iaq_renewal_window_opened, iaq_program_renewed, iaq_program_expired, iaq_program_cancelled]
    rule: >-
      Deliveries and visits stop once an invoice stays unpaid beyond the tier's suspension period counted from
      the day the invoice fell due, counting calendar days with the due day excluded and the final day
      included, and the year's filter credit is held rather than forfeited while the program is suspended.
      Service restarts when the arrears are settled and the tier's reinstatement fee is charged, and a lapsed
      program restarts without a fresh filter survey only inside the tier's restart window counted forward in
      calendar days from the term end date, the end day excluded and the final day included. The renewal
      window opens the tier's renewal period before the term end, and where the tier renews automatically the
      program renews at the escalated price unless a non-renewal notice was received by the tier's notice
      deadline, counted back in calendar days from the term end date with the deadline day counting as timely.
      On early cancellation the tier's cancellation rate is applied to the unbilled remainder of the term and
      undelivered included sets are refunded at the tier's refund portion.
    eligibility:
      - id: arrears_beyond_suspension_period
        applies_to: [iaq_program_suspended]
        kind: time
        condition: Deliveries and visits stop once an invoice stays unpaid beyond the tier's suspension period counted from the day the invoice fell due, counting calendar days with the due day excluded and the final day included, and the year's filter credit is held rather than forfeited while the program is suspended.
        evidence_fields: [iaq_events.due_date, iaq_events.invoice_ref, iaq_events.amount_usd]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [iaq_events.invoice_ref]
          action_bindings:
            iaq_events.invoice_ref: invoice_ref
        temporal_basis:
          clock: frozen_time
          anchor_event: the day the invoice fell due
          anchor_source: iaq_events.due_date
          relation: not_before
          duration_source: variants.suspension_after_days_past_due
          unit: calendar_days
          counting_rule: counting calendar days with the due day excluded and the final day included
          boundary: inclusive
      - id: restart_inside_window
        applies_to: [iaq_program_reinstated]
        kind: time
        condition: a lapsed program restarts without a fresh filter survey only inside the tier's restart window counted forward in calendar days from the term end date, the end day excluded and the final day included
        evidence_fields: [iaq_programs.term_end_date, iaq_programs.program_id, iaq_programs.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [iaq_programs.program_id]
          action_bindings:
            iaq_programs.program_id: program_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the term end date
          anchor_source: iaq_programs.term_end_date
          relation: not_after
          duration_source: variants.restart_window_days
          unit: calendar_days
          counting_rule: counted forward in calendar days from the term end date, the end day excluded and the final day included
          boundary: inclusive
    params:
      per_tier:
        Filter Supply Program: {suspension_days: "=suspension_after_days_past_due", reinstatement_usd: "=reinstatement_fee_usd", restart_days: "=restart_window_days", window_days: "=renewal_window_days", notice_days: "=non_renewal_notice_days", escalation_pct: "=annual_escalation_pct", cancel_fee_pct: "=early_cancellation_fee_pct", refund_pct: "=unused_filter_refund_pct"}
        Managed Filtration Program: {suspension_days: "=suspension_after_days_past_due", reinstatement_usd: "=reinstatement_fee_usd", restart_days: "=restart_window_days", window_days: "=renewal_window_days", notice_days: "=non_renewal_notice_days", escalation_pct: "=annual_escalation_pct", cancel_fee_pct: "=early_cancellation_fee_pct", refund_pct: "=unused_filter_refund_pct"}
        Coil Hygiene Program: {suspension_days: "=suspension_after_days_past_due", reinstatement_usd: "=reinstatement_fee_usd", restart_days: "=restart_window_days", window_days: "=renewal_window_days", notice_days: "=non_renewal_notice_days", escalation_pct: "=annual_escalation_pct", cancel_fee_pct: "=early_cancellation_fee_pct", refund_pct: "=unused_filter_refund_pct"}
        Air Quality Monitoring Program: {suspension_days: "=suspension_after_days_past_due", reinstatement_usd: "=reinstatement_fee_usd", restart_days: "=restart_window_days", window_days: "=renewal_window_days", notice_days: "=non_renewal_notice_days", escalation_pct: "=annual_escalation_pct", cancel_fee_pct: "=early_cancellation_fee_pct", refund_pct: "=unused_filter_refund_pct"}
        UV & Purification Service Program: {suspension_days: "=suspension_after_days_past_due", reinstatement_usd: "=reinstatement_fee_usd", restart_days: "=restart_window_days", window_days: "=renewal_window_days", notice_days: "=non_renewal_notice_days", escalation_pct: "=annual_escalation_pct", cancel_fee_pct: "=early_cancellation_fee_pct", refund_pct: "=unused_filter_refund_pct"}
        Certified Indoor Air Quality Program: {suspension_days: "=suspension_after_days_past_due", reinstatement_usd: "=reinstatement_fee_usd", restart_days: "=restart_window_days", window_days: "=renewal_window_days", notice_days: "=non_renewal_notice_days", escalation_pct: "=annual_escalation_pct", cancel_fee_pct: "=early_cancellation_fee_pct", refund_pct: "=unused_filter_refund_pct"}

  - id: iaq_portfolio_interaction
    subject: [iaq_program_quoted, iaq_filter_change_performed]
    rule: >-
      Filtration is either bought here or inside the maintenance agreement, never twice. Where the building
      holds a maintenance agreement whose tier already includes filter change visits, this program is quoted
      only for the content the agreement does not carry — coil hygiene, purification, testing or
      certification — and the filter sets stay on the agreement. A building that takes filtration here does
      not hold the maintenance entry tier, whose whole content is filter and belt service. Where the filter
      change finds a mechanical fault, the fault is passed to the maintenance agreement or quoted as demand
      service rather than worked on this program's visit. Where an energy subscription flags a pressure drop
      that a filter change would clear, the change is performed from this program's credit and the energy
      subscription is not billed for it.
    eligibility:
      - id: agreement_filter_content_checked
        applies_to: [iaq_program_quoted]
        kind: state
        condition: Where the building holds a maintenance agreement whose tier already includes filter change visits, this program is quoted only for the content the agreement does not carry — coil hygiene, purification, testing or certification — and the filter sets stay on the agreement.
        evidence_fields: [maintenance_agreements.status, maintenance_agreements.site_id, maintenance_agreements.variant_name]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [maintenance_agreements.site_id]
          action_bindings:
            maintenance_agreements.site_id: site_id
        state_contract:
          field: maintenance_agreements.status
          allowed: [active, pending_renewal, suspended]
    params:
      per_tier:
        Filter Supply Program: {grade: "=filter_grade_supplied", visits: "=filter_change_visits_per_year"}
        Managed Filtration Program: {grade: "=filter_grade_supplied", visits: "=filter_change_visits_per_year"}
        Coil Hygiene Program: {grade: "=filter_grade_supplied", visits: "=filter_change_visits_per_year"}
        Air Quality Monitoring Program: {grade: "=filter_grade_supplied", visits: "=filter_change_visits_per_year"}
        UV & Purification Service Program: {grade: "=filter_grade_supplied", visits: "=filter_change_visits_per_year"}
        Certified Indoor Air Quality Program: {grade: "=filter_grade_supplied", visits: "=filter_change_visits_per_year"}
