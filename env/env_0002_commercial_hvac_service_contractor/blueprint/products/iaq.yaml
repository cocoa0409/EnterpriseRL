events:
  - type: iaq_program_quoted
    target: iaq_programs
    mutation: create
    meaning: An air quality or filtration program is quoted for a building and the program record is opened.
    grain: One row per program quoted for one site at one tier.
    fields:
      program_id: The reference number of this program record.
      customer_id: The building owner quoted.
      site_id: The building the program covers.
      variant_name: The program tier quoted, written as its official full name.
      status: The lifecycle status, pinned to quoted when the program is opened.
      quote_date: The day the program quote was issued.
      units_covered: The number of air handling units the quote covers.
      annual_program_price_usd: The annual program price quoted.
    triggers: []
  - type: iaq_program_activated
    target: iaq_programs
    mutation: {transition: {from: quoted, to: active}}
    meaning: The owner accepts the quote and the program year begins.
    grain: One row per program, changed once when the program year begins.
    fields:
      status: The lifecycle status, moved to active.
      accepted_date: The day the owner accepted the quote.
      term_start_date: The first day of the program term.
      term_end_date: The last day of the program term.
      next_service_due_date: The day the first filter or service visit is due.
    triggers:
      - event: iaq:iaq_filter_credit_granted
        map: {program_id: program_id, customer_id: customer_id}
      - event: iaq:iaq_invoice_charged
        map: {program_id: program_id, customer_id: customer_id, charge_type: setup_fee}
  - type: iaq_quote_declined
    target: iaq_programs
    mutation: {transition: {from: quoted, to: declined}}
    meaning: The owner declines the program quote.
    grain: One row per quote, changed once when it is declined.
    fields:
      status: The lifecycle status, moved to declined.
      cancellation_date: The day the quote was declined.
      cancellation_reason: Why the quote was declined.
    triggers: []
  - type: iaq_renewal_window_opened
    target: iaq_programs
    mutation: {transition: {from: active, to: pending_renewal}}
    meaning: The program enters its renewal window.
    grain: One row per program, changed once per term when the renewal window opens.
    fields:
      status: The lifecycle status, moved to pending_renewal.
      renewal_notice_date: The day the renewal window opened.
    triggers: []
  - type: iaq_program_renewed
    target: iaq_programs
    mutation: {transition: {from: pending_renewal, to: active}}
    meaning: The program is renewed for a further year at the escalated price.
    grain: One row per program, changed once per renewal.
    fields:
      status: The lifecycle status, moved back to active.
      term_start_date: The first day of the renewed term.
      term_end_date: The last day of the renewed term.
      annual_program_price_usd: The program price for the renewed term.
    triggers:
      - event: iaq:iaq_filter_credit_granted
        map: {program_id: program_id, customer_id: customer_id}
  - type: iaq_program_suspended
    target: iaq_programs
    mutation: {transition: [{from: active, to: suspended}, {from: pending_renewal, to: suspended}]}
    meaning: Deliveries and service visits stop because the program is in arrears.
    grain: One row per program, changed once per suspension.
    fields:
      status: The lifecycle status, moved to suspended.
      suspension_date: The day deliveries and visits stopped.
    triggers: []
  - type: iaq_program_reinstated
    target: iaq_programs
    mutation: {transition: [{from: suspended, to: active}, {from: expired, to: active}]}
    meaning: Deliveries and service visits restart on a suspended or lapsed program.
    grain: One row per program, changed once per reinstatement.
    fields:
      status: The lifecycle status, moved back to active.
      reinstatement_date: The day deliveries and visits restarted.
      term_end_date: The last day of the term the program returns to.
    triggers:
      - event: iaq:iaq_invoice_charged
        map: {program_id: program_id, customer_id: customer_id, charge_type: reinstatement}
  - type: iaq_program_expired
    target: iaq_programs
    mutation: {transition: {from: pending_renewal, to: expired}}
    meaning: The program year ends without a renewal.
    grain: One row per program, changed once when the term lapses.
    fields:
      status: The lifecycle status, moved to expired.
      term_end_date: The last day of the term that has just ended.
    triggers: []
  - type: iaq_program_cancelled
    target: iaq_programs
    mutation: {transition: [{from: active, to: cancelled}, {from: suspended, to: cancelled}]}
    meaning: The program is ended before its term end and undelivered filters are settled.
    grain: One row per program, changed once when it is ended early.
    fields:
      status: The lifecycle status, moved to cancelled.
      cancellation_date: The day the cancellation was recorded.
      termination_effective_date: The day deliveries and visits actually stop.
      cancellation_reason: Why the program was ended.
    triggers:
      - event: iaq:iaq_invoice_charged
        when: {cancellation_reason: customer_convenience}
        map: {program_id: program_id, customer_id: customer_id, charge_type: early_cancellation}
  - type: iaq_coverage_updated
    target: iaq_programs
    mutation: update
    meaning: The covered units or the filter schedule of a live program change.
    grain: One row per program, changed once per accepted coverage change.
    fields:
      units_covered: The covered unit count after the change.
      annual_program_price_usd: The program price after the change.
      last_change_type: What kind of change was applied.
      last_change_date: The day the change took effect.
    triggers: []
  - type: iaq_filter_credit_granted
    target: iaq_events
    account: filter_credit
    direction: in
    meaning: The program year's included filter sets are credited at activation or renewal.
    grain: One row per program year crediting of filter sets.
    distinguish_by: [billing_period, filter_sets]
    fields:
      program_id: The program the sets are credited to.
      customer_id: The building owner the program belongs to.
      event_type: The event family of this row.
      billing_period: The program year the credit belongs to.
      filter_sets: The filter sets credited for the year.
    triggers: []
  - type: iaq_filter_change_performed
    target: iaq_events
    account: filter_credit
    direction: out
    meaning: Filters are fitted at the site, consuming filter sets from the program year's credit.
    grain: One row per filter change visit on one program.
    distinguish_by: [work_order_ref, performed_date, equipment_tag, filter_sets]
    fields:
      program_id: The program the change was performed under.
      customer_id: The building owner the change was performed for.
      event_type: The event family of this row.
      site_id: The building the change was performed at.
      work_order_ref: The work order the change was performed under.
      equipment_tag: The unit the filters were fitted in.
      performed_date: The day the filters were fitted.
      scheduled_date: The day the change was booked for.
      filter_sets: The filter sets fitted.
      filter_grade: The efficiency grade of the filters fitted.
      performed_by: Whether the company or the owner's own staff fitted them.
    triggers:
      - event: iaq:iaq_invoice_charged
        when: {performed_by: contractor}
        map: {program_id: program_id, customer_id: customer_id, work_order_ref: work_order_ref, charge_type: service_visit}
  - type: iaq_coil_service_performed
    target: iaq_events
    meaning: Coil cleaning, coating, drain treatment or ultraviolet lamp work is performed on a covered unit.
    grain: One row per coil or purification service performed on one unit.
    distinguish_by: [work_order_ref, performed_date, equipment_tag, service_class]
    fields:
      program_id: The program the service was performed under.
      customer_id: The building owner the service was performed for.
      event_type: The event family of this row.
      site_id: The building the service was performed at.
      work_order_ref: The work order the service was performed under.
      equipment_tag: The unit serviced.
      service_class: What kind of air quality service was performed.
      performed_date: The day the service was performed.
      scheduled_date: The day the service was booked for.
      lamps_replaced: Ultraviolet lamps replaced on this visit.
      labor_hours: Technician hours spent on the service.
    triggers:
      - event: iaq:iaq_invoice_charged
        when: {service_class: duct_cleaning}
        map: {program_id: program_id, customer_id: customer_id, work_order_ref: work_order_ref, charge_type: duct_cleaning}
  - type: iaq_air_test_performed
    target: iaq_events
    meaning: An indoor air quality test is carried out at the building and the readings are recorded.
    grain: One row per air quality test visit on one program.
    distinguish_by: [test_ref, performed_date, test_location]
    fields:
      program_id: The program the test was performed under.
      customer_id: The building owner the test was performed for.
      event_type: The event family of this row.
      site_id: The building tested.
      test_ref: The test reference number.
      test_location: Where in the building the readings were taken.
      performed_date: The day the test was carried out.
      samples_collected: The number of samples sent for laboratory analysis.
      result_class: How the readings stood against the published thresholds.
      report_due_date: The day the test report is due.
    triggers:
      - event: iaq:iaq_invoice_charged
        when: {result_class: exceedance}
        map: {program_id: program_id, customer_id: customer_id, test_ref: test_ref, charge_type: lab_analysis}
  - type: iaq_complaint_investigated
    target: iaq_events
    meaning: A tenant air quality complaint is investigated at the building.
    grain: One row per complaint investigation on one program.
    distinguish_by: [complaint_ref, investigated_date, test_location]
    fields:
      program_id: The program the investigation was carried out under.
      customer_id: The building owner who reported the complaint.
      event_type: The event family of this row.
      site_id: The building investigated.
      complaint_ref: The complaint reference number.
      complaint_class: What the tenant reported.
      reported_date: The day the complaint was reported.
      investigated_date: The day a technician attended.
      test_location: Where in the building the complaint arose.
      labor_hours: Technician hours spent on the investigation.
    triggers: []
  - type: iaq_invoice_charged
    target: iaq_events
    account: iaq_balance
    direction: in
    meaning: A program fee or an extra air quality service is invoiced to the owner.
    grain: One row per charge line invoiced on one program.
    distinguish_by: [invoice_ref, charge_type, amount_usd, work_order_ref]
    fields:
      program_id: The program the charge belongs to.
      customer_id: The building owner invoiced.
      event_type: The event family of this row.
      invoice_ref: The invoice the charge was billed on.
      charge_type: Which kind of charge this line is.
      amount_usd: The amount charged.
      work_order_ref: The work order the charge arises from, where there is one.
      test_ref: The test the charge arises from, where there is one.
      billing_period: The period the charge covers.
      due_date: The day the invoice falls due.
    triggers: []
  - type: iaq_payment_received
    target: iaq_events
    account: iaq_balance
    direction: out
    meaning: A payment from the owner is applied to the air quality program balance.
    grain: One row per payment applied to one invoice.
    distinguish_by: [invoice_ref, received_date, amount_usd, payment_method]
    fields:
      program_id: The program the payment is applied to.
      customer_id: The building owner who paid.
      event_type: The event family of this row.
      invoice_ref: The invoice the payment is applied to.
      amount_usd: The amount paid.
      payment_method: How the payment was made.
      received_date: The day the payment was received.
    triggers: []
  - type: iaq_credit_issued
    target: iaq_events
    account: iaq_balance
    direction: out
    meaning: A credit is issued against the air quality program balance, most often for a missed service visit.
    grain: One row per credit issued on one program.
    distinguish_by: [invoice_ref, credit_reason, amount_usd, work_order_ref]
    fields:
      program_id: The program credited.
      customer_id: The building owner credited.
      event_type: The event family of this row.
      invoice_ref: The invoice the credit is applied against.
      credit_reason: Why the credit was issued.
      amount_usd: The amount credited.
      work_order_ref: The visit the credit arises from, where it arises from one.
      billing_period: The period the credit falls in.
    triggers: []

measures:
  - id: iaq_msr_filter_sets_used_year
    window: The current program year, from term_start_date through term_end_date inclusive.
    measure: Sum of filter_sets over iaq_filter_change_performed rows on this program whose performed_date falls in the window.
  - id: iaq_msr_complaints_this_year
    window: The current program year, from term_start_date through term_end_date inclusive.
    measure: Count of iaq_complaint_investigated rows on this program whose investigated_date falls in the window.

policies:
  - id: iaq_agg_multi_holding
    subject: [iaq_program_quoted]
    rule: >-
      A building owner may hold an air quality program at each of their buildings. A second program is not
      quoted for a site that already holds one in quoted, active, pending_renewal or suspended status; the
      covered units of that program are amended instead. Filter credits are held per program and are never
      moved between buildings, because the filter sizes and the schedule belong to one building's equipment.
      Programs in expired, cancelled or declined status do not block a fresh quote.
    eligibility:
      - id: one_live_program_per_site
        applies_to: [iaq_program_quoted]
        kind: dedup
        condition: A second program is not quoted for a site that already holds one in quoted, active, pending_renewal or suspended status; the covered units of that program are amended instead.
        evidence_fields: [iaq_programs.site_id, iaq_programs.status, iaq_programs.program_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [iaq_programs.site_id]
          action_bindings:
            iaq_programs.site_id: site_id
        dedup_contract:
          table: iaq_programs
          mode: separate_record
          object_bindings: {site_id: site_id}
          duplicate_filters: {status: [quoted, active, pending_renewal, suspended]}
          distinct_fields: [variant_name, quote_date]
    params:
      max_per_customer: null

  - id: iaq_agg_portfolio_volume_pricing
    subject: [iaq_program_quoted, iaq_coverage_updated, iaq_program_renewed]
    rule: >-
      Filter volume is counted across the owner's portfolio before a program is priced. The volume is the sum
      of units_covered over that owner's programs in active or pending_renewal status, plus the program being
      priced; quoted, suspended, expired, cancelled and declined programs are not counted. A portfolio above
      forty covered units is priced at the stocking rate rather than the order rate, which lowers the per-unit
      charge of every program the owner holds at their next renewal, not immediately. Each program is
      otherwise priced from its own tier's annual fee and its own tier's per-unit charge for its own units.
    eligibility: []
    params:
      stocking_threshold_units: The stocking rate applies once the owner's counted units pass forty.
      per_tier:
        Filter Supply Program: {annual_fee_usd: "=annual_program_fee_usd", per_unit_usd: "=per_unit_fee_usd"}
        Managed Filtration Program: {annual_fee_usd: "=annual_program_fee_usd", per_unit_usd: "=per_unit_fee_usd"}
        Coil Hygiene Program: {annual_fee_usd: "=annual_program_fee_usd", per_unit_usd: "=per_unit_fee_usd"}
        Air Quality Monitoring Program: {annual_fee_usd: "=annual_program_fee_usd", per_unit_usd: "=per_unit_fee_usd"}
        UV & Purification Service Program: {annual_fee_usd: "=annual_program_fee_usd", per_unit_usd: "=per_unit_fee_usd"}
        Certified Indoor Air Quality Program: {annual_fee_usd: "=annual_program_fee_usd", per_unit_usd: "=per_unit_fee_usd"}
    formula:
      annual_price_usd: "round(annual_program_fee_usd + per_unit_fee_usd * units_covered, 2)"

  - id: iaq_program_qualification
    subject: [iaq_program_quoted, iaq_quote_declined]
    rule: >-
      A tier is quoted only for a building whose equipment it fits. The site must carry at least the tier's
      minimum covered units and no more than its maximum, and every unit's filter size must be one the tier
      stocks; a building with filter sizes outside the stocked list is quoted with those units excluded. A
      tier whose survey requirement is set is quoted only where a filter schedule survey for that building is
      recorded as completed in the office records, since the schedule fixes both the sizes and the count. A
      tier that requires maintenance is quoted only where the building holds a maintenance agreement in active
      or pending_renewal status. The setup fee is charged when the program starts and is not refunded if the
      owner later cancels.
    eligibility:
      - id: filter_survey_completed
        applies_to: [iaq_program_quoted]
        kind: authorization
        condition: A tier whose survey requirement is set is quoted only where a filter schedule survey for that building is recorded as completed in the office records, since the schedule fixes both the sizes and the count.
        evidence_fields: [iaq_requests.site_id, iaq_requests.request_type, iaq_requests.outcome]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [iaq_requests.site_id]
          action_bindings:
            iaq_requests.site_id: site_id
      - id: maintenance_agreement_at_site
        applies_to: [iaq_program_quoted]
        kind: state
        condition: A tier that requires maintenance is quoted only where the building holds a maintenance agreement in active or pending_renewal status.
        evidence_fields: [maintenance_agreements.status, maintenance_agreements.site_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [maintenance_agreements.site_id]
          action_bindings:
            maintenance_agreements.site_id: site_id
        state_contract:
          field: maintenance_agreements.status
          allowed: [active, pending_renewal]
    params:
      per_tier:
        Filter Supply Program: {min_units: "=min_units_required", max_units: "=max_units_per_program", survey: "=filter_survey_required", maintenance: "=maintenance_agreement_required", setup_usd: "=setup_fee_usd"}
        Managed Filtration Program: {min_units: "=min_units_required", max_units: "=max_units_per_program", survey: "=filter_survey_required", maintenance: "=maintenance_agreement_required", setup_usd: "=setup_fee_usd"}
        Coil Hygiene Program: {min_units: "=min_units_required", max_units: "=max_units_per_program", survey: "=filter_survey_required", maintenance: "=maintenance_agreement_required", setup_usd: "=setup_fee_usd"}
        Air Quality Monitoring Program: {min_units: "=min_units_required", max_units: "=max_units_per_program", survey: "=filter_survey_required", maintenance: "=maintenance_agreement_required", setup_usd: "=setup_fee_usd"}
        UV & Purification Service Program: {min_units: "=min_units_required", max_units: "=max_units_per_program", survey: "=filter_survey_required", maintenance: "=maintenance_agreement_required", setup_usd: "=setup_fee_usd"}
        Certified Indoor Air Quality Program: {min_units: "=min_units_required", max_units: "=max_units_per_program", survey: "=filter_survey_required", maintenance: "=maintenance_agreement_required", setup_usd: "=setup_fee_usd"}

  - id: iaq_activation_and_filter_credit
    subject: [iaq_program_activated, iaq_filter_credit_granted, iaq_coverage_updated]
    rule: >-
      A program starts when the owner's acceptance of the quote is recorded against it. At the start of each
      program year the program is credited with the tier's included filter sets for each covered unit, and the
      credit does not carry forward at the year end. Where the tier changes the filters itself, the sets are
      consumed as they are fitted; where the tier only supplies them, the sets are consumed as they are
      delivered and the owner's own staff fit them. A unit added mid-year is credited its sets pro rata by
      whole months remaining, and a unit removed leaves its undelivered sets in the credit for the rest of the
      year rather than being refunded at once.
    eligibility:
      - id: acceptance_recorded
        applies_to: [iaq_program_activated]
        kind: authorization
        condition: A program starts when the owner's acceptance of the quote is recorded against it.
        evidence_fields: [iaq_requests.program_id, iaq_requests.request_type, iaq_requests.outcome]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [iaq_requests.program_id]
          action_bindings:
            iaq_requests.program_id: program_id
    params:
      per_tier:
        Filter Supply Program: {sets_per_unit: "=filters_included_per_unit_per_year", visits: "=filter_change_visits_per_year", grade: "=filter_grade_supplied"}
        Managed Filtration Program: {sets_per_unit: "=filters_included_per_unit_per_year", visits: "=filter_change_visits_per_year", grade: "=filter_grade_supplied"}
        Coil Hygiene Program: {sets_per_unit: "=filters_included_per_unit_per_year", visits: "=filter_change_visits_per_year", grade: "=filter_grade_supplied"}
        Air Quality Monitoring Program: {sets_per_unit: "=filters_included_per_unit_per_year", visits: "=filter_change_visits_per_year", grade: "=filter_grade_supplied"}
        UV & Purification Service Program: {sets_per_unit: "=filters_included_per_unit_per_year", visits: "=filter_change_visits_per_year", grade: "=filter_grade_supplied"}
        Certified Indoor Air Quality Program: {sets_per_unit: "=filters_included_per_unit_per_year", visits: "=filter_change_visits_per_year", grade: "=filter_grade_supplied"}
    formula:
      sets_credited: "filters_included_per_unit_per_year * units_covered"

  - id: iaq_filter_service
    subject: [iaq_filter_change_performed]
    rule: >-
      Filter changes are performed only while the program stands in active or pending_renewal status. Filters
      are fitted at the tier's grade and at the tier's number of visits per year, spread evenly across the
      year, and belts changed at the same visit are included where the tier includes them. A set fitted beyond
      the year's credit is charged at the tier's extra set price, and a set fitted at a higher grade than the
      tier supplies is charged the difference. Where the tier includes disposal, used filters are taken away;
      where it does not, they are left on site bagged. Shipping is charged per delivery where the tier does
      not include it, whatever the number of sets in the delivery.
    eligibility:
      - id: live_program_for_service
        applies_to: [iaq_filter_change_performed]
        kind: state
        condition: Filter changes are performed only while the program stands in active or pending_renewal status.
        evidence_fields: [iaq_programs.status, iaq_programs.program_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [iaq_programs.program_id]
          action_bindings:
            iaq_programs.program_id: program_id
        state_contract:
          field: iaq_programs.status
          allowed: [active, pending_renewal]
    measures: [iaq_msr_filter_sets_used_year]
    params:
      per_tier:
        Filter Supply Program: {extra_set_usd: "=extra_filter_set_price_usd", shipping_usd: "=shipping_fee_usd", disposal: "=filter_disposal_included", belts: "=belt_replacement_included"}
        Managed Filtration Program: {extra_set_usd: "=extra_filter_set_price_usd", shipping_usd: "=shipping_fee_usd", disposal: "=filter_disposal_included", belts: "=belt_replacement_included"}
        Coil Hygiene Program: {extra_set_usd: "=extra_filter_set_price_usd", shipping_usd: "=shipping_fee_usd", disposal: "=filter_disposal_included", belts: "=belt_replacement_included"}
        Air Quality Monitoring Program: {extra_set_usd: "=extra_filter_set_price_usd", shipping_usd: "=shipping_fee_usd", disposal: "=filter_disposal_included", belts: "=belt_replacement_included"}
        UV & Purification Service Program: {extra_set_usd: "=extra_filter_set_price_usd", shipping_usd: "=shipping_fee_usd", disposal: "=filter_disposal_included", belts: "=belt_replacement_included"}
        Certified Indoor Air Quality Program: {extra_set_usd: "=extra_filter_set_price_usd", shipping_usd: "=shipping_fee_usd", disposal: "=filter_disposal_included", belts: "=belt_replacement_included"}

  - id: iaq_coil_and_purification_service
    subject: [iaq_coil_service_performed]
    rule: >-
      Coil cleaning is performed at the tier's number of visits per year, with coil coating and drain pan
      treatment carried out at the visits of the tiers that include them. Ultraviolet lamps are replaced at
      the tier's replacement interval counted in whole calendar months from the day the lamp was last fitted,
      and lamps beyond the tier's included count are charged at the tier's lamp price. Bipolar ionisation
      equipment is serviced only at the tiers that cover it, and at every other tier such equipment is
      quoted as demand work. Duct cleaning is included only at the top tier; elsewhere it is quoted with the
      tier's duct cleaning discount applied. Where mould is found, the company reports it and, at the tiers
      that include the referral, arranges a licensed remediation contractor, but it never performs
      remediation itself.
    eligibility: []
    params:
      per_tier:
        Filter Supply Program: {coil_visits: "=coil_cleaning_visits_per_year", coating: "=coil_coating_included", lamps: "=uv_lamps_included", lamp_months: "=uv_lamp_replacement_months", lamp_usd: "=uv_lamp_price_usd", duct: "=duct_cleaning_included", duct_discount_pct: "=duct_cleaning_discount_pct"}
        Managed Filtration Program: {coil_visits: "=coil_cleaning_visits_per_year", coating: "=coil_coating_included", lamps: "=uv_lamps_included", lamp_months: "=uv_lamp_replacement_months", lamp_usd: "=uv_lamp_price_usd", duct: "=duct_cleaning_included", duct_discount_pct: "=duct_cleaning_discount_pct"}
        Coil Hygiene Program: {coil_visits: "=coil_cleaning_visits_per_year", coating: "=coil_coating_included", lamps: "=uv_lamps_included", lamp_months: "=uv_lamp_replacement_months", lamp_usd: "=uv_lamp_price_usd", duct: "=duct_cleaning_included", duct_discount_pct: "=duct_cleaning_discount_pct"}
        Air Quality Monitoring Program: {coil_visits: "=coil_cleaning_visits_per_year", coating: "=coil_coating_included", lamps: "=uv_lamps_included", lamp_months: "=uv_lamp_replacement_months", lamp_usd: "=uv_lamp_price_usd", duct: "=duct_cleaning_included", duct_discount_pct: "=duct_cleaning_discount_pct"}
        UV & Purification Service Program: {coil_visits: "=coil_cleaning_visits_per_year", coating: "=coil_coating_included", lamps: "=uv_lamps_included", lamp_months: "=uv_lamp_replacement_months", lamp_usd: "=uv_lamp_price_usd", duct: "=duct_cleaning_included", duct_discount_pct: "=duct_cleaning_discount_pct"}
        Certified Indoor Air Quality Program: {coil_visits: "=coil_cleaning_visits_per_year", coating: "=coil_coating_included", lamps: "=uv_lamps_included", lamp_months: "=uv_lamp_replacement_months", lamp_usd: "=uv_lamp_price_usd", duct: "=duct_cleaning_included", duct_discount_pct: "=duct_cleaning_discount_pct"}

  - id: iaq_testing_and_certification
    subject: [iaq_air_test_performed, iaq_complaint_investigated]
    rule: >-
      Air quality testing is carried out at the tier's number of visits per year, measuring the parameters the
      tier covers, and the report is delivered within the tier's report period counted in business days after
      the test on the office calendar, which excludes Saturdays, Sundays and the office holidays published for
      the year. Laboratory analysis is included only at the tiers that include it; elsewhere samples are sent
      at the owner's cost. Where a reading passes a published threshold, the company reports the exceedance,
      repeats the test at no charge once, and advises what mechanical work would address it, but it never
      certifies a building it has not tested at the tier that includes certification. The certificate, where
      the tier issues one, stands for the tier's certification period and lapses with the program. Tenant
      complaints are attended within the tier's response period, counted in business days from the day the
      complaint was reported, up to the tier's included investigations per year; investigations beyond that
      count are charged at the tier's labor rate.
    eligibility: []
    measures: [iaq_msr_complaints_this_year]
    params:
      per_tier:
        Filter Supply Program: {tests: "=air_test_visits_per_year", lab: "=lab_analysis_included", report_days: "=report_business_days", cert: "=certification_included", cert_months: "=certification_renewal_months", complaints: "=tenant_complaint_investigations_per_year", complaint_days: "=complaint_response_business_days"}
        Managed Filtration Program: {tests: "=air_test_visits_per_year", lab: "=lab_analysis_included", report_days: "=report_business_days", cert: "=certification_included", cert_months: "=certification_renewal_months", complaints: "=tenant_complaint_investigations_per_year", complaint_days: "=complaint_response_business_days"}
        Coil Hygiene Program: {tests: "=air_test_visits_per_year", lab: "=lab_analysis_included", report_days: "=report_business_days", cert: "=certification_included", cert_months: "=certification_renewal_months", complaints: "=tenant_complaint_investigations_per_year", complaint_days: "=complaint_response_business_days"}
        Air Quality Monitoring Program: {tests: "=air_test_visits_per_year", lab: "=lab_analysis_included", report_days: "=report_business_days", cert: "=certification_included", cert_months: "=certification_renewal_months", complaints: "=tenant_complaint_investigations_per_year", complaint_days: "=complaint_response_business_days"}
