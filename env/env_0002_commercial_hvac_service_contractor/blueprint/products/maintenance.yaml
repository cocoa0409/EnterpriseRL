      equipment_change_min_charge_usd: 400
      multi_site_discount_pct: 8
      multi_site_discount_threshold: 2
      proposal_validity_days: 60
      bundle_credit_with_controls_usd: 900
      block_rate_substitution_allowed: false

# ---- data flow (every write is an event) ---------------------------------------
events:
  - type: maintenance_agreement_proposed
    target: maintenance_agreements
    mutation: create
    meaning: A maintenance proposal is issued to a building owner for one site and lands as a proposed agreement record.
    grain: One row per proposal issued for one site and one tier.
    fields:
      agreement_id: The reference number of this agreement record.
      customer_id: The building owner the proposal is issued to.
      site_id: The building the equipment schedule belongs to.
      variant_name: The tier proposed, written as its official full name.
      status: The lifecycle status of the agreement, pinned to proposed at issue.
      proposal_date: The day the proposal was issued.
      equipment_count: The number of units on the equipment schedule to be covered.
      annual_price_usd: The annual agreement price quoted on the proposal.
      term_months_quoted: The term length quoted on the proposal.
    triggers: []
  - type: maintenance_agreement_activated
    target: maintenance_agreements
    mutation: {transition: {from: proposed, to: active}}
    meaning: The customer signs the proposal and the agreement term begins.
    grain: One row per agreement, changed once when the term begins.
    fields:
      status: The lifecycle status, moved to active.
      signed_date: The day the signed acceptance was received.
      term_start_date: The first day of the agreement term.
      term_end_date: The last day of the agreement term.
      next_visit_due_date: The day the first scheduled visit is due.
    triggers:
      - event: maintenance:maintenance_visit_entitlement_credited
        map: {agreement_id: agreement_id, customer_id: customer_id}
      - event: maintenance:maintenance_repair_allowance_credited
        map: {agreement_id: agreement_id, customer_id: customer_id}
      - event: maintenance:maintenance_installment_charged
        map: {agreement_id: agreement_id, customer_id: customer_id, charge_type: installment}
  - type: maintenance_renewal_window_opened
    target: maintenance_agreements
    mutation: {transition: {from: active, to: pending_renewal}}
    meaning: The agreement enters the renewal window ahead of its term end.
    grain: One row per agreement, changed once per term when the renewal window opens.
    fields:
      status: The lifecycle status, moved to pending_renewal.
      renewal_notice_date: The day the renewal window opened and the renewal notice was sent.
    triggers: []
  - type: maintenance_agreement_renewed
    target: maintenance_agreements
    mutation: {transition: {from: pending_renewal, to: active}}
    meaning: The agreement is renewed for a further term at the escalated price.
    grain: One row per agreement, changed once per renewal.
    fields:
      status: The lifecycle status, moved back to active.
      term_start_date: The first day of the renewed term.
      term_end_date: The last day of the renewed term.
      annual_price_usd: The annual price for the renewed term after escalation.
      next_visit_due_date: The day the first scheduled visit of the renewed term is due.
    triggers:
      - event: maintenance:maintenance_visit_entitlement_credited
        map: {agreement_id: agreement_id, customer_id: customer_id}
      - event: maintenance:maintenance_repair_allowance_credited
        map: {agreement_id: agreement_id, customer_id: customer_id}
      - event: maintenance:maintenance_installment_charged
        map: {agreement_id: agreement_id, customer_id: customer_id, charge_type: installment}
  - type: maintenance_agreement_suspended
    target: maintenance_agreements
    mutation: {transition: [{from: active, to: suspended}, {from: pending_renewal, to: suspended}]}
    meaning: Coverage is suspended because an installment has stayed unpaid past the grace period.
    grain: One row per agreement, changed once per suspension.
    fields:
      status: The lifecycle status, moved to suspended.
      suspension_date: The day coverage was suspended.
    triggers: []
  - type: maintenance_agreement_reinstated
    target: maintenance_agreements
    mutation: {transition: [{from: suspended, to: active}, {from: expired, to: active}]}
    meaning: A suspended or recently expired agreement is put back in force.
    grain: One row per agreement, changed once per reinstatement.
    fields:
      status: The lifecycle status, moved back to active.
      reinstatement_date: The day the agreement was put back in force.
      term_end_date: The last day of the term the agreement is reinstated into.
    triggers:
      - event: maintenance:maintenance_fee_charged
        map: {agreement_id: agreement_id, customer_id: customer_id, charge_type: reinstatement}
  - type: maintenance_agreement_expired
    target: maintenance_agreements
    mutation: {transition: {from: pending_renewal, to: expired}}
    meaning: The term ends without a renewal and coverage lapses.
    grain: One row per agreement, changed once when the term lapses.
    fields:
      status: The lifecycle status, moved to expired.
      term_end_date: The last day of the term that has just ended.
    triggers: []
  - type: maintenance_agreement_cancelled
    target: maintenance_agreements
    mutation: {transition: [{from: active, to: cancelled}, {from: pending_renewal, to: cancelled}, {from: suspended, to: cancelled}]}
    meaning: The agreement is ended before its term end, either on the customer's notice or for cause.
    grain: One row per agreement, changed once when it is ended early.
    fields:
      status: The lifecycle status, moved to cancelled.
      cancellation_date: The day the cancellation was recorded.
      termination_effective_date: The day coverage actually stops.
      cancellation_reason: Why the agreement was ended.
    triggers:
      - event: maintenance:maintenance_fee_charged
        when: {cancellation_reason: customer_convenience}
        map: {agreement_id: agreement_id, customer_id: customer_id, charge_type: early_termination}
  - type: maintenance_proposal_closed
    target: maintenance_agreements
    mutation: {transition: [{from: proposed, to: declined}, {from: proposed, to: withdrawn}]}
    meaning: A proposal ends without a signature, because the customer declines it or its validity period lapses.
    grain: One row per proposal, changed once when it closes unsigned.
    fields:
      status: The lifecycle status, moved to declined or withdrawn.
      cancellation_date: The day the proposal was closed.
      cancellation_reason: Why the proposal closed unsigned.
    triggers: []
  - type: maintenance_schedule_updated
    target: maintenance_agreements
    mutation: update
    meaning: The equipment schedule or the priced content of a live agreement changes mid-term.
    grain: One row per agreement, changed once per accepted schedule change.
    fields:
      equipment_count: The number of units on the equipment schedule after the change.
      annual_price_usd: The annual agreement price after the change.
      last_change_type: What kind of change was applied to the agreement.
      last_change_date: The day the change took effect.
    triggers:
      - event: maintenance:maintenance_fee_charged
        when: {last_change_type: equipment_added}
        map: {agreement_id: agreement_id, customer_id: customer_id, charge_type: equipment_change}
  - type: maintenance_visit_scheduled
    target: maintenance_events
    meaning: A scheduled maintenance visit is booked into the calendar for a covered site.
    grain: One row per visit booking on one agreement.
    distinguish_by: [work_order_ref, scheduled_date, visit_sequence, service_category]
    fields:
      agreement_id: The agreement the visit is booked under.
      customer_id: The building owner the visit is for.
      event_type: The event family of this row.
      work_order_ref: The work order this visit is booked under.
      visit_sequence: Which visit of the term this is.
      scheduled_date: The day the visit is booked for.
      scheduled_window: The arrival window booked with the customer.
      service_category: What kind of visit is booked.
      equipment_tag: The unit the visit is booked against, where the visit targets one unit.
    triggers: []
  - type: maintenance_visit_completed
    target: maintenance_events
    account: pm_visit_entitlement
    direction: out
    meaning: A technician completes a scheduled visit, consuming one visit of the entitlement.
    grain: One row per completed visit on one agreement.
    distinguish_by: [work_order_ref, completed_date, visit_sequence, service_category]
    fields:
      agreement_id: The agreement the visit was performed under.
      customer_id: The building owner the visit was performed for.
      event_type: The event family of this row.
      work_order_ref: The work order the visit was performed under.
      visit_sequence: Which visit of the term this is.
      completed_date: The day the technician completed the visit.
      service_category: What kind of visit was performed.
      labor_hours: Technician hours spent on site.
      hours_band: Whether the work fell in regular hours or outside them.
      equipment_tag: The unit the visit was performed on, where the visit targets one unit.
      technician_ref: The technician who performed the visit.
    triggers:
      - event: maintenance:maintenance_report_issued
        when: {service_category: [preventive, inspection]}
        map: {agreement_id: agreement_id, customer_id: customer_id, work_order_ref: work_order_ref}
      - event: maintenance:maintenance_fee_charged
        when: {service_category: no_access}
        map: {agreement_id: agreement_id, customer_id: customer_id, charge_type: no_access_trip}
  - type: maintenance_report_issued
    target: maintenance_events
    meaning: The written condition report for a completed visit is delivered to the building owner.
    grain: One row per report delivered for one completed visit.
    distinguish_by: [work_order_ref, issued_date]
    fields:
      agreement_id: The agreement the report belongs to.
      customer_id: The building owner the report is delivered to.
      event_type: The event family of this row.
      work_order_ref: The work order the report covers.
      issued_date: The day the report was delivered.
      service_category: The kind of visit the report covers.
    triggers: []
  - type: maintenance_visit_entitlement_credited
    target: maintenance_events
    account: pm_visit_entitlement
    direction: in
    meaning: The term's included visits are credited to the agreement at activation or renewal.
    grain: One row per term crediting of included visits on one agreement.
    distinguish_by: [billing_period, visit_sequence]
    fields:
      agreement_id: The agreement the visits are credited to.
      customer_id: The building owner the agreement belongs to.
      event_type: The event family of this row.
      billing_period: The agreement term the credit belongs to.
      visit_sequence: The number of visits credited for the term.
    triggers: []
  - type: maintenance_repair_allowance_credited
    target: maintenance_events
    account: repair_coverage_allowance
    direction: in
    meaning: The term's annual repair allowance is credited to the agreement at activation or renewal.
    grain: One row per term crediting of the repair allowance on one agreement.
    distinguish_by: [billing_period, amount_usd]
    fields:
      agreement_id: The agreement the allowance is credited to.
      customer_id: The building owner the agreement belongs to.
      event_type: The event family of this row.
      billing_period: The agreement term the allowance belongs to.
      amount_usd: The allowance credited for the term.
    triggers: []
  - type: maintenance_covered_repair_applied
    target: maintenance_events
    account: repair_coverage_allowance
    direction: out
    meaning: A repair on covered equipment is charged against the agreement's annual repair allowance.
    grain: One row per repair work order applied to the allowance on one agreement.
    distinguish_by: [work_order_ref, equipment_tag, amount_usd]
    fields:
      agreement_id: The agreement the repair is applied to.
      customer_id: The building owner the repair was performed for.
      event_type: The event family of this row.
      work_order_ref: The repair work order applied.
      equipment_tag: The unit repaired.
      equipment_type: The kind of unit repaired.
      amount_usd: The repair value absorbed by the allowance.
      coverage_applied: Whether the repair was absorbed in full, in part, or not at all.
      deductible_usd: The deductible billed to the customer for this repair.
      refrigerant_lbs: Pounds of refrigerant used on the repair.
      completed_date: The day the repair was completed.
    triggers:
      - event: maintenance:maintenance_fee_charged
        when: {coverage_applied: covered_full}
        map: {agreement_id: agreement_id, customer_id: customer_id, charge_type: covered_repair_deductible}
      - event: maintenance:maintenance_fee_charged
        when: {coverage_applied: covered_partial}
        map: {agreement_id: agreement_id, customer_id: customer_id, charge_type: non_covered_repair}
  - type: maintenance_installment_charged
    target: maintenance_events
    account: agreement_balance
    direction: in
    meaning: An installment of the annual agreement price is invoiced to the building owner.
    grain: One row per installment invoice on one agreement.
    distinguish_by: [invoice_ref, billing_period, amount_usd]
    fields:
      agreement_id: The agreement invoiced.
      customer_id: The building owner invoiced.
      event_type: The event family of this row.
      invoice_ref: The invoice this installment was billed on.
      billing_period: The billing period the installment covers.
      amount_usd: The amount invoiced.
      charge_type: The kind of charge, which for this family is the agreement installment.
      due_date: The day the invoice falls due.
    triggers: []
  - type: maintenance_fee_charged
    target: maintenance_events
    account: agreement_balance
    direction: in
    meaning: An ancillary fee under the agreement is invoiced to the building owner.
    grain: One row per ancillary fee invoiced on one agreement.
    distinguish_by: [invoice_ref, charge_type, amount_usd, work_order_ref]
    fields:
      agreement_id: The agreement the fee is charged under.
      customer_id: The building owner charged.
      event_type: The event family of this row.
      invoice_ref: The invoice the fee was billed on.
      charge_type: Which fee this is.
      amount_usd: The amount charged.
      work_order_ref: The work order or schedule change the fee arises from, where there is one.
      billing_period: The billing period the fee falls in.
      due_date: The day the invoice falls due.
    triggers: []
  - type: maintenance_payment_received
    target: maintenance_events
    account: agreement_balance
    direction: out
    meaning: A payment from the building owner is applied to the agreement balance.
    grain: One row per payment applied to one invoice on one agreement.
    distinguish_by: [invoice_ref, received_date, amount_usd, payment_method]
    fields:
      agreement_id: The agreement the payment is applied to.
      customer_id: The building owner who paid.
      event_type: The event family of this row.
      invoice_ref: The invoice the payment is applied to.
      amount_usd: The amount paid.
      payment_method: How the payment was made.
      received_date: The day the payment was received.
    triggers: []
  - type: maintenance_credit_issued
    target: maintenance_events
    account: agreement_balance
    direction: out
    meaning: A credit is issued against the agreement, reducing what the building owner owes.
    grain: One row per credit issued on one agreement.
    distinguish_by: [invoice_ref, credit_reason, amount_usd, work_order_ref]
    fields:
      agreement_id: The agreement credited.
      customer_id: The building owner credited.
      event_type: The event family of this row.
      invoice_ref: The invoice the credit is applied against.
      credit_reason: Why the credit was issued.
      amount_usd: The amount credited.
      work_order_ref: The visit the credit arises from, where it arises from one.
      billing_period: The billing period the credit falls in.
    triggers: []

# ---- derived measures ----------------------------------------------------------
measures:
  - id: maintenance_msr_visits_completed_term
    window: The current agreement term, from term_start_date through term_end_date inclusive.
    measure: Count of maintenance_visit_completed rows on this agreement whose completed_date falls in the window.
  - id: maintenance_msr_covered_repair_spend_term
    window: The current agreement term, from term_start_date through term_end_date inclusive.
    measure: Sum of amount_usd over maintenance_covered_repair_applied rows on this agreement whose completed_date falls in the window.
  - id: maintenance_msr_installments_past_due
    window: All open billing periods of the current term, measured at the handling clock.
    measure: Count of maintenance_installment_charged rows on this agreement whose due_date is before the handling day and whose invoice_ref carries no maintenance_payment_received row of equal or greater amount_usd.

# ---- policies ------------------------------------------------------------------
policies:
  - id: maintenance_agg_multi_holding
    subject: [maintenance_agreement_proposed]
    rule: >-
      A building owner may hold any number of maintenance agreements at once, but never more than one
      agreement in proposed, active, pending_renewal or suspended status for the same site. A proposal for a
      site that already carries an agreement in one of those statuses is not issued as a second agreement; the
      existing agreement is amended instead through a schedule change. Agreements in expired, cancelled,
      declined or withdrawn status do not block a new proposal for the same site, so a building owner whose
      previous agreement lapsed is proposed a fresh one. Each agreement is priced, billed and renewed on its
      own record, and no entitlement, allowance or balance is ever shared between two agreements of the same
      owner.
    eligibility:
      - id: one_live_agreement_per_site
        applies_to: [maintenance_agreement_proposed]
        kind: dedup
        condition: A proposal for a site that already carries an agreement in one of those statuses is not issued as a second agreement; the existing agreement is amended instead through a schedule change.
        evidence_fields: [maintenance_agreements.site_id, maintenance_agreements.status, maintenance_agreements.agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [maintenance_agreements.site_id]
          action_bindings:
            maintenance_agreements.site_id: site_id
        dedup_contract:
          table: maintenance_agreements
          mode: separate_record
          object_bindings: {site_id: site_id}
          duplicate_filters: {status: [proposed, active, pending_renewal, suspended]}
          distinct_fields: [variant_name, proposal_date]
    params:
      max_per_customer: null

  - id: maintenance_agg_multi_site_discount
    subject: [maintenance_agreement_proposed, maintenance_agreement_renewed, maintenance_schedule_updated]
    rule: >-
      Where one building owner carries several agreements, the portfolio is counted before the price of any
      single agreement is settled. The count is the number of that owner's maintenance agreements standing in
      active or pending_renewal status at the moment of pricing, plus the agreement being priced itself;
      agreements in proposed, suspended, expired, cancelled, declined or withdrawn status are not counted. When
      the count reaches the tier's multi-site threshold, the tier's multi-site discount is applied to the
      annual price of the agreement being priced. The discount is applied once to each agreement, never
      compounded across the portfolio, and it is taken before the annual price floor is tested, so the floor
      still governs the final figure. The threshold and the discount are read from the tier of the agreement
      being priced, not from the largest tier in the portfolio.
    eligibility: []
    params:
      per_tier:
        Filter & Belt Service Plan: {discount_pct: "=multi_site_discount_pct", threshold: "=multi_site_discount_threshold"}
        Inspection Agreement: {discount_pct: "=multi_site_discount_pct", threshold: "=multi_site_discount_threshold"}
        Preventive Maintenance Agreement: {discount_pct: "=multi_site_discount_pct", threshold: "=multi_site_discount_threshold"}
        Labor Coverage Agreement: {discount_pct: "=multi_site_discount_pct", threshold: "=multi_site_discount_threshold"}
        Full Coverage Agreement: {discount_pct: "=multi_site_discount_pct", threshold: "=multi_site_discount_threshold"}
        Comprehensive Performance Agreement: {discount_pct: "=multi_site_discount_pct", threshold: "=multi_site_discount_threshold"}

  - id: maintenance_entry_qualification
    subject: [maintenance_agreement_proposed]
    rule: >-
      A tier is proposed only for an equipment schedule that meets its entry gate. The number of units on the
      equipment schedule the caller asks to cover must reach the tier's minimum equipment count, counted as
      the units standing on the site's equipment register at the day of the proposal, whatever their
      condition. No unit on the schedule may be older than the tier's maximum equipment age, counted in whole
      calendar months from the day the unit was installed to the day of the proposal, where a month completes
      on the day of the month matching the install day and, in a month that has no such day, on that month's
      last day; a unit whose age equals the maximum exactly still qualifies. A tier whose pre-agreement
      inspection requirement is set may be proposed only when an inspection work order for the same site is
      recorded as completed in the office records. Where a unit on the schedule exceeds the age limit of the
      requested tier, the schedule is either proposed at the highest tier whose age limit it meets or proposed
      with that unit excluded from coverage; the office never waives an age limit. The pre-agreement
      inspection fee is charged when the inspection is performed and is credited against the first installment
      once the agreement activates.
    eligibility:
      - id: equipment_count_meets_minimum
        applies_to: [maintenance_agreement_proposed]
        kind: caller_fact
        condition: The number of units on the equipment schedule the caller asks to cover must reach the tier's minimum equipment count, counted as the units standing on the site's equipment register at the day of the proposal, whatever their condition.
        evidence_fields: [equipment_units.equipment_tag, equipment_units.site_id, equipment_units.unit_status]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys:
            - [equipment_units.site_id]
          action_bindings:
            equipment_units.site_id: site_id
      - id: unit_age_within_limit
        applies_to: [maintenance_agreement_proposed]
        kind: time
        condition: No unit on the schedule may be older than the tier's maximum equipment age, counted in whole calendar months from the day the unit was installed to the day of the proposal, where a month completes on the day of the month matching the install day and, in a month that has no such day, on that month's last day; a unit whose age equals the maximum exactly still qualifies.
        evidence_fields: [equipment_units.install_date, equipment_units.site_id, equipment_units.equipment_tag]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [equipment_units.equipment_tag]
          action_bindings:
            equipment_units.equipment_tag: equipment_tag
        temporal_basis:
          clock: frozen_time
          anchor_event: the day the unit was installed
          anchor_source: equipment_units.install_date
          relation: not_after
          duration_source: variants.max_equipment_age_months
          unit: calendar_months
          counting_rule: counted in whole calendar months from the day the unit was installed to the day of the proposal, where a month completes on the day of the month matching the install day and, in a month that has no such day, on that month's last day
          boundary: inclusive
      - id: pre_agreement_inspection_on_file
        applies_to: [maintenance_agreement_proposed]
        kind: authorization
        condition: A tier whose pre-agreement inspection requirement is set may be proposed only when an inspection work order for the same site is recorded as completed in the office records.
        evidence_fields: [maintenance_requests.work_order_ref, maintenance_requests.request_type, maintenance_requests.outcome, maintenance_requests.site_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [maintenance_requests.work_order_ref]
          action_bindings:
            maintenance_requests.work_order_ref: work_order_ref
    params:
      per_tier:
        Filter & Belt Service Plan: {min_units: "=min_equipment_count", max_age_months: "=max_equipment_age_months", inspection_required: "=pre_agreement_inspection_required", inspection_fee_usd: "=pre_agreement_inspection_fee_usd"}
        Inspection Agreement: {min_units: "=min_equipment_count", max_age_months: "=max_equipment_age_months", inspection_required: "=pre_agreement_inspection_required", inspection_fee_usd: "=pre_agreement_inspection_fee_usd"}
        Preventive Maintenance Agreement: {min_units: "=min_equipment_count", max_age_months: "=max_equipment_age_months", inspection_required: "=pre_agreement_inspection_required", inspection_fee_usd: "=pre_agreement_inspection_fee_usd"}
        Labor Coverage Agreement: {min_units: "=min_equipment_count", max_age_months: "=max_equipment_age_months", inspection_required: "=pre_agreement_inspection_required", inspection_fee_usd: "=pre_agreement_inspection_fee_usd"}
        Full Coverage Agreement: {min_units: "=min_equipment_count", max_age_months: "=max_equipment_age_months", inspection_required: "=pre_agreement_inspection_required", inspection_fee_usd: "=pre_agreement_inspection_fee_usd"}
        Comprehensive Performance Agreement: {min_units: "=min_equipment_count", max_age_months: "=max_equipment_age_months", inspection_required: "=pre_agreement_inspection_required", inspection_fee_usd: "=pre_agreement_inspection_fee_usd"}

  - id: maintenance_annual_pricing
    subject: [maintenance_agreement_proposed, maintenance_schedule_updated]
    rule: >-
      The annual price of an agreement is built unit by unit. Each unit on the equipment schedule is priced at
      its tier's price for that equipment type, and the unit prices are summed to the schedule total; an
      equipment type priced at zero for a tier cannot be scheduled under that tier and the schedule is
      proposed at a tier that does price it. The multi-site discount is then applied to the schedule total,
      and the building automation bundle credit is subtracted where the site qualifies for it. The resulting
      figure is compared with the tier's annual price floor and the higher of the two is the annual price,
      rounded to the nearest whole dollar. A mid-term schedule change reprices the agreement on the same
      basis and the difference is prorated on the tier's proration basis: on a monthly basis the change is
      charged from the first day of the month following the change, and on a daily basis from the day the
      change takes effect, and the prorated difference for an addition is never billed at less than the
      tier's minimum change charge. Removing a unit mid-term reduces the annual price on the same proration
      basis but never produces a refund below the annual price floor.
    eligibility: []
    params:
      rounding: The annual price is rounded to the nearest whole dollar, halves rounded up.
    formula:
      annual_price_usd: "max(min_annual_price_usd, round(annual_price_by_equipment_type * equipment_count * (1 - multi_site_discount_pct / 100) - bundle_credit_with_controls_usd, 0))"

  - id: maintenance_activation_and_entitlement
    subject: [maintenance_agreement_activated, maintenance_agreement_renewed, maintenance_visit_entitlement_credited, maintenance_repair_allowance_credited]
    rule: >-
      An agreement moves into its term only when a signed acceptance of the proposal is recorded against it.
      The signed acceptance must reach the office no later than the proposal validity period counted forward
      from the day the proposal was issued, counting calendar days with the day of issue excluded and the
      final day included; a proposal whose validity has lapsed is reissued at current prices rather than
      backdated. The term starts on the signature day unless the customer names a later start, and it runs for
      the tier's term length, ending on the day before the matching day of the month in which the term
      completes. At the start of each term the agreement is credited with the tier's included visits — the
      sum of its preventive, inspection and filter change visits — and with the tier's annual repair
      allowance; both credits are recorded against the term they belong to, and neither carries forward into
      a later term. Unused visits and unused allowance are forfeited at term end. The same crediting is
      performed at renewal, at the renewed term's tier, and an agreement reinstated inside its own term
      keeps the credits it already carried rather than receiving a fresh set.
    eligibility:
      - id: signed_acceptance_on_file
        applies_to: [maintenance_agreement_activated]
        kind: authorization
        condition: An agreement moves into its term only when a signed acceptance of the proposal is recorded against it.
        evidence_fields: [maintenance_requests.agreement_id, maintenance_requests.request_type, maintenance_requests.outcome]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [maintenance_requests.agreement_id]
          action_bindings:
            maintenance_requests.agreement_id: agreement_id
      - id: signature_inside_validity
        applies_to: [maintenance_agreement_activated]
        kind: time
        condition: The signed acceptance must reach the office no later than the proposal validity period counted forward from the day the proposal was issued, counting calendar days with the day of issue excluded and the final day included; a proposal whose validity has lapsed is reissued at current prices rather than backdated.
        evidence_fields: [maintenance_agreements.proposal_date, maintenance_agreements.agreement_id, maintenance_agreements.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [maintenance_agreements.agreement_id]
          action_bindings:
            maintenance_agreements.agreement_id: agreement_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the day the proposal was issued
          anchor_source: maintenance_agreements.proposal_date
          relation: not_after
          duration_source: variants.proposal_validity_days
          unit: calendar_days
          counting_rule: counting calendar days with the day of issue excluded and the final day included
          boundary: inclusive
    params:
      per_tier:
        Filter & Belt Service Plan: {visits_credited: 4, allowance_credited_usd: "=annual_repair_allowance_usd"}
        Inspection Agreement: {visits_credited: 2, allowance_credited_usd: "=annual_repair_allowance_usd"}
        Preventive Maintenance Agreement: {visits_credited: 8, allowance_credited_usd: "=annual_repair_allowance_usd"}
        Labor Coverage Agreement: {visits_credited: 8, allowance_credited_usd: "=annual_repair_allowance_usd"}
        Full Coverage Agreement: {visits_credited: 10, allowance_credited_usd: "=annual_repair_allowance_usd"}
        Comprehensive Performance Agreement: {visits_credited: 18, allowance_credited_usd: "=annual_repair_allowance_usd"}

  - id: maintenance_visit_scheduling
    subject: [maintenance_visit_scheduled, maintenance_schedule_updated]
    rule: >-
      Scheduled visits are booked against a live agreement only: a visit is booked only while the agreement
      stands in active or pending_renewal status, and a suspended agreement is scheduled again only after it
      is reinstated. Visits are spread across the term so that the tier's preventive visits fall in the
      seasons they belong to, with the seasonal start-up visit booked before the cooling season and the
      shutdown visit before the heating season where the tier includes them. A customer who moves a booked
      visit inside the tier's reschedule notice period is charged the tier's short notice reschedule fee,
      counted in elapsed hours from the moment of the request to the booked arrival window; a move requested
      earlier than that carries no fee, and the first such move of each term is not charged at any tier. Where
      the technician arrives inside the booked window and cannot reach the equipment, the visit is closed as
      a no-access call, the tier's no-access trip fee is charged and the visit is not consumed from the
      entitlement. A visit the contractor moves is rebooked inside the tier's grace period without charge.
    eligibility:
      - id: live_agreement_for_booking
        applies_to: [maintenance_visit_scheduled]
        kind: state
        condition: a visit is booked only while the agreement stands in active or pending_renewal status, and a suspended agreement is scheduled again only after it is reinstated
        evidence_fields: [maintenance_agreements.status, maintenance_agreements.agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [maintenance_agreements.agreement_id]
          action_bindings:
            maintenance_agreements.agreement_id: agreement_id
        state_contract:
          field: maintenance_agreements.status
          allowed: [active, pending_renewal]
    params:
      per_tier:
        Filter & Belt Service Plan: {reschedule_notice_hours: "=reschedule_notice_hours", reschedule_fee_usd: "=short_notice_reschedule_fee_usd", no_access_fee_usd: "=no_access_trip_fee_usd"}
        Inspection Agreement: {reschedule_notice_hours: "=reschedule_notice_hours", reschedule_fee_usd: "=short_notice_reschedule_fee_usd", no_access_fee_usd: "=no_access_trip_fee_usd"}
        Preventive Maintenance Agreement: {reschedule_notice_hours: "=reschedule_notice_hours", reschedule_fee_usd: "=short_notice_reschedule_fee_usd", no_access_fee_usd: "=no_access_trip_fee_usd"}
        Labor Coverage Agreement: {reschedule_notice_hours: "=reschedule_notice_hours", reschedule_fee_usd: "=short_notice_reschedule_fee_usd", no_access_fee_usd: "=no_access_trip_fee_usd"}
        Full Coverage Agreement: {reschedule_notice_hours: "=reschedule_notice_hours", reschedule_fee_usd: "=short_notice_reschedule_fee_usd", no_access_fee_usd: "=no_access_trip_fee_usd"}
        Comprehensive Performance Agreement: {reschedule_notice_hours: "=reschedule_notice_hours", reschedule_fee_usd: "=short_notice_reschedule_fee_usd", no_access_fee_usd: "=no_access_trip_fee_usd"}

  - id: maintenance_visit_completion_and_report
    subject: [maintenance_visit_completed, maintenance_report_issued]
    rule: >-
      A completed visit consumes one visit from the term entitlement, whatever its length, and a visit closed
      as no-access consumes none. Once the term's credited visits are used up, a further visit the customer
      asks for is booked as an extra visit and charged at the tier's extra visit price, regardless of how much
      of the term is left; the count of visits used is taken over the current term only. Where the tier
      includes a written condition report, the report is delivered within the tier's report delivery period,
      counted in business days after the day the visit was completed on the office calendar, which excludes
      Saturdays, Sundays and the office holidays published for the year. A report delivered later than that
      period does not change what the visit cost, but the customer may ask for the report to be expedited at
      no charge. Where the tier includes no written report, the technician's field ticket is the record of the
      visit and no report is issued.
    eligibility: []
    measures: [maintenance_msr_visits_completed_term]
    params:
      per_tier:
        Filter & Belt Service Plan: {extra_visit_price_usd: "=extra_visit_price_usd", report_business_days: "=report_delivery_business_days"}
        Inspection Agreement: {extra_visit_price_usd: "=extra_visit_price_usd", report_business_days: "=report_delivery_business_days"}
        Preventive Maintenance Agreement: {extra_visit_price_usd: "=extra_visit_price_usd", report_business_days: "=report_delivery_business_days"}
        Labor Coverage Agreement: {extra_visit_price_usd: "=extra_visit_price_usd", report_business_days: "=report_delivery_business_days"}
        Full Coverage Agreement: {extra_visit_price_usd: "=extra_visit_price_usd", report_business_days: "=report_delivery_business_days"}
        Comprehensive Performance Agreement: {extra_visit_price_usd: "=extra_visit_price_usd", report_business_days: "=report_delivery_business_days"}

  - id: maintenance_missed_visit_credit
    subject: [maintenance_credit_issued]
    rule: >-
      Where the contractor fails to perform a booked visit and does not rebook it inside the tier's grace
      period, the customer is credited for the missed visit. The grace period is counted in business days from
      the day the visit was booked for, excluding Saturdays, Sundays and the office holidays published for the
      year, and a visit rebooked on the final grace day is still timely. A credit is issued only when the
      booked visit was not performed inside the tier's grace period counted from the day the visit was booked
      for. The credit is the per-visit value of the agreement — the annual price divided by the tier's
      credited visits for the term — multiplied by the tier's missed visit credit rate, and at the top tier
      that rate exceeds the per-visit value because the agreement carries a performance guarantee. The credit
      is applied to the next installment invoice rather than refunded, and a visit the customer moved or a
      visit closed as no-access never produces a credit.
    eligibility:
      - id: visit_missed_beyond_grace
        applies_to: [maintenance_credit_issued]
        kind: time
        condition: A credit is issued only when the booked visit was not performed inside the tier's grace period counted from the day the visit was booked for.
        evidence_fields: [maintenance_events.scheduled_date, maintenance_events.work_order_ref, maintenance_events.completed_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [maintenance_events.work_order_ref]
          action_bindings:
            maintenance_events.work_order_ref: work_order_ref
        temporal_basis:
          clock: frozen_time
          anchor_event: the day the visit was booked for
          anchor_source: maintenance_events.scheduled_date
          relation: not_before
          duration_source: variants.visit_window_grace_business_days
          unit: business_days
          counting_rule: counted in business days from the day the visit was booked for, excluding Saturdays, Sundays and the office holidays published for the year, and a visit rebooked on the final grace day is still timely
          boundary: exclusive
    params:
      per_tier:
        Filter & Belt Service Plan: {credit_pct: "=missed_visit_credit_pct", grace_business_days: "=visit_window_grace_business_days", visits_for_divisor: 4}
        Inspection Agreement: {credit_pct: "=missed_visit_credit_pct", grace_business_days: "=visit_window_grace_business_days", visits_for_divisor: 2}
        Preventive Maintenance Agreement: {credit_pct: "=missed_visit_credit_pct", grace_business_days: "=visit_window_grace_business_days", visits_for_divisor: 8}
        Labor Coverage Agreement: {credit_pct: "=missed_visit_credit_pct", grace_business_days: "=visit_window_grace_business_days", visits_for_divisor: 8}
        Full Coverage Agreement: {credit_pct: "=missed_visit_credit_pct", grace_business_days: "=visit_window_grace_business_days", visits_for_divisor: 10}
        Comprehensive Performance Agreement: {credit_pct: "=missed_visit_credit_pct", grace_business_days: "=visit_window_grace_business_days", visits_for_divisor: 18}
    formula:
      amount_usd: "round(annual_price_usd / visits_for_divisor * missed_visit_credit_pct / 100, 2)"

  - id: maintenance_repair_coverage
    subject: [maintenance_covered_repair_applied, maintenance_fee_charged]
    rule: >-
      What a repair costs the building owner depends on the tier's coverage switches. Where the tier covers
      repair labor, the labor on a covered unit is absorbed by the agreement; where it also covers parts, the
      parts are absorbed too; where the tier covers neither, the repair is billed in full at the tier's labor
      rate and list parts less the tier's repair labor and parts discounts. Compressor and heat exchanger
      replacement are absorbed only at a tier whose compressor and heat exchanger coverage switches are set,
      and at every other tier they are billed as non-covered work however well the rest of the unit is
      covered. A repair is applied against the annual repair allowance only while the agreement stands in
      active status. A repair work order that already carries a coverage decision is not applied a second
      time. Refrigerant is absorbed up to the tier's included pounds per term and billed at the published
      rate beyond that. Where the absorbed value would carry the term past the tier's annual repair allowance,
      the allowance is exhausted first and the remainder is billed as non-covered work at the tier's
      discounted rates. Where the tier carries a deductible, that deductible is charged once per covered
      repair work order, whether or not the allowance absorbs the whole repair.
    eligibility:
      - id: coverage_only_while_active
        applies_to: [maintenance_covered_repair_applied]
        kind: state
        condition: A repair is applied against the annual repair allowance only while the agreement stands in active status.
        evidence_fields: [maintenance_agreements.status, maintenance_agreements.agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [maintenance_agreements.agreement_id]
          action_bindings:
            maintenance_agreements.agreement_id: agreement_id
        state_contract:
          field: maintenance_agreements.status
          allowed: [active]
      - id: repair_not_applied_twice
        applies_to: [maintenance_covered_repair_applied]
        kind: dedup
        condition: A repair work order that already carries a coverage decision is not applied a second time.
        evidence_fields: [maintenance_events.work_order_ref, maintenance_events.coverage_applied, maintenance_events.agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [maintenance_events.work_order_ref]
          action_bindings:
            maintenance_events.work_order_ref: work_order_ref
        dedup_contract:
          table: maintenance_events
          mode: separate_record
          object_bindings: {work_order_ref: work_order_ref}
          duplicate_filters: {coverage_applied: [covered_full, covered_partial]}
          distinct_fields: [equipment_tag, completed_date]
    measures: [maintenance_msr_covered_repair_spend_term]
    params:
      refrigerant_rate_usd_per_lb: 92
      per_tier:
        Filter & Belt Service Plan: {labor_covered: "=repair_labor_covered", parts_covered: "=repair_parts_covered", allowance_usd: "=annual_repair_allowance_usd", deductible_usd: "=covered_repair_deductible_usd", refrigerant_lbs: "=refrigerant_included_lbs_per_year"}
        Inspection Agreement: {labor_covered: "=repair_labor_covered", parts_covered: "=repair_parts_covered", allowance_usd: "=annual_repair_allowance_usd", deductible_usd: "=covered_repair_deductible_usd", refrigerant_lbs: "=refrigerant_included_lbs_per_year"}
        Preventive Maintenance Agreement: {labor_covered: "=repair_labor_covered", parts_covered: "=repair_parts_covered", allowance_usd: "=annual_repair_allowance_usd", deductible_usd: "=covered_repair_deductible_usd", refrigerant_lbs: "=refrigerant_included_lbs_per_year"}
        Labor Coverage Agreement: {labor_covered: "=repair_labor_covered", parts_covered: "=repair_parts_covered", allowance_usd: "=annual_repair_allowance_usd", deductible_usd: "=covered_repair_deductible_usd", refrigerant_lbs: "=refrigerant_included_lbs_per_year"}
        Full Coverage Agreement: {labor_covered: "=repair_labor_covered", parts_covered: "=repair_parts_covered", allowance_usd: "=annual_repair_allowance_usd", deductible_usd: "=covered_repair_deductible_usd", refrigerant_lbs: "=refrigerant_included_lbs_per_year"}
        Comprehensive Performance Agreement: {labor_covered: "=repair_labor_covered", parts_covered: "=repair_parts_covered", allowance_usd: "=annual_repair_allowance_usd", deductible_usd: "=covered_repair_deductible_usd", refrigerant_lbs: "=refrigerant_included_lbs_per_year"}
    formula:
      when_not: "coverage_applied == 'not_covered'"
      customer_charge_usd: "covered_repair_deductible_usd + max(0, amount_usd - repair_coverage_allowance) + max(0, refrigerant_lbs - refrigerant_included_lbs_per_year) * refrigerant_rate_usd_per_lb"

  - id: maintenance_billing_and_late_fee
    subject: [maintenance_installment_charged, maintenance_payment_received, maintenance_fee_charged]
    rule: >-
      The annual price is invoiced on the tier's billing frequency, in equal installments over the agreement
      year, with any remainder cent carried onto the first installment. Each invoice falls due the tier's
      payment term after the invoice date, counted in calendar days with the invoice day excluded and the due
      day included. An installment still unpaid after its due day carries the tier's late fee on the unpaid
      amount for each month or part month it stays unpaid, applied on the same day of each following month.
      Payments are applied to the oldest unpaid invoice first, then to ancillary fees in the order they were
      charged; a customer may direct a payment to a named invoice instead, and where they do, that direction
      governs. Credits are applied to the next installment invoice and never paid out in cash. Where a
      customer disputes an invoice in writing, the late fee on the disputed amount stops accruing from the day
      the dispute is recorded and resumes from the day it is resolved against them.
    eligibility: []
    measures: [maintenance_msr_installments_past_due]
    params:
      per_tier:
        Filter & Belt Service Plan: {frequency: "=billing_frequency", installments: "=installment_count", terms_days: "=payment_terms_days", late_fee_pct: "=late_fee_pct_per_month"}
        Inspection Agreement: {frequency: "=billing_frequency", installments: "=installment_count", terms_days: "=payment_terms_days", late_fee_pct: "=late_fee_pct_per_month"}
        Preventive Maintenance Agreement: {frequency: "=billing_frequency", installments: "=installment_count", terms_days: "=payment_terms_days", late_fee_pct: "=late_fee_pct_per_month"}
        Labor Coverage Agreement: {frequency: "=billing_frequency", installments: "=installment_count", terms_days: "=payment_terms_days", late_fee_pct: "=late_fee_pct_per_month"}
        Full Coverage Agreement: {frequency: "=billing_frequency", installments: "=installment_count", terms_days: "=payment_terms_days", late_fee_pct: "=late_fee_pct_per_month"}
        Comprehensive Performance Agreement: {frequency: "=billing_frequency", installments: "=installment_count", terms_days: "=payment_terms_days", late_fee_pct: "=late_fee_pct_per_month"}
    formula:
      installment_usd: "round(annual_price_usd / installment_count, 2)"
      late_fee_usd: "round(amount_usd * late_fee_pct_per_month / 100, 2)"

  - id: maintenance_suspension_and_reinstatement
    subject: [maintenance_agreement_suspended, maintenance_agreement_reinstated, maintenance_agreement_cancelled]
    rule: >-
      Coverage is suspended once an installment stays unpaid beyond the tier's suspension period counted from
      the day the installment invoice fell due, counting calendar days with the due day excluded and the final
      day included. While an agreement is suspended no visit is performed and no repair is absorbed, and work
      the owner asks for meanwhile is quoted as demand service at the published rates. Coverage is put back in
      force when the arrears are settled in full and the tier's reinstatement fee is charged; the suspended
      term is not extended, so the visits lost while suspended are not credited back. An agreement whose term
      has already ended may be put back in force only inside the tier's reinstatement window counted forward
      from the term end date, counting calendar days with the end day excluded and the final day included;
      after that window a new proposal and, where the tier requires one, a fresh pre-agreement inspection are
      needed. An agreement left suspended beyond the tier's for-cause period is cancelled for cause, the
      unbilled remainder of the term falls due at once and the early termination fee is not charged on top.
    eligibility:
      - id: arrears_beyond_suspension_period
        applies_to: [maintenance_agreement_suspended]
        kind: time
        condition: Coverage is suspended once an installment stays unpaid beyond the tier's suspension period counted from the day the installment invoice fell due, counting calendar days with the due day excluded and the final day included.
        evidence_fields: [maintenance_events.due_date, maintenance_events.invoice_ref, maintenance_events.amount_usd]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [maintenance_events.invoice_ref]
          action_bindings:
            maintenance_events.invoice_ref: invoice_ref
        temporal_basis:
          clock: frozen_time
          anchor_event: the day the installment invoice fell due
          anchor_source: maintenance_events.due_date
          relation: not_before
          duration_source: variants.suspension_after_days_past_due
          unit: calendar_days
          counting_rule: counting calendar days with the due day excluded and the final day included
          boundary: inclusive
      - id: reinstatement_inside_window
        applies_to: [maintenance_agreement_reinstated]
        kind: time
        condition: An agreement whose term has already ended may be put back in force only inside the tier's reinstatement window counted forward from the term end date, counting calendar days with the end day excluded and the final day included; after that window a new proposal and, where the tier requires one, a fresh pre-agreement inspection are needed.
        evidence_fields: [maintenance_agreements.term_end_date, maintenance_agreements.agreement_id, maintenance_agreements.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [maintenance_agreements.agreement_id]
          action_bindings:
            maintenance_agreements.agreement_id: agreement_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the term end date
          anchor_source: maintenance_agreements.term_end_date
          relation: not_after
          duration_source: variants.expired_reinstatement_window_days
          unit: calendar_days
          counting_rule: counting calendar days with the end day excluded and the final day included
          boundary: inclusive
    params:
      per_tier:
        Filter & Belt Service Plan: {suspension_days: "=suspension_after_days_past_due", reinstatement_fee_usd: "=reinstatement_fee_usd", reinstatement_window_days: "=expired_reinstatement_window_days", for_cause_days: "=for_cause_cancellation_days"}
        Inspection Agreement: {suspension_days: "=suspension_after_days_past_due", reinstatement_fee_usd: "=reinstatement_fee_usd", reinstatement_window_days: "=expired_reinstatement_window_days", for_cause_days: "=for_cause_cancellation_days"}
        Preventive Maintenance Agreement: {suspension_days: "=suspension_after_days_past_due", reinstatement_fee_usd: "=reinstatement_fee_usd", reinstatement_window_days: "=expired_reinstatement_window_days", for_cause_days: "=for_cause_cancellation_days"}
        Labor Coverage Agreement: {suspension_days: "=suspension_after_days_past_due", reinstatement_fee_usd: "=reinstatement_fee_usd", reinstatement_window_days: "=expired_reinstatement_window_days", for_cause_days: "=for_cause_cancellation_days"}
        Full Coverage Agreement: {suspension_days: "=suspension_after_days_past_due", reinstatement_fee_usd: "=reinstatement_fee_usd", reinstatement_window_days: "=expired_reinstatement_window_days", for_cause_days: "=for_cause_cancellation_days"}
        Comprehensive Performance Agreement: {suspension_days: "=suspension_after_days_past_due", reinstatement_fee_usd: "=reinstatement_fee_usd", reinstatement_window_days: "=expired_reinstatement_window_days", for_cause_days: "=for_cause_cancellation_days"}

  - id: maintenance_renewal
    subject: [maintenance_renewal_window_opened, maintenance_agreement_renewed, maintenance_agreement_expired]
    rule: >-
      The renewal window opens the tier's renewal period before the term end date and the agreement moves into
      pending_renewal status, at which point the renewal notice carrying next term's price is sent. Where the
      tier renews automatically, the term renews on the day after the term end date at the current price
      raised by the tier's escalation, unless a non-renewal notice is on file. An automatic renewal is not
      raised when a non-renewal notice recorded against this agreement was received on or before the
      non-renewal notice deadline, which is the tier's notice period counted back in calendar days from the
      term end date, the deadline day itself counting as timely. A renewal for a further term is recorded only
      when a renewal acceptance from the customer is on file for this agreement, at the tier that renewal
      names; at the top tier, which does not renew automatically, that acceptance is the only way the term
      continues. A term that reaches its end date with no renewal acceptance and no automatic renewal expires,
      and coverage stops on the term end date. Escalation is applied to the current annual price before any
      discount or bundle credit is recomputed, and a renewal at a different tier is priced from that tier's
      schedule instead of escalated.
    eligibility:
      - id: renewal_acceptance_on_file
        applies_to: [maintenance_agreement_renewed]
        kind: authorization
        condition: A renewal for a further term is recorded only when a renewal acceptance from the customer is on file for this agreement, at the tier that renewal names; at the top tier, which does not renew automatically, that acceptance is the only way the term continues.
        evidence_fields: [maintenance_requests.agreement_id, maintenance_requests.request_type, maintenance_requests.outcome]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [maintenance_requests.agreement_id]
          action_bindings:
            maintenance_requests.agreement_id: agreement_id
      - id: no_timely_non_renewal_notice
        applies_to: [maintenance_agreement_renewed]
        kind: authorization
        condition: An automatic renewal is not raised when a non-renewal notice recorded against this agreement was received on or before the non-renewal notice deadline, which is the tier's notice period counted back in calendar days from the term end date, the deadline day itself counting as timely.
        evidence_fields: [maintenance_requests.notice_date, maintenance_requests.request_type, maintenance_requests.agreement_id, maintenance_agreements.term_end_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [maintenance_requests.agreement_id]
          action_bindings:
            maintenance_requests.agreement_id: agreement_id
    params:
      per_tier:
        Filter & Belt Service Plan: {window_days: "=renewal_window_days", notice_days: "=non_renewal_notice_days", escalation_pct: "=annual_escalation_pct", auto_renew: "=auto_renew"}
        Inspection Agreement: {window_days: "=renewal_window_days", notice_days: "=non_renewal_notice_days", escalation_pct: "=annual_escalation_pct", auto_renew: "=auto_renew"}
        Preventive Maintenance Agreement: {window_days: "=renewal_window_days", notice_days: "=non_renewal_notice_days", escalation_pct: "=annual_escalation_pct", auto_renew: "=auto_renew"}
        Labor Coverage Agreement: {window_days: "=renewal_window_days", notice_days: "=non_renewal_notice_days", escalation_pct: "=annual_escalation_pct", auto_renew: "=auto_renew"}
        Full Coverage Agreement: {window_days: "=renewal_window_days", notice_days: "=non_renewal_notice_days", escalation_pct: "=annual_escalation_pct", auto_renew: "=auto_renew"}
        Comprehensive Performance Agreement: {window_days: "=renewal_window_days", notice_days: "=non_renewal_notice_days", escalation_pct: "=annual_escalation_pct", auto_renew: "=auto_renew"}
    formula:
      renewed_annual_price_usd: "round(annual_price_usd * (1 + annual_escalation_pct / 100), 0)"

  - id: maintenance_termination_for_convenience
    subject: [maintenance_agreement_cancelled, maintenance_proposal_closed]
    rule: >-
      A building owner may end an agreement before its term for convenience on written notice. The termination
      takes effect no earlier than the tier's notice period counted forward from the day the customer gives
      written notice of termination, counting calendar days with the notice day excluded and the final day
      included, and coverage continues until that effective day. The early termination fee is the tier's rate
      applied to the unbilled remainder of the term — the installments of the current term not yet invoiced at
      the effective day — and it is invoiced with the final installment; installments already invoiced stay
      due in full and visits already performed are never rebated. An agreement cancelled because the building
      is sold or closed carries the notice period but no early termination fee, on proof of the sale or
      closure. A proposal that is declined or left unsigned past its validity carries no fee at all, and the
      pre-agreement inspection fee already charged stays charged because the inspection was performed.
    eligibility:
      - id: notice_period_elapsed
        applies_to: [maintenance_agreement_cancelled]
        kind: time
        condition: The termination takes effect no earlier than the tier's notice period counted forward from the day the customer gives written notice of termination, counting calendar days with the notice day excluded and the final day included, and coverage continues until that effective day.
        evidence_fields: [maintenance_requests.notice_date, maintenance_requests.agreement_id, maintenance_requests.request_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [maintenance_requests.agreement_id]
          action_bindings:
            maintenance_requests.agreement_id: agreement_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the day the customer gives written notice of termination
          anchor_source: maintenance_requests.notice_date
          relation: not_before
          duration_source: variants.termination_notice_days
          unit: calendar_days
          counting_rule: counting calendar days with the notice day excluded and the final day included
          boundary: inclusive
    params:
      per_tier:
        Filter & Belt Service Plan: {notice_days: "=termination_notice_days", fee_pct: "=early_termination_fee_pct"}
        Inspection Agreement: {notice_days: "=termination_notice_days", fee_pct: "=early_termination_fee_pct"}
        Preventive Maintenance Agreement: {notice_days: "=termination_notice_days", fee_pct: "=early_termination_fee_pct"}
        Labor Coverage Agreement: {notice_days: "=termination_notice_days", fee_pct: "=early_termination_fee_pct"}
        Full Coverage Agreement: {notice_days: "=termination_notice_days", fee_pct: "=early_termination_fee_pct"}
        Comprehensive Performance Agreement: {notice_days: "=termination_notice_days", fee_pct: "=early_termination_fee_pct"}

  - id: maintenance_portfolio_interaction
    subject: [maintenance_agreement_proposed, maintenance_schedule_updated, maintenance_fee_charged]
    rule: >-
      Maintenance does not price in isolation from the rest of the customer's portfolio. Where the same site
      carries a building automation service plan in active status that provides alarm monitoring, the tier's
      bundle credit is applied once per agreement year against the maintenance price, and the maintenance
      remote monitoring entitlement is not charged twice; where the site carries no such plan, the credit is
      not applied even if the customer holds a plan at another site. Where the customer holds a service rate
      program in active status and the tier allows rate substitution, the program's block labor rate replaces
      the tier's labor rate on non-covered repair labor, whichever of the two is lower; where the tier does
      not allow substitution its own rate governs, because that rate is already the lowest the company
      publishes. The bundle credit and the multi-site discount both apply where both are earned, the discount
      first and the credit afterwards. A site whose filtration is supplied under an active indoor air quality
      program may not also hold the entry tier, whose whole content is filter and belt service, and such a
      site is proposed a tier that adds mechanical service instead.
    eligibility:
      - id: bundle_credit_needs_active_controls_plan
        applies_to: [maintenance_agreement_proposed]
        kind: authorization
        condition: Where the same site carries a building automation service plan in active status that provides alarm monitoring, the tier's bundle credit is applied once per agreement year against the maintenance price, and the maintenance remote monitoring entitlement is not charged twice; where the site carries no such plan, the credit is not applied even if the customer holds a plan at another site.
        evidence_fields: [controls_plans.site_id, controls_plans.status, controls_plans.variant_name]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [controls_plans.site_id]
          action_bindings:
            controls_plans.site_id: site_id
    params:
      per_tier:
        Filter & Belt Service Plan: {bundle_credit_usd: "=bundle_credit_with_controls_usd", rate_substitution: "=block_rate_substitution_allowed"}
        Inspection Agreement: {bundle_credit_usd: "=bundle_credit_with_controls_usd", rate_substitution: "=block_rate_substitution_allowed"}
        Preventive Maintenance Agreement: {bundle_credit_usd: "=bundle_credit_with_controls_usd", rate_substitution: "=block_rate_substitution_allowed"}
        Labor Coverage Agreement: {bundle_credit_usd: "=bundle_credit_with_controls_usd", rate_substitution: "=block_rate_substitution_allowed"}
        Full Coverage Agreement: {bundle_credit_usd: "=bundle_credit_with_controls_usd", rate_substitution: "=block_rate_substitution_allowed"}
        Comprehensive Performance Agreement: {bundle_credit_usd: "=bundle_credit_with_controls_usd", rate_substitution: "=block_rate_substitution_allowed"}
