# Product charter: Preventive Maintenance Agreements (category key: maintenance)
# Halvorsen Mechanical & Controls, Inc. — the single registry of every quantified maintenance policy.
category: maintenance
display_name: Preventive Maintenance Agreements

binding:
  holding_table: maintenance_agreements
  event_tables: [maintenance_events]
  intake_tables: [maintenance_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields:
    visits_remaining: pm_visit_entitlement
    repair_allowance_remaining: repair_coverage_allowance
    balance_due: agreement_balance

lifecycle:
  states: [proposed, active, suspended, pending_renewal, expired, cancelled, declined, withdrawn]
  transitions:
    - {from: proposed, to: active, by: user, means: The customer signs the proposal and the agreement term begins.}
    - {from: proposed, to: declined, by: user, means: The customer declines the proposal.}
    - {from: proposed, to: withdrawn, by: system, means: The proposal validity period lapses without a signature and the proposal is withdrawn.}
    - {from: active, to: pending_renewal, by: system, means: The renewal window opens ahead of the term end.}
    - {from: active, to: suspended, by: agent, means: Coverage is suspended for non-payment.}
    - {from: pending_renewal, to: suspended, by: agent, means: Coverage is suspended for non-payment during the renewal window.}
    - {from: suspended, to: active, by: agent, means: Coverage is reinstated after the arrears and the reinstatement fee are settled.}
    - {from: pending_renewal, to: active, by: agent, means: The agreement is renewed for a further term.}
    - {from: pending_renewal, to: expired, by: system, means: The term ends without renewal.}
    - {from: expired, to: active, by: agent, means: An expired agreement is reinstated inside the reinstatement window.}
    - {from: active, to: cancelled, by: system, means: A confirmed termination notice reaches its effective date and the agreement is cancelled.}
    - {from: pending_renewal, to: cancelled, by: system, means: A confirmed termination notice reaches its effective date during the renewal window.}
    - {from: suspended, to: cancelled, by: agent, means: A suspended agreement is cancelled for cause after the for-cause period.}

accounts:
  - key: pm_visit_entitlement
    unit: visits
    meaning: The number of scheduled maintenance visits the agreement still entitles the site to in the current term; credited at activation and renewal, consumed one per completed visit.
  - key: repair_coverage_allowance
    unit: USD
    meaning: The remaining annual repair allowance the agreement can absorb for covered repairs in the current term; credited at activation and renewal, consumed by each covered repair applied.
  - key: agreement_balance
    unit: USD
    meaning: The amount the customer currently owes under this agreement; charges increase it, payments and credits reduce it.

parameter_schema:
  pm_visits_per_year: Number of full preventive maintenance visits included per agreement year (integer, visits).
  inspection_visits_per_year: Number of inspection-only visits included per agreement year (integer, visits).
  filter_change_visits_per_year: Number of filter and belt change visits included per agreement year (integer, visits).
  belt_replacement_included: Whether drive belts replaced during a visit are included in the price (boolean).
  coil_cleaning_visits_per_year: Number of condenser and evaporator coil cleanings included per year (integer, visits).
  seasonal_startup_shutdown_included: Whether spring start-up and fall shutdown visits are included (boolean).
  written_report_included: Whether a written condition report is delivered after each visit (boolean).
  report_delivery_business_days: Business days after a completed visit by which the written report is delivered (integer, business days).
  repair_labor_covered: Whether repair labor on covered equipment is included in the agreement price (boolean).
  repair_parts_covered: Whether repair parts on covered equipment are included in the agreement price (boolean).
  compressor_coverage_included: Whether compressor replacement is a covered repair (boolean).
  heat_exchanger_coverage_included: Whether heat exchanger replacement is a covered repair (boolean).
  refrigerant_included_lbs_per_year: Pounds of refrigerant per year included for covered repairs before refrigerant is billed (integer, lbs).
  annual_repair_allowance_usd: Annual cap on covered repair value the agreement absorbs per term (USD; 0 means no repair coverage).
  covered_repair_deductible_usd: Amount billed to the customer per covered repair applied (USD).
  repair_labor_discount_pct: Discount on the agreement labor rate for repairs that are not covered (percent).
  parts_discount_pct: Discount from list price on parts that are not covered (percent).
  agreement_labor_rate_usd: Regular-hours labor rate billed to this tier for non-covered work (USD per hour).
  overtime_rate_multiplier: Multiplier applied to the labor rate outside regular hours (decimal).
  trip_charge_usd: Trip charge per demand service call under this tier (USD).
  trip_charge_waived: Whether the trip charge is waived on demand service calls for this tier (boolean).
  priority_response_hours: Guaranteed on-site response for emergency calls at a covered site (integer, elapsed hours).
  after_hours_coverage_included: Whether after-hours emergency labor is included without the overtime multiplier (boolean).
  emergency_calls_included_per_year: Number of emergency demand calls per year whose trip and labor are absorbed by the agreement (integer).
  remote_monitoring_included: Whether remote alarm monitoring of covered equipment is included (boolean).
  capital_planning_report_included: Whether an annual capital planning report is delivered (boolean).
  filter_grade_included: Filter efficiency grade supplied on filter change visits (MERV rating, integer).
  min_equipment_count: Minimum number of covered units on the schedule for this tier (integer).
  max_equipment_age_months: Maximum age of any covered unit at proposal, from install date (integer, calendar months; 1200 means no age limit).
  pre_agreement_inspection_required: Whether a completed pre-agreement inspection work order is required before proposal (boolean).
  pre_agreement_inspection_fee_usd: Fee for the pre-agreement inspection, credited against the first installment if the agreement activates (USD).
  min_annual_price_usd: Floor on the annual agreement price after all discounts (USD).
  annual_price_by_equipment_type: Annual price per covered unit by equipment type, a mapping equipment_type -> USD; a value of 0 means that type cannot be scheduled under this tier.
  extra_visit_price_usd: Price of one additional visit beyond the entitlement (USD).
  term_months: Length of one agreement term (integer, calendar months).
  billing_frequency: How the annual price is invoiced (enum annual, semiannual, quarterly, monthly).
  installment_count: Number of installments per agreement year (integer).
  payment_terms_days: Days from invoice date to due date (integer, calendar days).
  late_fee_pct_per_month: Late fee applied to an installment past due, per month (percent per month).
  auto_renew: Whether the agreement renews automatically at the end of the term (boolean).
  renewal_window_days: Calendar days before term end at which the renewal window opens (integer).
  non_renewal_notice_days: Calendar days before term end by which a non-renewal notice must be received to stop an automatic renewal (integer).
  annual_escalation_pct: Price escalation applied to the annual price at each renewal (percent).
  early_termination_fee_pct: Fee on the unbilled remainder of the term when the customer terminates for convenience (percent).
  termination_notice_days: Calendar days of written notice before a termination for convenience takes effect (integer).
  for_cause_cancellation_days: Calendar days after suspension after which a still-unpaid agreement is cancelled for cause (integer).
  reschedule_notice_hours: Elapsed hours before the scheduled visit start within which a customer reschedule counts as short notice (integer).
  short_notice_reschedule_fee_usd: Fee for a customer-requested reschedule inside the notice period (USD).
  no_access_trip_fee_usd: Fee when a technician arrives for a scheduled visit and cannot access the equipment (USD).
  missed_visit_credit_pct: Credit of the per-visit value when the contractor misses the visit window (percent).
  visit_window_grace_business_days: Business days after the scheduled start within which a contractor-moved visit is not a missed visit (integer).
  suspension_after_days_past_due: Calendar days past due after which coverage is suspended (integer).
  reinstatement_fee_usd: Fee billed on reinstatement of a suspended or expired agreement (USD).
  expired_reinstatement_window_days: Calendar days after term end within which an expired agreement can be reinstated without a new pre-agreement inspection (integer).
  equipment_change_proration_basis: Basis on which a mid-term equipment addition or removal is prorated (enum daily, monthly).
  equipment_change_min_charge_usd: Minimum charge for a mid-term equipment addition (USD).
  multi_site_discount_pct: Discount on the annual price when the customer holds at least the threshold number of counted agreements (percent).
  multi_site_discount_threshold: Number of the customer's agreements in active or pending_renewal status, this one included, needed for the multi-site discount (integer).
  proposal_validity_days: Calendar days a proposal remains open for signature (integer).
  bundle_credit_with_controls_usd: Annual credit applied when the site holds an active Building Automation Service Plan that provides alarm monitoring (USD).
  block_rate_substitution_allowed: Whether a lower labor rate from an active Service Rate Program of the customer replaces the agreement labor rate on non-covered repair labor (boolean).

