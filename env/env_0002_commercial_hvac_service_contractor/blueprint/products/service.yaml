events:
  - type: service_program_requested
    target: service_programs
    mutation: create
    meaning: A building owner asks to be set up on a demand service rate program and the enrollment record is opened.
    grain: One row per enrollment request on one account.
    fields:
      program_id: The reference number of this rate program record.
      customer_id: The building owner requesting the program.
      variant_name: The program requested, written as its official full name.
      status: The lifecycle status, pinned to requested when the enrollment is opened.
      enrollment_date: The day the enrollment offer was issued.
      primary_site_id: The building named as the program's primary service address.
      annual_program_fee_usd: The annual program fee quoted on the enrollment.
      credit_limit_usd: The open balance ceiling set for the account under this program.
      po_required: Whether the owner requires a purchase order number on every invoice.
    triggers: []
  - type: service_program_activated
    target: service_programs
    mutation: {transition: {from: requested, to: active}}
    meaning: The signed enrollment is received and the program rates take effect.
    grain: One row per program, changed once when the program starts.
    fields:
      status: The lifecycle status, moved to active.
      activation_date: The day the program took effect.
      term_start_date: The first day of the program term.
      term_end_date: The last day of the program term.
    triggers:
      - event: service:service_emergency_allowance_credited
        map: {program_id: program_id, customer_id: customer_id}
      - event: service:service_invoice_charged
        map: {program_id: program_id, customer_id: customer_id, charge_type: annual_program_fee}
  - type: service_enrollment_declined
    target: service_programs
    mutation: {transition: {from: requested, to: declined}}
    meaning: The enrollment is declined because the account does not meet the program's entry gate.
    grain: One row per enrollment, changed once when it is declined.
    fields:
      status: The lifecycle status, moved to declined.
      cancellation_date: The day the enrollment was declined.
      cancellation_reason: Why the enrollment was declined.
    triggers: []
  - type: service_renewal_window_opened
    target: service_programs
    mutation: {transition: {from: active, to: pending_renewal}}
    meaning: The program enters its renewal window and the renewal rates are sent out.
    grain: One row per program, changed once per term when the renewal window opens.
    fields:
      status: The lifecycle status, moved to pending_renewal.
      renewal_notice_date: The day the renewal window opened.
    triggers: []
  - type: service_program_renewed
    target: service_programs
    mutation: {transition: {from: pending_renewal, to: active}}
    meaning: The program is renewed for a further term at the escalated labor rate.
    grain: One row per program, changed once per renewal.
    fields:
      status: The lifecycle status, moved back to active.
      term_start_date: The first day of the renewed term.
      term_end_date: The last day of the renewed term.
      annual_program_fee_usd: The annual program fee for the renewed term.
    triggers:
      - event: service:service_emergency_allowance_credited
        map: {program_id: program_id, customer_id: customer_id}
      - event: service:service_invoice_charged
        map: {program_id: program_id, customer_id: customer_id, charge_type: annual_program_fee}
  - type: service_program_suspended
    target: service_programs
    mutation: {transition: [{from: active, to: suspended}, {from: pending_renewal, to: suspended}]}
    meaning: Dispatch privileges are withdrawn because the account is in arrears or over its credit limit.
    grain: One row per program, changed once per suspension.
    fields:
      status: The lifecycle status, moved to suspended.
      suspension_date: The day dispatch privileges were withdrawn.
    triggers: []
  - type: service_program_reinstated
    target: service_programs
    mutation: {transition: [{from: suspended, to: active}, {from: expired, to: active}]}
    meaning: Dispatch privileges are restored after the arrears are cleared or a lapsed program is restarted.
    grain: One row per program, changed once per reinstatement.
    fields:
      status: The lifecycle status, moved back to active.
      reinstatement_date: The day dispatch privileges were restored.
      term_end_date: The last day of the term the program is restored into.
    triggers:
      - event: service:service_invoice_charged
        map: {program_id: program_id, customer_id: customer_id, charge_type: reinstatement}
  - type: service_program_expired
    target: service_programs
    mutation: {transition: {from: pending_renewal, to: expired}}
    meaning: The program term ends without a renewal and the account falls back to published rates.
    grain: One row per program, changed once when the term lapses.
    fields:
      status: The lifecycle status, moved to expired.
      term_end_date: The last day of the term that has just ended.
    triggers: []
  - type: service_program_cancelled
    target: service_programs
    mutation: {transition: [{from: active, to: cancelled}, {from: suspended, to: cancelled}]}
    meaning: The program is closed out before its term end.
    grain: One row per program, changed once when it is closed out.
    fields:
      status: The lifecycle status, moved to cancelled.
      cancellation_date: The day the cancellation was recorded.
      termination_effective_date: The day the program rates stop applying.
      cancellation_reason: Why the program was closed out.
    triggers:
      - event: service:service_invoice_charged
        when: {cancellation_reason: customer_convenience}
        map: {program_id: program_id, customer_id: customer_id, charge_type: cancellation}
  - type: service_program_updated
    target: service_programs
    mutation: update
    meaning: A term of the live program changes, such as the credit limit, the purchase order requirement or the primary site.
    grain: One row per program, changed once per accepted amendment.
    fields:
      credit_limit_usd: The open balance ceiling after the change.
      po_required: Whether a purchase order number is required after the change.
      primary_site_id: The primary service address after the change.
      last_change_type: What kind of amendment was applied.
      last_change_date: The day the amendment took effect.
    triggers: []
  - type: service_call_dispatched
    target: service_events
    meaning: A demand service call is accepted and a technician is dispatched to a building.
    grain: One row per demand call accepted on one program.
    distinguish_by: [work_order_ref, dispatch_timestamp, call_priority, site_id]
    fields:
      program_id: The rate program the call is dispatched under.
      customer_id: The building owner who called.
      event_type: The event family of this row.
      site_id: The building the technician is sent to.
      work_order_ref: The work order raised for the call.
      call_priority: How the call was classified when it was accepted.
      dispatch_timestamp: The moment the call was accepted and dispatched.
      equipment_tag: The unit reported faulty, where the caller names one.
      fault_reported: The fault class the caller reported.
    triggers:
      - event: service:service_emergency_call_used
        when: {call_priority: [emergency, critical]}
        map: {program_id: program_id, customer_id: customer_id, work_order_ref: work_order_ref}
  - type: service_call_completed
    target: service_events
    account: labor_hour_block
    direction: out
    meaning: The technician finishes a demand call, drawing the labor hours from the block where the program holds one.
    grain: One row per completed demand call on one program.
    distinguish_by: [work_order_ref, completed_date, labor_hours, hours_band]
    fields:
      program_id: The rate program the call was worked under.
      customer_id: The building owner the call was worked for.
      event_type: The event family of this row.
      site_id: The building the call was worked at.
      work_order_ref: The work order the call was worked under.
      onsite_timestamp: The moment the technician arrived on site.
      completed_date: The day the call was completed.
      labor_hours: Technician hours worked on the call.
      hours_band: Whether the work fell in regular hours, outside them, on a weekend or on a holiday.
      technician_count: How many technicians worked the call.
      sla_met: Whether the response guarantee was met on this call.
      callback_of_work_order_ref: The earlier work order this call returns to, where the call is a callback.
      equipment_tag: The unit worked on.
      parts_amount_usd: The parts value used on the call.
      refrigerant_lbs: Pounds of refrigerant added on the call.
    triggers:
      - event: service:service_invoice_charged
        map: {program_id: program_id, customer_id: customer_id, work_order_ref: work_order_ref, charge_type: labor}
      - event: service:service_credit_issued
        when: {sla_met: missed}
        map: {program_id: program_id, customer_id: customer_id, work_order_ref: work_order_ref, credit_reason: missed_response}
  - type: service_block_hours_purchased
    target: service_events
    account: labor_hour_block
    direction: in
    meaning: The customer buys a block of prepaid technician hours and the hours are credited to the program.
    grain: One row per block purchased on one program.
    distinguish_by: [invoice_ref, purchased_date, block_hours]
    fields:
      program_id: The program the block is credited to.
      customer_id: The building owner who bought the block.
      event_type: The event family of this row.
      block_hours: The hours credited by this purchase.
      purchased_date: The day the block was bought.
      expiry_date: The day the unused hours of this block expire.
      amount_usd: The price paid for the block.
      invoice_ref: The invoice the block was billed on.
    triggers:
      - event: service:service_invoice_charged
        map: {program_id: program_id, customer_id: customer_id, invoice_ref: invoice_ref, charge_type: block_purchase}
  - type: service_emergency_allowance_credited
    target: service_events
    account: emergency_call_allowance
    direction: in
    meaning: The program year's included emergency dispatches are credited at activation or renewal.
    grain: One row per program year crediting of included emergency calls.
    distinguish_by: [billing_period, included_calls]
    fields:
      program_id: The program the calls are credited to.
      customer_id: The building owner the program belongs to.
      event_type: The event family of this row.
      billing_period: The program year the credit belongs to.
      included_calls: The number of emergency dispatches credited for the year.
    triggers: []
  - type: service_emergency_call_used
    target: service_events
    account: emergency_call_allowance
    direction: out
    meaning: An emergency dispatch consumes one of the program year's included emergency calls, or runs past them.
    grain: One row per emergency dispatch counted against the year's allowance.
    distinguish_by: [work_order_ref, used_date, surcharge_applied]
    fields:
      program_id: The program the emergency call is counted against.
      customer_id: The building owner who called.
      event_type: The event family of this row.
      work_order_ref: The work order of the emergency call.
      used_date: The day the emergency call was taken.
      surcharge_applied: Whether the call ran past the included allowance and carries the surcharge.
    triggers:
      - event: service:service_invoice_charged
        when: {surcharge_applied: applied}
        map: {program_id: program_id, customer_id: customer_id, work_order_ref: work_order_ref, charge_type: emergency_surcharge}
  - type: service_quote_issued
    target: service_events
    meaning: A written quote for a demand repair is issued to the building owner.
    grain: One row per quote issued on one work order.
    distinguish_by: [quote_ref, issued_date, quote_amount_usd]
    fields:
      program_id: The program the quote is issued under.
      customer_id: The building owner quoted.
      event_type: The event family of this row.
      site_id: The building the quoted work is at.
      work_order_ref: The work order the quote belongs to.
      quote_ref: The quote number.
      quote_amount_usd: The quoted value of the work.
      issued_date: The day the quote was issued.
      expiry_date: The day the quote lapses.
      approval_status: Whether the owner has approved the quoted work.
    triggers: []
  - type: service_invoice_charged
    target: service_events
    account: service_balance
    direction: in
    meaning: A demand service charge is invoiced to the building owner.
    grain: One row per charge line invoiced on one program.
    distinguish_by: [invoice_ref, charge_type, amount_usd, work_order_ref]
    fields:
      program_id: The program the charge belongs to.
      customer_id: The building owner invoiced.
      event_type: The event family of this row.
      work_order_ref: The work order the charge arises from, where there is one.
      invoice_ref: The invoice the charge was billed on.
      charge_type: Which kind of charge this line is.
      amount_usd: The amount charged.
      billing_rate_usd: The labor rate the charge was computed at, where it is a labor line.
      labor_hours: The hours billed on the line, where it is a labor line.
      billing_period: The period the charge falls in.
      due_date: The day the invoice falls due.
    triggers: []
  - type: service_payment_received
    target: service_events
    account: service_balance
    direction: out
    meaning: A payment from the building owner is applied to the demand service balance.
    grain: One row per payment applied to one invoice.
    distinguish_by: [invoice_ref, received_date, amount_usd, payment_method]
    fields:
      program_id: The program the payment is applied to.
      customer_id: The building owner who paid.
      event_type: The event family of this row.
      invoice_ref: The invoice the payment is applied to.
      amount_usd: The amount paid.
      payment_method: How the payment was made.
      received_date: The day the payment was received.
    triggers: []
  - type: service_credit_issued
    target: service_events
    account: service_balance
    direction: out
    meaning: A credit is issued against the demand service balance, most often for a missed response guarantee.
    grain: One row per credit issued on one program.
    distinguish_by: [work_order_ref, credit_reason, amount_usd, issued_date]
    fields:
      program_id: The program credited.
      customer_id: The building owner credited.
      event_type: The event family of this row.
      work_order_ref: The call the credit arises from.
      credit_reason: Why the credit was issued.
      amount_usd: The amount credited.
      issued_date: The day the credit was issued.
      invoice_ref: The invoice the credit is applied against.
    triggers: []

measures:
  - id: service_msr_emergency_calls_used_year
    window: The current program year, from term_start_date through term_end_date inclusive.
    measure: Count of service_emergency_call_used rows on this program whose used_date falls in the window.
  - id: service_msr_block_hours_drawn
    window: The life of the currently unexpired blocks, from the earliest unexpired purchased_date to the handling day.
    measure: Sum of labor_hours over service_call_completed rows on this program whose completed_date falls in the window.
  - id: service_msr_callbacks_in_window
    window: The tier's callback window counted back in calendar days from the handling day.
    measure: Count of service_call_completed rows on this program whose callback_of_work_order_ref is not empty and whose completed_date falls in the window.

policies:
  - id: service_agg_multi_holding
    subject: [service_program_requested]
    rule: >-
      An account carries one demand service rate program at a time. A second enrollment is not opened while
      the account holds a program in requested, active, pending_renewal or suspended status; a customer who
      wants different rates moves the existing program to another tier instead, which takes effect at the next
      renewal unless the office agrees to an immediate change. Programs in expired, cancelled or declined
      status do not block a new enrollment. The program covers every building on the account, so a customer
      with several buildings does not need one program per site, and the rates, the block and the emergency
      allowance are held once at account level and drawn from wherever the call comes in.
    eligibility:
      - id: no_live_program_on_account
        applies_to: [service_program_requested]
        kind: dedup
        condition: A second enrollment is not opened while the account holds a program in requested, active, pending_renewal or suspended status; a customer who wants different rates moves the existing program to another tier instead, which takes effect at the next renewal unless the office agrees to an immediate change.
        evidence_fields: [service_programs.customer_id, service_programs.status, service_programs.program_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_programs.customer_id]
          action_bindings:
            service_programs.customer_id: customer_id
        dedup_contract:
          table: service_programs
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [requested, active, pending_renewal, suspended]}
          distinct_fields: [variant_name, enrollment_date]
    params:
      max_per_customer: 1

  - id: service_enrollment_qualification
    subject: [service_program_requested, service_enrollment_declined]
    rule: >-
      A program is opened only for an account that meets the tier's entry gate. The account must carry at
      least the tier's minimum number of buildings in active site status, counted on the site register at the
      day of enrollment. The account's credit terms on file must be no longer than the terms the tier
      requires, and an account standing in credit_hold status is not enrolled until the hold is released.
      Where the account does not qualify, the enrollment is declined and the owner is offered the highest tier
      whose gate the account does meet. The enrollment fee and the first annual program fee are charged when
      the program takes effect, not when the enrollment is opened, so an enrollment that is declined or left
      unsigned carries no charge.
    eligibility:
      - id: minimum_sites_on_account
        applies_to: [service_program_requested]
        kind: caller_fact
        condition: The account must carry at least the tier's minimum number of buildings in active site status, counted on the site register at the day of enrollment.
        evidence_fields: [sites.site_id, sites.customer_id, sites.site_status]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys:
            - [sites.customer_id]
          action_bindings:
            sites.customer_id: customer_id
      - id: account_credit_standing
        applies_to: [service_program_requested]
        kind: authorization
        condition: The account's credit terms on file must be no longer than the terms the tier requires, and an account standing in credit_hold status is not enrolled until the hold is released.
        evidence_fields: [customers.credit_terms, customers.account_status, customers.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [customers.customer_id]
          action_bindings:
            customers.customer_id: customer_id
    params:
      per_tier:
        Time & Material Account: {min_sites: "=min_sites_required", enrollment_fee_usd: "=enrollment_fee_usd", program_fee_usd: "=annual_program_fee_usd"}
        Priority Response Program: {min_sites: "=min_sites_required", enrollment_fee_usd: "=enrollment_fee_usd", program_fee_usd: "=annual_program_fee_usd"}
        Block Hour Service Program: {min_sites: "=min_sites_required", enrollment_fee_usd: "=enrollment_fee_usd", program_fee_usd: "=annual_program_fee_usd"}
        Emergency Response Program: {min_sites: "=min_sites_required", enrollment_fee_usd: "=enrollment_fee_usd", program_fee_usd: "=annual_program_fee_usd"}
        Critical Facility Response Program: {min_sites: "=min_sites_required", enrollment_fee_usd: "=enrollment_fee_usd", program_fee_usd: "=annual_program_fee_usd"}
        Dedicated Technician Program: {min_sites: "=min_sites_required", enrollment_fee_usd: "=enrollment_fee_usd", program_fee_usd: "=annual_program_fee_usd"}

  - id: service_activation_and_entitlement
    subject: [service_program_activated, service_emergency_allowance_credited]
    rule: >-
      A program takes effect only when the signed enrollment is on file against it. The signature must reach
      the office no later than the tier's quote validity counted forward from the day the enrollment offer was
      issued, counting calendar days with the day of issue excluded and the final day included; past that the
      enrollment is reissued at current rates. The term runs for the tier's term length from the day the
      program takes effect. At the start of each program year the program is credited with the tier's included
      emergency dispatches, and unused emergency dispatches are forfeited at the year end rather than carried
      forward. A block of prepaid hours is credited only when a block is actually bought, never at activation,
      because a block is a purchase and not an entitlement of the tier.
    eligibility:
      - id: signed_enrollment_on_file
        applies_to: [service_program_activated]
        kind: authorization
        condition: A program takes effect only when the signed enrollment is on file against it.
        evidence_fields: [service_requests.program_id, service_requests.request_type, service_requests.outcome]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_requests.program_id]
          action_bindings:
            service_requests.program_id: program_id
      - id: signature_inside_offer_validity
        applies_to: [service_program_activated]
        kind: time
        condition: The signature must reach the office no later than the tier's quote validity counted forward from the day the enrollment offer was issued, counting calendar days with the day of issue excluded and the final day included; past that the enrollment is reissued at current rates.
        evidence_fields: [service_programs.enrollment_date, service_programs.program_id, service_programs.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_programs.program_id]
          action_bindings:
            service_programs.program_id: program_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the day the enrollment offer was issued
          anchor_source: service_programs.enrollment_date
          relation: not_after
          duration_source: variants.quote_validity_days
          unit: calendar_days
          counting_rule: counting calendar days with the day of issue excluded and the final day included
          boundary: inclusive
    params:
      per_tier:
        Time & Material Account: {included_calls: "=emergency_calls_included", offer_validity_days: "=quote_validity_days", term_months: "=term_months"}
        Priority Response Program: {included_calls: "=emergency_calls_included", offer_validity_days: "=quote_validity_days", term_months: "=term_months"}
        Block Hour Service Program: {included_calls: "=emergency_calls_included", offer_validity_days: "=quote_validity_days", term_months: "=term_months"}
        Emergency Response Program: {included_calls: "=emergency_calls_included", offer_validity_days: "=quote_validity_days", term_months: "=term_months"}
        Critical Facility Response Program: {included_calls: "=emergency_calls_included", offer_validity_days: "=quote_validity_days", term_months: "=term_months"}
        Dedicated Technician Program: {included_calls: "=emergency_calls_included", offer_validity_days: "=quote_validity_days", term_months: "=term_months"}

  - id: service_dispatch_and_response
    subject: [service_call_dispatched]
    rule: >-
      A demand call is dispatched under the program only while the program stands in active or pending_renewal
      status; a suspended or expired program is served at the published walk-up rates with payment taken
      before the technician is released. Every accepted call is classified at intake as routine, priority,
      emergency or critical, and the classification fixes the response guarantee: the tier's routine, priority,
      emergency and critical response hours respectively, counted in elapsed hours from the moment the call
      was accepted, without regard to office hours. A call is classified as emergency only where the fault
      leaves the building without heating or cooling, floods, or threatens equipment damage; comfort
      complaints and requests to advance a scheduled visit are routine however urgently they are stated, and
      the desk never reclassifies a call on the caller's insistence alone. A critical classification is
      available only at the two highest tiers and only at a building whose use class is a data centre or a
      medical office. A call at an account over the tier's credit limit is held until the office releases it,
      and a call outside regular hours is accepted only where the tier accepts after-hours dispatch.
    eligibility:
      - id: live_program_for_dispatch
        applies_to: [service_call_dispatched]
        kind: state
        condition: A demand call is dispatched under the program only while the program stands in active or pending_renewal status; a suspended or expired program is served at the published walk-up rates with payment taken before the technician is released.
        evidence_fields: [service_programs.status, service_programs.program_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_programs.program_id]
          action_bindings:
            service_programs.program_id: program_id
        state_contract:
          field: service_programs.status
          allowed: [active, pending_renewal]
    params:
      per_tier:
        Time & Material Account: {routine_hours: "=response_time_guarantee_hours", priority_hours: "=priority_response_hours", emergency_hours: "=emergency_response_hours", critical_hours: "=critical_response_hours", queue_rank: "=dispatch_priority_rank", after_hours: "=after_hours_dispatch_included"}
        Priority Response Program: {routine_hours: "=response_time_guarantee_hours", priority_hours: "=priority_response_hours", emergency_hours: "=emergency_response_hours", critical_hours: "=critical_response_hours", queue_rank: "=dispatch_priority_rank", after_hours: "=after_hours_dispatch_included"}
        Block Hour Service Program: {routine_hours: "=response_time_guarantee_hours", priority_hours: "=priority_response_hours", emergency_hours: "=emergency_response_hours", critical_hours: "=critical_response_hours", queue_rank: "=dispatch_priority_rank", after_hours: "=after_hours_dispatch_included"}
        Emergency Response Program: {routine_hours: "=response_time_guarantee_hours", priority_hours: "=priority_response_hours", emergency_hours: "=emergency_response_hours", critical_hours: "=critical_response_hours", queue_rank: "=dispatch_priority_rank", after_hours: "=after_hours_dispatch_included"}
        Critical Facility Response Program: {routine_hours: "=response_time_guarantee_hours", priority_hours: "=priority_response_hours", emergency_hours: "=emergency_response_hours", critical_hours: "=critical_response_hours", queue_rank: "=dispatch_priority_rank", after_hours: "=after_hours_dispatch_included"}
        Dedicated Technician Program: {routine_hours: "=response_time_guarantee_hours", priority_hours: "=priority_response_hours", emergency_hours: "=emergency_response_hours", critical_hours: "=critical_response_hours", queue_rank: "=dispatch_priority_rank", after_hours: "=after_hours_dispatch_included"}

  - id: service_labor_billing
    subject: [service_call_completed, service_invoice_charged]
    rule: >-
      Labor on a demand call is billed at the tier's regular rate for the lead technician, at the second
      journeyman rate for each further journeyman and at the apprentice rate for an apprentice, each for the
      hours that person was on site. Work outside regular hours, on a weekend or on a published office holiday
      is billed at the tier's regular rate multiplied by the after-hours, weekend or holiday multiplier
      respectively, and where more than one of those applies to the same hours the highest single multiplier
      governs and the multipliers are never compounded. Regular hours are Monday to Friday, seven in the
      morning to five in the afternoon, on the office calendar. Every call bills at least the tier's minimum
      billable hours, or the after-hours minimum where the call was taken outside regular hours, and hours
      beyond the minimum are billed in quarter-hour steps rounded up. The trip charge is added once per call
      and the diagnostic fee once per work order, and where the tier credits the diagnostic fee it is credited
      in full against the repair when the repair is authorised on the same visit. Travel time is billed as
      labor only where the tier bills it. Parts are billed at cost plus the tier's markup, less the tier's
      parts discount, and refrigerant at the tier's rate per pound.
    eligibility: []
    params:
      quarter_hour_rounding: Hours beyond the minimum are billed in quarter-hour steps, always rounded up.
      per_tier:
        Time & Material Account: {rate_usd: "=regular_labor_rate_usd", min_hours: "=minimum_billable_hours", after_hours_min: "=after_hours_minimum_hours", trip_usd: "=trip_charge_usd", diag_usd: "=diagnostic_fee_usd"}
        Priority Response Program: {rate_usd: "=regular_labor_rate_usd", min_hours: "=minimum_billable_hours", after_hours_min: "=after_hours_minimum_hours", trip_usd: "=trip_charge_usd", diag_usd: "=diagnostic_fee_usd"}
        Block Hour Service Program: {rate_usd: "=regular_labor_rate_usd", min_hours: "=minimum_billable_hours", after_hours_min: "=after_hours_minimum_hours", trip_usd: "=trip_charge_usd", diag_usd: "=diagnostic_fee_usd"}
        Emergency Response Program: {rate_usd: "=regular_labor_rate_usd", min_hours: "=minimum_billable_hours", after_hours_min: "=after_hours_minimum_hours", trip_usd: "=trip_charge_usd", diag_usd: "=diagnostic_fee_usd"}
        Critical Facility Response Program: {rate_usd: "=regular_labor_rate_usd", min_hours: "=minimum_billable_hours", after_hours_min: "=after_hours_minimum_hours", trip_usd: "=trip_charge_usd", diag_usd: "=diagnostic_fee_usd"}
        Dedicated Technician Program: {rate_usd: "=regular_labor_rate_usd", min_hours: "=minimum_billable_hours", after_hours_min: "=after_hours_minimum_hours", trip_usd: "=trip_charge_usd", diag_usd: "=diagnostic_fee_usd"}
    formula:
      labor_charge_usd: "round(max(minimum_billable_hours, labor_hours) * regular_labor_rate_usd * after_hours_rate_multiplier + trip_charge_usd, 2)"

  - id: service_block_hour_drawdown
    subject: [service_block_hours_purchased, service_call_completed]
    rule: >-
      Where the tier sells blocks, prepaid hours are bought in multiples of the tier's minimum purchase at the
      tier's block rate, and they are drawn down by the labor hours of each completed call, oldest block
      first. Hours are drawn at their face value whatever band the work fell in, so an after-hours call draws
      the hours worked and the after-hours premium alone is invoiced. Once the remaining block reaches zero
      the further hours of that call and of every later call are billed at the tier's overage rate until a new
      block is bought. Unused hours expire at the tier's expiry period counted forward in whole calendar
      months from the day the block was bought, and expired hours are neither refunded nor restored. Where the
      tier allows rollover, hours unexpired at renewal carry into the next program year; where it does not,
      they are forfeited at the year end. On cancellation the tier's refund portion of the unexpired unused
      hours is refunded at the rate they were bought at, never at the current rate.
    eligibility:
      - id: block_purchase_order_on_file
        applies_to: [service_block_hours_purchased]
        kind: authorization
        condition: Where the tier sells blocks, prepaid hours are bought in multiples of the tier's minimum purchase at the tier's block rate, and they are drawn down by the labor hours of each completed call, oldest block first.
        evidence_fields: [service_requests.program_id, service_requests.request_type, service_requests.outcome]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_requests.program_id]
          action_bindings:
            service_requests.program_id: program_id
    measures: [service_msr_block_hours_drawn]
    params:
      per_tier:
        Time & Material Account: {block_rate_usd: "=block_hour_rate_usd", min_hours: "=block_min_purchase_hours", expiry_months: "=block_hour_expiry_months", overage_usd: "=block_overage_rate_usd", rollover: "=block_rollover_allowed", refund_pct: "=unused_block_refund_pct"}
        Priority Response Program: {block_rate_usd: "=block_hour_rate_usd", min_hours: "=block_min_purchase_hours", expiry_months: "=block_hour_expiry_months", overage_usd: "=block_overage_rate_usd", rollover: "=block_rollover_allowed", refund_pct: "=unused_block_refund_pct"}
        Block Hour Service Program: {block_rate_usd: "=block_hour_rate_usd", min_hours: "=block_min_purchase_hours", expiry_months: "=block_hour_expiry_months", overage_usd: "=block_overage_rate_usd", rollover: "=block_rollover_allowed", refund_pct: "=unused_block_refund_pct"}
        Emergency Response Program: {block_rate_usd: "=block_hour_rate_usd", min_hours: "=block_min_purchase_hours", expiry_months: "=block_hour_expiry_months", overage_usd: "=block_overage_rate_usd", rollover: "=block_rollover_allowed", refund_pct: "=unused_block_refund_pct"}
        Critical Facility Response Program: {block_rate_usd: "=block_hour_rate_usd", min_hours: "=block_min_purchase_hours", expiry_months: "=block_hour_expiry_months", overage_usd: "=block_overage_rate_usd", rollover: "=block_rollover_allowed", refund_pct: "=unused_block_refund_pct"}
        Dedicated Technician Program: {block_rate_usd: "=block_hour_rate_usd", min_hours: "=block_min_purchase_hours", expiry_months: "=block_hour_expiry_months", overage_usd: "=block_overage_rate_usd", rollover: "=block_rollover_allowed", refund_pct: "=unused_block_refund_pct"}
    formula:
      overage_charge_usd: "round(max(0, labor_hours - labor_hour_block) * block_overage_rate_usd, 2)"

  - id: service_emergency_entitlement
    subject: [service_emergency_call_used]
    rule: >-
      Each emergency or critical dispatch consumes one of the program year's included emergency calls. A call
      taken once the year's included calls are used up still runs at the tier's emergency response guarantee,
      and it carries the tier's emergency surcharge on top of the labor and parts of the call. The count is
      taken over the current program year only and it counts dispatches, not work orders, so a single fault
      that brings the technician back a second time on the same night counts twice unless the second trip is a
      callback. At the top tier, where the surcharge is zero, the count is still kept because it drives the
      year-end service review. A call the office itself reclassifies downward after arrival is released back
      to the allowance and the surcharge, where it was applied, is credited.
    eligibility: []
    measures: [service_msr_emergency_calls_used_year]
    params:
      per_tier:
        Time & Material Account: {included_calls: "=emergency_calls_included", surcharge_usd: "=emergency_call_surcharge_usd"}
        Priority Response Program: {included_calls: "=emergency_calls_included", surcharge_usd: "=emergency_call_surcharge_usd"}
        Block Hour Service Program: {included_calls: "=emergency_calls_included", surcharge_usd: "=emergency_call_surcharge_usd"}
        Emergency Response Program: {included_calls: "=emergency_calls_included", surcharge_usd: "=emergency_call_surcharge_usd"}
        Critical Facility Response Program: {included_calls: "=emergency_calls_included", surcharge_usd: "=emergency_call_surcharge_usd"}
        Dedicated Technician Program: {included_calls: "=emergency_calls_included", surcharge_usd: "=emergency_call_surcharge_usd"}

  - id: service_quote_and_approval
    subject: [service_quote_issued, service_program_updated]
    rule: >-
      Work whose estimated value passes the tier's quote threshold is not started until a written quote has
      been issued, and work whose estimated value passes the tier's approval threshold is not started until
      the owner's written approval of that quote is recorded in the office records. The caller's word that
      the work is approved is never enough on its own; the approval must stand against the quote number of
      the work in hand, and an approval recorded against a different quote does not carry over. A quote stays
      open for the tier's validity period counted in calendar days from the day it was issued, and a lapsed
      quote is reissued at current rates rather than honoured. Where the quoted value passes the tier's
      deposit threshold, the tier's deposit is taken before the work is scheduled, and the deposit is applied
      to the final invoice. A quote that has already been approved is not issued a second time for the same
      work order.
    eligibility:
      - id: owner_approval_recorded
        applies_to: [service_quote_issued]
        kind: authorization
        condition: The caller's word that the work is approved is never enough on its own; the approval must stand against the quote number of the work in hand, and an approval recorded against a different quote does not carry over.
        evidence_fields: [service_requests.quote_ref, service_requests.request_type, service_requests.outcome, service_requests.program_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_requests.quote_ref]
          action_bindings:
            service_requests.quote_ref: quote_ref
      - id: quote_not_reissued_after_approval
        applies_to: [service_quote_issued]
        kind: dedup
        condition: A quote that has already been approved is not issued a second time for the same work order.
        evidence_fields: [service_events.work_order_ref, service_events.approval_status, service_events.quote_ref]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_events.work_order_ref]
          action_bindings:
            service_events.work_order_ref: work_order_ref
        dedup_contract:
          table: service_events
          mode: separate_record
          object_bindings: {work_order_ref: work_order_ref}
          duplicate_filters: {approval_status: [approved]}
          distinct_fields: [quote_ref, issued_date]
    params:
      per_tier:
        Time & Material Account: {quote_above_usd: "=quote_required_above_usd", approval_above_usd: "=approval_required_above_usd", validity_days: "=quote_validity_days", deposit_above_usd: "=deposit_required_above_usd", deposit_pct: "=deposit_pct"}
        Priority Response Program: {quote_above_usd: "=quote_required_above_usd", approval_above_usd: "=approval_required_above_usd", validity_days: "=quote_validity_days", deposit_above_usd: "=deposit_required_above_usd", deposit_pct: "=deposit_pct"}
        Block Hour Service Program: {quote_above_usd: "=quote_required_above_usd", approval_above_usd: "=approval_required_above_usd", validity_days: "=quote_validity_days", deposit_above_usd: "=deposit_required_above_usd", deposit_pct: "=deposit_pct"}
        Emergency Response Program: {quote_above_usd: "=quote_required_above_usd", approval_above_usd: "=approval_required_above_usd", validity_days: "=quote_validity_days", deposit_above_usd: "=deposit_required_above_usd", deposit_pct: "=deposit_pct"}
        Critical Facility Response Program: {quote_above_usd: "=quote_required_above_usd", approval_above_usd: "=approval_required_above_usd", validity_days: "=quote_validity_days", deposit_above_usd: "=deposit_required_above_usd", deposit_pct: "=deposit_pct"}
        Dedicated Technician Program: {quote_above_usd: "=quote_required_above_usd", approval_above_usd: "=approval_required_above_usd", validity_days: "=quote_validity_days", deposit_above_usd: "=deposit_required_above_usd", deposit_pct: "=deposit_pct"}

  - id: service_response_guarantee_credit
    subject: [service_credit_issued]
    rule: >-
      Where a technician reaches the building later than the guarantee the call's classification carries, the
      customer is credited. The guarantee is met when the technician is on site no later than the response
      hours of that classification counted in elapsed hours from the moment the call was accepted, counting
      whole and part hours alike and running through nights, weekends and holidays without pause. The credit
      is the tier's credit rate applied to the labor charge of that call, capped at the tier's ceiling for one
      missed response, and it is applied to the invoice the call was billed on. No credit is due where the
      building denied access, where the caller was not reachable to let the technician in, or where the call
      was held because the account stood over its credit limit. A tier whose credit rate is zero owes no
      credit at all, and the correct answer to such a caller is that the tier carries no response guarantee,
      not a goodwill payment.
    eligibility:
      - id: response_guarantee_breached
        applies_to: [service_credit_issued]
        kind: time
        condition: The guarantee is met when the technician is on site no later than the response hours of that classification counted in elapsed hours from the moment the call was accepted, counting whole and part hours alike and running through nights, weekends and holidays without pause.
        evidence_fields: [service_events.dispatch_timestamp, service_events.onsite_timestamp, service_events.work_order_ref, service_events.call_priority]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_events.work_order_ref]
          action_bindings:
            service_events.work_order_ref: work_order_ref
        temporal_basis:
          clock: frozen_time
          anchor_event: the moment the call was accepted
          anchor_source: service_events.dispatch_timestamp
          relation: not_after
          duration_source: variants.emergency_response_hours
          unit: elapsed_hours
          counting_rule: counting whole and part hours alike and running through nights, weekends and holidays without pause
          boundary: inclusive
    params:
      per_tier:
        Time & Material Account: {credit_pct: "=sla_credit_pct", cap_usd: "=sla_credit_cap_usd"}
        Priority Response Program: {credit_pct: "=sla_credit_pct", cap_usd: "=sla_credit_cap_usd"}
        Block Hour Service Program: {credit_pct: "=sla_credit_pct", cap_usd: "=sla_credit_cap_usd"}
        Emergency Response Program: {credit_pct: "=sla_credit_pct", cap_usd: "=sla_credit_cap_usd"}
        Critical Facility Response Program: {credit_pct: "=sla_credit_pct", cap_usd: "=sla_credit_cap_usd"}
        Dedicated Technician Program: {credit_pct: "=sla_credit_pct", cap_usd: "=sla_credit_cap_usd"}
    formula:
      amount_usd: "min(sla_credit_cap_usd, round(amount_usd * sla_credit_pct / 100, 2))"

  - id: service_callback_warranty
    subject: [service_call_completed]
    rule: >-
      A return trip for the same fault on the same unit inside the tier's callback window is a callback and
      not a new call. The window is counted in calendar days from the day the original repair was completed,
      the completion day excluded and the final day included, and the return call must name the original work
      order for the callback to stand. Where the tier carries free callback labor, no labor, trip charge or
      diagnostic fee is billed on the callback, while parts that failed for a reason outside the original
      repair are billed normally. A return trip for a different fault, or for the same fault on a different
      unit, is a new call at full rates however soon it follows. A callback does not consume an emergency call
      from the allowance and does not draw block hours.
    eligibility:
      - id: callback_inside_window
        applies_to: [service_call_completed]
        kind: time
        condition: The window is counted in calendar days from the day the original repair was completed, the completion day excluded and the final day included, and the return call must name the original work order for the callback to stand.
        evidence_fields: [service_events.completed_date, service_events.work_order_ref, service_events.callback_of_work_order_ref]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_events.callback_of_work_order_ref]
          action_bindings:
            service_events.callback_of_work_order_ref: callback_of_work_order_ref
        temporal_basis:
          clock: frozen_time
          anchor_event: the day the original repair was completed
          anchor_source: service_events.completed_date
          relation: not_after
          duration_source: variants.callback_window_days
          unit: calendar_days
          counting_rule: counted in calendar days from the day the original repair was completed, the completion day excluded and the final day included
          boundary: inclusive
    measures: [service_msr_callbacks_in_window]
    params:
      per_tier:
        Time & Material Account: {window_days: "=callback_window_days", labor_free: "=callback_labor_free"}
        Priority Response Program: {window_days: "=callback_window_days", labor_free: "=callback_labor_free"}
        Block Hour Service Program: {window_days: "=callback_window_days", labor_free: "=callback_labor_free"}
        Emergency Response Program: {window_days: "=callback_window_days", labor_free: "=callback_labor_free"}
        Critical Facility Response Program: {window_days: "=callback_window_days", labor_free: "=callback_labor_free"}
        Dedicated Technician Program: {window_days: "=callback_window_days", labor_free: "=callback_labor_free"}

  - id: service_billing_and_late_fee
    subject: [service_invoice_charged, service_payment_received]
    rule: >-
      Demand work is invoiced per work order once the call is closed, with labor, trip, diagnostic, parts and
      refrigerant on separate lines so the owner can see what each part of the call cost. The invoice falls
      due the tier's payment term after the invoice date, counted in calendar days with the invoice day
      excluded and the due day included, and the account's own credit terms apply only where the program has
      no term of its own. An invoice unpaid past its due day carries the tier's late fee on the unpaid amount
      for each month or part month it stays unpaid. Payments are applied to the oldest unpaid invoice first
      unless the owner directs the payment to a named invoice, and where a purchase order number is required
      under the tier, an invoice issued without it is reissued rather than treated as overdue.
    eligibility: []
    params:
      per_tier:
        Time & Material Account: {terms_days: "=payment_terms_days", late_fee_pct: "=late_fee_pct_per_month", po_required: "=po_required"}
        Priority Response Program: {terms_days: "=payment_terms_days", late_fee_pct: "=late_fee_pct_per_month", po_required: "=po_required"}
        Block Hour Service Program: {terms_days: "=payment_terms_days", late_fee_pct: "=late_fee_pct_per_month", po_required: "=po_required"}
        Emergency Response Program: {terms_days: "=payment_terms_days", late_fee_pct: "=late_fee_pct_per_month", po_required: "=po_required"}
        Critical Facility Response Program: {terms_days: "=payment_terms_days", late_fee_pct: "=late_fee_pct_per_month", po_required: "=po_required"}
        Dedicated Technician Program: {terms_days: "=payment_terms_days", late_fee_pct: "=late_fee_pct_per_month", po_required: "=po_required"}
    formula:
      late_fee_usd: "round(amount_usd * late_fee_pct_per_month / 100, 2)"

  - id: service_suspension_and_reinstatement
    subject: [service_program_suspended, service_program_reinstated]
    rule: >-
      Dispatch privileges are withdrawn once an invoice stays unpaid beyond the tier's suspension period
      counted from the day the invoice fell due, counting calendar days with the due day excluded and the
      final day included, or as soon as the open balance passes the tier's credit limit, whichever happens
      first. A suspended program keeps its block hours and its emergency allowance; nothing is forfeited by
      the suspension itself. Privileges are restored when the arrears are settled in full and the tier's
      reinstatement fee is charged, and the term is not extended by the days lost. A program that has already
      lapsed at its term end may be restarted at the same rates only inside the tier's restart window counted
      forward in calendar days from the term end date, the end day excluded and the final day included; past
      that window a fresh enrollment at current rates is needed.
    eligibility:
      - id: arrears_beyond_suspension_period
        applies_to: [service_program_suspended]
        kind: time
        condition: Dispatch privileges are withdrawn once an invoice stays unpaid beyond the tier's suspension period counted from the day the invoice fell due, counting calendar days with the due day excluded and the final day included, or as soon as the open balance passes the tier's credit limit, whichever happens first.
        evidence_fields: [service_events.due_date, service_events.invoice_ref, service_events.amount_usd]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_events.invoice_ref]
          action_bindings:
            service_events.invoice_ref: invoice_ref
        temporal_basis:
          clock: frozen_time
          anchor_event: the day the invoice fell due
          anchor_source: service_events.due_date
          relation: not_before
          duration_source: variants.suspension_after_days_past_due
          unit: calendar_days
          counting_rule: counting calendar days with the due day excluded and the final day included
          boundary: inclusive
      - id: restart_inside_window
        applies_to: [service_program_reinstated]
        kind: time
        condition: A program that has already lapsed at its term end may be restarted at the same rates only inside the tier's restart window counted forward in calendar days from the term end date, the end day excluded and the final day included; past that window a fresh enrollment at current rates is needed.
        evidence_fields: [service_programs.term_end_date, service_programs.program_id, service_programs.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_programs.program_id]
          action_bindings:
            service_programs.program_id: program_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the term end date
          anchor_source: service_programs.term_end_date
          relation: not_after
          duration_source: variants.restart_window_days
          unit: calendar_days
          counting_rule: counted forward in calendar days from the term end date, the end day excluded and the final day included
          boundary: inclusive
    params:
      per_tier:
        Time & Material Account: {suspension_days: "=suspension_after_days_past_due", credit_limit_usd: "=credit_limit_usd", reinstatement_fee_usd: "=reinstatement_fee_usd", restart_days: "=restart_window_days"}
        Priority Response Program: {suspension_days: "=suspension_after_days_past_due", credit_limit_usd: "=credit_limit_usd", reinstatement_fee_usd: "=reinstatement_fee_usd", restart_days: "=restart_window_days"}
        Block Hour Service Program: {suspension_days: "=suspension_after_days_past_due", credit_limit_usd: "=credit_limit_usd", reinstatement_fee_usd: "=reinstatement_fee_usd", restart_days: "=restart_window_days"}
        Emergency Response Program: {suspension_days: "=suspension_after_days_past_due", credit_limit_usd: "=credit_limit_usd", reinstatement_fee_usd: "=reinstatement_fee_usd", restart_days: "=restart_window_days"}
        Critical Facility Response Program: {suspension_days: "=suspension_after_days_past_due", credit_limit_usd: "=credit_limit_usd", reinstatement_fee_usd: "=reinstatement_fee_usd", restart_days: "=restart_window_days"}
        Dedicated Technician Program: {suspension_days: "=suspension_after_days_past_due", credit_limit_usd: "=credit_limit_usd", reinstatement_fee_usd: "=reinstatement_fee_usd", restart_days: "=restart_window_days"}

  - id: service_renewal_and_cancellation
    subject: [service_renewal_window_opened, service_program_renewed, service_program_expired, service_program_cancelled]
    rule: >-
      The renewal window opens the tier's renewal period before the term end date and the renewal rate sheet
      is sent. Where the tier renews automatically the term renews at the labor rate raised by the tier's
      escalation unless a non-renewal notice was received by the tier's notice deadline, counted back in
      calendar days from the term end date with the deadline day counting as timely. A renewal is recorded
      only when a renewal acceptance from the customer is on file for this program, and at the top tier, which
      does not renew automatically, no acceptance means the term simply ends. A customer may cancel before the
      term end on the tier's written notice period, and the tier's cancellation fee is charged with the final
      invoice; unexpired unused block hours are refunded at the tier's refund portion at the same time. A
      program that lapses at its term end is not cancelled and carries no cancellation fee. The notice
      period is counted in calendar days from the day the written notice was received, the notice day
      excluded and the final day included.
    eligibility:
      - id: renewal_acceptance_on_file
        applies_to: [service_program_renewed]
        kind: authorization
        condition: A renewal is recorded only when a renewal acceptance from the customer is on file for this program, and at the top tier, which does not renew automatically, no acceptance means the term simply ends.
        evidence_fields: [service_requests.program_id, service_requests.request_type, service_requests.outcome]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_requests.program_id]
          action_bindings:
            service_requests.program_id: program_id
      - id: cancellation_notice_period
        applies_to: [service_program_cancelled]
        kind: time
        condition: A customer may cancel before the term end on the tier's written notice period, and the tier's cancellation fee is charged with the final invoice; unexpired unused block hours are refunded at the tier's refund portion at the same time.
        evidence_fields: [service_requests.notice_date, service_requests.program_id, service_requests.request_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_requests.program_id]
          action_bindings:
            service_requests.program_id: program_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the tier's written notice period
          anchor_source: service_requests.notice_date
          relation: not_before
          duration_source: variants.cancellation_notice_days
          unit: calendar_days
          counting_rule: counted in calendar days from the day the written notice was received, the notice day excluded and the final day included
          boundary: inclusive
    params:
      per_tier:
        Time & Material Account: {window_days: "=renewal_window_days", notice_days: "=non_renewal_notice_days", escalation_pct: "=annual_escalation_pct", cancel_notice_days: "=cancellation_notice_days", cancel_fee_usd: "=cancellation_fee_usd"}
        Priority Response Program: {window_days: "=renewal_window_days", notice_days: "=non_renewal_notice_days", escalation_pct: "=annual_escalation_pct", cancel_notice_days: "=cancellation_notice_days", cancel_fee_usd: "=cancellation_fee_usd"}
        Block Hour Service Program: {window_days: "=renewal_window_days", notice_days: "=non_renewal_notice_days", escalation_pct: "=annual_escalation_pct", cancel_notice_days: "=cancellation_notice_days", cancel_fee_usd: "=cancellation_fee_usd"}
        Emergency Response Program: {window_days: "=renewal_window_days", notice_days: "=non_renewal_notice_days", escalation_pct: "=annual_escalation_pct", cancel_notice_days: "=cancellation_notice_days", cancel_fee_usd: "=cancellation_fee_usd"}
        Critical Facility Response Program: {window_days: "=renewal_window_days", notice_days: "=non_renewal_notice_days", escalation_pct: "=annual_escalation_pct", cancel_notice_days: "=cancellation_notice_days", cancel_fee_usd: "=cancellation_fee_usd"}
        Dedicated Technician Program: {window_days: "=renewal_window_days", notice_days: "=non_renewal_notice_days", escalation_pct: "=annual_escalation_pct", cancel_notice_days: "=cancellation_notice_days", cancel_fee_usd: "=cancellation_fee_usd"}

  - id: service_portfolio_interaction
    subject: [service_call_dispatched, service_invoice_charged]
    rule: >-
      The rate program does not decide by itself what a call costs when the building is also under a
      maintenance agreement. Where the unit called about sits on an active maintenance agreement whose tier
      covers repair labor, the repair is handled under that agreement and its allowance, and the demand
      program bills nothing for the labor; the demand rates apply only to work the agreement does not cover.
      Where the tier allows rate substitution and the unit sits on a maintenance agreement that does not cover
      the repair, the lower of the agreement's labor rate and this program's labor rate governs the labor
      line. Where the tier does not allow rate substitution, this program's rate governs, because at those
      tiers the rate is already below every agreement rate the company publishes. A building whose calls are
      dispatched under an equipment retrofit project in progress is billed to that project and not to this
      program, and the desk never splits one work order between the two. Emergency allowance and maintenance
      emergency entitlements do not stack: where both would cover the same dispatch, the maintenance
      entitlement is drawn first and the program allowance is left untouched.
    eligibility:
      - id: covering_agreement_takes_precedence
        applies_to: [service_call_dispatched]
        kind: authorization
