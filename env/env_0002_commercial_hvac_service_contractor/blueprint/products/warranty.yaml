events:
  - type: warranty_plan_quoted
    target: warranty_plans
    mutation: create
    meaning: An extended warranty plan is quoted for a set of units at a building and the plan record is opened.
    grain: One row per plan quoted for one site at one tier.
    fields:
      plan_id: The reference number of this warranty plan record.
      customer_id: The building owner quoted.
      site_id: The building the covered units are in.
      variant_name: The plan tier quoted, written as its official full name.
      status: The lifecycle status, pinned to quoted when the plan is opened.
      quote_date: The day the plan quote was issued.
      units_covered: The number of units the quote covers.
      annual_premium_usd: The annual premium quoted.
      oldest_unit_install_date: The install date of the oldest unit on the quote.
    triggers: []
  - type: warranty_plan_activated
    target: warranty_plans
    mutation: {transition: {from: quoted, to: active}}
    meaning: The owner accepts the quote and cover begins on the enrolled units.
    grain: One row per plan, changed once when cover begins.
    fields:
      status: The lifecycle status, moved to active.
      accepted_date: The day the owner accepted the quote.
      coverage_start_date: The first day of cover.
      coverage_end_date: The last day of cover.
      waiting_period_end_date: The day the waiting period ends and claims may be filed.
    triggers:
      - event: warranty:warranty_claim_allowance_credited
        map: {plan_id: plan_id, customer_id: customer_id}
      - event: warranty:warranty_invoice_charged
        map: {plan_id: plan_id, customer_id: customer_id, charge_type: premium}
  - type: warranty_quote_declined
    target: warranty_plans
    mutation: {transition: {from: quoted, to: declined}}
    meaning: The owner declines the warranty quote.
    grain: One row per quote, changed once when it is declined.
    fields:
      status: The lifecycle status, moved to declined.
      cancellation_date: The day the quote was declined.
      cancellation_reason: Why the quote was declined.
    triggers: []
  - type: warranty_renewal_window_opened
    target: warranty_plans
    mutation: {transition: {from: active, to: pending_renewal}}
    meaning: The plan enters its renewal window ahead of the cover end.
    grain: One row per plan, changed once per term when the renewal window opens.
    fields:
      status: The lifecycle status, moved to pending_renewal.
      renewal_notice_date: The day the renewal window opened.
    triggers: []
  - type: warranty_plan_renewed
    target: warranty_plans
    mutation: {transition: {from: pending_renewal, to: active}}
    meaning: Cover is renewed for a further term at the escalated premium.
    grain: One row per plan, changed once per renewal.
    fields:
      status: The lifecycle status, moved back to active.
      coverage_start_date: The first day of the renewed cover.
      coverage_end_date: The last day of the renewed cover.
      annual_premium_usd: The premium for the renewed term.
    triggers:
      - event: warranty:warranty_claim_allowance_credited
        map: {plan_id: plan_id, customer_id: customer_id}
      - event: warranty:warranty_invoice_charged
        map: {plan_id: plan_id, customer_id: customer_id, charge_type: premium}
  - type: warranty_plan_suspended
    target: warranty_plans
    mutation: {transition: [{from: active, to: suspended}, {from: pending_renewal, to: suspended}]}
    meaning: Cover is suspended because the premium is unpaid or the required maintenance agreement has lapsed.
    grain: One row per plan, changed once per suspension.
    fields:
      status: The lifecycle status, moved to suspended.
      suspension_date: The day cover was suspended.
      suspension_reason: Why cover was suspended.
    triggers: []
  - type: warranty_plan_reinstated
    target: warranty_plans
    mutation: {transition: {from: suspended, to: active}}
    meaning: Suspended cover is put back in force.
    grain: One row per plan, changed once per reinstatement.
    fields:
      status: The lifecycle status, moved back to active.
      reinstatement_date: The day cover was put back in force.
      coverage_end_date: The last day of the cover term the plan returns to.
    triggers:
      - event: warranty:warranty_invoice_charged
        map: {plan_id: plan_id, customer_id: customer_id, charge_type: reinstatement}
  - type: warranty_plan_expired
    target: warranty_plans
    mutation: {transition: {from: pending_renewal, to: expired}}
    meaning: The cover term ends without a renewal.
    grain: One row per plan, changed once when cover lapses.
    fields:
      status: The lifecycle status, moved to expired.
      coverage_end_date: The last day of the cover that has just ended.
    triggers: []
  - type: warranty_plan_cancelled
    target: warranty_plans
    mutation: {transition: [{from: active, to: cancelled}, {from: suspended, to: cancelled}]}
    meaning: Cover is ended before its term end and any refund is settled.
    grain: One row per plan, changed once when cover is ended early.
    fields:
      status: The lifecycle status, moved to cancelled.
      cancellation_date: The day the cancellation was recorded.
      termination_effective_date: The day cover actually stops.
      cancellation_reason: Why cover was ended.
    triggers:
      - event: warranty:warranty_credit_issued
        when: {cancellation_reason: customer_convenience}
        map: {plan_id: plan_id, customer_id: customer_id, credit_reason: cancellation_refund}
  - type: warranty_coverage_updated
    target: warranty_plans
    mutation: update
    meaning: The units covered by a live plan change, or the plan is transferred to a new owner.
    grain: One row per plan, changed once per accepted coverage or ownership change.
    fields:
      units_covered: The number of covered units after the change.
      annual_premium_usd: The premium after the change.
      customer_id: The owner the plan now belongs to, where it was transferred.
      last_change_type: What kind of change was applied.
      last_change_date: The day the change took effect.
    triggers:
      - event: warranty:warranty_invoice_charged
        when: {last_change_type: owner_transferred}
        map: {plan_id: plan_id, customer_id: customer_id, charge_type: transfer_fee}
  - type: warranty_claim_filed
    target: warranty_events
    meaning: The owner or the service desk files a claim against the plan for a failed covered unit.
    grain: One row per claim filed on one covered unit.
    distinguish_by: [claim_ref, filed_date, equipment_tag]
    fields:
      plan_id: The plan the claim is filed against.
      customer_id: The building owner filing.
      event_type: The event family of this row.
      site_id: The building the failed unit is in.
      claim_ref: The claim reference number.
      equipment_tag: The unit that failed.
      component_class: The component the claim concerns.
      fault_found_date: The day the fault was found.
      filed_date: The day the claim was filed.
      work_order_ref: The service work order the fault was found on.
      estimated_repair_usd: The estimated value of the repair.
    triggers: []
  - type: warranty_claim_adjudicated
    target: warranty_events
    account: claim_allowance
    direction: out
    meaning: A filed claim is adjudicated and, where it is approved, its value is drawn from the term's claim allowance.
    grain: One row per adjudication of one claim.
    distinguish_by: [claim_ref, adjudicated_date, claim_outcome, approved_amount_usd]
    fields:
      plan_id: The plan the claim was filed against.
      customer_id: The building owner the claim belongs to.
      event_type: The event family of this row.
      claim_ref: The claim adjudicated.
      equipment_tag: The unit the claim concerns.
      component_class: The component the claim concerns.
      adjudicated_date: The day the claim was adjudicated.
      claim_outcome: How the claim was decided.
      denial_reason: Why the claim was denied, where it was.
      approved_amount_usd: The value approved against the plan.
      deductible_usd: The deductible billed to the owner on this claim.
      labor_hours: The covered labor hours approved on the claim.
      refrigerant_lbs: The refrigerant approved on the claim.
    triggers:
      - event: warranty:warranty_invoice_charged
        when: {claim_outcome: approved}
        map: {plan_id: plan_id, customer_id: customer_id, claim_ref: claim_ref, charge_type: deductible}
      - event: warranty:warranty_part_shipped
        when: {claim_outcome: approved}
        map: {plan_id: plan_id, customer_id: customer_id, claim_ref: claim_ref}
  - type: warranty_claim_allowance_credited
    target: warranty_events
    account: claim_allowance
    direction: in
    meaning: The term's claim allowance is credited at activation or renewal.
    grain: One row per term crediting of the claim allowance on one plan.
    distinguish_by: [billing_period, approved_amount_usd]
    fields:
      plan_id: The plan the allowance is credited to.
      customer_id: The building owner the plan belongs to.
      event_type: The event family of this row.
      billing_period: The cover term the allowance belongs to.
      approved_amount_usd: The claim allowance credited for the term.
    triggers: []
  - type: warranty_part_shipped
    target: warranty_events
    meaning: An approved covered part is shipped to the site or to the technician.
    grain: One row per part shipment on one approved claim.
    distinguish_by: [claim_ref, shipped_date, part_number]
    fields:
      plan_id: The plan the shipment belongs to.
      customer_id: The building owner the shipment is for.
      event_type: The event family of this row.
      claim_ref: The claim the part was approved on.
      part_number: The manufacturer's part number shipped.
      shipped_date: The day the part was shipped.
      shipping_class: Whether the part went by standard or expedited shipping.
    triggers:
      - event: warranty:warranty_invoice_charged
        when: {shipping_class: expedited}
        map: {plan_id: plan_id, customer_id: customer_id, claim_ref: claim_ref, charge_type: expedited_shipping}
  - type: warranty_invoice_charged
    target: warranty_events
    account: warranty_balance
    direction: in
    meaning: A premium, deductible or plan fee is invoiced to the owner.
    grain: One row per charge line invoiced on one plan.
    distinguish_by: [invoice_ref, charge_type, amount_usd, claim_ref]
    fields:
      plan_id: The plan the charge belongs to.
      customer_id: The building owner invoiced.
      event_type: The event family of this row.
      invoice_ref: The invoice the charge was billed on.
      charge_type: Which kind of charge this line is.
      amount_usd: The amount charged.
      claim_ref: The claim the charge arises from, where there is one.
      billing_period: The period the charge covers.
      due_date: The day the invoice falls due.
    triggers: []
  - type: warranty_payment_received
    target: warranty_events
    account: warranty_balance
    direction: out
    meaning: A payment from the owner is applied to the warranty plan balance.
    grain: One row per payment applied to one invoice.
    distinguish_by: [invoice_ref, received_date, amount_usd, payment_method]
    fields:
      plan_id: The plan the payment is applied to.
      customer_id: The building owner who paid.
      event_type: The event family of this row.
      invoice_ref: The invoice the payment is applied to.
      amount_usd: The amount paid.
      payment_method: How the payment was made.
      received_date: The day the payment was received.
    triggers: []
  - type: warranty_credit_issued
    target: warranty_events
    account: warranty_balance
    direction: out
    meaning: A credit or cancellation refund is issued against the warranty plan balance.
    grain: One row per credit issued on one plan.
    distinguish_by: [invoice_ref, credit_reason, amount_usd, issued_date]
    fields:
      plan_id: The plan credited.
      customer_id: The building owner credited.
      event_type: The event family of this row.
      invoice_ref: The invoice the credit is applied against.
      credit_reason: Why the credit was issued.
      amount_usd: The amount credited.
      issued_date: The day the credit was issued.
    triggers: []

measures:
  - id: warranty_msr_claims_approved_term
    window: The current cover term, from coverage_start_date through coverage_end_date inclusive.
    measure: Count of warranty_claim_adjudicated rows on this plan whose claim_outcome is approved and whose adjudicated_date falls in the window.
  - id: warranty_msr_claim_value_term
    window: The current cover term, from coverage_start_date through coverage_end_date inclusive.
    measure: Sum of approved_amount_usd over warranty_claim_adjudicated rows on this plan whose claim_outcome is approved and whose adjudicated_date falls in the window.

policies:
  - id: warranty_agg_multi_holding
    subject: [warranty_plan_quoted]
    rule: >-
      A building owner may hold several warranty plans, but a unit is covered by one plan at a time. A plan is
      not quoted for a unit that already stands on a plan in quoted, active, pending_renewal or suspended
      status; that plan is amended or allowed to run out first. Units at different buildings are written on
      separate plans, and one plan never carries more units than the tier's maximum. Claim allowances and
      caps are held per plan, so two plans of one owner never lend each other cover, and a unit moved between
      plans starts a fresh waiting period.
    eligibility:
      - id: unit_not_already_covered
        applies_to: [warranty_plan_quoted]
        kind: dedup
        condition: A plan is not quoted for a unit that already stands on a plan in quoted, active, pending_renewal or suspended status; that plan is amended or allowed to run out first.
        evidence_fields: [warranty_plans.site_id, warranty_plans.status, warranty_plans.plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [warranty_plans.site_id]
          action_bindings:
            warranty_plans.site_id: site_id
        dedup_contract:
          table: warranty_plans
          mode: separate_record
          object_bindings: {site_id: site_id}
          duplicate_filters: {status: [quoted, active, pending_renewal, suspended]}
          distinct_fields: [variant_name, quote_date]
    params:
      max_per_customer: null

  - id: warranty_agg_portfolio_claim_history
    subject: [warranty_plan_quoted, warranty_plan_renewed]
    rule: >-
      A plan is priced against the owner's claim history across the portfolio, not against one unit alone. The
      history counted is the approved claims on that owner's warranty plans in active, pending_renewal,
      suspended or expired status over the three cover years before the quote day; declined and cancelled
      plans are not counted. An owner whose approved claim value over that history exceeds half the premium
      they paid is quoted at the tier above the one asked for, or quoted with the units that drove the claims
      excluded. The portfolio history never changes the per-claim or per-term caps of the tier written, which
      are always the tier's own.
    eligibility: []
    measures: [warranty_msr_claim_value_term]
    params:
      history_years: The claim history window is the three cover years immediately before the quote day.
      per_tier:
        Manufacturer Warranty Registration: {per_claim_cap_usd: "=claim_cap_per_claim_usd", per_term_cap_usd: "=claim_cap_per_term_usd"}
        Parts Protection Plan: {per_claim_cap_usd: "=claim_cap_per_claim_usd", per_term_cap_usd: "=claim_cap_per_term_usd"}
        Parts & Labor Protection Plan: {per_claim_cap_usd: "=claim_cap_per_claim_usd", per_term_cap_usd: "=claim_cap_per_term_usd"}
        Compressor Coverage Plan: {per_claim_cap_usd: "=claim_cap_per_claim_usd", per_term_cap_usd: "=claim_cap_per_term_usd"}
        Major Component Protection Plan: {per_claim_cap_usd: "=claim_cap_per_claim_usd", per_term_cap_usd: "=claim_cap_per_term_usd"}
        Total Equipment Protection Plan: {per_claim_cap_usd: "=claim_cap_per_claim_usd", per_term_cap_usd: "=claim_cap_per_term_usd"}

  - id: warranty_enrollment_qualification
    subject: [warranty_plan_quoted, warranty_quote_declined]
    rule: >-
      A unit is enrolled only where it is young enough and sound enough for the tier. No unit may be older
      than the tier's enrollment age limit, counted in whole calendar months from the day the unit was
      installed to the quote day, a month completing on the day of the month matching the install day and, in
      a month without such a day, on that month's last day. A tier whose enrollment inspection requirement is
      set is quoted only where a condition inspection of the units is recorded as completed in the office
      records, and a unit the inspection reports as failing is not enrolled at any price. A tier that requires
      maintenance is quoted only where the building holds a maintenance agreement in active or pending_renewal
      status. The enrollment inspection fee is charged per unit when the inspection is performed and is not
      refunded if the owner then declines the quote.
    eligibility:
      - id: unit_age_within_enrollment_limit
        applies_to: [warranty_plan_quoted]
        kind: time
        condition: No unit may be older than the tier's enrollment age limit, counted in whole calendar months from the day the unit was installed to the quote day, a month completing on the day of the month matching the install day and, in a month without such a day, on that month's last day.
        evidence_fields: [equipment_units.install_date, equipment_units.equipment_tag, equipment_units.site_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [equipment_units.equipment_tag]
          action_bindings:
            equipment_units.equipment_tag: equipment_tag
        temporal_basis:
          clock: frozen_time
          anchor_event: the day the unit was installed
          anchor_source: equipment_units.install_date
          relation: not_after
          duration_source: variants.max_equipment_age_months_at_enrollment
          unit: calendar_months
          counting_rule: counted in whole calendar months from the day the unit was installed to the quote day, a month completing on the day of the month matching the install day and, in a month without such a day, on that month's last day
          boundary: inclusive
      - id: condition_inspection_completed
        applies_to: [warranty_plan_quoted]
        kind: authorization
        condition: A tier whose enrollment inspection requirement is set is quoted only where a condition inspection of the units is recorded as completed in the office records, and a unit the inspection reports as failing is not enrolled at any price.
        evidence_fields: [warranty_requests.site_id, warranty_requests.request_type, warranty_requests.outcome]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [warranty_requests.site_id]
          action_bindings:
            warranty_requests.site_id: site_id
      - id: maintenance_agreement_in_force
        applies_to: [warranty_plan_quoted]
        kind: state
        condition: A tier that requires maintenance is quoted only where the building holds a maintenance agreement in active or pending_renewal status.
        evidence_fields: [maintenance_agreements.status, maintenance_agreements.site_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [maintenance_agreements.site_id]
          action_bindings:
            maintenance_agreements.site_id: site_id
        state_contract:
          field: maintenance_agreements.status
          allowed: [active, pending_renewal]
    params:
      per_tier:
        Manufacturer Warranty Registration: {age_months: "=max_equipment_age_months_at_enrollment", inspection: "=inspection_required_at_enrollment", inspection_fee_usd: "=inspection_fee_per_unit_usd", maintenance_required: "=maintenance_agreement_required"}
        Parts Protection Plan: {age_months: "=max_equipment_age_months_at_enrollment", inspection: "=inspection_required_at_enrollment", inspection_fee_usd: "=inspection_fee_per_unit_usd", maintenance_required: "=maintenance_agreement_required"}
        Parts & Labor Protection Plan: {age_months: "=max_equipment_age_months_at_enrollment", inspection: "=inspection_required_at_enrollment", inspection_fee_usd: "=inspection_fee_per_unit_usd", maintenance_required: "=maintenance_agreement_required"}
        Compressor Coverage Plan: {age_months: "=max_equipment_age_months_at_enrollment", inspection: "=inspection_required_at_enrollment", inspection_fee_usd: "=inspection_fee_per_unit_usd", maintenance_required: "=maintenance_agreement_required"}
        Major Component Protection Plan: {age_months: "=max_equipment_age_months_at_enrollment", inspection: "=inspection_required_at_enrollment", inspection_fee_usd: "=inspection_fee_per_unit_usd", maintenance_required: "=maintenance_agreement_required"}
        Total Equipment Protection Plan: {age_months: "=max_equipment_age_months_at_enrollment", inspection: "=inspection_required_at_enrollment", inspection_fee_usd: "=inspection_fee_per_unit_usd", maintenance_required: "=maintenance_agreement_required"}

  - id: warranty_premium_and_activation
    subject: [warranty_plan_activated, warranty_claim_allowance_credited, warranty_coverage_updated]
    rule: >-
      The premium is built unit by unit from the tier's price for each covered unit's equipment type; a type
      priced at zero for a tier cannot be enrolled on that tier. Cover begins on the day the owner accepts the
      quote, runs for the tier's coverage term, and claims may be filed only after the tier's waiting period
      has passed from the first day of cover. At the start of each cover term the plan is credited with the
      tier's per-term claim cap as its allowance; the allowance does not carry forward. A unit added mid-term
      is priced pro rata by whole months remaining and serves its own waiting period from the day it is added.
      A unit removed mid-term is refunded pro rata by whole months remaining, less any claim already paid on
      that unit in the term.
    eligibility: []
    params:
      per_tier:
        Manufacturer Warranty Registration: {term_months: "=coverage_term_months", waiting_days: "=waiting_period_days", allowance_usd: "=claim_cap_per_term_usd", prices: "=coverage_per_unit_price_usd"}
        Parts Protection Plan: {term_months: "=coverage_term_months", waiting_days: "=waiting_period_days", allowance_usd: "=claim_cap_per_term_usd", prices: "=coverage_per_unit_price_usd"}
        Parts & Labor Protection Plan: {term_months: "=coverage_term_months", waiting_days: "=waiting_period_days", allowance_usd: "=claim_cap_per_term_usd", prices: "=coverage_per_unit_price_usd"}
        Compressor Coverage Plan: {term_months: "=coverage_term_months", waiting_days: "=waiting_period_days", allowance_usd: "=claim_cap_per_term_usd", prices: "=coverage_per_unit_price_usd"}
        Major Component Protection Plan: {term_months: "=coverage_term_months", waiting_days: "=waiting_period_days", allowance_usd: "=claim_cap_per_term_usd", prices: "=coverage_per_unit_price_usd"}
        Total Equipment Protection Plan: {term_months: "=coverage_term_months", waiting_days: "=waiting_period_days", allowance_usd: "=claim_cap_per_term_usd", prices: "=coverage_per_unit_price_usd"}
    formula:
      premium_usd: "round(coverage_per_unit_price_usd * units_covered, 2)"

  - id: warranty_claim_filing
    subject: [warranty_claim_filed]
    rule: >-
      A claim is filed against a plan standing in active or pending_renewal status, never against suspended
      cover, and it names the unit, the component and the work order the fault was found on. The claim must be
      filed no later than the tier's filing period counted forward in calendar days from the day the fault was
      found, the day of discovery excluded and the final day included; a claim filed later is denied for late
      filing however plainly the fault is covered. Where the estimated repair passes the tier's prior
      authorisation threshold, the claim is authorised before the work starts, and work started without that
      authorisation is paid only up to the threshold. The claim must also show maintenance: the last
      documented maintenance visit on the unit must fall inside the tier's proof of maintenance period before
      the fault was found.
    eligibility:
      - id: cover_live_for_filing
        applies_to: [warranty_claim_filed]
        kind: state
        condition: A claim is filed against a plan standing in active or pending_renewal status, never against suspended cover, and it names the unit, the component and the work order the fault was found on.
        evidence_fields: [warranty_plans.status, warranty_plans.plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [warranty_plans.plan_id]
          action_bindings:
            warranty_plans.plan_id: plan_id
        state_contract:
          field: warranty_plans.status
          allowed: [active, pending_renewal]
      - id: filed_inside_filing_period
        applies_to: [warranty_claim_filed]
        kind: time
        condition: The claim must be filed no later than the tier's filing period counted forward in calendar days from the day the fault was found, the day of discovery excluded and the final day included; a claim filed later is denied for late filing however plainly the fault is covered.
        evidence_fields: [warranty_events.fault_found_date, warranty_events.claim_ref, warranty_events.equipment_tag]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [warranty_events.claim_ref]
          action_bindings:
            warranty_events.claim_ref: claim_ref
        temporal_basis:
          clock: frozen_time
          anchor_event: the day the fault was found
          anchor_source: warranty_events.fault_found_date
          relation: not_after
          duration_source: variants.claim_filing_days
          unit: calendar_days
          counting_rule: counted forward in calendar days from the day the fault was found, the day of discovery excluded and the final day included
          boundary: inclusive
    params:
      per_tier:
        Manufacturer Warranty Registration: {filing_days: "=claim_filing_days", prior_auth_usd: "=prior_authorization_required_above_usd", proof_months: "=proof_of_maintenance_months"}
        Parts Protection Plan: {filing_days: "=claim_filing_days", prior_auth_usd: "=prior_authorization_required_above_usd", proof_months: "=proof_of_maintenance_months"}
        Parts & Labor Protection Plan: {filing_days: "=claim_filing_days", prior_auth_usd: "=prior_authorization_required_above_usd", proof_months: "=proof_of_maintenance_months"}
        Compressor Coverage Plan: {filing_days: "=claim_filing_days", prior_auth_usd: "=prior_authorization_required_above_usd", proof_months: "=proof_of_maintenance_months"}
        Major Component Protection Plan: {filing_days: "=claim_filing_days", prior_auth_usd: "=prior_authorization_required_above_usd", proof_months: "=proof_of_maintenance_months"}
        Total Equipment Protection Plan: {filing_days: "=claim_filing_days", prior_auth_usd: "=prior_authorization_required_above_usd", proof_months: "=proof_of_maintenance_months"}

  - id: warranty_claim_adjudication
    subject: [warranty_claim_adjudicated, warranty_part_shipped]
    rule: >-
      A claim is adjudicated inside the tier's adjudication period, counted in business days from the day it
      was filed. It is approved where the failed component is one the tier covers, the unit is enrolled and
      out of its waiting period, the maintenance proof holds, and the failure is neither a pre-existing
      condition nor abuse, misuse or damage from flood, fire or a power event. An approved claim pays parts
      where the tier covers parts, labor at the tier's covered labor rate where it covers labor, refrigerant
      up to the tier's covered pounds, and crane and rigging where the tier covers them, up to the tier's
      per-claim cap and never beyond the allowance left in the term. The tier's deductible is billed once per
      approved claim, and a claim beyond the tier's included claims for the term carries the extra claim
      surcharge. Where the approved repair passes the tier's condemnation threshold against the unit's
      replacement cost, the unit is condemned and the tier's replacement allowance is paid instead of the
      repair. A denied claim is explained by its denial reason and may be appealed inside the tier's appeal
      period.
    eligibility:
      - id: claim_not_adjudicated_twice
        applies_to: [warranty_claim_adjudicated]
        kind: dedup
        condition: A claim is adjudicated inside the tier's adjudication period, counted in business days from the day it was filed.
        evidence_fields: [warranty_events.claim_ref, warranty_events.claim_outcome, warranty_events.plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [warranty_events.claim_ref]
          action_bindings:
            warranty_events.claim_ref: claim_ref
        dedup_contract:
          table: warranty_events
          mode: separate_record
          object_bindings: {claim_ref: claim_ref}
          duplicate_filters: {claim_outcome: [approved, denied, condemned]}
          distinct_fields: [adjudicated_date, approved_amount_usd]
    measures: [warranty_msr_claims_approved_term, warranty_msr_claim_value_term]
    params:
      per_tier:
        Manufacturer Warranty Registration: {adjudication_days: "=claim_adjudication_business_days", per_claim_cap_usd: "=claim_cap_per_claim_usd", deductible_usd: "=deductible_usd", included_claims: "=claims_included_per_term", surcharge_usd: "=extra_claim_surcharge_usd", condemn_pct: "=condemnation_threshold_pct", replacement_usd: "=replacement_allowance_usd"}
        Parts Protection Plan: {adjudication_days: "=claim_adjudication_business_days", per_claim_cap_usd: "=claim_cap_per_claim_usd", deductible_usd: "=deductible_usd", included_claims: "=claims_included_per_term", surcharge_usd: "=extra_claim_surcharge_usd", condemn_pct: "=condemnation_threshold_pct", replacement_usd: "=replacement_allowance_usd"}
        Parts & Labor Protection Plan: {adjudication_days: "=claim_adjudication_business_days", per_claim_cap_usd: "=claim_cap_per_claim_usd", deductible_usd: "=deductible_usd", included_claims: "=claims_included_per_term", surcharge_usd: "=extra_claim_surcharge_usd", condemn_pct: "=condemnation_threshold_pct", replacement_usd: "=replacement_allowance_usd"}
        Compressor Coverage Plan: {adjudication_days: "=claim_adjudication_business_days", per_claim_cap_usd: "=claim_cap_per_claim_usd", deductible_usd: "=deductible_usd", included_claims: "=claims_included_per_term", surcharge_usd: "=extra_claim_surcharge_usd", condemn_pct: "=condemnation_threshold_pct", replacement_usd: "=replacement_allowance_usd"}
        Major Component Protection Plan: {adjudication_days: "=claim_adjudication_business_days", per_claim_cap_usd: "=claim_cap_per_claim_usd", deductible_usd: "=deductible_usd", included_claims: "=claims_included_per_term", surcharge_usd: "=extra_claim_surcharge_usd", condemn_pct: "=condemnation_threshold_pct", replacement_usd: "=replacement_allowance_usd"}
        Total Equipment Protection Plan: {adjudication_days: "=claim_adjudication_business_days", per_claim_cap_usd: "=claim_cap_per_claim_usd", deductible_usd: "=deductible_usd", included_claims: "=claims_included_per_term", surcharge_usd: "=extra_claim_surcharge_usd", condemn_pct: "=condemnation_threshold_pct", replacement_usd: "=replacement_allowance_usd"}
    formula:
      approved_payment_usd: "min(claim_allowance, min(claim_cap_per_claim_usd, approved_amount_usd))"

  - id: warranty_billing_and_late_fee
    subject: [warranty_invoice_charged, warranty_payment_received]
    rule: >-
      The premium is invoiced on the tier's billing frequency, and deductibles, surcharges, expedited shipping
      and transfer fees are invoiced as they arise. Each invoice falls due the tier's payment term after the
      invoice date, counted in calendar days with the invoice day excluded and the due day included, and an
      invoice unpaid past its due day carries the tier's late fee for each month or part month it stays
      unpaid. A deductible is billed with the claim it belongs to and is never netted against the claim
      payment, because the claim payment is made to whoever performed the work. Payments are applied to the
      oldest unpaid invoice unless the owner names one.
    eligibility: []
    params:
      per_tier:
        Manufacturer Warranty Registration: {frequency: "=billing_frequency", terms_days: "=payment_terms_days", late_fee_pct: "=late_fee_pct_per_month"}
        Parts Protection Plan: {frequency: "=billing_frequency", terms_days: "=payment_terms_days", late_fee_pct: "=late_fee_pct_per_month"}
        Parts & Labor Protection Plan: {frequency: "=billing_frequency", terms_days: "=payment_terms_days", late_fee_pct: "=late_fee_pct_per_month"}
        Compressor Coverage Plan: {frequency: "=billing_frequency", terms_days: "=payment_terms_days", late_fee_pct: "=late_fee_pct_per_month"}
        Major Component Protection Plan: {frequency: "=billing_frequency", terms_days: "=payment_terms_days", late_fee_pct: "=late_fee_pct_per_month"}
        Total Equipment Protection Plan: {frequency: "=billing_frequency", terms_days: "=payment_terms_days", late_fee_pct: "=late_fee_pct_per_month"}
    formula:
      late_fee_usd: "round(amount_usd * late_fee_pct_per_month / 100, 2)"

  - id: warranty_suspension_and_reinstatement
    subject: [warranty_plan_suspended, warranty_plan_reinstated]
    rule: >-
      Cover is suspended once a premium invoice stays unpaid beyond the tier's suspension period counted from
      the day the invoice fell due, counting calendar days with the due day excluded and the final day
      included, and also where a tier that requires maintenance finds the building's maintenance agreement no
      longer in force. A failure that happens while cover is suspended is never covered, even where the
      arrears are settled afterwards, because cover did not stand on the day of the failure. Cover is put back
      in force once the arrears are settled or the maintenance agreement is reinstated, the tier's
      reinstatement fee is charged, and the term is not extended by the suspended days. Reinstatement without
      a fresh condition inspection is possible only inside the tier's reinstatement window counted forward in
      calendar days from the day cover was suspended, the suspension day excluded and the final day included.
    eligibility:
      - id: premium_arrears_beyond_period
        applies_to: [warranty_plan_suspended]
        kind: time
        condition: Cover is suspended once a premium invoice stays unpaid beyond the tier's suspension period counted from the day the invoice fell due, counting calendar days with the due day excluded and the final day included, and also where a tier that requires maintenance finds the building's maintenance agreement no longer in force.
        evidence_fields: [warranty_events.due_date, warranty_events.invoice_ref, warranty_events.amount_usd]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [warranty_events.invoice_ref]
          action_bindings:
            warranty_events.invoice_ref: invoice_ref
        temporal_basis:
          clock: frozen_time
          anchor_event: the day the invoice fell due
          anchor_source: warranty_events.due_date
          relation: not_before
          duration_source: variants.suspension_after_days_past_due
          unit: calendar_days
          counting_rule: counting calendar days with the due day excluded and the final day included
          boundary: inclusive
      - id: reinstatement_inside_window
        applies_to: [warranty_plan_reinstated]
        kind: time
        condition: Reinstatement without a fresh condition inspection is possible only inside the tier's reinstatement window counted forward in calendar days from the day cover was suspended, the suspension day excluded and the final day included.
        evidence_fields: [warranty_plans.suspension_date, warranty_plans.plan_id, warranty_plans.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [warranty_plans.plan_id]
          action_bindings:
            warranty_plans.plan_id: plan_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the day cover was suspended
          anchor_source: warranty_plans.suspension_date
          relation: not_after
          duration_source: variants.reinstatement_window_days
          unit: calendar_days
          counting_rule: counted forward in calendar days from the day cover was suspended, the suspension day excluded and the final day included
          boundary: inclusive
    params:
      per_tier:
        Manufacturer Warranty Registration: {suspension_days: "=suspension_after_days_past_due", fee_usd: "=reinstatement_fee_usd", window_days: "=reinstatement_window_days"}
        Parts Protection Plan: {suspension_days: "=suspension_after_days_past_due", fee_usd: "=reinstatement_fee_usd", window_days: "=reinstatement_window_days"}
        Parts & Labor Protection Plan: {suspension_days: "=suspension_after_days_past_due", fee_usd: "=reinstatement_fee_usd", window_days: "=reinstatement_window_days"}
        Compressor Coverage Plan: {suspension_days: "=suspension_after_days_past_due", fee_usd: "=reinstatement_fee_usd", window_days: "=reinstatement_window_days"}
        Major Component Protection Plan: {suspension_days: "=suspension_after_days_past_due", fee_usd: "=reinstatement_fee_usd", window_days: "=reinstatement_window_days"}
        Total Equipment Protection Plan: {suspension_days: "=suspension_after_days_past_due", fee_usd: "=reinstatement_fee_usd", window_days: "=reinstatement_window_days"}

  - id: warranty_renewal_and_cancellation
    subject: [warranty_renewal_window_opened, warranty_plan_renewed, warranty_plan_expired, warranty_plan_cancelled, warranty_credit_issued]
    rule: >-
      The renewal window opens the tier's renewal period before the cover end and the renewal quote carries
      the escalated premium. Where the tier renews automatically the cover renews unless a non-renewal notice
      was received by the tier's notice deadline, counted back in calendar days from the cover end with the
      deadline day counting as timely; a plan older than the tier's reinspection age is renewed only after a
      fresh condition inspection. An owner may cancel on the tier's written notice period, and the unused term
      is refunded on the tier's refund basis less the administration fee: pro rata by whole months where the
      tier refunds pro rata, and on the short rate scale where it does not, while a tier that refunds nothing
      returns nothing whatever the reason. A plan transfers to a new building owner where the tier allows it,
      on the tier's transfer fee and with the term and the claim history carried over unchanged. The
      notice period is counted in calendar days from the day the written notice was received, the notice
      day excluded and the final day included.
    eligibility:
      - id: cancellation_notice_period
        applies_to: [warranty_plan_cancelled]
        kind: time
        condition: "An owner may cancel on the tier's written notice period, and the unused term is refunded on the tier's refund basis less the administration fee: pro rata by whole months where the tier refunds pro rata, and on the short rate scale where it does not, while a tier that refunds nothing returns nothing whatever the reason."
        evidence_fields: [warranty_requests.notice_date, warranty_requests.plan_id, warranty_requests.request_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [warranty_requests.plan_id]
          action_bindings:
            warranty_requests.plan_id: plan_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the tier's written notice period
          anchor_source: warranty_requests.notice_date
          relation: not_before
          duration_source: variants.cancellation_notice_days
          unit: calendar_days
          counting_rule: counted in calendar days from the day the written notice was received, the notice day excluded and the final day included
          boundary: inclusive
    params:
      per_tier:
        Manufacturer Warranty Registration: {window_days: "=renewal_window_days", notice_days: "=non_renewal_notice_days", escalation_pct: "=renewal_price_escalation_pct", refund_basis: "=cancellation_refund_basis", admin_fee_usd: "=cancellation_admin_fee_usd", transfer_fee_usd: "=transfer_fee_usd"}
        Parts Protection Plan: {window_days: "=renewal_window_days", notice_days: "=non_renewal_notice_days", escalation_pct: "=renewal_price_escalation_pct", refund_basis: "=cancellation_refund_basis", admin_fee_usd: "=cancellation_admin_fee_usd", transfer_fee_usd: "=transfer_fee_usd"}
        Parts & Labor Protection Plan: {window_days: "=renewal_window_days", notice_days: "=non_renewal_notice_days", escalation_pct: "=renewal_price_escalation_pct", refund_basis: "=cancellation_refund_basis", admin_fee_usd: "=cancellation_admin_fee_usd", transfer_fee_usd: "=transfer_fee_usd"}
        Compressor Coverage Plan: {window_days: "=renewal_window_days", notice_days: "=non_renewal_notice_days", escalation_pct: "=renewal_price_escalation_pct", refund_basis: "=cancellation_refund_basis", admin_fee_usd: "=cancellation_admin_fee_usd", transfer_fee_usd: "=transfer_fee_usd"}
        Major Component Protection Plan: {window_days: "=renewal_window_days", notice_days: "=non_renewal_notice_days", escalation_pct: "=renewal_price_escalation_pct", refund_basis: "=cancellation_refund_basis", admin_fee_usd: "=cancellation_admin_fee_usd", transfer_fee_usd: "=transfer_fee_usd"}
        Total Equipment Protection Plan: {window_days: "=renewal_window_days", notice_days: "=non_renewal_notice_days", escalation_pct: "=renewal_price_escalation_pct", refund_basis: "=cancellation_refund_basis", admin_fee_usd: "=cancellation_admin_fee_usd", transfer_fee_usd: "=transfer_fee_usd"}

  - id: warranty_portfolio_interaction
    subject: [warranty_claim_adjudicated, warranty_plan_quoted]
    rule: >-
      Warranty cover sits behind the rest of the portfolio rather than beside it. Where the failed unit is
      inside the contractor's warranty on a completed retrofit project, that project warranty pays first and
      this plan pays nothing, because the owner is never paid twice for one failure. Where the unit sits on a
      maintenance agreement whose tier covers the same repair, the maintenance allowance is drawn first and
      this plan pays only what the allowance did not absorb. The labor of a covered claim is performed under
      the maintenance agreement where one is in force and under the demand service program where it is not,
      and in either case the plan pays at its own covered labor rate rather than at the rate the performing
      program would charge. A tier that requires maintenance loses its cover when the maintenance agreement
      lapses, which is why such a plan is never quoted to a building whose agreement is already expired.
    eligibility:
      - id: project_warranty_pays_first
        applies_to: [warranty_claim_adjudicated]
        kind: authorization
        condition: Where the failed unit is inside the contractor's warranty on a completed retrofit project, that project warranty pays first and this plan pays nothing, because the owner is never paid twice for one failure.
        evidence_fields: [retrofit_projects.site_id, retrofit_projects.warranty_end_date, retrofit_projects.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [retrofit_projects.site_id]
          action_bindings:
            retrofit_projects.site_id: site_id
    params:
      per_tier:
        Manufacturer Warranty Registration: {labor_rate_usd: "=labor_rate_covered_usd", maintenance_required: "=maintenance_agreement_required"}
        Parts Protection Plan: {labor_rate_usd: "=labor_rate_covered_usd", maintenance_required: "=maintenance_agreement_required"}
        Parts & Labor Protection Plan: {labor_rate_usd: "=labor_rate_covered_usd", maintenance_required: "=maintenance_agreement_required"}
        Compressor Coverage Plan: {labor_rate_usd: "=labor_rate_covered_usd", maintenance_required: "=maintenance_agreement_required"}
        Major Component Protection Plan: {labor_rate_usd: "=labor_rate_covered_usd", maintenance_required: "=maintenance_agreement_required"}
        Total Equipment Protection Plan: {labor_rate_usd: "=labor_rate_covered_usd", maintenance_required: "=maintenance_agreement_required"}
