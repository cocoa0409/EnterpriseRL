# Product charter: Extended Equipment Warranty Plans (category key: warranty)
category: warranty
display_name: Extended Equipment Warranty Plans

binding:
  holding_table: warranty_plans
  event_tables: [warranty_events]
  intake_tables: [warranty_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields:
    claim_allowance_remaining: claim_allowance
    balance_due: warranty_balance

lifecycle:
  states: [quoted, active, suspended, pending_renewal, expired, cancelled, declined]
  transitions:
    - {from: quoted, to: active, by: user, means: The owner accepts the plan quote and cover begins.}
    - {from: quoted, to: declined, by: user, means: The owner declines the plan quote.}
    - {from: active, to: pending_renewal, by: system, means: The renewal window opens ahead of the cover end.}
    - {from: active, to: suspended, by: agent, means: Cover is suspended for non-payment or for a lapsed maintenance agreement.}
    - {from: pending_renewal, to: suspended, by: agent, means: Cover is suspended during the renewal window.}
    - {from: suspended, to: active, by: agent, means: Cover is reinstated once the arrears or the maintenance lapse are put right.}
    - {from: pending_renewal, to: active, by: agent, means: The plan is renewed for a further term.}
    - {from: pending_renewal, to: expired, by: system, means: The cover term ends without renewal.}
    - {from: active, to: cancelled, by: system, means: A confirmed cancellation notice reaches its effective date.}
    - {from: suspended, to: cancelled, by: agent, means: Suspended cover is closed out and any refund is settled.}

accounts:
  - key: claim_allowance
    unit: USD
    meaning: The claim value the plan can still pay over the current term; credited at activation and renewal, drawn by each approved claim.
  - key: warranty_balance
    unit: USD
    meaning: The amount the owner currently owes under the warranty plan; premiums, deductibles and surcharges increase it, payments and refunds reduce it.

parameter_schema:
  coverage_term_months: Months of cover one plan term runs for (integer, calendar months).
  max_equipment_age_months_at_enrollment: Oldest a unit may be at enrollment, from its install date (integer, calendar months).
  waiting_period_days: Days after the plan starts before a claim may be filed (integer, calendar days).
  parts_covered: Whether replacement parts are covered (boolean).
  labor_covered: Whether the labor to fit a covered part is covered (boolean).
  compressor_covered: Whether compressor replacement is covered (boolean).
  heat_exchanger_covered: Whether heat exchanger replacement is covered (boolean).
  coil_covered: Whether evaporator and condenser coil replacement is covered (boolean).
  control_board_covered: Whether control boards and sensors are covered (boolean).
  motor_covered: Whether fan and blower motors are covered (boolean).
  refrigerant_covered_lbs: Pounds of refrigerant covered per claim (integer, lbs).
  refrigerant_rate_usd_per_lb: Rate billed for refrigerant beyond the covered pounds (USD per pound).
  crane_rigging_covered: Whether crane and rigging for a covered replacement is covered (boolean).
  diagnostic_covered: Whether the diagnostic call that finds the covered fault is covered (boolean).
  deductible_usd: Deductible billed to the owner per approved claim (USD).
  claim_cap_per_claim_usd: Ceiling on what one approved claim pays (USD).
  claim_cap_per_term_usd: Ceiling on what the plan pays over one term (USD).
  claims_included_per_term: Number of approved claims included per term before the per-claim surcharge applies (integer).
  extra_claim_surcharge_usd: Surcharge per approved claim beyond the included claims (USD).
  labor_rate_covered_usd: Labor rate the plan pays for covered work (USD per hour).
  after_hours_claims_covered: Whether a covered repair performed outside regular hours is covered without premium (boolean).
  replacement_allowance_usd: Allowance toward a new unit where a covered unit is condemned (USD).
  condemnation_threshold_pct: Share of replacement cost a covered repair must reach for the unit to be condemned (percent).
  maintenance_agreement_required: Whether an active maintenance agreement at the site is required to keep the cover (boolean).
  proof_of_maintenance_months: Months within which the last documented maintenance visit must fall for a claim to be paid (integer, calendar months).
  claim_filing_days: Days after the fault is found within which a claim must be filed (integer, calendar days).
  claim_adjudication_business_days: Business days to adjudicate a filed claim (integer, business days).
  prior_authorization_required_above_usd: Repair value above which the claim must be authorised before work starts (USD).
  part_shipping_business_days: Business days to ship an approved covered part (integer, business days).
  expedited_shipping_fee_usd: Fee to expedite an approved part (USD).
  loaner_equipment_included: Whether temporary equipment is provided while a covered unit is down (boolean).
  loaner_daily_usd: Daily charge for temporary equipment where it is not included (USD per day).
  transferable_on_sale: Whether the plan transfers to a new building owner (boolean).
  transfer_fee_usd: Fee to transfer the plan to a new owner (USD).
  coverage_per_unit_price_usd: Annual price per covered unit by equipment type, a mapping equipment type -> USD.
  min_units_required: Minimum units enrolled for the plan to be written (integer).
  max_units_per_plan: Largest number of units one plan may carry (integer).
  inspection_required_at_enrollment: Whether a condition inspection of each unit is required at enrollment (boolean).
  inspection_fee_per_unit_usd: Fee for the enrollment condition inspection per unit (USD).
  billing_frequency: How the plan price is invoiced (enum annual, semiannual, quarterly, monthly).
  payment_terms_days: Days from invoice date to due date (integer, calendar days).
  late_fee_pct_per_month: Late fee on an overdue invoice per month (percent per month).
  suspension_after_days_past_due: Days past due after which cover is suspended (integer, calendar days).
  reinstatement_fee_usd: Fee charged when suspended cover is reinstated (USD).
  reinstatement_window_days: Days after suspension within which cover may be reinstated without a fresh inspection (integer, calendar days).
  auto_renew: Whether the plan renews automatically at term end (boolean).
  renewal_window_days: Days before term end at which the renewal window opens (integer, calendar days).
  non_renewal_notice_days: Days before term end by which a non-renewal notice must be received (integer, calendar days).
  renewal_price_escalation_pct: Escalation applied to the plan price at renewal (percent).
  renewal_reinspection_required_months: Plan age in months beyond which a renewal needs a fresh condition inspection (integer, calendar months).
  cancellation_notice_days: Days of written notice before a cancellation takes effect (integer, calendar days).
  cancellation_refund_basis: How an unused term is refunded on cancellation (enum none, pro_rata, short_rate).
  cancellation_admin_fee_usd: Administration fee deducted from a cancellation refund (USD).
  claim_denial_appeal_days: Days after a denial within which the owner may appeal (integer, calendar days).
  pre_existing_condition_excluded: Whether faults present before enrollment are excluded (boolean).
  abuse_and_misuse_excluded: Whether damage from misuse, flood, fire or power events is excluded (boolean).

