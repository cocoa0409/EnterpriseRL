events:
  - type: controls_plan_quoted
    target: controls_plans
    mutation: create
    meaning: An automation service plan is quoted for a site's controls system and the plan record is opened.
    grain: One row per plan quoted for one site at one tier.
    fields:
      plan_id: The reference number of this plan record.
      customer_id: The building owner quoted.
      site_id: The building whose controls system the plan covers.
      variant_name: The plan tier quoted, written as its official full name.
      status: The lifecycle status, pinned to quoted when the plan is opened.
      quote_date: The day the plan quote was issued.
      points_covered: The number of monitored points the quote covers.
      panels_covered: The number of controls panels the quote covers.
      annual_plan_fee_usd: The annual plan fee quoted.
      controller_generation: The model year of the oldest controller on the site's system.
    triggers: []
  - type: controls_plan_activated
    target: controls_plans
    mutation: {transition: {from: quoted, to: active}}
    meaning: The customer accepts the quote and the plan takes effect.
    grain: One row per plan, changed once when it takes effect.
    fields:
      status: The lifecycle status, moved to active.
      accepted_date: The day the customer accepted the quote.
      term_start_date: The first day of the plan term.
      term_end_date: The last day of the plan term.
    triggers:
      - event: controls:controls_support_hours_credited
        map: {plan_id: plan_id, customer_id: customer_id}
      - event: controls:controls_alarm_allowance_credited
        map: {plan_id: plan_id, customer_id: customer_id}
      - event: controls:controls_invoice_charged
        map: {plan_id: plan_id, customer_id: customer_id, charge_type: activation_fee}
  - type: controls_quote_declined
    target: controls_plans
    mutation: {transition: {from: quoted, to: declined}}
    meaning: The customer declines the plan quote.
    grain: One row per quote, changed once when it is declined.
    fields:
      status: The lifecycle status, moved to declined.
      cancellation_date: The day the quote was declined.
      cancellation_reason: Why the quote was declined.
    triggers: []
  - type: controls_renewal_window_opened
    target: controls_plans
    mutation: {transition: {from: active, to: pending_renewal}}
    meaning: The plan enters its renewal window and the renewal quote goes out.
    grain: One row per plan, changed once per term when the renewal window opens.
    fields:
      status: The lifecycle status, moved to pending_renewal.
      renewal_notice_date: The day the renewal window opened.
    triggers: []
  - type: controls_plan_renewed
    target: controls_plans
    mutation: {transition: {from: pending_renewal, to: active}}
    meaning: The plan is renewed for a further term at the escalated fee and the trued-up point count.
    grain: One row per plan, changed once per renewal.
    fields:
      status: The lifecycle status, moved back to active.
      term_start_date: The first day of the renewed term.
      term_end_date: The last day of the renewed term.
      annual_plan_fee_usd: The annual plan fee for the renewed term.
      points_covered: The point count carried into the renewed term.
    triggers:
      - event: controls:controls_support_hours_credited
        map: {plan_id: plan_id, customer_id: customer_id}
      - event: controls:controls_alarm_allowance_credited
        map: {plan_id: plan_id, customer_id: customer_id}
  - type: controls_plan_suspended
    target: controls_plans
    mutation: {transition: [{from: active, to: suspended}, {from: pending_renewal, to: suspended}]}
    meaning: Remote access and alarm monitoring are withdrawn because the plan is in arrears.
    grain: One row per plan, changed once per suspension.
    fields:
      status: The lifecycle status, moved to suspended.
      suspension_date: The day monitoring and remote access were withdrawn.
    triggers: []
  - type: controls_plan_reinstated
    target: controls_plans
    mutation: {transition: [{from: suspended, to: active}, {from: expired, to: active}]}
    meaning: Monitoring and remote access are restored on a suspended or lapsed plan.
    grain: One row per plan, changed once per reinstatement.
    fields:
      status: The lifecycle status, moved back to active.
      reinstatement_date: The day monitoring and remote access were restored.
      term_end_date: The last day of the term the plan is restored into.
    triggers:
      - event: controls:controls_invoice_charged
        map: {plan_id: plan_id, customer_id: customer_id, charge_type: reinstatement}
  - type: controls_plan_expired
    target: controls_plans
    mutation: {transition: {from: pending_renewal, to: expired}}
    meaning: The plan term ends without a renewal and monitoring stops.
    grain: One row per plan, changed once when the term lapses.
    fields:
      status: The lifecycle status, moved to expired.
      term_end_date: The last day of the term that has just ended.
    triggers: []
  - type: controls_plan_cancelled
    target: controls_plans
    mutation: {transition: [{from: active, to: cancelled}, {from: suspended, to: cancelled}]}
    meaning: The plan is ended before its term end.
    grain: One row per plan, changed once when it is ended early.
    fields:
      status: The lifecycle status, moved to cancelled.
      cancellation_date: The day the cancellation was recorded.
      termination_effective_date: The day monitoring and support actually stop.
      cancellation_reason: Why the plan was ended.
    triggers:
      - event: controls:controls_invoice_charged
        when: {cancellation_reason: customer_convenience}
        map: {plan_id: plan_id, customer_id: customer_id, charge_type: early_cancellation}
  - type: controls_coverage_updated
    target: controls_plans
    mutation: update
    meaning: The covered point or panel count of a live plan changes, most often at a licence true-up.
    grain: One row per plan, changed once per accepted coverage change.
    fields:
      points_covered: The covered point count after the change.
      panels_covered: The covered panel count after the change.
      annual_plan_fee_usd: The annual plan fee after the change.
      last_change_type: What kind of coverage change was applied.
      last_change_date: The day the change took effect.
    triggers:
      - event: controls:controls_invoice_charged
        when: {last_change_type: points_added}
        map: {plan_id: plan_id, customer_id: customer_id, charge_type: point_addition}
  - type: controls_ticket_opened
    target: controls_events
    meaning: A controls question or fault is logged with the help desk.
    grain: One row per support ticket opened on one plan.
    distinguish_by: [ticket_ref, opened_timestamp, request_class]
    fields:
      plan_id: The plan the ticket is logged under.
      customer_id: The building owner who logged it.
      event_type: The event family of this row.
      site_id: The building the ticket concerns.
      ticket_ref: The ticket number.
      request_class: What kind of controls work was asked for.
      opened_timestamp: The moment the ticket was logged.
      channel: How the request reached the desk.
    triggers: []
  - type: controls_ticket_resolved
    target: controls_events
    account: support_hour_pool
    direction: out
    meaning: A support ticket is closed and its logged hours are drawn from the plan's support pool.
    grain: One row per resolved support ticket on one plan.
    distinguish_by: [ticket_ref, resolved_date, support_hours, resolution_method]
    fields:
      plan_id: The plan the ticket was resolved under.
      customer_id: The building owner the ticket was resolved for.
      event_type: The event family of this row.
      site_id: The building the ticket concerned.
      ticket_ref: The ticket number.
      resolved_date: The day the ticket was closed.
      support_hours: The support hours logged against the ticket.
      resolution_method: Whether the fault was cleared remotely, on site, or by the customer.
      request_class: What kind of controls work was carried out.
    triggers:
      - event: controls:controls_invoice_charged
        when: {resolution_method: onsite}
        map: {plan_id: plan_id, customer_id: customer_id, ticket_ref: ticket_ref, charge_type: onsite_labor}
  - type: controls_support_hours_credited
    target: controls_events
    account: support_hour_pool
    direction: in
    meaning: The plan year's included support hours are credited at activation or renewal.
    grain: One row per plan year crediting of included support hours.
    distinguish_by: [billing_period, support_hours]
    fields:
      plan_id: The plan the hours are credited to.
      customer_id: The building owner the plan belongs to.
      event_type: The event family of this row.
      billing_period: The plan year the credit belongs to.
      support_hours: The support hours credited for the year.
    triggers: []
  - type: controls_alarm_raised
    target: controls_events
    meaning: The controls system raises a monitored alarm and the monitoring desk records it.
    grain: One row per alarm raised at a monitored site.
    distinguish_by: [alarm_ref, raised_timestamp, alarm_class, equipment_tag]
    fields:
      plan_id: The plan the monitored site is covered by.
      customer_id: The building owner the site belongs to.
      event_type: The event family of this row.
      site_id: The building the alarm came from.
      alarm_ref: The alarm reference number.
      alarm_class: How serious the alarm is.
      equipment_tag: The unit the alarm came from.
      raised_timestamp: The moment the alarm was raised.
      acknowledged_timestamp: The moment the monitoring desk acknowledged the alarm.
    triggers:
      - event: controls:controls_alarm_response_used
        when: {alarm_class: [critical, urgent]}
        map: {plan_id: plan_id, customer_id: customer_id, alarm_ref: alarm_ref}
  - type: controls_alarm_response_used
    target: controls_events
    account: alarm_response_allowance
    direction: out
    meaning: The monitoring desk acts on an alarm, consuming one of the plan year's included responses.
    grain: One row per alarm the monitoring desk acted on.
    distinguish_by: [alarm_ref, used_date, overage_applied]
    fields:
      plan_id: The plan the response is counted against.
      customer_id: The building owner the plan belongs to.
      event_type: The event family of this row.
      alarm_ref: The alarm the desk acted on.
      used_date: The day the desk acted on the alarm.
      overage_applied: Whether the response ran past the included allowance.
    triggers:
      - event: controls:controls_invoice_charged
        when: {overage_applied: applied}
        map: {plan_id: plan_id, customer_id: customer_id, charge_type: alarm_overage}
  - type: controls_alarm_allowance_credited
    target: controls_events
    account: alarm_response_allowance
    direction: in
    meaning: The plan year's included alarm responses are credited at activation or renewal.
    grain: One row per plan year crediting of included alarm responses.
    distinguish_by: [billing_period, included_responses]
    fields:
      plan_id: The plan the responses are credited to.
      customer_id: The building owner the plan belongs to.
      event_type: The event family of this row.
      billing_period: The plan year the credit belongs to.
      included_responses: The alarm responses credited for the year.
    triggers: []
  - type: controls_software_update_applied
    target: controls_events
    meaning: A software update, upgrade or security patch is applied to the covered controls system.
    grain: One row per update applied to one plan's system.
    distinguish_by: [ticket_ref, applied_date, update_class, software_version]
    fields:
      plan_id: The plan whose system was updated.
      customer_id: The building owner the system belongs to.
      event_type: The event family of this row.
      site_id: The building whose system was updated.
      ticket_ref: The ticket the update was carried out under.
      update_class: Whether this was a security patch, a minor update or a major upgrade.
      software_version: The version the system now runs.
      applied_date: The day the update was applied.
      support_hours: The hours the update took.
    triggers:
      - event: controls:controls_invoice_charged
        when: {update_class: major_upgrade}
        map: {plan_id: plan_id, customer_id: customer_id, ticket_ref: ticket_ref, charge_type: upgrade_labor}
  - type: controls_invoice_charged
    target: controls_events
    account: controls_balance
    direction: in
    meaning: A plan fee or an extra controls service is invoiced to the building owner.
    grain: One row per charge line invoiced on one plan.
    distinguish_by: [invoice_ref, charge_type, amount_usd, ticket_ref]
    fields:
      plan_id: The plan the charge belongs to.
      customer_id: The building owner invoiced.
      event_type: The event family of this row.
      invoice_ref: The invoice the charge was billed on.
      charge_type: Which kind of charge this line is.
      amount_usd: The amount charged.
      ticket_ref: The ticket the charge arises from, where there is one.
      billing_period: The period the charge covers.
      due_date: The day the invoice falls due.
    triggers: []
  - type: controls_payment_received
    target: controls_events
    account: controls_balance
    direction: out
    meaning: A payment from the building owner is applied to the automation plan balance.
    grain: One row per payment applied to one invoice.
    distinguish_by: [invoice_ref, received_date, amount_usd, payment_method]
    fields:
      plan_id: The plan the payment is applied to.
      customer_id: The building owner who paid.
      event_type: The event family of this row.
      invoice_ref: The invoice the payment is applied to.
      amount_usd: The amount paid.
      payment_method: How the payment was made.
      received_date: The day the payment was received.
    triggers: []
  - type: controls_credit_issued
    target: controls_events
    account: controls_balance
    direction: out
    meaning: A credit is issued against the automation plan balance.
    grain: One row per credit issued on one plan.
    distinguish_by: [invoice_ref, credit_reason, amount_usd, alarm_ref]
    fields:
      plan_id: The plan credited.
      customer_id: The building owner credited.
      event_type: The event family of this row.
      invoice_ref: The invoice the credit is applied against.
      credit_reason: Why the credit was issued.
      amount_usd: The amount credited.
      alarm_ref: The alarm the credit arises from, where it arises from one.
      billing_period: The period the credit falls in.
    triggers: []

measures:
  - id: controls_msr_support_hours_used_year
    window: The current plan year, from term_start_date through term_end_date inclusive.
    measure: Sum of support_hours over controls_ticket_resolved rows on this plan whose resolved_date falls in the window.
  - id: controls_msr_alarm_responses_used_year
    window: The current plan year, from term_start_date through term_end_date inclusive.
    measure: Count of controls_alarm_response_used rows on this plan whose used_date falls in the window.
  - id: controls_msr_schedule_changes_this_month
    window: The calendar month the handling day falls in, from its first day through the handling day.
    measure: Count of controls_ticket_resolved rows on this plan whose request_class is schedule_change and whose resolved_date falls in the window.

policies:
  - id: controls_agg_multi_holding
    subject: [controls_plan_quoted]
    rule: >-
      A building owner may hold several automation service plans, one for each building whose controls system
      the company supports, and the portfolio is counted whenever a plan is priced or a shared entitlement is
      drawn. A second plan is not quoted for a site that already holds a plan in quoted, active,
      pending_renewal or suspended status; the covered points of that site are amended instead. Plans in
      expired, cancelled or declined status do not block a fresh quote. Support hours, alarm responses and
      balances are held per plan and are never pooled across sites, even where one owner holds plans at every
      building in a campus, because each plan covers one controls database.
    eligibility:
      - id: one_live_plan_per_site
        applies_to: [controls_plan_quoted]
        kind: dedup
        condition: A second plan is not quoted for a site that already holds a plan in quoted, active, pending_renewal or suspended status; the covered points of that site are amended instead.
        evidence_fields: [controls_plans.site_id, controls_plans.status, controls_plans.plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [controls_plans.site_id]
          action_bindings:
            controls_plans.site_id: site_id
        dedup_contract:
          table: controls_plans
          mode: separate_record
          object_bindings: {site_id: site_id}
          duplicate_filters: {status: [quoted, active, pending_renewal, suspended]}
          distinct_fields: [variant_name, quote_date]
    params:
      max_per_customer: null

  - id: controls_agg_portfolio_point_pricing
    subject: [controls_plan_quoted, controls_coverage_updated, controls_plan_renewed]
    rule: >-
      Where one owner holds plans at several buildings, the licence position is settled across the portfolio
      before any single plan is priced. The owner's covered points are the sum of points_covered over their
      plans standing in active or pending_renewal status, the plan being priced included; plans in quoted,
      suspended, expired, cancelled or declined status are not counted. The per-point licence fee of each
      plan is read from that plan's own tier, never from the portfolio's largest tier, and the portfolio count
      decides only which volume step the licence sits on. Points beyond a plan's covered maximum are charged
      the tier's point overage fee for the remainder of the plan year, prorated by whole months, and they are
      added to the covered count at the next true-up rather than immediately.
    eligibility: []
    params:
      volume_steps: Portfolio point bands are 0 to 2000 points, 2001 to 8000 points, and above 8000 points.
      per_tier:
        Controls Help Desk Subscription: {points_max: "=points_covered_max", overage_fee_usd: "=point_overage_fee_usd", licence_fee_usd: "=license_fee_per_point_usd"}
        Alarm Monitoring Plan: {points_max: "=points_covered_max", overage_fee_usd: "=point_overage_fee_usd", licence_fee_usd: "=license_fee_per_point_usd"}
        Scheduled Controls Service Plan: {points_max: "=points_covered_max", overage_fee_usd: "=point_overage_fee_usd", licence_fee_usd: "=license_fee_per_point_usd"}
        Software Assurance & Upgrade Plan: {points_max: "=points_covered_max", overage_fee_usd: "=point_overage_fee_usd", licence_fee_usd: "=license_fee_per_point_usd"}
        Remote Optimization Plan: {points_max: "=points_covered_max", overage_fee_usd: "=point_overage_fee_usd", licence_fee_usd: "=license_fee_per_point_usd"}
        Integrated Building Automation Partnership: {points_max: "=points_covered_max", overage_fee_usd: "=point_overage_fee_usd", licence_fee_usd: "=license_fee_per_point_usd"}
    formula:
      annual_fee_usd: "round(annual_plan_fee_usd + max(0, points_covered - points_covered_max) * point_overage_fee_usd + vpn_gateway_fee_usd, 2)"

  - id: controls_plan_qualification
    subject: [controls_plan_quoted, controls_quote_declined]
    rule: >-
      A plan tier is quoted only for a controls system it can actually support. No controller on the site's
      system may be older than the tier's oldest supported controller generation, read as the model year on
      the controller record. The site's protocols must be among those the tier supports, and a system carrying
      a protocol the tier does not support is quoted at a tier that does or the unsupported devices are left
      out of the covered count. A tier whose site survey requirement is set is quoted only when a controls
      site survey for that building is recorded as completed in the office records. A tier that is sold only
      alongside maintenance is quoted only where the same building carries a maintenance agreement in active
      or pending_renewal status. Where a site meets none of the tiers, the desk does not quote a plan at all
      and the system is offered a controls upgrade project instead.
    eligibility:
      - id: site_survey_completed
        applies_to: [controls_plan_quoted]
        kind: authorization
        condition: A tier whose site survey requirement is set is quoted only when a controls site survey for that building is recorded as completed in the office records.
        evidence_fields: [controls_requests.site_id, controls_requests.request_type, controls_requests.outcome]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [controls_requests.site_id]
          action_bindings:
            controls_requests.site_id: site_id
      - id: maintenance_agreement_at_site
        applies_to: [controls_plan_quoted]
        kind: state
        condition: A tier that is sold only alongside maintenance is quoted only where the same building carries a maintenance agreement in active or pending_renewal status.
        evidence_fields: [maintenance_agreements.status, maintenance_agreements.site_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [maintenance_agreements.site_id]
          action_bindings:
            maintenance_agreements.site_id: site_id
        state_contract:
          field: maintenance_agreements.status
          allowed: [active, pending_renewal]
    params:
      per_tier:
        Controls Help Desk Subscription: {min_generation: "=min_controller_generation", survey_required: "=site_survey_required", bundle_required: "=maintenance_bundle_required", survey_fee_usd: "=site_survey_fee_usd"}
        Alarm Monitoring Plan: {min_generation: "=min_controller_generation", survey_required: "=site_survey_required", bundle_required: "=maintenance_bundle_required", survey_fee_usd: "=site_survey_fee_usd"}
        Scheduled Controls Service Plan: {min_generation: "=min_controller_generation", survey_required: "=site_survey_required", bundle_required: "=maintenance_bundle_required", survey_fee_usd: "=site_survey_fee_usd"}
        Software Assurance & Upgrade Plan: {min_generation: "=min_controller_generation", survey_required: "=site_survey_required", bundle_required: "=maintenance_bundle_required", survey_fee_usd: "=site_survey_fee_usd"}
        Remote Optimization Plan: {min_generation: "=min_controller_generation", survey_required: "=site_survey_required", bundle_required: "=maintenance_bundle_required", survey_fee_usd: "=site_survey_fee_usd"}
        Integrated Building Automation Partnership: {min_generation: "=min_controller_generation", survey_required: "=site_survey_required", bundle_required: "=maintenance_bundle_required", survey_fee_usd: "=site_survey_fee_usd"}

  - id: controls_activation_and_entitlement
    subject: [controls_plan_activated, controls_support_hours_credited, controls_alarm_allowance_credited]
    rule: >-
      A plan takes effect only when the customer's written acceptance of the quote is recorded against it, and
      the activation fee is charged on the day it takes effect, less any survey fee already paid. At the start
      of each plan year the plan is credited with the tier's included support hours and included alarm
      responses; neither carries forward, and both are forfeited at the plan year end. The remote connection
      is commissioned before monitoring starts, and until it is commissioned the alarm allowance is held but
      not drawn. Where the tier includes no alarm monitoring, no alarm allowance is credited and alarms from
      that site reach nobody at the company, which the desk says plainly rather than implying the site is
      watched.
    eligibility:
      - id: written_acceptance_on_file
        applies_to: [controls_plan_activated]
        kind: authorization
        condition: A plan takes effect only when the customer's written acceptance of the quote is recorded against it, and the activation fee is charged on the day it takes effect, less any survey fee already paid.
        evidence_fields: [controls_requests.plan_id, controls_requests.request_type, controls_requests.outcome]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [controls_requests.plan_id]
          action_bindings:
            controls_requests.plan_id: plan_id
    params:
      per_tier:
        Controls Help Desk Subscription: {hours_credited: "=support_hours_included_per_year", responses_credited: "=alarm_responses_included_per_year", activation_fee_usd: "=activation_fee_usd"}
        Alarm Monitoring Plan: {hours_credited: "=support_hours_included_per_year", responses_credited: "=alarm_responses_included_per_year", activation_fee_usd: "=activation_fee_usd"}
        Scheduled Controls Service Plan: {hours_credited: "=support_hours_included_per_year", responses_credited: "=alarm_responses_included_per_year", activation_fee_usd: "=activation_fee_usd"}
        Software Assurance & Upgrade Plan: {hours_credited: "=support_hours_included_per_year", responses_credited: "=alarm_responses_included_per_year", activation_fee_usd: "=activation_fee_usd"}
        Remote Optimization Plan: {hours_credited: "=support_hours_included_per_year", responses_credited: "=alarm_responses_included_per_year", activation_fee_usd: "=activation_fee_usd"}
        Integrated Building Automation Partnership: {hours_credited: "=support_hours_included_per_year", responses_credited: "=alarm_responses_included_per_year", activation_fee_usd: "=activation_fee_usd"}

  - id: controls_support_handling
    subject: [controls_ticket_opened, controls_ticket_resolved]
    rule: >-
      A support ticket is taken only while the plan stands in active or pending_renewal status, because a
      suspended plan has no remote connection to work through. Tickets are answered inside the tier's phone
      response target during the tier's help desk hours, and a ticket logged outside those hours is answered
      when the desk next opens unless the tier answers around the clock. Where the tier includes a remote fix
      attempt, the desk attempts the fix remotely before any visit is offered; where it does not, the ticket
      is quoted as a controls site visit from the start. The hours logged against a resolved ticket are drawn
      from the plan year's support pool, and once the pool is exhausted further hours are billed at the tier's
      support hour rate, with on-site hours billed at the controls technician rate instead. Schedule changes
      and setpoint changes are carried out free up to the tier's monthly counts, counted over the calendar
      month; beyond them each schedule change carries the tier's fee, and graphics edits are counted over the
      plan year against the tier's included edits.
    eligibility:
      - id: live_plan_for_support
        applies_to: [controls_ticket_opened]
        kind: state
        condition: A support ticket is taken only while the plan stands in active or pending_renewal status, because a suspended plan has no remote connection to work through.
        evidence_fields: [controls_plans.status, controls_plans.plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [controls_plans.plan_id]
          action_bindings:
            controls_plans.plan_id: plan_id
        state_contract:
          field: controls_plans.status
          allowed: [active, pending_renewal]
    measures: [controls_msr_support_hours_used_year, controls_msr_schedule_changes_this_month]
    params:
      per_tier:
        Controls Help Desk Subscription: {hour_rate_usd: "=support_hour_rate_usd", onsite_rate_usd: "=controls_technician_rate_usd", schedule_changes: "=schedule_changes_included_per_month", schedule_fee_usd: "=schedule_change_fee_usd", graphics_edits: "=graphics_edits_included_per_year"}
        Alarm Monitoring Plan: {hour_rate_usd: "=support_hour_rate_usd", onsite_rate_usd: "=controls_technician_rate_usd", schedule_changes: "=schedule_changes_included_per_month", schedule_fee_usd: "=schedule_change_fee_usd", graphics_edits: "=graphics_edits_included_per_year"}
        Scheduled Controls Service Plan: {hour_rate_usd: "=support_hour_rate_usd", onsite_rate_usd: "=controls_technician_rate_usd", schedule_changes: "=schedule_changes_included_per_month", schedule_fee_usd: "=schedule_change_fee_usd", graphics_edits: "=graphics_edits_included_per_year"}
        Software Assurance & Upgrade Plan: {hour_rate_usd: "=support_hour_rate_usd", onsite_rate_usd: "=controls_technician_rate_usd", schedule_changes: "=schedule_changes_included_per_month", schedule_fee_usd: "=schedule_change_fee_usd", graphics_edits: "=graphics_edits_included_per_year"}
        Remote Optimization Plan: {hour_rate_usd: "=support_hour_rate_usd", onsite_rate_usd: "=controls_technician_rate_usd", schedule_changes: "=schedule_changes_included_per_month", schedule_fee_usd: "=schedule_change_fee_usd", graphics_edits: "=graphics_edits_included_per_year"}
        Integrated Building Automation Partnership: {hour_rate_usd: "=support_hour_rate_usd", onsite_rate_usd: "=controls_technician_rate_usd", schedule_changes: "=schedule_changes_included_per_month", schedule_fee_usd: "=schedule_change_fee_usd", graphics_edits: "=graphics_edits_included_per_year"}
    formula:
      overage_charge_usd: "round(max(0, support_hours - support_hour_pool) * support_hour_rate_usd, 2)"

  - id: controls_alarm_monitoring
    subject: [controls_alarm_raised, controls_alarm_response_used]
    rule: >-
      Alarms from a covered site are watched only where the tier includes monitoring, and only during the
      tier's monitoring hours. A critical or urgent alarm is acknowledged inside the tier's acknowledgement
      target, counted in elapsed minutes from the moment the alarm was raised, and the desk then either clears
      it remotely, calls the building contact, or dispatches, in that order. Each alarm the desk acts on
      consumes one of the plan year's included responses; alarms the system clears by itself and alarms the
      desk suppresses as nuisance consume none. Once the year's responses are used up, each further response
      carries the tier's overage fee. An after-hours call-out on a critical alarm is included only where the
      tier includes it; at every other tier the call-out is dispatched as demand service and billed at the
      demand rates. Repeated nuisance alarms are tuned out at no charge where the tier includes tuning, and
      where it does not, tuning is quoted as controls work.
    eligibility: []
    measures: [controls_msr_alarm_responses_used_year]
    params:
      per_tier:
        Controls Help Desk Subscription: {monitoring: "=alarm_monitoring_included", ack_minutes: "=alarm_acknowledge_minutes", responses: "=alarm_responses_included_per_year", overage_fee_usd: "=alarm_response_overage_fee_usd", call_out: "=critical_alarm_call_out_included"}
        Alarm Monitoring Plan: {monitoring: "=alarm_monitoring_included", ack_minutes: "=alarm_acknowledge_minutes", responses: "=alarm_responses_included_per_year", overage_fee_usd: "=alarm_response_overage_fee_usd", call_out: "=critical_alarm_call_out_included"}
        Scheduled Controls Service Plan: {monitoring: "=alarm_monitoring_included", ack_minutes: "=alarm_acknowledge_minutes", responses: "=alarm_responses_included_per_year", overage_fee_usd: "=alarm_response_overage_fee_usd", call_out: "=critical_alarm_call_out_included"}
        Software Assurance & Upgrade Plan: {monitoring: "=alarm_monitoring_included", ack_minutes: "=alarm_acknowledge_minutes", responses: "=alarm_responses_included_per_year", overage_fee_usd: "=alarm_response_overage_fee_usd", call_out: "=critical_alarm_call_out_included"}
        Remote Optimization Plan: {monitoring: "=alarm_monitoring_included", ack_minutes: "=alarm_acknowledge_minutes", responses: "=alarm_responses_included_per_year", overage_fee_usd: "=alarm_response_overage_fee_usd", call_out: "=critical_alarm_call_out_included"}
        Integrated Building Automation Partnership: {monitoring: "=alarm_monitoring_included", ack_minutes: "=alarm_acknowledge_minutes", responses: "=alarm_responses_included_per_year", overage_fee_usd: "=alarm_response_overage_fee_usd", call_out: "=critical_alarm_call_out_included"}

  - id: controls_software_and_security
    subject: [controls_software_update_applied]
    rule: >-
      Security patches published by the controls manufacturer are applied to covered controllers inside the
      tier's patch period, counted in calendar days from the day the patch was published, at no charge at
      every tier. Minor version updates are applied at no charge only where the tier includes them, and a
      major version upgrade is carried out at no labor charge only where the tier includes major upgrades;
      elsewhere the upgrade is quoted, with the tier's upgrade labor discount applied, and the manufacturer's
      licence cost is passed through unchanged. Software assurance, where the tier carries it, keeps the
      site's licence current with the manufacturer and lapses with the plan, so a plan that is cancelled
      leaves the licence frozen at its last covered version. A database backup is taken at the tier's
      frequency and kept for the tier's retention period, and a restore is carried out at no charge only
      where the tier includes restore service.
    eligibility: []
    params:
      per_tier:
        Controls Help Desk Subscription: {patch_days: "=cybersecurity_patch_days", minor: "=minor_version_updates_included", major: "=major_version_upgrades_included", upgrade_discount_pct: "=upgrade_labor_discount_pct", backup: "=database_backup_frequency", retention_months: "=backup_retention_months"}
        Alarm Monitoring Plan: {patch_days: "=cybersecurity_patch_days", minor: "=minor_version_updates_included", major: "=major_version_upgrades_included", upgrade_discount_pct: "=upgrade_labor_discount_pct", backup: "=database_backup_frequency", retention_months: "=backup_retention_months"}
        Scheduled Controls Service Plan: {patch_days: "=cybersecurity_patch_days", minor: "=minor_version_updates_included", major: "=major_version_upgrades_included", upgrade_discount_pct: "=upgrade_labor_discount_pct", backup: "=database_backup_frequency", retention_months: "=backup_retention_months"}
        Software Assurance & Upgrade Plan: {patch_days: "=cybersecurity_patch_days", minor: "=minor_version_updates_included", major: "=major_version_upgrades_included", upgrade_discount_pct: "=upgrade_labor_discount_pct", backup: "=database_backup_frequency", retention_months: "=backup_retention_months"}
        Remote Optimization Plan: {patch_days: "=cybersecurity_patch_days", minor: "=minor_version_updates_included", major: "=major_version_upgrades_included", upgrade_discount_pct: "=upgrade_labor_discount_pct", backup: "=database_backup_frequency", retention_months: "=backup_retention_months"}
        Integrated Building Automation Partnership: {patch_days: "=cybersecurity_patch_days", minor: "=minor_version_updates_included", major: "=major_version_upgrades_included", upgrade_discount_pct: "=upgrade_labor_discount_pct", backup: "=database_backup_frequency", retention_months: "=backup_retention_months"}

  - id: controls_billing_and_late_fee
    subject: [controls_invoice_charged, controls_payment_received, controls_credit_issued]
    rule: >-
      The annual plan fee is invoiced on the tier's billing frequency in equal instalments, with per-point
      licence fees and the gateway fee carried on the same invoice. Each invoice falls due the tier's payment
      term after the invoice date, counted in calendar days with the invoice day excluded and the due day
      included, and an invoice unpaid past its due day carries the tier's late fee for each month or part
      month it stays unpaid. Extra services — support hours beyond the pool, schedule and graphics work beyond
      the included counts, alarm response overages and quoted upgrade labor — are invoiced in the month they
      are performed rather than held to the year end. Credits for a missed acknowledgement target are applied
      to the next plan invoice. Payments are applied to the oldest unpaid invoice unless the owner names one.
    eligibility: []
    params:
      per_tier:
        Controls Help Desk Subscription: {frequency: "=billing_frequency", terms_days: "=payment_terms_days", late_fee_pct: "=late_fee_pct_per_month"}
        Alarm Monitoring Plan: {frequency: "=billing_frequency", terms_days: "=payment_terms_days", late_fee_pct: "=late_fee_pct_per_month"}
        Scheduled Controls Service Plan: {frequency: "=billing_frequency", terms_days: "=payment_terms_days", late_fee_pct: "=late_fee_pct_per_month"}
        Software Assurance & Upgrade Plan: {frequency: "=billing_frequency", terms_days: "=payment_terms_days", late_fee_pct: "=late_fee_pct_per_month"}
        Remote Optimization Plan: {frequency: "=billing_frequency", terms_days: "=payment_terms_days", late_fee_pct: "=late_fee_pct_per_month"}
        Integrated Building Automation Partnership: {frequency: "=billing_frequency", terms_days: "=payment_terms_days", late_fee_pct: "=late_fee_pct_per_month"}
    formula:
      late_fee_usd: "round(amount_usd * late_fee_pct_per_month / 100, 2)"

  - id: controls_suspension_and_reinstatement
    subject: [controls_plan_suspended, controls_plan_reinstated]
    rule: >-
      Remote access and alarm monitoring are withdrawn once an invoice stays unpaid beyond the tier's
      suspension period counted from the day the invoice fell due, counting calendar days with the due day
      excluded and the final day included. While a plan is suspended the site's alarms are not watched and no
      support ticket is taken, and the desk tells the caller so rather than logging a ticket that nobody will
      work. Access and monitoring are restored when the arrears are settled in full and the tier's
      reinstatement fee is charged; the support pool and alarm allowance are not topped up on reinstatement,
      because the plan year's credit was made once. A plan that lapsed at its term end may be restarted
      without a fresh site survey only inside the tier's restart window counted forward in calendar days from
      the term end date, the end day excluded and the final day included; past that the system is surveyed
      again before any plan is quoted.
    eligibility:
      - id: arrears_beyond_suspension_period
        applies_to: [controls_plan_suspended]
        kind: time
        condition: Remote access and alarm monitoring are withdrawn once an invoice stays unpaid beyond the tier's suspension period counted from the day the invoice fell due, counting calendar days with the due day excluded and the final day included.
        evidence_fields: [controls_events.due_date, controls_events.invoice_ref, controls_events.amount_usd]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [controls_events.invoice_ref]
          action_bindings:
            controls_events.invoice_ref: invoice_ref
        temporal_basis:
          clock: frozen_time
          anchor_event: the day the invoice fell due
          anchor_source: controls_events.due_date
          relation: not_before
          duration_source: variants.suspension_after_days_past_due
          unit: calendar_days
          counting_rule: counting calendar days with the due day excluded and the final day included
          boundary: inclusive
      - id: restart_inside_window
        applies_to: [controls_plan_reinstated]
        kind: time
        condition: A plan that lapsed at its term end may be restarted without a fresh site survey only inside the tier's restart window counted forward in calendar days from the term end date, the end day excluded and the final day included; past that the system is surveyed again before any plan is quoted.
        evidence_fields: [controls_plans.term_end_date, controls_plans.plan_id, controls_plans.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [controls_plans.plan_id]
          action_bindings:
            controls_plans.plan_id: plan_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the term end date
          anchor_source: controls_plans.term_end_date
          relation: not_after
          duration_source: variants.restart_window_days
          unit: calendar_days
          counting_rule: counted forward in calendar days from the term end date, the end day excluded and the final day included
          boundary: inclusive
    params:
      per_tier:
        Controls Help Desk Subscription: {suspension_days: "=suspension_after_days_past_due", reinstatement_fee_usd: "=reinstatement_fee_usd", restart_days: "=restart_window_days"}
        Alarm Monitoring Plan: {suspension_days: "=suspension_after_days_past_due", reinstatement_fee_usd: "=reinstatement_fee_usd", restart_days: "=restart_window_days"}
        Scheduled Controls Service Plan: {suspension_days: "=suspension_after_days_past_due", reinstatement_fee_usd: "=reinstatement_fee_usd", restart_days: "=restart_window_days"}
        Software Assurance & Upgrade Plan: {suspension_days: "=suspension_after_days_past_due", reinstatement_fee_usd: "=reinstatement_fee_usd", restart_days: "=restart_window_days"}
        Remote Optimization Plan: {suspension_days: "=suspension_after_days_past_due", reinstatement_fee_usd: "=reinstatement_fee_usd", restart_days: "=restart_window_days"}
        Integrated Building Automation Partnership: {suspension_days: "=suspension_after_days_past_due", reinstatement_fee_usd: "=reinstatement_fee_usd", restart_days: "=restart_window_days"}

  - id: controls_renewal_and_cancellation
    subject: [controls_renewal_window_opened, controls_plan_renewed, controls_plan_expired, controls_plan_cancelled]
    rule: >-
      The renewal window opens the tier's renewal period before the term end date, and the renewal quote
      carries the escalated fee and the trued-up point count. Where the tier renews automatically the plan
      renews at the term end unless a non-renewal notice was received by the tier's notice deadline, counted
      back in calendar days from the term end date with the deadline day counting as timely; the top tier does
      not renew automatically and ends unless a renewal acceptance is on file for this plan. A customer may
      cancel early on the tier's written notice period, and the tier's early cancellation rate is applied to
      the unbilled remainder of the term. Cancellation stops monitoring on the effective day, and the owner is
      told plainly that alarms will then reach nobody. A plan that simply expires carries no cancellation fee,
      and the site's controls database backup is retained for the tier's retention period after the plan ends.
      The notice period is counted in calendar days from the day the written notice was received, the
      notice day excluded and the final day included.
    eligibility:
      - id: renewal_acceptance_on_file
        applies_to: [controls_plan_renewed]
        kind: authorization
        condition: the top tier does not renew automatically and ends unless a renewal acceptance is on file for this plan
        evidence_fields: [controls_requests.plan_id, controls_requests.request_type, controls_requests.outcome]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [controls_requests.plan_id]
          action_bindings:
            controls_requests.plan_id: plan_id
      - id: cancellation_notice_period
        applies_to: [controls_plan_cancelled]
        kind: time
        condition: A customer may cancel early on the tier's written notice period, and the tier's early cancellation rate is applied to the unbilled remainder of the term.
        evidence_fields: [controls_requests.notice_date, controls_requests.plan_id, controls_requests.request_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [controls_requests.plan_id]
          action_bindings:
            controls_requests.plan_id: plan_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the tier's written notice period
          anchor_source: controls_requests.notice_date
          relation: not_before
          duration_source: variants.cancellation_notice_days
          unit: calendar_days
          counting_rule: counted in calendar days from the day the written notice was received, the notice day excluded and the final day included
          boundary: inclusive
    params:
      per_tier:
        Controls Help Desk Subscription: {window_days: "=renewal_window_days", notice_days: "=non_renewal_notice_days", escalation_pct: "=annual_escalation_pct", cancel_notice_days: "=cancellation_notice_days", cancel_fee_pct: "=early_cancellation_fee_pct"}
        Alarm Monitoring Plan: {window_days: "=renewal_window_days", notice_days: "=non_renewal_notice_days", escalation_pct: "=annual_escalation_pct", cancel_notice_days: "=cancellation_notice_days", cancel_fee_pct: "=early_cancellation_fee_pct"}
        Scheduled Controls Service Plan: {window_days: "=renewal_window_days", notice_days: "=non_renewal_notice_days", escalation_pct: "=annual_escalation_pct", cancel_notice_days: "=cancellation_notice_days", cancel_fee_pct: "=early_cancellation_fee_pct"}
        Software Assurance & Upgrade Plan: {window_days: "=renewal_window_days", notice_days: "=non_renewal_notice_days", escalation_pct: "=annual_escalation_pct", cancel_notice_days: "=cancellation_notice_days", cancel_fee_pct: "=early_cancellation_fee_pct"}
        Remote Optimization Plan: {window_days: "=renewal_window_days", notice_days: "=non_renewal_notice_days", escalation_pct: "=annual_escalation_pct", cancel_notice_days: "=cancellation_notice_days", cancel_fee_pct: "=early_cancellation_fee_pct"}
        Integrated Building Automation Partnership: {window_days: "=renewal_window_days", notice_days: "=non_renewal_notice_days", escalation_pct: "=annual_escalation_pct", cancel_notice_days: "=cancellation_notice_days", cancel_fee_pct: "=early_cancellation_fee_pct"}

  - id: controls_portfolio_interaction
    subject: [controls_plan_quoted, controls_ticket_resolved, controls_invoice_charged]
    rule: >-
      The automation plan sits alongside the rest of the building's cover and the two are read together. Where
      the site holds a maintenance agreement whose tier includes remote monitoring, the alarm monitoring of
      this plan is not billed a second time and the maintenance bundle credit is applied against the
      maintenance price rather than here. Where an energy monitoring subscription draws its data from the same
      controls system, the point licence is counted once and carried on this plan, and the energy
      subscription is not charged per point for the same points. A controls fault found during a maintenance
      visit is logged as a ticket on this plan and drawn from its support pool, not billed as maintenance
      work, while mechanical work found during a controls ticket is passed to the maintenance agreement or
      quoted as demand service. A site holding a controls upgrade project in progress does not hold an
      automation plan at the same time for the panels the project replaces, and the plan's coverage is amended
      at the project's close.
    eligibility:
      - id: energy_subscription_point_sharing
        applies_to: [controls_invoice_charged]
        kind: authorization
        condition: Where an energy monitoring subscription draws its data from the same controls system, the point licence is counted once and carried on this plan, and the energy subscription is not charged per point for the same points.
        evidence_fields: [energy_subscriptions.site_id, energy_subscriptions.status, energy_subscriptions.data_source]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [energy_subscriptions.site_id]
          action_bindings:
            energy_subscriptions.site_id: site_id
    params:
      per_tier:
        Controls Help Desk Subscription: {monitoring: "=alarm_monitoring_included", licence_fee_usd: "=license_fee_per_point_usd"}
        Alarm Monitoring Plan: {monitoring: "=alarm_monitoring_included", licence_fee_usd: "=license_fee_per_point_usd"}
        Scheduled Controls Service Plan: {monitoring: "=alarm_monitoring_included", licence_fee_usd: "=license_fee_per_point_usd"}
        Software Assurance & Upgrade Plan: {monitoring: "=alarm_monitoring_included", licence_fee_usd: "=license_fee_per_point_usd"}
        Remote Optimization Plan: {monitoring: "=alarm_monitoring_included", licence_fee_usd: "=license_fee_per_point_usd"}
        Integrated Building Automation Partnership: {monitoring: "=alarm_monitoring_included", licence_fee_usd: "=license_fee_per_point_usd"}


extended_policies:
  - id: controls_ext_support_overage_charge
    base_policy_refs: [controls_billing_and_late_fee, controls_portfolio_interaction, controls_support_handling]
    overwrite:
      - base_policy: controls_support_handling
        superseded_clause: >-
          The hours logged against a resolved ticket are drawn from the plan year's support pool, and once the
          pool is exhausted further hours are billed at the tier's support hour rate, with on-site hours billed
          at the controls technician rate instead.
        replaced_by: >-
          Hours logged against resolved tickets in the twelve months to the handling day beyond the included
          support hours standing to the plan's credit, after the on-site visit allowance, are billed as this rule
          works them out, at the rates the plan's records select rather than at the tier's support hour and
          controls technician rates alone.
      - base_policy: controls_billing_and_late_fee
        superseded_clause: >-
          Extra services — support hours beyond the pool, schedule and graphics work beyond the included counts,
          alarm response overages and quoted upgrade labor — are invoiced in the month they are performed rather
          than held to the year end.
        replaced_by: >-
          The support overage is raised as one charge at the handling day covering the twelve months to it rather
          than month by month, and is periodised to the calendar month in which it is raised.
    trigger: state_due
    subject: [controls_invoice_charged]
    computes: charge_amount_usd
    target_tool: charge_controls_support_overage_c0d5009e
    params:
      volume_step_deep_pct: 12
      volume_step_first_pct: 6
      bundled_discount_threshold_pct: 10
      bundled_step_pct: 8
      hours_per_onsite_visit: 4
      bundled_extra_visits: 1
      bundled_monitoring_extra_visits: 2
      half_hour_uplift_share: 0.5
      quarter_hour_uplift_share: 0.25
      half_share: 0.5
    prerequisite: []
    rule: >
      Controls support work that a plan's included support hours do not cover is invoiced to the building
      owner as a support overage on that plan.
      Hours logged against resolved tickets in the twelve months to the handling day beyond the included
      support hours standing to the plan's credit, after the on-site visit allowance, are billed as this
      rule works them out, at the rates the plan's records select rather than at the tier's support hour
      and controls technician rates alone. The support overage is raised as one charge at the handling
      day covering the twelve months to it rather than month by month, and is periodised to the calendar
      month in which it is raised. The hours the overage is worked out from are the hours logged
      against resolved tickets in the twelve months to the handling day, taken from the plan's own history and
      separated by how each ticket was closed into hours closed remotely, hours closed on site and hours
      closed with no fault found; the included support hours standing to the plan's credit are the support
      hours the plan has been credited under its entitlement. The plan year absorbs the tier's included
      on-site visits, each attendance reckoned at four hours, and those hours are taken off the hours closed
      on site before anything else is worked out. The included support hours standing to the plan's credit
      are then drawn against the on-site hours left after that allowance and the remote hours in the proportion each bears to the two of them together, the two of them together being taken as one hour where they fall below it. The on-site hours left after the visit allowance and
      the drawing are billed at the tier's on-site controls technician rate, and the remote hours left after
      the drawing are billed at the tier's support hour rate. Hours logged on tickets closed with no fault
      found never draw the included support hours and are billed in full at the rate the remote hours carry.
      No uplift is charged for work the monitoring desk raised outside the tier's help desk hours. The support
      overage is the sum of those amounts, rounded to two decimal places.
      Where the tier includes an on-site controls visit escalation and the building carries a maintenance
      agreement standing active, the included support hours are drawn first against the on-site hours left after the visit allowance, and whatever of the included hours then remains is drawn against the remote hours. Where the tier includes an
      on-site controls visit escalation and the building carries no maintenance agreement standing active,
      the included support hours are drawn first against the remote hours, and whatever of the included hours then remains is drawn against the on-site hours left after the visit allowance.
      Where the hours logged against resolved tickets in the twelve months to the handling day are at least
      three times the included support hours standing to the plan's credit and at least three of those tickets
      were closed on site, the remote hours carry the tier's support hour rate less twelve per cent. Where
      those hours are at least twice and less than three times the included support hours standing to the
      plan's credit and at least one of those tickets was closed on site, the remote hours carry the tier's
      support hour rate less six per cent.
      Where the building carries a maintenance agreement standing active whose tier carries a repair labor
      discount of ten per cent or more, the on-site hours carry that maintenance agreement's own regular-hours
      labor rate. Where the building carries a maintenance agreement standing active whose tier carries a
      repair labor discount below ten per cent, the on-site hours carry the tier's on-site controls technician
      rate less eight per cent.
      Where the tier includes a remote fix attempt and the twelve months to the handling day carry two or more
      tickets closed with no fault found, none of the hours logged on tickets closed with no fault found is
      billed. Where the tier includes a remote fix attempt and the twelve months to the handling day carry
      exactly one ticket closed with no fault found, half of those hours is billed.
      Where the building carries a maintenance agreement standing active whose tier includes remote monitoring
      of covered equipment, the plan year absorbs two on-site attendances beyond the tier's included on-site
      visits. Where the building carries a maintenance agreement standing active whose tier does not include
      remote monitoring of covered equipment, the plan year absorbs one on-site attendance beyond the tier's
      included on-site visits.
      Where the tier's help desk answers only in business hours and the twelve months to the handling day
      carry at least one resolved ticket that reached the desk through the monitoring desk, an uplift of half
      the tier's support hour rate is charged for each hour logged on tickets that reached the desk that way.
      Where the tier's help desk answers extended hours and the twelve months to the handling day carry at
      least one resolved ticket that reached the desk through the monitoring desk, an uplift of a quarter of
      the tier's support hour rate is charged for each hour logged on tickets that reached the desk that way.
      Each band of hours is priced at its own rate hour by hour and the rates are never combined into one
      rate; the out-of-hours uplift is added to the sum of those amounts rather than applied to it; and the
      rounding is carried out once, on the final sum, to two decimal places.
    cross_category:
      - category: maintenance
        as: branch
        reads: [status, agreement_labor_rate_usd, repair_labor_discount_pct, remote_monitoring_included]
        note: The building's maintenance agreement decides the drawing order of the included hours, the rate the on-site hours carry and how many on-site attendances the plan year absorbs.
    compute:
      - pool_credited: "SUM('controls_events','support_hours', event_type='controls_support_hours_credited')"
      - onsite_hours: "SUM('controls_events','support_hours', within_months=12, date_field='resolved_date', event_type='controls_ticket_resolved', resolution_method='onsite')"
      - remote_hours: "SUM('controls_events','support_hours', within_months=12, date_field='resolved_date', event_type='controls_ticket_resolved', resolution_method='remote')"
      - nff_hours: "SUM('controls_events','support_hours', within_months=12, date_field='resolved_date', event_type='controls_ticket_resolved', resolution_method='no_fault_found')"
      - hours_logged: "SUM('controls_events','support_hours', within_months=12, date_field='resolved_date', event_type='controls_ticket_resolved')"
      - onsite_tickets: "COUNT('controls_events', within_months=12, date_field='resolved_date', event_type='controls_ticket_resolved', resolution_method='onsite')"
      - remote_rate: "RND(P('support_hour_rate_usd') * (1 - K('volume_step_deep_pct') / 100), 2) if (hours_logged >= 3 * pool_credited and onsite_tickets >= 3) else (RND(P('support_hour_rate_usd') * (1 - K('volume_step_first_pct') / 100), 2) if (hours_logged >= 2 * pool_credited and hours_logged < 3 * pool_credited and onsite_tickets >= 1) else P('support_hour_rate_usd'))"
      - maint_active: "EXISTS('maintenance', status='active')"
      - maint_monitoring: "CPARAM('maintenance','remote_monitoring_included', status='active')"
      - onsite_visits_absorbed: "P('onsite_visits_included_per_year') + K('bundled_monitoring_extra_visits') if (maint_active and maint_monitoring == True) else (P('onsite_visits_included_per_year') + K('bundled_extra_visits') if (maint_active and maint_monitoring == False) else P('onsite_visits_included_per_year'))"
      - onsite_allowance_hours: "onsite_visits_absorbed * K('hours_per_onsite_visit')"
      - onsite_after_allowance: "MX(0, onsite_hours - onsite_allowance_hours)"
      - pool_applied_to_onsite: "MN(onsite_after_allowance, pool_credited) if (P('onsite_escalation_included') and maint_active) else (MX(0, MN(onsite_after_allowance, pool_credited - remote_hours)) if (P('onsite_escalation_included') and not maint_active) else RND(pool_credited * onsite_after_allowance / MX(1, onsite_after_allowance + remote_hours), 2))"
      - billable_onsite: "MX(0, onsite_after_allowance - pool_applied_to_onsite)"
      - billable_remote: "MX(0, remote_hours - MX(0, pool_credited - pool_applied_to_onsite))"
      - maint_repair_discount: "CPARAM('maintenance','repair_labor_discount_pct', status='active')"
      - maint_labor_rate: "CPARAM('maintenance','agreement_labor_rate_usd', status='active')"
      - onsite_rate: "maint_labor_rate if (maint_active and maint_repair_discount >= K('bundled_discount_threshold_pct')) else (RND(P('controls_technician_rate_usd') * (1 - K('bundled_step_pct') / 100), 2) if (maint_active and maint_repair_discount < K('bundled_discount_threshold_pct')) else P('controls_technician_rate_usd'))"
      - nff_tickets: "COUNT('controls_events', within_months=12, date_field='resolved_date', event_type='controls_ticket_resolved', resolution_method='no_fault_found')"
      - nff_share: "0 if (P('remote_fix_attempt_included') and nff_tickets >= 2) else (K('half_share') if (P('remote_fix_attempt_included') and nff_tickets == 1) else 1)"
      - desk_hours: "SUM('controls_events','support_hours', within_months=12, date_field='resolved_date', event_type='controls_ticket_resolved', channel='monitoring_desk')"
      - desk_tickets: "COUNT('controls_events', within_months=12, date_field='resolved_date', event_type='controls_ticket_resolved', channel='monitoring_desk')"
      - out_of_hours_rate: "RND(P('support_hour_rate_usd') * K('half_hour_uplift_share'), 2) if (P('help_desk_hours') == 'business_hours' and desk_tickets >= 1) else (RND(P('support_hour_rate_usd') * K('quarter_hour_uplift_share'), 2) if (P('help_desk_hours') == 'extended_hours' and desk_tickets >= 1) else 0)"
      - result: "RND(billable_remote * remote_rate + billable_onsite * onsite_rate + nff_hours * nff_share * remote_rate + desk_hours * out_of_hours_rate, 2)"
    compute_basis:
      pool_credited: "the included support hours standing to the plan's credit are the support hours the plan has been credited under its entitlement"
      onsite_hours: "The hours the overage is worked out from are the hours logged against resolved tickets in the twelve months to the handling day, taken from the plan's own history and separated by how each ticket was closed into hours closed remotely, hours closed on site and hours closed with no fault found"
      remote_hours: "The hours the overage is worked out from are the hours logged against resolved tickets in the twelve months to the handling day, taken from the plan's own history and separated by how each ticket was closed into hours closed remotely, hours closed on site and hours closed with no fault found"
      nff_hours: "Hours logged on tickets closed with no fault found never draw the included support hours and are billed in full at the rate the remote hours carry."
      hours_logged: "Where the hours logged against resolved tickets in the twelve months to the handling day are at least three times the included support hours standing to the plan's credit and at least three of those tickets were closed on site, the remote hours carry the tier's support hour rate less twelve per cent."
      onsite_tickets: "Where those hours are at least twice and less than three times the included support hours standing to the plan's credit and at least one of those tickets was closed on site, the remote hours carry the tier's support hour rate less six per cent."
      remote_rate: "Where the hours logged against resolved tickets in the twelve months to the handling day are at least three times the included support hours standing to the plan's credit and at least three of those tickets were closed on site, the remote hours carry the tier's support hour rate less twelve per cent. Where those hours are at least twice and less than three times the included support hours standing to the plan's credit and at least one of those tickets was closed on site, the remote hours carry the tier's support hour rate less six per cent."
      maint_active: "Where the tier includes an on-site controls visit escalation and the building carries a maintenance agreement standing active, the included support hours are drawn first against the on-site hours left after the visit allowance, and whatever of the included hours then remains is drawn against the remote hours."
      maint_monitoring: "Where the building carries a maintenance agreement standing active whose tier includes remote monitoring of covered equipment, the plan year absorbs two on-site attendances beyond the tier's included on-site visits."
      onsite_visits_absorbed: "Where the building carries a maintenance agreement standing active whose tier includes remote monitoring of covered equipment, the plan year absorbs two on-site attendances beyond the tier's included on-site visits. Where the building carries a maintenance agreement standing active whose tier does not include remote monitoring of covered equipment, the plan year absorbs one on-site attendance beyond the tier's included on-site visits."
      onsite_allowance_hours: "The plan year absorbs the tier's included on-site visits, each attendance reckoned at four hours, and those hours are taken off the hours closed on site before anything else is worked out."
      onsite_after_allowance: "The plan year absorbs the tier's included on-site visits, each attendance reckoned at four hours, and those hours are taken off the hours closed on site before anything else is worked out."
      pool_applied_to_onsite: "The included support hours standing to the plan's credit are then drawn against the on-site hours left after that allowance and the remote hours in the proportion each bears to the two of them together, the two of them together being taken as one hour where they fall below it. Where the tier includes an on-site controls visit escalation and the building carries a maintenance agreement standing active, the included support hours are drawn first against the on-site hours left after the visit allowance, and whatever of the included hours then remains is drawn against the remote hours. Where the tier includes an on-site controls visit escalation and the building carries no maintenance agreement standing active, the included support hours are drawn first against the remote hours, and whatever of the included hours then remains is drawn against the on-site hours left after the visit allowance."
      billable_onsite: "The on-site hours left after the visit allowance and the drawing are billed at the tier's on-site controls technician rate, and the remote hours left after the drawing are billed at the tier's support hour rate."
      billable_remote: "The on-site hours left after the visit allowance and the drawing are billed at the tier's on-site controls technician rate, and the remote hours left after the drawing are billed at the tier's support hour rate."
      maint_repair_discount: "Where the building carries a maintenance agreement standing active whose tier carries a repair labor discount of ten per cent or more, the on-site hours carry that maintenance agreement's own regular-hours labor rate."
      maint_labor_rate: "Where the building carries a maintenance agreement standing active whose tier carries a repair labor discount of ten per cent or more, the on-site hours carry that maintenance agreement's own regular-hours labor rate."
      onsite_rate: "Where the building carries a maintenance agreement standing active whose tier carries a repair labor discount of ten per cent or more, the on-site hours carry that maintenance agreement's own regular-hours labor rate. Where the building carries a maintenance agreement standing active whose tier carries a repair labor discount below ten per cent, the on-site hours carry the tier's on-site controls technician rate less eight per cent."
      nff_tickets: "Where the tier includes a remote fix attempt and the twelve months to the handling day carry two or more tickets closed with no fault found, none of the hours logged on tickets closed with no fault found is billed."
      nff_share: "Where the tier includes a remote fix attempt and the twelve months to the handling day carry two or more tickets closed with no fault found, none of the hours logged on tickets closed with no fault found is billed. Where the tier includes a remote fix attempt and the twelve months to the handling day carry exactly one ticket closed with no fault found, half of those hours is billed."
      desk_hours: "an uplift of half the tier's support hour rate is charged for each hour logged on tickets that reached the desk that way"
      desk_tickets: "Where the tier's help desk answers only in business hours and the twelve months to the handling day carry at least one resolved ticket that reached the desk through the monitoring desk, an uplift of half the tier's support hour rate is charged for each hour logged on tickets that reached the desk that way."
      out_of_hours_rate: "Where the tier's help desk answers only in business hours and the twelve months to the handling day carry at least one resolved ticket that reached the desk through the monitoring desk, an uplift of half the tier's support hour rate is charged for each hour logged on tickets that reached the desk that way. Where the tier's help desk answers extended hours and the twelve months to the handling day carry at least one resolved ticket that reached the desk through the monitoring desk, an uplift of a quarter of the tier's support hour rate is charged for each hour logged on tickets that reached the desk that way."
      result: "Each band of hours is priced at its own rate hour by hour and the rates are never combined into one rate; the out-of-hours uplift is added to the sum of those amounts rather than applied to it; and the rounding is carried out once, on the final sum, to two decimal places."
    factors:
      - id: pool_drawdown_order
        effect: method
        decides: pool_applied_to_onsite
        bindings: [maint_active, pool_applied_to_onsite]
        ladder:
          - when: "the tier includes an on-site controls visit escalation and the building carries a maintenance agreement standing active"
            method: "the included support hours are drawn first against the on-site hours left after the visit allowance, and whatever of the included hours then remains is drawn against the remote hours"
          - when: "the tier includes an on-site controls visit escalation and the building carries no maintenance agreement standing active"
            method: "the included support hours are drawn first against the remote hours, and whatever of the included hours then remains is drawn against the on-site hours left after the visit allowance"
          - when: "otherwise"
            method: "the included support hours are drawn against the on-site hours left after the visit allowance and the remote hours in the proportion each bears to the two of them together"
        baseline:
          pool_applied_to_onsite: "RND(pool_credited * onsite_after_allowance / MX(1, onsite_after_allowance + remote_hours), 2)"
        evidence: [cross_category, tier_param]
        cross_difficulty: maintenance
      - id: support_hour_volume_rate
        effect: parameter
        decides: remote_rate
        bindings: [hours_logged, onsite_tickets, remote_rate]
        ladder:
          - when: "the hours logged against resolved tickets in the twelve months to the handling day are at least three times the included support hours standing to the plan's credit and at least three of those tickets were closed on site"
            value: "the tier's support hour rate less twelve per cent"
          - when: "the hours logged are at least twice and less than three times the included support hours standing to the plan's credit and at least one of those tickets was closed on site"
            value: "the tier's support hour rate less six per cent"
          - when: "otherwise"
            value: "the tier's support hour rate"
        baseline:
          remote_rate: "P('support_hour_rate_usd')"
        evidence: [history]
        cross_difficulty: null
      - id: onsite_labor_rate
        effect: parameter
        decides: onsite_rate
        bindings: [maint_repair_discount, maint_labor_rate, onsite_rate]
        ladder:
          - when: "the building carries a maintenance agreement standing active whose tier carries a repair labor discount of ten per cent or more"
            value: "that maintenance agreement's own regular-hours labor rate"
          - when: "the building carries a maintenance agreement standing active whose tier carries a repair labor discount below ten per cent"
            value: "the tier's on-site controls technician rate less eight per cent"
          - when: "otherwise"
            value: "the tier's on-site controls technician rate"
        baseline:
          onsite_rate: "P('controls_technician_rate_usd')"
        evidence: [cross_category]
        cross_difficulty: maintenance
      - id: no_fault_hours_share
        effect: parameter
        decides: nff_share
        bindings: [nff_tickets, nff_share]
        ladder:
          - when: "the tier includes a remote fix attempt and the twelve months to the handling day carry two or more tickets closed with no fault found"
            value: "none of the hours logged on tickets closed with no fault found"
          - when: "the tier includes a remote fix attempt and the twelve months to the handling day carry exactly one ticket closed with no fault found"
            value: "half of the hours logged on tickets closed with no fault found"
          - when: "otherwise"
            value: "all of the hours logged on tickets closed with no fault found"
        baseline:
          nff_share: "1"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: onsite_visit_allowance
        effect: parameter
        decides: onsite_visits_absorbed
        bindings: [maint_monitoring, onsite_visits_absorbed]
        ladder:
          - when: "the building carries a maintenance agreement standing active whose tier includes remote monitoring of covered equipment"
            value: "two on-site attendances beyond the tier's included on-site visits"
          - when: "the building carries a maintenance agreement standing active whose tier does not include remote monitoring of covered equipment"
            value: "one on-site attendance beyond the tier's included on-site visits"
          - when: "otherwise"
            value: "the tier's included on-site visits"
        baseline:
          onsite_visits_absorbed: "P('onsite_visits_included_per_year')"
        evidence: [cross_category]
        cross_difficulty: maintenance
      - id: out_of_hours_uplift
        effect: parameter
        decides: out_of_hours_rate
        bindings: [desk_tickets, out_of_hours_rate]
        ladder:
          - when: "the tier's help desk answers only in business hours and the twelve months to the handling day carry at least one resolved ticket that reached the desk through the monitoring desk"
            value: "half the tier's support hour rate for each hour logged on tickets that reached the desk that way"
          - when: "the tier's help desk answers extended hours and the twelve months to the handling day carry at least one resolved ticket that reached the desk through the monitoring desk"
            value: "a quarter of the tier's support hour rate for each hour logged on tickets that reached the desk that way"
          - when: "otherwise"
            value: "no uplift for work the monitoring desk raised outside the tier's help desk hours"
        baseline:
          out_of_hours_rate: "0"
        evidence: [history, tier_param]
        cross_difficulty: null
    baseline:
      rule: >-
        The hours the overage is worked out from are the hours logged against resolved tickets in the twelve
        months to the handling day, taken from the plan's own history and separated by how each ticket was
        closed into hours closed remotely, hours closed on site and hours closed with no fault found; the
        included support hours standing to the plan's credit are the support hours the plan has been credited
        under its entitlement. The plan year absorbs the tier's included on-site visits, each attendance
        reckoned at four hours, and those hours are taken off the hours closed on site before anything else is
        worked out. The included support hours standing to the plan's credit are then drawn against the
        on-site hours left after that allowance and the remote hours in the proportion each bears to the two of them together, the two of them together being taken as one hour where they fall below it. The on-site hours left after the visit allowance and the drawing are billed at the
        tier's on-site controls technician rate, and the remote hours left after the drawing are billed at the
        tier's support hour rate. Hours logged on tickets closed with no fault found never draw the included
        support hours and are billed in full at the rate the remote hours carry. No uplift is charged for work
        the monitoring desk raised outside the tier's help desk hours. The support overage is the sum of those
        amounts, rounded to two decimal places.
      params: [hours_per_onsite_visit, onsite_visits_included_per_year, controls_technician_rate_usd, support_hour_rate_usd]
    inputs:
      history:
        - {table: controls_events, aggregate: sum, field: support_hours, within_months: 12, filters: {event_type: controls_ticket_resolved}}
        - {table: controls_events, aggregate: count, field: event_id, within_months: 12, filters: {event_type: controls_ticket_resolved, resolution_method: onsite}}
        - {table: controls_events, aggregate: sum, field: support_hours, within_months: 0, filters: {event_type: controls_support_hours_credited}}
      cross_category: [maintenance]

  - id: controls_ext_arrears_settlement
    base_policy_refs: [controls_billing_and_late_fee]
    overwrite:
      - base_policy: controls_billing_and_late_fee
        superseded_clause: >-
          an invoice unpaid past its due day carries the tier's late fee for each month or part month it stays
          unpaid
        replaced_by: >-
          The late fee within the sum required is worked out on the charges required now for the whole months
          that lie between the due day of the plan's most recent plan fee charge and the handling day, at the
          rate the tier's billing frequency and those months select, and never per invoice or for a part month.
    trigger: on_request
    subject: [controls_payment_received]
    computes: payment_amount_usd
    target_tool: record_controls_plan_payment_09134fd7
    params:
      quarterly_trueup_months: 3
      deep_settlement_discount_pct: 4
      light_settlement_discount_pct: 2
      full_advance_share: 1
      half_advance_share: 0.5
    prerequisite:
      - problem: controls_ext_support_overage_charge
        kind: value_input
        gate: outstanding_charges
        form: state
        policy_source: >-
          The sum required to settle a plan is fixed only after every hour of controls support work the plan's
          included support hours do not cover stands invoiced on the plan's billing history.
        condition: >-
          The plan's billing history carries an invoiced charge for the support hours logged against resolved
          tickets beyond the included support hours standing to the plan's credit.
        resolved_by: charge_controls_support_overage_c0d5009e
        effect: >-
          The charges standing unsettled on the plan rise by the uncovered support work once it is invoiced,
          so the binding that carries the charges required now takes a larger value.
    rule: >
      A building owner who wants an automation service plan put back in order settles it in one payment, and
      the sum required is worked out from the plan's own billing history. The sum required to settle a plan is
      fixed only after every hour of controls support work the plan's included support hours do not cover
      stands invoiced on the plan's billing history. The charges standing unsettled on the plan are the
      charges invoiced on it less the payments received against it and the credits issued on it.
      The late fee within the sum required is worked out on the charges required now for the whole
      months that lie between the due day of the plan's most recent plan fee charge and the handling
      day, at the rate the tier's billing frequency and those months select, and never per invoice or
      for a part month. Only the
      charges that have already fallen due within the twelve months to the handling day, less what has been
      paid and credited, are required now. No late fee is added to the charges required now. No instalment is
      required in advance. No point overage is required with the settlement. No allowance is set against the
      sum required for points a monitoring subscription reads from the same controls system. No settlement
      discount is taken. The sum required is the charges required now together with the late fee, the advance
      instalment and the point overage added to them, less the allowance, rounded to two decimal places.
      Where the twelve months to the handling day carry three or more charges that fell due on the plan and no
      payment has been received in the last four months, every charge standing unsettled on the plan is
      required now, whether or not it has yet fallen due. Where the twelve months to the handling day carry
      three or more charges that fell due on the plan and a payment has been received in the last four months, the
      charges standing unsettled other than those that fell due inside the last month are required now.
      Where the due day of the plan's most recent plan fee charge lies three whole months or more before the handling day, counted from that due day to the handling day, and the plan is billed quarterly or monthly, the
      charges required now carry the tier's late fee rate for each whole month the arrears have run. Where that due day lies one or two whole months before the handling day and the plan is billed quarterly or monthly, the charges required now carry the tier's late fee rate for one month.
      Where the plan's remote access and monitoring have stood withdrawn since the day recorded on the plan
      and the charges required now are at least twice the tier's instalment, a whole instalment is required in
      advance. Where the plan's remote access and monitoring have stood withdrawn since the day recorded on
      the plan and the charges required now are at least one instalment and less than twice the instalment,
      half an instalment is required in advance.
      Where the plan's covered points stand above the tier's covered maximum and the tier trues its licence up
      quarterly or monthly, the point overage is required up front for the three months to the next true-up.
      Where the plan's covered points stand above the tier's covered maximum and the tier trues its licence up
      annually or semiannually, the point overage is required up front for every whole month left in the plan
      term.
      Where an energy monitoring subscription the owner holds stands active and reads its data from the
      controls system, one month of that subscription's own fee for each meter it covers is set against the
      sum required, the point licence being carried on the automation plan rather than there. Where an energy
      monitoring subscription the owner holds stands active and reads its data from both the controls system
      and its own meters, half that amount is set against the sum required.
      Where the building carries a maintenance agreement standing active whose tier covers repair labor, the
      sum required is taken at a settlement discount of four per cent. Where the building carries a
      maintenance agreement standing active whose tier does not cover repair labor, the sum required is taken
      at a settlement discount of two per cent.
      The late fee acts on the charges required now and on nothing else; the advance instalment and the point
      overage are added to that subtotal rather than discounted from it; the allowance is taken off the
      subtotal before the settlement discount is applied; the settlement discount acts once on the amount
      left after the allowance; and the rounding is carried out once, on the final sum, to two decimal places.
    cross_category:
      - category: energy
        as: branch
        reads: [status, data_source, meters_covered, subscription_fee_per_meter_usd]
        note: The owner's energy monitoring subscription decides the allowance set against the sum required for points read from the same controls system.
      - category: maintenance
        as: branch
        reads: [status, repair_labor_covered]
        note: The building's maintenance agreement decides the settlement discount the sum required is taken at.
    compute:
      - charges_total: "SUM('controls_events','amount_usd', event_type='controls_invoice_charged')"
      - payments_total: "SUM('controls_events','amount_usd', event_type='controls_payment_received')"
      - credits_total: "SUM('controls_events','amount_usd', event_type='controls_credit_issued')"
      - outstanding_charges: "MX(0, charges_total - payments_total - credits_total)"
      - due_charges_12m: "SUM('controls_events','amount_usd', within_months=12, date_field='due_date', event_type='controls_invoice_charged')"
      - recent_due_charges: "SUM('controls_events','amount_usd', within_months=1, date_field='due_date', event_type='controls_invoice_charged')"
      - charge_lines_12m: "COUNT('controls_events', within_months=12, date_field='due_date', event_type='controls_invoice_charged')"
      - payments_recent: "COUNT('controls_events', within_months=4, date_field='received_date', event_type='controls_payment_received')"
      - required_charges: "outstanding_charges if (charge_lines_12m >= 3 and payments_recent == 0) else (MX(0, outstanding_charges - recent_due_charges) if (charge_lines_12m >= 3 and payments_recent >= 1) else MX(0, due_charges_12m - payments_total - credits_total))"
      - last_plan_fee_due: "LATEST('controls_events','due_date', date_field='due_date', event_type='controls_invoice_charged', charge_type='plan_fee')"
      - months_overdue: "MX(0, MONTHS(last_plan_fee_due, NOW))"
      - late_fee_rate: "RND(P('late_fee_pct_per_month') * months_overdue / 100, 6) if (months_overdue >= 3 and (P('billing_frequency') == 'quarterly' or P('billing_frequency') == 'monthly')) else (P('late_fee_pct_per_month') / 100 if (months_overdue >= 1 and months_overdue < 3 and (P('billing_frequency') == 'quarterly' or P('billing_frequency') == 'monthly')) else 0)"
      - late_fee: "RND(required_charges * late_fee_rate, 2)"
      - instalments_per_year: "12 if P('billing_frequency') == 'monthly' else (4 if P('billing_frequency') == 'quarterly' else (2 if P('billing_frequency') == 'semiannual' else 1))"
      - instalment_value: "RND(P('annual_plan_fee_usd') / instalments_per_year, 2)"
      - plan_withdrawn: "F('status') == 'suspended' and MX(0, DAYS(F('suspension_date'), NOW)) > 0"
      - advance_share: "K('full_advance_share') if (plan_withdrawn and required_charges >= 2 * instalment_value) else (K('half_advance_share') if (plan_withdrawn and required_charges >= instalment_value and required_charges < 2 * instalment_value) else 0)"
      - advance_instalment: "RND(instalment_value * advance_share, 2)"
      - trueup_months: "K('quarterly_trueup_months') if (float(F('points_covered')) > P('points_covered_max') and (P('license_true_up_frequency') == 'quarterly' or P('license_true_up_frequency') == 'monthly')) else (MX(0, MONTHS(NOW, F('term_end_date'))) if (float(F('points_covered')) > P('points_covered_max') and (P('license_true_up_frequency') == 'annual' or P('license_true_up_frequency') == 'semiannual')) else 0)"
      - point_overage_due: "RND(MX(0, float(F('points_covered')) - P('points_covered_max')) * P('point_overage_fee_usd') * trueup_months / 12, 2)"
      - energy_meters: "CFIELD('energy','meters_covered', status='active')"
      - energy_source: "CFIELD('energy','data_source', status='active')"
      - shared_licence_allowance: "RND(CPARAM('energy','subscription_fee_per_meter_usd', status='active') * float(energy_meters) / 12, 2) if (energy_source == 'controls_system' and energy_meters != None) else (RND(CPARAM('energy','subscription_fee_per_meter_usd', status='active') * float(energy_meters) / 24, 2) if (energy_source == 'mixed' and energy_meters != None) else 0)"
      - maint_live: "EXISTS('maintenance', status='active')"
      - maint_repair_cover: "CPARAM('maintenance','repair_labor_covered', status='active')"
      - settlement_discount_pct: "K('deep_settlement_discount_pct') if (maint_live and maint_repair_cover == True) else (K('light_settlement_discount_pct') if (maint_live and maint_repair_cover == False) else 0)"
      - gross_due: "required_charges + late_fee + advance_instalment + point_overage_due"
      - net_due: "MX(0, gross_due - shared_licence_allowance)"
      - result: "RND(net_due * (1 - settlement_discount_pct / 100), 2)"
    compute_basis:
      charges_total: "The charges standing unsettled on the plan are the charges invoiced on it less the payments received against it and the credits issued on it."
      payments_total: "The charges standing unsettled on the plan are the charges invoiced on it less the payments received against it and the credits issued on it."
      credits_total: "The charges standing unsettled on the plan are the charges invoiced on it less the payments received against it and the credits issued on it."
      outstanding_charges: "The charges standing unsettled on the plan are the charges invoiced on it less the payments received against it and the credits issued on it."
      due_charges_12m: "Only the charges that have already fallen due within the twelve months to the handling day, less what has been paid and credited, are required now."
      recent_due_charges: "the charges standing unsettled other than those that fell due inside the last month are required now"
      charge_lines_12m: "Where the twelve months to the handling day carry three or more charges that fell due on the plan and no payment has been received in the last four months, every charge standing unsettled on the plan is required now, whether or not it has yet fallen due."
      payments_recent: "Where the twelve months to the handling day carry three or more charges that fell due on the plan and a payment has been received in the last four months, the charges standing unsettled other than those that fell due inside the last month are required now."
      required_charges: "Where the twelve months to the handling day carry three or more charges that fell due on the plan and no payment has been received in the last four months, every charge standing unsettled on the plan is required now, whether or not it has yet fallen due. Where the twelve months to the handling day carry three or more charges that fell due on the plan and a payment has been received in the last four months, the charges standing unsettled other than those that fell due inside the last month are required now. Only the charges that have already fallen due within the twelve months to the handling day, less what has been paid and credited, are required now."
      last_plan_fee_due: "Where the due day of the plan's most recent plan fee charge lies three whole months or more before the handling day, counted from that due day to the handling day, and the plan is billed quarterly or monthly, the charges required now carry the tier's late fee rate for each whole month the arrears have run."
      months_overdue: "counted from that due day to the handling day"
      late_fee_rate: "Where the due day of the plan's most recent plan fee charge lies three whole months or more before the handling day, counted from that due day to the handling day, and the plan is billed quarterly or monthly, the charges required now carry the tier's late fee rate for each whole month the arrears have run. Where that due day lies one or two whole months before the handling day and the plan is billed quarterly or monthly, the charges required now carry the tier's late fee rate for one month. No late fee is added to the charges required now."
      late_fee: "The late fee acts on the charges required now and on nothing else"
      instalments_per_year: "the charges required now are at least twice the tier's instalment"
      instalment_value: "the charges required now are at least twice the tier's instalment"
      plan_withdrawn: "Where the plan's remote access and monitoring have stood withdrawn since the day recorded on the plan and the charges required now are at least twice the tier's instalment, a whole instalment is required in advance."
      advance_share: "Where the plan's remote access and monitoring have stood withdrawn since the day recorded on the plan and the charges required now are at least twice the tier's instalment, a whole instalment is required in advance. Where the plan's remote access and monitoring have stood withdrawn since the day recorded on the plan and the charges required now are at least one instalment and less than twice the instalment, half an instalment is required in advance. No instalment is required in advance."
      advance_instalment: "the advance instalment and the point overage are added to that subtotal rather than discounted from it"
      trueup_months: "Where the plan's covered points stand above the tier's covered maximum and the tier trues its licence up quarterly or monthly, the point overage is required up front for the three months to the next true-up. Where the plan's covered points stand above the tier's covered maximum and the tier trues its licence up annually or semiannually, the point overage is required up front for every whole month left in the plan term. No point overage is required with the settlement."
      point_overage_due: "the point overage is required up front for every whole month left in the plan term"
      energy_meters: "one month of that subscription's own fee for each meter it covers is set against the sum required"
      energy_source: "Where an energy monitoring subscription the owner holds stands active and reads its data from the controls system, one month of that subscription's own fee for each meter it covers is set against the sum required, the point licence being carried on the automation plan rather than there."
      shared_licence_allowance: "Where an energy monitoring subscription the owner holds stands active and reads its data from the controls system, one month of that subscription's own fee for each meter it covers is set against the sum required, the point licence being carried on the automation plan rather than there. Where an energy monitoring subscription the owner holds stands active and reads its data from both the controls system and its own meters, half that amount is set against the sum required. No allowance is set against the sum required for points a monitoring subscription reads from the same controls system."
      maint_live: "Where the building carries a maintenance agreement standing active whose tier covers repair labor, the sum required is taken at a settlement discount of four per cent."
      maint_repair_cover: "Where the building carries a maintenance agreement standing active whose tier does not cover repair labor, the sum required is taken at a settlement discount of two per cent."
      settlement_discount_pct: "Where the building carries a maintenance agreement standing active whose tier covers repair labor, the sum required is taken at a settlement discount of four per cent. Where the building carries a maintenance agreement standing active whose tier does not cover repair labor, the sum required is taken at a settlement discount of two per cent. No settlement discount is taken."
      gross_due: "The sum required is the charges required now together with the late fee, the advance instalment and the point overage added to them, less the allowance, rounded to two decimal places."
      net_due: "the allowance is taken off the subtotal before the settlement discount is applied"
      result: "the settlement discount acts once on the amount left after the allowance; and the rounding is carried out once, on the final sum, to two decimal places"
    factors:
      - id: charges_required_now
        effect: method
        decides: required_charges
        bindings: [charge_lines_12m, payments_recent, required_charges]
        ladder:
          - when: "the twelve months to the handling day carry three or more charges that fell due on the plan and no payment has been received in the last four months"
            method: "every charge standing unsettled on the plan is required now, whether or not it has yet fallen due"
          - when: "the twelve months to the handling day carry three or more charges that fell due on the plan and a payment has been received in the last four months"
            method: "the charges standing unsettled other than those that fell due inside the last month are required now"
          - when: "otherwise"
            method: "only the charges that have already fallen due within the twelve months to the handling day, less what has been paid and credited, are required now"
        baseline:
          required_charges: "MX(0, due_charges_12m - payments_total - credits_total)"
        evidence: [history]
        cross_difficulty: null
      - id: arrears_late_fee_rate
        effect: parameter
        decides: late_fee_rate
        bindings: [last_plan_fee_due, months_overdue, late_fee_rate]
        ladder:
          - when: "the due day of the plan's most recent plan fee charge lies three whole months or more before the handling day and the plan is billed quarterly or monthly"
            value: "the tier's late fee rate for each whole month the arrears have run"
          - when: "the due day of the plan's most recent plan fee charge lies one or two whole months before the handling day and the plan is billed quarterly or monthly"
            value: "the tier's late fee rate for one month"
          - when: "otherwise"
            value: "no late fee rate at all"
        baseline:
          late_fee_rate: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: advance_instalment_share
        effect: parameter
        decides: advance_share
        bindings: [plan_withdrawn, advance_share]
        ladder:
          - when: "the plan's remote access and monitoring have stood withdrawn since the day recorded on the plan and the charges required now are at least twice the tier's instalment"
            value: "a whole instalment in advance"
          - when: "the plan's remote access and monitoring have stood withdrawn since the day recorded on the plan and the charges required now are at least one instalment and less than twice the instalment"
            value: "half an instalment in advance"
          - when: "otherwise"
            value: "no instalment in advance"
        baseline:
          advance_share: "0"
        evidence: [date, history]
        cross_difficulty: null
      - id: point_overage_months_up_front
        effect: parameter
        decides: trueup_months
        bindings: [trueup_months]
        ladder:
          - when: "the plan's covered points stand above the tier's covered maximum and the tier trues its licence up quarterly or monthly"
            value: "the three months to the next true-up"
          - when: "the plan's covered points stand above the tier's covered maximum and the tier trues its licence up annually or semiannually"
            value: "every whole month left in the plan term"
          - when: "otherwise"
            value: "no months at all"
        baseline:
          trueup_months: "0"
        evidence: [date, tier_param]
        cross_difficulty: null
      - id: shared_point_licence_allowance
        effect: parameter
        decides: shared_licence_allowance
        bindings: [energy_meters, energy_source, shared_licence_allowance]
        ladder:
          - when: "an energy monitoring subscription the owner holds stands active and reads its data from the controls system"
            value: "one month of that subscription's own fee for each meter it covers"
          - when: "an energy monitoring subscription the owner holds stands active and reads its data from both the controls system and its own meters"
            value: "half a month of that subscription's own fee for each meter it covers"
          - when: "otherwise"
            value: "no allowance at all"
        baseline:
          shared_licence_allowance: "0"
        evidence: [cross_category]
        cross_difficulty: energy
      - id: bundled_settlement_discount
        effect: parameter
        decides: settlement_discount_pct
        bindings: [maint_live, maint_repair_cover, settlement_discount_pct]
        ladder:
          - when: "the building carries a maintenance agreement standing active whose tier covers repair labor"
            value: "a settlement discount of four per cent"
          - when: "the building carries a maintenance agreement standing active whose tier does not cover repair labor"
            value: "a settlement discount of two per cent"
          - when: "otherwise"
            value: "no settlement discount"
        baseline:
          settlement_discount_pct: "0"
        evidence: [cross_category]
        cross_difficulty: maintenance
    baseline:
      rule: >-
        The charges standing unsettled on the plan are the charges invoiced on it less the payments received
        against it and the credits issued on it. Only the charges that have already fallen due within the
        twelve months to the handling day, less what has been paid and credited, are required now. No late fee
        is added to the charges required now. No instalment is required in advance. No point overage is
        required with the settlement. No allowance is set against the sum required for points a monitoring
        subscription reads from the same controls system. No settlement discount is taken. The sum required is
        the charges required now together with the late fee, the advance instalment and the point overage
        added to them, less the allowance, rounded to two decimal places.
      params: [annual_plan_fee_usd, billing_frequency, late_fee_pct_per_month, point_overage_fee_usd, points_covered_max]
    inputs:
      history:
        - {table: controls_events, aggregate: sum, field: amount_usd, within_months: 0, filters: {event_type: controls_invoice_charged}}
        - {table: controls_events, aggregate: sum, field: amount_usd, within_months: 0, filters: {event_type: controls_payment_received}}
        - {table: controls_events, aggregate: count, field: event_id, within_months: 12, filters: {event_type: controls_invoice_charged}}
        - {table: controls_events, aggregate: latest, field: due_date, within_months: 0, filters: {event_type: controls_invoice_charged, charge_type: plan_fee}}
      cross_category: [energy, maintenance]

  - id: controls_ext_reinstatement_charge
    base_policy_refs: [controls_suspension_and_reinstatement]
    overwrite:
      - base_policy: controls_suspension_and_reinstatement
        superseded_clause: >-
          Access and monitoring are restored when the arrears are settled in full and the tier's reinstatement
          fee is charged
        replaced_by: >-
          The charge raised when a withdrawn plan is put back into service is the reinstatement charge this rule
          works out, which starts from the tier's reinstatement fee and adds the re-commissioning elements the
          site's records select, rather than the tier's reinstatement fee alone.
    trigger: on_request
    subject: [controls_plan_reinstated]
    computes: reinstatement_charge_usd
    target_tool: reinstate_controls_plan_58d0efe4
    params:
      heavy_recommission_pct: 40
      light_recommission_pct: 20
      full_gateway_share: 1
      half_gateway_share: 0.5
      quarter_gateway_share: 0.25
      resync_hour_per_month: 1
      resync_half_hour_per_month: 0.5
      backfill_hours_per_meter: 0.1
      survey_half_share: 0.5
      survey_quarter_share: 0.25
      long_outage_days: 60
      gateway_outage_days: 30
      days_per_month: 30
    prerequisite:
      - problem: controls_ext_arrears_settlement
        kind: state_gate
        gate: controls_plans.balance_due
        form: state
        policy_source: >-
          Remote access and alarm monitoring are restored and the reinstatement charge raised only once the
          balance owed under the plan stands at nil or below.
        condition: >-
          The balance owed under the automation service plan is nil or below at the moment the plan is put
          back into service.
        resolved_by: record_controls_plan_payment_09134fd7
        effect: >-
          The balance owed under the plan falls to nil or below once the owner's payment is applied to it, so
          the standing this policy waits on is reached.
    rule: >
      When a building owner asks for an automation service plan that stands withdrawn to be put back into
      service, the desk restores remote access and alarm monitoring and raises a reinstatement charge on the
      plan. Remote access and alarm monitoring are restored and the reinstatement charge raised only once the
      balance owed under the plan stands at nil or below. The reinstatement charge is the tier's reinstatement
      fee.
      The charge raised when a withdrawn plan is put back into service is the reinstatement charge this
      rule works out, which starts from the tier's reinstatement fee and adds the re-commissioning
      elements the site's records select, rather than the tier's reinstatement fee alone. The days the site has stood without monitoring are counted in calendar days from the day monitoring
      was withdrawn to the handling day, that day excluded and the handling day included. A quarter of the
      tier's annual secure remote access gateway fee is taken to re-commission the remote connection. No
      controls technician time is charged for re-synchronising the controls database. No charge is raised for
      back-filling the readings the site did not send while it stood unmonitored. No share of the tier's
      controls site survey fee is taken. The reinstatement charge is the sum of those amounts, rounded to two
      decimal places.
      Where the site has stood without monitoring for more than sixty days and the plan's covered points stand
      above the tier's covered maximum, the tier's reinstatement fee is raised by forty per cent. Where the
      site has stood without monitoring for more than sixty days and the plan's covered points stand at or
      below the tier's covered maximum, the tier's reinstatement fee is raised by twenty per cent.
      Where the site has stood without monitoring for more than thirty days and the building carries no
      maintenance agreement standing active, the tier's annual secure remote access gateway fee is taken in
      full to re-commission the remote connection. Where the site has stood without monitoring for more than
      thirty days and the building carries a maintenance agreement standing active, half that gateway fee is
      taken.
      Where the tier's help desk answers around the clock and the plan carries a day on which monitoring was
      last restored, the days charged for re-synchronisation are counted from that day to the handling day.
      Where the tier's help desk answers extended hours or business hours only and the twelve months to the
      handling day carry three or more charges that fell due on the plan, the days charged for re-synchronisation are
      counted from the due day of the plan's most recent plan fee charge to the handling day, that due day
      excluded and the handling day included.
      Where the plan's covered points stand above the tier's covered maximum and the twelve months to the
      handling day carry two or more graphics page edits carried out on the plan, an hour of controls
      technician time is charged for each whole month of the days charged for re-synchronisation. Where the
      plan's covered points stand above the tier's covered maximum and the twelve months to the handling day
      carry fewer than two graphics page edits carried out on the plan, half an hour of controls technician
      time is charged for each whole such month.
      Where an energy monitoring subscription the owner holds stands active and reads its data from the
      controls system, a tenth of an hour of controls technician time is charged for each meter that
      subscription covers to back-fill the readings the site did not send. Where an energy monitoring
      subscription the owner holds stands active and reads its data from both the controls system and its own
      meters, half that back-fill charge is taken.
      Where the site has stood without monitoring for longer than the tier's restart window and the twelve
      months to the handling day carry no software update applied to the covered system, half the tier's
      controls site survey fee is taken. Where the site has stood without monitoring for longer than the
      tier's restart window and the twelve months to the handling day carry at least one software update
      applied to the covered system, a quarter of that survey fee is taken.
      The whole months of the days charged for re-synchronisation are taken by counting thirty days to the
      month and dropping any part month; each element is worked out on its own and the elements are then added
      together, none of them acting on another; and the rounding is carried out once, on the final sum, to two
      decimal places.
    cross_category:
      - category: maintenance
        as: existence
        reads: [status]
        note: Whether the building carries a live maintenance agreement decides the share of the gateway fee taken to re-commission the remote connection.
      - category: energy
        as: branch
        reads: [status, data_source, meters_covered]
        note: The owner's energy monitoring subscription decides the back-fill charge for the readings the site did not send while it stood unmonitored.
    compute:
      - withdrawal_span_days: "MX(0, DAYS(F('suspension_date'), NOW))"
      - base_fee: "RND(P('reinstatement_fee_usd') * (1 + K('heavy_recommission_pct') / 100), 2) if (withdrawal_span_days > K('long_outage_days') and float(F('points_covered')) > P('points_covered_max')) else (RND(P('reinstatement_fee_usd') * (1 + K('light_recommission_pct') / 100), 2) if (withdrawal_span_days > K('long_outage_days') and float(F('points_covered')) <= P('points_covered_max')) else P('reinstatement_fee_usd'))"
      - maint_live: "EXISTS('maintenance', status='active')"
      - gateway_fee: "RND(P('vpn_gateway_fee_usd') * K('full_gateway_share'), 2) if (withdrawal_span_days > K('gateway_outage_days') and not maint_live) else (RND(P('vpn_gateway_fee_usd') * K('half_gateway_share'), 2) if (withdrawal_span_days > K('gateway_outage_days') and maint_live) else RND(P('vpn_gateway_fee_usd') * K('quarter_gateway_share'), 2))"
      - charge_lines_12m: "COUNT('controls_events', within_months=12, date_field='due_date', event_type='controls_invoice_charged')"
      - last_plan_fee_due: "LATEST('controls_events','due_date', date_field='due_date', event_type='controls_invoice_charged', charge_type='plan_fee')"
      - withdrawn_days: "MX(0, DAYS(F('reinstatement_date'), NOW)) if (P('help_desk_hours') == 'twenty_four_seven' and F('reinstatement_date') != '') else (MX(0, DAYS(last_plan_fee_due, NOW)) if ((P('help_desk_hours') == 'extended_hours' or P('help_desk_hours') == 'business_hours') and charge_lines_12m >= 3) else MX(0, DAYS(F('suspension_date'), NOW)))"
      - months_withdrawn: "int(withdrawn_days / K('days_per_month'))"
      - graphics_edits_12m: "COUNT('controls_events', within_months=12, date_field='resolved_date', event_type='controls_ticket_resolved', request_class='graphics_edit')"
      - resync_monthly_fee: "RND(P('controls_technician_rate_usd') * K('resync_hour_per_month'), 2) if (float(F('points_covered')) > P('points_covered_max') and graphics_edits_12m >= 2) else (RND(P('controls_technician_rate_usd') * K('resync_half_hour_per_month'), 2) if (float(F('points_covered')) > P('points_covered_max') and graphics_edits_12m < 2) else 0)"
      - energy_meters: "CFIELD('energy','meters_covered', status='active')"
      - energy_source: "CFIELD('energy','data_source', status='active')"
      - backfill_fee: "RND(float(energy_meters) * K('backfill_hours_per_meter') * P('controls_technician_rate_usd'), 2) if (energy_source == 'controls_system' and energy_meters != None) else (RND(float(energy_meters) * K('backfill_hours_per_meter') * P('controls_technician_rate_usd') / 2, 2) if (energy_source == 'mixed' and energy_meters != None) else 0)"
      - updates_12m: "COUNT('controls_events', within_months=12, date_field='applied_date', event_type='controls_software_update_applied')"
      - survey_share: "RND(P('site_survey_fee_usd') * K('survey_half_share'), 2) if (withdrawal_span_days > P('restart_window_days') and updates_12m == 0) else (RND(P('site_survey_fee_usd') * K('survey_quarter_share'), 2) if (withdrawal_span_days > P('restart_window_days') and updates_12m >= 1) else 0)"
      - result: "RND(base_fee + gateway_fee + months_withdrawn * resync_monthly_fee + backfill_fee + survey_share, 2)"
    compute_basis:
      withdrawal_span_days: "The days the site has stood without monitoring are counted in calendar days from the day monitoring was withdrawn to the handling day, that day excluded and the handling day included."
      base_fee: "The reinstatement charge is the tier's reinstatement fee. Where the site has stood without monitoring for more than sixty days and the plan's covered points stand above the tier's covered maximum, the tier's reinstatement fee is raised by forty per cent. Where the site has stood without monitoring for more than sixty days and the plan's covered points stand at or below the tier's covered maximum, the tier's reinstatement fee is raised by twenty per cent."
      maint_live: "Where the site has stood without monitoring for more than thirty days and the building carries a maintenance agreement standing active, half that gateway fee is taken."
      gateway_fee: "A quarter of the tier's annual secure remote access gateway fee is taken to re-commission the remote connection. Where the site has stood without monitoring for more than thirty days and the building carries no maintenance agreement standing active, the tier's annual secure remote access gateway fee is taken in full to re-commission the remote connection. Where the site has stood without monitoring for more than thirty days and the building carries a maintenance agreement standing active, half that gateway fee is taken."
      charge_lines_12m: "Where the tier's help desk answers extended hours or business hours only and the twelve months to the handling day carry three or more charges that fell due on the plan, the days charged for re-synchronisation are counted from the due day of the plan's most recent plan fee charge to the handling day, that due day excluded and the handling day included."
      last_plan_fee_due: "the days charged for re-synchronisation are counted from the due day of the plan's most recent plan fee charge to the handling day, that due day excluded and the handling day included"
      withdrawn_days: "Where the tier's help desk answers around the clock and the plan carries a day on which monitoring was last restored, the days charged for re-synchronisation are counted from that day to the handling day. Where the tier's help desk answers extended hours or business hours only and the twelve months to the handling day carry three or more charges that fell due on the plan, the days charged for re-synchronisation are counted from the due day of the plan's most recent plan fee charge to the handling day, that due day excluded and the handling day included."
      months_withdrawn: "The whole months of the days charged for re-synchronisation are taken by counting thirty days to the month and dropping any part month"
      graphics_edits_12m: "Where the plan's covered points stand above the tier's covered maximum and the twelve months to the handling day carry two or more graphics page edits carried out on the plan, an hour of controls technician time is charged for each whole month of the days charged for re-synchronisation."
      resync_monthly_fee: "No controls technician time is charged for re-synchronising the controls database. Where the plan's covered points stand above the tier's covered maximum and the twelve months to the handling day carry two or more graphics page edits carried out on the plan, an hour of controls technician time is charged for each whole month of the days charged for re-synchronisation. Where the plan's covered points stand above the tier's covered maximum and the twelve months to the handling day carry fewer than two graphics page edits carried out on the plan, half an hour of controls technician time is charged for each whole such month."
      energy_meters: "a tenth of an hour of controls technician time is charged for each meter that subscription covers to back-fill the readings the site did not send"
      energy_source: "Where an energy monitoring subscription the owner holds stands active and reads its data from the controls system, a tenth of an hour of controls technician time is charged for each meter that subscription covers to back-fill the readings the site did not send."
      backfill_fee: "No charge is raised for back-filling the readings the site did not send while it stood unmonitored. Where an energy monitoring subscription the owner holds stands active and reads its data from the controls system, a tenth of an hour of controls technician time is charged for each meter that subscription covers to back-fill the readings the site did not send. Where an energy monitoring subscription the owner holds stands active and reads its data from both the controls system and its own meters, half that back-fill charge is taken."
      updates_12m: "Where the site has stood without monitoring for longer than the tier's restart window and the twelve months to the handling day carry no software update applied to the covered system, half the tier's controls site survey fee is taken."
      survey_share: "No share of the tier's controls site survey fee is taken. Where the site has stood without monitoring for longer than the tier's restart window and the twelve months to the handling day carry no software update applied to the covered system, half the tier's controls site survey fee is taken. Where the site has stood without monitoring for longer than the tier's restart window and the twelve months to the handling day carry at least one software update applied to the covered system, a quarter of that survey fee is taken."
      result: "each element is worked out on its own and the elements are then added together, none of them acting on another; and the rounding is carried out once, on the final sum, to two decimal places"
    factors:
      - id: recommissioning_step
        effect: parameter
        decides: base_fee
        bindings: [withdrawal_span_days, base_fee]
        ladder:
          - when: "the site has stood without monitoring for more than sixty days and the plan's covered points stand above the tier's covered maximum"
            value: "the tier's reinstatement fee raised by forty per cent"
          - when: "the site has stood without monitoring for more than sixty days and the plan's covered points stand at or below the tier's covered maximum"
            value: "the tier's reinstatement fee raised by twenty per cent"
          - when: "otherwise"
            value: "the tier's reinstatement fee"
        baseline:
          base_fee: "P('reinstatement_fee_usd')"
        evidence: [date, tier_param]
        cross_difficulty: null
      - id: gateway_recommissioning_share
        effect: parameter
        decides: gateway_fee
        bindings: [maint_live, gateway_fee]
        ladder:
          - when: "the site has stood without monitoring for more than thirty days and the building carries no maintenance agreement standing active"
            value: "the tier's annual secure remote access gateway fee in full"
          - when: "the site has stood without monitoring for more than thirty days and the building carries a maintenance agreement standing active"
            value: "half the tier's annual secure remote access gateway fee"
          - when: "otherwise"
            value: "a quarter of the tier's annual secure remote access gateway fee"
        baseline:
          gateway_fee: "RND(P('vpn_gateway_fee_usd') * K('quarter_gateway_share'), 2)"
        evidence: [cross_category, date]
        cross_difficulty: maintenance
      - id: resynchronisation_clock_anchor
        effect: method
        decides: withdrawn_days
        bindings: [charge_lines_12m, last_plan_fee_due, withdrawn_days]
        ladder:
          - when: "the tier's help desk answers around the clock and the plan carries a day on which monitoring was last restored"
            method: "the days charged for re-synchronisation are counted from that day to the handling day"
          - when: "the tier's help desk answers extended hours or business hours only and the twelve months to the handling day carry three or more charges that fell due on the plan"
            method: "the days charged for re-synchronisation are counted from the due day of the plan's most recent plan fee charge to the handling day, that due day excluded and the handling day included"
          - when: "otherwise"
            method: "the days charged for re-synchronisation are counted from the day monitoring was withdrawn to the handling day, that day excluded and the handling day included"
        baseline:
          withdrawn_days: "MX(0, DAYS(F('suspension_date'), NOW))"
        evidence: [history, date]
        cross_difficulty: null
      - id: database_resynchronisation_time
        effect: parameter
        decides: resync_monthly_fee
        bindings: [graphics_edits_12m, resync_monthly_fee]
        ladder:
          - when: "the plan's covered points stand above the tier's covered maximum and the twelve months to the handling day carry two or more graphics page edits carried out on the plan"
            value: "an hour of controls technician time for each whole month of the days charged for re-synchronisation"
          - when: "the plan's covered points stand above the tier's covered maximum and the twelve months to the handling day carry fewer than two graphics page edits carried out on the plan"
            value: "half an hour of controls technician time for each whole such month"
          - when: "otherwise"
            value: "no controls technician time at all"
        baseline:
          resync_monthly_fee: "0"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: reading_backfill_charge
        effect: parameter
        decides: backfill_fee
        bindings: [energy_meters, energy_source, backfill_fee]
        ladder:
          - when: "an energy monitoring subscription the owner holds stands active and reads its data from the controls system"
            value: "a tenth of an hour of controls technician time for each meter that subscription covers"
          - when: "an energy monitoring subscription the owner holds stands active and reads its data from both the controls system and its own meters"
            value: "half that back-fill charge"
          - when: "otherwise"
            value: "no back-fill charge at all"
        baseline:
          backfill_fee: "0"
        evidence: [cross_category]
        cross_difficulty: energy
      - id: survey_fee_share
        effect: parameter
        decides: survey_share
        bindings: [updates_12m, survey_share]
        ladder:
          - when: "the site has stood without monitoring for longer than the tier's restart window and the twelve months to the handling day carry no software update applied to the covered system"
            value: "half the tier's controls site survey fee"
          - when: "the site has stood without monitoring for longer than the tier's restart window and the twelve months to the handling day carry at least one software update applied to the covered system"
            value: "a quarter of the tier's controls site survey fee"
          - when: "otherwise"
            value: "no share of the tier's controls site survey fee"
        baseline:
          survey_share: "0"
        evidence: [history, date]
        cross_difficulty: null
    baseline:
      rule: >-
        The reinstatement charge is the tier's reinstatement fee. The days the site has stood without
        monitoring are counted in calendar days from the day monitoring was withdrawn to the handling day,
        that day excluded and the handling day included. A quarter of the tier's annual secure remote access
        gateway fee is taken to re-commission the remote connection. No controls technician time is charged
        for re-synchronising the controls database. No charge is raised for back-filling the readings the site
        did not send while it stood unmonitored. No share of the tier's controls site survey fee is taken. The
        reinstatement charge is the sum of those amounts, rounded to two decimal places.
      params: [reinstatement_fee_usd, vpn_gateway_fee_usd, quarter_gateway_share, controls_technician_rate_usd, site_survey_fee_usd]
    inputs:
      history:
        - {table: controls_events, aggregate: count, field: event_id, within_months: 12, filters: {event_type: controls_invoice_charged}}
        - {table: controls_events, aggregate: latest, field: due_date, within_months: 0, filters: {event_type: controls_invoice_charged, charge_type: plan_fee}}
        - {table: controls_events, aggregate: count, field: event_id, within_months: 12, filters: {event_type: controls_ticket_resolved, request_class: graphics_edit}}
      cross_category: [maintenance, energy]

  - id: controls_ext_alarm_ack_credit
    base_policy_refs: [controls_billing_and_late_fee]
    overwrite: []
    trigger: state_due
    subject: [controls_credit_issued]
    computes: credit_amount_usd
    target_tool: issue_controls_alarm_credit_7b85e02f
    params:
      urgent_parity_ack_minutes: 30
      critical_callout_step_pct: 25
      critical_no_callout_step_pct: 10
      repeat_heavy_pct: 20
      repeat_light_pct: 10
    prerequisite: []
    rule: >
      A monitored alarm the desk never acknowledged is a missed acknowledgement target, and the plan carries a
      credit for it against its next invoice. The alarms credited are the critical alarms the records show
      with no acknowledgement in the twelve months to the handling day. Each alarm credited is credited at the
      tier's alarm response overage fee. No further credit is added for cover the building's maintenance
      agreement carries. The credit is not raised for a run of missed acknowledgements. No further credit is
      added for the readings a monitoring subscription took from the unwatched system. The credit is the
      alarms credited multiplied by what each is credited at, rounded to two decimal places.
      Where the tier's acknowledgement target is thirty minutes or less and the twelve months to the handling day carry at least one urgent alarm the records show with no acknowledgement, the alarms credited are the critical and the urgent alarms alike that the records show with no acknowledgement. Where the tier's acknowledgement target is longer than thirty minutes and the twelve months to the handling day carry at least one urgent alarm the records show with no acknowledgement, the alarms credited are the critical alarms with no acknowledgement together with half the urgent ones, taken down to a whole alarm.
      Where the twelve months to the handling day carry three or more alarms classed as critical and the tier
      includes an after-hours call-out on a critical alarm, each alarm credited is credited at the tier's
      alarm response overage fee raised by twenty-five per cent. Where the twelve months to the handling day
      carry three or more alarms classed as critical and the tier includes no after-hours call-out on a
      critical alarm, each alarm credited is credited at that fee raised by ten per cent.
      Where the building carries a maintenance agreement standing active whose tier includes remote monitoring
      of covered equipment, a further credit is added for each alarm credited of that agreement's own annual
      credit for holding an automation plan, taken over the plan year's included alarm responses. Where the
      building carries a maintenance agreement standing active whose tier does not include remote monitoring
      of covered equipment, half that further credit is added for each alarm credited.
      Where the twelve months to the handling day carry three or more alarms the records show with no
      acknowledgement and fewer than ten monitored alarms raised in all, the credit is raised by twenty per
      cent. Where the twelve months to the handling day carry three or more alarms the records show with no
      acknowledgement and ten or more monitored alarms raised in all, the credit is raised by ten per cent.
      Where an energy monitoring subscription the owner holds stands active and reads its data from the
      controls system, a further credit of one month of that subscription's own fee for each meter it covers
      is added, the readings it took from the unwatched system being unusable. Where an energy monitoring
      subscription the owner holds stands active and reads its data from both the controls system and its own
      meters, half that further credit is added.
      The per-alarm credit and the further credit the maintenance cover carries are added together before the
      alarms credited multiply them; the run-of-missed-acknowledgements uplift acts on that product and on
      nothing else; the subscription credit is added to the result rather than uplifted with it; and the
      rounding is carried out once, on the final sum, to two decimal places.
    cross_category:
      - category: maintenance
        as: branch
        reads: [status, remote_monitoring_included, bundle_credit_with_controls_usd]
        note: The building's maintenance agreement decides the further credit added for each alarm credited.
      - category: energy
        as: branch
        reads: [status, data_source, meters_covered, subscription_fee_per_meter_usd]
        note: The owner's energy monitoring subscription decides the further credit added for the readings taken from the unwatched system.
    compute:
      - unacked_critical: "COUNT('controls_events', within_months=12, date_field='raised_timestamp', event_type='controls_alarm_raised', alarm_class='critical', acknowledged_timestamp='')"
      - unacked_urgent: "COUNT('controls_events', within_months=12, date_field='raised_timestamp', event_type='controls_alarm_raised', alarm_class='urgent', acknowledged_timestamp='')"
      - credited_alarms: "unacked_critical + unacked_urgent if (P('alarm_acknowledge_minutes') <= K('urgent_parity_ack_minutes') and unacked_urgent >= 1) else (unacked_critical + int(unacked_urgent / 2) if (P('alarm_acknowledge_minutes') > K('urgent_parity_ack_minutes') and unacked_urgent >= 1) else unacked_critical)"
      - critical_raised: "COUNT('controls_events', within_months=12, date_field='raised_timestamp', event_type='controls_alarm_raised', alarm_class='critical')"
      - credit_unit: "RND(P('alarm_response_overage_fee_usd') * (1 + K('critical_callout_step_pct') / 100), 2) if (critical_raised >= 3 and P('critical_alarm_call_out_included') == True) else (RND(P('alarm_response_overage_fee_usd') * (1 + K('critical_no_callout_step_pct') / 100), 2) if (critical_raised >= 3 and P('critical_alarm_call_out_included') == False) else P('alarm_response_overage_fee_usd'))"
      - maint_live: "EXISTS('maintenance', status='active')"
      - maint_monitoring: "CPARAM('maintenance','remote_monitoring_included', status='active')"
      - maint_bundle_credit: "CPARAM('maintenance','bundle_credit_with_controls_usd', status='active')"
      - bundled_uplift: "RND(maint_bundle_credit / P('alarm_responses_included_per_year'), 2) if (maint_live and maint_monitoring == True) else (RND(maint_bundle_credit / P('alarm_responses_included_per_year') / 2, 2) if (maint_live and maint_monitoring == False) else 0)"
      - alarms_raised: "COUNT('controls_events', within_months=12, date_field='raised_timestamp', event_type='controls_alarm_raised')"
      - unacked_total: "unacked_critical + unacked_urgent"
      - repeat_step_pct: "K('repeat_heavy_pct') if (unacked_total >= 3 and alarms_raised < 10) else (K('repeat_light_pct') if (unacked_total >= 3 and alarms_raised >= 10) else 0)"
      - energy_meters: "CFIELD('energy','meters_covered', status='active')"
      - energy_source: "CFIELD('energy','data_source', status='active')"
      - data_gap_credit: "RND(CPARAM('energy','subscription_fee_per_meter_usd', status='active') * float(energy_meters) / 12, 2) if (energy_source == 'controls_system' and energy_meters != None) else (RND(CPARAM('energy','subscription_fee_per_meter_usd', status='active') * float(energy_meters) / 24, 2) if (energy_source == 'mixed' and energy_meters != None) else 0)"
      - result: "RND(credited_alarms * (credit_unit + bundled_uplift) * (1 + repeat_step_pct / 100) + data_gap_credit, 2)"
    compute_basis:
      unacked_critical: "The alarms credited are the critical alarms the records show with no acknowledgement in the twelve months to the handling day."
      unacked_urgent: "Where the tier's acknowledgement target is thirty minutes or less and the twelve months to the handling day carry at least one urgent alarm the records show with no acknowledgement, the alarms credited are the critical and the urgent alarms alike that the records show with no acknowledgement."
      credited_alarms: "The alarms credited are the critical alarms the records show with no acknowledgement in the twelve months to the handling day. Where the tier's acknowledgement target is thirty minutes or less and the twelve months to the handling day carry at least one urgent alarm the records show with no acknowledgement, the alarms credited are the critical and the urgent alarms alike that the records show with no acknowledgement. Where the tier's acknowledgement target is longer than thirty minutes and the twelve months to the handling day carry at least one urgent alarm the records show with no acknowledgement, the alarms credited are the critical alarms with no acknowledgement together with half the urgent ones, taken down to a whole alarm."
      critical_raised: "Where the twelve months to the handling day carry three or more alarms classed as critical and the tier includes an after-hours call-out on a critical alarm, each alarm credited is credited at the tier's alarm response overage fee raised by twenty-five per cent."
      credit_unit: "Each alarm credited is credited at the tier's alarm response overage fee. Where the twelve months to the handling day carry three or more alarms classed as critical and the tier includes an after-hours call-out on a critical alarm, each alarm credited is credited at the tier's alarm response overage fee raised by twenty-five per cent. Where the twelve months to the handling day carry three or more alarms classed as critical and the tier includes no after-hours call-out on a critical alarm, each alarm credited is credited at that fee raised by ten per cent."
      maint_live: "Where the building carries a maintenance agreement standing active whose tier includes remote monitoring of covered equipment, a further credit is added for each alarm credited of that agreement's own annual credit for holding an automation plan, taken over the plan year's included alarm responses."
      maint_monitoring: "Where the building carries a maintenance agreement standing active whose tier does not include remote monitoring of covered equipment, half that further credit is added for each alarm credited."
      maint_bundle_credit: "a further credit is added for each alarm credited of that agreement's own annual credit for holding an automation plan, taken over the plan year's included alarm responses"
      bundled_uplift: "No further credit is added for cover the building's maintenance agreement carries. Where the building carries a maintenance agreement standing active whose tier includes remote monitoring of covered equipment, a further credit is added for each alarm credited of that agreement's own annual credit for holding an automation plan, taken over the plan year's included alarm responses. Where the building carries a maintenance agreement standing active whose tier does not include remote monitoring of covered equipment, half that further credit is added for each alarm credited."
      alarms_raised: "Where the twelve months to the handling day carry three or more alarms the records show with no acknowledgement and fewer than ten monitored alarms raised in all, the credit is raised by twenty per cent."
      unacked_total: "Where the twelve months to the handling day carry three or more alarms the records show with no acknowledgement and ten or more monitored alarms raised in all, the credit is raised by ten per cent."
      repeat_step_pct: "The credit is not raised for a run of missed acknowledgements. Where the twelve months to the handling day carry three or more alarms the records show with no acknowledgement and fewer than ten monitored alarms raised in all, the credit is raised by twenty per cent. Where the twelve months to the handling day carry three or more alarms the records show with no acknowledgement and ten or more monitored alarms raised in all, the credit is raised by ten per cent."
      energy_meters: "a further credit of one month of that subscription's own fee for each meter it covers is added"
      energy_source: "Where an energy monitoring subscription the owner holds stands active and reads its data from the controls system, a further credit of one month of that subscription's own fee for each meter it covers is added, the readings it took from the unwatched system being unusable."
      data_gap_credit: "No further credit is added for the readings a monitoring subscription took from the unwatched system. Where an energy monitoring subscription the owner holds stands active and reads its data from the controls system, a further credit of one month of that subscription's own fee for each meter it covers is added, the readings it took from the unwatched system being unusable. Where an energy monitoring subscription the owner holds stands active and reads its data from both the controls system and its own meters, half that further credit is added."
      result: "The per-alarm credit and the further credit the maintenance cover carries are added together before the alarms credited multiply them; the run-of-missed-acknowledgements uplift acts on that product and on nothing else; the subscription credit is added to the result rather than uplifted with it; and the rounding is carried out once, on the final sum, to two decimal places."
    factors:
      - id: alarms_credited_basis
        effect: method
        decides: credited_alarms
        bindings: [unacked_critical, unacked_urgent, credited_alarms]
        ladder:
          - when: "the tier's acknowledgement target is thirty minutes or less and the twelve months to the handling day carry at least one urgent alarm the records show with no acknowledgement"
            method: "the alarms credited are the critical and the urgent alarms alike that the records show with no acknowledgement"
          - when: "the tier's acknowledgement target is longer than thirty minutes and the twelve months to the handling day carry at least one urgent alarm the records show with no acknowledgement"
            method: "the alarms credited are the critical alarms with no acknowledgement together with half the urgent ones, taken down to a whole alarm"
          - when: "otherwise"
            method: "the alarms credited are the critical alarms the records show with no acknowledgement in the twelve months to the handling day"
        baseline:
          credited_alarms: "unacked_critical"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: per_alarm_credit_unit
        effect: parameter
        decides: credit_unit
        bindings: [critical_raised, credit_unit]
        ladder:
          - when: "the twelve months to the handling day carry three or more alarms classed as critical and the tier includes an after-hours call-out on a critical alarm"
            value: "the tier's alarm response overage fee raised by twenty-five per cent"
          - when: "the twelve months to the handling day carry three or more alarms classed as critical and the tier includes no after-hours call-out on a critical alarm"
            value: "the tier's alarm response overage fee raised by ten per cent"
          - when: "otherwise"
            value: "the tier's alarm response overage fee"
        baseline:
          credit_unit: "P('alarm_response_overage_fee_usd')"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: bundled_monitoring_credit
        effect: parameter
        decides: bundled_uplift
        bindings: [maint_live, maint_monitoring, maint_bundle_credit, bundled_uplift]
        ladder:
          - when: "the building carries a maintenance agreement standing active whose tier includes remote monitoring of covered equipment"
            value: "that agreement's own annual credit for holding an automation plan, taken over the plan year's included alarm responses"
          - when: "the building carries a maintenance agreement standing active whose tier does not include remote monitoring of covered equipment"
            value: "half that further credit"
          - when: "otherwise"
            value: "no further credit for cover the maintenance agreement carries"
        baseline:
          bundled_uplift: "0"
        evidence: [cross_category]
        cross_difficulty: maintenance
      - id: repeated_missed_acknowledgement_step
        effect: parameter
        decides: repeat_step_pct
        bindings: [alarms_raised, unacked_total, repeat_step_pct]
        ladder:
          - when: "the twelve months to the handling day carry three or more alarms the records show with no acknowledgement and fewer than ten monitored alarms raised in all"
            value: "a step of twenty per cent on the credit"
          - when: "the twelve months to the handling day carry three or more alarms the records show with no acknowledgement and ten or more monitored alarms raised in all"
            value: "a step of ten per cent on the credit"
          - when: "otherwise"
            value: "no step on the credit"
        baseline:
          repeat_step_pct: "0"
        evidence: [history]
        cross_difficulty: null
      - id: unwatched_reading_credit
        effect: parameter
        decides: data_gap_credit
        bindings: [energy_meters, energy_source, data_gap_credit]
        ladder:
          - when: "an energy monitoring subscription the owner holds stands active and reads its data from the controls system"
            value: "one month of that subscription's own fee for each meter it covers"
          - when: "an energy monitoring subscription the owner holds stands active and reads its data from both the controls system and its own meters"
            value: "half a month of that subscription's own fee for each meter it covers"
          - when: "otherwise"
            value: "no further credit for the readings taken from the unwatched system"
        baseline:
          data_gap_credit: "0"
        evidence: [cross_category]
        cross_difficulty: energy
    baseline:
      rule: >-
        The alarms credited are the critical alarms the records show with no acknowledgement in the twelve
        months to the handling day. Each alarm credited is credited at the tier's alarm response overage fee.
        No further credit is added for cover the building's maintenance agreement carries. The credit is not
        raised for a run of missed acknowledgements. No further credit is added for the readings a monitoring
        subscription took from the unwatched system. The credit is the alarms credited multiplied by what each
        is credited at, rounded to two decimal places.
      params: [alarm_response_overage_fee_usd, alarm_responses_included_per_year]
    inputs:
      history:
        - {table: controls_events, aggregate: count, field: event_id, within_months: 12, filters: {event_type: controls_alarm_raised, alarm_class: critical}}
        - {table: controls_events, aggregate: count, field: event_id, within_months: 12, filters: {event_type: controls_alarm_raised}}
      cross_category: [maintenance, energy]

  - id: controls_ext_upgrade_authorisation
    base_policy_refs: [controls_billing_and_late_fee, controls_portfolio_interaction, controls_software_and_security]
    overwrite:
      - base_policy: controls_software_and_security
        superseded_clause: >-
          elsewhere the upgrade is quoted, with the tier's upgrade labor discount applied, and the manufacturer's
          licence cost is passed through unchanged
        replaced_by: >-
          Where the tier does not include major upgrades, the upgrade labor is quoted at the hours, the rate and
          the discount this rule works out from the plan's records, the tier's upgrade labor discount being the
          starting point those records may raise, and the manufacturer's licence cost is passed through
          unchanged.
    trigger: on_request
    subject: [controls_invoice_charged]
    computes: authorised_labor_usd
    target_tool: authorise_controls_upgrade_c5086d5b
    params:
      large_head_end_hours: 10
      unattended_head_end_hours: 12
      standard_head_end_hours: 8
      fresh_panel_hours: 0.25
      stale_panel_hours: 0.5
      stale_block_hours: 0.5
      standard_panel_hours: 1
      bundled_rate_step_pct: 8
      deferred_discount_points: 15
      light_discount_points: 7
      migration_quarter_hour: 0.25
      migration_eighth_hour: 0.125
      half_credit_share: 0.5
      quarter_credit_share: 0.25
      generation_margin_years: 4
    prerequisite:
      - problem: controls_ext_alarm_ack_credit
        kind: value_input
        gate: standing_credit
        form: state
        policy_source: >-
          The labor the owner is asked to authorise is fixed only after every monitored alarm the records show
          with no acknowledgement carries its credit on the plan's balance.
        condition: >-
          The plan's balance carries a credit entry for the monitored alarms the records show with no
          acknowledgement.
        resolved_by: issue_controls_alarm_credit_7b85e02f
        effect: >-
          The credit standing on the plan rises once the missed acknowledgements are credited, so the binding
          that carries the credit standing on the plan takes a larger value and less labor is authorised.
    rule: >
      A major controls software upgrade that a plan does not carry is quoted to the building owner as labor,
      and the owner authorises the labor themselves before it is booked.
      Where the tier does not include major upgrades, the upgrade labor is quoted at the hours, the rate
      and the discount this rule works out from the plan's records, the tier's upgrade labor discount
      being the starting point those records may raise, and the manufacturer's licence cost is passed
      through unchanged. The labor the owner is asked to
      authorise is fixed only after every monitored alarm the records show with no acknowledgement carries its
      credit on the plan's balance. The hours the upgrade is reckoned to take are a head-end allowance of
      eight hours plus one hour for each panel the plan covers. The hours are priced at the tier's on-site
      controls technician rate, less the tier's upgrade labor discount. Nothing is carried by the office for
      migrating the point map a monitoring subscription reads. None of the credit standing on the plan is set
      against the quoted labor. The labor the owner authorises is the priced hours less what the office
      carries and less the credit set against them, never below nil, rounded to two decimal places.
      Where the plan's covered panels stand at or above the tier's covered panel maximum and the twelve months
      to the handling day carry at least one support ticket closed on site, the head-end allowance is ten
      hours. Where the plan's covered panels stand at or above the tier's covered panel maximum and the twelve
      months to the handling day carry no support ticket closed on site, the head-end allowance is twelve
      hours.
      Where the covered controllers are of a generation at least four years newer than the oldest the tier
      supports and the twelve months to the handling day carry at least one software update applied to the
      covered system, the hours are reckoned at the head-end allowance plus a quarter of an hour for each
      panel the plan covers. Where the covered controllers are of a generation at least four years newer than
      the oldest the tier supports and the twelve months to the handling day carry no software update applied
      to the covered system, the hours are reckoned at the head-end allowance plus half an hour for each panel
      the plan covers and a further half hour for each whole hundred points the plan covers.
      Where the building carries a maintenance agreement standing active whose tier covers repair labor and
      the twelve months to the handling day carry at least one support ticket closed on site, the hours are
      priced at that maintenance agreement's own regular-hours labor rate. Where the building carries a
      maintenance agreement standing active whose tier does not cover repair labor and the twelve months to
      the handling day carry at least one support ticket closed on site, the hours are priced at the tier's
      on-site controls technician rate less eight per cent.
      Where the twelve months to the handling day carry three or more support tickets closed on the plan and
      at least one monitored alarm the records show with no acknowledgement, the tier's upgrade labor discount
      is raised by fifteen points. Where the twelve months to the handling day carry three or more support
      tickets closed on the plan and no monitored alarm the records show with no acknowledgement, the tier's
      upgrade labor discount is raised by seven points.
      Where an energy monitoring subscription the owner holds stands active, reads its data from the controls
      system and covers more meters than its own tier includes, a quarter of an hour of the tier's on-site
      controls technician rate for each meter that subscription covers is carried by the office. Where an
      energy monitoring subscription the owner holds stands active, reads its data from the controls system
      and covers no more meters than its own tier includes, an eighth of an hour for each such meter is
      carried by the office.
      Where the plan's balance carries a credit and the payments received in the twelve months to the handling
      day are at least the charges raised in them, half the credit standing on the plan is set against the
      quoted labor. Where the plan's balance carries a credit and the payments received in the twelve months
      to the handling day are less than the charges raised in them, a quarter of the credit standing on the
      plan is set against the quoted labor.
      The discount acts on the priced hours once and is never combined with any other rate; what the office
      carries and the credit set against the labor are then subtracted from that discounted figure in turn
      rather than from the hours; the result is held at nil where the subtractions would take it below; and
      the rounding is carried out once, on the final sum, to two decimal places.
    cross_category:
      - category: maintenance
        as: branch
        reads: [status, repair_labor_covered, agreement_labor_rate_usd]
        note: The building's maintenance agreement decides the rate the upgrade hours are priced at.
      - category: energy
        as: branch
        reads: [status, data_source, meters_covered, meters_included]
        note: The owner's energy monitoring subscription decides what the office carries for migrating the point map.
    compute:
      - onsite_tickets_12m: "COUNT('controls_events', within_months=12, date_field='resolved_date', event_type='controls_ticket_resolved', resolution_method='onsite')"
      - head_end_hours: "K('large_head_end_hours') if (float(F('panels_covered')) >= P('panels_covered_max') and onsite_tickets_12m >= 1) else (K('unattended_head_end_hours') if (float(F('panels_covered')) >= P('panels_covered_max') and onsite_tickets_12m == 0) else K('standard_head_end_hours'))"
      - point_blocks: "int(float(F('points_covered')) / 100)"
      - updates_12m: "COUNT('controls_events', within_months=12, date_field='applied_date', event_type='controls_software_update_applied')"
      - upgrade_hours: "head_end_hours + K('fresh_panel_hours') * float(F('panels_covered')) if (float(F('controller_generation')) >= P('min_controller_generation') + K('generation_margin_years') and updates_12m >= 1) else (head_end_hours + K('stale_panel_hours') * float(F('panels_covered')) + K('stale_block_hours') * point_blocks if (float(F('controller_generation')) >= P('min_controller_generation') + K('generation_margin_years') and updates_12m == 0) else head_end_hours + K('standard_panel_hours') * float(F('panels_covered')))"
      - maint_live: "EXISTS('maintenance', status='active')"
      - maint_repair_cover: "CPARAM('maintenance','repair_labor_covered', status='active')"
      - maint_labor_rate: "CPARAM('maintenance','agreement_labor_rate_usd', status='active')"
      - technician_rate: "maint_labor_rate if (maint_live and maint_repair_cover == True and onsite_tickets_12m >= 1) else (RND(P('controls_technician_rate_usd') * (1 - K('bundled_rate_step_pct') / 100), 2) if (maint_live and maint_repair_cover == False and onsite_tickets_12m >= 1) else P('controls_technician_rate_usd'))"
      - tickets_closed_12m: "COUNT('controls_events', within_months=12, date_field='resolved_date', event_type='controls_ticket_resolved')"
      - unacked_alarms: "COUNT('controls_events', within_months=12, date_field='raised_timestamp', event_type='controls_alarm_raised', acknowledged_timestamp='')"
      - discount_pct: "P('upgrade_labor_discount_pct') + K('deferred_discount_points') if (tickets_closed_12m >= 3 and unacked_alarms >= 1) else (P('upgrade_labor_discount_pct') + K('light_discount_points') if (tickets_closed_12m >= 3 and unacked_alarms == 0) else P('upgrade_labor_discount_pct'))"
      - quoted_labor: "RND(upgrade_hours * technician_rate * (1 - discount_pct / 100), 2)"
      - energy_meters: "CFIELD('energy','meters_covered', status='active')"
      - energy_source: "CFIELD('energy','data_source', status='active')"
      - energy_meters_included: "CPARAM('energy','meters_included', status='active')"
      - migration_allowance: "RND(K('migration_quarter_hour') * float(energy_meters) * P('controls_technician_rate_usd'), 2) if (energy_source == 'controls_system' and energy_meters != None and float(energy_meters) > energy_meters_included) else (RND(K('migration_eighth_hour') * float(energy_meters) * P('controls_technician_rate_usd'), 2) if (energy_source == 'controls_system' and energy_meters != None and float(energy_meters) <= energy_meters_included) else 0)"
      - standing_credit: "SUM('controls_events','amount_usd', event_type='controls_credit_issued')"
      - charges_12m: "SUM('controls_events','amount_usd', within_months=12, date_field='due_date', event_type='controls_invoice_charged')"
      - payments_12m: "SUM('controls_events','amount_usd', within_months=12, date_field='received_date', event_type='controls_payment_received')"
      - credit_offset: "RND(standing_credit * K('half_credit_share'), 2) if (standing_credit > 0 and payments_12m >= charges_12m) else (RND(standing_credit * K('quarter_credit_share'), 2) if (standing_credit > 0 and payments_12m < charges_12m) else 0)"
      - result: "RND(MX(0, quoted_labor - migration_allowance - credit_offset), 2)"
    compute_basis:
      onsite_tickets_12m: "Where the plan's covered panels stand at or above the tier's covered panel maximum and the twelve months to the handling day carry at least one support ticket closed on site, the head-end allowance is ten hours."
      head_end_hours: "The hours the upgrade is reckoned to take are a head-end allowance of eight hours plus one hour for each panel the plan covers. Where the plan's covered panels stand at or above the tier's covered panel maximum and the twelve months to the handling day carry at least one support ticket closed on site, the head-end allowance is ten hours. Where the plan's covered panels stand at or above the tier's covered panel maximum and the twelve months to the handling day carry no support ticket closed on site, the head-end allowance is twelve hours."
      point_blocks: "a further half hour for each whole hundred points the plan covers"
      updates_12m: "Where the covered controllers are of a generation at least four years newer than the oldest the tier supports and the twelve months to the handling day carry at least one software update applied to the covered system, the hours are reckoned at the head-end allowance plus a quarter of an hour for each panel the plan covers."
      upgrade_hours: "The hours the upgrade is reckoned to take are a head-end allowance of eight hours plus one hour for each panel the plan covers. Where the covered controllers are of a generation at least four years newer than the oldest the tier supports and the twelve months to the handling day carry at least one software update applied to the covered system, the hours are reckoned at the head-end allowance plus a quarter of an hour for each panel the plan covers. Where the covered controllers are of a generation at least four years newer than the oldest the tier supports and the twelve months to the handling day carry no software update applied to the covered system, the hours are reckoned at the head-end allowance plus half an hour for each panel the plan covers and a further half hour for each whole hundred points the plan covers."
      maint_live: "Where the building carries a maintenance agreement standing active whose tier covers repair labor and the twelve months to the handling day carry at least one support ticket closed on site, the hours are priced at that maintenance agreement's own regular-hours labor rate."
      maint_repair_cover: "Where the building carries a maintenance agreement standing active whose tier does not cover repair labor and the twelve months to the handling day carry at least one support ticket closed on site, the hours are priced at the tier's on-site controls technician rate less eight per cent."
      maint_labor_rate: "the hours are priced at that maintenance agreement's own regular-hours labor rate"
      technician_rate: "The hours are priced at the tier's on-site controls technician rate, less the tier's upgrade labor discount. Where the building carries a maintenance agreement standing active whose tier covers repair labor and the twelve months to the handling day carry at least one support ticket closed on site, the hours are priced at that maintenance agreement's own regular-hours labor rate. Where the building carries a maintenance agreement standing active whose tier does not cover repair labor and the twelve months to the handling day carry at least one support ticket closed on site, the hours are priced at the tier's on-site controls technician rate less eight per cent."
      tickets_closed_12m: "Where the twelve months to the handling day carry three or more support tickets closed on the plan and at least one monitored alarm the records show with no acknowledgement, the tier's upgrade labor discount is raised by fifteen points."
      unacked_alarms: "Where the twelve months to the handling day carry three or more support tickets closed on the plan and no monitored alarm the records show with no acknowledgement, the tier's upgrade labor discount is raised by seven points."
      discount_pct: "The hours are priced at the tier's on-site controls technician rate, less the tier's upgrade labor discount. Where the twelve months to the handling day carry three or more support tickets closed on the plan and at least one monitored alarm the records show with no acknowledgement, the tier's upgrade labor discount is raised by fifteen points. Where the twelve months to the handling day carry three or more support tickets closed on the plan and no monitored alarm the records show with no acknowledgement, the tier's upgrade labor discount is raised by seven points."
      quoted_labor: "The discount acts on the priced hours once and is never combined with any other rate"
      energy_meters: "a quarter of an hour of the tier's on-site controls technician rate for each meter that subscription covers is carried by the office"
      energy_source: "Where an energy monitoring subscription the owner holds stands active, reads its data from the controls system and covers more meters than its own tier includes, a quarter of an hour of the tier's on-site controls technician rate for each meter that subscription covers is carried by the office."
      energy_meters_included: "Where an energy monitoring subscription the owner holds stands active, reads its data from the controls system and covers no more meters than its own tier includes, an eighth of an hour for each such meter is carried by the office."
      migration_allowance: "Nothing is carried by the office for migrating the point map a monitoring subscription reads. Where an energy monitoring subscription the owner holds stands active, reads its data from the controls system and covers more meters than its own tier includes, a quarter of an hour of the tier's on-site controls technician rate for each meter that subscription covers is carried by the office. Where an energy monitoring subscription the owner holds stands active, reads its data from the controls system and covers no more meters than its own tier includes, an eighth of an hour for each such meter is carried by the office."
      standing_credit: "Where the plan's balance carries a credit and the payments received in the twelve months to the handling day are at least the charges raised in them, half the credit standing on the plan is set against the quoted labor."
      charges_12m: "the payments received in the twelve months to the handling day are less than the charges raised in them"
      payments_12m: "Where the plan's balance carries a credit and the payments received in the twelve months to the handling day are at least the charges raised in them, half the credit standing on the plan is set against the quoted labor."
      credit_offset: "None of the credit standing on the plan is set against the quoted labor. Where the plan's balance carries a credit and the payments received in the twelve months to the handling day are at least the charges raised in them, half the credit standing on the plan is set against the quoted labor. Where the plan's balance carries a credit and the payments received in the twelve months to the handling day are less than the charges raised in them, a quarter of the credit standing on the plan is set against the quoted labor."
      result: "what the office carries and the credit set against the labor are then subtracted from that discounted figure in turn rather than from the hours; the result is held at nil where the subtractions would take it below; and the rounding is carried out once, on the final sum, to two decimal places"
    factors:
      - id: head_end_allowance
        effect: parameter
        decides: head_end_hours
        bindings: [onsite_tickets_12m, head_end_hours]
        ladder:
          - when: "the plan's covered panels stand at or above the tier's covered panel maximum and the twelve months to the handling day carry at least one support ticket closed on site"
            value: "a head-end allowance of ten hours"
          - when: "the plan's covered panels stand at or above the tier's covered panel maximum and the twelve months to the handling day carry no support ticket closed on site"
            value: "a head-end allowance of twelve hours"
          - when: "otherwise"
            value: "a head-end allowance of eight hours"
        baseline:
          head_end_hours: "K('standard_head_end_hours')"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: upgrade_hours_basis
        effect: method
        decides: upgrade_hours
        bindings: [updates_12m, upgrade_hours]
        ladder:
          - when: "the covered controllers are of a generation at least four years newer than the oldest the tier supports and the twelve months to the handling day carry at least one software update applied to the covered system"
            method: "the hours are reckoned at the head-end allowance plus a quarter of an hour for each panel the plan covers"
          - when: "the covered controllers are of a generation at least four years newer than the oldest the tier supports and the twelve months to the handling day carry no software update applied to the covered system"
            method: "the hours are reckoned at the head-end allowance plus half an hour for each panel the plan covers and a further half hour for each whole hundred points the plan covers"
          - when: "otherwise"
            method: "the hours are reckoned at the head-end allowance plus one hour for each panel the plan covers"
        baseline:
          upgrade_hours: "head_end_hours + K('standard_panel_hours') * float(F('panels_covered'))"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: upgrade_labor_rate
        effect: parameter
        decides: technician_rate
        bindings: [maint_live, maint_repair_cover, maint_labor_rate, technician_rate]
        ladder:
          - when: "the building carries a maintenance agreement standing active whose tier covers repair labor and the twelve months to the handling day carry at least one support ticket closed on site"
            value: "that maintenance agreement's own regular-hours labor rate"
          - when: "the building carries a maintenance agreement standing active whose tier does not cover repair labor and the twelve months to the handling day carry at least one support ticket closed on site"
            value: "the tier's on-site controls technician rate less eight per cent"
          - when: "otherwise"
            value: "the tier's on-site controls technician rate"
        baseline:
          technician_rate: "P('controls_technician_rate_usd')"
        evidence: [cross_category, history]
        cross_difficulty: maintenance
      - id: deferred_upgrade_discount
        effect: parameter
        decides: discount_pct
        bindings: [tickets_closed_12m, unacked_alarms, discount_pct]
        ladder:
          - when: "the twelve months to the handling day carry three or more support tickets closed on the plan and at least one monitored alarm the records show with no acknowledgement"
            value: "the tier's upgrade labor discount raised by fifteen points"
          - when: "the twelve months to the handling day carry three or more support tickets closed on the plan and no monitored alarm the records show with no acknowledgement"
            value: "the tier's upgrade labor discount raised by seven points"
          - when: "otherwise"
            value: "the tier's upgrade labor discount"
        baseline:
          discount_pct: "P('upgrade_labor_discount_pct')"
        evidence: [history]
        cross_difficulty: null
      - id: point_map_migration_carried
        effect: parameter
        decides: migration_allowance
        bindings: [energy_meters, energy_source, energy_meters_included, migration_allowance]
        ladder:
          - when: "an energy monitoring subscription the owner holds stands active, reads its data from the controls system and covers more meters than its own tier includes"
            value: "a quarter of an hour of the tier's on-site controls technician rate for each meter that subscription covers"
          - when: "an energy monitoring subscription the owner holds stands active, reads its data from the controls system and covers no more meters than its own tier includes"
            value: "an eighth of an hour of that rate for each such meter"
          - when: "otherwise"
            value: "nothing carried by the office"
        baseline:
          migration_allowance: "0"
        evidence: [cross_category]
        cross_difficulty: energy
      - id: standing_credit_offset_share
        effect: parameter
        decides: credit_offset
        bindings: [charges_12m, payments_12m, credit_offset]
        ladder:
          - when: "the plan's balance carries a credit and the payments received in the twelve months to the handling day are at least the charges raised in them"
            value: "half the credit standing on the plan"
          - when: "the plan's balance carries a credit and the payments received in the twelve months to the handling day are less than the charges raised in them"
            value: "a quarter of the credit standing on the plan"
          - when: "otherwise"
            value: "none of the credit standing on the plan"
        baseline:
          credit_offset: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The hours the upgrade is reckoned to take are a head-end allowance of eight hours plus one hour for
        each panel the plan covers. The hours are priced at the tier's on-site controls technician rate, less
        the tier's upgrade labor discount. Nothing is carried by the office for migrating the point map a
        monitoring subscription reads. None of the credit standing on the plan is set against the quoted
        labor. The labor the owner authorises is the priced hours less what the office carries and less the
        credit set against them, never below nil, rounded to two decimal places.
      params: [standard_head_end_hours, standard_panel_hours, controls_technician_rate_usd, upgrade_labor_discount_pct]
    inputs:
      history:
        - {table: controls_events, aggregate: count, field: event_id, within_months: 12, filters: {event_type: controls_ticket_resolved}}
        - {table: controls_events, aggregate: sum, field: amount_usd, within_months: 0, filters: {event_type: controls_credit_issued}}
        - {table: controls_events, aggregate: sum, field: amount_usd, within_months: 12, filters: {event_type: controls_payment_received}}
      cross_category: [maintenance, energy]
