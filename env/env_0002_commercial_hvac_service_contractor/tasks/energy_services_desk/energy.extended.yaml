  - id: energy_ext_shortfall_settlement
    base_policy_refs: [energy_savings_guarantee]
    overwrite:
      - base_policy: energy_savings_guarantee
        superseded_clause: >-
          A shortfall arises only where the verified savings for the true-up period fall below the guaranteed
          savings for that period, and the company then pays the tier's shortfall portion of the difference, up to
          the tier's annual guarantee ceiling and never beyond what remains of the year's guarantee.
        replaced_by: >-
          The shortfall paid is the measured shortfall taken at the system share, then at the paid share, then at
          the year share, then held to the guarantee standing and to the tier's annual guarantee ceiling, then
          reduced by the offset, and rounded to the nearest cent once at the end; each share acts on the result
          of the step before it, the holding is applied to that result, the offset is taken off last, and the
          payment is never less than nothing.
    trigger: on_request
    subject: [energy_shortfall_paid]
    computes: amount_usd
    target_tool: pay_savings_shortfall_2f1bc21a
    params:
      unmanaged_system_pct: 60
      part_supported_system_pct: 80
      whole_system_pct: 100
      repeat_step_pct: 10
      further_step_pct: 20
      year_months: 12
      recent_months: 3
    rule: >-
      Where a true-up leaves the measured savings short of the savings guaranteed for the period, the building
      owner is paid against the guarantee. The shortfall paid is the measured shortfall taken at the system share,
      then at the paid share, then at the year share, then held to the guarantee standing and to the tier's annual
      guarantee ceiling, then reduced by the offset, and rounded to the nearest cent once at the end; each share
      acts on the result of the step before it, the holding is applied to that result, the offset is taken off
      last, and the payment is never less than nothing. The shortfall paid against the guarantee is worked out only after a signed-off
      verification of the measured savings for the true-up period stands on the subscription's record.
      The measured shortfall is the savings guaranteed less the savings verified, totalled over every verification
      standing on the subscription and never less than nothing. The system share is the whole of the shortfall. The
      paid share is the tier's shortfall share. The guarantee standing is the guaranteed savings standing on the
      subscription. The year share is the whole year. No offset is taken off the payment.
      Where the tier trues measured savings up once a year, the measured shortfall is the savings guaranteed less
      the savings verified on the latest verification standing on the subscription, and never less than nothing.
      Where the tier trues measured savings up more often than once a year, it is the savings guaranteed less the
      savings verified, totalled over the verifications of the twelve months ending on the day of the payment, and
      never less than nothing. Where the tier trues no measured savings up at all, it is the savings guaranteed
      less the savings verified, totalled over every verification standing on the subscription.
      Where the building holds no automation service plan in active or renewal standing, the system share is the
      unmanaged share, because the sequences the saving depends on are not being kept. Where the building holds
      such a plan and the support hours standing on it for its plan year are exhausted, the system share is the
      part supported share. In every other case the system share is the whole of the shortfall.
      Where exactly one shortfall has been paid on the subscription in the twelve months ending on the day of the
      payment, the paid share is the tier's shortfall share less the repeat step. Where two or more shortfalls have
      been paid on the subscription in those twelve months, the paid share is the tier's shortfall share less the
      further step. In every other case the paid share is the tier's shortfall share.
      Where the guarantee credited for the year stands on the record and a shortfall has been paid against it in
      the twelve months ending on the day of the payment, the guarantee standing is the guarantee credited in those
      twelve months less the shortfalls paid in them. Where the guarantee credited for the year stands on the
      record and no shortfall has been paid against it in those months, the guarantee standing is the guarantee
      credited in them. In every other case the guarantee standing is the guaranteed savings standing on the
      subscription.
      Where a replacement or retrofit project at the building closed inside the twelve months ending on the day of
      the payment and the tier resets its baseline on retrofit, the year share is the whole months of those twelve
      that ran before the project closed, of twelve, because the guarantee stands behind the old plant only for
      the part of the year it ran. Where no such project closed inside those twelve months and the subscription's
      current term began inside them, the year share is the whole months since the term began, of twelve. In every
      other case the year share is the whole year.
      Where the subscription stands suspended, the offset is everything the subscription owes. Where the
      subscription stands active or in its renewal window and an amount stands owed on it, the offset is the
      charges invoiced on it in the recent months ending on the day of the payment less the payments received on it
      in those months. In every other case no offset is taken off the payment.
    prerequisite:
      - problem: energy_ext_savings_verification
        kind: value_input
        gate: guaranteed_latest
        form: state
        policy_source: >-
          The shortfall paid against the guarantee is worked out only after a signed-off verification of the
          measured savings for the true-up period stands on the subscription's record.
        condition: >-
          The subscription's record carries a signed-off verification for the true-up period, with the savings
          guaranteed and the savings measured against the baseline on it.
        resolved_by: verify_period_savings_a6d7fa6e
        effect: >-
          The guaranteed and verified figures the measured shortfall is taken from become those of the signed-off
          verification for the closing period, so the shortfall and the payment are struck on that period.
    cross_category:
      - category: controls
        as: branch
        reads: [status, support_hours_remaining]
        note: The building automation service plan at the same site decides the system share of the shortfall.
      - category: retrofit
        as: branch
        reads: [status, completion_date]
        note: The closed replacement or retrofit project at the same site decides whether the year's ceiling is prorated.
    compute:
      - verified_latest: "float(LATEST('energy_events','verified_savings_usd', date_field='verified_date', event_type='energy_savings_verified') or 0)"
      - guaranteed_latest: "float(LATEST('energy_events','guaranteed_savings_usd', date_field='verified_date', event_type='energy_savings_verified') or 0)"
      - verified_year: "SUM('energy_events','verified_savings_usd', within_months=12, date_field='verified_date', event_type='energy_savings_verified')"
      - guaranteed_year: "SUM('energy_events','guaranteed_savings_usd', within_months=12, date_field='verified_date', event_type='energy_savings_verified')"
      - verified_all: "SUM('energy_events','verified_savings_usd', event_type='energy_savings_verified')"
      - guaranteed_all: "SUM('energy_events','guaranteed_savings_usd', event_type='energy_savings_verified')"
      - measured_shortfall: "MX(0, guaranteed_latest - verified_latest) if P('measurement_true_up_frequency') == 'annual' else (MX(0, guaranteed_year - verified_year) if (P('measurement_true_up_frequency') == 'semiannual' or P('measurement_true_up_frequency') == 'quarterly') else MX(0, guaranteed_all - verified_all))"
      - controls_status: "CFIELD('controls','status', site_id=F('site_id'))"
      - controls_hours: "float(CFIELD('controls','support_hours_remaining', site_id=F('site_id')) or 0)"
      - system_share: "K('unmanaged_system_pct') if not (controls_status == 'active' or controls_status == 'pending_renewal') else (K('part_supported_system_pct') if controls_hours <= 0 else K('whole_system_pct'))"
      - shortfalls_paid_year: "COUNT('energy_events', within_months=12, date_field='paid_date', event_type='energy_shortfall_paid')"
      - paid_share: "P('shortfall_payment_pct') - K('repeat_step_pct') if shortfalls_paid_year == 1 else (P('shortfall_payment_pct') - K('further_step_pct') if shortfalls_paid_year >= 2 else P('shortfall_payment_pct'))"
      - guarantee_credited_year: "SUM('energy_events','guaranteed_savings_usd', within_months=12, date_field='issued_date', event_type='energy_guarantee_credited')"
      - shortfall_amount_year: "SUM('energy_events','amount_usd', within_months=12, date_field='paid_date', event_type='energy_shortfall_paid')"
      - guarantee_standing: "guarantee_credited_year - shortfall_amount_year if (guarantee_credited_year > 0 and shortfalls_paid_year >= 1) else (guarantee_credited_year if (guarantee_credited_year > 0 and shortfalls_paid_year == 0) else float(F('guarantee_pool_remaining') or 0))"
      - term_months_run: "MONTHS(F('term_start_date'), NOW)"
      - months_since_close: "MONTHS(CFIELD('retrofit','completion_date', status='closed', site_id=F('site_id')), NOW)"
      - year_share: "(K('year_months') - months_since_close) * 100 / K('year_months') if (months_since_close <= K('year_months') and P('baseline_reset_on_retrofit')) else (term_months_run * 100 / K('year_months') if (months_since_close > K('year_months') and term_months_run < K('year_months')) else 100)"
      - charges_recent: "SUM('energy_events','amount_usd', within_months=3, date_field='due_date', event_type='energy_invoice_charged')"
      - payments_recent: "SUM('energy_events','amount_usd', within_months=3, date_field='received_date', event_type='energy_payment_received')"
      - owed_offset: "float(F('balance_due') or 0) if F('status') == 'suspended' else (MX(0, charges_recent - payments_recent) if ((F('status') == 'active' or F('status') == 'pending_renewal') and float(F('balance_due') or 0) > 0) else 0)"
      - attributed_shortfall: "measured_shortfall * system_share / 100 * paid_share / 100 * year_share / 100"
      - held_amount: "MN(P('guarantee_cap_usd'), MN(guarantee_standing, attributed_shortfall))"
      - result: "RND(MX(0, held_amount - owed_offset), 2)"
    compute_basis:
      verified_latest: "Where the tier trues measured savings up once a year, the measured shortfall is the savings guaranteed less the savings verified on the latest verification standing on the subscription, and never less than nothing."
      guaranteed_latest: "Where the tier trues measured savings up once a year, the measured shortfall is the savings guaranteed less the savings verified on the latest verification standing on the subscription, and never less than nothing."
      verified_year: "Where the tier trues measured savings up more often than once a year, it is the savings guaranteed less the savings verified, totalled over the verifications of the twelve months ending on the day of the payment, and never less than nothing."
      guaranteed_year: "Where the tier trues measured savings up more often than once a year, it is the savings guaranteed less the savings verified, totalled over the verifications of the twelve months ending on the day of the payment, and never less than nothing."
      verified_all: "The measured shortfall is the savings guaranteed less the savings verified, totalled over every verification standing on the subscription and never less than nothing."
      guaranteed_all: "The measured shortfall is the savings guaranteed less the savings verified, totalled over every verification standing on the subscription and never less than nothing."
      measured_shortfall: "Where the tier trues measured savings up once a year, the measured shortfall is the savings guaranteed less the savings verified on the latest verification standing on the subscription, and never less than nothing. Where the tier trues measured savings up more often than once a year, it is the savings guaranteed less the savings verified, totalled over the verifications of the twelve months ending on the day of the payment, and never less than nothing. Where the tier trues no measured savings up at all, it is the savings guaranteed less the savings verified, totalled over every verification standing on the subscription."
      controls_status: "Where the building holds no automation service plan in active or renewal standing, the system share is the unmanaged share, because the sequences the saving depends on are not being kept."
      controls_hours: "Where the building holds such a plan and the support hours standing on it for its plan year are exhausted, the system share is the part supported share."
      system_share: "Where the building holds no automation service plan in active or renewal standing, the system share is the unmanaged share, because the sequences the saving depends on are not being kept. Where the building holds such a plan and the support hours standing on it for its plan year are exhausted, the system share is the part supported share. In every other case the system share is the whole of the shortfall."
      shortfalls_paid_year: "Where exactly one shortfall has been paid on the subscription in the twelve months ending on the day of the payment, the paid share is the tier's shortfall share less the repeat step."
      paid_share: "Where exactly one shortfall has been paid on the subscription in the twelve months ending on the day of the payment, the paid share is the tier's shortfall share less the repeat step. Where two or more shortfalls have been paid on the subscription in those twelve months, the paid share is the tier's shortfall share less the further step. In every other case the paid share is the tier's shortfall share."
      guarantee_credited_year: "Where the guarantee credited for the year stands on the record and a shortfall has been paid against it in the twelve months ending on the day of the payment, the guarantee standing is the guarantee credited in those twelve months less the shortfalls paid in them."
      shortfall_amount_year: "Where the guarantee credited for the year stands on the record and a shortfall has been paid against it in the twelve months ending on the day of the payment, the guarantee standing is the guarantee credited in those twelve months less the shortfalls paid in them."
      guarantee_standing: "Where the guarantee credited for the year stands on the record and a shortfall has been paid against it in the twelve months ending on the day of the payment, the guarantee standing is the guarantee credited in those twelve months less the shortfalls paid in them. Where the guarantee credited for the year stands on the record and no shortfall has been paid against it in those months, the guarantee standing is the guarantee credited in them. In every other case the guarantee standing is the guaranteed savings standing on the subscription."
      term_months_run: "Where no such project closed inside those twelve months and the subscription's current term began inside them, the year share is the whole months since the term began, of twelve."
      months_since_close: "Where a replacement or retrofit project at the building closed inside the twelve months ending on the day of the payment and the tier resets its baseline on retrofit, the year share is the whole months of those twelve that ran before the project closed, of twelve, because the guarantee stands behind the old plant only for the part of the year it ran."
      year_share: "Where a replacement or retrofit project at the building closed inside the twelve months ending on the day of the payment and the tier resets its baseline on retrofit, the year share is the whole months of those twelve that ran before the project closed, of twelve, because the guarantee stands behind the old plant only for the part of the year it ran. Where no such project closed inside those twelve months and the subscription's current term began inside them, the year share is the whole months since the term began, of twelve. In every other case the year share is the whole year."
      charges_recent: "Where the subscription stands active or in its renewal window and an amount stands owed on it, the offset is the charges invoiced on it in the recent months ending on the day of the payment less the payments received on it in those months."
      payments_recent: "Where the subscription stands active or in its renewal window and an amount stands owed on it, the offset is the charges invoiced on it in the recent months ending on the day of the payment less the payments received on it in those months."
      owed_offset: "Where the subscription stands suspended, the offset is everything the subscription owes. Where the subscription stands active or in its renewal window and an amount stands owed on it, the offset is the charges invoiced on it in the recent months ending on the day of the payment less the payments received on it in those months. In every other case no offset is taken off the payment."
      attributed_shortfall: "The shortfall paid is the measured shortfall taken at the system share, then at the paid share, then at the year share, then held to the guarantee standing and to the tier's annual guarantee ceiling, then reduced by the offset, and rounded to the nearest cent once at the end; each share acts on the result of the step before it, the holding is applied to that result, the offset is taken off last, and the payment is never less than nothing."
      held_amount: "The shortfall paid is the measured shortfall taken at the system share, then at the paid share, then at the year share, then held to the guarantee standing and to the tier's annual guarantee ceiling, then reduced by the offset, and rounded to the nearest cent once at the end; each share acts on the result of the step before it, the holding is applied to that result, the offset is taken off last, and the payment is never less than nothing."
      result: "The shortfall paid is the measured shortfall taken at the system share, then at the paid share, then at the year share, then held to the guarantee standing and to the tier's annual guarantee ceiling, then reduced by the offset, and rounded to the nearest cent once at the end; each share acts on the result of the step before it, the holding is applied to that result, the offset is taken off last, and the payment is never less than nothing."
    factors:
      - id: shortfall_measure
        effect: method
        decides: measured_shortfall
        bindings: [verified_latest, guaranteed_latest, verified_year, guaranteed_year, verified_all, guaranteed_all, measured_shortfall]
        ladder:
          - when: "the tier trues measured savings up once a year"
            method: "the measured shortfall is the savings guaranteed less the savings verified on the latest verification standing on the subscription"
          - when: "the tier trues measured savings up more often than once a year"
            method: "it is the savings guaranteed less the savings verified, totalled over the verifications of the twelve months ending on the day of the payment"
          - when: "the tier trues no measured savings up at all"
            method: "it is the savings guaranteed less the savings verified, totalled over every verification standing on the subscription"
        baseline:
          measured_shortfall: "MX(0, guaranteed_all - verified_all)"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: system_kept
        effect: parameter
        decides: system_share
        bindings: [controls_status, controls_hours, system_share]
        ladder:
          - when: "the building holds no automation service plan in active or renewal standing"
            value: "the unmanaged share"
          - when: "the building holds such a plan and the support hours standing on it for its plan year are exhausted"
            value: "the part supported share"
          - when: "otherwise"
            value: "the whole of the shortfall"
        baseline:
          system_share: "K('whole_system_pct')"
        evidence: [cross_category]
        cross_difficulty: controls
      - id: repeat_payment_share
        effect: parameter
        decides: paid_share
        bindings: [shortfalls_paid_year, paid_share]
        ladder:
          - when: "exactly one shortfall has been paid on the subscription in the twelve months ending on the day of the payment"
            value: "the tier's shortfall share less the repeat step"
          - when: "two or more shortfalls have been paid on the subscription in those twelve months"
            value: "the tier's shortfall share less the further step"
          - when: "otherwise"
            value: "the tier's shortfall share"
        baseline:
          paid_share: "P('shortfall_payment_pct')"
        evidence: [history]
        cross_difficulty: null
      - id: guarantee_standing_basis
        effect: method
        decides: guarantee_standing
        bindings: [guarantee_credited_year, shortfall_amount_year, guarantee_standing]
        ladder:
          - when: "the guarantee credited for the year stands on the record and a shortfall has been paid against it in the twelve months ending on the day of the payment"
            method: "the guarantee standing is the guarantee credited in those twelve months less the shortfalls paid in them"
          - when: "the guarantee credited for the year stands on the record and no shortfall has been paid against it in those months"
            method: "the guarantee standing is the guarantee credited in them"
          - when: "otherwise"
            method: "the guarantee standing is the guaranteed savings standing on the subscription"
        baseline:
          guarantee_standing: "float(F('guarantee_pool_remaining') or 0)"
        evidence: [history]
        cross_difficulty: null
      - id: guarantee_year_share
        effect: parameter
        decides: year_share
        bindings: [term_months_run, months_since_close, year_share]
        ladder:
          - when: "a replacement or retrofit project at the building closed inside the twelve months ending on the day of the payment and the tier resets its baseline on retrofit"
            value: "the whole months of those twelve that ran before the project closed, of twelve"
          - when: "no such project closed inside those twelve months and the subscription's current term began inside them"
            value: "the whole months since the term began, of twelve"
          - when: "otherwise"
            value: "the whole year"
        baseline:
          year_share: "100"
        evidence: [cross_category, date, tier_param]
        cross_difficulty: retrofit
      - id: owed_set_against
        effect: parameter
        decides: owed_offset
        bindings: [charges_recent, payments_recent, owed_offset]
        ladder:
          - when: "the subscription stands suspended"
            value: "everything the subscription owes"
          - when: "the subscription stands active or in its renewal window and an amount stands owed on it"
            value: "the charges invoiced on it in the recent months less the payments received on it in those months"
          - when: "otherwise"
            value: "no offset"
        baseline:
          owed_offset: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        Where a true-up leaves the measured savings short of the savings guaranteed for the period, the building
        owner is paid against the guarantee. The shortfall paid is the measured shortfall taken at the system
        share, then at the paid share, then at the year share, then held to the guarantee standing and to the
        tier's annual guarantee ceiling, then reduced by the offset, and rounded to the nearest cent once at the
        end; each share acts on the result of the step before it, the holding is applied to that result, the
        offset is taken off last, and the payment is never less than nothing. The measured shortfall is the savings guaranteed less the savings
        verified, totalled over every verification standing on the subscription and never less than nothing. The
        system share is the whole of the shortfall. The paid share is the tier's shortfall share. The guarantee
        standing is the guaranteed savings standing on the subscription. The year share is the whole year. No
        offset is taken off the payment.
      params: [shortfall_payment_pct, guarantee_cap_usd, whole_system_pct]
    inputs:
      history:
        - {table: energy_events, aggregate: latest, field: guaranteed_savings_usd, filters: {event_type: energy_savings_verified}}
        - {table: energy_events, aggregate: count, within_months: 12, filters: {event_type: energy_shortfall_paid}}
        - {table: energy_events, aggregate: sum, field: guaranteed_savings_usd, within_months: 12, filters: {event_type: energy_guarantee_credited}}
      cross_category: [controls, retrofit]
