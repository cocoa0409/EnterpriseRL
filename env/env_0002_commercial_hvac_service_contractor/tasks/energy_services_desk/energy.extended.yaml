# Product charter: Energy Monitoring & Performance Subscriptions (category key: energy)
category: energy
display_name: Energy Monitoring & Performance Subscriptions

binding:
  holding_table: energy_subscriptions
  event_tables: [energy_events]
  intake_tables: [energy_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields:
    analyst_hours_remaining: analyst_hour_pool
    guarantee_pool_remaining: savings_guarantee_pool
    balance_due: energy_balance

lifecycle:
  states: [quoted, onboarding, active, suspended, pending_renewal, expired, cancelled, declined]
  transitions:
    - {from: quoted, to: onboarding, by: user, means: The customer accepts the subscription quote and onboarding of meters and data begins.}
    - {from: quoted, to: declined, by: user, means: The customer declines the subscription quote.}
    - {from: onboarding, to: active, by: agent, means: Metering and data collection are commissioned and reporting starts.}
    - {from: onboarding, to: cancelled, by: agent, means: Onboarding fails because the site's data cannot be collected and the subscription is closed.}
    - {from: active, to: pending_renewal, by: system, means: The renewal window opens ahead of the subscription year end.}
    - {from: active, to: suspended, by: agent, means: Reporting and dashboard access are suspended for non-payment.}
    - {from: pending_renewal, to: suspended, by: agent, means: Reporting is suspended during the renewal window.}
    - {from: suspended, to: active, by: agent, means: Reporting is restored once the arrears are cleared.}
    - {from: pending_renewal, to: active, by: agent, means: The subscription is renewed for a further year.}
    - {from: pending_renewal, to: expired, by: system, means: The subscription year ends without renewal.}
    - {from: expired, to: active, by: agent, means: A lapsed subscription is restarted inside the restart window with the same baseline.}
    - {from: active, to: cancelled, by: system, means: A confirmed cancellation notice reaches its effective date.}
    - {from: suspended, to: cancelled, by: agent, means: A suspended subscription is closed out for non-payment.}

accounts:
  - key: analyst_hour_pool
    unit: hours
    meaning: Energy analyst hours the subscription still includes this subscription year; credited at activation and renewal, consumed by the hours logged on each delivered analysis.
  - key: savings_guarantee_pool
    unit: USD
    meaning: The guaranteed savings still standing behind the subscription year; credited at activation and renewal where the tier carries a guarantee, drawn when a verified shortfall is paid out.
  - key: energy_balance
    unit: USD
    meaning: The amount the customer currently owes under the subscription; charges increase it, payments and credits reduce it.

parameter_schema:
  meters_included: Number of interval meters the subscription includes (integer, meters).
  meter_overage_fee_usd: Annual fee per metered point beyond the included meters (USD per meter per year).
  meter_types_supported: Meter kinds the tier reads, a mapping meter kind -> whether it is covered.
  data_interval_minutes: Interval at which metered data is collected (integer, minutes).
  data_retention_months: Months of interval data kept available to the customer (integer, calendar months).
  utility_accounts_included: Number of utility billing accounts tracked (integer, accounts).
  bill_capture_frequency: How often utility bills are captured and checked (enum none, quarterly, monthly).
  bill_error_recovery_included: Whether the analyst pursues utility billing errors on the owner's behalf (boolean).
  dashboard_users_included: Named dashboard users included (integer, users).
  dashboard_user_fee_usd: Annual fee per dashboard user beyond the included users (USD per user per year).
  api_access_included: Whether data access through the reporting interface is included (boolean).
  data_export_on_exit_included: Whether a full data export is provided when the subscription ends (boolean).
  report_frequency: How often the performance report is issued (enum annual, semiannual, quarterly, monthly).
  report_business_days: Business days after the period close by which the report is delivered (integer, business days).
  report_late_credit_pct: Credit of the period's subscription fee when the report is delivered late (percent).
  benchmarking_included: Whether the building is benchmarked against comparable buildings (boolean).
  energy_star_submission_included: Whether the annual energy performance submission is prepared (boolean).
  carbon_reporting_included: Whether emissions reporting is included alongside energy reporting (boolean).
  fault_detection_included: Whether automated fault detection runs against the building data (boolean).
  fdd_rules_enabled: Number of fault detection rules run against the site (integer, rules).
  fault_priority_threshold: Lowest fault priority that is reported to the owner (enum informational, low, medium, high, critical).
  fault_notification_business_days: Business days within which a reportable fault is notified (integer, business days).
  analyst_hours_included_per_year: Energy analyst hours included per subscription year (decimal hours).
  analyst_hour_rate_usd: Rate billed for analyst hours beyond the included pool (USD per hour).
  analysis_turnaround_business_days: Business days to deliver a requested analysis (integer, business days).
  utility_rate_updates_included: Whether the analyst keeps the site's utility rate structure current (boolean).
  demand_response_enrollment_included: Whether enrollment and settlement support for demand response is included (boolean).
  savings_guarantee_included: Whether the tier carries a guaranteed savings commitment (boolean).
  guaranteed_savings_pct: Guaranteed reduction against the baseline for the subscription year (percent).
  guarantee_cap_usd: Ceiling on what the company pays out against the guarantee in one subscription year (USD).
  shortfall_payment_pct: Portion of a verified shortfall the company pays the owner (percent).
  baseline_period_months: Months of data that form the performance baseline (integer, calendar months).
  weather_normalization_included: Whether the baseline and the reported use are weather normalised (boolean).
  mv_protocol_option: Measurement and verification option applied (enum none, option_a, option_b, option_c).
  measurement_true_up_frequency: How often measured savings are trued up against the guarantee (enum none, annual, semiannual, quarterly).
  baseline_reset_on_retrofit: Whether the baseline is reset when a retrofit changes the building (boolean).
  annual_subscription_fee_usd: Annual subscription fee before per-meter and per-user fees (USD per year).
  subscription_fee_per_meter_usd: Annual fee per included meter (USD per meter per year).
  setup_fee_usd: One-time fee to set up the subscription and the baseline (USD).
  meter_install_fee_usd: Fee per interval meter installed at the site (USD per meter).
  data_gateway_fee_usd: Annual fee for the site data gateway (USD per year).
  min_meters_required: Minimum interval meters a site must have for this tier (integer, meters).
  controls_plan_required: Whether an active automation service plan at the site is required for this tier (boolean).
  site_survey_required: Whether an energy site survey is required before the subscription is quoted (boolean).
  site_survey_fee_usd: Fee for the energy site survey, credited against the setup fee when the subscription starts (USD).
  onboarding_days_allowed: Calendar days allowed to commission metering and data before the subscription is reconsidered (integer, calendar days).
  term_months: Length of one subscription term (integer, calendar months).
  billing_frequency: How the subscription fee is invoiced (enum annual, semiannual, quarterly, monthly).
  payment_terms_days: Days from invoice date to due date (integer, calendar days).
  late_fee_pct_per_month: Late fee on an overdue invoice per month (percent per month).
  suspension_after_days_past_due: Days past due after which reporting and dashboard access are suspended (integer, calendar days).
  reinstatement_fee_usd: Fee charged when a suspended or lapsed subscription is restarted (USD).
  restart_window_days: Days after the subscription year end within which a lapsed subscription restarts on the same baseline (integer, calendar days).
  auto_renew: Whether the subscription renews automatically at term end (boolean).
  renewal_window_days: Days before term end at which the renewal window opens (integer, calendar days).
  non_renewal_notice_days: Days before term end by which a non-renewal notice must be received (integer, calendar days).
  annual_escalation_pct: Escalation applied to the subscription fee at each renewal (percent).
  cancellation_notice_days: Days of written notice before a cancellation takes effect (integer, calendar days).
  early_cancellation_fee_pct: Fee on the unbilled remainder of the term when the subscription is cancelled early (percent).

