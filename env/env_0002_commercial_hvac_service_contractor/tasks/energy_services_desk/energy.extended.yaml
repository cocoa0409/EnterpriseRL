events:
  - type: energy_subscription_quoted
    target: energy_subscriptions
    mutation: create
    meaning: An energy monitoring subscription is quoted for a building and the subscription record is opened.
    grain: One row per subscription quoted for one site at one tier.
    fields:
      subscription_id: The reference number of this subscription record.
      customer_id: The building owner quoted.
      site_id: The building the subscription covers.
      variant_name: The subscription tier quoted, written as its official full name.
      status: The lifecycle status, pinned to quoted when the subscription is opened.
      quote_date: The day the subscription quote was issued.
      meters_covered: The number of metered points the quote covers.
      data_source: Where the subscription's data comes from.
      annual_subscription_fee_usd: The annual subscription fee quoted.
    triggers: []
  - type: energy_onboarding_started
    target: energy_subscriptions
    mutation: {transition: {from: quoted, to: onboarding}}
    meaning: The customer accepts the quote and metering and data onboarding begins.
    grain: One row per subscription, changed once when onboarding begins.
    fields:
      status: The lifecycle status, moved to onboarding.
      accepted_date: The day the customer accepted the quote.
      onboarding_due_date: The day by which metering and data must be commissioned.
    triggers:
      - event: energy:energy_invoice_charged
        map: {subscription_id: subscription_id, customer_id: customer_id, charge_type: setup_fee}
  - type: energy_subscription_activated
    target: energy_subscriptions
    mutation: {transition: {from: onboarding, to: active}}
    meaning: Metering and data collection are commissioned, the baseline is fixed and reporting starts.
    grain: One row per subscription, changed once when reporting starts.
    fields:
      status: The lifecycle status, moved to active.
      term_start_date: The first day of the subscription term.
      term_end_date: The last day of the subscription term.
      baseline_start_date: The first day of the baseline period.
      baseline_end_date: The last day of the baseline period.
      baseline_kwh: The baseline annual electricity use fixed for the subscription.
    triggers:
      - event: energy:energy_analyst_hours_credited
        map: {subscription_id: subscription_id, customer_id: customer_id}
      - event: energy:energy_guarantee_credited
        map: {subscription_id: subscription_id, customer_id: customer_id}
  - type: energy_quote_declined
    target: energy_subscriptions
    mutation: {transition: {from: quoted, to: declined}}
    meaning: The customer declines the subscription quote.
    grain: One row per quote, changed once when it is declined.
    fields:
      status: The lifecycle status, moved to declined.
      cancellation_date: The day the quote was declined.
      cancellation_reason: Why the quote was declined.
    triggers: []
  - type: energy_renewal_window_opened
    target: energy_subscriptions
    mutation: {transition: {from: active, to: pending_renewal}}
    meaning: The subscription enters its renewal window and the renewal quote goes out.
    grain: One row per subscription, changed once per term when the renewal window opens.
    fields:
      status: The lifecycle status, moved to pending_renewal.
      renewal_notice_date: The day the renewal window opened.
    triggers: []
  - type: energy_subscription_renewed
    target: energy_subscriptions
    mutation: {transition: {from: pending_renewal, to: active}}
    meaning: The subscription is renewed for a further term at the escalated fee.
    grain: One row per subscription, changed once per renewal.
    fields:
      status: The lifecycle status, moved back to active.
      term_start_date: The first day of the renewed term.
      term_end_date: The last day of the renewed term.
      annual_subscription_fee_usd: The annual subscription fee for the renewed term.
    triggers:
      - event: energy:energy_analyst_hours_credited
        map: {subscription_id: subscription_id, customer_id: customer_id}
      - event: energy:energy_guarantee_credited
        map: {subscription_id: subscription_id, customer_id: customer_id}
  - type: energy_subscription_suspended
    target: energy_subscriptions
    mutation: {transition: [{from: active, to: suspended}, {from: pending_renewal, to: suspended}]}
    meaning: Reporting and dashboard access are withdrawn because the subscription is in arrears.
    grain: One row per subscription, changed once per suspension.
    fields:
      status: The lifecycle status, moved to suspended.
      suspension_date: The day reporting and access were withdrawn.
    triggers: []
  - type: energy_subscription_reinstated
    target: energy_subscriptions
    mutation: {transition: [{from: suspended, to: active}, {from: expired, to: active}]}
    meaning: Reporting and dashboard access are restored on a suspended or lapsed subscription.
    grain: One row per subscription, changed once per reinstatement.
    fields:
      status: The lifecycle status, moved back to active.
      reinstatement_date: The day reporting was restored.
      term_end_date: The last day of the term the subscription is restored into.
    triggers:
      - event: energy:energy_invoice_charged
        map: {subscription_id: subscription_id, customer_id: customer_id, charge_type: reinstatement}
  - type: energy_subscription_expired
    target: energy_subscriptions
    mutation: {transition: {from: pending_renewal, to: expired}}
    meaning: The subscription term ends without a renewal and data collection stops.
    grain: One row per subscription, changed once when the term lapses.
    fields:
      status: The lifecycle status, moved to expired.
      term_end_date: The last day of the term that has just ended.
    triggers: []
  - type: energy_subscription_cancelled
    target: energy_subscriptions
    mutation: {transition: [{from: active, to: cancelled}, {from: suspended, to: cancelled}, {from: onboarding, to: cancelled}]}
    meaning: The subscription is ended before its term end, on notice or because onboarding could not be completed.
    grain: One row per subscription, changed once when it is ended early.
    fields:
      status: The lifecycle status, moved to cancelled.
      cancellation_date: The day the cancellation was recorded.
      termination_effective_date: The day reporting actually stops.
      cancellation_reason: Why the subscription was ended.
    triggers:
      - event: energy:energy_invoice_charged
        when: {cancellation_reason: customer_convenience}
        map: {subscription_id: subscription_id, customer_id: customer_id, charge_type: early_cancellation}
  - type: energy_coverage_updated
    target: energy_subscriptions
    mutation: update
    meaning: The metered points, dashboard users or baseline of a live subscription change.
    grain: One row per subscription, changed once per accepted coverage or baseline change.
    fields:
      meters_covered: The metered point count after the change.
      dashboard_users: The named dashboard user count after the change.
      baseline_kwh: The baseline annual electricity use after a baseline reset.
      annual_subscription_fee_usd: The annual subscription fee after the change.
      last_change_type: What kind of change was applied.
      last_change_date: The day the change took effect.
    triggers:
      - event: energy:energy_invoice_charged
        when: {last_change_type: meters_added}
        map: {subscription_id: subscription_id, customer_id: customer_id, charge_type: meter_overage}
  - type: energy_meter_reading_posted
    target: energy_events
    meaning: A period's metered consumption is posted to the subscription from the meters or the utility bill.
    grain: One row per meter per reading period on one subscription.
    distinguish_by: [meter_ref, billing_period, reading_source, consumption_kwh]
    fields:
      subscription_id: The subscription the reading belongs to.
      customer_id: The building owner the reading belongs to.
      event_type: The event family of this row.
      site_id: The building the reading came from.
      meter_ref: The meter the reading came from.
      billing_period: The period the reading covers.
      reading_source: Where the reading came from.
      consumption_kwh: The electricity recorded for the period.
      demand_kw: The peak demand recorded for the period.
      cost_usd: The utility cost of the period's use.
      posted_date: The day the reading was posted.
    triggers: []
  - type: energy_report_issued
    target: energy_events
    meaning: The period's performance report is delivered to the building owner.
    grain: One row per performance report delivered on one subscription.
    distinguish_by: [billing_period, issued_date, report_class]
    fields:
      subscription_id: The subscription the report belongs to.
      customer_id: The building owner the report is delivered to.
      event_type: The event family of this row.
      billing_period: The period the report covers.
      report_class: What kind of report this is.
      issued_date: The day the report was delivered.
      period_close_date: The day the reported period closed.
    triggers:
      - event: energy:energy_credit_issued
        when: {report_class: performance_report}
        map: {subscription_id: subscription_id, customer_id: customer_id, billing_period: billing_period, credit_reason: late_report}
  - type: energy_analysis_delivered
    target: energy_events
    account: analyst_hour_pool
    direction: out
    meaning: A requested analyst study is delivered and its hours are drawn from the subscription's pool.
    grain: One row per delivered analysis on one subscription.
    distinguish_by: [study_ref, delivered_date, analyst_hours, study_class]
    fields:
      subscription_id: The subscription the study belongs to.
      customer_id: The building owner the study was made for.
      event_type: The event family of this row.
      study_ref: The study reference number.
      study_class: What the study examined.
      requested_date: The day the owner asked for the study.
      delivered_date: The day the study was delivered.
      analyst_hours: The analyst hours logged on the study.
    triggers:
      - event: energy:energy_invoice_charged
        map: {subscription_id: subscription_id, customer_id: customer_id, charge_type: analyst_overage}
  - type: energy_analyst_hours_credited
    target: energy_events
    account: analyst_hour_pool
    direction: in
    meaning: The subscription year's included analyst hours are credited at activation or renewal.
    grain: One row per subscription year crediting of analyst hours.
    distinguish_by: [billing_period, analyst_hours]
    fields:
      subscription_id: The subscription the hours are credited to.
      customer_id: The building owner the subscription belongs to.
      event_type: The event family of this row.
      billing_period: The subscription year the credit belongs to.
      analyst_hours: The analyst hours credited for the year.
    triggers: []
  - type: energy_fault_flagged
    target: energy_events
    meaning: The fault detection rules flag a condition in the building data and the owner is notified.
    grain: One row per flagged fault on one subscription.
    distinguish_by: [fault_ref, flagged_date, fault_priority, equipment_tag]
    fields:
      subscription_id: The subscription the fault was flagged under.
      customer_id: The building owner notified.
      event_type: The event family of this row.
      site_id: The building the fault was found in.
      fault_ref: The fault reference number.
      fault_priority: How serious the flagged condition is.
      equipment_tag: The unit the fault points to.
      flagged_date: The day the rules flagged the condition.
      notified_date: The day the owner was notified.
      estimated_waste_usd: The annualised cost of the condition as estimated by the rules.
    triggers: []
  - type: energy_savings_verified
    target: energy_events
    meaning: Measured savings for a true-up period are verified against the baseline under the tier's protocol.
    grain: One row per true-up period verified on one subscription.
    distinguish_by: [billing_period, verified_date, verified_savings_usd]
    fields:
      subscription_id: The subscription verified.
      customer_id: The building owner the subscription belongs to.
      event_type: The event family of this row.
      billing_period: The true-up period verified.
      verified_date: The day the verification was signed off.
      verified_savings_usd: The savings measured against the baseline for the period.
      guaranteed_savings_usd: The savings guaranteed for the period.
      shortfall_usd: The amount by which the measured savings fell short of the guarantee.
      weather_normalized: Whether the comparison was weather normalised.
    triggers:
      - event: energy:energy_shortfall_paid
        when: {shortfall_flag: shortfall}
        map: {subscription_id: subscription_id, customer_id: customer_id, billing_period: billing_period}
  - type: energy_guarantee_credited
    target: energy_events
    account: savings_guarantee_pool
    direction: in
    meaning: The subscription year's guaranteed savings commitment is credited where the tier carries a guarantee.
    grain: One row per subscription year crediting of the guarantee.
    distinguish_by: [billing_period, guaranteed_savings_usd]
    fields:
      subscription_id: The subscription the guarantee is credited to.
      customer_id: The building owner the subscription belongs to.
      event_type: The event family of this row.
      billing_period: The subscription year the guarantee belongs to.
      guaranteed_savings_usd: The guaranteed savings standing behind the year.
    triggers: []
  - type: energy_shortfall_paid
    target: energy_events
    account: savings_guarantee_pool
    direction: out
    meaning: A verified savings shortfall is paid out to the building owner against the guarantee.
    grain: One row per shortfall payment on one true-up period.
    distinguish_by: [billing_period, paid_date, amount_usd]
    fields:
      subscription_id: The subscription paid against.
      customer_id: The building owner paid.
      event_type: The event family of this row.
      billing_period: The true-up period the payment settles.
      amount_usd: The amount paid against the shortfall.
      paid_date: The day the payment was made.
      shortfall_usd: The verified shortfall the payment settles.
    triggers: []
  - type: energy_invoice_charged
    target: energy_events
    account: energy_balance
    direction: in
    meaning: A subscription fee or an extra energy service is invoiced to the building owner.
    grain: One row per charge line invoiced on one subscription.
    distinguish_by: [invoice_ref, charge_type, amount_usd, billing_period]
    fields:
      subscription_id: The subscription the charge belongs to.
      customer_id: The building owner invoiced.
      event_type: The event family of this row.
      invoice_ref: The invoice the charge was billed on.
      charge_type: Which kind of charge this line is.
      amount_usd: The amount charged.
      billing_period: The period the charge covers.
      due_date: The day the invoice falls due.
    triggers: []
  - type: energy_payment_received
    target: energy_events
    account: energy_balance
    direction: out
    meaning: A payment from the building owner is applied to the subscription balance.
    grain: One row per payment applied to one invoice.
    distinguish_by: [invoice_ref, received_date, amount_usd, payment_method]
    fields:
      subscription_id: The subscription the payment is applied to.
      customer_id: The building owner who paid.
      event_type: The event family of this row.
      invoice_ref: The invoice the payment is applied to.
      amount_usd: The amount paid.
      payment_method: How the payment was made.
      received_date: The day the payment was received.
    triggers: []
  - type: energy_credit_issued
    target: energy_events
    account: energy_balance
    direction: out
    meaning: A credit is issued against the subscription balance, most often for a report delivered late.
    grain: One row per credit issued on one subscription.
    distinguish_by: [invoice_ref, credit_reason, amount_usd, billing_period]
    fields:
      subscription_id: The subscription credited.
      customer_id: The building owner credited.
      event_type: The event family of this row.
      invoice_ref: The invoice the credit is applied against.
      credit_reason: Why the credit was issued.
      amount_usd: The amount credited.
      billing_period: The period the credit falls in.
    triggers: []

measures:
  - id: energy_msr_analyst_hours_used_year
    window: The current subscription year, from term_start_date through term_end_date inclusive.
    measure: Sum of analyst_hours over energy_analysis_delivered rows on this subscription whose delivered_date falls in the window.
  - id: energy_msr_verified_savings_year
    window: The current subscription year, from term_start_date through term_end_date inclusive.
    measure: Sum of verified_savings_usd over energy_savings_verified rows on this subscription whose verified_date falls in the window.
  - id: energy_msr_reportable_faults_open
    window: From the subscription's term_start_date to the handling day.
    measure: Count of energy_fault_flagged rows on this subscription whose fault_priority is at or above the tier's reporting threshold.

policies:
  - id: energy_agg_multi_holding
    subject: [energy_subscription_quoted]
    rule: >-
      A building owner may hold one energy subscription per building and as many buildings as they own. A
      second subscription is not quoted for a site that already holds one in quoted, onboarding, active,
      pending_renewal or suspended status; that subscription's metered points are amended instead. Baselines,
      analyst hours and guarantees are held per subscription and never pooled, because a baseline belongs to
      one building's energy use. Where an owner wants one report across several buildings, the portfolio
      report is drawn from each building's own subscription and each keeps its own true-up.
    eligibility:
      - id: one_live_subscription_per_site
        applies_to: [energy_subscription_quoted]
        kind: dedup
        condition: A second subscription is not quoted for a site that already holds one in quoted, onboarding, active, pending_renewal or suspended status; that subscription's metered points are amended instead.
        evidence_fields: [energy_subscriptions.site_id, energy_subscriptions.status, energy_subscriptions.subscription_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [energy_subscriptions.site_id]
          action_bindings:
            energy_subscriptions.site_id: site_id
        dedup_contract:
          table: energy_subscriptions
          mode: separate_record
          object_bindings: {site_id: site_id}
          duplicate_filters: {status: [quoted, onboarding, active, pending_renewal, suspended]}
          distinct_fields: [variant_name, quote_date]
    params:
      max_per_customer: null

  - id: energy_agg_portfolio_meter_pricing
    subject: [energy_subscription_quoted, energy_coverage_updated, energy_subscription_renewed]
    rule: >-
      Where an owner holds subscriptions at several buildings, the meter count across the portfolio decides
      the per-meter rate step applied to each of them. The count is the sum of meters_covered over the owner's
      subscriptions in onboarding, active or pending_renewal status, the one being priced included; quoted,
      suspended, expired, cancelled and declined subscriptions are not counted. Each subscription is then
      priced from its own tier's annual fee plus its own tier's per-meter fee for its own meters, with the
      portfolio step deciding only the volume discount, never which tier's numbers are used. Meters beyond a
      tier's included count carry the tier's meter overage fee for the remainder of the subscription year,
      prorated by whole months, and dashboard users beyond the included count carry the tier's user fee for
      the same period.
    eligibility: []
    params:
      volume_steps: Portfolio meter bands are 1 to 20 meters, 21 to 60 meters, and above 60 meters.
      per_tier:
        Utility Bill Tracking Subscription: {included_meters: "=meters_included", per_meter_usd: "=subscription_fee_per_meter_usd", overage_usd: "=meter_overage_fee_usd", users: "=dashboard_users_included", user_fee_usd: "=dashboard_user_fee_usd"}
        Metering & Dashboard Subscription: {included_meters: "=meters_included", per_meter_usd: "=subscription_fee_per_meter_usd", overage_usd: "=meter_overage_fee_usd", users: "=dashboard_users_included", user_fee_usd: "=dashboard_user_fee_usd"}
        Energy Analytics Subscription: {included_meters: "=meters_included", per_meter_usd: "=subscription_fee_per_meter_usd", overage_usd: "=meter_overage_fee_usd", users: "=dashboard_users_included", user_fee_usd: "=dashboard_user_fee_usd"}
        Fault Detection & Diagnostics Subscription: {included_meters: "=meters_included", per_meter_usd: "=subscription_fee_per_meter_usd", overage_usd: "=meter_overage_fee_usd", users: "=dashboard_users_included", user_fee_usd: "=dashboard_user_fee_usd"}
        Measurement & Verification Program: {included_meters: "=meters_included", per_meter_usd: "=subscription_fee_per_meter_usd", overage_usd: "=meter_overage_fee_usd", users: "=dashboard_users_included", user_fee_usd: "=dashboard_user_fee_usd"}
        Managed Energy Performance Program: {included_meters: "=meters_included", per_meter_usd: "=subscription_fee_per_meter_usd", overage_usd: "=meter_overage_fee_usd", users: "=dashboard_users_included", user_fee_usd: "=dashboard_user_fee_usd"}
    formula:
      annual_fee_usd: "round(annual_subscription_fee_usd + meters_covered * subscription_fee_per_meter_usd + max(0, meters_covered - meters_included) * meter_overage_fee_usd + data_gateway_fee_usd, 2)"

  - id: energy_subscription_qualification
    subject: [energy_subscription_quoted, energy_quote_declined]
    rule: >-
      A tier is quoted only for a building whose data can actually feed it. The site must carry at least the
      tier's minimum number of interval meters, counted as meters already installed or included in the same
      quote, and the meter kinds must be among those the tier reads. A tier whose automation plan requirement
      is set is quoted only where the same building holds an automation service plan in active or
      pending_renewal status, because the tier's analytics read the controls data. A tier whose site survey
      requirement is set is quoted only when an energy site survey for that building is recorded as completed
      in the office records. Where the building meets no tier's data requirements, the desk offers meter
      installation as a project first and quotes the subscription afterwards.
    eligibility:
      - id: energy_site_survey_completed
        applies_to: [energy_subscription_quoted]
        kind: authorization
        condition: A tier whose site survey requirement is set is quoted only when an energy site survey for that building is recorded as completed in the office records.
        evidence_fields: [energy_requests.site_id, energy_requests.request_type, energy_requests.outcome]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [energy_requests.site_id]
          action_bindings:
            energy_requests.site_id: site_id
      - id: controls_plan_at_site
        applies_to: [energy_subscription_quoted]
        kind: state
        condition: A tier whose automation plan requirement is set is quoted only where the same building holds an automation service plan in active or pending_renewal status, because the tier's analytics read the controls data.
        evidence_fields: [controls_plans.status, controls_plans.site_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [controls_plans.site_id]
          action_bindings:
            controls_plans.site_id: site_id
        state_contract:
          field: controls_plans.status
          allowed: [active, pending_renewal]
    params:
      per_tier:
        Utility Bill Tracking Subscription: {min_meters: "=min_meters_required", controls_required: "=controls_plan_required", survey_required: "=site_survey_required", survey_fee_usd: "=site_survey_fee_usd"}
        Metering & Dashboard Subscription: {min_meters: "=min_meters_required", controls_required: "=controls_plan_required", survey_required: "=site_survey_required", survey_fee_usd: "=site_survey_fee_usd"}
        Energy Analytics Subscription: {min_meters: "=min_meters_required", controls_required: "=controls_plan_required", survey_required: "=site_survey_required", survey_fee_usd: "=site_survey_fee_usd"}
        Fault Detection & Diagnostics Subscription: {min_meters: "=min_meters_required", controls_required: "=controls_plan_required", survey_required: "=site_survey_required", survey_fee_usd: "=site_survey_fee_usd"}
        Measurement & Verification Program: {min_meters: "=min_meters_required", controls_required: "=controls_plan_required", survey_required: "=site_survey_required", survey_fee_usd: "=site_survey_fee_usd"}
        Managed Energy Performance Program: {min_meters: "=min_meters_required", controls_required: "=controls_plan_required", survey_required: "=site_survey_required", survey_fee_usd: "=site_survey_fee_usd"}

  - id: energy_onboarding_and_baseline
    subject: [energy_onboarding_started, energy_subscription_activated, energy_analyst_hours_credited, energy_guarantee_credited]
    rule: >-
      Onboarding begins when the customer's written acceptance of the quote is recorded against the
      subscription, and the setup fee and any meter installation fees are charged then. Metering and data
      collection must be commissioned inside the tier's onboarding period counted forward in calendar days
      from the day the customer accepted the quote, the acceptance day excluded and the final day included;
      where the site cannot deliver data inside that period the subscription is closed and the setup fee is
      refunded less the work actually performed. Reporting starts only once the baseline is fixed: the
      baseline is the tier's baseline period of metered or billed use immediately before the term start,
      weather normalised where the tier normalises, and it is stated in the subscription record rather than
      recomputed at each report. At the start of each subscription year the included analyst hours are
      credited, and where the tier carries a guarantee the year's guaranteed savings are credited alongside
      them; neither carries forward at the year end.
    eligibility:
      - id: acceptance_recorded
        applies_to: [energy_onboarding_started]
        kind: authorization
        condition: Onboarding begins when the customer's written acceptance of the quote is recorded against the subscription, and the setup fee and any meter installation fees are charged then.
        evidence_fields: [energy_requests.subscription_id, energy_requests.request_type, energy_requests.outcome]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [energy_requests.subscription_id]
          action_bindings:
            energy_requests.subscription_id: subscription_id
      - id: onboarding_inside_window
        applies_to: [energy_subscription_activated]
        kind: time
        condition: Metering and data collection must be commissioned inside the tier's onboarding period counted forward in calendar days from the day the customer accepted the quote, the acceptance day excluded and the final day included; where the site cannot deliver data inside that period the subscription is closed and the setup fee is refunded less the work actually performed.
        evidence_fields: [energy_subscriptions.accepted_date, energy_subscriptions.subscription_id, energy_subscriptions.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [energy_subscriptions.subscription_id]
          action_bindings:
            energy_subscriptions.subscription_id: subscription_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the day the customer accepted the quote
          anchor_source: energy_subscriptions.accepted_date
          relation: not_after
          duration_source: variants.onboarding_days_allowed
          unit: calendar_days
          counting_rule: counted forward in calendar days from the day the customer accepted the quote, the acceptance day excluded and the final day included
          boundary: inclusive
    params:
      per_tier:
        Utility Bill Tracking Subscription: {onboarding_days: "=onboarding_days_allowed", baseline_months: "=baseline_period_months", hours_credited: "=analyst_hours_included_per_year", guarantee_pct: "=guaranteed_savings_pct"}
        Metering & Dashboard Subscription: {onboarding_days: "=onboarding_days_allowed", baseline_months: "=baseline_period_months", hours_credited: "=analyst_hours_included_per_year", guarantee_pct: "=guaranteed_savings_pct"}
        Energy Analytics Subscription: {onboarding_days: "=onboarding_days_allowed", baseline_months: "=baseline_period_months", hours_credited: "=analyst_hours_included_per_year", guarantee_pct: "=guaranteed_savings_pct"}
        Fault Detection & Diagnostics Subscription: {onboarding_days: "=onboarding_days_allowed", baseline_months: "=baseline_period_months", hours_credited: "=analyst_hours_included_per_year", guarantee_pct: "=guaranteed_savings_pct"}
        Measurement & Verification Program: {onboarding_days: "=onboarding_days_allowed", baseline_months: "=baseline_period_months", hours_credited: "=analyst_hours_included_per_year", guarantee_pct: "=guaranteed_savings_pct"}
        Managed Energy Performance Program: {onboarding_days: "=onboarding_days_allowed", baseline_months: "=baseline_period_months", hours_credited: "=analyst_hours_included_per_year", guarantee_pct: "=guaranteed_savings_pct"}

  - id: energy_data_and_reporting
    subject: [energy_meter_reading_posted, energy_report_issued]
    rule: >-
      Interval data is collected at the tier's interval and kept available for the tier's retention period,
      and utility bills are captured at the tier's capture frequency for the tier's included billing accounts.
      A reading posted from a utility bill and a reading posted from an interval meter are kept as separate
      records for the same period, and where they disagree the metered reading governs the reports while the
      billed reading governs anything the owner is charged. The performance report is issued at the tier's
      frequency and delivered within the tier's report period, counted in business days after the reported
      period closed on the office calendar, which excludes Saturdays, Sundays and the office holidays
      published for the year. Where a report is delivered later than that period, the tier's late report
      credit of that period's subscription fee is credited to the owner. Benchmarking, energy performance
      submissions and emissions reporting are delivered only at the tiers that include them, and a caller
      asking for one at a tier that does not include it is quoted the analyst hours instead.
    eligibility: []
    params:
      per_tier:
        Utility Bill Tracking Subscription: {interval_minutes: "=data_interval_minutes", retention_months: "=data_retention_months", frequency: "=report_frequency", report_days: "=report_business_days", late_credit_pct: "=report_late_credit_pct"}
        Metering & Dashboard Subscription: {interval_minutes: "=data_interval_minutes", retention_months: "=data_retention_months", frequency: "=report_frequency", report_days: "=report_business_days", late_credit_pct: "=report_late_credit_pct"}
        Energy Analytics Subscription: {interval_minutes: "=data_interval_minutes", retention_months: "=data_retention_months", frequency: "=report_frequency", report_days: "=report_business_days", late_credit_pct: "=report_late_credit_pct"}
        Fault Detection & Diagnostics Subscription: {interval_minutes: "=data_interval_minutes", retention_months: "=data_retention_months", frequency: "=report_frequency", report_days: "=report_business_days", late_credit_pct: "=report_late_credit_pct"}
        Measurement & Verification Program: {interval_minutes: "=data_interval_minutes", retention_months: "=data_retention_months", frequency: "=report_frequency", report_days: "=report_business_days", late_credit_pct: "=report_late_credit_pct"}
        Managed Energy Performance Program: {interval_minutes: "=data_interval_minutes", retention_months: "=data_retention_months", frequency: "=report_frequency", report_days: "=report_business_days", late_credit_pct: "=report_late_credit_pct"}

  - id: energy_analyst_services
    subject: [energy_analysis_delivered]
    rule: >-
      Analyst studies are delivered only while the subscription stands in active or pending_renewal status,
      and each study is delivered inside the tier's turnaround, counted in business days from the day the
      owner asked for it. The hours logged on a delivered study are drawn from the subscription year's pool,
      and once the pool is exhausted the further hours of that study and of every later study are billed at
      the tier's analyst hour rate. A study the analyst starts before the pool is exhausted is not split
      across the boundary: the whole study draws from the pool where the pool covered it at the moment the
      study was commissioned. Utility rate maintenance and demand response settlement are carried out under
      the pool only at the tiers that include them; elsewhere they are quoted as analyst hours before the work
      begins.
    eligibility:
      - id: live_subscription_for_analysis
        applies_to: [energy_analysis_delivered]
        kind: state
        condition: Analyst studies are delivered only while the subscription stands in active or pending_renewal status, and each study is delivered inside the tier's turnaround, counted in business days from the day the owner asked for it.
        evidence_fields: [energy_subscriptions.status, energy_subscriptions.subscription_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [energy_subscriptions.subscription_id]
          action_bindings:
            energy_subscriptions.subscription_id: subscription_id
        state_contract:
          field: energy_subscriptions.status
          allowed: [active, pending_renewal]
    measures: [energy_msr_analyst_hours_used_year]
    params:
      per_tier:
        Utility Bill Tracking Subscription: {hours: "=analyst_hours_included_per_year", rate_usd: "=analyst_hour_rate_usd", turnaround_days: "=analysis_turnaround_business_days"}
        Metering & Dashboard Subscription: {hours: "=analyst_hours_included_per_year", rate_usd: "=analyst_hour_rate_usd", turnaround_days: "=analysis_turnaround_business_days"}
        Energy Analytics Subscription: {hours: "=analyst_hours_included_per_year", rate_usd: "=analyst_hour_rate_usd", turnaround_days: "=analysis_turnaround_business_days"}
        Fault Detection & Diagnostics Subscription: {hours: "=analyst_hours_included_per_year", rate_usd: "=analyst_hour_rate_usd", turnaround_days: "=analysis_turnaround_business_days"}
        Measurement & Verification Program: {hours: "=analyst_hours_included_per_year", rate_usd: "=analyst_hour_rate_usd", turnaround_days: "=analysis_turnaround_business_days"}
        Managed Energy Performance Program: {hours: "=analyst_hours_included_per_year", rate_usd: "=analyst_hour_rate_usd", turnaround_days: "=analysis_turnaround_business_days"}
    formula:
      analyst_overage_usd: "round(max(0, analyst_hours - analyst_hour_pool) * analyst_hour_rate_usd, 2)"

  - id: energy_fault_detection
    subject: [energy_fault_flagged]
    rule: >-
      Automated fault detection runs only at the tiers that include it, with the tier's number of rules
      enabled against the site's data. A flagged condition is reported to the owner only where its priority
      reaches the tier's reporting threshold, and it is notified inside the tier's notification period counted
      in business days from the day the rules flagged it. A flagged fault is a finding, not a work order: it
      becomes work only when the owner asks for it, under the maintenance agreement where the unit is covered
      or as demand service where it is not. Faults below the threshold are held in the data and shown on the
      dashboard without notification. Where the tier includes no fault detection, the analytics do not watch
      for faults at all, and the desk says so rather than promising that nothing has been found.
    eligibility: []
    measures: [energy_msr_reportable_faults_open]
    params:
      per_tier:
        Utility Bill Tracking Subscription: {detection: "=fault_detection_included", rules: "=fdd_rules_enabled", threshold: "=fault_priority_threshold", notify_days: "=fault_notification_business_days"}
        Metering & Dashboard Subscription: {detection: "=fault_detection_included", rules: "=fdd_rules_enabled", threshold: "=fault_priority_threshold", notify_days: "=fault_notification_business_days"}
        Energy Analytics Subscription: {detection: "=fault_detection_included", rules: "=fdd_rules_enabled", threshold: "=fault_priority_threshold", notify_days: "=fault_notification_business_days"}
        Fault Detection & Diagnostics Subscription: {detection: "=fault_detection_included", rules: "=fdd_rules_enabled", threshold: "=fault_priority_threshold", notify_days: "=fault_notification_business_days"}
        Measurement & Verification Program: {detection: "=fault_detection_included", rules: "=fdd_rules_enabled", threshold: "=fault_priority_threshold", notify_days: "=fault_notification_business_days"}
        Managed Energy Performance Program: {detection: "=fault_detection_included", rules: "=fdd_rules_enabled", threshold: "=fault_priority_threshold", notify_days: "=fault_notification_business_days"}

  - id: energy_savings_guarantee
    subject: [energy_savings_verified, energy_shortfall_paid]
    rule: >-
      A savings guarantee stands only at the tiers that carry one. Measured savings are trued up at the
      tier's true-up frequency under the tier's measurement and verification option, comparing the period's
      use against the fixed baseline, weather normalised where the tier normalises. A shortfall arises only
      where the verified savings for the true-up period fall below the guaranteed savings for that period,
      and the company then pays the tier's shortfall portion of the difference, up to the tier's annual
      guarantee ceiling and never beyond what remains of the year's guarantee. Savings above the guarantee in
      one period do not offset a shortfall in another unless the true-up is annual, in which case the year is
      measured as a whole. A shortfall is not paid where the building's use changed outside the company's
      control — occupancy hours, added equipment or a change of tenant — and where the tier resets the
      baseline on retrofit, the baseline is reset at the retrofit's close and the year's guarantee is
      prorated. The payment is made as a credit against the subscription balance unless the owner asks for a
      cheque.
    eligibility:
      - id: verified_shortfall_on_record
        applies_to: [energy_shortfall_paid]
        kind: authorization
        condition: A shortfall arises only where the verified savings for the true-up period fall below the guaranteed savings for that period, and the company then pays the tier's shortfall portion of the difference, up to the tier's annual guarantee ceiling and never beyond what remains of the year's guarantee.
        evidence_fields: [energy_events.verified_savings_usd, energy_events.guaranteed_savings_usd, energy_events.billing_period, energy_events.subscription_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [energy_events.billing_period, energy_events.subscription_id]
          action_bindings:
            energy_events.billing_period: billing_period
            energy_events.subscription_id: subscription_id
    measures: [energy_msr_verified_savings_year]
    params:
      per_tier:
        Utility Bill Tracking Subscription: {guarantee: "=savings_guarantee_included", guarantee_pct: "=guaranteed_savings_pct", cap_usd: "=guarantee_cap_usd", shortfall_pct: "=shortfall_payment_pct", protocol: "=mv_protocol_option"}
        Metering & Dashboard Subscription: {guarantee: "=savings_guarantee_included", guarantee_pct: "=guaranteed_savings_pct", cap_usd: "=guarantee_cap_usd", shortfall_pct: "=shortfall_payment_pct", protocol: "=mv_protocol_option"}
        Energy Analytics Subscription: {guarantee: "=savings_guarantee_included", guarantee_pct: "=guaranteed_savings_pct", cap_usd: "=guarantee_cap_usd", shortfall_pct: "=shortfall_payment_pct", protocol: "=mv_protocol_option"}
        Fault Detection & Diagnostics Subscription: {guarantee: "=savings_guarantee_included", guarantee_pct: "=guaranteed_savings_pct", cap_usd: "=guarantee_cap_usd", shortfall_pct: "=shortfall_payment_pct", protocol: "=mv_protocol_option"}
        Measurement & Verification Program: {guarantee: "=savings_guarantee_included", guarantee_pct: "=guaranteed_savings_pct", cap_usd: "=guarantee_cap_usd", shortfall_pct: "=shortfall_payment_pct", protocol: "=mv_protocol_option"}
        Managed Energy Performance Program: {guarantee: "=savings_guarantee_included", guarantee_pct: "=guaranteed_savings_pct", cap_usd: "=guarantee_cap_usd", shortfall_pct: "=shortfall_payment_pct", protocol: "=mv_protocol_option"}
    formula:
      shortfall_payment_usd: "min(savings_guarantee_pool, min(guarantee_cap_usd, round(max(0, guaranteed_savings_usd - verified_savings_usd) * shortfall_payment_pct / 100, 2)))"

  - id: energy_billing_and_late_fee
    subject: [energy_invoice_charged, energy_payment_received, energy_credit_issued]
    rule: >-
      The subscription fee, the per-meter fees and the gateway fee are invoiced together on the tier's billing
      frequency. Each invoice falls due the tier's payment term after the invoice date, counted in calendar
      days with the invoice day excluded and the due day included, and an invoice unpaid past its due day
      carries the tier's late fee for each month or part month it stays unpaid. Analyst overages, meter
      overages and dashboard user overages are invoiced in the period they arise. Credits — for a late
      report, for a shortfall paid as a credit, or for a billing adjustment — are applied to the next
      subscription invoice rather than refunded, except that a shortfall payment is made by cheque where the
      owner asks for one. Payments are applied to the oldest unpaid invoice unless the owner names one.
    eligibility: []
    params:
      per_tier:
        Utility Bill Tracking Subscription: {frequency: "=billing_frequency", terms_days: "=payment_terms_days", late_fee_pct: "=late_fee_pct_per_month"}
        Metering & Dashboard Subscription: {frequency: "=billing_frequency", terms_days: "=payment_terms_days", late_fee_pct: "=late_fee_pct_per_month"}
        Energy Analytics Subscription: {frequency: "=billing_frequency", terms_days: "=payment_terms_days", late_fee_pct: "=late_fee_pct_per_month"}
        Fault Detection & Diagnostics Subscription: {frequency: "=billing_frequency", terms_days: "=payment_terms_days", late_fee_pct: "=late_fee_pct_per_month"}
        Measurement & Verification Program: {frequency: "=billing_frequency", terms_days: "=payment_terms_days", late_fee_pct: "=late_fee_pct_per_month"}
        Managed Energy Performance Program: {frequency: "=billing_frequency", terms_days: "=payment_terms_days", late_fee_pct: "=late_fee_pct_per_month"}
    formula:
      late_fee_usd: "round(amount_usd * late_fee_pct_per_month / 100, 2)"

  - id: energy_suspension_and_reinstatement
    subject: [energy_subscription_suspended, energy_subscription_reinstated]
    rule: >-
      Reporting and dashboard access are withdrawn once an invoice stays unpaid beyond the tier's suspension
      period counted from the day the invoice fell due, counting calendar days with the due day excluded and
      the final day included. Data collection continues while a subscription is suspended, so the record is
      unbroken when reporting resumes, but no report is issued and no study is delivered meanwhile, and a
      guarantee true-up falling in a suspension is deferred rather than lost. Reporting is restored when the
      arrears are settled and the tier's reinstatement fee is charged. A subscription that lapsed at its term
      end may be restarted on the same baseline only inside the tier's restart window counted forward in
      calendar days from the term end date, the end day excluded and the final day included; past that window
      a new baseline is established from fresh data before the guarantee can stand again.
    eligibility:
      - id: arrears_beyond_suspension_period
        applies_to: [energy_subscription_suspended]
        kind: time
        condition: Reporting and dashboard access are withdrawn once an invoice stays unpaid beyond the tier's suspension period counted from the day the invoice fell due, counting calendar days with the due day excluded and the final day included.
        evidence_fields: [energy_events.due_date, energy_events.invoice_ref, energy_events.amount_usd]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [energy_events.invoice_ref]
          action_bindings:
            energy_events.invoice_ref: invoice_ref
        temporal_basis:
          clock: frozen_time
          anchor_event: the day the invoice fell due
          anchor_source: energy_events.due_date
          relation: not_before
          duration_source: variants.suspension_after_days_past_due
          unit: calendar_days
          counting_rule: counting calendar days with the due day excluded and the final day included
          boundary: inclusive
      - id: restart_on_same_baseline
        applies_to: [energy_subscription_reinstated]
        kind: time
        condition: A subscription that lapsed at its term end may be restarted on the same baseline only inside the tier's restart window counted forward in calendar days from the term end date, the end day excluded and the final day included; past that window a new baseline is established from fresh data before the guarantee can stand again.
        evidence_fields: [energy_subscriptions.term_end_date, energy_subscriptions.subscription_id, energy_subscriptions.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [energy_subscriptions.subscription_id]
          action_bindings:
            energy_subscriptions.subscription_id: subscription_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the term end date
          anchor_source: energy_subscriptions.term_end_date
          relation: not_after
          duration_source: variants.restart_window_days
          unit: calendar_days
          counting_rule: counted forward in calendar days from the term end date, the end day excluded and the final day included
          boundary: inclusive
    params:
      per_tier:
        Utility Bill Tracking Subscription: {suspension_days: "=suspension_after_days_past_due", reinstatement_fee_usd: "=reinstatement_fee_usd", restart_days: "=restart_window_days"}
        Metering & Dashboard Subscription: {suspension_days: "=suspension_after_days_past_due", reinstatement_fee_usd: "=reinstatement_fee_usd", restart_days: "=restart_window_days"}
        Energy Analytics Subscription: {suspension_days: "=suspension_after_days_past_due", reinstatement_fee_usd: "=reinstatement_fee_usd", restart_days: "=restart_window_days"}
        Fault Detection & Diagnostics Subscription: {suspension_days: "=suspension_after_days_past_due", reinstatement_fee_usd: "=reinstatement_fee_usd", restart_days: "=restart_window_days"}
        Measurement & Verification Program: {suspension_days: "=suspension_after_days_past_due", reinstatement_fee_usd: "=reinstatement_fee_usd", restart_days: "=restart_window_days"}
        Managed Energy Performance Program: {suspension_days: "=suspension_after_days_past_due", reinstatement_fee_usd: "=reinstatement_fee_usd", restart_days: "=restart_window_days"}

  - id: energy_renewal_and_exit
    subject: [energy_renewal_window_opened, energy_subscription_renewed, energy_subscription_expired, energy_subscription_cancelled]
    rule: >-
      The renewal window opens the tier's renewal period before the term end date and the renewal quote
      carries the escalated fee and the current meter count. Where the tier renews automatically the term
      renews unless a non-renewal notice was received by the tier's notice deadline, counted back in calendar
      days from the term end date with the deadline day counting as timely; the top tier does not renew
      automatically and needs a renewal acceptance on file for this subscription. A customer may cancel early
      on the tier's written notice period, and the tier's early cancellation rate is applied to the unbilled
      remainder of the term; a guarantee true-up for a part year is settled at cancellation, prorated by
      whole months of the year elapsed. On exit the owner receives the full data export where the tier
      includes it, and the site's interval data is retained for the tier's retention period and then deleted.
      A subscription closed because onboarding failed carries no cancellation fee. The notice period is
      counted in calendar days from the day the written notice was received, the notice day excluded and
      the final day included.
    eligibility:
      - id: renewal_acceptance_on_file
        applies_to: [energy_subscription_renewed]
        kind: authorization
        condition: the top tier does not renew automatically and needs a renewal acceptance on file for this subscription
        evidence_fields: [energy_requests.subscription_id, energy_requests.request_type, energy_requests.outcome]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [energy_requests.subscription_id]
          action_bindings:
            energy_requests.subscription_id: subscription_id
      - id: cancellation_notice_period
        applies_to: [energy_subscription_cancelled]
        kind: time
        condition: A customer may cancel early on the tier's written notice period, and the tier's early cancellation rate is applied to the unbilled remainder of the term; a guarantee true-up for a part year is settled at cancellation, prorated by whole months of the year elapsed.
        evidence_fields: [energy_requests.notice_date, energy_requests.subscription_id, energy_requests.request_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [energy_requests.subscription_id]
          action_bindings:
            energy_requests.subscription_id: subscription_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the tier's written notice period
          anchor_source: energy_requests.notice_date
          relation: not_before
          duration_source: variants.cancellation_notice_days
          unit: calendar_days
          counting_rule: counted in calendar days from the day the written notice was received, the notice day excluded and the final day included
          boundary: inclusive
    params:
      per_tier:
        Utility Bill Tracking Subscription: {window_days: "=renewal_window_days", notice_days: "=non_renewal_notice_days", escalation_pct: "=annual_escalation_pct", cancel_notice_days: "=cancellation_notice_days", cancel_fee_pct: "=early_cancellation_fee_pct"}
        Metering & Dashboard Subscription: {window_days: "=renewal_window_days", notice_days: "=non_renewal_notice_days", escalation_pct: "=annual_escalation_pct", cancel_notice_days: "=cancellation_notice_days", cancel_fee_pct: "=early_cancellation_fee_pct"}
        Energy Analytics Subscription: {window_days: "=renewal_window_days", notice_days: "=non_renewal_notice_days", escalation_pct: "=annual_escalation_pct", cancel_notice_days: "=cancellation_notice_days", cancel_fee_pct: "=early_cancellation_fee_pct"}
        Fault Detection & Diagnostics Subscription: {window_days: "=renewal_window_days", notice_days: "=non_renewal_notice_days", escalation_pct: "=annual_escalation_pct", cancel_notice_days: "=cancellation_notice_days", cancel_fee_pct: "=early_cancellation_fee_pct"}
        Measurement & Verification Program: {window_days: "=renewal_window_days", notice_days: "=non_renewal_notice_days", escalation_pct: "=annual_escalation_pct", cancel_notice_days: "=cancellation_notice_days", cancel_fee_pct: "=early_cancellation_fee_pct"}
        Managed Energy Performance Program: {window_days: "=renewal_window_days", notice_days: "=non_renewal_notice_days", escalation_pct: "=annual_escalation_pct", cancel_notice_days: "=cancellation_notice_days", cancel_fee_pct: "=early_cancellation_fee_pct"}

  - id: energy_portfolio_interaction
    subject: [energy_subscription_quoted, energy_coverage_updated, energy_savings_verified]
    rule: >-
      The subscription reads the rest of the building's cover before it prices or measures anything. Where the
      site's data is drawn from the controls system under an active automation service plan, the point licence
      is carried on that plan and this subscription charges nothing per point for the same points; where there
      is no such plan, the subscription carries its own gateway and per-meter fees. Where a retrofit project
      at the same building reaches completion and the tier resets the baseline on retrofit, the baseline is
      reset from the project's completion date and the guarantee for the part year is prorated, because
      measuring new equipment against old use would credit the company with savings it did not manage. A site
      whose only cover is a demand service rate program may hold the entry tier, which needs no meters, but no
      tier above it, because those tiers read data the building does not produce. Fault findings from this
      subscription are worked under the maintenance agreement where the unit is covered, and the analyst
      hours of this subscription are never spent performing mechanical work.
    eligibility:
      - id: retrofit_completion_resets_baseline
        applies_to: [energy_savings_verified]
        kind: authorization
        condition: Where a retrofit project at the same building reaches completion and the tier resets the baseline on retrofit, the baseline is reset from the project's completion date and the guarantee for the part year is prorated, because measuring new equipment against old use would credit the company with savings it did not manage.
        evidence_fields: [retrofit_projects.site_id, retrofit_projects.status, retrofit_projects.completion_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [retrofit_projects.site_id]
          action_bindings:
            retrofit_projects.site_id: site_id
    params:
      per_tier:
        Utility Bill Tracking Subscription: {baseline_reset: "=baseline_reset_on_retrofit", gateway_fee_usd: "=data_gateway_fee_usd"}
        Metering & Dashboard Subscription: {baseline_reset: "=baseline_reset_on_retrofit", gateway_fee_usd: "=data_gateway_fee_usd"}
        Energy Analytics Subscription: {baseline_reset: "=baseline_reset_on_retrofit", gateway_fee_usd: "=data_gateway_fee_usd"}
        Fault Detection & Diagnostics Subscription: {baseline_reset: "=baseline_reset_on_retrofit", gateway_fee_usd: "=data_gateway_fee_usd"}
        Measurement & Verification Program: {baseline_reset: "=baseline_reset_on_retrofit", gateway_fee_usd: "=data_gateway_fee_usd"}
        Managed Energy Performance Program: {baseline_reset: "=baseline_reset_on_retrofit", gateway_fee_usd: "=data_gateway_fee_usd"}

extended_policies:
  - id: energy_ext_analyst_overage_charge
    base_policy_refs: [energy_billing_and_late_fee, energy_analyst_services]
    overwrite:
      - base_policy: energy_analyst_services
        superseded_clause: >-
          The hours logged on a delivered study are drawn from the subscription year's pool, and once the pool is
          exhausted the further hours of that study and of every later study are billed at the tier's analyst hour
          rate.
        replaced_by: >-
          The charge is the chargeable hours taken at the analyst hour rate, rounded to the nearest cent once at the
          end, and it is never less than nothing.
    trigger: state_due
    subject: [energy_invoice_charged]
    computes: amount_usd
    target_tool: charge_analyst_overage_446fe12a
    params:
      volume_rate_discount_pct: 5
      volume_study_threshold: 5
      grace_hours_first: 2.0
      grace_hours_repeat: 1.0
      pool_year_months: 12
    rule: >-
      Analyst work drawn beyond the hours a subscription year includes is invoiced to the building owner as one
      charge on the subscription, covering the studies already delivered. The chargeable hours are the hours that
      count toward the pool, less the hours the pool provides and less the grace allowance, and never less than
      nothing. The charge is the chargeable hours taken at the analyst hour rate, rounded to the nearest cent once
      at the end, and it is never less than nothing.
      The hours that count toward the pool are the analyst hours logged on studies delivered in the twelve months
      ending on the day the charge is worked out, other than the hours of rate analysis studies and of demand
      response settlement studies. The hours the pool provides are the analyst hours the tier includes for a
      subscription year. No grace allowance is set against the chargeable hours. The analyst hour rate is the rate
      the tier sets for analyst hours beyond the included pool.
      Where the tier trues measured savings up once a year, the hours are gathered by the day the owner asked for
      each study, over the twelve months ending on the day the charge is worked out. Where the tier trues measured
      savings up more often than once a year, the hours are gathered by the day each study was delivered, over the
      six months ending on that day. Where the tier trues no measured savings up at all, the hours are gathered by
      the day each study was delivered, over the twelve months ending on that day.
      Where the tier both keeps the site's utility rate structure current and carries demand response settlement,
      every gathered study's hours count toward the pool. Where the tier keeps the site's utility rate structure
      current but carries no demand response settlement, the hours of gathered demand response settlement studies
      are left out and the rest count. Where the tier keeps neither of them current, the hours of gathered rate
      analysis studies and of gathered demand response settlement studies are both left out.
      Where the subscription's current term began inside the twelve months ending on the day the charge is worked
      out and the subscription stands active, the hours the pool provides are the tier's included hours for a
      subscription year taken in proportion to the whole months the current term has run of a full pool year.
      Where the subscription's current term began before those twelve months and the building's automation service
      plan still carries support hours standing for its plan year, the hours the pool provides are the tier's
      included hours for a subscription year together with those standing support hours, because the analyst reads
      and works the same automation system those support hours are held for. In every other case the hours the pool
      provides are the tier's included hours for a subscription year.
      Where the building's automation service plan stands active or in its renewal window and the subscription
      draws its data from the automation system, the analyst hour rate is the rate that plan sets for support
      hours. Where the building holds no automation service plan in either of those two standings and the studies
      delivered on the subscription in the twelve months ending on the day the charge is worked out reach the
      volume step count, the analyst hour rate is the tier's rate for analyst hours reduced by the volume step.
      In every other case the analyst hour rate is the rate the tier sets for analyst hours beyond the included
      pool.
      Where no charge for analyst hours beyond the pool has ever been invoiced on the subscription and the
      subscription stands active, the opening grace allowance is set against the chargeable hours. Where exactly
      one such charge has already been invoiced on the subscription, the repeat grace allowance is set against
      them. Where two or more such charges have already been invoiced on the subscription, no grace allowance is
      set against the chargeable hours.
    prerequisite: []
    cross_category:
      - category: controls
        as: branch
        reads: [status, support_hours_remaining, support_hour_rate_usd]
        note: The building automation service plan at the same site decides the analyst hour rate and the support hours added to the pool.
    compute:
      - hours_requested_12: "SUM('energy_events','analyst_hours', within_months=12, date_field='requested_date', event_type='energy_analysis_delivered')"
      - hours_delivered_12: "SUM('energy_events','analyst_hours', within_months=12, date_field='delivered_date', event_type='energy_analysis_delivered')"
      - hours_delivered_6: "SUM('energy_events','analyst_hours', within_months=6, date_field='delivered_date', event_type='energy_analysis_delivered')"
      - hours_gathered: "hours_requested_12 if P('measurement_true_up_frequency') == 'annual' else (hours_delivered_6 if (P('measurement_true_up_frequency') == 'semiannual' or P('measurement_true_up_frequency') == 'quarterly') else hours_delivered_12)"
      - hours_demand_response: "SUM('energy_events','analyst_hours', within_months=12, date_field='delivered_date', event_type='energy_analysis_delivered', study_class='demand_response_settlement')"
      - hours_rate_analysis: "SUM('energy_events','analyst_hours', within_months=12, date_field='delivered_date', event_type='energy_analysis_delivered', study_class='rate_analysis')"
      - counted_hours: "hours_gathered if (P('utility_rate_updates_included') and P('demand_response_enrollment_included')) else (hours_gathered - hours_demand_response if (P('utility_rate_updates_included') and not P('demand_response_enrollment_included')) else hours_gathered - hours_demand_response - hours_rate_analysis)"
      - term_months_run: "MONTHS(F('term_start_date'), NOW)"
      - controls_support_left: "CFIELD('controls','support_hours_remaining', site_id=F('site_id'))"
      - included_hours: "P('analyst_hours_included_per_year') * term_months_run / K('pool_year_months') if (term_months_run < K('pool_year_months') and F('status') == 'active') else (P('analyst_hours_included_per_year') + float(controls_support_left or 0) if (term_months_run >= K('pool_year_months') and float(controls_support_left or 0) > 0) else P('analyst_hours_included_per_year'))"
      - controls_status: "CFIELD('controls','status', site_id=F('site_id'))"
      - controls_rate: "CPARAM('controls','support_hour_rate_usd', site_id=F('site_id'))"
      - studies_delivered: "COUNT('energy_events', within_months=12, date_field='delivered_date', event_type='energy_analysis_delivered')"
      - hour_rate: "float(controls_rate or 0) if ((controls_status == 'active' or controls_status == 'pending_renewal') and F('data_source') == 'controls_system') else (P('analyst_hour_rate_usd') * (100 - K('volume_rate_discount_pct')) / 100 if (not (controls_status == 'active' or controls_status == 'pending_renewal') and studies_delivered >= K('volume_study_threshold')) else P('analyst_hour_rate_usd'))"
      - prior_overage_charges: "COUNT('energy_events', event_type='energy_invoice_charged', charge_type='analyst_overage')"
      - grace_hours: "K('grace_hours_first') if (prior_overage_charges == 0 and F('status') == 'active') else (K('grace_hours_repeat') if prior_overage_charges == 1 else 0)"
      - chargeable_hours: "MX(0, counted_hours - included_hours - grace_hours)"
      - result: "RND(MX(0, chargeable_hours * hour_rate), 2)"
    compute_basis:
      hours_requested_12: "Where the tier trues measured savings up once a year, the hours are gathered by the day the owner asked for each study, over the twelve months ending on the day the charge is worked out."
      hours_delivered_12: "Where the tier trues no measured savings up at all, the hours are gathered by the day each study was delivered, over the twelve months ending on that day."
      hours_delivered_6: "Where the tier trues measured savings up more often than once a year, the hours are gathered by the day each study was delivered, over the six months ending on that day."
      hours_gathered: "Where the tier trues measured savings up once a year, the hours are gathered by the day the owner asked for each study, over the twelve months ending on the day the charge is worked out. Where the tier trues measured savings up more often than once a year, the hours are gathered by the day each study was delivered, over the six months ending on that day. Where the tier trues no measured savings up at all, the hours are gathered by the day each study was delivered, over the twelve months ending on that day."
      hours_demand_response: "Where the tier keeps the site's utility rate structure current but carries no demand response settlement, the hours of gathered demand response settlement studies are left out and the rest count."
      hours_rate_analysis: "Where the tier keeps neither of them current, the hours of gathered rate analysis studies and of gathered demand response settlement studies are both left out."
      counted_hours: "Where the tier both keeps the site's utility rate structure current and carries demand response settlement, every gathered study's hours count toward the pool. Where the tier keeps the site's utility rate structure current but carries no demand response settlement, the hours of gathered demand response settlement studies are left out and the rest count. Where the tier keeps neither of them current, the hours of gathered rate analysis studies and of gathered demand response settlement studies are both left out."
      term_months_run: "Where the subscription's current term began inside the twelve months ending on the day the charge is worked out and the subscription stands active, the hours the pool provides are the tier's included hours for a subscription year taken in proportion to the whole months the current term has run of a full pool year."
      controls_support_left: "Where the subscription's current term began before those twelve months and the building's automation service plan still carries support hours standing for its plan year, the hours the pool provides are the tier's included hours for a subscription year together with those standing support hours, because the analyst reads and works the same automation system those support hours are held for."
      included_hours: "Where the subscription's current term began inside the twelve months ending on the day the charge is worked out and the subscription stands active, the hours the pool provides are the tier's included hours for a subscription year taken in proportion to the whole months the current term has run of a full pool year. Where the subscription's current term began before those twelve months and the building's automation service plan still carries support hours standing for its plan year, the hours the pool provides are the tier's included hours for a subscription year together with those standing support hours, because the analyst reads and works the same automation system those support hours are held for. In every other case the hours the pool provides are the tier's included hours for a subscription year."
      controls_status: "Where the building's automation service plan stands active or in its renewal window and the subscription draws its data from the automation system, the analyst hour rate is the rate that plan sets for support hours."
      controls_rate: "Where the building's automation service plan stands active or in its renewal window and the subscription draws its data from the automation system, the analyst hour rate is the rate that plan sets for support hours."
      studies_delivered: "Where the building holds no automation service plan in either of those two standings and the studies delivered on the subscription in the twelve months ending on the day the charge is worked out reach the volume step count, the analyst hour rate is the tier's rate for analyst hours reduced by the volume step."
      hour_rate: "Where the building's automation service plan stands active or in its renewal window and the subscription draws its data from the automation system, the analyst hour rate is the rate that plan sets for support hours. Where the building holds no automation service plan in either of those two standings and the studies delivered on the subscription in the twelve months ending on the day the charge is worked out reach the volume step count, the analyst hour rate is the tier's rate for analyst hours reduced by the volume step. In every other case the analyst hour rate is the rate the tier sets for analyst hours beyond the included pool."
      prior_overage_charges: "Where exactly one such charge has already been invoiced on the subscription, the repeat grace allowance is set against them."
      grace_hours: "Where no charge for analyst hours beyond the pool has ever been invoiced on the subscription and the subscription stands active, the opening grace allowance is set against the chargeable hours. Where exactly one such charge has already been invoiced on the subscription, the repeat grace allowance is set against them. Where two or more such charges have already been invoiced on the subscription, no grace allowance is set against the chargeable hours."
      chargeable_hours: "The chargeable hours are the hours that count toward the pool, less the hours the pool provides and less the grace allowance, and never less than nothing."
      result: "The charge is the chargeable hours taken at the analyst hour rate, rounded to the nearest cent once at the end, and it is never less than nothing."
    factors:
      - id: gathering_window
        effect: method
        decides: hours_gathered
        bindings: [hours_requested_12, hours_delivered_12, hours_delivered_6, hours_gathered]
        ladder:
          - when: "the tier trues measured savings up once a year"
            method: "the hours are gathered by the day the owner asked for each study, over the twelve months ending on the day the charge is worked out"
          - when: "the tier trues measured savings up more often than once a year"
            method: "the hours are gathered by the day each study was delivered, over the six months ending on that day"
          - when: "the tier trues no measured savings up at all"
            method: "the hours are gathered by the day each study was delivered, over the twelve months ending on that day"
        baseline:
          hours_gathered: "hours_delivered_12"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: studies_that_count
        effect: method
        decides: counted_hours
        bindings: [hours_demand_response, hours_rate_analysis, counted_hours]
        ladder:
          - when: "the tier both keeps the site's utility rate structure current and carries demand response settlement"
            method: "every gathered study's hours count toward the pool"
          - when: "the tier keeps the site's utility rate structure current but carries no demand response settlement"
            method: "the hours of gathered demand response settlement studies are left out and the rest count"
          - when: "the tier keeps neither of them current"
            method: "the hours of gathered rate analysis studies and of gathered demand response settlement studies are both left out"
        baseline:
          counted_hours: "hours_gathered - hours_demand_response - hours_rate_analysis"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: pool_provided
        effect: parameter
        decides: included_hours
        bindings: [term_months_run, controls_support_left, included_hours]
        ladder:
          - when: "the subscription's current term began inside the twelve months ending on the day the charge is worked out and the subscription stands active"
            value: "the tier's included hours for a subscription year taken in proportion to the whole months the current term has run of a full pool year"
          - when: "the subscription's current term began before those twelve months and the building's automation service plan still carries support hours standing for its plan year"
            value: "the tier's included hours for a subscription year together with those standing support hours"
          - when: "otherwise"
            value: "the tier's included hours for a subscription year"
        baseline:
          included_hours: "P('analyst_hours_included_per_year')"
        evidence: [date, cross_category, tier_param]
        cross_difficulty: controls
      - id: analyst_hour_rate
        effect: parameter
        decides: hour_rate
        bindings: [controls_status, controls_rate, studies_delivered, hour_rate]
        ladder:
          - when: "the building's automation service plan stands active or in its renewal window and the subscription draws its data from the automation system"
            value: "the rate that plan sets for support hours"
          - when: "the building holds no automation service plan in either of those two standings and the studies delivered on the subscription in the twelve months ending on the day the charge is worked out reach the volume step count"
            value: "the tier's rate for analyst hours reduced by the volume step"
          - when: "otherwise"
            value: "the rate the tier sets for analyst hours beyond the included pool"
        baseline:
          hour_rate: "P('analyst_hour_rate_usd')"
        evidence: [cross_category, history]
        cross_difficulty: controls
      - id: grace_allowance
        effect: parameter
        decides: grace_hours
        bindings: [prior_overage_charges, grace_hours]
        ladder:
          - when: "no charge for analyst hours beyond the pool has ever been invoiced on the subscription and the subscription stands active"
            value: "the opening grace allowance"
          - when: "exactly one such charge has already been invoiced on the subscription"
            value: "the repeat grace allowance"
          - when: "two or more such charges have already been invoiced on the subscription"
            value: "no grace allowance"
        baseline:
          grace_hours: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        Analyst work drawn beyond the hours a subscription year includes is invoiced to the building owner as one
        charge on the subscription, covering the studies already delivered. The chargeable hours are the hours that
        count toward the pool, less the hours the pool provides and less the grace allowance, and never less than
        nothing. The charge is the chargeable hours taken at the analyst hour rate, rounded to the nearest cent once
        at the end, and it is never less than nothing. The hours that count toward the pool are the analyst hours
        logged on studies delivered in the twelve months ending on the day the charge is worked out, other than the
        hours of rate analysis studies and of demand response settlement studies. The hours the pool provides are
        the analyst hours the tier includes for a subscription year. No grace allowance is set against the
        chargeable hours. The analyst hour rate is the rate the tier sets for analyst hours beyond the included
        pool.
      params: [analyst_hours_included_per_year, analyst_hour_rate_usd]
    inputs:
      history:
        - {table: energy_events, aggregate: sum, field: analyst_hours, within_months: 12, filters: {event_type: energy_analysis_delivered}}
        - {table: energy_events, aggregate: count, filters: {event_type: energy_invoice_charged, charge_type: analyst_overage}}
      cross_category: [controls]
  - id: energy_ext_subscription_settlement_payment
    base_policy_refs: [energy_billing_and_late_fee]
    overwrite:
      - base_policy: energy_billing_and_late_fee
        superseded_clause: >-
          Credits — for a late report, for a shortfall paid as a credit, or for a billing adjustment — are applied
          to the next subscription invoice rather than refunded, except that a shortfall payment is made by cheque
          where the owner asks for one.
        replaced_by: >-
          The credits set against it are every credit standing on the subscription.
    trigger: on_request
    subject: [energy_payment_received]
    computes: amount_usd
    target_tool: settle_subscription_balance_535836bf
    params:
      allowance_pct_clean: 2
      allowance_pct_light: 1
      payment_count_threshold: 3
      charge_count_threshold: 3
      allowance_cap_long: 250
      allowance_cap_established: 150
      allowance_cap_new: 60
      term_months_long: 18
      term_months_established: 6
      threshold_short_cycle: 500
      threshold_quiet_cycle: 1500
      threshold_annual: 6000
      recent_months: 3
      record_months: 12
    rule: >-
      A building owner who asks to settle an energy monitoring subscription in one payment is quoted the sum that
      clears it, and that sum is worked out from the subscription's own ledger rather than from the balance the
      dashboard displays. The amount owed is every charge invoiced on the subscription, less every payment received
      on it and less the credits set against it, and never less than nothing. The settlement allowance is worked out
      on the amount owed at the allowance rate, rounded to the nearest cent, and it is never more than the allowance
      ceiling; it is granted only where the amount owed reaches the qualifying amount, and where the amount owed
      falls short of that amount no allowance is granted at all. The sum the owner settles is the amount owed less
      the settlement allowance, rounded to the nearest cent once at the end, and never less than nothing. The sum
      is entered as one payment applied to the oldest invoice standing unpaid on the subscription, whatever else
      it clears. The sum the owner settles is fixed only after the charge owed for the analyst hours drawn beyond the year's included
      pool stands invoiced on the subscription.
      The credits set against it are every credit standing on the subscription. No settlement allowance is granted
      against the amount owed. The allowance ceiling is the opening ceiling. The qualifying amount is the long cycle
      qualifying amount.
      Where the subscription stands suspended, none of the credits standing on it are set against the amount owed
      and they stand to the next invoice instead. Where the subscription stands active or in its renewal window and
      a credit was issued on it in the recent months ending on the day of settlement, only the credits issued in
      those months are set against the amount owed. Where the subscription stands active or in its renewal window
      and no credit was issued on it in those months, every credit standing on it is set against the amount owed.
      Where no late charge has been invoiced on the subscription in the record months ending on the day of
      settlement and the payments received on it in those months reach the settled payment count, the allowance rate
      is the clean record rate. Where no late charge has been invoiced on the subscription in those months and the
      payments received on it in them fall short of that count, the allowance rate is the light record rate. Where a
      late charge has been invoiced on the subscription in those months, no allowance rate is granted.
      Where the subscription's current term has run the long standing count of whole months or more and the
      subscription stands active, the allowance ceiling is the long standing ceiling. Where the subscription's
      current term has run the established count of whole months or more but fewer than the long standing count and
      the subscription stands active, the allowance ceiling is the established ceiling. In every other case the
      allowance ceiling is the opening ceiling.
      Where the subscription's fee is invoiced monthly or quarterly and the charges invoiced on it in the recent
      months ending on the day of settlement reach the recent charge count, the qualifying amount is the short cycle
      qualifying amount. Where the subscription's fee is invoiced monthly or quarterly and the charges invoiced on
      it in those months fall short of that count, the qualifying amount is the quiet cycle qualifying amount. In
      every other case the qualifying amount is the long cycle qualifying amount.
    prerequisite:
      - problem: energy_ext_analyst_overage_charge
        kind: value_input
        gate: charges_all
        form: state
        policy_source: >-
          The sum the owner settles is fixed only after the charge owed for the analyst hours drawn beyond the
          year's included pool stands invoiced on the subscription.
        condition: >-
          The subscription's ledger carries an invoiced charge for the analyst hours drawn beyond the hours the
          subscription year includes, covering every study delivered inside the current gathering window and not
          only studies invoiced in an earlier period.
        resolved_by: charge_analyst_overage_446fe12a
        effect: >-
          The total of the charges invoiced on the subscription rises by that charge, and the amount owed and the
          sum the owner settles rise with it.
    cross_category: []
    compute:
      - charges_all: "SUM('energy_events','amount_usd', event_type='energy_invoice_charged')"
      - payments_all: "SUM('energy_events','amount_usd', event_type='energy_payment_received')"
      - credits_all: "SUM('energy_events','amount_usd', event_type='energy_credit_issued')"
      - credits_recent: "SUM('energy_events','amount_usd', within_months=3, date_field='issued_date', event_type='energy_credit_issued')"
      - applied_credits: "0 if F('status') == 'suspended' else (credits_recent if ((F('status') == 'active' or F('status') == 'pending_renewal') and credits_recent > 0) else credits_all)"
      - late_charges_record: "COUNT('energy_events', within_months=12, date_field='due_date', event_type='energy_invoice_charged', charge_type='late_fee')"
      - payments_record: "COUNT('energy_events', within_months=12, date_field='received_date', event_type='energy_payment_received')"
      - allowance_pct: "K('allowance_pct_clean') if (late_charges_record == 0 and payments_record >= K('payment_count_threshold')) else (K('allowance_pct_light') if (late_charges_record == 0 and payments_record < K('payment_count_threshold')) else 0)"
      - term_months_run: "MONTHS(F('term_start_date'), NOW)"
      - allowance_cap_usd: "K('allowance_cap_long') if (term_months_run >= K('term_months_long') and F('status') == 'active') else (K('allowance_cap_established') if (term_months_run >= K('term_months_established') and term_months_run < K('term_months_long') and F('status') == 'active') else K('allowance_cap_new'))"
      - charges_recent: "COUNT('energy_events', within_months=3, date_field='due_date', event_type='energy_invoice_charged')"
      - qualifying_threshold: "K('threshold_short_cycle') if ((P('billing_frequency') == 'monthly' or P('billing_frequency') == 'quarterly') and charges_recent >= K('charge_count_threshold')) else (K('threshold_quiet_cycle') if ((P('billing_frequency') == 'monthly' or P('billing_frequency') == 'quarterly') and charges_recent < K('charge_count_threshold')) else K('threshold_annual'))"
      - net_owed: "MX(0, charges_all - payments_all - applied_credits)"
      - allowance: "MN(allowance_cap_usd, RND(net_owed * allowance_pct / 100, 2)) if net_owed >= qualifying_threshold else 0"
      - result: "RND(MX(0, net_owed - allowance), 2)"
    compute_basis:
      charges_all: "The amount owed is every charge invoiced on the subscription, less every payment received on it and less the credits set against it, and never less than nothing."
      payments_all: "The amount owed is every charge invoiced on the subscription, less every payment received on it and less the credits set against it, and never less than nothing."
      credits_all: "The credits set against it are every credit standing on the subscription."
      credits_recent: "Where the subscription stands active or in its renewal window and a credit was issued on it in the recent months ending on the day of settlement, only the credits issued in those months are set against the amount owed."
      applied_credits: "Where the subscription stands suspended, none of the credits standing on it are set against the amount owed and they stand to the next invoice instead. Where the subscription stands active or in its renewal window and a credit was issued on it in the recent months ending on the day of settlement, only the credits issued in those months are set against the amount owed. Where the subscription stands active or in its renewal window and no credit was issued on it in those months, every credit standing on it is set against the amount owed."
      late_charges_record: "Where a late charge has been invoiced on the subscription in those months, no allowance rate is granted."
      payments_record: "Where no late charge has been invoiced on the subscription in the record months ending on the day of settlement and the payments received on it in those months reach the settled payment count, the allowance rate is the clean record rate."
      allowance_pct: "Where no late charge has been invoiced on the subscription in the record months ending on the day of settlement and the payments received on it in those months reach the settled payment count, the allowance rate is the clean record rate. Where no late charge has been invoiced on the subscription in those months and the payments received on it in them fall short of that count, the allowance rate is the light record rate. Where a late charge has been invoiced on the subscription in those months, no allowance rate is granted."
      term_months_run: "Where the subscription's current term has run the long standing count of whole months or more and the subscription stands active, the allowance ceiling is the long standing ceiling."
      allowance_cap_usd: "Where the subscription's current term has run the long standing count of whole months or more and the subscription stands active, the allowance ceiling is the long standing ceiling. Where the subscription's current term has run the established count of whole months or more but fewer than the long standing count and the subscription stands active, the allowance ceiling is the established ceiling. In every other case the allowance ceiling is the opening ceiling."
      charges_recent: "Where the subscription's fee is invoiced monthly or quarterly and the charges invoiced on it in the recent months ending on the day of settlement reach the recent charge count, the qualifying amount is the short cycle qualifying amount."
      qualifying_threshold: "Where the subscription's fee is invoiced monthly or quarterly and the charges invoiced on it in the recent months ending on the day of settlement reach the recent charge count, the qualifying amount is the short cycle qualifying amount. Where the subscription's fee is invoiced monthly or quarterly and the charges invoiced on it in those months fall short of that count, the qualifying amount is the quiet cycle qualifying amount. In every other case the qualifying amount is the long cycle qualifying amount."
      net_owed: "The amount owed is every charge invoiced on the subscription, less every payment received on it and less the credits set against it, and never less than nothing."
      allowance: "The settlement allowance is worked out on the amount owed at the allowance rate, rounded to the nearest cent, and it is never more than the allowance ceiling; it is granted only where the amount owed reaches the qualifying amount, and where the amount owed falls short of that amount no allowance is granted at all."
      result: "The sum the owner settles is the amount owed less the settlement allowance, rounded to the nearest cent once at the end, and never less than nothing."
    factors:
      - id: credits_set_against
        effect: method
        decides: applied_credits
        bindings: [credits_all, credits_recent, applied_credits]
        ladder:
          - when: "the subscription stands suspended"
            method: "none of the credits standing on it are set against the amount owed and they stand to the next invoice instead"
          - when: "the subscription stands active or in its renewal window and a credit was issued on it in the recent months ending on the day of settlement"
            method: "only the credits issued in those months are set against the amount owed"
          - when: "the subscription stands active or in its renewal window and no credit was issued on it in those months"
            method: "every credit standing on it is set against the amount owed"
        baseline:
          applied_credits: "credits_all"
        evidence: [history]
        cross_difficulty: null
      - id: allowance_rate
        effect: parameter
        decides: allowance_pct
        bindings: [late_charges_record, payments_record, allowance_pct]
        ladder:
          - when: "no late charge has been invoiced on the subscription in the record months ending on the day of settlement and the payments received on it in those months reach the settled payment count"
            value: "the clean record rate"
          - when: "no late charge has been invoiced on the subscription in those months and the payments received on it in them fall short of that count"
            value: "the light record rate"
          - when: "a late charge has been invoiced on the subscription in those months"
            value: "no allowance rate"
        baseline:
          allowance_pct: "0"
        evidence: [history]
        cross_difficulty: null
      - id: allowance_ceiling
        effect: parameter
        decides: allowance_cap_usd
        bindings: [term_months_run, allowance_cap_usd]
        ladder:
          - when: "the subscription's current term has run the long standing count of whole months or more and the subscription stands active"
            value: "the long standing ceiling"
          - when: "the subscription's current term has run the established count of whole months or more but fewer than the long standing count and the subscription stands active"
            value: "the established ceiling"
          - when: "otherwise"
            value: "the opening ceiling"
        baseline:
          allowance_cap_usd: "K('allowance_cap_new')"
        evidence: [date]
        cross_difficulty: null
      - id: qualifying_amount
        effect: parameter
        decides: qualifying_threshold
        bindings: [charges_recent, qualifying_threshold]
        ladder:
          - when: "the subscription's fee is invoiced monthly or quarterly and the charges invoiced on it in the recent months ending on the day of settlement reach the recent charge count"
            value: "the short cycle qualifying amount"
          - when: "the subscription's fee is invoiced monthly or quarterly and the charges invoiced on it in those months fall short of the recent charge count"
            value: "the quiet cycle qualifying amount"
          - when: "otherwise"
            value: "the long cycle qualifying amount"
        baseline:
          qualifying_threshold: "K('threshold_annual')"
        evidence: [history, tier_param]
        cross_difficulty: null
    baseline:
      rule: >-
        A building owner who asks to settle an energy monitoring subscription in one payment is quoted the sum that
        clears it, and that sum is worked out from the subscription's own ledger rather than from the balance the
        dashboard displays. The amount owed is every charge invoiced on the subscription, less every payment
        received on it and less the credits set against it, and never less than nothing. The credits set against it
        are every credit standing on the subscription. No settlement allowance is granted against the amount owed.
        The allowance ceiling is the opening ceiling. The qualifying amount is the long cycle qualifying amount. The
        sum the owner settles is the amount owed less the settlement allowance, rounded to the nearest cent once at
        the end, and never less than nothing.
      params: [allowance_cap_new, threshold_annual]
    inputs:
      history:
        - {table: energy_events, aggregate: sum, field: amount_usd, filters: {event_type: energy_invoice_charged}}
        - {table: energy_events, aggregate: sum, field: amount_usd, filters: {event_type: energy_payment_received}}
        - {table: energy_events, aggregate: sum, field: amount_usd, within_months: 3, filters: {event_type: energy_credit_issued}}
      cross_category: []
  - id: energy_ext_meter_coverage_amendment
    base_policy_refs: [energy_agg_portfolio_meter_pricing, energy_portfolio_interaction]
    overwrite:
      - base_policy: energy_agg_portfolio_meter_pricing
        superseded_clause: >-
          Meters beyond a tier's included count carry the tier's meter overage fee for the remainder of the
          subscription year, prorated by whole months, and dashboard users beyond the included count carry the
          tier's user fee for the same period.
        replaced_by: >-
          The points beyond the tier's included count and the dashboard users beyond the tier's included count are
          carried inside the amended annual fee for the whole of each year it stands, and are not billed as a
          separate line.
      - base_policy: energy_agg_portfolio_meter_pricing
        superseded_clause: >-
          The count is the sum of meters_covered over the owner's
          subscriptions in onboarding, active or pending_renewal status, the one being priced included; quoted,
          suspended, expired, cancelled and declined subscriptions are not counted.
        replaced_by: >-
          For an amendment the portfolio band is read from the points this subscription covers after it, because
          the amended coverage is priced on its own building's metering.
    trigger: state_due
    subject: [energy_coverage_updated]
    computes: annual_fee_usd
    target_tool: authorise_meter_coverage_01d41e30
    params:
      band_mid_step_pct: 6
      band_high_step_pct: 11
      band_mid_meters: 20
      band_high_meters: 60
      overage_bulk_points: 3
      overage_bulk_step_pct: 10
      user_bulk_users: 5
      user_bulk_step_pct: 10
      gateway_shared_pct: 50
      first_year_months: 12
    rule: >-
      When a building owner authorises the metered points their site actually meters to be taken onto an energy
      monitoring subscription, the subscription's annual fee is restated for the points and dashboard users it then
      covers. The amended annual fee is the fee the amendment is struck on, plus the per-point fee for every point
      the subscription covers after the amendment, plus the charge for the points beyond the tier's included count,
      plus the charge for the dashboard users beyond the tier's included count, plus the data gateway charge; the
      five parts are added and the total is rounded to the nearest cent once at the end. The points beyond the
      tier's included count and the dashboard users beyond the tier's included count are carried inside the amended
      annual fee for the whole of each year it stands, and are not billed as a separate line. The points the site
      meters are counted as the metered points that posted a reading in the month ending on the day of the
      amendment, one reading to a point.
      The fee the amendment is struck on is the tier's annual subscription fee. The per-point fee is the tier's
      annual fee per included meter. Every point beyond the tier's included count carries the tier's meter overage
      fee. Every dashboard user beyond the tier's included count carries the tier's dashboard user fee. The data
      gateway charge is the tier's gateway fee.
      Where the subscription stands in its renewal window, the fee the amendment is struck on is the tier's annual
      subscription fee escalated once at the tier's escalation rate, because the amended coverage carries into the
      term being renewed. Where the subscription stands in onboarding, the fee the amendment is struck on is the
      tier's annual subscription fee taken in proportion to the whole months remaining before the term end, of a
      full first year. In every other case the fee the amendment is struck on is the tier's annual subscription
      fee.
      For an amendment the portfolio band is read from the points this subscription covers after it, because the
      amended coverage is priced on its own building's metering. Where the points the subscription covers after
      the amendment fall at or below the lower portfolio band, the per-point fee is the tier's annual fee per
      included meter. Where they stand above the lower band and at or
      below the upper band, the per-point fee is that fee less the middle band step. Where they stand above the
      upper band, the per-point fee is that fee less the upper band step.
      Where the points the site meters do not exceed the points the tier includes, no charge is carried for points
      beyond the included count. Where the points beyond the tier's included count are more than the bulk point
      count, every point beyond carries the tier's meter overage fee less the bulk step. In every other case every
      point beyond the tier's included count carries the tier's meter overage fee.
      Where the dashboard users on the subscription do not exceed the users the tier includes, no charge is carried
      for users beyond the included count. Where the users beyond the tier's included count are more than the bulk
      user count and the subscription's current term has run a full first year or more, every user beyond carries
      the tier's dashboard user fee less the bulk user step. In every other case every dashboard user beyond the
      tier's included count carries the tier's dashboard user fee.
      Where the building's automation service plan stands active or in its renewal window and the subscription
      draws its data from the automation system, no data gateway charge is carried, because the point licence sits
      on that plan. Where the building's automation service plan stands active or in its renewal window and the
      subscription draws its data from more than one source, the data gateway charge is the tier's gateway fee
      reduced by the shared share. In every other case the data gateway charge is the tier's gateway fee.
    prerequisite: []
    cross_category:
      - category: controls
        as: branch
        reads: [status]
        note: The building automation service plan at the same site decides whether the subscription carries its own data gateway charge.
    compute:
      - meters_metered: "COUNT('energy_events', within_months=1, date_field='posted_date', event_type='energy_meter_reading_posted', reading_source='interval_meter')"
      - months_to_term_end: "MONTHS(NOW, F('term_end_date'))"
      - fee_struck_on: "P('annual_subscription_fee_usd') * (100 + P('annual_escalation_pct')) / 100 if F('status') == 'pending_renewal' else (P('annual_subscription_fee_usd') * months_to_term_end / K('first_year_months') if F('status') == 'onboarding' else P('annual_subscription_fee_usd'))"
      - per_point_fee: "P('subscription_fee_per_meter_usd') if meters_metered <= K('band_mid_meters') else (P('subscription_fee_per_meter_usd') * (100 - K('band_mid_step_pct')) / 100 if meters_metered <= K('band_high_meters') else P('subscription_fee_per_meter_usd') * (100 - K('band_high_step_pct')) / 100)"
      - points_beyond: "MX(0, COUNT('energy_events', within_months=1, date_field='posted_date', event_type='energy_meter_reading_posted', reading_source='interval_meter') - P('meters_included'))"
      - overage_component: "0 if points_beyond == 0 else (points_beyond * P('meter_overage_fee_usd') * (100 - K('overage_bulk_step_pct')) / 100 if points_beyond > K('overage_bulk_points') else points_beyond * P('meter_overage_fee_usd'))"
      - term_months_run: "MONTHS(F('term_start_date'), NOW)"
      - users_beyond: "MX(0, F('dashboard_users') - P('dashboard_users_included'))"
      - user_component: "0 if users_beyond == 0 else (users_beyond * P('dashboard_user_fee_usd') * (100 - K('user_bulk_step_pct')) / 100 if (users_beyond > K('user_bulk_users') and term_months_run >= K('first_year_months')) else users_beyond * P('dashboard_user_fee_usd'))"
      - controls_plan_status: "CFIELD('controls','status', site_id=F('site_id'))"
      - gateway_component: "0 if ((controls_plan_status == 'active' or controls_plan_status == 'pending_renewal') and F('data_source') == 'controls_system') else (P('data_gateway_fee_usd') * (100 - K('gateway_shared_pct')) / 100 if ((controls_plan_status == 'active' or controls_plan_status == 'pending_renewal') and F('data_source') == 'mixed') else P('data_gateway_fee_usd'))"
      - result: "RND(fee_struck_on + meters_metered * per_point_fee + overage_component + user_component + gateway_component, 2)"
    compute_basis:
      meters_metered: "The points the site meters are counted as the metered points that posted a reading in the month ending on the day of the amendment, one reading to a point."
      months_to_term_end: "Where the subscription stands in onboarding, the fee the amendment is struck on is the tier's annual subscription fee taken in proportion to the whole months remaining before the term end, of a full first year."
      fee_struck_on: "Where the subscription stands in its renewal window, the fee the amendment is struck on is the tier's annual subscription fee escalated once at the tier's escalation rate, because the amended coverage carries into the term being renewed. Where the subscription stands in onboarding, the fee the amendment is struck on is the tier's annual subscription fee taken in proportion to the whole months remaining before the term end, of a full first year. In every other case the fee the amendment is struck on is the tier's annual subscription fee."
      per_point_fee: "Where the points the subscription covers after the amendment fall at or below the lower portfolio band, the per-point fee is the tier's annual fee per included meter. Where they stand above the lower band and at or below the upper band, the per-point fee is that fee less the middle band step. Where they stand above the upper band, the per-point fee is that fee less the upper band step."
      points_beyond: "Where the points the site meters do not exceed the points the tier includes, no charge is carried for points beyond the included count."
      overage_component: "Where the points the site meters do not exceed the points the tier includes, no charge is carried for points beyond the included count. Where the points beyond the tier's included count are more than the bulk point count, every point beyond carries the tier's meter overage fee less the bulk step. In every other case every point beyond the tier's included count carries the tier's meter overage fee."
      term_months_run: "Where the users beyond the tier's included count are more than the bulk user count and the subscription's current term has run a full first year or more, every user beyond carries the tier's dashboard user fee less the bulk user step."
      users_beyond: "Where the dashboard users on the subscription do not exceed the users the tier includes, no charge is carried for users beyond the included count."
      user_component: "Where the dashboard users on the subscription do not exceed the users the tier includes, no charge is carried for users beyond the included count. Where the users beyond the tier's included count are more than the bulk user count and the subscription's current term has run a full first year or more, every user beyond carries the tier's dashboard user fee less the bulk user step. In every other case every dashboard user beyond the tier's included count carries the tier's dashboard user fee."
      controls_plan_status: "Where the building's automation service plan stands active or in its renewal window and the subscription draws its data from the automation system, no data gateway charge is carried, because the point licence sits on that plan."
      gateway_component: "Where the building's automation service plan stands active or in its renewal window and the subscription draws its data from the automation system, no data gateway charge is carried, because the point licence sits on that plan. Where the building's automation service plan stands active or in its renewal window and the subscription draws its data from more than one source, the data gateway charge is the tier's gateway fee reduced by the shared share. In every other case the data gateway charge is the tier's gateway fee."
      result: "The amended annual fee is the fee the amendment is struck on, plus the per-point fee for every point the subscription covers after the amendment, plus the charge for the points beyond the tier's included count, plus the charge for the dashboard users beyond the tier's included count, plus the data gateway charge; the five parts are added and the total is rounded to the nearest cent once at the end."
    factors:
      - id: fee_basis
        effect: method
        decides: fee_struck_on
        bindings: [months_to_term_end, fee_struck_on]
        ladder:
          - when: "the subscription stands in its renewal window"
            method: "the fee the amendment is struck on is the tier's annual subscription fee escalated once at the tier's escalation rate"
          - when: "the subscription stands in onboarding"
            method: "the fee the amendment is struck on is the tier's annual subscription fee taken in proportion to the whole months remaining before the term end, of a full first year"
          - when: "otherwise"
            method: "the fee the amendment is struck on is the tier's annual subscription fee"
        baseline:
          fee_struck_on: "P('annual_subscription_fee_usd')"
        evidence: [date, tier_param]
        cross_difficulty: null
      - id: portfolio_band
        effect: parameter
        decides: per_point_fee
        bindings: [meters_metered, per_point_fee]
        ladder:
          - when: "the points the subscription covers after the amendment fall at or below the lower portfolio band"
            value: "the tier's annual fee per included meter"
          - when: "the points stand above the lower band and at or below the upper band"
            value: "that fee less the middle band step"
          - when: "the points stand above the upper band"
            value: "that fee less the upper band step"
        baseline:
          per_point_fee: "P('subscription_fee_per_meter_usd')"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: points_beyond_charge
        effect: parameter
        decides: overage_component
        bindings: [points_beyond, overage_component]
        ladder:
          - when: "the points the site meters do not exceed the points the tier includes"
            value: "no charge for points beyond the included count"
          - when: "the points beyond the tier's included count are more than the bulk point count"
            value: "the tier's meter overage fee less the bulk step for every point beyond"
          - when: "otherwise"
            value: "the tier's meter overage fee for every point beyond the included count"
        baseline:
          overage_component: "points_beyond * P('meter_overage_fee_usd')"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: users_beyond_charge
        effect: parameter
        decides: user_component
        bindings: [term_months_run, users_beyond, user_component]
        ladder:
          - when: "the dashboard users on the subscription do not exceed the users the tier includes"
            value: "no charge for users beyond the included count"
          - when: "the users beyond the tier's included count are more than the bulk user count and the subscription's current term has run a full first year or more"
            value: "the tier's dashboard user fee less the bulk user step for every user beyond"
          - when: "otherwise"
            value: "the tier's dashboard user fee for every user beyond the included count"
        baseline:
          user_component: "users_beyond * P('dashboard_user_fee_usd')"
        evidence: [tier_param, date]
        cross_difficulty: null
      - id: gateway_carried
        effect: parameter
        decides: gateway_component
        bindings: [controls_plan_status, gateway_component]
        ladder:
          - when: "the building's automation service plan stands active or in its renewal window and the subscription draws its data from the automation system"
            value: "no data gateway charge"
          - when: "the building's automation service plan stands active or in its renewal window and the subscription draws its data from more than one source"
            value: "the tier's gateway fee reduced by the shared share"
          - when: "otherwise"
            value: "the tier's gateway fee"
        baseline:
          gateway_component: "P('data_gateway_fee_usd')"
        evidence: [cross_category]
        cross_difficulty: controls
    baseline:
      rule: >-
        When a building owner authorises the metered points their site actually meters to be taken onto an energy
        monitoring subscription, the subscription's annual fee is restated for the points and dashboard users it
        then covers. The amended annual fee is the fee the amendment is struck on, plus the per-point fee for every
        point the subscription covers after the amendment, plus the charge for the points beyond the tier's
        included count, plus the charge for the dashboard users beyond the tier's included count, plus the data
        gateway charge; the five parts are added and the total is rounded to the nearest cent once at the end. The
        points the site meters are counted as the metered points that posted a reading in the month ending on the
        day of the amendment, one reading to a point. The fee the amendment is struck on is the tier's annual
        subscription fee. The per-point fee is the tier's annual fee per included meter. Every point beyond the
        tier's included count carries the tier's meter overage fee. Every dashboard user beyond the tier's included
        count carries the tier's dashboard user fee. The data gateway charge is the tier's gateway fee.
      params: [annual_subscription_fee_usd, subscription_fee_per_meter_usd, meter_overage_fee_usd, dashboard_user_fee_usd, data_gateway_fee_usd]
    inputs:
      history:
        - {table: energy_events, aggregate: count, within_months: 1, filters: {event_type: energy_meter_reading_posted, reading_source: interval_meter}}
      cross_category: [controls]
  - id: energy_ext_retrofit_baseline_reset
    base_policy_refs: [energy_agg_portfolio_meter_pricing, energy_portfolio_interaction]
    overwrite: []
    trigger: state_due
    subject: [energy_coverage_updated]
    computes: baseline_kwh
    target_tool: reset_performance_baseline_0e66b991
    params:
      major_project_value_usd: 1000000
      mid_project_value_usd: 400000
      major_reduction_pct: 22
      mid_reduction_pct: 15
      standard_reduction_pct: 8
      cooling_plant_share_pct: 46
      heating_side_share_pct: 31
      whole_building_share_pct: 100
      ramp_months: 12
      year_months: 12
      half_year_months: 6
    rule: >-
      When a replacement or retrofit project at the building closes and the tier resets its baseline on retrofit,
      the performance baseline the subscription measures against is restated, because measuring new equipment
      against the use of the old plant would credit the company with savings it did not manage. The reset baseline
      is the measured basis less the reduction the new plant accounts for; that reduction is the measured basis
      multiplied by the equipment share, then by the retrofit reduction, then by the running share, and the figure
      that remains is taken down to the whole kilowatt hour. The reset baseline is fixed only once the metered
      points the subscription covers match the points the site meters.
      The measured basis is the baseline standing on the subscription. The billed electricity gathered over the
      window is the electricity the billed readings of the six months ending on the day of the reset recorded,
      restated as a year. The retrofit reduction is the standard reduction. The equipment share is the whole of the
      measured basis. The running share is the whole of the reduction.
      Where the tier fixes its baseline over more than twelve months, the billed electricity gathered over the
      window is the electricity the billed readings of the tier's baseline period recorded, restated as a year.
      Where the tier fixes its baseline over twelve months and the subscription's current term has run twelve whole
      months or more, it is the electricity those readings recorded in the twelve months ending on the day of the
      reset. Where the tier fixes its baseline over fewer than twelve months, or the subscription's current term
      has run fewer than twelve whole months, it is the electricity the billed readings of the six months ending on
      that day recorded, restated as a year.
      Where the subscription draws its data from the utility bills alone or from more than one source, the measured
      basis is the billed electricity gathered over the window. Where the subscription draws its data from its own
      meters or from the automation system and the interval readings posted in the twelve months ending on the day
      of the reset reach twelve for every point the subscription covers, the measured basis is the electricity
      those interval readings recorded. In every other case the measured basis is the baseline standing on the
      subscription, because the record carries no complete measured year to restate it from.
      Where a closed project at the building carries a contract value reaching the major project amount, the
      retrofit reduction is the major reduction. Where a closed project at the building carries a contract value
      reaching the middle project amount but short of the major project amount, the retrofit reduction is the
      middle reduction. In every other case the retrofit reduction is the standard reduction.
      Where the closed project replaced a chiller, a cooling tower or a central plant, the equipment share is the
      cooling plant share. Where the closed project replaced a boiler or rebuilt an air handler, the equipment
      share is the heating and air side share. In every other case the equipment share is the whole of the measured
      basis.
      Where the closed project at the building closed inside the ramp months ending on the day of the reset and the
      tier trues measured savings up once a year, the running share is the whole months since it closed, of a full
      year. Where the closed project closed inside those ramp months and the tier trues measured savings up more
      often than once a year, the running share is the whole months since it closed, of a half year, and never
      more than the whole. In every other case the running share is the whole of the reduction, because a plant
      that has run the whole year carries its whole reduction.
    prerequisite:
      - problem: energy_ext_meter_coverage_amendment
        kind: state_gate
        gate: energy_subscriptions.meters_covered
        form: state
        policy_source: >-
          The reset baseline is fixed only once the metered points the subscription covers match the points the
          site meters.
        condition: >-
          The metered point count standing on the subscription equals the number of metered points that posted a
          reading in the month ending on the day of the reset.
        resolved_by: authorise_meter_coverage_01d41e30
        effect: >-
          The metered point count standing on the subscription is brought to the points the site meters, so the
          record the reset is worked out on covers the whole of the metering the baseline is measured from.
    cross_category:
      - category: retrofit
        as: branch
        reads: [status, contract_value_usd, scope_summary, completion_date]
        note: The closed replacement or retrofit project at the same site decides the retrofit reduction, the equipment share and the running share.
    compute:
      - recorded_baseline: "float(F('baseline_kwh') or 0)"
      - billed_6: "SUM('energy_events','consumption_kwh', within_months=6, date_field='posted_date', event_type='energy_meter_reading_posted', reading_source='utility_bill')"
      - billed_12: "SUM('energy_events','consumption_kwh', within_months=12, date_field='posted_date', event_type='energy_meter_reading_posted', reading_source='utility_bill')"
      - billed_baseline_period: "SUM('energy_events','consumption_kwh', within_months=24, date_field='posted_date', event_type='energy_meter_reading_posted', reading_source='utility_bill')"
      - term_months_run: "MONTHS(F('term_start_date'), NOW)"
      - billed_window: "billed_baseline_period * K('year_months') / P('baseline_period_months') if P('baseline_period_months') > K('year_months') else (billed_12 if (P('baseline_period_months') == K('year_months') and term_months_run >= K('year_months')) else billed_6 * 2)"
      - metered_12: "SUM('energy_events','consumption_kwh', within_months=12, date_field='posted_date', event_type='energy_meter_reading_posted', reading_source='interval_meter')"
      - interval_readings_12: "COUNT('energy_events', within_months=12, date_field='posted_date', event_type='energy_meter_reading_posted', reading_source='interval_meter')"
      - measured_basis: "billed_window if (F('data_source') == 'utility_bills' or F('data_source') == 'mixed') else (metered_12 if ((F('data_source') == 'site_meters' or F('data_source') == 'controls_system') and interval_readings_12 >= K('year_months') * F('meters_covered')) else recorded_baseline)"
      - retrofit_value: "float(CFIELD('retrofit','contract_value_usd', status='closed', site_id=F('site_id')) or 0)"
      - reduction_pct: "K('major_reduction_pct') if retrofit_value >= K('major_project_value_usd') else (K('mid_reduction_pct') if retrofit_value >= K('mid_project_value_usd') else K('standard_reduction_pct'))"
      - retrofit_scope: "CFIELD('retrofit','scope_summary', status='closed', site_id=F('site_id'))"
      - equipment_share: "K('cooling_plant_share_pct') if (retrofit_scope == 'chiller_replacement' or retrofit_scope == 'cooling_tower_replacement' or retrofit_scope == 'central_plant_rebuild') else (K('heating_side_share_pct') if (retrofit_scope == 'boiler_replacement' or retrofit_scope == 'air_handler_rebuild') else K('whole_building_share_pct'))"
      - months_since_close: "MONTHS(CFIELD('retrofit','completion_date', status='closed', site_id=F('site_id')), NOW)"
      - running_share: "months_since_close * 100 / K('year_months') if (months_since_close <= K('ramp_months') and P('measurement_true_up_frequency') == 'annual') else (MN(100, months_since_close * 100 / K('half_year_months')) if (months_since_close <= K('ramp_months') and P('measurement_true_up_frequency') != 'annual') else 100)"
      - reduction_kwh: "measured_basis * equipment_share / 100 * reduction_pct / 100 * running_share / 100"
      - result: "int(MX(0, measured_basis - reduction_kwh))"
    compute_basis:
      billed_6: "Where the tier fixes its baseline over fewer than twelve months, or the subscription's current term has run fewer than twelve whole months, it is the electricity the billed readings of the six months ending on that day recorded, restated as a year."
      billed_12: "Where the tier fixes its baseline over twelve months and the subscription's current term has run twelve whole months or more, it is the electricity those readings recorded in the twelve months ending on the day of the reset."
      billed_baseline_period: "Where the tier fixes its baseline over more than twelve months, the billed electricity gathered over the window is the electricity the billed readings of the tier's baseline period recorded, restated as a year."
      term_months_run: "Where the tier fixes its baseline over twelve months and the subscription's current term has run twelve whole months or more, it is the electricity those readings recorded in the twelve months ending on the day of the reset."
      billed_window: "Where the tier fixes its baseline over more than twelve months, the billed electricity gathered over the window is the electricity the billed readings of the tier's baseline period recorded, restated as a year. Where the tier fixes its baseline over twelve months and the subscription's current term has run twelve whole months or more, it is the electricity those readings recorded in the twelve months ending on the day of the reset. Where the tier fixes its baseline over fewer than twelve months, or the subscription's current term has run fewer than twelve whole months, it is the electricity the billed readings of the six months ending on that day recorded, restated as a year."
      metered_12: "Where the subscription draws its data from its own meters or from the automation system and the interval readings posted in the twelve months ending on the day of the reset reach twelve for every point the subscription covers, the measured basis is the electricity those interval readings recorded."
      interval_readings_12: "Where the subscription draws its data from its own meters or from the automation system and the interval readings posted in the twelve months ending on the day of the reset reach twelve for every point the subscription covers, the measured basis is the electricity those interval readings recorded."
      measured_basis: "Where the subscription draws its data from the utility bills alone or from more than one source, the measured basis is the billed electricity gathered over the window. Where the subscription draws its data from its own meters or from the automation system and the interval readings posted in the twelve months ending on the day of the reset reach twelve for every point the subscription covers, the measured basis is the electricity those interval readings recorded. In every other case the measured basis is the baseline standing on the subscription, because the record carries no complete measured year to restate it from."
      retrofit_value: "Where a closed project at the building carries a contract value reaching the major project amount, the retrofit reduction is the major reduction."
      reduction_pct: "Where a closed project at the building carries a contract value reaching the major project amount, the retrofit reduction is the major reduction. Where a closed project at the building carries a contract value reaching the middle project amount but short of the major project amount, the retrofit reduction is the middle reduction. In every other case the retrofit reduction is the standard reduction."
      retrofit_scope: "Where the closed project replaced a chiller, a cooling tower or a central plant, the equipment share is the cooling plant share."
      equipment_share: "Where the closed project replaced a chiller, a cooling tower or a central plant, the equipment share is the cooling plant share. Where the closed project replaced a boiler or rebuilt an air handler, the equipment share is the heating and air side share. In every other case the equipment share is the whole of the measured basis."
      months_since_close: "Where the closed project at the building closed inside the ramp months ending on the day of the reset and the tier trues measured savings up once a year, the running share is the whole months since it closed, of a full year."
      running_share: "Where the closed project at the building closed inside the ramp months ending on the day of the reset and the tier trues measured savings up once a year, the running share is the whole months since it closed, of a full year. Where the closed project closed inside those ramp months and the tier trues measured savings up more often than once a year, the running share is the whole months since it closed, of a half year, and never more than the whole. In every other case the running share is the whole of the reduction, because a plant that has run the whole year carries its whole reduction."
      reduction_kwh: "The reset baseline is the measured basis less the reduction the new plant accounts for; that reduction is the measured basis multiplied by the equipment share, then by the retrofit reduction, then by the running share, and the figure that remains is taken down to the whole kilowatt hour."
      result: "The reset baseline is the measured basis less the reduction the new plant accounts for; that reduction is the measured basis multiplied by the equipment share, then by the retrofit reduction, then by the running share, and the figure that remains is taken down to the whole kilowatt hour."
    factors:
      - id: window_gathered
        effect: method
        decides: billed_window
        bindings: [billed_6, billed_12, billed_baseline_period, term_months_run, billed_window]
        ladder:
          - when: "the tier fixes its baseline over more than twelve months"
            method: "the billed electricity is the electricity the billed readings of the tier's baseline period recorded, restated as a year"
          - when: "the tier fixes its baseline over twelve months and the subscription's current term has run twelve whole months or more"
            method: "it is the electricity those readings recorded in the twelve months ending on the day of the reset"
          - when: "the tier fixes its baseline over fewer than twelve months, or the subscription's current term has run fewer than twelve whole months"
            method: "it is the electricity the billed readings of the six months ending on that day recorded, restated as a year"
        baseline:
          billed_window: "billed_6 * 2"
        evidence: [history, date, tier_param]
        cross_difficulty: null
      - id: basis_source
        effect: method
        decides: measured_basis
        bindings: [metered_12, interval_readings_12, measured_basis]
        ladder:
          - when: "the subscription draws its data from the utility bills alone or from more than one source"
            method: "the measured basis is the billed electricity gathered over the window"
          - when: "the subscription draws its data from its own meters or from the automation system and the interval readings posted in the twelve months ending on the day of the reset reach twelve for every point the subscription covers"
            method: "the measured basis is the electricity those interval readings recorded"
          - when: "otherwise"
            method: "the measured basis is the baseline standing on the subscription, because the record carries no complete measured year to restate it from"
        baseline:
          measured_basis: "recorded_baseline"
        evidence: [history]
        cross_difficulty: null
      - id: retrofit_reduction
        effect: parameter
        decides: reduction_pct
        bindings: [retrofit_value, reduction_pct]
        ladder:
          - when: "a closed project at the building carries a contract value reaching the major project amount"
            value: "the major reduction"
          - when: "a closed project at the building carries a contract value reaching the middle project amount but short of the major project amount"
            value: "the middle reduction"
          - when: "otherwise"
            value: "the standard reduction"
        baseline:
          reduction_pct: "K('standard_reduction_pct')"
        evidence: [cross_category]
        cross_difficulty: retrofit
      - id: equipment_accounted
        effect: parameter
        decides: equipment_share
        bindings: [retrofit_scope, equipment_share]
        ladder:
          - when: "the closed project replaced a chiller, a cooling tower or a central plant"
            value: "the cooling plant share"
          - when: "the closed project replaced a boiler or rebuilt an air handler"
            value: "the heating and air side share"
          - when: "otherwise"
            value: "the whole of the measured basis"
        baseline:
          equipment_share: "K('whole_building_share_pct')"
        evidence: [cross_category]
        cross_difficulty: retrofit
      - id: plant_running_share
        effect: parameter
        decides: running_share
        bindings: [months_since_close, running_share]
        ladder:
          - when: "the closed project at the building closed inside the ramp months ending on the day of the reset and the tier trues measured savings up once a year"
            value: "the whole months since it closed, of a full year"
          - when: "the closed project closed inside those ramp months and the tier trues measured savings up more often than once a year"
            value: "the whole months since it closed, of a half year, and never more than the whole"
          - when: "otherwise"
            value: "the whole of the reduction"
        baseline:
          running_share: "100"
        evidence: [cross_category, date, tier_param]
        cross_difficulty: retrofit
    baseline:
      rule: >-
        When a replacement or retrofit project at the building closes and the tier resets its baseline on retrofit,
        the performance baseline the subscription measures against is restated, because measuring new equipment
        against the use of the old plant would credit the company with savings it did not manage. The reset
        baseline is the measured basis less the reduction the new plant accounts for; that reduction is the
        measured basis multiplied by the equipment share, then by the retrofit reduction, then by the running
        share, and the figure that remains is taken down to the whole kilowatt hour. The measured basis is the
        baseline standing on the subscription. The billed electricity gathered over the window is the electricity
        the billed readings of the six months ending on the day of the reset recorded, restated as a year. The
        retrofit reduction is the standard reduction. The equipment share is the whole of the measured basis. The
        running share is the whole of the reduction.
      params: [standard_reduction_pct, whole_building_share_pct]
    inputs:
      history:
        - {table: energy_events, aggregate: sum, field: consumption_kwh, within_months: 24, filters: {event_type: energy_meter_reading_posted, reading_source: utility_bill}}
        - {table: energy_events, aggregate: sum, field: consumption_kwh, within_months: 12, filters: {event_type: energy_meter_reading_posted, reading_source: interval_meter}}
      cross_category: [retrofit]
  - id: energy_ext_savings_verification
    base_policy_refs: [energy_savings_guarantee, energy_portfolio_interaction]
    overwrite: []
    trigger: state_due
    subject: [energy_savings_verified]
    computes: verified_savings_usd
    target_tool: verify_period_savings_a6d7fa6e
    params:
      full_normalisation_pct: 94
      partial_normalisation_pct: 88
      no_normalisation_pct: 100
      unmaintained_share_pct: 65
      part_maintained_share_pct: 82
      whole_share_pct: 100
      full_coverage_pct: 100
      near_coverage_pct: 95
      partial_coverage_pct: 85
      period_months: 12
    rule: >-
      At the tier's true-up the measured savings of the closing period are verified against the baseline standing
      on the subscription, and the figure signed off is what the guarantee is settled on. The verified savings are
      the saved electricity valued at the unit cost, taken at the weather normalisation share, then at the
      attributed share, then at the coverage share, and rounded to the nearest cent once at the end; each share
      acts on the result of the step before it, and none of them acts on the baseline itself. The savings
      guaranteed for the period are the tier's guaranteed share of the baseline standing on the subscription,
      valued at the same unit cost and rounded to the nearest cent. The savings verified for a true-up period are
      worked out only after the baseline standing on the subscription has been restated from the close of the
      replacement or retrofit project at the building.
      The saved electricity is a quarter of the baseline standing on the subscription less the electricity the
      period's readings recorded over the three months ending on the day of the verification, that difference taken
      four times, and never less than nothing. The unit cost is the average unit cost of the billed readings of the
      twenty-four months ending on that day. No weather normalisation share is taken off the measured saving. The attributed share is the whole
      of the measured saving. The coverage share is the partial coverage share.
      Where the tier trues measured savings up once a year, the saved electricity is the baseline standing on the
      subscription less the electricity the period's readings recorded over the twelve months ending on the day of
      the verification, and never less than nothing. Where the tier trues measured savings up half-yearly, it is
      half the baseline less the electricity those readings recorded over the six months ending on that day, taken
      twice and never less than nothing. Where the tier trues measured savings up every quarter or not at all, it
      is a quarter of the baseline less the electricity those readings recorded over the three months ending on
      that day, taken four times and never less than nothing.
      Where the tier keeps the site's utility rate structure current and a billed reading was posted on the
      subscription in the month ending on the day of the verification, the unit cost is the average unit cost of
      the billed readings of the twelve months ending on that day. Where the tier keeps the site's utility rate
      structure current and no billed reading was posted in that month, the unit cost is the unit cost of the
      latest billed reading standing on the subscription. Where the tier does not keep the site's utility rate
      structure current, the unit cost is the average unit cost of the billed readings of the twenty-four months
      ending on that day, so that a rate change the analyst is not tracking is smoothed over two years.
      Where the tier weather normalises and the billed readings of the period cover every month of it, the weather
      normalisation share is the full normalisation share. Where the tier weather normalises and those readings
      fall short of one for every month of the period, the weather normalisation share is the partial normalisation
      share. Where the tier does not weather normalise, no weather normalisation share is taken off the measured
      saving.
      Where the building holds no preventive maintenance agreement in active or renewal standing, the attributed
      share is the unmaintained share, because the plant the saving is measured on is not being kept to its
      programme. Where the building holds such an agreement and the repair allowance standing on it for the year is
      exhausted, the attributed share is the part maintained share. In every other case the attributed share is the
      whole of the measured saving.
      Where the metered points the subscription covers reach the points the tier includes and the site posted an
      interval reading in the month ending on the day of the verification for every point the subscription covers,
      the coverage share is the full coverage share. Where the metered points the subscription covers reach the
      points the tier includes but fewer interval readings were posted in that month than the points covered, the
      coverage share is the near complete coverage share. In every other case the coverage share is the partial
      coverage share.
    prerequisite:
      - problem: energy_ext_retrofit_baseline_reset
        kind: value_input
        gate: baseline_use
        form: state
        policy_source: >-
          The savings verified for a true-up period are worked out only after the baseline standing on the
          subscription has been restated from the close of the replacement or retrofit project at the building.
        condition: >-
          The baseline standing on the subscription is the baseline restated from the closed project at the
          building, and the subscription's last change of coverage is that baseline reset.
        resolved_by: reset_performance_baseline_0e66b991
        effect: >-
          The baseline the saved electricity is measured against becomes the restated figure, so the saved
          electricity and the verified savings both fall to what the new plant actually leaves.
    cross_category:
      - category: maintenance
        as: branch
        reads: [status, repair_allowance_remaining]
        note: The preventive maintenance agreement at the same site decides the attributed share of the measured saving.
    compute:
      - baseline_use: "float(F('baseline_kwh') or 0)"
      - period_kwh_12: "SUM('energy_events','consumption_kwh', within_months=12, date_field='posted_date', event_type='energy_meter_reading_posted', reading_source='utility_bill')"
      - period_kwh_6: "SUM('energy_events','consumption_kwh', within_months=6, date_field='posted_date', event_type='energy_meter_reading_posted', reading_source='utility_bill')"
      - period_kwh_3: "SUM('energy_events','consumption_kwh', within_months=3, date_field='posted_date', event_type='energy_meter_reading_posted', reading_source='utility_bill')"
      - saved_kwh: "MX(0, baseline_use - period_kwh_12) if P('measurement_true_up_frequency') == 'annual' else (MX(0, baseline_use / 2 - period_kwh_6) * 2 if P('measurement_true_up_frequency') == 'semiannual' else MX(0, baseline_use / 4 - period_kwh_3) * 4)"
      - period_cost_12: "SUM('energy_events','cost_usd', within_months=12, date_field='posted_date', event_type='energy_meter_reading_posted', reading_source='utility_bill')"
      - period_cost_24: "SUM('energy_events','cost_usd', within_months=24, date_field='posted_date', event_type='energy_meter_reading_posted', reading_source='utility_bill')"
      - period_kwh_24: "SUM('energy_events','consumption_kwh', within_months=24, date_field='posted_date', event_type='energy_meter_reading_posted', reading_source='utility_bill')"
      - latest_bill_cost: "float(LATEST('energy_events','cost_usd', date_field='posted_date', event_type='energy_meter_reading_posted', reading_source='utility_bill') or 0)"
      - latest_bill_kwh: "float(LATEST('energy_events','consumption_kwh', date_field='posted_date', event_type='energy_meter_reading_posted', reading_source='utility_bill') or 0)"
      - billed_this_month: "COUNT('energy_events', within_months=1, date_field='posted_date', event_type='energy_meter_reading_posted', reading_source='utility_bill')"
      - unit_cost: "period_cost_12 / period_kwh_12 if (P('utility_rate_updates_included') and billed_this_month >= 1) else (latest_bill_cost / latest_bill_kwh if (P('utility_rate_updates_included') and billed_this_month == 0) else period_cost_24 / period_kwh_24)"
      - billed_months: "COUNT('energy_events', within_months=12, date_field='posted_date', event_type='energy_meter_reading_posted', reading_source='utility_bill')"
      - normalisation_pct: "K('full_normalisation_pct') if (P('weather_normalization_included') and billed_months >= K('period_months')) else (K('partial_normalisation_pct') if (P('weather_normalization_included') and billed_months < K('period_months')) else K('no_normalisation_pct'))"
      - maintenance_status: "CFIELD('maintenance','status', site_id=F('site_id'))"
      - maintenance_allowance: "float(CFIELD('maintenance','repair_allowance_remaining', site_id=F('site_id')) or 0)"
      - attributed_pct: "K('unmaintained_share_pct') if not (maintenance_status == 'active' or maintenance_status == 'pending_renewal') else (K('part_maintained_share_pct') if maintenance_allowance <= 0 else K('whole_share_pct'))"
      - interval_readings_month: "COUNT('energy_events', within_months=1, date_field='posted_date', event_type='energy_meter_reading_posted', reading_source='interval_meter')"
      - coverage_pct: "K('full_coverage_pct') if (F('meters_covered') >= P('meters_included') and interval_readings_month >= F('meters_covered')) else (K('near_coverage_pct') if (F('meters_covered') >= P('meters_included') and interval_readings_month < F('meters_covered')) else K('partial_coverage_pct'))"
      - guaranteed_savings: "RND(baseline_use * P('guaranteed_savings_pct') / 100 * unit_cost, 2)"
      - result: "RND(saved_kwh * unit_cost * normalisation_pct / 100 * attributed_pct / 100 * coverage_pct / 100, 2)"
    compute_basis:
      baseline_use: "The saved electricity is a quarter of the baseline standing on the subscription less the electricity the period's readings recorded over the three months ending on the day of the verification, that difference taken four times, and never less than nothing."
      period_kwh_12: "Where the tier trues measured savings up once a year, the saved electricity is the baseline standing on the subscription less the electricity the period's readings recorded over the twelve months ending on the day of the verification, and never less than nothing."
      period_kwh_6: "Where the tier trues measured savings up half-yearly, it is half the baseline less the electricity those readings recorded over the six months ending on that day, taken twice and never less than nothing."
      period_kwh_3: "Where the tier trues measured savings up every quarter or not at all, it is a quarter of the baseline less the electricity those readings recorded over the three months ending on that day, taken four times and never less than nothing."
      saved_kwh: "Where the tier trues measured savings up once a year, the saved electricity is the baseline standing on the subscription less the electricity the period's readings recorded over the twelve months ending on the day of the verification, and never less than nothing. Where the tier trues measured savings up half-yearly, it is half the baseline less the electricity those readings recorded over the six months ending on that day, taken twice and never less than nothing. Where the tier trues measured savings up every quarter or not at all, it is a quarter of the baseline less the electricity those readings recorded over the three months ending on that day, taken four times and never less than nothing."
      period_cost_12: "Where the tier keeps the site's utility rate structure current and a billed reading was posted on the subscription in the month ending on the day of the verification, the unit cost is the average unit cost of the billed readings of the twelve months ending on that day."
      period_cost_24: "Where the tier does not keep the site's utility rate structure current, the unit cost is the average unit cost of the billed readings of the twenty-four months ending on that day, so that a rate change the analyst is not tracking is smoothed over two years."
      period_kwh_24: "Where the tier does not keep the site's utility rate structure current, the unit cost is the average unit cost of the billed readings of the twenty-four months ending on that day, so that a rate change the analyst is not tracking is smoothed over two years."
      latest_bill_cost: "Where the tier keeps the site's utility rate structure current and no billed reading was posted in that month, the unit cost is the unit cost of the latest billed reading standing on the subscription."
      latest_bill_kwh: "Where the tier keeps the site's utility rate structure current and no billed reading was posted in that month, the unit cost is the unit cost of the latest billed reading standing on the subscription."
      billed_this_month: "Where the tier keeps the site's utility rate structure current and a billed reading was posted on the subscription in the month ending on the day of the verification, the unit cost is the average unit cost of the billed readings of the twelve months ending on that day."
      unit_cost: "Where the tier keeps the site's utility rate structure current and a billed reading was posted on the subscription in the month ending on the day of the verification, the unit cost is the average unit cost of the billed readings of the twelve months ending on that day. Where the tier keeps the site's utility rate structure current and no billed reading was posted in that month, the unit cost is the unit cost of the latest billed reading standing on the subscription. Where the tier does not keep the site's utility rate structure current, the unit cost is the average unit cost of the billed readings of the twenty-four months ending on that day, so that a rate change the analyst is not tracking is smoothed over two years."
      billed_months: "Where the tier weather normalises and the billed readings of the period cover every month of it, the weather normalisation share is the full normalisation share."
      normalisation_pct: "Where the tier weather normalises and the billed readings of the period cover every month of it, the weather normalisation share is the full normalisation share. Where the tier weather normalises and those readings fall short of one for every month of the period, the weather normalisation share is the partial normalisation share. Where the tier does not weather normalise, no weather normalisation share is taken off the measured saving."
      maintenance_status: "Where the building holds no preventive maintenance agreement in active or renewal standing, the attributed share is the unmaintained share, because the plant the saving is measured on is not being kept to its programme."
      maintenance_allowance: "Where the building holds such an agreement and the repair allowance standing on it for the year is exhausted, the attributed share is the part maintained share."
      attributed_pct: "Where the building holds no preventive maintenance agreement in active or renewal standing, the attributed share is the unmaintained share, because the plant the saving is measured on is not being kept to its programme. Where the building holds such an agreement and the repair allowance standing on it for the year is exhausted, the attributed share is the part maintained share. In every other case the attributed share is the whole of the measured saving."
      interval_readings_month: "Where the metered points the subscription covers reach the points the tier includes and the site posted an interval reading in the month ending on the day of the verification for every point the subscription covers, the coverage share is the full coverage share."
      coverage_pct: "Where the metered points the subscription covers reach the points the tier includes and the site posted an interval reading in the month ending on the day of the verification for every point the subscription covers, the coverage share is the full coverage share. Where the metered points the subscription covers reach the points the tier includes but fewer interval readings were posted in that month than the points covered, the coverage share is the near complete coverage share. In every other case the coverage share is the partial coverage share."
      guaranteed_savings: "The savings guaranteed for the period are the tier's guaranteed share of the baseline standing on the subscription, valued at the same unit cost and rounded to the nearest cent."
      result: "The verified savings are the saved electricity valued at the unit cost, taken at the weather normalisation share, then at the attributed share, then at the coverage share, and rounded to the nearest cent once at the end; each share acts on the result of the step before it, and none of them acts on the baseline itself."
    factors:
      - id: saving_measure
        effect: method
        decides: saved_kwh
        bindings: [period_kwh_12, period_kwh_6, period_kwh_3, saved_kwh]
        ladder:
          - when: "the tier trues measured savings up once a year"
            method: "the saved electricity is the baseline standing on the subscription less the electricity the period's readings recorded over the twelve months ending on the day of the verification"
          - when: "the tier trues measured savings up half-yearly"
            method: "it is half the baseline less the electricity those readings recorded over the six months ending on that day, taken twice"
          - when: "the tier trues measured savings up every quarter or not at all"
            method: "it is a quarter of the baseline less the electricity those readings recorded over the three months ending on that day, taken four times"
        baseline:
          saved_kwh: "MX(0, baseline_use / 4 - period_kwh_3) * 4"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: price_basis
        effect: method
        decides: unit_cost
        bindings: [period_cost_12, period_cost_24, period_kwh_24, latest_bill_cost, latest_bill_kwh, billed_this_month, unit_cost]
        ladder:
          - when: "the tier keeps the site's utility rate structure current and a billed reading was posted on the subscription in the month ending on the day of the verification"
            method: "the unit cost is the average unit cost of the billed readings of the twelve months ending on that day"
          - when: "the tier keeps the site's utility rate structure current and no billed reading was posted in that month"
            method: "the unit cost is the unit cost of the latest billed reading standing on the subscription"
          - when: "the tier does not keep the site's utility rate structure current"
            method: "the unit cost is the average unit cost of the billed readings of the twenty-four months ending on that day"
        baseline:
          unit_cost: "period_cost_24 / period_kwh_24"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: weather_normalisation
        effect: parameter
        decides: normalisation_pct
        bindings: [billed_months, normalisation_pct]
        ladder:
          - when: "the tier weather normalises and the billed readings of the period cover every month of it"
            value: "the full normalisation share"
          - when: "the tier weather normalises and those readings fall short of one for every month of the period"
            value: "the partial normalisation share"
          - when: "the tier does not weather normalise"
            value: "no weather normalisation share"
        baseline:
          normalisation_pct: "K('no_normalisation_pct')"
        evidence: [history, tier_param]
