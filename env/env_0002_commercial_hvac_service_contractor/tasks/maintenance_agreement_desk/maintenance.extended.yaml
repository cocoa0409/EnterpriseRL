  - id: maintenance_ext_additional_visit_charge
    base_policy_refs: [maintenance_billing_and_late_fee, maintenance_repair_coverage, maintenance_portfolio_interaction, maintenance_visit_completion_and_report]
    overwrite:
      - base_policy: maintenance_visit_completion_and_report
        superseded_clause: >-
          Once the term's credited visits are used up, a further visit the customer asks for is booked as
          an extra visit and charged at the tier's extra visit price, regardless of how much of the term is
          left; the count of visits used is taken over the current term only.
        replaced_by: >-
          The price charged for a visit performed beyond the visits the term credited is built from the
          unit price the visit is taken at, the addition made for the hours it ran beyond the hours that
          price covers, the uplift made for the hours band it was worked in, and the reduction the owner's
          prepaid demand service hours earn.
    trigger: state_due
    subject: [maintenance_fee_charged]
    computes: charge_amount_usd
    target_tool: charge_extra_visit_764307e1
    params:
      second_extra_visit_share: 0.9
      repeat_extra_visit_share: 0.8
      block_hours_threshold: 8
      block_holder_reduction_usd: 60.0
      part_block_reduction_usd: 30.0
      visit_hours_covered: 3.0
    rule: >
      The price charged for a visit performed beyond the visits the term credited is built from the
      unit price the visit is taken at, the addition made for the hours it ran beyond the hours that
      price covers, the uplift made for the hours band it was worked in, and the reduction the owner's
      prepaid demand service hours earn. The unit price is the additional visit price the tier publishes.
      Nothing is added for hours run beyond the hours that price covers and no uplift is made for the
      hours band. No reduction is earned. The unit price and the addition for hours run beyond those
      covered are summed, the uplift for the hours band is added to that sum, and the reduction is
      subtracted from the total; the figure is rounded to the nearest cent once, on the final result
      alone, and never falls below nothing.
      The visits beyond the visits the term credited are the completions that follow, in the order they were completed, once as many completions as the term credited have been consumed, a visit closed as no-access consuming none; the visit priced is the most recent visit completed on the agreement, being the latest of those completions not yet charged.
      The unit price tapers with how many such visits the agreement has already been charged for. Where
      three or more charges for a visit beyond the visits the term credited already stand on the
      agreement, the unit price is the additional visit price the tier publishes taken at the repeat
      visit share. Where one or two such charges already stand on the agreement, the unit price is the
      additional visit price the tier publishes taken at the second visit share. Where no such charge
      stands on the agreement, the unit price is the additional visit price the tier publishes.
      An addition is made where the visit ran longer than the hours the additional visit price covers,
      counted on the hours logged for the visit priced against the hours that price covers. Where those hours run beyond the hours covered and the owner holds no
      demand service rate program standing in active status, the tier's agreement labor rate is charged
      for each hour beyond those covered and added to the unit price. Where those hours run beyond the
      hours covered and the owner holds a demand service rate program standing in active status, the
      tier's agreement labor rate less the tier's repair labor discount is charged for each hour beyond
      those covered and added to the unit price. Where those hours do not run beyond the hours covered,
      nothing is added for hours run beyond the hours that price covers.
      An uplift is made for the hours band the visit priced was worked in. Where that band is a published office holiday and the tier carries no after-hours cover,
      the unit price is raised by the tier's overtime multiplier acting on the unit price and the tier's
      trip charge is added as well. Where that band is outside regular hours and the tier carries no
      after-hours cover, the unit price is raised by the tier's overtime multiplier acting on the unit
      price. Where that band is regular hours, or the tier carries after-hours cover, no uplift is made
      for the hours band.
      A reduction is earned by the prepaid technician hours the owner still holds on a demand service rate
      program. Where those prepaid hours stand above the block threshold, the block holder reduction is
      earned. Where those prepaid hours stand at or below the block threshold and above none, the part
      block reduction is earned. Where the owner holds no prepaid technician hours at all, no reduction is
      earned.
    prerequisite: []
    cross_category:
      - category: service
        as: branch
        reads: [status, block_hours_remaining]
        note: the reduction earned and the rate the overrun hours are charged at are decided from the owner's demand service rate program and the prepaid hours it still holds
    compute:
      - prior_extra_visit_charges: "COUNT('maintenance_events', event_type='maintenance_fee_charged', charge_type='extra_visit')"
      - base_unit_price: "(P('extra_visit_price_usd') * K('repeat_extra_visit_share') if prior_extra_visit_charges >= 3 else (P('extra_visit_price_usd') * K('second_extra_visit_share') if prior_extra_visit_charges >= 1 else P('extra_visit_price_usd')))"
      - latest_visit_hours: "LATEST('maintenance_events','labor_hours', date_field='completed_date', event_type='maintenance_visit_completed')"
      - covered_hours_overrun: "MX(0, latest_visit_hours - K('visit_hours_covered'))"
      - holds_demand_programme: "EXISTS('service', status='active')"
      - overrun_addition: "(P('agreement_labor_rate_usd') * covered_hours_overrun * (1 - P('repair_labor_discount_pct') / 100) if (covered_hours_overrun > 0 and holds_demand_programme) else (P('agreement_labor_rate_usd') * covered_hours_overrun if (covered_hours_overrun > 0 and not holds_demand_programme) else 0))"
      - latest_visit_band: "LATEST('maintenance_events','hours_band', date_field='completed_date', event_type='maintenance_visit_completed')"
      - hours_uplift: "(base_unit_price * (P('overtime_rate_multiplier') - 1) + P('trip_charge_usd') if (latest_visit_band == 'holiday' and not P('after_hours_coverage_included')) else (base_unit_price * (P('overtime_rate_multiplier') - 1) if (latest_visit_band == 'after_hours' and not P('after_hours_coverage_included')) else 0))"
      - service_block_hours: "CFIELD('service','block_hours_remaining')"
      - portfolio_reduction: "(K('block_holder_reduction_usd') if service_block_hours > K('block_hours_threshold') else (K('part_block_reduction_usd') if service_block_hours > 0 else 0))"
      - result: "RND(MX(0, base_unit_price + overrun_addition + hours_uplift - portfolio_reduction), 2)"
    compute_basis:
      prior_extra_visit_charges: "Where one or two such charges already stand on the agreement, the unit price is the additional visit price the tier publishes taken at the second visit share."
      base_unit_price: "The unit price tapers with how many such visits the agreement has already been charged for. Where three or more charges for a visit beyond the visits the term credited already stand on the agreement, the unit price is the additional visit price the tier publishes taken at the repeat visit share. Where one or two such charges already stand on the agreement, the unit price is the additional visit price the tier publishes taken at the second visit share. Where no such charge stands on the agreement, the unit price is the additional visit price the tier publishes."
      latest_visit_hours: "The visits beyond the visits the term credited are the completions that follow, in the order they were completed, once as many completions as the term credited have been consumed, a visit closed as no-access consuming none; the visit priced is the most recent visit completed on the agreement, being the latest of those completions not yet charged."
      covered_hours_overrun: "An addition is made where the visit ran longer than the hours the additional visit price covers, counted on the hours logged for the visit priced against the hours that price covers."
      holds_demand_programme: "Where those hours run beyond the hours covered and the owner holds a demand service rate program standing in active status, the tier's agreement labor rate less the tier's repair labor discount is charged for each hour beyond those covered and added to the unit price."
      overrun_addition: "Where those hours run beyond the hours covered and the owner holds no demand service rate program standing in active status, the tier's agreement labor rate is charged for each hour beyond those covered and added to the unit price. Where those hours run beyond the hours covered and the owner holds a demand service rate program standing in active status, the tier's agreement labor rate less the tier's repair labor discount is charged for each hour beyond those covered and added to the unit price. Where those hours do not run beyond the hours covered, nothing is added for hours run beyond the hours that price covers."
      latest_visit_band: "An uplift is made for the hours band the visit priced was worked in."
      hours_uplift: "Where that band is a published office holiday and the tier carries no after-hours cover, the unit price is raised by the tier's overtime multiplier acting on the unit price and the tier's trip charge is added as well. Where that band is outside regular hours and the tier carries no after-hours cover, the unit price is raised by the tier's overtime multiplier acting on the unit price. Where that band is regular hours, or the tier carries after-hours cover, no uplift is made for the hours band."
      service_block_hours: "A reduction is earned by the prepaid technician hours the owner still holds on a demand service rate program."
      portfolio_reduction: "Where those prepaid hours stand above the block threshold, the block holder reduction is earned. Where those prepaid hours stand at or below the block threshold and above none, the part block reduction is earned. Where the owner holds no prepaid technician hours at all, no reduction is earned."
      result: "The unit price and the addition for hours run beyond those covered are summed, the uplift for the hours band is added to that sum, and the reduction is subtracted from the total; the figure is rounded to the nearest cent once, on the final result alone, and never falls below nothing."
    factors:
      - id: repeat_visit_taper
        effect: parameter
        decides: base_unit_price
        bindings: [prior_extra_visit_charges, base_unit_price]
        ladder:
          - when: "three or more charges for a visit beyond the visits the term credited already stand on the agreement"
            value: "the additional visit price the tier publishes taken at the repeat visit share"
          - when: "one or two such charges already stand on the agreement"
            value: "the additional visit price the tier publishes taken at the second visit share"
          - when: "no such charge stands on the agreement"
            value: "the additional visit price the tier publishes"
        baseline:
          base_unit_price: "P('extra_visit_price_usd')"
        evidence: [history]
        cross_difficulty: null
      - id: hours_overrun_basis
        effect: method
        decides: overrun_addition
        bindings: [latest_visit_hours, covered_hours_overrun, holds_demand_programme, overrun_addition]
        ladder:
          - when: "the hours logged run beyond the hours covered and the owner holds no demand service rate program standing in active status"
            method: "the tier's agreement labor rate is charged for each hour beyond those covered and added to the unit price"
          - when: "the hours logged run beyond the hours covered and the owner holds a demand service rate program standing in active status"
            method: "the tier's agreement labor rate less the tier's repair labor discount is charged for each hour beyond those covered and added to the unit price"
          - when: "the hours logged do not run beyond the hours covered"
            method: "nothing is added for hours run beyond the hours that price covers"
        baseline:
          overrun_addition: "0"
        evidence: [history, cross_category]
        cross_difficulty: service
      - id: hours_band_uplift
        effect: method
        decides: hours_uplift
        bindings: [latest_visit_band, hours_uplift]
        ladder:
          - when: "that band is a published office holiday and the tier carries no after-hours cover"
            method: "the unit price is raised by the tier's overtime multiplier acting on the unit price and the tier's trip charge is added as well"
          - when: "that band is outside regular hours and the tier carries no after-hours cover"
            method: "the unit price is raised by the tier's overtime multiplier acting on the unit price"
          - when: "that band is regular hours, or the tier carries after-hours cover"
            method: "no uplift is made for the hours band"
        baseline:
          hours_uplift: "0"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: prepaid_hours_reduction
        effect: parameter
        decides: portfolio_reduction
        bindings: [service_block_hours, portfolio_reduction]
        ladder:
          - when: "the prepaid technician hours the owner still holds stand above the block threshold"
            value: "the block holder reduction"
          - when: "those prepaid hours stand at or below the block threshold and above none"
            value: "the part block reduction"
          - when: "the owner holds no prepaid technician hours at all"
            value: "no reduction"
        baseline:
          portfolio_reduction: "0"
        evidence: [cross_category]
        cross_difficulty: service
    baseline:
      rule: >-
        The price charged for a visit performed beyond the visits the term credited is built from the
        unit price the visit is taken at, the addition made for the hours it ran beyond the hours that
        price covers, the uplift made for the hours band it was worked in, and the reduction the owner's
        prepaid demand service hours earn. The unit price is the additional visit price the tier publishes.
        Nothing is added for hours run beyond the hours that price covers and no uplift is made for the
        hours band. No reduction is earned. The unit price and the addition for hours run beyond those
        covered are summed, the uplift for the hours band is added to that sum, and the reduction is
        subtracted from the total; the figure is rounded to the nearest cent once, on the final result
        alone, and never falls below nothing.
      params: [extra_visit_price_usd]
    inputs:
      history:
        - {table: maintenance_events, aggregate: count, field: event_id, within_months: 12, filters: {event_type: maintenance_fee_charged, charge_type: extra_visit}}
        - {table: maintenance_events, aggregate: latest, field: labor_hours, within_months: 12, filters: {event_type: maintenance_visit_completed, service_category: preventive}}
      cross_category: [service]

  - id: maintenance_ext_account_settlement
