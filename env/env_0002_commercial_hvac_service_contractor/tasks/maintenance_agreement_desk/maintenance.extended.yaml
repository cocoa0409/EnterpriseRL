  - id: maintenance_ext_renewal_arrears_clearance
    base_policy_refs: [maintenance_billing_and_late_fee]
    overwrite:
      - base_policy: maintenance_billing_and_late_fee
        superseded_clause: >-
          Payments are applied to the oldest unpaid invoice first, then to ancillary fees in the order they
          were charged; a customer may direct a payment to a named invoice instead, and where they do, that
          direction governs.
        replaced_by: >-
          A payment clearing the arrears on a suspended agreement is taken as one figure against the
          agreement rather than invoice by invoice.
    trigger: state_due
    subject: [maintenance_payment_received]
    computes: clearance_amount_usd
    target_tool: clear_agreement_arrears_489edb92
    params:
      withdrawal_handling_usd: 45.0
      long_withdrawal_handling_usd: 90.0
      single_clearance_share: 0.5
      multi_clearance_share: 0.25
      standing_allowance_usd: 150.0
      part_standing_allowance_usd: 60.0
    rule: >
      The figure a building owner clears an agreement's arrears at is built from the arrears themselves,
      the charges for instalments left unpaid added to them, the handling charge an account that stood withdrawn carries, and the allowance the owner's standing across the company's books earns. A payment clearing
      the arrears on a suspended agreement is taken as one figure against the agreement rather than invoice
      by invoice. The arrears are the instalments invoiced on the agreement less every payment received on
      it. The charges for instalments left unpaid are added in full. No handling charge is carried and no allowance is earned. The arrears and the charges for instalments left unpaid
      at their added share are summed, the handling charge is added to that sum, and the allowance is subtracted from the total; the figure is rounded to the nearest cent once, on the
      final result alone, and never falls below nothing.
      The arrears follow the cycle the agreement is billed on. Where the agreement is billed in twelve
      instalments a year, the arrears are the instalments that fell due in the last three months less the
      payments received in those three months. Where the agreement is billed in four instalments a year,
      the arrears are the instalments that fell due in the last nine months less the payments received in
      those nine months. Where the agreement is billed in fewer than four instalments a year, the arrears
      are the instalments invoiced on the agreement less every payment received on it.
      The charges for instalments left unpaid are added at a share that falls where coverage has already
      been withdrawn. Where coverage stands suspended and three or more such charges stand on the
      agreement, they are added at the multi-notice clearance share. Where coverage stands suspended and
      one or two such charges stand on the agreement, they are added at the single clearance share. Where
      coverage does not stand suspended, the charges for instalments left unpaid are added in full.
      A handling charge is carried by an account according to how long coverage has stood withdrawn. Where coverage has stood suspended for more than sixty days at the clearance day, the long withdrawal handling charge is carried. Where coverage has stood suspended for more than thirty days but no more than sixty at that day, the withdrawal handling charge is carried. Where coverage has stood suspended for no more than thirty days at that day, no handling charge is carried.
      An allowance is earned by an owner whose building automation service plan at the agreement's building is in good standing. Where
      that plan stands in active status and owes nothing on its own balance, the standing allowance is
      earned. Where that plan stands in active status and owes something on its own balance, the part
      standing allowance is earned. Where the owner holds no building automation service plan in active
      status, no allowance is earned.
    prerequisite: []
    cross_category:
      - category: controls
        as: branch
        reads: [status, balance_due]
        note: the allowance earned is decided from whether the owner's building automation service plan stands active and whether it owes anything on its own balance
    compute:
      - installments_billed: "SUM('maintenance_events','amount_usd', event_type='maintenance_installment_charged')"
      - payments_applied: "SUM('maintenance_events','amount_usd', event_type='maintenance_payment_received')"
      - recent_installments: "SUM('maintenance_events','amount_usd', within_months=3, date_field='due_date', event_type='maintenance_installment_charged')"
      - recent_payments: "SUM('maintenance_events','amount_usd', within_months=3, date_field='received_date', event_type='maintenance_payment_received')"
      - wide_installments: "SUM('maintenance_events','amount_usd', within_months=9, date_field='due_date', event_type='maintenance_installment_charged')"
      - wide_payments: "SUM('maintenance_events','amount_usd', within_months=9, date_field='received_date', event_type='maintenance_payment_received')"
      - arrears_due: "(MX(0, recent_installments - recent_payments) if P('installment_count') >= 12 else (MX(0, wide_installments - wide_payments) if P('installment_count') >= 4 else MX(0, installments_billed - payments_applied)))"
      - late_charges: "SUM('maintenance_events','amount_usd', event_type='maintenance_fee_charged', charge_type='late_fee')"
      - late_charge_count: "COUNT('maintenance_events', event_type='maintenance_fee_charged', charge_type='late_fee')"
      - coverage_suspended: "F('status') == 'suspended'"
      - late_charge_share: "(K('multi_clearance_share') if (coverage_suspended and late_charge_count >= 3) else (K('single_clearance_share') if (coverage_suspended and late_charge_count >= 1) else 1))"
      - suspended_days: "DAYS(F('suspension_date'), NOW)"
      - withdrawal_handling: "(K('long_withdrawal_handling_usd') if suspended_days > 60 else (K('withdrawal_handling_usd') if suspended_days > 30 else 0))"
      - controls_status: "CFIELD('controls','status', site_id=F('site_id'))"
      - controls_balance: "CFIELD('controls','balance_due', site_id=F('site_id'))"
      - standing_allowance: "(K('standing_allowance_usd') if (controls_status == 'active' and controls_balance <= 0) else (K('part_standing_allowance_usd') if (controls_status == 'active' and controls_balance > 0) else 0))"
      - result: "RND(MX(0, arrears_due + late_charges * late_charge_share + withdrawal_handling - standing_allowance), 2)"
    compute_basis:
      installments_billed: "The arrears are the instalments invoiced on the agreement less every payment received on it."
      payments_applied: "The arrears are the instalments invoiced on the agreement less every payment received on it."
      recent_installments: "Where the agreement is billed in twelve instalments a year, the arrears are the instalments that fell due in the last three months less the payments received in those three months."
      recent_payments: "Where the agreement is billed in twelve instalments a year, the arrears are the instalments that fell due in the last three months less the payments received in those three months."
      wide_installments: "Where the agreement is billed in four instalments a year, the arrears are the instalments that fell due in the last nine months less the payments received in those nine months."
      wide_payments: "Where the agreement is billed in four instalments a year, the arrears are the instalments that fell due in the last nine months less the payments received in those nine months."
      arrears_due: "The arrears follow the cycle the agreement is billed on. Where the agreement is billed in twelve instalments a year, the arrears are the instalments that fell due in the last three months less the payments received in those three months. Where the agreement is billed in four instalments a year, the arrears are the instalments that fell due in the last nine months less the payments received in those nine months. Where the agreement is billed in fewer than four instalments a year, the arrears are the instalments invoiced on the agreement less every payment received on it."
      late_charges: "The charges for instalments left unpaid are added in full."
      late_charge_count: "Where coverage stands suspended and one or two such charges stand on the agreement, they are added at the single clearance share."
      late_charge_share: "The charges for instalments left unpaid are added at a share that falls where coverage has already been withdrawn. Where coverage stands suspended and three or more such charges stand on the agreement, they are added at the multi-notice clearance share. Where coverage stands suspended and one or two such charges stand on the agreement, they are added at the single clearance share. Where coverage does not stand suspended, the charges for instalments left unpaid are added in full."
      suspended_days: "Where coverage has stood suspended for more than thirty days but no more than sixty at that day, the withdrawal handling charge is carried."
      withdrawal_handling: "A handling charge is carried by an account according to how long coverage has stood withdrawn. Where coverage has stood suspended for more than sixty days at the clearance day, the long withdrawal handling charge is carried. Where coverage has stood suspended for more than thirty days but no more than sixty at that day, the withdrawal handling charge is carried. Where coverage has stood suspended for no more than thirty days at that day, no handling charge is carried."
      controls_status: "An allowance is earned by an owner whose building automation service plan at the agreement's building is in good standing."
      controls_balance: "Where that plan stands in active status and owes something on its own balance, the part standing allowance is earned."
      standing_allowance: "Where that plan stands in active status and owes nothing on its own balance, the standing allowance is earned. Where that plan stands in active status and owes something on its own balance, the part standing allowance is earned. Where the owner holds no building automation service plan in active status, no allowance is earned."
      result: "The arrears and the charges for instalments left unpaid at their added share are summed, the handling charge is added to that sum, and the allowance is subtracted from the total; the figure is rounded to the nearest cent once, on the final result alone, and never falls below nothing."
    factors:
      - id: arrears_cycle_window
        effect: method
        decides: arrears_due
        bindings: [recent_installments, recent_payments, wide_installments, wide_payments, arrears_due]
        ladder:
          - when: "the agreement is billed in twelve instalments a year"
            method: "the arrears are the instalments that fell due in the last three months less the payments received in those three months"
          - when: "the agreement is billed in four instalments a year"
            method: "the arrears are the instalments that fell due in the last nine months less the payments received in those nine months"
          - when: "the agreement is billed in fewer than four instalments a year"
            method: "the arrears are the instalments invoiced on the agreement less every payment received on it"
        baseline:
          arrears_due: "MX(0, installments_billed - payments_applied)"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: withdrawn_coverage_share
        effect: parameter
        decides: late_charge_share
        bindings: [late_charge_count, coverage_suspended, late_charge_share]
        ladder:
          - when: "coverage stands suspended and three or more charges for instalments left unpaid stand on the agreement"
            value: "the multi-notice clearance share"
          - when: "coverage stands suspended and one or two such charges stand on the agreement"
            value: "the single clearance share"
          - when: "coverage does not stand suspended"
            value: "added in full"
        baseline:
          late_charge_share: "1"
        evidence: [history]
        cross_difficulty: null
      - id: withdrawal_handling_charge
        effect: parameter
        decides: withdrawal_handling
        bindings: [suspended_days, withdrawal_handling]
        ladder:
          - when: "coverage has stood suspended for more than sixty days at the clearance day"
            value: "the long withdrawal handling charge"
          - when: "coverage has stood suspended for more than thirty days but no more than sixty at that day"
            value: "the withdrawal handling charge"
          - when: "coverage has stood suspended for no more than thirty days at that day"
            value: "no handling charge"
        baseline:
          withdrawal_handling: "0"
        evidence: [date]
        cross_difficulty: null
      - id: portfolio_standing_allowance
        effect: parameter
        decides: standing_allowance
        bindings: [controls_status, controls_balance, standing_allowance]
        ladder:
          - when: "the owner's building automation service plan stands in active status and owes nothing on its own balance"
            value: "the standing allowance"
          - when: "that plan stands in active status and owes something on its own balance"
            value: "the part standing allowance"
          - when: "the owner holds no building automation service plan in active status"
            value: "no allowance"
        baseline:
          standing_allowance: "0"
        evidence: [cross_category]
        cross_difficulty: controls
    baseline:
      rule: >-
        The figure a building owner clears an agreement's arrears at is built from the arrears themselves,
        the charges for instalments left unpaid added to them, the handling charge an account that stood withdrawn carries, and the allowance the owner's standing across the company's books earns. The arrears are the
        instalments invoiced on the agreement less every payment received on it. The charges for instalments
        left unpaid are added in full. No handling charge is carried and no allowance is earned. The arrears and the charges for instalments left unpaid at their added share are summed, the handling charge is added to that sum, and the allowance is subtracted from the total; the figure is rounded to the nearest cent once, on the final result alone,
        and never falls below nothing.
      params: []
    inputs:
      history:
        - {table: maintenance_events, aggregate: sum, field: amount_usd, within_months: 3, filters: {event_type: maintenance_installment_charged}}
        - {table: maintenance_events, aggregate: sum, field: amount_usd, within_months: 3, filters: {event_type: maintenance_payment_received}}
        - {table: maintenance_events, aggregate: sum, field: amount_usd, within_months: 12, filters: {event_type: maintenance_fee_charged, charge_type: late_fee}}
      cross_category: [controls]

  - id: maintenance_ext_coverage_reinstatement
    base_policy_refs: [maintenance_suspension_and_reinstatement]
    overwrite:
      - base_policy: maintenance_suspension_and_reinstatement
        superseded_clause: >-
          Coverage is put back in force when the arrears are settled in full and the tier's reinstatement
          fee is charged; the suspended term is not extended, so the visits lost while suspended are not
          credited back.
        replaced_by: >-
          The charge for putting coverage back in force is built from the reinstatement fee the tier
          publishes, the share of it the part of the term still to run bears, the re-mobilisation of the
          visits lost while coverage stood withdrawn, and the discount the owner's building automation
          service plan earns.
    trigger: state_due
    subject: [maintenance_agreement_reinstated]
    computes: reinstatement_charge_usd
    target_tool: reinstate_agreement_coverage_5877576a
    params:
      cleared_account_share: 0.5
      part_cleared_share: 0.75
      full_term_share: 1.0
      part_term_share: 0.6
      residual_term_share: 0.3
      half_visit_share: 0.5
      plan_discount_usd: 120.0
      part_plan_discount_usd: 50.0
    rule: >
      The charge for putting coverage back in force is built from the reinstatement fee the tier
      publishes, the share of it the part of the term still to run bears, the re-mobilisation of the
      visits lost while coverage stood withdrawn, and the discount the owner's building automation
      service plan earns. The reinstatement fee taken is the fee the tier publishes. The share the part of
      the term still to run bears is the whole of it. Nothing is added for visits lost while coverage stood
      withdrawn and no discount is earned. The reinstatement fee taken is multiplied by the share the part
      of the term still to run bears, the re-mobilisation of the lost visits is added to that product, and
      the discount is subtracted from the sum; the figure is rounded to the nearest cent once, on the final
      result alone, and never falls below nothing.
      The charge for putting coverage back in force is worked out only after the arrears standing on the agreement are answered by a payment recorded against the agreement as a whole rather than against any named invoice.
      The reinstatement fee taken follows how far the account has been brought square. Where the payments
      received on the agreement now reach the instalments invoiced on it, the fee the tier publishes is
      taken at the cleared account share. Where the payments received fall short of the instalments
      invoiced by no more than the value of one instalment of the annual price in force, the fee the tier
      publishes is taken at the part cleared share. Where the payments received fall short of the
      instalments invoiced by more than the value of one instalment of the annual price in force, the
      reinstatement fee taken is the fee the tier publishes.
      The share the part of the term still to run bears follows what is left of the term. Where more than six whole months of the term remain at the reinstatement day, the share the part of the term still to run bears is the whole of it. Where between one and six whole months remain at that day, the part term share is borne. Where no whole month of the term remains at that day, the residual term share is borne.
      The visits counted as lost are read over a window that widens with the length of the withdrawal. A booking the office attended and closed as a no-access call is taken as answered and is never counted as lost.
      Where coverage stood withdrawn for more than sixty days, the visits counted are those booked for a
      day in the last six months with no visit completed against them. Where coverage stood withdrawn for
      more than thirty days but no more than sixty, the visits counted are those booked for a day in the
      last three months with no visit completed against them. Where coverage stood withdrawn for no more
      than thirty days, the visits counted are the booked visits of the agreement with no visit completed
      against them.
      The re-mobilisation of the lost visits is priced on the visits so counted. Where two or more visits
      are counted as lost, the tier's price for one additional visit is added for each of them. Where
      exactly one visit is counted as lost, the tier's price for one additional visit is added at the half
      visit share. Where no visit is counted as lost, nothing is added for visits lost while coverage stood
      withdrawn.
      A discount is earned by the building automation service plan at the agreement's building. Where that plan stands in
      active status and still carries support hours in its pool, the plan discount is earned. Where that
      plan stands in active status and its support pool is exhausted, the part plan discount is earned.
      Where the owner holds no building automation service plan in active status, no discount is earned.
    prerequisite:
      - problem: maintenance_ext_renewal_arrears_clearance
        kind: value_input
        gate: settled_shortfall
        form: state
        policy_source: >-
          The charge for putting coverage back in force is worked out only after the arrears standing on the
          agreement are answered by a payment recorded against the agreement as a whole rather than against
          any named invoice.
        condition: >-
          the payments received on the agreement stand against the instalments invoiced on it at the
          shortfall the reinstatement fee is to be taken on
        resolved_by: clear_agreement_arrears_489edb92
        effect: >-
          the shortfall between the instalments invoiced and the payments received falls, so the share the
          reinstatement fee is taken at moves down the ladder
    cross_category:
      - category: controls
        as: branch
        reads: [status, support_hours_remaining]
        note: the discount earned is decided from whether the owner's building automation service plan stands active and whether its support pool still carries hours
    compute:
      - installments_billed: "SUM('maintenance_events','amount_usd', event_type='maintenance_installment_charged')"
      - payments_applied: "SUM('maintenance_events','amount_usd', event_type='maintenance_payment_received')"
      - settled_shortfall: "MX(0, installments_billed - payments_applied)"
      - instalment_value: "F('annual_price_usd') / MX(1, P('installment_count'))"
      - reinstatement_fee_taken: "(P('reinstatement_fee_usd') * K('cleared_account_share') if settled_shortfall <= 0 else (P('reinstatement_fee_usd') * K('part_cleared_share') if settled_shortfall <= instalment_value else P('reinstatement_fee_usd')))"
      - months_of_term_left: "MONTHS(NOW, F('term_end_date'))"
      - remaining_term_share: "(K('residual_term_share') if months_of_term_left < 1 else (K('part_term_share') if months_of_term_left <= 6 else K('full_term_share')))"
      - withdrawn_days: "DAYS(F('suspension_date'), NOW)"
      - booked_recent: "COUNT('maintenance_events', within_months=3, date_field='scheduled_date', event_type='maintenance_visit_scheduled')"
      - performed_recent: "COUNT('maintenance_events', within_months=3, date_field='completed_date', event_type='maintenance_visit_completed')"
      - booked_wide: "COUNT('maintenance_events', within_months=6, date_field='scheduled_date', event_type='maintenance_visit_scheduled')"
      - performed_wide: "COUNT('maintenance_events', within_months=6, date_field='completed_date', event_type='maintenance_visit_completed')"
      - booked_all: "COUNT('maintenance_events', event_type='maintenance_visit_scheduled')"
      - performed_all: "COUNT('maintenance_events', event_type='maintenance_visit_completed')"
      - lost_visit_count: "(MX(0, booked_wide - performed_wide) if withdrawn_days > 60 else (MX(0, booked_recent - performed_recent) if withdrawn_days > 30 else MX(0, booked_all - performed_all)))"
      - lost_visit_component: "(P('extra_visit_price_usd') * lost_visit_count if lost_visit_count >= 2 else (P('extra_visit_price_usd') * K('half_visit_share') if lost_visit_count == 1 else 0))"
      - controls_status: "CFIELD('controls','status', site_id=F('site_id'))"
      - controls_support_hours: "CFIELD('controls','support_hours_remaining', site_id=F('site_id'))"
      - plan_discount: "(K('plan_discount_usd') if (controls_status == 'active' and controls_support_hours > 0) else (K('part_plan_discount_usd') if (controls_status == 'active' and controls_support_hours <= 0) else 0))"
      - result: "RND(MX(0, reinstatement_fee_taken * remaining_term_share + lost_visit_component - plan_discount), 2)"
    compute_basis:
      installments_billed: "The reinstatement fee taken follows how far the account has been brought square."
      payments_applied: "Where the payments received on the agreement now reach the instalments invoiced on it, the fee the tier publishes is taken at the cleared account share."
      settled_shortfall: "Where the payments received fall short of the instalments invoiced by more than the value of one instalment of the annual price in force, the reinstatement fee taken is the fee the tier publishes."
      reinstatement_fee_taken: "Where the payments received on the agreement now reach the instalments invoiced on it, the fee the tier publishes is taken at the cleared account share. Where the payments received fall short of the instalments invoiced by no more than the value of one instalment of the annual price in force, the fee the tier publishes is taken at the part cleared share. Where the payments received fall short of the instalments invoiced by more than the value of one instalment of the annual price in force, the reinstatement fee taken is the fee the tier publishes."
      months_of_term_left: "Where between one and six whole months remain at that day, the part term share is borne."
      remaining_term_share: "The share the part of the term still to run bears follows what is left of the term. Where more than six whole months of the term remain at the reinstatement day, the share the part of the term still to run bears is the whole of it. Where between one and six whole months remain at that day, the part term share is borne. Where no whole month of the term remains at that day, the residual term share is borne."
      withdrawn_days: "Where coverage stood withdrawn for more than thirty days but no more than sixty, the visits counted are those booked for a day in the last three months with no visit completed against them."
      booked_recent: "Where coverage stood withdrawn for more than thirty days but no more than sixty, the visits counted are those booked for a day in the last three months with no visit completed against them."
      performed_recent: "Where coverage stood withdrawn for more than thirty days but no more than sixty, the visits counted are those booked for a day in the last three months with no visit completed against them."
      booked_wide: "Where coverage stood withdrawn for more than sixty days, the visits counted are those booked for a day in the last six months with no visit completed against them."
      performed_wide: "Where coverage stood withdrawn for more than sixty days, the visits counted are those booked for a day in the last six months with no visit completed against them."
      booked_all: "Where coverage stood withdrawn for no more than thirty days, the visits counted are the booked visits of the agreement with no visit completed against them."
      performed_all: "A booking the office attended and closed as a no-access call is taken as answered and is never counted as lost."
      lost_visit_count: "The visits counted as lost are read over a window that widens with the length of the withdrawal. A booking the office attended and closed as a no-access call is taken as answered and is never counted as lost. Where coverage stood withdrawn for more than sixty days, the visits counted are those booked for a day in the last six months with no visit completed against them. Where coverage stood withdrawn for more than thirty days but no more than sixty, the visits counted are those booked for a day in the last three months with no visit completed against them. Where coverage stood withdrawn for no more than thirty days, the visits counted are the booked visits of the agreement with no visit completed against them."
      lost_visit_component: "The re-mobilisation of the lost visits is priced on the visits so counted. Where two or more visits are counted as lost, the tier's price for one additional visit is added for each of them. Where exactly one visit is counted as lost, the tier's price for one additional visit is added at the half visit share. Where no visit is counted as lost, nothing is added for visits lost while coverage stood withdrawn."
      controls_status: "A discount is earned by the building automation service plan at the agreement's building."
      controls_support_hours: "Where that plan stands in active status and its support pool is exhausted, the part plan discount is earned."
      plan_discount: "Where that plan stands in active status and still carries support hours in its pool, the plan discount is earned. Where that plan stands in active status and its support pool is exhausted, the part plan discount is earned. Where the owner holds no building automation service plan in active status, no discount is earned."
      result: "The reinstatement fee taken is multiplied by the share the part of the term still to run bears, the re-mobilisation of the lost visits is added to that product, and the discount is subtracted from the sum; the figure is rounded to the nearest cent once, on the final result alone, and never falls below nothing."
    factors:
      - id: cleared_account_share
        effect: parameter
        decides: reinstatement_fee_taken
        bindings: [installments_billed, payments_applied, settled_shortfall, instalment_value, reinstatement_fee_taken]
        ladder:
          - when: "the payments received on the agreement now reach the instalments invoiced on it"
            value: "the fee the tier publishes at the cleared account share"
          - when: "the payments received fall short of the instalments invoiced by no more than the value of one instalment of the annual price in force"
            value: "the fee the tier publishes at the part cleared share"
          - when: "the payments received fall short of the instalments invoiced by more than the value of one instalment of the annual price in force"
            value: "the fee the tier publishes"
        baseline:
          reinstatement_fee_taken: "P('reinstatement_fee_usd')"
