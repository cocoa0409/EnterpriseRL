        annual price in force divided by the visits the term credited. That value is credited at the missed
        visit credit rate the tier publishes. No multiple is applied to the credit. No allowance is added for the stage of the term and no reschedule offset is taken off. The value of the unperformed visit is multiplied by the
        credit rate, and the product is then taken at the multiple; the stage allowance is added to that figure and the reschedule offset subtracted from the sum; the result is rounded to the nearest cent once,
