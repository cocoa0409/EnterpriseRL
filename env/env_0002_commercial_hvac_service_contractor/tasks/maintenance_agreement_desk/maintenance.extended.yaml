      - access_recovery: "(P('no_access_trip_fee_usd') * no_access_visits if (no_access_visits >= 2 and no_access_trip_fees == 0) else (P('no_access_trip_fee_usd') if (no_access_visits == 1 and no_access_trip_fees == 0) else 0))"
      - result: "RND(MX(0, instalment_arrears + late_fee_charges * late_fee_share + other_fee_charges + access_recovery - credits_applied - prompt_allowance - inspection_credit), 2)"
