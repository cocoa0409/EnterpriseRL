      - billing_adjustment_credits: "COUNT('maintenance_events', event_type='maintenance_credit_issued', credit_reason='billing_adjustment')"
      - signed_months_ago: "MONTHS(F('signed_date'), NOW)"
      - inspection_credit: "(P('pre_agreement_inspection_fee_usd') * K('recent_inspection_credit_share') if (signed_months_ago <= 12 and billing_adjustment_credits == 0) else (P('pre_agreement_inspection_fee_usd') * K('older_inspection_credit_share') if (signed_months_ago > 12 and billing_adjustment_credits == 0) else 0))"
      - no_access_visits: "COUNT('maintenance_events', event_type='maintenance_visit_completed', service_category='no_access')"
