        effect: >-
          the other ancillary charges the settlement figure collects rise by the price of the visit
          performed beyond the visits the term credited
    cross_category: []
    compute:
      - installments_billed: "SUM('maintenance_events','amount_usd', event_type='maintenance_installment_charged')"
      - payments_applied: "SUM('maintenance_events','amount_usd', event_type='maintenance_payment_received')"
      - visits_credited_term: "LATEST('maintenance_events','visit_sequence', date_field='billing_period', event_type='maintenance_visit_entitlement_credited')"
      - booked_visits: "COUNT('maintenance_events', event_type='maintenance_visit_scheduled')"
      - performed_visits: "COUNT('maintenance_events', event_type='maintenance_visit_completed')"
      - unperformed_visits: "MX(0, booked_visits - performed_visits)"
      - unperformed_visit_relief: "F('annual_price_usd') / MX(1, visits_credited_term)"
      - instalment_arrears: "(MX(0, installments_billed - payments_applied - unperformed_visits * unperformed_visit_relief) if unperformed_visits >= 2 else (MX(0, installments_billed - payments_applied - unperformed_visit_relief / 2) if unperformed_visits == 1 else MX(0, installments_billed - payments_applied)))"
      - late_fee_charges: "SUM('maintenance_events','amount_usd', event_type='maintenance_fee_charged', charge_type='late_fee')"
