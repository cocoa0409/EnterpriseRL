      established_prompt_allowance_usd: 60.0
      prompt_allowance_usd: 30.0
      recent_inspection_credit_share: 1.0
      older_inspection_credit_share: 0.5
    rule: >
      The figure a building owner settles a maintenance agreement at is built from the instalment arrears,
      the charges for instalments left unpaid taken at the share the office collects them at, the other
      ancillary charges standing on the agreement, the recovery of trips lost to locked plant, the credits
      issued on the agreement, the prompt settlement allowance and the credit owed for the pre-agreement
      inspection. The instalment arrears are the instalments invoiced on the agreement less every payment
      received on it. The charges for instalments left unpaid are collected in full. Nothing is recovered
      for trips lost to locked plant, no prompt settlement allowance is allowed and no credit is owed for
      the pre-agreement inspection. The credits issued on the agreement are set against the settlement
      figure in full. The instalment arrears, the charges for instalments left unpaid at their collected
      share, the other ancillary charges and the recovery of lost trips are summed; from that sum the
      credits issued, the prompt settlement allowance and the pre-agreement inspection credit are
      subtracted; the figure is rounded to the nearest cent once, on the final result alone, and never
      falls below nothing.
      The settlement figure is fixed only after the balance carries the monthly charge that the instalments left unpaid past their due day have together earned. Before the settlement figure is worked out, the
      balance must carry the credit owed for every booked visit of the term that went unperformed past its
      rebooking window. The settlement figure is not taken until the balance carries the price of every
      visit performed beyond the visits the term credited.
      The instalment arrears are written down for the visits the office booked and never performed. A booking the office attended and closed as a no-access call is taken as answered for this purpose, since the office attended, and does not count as a visit the office never performed. Where
      two or more booked visits of the agreement stand with no visit completed against them, the value of
      each of those visits, taken as the annual price in force divided by the visits the term credited, is
      written off the instalment arrears. Where exactly one booked visit stands with no visit completed
      against it, half of that value is written off the instalment arrears. Where every booked visit has
      been answered by a completed visit, the instalment arrears are the instalments invoiced on the
      agreement less every payment received on it.
      The charges for instalments left unpaid are collected at a share that falls as they multiply. Where
      three or more such charges stand on the agreement, they are collected at the multi-notice share.
      Where one or two such charges stand on the agreement, they are collected at the second notice share.
      Where no such charge stands on the agreement, the charges for instalments left unpaid are collected
      in full.
      A prompt settlement allowance is allowed to an owner who has kept paying through the term. Where the
      agreement carries two or more payments received and more than six whole months of its term have run
      at the settlement day, the established prompt allowance is allowed. Where the agreement carries two
      or more payments received and no more than six whole months of its term have run at the settlement
      day, the prompt settlement allowance is allowed. Where the agreement carries fewer than two payments
      received, no prompt settlement allowance is allowed.
      A credit is owed for the pre-agreement inspection where it has not yet been passed back through a
      billing adjustment. Where the agreement was signed no more than twelve whole months before the
      settlement day and no credit has been issued on it as a billing adjustment, the tier's pre-agreement
      inspection fee is owed at the recent inspection share. Where the agreement was signed more than
      twelve whole months before the settlement day and no credit has been issued on it as a billing
      adjustment, the tier's pre-agreement inspection fee is owed at the older inspection share. Where a
      credit has been issued on the agreement as a billing adjustment, no credit is owed for the
      pre-agreement inspection.
      The office recovers the trips it lost to plant it could not reach. Where two or more visits of the
      agreement were closed as no-access and no charge for a no-access trip stands on it, the tier's
      no-access trip fee is recovered for each of those visits. Where exactly one visit was closed as
      no-access and no charge for a no-access trip stands on the agreement, the tier's no-access trip fee
      is recovered once. Where a charge for a no-access trip already stands on the agreement, or no visit
      was closed as no-access, nothing is recovered for trips lost to locked plant.
