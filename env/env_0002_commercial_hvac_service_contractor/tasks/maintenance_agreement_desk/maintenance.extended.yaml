        ladder:
          - when: "more than nine whole months of the term have run at the day the credit is raised"
            value: "the late stage allowance"
          - when: "more than six but no more than nine whole months of the term have run at that day"
            value: "the lapse stage allowance"
          - when: "no more than six whole months of the term have run at that day"
