  - id: maintenance_ext_renewal_term_pricing
    base_policy_refs: [maintenance_renewal, maintenance_activation_and_entitlement, maintenance_agg_multi_site_discount]
    overwrite:
      - base_policy: maintenance_renewal
        superseded_clause: >-
          Escalation is applied to the current annual price before any discount or bundle credit is
          recomputed, and a renewal at a different tier is priced from that tier's schedule instead of
          escalated.
        replaced_by: >-
          The price of a further term is built from the base the escalation acts on, the escalation applied
          to it, the portfolio discount taken off the escalated figure, the building automation bundle
          credit taken off after that discount, the surcharge an account that ran behind carries and the
          adjustment the term's service record earns.
    trigger: on_request
    subject: [maintenance_agreement_renewed]
    computes: renewed_annual_price_usd
    target_tool: renew_agreement_term_748887d3
    params:
      arrears_escalation_pct: 6.0
      standing_escalation_pct: 4.5
      full_portfolio_discount_share: 0.07
      part_portfolio_discount_share: 0.03
      exhausted_bundle_share: 0.5
      full_arrears_surcharge_usd: 480.0
      part_arrears_surcharge_usd: 220.0
      repeat_report_adjustment_usd: 300.0
      single_report_adjustment_usd: 140.0
    rule: >
      The price of a further term is built from the base the escalation acts on, the escalation applied
      to it, the portfolio discount taken off the escalated figure, the building automation bundle
      credit taken off after that discount, the surcharge an account that ran behind carries and the
      adjustment the term's service record earns. The base the escalation acts on is the annual price in
      force. The escalation applied is the escalation the tier publishes. No portfolio discount and no
      building automation bundle credit are taken off, no surcharge is carried and no adjustment is earned.
      The base is first raised by the escalation, giving the escalated figure; the portfolio discount is
      then taken off that escalated figure, and the building automation bundle credit is taken off the
      figure the discount leaves; the surcharge is added to what remains and the adjustment subtracted from
      it; the figure is compared with the tier's annual price floor and the higher of the two stands, and
      it is rounded to the nearest whole dollar once, on the final result alone.
      A further term is recorded only once the agreement stands back in force after a withdrawal of
      coverage.
      The escalation applied follows how the account behaved through the term just ending. Where three or
      more charges for instalments left unpaid stand on the agreement, the arrears escalation is applied.
      Where one or two such charges stand on the agreement, the standing escalation is applied. Where no
      such charge stands on the agreement, the escalation applied is the escalation the tier publishes.
      The base the escalation acts on follows what the term just ending actually delivered. A visit closed as no-access consumes none of the visits credited and is not counted among the visits completed. Where the
      visits completed on the agreement stand above the visits the term credited, the base is the annual price
      in force together with the tier's price for one additional visit for each visit beyond them. Where
      the visits completed on the agreement stand below the visits the term credited, the base is the annual
      price in force less the tier's price for one additional visit for each visit short of them. Where the
      visits completed on the agreement match the visits the term credited, the base the escalation acts on is
      the annual price in force.
      The portfolio discount follows the reach of the building automation service plan at the building.
      Where that plan stands in active status and covers two hundred or more monitored points, the full
      portfolio discount share is taken off. Where that plan stands in active status and covers fewer than
      two hundred monitored points, the part portfolio discount share is taken off. Where the owner holds no
      building automation service plan in active status, no portfolio discount is taken off.
      The building automation bundle credit follows whether that plan is still watching alarms. Where the
      plan stands in active status and still carries alarm responses in its allowance, the tier's bundle
      credit is taken off in full. Where the plan stands in active status and its alarm allowance is
      exhausted, the tier's bundle credit is taken off at the exhausted bundle share. Where the owner holds
      no building automation service plan in active status, no building automation bundle credit is taken
      off.
      A surcharge is carried by an account that ran behind in the term just ending. Where coverage stood
      withdrawn in the term and fewer than six payments have been received on the agreement, the full
      arrears surcharge is carried. Where coverage stood withdrawn in the term and six or more payments
      have been received on the agreement, the part arrears surcharge is carried. Where coverage never
      stood withdrawn in the term, no surcharge is carried.
      An adjustment is earned where the office owes the owner written condition reports. Where two or more
      preventive visits completed on the agreement carry no written condition report, the repeat report
      adjustment is earned. Where exactly one preventive visit completed in the term carries no written
      condition report, the single report adjustment is earned. Where every preventive visit completed in
      the term carries a written condition report, no adjustment is earned.
    prerequisite:
      - problem: maintenance_ext_coverage_reinstatement
        kind: state_gate
        gate: maintenance_agreements.status
        form: state
        policy_source: >-
          A further term is recorded only once the agreement stands back in force after a withdrawal of
          coverage.
        condition: >-
          the agreement no longer stands in suspended status, having been put back in force after the
          withdrawal of coverage
        resolved_by: reinstate_agreement_coverage_5877576a
        effect: >-
          the agreement's lifecycle standing moves out of suspended and back into the renewal window, so a
          further term may be recorded against it
    cross_category:
      - category: controls
        as: branch
        reads: [status, points_covered, alarm_responses_remaining]
        note: the portfolio discount is decided from the monitored points the building's automation service plan covers, and the bundle credit from whether that plan still carries alarm responses
    compute:
      - visits_credited_term: "LATEST('maintenance_events','visit_sequence', date_field='billing_period', event_type='maintenance_visit_entitlement_credited')"
      - visits_performed_term: "COUNT('maintenance_events', event_type='maintenance_visit_completed') - COUNT('maintenance_events', event_type='maintenance_visit_completed', service_category='no_access')"
      - escalation_base: "(F('annual_price_usd') + P('extra_visit_price_usd') * (visits_performed_term - visits_credited_term) if visits_performed_term > visits_credited_term else (F('annual_price_usd') - P('extra_visit_price_usd') * (visits_credited_term - visits_performed_term) if visits_performed_term < visits_credited_term else F('annual_price_usd')))"
      - late_charge_count: "COUNT('maintenance_events', event_type='maintenance_fee_charged', charge_type='late_fee')"
      - escalation_pct: "(K('arrears_escalation_pct') if late_charge_count >= 3 else (K('standing_escalation_pct') if late_charge_count >= 1 else P('annual_escalation_pct')))"
      - escalated_figure: "escalation_base * (1 + escalation_pct / 100)"
      - controls_status: "CFIELD('controls','status', site_id=F('site_id'))"
      - controls_points: "CFIELD('controls','points_covered', site_id=F('site_id'))"
      - portfolio_discount_share: "(K('full_portfolio_discount_share') if (controls_status == 'active' and controls_points >= 200) else (K('part_portfolio_discount_share') if (controls_status == 'active' and controls_points < 200) else 0))"
      - controls_alarm_allowance: "CFIELD('controls','alarm_responses_remaining', site_id=F('site_id'))"
      - bundle_credit: "(P('bundle_credit_with_controls_usd') if (controls_status == 'active' and controls_alarm_allowance > 0) else (P('bundle_credit_with_controls_usd') * K('exhausted_bundle_share') if (controls_status == 'active' and controls_alarm_allowance <= 0) else 0))"
      - payments_count: "COUNT('maintenance_events', event_type='maintenance_payment_received')"
      - coverage_was_withdrawn: "F('suspension_date') >= F('term_start_date')"
      - arrears_surcharge: "(K('full_arrears_surcharge_usd') if (coverage_was_withdrawn and payments_count < 6) else (K('part_arrears_surcharge_usd') if (coverage_was_withdrawn and payments_count >= 6) else 0))"
      - preventive_performed: "COUNT('maintenance_events', event_type='maintenance_visit_completed', service_category='preventive')"
      - preventive_reports: "COUNT('maintenance_events', event_type='maintenance_report_issued', service_category='preventive')"
      - unreported_preventive: "MX(0, preventive_performed - preventive_reports)"
      - report_adjustment: "(K('repeat_report_adjustment_usd') if unreported_preventive >= 2 else (K('single_report_adjustment_usd') if unreported_preventive == 1 else 0))"
      - discounted_figure: "escalated_figure * (1 - portfolio_discount_share) - bundle_credit"
      - result: "RND(MX(P('min_annual_price_usd'), discounted_figure + arrears_surcharge - report_adjustment), 0)"
    compute_basis:
      visits_credited_term: "Where the visits completed on the agreement stand below the visits the term credited, the base is the annual price in force less the tier's price for one additional visit for each visit short of them."
      visits_performed_term: "A visit closed as no-access consumes none of the visits credited and is not counted among the visits completed."
      escalation_base: "The base the escalation acts on follows what the term just ending actually delivered. A visit closed as no-access consumes none of the visits credited and is not counted among the visits completed. Where the visits completed on the agreement stand above the visits the term credited, the base is the annual price in force together with the tier's price for one additional visit for each visit beyond them. Where the visits completed on the agreement stand below the visits the term credited, the base is the annual price in force less the tier's price for one additional visit for each visit short of them. Where the visits completed on the agreement match the visits the term credited, the base the escalation acts on is the annual price in force."
      late_charge_count: "Where one or two such charges stand on the agreement, the standing escalation is applied."
      escalation_pct: "The escalation applied follows how the account behaved through the term just ending. Where three or more charges for instalments left unpaid stand on the agreement, the arrears escalation is applied. Where one or two such charges stand on the agreement, the standing escalation is applied. Where no such charge stands on the agreement, the escalation applied is the escalation the tier publishes."
      escalated_figure: "The base is first raised by the escalation, giving the escalated figure; the portfolio discount is then taken off that escalated figure, and the building automation bundle credit is taken off the figure the discount leaves; the surcharge is added to what remains and the adjustment subtracted from it; the figure is compared with the tier's annual price floor and the higher of the two stands, and it is rounded to the nearest whole dollar once, on the final result alone."
      controls_status: "The portfolio discount follows the reach of the building automation service plan at the building."
      controls_points: "Where that plan stands in active status and covers two hundred or more monitored points, the full portfolio discount share is taken off."
      portfolio_discount_share: "Where that plan stands in active status and covers two hundred or more monitored points, the full portfolio discount share is taken off. Where that plan stands in active status and covers fewer than two hundred monitored points, the part portfolio discount share is taken off. Where the owner holds no building automation service plan in active status, no portfolio discount is taken off."
      controls_alarm_allowance: "The building automation bundle credit follows whether that plan is still watching alarms."
      bundle_credit: "Where the plan stands in active status and still carries alarm responses in its allowance, the tier's bundle credit is taken off in full. Where the plan stands in active status and its alarm allowance is exhausted, the tier's bundle credit is taken off at the exhausted bundle share. Where the owner holds no building automation service plan in active status, no building automation bundle credit is taken off."
      payments_count: "Where coverage stood withdrawn in the term and six or more payments have been received on the agreement, the part arrears surcharge is carried."
      coverage_was_withdrawn: "Where coverage never stood withdrawn in the term, no surcharge is carried."
      arrears_surcharge: "A surcharge is carried by an account that ran behind in the term just ending. Where coverage stood withdrawn in the term and fewer than six payments have been received on the agreement, the full arrears surcharge is carried. Where coverage stood withdrawn in the term and six or more payments have been received on the agreement, the part arrears surcharge is carried. Where coverage never stood withdrawn in the term, no surcharge is carried."
      preventive_performed: "Where exactly one preventive visit completed in the term carries no written condition report, the single report adjustment is earned."
      preventive_reports: "Where every preventive visit completed in the term carries a written condition report, no adjustment is earned."
      unreported_preventive: "Where two or more preventive visits completed on the agreement carry no written condition report, the repeat report adjustment is earned."
      report_adjustment: "An adjustment is earned where the office owes the owner written condition reports. Where two or more preventive visits completed on the agreement carry no written condition report, the repeat report adjustment is earned. Where exactly one preventive visit completed in the term carries no written condition report, the single report adjustment is earned. Where every preventive visit completed in the term carries a written condition report, no adjustment is earned."
      discounted_figure: "The base is first raised by the escalation, giving the escalated figure; the portfolio discount is then taken off that escalated figure, and the building automation bundle credit is taken off the figure the discount leaves; the surcharge is added to what remains and the adjustment subtracted from it; the figure is compared with the tier's annual price floor and the higher of the two stands, and it is rounded to the nearest whole dollar once, on the final result alone."
      result: "The base is first raised by the escalation, giving the escalated figure; the portfolio discount is then taken off that escalated figure, and the building automation bundle credit is taken off the figure the discount leaves; the surcharge is added to what remains and the adjustment subtracted from it; the figure is compared with the tier's annual price floor and the higher of the two stands, and it is rounded to the nearest whole dollar once, on the final result alone."
    factors:
      - id: term_conduct_escalation
        effect: parameter
        decides: escalation_pct
        bindings: [late_charge_count, escalation_pct]
        ladder:
          - when: "three or more charges for instalments left unpaid stand on the agreement"
            value: "the arrears escalation"
          - when: "one or two such charges stand on the agreement"
            value: "the standing escalation"
          - when: "no such charge stands on the agreement"
            value: "the escalation the tier publishes"
        baseline:
          escalation_pct: "P('annual_escalation_pct')"
        evidence: [history]
        cross_difficulty: null
      - id: delivered_term_base
        effect: method
        decides: escalation_base
        bindings: [visits_credited_term, visits_performed_term, escalation_base]
        ladder:
          - when: "the visits completed on the agreement stand above the visits the term credited"
            method: "the base is the annual price in force together with the tier's price for one additional visit for each visit beyond them"
          - when: "the visits completed on the agreement stand below the visits the term credited"
            method: "the base is the annual price in force less the tier's price for one additional visit for each visit short of them"
          - when: "the visits completed on the agreement match the visits the term credited"
            method: "the base is the annual price in force"
        baseline:
          escalation_base: "F('annual_price_usd')"
        evidence: [history]
        cross_difficulty: null
      - id: automation_reach_discount
        effect: parameter
        decides: portfolio_discount_share
        bindings: [controls_status, controls_points, portfolio_discount_share]
        ladder:
          - when: "the building's automation service plan stands in active status and covers two hundred or more monitored points"
            value: "the full portfolio discount share"
          - when: "that plan stands in active status and covers fewer than two hundred monitored points"
            value: "the part portfolio discount share"
          - when: "the owner holds no building automation service plan in active status"
            value: "no portfolio discount"
        baseline:
          portfolio_discount_share: "0"
        evidence: [cross_category]
        cross_difficulty: controls
      - id: alarm_watch_bundle_credit
        effect: parameter
        decides: bundle_credit
        bindings: [controls_alarm_allowance, bundle_credit]
        ladder:
          - when: "the plan stands in active status and still carries alarm responses in its allowance"
            value: "the tier's bundle credit in full"
          - when: "the plan stands in active status and its alarm allowance is exhausted"
            value: "the tier's bundle credit at the exhausted bundle share"
          - when: "the owner holds no building automation service plan in active status"
            value: "no building automation bundle credit"
        baseline:
          bundle_credit: "0"
        evidence: [cross_category]
        cross_difficulty: controls
      - id: behind_account_surcharge
        effect: parameter
        decides: arrears_surcharge
        bindings: [payments_count, coverage_was_withdrawn, arrears_surcharge]
        ladder:
          - when: "coverage stood withdrawn in the term and fewer than six payments have been received on the agreement"
            value: "the full arrears surcharge"
          - when: "coverage stood withdrawn in the term and six or more payments have been received on the agreement"
            value: "the part arrears surcharge"
          - when: "coverage never stood withdrawn in the term"
            value: "no surcharge"
        baseline:
          arrears_surcharge: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: report_shortfall_adjustment
        effect: parameter
        decides: report_adjustment
        bindings: [preventive_performed, preventive_reports, unreported_preventive, report_adjustment]
        ladder:
          - when: "two or more preventive visits completed on the agreement carry no written condition report"
            value: "the repeat report adjustment"
          - when: "exactly one preventive visit completed in the term carries no written condition report"
            value: "the single report adjustment"
          - when: "every preventive visit completed in the term carries a written condition report"
            value: "no adjustment"
        baseline:
          report_adjustment: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The price of a further term is built from the base the escalation acts on, the escalation applied
        to it, the portfolio discount taken off the escalated figure, the building automation bundle
        credit taken off after that discount, the surcharge an account that ran behind carries and the
        adjustment the term's service record earns. The base the escalation acts on is the annual price in
        force. The escalation applied is the escalation the tier publishes. No portfolio discount and no
        building automation bundle credit are taken off, no surcharge is carried and no adjustment is earned.
        The base is first raised by the escalation, giving the escalated figure; the portfolio discount is
        then taken off that escalated figure, and the building automation bundle credit is taken off the
        figure the discount leaves; the surcharge is added to what remains and the adjustment subtracted from
        it; the figure is compared with the tier's annual price floor and the higher of the two stands, and
        it is rounded to the nearest whole dollar once, on the final result alone.
      params: [annual_escalation_pct, min_annual_price_usd]
    inputs:
      history:
        - {table: maintenance_events, aggregate: count, field: event_id, within_months: 12, filters: {event_type: maintenance_visit_completed}}
        - {table: maintenance_events, aggregate: count, field: event_id, within_months: 12, filters: {event_type: maintenance_fee_charged, charge_type: late_fee}}
        - {table: maintenance_events, aggregate: count, field: event_id, within_months: 12, filters: {event_type: maintenance_payment_received}}
      cross_category: [controls]
