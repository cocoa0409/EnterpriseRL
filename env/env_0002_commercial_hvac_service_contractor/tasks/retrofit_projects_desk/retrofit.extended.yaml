        period runs from the day the crew mobilised, and the days of delay are the calendar days from the
        end of that period to the day the system was accepted as running for its intended use, the last day
        of the period excluded and the day of acceptance included. The guaranteed period is not extended.
        No grace is allowed past the end of the guaranteed period, and the guarantee is not suspended. The
        daily amount is the daily amount the project's class carries, with nothing added to it. Where the
        days of delay fall below zero they are counted as none. The damages are the days of delay
        multiplied by the daily amount, and they are never more than the ceiling the class puts on them,
        which is its portion of the contract value; the smaller of the two is credited and the figure is
