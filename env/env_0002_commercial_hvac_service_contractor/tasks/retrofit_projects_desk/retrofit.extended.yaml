            value: "K('full_allowance_pct')"
          - when: "an active maintenance agreement covers the building and it was signed after the project was awarded"
            value: "K('part_allowance_pct')"
          - when: "no active maintenance agreement covers the building"
            value: "K('no_allowance_pct')"
        baseline:
          allowance_pct: "K('no_allowance_pct')"
        evidence: [cross_category, date]
        cross_difficulty: maintenance
    baseline:
