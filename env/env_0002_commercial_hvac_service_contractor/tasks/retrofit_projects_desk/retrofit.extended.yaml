        bindings: [service_status, service_critical_hours, daily_addition]
        ladder:
          - when: "the owner carries an active demand service rate program whose guaranteed response at a critical facility is 4 hours or less"
            value: "K('critical_day_usd')"
          - when: "the owner carries an active demand service rate program whose guaranteed response at a critical facility is more than 4 hours"
            value: "K('standard_day_usd')"
          - when: "the owner carries no active demand service rate program"
            value: "K('no_daily_addition')"
        baseline:
          daily_addition: "K('no_daily_addition')"
        evidence: [cross_category]
        cross_difficulty: service
    baseline:
