        - {table: retrofit_events, aggregate: latest, field: inspected_date, within_months: null, filters: {event_type: retrofit_inspection_passed, inspection_class: owner_walkthrough}}
        - {table: retrofit_events, aggregate: count, field: event_id, within_months: null, filters: {event_type: retrofit_progress_billed, billing_class: remobilization}}
        - {table: retrofit_requests, aggregate: count, field: request_id, within_months: null, filters: {request_type: closeout_acceptance, outcome: confirmed}}
