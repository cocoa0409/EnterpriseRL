        ladder:
          - when: "the issued change orders state schedule impact on a change the owner asked for or on a schedule acceleration"
            method: "the guaranteed period is extended by every impact day stated on the issued change orders"
          - when: "the issued change orders state schedule impact on a concealed condition or a code requirement and none on a change the owner asked for or a schedule acceleration"
            method: "the guaranteed period is extended by the impact days stated on the concealed conditions and the code requirements alone"
          - when: "otherwise"
            method: "the guaranteed period is extended by half of the impact days stated on supplier substitutions, rounded down to a whole day"
