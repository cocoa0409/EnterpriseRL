        ladder:
          - when: "an energy subscription covers the building and its class carries a guaranteed savings commitment"
            value: "P('liquidated_damages_per_day_usd') + K('performance_day_usd')"
          - when: "an energy subscription covers the building and its class carries no guaranteed savings commitment"
            value: "P('liquidated_damages_per_day_usd') + K('metered_day_usd')"
          - when: "no energy subscription covers the building"
            value: "P('liquidated_damages_per_day_usd')"
        baseline:
          daily_amount: "P('liquidated_damages_per_day_usd')"
        evidence: [cross_category]
        cross_difficulty: energy
      - id: critical_response_addition
