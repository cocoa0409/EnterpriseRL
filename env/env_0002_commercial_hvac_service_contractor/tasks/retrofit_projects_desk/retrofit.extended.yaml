  - id: retrofit_ext_retainage_release
    base_policy_refs: [retrofit_progress_billing_and_retainage, retrofit_completion_and_closeout]
    overwrite:
      - base_policy: retrofit_progress_billing_and_retainage
        superseded_clause: >-
          The tier's retainage is withheld from every progress and change order billing, not from the
          deposit or from stored equipment, and it is held until closeout.
        replaced_by: >-
          The retainage held on the project is the retainage withheld on its record less the retainage
          already released on it.
    trigger: state_due
    subject: [retrofit_retainage_released]
    computes: retainage_release_usd
    target_tool: release_project_retainage_a81bb865
    params:
      rate_check_tolerance: 0.01
      full_release_share: 100
      uncommissioned_release_share: 90
      uninspected_release_share: 50
      full_credit_share: 100
      half_credit_share: 50
      no_credit_share: 0
      unpaid_tenth_share: 10
    rule: >-
      The retainage released on a project at closeout is worked out from the retainage held on it, the
      share of that retainage the work has earned and the credits standing against it. The retainage held
      on the project is the retainage withheld on its record less the retainage already released on it.
      The whole of the retainage held is releasable. The share released is the whole of the releasable
      retainage. The gross release is the releasable retainage taken at the share released and rounded to
      the nearest cent. No credit standing on the project is set against the release. The retainage
      released is the gross release less the credit set against it, rounded to the nearest cent, and where
      that difference falls below zero nothing is released.
      The retainage released on a project is worked out only after every day of delay past the day
      substantial completion was guaranteed by stands credited on the project's account.
      Where a withholding on the project was taken at more than the rate the project's class withholds,
      measured against the progress billings it was withheld from, the retainage held is recomputed at the
      class's rate on those progress billings and the retainage already released is taken off it; where
      every withholding was taken at the class's rate and retainage stands withheld on the project, the
      retainage held is the retainage withheld on the record less the retainage already released; where no
      retainage stands withheld on the project, nothing is held.
      Where an amount stands unpaid on the project's contract billings and retainage stands held on it, the
      releasable retainage is the retainage held less the class's retainage rate taken on the amount
      standing unpaid, the retainage on work the owner has not paid for staying where it is; where nothing
      stands unpaid on the contract billings and retainage stands held, the whole of the retainage held is
      releasable; where no retainage stands held on the project, nothing is releasable. The amount standing
      unpaid on the contract billings is the deposit, mobilisation, progress and change order billings
      raised on the project less the retainage withheld from them and less every payment received, and late
      fees and remobilisation fees are no part of it.
      Where an authority inspection and a commissioning inspection have both been passed on the project,
      the share released is the whole of the releasable retainage; where an authority inspection has been
      passed and no commissioning inspection stands on the project, the share released is 90 per cent of
      the releasable retainage, the balance staying until the system is commissioned; where no authority
      inspection has been passed on the project, the share released is 50 per cent of the releasable
      retainage.
      Where credits stand on the project and the amount standing unpaid on its contract billings is more
      than a tenth of the contract value, the whole of those credits is set against the release; where credits stand on the project and the amount standing unpaid on its contract billings is a tenth
      of the contract value or less, nothing standing unpaid included, half of those credits is set against
      the release and the rest is settled on the account; where no credit stands on the project, nothing is
      set against the release.
    prerequisite:
      - problem: retrofit_ext_liquidated_damages_credit
        kind: value_input
        gate: credits_on_project
        form: state
        policy_source: >-
          The retainage released on a project is worked out only after every day of delay past the day
          substantial completion was guaranteed by stands credited on the project's account.
        condition: >-
          Every day of delay past the day substantial completion was guaranteed by stands as a credit on
          the project's account.
        resolved_by: credit_liquidated_damages_732a84c1
        effect: >-
          The credits standing on the project rise by the liquidated damages credited, and the release
          falls by the share of those credits that is set against it.
    cross_category: []
    compute:
      - recorded_withheld: "SUM('retrofit_events','amount_usd', event_type='retrofit_retainage_withheld')"
      - released_already: "SUM('retrofit_events','amount_usd', event_type='retrofit_retainage_released')"
      - progress_billed: "SUM('retrofit_events','amount_usd', event_type='retrofit_progress_billed', billing_class='progress')"
      - rate_checked_withheld: "RND(progress_billed * P('retainage_pct') / 100, 2)"
      - retainage_held: "(rate_checked_withheld - released_already) if (recorded_withheld > rate_checked_withheld + K('rate_check_tolerance')) else ((recorded_withheld - released_already) if recorded_withheld > 0 else 0)"
      - contract_billed: "SUM('retrofit_events','amount_usd', event_type='retrofit_progress_billed', billing_class='deposit') + SUM('retrofit_events','amount_usd', event_type='retrofit_progress_billed', billing_class='mobilization') + progress_billed + SUM('retrofit_events','amount_usd', event_type='retrofit_progress_billed', billing_class='change_order')"
      - payments_total: "SUM('retrofit_events','amount_usd', event_type='retrofit_payment_received')"
      - unpaid_contract: "MX(0, contract_billed - recorded_withheld - payments_total)"
      - releasable_retainage: "(retainage_held - RND(unpaid_contract * P('retainage_pct') / 100, 2)) if (unpaid_contract > 0 and retainage_held > 0) else (retainage_held if (unpaid_contract <= 0 and retainage_held > 0) else 0)"
      - authority_inspections: "COUNT('retrofit_events', event_type='retrofit_inspection_passed', inspection_class='mechanical_permit') + COUNT('retrofit_events', event_type='retrofit_inspection_passed', inspection_class='fire_marshal')"
      - commissioning_inspections: "COUNT('retrofit_events', event_type='retrofit_inspection_passed', inspection_class='commissioning')"
      - release_share: "K('full_release_share') if (authority_inspections >= 1 and commissioning_inspections >= 1) else (K('uncommissioned_release_share') if (authority_inspections >= 1 and commissioning_inspections == 0) else K('uninspected_release_share'))"
      - credits_on_project: "SUM('retrofit_events','amount_usd', event_type='retrofit_credit_issued')"
      - credit_offset_share: "K('full_credit_share') if (credits_on_project > 0 and unpaid_contract > RND(F('contract_value_usd') * K('unpaid_tenth_share') / 100, 2)) else (K('half_credit_share') if (credits_on_project > 0 and unpaid_contract <= RND(F('contract_value_usd') * K('unpaid_tenth_share') / 100, 2)) else K('no_credit_share'))"
      - gross_release: "RND(releasable_retainage * release_share / 100, 2)"
      - credit_offset: "RND(credits_on_project * credit_offset_share / 100, 2)"
      - result: "RND(MX(0, gross_release - credit_offset), 2)"
    compute_basis:
      recorded_withheld: "where every withholding was taken at the class's rate and retainage stands withheld on the project, the retainage held is the retainage withheld on the record less the retainage already released"
      released_already: "The retainage held on the project is the retainage withheld on its record less the retainage already released on it."
      progress_billed: "Where a withholding on the project was taken at more than the rate the project's class withholds, measured against the progress billings it was withheld from, the retainage held is recomputed at the class's rate on those progress billings and the retainage already released is taken off it"
      rate_checked_withheld: "the retainage held is recomputed at the class's rate on those progress billings and the retainage already released is taken off it"
      retainage_held: "Where a withholding on the project was taken at more than the rate the project's class withholds, measured against the progress billings it was withheld from, the retainage held is recomputed at the class's rate on those progress billings and the retainage already released is taken off it; where every withholding was taken at the class's rate and retainage stands withheld on the project, the retainage held is the retainage withheld on the record less the retainage already released; where no retainage stands withheld on the project, nothing is held."
      contract_billed: "The amount standing unpaid on the contract billings is the deposit, mobilisation, progress and change order billings raised on the project less the retainage withheld from them and less every payment received, and late fees and remobilisation fees are no part of it."
      payments_total: "less the retainage withheld from them and less every payment received"
      unpaid_contract: "The amount standing unpaid on the contract billings is the deposit, mobilisation, progress and change order billings raised on the project less the retainage withheld from them and less every payment received, and late fees and remobilisation fees are no part of it."
      releasable_retainage: "Where an amount stands unpaid on the project's contract billings and retainage stands held on it, the releasable retainage is the retainage held less the class's retainage rate taken on the amount standing unpaid, the retainage on work the owner has not paid for staying where it is; where nothing stands unpaid on the contract billings and retainage stands held, the whole of the retainage held is releasable; where no retainage stands held on the project, nothing is releasable."
      authority_inspections: "where no authority inspection has been passed on the project, the share released is 50 per cent of the releasable retainage"
      commissioning_inspections: "where an authority inspection has been passed and no commissioning inspection stands on the project, the share released is 90 per cent of the releasable retainage, the balance staying until the system is commissioned"
      release_share: "Where an authority inspection and a commissioning inspection have both been passed on the project, the share released is the whole of the releasable retainage; where an authority inspection has been passed and no commissioning inspection stands on the project, the share released is 90 per cent of the releasable retainage, the balance staying until the system is commissioned; where no authority inspection has been passed on the project, the share released is 50 per cent of the releasable retainage."
      credits_on_project: "where no credit stands on the project, nothing is set against the release"
      credit_offset_share: "Where credits stand on the project and the amount standing unpaid on its contract billings is more than a tenth of the contract value, the whole of those credits is set against the release; where credits stand on the project and the amount standing unpaid on its contract billings is a tenth of the contract value or less, nothing standing unpaid included, half of those credits is set against the release and the rest is settled on the account; where no credit stands on the project, nothing is set against the release."
      gross_release: "The gross release is the releasable retainage taken at the share released and rounded to the nearest cent."
      credit_offset: "The retainage released is the gross release less the credit set against it, rounded to the nearest cent, and where that difference falls below zero nothing is released."
      result: "The retainage released is the gross release less the credit set against it, rounded to the nearest cent, and where that difference falls below zero nothing is released."
    factors:
      - id: withholding_rate_check
        effect: method
        decides: retainage_held
        bindings: [recorded_withheld, released_already, progress_billed, rate_checked_withheld, retainage_held]
        ladder:
          - when: "a withholding on the project was taken at more than the rate the project's class withholds, measured against the progress billings it was withheld from"
            method: "the retainage held is recomputed at the class's rate on those progress billings and the retainage already released is taken off it"
          - when: "every withholding was taken at the class's rate and retainage stands withheld on the project"
            method: "the retainage held is the retainage withheld on the record less the retainage already released"
          - when: "no retainage stands withheld on the project"
            method: "nothing is held"
        baseline:
          retainage_held: "(recorded_withheld - released_already)"
        evidence: [history]
        cross_difficulty: null
      - id: unpaid_work_retention
        effect: method
        decides: releasable_retainage
        bindings: [contract_billed, payments_total, unpaid_contract, releasable_retainage]
        ladder:
          - when: "an amount stands unpaid on the project's contract billings and retainage stands held on it"
            method: "the releasable retainage is the retainage held less the class's retainage rate taken on the amount standing unpaid"
          - when: "nothing stands unpaid on the contract billings and retainage stands held"
            method: "the whole of the retainage held is releasable"
          - when: "no retainage stands held on the project"
            method: "nothing is releasable"
        baseline:
          releasable_retainage: "retainage_held"
        evidence: [history]
        cross_difficulty: null
      - id: inspection_release_share
        effect: parameter
        decides: release_share
        bindings: [authority_inspections, commissioning_inspections, release_share]
        ladder:
          - when: "an authority inspection and a commissioning inspection have both been passed on the project"
            value: "K('full_release_share')"
          - when: "an authority inspection has been passed and no commissioning inspection stands on the project"
            value: "K('uncommissioned_release_share')"
          - when: "no authority inspection has been passed on the project"
            value: "K('uninspected_release_share')"
        baseline:
          release_share: "K('full_release_share')"
        evidence: [history]
        cross_difficulty: null
      - id: credit_offset_on_release
        effect: parameter
        decides: credit_offset_share
        bindings: [credits_on_project, credit_offset_share]
        ladder:
          - when: "credits stand on the project and the amount standing unpaid on its contract billings is more than a tenth of the contract value"
            value: "K('full_credit_share')"
          - when: "credits stand on the project and the amount standing unpaid on its contract billings is a tenth of the contract value or less, nothing standing unpaid included"
            value: "K('half_credit_share')"
          - when: "no credit stands on the project"
            value: "K('no_credit_share')"
        baseline:
          credit_offset_share: "K('no_credit_share')"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The retainage released on a project at closeout is worked out from the retainage held on it, the
        share of that retainage the work has earned and the credits standing against it. The retainage held
        on the project is the retainage withheld on its record less the retainage already released on it.
        The whole of the retainage held is releasable. The share released is the whole of the releasable
        retainage. The gross release is the releasable retainage taken at the share released and rounded to
        the nearest cent. No credit standing on the project is set against the release. The retainage
        released is the gross release less the credit set against it, rounded to the nearest cent, and
        where that difference falls below zero nothing is released.
      params: [full_release_share, no_credit_share, retainage_pct]
    inputs:
      history:
        - {table: retrofit_events, aggregate: sum, field: amount_usd, within_months: null, filters: {event_type: retrofit_retainage_withheld}}
        - {table: retrofit_events, aggregate: sum, field: amount_usd, within_months: null, filters: {event_type: retrofit_progress_billed}}
        - {table: retrofit_events, aggregate: sum, field: amount_usd, within_months: null, filters: {event_type: retrofit_payment_received}}
        - {table: retrofit_events, aggregate: count, field: event_id, within_months: null, filters: {event_type: retrofit_inspection_passed}}
      cross_category: []

  - id: retrofit_ext_overdue_invoice_late_fee
    base_policy_refs: [retrofit_progress_billing_and_retainage]
    overwrite:
      - base_policy: retrofit_progress_billing_and_retainage
        superseded_clause: >-
          Each invoice falls due the tier's payment term after the invoice date, counted in calendar days
          with the invoice day excluded and the due day included, and an invoice unpaid past its due day
          carries the tier's late fee for each month or part month it stays unpaid.
        replaced_by: >-
          The late fee raised is the smaller of the fee before the ceiling and that ceiling, rounded to the
          nearest cent.
    trigger: state_due
    subject: [retrofit_progress_billed]
    computes: late_fee_amount_usd
    target_tool: bill_overdue_late_fee_5c3179f3
    params:
      full_rate_share: 100
      three_quarter_rate_share: 75
      half_rate_share: 50
      arrears_surcharge_pct: 0.5
      mild_surcharge_pct: 0.25
      no_surcharge_pct: 0
      high_cap_pct: 10
      mid_cap_pct: 5
      base_cap_pct: 2
      long_overdue_days: 60
      short_overdue_days: 30
      long_silence_days: 90
      unpaid_tenth_share: 10
      days_in_month: 30
      one_month: 1
    rule: >-
      The late fee owed on a project whose billings have run past their due day is worked out from the
      amount the fee is taken on, the monthly rate the fee is charged at and the months the amount has
      stood overdue. The amount the fee is taken on is everything billed on the project by way of deposit,
      mobilisation, progress and change order billings, less every payment received. The overdue clock runs
      from the day the most recent progress billing fell due, and the days overdue are the calendar days
      from that day to the day the fee is raised. The months overdue are counted as one month. The monthly
      rate is the rate the project's class charges for each month, with nothing added to it. The fee before
      the ceiling is the amount the fee is taken on, multiplied by the monthly rate and by the months
      overdue, rounded to the nearest cent. The ceiling on the fee is 2 per cent of the amount the fee is
      taken on. The late fee raised is the smaller of the fee before the ceiling and that ceiling, rounded
      to the nearest cent.
      Where the project stands substantially complete and retainage stands withheld on it, the amount the
      fee is taken on is everything billed by way of deposit, mobilisation, progress and change order
      billings, less the retainage withheld from those billings and less every payment received, because
      retainage the owner has never been invoiced cannot be overdue; where the project has not reached
      substantial completion and has not closed, the amount the fee is taken on is the progress billings
      alone less every payment received, the deposit and the mobilisation fee not carrying a late fee while
      the work is still running; in every other case the amount the fee is taken on is everything billed by
      way of deposit, mobilisation, progress and change order billings, less every payment received.
      Where a payment has been received on the project after the day the most recent progress billing fell
      due, the overdue clock runs from the day of that payment, a payment on account restarting the clock;
      where no payment has been received after that day and a progress billing has fallen due, the overdue
      clock runs from the day the most recent progress billing fell due; where no progress billing has
      fallen due on the project, no overdue clock runs and no late fee is raised.
      Where the amount has stood overdue for 60 days or more, each month or part month begun counts as a
      whole month; where the amount has stood overdue for more than 30 days but fewer than 60, the months
      overdue are counted pro rata by the day, as the days overdue divided by thirty and taken to two
      decimal places; where the amount has stood overdue for 30 days or fewer, the months overdue are
      counted as one month.
      Where the owner carries an active demand service rate program that stands clear of any unpaid
      balance, and the amount the fee is taken on is no more than a tenth of the contract value, the fee is
      charged at half the rate the project's class charges for each month; where the owner carries an
      active demand service rate program that stands clear of any unpaid balance, and the amount the fee is
      taken on is more than a tenth of the contract value, the fee is charged at three quarters of that
      rate; where the owner carries no active demand service rate program or that program carries an unpaid
      balance, the fee is charged at that rate in full.
      Where the maintenance agreement covering the building stands suspended and carries an unpaid balance,
      the arrears surcharge is added to the monthly rate; where the maintenance agreement covering the
      building stands active and carries an unpaid balance, the mild surcharge is added to the monthly
      rate; where the maintenance agreement covering the building carries no unpaid balance, or the
      building carries no maintenance agreement at all, nothing is added to the monthly rate.
      Where nothing has been paid on the project for 90 days or more, the ceiling on the fee is 10 per cent
      of the amount the fee is taken on; where nothing has been paid on the project for more than 30 days
      but fewer than 90, the ceiling is 5 per cent of that amount; where a payment has been received on the
      project within the last 30 days, or no payment has yet been received on it, the ceiling is 2 per cent
      of that amount.
    prerequisite: []
    cross_category:
      - category: service
        as: branch
        reads: [status, balance_due]
        note: >-
          The rate factor reads the standing and the unpaid balance of the owner's demand service rate
          program.
      - category: maintenance
        as: branch
        reads: [status, balance_due]
        note: >-
          The surcharge factor reads the standing and the unpaid balance of the maintenance agreement
          covering the same building.
    compute:
      - deposit_billed: "SUM('retrofit_events','amount_usd', event_type='retrofit_progress_billed', billing_class='deposit')"
      - mobilization_billed: "SUM('retrofit_events','amount_usd', event_type='retrofit_progress_billed', billing_class='mobilization')"
      - progress_billed: "SUM('retrofit_events','amount_usd', event_type='retrofit_progress_billed', billing_class='progress')"
      - change_order_billed: "SUM('retrofit_events','amount_usd', event_type='retrofit_progress_billed', billing_class='change_order')"
      - retainage_withheld_total: "SUM('retrofit_events','amount_usd', event_type='retrofit_retainage_withheld')"
      - payments_total: "SUM('retrofit_events','amount_usd', event_type='retrofit_payment_received')"
      - contract_billed: "deposit_billed + mobilization_billed + progress_billed + change_order_billed"
      - fee_base: "MX(0, contract_billed - retainage_withheld_total - payments_total) if (F('status') == 'substantially_complete' and retainage_withheld_total > 0) else (MX(0, progress_billed - payments_total) if (F('status') != 'substantially_complete' and F('status') != 'closed') else MX(0, contract_billed - payments_total))"
      - last_progress_due: "LATEST('retrofit_events','due_date', date_field='due_date', event_type='retrofit_progress_billed', billing_class='progress')"
      - last_payment_on: "LATEST('retrofit_events','received_date', date_field='received_date', event_type='retrofit_payment_received')"
      - payment_after_due: "1 if (last_progress_due and last_payment_on and DAYS(last_progress_due, last_payment_on) > 0) else 0"
      - overdue_anchor: "last_payment_on if (payment_after_due == 1 and last_progress_due) else (last_progress_due if (payment_after_due == 0 and last_progress_due) else NOW)"
      - clock_runs: "1 if last_progress_due else 0"
      - overdue_days: "MX(0, DAYS(overdue_anchor, NOW))"
      - months_overdue: "int((overdue_days + K('days_in_month') - 1) / K('days_in_month')) if overdue_days >= K('long_overdue_days') else (RND(overdue_days / K('days_in_month'), 2) if overdue_days > K('short_overdue_days') else K('one_month'))"
      - service_status: "CFIELD('service','status')"
      - service_balance: "CFIELD('service','balance_due')"
      - rate_share: "K('half_rate_share') if (service_status == 'active' and service_balance == 0 and fee_base <= RND(F('contract_value_usd') * K('unpaid_tenth_share') / 100, 2)) else (K('three_quarter_rate_share') if (service_status == 'active' and service_balance == 0) else K('full_rate_share'))"
      - maintenance_status: "CFIELD('maintenance','status', site_id=F('site_id'))"
      - maintenance_balance: "CFIELD('maintenance','balance_due', site_id=F('site_id'))"
      - rate_surcharge: "K('arrears_surcharge_pct') if (maintenance_status == 'suspended' and maintenance_balance > 0) else (K('mild_surcharge_pct') if (maintenance_status == 'active' and maintenance_balance > 0) else K('no_surcharge_pct'))"
      - monthly_rate: "P('late_fee_pct_per_month') * rate_share / 100 + rate_surcharge"
      - raw_fee: "RND(fee_base * monthly_rate / 100 * months_overdue, 2)"
      - days_since_last_payment: "MX(0, DAYS(last_payment_on, NOW)) if last_payment_on else 0"
      - fee_ceiling_share: "K('high_cap_pct') if days_since_last_payment >= K('long_silence_days') else (K('mid_cap_pct') if days_since_last_payment > K('short_overdue_days') else K('base_cap_pct'))"
      - fee_ceiling: "RND(fee_base * fee_ceiling_share / 100, 2)"
      - result: "RND(MN(raw_fee, fee_ceiling) * clock_runs, 2)"
    compute_basis:
      deposit_billed: "The amount the fee is taken on is everything billed on the project by way of deposit, mobilisation, progress and change order billings, less every payment received."
      mobilization_billed: "The amount the fee is taken on is everything billed on the project by way of deposit, mobilisation, progress and change order billings, less every payment received."
      progress_billed: "where the project has not reached substantial completion and has not closed, the amount the fee is taken on is the progress billings alone less every payment received, the deposit and the mobilisation fee not carrying a late fee while the work is still running"
      change_order_billed: "The amount the fee is taken on is everything billed on the project by way of deposit, mobilisation, progress and change order billings, less every payment received."
      retainage_withheld_total: "Where the project stands substantially complete and retainage stands withheld on it, the amount the fee is taken on is everything billed by way of deposit, mobilisation, progress and change order billings, less the retainage withheld from those billings and less every payment received, because retainage the owner has never been invoiced cannot be overdue"
      payments_total: "less every payment received"
      fee_base: "Where the project stands substantially complete and retainage stands withheld on it, the amount the fee is taken on is everything billed by way of deposit, mobilisation, progress and change order billings, less the retainage withheld from those billings and less every payment received, because retainage the owner has never been invoiced cannot be overdue; where the project has not reached substantial completion and has not closed, the amount the fee is taken on is the progress billings alone less every payment received, the deposit and the mobilisation fee not carrying a late fee while the work is still running; in every other case the amount the fee is taken on is everything billed by way of deposit, mobilisation, progress and change order billings, less every payment received."
      last_progress_due: "The overdue clock runs from the day the most recent progress billing fell due, and the days overdue are the calendar days from that day to the day the fee is raised."
      last_payment_on: "Where a payment has been received on the project after the day the most recent progress billing fell due, the overdue clock runs from the day of that payment, a payment on account restarting the clock"
      payment_after_due: "where no payment has been received after that day and a progress billing has fallen due, the overdue clock runs from the day the most recent progress billing fell due"
      overdue_anchor: "Where a payment has been received on the project after the day the most recent progress billing fell due, the overdue clock runs from the day of that payment, a payment on account restarting the clock; where no payment has been received after that day and a progress billing has fallen due, the overdue clock runs from the day the most recent progress billing fell due; where no progress billing has fallen due on the project, no overdue clock runs and no late fee is raised."
      clock_runs: "where no progress billing has fallen due on the project, no overdue clock runs and no late fee is raised"
      overdue_days: "the days overdue are the calendar days from that day to the day the fee is raised"
      months_overdue: "Where the amount has stood overdue for 60 days or more, each month or part month begun counts as a whole month; where the amount has stood overdue for more than 30 days but fewer than 60, the months overdue are counted pro rata by the day, as the days overdue divided by thirty and taken to two decimal places; where the amount has stood overdue for 30 days or fewer, the months overdue are counted as one month."
      contract_billed: "The amount the fee is taken on is everything billed on the project by way of deposit, mobilisation, progress and change order billings, less every payment received."
      service_status: "where the owner carries no active demand service rate program or that program carries an unpaid balance, the fee is charged at that rate in full"
      service_balance: "Where the owner carries an active demand service rate program that stands clear of any unpaid balance, and the amount the fee is taken on is no more than a tenth of the contract value, the fee is charged at half the rate the project's class charges for each month"
      rate_share: "Where the owner carries an active demand service rate program that stands clear of any unpaid balance, and the amount the fee is taken on is no more than a tenth of the contract value, the fee is charged at half the rate the project's class charges for each month; where the owner carries an active demand service rate program that stands clear of any unpaid balance, and the amount the fee is taken on is more than a tenth of the contract value, the fee is charged at three quarters of that rate; where the owner carries no active demand service rate program or that program carries an unpaid balance, the fee is charged at that rate in full."
      maintenance_status: "Where the maintenance agreement covering the building stands suspended and carries an unpaid balance, the arrears surcharge is added to the monthly rate"
      maintenance_balance: "where the maintenance agreement covering the building carries no unpaid balance, or the building carries no maintenance agreement at all, nothing is added to the monthly rate"
      rate_surcharge: "Where the maintenance agreement covering the building stands suspended and carries an unpaid balance, the arrears surcharge is added to the monthly rate; where the maintenance agreement covering the building stands active and carries an unpaid balance, the mild surcharge is added to the monthly rate; where the maintenance agreement covering the building carries no unpaid balance, or the building carries no maintenance agreement at all, nothing is added to the monthly rate."
      monthly_rate: "The monthly rate is the rate the project's class charges for each month, with nothing added to it."
      raw_fee: "The fee before the ceiling is the amount the fee is taken on, multiplied by the monthly rate and by the months overdue, rounded to the nearest cent."
      days_since_last_payment: "where a payment has been received on the project within the last 30 days, or no payment has yet been received on it, the ceiling is 2 per cent of that amount"
      fee_ceiling_share: "Where nothing has been paid on the project for 90 days or more, the ceiling on the fee is 10 per cent of the amount the fee is taken on; where nothing has been paid on the project for more than 30 days but fewer than 90, the ceiling is 5 per cent of that amount; where a payment has been received on the project within the last 30 days, or no payment has yet been received on it, the ceiling is 2 per cent of that amount."
      fee_ceiling: "The ceiling on the fee is 2 per cent of the amount the fee is taken on."
      result: "The late fee raised is the smaller of the fee before the ceiling and that ceiling, rounded to the nearest cent."
    factors:
      - id: overdue_base_scope
        effect: method
        decides: fee_base
        bindings: [retainage_withheld_total, payments_total, contract_billed, fee_base]
        ladder:
          - when: "the project stands substantially complete and retainage stands withheld on it"
            method: "the amount the fee is taken on is everything billed by way of deposit, mobilisation, progress and change order billings, less the retainage withheld from those billings and less every payment received"
          - when: "the project has not reached substantial completion and has not closed"
            method: "the amount the fee is taken on is the progress billings alone less every payment received"
          - when: "otherwise"
            method: "the amount the fee is taken on is everything billed by way of deposit, mobilisation, progress and change order billings, less every payment received"
        baseline:
          fee_base: "MX(0, contract_billed - payments_total)"
        evidence: [history]
        cross_difficulty: null
      - id: overdue_clock_anchor
        effect: method
        decides: overdue_anchor
        bindings: [last_progress_due, last_payment_on, payment_after_due, overdue_anchor]
        ladder:
          - when: "a payment has been received on the project after the day the most recent progress billing fell due"
            method: "the overdue clock runs from the day of that payment"
          - when: "no payment has been received after that day and a progress billing has fallen due"
            method: "the overdue clock runs from the day the most recent progress billing fell due"
          - when: "no progress billing has fallen due on the project"
            method: "no overdue clock runs and no late fee is raised"
        baseline:
          overdue_anchor: "last_progress_due"
        evidence: [history, date]
        cross_difficulty: null
      - id: overdue_month_count
        effect: method
        decides: months_overdue
        bindings: [overdue_days, months_overdue]
        ladder:
          - when: "the amount has stood overdue for 60 days or more"
            method: "each month or part month begun counts as a whole month"
          - when: "the amount has stood overdue for more than 30 days but fewer than 60"
            method: "the months overdue are counted pro rata by the day, as the days overdue divided by thirty and taken to two decimal places"
          - when: "the amount has stood overdue for 30 days or fewer"
            method: "the months overdue are counted as one month"
        baseline:
          months_overdue: "K('one_month')"
        evidence: [date]
        cross_difficulty: null
      - id: account_standing_rate
        effect: parameter
        decides: rate_share
        bindings: [service_status, service_balance, rate_share]
        ladder:
          - when: "the owner carries an active demand service rate program that stands clear of any unpaid balance, and the amount the fee is taken on is no more than a tenth of the contract value"
            value: "K('half_rate_share')"
          - when: "the owner carries an active demand service rate program that stands clear of any unpaid balance, and the amount the fee is taken on is more than a tenth of the contract value"
            value: "K('three_quarter_rate_share')"
          - when: "the owner carries no active demand service rate program or that program carries an unpaid balance"
            value: "K('full_rate_share')"
        baseline:
          rate_share: "K('full_rate_share')"
        evidence: [cross_category]
        cross_difficulty: service
      - id: portfolio_arrears_surcharge
        effect: parameter
        decides: rate_surcharge
        bindings: [maintenance_status, maintenance_balance, rate_surcharge]
        ladder:
          - when: "the maintenance agreement covering the building stands suspended and carries an unpaid balance"
            value: "K('arrears_surcharge_pct')"
          - when: "the maintenance agreement covering the building stands active and carries an unpaid balance"
            value: "K('mild_surcharge_pct')"
          - when: "the maintenance agreement covering the building carries no unpaid balance, or the building carries no maintenance agreement at all"
            value: "K('no_surcharge_pct')"
        baseline:
          rate_surcharge: "K('no_surcharge_pct')"
        evidence: [cross_category]
        cross_difficulty: maintenance
      - id: payment_silence_ceiling
        effect: parameter
        decides: fee_ceiling_share
        bindings: [days_since_last_payment, fee_ceiling_share]
        ladder:
          - when: "nothing has been paid on the project for 90 days or more"
            value: "K('high_cap_pct')"
          - when: "nothing has been paid on the project for more than 30 days but fewer than 90"
            value: "K('mid_cap_pct')"
          - when: "a payment has been received on the project within the last 30 days, or no payment has yet been received on it"
            value: "K('base_cap_pct')"
        baseline:
          fee_ceiling_share: "K('base_cap_pct')"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        The late fee owed on a project whose billings have run past their due day is worked out from the
        amount the fee is taken on, the monthly rate the fee is charged at and the months the amount has
        stood overdue. The amount the fee is taken on is everything billed on the project by way of
        deposit, mobilisation, progress and change order billings, less every payment received. The overdue
        clock runs from the day the most recent progress billing fell due, and the days overdue are the
        calendar days from that day to the day the fee is raised. The months overdue are counted as one
        month. The monthly rate is the rate the project's class charges for each month, with nothing added
        to it. The fee before the ceiling is the amount the fee is taken on, multiplied by the monthly rate
        and by the months overdue, rounded to the nearest cent. The ceiling on the fee is 2 per cent of the
        amount the fee is taken on. The late fee raised is the smaller of the fee before the ceiling and
        that ceiling, rounded to the nearest cent.
      params: [one_month, full_rate_share, no_surcharge_pct, base_cap_pct, late_fee_pct_per_month]
    inputs:
      history:
        - {table: retrofit_events, aggregate: sum, field: amount_usd, within_months: null, filters: {event_type: retrofit_progress_billed}}
        - {table: retrofit_events, aggregate: sum, field: amount_usd, within_months: null, filters: {event_type: retrofit_payment_received}}
        - {table: retrofit_events, aggregate: latest, field: due_date, within_months: null, filters: {event_type: retrofit_progress_billed, billing_class: progress}}
        - {table: retrofit_events, aggregate: latest, field: received_date, within_months: null, filters: {event_type: retrofit_payment_received}}
      cross_category: [service, maintenance]

  - id: retrofit_ext_closeout_balance_payment
    base_policy_refs: [retrofit_progress_billing_and_retainage]
    overwrite:
      - base_policy: retrofit_progress_billing_and_retainage
        superseded_clause: >-
          Payments are applied to the oldest unpaid project invoice unless the owner names one.
        replaced_by: >-
          The amount to settle is everything settled now, less the retainage withheld from those billings,
          plus the retainage released settled with the balance, plus the late fees settled with the
          balance, less every payment received and less the credits taken off.
    trigger: on_request
    subject: [retrofit_payment_received]
    computes: payment_amount_usd
    target_tool: pay_project_balance_ec87bb4f
    params:
      full_retainage_share: 100
      half_retainage_share: 50
      no_retainage_share: 0
      full_credit_share: 100
      half_credit_share: 50
      no_credit_share: 0
      full_late_fee_share: 100
      half_late_fee_share: 50
      no_late_fee_share: 0
      long_release_days: 60
      arrears_fifth_share: 20
      arrears_tenth_share: 10
      full_allowance_pct: 1
      part_allowance_pct: 0.5
      no_allowance_pct: 0
      due_window_months: 60
    rule: >-
      The amount an owner settles a project at is worked out from what stands on the project's account, the
      retainage on it, the late fees raised on it and the credits standing against it. Everything settled
      now is every deposit, mobilisation, progress, change order and remobilisation billing raised on the
      project, whether or not its due day has passed. The retainage withheld from those billings is taken
      off, the owner never having been invoiced for it. None of the retainage released on the project is
      settled with the balance. No late fee raised on the project is settled with the balance. Half of
      every credit issued on the project is taken off the settlement, and the rest is taken off when the
      retainage held on it is released. No portfolio allowance is taken off. The amount to
      settle is everything settled now, less the retainage withheld from those billings, plus the retainage
      released settled with the balance, plus the late fees settled with the balance, less every payment
      received and less the credits taken off. That figure is then reduced by the portfolio allowance taken
      on it, the result is rounded to the nearest cent, and where it falls below zero nothing is settled.
      The amount an owner settles a project at is fixed only after the retainage held on the project stands
      released on its account.
      Before the amount to settle is worked out, every month the project's billings have stood past their
      due day must be carried as a late fee on the project's billing record.
      A billing whose due day has passed is one whose due day falls no later than the day of settlement and
      no earlier than five years before it, five years being as far back as a project account runs.
      Where the project stands substantially complete and has not been closed out, only the billings whose
      due day has passed are settled now, a billing not yet due being left to its own term; where the
      project has not reached substantial completion and has not been closed out, only the progress
      billings whose due day has passed are settled now; where the project has been closed out, every
      billing raised on it is settled now, whether or not its due day has passed.
      Where retainage stands released on the project and its class allows 60 days or more for that release,
      the whole of the retainage released is settled with the balance; where retainage stands released on
      the project and its class allows fewer than 60 days for that release, half of the retainage released
      is settled with the balance and the rest is invoiced on its own; where no retainage stands released
      on the project, none of it is settled with the balance.
      Where credits stand on the project and retainage held on it has been released, the whole of those
      credits is taken off the settlement; where credits stand on the project and no retainage has been
      released on it, half of those credits is taken off the settlement and the rest is taken off when the
      retainage is released; where no credit stands on the project, nothing is taken off for credits.
      Where the amount standing unpaid on the project's contract billings is more than a fifth of the
      contract value, every late fee raised on the project is settled with the balance; where the amount
      standing unpaid on the project's contract billings is more than a tenth of the contract value but no
      more than a fifth, half of the late fees raised is settled with the balance; where the amount
      standing unpaid on the project's contract billings is a tenth of the contract value or less, no late
      fee is settled with the balance.
      Where an active maintenance agreement covers the building and it was signed before the project was
      awarded, the portfolio allowance is 1 per cent of the figure settled; where an active maintenance
      agreement covers the building and it was signed after the project was awarded, the portfolio
      allowance is half of 1 per cent of that figure; where no active maintenance agreement covers the
      building, no portfolio allowance is taken off.
    prerequisite:
      - problem: retrofit_ext_retainage_release
        kind: value_input
        gate: retainage_released_total
        form: state
        policy_source: >-
          The amount an owner settles a project at is fixed only after the retainage held on the project
          stands released on its account.
        condition: >-
          The retainage held on the project stands released on its account.
        resolved_by: release_project_retainage_a81bb865
        effect: >-
          The retainage released on the project rises from nothing to the amount released, and the share of
          it settled with the balance is added to the amount to settle.
      - problem: retrofit_ext_overdue_invoice_late_fee
        kind: value_input
        gate: late_fees_total
        form: state
        policy_source: >-
          Before the amount to settle is worked out, every month the project's billings have stood past
          their due day must be carried as a late fee on the project's billing record.
        condition: >-
          Every month the project's billings have stood past their due day is carried as a late fee on the
          project's billing record.
        resolved_by: bill_overdue_late_fee_5c3179f3
        effect: >-
          The late fees raised on the project rise from nothing to the fee carried onto the billing record,
          and the share of them settled with the balance is added to the amount to settle.
    cross_category:
      - category: maintenance
        as: branch
        reads: [status, signed_date]
        note: >-
          The portfolio allowance factor reads the standing of the maintenance agreement covering the same
          building and the day it was signed.
    compute:
      - deposit_all: "SUM('retrofit_events','amount_usd', event_type='retrofit_progress_billed', billing_class='deposit')"
      - mobilization_all: "SUM('retrofit_events','amount_usd', event_type='retrofit_progress_billed', billing_class='mobilization')"
      - progress_all: "SUM('retrofit_events','amount_usd', event_type='retrofit_progress_billed', billing_class='progress')"
      - change_order_all: "SUM('retrofit_events','amount_usd', event_type='retrofit_progress_billed', billing_class='change_order')"
      - remobilization_all: "SUM('retrofit_events','amount_usd', event_type='retrofit_progress_billed', billing_class='remobilization')"
      - billed_all: "deposit_all + mobilization_all + progress_all + change_order_all + remobilization_all"
      - progress_due: "SUM('retrofit_events','amount_usd', within_months=K('due_window_months'), date_field='due_date', event_type='retrofit_progress_billed', billing_class='progress')"
      - billed_due: "SUM('retrofit_events','amount_usd', within_months=K('due_window_months'), date_field='due_date', event_type='retrofit_progress_billed', billing_class='deposit') + SUM('retrofit_events','amount_usd', within_months=K('due_window_months'), date_field='due_date', event_type='retrofit_progress_billed', billing_class='mobilization') + progress_due + SUM('retrofit_events','amount_usd', within_months=K('due_window_months'), date_field='due_date', event_type='retrofit_progress_billed', billing_class='change_order') + SUM('retrofit_events','amount_usd', within_months=K('due_window_months'), date_field='due_date', event_type='retrofit_progress_billed', billing_class='remobilization')"
      - retainage_withheld_total: "SUM('retrofit_events','amount_usd', event_type='retrofit_retainage_withheld')"
      - retainage_released_total: "SUM('retrofit_events','amount_usd', event_type='retrofit_retainage_released')"
      - settled_billings: "billed_due if F('status') == 'substantially_complete' else (progress_due if (F('status') != 'substantially_complete' and F('status') != 'closed') else billed_all)"
      - retainage_settlement_share: "K('full_retainage_share') if (retainage_released_total > 0 and P('retainage_release_days') >= K('long_release_days')) else (K('half_retainage_share') if (retainage_released_total > 0 and P('retainage_release_days') < K('long_release_days')) else K('no_retainage_share'))"
      - credits_total: "SUM('retrofit_events','amount_usd', event_type='retrofit_credit_issued')"
      - credit_share: "K('full_credit_share') if (credits_total > 0 and retainage_released_total > 0) else (K('half_credit_share') if (credits_total > 0 and retainage_released_total <= 0) else K('no_credit_share'))"
      - late_fees_total: "SUM('retrofit_events','amount_usd', event_type='retrofit_progress_billed', billing_class='late_fee')"
      - payments_total: "SUM('retrofit_events','amount_usd', event_type='retrofit_payment_received')"
      - unpaid_contract: "MX(0, deposit_all + mobilization_all + progress_all + change_order_all - retainage_withheld_total - payments_total)"
      - late_fee_share: "K('full_late_fee_share') if unpaid_contract > RND(F('contract_value_usd') * K('arrears_fifth_share') / 100, 2) else (K('half_late_fee_share') if unpaid_contract > RND(F('contract_value_usd') * K('arrears_tenth_share') / 100, 2) else K('no_late_fee_share'))"
      - maintenance_status: "CFIELD('maintenance','status', site_id=F('site_id'))"
      - maintenance_signed_on: "CFIELD('maintenance','signed_date', site_id=F('site_id'))"
      - allowance_pct: "K('full_allowance_pct') if (maintenance_status == 'active' and DAYS(maintenance_signed_on, F('award_date')) > 0) else (K('part_allowance_pct') if (maintenance_status == 'active' and DAYS(maintenance_signed_on, F('award_date')) <= 0) else K('no_allowance_pct'))"
      - gross_balance: "settled_billings - retainage_withheld_total + RND(retainage_released_total * retainage_settlement_share / 100, 2) + RND(late_fees_total * late_fee_share / 100, 2) - payments_total - RND(credits_total * credit_share / 100, 2)"
      - allowance: "RND(gross_balance * allowance_pct / 100, 2)"
      - result: "RND(MX(0, gross_balance - allowance), 2)"
    compute_basis:
      deposit_all: "Everything settled now is every deposit, mobilisation, progress, change order and remobilisation billing raised on the project, whether or not its due day has passed."
      mobilization_all: "Everything settled now is every deposit, mobilisation, progress, change order and remobilisation billing raised on the project, whether or not its due day has passed."
      progress_all: "Everything settled now is every deposit, mobilisation, progress, change order and remobilisation billing raised on the project, whether or not its due day has passed."
      change_order_all: "Everything settled now is every deposit, mobilisation, progress, change order and remobilisation billing raised on the project, whether or not its due day has passed."
      remobilization_all: "Everything settled now is every deposit, mobilisation, progress, change order and remobilisation billing raised on the project, whether or not its due day has passed."
      progress_due: "A billing whose due day has passed is one whose due day falls no later than the day of settlement and no earlier than five years before it, five years being as far back as a project account runs."
      billed_due: "A billing whose due day has passed is one whose due day falls no later than the day of settlement and no earlier than five years before it, five years being as far back as a project account runs."
      billed_all: "Everything settled now is every deposit, mobilisation, progress, change order and remobilisation billing raised on the project, whether or not its due day has passed."
      retainage_withheld_total: "The retainage withheld from those billings is taken off, the owner never having been invoiced for it."
      retainage_released_total: "where no retainage stands released on the project, none of it is settled with the balance"
      settled_billings: "Where the project stands substantially complete and has not been closed out, only the billings whose due day has passed are settled now, a billing not yet due being left to its own term; where the project has not reached substantial completion and has not been closed out, only the progress billings whose due day has passed are settled now; where the project has been closed out, every billing raised on it is settled now, whether or not its due day has passed."
      retainage_settlement_share: "Where retainage stands released on the project and its class allows 60 days or more for that release, the whole of the retainage released is settled with the balance; where retainage stands released on the project and its class allows fewer than 60 days for that release, half of the retainage released is settled with the balance and the rest is invoiced on its own; where no retainage stands released on the project, none of it is settled with the balance."
      credits_total: "where no credit stands on the project, nothing is taken off for credits"
      credit_share: "Where credits stand on the project and retainage held on it has been released, the whole of those credits is taken off the settlement; where credits stand on the project and no retainage has been released on it, half of those credits is taken off the settlement and the rest is taken off when the retainage is released; where no credit stands on the project, nothing is taken off for credits."
      late_fees_total: "No late fee raised on the project is settled with the balance."
      payments_total: "less every payment received and less the credits taken off"
      unpaid_contract: "Where the amount standing unpaid on the project's contract billings is more than a fifth of the contract value, every late fee raised on the project is settled with the balance"
      late_fee_share: "Where the amount standing unpaid on the project's contract billings is more than a fifth of the contract value, every late fee raised on the project is settled with the balance; where the amount standing unpaid on the project's contract billings is more than a tenth of the contract value but no more than a fifth, half of the late fees raised is settled with the balance; where the amount standing unpaid on the project's contract billings is a tenth of the contract value or less, no late fee is settled with the balance."
      maintenance_status: "where no active maintenance agreement covers the building, no portfolio allowance is taken off"
      maintenance_signed_on: "Where an active maintenance agreement covers the building and it was signed before the project was awarded, the portfolio allowance is 1 per cent of the figure settled"
      allowance_pct: "Where an active maintenance agreement covers the building and it was signed before the project was awarded, the portfolio allowance is 1 per cent of the figure settled; where an active maintenance agreement covers the building and it was signed after the project was awarded, the portfolio allowance is half of 1 per cent of that figure; where no active maintenance agreement covers the building, no portfolio allowance is taken off."
      gross_balance: "The amount to settle is everything settled now, less the retainage withheld from those billings, plus the retainage released settled with the balance, plus the late fees settled with the balance, less every payment received and less the credits taken off."
      allowance: "That figure is then reduced by the portfolio allowance taken on it, the result is rounded to the nearest cent, and where it falls below zero nothing is settled."
      result: "That figure is then reduced by the portfolio allowance taken on it, the result is rounded to the nearest cent, and where it falls below zero nothing is settled."
    factors:
      - id: due_now_scope
        effect: method
        decides: settled_billings
        bindings: [progress_due, billed_due, settled_billings]
        ladder:
          - when: "the project stands substantially complete and has not been closed out"
            method: "only the billings whose due day has passed are settled now"
          - when: "the project has not reached substantial completion and has not been closed out"
            method: "only the progress billings whose due day has passed are settled now"
          - when: "the project has been closed out"
            method: "every billing raised on it is settled now, whether or not its due day has passed"
        baseline:
          settled_billings: "billed_all"
        evidence: [history, date]
        cross_difficulty: null
      - id: released_retainage_settlement
        effect: parameter
        decides: retainage_settlement_share
        bindings: [retainage_released_total, retainage_settlement_share]
        ladder:
          - when: "retainage stands released on the project and its class allows 60 days or more for that release"
            value: "K('full_retainage_share')"
          - when: "retainage stands released on the project and its class allows fewer than 60 days for that release"
            value: "K('half_retainage_share')"
          - when: "no retainage stands released on the project"
            value: "K('no_retainage_share')"
        baseline:
          retainage_settlement_share: "K('no_retainage_share')"
        evidence: [history]
        cross_difficulty: null
      - id: credit_settlement_share
        effect: parameter
        decides: credit_share
        bindings: [credits_total, credit_share]
        ladder:
          - when: "credits stand on the project and retainage held on it has been released"
            value: "K('full_credit_share')"
          - when: "credits stand on the project and no retainage has been released on it"
            value: "K('half_credit_share')"
          - when: "no credit stands on the project"
            value: "K('no_credit_share')"
        baseline:
          credit_share: "K('half_credit_share')"
        evidence: [history]
        cross_difficulty: null
      - id: arrears_late_fee_settlement
        effect: parameter
        decides: late_fee_share
        bindings: [late_fees_total, unpaid_contract, late_fee_share]
        ladder:
          - when: "the amount standing unpaid on the project's contract billings is more than a fifth of the contract value"
            value: "K('full_late_fee_share')"
          - when: "the amount standing unpaid on the project's contract billings is more than a tenth of the contract value but no more than a fifth"
            value: "K('half_late_fee_share')"
          - when: "the amount standing unpaid on the project's contract billings is a tenth of the contract value or less"
            value: "K('no_late_fee_share')"
        baseline:
          late_fee_share: "K('no_late_fee_share')"
        evidence: [history]
        cross_difficulty: null
      - id: portfolio_settlement_allowance
        effect: parameter
        decides: allowance_pct
