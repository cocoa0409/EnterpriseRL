    factors:
      - id: guarantee_clock_anchor
        effect: method
        decides: clock_anchor
        bindings: [booked_start, reschedule_requests, clock_anchor]
        ladder:
          - when: "the crew mobilised on or before the day installation was booked to begin"
            method: "the guaranteed period runs from the day the crew mobilised"
          - when: "the crew mobilised after that booked day and a confirmed schedule request stands on the project record"
            method: "the guaranteed period runs from the day the owner asked for the start to be moved"
          - when: "the crew mobilised after that booked day and no confirmed schedule request stands on the project record"
