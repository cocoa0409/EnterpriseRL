events:
  - type: retrofit_project_estimated
    target: retrofit_projects
    mutation: create
    meaning: A replacement or retrofit is estimated for a building and the project record is opened.
    grain: One row per project estimated for one site at one tier.
    fields:
      project_id: The reference number of this project record.
      customer_id: The building owner the project is estimated for.
      site_id: The building the work is at.
      variant_name: The project class estimated, written as its official full name.
      status: The lifecycle status, pinned to estimated when the project is opened.
      estimate_date: The day the estimate was issued.
      contract_value_usd: The estimated contract value.
      scope_summary: The scope class of the work.
      equipment_type: The principal kind of equipment being replaced or installed.
      unit_count: The number of units in the scope.
    triggers: []
  - type: retrofit_project_awarded
    target: retrofit_projects
    mutation: {transition: {from: estimated, to: awarded}}
    meaning: The owner signs the proposal and the project is awarded.
    grain: One row per project, changed once when it is awarded.
    fields:
      status: The lifecycle status, moved to awarded.
      award_date: The day the owner signed the proposal.
      contract_value_usd: The contract value as awarded.
      purchase_order_ref: The owner's purchase order number for the project.
    triggers:
      - event: retrofit:retrofit_change_allowance_credited
        map: {project_id: project_id, customer_id: customer_id}
      - event: retrofit:retrofit_progress_billed
        map: {project_id: project_id, customer_id: customer_id, billing_class: deposit}
  - type: retrofit_estimate_declined
    target: retrofit_projects
    mutation: {transition: {from: estimated, to: declined}}
    meaning: The owner declines the estimate or lets it lapse.
    grain: One row per estimate, changed once when it closes unawarded.
    fields:
      status: The lifecycle status, moved to declined.
      cancellation_date: The day the estimate was closed.
      cancellation_reason: Why the estimate closed unawarded.
    triggers: []
  - type: retrofit_project_scheduled
    target: retrofit_projects
    mutation: {transition: {from: awarded, to: scheduled}}
    meaning: Equipment is released to the supplier and the installation is booked into the schedule.
    grain: One row per project, changed once when it is booked.
    fields:
      status: The lifecycle status, moved to scheduled.
      equipment_released_date: The day the equipment order was released to the supplier.
      scheduled_start_date: The day installation is booked to begin.
      expected_delivery_date: The day the equipment is expected on site.
    triggers: []
  - type: retrofit_work_started
    target: retrofit_projects
    mutation: {transition: {from: scheduled, to: in_progress}}
    meaning: The crew mobilises to site and installation begins.
    grain: One row per project, changed once when work begins.
    fields:
      status: The lifecycle status, moved to in_progress.
      mobilization_date: The day the crew mobilised; the day the schedule guarantee starts to run.
      guaranteed_completion_date: The day substantial completion is guaranteed by, where the tier carries a guarantee.
    triggers:
      - event: retrofit:retrofit_progress_billed
        map: {project_id: project_id, customer_id: customer_id, billing_class: mobilization}
  - type: retrofit_substantial_completion
    target: retrofit_projects
    mutation: {transition: {from: in_progress, to: substantially_complete}}
    meaning: The installed system runs for its intended use and only punch list items remain.
    grain: One row per project, changed once at substantial completion.
    fields:
      status: The lifecycle status, moved to substantially_complete.
      substantial_completion_date: The day the system was accepted as running for its intended use.
      punch_list_due_date: The day the punch list is due to be cleared.
      retainage_release_due_date: The day retainage falls due for release.
    triggers:
      - event: retrofit:retrofit_progress_billed
        map: {project_id: project_id, customer_id: customer_id, billing_class: completion}
  - type: retrofit_project_closed
    target: retrofit_projects
    mutation: {transition: {from: substantially_complete, to: closed}}
    meaning: The punch list is cleared, closeout documents are delivered and the project is closed.
    grain: One row per project, changed once at closeout.
    fields:
      status: The lifecycle status, moved to closed.
      completion_date: The day the project was closed out.
      warranty_start_date: The day the contractor's warranty on the installed work starts.
      warranty_end_date: The day the contractor's labor warranty on the installed work ends.
    triggers:
      - event: retrofit:retrofit_retainage_released
        map: {project_id: project_id, customer_id: customer_id}
  - type: retrofit_project_cancelled
    target: retrofit_projects
    mutation: {transition: [{from: awarded, to: cancelled}, {from: scheduled, to: cancelled}, {from: in_progress, to: cancelled}]}
    meaning: The project is stopped before completion and settled for what was performed and ordered.
    grain: One row per project, changed once when it is stopped.
    fields:
      status: The lifecycle status, moved to cancelled.
      cancellation_date: The day the cancellation was recorded.
      cancellation_stage: The stage the project had reached when it was cancelled.
      cancellation_reason: Why the project was stopped.
    triggers:
      - event: retrofit:retrofit_progress_billed
        when: {cancellation_reason: customer_convenience}
        map: {project_id: project_id, customer_id: customer_id, billing_class: cancellation}
  - type: retrofit_scope_updated
    target: retrofit_projects
    mutation: update
    meaning: The scope, value or booked dates of a live project change.
    grain: One row per project, changed once per accepted scope or schedule change.
    fields:
      contract_value_usd: The contract value after the change.
      unit_count: The number of units in the scope after the change.
      scheduled_start_date: The booked start after the change.
      expected_delivery_date: The expected equipment delivery after the change.
      last_change_type: What kind of change was applied.
      last_change_date: The day the change took effect.
    triggers: []
  - type: retrofit_equipment_delivered
    target: retrofit_events
    meaning: Ordered equipment arrives on site or at the warehouse.
    grain: One row per equipment delivery on one project.
    distinguish_by: [delivery_ref, delivered_date, equipment_tag]
    fields:
      project_id: The project the delivery belongs to.
      customer_id: The building owner the project belongs to.
      event_type: The event family of this row.
      site_id: The building the equipment is for.
      delivery_ref: The delivery reference number.
      delivered_date: The day the equipment arrived.
      equipment_tag: The tag the delivered unit will carry.
      equipment_type: The kind of unit delivered.
      stored_off_site: Whether the equipment had to be stored because the site could not receive it.
    triggers:
      - event: retrofit:retrofit_progress_billed
        when: {stored_off_site: stored}
        map: {project_id: project_id, customer_id: customer_id, billing_class: storage}
  - type: retrofit_inspection_passed
    target: retrofit_events
    meaning: An authority or commissioning inspection on the installed work is passed.
    grain: One row per inspection passed on one project.
    distinguish_by: [inspection_ref, inspected_date, inspection_class]
    fields:
      project_id: The project inspected.
      customer_id: The building owner the project belongs to.
      event_type: The event family of this row.
      site_id: The building inspected.
      inspection_ref: The inspection reference number.
      inspection_class: What kind of inspection this was.
      inspected_date: The day the inspection was passed.
    triggers: []
  - type: retrofit_change_order_issued
    target: retrofit_events
    account: change_order_allowance
    direction: out
    meaning: A change to the contracted scope is priced, authorised and added to the project.
    grain: One row per change order issued on one project.
    distinguish_by: [change_order_ref, issued_date, amount_usd]
    fields:
      project_id: The project the change belongs to.
      customer_id: The building owner who authorised it.
      event_type: The event family of this row.
      change_order_ref: The change order number.
      change_reason: Why the change arose.
      amount_usd: The value of the change.
      issued_date: The day the change order was issued.
      authorization_ref: The owner's written authorisation the change stands on.
      schedule_impact_days: Calendar days the change adds to the guaranteed completion date.
    triggers:
      - event: retrofit:retrofit_progress_billed
        map: {project_id: project_id, customer_id: customer_id, billing_class: change_order}
  - type: retrofit_change_allowance_credited
    target: retrofit_events
    account: change_order_allowance
    direction: in
    meaning: The owner-authorised change allowance is credited to the project at award.
    grain: One row per crediting of the change allowance on one project.
    distinguish_by: [credited_date, amount_usd]
    fields:
      project_id: The project the allowance is credited to.
      customer_id: The building owner the project belongs to.
      event_type: The event family of this row.
      amount_usd: The change allowance credited.
      credited_date: The day the allowance was credited.
    triggers: []
  - type: retrofit_progress_billed
    target: retrofit_events
    account: project_balance
    direction: in
    meaning: A progress billing, deposit or project fee is invoiced to the owner.
    grain: One row per billing line invoiced on one project.
    distinguish_by: [invoice_ref, billing_class, amount_usd, billing_period]
    fields:
      project_id: The project billed.
      customer_id: The building owner invoiced.
      event_type: The event family of this row.
      invoice_ref: The invoice the billing was raised on.
      billing_class: Which kind of billing this line is.
      amount_usd: The amount billed on this line, before retainage.
      percent_complete: The share of the contract value earned to date at this billing.
      billing_period: The period the billing covers.
      due_date: The day the invoice falls due.
      change_order_ref: The change order the billing arises from, where it arises from one.
    triggers:
      - event: retrofit:retrofit_retainage_withheld
        when: {billing_class: [progress, change_order]}
        map: {project_id: project_id, customer_id: customer_id, invoice_ref: invoice_ref}
  - type: retrofit_retainage_withheld
    target: retrofit_events
    account: retainage_held
    direction: in
    meaning: Retainage is withheld from a progress billing and held until closeout.
    grain: One row per retainage withholding on one progress billing.
    distinguish_by: [invoice_ref, withheld_date, amount_usd]
    fields:
      project_id: The project the retainage is held on.
      customer_id: The building owner the project belongs to.
      event_type: The event family of this row.
      invoice_ref: The progress billing the retainage was withheld from.
      amount_usd: The retainage withheld.
      withheld_date: The day the retainage was withheld.
    triggers: []
  - type: retrofit_retainage_released
    target: retrofit_events
    account: retainage_held
    direction: out
    meaning: Retainage held on the project is released and billed at closeout.
    grain: One row per retainage release on one project.
    distinguish_by: [invoice_ref, released_date, amount_usd]
    fields:
      project_id: The project the retainage is released on.
      customer_id: The building owner the project belongs to.
      event_type: The event family of this row.
      invoice_ref: The invoice the released retainage is billed on.
      amount_usd: The retainage released.
      released_date: The day the retainage was released.
    triggers: []
  - type: retrofit_payment_received
    target: retrofit_events
    account: project_balance
    direction: out
    meaning: A payment from the owner is applied to the project balance.
    grain: One row per payment applied to one project invoice.
    distinguish_by: [invoice_ref, received_date, amount_usd, payment_method]
    fields:
      project_id: The project the payment is applied to.
      customer_id: The building owner who paid.
      event_type: The event family of this row.
      invoice_ref: The invoice the payment is applied to.
      amount_usd: The amount paid.
      payment_method: How the payment was made.
      received_date: The day the payment was received.
    triggers: []
  - type: retrofit_credit_issued
    target: retrofit_events
    account: project_balance
    direction: out
    meaning: A credit is issued against the project, most often liquidated damages for a late completion.
    grain: One row per credit issued on one project.
    distinguish_by: [invoice_ref, credit_reason, amount_usd, issued_date]
    fields:
      project_id: The project credited.
      customer_id: The building owner credited.
      event_type: The event family of this row.
      invoice_ref: The invoice the credit is applied against.
      credit_reason: Why the credit was issued.
      amount_usd: The amount credited.
      issued_date: The day the credit was issued.
      delay_days: The days of delay the credit is computed from, where it is liquidated damages.
    triggers: []

measures:
  - id: retrofit_msr_change_orders_issued
    window: From the project's award_date to the handling day.
    measure: Sum of amount_usd over retrofit_change_order_issued rows on this project whose issued_date falls in the window.
  - id: retrofit_msr_billed_to_date
    window: From the project's award_date to the handling day.
    measure: Sum of amount_usd over retrofit_progress_billed rows on this project whose billing_class is deposit, mobilization, progress, change_order or completion.
  - id: retrofit_msr_schedule_impact_days
    window: From the project's mobilization_date to the handling day.
    measure: Sum of schedule_impact_days over retrofit_change_order_issued rows on this project whose issued_date falls in the window.

policies:
  - id: retrofit_agg_multi_holding
    subject: [retrofit_project_estimated]
    rule: >-
      A building owner may carry as many projects as they have buildings and scopes, and several projects may
      run at one building at the same time where their scopes do not overlap. A second project is not opened
      for a scope already covered by a project in estimated, awarded, scheduled or in_progress status at the
      same building; the existing project's scope is changed instead through a change order. Projects in
      closed, cancelled or declined status never block a new estimate. Each project holds its own contract
      value, retainage and change allowance, and nothing is pooled between projects, so a credit on one
      project is never set against the balance of another.
    eligibility:
      - id: no_overlapping_live_scope
        applies_to: [retrofit_project_estimated]
        kind: dedup
        condition: A second project is not opened for a scope already covered by a project in estimated, awarded, scheduled or in_progress status at the same building; the existing project's scope is changed instead through a change order.
        evidence_fields: [retrofit_projects.site_id, retrofit_projects.status, retrofit_projects.scope_summary, retrofit_projects.project_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [retrofit_projects.site_id, retrofit_projects.scope_summary]
          action_bindings:
            retrofit_projects.site_id: site_id
            retrofit_projects.scope_summary: scope_summary
        dedup_contract:
          table: retrofit_projects
          mode: separate_record
          object_bindings: {site_id: site_id, scope_summary: scope_summary}
          duplicate_filters: {status: [estimated, awarded, scheduled, in_progress]}
          distinct_fields: [variant_name, estimate_date]
    params:
      max_per_customer: null

  - id: retrofit_agg_portfolio_pricing
    subject: [retrofit_project_estimated, retrofit_scope_updated]
    rule: >-
      Where an owner runs several projects with the company at once, the portfolio is read before the estimate
      is priced. The portfolio value is the sum of contract_value_usd over that owner's projects standing in
      awarded, scheduled or in_progress status, plus the project being estimated; estimated, closed, cancelled
      and declined projects are not counted. A portfolio above the bonding threshold of the tier being priced
      is bonded as a whole rather than project by project, and the bond premium is apportioned across the
      projects by contract value. The tier's own minimum project value still governs each project on its own,
      so several small scopes are not combined to reach a tier the individual scopes do not meet; they are
      written as one project with one scope instead.
    eligibility: []
    params:
      per_tier:
        Equipment Replacement Order: {minimum_usd: "=minimum_project_value_usd", bond_above_usd: "=bond_required_above_usd", bond_rate_pct: "=bond_rate_pct"}
        Planned Replacement Program: {minimum_usd: "=minimum_project_value_usd", bond_above_usd: "=bond_required_above_usd", bond_rate_pct: "=bond_rate_pct"}
        Controls Retrofit Project: {minimum_usd: "=minimum_project_value_usd", bond_above_usd: "=bond_required_above_usd", bond_rate_pct: "=bond_rate_pct"}
        Energy Retrofit Project: {minimum_usd: "=minimum_project_value_usd", bond_above_usd: "=bond_required_above_usd", bond_rate_pct: "=bond_rate_pct"}
        Turnkey Mechanical Upgrade Project: {minimum_usd: "=minimum_project_value_usd", bond_above_usd: "=bond_required_above_usd", bond_rate_pct: "=bond_rate_pct"}
        Design-Build Infrastructure Program: {minimum_usd: "=minimum_project_value_usd", bond_above_usd: "=bond_required_above_usd", bond_rate_pct: "=bond_rate_pct"}

  - id: retrofit_estimating_and_award
    subject: [retrofit_project_estimated, retrofit_project_awarded, retrofit_estimate_declined]
    rule: >-
      A project is written at the tier whose minimum project value the estimated scope reaches, and a tier
      whose survey requirement is set is estimated only after a site survey of the existing system is recorded
      as completed in the office records. An estimate stays open for the tier's validity period, and a project
      is awarded only when the owner's signed proposal is recorded against it. The award must reach the office
      no later than the tier's estimate validity counted forward from the day the estimate was issued,
      counting calendar days with the day of issue excluded and the final day included; a lapsed estimate is
      repriced rather than honoured. Where the award is inside the estimate validity but the equipment price
      has been held longer than the tier's material price validity, the supplier's escalation is passed
      through as a change order at award rather than absorbed. The deposit falls due the tier's deposit period
      after the award day, and no equipment is released to the supplier until it is received.
    eligibility:
      - id: signed_proposal_on_file
        applies_to: [retrofit_project_awarded]
        kind: authorization
        condition: a project is awarded only when the owner's signed proposal is recorded against it
        evidence_fields: [retrofit_requests.project_id, retrofit_requests.request_type, retrofit_requests.outcome]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [retrofit_requests.project_id]
          action_bindings:
            retrofit_requests.project_id: project_id
      - id: award_inside_estimate_validity
        applies_to: [retrofit_project_awarded]
        kind: time
        condition: The award must reach the office no later than the tier's estimate validity counted forward from the day the estimate was issued, counting calendar days with the day of issue excluded and the final day included; a lapsed estimate is repriced rather than honoured.
        evidence_fields: [retrofit_projects.estimate_date, retrofit_projects.project_id, retrofit_projects.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [retrofit_projects.project_id]
          action_bindings:
            retrofit_projects.project_id: project_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the day the estimate was issued
          anchor_source: retrofit_projects.estimate_date
          relation: not_after
          duration_source: variants.estimate_validity_days
          unit: calendar_days
          counting_rule: counting calendar days with the day of issue excluded and the final day included
          boundary: inclusive
    params:
      per_tier:
        Equipment Replacement Order: {validity_days: "=estimate_validity_days", material_days: "=material_price_validity_days", deposit_pct: "=deposit_pct", deposit_days: "=deposit_due_days"}
        Planned Replacement Program: {validity_days: "=estimate_validity_days", material_days: "=material_price_validity_days", deposit_pct: "=deposit_pct", deposit_days: "=deposit_due_days"}
        Controls Retrofit Project: {validity_days: "=estimate_validity_days", material_days: "=material_price_validity_days", deposit_pct: "=deposit_pct", deposit_days: "=deposit_due_days"}
        Energy Retrofit Project: {validity_days: "=estimate_validity_days", material_days: "=material_price_validity_days", deposit_pct: "=deposit_pct", deposit_days: "=deposit_due_days"}
        Turnkey Mechanical Upgrade Project: {validity_days: "=estimate_validity_days", material_days: "=material_price_validity_days", deposit_pct: "=deposit_pct", deposit_days: "=deposit_due_days"}
        Design-Build Infrastructure Program: {validity_days: "=estimate_validity_days", material_days: "=material_price_validity_days", deposit_pct: "=deposit_pct", deposit_days: "=deposit_due_days"}
    formula:
      deposit_usd: "round(contract_value_usd * deposit_pct / 100, 2)"

  - id: retrofit_scheduling_and_delivery
    subject: [retrofit_project_scheduled, retrofit_equipment_delivered, retrofit_work_started, retrofit_scope_updated]
    rule: >-
      Equipment is released to the supplier once the deposit is received and, where the tier requires one, the
      owner-named insurance certificate has been issued. The booked start is set from the quoted lead time for
      the principal equipment type, counted in whole weeks from the day the equipment order was released, and
      a lead time the supplier later extends moves the booked start without changing the contract value.
      Equipment delivered before the site can receive it is stored, and storage beyond the week of delivery
      carries the tier's weekly storage charge, counted per whole week begun. Mobilisation starts the schedule
      guarantee where the tier carries one. Temporary cooling during the changeover is provided at no charge
      only where the tier includes it; elsewhere it is charged at the tier's daily rate for each day it stands
      on site. After-hours and weekend installation is performed at no premium only where the tier includes
      it; at other tiers the premium is added to the labor of those hours.
    eligibility:
      - id: deposit_received_before_release
        applies_to: [retrofit_project_scheduled]
        kind: authorization
        condition: Equipment is released to the supplier once the deposit is received and, where the tier requires one, the owner-named insurance certificate has been issued.
        evidence_fields: [retrofit_events.billing_class, retrofit_events.invoice_ref, retrofit_events.project_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [retrofit_events.project_id]
          action_bindings:
            retrofit_events.project_id: project_id
    params:
      per_tier:
        Equipment Replacement Order: {lead_times: "=lead_time_weeks_by_equipment_type", storage_usd: "=storage_fee_per_week_usd", temp_cooling: "=temporary_cooling_included", temp_daily_usd: "=temporary_cooling_daily_usd", after_hours_pct: "=after_hours_premium_pct"}
        Planned Replacement Program: {lead_times: "=lead_time_weeks_by_equipment_type", storage_usd: "=storage_fee_per_week_usd", temp_cooling: "=temporary_cooling_included", temp_daily_usd: "=temporary_cooling_daily_usd", after_hours_pct: "=after_hours_premium_pct"}
        Controls Retrofit Project: {lead_times: "=lead_time_weeks_by_equipment_type", storage_usd: "=storage_fee_per_week_usd", temp_cooling: "=temporary_cooling_included", temp_daily_usd: "=temporary_cooling_daily_usd", after_hours_pct: "=after_hours_premium_pct"}
        Energy Retrofit Project: {lead_times: "=lead_time_weeks_by_equipment_type", storage_usd: "=storage_fee_per_week_usd", temp_cooling: "=temporary_cooling_included", temp_daily_usd: "=temporary_cooling_daily_usd", after_hours_pct: "=after_hours_premium_pct"}
        Turnkey Mechanical Upgrade Project: {lead_times: "=lead_time_weeks_by_equipment_type", storage_usd: "=storage_fee_per_week_usd", temp_cooling: "=temporary_cooling_included", temp_daily_usd: "=temporary_cooling_daily_usd", after_hours_pct: "=after_hours_premium_pct"}
        Design-Build Infrastructure Program: {lead_times: "=lead_time_weeks_by_equipment_type", storage_usd: "=storage_fee_per_week_usd", temp_cooling: "=temporary_cooling_included", temp_daily_usd: "=temporary_cooling_daily_usd", after_hours_pct: "=after_hours_premium_pct"}

  - id: retrofit_change_orders
    subject: [retrofit_change_order_issued, retrofit_change_allowance_credited]
    rule: >-
      A change to the contracted scope is priced at cost plus the tier's change order markup and is issued
      against the project's change allowance, which is credited at award as the tier's portion of the contract
      value. A change whose value passes the tier's authorisation threshold is not issued until the owner's
      written authorisation for that change order is recorded in the office records; a verbal instruction on
      site, however senior the person giving it, is never enough for such a change. A change order that
      already carries an authorisation is not issued a second time for the same change. A requested change is
      priced inside the tier's response period, counted in business days from the day the owner asked for it.
      Changes are drawn from the allowance first and the remainder is added to the contract value; the
      allowance is never refunded if it goes unused, because it is an authority to spend and not a deposit.
      Where a change adds days to the work, those days extend the guaranteed completion date by the schedule
      impact stated on the change order.
    eligibility:
      - id: owner_authorization_for_large_change
        applies_to: [retrofit_change_order_issued]
        kind: authorization
        condition: A change whose value passes the tier's authorisation threshold is not issued until the owner's written authorisation for that change order is recorded in the office records; a verbal instruction on site, however senior the person giving it, is never enough for such a change.
        evidence_fields: [retrofit_requests.change_order_ref, retrofit_requests.request_type, retrofit_requests.outcome, retrofit_requests.project_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [retrofit_requests.change_order_ref]
          action_bindings:
            retrofit_requests.change_order_ref: change_order_ref
      - id: change_order_not_issued_twice
        applies_to: [retrofit_change_order_issued]
        kind: dedup
        condition: A change order that already carries an authorisation is not issued a second time for the same change.
        evidence_fields: [retrofit_events.change_order_ref, retrofit_events.authorization_ref, retrofit_events.project_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [retrofit_events.change_order_ref]
          action_bindings:
            retrofit_events.change_order_ref: change_order_ref
        dedup_contract:
          table: retrofit_events
          mode: separate_record
          object_bindings: {change_order_ref: change_order_ref}
          duplicate_filters: {event_type: [retrofit_change_order_issued]}
          distinct_fields: [issued_date, amount_usd]
    measures: [retrofit_msr_change_orders_issued, retrofit_msr_schedule_impact_days]
    params:
      per_tier:
        Equipment Replacement Order: {allowance_pct: "=change_order_allowance_pct", markup_pct: "=change_order_markup_pct", approval_above_usd: "=change_order_approval_above_usd", response_days: "=change_order_response_business_days"}
        Planned Replacement Program: {allowance_pct: "=change_order_allowance_pct", markup_pct: "=change_order_markup_pct", approval_above_usd: "=change_order_approval_above_usd", response_days: "=change_order_response_business_days"}
        Controls Retrofit Project: {allowance_pct: "=change_order_allowance_pct", markup_pct: "=change_order_markup_pct", approval_above_usd: "=change_order_approval_above_usd", response_days: "=change_order_response_business_days"}
        Energy Retrofit Project: {allowance_pct: "=change_order_allowance_pct", markup_pct: "=change_order_markup_pct", approval_above_usd: "=change_order_approval_above_usd", response_days: "=change_order_response_business_days"}
        Turnkey Mechanical Upgrade Project: {allowance_pct: "=change_order_allowance_pct", markup_pct: "=change_order_markup_pct", approval_above_usd: "=change_order_approval_above_usd", response_days: "=change_order_response_business_days"}
        Design-Build Infrastructure Program: {allowance_pct: "=change_order_allowance_pct", markup_pct: "=change_order_markup_pct", approval_above_usd: "=change_order_approval_above_usd", response_days: "=change_order_response_business_days"}
    formula:
      allowance_credited_usd: "round(contract_value_usd * change_order_allowance_pct / 100, 2)"

  - id: retrofit_progress_billing_and_retainage
    subject: [retrofit_progress_billed, retrofit_retainage_withheld, retrofit_retainage_released, retrofit_payment_received]
    rule: >-
      Progress is billed on the tier's billing frequency against the tier's basis, and the amount earned to a
      billing is the share of the contract value complete at the period close less everything billed before
      it. The tier's retainage is withheld from every progress and change order billing, not from the deposit
      or from stored equipment, and it is held until closeout. Each invoice falls due the tier's payment term
      after the invoice date, counted in calendar days with the invoice day excluded and the due day included,
      and an invoice unpaid past its due day carries the tier's late fee for each month or part month it stays
      unpaid. Where a progress billing stays unpaid beyond the tier's stoppage period, work on site stops and
      the tier's remobilisation fee is charged when it resumes. Retainage is released within the tier's
      release period counted forward in calendar days from the day the system was accepted as running for its
      intended use, provided the punch list is cleared and the closeout documents are delivered. Payments are
      applied to the oldest unpaid project invoice unless the owner names one.
    eligibility:
      - id: retainage_release_after_completion
        applies_to: [retrofit_retainage_released]
        kind: time
        condition: Retainage is released within the tier's release period counted forward in calendar days from the day the system was accepted as running for its intended use, provided the punch list is cleared and the closeout documents are delivered.
        evidence_fields: [retrofit_projects.substantial_completion_date, retrofit_projects.project_id, retrofit_projects.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [retrofit_projects.project_id]
          action_bindings:
            retrofit_projects.project_id: project_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the day the system was accepted as running for its intended use
          anchor_source: retrofit_projects.substantial_completion_date
          relation: not_after
          duration_source: variants.retainage_release_days
          unit: calendar_days
          counting_rule: counted forward in calendar days from the day the system was accepted as running for its intended use
          boundary: inclusive
    measures: [retrofit_msr_billed_to_date]
    params:
      per_tier:
        Equipment Replacement Order: {frequency: "=progress_billing_frequency", basis: "=progress_billing_basis", retainage_pct: "=retainage_pct", release_days: "=retainage_release_days", terms_days: "=payment_terms_days", late_fee_pct: "=late_fee_pct_per_month", stoppage_days: "=suspension_after_days_past_due", remob_usd: "=work_stoppage_remobilization_fee_usd"}
        Planned Replacement Program: {frequency: "=progress_billing_frequency", basis: "=progress_billing_basis", retainage_pct: "=retainage_pct", release_days: "=retainage_release_days", terms_days: "=payment_terms_days", late_fee_pct: "=late_fee_pct_per_month", stoppage_days: "=suspension_after_days_past_due", remob_usd: "=work_stoppage_remobilization_fee_usd"}
        Controls Retrofit Project: {frequency: "=progress_billing_frequency", basis: "=progress_billing_basis", retainage_pct: "=retainage_pct", release_days: "=retainage_release_days", terms_days: "=payment_terms_days", late_fee_pct: "=late_fee_pct_per_month", stoppage_days: "=suspension_after_days_past_due", remob_usd: "=work_stoppage_remobilization_fee_usd"}
        Energy Retrofit Project: {frequency: "=progress_billing_frequency", basis: "=progress_billing_basis", retainage_pct: "=retainage_pct", release_days: "=retainage_release_days", terms_days: "=payment_terms_days", late_fee_pct: "=late_fee_pct_per_month", stoppage_days: "=suspension_after_days_past_due", remob_usd: "=work_stoppage_remobilization_fee_usd"}
        Turnkey Mechanical Upgrade Project: {frequency: "=progress_billing_frequency", basis: "=progress_billing_basis", retainage_pct: "=retainage_pct", release_days: "=retainage_release_days", terms_days: "=payment_terms_days", late_fee_pct: "=late_fee_pct_per_month", stoppage_days: "=suspension_after_days_past_due", remob_usd: "=work_stoppage_remobilization_fee_usd"}
        Design-Build Infrastructure Program: {frequency: "=progress_billing_frequency", basis: "=progress_billing_basis", retainage_pct: "=retainage_pct", release_days: "=retainage_release_days", terms_days: "=payment_terms_days", late_fee_pct: "=late_fee_pct_per_month", stoppage_days: "=suspension_after_days_past_due", remob_usd: "=work_stoppage_remobilization_fee_usd"}
    formula:
      retainage_usd: "round(amount_usd * retainage_pct / 100, 2)"
      late_fee_usd: "round(amount_usd * late_fee_pct_per_month / 100, 2)"

  - id: retrofit_completion_and_closeout
    subject: [retrofit_substantial_completion, retrofit_inspection_passed, retrofit_project_closed]
    rule: >-
      Substantial completion is reached when the installed system runs for its intended use, the required
      authority inspections have been passed and start-up has been performed where the tier includes it; a
      punch list of minor items does not delay it. The punch list is cleared inside the tier's punch list
      period and the closeout documents — the start-up report, the warranty registration, the balancing report
      and the as-built drawings where the tier includes them — are delivered inside the tier's closeout
      period, both counted in business days from substantial completion on the office calendar, which excludes
      Saturdays, Sundays and the office holidays published for the year. Operator training of the tier's hours
      is delivered before the project closes. The contractor's labor warranty on the installed work runs for
      the tier's warranty months from substantial completion, and the tier's parts warranty runs alongside the
      manufacturer's rather than after it. The project closes when the punch list is clear, the documents are
      delivered and the retainage is released.
    eligibility:
      - id: inspections_passed_before_completion
        applies_to: [retrofit_substantial_completion]
        kind: authorization
        condition: Substantial completion is reached when the installed system runs for its intended use, the required authority inspections have been passed and start-up has been performed where the tier includes it; a punch list of minor items does not delay it.
        evidence_fields: [retrofit_events.inspection_ref, retrofit_events.inspection_class, retrofit_events.project_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [retrofit_events.project_id]
          action_bindings:
            retrofit_events.project_id: project_id
    params:
      per_tier:
        Equipment Replacement Order: {punch_days: "=punch_list_business_days", closeout_days: "=closeout_documents_business_days", training_hours: "=owner_training_hours", warranty_labor_months: "=warranty_labor_months", warranty_parts_months: "=warranty_parts_months"}
        Planned Replacement Program: {punch_days: "=punch_list_business_days", closeout_days: "=closeout_documents_business_days", training_hours: "=owner_training_hours", warranty_labor_months: "=warranty_labor_months", warranty_parts_months: "=warranty_parts_months"}
        Controls Retrofit Project: {punch_days: "=punch_list_business_days", closeout_days: "=closeout_documents_business_days", training_hours: "=owner_training_hours", warranty_labor_months: "=warranty_labor_months", warranty_parts_months: "=warranty_parts_months"}
        Energy Retrofit Project: {punch_days: "=punch_list_business_days", closeout_days: "=closeout_documents_business_days", training_hours: "=owner_training_hours", warranty_labor_months: "=warranty_labor_months", warranty_parts_months: "=warranty_parts_months"}
        Turnkey Mechanical Upgrade Project: {punch_days: "=punch_list_business_days", closeout_days: "=closeout_documents_business_days", training_hours: "=owner_training_hours", warranty_labor_months: "=warranty_labor_months", warranty_parts_months: "=warranty_parts_months"}
        Design-Build Infrastructure Program: {punch_days: "=punch_list_business_days", closeout_days: "=closeout_documents_business_days", training_hours: "=owner_training_hours", warranty_labor_months: "=warranty_labor_months", warranty_parts_months: "=warranty_parts_months"}

  - id: retrofit_schedule_guarantee
    subject: [retrofit_credit_issued]
    rule: >-
      Where the tier carries a schedule guarantee, substantial completion is guaranteed inside the tier's
      guaranteed period counted forward in calendar days from the day the crew mobilised, the mobilisation day
      excluded and the final day included, extended by the schedule impact days stated on every issued change
      order and by any delay the owner or the authority caused. Liquidated damages are credited at the tier's
      daily amount for each calendar day of delay past that date, capped at the tier's portion of the contract
      value, and they are the owner's whole remedy for lateness. Delay caused by a supplier's extended lead
      time is not excused: the guarantee runs from mobilisation, and the equipment is released early enough to
      make it. A tier that carries no schedule guarantee owes no liquidated damages however late the project
      runs, and the desk says so plainly rather than offering a discretionary credit.
    eligibility:
      - id: completion_past_guaranteed_date
        applies_to: [retrofit_credit_issued]
        kind: time
        condition: substantial completion is guaranteed inside the tier's guaranteed period counted forward in calendar days from the day the crew mobilised, the mobilisation day excluded and the final day included, extended by the schedule impact days stated on every issued change order and by any delay the owner or the authority caused
        evidence_fields: [retrofit_projects.mobilization_date, retrofit_projects.substantial_completion_date, retrofit_projects.project_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [retrofit_projects.project_id]
          action_bindings:
            retrofit_projects.project_id: project_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the day the crew mobilised
          anchor_source: retrofit_projects.mobilization_date
          relation: not_after
          duration_source: variants.schedule_guarantee_days
          unit: calendar_days
          counting_rule: counted forward in calendar days from the day the crew mobilised, the mobilisation day excluded and the final day included
          boundary: inclusive
    params:
      per_tier:
        Equipment Replacement Order: {guarantee_days: "=schedule_guarantee_days", damages_per_day_usd: "=liquidated_damages_per_day_usd", cap_pct: "=liquidated_damages_cap_pct"}
        Planned Replacement Program: {guarantee_days: "=schedule_guarantee_days", damages_per_day_usd: "=liquidated_damages_per_day_usd", cap_pct: "=liquidated_damages_cap_pct"}
        Controls Retrofit Project: {guarantee_days: "=schedule_guarantee_days", damages_per_day_usd: "=liquidated_damages_per_day_usd", cap_pct: "=liquidated_damages_cap_pct"}
        Energy Retrofit Project: {guarantee_days: "=schedule_guarantee_days", damages_per_day_usd: "=liquidated_damages_per_day_usd", cap_pct: "=liquidated_damages_cap_pct"}
        Turnkey Mechanical Upgrade Project: {guarantee_days: "=schedule_guarantee_days", damages_per_day_usd: "=liquidated_damages_per_day_usd", cap_pct: "=liquidated_damages_cap_pct"}
        Design-Build Infrastructure Program: {guarantee_days: "=schedule_guarantee_days", damages_per_day_usd: "=liquidated_damages_per_day_usd", cap_pct: "=liquidated_damages_cap_pct"}
    formula:
      amount_usd: "min(round(contract_value_usd * liquidated_damages_cap_pct / 100, 2), delay_days * liquidated_damages_per_day_usd)"

  - id: retrofit_cancellation_and_settlement
    subject: [retrofit_project_cancelled]
    rule: >-
      An owner may stop a project, and what it costs depends on the stage it had reached. Cancelled after
      award and before the equipment order is released, the tier's awarded-stage fee applies to the contract
      value. Cancelled after the equipment is released, the tier's scheduled-stage fee applies and the
      supplier's restocking fee is passed through on equipment that can be returned, while equipment that
      cannot be returned is invoiced in full and left with the owner. Cancelled after mobilisation, the
      tier's in-progress fee applies on top of everything earned to the stop day, and retainage already
      withheld is released against the final settlement. A project the company stops because the owner has
      not paid carries no cancellation fee but does carry the work performed and the remobilisation fee if it
      restarts. Deposits are applied to the settlement and refunded only where the settlement is smaller than
      the deposit.
    eligibility: []
    params:
      per_tier:
        Equipment Replacement Order: {awarded_pct: "=cancellation_fee_pct_awarded", scheduled_pct: "=cancellation_fee_pct_scheduled", in_progress_pct: "=cancellation_fee_pct_in_progress", restocking_pct: "=restocking_fee_pct"}
        Planned Replacement Program: {awarded_pct: "=cancellation_fee_pct_awarded", scheduled_pct: "=cancellation_fee_pct_scheduled", in_progress_pct: "=cancellation_fee_pct_in_progress", restocking_pct: "=restocking_fee_pct"}
        Controls Retrofit Project: {awarded_pct: "=cancellation_fee_pct_awarded", scheduled_pct: "=cancellation_fee_pct_scheduled", in_progress_pct: "=cancellation_fee_pct_in_progress", restocking_pct: "=restocking_fee_pct"}
        Energy Retrofit Project: {awarded_pct: "=cancellation_fee_pct_awarded", scheduled_pct: "=cancellation_fee_pct_scheduled", in_progress_pct: "=cancellation_fee_pct_in_progress", restocking_pct: "=restocking_fee_pct"}
        Turnkey Mechanical Upgrade Project: {awarded_pct: "=cancellation_fee_pct_awarded", scheduled_pct: "=cancellation_fee_pct_scheduled", in_progress_pct: "=cancellation_fee_pct_in_progress", restocking_pct: "=restocking_fee_pct"}
        Design-Build Infrastructure Program: {awarded_pct: "=cancellation_fee_pct_awarded", scheduled_pct: "=cancellation_fee_pct_scheduled", in_progress_pct: "=cancellation_fee_pct_in_progress", restocking_pct: "=restocking_fee_pct"}

  - id: retrofit_portfolio_interaction
    subject: [retrofit_project_closed, retrofit_project_estimated, retrofit_scope_updated]
    rule: >-
      A project changes what the rest of the portfolio covers, and the two are settled together at closeout.
      Equipment the project replaces leaves the maintenance agreement's schedule on the day it is removed and
      the new equipment joins it on the day of substantial completion, with the agreement repriced on its own
      proration basis; the owner is not charged maintenance on both the old and the new unit for the same
      period. While the contractor's warranty on the installed work stands, a fault on that equipment is
      warranty work and is not charged to the maintenance agreement or to the demand service program, and the
      desk routes such a call to the project rather than dispatching it as billable service. Where the
      building holds an energy subscription whose tier resets the baseline on retrofit, the closeout date is
      the baseline reset date. A rebate application is filed by the company only where the tier includes it,
      and the tier's processing fee is charged on the rebate the owner actually receives, never on the
      estimate.
    eligibility:
      - id: maintenance_schedule_updated_at_closeout
        applies_to: [retrofit_project_closed]
        kind: state
        condition: Equipment the project replaces leaves the maintenance agreement's schedule on the day it is removed and the new equipment joins it on the day of substantial completion, with the agreement repriced on its own proration basis; the owner is not charged maintenance on both the old and the new unit for the same period.
        evidence_fields: [maintenance_agreements.status, maintenance_agreements.site_id, maintenance_agreements.equipment_count]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [maintenance_agreements.site_id]
          action_bindings:
            maintenance_agreements.site_id: site_id
        state_contract:
          field: maintenance_agreements.status
          allowed: [active, pending_renewal, suspended]
    params:
      per_tier:
        Equipment Replacement Order: {rebate_included: "=rebate_application_included", rebate_fee_pct: "=rebate_processing_fee_pct", extended_warranty: "=extended_warranty_offered"}
        Planned Replacement Program: {rebate_included: "=rebate_application_included", rebate_fee_pct: "=rebate_processing_fee_pct", extended_warranty: "=extended_warranty_offered"}
        Controls Retrofit Project: {rebate_included: "=rebate_application_included", rebate_fee_pct: "=rebate_processing_fee_pct", extended_warranty: "=extended_warranty_offered"}
        Energy Retrofit Project: {rebate_included: "=rebate_application_included", rebate_fee_pct: "=rebate_processing_fee_pct", extended_warranty: "=extended_warranty_offered"}
        Turnkey Mechanical Upgrade Project: {rebate_included: "=rebate_application_included", rebate_fee_pct: "=rebate_processing_fee_pct", extended_warranty: "=extended_warranty_offered"}
        Design-Build Infrastructure Program: {rebate_included: "=rebate_application_included", rebate_fee_pct: "=rebate_processing_fee_pct", extended_warranty: "=extended_warranty_offered"}

extended_policies:
  - id: retrofit_ext_storage_accrual_billing
    base_policy_refs: [retrofit_progress_billing_and_retainage, retrofit_scheduling_and_delivery]
    overwrite:
      - base_policy: retrofit_scheduling_and_delivery
        superseded_clause: >-
          Equipment delivered before the site can receive it is stored, and storage beyond the week of
          delivery carries the tier's weekly storage charge, counted per whole week begun.
        replaced_by: >-
          The weeks charged are the weeks in storage less the free period, and where that difference falls
          below zero no charge is raised.
    trigger: state_due
    subject: [retrofit_progress_billed]
    computes: storage_amount_usd
    target_tool: bill_storage_charge_e8c4e90e
    params:
      base_free_weeks: 1
      covered_free_weeks: 2
      relationship_free_weeks: 3
      yard_premium_per_week_usd: 120
      rack_premium_per_week_usd: 45
      shared_bay_factor: 1.5
    rule: >-
      The storage charge raised on equipment a building cannot yet receive is worked out from the weeks the
      equipment has stood in storage, the weekly storage rate the project carries and the free period the
      owner is allowed. The storage clock runs from the day the equipment arrived, and the weeks in storage
      are the whole weeks begun between the day the storage clock runs from and the day the charge is raised,
      a part week counting as a whole week. One week of storage is free. The weekly storage rate is the
      project's weekly storage charge. The weekly charge for the lot is the weekly storage rate as it stands.
      The weeks charged are the weeks in storage less the free period, and where that difference falls below
      zero no charge is raised. The storage charge is the weeks charged multiplied by the weekly charge for
      the lot, and that product is rounded to the nearest cent.
      Where the equipment arrived before the day installation was booked to begin and that booked day has
      already passed, the storage clock runs from the booked installation day, because a lot that arrived
      ahead of the booked day was not standing at the owner's convenience; where the equipment arrived on or
      after the booked installation day and a confirmed schedule request stands on the project record, the
      storage clock runs from the day the owner asked for the start to be moved; in every other case the
      storage clock runs from the day the equipment arrived.
      Where an active maintenance agreement covers the building and no late fee has been raised on the
      project in the twelve months before the charge, the free period is 3 weeks; where an active maintenance
      agreement covers the building and a late fee has been raised on the project in those twelve months, the
      free period is 2 weeks; where no active maintenance agreement covers the building, the free period is
      1 week.
      Where the lot standing in storage is a chiller, a boiler or a cooling tower, which the company holds at
      a rented laydown yard rather than in its own warehouse, the weekly storage rate is the project's weekly
      storage charge together with the yard premium; where the lot standing in storage is an air handler, a
      makeup air unit or a VRF system, which is racked in the warehouse at oversize, the weekly storage rate
      is the project's weekly storage charge together with the rack premium; for every other kind of unit the
      weekly storage rate is the project's weekly storage charge.
      Where three or more units of the project's scope stand in storage, the weekly charge for the lot is the
      weekly storage rate multiplied by the number of units standing in storage; where two units stand in
      storage, the weekly charge for the lot is the weekly storage rate multiplied by the shared bay factor,
      the two units sharing one bay; where one unit stands in storage, the weekly charge for the lot is the
      weekly storage rate as it stands.
    prerequisite: []
    cross_category:
      - category: maintenance
        as: branch
        reads: [status]
        note: >-
          The free period factor reads the standing of the maintenance agreement covering the same building
          from that product's holding record.
    compute:
      - stored_since: "LATEST('retrofit_events','delivered_date', date_field='delivered_date', event_type='retrofit_equipment_delivered', stored_off_site='stored')"
      - booked_start: "F('scheduled_start_date')"
      - reschedule_requests: "COUNT('retrofit_requests', request_type='schedule_request', outcome='confirmed')"
      - clock_start: "booked_start if (DAYS(stored_since, booked_start) > 0 and DAYS(booked_start, NOW) > 0) else (LATEST('retrofit_requests','requested_date', date_field='requested_date', request_type='schedule_request', outcome='confirmed') if (reschedule_requests >= 1 and DAYS(stored_since, booked_start) <= 0) else stored_since)"
      - maintenance_status: "CFIELD('maintenance','status', site_id=F('site_id'))"
      - project_late_fees_12m: "COUNT('retrofit_events', within_months=12, date_field='due_date', event_type='retrofit_progress_billed', billing_class='late_fee')"
      - free_weeks: "K('relationship_free_weeks') if (maintenance_status == 'active' and project_late_fees_12m == 0) else (K('covered_free_weeks') if (maintenance_status == 'active' and project_late_fees_12m >= 1) else K('base_free_weeks'))"
      - stored_type: "LATEST('retrofit_events','equipment_type', date_field='delivered_date', event_type='retrofit_equipment_delivered', stored_off_site='stored')"
      - weekly_rate: "(P('storage_fee_per_week_usd') + K('yard_premium_per_week_usd')) if (stored_type == 'chiller' or stored_type == 'boiler' or stored_type == 'cooling_tower') else ((P('storage_fee_per_week_usd') + K('rack_premium_per_week_usd')) if (stored_type == 'air_handler' or stored_type == 'makeup_air_unit' or stored_type == 'vrf_system') else P('storage_fee_per_week_usd'))"
      - stored_units: "COUNT('retrofit_events', event_type='retrofit_equipment_delivered', stored_off_site='stored')"
      - weekly_charge: "(weekly_rate * stored_units) if stored_units >= 3 else ((weekly_rate * K('shared_bay_factor')) if stored_units == 2 else weekly_rate)"
      - weeks_in_storage: "int((DAYS(clock_start, NOW) + 6) / 7)"
      - weeks_charged: "MX(0, weeks_in_storage - free_weeks)"
      - result: "RND(weeks_charged * weekly_charge, 2)"
    compute_basis:
      stored_since: "The storage clock runs from the day the equipment arrived, and the weeks in storage are the whole weeks begun between the day the storage clock runs from and the day the charge is raised, a part week counting as a whole week."
      booked_start: "Where the equipment arrived before the day installation was booked to begin and that booked day has already passed, the storage clock runs from the booked installation day, because a lot that arrived ahead of the booked day was not standing at the owner's convenience"
      reschedule_requests: "where the equipment arrived on or after the booked installation day and a confirmed schedule request stands on the project record, the storage clock runs from the day the owner asked for the start to be moved"
      clock_start: "Where the equipment arrived before the day installation was booked to begin and that booked day has already passed, the storage clock runs from the booked installation day, because a lot that arrived ahead of the booked day was not standing at the owner's convenience; where the equipment arrived on or after the booked installation day and a confirmed schedule request stands on the project record, the storage clock runs from the day the owner asked for the start to be moved; in every other case the storage clock runs from the day the equipment arrived."
      maintenance_status: "Where an active maintenance agreement covers the building and no late fee has been raised on the project in the twelve months before the charge, the free period is 3 weeks"
      project_late_fees_12m: "where an active maintenance agreement covers the building and a late fee has been raised on the project in those twelve months, the free period is 2 weeks"
      free_weeks: "Where an active maintenance agreement covers the building and no late fee has been raised on the project in the twelve months before the charge, the free period is 3 weeks; where an active maintenance agreement covers the building and a late fee has been raised on the project in those twelve months, the free period is 2 weeks; where no active maintenance agreement covers the building, the free period is 1 week."
      stored_type: "Where the lot standing in storage is a chiller, a boiler or a cooling tower, which the company holds at a rented laydown yard rather than in its own warehouse, the weekly storage rate is the project's weekly storage charge together with the yard premium"
      weekly_rate: "Where the lot standing in storage is a chiller, a boiler or a cooling tower, which the company holds at a rented laydown yard rather than in its own warehouse, the weekly storage rate is the project's weekly storage charge together with the yard premium; where the lot standing in storage is an air handler, a makeup air unit or a VRF system, which is racked in the warehouse at oversize, the weekly storage rate is the project's weekly storage charge together with the rack premium; for every other kind of unit the weekly storage rate is the project's weekly storage charge."
      stored_units: "Where three or more units of the project's scope stand in storage, the weekly charge for the lot is the weekly storage rate multiplied by the number of units standing in storage"
      weekly_charge: "Where three or more units of the project's scope stand in storage, the weekly charge for the lot is the weekly storage rate multiplied by the number of units standing in storage; where two units stand in storage, the weekly charge for the lot is the weekly storage rate multiplied by the shared bay factor, the two units sharing one bay; where one unit stands in storage, the weekly charge for the lot is the weekly storage rate as it stands."
      weeks_in_storage: "the weeks in storage are the whole weeks begun between the day the storage clock runs from and the day the charge is raised, a part week counting as a whole week"
      weeks_charged: "The weeks charged are the weeks in storage less the free period, and where that difference falls below zero no charge is raised."
      result: "The storage charge is the weeks charged multiplied by the weekly charge for the lot, and that product is rounded to the nearest cent."
    factors:
      - id: storage_clock_anchor
        effect: method
        decides: clock_start
        bindings: [booked_start, reschedule_requests, clock_start]
        ladder:
          - when: "the equipment arrived before the day installation was booked to begin and that booked day has already passed"
            method: "the storage clock runs from the booked installation day rather than the arrival day"
          - when: "the equipment arrived on or after the booked installation day and a confirmed schedule request stands on the project record"
            method: "the storage clock runs from the day the owner asked for the start to be moved"
          - when: "otherwise"
            method: "the storage clock runs from the day the equipment arrived"
        baseline:
          clock_start: "stored_since"
        evidence: [date, history]
        cross_difficulty: null
      - id: free_period_allowance
        effect: parameter
        decides: free_weeks
        bindings: [maintenance_status, project_late_fees_12m, free_weeks]
        ladder:
          - when: "an active maintenance agreement covers the building and no late fee has been raised on the project in the twelve months before the charge"
            value: "K('relationship_free_weeks')"
          - when: "an active maintenance agreement covers the building and a late fee has been raised on the project in those twelve months"
            value: "K('covered_free_weeks')"
          - when: "no active maintenance agreement covers the building"
            value: "K('base_free_weeks')"
        baseline:
          free_weeks: "K('base_free_weeks')"
        evidence: [cross_category, history]
        cross_difficulty: maintenance
      - id: storage_rate_premium
        effect: parameter
        decides: weekly_rate
        bindings: [stored_type, weekly_rate]
        ladder:
          - when: "the lot standing in storage is a chiller, a boiler or a cooling tower"
            value: "P('storage_fee_per_week_usd') + K('yard_premium_per_week_usd')"
          - when: "the lot standing in storage is an air handler, a makeup air unit or a VRF system"
            value: "P('storage_fee_per_week_usd') + K('rack_premium_per_week_usd')"
          - when: "otherwise"
            value: "P('storage_fee_per_week_usd')"
        baseline:
          weekly_rate: "P('storage_fee_per_week_usd')"
        evidence: [history]
        cross_difficulty: null
      - id: lot_bay_scaling
        effect: method
        decides: weekly_charge
        bindings: [stored_units, weekly_charge]
        ladder:
          - when: "three or more units of the project's scope stand in storage"
            method: "the weekly charge for the lot is the weekly storage rate multiplied by the number of units standing in storage"
          - when: "two units stand in storage"
            method: "the weekly charge for the lot is the weekly storage rate multiplied by the shared bay factor"
          - when: "otherwise"
            method: "the weekly charge for the lot is the weekly storage rate as it stands"
        baseline:
          weekly_charge: "weekly_rate"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The storage charge raised on equipment a building cannot yet receive is worked out from the weeks the
        equipment has stood in storage, the weekly storage rate the project carries and the free period the
        owner is allowed. The storage clock runs from the day the equipment arrived, and the weeks in storage
        are the whole weeks begun between the day the storage clock runs from and the day the charge is
        raised, a part week counting as a whole week. One week of storage is free. The weekly storage rate is
        the project's weekly storage charge. The weekly charge for the lot is the weekly storage rate as it
        stands. The weeks charged are the weeks in storage less the free period, and where that difference
        falls below zero no charge is raised. The storage charge is the weeks charged multiplied by the
        weekly charge for the lot, and that product is rounded to the nearest cent.
      params: [base_free_weeks, storage_fee_per_week_usd]
    inputs:
      history:
        - {table: retrofit_events, aggregate: latest, field: delivered_date, within_months: null, filters: {event_type: retrofit_equipment_delivered, stored_off_site: stored}}
        - {table: retrofit_events, aggregate: count, field: event_id, within_months: 12, filters: {event_type: retrofit_progress_billed, billing_class: late_fee}}
        - {table: retrofit_events, aggregate: count, field: event_id, within_months: null, filters: {event_type: retrofit_equipment_delivered, stored_off_site: stored}}
        - {table: retrofit_requests, aggregate: count, field: request_id, within_months: null, filters: {request_type: schedule_request, outcome: confirmed}}
      cross_category: [maintenance]

  - id: retrofit_ext_cancellation_settlement
    base_policy_refs: [retrofit_cancellation_and_settlement, retrofit_progress_billing_and_retainage]
    overwrite:
      - base_policy: retrofit_cancellation_and_settlement
        superseded_clause: >-
          Cancelled after the equipment is released, the tier's scheduled-stage fee applies and the
          supplier's restocking fee is passed through on equipment that can be returned, while equipment
          that cannot be returned is invoiced in full and left with the owner.
        replaced_by: >-
          The equipment released to the supplier is valued at the equipment share of the contract value,
          which is half.
      - base_policy: retrofit_cancellation_and_settlement
        superseded_clause: >-
          Cancelled after award and before the equipment order is released, the tier's awarded-stage fee
          applies to the contract value.
        replaced_by: >-
          Where a confirmed written cancellation notice stands on the project record and it reached the
          office more than 30 days before the day installation was booked to begin, the stage fee is taken
          at half the rate the stage carries; where a confirmed written cancellation notice stands on the
          project record and it reached the office 30 days or fewer before that booked day, or after it,
          the stage fee is taken at three quarters of the rate the stage carries; where no confirmed
          written cancellation notice stands on the project record, the stage fee is taken at the rate the
          stage carries in full.
      - base_policy: retrofit_cancellation_and_settlement
        superseded_clause: >-
          Cancelled after mobilisation, the tier's in-progress fee applies on top of everything earned to
          the stop day, and retainage already withheld is released against the final settlement.
        replaced_by: >-
          Everything billed to the stop day is the sum of the deposit, mobilisation, progress, change
          order, storage and completion billings raised on the project, and the settlement carries the
          billings raised together with every late fee raised on the project in full.
      - base_policy: retrofit_cancellation_and_settlement
        superseded_clause: >-
          Deposits are applied to the settlement and refunded only where the settlement is smaller than the
          deposit.
        replaced_by: >-
          that difference is rounded to the nearest cent, and where it falls below zero the project is
          settled at zero.
    trigger: on_request
    subject: [retrofit_project_cancelled]
    computes: settlement_amount_usd
    target_tool: settle_project_cancellation_6d1f2e6f
    params:
      default_equipment_share_pct: 50
      plant_equipment_share_pct: 65
      packaged_equipment_share_pct: 55
      early_notice_share: 0.5
      short_notice_share: 0.75
      early_notice_days: 30
      return_window_days: 30
      late_return_surcharge_pct: 10
      half_late_fee_share: 0.5
    rule: >-
      The settlement figure on a project the owner stops is the stage fee for the stage the project stands
      at, together with the restocking charge on the equipment released to the supplier and everything the
      project has billed to the stop day, less every payment received and every credit issued on it. The
      stage of a stopped project is the stage it reached after award and before the equipment order was
      released, and the stage fee is the contract value multiplied by the project's cancellation fee for
      that stage, rounded to the nearest cent. The equipment released to the supplier is valued at the
      equipment share of the contract value, which is half. The restocking charge is that equipment value
      multiplied by the restocking fee applied, rounded to the nearest cent, and the restocking fee applied
      is the project's own restocking fee. Everything billed to the stop day is the sum of the deposit,
      mobilisation, progress, change order, storage and completion billings raised on the project, and the
      settlement carries the billings raised together with every late fee raised on the project in full. The
      settlement due is the stage fee plus the restocking charge plus the billings counted, less every
      payment received and every credit issued on the project; that difference is rounded to the nearest
      cent, and where it falls below zero the project is settled at zero.
      The settlement figure on a stopped project is worked out only once every week the delivered equipment
      has stood in storage is carried as a storage charge on the project's billing record.
      Where the project record carries the day the crew mobilised, the stage fee is taken at the project's
      cancellation fee for a project stopped after mobilisation; where the project record carries the day the
      equipment order was released to the supplier and no day the crew mobilised, the stage fee is taken at
      the project's cancellation fee for a project stopped after the equipment was released; where the
      project record carries neither of those days, the stage fee is taken at the project's cancellation fee
      for a project stopped after award and before the equipment order was released.
      Where a confirmed written cancellation notice stands on the project record and it reached the office
      more than 30 days before the day installation was booked to begin, the stage fee is taken at half the
      rate the stage carries; where a confirmed written cancellation notice stands on the project record and
      it reached the office 30 days or fewer before that booked day, or after it, the stage fee is taken at
      three quarters of the rate the stage carries; where no confirmed written cancellation notice stands on
      the project record, the stage fee is taken at the rate the stage carries in full.
      Where the equipment delivered on the project is a chiller, a boiler or a cooling tower, the equipment
      share of the contract value is 65 per cent; where the equipment delivered on the project is a rooftop
      unit, an air handler, a makeup air unit, a VRF system or a computer room unit, the equipment share of
      the contract value is 55 per cent; for every other kind of unit the equipment share of the contract
      value is half.
      Where equipment on the project stands in storage and it arrived fewer than 30 days before the stop
      day, the restocking fee applied is the project's own restocking fee; where equipment on the project
      stands in storage and it arrived 30 days or more before the stop day, the restocking fee applied is
      the project's own restocking fee together with a further 10 percentage points, which is what the
      supplier charges for a late return; where no equipment on the project stands in storage, no restocking
      fee is applied.
      Where no late fee has been raised on the project, the settlement carries the billings raised and no
      late fee is charged into it; where exactly one late fee has been raised on the project, the settlement
      carries the billings raised together with half the late fees raised on the project; where two or more
      late fees have been raised on the project, the settlement carries the billings raised together with
      every late fee raised on the project in full.
    prerequisite:
      - problem: retrofit_ext_storage_accrual_billing
        kind: value_input
        gate: billings_raised
        form: state
        policy_source: >-
          The settlement figure on a stopped project is worked out only once every week the delivered
          equipment has stood in storage is carried as a storage charge on the project's billing record.
        condition: >-
          Every week the delivered equipment has stood in storage stands on the project's billing record as
          a storage charge.
        resolved_by: bill_storage_charge_e8c4e90e
        effect: >-
          The billings raised on the project rise by the storage charge carried onto the billing record, and
          the settlement due rises by the same amount.
    cross_category: []
    compute:
      - days_since_mobilization: "DAYS(F('mobilization_date'), NOW) if F('mobilization_date') else -1"
      - days_since_release: "DAYS(F('equipment_released_date'), NOW) if F('equipment_released_date') else -1"
      - stage_pct: "P('cancellation_fee_pct_in_progress') if days_since_mobilization >= 0 else (P('cancellation_fee_pct_scheduled') if days_since_release >= 0 else P('cancellation_fee_pct_awarded'))"
      - notice_count: "COUNT('retrofit_requests', request_type='cancellation_notice', outcome='confirmed')"
      - notice_lead_days: "DAYS(LATEST('retrofit_requests','notice_date', date_field='notice_date', request_type='cancellation_notice', outcome='confirmed'), F('scheduled_start_date')) if notice_count >= 1 else 0"
      - stage_fee: "RND(F('contract_value_usd') * stage_pct / 100 * K('early_notice_share'), 2) if (notice_count >= 1 and notice_lead_days > K('early_notice_days')) else (RND(F('contract_value_usd') * stage_pct / 100 * K('short_notice_share'), 2) if (notice_count >= 1 and notice_lead_days <= K('early_notice_days')) else RND(F('contract_value_usd') * stage_pct / 100, 2))"
      - released_type: "LATEST('retrofit_events','equipment_type', date_field='delivered_date', event_type='retrofit_equipment_delivered')"
      - equipment_share: "K('plant_equipment_share_pct') if (released_type == 'chiller' or released_type == 'boiler' or released_type == 'cooling_tower') else (K('packaged_equipment_share_pct') if (released_type == 'rooftop_unit' or released_type == 'air_handler' or released_type == 'makeup_air_unit' or released_type == 'vrf_system' or released_type == 'computer_room_unit') else K('default_equipment_share_pct'))"
      - stored_deliveries: "COUNT('retrofit_events', event_type='retrofit_equipment_delivered', stored_off_site='stored')"
      - days_since_storage_delivery: "DAYS(LATEST('retrofit_events','delivered_date', date_field='delivered_date', event_type='retrofit_equipment_delivered', stored_off_site='stored'), NOW) if stored_deliveries >= 1 else 0"
      - restocking_pct_applied: "(P('restocking_fee_pct') + K('late_return_surcharge_pct')) if (stored_deliveries >= 1 and days_since_storage_delivery >= K('return_window_days')) else (P('restocking_fee_pct') if (stored_deliveries >= 1 and days_since_storage_delivery < K('return_window_days')) else 0)"
      - equipment_value: "RND(F('contract_value_usd') * equipment_share / 100, 2)"
      - restocking_charge: "RND(equipment_value * restocking_pct_applied / 100, 2)"
      - billings_raised: "SUM('retrofit_events','amount_usd', event_type='retrofit_progress_billed', billing_class='deposit') + SUM('retrofit_events','amount_usd', event_type='retrofit_progress_billed', billing_class='mobilization') + SUM('retrofit_events','amount_usd', event_type='retrofit_progress_billed', billing_class='progress') + SUM('retrofit_events','amount_usd', event_type='retrofit_progress_billed', billing_class='change_order') + SUM('retrofit_events','amount_usd', event_type='retrofit_progress_billed', billing_class='storage') + SUM('retrofit_events','amount_usd', event_type='retrofit_progress_billed', billing_class='completion')"
      - late_fees_raised: "SUM('retrofit_events','amount_usd', event_type='retrofit_progress_billed', billing_class='late_fee')"
      - late_fee_billings: "COUNT('retrofit_events', event_type='retrofit_progress_billed', billing_class='late_fee')"
      - billings_counted: "billings_raised if late_fee_billings == 0 else ((billings_raised + RND(late_fees_raised * K('half_late_fee_share'), 2)) if late_fee_billings == 1 else (billings_raised + late_fees_raised))"
      - payments_received: "SUM('retrofit_events','amount_usd', event_type='retrofit_payment_received')"
      - credits_issued: "SUM('retrofit_events','amount_usd', event_type='retrofit_credit_issued')"
      - result: "RND(MX(0, stage_fee + restocking_charge + billings_counted - payments_received - credits_issued), 2)"
    compute_basis:
      days_since_mobilization: "Where the project record carries the day the crew mobilised, the stage fee is taken at the project's cancellation fee for a project stopped after mobilisation"
      days_since_release: "where the project record carries the day the equipment order was released to the supplier and no day the crew mobilised, the stage fee is taken at the project's cancellation fee for a project stopped after the equipment was released"
      stage_pct: "Where the project record carries the day the crew mobilised, the stage fee is taken at the project's cancellation fee for a project stopped after mobilisation; where the project record carries the day the equipment order was released to the supplier and no day the crew mobilised, the stage fee is taken at the project's cancellation fee for a project stopped after the equipment was released; where the project record carries neither of those days, the stage fee is taken at the project's cancellation fee for a project stopped after award and before the equipment order was released."
      notice_count: "where no confirmed written cancellation notice stands on the project record, the stage fee is taken at the rate the stage carries in full"
      notice_lead_days: "Where a confirmed written cancellation notice stands on the project record and it reached the office more than 30 days before the day installation was booked to begin, the stage fee is taken at half the rate the stage carries"
      stage_fee: "Where a confirmed written cancellation notice stands on the project record and it reached the office more than 30 days before the day installation was booked to begin, the stage fee is taken at half the rate the stage carries; where a confirmed written cancellation notice stands on the project record and it reached the office 30 days or fewer before that booked day, or after it, the stage fee is taken at three quarters of the rate the stage carries; where no confirmed written cancellation notice stands on the project record, the stage fee is taken at the rate the stage carries in full."
      released_type: "Where the equipment delivered on the project is a chiller, a boiler or a cooling tower, the equipment share of the contract value is 65 per cent"
      equipment_share: "Where the equipment delivered on the project is a chiller, a boiler or a cooling tower, the equipment share of the contract value is 65 per cent; where the equipment delivered on the project is a rooftop unit, an air handler, a makeup air unit, a VRF system or a computer room unit, the equipment share of the contract value is 55 per cent; for every other kind of unit the equipment share of the contract value is half."
      stored_deliveries: "where no equipment on the project stands in storage, no restocking fee is applied"
      days_since_storage_delivery: "where equipment on the project stands in storage and it arrived 30 days or more before the stop day, the restocking fee applied is the project's own restocking fee together with a further 10 percentage points, which is what the supplier charges for a late return"
      restocking_pct_applied: "Where equipment on the project stands in storage and it arrived fewer than 30 days before the stop day, the restocking fee applied is the project's own restocking fee; where equipment on the project stands in storage and it arrived 30 days or more before the stop day, the restocking fee applied is the project's own restocking fee together with a further 10 percentage points, which is what the supplier charges for a late return; where no equipment on the project stands in storage, no restocking fee is applied."
      equipment_value: "The equipment released to the supplier is valued at the equipment share of the contract value, which is half."
      restocking_charge: "The restocking charge is that equipment value multiplied by the restocking fee applied, rounded to the nearest cent, and the restocking fee applied is the project's own restocking fee."
      billings_raised: "Everything billed to the stop day is the sum of the deposit, mobilisation, progress, change order, storage and completion billings raised on the project, and the settlement carries the billings raised together with every late fee raised on the project in full."
      late_fees_raised: "where two or more late fees have been raised on the project, the settlement carries the billings raised together with every late fee raised on the project in full"
      late_fee_billings: "where exactly one late fee has been raised on the project, the settlement carries the billings raised together with half the late fees raised on the project"
      billings_counted: "Where no late fee has been raised on the project, the settlement carries the billings raised and no late fee is charged into it; where exactly one late fee has been raised on the project, the settlement carries the billings raised together with half the late fees raised on the project; where two or more late fees have been raised on the project, the settlement carries the billings raised together with every late fee raised on the project in full."
      payments_received: "less every payment received and every credit issued on the project"
      credits_issued: "less every payment received and every credit issued on the project"
      result: "The settlement due is the stage fee plus the restocking charge plus the billings counted, less every payment received and every credit issued on the project; that difference is rounded to the nearest cent, and where it falls below zero the project is settled at zero."
    factors:
      - id: stopped_stage_basis
        effect: parameter
        decides: stage_pct
        bindings: [days_since_mobilization, days_since_release, stage_pct]
        ladder:
          - when: "the project record carries the day the crew mobilised"
            value: "P('cancellation_fee_pct_in_progress')"
          - when: "the project record carries the day the equipment order was released to the supplier and no day the crew mobilised"
            value: "P('cancellation_fee_pct_scheduled')"
          - when: "otherwise"
