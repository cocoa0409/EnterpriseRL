# Product charter: Equipment Replacement & Retrofit Projects (category key: retrofit)
category: retrofit
display_name: Equipment Replacement & Retrofit Projects

binding:
  holding_table: retrofit_projects
  event_tables: [retrofit_events]
  intake_tables: [retrofit_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields:
    balance_due: project_balance
    retainage_held_usd: retainage_held
    change_allowance_remaining: change_order_allowance

lifecycle:
  states: [estimated, awarded, scheduled, in_progress, substantially_complete, closed, cancelled, declined]
  transitions:
    - {from: estimated, to: awarded, by: user, means: The owner signs the proposal and awards the project.}
    - {from: estimated, to: declined, by: user, means: The owner declines the estimate.}
    - {from: awarded, to: scheduled, by: agent, means: Equipment is ordered and the installation is booked into the schedule.}
    - {from: scheduled, to: in_progress, by: agent, means: The crew mobilises and installation begins.}
    - {from: in_progress, to: substantially_complete, by: agent, means: The system is running for its intended use and only punch list items remain.}
    - {from: substantially_complete, to: closed, by: agent, means: The punch list is cleared, closeout documents are delivered and retainage is released.}
    - {from: awarded, to: cancelled, by: user, means: The owner cancels the awarded project before equipment is released.}
    - {from: scheduled, to: cancelled, by: user, means: The owner cancels after equipment has been ordered.}
    - {from: in_progress, to: cancelled, by: agent, means: The project is stopped part way and settled for the work performed.}

accounts:
  - key: project_balance
    unit: USD
    meaning: The amount the owner currently owes on the project; progress billings increase it, payments and credits reduce it.
  - key: retainage_held
    unit: USD
    meaning: The retainage withheld from progress billings and not yet released; withholdings increase it, the closeout release reduces it.
  - key: change_order_allowance
    unit: USD
    meaning: The owner-authorised allowance for changes still available on the project; credited at award, drawn by each issued change order.

parameter_schema:
  minimum_project_value_usd: Smallest project value the tier is written for (USD).
  estimate_validity_days: Days an estimate stays open for award before it is repriced (integer, calendar days).
  material_price_validity_days: Days the quoted equipment price is held before a supplier escalation is passed through (integer, calendar days).
  deposit_pct: Deposit taken at award as a portion of the contract value (percent).
  deposit_due_days: Days from award by which the deposit must be received before equipment is released (integer, calendar days).
  mobilization_fee_usd: Fee charged when the crew first mobilises to site (USD).
  progress_billing_frequency: How progress is billed (enum milestone, monthly, semimonthly).
  progress_billing_basis: What progress is measured against (enum percent_complete, milestones, delivered_value).
  retainage_pct: Portion of each progress billing withheld as retainage (percent).
  retainage_release_days: Days after substantial completion by which retainage is released (integer, calendar days).
  payment_terms_days: Days from invoice date to due date (integer, calendar days).
  late_fee_pct_per_month: Late fee on an overdue progress billing per month (percent per month).
  suspension_after_days_past_due: Days past due after which work on site is stopped (integer, calendar days).
  work_stoppage_remobilization_fee_usd: Fee to remobilise after a stoppage for non-payment (USD).
  change_order_allowance_pct: Owner-authorised change allowance credited at award, as a portion of contract value (percent).
  change_order_markup_pct: Markup applied to the cost of change order work (percent).
  change_order_approval_above_usd: Change order value above which the owner's written authorisation is required (USD).
  change_order_response_business_days: Business days to price a requested change (integer, business days).
  permit_handling_included: Whether the contractor pulls the mechanical permits (boolean).
  permit_fee_passthrough: Whether permit fees are passed through at cost (boolean).
  inspection_coordination_included: Whether the contractor coordinates authority inspections (boolean).
  crane_rigging_included: Whether crane and rigging are included in the contract value (boolean).
  disposal_included: Whether removal and disposal of the old equipment is included (boolean).
  refrigerant_recovery_included: Whether refrigerant recovery and documentation are included (boolean).
  startup_commissioning_included: Whether factory start-up and commissioning are included (boolean).
  test_and_balance_included: Whether air and water balancing is included (boolean).
  as_built_drawings_included: Whether as-built drawings are delivered at closeout (boolean).
  owner_training_hours: Operator training hours delivered at closeout (decimal hours).
  closeout_documents_business_days: Business days after substantial completion by which closeout documents are delivered (integer, business days).
  punch_list_business_days: Business days after substantial completion allowed to clear the punch list (integer, business days).
  schedule_guarantee_days: Calendar days from mobilisation within which substantial completion is guaranteed (integer; 0 means no schedule guarantee).
  liquidated_damages_per_day_usd: Amount credited per calendar day of delay beyond the schedule guarantee (USD per day).
  liquidated_damages_cap_pct: Ceiling on liquidated damages as a portion of contract value (percent).
  lead_time_weeks_by_equipment_type: Quoted equipment lead time, a mapping equipment type -> weeks.
  temporary_cooling_included: Whether temporary cooling during the changeover is included (boolean).
  temporary_cooling_daily_usd: Daily charge for temporary cooling where it is not included (USD per day).
  after_hours_work_included: Whether after-hours or weekend installation work is included in the price (boolean).
  after_hours_premium_pct: Premium on labor for after-hours or weekend installation where it is not included (percent).
  site_supervision_included: Whether a full-time site supervisor is assigned (boolean).
  warranty_labor_months: Months of contractor labor warranty on the installed work (integer, calendar months).
  warranty_parts_months: Months of parts warranty carried by the contractor beyond the manufacturer's (integer, calendar months).
  manufacturer_registration_included: Whether the manufacturer's warranty registration is filed for the owner (boolean).
  extended_warranty_offered: Whether an extended equipment warranty plan may be attached at closeout (boolean).
  rebate_application_included: Whether utility rebate applications are prepared and filed (boolean).
  rebate_processing_fee_pct: Fee on the rebate received where the application is filed by the contractor (percent).
  bond_required_above_usd: Contract value above which a payment and performance bond is required (USD).
  bond_rate_pct: Bond premium as a portion of contract value (percent).
  insurance_certificate_required: Whether an owner-named insurance certificate is issued before mobilisation (boolean).
  prevailing_wage_supported: Whether the tier is written to be performed at prevailing wage (boolean).
  cancellation_fee_pct_awarded: Cancellation fee as a portion of contract value when cancelled after award and before equipment release (percent).
  cancellation_fee_pct_scheduled: Cancellation fee as a portion of contract value when cancelled after equipment release (percent).
  cancellation_fee_pct_in_progress: Cancellation fee as a portion of contract value when cancelled after mobilisation (percent).
  restocking_fee_pct: Supplier restocking fee passed through on returned equipment (percent).
  storage_fee_per_week_usd: Weekly charge to store delivered equipment the site cannot yet receive (USD per week).
  site_survey_required: Whether a pre-estimate site survey is required before the estimate is issued (boolean).
  engineering_design_included: Whether engineering and design of the replacement are included (boolean).
  design_fee_pct: Engineering and design fee as a portion of contract value where it is not included (percent).

