            method: "the stage fee is taken at half the rate the stage carries"
          - when: "a confirmed written cancellation notice stands on the project record and it reached the office 30 days or fewer before that booked day, or after it"
            method: "the stage fee is taken at three quarters of the rate the stage carries"
          - when: "otherwise"
