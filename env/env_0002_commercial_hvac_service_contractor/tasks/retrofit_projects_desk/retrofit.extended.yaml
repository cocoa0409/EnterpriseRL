  - id: retrofit_ext_liquidated_damages_credit
    base_policy_refs: [retrofit_schedule_guarantee, retrofit_change_orders]
    overwrite:
      - base_policy: retrofit_schedule_guarantee
        superseded_clause: >-
          Where the tier carries a schedule guarantee, substantial completion is guaranteed inside the
          tier's guaranteed period counted forward in calendar days from the day the crew mobilised, the
          mobilisation day excluded and the final day included, extended by the schedule impact days
          stated on every issued change order and by any delay the owner or the authority caused.
        replaced_by: >-
          The guaranteed period runs from the day the crew mobilised, and the days of delay are the
          calendar days from the end of that period to the day the system was accepted as running for its
          intended use, the last day of the period excluded and the day of acceptance included.
      - base_policy: retrofit_schedule_guarantee
        superseded_clause: >-
          Liquidated damages are credited at the tier's daily amount for each calendar day of delay past
          that date, capped at the tier's portion of the contract value, and they are the owner's whole
          remedy for lateness.
        replaced_by: >-
          The damages are the days of delay multiplied by the daily amount, and they are never more than
          the ceiling the class puts on them, which is its portion of the contract value; the smaller of
          the two is credited and the figure is rounded to the nearest cent.
    trigger: state_due
    subject: [retrofit_credit_issued]
    computes: damages_credit_usd
    target_tool: credit_liquidated_damages_732a84c1
    params:
      no_extension_days: 0
      shared_impact_share: 0.5
      no_grace_days: 0
      no_suspension_days: 0
      prompt_closeout_grace_days: 5
      prompt_punch_grace_days: 2
      half_suspension_share: 0.5
      performance_day_usd: 450
      metered_day_usd: 150
      critical_day_usd: 600
      standard_day_usd: 200
      no_daily_addition: 0
      critical_hours_threshold: 4
    rule: >-
      The liquidated damages credited on a project that ran late are worked out from the days of delay, the
      daily amount the project carries and the ceiling its class puts on the damages. The guaranteed period
      runs from the day the crew mobilised, and the days of delay are the calendar days from the end of that
      period to the day the system was accepted as running for its intended use, the last day of the period
      excluded and the day of acceptance included. The guaranteed period is not extended. No grace is
      allowed past the end of the guaranteed period, and the guarantee is not suspended. The daily amount is
      the daily amount the project's class carries, with nothing added to it. Where the days of delay fall
      below zero they are counted as none. The damages are the days of delay multiplied by the daily amount,
      and they are never more than the ceiling the class puts on them, which is its portion of the contract
      value; the smaller of the two is credited and the figure is rounded to the nearest cent.
      Where the crew mobilised on or before the day installation was booked to begin, the guaranteed period
      runs from the day the crew mobilised; where the crew mobilised after that booked day and a confirmed
      schedule request stands on the project record, the guaranteed period runs from the day the owner asked
      for the start to be moved; where the crew mobilised after that booked day and no confirmed schedule
      request stands on the project record, the guaranteed period runs from the booked day, a start the
      contractor let slip on its own account not moving the date it must finish by.
      Where the issued change orders state schedule impact on a change the owner asked for or on a schedule
      acceleration, the guaranteed period is extended by every impact day stated on the issued change
      orders, the owner having asked for the work that moved the date; where the issued change orders state
      schedule impact on a concealed condition or a code requirement and none on a change the owner asked
      for or a schedule acceleration, the guaranteed period is extended by the impact days stated on the
      concealed conditions and the code requirements alone, a supplier's days not being the owner's to
      have; in every other case the guaranteed period is extended by half of the impact days stated on
      supplier substitutions, rounded down to a whole day, the delay of a substitute the owner accepted
      being shared between the two.
      Where the punch list was cleared on or before the day it fell due and a confirmed closeout acceptance
      stands on the project record, 5 days of grace are allowed past the end of the guaranteed period before
      damages begin; where the punch list was cleared on or before the day it fell due and no confirmed
      closeout acceptance stands on the project record, 2 days of grace are allowed; where the punch list
      was not cleared on or before the day it fell due, no grace is allowed.
      Where a remobilisation fee stands billed on the project, work having been stopped for non-payment and
      restarted, the guarantee is suspended for the number of days past due at which the project's class
      stops work; where no remobilisation fee stands billed on the project but a late fee has been raised on
      it, the guarantee is suspended for half that number of days, rounded to a whole day; where no
      remobilisation fee and no late fee stand on the project, the guarantee is not suspended.
      Where an energy subscription covers the building and its class carries a guaranteed savings
      commitment, the daily amount is the daily amount the project's class carries together with the
      measured performance addition; where an energy subscription covers the building and its class carries
      no guaranteed savings commitment, the daily amount is the daily amount the project's class carries
      together with the metering addition; where no energy subscription covers the building, the daily
      amount is the daily amount the project's class carries.
      Where the owner carries an active demand service rate program whose guaranteed response at a critical
      facility is 4 hours or less, a further critical facility addition is made to the daily amount; where
      the owner carries an active demand service rate program whose guaranteed response at a critical
      facility is more than 4 hours, a further standard addition is made to the daily amount; where the
      owner carries no active demand service rate program, no further addition is made to the daily amount.
    prerequisite: []
    cross_category:
      - category: energy
        as: branch
        reads: [status, savings_guarantee_included]
        note: >-
          The daily amount factor reads whether the energy subscription covering the same building is
          written with a guaranteed savings commitment.
      - category: service
        as: branch
        reads: [status, critical_response_hours]
        note: >-
          The daily addition factor reads the standing of the owner's demand service rate program and the
          response that program guarantees at a critical facility.
    compute:
      - mobilised_on: "F('mobilization_date')"
      - booked_start: "F('scheduled_start_date')"
      - reschedule_requests: "COUNT('retrofit_requests', request_type='schedule_request', outcome='confirmed')"
      - clock_anchor: "mobilised_on if (DAYS(booked_start, mobilised_on) <= 0 and DAYS(mobilised_on, NOW) > 0) else (LATEST('retrofit_requests','requested_date', date_field='requested_date', request_type='schedule_request', outcome='confirmed') if (reschedule_requests >= 1 and DAYS(booked_start, mobilised_on) > 0) else booked_start)"
      - owner_asked_days: "SUM('retrofit_events','schedule_impact_days', event_type='retrofit_change_order_issued', change_reason='owner_requested') + SUM('retrofit_events','schedule_impact_days', event_type='retrofit_change_order_issued', change_reason='schedule_acceleration')"
      - concealed_code_days: "SUM('retrofit_events','schedule_impact_days', event_type='retrofit_change_order_issued', change_reason='concealed_condition') + SUM('retrofit_events','schedule_impact_days', event_type='retrofit_change_order_issued', change_reason='code_requirement')"
      - supplier_days: "SUM('retrofit_events','schedule_impact_days', event_type='retrofit_change_order_issued', change_reason='supplier_substitution')"
      - extension_days: "(owner_asked_days + concealed_code_days + supplier_days) if owner_asked_days > 0 else (concealed_code_days if (concealed_code_days > 0 and owner_asked_days == 0) else int(supplier_days * K('shared_impact_share')))"
      - punch_cleared_on: "LATEST('retrofit_events','inspected_date', date_field='inspected_date', event_type='retrofit_inspection_passed', inspection_class='owner_walkthrough')"
      - punch_slack_days: "DAYS(punch_cleared_on, F('punch_list_due_date')) if punch_cleared_on else -1"
      - closeout_acceptances: "COUNT('retrofit_requests', request_type='closeout_acceptance', outcome='confirmed')"
      - grace_days: "K('prompt_closeout_grace_days') if (punch_slack_days >= 0 and closeout_acceptances >= 1) else (K('prompt_punch_grace_days') if (punch_slack_days >= 0 and closeout_acceptances == 0) else K('no_grace_days'))"
      - remobilisation_billings: "COUNT('retrofit_events', event_type='retrofit_progress_billed', billing_class='remobilization')"
      - late_fee_billings: "COUNT('retrofit_events', event_type='retrofit_progress_billed', billing_class='late_fee')"
      - suspension_days: "P('suspension_after_days_past_due') if remobilisation_billings >= 1 else (RND(P('suspension_after_days_past_due') * K('half_suspension_share'), 0) if (remobilisation_billings == 0 and late_fee_billings >= 1) else K('no_suspension_days'))"
      - energy_held: "EXISTS('energy', site_id=F('site_id'))"
      - energy_guarantee: "CPARAM('energy','savings_guarantee_included', site_id=F('site_id'))"
      - daily_amount: "(P('liquidated_damages_per_day_usd') + K('performance_day_usd')) if (energy_held and energy_guarantee == True) else ((P('liquidated_damages_per_day_usd') + K('metered_day_usd')) if (energy_held and energy_guarantee != True) else P('liquidated_damages_per_day_usd'))"
      - service_status: "CFIELD('service','status')"
      - service_critical_hours: "CPARAM('service','critical_response_hours')"
      - daily_addition: "K('critical_day_usd') if (service_status == 'active' and service_critical_hours <= K('critical_hours_threshold')) else (K('standard_day_usd') if (service_status == 'active' and service_critical_hours > K('critical_hours_threshold')) else K('no_daily_addition'))"
      - elapsed_days: "DAYS(clock_anchor, F('substantial_completion_date'))"
      - delay_days: "MX(0, elapsed_days - P('schedule_guarantee_days') - extension_days - grace_days - suspension_days)"
      - raw_damages: "RND(delay_days * (daily_amount + daily_addition), 2)"
      - damages_ceiling: "RND(F('contract_value_usd') * P('liquidated_damages_cap_pct') / 100, 2)"
      - result: "RND(MN(raw_damages, damages_ceiling), 2)"
    compute_basis:
      reschedule_requests: "where the crew mobilised after that booked day and a confirmed schedule request stands on the project record, the guaranteed period runs from the day the owner asked for the start to be moved"
      clock_anchor: "Where the crew mobilised on or before the day installation was booked to begin, the guaranteed period runs from the day the crew mobilised; where the crew mobilised after that booked day and a confirmed schedule request stands on the project record, the guaranteed period runs from the day the owner asked for the start to be moved; where the crew mobilised after that booked day and no confirmed schedule request stands on the project record, the guaranteed period runs from the booked day, a start the contractor let slip on its own account not moving the date it must finish by."
      mobilised_on: "The guaranteed period runs from the day the crew mobilised, and the days of delay are the calendar days from the end of that period to the day the system was accepted as running for its intended use, the last day of the period excluded and the day of acceptance included."
      booked_start: "where the crew mobilised after that booked day and no confirmed schedule request stands on the project record, the guaranteed period runs from the booked day, a start the contractor let slip on its own account not moving the date it must finish by"
      owner_asked_days: "Where the issued change orders state schedule impact on a change the owner asked for or on a schedule acceleration, the guaranteed period is extended by every impact day stated on the issued change orders, the owner having asked for the work that moved the date"
      concealed_code_days: "where the issued change orders state schedule impact on a concealed condition or a code requirement and none on a change the owner asked for or a schedule acceleration, the guaranteed period is extended by the impact days stated on the concealed conditions and the code requirements alone, a supplier's days not being the owner's to have"
      supplier_days: "in every other case the guaranteed period is extended by half of the impact days stated on supplier substitutions, rounded down to a whole day, the delay of a substitute the owner accepted being shared between the two"
      extension_days: "Where the issued change orders state schedule impact on a change the owner asked for or on a schedule acceleration, the guaranteed period is extended by every impact day stated on the issued change orders, the owner having asked for the work that moved the date; where the issued change orders state schedule impact on a concealed condition or a code requirement and none on a change the owner asked for or a schedule acceleration, the guaranteed period is extended by the impact days stated on the concealed conditions and the code requirements alone, a supplier's days not being the owner's to have; in every other case the guaranteed period is extended by half of the impact days stated on supplier substitutions, rounded down to a whole day, the delay of a substitute the owner accepted being shared between the two."
      punch_cleared_on: "Where the punch list was cleared on or before the day it fell due and a confirmed closeout acceptance stands on the project record, 5 days of grace are allowed past the end of the guaranteed period before damages begin"
      punch_slack_days: "where the punch list was not cleared on or before the day it fell due, no grace is allowed"
      closeout_acceptances: "where the punch list was cleared on or before the day it fell due and no confirmed closeout acceptance stands on the project record, 2 days of grace are allowed"
      grace_days: "Where the punch list was cleared on or before the day it fell due and a confirmed closeout acceptance stands on the project record, 5 days of grace are allowed past the end of the guaranteed period before damages begin; where the punch list was cleared on or before the day it fell due and no confirmed closeout acceptance stands on the project record, 2 days of grace are allowed; where the punch list was not cleared on or before the day it fell due, no grace is allowed."
      remobilisation_billings: "Where a remobilisation fee stands billed on the project, work having been stopped for non-payment and restarted, the guarantee is suspended for the number of days past due at which the project's class stops work"
      late_fee_billings: "where no remobilisation fee stands billed on the project but a late fee has been raised on it, the guarantee is suspended for half that number of days, rounded to a whole day"
      suspension_days: "Where a remobilisation fee stands billed on the project, work having been stopped for non-payment and restarted, the guarantee is suspended for the number of days past due at which the project's class stops work; where no remobilisation fee stands billed on the project but a late fee has been raised on it, the guarantee is suspended for half that number of days, rounded to a whole day; where no remobilisation fee and no late fee stand on the project, the guarantee is not suspended."
      energy_held: "where no energy subscription covers the building, the daily amount is the daily amount the project's class carries"
      energy_guarantee: "Where an energy subscription covers the building and its class carries a guaranteed savings commitment, the daily amount is the daily amount the project's class carries together with the measured performance addition"
      daily_amount: "Where an energy subscription covers the building and its class carries a guaranteed savings commitment, the daily amount is the daily amount the project's class carries together with the measured performance addition; where an energy subscription covers the building and its class carries no guaranteed savings commitment, the daily amount is the daily amount the project's class carries together with the metering addition; where no energy subscription covers the building, the daily amount is the daily amount the project's class carries."
      service_status: "where the owner carries no active demand service rate program, no further addition is made to the daily amount"
      service_critical_hours: "Where the owner carries an active demand service rate program whose guaranteed response at a critical facility is 4 hours or less, a further critical facility addition is made to the daily amount"
      daily_addition: "Where the owner carries an active demand service rate program whose guaranteed response at a critical facility is 4 hours or less, a further critical facility addition is made to the daily amount; where the owner carries an active demand service rate program whose guaranteed response at a critical facility is more than 4 hours, a further standard addition is made to the daily amount; where the owner carries no active demand service rate program, no further addition is made to the daily amount."
      elapsed_days: "The guaranteed period runs from the day the crew mobilised, and the days of delay are the calendar days from the end of that period to the day the system was accepted as running for its intended use, the last day of the period excluded and the day of acceptance included."
      delay_days: "Where the days of delay fall below zero they are counted as none."
