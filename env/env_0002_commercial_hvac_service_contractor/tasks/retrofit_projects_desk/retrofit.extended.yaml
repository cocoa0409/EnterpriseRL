        ladder:
          - when: "the punch list was cleared on or before the day it fell due and a confirmed closeout acceptance stands on the project record"
            value: "K('prompt_closeout_grace_days')"
          - when: "the punch list was cleared on or before the day it fell due and no confirmed closeout acceptance stands on the project record"
            value: "K('prompt_punch_grace_days')"
          - when: "the punch list was not cleared on or before the day it fell due"
            value: "K('no_grace_days')"
        baseline:
          grace_days: "K('no_grace_days')"
        evidence: [history, date]
        cross_difficulty: null
      - id: arrears_guarantee_suspension
        effect: parameter
        decides: suspension_days
        bindings: [remobilisation_billings, late_fee_billings, suspension_days]
        ladder:
          - when: "a remobilisation fee stands billed on the project"
            value: "P('suspension_after_days_past_due')"
          - when: "no remobilisation fee stands billed on the project but a late fee has been raised on it"
            value: "half the number of days past due at which the project's class stops work, rounded to a whole day"
          - when: "no remobilisation fee and no late fee stand on the project"
            value: "K('no_suspension_days')"
        baseline:
