      days_past_due: "Where the most recent invoice to fall due has stood past its due day longer than the tier's suspension period and the open position stands above the tier's credit limit, the arrears rate of this policy is the rate; where the most recent invoice to fall due has stood past its due day longer than the tier's payment term and the open position stands at or below the tier's credit limit, the extended arrears rate of this policy is the rate."
      open_position: "The open position is the invoiced total in the window less the payments received in it."
