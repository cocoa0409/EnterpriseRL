- id: service_quote_and_approval
  subject:
  - service_quote_issued
  - service_program_updated
  rule: Work whose estimated value passes the tier's quote threshold is not started until a written quote
    has been issued, and work whose estimated value passes the tier's approval threshold is not started
    until the owner's written approval of that quote is recorded in the office records. The caller's word
    that the work is approved is never enough on its own; the approval must stand against the quote number
    of the work in hand, and an approval recorded against a different quote does not carry over. A quote
    stays open for the tier's validity period counted in calendar days from the day it was issued, and
    a lapsed quote is reissued at current rates rather than honoured. Where the quoted value passes the
    tier's deposit threshold, the tier's deposit is taken before the work is scheduled, and the deposit
    is applied to the final invoice. A quote that has already been approved is not issued a second time
    for the same work order.
  eligibility:
  - id: owner_approval_recorded
    applies_to:
    - service_quote_issued
    kind: authorization
    condition: The caller's word that the work is approved is never enough on its own; the approval must
      stand against the quote number of the work in hand, and an approval recorded against a different
      quote does not carry over.
    evidence_fields:
    - service_requests.quote_ref
    - service_requests.request_type
    - service_requests.outcome
    - service_requests.program_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - service_requests.quote_ref
      action_bindings:
        service_requests.quote_ref: quote_ref
  - id: quote_not_reissued_after_approval
    applies_to:
    - service_quote_issued
    kind: dedup
    condition: A quote that has already been approved is not issued a second time for the same work order.
    evidence_fields:
    - service_events.work_order_ref
    - service_events.approval_status
    - service_events.quote_ref
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - service_events.work_order_ref
      action_bindings:
        service_events.work_order_ref: work_order_ref
    dedup_contract:
      table: service_events
      mode: separate_record
      object_bindings:
        work_order_ref: work_order_ref
      duplicate_filters:
        approval_status:
        - approved
      distinct_fields:
      - quote_ref
      - issued_date
  params:
