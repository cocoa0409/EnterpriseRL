        expiry_months: =block_hour_expiry_months
        overage_usd: =block_overage_rate_usd
        rollover: =block_rollover_allowed
        refund_pct: =unused_block_refund_pct
      Critical Facility Response Program:
        block_rate_usd: =block_hour_rate_usd
        min_hours: =block_min_purchase_hours
        expiry_months: =block_hour_expiry_months
        overage_usd: =block_overage_rate_usd
        rollover: =block_rollover_allowed
        refund_pct: =unused_block_refund_pct
      Dedicated Technician Program:
        block_rate_usd: =block_hour_rate_usd
        min_hours: =block_min_purchase_hours
        expiry_months: =block_hour_expiry_months
        overage_usd: =block_overage_rate_usd
        rollover: =block_rollover_allowed
        refund_pct: =unused_block_refund_pct
  formula:
    overage_charge_usd: round(max(0, labor_hours - labor_hour_block) * block_overage_rate_usd, 2)
- id: service_emergency_entitlement
  subject:
  - service_emergency_call_used
  rule: Each emergency or critical dispatch consumes one of the program year's included emergency calls.
    A call taken once the year's included calls are used up still runs at the tier's emergency response
    guarantee, and it carries the tier's emergency surcharge on top of the labor and parts of the call.
    The count is taken over the current program year only and it counts dispatches, not work orders, so
    a single fault that brings the technician back a second time on the same night counts twice unless
    the second trip is a callback. At the top tier, where the surcharge is zero, the count is still kept
    because it drives the year-end service review. A call the office itself reclassifies downward after
    arrival is released back to the allowance and the surcharge, where it was applied, is credited.
  eligibility: []
  measures:
  - service_msr_emergency_calls_used_year
  params:
    per_tier:
      Time & Material Account:
        included_calls: =emergency_calls_included
        surcharge_usd: =emergency_call_surcharge_usd
      Priority Response Program:
        included_calls: =emergency_calls_included
        surcharge_usd: =emergency_call_surcharge_usd
      Block Hour Service Program:
