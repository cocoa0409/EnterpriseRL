# Extended charter for the service_dispatch_desk difficulty (category: service).
# The base section below is copied verbatim from blueprint/products/service.yaml.
category: service
display_name: Demand Service Rate Programs
binding:
  holding_table: service_programs
  event_tables:
  - service_events
  intake_tables:
  - service_requests
  status_field: status
  variant_field: variant_name
  quantity_fields:
    block_hours_remaining: labor_hour_block
    emergency_calls_remaining: emergency_call_allowance
    balance_due: service_balance
lifecycle:
  states:
  - requested
  - active
  - suspended
  - pending_renewal
  - expired
  - cancelled
  - declined
  transitions:
  - from: requested
    to: active
    by: user
    means: The customer signs the rate program enrollment and the program takes effect.
  - from: requested
    to: declined
    by: agent
    means: The enrollment is declined because the account does not qualify.
  - from: active
    to: pending_renewal
    by: system
    means: The renewal window opens ahead of the program year end.
  - from: active
    to: suspended
    by: agent
    means: Dispatch privileges are suspended for arrears or a credit hold.
  - from: pending_renewal
    to: suspended
    by: agent
    means: Dispatch privileges are suspended during the renewal window.
  - from: suspended
    to: active
    by: agent
    means: The program is reinstated once the arrears are cleared.
  - from: pending_renewal
    to: active
    by: agent
    means: The program is renewed for a further year.
  - from: pending_renewal
    to: expired
    by: system
    means: The program year ends without renewal.
  - from: active
    to: cancelled
    by: system
    means: A confirmed cancellation notice reaches its effective date.
  - from: suspended
    to: cancelled
    by: agent
    means: A suspended program is closed out.
  - from: expired
    to: active
    by: agent
    means: A lapsed program is restarted inside the restart window.
accounts:
- key: labor_hour_block
  unit: hours
  meaning: Prepaid technician hours the customer still holds under a block hour program; credited when
    a block is purchased, consumed by the labor hours of each completed call.
- key: emergency_call_allowance
  unit: calls
  meaning: Emergency dispatches still included in the current program year; credited at activation and
    renewal, consumed one per emergency call taken.
- key: service_balance
  unit: USD
  meaning: The amount the customer currently owes for demand service work; invoices increase it, payments
    and credits reduce it.
parameter_schema:
  regular_labor_rate_usd: Labor rate billed for one technician in regular hours (USD per hour).
  after_hours_rate_multiplier: Multiplier on the labor rate for work outside regular hours (decimal).
  weekend_rate_multiplier: Multiplier on the labor rate for work on a Saturday or Sunday (decimal).
  holiday_rate_multiplier: Multiplier on the labor rate for work on a published office holiday (decimal).
  apprentice_rate_usd: Labor rate billed for an apprentice accompanying the lead technician (USD per hour).
  second_technician_rate_usd: Labor rate billed for a second journeyman on the same call (USD per hour).
  minimum_billable_hours: Minimum labor hours billed on any dispatched call in regular hours (decimal
    hours).
  after_hours_minimum_hours: Minimum labor hours billed on a call taken outside regular hours (decimal
    hours).
  travel_time_billable: Whether travel time to and from the site is billed as labor (boolean).
  trip_charge_usd: Trip charge added to each dispatched call (USD).
  diagnostic_fee_usd: Diagnostic fee charged when a technician is dispatched to find a fault (USD).
  diagnostic_fee_credited_to_repair: Whether the diagnostic fee is credited against the repair when the
    repair is authorised on the same visit (boolean).
  parts_markup_pct: Markup applied to the contractor's parts cost when parts are billed (percent).
  parts_discount_pct: Discount from list price applied to parts under this program (percent).
  refrigerant_rate_usd_per_lb: Rate billed for refrigerant added on a demand call (USD per pound).
  response_time_guarantee_hours: Guaranteed on-site response for a routine demand call (integer, elapsed
    hours).
  priority_response_hours: Guaranteed on-site response for a priority call (integer, elapsed hours).
  emergency_response_hours: Guaranteed on-site response for an emergency call (integer, elapsed hours).
  critical_response_hours: Guaranteed on-site response for a call at a critical facility (integer, elapsed
    hours).
  dispatch_priority_rank: Position in the dispatch queue when several calls compete for the same technician
    (integer, 1 highest).
  after_hours_dispatch_included: Whether the program accepts dispatch outside regular hours at all (boolean).
  emergency_calls_included: Emergency dispatches included per program year before the emergency surcharge
    applies (integer, calls).
  emergency_call_surcharge_usd: Surcharge per emergency dispatch beyond the included calls (USD).
  sla_credit_pct: Credit of the call's labor charge when the response guarantee is missed (percent).
  sla_credit_cap_usd: Ceiling on the credit paid for one missed response (USD).
  block_hours_purchased: Technician hours credited when a block is bought under this program (integer,
    hours; 0 means the program sells no blocks).
  block_hour_rate_usd: Rate at which block hours are sold (USD per hour).
  block_min_purchase_hours: Smallest block that may be bought (integer, hours).
  block_hour_expiry_months: Months after purchase at which unused block hours expire (integer, calendar
    months).
  block_rollover_allowed: Whether unused block hours roll into the next program year at renewal (boolean).
  block_overage_rate_usd: Rate billed for labor hours beyond the remaining block (USD per hour).
  unused_block_refund_pct: Portion of unused block hours refunded at cancellation (percent).
  callback_window_days: Days after a completed repair within which a return call for the same fault is
    a callback (integer, calendar days).
  callback_labor_free: Whether callback labor inside the window is not billed (boolean).
  quote_required_above_usd: Estimated job value above which a written quote is required before work starts
    (USD).
  quote_validity_days: Days a written quote stays open for acceptance (integer, calendar days).
  approval_required_above_usd: Estimated job value above which the owner's written approval is required
    before work starts (USD).
  deposit_required_above_usd: Quoted job value above which a deposit is taken before work is scheduled
    (USD).
  deposit_pct: Deposit taken as a portion of the quoted value (percent).
  po_required: Whether a purchase order number must be carried on every invoice under this program (boolean).
  credit_limit_usd: Open balance above which no further work is dispatched without office release (USD).
  annual_program_fee_usd: Annual fee for holding the program (USD).
  enrollment_fee_usd: One-time fee charged when the program is opened (USD).
  min_sites_required: Minimum number of the customer's buildings that must be on the program (integer).
  term_months: Length of one program term (integer, calendar months).
  payment_terms_days: Days from invoice date to due date (integer, calendar days).
  late_fee_pct_per_month: Late fee on an overdue invoice per month (percent per month).
  suspension_after_days_past_due: Days past due after which dispatch privileges are suspended (integer,
    calendar days).
  reinstatement_fee_usd: Fee charged when a suspended or lapsed program is restarted (USD).
  restart_window_days: Days after the program year end within which a lapsed program can be restarted
    at the same rates (integer, calendar days).
  auto_renew: Whether the program renews automatically at the end of its term (boolean).
  renewal_window_days: Days before term end at which the renewal window opens (integer, calendar days).
  non_renewal_notice_days: Days before term end by which a non-renewal notice must be received (integer,
    calendar days).
  annual_escalation_pct: Escalation applied to the labor rate at each renewal (percent).
  cancellation_notice_days: Days of written notice before a cancellation takes effect (integer, calendar
    days).
  cancellation_fee_usd: Fee charged when the program is cancelled before its term end (USD).
  service_report_business_days: Business days after a completed call by which the service ticket is delivered
    (integer, business days).
  dedicated_technician_hours_per_week: Technician hours reserved for the customer each week (integer,
    hours; 0 where none are reserved).
  overtime_authorization_required: Whether the owner's authorisation is required before overtime labor
    is worked (boolean).
  maintenance_holder_rate_substitution: Whether a maintenance agreement's own labor rate replaces this
    program's rate for work on covered equipment (boolean).
