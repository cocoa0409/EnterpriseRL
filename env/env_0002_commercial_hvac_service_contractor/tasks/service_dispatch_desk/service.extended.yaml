      unpaid_invoice_count: "Where two or more invoices fell due within the window, the payments received in it leave part of the invoiced total standing and the open position stands above the tier's credit limit, twice the arrears handling charge of this policy is added; where two or more invoices fell due within the window and the payments received in it leave part of the invoiced total standing, the arrears handling charge of this policy is added."
      handling_charge: "No arrears handling charge is added. Where two or more invoices fell due within the window, the payments received in it leave part of the invoiced total standing and the open position stands above the tier's credit limit, twice the arrears handling charge of this policy is added; where two or more invoices fell due within the window and the payments received in it leave part of the invoiced total standing, the arrears handling charge of this policy is added."
