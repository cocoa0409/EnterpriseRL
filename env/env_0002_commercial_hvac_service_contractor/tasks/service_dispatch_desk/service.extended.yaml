- id: service_portfolio_interaction
  subject:
  - service_call_dispatched
  - service_invoice_charged
  rule: 'The rate program does not decide by itself what a call costs when the building is also under
    a maintenance agreement. Where the unit called about sits on an active maintenance agreement whose
    tier covers repair labor, the repair is handled under that agreement and its allowance, and the demand
    program bills nothing for the labor; the demand rates apply only to work the agreement does not cover.
    Where the tier allows rate substitution and the unit sits on a maintenance agreement that does not
    cover the repair, the lower of the agreement''s labor rate and this program''s labor rate governs
    the labor line. Where the tier does not allow rate substitution, this program''s rate governs, because
    at those tiers the rate is already below every agreement rate the company publishes. A building whose
    calls are dispatched under an equipment retrofit project in progress is billed to that project and
    not to this program, and the desk never splits one work order between the two. Emergency allowance
    and maintenance emergency entitlements do not stack: where both would cover the same dispatch, the
    maintenance entitlement is drawn first and the program allowance is left untouched.'
  eligibility:
  - id: covering_agreement_takes_precedence
    applies_to:
    - service_call_dispatched
    kind: authorization
    condition: Where the unit called about sits on an active maintenance agreement whose tier covers repair
      labor, the repair is handled under that agreement and its allowance, and the demand program bills
      nothing for the labor; the demand rates apply only to work the agreement does not cover.
    evidence_fields:
    - maintenance_agreements.site_id
    - maintenance_agreements.status
    - maintenance_agreements.variant_name
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - maintenance_agreements.site_id
      action_bindings:
        maintenance_agreements.site_id: site_id
  params:
    per_tier:
      Time & Material Account:
        substitution: =maintenance_holder_rate_substitution
        rate_usd: =regular_labor_rate_usd
      Priority Response Program:
        substitution: =maintenance_holder_rate_substitution
        rate_usd: =regular_labor_rate_usd
      Block Hour Service Program:
        substitution: =maintenance_holder_rate_substitution
        rate_usd: =regular_labor_rate_usd
      Emergency Response Program:
        substitution: =maintenance_holder_rate_substitution
        rate_usd: =regular_labor_rate_usd
      Critical Facility Response Program:
        substitution: =maintenance_holder_rate_substitution
        rate_usd: =regular_labor_rate_usd
      Dedicated Technician Program:
        substitution: =maintenance_holder_rate_substitution
        rate_usd: =regular_labor_rate_usd

extended_policies:
  - id: service_ext_completed_call_labor_charge
    base_policy_refs: [service_labor_billing, service_billing_and_late_fee, service_portfolio_interaction, service_block_hour_drawdown]
    overwrite:
      - base_policy: service_labor_billing
        superseded_clause: >-
          Work outside regular hours, on a weekend or on a published office holiday is billed at the
          tier's regular rate multiplied by the after-hours, weekend or holiday multiplier respectively,
          and where more than one of those applies to the same hours the highest single multiplier
          governs and the multipliers are never compounded.
        replaced_by: >-
          Hours the call record puts on a published office holiday carry the tier's holiday multiplier,
          hours it puts outside regular hours, whether on a weekday evening, overnight or at a weekend,
          carry the tier's after-hours multiplier, and hours worked in regular hours carry no premium;
          the multipliers are never compounded.
      - base_policy: service_labor_billing
        superseded_clause: >-
          Labor on a demand call is billed at the tier's regular rate for the lead technician, at the
          second journeyman rate for each further journeyman and at the apprentice rate for an
          apprentice, each for the hours that person was on site.
        replaced_by: >-
          Where the call record shows more than one technician on a call taken at emergency or critical
          priority, each technician beyond the lead is billed at the tier's second journeyman rate for
          the hours charged for; where it shows more than one technician on a call taken at routine or
          priority, each technician beyond the lead is billed at the tier's apprentice rate for the hours
          charged for.
      - base_policy: service_block_hour_drawdown
        superseded_clause: >-
          Where the tier sells blocks, prepaid hours are bought in multiples of the tier's minimum
          purchase at the tier's block rate, and they are drawn down by the labor hours of each completed
          call, oldest block first.
        replaced_by: >-
          Where the tier lets unused prepaid hours roll into the next program year and blocks bought
          within the tier's expiry period stand on the program, the prepaid hours available to the call
          are the hours of every block bought within that period less the hours drawn by the calls
          completed in the same period ahead of it, and only the hours of the call beyond that balance
          are billed
      - base_policy: service_block_hour_drawdown
        superseded_clause: >-
          Once the remaining block reaches zero the further hours of that call and of every later call
          are billed at the tier's overage rate until a new block is bought.
        replaced_by: >-
          The hours beyond the prepaid balance never carry the further technicians' element, which is
          billed on the hours charged for in full, because prepaid hours are drawn for the lead
          technician alone.
      - base_policy: service_billing_and_late_fee
        superseded_clause: >-
          The invoice falls due the tier's payment term after the invoice date, counted in calendar days
          with the invoice day excluded and the due day included, and the account's own credit terms
          apply only where the program has no term of its own.
        replaced_by: >-
          The labor line is raised without a due day, and it is dated for payment when the billing
          month's invoice is issued.
    trigger: state_due
    subject: [service_invoice_charged]
    computes: labor_charge_usd
    target_tool: charge_demand_labor_invoice_877d69f1
    params:
      no_premium: 1.0
    rule: >
      The labor line for demand work is raised for the call last completed on the rate program, and it
      is worked out from the hours the ticket logs for that call, the hours of them the owner is charged
      for, the rate those hours are billed at, the premium the band carries and what is billed for any
      technician beyond the lead. The hours the ticket logs are taken as they stand, rounded up to the
      next quarter hour. Where the call record puts the hours outside regular hours and the hours logged
      fall short of the tier's after-hours minimum, the after-hours minimum stands as the hours charged
      for; where the call record puts the hours in regular hours and the hours logged fall short of the
      tier's minimum billable hours, the minimum billable hours stand as the hours charged for.
      Every hour charged for is billed, and none of them is met from prepaid hours. Where the tier lets
      unused prepaid hours roll into the next program year and blocks bought within the tier's expiry
      period stand on the program, the prepaid hours available to the call are the hours of every block
      bought within that period less the hours drawn by the calls completed in the same period ahead of
      it, and only the hours of the call beyond that balance are billed; where the tier lets no unused
      hours roll over but blocks stand bought since the current term started, the prepaid hours
      available are the hours bought since the term start date less the hours drawn since that day, and
      only the hours beyond that balance are billed.
      The rate is the tier's block overage rate. Where an active preventive maintenance agreement on the
      account is held at a tier that covers repair labor and the call was worked at the building that
      agreement runs at, the demand program bills nothing for the labor and the rate is nil; where an
      active preventive maintenance agreement on the account is held at a tier that does not cover
      repair labor, the call was worked at the building that agreement runs at, the tier allows rate
      substitution and the agreement's published agreement labor rate is lower than the tier's block
      overage rate, that published agreement labor rate is the rate.
      Hours worked in regular hours carry no premium. Hours the call record puts on a published office
      holiday carry the tier's holiday multiplier, hours it puts outside regular hours, whether on a
      weekday evening, overnight or at a weekend, carry the tier's after-hours multiplier, and hours
      worked in regular hours carry no premium; the multipliers are never compounded.
      Nothing further is billed for technicians beyond the lead. Where the call record shows more than one technician on a call taken
      at emergency or critical priority, each technician beyond the lead is billed at the tier's second
      journeyman rate for the hours charged for; where it shows more than one technician on a call taken
      at routine or priority, each technician beyond the lead is billed at the tier's apprentice rate for
      the hours charged for. The hours beyond the prepaid balance never carry the further technicians'
      element, which is billed on the hours charged for in full, because prepaid hours are drawn for the
      lead technician alone.
      The labor line is the hours billed multiplied by the rate and then by the premium, added to the
      further technicians' element, which is itself the number of technicians beyond the lead multiplied
      by the hours charged for, by the rate that technician is billed at and by the same premium; the
      two elements are added and only the total is rounded, to the nearest cent, half up. The labor line
      is raised without a due day, and it is dated for payment when the billing month's invoice is
      issued.
    prerequisite: []
    cross_category:
      - category: maintenance
        as: branch
        reads: [status, repair_labor_covered, agreement_labor_rate_usd, site_id]
        note: >-
          Decides the tier of the rate factor: whether a covering agreement takes the labor entirely, or
          publishes a lower labor rate than this program's block overage rate, is read from the
          customer's active preventive maintenance agreement and the building it runs at.
    compute:
      - logged_hours: "LATEST('service_events','labor_hours', date_field='completed_date', event_type='service_call_completed')"
      - call_band: "LATEST('service_events','hours_band', date_field='completed_date', event_type='service_call_completed')"
      - band_multiplier: "P('holiday_rate_multiplier') if call_band == 'holiday' else (P('after_hours_rate_multiplier') if call_band != 'regular' else K('no_premium'))"
      - billable_hours: "P('after_hours_minimum_hours') if (call_band != 'regular' and logged_hours < P('after_hours_minimum_hours')) else (P('minimum_billable_hours') if (call_band == 'regular' and logged_hours < P('minimum_billable_hours')) else (0 - ((0 - logged_hours * 4) // 1)) / 4)"
      - agreement_covers_labor: "CPARAM('maintenance','repair_labor_covered', status='active')"
      - agreement_rate: "CPARAM('maintenance','agreement_labor_rate_usd', status='active')"
      - agreement_site: "CFIELD('maintenance','site_id', status='active')"
      - call_site: "LATEST('service_events','site_id', date_field='completed_date', event_type='service_call_completed')"
      - governing_rate: "0.0 if (agreement_covers_labor == True and agreement_site == call_site) else (agreement_rate if (agreement_covers_labor != True and agreement_site == call_site and P('maintenance_holder_rate_substitution') == True and (agreement_rate or 0) > 0 and (agreement_rate or 0) < P('block_overage_rate_usd')) else P('block_overage_rate_usd'))"
      - call_priority_recorded: "LATEST('service_events','call_priority', date_field='dispatch_timestamp', event_type='service_call_dispatched')"
      - technician_count: "LATEST('service_events','technician_count', date_field='completed_date', event_type='service_call_completed')"
      - second_technician_rate: "P('second_technician_rate_usd') if (technician_count > 1 and (call_priority_recorded == 'emergency' or call_priority_recorded == 'critical')) else (P('apprentice_rate_usd') if (technician_count > 1 and (call_priority_recorded == 'routine' or call_priority_recorded == 'priority')) else 0.0)"
      - unexpired_block_hours: "SUM('service_events','block_hours', within_months=P('block_hour_expiry_months'), date_field='purchased_date', event_type='service_block_hours_purchased')"
      - hours_drawn_in_span: "SUM('service_events','labor_hours', within_months=P('block_hour_expiry_months'), date_field='completed_date', event_type='service_call_completed')"
      - term_block_hours: "SUM('service_events','block_hours', within_months=MONTHS(F('term_start_date'), NOW) + 1, date_field='purchased_date', event_type='service_block_hours_purchased')"
      - term_hours_drawn: "SUM('service_events','labor_hours', within_months=MONTHS(F('term_start_date'), NOW) + 1, date_field='completed_date', event_type='service_call_completed')"
      - chargeable_hours: "MX(0, billable_hours - MX(0, unexpired_block_hours - (hours_drawn_in_span - logged_hours))) if (unexpired_block_hours > 0 and P('block_rollover_allowed') == True) else (MX(0, billable_hours - MX(0, term_block_hours - (term_hours_drawn - logged_hours))) if (term_block_hours > 0 and P('block_rollover_allowed') != True) else billable_hours)"
      - result: "RND(chargeable_hours * governing_rate * band_multiplier + MX(0, technician_count - 1) * billable_hours * second_technician_rate * band_multiplier, 2)"
    compute_basis:
      logged_hours: "The labor line for demand work is raised for the call last completed on the rate program, and it is worked out from the hours the ticket logs for that call, the hours of them the owner is charged for, the rate those hours are billed at, the premium the band carries and what is billed for any technician beyond the lead."
      call_band: "Hours the call record puts on a published office holiday carry the tier's holiday multiplier, hours it puts outside regular hours, whether on a weekday evening, overnight or at a weekend, carry the tier's after-hours multiplier, and hours worked in regular hours carry no premium; the multipliers are never compounded."
      band_multiplier: "Hours the call record puts on a published office holiday carry the tier's holiday multiplier, hours it puts outside regular hours, whether on a weekday evening, overnight or at a weekend, carry the tier's after-hours multiplier, and hours worked in regular hours carry no premium; the multipliers are never compounded."
      billable_hours: "The hours the ticket logs are taken as they stand, rounded up to the next quarter hour. Where the call record puts the hours outside regular hours and the hours logged fall short of the tier's after-hours minimum, the after-hours minimum stands as the hours charged for; where the call record puts the hours in regular hours and the hours logged fall short of the tier's minimum billable hours, the minimum billable hours stand as the hours charged for."
      agreement_covers_labor: "Where an active preventive maintenance agreement on the account is held at a tier that covers repair labor and the call was worked at the building that agreement runs at, the demand program bills nothing for the labor and the rate is nil; where an active preventive maintenance agreement on the account is held at a tier that does not cover repair labor, the call was worked at the building that agreement runs at, the tier allows rate substitution and the agreement's published agreement labor rate is lower than the tier's block overage rate, that published agreement labor rate is the rate."
      agreement_rate: "where an active preventive maintenance agreement on the account is held at a tier that does not cover repair labor, the call was worked at the building that agreement runs at, the tier allows rate substitution and the agreement's published agreement labor rate is lower than the tier's block overage rate, that published agreement labor rate is the rate."
      agreement_site: "Where an active preventive maintenance agreement on the account is held at a tier that covers repair labor and the call was worked at the building that agreement runs at, the demand program bills nothing for the labor and the rate is nil; where an active preventive maintenance agreement on the account is held at a tier that does not cover repair labor, the call was worked at the building that agreement runs at, the tier allows rate substitution and the agreement's published agreement labor rate is lower than the tier's block overage rate, that published agreement labor rate is the rate."
      call_site: "Where an active preventive maintenance agreement on the account is held at a tier that covers repair labor and the call was worked at the building that agreement runs at, the demand program bills nothing for the labor and the rate is nil"
      governing_rate: "The rate is the tier's block overage rate. Where an active preventive maintenance agreement on the account is held at a tier that covers repair labor and the call was worked at the building that agreement runs at, the demand program bills nothing for the labor and the rate is nil; where an active preventive maintenance agreement on the account is held at a tier that does not cover repair labor, the call was worked at the building that agreement runs at, the tier allows rate substitution and the agreement's published agreement labor rate is lower than the tier's block overage rate, that published agreement labor rate is the rate."
      call_priority_recorded: "Where the call record shows more than one technician on a call taken at emergency or critical priority, each technician beyond the lead is billed at the tier's second journeyman rate for the hours charged for; where it shows more than one technician on a call taken at routine or priority, each technician beyond the lead is billed at the tier's apprentice rate for the hours charged for."
      technician_count: "Nothing further is billed for technicians beyond the lead. Where the call record shows more than one technician on a call taken at emergency or critical priority, each technician beyond the lead is billed at the tier's second journeyman rate for the hours charged for; where it shows more than one technician on a call taken at routine or priority, each technician beyond the lead is billed at the tier's apprentice rate for the hours charged for."
      second_technician_rate: "Where the call record shows more than one technician on a call taken at emergency or critical priority, each technician beyond the lead is billed at the tier's second journeyman rate for the hours charged for; where it shows more than one technician on a call taken at routine or priority, each technician beyond the lead is billed at the tier's apprentice rate for the hours charged for."
      unexpired_block_hours: "Where the tier lets unused prepaid hours roll into the next program year and blocks bought within the tier's expiry period stand on the program, the prepaid hours available to the call are the hours of every block bought within that period less the hours drawn by the calls completed in the same period ahead of it, and only the hours of the call beyond that balance are billed"
      hours_drawn_in_span: "Where the tier lets unused prepaid hours roll into the next program year and blocks bought within the tier's expiry period stand on the program, the prepaid hours available to the call are the hours of every block bought within that period less the hours drawn by the calls completed in the same period ahead of it, and only the hours of the call beyond that balance are billed"
      term_block_hours: "where the tier lets no unused hours roll over but blocks stand bought since the current term started, the prepaid hours available are the hours bought since the term start date less the hours drawn since that day, and only the hours beyond that balance are billed"
      term_hours_drawn: "where the tier lets no unused hours roll over but blocks stand bought since the current term started, the prepaid hours available are the hours bought since the term start date less the hours drawn since that day, and only the hours beyond that balance are billed"
      chargeable_hours: "Every hour charged for is billed, and none of them is met from prepaid hours. Where the tier lets unused prepaid hours roll into the next program year and blocks bought within the tier's expiry period stand on the program, the prepaid hours available to the call are the hours of every block bought within that period less the hours drawn by the calls completed in the same period ahead of it, and only the hours of the call beyond that balance are billed; where the tier lets no unused hours roll over but blocks stand bought since the current term started, the prepaid hours available are the hours bought since the term start date less the hours drawn since that day, and only the hours beyond that balance are billed."
      result: "The labor line is the hours billed multiplied by the rate and then by the premium, added to the further technicians' element, which is itself the number of technicians beyond the lead multiplied by the hours charged for, by the rate that technician is billed at and by the same premium; the two elements are added and only the total is rounded, to the nearest cent, half up."
    factors:
      - id: hours_charged_for
        effect: method
        decides: billable_hours
        bindings: [logged_hours, billable_hours]
        ladder:
          - when: "the call record puts the hours outside regular hours and the hours logged fall short of the tier's after-hours minimum"
            method: "the after-hours minimum stands as the hours charged for"
          - when: "the call record puts the hours in regular hours and the hours logged fall short of the tier's minimum billable hours"
            method: "the tier's minimum billable hours stand as the hours charged for"
          - when: "otherwise"
            method: "the hours the ticket logs are taken as they stand, rounded up to the next quarter hour"
