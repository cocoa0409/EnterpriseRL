            value: "twice K('arrears_handling_charge_usd')"
          - when: "two or more invoices fell due within the window and the payments received in it leave part of the invoiced total standing"
            value: "K('arrears_handling_charge_usd')"
          - when: "otherwise"
            value: "no arrears handling charge is added"
        baseline:
          handling_charge: "0.0"
        evidence: [history]
