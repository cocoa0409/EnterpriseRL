      holds_agreement: "Where the owner holds an active preventive maintenance agreement and the installments that fell due on it in the same window are not cleared by the payments received on it, the cross arrears step of this policy is added to the monthly rate; where the owner holds an active preventive maintenance agreement and the installments that fell due on it in that window are cleared, the covered account step of this policy is taken off the monthly rate."
      mx_installments: "Where the owner holds an active preventive maintenance agreement and the installments that fell due on it in the same window are not cleared by the payments received on it, the cross arrears step of this policy is added to the monthly rate"
      mx_payments: "where the owner holds an active preventive maintenance agreement and the installments that fell due on it in that window are cleared, the covered account step of this policy is taken off the monthly rate"
