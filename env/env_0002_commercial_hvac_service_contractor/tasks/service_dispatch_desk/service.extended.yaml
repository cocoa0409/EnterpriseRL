          labor_element: "call_logged_hours * P('block_hour_rate_usd')"
        evidence: [history]
        cross_difficulty: null
      - id: attendance_element
        effect: parameter
        decides: attendance_charge
        bindings: [holds_agreement, mx_trip_waived, mx_trip_charge, attendance_charge]
        ladder:
          - when: "the owner holds an active preventive maintenance agreement at a tier that waives the trip charge on demand calls"
            value: "no attendance element enters the credit"
          - when: "the owner holds an active preventive maintenance agreement at a tier whose published trip charge is lower than the tier's own trip charge"
            value: "the published trip charge of that maintenance agreement"
          - when: "otherwise"
            value: "P('trip_charge_usd')"
        baseline:
          attendance_charge: "P('trip_charge_usd')"
        evidence: [cross_category]
        cross_difficulty: maintenance
      - id: miss_severity_rate
        effect: parameter
        decides: credit_rate_pct
        bindings: [miss_priority, dispatch_day, arrival_day, days_to_arrival, credit_rate_pct]
        ladder:
          - when: "the call the credit arises from was accepted at emergency or critical priority and the technician reached the building on a later calendar day than the day the call was accepted"
            value: "P('sla_credit_pct') taken at K('severe_miss_multiple')"
          - when: "the call was accepted at routine or priority and the technician reached the building on a later calendar day than the day the call was accepted"
            value: "P('sla_credit_pct') taken at K('lesser_miss_share')"
          - when: "otherwise"
            value: "P('sla_credit_pct')"
        baseline:
          credit_rate_pct: "P('sla_credit_pct')"
        evidence: [history, date]
        cross_difficulty: null
      - id: repeat_miss_uplift
        effect: parameter
        decides: repeat_uplift
        bindings: [missed_calls_in_year, repeat_uplift]
        ladder:
          - when: "three or more calls completed in the current program year carry a response recorded as missed"
            value: "K('third_miss_uplift')"
          - when: "exactly two such calls stand in the current program year"
            value: "K('second_miss_uplift')"
          - when: "otherwise"
            value: "K('single_miss_uplift')"
        baseline:
          repeat_uplift: "K('single_miss_uplift')"
        evidence: [history, date]
        cross_difficulty: null
    baseline:
      rule: >-
        The credit for a missed response is worked out from the charges the call it arises from carries
        and the tier's credit rate. The call the credit arises from is the call last completed on the rate
        program. The labor element is the hours the ticket logs for that call valued
        at the tier's block hour rate. The attendance element is the tier's trip charge. The tier's
        credit rate applies. No uplift is applied for earlier missed responses. The current program year
        runs from the day the current term started to the day the credit is issued. The credit is the
        labor element and the attendance element added together, taken at the credit rate for each
        hundred, multiplied by the uplift, rounded to the nearest cent, half up, and it is never more
        than the tier's ceiling for one missed response. The ceiling is compared with the rounded figure,
        so the ceiling applies last of all.
      params: [sla_credit_pct, sla_credit_cap_usd, block_hour_rate_usd, trip_charge_usd, single_miss_uplift]
    inputs:
      history:
        - {table: service_events, aggregate: latest, field: amount_usd, within_months: null, filters: {event_type: service_invoice_charged, charge_type: labor}}
        - {table: service_events, aggregate: count, field: null, within_months: 8, filters: {event_type: service_call_completed, sla_met: missed}}
      cross_category: [maintenance]
  - id: service_ext_account_settlement_figure
    base_policy_refs: [service_billing_and_late_fee, service_emergency_entitlement]
    overwrite:
      - base_policy: service_billing_and_late_fee
        superseded_clause: >-
          The invoice falls due the tier's payment term after the invoice date, counted in calendar days
          with the invoice day excluded and the due day included, and the account's own credit terms
          apply only where the program has no term of its own.
        replaced_by: >-
          A charge line raised on the program during the billing month stands without a due day until
          the billing month's invoice is issued, and until then it has not fallen due.
      - base_policy: service_emergency_entitlement
        superseded_clause: >-
          A call taken once the year's included calls are used up still runs at the tier's emergency
          response guarantee, and it carries the tier's emergency surcharge on top of the labor and parts
          of the call.
        replaced_by: >-
          Where the emergency dispatches counted against the current program year stand at more than
          twice the tier's included emergency calls, the tier's emergency call surcharge taken at the
          heavy use multiple of this policy is taken in for each dispatch beyond the included calls
    trigger: on_request
    subject: [service_payment_received]
    computes: payment_amount_usd
    target_tool: record_account_payment_d97a44a1
    params:
      ledger_window_months: 24
      heavy_use_multiple: 1.5
      settlement_allowance_pct: 1.5
      reduced_allowance_share: 0.5
    rule: >
      The figure that clears the demand service account is worked out from the charges standing on the
      rate program, the payments already received on it, the credits set against it, what the program
      year's emergency dispatches owe and any allowance for settling.
      The figure that clears the demand service account is settled only once the call last completed on
      the program carries its labor charge on the ledger. The figure that clears the demand service
      account is settled only after the late fee the billing month owes stands as a line on the rate
      program. The figure that clears the demand service account is settled only after the credit owed
      for the missed response on the call last completed on the program stands as a credit entry on the
      rate program.
      A charge line raised on the program during the billing month stands without a due day until the
      billing month's invoice is issued, and until then it has not fallen due. The ledger window of this
      policy runs back from the day the account is settled for the number of months it names.
      Only the charges that have fallen due within the ledger window of this policy are taken in. Where
      charges stand on the program that have not fallen due within the ledger window of this policy and
      charges also stand that have fallen due within it, every charge invoiced on the program is taken
      in, fallen due or not; where no charge on the program has fallen due within the ledger window of
      this policy but charges stand that have not, only the charges that have not fallen due within it
      are taken in.
      No credit is set off. Where credits stand issued on the program in the current billing month and
      charges also stand on it that have not fallen due within the ledger window of this policy, every
      credit standing on the program is set off; where credits stand issued in the current billing month
      and no charge stands on it that has not fallen due within the ledger window of this policy, only
      the credits issued in the current billing month are set off.
      Nothing is taken in for emergency dispatches beyond the year's included calls. Where the emergency
      dispatches counted against the current program year stand at more than twice the tier's included
      emergency calls, the tier's emergency call surcharge taken at the heavy use multiple of this policy
      is taken in for each dispatch beyond the included calls; where those dispatches stand above the
      tier's included emergency calls but not above twice them, the tier's emergency call surcharge is
      taken in for each dispatch beyond the included calls. The current program year runs from the day
      the current term started to the day the account is settled.
      No allowance comes off. Where the most recent invoice on the program fell due no longer ago than
      the tier's suspension period and payments stand received on the program within the ledger window of
      this policy, the settlement allowance of this policy comes off the charges taken in; where the most
      recent invoice fell due longer ago than the tier's suspension period and payments stand received
      within that window, the reduced allowance share of this policy is taken of that allowance instead.
      The figure is the charges taken in, less every payment received on the program, less the credits
      set off, with the emergency dispatch element added and the allowance taken off; the allowance is
      worked out on the charges taken in alone and never on the figure after the payments and credits
      come off, and only the total is rounded, to the nearest cent, half up.
    prerequisite:
      - problem: service_ext_completed_call_labor_charge
        kind: value_input
        gate: charges_taken_in
        form: state
        policy_source: >-
          The figure that clears the demand service account is settled only once the call last completed on
          the program carries its labor charge on the ledger.
        condition: >-
          The call last completed on the rate program carries a demand service charge line of the labor
          kind on the ledger.
        resolved_by: charge_demand_labor_invoice_877d69f1
        effect: >-
          The charges taken in rise by the labor line the completed call owes, so the figure that clears
          the account rises with it.
      - problem: service_ext_arrears_late_fee
        kind: value_input
        gate: charges_taken_in
        form: state
        policy_source: >-
          The figure that clears the demand service account is settled only after the late fee the
          billing month owes stands as a line on the rate program.
        condition: >-
          A demand service charge line of the late fee kind stands on the rate program for the current
          billing month.
        resolved_by: charge_overdue_late_fee_58988cf8
        effect: >-
          The charges taken in rise by the late fee line of the billing month, so the figure that clears
          the account rises with it.
      - problem: service_ext_missed_response_credit
        kind: value_input
        gate: credits_set_off
        form: state
        policy_source: >-
          The figure that clears the demand service account is settled only after the credit owed
          for the missed response on the call last completed on the program stands as a credit entry on the
          rate program.
        condition: >-
          A demand service credit entry for a missed response stands on the rate program for the call
          last completed on it.
        resolved_by: credit_missed_response_9859bc76
        effect: >-
          The credits set off rise by the missed response credit, so the figure that clears the account
          falls by it.
    cross_category: []
    compute:
      - charges_all: "SUM('service_events','amount_usd', event_type='service_invoice_charged')"
      - charges_due: "SUM('service_events','amount_usd', within_months=K('ledger_window_months'), date_field='due_date', event_type='service_invoice_charged')"
      - charges_taken_in: "charges_all if (charges_all > charges_due and charges_due > 0) else ((charges_all - charges_due) if (charges_due <= 0 and charges_all > 0) else charges_due)"
      - payments_all: "SUM('service_events','amount_usd', event_type='service_payment_received')"
      - credits_all: "SUM('service_events','amount_usd', event_type='service_credit_issued')"
      - credits_this_month: "SUM('service_events','amount_usd', within_months=1, date_field='issued_date', event_type='service_credit_issued')"
      - credits_set_off: "credits_all if (credits_this_month > 0 and charges_all > charges_due) else (credits_this_month if (credits_this_month > 0 and charges_all <= charges_due) else 0.0)"
      - emergency_used: "COUNT('service_events', within_months=MONTHS(F('term_start_date'), NOW) + 1, date_field='used_date', event_type='service_emergency_call_used')"
      - surcharge_per_dispatch: "P('emergency_call_surcharge_usd') * K('heavy_use_multiple') if emergency_used > 2 * P('emergency_calls_included') else (P('emergency_call_surcharge_usd') if emergency_used > P('emergency_calls_included') else 0.0)"
      - surcharge_element: "MX(0, emergency_used - P('emergency_calls_included')) * surcharge_per_dispatch"
      - days_since_last_due: "DAYS(LATEST('service_events','due_date', date_field='due_date', event_type='service_invoice_charged'), NOW)"
      - payments_in_window: "SUM('service_events','amount_usd', within_months=K('ledger_window_months'), date_field='received_date', event_type='service_payment_received')"
      - allowance_pct: "K('settlement_allowance_pct') if (days_since_last_due <= P('suspension_after_days_past_due') and payments_in_window > 0) else (K('settlement_allowance_pct') * K('reduced_allowance_share') if (days_since_last_due > P('suspension_after_days_past_due') and payments_in_window > 0) else 0.0)"
      - settlement_allowance: "charges_taken_in * allowance_pct / 100"
      - result: "RND(charges_taken_in - payments_all - credits_set_off + surcharge_element - settlement_allowance, 2)"
    compute_basis:
      charges_all: "Where charges stand on the program that have not fallen due within the ledger window of this policy and charges also stand that have fallen due within it, every charge invoiced on the program is taken in, fallen due or not; where no charge on the program has fallen due within the ledger window of this policy but charges stand that have not, only the charges that have not fallen due within it are taken in."
      charges_due: "Only the charges that have fallen due within the ledger window of this policy are taken in. The ledger window of this policy runs back from the day the account is settled for the number of months it names."
      charges_taken_in: "Only the charges that have fallen due within the ledger window of this policy are taken in. Where charges stand on the program that have not fallen due within the ledger window of this policy and charges also stand that have fallen due within it, every charge invoiced on the program is taken in, fallen due or not; where no charge on the program has fallen due within the ledger window of this policy but charges stand that have not, only the charges that have not fallen due within it are taken in."
      payments_all: "The figure is the charges taken in, less every payment received on the program, less the credits set off, with the emergency dispatch element added and the allowance taken off"
      credits_all: "Where credits stand issued on the program in the current billing month and charges also stand on it that have not fallen due within the ledger window of this policy, every credit standing on the program is set off"
      credits_this_month: "where credits stand issued in the current billing month and no charge stands on it that has not fallen due within the ledger window of this policy, only the credits issued in the current billing month are set off"
      credits_set_off: "No credit is set off. Where credits stand issued on the program in the current billing month and charges also stand on it that have not fallen due within the ledger window of this policy, every credit standing on the program is set off; where credits stand issued in the current billing month and no charge stands on it that has not fallen due within the ledger window of this policy, only the credits issued in the current billing month are set off."
      emergency_used: "The current program year runs from the day the current term started to the day the account is settled."
      surcharge_per_dispatch: "Nothing is taken in for emergency dispatches beyond the year's included calls. Where the emergency dispatches counted against the current program year stand at more than twice the tier's included emergency calls, the tier's emergency call surcharge taken at the heavy use multiple of this policy is taken in for each dispatch beyond the included calls; where those dispatches stand above the tier's included emergency calls but not above twice them, the tier's emergency call surcharge is taken in for each dispatch beyond the included calls."
      surcharge_element: "the tier's emergency call surcharge is taken in for each dispatch beyond the included calls"
      days_since_last_due: "Where the most recent invoice on the program fell due no longer ago than the tier's suspension period and payments stand received on the program within the ledger window of this policy, the settlement allowance of this policy comes off the charges taken in; where the most recent invoice fell due longer ago than the tier's suspension period and payments stand received within that window, the reduced allowance share of this policy is taken of that allowance instead."
      payments_in_window: "Where the most recent invoice on the program fell due no longer ago than the tier's suspension period and payments stand received on the program within the ledger window of this policy, the settlement allowance of this policy comes off the charges taken in"
      allowance_pct: "No allowance comes off. Where the most recent invoice on the program fell due no longer ago than the tier's suspension period and payments stand received on the program within the ledger window of this policy, the settlement allowance of this policy comes off the charges taken in; where the most recent invoice fell due longer ago than the tier's suspension period and payments stand received within that window, the reduced allowance share of this policy is taken of that allowance instead."
      settlement_allowance: "the allowance is worked out on the charges taken in alone and never on the figure after the payments and credits come off"
      result: "The figure is the charges taken in, less every payment received on the program, less the credits set off, with the emergency dispatch element added and the allowance taken off; the allowance is worked out on the charges taken in alone and never on the figure after the payments and credits come off, and only the total is rounded, to the nearest cent, half up."
    factors:
      - id: charges_the_settlement_takes_in
        effect: method
        decides: charges_taken_in
        bindings: [charges_all, charges_due, charges_taken_in]
        ladder:
          - when: "charges stand on the program that have not fallen due within the ledger window of this policy and charges also stand that have fallen due within it"
            method: "every charge invoiced on the program is taken in, fallen due or not"
          - when: "no charge on the program has fallen due within the ledger window of this policy but charges stand that have not"
            method: "only the charges that have not fallen due within it are taken in"
          - when: "otherwise"
            method: "only the charges that have fallen due within the ledger window of this policy are taken in"
        baseline:
          charges_taken_in: "charges_due"
        evidence: [history, date]
        cross_difficulty: null
      - id: credits_the_settlement_sets_off
        effect: method
        decides: credits_set_off
        bindings: [credits_all, credits_this_month, credits_set_off]
        ladder:
          - when: "credits stand issued on the program in the current billing month and charges also stand on it that have not fallen due within the ledger window of this policy"
            method: "every credit standing on the program is set off"
          - when: "credits stand issued in the current billing month and no charge stands on it that has not fallen due within the ledger window of this policy"
            method: "only the credits issued in the current billing month are set off"
          - when: "otherwise"
            method: "no credit is set off"
        baseline:
          credits_set_off: "0.0"
        evidence: [history, date]
        cross_difficulty: null
      - id: emergency_dispatch_element
        effect: parameter
        decides: surcharge_per_dispatch
        bindings: [emergency_used, surcharge_per_dispatch]
        ladder:
          - when: "the emergency dispatches counted against the current program year stand at more than twice the tier's included emergency calls"
            value: "P('emergency_call_surcharge_usd') taken at K('heavy_use_multiple'), for each dispatch beyond the included calls"
          - when: "those dispatches stand above the tier's included emergency calls but not above twice them"
            value: "P('emergency_call_surcharge_usd') for each dispatch beyond the included calls"
          - when: "otherwise"
            value: "nothing is taken in for emergency dispatches"
        baseline:
          surcharge_per_dispatch: "0.0"
        evidence: [history, date]
        cross_difficulty: null
      - id: settlement_allowance_rate
        effect: parameter
        decides: allowance_pct
        bindings: [days_since_last_due, payments_in_window, allowance_pct]
        ladder:
          - when: "the most recent invoice on the program fell due no longer ago than the tier's suspension period and payments stand received on the program within the ledger window of this policy"
            value: "K('settlement_allowance_pct')"
          - when: "the most recent invoice fell due longer ago than the tier's suspension period and payments stand received within that window"
            value: "K('reduced_allowance_share') of K('settlement_allowance_pct')"
          - when: "otherwise"
            value: "no allowance comes off"
        baseline:
          allowance_pct: "0.0"
        evidence: [date, history]
        cross_difficulty: null
    baseline:
      rule: >-
        The figure that clears the demand service account is worked out from the charges standing on the
        rate program, the payments already received on it, the credits set against it, what the program
        year's emergency dispatches owe and any allowance for settling. The ledger window of this
        policy runs back from the day the account is settled for the number of months it names. Only the
        charges that have fallen due within the ledger window of this policy are taken in. No credit is
        set off. Nothing is taken in for
        emergency dispatches beyond the year's included calls. The current program year runs from the day
        the current term started to the day the account is settled. No allowance comes off. The figure is
        the charges taken in, less every payment received on the program, less the credits set off, with
        the emergency dispatch element added and the allowance taken off; the allowance is worked out on
        the charges taken in alone and never on the figure after the payments and credits come off, and
        only the total is rounded, to the nearest cent, half up.
      params: [ledger_window_months, emergency_calls_included]
    inputs:
      history:
        - {table: service_events, aggregate: sum, field: amount_usd, within_months: null, filters: {event_type: service_invoice_charged}}
        - {table: service_events, aggregate: sum, field: amount_usd, within_months: null, filters: {event_type: service_payment_received}}
        - {table: service_events, aggregate: sum, field: amount_usd, within_months: null, filters: {event_type: service_credit_issued}}
        - {table: service_events, aggregate: count, field: null, within_months: 8, filters: {event_type: service_emergency_call_used}}
      cross_category: []
  - id: service_ext_credit_ceiling_review
    base_policy_refs: [service_quote_and_approval, service_suspension_and_reinstatement, service_dispatch_and_response]
    overwrite: []
    trigger: state_due
    subject: [service_program_updated]
    computes: credit_limit_usd
    target_tool: set_program_credit_ceiling_aca954d3
    params:
      standard_review_months: 12
      strong_record_step: 0.15
      sound_record_step: 0.08
      strong_record_payments: 8
      sound_record_payments: 4
      severe_arrears_cut: 0.25
      mild_arrears_cut: 0.10
      major_portfolio_step: 0.12
      minor_portfolio_step: 0.05
      major_portfolio_price: 20000
      high_volume_allowance: 15000
      standard_volume_allowance: 7500
      high_volume_calls: 12
      high_volume_emergencies: 2
      standard_volume_calls: 6
      thousand: 1000
    rule: >
      The open balance ceiling written on a rate program at review is worked out from the account's own
      record of demand service work and payment over a review window, and it replaces the ceiling the
      program carried.
      The record is read over the last twelve months. Where the program has run less than a full term
      and dispatch privileges have been restored during it, the record is read from the day they were
      restored, counting each month or part month up to the day of the review; where the program has run
      less than a full term and privileges have not been restored during it, the record is read from the
      day the current term started, counting each month or part month up to the day of the review.
      The starting ceiling is the tier's published credit limit. Where the charges that fell due in the
      window stand above half the tier's published credit limit but not above it, the starting ceiling is
      that invoiced total rounded up to the next whole thousand; where they stand at or below half the
      tier's published credit limit, the starting ceiling is half that published credit limit.
      No step is added for the account's payment record. Where the payments received in the window number
      at least the strong record payment count of this policy and the most recent invoice to fall due
      has stood past its due day no longer than the tier's suspension period, the strong record step of
      this policy is added; where they number at least the sound record payment count of this policy and
      the most recent invoice to fall due has stood past its due day no longer than the tier's suspension
      period, the sound record step of this policy is added.
      Nothing is cut for arrears. Where the most recent invoice to fall due has stood past its due day
      longer than the tier's suspension period and what the window invoiced less what it received stands
      above the tier's published credit limit, the severe arrears cut of this policy is taken off; where
      the most recent invoice to fall due stands past its due day, two or more invoices fell due in the
      window and the payments received in it do not clear what it invoiced, the mild arrears cut of this
      policy is taken off.
      No step is added for the owner's other accounts with the company. Where the owner holds an active
      preventive maintenance agreement whose annual price stands at or above the major portfolio price of
      this policy and the installments that fell due on it in the last twelve months are cleared by the
      payments received on it, the major portfolio step of this policy is added; where the owner holds an
      active preventive maintenance agreement whose installments in that period are cleared, the minor
      portfolio step of this policy is added.
      No allowance is added for the account's call volume. Where the calls dispatched in the window
      number at least the high volume call count of this policy and the emergency dispatches counted in
      it number at least the high volume emergency count of this policy, the high volume allowance of
      this policy is added; where the calls dispatched in the window number at least the standard volume
      call count of this policy, the standard volume allowance of this policy is added.
      The ceiling is the starting ceiling multiplied once by one plus the payment record step plus the
      portfolio step less the arrears cut, the three steps being combined into a single factor and never
      applied one after another, with the volume allowance added to that product afterwards rather than
      multiplied by it, and only the total is rounded, to the nearest cent, half up.
    prerequisite: []
    cross_category:
      - category: maintenance
        as: history
        reads: [status, annual_price_usd, maintenance_events.amount_usd, maintenance_events.due_date, maintenance_events.received_date]
        note: >-
          Decides the tier of the step added for the owner's other accounts: the annual price of the
          customer's active preventive maintenance agreement and whether that account's installments in
          the last twelve months are cleared by its payments.
    compute:
      - term_months_run: "MONTHS(F('term_start_date'), NOW)"
      - review_months: "(MONTHS(F('reinstatement_date'), NOW) + 1) if (term_months_run < P('term_months') and F('reinstatement_date') != '') else ((term_months_run + 1) if term_months_run < P('term_months') else K('standard_review_months'))"
      - invoiced_in_window: "SUM('service_events','amount_usd', within_months=review_months, date_field='due_date', event_type='service_invoice_charged')"
      - base_ceiling: "((0 - ((0 - invoiced_in_window) // K('thousand'))) * K('thousand')) if (invoiced_in_window > P('credit_limit_usd') / 2 and invoiced_in_window <= P('credit_limit_usd')) else ((P('credit_limit_usd') / 2) if invoiced_in_window <= P('credit_limit_usd') / 2 else P('credit_limit_usd'))"
      - payments_in_window: "SUM('service_events','amount_usd', within_months=review_months, date_field='received_date', event_type='service_payment_received')"
      - payment_count: "COUNT('service_events', within_months=review_months, date_field='received_date', event_type='service_payment_received')"
      - days_past_due: "DAYS(LATEST('service_events','due_date', date_field='due_date', event_type='service_invoice_charged'), NOW)"
      - payment_record_step: "K('strong_record_step') if (payment_count >= K('strong_record_payments') and days_past_due <= P('suspension_after_days_past_due')) else (K('sound_record_step') if (payment_count >= K('sound_record_payments') and days_past_due <= P('suspension_after_days_past_due')) else 0.0)"
      - invoice_count_in_window: "COUNT('service_events', within_months=review_months, date_field='due_date', event_type='service_invoice_charged')"
      - arrears_cut: "K('severe_arrears_cut') if (days_past_due > P('suspension_after_days_past_due') and (invoiced_in_window - payments_in_window) > P('credit_limit_usd')) else (K('mild_arrears_cut') if (days_past_due > 0 and invoice_count_in_window >= 2 and payments_in_window < invoiced_in_window) else 0.0)"
      - holds_agreement: "EXISTS('maintenance', status='active')"
      - agreement_price: "CFIELD('maintenance','annual_price_usd', status='active')"
      - mx_installments: "XSUM('maintenance','maintenance_events','amount_usd', within_months=K('standard_review_months'), date_field='due_date', event_type='maintenance_installment_charged')"
      - mx_payments: "XSUM('maintenance','maintenance_events','amount_usd', within_months=K('standard_review_months'), date_field='received_date', event_type='maintenance_payment_received')"
      - portfolio_step: "K('major_portfolio_step') if (holds_agreement == True and (agreement_price or 0) >= K('major_portfolio_price') and mx_payments >= mx_installments) else (K('minor_portfolio_step') if (holds_agreement == True and mx_payments >= mx_installments) else 0.0)"
      - calls_dispatched: "COUNT('service_events', within_months=review_months, date_field='dispatch_timestamp', event_type='service_call_dispatched')"
      - emergency_counted: "COUNT('service_events', within_months=review_months, date_field='used_date', event_type='service_emergency_call_used')"
      - volume_allowance: "K('high_volume_allowance') if (calls_dispatched >= K('high_volume_calls') and emergency_counted >= K('high_volume_emergencies')) else (K('standard_volume_allowance') if calls_dispatched >= K('standard_volume_calls') else 0.0)"
      - result: "RND(base_ceiling * (1 + payment_record_step + portfolio_step - arrears_cut) + volume_allowance, 2)"
    compute_basis:
      term_months_run: "Where the program has run less than a full term and dispatch privileges have been restored during it, the record is read from the day they were restored, counting each month or part month up to the day of the review; where the program has run less than a full term and privileges have not been restored during it, the record is read from the day the current term started, counting each month or part month up to the day of the review."
      review_months: "The record is read over the last twelve months. Where the program has run less than a full term and dispatch privileges have been restored during it, the record is read from the day they were restored, counting each month or part month up to the day of the review; where the program has run less than a full term and privileges have not been restored during it, the record is read from the day the current term started, counting each month or part month up to the day of the review."
      invoiced_in_window: "Where the charges that fell due in the window stand above half the tier's published credit limit but not above it, the starting ceiling is that invoiced total rounded up to the next whole thousand; where they stand at or below half the tier's published credit limit, the starting ceiling is half that published credit limit."
      base_ceiling: "The starting ceiling is the tier's published credit limit. Where the charges that fell due in the window stand above half the tier's published credit limit but not above it, the starting ceiling is that invoiced total rounded up to the next whole thousand; where they stand at or below half the tier's published credit limit, the starting ceiling is half that published credit limit."
      payments_in_window: "where the most recent invoice to fall due stands past its due day, two or more invoices fell due in the window and the payments received in it do not clear what it invoiced, the mild arrears cut of this policy is taken off"
      payment_count: "Where the payments received in the window number at least the strong record payment count of this policy and the most recent invoice to fall due has stood past its due day no longer than the tier's suspension period, the strong record step of this policy is added; where they number at least the sound record payment count of this policy and the most recent invoice to fall due has stood past its due day no longer than the tier's suspension period, the sound record step of this policy is added."
      days_past_due: "Where the most recent invoice to fall due has stood past its due day longer than the tier's suspension period and what the window invoiced less what it received stands above the tier's published credit limit, the severe arrears cut of this policy is taken off"
      payment_record_step: "No step is added for the account's payment record. Where the payments received in the window number at least the strong record payment count of this policy and the most recent invoice to fall due has stood past its due day no longer than the tier's suspension period, the strong record step of this policy is added; where they number at least the sound record payment count of this policy and the most recent invoice to fall due has stood past its due day no longer than the tier's suspension period, the sound record step of this policy is added."
      invoice_count_in_window: "where the most recent invoice to fall due stands past its due day, two or more invoices fell due in the window and the payments received in it do not clear what it invoiced, the mild arrears cut of this policy is taken off"
      arrears_cut: "Nothing is cut for arrears. Where the most recent invoice to fall due has stood past its due day longer than the tier's suspension period and what the window invoiced less what it received stands above the tier's published credit limit, the severe arrears cut of this policy is taken off; where the most recent invoice to fall due stands past its due day, two or more invoices fell due in the window and the payments received in it do not clear what it invoiced, the mild arrears cut of this policy is taken off."
      holds_agreement: "Where the owner holds an active preventive maintenance agreement whose annual price stands at or above the major portfolio price of this policy and the installments that fell due on it in the last twelve months are cleared by the payments received on it, the major portfolio step of this policy is added; where the owner holds an active preventive maintenance agreement whose installments in that period are cleared, the minor portfolio step of this policy is added."
      agreement_price: "Where the owner holds an active preventive maintenance agreement whose annual price stands at or above the major portfolio price of this policy and the installments that fell due on it in the last twelve months are cleared by the payments received on it, the major portfolio step of this policy is added"
      mx_installments: "the installments that fell due on it in the last twelve months are cleared by the payments received on it"
      mx_payments: "the installments that fell due on it in the last twelve months are cleared by the payments received on it"
      portfolio_step: "No step is added for the owner's other accounts with the company. Where the owner holds an active preventive maintenance agreement whose annual price stands at or above the major portfolio price of this policy and the installments that fell due on it in the last twelve months are cleared by the payments received on it, the major portfolio step of this policy is added; where the owner holds an active preventive maintenance agreement whose installments in that period are cleared, the minor portfolio step of this policy is added."
      calls_dispatched: "Where the calls dispatched in the window number at least the high volume call count of this policy and the emergency dispatches counted in it number at least the high volume emergency count of this policy, the high volume allowance of this policy is added; where the calls dispatched in the window number at least the standard volume call count of this policy, the standard volume allowance of this policy is added."
      emergency_counted: "Where the calls dispatched in the window number at least the high volume call count of this policy and the emergency dispatches counted in it number at least the high volume emergency count of this policy, the high volume allowance of this policy is added"
      volume_allowance: "No allowance is added for the account's call volume. Where the calls dispatched in the window number at least the high volume call count of this policy and the emergency dispatches counted in it number at least the high volume emergency count of this policy, the high volume allowance of this policy is added; where the calls dispatched in the window number at least the standard volume call count of this policy, the standard volume allowance of this policy is added."
      result: "The ceiling is the starting ceiling multiplied once by one plus the payment record step plus the portfolio step less the arrears cut, the three steps being combined into a single factor and never applied one after another, with the volume allowance added to that product afterwards rather than multiplied by it, and only the total is rounded, to the nearest cent, half up."
    factors:
      - id: review_window
        effect: method
        decides: review_months
        bindings: [term_months_run, review_months]
        ladder:
          - when: "the program has run less than a full term and dispatch privileges have been restored during it"
            method: "the record is read from the day they were restored, counting each month or part month up to the day of the review"
          - when: "the program has run less than a full term and privileges have not been restored during it"
            method: "the record is read from the day the current term started, counting each month or part month up to the day of the review"
          - when: "otherwise"
            method: "the record is read over the last twelve months"
        baseline:
          review_months: "K('standard_review_months')"
        evidence: [date]
        cross_difficulty: null
      - id: starting_ceiling
        effect: method
        decides: base_ceiling
        bindings: [invoiced_in_window, base_ceiling]
        ladder:
          - when: "the charges that fell due in the window stand above half the tier's published credit limit but not above it"
            method: "the starting ceiling is that invoiced total rounded up to the next whole thousand"
          - when: "the charges that fell due in the window stand at or below half the tier's published credit limit"
            method: "the starting ceiling is half that published credit limit"
          - when: "otherwise"
            method: "the starting ceiling is the tier's published credit limit"
        baseline:
          base_ceiling: "P('credit_limit_usd')"
        evidence: [history]
        cross_difficulty: null
      - id: payment_record
        effect: parameter
        decides: payment_record_step
        bindings: [payments_in_window, payment_count, days_past_due, payment_record_step]
        ladder:
          - when: "the payments received in the window number at least the strong record payment count of this policy and the most recent invoice to fall due has stood past its due day no longer than the tier's suspension period"
            value: "K('strong_record_step')"
          - when: "the payments received in the window number at least the sound record payment count of this policy and the most recent invoice to fall due has stood past its due day no longer than the tier's suspension period"
            value: "K('sound_record_step')"
          - when: "otherwise"
            value: "no step is added for the account's payment record"
        baseline:
          payment_record_step: "0.0"
        evidence: [history, date]
        cross_difficulty: null
      - id: arrears_position
        effect: parameter
        decides: arrears_cut
        bindings: [invoice_count_in_window, arrears_cut]
        ladder:
          - when: "the most recent invoice to fall due has stood past its due day longer than the tier's suspension period and what the window invoiced less what it received stands above the tier's published credit limit"
            value: "K('severe_arrears_cut')"
          - when: "the most recent invoice to fall due stands past its due day, two or more invoices fell due in the window and the payments received in it do not clear what it invoiced"
            value: "K('mild_arrears_cut')"
          - when: "otherwise"
            value: "nothing is cut for arrears"
        baseline:
          arrears_cut: "0.0"
        evidence: [history]
        cross_difficulty: null
      - id: portfolio_position
        effect: parameter
        decides: portfolio_step
        bindings: [holds_agreement, agreement_price, mx_installments, mx_payments, portfolio_step]
        ladder:
          - when: "the owner holds an active preventive maintenance agreement whose annual price stands at or above the major portfolio price of this policy and the installments that fell due on it in the last twelve months are cleared by the payments received on it"
            value: "K('major_portfolio_step')"
          - when: "the owner holds an active preventive maintenance agreement whose installments in that period are cleared"
            value: "K('minor_portfolio_step')"
          - when: "otherwise"
            value: "no step is added for the owner's other accounts"
        baseline:
          portfolio_step: "0.0"
        evidence: [cross_category, history]
        cross_difficulty: maintenance
      - id: call_volume_allowance
        effect: parameter
        decides: volume_allowance
        bindings: [calls_dispatched, emergency_counted, volume_allowance]
        ladder:
          - when: "the calls dispatched in the window number at least the high volume call count of this policy and the emergency dispatches counted in it number at least the high volume emergency count of this policy"
            value: "K('high_volume_allowance')"
          - when: "the calls dispatched in the window number at least the standard volume call count of this policy"
            value: "K('standard_volume_allowance')"
          - when: "otherwise"
            value: "no allowance is added for the account's call volume"
        baseline:
          volume_allowance: "0.0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The open balance ceiling written on a rate program at review is worked out from the account's own
        record of demand service work and payment over a review window, and it replaces the ceiling the
        program carried. The record is read over the last twelve months. The starting ceiling is the
        tier's published credit limit. No step is added for the account's payment record. Nothing is cut
        for arrears. No step is added for the owner's other accounts with the company. No allowance is
        added for the account's call volume. The ceiling is the starting ceiling multiplied once by one
        plus the payment record step plus the portfolio step less the arrears cut, the three steps being
        combined into a single factor and never applied one after another, with the volume allowance
        added to that product afterwards rather than multiplied by it, and only the total is rounded, to
        the nearest cent, half up.
      params: [credit_limit_usd, standard_review_months]
    inputs:
      history:
        - {table: service_events, aggregate: sum, field: amount_usd, within_months: 10, filters: {event_type: service_invoice_charged}}
        - {table: service_events, aggregate: count, field: null, within_months: 10, filters: {event_type: service_payment_received}}
        - {table: service_events, aggregate: count, field: null, within_months: 10, filters: {event_type: service_call_dispatched}}
        - {category: maintenance, table: maintenance_events, aggregate: sum, field: amount_usd, within_months: 12, filters: {event_type: maintenance_installment_charged}}
      cross_category: [maintenance]
  - id: service_ext_prepaid_block_purchase_price
    base_policy_refs: [service_block_hour_drawdown]
    overwrite:
      - base_policy: service_block_hour_drawdown
        superseded_clause: >-
          Where the tier sells blocks, prepaid hours are bought in multiples of the tier's minimum
          purchase at the tier's block rate, and they are drawn down by the labor hours of each completed
          call, oldest block first.
        replaced_by: >-
          Where the shortfall stands above one of the tier's minimum purchase multiples, as many whole
          multiples are sold as it takes to cover the shortfall, rounded up; where there is no shortfall at
          all, no multiple is sold.
    trigger: on_request
    subject: [service_block_hours_purchased]
    computes: purchase_amount_usd
    target_tool: purchase_hour_block_a465dc68
    params:
      standard_year_months: 12
      one_multiple: 1
      bulk_multiples: 4
      stepped_multiples: 2
      bulk_share: 0.94
      volume_share: 0.97
      strict_release_pct: 3.0
      standard_release_pct: 1.5
      clear_account_discount: 2.0
      good_payer_discount: 1.0
      ledger_window_months: 12
    rule: >
      The price of a block of prepaid hours is worked out from the size of the block the account's own
      drawing record calls for, the rate that block is sold at, the discount the account's settlement
      record carries and any office release charge the purchase attracts. A block of prepaid hours is
      priced only once the credit ceiling standing on the rate program carries a change dated in the
      current program year. The current program year runs from the day the current term started to the
      day of the purchase.
      The hours drawn are read over the last twelve months. Where the tier lets unused hours roll into
      the next program year and the program has run less than a full term, the hours drawn are read over
      the tier's block expiry period; where the tier lets no unused hours roll over, the hours drawn are
      read from the day the current term started, counting each month or part month up to the day of the
      purchase. The prepaid hours standing are the hours of every block bought within the tier's expiry
      period less the hours drawn over the window read, never below nil, and the shortfall is the hours
      drawn over that window less the prepaid hours standing, never below nil.
      A block of prepaid hours is sold as a single one of the tier's minimum purchase multiples. Where the
      shortfall stands above one of the tier's minimum purchase multiples, as many whole multiples are
      sold as it takes to cover the shortfall, rounded up; where there is no shortfall at all, no
      multiple is sold. The hours sold are the multiples sold multiplied by the tier's minimum purchase.
      The whole block is priced at the tier's block hour rate. Where the multiples sold stand at or above
      the stepped multiple count of this policy and the owner holds an active preventive maintenance
      agreement, the rate the block steps to is the tier's block hour rate at the bulk share of this
      policy; where the multiples sold stand at or above that count and the owner holds no active
      preventive maintenance agreement, the rate the block steps to is the tier's block hour rate at the
      volume share of this policy. Where the multiples sold stand at or above the bulk multiple count of
      this policy and unexpired blocks already stand on the program, the block is priced multiple by
      multiple, the first multiple at the tier's block hour rate and each further multiple at the rate
      the block steps to; where two or three multiples are sold, the whole block is priced at the rate
      the block steps to.
      No discount comes off for the account's settlement record. Where the payments received in the
      ledger window of this policy cover what was invoiced in it and no open position stands on the
      program, the clear account discount of this policy comes off; where those payments cover what was
      invoiced in it and an open position does stand, the good payer discount of this policy comes off.
      No office release charge is added. The open position is everything invoiced on the program over
      its whole life less every payment received on it over its whole life, without any window. The
      headroom is the credit ceiling standing on the rate program less the open position, and the excess
      is the block price less that headroom, never below nil. Where the block price carries the open
      position past the credit ceiling standing on the program and the most recent invoice to fall due
      stands past its due day, the office release charge runs at the strict release rate of this policy
      on the excess; where the block price carries it past that ceiling and the most recent invoice to
      fall due does not stand past its due day, the office release charge runs at the standard release
      rate of this policy on the excess.
      The price is the block price less the discount, which is worked out on the block price alone and
      never on the price after the office release charge is added, with the office release charge added
      afterwards, and only the total is rounded, to the nearest cent, half up.
    prerequisite:
      - problem: service_ext_credit_ceiling_review
        kind: value_input
        gate: ceiling_headroom
        form: state
        policy_source: >-
          A block of prepaid hours is priced only once the credit ceiling standing on the rate program
          carries a change dated in the current program year.
        condition: >-
          The rate program's most recent term change is a change of the credit ceiling and its date falls
          in the current program year.
        resolved_by: set_program_credit_ceiling_aca954d3
        effect: >-
          The headroom the office release charge is measured against stops being the ceiling the program
          carried from its last review and becomes the ceiling the account's current record carries.
    cross_category:
      - category: maintenance
        as: existence
        reads: [status]
        note: >-
          Decides the tier of the rate the block steps to: whether an active preventive maintenance
          agreement stands on the account alongside the rate program.
    compute:
      - term_months_run: "MONTHS(F('term_start_date'), NOW)"
      - drawn_window_months: "P('block_hour_expiry_months') if (P('block_rollover_allowed') == True and term_months_run < P('term_months')) else ((term_months_run + 1) if P('block_rollover_allowed') != True else K('standard_year_months'))"
      - blocks_bought: "SUM('service_events','block_hours', within_months=P('block_hour_expiry_months'), date_field='purchased_date', event_type='service_block_hours_purchased')"
      - hours_drawn: "SUM('service_events','labor_hours', within_months=drawn_window_months, date_field='completed_date', event_type='service_call_completed')"
      - balance_now: "MX(0, blocks_bought - hours_drawn)"
      - shortfall: "MX(0, hours_drawn - balance_now)"
      - multiples: "(0 - ((0 - shortfall) // P('block_min_purchase_hours'))) if shortfall > P('block_min_purchase_hours') else (0 if shortfall <= 0 else K('one_multiple'))"
      - hours_sold: "multiples * P('block_min_purchase_hours')"
      - holds_agreement: "EXISTS('maintenance', status='active')"
      - stepped_rate: "P('block_hour_rate_usd') * K('bulk_share') if (multiples >= K('stepped_multiples') and holds_agreement == True) else (P('block_hour_rate_usd') * K('volume_share') if (multiples >= K('stepped_multiples') and holds_agreement != True) else P('block_hour_rate_usd'))"
      - block_price: "(P('block_min_purchase_hours') * P('block_hour_rate_usd') + (multiples - 1) * P('block_min_purchase_hours') * stepped_rate) if (multiples >= K('bulk_multiples') and blocks_bought > 0) else ((hours_sold * stepped_rate) if (multiples >= 2 and multiples < K('bulk_multiples')) else hours_sold * P('block_hour_rate_usd'))"
      - invoiced_all: "SUM('service_events','amount_usd', event_type='service_invoice_charged')"
      - paid_all: "SUM('service_events','amount_usd', event_type='service_payment_received')"
      - open_position: "invoiced_all - paid_all"
      - ceiling_headroom: "F('credit_limit_usd') - open_position"
      - excess: "MX(0, block_price - ceiling_headroom)"
      - days_past_due: "DAYS(LATEST('service_events','due_date', date_field='due_date', event_type='service_invoice_charged'), NOW)"
      - release_rate: "K('strict_release_pct') if (excess > 0 and days_past_due > 0) else (K('standard_release_pct') if (excess > 0 and days_past_due <= 0) else 0.0)"
      - release_charge: "excess * release_rate / 100"
      - invoiced_in_window: "SUM('service_events','amount_usd', within_months=K('ledger_window_months'), date_field='due_date', event_type='service_invoice_charged')"
      - payments_in_window: "SUM('service_events','amount_usd', within_months=K('ledger_window_months'), date_field='received_date', event_type='service_payment_received')"
      - settlement_discount_pct: "K('clear_account_discount') if (payments_in_window >= invoiced_in_window and open_position <= 0) else (K('good_payer_discount') if (payments_in_window >= invoiced_in_window and open_position > 0) else 0.0)"
      - result: "RND(block_price - block_price * settlement_discount_pct / 100 + release_charge, 2)"
    compute_basis:
      term_months_run: "Where the tier lets unused hours roll into the next program year and the program has run less than a full term, the hours drawn are read over the tier's block expiry period; where the tier lets no unused hours roll over, the hours drawn are read from the day the current term started, counting each month or part month up to the day of the purchase."
      drawn_window_months: "The hours drawn are read over the last twelve months. Where the tier lets unused hours roll into the next program year and the program has run less than a full term, the hours drawn are read over the tier's block expiry period; where the tier lets no unused hours roll over, the hours drawn are read from the day the current term started, counting each month or part month up to the day of the purchase."
