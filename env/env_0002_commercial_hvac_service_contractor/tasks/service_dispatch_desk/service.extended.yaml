        terms_days: =payment_terms_days
        late_fee_pct: =late_fee_pct_per_month
        po_required: =po_required
  formula:
    late_fee_usd: round(amount_usd * late_fee_pct_per_month / 100, 2)
- id: service_suspension_and_reinstatement
  subject:
  - service_program_suspended
  - service_program_reinstated
  rule: Dispatch privileges are withdrawn once an invoice stays unpaid beyond the tier's suspension period
    counted from the day the invoice fell due, counting calendar days with the due day excluded and the
    final day included, or as soon as the open balance passes the tier's credit limit, whichever happens
    first. A suspended program keeps its block hours and its emergency allowance; nothing is forfeited
    by the suspension itself. Privileges are restored when the arrears are settled in full and the tier's
    reinstatement fee is charged, and the term is not extended by the days lost. A program that has already
    lapsed at its term end may be restarted at the same rates only inside the tier's restart window counted
    forward in calendar days from the term end date, the end day excluded and the final day included;
    past that window a fresh enrollment at current rates is needed.
  eligibility:
  - id: arrears_beyond_suspension_period
    applies_to:
    - service_program_suspended
    kind: time
    condition: Dispatch privileges are withdrawn once an invoice stays unpaid beyond the tier's suspension
      period counted from the day the invoice fell due, counting calendar days with the due day excluded
      and the final day included, or as soon as the open balance passes the tier's credit limit, whichever
      happens first.
    evidence_fields:
    - service_events.due_date
    - service_events.invoice_ref
    - service_events.amount_usd
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - service_events.invoice_ref
      action_bindings:
        service_events.invoice_ref: invoice_ref
    temporal_basis:
      clock: frozen_time
      anchor_event: the day the invoice fell due
      anchor_source: service_events.due_date
      relation: not_before
      duration_source: variants.suspension_after_days_past_due
      unit: calendar_days
      counting_rule: counting calendar days with the due day excluded and the final day included
      boundary: inclusive
  - id: restart_inside_window
    applies_to:
    - service_program_reinstated
    kind: time
    condition: A program that has already lapsed at its term end may be restarted at the same rates only
      inside the tier's restart window counted forward in calendar days from the term end date, the end
      day excluded and the final day included; past that window a fresh enrollment at current rates is
      needed.
    evidence_fields:
    - service_programs.term_end_date
    - service_programs.program_id
    - service_programs.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - service_programs.program_id
      action_bindings:
        service_programs.program_id: program_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the term end date
      anchor_source: service_programs.term_end_date
      relation: not_after
      duration_source: variants.restart_window_days
      unit: calendar_days
      counting_rule: counted forward in calendar days from the term end date, the end day excluded and
        the final day included
      boundary: inclusive
  params:
    per_tier:
      Time & Material Account:
        suspension_days: =suspension_after_days_past_due
        credit_limit_usd: =credit_limit_usd
        reinstatement_fee_usd: =reinstatement_fee_usd
        restart_days: =restart_window_days
      Priority Response Program:
        suspension_days: =suspension_after_days_past_due
        credit_limit_usd: =credit_limit_usd
        reinstatement_fee_usd: =reinstatement_fee_usd
        restart_days: =restart_window_days
      Block Hour Service Program:
        suspension_days: =suspension_after_days_past_due
        credit_limit_usd: =credit_limit_usd
        reinstatement_fee_usd: =reinstatement_fee_usd
        restart_days: =restart_window_days
      Emergency Response Program:
        suspension_days: =suspension_after_days_past_due
        credit_limit_usd: =credit_limit_usd
        reinstatement_fee_usd: =reinstatement_fee_usd
        restart_days: =restart_window_days
      Critical Facility Response Program:
