      - id: block_size_sold
        effect: method
        decides: multiples
        bindings: [hours_drawn, balance_now, shortfall, multiples]
        ladder:
          - when: "the shortfall stands above one of the tier's minimum purchase multiples"
            method: "as many whole multiples are sold as it takes to cover the shortfall, rounded up"
          - when: "there is no shortfall at all"
            method: "no multiple is sold"
          - when: "otherwise"
            method: "a block of prepaid hours is sold as a single one of the tier's minimum purchase multiples"
        baseline:
          multiples: "K('one_multiple')"
        evidence: [history]
        cross_difficulty: null
      - id: drawing_record_window
        effect: method
        decides: drawn_window_months
        bindings: [term_months_run, drawn_window_months]
        ladder:
          - when: "the tier lets unused hours roll into the next program year and the program has run less than a full term"
            method: "the hours drawn are read over the tier's block expiry period"
          - when: "the tier lets no unused hours roll over"
            method: "the hours drawn are read from the day the current term started, counting each month or part month up to the day of the purchase"
          - when: "otherwise"
            method: "the hours drawn are read over the last twelve months"
        baseline:
          drawn_window_months: "K('standard_year_months')"
        evidence: [date]
        cross_difficulty: null
      - id: stepped_block_rate
        effect: parameter
        decides: stepped_rate
        bindings: [holds_agreement, stepped_rate]
        ladder:
          - when: "the multiples sold stand at or above the stepped multiple count of this policy and the owner holds an active preventive maintenance agreement"
            value: "P('block_hour_rate_usd') at K('bulk_share')"
          - when: "the multiples sold stand at or above that count and the owner holds no active preventive maintenance agreement"
            value: "P('block_hour_rate_usd') at K('volume_share')"
          - when: "otherwise"
            value: "P('block_hour_rate_usd')"
        baseline:
          stepped_rate: "P('block_hour_rate_usd')"
        evidence: [cross_category]
        cross_difficulty: maintenance
      - id: price_basis
        effect: method
        decides: block_price
        bindings: [blocks_bought, hours_sold, block_price]
        ladder:
          - when: "the multiples sold stand at or above the bulk multiple count of this policy and unexpired blocks already stand on the program"
            method: "the block is priced multiple by multiple, the first multiple at the tier's block hour rate and each further multiple at the rate the block steps to"
          - when: "two or three multiples are sold"
            method: "the whole block is priced at the rate the block steps to"
          - when: "otherwise"
            method: "the whole block is priced at the tier's block hour rate"
        baseline:
          block_price: "hours_sold * P('block_hour_rate_usd')"
        evidence: [history]
        cross_difficulty: null
      - id: office_release_rate
        effect: parameter
        decides: release_rate
        bindings: [days_past_due, release_rate]
        ladder:
          - when: "the block price carries the open position past the credit ceiling standing on the program and the most recent invoice to fall due stands past its due day"
            value: "K('strict_release_pct')"
          - when: "the block price carries it past that ceiling and the most recent invoice to fall due does not stand past its due day"
            value: "K('standard_release_pct')"
          - when: "otherwise"
            value: "no office release charge is added"
        baseline:
          release_rate: "0.0"
        evidence: [date, history]
        cross_difficulty: null
      - id: settlement_record_discount
        effect: parameter
        decides: settlement_discount_pct
        bindings: [invoiced_in_window, payments_in_window, settlement_discount_pct]
        ladder:
          - when: "the payments received in the ledger window of this policy cover what was invoiced in it and no open position stands on the program"
            value: "K('clear_account_discount')"
          - when: "those payments cover what was invoiced in it and an open position does stand"
            value: "K('good_payer_discount')"
          - when: "otherwise"
            value: "no discount comes off for the account's settlement record"
        baseline:
          settlement_discount_pct: "0.0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The price of a block of prepaid hours is worked out from the size of the block the account's own
        drawing record calls for, the rate that block is sold at, the discount the account's settlement
        record carries and any office release charge the purchase attracts. The hours drawn are read over
        the last twelve months. The prepaid hours standing are the hours of every block bought within the
        tier's expiry period less the hours drawn over the window read, never below nil, and the
        shortfall is the hours drawn over that window less the prepaid hours standing, never below nil.
        A block of prepaid hours is sold as a single one of the tier's minimum purchase multiples. The hours sold
        are the multiples sold multiplied by the tier's minimum purchase. The whole block is priced at
        the tier's block hour rate. No discount comes off for the account's settlement record. No office
        release charge is added. The open position is everything invoiced on the program over its whole
        life less every payment received on it over its whole life, without any window. The headroom is
        the credit ceiling standing on the rate program less the open position, and the excess is the
        block price less that headroom, never below nil. The price
        is the block price less the discount, which is worked out on the block price alone and never on
        the price after the office release charge is added, with the office release charge added
        afterwards, and only the total is rounded, to the nearest cent, half up.
      params: [block_hour_rate_usd, block_min_purchase_hours, standard_year_months, one_multiple]
    inputs:
      history:
        - {table: service_events, aggregate: sum, field: labor_hours, within_months: 18, filters: {event_type: service_call_completed}}
        - {table: service_events, aggregate: sum, field: block_hours, within_months: 18, filters: {event_type: service_block_hours_purchased}}
        - {table: service_events, aggregate: sum, field: amount_usd, within_months: null, filters: {event_type: service_invoice_charged}}
      cross_category: [maintenance]
