  - id: service_ext_missed_response_credit
    base_policy_refs: [service_response_guarantee_credit]
    overwrite:
      - base_policy: service_response_guarantee_credit
        superseded_clause: >-
          The credit is the tier's credit rate applied to the labor charge of that call, capped at the
          tier's ceiling for one missed response, and it is applied to the invoice the call was billed on.
        replaced_by: >-
          The credit is the labor element and the attendance element added together, taken at the credit
          rate for each hundred, multiplied by the uplift, rounded to the nearest cent, half up, and it is
          never more than the tier's ceiling for one missed response.
    trigger: state_due
    subject: [service_credit_issued]
    computes: credit_amount_usd
    target_tool: credit_missed_response_9859bc76
    params:
      severe_miss_multiple: 1.5
      lesser_miss_share: 0.5
      third_miss_uplift: 1.25
      second_miss_uplift: 1.1
      single_miss_uplift: 1.0
    rule: >
      The credit for a missed response is worked out from the charges the call it arises from carries
      and the tier's credit rate. The call the credit arises from is the call last completed on the rate
      program. The credit for a missed response is worked out only once the labor
      charge for the call it arises from stands invoiced on the demand service account.
      The labor element is the hours the ticket logs for that call valued at the tier's block hour rate.
      Where a demand service charge line of the labor kind stands on the rate program for that call, the
      labor element is that line; where no such line stands and the tier sells no prepaid hours at all,
      the labor element is nil.
      The attendance element is the tier's trip charge. Where the owner holds an active preventive
      maintenance agreement at a tier that waives the trip charge on demand calls, no attendance element
      enters the credit; where the owner holds an active preventive maintenance agreement at a tier whose
      published trip charge is lower than the tier's own trip charge, that published trip charge is the
      attendance element.
      The tier's credit rate applies. Where the call the credit arises from was accepted at emergency or
      critical priority and the technician reached the building on a later calendar day than the day the
      call was accepted, the tier's credit rate is taken at the severe miss multiple of this policy;
      where the call was accepted at routine or priority and the technician reached the building on a
      later calendar day than the day the call was accepted, the tier's credit rate is taken at the
      lesser miss share of this policy.
      No uplift is applied for earlier missed responses. Where three or more calls completed in the
      current program year carry a response recorded as missed, the third miss uplift of this policy is
      applied; where exactly two such calls stand in the current program year, the second miss uplift of
      this policy is applied. The current program year runs from the day the current term started to the
      day the credit is issued.
      The credit is the labor element and the attendance element added together, taken at the credit rate
      for each hundred, multiplied by the uplift, rounded to the nearest cent, half up, and it is never
      more than the tier's ceiling for one missed response. The ceiling is compared with the rounded
      figure, so the ceiling applies last of all.
    prerequisite:
      - problem: service_ext_completed_call_labor_charge
        kind: value_input
        gate: labor_element
        form: state
        policy_source: >-
          The credit for a missed response is worked out only once the labor charge for the call it
          arises from stands invoiced on the demand service account.
        condition: >-
          A demand service charge line of the labor kind stands on the rate program for the call the
          credit arises from.
        resolved_by: charge_demand_labor_invoice_877d69f1
        effect: >-
          The labor element stops being the call's logged hours valued at the tier's block hour rate and
          becomes the labor charge line standing on the rate program.
    cross_category:
      - category: maintenance
        as: branch
        reads: [status, trip_charge_waived, trip_charge_usd]
        note: >-
          Decides the tier of the attendance element: whether the customer's active preventive
          maintenance agreement waives the trip charge on demand calls or publishes a lower one than this
          program's tier.
    compute:
      - latest_labor_line: "LATEST('service_events','amount_usd', date_field='billing_period', event_type='service_invoice_charged', charge_type='labor')"
      - call_logged_hours: "LATEST('service_events','labor_hours', date_field='completed_date', event_type='service_call_completed')"
      - labor_element: "(latest_labor_line or 0) if ((latest_labor_line or 0) > 0) else (0.0 if ((latest_labor_line or 0) <= 0 and P('block_hours_purchased') <= 0) else call_logged_hours * P('block_hour_rate_usd'))"
      - holds_agreement: "EXISTS('maintenance', status='active')"
      - mx_trip_waived: "CPARAM('maintenance','trip_charge_waived', status='active')"
      - mx_trip_charge: "CPARAM('maintenance','trip_charge_usd', status='active')"
      - attendance_charge: "0.0 if (holds_agreement == True and mx_trip_waived == True) else (mx_trip_charge if (holds_agreement == True and (mx_trip_charge or 0) > 0 and (mx_trip_charge or 0) < P('trip_charge_usd')) else P('trip_charge_usd'))"
      - miss_priority: "LATEST('service_events','call_priority', date_field='dispatch_timestamp', event_type='service_call_dispatched')"
      - dispatch_day: "LATEST('service_events','dispatch_timestamp', date_field='dispatch_timestamp', event_type='service_call_dispatched')"
      - arrival_day: "LATEST('service_events','onsite_timestamp', date_field='completed_date', event_type='service_call_completed')"
      - days_to_arrival: "DAYS(dispatch_day, arrival_day)"
      - credit_rate_pct: "P('sla_credit_pct') * K('severe_miss_multiple') if ((miss_priority == 'emergency' or miss_priority == 'critical') and days_to_arrival >= 1) else (P('sla_credit_pct') * K('lesser_miss_share') if ((miss_priority == 'routine' or miss_priority == 'priority') and days_to_arrival >= 1) else P('sla_credit_pct'))"
      - missed_calls_in_year: "COUNT('service_events', within_months=MONTHS(F('term_start_date'), NOW) + 1, date_field='completed_date', event_type='service_call_completed', sla_met='missed')"
      - repeat_uplift: "K('third_miss_uplift') if missed_calls_in_year >= 3 else (K('second_miss_uplift') if missed_calls_in_year == 2 else K('single_miss_uplift'))"
      - result: "MN(RND((labor_element + attendance_charge) * credit_rate_pct / 100 * repeat_uplift, 2), P('sla_credit_cap_usd'))"
    compute_basis:
