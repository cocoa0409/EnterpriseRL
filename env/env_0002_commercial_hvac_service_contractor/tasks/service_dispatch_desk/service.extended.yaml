      arrears_handling_charge_usd: 40
      one_month: 1
    rule: >
      The late fee for demand service arrears is raised once for the billing month as a single line on
      the rate program, and it runs on what was invoiced on the program with a due day falling in the
      twelve months to the day the fee is raised, rather than on each invoice separately. Charges the
      office has raised but not yet dated for payment do not enter it, and neither do payments received
      outside that window.
      The whole of that invoiced total is the amount the fee runs on. Where payments received in the
      window stand at or above that invoiced total, nothing stands to be charged and the amount the fee
      runs on is nil; where payments received in the window stand above nil but below that invoiced
      total, the amount the fee runs on is what is left of the invoiced total after those payments.
      The rate is the tier's own late fee rate for each month or part month. Where the most recent
      invoice to fall due has stood past its due day longer than the tier's suspension period and the
      open position stands above the tier's credit limit, the arrears rate of this policy is the rate;
      where the most recent invoice to fall due has stood past its due day longer than the tier's
      payment term and the open position stands at or below the tier's credit limit, the extended
      arrears rate of this policy is the rate. The open position is the invoiced total in the window less
      the payments received in it.
      No step is applied to that rate for the owner's other accounts with the company. Where the owner
      holds an active preventive maintenance agreement and the installments that fell due on it in the
      same window are not cleared by the payments received on it, the cross arrears step of this policy
      is added to the monthly rate; where the owner holds an active preventive maintenance agreement and
      the installments that fell due on it in that window are cleared, the covered account step of this
      policy is taken off the monthly rate.
      One month is charged. Where the most recent payment on the account reached the office later than
      the day the most recent invoice fell due and the payments in the window do not clear the invoiced
      total, the months run from the day of that payment, counting each month or part month up to the
      day the fee is raised; where no payment has reached the office since the most recent invoice fell
      due and that invoice has stood past its due day longer than the tier's payment term, the months run
      from the day it fell due, counting each month or part month up to the day the fee is raised.
      No arrears handling charge is added. Where two or more invoices fell due within the window, the
      payments received in it leave part of the invoiced total standing and the open position stands
      above the tier's credit limit, twice the arrears handling charge of this policy is added; where two
      or more invoices fell due within the window and the payments received in it leave part of the
      invoiced total standing, the arrears handling charge of this policy is added.
      The fee is the amount the fee runs on multiplied by the monthly rate, which is the rate together
      with the step applied for the owner's other accounts, and then by the number of months charged;
      the arrears handling charge is added to that product afterwards, and only the total is rounded, to
      the nearest cent, half up. The late fee line is raised without a due day, and it is dated for
      payment when the billing month's invoice is issued.
    prerequisite: []
    cross_category:
      - category: maintenance
        as: history
        reads: [status, maintenance_events.amount_usd, maintenance_events.due_date, maintenance_events.received_date]
        note: >-
          Decides the tier of the step applied for the owner's other accounts: whether the installments
          that fell due on the customer's active preventive maintenance agreement in the same window are
          cleared by the payments received on it.
    compute:
      - overdue_invoiced: "SUM('service_events','amount_usd', within_months=K('fee_window_months'), date_field='due_date', event_type='service_invoice_charged')"
      - payments_in_window: "SUM('service_events','amount_usd', within_months=K('fee_window_months'), date_field='received_date', event_type='service_payment_received')"
      - fee_base: "0.0 if (payments_in_window > 0 and payments_in_window >= overdue_invoiced) else ((overdue_invoiced - payments_in_window) if (payments_in_window > 0 and payments_in_window < overdue_invoiced) else overdue_invoiced)"
      - last_payment_date: "LATEST('service_events','received_date', date_field='received_date', event_type='service_payment_received')"
      - last_due_date: "LATEST('service_events','due_date', date_field='due_date', event_type='service_invoice_charged')"
      - months_charged: "MONTHS(last_payment_date, NOW) + 1 if (last_payment_date > last_due_date and payments_in_window < overdue_invoiced) else (MONTHS(last_due_date, NOW) + 1 if (last_payment_date <= last_due_date and DAYS(last_due_date, NOW) > P('payment_terms_days')) else K('one_month'))"
      - days_past_due: "DAYS(last_due_date, NOW)"
      - open_position: "overdue_invoiced - payments_in_window"
      - fee_rate_pct: "K('arrears_rate_pct') if (days_past_due > P('suspension_after_days_past_due') and open_position > P('credit_limit_usd')) else (K('extended_arrears_rate_pct') if (days_past_due > P('payment_terms_days') and open_position <= P('credit_limit_usd')) else P('late_fee_pct_per_month'))"
      - holds_agreement: "EXISTS('maintenance', status='active')"
      - mx_installments: "XSUM('maintenance','maintenance_events','amount_usd', within_months=K('fee_window_months'), date_field='due_date', event_type='maintenance_installment_charged')"
      - mx_payments: "XSUM('maintenance','maintenance_events','amount_usd', within_months=K('fee_window_months'), date_field='received_date', event_type='maintenance_payment_received')"
      - cross_account_step: "K('cross_arrears_step_pct') if (holds_agreement == True and mx_payments < mx_installments) else ((0 - K('covered_account_step_pct')) if (holds_agreement == True and mx_payments >= mx_installments) else 0.0)"
      - unpaid_invoice_count: "COUNT('service_events', within_months=K('fee_window_months'), date_field='due_date', event_type='service_invoice_charged')"
      - handling_charge: "K('arrears_handling_charge_usd') * 2 if (unpaid_invoice_count >= 2 and fee_base > 0 and open_position > P('credit_limit_usd')) else (K('arrears_handling_charge_usd') if (unpaid_invoice_count >= 2 and fee_base > 0) else 0.0)"
      - result: "RND(fee_base * (fee_rate_pct + cross_account_step) / 100 * months_charged + handling_charge, 2)"
    compute_basis:
