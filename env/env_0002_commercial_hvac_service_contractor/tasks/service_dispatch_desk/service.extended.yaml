- id: service_response_guarantee_credit
  subject:
  - service_credit_issued
  rule: Where a technician reaches the building later than the guarantee the call's classification carries,
    the customer is credited. The guarantee is met when the technician is on site no later than the response
    hours of that classification counted in elapsed hours from the moment the call was accepted, counting
    whole and part hours alike and running through nights, weekends and holidays without pause. The credit
    is the tier's credit rate applied to the labor charge of that call, capped at the tier's ceiling for
    one missed response, and it is applied to the invoice the call was billed on. No credit is due where
    the building denied access, where the caller was not reachable to let the technician in, or where
    the call was held because the account stood over its credit limit. A tier whose credit rate is zero
    owes no credit at all, and the correct answer to such a caller is that the tier carries no response
    guarantee, not a goodwill payment.
  eligibility:
  - id: response_guarantee_breached
    applies_to:
    - service_credit_issued
    kind: time
    condition: The guarantee is met when the technician is on site no later than the response hours of
      that classification counted in elapsed hours from the moment the call was accepted, counting whole
      and part hours alike and running through nights, weekends and holidays without pause.
    evidence_fields:
    - service_events.dispatch_timestamp
    - service_events.onsite_timestamp
    - service_events.work_order_ref
    - service_events.call_priority
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - service_events.work_order_ref
      action_bindings:
        service_events.work_order_ref: work_order_ref
    temporal_basis:
      clock: frozen_time
      anchor_event: the moment the call was accepted
      anchor_source: service_events.dispatch_timestamp
      relation: not_after
      duration_source: variants.emergency_response_hours
      unit: elapsed_hours
      counting_rule: counting whole and part hours alike and running through nights, weekends and holidays
        without pause
      boundary: inclusive
  params:
    per_tier:
      Time & Material Account:
        credit_pct: =sla_credit_pct
        cap_usd: =sla_credit_cap_usd
      Priority Response Program:
        credit_pct: =sla_credit_pct
        cap_usd: =sla_credit_cap_usd
      Block Hour Service Program:
        credit_pct: =sla_credit_pct
        cap_usd: =sla_credit_cap_usd
      Emergency Response Program:
        credit_pct: =sla_credit_pct
        cap_usd: =sla_credit_cap_usd
      Critical Facility Response Program:
        credit_pct: =sla_credit_pct
        cap_usd: =sla_credit_cap_usd
      Dedicated Technician Program:
        credit_pct: =sla_credit_pct
        cap_usd: =sla_credit_cap_usd
  formula:
    amount_usd: min(sla_credit_cap_usd, round(amount_usd * sla_credit_pct / 100, 2))
- id: service_callback_warranty
  subject:
  - service_call_completed
  rule: A return trip for the same fault on the same unit inside the tier's callback window is a callback
    and not a new call. The window is counted in calendar days from the day the original repair was completed,
    the completion day excluded and the final day included, and the return call must name the original
    work order for the callback to stand. Where the tier carries free callback labor, no labor, trip charge
    or diagnostic fee is billed on the callback, while parts that failed for a reason outside the original
    repair are billed normally. A return trip for a different fault, or for the same fault on a different
    unit, is a new call at full rates however soon it follows. A callback does not consume an emergency
    call from the allowance and does not draw block hours.
  eligibility:
  - id: callback_inside_window
    applies_to:
    - service_call_completed
    kind: time
    condition: The window is counted in calendar days from the day the original repair was completed,
      the completion day excluded and the final day included, and the return call must name the original
      work order for the callback to stand.
    evidence_fields:
    - service_events.completed_date
    - service_events.work_order_ref
    - service_events.callback_of_work_order_ref
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - service_events.callback_of_work_order_ref
      action_bindings:
        service_events.callback_of_work_order_ref: callback_of_work_order_ref
    temporal_basis:
      clock: frozen_time
      anchor_event: the day the original repair was completed
      anchor_source: service_events.completed_date
      relation: not_after
      duration_source: variants.callback_window_days
      unit: calendar_days
      counting_rule: counted in calendar days from the day the original repair was completed, the completion
        day excluded and the final day included
      boundary: inclusive
  measures:
  - service_msr_callbacks_in_window
  params:
    per_tier:
      Time & Material Account:
        window_days: =callback_window_days
        labor_free: =callback_labor_free
      Priority Response Program:
        window_days: =callback_window_days
        labor_free: =callback_labor_free
      Block Hour Service Program:
        window_days: =callback_window_days
        labor_free: =callback_labor_free
      Emergency Response Program:
        window_days: =callback_window_days
        labor_free: =callback_labor_free
      Critical Facility Response Program:
        window_days: =callback_window_days
        labor_free: =callback_labor_free
      Dedicated Technician Program:
        window_days: =callback_window_days
        labor_free: =callback_labor_free
- id: service_billing_and_late_fee
  subject:
  - service_invoice_charged
  - service_payment_received
  rule: Demand work is invoiced per work order once the call is closed, with labor, trip, diagnostic,
    parts and refrigerant on separate lines so the owner can see what each part of the call cost. The
    invoice falls due the tier's payment term after the invoice date, counted in calendar days with the
    invoice day excluded and the due day included, and the account's own credit terms apply only where
    the program has no term of its own. An invoice unpaid past its due day carries the tier's late fee
    on the unpaid amount for each month or part month it stays unpaid. Payments are applied to the oldest
    unpaid invoice first unless the owner directs the payment to a named invoice, and where a purchase
    order number is required under the tier, an invoice issued without it is reissued rather than treated
    as overdue.
  eligibility: []
  params:
    per_tier:
      Time & Material Account:
        terms_days: =payment_terms_days
        late_fee_pct: =late_fee_pct_per_month
        po_required: =po_required
      Priority Response Program:
        terms_days: =payment_terms_days
        late_fee_pct: =late_fee_pct_per_month
        po_required: =po_required
      Block Hour Service Program:
        terms_days: =payment_terms_days
        late_fee_pct: =late_fee_pct_per_month
        po_required: =po_required
