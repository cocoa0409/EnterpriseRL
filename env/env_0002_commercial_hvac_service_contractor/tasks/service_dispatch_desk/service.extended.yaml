- id: service_renewal_and_cancellation
  subject:
  - service_renewal_window_opened
  - service_program_renewed
  - service_program_expired
  - service_program_cancelled
  rule: The renewal window opens the tier's renewal period before the term end date and the renewal rate
    sheet is sent. Where the tier renews automatically the term renews at the labor rate raised by the
    tier's escalation unless a non-renewal notice was received by the tier's notice deadline, counted
    back in calendar days from the term end date with the deadline day counting as timely. A renewal is
    recorded only when a renewal acceptance from the customer is on file for this program, and at the
    top tier, which does not renew automatically, no acceptance means the term simply ends. A customer
    may cancel before the term end on the tier's written notice period, and the tier's cancellation fee
    is charged with the final invoice; unexpired unused block hours are refunded at the tier's refund
    portion at the same time. A program that lapses at its term end is not cancelled and carries no cancellation
    fee. The notice period is counted in calendar days from the day the written notice was received, the
    notice day excluded and the final day included.
  eligibility:
  - id: renewal_acceptance_on_file
    applies_to:
    - service_program_renewed
    kind: authorization
    condition: A renewal is recorded only when a renewal acceptance from the customer is on file for this
      program, and at the top tier, which does not renew automatically, no acceptance means the term simply
      ends.
    evidence_fields:
    - service_requests.program_id
    - service_requests.request_type
    - service_requests.outcome
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - service_requests.program_id
      action_bindings:
        service_requests.program_id: program_id
  - id: cancellation_notice_period
    applies_to:
    - service_program_cancelled
    kind: time
    condition: A customer may cancel before the term end on the tier's written notice period, and the
      tier's cancellation fee is charged with the final invoice; unexpired unused block hours are refunded
      at the tier's refund portion at the same time.
    evidence_fields:
    - service_requests.notice_date
    - service_requests.program_id
    - service_requests.request_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - service_requests.program_id
      action_bindings:
        service_requests.program_id: program_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the tier's written notice period
      anchor_source: service_requests.notice_date
      relation: not_before
      duration_source: variants.cancellation_notice_days
      unit: calendar_days
      counting_rule: counted in calendar days from the day the written notice was received, the notice
