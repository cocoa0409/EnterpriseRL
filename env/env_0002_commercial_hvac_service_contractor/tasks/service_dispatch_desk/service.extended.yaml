        diag_usd: =diagnostic_fee_usd
  formula:
    labor_charge_usd: round(max(minimum_billable_hours, labor_hours) * regular_labor_rate_usd * after_hours_rate_multiplier
      + trip_charge_usd, 2)
- id: service_block_hour_drawdown
  subject:
  - service_block_hours_purchased
  - service_call_completed
  rule: Where the tier sells blocks, prepaid hours are bought in multiples of the tier's minimum purchase
    at the tier's block rate, and they are drawn down by the labor hours of each completed call, oldest
    block first. Hours are drawn at their face value whatever band the work fell in, so an after-hours
    call draws the hours worked and the after-hours premium alone is invoiced. Once the remaining block
    reaches zero the further hours of that call and of every later call are billed at the tier's overage
    rate until a new block is bought. Unused hours expire at the tier's expiry period counted forward
    in whole calendar months from the day the block was bought, and expired hours are neither refunded
    nor restored. Where the tier allows rollover, hours unexpired at renewal carry into the next program
    year; where it does not, they are forfeited at the year end. On cancellation the tier's refund portion
    of the unexpired unused hours is refunded at the rate they were bought at, never at the current rate.
  eligibility:
  - id: block_purchase_order_on_file
    applies_to:
    - service_block_hours_purchased
    kind: authorization
    condition: Where the tier sells blocks, prepaid hours are bought in multiples of the tier's minimum
      purchase at the tier's block rate, and they are drawn down by the labor hours of each completed
      call, oldest block first.
    evidence_fields:
    - service_requests.program_id
    - service_requests.request_type
    - service_requests.outcome
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - service_requests.program_id
      action_bindings:
        service_requests.program_id: program_id
  measures:
  - service_msr_block_hours_drawn
  params:
    per_tier:
      Time & Material Account:
        block_rate_usd: =block_hour_rate_usd
        min_hours: =block_min_purchase_hours
        expiry_months: =block_hour_expiry_months
        overage_usd: =block_overage_rate_usd
        rollover: =block_rollover_allowed
        refund_pct: =unused_block_refund_pct
      Priority Response Program:
        block_rate_usd: =block_hour_rate_usd
        min_hours: =block_min_purchase_hours
        expiry_months: =block_hour_expiry_months
        overage_usd: =block_overage_rate_usd
        rollover: =block_rollover_allowed
        refund_pct: =unused_block_refund_pct
      Block Hour Service Program:
        block_rate_usd: =block_hour_rate_usd
        min_hours: =block_min_purchase_hours
        expiry_months: =block_hour_expiry_months
        overage_usd: =block_overage_rate_usd
        rollover: =block_rollover_allowed
