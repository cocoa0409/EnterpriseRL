    factors:
      - id: arrears_monthly_rate
        effect: parameter
        decides: fee_rate_pct
        bindings: [days_past_due, open_position, fee_rate_pct]
        ladder:
          - when: "the most recent invoice to fall due has stood past its due day longer than the tier's suspension period and the open position stands above the tier's credit limit"
            value: "K('arrears_rate_pct')"
          - when: "the most recent invoice to fall due has stood past its due day longer than the tier's payment term and the open position stands at or below the tier's credit limit"
            value: "K('extended_arrears_rate_pct')"
          - when: "otherwise"
            value: "P('late_fee_pct_per_month')"
        baseline:
          fee_rate_pct: "P('late_fee_pct_per_month')"
        evidence: [date, history]
        cross_difficulty: null
      - id: months_the_fee_runs
        effect: method
        decides: months_charged
        bindings: [last_payment_date, last_due_date, months_charged]
        ladder:
          - when: "the most recent payment on the account reached the office later than the day the most recent invoice fell due and the payments in the window do not clear the invoiced total"
            method: "the months run from the day of that payment, counting each month or part month up to the day the fee is raised"
          - when: "no payment has reached the office since the most recent invoice fell due and that invoice has stood past its due day longer than the tier's payment term"
            method: "the months run from the day it fell due, counting each month or part month up to the day the fee is raised"
          - when: "otherwise"
            method: "one month is charged"
        baseline:
          months_charged: "K('one_month')"
        evidence: [history, date]
        cross_difficulty: null
      - id: amount_the_fee_runs_on
        effect: method
        decides: fee_base
        bindings: [overdue_invoiced, payments_in_window, fee_base]
        ladder:
          - when: "payments received in the window stand at or above the invoiced total that fell due in it"
            method: "nothing stands to be charged and the amount the fee runs on is nil"
          - when: "payments received in the window stand above nil but below that invoiced total"
            method: "the amount the fee runs on is what is left of the invoiced total after those payments"
          - when: "otherwise"
            method: "the whole of that invoiced total is the amount the fee runs on"
        baseline:
          fee_base: "overdue_invoiced"
        evidence: [history]
        cross_difficulty: null
      - id: other_account_step
        effect: parameter
        decides: cross_account_step
        bindings: [holds_agreement, mx_installments, mx_payments, cross_account_step]
        ladder:
          - when: "the owner holds an active preventive maintenance agreement and the installments that fell due on it in the same window are not cleared by the payments received on it"
            value: "K('cross_arrears_step_pct'), added to the monthly rate"
          - when: "the owner holds an active preventive maintenance agreement and the installments that fell due on it in that window are cleared"
            value: "K('covered_account_step_pct'), taken off the monthly rate"
