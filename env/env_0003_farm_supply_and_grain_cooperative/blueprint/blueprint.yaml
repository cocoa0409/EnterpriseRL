name: farm_supply_and_grain_cooperative
company: Prairie Ridge Cooperative Association

background: |
  Prairie Ridge Cooperative Association is a member-owned agricultural cooperative serving about four thousand
  farming operations across eleven counties of the upper Midwest, with five licensed grain facilities, an agronomy
  plant, a feed mill, a refined fuels depot and a fleet of application and delivery equipment. Members are farmers
  who own the cooperative, so every person who calls the member services desk is also a shareholder, and the tone of
  the desk is that of a neighbour with the books open rather than a vendor with a script. The cooperative takes in
  yellow corn, soybeans, hard red winter wheat, oats and grain sorghum at the Prairie Ridge Main Elevator, the
  Kellerton Rail Terminal, the Ash Grove Annex, the Bergen Siding Elevator and the Winnebago River Terminal, and it
  sells back to the same farms the seed, fertilizer, crop protection, fuel, feed and field work that grew the crop.
  Grain is sold to the cooperative under Grain Marketing Contracts, which run from a Spot Cash Delivery Ticket up
  through the Forward Cash Sale Contract, the Basis Fixed Contract, the Hedge-to-Arrive Contract, the Delayed Price
  Agreement, the Minimum Price Contract and the Managed Accumulator Program, each contract holding a commodity and a
  crop year and producing scale tickets, pricing confirmations, rolls, settlement statements and deductions as the
  season runs. Grain that is not sold outright is held under Grain Storage and Conditioning Agreements, which run
  from an Open Storage Account through the Grain Bank Deposit Account, the Commercial Warehouse Receipt Storage, the
  Seasonal Paid-Up Storage Agreement, the Conditioned Reserve Storage Agreement and the Identity Preserved
  Segregated Storage, and which book deposits, storage accruals, drying passes, shrink, grade discounts, handling
  and load-outs against the bushels on hand. Crop inputs are bought on Crop Input Purchasing Accounts, from the Cash
  Purchase Account through the Standard 30-Day Charge Account, the Seasonal Terms Crop Input Account, the Early Pay
  Prepay Program Account, the Full Acre Input Financing Account and the Precision Partner Input Program Account, each
  carrying its own limit, terms and prepay position and producing invoices, prepay bookings and drawdowns, payments,
  service charges and credit memos. Every member also holds an equity account under Membership and Patronage Equity,
  which ranges from the Associate Patron Account through the Class A Voting Membership, the Class B Preferred Equity
  Membership, the Retained Patronage Certificate Holding, the Age Retirement Equity Membership and the Estate
  Retirement Equity Holding, and which accrues qualifying business through the year, posts the board's allocation
  after the fiscal year closes on 31 August, and pays cash portions, retains and revolvements out of the member's
  equity. Fuel and propane come from Refined Fuels and Propane Accounts, which run from the Will-Call Propane
  Account through the Keep-Full Automatic Delivery Account, the Budget Payment Plan Account, the Contract Gallon
  Pre-Buy Account, the Bulk Farm Fuel Delivery Account and the Cardtrol Fleet Fueling Account, booking deliveries,
  contracted gallon drawdowns, tank and delivery fees, budget instalments and payments. Field work is sold under
  Custom Application and Field Services, from the Per-Acre Custom Application through the Season Commitment
  Application Plan, the Full-Service Agronomy Plan, the Variable Rate Prescription Plan, the Precision Partner
  Whole-Farm Plan and the Certified Anhydrous Application Plan, which produce work orders, completed passes, acre
  billing, reschedules, surcharges and credits. Livestock rations come from Feed and Animal Nutrition Programmes,
  running from the Bagged Feed Cash Account through the Bulk Delivered Feed Account, the Custom Mix Ration Program,
  the Contracted Ingredient Program, the Full Nutrition Partner Program and the Medicated Feed VFD Program, which
  book orders, mill deliveries, invoices, ration changes and credits. A typical caller is a row-crop operator of
  eight hundred to three thousand acres carrying several grain contracts across two crop years, bushels in store at
  more than one facility, an input account with a balance that peaks in June, a propane tank at the dryer and a
  voting membership with twelve years of retained equity behind it. Larger operations add a feed programme or a
  whole-farm application plan, and some of the oldest members hold nothing but a certificate account and a question
  about when their equity comes back. Calls arrive heaviest at harvest and again in the weeks after the board
  declares patronage, and almost every one of them reaches across two or three of these product lines at once.

logs:
  verification_log_table: identity_verifications
  handoff_log_table: agent_handoffs

difficulties:
  - name: grain_marketing_desk
    claim:
      categories: [grain]
      event_types: [grain_contract_opened, grain_contract_activated, grain_delivery_applied, grain_unpriced_position_booked, grain_price_set, grain_contract_rolled, grain_settlement_issued, grain_deduction_applied, grain_settlement_paid, grain_contract_amended, grain_delivery_completed, grain_contract_settled, grain_contract_cancelled, grain_contract_defaulted]
    summary: >
      The callers are farmers who have sold grain to the cooperative ahead of delivery and now want something done
      about it, and what makes the work hard is that the same words mean different things on different programmes.
      A member may be holding a Spot Cash Delivery Ticket alongside a Delayed Price Agreement and a Hedge-to-Arrive
      Contract for two crop years at once, with loads applied to some and sitting unpriced against others, so
      locating which contract a request actually concerns is the first real judgement rather than a formality. The
      settings that genuinely arise include a contract still in applied standing because the marketing agreement was
      never countersigned, a contract part way through delivery whose window is about to close, bushels standing
      unpriced past their free days on a programme whose carry charge and free period differ from the neighbouring
      one, a member at their open position ceiling asking for a further contract, and a member whose crop failed
      asking what walking away would cost. The records involved are the contract itself with its programme, status,
      commodity, crop year, bushels committed and still owed, futures month and basis and delivery window, the grain
      ledger with its scale tickets and grade readings, pricing confirmations, roll confirmations, settlement
      statements, deduction lines and payments, and the pricing instructions the member has lodged with the grain
      desk. Eligibility turns on recorded facts and not on what the caller remembers: whether the master marketing
      agreement and the credit review are on file before a contract is opened under grain_agg_multi_holding, whether
      the contract stands in a state that admits the write under grain_evt_delivery_application, whether a signed
      instruction has been registered before bushels are priced, rolled or bought out under
      grain_evt_pricing_execution, grain_roll_handling and grain_buyout, and whether an amendment is still inside its
      window under grain_amendment. The quantitative work is per programme throughout, since shrink and grade
      discounts under grain_evt_delivery_application and grain_evt_quality_discount, delayed price carry under
      grain_dp_service_charge, roll charges under grain_roll_handling, settlement minimums and lead times under
      grain_evt_settlement, statutory withholdings under grain_evt_checkoff_and_retain and buyout arithmetic under
      grain_buyout all read a different column for each of the seven programmes. The natural order of the domain is
      that a contract is written and countersigned, loads are applied against it, unpriced bushels are carried and
      later priced, priced bushels are drawn onto a settlement statement, deductions attach to that statement and
      payment follows; that ordering is background to the world and not a script for any particular call. The agent
      can look everything up, work out what is owed and record the service writes the desk performs, but anything
      that disposes of the member's own grain or money is the member's own act, so lodging a signed pricing
      instruction, a roll instruction or a buyout instruction is handed over to the customer rather than done for
      them. Genuinely uncovered ground includes a member who has no delivery history at all and therefore no
      production history average against which any forward contract can be measured, a request to price bushels that
      have already passed their maximum carry and been priced out by the elevator, a request for the cooperative to
      pay a member the favourable difference on a buyout when the market has fallen, and any request to reverse a
      settlement that has already been paid, and in each of those the only correct route is a POLICY_NOT_COVERED
      handoff.

  - name: grain_storage_desk
    claim:
      categories: [storage]
      event_types: [storage_agreement_opened, storage_agreement_activated, storage_deposit_recorded, storage_accrual_charged, storage_drying_charged, storage_shrink_taken, storage_quality_discount_applied, storage_handling_charged, storage_loadout_recorded, storage_charge_settled, storage_loadout_started, storage_billing_hold_set, storage_agreement_updated, storage_agreement_closed, storage_agreement_terminated]
    summary: >
      The callers are members with bushels sitting in the cooperative's bins who want to know what the storage bill
      says, want grain moved out, or want a receipt issued against it, and the difficulty is that six storage
      programmes bill on three different bases and guarantee three different grades. One member may hold an Open
      Storage Account for last year's corn at one facility, a Seasonal Paid-Up Storage Agreement for this year's at
      another, and an Identity Preserved Segregated Storage lot that cannot be commingled at all, and the free days,
      the escalation point and the load-out minimum differ on every one. Real settings include an agreement whose
      free days ran out mid-period so that only part of the time in store is chargeable, a paid-up agreement whose
      bushels stayed past the paid-up date and began billing at the ordinary rate, an agreement with bushels pledged
      against an outstanding warehouse receipt so that the free bushels are fewer than the bushels on hand, a
      disputed grade that has put billing on hold, and an agreement the elevator is moving to terminate for unpaid
      charges. The records are the storage agreement with its programme, status, commodity, crop year, facility,
      bushels on hand and pledged, storage start date, paid-through date, grade of record, receipt number and
      insurance position, the storage account rows carrying deposits, accruals, drying passes with their moisture
      readings, shrink, grade discounts, handling, load-outs and settlements, and the service requests the member has
      signed. Eligibility is recorded rather than asserted: whether the signed agreement and the insurance
      certificate are on file under storage_agg_multi_holding, whether the agreement stands in a state that admits a
      deposit under storage_evt_deposit or an update under storage_receipt_and_pledge, and whether a signed load-out
      request has been registered and its notice period has run under storage_loadout. The arithmetic is per
      programme and per basis, with free days, rate basis, period length, period minimum and escalation under
      storage_accrual_billing, points removed, pass minimums and handling shrink under storage_drying_and_shrink,
      grade guarantees and recheck fees under storage_quality_guarantee, elevation and segregation charges under
      storage_handling_and_conditioning_fees, load-out minimums, notice and truck fees under storage_loadout, and
      grace periods and late charges under storage_charge_settlement. The order the domain naturally runs in is that
      grain is deposited, storage accrues period by period while conditioning charges attach to the loads that needed
      them, charges are invoiced or drawn against grain proceeds, and bushels finally move out on a released order;
      that is background to the world rather than a sequence any one call must follow. The agent can read every
      record, compute what is owed and record the elevator's own writes, while a load-out, a transfer of stored
      bushels onto a marketing contract, a request to issue or cancel a warehouse receipt and an early termination
      are the member's own acts and are handed over to them. No policy settles a request to hold grain past the
      programme's maximum storage days, a request to release bushels pledged under a receipt held by a third-party
      lender, a claim for grain lost to a bin failure, or a request to price stored grain that sits on no marketing
      contract at all, and those go to a human representative as POLICY_NOT_COVERED.

  - name: crop_input_desk
    claim:
      categories: [agronomy]
      event_types: [agronomy_account_opened, agronomy_credit_review_completed, agronomy_invoice_issued, agronomy_discount_granted, agronomy_prepay_booked, agronomy_prepay_applied, agronomy_payment_posted, agronomy_finance_charge_assessed, agronomy_credit_memo_issued, agronomy_account_past_due_flagged, agronomy_account_suspended, agronomy_account_updated, agronomy_account_closed]
    summary: >
      The callers are members querying a seed, fertilizer or chemical invoice, asking for more credit before
      sidedress, wanting prepay money moved onto a different product, or trying to get buying reinstated after the
      account went past due, and the judgement is hard because each of the six purchasing programmes carries its own
      terms, discount stacking and suspension triggers. A member commonly holds two accounts at once, one for the
      season's buying and one for prepay, and the same discount behaves differently on each; adjacent programmes look
      almost identical while differing on whether a limit may be raised at the counter and on whether discounts stack
      or the best single one is taken. Settings that really occur include an invoice inside its early pay window on
      an account whose stacking basis makes the prepay discount the larger, a prepay booking made against fertilizer
      that the member now wants drawn against seed on a programme that does not allow the transfer, an account
      suspended on the balance threshold rather than the day count, an account whose credit review has gone stale so
      that no increase can be given, and a return offered after the seed cutoff. The records are the input account
      with its programme, status, limit, balance, prepay position, terms, credit standing, security interest and
      enrolled acres, the billing rows carrying invoices, discounts, prepay bookings and drawdowns, payments, service
      charges and credit memos, and the requests the member has lodged with the agronomy desk. Eligibility rests on
      system records rather than the caller's account of them, with the perfected security interest under
      agronomy_agg_multi_holding, the combined exposure and account state under agronomy_agg_exposure_across_accounts,
      the soil test behind a prescription product under agronomy_evt_invoicing, the registered prepay request under
      agronomy_prepay_program, the credit department's recorded reinstatement under agronomy_credit_standing and the
      recorded review behind a limit increase under agronomy_account_maintenance. The numbers are per programme,
      covering terms and delivery minimums under agronomy_evt_invoicing, discount rates, windows and stacking under
      agronomy_discount_schedule, booking windows, minimums, ceilings and forfeiture under agronomy_prepay_program,
      allocation order and minimum part payments under agronomy_payment_application, grace, monthly rates and floors
      under agronomy_finance_charge, return windows and restocking under agronomy_returns_and_credits, and past-due
      and suspension triggers under agronomy_credit_standing. The domain runs naturally from application through
      credit review to an active account, then invoices, discounts, payments and, where things go wrong, service
      charges, past-due flags and suspension, which is background rather than an ordering any call must observe. The
      agent may look up, compute and record the desk's service writes, while booking prepay, asking for a limit
      increase, returning product and closing the account are the member's own acts and are handed over. Nothing in
      the policies settles a request to refund prepay in cash, a request to waive a service charge as a goodwill
      gesture, a request to lift a suspension against a grain settlement that has not yet issued, or a return of bulk
      fertilizer already out of the plant, and those are POLICY_NOT_COVERED handoffs.

  - name: member_equity_desk
    claim:
      categories: [patronage]
      event_types: [patronage_membership_opened, patronage_membership_activated, patronage_units_accrued, patronage_allocation_posted, patronage_cash_paid, patronage_retain_withheld, patronage_equity_revolved, patronage_equity_transferred, patronage_allocation_adjusted, patronage_allocation_hold_set, patronage_revolvement_cycle_entered, patronage_membership_retired, patronage_membership_transferred, patronage_membership_updated]
    summary: >
      The callers are members asking why their patronage notice is smaller than they expected, when their retained
      equity comes back, whether they can have it early, or what an estate must do after a death, and the work is
      difficult because six membership classes split allocations differently, revolve on different cycles and allow
      quite different routes to early payment. A member may hold a Class A Voting Membership carrying this year's
      allocation and a Retained Patronage Certificate Holding carrying equity from a decade ago, with the revolvement
      order and the retirement discount differing between the two, and the qualifying business behind the allocation
      arrives from grain, inputs, fuel, feed and field work at five different rates. Genuine settings include a
      membership under an allocation hold while a volume dispute is worked, a member just short of their class's
      retirement age at the close of the fiscal year, an estate whose documentation has not been lodged, a class that
      has reached its maximum equity balance so that the equity portion is paid in cash instead, a nonqualified class
      where nothing is reported until the equity is actually paid, and a cash portion swallowed entirely by an offset
      against an overdue input account. The records are the membership with its class, status, equity and allocated
      equity balances, stock and voting position, joining date, last allocation year, revolvement eligibility year,
      year of birth, estate flag and tax election, the equity ledger carrying accrued units, posted allocations, cash
      payments, retains, revolvements, transfers and restatements, and the requests lodged with the equity desk.
      Eligibility is a matter of record, with the stock issue and years of membership under patronage_agg_multi_holding,
      the membership's state under patronage_allocation and patronage_membership_maintenance, the lodged estate
      documentation under patronage_retirement, the signed transfer instruction under patronage_equity_transfer and
      the restatement window under patronage_adjustment. The figures are per class, covering allocation rates per
      basis and the qualifying minimum under patronage_evt_unit_accrual, the cash and equity split, the allocation
      minimum, the reporting threshold and the notice period under patronage_allocation, payment minimums, methods
      and offsetting under patronage_cash_payment, retain rates and the streams they apply to under patronage_retain,
      cycle length, pool percentage and order under patronage_revolvement and patronage_agg_equity_across_classes, and
      retirement ages, discounts, instalments and notice periods under patronage_retirement. The domain runs from
      qualifying business accruing through the year, to the board declaring rates after the fiscal year ends, to
      allocations posted and split, to cash paid and equity retained, and finally to equity revolving out years
      later, which is background rather than a script. The agent may read, compute and record the desk's own writes,
      while asking for equity to be retired, signing equity over to a transferee, changing a tax election and lodging
      an estate application are acts only the member or their legal representative can perform and are handed over.
      Requests the policies cannot settle include shortening the revolvement cycle for hardship, buying a place at
      the front of the cycle, pledging equity as security for a loan, and disputing the rate the board declared
      rather than the volume behind it, and each of those is a POLICY_NOT_COVERED handoff.

  - name: energy_delivery_desk
    claim:
      categories: [energy]
      event_types: [energy_account_opened, energy_account_activated, energy_contract_gallons_booked, energy_delivery_made, energy_contract_gallons_drawn, energy_fee_charged, energy_budget_installment_billed, energy_payment_posted, energy_price_protection_credited, energy_seasonal_hold_set, energy_account_past_due_flagged, energy_account_updated, energy_account_closed, energy_tank_removed]
    summary: >
      The callers are members who want propane before the dryer runs out, want to know why a delivery was billed at
      the posted price when they thought they had contracted gallons left, want tank rent taken off, or want out of a
      budget plan, and the difficulty lies in six programmes that price gallons on three different bases and charge a
      different set of fees on the same stop. One farm often runs several energy accounts at once, a will-call tank
      at the house, a keep-full tank at the dryer and a bulk farm diesel account, and a booking made on one of them
      can never be drawn on another however plainly the member thinks of it as one fuel bill. Settings that genuinely
      arise include a pre-buy booking exhausted part way through a fill so that one ticket carries two prices, a tank
      rent charge on an account that fell just short of the waiver gallons, an account on seasonal hold whose member
      now wants a delivery, an account past due far enough that deliveries are held while the budget plan is still
      being billed, a tank that ran completely empty and needs a leak check before it can be refilled, and a price
      protection credit that is due only if the posted price closed below the floor. The records are the energy
      account with its programme, status, fuel, tank and ownership, route, contracted gallons and price, budget
      instalment, rent due date, keep-full enrolment, gallons still owed and balance, the account rows carrying
      bookings, deliveries with their meter and gauge readings, drawdowns, fees, budget instalments, payments and
      protection credits, and the requests lodged with the energy desk. Eligibility comes from records rather than
      assurances, with the recorded leak check under energy_agg_multi_holding, the account's state and the combined
      limit under energy_agg_across_accounts, the signed pre-buy booking under energy_contract_gallons_program, the
      grace period behind a late charge under energy_payments_and_arrears and the account's state under
      energy_account_maintenance. The numbers are per programme, covering trigger and fill-to percentages, notice and
      delivery minimums under energy_delivery_scheduling, pricing basis and margin under energy_pricing, booking
      windows, minimums, ceilings, expiry treatment and cancellation charges under energy_contract_gallons_program,
      tank rent, waiver gallons and the delivery fees under energy_fees, plan length, down payment and reconciliation
      under energy_budget_plan, terms, grace, late and service charges and delivery holds under
      energy_payments_and_arrears, and protection fees and floors under energy_price_protection. The domain runs from
      an account opened and a tank set, through bookings and deliveries, drawdowns, fees and instalments, to payments
      and, at the end, closure and tank removal, which is background to the world and not an order any call must
      follow. The agent may look up, compute and record the desk's writes, while booking contract gallons, enrolling
      in or leaving a budget plan, putting an account on seasonal hold, requesting a tank removal and closing the
      account are the member's own acts and are handed over to them. No policy decides whether to run fuel to a tank
      that is out in freezing weather while the account is on delivery hold, whether to release a member from a
      booking when the market has moved against them, whether to protect a member against the price rising, or how to
      settle a claim for equipment damaged by off-specification fuel, and those are POLICY_NOT_COVERED handoffs.
