events:
  - type: agronomy_account_opened
    target: agronomy_accounts
    mutation: create
    meaning: a member applies for a crop input purchasing account under one of the programmes and the account record is opened in applied standing
    grain: one row per crop input account applied for
    fields:
      account_id: internal reference of the account being opened
      customer_id: the member the account belongs to
      variant_name: the purchasing programme applied for
      status: lifecycle standing the account opens in, which is always applied
      account_number: the account number printed on invoices and statements
      credit_limit: the limit applied for, which is zero until credit sets one
      current_balance: money owed, which at opening is zero
      prepay_balance: prepay held, which at opening is zero
      terms_days: the payment terms the programme carries
      billing_cycle_day: the day of the month the statement closes
      opened_date: date the application was taken
      credit_status: the credit department's standing decision, which at opening is conditional
      lien_on_file: whether a perfected security interest is on file
      acres_enrolled: acres the member enrols under the account
    triggers: []

  - type: agronomy_credit_review_completed
    target: agronomy_accounts
    mutation: {transition: [{from: applied, to: under_credit_review}, {from: under_credit_review, to: active}, {from: under_credit_review, to: closed}]}
    meaning: the application goes to credit and comes back approved with a limit or declined
    grain: one row per step of the credit decision on the account
    fields:
      status: the standing the account moves to
      credit_limit: the limit credit approved
      credit_status: the credit department's decision
      credit_review_date: date the review completed
    triggers: []

  - type: agronomy_invoice_issued
    target: agronomy_invoices
    meaning: product leaves the plant against the account and an invoice is raised for it
    grain: one row per invoiced line of one delivery ticket
    distinguish_by: [invoice_number, product_name, delivery_ticket_number]
    fields:
      invoice_id: internal reference of the billing row
      account_id: the account billed
      customer_id: the member billed
      event_type: the event family this row records
      invoice_number: the invoice number raised
      invoice_date: the date the invoice was raised
      due_date: the last day payment is on time
      product_category: the input class billed
      product_name: the product as printed on the delivery ticket
      quantity: how much product the line bills
      unit_of_measure: the unit quantity and price are quoted in
      unit_price: the price per unit before discount
      extended_amount: quantity times unit price before discount
      amount: money owed on the line after discount
      delivery_ticket_number: the ticket the product left the plant on
      field_name: the field the product went to
      balance_after: the account balance immediately after the row posted
      posted_date: the date the row was posted to the account
    account: input_receivable
    direction: in
    triggers:
      - event: patronage:patronage_units_accrued
        map: {customer_id: customer_id, patronage_units: amount, allocation_basis: input_dollars, entry_date: invoice_date}

  - type: agronomy_discount_granted
    target: agronomy_invoices
    meaning: a discount is granted against an invoice and the amount owed on it comes down
    grain: one discount of one kind against one invoice
    distinguish_by: [invoice_number, discount_type]
    fields:
      invoice_id: internal reference of the billing row
      account_id: the account credited
      customer_id: the member credited
      event_type: the event family this row records
      invoice_number: the invoice the discount lands on
      discount_type: which discount was granted
      discount_amount: money taken off the extended amount
      amount: money taken off what is owed
      booking_reference: the prepay booking the discount came from, where it came from one
      posted_date: the date the row was posted to the account
      balance_after: the account balance immediately after the row posted
    account: input_receivable
    direction: out
    triggers: []

  - type: agronomy_prepay_booked
    target: agronomy_invoices
    meaning: a member pays money in ahead of the season and it is held to their credit against named product
    grain: one row per prepay booking taken
    distinguish_by: [booking_reference, posted_date]
    fields:
      invoice_id: internal reference of the billing row
      account_id: the account the prepay is held on
      customer_id: the member booking prepay
      event_type: the event family this row records
      booking_reference: the prepay booking number
      product_category: the input class the money is booked against
      product_name: the product the booking names
      quantity: how much product the booking reserves
      unit_of_measure: the unit the booking is quoted in
      unit_price: the price the booking locks
      amount: money taken in on the booking
      payment_reference: the remittance reference the money came in on
      payment_method: how the member paid the booking
      invoice_date: the date the booking was taken
      posted_date: the date the row was posted to the account
    account: prepay_credit
    direction: in
    triggers:
      - event: agronomy:agronomy_discount_granted
        map: {account_id: account_id, customer_id: customer_id, booking_reference: booking_reference, discount_type: prepay, posted_date: posted_date}

  - type: agronomy_prepay_applied
    target: agronomy_invoices
    meaning: prepay held to the member's credit is drawn down against an invoice as product is taken
    grain: one drawdown of prepay against one invoice
    distinguish_by: [invoice_number, booking_reference]
    fields:
      invoice_id: internal reference of the billing row
      account_id: the account drawn on
      customer_id: the member drawn on
      event_type: the event family this row records
      invoice_number: the invoice the prepay is applied to
      booking_reference: the prepay booking drawn against
      product_category: the input class drawn against
      amount: money drawn out of prepay
      payment_method: how the drawdown is recorded
      posted_date: the date the row was posted to the account
      balance_after: the account balance immediately after the row posted
    account: prepay_credit
    direction: out
    triggers: []

  - type: agronomy_payment_posted
    target: agronomy_invoices
    meaning: the member pays money against the account, whether by their own remittance or out of grain settlement proceeds
    grain: one payment applied to one invoice
    distinguish_by: [payment_reference, invoice_number]
    fields:
      invoice_id: internal reference of the billing row
      account_id: the account paid on
      customer_id: the member paying
      event_type: the event family this row records
      invoice_number: the invoice the payment is applied to
      payment_reference: the remittance reference of the payment
      payment_method: how the payment reached the cooperative
      amount: money applied on this row
      posted_date: the date the payment was posted to the account
      balance_after: the account balance immediately after the row posted
    account: input_receivable
    direction: out
    triggers: []

  - type: agronomy_finance_charge_assessed
    target: agronomy_invoices
    meaning: a service charge is assessed on a balance that has stayed unpaid beyond its grace period
    grain: one service charge for one statement month on one overdue invoice
    distinguish_by: [invoice_number, posted_date]
    fields:
      invoice_id: internal reference of the billing row
      account_id: the account charged
      customer_id: the member charged
      event_type: the event family this row records
      invoice_number: the overdue invoice the charge attaches to
      finance_charge_amount: the service charge assessed
      amount: money added to what is owed
      invoice_date: the date of the overdue invoice
      due_date: the due date the charge is counted from
      posted_date: the date the row was posted to the account
      balance_after: the account balance immediately after the row posted
    account: input_receivable
    direction: in
    triggers: []

  - type: agronomy_credit_memo_issued
    target: agronomy_invoices
    meaning: product comes back or a billing error is corrected and a credit is issued against the account
    grain: one credit memo against one invoice line
    distinguish_by: [invoice_number, product_name, posted_date]
    fields:
      invoice_id: internal reference of the billing row
      account_id: the account credited
      customer_id: the member credited
      event_type: the event family this row records
      invoice_number: the invoice the credit is written against
      product_category: the input class being credited
      product_name: the product coming back
      quantity: how much product is credited
      unit_of_measure: the unit the credit is quoted in
      unit_price: the price the credit is computed at
      extended_amount: the value credited before the restocking charge
      discount_amount: the restocking charge withheld from the credit
      amount: money credited to the account
      delivery_ticket_number: the ticket the product originally left on
      posted_date: the date the row was posted to the account
      balance_after: the account balance immediately after the row posted
    account: input_receivable
    direction: out
    triggers: []

  - type: agronomy_account_past_due_flagged
    target: agronomy_accounts
    mutation: {transition: [{from: active, to: past_due}, {from: past_due, to: active}]}
    meaning: the account is flagged past due when an invoice passes its due date, and comes back when the overdue balance is cleared
    grain: one row per change in the account's past-due standing
    fields:
      status: the standing the account moves to
      past_due_since: the date the oldest unpaid invoice went past its due date
      current_balance: the balance owed at the time of the change
    triggers: []

  - type: agronomy_account_suspended
    target: agronomy_accounts
    mutation: {transition: [{from: past_due, to: suspended}, {from: suspended, to: active}]}
    meaning: buying is stopped on an account that stays overdue, and reinstated when the member brings it back inside its terms
    grain: one row per suspension or reinstatement of buying on the account
    fields:
      status: the standing the account moves to
      credit_status: the credit department's decision behind the change
      current_balance: the balance owed at the time of the change
    triggers: []

  - type: agronomy_account_updated
    target: agronomy_accounts
    mutation: update
    meaning: the limit, the terms, the enrolled acres or the security position on a live account are rewritten
    grain: one row per recorded change to the account's own particulars
    fields:
      credit_limit: the revised limit
      terms_days: the revised payment terms
      acres_enrolled: the revised acres enrolled
      lien_on_file: whether a perfected security interest is now on file
      credit_status: the revised credit standing
      credit_review_date: the date of the review behind the change
      billing_cycle_day: the revised statement day
    triggers: []

  - type: agronomy_account_closed
    target: agronomy_accounts
    mutation: {transition: [{from: active, to: closed}, {from: suspended, to: closed}]}
    meaning: the account is closed, either at the member's request with nothing owing or by the cooperative writing it over to the credit department
    grain: one row per account closed
    fields:
      status: the standing the account moves to
      closed_date: the date the account closed
      current_balance: the balance owed when the account closed
      credit_status: the credit standing the account closed on
    triggers: []

measures:
  - id: agronomy_msr_season_input_spend
    window: the current crop year, which runs 1 September through 31 August
    measure: sum of amount over the member's agronomy_invoice_issued rows in that crop year across every input account they hold
  - id: agronomy_msr_prior_year_input_spend
    window: the crop year immediately before the current one
    measure: sum of amount over the member's agronomy_invoice_issued rows in that crop year across every input account they hold
  - id: agronomy_msr_days_past_due
    window: from the due date of the member's oldest unpaid invoice through the handling date, the due date counting as day zero
    measure: count of calendar days the oldest unpaid invoice has stood past its due date
  - id: agronomy_msr_combined_exposure
    window: every crop input account of the member that is not closed, taken as they stand on the handling date
    measure: sum of current_balance across those accounts less the sum of prepay_balance across them

policies:
  - id: agronomy_agg_multi_holding
    subject: [agronomy_account_opened]
    rule: >
      A member may carry at most two crop input accounts at once, counting every account that is not closed, because
      the cooperative underwrites the member rather than the account and two sets of books is as far as the credit
      department will follow one operation. The ordinary pairing is one charge or financing account for the season's
      buying and one prepay account for money paid in ahead, and a second charge account is not opened while a first
      one is live; a member who wants different terms has the existing account rewritten instead. A programme whose
      entry gate calls for a credit review is not opened until the credit department has recorded its decision on that
      member. A programme whose entry gate calls for a security interest is not opened until the perfected security
      interest covering the growing crop is recorded on file. Neither of those is taken from the member's account of
      what their lender has filed, however confident they sound. Where either is outstanding the application is taken
      and the account waits in applied or under credit review; the member buys for cash in the meantime.
    eligibility:
      - id: security_interest_recorded
        applies_to: [agronomy_account_opened]
        kind: authorization
        condition: A programme whose entry gate calls for a security interest is not opened until the perfected security interest covering the growing crop is recorded on file.
        evidence_fields: [agronomy_accounts.lien_on_file, agronomy_accounts.variant_name, agronomy_accounts.account_number]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [agronomy_accounts.account_number]
          action_bindings:
            agronomy_accounts.account_number: account_number
    params:
      max_per_customer: 2
      ordinary_pairing: [one_buying_account, one_prepay_account]

  - id: agronomy_agg_exposure_across_accounts
    subject: [agronomy_invoice_issued, agronomy_account_updated]
    rule: >
      Credit is measured across the member's whole input position rather than account by account. Combined exposure is
      what is owed on every input account of the member that is not closed, less the prepay held to their credit on
      those same accounts, and it is measured against the sum of the limits those accounts carry. Product is released
      against an account only where the combined exposure after the invoice would stay at or under the combined limit,
      so a member sitting at their ceiling on one account cannot be supplied by writing the ticket on the other. A
      member who also holds a live grain marketing contract for the current crop year on a programme the grain
      catalogue marks patronage-eligible carries a working allowance above their combined limit equal to the delivered
      value of the bushels still owed on those contracts, because that grain is coming to the cooperative and will
      settle here. That allowance falls away the moment the contract is cancelled, defaulted or fully settled, and it
      is never counted twice against two accounts. Where the exposure would be passed the desk releases what fits
      inside the ceiling, holds the balance and refers the member to credit; it never releases product over the ceiling
      and asks credit afterwards.
    eligibility:
      - id: account_live_for_release
        applies_to: [agronomy_invoice_issued]
        kind: state
        condition: Product is released against an account only where the combined exposure after the invoice would stay at or under the combined limit, so a member sitting at their ceiling on one account cannot be supplied by writing the ticket on the other.
        evidence_fields: [agronomy_accounts.status, agronomy_accounts.credit_limit, agronomy_accounts.current_balance, agronomy_accounts.account_number]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [agronomy_accounts.account_number]
          action_bindings:
            agronomy_accounts.account_number: account_number
        state_contract:
          field: agronomy_accounts.status
          allowed: [active, past_due]
    params:
      exposure_basis: sum_of_balances_less_sum_of_prepay
      grain_allowance_basis: delivered_value_of_open_bushels_on_patronage_eligible_contracts
    measures: [agronomy_msr_combined_exposure]

  - id: agronomy_evt_invoicing
    subject: [agronomy_invoice_issued]
    rule: >
      An invoice is raised when product physically leaves the plant, on the delivery ticket, and never when an order is
      merely written. The invoice date is the day of that delivery, and the due date is the invoice date plus the
      account's terms in calendar days, a payment landing on the due date itself still being on time. Where the terms
      day falls on a day the office is shut the due date moves to the next day the office is open, and where the terms
      carry past the end of a month onto a day that month does not have, the due date falls on the last day of that
      month. Product is priced at the list price in force on the day of delivery, except where the line draws against a
      prepay booking, which prices at the booked price however the list has moved. Cash programmes are paid for as the
      product leaves and carry no terms at all, so an invoice on a cash programme is raised and settled the same day.
      A delivery under the programme's minimum order carries the delivery minimum charge, and splitting one order
      across two fields or two days carries the split load charge, both of which are billed on the same invoice as the
      product rather than separately. Prescription products are not released at all on programmes that require a
      current soil test until one is on file.
    eligibility:
      - id: soil_test_before_prescription
        applies_to: [agronomy_invoice_issued]
        kind: authorization
        condition: Prescription products are not released at all on programmes that require a current soil test until one is on file.
        evidence_fields: [agronomy_orders.order_type, agronomy_orders.order_status, agronomy_orders.order_id, agronomy_accounts.variant_name]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [agronomy_orders.order_id]
          action_bindings:
            agronomy_orders.order_id: order_id
    params:
      pricing_basis: list_price_on_the_delivery_day_unless_drawn_from_prepay
      per_tier:
        Cash Purchase Account: {terms: "=terms_days", minimum_order_usd: "=delivery_minimum_order_usd", under_minimum_charge_usd: "=delivery_minimum_charge_usd", split_load_usd: "=split_load_fee_usd"}
        Standard 30-Day Charge Account: {terms: "=terms_days", minimum_order_usd: "=delivery_minimum_order_usd", under_minimum_charge_usd: "=delivery_minimum_charge_usd", split_load_usd: "=split_load_fee_usd"}
        Seasonal Terms Crop Input Account: {terms: "=terms_days", minimum_order_usd: "=delivery_minimum_order_usd", under_minimum_charge_usd: "=delivery_minimum_charge_usd", split_load_usd: "=split_load_fee_usd"}
        Early Pay Prepay Program Account: {terms: "=terms_days", minimum_order_usd: "=delivery_minimum_order_usd", under_minimum_charge_usd: "=delivery_minimum_charge_usd", split_load_usd: "=split_load_fee_usd"}
        Full Acre Input Financing Account: {terms: "=terms_days", minimum_order_usd: "=delivery_minimum_order_usd", under_minimum_charge_usd: "=delivery_minimum_charge_usd", split_load_usd: "=split_load_fee_usd"}
        Precision Partner Input Program Account: {terms: "=terms_days", minimum_order_usd: "=delivery_minimum_order_usd", under_minimum_charge_usd: "=delivery_minimum_charge_usd", split_load_usd: "=split_load_fee_usd"}
    formula:
      extended_amount: round(quantity * unit_price, 2)

  - id: agronomy_discount_schedule
    subject: [agronomy_discount_granted]
    rule: >
      Three discounts can land on a crop input invoice and the programme decides how they combine. The early pay
      discount is earned where the invoice is paid in full inside the early pay window, counted in whole calendar days
      from the invoice date, a payment on the final day of the window still earning it; a part payment earns nothing.
      The volume discount is earned on season input spend above the programme's volume threshold, the spend being the
      member's invoiced amount across every input account for the current crop year, and it is granted at the close of
      the season rather than invoice by invoice. The prepay discount is earned on money booked inside the prepay
      window and is granted when the booking is taken, not when the product is drawn. How they combine is fixed by the
      programme's stacking basis and never negotiated at the counter, and on a best-single basis the largest of the
      applicable discounts is granted and the others are not. A programme rebate, where the programme carries one, sits
      outside the stacking basis and is paid after the season on qualifying spend once the enrolled acres reach the
      rebate threshold. A discount a programme does not carry is not zero but simply not applicable, so it never
      appears on the invoice as a nil line.
    eligibility: []
    params:
      per_tier:
        Cash Purchase Account: {stacking: "=discount_stacking_basis", early_pay_pct: "=early_pay_discount_pct", early_pay_days: "=early_pay_discount_window_days", volume_pct: "=volume_discount_pct", volume_threshold_usd: "=volume_discount_threshold_usd", prepay_pct: "=prepay_discount_pct"}
        Standard 30-Day Charge Account: {stacking: "=discount_stacking_basis", early_pay_pct: "=early_pay_discount_pct", early_pay_days: "=early_pay_discount_window_days", volume_pct: "=volume_discount_pct", volume_threshold_usd: "=volume_discount_threshold_usd", prepay_pct: "=prepay_discount_pct"}
        Seasonal Terms Crop Input Account: {stacking: "=discount_stacking_basis", early_pay_pct: "=early_pay_discount_pct", early_pay_days: "=early_pay_discount_window_days", volume_pct: "=volume_discount_pct", volume_threshold_usd: "=volume_discount_threshold_usd", prepay_pct: "=prepay_discount_pct"}
        Early Pay Prepay Program Account: {stacking: "=discount_stacking_basis", early_pay_pct: "=early_pay_discount_pct", early_pay_days: "=early_pay_discount_window_days", volume_pct: "=volume_discount_pct", volume_threshold_usd: "=volume_discount_threshold_usd", prepay_pct: "=prepay_discount_pct"}
        Full Acre Input Financing Account: {stacking: "=discount_stacking_basis", early_pay_pct: "=early_pay_discount_pct", early_pay_days: "=early_pay_discount_window_days", volume_pct: "=volume_discount_pct", volume_threshold_usd: "=volume_discount_threshold_usd", prepay_pct: "=prepay_discount_pct"}
        Precision Partner Input Program Account: {stacking: "=discount_stacking_basis", early_pay_pct: "=early_pay_discount_pct", early_pay_days: "=early_pay_discount_window_days", volume_pct: "=volume_discount_pct", volume_threshold_usd: "=volume_discount_threshold_usd", prepay_pct: "=prepay_discount_pct"}
    formula:
      discount_amount: round(extended_amount * early_pay_discount_pct / 100, 2)
    measures: [agronomy_msr_season_input_spend]

  - id: agronomy_prepay_program
    subject: [agronomy_prepay_booked, agronomy_prepay_applied]
    rule: >
      Prepay is money the member pays in before the season against named product, and it is taken only inside the
      programme's booking window, which opens and closes on the month and day the catalogue fixes. A booking must reach
      the programme's minimum, and the member may book no more than the programme's ceiling as a share of their input
      spend in the crop year immediately before the current one, because prepay is a buying commitment and not a
      deposit account. The booking locks the price of the product it names, so the line drawn against it prices at the
      booked price however the list has moved by delivery. Prepay is drawn down against invoices as product is taken,
      oldest booking first, and on programmes that allow it money booked against one input class may be drawn against
      another, while on programmes that do not the booking is honoured only against what it named. Unapplied prepay is
      carried forward and is forfeited to the cooperative only once it has stood unapplied for the programme's
      forfeiture period counted from the close of the booking window it was taken in. Prepay is never refunded in cash
      on request, because the money bought product rather than credit; a member who will not use it may have it moved
      to another input class where the programme allows that, and where it does not, the request is one no policy
      settles.
    eligibility:
      - id: booking_window_open
        applies_to: [agronomy_prepay_booked]
        kind: authorization
        condition: Prepay is money the member pays in before the season against named product, and it is taken only inside the programme's booking window, which opens and closes on the month and day the catalogue fixes.
        evidence_fields: [agronomy_orders.order_type, agronomy_orders.order_status, agronomy_orders.order_id, agronomy_orders.requested_amount]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [agronomy_orders.order_id]
          action_bindings:
            agronomy_orders.order_id: order_id
    params:
      drawdown_order: oldest_booking_first
      per_tier:
        Cash Purchase Account: {window_open: "=prepay_booking_window_open_month_day", window_close: "=prepay_booking_window_close_month_day", minimum_usd: "=prepay_minimum_usd", ceiling_pct_of_prior_year: "=prepay_maximum_pct_of_prior_year", forfeit_after_months: "=prepay_forfeiture_after_months", transferable: "=prepay_transferable_between_categories"}
        Standard 30-Day Charge Account: {window_open: "=prepay_booking_window_open_month_day", window_close: "=prepay_booking_window_close_month_day", minimum_usd: "=prepay_minimum_usd", ceiling_pct_of_prior_year: "=prepay_maximum_pct_of_prior_year", forfeit_after_months: "=prepay_forfeiture_after_months", transferable: "=prepay_transferable_between_categories"}
        Seasonal Terms Crop Input Account: {window_open: "=prepay_booking_window_open_month_day", window_close: "=prepay_booking_window_close_month_day", minimum_usd: "=prepay_minimum_usd", ceiling_pct_of_prior_year: "=prepay_maximum_pct_of_prior_year", forfeit_after_months: "=prepay_forfeiture_after_months", transferable: "=prepay_transferable_between_categories"}
        Early Pay Prepay Program Account: {window_open: "=prepay_booking_window_open_month_day", window_close: "=prepay_booking_window_close_month_day", minimum_usd: "=prepay_minimum_usd", ceiling_pct_of_prior_year: "=prepay_maximum_pct_of_prior_year", forfeit_after_months: "=prepay_forfeiture_after_months", transferable: "=prepay_transferable_between_categories"}
        Full Acre Input Financing Account: {window_open: "=prepay_booking_window_open_month_day", window_close: "=prepay_booking_window_close_month_day", minimum_usd: "=prepay_minimum_usd", ceiling_pct_of_prior_year: "=prepay_maximum_pct_of_prior_year", forfeit_after_months: "=prepay_forfeiture_after_months", transferable: "=prepay_transferable_between_categories"}
        Precision Partner Input Program Account: {window_open: "=prepay_booking_window_open_month_day", window_close: "=prepay_booking_window_close_month_day", minimum_usd: "=prepay_minimum_usd", ceiling_pct_of_prior_year: "=prepay_maximum_pct_of_prior_year", forfeit_after_months: "=prepay_forfeiture_after_months", transferable: "=prepay_transferable_between_categories"}
    measures: [agronomy_msr_prior_year_input_spend]

  - id: agronomy_payment_application
    subject: [agronomy_payment_posted]
    rule: >
      A payment is applied to the invoices it names, and where it names none it is applied in the programme's
      allocation order. On an oldest-invoice-first order the payment clears the oldest open invoice in full before any
      of the next, and on a prepay-first order any prepay standing to the member's credit is drawn before their own
      money is taken. Payments may reach the cooperative only by the methods the programme allows, so a member on a
      cash programme cannot direct grain proceeds onto the account and must be paid for their grain and pay the invoice
      separately. Where the member has elected on a grain settlement to have the proceeds credited to their input
      account, the whole net of that settlement lands on the account as one payment on the settlement date and is
      applied in the ordinary order; it is not split across accounts and it is not held back to await the member's
      instruction. A part payment on an overdue balance is accepted only at or above the programme's minimum part
      payment as a share of the balance, and a smaller offer is declined rather than accepted and left to fall short of
      reinstatement. Payments are applied on the day they are received, and a payment received after the office closes
      is applied the next day the office is open, which matters where it lands against a due date.
    eligibility: []
    params:
      per_tier:
        Cash Purchase Account: {allocation: "=payment_allocation_order", methods: "=payment_methods_allowed", grain_transfer: "=grain_settlement_transfer_allowed", minimum_part_payment_pct: "=minimum_payment_pct_of_balance"}
        Standard 30-Day Charge Account: {allocation: "=payment_allocation_order", methods: "=payment_methods_allowed", grain_transfer: "=grain_settlement_transfer_allowed", minimum_part_payment_pct: "=minimum_payment_pct_of_balance"}
        Seasonal Terms Crop Input Account: {allocation: "=payment_allocation_order", methods: "=payment_methods_allowed", grain_transfer: "=grain_settlement_transfer_allowed", minimum_part_payment_pct: "=minimum_payment_pct_of_balance"}
        Early Pay Prepay Program Account: {allocation: "=payment_allocation_order", methods: "=payment_methods_allowed", grain_transfer: "=grain_settlement_transfer_allowed", minimum_part_payment_pct: "=minimum_payment_pct_of_balance"}
        Full Acre Input Financing Account: {allocation: "=payment_allocation_order", methods: "=payment_methods_allowed", grain_transfer: "=grain_settlement_transfer_allowed", minimum_part_payment_pct: "=minimum_payment_pct_of_balance"}
        Precision Partner Input Program Account: {allocation: "=payment_allocation_order", methods: "=payment_methods_allowed", grain_transfer: "=grain_settlement_transfer_allowed", minimum_part_payment_pct: "=minimum_payment_pct_of_balance"}

  - id: agronomy_finance_charge
    subject: [agronomy_finance_charge_assessed]
    rule: >
      A service charge is assessed on an invoice still unpaid after its grace period, and the grace period is counted
      in whole calendar days from the due date of that invoice, the due date itself counting as day zero, an invoice
      cleared on the final day of grace attracting nothing. The charge is the programme's monthly percentage on the
      unpaid balance of that invoice, assessed once per statement month for as long as it stands unpaid, and where the
      computed charge falls under the programme's floor the floor is assessed instead. It is assessed per invoice
      rather than on the account total, so a member with three overdue invoices carries three charges and three floors.
      A programme with no monthly percentage assesses no service charge at all, however long an invoice runs. A service
      charge already assessed is reversed only where the invoice behind it is itself reversed by a credit memo or where
      the cooperative's own billing error put the invoice out; it is never reversed as a goodwill gesture at the desk,
      and a member who asks for it to be taken off on those grounds is passed to the credit department, whose decision
      that is.
    eligibility:
      - id: grace_period_expired
        applies_to: [agronomy_finance_charge_assessed]
        kind: time
        condition: A service charge is assessed on an invoice still unpaid after its grace period, and the grace period is counted in whole calendar days from the due date of that invoice, the due date itself counting as day zero, an invoice cleared on the final day of grace attracting nothing.
        evidence_fields: [agronomy_invoices.due_date, agronomy_invoices.invoice_number, agronomy_invoices.amount]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [agronomy_invoices.invoice_number]
          action_bindings:
            agronomy_invoices.invoice_number: invoice_number
        temporal_basis:
          clock: frozen_time
          anchor_event: the due date of that invoice
          anchor_source: agronomy_invoices.due_date
          relation: not_before
          duration_source: variants.finance_charge_grace_days
          unit: calendar_days
          counting_rule: the grace period is counted in whole calendar days from the due date of that invoice, the due date itself counting as day zero, an invoice cleared on the final day of grace attracting nothing
          boundary: exclusive
    params:
      assessed_per: invoice
      per_tier:
        Cash Purchase Account: {monthly_pct: "=finance_charge_monthly_pct", grace_days: "=finance_charge_grace_days", floor_usd: "=finance_charge_minimum_usd"}
        Standard 30-Day Charge Account: {monthly_pct: "=finance_charge_monthly_pct", grace_days: "=finance_charge_grace_days", floor_usd: "=finance_charge_minimum_usd"}
        Seasonal Terms Crop Input Account: {monthly_pct: "=finance_charge_monthly_pct", grace_days: "=finance_charge_grace_days", floor_usd: "=finance_charge_minimum_usd"}
        Early Pay Prepay Program Account: {monthly_pct: "=finance_charge_monthly_pct", grace_days: "=finance_charge_grace_days", floor_usd: "=finance_charge_minimum_usd"}
        Full Acre Input Financing Account: {monthly_pct: "=finance_charge_monthly_pct", grace_days: "=finance_charge_grace_days", floor_usd: "=finance_charge_minimum_usd"}
        Precision Partner Input Program Account: {monthly_pct: "=finance_charge_monthly_pct", grace_days: "=finance_charge_grace_days", floor_usd: "=finance_charge_minimum_usd"}
    formula:
      finance_charge_amount: max(finance_charge_minimum_usd, round(amount * finance_charge_monthly_pct / 100, 2))
    measures: [agronomy_msr_days_past_due]

  - id: agronomy_returns_and_credits
    subject: [agronomy_credit_memo_issued]
    rule: >
      Product comes back only where the programme's returnable classes cover it and only inside the return window,
      counted in whole calendar days from the delivery date on the ticket it left on, a return offered on the final day
      of the window still being in time. Crop protection product comes back only unopened and in its original
      packaging on every programme that requires that, and a part case is not a return. Seed comes back only up to the
      seed return cutoff in the season, after which the bag is the member's whether it was opened or not, because the
      variety cannot be resold once the planting window has passed. An accepted return is credited at the price it was
      invoiced at, not the price of the day, less the programme's restocking charge as a percentage of that invoiced
      value. Bulk fertilizer and liquid product that has left the plant are not returnable at all on any programme,
      because they cannot be brought back into the blend with their identity known. A credit memo is written against
      the invoice the product was billed on, so a member returning product billed across two invoices gets two credit
      memos; a credit memo is never written against the account as a whole. Where the account is already clear the
      credit stands to the member's credit and is applied against their next invoice rather than refunded.
    eligibility:
      - id: return_inside_window
        applies_to: [agronomy_credit_memo_issued]
        kind: time
        condition: Product comes back only where the programme's returnable classes cover it and only inside the return window, counted in whole calendar days from the delivery date on the ticket it left on, a return offered on the final day of the window still being in time.
        evidence_fields: [agronomy_invoices.invoice_date, agronomy_invoices.delivery_ticket_number, agronomy_invoices.product_category, agronomy_invoices.invoice_number]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [agronomy_invoices.invoice_number, agronomy_invoices.delivery_ticket_number]
          action_bindings:
            agronomy_invoices.invoice_number: invoice_number
            agronomy_invoices.delivery_ticket_number: delivery_ticket_number
        temporal_basis:
          clock: frozen_time
          anchor_event: the delivery date on the ticket it left on
          anchor_source: agronomy_invoices.invoice_date
          relation: not_after
          duration_source: variants.return_window_days
          unit: calendar_days
          counting_rule: counted in whole calendar days from the delivery date on the ticket it left on, a return offered on the final day of the window still being in time
          boundary: inclusive
    params:
      never_returnable: [liquid_fertilizer_out_of_the_plant, bulk_blended_dry_fertilizer]
      per_tier:
        Cash Purchase Account: {window_days: "=return_window_days", restocking_pct: "=restocking_fee_pct", classes: "=returnable_categories", seed_cutoff: "=seed_return_cutoff_month_day", unopened_only: "=chemical_return_unopened_only"}
        Standard 30-Day Charge Account: {window_days: "=return_window_days", restocking_pct: "=restocking_fee_pct", classes: "=returnable_categories", seed_cutoff: "=seed_return_cutoff_month_day", unopened_only: "=chemical_return_unopened_only"}
        Seasonal Terms Crop Input Account: {window_days: "=return_window_days", restocking_pct: "=restocking_fee_pct", classes: "=returnable_categories", seed_cutoff: "=seed_return_cutoff_month_day", unopened_only: "=chemical_return_unopened_only"}
        Early Pay Prepay Program Account: {window_days: "=return_window_days", restocking_pct: "=restocking_fee_pct", classes: "=returnable_categories", seed_cutoff: "=seed_return_cutoff_month_day", unopened_only: "=chemical_return_unopened_only"}
        Full Acre Input Financing Account: {window_days: "=return_window_days", restocking_pct: "=restocking_fee_pct", classes: "=returnable_categories", seed_cutoff: "=seed_return_cutoff_month_day", unopened_only: "=chemical_return_unopened_only"}
        Precision Partner Input Program Account: {window_days: "=return_window_days", restocking_pct: "=restocking_fee_pct", classes: "=returnable_categories", seed_cutoff: "=seed_return_cutoff_month_day", unopened_only: "=chemical_return_unopened_only"}
    formula:
      discount_amount: round(extended_amount * restocking_fee_pct / 100, 2)
      amount: round(extended_amount - extended_amount * restocking_fee_pct / 100, 2)

  - id: agronomy_credit_standing
    subject: [agronomy_account_past_due_flagged, agronomy_account_suspended]
    rule: >
      An account is flagged past due once an invoice has stood unpaid for the programme's past-due trigger in calendar
      days beyond its due date, and the flag comes off only when nothing on the account is overdue, not merely when the
      oldest invoice is cleared. Buying is suspended when the oldest overdue invoice reaches the programme's suspension
      trigger in days, or at any time once the overdue balance reaches the programme's suspension threshold, whichever
      comes first; the threshold bites on its own, so a large balance one day overdue can suspend an account that the
      day count alone would not. Suspension stops new product leaving the plant and does not disturb product already
      delivered, prepay already booked or custom application work already scheduled. Buying is reinstated when the
      member pays at least the programme's reinstatement share of the overdue balance, and reinstatement is recorded by
      the credit department rather than at the counter, however plainly the member says the payment has been sent. A
      member whose grain settlement will clear the balance within days may ask for the suspension to be lifted early
      against that settlement, and that is a judgement the credit department makes and no rule here settles.
    eligibility:
      - id: credit_department_records_reinstatement
        applies_to: [agronomy_account_suspended]
        kind: authorization
        condition: Buying is reinstated when the member pays at least the programme's reinstatement share of the overdue balance, and reinstatement is recorded by the credit department rather than at the counter, however plainly the member says the payment has been sent.
        evidence_fields: [agronomy_accounts.credit_status, agronomy_accounts.current_balance, agronomy_accounts.account_number]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [agronomy_accounts.account_number]
          action_bindings:
            agronomy_accounts.account_number: account_number
    params:
      per_tier:
        Cash Purchase Account: {past_due_days: "=past_due_trigger_days", suspend_days: "=suspension_trigger_days", suspend_balance_usd: "=suspension_balance_threshold_usd", reinstate_pct: "=reinstatement_payment_pct"}
        Standard 30-Day Charge Account: {past_due_days: "=past_due_trigger_days", suspend_days: "=suspension_trigger_days", suspend_balance_usd: "=suspension_balance_threshold_usd", reinstate_pct: "=reinstatement_payment_pct"}
        Seasonal Terms Crop Input Account: {past_due_days: "=past_due_trigger_days", suspend_days: "=suspension_trigger_days", suspend_balance_usd: "=suspension_balance_threshold_usd", reinstate_pct: "=reinstatement_payment_pct"}
        Early Pay Prepay Program Account: {past_due_days: "=past_due_trigger_days", suspend_days: "=suspension_trigger_days", suspend_balance_usd: "=suspension_balance_threshold_usd", reinstate_pct: "=reinstatement_payment_pct"}
        Full Acre Input Financing Account: {past_due_days: "=past_due_trigger_days", suspend_days: "=suspension_trigger_days", suspend_balance_usd: "=suspension_balance_threshold_usd", reinstate_pct: "=reinstatement_payment_pct"}
        Precision Partner Input Program Account: {past_due_days: "=past_due_trigger_days", suspend_days: "=suspension_trigger_days", suspend_balance_usd: "=suspension_balance_threshold_usd", reinstate_pct: "=reinstatement_payment_pct"}
    measures: [agronomy_msr_days_past_due]

  - id: agronomy_account_maintenance
    subject: [agronomy_account_updated]
    rule: >
      A limit may be raised at the counter by no more than the programme's one-step percentage of the existing limit,
      and only where the programme does not require a fresh review for an increase; anything larger, and every increase
      on a programme that does require it, goes to the credit department and waits for their recorded decision. The
      limit may never be raised above the programme's ceiling at all, which is a board matter rather than a credit one.
      Terms are a property of the programme and are not rewritten on a live account; a member who needs different terms
      moves programme, which means a fresh application. Enrolled acres are rewritten on the member's own statement
      because they are the member's own fact, and the acres decide whether a programme rebate is earned at the end of
      the season. A perfected security interest is recorded only from the filing itself, never from the member's
      account of it. A review is recorded when credit completes it, and an account whose review is older than the
      programme's review interval is not suspended for that reason alone but is not given an increase until the review
      is refreshed.
    eligibility:
      - id: limit_increase_authority
        applies_to: [agronomy_account_updated]
        kind: authorization
        condition: A limit may be raised at the counter by no more than the programme's one-step percentage of the existing limit, and only where the programme does not require a fresh review for an increase; anything larger, and every increase on a programme that does require it, goes to the credit department and waits for their recorded decision.
        evidence_fields: [agronomy_accounts.credit_status, agronomy_accounts.credit_limit, agronomy_accounts.credit_review_date, agronomy_accounts.account_number]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [agronomy_accounts.account_number]
          action_bindings:
            agronomy_accounts.account_number: account_number
      - id: account_live_for_maintenance
        applies_to: [agronomy_account_updated]
        kind: state
        condition: Enrolled acres are rewritten on the member's own statement because they are the member's own fact, and the acres decide whether a programme rebate is earned at the end of the season.
        evidence_fields: [agronomy_accounts.status, agronomy_accounts.acres_enrolled, agronomy_accounts.account_number]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys:
            - [agronomy_accounts.account_number]
          action_bindings:
            agronomy_accounts.account_number: account_number
        state_contract:
          field: agronomy_accounts.status
          allowed: [active, past_due, suspended]
    params:
      per_tier:
        Cash Purchase Account: {one_step_pct: "=credit_limit_increase_max_pct", needs_review: "=credit_limit_increase_requires_review", ceiling_usd: "=credit_limit_max_usd", review_months: "=credit_review_interval_months"}
        Standard 30-Day Charge Account: {one_step_pct: "=credit_limit_increase_max_pct", needs_review: "=credit_limit_increase_requires_review", ceiling_usd: "=credit_limit_max_usd", review_months: "=credit_review_interval_months"}
        Seasonal Terms Crop Input Account: {one_step_pct: "=credit_limit_increase_max_pct", needs_review: "=credit_limit_increase_requires_review", ceiling_usd: "=credit_limit_max_usd", review_months: "=credit_review_interval_months"}
        Early Pay Prepay Program Account: {one_step_pct: "=credit_limit_increase_max_pct", needs_review: "=credit_limit_increase_requires_review", ceiling_usd: "=credit_limit_max_usd", review_months: "=credit_review_interval_months"}
        Full Acre Input Financing Account: {one_step_pct: "=credit_limit_increase_max_pct", needs_review: "=credit_limit_increase_requires_review", ceiling_usd: "=credit_limit_max_usd", review_months: "=credit_review_interval_months"}
        Precision Partner Input Program Account: {one_step_pct: "=credit_limit_increase_max_pct", needs_review: "=credit_limit_increase_requires_review", ceiling_usd: "=credit_limit_max_usd", review_months: "=credit_review_interval_months"}

  - id: agronomy_lifecycle_progression
    subject: [agronomy_credit_review_completed, agronomy_account_closed]
    rule: >
      An application goes to the credit department, comes back approved with a limit or declined outright, and only an
      approved account ever buys on terms. A declined application closes without ever having been active, and the
      member buys for cash; a fresh application may be made once the ground for the decline has changed, which is a
      credit matter and not a counter one. A member closes an account of their own accord only with nothing owing, no
      prepay standing unapplied and no product out on the field awaiting invoice, and the closure is theirs to make
      rather than the desk's. Where prepay stands unapplied the account cannot close until the prepay is drawn,
      transferred where the programme allows it, or forfeited at the end of its forfeiture period. The cooperative
      closes a suspended account of its own motion by writing the balance over to the credit department, and that
      closure does not extinguish what is owed; the balance follows the member and is recovered from grain settlements
      and patronage as they arise. A closed account is terminal and is never reopened, so a member coming back needs a
      fresh application and a fresh review.
    eligibility: []
    params:
      closure_requires: [zero_balance, zero_unapplied_prepay, no_uninvoiced_delivery]
