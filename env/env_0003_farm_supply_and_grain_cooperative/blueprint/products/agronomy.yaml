category: agronomy
display_name: Crop Input Purchasing Accounts

binding:
  holding_table: agronomy_accounts
  event_tables: [agronomy_invoices]
  intake_tables: [agronomy_orders]
  status_field: status
  variant_field: variant_name
  quantity_fields:
    current_balance: input_receivable
    prepay_balance: prepay_credit

lifecycle:
  states: [applied, under_credit_review, active, past_due, suspended, closed]
  transitions:
    - {from: applied, to: under_credit_review, by: agent, means: the application is passed to the credit department for review}
    - {from: under_credit_review, to: active, by: agent, means: credit approves the account and a limit is set}
    - {from: under_credit_review, to: closed, by: agent, means: credit declines the application and the account never opens}
    - {from: active, to: past_due, by: system, means: an invoice passes its due date unpaid}
    - {from: past_due, to: active, by: system, means: the oldest overdue invoice is cleared and nothing else is overdue}
    - {from: past_due, to: suspended, by: agent, means: the account stays overdue past the suspension trigger and further purchases are stopped}
    - {from: suspended, to: active, by: agent, means: the member brings the account back inside its terms and buying is reinstated}
    - {from: active, to: closed, by: user, means: the member closes the account with nothing owing}
    - {from: suspended, to: closed, by: agent, means: the cooperative writes the account off to the credit department and closes it}

accounts:
  - key: input_receivable
    unit: USD
    meaning: money owed on the crop input account, credited by invoices and service charges and debited by payments, prepay applications, credits and discounts
  - key: prepay_credit
    unit: USD
    meaning: unspent prepay money held to the member's credit, credited when prepay is booked and debited as it is drawn against invoices

parameter_schema:
  credit_limit_default_usd: the limit an approved account opens with (USD)
  credit_limit_max_usd: the highest limit this programme will carry without board approval (USD)
  terms_days: payment terms counted in calendar days from the invoice date
  billing_cycle_day: day of the month the account statement closes
  credit_review_required: whether a credit review must complete before the account opens (switch)
  credit_review_interval_months: how often an open account is reviewed again (months)
  lien_required: whether a perfected security interest on the growing crop is required (switch)
  minimum_acres_enrolled: acres the member must enrol to hold this programme (acres)
  cash_on_delivery_required: whether product is paid for at the time it leaves the plant (switch)
  early_pay_discount_pct: discount for paying an invoice inside the early pay window (percent)
  early_pay_discount_window_days: calendar days from the invoice date within which the early pay discount is earned
  volume_discount_threshold_usd: season input spend at which the volume discount begins (USD)
  volume_discount_pct: discount on spend above the volume threshold (percent)
  prepay_discount_pct: discount earned on money booked as prepay (percent)
  prepay_booking_window_open_month_day: the month and day the prepay booking window opens (MM-DD)
  prepay_booking_window_close_month_day: the month and day the prepay booking window closes (MM-DD)
  prepay_minimum_usd: smallest prepay booking this programme will take (USD)
  prepay_maximum_pct_of_prior_year: ceiling on prepay as a share of the member's prior-year input spend (percent)
  prepay_forfeiture_after_months: months after the booking window closes at which unapplied prepay is forfeited to the cooperative
  prepay_transferable_between_categories: whether prepay booked against one input class may be drawn against another (switch)
  discount_stacking_basis: how several discounts combine when they land on the same invoice (stacking basis)
  program_rebate_pct: end-of-season rebate on qualifying spend for programme members (percent)
  program_rebate_threshold_acres: acres that must be enrolled before the programme rebate is earned (acres)
  finance_charge_monthly_pct: service charge on overdue balances (percent per month)
  finance_charge_grace_days: calendar days after the due date before a service charge is assessed
  finance_charge_minimum_usd: floor under any service charge assessed (USD)
  past_due_trigger_days: calendar days past the due date at which the account is flagged past due
  suspension_trigger_days: calendar days past the due date at which buying is suspended
  suspension_balance_threshold_usd: overdue balance at or above which suspension is applied regardless of days (USD)
  reinstatement_payment_pct: share of the overdue balance that must be paid to reinstate buying (percent)
  return_window_days: calendar days from the delivery date within which product may be returned
  restocking_fee_pct: restocking charge on accepted returns (percent of the invoiced value)
  returnable_categories: which input classes may be returned at all (list of input classes)
  seed_return_cutoff_month_day: the month and day after which seed is no longer returnable in the season (MM-DD)
  chemical_return_unopened_only: whether crop protection product must be unopened and in original packaging to be returned (switch)
  delivery_minimum_charge_usd: charge on deliveries under the minimum order (USD)
  delivery_minimum_order_usd: order value at or above which delivery is carried (USD)
  split_load_fee_usd: charge for splitting one order across two fields or two delivery days (USD)
  after_hours_delivery_fee_usd: charge for a delivery taken outside plant hours (USD)
  payment_methods_allowed: which ways the member may pay on this programme (list of methods)
  grain_settlement_transfer_allowed: whether grain settlement proceeds may be credited straight onto this account (switch)
  payment_allocation_order: how a payment is applied across open invoices (allocation order)
  statement_delivery_method: how account statements reach the member (channel)
  patronage_eligible: whether input spend on this programme earns patronage allocation (switch)
  patronage_allocation_basis: which stream the spend is allocated under for patronage (allocation basis)
  minimum_payment_pct_of_balance: smallest payment accepted as a part payment on an overdue balance (percent of balance)
  credit_limit_increase_max_pct: how far a limit may be raised at the desk in one step (percent of the existing limit)
  credit_limit_increase_requires_review: whether a limit increase needs a fresh credit review (switch)
  seed_price_protection_enabled: whether booked seed carries price protection against a later list price fall (switch)
  price_protection_window_days: calendar days after booking within which price protection holds
  soil_test_required_for_prescription: whether a current soil test must be on file before prescription products are sold (switch)
  account_maintenance_fee_usd: annual charge for carrying the account (USD)

