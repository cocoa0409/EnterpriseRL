category: custom
display_name: Custom Application and Field Services

binding:
  holding_table: custom_service_plans
  event_tables: [custom_workorders]
  intake_tables: [custom_service_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields:
    acres_applied: applied_acres

lifecycle:
  states: [applied, active, weather_hold, completed, cancelled]
  transitions:
    - {from: applied, to: active, by: agent, means: the plan is accepted for the crop year and work may be released against it}
    - {from: applied, to: cancelled, by: user, means: the member withdraws the plan before it is accepted}
    - {from: active, to: weather_hold, by: system, means: field conditions stop work across the plan}
    - {from: weather_hold, to: active, by: agent, means: conditions clear and work resumes}
    - {from: active, to: completed, by: system, means: every committed acre has been worked and billed}
    - {from: active, to: cancelled, by: user, means: the member cancels the remaining work on the plan}
    - {from: weather_hold, to: cancelled, by: agent, means: the season runs out while work is held and the remaining acres are released}

accounts:
  - key: applied_acres
    unit: acres
    meaning: acres worked under the plan, credited as passes are completed and debited where a pass is abandoned part way and the acres are put back
  - key: service_receivable
    unit: USD
    meaning: money owed for custom application work, credited by acre billing and surcharges and debited by credits issued

parameter_schema:
  minimum_acres_per_workorder: smallest field a single work order will be written for (acres)
  maximum_acres_per_plan: most acres one plan may carry in a crop year (acres)
  plan_enrollment_fee_usd: one-off charge for enrolling the plan (USD)
  rate_dry_spread_per_acre_usd: rate for dry fertilizer spreading (USD per acre)
  rate_liquid_application_per_acre_usd: rate for liquid application (USD per acre)
  rate_anhydrous_application_per_acre_usd: rate for anhydrous ammonia application (USD per acre)
  rate_aerial_application_per_acre_usd: rate for aerial application (USD per acre)
  rate_soil_sampling_per_acre_usd: rate for grid or zone soil sampling (USD per acre)
  rate_tissue_sampling_per_acre_usd: rate for in-season tissue sampling (USD per acre)
  rate_scouting_per_acre_usd: rate for field scouting across the season (USD per acre)
  rate_seed_treating_per_unit_usd: rate for treating seed (USD per unit)
  rate_basis: whether the plan's rates are held for the crop year or priced at the day's posted rate (pricing basis)
  small_acre_surcharge_threshold_acres: field size at or below which the small acre surcharge applies (acres)
  small_acre_surcharge_usd: surcharge on a field under the threshold (USD)
  point_row_surcharge_pct: surcharge on irregular fields as a share of the acre charge (percent)
  out_of_window_surcharge_pct: surcharge for work done outside the plan's service window (percent)
  night_application_surcharge_usd: surcharge for a pass run after dark (USD)
  fly_on_surcharge_per_acre_usd: surcharge for switching a ground pass to aerial (USD per acre)
  surcharge_stacking_basis: how several surcharges combine on one work order (stacking basis)
  service_window_days: length of the window in which the plan's committed rates apply (calendar days)
  scheduling_notice_business_days: business days of notice a work order needs before it is scheduled
  weather_hold_max_days: longest work may be held for field conditions before the plan is reconsidered (calendar days)
  reschedule_free_count: how many reschedules a work order may take without charge (count)
  reschedule_fee_usd: charge for a reschedule beyond the free count (USD)
  member_cancellation_notice_hours: hours of notice needed to cancel a scheduled pass without charge
  member_cancellation_fee_usd: charge for cancelling a scheduled pass inside the notice period (USD)
  rain_out_recharge_allowed: whether a pass washed out by rain is charged again when it is rerun (switch)
  minimum_billable_acres: smallest acreage billed on any work order however small the field (acres)
  acre_measurement_basis: how the acres billed are arrived at (measurement basis)
  billing_trigger: what event causes the acre charge to be raised (billing trigger)
  prescription_required: whether a current variable-rate prescription must be on file before work is released (switch)
  prescription_validity_days: calendar days a prescription stays current for
  soil_test_validity_months: months a soil test stays current for
  applicator_license_required: whether a verified applicator licence is required for this plan (switch)
  restricted_use_product_allowed: whether restricted-use product may be applied under this plan (switch)
  reentry_interval_hours: hours the field is closed after application before anyone may re-enter
  drift_complaint_window_days: calendar days after a pass within which a drift complaint is taken
  rework_allowance_pct: share of acres that may be reworked without charge where a pass is found short (percent)
  rework_free_within_days: calendar days after a pass within which rework is free
  equipment_guarantee: what the cooperative warrants about the equipment and the pass (guarantee basis)
  gps_records_provided: whether guidance records are provided to the member (switch)
  as_applied_map_delivered: whether an as-applied map is delivered after each pass (switch)
  season_commitment_acres: acres the member commits for the crop year (acres)
  season_commitment_shortfall_fee_per_acre_usd: charge per committed acre not worked by the end of the season (USD per acre)
  priority_scheduling_rank: where the plan sits in the scheduling queue (priority band)
  patronage_eligible: whether service spend on this plan earns patronage allocation (switch)
  per_unit_retain_per_acre_usd: capital retained per acre worked and credited to the member's equity account (USD per acre)
  statement_delivery_method: how service statements reach the member (channel)
  invoice_terms_days: payment terms counted in calendar days from the invoice date
  crop_year_rate_lock: whether the rates are locked for the whole crop year at enrolment (switch)

