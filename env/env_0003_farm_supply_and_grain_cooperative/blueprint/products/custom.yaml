events:
  - type: custom_plan_opened
    target: custom_service_plans
    mutation: create
    meaning: a member enrols acres for custom application work under one of the plans and the plan record is opened in applied standing
    grain: one row per service plan enrolled
    fields:
      plan_id: internal reference of the plan being opened
      customer_id: the member the plan belongs to
      variant_name: the application programme enrolled in
      status: lifecycle standing the plan opens in, which is always applied
      plan_number: the plan number quoted on every work order
      crop_year: the crop year the plan covers
      enrolled_acres: acres committed to the plan
      service_window_start: first day the plan's rates apply
      service_window_end: last day the plan's rates apply
      primary_field: the home field the plan is written around
      opened_date: date the enrolment was taken
      prescription_on_file: whether a current prescription is on file
      applicator_license_verified: whether the applicator licence has been verified for the crop year
      acres_applied: acres worked so far, which at opening is zero
    triggers: []

  - type: custom_plan_activated
    target: custom_service_plans
    mutation: {transition: {from: applied, to: active}}
    meaning: the plan is accepted for the crop year and work may be released against it
    grain: one row per plan accepted
    fields:
      status: the standing the plan moves to
      service_window_start: the day the plan's rates begin to apply
      applicator_license_verified: whether the licence was verified at acceptance
    triggers: []

  - type: custom_workorder_opened
    target: custom_workorders
    meaning: a pass across one field is written up and put into the scheduling queue
    grain: one row per work order written for one pass across one field
    distinguish_by: [workorder_number, field_name]
    fields:
      workorder_id: internal reference of the work order row
      plan_id: the plan the work is released against
      customer_id: the member the work is for
      event_type: the event family this row records
      workorder_number: the work order number
      work_date: the date the pass is scheduled for
      service_type: the operation to be run
      acres: acres the order covers
      product_used: the product to be applied
      field_name: the field to be worked
      applicator_name: the applicator assigned
      posted_date: the date the order was written
    triggers: []

  - type: custom_application_completed
    target: custom_workorders
    meaning: the applicator finishes a pass and the acres worked are recorded from the guidance record
    grain: one row per completed pass across one field
    distinguish_by: [workorder_number, work_date]
    fields:
      workorder_id: internal reference of the work order row
      plan_id: the plan the work was released against
      customer_id: the member the work was for
      event_type: the event family this row records
      workorder_number: the work order completed
      work_date: the date the pass was run
      service_type: the operation run
      acres: acres actually covered
      product_used: the product applied
      field_name: the field worked
      applicator_name: the applicator who ran the pass
      weather_hold_flag: whether field conditions interrupted the pass
      posted_date: the date the completion was recorded
    account: applied_acres
    direction: in
    triggers:
      - event: custom:custom_acre_billed
        map: {plan_id: plan_id, customer_id: customer_id, workorder_number: workorder_number, acres: acres, service_type: service_type, work_date: work_date}

  - type: custom_acre_billed
    target: custom_workorders
    meaning: the acres worked on a completed pass are billed at the plan's rate for the operation
    grain: one acre charge for one completed work order
    distinguish_by: [workorder_number, service_type]
    fields:
      workorder_id: internal reference of the work order row
      plan_id: the plan billed
      customer_id: the member billed
      event_type: the event family this row records
      workorder_number: the work order billed
      work_date: the date the pass was run
      service_type: the operation billed
      acres: acres billed
      rate_per_acre: the rate applied per acre
      amount: money charged for the pass
      invoice_number: the service invoice the charge was billed on
      posted_date: the date the charge was posted to the service account
    account: service_receivable
    direction: in
    triggers:
      - event: patronage:patronage_units_accrued
        map: {customer_id: customer_id, patronage_units: amount, allocation_basis: service_dollars, entry_date: work_date}

  - type: custom_reschedule_recorded
    target: custom_workorders
    meaning: a scheduled pass is moved to another day, or abandoned part way, and the acres are put back into the queue
    grain: one reschedule of one work order
    distinguish_by: [workorder_number, work_date, reschedule_reason]
    fields:
      workorder_id: internal reference of the work order row
      plan_id: the plan the work belongs to
      customer_id: the member the work is for
      event_type: the event family this row records
      workorder_number: the work order rescheduled
      work_date: the day the pass was moved from
      reschedule_reason: why the pass was moved
      weather_hold_flag: whether field conditions caused the move
      acres: acres put back into the queue
      field_name: the field concerned
      posted_date: the date the reschedule was recorded
    account: applied_acres
    direction: out
    triggers: []

  - type: custom_surcharge_charged
    target: custom_workorders
    meaning: a surcharge is raised on a work order for the circumstances the pass was run in
    grain: one surcharge of one class on one work order
    distinguish_by: [workorder_number, surcharge_type]
    fields:
      workorder_id: internal reference of the work order row
      plan_id: the plan charged
      customer_id: the member charged
      event_type: the event family this row records
      workorder_number: the work order the surcharge attaches to
      surcharge_type: which class of surcharge this row carries
      amount: money charged
      work_date: the date the pass was run
      acres: acres the surcharge was computed on
      invoice_number: the service invoice the surcharge was billed on
      posted_date: the date the surcharge was posted to the service account
    account: service_receivable
    direction: in
    triggers: []

  - type: custom_credit_issued
    target: custom_workorders
    meaning: a charge is credited back where a pass was short, reworked, or billed in error
    grain: one credit against one work order
    distinguish_by: [workorder_number, posted_date]
    fields:
      workorder_id: internal reference of the work order row
      plan_id: the plan credited
      customer_id: the member credited
      event_type: the event family this row records
      workorder_number: the work order credited
      work_date: the date of the pass being credited
      acres: acres the credit covers
      rate_per_acre: the rate the credit was computed at
      amount: money credited
      invoice_number: the service invoice the credit was written against
      posted_date: the date the credit was posted to the service account
    account: service_receivable
    direction: out
    triggers: []

  - type: custom_weather_hold_set
    target: custom_service_plans
    mutation: {transition: [{from: active, to: weather_hold}, {from: weather_hold, to: active}]}
    meaning: field conditions stop work across the plan and it resumes when they clear
    grain: one row per weather hold placed or lifted on the plan
    fields:
      status: the standing the plan moves to
      acres_applied: acres worked when the hold was placed or lifted
    triggers: []

  - type: custom_plan_completed
    target: custom_service_plans
    mutation: {transition: {from: active, to: completed}}
    meaning: every committed acre has been worked and billed and the plan closes for the crop year
    grain: one row per plan completed
    fields:
      status: the standing the plan moves to
      closed_date: the date the plan completed
      acres_applied: acres worked over the crop year
    triggers: []

  - type: custom_plan_cancelled
    target: custom_service_plans
    mutation: {transition: [{from: applied, to: cancelled}, {from: active, to: cancelled}, {from: weather_hold, to: cancelled}]}
    meaning: the plan is withdrawn before acceptance, or the remaining work on it is cancelled
    grain: one row per plan cancelled
    fields:
      status: the standing the plan moves to
      closed_date: the date the cancellation took effect
      acres_applied: acres worked before the cancellation
    triggers: []

  - type: custom_plan_updated
    target: custom_service_plans
    mutation: update
    meaning: the acres, the window, the prescription or the licence position on a live plan are rewritten
    grain: one row per recorded change to the plan's own particulars
    fields:
      enrolled_acres: the revised acres committed
      service_window_end: the revised last day the rates apply
      primary_field: the revised home field
      prescription_on_file: whether a current prescription is now on file
      applicator_license_verified: whether the licence has now been verified
    triggers: []

measures:
  - id: custom_msr_season_acres_applied
    window: the current crop year, which runs 1 September through 31 August
    measure: sum of acres over the member's custom_application_completed rows in that crop year across every plan they hold
  - id: custom_msr_plan_acres_remaining
    window: the plan as it stands on the handling date
    measure: enrolled_acres less acres_applied on the plan
  - id: custom_msr_days_since_pass
    window: from the work date of a completed pass through the handling date, the work date counting as day zero
    measure: count of calendar days since the pass was run
  - id: custom_msr_season_service_dollars
    window: the current crop year, which runs 1 September through 31 August
    measure: sum of amount over the member's custom_acre_billed rows in that crop year

policies:
  - id: custom_agg_multi_holding
    subject: [custom_plan_opened]
    rule: >
      A member may hold up to three custom application plans at once, counting every plan that is neither completed nor
      cancelled, because a farm commonly runs one plan for the home ground, another for rented acres in a different
      township, and a separate certified plan for anhydrous. Two live plans of the same programme for the same crop
      year are never written for one member, since the committed acres and the rate lock would then sit in two places.
      A plan whose entry gate calls for licence verification is not accepted until the licence covering restricted-use
      application has been verified for the crop year and recorded against the plan, and the verification is taken from
      the licence itself rather than from the member's word that it was renewed. A plan whose entry gate calls for a
      prescription is not accepted until a current prescription is on file. Where the entry gate is not met the
      enrolment is taken and the plan waits in applied standing, and work is written on the per-acre programme in the
      meantime at the posted rate.
    eligibility:
      - id: licence_verified_before_acceptance
        applies_to: [custom_plan_opened]
        kind: authorization
        condition: A plan whose entry gate calls for licence verification is not accepted until the licence covering restricted-use application has been verified for the crop year and recorded against the plan, and the verification is taken from the licence itself rather than from the member's word that it was renewed.
        evidence_fields: [custom_service_plans.applicator_license_verified, custom_service_plans.variant_name, custom_service_plans.plan_number, custom_service_plans.crop_year]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [custom_service_plans.plan_number]
          action_bindings:
            custom_service_plans.plan_number: plan_number
    params:
      max_per_customer: 3
      uniqueness_basis: [variant_name, crop_year]

  - id: custom_agg_acres_across_plans
    subject: [custom_plan_updated, custom_acre_billed]
    rule: >
      Acres are counted across every plan a member holds for the crop year, because a field worked once cannot be
      committed twice. The same field may not sit on two live plans for the same crop year, and where a member moves
      acres between their plans the acres come off one before they go on the other. A plan may not carry more than its
      programme's acre ceiling, and acres beyond it go onto a second plan rather than being squeezed in. Season
      commitment is measured at the end of the crop year on acres actually worked across the plan, and a member who
      falls short of the acres they committed pays the programme's shortfall charge on the acres not worked, whatever
      the reason; acres lost to a weather hold that ran past the end of the season are the one case the charge is
      waived. Acres reworked under the rework allowance do not count a second time toward the commitment, since they
      are the same ground.
    eligibility: []
    params:
      per_tier:
        Per-Acre Custom Application: {acre_ceiling: "=maximum_acres_per_plan", committed_acres: "=season_commitment_acres", shortfall_usd: "=season_commitment_shortfall_fee_per_acre_usd"}
        Season Commitment Application Plan: {acre_ceiling: "=maximum_acres_per_plan", committed_acres: "=season_commitment_acres", shortfall_usd: "=season_commitment_shortfall_fee_per_acre_usd"}
        Full-Service Agronomy Plan: {acre_ceiling: "=maximum_acres_per_plan", committed_acres: "=season_commitment_acres", shortfall_usd: "=season_commitment_shortfall_fee_per_acre_usd"}
        Variable Rate Prescription Plan: {acre_ceiling: "=maximum_acres_per_plan", committed_acres: "=season_commitment_acres", shortfall_usd: "=season_commitment_shortfall_fee_per_acre_usd"}
        Precision Partner Whole-Farm Plan: {acre_ceiling: "=maximum_acres_per_plan", committed_acres: "=season_commitment_acres", shortfall_usd: "=season_commitment_shortfall_fee_per_acre_usd"}
        Certified Anhydrous Application Plan: {acre_ceiling: "=maximum_acres_per_plan", committed_acres: "=season_commitment_acres", shortfall_usd: "=season_commitment_shortfall_fee_per_acre_usd"}
    measures: [custom_msr_season_acres_applied, custom_msr_plan_acres_remaining]

  - id: custom_workorder_release
    subject: [custom_workorder_opened, custom_application_completed]
    rule: >
      A work order is written from the member's request and is released into the scheduling queue only after the
      programme's notice in business days, counting days the plant dispatches and not counting the day the request was
      taken. Work is released only while the plan stands in active, so a plan still waiting for acceptance or sitting
      under a weather hold has nothing released against it. Orders are worked in the order of the plan's scheduling
      priority and then by the day they were released, so a priority plan goes ahead of a standard one written the same
      morning. An order must cover at least the programme's minimum acres for a work order, and a smaller field is
      taken but billed at the programme's minimum billable acres. The acres recorded on completion are the acres the
      guidance record shows were covered, except on prescription plans where they are the acres inside the prescription
      boundary, and the member's own estimate of the field is not the measure. A pass abandoned part way is recorded as
      completed for the acres actually covered and the balance goes back into the queue as a fresh order.
    eligibility:
      - id: plan_active_for_release
        applies_to: [custom_workorder_opened]
        kind: state
        condition: Work is released only while the plan stands in active, so a plan still waiting for acceptance or sitting under a weather hold has nothing released against it.
        evidence_fields: [custom_service_plans.status, custom_service_plans.plan_number, custom_workorders.workorder_number]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [custom_workorders.workorder_number]
          action_bindings:
            custom_workorders.workorder_number: workorder_number
        state_contract:
          field: custom_service_plans.status
          allowed: [active]
    params:
      per_tier:
        Per-Acre Custom Application: {notice_business_days: "=scheduling_notice_business_days", minimum_acres: "=minimum_acres_per_workorder", minimum_billable: "=minimum_billable_acres", priority: "=priority_scheduling_rank", measurement: "=acre_measurement_basis"}
        Season Commitment Application Plan: {notice_business_days: "=scheduling_notice_business_days", minimum_acres: "=minimum_acres_per_workorder", minimum_billable: "=minimum_billable_acres", priority: "=priority_scheduling_rank", measurement: "=acre_measurement_basis"}
        Full-Service Agronomy Plan: {notice_business_days: "=scheduling_notice_business_days", minimum_acres: "=minimum_acres_per_workorder", minimum_billable: "=minimum_billable_acres", priority: "=priority_scheduling_rank", measurement: "=acre_measurement_basis"}
        Variable Rate Prescription Plan: {notice_business_days: "=scheduling_notice_business_days", minimum_acres: "=minimum_acres_per_workorder", minimum_billable: "=minimum_billable_acres", priority: "=priority_scheduling_rank", measurement: "=acre_measurement_basis"}
        Precision Partner Whole-Farm Plan: {notice_business_days: "=scheduling_notice_business_days", minimum_acres: "=minimum_acres_per_workorder", minimum_billable: "=minimum_billable_acres", priority: "=priority_scheduling_rank", measurement: "=acre_measurement_basis"}
        Certified Anhydrous Application Plan: {notice_business_days: "=scheduling_notice_business_days", minimum_acres: "=minimum_acres_per_workorder", minimum_billable: "=minimum_billable_acres", priority: "=priority_scheduling_rank", measurement: "=acre_measurement_basis"}

  - id: custom_rate_schedule
    subject: [custom_acre_billed, custom_application_completed]
    rule: >
      Each operation carries its own rate per acre and the plan decides whether that rate is held for the crop year or
      taken from the posted sheet on the day the pass was run. Where the plan holds rates, the rate is the one in force
      when the plan was accepted and it does not move however the posted sheet moves, and where it does not, the rate
      is the posted rate on the work date rather than on the date the order was written. The charge is the rate for the
      operation times the acres billed, and the acres billed are never fewer than the programme's minimum billable
      acres. An operation the plan does not carry a rate for is not worked under that plan at all, and the member is
      written a per-acre order instead. Where two operations are run over the same ground on the same day each is
      billed at its own rate, because each is a separate pass. Product applied is billed separately through the
      member's crop input account and never rolled into the acre charge.
    eligibility: []
    params:
      per_tier:
        Per-Acre Custom Application: {basis: "=rate_basis", dry: "=rate_dry_spread_per_acre_usd", liquid: "=rate_liquid_application_per_acre_usd", anhydrous: "=rate_anhydrous_application_per_acre_usd", aerial: "=rate_aerial_application_per_acre_usd", rate_lock: "=crop_year_rate_lock"}
        Season Commitment Application Plan: {basis: "=rate_basis", dry: "=rate_dry_spread_per_acre_usd", liquid: "=rate_liquid_application_per_acre_usd", anhydrous: "=rate_anhydrous_application_per_acre_usd", aerial: "=rate_aerial_application_per_acre_usd", rate_lock: "=crop_year_rate_lock"}
        Full-Service Agronomy Plan: {basis: "=rate_basis", dry: "=rate_dry_spread_per_acre_usd", liquid: "=rate_liquid_application_per_acre_usd", anhydrous: "=rate_anhydrous_application_per_acre_usd", aerial: "=rate_aerial_application_per_acre_usd", rate_lock: "=crop_year_rate_lock"}
        Variable Rate Prescription Plan: {basis: "=rate_basis", dry: "=rate_dry_spread_per_acre_usd", liquid: "=rate_liquid_application_per_acre_usd", anhydrous: "=rate_anhydrous_application_per_acre_usd", aerial: "=rate_aerial_application_per_acre_usd", rate_lock: "=crop_year_rate_lock"}
        Precision Partner Whole-Farm Plan: {basis: "=rate_basis", dry: "=rate_dry_spread_per_acre_usd", liquid: "=rate_liquid_application_per_acre_usd", anhydrous: "=rate_anhydrous_application_per_acre_usd", aerial: "=rate_aerial_application_per_acre_usd", rate_lock: "=crop_year_rate_lock"}
        Certified Anhydrous Application Plan: {basis: "=rate_basis", dry: "=rate_dry_spread_per_acre_usd", liquid: "=rate_liquid_application_per_acre_usd", anhydrous: "=rate_anhydrous_application_per_acre_usd", aerial: "=rate_aerial_application_per_acre_usd", rate_lock: "=crop_year_rate_lock"}
    formula:
      amount: round(max(acres, minimum_billable_acres) * rate_per_acre, 2)

  - id: custom_surcharges
    subject: [custom_surcharge_charged]
    rule: >
      Surcharges pay for the circumstances a pass was run in rather than for the work itself. The small acre surcharge
      is raised as a flat sum where the field is at or under the programme's threshold, because moving equipment costs
      the same whatever the field. The point row surcharge is raised as a percentage of the acre charge on irregular
      ground. The out-of-window surcharge is raised as a percentage where the pass is run outside the plan's service
      window, the window running from the plan's window start through its window end with both days inside it. Night
      application and switching a ground pass to aerial each carry their own charge. Surcharges of different classes
      add rather than the largest being taken, so a small irregular field worked after dark outside the window carries
      four of them. A surcharge the programme sets at zero is not raised at all and is not shown as a nil line. Where
      the cooperative moved the pass outside the window for its own scheduling reasons the out-of-window surcharge is
      waived, and where the member moved it the surcharge stands.
    eligibility: []
    params:
      per_tier:
        Per-Acre Custom Application: {small_acre_threshold: "=small_acre_surcharge_threshold_acres", small_acre_usd: "=small_acre_surcharge_usd", point_row_pct: "=point_row_surcharge_pct", out_of_window_pct: "=out_of_window_surcharge_pct", night_usd: "=night_application_surcharge_usd", fly_on_usd: "=fly_on_surcharge_per_acre_usd"}
        Season Commitment Application Plan: {small_acre_threshold: "=small_acre_surcharge_threshold_acres", small_acre_usd: "=small_acre_surcharge_usd", point_row_pct: "=point_row_surcharge_pct", out_of_window_pct: "=out_of_window_surcharge_pct", night_usd: "=night_application_surcharge_usd", fly_on_usd: "=fly_on_surcharge_per_acre_usd"}
        Full-Service Agronomy Plan: {small_acre_threshold: "=small_acre_surcharge_threshold_acres", small_acre_usd: "=small_acre_surcharge_usd", point_row_pct: "=point_row_surcharge_pct", out_of_window_pct: "=out_of_window_surcharge_pct", night_usd: "=night_application_surcharge_usd", fly_on_usd: "=fly_on_surcharge_per_acre_usd"}
        Variable Rate Prescription Plan: {small_acre_threshold: "=small_acre_surcharge_threshold_acres", small_acre_usd: "=small_acre_surcharge_usd", point_row_pct: "=point_row_surcharge_pct", out_of_window_pct: "=out_of_window_surcharge_pct", night_usd: "=night_application_surcharge_usd", fly_on_usd: "=fly_on_surcharge_per_acre_usd"}
        Precision Partner Whole-Farm Plan: {small_acre_threshold: "=small_acre_surcharge_threshold_acres", small_acre_usd: "=small_acre_surcharge_usd", point_row_pct: "=point_row_surcharge_pct", out_of_window_pct: "=out_of_window_surcharge_pct", night_usd: "=night_application_surcharge_usd", fly_on_usd: "=fly_on_surcharge_per_acre_usd"}
        Certified Anhydrous Application Plan: {small_acre_threshold: "=small_acre_surcharge_threshold_acres", small_acre_usd: "=small_acre_surcharge_usd", point_row_pct: "=point_row_surcharge_pct", out_of_window_pct: "=out_of_window_surcharge_pct", night_usd: "=night_application_surcharge_usd", fly_on_usd: "=fly_on_surcharge_per_acre_usd"}

  - id: custom_weather_and_reschedule
    subject: [custom_reschedule_recorded, custom_weather_hold_set]
    rule: >
      Field conditions stop work and nobody is charged for that. A pass moved because of weather, equipment failure or
      a product shortage is rescheduled at no charge however many times it happens, and only a move the member asks for
      counts against the programme's free reschedule count; beyond that count a member-requested move carries the
      programme's reschedule charge. Cancelling a scheduled pass inside the programme's notice in hours carries the
      cancellation charge, and outside it carries nothing. Where a pass is washed out by rain after the product is
      down, whether the rerun is charged again is fixed by the programme rather than argued at the counter. A weather
      hold across the whole plan is set when conditions stop work generally and runs no longer than the programme's
      hold maximum in calendar days from the day it was set, after which the plan returns to active and orders are
      rescheduled or released. Acres on an abandoned pass go back into the queue and are not billed twice when the pass
      is finished later.
    eligibility: []
    params:
      no_charge_reasons: [weather, equipment, product_shortage]
      per_tier:
        Per-Acre Custom Application: {free_reschedules: "=reschedule_free_count", reschedule_usd: "=reschedule_fee_usd", cancel_notice_hours: "=member_cancellation_notice_hours", cancel_usd: "=member_cancellation_fee_usd", hold_max_days: "=weather_hold_max_days", rain_out_recharge: "=rain_out_recharge_allowed"}
        Season Commitment Application Plan: {free_reschedules: "=reschedule_free_count", reschedule_usd: "=reschedule_fee_usd", cancel_notice_hours: "=member_cancellation_notice_hours", cancel_usd: "=member_cancellation_fee_usd", hold_max_days: "=weather_hold_max_days", rain_out_recharge: "=rain_out_recharge_allowed"}
        Full-Service Agronomy Plan: {free_reschedules: "=reschedule_free_count", reschedule_usd: "=reschedule_fee_usd", cancel_notice_hours: "=member_cancellation_notice_hours", cancel_usd: "=member_cancellation_fee_usd", hold_max_days: "=weather_hold_max_days", rain_out_recharge: "=rain_out_recharge_allowed"}
        Variable Rate Prescription Plan: {free_reschedules: "=reschedule_free_count", reschedule_usd: "=reschedule_fee_usd", cancel_notice_hours: "=member_cancellation_notice_hours", cancel_usd: "=member_cancellation_fee_usd", hold_max_days: "=weather_hold_max_days", rain_out_recharge: "=rain_out_recharge_allowed"}
        Precision Partner Whole-Farm Plan: {free_reschedules: "=reschedule_free_count", reschedule_usd: "=reschedule_fee_usd", cancel_notice_hours: "=member_cancellation_notice_hours", cancel_usd: "=member_cancellation_fee_usd", hold_max_days: "=weather_hold_max_days", rain_out_recharge: "=rain_out_recharge_allowed"}
        Certified Anhydrous Application Plan: {free_reschedules: "=reschedule_free_count", reschedule_usd: "=reschedule_fee_usd", cancel_notice_hours: "=member_cancellation_notice_hours", cancel_usd: "=member_cancellation_fee_usd", hold_max_days: "=weather_hold_max_days", rain_out_recharge: "=rain_out_recharge_allowed"}

  - id: custom_billing_and_credits
    subject: [custom_credit_issued]
    rule: >
      Acre charges are invoiced to the member's service account on the programme's terms in calendar days from the
      invoice date. A credit is written where a pass was billed for more acres than the guidance record shows, where a
      pass was run on the wrong field, or where rework is done inside the programme's free rework period on acres
      within the programme's rework allowance. A credit is written against the work order the charge was raised on, so
      a member disputing two passes gets two credits, and never against the account as a whole. Rework beyond the
      allowance, or after the free period, is billed as a fresh pass at the plan's rate. A drift complaint is taken
      within the programme's complaint window counted in calendar days from the work date, and a complaint outside that
      window is not taken at the desk at all. Whether a drift complaint results in a credit, and how much, is settled
      by the cooperative's insurer and the state's pesticide authority rather than by any rule here, and the desk
      records the complaint and says so.
    eligibility:
      - id: complaint_inside_window
        applies_to: [custom_credit_issued]
        kind: time
        condition: A drift complaint is taken within the programme's complaint window counted in calendar days from the work date, and a complaint outside that window is not taken at the desk at all.
        evidence_fields: [custom_workorders.work_date, custom_workorders.workorder_number, custom_workorders.field_name]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [custom_workorders.workorder_number]
          action_bindings:
            custom_workorders.workorder_number: workorder_number
        temporal_basis:
          clock: frozen_time
          anchor_event: the work date
          anchor_source: custom_workorders.work_date
          relation: not_after
          duration_source: variants.drift_complaint_window_days
          unit: calendar_days
          counting_rule: counted in calendar days from the work date
          boundary: inclusive
    params:
      per_tier:
        Per-Acre Custom Application: {terms_days: "=invoice_terms_days", rework_pct: "=rework_allowance_pct", rework_days: "=rework_free_within_days", complaint_days: "=drift_complaint_window_days"}
        Season Commitment Application Plan: {terms_days: "=invoice_terms_days", rework_pct: "=rework_allowance_pct", rework_days: "=rework_free_within_days", complaint_days: "=drift_complaint_window_days"}
        Full-Service Agronomy Plan: {terms_days: "=invoice_terms_days", rework_pct: "=rework_allowance_pct", rework_days: "=rework_free_within_days", complaint_days: "=drift_complaint_window_days"}
        Variable Rate Prescription Plan: {terms_days: "=invoice_terms_days", rework_pct: "=rework_allowance_pct", rework_days: "=rework_free_within_days", complaint_days: "=drift_complaint_window_days"}
        Precision Partner Whole-Farm Plan: {terms_days: "=invoice_terms_days", rework_pct: "=rework_allowance_pct", rework_days: "=rework_free_within_days", complaint_days: "=drift_complaint_window_days"}
        Certified Anhydrous Application Plan: {terms_days: "=invoice_terms_days", rework_pct: "=rework_allowance_pct", rework_days: "=rework_free_within_days", complaint_days: "=drift_complaint_window_days"}
    measures: [custom_msr_days_since_pass]

  - id: custom_prescription_and_licence
    subject: [custom_workorder_opened, custom_plan_updated]
    rule: >
      On plans the catalogue marks as requiring one, a current variable-rate prescription is on file before any pass is
      written, and a prescription is current for the programme's validity period in calendar days from the day it was
      written. A prescription resting on a soil test older than the programme's soil test validity in months is not
      current whatever its own date. Restricted-use product is applied only under plans the catalogue allows it on and
      only by an applicator whose licence has been verified for the crop year, and the verification comes from the
      licence record rather than from the applicator's assurance. The re-entry interval for the product applied is
      recorded on the work order and the field is closed for the programme's interval in hours from the end of the
      pass; nobody at the desk shortens it. Where a prescription lapses part way through a season the plan stays live
      but no further passes are written on prescription operations until a fresh prescription is filed, and passes on
      flat-rate operations carry on as usual.
    eligibility:
      - id: current_prescription_on_file
        applies_to: [custom_workorder_opened]
        kind: authorization
        condition: On plans the catalogue marks as requiring one, a current variable-rate prescription is on file before any pass is written, and a prescription is current for the programme's validity period in calendar days from the day it was written.
        evidence_fields: [custom_service_plans.prescription_on_file, custom_service_plans.variant_name, custom_service_plans.plan_number]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [custom_service_plans.plan_number]
          action_bindings:
            custom_service_plans.plan_number: plan_number
    params:
      per_tier:
        Per-Acre Custom Application: {needs_prescription: "=prescription_required", validity_days: "=prescription_validity_days", soil_test_months: "=soil_test_validity_months", licence_required: "=applicator_license_required", restricted_use: "=restricted_use_product_allowed", reentry_hours: "=reentry_interval_hours"}
        Season Commitment Application Plan: {needs_prescription: "=prescription_required", validity_days: "=prescription_validity_days", soil_test_months: "=soil_test_validity_months", licence_required: "=applicator_license_required", restricted_use: "=restricted_use_product_allowed", reentry_hours: "=reentry_interval_hours"}
        Full-Service Agronomy Plan: {needs_prescription: "=prescription_required", validity_days: "=prescription_validity_days", soil_test_months: "=soil_test_validity_months", licence_required: "=applicator_license_required", restricted_use: "=restricted_use_product_allowed", reentry_hours: "=reentry_interval_hours"}
        Variable Rate Prescription Plan: {needs_prescription: "=prescription_required", validity_days: "=prescription_validity_days", soil_test_months: "=soil_test_validity_months", licence_required: "=applicator_license_required", restricted_use: "=restricted_use_product_allowed", reentry_hours: "=reentry_interval_hours"}
        Precision Partner Whole-Farm Plan: {needs_prescription: "=prescription_required", validity_days: "=prescription_validity_days", soil_test_months: "=soil_test_validity_months", licence_required: "=applicator_license_required", restricted_use: "=restricted_use_product_allowed", reentry_hours: "=reentry_interval_hours"}
        Certified Anhydrous Application Plan: {needs_prescription: "=prescription_required", validity_days: "=prescription_validity_days", soil_test_months: "=soil_test_validity_months", licence_required: "=applicator_license_required", restricted_use: "=restricted_use_product_allowed", reentry_hours: "=reentry_interval_hours"}

  - id: custom_lifecycle_progression
    subject: [custom_plan_activated, custom_plan_completed, custom_plan_cancelled]
    rule: >
      A plan is accepted for the crop year once its entry gate is met, and only an accepted plan has work released
      against it. It completes when acres worked reach the acres committed and every completed pass has been billed, so
      a plan with an unbilled pass stays open however finished the fields look. The member may withdraw an application
      before acceptance at no charge, and may cancel the remaining work on a live plan at any time, in which case the
      season commitment shortfall charge is worked out on the acres not worked. Where a weather hold runs past the end
      of the season the cooperative cancels the remaining acres itself and the shortfall charge is waived, because the
      work could not be done. Completed and cancelled are both terminal, and acres a member wants worked afterwards go
      onto a new plan at the day's rates. A plan never carries over into the next crop year, because the rates and the
      commitment are written for one season.
    eligibility: []
    params:
      completion_requires: [committed_acres_worked, every_pass_billed]

  - id: custom_plan_maintenance
    subject: [custom_plan_updated]
    rule: >
      Enrolled acres are rewritten on the member's own statement of what they are farming, and raising them is taken
      freely while the plan's acre ceiling allows it, while lowering them below the acres already worked is refused
      outright. The last day of the service window may be moved out only within the programme's window length, and
      moving it further is a fresh plan rather than an amendment. The home field is the member's own fact and is
      rewritten on their word. A prescription or a licence verification is recorded only from the document itself,
      never from what the member or the applicator says about it. A plan is updated only while it stands in applied,
      active or weather_hold, since a completed or cancelled plan is closed to change.
    eligibility:
      - id: plan_open_for_maintenance
        applies_to: [custom_plan_updated]
        kind: state
        condition: A plan is updated only while it stands in applied, active or weather_hold, since a completed or cancelled plan is closed to change.
        evidence_fields: [custom_service_plans.status, custom_service_plans.plan_number]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys:
            - [custom_service_plans.plan_number]
          action_bindings:
            custom_service_plans.plan_number: plan_number
        state_contract:
          field: custom_service_plans.status
          allowed: [applied, active, weather_hold]
    params:
      acres_basis: the_members_own_statement_of_acres_farmed
    measures: [custom_msr_season_service_dollars]
