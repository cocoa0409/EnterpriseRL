events:
  - type: energy_account_opened
    target: energy_accounts
    mutation: create
    meaning: a member applies for a refined fuels or propane account under one of the delivery programmes and the account record is opened in applied standing
    grain: one row per energy account applied for
    fields:
      energy_account_id: internal reference of the account being opened
      customer_id: the member the account belongs to
      variant_name: the delivery programme applied for
      status: lifecycle standing the account opens in, which is always applied
      account_number: the account number printed on delivery tickets and statements
      product: the fuel the account is set up to receive
      tank_size_gallons: water capacity of the tank that will serve the account
      tank_ownership: who owns the tank
      delivery_route: the route the tank sits on
      contract_gallons: gallons booked ahead, which at opening is zero
      contract_price_per_gallon: the price contracted gallons draw at, which at opening is zero
      budget_monthly_amount: the level monthly instalment, which at opening is zero
      current_gallons_owed: contracted gallons still owed, which at opening is zero
      account_balance: money owed, which at opening is zero
      opened_date: date the application was taken
      keep_full_enrolled: whether the tank is on the automatic keep-full schedule
    triggers: []

  - type: energy_account_activated
    target: energy_accounts
    mutation: {transition: {from: applied, to: active}}
    meaning: the tank is set or the account is approved and deliveries may begin
    grain: one row per energy account brought into service
    fields:
      status: the standing the account moves to
      tank_rent_due_date: the date annual tank rent first falls due
      last_delivery_date: the date of the first delivery where one was made at the set
    triggers: []

  - type: energy_contract_gallons_booked
    target: energy_deliveries
    meaning: a member books gallons ahead at a fixed price and the gallons are put to their credit
    grain: one row per pre-buy booking taken on the account
    distinguish_by: [contract_reference, delivery_date]
    fields:
      delivery_id: internal reference of the energy account row
      energy_account_id: the account the booking is held on
      customer_id: the member booking gallons
      event_type: the event family this row records
      contract_reference: the pre-buy booking reference
      delivery_date: the date the booking was taken
      product: the fuel booked
      gallons: gallons booked ahead
      price_per_gallon: the price the booked gallons draw at
      amount: money committed on the booking
      payment_reference: the remittance reference the booking money came in on
      payment_method: how the member paid for the booking
      posted_date: the date the row was posted to the energy account
    account: contract_gallons
    direction: in
    triggers: []

  - type: energy_delivery_made
    target: energy_deliveries
    meaning: the truck makes a stop and pumps fuel into the member's tank
    grain: one row per delivery ticket written at one stop
    distinguish_by: [ticket_number, delivery_date]
    fields:
      delivery_id: internal reference of the energy account row
      energy_account_id: the account delivered to
      customer_id: the member delivered to
      event_type: the event family this row records
      ticket_number: the delivery ticket the driver left
      delivery_date: the date the truck delivered
      product: the fuel delivered
      delivery_type: how the stop was ordered
      gallons: gallons pumped
      price_per_gallon: the price the gallons were billed at
      amount: money billed for the fuel
      meter_start: truck meter reading before pumping
      meter_stop: truck meter reading after pumping
      driver_name: the driver who made the stop
      tank_percent_before: tank gauge reading before pumping
      tank_percent_after: tank gauge reading after pumping
      invoice_number: the energy invoice the delivery was billed on
      posted_date: the date the row was posted to the energy account
    account: fuel_receivable
    direction: in
    triggers:
      - event: energy:energy_contract_gallons_drawn
        when: {delivery_type: contract_fill}
        map: {energy_account_id: energy_account_id, customer_id: customer_id, ticket_number: ticket_number, gallons: gallons, product: product, delivery_date: delivery_date}
      - event: energy:energy_fee_charged
        when: {delivery_type: [after_hours, emergency]}
        map: {energy_account_id: energy_account_id, customer_id: customer_id, ticket_number: ticket_number, fee_type: after_hours, delivery_date: delivery_date}
      - event: patronage:patronage_units_accrued
        map: {customer_id: customer_id, patronage_units: gallons, allocation_basis: energy_gallons, entry_date: delivery_date}

  - type: energy_contract_gallons_drawn
    target: energy_deliveries
    meaning: gallons pumped on a stop are drawn against the member's pre-buy booking rather than billed at the posted price
    grain: one drawdown against one pre-buy booking on one delivery ticket
    distinguish_by: [ticket_number, contract_reference]
    fields:
      delivery_id: internal reference of the energy account row
      energy_account_id: the account drawn on
      customer_id: the member drawn on
      event_type: the event family this row records
      contract_reference: the pre-buy booking drawn against
      ticket_number: the delivery ticket the gallons were pumped on
      delivery_date: the date the gallons were drawn
      product: the fuel drawn
      gallons: gallons drawn out of the booking
      price_per_gallon: the contracted price the gallons drew at
      amount: money applied against the booking
      posted_date: the date the row was posted to the energy account
    account: contract_gallons
    direction: out
    triggers: []

  - type: energy_fee_charged
    target: energy_deliveries
    meaning: a tank, regulatory or delivery fee is raised against the account
    grain: one fee of one class on one stop or one billing occasion
    distinguish_by: [fee_type, delivery_date, ticket_number]
    fields:
      delivery_id: internal reference of the energy account row
      energy_account_id: the account charged
      customer_id: the member charged
      event_type: the event family this row records
      fee_type: which class of fee this row carries
      fee_amount: the fee charged
      amount: money added to what is owed
      delivery_date: the date the fee was raised
      ticket_number: the delivery ticket the fee attaches to, where it attaches to one
      invoice_number: the energy invoice the fee was billed on
      posted_date: the date the row was posted to the energy account
    account: fuel_receivable
    direction: in
    triggers: []

  - type: energy_budget_installment_billed
    target: energy_deliveries
    meaning: one month of a level payment plan is billed to the account
    grain: one instalment for one budget month on one account
    distinguish_by: [billing_month, invoice_number]
    fields:
      delivery_id: internal reference of the energy account row
      energy_account_id: the account billed
      customer_id: the member billed
      event_type: the event family this row records
      billing_month: the budget plan month the instalment covers
      amount: the instalment billed
      delivery_date: the date the instalment was raised
      invoice_number: the energy invoice the instalment was billed on
      payment_method: how the instalment is collected
      posted_date: the date the row was posted to the energy account
    account: fuel_receivable
    direction: in
    triggers: []

  - type: energy_payment_posted
    target: energy_deliveries
    meaning: the member pays money against the energy account
    grain: one payment applied to one energy invoice
    distinguish_by: [payment_reference, invoice_number]
    fields:
      delivery_id: internal reference of the energy account row
      energy_account_id: the account paid on
      customer_id: the member paying
      event_type: the event family this row records
      invoice_number: the invoice the payment is applied to
      payment_reference: the remittance reference of the payment
      payment_method: how the payment reached the cooperative
      amount: money applied on this row
      delivery_date: the date the payment was received
      posted_date: the date the payment was posted to the energy account
    account: fuel_receivable
    direction: out
    triggers: []

  - type: energy_price_protection_credited
    target: energy_deliveries
    meaning: the posted price falls below the protected floor on contracted gallons and the difference is credited back to the member
    grain: one protection credit against one pre-buy booking for one month
    distinguish_by: [contract_reference, delivery_date]
    fields:
      delivery_id: internal reference of the energy account row
      energy_account_id: the account credited
      customer_id: the member credited
      event_type: the event family this row records
      contract_reference: the pre-buy booking the protection attaches to
      delivery_date: the date the credit was worked out
      product: the fuel the credit concerns
      gallons: gallons the credit was computed on
      price_per_gallon: the posted price the credit was measured against
      amount: money credited to the account
      posted_date: the date the row was posted to the energy account
    account: fuel_receivable
    direction: out
    triggers: []

  - type: energy_seasonal_hold_set
    target: energy_accounts
    mutation: {transition: [{from: active, to: seasonal_hold}, {from: seasonal_hold, to: active}]}
    meaning: the member puts deliveries on hold for the off season and later calls the account back into service
    grain: one row per hold placed or lifted on the account
    fields:
      status: the standing the account moves to
      keep_full_enrolled: whether the automatic schedule is suspended or restored
      last_delivery_date: the date of the last delivery before the change
    triggers: []

  - type: energy_account_past_due_flagged
    target: energy_accounts
    mutation: {transition: [{from: active, to: past_due}, {from: past_due, to: active}]}
    meaning: the account is flagged past due when an invoice passes its due date, and comes back when the overdue balance is cleared
    grain: one row per change in the account's past-due standing
    fields:
      status: the standing the account moves to
      account_balance: the balance owed at the time of the change
    triggers: []

  - type: energy_account_updated
    target: energy_accounts
    mutation: update
    meaning: the tank, the route, the schedule or the plan particulars on a live account are rewritten
    grain: one row per recorded change to the account's own particulars
    fields:
      tank_size_gallons: the revised tank capacity
      tank_ownership: the revised ownership of the tank
      delivery_route: the revised route the tank sits on
      keep_full_enrolled: whether the tank is now on the automatic schedule
      budget_monthly_amount: the revised level monthly instalment
      contract_price_per_gallon: the revised contracted price
      tank_rent_due_date: the revised date tank rent falls due
      last_delivery_date: the date of the most recent delivery
    triggers: []

  - type: energy_account_closed
    target: energy_accounts
    mutation: {transition: [{from: active, to: closed}, {from: seasonal_hold, to: closed}, {from: past_due, to: closed}]}
    meaning: the account is closed at the member's request or written over to the credit department
    grain: one row per energy account closed
    fields:
      status: the standing the account moves to
      closed_date: the date the account closed
      account_balance: the balance owed when the account closed
      current_gallons_owed: contracted gallons still owed when the account closed
    triggers: []

  - type: energy_tank_removed
    target: energy_accounts
    mutation: {transition: {from: closed, to: tank_removed}}
    meaning: the cooperative pulls its tank from the site and the account is finished
    grain: one row per tank pulled
    fields:
      status: the standing the account moves to
      tank_ownership: who owned the tank that was pulled
      closed_date: the date the tank was pulled
    triggers: []

measures:
  - id: energy_msr_rolling_year_gallons
    window: the twelve calendar months ending on the last day of the month before the handling date
    measure: sum of gallons over the member's energy_delivery_made rows on the account in that window
  - id: energy_msr_days_since_last_delivery
    window: from the last delivery date on the account through the handling date, the delivery date counting as day zero
    measure: count of calendar days since the tank was last filled
  - id: energy_msr_contract_gallons_remaining
    window: the pre-buy booking as it stands on the handling date
    measure: gallons booked less gallons already drawn against the booking
  - id: energy_msr_budget_plan_paid_to_date
    window: from the start of the current budget plan year through the handling date
    measure: sum of amount over the member's energy_payment_posted rows made by budget draft in that window

policies:
  - id: energy_agg_multi_holding
    subject: [energy_account_opened]
    rule: >
      A member may hold up to four energy accounts at once, counting every account that is not closed, because a farm
      ordinarily runs a propane tank at the house, another at the dryer, a farm diesel tank and a fleet fuelling
      arrangement, and each of those is its own tank on its own route. One account covers one fuel at one tank site,
      and a second account is never opened for the same fuel at the same site, because the gauge readings and the
      keep-full schedule would then contradict one another. A programme whose entry gate calls for a credit review is
      not opened until the credit department has recorded its decision on that member. A programme whose entry gate
      calls for a tank is not brought into service until the tank is set and the system has passed its leak check where
      the programme requires one, and that check is recorded by the service technician rather than taken from the
      member's assurance that the plumber has already been. The gallons a programme calls for as a yearly minimum are
      measured on the member's use over the previous twelve months, and a member below the minimum is written on the
      next programme down rather than refused fuel.
    eligibility:
      - id: leak_check_recorded
        applies_to: [energy_account_opened]
        kind: authorization
        condition: A programme whose entry gate calls for a tank is not brought into service until the tank is set and the system has passed its leak check where the programme requires one, and that check is recorded by the service technician rather than taken from the member's assurance that the plumber has already been.
        evidence_fields: [energy_orders.order_type, energy_orders.order_status, energy_orders.energy_order_id, energy_accounts.account_number]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [energy_orders.energy_order_id]
          action_bindings:
            energy_orders.energy_order_id: energy_order_id
    params:
      max_per_customer: 4
      uniqueness_basis: [product, tank_site]
    measures: [energy_msr_rolling_year_gallons]

  - id: energy_agg_across_accounts
    subject: [energy_delivery_made, energy_payment_posted]
    rule: >
      Credit and contracted gallons are looked at across the member's energy accounts together. The combined balance is
      what is owed on every energy account of the member that is not closed, and it is measured against the sum of the
      limits those accounts carry. A delivery is made only where the combined balance after it would stay at or under
      the combined limit, so a member at their ceiling on the house tank cannot be filled at the dryer instead.
      Contracted gallons, by contrast, are tied to the account and the fuel they were booked on and are never drawn at
      another account, because the booking was made against a particular product at a particular price. A payment that
      names no invoice is applied to the account it was received on, oldest invoice first, and is never spread across
      accounts. A member who also holds a live grain marketing contract may have their energy balance settled from
      grain proceeds where the programme allows the transfer, and where it does not, the member pays the energy account
      directly however the grain settles.
    eligibility:
      - id: account_live_for_delivery
        applies_to: [energy_delivery_made]
        kind: state
        condition: A delivery is made only where the combined balance after it would stay at or under the combined limit, so a member at their ceiling on the house tank cannot be filled at the dryer instead.
        evidence_fields: [energy_accounts.status, energy_accounts.account_balance, energy_accounts.account_number]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [energy_accounts.account_number]
          action_bindings:
            energy_accounts.account_number: account_number
        state_contract:
          field: energy_accounts.status
          allowed: [active, past_due]
    params:
      per_tier:
        Will-Call Propane Account: {limit_usd: "=credit_limit_usd", grain_transfer: "=grain_settlement_transfer_allowed"}
        Keep-Full Automatic Delivery Account: {limit_usd: "=credit_limit_usd", grain_transfer: "=grain_settlement_transfer_allowed"}
        Budget Payment Plan Account: {limit_usd: "=credit_limit_usd", grain_transfer: "=grain_settlement_transfer_allowed"}
        Contract Gallon Pre-Buy Account: {limit_usd: "=credit_limit_usd", grain_transfer: "=grain_settlement_transfer_allowed"}
        Bulk Farm Fuel Delivery Account: {limit_usd: "=credit_limit_usd", grain_transfer: "=grain_settlement_transfer_allowed"}
        Cardtrol Fleet Fueling Account: {limit_usd: "=credit_limit_usd", grain_transfer: "=grain_settlement_transfer_allowed"}

  - id: energy_delivery_scheduling
    subject: [energy_delivery_made, energy_seasonal_hold_set]
    rule: >
      How a stop is ordered decides when it happens and what it costs. On a keep-full programme the truck comes when
      the degree-day model or a gauge reading puts the tank at or below the programme's trigger percentage, and it
      fills to the programme's fill-to percentage rather than to the top, because room must be left for expansion. On a
      will-call programme nothing happens until the member calls, and the call needs the programme's notice in business
      days before the route is run; a member who calls on the day of the route is fitted in where the load allows and
      charged nothing extra, and one who cannot wait is delivered as an emergency at the emergency fee. A delivery
      under the programme's minimum gallons carries the minimum delivery fee, which is charged on the stop rather than
      per gallon. A tank that has run completely out is not refilled until a leak check has been done where the
      programme requires one, and the check is a service call in its own right. Deliveries are suspended while the
      account stands on seasonal hold, and a member on hold who calls for fuel is brought back into service first;
      seasonal hold runs no longer than the programme's hold maximum in calendar days from the day it was set, after
      which the account returns to service on its own.
    eligibility: []
    params:
      per_tier:
        Will-Call Propane Account: {trigger_pct: "=keep_full_trigger_percent", fill_to_pct: "=keep_full_fill_to_percent", notice_business_days: "=will_call_notice_business_days", minimum_gallons: "=minimum_delivery_gallons", hold_open: "=seasonal_hold_allowed", hold_max_days: "=seasonal_hold_max_days"}
        Keep-Full Automatic Delivery Account: {trigger_pct: "=keep_full_trigger_percent", fill_to_pct: "=keep_full_fill_to_percent", notice_business_days: "=will_call_notice_business_days", minimum_gallons: "=minimum_delivery_gallons", hold_open: "=seasonal_hold_allowed", hold_max_days: "=seasonal_hold_max_days"}
        Budget Payment Plan Account: {trigger_pct: "=keep_full_trigger_percent", fill_to_pct: "=keep_full_fill_to_percent", notice_business_days: "=will_call_notice_business_days", minimum_gallons: "=minimum_delivery_gallons", hold_open: "=seasonal_hold_allowed", hold_max_days: "=seasonal_hold_max_days"}
        Contract Gallon Pre-Buy Account: {trigger_pct: "=keep_full_trigger_percent", fill_to_pct: "=keep_full_fill_to_percent", notice_business_days: "=will_call_notice_business_days", minimum_gallons: "=minimum_delivery_gallons", hold_open: "=seasonal_hold_allowed", hold_max_days: "=seasonal_hold_max_days"}
        Bulk Farm Fuel Delivery Account: {trigger_pct: "=keep_full_trigger_percent", fill_to_pct: "=keep_full_fill_to_percent", notice_business_days: "=will_call_notice_business_days", minimum_gallons: "=minimum_delivery_gallons", hold_open: "=seasonal_hold_allowed", hold_max_days: "=seasonal_hold_max_days"}
        Cardtrol Fleet Fueling Account: {trigger_pct: "=keep_full_trigger_percent", fill_to_pct: "=keep_full_fill_to_percent", notice_business_days: "=will_call_notice_business_days", minimum_gallons: "=minimum_delivery_gallons", hold_open: "=seasonal_hold_allowed", hold_max_days: "=seasonal_hold_max_days"}
    measures: [energy_msr_days_since_last_delivery]

  - id: energy_pricing
    subject: [energy_delivery_made, energy_contract_gallons_drawn]
    rule: >
      What a gallon costs is fixed by the programme's price basis and by whether contracted gallons remain, and it is
      never negotiated on the truck. Where the programme prices at the posted price, the price is the day's rack for
      the product plus the programme's margin, taken on the day the fuel was pumped and not the day the invoice was
      cut. Where the programme prices at the contracted price, gallons draw at the booked price until the booking is
      exhausted and at the posted price afterwards, and the two are shown as separate rows on the same ticket so that a
      part-contracted fill is never averaged into one price. Contracted gallons are drawn oldest booking first and only
      against the product and the account they were booked on. Where the tank is filled on a keep-full schedule and a
      booking exists, the booking is drawn automatically without the member having to ask. A member who believes they
      should have been charged the contracted price on a stop already billed is answered from the booking record and
      the ticket, and where the booking was genuinely exhausted the posted price stands.
    eligibility: []
    params:
      drawdown_order: oldest_booking_first
      per_tier:
        Will-Call Propane Account: {basis: "=price_basis", margin_usd: "=posted_price_margin_per_gallon_usd"}
        Keep-Full Automatic Delivery Account: {basis: "=price_basis", margin_usd: "=posted_price_margin_per_gallon_usd"}
        Budget Payment Plan Account: {basis: "=price_basis", margin_usd: "=posted_price_margin_per_gallon_usd"}
        Contract Gallon Pre-Buy Account: {basis: "=price_basis", margin_usd: "=posted_price_margin_per_gallon_usd"}
        Bulk Farm Fuel Delivery Account: {basis: "=price_basis", margin_usd: "=posted_price_margin_per_gallon_usd"}
        Cardtrol Fleet Fueling Account: {basis: "=price_basis", margin_usd: "=posted_price_margin_per_gallon_usd"}
    formula:
      amount: round(gallons * price_per_gallon, 2)
    measures: [energy_msr_contract_gallons_remaining]

  - id: energy_contract_gallons_program
    subject: [energy_contract_gallons_booked]
    rule: >
      Gallons are booked ahead only inside the programme's booking window, which opens and closes on the month and day
      the catalogue fixes, and only on programmes that carry pre-buy at all. A booking must reach the programme's
      minimum gallons and may not exceed the programme's ceiling as a share of the gallons the member took in the
      previous twelve months, because pre-buy is a commitment to use fuel and not a position in the market. A signed
      pre-buy booking is registered with the energy desk before the gallons are put to the member's credit, and the
      money is taken at the booking rather than at delivery. Gallons unused at the programme's expiry date are dealt
      with as the programme's treatment says, which on some programmes means crediting the member at the lower of the
      contracted and posted price and on others means rolling them into the following contract year; nothing is ever
      simply forfeited. A member who wants out of a booking before the gallons are drawn pays the programme's
      cancellation charge per gallon cancelled, and where the posted price has risen above the contracted price the
      cooperative does not pay the member the difference to release them.
    eligibility:
      - id: signed_prebuy_booking
        applies_to: [energy_contract_gallons_booked]
        kind: authorization
        condition: A signed pre-buy booking is registered with the energy desk before the gallons are put to the member's credit, and the money is taken at the booking rather than at delivery.
        evidence_fields: [energy_orders.order_type, energy_orders.order_status, energy_orders.signed_by_member, energy_orders.energy_order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [energy_orders.energy_order_id]
          action_bindings:
            energy_orders.energy_order_id: energy_order_id
    params:
      per_tier:
        Will-Call Propane Account: {window_open: "=contract_booking_window_open_month_day", window_close: "=contract_booking_window_close_month_day", minimum_gallons: "=contract_gallons_minimum", ceiling_pct: "=contract_gallons_maximum_pct_of_prior_year", expiry: "=contract_gallons_expiry_month_day", unused_treatment: "=unused_contract_gallons_treatment", cancel_fee_usd: "=contract_cancellation_fee_per_gallon_usd"}
        Keep-Full Automatic Delivery Account: {window_open: "=contract_booking_window_open_month_day", window_close: "=contract_booking_window_close_month_day", minimum_gallons: "=contract_gallons_minimum", ceiling_pct: "=contract_gallons_maximum_pct_of_prior_year", expiry: "=contract_gallons_expiry_month_day", unused_treatment: "=unused_contract_gallons_treatment", cancel_fee_usd: "=contract_cancellation_fee_per_gallon_usd"}
        Budget Payment Plan Account: {window_open: "=contract_booking_window_open_month_day", window_close: "=contract_booking_window_close_month_day", minimum_gallons: "=contract_gallons_minimum", ceiling_pct: "=contract_gallons_maximum_pct_of_prior_year", expiry: "=contract_gallons_expiry_month_day", unused_treatment: "=unused_contract_gallons_treatment", cancel_fee_usd: "=contract_cancellation_fee_per_gallon_usd"}
        Contract Gallon Pre-Buy Account: {window_open: "=contract_booking_window_open_month_day", window_close: "=contract_booking_window_close_month_day", minimum_gallons: "=contract_gallons_minimum", ceiling_pct: "=contract_gallons_maximum_pct_of_prior_year", expiry: "=contract_gallons_expiry_month_day", unused_treatment: "=unused_contract_gallons_treatment", cancel_fee_usd: "=contract_cancellation_fee_per_gallon_usd"}
        Bulk Farm Fuel Delivery Account: {window_open: "=contract_booking_window_open_month_day", window_close: "=contract_booking_window_close_month_day", minimum_gallons: "=contract_gallons_minimum", ceiling_pct: "=contract_gallons_maximum_pct_of_prior_year", expiry: "=contract_gallons_expiry_month_day", unused_treatment: "=unused_contract_gallons_treatment", cancel_fee_usd: "=contract_cancellation_fee_per_gallon_usd"}
        Cardtrol Fleet Fueling Account: {window_open: "=contract_booking_window_open_month_day", window_close: "=contract_booking_window_close_month_day", minimum_gallons: "=contract_gallons_minimum", ceiling_pct: "=contract_gallons_maximum_pct_of_prior_year", expiry: "=contract_gallons_expiry_month_day", unused_treatment: "=unused_contract_gallons_treatment", cancel_fee_usd: "=contract_cancellation_fee_per_gallon_usd"}
    measures: [energy_msr_rolling_year_gallons]

  - id: energy_fees
    subject: [energy_fee_charged]
    rule: >
      Fees are raised on the occasion that gives rise to them and never bundled into the price of the fuel. Annual tank
      rent falls due on the account's rent due date on programmes where the cooperative owns the tank, and it is waived
      outright for the year where the member's purchases in the twelve months ending on that date reach the programme's
      waiver gallons; a member just short of the waiver is charged the whole rent and not a part of it. The regulatory
      handling charge is raised once per delivery on programmes that carry it. An after-hours or emergency stop carries
      its fee once per stop, and where a stop is both after hours and off route both fees are charged, because they pay
      for different things. The minimum delivery fee is raised where the gallons pumped fall under the programme's
      minimum, and it is not raised where the tank simply would not take more. No fee is raised on a programme whose
      catalogue sets it at zero, and such a fee is not shown as a nil line on the statement. A fee already charged is
      reversed only where the stop itself is reversed or where the cooperative's own error caused it.
    eligibility: []
    params:
      stacking_basis: fees_of_different_classes_add
      per_tier:
        Will-Call Propane Account: {tank_rent_usd: "=tank_rent_annual_usd", waiver_gallons: "=tank_rent_waiver_gallons_per_year", hazmat_usd: "=hazmat_fee_per_delivery_usd", after_hours_usd: "=after_hours_delivery_fee_usd", out_of_route_usd: "=out_of_route_delivery_fee_usd", minimum_delivery_usd: "=delivery_minimum_fee_usd"}
        Keep-Full Automatic Delivery Account: {tank_rent_usd: "=tank_rent_annual_usd", waiver_gallons: "=tank_rent_waiver_gallons_per_year", hazmat_usd: "=hazmat_fee_per_delivery_usd", after_hours_usd: "=after_hours_delivery_fee_usd", out_of_route_usd: "=out_of_route_delivery_fee_usd", minimum_delivery_usd: "=delivery_minimum_fee_usd"}
        Budget Payment Plan Account: {tank_rent_usd: "=tank_rent_annual_usd", waiver_gallons: "=tank_rent_waiver_gallons_per_year", hazmat_usd: "=hazmat_fee_per_delivery_usd", after_hours_usd: "=after_hours_delivery_fee_usd", out_of_route_usd: "=out_of_route_delivery_fee_usd", minimum_delivery_usd: "=delivery_minimum_fee_usd"}
        Contract Gallon Pre-Buy Account: {tank_rent_usd: "=tank_rent_annual_usd", waiver_gallons: "=tank_rent_waiver_gallons_per_year", hazmat_usd: "=hazmat_fee_per_delivery_usd", after_hours_usd: "=after_hours_delivery_fee_usd", out_of_route_usd: "=out_of_route_delivery_fee_usd", minimum_delivery_usd: "=delivery_minimum_fee_usd"}
        Bulk Farm Fuel Delivery Account: {tank_rent_usd: "=tank_rent_annual_usd", waiver_gallons: "=tank_rent_waiver_gallons_per_year", hazmat_usd: "=hazmat_fee_per_delivery_usd", after_hours_usd: "=after_hours_delivery_fee_usd", out_of_route_usd: "=out_of_route_delivery_fee_usd", minimum_delivery_usd: "=delivery_minimum_fee_usd"}
        Cardtrol Fleet Fueling Account: {tank_rent_usd: "=tank_rent_annual_usd", waiver_gallons: "=tank_rent_waiver_gallons_per_year", hazmat_usd: "=hazmat_fee_per_delivery_usd", after_hours_usd: "=after_hours_delivery_fee_usd", out_of_route_usd: "=out_of_route_delivery_fee_usd", minimum_delivery_usd: "=delivery_minimum_fee_usd"}

  - id: energy_budget_plan
    subject: [energy_budget_installment_billed]
    rule: >
      A level payment plan spreads an estimated year of fuel over equal monthly instalments so the member is not billed
      the whole winter in January. The plan year begins on the programme's start date, runs for the programme's number
      of months, and is trued up on the programme's reconciliation date. The estimate is the member's gallons over the
      twelve months ending the month before enrolment, priced at the posted price on the day of enrolment, less any
      down payment the programme requires. Instalments are billed on the same day each month and are collected by
      draft where the member has authorised one. Fuel delivered is still billed at the price of the day and posted to
      the account, so the instalments pay down the balance rather than replacing the billing; the plan is a payment
      arrangement and not a fixed price. At reconciliation a member who has underpaid is billed the difference in one
      sum and a member who has overpaid is credited it, and the credit stands against next year's instalments rather
      than being refunded. A member who leaves the plan part way through the year is billed the whole outstanding
      balance at once, because the smoothing ends with the plan.
    eligibility: []
    params:
      estimate_basis: prior_twelve_months_gallons_at_the_posted_price_on_enrolment
      per_tier:
        Will-Call Propane Account: {plan_open: "=budget_plan_enabled", months: "=budget_plan_months", start: "=budget_plan_start_month_day", reconcile: "=budget_plan_reconciliation_month_day", down_payment_pct: "=budget_plan_down_payment_pct"}
        Keep-Full Automatic Delivery Account: {plan_open: "=budget_plan_enabled", months: "=budget_plan_months", start: "=budget_plan_start_month_day", reconcile: "=budget_plan_reconciliation_month_day", down_payment_pct: "=budget_plan_down_payment_pct"}
        Budget Payment Plan Account: {plan_open: "=budget_plan_enabled", months: "=budget_plan_months", start: "=budget_plan_start_month_day", reconcile: "=budget_plan_reconciliation_month_day", down_payment_pct: "=budget_plan_down_payment_pct"}
        Contract Gallon Pre-Buy Account: {plan_open: "=budget_plan_enabled", months: "=budget_plan_months", start: "=budget_plan_start_month_day", reconcile: "=budget_plan_reconciliation_month_day", down_payment_pct: "=budget_plan_down_payment_pct"}
        Bulk Farm Fuel Delivery Account: {plan_open: "=budget_plan_enabled", months: "=budget_plan_months", start: "=budget_plan_start_month_day", reconcile: "=budget_plan_reconciliation_month_day", down_payment_pct: "=budget_plan_down_payment_pct"}
        Cardtrol Fleet Fueling Account: {plan_open: "=budget_plan_enabled", months: "=budget_plan_months", start: "=budget_plan_start_month_day", reconcile: "=budget_plan_reconciliation_month_day", down_payment_pct: "=budget_plan_down_payment_pct"}
    measures: [energy_msr_budget_plan_paid_to_date, energy_msr_rolling_year_gallons]

  - id: energy_payments_and_arrears
    subject: [energy_payment_posted, energy_account_past_due_flagged]
    rule: >
      An energy invoice falls due the programme's terms in calendar days after the invoice date, a payment landing on
      the due date itself still being on time. An invoice still unpaid after the programme's grace period, counted in
      whole calendar days from the due date, carries the programme's late charge once and then the programme's monthly
      service charge for as long as it stands unpaid. The account is flagged past due from the first day an invoice is
      overdue, and further deliveries are held once the oldest overdue invoice reaches the programme's delivery hold in
      days; the hold stops fuel going out and does not stop the budget plan being billed. Payments may reach the
      cooperative only by the methods the programme allows and are applied oldest invoice first unless the member names
      an invoice. Where a member has elected to have grain settlement proceeds credited to the energy account and the
      programme allows the transfer, the whole net of that settlement lands as one payment on the settlement date. A
      delivery hold is lifted only when the overdue balance is cleared; the cooperative makes an exception for a tank
      that is out of fuel in freezing weather, which is a safety judgement for the energy manager and not a matter
      this rule settles.
    eligibility:
      - id: late_charge_after_grace
        applies_to: [energy_payment_posted]
        kind: time
        condition: An invoice still unpaid after the programme's grace period, counted in whole calendar days from the due date, carries the programme's late charge once and then the programme's monthly service charge for as long as it stands unpaid.
        evidence_fields: [energy_deliveries.delivery_date, energy_deliveries.invoice_number, energy_deliveries.amount]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [energy_deliveries.invoice_number]
          action_bindings:
            energy_deliveries.invoice_number: invoice_number
        temporal_basis:
          clock: frozen_time
          anchor_event: the due date
          anchor_source: energy_deliveries.delivery_date
          relation: not_before
          duration_source: variants.late_fee_grace_days
          unit: calendar_days
          counting_rule: counted in whole calendar days from the due date
          boundary: exclusive
    params:
      allocation_order: oldest_invoice_first
      per_tier:
        Will-Call Propane Account: {terms_days: "=payment_terms_days", grace_days: "=late_fee_grace_days", late_fee_usd: "=late_fee_usd", monthly_pct: "=finance_charge_monthly_pct", hold_days: "=past_due_delivery_hold_days"}
        Keep-Full Automatic Delivery Account: {terms_days: "=payment_terms_days", grace_days: "=late_fee_grace_days", late_fee_usd: "=late_fee_usd", monthly_pct: "=finance_charge_monthly_pct", hold_days: "=past_due_delivery_hold_days"}
        Budget Payment Plan Account: {terms_days: "=payment_terms_days", grace_days: "=late_fee_grace_days", late_fee_usd: "=late_fee_usd", monthly_pct: "=finance_charge_monthly_pct", hold_days: "=past_due_delivery_hold_days"}
        Contract Gallon Pre-Buy Account: {terms_days: "=payment_terms_days", grace_days: "=late_fee_grace_days", late_fee_usd: "=late_fee_usd", monthly_pct: "=finance_charge_monthly_pct", hold_days: "=past_due_delivery_hold_days"}
        Bulk Farm Fuel Delivery Account: {terms_days: "=payment_terms_days", grace_days: "=late_fee_grace_days", late_fee_usd: "=late_fee_usd", monthly_pct: "=finance_charge_monthly_pct", hold_days: "=past_due_delivery_hold_days"}
        Cardtrol Fleet Fueling Account: {terms_days: "=payment_terms_days", grace_days: "=late_fee_grace_days", late_fee_usd: "=late_fee_usd", monthly_pct: "=finance_charge_monthly_pct", hold_days: "=past_due_delivery_hold_days"}

  - id: energy_price_protection
    subject: [energy_price_protection_credited]
    rule: >
      Downside protection is sold with a pre-buy booking on programmes that carry it, at the programme's fee per gallon
      charged when the booking is taken, and it cannot be added to a booking afterwards. It works one way only. Where
      the posted price for the product falls below the programme's floor percentage of the price the gallons were
      booked at, the member is credited the difference between the floor and the posted price on the gallons still
      undrawn, measured on the last trading day of the month. Where the posted price stays at or above the floor
      nothing is credited and the fee is not returned. The credit attaches to the booking it was sold with and is
      applied to the account rather than paid out, and it does not change the price the remaining gallons draw at,
      which is still the booked price. Protection ends when the booking is exhausted, when the gallons expire, or when
      the booking is cancelled, and no credit is worked out after that. A member asking for protection against the
      price rising has misunderstood the product, and nothing in the catalogue offers it.
    eligibility: []
    params:
      measurement_day: last_trading_day_of_the_month
      per_tier:
        Will-Call Propane Account: {offered: "=price_protection_enabled", fee_usd: "=price_protection_fee_per_gallon_usd", floor_pct: "=price_protection_floor_pct"}
        Keep-Full Automatic Delivery Account: {offered: "=price_protection_enabled", fee_usd: "=price_protection_fee_per_gallon_usd", floor_pct: "=price_protection_floor_pct"}
        Budget Payment Plan Account: {offered: "=price_protection_enabled", fee_usd: "=price_protection_fee_per_gallon_usd", floor_pct: "=price_protection_floor_pct"}
        Contract Gallon Pre-Buy Account: {offered: "=price_protection_enabled", fee_usd: "=price_protection_fee_per_gallon_usd", floor_pct: "=price_protection_floor_pct"}
        Bulk Farm Fuel Delivery Account: {offered: "=price_protection_enabled", fee_usd: "=price_protection_fee_per_gallon_usd", floor_pct: "=price_protection_floor_pct"}
        Cardtrol Fleet Fueling Account: {offered: "=price_protection_enabled", fee_usd: "=price_protection_fee_per_gallon_usd", floor_pct: "=price_protection_floor_pct"}

  - id: energy_account_maintenance
    subject: [energy_account_updated]
    rule: >
      The route a tank sits on is set by where the tank is and is changed only when the tank moves, not because the
      member would prefer a different delivery day. A change of tank size is a service call and a fresh leak check
      where the programme requires one, and the new capacity is recorded from the technician's work order. Enrolling or
      leaving the automatic keep-full schedule is the member's own decision and takes effect from the next route run
      rather than immediately. The level monthly instalment is rewritten only at enrolment and at the plan
      reconciliation, never on request part way through a plan year, because the instalments are what spread the
      estimate. The contracted price on the account is written from the booking and is never edited on its own. Tank
      rent's due date moves only when a tank is set, pulled or relocated. An account is updated only while it stands in
      active, seasonal_hold or past_due, since a closed account is finished.
    eligibility:
      - id: account_live_for_maintenance
        applies_to: [energy_account_updated]
        kind: state
        condition: An account is updated only while it stands in active, seasonal_hold or past_due, since a closed account is finished.
        evidence_fields: [energy_accounts.status, energy_accounts.account_number]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [energy_accounts.account_number]
          action_bindings:
            energy_accounts.account_number: account_number
        state_contract:
          field: energy_accounts.status
          allowed: [active, seasonal_hold, past_due]
    params:
      keep_full_change_effect: from_the_next_route_run

  - id: energy_lifecycle_progression
    subject: [energy_account_activated, energy_account_closed, energy_tank_removed]
    rule: >
      An account comes into service when the tank is set and, where the programme requires it, the system has passed
      its leak check, and the tank set fee is charged at that point on programmes that carry one. A member closes an
      account of their own accord with nothing owing, no contracted gallons standing undrawn and no budget plan in
      mid-year; where contracted gallons stand undrawn they are dealt with under the programme's unused gallons
      treatment before the account can close. The cooperative closes a past-due account of its own motion by writing
      the balance over to the credit department, and the balance follows the member rather than being extinguished.
      Where the tank is the cooperative's it is pulled after closure at the programme's removal fee, the meter is read,
      the fuel left in the tank is credited to the member at the posted price on the day of removal, and the site is
      finished. A member-owned tank is not pulled and the account simply closes. A closed or finished account is
      terminal, and a member coming back needs a fresh application and a fresh tank set.
    eligibility: []
    params:
      closure_requires: [zero_balance, zero_undrawn_contract_gallons, no_budget_plan_in_mid_year]
      fuel_in_tank_on_removal: credited_at_the_posted_price_on_the_day_of_removal
