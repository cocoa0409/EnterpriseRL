category: energy
display_name: Refined Fuels and Propane Accounts

binding:
  holding_table: energy_accounts
  event_tables: [energy_deliveries]
  intake_tables: [energy_orders]
  status_field: status
  variant_field: variant_name
  quantity_fields:
    current_gallons_owed: contract_gallons
    account_balance: fuel_receivable

lifecycle:
  states: [applied, active, seasonal_hold, past_due, closed, tank_removed]
  transitions:
    - {from: applied, to: active, by: agent, means: the tank is set or the account is approved and deliveries may begin}
    - {from: active, to: seasonal_hold, by: user, means: the member puts deliveries on hold for the off season}
    - {from: seasonal_hold, to: active, by: agent, means: the member calls the account back into service}
    - {from: active, to: past_due, by: system, means: an invoice passes its due date unpaid}
    - {from: past_due, to: active, by: system, means: the overdue balance is cleared}
    - {from: active, to: closed, by: user, means: the member closes the account with nothing owing}
    - {from: seasonal_hold, to: closed, by: user, means: the member closes the account without bringing it back into service}
    - {from: past_due, to: closed, by: agent, means: the cooperative writes the account off to the credit department and closes it}
    - {from: closed, to: tank_removed, by: agent, means: the cooperative pulls its tank and the site is finished}

accounts:
  - key: contract_gallons
    unit: gallons
    meaning: gallons booked ahead at a fixed price and still owed to the member, credited when a booking is taken and debited as contracted gallons are drawn
  - key: fuel_receivable
    unit: USD
    meaning: money owed on the energy account, credited by deliveries, fees and budget instalments and debited by payments and price-protection credits

parameter_schema:
  tank_ownership_default: who ordinarily owns the tank on this programme (ownership basis)
  tank_rent_annual_usd: annual rent on a cooperative-owned tank (USD)
  tank_rent_waiver_gallons_per_year: gallons bought in a year at or above which tank rent is waived (gallons)
  minimum_delivery_gallons: smallest delivery the truck will make (gallons)
  delivery_minimum_fee_usd: charge on a delivery under the minimum (USD)
  keep_full_trigger_percent: tank gauge reading at or below which an automatic delivery is scheduled (percent)
  keep_full_fill_to_percent: tank gauge reading an automatic delivery fills to (percent)
  will_call_notice_business_days: business days of notice a called-in delivery needs
  emergency_delivery_fee_usd: charge for a delivery made outside the schedule at short notice (USD)
  after_hours_delivery_fee_usd: charge for a delivery made outside plant hours (USD)
  out_of_route_delivery_fee_usd: charge for a stop made off the tank's scheduled route (USD)
  hazmat_fee_per_delivery_usd: regulatory handling charge per delivery (USD)
  scheduled_route_days: how often the tank's route is run (route frequency)
  price_basis: how the price of an uncontracted gallon is arrived at (pricing basis)
  posted_price_margin_per_gallon_usd: margin over the day's rack added to arrive at the posted price (USD per gallon)
  contract_gallons_minimum: smallest pre-buy booking the programme will take (gallons)
  contract_gallons_maximum_pct_of_prior_year: ceiling on pre-buy gallons as a share of the member's prior-year use (percent)
  contract_booking_window_open_month_day: the month and day the pre-buy booking window opens (MM-DD)
  contract_booking_window_close_month_day: the month and day the pre-buy booking window closes (MM-DD)
  contract_gallons_expiry_month_day: the month and day unused contracted gallons expire on (MM-DD)
  unused_contract_gallons_treatment: what becomes of contracted gallons unused at expiry (treatment basis)
  contract_cancellation_fee_per_gallon_usd: charge for cancelling contracted gallons before they are drawn (USD per gallon)
  price_protection_enabled: whether the programme offers downside protection on contracted gallons (switch)
  price_protection_fee_per_gallon_usd: charge for downside protection (USD per gallon)
  price_protection_floor_pct: share of the contracted price below which the member is credited the difference (percent)
  budget_plan_enabled: whether the programme carries a level monthly payment plan (switch)
  budget_plan_months: how many monthly instalments the plan runs over (count)
  budget_plan_start_month_day: the month and day the plan year begins (MM-DD)
  budget_plan_reconciliation_month_day: the month and day the plan is trued up against actual use (MM-DD)
  budget_plan_down_payment_pct: share of the estimated year paid at enrolment (percent)
  payment_terms_days: payment terms counted in calendar days from the invoice date
  late_fee_usd: charge added when an invoice passes its grace period unpaid (USD)
  late_fee_grace_days: calendar days after the due date before the late charge is added
  finance_charge_monthly_pct: service charge on overdue balances (percent per month)
  past_due_delivery_hold_days: calendar days past due at which further deliveries are held
  credit_limit_usd: the unpaid balance this programme will carry (USD)
  payment_methods_allowed: how the member may pay on this programme (list of methods)
  grain_settlement_transfer_allowed: whether grain settlement proceeds may be credited onto this account (switch)
  tank_set_fee_usd: charge for setting a tank at the member's site (USD)
  tank_removal_fee_usd: charge for pulling a cooperative tank (USD)
  tank_relocation_fee_usd: charge for moving a tank to another site on the farm (USD)
  tank_inspection_interval_years: how often the tank and regulator are inspected (years)
  system_leak_check_required: whether a leak check is required before a tank that has run out is refilled (switch)
  minimum_annual_gallons: gallons a year below which the programme is not carried (gallons)
  seasonal_hold_allowed: whether deliveries may be put on hold for the off season (switch)
  seasonal_hold_max_days: longest deliveries may be held for the off season (calendar days)
  cardlock_access_enabled: whether the account carries unattended cardlock fuelling (switch)
  cardlock_transaction_fee_usd: charge per unattended cardlock transaction (USD)
  patronage_eligible: whether gallons bought on this programme earn patronage allocation (switch)
  per_unit_retain_per_gallon_usd: capital retained per gallon and credited to the member's equity account (USD per gallon)
  statement_delivery_method: how energy statements reach the member (channel)
  fuel_quality_guarantee: what the cooperative warrants about the product delivered (guarantee basis)

