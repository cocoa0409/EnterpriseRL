category: feed
display_name: Feed and Animal Nutrition Programmes

binding:
  holding_table: feed_programs
  event_tables: [feed_invoices]
  intake_tables: [feed_program_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields:
    tons_delivered: feed_tons

lifecycle:
  states: [applied, active, on_hold, suspended_vfd, closed]
  transitions:
    - {from: applied, to: active, by: agent, means: the mill accepts the programme and the ration goes onto the delivery schedule}
    - {from: active, to: on_hold, by: user, means: the member holds deliveries while the pens are empty}
    - {from: on_hold, to: active, by: agent, means: the member puts stock back on feed and deliveries resume}
    - {from: active, to: suspended_vfd, by: system, means: the veterinary feed directive behind a medicated ration lapses and the mill stops running it}
    - {from: suspended_vfd, to: active, by: agent, means: a current veterinary feed directive is filed and the ration resumes}
    - {from: active, to: closed, by: user, means: the member ends the programme with nothing owing}
    - {from: on_hold, to: closed, by: agent, means: the mill closes a programme that has stood on hold with no stock on feed}

accounts:
  - key: feed_tons
    unit: tons
    meaning: tons delivered under the programme, credited on each load and debited where tons are credited back
  - key: feed_receivable
    unit: USD
    meaning: money owed on the feed programme, credited when a load is invoiced and debited when the member pays

parameter_schema:
  minimum_order_tons: smallest order the mill will run for this programme (tons)
  maximum_bin_tons: most the bin serving the programme will hold (tons)
  program_enrollment_fee_usd: one-off charge for enrolling the programme (USD)
  price_basis: how the price of a ton is arrived at on this programme (pricing basis)
  bagged_price_per_ton_usd: price of bagged complete feed (USD per ton)
  bulk_price_per_ton_usd: price of bulk complete feed (USD per ton)
  custom_mix_charge_per_ton_usd: mixing charge on a member's own formula (USD per ton)
  mineral_price_per_ton_usd: price of mineral (USD per ton)
  milk_replacer_price_per_bag_usd: price of milk replacer (USD per bag)
  ingredient_price_basis: how contracted ingredients are priced (pricing basis)
  delivery_fee_per_load_usd: charge for delivering one load (USD)
  delivery_minimum_tons: tons at or above which delivery is carried at no charge (tons)
  delivery_frequency_default: how often the mill is scheduled to deliver on this programme (frequency)
  delivery_notice_business_days: business days of notice an order needs before the mill runs it
  after_hours_delivery_fee_usd: charge for a delivery taken outside mill hours (USD)
  bin_rental_monthly_usd: monthly rent on a mill-owned bin (USD)
  bin_cleanout_fee_usd: charge for cleaning a bin between rations (USD)
  ration_change_notice_days: calendar days of notice a ration change needs before the mill runs the new formula
  ration_changes_included_per_year: ration changes carried by the programme in a year at no charge (count)
  ration_change_fee_usd: charge for a ration change beyond the included count (USD)
  nutritionist_visits_included_per_year: farm visits by the nutritionist carried by the programme in a year (count)
  nutritionist_visit_fee_usd: charge for a visit beyond the included count (USD)
  feed_analysis_included_per_year: laboratory feed analyses carried by the programme in a year (count)
  feed_analysis_fee_usd: charge for an analysis beyond the included count (USD)
  medicated_feed_allowed: whether medicated rations may be run on this programme (switch)
  vfd_required: whether a veterinary feed directive must be on file before a medicated ration is run (switch)
  vfd_validity_days: calendar days a veterinary feed directive stays current for
  vfd_expiry_grace_days: calendar days after a directive expires within which a load already ordered may still be run
  withdrawal_period_tracking: whether the mill tracks withdrawal periods for the member (switch)
  ingredient_contract_allowed: whether ingredients may be contracted ahead on this programme (switch)
  ingredient_contract_minimum_tons: smallest ingredient contract the mill will take (tons)
  ingredient_contract_window_open_month_day: the month and day the ingredient contracting window opens (MM-DD)
  ingredient_contract_window_close_month_day: the month and day the ingredient contracting window closes (MM-DD)
  price_hold_days: calendar days a quoted price is held for before it is requoted
  invoice_terms_days: payment terms counted in calendar days from the invoice date
  late_fee_usd: charge added when an invoice passes its grace period unpaid (USD)
  late_fee_grace_days: calendar days after the due date before the late charge is added
  finance_charge_monthly_pct: service charge on overdue balances (percent per month)
  credit_limit_usd: the unpaid balance this programme will carry (USD)
  payment_methods_allowed: how the member may pay on this programme (list of methods)
  grain_settlement_transfer_allowed: whether grain settlement proceeds may be credited onto this account (switch)
  return_window_days: calendar days from the delivery date within which feed may be returned
  returnable_feed_types: which classes of feed may be returned at all (list of feed classes)
  shrink_allowance_pct: tolerance on the weight delivered before a claim is entertained (percent)
  weight_tolerance_pct: tolerance between the mill scale and the member's scale before a reweigh is ordered (percent)
  quality_guarantee: what the mill warrants about the ration delivered (guarantee basis)
  patronage_eligible: whether tons bought on this programme earn patronage allocation (switch)
  per_unit_retain_per_ton_usd: capital retained per ton and credited to the member's equity account (USD per ton)
  statement_delivery_method: how feed statements reach the member (channel)
  priority_mill_scheduling: where the programme sits in the mill's running order (priority band)

