events:
  - type: feed_program_opened
    target: feed_programs
    mutation: create
    meaning: a member enrols stock on a feed programme and the programme record is opened in applied standing
    grain: one row per feed programme enrolled
    fields:
      program_id: internal reference of the programme being opened
      customer_id: the member the programme belongs to
      variant_name: the feed programme enrolled in
      status: lifecycle standing the programme opens in, which is always applied
      program_number: the programme number quoted on delivery tickets
      species: the species the ration is formulated for
      head_count: head on feed under the programme
      ration_code: the mill formula code to be run
      delivery_frequency: how often the mill is scheduled to deliver
      bin_capacity_tons: capacity of the bin serving the programme
      opened_date: date the enrolment was taken
      nutritionist_assigned: the nutritionist assigned to the programme
      vfd_on_file: whether a current veterinary feed directive is on file
      tons_delivered: tons delivered so far, which at opening is zero
    triggers: []

  - type: feed_program_activated
    target: feed_programs
    mutation: {transition: {from: applied, to: active}}
    meaning: the mill accepts the programme and the ration goes onto the delivery schedule
    grain: one row per programme accepted by the mill
    fields:
      status: the standing the programme moves to
      ration_code: the formula code the mill will run
      delivery_frequency: the schedule the programme goes onto
    triggers: []

  - type: feed_order_placed
    target: feed_invoices
    meaning: the member orders a load of feed and the mill puts it into the running order
    grain: one row per order placed for one load
    distinguish_by: [delivery_ticket_number, invoice_date]
    fields:
      feed_invoice_id: internal reference of the feed programme row
      program_id: the programme the order is placed against
      customer_id: the member ordering
      event_type: the event family this row records
      invoice_date: the date the order was taken
      delivery_ticket_number: the ticket the load will be delivered on
      feed_type: the class of feed ordered
      tons: tons ordered
      ration_code: the formula code to be run
      medication_flag: whether the ration ordered carries a medicated additive
      vfd_reference: the veterinary feed directive the medicated ration will run under
      posted_date: the date the order was recorded
    triggers: []

  - type: feed_delivery_made
    target: feed_invoices
    meaning: the mill runs the ration and delivers a load to the member's bin
    grain: one row per load delivered on one mill ticket
    distinguish_by: [delivery_ticket_number, invoice_date]
    fields:
      feed_invoice_id: internal reference of the feed programme row
      program_id: the programme delivered to
      customer_id: the member delivered to
      event_type: the event family this row records
      invoice_date: the date the load was delivered
      delivery_ticket_number: the mill ticket the load went out on
      feed_type: the class of feed delivered
      tons: tons delivered
      ration_code: the formula code run
      medication_flag: whether the ration carried a medicated additive
      vfd_reference: the veterinary feed directive the ration ran under
      posted_date: the date the delivery was recorded
    account: feed_tons
    direction: in
    triggers:
      - event: feed:feed_invoice_issued
        map: {program_id: program_id, customer_id: customer_id, delivery_ticket_number: delivery_ticket_number, tons: tons, feed_type: feed_type, ration_code: ration_code, invoice_date: invoice_date}

  - type: feed_invoice_issued
    target: feed_invoices
    meaning: a delivered load is priced and invoiced to the member's feed account
    grain: one invoice for one delivered load
    distinguish_by: [invoice_number, delivery_ticket_number]
    fields:
      feed_invoice_id: internal reference of the feed programme row
      program_id: the programme billed
      customer_id: the member billed
      event_type: the event family this row records
      invoice_number: the feed invoice number raised
      invoice_date: the date the invoice was raised
      delivery_ticket_number: the mill ticket the load went out on
      feed_type: the class of feed billed
      tons: tons billed
      price_per_ton: the price per ton billed
      amount: money owed on the invoice
      ration_code: the formula code billed
      posted_date: the date the row was posted to the feed account
    account: feed_receivable
    direction: in
    triggers:
      - event: patronage:patronage_units_accrued
        map: {customer_id: customer_id, patronage_units: tons, allocation_basis: feed_tons, entry_date: invoice_date}

  - type: feed_payment_posted
    target: feed_invoices
    meaning: the member pays money against the feed account
    grain: one payment applied to one feed invoice
    distinguish_by: [payment_reference, invoice_number]
    fields:
      feed_invoice_id: internal reference of the feed programme row
      program_id: the programme paid on
      customer_id: the member paying
      event_type: the event family this row records
      invoice_number: the invoice the payment is applied to
      payment_reference: the remittance reference of the payment
      payment_method: how the payment reached the cooperative
      amount: money applied on this row
      invoice_date: the date the payment was received
      posted_date: the date the payment was posted to the feed account
    account: feed_receivable
    direction: out
    triggers: []

  - type: feed_ration_changed
    target: feed_invoices
    meaning: the formula the mill runs for the member is changed on the nutritionist's instruction
    grain: one ration change on one programme
    distinguish_by: [ration_code, invoice_date]
    fields:
      feed_invoice_id: internal reference of the feed programme row
      program_id: the programme changed
      customer_id: the member whose ration changes
      event_type: the event family this row records
      invoice_date: the date the change takes effect
      ration_code: the formula code the mill will run from that date
      feed_type: the class of feed the change concerns
      medication_flag: whether the new ration carries a medicated additive
      vfd_reference: the veterinary feed directive the new ration runs under
      amount: the charge for the change where the programme charges one
      posted_date: the date the change was recorded
    triggers: []

  - type: feed_credit_issued
    target: feed_invoices
    meaning: tons are credited back where a load was short, out of specification, or billed in error
    grain: one credit against one delivered load
    distinguish_by: [invoice_number, delivery_ticket_number, posted_date]
    fields:
      feed_invoice_id: internal reference of the feed programme row
      program_id: the programme credited
      customer_id: the member credited
      event_type: the event family this row records
      invoice_number: the invoice the credit is written against
      delivery_ticket_number: the mill ticket the load went out on
      feed_type: the class of feed credited
      tons: tons credited back
      price_per_ton: the price the credit was computed at
      amount: money credited to the feed account
      invoice_date: the date of the load being credited
      posted_date: the date the credit was posted to the feed account
    account: feed_tons
    direction: out
    triggers: []

  - type: feed_program_hold_set
    target: feed_programs
    mutation: {transition: [{from: active, to: on_hold}, {from: on_hold, to: active}]}
    meaning: the member holds deliveries while the pens are empty and puts stock back on feed later
    grain: one row per hold placed or lifted on the programme
    fields:
      status: the standing the programme moves to
      head_count: head on feed at the time of the change
      delivery_frequency: the schedule suspended or restored
    triggers: []

  - type: feed_vfd_suspension_set
    target: feed_programs
    mutation: {transition: [{from: active, to: suspended_vfd}, {from: suspended_vfd, to: active}]}
    meaning: the mill stops running a medicated ration when the directive behind it lapses, and resumes when a current one is filed
    grain: one row per medicated-ration suspension or resumption
    fields:
      status: the standing the programme moves to
      vfd_on_file: whether a current veterinary feed directive is on file
      ration_code: the formula code affected
    triggers: []

  - type: feed_program_updated
    target: feed_programs
    mutation: update
    meaning: the head count, the bin, the schedule or the nutritionist on a live programme are rewritten
    grain: one row per recorded change to the programme's own particulars
    fields:
      head_count: the revised head on feed
      bin_capacity_tons: the revised bin capacity
      delivery_frequency: the revised delivery schedule
      nutritionist_assigned: the revised nutritionist
      vfd_on_file: whether a current veterinary feed directive is now on file
      ration_code: the revised formula code
    triggers: []

  - type: feed_program_closed
    target: feed_programs
    mutation: {transition: [{from: active, to: closed}, {from: on_hold, to: closed}]}
    meaning: the programme ends, either at the member's request with nothing owing or because it has stood on hold with no stock on feed
    grain: one row per feed programme closed
    fields:
      status: the standing the programme moves to
      closed_date: the date the programme closed
      head_count: head on feed when the programme closed
    triggers: []

measures:
  - id: feed_msr_rolling_year_tons
    window: the twelve calendar months ending on the last day of the month before the handling date
    measure: sum of tons over the member's feed_delivery_made rows on the programme in that window
  - id: feed_msr_ration_changes_this_year
    window: the current calendar year
    measure: count of feed_ration_changed rows on the programme in that year
  - id: feed_msr_days_since_last_delivery
    window: from the date of the most recent delivery on the programme through the handling date, the delivery date counting as day zero
    measure: count of calendar days since the last load went out
  - id: feed_msr_open_feed_balance
    window: every feed programme of the member that is not closed, taken as they stand on the handling date
    measure: sum of amount over unpaid feed_invoice_issued rows less payments applied against them

policies:
  - id: feed_agg_multi_holding
    subject: [feed_program_opened]
    rule: >
      A member may hold up to four feed programmes at once, counting every programme that is not closed, because a farm
      commonly runs different species and different stages on different rations out of different bins. One programme
      covers one ration into one bin, and a second programme is never opened for the same ration and the same bin,
      since the delivery schedule and the tons delivered would then be recorded twice. A programme whose entry gate
      calls for a veterinary feed directive is not accepted until a current directive from the herd's veterinarian is
      filed with the mill and recorded against the programme, and the member's assurance that the veterinarian has
      written one is never enough. A programme whose entry gate calls for a bin is not accepted until the bin is set
      and its capacity is recorded. Where the entry gate is not met the enrolment is taken and the programme waits in
      applied standing, and bagged feed is sold in the meantime.
    eligibility:
      - id: directive_filed_before_acceptance
        applies_to: [feed_program_opened]
        kind: authorization
        condition: A programme whose entry gate calls for a veterinary feed directive is not accepted until a current directive from the herd's veterinarian is filed with the mill and recorded against the programme, and the member's assurance that the veterinarian has written one is never enough.
        evidence_fields: [feed_programs.vfd_on_file, feed_programs.variant_name, feed_programs.program_number]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [feed_programs.program_number]
          action_bindings:
            feed_programs.program_number: program_number
    params:
      max_per_customer: 4
      uniqueness_basis: [ration_code, bin]

  - id: feed_agg_balance_across_programs
    subject: [feed_invoice_issued, feed_payment_posted]
    rule: >
      What a member owes the mill is looked at across every feed programme they hold rather than programme by
      programme. The combined feed balance is what stands unpaid on every programme that is not closed, and it is
      measured against the sum of the limits those programmes carry. A load is run only where the combined balance
      after the invoice would stay at or under the combined limit, so a member at their ceiling on the finisher ration
      cannot be supplied on the starter instead. A payment that names no invoice is applied to the programme it was
      received on, oldest invoice first, and is never spread across programmes. Contracted ingredient tons belong to
      the programme they were contracted on and are never drawn by another, because the contract was written against
      that formula. Where the member has elected to have grain settlement proceeds credited to the feed account and the
      programme allows the transfer, the whole net lands as one payment on the settlement date.
    eligibility:
      - id: programme_live_for_billing
        applies_to: [feed_invoice_issued]
        kind: state
        condition: A load is run only where the combined balance after the invoice would stay at or under the combined limit, so a member at their ceiling on the finisher ration cannot be supplied on the starter instead.
        evidence_fields: [feed_programs.status, feed_programs.program_number, feed_invoices.invoice_number]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [feed_invoices.invoice_number]
          action_bindings:
            feed_invoices.invoice_number: invoice_number
        state_contract:
          field: feed_programs.status
          allowed: [active]
    params:
      allocation_order: oldest_invoice_first
      per_tier:
        Bagged Feed Cash Account: {limit_usd: "=credit_limit_usd", grain_transfer: "=grain_settlement_transfer_allowed"}
        Bulk Delivered Feed Account: {limit_usd: "=credit_limit_usd", grain_transfer: "=grain_settlement_transfer_allowed"}
        Custom Mix Ration Program: {limit_usd: "=credit_limit_usd", grain_transfer: "=grain_settlement_transfer_allowed"}
        Contracted Ingredient Program: {limit_usd: "=credit_limit_usd", grain_transfer: "=grain_settlement_transfer_allowed"}
        Full Nutrition Partner Program: {limit_usd: "=credit_limit_usd", grain_transfer: "=grain_settlement_transfer_allowed"}
        Medicated Feed VFD Program: {limit_usd: "=credit_limit_usd", grain_transfer: "=grain_settlement_transfer_allowed"}
    measures: [feed_msr_open_feed_balance]

  - id: feed_ordering_and_delivery
    subject: [feed_order_placed, feed_delivery_made]
    rule: >
      Orders go into the mill's running order and are run in the order of the programme's scheduling priority and then
      by the day they were taken. An order needs the programme's notice in business days before the mill runs it,
      counting days the mill grinds and not counting the day the order was taken, and a medicated ration needs the
      longer notice its programme carries because the mill must flush the line. An order must reach the programme's
      minimum tons, and a smaller order is taken as bagged feed instead of being refused. A load is not delivered into
      a bin that cannot hold it, so the tons delivered are the lesser of the tons ordered and the bin's remaining
      capacity, and the balance stays on order. The delivery charge is raised per load where the tons delivered fall
      under the programme's delivery minimum, and it is not raised where the load reaches it. A delivery taken outside
      mill hours carries the programme's after-hours charge on top. Deliveries stop while the programme stands on hold
      or under a directive suspension, and a member who calls for feed in either case is brought back into service
      first.
    eligibility: []
    params:
      per_tier:
        Bagged Feed Cash Account: {notice_business_days: "=delivery_notice_business_days", minimum_tons: "=minimum_order_tons", delivery_minimum_tons: "=delivery_minimum_tons", delivery_fee_usd: "=delivery_fee_per_load_usd", after_hours_usd: "=after_hours_delivery_fee_usd", bin_tons: "=maximum_bin_tons"}
        Bulk Delivered Feed Account: {notice_business_days: "=delivery_notice_business_days", minimum_tons: "=minimum_order_tons", delivery_minimum_tons: "=delivery_minimum_tons", delivery_fee_usd: "=delivery_fee_per_load_usd", after_hours_usd: "=after_hours_delivery_fee_usd", bin_tons: "=maximum_bin_tons"}
        Custom Mix Ration Program: {notice_business_days: "=delivery_notice_business_days", minimum_tons: "=minimum_order_tons", delivery_minimum_tons: "=delivery_minimum_tons", delivery_fee_usd: "=delivery_fee_per_load_usd", after_hours_usd: "=after_hours_delivery_fee_usd", bin_tons: "=maximum_bin_tons"}
        Contracted Ingredient Program: {notice_business_days: "=delivery_notice_business_days", minimum_tons: "=minimum_order_tons", delivery_minimum_tons: "=delivery_minimum_tons", delivery_fee_usd: "=delivery_fee_per_load_usd", after_hours_usd: "=after_hours_delivery_fee_usd", bin_tons: "=maximum_bin_tons"}
        Full Nutrition Partner Program: {notice_business_days: "=delivery_notice_business_days", minimum_tons: "=minimum_order_tons", delivery_minimum_tons: "=delivery_minimum_tons", delivery_fee_usd: "=delivery_fee_per_load_usd", after_hours_usd: "=after_hours_delivery_fee_usd", bin_tons: "=maximum_bin_tons"}
        Medicated Feed VFD Program: {notice_business_days: "=delivery_notice_business_days", minimum_tons: "=minimum_order_tons", delivery_minimum_tons: "=delivery_minimum_tons", delivery_fee_usd: "=delivery_fee_per_load_usd", after_hours_usd: "=after_hours_delivery_fee_usd", bin_tons: "=maximum_bin_tons"}
    measures: [feed_msr_days_since_last_delivery, feed_msr_rolling_year_tons]

  - id: feed_pricing
    subject: [feed_invoice_issued]
    rule: >
      What a ton costs is fixed by the programme's price basis. On a posted-price programme the price is the posted
      price for that class of feed on the day the load was delivered, not the day the order was taken. On a cost-plus
      programme the price is the cost of the ingredients in the formula on the day the mix was run plus the programme's
      mixing charge per ton, so two loads of the same formula a fortnight apart can carry different prices and both are
      right. On a contracted ingredient programme the contracted tons price at the contracted cost until they are
      exhausted and at the posted cost afterwards, and the two are shown as separate lines on the same invoice rather
      than averaged. A price quoted at the counter is held for the programme's price hold in calendar days from the day
      it was quoted and is requoted after that. Bin rent, cleanout, nutritionist visits and analyses beyond the counts
      the programme includes are billed as their own lines and are never folded into the price per ton.
    eligibility: []
    params:
      per_tier:
        Bagged Feed Cash Account: {basis: "=price_basis", bagged_usd: "=bagged_price_per_ton_usd", bulk_usd: "=bulk_price_per_ton_usd", mix_charge_usd: "=custom_mix_charge_per_ton_usd", hold_days: "=price_hold_days"}
        Bulk Delivered Feed Account: {basis: "=price_basis", bagged_usd: "=bagged_price_per_ton_usd", bulk_usd: "=bulk_price_per_ton_usd", mix_charge_usd: "=custom_mix_charge_per_ton_usd", hold_days: "=price_hold_days"}
        Custom Mix Ration Program: {basis: "=price_basis", bagged_usd: "=bagged_price_per_ton_usd", bulk_usd: "=bulk_price_per_ton_usd", mix_charge_usd: "=custom_mix_charge_per_ton_usd", hold_days: "=price_hold_days"}
        Contracted Ingredient Program: {basis: "=price_basis", bagged_usd: "=bagged_price_per_ton_usd", bulk_usd: "=bulk_price_per_ton_usd", mix_charge_usd: "=custom_mix_charge_per_ton_usd", hold_days: "=price_hold_days"}
        Full Nutrition Partner Program: {basis: "=price_basis", bagged_usd: "=bagged_price_per_ton_usd", bulk_usd: "=bulk_price_per_ton_usd", mix_charge_usd: "=custom_mix_charge_per_ton_usd", hold_days: "=price_hold_days"}
        Medicated Feed VFD Program: {basis: "=price_basis", bagged_usd: "=bagged_price_per_ton_usd", bulk_usd: "=bulk_price_per_ton_usd", mix_charge_usd: "=custom_mix_charge_per_ton_usd", hold_days: "=price_hold_days"}
    formula:
      amount: round(tons * price_per_ton, 2)

  - id: feed_ration_management
    subject: [feed_ration_changed]
    rule: >
      A ration is changed on the nutritionist's written instruction and not on a telephone call from the yard, because
      the formula on file is what the mill is obliged to run. A change needs the programme's notice in calendar days
      before the new formula is run, and the mill finishes any load already batched on the old formula. The programme
      carries a number of changes a year at no charge, counted over the calendar year, and a change beyond that count
      carries the programme's change charge. Moving between an unmedicated and a medicated formula is not an ordinary
      ration change at all and needs a current directive of its own. Where a change moves between incompatible
      additives the bin is cleaned out first at the programme's cleanout charge, and that charge is raised whether or
      not the member asked for the cleanout, because the mill will not run the new formula into a contaminated bin.
      Nutritionist visits and laboratory analyses beyond the counts the programme includes are charged at the
      programme's rates.
    eligibility: []
    params:
      counted_over: calendar_year
      per_tier:
        Bagged Feed Cash Account: {notice_days: "=ration_change_notice_days", included_changes: "=ration_changes_included_per_year", change_fee_usd: "=ration_change_fee_usd", cleanout_usd: "=bin_cleanout_fee_usd", visits_included: "=nutritionist_visits_included_per_year", visit_fee_usd: "=nutritionist_visit_fee_usd"}
        Bulk Delivered Feed Account: {notice_days: "=ration_change_notice_days", included_changes: "=ration_changes_included_per_year", change_fee_usd: "=ration_change_fee_usd", cleanout_usd: "=bin_cleanout_fee_usd", visits_included: "=nutritionist_visits_included_per_year", visit_fee_usd: "=nutritionist_visit_fee_usd"}
        Custom Mix Ration Program: {notice_days: "=ration_change_notice_days", included_changes: "=ration_changes_included_per_year", change_fee_usd: "=ration_change_fee_usd", cleanout_usd: "=bin_cleanout_fee_usd", visits_included: "=nutritionist_visits_included_per_year", visit_fee_usd: "=nutritionist_visit_fee_usd"}
        Contracted Ingredient Program: {notice_days: "=ration_change_notice_days", included_changes: "=ration_changes_included_per_year", change_fee_usd: "=ration_change_fee_usd", cleanout_usd: "=bin_cleanout_fee_usd", visits_included: "=nutritionist_visits_included_per_year", visit_fee_usd: "=nutritionist_visit_fee_usd"}
        Full Nutrition Partner Program: {notice_days: "=ration_change_notice_days", included_changes: "=ration_changes_included_per_year", change_fee_usd: "=ration_change_fee_usd", cleanout_usd: "=bin_cleanout_fee_usd", visits_included: "=nutritionist_visits_included_per_year", visit_fee_usd: "=nutritionist_visit_fee_usd"}
        Medicated Feed VFD Program: {notice_days: "=ration_change_notice_days", included_changes: "=ration_changes_included_per_year", change_fee_usd: "=ration_change_fee_usd", cleanout_usd: "=bin_cleanout_fee_usd", visits_included: "=nutritionist_visits_included_per_year", visit_fee_usd: "=nutritionist_visit_fee_usd"}
    measures: [feed_msr_ration_changes_this_year]

  - id: feed_medicated_directive
    subject: [feed_vfd_suspension_set, feed_program_updated]
    rule: >
      A medicated ration is run only under a veterinary feed directive that is current on the day the mix is run. A
      directive is current for the programme's validity period in calendar days from the day the veterinarian wrote
      it, and the mill takes the date from the directive itself rather than from the member's recollection of when the
      veterinarian was out. Where a directive expires the programme is suspended for medicated rations at once, and
      where the programme carries an expiry grace a load already ordered before the expiry may still be run inside that
      grace. Suspension stops the medicated formula and does not stop unmedicated loads on other programmes. The
      programme resumes only when a current directive is filed and recorded. Withdrawal periods are tracked for the
      member on programmes that carry that service, and on programmes that do not, the member is told plainly that the
      responsibility for observing the withdrawal is theirs. A member who asks the mill to run a medicated formula
      without a directive is refused, and no circumstance at the desk changes that.
    eligibility:
      - id: current_directive_on_file
        applies_to: [feed_vfd_suspension_set, feed_program_updated]
        kind: authorization
        condition: A medicated ration is run only under a veterinary feed directive that is current on the day the mix is run.
        evidence_fields: [feed_programs.vfd_on_file, feed_programs.program_number, feed_invoices.vfd_reference]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [feed_programs.program_number]
          action_bindings:
            feed_programs.program_number: program_number
    params:
      per_tier:
        Bagged Feed Cash Account: {medicated_open: "=medicated_feed_allowed", directive_required: "=vfd_required", validity_days: "=vfd_validity_days", grace_days: "=vfd_expiry_grace_days", withdrawal_tracked: "=withdrawal_period_tracking"}
        Bulk Delivered Feed Account: {medicated_open: "=medicated_feed_allowed", directive_required: "=vfd_required", validity_days: "=vfd_validity_days", grace_days: "=vfd_expiry_grace_days", withdrawal_tracked: "=withdrawal_period_tracking"}
        Custom Mix Ration Program: {medicated_open: "=medicated_feed_allowed", directive_required: "=vfd_required", validity_days: "=vfd_validity_days", grace_days: "=vfd_expiry_grace_days", withdrawal_tracked: "=withdrawal_period_tracking"}
        Contracted Ingredient Program: {medicated_open: "=medicated_feed_allowed", directive_required: "=vfd_required", validity_days: "=vfd_validity_days", grace_days: "=vfd_expiry_grace_days", withdrawal_tracked: "=withdrawal_period_tracking"}
        Full Nutrition Partner Program: {medicated_open: "=medicated_feed_allowed", directive_required: "=vfd_required", validity_days: "=vfd_validity_days", grace_days: "=vfd_expiry_grace_days", withdrawal_tracked: "=withdrawal_period_tracking"}
        Medicated Feed VFD Program: {medicated_open: "=medicated_feed_allowed", directive_required: "=vfd_required", validity_days: "=vfd_validity_days", grace_days: "=vfd_expiry_grace_days", withdrawal_tracked: "=withdrawal_period_tracking"}

  - id: feed_payment_and_arrears
    subject: [feed_payment_posted]
    rule: >
      A feed invoice falls due the programme's terms in calendar days after the invoice date, a payment landing on the
      due date itself still being on time; a cash programme carries no terms and the load is paid for as it leaves. An
      invoice still unpaid after the programme's grace period, counted in whole calendar days from the due date,
      carries the programme's late charge once and then the programme's monthly service charge for as long as it
      stands unpaid. Payments may reach the mill only by the methods the programme allows and are applied oldest
      invoice first unless the member names an invoice. Feed is not delivered on a programme whose combined balance has
      passed its limit, and the mill does not extend credit at the loading dock. Where a member's grain settlement is
      due to clear the balance within days, whether to run the load anyway is a judgement for the credit department and
      not one this rule settles.
    eligibility:
      - id: late_charge_after_grace
        applies_to: [feed_payment_posted]
        kind: time
        condition: An invoice still unpaid after the programme's grace period, counted in whole calendar days from the due date, carries the programme's late charge once and then the programme's monthly service charge for as long as it stands unpaid.
        evidence_fields: [feed_invoices.invoice_date, feed_invoices.invoice_number, feed_invoices.amount]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [feed_invoices.invoice_number]
          action_bindings:
            feed_invoices.invoice_number: invoice_number
        temporal_basis:
          clock: frozen_time
          anchor_event: the due date
          anchor_source: feed_invoices.invoice_date
          relation: not_before
          duration_source: variants.late_fee_grace_days
          unit: calendar_days
          counting_rule: counted in whole calendar days from the due date
          boundary: exclusive
    params:
      per_tier:
        Bagged Feed Cash Account: {terms_days: "=invoice_terms_days", grace_days: "=late_fee_grace_days", late_fee_usd: "=late_fee_usd", monthly_pct: "=finance_charge_monthly_pct", methods: "=payment_methods_allowed"}
        Bulk Delivered Feed Account: {terms_days: "=invoice_terms_days", grace_days: "=late_fee_grace_days", late_fee_usd: "=late_fee_usd", monthly_pct: "=finance_charge_monthly_pct", methods: "=payment_methods_allowed"}
        Custom Mix Ration Program: {terms_days: "=invoice_terms_days", grace_days: "=late_fee_grace_days", late_fee_usd: "=late_fee_usd", monthly_pct: "=finance_charge_monthly_pct", methods: "=payment_methods_allowed"}
        Contracted Ingredient Program: {terms_days: "=invoice_terms_days", grace_days: "=late_fee_grace_days", late_fee_usd: "=late_fee_usd", monthly_pct: "=finance_charge_monthly_pct", methods: "=payment_methods_allowed"}
        Full Nutrition Partner Program: {terms_days: "=invoice_terms_days", grace_days: "=late_fee_grace_days", late_fee_usd: "=late_fee_usd", monthly_pct: "=finance_charge_monthly_pct", methods: "=payment_methods_allowed"}
        Medicated Feed VFD Program: {terms_days: "=invoice_terms_days", grace_days: "=late_fee_grace_days", late_fee_usd: "=late_fee_usd", monthly_pct: "=finance_charge_monthly_pct", methods: "=payment_methods_allowed"}

  - id: feed_quality_and_credits
    subject: [feed_credit_issued]
    rule: >
      The mill warrants what the programme's guarantee says it warrants, which on a bagged programme is the analysis on
      the tag and on a formula programme is that the mix was run to the specification on file. A short load is credited
      where the weight difference between the mill scale and the member's scale is outside the programme's weight
      tolerance, and a difference inside the tolerance is not a claim. Feed comes back only where the programme's
      returnable classes cover it and only inside the return window counted in calendar days from the delivery date, a
      return offered on the final day still being in time. Medicated feed is never returnable on any programme, because
      it cannot go back into the bin. A credit is written against the invoice the load was billed on and never against
      the account as a whole, so two short loads make two credits. Where the member believes the ration caused a
      performance problem in the herd, the mill will pull the retained sample and have it analysed, and any settlement
      beyond the value of the feed is a matter for the cooperative's insurer rather than for any rule here.
    eligibility:
      - id: return_inside_window
        applies_to: [feed_credit_issued]
        kind: time
        condition: Feed comes back only where the programme's returnable classes cover it and only inside the return window counted in calendar days from the delivery date, a return offered on the final day still being in time.
        evidence_fields: [feed_invoices.invoice_date, feed_invoices.delivery_ticket_number, feed_invoices.invoice_number, feed_invoices.feed_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [feed_invoices.invoice_number, feed_invoices.delivery_ticket_number]
          action_bindings:
            feed_invoices.invoice_number: invoice_number
            feed_invoices.delivery_ticket_number: delivery_ticket_number
        temporal_basis:
          clock: frozen_time
          anchor_event: the delivery date
          anchor_source: feed_invoices.invoice_date
          relation: not_after
          duration_source: variants.return_window_days
          unit: calendar_days
          counting_rule: counted in calendar days from the delivery date, a return offered on the final day still being in time
          boundary: inclusive
    params:
      never_returnable: [medicated_feed]
      per_tier:
