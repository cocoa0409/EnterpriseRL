  - id: feed_lifecycle_progression
    subject: [feed_program_activated, feed_program_hold_set, feed_program_closed]
    rule: >
      A programme is accepted once its entry gate is met and the ration goes onto the delivery schedule. The member may
      hold deliveries while the pens are empty, and a hold suspends the schedule without closing the programme or
      releasing the bin. The mill closes a programme that has stood on hold with no stock on feed for a full year of
      its own motion, and the bin is pulled and cleaned at the programme's cleanout charge. A member closes a programme
      of their own accord with nothing owing and no load out on order. Contracted ingredient tons standing undrawn are
      dealt with under the contract before a programme can close, and they are neither refunded in cash nor simply
      forgotten. Closed is terminal, and a member putting stock back on feed later needs a fresh enrolment and, on a
      medicated programme, a fresh directive.
    eligibility: []
    params:
      closure_requires: [zero_balance, no_load_on_order, contracted_tons_settled]
      idle_hold_close_after_months: 12
