events:
  - type: grain_contract_opened
    target: grain_contracts
    mutation: create
    meaning: a member signs up bushels under one of the marketing programmes and the contract record is opened in applied standing
    grain: one row per grain marketing contract written
    fields:
      contract_id: internal reference of the contract being opened
      customer_id: the member the contract belongs to
      variant_name: the marketing programme the bushels are sold under
      status: lifecycle standing the contract opens in, which is always applied
      contract_number: the contract number the member quotes when hauling or pricing
      commodity: the commodity the contract covers
      crop_year: the crop year the bushels come out of
      contracted_bushels: bushels committed at signing
      open_bushels: bushels still owed, which at opening equals the bushels committed
      unpriced_bushels: bushels standing unpriced, which at opening is zero
      futures_month: the futures month the price or basis is referenced to
      basis_per_bushel: the basis agreed at signing, where the programme fixes one
      cash_price_per_bushel: the flat cash price agreed at signing, where the programme fixes one
      delivery_location: the facility the contract calls delivery to
      delivery_start_date: first day of the contracted delivery window
      delivery_end_date: last day of the contracted delivery window
      opened_date: date the application was taken
      marketing_agreement_on_file: whether the signed master marketing agreement for the crop year is on file
      credit_approval_on_file: whether the grain desk credit review is recorded as complete
    account: contract_bushels
    direction: in
    triggers: []

  - type: grain_contract_activated
    target: grain_contracts
    mutation: {transition: {from: applied, to: active}}
    meaning: the grain desk countersigns the contract and it becomes binding on both sides
    grain: one row per contract countersigned
    fields:
      status: the standing the contract moves to
      activated_date: date the countersigned contract took effect
    triggers: []

  - type: grain_delivery_applied
    target: grain_ledger
    meaning: a truckload crosses the scale and the member directs it to a marketing contract, into store, or straight through to the buyer
    grain: one row per scale ticket applied against this contract
    distinguish_by: [ticket_number, delivery_date]
    fields:
      ledger_id: internal reference of the ledger row
      contract_id: the contract the load is applied to
      customer_id: the member delivering
      event_type: the event family this row records
      ticket_number: the scale ticket issued for this load
      delivery_date: the date the load crossed the scale
      posted_date: the date the row was posted to the grain ledger
      commodity: the commodity delivered
      disposition: what the member told the scale house to do with the load
      condition_flag: the moisture condition band the probe assigned to the load
      pricing_status: whether the bushels on this load already carry a price
      gross_bushels: bushels weighed before shrink
      net_bushels: bushels remaining after moisture shrink
      moisture_pct: moisture the probe read
      test_weight_lbs: test weight measured
      foreign_material_pct: foreign material measured
      damage_pct: total damaged kernels measured
      delivery_location: the facility that received the load
      hauler: who hauled the load
    account: contract_bushels
    direction: out
    triggers:
      - event: grain:grain_unpriced_position_booked
        when: {pricing_status: unpriced}
        map: {contract_id: contract_id, customer_id: customer_id, ticket_number: ticket_number, commodity: commodity, net_bushels: net_bushels, position_date: delivery_date}
      - event: storage:storage_deposit_recorded
        when: {disposition: storage}
        map: {customer_id: customer_id, ticket_number: ticket_number, bushels: net_bushels, charge_date: delivery_date, charge_type: deposit}
      - event: storage:storage_drying_charged
        when: {condition_flag: [tough, damp, wet]}
        map: {customer_id: customer_id, ticket_number: ticket_number, bushels: net_bushels, charge_type: drying, moisture_in_pct: moisture_pct, charge_date: delivery_date}

  - type: grain_unpriced_position_booked
    target: grain_ledger
    meaning: delivered bushels that carry no price yet are routed into the member's unpriced position and the carry clock starts on them
    grain: one row per parcel of bushels entering the unpriced position
    distinguish_by: [ticket_number, position_date]
    fields:
      ledger_id: internal reference of the ledger row
      contract_id: the contract the parcel belongs to
      customer_id: the member the parcel belongs to
      event_type: the event family this row records
      ticket_number: the scale ticket the parcel came from
      commodity: the commodity in the parcel
      net_bushels: bushels entering the unpriced position
      position_date: the date the bushels entered the unpriced position
      posted_date: the date the row was posted to the grain ledger
      pricing_status: the pricing standing of the parcel, which on entry is unpriced
    account: unpriced_bushels
    direction: in
    triggers: []

  - type: grain_price_set
    target: grain_ledger
    meaning: a pricing instruction is executed and bushels move out of the unpriced position at a fixed price
    grain: one row per pricing execution
    distinguish_by: [pricing_reference, pricing_channel]
    fields:
      ledger_id: internal reference of the ledger row
      contract_id: the contract the priced bushels belong to
      customer_id: the member whose bushels are priced
      event_type: the event family this row records
      pricing_reference: the pricing confirmation number issued for this execution
      pricing_channel: how the member placed the instruction behind this execution
      priced_bushels: bushels converted from unpriced to priced
      futures_price: the futures level captured
      basis_per_bushel: the basis applied
      price_per_bushel: the flat price the bushels settle at
      futures_month: the futures month referenced
      posted_date: the date the row was posted to the grain ledger
    account: unpriced_bushels
    direction: out
    triggers: []

  - type: grain_contract_rolled
    target: grain_ledger
    meaning: the delivery period or the referenced futures month is moved forward at the member's instruction, carrying the market spread and an administrative charge
    grain: one row per roll executed on this contract
    distinguish_by: [roll_reference, futures_month]
    fields:
      ledger_id: internal reference of the ledger row
      contract_id: the contract being rolled
      customer_id: the member whose position is rolled
      event_type: the event family this row records
      roll_reference: the roll confirmation number
      prior_futures_month: the month the position sat in before the roll
      futures_month: the month the position sits in after the roll
      roll_spread_per_bushel: the market spread between the two months carried to the member
      roll_fee_per_bushel: the administrative charge for performing the roll
      rolled_bushels: bushels moved by this roll
      roll_date: the date the roll was executed
      posted_date: the date the row was posted to the grain ledger
    triggers:
      - event: grain:grain_deduction_applied
        map: {contract_id: contract_id, customer_id: customer_id, deduction_type: roll_fee, posted_date: roll_date}

  - type: grain_settlement_issued
    target: grain_ledger
    meaning: priced bushels are drawn onto a settlement statement, which fixes what the cooperative owes the member for them
    grain: one row per settlement statement issued on this contract
    distinguish_by: [settlement_number, settlement_date]
    fields:
      ledger_id: internal reference of the ledger row
      contract_id: the contract settled
      customer_id: the member being settled with
      event_type: the event family this row records
      settlement_number: the settlement statement number
      settled_bushels: bushels drawn onto the statement
      price_per_bushel: the flat price the settled bushels carry
      gross_amount: value of the settled bushels before deductions
      net_amount: amount payable after every deduction on the statement
      settlement_date: the date the statement was issued
      payment_method: how the member elected to be paid
      posted_date: the date the row was posted to the grain ledger
    account: settlement_payable
    direction: in
    triggers:
      - event: grain:grain_deduction_applied
        map: {contract_id: contract_id, customer_id: customer_id, settlement_number: settlement_number, deduction_type: checkoff, posted_date: settlement_date}
      - event: patronage:patronage_retain_withheld
        map: {customer_id: customer_id, patronage_units: settled_bushels, allocation_basis: grain_bushels, entry_date: settlement_date}
      - event: patronage:patronage_units_accrued
        map: {customer_id: customer_id, patronage_units: settled_bushels, allocation_basis: grain_bushels, entry_date: settlement_date}
      - event: agronomy:agronomy_payment_posted
        when: {payment_method: credit_to_input_account}
        map: {customer_id: customer_id, payment_method: grain_settlement_transfer, amount: net_amount, posted_date: settlement_date}

  - type: grain_deduction_applied
    target: grain_ledger
    meaning: one deduction line is carried on a settlement statement, reducing what is paid out to the member
    grain: one deduction line of one class on one settlement statement
    distinguish_by: [settlement_number, deduction_type, posted_date]
    fields:
      ledger_id: internal reference of the ledger row
      contract_id: the contract the deduction belongs to
      customer_id: the member the deduction is taken from
      event_type: the event family this row records
      settlement_number: the settlement statement the line is carried on
      deduction_type: which class of deduction this line carries
      amount: money withheld on this line
      posted_date: the date the line was posted to the grain ledger
      ticket_number: the scale ticket the deduction traces back to, on deductions raised against one load
    account: settlement_payable
    direction: out
    triggers: []

  - type: grain_settlement_paid
    target: grain_ledger
    meaning: funds are released to the member for a settlement statement
    grain: one row per payment issued against a settlement statement
    distinguish_by: [payment_reference, paid_date]
    fields:
      ledger_id: internal reference of the ledger row
      contract_id: the contract paid on
      customer_id: the member paid
      event_type: the event family this row records
      settlement_number: the settlement statement being paid
      payment_reference: the check or remittance number issued
      payment_method: how the payment was delivered
      net_amount: amount released to the member
      paid_date: the date funds were released
      posted_date: the date the row was posted to the grain ledger
    account: settlement_payable
    direction: out
    triggers: []

  - type: grain_contract_amended
    target: grain_contracts
    mutation: update
    meaning: the bushels, the delivery window or the delivery point on a live contract are changed by written amendment
    grain: one row per amendment registered against the contract
    fields:
      contracted_bushels: the revised bushels committed
      open_bushels: the revised bushels still owed
      delivery_end_date: the revised last day of the delivery window
      delivery_location: the revised facility the contract calls delivery to
      amendment_count: the running count of amendments this contract has taken
    triggers: []

  - type: grain_delivery_completed
    target: grain_contracts
    mutation: {transition: [{from: active, to: delivering}, {from: delivering, to: fully_delivered}]}
    meaning: delivery progresses, first when the opening load lands and again when the last contracted bushel is in
    grain: one row per delivery milestone reached on the contract
    fields:
      status: the standing the contract moves to
      open_bushels: bushels still owed at the milestone
    triggers: []

  - type: grain_contract_settled
    target: grain_contracts
    mutation: {transition: {from: fully_delivered, to: settled}}
    meaning: every delivered bushel has been priced and paid and the contract is closed out
    grain: one row per contract closed out
    fields:
      status: the standing the contract moves to
      closed_date: the date the contract was closed out
    triggers: []

  - type: grain_contract_cancelled
    target: grain_contracts
    mutation: {transition: [{from: applied, to: cancelled}, {from: active, to: cancelled}, {from: delivering, to: cancelled}]}
    meaning: the member withdraws an application, or buys out the undelivered balance of a live contract
    grain: one row per contract cancelled or bought out
    fields:
      status: the standing the contract moves to
      closed_date: the date the cancellation took effect
      open_bushels: bushels left undelivered at cancellation
    triggers:
      - event: grain:grain_deduction_applied
        map: {contract_id: contract_id, customer_id: customer_id, deduction_type: contract_buyout}

  - type: grain_contract_defaulted
    target: grain_contracts
    mutation: {transition: [{from: active, to: defaulted}, {from: delivering, to: defaulted}]}
    meaning: the delivery window closed with bushels still owed and no buyout was arranged
    grain: one row per contract put into default
    fields:
      status: the standing the contract moves to
      closed_date: the date the default was recorded
      open_bushels: bushels left undelivered when the window closed
    triggers: []

measures:
  - id: grain_msr_crop_year_delivered_bushels
    window: the current crop year, which runs 1 September through 31 August and is named for the calendar year in which it ends
    measure: sum of net_bushels over the member's grain_delivery_applied rows whose delivery_date falls in that crop year
  - id: grain_msr_production_history_average
    window: the completed crop years immediately preceding the current one, as many of them as the production history window calls for, and as many as exist where the member has fewer
    measure: average per crop year of the member's net_bushels delivered, taken over those completed crop years
  - id: grain_msr_open_forward_bushels
    window: every contract of the member for the current crop year standing in active or delivering
    measure: sum of open_bushels across those contracts
  - id: grain_msr_unpriced_carry_days
    window: from the position_date of an unpriced parcel through the day it is priced or through the handling date where it is still open, counting the position date as day zero
    measure: count of calendar days one parcel has stood in the unpriced position
  - id: grain_msr_unpriced_carry_months
    window: the carry days of an unpriced parcel beyond the free days, grouped into 30-day months with any part of a month counting as a whole one
    measure: count of chargeable 30-day months one parcel has stood in the unpriced position
  - id: grain_msr_crop_year_rolls
    window: the current crop year, which runs 1 September through 31 August
    measure: count of grain_contract_rolled rows recorded against the contract in that crop year

policies:
  - id: grain_agg_multi_holding
    subject: [grain_contract_opened]
    rule: >
      A member may hold any number of grain marketing contracts at the same time, across commodities, crop years and
      programmes, and the cooperative puts no ceiling on how many they carry. What is governed at opening is the
      paperwork standing behind them. A signed master grain marketing agreement covering the crop year of the contract
      is on file for the member before the contract is opened, on every programme whose catalogue marks the marketing
      agreement as required. On every programme whose catalogue requires the credit review, the grain desk credit
      review for that member is recorded as complete before the contract is opened. Both facts are read off the
      member's own contract record; a member's assurance that the agreement was signed at the counter last week is a
      clue to go looking, never a substitute for the record. Where either is missing the application is still taken and
      the contract sits in applied standing, and it is simply not countersigned until the paperwork lands; the desk
      does not refuse to write the contract and does not backdate it once the paperwork arrives. Quantity, as opposed
      to count, is governed separately by the open position rule, so a member at their bushel ceiling may still open a
      further contract for a different crop year.
    eligibility:
      - id: marketing_agreement_on_file
        applies_to: [grain_contract_opened]
        kind: authorization
        condition: A signed master grain marketing agreement covering the crop year of the contract is on file for the member before the contract is opened, on every programme whose catalogue marks the marketing agreement as required.
        evidence_fields: [grain_contracts.marketing_agreement_on_file, grain_contracts.crop_year, grain_contracts.contract_number]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [grain_contracts.contract_number]
          action_bindings:
            grain_contracts.contract_number: contract_number
      - id: credit_review_complete
        applies_to: [grain_contract_opened]
        kind: authorization
        condition: On every programme whose catalogue requires the credit review, the grain desk credit review for that member is recorded as complete before the contract is opened.
        evidence_fields: [grain_contracts.credit_approval_on_file, grain_contracts.variant_name, grain_contracts.contract_number]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [grain_contracts.contract_number]
          action_bindings:
            grain_contracts.contract_number: contract_number
    params:
      max_per_customer: null

  - id: grain_agg_open_position_cap
    subject: [grain_contract_opened, grain_contract_amended]
    rule: >
      Bushels sold forward are capped across the whole portfolio rather than contract by contract. The member's open
      forward position for a crop year is the bushels still owed on every contract of theirs for that crop year that
      stands in active or delivering, and it is measured against the member's production history average, which is the
      average net bushels they delivered per crop year over the completed crop years in the production history window,
      a member with fewer completed years being measured on the years they have. The ceiling is the cap percentage of
      that average, and both the percentage and the length of the history window are taken from the programme of the
      contract being written, not from the programmes already held. A new contract is written only where the bushels
      already open plus the bushels being committed stay at or under the ceiling. An amendment that raises contracted
      bushels is measured against the cap only while the contract stands in active or delivering, and an amendment that
      lowers them is never blocked by the cap. Where the ceiling would be passed the desk writes the contract for the
      remaining headroom and declines the balance, or declines outright where there is no headroom; it never writes the
      contract over the ceiling to be trued up afterwards. A member who has no delivery history at all has no
      production history average, so no forward contract can be measured, and the request is not one this rule can
      decide.
    eligibility:
      - id: amendment_live_contract
        applies_to: [grain_contract_amended]
        kind: state
        condition: An amendment that raises contracted bushels is measured against the cap only while the contract stands in active or delivering, and an amendment that lowers them is never blocked by the cap.
        evidence_fields: [grain_contracts.status, grain_contracts.contract_number, grain_contracts.contracted_bushels]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [grain_contracts.contract_number]
          action_bindings:
            grain_contracts.contract_number: contract_number
        state_contract:
          field: grain_contracts.status
          allowed: [active, delivering]
    params:
      per_tier:
        Spot Cash Delivery Ticket: {cap_pct: "=open_position_cap_pct_of_production", history_years: "=production_history_years"}
        Forward Cash Sale Contract: {cap_pct: "=open_position_cap_pct_of_production", history_years: "=production_history_years"}
        Basis Fixed Contract: {cap_pct: "=open_position_cap_pct_of_production", history_years: "=production_history_years"}
        Hedge-to-Arrive Contract: {cap_pct: "=open_position_cap_pct_of_production", history_years: "=production_history_years"}
        Delayed Price Agreement: {cap_pct: "=open_position_cap_pct_of_production", history_years: "=production_history_years"}
        Minimum Price Contract: {cap_pct: "=open_position_cap_pct_of_production", history_years: "=production_history_years"}
        Managed Accumulator Program: {cap_pct: "=open_position_cap_pct_of_production", history_years: "=production_history_years"}
    formula:
      when_not: grain_msr_open_forward_bushels + contracted_bushels > open_position_cap_pct_of_production * grain_msr_production_history_average / 100
      headroom_bushels: max(0, open_position_cap_pct_of_production * grain_msr_production_history_average / 100 - grain_msr_open_forward_bushels)
    measures: [grain_msr_open_forward_bushels, grain_msr_production_history_average, grain_msr_crop_year_delivered_bushels]

  - id: grain_evt_delivery_application
    subject: [grain_delivery_applied, grain_unpriced_position_booked]
    rule: >
      Every truckload is weighed in and probed before anything is decided about it. The member tells the scale house at
      the time of unload which contract the load is to be applied to, and that instruction is recorded on the scale
      ticket; where the member gives no instruction the load is taken into open storage in their name and applied to
      nothing. A load is applied to a contract only while that contract stands in active or delivering, so a load
      arriving against a contract still waiting to be countersigned is held on the ticket until the contract is
      countersigned. Net bushels are gross bushels less moisture shrink: bushels above the moisture base shrink by the
      shrink factor for each whole and part point above base, measured on the base for the commodity delivered, and
      grain at or under base shrinks by nothing and is never credited back. The moisture base printed in the catalogue
      is the yellow corn base; every other commodity uses the base carried in the per-commodity table of this rule. Net
      bushels, not gross, are what comes off the contract's open bushels and what earns patronage. Where the load is
      delivered to a facility other than the one the contract calls for, the freight differential is applied against
      the price, in the member's favour when the alternative facility is nearer the market and against them when it is
      further. A load carrying no price at all is routed into the member's unpriced position on the day it crosses the
      scale, and that date, not the date the paperwork is posted, is the date the carry clock starts from. Loads may be
      split across contracts, and each split is written as its own ticket line so that the two parts never collapse
      into one another.
    eligibility:
      - id: member_directs_the_load
        applies_to: [grain_delivery_applied]
        kind: caller_fact
        condition: The member tells the scale house at the time of unload which contract the load is to be applied to, and that instruction is recorded on the scale ticket; where the member gives no instruction the load is taken into open storage in their name and applied to nothing.
        evidence_fields: [grain_ledger.ticket_number, grain_ledger.disposition, grain_contracts.contract_number]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys:
            - [grain_ledger.ticket_number]
          action_bindings:
            grain_ledger.ticket_number: ticket_number
      - id: contract_live_for_application
        applies_to: [grain_delivery_applied]
        kind: state
        condition: A load is applied to a contract only while that contract stands in active or delivering, so a load arriving against a contract still waiting to be countersigned is held on the ticket until the contract is countersigned.
        evidence_fields: [grain_contracts.status, grain_contracts.contract_number, grain_ledger.ticket_number]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [grain_contracts.contract_number, grain_ledger.ticket_number]
          action_bindings:
            grain_contracts.contract_number: contract_number
            grain_ledger.ticket_number: ticket_number
        state_contract:
          field: grain_contracts.status
          allowed: [active, delivering]
    params:
      per_commodity:
        yellow_corn: {moisture_base_pct: "=moisture_base_pct"}
        soybeans: {moisture_base_pct: 13.0}
        hard_red_winter_wheat: {moisture_base_pct: 13.5}
        oats: {moisture_base_pct: 14.0}
        grain_sorghum: {moisture_base_pct: 14.0}
    formula:
      net_bushels: round(gross_bushels * (1 - shrink_pct_per_moisture_point * max(0, moisture_pct - moisture_base_pct) / 100), 2)

  - id: grain_evt_quality_discount
    subject: [grain_delivery_applied, grain_deduction_applied]
    rule: >
      Grade is settled on the readings taken at unload and never renegotiated afterwards on the member's recollection
      of the load. Test weight below the base for the commodity is discounted for each whole pound below base, part
      pounds being rounded down in the member's favour. Foreign material above the free tolerance is discounted for
      each percentage point above it, part points counted proportionally. Damage is not discounted point by point but
      by the band it falls in, taking the discount of the lowest band whose ceiling the reading does not exceed, and a
      load whose damage reaches the rejection level is refused at the pit and no ticket is written for it at all. The
      three discounts stack: a load can carry a test weight, a foreign material and a damage discount at once, and the
      discounts are added rather than the worst one taken. Exactly one quality discount line is carried per scale
      ticket, so a reweigh or a recheck adjusts the existing line rather than adding a second one. Grade discounts are
      taken against the price of the bushels on that ticket and appear on the settlement statement the bushels are
      drawn onto; they are never taken a second time when the bushels are later priced.
    eligibility:
      - id: one_discount_line_per_ticket
        applies_to: [grain_deduction_applied]
        kind: dedup
        condition: Exactly one quality discount line is carried per scale ticket, so a reweigh or a recheck adjusts the existing line rather than adding a second one.
        evidence_fields: [grain_ledger.ticket_number, grain_ledger.deduction_type, grain_ledger.amount]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [grain_ledger.ticket_number]
          action_bindings:
            grain_ledger.ticket_number: ticket_number
        dedup_contract:
          table: grain_ledger
          mode: separate_record
          object_bindings: {ticket_number: ticket_number}
          duplicate_filters: {deduction_type: [quality_discount]}
          distinct_fields: [posted_date, amount]
    params:
      rounding: {test_weight_pounds: round_down_to_whole_pound, foreign_material_points: proportional, money: round_half_up_to_cents}
    formula:
      amount: round(net_bushels * (max(0, test_weight_base_lbs - test_weight_lbs) * test_weight_discount_per_lb_usd + max(0, foreign_material_pct - foreign_material_free_pct) * foreign_material_discount_per_pct_usd), 2)

  - id: grain_dp_service_charge
    subject: [grain_unpriced_position_booked, grain_price_set]
    rule: >
      Bushels standing unpriced are carried at the member's cost once the free period is used up. The delayed price
      service charge accrues only while the contract stands in active, delivering or fully_delivered, and stops
      accruing on a parcel the day that parcel is priced. Carry is counted in calendar days from the position date,
      the position date itself counting as day zero; the free days are taken off first, and what remains is grouped
      into thirty-day months with any part of a month counting as a whole one. The charge is the monthly rate times the
      net bushels in the parcel times those chargeable months, and where that comes to less than the parcel minimum the
      minimum is taken instead. Each parcel carries its own clock, so a member who delivered on three separate days
      carries three clocks and three minimums, and the elevator does not net them into one position. The charge is
      never taken in advance: it is drawn onto the settlement statement the parcel is finally priced and settled on.
      Where a programme carries no free days at all the charge runs from the day of delivery, and where a programme
      does not allow price later at all no parcel can enter the unpriced position and this rule never engages.
    eligibility:
      - id: contract_live_for_carry
        applies_to: [grain_unpriced_position_booked]
        kind: state
        condition: The delayed price service charge accrues only while the contract stands in active, delivering or fully_delivered, and stops accruing on a parcel the day that parcel is priced.
        evidence_fields: [grain_contracts.status, grain_contracts.contract_number, grain_ledger.position_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [grain_contracts.contract_number]
          action_bindings:
            grain_contracts.contract_number: contract_number
        state_contract:
          field: grain_contracts.status
          allowed: [active, delivering, fully_delivered]
    params:
      month_length_days: 30
      part_month_handling: counts_as_a_whole_month
    formula:
      when_not: grain_msr_unpriced_carry_days <= dp_free_days
      amount: max(dp_service_charge_minimum_usd, round(net_bushels * dp_service_charge_per_bushel_per_month_usd * grain_msr_unpriced_carry_months, 2))
    measures: [grain_msr_unpriced_carry_days, grain_msr_unpriced_carry_months]

  - id: grain_evt_pricing_execution
    subject: [grain_price_set]
    rule: >
      Pricing moves bushels out of the unpriced position at a fixed level and is worked only on a written instruction.
      A signed pricing instruction for those bushels is registered with the grain desk before the bushels are priced,
      and an instruction the member has lodged but not signed is held rather than worked, however plainly they confirm
      it on the telephone. Bushels standing in the member's unpriced position are priced no later than the maximum
      carry period running from the day the bushels entered the member's unpriced position; the maximum carry period is
      counted in whole calendar days from the position date, the position date itself counting as day zero, and the
      final day of the period is itself still timely. A parcel still unpriced after that is priced by the elevator at
      the close of the final day at the posted bid, and the member is notified rather than asked. Instructions
      registered before the programme's daily cutoff time are worked the same trading day and those after it on the
      next trading day, the cutoff being read on the elevator's local clock and a day on which the futures market does
      not trade not being a trading day at all. An instruction must name at least the programme's minimum increment,
      and the desk works no more than the programme's daily maximum for one member; instructions beyond that are
      carried to the next trading day in the order they were registered. Only the channels the programme opens may be
      used, so a member whose programme has no online pricing cannot self-price in the portal however the portal
      behaves. The flat price is the futures level captured plus the basis carried on the parcel, and where the
      programme carries a price floor the floor premium has already been charged and the settlement price is the
      better of the floor and the captured level.
    eligibility:
      - id: signed_pricing_instruction
        applies_to: [grain_price_set]
        kind: authorization
        condition: A signed pricing instruction for those bushels is registered with the grain desk before the bushels are priced, and an instruction the member has lodged but not signed is held rather than worked, however plainly they confirm it on the telephone.
        evidence_fields: [grain_pricing_intake.signed_by_member, grain_pricing_intake.order_status, grain_pricing_intake.pricing_order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [grain_pricing_intake.pricing_order_id]
          action_bindings:
            grain_pricing_intake.pricing_order_id: pricing_order_id
      - id: within_maximum_carry
        applies_to: [grain_price_set]
        kind: time
        condition: Bushels standing in the member's unpriced position are priced no later than the maximum carry period running from the day the bushels entered the member's unpriced position; the maximum carry period is counted in whole calendar days from the position date, the position date itself counting as day zero, and the final day of the period is itself still timely.
        evidence_fields: [grain_ledger.position_date, grain_ledger.pricing_reference, grain_ledger.pricing_status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [grain_ledger.pricing_reference]
          action_bindings:
            grain_ledger.pricing_reference: pricing_reference
        temporal_basis:
          clock: frozen_time
          anchor_event: the day the bushels entered the member's unpriced position
          anchor_source: grain_ledger.position_date
          relation: not_after
          duration_source: variants.dp_max_open_days
          unit: calendar_days
          counting_rule: the maximum carry period is counted in whole calendar days from the position date, the position date itself counting as day zero, and the final day of the period is itself still timely
          boundary: inclusive
    params:
      per_tier:
        Spot Cash Delivery Ticket: {increment_bushels: "=min_pricing_increment_bushels", daily_order_ceiling: "=max_pricing_orders_per_day", cutoff_local: "=pricing_cutoff_time_local", portal_open: "=online_pricing_enabled"}
        Forward Cash Sale Contract: {increment_bushels: "=min_pricing_increment_bushels", daily_order_ceiling: "=max_pricing_orders_per_day", cutoff_local: "=pricing_cutoff_time_local", portal_open: "=online_pricing_enabled"}
        Basis Fixed Contract: {increment_bushels: "=min_pricing_increment_bushels", daily_order_ceiling: "=max_pricing_orders_per_day", cutoff_local: "=pricing_cutoff_time_local", portal_open: "=online_pricing_enabled"}
        Hedge-to-Arrive Contract: {increment_bushels: "=min_pricing_increment_bushels", daily_order_ceiling: "=max_pricing_orders_per_day", cutoff_local: "=pricing_cutoff_time_local", portal_open: "=online_pricing_enabled"}
        Delayed Price Agreement: {increment_bushels: "=min_pricing_increment_bushels", daily_order_ceiling: "=max_pricing_orders_per_day", cutoff_local: "=pricing_cutoff_time_local", portal_open: "=online_pricing_enabled"}
        Minimum Price Contract: {increment_bushels: "=min_pricing_increment_bushels", daily_order_ceiling: "=max_pricing_orders_per_day", cutoff_local: "=pricing_cutoff_time_local", portal_open: "=online_pricing_enabled"}
        Managed Accumulator Program: {increment_bushels: "=min_pricing_increment_bushels", daily_order_ceiling: "=max_pricing_orders_per_day", cutoff_local: "=pricing_cutoff_time_local", portal_open: "=online_pricing_enabled"}
    formula:
      price_per_bushel: futures_price + basis_per_bushel

  - id: grain_roll_handling
    subject: [grain_contract_rolled]
    rule: >
      A member who cannot deliver inside the window, or who wants the referenced futures month moved, rolls the
      position rather than defaulting on it. A signed roll instruction naming the bushels and the month to be moved to
      is registered with the grain desk before the roll is executed. A roll may only be taken on programmes whose
      catalogue allows rolls at all, must name at least the programme's roll minimum, and the contract may take no more
      rolls in a crop year than the programme allows; a member at that ceiling is not rolled again and must deliver,
      buy out or default. The member carries the market spread between the two futures months in full, gaining where
      the market carries and losing where it is inverted, and pays the programme's administrative charge per bushel
      rolled on top of it. Both the spread and the charge are drawn onto the settlement statement of the bushels they
      attach to rather than invoiced separately. Rolling moves the delivery window out by the length of the standard
      window for the programme and does not itself change the bushels committed, so a member who also wants fewer
      bushels needs an amendment as well.
    eligibility:
      - id: signed_roll_instruction
        applies_to: [grain_contract_rolled]
        kind: authorization
        condition: A signed roll instruction naming the bushels and the month to be moved to is registered with the grain desk before the roll is executed.
        evidence_fields: [grain_pricing_intake.signed_by_member, grain_pricing_intake.order_type, grain_pricing_intake.order_status, grain_pricing_intake.pricing_order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [grain_pricing_intake.pricing_order_id]
          action_bindings:
            grain_pricing_intake.pricing_order_id: pricing_order_id
    params:
      spread_treatment: carried_in_full_to_the_member
    formula:
      amount: round(rolled_bushels * roll_fee_per_bushel_usd, 2)
    measures: [grain_msr_crop_year_rolls]

  - id: grain_evt_settlement
    subject: [grain_settlement_issued, grain_settlement_paid]
    rule: >
      A settlement statement is drawn only on bushels that are both delivered and priced. A settlement statement is
      issued only while the contract stands in delivering, fully_delivered or settled, so bushels on a contract still
      waiting to be countersigned are never settled. Gross value is the settled bushels times the flat price they
      carry, rounded to cents. Every deduction that attaches to those bushels is carried on the same statement, and
      what remains is the net payable. Where the net payable falls under the programme's settlement minimum no payment
      is cut and the balance is carried forward onto the member's next statement rather than written off. Funds are
      released the programme's settlement lead in business days after the statement date, counting only days the
      cooperative's office is open. The member chooses how they are paid: a check, a direct deposit, a credit against
      their crop input account, or a deferred payment where the programme allows one, and a deferred payment is held no
      longer than the programme's deferral maximum from the statement date and may not be pulled forward into the same
      tax year once elected. Choosing to credit the input account moves the whole net, not part of it, and a member who
      wants part cash and part credit needs two statements.
    eligibility:
      - id: contract_live_for_settlement
        applies_to: [grain_settlement_issued]
        kind: state
        condition: A settlement statement is issued only while the contract stands in delivering, fully_delivered or settled, so bushels on a contract still waiting to be countersigned are never settled.
        evidence_fields: [grain_contracts.status, grain_contracts.contract_number, grain_ledger.settlement_number]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [grain_ledger.settlement_number]
          action_bindings:
            grain_ledger.settlement_number: settlement_number
        state_contract:
          field: grain_contracts.status
          allowed: [delivering, fully_delivered, settled]
    params:
      per_tier:
        Spot Cash Delivery Ticket: {minimum_payable_usd: "=settlement_minimum_amount_usd", lead_business_days: "=settlement_lead_days", deferral_open: "=deferred_payment_allowed"}
        Forward Cash Sale Contract: {minimum_payable_usd: "=settlement_minimum_amount_usd", lead_business_days: "=settlement_lead_days", deferral_open: "=deferred_payment_allowed"}
        Basis Fixed Contract: {minimum_payable_usd: "=settlement_minimum_amount_usd", lead_business_days: "=settlement_lead_days", deferral_open: "=deferred_payment_allowed"}
        Hedge-to-Arrive Contract: {minimum_payable_usd: "=settlement_minimum_amount_usd", lead_business_days: "=settlement_lead_days", deferral_open: "=deferred_payment_allowed"}
        Delayed Price Agreement: {minimum_payable_usd: "=settlement_minimum_amount_usd", lead_business_days: "=settlement_lead_days", deferral_open: "=deferred_payment_allowed"}
        Minimum Price Contract: {minimum_payable_usd: "=settlement_minimum_amount_usd", lead_business_days: "=settlement_lead_days", deferral_open: "=deferred_payment_allowed"}
        Managed Accumulator Program: {minimum_payable_usd: "=settlement_minimum_amount_usd", lead_business_days: "=settlement_lead_days", deferral_open: "=deferred_payment_allowed"}
    formula:
      gross_amount: round(settled_bushels * price_per_bushel, 2)

  - id: grain_evt_checkoff_and_retain
    subject: [grain_deduction_applied]
    rule: >
      Two withholdings attach to every settlement of patronage-eligible bushels and are shown as their own lines.
      The statutory commodity checkoff is withheld at the published rate on the settled bushels, and exactly one
      checkoff line is carried on a settlement statement, so a corrected statement adjusts the existing line rather
      than adding a second. The checkoff is refundable on request where the commodity's programme allows it, and a member
      who asks for the checkoff back does so no later than the refund window running from the day the settlement
      statement was issued, and the refund window is counted in whole calendar days from the settlement date, the
      settlement date itself counting as day zero, and a request arriving on the final day of the window is still in
      time. A request after that is out of time and the desk has no discretion to take it. The per-unit capital retain
      is withheld at the same time on programmes the catalogue marks as patronage-eligible, but it is not a charge: it
      is credited to the member's equity account and comes back to them on the board's revolvement cycle, so it is
      never refunded on request and never waived. On a programme that is not patronage-eligible neither the retain nor
      any patronage allocation arises, and only the checkoff is withheld.
    eligibility:
      - id: one_checkoff_per_statement
        applies_to: [grain_deduction_applied]
        kind: dedup
        condition: The statutory commodity checkoff is withheld at the published rate on the settled bushels, and exactly one checkoff line is carried on a settlement statement, so a corrected statement adjusts the existing line rather than adding a second.
        evidence_fields: [grain_ledger.settlement_number, grain_ledger.deduction_type, grain_ledger.posted_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [grain_ledger.settlement_number]
          action_bindings:
            grain_ledger.settlement_number: settlement_number
        dedup_contract:
          table: grain_ledger
          mode: separate_record
          object_bindings: {settlement_number: settlement_number}
          duplicate_filters: {deduction_type: [checkoff]}
          distinct_fields: [posted_date, amount]
      - id: refund_request_in_time
        applies_to: [grain_deduction_applied]
        kind: time
        condition: The checkoff is refundable on request where the commodity's programme allows it, and a member who asks for the checkoff back does so no later than the refund window running from the day the settlement statement was issued, and the refund window is counted in whole calendar days from the settlement date, the settlement date itself counting as day zero, and a request arriving on the final day of the window is still in time.
        evidence_fields: [grain_ledger.settlement_date, grain_ledger.settlement_number, grain_ledger.deduction_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [grain_ledger.settlement_number]
          action_bindings:
            grain_ledger.settlement_number: settlement_number
        temporal_basis:
          clock: frozen_time
          anchor_event: the day the settlement statement was issued
          anchor_source: grain_ledger.settlement_date
          relation: not_after
          duration_source: variants.checkoff_refund_window_days
          unit: calendar_days
          counting_rule: the refund window is counted in whole calendar days from the settlement date, the settlement date itself counting as day zero, and a request arriving on the final day of the window is still in time
          boundary: inclusive
    formula:
      amount: round(settled_bushels * checkoff_rate_per_bushel_usd, 2)

  - id: grain_buyout
    subject: [grain_contract_cancelled]
    rule: >
      A member who will not deliver the bushels they sold buys the contract out rather than walking away from it. The
      member has signed a buyout instruction and the grain desk has registered it before the contract is cancelled; a
      telephone call saying the crop failed starts the conversation but does not cancel anything. Notice must reach the
      desk no later than the programme's notice window before the delivery window closes, and on programmes that allow
      it an application may still be withdrawn at no cost at all while it is in applied standing and has not been
      countersigned. The buyout price is the market loss on the undelivered bushels, being the amount by which the
      replacement bid on the day of cancellation exceeds the contract price, multiplied by the programme's loss
      multiplier and never less than zero, plus the programme's flat administrative fee. Where the market has fallen
      the loss is zero and only the administrative fee is charged; the cooperative does not pay the member the
      difference. The buyout is drawn as a deduction on the member's next settlement statement, and where there is no
      settlement to draw it on it is invoiced to their crop input account. Where the window closes with bushels still
      owed and no buyout arranged the contract goes to default instead, which carries the default penalty per bushel on
      top of the same market loss, so buying out early is always the cheaper of the two.
    eligibility:
      - id: signed_buyout_instruction
        applies_to: [grain_contract_cancelled]
        kind: authorization
        condition: The member has signed a buyout instruction and the grain desk has registered it before the contract is cancelled; a telephone call saying the crop failed starts the conversation but does not cancel anything.
        evidence_fields: [grain_pricing_intake.signed_by_member, grain_pricing_intake.order_status, grain_pricing_intake.pricing_order_id, grain_contracts.contract_number]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [grain_pricing_intake.pricing_order_id]
          action_bindings:
            grain_pricing_intake.pricing_order_id: pricing_order_id
    params:
      per_tier:
        Spot Cash Delivery Ticket: {admin_fee_usd: "=buyout_admin_fee_usd", loss_multiplier: "=buyout_market_loss_multiplier", notice_days: "=buyout_notice_window_days"}
        Forward Cash Sale Contract: {admin_fee_usd: "=buyout_admin_fee_usd", loss_multiplier: "=buyout_market_loss_multiplier", notice_days: "=buyout_notice_window_days"}
        Basis Fixed Contract: {admin_fee_usd: "=buyout_admin_fee_usd", loss_multiplier: "=buyout_market_loss_multiplier", notice_days: "=buyout_notice_window_days"}
        Hedge-to-Arrive Contract: {admin_fee_usd: "=buyout_admin_fee_usd", loss_multiplier: "=buyout_market_loss_multiplier", notice_days: "=buyout_notice_window_days"}
        Delayed Price Agreement: {admin_fee_usd: "=buyout_admin_fee_usd", loss_multiplier: "=buyout_market_loss_multiplier", notice_days: "=buyout_notice_window_days"}
        Minimum Price Contract: {admin_fee_usd: "=buyout_admin_fee_usd", loss_multiplier: "=buyout_market_loss_multiplier", notice_days: "=buyout_notice_window_days"}
        Managed Accumulator Program: {admin_fee_usd: "=buyout_admin_fee_usd", loss_multiplier: "=buyout_market_loss_multiplier", notice_days: "=buyout_notice_window_days"}

  - id: grain_amendment
    subject: [grain_contract_amended]
    rule: >
      A live contract may be amended in writing to change the bushels committed, to move the last day of the delivery
      window inside the programme's extension allowance, or to change the facility the grain is called to. An amendment
      is signed and registered no later than the amendment window running from the day the contract was countersigned,
      and the amendment window is counted in whole calendar days from the activation date, the activation date itself
      counting as day zero, and an amendment registered on the final day of the window is still in time. An amendment
      is taken only while the contract stands in active or delivering. A contract may take no more amendments than the
      programme's ceiling, and each one carries the programme's amendment fee, charged whether or not the amendment
      later proves unnecessary. Moving the delivery window out beyond the extension allowance is not an amendment at
      all but a roll, and lowering bushels below what has already been delivered is refused outright. Where a member
      wants a change the programme's amendment ceiling no longer allows, the contract is bought out and rewritten, and
      the buyout charge applies in the ordinary way.
    eligibility:
      - id: amendment_within_window
        applies_to: [grain_contract_amended]
        kind: time
        condition: An amendment is signed and registered no later than the amendment window running from the day the contract was countersigned, and the amendment window is counted in whole calendar days from the activation date, the activation date itself counting as day zero, and an amendment registered on the final day of the window is still in time.
        evidence_fields: [grain_contracts.activated_date, grain_contracts.contract_number, grain_contracts.amendment_count]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [grain_contracts.contract_number]
          action_bindings:
            grain_contracts.contract_number: contract_number
        temporal_basis:
          clock: frozen_time
          anchor_event: the day the contract was countersigned
          anchor_source: grain_contracts.activated_date
          relation: not_after
          duration_source: variants.contract_amendment_window_days
          unit: calendar_days
          counting_rule: the amendment window is counted in whole calendar days from the activation date, the activation date itself counting as day zero, and an amendment registered on the final day of the window is still in time
          boundary: inclusive
      - id: amendment_live_only
        applies_to: [grain_contract_amended]
        kind: state
        condition: An amendment is taken only while the contract stands in active or delivering.
        evidence_fields: [grain_contracts.status, grain_contracts.contract_number]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [grain_contracts.contract_number]
          action_bindings:
            grain_contracts.contract_number: contract_number
        state_contract:
          field: grain_contracts.status
          allowed: [active, delivering]
    params:
      per_tier:
        Spot Cash Delivery Ticket: {window_days: "=contract_amendment_window_days", ceiling: "=max_amendments_per_contract", fee_usd: "=amendment_fee_usd"}
        Forward Cash Sale Contract: {window_days: "=contract_amendment_window_days", ceiling: "=max_amendments_per_contract", fee_usd: "=amendment_fee_usd"}
        Basis Fixed Contract: {window_days: "=contract_amendment_window_days", ceiling: "=max_amendments_per_contract", fee_usd: "=amendment_fee_usd"}
        Hedge-to-Arrive Contract: {window_days: "=contract_amendment_window_days", ceiling: "=max_amendments_per_contract", fee_usd: "=amendment_fee_usd"}
        Delayed Price Agreement: {window_days: "=contract_amendment_window_days", ceiling: "=max_amendments_per_contract", fee_usd: "=amendment_fee_usd"}
        Minimum Price Contract: {window_days: "=contract_amendment_window_days", ceiling: "=max_amendments_per_contract", fee_usd: "=amendment_fee_usd"}
        Managed Accumulator Program: {window_days: "=contract_amendment_window_days", ceiling: "=max_amendments_per_contract", fee_usd: "=amendment_fee_usd"}

  - id: grain_lifecycle_progression
    subject: [grain_contract_activated, grain_delivery_completed, grain_contract_settled, grain_contract_defaulted]
    rule: >
      A contract moves through its life on recorded facts rather than on anybody's say-so. The grain desk countersigns
      an application once the programme's paperwork is on file, and only then does the contract bind either side. The
      first load applied moves it into delivering, and the load that takes the bushels still owed to zero moves it to
      fully delivered; both of those follow from the ledger and neither is set by hand. A fully delivered contract is
      closed out to settled once every delivered bushel has been priced and every statement drawn on it has been paid,
      so a contract carrying an unpriced parcel or an unpaid statement stays open however complete the deliveries look.
      Where the last day of the delivery window passes with bushels still owed and neither a roll nor a buyout was
      arranged, the contract goes to default, the undelivered bushels carry the programme's default penalty per bushel
      in addition to the market loss, and the matter leaves the desk for the credit department. Cancellation and
      default are both terminal: a cancelled or defaulted contract is never reopened, and a member who wants the
      bushels back must be written a new contract at the day's terms.
    eligibility: []
    params:
      settled_requires: {every_parcel_priced: true, every_statement_paid: true}
