events:
  - type: patronage_membership_opened
    target: patronage_memberships
    mutation: create
    meaning: a member applies for an equity and patronage membership of one class and the equity account record is opened in applied standing
    grain: one row per equity membership applied for
    fields:
      membership_id: internal reference of the membership being opened
      customer_id: the member the equity account belongs to
      variant_name: the membership and equity class applied for
      status: lifecycle standing the membership opens in, which is always applied
      membership_number: the equity account number printed on patronage notices
      equity_balance: equity held, which at opening is zero
      allocated_equity_balance: allocated but unrevolved equity, which at opening is zero
      common_stock_shares: shares of common stock the class carries
      voting_rights: whether the class votes at the annual meeting
      joined_date: date the application was taken
      birth_year: the member's year of birth as recorded on the application
      tax_reporting_status: how allocations on the membership are reported for tax
      estate_flag: whether notice of death has been recorded, which at opening is false
    triggers: []

  - type: patronage_membership_activated
    target: patronage_memberships
    mutation: {transition: {from: applied, to: active}}
    meaning: the board accepts the membership application and the equity account begins earning allocation
    grain: one row per membership accepted by the board
    fields:
      status: the standing the membership moves to
      common_stock_shares: shares issued on acceptance
      voting_rights: whether voting rights are granted on acceptance
    triggers: []

  - type: patronage_units_accrued
    target: patronage_ledger
    meaning: qualifying business the member did with the cooperative is recorded against their membership for the fiscal year
    grain: one row per settled or invoiced parcel of qualifying business on one allocation basis
    distinguish_by: [entry_date, allocation_basis, patronage_units]
    fields:
      entry_id: internal reference of the equity ledger row
      membership_id: the membership the business is credited to
      customer_id: the member who did the business
      event_type: the event family this row records
      entry_date: the date the qualifying business was recorded
      fiscal_year: the cooperative fiscal year the business falls in
      allocation_basis: which stream of business the volume was earned on
      patronage_units: the volume of qualifying business recorded
      posted_date: the date the row was posted to the equity account
    account: patronage_base
    direction: in
    triggers: []

  - type: patronage_allocation_posted
    target: patronage_ledger
    meaning: the board declares the year's rates and the member's qualifying volume is turned into an allocation split between cash and equity
    grain: one row per allocation notice on one allocation basis for one fiscal year
    distinguish_by: [notice_number, allocation_basis, fiscal_year]
    fields:
      entry_id: internal reference of the equity ledger row
      membership_id: the membership allocated to
      customer_id: the member allocated to
      event_type: the event family this row records
      entry_date: the date the allocation was posted
      fiscal_year: the fiscal year allocated for
      allocation_basis: which stream of business the allocation was earned on
      patronage_units: the qualifying volume the allocation was computed on
      rate_per_unit: the board-declared rate applied
      allocated_amount: total patronage allocated before the split
      cash_portion_amount: the part paid out in cash
      equity_portion_amount: the part retained as member equity
      notice_number: the written patronage notice the allocation was reported on
      tax_form_type: which information return the row is reported on
      posted_date: the date the row was posted to the equity account
    account: cash_patronage_payable
    direction: in
    triggers:
      - event: patronage:patronage_retain_withheld
        map: {membership_id: membership_id, customer_id: customer_id, fiscal_year: fiscal_year, allocation_basis: allocation_basis, patronage_units: patronage_units, entry_date: entry_date}
      - event: patronage:patronage_cash_paid
        map: {membership_id: membership_id, customer_id: customer_id, fiscal_year: fiscal_year, cash_portion_amount: cash_portion_amount, notice_number: notice_number, entry_date: entry_date}

  - type: patronage_cash_paid
    target: patronage_ledger
    meaning: the cash portion of a declared allocation is delivered to the member, by payment or by offset against what they owe
    grain: one cash disbursement against one allocation notice
    distinguish_by: [payment_reference, notice_number]
    fields:
      entry_id: internal reference of the equity ledger row
      membership_id: the membership paid on
      customer_id: the member paid
      event_type: the event family this row records
      entry_date: the date the cash was delivered
      fiscal_year: the fiscal year the allocation belongs to
      notice_number: the allocation notice being paid
      cash_portion_amount: the cash delivered
      payment_reference: the patronage payment reference
      payment_method: how the cash was delivered
      posted_date: the date the row was posted to the equity account
    account: cash_patronage_payable
    direction: out
    triggers:
      - event: agronomy:agronomy_payment_posted
        when: {payment_method: credit_to_input_account}
        map: {customer_id: customer_id, amount: cash_portion_amount, payment_method: patronage_credit, posted_date: posted_date}

  - type: patronage_retain_withheld
    target: patronage_ledger
    meaning: capital is retained per qualifying unit and credited to the member's equity account
    grain: one retain line for one fiscal year on one allocation basis
    distinguish_by: [fiscal_year, allocation_basis, entry_date]
    fields:
      entry_id: internal reference of the equity ledger row
      membership_id: the membership credited
      customer_id: the member credited
      event_type: the event family this row records
      entry_date: the date the retain was taken
      fiscal_year: the fiscal year the retain belongs to
      allocation_basis: which stream of business the retain was taken on
      patronage_units: the volume the retain was computed on
      rate_per_unit: the retain rate applied
      retain_amount: capital retained and credited to equity
      equity_portion_amount: the equity portion of the allocation credited alongside the retain
      posted_date: the date the row was posted to the equity account
    account: member_equity
    direction: in
    triggers: []

  - type: patronage_equity_revolved
    target: patronage_ledger
    meaning: equity from an earlier allocation year is paid back out to the member under the board's revolvement cycle
    grain: one revolvement payment for one allocation year
    distinguish_by: [fiscal_year, payment_reference]
    fields:
      entry_id: internal reference of the equity ledger row
      membership_id: the membership revolved on
      customer_id: the member paid
      event_type: the event family this row records
      entry_date: the date the revolvement was paid
      fiscal_year: the allocation year being revolved
      revolvement_amount: equity paid back out
      payment_reference: the patronage payment reference
      payment_method: how the revolvement was delivered
      posted_date: the date the row was posted to the equity account
    account: member_equity
    direction: out
    triggers: []

  - type: patronage_equity_transferred
    target: patronage_ledger
    meaning: equity is signed over from one member to an eligible transferee and moves off the transferor's account
    grain: one transfer of equity between two parties
    distinguish_by: [entry_date, transfer_counterparty_id, revolvement_amount]
    fields:
      entry_id: internal reference of the equity ledger row
      membership_id: the membership the equity leaves
      customer_id: the member signing the equity over
      event_type: the event family this row records
      entry_date: the date the transfer was recorded
      fiscal_year: the fiscal year the transfer falls in
      revolvement_amount: equity moved to the transferee
      transfer_counterparty_id: the party the equity moved to
      adjustment_reason: the ground recorded for the movement
      posted_date: the date the row was posted to the equity account
    account: member_equity
    direction: out
    triggers: []

  - type: patronage_allocation_adjusted
    target: patronage_ledger
    meaning: an allocation already posted is restated because the volume behind it was wrong or the member's standing changed
    grain: one restatement of one allocation notice
    distinguish_by: [notice_number, adjustment_reason, entry_date]
    fields:
      entry_id: internal reference of the equity ledger row
      membership_id: the membership restated
      customer_id: the member restated
      event_type: the event family this row records
      entry_date: the date the restatement was made
      fiscal_year: the fiscal year restated
      notice_number: the allocation notice being restated
      allocation_basis: which stream of business is restated
      patronage_units: the volume taken back off the membership
      allocated_amount: the allocation as restated
      adjustment_reason: why the allocation was restated
      posted_date: the date the row was posted to the equity account
    account: patronage_base
    direction: out
    triggers: []

  - type: patronage_allocation_hold_set
    target: patronage_memberships
    mutation: {transition: [{from: active, to: allocation_hold}, {from: allocation_hold, to: active}]}
    meaning: allocation is held back while a restatement or a disputed volume is worked, and released when it is settled
    grain: one row per allocation hold placed or lifted on the membership
    fields:
      status: the standing the membership moves to
      last_allocation_year: the most recent year allocated at the time of the change
    triggers: []

  - type: patronage_revolvement_cycle_entered
    target: patronage_memberships
    mutation: {transition: [{from: active, to: revolving}, {from: revolving, to: active}]}
    meaning: the membership enters the board's revolvement cycle for the year and leaves it when the year's revolvement is done
    grain: one row per entry into or exit from the revolvement cycle
    fields:
      status: the standing the membership moves to
      revolvement_eligible_year: the fiscal year the oldest unrevolved allocation becomes eligible
      allocated_equity_balance: allocated but unrevolved equity at the change
    triggers: []

  - type: patronage_membership_retired
    target: patronage_memberships
    mutation: {transition: [{from: active, to: retired}, {from: allocation_hold, to: retired}, {from: revolving, to: retired}]}
    meaning: the board retires the member's equity on age, on death, or early where the class allows it
    grain: one row per membership retired
    fields:
      status: the standing the membership moves to
      closed_date: the date the retirement took effect
      equity_balance: equity standing when the retirement was approved
      estate_flag: whether the retirement was on a recorded death
    triggers: []

  - type: patronage_membership_transferred
    target: patronage_memberships
    mutation: {transition: {from: active, to: transferred}}
    meaning: the whole membership is signed over to an eligible transferee and the original account closes
    grain: one row per membership signed over
    fields:
      status: the standing the membership moves to
      closed_date: the date the transfer took effect
      equity_balance: equity standing when the transfer was recorded
    triggers: []

  - type: patronage_membership_updated
    target: patronage_memberships
    mutation: update
    meaning: the tax election, the recorded death, the stock position or the revolvement eligibility on a live membership are rewritten
    grain: one row per recorded change to the membership's own particulars
    fields:
      tax_reporting_status: the revised tax election
      estate_flag: whether notice of death is now recorded
      common_stock_shares: the revised stock position
      voting_rights: whether the membership now votes
      revolvement_eligible_year: the revised eligibility year
      last_allocation_year: the revised most recent allocation year
      birth_year: the corrected year of birth
    triggers: []

measures:
  - id: patronage_msr_fiscal_year_units
    window: the cooperative fiscal year, which runs 1 September through 31 August and is named for the calendar year in which it ends
    measure: sum of patronage_units over the member's patronage_units_accrued rows for that fiscal year, taken separately for each allocation basis
  - id: patronage_msr_unrevolved_equity_age
    window: from the fiscal year of the member's oldest unrevolved allocation through the current fiscal year
    measure: count of whole fiscal years the oldest unrevolved allocation has stood on the membership
  - id: patronage_msr_member_age_years
    window: from the member's recorded year of birth to the close of the current fiscal year
    measure: the member's age in whole years at the close of the current fiscal year
  - id: patronage_msr_lifetime_allocated
    window: every fiscal year since the membership was accepted by the board
    measure: sum of allocated_amount over the member's patronage_allocation_posted rows

policies:
  - id: patronage_agg_multi_holding
    subject: [patronage_membership_opened]
    rule: >
      A member carries at most three equity memberships at once, counting every membership that is not retired or
      transferred, and only one of them may be a voting class, because the cooperative votes one member one vote and a
      second voting membership would vote the same operation twice. The usual shape is a voting membership for the
      operation, a certificate holding for equity retained in earlier years, and where the class applies a preferred
      holding. A class whose entry gate calls for common stock is not opened until the stock is issued and recorded on
      the membership, and a class whose entry gate calls for years of membership is not opened until the member has
      been on the books that long, counted in whole fiscal years from the date the membership was accepted. Neither is
      taken from the member's recollection of when they joined, since the joining date is on their own record. Where
      the entry gate is not met the application is taken and waits in applied standing rather than being refused, and
      the qualifying business the member does in the meantime still accrues and is allocated once the membership is
      accepted.
    eligibility:
      - id: common_stock_issued
        applies_to: [patronage_membership_opened]
        kind: authorization
        condition: A class whose entry gate calls for common stock is not opened until the stock is issued and recorded on the membership, and a class whose entry gate calls for years of membership is not opened until the member has been on the books that long, counted in whole fiscal years from the date the membership was accepted.
        evidence_fields: [patronage_memberships.common_stock_shares, patronage_memberships.joined_date, patronage_memberships.membership_number, patronage_memberships.variant_name]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [patronage_memberships.membership_number]
          action_bindings:
            patronage_memberships.membership_number: membership_number
    params:
      max_per_customer: 3
      voting_classes_per_customer: 1

  - id: patronage_agg_equity_across_classes
    subject: [patronage_allocation_posted, patronage_equity_revolved]
    rule: >
      Equity is looked at across every membership a member holds rather than class by class. Qualifying business is
      allocated to the voting membership where the member holds one, and only where they hold none does it fall to the
      associate account; it is never split across two memberships, because the business was done once. Revolvement is
      paid out of a single annual pool the board fixes as a percentage of unrevolved equity, and the member's share of
      that pool is taken across all their memberships together in the order the classes fix, so a member holding both a
      voting membership and a certificate holding is paid the older of the two allocation years first regardless of
      which membership carries it. Equity on a class that has reached its maximum equity balance earns no further
      retention, and the equity portion of any further allocation on that class is paid in cash instead. Equity on a
      class below its minimum equity balance is not revolved below that minimum while the membership stays open, since
      the minimum is what keeps the class alive.
    eligibility: []
    params:
      allocation_target_order: [voting_membership, preferred_membership, associate_account]
      per_tier:
        Associate Patron Account: {cycle_years: "=revolvement_cycle_years", pool_pct: "=revolvement_annual_pool_pct", order: "=revolvement_order", floor_usd: "=minimum_equity_balance_usd", ceiling_usd: "=maximum_equity_balance_usd"}
        Class A Voting Membership: {cycle_years: "=revolvement_cycle_years", pool_pct: "=revolvement_annual_pool_pct", order: "=revolvement_order", floor_usd: "=minimum_equity_balance_usd", ceiling_usd: "=maximum_equity_balance_usd"}
        Class B Preferred Equity Membership: {cycle_years: "=revolvement_cycle_years", pool_pct: "=revolvement_annual_pool_pct", order: "=revolvement_order", floor_usd: "=minimum_equity_balance_usd", ceiling_usd: "=maximum_equity_balance_usd"}
        Retained Patronage Certificate Holding: {cycle_years: "=revolvement_cycle_years", pool_pct: "=revolvement_annual_pool_pct", order: "=revolvement_order", floor_usd: "=minimum_equity_balance_usd", ceiling_usd: "=maximum_equity_balance_usd"}
        Age Retirement Equity Membership: {cycle_years: "=revolvement_cycle_years", pool_pct: "=revolvement_annual_pool_pct", order: "=revolvement_order", floor_usd: "=minimum_equity_balance_usd", ceiling_usd: "=maximum_equity_balance_usd"}
        Estate Retirement Equity Holding: {cycle_years: "=revolvement_cycle_years", pool_pct: "=revolvement_annual_pool_pct", order: "=revolvement_order", floor_usd: "=minimum_equity_balance_usd", ceiling_usd: "=maximum_equity_balance_usd"}
    measures: [patronage_msr_lifetime_allocated]

  - id: patronage_evt_unit_accrual
    subject: [patronage_units_accrued]
    rule: >
      Qualifying business is what the member did with the cooperative in the fiscal year on a programme the relevant
      catalogue marks patronage-eligible, and it is recorded on the basis natural to that business. Grain marketed
      accrues on settled bushels rather than delivered bushels, so bushels delivered but still unpriced at the year end
      accrue in the year they are settled and not the year they were hauled. Crop input purchases accrue on the
      invoiced amount net of discounts, so a discount taken reduces the units as well as the bill. Fuel accrues on
      gallons delivered and feed on tons delivered, both on the delivery date. Service work accrues on the amount
      billed. Business done on a programme that is not patronage-eligible accrues nothing at all, and business done
      while the membership stands in applied is held and accrues to the membership once the board accepts it. The
      fiscal year a parcel of business falls in is fixed by the settlement, invoice or delivery date on the record, not
      by when the member paid for it, and the fiscal year ends 31 August. Where a member's qualifying business for a
      fiscal year falls under the class's minimum to qualify, no allocation is made for that year and the units are
      carried forward into the next.
    eligibility: []
    params:
      accrual_date_basis: settlement_or_invoice_or_delivery_date_on_the_record
      per_tier:
        Associate Patron Account: {grain_rate: "=allocation_rate_grain_per_bushel_usd", input_rate: "=allocation_rate_input_per_dollar_usd", energy_rate: "=allocation_rate_energy_per_gallon_usd", feed_rate: "=allocation_rate_feed_per_ton_usd", service_rate: "=allocation_rate_service_per_dollar_usd", minimum_qualifying_usd: "=minimum_business_to_qualify_usd"}
        Class A Voting Membership: {grain_rate: "=allocation_rate_grain_per_bushel_usd", input_rate: "=allocation_rate_input_per_dollar_usd", energy_rate: "=allocation_rate_energy_per_gallon_usd", feed_rate: "=allocation_rate_feed_per_ton_usd", service_rate: "=allocation_rate_service_per_dollar_usd", minimum_qualifying_usd: "=minimum_business_to_qualify_usd"}
        Class B Preferred Equity Membership: {grain_rate: "=allocation_rate_grain_per_bushel_usd", input_rate: "=allocation_rate_input_per_dollar_usd", energy_rate: "=allocation_rate_energy_per_gallon_usd", feed_rate: "=allocation_rate_feed_per_ton_usd", service_rate: "=allocation_rate_service_per_dollar_usd", minimum_qualifying_usd: "=minimum_business_to_qualify_usd"}
        Retained Patronage Certificate Holding: {grain_rate: "=allocation_rate_grain_per_bushel_usd", input_rate: "=allocation_rate_input_per_dollar_usd", energy_rate: "=allocation_rate_energy_per_gallon_usd", feed_rate: "=allocation_rate_feed_per_ton_usd", service_rate: "=allocation_rate_service_per_dollar_usd", minimum_qualifying_usd: "=minimum_business_to_qualify_usd"}
        Age Retirement Equity Membership: {grain_rate: "=allocation_rate_grain_per_bushel_usd", input_rate: "=allocation_rate_input_per_dollar_usd", energy_rate: "=allocation_rate_energy_per_gallon_usd", feed_rate: "=allocation_rate_feed_per_ton_usd", service_rate: "=allocation_rate_service_per_dollar_usd", minimum_qualifying_usd: "=minimum_business_to_qualify_usd"}
        Estate Retirement Equity Holding: {grain_rate: "=allocation_rate_grain_per_bushel_usd", input_rate: "=allocation_rate_input_per_dollar_usd", energy_rate: "=allocation_rate_energy_per_gallon_usd", feed_rate: "=allocation_rate_feed_per_ton_usd", service_rate: "=allocation_rate_service_per_dollar_usd", minimum_qualifying_usd: "=minimum_business_to_qualify_usd"}
    measures: [patronage_msr_fiscal_year_units]

  - id: patronage_allocation
    subject: [patronage_allocation_posted]
    rule: >
      The board declares the year's allocation rates after the fiscal year closes, and until it has declared them no
      allocation exists to be quoted to a member however confidently they can predict it from last year. Allocation is
      the member's qualifying units on each basis times the declared rate for that basis, computed separately per
      basis and then added, and it is posted against the fiscal year the units fell in rather than the year it is
      declared in. Every allocation is split into a cash portion and an equity portion at the percentages the class
      fixes, and the two percentages always add to a hundred, so a class paying all cash retains nothing and a
      certificate class paying no cash retains it all. Where the whole allocation for a member for a year falls under
      the class minimum nothing is posted and the units carry forward. Allocations on a qualified class are reported on
      an information return where they reach the reporting threshold, and on a nonqualified class nothing is reported
      until the equity is actually paid out. Written notice of the allocation reaches the member within the class's
      notice period counted in calendar days from the day the board declared, and the notice is the member's evidence
      of what was allocated. An allocation is posted only while the membership stands in active or revolving, so a
      membership under an allocation hold waits until the hold is lifted.
    eligibility:
      - id: membership_live_for_allocation
        applies_to: [patronage_allocation_posted]
        kind: state
        condition: An allocation is posted only while the membership stands in active or revolving, so a membership under an allocation hold waits until the hold is lifted.
        evidence_fields: [patronage_memberships.status, patronage_memberships.membership_number, patronage_ledger.notice_number]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [patronage_ledger.notice_number]
          action_bindings:
            patronage_ledger.notice_number: notice_number
        state_contract:
          field: patronage_memberships.status
          allowed: [active, revolving]
    params:
      per_tier:
        Associate Patron Account: {cash_pct: "=cash_portion_pct", equity_pct: "=equity_portion_pct", minimum_usd: "=minimum_allocation_usd", qualified: "=qualified_allocation", reporting_threshold_usd: "=tax_form_threshold_usd", notice_days: "=allocation_notice_days"}
        Class A Voting Membership: {cash_pct: "=cash_portion_pct", equity_pct: "=equity_portion_pct", minimum_usd: "=minimum_allocation_usd", qualified: "=qualified_allocation", reporting_threshold_usd: "=tax_form_threshold_usd", notice_days: "=allocation_notice_days"}
        Class B Preferred Equity Membership: {cash_pct: "=cash_portion_pct", equity_pct: "=equity_portion_pct", minimum_usd: "=minimum_allocation_usd", qualified: "=qualified_allocation", reporting_threshold_usd: "=tax_form_threshold_usd", notice_days: "=allocation_notice_days"}
        Retained Patronage Certificate Holding: {cash_pct: "=cash_portion_pct", equity_pct: "=equity_portion_pct", minimum_usd: "=minimum_allocation_usd", qualified: "=qualified_allocation", reporting_threshold_usd: "=tax_form_threshold_usd", notice_days: "=allocation_notice_days"}
        Age Retirement Equity Membership: {cash_pct: "=cash_portion_pct", equity_pct: "=equity_portion_pct", minimum_usd: "=minimum_allocation_usd", qualified: "=qualified_allocation", reporting_threshold_usd: "=tax_form_threshold_usd", notice_days: "=allocation_notice_days"}
        Estate Retirement Equity Holding: {cash_pct: "=cash_portion_pct", equity_pct: "=equity_portion_pct", minimum_usd: "=minimum_allocation_usd", qualified: "=qualified_allocation", reporting_threshold_usd: "=tax_form_threshold_usd", notice_days: "=allocation_notice_days"}
    formula:
      allocated_amount: round(patronage_units * rate_per_unit, 2)
      cash_portion_amount: round(patronage_units * rate_per_unit * cash_portion_pct / 100, 2)
      equity_portion_amount: round(patronage_units * rate_per_unit, 2) - round(patronage_units * rate_per_unit * cash_portion_pct / 100, 2)

  - id: patronage_cash_payment
    subject: [patronage_cash_paid]
    rule: >
      The cash portion of a declared allocation is delivered by the methods the class allows and by no others. Where
      the class allows offsetting and the member owes the cooperative money, the cash portion is applied against what
      they owe before any payment is issued, in the offset priority order the class fixes, and the member receives only
      what is left. Offsetting is not a choice the member makes at the counter and not one the desk makes for them; it
      is a standing term of the membership. Where the cash portion after offset falls under the class's payment
      minimum, nothing is issued and the amount is carried forward to the following year's cash portion rather than
      forfeited. A member may ask for the cash portion to be credited onto their crop input account instead of paid,
      where the class allows that method, and the whole of it moves rather than part. The cash portion is paid once per
      allocation notice, so a corrected notice is paid by a further row referencing the same notice and not by
      reissuing the first payment.
    eligibility: []
    params:
      per_tier:
        Associate Patron Account: {methods: "=cash_payment_methods_allowed", minimum_usd: "=cash_payment_minimum_usd", offset: "=offset_against_unpaid_balance", offset_order: "=offset_priority_order"}
        Class A Voting Membership: {methods: "=cash_payment_methods_allowed", minimum_usd: "=cash_payment_minimum_usd", offset: "=offset_against_unpaid_balance", offset_order: "=offset_priority_order"}
        Class B Preferred Equity Membership: {methods: "=cash_payment_methods_allowed", minimum_usd: "=cash_payment_minimum_usd", offset: "=offset_against_unpaid_balance", offset_order: "=offset_priority_order"}
        Retained Patronage Certificate Holding: {methods: "=cash_payment_methods_allowed", minimum_usd: "=cash_payment_minimum_usd", offset: "=offset_against_unpaid_balance", offset_order: "=offset_priority_order"}
        Age Retirement Equity Membership: {methods: "=cash_payment_methods_allowed", minimum_usd: "=cash_payment_minimum_usd", offset: "=offset_against_unpaid_balance", offset_order: "=offset_priority_order"}
        Estate Retirement Equity Holding: {methods: "=cash_payment_methods_allowed", minimum_usd: "=cash_payment_minimum_usd", offset: "=offset_against_unpaid_balance", offset_order: "=offset_priority_order"}

  - id: patronage_retain
    subject: [patronage_retain_withheld]
    rule: >
      Two things land in the member's equity account and they are not the same thing. The equity portion of the
      allocation is the part of the declared patronage the class holds back, and it is credited at the same time the
      allocation is posted. The per-unit capital retain is taken separately at the class's retain rate on the
      qualifying units of the streams the class lists, and it is taken whether or not the board declares any allocation
      at all that year, because it is a capital contribution and not a share of earnings. A class that lists no streams
      takes no retain. Both are credited to the same equity balance and both revolve back out on the same cycle, and
      neither is ever refunded on request, since equity is returned only by revolvement, retirement or transfer. Where
      the class has reached its maximum equity balance the retain is still taken but the equity portion of the
      allocation is paid in cash instead, so the ceiling limits retention of earnings and not capital.
    eligibility: []
    params:
      per_tier:
        Associate Patron Account: {retain_rate_usd: "=per_unit_retain_rate_usd", streams: "=per_unit_retain_applies_to", ceiling_usd: "=maximum_equity_balance_usd"}
        Class A Voting Membership: {retain_rate_usd: "=per_unit_retain_rate_usd", streams: "=per_unit_retain_applies_to", ceiling_usd: "=maximum_equity_balance_usd"}
        Class B Preferred Equity Membership: {retain_rate_usd: "=per_unit_retain_rate_usd", streams: "=per_unit_retain_applies_to", ceiling_usd: "=maximum_equity_balance_usd"}
        Retained Patronage Certificate Holding: {retain_rate_usd: "=per_unit_retain_rate_usd", streams: "=per_unit_retain_applies_to", ceiling_usd: "=maximum_equity_balance_usd"}
        Age Retirement Equity Membership: {retain_rate_usd: "=per_unit_retain_rate_usd", streams: "=per_unit_retain_applies_to", ceiling_usd: "=maximum_equity_balance_usd"}
        Estate Retirement Equity Holding: {retain_rate_usd: "=per_unit_retain_rate_usd", streams: "=per_unit_retain_applies_to", ceiling_usd: "=maximum_equity_balance_usd"}
    formula:
      retain_amount: round(patronage_units * per_unit_retain_rate_usd, 2)

  - id: patronage_revolvement
    subject: [patronage_revolvement_cycle_entered, patronage_equity_revolved]
    rule: >
      Equity comes back to the member on the board's revolvement cycle and not on request. An allocation year becomes
      eligible once it has stood for the class's cycle in whole fiscal years, counted from the fiscal year the
      allocation was posted for, and the board then revolves that year's equity out of the annual pool in the order the
      class fixes. The pool is a percentage of unrevolved equity fixed each year by the board, so an eligible year is
      not necessarily paid in full in the first year it becomes eligible, and a member whose eligible year is only part
      paid carries the remainder into the next cycle. Revolvement is paid in the order the class fixes, which is
      ordinarily oldest allocation year first and, on the age retirement class, by the age of the member before the
      allocation year. Equity is never revolved below the class's minimum equity balance while the membership stays
      open. A member may not buy their way to the front of the cycle, offer a discount for early payment or ask the
      board to skip a year on hardship grounds; those are board decisions on which no standing policy exists.
    eligibility: []
    params:
      eligibility_basis: whole_fiscal_years_since_the_allocation_year
    measures: [patronage_msr_unrevolved_equity_age]

  - id: patronage_retirement
    subject: [patronage_membership_retired]
    rule: >
      Equity is retired ahead of the cycle in only the cases the class allows. On age, a member who has reached the
      class's retirement age may apply, the age being taken from the year of birth on their own record and measured at
      the close of the current fiscal year, and the equity is paid over the class's number of annual instalments less
      the class's age retirement discount. On death, the estate applies within the class's notice period counted in
      whole calendar days from the recorded date of death, and the estate's application is considered only once the
      class's required estate documentation is lodged and recorded. A relative telephoning to say the member has died
      is not that documentation, however well known the family is at the counter, and nothing is retired on it. Early
      retirement, where the class allows it at all, carries the class's early retirement discount and is at the board's
      discretion rather than the member's right. Every retirement is approved by the board before it is paid where the
      class requires board approval, and the desk records the application rather than promising an outcome. A member
      whose class allows no early retirement and who is under the retirement age has no route to their equity except
      the ordinary cycle, and a request to shorten it is one no policy settles.
    eligibility:
      - id: estate_documentation_lodged
        applies_to: [patronage_membership_retired]
        kind: authorization
        condition: On death, the estate applies within the class's notice period counted in whole calendar days from the recorded date of death, and the estate's application is considered only once the class's required estate documentation is lodged and recorded.
        evidence_fields: [patronage_requests.request_type, patronage_requests.request_status, patronage_requests.signed_by_member, patronage_requests.request_id, patronage_memberships.estate_flag]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [patronage_requests.request_id]
          action_bindings:
            patronage_requests.request_id: request_id
    params:
      per_tier:
        Associate Patron Account: {age_years: "=age_retirement_age_years", age_discount_pct: "=age_retirement_discount_pct", instalments: "=age_retirement_installments", estate_open: "=estate_retirement_allowed", estate_notice_days: "=estate_retirement_notice_days", early_open: "=early_retirement_allowed", early_discount_pct: "=early_retirement_discount_pct"}
        Class A Voting Membership: {age_years: "=age_retirement_age_years", age_discount_pct: "=age_retirement_discount_pct", instalments: "=age_retirement_installments", estate_open: "=estate_retirement_allowed", estate_notice_days: "=estate_retirement_notice_days", early_open: "=early_retirement_allowed", early_discount_pct: "=early_retirement_discount_pct"}
        Class B Preferred Equity Membership: {age_years: "=age_retirement_age_years", age_discount_pct: "=age_retirement_discount_pct", instalments: "=age_retirement_installments", estate_open: "=estate_retirement_allowed", estate_notice_days: "=estate_retirement_notice_days", early_open: "=early_retirement_allowed", early_discount_pct: "=early_retirement_discount_pct"}
        Retained Patronage Certificate Holding: {age_years: "=age_retirement_age_years", age_discount_pct: "=age_retirement_discount_pct", instalments: "=age_retirement_installments", estate_open: "=estate_retirement_allowed", estate_notice_days: "=estate_retirement_notice_days", early_open: "=early_retirement_allowed", early_discount_pct: "=early_retirement_discount_pct"}
        Age Retirement Equity Membership: {age_years: "=age_retirement_age_years", age_discount_pct: "=age_retirement_discount_pct", instalments: "=age_retirement_installments", estate_open: "=estate_retirement_allowed", estate_notice_days: "=estate_retirement_notice_days", early_open: "=early_retirement_allowed", early_discount_pct: "=early_retirement_discount_pct"}
        Estate Retirement Equity Holding: {age_years: "=age_retirement_age_years", age_discount_pct: "=age_retirement_discount_pct", instalments: "=age_retirement_installments", estate_open: "=estate_retirement_allowed", estate_notice_days: "=estate_retirement_notice_days", early_open: "=early_retirement_allowed", early_discount_pct: "=early_retirement_discount_pct"}
    measures: [patronage_msr_member_age_years]

  - id: patronage_equity_transfer
    subject: [patronage_membership_transferred, patronage_equity_transferred]
    rule: >
      Equity is signed over only on classes the catalogue allows it on, only to a transferee of a class the catalogue
      lists, and only on a signed transfer instruction the equity desk has registered. Where the class requires board
      approval, the transfer is not recorded until the board has approved it, and the desk registers the application
      and tells the member when the board next sits rather than predicting the answer. The transferee must already be a
      member of the cooperative or must open a membership as part of the transfer, because equity cannot be held by a
      stranger to the cooperative. A transfer moves equity at its face value with no discount, carries the class's
      transfer fee, and does not reset the allocation years behind the equity, so the transferee inherits the
      transferor's place in the revolvement cycle rather than starting afresh. Transferring the whole of a membership
      closes the transferor's account, and transferring part leaves it open with the remainder. Equity may not be
      pledged, sold to a third party for value, or used as security for a loan, and a member asking for any of those is
      passed to the equity desk of the cooperative's counsel rather than answered here.
    eligibility:
      - id: signed_transfer_instruction
        applies_to: [patronage_equity_transferred, patronage_membership_transferred]
        kind: authorization
        condition: Equity is signed over only on classes the catalogue allows it on, only to a transferee of a class the catalogue lists, and only on a signed transfer instruction the equity desk has registered.
        evidence_fields: [patronage_requests.request_type, patronage_requests.request_status, patronage_requests.signed_by_member, patronage_requests.request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [patronage_requests.request_id]
          action_bindings:
            patronage_requests.request_id: request_id
    params:
      per_tier:
        Associate Patron Account: {allowed: "=transfer_allowed", board_approval: "=transfer_board_approval_required", transferees: "=transfer_eligible_transferees", fee_usd: "=transfer_fee_usd"}
        Class A Voting Membership: {allowed: "=transfer_allowed", board_approval: "=transfer_board_approval_required", transferees: "=transfer_eligible_transferees", fee_usd: "=transfer_fee_usd"}
        Class B Preferred Equity Membership: {allowed: "=transfer_allowed", board_approval: "=transfer_board_approval_required", transferees: "=transfer_eligible_transferees", fee_usd: "=transfer_fee_usd"}
        Retained Patronage Certificate Holding: {allowed: "=transfer_allowed", board_approval: "=transfer_board_approval_required", transferees: "=transfer_eligible_transferees", fee_usd: "=transfer_fee_usd"}
        Age Retirement Equity Membership: {allowed: "=transfer_allowed", board_approval: "=transfer_board_approval_required", transferees: "=transfer_eligible_transferees", fee_usd: "=transfer_fee_usd"}
        Estate Retirement Equity Holding: {allowed: "=transfer_allowed", board_approval: "=transfer_board_approval_required", transferees: "=transfer_eligible_transferees", fee_usd: "=transfer_fee_usd"}

  - id: patronage_adjustment
    subject: [patronage_allocation_adjusted, patronage_allocation_hold_set]
    rule: >
      An allocation already posted is restated only where the volume behind it was wrong, where the member's class
      changed with effect on that year, or where a death has been recorded with effect on it, and only within the
      class's restatement window counted in whole fiscal years back from the current fiscal year. A restatement takes
      the units off the membership and posts the allocation afresh at the rate declared for the year restated, never at
      this year's rate. While a restatement or a disputed volume is being worked the membership is put under an
      allocation hold, which stops allocation being posted but does not stop qualifying business accruing, and the hold
      runs no longer than the class's hold maximum in calendar days from the day it was set, after which allocation
      resumes on the figures then on record. A member who disagrees with the volume behind an allocation may ask for
      the underlying settlements or invoices to be re-examined, and the desk registers that and puts the hold on; a
      member who simply believes the board's rate should have been higher is asking about a board decision, and no
      policy here can move it.
    eligibility:
      - id: restatement_within_window
        applies_to: [patronage_allocation_adjusted]
        kind: time
        condition: An allocation already posted is restated only where the volume behind it was wrong, where the member's class changed with effect on that year, or where a death has been recorded with effect on it, and only within the class's restatement window counted in whole fiscal years back from the current fiscal year.
        evidence_fields: [patronage_ledger.entry_date, patronage_ledger.fiscal_year, patronage_ledger.notice_number, patronage_ledger.adjustment_reason]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [patronage_ledger.notice_number]
          action_bindings:
            patronage_ledger.notice_number: notice_number
        temporal_basis:
          clock: frozen_time
          anchor_event: the current fiscal year
          anchor_source: patronage_ledger.entry_date
          relation: not_after
          duration_source: variants.restatement_window_years
          unit: calendar_months
          counting_rule: counted in whole fiscal years back from the current fiscal year
          boundary: inclusive
    params:
      restatement_rate_basis: the_rate_declared_for_the_year_restated

  - id: patronage_membership_maintenance
    subject: [patronage_membership_updated, patronage_membership_activated]
    rule: >
      The board accepts or declines a membership application at its next sitting, and until it has accepted one the
      account earns nothing and votes nothing. On acceptance the class's common stock is issued and voting rights are
      granted where the class carries them. The tax election between qualified and nonqualified treatment is the
      member's to make and is recorded on their signed election, and it takes effect for allocations posted after the
      election rather than for years already posted. A recorded death is entered only from the certified documentation
      the class requires, never from what a caller says, and entering it moves the membership onto the estate class at
      the next allocation. The year of birth is corrected only against the identity document on the membership
      application, because it decides age retirement. A membership with no qualifying business for the class's
      inactivity period in whole fiscal years is treated as inactive, which stops the annual meeting notice but does
      not touch the equity or its place in the revolvement cycle. A membership is updated only while it stands in
      active, allocation_hold or revolving, since a retired or transferred account is closed to change.
    eligibility:
      - id: membership_live_for_maintenance
        applies_to: [patronage_membership_updated]
        kind: state
        condition: A membership is updated only while it stands in active, allocation_hold or revolving, since a retired or transferred account is closed to change.
        evidence_fields: [patronage_memberships.status, patronage_memberships.membership_number]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [patronage_memberships.membership_number]
          action_bindings:
            patronage_memberships.membership_number: membership_number
        state_contract:
          field: patronage_memberships.status
          allowed: [active, allocation_hold, revolving]
    params:
      tax_election_effect: prospective_only
