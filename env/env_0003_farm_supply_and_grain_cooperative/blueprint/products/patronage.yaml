category: patronage
display_name: Membership and Patronage Equity

binding:
  holding_table: patronage_memberships
  event_tables: [patronage_ledger]
  intake_tables: [patronage_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields:
    equity_balance: member_equity

lifecycle:
  states: [applied, active, allocation_hold, revolving, retired, transferred]
  transitions:
    - {from: applied, to: active, by: agent, means: the board accepts the membership application and the equity account opens}
    - {from: active, to: allocation_hold, by: system, means: allocation is held back while a restatement or a disputed volume is worked}
    - {from: allocation_hold, to: active, by: agent, means: the matter behind the hold is settled and allocation resumes}
    - {from: active, to: revolving, by: system, means: the membership enters the board's revolvement cycle and equity begins coming back}
    - {from: revolving, to: active, by: system, means: the year's revolvement finishes with equity still standing}
    - {from: active, to: retired, by: user, means: the member asks for their equity to be retired on age or the estate asks on death}
    - {from: allocation_hold, to: retired, by: agent, means: the board retires the equity while allocation was on hold}
    - {from: revolving, to: retired, by: agent, means: the board retires the remaining equity part way through the revolvement cycle}
    - {from: active, to: transferred, by: user, means: the member signs their equity over to an eligible transferee}

accounts:
  - key: patronage_base
    unit: qualifying units
    meaning: the volume of qualifying business standing to the membership for a fiscal year, credited as business is done and debited when an allocation is restated away
  - key: member_equity
    unit: USD
    meaning: equity the cooperative holds for the member, credited by the retained portion of each allocation and debited as equity is revolved out or signed over
  - key: cash_patronage_payable
    unit: USD
    meaning: the cash portion of declared patronage the cooperative owes the member, credited when the board's allocation is posted and debited when the cash is delivered

parameter_schema:
  minimum_business_to_qualify_usd: business in a fiscal year below which no allocation is made to the membership (USD)
  common_stock_shares_required: shares of common stock the class carries (count)
  common_stock_par_value_usd: par value of one share of common stock (USD)
  voting_rights_granted: whether the class votes at the annual meeting (switch)
  membership_application_fee_usd: one-off charge for opening the equity account (USD)
  allocation_rate_grain_per_bushel_usd: board-declared allocation on grain marketed (USD per bushel)
  allocation_rate_input_per_dollar_usd: board-declared allocation on crop input spend (USD per dollar)
  allocation_rate_energy_per_gallon_usd: board-declared allocation on refined fuels and propane (USD per gallon)
  allocation_rate_feed_per_ton_usd: board-declared allocation on feed (USD per ton)
  allocation_rate_service_per_dollar_usd: board-declared allocation on custom application and other services (USD per dollar)
  cash_portion_pct: share of an allocation delivered in cash (percent)
  equity_portion_pct: share of an allocation retained as member equity (percent)
  minimum_allocation_usd: allocation below which nothing is posted for the year and the units are carried forward (USD)
  qualified_allocation: whether allocations on this class are qualified for tax purposes (switch)
  tax_form_threshold_usd: allocation at or above which an information return is issued (USD)
  allocation_declared_month_day: the month and day the board normally declares the year's allocation (MM-DD)
  allocation_notice_days: calendar days within which the written notice reaches the member after the board declares
  per_unit_retain_rate_usd: capital retained per qualifying unit over and above the allocation (USD per unit)
  per_unit_retain_applies_to: which business streams the per-unit retain is taken on (list of allocation bases)
  revolvement_cycle_years: how many fiscal years old an allocation must be before it revolves (years)
  revolvement_order: the order in which unrevolved allocations are paid back (order basis)
  revolvement_annual_pool_pct: share of the year's unrevolved equity the board revolves in one year (percent)
  age_retirement_age_years: the age at which a member may ask for their equity to be retired (years)
  age_retirement_discount_pct: discount taken on equity retired on age ahead of the ordinary cycle (percent)
  age_retirement_installments: how many annual instalments an age retirement is paid over (count)
  estate_retirement_allowed: whether equity is retired on the death of a member (switch)
  estate_retirement_discount_pct: discount taken on equity retired to an estate (percent)
  estate_retirement_notice_days: calendar days from the recorded date of death within which the estate must apply
  estate_documentation_required: which document the estate must lodge before retirement is considered (document class)
  early_retirement_allowed: whether a member may ask for equity to be retired before age or death (switch)
  early_retirement_discount_pct: discount taken on equity retired early (percent)
  transfer_allowed: whether equity on this class may be signed over to another party (switch)
  transfer_board_approval_required: whether the board must approve a transfer (switch)
  transfer_eligible_transferees: who equity may be signed over to (list of transferee classes)
  transfer_fee_usd: charge for recording a transfer (USD)
  minimum_equity_balance_usd: equity the class must carry to remain open (USD)
  maximum_equity_balance_usd: equity above which the board declines further retention on this class (USD)
  dividend_rate_pct: annual dividend paid on preferred equity (percent)
  dividend_paid_on_preferred: whether the class carries a dividend at all (switch)
  offset_against_unpaid_balance: whether cash patronage is offset against what the member owes the cooperative (switch)
  offset_priority_order: the order accounts are offset in when cash patronage is applied against balances (order basis)
  allocation_hold_max_days: longest allocation may be held back while a restatement is worked (calendar days)
  restatement_window_years: fiscal years back within which an allocation may still be restated (years)
  statement_delivery_method: how patronage notices reach the member (channel)
  annual_meeting_notice_days: calendar days of notice given before the annual meeting
  proxy_voting_allowed: whether a voting member may vote by proxy (switch)
  minimum_years_of_membership: fiscal years of membership before the class may be held (years)
  inactive_membership_years: fiscal years with no qualifying business after which the membership is treated as inactive (years)
  cash_payment_minimum_usd: cash patronage below which no payment is issued and the amount is carried forward (USD)
  cash_payment_methods_allowed: how the cash portion may be delivered (list of methods)
  equity_certificate_issued: whether a written certificate is issued for the retained equity (switch)
  board_approval_required_for_retirement: whether the board must approve a retirement before it is paid (switch)

