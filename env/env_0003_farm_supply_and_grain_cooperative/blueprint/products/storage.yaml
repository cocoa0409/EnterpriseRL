category: storage
display_name: Grain Storage and Conditioning Agreements

binding:
  holding_table: storage_agreements
  event_tables: [storage_charges]
  intake_tables: [storage_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields:
    bushels_in_store: stored_bushels

lifecycle:
  states: [applied, active, billing_hold, in_loadout, closed, terminated]
  transitions:
    - {from: applied, to: active, by: agent, means: the elevator accepts the grain into store under the agreement and billing begins}
    - {from: active, to: billing_hold, by: system, means: billing is suspended while a disputed charge or a quality recheck is worked}
    - {from: billing_hold, to: active, by: agent, means: the dispute or recheck is resolved and billing resumes}
    - {from: active, to: in_loadout, by: agent, means: a load-out order is released and grain begins moving out}
    - {from: in_loadout, to: active, by: system, means: the load-out finishes with bushels still in store}
    - {from: in_loadout, to: closed, by: system, means: the load-out empties the agreement and it closes}
    - {from: active, to: closed, by: user, means: the member signs the agreement out with no bushels left in store}
    - {from: active, to: terminated, by: agent, means: the elevator ends the agreement for unpaid charges or for grain going out of condition}
    - {from: billing_hold, to: terminated, by: agent, means: the elevator ends the agreement while billing was suspended}

accounts:
  - key: stored_bushels
    unit: bushels
    meaning: bushels physically held under the agreement, credited on deposit and debited by load-out and by shrink taken
  - key: storage_charges_payable
    unit: USD
    meaning: storage account charges the member owes, credited by every charge raised and debited when the charges are settled

parameter_schema:
  min_deposit_bushels: smallest deposit the agreement will be opened for (whole bushels)
  max_bushels_per_agreement: most bushels one agreement may carry (whole bushels)
  agreement_setup_fee_usd: one-off fee charged when the agreement is accepted (USD)
  free_storage_days: calendar days grain carries free of storage charge from the storage start date
  storage_rate_per_bushel_per_day_usd: daily storage rate where the agreement bills daily (USD per bushel per day)
  storage_rate_per_bushel_per_month_usd: monthly storage rate where the agreement bills monthly (USD per bushel per month)
  storage_billing_basis: which of the two rates the agreement bills on (basis)
  storage_billing_period_days: length of one billing period on this agreement (calendar days)
  storage_minimum_charge_usd: floor under the storage charge for any one billing period (USD)
  paid_up_storage_flat_rate_per_bushel_usd: single up-front rate buying storage through the paid-up date (USD per bushel)
  paid_up_storage_through_date_month_day: the month and day paid-up storage runs through (MM-DD)
  storage_rate_escalation_after_days: calendar days in store after which the storage rate steps up
  storage_rate_escalation_pct: how much the storage rate steps up by once the escalation point is passed (percent)
  drying_rate_per_point_per_bushel_usd: drying charge for each moisture point removed (USD per point per bushel)
  drying_minimum_points: smallest number of points that will be billed on any drying pass (percentage points)
  drying_target_moisture_pct: the moisture the dryer runs grain down to (percent)
  drying_handling_shrink_pct_per_point: handling shrink taken for each point removed, over and above water loss (percent per point)
  drying_minimum_charge_usd: floor under the drying charge for any one pass (USD)
  aeration_fee_per_bushel_usd: charge for a scheduled aeration cycle (USD per bushel)
  turning_fee_per_bushel_usd: charge for turning grain between bins (USD per bushel)
  aeration_included: whether scheduled aeration is carried by the agreement at no separate charge (switch)
  handling_in_fee_per_bushel_usd: elevation charge taken when grain goes into store (USD per bushel)
  handling_out_fee_per_bushel_usd: elevation charge taken when grain comes out of store (USD per bushel)
  loadout_minimum_bushels: smallest load-out the elevator will schedule (whole bushels)
  loadout_notice_business_days: business days of notice a load-out needs before it is scheduled
  loadout_truck_fee_usd: charge per truck loaded out (USD)
  out_of_schedule_loadout_fee_usd: charge for a load-out taken outside the posted load-out hours (USD)
  warehouse_receipt_allowed: whether a negotiable warehouse receipt may be issued against the grain (switch)
  warehouse_receipt_issuance_fee_usd: charge for issuing a warehouse receipt (USD)
  warehouse_receipt_insurance_required: whether the member's own stored-grain insurance certificate must be on file first (switch)
  receipt_cancellation_fee_usd: charge for cancelling an outstanding warehouse receipt (USD)
  quality_grade_guarantee: what grade the elevator is obliged to return the grain at (guarantee basis)
  quality_discount_per_grade_step_usd: discount for each full grade step below the received grade at return (USD per bushel)
  quality_recheck_fee_usd: charge for a member-requested quality recheck (USD)
  identity_preserved_segregation_fee_per_bushel_usd: charge for keeping a lot segregated from the house bin (USD per bushel)
  commingling_allowed: whether the grain may be commingled with the house bin (switch)
  max_storage_days: longest grain may stay in store under the agreement before it must move (calendar days)
  early_termination_fee_usd: charge for ending the agreement before its minimum term (USD)
  early_termination_notice_days: calendar days of notice required to end the agreement early
  late_payment_fee_usd: charge added when storage charges pass their grace period unpaid (USD)
  late_payment_grace_days: calendar days after the storage invoice date before the late charge is added
  storage_settlement_from_grain_proceeds: whether storage charges are settled out of grain settlement proceeds by default (switch)
  billing_hold_max_days: longest billing may be suspended while a dispute is worked (calendar days)
  insurance_required: whether the member's own stored-grain insurance certificate is required to open the agreement (switch)
  shrink_pct_on_transfer_to_contract: shrink taken when stored bushels are transferred onto a marketing contract (percent)
  transfer_to_contract_fee_per_bushel_usd: charge for transferring stored bushels onto a marketing contract (USD per bushel)
  grain_bank_return_ratio: bushels of finished product returned per bushel deposited on a grain bank agreement (ratio)
  minimum_agreement_term_days: shortest term the agreement may run for (calendar days)
  patronage_eligible: whether bushels stored under this agreement earn patronage allocation (switch)
  per_unit_retain_per_bushel_usd: capital retained per bushel stored and credited to the member's equity account (USD per bushel)
  statement_delivery_method: how storage statements reach the member (channel)
  capacity_share_bushels: bushels of licensed space the agreement reserves for the member (whole bushels)

