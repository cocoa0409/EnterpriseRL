events:
  - type: storage_agreement_opened
    target: storage_agreements
    mutation: create
    meaning: a member signs grain into store under one of the storage programmes and the agreement record is opened in applied standing
    grain: one row per storage agreement written
    fields:
      agreement_id: internal reference of the agreement being opened
      customer_id: the member the grain belongs to
      variant_name: the storage programme the grain is held under
      status: lifecycle standing the agreement opens in, which is always applied
      agreement_number: the agreement number printed on storage statements
      commodity: the commodity to be held
      crop_year: the crop year the grain comes out of
      storage_location: the facility that will hold the grain
      bushels_in_store: bushels on hand, which at opening is zero
      reserved_bushels: bushels already pledged, which at opening is zero
      storage_start_date: the date the first bushels are expected into store
      storage_end_date: the scheduled end of the agreement where the programme fixes one
      paid_through_date: the date storage is billed and paid through
      opened_date: date the application was taken
      quality_grade: the grade the grain is received on
      insurance_on_file: whether the member's stored-grain insurance certificate is on file
      aeration_enrolled: whether the agreement is enrolled in scheduled aeration and turning
    triggers: []

  - type: storage_agreement_activated
    target: storage_agreements
    mutation: {transition: {from: applied, to: active}}
    meaning: the elevator accepts the grain into store under the agreement and storage billing begins
    grain: one row per agreement accepted into store
    fields:
      status: the standing the agreement moves to
      storage_start_date: the date the first bushels went into store, from which free days and billing run
    triggers: []

  - type: storage_deposit_recorded
    target: storage_charges
    meaning: a load of grain is taken into store under the agreement and the bushels are added to what is on hand
    grain: one row per scale ticket taken into store under this agreement
    distinguish_by: [ticket_number, charge_date]
    fields:
      charge_id: internal reference of the storage account row
      agreement_id: the agreement the bushels go into
      customer_id: the member the bushels belong to
      event_type: the event family this row records
      ticket_number: the scale ticket the load came in on
      charge_date: the date the bushels were taken into store
      charge_type: which class of storage activity this row records
      billing_basis: the basis the row is quoted on
      bushels: bushels taken into store on this load
      posted_date: the date the row was posted to the storage account
    account: stored_bushels
    direction: in
    triggers:
      - event: storage:storage_handling_charged
        map: {agreement_id: agreement_id, customer_id: customer_id, ticket_number: ticket_number, bushels: bushels, charge_type: handling_in, charge_date: charge_date}

  - type: storage_accrual_charged
    target: storage_charges
    meaning: storage is billed for one billing period on the bushels standing in store through that period
    grain: one row per billing period billed on this agreement
    distinguish_by: [period_start, period_end, charge_type]
    fields:
      charge_id: internal reference of the storage account row
      agreement_id: the agreement being billed
      customer_id: the member being billed
      event_type: the event family this row records
      charge_date: the date the accrual was raised
      period_start: first day of the period billed
      period_end: last day of the period billed, counted inclusively
      charge_type: which class of storage activity this row records
      billing_basis: the basis the rate is quoted on
      bushels: bushels standing in store through the period
      rate: the rate applied
      amount: money charged for the period
      invoice_number: the storage invoice the charge was billed on
      paid_flag: whether the charge has been settled
      posted_date: the date the row was posted to the storage account
    account: storage_charges_payable
    direction: in
    triggers: []

  - type: storage_drying_charged
    target: storage_charges
    meaning: wet grain is run through the dryer and the conditioning charge is raised against the agreement
    grain: one row per drying pass on one scale ticket
    distinguish_by: [ticket_number, charge_date]
    fields:
      charge_id: internal reference of the storage account row
      agreement_id: the agreement the grain is held under
      customer_id: the member whose grain is dried
      event_type: the event family this row records
      ticket_number: the scale ticket the grain came in on
      charge_date: the date the pass was run
      charge_type: which class of storage activity this row records
      billing_basis: the basis the rate is quoted on
      bushels: bushels run through the dryer
      rate: the rate applied per point per bushel
      amount: money charged for the pass
      moisture_in_pct: moisture measured before the pass
      moisture_out_pct: moisture measured after the pass
      points_removed: moisture points taken out on the pass
      posted_date: the date the row was posted to the storage account
    account: storage_charges_payable
    direction: in
    triggers:
      - event: storage:storage_shrink_taken
        map: {agreement_id: agreement_id, customer_id: customer_id, ticket_number: ticket_number, bushels: bushels, points_removed: points_removed, charge_type: shrink_adjustment, charge_date: charge_date}

  - type: storage_shrink_taken
    target: storage_charges
    meaning: bushels lost to water removal and handling on a drying pass are taken off what is held in store
    grain: one row per shrink adjustment against one scale ticket
    distinguish_by: [ticket_number, charge_date]
    fields:
      charge_id: internal reference of the storage account row
      agreement_id: the agreement the bushels are held under
      customer_id: the member whose bushels shrink
      event_type: the event family this row records
      ticket_number: the scale ticket the bushels came in on
      charge_date: the date the adjustment was taken
      charge_type: which class of storage activity this row records
      bushels: bushels the adjustment was computed on
      shrink_bushels: bushels taken off what is held in store
      points_removed: moisture points the shrink was computed from
      posted_date: the date the row was posted to the storage account
    account: stored_bushels
    direction: out
    triggers: []

  - type: storage_quality_discount_applied
    target: storage_charges
    meaning: grain returned below the grade it was received at is discounted against the member's storage account
    grain: one row per grade discount raised against one scale ticket
    distinguish_by: [ticket_number, charge_type]
    fields:
      charge_id: internal reference of the storage account row
      agreement_id: the agreement the grain is held under
      customer_id: the member whose grain is discounted
      event_type: the event family this row records
      ticket_number: the scale ticket the grain came in on
      charge_date: the date the discount was raised
      charge_type: which class of storage activity this row records
      billing_basis: the basis the rate is quoted on
      bushels: bushels the discount applies to
      rate: the discount per bushel per grade step
      amount: money discounted
      posted_date: the date the row was posted to the storage account
    account: storage_charges_payable
    direction: in
    triggers: []

  - type: storage_handling_charged
    target: storage_charges
    meaning: an elevation, aeration, turning or receipt charge is raised against the agreement
    grain: one row per handling service performed on this agreement
    distinguish_by: [charge_type, charge_date, loadout_reference]
    fields:
      charge_id: internal reference of the storage account row
      agreement_id: the agreement charged
      customer_id: the member charged
      event_type: the event family this row records
      charge_date: the date the service was performed
      charge_type: which handling service this row records
      billing_basis: the basis the rate is quoted on
      bushels: bushels the service was performed on
      rate: the rate applied
      amount: money charged
      truck_count: trucks loaded where the service was a load-out
      loadout_reference: the load-out order the charge attaches to, where it attaches to one
      ticket_number: the scale ticket the charge attaches to, where it attaches to one
      posted_date: the date the row was posted to the storage account
    account: storage_charges_payable
    direction: in
    triggers: []

  - type: storage_loadout_recorded
    target: storage_charges
    meaning: grain moves out of store on a released load-out order and the bushels come off what is on hand
    grain: one row per load-out order worked against this agreement
    distinguish_by: [loadout_reference, charge_date]
    fields:
      charge_id: internal reference of the storage account row
      agreement_id: the agreement the grain came out of
      customer_id: the member taking the grain out
      event_type: the event family this row records
      loadout_reference: the load-out order worked
      charge_date: the date the grain moved
      charge_type: which class of storage activity this row records
      bushels: bushels moved out of store
      truck_count: trucks loaded on the order
      ticket_number: the scale ticket written for the outbound load
      posted_date: the date the row was posted to the storage account
    account: stored_bushels
    direction: out
    triggers:
      - event: storage:storage_handling_charged
        map: {agreement_id: agreement_id, customer_id: customer_id, loadout_reference: loadout_reference, bushels: bushels, truck_count: truck_count, charge_type: handling_out, charge_date: charge_date}

  - type: storage_charge_settled
    target: storage_charges
    meaning: outstanding storage account charges are cleared, out of grain settlement proceeds or by the member's own payment
    grain: one row per storage invoice settled
    distinguish_by: [invoice_number, charge_date]
    fields:
      charge_id: internal reference of the storage account row
      agreement_id: the agreement whose charges are cleared
      customer_id: the member settling
      event_type: the event family this row records
      invoice_number: the storage invoice being settled
      charge_date: the date the settlement was applied
      charge_type: which class of storage activity this row records
      amount: money applied against the outstanding charges
      paid_flag: whether the invoice is now clear
      posted_date: the date the row was posted to the storage account
    account: storage_charges_payable
    direction: out
    triggers: []

  - type: storage_loadout_started
    target: storage_agreements
    mutation: {transition: [{from: active, to: in_loadout}, {from: in_loadout, to: active}]}
    meaning: a load-out order is released and the agreement moves into load-out, returning to active when bushels remain after it
    grain: one row per load-out release or completion on the agreement
    fields:
      status: the standing the agreement moves to
      bushels_in_store: bushels on hand at the milestone
      reserved_bushels: bushels still pledged at the milestone
    triggers: []

  - type: storage_billing_hold_set
    target: storage_agreements
    mutation: {transition: [{from: active, to: billing_hold}, {from: billing_hold, to: active}]}
    meaning: storage billing is suspended while a disputed charge or a quality recheck is worked, and resumed when it is resolved
    grain: one row per billing suspension or resumption on the agreement
    fields:
      status: the standing the agreement moves to
      paid_through_date: the date storage is billed and paid through at the suspension
    triggers: []

  - type: storage_agreement_updated
    target: storage_agreements
    mutation: update
    meaning: the receipt, the pledge or the billing position on a live agreement is rewritten without changing its standing
    grain: one row per recorded change to the agreement's own particulars
    fields:
      reserved_bushels: the revised bushels pledged against a receipt or a contract
      warehouse_receipt_number: the receipt issued against the stored grain
      paid_through_date: the revised date storage is billed and paid through
      quality_grade: the revised grade of record
      insurance_on_file: whether the stored-grain insurance certificate is now on file
      aeration_enrolled: whether the agreement is now enrolled in scheduled aeration
    triggers: []

  - type: storage_agreement_closed
    target: storage_agreements
    mutation: {transition: [{from: in_loadout, to: closed}, {from: active, to: closed}]}
    meaning: the last bushel comes out and the member signs the agreement out
    grain: one row per agreement closed out
    fields:
      status: the standing the agreement moves to
      closed_date: the date the agreement closed
      bushels_in_store: bushels on hand at closing, which is zero
    triggers: []

  - type: storage_agreement_terminated
    target: storage_agreements
    mutation: {transition: [{from: active, to: terminated}, {from: billing_hold, to: terminated}]}
    meaning: the elevator ends the agreement for unpaid charges or because the grain is going out of condition
    grain: one row per agreement terminated by the elevator
    fields:
      status: the standing the agreement moves to
      closed_date: the date the termination took effect
      bushels_in_store: bushels on hand when the agreement was ended
    triggers: []

measures:
  - id: storage_msr_days_in_store
    window: from the storage start date of the agreement through the handling date, the storage start date counting as day zero
    measure: count of calendar days the bushels under the agreement have stood in store
  - id: storage_msr_chargeable_storage_months
    window: the days in store beyond the free days, grouped into billing periods of the agreement's billing period length, any part of a period counting as a whole one
    measure: count of chargeable billing periods on the agreement
  - id: storage_msr_free_bushels
    window: the agreement as it stands on the handling date
    measure: bushels_in_store less reserved_bushels on the agreement
  - id: storage_msr_crop_year_deposited_bushels
    window: the current crop year, which runs 1 September through 31 August
    measure: sum of bushels over the member's storage_deposit_recorded rows in that crop year across every agreement they hold

policies:
  - id: storage_agg_multi_holding
    subject: [storage_agreement_opened]
    rule: >
      A member may hold more than one storage agreement at a time, and in practice most do, because an agreement
      covers one commodity of one crop year at one facility. The cooperative writes no more than six live storage
      agreements for one member at any moment, counting every agreement that is not closed or terminated. Two live
      agreements for the same member covering the same commodity, the same crop year, the same facility and the same
      programme are never written, because bushels would then have no single home and the free-day clock would run
      twice; where a member asks for a second one the existing agreement is used instead. Different programmes for the
      same commodity and crop year at the same facility are allowed, and that is exactly how a member keeps part of a
      crop on paid-up storage and the rest open. The signed storage agreement and, on programmes whose entry gate calls
      for it, the member's stored-grain insurance certificate are on file before the agreement is accepted into store.
      Where they are not the application is taken and the agreement waits in applied standing; grain arriving in the
      meantime is taken into open storage in the member's name rather than refused at the pit.
    eligibility:
      - id: storage_paperwork_on_file
        applies_to: [storage_agreement_opened]
        kind: authorization
        condition: The signed storage agreement and, on programmes whose entry gate calls for it, the member's stored-grain insurance certificate are on file before the agreement is accepted into store.
        evidence_fields: [storage_agreements.insurance_on_file, storage_agreements.variant_name, storage_agreements.agreement_number]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [storage_agreements.agreement_number]
          action_bindings:
            storage_agreements.agreement_number: agreement_number
    params:
      max_per_customer: 6
      uniqueness_basis: [commodity, crop_year, storage_location, variant_name]

  - id: storage_agg_capacity_across_agreements
    subject: [storage_deposit_recorded, storage_loadout_recorded]
    rule: >
      Licensed space is finite, so bushels are counted across the member's whole storage position rather than agreement
      by agreement. Each agreement carries its own ceiling, and programmes that reserve space carry a capacity share as
      well; bushels taken in under an agreement never pass that agreement's ceiling, and where a programme reserves a
      capacity share the member may hold that share even when the house is full, while bushels above the share are
      taken only as ordinary space allows. Bushels free to move are what is on hand less what is pledged against a
      warehouse receipt or committed onto a marketing contract, and a load-out is worked only against free bushels, so
      a member holding a receipt has to cancel or reduce it before those bushels can leave. Where a deposit would pass
      the agreement's ceiling the elevator takes what fits, opens a second agreement of the same programme for the
      balance, and tells the member both numbers rather than quietly rolling the overage into the first.
    eligibility: []
    params:
      per_tier:
        Open Storage Account: {agreement_ceiling_bushels: "=max_bushels_per_agreement", reserved_space_bushels: "=capacity_share_bushels"}
        Grain Bank Deposit Account: {agreement_ceiling_bushels: "=max_bushels_per_agreement", reserved_space_bushels: "=capacity_share_bushels"}
        Commercial Warehouse Receipt Storage: {agreement_ceiling_bushels: "=max_bushels_per_agreement", reserved_space_bushels: "=capacity_share_bushels"}
        Seasonal Paid-Up Storage Agreement: {agreement_ceiling_bushels: "=max_bushels_per_agreement", reserved_space_bushels: "=capacity_share_bushels"}
        Conditioned Reserve Storage Agreement: {agreement_ceiling_bushels: "=max_bushels_per_agreement", reserved_space_bushels: "=capacity_share_bushels"}
        Identity Preserved Segregated Storage: {agreement_ceiling_bushels: "=max_bushels_per_agreement", reserved_space_bushels: "=capacity_share_bushels"}
    measures: [storage_msr_free_bushels, storage_msr_crop_year_deposited_bushels]

  - id: storage_evt_deposit
    subject: [storage_deposit_recorded]
    rule: >
      Grain is taken into store on the scale ticket, and the ticket is what fixes the bushels, the grade and the day.
      Bushels are taken into store only while the agreement stands in active or in_loadout, so grain arriving against
      an agreement not yet accepted is held in open storage in the member's name until it is. The storage start date is
      the day the first bushels go into store under the agreement, and it is never reset by later deposits, so a member
      who tops a bin up in January still carries the free-day and escalation clocks from the first load in October. The
      elevation charge for taking grain in is raised on the bushels of that load at the programme's rate, and is taken
      once per load rather than once per agreement. A deposit below the programme's minimum deposit is not refused but
      is taken into open storage instead, because the programme's rates are written against a working minimum. Grain
      arriving out of condition is dried before it is credited into store, so the bushels credited are the bushels
      after conditioning shrink and not the bushels across the scale.
    eligibility:
      - id: agreement_live_for_deposit
        applies_to: [storage_deposit_recorded]
        kind: state
        condition: Bushels are taken into store only while the agreement stands in active or in_loadout, so grain arriving against an agreement not yet accepted is held in open storage in the member's name until it is.
        evidence_fields: [storage_agreements.status, storage_agreements.agreement_number, storage_charges.ticket_number]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [storage_charges.ticket_number]
          action_bindings:
            storage_charges.ticket_number: ticket_number
        state_contract:
          field: storage_agreements.status
          allowed: [active, in_loadout]
    params:
      start_date_basis: first_bushels_into_store_under_this_agreement

  - id: storage_accrual_billing
    subject: [storage_accrual_charged]
    rule: >
      Storage is billed in arrears for each billing period the grain stands in store. Free days are counted in whole
      calendar days from the storage start date, the storage start date itself counting as day zero, and grain moving
      out on or before the last free day carries no storage charge at all. Beyond the free days the days in store are
      grouped into billing periods of the programme's period length, any part of a period counting as a whole one, and
      each period is billed on the bushels standing in store through that period. Which rate is used is fixed by the
      programme's billing basis and is never a choice made at the counter: a daily basis bills the daily rate times the
      days in the period, a monthly basis bills the monthly rate once for the period, and a flat-fee basis bills
      nothing period by period because the member bought storage through the paid-up date up front. Where the computed
      charge for a period falls under the programme's period minimum the minimum is billed instead. Once the grain has
      stood in store past the escalation point the rate steps up by the escalation percentage for every period after
      it, and the step-up is not retrospective. On a paid-up agreement, bushels still in store after the paid-up date
      begin billing at the programme's ordinary rate from the day after that date, and no part of the up-front charge
      is refunded for grain that leaves early.
    eligibility: []
    params:
      per_tier:
        Open Storage Account: {free_days: "=free_storage_days", basis: "=storage_billing_basis", period_days: "=storage_billing_period_days", period_minimum_usd: "=storage_minimum_charge_usd", escalate_after_days: "=storage_rate_escalation_after_days", escalation_pct: "=storage_rate_escalation_pct"}
        Grain Bank Deposit Account: {free_days: "=free_storage_days", basis: "=storage_billing_basis", period_days: "=storage_billing_period_days", period_minimum_usd: "=storage_minimum_charge_usd", escalate_after_days: "=storage_rate_escalation_after_days", escalation_pct: "=storage_rate_escalation_pct"}
        Commercial Warehouse Receipt Storage: {free_days: "=free_storage_days", basis: "=storage_billing_basis", period_days: "=storage_billing_period_days", period_minimum_usd: "=storage_minimum_charge_usd", escalate_after_days: "=storage_rate_escalation_after_days", escalation_pct: "=storage_rate_escalation_pct"}
        Seasonal Paid-Up Storage Agreement: {free_days: "=free_storage_days", basis: "=storage_billing_basis", period_days: "=storage_billing_period_days", period_minimum_usd: "=storage_minimum_charge_usd", escalate_after_days: "=storage_rate_escalation_after_days", escalation_pct: "=storage_rate_escalation_pct"}
        Conditioned Reserve Storage Agreement: {free_days: "=free_storage_days", basis: "=storage_billing_basis", period_days: "=storage_billing_period_days", period_minimum_usd: "=storage_minimum_charge_usd", escalate_after_days: "=storage_rate_escalation_after_days", escalation_pct: "=storage_rate_escalation_pct"}
        Identity Preserved Segregated Storage: {free_days: "=free_storage_days", basis: "=storage_billing_basis", period_days: "=storage_billing_period_days", period_minimum_usd: "=storage_minimum_charge_usd", escalate_after_days: "=storage_rate_escalation_after_days", escalation_pct: "=storage_rate_escalation_pct"}
    formula:
      when_not: storage_msr_days_in_store <= free_storage_days
      amount: max(storage_minimum_charge_usd, round(bushels * storage_rate_per_bushel_per_day_usd * storage_billing_period_days, 2))
    measures: [storage_msr_days_in_store, storage_msr_chargeable_storage_months]

  - id: storage_drying_and_shrink
    subject: [storage_drying_charged, storage_shrink_taken]
    rule: >
      Grain above the programme's target moisture is dried before it is credited into store, and the member pays for
      the water taken out rather than for the time the dryer ran. Points removed are the moisture read on the way in
      less the programme's target moisture, and a pass that would remove fewer than the programme's minimum points is
      billed at the minimum points rather than not at all. The charge is the programme's rate per point per bushel,
      times the points removed, times the bushels through the dryer, and where that comes to less than the programme's
      pass minimum the pass minimum is charged instead. Shrink is taken on top of the charge and is not itself a
      charge: water leaving the grain and the handling loss together take bushels off what is credited into store, at
      the programme's handling shrink percentage for each point removed, and the bushels credited are the bushels after
      that. Drying and shrink are computed once per scale ticket; a load sent through the dryer twice carries two
      passes and two shrink lines, distinguished by the day each pass ran. Where the member declines drying the grain
      is not taken into store at all and is returned to them, because the elevator will not hold wet grain on the
      member's account.
    eligibility: []
    params:
      points_basis: moisture_in_less_programme_target
      per_tier:
        Open Storage Account: {rate_per_point_per_bushel_usd: "=drying_rate_per_point_per_bushel_usd", target_moisture_pct: "=drying_target_moisture_pct", minimum_points: "=drying_minimum_points", pass_minimum_usd: "=drying_minimum_charge_usd", handling_shrink_pct_per_point: "=drying_handling_shrink_pct_per_point"}
        Grain Bank Deposit Account: {rate_per_point_per_bushel_usd: "=drying_rate_per_point_per_bushel_usd", target_moisture_pct: "=drying_target_moisture_pct", minimum_points: "=drying_minimum_points", pass_minimum_usd: "=drying_minimum_charge_usd", handling_shrink_pct_per_point: "=drying_handling_shrink_pct_per_point"}
        Commercial Warehouse Receipt Storage: {rate_per_point_per_bushel_usd: "=drying_rate_per_point_per_bushel_usd", target_moisture_pct: "=drying_target_moisture_pct", minimum_points: "=drying_minimum_points", pass_minimum_usd: "=drying_minimum_charge_usd", handling_shrink_pct_per_point: "=drying_handling_shrink_pct_per_point"}
        Seasonal Paid-Up Storage Agreement: {rate_per_point_per_bushel_usd: "=drying_rate_per_point_per_bushel_usd", target_moisture_pct: "=drying_target_moisture_pct", minimum_points: "=drying_minimum_points", pass_minimum_usd: "=drying_minimum_charge_usd", handling_shrink_pct_per_point: "=drying_handling_shrink_pct_per_point"}
        Conditioned Reserve Storage Agreement: {rate_per_point_per_bushel_usd: "=drying_rate_per_point_per_bushel_usd", target_moisture_pct: "=drying_target_moisture_pct", minimum_points: "=drying_minimum_points", pass_minimum_usd: "=drying_minimum_charge_usd", handling_shrink_pct_per_point: "=drying_handling_shrink_pct_per_point"}
        Identity Preserved Segregated Storage: {rate_per_point_per_bushel_usd: "=drying_rate_per_point_per_bushel_usd", target_moisture_pct: "=drying_target_moisture_pct", minimum_points: "=drying_minimum_points", pass_minimum_usd: "=drying_minimum_charge_usd", handling_shrink_pct_per_point: "=drying_handling_shrink_pct_per_point"}
    formula:
      points_removed: max(drying_minimum_points, moisture_in_pct - drying_target_moisture_pct)
      amount: max(drying_minimum_charge_usd, round(bushels * points_removed * drying_rate_per_point_per_bushel_usd, 2))
      shrink_bushels: round(bushels * points_removed * drying_handling_shrink_pct_per_point / 100, 2)

  - id: storage_quality_guarantee
    subject: [storage_quality_discount_applied]
    rule: >
      What the elevator owes back is fixed by the programme's grade guarantee, and the guarantee is what decides
      whether a discount arises at all. On a house average guarantee the member is owed grain of the house's average
      grade and no discount is due however their own lot turns out, because their bushels were commingled the day they
      arrived. On a receipt grade guarantee the member is owed the grade written on the receipt, and grain returned
      below it is discounted for each full grade step below, part steps not counting. On a delivered lot guarantee the
      member is owed their own lot as delivered, and any shortfall is discounted the same way at the programme's
      heavier rate. A member who disputes the grade may ask for a recheck, which is charged at the programme's recheck
      fee unless the recheck moves the grade in the member's favour, in which case the fee is waived and the discount
      recomputed. Billing is suspended while a recheck is worked, for no longer than the programme's hold maximum,
      after which billing resumes whether or not the recheck is finished. Grade discounts are settled against the
      member's storage account and never against bushels, because taking bushels for a grade shortfall would change
      what is on hand.
    eligibility: []
    params:
      per_tier:
        Open Storage Account: {guarantee: "=quality_grade_guarantee", per_step_usd: "=quality_discount_per_grade_step_usd", recheck_fee_usd: "=quality_recheck_fee_usd", hold_max_days: "=billing_hold_max_days"}
        Grain Bank Deposit Account: {guarantee: "=quality_grade_guarantee", per_step_usd: "=quality_discount_per_grade_step_usd", recheck_fee_usd: "=quality_recheck_fee_usd", hold_max_days: "=billing_hold_max_days"}
        Commercial Warehouse Receipt Storage: {guarantee: "=quality_grade_guarantee", per_step_usd: "=quality_discount_per_grade_step_usd", recheck_fee_usd: "=quality_recheck_fee_usd", hold_max_days: "=billing_hold_max_days"}
        Seasonal Paid-Up Storage Agreement: {guarantee: "=quality_grade_guarantee", per_step_usd: "=quality_discount_per_grade_step_usd", recheck_fee_usd: "=quality_recheck_fee_usd", hold_max_days: "=billing_hold_max_days"}
        Conditioned Reserve Storage Agreement: {guarantee: "=quality_grade_guarantee", per_step_usd: "=quality_discount_per_grade_step_usd", recheck_fee_usd: "=quality_recheck_fee_usd", hold_max_days: "=billing_hold_max_days"}
        Identity Preserved Segregated Storage: {guarantee: "=quality_grade_guarantee", per_step_usd: "=quality_discount_per_grade_step_usd", recheck_fee_usd: "=quality_recheck_fee_usd", hold_max_days: "=billing_hold_max_days"}

  - id: storage_handling_and_conditioning_fees
    subject: [storage_handling_charged]
    rule: >
      Handling charges are separate from storage rent and are raised on the service actually performed. Elevation in is
      charged on the bushels of each load taken in, elevation out on the bushels of each load-out, and both are taken
      at the programme's rate per bushel. Aeration and turning are charged per bushel per cycle unless the programme
      carries them, and on a programme that carries them no aeration or turning charge is ever raised however many
      cycles the bin takes. Segregation is charged per bushel on programmes that keep a lot out of the house bin, and
      it is charged once on the bushels taken in rather than repeatedly while they sit. Issuing a warehouse receipt is
      charged at the programme's issuance fee and cancelling one at the cancellation fee, and neither is charged on
      programmes that do not issue receipts at all. Handling charges stack with storage rent rather than replacing it,
      and a component the programme does not carry is not zero but simply not applicable, so it is never shown as a
      nil line on the statement.
    eligibility: []
    params:
      stacking_basis: handling_charges_add_to_storage_rent
      per_tier:
        Open Storage Account: {in_rate_usd: "=handling_in_fee_per_bushel_usd", out_rate_usd: "=handling_out_fee_per_bushel_usd", aeration_carried: "=aeration_included", segregation_rate_usd: "=identity_preserved_segregation_fee_per_bushel_usd"}
        Grain Bank Deposit Account: {in_rate_usd: "=handling_in_fee_per_bushel_usd", out_rate_usd: "=handling_out_fee_per_bushel_usd", aeration_carried: "=aeration_included", segregation_rate_usd: "=identity_preserved_segregation_fee_per_bushel_usd"}
        Commercial Warehouse Receipt Storage: {in_rate_usd: "=handling_in_fee_per_bushel_usd", out_rate_usd: "=handling_out_fee_per_bushel_usd", aeration_carried: "=aeration_included", segregation_rate_usd: "=identity_preserved_segregation_fee_per_bushel_usd"}
        Seasonal Paid-Up Storage Agreement: {in_rate_usd: "=handling_in_fee_per_bushel_usd", out_rate_usd: "=handling_out_fee_per_bushel_usd", aeration_carried: "=aeration_included", segregation_rate_usd: "=identity_preserved_segregation_fee_per_bushel_usd"}
        Conditioned Reserve Storage Agreement: {in_rate_usd: "=handling_in_fee_per_bushel_usd", out_rate_usd: "=handling_out_fee_per_bushel_usd", aeration_carried: "=aeration_included", segregation_rate_usd: "=identity_preserved_segregation_fee_per_bushel_usd"}
        Identity Preserved Segregated Storage: {in_rate_usd: "=handling_in_fee_per_bushel_usd", out_rate_usd: "=handling_out_fee_per_bushel_usd", aeration_carried: "=aeration_included", segregation_rate_usd: "=identity_preserved_segregation_fee_per_bushel_usd"}

  - id: storage_loadout
    subject: [storage_loadout_recorded, storage_loadout_started]
    rule: >
      Grain leaves store on a released load-out order and never on a telephone call alone. A signed load-out request
      naming the bushels is registered with the elevator before the order is released, and the request is worked only
      after the programme's notice in business days has passed, counting days the elevator's scale is open and not
      counting the day the request was registered. An order must name at least the programme's load-out minimum, and it
      is worked only against bushels free to move, so pledged bushels are cut from the order rather than the order
      being refused outright. Each truck loaded carries the programme's truck fee and elevation out is charged on the
      bushels moved. A load-out taken outside the posted load-out hours carries the programme's out-of-schedule fee on
      top, charged once per order and not per truck. Where the order empties the agreement it closes on completion, and
      where bushels remain the agreement returns to active and billing carries on. Outstanding storage charges are
      settled before or at load-out, and where the member has no settlement to draw on the charges are invoiced to
      them, since the elevator does not release grain against unpaid storage on programmes that do not settle from
      grain proceeds.
    eligibility:
      - id: signed_loadout_request
        applies_to: [storage_loadout_recorded]
        kind: authorization
        condition: A signed load-out request naming the bushels is registered with the elevator before the order is released, and the request is worked only after the programme's notice in business days has passed, counting days the elevator's scale is open and not counting the day the request was registered.
        evidence_fields: [storage_requests.signed_by_member, storage_requests.request_status, storage_requests.request_id, storage_requests.requested_bushels]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [storage_requests.request_id]
          action_bindings:
            storage_requests.request_id: request_id
    params:
      per_tier:
        Open Storage Account: {minimum_bushels: "=loadout_minimum_bushels", notice_business_days: "=loadout_notice_business_days", truck_fee_usd: "=loadout_truck_fee_usd", out_of_schedule_fee_usd: "=out_of_schedule_loadout_fee_usd"}
        Grain Bank Deposit Account: {minimum_bushels: "=loadout_minimum_bushels", notice_business_days: "=loadout_notice_business_days", truck_fee_usd: "=loadout_truck_fee_usd", out_of_schedule_fee_usd: "=out_of_schedule_loadout_fee_usd"}
        Commercial Warehouse Receipt Storage: {minimum_bushels: "=loadout_minimum_bushels", notice_business_days: "=loadout_notice_business_days", truck_fee_usd: "=loadout_truck_fee_usd", out_of_schedule_fee_usd: "=out_of_schedule_loadout_fee_usd"}
        Seasonal Paid-Up Storage Agreement: {minimum_bushels: "=loadout_minimum_bushels", notice_business_days: "=loadout_notice_business_days", truck_fee_usd: "=loadout_truck_fee_usd", out_of_schedule_fee_usd: "=out_of_schedule_loadout_fee_usd"}
        Conditioned Reserve Storage Agreement: {minimum_bushels: "=loadout_minimum_bushels", notice_business_days: "=loadout_notice_business_days", truck_fee_usd: "=loadout_truck_fee_usd", out_of_schedule_fee_usd: "=out_of_schedule_loadout_fee_usd"}
        Identity Preserved Segregated Storage: {minimum_bushels: "=loadout_minimum_bushels", notice_business_days: "=loadout_notice_business_days", truck_fee_usd: "=loadout_truck_fee_usd", out_of_schedule_fee_usd: "=out_of_schedule_loadout_fee_usd"}
    measures: [storage_msr_free_bushels]

  - id: storage_charge_settlement
    subject: [storage_charge_settled]
    rule: >
      Storage account charges are cleared in one of two ways, and which applies is fixed by the programme rather than
      chosen at the counter. Where the programme settles from grain proceeds, the charges attaching to bushels sold are
      drawn as a deduction on the settlement statement those bushels are paid on, and nothing is invoiced separately.
      Where it does not, the charges are invoiced and the member pays them directly. An invoice unpaid after the
      programme's grace period, counted in whole calendar days from the invoice date, carries the programme's late
      charge once, and the late charge is added once per invoice however long the invoice then stays unpaid. Charges
      are cleared oldest first, so a part payment never leaves an old invoice open while clearing a recent one.
      Settlement clears the invoice it names and nothing else; a member who pays a round figure intending to clear
      everything is told what remains rather than having the balance written off. Where an agreement is terminated for
      unpaid charges the outstanding balance follows the member to their crop input account and does not disappear with
      the agreement.
    eligibility: []
    params:
      allocation_order: oldest_invoice_first
      per_tier:
        Open Storage Account: {from_grain_proceeds: "=storage_settlement_from_grain_proceeds", grace_days: "=late_payment_grace_days", late_fee_usd: "=late_payment_fee_usd"}
        Grain Bank Deposit Account: {from_grain_proceeds: "=storage_settlement_from_grain_proceeds", grace_days: "=late_payment_grace_days", late_fee_usd: "=late_payment_fee_usd"}
        Commercial Warehouse Receipt Storage: {from_grain_proceeds: "=storage_settlement_from_grain_proceeds", grace_days: "=late_payment_grace_days", late_fee_usd: "=late_payment_fee_usd"}
        Seasonal Paid-Up Storage Agreement: {from_grain_proceeds: "=storage_settlement_from_grain_proceeds", grace_days: "=late_payment_grace_days", late_fee_usd: "=late_payment_fee_usd"}
        Conditioned Reserve Storage Agreement: {from_grain_proceeds: "=storage_settlement_from_grain_proceeds", grace_days: "=late_payment_grace_days", late_fee_usd: "=late_payment_fee_usd"}
        Identity Preserved Segregated Storage: {from_grain_proceeds: "=storage_settlement_from_grain_proceeds", grace_days: "=late_payment_grace_days", late_fee_usd: "=late_payment_fee_usd"}

  - id: storage_receipt_and_pledge
    subject: [storage_agreement_updated]
    rule: >
      A negotiable warehouse receipt is issued only on programmes the catalogue allows it on, and only once the
      member's stored-grain insurance certificate is on file where the programme requires it, because the receipt
      passes title and the elevator will not pass title on uninsured grain. Issuing a receipt pledges the bushels it
      names, and those bushels move from free to reserved on the agreement and cannot be loaded out, transferred onto a
      marketing contract or pledged a second time while the receipt stands. Cancelling the receipt at the programme's
      cancellation fee releases them again, and a receipt may be reduced rather than cancelled where only part of the
      bushels are needed. Transferring stored bushels onto a marketing contract takes the programme's transfer fee per
      bushel and the programme's transfer shrink, and it is worked only on free bushels; the bushels leave the
      agreement on the day of transfer and storage stops accruing on them that day. The grade of record is rewritten
      only on a completed recheck, never on the member's own reading, and the paid-through date is rewritten only when
      a settlement actually clears the charges behind it.
    eligibility:
      - id: insurance_before_receipt
        applies_to: [storage_agreement_updated]
        kind: authorization
        condition: A negotiable warehouse receipt is issued only on programmes the catalogue allows it on, and only once the member's stored-grain insurance certificate is on file where the programme requires it, because the receipt passes title and the elevator will not pass title on uninsured grain.
        evidence_fields: [storage_agreements.insurance_on_file, storage_agreements.variant_name, storage_agreements.agreement_number, storage_agreements.warehouse_receipt_number]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [storage_agreements.agreement_number]
          action_bindings:
            storage_agreements.agreement_number: agreement_number
      - id: receipt_on_live_agreement
        applies_to: [storage_agreement_updated]
        kind: state
        condition: Issuing a receipt pledges the bushels it names, and those bushels move from free to reserved on the agreement and cannot be loaded out, transferred onto a marketing contract or pledged a second time while the receipt stands.
        evidence_fields: [storage_agreements.status, storage_agreements.agreement_number, storage_agreements.reserved_bushels]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [storage_agreements.agreement_number]
          action_bindings:
            storage_agreements.agreement_number: agreement_number
        state_contract:
          field: storage_agreements.status
          allowed: [active, billing_hold, in_loadout]

  - id: storage_lifecycle_progression
    subject: [storage_agreement_activated, storage_billing_hold_set, storage_agreement_closed, storage_agreement_terminated]
    rule: >
      An agreement is accepted into store once the paperwork is on file and the first bushels arrive, and only then
      does billing begin. Billing is suspended while a disputed charge or a quality recheck is worked, for no longer
      than the programme's hold maximum counted in calendar days from the day the hold was set, and the days under
      suspension still count as days in store for the free-day and escalation clocks even though no charge is raised
      for them. An agreement closes when the last bushel leaves and the account is clear, and a member with bushels
      still on hand cannot sign out. The elevator terminates an agreement of its own motion in only two cases: storage
      charges unpaid beyond the grace period after written notice, and grain going out of condition where the member
      declines conditioning; in both cases the grain is sold at the day's bid, the charges are taken out of the
      proceeds and the balance is paid to the member. Early termination by the member carries the programme's early
      termination fee where the agreement has not run its minimum term, and needs the programme's notice in calendar
      days. Closed and terminated are both terminal; bushels brought back afterwards need a new agreement.
    eligibility: []
    params:
      hold_days_count_toward_free_days: true
      termination_grounds: [unpaid_charges_after_written_notice, grain_out_of_condition_with_conditioning_declined]
