      from the day the most recent of those charges was posted, that day counting as day zero, to the same handling
      date. Where no service charge stands assessed on the account over those months and a payment has been posted
      to the account over the twelve statement months before the handling date, the overdue days are instead counted
      from the day the most recent of those payments was posted, that day counting as day zero, to the same handling
      date.
    review_months: Where the account's most recent credit review was completed inside the programme's review interval,
      counted in whole months from the day the review completed to the handling date, and the credit department's
      standing decision on the account is an approval, the days of grace are instead the reviewed approval grace.
    grace_days: The days of grace allowed before the charge bites are the grace days the programme carries. Where
      the account's most recent credit review was completed inside the programme's review interval, counted in whole
      months from the day the review completed to the handling date, and the credit department's standing decision
      on the account is an approval, the days of grace are instead the reviewed approval grace. Where the account's
      most recent credit review was completed inside that interval, counted the same way, and that decision is conditional,
      the days of grace are instead the reviewed conditional grace.
    discount_count: Where two or more discounts stand granted on the account over the ten statement months before
      the handling date and the overdue balance has reached the programme's suspension threshold, the concession
      those discounts gave for settling inside the window is taken back in full, so the share added back is instead
      the whole of them.
    clawback_share_pct: The share of the discounts granted on the account that is added back before the charge is
      worked out is nil. Where two or more discounts stand granted on the account over the ten statement months
      before the handling date and the overdue balance has reached the programme's suspension threshold, the concession
      those discounts gave for settling inside the window is taken back in full, so the share added back is instead
      the whole of them. Where one discount stands granted on the account over those months and the overdue balance
      has reached the programme's suspension threshold, that concession is taken back in part, so the share added
      back is instead half of them.
    charge_base: The balance the rate acts on is the overdue balance plus the share added back of the discounts
      granted on the account, rounded half away from zero to two decimal places.
    chargeable_days: The chargeable days are the overdue days less the days of grace, and where that difference
      is negative the chargeable days are nil.
    charge_at_rate: The charge at the rate is that balance multiplied by the monthly service rate and then multiplied
      by the chargeable days over a statement month of thirty days, rounded half away from zero to two decimal places
      once at the end of that step.
    holds_storage: Where the member has bushels on hand under a live storage agreement with the cooperative and
      a storage charge settlement stands on that agreement over the ten statement months before the handling date,
      the charge worked out at the rate is instead halved and rounded half away from zero to two decimal places.
    storage_settlements: Where the member has bushels on hand under a live storage agreement with the cooperative
      and a storage charge settlement stands on that agreement over the ten statement months before the handling
      date, the charge worked out at the rate is instead halved and rounded half away from zero to two decimal places.
    charge_after_relief: The charge stands as worked out at the rate. Where the member has bushels on hand under
      a live storage agreement with the cooperative and a storage charge settlement stands on that agreement over
      the ten statement months before the handling date, the charge worked out at the rate is instead halved and
      rounded half away from zero to two decimal places. Where the member has bushels on hand under a live storage
      agreement with the cooperative and no storage charge settlement stands on it over those months, the charge
      worked out at the rate is instead taken at three quarters of itself and rounded half away from zero to two
      decimal places.
    payments_recent: Where the overdue days run past sixty and no payment has been posted to the account over the
      three statement months before the handling date, the collection handling sum is instead the long arrears sum.
    surcharge: The collection handling sum added to the charge is nil. Where the overdue days run past sixty and
      no payment has been posted to the account over the three statement months before the handling date, the collection
      handling sum is instead the long arrears sum. Where the overdue days run past thirty but not past sixty and
      no payment has been posted to the account over those three months, the collection handling sum is instead
      the short arrears sum.
    result: The service charge booked is the charge after relief plus the collection handling sum, and where that
      total falls under the programme's service charge floor the floor is booked instead; the result is rounded
      half away from zero to two decimal places once at the end.
  factors:
  - id: settled_buying_service_rate
    effect: parameter
    decides: monthly_pct
    bindings:
    - payments_year
    - season_spend
    - monthly_pct
    ladder:
    - when: three or more payments have been posted to the account over the twelve statement months before the handling
        date and the member's input spend on the account over the ten statement months before the handling date
        is at or above the programme's volume discount threshold
      value: K('rate_settled_volume_pct')
    - when: fewer than three payments have been posted over those twelve months and that spend is at or above the
        programme's volume discount threshold
      value: K('rate_volume_pct')
    - when: otherwise
      value: P('finance_charge_monthly_pct')
    baseline:
      monthly_pct: P('finance_charge_monthly_pct')
    evidence:
    - history
    cross_difficulty: null
  - id: overdue_clock_anchor
    effect: method
    decides: overdue_days
    bindings:
    - prior_charge_count
    - last_charge_date
    - last_payment_date
    - overdue_days
    ladder:
    - when: a service charge already stands assessed on the account over the ten statement months before the handling
        date
      method: the overdue days are counted from the day the most recent of those charges was posted, that day counting
        as day zero
    - when: no service charge stands assessed on the account over those months and a payment has been posted to
        the account over the twelve statement months before the handling date
      method: the overdue days are counted from the day the most recent of those payments was posted, that day counting
        as day zero
    - when: otherwise
      method: the overdue days are counted from the date the account went past due, that date counting as day zero
    baseline:
      overdue_days: DAYS(F('past_due_since'), NOW)
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: reviewed_account_grace
    effect: parameter
    decides: grace_days
    bindings:
    - review_months
    - grace_days
    ladder:
    - when: the account's most recent credit review was completed inside the programme's review interval, counted
        in whole months from the day the review completed to the handling date, and the credit department's standing
        decision on the account is an approval
      value: K('grace_reviewed_approved_days')
    - when: the account's most recent credit review was completed inside that interval, counted the same way, and
        that decision is conditional
      value: K('grace_reviewed_conditional_days')
    - when: otherwise
      value: P('finance_charge_grace_days')
    baseline:
      grace_days: P('finance_charge_grace_days')
    evidence:
    - date
    - tier_param
    cross_difficulty: null
  - id: stored_grain_relief
    effect: method
    decides: charge_after_relief
    bindings:
    - holds_storage
    - storage_settlements
    - charge_after_relief
    ladder:
    - when: the member has bushels on hand under a live storage agreement with the cooperative and a storage charge
        settlement stands on that agreement over the ten statement months before the handling date
      method: the charge worked out at the rate is halved and rounded half away from zero to two decimal places
    - when: the member has bushels on hand under a live storage agreement with the cooperative and no storage charge
        settlement stands on it over those months
      method: the charge worked out at the rate is taken at three quarters of itself and rounded half away from
        zero to two decimal places
    - when: otherwise
      method: the charge stands as worked out at the rate
    baseline:
      charge_after_relief: charge_at_rate
    evidence:
    - cross_category
    - history
    cross_difficulty: storage
  - id: discount_clawback_share
    effect: parameter
    decides: clawback_share_pct
    bindings:
    - discount_count
    - clawback_share_pct
    ladder:
    - when: two or more discounts stand granted on the account over the ten statement months before the handling
        date and the overdue balance has reached the programme's suspension threshold
      value: K('clawback_full_pct')
    - when: one discount stands granted on the account over those months and the overdue balance has reached the
        programme's suspension threshold
      value: K('clawback_half_pct')
    - when: otherwise
      value: K('clawback_none_pct')
    baseline:
      clawback_share_pct: K('clawback_none_pct')
    evidence:
    - history
    cross_difficulty: null
  - id: long_arrears_handling_sum
    effect: parameter
    decides: surcharge
    bindings:
    - payments_recent
    - surcharge
    ladder:
    - when: the overdue days run past sixty and no payment has been posted to the account over the three statement
        months before the handling date
      value: K('surcharge_long_usd')
    - when: the overdue days run past thirty but not past sixty and no payment has been posted to the account over
        those three months
      value: K('surcharge_short_usd')
    - when: otherwise
      value: K('surcharge_none_usd')
    baseline:
      surcharge: K('surcharge_none_usd')
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: 'The service charge a crop input account carries is worked out on the overdue balance of the account as
      a whole rather than invoice by invoice, and one charge is booked for the statement month then running against
      the oldest invoice on the account that has run past the programme''s terms and still stands unpaid. The overdue
      balance is everything invoiced to the account that has run past the programme''s terms, which is every delivery
      invoiced to it apart from those invoiced within the statement months the programme''s terms cover, the programme''s
      terms in days being taken over a statement month of thirty days. That balance is reduced by every payment
      posted to the account, by every credit memo written on it and by every discount granted on it, whatever the
      invoice each was written against, and is increased by every service charge already standing on it. The monthly
      service rate is the rate the programme carries. The overdue days are counted from the date the account went
      past due, that date counting as day zero, to the handling date on which the charge is worked out. The days
      of grace allowed before the charge bites are the grace days the programme carries. The chargeable days are
      the overdue days less the days of grace, and where that difference is negative the chargeable days are nil.
      The share of the discounts granted on the account that is added back before the charge is worked out is nil.
      The balance the rate acts on is the overdue balance plus the share added back of the discounts granted on
      the account, rounded half away from zero to two decimal places. The charge at the rate is that balance multiplied
      by the monthly service rate and then multiplied by the chargeable days over a statement month of thirty days,
      rounded half away from zero to two decimal places once at the end of that step. The charge stands as worked
      out at the rate. The collection handling sum added to the charge is nil. The service charge booked is the
      charge after relief plus the collection handling sum, and where that total falls under the programme''s service
      charge floor the floor is booked instead; the result is rounded half away from zero to two decimal places
      once at the end.

      '
    params:
    - finance_charge_monthly_pct
    - finance_charge_grace_days
    - finance_charge_minimum_usd
    - statement_month_days
    - terms_days
    - clawback_none_pct
    - surcharge_none_usd
  inputs:
    history:
    - table: agronomy_invoices
      aggregate: sum
      field: amount
      within_months: null
      filters:
        event_type: agronomy_invoice_issued
    - table: agronomy_invoices
      aggregate: count
      field: amount
      within_months: 12
      filters:
        event_type: agronomy_payment_posted
    - table: agronomy_invoices
      aggregate: latest
      field: posted_date
      within_months: null
      filters:
        event_type: agronomy_finance_charge_assessed
    - category: storage
      table: storage_charges
      aggregate: count
      field: amount
      within_months: 10
      filters:
        event_type: storage_charge_settled
    cross_category:
    - storage
- id: agronomy_ext_arrears_settlement_payment
  base_policy_refs:
  - agronomy_payment_application
  - agronomy_credit_standing
  - agronomy_finance_charge
  overwrite:
  - base_policy: agronomy_credit_standing
    superseded_clause: Buying is reinstated when the member pays at least the programme's reinstatement share of
      the overdue balance, and reinstatement is recorded by the credit department rather than at the counter, however
      plainly the member says the payment has been sent.
    replaced_by: Where the member's input spend on the account over the ten statement months before the handling
      date is at or above the programme's volume discount threshold and the credit department's standing decision
      on the account is an approval, the share is instead the settled buying share.
  trigger: on_request
  subject:
  - agronomy_payment_posted
  computes: payment_amount
  target_tool: post_member_arrears_payment_ad47b93a
  params:
    lookback_months: 10
    settlement_lookback_months: 12
    repeat_charge_count: 3
    single_charge_count: 1
    charge_share_full_pct: 100.0
    charge_share_half_pct: 50.0
    charge_share_none_pct: 0.0
    share_settled_pct: 40.0
    share_conditional_pct: 55.0
    age_long_days: 90
    age_short_days: 45
    age_step_long_pct: 15.0
    age_step_short_pct: 8.0
    age_step_none_pct: 0.0
    grain_share_settled_pct: 25.0
    grain_share_open_pct: 10.0
    grain_share_none_pct: 0.0
    patronage_share_unpaid_pct: 100.0
    patronage_share_part_pct: 25.0
    patronage_share_none_pct: 0.0
    hundred_step: 100
    ten_step: 10
    round_up_epsilon: 0.999999
    statement_month_days: 30
  rule: 'Where a member asks what they must remit to bring the arrears on a crop input account back inside the cooperative''s
    terms, the desk quotes one figure and the member pays it in their own name. The product balance the figure is
    built on is everything invoiced to the account that has run past the programme''s terms, which is every delivery
    invoiced to it apart from those invoiced within the statement months the programme''s terms cover, the programme''s
    terms in days being taken over a statement month of thirty days, less every payment posted to the account, every
    credit memo written on it and every discount granted on it. The figure that settles the arrears on a crop input
    account is fixed only once that account''s ledger carries the service charge due on its overdue invoices for
    the statement month then running. The share of the service charges standing on the account that is carried into
    the settlement figure is nil. Where three or more service charges stand on the account over the ten statement
    months before the handling date, the share carried in is instead the whole of them. Where one or two service
    charges stand on the account over those months, the share carried in is instead half of them. The settlement
    base is the product balance plus the share carried in of the service charges standing on the account, rounded
    half away from zero to two decimal places. The share of the settlement base the member must remit is the reinstatement
    share the programme carries. Where the member''s input spend on the account over the ten statement months before
    the handling date is at or above the programme''s volume discount threshold and the credit department''s standing
    decision on the account is an approval, the share is instead the settled buying share. Where that spend is at
    or above the programme''s volume discount threshold and that decision is conditional, the share is instead the
    conditional buying share. The further share of the settlement base added for the age of the arrears is nil.
    Where the account has stood past due for more than ninety days, counted from the date it went past due as day
    zero to the handling date, the further share added is instead the long arrears step. Where the account has stood
    past due for more than forty-five days but not more than ninety, counted the same way, the further share added
    is instead the short arrears step. The amount sought is the settlement base multiplied by the share the member
    must remit and the further share added for the age of the arrears taken together as one total share, applied
    once to the settlement base and rounded half away from zero to two decimal places; the two shares are combined
    before they are applied and they do not act one after the other. The share of the value of the grain still owed
    to the cooperative that is set against the amount sought is nil. Where the member has bushels still owed to
    the cooperative on a live grain marketing contract and a settlement statement has been issued to them on their
    grain over the ten statement months before the handling date, the share set against the amount sought is instead
    the delivering grain share. Where the member has bushels still owed on a live grain marketing contract and no
    settlement statement has been issued to them on their grain over those months, the share set against the amount
    sought is instead the open grain share. The grain credit is the bushels still owed to the cooperative on the
    member''s live grain marketing contract multiplied by the cash price that contract carries and then by the share
    set against the amount sought, rounded half away from zero to two decimal places. The share of the cash portion
    of the member''s patronage allocation that is set against the amount sought is nil. Where an allocation has
    been posted to the member''s equity account over the twelve statement months before the handling date and no
    cash payment against it stands on the equity ledger over those months, the share set against the amount sought
    is instead the whole of the cash portion. Where an allocation has been posted to the member''s equity account
    over those months and a cash payment stands on the equity ledger over those months, the share set against the
    amount sought is instead the part-paid patronage share. The patronage credit is the cash portion of the allocations
    posted to the member''s equity account over the twelve statement months before the handling date multiplied
    by the share set against the amount sought, rounded half away from zero to two decimal places. The net figure
    is the amount sought less the grain credit and less the patronage credit, both taken off the amount sought itself
    and neither taken off the other, and where that net figure is negative it is nil. The figure the member is asked
    to remit is the net figure as worked out, to the cent. Where a payment made by a transfer of grain settlement
    proceeds stands on the account over the ten statement months before the handling date, the figure the member
    is asked to remit is instead taken up to the next whole hundred dollars at or above the net figure. Where no
    payment made by that route stands on the account over those months and a payment made by check stands on it
    over those months, the figure the member is asked to remit is instead taken up to the next whole ten dollars
    at or above the net figure. The figure quoted and paid is that figure rounded half away from zero to two decimal
    places.

    '
  prerequisite:
  - problem: agronomy_ext_arrears_service_charge
    kind: value_input
    gate: charges_standing
    form: state
    policy_source: The figure that settles the arrears on a crop input account is fixed only once that account's
      ledger carries the service charge due on its overdue invoices for the statement month then running.
    condition: The account's ledger carries the service charge due on its overdue invoices for the statement month
      then running, so that no charge still owed sits outside the settlement figure.
    resolved_by: assess_overdue_service_charge_aaf992aa
    effect: The charges standing binding rises by the service charge booked for the statement month then running,
      and the settlement base and the figure quoted rise with it.
  cross_category:
  - category: grain
    as: history
    reads:
    - status
    - open_bushels
    - cash_price_per_bushel
    - grain_ledger.event_type
    note: The share of the value of the grain still owed that is set against the amount sought is decided from the
      member's live marketing contract and from whether a settlement statement has been issued to them.
  - category: patronage
    as: history
    reads:
    - patronage_ledger.event_type
    - patronage_ledger.cash_portion_amount
    note: The share of the cash portion of the member's allocation that is set against the amount sought is decided
      from the allocations posted to their equity account and from whether cash has been paid against them.
  compute:
  - charges_all: SUM('agronomy_invoices','amount', event_type='agronomy_invoice_issued')
  - charges_in_terms: SUM('agronomy_invoices','amount', within_months=P('terms_days') / K('statement_month_days'),
      date_field='invoice_date', event_type='agronomy_invoice_issued')
  - matured_charges: RND(charges_all - charges_in_terms, 2)
  - payments_standing: SUM('agronomy_invoices','amount', event_type='agronomy_payment_posted')
  - credits_standing: SUM('agronomy_invoices','amount', event_type='agronomy_credit_memo_issued')
  - discounts_standing: SUM('agronomy_invoices','amount', event_type='agronomy_discount_granted')
  - product_balance: RND(matured_charges + payments_standing + credits_standing + discounts_standing, 2)
  - charges_standing: SUM('agronomy_invoices','amount', event_type='agronomy_finance_charge_assessed')
  - charge_count: COUNT('agronomy_invoices', within_months=K('lookback_months'), date_field='posted_date', event_type='agronomy_finance_charge_assessed')
  - charge_share_pct: K('charge_share_full_pct') if charge_count >= K('repeat_charge_count') else (K('charge_share_half_pct')
      if charge_count >= K('single_charge_count') else K('charge_share_none_pct'))
  - settlement_base: RND(product_balance + charges_standing * charge_share_pct / 100, 2)
  - season_spend: SUM('agronomy_invoices','amount', within_months=K('lookback_months'), date_field='invoice_date',
      event_type='agronomy_invoice_issued')
  - reinstate_pct: K('share_settled_pct') if (season_spend >= P('volume_discount_threshold_usd') and F('credit_status')
      == 'approved') else (K('share_conditional_pct') if (season_spend >= P('volume_discount_threshold_usd') and
      F('credit_status') == 'conditional') else P('reinstatement_payment_pct'))
  - arrears_days: DAYS(F('past_due_since'), NOW)
  - age_step_pct: K('age_step_long_pct') if (arrears_days > K('age_long_days') and F('past_due_since') != '') else
      (K('age_step_short_pct') if (arrears_days > K('age_short_days') and F('past_due_since') != '') else K('age_step_none_pct'))
  - target_amount: RND(settlement_base * (reinstate_pct + age_step_pct) / 100, 2)
  - open_bushels: CFIELD('grain','open_bushels', status='active') or 0
  - contract_price: CFIELD('grain','cash_price_per_bushel', status='active') or 0
  - grain_settlements: XCOUNT('grain','grain_ledger', within_months=K('lookback_months'), date_field='settlement_date',
      event_type='grain_settlement_issued')
  - grain_share_pct: K('grain_share_settled_pct') if (open_bushels > 0 and grain_settlements >= 1) else (K('grain_share_open_pct')
      if (open_bushels > 0 and grain_settlements < 1) else K('grain_share_none_pct'))
  - grain_credit: RND(open_bushels * contract_price * grain_share_pct / 100, 2)
  - allocations_posted: XCOUNT('patronage','patronage_ledger', within_months=K('settlement_lookback_months'), date_field='entry_date',
      event_type='patronage_allocation_posted')
  - cash_payments_made: XCOUNT('patronage','patronage_ledger', within_months=K('settlement_lookback_months'), date_field='entry_date',
      event_type='patronage_cash_paid')
  - cash_portion_due: XSUM('patronage','patronage_ledger','cash_portion_amount', within_months=K('settlement_lookback_months'),
      date_field='entry_date', event_type='patronage_allocation_posted')
  - patronage_share_pct: K('patronage_share_unpaid_pct') if (allocations_posted >= 1 and cash_payments_made < 1)
      else (K('patronage_share_part_pct') if (allocations_posted >= 1 and cash_payments_made >= 1) else K('patronage_share_none_pct'))
  - patronage_credit: RND(cash_portion_due * patronage_share_pct / 100, 2)
  - net_due: MX(0, RND(target_amount - grain_credit - patronage_credit, 2))
  - grain_transfers: COUNT('agronomy_invoices', within_months=K('lookback_months'), date_field='posted_date', event_type='agronomy_payment_posted',
      payment_method='grain_settlement_transfer')
  - check_payments: COUNT('agronomy_invoices', within_months=K('lookback_months'), date_field='posted_date', event_type='agronomy_payment_posted',
      payment_method='check')
  - settled_figure: float(int(net_due / K('hundred_step') + K('round_up_epsilon')) * K('hundred_step')) if grain_transfers
      >= 1 else (float(int(net_due / K('ten_step') + K('round_up_epsilon')) * K('ten_step')) if (grain_transfers
      < 1 and check_payments >= 1) else net_due)
  - result: RND(settled_figure, 2)
  compute_basis:
    charges_all: The product balance the figure is built on is everything invoiced to the account that has run past
      the programme's terms, which is every delivery invoiced to it apart from those invoiced within the statement
      months the programme's terms cover, the programme's terms in days being taken over a statement month of thirty
      days, less every payment posted to the account, every credit memo written on it and every discount granted
      on it.
    charges_in_terms: The product balance the figure is built on is everything invoiced to the account that has
      run past the programme's terms, which is every delivery invoiced to it apart from those invoiced within the
      statement months the programme's terms cover, the programme's terms in days being taken over a statement month
      of thirty days, less every payment posted to the account, every credit memo written on it and every discount
      granted on it.
    matured_charges: The product balance the figure is built on is everything invoiced to the account that has run
      past the programme's terms, which is every delivery invoiced to it apart from those invoiced within the statement
      months the programme's terms cover, the programme's terms in days being taken over a statement month of thirty
      days, less every payment posted to the account, every credit memo written on it and every discount granted
      on it.
    payments_standing: The product balance the figure is built on is everything invoiced to the account that has
      run past the programme's terms, which is every delivery invoiced to it apart from those invoiced within the
      statement months the programme's terms cover, the programme's terms in days being taken over a statement month
      of thirty days, less every payment posted to the account, every credit memo written on it and every discount
      granted on it.
    credits_standing: The product balance the figure is built on is everything invoiced to the account that has
      run past the programme's terms, which is every delivery invoiced to it apart from those invoiced within the
      statement months the programme's terms cover, the programme's terms in days being taken over a statement month
      of thirty days, less every payment posted to the account, every credit memo written on it and every discount
      granted on it.
    discounts_standing: The product balance the figure is built on is everything invoiced to the account that has
      run past the programme's terms, which is every delivery invoiced to it apart from those invoiced within the
      statement months the programme's terms cover, the programme's terms in days being taken over a statement month
      of thirty days, less every payment posted to the account, every credit memo written on it and every discount
      granted on it.
    product_balance: The product balance the figure is built on is everything invoiced to the account that has run
      past the programme's terms, which is every delivery invoiced to it apart from those invoiced within the statement
      months the programme's terms cover, the programme's terms in days being taken over a statement month of thirty
      days, less every payment posted to the account, every credit memo written on it and every discount granted
      on it.
    charges_standing: The settlement base is the product balance plus the share carried in of the service charges
      standing on the account, rounded half away from zero to two decimal places.
    charge_count: Where three or more service charges stand on the account over the ten statement months before
      the handling date, the share carried in is instead the whole of them.
    charge_share_pct: The share of the service charges standing on the account that is carried into the settlement
      figure is nil. Where three or more service charges stand on the account over the ten statement months before
      the handling date, the share carried in is instead the whole of them. Where one or two service charges stand
      on the account over those months, the share carried in is instead half of them.
    settlement_base: The settlement base is the product balance plus the share carried in of the service charges
      standing on the account, rounded half away from zero to two decimal places.
    season_spend: Where the member's input spend on the account over the ten statement months before the handling
      date is at or above the programme's volume discount threshold and the credit department's standing decision
      on the account is an approval, the share is instead the settled buying share.
    reinstate_pct: The share of the settlement base the member must remit is the reinstatement share the programme
      carries. Where the member's input spend on the account over the ten statement months before the handling date
      is at or above the programme's volume discount threshold and the credit department's standing decision on
      the account is an approval, the share is instead the settled buying share. Where that spend is at or above
      the programme's volume discount threshold and that decision is conditional, the share is instead the conditional
      buying share.
    arrears_days: Where the account has stood past due for more than ninety days, counted from the date it went
      past due as day zero to the handling date, the further share added is instead the long arrears step.
    age_step_pct: The further share of the settlement base added for the age of the arrears is nil. Where the account
      has stood past due for more than ninety days, counted from the date it went past due as day zero to the handling
      date, the further share added is instead the long arrears step. Where the account has stood past due for more
      than forty-five days but not more than ninety, counted the same way, the further share added is instead the
      short arrears step.
    target_amount: The amount sought is the settlement base multiplied by the share the member must remit and the
      further share added for the age of the arrears taken together as one total share, applied once to the settlement
      base and rounded half away from zero to two decimal places; the two shares are combined before they are applied
      and they do not act one after the other.
    open_bushels: The grain credit is the bushels still owed to the cooperative on the member's live grain marketing
      contract multiplied by the cash price that contract carries and then by the share set against the amount sought,
      rounded half away from zero to two decimal places.
    contract_price: The grain credit is the bushels still owed to the cooperative on the member's live grain marketing
      contract multiplied by the cash price that contract carries and then by the share set against the amount sought,
      rounded half away from zero to two decimal places.
    grain_settlements: Where the member has bushels still owed to the cooperative on a live grain marketing contract
      and a settlement statement has been issued to them on their grain over the ten statement months before the
      handling date, the share set against the amount sought is instead the delivering grain share.
    grain_share_pct: The share of the value of the grain still owed to the cooperative that is set against the amount
      sought is nil. Where the member has bushels still owed to the cooperative on a live grain marketing contract
      and a settlement statement has been issued to them on their grain over the ten statement months before the
      handling date, the share set against the amount sought is instead the delivering grain share. Where the member
      has bushels still owed on a live grain marketing contract and no settlement statement has been issued to them
      on their grain over those months, the share set against the amount sought is instead the open grain share.
    grain_credit: The grain credit is the bushels still owed to the cooperative on the member's live grain marketing
      contract multiplied by the cash price that contract carries and then by the share set against the amount sought,
      rounded half away from zero to two decimal places.
    allocations_posted: Where an allocation has been posted to the member's equity account over the twelve statement
      months before the handling date and no cash payment against it stands on the equity ledger over those months,
      the share set against the amount sought is instead the whole of the cash portion.
    cash_payments_made: Where an allocation has been posted to the member's equity account over the twelve statement
      months before the handling date and no cash payment against it stands on the equity ledger over those months,
      the share set against the amount sought is instead the whole of the cash portion.
    cash_portion_due: The patronage credit is the cash portion of the allocations posted to the member's equity
      account over the twelve statement months before the handling date multiplied by the share set against the
      amount sought, rounded half away from zero to two decimal places.
    patronage_share_pct: The share of the cash portion of the member's patronage allocation that is set against
      the amount sought is nil. Where an allocation has been posted to the member's equity account over the twelve
      statement months before the handling date and no cash payment against it stands on the equity ledger over
      those months, the share set against the amount sought is instead the whole of the cash portion. Where an allocation
      has been posted to the member's equity account over those months and a cash payment stands on the equity ledger
      over those months, the share set against the amount sought is instead the part-paid patronage share.
    patronage_credit: The patronage credit is the cash portion of the allocations posted to the member's equity
      account over the twelve statement months before the handling date multiplied by the share set against the
      amount sought, rounded half away from zero to two decimal places.
    net_due: The net figure is the amount sought less the grain credit and less the patronage credit, both taken
      off the amount sought itself and neither taken off the other, and where that net figure is negative it is
      nil.
    grain_transfers: Where a payment made by a transfer of grain settlement proceeds stands on the account over
      the ten statement months before the handling date, the figure the member is asked to remit is instead taken
      up to the next whole hundred dollars at or above the net figure.
    check_payments: Where no payment made by that route stands on the account over those months and a payment made
      by check stands on it over those months, the figure the member is asked to remit is instead taken up to the
      next whole ten dollars at or above the net figure.
    settled_figure: The figure the member is asked to remit is the net figure as worked out, to the cent. Where
      a payment made by a transfer of grain settlement proceeds stands on the account over the ten statement months
      before the handling date, the figure the member is asked to remit is instead taken up to the next whole hundred
      dollars at or above the net figure. Where no payment made by that route stands on the account over those months
      and a payment made by check stands on it over those months, the figure the member is asked to remit is instead
      taken up to the next whole ten dollars at or above the net figure.
    result: The figure quoted and paid is that figure rounded half away from zero to two decimal places.
  factors:
  - id: settled_buying_reinstatement_share
    effect: parameter
    decides: reinstate_pct
    bindings:
    - season_spend
    - reinstate_pct
    ladder:
    - when: the member's input spend on the account over the ten statement months before the handling date is at
        or above the programme's volume discount threshold and the credit department's standing decision on the
        account is an approval
      value: K('share_settled_pct')
    - when: that spend is at or above the programme's volume discount threshold and that decision is conditional
      value: K('share_conditional_pct')
    - when: otherwise
      value: P('reinstatement_payment_pct')
    baseline:
      reinstate_pct: P('reinstatement_payment_pct')
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: committed_grain_credit_share
    effect: parameter
    decides: grain_share_pct
    bindings:
    - open_bushels
    - contract_price
    - grain_settlements
    - grain_share_pct
    ladder:
    - when: the member has bushels still owed to the cooperative on a live grain marketing contract and a settlement
        statement has been issued to them on their grain over the ten statement months before the handling date
      value: K('grain_share_settled_pct')
    - when: the member has bushels still owed on a live grain marketing contract and no settlement statement has
        been issued to them on their grain over those months
      value: K('grain_share_open_pct')
    - when: otherwise
      value: K('grain_share_none_pct')
    baseline:
      grain_share_pct: K('grain_share_none_pct')
    evidence:
    - cross_category
    - history
    cross_difficulty: grain
  - id: quoted_figure_rounding
    effect: method
    decides: settled_figure
    bindings:
    - grain_transfers
    - check_payments
    - settled_figure
    ladder:
    - when: a payment made by a transfer of grain settlement proceeds stands on the account over the ten statement
        months before the handling date
      method: the figure is taken up to the next whole hundred dollars at or above the net figure
    - when: no payment made by that route stands on the account over those months and a payment made by check stands
        on it over those months
      method: the figure is taken up to the next whole ten dollars at or above the net figure
    - when: otherwise
      method: the figure is the net figure as worked out, to the cent
    baseline:
      settled_figure: net_due
    evidence:
    - history
    cross_difficulty: null
  - id: service_charge_carry_in
    effect: parameter
    decides: charge_share_pct
    bindings:
    - charge_count
    - charge_share_pct
    ladder:
    - when: three or more service charges stand on the account over the ten statement months before the handling
        date
      value: K('charge_share_full_pct')
    - when: one or two service charges stand on the account over those months
      value: K('charge_share_half_pct')
    - when: otherwise
      value: K('charge_share_none_pct')
    baseline:
      charge_share_pct: K('charge_share_none_pct')
    evidence:
    - history
    cross_difficulty: null
  - id: patronage_cash_offset_share
    effect: parameter
    decides: patronage_share_pct
    bindings:
    - allocations_posted
    - cash_payments_made
    - cash_portion_due
    - patronage_share_pct
    ladder:
    - when: an allocation has been posted to the member's equity account over the twelve statement months before
        the handling date and no cash payment against it stands on the equity ledger over those months
      value: K('patronage_share_unpaid_pct')
    - when: an allocation has been posted to the member's equity account over those months and a cash payment stands
        on the equity ledger over those months
      value: K('patronage_share_part_pct')
    - when: otherwise
      value: K('patronage_share_none_pct')
    baseline:
      patronage_share_pct: K('patronage_share_none_pct')
    evidence:
    - cross_category
    - history
    cross_difficulty: patronage
  - id: arrears_age_step
    effect: parameter
    decides: age_step_pct
    bindings:
    - arrears_days
    - age_step_pct
    ladder:
    - when: the account has stood past due for more than ninety days, counted from the date it went past due as
        day zero to the handling date
      value: K('age_step_long_pct')
    - when: the account has stood past due for more than forty-five days but not more than ninety, counted the same
        way
      value: K('age_step_short_pct')
    - when: otherwise
      value: K('age_step_none_pct')
    baseline:
      age_step_pct: K('age_step_none_pct')
    evidence:
    - date
    cross_difficulty: null
  baseline:
    rule: 'Where a member asks what they must remit to bring the arrears on a crop input account back inside the
      cooperative''s terms, the desk quotes one figure and the member pays it in their own name. The product balance
      the figure is built on is everything invoiced to the account that has run past the programme''s terms, which
      is every delivery invoiced to it apart from those invoiced within the statement months the programme''s terms
      cover, the programme''s terms in days being taken over a statement month of thirty days, less every payment
      posted to the account, every credit memo written on it and every discount granted on it. The share of the
      service charges standing on the account that is carried into the settlement figure is nil. The settlement
      base is the product balance plus the share carried in of the service charges standing on the account, rounded
      half away from zero to two decimal places. The share of the settlement base the member must remit is the reinstatement
      share the programme carries. The further share of the settlement base added for the age of the arrears is
      nil. The amount sought is the settlement base multiplied by the share the member must remit and the further
      share added for the age of the arrears taken together as one total share, applied once to the settlement base
      and rounded half away from zero to two decimal places; the two shares are combined before they are applied
      and they do not act one after the other. The share of the value of the grain still owed to the cooperative
      that is set against the amount sought is nil. The grain credit is the bushels still owed to the cooperative
      on the member''s live grain marketing contract multiplied by the cash price that contract carries and then
      by the share set against the amount sought, rounded half away from zero to two decimal places. The share of
      the cash portion of the member''s patronage allocation that is set against the amount sought is nil. The patronage
      credit is the cash portion of the allocations posted to the member''s equity account over the twelve statement
      months before the handling date multiplied by the share set against the amount sought, rounded half away from
      zero to two decimal places. The net figure is the amount sought less the grain credit and less the patronage
      credit, both taken off the amount sought itself and neither taken off the other, and where that net figure
      is negative it is nil. The figure the member is asked to remit is the net figure as worked out, to the cent.
      The figure quoted and paid is that figure rounded half away from zero to two decimal places.

      '
    params:
    - reinstatement_payment_pct
    - terms_days
    - charge_share_none_pct
    - age_step_none_pct
    - grain_share_none_pct
    - patronage_share_none_pct
    - statement_month_days
  inputs:
    history:
    - table: agronomy_invoices
      aggregate: sum
      field: amount
      within_months: null
      filters:
        event_type: agronomy_invoice_issued
    - table: agronomy_invoices
      aggregate: count
      field: amount
      within_months: 10
      filters:
        event_type: agronomy_finance_charge_assessed
    - category: grain
      table: grain_ledger
      aggregate: count
      field: net_amount
      within_months: 10
      filters:
        event_type: grain_settlement_issued
    - category: patronage
      table: patronage_ledger
      aggregate: sum
      field: cash_portion_amount
      within_months: 12
      filters:
        event_type: patronage_allocation_posted
    cross_category:
    - grain
    - patronage
- id: agronomy_ext_season_volume_discount
  base_policy_refs:
  - agronomy_discount_schedule
  overwrite:
  - base_policy: agronomy_discount_schedule
    superseded_clause: The volume discount is earned on season input spend above the programme's volume threshold,
      the spend being the member's invoiced amount across every input account for the current crop year, and it
      is granted at the close of the season rather than invoice by invoice.
    replaced_by: The season spend the discount is earned on is everything invoiced to the account over the fourteen
      statement months before the handling date, less every credit memo written on the account over those months,
      rounded half away from zero to two decimal places.
  trigger: state_due
  subject:
  - agronomy_discount_granted
  computes: discount_amount
  target_tool: grant_season_volume_discount_cc5ed557
  params:
    season_months: 14
    steady_delivery_count: 8
    clean_payment_count: 5
    double_multiple: 2
    rate_top_pct: 2.25
    rate_mid_pct: 1.9
    uplift_grain_pct: 0.4
    uplift_steady_pct: 0.2
    uplift_none_pct: 0.0
    grain_bonus_top_pct: 0.5
    grain_bonus_part_pct: 0.25
    grain_bonus_none_pct: 0.0
    qualifying_delivery_bushels: 25000
  rule: 'The volume discount a member has earned on a crop input account for the crop year just closed is granted
    once, after the season has closed, and is written against the last invoice raised on the account in that season.
    The season spend the discount is earned on is everything invoiced to the account over the fourteen statement
    months before the handling date, less every credit memo written on the account over those months, rounded half
    away from zero to two decimal places. The volume discount rate is the rate the programme carries. Where eight
    or more deliveries were invoiced to the account over those fourteen months and the credit department''s standing
    decision on the account is an approval, the volume discount rate is instead the steady buying rate. Where eight
    or more deliveries were invoiced to the account over those months and that decision is conditional, the volume
    discount rate is instead the conditional buying rate. The qualifying spend the rate acts on is the part of the
    season spend above the programme''s volume discount threshold, and where the season spend does not reach that
    threshold the qualifying spend is nil. Where the season spend is at or above twice the programme''s volume discount
    threshold, the qualifying spend is instead the whole of the season spend. Where the season spend is at or above
    the programme''s volume discount threshold but below twice it and a perfected security interest covering the
    growing crop is recorded on the account, the qualifying spend is instead the whole of the season spend less
    half of that threshold. The delivered grain bonus added to the rate is nil. Where the member holds a live grain
    marketing contract with the cooperative and the net bushels the cooperative has taken in from them over those
    fourteen months, counted after the moisture shrink taken at unload as the scale tickets record them, are at
    or above the qualifying delivery volume, the delivered grain bonus is instead the full delivery bonus. Where
    the member holds a live grain marketing contract with the cooperative and those net bushels are below that volume,
    the delivered grain bonus is instead the part delivery bonus. The settlement record uplift added to the rate
    is nil. Where five or more payments stand posted to the account over those fourteen months and at least one
    of them was made by a transfer of grain settlement proceeds, the uplift is instead the grain settled uplift.
    Where five or more payments stand posted to the account over those months and none of them was made by that
    route, the uplift is instead the steady payer uplift. The discount granted is the qualifying spend multiplied
    by the volume discount rate, the delivered grain bonus and the settlement record uplift taken together as one
    total rate, applied once to the qualifying spend and rounded half away from zero to two decimal places; the
    three components are combined into one rate before they are applied and they do not act one after the other.

    '
  prerequisite: []
  cross_category:
  - category: grain
    as: history
    reads:
    - status
    - grain_ledger.net_bushels
    note: The delivered grain bonus added to the rate is decided from whether the member holds a live grain marketing
      contract and from the bushels the cooperative has taken in from them.
  compute:
  - deliveries_count: COUNT('agronomy_invoices', within_months=K('season_months'), date_field='invoice_date', event_type='agronomy_invoice_issued')
  - volume_rate_pct: K('rate_top_pct') if (deliveries_count >= K('steady_delivery_count') and F('credit_status')
      == 'approved') else (K('rate_mid_pct') if (deliveries_count >= K('steady_delivery_count') and F('credit_status')
      == 'conditional') else P('volume_discount_pct'))
  - season_invoiced: SUM('agronomy_invoices','amount', within_months=K('season_months'), date_field='invoice_date',
      event_type='agronomy_invoice_issued')
  - season_credits: SUM('agronomy_invoices','amount', within_months=K('season_months'), date_field='posted_date',
      event_type='agronomy_credit_memo_issued')
  - season_spend: RND(season_invoiced + season_credits, 2)
  - qualifying_spend: season_spend if season_spend >= P('volume_discount_threshold_usd') * K('double_multiple')
      else (RND(season_spend - P('volume_discount_threshold_usd') / 2, 2) if (season_spend >= P('volume_discount_threshold_usd')
      and F('lien_on_file') == True) else MX(0, RND(season_spend - P('volume_discount_threshold_usd'), 2)))
  - holds_grain_contract: EXISTS('grain', status='active')
  - delivered_bushels: XSUM('grain','grain_ledger','net_bushels', within_months=K('season_months'), date_field='delivery_date',
      event_type='grain_delivery_applied')
  - grain_bonus_pct: K('grain_bonus_top_pct') if (holds_grain_contract and delivered_bushels >= K('qualifying_delivery_bushels'))
      else (K('grain_bonus_part_pct') if (holds_grain_contract and delivered_bushels < K('qualifying_delivery_bushels'))
      else K('grain_bonus_none_pct'))
  - payments_count: COUNT('agronomy_invoices', within_months=K('season_months'), date_field='posted_date', event_type='agronomy_payment_posted')
  - grain_transfer_count: COUNT('agronomy_invoices', within_months=K('season_months'), date_field='posted_date',
      event_type='agronomy_payment_posted', payment_method='grain_settlement_transfer')
  - uplift_pct: K('uplift_grain_pct') if (payments_count >= K('clean_payment_count') and grain_transfer_count >=
      1) else (K('uplift_steady_pct') if (payments_count >= K('clean_payment_count') and grain_transfer_count <
      1) else K('uplift_none_pct'))
  - result: RND(qualifying_spend * (volume_rate_pct + grain_bonus_pct + uplift_pct) / 100, 2)
  compute_basis:
    deliveries_count: Where eight or more deliveries were invoiced to the account over those fourteen months and
      the credit department's standing decision on the account is an approval, the volume discount rate is instead
      the steady buying rate.
    volume_rate_pct: The volume discount rate is the rate the programme carries. Where eight or more deliveries
      were invoiced to the account over those fourteen months and the credit department's standing decision on the
      account is an approval, the volume discount rate is instead the steady buying rate. Where eight or more deliveries
      were invoiced to the account over those months and that decision is conditional, the volume discount rate
      is instead the conditional buying rate.
    season_invoiced: The season spend the discount is earned on is everything invoiced to the account over the fourteen
      statement months before the handling date, less every credit memo written on the account over those months,
      rounded half away from zero to two decimal places.
    season_credits: The season spend the discount is earned on is everything invoiced to the account over the fourteen
      statement months before the handling date, less every credit memo written on the account over those months,
      rounded half away from zero to two decimal places.
    season_spend: The season spend the discount is earned on is everything invoiced to the account over the fourteen
      statement months before the handling date, less every credit memo written on the account over those months,
      rounded half away from zero to two decimal places.
    qualifying_spend: The qualifying spend the rate acts on is the part of the season spend above the programme's
      volume discount threshold, and where the season spend does not reach that threshold the qualifying spend is
      nil. Where the season spend is at or above twice the programme's volume discount threshold, the qualifying
      spend is instead the whole of the season spend. Where the season spend is at or above the programme's volume
      discount threshold but below twice it and a perfected security interest covering the growing crop is recorded
      on the account, the qualifying spend is instead the whole of the season spend less half of that threshold.
    holds_grain_contract: Where the member holds a live grain marketing contract with the cooperative and the net
      bushels the cooperative has taken in from them over those fourteen months, counted after the moisture shrink
      taken at unload as the scale tickets record them, are at or above the qualifying delivery volume, the delivered
      grain bonus is instead the full delivery bonus.
    delivered_bushels: Where the member holds a live grain marketing contract with the cooperative and the net bushels
      the cooperative has taken in from them over those fourteen months, counted after the moisture shrink taken
      at unload as the scale tickets record them, are at or above the qualifying delivery volume, the delivered
      grain bonus is instead the full delivery bonus.
    grain_bonus_pct: The delivered grain bonus added to the rate is nil. Where the member holds a live grain marketing
      contract with the cooperative and the net bushels the cooperative has taken in from them over those fourteen
      months, counted after the moisture shrink taken at unload as the scale tickets record them, are at or above
      the qualifying delivery volume, the delivered grain bonus is instead the full delivery bonus. Where the member
      holds a live grain marketing contract with the cooperative and those net bushels are below that volume, the
      delivered grain bonus is instead the part delivery bonus.
    payments_count: Where five or more payments stand posted to the account over those fourteen months and at least
      one of them was made by a transfer of grain settlement proceeds, the uplift is instead the grain settled uplift.
    grain_transfer_count: Where five or more payments stand posted to the account over those fourteen months and
      at least one of them was made by a transfer of grain settlement proceeds, the uplift is instead the grain
      settled uplift.
    uplift_pct: The settlement record uplift added to the rate is nil. Where five or more payments stand posted
      to the account over those fourteen months and at least one of them was made by a transfer of grain settlement
      proceeds, the uplift is instead the grain settled uplift. Where five or more payments stand posted to the
      account over those months and none of them was made by that route, the uplift is instead the steady payer
      uplift.
    result: The discount granted is the qualifying spend multiplied by the volume discount rate, the delivered grain
      bonus and the settlement record uplift taken together as one total rate, applied once to the qualifying spend
      and rounded half away from zero to two decimal places; the three components are combined into one rate before
      they are applied and they do not act one after the other.
  factors:
  - id: steady_buying_discount_rate
    effect: parameter
    decides: volume_rate_pct
    bindings:
    - deliveries_count
    - volume_rate_pct
    ladder:
    - when: eight or more deliveries were invoiced to the account over the fourteen statement months before the
        handling date and the credit department's standing decision on the account is an approval
      value: K('rate_top_pct')
    - when: eight or more deliveries were invoiced to the account over those months and that decision is conditional
      value: K('rate_mid_pct')
    - when: otherwise
      value: P('volume_discount_pct')
    baseline:
      volume_rate_pct: P('volume_discount_pct')
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: qualifying_spend_basis
    effect: method
    decides: qualifying_spend
    bindings:
    - season_invoiced
    - season_credits
    - season_spend
    - qualifying_spend
    ladder:
    - when: the season spend is at or above twice the programme's volume discount threshold
      method: the rate is taken on the whole of the season spend
    - when: the season spend is at or above the programme's volume discount threshold but below twice it and a perfected
        security interest covering the growing crop is recorded on the account
      method: the rate is taken on the whole of the season spend less half of that threshold
    - when: otherwise
      method: the rate is taken on the part of the season spend above that threshold, and on nothing where the season
        spend does not reach it
    baseline:
      qualifying_spend: MX(0, RND(season_spend - P('volume_discount_threshold_usd'), 2))
    evidence:
    - history
    cross_difficulty: null
  - id: delivered_grain_bonus
    effect: parameter
    decides: grain_bonus_pct
    bindings:
    - holds_grain_contract
    - delivered_bushels
    - grain_bonus_pct
    ladder:
    - when: the member holds a live grain marketing contract with the cooperative and the net bushels the cooperative
        has taken in from them over those fourteen months, counted after the moisture shrink taken at unload as
        the scale tickets record them, are at or above the qualifying delivery volume
      value: K('grain_bonus_top_pct')
    - when: the member holds a live grain marketing contract with the cooperative and those net bushels are below
        that volume
      value: K('grain_bonus_part_pct')
    - when: otherwise
