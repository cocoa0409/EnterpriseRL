    prior_net_spend: The prior season spend the ceiling is measured on is everything invoiced to the account over
      the fourteen statement months before the handling date, less every discount granted on the account as a discount
      line of its own, which is an early pay, volume, prepay or programme rebate discount and never the restocking
      charge withheld inside a credit memo, rounded half away from zero to two decimal places. Where the account
      has been open for at least thirty-six whole months, counted from the date it was opened to the handling date
