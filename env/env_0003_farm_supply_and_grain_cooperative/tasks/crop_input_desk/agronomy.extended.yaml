measures:
- id: agronomy_msr_season_input_spend
  window: the current crop year, which runs 1 September through 31 August
  measure: sum of amount over the member's agronomy_invoice_issued rows in that crop year across every input account
    they hold
- id: agronomy_msr_prior_year_input_spend
  window: the crop year immediately before the current one
  measure: sum of amount over the member's agronomy_invoice_issued rows in that crop year across every input account
    they hold
- id: agronomy_msr_days_past_due
  window: from the due date of the member's oldest unpaid invoice through the handling date, the due date counting
    as day zero
  measure: count of calendar days the oldest unpaid invoice has stood past its due date
- id: agronomy_msr_combined_exposure
  window: every crop input account of the member that is not closed, taken as they stand on the handling date
  measure: sum of current_balance across those accounts less the sum of prepay_balance across them
policies:
- id: agronomy_agg_multi_holding
  subject:
  - agronomy_account_opened
  rule: 'A member may carry at most two crop input accounts at once, counting every account that is not closed,
    because the cooperative underwrites the member rather than the account and two sets of books is as far as the
    credit department will follow one operation. The ordinary pairing is one charge or financing account for the
    season''s buying and one prepay account for money paid in ahead, and a second charge account is not opened while
    a first one is live; a member who wants different terms has the existing account rewritten instead. A programme
    whose entry gate calls for a credit review is not opened until the credit department has recorded its decision
    on that member. A programme whose entry gate calls for a security interest is not opened until the perfected
    security interest covering the growing crop is recorded on file. Neither of those is taken from the member''s
    account of what their lender has filed, however confident they sound. Where either is outstanding the application
    is taken and the account waits in applied or under credit review; the member buys for cash in the meantime.

    '
  eligibility:
  - id: security_interest_recorded
    applies_to:
    - agronomy_account_opened
    kind: authorization
    condition: A programme whose entry gate calls for a security interest is not opened until the perfected security
      interest covering the growing crop is recorded on file.
    evidence_fields:
    - agronomy_accounts.lien_on_file
    - agronomy_accounts.variant_name
    - agronomy_accounts.account_number
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - agronomy_accounts.account_number
      action_bindings:
        agronomy_accounts.account_number: account_number
  params:
    max_per_customer: 2
    ordinary_pairing:
    - one_buying_account
    - one_prepay_account
- id: agronomy_agg_exposure_across_accounts
  subject:
  - agronomy_invoice_issued
  - agronomy_account_updated
  rule: 'Credit is measured across the member''s whole input position rather than account by account. Combined exposure
    is what is owed on every input account of the member that is not closed, less the prepay held to their credit
    on those same accounts, and it is measured against the sum of the limits those accounts carry. Product is released
    against an account only where the combined exposure after the invoice would stay at or under the combined limit,
    so a member sitting at their ceiling on one account cannot be supplied by writing the ticket on the other. A
    member who also holds a live grain marketing contract for the current crop year on a programme the grain catalogue
    marks patronage-eligible carries a working allowance above their combined limit equal to the delivered value
    of the bushels still owed on those contracts, because that grain is coming to the cooperative and will settle
    here. That allowance falls away the moment the contract is cancelled, defaulted or fully settled, and it is
    never counted twice against two accounts. Where the exposure would be passed the desk releases what fits inside
    the ceiling, holds the balance and refers the member to credit; it never releases product over the ceiling and
    asks credit afterwards.

    '
  eligibility:
  - id: account_live_for_release
    applies_to:
    - agronomy_invoice_issued
    kind: state
    condition: Product is released against an account only where the combined exposure after the invoice would stay
      at or under the combined limit, so a member sitting at their ceiling on one account cannot be supplied by
      writing the ticket on the other.
    evidence_fields:
    - agronomy_accounts.status
    - agronomy_accounts.credit_limit
    - agronomy_accounts.current_balance
    - agronomy_accounts.account_number
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - agronomy_accounts.account_number
      action_bindings:
        agronomy_accounts.account_number: account_number
    state_contract:
      field: agronomy_accounts.status
      allowed:
      - active
      - past_due
  params:
    exposure_basis: sum_of_balances_less_sum_of_prepay
    grain_allowance_basis: delivered_value_of_open_bushels_on_patronage_eligible_contracts
  measures:
  - agronomy_msr_combined_exposure
- id: agronomy_evt_invoicing
  subject:
  - agronomy_invoice_issued
  rule: 'An invoice is raised when product physically leaves the plant, on the delivery ticket, and never when an
    order is merely written. The invoice date is the day of that delivery, and the due date is the invoice date
    plus the account''s terms in calendar days, a payment landing on the due date itself still being on time. Where
    the terms day falls on a day the office is shut the due date moves to the next day the office is open, and where
    the terms carry past the end of a month onto a day that month does not have, the due date falls on the last
    day of that month. Product is priced at the list price in force on the day of delivery, except where the line
    draws against a prepay booking, which prices at the booked price however the list has moved. Cash programmes
    are paid for as the product leaves and carry no terms at all, so an invoice on a cash programme is raised and
    settled the same day. A delivery under the programme''s minimum order carries the delivery minimum charge, and
    splitting one order across two fields or two days carries the split load charge, both of which are billed on
    the same invoice as the product rather than separately. Prescription products are not released at all on programmes
    that require a current soil test until one is on file.

    '
  eligibility:
  - id: soil_test_before_prescription
    applies_to:
    - agronomy_invoice_issued
    kind: authorization
    condition: Prescription products are not released at all on programmes that require a current soil test until
      one is on file.
    evidence_fields:
    - agronomy_orders.order_type
    - agronomy_orders.order_status
    - agronomy_orders.order_id
    - agronomy_accounts.variant_name
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - agronomy_orders.order_id
      action_bindings:
        agronomy_orders.order_id: order_id
  params:
    pricing_basis: list_price_on_the_delivery_day_unless_drawn_from_prepay
    per_tier:
      Cash Purchase Account:
        terms: =terms_days
        minimum_order_usd: =delivery_minimum_order_usd
        under_minimum_charge_usd: =delivery_minimum_charge_usd
        split_load_usd: =split_load_fee_usd
      Standard 30-Day Charge Account:
        terms: =terms_days
        minimum_order_usd: =delivery_minimum_order_usd
        under_minimum_charge_usd: =delivery_minimum_charge_usd
        split_load_usd: =split_load_fee_usd
      Seasonal Terms Crop Input Account:
        terms: =terms_days
        minimum_order_usd: =delivery_minimum_order_usd
        under_minimum_charge_usd: =delivery_minimum_charge_usd
        split_load_usd: =split_load_fee_usd
      Early Pay Prepay Program Account:
        terms: =terms_days
        minimum_order_usd: =delivery_minimum_order_usd
        under_minimum_charge_usd: =delivery_minimum_charge_usd
        split_load_usd: =split_load_fee_usd
      Full Acre Input Financing Account:
        terms: =terms_days
        minimum_order_usd: =delivery_minimum_order_usd
        under_minimum_charge_usd: =delivery_minimum_charge_usd
        split_load_usd: =split_load_fee_usd
      Precision Partner Input Program Account:
        terms: =terms_days
        minimum_order_usd: =delivery_minimum_order_usd
        under_minimum_charge_usd: =delivery_minimum_charge_usd
        split_load_usd: =split_load_fee_usd
  formula:
    extended_amount: round(quantity * unit_price, 2)
- id: agronomy_discount_schedule
  subject:
  - agronomy_discount_granted
  rule: 'Three discounts can land on a crop input invoice and the programme decides how they combine. The early
    pay discount is earned where the invoice is paid in full inside the early pay window, counted in whole calendar
    days from the invoice date, a payment on the final day of the window still earning it; a part payment earns
    nothing. The volume discount is earned on season input spend above the programme''s volume threshold, the spend
    being the member''s invoiced amount across every input account for the current crop year, and it is granted
    at the close of the season rather than invoice by invoice. The prepay discount is earned on money booked inside
    the prepay window and is granted when the booking is taken, not when the product is drawn. How they combine
    is fixed by the programme''s stacking basis and never negotiated at the counter, and on a best-single basis
    the largest of the applicable discounts is granted and the others are not. A programme rebate, where the programme
    carries one, sits outside the stacking basis and is paid after the season on qualifying spend once the enrolled
    acres reach the rebate threshold. A discount a programme does not carry is not zero but simply not applicable,
    so it never appears on the invoice as a nil line.

    '
  eligibility: []
  params:
    per_tier:
      Cash Purchase Account:
        stacking: =discount_stacking_basis
        early_pay_pct: =early_pay_discount_pct
        early_pay_days: =early_pay_discount_window_days
        volume_pct: =volume_discount_pct
        volume_threshold_usd: =volume_discount_threshold_usd
        prepay_pct: =prepay_discount_pct
      Standard 30-Day Charge Account:
        stacking: =discount_stacking_basis
        early_pay_pct: =early_pay_discount_pct
        early_pay_days: =early_pay_discount_window_days
        volume_pct: =volume_discount_pct
        volume_threshold_usd: =volume_discount_threshold_usd
        prepay_pct: =prepay_discount_pct
      Seasonal Terms Crop Input Account:
        stacking: =discount_stacking_basis
        early_pay_pct: =early_pay_discount_pct
        early_pay_days: =early_pay_discount_window_days
        volume_pct: =volume_discount_pct
        volume_threshold_usd: =volume_discount_threshold_usd
        prepay_pct: =prepay_discount_pct
      Early Pay Prepay Program Account:
        stacking: =discount_stacking_basis
        early_pay_pct: =early_pay_discount_pct
        early_pay_days: =early_pay_discount_window_days
        volume_pct: =volume_discount_pct
        volume_threshold_usd: =volume_discount_threshold_usd
        prepay_pct: =prepay_discount_pct
      Full Acre Input Financing Account:
        stacking: =discount_stacking_basis
        early_pay_pct: =early_pay_discount_pct
        early_pay_days: =early_pay_discount_window_days
        volume_pct: =volume_discount_pct
        volume_threshold_usd: =volume_discount_threshold_usd
        prepay_pct: =prepay_discount_pct
      Precision Partner Input Program Account:
        stacking: =discount_stacking_basis
        early_pay_pct: =early_pay_discount_pct
        early_pay_days: =early_pay_discount_window_days
        volume_pct: =volume_discount_pct
        volume_threshold_usd: =volume_discount_threshold_usd
        prepay_pct: =prepay_discount_pct
  formula:
    discount_amount: round(extended_amount * early_pay_discount_pct / 100, 2)
  measures:
  - agronomy_msr_season_input_spend
- id: agronomy_prepay_program
  subject:
  - agronomy_prepay_booked
  - agronomy_prepay_applied
  rule: 'Prepay is money the member pays in before the season against named product, and it is taken only inside
    the programme''s booking window, which opens and closes on the month and day the catalogue fixes. A booking
    must reach the programme''s minimum, and the member may book no more than the programme''s ceiling as a share
    of their input spend in the crop year immediately before the current one, because prepay is a buying commitment
    and not a deposit account. The booking locks the price of the product it names, so the line drawn against it
    prices at the booked price however the list has moved by delivery. Prepay is drawn down against invoices as
    product is taken, oldest booking first, and on programmes that allow it money booked against one input class
    may be drawn against another, while on programmes that do not the booking is honoured only against what it named.
    Unapplied prepay is carried forward and is forfeited to the cooperative only once it has stood unapplied for
    the programme''s forfeiture period counted from the close of the booking window it was taken in. Prepay is never
    refunded in cash on request, because the money bought product rather than credit; a member who will not use
    it may have it moved to another input class where the programme allows that, and where it does not, the request
    is one no policy settles.

    '
  eligibility:
  - id: booking_window_open
    applies_to:
    - agronomy_prepay_booked
    kind: authorization
    condition: Prepay is money the member pays in before the season against named product, and it is taken only
      inside the programme's booking window, which opens and closes on the month and day the catalogue fixes.
    evidence_fields:
    - agronomy_orders.order_type
    - agronomy_orders.order_status
    - agronomy_orders.order_id
    - agronomy_orders.requested_amount
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - agronomy_orders.order_id
      action_bindings:
        agronomy_orders.order_id: order_id
  params:
    drawdown_order: oldest_booking_first
    per_tier:
      Cash Purchase Account:
        window_open: =prepay_booking_window_open_month_day
        window_close: =prepay_booking_window_close_month_day
        minimum_usd: =prepay_minimum_usd
        ceiling_pct_of_prior_year: =prepay_maximum_pct_of_prior_year
        forfeit_after_months: =prepay_forfeiture_after_months
        transferable: =prepay_transferable_between_categories
      Standard 30-Day Charge Account:
        window_open: =prepay_booking_window_open_month_day
        window_close: =prepay_booking_window_close_month_day
        minimum_usd: =prepay_minimum_usd
        ceiling_pct_of_prior_year: =prepay_maximum_pct_of_prior_year
        forfeit_after_months: =prepay_forfeiture_after_months
        transferable: =prepay_transferable_between_categories
      Seasonal Terms Crop Input Account:
        window_open: =prepay_booking_window_open_month_day
        window_close: =prepay_booking_window_close_month_day
        minimum_usd: =prepay_minimum_usd
        ceiling_pct_of_prior_year: =prepay_maximum_pct_of_prior_year
        forfeit_after_months: =prepay_forfeiture_after_months
        transferable: =prepay_transferable_between_categories
      Early Pay Prepay Program Account:
        window_open: =prepay_booking_window_open_month_day
        window_close: =prepay_booking_window_close_month_day
        minimum_usd: =prepay_minimum_usd
        ceiling_pct_of_prior_year: =prepay_maximum_pct_of_prior_year
        forfeit_after_months: =prepay_forfeiture_after_months
        transferable: =prepay_transferable_between_categories
      Full Acre Input Financing Account:
        window_open: =prepay_booking_window_open_month_day
        window_close: =prepay_booking_window_close_month_day
        minimum_usd: =prepay_minimum_usd
        ceiling_pct_of_prior_year: =prepay_maximum_pct_of_prior_year
        forfeit_after_months: =prepay_forfeiture_after_months
        transferable: =prepay_transferable_between_categories
      Precision Partner Input Program Account:
        window_open: =prepay_booking_window_open_month_day
        window_close: =prepay_booking_window_close_month_day
        minimum_usd: =prepay_minimum_usd
        ceiling_pct_of_prior_year: =prepay_maximum_pct_of_prior_year
        forfeit_after_months: =prepay_forfeiture_after_months
        transferable: =prepay_transferable_between_categories
  measures:
  - agronomy_msr_prior_year_input_spend
- id: agronomy_payment_application
  subject:
  - agronomy_payment_posted
  rule: 'A payment is applied to the invoices it names, and where it names none it is applied in the programme''s
    allocation order. On an oldest-invoice-first order the payment clears the oldest open invoice in full before
    any of the next, and on a prepay-first order any prepay standing to the member''s credit is drawn before their
    own money is taken. Payments may reach the cooperative only by the methods the programme allows, so a member
    on a cash programme cannot direct grain proceeds onto the account and must be paid for their grain and pay the
    invoice separately. Where the member has elected on a grain settlement to have the proceeds credited to their
    input account, the whole net of that settlement lands on the account as one payment on the settlement date and
    is applied in the ordinary order; it is not split across accounts and it is not held back to await the member''s
    instruction. A part payment on an overdue balance is accepted only at or above the programme''s minimum part
    payment as a share of the balance, and a smaller offer is declined rather than accepted and left to fall short
    of reinstatement. Payments are applied on the day they are received, and a payment received after the office
    closes is applied the next day the office is open, which matters where it lands against a due date.

    '
  eligibility: []
  params:
    per_tier:
      Cash Purchase Account:
        allocation: =payment_allocation_order
        methods: =payment_methods_allowed
        grain_transfer: =grain_settlement_transfer_allowed
        minimum_part_payment_pct: =minimum_payment_pct_of_balance
      Standard 30-Day Charge Account:
        allocation: =payment_allocation_order
        methods: =payment_methods_allowed
        grain_transfer: =grain_settlement_transfer_allowed
        minimum_part_payment_pct: =minimum_payment_pct_of_balance
      Seasonal Terms Crop Input Account:
        allocation: =payment_allocation_order
        methods: =payment_methods_allowed
        grain_transfer: =grain_settlement_transfer_allowed
