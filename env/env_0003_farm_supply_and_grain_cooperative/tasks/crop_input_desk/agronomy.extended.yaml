  baseline:
    rule: 'The volume discount a member has earned on a crop input account for the crop year just closed is granted
      once, after the season has closed, and is written against the last invoice raised on the account in that season.
      The season spend the discount is earned on is everything invoiced to the account over the fourteen statement
      months before the handling date, less every credit memo written on the account over those months, rounded
      half away from zero to two decimal places. The volume discount rate is the rate the programme carries. The
      qualifying spend the rate acts on is the part of the season spend above the programme''s volume discount threshold,
      and where the season spend does not reach that threshold the qualifying spend is nil. The delivered grain
      bonus added to the rate is nil. The settlement record uplift added to the rate is nil. The discount granted
      is the qualifying spend multiplied by the volume discount rate, the delivered grain bonus and the settlement
      record uplift taken together as one total rate, applied once to the qualifying spend and rounded half away
      from zero to two decimal places; the three components are combined into one rate before they are applied and
      they do not act one after the other.

      '
    params:
    - volume_discount_pct
    - volume_discount_threshold_usd
    - season_months
    - grain_bonus_none_pct
    - uplift_none_pct
