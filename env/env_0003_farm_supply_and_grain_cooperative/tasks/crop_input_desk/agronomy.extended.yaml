- id: agronomy_ext_arrears_service_charge
  base_policy_refs:
  - agronomy_finance_charge
  overwrite:
  - base_policy: agronomy_finance_charge
    superseded_clause: The charge is the programme's monthly percentage on the unpaid balance of that invoice, assessed
      once per statement month for as long as it stands unpaid, and where the computed charge falls under the programme's
      floor the floor is assessed instead.
    replaced_by: The charge at the rate is that balance multiplied by the monthly service rate and then multiplied
      by the chargeable days over a statement month of thirty days, rounded half away from zero to two decimal places
      once at the end of that step.
  - base_policy: agronomy_finance_charge
    superseded_clause: It is assessed per invoice rather than on the account total, so a member with three overdue
      invoices carries three charges and three floors.
    replaced_by: The service charge a crop input account carries is worked out on the overdue balance of the account
      as a whole rather than invoice by invoice, and one charge is booked for the statement month then running against
      the oldest invoice on the account that has run past the programme's terms and still stands unpaid.
  trigger: state_due
  subject:
  - agronomy_finance_charge_assessed
  computes: service_charge_amount
  target_tool: assess_overdue_service_charge_aaf992aa
  params:
    lookback_months: 10
    settlement_lookback_months: 12
    recent_months: 3
    statement_month_days: 30
    settled_payment_count: 3
    repeat_discount_count: 2
    single_discount_count: 1
    rate_settled_volume_pct: 0.85
    rate_volume_pct: 1.05
    grace_reviewed_approved_days: 30
    grace_reviewed_conditional_days: 20
    clawback_full_pct: 100.0
    clawback_half_pct: 50.0
    clawback_none_pct: 0.0
    relief_settled_factor: 0.5
    relief_unsettled_factor: 0.75
    surcharge_long_days: 60
    surcharge_short_days: 30
    surcharge_long_usd: 75.0
    surcharge_short_usd: 35.0
    surcharge_none_usd: 0.0
  rule: 'The service charge a crop input account carries is worked out on the overdue balance of the account as
    a whole rather than invoice by invoice, and one charge is booked for the statement month then running against
    the oldest invoice on the account that has run past the programme''s terms and still stands unpaid. The service
    charge arithmetic the programme''s own schedule sets out — the monthly percentage taken on one invoice''s unpaid
    amount, floored at the programme''s minimum — is withdrawn together with the per-invoice clauses it belongs
    to and is not applied to a charge worked out this way. The overdue balance is everything invoiced to the account
    that has run past the programme''s terms, which is every delivery invoiced to it apart from those invoiced within
    the statement months the programme''s terms cover, the programme''s terms in days being taken over a statement
    month of thirty days. That balance is reduced by every payment posted to the account, by every credit memo written
    on it and by every discount granted on it, whatever the invoice each was written against, and is increased by
    every service charge already standing on it. The service charge on a crop input account is worked out only once
    every credit memo owed for crop protection product that has come back to the plant stands written against that
    account. The monthly service rate is the rate the programme carries. Where three or more payments have been
    posted to the account over the twelve statement months before the handling date and the member''s input spend
    on the account over the ten statement months before the handling date is at or above the programme''s volume
    discount threshold, the monthly service rate is instead the settled buying rate. Where fewer than three payments
    have been posted over those twelve months and that spend is at or above the programme''s volume discount threshold,
    the monthly service rate is instead the volume buying rate. The overdue days are counted from the date the account
    went past due, that date counting as day zero, to the handling date on which the charge is worked out. Where
    a service charge already stands assessed on the account over the ten statement months before the handling date,
    the overdue days are instead counted from the day the most recent of those charges was posted, that day counting
    as day zero, to the same handling date. Where no service charge stands assessed on the account over those months
    and a payment has been posted to the account over the twelve statement months before the handling date, the
    overdue days are instead counted from the day the most recent of those payments was posted, that day counting
    as day zero, to the same handling date. The days of grace allowed before the charge bites are the grace days
    the programme carries. Where the account''s most recent credit review was completed inside the programme''s
    review interval, counted in whole months from the day the review completed to the handling date, and the credit
    department''s standing decision on the account is an approval, the days of grace are instead the reviewed approval
    grace. Where the account''s most recent credit review was completed inside that interval, counted the same way,
    and that decision is conditional, the days of grace are instead the reviewed conditional grace. The chargeable
    days are the overdue days less the days of grace, and where that difference is negative the chargeable days
    are nil. The share of the discounts granted on the account that is added back before the charge is worked out
    is nil. Where two or more discounts stand granted on the account over the ten statement months before the handling
    date and the overdue balance has reached the programme''s suspension threshold, the concession those discounts
    gave for settling inside the window is taken back in full, so the share added back is instead the whole of them.
    Where one discount stands granted on the account over those months and the overdue balance has reached the programme''s
    suspension threshold, that concession is taken back in part, so the share added back is instead half of them.
    The balance the rate acts on is the overdue balance plus the share added back of the discounts granted on the
    account, rounded half away from zero to two decimal places. The charge at the rate is that balance multiplied
    by the monthly service rate and then multiplied by the chargeable days over a statement month of thirty days,
    rounded half away from zero to two decimal places once at the end of that step. The charge stands as worked
    out at the rate. Where the member has bushels on hand under a live storage agreement with the cooperative and
    a storage charge settlement stands on that agreement over the ten statement months before the handling date,
    the charge worked out at the rate is instead halved and rounded half away from zero to two decimal places. Where
    the member has bushels on hand under a live storage agreement with the cooperative and no storage charge settlement
    stands on it over those months, the charge worked out at the rate is instead taken at three quarters of itself
    and rounded half away from zero to two decimal places. The collection handling sum added to the charge is nil.
    Where the overdue days run past sixty and no payment has been posted to the account over the three statement
    months before the handling date, the collection handling sum is instead the long arrears sum. Where the overdue
    days run past thirty but not past sixty and no payment has been posted to the account over those three months,
    the collection handling sum is instead the short arrears sum. The service charge booked is the charge after
    relief plus the collection handling sum, and where that total falls under the programme''s service charge floor
    the floor is booked instead; the result is rounded half away from zero to two decimal places once at the end.

    '
  prerequisite:
  - problem: agronomy_ext_crop_protection_return_credit
    kind: value_input
    gate: overdue_balance
    form: state
    policy_source: The service charge on a crop input account is worked out only once every credit memo owed for
      crop protection product that has come back to the plant stands written against that account.
    condition: Every credit memo owed for crop protection product that has come back to the plant stands written
      against the account, so that no credit still due sits outside the balance the charge is worked on.
    resolved_by: issue_return_credit_6859ca91
    effect: The overdue balance binding falls by the value of the credit memo written for the returned product,
      and the charge is worked on the smaller balance.
  cross_category:
  - category: storage
    as: history
    reads:
    - status
    - storage_charges.event_type
    note: The relief taken off the charge worked out at the rate is decided from whether the member has bushels
      on hand under a live storage agreement and whether a storage charge settlement stands on it.
  compute:
  - payments_year: COUNT('agronomy_invoices', within_months=K('settlement_lookback_months'), date_field='posted_date',
      event_type='agronomy_payment_posted')
  - season_spend: SUM('agronomy_invoices','amount', within_months=K('lookback_months'), date_field='invoice_date',
      event_type='agronomy_invoice_issued')
  - monthly_pct: K('rate_settled_volume_pct') if (payments_year >= K('settled_payment_count') and season_spend >=
      P('volume_discount_threshold_usd')) else (K('rate_volume_pct') if (payments_year < K('settled_payment_count')
      and season_spend >= P('volume_discount_threshold_usd')) else P('finance_charge_monthly_pct'))
  - charges_all: SUM('agronomy_invoices','amount', event_type='agronomy_invoice_issued')
  - charges_in_terms: SUM('agronomy_invoices','amount', within_months=P('terms_days') / K('statement_month_days'),
      date_field='invoice_date', event_type='agronomy_invoice_issued')
  - matured_charges: RND(charges_all - charges_in_terms, 2)
  - charges_standing: SUM('agronomy_invoices','amount', event_type='agronomy_finance_charge_assessed')
  - payments_standing: SUM('agronomy_invoices','amount', event_type='agronomy_payment_posted')
  - credits_standing: SUM('agronomy_invoices','amount', event_type='agronomy_credit_memo_issued')
  - discounts_standing: SUM('agronomy_invoices','amount', event_type='agronomy_discount_granted')
  - overdue_balance: RND(matured_charges + charges_standing + payments_standing + credits_standing + discounts_standing,
      2)
  - prior_charge_count: COUNT('agronomy_invoices', within_months=K('lookback_months'), date_field='posted_date',
      event_type='agronomy_finance_charge_assessed')
  - last_charge_date: LATEST('agronomy_invoices','posted_date', date_field='posted_date', event_type='agronomy_finance_charge_assessed')
  - last_payment_date: LATEST('agronomy_invoices','posted_date', date_field='posted_date', event_type='agronomy_payment_posted')
  - overdue_days: DAYS(last_charge_date, NOW) if prior_charge_count >= 1 else (DAYS(last_payment_date, NOW) if (prior_charge_count
      < 1 and payments_year >= 1) else DAYS(F('past_due_since'), NOW))
  - review_months: MONTHS(F('credit_review_date'), NOW)
  - grace_days: K('grace_reviewed_approved_days') if (review_months < P('credit_review_interval_months') and F('credit_status')
      == 'approved') else (K('grace_reviewed_conditional_days') if (review_months < P('credit_review_interval_months')
      and F('credit_status') == 'conditional') else P('finance_charge_grace_days'))
  - discount_count: COUNT('agronomy_invoices', within_months=K('lookback_months'), date_field='posted_date', event_type='agronomy_discount_granted')
  - clawback_share_pct: K('clawback_full_pct') if (discount_count >= K('repeat_discount_count') and overdue_balance
      >= P('suspension_balance_threshold_usd')) else (K('clawback_half_pct') if (discount_count >= K('single_discount_count')
      and overdue_balance >= P('suspension_balance_threshold_usd')) else K('clawback_none_pct'))
  - charge_base: RND(overdue_balance + ABS(discounts_standing) * clawback_share_pct / 100, 2)
  - chargeable_days: MX(0, overdue_days - grace_days)
  - charge_at_rate: RND(charge_base * monthly_pct / 100 * chargeable_days / K('statement_month_days'), 2)
  - holds_storage: EXISTS('storage', status='active')
  - storage_settlements: XCOUNT('storage','storage_charges', within_months=K('lookback_months'), date_field='posted_date',
      event_type='storage_charge_settled')
  - charge_after_relief: RND(charge_at_rate * K('relief_settled_factor'), 2) if (holds_storage and storage_settlements
      >= 1) else (RND(charge_at_rate * K('relief_unsettled_factor'), 2) if (holds_storage and storage_settlements
      < 1) else charge_at_rate)
  - payments_recent: COUNT('agronomy_invoices', within_months=K('recent_months'), date_field='posted_date', event_type='agronomy_payment_posted')
  - surcharge: K('surcharge_long_usd') if (overdue_days > K('surcharge_long_days') and payments_recent < 1) else
      (K('surcharge_short_usd') if (overdue_days > K('surcharge_short_days') and payments_recent < 1) else K('surcharge_none_usd'))
  - result: RND(MX(P('finance_charge_minimum_usd'), charge_after_relief + surcharge), 2)
  compute_basis:
    payments_year: Where three or more payments have been posted to the account over the twelve statement months
