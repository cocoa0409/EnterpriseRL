- id: agronomy_finance_charge
  subject:
  - agronomy_finance_charge_assessed
  rule: 'A service charge is assessed on an invoice still unpaid after its grace period, and the grace period is
    counted in whole calendar days from the due date of that invoice, the due date itself counting as day zero,
    an invoice cleared on the final day of grace attracting nothing. The charge is the programme''s monthly percentage
    on the unpaid balance of that invoice, assessed once per statement month for as long as it stands unpaid, and
    where the computed charge falls under the programme''s floor the floor is assessed instead. It is assessed per
    invoice rather than on the account total, so a member with three overdue invoices carries three charges and
    three floors. A programme with no monthly percentage assesses no service charge at all, however long an invoice
    runs. A service charge already assessed is reversed only where the invoice behind it is itself reversed by a
    credit memo or where the cooperative''s own billing error put the invoice out; it is never reversed as a goodwill
    gesture at the desk, and a member who asks for it to be taken off on those grounds is passed to the credit department,
    whose decision that is.

    '
  eligibility:
  - id: grace_period_expired
    applies_to:
    - agronomy_finance_charge_assessed
    kind: time
    condition: A service charge is assessed on an invoice still unpaid after its grace period, and the grace period
      is counted in whole calendar days from the due date of that invoice, the due date itself counting as day zero,
      an invoice cleared on the final day of grace attracting nothing.
    evidence_fields:
    - agronomy_invoices.due_date
    - agronomy_invoices.invoice_number
    - agronomy_invoices.amount
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - agronomy_invoices.invoice_number
      action_bindings:
        agronomy_invoices.invoice_number: invoice_number
    temporal_basis:
      clock: frozen_time
      anchor_event: the due date of that invoice
      anchor_source: agronomy_invoices.due_date
      relation: not_before
      duration_source: variants.finance_charge_grace_days
      unit: calendar_days
      counting_rule: the grace period is counted in whole calendar days from the due date of that invoice, the due
        date itself counting as day zero, an invoice cleared on the final day of grace attracting nothing
      boundary: exclusive
  params:
    assessed_per: invoice
    per_tier:
      Cash Purchase Account:
        monthly_pct: =finance_charge_monthly_pct
        grace_days: =finance_charge_grace_days
        floor_usd: =finance_charge_minimum_usd
      Standard 30-Day Charge Account:
        monthly_pct: =finance_charge_monthly_pct
        grace_days: =finance_charge_grace_days
        floor_usd: =finance_charge_minimum_usd
      Seasonal Terms Crop Input Account:
        monthly_pct: =finance_charge_monthly_pct
        grace_days: =finance_charge_grace_days
        floor_usd: =finance_charge_minimum_usd
      Early Pay Prepay Program Account:
        monthly_pct: =finance_charge_monthly_pct
        grace_days: =finance_charge_grace_days
        floor_usd: =finance_charge_minimum_usd
      Full Acre Input Financing Account:
        monthly_pct: =finance_charge_monthly_pct
        grace_days: =finance_charge_grace_days
        floor_usd: =finance_charge_minimum_usd
      Precision Partner Input Program Account:
        monthly_pct: =finance_charge_monthly_pct
        grace_days: =finance_charge_grace_days
        floor_usd: =finance_charge_minimum_usd
  formula:
    finance_charge_amount: max(finance_charge_minimum_usd, round(amount * finance_charge_monthly_pct / 100, 2))
  measures:
  - agronomy_msr_days_past_due
- id: agronomy_returns_and_credits
  subject:
  - agronomy_credit_memo_issued
  rule: 'Product comes back only where the programme''s returnable classes cover it and only inside the return window,
    counted in whole calendar days from the delivery date on the ticket it left on, a return offered on the final
    day of the window still being in time. Crop protection product comes back only unopened and in its original
    packaging on every programme that requires that, and a part case is not a return. Seed comes back only up to
    the seed return cutoff in the season, after which the bag is the member''s whether it was opened or not, because
    the variety cannot be resold once the planting window has passed. An accepted return is credited at the price
    it was invoiced at, not the price of the day, less the programme''s restocking charge as a percentage of that
    invoiced value. Bulk fertilizer and liquid product that has left the plant are not returnable at all on any
    programme, because they cannot be brought back into the blend with their identity known. A credit memo is written
    against the invoice the product was billed on, so a member returning product billed across two invoices gets
    two credit memos; a credit memo is never written against the account as a whole. Where the account is already
    clear the credit stands to the member''s credit and is applied against their next invoice rather than refunded.

    '
  eligibility:
  - id: return_inside_window
    applies_to:
    - agronomy_credit_memo_issued
    kind: time
    condition: Product comes back only where the programme's returnable classes cover it and only inside the return
      window, counted in whole calendar days from the delivery date on the ticket it left on, a return offered on
      the final day of the window still being in time.
    evidence_fields:
    - agronomy_invoices.invoice_date
    - agronomy_invoices.delivery_ticket_number
    - agronomy_invoices.product_category
    - agronomy_invoices.invoice_number
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - agronomy_invoices.invoice_number
        - agronomy_invoices.delivery_ticket_number
      action_bindings:
        agronomy_invoices.invoice_number: invoice_number
        agronomy_invoices.delivery_ticket_number: delivery_ticket_number
    temporal_basis:
      clock: frozen_time
      anchor_event: the delivery date on the ticket it left on
      anchor_source: agronomy_invoices.invoice_date
      relation: not_after
      duration_source: variants.return_window_days
      unit: calendar_days
      counting_rule: counted in whole calendar days from the delivery date on the ticket it left on, a return offered
        on the final day of the window still being in time
      boundary: inclusive
  params:
    never_returnable:
    - liquid_fertilizer_out_of_the_plant
    - bulk_blended_dry_fertilizer
    per_tier:
      Cash Purchase Account:
        window_days: =return_window_days
        restocking_pct: =restocking_fee_pct
        classes: =returnable_categories
        seed_cutoff: =seed_return_cutoff_month_day
        unopened_only: =chemical_return_unopened_only
      Standard 30-Day Charge Account:
        window_days: =return_window_days
        restocking_pct: =restocking_fee_pct
        classes: =returnable_categories
        seed_cutoff: =seed_return_cutoff_month_day
        unopened_only: =chemical_return_unopened_only
      Seasonal Terms Crop Input Account:
        window_days: =return_window_days
        restocking_pct: =restocking_fee_pct
        classes: =returnable_categories
        seed_cutoff: =seed_return_cutoff_month_day
        unopened_only: =chemical_return_unopened_only
      Early Pay Prepay Program Account:
        window_days: =return_window_days
        restocking_pct: =restocking_fee_pct
        classes: =returnable_categories
        seed_cutoff: =seed_return_cutoff_month_day
        unopened_only: =chemical_return_unopened_only
      Full Acre Input Financing Account:
        window_days: =return_window_days
        restocking_pct: =restocking_fee_pct
        classes: =returnable_categories
        seed_cutoff: =seed_return_cutoff_month_day
        unopened_only: =chemical_return_unopened_only
      Precision Partner Input Program Account:
        window_days: =return_window_days
        restocking_pct: =restocking_fee_pct
        classes: =returnable_categories
        seed_cutoff: =seed_return_cutoff_month_day
        unopened_only: =chemical_return_unopened_only
  formula:
    discount_amount: round(extended_amount * restocking_fee_pct / 100, 2)
    amount: round(extended_amount - extended_amount * restocking_fee_pct / 100, 2)
- id: agronomy_credit_standing
  subject:
  - agronomy_account_past_due_flagged
  - agronomy_account_suspended
  rule: 'An account is flagged past due once an invoice has stood unpaid for the programme''s past-due trigger in
    calendar days beyond its due date, and the flag comes off only when nothing on the account is overdue, not merely
    when the oldest invoice is cleared. Buying is suspended when the oldest overdue invoice reaches the programme''s
    suspension trigger in days, or at any time once the overdue balance reaches the programme''s suspension threshold,
    whichever comes first; the threshold bites on its own, so a large balance one day overdue can suspend an account
    that the day count alone would not. Suspension stops new product leaving the plant and does not disturb product
    already delivered, prepay already booked or custom application work already scheduled. Buying is reinstated
    when the member pays at least the programme''s reinstatement share of the overdue balance, and reinstatement
    is recorded by the credit department rather than at the counter, however plainly the member says the payment
    has been sent. A member whose grain settlement will clear the balance within days may ask for the suspension
    to be lifted early against that settlement, and that is a judgement the credit department makes and no rule
    here settles.

    '
  eligibility:
  - id: credit_department_records_reinstatement
    applies_to:
    - agronomy_account_suspended
    kind: authorization
    condition: Buying is reinstated when the member pays at least the programme's reinstatement share of the overdue
      balance, and reinstatement is recorded by the credit department rather than at the counter, however plainly
      the member says the payment has been sent.
    evidence_fields:
    - agronomy_accounts.credit_status
    - agronomy_accounts.current_balance
    - agronomy_accounts.account_number
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - agronomy_accounts.account_number
      action_bindings:
        agronomy_accounts.account_number: account_number
  params:
    per_tier:
      Cash Purchase Account:
        past_due_days: =past_due_trigger_days
        suspend_days: =suspension_trigger_days
        suspend_balance_usd: =suspension_balance_threshold_usd
        reinstate_pct: =reinstatement_payment_pct
      Standard 30-Day Charge Account:
        past_due_days: =past_due_trigger_days
        suspend_days: =suspension_trigger_days
        suspend_balance_usd: =suspension_balance_threshold_usd
        reinstate_pct: =reinstatement_payment_pct
      Seasonal Terms Crop Input Account:
        past_due_days: =past_due_trigger_days
        suspend_days: =suspension_trigger_days
        suspend_balance_usd: =suspension_balance_threshold_usd
        reinstate_pct: =reinstatement_payment_pct
      Early Pay Prepay Program Account:
        past_due_days: =past_due_trigger_days
        suspend_days: =suspension_trigger_days
        suspend_balance_usd: =suspension_balance_threshold_usd
        reinstate_pct: =reinstatement_payment_pct
      Full Acre Input Financing Account:
        past_due_days: =past_due_trigger_days
        suspend_days: =suspension_trigger_days
        suspend_balance_usd: =suspension_balance_threshold_usd
        reinstate_pct: =reinstatement_payment_pct
      Precision Partner Input Program Account:
        past_due_days: =past_due_trigger_days
        suspend_days: =suspension_trigger_days
        suspend_balance_usd: =suspension_balance_threshold_usd
        reinstate_pct: =reinstatement_payment_pct
  measures:
  - agronomy_msr_days_past_due
- id: agronomy_account_maintenance
  subject:
  - agronomy_account_updated
  rule: 'A limit may be raised at the counter by no more than the programme''s one-step percentage of the existing
    limit, and only where the programme does not require a fresh review for an increase; anything larger, and every
    increase on a programme that does require it, goes to the credit department and waits for their recorded decision.
    The limit may never be raised above the programme''s ceiling at all, which is a board matter rather than a credit
    one. Terms are a property of the programme and are not rewritten on a live account; a member who needs different
    terms moves programme, which means a fresh application. Enrolled acres are rewritten on the member''s own statement
    because they are the member''s own fact, and the acres decide whether a programme rebate is earned at the end
    of the season. A perfected security interest is recorded only from the filing itself, never from the member''s
    account of it. A review is recorded when credit completes it, and an account whose review is older than the
    programme''s review interval is not suspended for that reason alone but is not given an increase until the review
    is refreshed.

    '
  eligibility:
  - id: limit_increase_authority
    applies_to:
    - agronomy_account_updated
    kind: authorization
    condition: A limit may be raised at the counter by no more than the programme's one-step percentage of the existing
      limit, and only where the programme does not require a fresh review for an increase; anything larger, and
      every increase on a programme that does require it, goes to the credit department and waits for their recorded
      decision.
    evidence_fields:
    - agronomy_accounts.credit_status
    - agronomy_accounts.credit_limit
    - agronomy_accounts.credit_review_date
    - agronomy_accounts.account_number
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - agronomy_accounts.account_number
      action_bindings:
        agronomy_accounts.account_number: account_number
  - id: account_live_for_maintenance
    applies_to:
    - agronomy_account_updated
    kind: state
    condition: Enrolled acres are rewritten on the member's own statement because they are the member's own fact,
      and the acres decide whether a programme rebate is earned at the end of the season.
    evidence_fields:
    - agronomy_accounts.status
    - agronomy_accounts.acres_enrolled
    - agronomy_accounts.account_number
    evidence_contract:
      authority: mixed
      timing: pre_action
      correlation_keys:
      - - agronomy_accounts.account_number
      action_bindings:
        agronomy_accounts.account_number: account_number
    state_contract:
      field: agronomy_accounts.status
      allowed:
      - active
      - past_due
      - suspended
  params:
    per_tier:
      Cash Purchase Account:
        one_step_pct: =credit_limit_increase_max_pct
        needs_review: =credit_limit_increase_requires_review
        ceiling_usd: =credit_limit_max_usd
        review_months: =credit_review_interval_months
      Standard 30-Day Charge Account:
        one_step_pct: =credit_limit_increase_max_pct
        needs_review: =credit_limit_increase_requires_review
        ceiling_usd: =credit_limit_max_usd
        review_months: =credit_review_interval_months
      Seasonal Terms Crop Input Account:
        one_step_pct: =credit_limit_increase_max_pct
        needs_review: =credit_limit_increase_requires_review
        ceiling_usd: =credit_limit_max_usd
        review_months: =credit_review_interval_months
      Early Pay Prepay Program Account:
        one_step_pct: =credit_limit_increase_max_pct
        needs_review: =credit_limit_increase_requires_review
        ceiling_usd: =credit_limit_max_usd
        review_months: =credit_review_interval_months
      Full Acre Input Financing Account:
        one_step_pct: =credit_limit_increase_max_pct
        needs_review: =credit_limit_increase_requires_review
        ceiling_usd: =credit_limit_max_usd
        review_months: =credit_review_interval_months
      Precision Partner Input Program Account:
        one_step_pct: =credit_limit_increase_max_pct
        needs_review: =credit_limit_increase_requires_review
        ceiling_usd: =credit_limit_max_usd
        review_months: =credit_review_interval_months
- id: agronomy_lifecycle_progression
  subject:
  - agronomy_credit_review_completed
  - agronomy_account_closed
  rule: 'An application goes to the credit department, comes back approved with a limit or declined outright, and
    only an approved account ever buys on terms. A declined application closes without ever having been active,
    and the member buys for cash; a fresh application may be made once the ground for the decline has changed, which
    is a credit matter and not a counter one. A member closes an account of their own accord only with nothing owing,
    no prepay standing unapplied and no product out on the field awaiting invoice, and the closure is theirs to
    make rather than the desk''s. Where prepay stands unapplied the account cannot close until the prepay is drawn,
    transferred where the programme allows it, or forfeited at the end of its forfeiture period. The cooperative
    closes a suspended account of its own motion by writing the balance over to the credit department, and that
    closure does not extinguish what is owed; the balance follows the member and is recovered from grain settlements
    and patronage as they arise. A closed account is terminal and is never reopened, so a member coming back needs
    a fresh application and a fresh review.

    '
  eligibility: []
  params:
    closure_requires:
    - zero_balance
    - zero_unapplied_prepay
    - no_uninvoiced_delivery
extended_policies:
- id: agronomy_ext_crop_protection_return_credit
  base_policy_refs:
  - agronomy_returns_and_credits
  overwrite:
  - base_policy: agronomy_returns_and_credits
    superseded_clause: An accepted return is credited at the price it was invoiced at, not the price of the day,
      less the programme's restocking charge as a percentage of that invoiced value.
    replaced_by: The credited value is the quantity credited multiplied by the unit price the credit is computed
      at, rounded half away from zero to two decimal places.
  trigger: state_due
  subject:
  - agronomy_credit_memo_issued
  computes: credit_amount
  target_tool: issue_return_credit_6859ca91
  params:
    lookback_months: 10
    prompt_return_days: 7
    early_return_days: 14
    restock_prompt_pct: 4.0
    restock_early_pct: 8.0
    waiver_full_service_pct: 50.0
    waiver_part_service_pct: 25.0
    waiver_none_pct: 0.0
    full_service_passes: 3
    repeat_credit_count: 3
    some_credit_count: 1
  rule: 'Crop protection product that has come back to the plant is credited to the member''s crop input account
    against the delivery it was billed on, which is the most recent crop protection line invoiced on the account.
    The quantity credited is the whole of the quantity that line billed. The unit price the credit is computed at
    is the unit price the line coming back was invoiced at. Where a drawdown against a prepay booking stands on
    the account over the ten statement months before the handling date, the unit price the credit is computed at
    is instead the price the most recent prepay booking on the account locked. Where no drawdown against a prepay
    booking stands on the account over those months and more than one crop protection delivery has been invoiced
    on the account over those months, the cooperative cannot tell which of those deliveries the product came off
    and credits the member at the dearest of them, so the unit price the credit is computed at is instead the highest
    unit price at which crop protection has ever been invoiced on the account. The credited value is the quantity
    credited multiplied by the unit price the credit is computed at, rounded half away from zero to two decimal
    places. The restocking rate is the restocking charge the programme carries. Where the delivery the product came
    off has stood out of the plant for no more than seven calendar days when the credit is worked out, counted from
    the date that delivery was invoiced as day zero to the handling date, and the member''s input spend on the account
    over the ten statement months before the handling date is at or above the programme''s volume discount threshold,
    the restocking rate is instead the prompt return rate. Where that delivery has stood out of the plant for more
    than seven but not more than fourteen calendar days when the credit is worked out, counted the same way, and
    that spend is at or above the programme''s volume discount threshold, the restocking rate is instead the early
    return rate. The waived share of the restocking charge is nil. Where the member holds a live field-services
    plan with the cooperative and three or more application passes have been completed for them over the ten statement
    months before the handling date, the waived share is instead the full-service waiver. Where the member holds
    a live field-services plan with the cooperative and fewer than three application passes have been completed
    for them over those months, the waived share is instead the part-service waiver. The restocking charge withheld
    from the credit is the credited value multiplied by the restocking rate and then reduced by the waived share
    of itself, rounded half away from zero to two decimal places once at the end of that step. Bringing product
    back across the scale and re-shelving it is charged at the rates the programme carries for the equivalent delivery
    work, because the same crew and the same scale time are used. The handling figure withheld from the credit,
    which covers bringing the product back across the scale and re-shelving it, is the programme''s split load charge.
    Where three or more credit memos already stand on the account over the ten statement months before the handling
    date, the handling figure withheld is instead the programme''s after-hours delivery charge. Where one or two
    credit memos stand on the account over those months, the handling figure withheld is instead the programme''s
    under-minimum delivery charge. The credit written against the invoice is the credited value less the restocking
    charge withheld and less the handling figure withheld, rounded half away from zero to two decimal places once
    at the end; the restocking charge and the handling figure are each taken off the credited value itself and neither
    is taken off the other. The restocking arithmetic the programme''s own returns schedule sets out — the invoiced
    value multiplied by the programme''s restocking percentage, with the credit being that value less the charge
    — is withdrawn together with the pricing clause it belongs to and is not applied to crop protection product
    worked out this way.

    '
  prerequisite: []
  cross_category:
  - category: custom
    as: history
    reads:
    - status
    - custom_workorders.event_type
    note: The waived share of the restocking charge is decided from whether the member holds a live field-services
      plan and how many application passes the cooperative has completed for them.
  compute:
  - line_qty: LATEST('agronomy_invoices','quantity', date_field='invoice_date', event_type='agronomy_invoice_issued',
      product_category='crop_protection')
  - line_price: LATEST('agronomy_invoices','unit_price', date_field='invoice_date', event_type='agronomy_invoice_issued',
      product_category='crop_protection')
  - line_date: LATEST('agronomy_invoices','invoice_date', date_field='invoice_date', event_type='agronomy_invoice_issued',
      product_category='crop_protection')
  - prepay_drawdowns: COUNT('agronomy_invoices', within_months=K('lookback_months'), date_field='posted_date', event_type='agronomy_prepay_applied')
  - booking_price: LATEST('agronomy_invoices','unit_price', date_field='posted_date', event_type='agronomy_prepay_booked')
  - cp_deliveries: COUNT('agronomy_invoices', within_months=K('lookback_months'), date_field='invoice_date', event_type='agronomy_invoice_issued',
      product_category='crop_protection')
  - cp_top_price: MAX('agronomy_invoices','unit_price', event_type='agronomy_invoice_issued', product_category='crop_protection')
  - credit_unit_price: booking_price if prepay_drawdowns >= 1 else (cp_top_price if (prepay_drawdowns < 1 and cp_deliveries
      > 1) else line_price)
  - credited_value: RND(line_qty * credit_unit_price, 2)
  - days_back: DAYS(line_date, NOW)
  - season_spend: SUM('agronomy_invoices','amount', within_months=K('lookback_months'), date_field='invoice_date',
      event_type='agronomy_invoice_issued')
  - restock_pct: K('restock_prompt_pct') if (days_back <= K('prompt_return_days') and season_spend >= P('volume_discount_threshold_usd'))
      else (K('restock_early_pct') if (days_back <= K('early_return_days') and season_spend >= P('volume_discount_threshold_usd'))
      else P('restocking_fee_pct'))
  - holds_field_plan: EXISTS('custom', status='active')
  - plan_passes: XCOUNT('custom','custom_workorders', within_months=K('lookback_months'), date_field='work_date',
      event_type='custom_application_completed')
  - waived_share_pct: K('waiver_full_service_pct') if (holds_field_plan and plan_passes >= K('full_service_passes'))
      else (K('waiver_part_service_pct') if (holds_field_plan and plan_passes < K('full_service_passes')) else K('waiver_none_pct'))
  - restock_charge: RND(credited_value * restock_pct / 100 * (1 - waived_share_pct / 100), 2)
  - prior_credits: COUNT('agronomy_invoices', within_months=K('lookback_months'), date_field='posted_date', event_type='agronomy_credit_memo_issued')
  - handling_charge: P('after_hours_delivery_fee_usd') if prior_credits >= K('repeat_credit_count') else (P('delivery_minimum_charge_usd')
      if prior_credits >= K('some_credit_count') else P('split_load_fee_usd'))
  - result: RND(credited_value - restock_charge - handling_charge, 2)
  compute_basis:
    line_qty: The quantity credited is the whole of the quantity that line billed.
    line_price: The unit price the credit is computed at is the unit price the line coming back was invoiced at.
    line_date: Crop protection product that has come back to the plant is credited to the member's crop input account
      against the delivery it was billed on, which is the most recent crop protection line invoiced on the account.
    prepay_drawdowns: Where a drawdown against a prepay booking stands on the account over the ten statement months
      before the handling date, the unit price the credit is computed at is instead the price the most recent prepay
      booking on the account locked.
    booking_price: Where a drawdown against a prepay booking stands on the account over the ten statement months
      before the handling date, the unit price the credit is computed at is instead the price the most recent prepay
      booking on the account locked.
    cp_deliveries: Where no drawdown against a prepay booking stands on the account over those months and more than
      one crop protection delivery has been invoiced on the account over those months, the cooperative cannot tell
      which of those deliveries the product came off and credits the member at the dearest of them, so the unit
      price the credit is computed at is instead the highest unit price at which crop protection has ever been invoiced
      on the account.
    cp_top_price: Where no drawdown against a prepay booking stands on the account over those months and more than
      one crop protection delivery has been invoiced on the account over those months, the cooperative cannot tell
      which of those deliveries the product came off and credits the member at the dearest of them, so the unit
      price the credit is computed at is instead the highest unit price at which crop protection has ever been invoiced
      on the account.
    credit_unit_price: The unit price the credit is computed at is the unit price the line coming back was invoiced
      at. Where a drawdown against a prepay booking stands on the account over the ten statement months before the
      handling date, the unit price the credit is computed at is instead the price the most recent prepay booking
      on the account locked. Where no drawdown against a prepay booking stands on the account over those months
      and more than one crop protection delivery has been invoiced on the account over those months, the cooperative
      cannot tell which of those deliveries the product came off and credits the member at the dearest of them,
      so the unit price the credit is computed at is instead the highest unit price at which crop protection has
      ever been invoiced on the account.
    credited_value: The credited value is the quantity credited multiplied by the unit price the credit is computed
      at, rounded half away from zero to two decimal places.
    days_back: Where the delivery the product came off has stood out of the plant for no more than seven calendar
      days when the credit is worked out, counted from the date that delivery was invoiced as day zero to the handling
      date, and the member's input spend on the account over the ten statement months before the handling date is
      at or above the programme's volume discount threshold, the restocking rate is instead the prompt return rate.
    season_spend: Where the delivery the product came off has stood out of the plant for no more than seven calendar
      days when the credit is worked out, counted from the date that delivery was invoiced as day zero to the handling
      date, and the member's input spend on the account over the ten statement months before the handling date is
      at or above the programme's volume discount threshold, the restocking rate is instead the prompt return rate.
    restock_pct: The restocking rate is the restocking charge the programme carries. Where the delivery the product
      came off has stood out of the plant for no more than seven calendar days when the credit is worked out, counted
      from the date that delivery was invoiced as day zero to the handling date, and the member's input spend on
      the account over the ten statement months before the handling date is at or above the programme's volume discount
      threshold, the restocking rate is instead the prompt return rate. Where that delivery has stood out of the
      plant for more than seven but not more than fourteen calendar days when the credit is worked out, counted
      the same way, and that spend is at or above the programme's volume discount threshold, the restocking rate
      is instead the early return rate.
    holds_field_plan: Where the member holds a live field-services plan with the cooperative and three or more application
      passes have been completed for them over the ten statement months before the handling date, the waived share
      is instead the full-service waiver.
    plan_passes: Where the member holds a live field-services plan with the cooperative and three or more application
      passes have been completed for them over the ten statement months before the handling date, the waived share
      is instead the full-service waiver.
    waived_share_pct: The waived share of the restocking charge is nil. Where the member holds a live field-services
      plan with the cooperative and three or more application passes have been completed for them over the ten statement
      months before the handling date, the waived share is instead the full-service waiver. Where the member holds
      a live field-services plan with the cooperative and fewer than three application passes have been completed
      for them over those months, the waived share is instead the part-service waiver.
    restock_charge: The restocking charge withheld from the credit is the credited value multiplied by the restocking
      rate and then reduced by the waived share of itself, rounded half away from zero to two decimal places once
      at the end of that step.
    prior_credits: Where three or more credit memos already stand on the account over the ten statement months before
      the handling date, the handling figure withheld is instead the programme's after-hours delivery charge.
    handling_charge: Bringing product back across the scale and re-shelving it is charged at the rates the programme
      carries for the equivalent delivery work, because the same crew and the same scale time are used. The handling
      figure withheld from the credit, which covers bringing the product back across the scale and re-shelving it,
      is the programme's split load charge. Where three or more credit memos already stand on the account over the
      ten statement months before the handling date, the handling figure withheld is instead the programme's after-hours
      delivery charge. Where one or two credit memos stand on the account over those months, the handling figure
      withheld is instead the programme's under-minimum delivery charge.
    result: The credit written against the invoice is the credited value less the restocking charge withheld and
      less the handling figure withheld, rounded half away from zero to two decimal places once at the end; the
      restocking charge and the handling figure are each taken off the credited value itself and neither is taken
      off the other.
  factors:
  - id: restocking_rate
    effect: parameter
    decides: restock_pct
    bindings:
    - days_back
    - season_spend
    - restock_pct
    ladder:
    - when: the delivery the product came off has stood out of the plant for no more than seven calendar days when
        the credit is worked out, counted from the date that delivery was invoiced as day zero to the handling date,
        and the member's input spend on the account over the ten statement months before the handling date is at
        or above the programme's volume discount threshold
      value: K('restock_prompt_pct')
    - when: that delivery has stood out of the plant for more than seven but not more than fourteen calendar days
        when the credit is worked out, counted the same way, and that spend is at or above the programme's volume
        discount threshold
      value: K('restock_early_pct')
    - when: otherwise
      value: P('restocking_fee_pct')
    baseline:
      restock_pct: P('restocking_fee_pct')
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: credit_pricing_basis
    effect: method
    decides: credit_unit_price
    bindings:
    - prepay_drawdowns
    - booking_price
    - cp_deliveries
    - cp_top_price
    - credit_unit_price
    ladder:
    - when: a drawdown against a prepay booking stands on the account over the ten statement months before the handling
        date
      method: the credit is computed at the price the most recent prepay booking on the account locked
    - when: no drawdown against a prepay booking stands on the account over those months and more than one crop
        protection delivery has been invoiced on the account over those months
      method: the cooperative cannot tell which of those deliveries the product came off and credits the member
        at the dearest of them, so the credit is computed at the highest unit price at which crop protection has
        ever been invoiced on the account
    - when: otherwise
      method: the credit is computed at the unit price the line coming back was invoiced at
    baseline:
      credit_unit_price: line_price
    evidence:
    - history
    cross_difficulty: null
  - id: return_handling_figure
    effect: parameter
    decides: handling_charge
    bindings:
    - prior_credits
    - handling_charge
    ladder:
    - when: three or more credit memos already stand on the account over the ten statement months before the handling
        date
      value: P('after_hours_delivery_fee_usd')
    - when: one or two credit memos stand on the account over those months
      value: P('delivery_minimum_charge_usd')
    - when: otherwise
      value: P('split_load_fee_usd')
    baseline:
      handling_charge: P('split_load_fee_usd')
    evidence:
    - history
    cross_difficulty: null
  - id: field_service_restocking_waiver
    effect: parameter
    decides: waived_share_pct
    bindings:
    - holds_field_plan
    - plan_passes
    - waived_share_pct
    ladder:
    - when: the member holds a live field-services plan with the cooperative and three or more application passes
        have been completed for them over the ten statement months before the handling date
      value: K('waiver_full_service_pct')
    - when: the member holds a live field-services plan with the cooperative and fewer than three application passes
        have been completed for them over those months
      value: K('waiver_part_service_pct')
    - when: otherwise
      value: K('waiver_none_pct')
    baseline:
      waived_share_pct: K('waiver_none_pct')
    evidence:
    - cross_category
    - history
    cross_difficulty: custom
  baseline:
    rule: 'Crop protection product that has come back to the plant is credited to the member''s crop input account
      against the delivery it was billed on, which is the most recent crop protection line invoiced on the account.
      The quantity credited is the whole of the quantity that line billed. The unit price the credit is computed
      at is the unit price the line coming back was invoiced at. The credited value is the quantity credited multiplied
      by the unit price the credit is computed at, rounded half away from zero to two decimal places. The restocking
      rate is the restocking charge the programme carries. The waived share of the restocking charge is nil. The
      restocking charge withheld from the credit is the credited value multiplied by the restocking rate and then
      reduced by the waived share of itself, rounded half away from zero to two decimal places once at the end of
      that step. Bringing product back across the scale and re-shelving it is charged at the rates the programme
      carries for the equivalent delivery work, because the same crew and the same scale time are used. The handling
      figure withheld from the credit, which covers bringing the product back across the scale and re-shelving it,
      is the programme''s split load charge. The credit written against the invoice is the credited value less the
      restocking charge withheld and less the handling figure withheld, rounded half away from zero to two decimal
      places once at the end; the restocking charge and the handling figure are each taken off the credited value
      itself and neither is taken off the other.

      '
