    - table: agronomy_invoices
      aggregate: count
      field: amount
      within_months: 14
      filters:
        event_type: agronomy_payment_posted
    - category: grain
      table: grain_ledger
      aggregate: sum
      field: net_bushels
      within_months: 14
      filters:
        event_type: grain_delivery_applied
    cross_category:
    - grain
- id: agronomy_ext_prepay_booking_ceiling
  base_policy_refs:
  - agronomy_prepay_program
  - agronomy_evt_invoicing
  overwrite:
  - base_policy: agronomy_prepay_program
    superseded_clause: A booking must reach the programme's minimum, and the member may book no more than the programme's
      ceiling as a share of their input spend in the crop year immediately before the current one, because prepay
      is a buying commitment and not a deposit account.
    replaced_by: The booking taken is the gross ceiling less the share counted against it of the prepay already
      standing to the member's credit, that share being rounded half away from zero to two decimal places before
      it is taken off, and where the remainder falls under the programme's minimum booking the minimum booking is
      taken instead; the result is rounded half away from zero to two decimal places once at the end.
  - base_policy: agronomy_prepay_program
    superseded_clause: The booking locks the price of the product it names, so the line drawn against it prices
      at the booked price however the list has moved by delivery.
    replaced_by: A booking taken that way is a money commitment against the product the request names and carries
      no booked unit price of its own, so a delivery drawn against a booking that carries no booked unit price is
      priced at the list in force on the day it leaves the plant, while a delivery drawn against a booking that
      does carry one is priced at that booked price.
  - base_policy: agronomy_evt_invoicing
    superseded_clause: except where the line draws against a prepay booking, which prices at the booked price however
      the list has moved
    replaced_by: A booking taken that way is a money commitment against the product the request names and carries
      no booked unit price of its own, so a delivery drawn against a booking that carries no booked unit price is
      priced at the list in force on the day it leaves the plant, while a delivery drawn against a booking that
      does carry one is priced at that booked price.
  trigger: on_request
  subject:
  - agronomy_prepay_booked
  computes: booking_amount
  target_tool: book_prepay_commitment_189dfe27
  params:
    season_months: 14
    two_season_months: 26
    settled_account_months: 36
    steady_delivery_count: 8
    ceiling_secured_pct: 120.0
    ceiling_partial_pct: 105.0
    arrears_cut_light_pct: 10.0
    arrears_cut_heavy_pct: 25.0
    arrears_cut_none_pct: 0.0
    offset_transferable_pct: 100.0
    offset_named_pct: 50.0
    offset_none_pct: 0.0
  rule: 'A prepay booking taken against a signed request the member has lodged is taken at the ceiling the programme
    will carry where the member has asked for more than that, and the member books it in their own name. A booking
    taken that way is a money commitment against the product the request names and carries no booked unit price
    of its own, so a delivery drawn against a booking that carries no booked unit price is priced at the list in
    force on the day it leaves the plant, while a delivery drawn against a booking that does carry one is priced
    at that booked price. The prior season spend the ceiling is measured on is everything invoiced to the account
    over the fourteen statement months before the handling date, less every discount granted on the account as a
    discount line of its own, which is an early pay, volume, prepay or programme rebate discount and never the restocking
    charge withheld inside a credit memo, rounded half away from zero to two decimal places. Where the account has
    been open for at least thirty-six whole months, counted from the date it was opened to the handling date and
    the acres enrolled on it are at or above the programme''s rebate threshold in acres, the prior season spend
    is instead half of everything invoiced to the account over the twenty-six statement months before the handling
    date, less every discount granted on the account as a discount line of its own, which is an early pay, volume,
    prepay or programme rebate discount and never the restocking charge withheld inside a credit memo, rounded half
    away from zero to two decimal places, which is the average of the two crop years just closed. Where the account
    has been open for at least thirty-six whole months, counted from the date it was opened to the handling date
    and the acres enrolled on it are below that threshold, the prior season spend is instead the lesser of those
    two measures, less every discount granted on the account as a discount line of its own, which is an early pay,
    volume, prepay or programme rebate discount and never the restocking charge withheld inside a credit memo, rounded
    half away from zero to two decimal places. The money the cooperative will take on a prepay booking is fixed
    only after the account''s ledger carries the volume discount earned on the input spend of the crop year just
    closed. The ceiling share is the share of the prior season spend the programme will carry as prepay. Where a
    perfected security interest covering the growing crop is recorded on the account and eight or more deliveries
    were invoiced to it over the fourteen statement months before the handling date, the ceiling share is instead
    the secured buying share. Where such an interest is recorded on the account and fewer than eight deliveries
    were invoiced to it over those months, the ceiling share is instead the partial buying share. The reduction
    taken off the ceiling share for arrears on the account is nil. Where a service charge stands assessed on the
    account over those fourteen months and a payment has also been posted to it over those months, the reduction
    taken off the ceiling share is instead the light arrears cut. Where a service charge stands assessed on the
    account over those months and no payment has been posted to it over those months, the reduction taken off the
    ceiling share is instead the heavy arrears cut. The gross ceiling is the prior season spend multiplied by the
    ceiling share less the reduction taken off it, that difference being taken as nil where it would fall below
    nil, and the product rounded half away from zero to two decimal places. The share of the prepay already standing
    to the member''s credit on the account that is counted against the gross ceiling is nil. Where prepay stands
    unapplied on the account and the programme allows prepay booked against one input class to be drawn against
    another, the share counted against the gross ceiling is instead the whole of it. Where prepay stands unapplied
    on the account and the programme does not allow that, the share counted against the gross ceiling is instead
    half of it. The booking taken is the gross ceiling less the share counted against it of the prepay already standing
    to the member''s credit, that share being rounded half away from zero to two decimal places before it is taken
    off, and where the remainder falls under the programme''s minimum booking the minimum booking is taken instead;
    the result is rounded half away from zero to two decimal places once at the end.

    '
  prerequisite:
  - problem: agronomy_ext_season_volume_discount
    kind: value_input
    gate: prior_net_spend
    form: state
    policy_source: The money the cooperative will take on a prepay booking is fixed only after the account's ledger
      carries the volume discount earned on the input spend of the crop year just closed.
    condition: The account's ledger carries the volume discount earned on the input spend of the crop year just
      closed, so that the spend the ceiling is measured on is already net of it.
    resolved_by: grant_season_volume_discount_cc5ed557
    effect: The prior season spend binding falls by the volume discount written on the account, and the ceiling
      falls with it.
  cross_category: []
  compute:
  - open_months: MONTHS(F('opened_date'), NOW)
  - spend_recent: SUM('agronomy_invoices','amount', within_months=K('season_months'), date_field='invoice_date',
      event_type='agronomy_invoice_issued')
  - spend_two_season: SUM('agronomy_invoices','amount', within_months=K('two_season_months'), date_field='invoice_date',
      event_type='agronomy_invoice_issued')
  - discounts_standing: SUM('agronomy_invoices','amount', event_type='agronomy_discount_granted')
  - prior_net_spend: RND(spend_two_season / 2 + discounts_standing, 2) if (open_months >= K('settled_account_months')
      and F('acres_enrolled') >= P('program_rebate_threshold_acres')) else (RND(MN(spend_recent, spend_two_season
      / 2) + discounts_standing, 2) if (open_months >= K('settled_account_months') and F('acres_enrolled') < P('program_rebate_threshold_acres'))
      else RND(spend_recent + discounts_standing, 2))
  - deliveries_count: COUNT('agronomy_invoices', within_months=K('season_months'), date_field='invoice_date', event_type='agronomy_invoice_issued')
  - ceiling_share_pct: K('ceiling_secured_pct') if (F('lien_on_file') == True and deliveries_count >= K('steady_delivery_count'))
      else (K('ceiling_partial_pct') if (F('lien_on_file') == True and deliveries_count < K('steady_delivery_count'))
      else P('prepay_maximum_pct_of_prior_year'))
  - charges_count: COUNT('agronomy_invoices', within_months=K('season_months'), date_field='posted_date', event_type='agronomy_finance_charge_assessed')
  - payments_count: COUNT('agronomy_invoices', within_months=K('season_months'), date_field='posted_date', event_type='agronomy_payment_posted')
  - arrears_cut_pct: K('arrears_cut_light_pct') if (charges_count >= 1 and payments_count >= 1) else (K('arrears_cut_heavy_pct')
      if (charges_count >= 1 and payments_count < 1) else K('arrears_cut_none_pct'))
  - net_share_pct: MX(0, ceiling_share_pct - arrears_cut_pct)
  - gross_ceiling: RND(prior_net_spend * net_share_pct / 100, 2)
  - prepay_taken: SUM('agronomy_invoices','amount', event_type='agronomy_prepay_booked')
  - prepay_drawn: SUM('agronomy_invoices','amount', event_type='agronomy_prepay_applied')
  - prepay_standing: RND(prepay_taken + prepay_drawn, 2)
  - offset_share_pct: K('offset_transferable_pct') if (prepay_standing > 0 and P('prepay_transferable_between_categories')
      == True) else (K('offset_named_pct') if (prepay_standing > 0 and P('prepay_transferable_between_categories')
      == False) else K('offset_none_pct'))
  - result: RND(MX(P('prepay_minimum_usd'), gross_ceiling - RND(prepay_standing * offset_share_pct / 100, 2)), 2)
  compute_basis:
    open_months: Where the account has been open for at least thirty-six whole months, counted from the date it
