  - id: energy_ext_closure_settlement
    base_policy_refs: [energy_lifecycle_progression]
    overwrite:
      - base_policy: energy_lifecycle_progression
        superseded_clause: >-
          A member closes an account of their own accord with nothing owing, no contracted gallons standing undrawn
          and no budget plan in mid-year; where contracted gallons stand undrawn they are dealt with under the
          programme's unused gallons treatment before the account can close.
        replaced_by: >-
          A member closes an account of their own accord whatever stands on it, and the balance the account closes
          at is written onto the account as what is owed and follows the member rather than being extinguished.
    trigger: on_request
    subject: [energy_account_closed]
    computes: closing_balance_usd
    target_tool: close_energy_account_7515982f
    params:
      cleared_credit_relief_pct: 0.45
      part_credit_relief_pct: 0.20
      stale_payment_months: 2
      settled_years_d: 10
      long_member_closing_allowance_usd: 90.00
      short_member_closing_allowance_usd: 45.00
    rule: >
      The balance an energy account closes at is everything the account still carries on the day it is closed. A
      member closes an account of their own accord whatever stands on it, and the balance the account closes at is
      written onto the account as what is owed and follows the member rather than being extinguished. The
      amount standing on the account is the fuel billed and the fees billed, less the payments posted, plus the
      money committed on the bookings the account carries, less the money applied against those bookings,
      whether on a fill drawn against them or on a release of gallons standing undrawn, rounded to two decimal
      places. The rate the closing balance bears is
      the programme's monthly service charge. The base the closing charge is worked out on is the amount standing
      on the account. The closing charge runs for one month. The closing allowance is nothing. The closing charge
      is the base at the rate the closing balance bears for the months the closing charge runs, rounded to two
      decimal places. The balance the account closes at is the amount standing plus the closing charge less the
      closing allowance, rounded to two decimal places, and never falls below nothing. The balance the account
      closes at is fixed only after the account carries, for every signed pre-buy request the energy desk holds
      registered against it, the money applied against a booking when gallons standing undrawn were released.
      Where the balance carried on the member's crop input account stands at or under the ceiling approved on it
      and the credit department's standing decision on that account is an approval, the rate the closing balance
      bears is the programme's monthly service charge less the cleared credit relief. Where that balance stands at
      or under the ceiling approved on it and that standing decision is not an approval, the rate the closing
      balance bears is the programme's monthly service charge less the part credit relief. Where that balance
      stands above the ceiling approved on it, the rate the closing balance bears is the programme's monthly
      service charge.
      Where money has been applied against a booking on the account and money stands committed on the bookings the
      account carries, the base the closing charge is worked out on is the fuel billed and the fees billed less the
      payments posted, the booking's own money being left out of it. Where money has been applied against a booking
      and no money stands committed on the bookings the account carries, the base the closing charge is worked out
      on is the amount standing on the account with the money applied against the booking added back. Where no
      money has been applied against a booking on the account, the base the closing charge is worked out on is the
      amount standing on the account.
      Where the account was last paid at least the stale payment months ago and one or more stops were billed on it
      in the three months ending on the handling date, the closing charge runs for the whole months since the
      account was last paid. Where the account was last paid at least the stale payment months ago and no stop was
      billed on it in that window, the closing charge runs for the whole months since the account was last paid
      together with the month the account closes in. Where the account was last paid more recently than the stale payment months, the closing
      charge runs for one month.
      Where the account has stood open for at least the settled years and the gallons taken on it over the twelve
      months ending on the handling date reach the programme's minimum annual gallons, the closing allowance is the
      long member closing allowance. Where the account has stood open for at least the settled years and those
      gallons fall under the programme's minimum annual gallons, the closing allowance is the short member closing
      allowance. Where the account has stood open for fewer than the settled years, the closing allowance is
      nothing.
    prerequisite:
      - problem: energy_ext_undrawn_gallons_disposition
        kind: value_input
        gate: amount_standing_d
        form: state
        policy_source: >-
          The balance the account closes at is fixed only after the account carries, for every signed pre-buy
          request the energy desk holds registered against it, the money applied against a booking when gallons
          standing undrawn were released.
        condition: >-
          Every signed pre-buy request the energy desk holds registered against the account is answered by an entry
          on the account for the money applied against a booking when gallons standing undrawn were released.
        resolved_by: settle_undrawn_contract_gallons_1dbcf678
        effect: >-
          The money applied against the bookings rises by the settlement entry, so the amount standing on the
          account, and the balance the account closes at with it, fall by that money.
    cross_category:
      - category: agronomy
        as: branch
        reads: [current_balance, credit_limit, credit_status]
        note: the balance carried on the member's crop input account, the ceiling approved on it and the credit department's standing decision on it decide which tier of the rate the closing balance bears applies
    compute:
      - fuel_billed_d: "SUM('energy_deliveries','amount', date_field='posted_date', event_type='energy_delivery_made')"
      - fees_billed_d: "SUM('energy_deliveries','amount', date_field='posted_date', event_type='energy_fee_charged')"
      - payments_d: "SUM('energy_deliveries','amount', date_field='posted_date', event_type='energy_payment_posted')"
      - commitment_d: "SUM('energy_deliveries','amount', date_field='posted_date', event_type='energy_contract_gallons_booked')"
      - released_d: "SUM('energy_deliveries','amount', date_field='posted_date', event_type='energy_contract_gallons_drawn')"
      - amount_standing_d: "RND(fuel_billed_d + fees_billed_d + payments_d + commitment_d - released_d, 2)"
      - input_balance: "float(CFIELD('agronomy','current_balance') or 0)"
      - closing_rate: "(P('finance_charge_monthly_pct') - K('cleared_credit_relief_pct') if (input_balance <= float(CFIELD('agronomy','credit_limit') or 0) and CFIELD('agronomy','credit_status') == 'approved') else (P('finance_charge_monthly_pct') - K('part_credit_relief_pct') if (input_balance <= float(CFIELD('agronomy','credit_limit') or 0) and CFIELD('agronomy','credit_status') != 'approved') else P('finance_charge_monthly_pct')))"
      - released_count_d: "COUNT('energy_deliveries', date_field='delivery_date', event_type='energy_contract_gallons_drawn')"
      - charge_base: "(RND(fuel_billed_d + fees_billed_d + payments_d, 2) if (released_count_d >= 1 and commitment_d > 0) else (RND(amount_standing_d + released_d, 2) if (released_count_d >= 1 and commitment_d <= 0) else amount_standing_d))"
      - stops_3m_d: "COUNT('energy_deliveries', within_months=3, date_field='delivery_date', event_type='energy_delivery_made')"
      - months_since_paid: "MX(0, MONTHS(LATEST('energy_deliveries','delivery_date', date_field='delivery_date', event_type='energy_payment_posted'), NOW))"
      - closing_months: "(months_since_paid if (months_since_paid >= K('stale_payment_months') and stops_3m_d >= 1) else (months_since_paid + 1 if (months_since_paid >= K('stale_payment_months') and stops_3m_d < 1) else 1))"
      - account_years_d: "DAYS(F('opened_date'), NOW) / 365.0"
      - gallons_12m_d: "SUM('energy_deliveries','gallons', within_months=12, date_field='delivery_date', event_type='energy_delivery_made')"
      - closing_allowance: "(K('long_member_closing_allowance_usd') if (account_years_d >= K('settled_years_d') and gallons_12m_d >= P('minimum_annual_gallons')) else (K('short_member_closing_allowance_usd') if (account_years_d >= K('settled_years_d') and gallons_12m_d < P('minimum_annual_gallons')) else 0.0))"
      - closing_charge: "RND(MX(0.0, charge_base) * closing_rate / 100.0 * closing_months, 2)"
      - result: "RND(MX(0.0, amount_standing_d + closing_charge - closing_allowance), 2)"
    compute_basis:
      fuel_billed_d: "The amount standing on the account is the fuel billed and the fees billed, less the payments posted, plus the money committed on the bookings the account carries, less the money applied against those bookings, whether on a fill drawn against them or on a release of gallons standing undrawn, rounded to two decimal places."
      fees_billed_d: "The amount standing on the account is the fuel billed and the fees billed, less the payments posted, plus the money committed on the bookings the account carries, less the money applied against those bookings, whether on a fill drawn against them or on a release of gallons standing undrawn, rounded to two decimal places."
      payments_d: "The amount standing on the account is the fuel billed and the fees billed, less the payments posted, plus the money committed on the bookings the account carries, less the money applied against those bookings, whether on a fill drawn against them or on a release of gallons standing undrawn, rounded to two decimal places."
      commitment_d: "The amount standing on the account is the fuel billed and the fees billed, less the payments posted, plus the money committed on the bookings the account carries, less the money applied against those bookings, whether on a fill drawn against them or on a release of gallons standing undrawn, rounded to two decimal places."
      released_d: "The amount standing on the account is the fuel billed and the fees billed, less the payments posted, plus the money committed on the bookings the account carries, less the money applied against those bookings, whether on a fill drawn against them or on a release of gallons standing undrawn, rounded to two decimal places."
      amount_standing_d: "The balance the account closes at is the amount standing plus the closing charge less the closing allowance, rounded to two decimal places, and never falls below nothing."
      input_balance: "Where the balance carried on the member's crop input account stands at or under the ceiling approved on it and the credit department's standing decision on that account is an approval, the rate the closing balance bears is the programme's monthly service charge less the cleared credit relief."
      closing_rate: "Where that balance stands at or under the ceiling approved on it and that standing decision is not an approval, the rate the closing balance bears is the programme's monthly service charge less the part credit relief. Where that balance stands above the ceiling approved on it, the rate the closing balance bears is the programme's monthly service charge."
      released_count_d: "Where money has been applied against a booking on the account and money stands committed on the bookings the account carries, the base the closing charge is worked out on is the fuel billed and the fees billed less the payments posted, the booking's own money being left out of it."
      charge_base: "Where money has been applied against a booking and no money stands committed on the bookings the account carries, the base the closing charge is worked out on is the amount standing on the account with the money applied against the booking added back. Where no money has been applied against a booking on the account, the base the closing charge is worked out on is the amount standing on the account."
      stops_3m_d: "Where the account was last paid at least the stale payment months ago and one or more stops were billed on it in the three months ending on the handling date, the closing charge runs for the whole months since the account was last paid."
      months_since_paid: "Where the account was last paid at least the stale payment months ago and no stop was billed on it in that window, the closing charge runs for the whole months since the account was last paid together with the month the account closes in."
      closing_months: "Where the account was last paid more recently than the stale payment months, the closing charge runs for one month."
      account_years_d: "Where the account has stood open for at least the settled years and the gallons taken on it over the twelve months ending on the handling date reach the programme's minimum annual gallons, the closing allowance is the long member closing allowance."
      gallons_12m_d: "Where the account has stood open for at least the settled years and those gallons fall under the programme's minimum annual gallons, the closing allowance is the short member closing allowance."
      closing_allowance: "Where the account has stood open for fewer than the settled years, the closing allowance is nothing."
      closing_charge: "The closing charge is the base at the rate the closing balance bears for the months the closing charge runs, rounded to two decimal places."
      result: "The balance the account closes at is the amount standing plus the closing charge less the closing allowance, rounded to two decimal places, and never falls below nothing."
    factors:
      - id: closing_service_rate
        effect: parameter
        decides: closing_rate
        bindings: [input_balance, closing_rate]
        ladder:
          - when: "the balance carried on the member's crop input account stands at or under the ceiling approved on it and the credit department's standing decision on that account is an approval"
            value: "the programme's monthly service charge less the cleared credit relief"
          - when: "that balance stands at or under the ceiling approved on it and that standing decision is not an approval"
            value: "the programme's monthly service charge less the part credit relief"
          - when: "that balance stands above the ceiling approved on it"
            value: "the programme's monthly service charge"
        baseline:
          closing_rate: "P('finance_charge_monthly_pct')"
        evidence: [cross_category]
        cross_difficulty: agronomy
      - id: closing_charge_base
        effect: method
        decides: charge_base
        bindings: [released_count_d, charge_base]
        ladder:
          - when: "money has been applied against a booking on the account and money stands committed on the bookings the account carries"
            method: "the base the closing charge is worked out on is the fuel billed and the fees billed less the payments posted, the booking's own money being left out of it"
          - when: "money has been applied against a booking and no money stands committed on the bookings the account carries"
            method: "the base the closing charge is worked out on is the amount standing on the account with the money applied against the booking added back"
          - when: "no money has been applied against a booking on the account"
            method: "the base the closing charge is worked out on is the amount standing on the account"
        baseline:
          charge_base: "amount_standing_d"
        evidence: [history]
        cross_difficulty: null
      - id: closing_month_count
        effect: method
        decides: closing_months
        bindings: [stops_3m_d, months_since_paid, closing_months]
        ladder:
          - when: "the account was last paid at least the stale payment months ago and one or more stops were billed on it in the three months ending on the handling date"
            method: "the closing charge runs for the whole months since the account was last paid"
          - when: "the account was last paid at least the stale payment months ago and no stop was billed on it in that window"
            method: "the closing charge runs for the whole months since the account was last paid together with the month the account closes in"
          - when: "the account was last paid more recently than the stale payment months"
            method: "the closing charge runs for one month"
        baseline:
          closing_months: "1"
        evidence: [history, date]
        cross_difficulty: null
      - id: closing_member_allowance
        effect: parameter
        decides: closing_allowance
        bindings: [account_years_d, gallons_12m_d, closing_allowance]
        ladder:
          - when: "the account has stood open for at least the settled years and the gallons taken on it over the twelve months ending on the handling date reach the programme's minimum annual gallons"
            value: "the long member closing allowance"
          - when: "the account has stood open for at least the settled years and those gallons fall under the programme's minimum annual gallons"
            value: "the short member closing allowance"
          - when: "the account has stood open for fewer than the settled years"
