            method: "the settlement price is the mean of the contracted price of record and the posted price of the day, carried to four decimal places"
          - when: "those gallons reach twice the programme's minimum pre-buy gallons and no will-call stop was billed in that window"
            method: "the settlement price is the contracted price of record standing on the account"
          - when: "those gallons fall under twice the programme's minimum pre-buy gallons"
            method: "the settlement price is the contracted price of record standing on the account or the posted price of the day, whichever is the lower"
        baseline:
          settlement_price: "MN(float(F('contract_price_per_gallon')), posted_of_day)"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: cancellation_charge_relief
        effect: parameter
        decides: cancellation_rate
        bindings: [gallons_12m_e, cancellation_rate]
        ladder:
          - when: "the gallons taken on the account over the twelve months ending on the handling date reach the programme's minimum annual gallons and the credit department's standing decision on the member's crop input account is an approval"
            value: "the programme's cancellation charge less the active member relief"
          - when: "those gallons reach the programme's minimum annual gallons and that standing decision is not an approval"
            value: "the programme's cancellation charge less the part member relief"
          - when: "those gallons fall under the programme's minimum annual gallons"
