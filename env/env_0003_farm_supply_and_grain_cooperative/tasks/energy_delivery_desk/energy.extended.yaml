  - id: energy_ext_prebuy_booking_credit
    base_policy_refs: [energy_contract_gallons_program]
    overwrite:
      - base_policy: energy_contract_gallons_program
        superseded_clause: >-
          A booking must reach the programme's minimum gallons and may not exceed the programme's ceiling as a share
          of the gallons the member took in the previous twelve months, because pre-buy is a commitment to use fuel
          and not a position in the market.
        replaced_by: >-
          The gallons credited on a signed request are the gallons requested or the account's booking ceiling,
          whichever is the fewer, cut to the share the request's standing allows and then rounded as the lot rule
          says.
    trigger: state_due
    subject: [energy_contract_gallons_booked]
    computes: booked_gallons
    target_tool: lodge_contract_gallon_booking_8fcb503b
    params:
      prior_window_months: 12
      long_prior_window_months: 24
      short_prior_window_months: 6
      active_stop_count: 3
      input_spend_usd: 60000
      acre_ceiling_uplift_pct: 8.0
      ceiling_reduction_pct: 15.0
      harvest_gallons: 1500
      large_tank_gallons: 1500
      harvest_allowance_gallons: 100
      small_harvest_allowance_gallons: 40
      stale_request_months: 9
      stale_request_share: 0.9
      lapsed_request_share: 0.5
      lot_gallons: 100
      half_lot_gallons: 50
    rule: >
      A signed pre-buy request registered with the energy desk is put to the member's credit as booked gallons. The
      price the booked gallons are credited at is the price billed on the most recent will-call stop on
      or before the day the signed request was registered. A will-call stop is one the records show the member called in, and not one run to the automatic keep-full schedule, run as an emergency, run after hours or made to fill against a booking. The account's prior use is counted over the twelve
      months ending on the handling date. The prior use is the
      gallons taken on the account over that window as they stand. The account's booking ceiling is the prior use
      at the programme's ceiling share, rounded to one decimal place, plus the seasonal allowance. The programme's
      ceiling share applies. The seasonal allowance is nothing. The share the request's standing allows is the
      whole of it. The gallons credited on a signed request are the gallons requested or the account's booking
      ceiling, whichever is the fewer, cut to the share the request's standing allows and then rounded as the lot
      rule says. The lot rule leaves the gallons unrounded.
      Where three or more stops were made on the account in the twelve months ending on the handling date and the
      tank stands on the automatic keep-full schedule, the account's prior use is counted over the long window of
      months ending on the handling date. Where three or more stops were made in that window and the tank does not
      stand on the automatic keep-full schedule, the account's prior use is counted over the short window of months
      ending on the handling date. Where fewer than three stops were made in that window, the account's prior use is
      counted over the twelve months ending on the handling date.
      Where the window the prior use is counted over is shorter than twelve months and three or more stops were made
      on the account in the twelve months ending on the handling date, the prior use is the gallons taken over that
      window grossed up to a full year by twelve over the months of the window, rounded to one decimal place. Where
      the window is longer than twelve months and three or more stops were made in that window, the prior use is the
      gallons taken over that window halved, rounded to one decimal place. In every other case the prior use is the
      gallons taken over that window as they stand.
      Where the member's crop input purchases over the twelve months ending on the handling date reach the input
      spend and a security interest stands on file against the crop input account, the programme's ceiling share is
      raised by the acre uplift. Where those purchases reach the input spend and no security interest stands on file
      against the crop input account, the programme's ceiling share is cut by the ceiling reduction. Where those
      purchases fall under the input spend, the programme's ceiling share applies.
      Where the gallons taken on the account in the three months ending on the handling date reach the harvest
      gallons and the tank's water capacity reaches the large tank gallons, the seasonal allowance is the harvest
      allowance. Where those gallons reach the harvest gallons and the tank's water capacity falls under the large
      tank gallons, the seasonal allowance is the small harvest allowance. Where those gallons fall under the
      harvest gallons, the seasonal allowance is nothing.
      Where the signed request has stood registered for at least the stale request months and three or more stops
      were made on the account in the twelve months ending on the handling date, the share the request's standing
      allows is the stale request share. Where the request has stood registered for at least the stale request
      months and fewer than three stops were made in that window, the share the request's standing allows is the
      lapsed request share. Where the request has stood registered for fewer than the stale request months, the
      share the request's standing allows is the whole of it.
      Where the gallons requested reach the programme's minimum pre-buy gallons and one or more will-call stops were
      billed on the account in the three months ending on the handling date, the lot rule rounds the
      gallons down to the whole lot. Where the gallons requested reach the programme's minimum pre-buy gallons and
      no will-call stop was billed in that window, the lot rule rounds the gallons down to the half lot.
      Where the gallons requested fall under the programme's minimum pre-buy gallons, the lot rule leaves the
      gallons unrounded.
    prerequisite: []
    cross_category:
      - category: agronomy
        as: branch
        reads: [agronomy_invoices.amount, lien_on_file]
        note: the member's crop input purchases over the twelve months and the security interest on the crop input account decide which tier of the programme's ceiling share applies
    compute:
      - prior_stops_12m: "COUNT('energy_deliveries', within_months=12, date_field='delivery_date', event_type='energy_delivery_made')"
      - prior_window: "(K('long_prior_window_months') if (prior_stops_12m >= K('active_stop_count') and F('keep_full_enrolled') == True) else (K('short_prior_window_months') if (prior_stops_12m >= K('active_stop_count') and F('keep_full_enrolled') != True) else K('prior_window_months')))"
      - prior_use_raw: "SUM('energy_deliveries','gallons', within_months=prior_window, date_field='delivery_date', event_type='energy_delivery_made')"
      - prior_use: "(RND(prior_use_raw * 12.0 / prior_window, 1) if (prior_window < 12 and prior_stops_12m >= K('active_stop_count')) else (RND(prior_use_raw / 2.0, 1) if (prior_window > 12 and prior_stops_12m >= K('active_stop_count')) else prior_use_raw))"
      - input_spend_12m: "XSUM('agronomy','agronomy_invoices','amount', within_months=12, date_field='invoice_date', event_type='agronomy_invoice_issued')"
      - ceiling_share: "(P('contract_gallons_maximum_pct_of_prior_year') + K('acre_ceiling_uplift_pct') if (input_spend_12m >= K('input_spend_usd') and CFIELD('agronomy','lien_on_file') == True) else (P('contract_gallons_maximum_pct_of_prior_year') - K('ceiling_reduction_pct') if (input_spend_12m >= K('input_spend_usd') and CFIELD('agronomy','lien_on_file') != True) else P('contract_gallons_maximum_pct_of_prior_year')))"
      - harvest_gallons_3m: "SUM('energy_deliveries','gallons', within_months=3, date_field='delivery_date', event_type='energy_delivery_made')"
      - seasonal_allowance: "(K('harvest_allowance_gallons') if (harvest_gallons_3m >= K('harvest_gallons') and F('tank_size_gallons') >= K('large_tank_gallons')) else (K('small_harvest_allowance_gallons') if (harvest_gallons_3m >= K('harvest_gallons') and F('tank_size_gallons') < K('large_tank_gallons')) else 0))"
      - booking_ceiling: "RND(prior_use * ceiling_share / 100.0, 1) + seasonal_allowance"
      - requested_gallons: "SUM('energy_orders','requested_gallons', date_field='requested_date', order_type='contract_gallons_booking', order_status='received', signed_by_member=True)"
      - request_age_months: "MX(0, MONTHS(LATEST('energy_orders','requested_date', date_field='requested_date', order_type='contract_gallons_booking', order_status='received'), NOW))"
      - request_share: "(K('stale_request_share') if (request_age_months >= K('stale_request_months') and prior_stops_12m >= K('active_stop_count')) else (K('lapsed_request_share') if (request_age_months >= K('stale_request_months') and prior_stops_12m < K('active_stop_count')) else 1.0))"
      - allowed_gallons: "RND(MN(requested_gallons, booking_ceiling) * request_share, 2)"
      - will_call_stops_3m_g: "COUNT('energy_deliveries', within_months=3, date_field='delivery_date', event_type='energy_delivery_made', delivery_type='will_call')"
      - credited_gallons: "(int(allowed_gallons / K('lot_gallons')) * K('lot_gallons') if (requested_gallons >= P('contract_gallons_minimum') and will_call_stops_3m_g >= 1) else (int(allowed_gallons / K('half_lot_gallons')) * K('half_lot_gallons') if (requested_gallons >= P('contract_gallons_minimum') and will_call_stops_3m_g < 1) else allowed_gallons))"
      - result: "credited_gallons"
    compute_basis:
      prior_stops_12m: "Where three or more stops were made on the account in the twelve months ending on the handling date and the tank stands on the automatic keep-full schedule, the account's prior use is counted over the long window of months ending on the handling date."
      prior_window: "Where three or more stops were made in that window and the tank does not stand on the automatic keep-full schedule, the account's prior use is counted over the short window of months ending on the handling date. Where fewer than three stops were made in that window, the account's prior use is counted over the twelve months ending on the handling date."
      prior_use_raw: "The prior use is the gallons taken on the account over that window as they stand."
      prior_use: "Where the window is longer than twelve months and three or more stops were made in that window, the prior use is the gallons taken over that window halved, rounded to one decimal place. In every other case the prior use is the gallons taken over that window as they stand."
      input_spend_12m: "Where the member's crop input purchases over the twelve months ending on the handling date reach the input spend and a security interest stands on file against the crop input account, the programme's ceiling share is raised by the acre uplift."
      ceiling_share: "Where those purchases reach the input spend and no security interest stands on file against the crop input account, the programme's ceiling share is cut by the ceiling reduction. Where those purchases fall under the input spend, the programme's ceiling share applies."
      harvest_gallons_3m: "Where the gallons taken on the account in the three months ending on the handling date reach the harvest gallons and the tank's water capacity reaches the large tank gallons, the seasonal allowance is the harvest allowance."
      seasonal_allowance: "Where those gallons reach the harvest gallons and the tank's water capacity falls under the large tank gallons, the seasonal allowance is the small harvest allowance. Where those gallons fall under the harvest gallons, the seasonal allowance is nothing."
      booking_ceiling: "The account's booking ceiling is the prior use at the programme's ceiling share, rounded to one decimal place, plus the seasonal allowance."
      requested_gallons: "A signed pre-buy request registered with the energy desk is put to the member's credit as booked gallons."
      request_age_months: "Where the signed request has stood registered for at least the stale request months and three or more stops were made on the account in the twelve months ending on the handling date, the share the request's standing allows is the stale request share."
      request_share: "Where the request has stood registered for at least the stale request months and fewer than three stops were made in that window, the share the request's standing allows is the lapsed request share. Where the request has stood registered for fewer than the stale request months, the share the request's standing allows is the whole of it."
      allowed_gallons: "The gallons credited on a signed request are the gallons requested or the account's booking ceiling, whichever is the fewer, cut to the share the request's standing allows and then rounded as the lot rule says."
      will_call_stops_3m_g: "Where the gallons requested reach the programme's minimum pre-buy gallons and one or more will-call stops were billed on the account in the three months ending on the handling date, the lot rule rounds the gallons down to the whole lot."
      credited_gallons: "Where the gallons requested reach the programme's minimum pre-buy gallons and no will-call stop was billed in that window, the lot rule rounds the gallons down to the half lot. Where the gallons requested fall under the programme's minimum pre-buy gallons, the lot rule leaves the gallons unrounded."
      result: "The gallons credited on a signed request are the gallons requested or the account's booking ceiling, whichever is the fewer, cut to the share the request's standing allows and then rounded as the lot rule says."
    factors:
      - id: prior_use_window
        effect: method
        decides: prior_window
        bindings: [prior_stops_12m, prior_window]
        ladder:
          - when: "three or more stops were made on the account in the twelve months ending on the handling date and the tank stands on the automatic keep-full schedule"
            method: "the account's prior use is counted over the long window of months ending on the handling date"
          - when: "three or more stops were made in that window and the tank does not stand on the automatic keep-full schedule"
            method: "the account's prior use is counted over the short window of months ending on the handling date"
          - when: "fewer than three stops were made in that window"
            method: "the account's prior use is counted over the twelve months ending on the handling date"
        baseline:
          prior_window: "K('prior_window_months')"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: prior_use_measure
        effect: method
        decides: prior_use
        bindings: [prior_use_raw, prior_use]
        ladder:
          - when: "the window the prior use is counted over is shorter than twelve months and three or more stops were made on the account in the twelve months ending on the handling date"
            method: "the prior use is the gallons taken over that window grossed up to a full year by twelve over the months of the window, rounded to one decimal place"
          - when: "the window is longer than twelve months and three or more stops were made in that window"
            method: "the prior use is the gallons taken over that window halved, rounded to one decimal place"
          - when: "in every other case"
            method: "the prior use is the gallons taken over that window as they stand"
        baseline:
          prior_use: "prior_use_raw"
        evidence: [history]
        cross_difficulty: null
      - id: input_ceiling_share
        effect: parameter
        decides: ceiling_share
        bindings: [input_spend_12m, ceiling_share]
        ladder:
          - when: "the member's crop input purchases over the twelve months ending on the handling date reach the input spend and a security interest stands on file against the crop input account"
            value: "the programme's ceiling share raised by the acre uplift"
          - when: "those purchases reach the input spend and no security interest stands on file against the crop input account"
            value: "the programme's ceiling share cut by the ceiling reduction"
          - when: "those purchases fall under the input spend"
            value: "the programme's ceiling share"
        baseline:
          ceiling_share: "P('contract_gallons_maximum_pct_of_prior_year')"
        evidence: [cross_category, history]
        cross_difficulty: agronomy
      - id: seasonal_use_allowance
        effect: parameter
        decides: seasonal_allowance
        bindings: [harvest_gallons_3m, seasonal_allowance]
        ladder:
          - when: "the gallons taken on the account in the three months ending on the handling date reach the harvest gallons and the tank's water capacity reaches the large tank gallons"
            value: "the harvest allowance"
          - when: "those gallons reach the harvest gallons and the tank's water capacity falls under the large tank gallons"
            value: "the small harvest allowance"
          - when: "those gallons fall under the harvest gallons"
            value: "nothing"
        baseline:
          seasonal_allowance: "0"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: request_standing_share
        effect: parameter
        decides: request_share
        bindings: [request_age_months, request_share]
        ladder:
          - when: "the signed request has stood registered for at least the stale request months and three or more stops were made on the account in the twelve months ending on the handling date"
            value: "the stale request share"
          - when: "the request has stood registered for at least the stale request months and fewer than three stops were made in that window"
            value: "the lapsed request share"
          - when: "the request has stood registered for fewer than the stale request months"
            value: "the whole of it"
        baseline:
          request_share: "1.0"
        evidence: [date, history]
        cross_difficulty: null
      - id: lot_rounding_rule
        effect: method
        decides: credited_gallons
        bindings: [will_call_stops_3m_g, credited_gallons]
        ladder:
          - when: "the gallons requested reach the programme's minimum pre-buy gallons and one or more will-call stops were billed on the account in the three months ending on the handling date"
            method: "the lot rule rounds the gallons down to the whole lot"
          - when: "the gallons requested reach the programme's minimum pre-buy gallons and no will-call stop was billed in that window"
            method: "the lot rule rounds the gallons down to the half lot"
          - when: "the gallons requested fall under the programme's minimum pre-buy gallons"
            method: "the lot rule leaves the gallons unrounded"
        baseline:
          credited_gallons: "allowed_gallons"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        A signed pre-buy request registered with the energy desk is put to the member's credit as booked gallons. The
        account's prior use is counted over the twelve months ending on the handling date. The prior use is the
        gallons taken on the account over that window as they stand. The account's booking ceiling is the prior use
        at the programme's ceiling share, rounded to one decimal place, plus the seasonal allowance. The programme's
        ceiling share applies. The seasonal allowance is nothing. The share the request's standing allows is the
        whole of it. The gallons credited on a signed request are the gallons requested or the account's booking
        ceiling, whichever is the fewer, cut to the share the request's standing allows and then rounded as the lot
        rule says. The lot rule leaves the gallons unrounded.
      params: [prior_window_months, contract_gallons_maximum_pct_of_prior_year]
    inputs:
      history:
        - {table: energy_deliveries, aggregate: sum, field: gallons, within_months: 12, filters: {event_type: energy_delivery_made}}
        - {table: energy_orders, aggregate: sum, field: requested_gallons, filters: {order_type: contract_gallons_booking, order_status: received}}
        - {category: agronomy, table: agronomy_invoices, aggregate: sum, field: amount, within_months: 12, filters: {event_type: agronomy_invoice_issued}}
      cross_category: [agronomy]

  - id: energy_ext_contract_price_of_record
    base_policy_refs: [energy_account_maintenance]
    overwrite:
      - base_policy: energy_account_maintenance
        superseded_clause: >-
          The contracted price on the account is written from the booking and is never edited on its own.
        replaced_by: >-
          The contracted price of record is the gallons-weighted average of the bookings standing on the account,
          carried to four decimal places, adjusted as the loadings and adjustments below say and then trued to the
          market as the truing rule says.
    trigger: state_due
    subject: [energy_account_updated]
    computes: contract_price_per_gallon
    target_tool: update_contract_price_of_record_9db7726a
    params:
      part_protection_share: 0.5
      high_volume_gallons_f: 4000
      mid_volume_gallons_f: 2000
      active_stop_count_f: 4
      high_volume_price_relief: 0.0400
      mid_volume_price_relief: 0.0200
      whole_farm_acres: 1500.0
      whole_farm_price_relief: 0.0300
      part_farm_price_relief: 0.0100
      stale_booking_months: 9
      stale_booking_loading: 0.0500
      small_booking_loading: 0.0200
    rule: >
      The contracted price of record is the gallons-weighted average of the bookings standing on the account,
      carried to four decimal places, adjusted as the loadings and adjustments below say and then trued to the
      market as the truing rule says. The gallons standing to the member's credit are the gallons booked on the
      account less the gallons drawn against those bookings. Nothing is loaded onto the average for downside
      protection. No volume adjustment is taken off it. No whole-farm adjustment is taken off it. Nothing is loaded
      onto it for the standing of the booking. The adjusted price is the weighted average plus the protection
      loading, less the volume adjustment, less the whole-farm adjustment, plus the standing loading, carried to
      four decimal places. The posted price of record is the price billed on the most recent will-call stop,
      carried to four decimal places. A will-call stop is one the records show the member called in, and not one run to the automatic keep-full schedule, run as an emergency, run after hours or made to fill against a booking. The truing rule leaves the contracted price of record at the adjusted
      price. The contracted price of record is written only after the gallons standing to the member's credit take
      in every signed pre-buy request registered with the energy desk.
      Where the programme carries downside protection and the gallons standing to the member's credit reach the
      programme's minimum pre-buy gallons, the protection loading is the programme's protection fee per gallon.
      Where the programme carries downside protection and those gallons fall under the programme's minimum pre-buy
      gallons, the protection loading is the programme's protection fee per gallon at the part protection share.
      Where the programme carries no downside protection, nothing is loaded onto the average for downside
      protection.
      Where the gallons taken on the account over the twelve months ending on the handling date reach the high
      volume gallons and four or more stops were billed on it in that window, the volume adjustment is the high
      volume relief. Where those gallons reach the mid volume gallons and fall under the high volume gallons and
      four or more stops were billed in that window, the volume adjustment is the mid volume relief. In every other
      case no volume adjustment is taken off it.
      Where the acres enrolled on the member's crop input account reach the whole-farm acres and the credit
      department's standing decision on that account is an approval, the whole-farm adjustment is the whole-farm
      relief. Where those acres reach the whole-farm acres and that standing decision is not an approval, the
      whole-farm adjustment is the part farm relief. Where those acres fall under the whole-farm acres, no
      whole-farm adjustment is taken off it.
      Where the signed request behind the booking has stood registered for at least the stale booking months and
      the gallons standing to the member's credit reach the programme's minimum pre-buy gallons, the standing
      loading is the stale booking loading. Where that request has stood registered for at least the stale booking
      months and those gallons fall under the programme's minimum pre-buy gallons, the standing loading is the
      small booking loading. Where that request has stood registered for fewer than the stale booking months,
      nothing is loaded onto it for the standing of the booking.
      Where one or more will-call stops were billed on the account in the three months ending on the
      handling date and the adjusted price stands above the posted price of record, the truing rule puts the
      contracted price of record at the posted price of record. Where one or more such stops were billed in that
      window and the adjusted price stands at or under the posted price of record, the truing rule puts the
      contracted price of record at the mean of the adjusted price and the posted price of record, carried to four
      decimal places. Where no such stop was billed in that window, the truing rule leaves the contracted price of
      record at the adjusted price.
    prerequisite:
      - problem: energy_ext_prebuy_booking_credit
        kind: value_input
        gate: booked_gal
        form: state
        policy_source: >-
          The contracted price of record is written only after the gallons standing to the member's credit take in
          every signed pre-buy request registered with the energy desk.
        condition: >-
          Every signed pre-buy request registered with the energy desk is carried by booked gallons standing to the
          member's credit on the account.
        resolved_by: lodge_contract_gallon_booking_8fcb503b
        effect: >-
          The gallons and the money on the bookings standing rise by the gallons credited on the signed request and
          the money committed on them, so the gallons-weighted average the contracted price of record is built on
          takes a value at all.
    cross_category:
      - category: agronomy
        as: branch
        reads: [acres_enrolled, credit_status]
        note: the acres enrolled on the member's crop input account and the credit department's standing decision on it decide which tier of the whole-farm adjustment applies
    compute:
      - booked_money: "SUM('energy_deliveries','amount', date_field='delivery_date', event_type='energy_contract_gallons_booked')"
      - booked_gal: "SUM('energy_deliveries','gallons', date_field='delivery_date', event_type='energy_contract_gallons_booked')"
      - drawn_gal: "SUM('energy_deliveries','gallons', date_field='delivery_date', event_type='energy_contract_gallons_drawn')"
      - standing_gal: "MX(0.0, booked_gal - drawn_gal)"
      - booked_average: "RND(booked_money / MX(1.0, booked_gal), 4)"
      - protection_loading: "(P('price_protection_fee_per_gallon_usd') if (P('price_protection_enabled') == True and standing_gal >= P('contract_gallons_minimum')) else (RND(P('price_protection_fee_per_gallon_usd') * K('part_protection_share'), 4) if (P('price_protection_enabled') == True and standing_gal < P('contract_gallons_minimum')) else 0.0))"
      - gallons_12m_f: "SUM('energy_deliveries','gallons', within_months=12, date_field='delivery_date', event_type='energy_delivery_made')"
      - stops_12m_f: "COUNT('energy_deliveries', within_months=12, date_field='delivery_date', event_type='energy_delivery_made')"
      - volume_adjustment: "(K('high_volume_price_relief') if (gallons_12m_f >= K('high_volume_gallons_f') and stops_12m_f >= K('active_stop_count_f')) else (K('mid_volume_price_relief') if (gallons_12m_f >= K('mid_volume_gallons_f') and gallons_12m_f < K('high_volume_gallons_f') and stops_12m_f >= K('active_stop_count_f')) else 0.0))"
      - input_acres: "float(CFIELD('agronomy','acres_enrolled') or 0)"
      - whole_farm_adjustment: "(K('whole_farm_price_relief') if (input_acres >= K('whole_farm_acres') and CFIELD('agronomy','credit_status') == 'approved') else (K('part_farm_price_relief') if (input_acres >= K('whole_farm_acres') and CFIELD('agronomy','credit_status') != 'approved') else 0.0))"
      - request_age_months_f: "MX(0, MONTHS(LATEST('energy_orders','requested_date', date_field='requested_date', order_type='contract_gallons_booking', order_status='received'), NOW))"
      - standing_loading: "(K('stale_booking_loading') if (request_age_months_f >= K('stale_booking_months') and standing_gal >= P('contract_gallons_minimum')) else (K('small_booking_loading') if (request_age_months_f >= K('stale_booking_months') and standing_gal < P('contract_gallons_minimum')) else 0.0))"
      - adjusted_price: "RND(booked_average + protection_loading - volume_adjustment - whole_farm_adjustment + standing_loading, 4)"
      - will_call_stops_3m_f: "COUNT('energy_deliveries', within_months=3, date_field='delivery_date', event_type='energy_delivery_made', delivery_type='will_call')"
      - posted_of_record: "RND(float(LATEST('energy_deliveries','price_per_gallon', date_field='delivery_date', event_type='energy_delivery_made', delivery_type='will_call') or 0), 4)"
      - price_of_record: "(posted_of_record if (will_call_stops_3m_f >= 1 and adjusted_price > posted_of_record) else (RND((adjusted_price + posted_of_record) / 2.0, 4) if (will_call_stops_3m_f >= 1 and adjusted_price <= posted_of_record) else adjusted_price))"
      - result: "price_of_record"
    compute_basis:
      booked_money: "The contracted price of record is the gallons-weighted average of the bookings standing on the account, carried to four decimal places, adjusted as the loadings and adjustments below say and then trued to the market as the truing rule says."
      booked_gal: "The gallons standing to the member's credit are the gallons booked on the account less the gallons drawn against those bookings."
      drawn_gal: "Where the programme carries downside protection and the gallons standing to the member's credit reach the programme's minimum pre-buy gallons, the protection loading is the programme's protection fee per gallon."
      standing_gal: "The gallons standing to the member's credit are the gallons booked on the account less the gallons drawn against those bookings."
      booked_average: "The contracted price of record is the gallons-weighted average of the bookings standing on the account, carried to four decimal places, adjusted as the loadings and adjustments below say and then trued to the market as the truing rule says."
      protection_loading: "Where the programme carries downside protection and those gallons fall under the programme's minimum pre-buy gallons, the protection loading is the programme's protection fee per gallon at the part protection share. Where the programme carries no downside protection, nothing is loaded onto the average for downside protection."
      gallons_12m_f: "Where the gallons taken on the account over the twelve months ending on the handling date reach the high volume gallons and four or more stops were billed on it in that window, the volume adjustment is the high volume relief."
      stops_12m_f: "Where those gallons reach the mid volume gallons and fall under the high volume gallons and four or more stops were billed in that window, the volume adjustment is the mid volume relief."
      volume_adjustment: "In every other case no volume adjustment is taken off it."
      input_acres: "Where the acres enrolled on the member's crop input account reach the whole-farm acres and the credit department's standing decision on that account is an approval, the whole-farm adjustment is the whole-farm relief."
      whole_farm_adjustment: "Where those acres reach the whole-farm acres and that standing decision is not an approval, the whole-farm adjustment is the part farm relief. Where those acres fall under the whole-farm acres, no whole-farm adjustment is taken off it."
      request_age_months_f: "Where the signed request behind the booking has stood registered for at least the stale booking months and the gallons standing to the member's credit reach the programme's minimum pre-buy gallons, the standing loading is the stale booking loading."
      standing_loading: "Where that request has stood registered for at least the stale booking months and those gallons fall under the programme's minimum pre-buy gallons, the standing loading is the small booking loading. Where that request has stood registered for fewer than the stale booking months, nothing is loaded onto it for the standing of the booking."
      adjusted_price: "The adjusted price is the weighted average plus the protection loading, less the volume adjustment, less the whole-farm adjustment, plus the standing loading, carried to four decimal places."
      will_call_stops_3m_f: "Where one or more will-call stops were billed on the account in the three months ending on the handling date and the adjusted price stands above the posted price of record, the truing rule puts the contracted price of record at the posted price of record."
      posted_of_record: "The posted price of record is the price billed on the most recent will-call stop, carried to four decimal places."
      price_of_record: "Where one or more such stops were billed in that window and the adjusted price stands at or under the posted price of record, the truing rule puts the contracted price of record at the mean of the adjusted price and the posted price of record, carried to four decimal places. Where no such stop was billed in that window, the truing rule leaves the contracted price of record at the adjusted price."
      result: "The contracted price of record is the gallons-weighted average of the bookings standing on the account, carried to four decimal places, adjusted as the loadings and adjustments below say and then trued to the market as the truing rule says."
    factors:
      - id: protection_price_loading
        effect: parameter
        decides: protection_loading
        bindings: [drawn_gal, protection_loading]
        ladder:
          - when: "the programme carries downside protection and the gallons standing to the member's credit reach the programme's minimum pre-buy gallons"
            value: "the programme's protection fee per gallon"
          - when: "the programme carries downside protection and those gallons fall under the programme's minimum pre-buy gallons"
            value: "the programme's protection fee per gallon at the part protection share"
          - when: "the programme carries no downside protection"
            value: "nothing"
        baseline:
          protection_loading: "0.0"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: volume_price_adjustment
        effect: parameter
        decides: volume_adjustment
        bindings: [gallons_12m_f, stops_12m_f, volume_adjustment]
        ladder:
          - when: "the gallons taken on the account over the twelve months ending on the handling date reach the high volume gallons and four or more stops were billed on it in that window"
            value: "the high volume relief"
          - when: "those gallons reach the mid volume gallons and fall under the high volume gallons and four or more stops were billed in that window"
            value: "the mid volume relief"
          - when: "in every other case"
            value: "nothing"
        baseline:
          volume_adjustment: "0.0"
        evidence: [history]
        cross_difficulty: null
      - id: whole_farm_price_adjustment
        effect: parameter
        decides: whole_farm_adjustment
        bindings: [input_acres, whole_farm_adjustment]
        ladder:
          - when: "the acres enrolled on the member's crop input account reach the whole-farm acres and the credit department's standing decision on that account is an approval"
            value: "the whole-farm relief"
          - when: "those acres reach the whole-farm acres and that standing decision is not an approval"
            value: "the part farm relief"
          - when: "those acres fall under the whole-farm acres"
            value: "nothing"
        baseline:
          whole_farm_adjustment: "0.0"
        evidence: [cross_category]
        cross_difficulty: agronomy
      - id: booking_standing_loading
        effect: parameter
        decides: standing_loading
        bindings: [request_age_months_f, standing_loading]
        ladder:
          - when: "the signed request behind the booking has stood registered for at least the stale booking months and the gallons standing to the member's credit reach the programme's minimum pre-buy gallons"
            value: "the stale booking loading"
          - when: "that request has stood registered for at least the stale booking months and those gallons fall under the programme's minimum pre-buy gallons"
            value: "the small booking loading"
          - when: "that request has stood registered for fewer than the stale booking months"
            value: "nothing"
        baseline:
          standing_loading: "0.0"
        evidence: [date, history]
        cross_difficulty: null
      - id: market_truing_rule
        effect: method
        decides: price_of_record
        bindings: [will_call_stops_3m_f, posted_of_record, price_of_record]
        ladder:
          - when: "one or more will-call stops were billed on the account in the three months ending on the handling date and the adjusted price stands above the posted price of record"
            method: "the truing rule puts the contracted price of record at the posted price of record"
          - when: "one or more such stops were billed in that window and the adjusted price stands at or under the posted price of record"
            method: "the truing rule puts the contracted price of record at the mean of the adjusted price and the posted price of record, carried to four decimal places"
          - when: "no such stop was billed in that window"
            method: "the truing rule leaves the contracted price of record at the adjusted price"
        baseline:
          price_of_record: "adjusted_price"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The contracted price of record is the gallons-weighted average of the bookings standing on the account,
        carried to four decimal places, adjusted as the loadings and adjustments below say and then trued to the
        market as the truing rule says. The gallons standing to the member's credit are the gallons booked on the
        account less the gallons drawn against those bookings. Nothing is loaded onto the average for downside
        protection. No volume adjustment is taken off it. No whole-farm adjustment is taken off it. Nothing is loaded
        onto it for the standing of the booking. The adjusted price is the weighted average plus the protection
        loading, less the volume adjustment, less the whole-farm adjustment, plus the standing loading, carried to
        four decimal places. The posted price of record is the price billed on the most recent will-call stop,
        carried to four decimal places. A will-call stop is one the records show the member called in, and not one run to the automatic keep-full schedule, run as an emergency, run after hours or made to fill against a booking. The truing rule leaves the contracted price of record at the adjusted
        price.
      params: []
    inputs:
      history:
        - {table: energy_deliveries, aggregate: sum, field: gallons, filters: {event_type: energy_contract_gallons_booked}}
        - {table: energy_deliveries, aggregate: sum, field: gallons, within_months: 12, filters: {event_type: energy_delivery_made}}
        - {table: energy_orders, aggregate: latest, field: requested_date, filters: {order_type: contract_gallons_booking, order_status: received}}
      cross_category: [agronomy]

  - id: energy_ext_undrawn_gallons_disposition
    base_policy_refs: [energy_pricing, energy_contract_gallons_program]
    overwrite:
      - base_policy: energy_contract_gallons_program
        superseded_clause: >-
          Gallons unused at the programme's expiry date are dealt with as the programme's treatment says, which on
          some programmes means crediting the member at the lower of the contracted and posted price and on others
          means rolling them into the following contract year; nothing is ever simply forfeited.
        replaced_by: >-
          Where an account is being closed there is no following contract year to roll gallons into, so the gallons
          standing undrawn are released and the money applied against the booking is worked out on them at the
          settlement price.
      - base_policy: energy_contract_gallons_program
        superseded_clause: >-
          A member who wants out of a booking before the gallons are drawn pays the programme's cancellation charge
          per gallon cancelled, and where the posted price has risen above the contracted price the cooperative does
          not pay the member the difference to release them.
        replaced_by: >-
          Where the gallons taken on the account over the twelve months ending on the handling date reach the
          programme's minimum annual gallons and the credit department's standing decision on the member's crop
          input account is an approval, the cancellation charge per gallon is the programme's cancellation charge
          less the active member relief.
    trigger: state_due
    subject: [energy_contract_gallons_drawn]
    computes: undrawn_settlement_usd
    target_tool: settle_undrawn_contract_gallons_1dbcf678
    params:
      recent_stop_count_e: 2
      twice_minimum_multiple: 2
      active_member_relief: 0.0400
      part_member_relief: 0.0200
      member_tank_handling: 0.0150
      coop_tank_handling: 0.0300
      part_refund_share: 0.5
      settled_years_e: 10
      long_member_admin_usd: 25.00
      admin_usd: 50.00
      short_member_admin_usd: 75.00
    rule: >
      Where an account is being closed there is no following contract year to roll gallons into, so the gallons
      standing undrawn are released and the money applied against the booking is worked out on them at the
      settlement price. The gallons standing undrawn are the gallons booked on the account less the gallons already
      drawn against those bookings. The gallons settled are the gallons standing undrawn in full. The posted price
      of the day is the price billed on the most recent will-call stop, carried to four decimal places. A will-call stop is one the records show the member called in, and not one run to the automatic keep-full schedule, run as an emergency, run after hours or made to fill against a booking.
      The settlement price is the contracted price of record standing on the account or the posted price of the
      day, whichever is the lower. Nothing is refunded per gallon for downside protection. The cancellation charge
      per gallon is the programme's cancellation charge. Nothing is deducted per gallon for handling. The
      administration charge is the short member administration charge. The money applied against the booking is the
      gallons settled at the settlement price, with the protection refund added per gallon and the cancellation
      charge and the handling deduction taken off per gallon, less the administration charge, rounded to two decimal
      places once at the end and never falling below nothing. The money applied against a booking on the gallons
      standing undrawn is worked out only after the account's contracted price of record stands at a price worked
      out from the bookings the account carries.
      Where two or more stops were billed on the account in the three months ending on the handling date and the
      gallons standing undrawn reach the programme's minimum pre-buy gallons, the gallons settled are the gallons
      standing undrawn less the gallons the most recent stop took, that fill being treated as drawn against the
      booking. Where fewer than two stops were billed in that window and the gallons standing undrawn reach the
      programme's minimum pre-buy gallons, the gallons settled are the gallons standing undrawn less the
      programme's minimum delivery gallons. Where the gallons standing undrawn fall under the programme's minimum
      pre-buy gallons, the gallons settled are the gallons standing undrawn in full.
      Where the gallons standing undrawn reach twice the programme's minimum pre-buy gallons and one or more will-call stops
      were billed on the account in the three months ending on the handling date, the
      settlement price is the mean of the contracted price of record and the posted price of the day, carried to
      four decimal places. Where those gallons reach twice the programme's minimum pre-buy gallons and no will-call
      stop was billed in that window, the settlement price is the contracted price of record standing on
      the account. Where those gallons fall under twice the programme's minimum pre-buy gallons, the settlement
      price is the contracted price of record standing on the account or the posted price of the day, whichever is
      the lower.
      Where the gallons taken on the account over the twelve months ending on the handling date reach the
      programme's minimum annual gallons and the credit department's standing decision on the member's crop input
      account is an approval, the cancellation charge per gallon is the programme's cancellation charge less the
      active member relief. Where those gallons reach the programme's minimum annual gallons and that standing
      decision is not an approval, the cancellation charge per gallon is the programme's cancellation charge less
      the part member relief. Where those gallons fall under the programme's minimum annual gallons, the
      cancellation charge per gallon is the programme's cancellation charge.
      Where the tank is the member's own and two or more stops were billed on the account in the three months
      ending on the handling date, the handling deduction is the member tank handling. Where the tank is the
      cooperative's and two or more stops were billed in that window, the handling deduction is the cooperative
      tank handling. Where fewer than two stops were billed in that window, nothing is deducted per gallon for
      handling.
      Where the programme carries downside protection and no protection credit has ever been worked out on the
      account, the protection refund per gallon is the programme's protection fee per gallon. Where the programme
      carries downside protection and one or more protection credits have been worked out on the account, the
      protection refund per gallon is the programme's protection fee per gallon at the part refund share. Where the
      programme carries no downside protection, nothing is refunded per gallon for downside protection.
      Where the account has stood open for at least the settled years and the gallons taken on it over the twelve
      months ending on the handling date reach the programme's minimum annual gallons, the administration charge is
      the long member administration charge. Where the account has stood open for at least the settled years and
      those gallons fall under the programme's minimum annual gallons, the administration charge is the ordinary
      administration charge. Where the account has stood open for fewer than the settled years, the administration
      charge is the short member administration charge.
    prerequisite:
      - problem: energy_ext_contract_price_of_record
        kind: value_input
        gate: settlement_price
        form: state
        policy_source: >-
          The money applied against a booking on the gallons standing undrawn is worked out only after the account's
          contracted price of record stands at a price worked out from the bookings the account carries.
        condition: >-
          The contracted price of record standing on the account is a price worked out from the bookings the account
          carries rather than the nil price an account carries where nothing has been booked.
        resolved_by: update_contract_price_of_record_9db7726a
        effect: >-
          The contracted price of record standing on the account takes the price worked out from the bookings, so
          the settlement price the gallons are released at moves from the nil price to that price.
    cross_category:
      - category: agronomy
        as: branch
        reads: [credit_status]
        note: the credit department's standing decision on the member's crop input account decides which tier of the cancellation charge per gallon applies
    compute:
      - booked_gal_e: "SUM('energy_deliveries','gallons', date_field='delivery_date', event_type='energy_contract_gallons_booked')"
      - drawn_gal_e: "SUM('energy_deliveries','gallons', date_field='delivery_date', event_type='energy_contract_gallons_drawn')"
      - standing_gal_e: "MX(0.0, booked_gal_e - drawn_gal_e)"
      - last_stop_gallons: "float(LATEST('energy_deliveries','gallons', date_field='delivery_date', event_type='energy_delivery_made') or 0)"
      - stops_3m_e: "COUNT('energy_deliveries', within_months=3, date_field='delivery_date', event_type='energy_delivery_made')"
      - settled_gallons: "(MX(0.0, standing_gal_e - last_stop_gallons) if (stops_3m_e >= K('recent_stop_count_e') and standing_gal_e >= P('contract_gallons_minimum')) else (MX(0.0, standing_gal_e - P('minimum_delivery_gallons')) if (stops_3m_e < K('recent_stop_count_e') and standing_gal_e >= P('contract_gallons_minimum')) else standing_gal_e))"
      - will_call_3m_e: "COUNT('energy_deliveries', within_months=3, date_field='delivery_date', event_type='energy_delivery_made', delivery_type='will_call')"
      - posted_of_day: "RND(float(LATEST('energy_deliveries','price_per_gallon', date_field='delivery_date', event_type='energy_delivery_made', delivery_type='will_call') or 0), 4)"
      - settlement_price: "(RND((float(F('contract_price_per_gallon')) + posted_of_day) / 2.0, 4) if (standing_gal_e >= K('twice_minimum_multiple') * P('contract_gallons_minimum') and will_call_3m_e >= 1) else (float(F('contract_price_per_gallon')) if (standing_gal_e >= K('twice_minimum_multiple') * P('contract_gallons_minimum') and will_call_3m_e < 1) else MN(float(F('contract_price_per_gallon')), posted_of_day)))"
      - gallons_12m_e: "SUM('energy_deliveries','gallons', within_months=12, date_field='delivery_date', event_type='energy_delivery_made')"
      - cancellation_rate: "(P('contract_cancellation_fee_per_gallon_usd') - K('active_member_relief') if (gallons_12m_e >= P('minimum_annual_gallons') and CFIELD('agronomy','credit_status') == 'approved') else (P('contract_cancellation_fee_per_gallon_usd') - K('part_member_relief') if (gallons_12m_e >= P('minimum_annual_gallons') and CFIELD('agronomy','credit_status') != 'approved') else P('contract_cancellation_fee_per_gallon_usd')))"
      - handling_deduction: "(K('member_tank_handling') if (F('tank_ownership') == 'member_owned' and stops_3m_e >= K('recent_stop_count_e')) else (K('coop_tank_handling') if (F('tank_ownership') == 'cooperative_owned' and stops_3m_e >= K('recent_stop_count_e')) else 0.0))"
      - protection_credit_count_e: "COUNT('energy_deliveries', date_field='delivery_date', event_type='energy_price_protection_credited')"
      - protection_refund: "(P('price_protection_fee_per_gallon_usd') if (P('price_protection_enabled') == True and protection_credit_count_e < 1) else (RND(P('price_protection_fee_per_gallon_usd') * K('part_refund_share'), 4) if (P('price_protection_enabled') == True and protection_credit_count_e >= 1) else 0.0))"
      - account_years_e: "DAYS(F('opened_date'), NOW) / 365.0"
      - admin_charge: "(K('long_member_admin_usd') if (account_years_e >= K('settled_years_e') and gallons_12m_e >= P('minimum_annual_gallons')) else (K('admin_usd') if (account_years_e >= K('settled_years_e') and gallons_12m_e < P('minimum_annual_gallons')) else K('short_member_admin_usd')))"
      - result: "RND(MX(0.0, settled_gallons * (settlement_price + protection_refund - cancellation_rate - handling_deduction) - admin_charge), 2)"
    compute_basis:
      booked_gal_e: "The gallons standing undrawn are the gallons booked on the account less the gallons already drawn against those bookings."
      drawn_gal_e: "The gallons standing undrawn are the gallons booked on the account less the gallons already drawn against those bookings."
      standing_gal_e: "The gallons settled are the gallons standing undrawn in full."
      last_stop_gallons: "Where two or more stops were billed on the account in the three months ending on the handling date and the gallons standing undrawn reach the programme's minimum pre-buy gallons, the gallons settled are the gallons standing undrawn less the gallons the most recent stop took, that fill being treated as drawn against the booking."
      stops_3m_e: "Where fewer than two stops were billed in that window and the gallons standing undrawn reach the programme's minimum pre-buy gallons, the gallons settled are the gallons standing undrawn less the programme's minimum delivery gallons."
      settled_gallons: "Where the gallons standing undrawn fall under the programme's minimum pre-buy gallons, the gallons settled are the gallons standing undrawn in full."
      will_call_3m_e: "Where the gallons standing undrawn reach twice the programme's minimum pre-buy gallons and one or more will-call stops were billed on the account in the three months ending on the handling date, the settlement price is the mean of the contracted price of record and the posted price of the day, carried to four decimal places."
      posted_of_day: "The posted price of the day is the price billed on the most recent will-call stop, carried to four decimal places."
      settlement_price: "Where those gallons reach twice the programme's minimum pre-buy gallons and no will-call stop was billed in that window, the settlement price is the contracted price of record standing on the account. Where those gallons fall under twice the programme's minimum pre-buy gallons, the settlement price is the contracted price of record standing on the account or the posted price of the day, whichever is the lower."
      gallons_12m_e: "Where the gallons taken on the account over the twelve months ending on the handling date reach the programme's minimum annual gallons and the credit department's standing decision on the member's crop input account is an approval, the cancellation charge per gallon is the programme's cancellation charge less the active member relief."
      cancellation_rate: "Where those gallons reach the programme's minimum annual gallons and that standing decision is not an approval, the cancellation charge per gallon is the programme's cancellation charge less the part member relief. Where those gallons fall under the programme's minimum annual gallons, the cancellation charge per gallon is the programme's cancellation charge."
      handling_deduction: "Where the tank is the member's own and two or more stops were billed on the account in the three months ending on the handling date, the handling deduction is the member tank handling. Where the tank is the cooperative's and two or more stops were billed in that window, the handling deduction is the cooperative tank handling. Where fewer than two stops were billed in that window, nothing is deducted per gallon for handling."
      protection_credit_count_e: "Where the programme carries downside protection and no protection credit has ever been worked out on the account, the protection refund per gallon is the programme's protection fee per gallon."
      protection_refund: "Where the programme carries downside protection and one or more protection credits have been worked out on the account, the protection refund per gallon is the programme's protection fee per gallon at the part refund share. Where the programme carries no downside protection, nothing is refunded per gallon for downside protection."
      account_years_e: "Where the account has stood open for at least the settled years and the gallons taken on it over the twelve months ending on the handling date reach the programme's minimum annual gallons, the administration charge is the long member administration charge."
      admin_charge: "Where the account has stood open for at least the settled years and those gallons fall under the programme's minimum annual gallons, the administration charge is the ordinary administration charge. Where the account has stood open for fewer than the settled years, the administration charge is the short member administration charge."
      result: "The money applied against the booking is the gallons settled at the settlement price, with the protection refund added per gallon and the cancellation charge and the handling deduction taken off per gallon, less the administration charge, rounded to two decimal places once at the end and never falling below nothing."
    factors:
      - id: settled_gallons_basis
        effect: method
        decides: settled_gallons
        bindings: [last_stop_gallons, settled_gallons]
        ladder:
          - when: "two or more stops were billed on the account in the three months ending on the handling date and the gallons standing undrawn reach the programme's minimum pre-buy gallons"
            method: "the gallons settled are the gallons standing undrawn less the gallons the most recent stop took, that fill being treated as drawn against the booking"
          - when: "fewer than two stops were billed in that window and the gallons standing undrawn reach the programme's minimum pre-buy gallons"
            method: "the gallons settled are the gallons standing undrawn less the programme's minimum delivery gallons"
          - when: "the gallons standing undrawn fall under the programme's minimum pre-buy gallons"
