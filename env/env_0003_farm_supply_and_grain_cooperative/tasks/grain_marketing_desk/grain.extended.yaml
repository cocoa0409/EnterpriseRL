        bindings: [amendments_registered, applied_loads, admin_fee]
        ladder:
          - when: "the contract carries a registered amendment and loads the member directed to the contract at the scale stand applied to it"
            value: "K('admin_fee_amended')"
          - when: "such loads stand applied to the contract but no amendment is registered against it"
            value: "K('admin_fee_part_delivered')"
          - when: "otherwise"
            value: "P('buyout_admin_fee_usd')"
        baseline:
          admin_fee: "P('buyout_admin_fee_usd')"
        evidence: [history]
        cross_difficulty: null
      - id: input_account_collection_charge
        effect: parameter
