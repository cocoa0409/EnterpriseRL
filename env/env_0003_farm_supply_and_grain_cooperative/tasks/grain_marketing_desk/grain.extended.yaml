            value: "K('damage_band_top')"
          - when: "the worst damage reading is above the middle damage ceiling and at or below the upper damage ceiling"
            value: "K('damage_band_upper')"
          - when: "the worst damage reading is above the free damage ceiling and at or below the middle damage ceiling"
            value: "K('damage_band_lower')"
          - when: "otherwise"
            value: "0.0"
        baseline:
          damage_rate: "0.0"
        evidence: [history]
        cross_difficulty: null
      - id: foreign_material_grade_allowance
        effect: parameter
        decides: foreign_rate
