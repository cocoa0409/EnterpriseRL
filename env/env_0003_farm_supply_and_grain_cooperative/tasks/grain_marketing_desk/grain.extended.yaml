category: grain
display_name: Grain Marketing Contracts

binding:
  holding_table: grain_contracts
  event_tables: [grain_ledger]
  intake_tables: [grain_pricing_intake]
  status_field: status
  variant_field: variant_name
  quantity_fields:
    open_bushels: contract_bushels
    unpriced_bushels: unpriced_bushels

lifecycle:
  states: [applied, active, delivering, fully_delivered, settled, cancelled, defaulted]
  transitions:
    - {from: applied, to: active, by: agent, means: the grain desk countersigns the contract and it becomes binding on both sides}
    - {from: applied, to: cancelled, by: user, means: the member withdraws the application before the cooperative countersigns it}
    - {from: active, to: delivering, by: system, means: the first load is applied to the contract and delivery is under way}
    - {from: delivering, to: fully_delivered, by: system, means: the last contracted bushel has been delivered and no bushels remain open}
    - {from: fully_delivered, to: settled, by: agent, means: every delivered bushel has been priced and paid and the contract is closed out}
    - {from: active, to: cancelled, by: user, means: the member buys the contract out before any delivery is made}
    - {from: delivering, to: cancelled, by: user, means: the member buys out the undelivered balance part way through delivery}
    - {from: active, to: defaulted, by: system, means: the delivery window closed with bushels still owed and no buyout was arranged}
    - {from: delivering, to: defaulted, by: system, means: the delivery window closed with bushels still owed part way through delivery}

accounts:
  - key: contract_bushels
    unit: bushels
    meaning: bushels still owed on a contract, credited when the contract is opened and debited as loads are applied
  - key: unpriced_bushels
    unit: bushels
    meaning: delivered bushels standing in the member's unpriced position, credited when bushels are routed there and debited when they are priced
  - key: settlement_payable
    unit: USD
    meaning: money the cooperative owes the member on settled grain, credited when a statement is issued and debited by deductions and by the payment released

parameter_schema:
  min_contract_bushels: minimum bushels a single contract may be written for (whole bushels)
  max_contract_bushels: maximum bushels a single contract may be written for (whole bushels)
  contract_setup_fee_usd: one-off fee charged when the contract is countersigned (USD)
  delivery_window_days: length of the standard contracted delivery window (calendar days)
  delivery_extension_days: calendar days the delivery window may be extended by without rewriting the contract
  delivery_extension_fee_per_bushel_usd: charge for extending the delivery window (USD per bushel)
  roll_fee_per_bushel_usd: administrative charge for rolling the delivery period or futures month (USD per bushel)
  max_rolls_per_crop_year: how many rolls a contract may take in one crop year (count)
  roll_minimum_bushels: smallest parcel that may be rolled in one instruction (whole bushels)
  basis_fixing_allowed: whether basis may be fixed separately from futures on this programme (switch)
  futures_fixing_allowed: whether futures may be fixed separately from basis on this programme (switch)
  price_later_allowed: whether bushels may be delivered without a price and carried unpriced (switch)
  dp_free_days: calendar days an unpriced parcel carries free of service charge before charges begin
  dp_service_charge_per_bushel_per_month_usd: delayed price service charge (USD per bushel per 30-day month)
  dp_service_charge_minimum_usd: floor under the delayed price service charge on any one parcel (USD)
  dp_max_open_days: maximum calendar days bushels may stand unpriced before they must be priced
  min_pricing_increment_bushels: smallest parcel a single pricing instruction may act on (whole bushels)
  max_pricing_orders_per_day: how many pricing instructions the desk will work for one member in one trading day (count)
  online_pricing_enabled: whether the member may price through the online portal rather than the desk (switch)
  pricing_cutoff_time_local: latest local time of day a pricing instruction is worked on the same trading day (HH:MM)
  settlement_lead_days: business days between the settlement statement and release of funds
  settlement_minimum_amount_usd: smallest net settlement the cooperative will cut a payment for; smaller amounts are carried forward (USD)
  deferred_payment_allowed: whether payment may be deferred into the next calendar year (switch)
  deferred_payment_max_days: longest a deferred payment may be held from the settlement date (calendar days)
  advance_payment_enabled: whether an advance may be drawn against unpriced bushels (switch)
  advance_payment_pct_of_market: share of market value that may be advanced against unpriced bushels (percent)
  advance_payment_interest_apr_pct: interest charged on an outstanding advance (annual percentage rate)
  shrink_pct_per_moisture_point: bushels shrunk for each moisture point above base (percent of gross bushels per point)
  moisture_base_pct: moisture base for yellow corn; the other commodities' bases are carried in the per-commodity table of grain_evt_delivery_application (percent)
  test_weight_base_lbs: test weight base for yellow corn below which a discount applies (pounds per bushel)
  test_weight_discount_per_lb_usd: discount for each whole pound of test weight below base (USD per bushel)
  foreign_material_free_pct: foreign material tolerated before a discount applies (percent)
  foreign_material_discount_per_pct_usd: discount for each percentage point of foreign material above tolerance (USD per bushel)
  damage_discount_ladder: threshold ladder of damage bands to discount per bushel, each band giving the band ceiling and the discount (list of bands)
  quality_rejection_damage_pct: damage level at or above which a load is refused outright rather than discounted (percent)
  checkoff_rate_per_bushel_usd: statutory commodity checkoff withheld on settled bushels (USD per bushel)
  checkoff_refund_window_days: calendar days a member has to ask for the checkoff back after a settlement
  buyout_admin_fee_usd: flat administrative charge on a contract buyout (USD)
  buyout_market_loss_multiplier: multiplier applied to the market loss on undelivered bushels when a contract is bought out (factor)
  buyout_notice_window_days: calendar days before the close of the delivery window by which buyout notice must reach the desk
  cancellation_before_activation_allowed: whether an application may be withdrawn before it is countersigned (switch)
  default_penalty_per_bushel_usd: penalty on bushels left undelivered when the window closes without a buyout (USD per bushel)
  credit_approval_required: whether the grain desk credit review must be complete before the contract is countersigned (switch)
  marketing_agreement_required: whether a signed master grain marketing agreement is required for this programme (switch)
  open_position_cap_pct_of_production: ceiling on open forward bushels as a share of the member's production history average (percent)
  production_history_years: completed crop years averaged to form the member's production history average (count)
  contract_amendment_window_days: calendar days after countersigning within which an amendment may still be registered
  max_amendments_per_contract: how many amendments one contract may take (count)
  amendment_fee_usd: charge for registering an amendment (USD)
  freight_differential_per_bushel_usd: adjustment applied when a load is delivered to a facility other than the contracted one (USD per bushel)
  per_unit_retain_per_bushel_usd: capital retained per settled bushel and credited to the member's equity account (USD per bushel)
  patronage_eligible: whether bushels marketed under this programme earn patronage allocation (switch)
  minimum_price_premium_per_bushel_usd: premium charged for the price floor carried by a minimum price contract (USD per bushel)
  accumulator_weekly_accumulation_bushels: bushels accumulated each trading week under an accumulator structure (whole bushels)
  statement_delivery_method: how contract and settlement statements reach the member (channel)
  hedge_desk_service_level: level of grain desk support the programme carries (service band)
  moisture_base_by_commodity: moisture base by commodity, used where the load is not yellow corn (mapping of commodity to percent)
  test_weight_base_by_commodity: test weight base by commodity (mapping of commodity to pounds per bushel)

