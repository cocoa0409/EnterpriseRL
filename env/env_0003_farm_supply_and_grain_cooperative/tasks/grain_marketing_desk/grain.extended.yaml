    factors:
      - id: charge_draw_basis
        effect: method
        decides: drawn_charges
        bindings: [statement_charges, all_deductions, roll_charges, drawn_charges]
        ladder:
          - when: "the contract stands in delivering"
            method: "every charge standing on the contract's grain ledger is drawn, whether it names the statement or not"
          - when: "the contract stands in fully delivered or in settled standing"
            method: "the charge lines naming the statement are drawn together with the roll charges standing on the contract"
          - when: "otherwise"
            method: "only the charge lines naming the statement are drawn"
