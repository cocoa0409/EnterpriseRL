  - id: grain_ext_futures_month_roll_charge
    base_policy_refs: [grain_roll_handling]
    overwrite:
      - base_policy: grain_roll_handling
        superseded_clause: >-
          must name at least the programme's roll minimum
        replaced_by: >-
          Where the instruction names fewer bushels than the roll minimum the member's marketing programme sets,
          the roll moves that roll minimum.
      - base_policy: grain_roll_handling
        superseded_clause: >-
          The member carries the market spread between the two futures months in full, gaining where the market
          carries and losing where it is inverted, and pays the programme's administrative charge per bushel rolled
          on top of it.
        replaced_by: >-
          The charge a roll carries is the chargeable bushels times the roll rate the member is worked at, taken at
          the desk multiple, and the roll rate the member is worked at is the base roll rate plus the repeat
          surcharge.
    trigger: state_due
    subject: [grain_contract_rolled]
    computes: roll_charge_amount_usd
    target_tool: execute_futures_month_roll_2054762f
    params:
      roll_surcharge_third: 0.0150
      roll_surcharge_second: 0.0075
      roll_allowance_high: 5000
      roll_allowance_mid: 2500
      volume_high_bushels: 15000
      volume_mid_bushels: 9000
      prepay_threshold_usd: 25000
      roll_fee_prepay: 0.0300
      roll_fee_member: 0.0330
      desk_worked_multiple: 1.25
      single_instruction_multiple: 1.10
    rule: >
      The charge a roll carries is the chargeable bushels times the roll rate the member is worked at, taken at
      the desk multiple, and the roll rate the member is worked at is the base roll rate plus the repeat
      surcharge. The chargeable bushels are the bushels the roll moves less the crop-year roll allowance, never
      below zero, and the bushels the roll moves are the bushels the signed roll instruction names. The base roll
      rate is the administrative charge per bushel the member's marketing programme carries, the repeat surcharge
      is nil, the crop-year roll allowance is nil and the desk multiple is one. The charge is rounded to the cent
      once, on the figure reached after the chargeable bushels, the roll rate and the desk multiple have been
      multiplied together. The charge a roll carries is fixed only after the bushels still owed on the contract
      stand at the figure the loads applied to it support.
      The bushels the roll moves are read against what the contract still owes. Where the signed roll instruction
      names more bushels than the contract still owes, the roll moves the bushels the contract still owes, since no
      more than that remains to be moved. Where the instruction names fewer bushels than the roll minimum the
      member's marketing programme sets, the roll moves that roll minimum. Where neither of those holds, the roll
      moves the bushels the instruction names.
      The repeat surcharge rises with the rolls the contract has already taken. Where two or more roll
      confirmations already stand on the contract, the surcharge is the third-roll surcharge. Where exactly one roll
      confirmation stands, the surcharge is the second-roll surcharge. Where no roll confirmation stands, no repeat
      surcharge is added.
      The crop-year roll allowance is a parcel of bushels rolled free of the administrative charge, and it is taken
      off the bushels the roll moves before the rate is applied. Where the net bushels of every load standing
      against the contract, whatever the disposition, reach the high volume threshold and eight or more such loads
      stand, the allowance is the high roll allowance. Where those net bushels reach the middle volume threshold,
      or five or more such loads stand, the allowance is the middle roll allowance. Where neither of those holds,
      no allowance is given.
      The base roll rate follows the member's standing on their crop input account. Where prepay booked on that
      account over the last twelve months reaches the prepay threshold and the account stands active, the base rate
      is the prepay roll rate. Where the account stands active but prepay booked falls short of that threshold, the
      base rate is the member roll rate. Where no active crop input account stands in the member's name, the base
      rate is the administrative charge per bushel the member's marketing programme carries.
      The desk multiple recognises who does the work of the instructions standing on the contract. Where two or more
      signed instructions stand against the contract and no pricing has been worked through the online portal, the
      charge is taken at the desk-worked multiple, since every one of those instructions is worked by hand at the
      grain desk. Where pricing worked through the online portal stands on the contract, the charge is taken as
      arrived at. Where neither of those holds, the charge is taken at the single-instruction multiple.
    prerequisite:
      - problem: grain_ext_open_balance_reconciliation
        kind: value_input
        gate: rolled_bu
        form: state
        policy_source: >-
          The charge a roll carries is fixed only after the bushels still owed on the contract stand at the figure
          the loads applied to it support.
        condition: >-
          The bushels still owed recorded on the contract equal the committed bushels less the bushels the loads
          standing on the grain ledger credit to it.
        resolved_by: record_contract_delivery_balance_c52b7782
        effect: >-
          The bushels the roll moves are read from the contract's bushels still owed, so once that balance is
          restated the bushels the roll moves, and with them the chargeable bushels, take their restated value.
    cross_category:
      - category: agronomy
        as: branch
        reads: [status, agronomy_invoices.amount, agronomy_invoices.posted_date, agronomy_invoices.event_type]
        note: the crop input account's standing and the prepay booked on it decide the base roll rate
    compute:
      - instruction_bu: "float(LATEST('grain_pricing_intake','requested_bushels', date_field='effective_date', order_type='roll_request', order_status='received') or 0)"
      - open_bu: "float(F('open_bushels'))"
      - rolled_bu: "open_bu if instruction_bu > open_bu else (P('roll_minimum_bushels') if instruction_bu < P('roll_minimum_bushels') else instruction_bu)"
      - prior_rolls: "COUNT('grain_ledger', event_type='grain_contract_rolled')"
      - repeat_surcharge: "K('roll_surcharge_third') if prior_rolls >= 2 else (K('roll_surcharge_second') if prior_rolls == 1 else 0.0)"
      - delivered_bu: "SUM('grain_ledger','net_bushels', event_type='grain_delivery_applied')"
      - delivered_loads: "COUNT('grain_ledger', event_type='grain_delivery_applied')"
      - roll_allowance_bu: "K('roll_allowance_high') if (delivered_bu >= K('volume_high_bushels') and delivered_loads >= 8) else (K('roll_allowance_mid') if (delivered_bu >= K('volume_mid_bushels') or delivered_loads >= 5) else 0.0)"
      - input_account_status: "CFIELD('agronomy','status')"
      - prepay_booked: "XSUM('agronomy','agronomy_invoices','amount', within_months=12, date_field='posted_date', event_type='agronomy_prepay_booked')"
      - roll_fee_rate: "K('roll_fee_prepay') if (prepay_booked >= K('prepay_threshold_usd') and input_account_status == 'active') else (K('roll_fee_member') if input_account_status == 'active' else P('roll_fee_per_bushel_usd'))"
      - signed_instructions: "COUNT('grain_pricing_intake', signed_by_member=True)"
      - portal_pricings: "COUNT('grain_ledger', event_type='grain_price_set', pricing_channel='online_portal')"
      - desk_multiple: "K('desk_worked_multiple') if (signed_instructions >= 2 and portal_pricings == 0) else (1.0 if portal_pricings >= 1 else K('single_instruction_multiple'))"
      - chargeable_bu: "MX(0.0, rolled_bu - roll_allowance_bu)"
      - result: "RND(chargeable_bu * (roll_fee_rate + repeat_surcharge) * desk_multiple, 2)"
    compute_basis:
      instruction_bu: "Where neither of those holds, the roll moves the bushels the instruction names."
      open_bu: "Where the signed roll instruction names more bushels than the contract still owes, the roll moves the bushels the contract still owes, since no more than that remains to be moved."
      rolled_bu: "Where the signed roll instruction names more bushels than the contract still owes, the roll moves the bushels the contract still owes, since no more than that remains to be moved. Where the instruction names fewer bushels than the roll minimum the member's marketing programme sets, the roll moves that roll minimum. Where neither of those holds, the roll moves the bushels the instruction names."
      prior_rolls: "Where two or more roll confirmations already stand on the contract, the surcharge is the third-roll surcharge."
      repeat_surcharge: "Where two or more roll confirmations already stand on the contract, the surcharge is the third-roll surcharge. Where exactly one roll confirmation stands, the surcharge is the second-roll surcharge. Where no roll confirmation stands, no repeat surcharge is added."
      delivered_bu: "Where the net bushels of every load standing against the contract, whatever the disposition, reach the high volume threshold and eight or more such loads stand, the allowance is the high roll allowance."
      delivered_loads: "Where those net bushels reach the middle volume threshold, or five or more such loads stand, the allowance is the middle roll allowance."
      roll_allowance_bu: "Where the net bushels of every load standing against the contract, whatever the disposition, reach the high volume threshold and eight or more such loads stand, the allowance is the high roll allowance. Where those net bushels reach the middle volume threshold, or five or more such loads stand, the allowance is the middle roll allowance. Where neither of those holds, no allowance is given."
      input_account_status: "Where the account stands active but prepay booked falls short of that threshold, the base rate is the member roll rate."
      prepay_booked: "Where prepay booked on that account over the last twelve months reaches the prepay threshold and the account stands active, the base rate is the prepay roll rate."
      roll_fee_rate: "Where prepay booked on that account over the last twelve months reaches the prepay threshold and the account stands active, the base rate is the prepay roll rate. Where the account stands active but prepay booked falls short of that threshold, the base rate is the member roll rate. Where no active crop input account stands in the member's name, the base rate is the administrative charge per bushel the member's marketing programme carries."
      signed_instructions: "Where two or more signed instructions stand against the contract and no pricing has been worked through the online portal, the charge is taken at the desk-worked multiple, since every one of those instructions is worked by hand at the grain desk."
      portal_pricings: "Where pricing worked through the online portal stands on the contract, the charge is taken as arrived at."
      desk_multiple: "Where two or more signed instructions stand against the contract and no pricing has been worked through the online portal, the charge is taken at the desk-worked multiple, since every one of those instructions is worked by hand at the grain desk. Where pricing worked through the online portal stands on the contract, the charge is taken as arrived at. Where neither of those holds, the charge is taken at the single-instruction multiple."
      chargeable_bu: "The chargeable bushels are the bushels the roll moves less the crop-year roll allowance, never below zero, and the bushels the roll moves are the bushels the signed roll instruction names."
      result: "The charge a roll carries is the chargeable bushels times the roll rate the member is worked at, taken at the desk multiple, and the roll rate the member is worked at is the base roll rate plus the repeat surcharge."
    factors:
      - id: rolled_bushel_basis
        effect: method
        decides: rolled_bu
        bindings: [instruction_bu, open_bu, rolled_bu]
        ladder:
          - when: "the signed roll instruction names more bushels than the contract still owes"
            method: "the roll moves the bushels the contract still owes"
          - when: "the instruction names fewer bushels than the roll minimum the member's marketing programme sets"
            method: "the roll moves the programme's roll minimum"
          - when: "otherwise"
            method: "the roll moves the bushels the instruction names"
        baseline:
          rolled_bu: "instruction_bu"
        evidence: [history]
        cross_difficulty: null
      - id: repeat_roll_surcharge
        effect: parameter
        decides: repeat_surcharge
        bindings: [prior_rolls, repeat_surcharge]
        ladder:
          - when: "two or more roll confirmations already stand on the contract"
            value: "K('roll_surcharge_third')"
          - when: "exactly one roll confirmation stands on the contract"
            value: "K('roll_surcharge_second')"
          - when: "otherwise"
            value: "0.0"
        baseline:
          repeat_surcharge: "0.0"
        evidence: [history]
        cross_difficulty: null
      - id: crop_year_roll_allowance
        effect: parameter
        decides: roll_allowance_bu
        bindings: [delivered_bu, delivered_loads, roll_allowance_bu]
        ladder:
          - when: "the net bushels of every load standing against the contract, whatever the disposition, reach the high volume threshold and eight or more such loads stand"
            value: "K('roll_allowance_high')"
          - when: "those net bushels reach the middle volume threshold, or five or more such loads stand"
            value: "K('roll_allowance_mid')"
          - when: "otherwise"
            value: "0.0"
        baseline:
          roll_allowance_bu: "0.0"
        evidence: [history]
        cross_difficulty: null
      - id: input_account_roll_rate
        effect: parameter
        decides: roll_fee_rate
        bindings: [input_account_status, prepay_booked, roll_fee_rate]
        ladder:
          - when: "prepay booked on the member's crop input account over the last twelve months reaches the prepay threshold and the account stands active"
            value: "K('roll_fee_prepay')"
          - when: "the crop input account stands active but prepay booked falls short of that threshold"
            value: "K('roll_fee_member')"
          - when: "otherwise"
            value: "P('roll_fee_per_bushel_usd')"
        baseline:
          roll_fee_rate: "P('roll_fee_per_bushel_usd')"
        evidence: [cross_category, history]
        cross_difficulty: agronomy
      - id: desk_worked_multiple
        effect: method
        decides: desk_multiple
        bindings: [signed_instructions, portal_pricings, desk_multiple]
        ladder:
          - when: "two or more signed instructions stand against the contract and no pricing has been worked through the online portal"
            method: "the charge arrived at is taken at the desk-worked multiple"
          - when: "pricing worked through the online portal stands on the contract"
            method: "the charge is taken as arrived at"
          - when: "otherwise"
            method: "the charge arrived at is taken at the single-instruction multiple"
        baseline:
          desk_multiple: "1.0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The charge a roll carries is the chargeable bushels times the roll rate the member is worked at, taken at
        the desk multiple, and the roll rate the member is worked at is the base roll rate plus the repeat
        surcharge. The chargeable bushels are the bushels the roll moves less the crop-year roll allowance, never
        below zero, and the bushels the roll moves are the bushels the signed roll instruction names. The base roll
        rate is the administrative charge per bushel the member's marketing programme carries, the repeat surcharge
        is nil, the crop-year roll allowance is nil and the desk multiple is one. The charge is rounded to the cent
        once, on the figure reached after the chargeable bushels, the roll rate and the desk multiple have been
        multiplied together.
      params: [roll_fee_per_bushel_usd, roll_minimum_bushels]
    inputs:
      history:
        - {table: grain_ledger, aggregate: count, field: ledger_id, within_months: null, filters: {event_type: grain_contract_rolled}}
        - {table: grain_ledger, aggregate: sum, field: net_bushels, within_months: null, filters: {event_type: grain_delivery_applied}}
        - {table: grain_pricing_intake, aggregate: latest, field: requested_bushels, within_months: null, filters: {order_type: roll_request}}
        - {category: agronomy, table: agronomy_invoices, aggregate: sum, field: amount, within_months: 12, filters: {event_type: agronomy_prepay_booked}}
      cross_category: [agronomy]
  - id: grain_ext_settlement_payment_release
    base_policy_refs: [grain_evt_settlement, grain_evt_quality_discount, grain_evt_checkoff_and_retain]
    overwrite:
      - base_policy: grain_evt_settlement
        superseded_clause: >-
          Every deduction that attaches to those bushels is carried on the same statement, and what remains is the
          net payable.
        replaced_by: >-
          The money released on a settlement statement is the gross value the statement carries less the charges
          drawn onto it and less the per-unit capital retain withheld on the bushels it settles, never below zero;
          each charge and each allowance is worked to the cent as it is formed, and the money released is rounded
          to the cent once when they are brought together.
      - base_policy: grain_evt_checkoff_and_retain
        superseded_clause: >-
          The per-unit capital retain is withheld at the same time on programmes the catalogue marks as
          patronage-eligible, but it is not a charge: it is credited to the member's equity account and comes back
          to them on the board's revolvement cycle, so it is never refunded on request and never waived.
        replaced_by: >-
          Where the class the equity account is held under posts a maximum equity balance and the member's equity
          balance stands at or above it, nothing is retained and that share of the money is released to the member
          instead.
      - base_policy: grain_evt_quality_discount
        superseded_clause: >-
          Grade discounts are taken against the price of the bushels on that ticket and appear on the settlement
          statement the bushels are drawn onto; they are never taken a second time when the bushels are later
          priced.
        replaced_by: >-
          Where a grade allowance on damage or on foreign material arises, it is struck on the bushels the statement
          settles.
    trigger: on_request
    subject: [grain_settlement_paid]
    computes: payment_amount_usd
    target_tool: release_grain_settlement_payment_379b8a52
    params:
      freight_bushel_floor: 2500
      freight_half_rate: 0.0225
      damage_free_ceiling: 5.0
      damage_band_mid_ceiling: 10.0
      damage_band_upper_ceiling: 15.0
      damage_band_top: 0.1400
      damage_band_upper: 0.0750
      damage_band_lower: 0.0300
      foreign_high_ceiling: 2.0
      foreign_high_rate: 0.0300
      foreign_step_rate: 0.0150
      foreign_bushel_floor: 1000
      retain_step_down: 0.0015
      retain_year_floor_usd: 100
      storage_draw_floor_usd: 500
      storage_draw_cap_usd: 250
    rule: >
      The money released on a settlement statement is the gross value the statement carries less the charges
      drawn onto it and less the per-unit capital retain withheld on the bushels it settles, never below zero;
      each charge and each allowance is worked to the cent as it is formed, and the money released is rounded
      to the cent once when they are brought together. The charges drawn onto it are the charge lines on the grain ledger
      that name the statement. The per-unit capital retain is withheld on the bushels the statement settles at the
      per-unit retain the member's marketing programme carries. The freight differential recovered is nil, the
      grade allowance on damage is nil, the grade allowance on foreign material is nil and no storage charge is
      drawn. Where the money that remains falls under the settlement minimum the member's marketing programme
      carries, no payment is released and the balance is carried forward onto the member's next statement.
      Where a grade allowance on damage or on foreign material arises, it is struck on the bushels the statement
      settles. The money released on a statement is fixed
      only after the carry owed on every parcel that has left the member's unpriced position stands as a charge
      line on the grain ledger. Funds are released on a statement only after every signed roll instruction standing
      against the contract is matched by a roll confirmation on the grain ledger.
      Which charges are drawn onto the money released turns on where the contract stands in its life. Where the
      contract stands in delivering, every charge standing on the contract's grain ledger is drawn, whether it
      names the statement or not, because the desk clears the ledger each time it pays a live contract out. Where
      the contract stands in fully delivered or in settled standing, the charge lines naming the statement are
      drawn together with the roll charges standing on the contract. Where neither of those holds, only the charge
      lines naming the statement are drawn.
      The freight differential is recovered on the net bushels of the loads the member directed to the contract at
      the scale and received at a facility other than the one the contract calls for. Where two or more such loads stand and the bushels they carry reach the freight
      bushel floor, the differential is recovered at the per-bushel differential the member's marketing programme
      carries. Where one such load stands, or the bushels they carry fall short of that floor, the differential is
      recovered at the half differential rate. Where no load was received elsewhere, no freight differential is
      recovered.
      The grade allowance on damage is struck from the worst damage reading taken on every load standing against
      the contract, whatever the disposition, since a settlement carries the grade of the poorest grain it draws
      on, and the allowance is the
      rate of the lowest band whose ceiling the reading does not exceed. Where that reading is above the upper
      damage ceiling, the allowance is the top band rate. Where that reading is above the middle damage ceiling and
      at or below the upper damage ceiling, the allowance is the upper band rate. Where that reading is above the
      free damage ceiling and at or below the middle damage ceiling, the allowance is the lower band rate. Where the
      reading is at or below the free damage ceiling, no damage allowance is taken.
      The grade allowance on foreign material is struck from the worst foreign material reading taken on every load
      standing against the contract, whatever the disposition. Where that reading is above the high foreign material ceiling and the bushels
      the statement settles reach the foreign material bushel floor, the allowance is the high foreign material
      rate. Where that reading is above the free foreign material tolerance the member's marketing programme
      carries but that pair of conditions is not met, the allowance is the foreign material step rate. Where the
      reading is at or below that free tolerance, no foreign material allowance is taken.
      The per-unit capital retain follows the member's position in the cooperative's equity. Where the class the
      equity account is held under posts a maximum equity balance and the member's equity balance stands at or
      above it, nothing is retained and that share of the money is released to the member instead. Where the retains withheld on the
      member's equity ledger over the last twelve months reach the annual retain floor, the retain is withheld at
      the stepped-down retain rate. Where neither of those holds, the retain is withheld at the per-unit retain the
      member's marketing programme carries.
      Unpaid storage charges standing on the member's storage account are recovered from grain money where that
      account's programme provides for it. Where the unpaid storage charges reach the storage draw floor and the
      member's storage programme settles its charges from grain proceeds, the whole unpaid balance is drawn. Where
      the storage programme settles its charges from grain proceeds but the unpaid charges fall short of that
      floor, the charges are drawn up to the storage draw cap. Where the storage programme does not settle its
      charges from grain proceeds, no storage charge is drawn.
    prerequisite:
      - problem: grain_ext_delayed_price_carry_charge
        kind: value_input
        gate: all_deductions
        form: state
        policy_source: >-
          The money released on a statement is fixed only after the carry owed on every parcel that has left the
          member's unpriced position stands as a charge line on the grain ledger.
        condition: >-
          A delayed price service charge line stands on the grain ledger for every parcel that entered and has
          since left the member's unpriced position on this contract.
        resolved_by: book_delayed_price_carry_charge_ebb3e3fc
        effect: >-
          The charges standing on the contract's grain ledger rise by the carry owed on the parcel, so the charges
          drawn onto the money released take that higher value and the money released falls by the same amount.
      - problem: grain_ext_futures_month_roll_charge
        kind: value_input
        gate: roll_charges
        form: state
        policy_source: >-
          Funds are released on a statement only after every signed roll instruction standing against the contract
          is matched by a roll confirmation on the grain ledger.
        condition: >-
          Every signed roll instruction registered against the contract has a roll confirmation carrying its charge
          standing on the grain ledger.
        resolved_by: execute_futures_month_roll_2054762f
        effect: >-
          The roll charges standing on the contract rise by the charge the roll carries, so the charges drawn onto
          the money released take that higher value and the money released falls by the same amount.
    cross_category:
      - category: patronage
        as: branch
        reads: [equity_balance, variant_name, patronage_ledger.retain_amount, patronage_ledger.entry_date, patronage_ledger.event_type]
        note: the equity balance against the class maximum and the retains already withheld decide the per-unit capital retain
      - category: storage
        as: history
        reads: [variant_name, storage_charges.amount, storage_charges.paid_flag]
        note: the unpaid storage charges and the storage programme's settlement basis decide the storage draw
    compute:
      - statement_number: "LATEST('grain_ledger','settlement_number', date_field='settlement_date', event_type='grain_settlement_issued')"
      - statement_gross: "float(LATEST('grain_ledger','gross_amount', date_field='settlement_date', event_type='grain_settlement_issued') or 0)"
      - settled_bu: "float(LATEST('grain_ledger','settled_bushels', date_field='settlement_date', event_type='grain_settlement_issued') or 0)"
      - statement_charges: "SUM('grain_ledger','amount', event_type='grain_deduction_applied', settlement_number=statement_number)"
      - all_deductions: "SUM('grain_ledger','amount', event_type='grain_deduction_applied')"
      - roll_charges: "SUM('grain_ledger','amount', event_type='grain_contract_rolled')"
      - drawn_charges: "RND(all_deductions + roll_charges, 2) if F('status') == 'delivering' else (RND(statement_charges + roll_charges, 2) if (F('status') == 'fully_delivered' or F('status') == 'settled') else statement_charges)"
      - away_bu: "RND(SUM('grain_ledger','net_bushels', event_type='grain_delivery_applied', disposition='contract_application') - SUM('grain_ledger','net_bushels', event_type='grain_delivery_applied', disposition='contract_application', delivery_location=F('delivery_location')), 2)"
      - away_loads: "COUNT('grain_ledger', event_type='grain_delivery_applied', disposition='contract_application') - COUNT('grain_ledger', event_type='grain_delivery_applied', disposition='contract_application', delivery_location=F('delivery_location'))"
      - freight_rate: "P('freight_differential_per_bushel_usd') if (away_loads >= 2 and away_bu >= K('freight_bushel_floor')) else (K('freight_half_rate') if away_loads >= 1 else 0.0)"
      - freight_charge: "RND(away_bu * freight_rate, 2)"
      - worst_damage_pct: "MAX('grain_ledger','damage_pct', event_type='grain_delivery_applied')"
      - damage_rate: "K('damage_band_top') if worst_damage_pct > K('damage_band_upper_ceiling') else (K('damage_band_upper') if (worst_damage_pct > K('damage_band_mid_ceiling') and worst_damage_pct <= K('damage_band_upper_ceiling')) else (K('damage_band_lower') if (worst_damage_pct > K('damage_free_ceiling') and worst_damage_pct <= K('damage_band_mid_ceiling')) else 0.0))"
      - damage_charge: "RND(settled_bu * damage_rate, 2)"
      - worst_foreign_pct: "MAX('grain_ledger','foreign_material_pct', event_type='grain_delivery_applied')"
      - foreign_rate: "K('foreign_high_rate') if (worst_foreign_pct > K('foreign_high_ceiling') and settled_bu >= K('foreign_bushel_floor')) else (K('foreign_step_rate') if worst_foreign_pct > P('foreign_material_free_pct') else 0.0)"
      - foreign_charge: "RND(settled_bu * foreign_rate, 2)"
      - equity_balance: "float(CFIELD('patronage','equity_balance') or 0)"
      - equity_ceiling: "float(CPARAM('patronage','maximum_equity_balance_usd') or 0)"
      - retains_withheld: "XSUM('patronage','patronage_ledger','retain_amount', within_months=12, date_field='entry_date', event_type='patronage_retain_withheld')"
      - retain_rate: "0.0 if (equity_ceiling > 0 and equity_balance >= equity_ceiling) else (K('retain_step_down') if retains_withheld >= K('retain_year_floor_usd') else P('per_unit_retain_per_bushel_usd'))"
      - retain_charge: "RND(settled_bu * retain_rate, 2)"
      - storage_unpaid: "XSUM('storage','storage_charges','amount', paid_flag=False)"
      - storage_from_proceeds: "CPARAM('storage','storage_settlement_from_grain_proceeds')"
      - storage_draw: "storage_unpaid if (storage_unpaid >= K('storage_draw_floor_usd') and storage_from_proceeds == True) else (MN(storage_unpaid, K('storage_draw_cap_usd')) if storage_from_proceeds == True else 0.0)"
      - net_payable: "MX(0.0, RND(statement_gross - drawn_charges - freight_charge - damage_charge - foreign_charge - retain_charge - storage_draw, 2))"
      - result: "0.0 if net_payable < P('settlement_minimum_amount_usd') else net_payable"
    compute_basis:
