        bindings: [away_loads, freight_rate]
        ladder:
          - when: "two or more loads were received at a facility other than the one the contract calls for and the bushels they carry reach the freight bushel floor"
            value: "P('freight_differential_per_bushel_usd')"
          - when: "one load was received elsewhere, or the bushels those loads carry fall short of that floor"
