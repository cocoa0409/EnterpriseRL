  - id: grain_ext_short_crop_amendment
    base_policy_refs: [grain_amendment, grain_agg_open_position_cap]
    overwrite: []
    trigger: state_due
    subject: [grain_contract_amended]
    computes: revised_contracted_bushels
    target_tool: register_contract_amendment_850dd44e
    params:
      off_facility_allowance_pct: 0.75
      hold_shrink_long_pct: 0.75
      hold_shrink_short_pct: 0.40
      hold_long_days: 28
      hold_short_days: 14
      retention_short_crop: 0.40
      retention_part_crop: 0.65
    rule: >
      A member whose crop has come in short of the bushels they sold is amended in writing rather than left to run
      into default, and one amendment does two things at once: it moves the last day of the delivery window out by
      the full extension allowance the member's marketing programme carries, counted in calendar days from the last
      day the contract currently calls for, and it restates the bushels the contract commits. The bushels the
      amendment leaves the contract committing are the bushels its tickets credit plus the retained share of the
      shortfall, struck in whole bushels, a part bushel taken to the nearest whole bushel and a half bushel taken upward, and they are never fewer than the net bushels the tickets standing against
      the contract, whatever the disposition, carry, since bushels already in the pit cannot be cut away. The shortfall is the bushels the
      contract commits before the amendment less the bushels its tickets credit, never below zero. An amendment does
      not touch the bushels still owed on the contract: those follow the loads the member directed to the contract
      at the scale and are not restated here. Only the tickets received at the facility the contract calls for are credited, at the net bushels
      written on them. The credited bushels are then reduced by the hold shrink, which is nil, and the retained
      share of the shortfall is the whole of it. The bushels an amendment leaves the contract committing are settled
      only once the contract stands countersigned and binding on both sides, with the committed bushels it was
      countersigned for standing on the record.
      Which tickets are credited, and at what, turns on where they were received; every ticket standing against
      the contract counts here, whatever the disposition. Where two or more tickets stand
      against the contract and every one of them was received at the facility the contract calls for, all of them
      are credited at the net bushels written on them. Where tickets stand that were received at another facility,
      the tickets received at the facility the contract calls for are credited at their net bushels and the others
      at their net bushels less the off-facility allowance. Where neither of those holds, only the tickets received
      at the facility the contract calls for are credited.
      The retained share of the shortfall is the part of the bushels the member has not delivered that the
      cooperative has already sold on and will not release by amendment; the rest of the shortfall comes off the
      contract. Where the tickets credit at least half the bushels the contract commits and four or more tickets
      stand against it, the retained share is the short-crop retention. Where tickets stand against the contract but
      that pair of conditions is not met, the retained share is the part-crop retention. Where no ticket stands
      against the contract, the whole of the shortfall is retained and the amendment releases nothing.
      The hold shrink is taken on the credited bushels, because grain that sits in the elevator's hands before it is
      applied to a contract loses condition in handling. Where the tickets have stood held longer than the long hold
      period and two or more of them were probed above the moisture base, the hold shrink is the long hold rate.
      Where the tickets have stood held longer than the short hold period but that pair of conditions is not met,
      the hold shrink is the short hold rate. Where neither of those holds, no hold shrink is taken.
      The hold period is counted in calendar days up to the day the amendment is registered, and where it runs from
      is read off the ledger. Where the ledger shows the last load posted later than the day it was received, the
      hold runs from the day it was posted, since grain is not held to the member's account until it is on the
      books. Where the last load was received before the first day of the contract's delivery window, the hold runs
      from the first day of that window. Where neither of those holds, the hold runs from the day the last load was
      received.
    prerequisite:
      - problem: grain_ext_countersigned_bushel_ceiling
        kind: value_input
        gate: committed_bu
        form: state
        policy_source: >-
          The bushels an amendment leaves the contract committing are settled only once the contract stands
          countersigned and binding on both sides, with the committed bushels it was countersigned for standing on
          the record.
        condition: >-
          The contract stands in active or delivering standing and its committed bushels are the figure it was
          countersigned for.
        resolved_by: countersign_grain_contract_d95afc7d
        effect: >-
          The bushels the contract commits before the amendment are read from the contract record, so once the
          contract is countersigned they take the countersigned figure and the shortfall follows it.
    cross_category: []
    compute:
      - committed_bu: "float(F('contracted_bushels'))"
      - ticket_net_all: "SUM('grain_ledger','net_bushels', event_type='grain_delivery_applied')"
      - ticket_net_home: "SUM('grain_ledger','net_bushels', event_type='grain_delivery_applied', delivery_location=F('delivery_location'))"
      - ticket_net_away: "RND(ticket_net_all - ticket_net_home, 2)"
      - home_tickets: "COUNT('grain_ledger', event_type='grain_delivery_applied', delivery_location=F('delivery_location'))"
      - away_tickets: "COUNT('grain_ledger', event_type='grain_delivery_applied') - COUNT('grain_ledger', event_type='grain_delivery_applied', delivery_location=F('delivery_location'))"
      - credited_tickets_bu: "RND(ticket_net_all, 2) if (away_tickets == 0 and home_tickets >= 2) else (RND(ticket_net_home + ticket_net_away * (1 - K('off_facility_allowance_pct') / 100), 2) if away_tickets >= 1 else ticket_net_home)"
      - last_ticket_day: "LATEST('grain_ledger','delivery_date', date_field='delivery_date', event_type='grain_delivery_applied')"
      - last_posted_day: "LATEST('grain_ledger','posted_date', date_field='posted_date', event_type='grain_delivery_applied')"
      - hold_days: "MX(0, DAYS(last_posted_day, NOW)) if DAYS(last_ticket_day, last_posted_day) > 0 else (MX(0, DAYS(F('delivery_start_date'), NOW)) if DAYS(last_ticket_day, F('delivery_start_date')) > 0 else MX(0, DAYS(last_ticket_day, NOW)))"
      - conditioned_tickets: "COUNT('grain_ledger', event_type='grain_delivery_applied', condition_flag='tough') + COUNT('grain_ledger', event_type='grain_delivery_applied', condition_flag='damp') + COUNT('grain_ledger', event_type='grain_delivery_applied', condition_flag='wet')"
      - hold_shrink_pct: "K('hold_shrink_long_pct') if (hold_days > K('hold_long_days') and conditioned_tickets >= 2) else (K('hold_shrink_short_pct') if hold_days > K('hold_short_days') else 0.0)"
      - credited_bu: "RND(credited_tickets_bu * (1 - hold_shrink_pct / 100), 2)"
      - shortfall_bu: "MX(0.0, RND(committed_bu - credited_bu, 2))"
      - ticket_count: "COUNT('grain_ledger', event_type='grain_delivery_applied')"
      - retention_rate: "K('retention_short_crop') if (credited_tickets_bu >= committed_bu / 2 and ticket_count >= 4) else (K('retention_part_crop') if ticket_count >= 1 else 1.0)"
      - result: "MX(ticket_net_all, float(int(credited_bu + retention_rate * shortfall_bu + 0.5)))"
    compute_basis:
      committed_bu: "The shortfall is the bushels the contract commits before the amendment less the bushels its tickets credit, never below zero."
      ticket_net_all: "Where two or more tickets stand against the contract and every one of them was received at the facility the contract calls for, all of them are credited at the net bushels written on them."
      ticket_net_home: "Only the tickets received at the facility the contract calls for are credited, at the net bushels written on them."
      ticket_net_away: "Where tickets stand that were received at another facility, the tickets received at the facility the contract calls for are credited at their net bushels and the others at their net bushels less the off-facility allowance."
      home_tickets: "Where two or more tickets stand against the contract and every one of them was received at the facility the contract calls for, all of them are credited at the net bushels written on them."
      away_tickets: "Where tickets stand that were received at another facility, the tickets received at the facility the contract calls for are credited at their net bushels and the others at their net bushels less the off-facility allowance."
      credited_tickets_bu: "Where two or more tickets stand against the contract and every one of them was received at the facility the contract calls for, all of them are credited at the net bushels written on them. Where tickets stand that were received at another facility, the tickets received at the facility the contract calls for are credited at their net bushels and the others at their net bushels less the off-facility allowance. Where neither of those holds, only the tickets received at the facility the contract calls for are credited."
      last_ticket_day: "Where neither of those holds, the hold runs from the day the last load was received."
      last_posted_day: "Where the ledger shows the last load posted later than the day it was received, the hold runs from the day it was posted, since grain is not held to the member's account until it is on the books."
      hold_days: "Where the ledger shows the last load posted later than the day it was received, the hold runs from the day it was posted, since grain is not held to the member's account until it is on the books. Where the last load was received before the first day of the contract's delivery window, the hold runs from the first day of that window. Where neither of those holds, the hold runs from the day the last load was received."
      conditioned_tickets: "Where the tickets have stood held longer than the long hold period and two or more of them were probed above the moisture base, the hold shrink is the long hold rate."
      hold_shrink_pct: "Where the tickets have stood held longer than the long hold period and two or more of them were probed above the moisture base, the hold shrink is the long hold rate. Where the tickets have stood held longer than the short hold period but that pair of conditions is not met, the hold shrink is the short hold rate. Where neither of those holds, no hold shrink is taken."
      credited_bu: "The credited bushels are then reduced by the hold shrink, which is nil, and the retained share of the shortfall is the whole of it."
      shortfall_bu: "The shortfall is the bushels the contract commits before the amendment less the bushels its tickets credit, never below zero."
      ticket_count: "Where the tickets credit at least half the bushels the contract commits and four or more tickets stand against it, the retained share is the short-crop retention."
      retention_rate: "Where the tickets credit at least half the bushels the contract commits and four or more tickets stand against it, the retained share is the short-crop retention. Where tickets stand against the contract but that pair of conditions is not met, the retained share is the part-crop retention. Where no ticket stands against the contract, the whole of the shortfall is retained and the amendment releases nothing."
      result: "The bushels the amendment leaves the contract committing are the bushels its tickets credit plus the retained share of the shortfall, struck in whole bushels, a part bushel taken to the nearest whole bushel and a half bushel taken upward, and they are never fewer than the net bushels the tickets standing against the contract, whatever the disposition, carry, since bushels already in the pit cannot be cut away."
    factors:
      - id: ticket_credit_selection
        effect: method
        decides: credited_tickets_bu
        bindings: [home_tickets, away_tickets, credited_tickets_bu]
        ladder:
          - when: "two or more tickets stand against the contract and every one of them was received at the facility the contract calls for"
            method: "all the tickets are credited at the net bushels written on them"
          - when: "tickets stand that were received at another facility"
            method: "the tickets received at the facility the contract calls for are credited at their net bushels and the others at their net bushels less the off-facility allowance"
          - when: "otherwise"
            method: "only the tickets received at the facility the contract calls for are credited"
        baseline:
          credited_tickets_bu: "ticket_net_home"
        evidence: [history]
        cross_difficulty: null
      - id: short_crop_retention
        effect: parameter
        decides: retention_rate
        bindings: [ticket_count, retention_rate]
        ladder:
          - when: "the tickets credit at least half the bushels the contract commits and four or more tickets stand against it"
            value: "K('retention_short_crop')"
          - when: "tickets stand against the contract but that pair of conditions is not met"
            value: "K('retention_part_crop')"
          - when: "otherwise"
            value: "1.0"
        baseline:
          retention_rate: "1.0"
        evidence: [history]
        cross_difficulty: null
      - id: held_ticket_hold_shrink
        effect: parameter
        decides: hold_shrink_pct
        bindings: [conditioned_tickets, hold_shrink_pct]
        ladder:
          - when: "the tickets have stood held longer than the long hold period and two or more of them were probed above the moisture base"
            value: "K('hold_shrink_long_pct')"
          - when: "the tickets have stood held longer than the short hold period but that pair of conditions is not met"
            value: "K('hold_shrink_short_pct')"
          - when: "otherwise"
            value: "0.0"
        baseline:
          hold_shrink_pct: "0.0"
        evidence: [history]
        cross_difficulty: null
      - id: hold_period_anchor
        effect: method
        decides: hold_days
        bindings: [last_ticket_day, last_posted_day, hold_days]
        ladder:
          - when: "the ledger shows the last load posted later than the day it was received"
            method: "the hold runs from the day the last load was posted to the ledger"
          - when: "the last load was received before the first day of the contract's delivery window"
            method: "the hold runs from the first day of the contract's delivery window"
          - when: "otherwise"
            method: "the hold runs from the day the last load was received"
        baseline:
          hold_days: "MX(0, DAYS(last_ticket_day, NOW))"
        evidence: [history, date]
        cross_difficulty: null
    baseline:
      rule: >-
        A member whose crop has come in short of the bushels they sold is amended in writing rather than left to run
        into default, and one amendment does two things at once: it moves the last day of the delivery window out by
        the full extension allowance the member's marketing programme carries, counted in calendar days from the last
        day the contract currently calls for, and it restates the bushels the contract commits. The bushels the
        amendment leaves the contract committing are the bushels its tickets credit plus the retained share of the
        shortfall, struck in whole bushels, a part bushel taken to the nearest whole bushel and a half bushel taken upward, and they are never fewer than the net bushels the tickets standing against
        the contract, whatever the disposition, carry, since bushels already in the pit cannot be cut away. The shortfall is the bushels the
        contract commits before the amendment less the bushels its tickets credit, never below zero. An amendment does
        not touch the bushels still owed on the contract: those follow the loads the member directed to the contract
        at the scale and are not restated here. Only the tickets received at the facility the contract calls for are credited, at the net bushels
        written on them. The credited bushels are then reduced by the hold shrink, which is nil, and the retained
        share of the shortfall is the whole of it.
      params: [delivery_extension_days]
    inputs:
      history:
        - {table: grain_ledger, aggregate: sum, field: net_bushels, within_months: null, filters: {event_type: grain_delivery_applied}}
        - {table: grain_ledger, aggregate: latest, field: posted_date, within_months: null, filters: {event_type: grain_delivery_applied}}
      cross_category: []
  - id: grain_ext_contract_buyout_charge
    base_policy_refs: [grain_buyout]
    overwrite:
      - base_policy: grain_buyout
        superseded_clause: >-
          The member has signed a buyout instruction and the grain desk has registered it before the contract is
          cancelled; a telephone call saying the crop failed starts the conversation but does not cancel anything.
        replaced_by: >-
          A contract is closed out only by the member's own hand: the member puts the buyout through themselves,
          and no instruction the member has lodged with the grain desk for another purpose stands as authority to
          close a contract out.
      - base_policy: grain_buyout
        superseded_clause: >-
          Where the market has fallen the loss is zero and only the administrative fee is charged; the cooperative
          does not pay the member the difference.
        replaced_by: >-
          Where the release rate, the loss multiplier and the patron release factor between them come to nothing,
          the bushels carry nothing and only the administrative fee and the collection charge are charged; the
          cooperative does not pay the member the difference.
      - base_policy: grain_buyout
        superseded_clause: >-
          The buyout price is the market loss on the undelivered bushels, being the amount by which the
          replacement bid on the day of cancellation exceeds the contract price, multiplied by the programme's
          loss multiplier and never less than zero, plus the programme's flat administrative fee.
        replaced_by: >-
          The buyout charge is the undelivered bushels taken at the release rate, at the loss multiplier and at the
          patron release factor, plus the administrative fee and the collection charge.
    trigger: on_request
    subject: [grain_contract_cancelled]
    computes: buyout_charge_usd
    target_tool: execute_contract_buyout_11de6ced
    params:
      release_rate_delivered: 0.1600
      loss_multiplier_most: 0.75
      loss_multiplier_part: 0.90
      admin_fee_amended: 275.00
      admin_fee_part_delivered: 140.00
      collection_charge_arrears: 60.00
      collection_charge_standard: 25.00
      patron_release_voting: 0.90
      patron_release_member: 0.95
    rule: >
      The buyout charge is the undelivered bushels taken at the release rate, at the loss multiplier and at the
      patron release factor, plus the administrative fee and the collection charge. The undelivered bushels are the
      bushels the contract commits less the net bushels the tickets standing against it, whatever the disposition, carry, struck in whole
      bushels, a part bushel taken to the nearest whole bushel and a half bushel taken upward, and never below zero. The release rate is the default penalty per bushel the member's marketing
      programme carries, the loss multiplier is the loss multiplier that programme carries, the patron release
      factor is one, the administrative fee is the flat administrative fee the programme carries and no collection
      charge is added. The charge is rounded to the cent once, on the figure reached after the undelivered bushels,
      the release rate, the loss multiplier, the patron release factor, the administrative fee and the collection
      charge have been brought together. Where the release rate, the loss multiplier and the
      patron release factor between them come to nothing, the bushels carry nothing and only the administrative fee
      and the collection charge are charged; the cooperative does not pay the member the difference. A contract is closed out only by the member's own hand: the member puts the
      buyout through themselves, and no instruction the member has lodged with the grain desk for another purpose
      stands as authority to close a contract out. The buyout charge is struck only after the last day of the
      contract's delivery window falls later than the day the contract is closed out, with the bushels the contract
      commits standing as the same written change leaves them.
      The release rate is the per-bushel charge the cooperative keeps on bushels it releases, and which rate applies
      turns on what the programme sold the member. Where the contract's programme carries a price floor premium, the
      release is struck at that floor premium, since the cooperative bought the floor on bushels that will now never
      be delivered. Where the programme carries no floor premium and tickets stand against the contract, whatever
      the disposition, the release is struck at the delivered release rate. Where neither of those holds, the release is struck at the default
      penalty per bushel the programme carries, which is what the same bushels would carry if the member simply let
      the window close.
      The loss multiplier falls with what the member has already delivered against the contract, counting every
      load standing against it whatever the disposition, because grain in the pit is grain the cooperative no
      longer has to replace. Where the member has delivered at least half the
      bushels the contract commits and three or more loads stand against it, the multiplier is the most-delivered
      multiplier. Where loads stand against the contract but that pair of conditions is not met, the multiplier is
      the part-delivered multiplier. Where no load stands against the contract, the multiplier is the one the
      member's marketing programme carries.
      The patron release factor recognises the member's standing in the cooperative's equity. Where the member's
      equity account carries voting rights and the equity ledger records grain business inside the last twelve
      months, the release is taken at the voting patron factor. Where an active equity account stands in the
      member's name but that pair of conditions is not met, it is taken at the member patron factor. Where no active
      equity account stands, the release is taken at a factor of one.
      The administrative fee follows the work the desk has already done on the contract. Where the contract carries
      a registered amendment and loads the member directed to the contract at the scale stand applied to it, the
      fee is the amended-contract fee. Where such loads stand applied to the contract but no amendment is
      registered against it, the fee is the part-delivered fee. Where no such load stands applied, the fee is the
      flat administrative fee the member's marketing programme carries.
      The collection charge covers recovering the buyout where there is no grain money to draw it from. Where no
      settlement statement stands on the contract to draw the charge on and the member's crop input account stands
      past due or suspended, the collection charge is the arrears collection charge. Where no settlement statement
      stands on the contract to draw the charge on but the crop input account stands in neither of those standings,
      the collection charge is the standard collection charge. Where a settlement statement stands on the contract,
      no collection charge is added.
    prerequisite:
      - problem: grain_ext_short_crop_amendment
        kind: value_input
        gate: undelivered_bu
        form: state
        policy_source: >-
          The buyout charge is struck only after the last day of the contract's delivery window falls later than the
          day the contract is closed out, with the bushels the contract commits standing as the same written change
          leaves them.
        condition: >-
          The last day of the contract's delivery window falls later than the day of the buyout, and the bushels the
          contract commits are the figure the written change leaves.
        resolved_by: register_contract_amendment_850dd44e
        effect: >-
          The bushels the contract commits are read from the contract record, so once the written change is
          registered the undelivered bushels and the administrative fee both take the figures it leaves.
    cross_category:
      - category: agronomy
        as: branch
        reads: [status]
        note: the standing of the member's crop input account decides the collection charge where there is no settlement to draw the buyout on
      - category: patronage
        as: branch
        reads: [status, voting_rights, patronage_ledger.patronage_units, patronage_ledger.entry_date, patronage_ledger.event_type]
        note: the equity account's voting standing and the grain business the ledger records decide the patron release factor
    compute:
      - committed_bu: "float(F('contracted_bushels'))"
      - delivered_bu: "SUM('grain_ledger','net_bushels', event_type='grain_delivery_applied')"
      - undelivered_bu: "MX(0.0, float(int(committed_bu - delivered_bu + 0.5)))"
      - release_tickets: "COUNT('grain_ledger', event_type='grain_delivery_applied')"
      - release_rate: "P('minimum_price_premium_per_bushel_usd') if P('minimum_price_premium_per_bushel_usd') > 0 else (K('release_rate_delivered') if release_tickets >= 1 else P('default_penalty_per_bushel_usd'))"
      - delivered_loads: "COUNT('grain_ledger', event_type='grain_delivery_applied')"
      - loss_multiplier: "K('loss_multiplier_most') if (delivered_bu >= committed_bu / 2 and delivered_loads >= 3) else (K('loss_multiplier_part') if delivered_loads >= 1 else P('buyout_market_loss_multiplier'))"
      - equity_voting: "CFIELD('patronage','voting_rights')"
      - equity_status: "CFIELD('patronage','status')"
      - marketed_recent_units: "XSUM('patronage','patronage_ledger','patronage_units', within_months=12, date_field='entry_date', event_type='patronage_units_accrued', allocation_basis='grain_bushels')"
      - patron_release_factor: "K('patron_release_voting') if (equity_voting == True and marketed_recent_units > 0) else (K('patron_release_member') if equity_status == 'active' else 1.0)"
      - amendments_registered: "float(F('amendment_count') or 0)"
      - applied_loads: "COUNT('grain_ledger', event_type='grain_delivery_applied', disposition='contract_application')"
      - admin_fee: "K('admin_fee_amended') if (amendments_registered >= 1 and applied_loads >= 1) else (K('admin_fee_part_delivered') if applied_loads >= 1 else P('buyout_admin_fee_usd'))"
      - settlements_standing: "COUNT('grain_ledger', event_type='grain_settlement_issued')"
      - input_account_status: "CFIELD('agronomy','status')"
      - collection_charge: "K('collection_charge_arrears') if (settlements_standing == 0 and (input_account_status == 'past_due' or input_account_status == 'suspended')) else (K('collection_charge_standard') if settlements_standing == 0 else 0.0)"
      - result: "RND(MX(0.0, undelivered_bu * release_rate * loss_multiplier * patron_release_factor) + admin_fee + collection_charge, 2)"
    compute_basis:
      committed_bu: "The undelivered bushels are the bushels the contract commits less the net bushels the tickets standing against it, whatever the disposition, carry, struck in whole bushels, a part bushel taken to the nearest whole bushel and a half bushel taken upward, and never below zero."
      delivered_bu: "The undelivered bushels are the bushels the contract commits less the net bushels the tickets standing against it, whatever the disposition, carry, struck in whole bushels, a part bushel taken to the nearest whole bushel and a half bushel taken upward, and never below zero."
      undelivered_bu: "The undelivered bushels are the bushels the contract commits less the net bushels the tickets standing against it, whatever the disposition, carry, struck in whole bushels, a part bushel taken to the nearest whole bushel and a half bushel taken upward, and never below zero."
      release_tickets: "Where the programme carries no floor premium and tickets stand against the contract, whatever the disposition, the release is struck at the delivered release rate."
      release_rate: "Where the contract's programme carries a price floor premium, the release is struck at that floor premium, since the cooperative bought the floor on bushels that will now never be delivered. Where the programme carries no floor premium and tickets stand against the contract, whatever the disposition, the release is struck at the delivered release rate. Where neither of those holds, the release is struck at the default penalty per bushel the programme carries, which is what the same bushels would carry if the member simply let the window close."
      delivered_loads: "Where loads stand against the contract but that pair of conditions is not met, the multiplier is the part-delivered multiplier."
      loss_multiplier: "Where the member has delivered at least half the bushels the contract commits and three or more loads stand against it, the multiplier is the most-delivered multiplier. Where loads stand against the contract but that pair of conditions is not met, the multiplier is the part-delivered multiplier. Where no load stands against the contract, the multiplier is the one the member's marketing programme carries."
      equity_voting: "Where the member's equity account carries voting rights and the equity ledger records grain business inside the last twelve months, the release is taken at the voting patron factor."
      equity_status: "Where an active equity account stands in the member's name but that pair of conditions is not met, it is taken at the member patron factor."
      marketed_recent_units: "Where the member's equity account carries voting rights and the equity ledger records grain business inside the last twelve months, the release is taken at the voting patron factor."
      patron_release_factor: "Where the member's equity account carries voting rights and the equity ledger records grain business inside the last twelve months, the release is taken at the voting patron factor. Where an active equity account stands in the member's name but that pair of conditions is not met, it is taken at the member patron factor. Where no active equity account stands, the release is taken at a factor of one."
      amendments_registered: "Where the contract carries a registered amendment and loads the member directed to the contract at the scale stand applied to it, the fee is the amended-contract fee."
      applied_loads: "Where such loads stand applied to the contract but no amendment is registered against it, the fee is the part-delivered fee."
      admin_fee: "Where the contract carries a registered amendment and loads the member directed to the contract at the scale stand applied to it, the fee is the amended-contract fee. Where such loads stand applied to the contract but no amendment is registered against it, the fee is the part-delivered fee. Where no such load stands applied, the fee is the flat administrative fee the member's marketing programme carries."
      settlements_standing: "Where a settlement statement stands on the contract, no collection charge is added."
      input_account_status: "Where no settlement statement stands on the contract to draw the charge on and the member's crop input account stands past due or suspended, the collection charge is the arrears collection charge."
      collection_charge: "Where no settlement statement stands on the contract to draw the charge on and the member's crop input account stands past due or suspended, the collection charge is the arrears collection charge. Where no settlement statement stands on the contract to draw the charge on but the crop input account stands in neither of those standings, the collection charge is the standard collection charge. Where a settlement statement stands on the contract, no collection charge is added."
      result: "The charge is rounded to the cent once, on the figure reached after the undelivered bushels, the release rate, the loss multiplier, the patron release factor, the administrative fee and the collection charge have been brought together."
    factors:
      - id: release_rate_basis
        effect: method
        decides: release_rate
        bindings: [release_tickets, release_rate]
        ladder:
          - when: "the contract's programme carries a price floor premium"
            method: "the release is struck at the floor premium per bushel the programme carries"
          - when: "the programme carries no floor premium and tickets stand against the contract, whatever the disposition"
            method: "the release is struck at the delivered release rate"
          - when: "otherwise"
            method: "the release is struck at the default penalty per bushel the programme carries"
        baseline:
          release_rate: "P('default_penalty_per_bushel_usd')"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: delivered_share_loss_multiplier
        effect: parameter
        decides: loss_multiplier
        bindings: [delivered_loads, loss_multiplier]
        ladder:
          - when: "the member has delivered at least half the bushels the contract commits and three or more loads stand against it"
            value: "K('loss_multiplier_most')"
          - when: "loads stand against the contract but that pair of conditions is not met"
            value: "K('loss_multiplier_part')"
          - when: "otherwise"
            value: "P('buyout_market_loss_multiplier')"
        baseline:
          loss_multiplier: "P('buyout_market_loss_multiplier')"
