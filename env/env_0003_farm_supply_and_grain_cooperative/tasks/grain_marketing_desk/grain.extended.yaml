        evidence: [history]
        cross_difficulty: null
      - id: equity_position_retain_rate
        effect: parameter
        decides: retain_rate
        bindings: [equity_balance, equity_ceiling, retains_withheld, retain_rate]
        ladder:
          - when: "the class the equity account is held under posts a maximum equity balance and the member's equity balance stands at or above it"
            value: "0.0"
          - when: "the retains withheld on the member's equity ledger over the last twelve months reach the annual retain floor"
            value: "K('retain_step_down')"
          - when: "otherwise"
            value: "P('per_unit_retain_per_bushel_usd')"
        baseline:
          retain_rate: "P('per_unit_retain_per_bushel_usd')"
        evidence: [cross_category, history]
        cross_difficulty: patronage
      - id: storage_charge_draw
        effect: parameter
        decides: storage_draw
        bindings: [storage_unpaid, storage_from_proceeds, storage_draw]
        ladder:
          - when: "the unpaid storage charges reach the storage draw floor and the member's storage programme settles its charges from grain proceeds"
            value: "the whole unpaid storage balance"
          - when: "the storage programme settles its charges from grain proceeds but the unpaid charges fall short of that floor"
            value: "the unpaid storage balance, up to K('storage_draw_cap_usd')"
          - when: "otherwise"
            value: "0.0"
        baseline:
          storage_draw: "0.0"
        evidence: [cross_category, tier_param]
        cross_difficulty: storage
    baseline:
      rule: >-
        The money released on a settlement statement is the gross value the statement carries less the charges
        drawn onto it and less the per-unit capital retain withheld on the bushels it settles, never below zero;
        each charge and each allowance is worked to the cent as it is formed, and the money released is rounded
        to the cent once when they are brought together. The charges drawn onto it are the charge lines on the grain ledger
        that name the statement. The per-unit capital retain is withheld on the bushels the statement settles at the
        per-unit retain the member's marketing programme carries. The freight differential recovered is nil, the
        grade allowance on damage is nil, the grade allowance on foreign material is nil and no storage charge is
        drawn. Where the money that remains falls under the settlement minimum the member's marketing programme
        carries, no payment is released and the balance is carried forward onto the member's next statement.
      params: [per_unit_retain_per_bushel_usd]
    inputs:
      history:
        - {table: grain_ledger, aggregate: latest, field: gross_amount, within_months: null, filters: {event_type: grain_settlement_issued}}
        - {table: grain_ledger, aggregate: sum, field: amount, within_months: null, filters: {event_type: grain_deduction_applied}}
        - {table: grain_ledger, aggregate: max, field: damage_pct, within_months: null, filters: {event_type: grain_delivery_applied}}
        - {category: patronage, table: patronage_ledger, aggregate: sum, field: retain_amount, within_months: 12, filters: {event_type: patronage_retain_withheld}}
        - {category: storage, table: storage_charges, aggregate: sum, field: amount, within_months: null, filters: {paid_flag: false}}
      cross_category: [patronage, storage]
  - id: grain_ext_countersigned_bushel_ceiling
    base_policy_refs: [grain_lifecycle_progression, grain_agg_open_position_cap, grain_agg_multi_holding]
    overwrite:
      - base_policy: grain_agg_open_position_cap
        superseded_clause: >-
          A new contract is written only where the bushels already open plus the bushels being committed stay at or
          under the ceiling.
        replaced_by: >-
          The bushels a contract is countersigned for are the bushels the member applied for or the marketing
          ceiling, whichever is the smaller, struck in whole bushels, a part bushel taken to the nearest whole bushel and a half bushel taken upward, and never below zero.
      - base_policy: grain_agg_open_position_cap
        superseded_clause: >-
          The member's open forward position for a crop year is the bushels still owed on every contract of theirs
          for that crop year that stands in active or delivering, and it is measured against the member's
          production history average, which is the average net bushels they delivered per crop year over the
          completed crop years in the production history window, a member with fewer completed years being
          measured on the years they have.
        replaced_by: >-
          The marketing ceiling is the member's marketing average taken at the ceiling percentage, with the
          hauled-load credit added and the forward reserve taken off, and the member's marketing average is the
          bushels the equity ledger records the member marketing over the last thirty-six months, divided by the
          production history window the marketing programme carries.
    trigger: state_due
    subject: [grain_contract_activated]
    computes: countersigned_bushels
    target_tool: countersign_grain_contract_d95afc7d
    params:
      recent_history_years: 2
      cap_pct_established: 88.0
      cap_pct_member: 78.0
      established_marketer_bushels: 55000
      load_credit_high: 250
      load_credit_low: 100
      reserve_near: 1500
      reserve_standard: 3000
      near_window_days: 90
    rule: >
      The bushels a contract is countersigned for are the bushels the member applied for or the marketing
      ceiling, whichever is the smaller, struck in whole bushels, a part bushel taken to the nearest whole bushel and a half bushel taken upward, and never below zero. The marketing ceiling is
      the member's marketing average taken at the ceiling percentage, with the hauled-load credit added and the
      forward reserve taken off, and the member's marketing average is the bushels the equity ledger records the
      member marketing over the last thirty-six months, divided by the production history window the marketing
      programme carries. Only the bushels the ledger records as marketed business are counted, and the bushels of
      an allocation posted on them or a retain withheld from them are not counted again. The ceiling percentage is
      the share of production the member's marketing programme allows to stand sold forward. No hauled-load credit
      is added, and the forward reserve is the standard forward reserve. The marketing average and the ceiling are
      each struck in whole bushels, a part bushel taken to the nearest whole bushel and a half bushel taken upward, before the hauled-load credit and the forward reserve are applied to
      them.
      How the marketing average is taken depends on how recent the member's marketing business is. Where the
      equity ledger records grain business inside the last twelve months and the equity account stands active, the
      average is the last twenty-four months of marketed bushels divided by the recent history window, since a
      member trading now is measured on the years they have just traded. Where the ledger records grain business
      inside the last twelve months but no active equity account stands, the average is the bushels marketed in
      those twelve months taken as they stand. Where the ledger records no grain business inside the last twelve
      months, the average is the last thirty-six months of marketed bushels divided by the production history
      window the marketing programme carries.
      The ceiling percentage rises with what the member has marketed through the cooperative and with the standing
      of their equity. Where the bushels the equity ledger records the member marketing over the last thirty-six
      months reach the established marketer threshold and the equity account carries voting rights, the percentage
      is the established marketer percentage. Where the equity account stands active and the ledger records grain
      business inside the last twelve months, but that pair of conditions is not met, the percentage is the member
      percentage. Where neither of those holds, the percentage is the share of production the member's marketing
      programme allows to stand sold forward.
      The hauled-load credit allows headroom for grain the member has already hauled against the application,
      whose tickets stand held against the contract until it is countersigned and whose bushels come off the
      contract only as loads are applied to it; every load standing against the contract counts here, whatever the
      disposition. Where four or more loads stand against the contract and the bushels they carry reach the
      smallest contract the programme will write, the credit is the high load credit for each load. Where loads stand against the contract but that pair of conditions is not met, the credit is the low
      load credit for each load. Where no load stands against the contract, no hauled-load credit is added.
      The forward reserve is bushels of headroom the desk holds back on a contract whose delivery has not begun.
      Where the contract's delivery window has opened and at least one load stands against it, no forward reserve
      is held back. Where the delivery window has not opened but opens inside the near window, the reserve is the
      near forward reserve. Where neither of those holds, the reserve is the standard forward reserve.
    prerequisite: []
    cross_category:
      - category: patronage
        as: history
        reads: [status, voting_rights, patronage_ledger.patronage_units, patronage_ledger.entry_date, patronage_ledger.allocation_basis, patronage_ledger.event_type]
        note: the grain bushels the equity ledger records the member marketing, and the standing of the equity account, decide the marketing average and the ceiling percentage
    compute:
      - applied_for_bu: "float(F('contracted_bushels'))"
      - marketed_units_36: "XSUM('patronage','patronage_ledger','patronage_units', within_months=36, date_field='entry_date', event_type='patronage_units_accrued', allocation_basis='grain_bushels')"
      - marketed_units_24: "XSUM('patronage','patronage_ledger','patronage_units', within_months=24, date_field='entry_date', event_type='patronage_units_accrued', allocation_basis='grain_bushels')"
      - marketed_units_12: "XSUM('patronage','patronage_ledger','patronage_units', within_months=12, date_field='entry_date', event_type='patronage_units_accrued', allocation_basis='grain_bushels')"
      - equity_status: "CFIELD('patronage','status')"
      - marketing_average_bu: "float(int(marketed_units_24 / K('recent_history_years') + 0.5)) if (marketed_units_12 > 0 and equity_status == 'active') else (float(int(marketed_units_12 + 0.5)) if marketed_units_12 > 0 else float(int(marketed_units_36 / P('production_history_years') + 0.5)))"
      - equity_voting: "CFIELD('patronage','voting_rights')"
      - ceiling_pct: "K('cap_pct_established') if (marketed_units_36 >= K('established_marketer_bushels') and equity_voting == True) else (K('cap_pct_member') if (equity_status == 'active' and marketed_units_12 > 0) else P('open_position_cap_pct_of_production'))"
      - ceiling_bu: "float(int(marketing_average_bu * ceiling_pct / 100 + 0.5))"
      - hauled_loads: "COUNT('grain_ledger', event_type='grain_delivery_applied')"
      - hauled_net_bu: "SUM('grain_ledger','net_bushels', event_type='grain_delivery_applied')"
      - hauled_load_credit_bu: "hauled_loads * K('load_credit_high') if (hauled_loads >= 4 and hauled_net_bu >= P('min_contract_bushels')) else (hauled_loads * K('load_credit_low') if hauled_loads >= 1 else 0.0)"
      - window_open_days: "DAYS(F('delivery_start_date'), NOW)"
      - forward_reserve_bu: "0.0 if (window_open_days >= 0 and hauled_loads >= 1) else (K('reserve_near') if (window_open_days < 0 and window_open_days >= 0 - K('near_window_days')) else K('reserve_standard'))"
      - result: "MX(0.0, float(int(MN(applied_for_bu, MX(0.0, ceiling_bu + hauled_load_credit_bu - forward_reserve_bu)) + 0.5)))"
    compute_basis:
      applied_for_bu: "The bushels a contract is countersigned for are the bushels the member applied for or the marketing ceiling, whichever is the smaller, struck in whole bushels, a part bushel taken to the nearest whole bushel and a half bushel taken upward, and never below zero."
      marketed_units_36: "Where the ledger records no grain business inside the last twelve months, the average is the last thirty-six months of marketed bushels divided by the production history window the marketing programme carries."
      marketed_units_24: "Where the equity ledger records grain business inside the last twelve months and the equity account stands active, the average is the last twenty-four months of marketed bushels divided by the recent history window, since a member trading now is measured on the years they have just traded."
      marketed_units_12: "Where the ledger records grain business inside the last twelve months but no active equity account stands, the average is the bushels marketed in those twelve months taken as they stand."
      equity_status: "Where the ledger records grain business inside the last twelve months but no active equity account stands, the average is the bushels marketed in those twelve months taken as they stand."
      marketing_average_bu: "Where the equity ledger records grain business inside the last twelve months and the equity account stands active, the average is the last twenty-four months of marketed bushels divided by the recent history window, since a member trading now is measured on the years they have just traded. Where the ledger records grain business inside the last twelve months but no active equity account stands, the average is the bushels marketed in those twelve months taken as they stand. Where the ledger records no grain business inside the last twelve months, the average is the last thirty-six months of marketed bushels divided by the production history window the marketing programme carries."
      equity_voting: "Where the bushels the equity ledger records the member marketing over the last thirty-six months reach the established marketer threshold and the equity account carries voting rights, the percentage is the established marketer percentage."
      ceiling_pct: "Where the bushels the equity ledger records the member marketing over the last thirty-six months reach the established marketer threshold and the equity account carries voting rights, the percentage is the established marketer percentage. Where the equity account stands active and the ledger records grain business inside the last twelve months, but that pair of conditions is not met, the percentage is the member percentage. Where neither of those holds, the percentage is the share of production the member's marketing programme allows to stand sold forward."
      ceiling_bu: "The marketing average and the ceiling are each struck in whole bushels, a part bushel taken to the nearest whole bushel and a half bushel taken upward, before the hauled-load credit and the forward reserve are applied to them."
      hauled_loads: "Where four or more loads stand against the contract and the bushels they carry reach the smallest contract the programme will write, the credit is the high load credit for each load."
      hauled_net_bu: "Where four or more loads stand against the contract and the bushels they carry reach the smallest contract the programme will write, the credit is the high load credit for each load."
      hauled_load_credit_bu: "Where four or more loads stand against the contract and the bushels they carry reach the smallest contract the programme will write, the credit is the high load credit for each load. Where loads stand against the contract but that pair of conditions is not met, the credit is the low load credit for each load. Where no load stands against the contract, no hauled-load credit is added."
      window_open_days: "Where the contract's delivery window has opened and at least one load stands against it, no forward reserve is held back."
      forward_reserve_bu: "Where the contract's delivery window has opened and at least one load stands against it, no forward reserve is held back. Where the delivery window has not opened but opens inside the near window, the reserve is the near forward reserve. Where neither of those holds, the reserve is the standard forward reserve."
      result: "The bushels a contract is countersigned for are the bushels the member applied for or the marketing ceiling, whichever is the smaller, struck in whole bushels, a part bushel taken to the nearest whole bushel and a half bushel taken upward, and never below zero."
    factors:
      - id: marketing_average_basis
        effect: method
        decides: marketing_average_bu
        bindings: [marketed_units_36, marketed_units_24, marketed_units_12, equity_status, marketing_average_bu]
        ladder:
          - when: "the equity ledger records grain business inside the last twelve months and the equity account stands active"
            method: "the marketing average is the last twenty-four months of marketed bushels divided by the recent history window"
          - when: "the ledger records grain business inside the last twelve months but no active equity account stands"
            method: "the marketing average is the bushels marketed in those twelve months taken as they stand"
          - when: "otherwise"
            method: "the marketing average is the last thirty-six months of marketed bushels divided by the production history window the marketing programme carries"
        baseline:
          marketing_average_bu: "float(int(marketed_units_36 / P('production_history_years') + 0.5))"
        evidence: [cross_category, history]
        cross_difficulty: patronage
      - id: forward_ceiling_percentage
        effect: parameter
        decides: ceiling_pct
        bindings: [equity_voting, ceiling_pct]
        ladder:
          - when: "the bushels the equity ledger records the member marketing over the last thirty-six months reach the established marketer threshold and the equity account carries voting rights"
            value: "K('cap_pct_established')"
          - when: "the equity account stands active and the ledger records grain business inside the last twelve months, but that pair of conditions is not met"
            value: "K('cap_pct_member')"
          - when: "otherwise"
            value: "P('open_position_cap_pct_of_production')"
        baseline:
          ceiling_pct: "P('open_position_cap_pct_of_production')"
        evidence: [cross_category, history]
        cross_difficulty: patronage
      - id: hauled_load_credit
        effect: parameter
        decides: hauled_load_credit_bu
        bindings: [hauled_loads, hauled_net_bu, hauled_load_credit_bu]
        ladder:
          - when: "four or more loads stand against the contract and the bushels they carry reach the smallest contract the programme will write"
            value: "K('load_credit_high') for each load standing"
          - when: "loads stand against the contract but that pair of conditions is not met"
            value: "K('load_credit_low') for each load standing"
          - when: "otherwise"
            value: "0.0"
        baseline:
          hauled_load_credit_bu: "0.0"
        evidence: [history]
        cross_difficulty: null
      - id: forward_delivery_reserve
        effect: parameter
        decides: forward_reserve_bu
        bindings: [window_open_days, forward_reserve_bu]
        ladder:
          - when: "the contract's delivery window has opened and at least one load stands against it"
            value: "0.0"
          - when: "the delivery window has not opened but opens inside the near window"
            value: "K('reserve_near')"
          - when: "otherwise"
            value: "K('reserve_standard')"
        baseline:
          forward_reserve_bu: "K('reserve_standard')"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        The bushels a contract is countersigned for are the bushels the member applied for or the marketing
        ceiling, whichever is the smaller, struck in whole bushels, a part bushel taken to the nearest whole bushel and a half bushel taken upward, and never below zero. The marketing ceiling is
        the member's marketing average taken at the ceiling percentage, with the hauled-load credit added and the
        forward reserve taken off, and the member's marketing average is the bushels the equity ledger records the
        member marketing over the last thirty-six months, divided by the production history window the marketing
        programme carries. Only the bushels the ledger records as marketed business are counted, and the bushels of
        an allocation posted on them or a retain withheld from them are not counted again. The ceiling percentage is
        the share of production the member's marketing programme allows to stand sold forward. No hauled-load credit
        is added, and the forward reserve is the standard forward reserve. The marketing average and the ceiling are
        each struck in whole bushels, a part bushel taken to the nearest whole bushel and a half bushel taken upward, before the hauled-load credit and the forward reserve are applied to
        them.
      params: [production_history_years, open_position_cap_pct_of_production, reserve_standard]
    inputs:
      history:
        - {table: grain_ledger, aggregate: count, field: ledger_id, within_months: null, filters: {event_type: grain_delivery_applied}}
        - {category: patronage, table: patronage_ledger, aggregate: sum, field: patronage_units, within_months: 36, filters: {event_type: patronage_units_accrued, allocation_basis: grain_bushels}}
