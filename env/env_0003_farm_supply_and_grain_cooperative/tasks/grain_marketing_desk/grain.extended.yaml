        bindings: [settlements_standing, input_account_status, collection_charge]
        ladder:
          - when: "no settlement statement stands on the contract to draw the charge on and the member's crop input account stands past due or suspended"
            value: "K('collection_charge_arrears')"
          - when: "no settlement statement stands on the contract to draw the charge on but the crop input account stands in neither of those standings"
            value: "K('collection_charge_standard')"
          - when: "otherwise"
            value: "0.0"
        baseline:
