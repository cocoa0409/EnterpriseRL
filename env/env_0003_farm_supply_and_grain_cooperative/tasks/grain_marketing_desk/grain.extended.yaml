        ladder:
          - when: "the worst foreign material reading is above the high foreign material ceiling and the bushels the statement settles reach the foreign material bushel floor"
            value: "K('foreign_high_rate')"
          - when: "the worst foreign material reading is above the free tolerance the marketing programme carries but that pair of conditions is not met"
            value: "K('foreign_step_rate')"
          - when: "otherwise"
            value: "0.0"
        baseline:
