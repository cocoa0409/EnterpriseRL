            method: "the storage accruals and the handling charges standing unpaid are drawn into the settlement"
        baseline:
          cleared_charges: "RND(unpaid_accruals + unpaid_handling, 2)"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: grace_counting_convention
        effect: method
        decides: days_past_grace
        bindings: [days_unpaid, days_since_last_charge, days_past_grace]
        ladder:
          - when: "statements reach the member through the portal and by email"
            method: "the grace period is counted in whole calendar days from the date storage was last billed and paid through"
          - when: "statements reach the member by post"
            method: "the same count is taken and the posting allowance is added to the grace period"
          - when: "otherwise"
            method: "the grace period is counted in whole calendar days from the day the most recent storage charge was raised on the account"
        baseline:
          days_past_grace: "MX(days_since_last_charge - P('late_payment_grace_days'), 0)"
        evidence: [date, history, tier_param]
        cross_difficulty: null
      - id: arrears_charge_added
        effect: parameter
        decides: late_charge
        bindings: [late_charges_12m, late_charge]
        ladder:
          - when: "a charge stands past its grace period and the account carries a late charge raised within the last twelve months"
            value: "the programme's late charge"
          - when: "a charge stands past its grace period and no late charge has been raised on the account within the last twelve months"
            value: "the arrears notice fee"
          - when: "otherwise"
            value: "nothing is added"
        baseline:
          late_charge: "0.0"
        evidence: [history]
        cross_difficulty: null
      - id: prompt_settlement_allowance
        effect: parameter
        decides: prompt_allowance_rate
        bindings: [settlements_6m, prompt_allowance_rate]
        ladder:
          - when: "no charge stands past its grace period and a storage settlement has cleared on the account within the last six months"
            value: "the full prompt-settlement rate"
          - when: "no charge stands past its grace period, or a storage settlement has cleared on the account within the last six months"
            value: "the modest rate"
          - when: "otherwise"
            value: "no allowance is given"
        baseline:
          prompt_allowance_rate: "0.0"
        evidence: [history]
        cross_difficulty: null
      - id: per_unit_retain_collected
        effect: parameter
        decides: retain_charge
        bindings: [crop_year_deposits, retain_charge]
        ladder:
          - when: "the programme earns patronage and fifteen thousand bushels or more were taken into store under the agreement in the last twelve months"
            value: "the programme's per-unit rate on every bushel taken in over those twelve months"
          - when: "the programme earns patronage and fewer bushels were taken in"
            value: "the minimum retain"
          - when: "otherwise"
            value: "no retain is collected"
        baseline:
          retain_charge: "0.0"
        evidence: [history, tier_param]
        cross_difficulty: null
    baseline:
      rule: >-
        The settlement is drawn for the storage accruals and the handling charges standing unpaid on the invoice named,
        and that total, rounded to the nearest cent, is what the member pays to clear the account. Charges are cleared
        oldest first, so the settlement leaves no older charge open while clearing a later one.
      params: []
    inputs:
      history:
        - {table: storage_charges, aggregate: sum, field: amount, within_months: null, filters: {event_type: storage_accrual_charged, paid_flag: false}}
        - {table: storage_charges, aggregate: sum, field: amount, within_months: null, filters: {event_type: storage_handling_charged, paid_flag: false}}
        - {table: storage_charges, aggregate: sum, field: amount, within_months: null, filters: {event_type: storage_drying_charged, paid_flag: false}}
        - {table: storage_charges, aggregate: count, field: charge_id, within_months: 12, filters: {charge_type: late_payment}}
        - {table: storage_charges, aggregate: count, field: charge_id, within_months: 6, filters: {event_type: storage_charge_settled}}
        - {table: storage_charges, aggregate: sum, field: bushels, within_months: 12, filters: {event_type: storage_deposit_recorded}}
      cross_category: []

  - id: storage_ext_drying_pass
    base_policy_refs: [storage_drying_and_shrink]
    overwrite: []
    trigger: state_due
    subject: [storage_drying_charged]
    computes: amount
    params:
      receipt_dry_margin_pct: 0.5
      lot_dry_margin_pct: 0.3
      wet_intake_pct: 20.0
      light_test_weight_lbs: 54.0
      deep_dry_step_usd: 0.008
      wet_corn_step_usd: 0.004
      rewarm_days: 90
      rewarm_step_usd: 0.006
      light_rewarm_step_usd: 0.003
      contract_applied_bushels: 10000
      contract_dry_allowance_pct: 10.0
      modest_dry_allowance_pct: 4.0
    target_tool: charge_drying_pass_a57b52cd
    rule: >
      The member pays for the water the dryer takes out, and a pass is charged as soon as it has been run. The pass is
      worked out on the moisture the scale read in when the grain was taken into store, on the bushels the most recent
      load into store was taken in on, at the programme's rate for each point of moisture on each bushel, and the grain
      is run down to the programme's target moisture. The charge for the pass is the programme's rate for each point of moisture on each
      bushel through the dryer, multiplied by the points removed and by the bushels the pass was run on, that product
      rounded to the nearest cent; where what is left after any allowance falls under the programme's pass minimum the
      pass minimum is charged instead. The points removed are the moisture the grain started the pass at less the
      moisture it is being run down to, carried to one decimal place, and a pass that would take out fewer than the
      programme's minimum points is billed at the minimum points rather than not at all. The moisture the grain started
      the pass at is read from the records rather than assumed: where a conditioning charge already stands on the
      storage account showing the moisture the grain was left at, the pass starts from that moisture, because the water
      taken out earlier is not paid for twice; where no conditioning charge stands on the account and the scale ticket
      the grain came in on shows no moisture reading, the pass starts from the programme's target moisture plus the
      programme's minimum points; and otherwise the pass starts from the moisture the scale read in when the grain was
      taken into store. The moisture the grain is run down to follows what the elevator has undertaken to give back:
      where the agreement guarantees the grade written on the receipt and a receipt has been issued against the
      agreement, the grain is run down to the programme's target moisture less the receipt margin, so that it grades
      through the life of the receipt; where the agreement guarantees the lot as it was delivered, the grain is run
      down to the programme's target moisture less the lot margin; and otherwise the grain is run down to the
      programme's target moisture. Which bushels the pass is charged on follows what has been worked: where a
      conditioning charge already stands on the storage account and no bushels have left store since the grain went in,
      the pass is charged on the bushels the most recent conditioning charge was raised on, the same grain having been
      worked again; where bushels have left store since the grain went in, the pass is charged on the bushels standing
      in store; and otherwise the pass is charged on the bushels the most recent load into store was taken in on. Wet,
      light grain costs more to run, so the rate carries a step: where the scale read the grain in above the wet-intake
      moisture and weighed it in below the light-test weight, the deep-dry step is added to the programme's rate; where
      the scale read the grain in above the wet-intake moisture and weighed it in at or above the light-test weight, the
      wet-corn step is added; and otherwise, the scale having read the grain in at or below the wet-intake moisture, no
      step is added for the state the grain came in at. Grain that has sat in a cold bin has to be warmed before it will give up water, so the rate carries a second
      step: where the grain has stood in store longer than the rewarming day count and no aeration cycle has been run
      on the agreement, the rewarming step is added; where the grain has stood in store longer than the rewarming day
      count and an aeration cycle has been run on the agreement, the light rewarming step is added; and otherwise no
      step is added for the state of the bin. The two steps are added to the programme's posted rate on that same
      posted rate rather than one acting on the other's result, and the rate so obtained is carried to five decimal
      places before it is applied. Grain the member has committed to the cooperative is dried at an allowance, because
      the cooperative takes the grain in the end, the bushels applied being counted as the net bushels the delivery entry credits to the contract rather than the gross weigh across the scale: where ten thousand bushels or more have been applied to the member's
      marketing contracts in the last three months and the member holds an active marketing contract for the same
      commodity with bushels still open, the full drying allowance is taken off the charge; where bushels have been
      applied to the member's marketing contracts in the last three months, or the member holds an active marketing
      contract for the same commodity with bushels still open, the modest drying allowance is taken off; and otherwise
      no allowance is given. The allowance is worked out on the charge for the pass and on nothing else, rounded to the
      nearest cent, and it is taken off before the programme's pass minimum is applied. Days in store are counted in
      whole calendar days from the storage start date through the day the pass is worked out.
    prerequisite: []
    cross_category:
      - category: grain
        as: history
        reads: [status, open_bushels, commodity, grain_ledger.moisture_pct, grain_ledger.test_weight_lbs, grain_ledger.net_bushels]
        note: the drying allowance tier is decided from the bushels applied to the member's marketing contracts in the last three months and from the open bushels on an active contract for the same commodity, and the moisture the scale read in is taken from the member's own scale ticket in the grain ledger
    compute:
      - ticket_moisture: "float(XLATEST('grain','grain_ledger','moisture_pct', date_field='delivery_date', event_type='grain_delivery_applied', disposition='storage') or 0)"
      - prior_pass_count: "COUNT('storage_charges', date_field='charge_date', event_type='storage_drying_charged')"
      - prior_pass_moisture_out: "float(LATEST('storage_charges','moisture_out_pct', date_field='charge_date', event_type='storage_drying_charged') or 0)"
      - start_moisture: "prior_pass_moisture_out if prior_pass_count > 0 and prior_pass_moisture_out > 0 else (P('drying_target_moisture_pct') + P('drying_minimum_points') if ticket_moisture <= 0 else ticket_moisture)"
      - receipt_issuances: "COUNT('storage_charges', date_field='charge_date', charge_type='receipt_issuance')"
      - target_moisture: "P('drying_target_moisture_pct') - K('receipt_dry_margin_pct') if P('quality_grade_guarantee') == 'receipt_grade' and receipt_issuances > 0 else (P('drying_target_moisture_pct') - K('lot_dry_margin_pct') if P('quality_grade_guarantee') == 'delivered_lot_grade' else P('drying_target_moisture_pct'))"
      - points_removed: "MX(RND(start_moisture - target_moisture, 1), P('drying_minimum_points'))"
      - deposited: "SUM('storage_charges','bushels', date_field='charge_date', event_type='storage_deposit_recorded')"
      - shrunk: "SUM('storage_charges','shrink_bushels', date_field='charge_date', event_type='storage_shrink_taken')"
      - moved_out: "SUM('storage_charges','bushels', date_field='charge_date', event_type='storage_loadout_recorded')"
      - standing_bushels: "RND(deposited - shrunk - moved_out, 2)"
      - loadouts_since: "COUNT('storage_charges', date_field='charge_date', event_type='storage_loadout_recorded')"
      - prior_charge_bushels: "float(LATEST('storage_charges','bushels', date_field='charge_date', event_type='storage_drying_charged') or 0)"
      - latest_deposit_bushels: "float(LATEST('storage_charges','bushels', date_field='charge_date', event_type='storage_deposit_recorded') or 0)"
      - dryer_bushels: "prior_charge_bushels if prior_pass_count > 0 and loadouts_since == 0 else (standing_bushels if loadouts_since > 0 else latest_deposit_bushels)"
      - intake_test_weight: "float(XLATEST('grain','grain_ledger','test_weight_lbs', date_field='delivery_date', event_type='grain_delivery_applied', disposition='storage') or 0)"
      - intake_moisture: "float(XLATEST('grain','grain_ledger','moisture_pct', date_field='delivery_date', event_type='grain_delivery_applied', disposition='storage') or 0)"
      - deep_dry_step: "K('deep_dry_step_usd') if intake_moisture > K('wet_intake_pct') and intake_test_weight < K('light_test_weight_lbs') else (K('wet_corn_step_usd') if intake_moisture > K('wet_intake_pct') and intake_test_weight >= K('light_test_weight_lbs') else 0.0)"
      - days_in_store: "DAYS(F('storage_start_date'), NOW)"
      - aeration_cycles: "COUNT('storage_charges', date_field='charge_date', charge_type='aeration')"
      - rewarm_step: "K('rewarm_step_usd') if days_in_store > K('rewarm_days') and aeration_cycles == 0 else (K('light_rewarm_step_usd') if days_in_store > K('rewarm_days') and aeration_cycles > 0 else 0.0)"
      - pass_rate: "RND(P('drying_rate_per_point_per_bushel_usd') + deep_dry_step + rewarm_step, 5)"
      - gross_charge: "RND(dryer_bushels * points_removed * pass_rate, 2)"
      - contract_open_bushels: "float(CFIELD('grain','open_bushels', status='active', commodity=F('commodity')) or 0)"
      - applied_bushels_90d: "XSUM('grain','grain_ledger','net_bushels', within_months=3, date_field='delivery_date', event_type='grain_delivery_applied', disposition='contract_application')"
      - allowance_rate: "K('contract_dry_allowance_pct') if applied_bushels_90d >= K('contract_applied_bushels') and contract_open_bushels > 0 else (K('modest_dry_allowance_pct') if applied_bushels_90d > 0 or contract_open_bushels > 0 else 0.0)"
      - allowance: "RND(gross_charge * allowance_rate / 100, 2)"
      - result: "RND(MX(gross_charge - allowance, P('drying_minimum_charge_usd')), 2)"
    compute_basis:
      ticket_moisture: "The moisture the grain started the pass at is read from the records rather than assumed: where a conditioning charge already stands on the storage account showing the moisture the grain was left at, the pass starts from that moisture, because the water taken out earlier is not paid for twice; where no conditioning charge stands on the account and the scale ticket the grain came in on shows no moisture reading, the pass starts from the programme's target moisture plus the programme's minimum points; and otherwise the pass starts from the moisture the scale read in when the grain was taken into store."
