  - id: storage_ext_loadout_release
    base_policy_refs: [storage_agg_capacity_across_agreements, storage_loadout]
    overwrite: []
    trigger: on_request
    subject: [storage_loadout_recorded]
    computes: bushels
    params:
      charge_holdback_wide_bushels: 1500
      charge_holdback_light_bushels: 600
      grade_holdback_wide_bushels: 900
      grade_holdback_light_bushels: 400
      conditioning_reserve_wide_bushels: 800
      conditioning_reserve_light_bushels: 250
      rail_ceiling_bushels: 28000
      reduced_rail_ceiling_bushels: 14000
      country_ceiling_bushels: 12000
      truck_lot_bushels: 1000
      rail_lot_count: 10
    target_tool: release_loadout_bushels_2fb9cebd
    rule: >
      Grain leaves store on a released order, and the bushels that actually move are worked out against what is free
      rather than against what the member asked for. The bushels an order releases are fixed only once the bushels
      standing free on the agreement, the bushels on hand that are not pledged against an outstanding warehouse
      receipt, reach the programme's load-out minimum. The bushels an order releases are fixed only after the storage
      account carries a shrink line raised no earlier than the most recent conditioning charge standing on it. The
      order is for the bushels the signed load-out request standing received on the agreement names, the bushels free
      are the bushels on hand, and the ceiling the facility works to is the country ceiling. The bushels released are
      the smallest of the bushels the order names, the bushels left free after every holdback, and the ceiling the
      facility works to, that figure then carried down by the rounding the facility uses and rounded to two decimal
      places. Bushels on hand are backed out of the storage account, being the bushels taken into store less the
      bushels taken off for shrink and less the bushels loaded out, and never read off the agreement header. Which
      bushels count as free follows what stands against the lot: where the agreement carries bushels pledged against an
      outstanding warehouse receipt, the bushels free are the bushels on hand less the bushels pledged; where the
      agreement carries no bushels pledged and a conditioning charge stands on the account carrying points no shrink
      line covers, the bushels free are the bushels on hand less the shrink still to come off those points at the
      programme's handling shrink percentage; and otherwise the bushels free are the bushels on hand. Bushels are held
      back against what the account owes the elevator, since grain is not released against unpaid charges: where
      conditioning charges and storage accruals both stand unpaid on the account, the wide charge holdback stays in
      store; where exactly one of conditioning charges and storage accruals stands unpaid on the account, the light
      charge holdback stays in store; and otherwise, nothing standing unpaid on the account at all, nothing is held
      back for charges. Bushels are held back for grade as well, because
      what goes out has to leave enough behind to make good what the elevator guaranteed: where a grade discount has
      been raised on the account in the last twelve months and the agreement carries no bushels pledged against an
      outstanding warehouse receipt, the wide grade holdback stays in store, the whole of that exposure riding on what
      is left standing in store; where a grade discount has been raised on the account in the last twelve months and
      the agreement carries bushels pledged against an outstanding warehouse receipt, the light grade holdback stays in
      store, the receipt already keeping a margin standing for the same grade; and otherwise, no grade discount having
      been raised on the account in the last twelve months, nothing is held back for grade. Bushels are held back for the conditioning still owed as
      well, because water yet to come off the lot cannot be hauled home: where the conditioning charges standing on the
      account show points no shrink line covers and the agreement carries bushels pledged against an outstanding
      warehouse receipt, the wide conditioning reserve stays in store; where the conditioning charges show points no
      shrink line covers and the agreement carries no bushels pledged against an outstanding warehouse receipt, the
      light conditioning reserve stays in store; and otherwise, every point the conditioning charges show being covered
      by a shrink line, nothing is held back for conditioning. The ceiling is what the
      facility can work in a day: where the grain is held at a rail terminal and no load-out has been worked on the
      agreement in the last thirty days, the rail ceiling applies; where the grain is held at a rail terminal and a
      load-out has been worked on the agreement in the last thirty days, the reduced rail ceiling applies, the elevator
      spreading its out-load capacity across its members; and otherwise the country ceiling applies. Grain moves in
      whole loads rather than to the bushel: where the grain is held at a rail terminal and what may be released stands
      above the rail lot count of truck lots, what is released is carried down to a whole multiple of the truck lot;
      where the grain is not held at a rail terminal and a load-out has been worked on the agreement in the last twelve
      months, it is carried down to the next whole hundred bushels; and otherwise it is released as it was worked out.
      The holdbacks are taken off the bushels free rather than one acting on another's result, the ceiling is applied to
      what is left after them, and the carrying down is done once, at the end.
    prerequisite:
      - problem: storage_ext_receipt_pledge_release
        kind: value_input
        gate: free_bushels
        form: state
        policy_source: >-
          The bushels an order releases are fixed only once the bushels standing free on the agreement, the bushels on hand that are not pledged against an outstanding warehouse receipt, reach the programme's load-out minimum.
        condition: >-
          The bushels on hand that are not pledged against an outstanding warehouse receipt stand at or above the programme's load-out minimum, so an order can be worked against free bushels at all.
        resolved_by: reduce_receipt_pledge_f1b6f4e9
        effect: >-
          the bushels the agreement carries as pledged fall to the revised figure, so the bushels free on which the order is worked rise by what came off the receipt
      - problem: storage_ext_conditioning_shrink
        kind: value_input
        gate: on_hand
        form: state
        policy_source: >-
          The bushels an order releases are fixed only after the storage account carries a shrink line raised no earlier than the most recent conditioning charge standing on it.
        condition: >-
          The most recent shrink line on the storage account stands no earlier than the most recent conditioning charge on it, so the bushels backed out of the account carry the loss the last pass took.
        resolved_by: record_conditioning_shrink_cafcaf64
        effect: >-
          the bushels backed out of the storage account fall by the bushels the shrink line takes off, so the bushels on hand the order is worked against are the bushels really there
    cross_category: []
    compute:
      - deposited: "SUM('storage_charges','bushels', date_field='charge_date', event_type='storage_deposit_recorded')"
      - shrink_taken: "SUM('storage_charges','shrink_bushels', date_field='charge_date', event_type='storage_shrink_taken')"
      - moved_out: "SUM('storage_charges','bushels', date_field='charge_date', event_type='storage_loadout_recorded')"
      - on_hand: "RND(deposited - shrink_taken - moved_out, 2)"
      - pledged: "float(F('reserved_bushels') or 0)"
      - drying_points_total: "SUM('storage_charges','points_removed', date_field='charge_date', event_type='storage_drying_charged')"
      - shrink_points_total: "SUM('storage_charges','points_removed', date_field='charge_date', event_type='storage_shrink_taken')"
      - free_bushels: "MX(on_hand - pledged, 0) if pledged > 0 else (MX(on_hand - RND(on_hand * MX(drying_points_total - shrink_points_total, 0) * P('drying_handling_shrink_pct_per_point') / 100, 2), 0) if RND(drying_points_total - shrink_points_total, 1) > 0 else on_hand)"
      - unpaid_drying: "SUM('storage_charges','amount', date_field='charge_date', event_type='storage_drying_charged', paid_flag=False)"
      - unpaid_accruals: "SUM('storage_charges','amount', date_field='charge_date', event_type='storage_accrual_charged', paid_flag=False)"
      - charge_holdback: "K('charge_holdback_wide_bushels') if unpaid_drying > 0 and unpaid_accruals > 0 else (K('charge_holdback_light_bushels') if (unpaid_drying > 0 and unpaid_accruals <= 0) or (unpaid_accruals > 0 and unpaid_drying <= 0) else 0.0)"
      - grade_discounts_12m: "COUNT('storage_charges', within_months=12, date_field='charge_date', event_type='storage_quality_discount_applied')"
      - grade_holdback: "K('grade_holdback_wide_bushels') if grade_discounts_12m > 0 and pledged <= 0 else (K('grade_holdback_light_bushels') if grade_discounts_12m > 0 and pledged > 0 else 0.0)"
      - uncovered_points: "RND(MX(SUM('storage_charges','points_removed', date_field='charge_date', event_type='storage_drying_charged') - SUM('storage_charges','points_removed', date_field='charge_date', event_type='storage_shrink_taken'), 0), 1)"
      - conditioning_reserve: "K('conditioning_reserve_wide_bushels') if uncovered_points > 0 and pledged > 0 else (K('conditioning_reserve_light_bushels') if uncovered_points > 0 and pledged <= 0 else 0.0)"
      - releasable: "MX(free_bushels - charge_holdback - grade_holdback - conditioning_reserve, 0)"
      - order_bushels: "float(LATEST('storage_requests','requested_bushels', date_field='requested_date', request_type='loadout', request_status='received', signed_by_member=True) or 0)"
      - loadouts_30d: "COUNT('storage_charges', within_months=1, date_field='charge_date', event_type='storage_loadout_recorded')"
      - out_ceiling: "K('rail_ceiling_bushels') if (F('storage_location') == 'Kellerton Rail Terminal' or F('storage_location') == 'Winnebago River Terminal') and loadouts_30d == 0 else (K('reduced_rail_ceiling_bushels') if (F('storage_location') == 'Kellerton Rail Terminal' or F('storage_location') == 'Winnebago River Terminal') and loadouts_30d > 0 else K('country_ceiling_bushels'))"
      - capped: "MN(MN(order_bushels, releasable), out_ceiling)"
      - loadouts_12m: "COUNT('storage_charges', within_months=12, date_field='charge_date', event_type='storage_loadout_recorded')"
      - rounded_release: "float(int(capped // K('truck_lot_bushels')) * K('truck_lot_bushels')) if (F('storage_location') == 'Kellerton Rail Terminal' or F('storage_location') == 'Winnebago River Terminal') and capped > K('truck_lot_bushels') * K('rail_lot_count') else (float(int(capped // 100) * 100) if not (F('storage_location') == 'Kellerton Rail Terminal' or F('storage_location') == 'Winnebago River Terminal') and loadouts_12m > 0 else capped)"
      - result: "RND(rounded_release, 2)"
