    factors:
      - id: free_bushels_basis
        effect: method
        decides: free_bushels
        bindings: [deposited, shrink_taken, moved_out, on_hand, pledged, drying_points_total, shrink_points_total, free_bushels]
        ladder:
          - when: "the agreement carries bushels pledged against an outstanding warehouse receipt"
            method: "the bushels free are the bushels on hand less the bushels pledged"
          - when: "the agreement carries no bushels pledged and a conditioning charge stands on the account carrying points no shrink line covers"
            method: "the bushels free are the bushels on hand less the shrink still to come off those points at the programme's handling shrink percentage"
          - when: "otherwise"
            method: "the bushels free are the bushels on hand"
        baseline:
          free_bushels: "on_hand"
        evidence: [history]
        cross_difficulty: null
      - id: unpaid_charge_holdback
        effect: parameter
        decides: charge_holdback
        bindings: [unpaid_drying, unpaid_accruals, charge_holdback]
        ladder:
          - when: "conditioning charges and storage accruals both stand unpaid on the account"
            value: "the wide charge holdback"
          - when: "exactly one of conditioning charges and storage accruals stands unpaid on the account"
            value: "the light charge holdback"
          - when: "otherwise, nothing stands unpaid on the account"
            value: "nothing is held back for charges"
        baseline:
          charge_holdback: "0.0"
        evidence: [history]
        cross_difficulty: null
