      cross_category: [grain]

  - id: storage_ext_invoice_settlement
    base_policy_refs: [storage_charge_settlement]
    overwrite:
      - base_policy: storage_charge_settlement
        superseded_clause: >-
          counted in whole calendar days from the invoice date
        replaced_by: >-
          The days a charge has stood past its grace period are counted by the way the member's statements reach them
      - base_policy: storage_charge_settlement
        superseded_clause: >-
          carries the programme's late charge once, and the late charge is added once per invoice however long the invoice then stays unpaid
        replaced_by: >-
          A charge standing past its grace period earns an arrears charge, and what is added turns on how the account has been kept
    trigger: on_request
    subject: [storage_charge_settled]
    computes: amount
    target_tool: settle_storage_charges_68342e7f
    params:
      posting_allowance_days: 5
      arrears_notice_fee_usd: 15.00
      prompt_allowance_pct: 0.015
      modest_allowance_pct: 0.005
      retain_full_bushels: 15000
      retain_minimum_usd: 20.00
    rule: >
      A member who asks to clear the storage account pays out the storage invoice the charges stand on, and the desk
      quotes the sum before the member pays it. The sum the member is asked to pay is fixed only after the storage
      account carries a storage accrual entry for every billing period that has closed on the agreement. The settlement
      is drawn for the storage accruals and the handling charges standing unpaid on the invoice named, and that total,
      rounded to the nearest cent, is what the member pays to clear the account. Where the account has earned an
      arrears charge it is added to that total, the prompt-settlement allowance is taken off it and the per-unit retain
      collected with it is added, in that order, the sum of the four rounded to the nearest cent. Which classes of charge are drawn into the settlement follows how the programme
      recovers its money: where the programme does not settle storage out of grain proceeds and charges of more than
      one class stand unpaid, every storage charge standing unpaid on the account is drawn in, because the member has
      no settlement statement for any of them to be taken out of; where the programme settles storage out of grain
      proceeds, only the storage accruals standing unpaid are drawn in, the conditioning and handling charges being
      taken out of the settlement statement the bushels are paid on; and otherwise the storage accruals and the
      handling charges standing unpaid are drawn in. The days a charge has stood past its grace period are counted by
      the way the member's statements reach them: where statements reach the member through the portal and by email,
      the grace period is counted in whole calendar days from the date storage was last billed and paid through, since
      a charge is there to be seen the day it is raised; where statements reach the member by post, the same count is
      taken and the posting allowance is added to the grace period; and otherwise the grace period is counted in whole
      calendar days from the day the most recent storage charge was raised on the account. A charge standing past its
      grace period earns an arrears charge, and what is added turns on how the account has been kept: where a charge
      stands past its grace period and the account carries a late charge raised within the last twelve months, the
      programme's late charge is added; where a charge stands past its grace period and no late charge has been raised
      on the account within the last twelve months, the programme's late charge is set aside for a member who has kept
      a clean twelve months and only the arrears notice fee is added; and otherwise nothing is added. A member who
      keeps the account clear earns the prompt-settlement allowance on the charges being cleared: where no charge
      stands past its grace period and a storage settlement has cleared on the account within the last six months, the
      full prompt-settlement rate is allowed; where no charge stands past its grace period, or a storage settlement has
      cleared on the account within the last six months, the modest rate is allowed; and otherwise no allowance is
      given. The allowance is worked out on the charges drawn into the settlement and on nothing else, and is rounded
      to the nearest cent before it is taken off. Bushels stored under a programme that earns patronage carry the
      per-unit retain, which is collected with the storage settlement and credited to the member's equity: where the
      programme earns patronage and fifteen thousand bushels or more were taken into store under the agreement in the
      last twelve months, the retain is the programme's per-unit rate on every bushel taken in over those twelve
      months, rounded to the nearest cent; where the programme earns patronage and fewer bushels were taken in, the
      minimum retain is collected instead; and otherwise no retain is collected. Charges are cleared oldest first, so
      the settlement leaves no older charge open while clearing a later one.
    prerequisite:
      - problem: storage_ext_period_accrual
        kind: value_input
        gate: unpaid_accruals
        form: state
        policy_source: >-
          The sum the member is asked to pay is fixed only after the storage account carries a storage accrual entry for every billing period that has closed on the agreement.
        condition: >-
          Every billing period whose last day has passed on the agreement carries a storage accrual entry on the storage account, so that the accruals standing unpaid are the whole of the storage rent owed.
        resolved_by: charge_storage_accrual_0a686c89
        effect: >-
          the storage accruals standing unpaid rise by the charge raised for the closed period, and the total drawn into the settlement rises with them
    cross_category: []
    compute:
      - unpaid_accruals: "SUM('storage_charges','amount', date_field='charge_date', event_type='storage_accrual_charged', paid_flag=False)"
      - unpaid_handling: "SUM('storage_charges','amount', date_field='charge_date', event_type='storage_handling_charged', paid_flag=False)"
      - unpaid_drying: "SUM('storage_charges','amount', date_field='charge_date', event_type='storage_drying_charged', paid_flag=False)"
      - unpaid_classes: "(1 if unpaid_accruals > 0 else 0) + (1 if unpaid_handling > 0 else 0) + (1 if unpaid_drying > 0 else 0)"
      - cleared_charges: "RND(unpaid_accruals + unpaid_handling + unpaid_drying, 2) if (not P('storage_settlement_from_grain_proceeds')) and unpaid_classes > 1 else (RND(unpaid_accruals, 2) if P('storage_settlement_from_grain_proceeds') else RND(unpaid_accruals + unpaid_handling, 2))"
      - days_unpaid: "DAYS(F('paid_through_date'), NOW)"
      - days_since_last_charge: "DAYS(LATEST('storage_charges','charge_date', date_field='charge_date'), NOW)"
      - days_past_grace: "MX(days_unpaid - P('late_payment_grace_days'), 0) if P('statement_delivery_method') == 'portal_and_email' else (MX(days_unpaid - P('late_payment_grace_days') - K('posting_allowance_days'), 0) if P('statement_delivery_method') == 'mailed_statement' else MX(days_since_last_charge - P('late_payment_grace_days'), 0))"
      - late_charges_12m: "COUNT('storage_charges', within_months=12, date_field='charge_date', charge_type='late_payment')"
      - late_charge: "P('late_payment_fee_usd') if days_past_grace > 0 and late_charges_12m > 0 else (K('arrears_notice_fee_usd') if days_past_grace > 0 and late_charges_12m == 0 else 0.0)"
      - settlements_6m: "COUNT('storage_charges', within_months=6, date_field='charge_date', event_type='storage_charge_settled')"
      - prompt_allowance_rate: "K('prompt_allowance_pct') if days_past_grace <= 0 and settlements_6m > 0 else (K('modest_allowance_pct') if days_past_grace <= 0 or settlements_6m > 0 else 0.0)"
      - prompt_allowance: "RND(cleared_charges * prompt_allowance_rate, 2)"
      - crop_year_deposits: "SUM('storage_charges','bushels', within_months=12, date_field='charge_date', event_type='storage_deposit_recorded')"
      - retain_charge: "RND(crop_year_deposits * P('per_unit_retain_per_bushel_usd'), 2) if P('patronage_eligible') and crop_year_deposits >= K('retain_full_bushels') else (K('retain_minimum_usd') if P('patronage_eligible') else 0.0)"
      - result: "RND(cleared_charges + late_charge - prompt_allowance + retain_charge, 2)"
