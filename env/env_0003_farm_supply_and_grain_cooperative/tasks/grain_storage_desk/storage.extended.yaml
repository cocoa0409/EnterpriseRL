        effect: method
        decides: dryer_bushels
        bindings: [deposited, shrunk, moved_out, standing_bushels, loadouts_since, prior_charge_bushels, latest_deposit_bushels, dryer_bushels]
        ladder:
          - when: "a conditioning charge already stands on the storage account and no bushels have left store since the grain went in"
            method: "the pass is charged on the bushels the most recent conditioning charge was raised on"
          - when: "bushels have left store since the grain went in"
            method: "the pass is charged on the bushels standing in store"
          - when: "otherwise"
            method: "the pass is charged on the bushels the most recent load into store was taken in on"
        baseline:
          dryer_bushels: "latest_deposit_bushels"
        evidence: [history]
        cross_difficulty: null
      - id: intake_condition_rate_step
        effect: parameter
        decides: deep_dry_step
        bindings: [intake_test_weight, intake_moisture, deep_dry_step]
        ladder:
          - when: "the scale read the grain in above the wet-intake moisture and weighed it in below the light-test weight"
            value: "the deep-dry step added to the programme's rate"
          - when: "the scale read the grain in above the wet-intake moisture and weighed it in at or above the light-test weight"
            value: "the wet-corn step added to the programme's rate"
          - when: "otherwise, the scale having read the grain in at or below the wet-intake moisture"
            value: "no step is added for the state the grain came in at"
        baseline:
          deep_dry_step: "0.0"
        evidence: [cross_category, history]
        cross_difficulty: grain
      - id: bin_rewarm_rate_step
        effect: parameter
        decides: rewarm_step
        bindings: [days_in_store, aeration_cycles, rewarm_step]
        ladder:
          - when: "the grain has stood in store longer than the rewarming day count and no aeration cycle has been run on the agreement"
            value: "the rewarming step added to the programme's rate"
          - when: "the grain has stood in store longer than the rewarming day count and an aeration cycle has been run on the agreement"
            value: "the light rewarming step added to the programme's rate"
          - when: "otherwise"
            value: "no step is added for the state of the bin"
        baseline:
          rewarm_step: "0.0"
        evidence: [date, history]
        cross_difficulty: null
      - id: committed_grain_allowance
        effect: parameter
        decides: allowance_rate
        bindings: [contract_open_bushels, applied_bushels_90d, allowance_rate]
        ladder:
          - when: "ten thousand bushels or more applied to the member's marketing contracts in the last three months and an active marketing contract for the same commodity with bushels still open"
            value: "the full drying allowance"
          - when: "bushels applied to the member's marketing contracts in the last three months, or an active marketing contract for the same commodity with bushels still open"
            value: "the modest drying allowance"
          - when: "otherwise"
            value: "no allowance is given"
        baseline:
          allowance_rate: "0.0"
        evidence: [cross_category]
        cross_difficulty: grain
    baseline:
      rule: >-
        The pass is worked out on the moisture the scale read in when the grain was taken into store, on the bushels
        the most recent load into store was taken in on, at the programme's rate for each point of moisture on each
        bushel, and the grain is run down to the programme's target moisture. The charge for the pass is the
        programme's rate for each point of moisture on each bushel through the dryer, multiplied by the points removed
        and by the bushels the pass was run on, that product rounded to the nearest cent; where what is left after any
        allowance falls under the programme's pass minimum the pass minimum is charged instead. The points removed are
        the moisture the grain started the pass at less the moisture it is being run down to, carried to one decimal
        place, and a pass that would take out fewer than the programme's minimum points is billed at the minimum points
        rather than not at all.
      params: [drying_rate_per_point_per_bushel_usd, drying_target_moisture_pct, drying_minimum_points, drying_minimum_charge_usd]
    inputs:
      history:
        - {table: storage_charges, aggregate: count, field: charge_id, within_months: null, filters: {event_type: storage_drying_charged}}
        - {table: storage_charges, aggregate: latest, field: moisture_out_pct, within_months: null, filters: {event_type: storage_drying_charged}}
        - {table: storage_charges, aggregate: latest, field: bushels, within_months: null, filters: {event_type: storage_drying_charged}}
        - {table: storage_charges, aggregate: sum, field: bushels, within_months: null, filters: {event_type: storage_deposit_recorded}}
        - {table: storage_charges, aggregate: sum, field: shrink_bushels, within_months: null, filters: {event_type: storage_shrink_taken}}
        - {table: storage_charges, aggregate: count, field: charge_id, within_months: null, filters: {charge_type: aeration}}
        - {category: grain, table: grain_ledger, aggregate: latest, field: moisture_pct, within_months: null, filters: {event_type: grain_delivery_applied, disposition: storage}}
        - {category: grain, table: grain_ledger, aggregate: latest, field: test_weight_lbs, within_months: null, filters: {event_type: grain_delivery_applied, disposition: storage}}
        - {category: grain, table: grain_ledger, aggregate: sum, field: net_bushels, within_months: 3, filters: {event_type: grain_delivery_applied, disposition: contract_application}}
      cross_category: [grain]

  - id: storage_ext_conditioning_shrink
    base_policy_refs: [storage_drying_and_shrink]
    overwrite: []
    trigger: state_due
    subject: [storage_shrink_taken]
    computes: shrink_bushels
    params:
      rehandling_step_pct: 0.10
      turning_step_pct: 0.06
      cleaning_fm_pct: 1.5
      cleaning_step_pct: 0.08
      light_cleaning_step_pct: 0.03
      damage_threshold_pct: 3.0
      damage_step_pct: 0.09
      light_damage_step_pct: 0.04
      deep_shrink_points: 2.5
      standard_cap_points: 2.0
      crop_year_shrink_allowance: 1200
    target_tool: record_conditioning_shrink_cafcaf64
    rule: >
      Water leaving the grain and the handling loss that goes with it take bushels off what the member has in store,
      and they are taken off in one line against the storage account rather than charged for. The shrink is taken on
      the bushels the most recent conditioning charge was raised on, on the points that charge shows, and at the
      handling shrink percentage the programme sets for each point. The bushels taken off for
      shrink are fixed only after the storage account carries a conditioning charge raised on the day the bushels are
      taken off, since the shrink follows the pass that caused it. The bushels taken off are the bushels the shrink is
      taken on, multiplied by the points it is taken on and by the handling shrink percentage the programme sets for
      each point, that product divided by one hundred and rounded to two decimal places. Which bushels the shrink is
      taken on follows how much of the lot has been worked: where more than one conditioning charge on the account
      carries points no shrink line covers, the shrink is taken on the bushels standing in store, the whole lot having
      been through the dryer; where one conditioning charge carries points no shrink line covers and bushels have left
      store since the grain went in, the shrink is taken on the largest bushels any conditioning charge on the account
      was raised on; and otherwise the shrink is taken on the bushels the most recent conditioning charge was raised
      on. The points the shrink is taken on are read off the account the same way: where the points carried by the
      conditioning charges stand above the points the shrink lines already carry by more than the most recent
      conditioning charge shows, the shrink is taken on the points the conditioning charges show less the points the
      shrink lines carry, so that a pass whose shrink was never taken is not lost; where the most recent conditioning
      charge shows no points at all, the shrink is taken on the programme's minimum points; and otherwise the shrink is
      taken on the points the most recent conditioning charge shows. Bushels standing in store are backed out of the
      storage account, being the bushels taken into store less the bushels already taken off for shrink and less the
      bushels loaded out. The percentage taken for each point turns on how often the grain has been handled: where more
      than one conditioning charge has been raised on the agreement in the last twelve months, the programme's handling
      shrink percentage carries the re-handling step, every trip through the leg costing bushels; where one
      conditioning charge has been raised in the last twelve months and a turning charge stands on the account, the
      programme's percentage carries the turning step; and otherwise the programme's percentage is taken as it stands.
      Dirty grain loses more in the cleaning: where the scale ticket the grain came in on shows foreign material above
      the cleaning threshold and the grain was taken in above the programme's target moisture, the cleaning step is
      added to the percentage; where the scale ticket shows foreign material above the cleaning threshold, or the grain
      was taken in above the programme's target moisture, the light cleaning step is added; and otherwise no step is
      added for cleaning. Damaged kernels break up in the leg: where the scale ticket shows damage above the damage
      threshold and the grade of record stands below US No. 2, the damage step is added to the percentage; where the
      scale ticket shows damage above the damage threshold, or the grade of record stands below US No. 2, the light
      damage step is added; and otherwise no step is added for damage. The cleaning step and the damage step are added
      to the handling shrink percentage on that same percentage rather than one acting on the other's result, and the
      percentage so obtained is carried to three decimal places before it is applied. No single shrink line is taken on
      more points than the account allows: where the points the shrink would be taken on stand above the deep-shrink
      count and more than one conditioning charge on the account carries points no shrink line covers, the points are
      capped at the deep-shrink count; where the points stand above the deep-shrink count with one conditioning
      charge uncovered, or the shrink already taken on the account in the last twelve months stands above the crop-year
      shrink allowance, the points are capped at the standard cap count; and otherwise the points are taken as they
      were read off the account.
    prerequisite:
      - problem: storage_ext_drying_pass
        kind: value_input
        gate: shrink_points
        form: state
        policy_source: >-
          The bushels taken off for shrink are fixed only after the storage account carries a conditioning charge raised on the day the bushels are taken off, since the shrink follows the pass that caused it.
        condition: >-
          The storage account carries a conditioning charge whose charge date is the day the shrink line is taken, so that the points the shrink is worked out on include the pass just run.
        resolved_by: charge_drying_pass_a57b52cd
        effect: >-
          the points the conditioning charges show rise by the points of the pass raised that day, so the points the shrink is taken on rise with them
    cross_category:
      - category: grain
        as: history
        reads: [grain_ledger.foreign_material_pct, grain_ledger.moisture_pct, grain_ledger.damage_pct]
        note: the cleaning step and the damage step are decided from the foreign material, moisture and damage the member's own scale ticket in the grain ledger shows for the load taken into store
    compute:
      - deposited: "SUM('storage_charges','bushels', date_field='charge_date', event_type='storage_deposit_recorded')"
      - shrink_taken: "SUM('storage_charges','shrink_bushels', date_field='charge_date', event_type='storage_shrink_taken')"
      - moved_out: "SUM('storage_charges','bushels', date_field='charge_date', event_type='storage_loadout_recorded')"
      - standing_bushels: "RND(deposited - shrink_taken - moved_out, 2)"
      - drying_charge_count: "COUNT('storage_charges', date_field='charge_date', event_type='storage_drying_charged')"
      - shrink_line_count: "COUNT('storage_charges', date_field='charge_date', event_type='storage_shrink_taken')"
      - unshrunk_charge_count: "MX(drying_charge_count - shrink_line_count, 0)"
      - loadout_count: "COUNT('storage_charges', date_field='charge_date', event_type='storage_loadout_recorded')"
      - max_charge_bushels: "MAX('storage_charges','bushels', event_type='storage_drying_charged')"
      - latest_charge_bushels: "float(LATEST('storage_charges','bushels', date_field='charge_date', event_type='storage_drying_charged') or 0)"
      - shrink_base_bushels: "standing_bushels if unshrunk_charge_count > 1 else (max_charge_bushels if unshrunk_charge_count == 1 and loadout_count > 0 else latest_charge_bushels)"
      - drying_points_total: "SUM('storage_charges','points_removed', date_field='charge_date', event_type='storage_drying_charged')"
      - shrink_points_total: "SUM('storage_charges','points_removed', date_field='charge_date', event_type='storage_shrink_taken')"
      - latest_charge_points: "float(LATEST('storage_charges','points_removed', date_field='charge_date', event_type='storage_drying_charged') or 0)"
      - shrink_points: "RND(drying_points_total - shrink_points_total, 1) if RND(drying_points_total - shrink_points_total, 1) > latest_charge_points else (P('drying_minimum_points') if latest_charge_points <= 0 else latest_charge_points)"
      - drying_charges_12m: "COUNT('storage_charges', within_months=12, date_field='charge_date', event_type='storage_drying_charged')"
      - turning_charges: "COUNT('storage_charges', date_field='charge_date', charge_type='turning')"
      - handling_rate_pct: "P('drying_handling_shrink_pct_per_point') + K('rehandling_step_pct') if drying_charges_12m > 1 else (P('drying_handling_shrink_pct_per_point') + K('turning_step_pct') if drying_charges_12m == 1 and turning_charges > 0 else P('drying_handling_shrink_pct_per_point'))"
      - intake_foreign_material: "float(XLATEST('grain','grain_ledger','foreign_material_pct', date_field='delivery_date', event_type='grain_delivery_applied', disposition='storage') or 0)"
      - intake_moisture: "float(XLATEST('grain','grain_ledger','moisture_pct', date_field='delivery_date', event_type='grain_delivery_applied', disposition='storage') or 0)"
      - cleaning_step: "K('cleaning_step_pct') if intake_foreign_material > K('cleaning_fm_pct') and intake_moisture > P('drying_target_moisture_pct') else (K('light_cleaning_step_pct') if intake_foreign_material > K('cleaning_fm_pct') or intake_moisture > P('drying_target_moisture_pct') else 0.0)"
      - intake_damage: "float(XLATEST('grain','grain_ledger','damage_pct', date_field='delivery_date', event_type='grain_delivery_applied', disposition='storage') or 0)"
      - damage_step: "K('damage_step_pct') if intake_damage > K('damage_threshold_pct') and (F('quality_grade') == 'us_no_3' or F('quality_grade') == 'sample_grade') else (K('light_damage_step_pct') if intake_damage > K('damage_threshold_pct') or F('quality_grade') == 'us_no_3' or F('quality_grade') == 'sample_grade' else 0.0)"
      - total_rate_pct: "RND(handling_rate_pct + cleaning_step + damage_step, 3)"
      - crop_year_shrink: "SUM('storage_charges','shrink_bushels', within_months=12, date_field='charge_date', event_type='storage_shrink_taken')"
      - capped_points: "MN(shrink_points, K('deep_shrink_points')) if shrink_points > K('deep_shrink_points') and unshrunk_charge_count > 1 else (MN(shrink_points, K('standard_cap_points')) if (shrink_points > K('deep_shrink_points') and unshrunk_charge_count == 1) or crop_year_shrink > K('crop_year_shrink_allowance') else shrink_points)"
      - result: "RND(shrink_base_bushels * capped_points * total_rate_pct / 100, 2)"
    compute_basis:
      deposited: "Bushels standing in store are backed out of the storage account, being the bushels taken into store less the bushels already taken off for shrink and less the bushels loaded out."
