    baseline:
      rule: >-
        The order is for the bushels the signed load-out request standing received on the agreement names, the bushels
        free are the bushels on hand, and the ceiling the facility works to is the country ceiling. The bushels released
        are the smallest of the bushels the order names, the bushels left free after every holdback, and the ceiling the
        facility works to, that figure then carried down by the rounding the facility uses and rounded to two decimal
        places. Bushels on hand are backed out of the storage account, being the bushels taken into store less the
        bushels taken off for shrink and less the bushels loaded out, and never read off the agreement header. The
        holdbacks are taken off the bushels free rather than one acting on another's result, the ceiling is applied to
        what is left after them, and the carrying down is done once, at the end.
