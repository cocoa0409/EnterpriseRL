        effect: parameter
        decides: grade_holdback
        bindings: [grade_discounts_12m, grade_holdback]
        ladder:
          - when: "a grade discount has been raised on the account in the last twelve months and the agreement carries no bushels pledged against an outstanding warehouse receipt"
            value: "the wide grade holdback"
          - when: "a grade discount has been raised on the account in the last twelve months and the agreement carries bushels pledged against an outstanding warehouse receipt"
            value: "the light grade holdback"
          - when: "otherwise, no grade discount has been raised on the account in the last twelve months"
            value: "nothing is held back for grade"
        baseline:
          grade_holdback: "0.0"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: conditioning_reserve_held
        effect: parameter
        decides: conditioning_reserve
        bindings: [uncovered_points, conditioning_reserve]
        ladder:
          - when: "the conditioning charges standing on the account show points no shrink line covers and the agreement carries bushels pledged against an outstanding warehouse receipt"
            value: "the wide conditioning reserve"
          - when: "the conditioning charges show points no shrink line covers and the agreement carries no bushels pledged against an outstanding warehouse receipt"
            value: "the light conditioning reserve"
          - when: "otherwise, every point the conditioning charges show is covered by a shrink line"
            value: "nothing is held back for conditioning"
