            value: "the programme's handling shrink percentage as it stands"
        baseline:
          handling_rate_pct: "P('drying_handling_shrink_pct_per_point')"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: cleaning_shrink_step
        effect: parameter
        decides: cleaning_step
        bindings: [intake_foreign_material, intake_moisture, cleaning_step]
        ladder:
          - when: "the scale ticket the grain came in on shows foreign material above the cleaning threshold and the grain was taken in above the programme's target moisture"
            value: "the cleaning step added to the percentage"
          - when: "the scale ticket shows foreign material above the cleaning threshold, or the grain was taken in above the programme's target moisture"
            value: "the light cleaning step added to the percentage"
          - when: "otherwise"
            value: "no step is added for cleaning"
        baseline:
          cleaning_step: "0.0"
        evidence: [cross_category]
        cross_difficulty: grain
      - id: damage_shrink_step
        effect: parameter
        decides: damage_step
        bindings: [intake_damage, damage_step]
        ladder:
          - when: "the scale ticket shows damage above the damage threshold and the grade of record stands below US No. 2"
            value: "the damage step added to the percentage"
          - when: "the scale ticket shows damage above the damage threshold, or the grade of record stands below US No. 2"
            value: "the light damage step added to the percentage"
          - when: "otherwise"
            value: "no step is added for damage"
        baseline:
          damage_step: "0.0"
        evidence: [cross_category, tier_param]
        cross_difficulty: grain
      - id: shrink_points_cap
        effect: parameter
        decides: capped_points
        bindings: [crop_year_shrink, capped_points]
        ladder:
          - when: "the points the shrink would be taken on stand above the deep-shrink count and more than one conditioning charge on the account carries points no shrink line covers"
            value: "the deep-shrink count"
          - when: "the points stand above the deep-shrink count with one conditioning charge uncovered, or the shrink already taken on the account in the last twelve months stands above the crop-year shrink allowance"
            value: "the standard cap count"
          - when: "otherwise"
            value: "the points as they were read off the account"
        baseline:
          capped_points: "shrink_points"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The shrink is taken on the bushels the most recent conditioning charge was raised on, on the points that charge
        shows, and at the handling shrink percentage the programme sets for each point. The bushels taken off are the
        bushels the shrink is taken on, multiplied by the points it is taken on and by the handling shrink percentage
        the programme sets for each point, that product divided by one hundred and rounded to two decimal places.
      params: [drying_handling_shrink_pct_per_point]
    inputs:
      history:
        - {table: storage_charges, aggregate: sum, field: bushels, within_months: null, filters: {event_type: storage_deposit_recorded}}
        - {table: storage_charges, aggregate: sum, field: points_removed, within_months: null, filters: {event_type: storage_drying_charged}}
        - {table: storage_charges, aggregate: sum, field: points_removed, within_months: null, filters: {event_type: storage_shrink_taken}}
        - {table: storage_charges, aggregate: count, field: charge_id, within_months: 12, filters: {event_type: storage_drying_charged}}
        - {table: storage_charges, aggregate: max, field: bushels, within_months: null, filters: {event_type: storage_drying_charged}}
        - {category: grain, table: grain_ledger, aggregate: latest, field: foreign_material_pct, within_months: null, filters: {event_type: grain_delivery_applied, disposition: storage}}
        - {category: grain, table: grain_ledger, aggregate: latest, field: damage_pct, within_months: null, filters: {event_type: grain_delivery_applied, disposition: storage}}
      cross_category: [grain]

  - id: storage_ext_receipt_pledge_release
    base_policy_refs: [storage_receipt_and_pledge]
    overwrite: []
    trigger: on_request
    subject: [storage_agreement_updated]
    computes: reserved_bushels
    params:
      large_receipt_bushels: 25000
      wide_margin_bushels: 1250
      standard_margin_bushels: 400
      wide_grade_margin_bushels: 900
      light_grade_margin_bushels: 300
      commitment_bushels: 15000
      lien_holdback_bushels: 2500
      light_lien_bushels: 800
      wide_commingled_margin_bushels: 780
      light_commingled_margin_bushels: 260
    target_tool: reduce_receipt_pledge_f1b6f4e9
    rule: >
      A member who wants grain out from under an outstanding warehouse receipt asks the elevator to reduce the receipt
      rather than to cancel it outright, and what is left standing pledged is worked out for them before they sign.
      The pledge is reduced by the bushels the largest signed load-out request standing received on the agreement names,
      and where that would take the pledge below nothing the pledge is taken to nothing and the receipt is surrendered.
      The revised pledge is the bushels left on the receipt plus every margin the elevator keeps standing, the sum taken
      to no less than nothing and rounded to two decimal places. A margin is kept standing above what the receipt still
      covers, because a receipt has to be redeemable in grain of the grade it names: where the receipt covers the
      large-receipt count or more and a quality recheck has been asked for on the agreement, the wide redemption margin
      is kept; where the receipt covers the large-receipt count or more, or a quality recheck has been asked for on the
      agreement, the standard margin is kept; and otherwise no redemption margin is kept. The grade the grain is
      standing at is kept in view as well, since a receipt names a grade and has to be redeemable in it: where the grade
      of record stands below US No. 2 and the agreement guarantees the grade written on the receipt, the wide grade
      margin is kept; where the grade of record stands at US No. 2 or above and a grade discount has been raised
      on the account in the last twelve months, the light grade margin is kept; and otherwise no grade margin is kept. Bushels
      the member has already committed onto a marketing contract are not free either, and they are carried in the same
      pledged figure, the bushels applied being counted as the net bushels the delivery entry credits to the contract rather than the gross weigh across the scale: where fifteen thousand bushels or more stand open on active marketing contracts for the same
      commodity and no bushels have been applied to them in the last three months, the whole of the bushels still open
      stays pledged; where bushels stand open on an active marketing contract for the same commodity, or bushels have
      been applied to the member's marketing contracts in the last three months, the bushels still open less the
      bushels applied over those three months stays pledged, and never less than nothing; and otherwise nothing stays
      pledged for a marketing commitment. The elevator also keeps bushels standing against what the account owes it,
      and it keeps the most where it has no settlement of the member's to draw the money from: where a storage accrual
      stands unpaid on the account and the programme does not settle storage out of grain proceeds, the lien holdback
      stays pledged; where a storage accrual stands unpaid on the account and the programme does settle storage out of
      grain proceeds, the light lien holdback stays pledged; and otherwise, no storage accrual standing unpaid on the
      account, nothing is held for charges. Grain that has been run in with the
      house bin is not identified bushel for bushel, so a margin is kept for it: where the programme commingles the lot
      with the house bin and bushels were taken in on more than two scale tickets, the wide commingled margin is kept;
      where the programme commingles the lot with the house bin and bushels were taken in on one or two scale
      tickets, the light commingled margin is kept; and otherwise, the programme keeping the lot out of the house bin,
      no commingled margin is kept. Receipts are written in round lots, so the revised pledge is
      carried up rather than left ragged: where more than one receipt has been issued against the agreement in the last
      twelve months, the revised pledge is carried up to the next whole thousand bushels; where one receipt has been
      issued against the agreement in the last twelve months, it is carried up to the next whole hundred bushels; and
      otherwise it stands as it was worked out. The margins and the holdbacks are added to the bushels left on the
      receipt rather than one acting on another's result, and the rounding up is done once, on the total.
    prerequisite: []
    cross_category:
      - category: grain
        as: history
        reads: [status, open_bushels, commodity, grain_ledger.net_bushels]
        note: the marketing commitment holdback is decided from the bushels still open on an active contract for the same commodity and from the bushels applied to the member's contracts in the last three months
    compute:
      - largest_request_bushels: "MAX('storage_requests','requested_bushels', request_type='loadout', request_status='received', signed_by_member=True)"
      - pledged_now: "float(F('reserved_bushels') or 0)"
      - release_basis: "MX(pledged_now - largest_request_bushels, 0)"
      - recheck_requests: "COUNT('storage_requests', date_field='requested_date', request_type='quality_recheck')"
      - redemption_margin: "K('wide_margin_bushels') if pledged_now >= K('large_receipt_bushels') and recheck_requests > 0 else (K('standard_margin_bushels') if pledged_now >= K('large_receipt_bushels') or recheck_requests > 0 else 0.0)"
      - grade_discounts_12m: "COUNT('storage_charges', within_months=12, date_field='charge_date', event_type='storage_quality_discount_applied')"
      - grade_margin: "K('wide_grade_margin_bushels') if (F('quality_grade') == 'us_no_3' or F('quality_grade') == 'sample_grade') and P('quality_grade_guarantee') == 'receipt_grade' else (K('light_grade_margin_bushels') if not (F('quality_grade') == 'us_no_3' or F('quality_grade') == 'sample_grade') and grade_discounts_12m > 0 else 0.0)"
      - contract_open_bushels: "float(CFIELD('grain','open_bushels', status='active', commodity=F('commodity')) or 0)"
      - applied_bushels_90d: "XSUM('grain','grain_ledger','net_bushels', within_months=3, date_field='delivery_date', event_type='grain_delivery_applied', disposition='contract_application')"
      - commitment_holdback: "contract_open_bushels if contract_open_bushels >= K('commitment_bushels') and applied_bushels_90d <= 0 else (MX(contract_open_bushels - applied_bushels_90d, 0) if contract_open_bushels > 0 or applied_bushels_90d > 0 else 0.0)"
      - unpaid_accruals: "SUM('storage_charges','amount', date_field='charge_date', event_type='storage_accrual_charged', paid_flag=False)"
      - lien_holdback: "K('lien_holdback_bushels') if unpaid_accruals > 0 and not P('storage_settlement_from_grain_proceeds') else (K('light_lien_bushels') if unpaid_accruals > 0 and P('storage_settlement_from_grain_proceeds') else 0.0)"
      - deposit_count: "COUNT('storage_charges', date_field='charge_date', event_type='storage_deposit_recorded')"
      - commingled_margin: "K('wide_commingled_margin_bushels') if P('commingling_allowed') and deposit_count > 2 else (K('light_commingled_margin_bushels') if P('commingling_allowed') and deposit_count <= 2 else 0.0)"
      - raw_pledge: "MX(release_basis + redemption_margin + grade_margin + commitment_holdback + lien_holdback + commingled_margin, 0)"
      - receipts_issued_12m: "COUNT('storage_charges', within_months=12, date_field='charge_date', charge_type='receipt_issuance')"
      - rounded_pledge: "float(int(-(-raw_pledge // 1000)) * 1000) if receipts_issued_12m > 1 else (float(int(-(-raw_pledge // 100)) * 100) if receipts_issued_12m == 1 else RND(raw_pledge, 2))"
      - result: "RND(rounded_pledge, 2)"
    compute_basis:
      largest_request_bushels: "The pledge is reduced by the bushels the largest signed load-out request standing received on the agreement names, and where that would take the pledge below nothing the pledge is taken to nothing and the receipt is surrendered."
      pledged_now: "The pledge is reduced by the bushels the largest signed load-out request standing received on the agreement names, and where that would take the pledge below nothing the pledge is taken to nothing and the receipt is surrendered."
      release_basis: "The pledge is reduced by the bushels the largest signed load-out request standing received on the agreement names, and where that would take the pledge below nothing the pledge is taken to nothing and the receipt is surrendered."
