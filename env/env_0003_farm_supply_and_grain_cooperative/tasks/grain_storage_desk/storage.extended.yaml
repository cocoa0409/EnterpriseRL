    factors:
      - id: shrink_bushels_basis
        effect: method
        decides: shrink_base_bushels
        bindings: [deposited, shrink_taken, moved_out, standing_bushels, drying_charge_count, shrink_line_count, unshrunk_charge_count, loadout_count, max_charge_bushels, latest_charge_bushels, shrink_base_bushels]
        ladder:
