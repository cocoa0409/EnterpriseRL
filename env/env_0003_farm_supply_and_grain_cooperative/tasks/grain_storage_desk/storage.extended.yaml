        ladder:
          - when: "the grain is held at a rail terminal and no load-out has been worked on the agreement in the last thirty days"
            value: "the rail ceiling"
          - when: "the grain is held at a rail terminal and a load-out has been worked on the agreement in the last thirty days"
            value: "the reduced rail ceiling"
          - when: "otherwise"
            value: "the country ceiling"
        baseline:
