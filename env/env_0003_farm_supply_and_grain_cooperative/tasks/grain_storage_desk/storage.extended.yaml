    baseline:
      rule: >-
        The charge for the period is the daily rate the programme posts, applied to the bushels standing in store that
        are free to move and to every day of the period: the daily rate multiplied by the billed bushels multiplied by
        the days billed, that product rounded to the nearest cent, and where the product falls under the programme's
        period minimum the period minimum is charged instead. The bushels standing in store are backed out of the
        storage account and never read off the agreement header, being the bushels taken into store under the agreement
        less the bushels taken off for shrink and less the bushels loaded out, and the bushels free to move are those
        bushels less the bushels pledged against an outstanding warehouse receipt. A billing period runs the
        programme's period length in calendar days beginning the day after the date storage was last billed and paid
        through, and only a period whose last day has already passed is billed. The daily rate is worked out in full
        and carried to five decimal places before it is applied to the bushels and the days.
      params: [storage_rate_per_bushel_per_day_usd, storage_billing_period_days, storage_minimum_charge_usd]
