        - {table: storage_charges, aggregate: count, field: charge_id, within_months: 1, filters: {event_type: storage_loadout_recorded}}
        - {table: storage_requests, aggregate: latest, field: requested_bushels, within_months: null, filters: {request_type: loadout, request_status: received}}
