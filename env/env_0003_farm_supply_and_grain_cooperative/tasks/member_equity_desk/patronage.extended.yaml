        owed and the settlement charge are then taken off that sum; where the remainder would be less than nothing, nothing is settled; and the
        result is rounded to two decimal places. Every figure in this settlement is carried to two decimal places, a half cent rounding up.
      params: [estate_retirement_discount_pct, arrears_none, no_estate_offset, no_estate_charge, no_cash_carry]
    inputs:
      history:
        - {table: patronage_ledger, aggregate: sum, field: retain_amount, within_months: null, filters: {event_type: patronage_retain_withheld}}
        - {table: patronage_ledger, aggregate: sum, field: cash_portion_amount, within_months: null, filters: {event_type: patronage_allocation_posted}}
