      - retain_volume: "(accrued_grain + RND(accrued_input * input_share, 2)) if (accrued_grain > notice_units and notice_units > 0) else (accrued_grain if (notice_units <= 0 and accrued_grain > 0) else (notice_units + RND(accrued_input * input_share, 2)))"
      - prior_retain_rate: "(LATEST('patronage_ledger','rate_per_unit', date_field='entry_date', event_type='patronage_retain_withheld') or 0)"
