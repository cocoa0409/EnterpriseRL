    factors:
      - id: eligible_year_basis
        effect: method
        decides: eligible_credits
        bindings: [eligible_year, year_credits, prior_year_credits, eligible_credits]
        ladder:
          - when: "the fiscal year the membership records as its revolvement eligibility year stands at or before the year most recently allocated and credits stand on the ledger for that year"
            method: "the payment is drawn from the credits carrying that eligibility year"
          - when: "the recorded eligibility year stands after the year most recently allocated and credits stand for the fiscal year before it"
            method: "the payment is drawn from the credits carrying that earlier year"
