      - retain_rate: "prior_retain_rate if (prior_retain_rate > 0) else (K('established_retain_rate') if (prior_retain_rate <= 0 and membership_years >= K('established_years')) else P('per_unit_retain_rate_usd'))"
      - allocated_years: "COUNT('patronage_ledger', event_type='patronage_allocation_posted')"
      - standing_share: "K('long_voting_share') if (F('voting_rights') and allocated_years >= K('seasoned_notice_count')) else (K('new_voting_share') if (F('voting_rights') and allocated_years < K('seasoned_notice_count')) else K('non_voting_share'))"
      - raw_retain: "RND(retain_volume * retain_rate, 2)"
      - result: "RND(raw_retain * standing_share, 2)"
