      - id: prior_accrual_basis
        effect: method
        decides: already_accrued
        bindings: [notice_volume, restatement_volume, accrual_volume, already_accrued]
        ladder:
          - when: "an allocation notice stands posted for the year on the grain basis and the accrual rows recorded for the year on that basis carry more volume than it was posted on"
            method: "the volume already standing accrued is the sum of those accrual rows"
          - when: "a restatement stands on the ledger for the year most recently allocated on the grain basis and the accrual rows carry no more volume than the notice was posted on"
            method: "the volume already standing accrued is read from the latest such restatement"
          - when: "otherwise"
            method: "the volume already standing accrued is read from the allocation notice posted for that year on the grain basis"
        baseline:
          already_accrued: "notice_volume"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The volume settled inside the fiscal year is the net settled bushels standing on the member's grain settlement statements recorded in
        the seventeen months up to today, less the net settled bushels standing on the statements recorded in the five months up to today, so
        that what is left is the volume the cooperative settled with them inside the year that closed. The five-month mark is where the desk draws the close of the year, and a record dated between that mark and the last day of the fiscal year falls to the new year by it, the mark and not the calendar deciding the side a record lies on. The volume settled inside the year
        counts in full and carries no conditioning allowance, and the volume so taken is rounded to two decimal places. The volume already standing accrued for the year is read from the allocation notice posted for that year on the grain basis. The volume still to be credited is the volume that counts less the volume already standing accrued, rounded to two decimal places, and where that difference would be less than nothing, nothing further is credited. Every figure this rule works out is carried to two decimal places, and a half cent rounds up.
      params: [year_window_months, reach_none_months, direct_share_none, conditioning_none]
    inputs:
      history:
        - {category: grain, table: grain_ledger, aggregate: sum, field: settled_bushels, within_months: 17, filters: {event_type: grain_settlement_issued}}
        - {category: grain, table: grain_ledger, aggregate: sum, field: net_bushels, within_months: 17, filters: {event_type: grain_delivery_applied}}
        - {table: patronage_ledger, aggregate: sum, field: patronage_units, within_months: null, filters: {event_type: patronage_units_accrued}}
      cross_category: [grain]
  - id: patronage_ext_allocation_restatement
    base_policy_refs: [patronage_adjustment, patronage_cash_payment]
    overwrite:
      - base_policy: patronage_cash_payment
        superseded_clause: >-
          The cash portion is paid once per allocation notice, so a corrected notice is paid by a further row referencing the same notice and
          not by reissuing the first payment.
        replaced_by: >-
          A restatement is carried wholly through the member's equity account, and the cash portion already delivered on the notice restated is
          neither reworked nor reissued.
      - base_policy: patronage_adjustment
        superseded_clause: >-
          posts the allocation afresh at the rate declared for the year restated, never at
          this year's rate
        replaced_by: >-
          Where the member's own programme standing earns a rate on a basis, that programme rate stands in place of the rate the notice carries
          for it.
    trigger: state_due
    subject: [patronage_allocation_adjusted]
    computes: restated_allocation_amount
    target_tool: restate_allocation_notice_7a44a997
    params:
      input_rate_prepay: 0.0200
      input_rate_open: 0.0165
      energy_rate_contract: 0.0300
      energy_rate_posted: 0.0210
      holdback_heavy: 0.85
      holdback_light: 0.95
      holdback_none: 1.00
      discount_window_months: 17
    rule: >
      A patronage notice already declared is restated when the volume standing behind it turns out not to be the volume the member actually
      did, and the restated figure is what the year's business earns at the rates of record for the year restated. A notice is restated only
      after every parcel of that year's qualifying business stands accrued on the equity ledger. A restatement is carried wholly through the
      member's equity account, and the cash portion already delivered on the notice restated is neither reworked nor reissued. A restatement is occasioned by a volume that turns out to have been understated, so the row is recorded against the stream whose volume the year's accrual rows have overtaken, and where the accrual rows have overtaken more than one stream's volume it is recorded against the stream whose overtaking adds most to the allocation. The volume recorded on the row is that stream's volume as restated, and the amount recorded is the whole allocation the year now earns across every basis.

      A notice is restated on the volume the notice was posted on, taken from the allocation line the notice carries for each basis. Where an
      allocation notice stands posted for the year on the grain basis and the accrual rows recorded for the year on that basis carry more
      volume than it was posted on, the grain volume restated is instead the sum of those accrual rows; and where the accrual rows carry no more
      volume than the notice was posted on but a restatement already stands on the ledger for that year on the grain basis, the grain volume
      restated is the volume that earlier restatement carries.

      Crop input purchases earn on the invoiced amount net of discounts, so a rebate allowed after the notice went out reduces the volume the
      notice rests on: where an allocation notice stands posted for the year on the crop input basis and the accrual rows recorded for the year
      on that basis carry more volume than it was posted on, the crop input volume restated is the sum of those accrual rows; where the accrual rows carry no more volume than the notice was posted on and discounts stand granted on the member's crop input invoices in the seventeen months up to today, the crop
      input volume restated is the volume the notice was posted on less those discounts; and where neither holds, the crop input volume restated is
      the volume the notice was posted on.

      The rate for each basis is the rate the notice for the year restated carries for that basis. Where the member's own programme standing
      earns a rate on a basis, that programme rate stands in place of the rate the notice carries for it.

      The crop input rate follows the terms the member buys on, because prepaid money is capital the cooperative has had the use of all season:
      where a crop input account stands on the early pay prepay programme with a prepay balance still standing on it and a crop input account
      stands active, the crop input rate is two cents in the dollar; where a crop input account stands active and no prepay balance stands on
      the early pay prepay programme, the crop input rate is one and sixty-five hundredths of a cent in the dollar; and where no crop input
      account stands active at all, the rate the notice carries for the crop input basis stands.

      The refined fuels rate follows the same reasoning on gallons: where a refined fuels account stands on the contract gallon pre-buy
      programme with contracted gallons still owed on it and a refined fuels account stands active, the refined fuels rate is three cents in
      the gallon; where a refined fuels account stands active and no contracted gallons stand owed on the contract gallon pre-buy programme,
      the refined fuels rate is two and one tenth cents in the gallon; and where no refined fuels account stands active at all, the rate the
      notice carries for the refined fuels basis stands.

      Bushels the member has delivered but never priced are bushels the cooperative has not yet sold, so a restatement made while they stand
      open is held back: where the unpriced bushels standing on the member's grain ledger are more than a fifth of the grain volume restated,
      the restated allocation is taken at eighty-five hundredths of itself; where unpriced bushels stand on that ledger but are not more than a
      fifth of the grain volume restated, it is taken at ninety-five hundredths of itself; and where no unpriced bushels stand at all, no
      holdback is taken.

      The restated allocation is worked out basis by basis: the volume for each basis is multiplied by the rate that basis carries, each product
      is rounded to two decimal places, and the three products are added. No holdback is taken, and the sum so reached is rounded to two decimal
      places and stands as the restated allocation. Where a holdback does apply, it acts once on that sum and not on any single basis, and the
      figure it gives is rounded to two decimal places. Amounts worked out under this rule are carried to two decimal places, a half cent rounding up.
    prerequisite:
      - problem: patronage_ext_year_end_unit_accrual
        kind: value_input
        gate: accrual_sum
        form: state
        policy_source: >-
          A notice is restated only after every parcel of that year's qualifying business stands accrued on the equity ledger.
        condition: >-
          the accrual rows standing on the equity ledger for the year restated carry the whole of that year's qualifying business on each basis
        resolved_by: book_qualifying_units_5a905387
        effect: >-
          the accrual rows for the year on the grain basis come to carry the year's whole qualifying volume, so the binding accrual_sum rises to
          that volume and the grain volume the restatement rests on is taken from those rows
    cross_category:
      - category: grain
        as: history
        reads: [grain_ledger.gross_bushels]
        note: the unpriced bushels standing on the member's grain ledger decide the holdback tier applied to the restated allocation.
      - category: agronomy
        as: branch
        reads: [status, variant_name, prepay_balance, agronomy_invoices.discount_amount]
        note: the member's crop input accounts decide the crop input allocation rate tier, and the discounts granted on their invoices decide the crop input volume tier.
      - category: energy
        as: branch
        reads: [status, variant_name, current_gallons_owed]
        note: the member's refined fuels accounts decide the refined fuels allocation rate tier.
    compute:
      - notice_units: "(LATEST('patronage_ledger','patronage_units', date_field='entry_date', event_type='patronage_allocation_posted', fiscal_year=F('last_allocation_year'), allocation_basis='grain_bushels') or 0)"
      - accrual_sum: "SUM('patronage_ledger','patronage_units', event_type='patronage_units_accrued', fiscal_year=F('last_allocation_year'), allocation_basis='grain_bushels')"
      - prior_restatement_units: "(LATEST('patronage_ledger','patronage_units', date_field='entry_date', event_type='patronage_allocation_adjusted', fiscal_year=F('last_allocation_year'), allocation_basis='grain_bushels') or 0)"
      - restated_grain_units: "accrual_sum if (accrual_sum > notice_units and notice_units > 0) else (prior_restatement_units if (prior_restatement_units > 0 and accrual_sum <= notice_units) else notice_units)"
      - notice_input_units: "(LATEST('patronage_ledger','patronage_units', date_field='entry_date', event_type='patronage_allocation_posted', fiscal_year=F('last_allocation_year'), allocation_basis='input_dollars') or 0)"
      - input_accrual_sum: "SUM('patronage_ledger','patronage_units', event_type='patronage_units_accrued', fiscal_year=F('last_allocation_year'), allocation_basis='input_dollars')"
      - input_discounts: "XSUM('agronomy','agronomy_invoices','discount_amount', within_months=K('discount_window_months'), date_field='invoice_date', event_type='agronomy_discount_granted')"
      - input_volume: "input_accrual_sum if (input_accrual_sum > notice_input_units and notice_input_units > 0) else (RND(notice_input_units - input_discounts, 2) if (input_accrual_sum <= notice_input_units and input_discounts > 0) else notice_input_units)"
      - notice_grain_rate: "(LATEST('patronage_ledger','rate_per_unit', date_field='entry_date', event_type='patronage_allocation_posted', fiscal_year=F('last_allocation_year'), allocation_basis='grain_bushels') or 0)"
      - notice_input_rate: "(LATEST('patronage_ledger','rate_per_unit', date_field='entry_date', event_type='patronage_allocation_posted', fiscal_year=F('last_allocation_year'), allocation_basis='input_dollars') or 0)"
      - notice_energy_rate: "(LATEST('patronage_ledger','rate_per_unit', date_field='entry_date', event_type='patronage_allocation_posted', fiscal_year=F('last_allocation_year'), allocation_basis='energy_gallons') or 0)"
      - prepay_standing: "(CFIELD('agronomy','prepay_balance', variant_name='Early Pay Prepay Program Account') or 0)"
      - input_account_open: "EXISTS('agronomy', status='active')"
      - input_rate: "K('input_rate_prepay') if (prepay_standing > 0 and input_account_open) else (K('input_rate_open') if (input_account_open and prepay_standing <= 0) else notice_input_rate)"
      - energy_units: "SUM('patronage_ledger','patronage_units', event_type='patronage_units_accrued', fiscal_year=F('last_allocation_year'), allocation_basis='energy_gallons')"
      - gallons_owed: "(CFIELD('energy','current_gallons_owed', variant_name='Contract Gallon Pre-Buy Account') or 0)"
      - energy_account_open: "EXISTS('energy', status='active')"
      - energy_rate: "K('energy_rate_contract') if (gallons_owed > 0 and energy_account_open) else (K('energy_rate_posted') if (energy_account_open and gallons_owed <= 0) else notice_energy_rate)"
      - unpriced_standing: "XSUM('grain','grain_ledger','gross_bushels', date_field='position_date', event_type='grain_unpriced_position_booked', pricing_status='unpriced')"
      - holdback_share: "K('holdback_heavy') if (unpriced_standing > 0 and unpriced_standing * 5 > restated_grain_units) else (K('holdback_light') if (unpriced_standing > 0 and unpriced_standing * 5 <= restated_grain_units) else K('holdback_none'))"
      - gross_allocation: "RND(restated_grain_units * notice_grain_rate, 2) + RND(input_volume * input_rate, 2) + RND(energy_units * energy_rate, 2)"
      - result: "RND(gross_allocation * holdback_share, 2)"
    compute_basis:
