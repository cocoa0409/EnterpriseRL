        bindings: [energy_past_due, energy_owed, gallons_owed_value, offset_amount]
        ladder:
          - when: "a refined fuels account stands past due with a balance still standing on it"
            value: "the balance standing on that refined fuels account"
          - when: "no refined fuels account stands past due and a refined fuels account stands active with contracted gallons still owed on it"
            value: "those contracted gallons at the account's contracted price"
          - when: "otherwise"
            value: "K('no_offset')"
        baseline:
          offset_amount: "K('no_offset')"
        evidence: [cross_category]
        cross_difficulty: energy
      - id: pool_ceiling_release
        effect: method
        decides: capped_payment
        bindings: [year_revolvements, capped_payment]
        ladder:
          - when: "notice of death stands recorded on the membership and no revolvement payment yet stands against the fiscal year drawn on"
            method: "the payment is not held back at all"
          - when: "notice of death stands recorded on the membership and a revolvement payment already stands against the fiscal year drawn on"
            method: "the payment is held back only so far as leaves the equity standing after it no lower than the class's minimum equity balance"
          - when: "otherwise"
            method: "the payment is held back so that it is no more than the share the class's annual pool fixes of the credits the fiscal year drawn on carries"
        baseline:
          capped_payment: "MN(net_payment, RND(eligible_credits * P('revolvement_annual_pool_pct') / 100, 2))"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The equity revolved on a membership is drawn from the whole of the equity standing unrevolved on its equity ledger, which is the equity
        portions credited on its allocation notices plus its capital retains less everything already revolved out, rounded to two decimal
        places. The share revolved is the percentage of that equity the class's annual pool fixes. The payment carries no weighting for the
        member's standing. The class's own dividend rate on preferred equity is applied to the same equity, and nothing is taken off for what
        the member owes the cooperative. The pool share is worked out first and rounded to two decimal places, the weighting for standing then
        acts on that rounded figure and the result is rounded to two decimal places, the dividend is worked out on the same equity and rounded
        to two decimal places, the two are added, what is owed is taken off the sum and the remainder floored at nothing. The payment is then
        held back so that it is no more than the share the class's annual pool fixes of the credits the fiscal year drawn on carries, and the
        result is rounded to two decimal places. Amounts under this rule are carried to two decimal places, and a half cent rounds up.
      params: [revolvement_annual_pool_pct, ordinary_priority, dividend_rate_pct, no_offset, minimum_equity_balance_usd]
    inputs:
      history:
        - {table: patronage_ledger, aggregate: sum, field: retain_amount, within_months: null, filters: {event_type: patronage_retain_withheld}}
        - {table: patronage_ledger, aggregate: sum, field: equity_portion_amount, within_months: null, filters: {event_type: patronage_allocation_posted}}
        - {table: patronage_requests, aggregate: count, field: request_id, within_months: null, filters: {request_type: estate_retirement}}
      cross_category: [energy]

  - id: patronage_ext_estate_retirement
    base_policy_refs: [patronage_retirement]
    overwrite: []
    trigger: on_request
    subject: [patronage_membership_retired]
    computes: retired_equity_amount
    target_tool: retire_estate_equity_f4a8a7dc
    params:
      large_estate_discount_pct: 3.00
      small_estate_discount_pct: 8.00
      large_estate_multiple: 10
      seasoned_retain_lines: 10
      arrears_two_years: 2
      arrears_one_year: 1
      arrears_none: 0
      no_estate_offset: 0.00
      aged_estate_charge: 60.00
      prompt_estate_charge: 25.00
      no_estate_charge: 0.00
      estate_charge_days: 90
      no_cash_carry: 0.00
    rule: >
      When a member dies and the estate's application has been lodged and recorded, the cooperative settles the whole of the equity it holds
      for them rather than leaving the family on the revolvement cycle. The equity settled to an estate is fixed only after the equity ledger
      carries the revolvement payment due on the fiscal year the membership records as eligible.

      The equity standing is the equity portions credited on the membership's allocation notices plus its capital retains, nothing being taken
      off for revolvement, rounded to two decimal places. Where a revolvement payment stands on the equity ledger for the fiscal year the
      membership records as eligible, the equity standing is instead those credits less everything revolved out, rounded to two decimal places;
      and where no such revolvement payment stands and an equity balance stands recorded on the membership above nothing, the equity standing is
      that recorded balance.

      Equity retired to an estate carries the class's own estate retirement discount. Settling a holding ahead of its cycle costs the cooperative capital, and it costs more where the equity has not yet stood long on the books: where the equity standing is above ten times the class's minimum equity balance and ten or more capital retain lines stand on the equity ledger, the discount is three in the hundred; and where the equity standing is above ten times the class's minimum equity balance and fewer than ten capital retain lines stand on the equity ledger, the discount is eight in the hundred.

      No dividend arrears are carried on the settlement. A preferred holding whose cash patronage has not reached the member carries the
      dividend for the years it has waited: where the class carries a dividend on preferred equity and no cash payment stands on the equity
      ledger for either the year most recently allocated or the year before it, the dividend is carried for two years; and where the class
      carries a dividend on preferred equity and a cash payment stands for the year before the year most recently allocated but none for the
      year most recently allocated, it is carried for one year.

      Nothing is taken off for what the member owed the cooperative, and no charge is made for settling the estate. What is owed is taken in the
      offset order the class fixes: where a feed programme stands active on the member's books and the invoices raised on it stand above the
      payments posted against it, the difference between them is taken off; and where no feed programme stands active and a crop input account
      stands with a balance still standing on it, the balance standing on that account is taken off.

      The cooperative's charge for settling an estate follows the work the file has taken: where the estate's application has stood registered
      for more than ninety days and the class issues a written certificate for retained equity, the charge is sixty dollars; and where the
      estate's application has stood registered for ninety days or fewer and the class issues a written certificate for retained equity, the
      charge is twenty-five dollars.

      No cash patronage is carried into the settlement. Cash the cooperative declared but never delivered belongs to the member's estate and is
      settled with the equity: where the cash portions standing on the equity ledger's allocation notices are above the cash delivered against
      them and notice of death stands recorded on the membership, the whole of the difference is carried into the settlement; and where those
      cash portions are above the cash delivered and no notice of death stands recorded, the difference is carried in at the share the class's
      annual revolvement pool fixes.

      The discount acts on the equity standing and the discounted figure is rounded to two decimal places; the dividend is then worked out on
      that discounted figure, at the class's own dividend rate for each year carried, and rounded to two decimal places. The discounted equity,
      the dividend and the cash carried in are added; what is owed and the settlement charge are then taken off that sum; where the remainder
      would be less than nothing, nothing is settled; and the result is rounded to two decimal places. Every figure in this settlement is carried to two decimal places, a half cent rounding up.
    prerequisite:
      - problem: patronage_ext_cycle_revolvement
        kind: value_input
        gate: revolved_out
        form: state
        policy_source: >-
          The equity settled to an estate is fixed only after the equity ledger carries the revolvement payment due on the fiscal year the
          membership records as eligible.
        condition: >-
          a revolvement payment for the fiscal year the membership records as its revolvement eligibility year stands on the equity ledger
        resolved_by: record_equity_revolvement_d16ad296
        effect: >-
          a revolvement line for that fiscal year comes to stand on the equity ledger, so the binding revolved_out rises by that payment and the
          equity standing is measured from the ledger rather than from the balance recorded on the membership
    cross_category:
      - category: feed
        as: history
        reads: [status, feed_invoices.amount]
        note: the feed programme's unpaid invoices decide the first tier of the offset taken off the estate settlement.
      - category: agronomy
        as: branch
        reads: [current_balance]
        note: the balance standing on the member's crop input account decides the second tier of that offset.
    compute:
      - retain_credits: "SUM('patronage_ledger','retain_amount', event_type='patronage_retain_withheld')"
      - notice_equity: "SUM('patronage_ledger','equity_portion_amount', event_type='patronage_allocation_posted')"
      - revolved_out: "SUM('patronage_ledger','revolvement_amount', event_type='patronage_equity_revolved')"
      - ledger_equity: "RND(retain_credits + notice_equity - revolved_out, 2)"
      - cycle_revolvements: "COUNT('patronage_ledger', event_type='patronage_equity_revolved', fiscal_year=F('revolvement_eligible_year'))"
      - equity_standing: "ledger_equity if (cycle_revolvements > 0) else (F('equity_balance') if (cycle_revolvements <= 0 and F('equity_balance') > 0) else RND(retain_credits + notice_equity, 2))"
      - retain_lines: "COUNT('patronage_ledger', event_type='patronage_retain_withheld')"
      - discount_pct: "K('large_estate_discount_pct') if (equity_standing > K('large_estate_multiple') * P('minimum_equity_balance_usd') and retain_lines >= K('seasoned_retain_lines')) else (K('small_estate_discount_pct') if (equity_standing > K('large_estate_multiple') * P('minimum_equity_balance_usd') and retain_lines < K('seasoned_retain_lines')) else P('estate_retirement_discount_pct'))"
      - after_discount: "RND(equity_standing * (100 - discount_pct) / 100, 2)"
      - recent_cash: "COUNT('patronage_ledger', event_type='patronage_cash_paid', fiscal_year=F('last_allocation_year'))"
      - prior_cash: "COUNT('patronage_ledger', event_type='patronage_cash_paid', fiscal_year=F('last_allocation_year') - 1)"
      - dividend_years: "K('arrears_two_years') if (P('dividend_paid_on_preferred') and recent_cash <= 0 and prior_cash <= 0) else (K('arrears_one_year') if (P('dividend_paid_on_preferred') and recent_cash <= 0 and prior_cash > 0) else K('arrears_none'))"
      - dividend_due: "RND(after_discount * P('dividend_rate_pct') / 100 * dividend_years, 2)"
      - feed_active: "EXISTS('feed', status='active')"
      - feed_invoiced: "XSUM('feed','feed_invoices','amount', event_type='feed_invoice_issued')"
      - feed_paid: "XSUM('feed','feed_invoices','amount', event_type='feed_payment_posted')"
      - input_balance: "(CFIELD('agronomy','current_balance') or 0)"
      - offset_amount: "RND(feed_invoiced - feed_paid, 2) if (feed_active and feed_invoiced > feed_paid) else (input_balance if (not feed_active and input_balance > 0) else K('no_estate_offset'))"
      - days_registered: "DAYS((LATEST('patronage_requests','requested_date', date_field='requested_date', request_type='estate_retirement') or NOW), NOW)"
      - settlement_charge: "K('aged_estate_charge') if (days_registered > K('estate_charge_days') and P('equity_certificate_issued')) else (K('prompt_estate_charge') if (days_registered <= K('estate_charge_days') and P('equity_certificate_issued')) else K('no_estate_charge'))"
      - cash_declared: "SUM('patronage_ledger','cash_portion_amount', event_type='patronage_allocation_posted')"
      - cash_delivered: "SUM('patronage_ledger','cash_portion_amount', event_type='patronage_cash_paid')"
      - cash_gap: "MX(0, RND(cash_declared - cash_delivered, 2))"
      - carried_cash: "cash_gap if (cash_gap > 0 and F('estate_flag')) else (RND(cash_gap * P('revolvement_annual_pool_pct') / 100, 2) if (cash_gap > 0 and not F('estate_flag')) else K('no_cash_carry'))"
      - result: "RND(MX(0, after_discount + dividend_due + carried_cash - offset_amount - settlement_charge), 2)"
    compute_basis:
      retain_credits: "The equity standing is the equity portions credited on the membership's allocation notices plus its capital retains, nothing being taken off for revolvement, rounded to two decimal places."
      notice_equity: "The equity standing is the equity portions credited on the membership's allocation notices plus its capital retains, nothing being taken off for revolvement, rounded to two decimal places."
      revolved_out: "Where a revolvement payment stands on the equity ledger for the fiscal year the membership records as eligible, the equity standing is instead those credits less everything revolved out, rounded to two decimal places"
      ledger_equity: "Where a revolvement payment stands on the equity ledger for the fiscal year the membership records as eligible, the equity standing is instead those credits less everything revolved out, rounded to two decimal places"
      cycle_revolvements: "where no such revolvement payment stands and an equity balance stands recorded on the membership above nothing, the equity standing is that recorded balance"
      equity_standing: "The equity standing is the equity portions credited on the membership's allocation notices plus its capital retains, nothing being taken off for revolvement, rounded to two decimal places. Where a revolvement payment stands on the equity ledger for the fiscal year the membership records as eligible, the equity standing is instead those credits less everything revolved out, rounded to two decimal places; and where no such revolvement payment stands and an equity balance stands recorded on the membership above nothing, the equity standing is that recorded balance."
      retain_lines: "where the equity standing is above ten times the class's minimum equity balance and ten or more capital retain lines stand on the equity ledger, the discount is three in the hundred"
      discount_pct: "Equity retired to an estate carries the class's own estate retirement discount. Settling a holding ahead of its cycle costs the cooperative capital, and it costs more where the equity has not yet stood long on the books: where the equity standing is above ten times the class's minimum equity balance and ten or more capital retain lines stand on the equity ledger, the discount is three in the hundred; and where the equity standing is above ten times the class's minimum equity balance and fewer than ten capital retain lines stand on the equity ledger, the discount is eight in the hundred."
      after_discount: "The discount acts on the equity standing and the discounted figure is rounded to two decimal places"
      recent_cash: "where the class carries a dividend on preferred equity and no cash payment stands on the equity ledger for either the year most recently allocated or the year before it, the dividend is carried for two years"
      prior_cash: "where the class carries a dividend on preferred equity and a cash payment stands for the year before the year most recently allocated but none for the year most recently allocated, it is carried for one year"
      dividend_years: "No dividend arrears are carried on the settlement. A preferred holding whose cash patronage has not reached the member carries the dividend for the years it has waited: where the class carries a dividend on preferred equity and no cash payment stands on the equity ledger for either the year most recently allocated or the year before it, the dividend is carried for two years; and where the class carries a dividend on preferred equity and a cash payment stands for the year before the year most recently allocated but none for the year most recently allocated, it is carried for one year."
      dividend_due: "the dividend is then worked out on that discounted figure, at the class's own dividend rate for each year carried, and rounded to two decimal places"
      feed_active: "where a feed programme stands active on the member's books and the invoices raised on it stand above the payments posted against it, the difference between them is taken off"
      feed_invoiced: "where a feed programme stands active on the member's books and the invoices raised on it stand above the payments posted against it, the difference between them is taken off"
      feed_paid: "where a feed programme stands active on the member's books and the invoices raised on it stand above the payments posted against it, the difference between them is taken off"
      input_balance: "where no feed programme stands active and a crop input account stands with a balance still standing on it, the balance standing on that account is taken off"
      offset_amount: "Nothing is taken off for what the member owed the cooperative, and no charge is made for settling the estate. What is owed is taken in the offset order the class fixes: where a feed programme stands active on the member's books and the invoices raised on it stand above the payments posted against it, the difference between them is taken off; and where no feed programme stands active and a crop input account stands with a balance still standing on it, the balance standing on that account is taken off."
      days_registered: "where the estate's application has stood registered for more than ninety days and the class issues a written certificate for retained equity, the charge is sixty dollars"
      settlement_charge: "The cooperative's charge for settling an estate follows the work the file has taken: where the estate's application has stood registered for more than ninety days and the class issues a written certificate for retained equity, the charge is sixty dollars; and where the estate's application has stood registered for ninety days or fewer and the class issues a written certificate for retained equity, the charge is twenty-five dollars."
      cash_declared: "where the cash portions standing on the equity ledger's allocation notices are above the cash delivered against them and notice of death stands recorded on the membership, the whole of the difference is carried into the settlement"
      cash_delivered: "where the cash portions standing on the equity ledger's allocation notices are above the cash delivered against them and notice of death stands recorded on the membership, the whole of the difference is carried into the settlement"
      cash_gap: "where the cash portions standing on the equity ledger's allocation notices are above the cash delivered against them and notice of death stands recorded on the membership, the whole of the difference is carried into the settlement"
      carried_cash: "No cash patronage is carried into the settlement. Cash the cooperative declared but never delivered belongs to the member's estate and is settled with the equity: where the cash portions standing on the equity ledger's allocation notices are above the cash delivered against them and notice of death stands recorded on the membership, the whole of the difference is carried into the settlement; and where those cash portions are above the cash delivered and no notice of death stands recorded, the difference is carried in at the share the class's annual revolvement pool fixes."
      result: "The discounted equity, the dividend and the cash carried in are added; what is owed and the settlement charge are then taken off that sum; where the remainder would be less than nothing, nothing is settled; and the result is rounded to two decimal places."
    factors:
      - id: retirement_valuation_basis
        effect: method
        decides: equity_standing
        bindings: [retain_credits, notice_equity, revolved_out, ledger_equity, cycle_revolvements, equity_standing]
        ladder:
          - when: "a revolvement payment stands on the equity ledger for the fiscal year the membership records as eligible"
            method: "the equity standing is the ledger's equity portions and capital retains less everything revolved out"
          - when: "no revolvement payment stands for the fiscal year the membership records as eligible and an equity balance stands recorded on the membership above nothing"
            method: "the equity standing is the equity balance recorded on the membership"
          - when: "otherwise"
            method: "the equity standing is the ledger's equity portions and capital retains, nothing being taken off for revolvement"
        baseline:
          equity_standing: "RND(retain_credits + notice_equity, 2)"
        evidence: [history]
        cross_difficulty: null
      - id: estate_settlement_discount
        effect: parameter
        decides: discount_pct
        bindings: [retain_lines, discount_pct]
        ladder:
          - when: "the equity standing is above ten times the class's minimum equity balance and ten or more capital retain lines stand on the equity ledger"
            value: "K('large_estate_discount_pct')"
          - when: "the equity standing is above ten times the class's minimum equity balance and fewer than ten capital retain lines stand on the equity ledger"
            value: "K('small_estate_discount_pct')"
          - when: "otherwise"
            value: "P('estate_retirement_discount_pct')"
        baseline:
          discount_pct: "P('estate_retirement_discount_pct')"
        evidence: [history]
        cross_difficulty: null
      - id: preferred_dividend_arrears
        effect: parameter
        decides: dividend_years
        bindings: [recent_cash, prior_cash, dividend_years]
        ladder:
          - when: "the class carries a dividend on preferred equity and no cash payment stands on the equity ledger for either the year most recently allocated or the year before it"
            value: "K('arrears_two_years')"
          - when: "the class carries a dividend on preferred equity and a cash payment stands for the year before the year most recently allocated but none for the year most recently allocated"
            value: "K('arrears_one_year')"
          - when: "otherwise"
            value: "K('arrears_none')"
        baseline:
          dividend_years: "K('arrears_none')"
        evidence: [history]
        cross_difficulty: null
      - id: estate_balance_offset
        effect: parameter
        decides: offset_amount
        bindings: [feed_active, feed_invoiced, feed_paid, input_balance, offset_amount]
        ladder:
          - when: "a feed programme stands active on the member's books and the invoices raised on it stand above the payments posted against it"
            value: "the difference between the invoices raised on that programme and the payments posted against it"
          - when: "no feed programme stands active and a crop input account stands with a balance still standing on it"
            value: "the balance standing on that crop input account"
