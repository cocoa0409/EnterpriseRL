          taken separately at the class's retain rate on the qualifying units of the streams the class lists
        replaced_by: >-
          The capital retain a member contributes is worked out on the volume the streams the class lists carry once the crop input spend has
          been taken at the share the member's buying account earns, at the rate the cooperative's books last retained at, and weighted by the
          member's standing in the cooperative.
    trigger: state_due
    subject: [patronage_retain_withheld]
    computes: retain_amount
    target_tool: record_capital_retain_31b65d0b
    params:
      past_due_share: 0.00
      over_limit_share: 0.50
      open_share: 1.00
      established_retain_rate: 0.0025
      established_years: 10
      long_voting_share: 0.90
      new_voting_share: 1.10
      non_voting_share: 1.00
      seasoned_notice_count: 12
    rule: >
      The per-unit capital retain a member contributes for a fiscal year is a capital subscription and not a share of earnings, so it is taken
      on the volume of business the class lists whether or not the board declares anything for the year. The capital retain a member
      contributes is worked out on the volume the streams the class lists carry once the crop input spend has been taken at the share the
      member's buying account earns, at the rate the cooperative's books last retained at, and weighted by the member's standing in the
      cooperative. The capital retain for a year is worked out only once the equity ledger carries the whole of that year's qualifying volume on the streams the class lists.

      The capital retain for a fiscal year is taken on the volume the allocation notice for that year was posted on together with the crop input spend standing accrued for the year, the crop input spend counting in full and rounded to two decimal places. Where an allocation notice stands posted for the year most recently allocated and the accrual rows recorded for the year on the grain basis carry more volume than it was posted on, the retain is taken instead on the sum of those accrual rows together with the crop input spend standing accrued for the year; and where no allocation notice stands posted for the year most recently allocated but accrual rows stand for it on the grain basis, the retain is taken on the sum of those accrual rows alone, no crop input spend being carried.

      Crop input spend only subscribes capital where the cooperative has actually been paid for it, so the spend counts by how the member's
      buying account stands: where a crop input account stands past due with a balance still standing on it, none of the crop input spend
      counts; where a crop input account stands active and the balance standing on it is above the limit that account carries, half of the crop
      input spend counts; and where neither holds, the whole of the crop input spend counts.

      The rate taken is the class's own per-unit retain rate. The books may carry the board's own figure instead: where retain rows stand on
      the equity ledger from an earlier fiscal year and the rate on the latest of them stands above nothing, the rate taken is that rate; and
      where no retain row stands from any earlier fiscal year and the membership has stood on the books ten or more whole fiscal years, the
      rate taken is twenty-five hundredths of a cent a unit.

      A cooperative asks newer members for more capital and long-standing ones for less, so the retain is finally weighted by the member's
      standing: where the membership carries voting rights and twelve or more allocation lines stand on the equity ledger, the
      retain is taken at nine tenths; where the membership carries voting rights and fewer than twelve allocation lines stand on the equity
      ledger, it is taken at eleven tenths; and where the membership carries no voting rights, it is taken as worked out.

      The volume so taken is multiplied by that rate, the product rounded to two decimal places, and that product is taken in full and rounded
      again to two decimal places as the capital retain credited to the member's equity. Where a weighting for standing does apply, it acts on
      that rounded product and the figure it gives is rounded to two decimal places. The retain and every figure behind it are carried to two decimal places, and where a half cent falls to be decided it rounds up.
