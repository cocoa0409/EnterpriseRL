        effect: parameter
        decides: carried_cash
        bindings: [cash_declared, cash_delivered, cash_gap, carried_cash]
        ladder:
          - when: "the cash portions standing on the equity ledger's allocation notices are above the cash delivered against them and notice of death stands recorded on the membership"
            value: "the whole of the difference between the cash declared and the cash delivered"
          - when: "the cash portions standing on those notices are above the cash delivered and no notice of death stands recorded on the membership"
            value: "that difference at the share the class's annual revolvement pool fixes"
