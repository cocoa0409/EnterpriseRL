    compute:
      - notice_units: "(LATEST('patronage_ledger','patronage_units', date_field='entry_date', event_type='patronage_allocation_posted', fiscal_year=F('last_allocation_year'), allocation_basis='grain_bushels') or 0)"
      - accrued_grain: "SUM('patronage_ledger','patronage_units', event_type='patronage_units_accrued', fiscal_year=F('last_allocation_year'), allocation_basis='grain_bushels')"
      - accrued_input: "SUM('patronage_ledger','patronage_units', event_type='patronage_units_accrued', fiscal_year=F('last_allocation_year'), allocation_basis='input_dollars')"
