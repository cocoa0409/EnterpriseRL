        ladder:
          - when: "an allocation notice stands posted for the year most recently allocated and the accrual rows recorded for the year on the grain basis carry more volume than it was posted on"
            method: "the retain is taken on the sum of those accrual rows together with the crop input spend standing accrued for the year"
          - when: "no allocation notice stands posted for the year most recently allocated and accrual rows stand for it on the grain basis"
            method: "the retain is taken on the sum of those accrual rows alone, no crop input spend being carried"
