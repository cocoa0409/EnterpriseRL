  - id: patronage_ext_membership_transfer_valuation
    base_policy_refs: [patronage_equity_transfer]
    overwrite:
      - base_policy: patronage_equity_transfer
        superseded_clause: >-
          A transfer moves equity at its face value with no discount, carries the class's transfer fee, and does not reset the allocation years
          behind the equity, so the transferee inherits the transferor's place in the revolvement cycle rather than starting afresh.
        replaced_by: >-
          The equity standing, the cash carried in and the stock redeemed are added; the offset, the recording charge and the certificate charge
          are then taken off that sum; where the remainder would be less than nothing, nothing moves; and the result is rounded to two decimal
          places.
    trigger: on_request
    subject: [patronage_membership_transferred]
    computes: equity_standing_amount
    target_tool: transfer_membership_equity_359bd53a
    params:
      aged_charge: 40.00
      prompt_charge: 25.00
      instruction_age_days: 30
      no_offset: 0.00
      certificate_charge_full: 15.00
      certificate_charge_part: 5.00
      no_certificate_charge: 0.00
      certificate_year_count: 10
      stock_seasoning_years: 10
      stock_minimum_years: 3
      stock_part_share: 0.50
      no_stock_credit: 0.00
      no_carry: 0.00
    rule: >
      When a member signs a whole equity membership over to the transferee named on a registered instruction, what moves is the equity standing
      on that membership at the moment the transfer is recorded, worked out from the equity account itself rather than from the balance last
      printed on a statement. The equity signed over is fixed only after the equity ledger carries the capital retain owed for the year most recently allocated. Before the equity signed over is worked out, the allocation standing for the year most recently allocated must be the allocation that year's own volume earns.

      The equity standing on a membership is the equity portions and capital retains credited to it on the equity ledger, less everything that
      has been revolved out, rounded to two decimal places. Where a restatement stands on the equity ledger for the year most recently
      allocated, the equity standing is instead those credits with the equity portion of the restated allocation put in the place of the equity
      portion credited for that year, less everything revolved out, rounded to two decimal places; and where no restatement stands for that year
      but an equity balance stands recorded on the membership above nothing, the equity standing is that recorded balance.

      The charge for recording the transfer is the class's own transfer fee. A file the desk has had to carry costs more to work than one signed this week, so where the transfer instruction registered on the membership has stood more than thirty days and the equity standing is above the class's minimum equity balance, the recording charge is forty dollars; and where that instruction has stood thirty days or fewer and the equity standing is above the class's minimum equity balance, the recording charge is twenty-five dollars. Where no transfer instruction stands registered on the membership at all, the class's own transfer fee applies, since there is no file whose age could tell against it.

      Nothing is taken off for what the member owes the cooperative, no charge is made for the certificate, no common stock is redeemed
      alongside the equity and no undelivered cash is carried in.

      Equity may not leave the cooperative while the member owes it money, and what is owed is taken in the offset order the class fixes: where
      a crop input account stands past due with a balance still standing on it, the balance standing on that account is taken off; where no crop
      input account stands past due and a refined fuels account stands active with a balance standing on it, the balance standing on that
      refined fuels account is taken off; and where neither stands, nothing is taken off.

      Where the class issues a written certificate for retained equity, the transferee's certificate must be drawn afresh from the whole
      history: where the class issues such a certificate and ten or more capital retain lines stand on the equity ledger, the
      certificate charge is fifteen dollars; where the class issues such a certificate and fewer than ten capital retain lines stand on the
      equity ledger, the certificate charge is five dollars; and where the class issues no certificate, no certificate charge is made.

      Common stock is redeemed at par alongside the equity once the membership has been held long enough to have paid for it: where shares of
      common stock stand recorded on the membership and it has stood on the books ten or more whole fiscal years, the shares recorded are
      redeemed at the class's par value; where shares stand recorded and the membership has stood on the books three or more but fewer than ten
      whole fiscal years, they are redeemed at half the class's par value; and where fewer than three whole fiscal years have run or no shares
      stand recorded, no stock is redeemed.

      Cash patronage the cooperative declared but never delivered belongs to the transferor and is carried out with the equity, and how much of it moves turns on whether the member has already been reported as having received it: where the cash portions standing on the equity ledger's allocation notices are above the cash delivered against them and allocations on the membership are reported as qualified, the whole of the difference between them is carried into what moves; where those cash portions are above the cash delivered and allocations on the membership are reported as nonqualified, the difference is carried in at the share the class's revolvement pool fixes; and where the cash delivered stands at or above the cash portions declared, or allocations on the membership are reported as mixed, nothing is carried in.

      The equity standing, the cash carried in and the stock redeemed are added; the offset, the recording charge and the certificate charge are
      then taken off that sum; where the remainder would be less than nothing, nothing moves; and the result is rounded to two decimal places. Every amount in this reckoning is carried to two decimal places, a half cent rounding up.
    prerequisite:
      - problem: patronage_ext_capital_retain
        kind: value_input
        gate: retain_credits
        form: state
        policy_source: >-
          The equity signed over is fixed only after the equity ledger carries the capital retain owed for the year most recently allocated.
        condition: >-
          a capital retain line for the fiscal year most recently allocated stands on the membership's equity ledger
        resolved_by: record_capital_retain_31b65d0b
        effect: >-
          a capital retain line for the year comes to stand on the equity ledger, so the binding retain_credits rises by that retain and the
          equity standing rises with it
      - problem: patronage_ext_allocation_restatement
        kind: value_input
        gate: restated_allocation
        form: state
        policy_source: >-
          Before the equity signed over is worked out, the allocation standing for the year most recently allocated must be the allocation that
          year's own volume earns.
        condition: >-
          the equity ledger carries, for the fiscal year most recently allocated, an allocation standing on the volume the member's own records
          support rather than on the volume first declared
        resolved_by: restate_allocation_notice_7a44a997
        effect: >-
          a restatement line for the year comes to stand on the equity ledger, so the binding restated_allocation rises from nothing to the
          restated allocation and its equity portion takes the place of the equity portion credited on the notice restated
    cross_category:
      - category: agronomy
        as: branch
        reads: [status, current_balance]
        note: a past-due crop input account decides the first tier of the offset taken off the equity moved.
      - category: energy
        as: branch
        reads: [status, account_balance]
        note: an active refined fuels account decides the second tier of the offset taken off the equity moved.
    compute:
      - retain_credits: "SUM('patronage_ledger','retain_amount', event_type='patronage_retain_withheld')"
      - notice_equity: "SUM('patronage_ledger','equity_portion_amount', event_type='patronage_allocation_posted')"
      - superseded_equity: "SUM('patronage_ledger','equity_portion_amount', event_type='patronage_allocation_posted', fiscal_year=F('last_allocation_year'))"
      - restated_allocation: "SUM('patronage_ledger','allocated_amount', event_type='patronage_allocation_adjusted', fiscal_year=F('last_allocation_year'))"
      - restated_equity: "RND(restated_allocation * P('equity_portion_pct') / 100, 2)"
      - revolved_out: "SUM('patronage_ledger','revolvement_amount', event_type='patronage_equity_revolved')"
      - equity_on_hand: "RND(retain_credits + notice_equity - superseded_equity + restated_equity - revolved_out, 2) if (restated_allocation > 0) else (F('equity_balance') if (restated_allocation <= 0 and F('equity_balance') > 0) else RND(retain_credits + notice_equity - revolved_out, 2))"
      - instruction_count: "COUNT('patronage_requests', request_type='equity_transfer')"
      - instruction_days: "DAYS((LATEST('patronage_requests','requested_date', date_field='requested_date', request_type='equity_transfer') or NOW), NOW)"
      - recording_charge: "(K('aged_charge') if (instruction_days > K('instruction_age_days') and equity_on_hand > P('minimum_equity_balance_usd')) else (K('prompt_charge') if (instruction_days <= K('instruction_age_days') and equity_on_hand > P('minimum_equity_balance_usd')) else P('transfer_fee_usd'))) if instruction_count > 0 else P('transfer_fee_usd')"
      - input_past_due: "EXISTS('agronomy', status='past_due')"
      - input_owed: "(CFIELD('agronomy','current_balance', status='past_due') or 0)"
      - energy_owed: "(CFIELD('energy','account_balance', status='active') or 0)"
      - offset_amount: "input_owed if (input_past_due and input_owed > 0) else (energy_owed if (input_owed <= 0 and energy_owed > 0) else K('no_offset'))"
      - certificate_rows: "COUNT('patronage_ledger', event_type='patronage_retain_withheld')"
      - certificate_charge: "K('certificate_charge_full') if (P('equity_certificate_issued') and certificate_rows >= K('certificate_year_count')) else (K('certificate_charge_part') if (P('equity_certificate_issued') and certificate_rows < K('certificate_year_count')) else K('no_certificate_charge'))"
      - years_on_books: "int(MONTHS(F('joined_date'), NOW) / 12)"
      - stock_credit: "RND(F('common_stock_shares') * P('common_stock_par_value_usd'), 2) if (F('common_stock_shares') > 0 and years_on_books >= K('stock_seasoning_years')) else (RND(F('common_stock_shares') * P('common_stock_par_value_usd') * K('stock_part_share'), 2) if (F('common_stock_shares') > 0 and years_on_books >= K('stock_minimum_years')) else K('no_stock_credit'))"
      - cash_declared: "SUM('patronage_ledger','cash_portion_amount', event_type='patronage_allocation_posted')"
      - cash_delivered: "SUM('patronage_ledger','cash_portion_amount', event_type='patronage_cash_paid')"
      - cash_gap: "MX(0, RND(cash_declared - cash_delivered, 2))"
      - carried_cash: "cash_gap if (cash_gap > 0 and F('tax_reporting_status') == 'qualified') else (RND(cash_gap * P('revolvement_annual_pool_pct') / 100, 2) if (cash_gap > 0 and F('tax_reporting_status') == 'nonqualified') else K('no_carry'))"
      - result: "RND(MX(0, equity_on_hand + carried_cash + stock_credit - offset_amount - recording_charge - certificate_charge), 2)"
    compute_basis:
      retain_credits: "The equity standing on a membership is the equity portions and capital retains credited to it on the equity ledger, less everything that has been revolved out, rounded to two decimal places."
      notice_equity: "The equity standing on a membership is the equity portions and capital retains credited to it on the equity ledger, less everything that has been revolved out, rounded to two decimal places."
      superseded_equity: "Where a restatement stands on the equity ledger for the year most recently allocated, the equity standing is instead those credits with the equity portion of the restated allocation put in the place of the equity portion credited for that year, less everything revolved out, rounded to two decimal places"
      restated_allocation: "Where a restatement stands on the equity ledger for the year most recently allocated, the equity standing is instead those credits with the equity portion of the restated allocation put in the place of the equity portion credited for that year, less everything revolved out, rounded to two decimal places"
      restated_equity: "Where a restatement stands on the equity ledger for the year most recently allocated, the equity standing is instead those credits with the equity portion of the restated allocation put in the place of the equity portion credited for that year, less everything revolved out, rounded to two decimal places"
      revolved_out: "The equity standing on a membership is the equity portions and capital retains credited to it on the equity ledger, less everything that has been revolved out, rounded to two decimal places."
      equity_on_hand: "The equity standing on a membership is the equity portions and capital retains credited to it on the equity ledger, less everything that has been revolved out, rounded to two decimal places. Where a restatement stands on the equity ledger for the year most recently allocated, the equity standing is instead those credits with the equity portion of the restated allocation put in the place of the equity portion credited for that year, less everything revolved out, rounded to two decimal places; and where no restatement stands for that year but an equity balance stands recorded on the membership above nothing, the equity standing is that recorded balance."
      instruction_count: "Where no transfer instruction stands registered on the membership at all, the class's own transfer fee applies, since there is no file whose age could tell against it."
      instruction_days: "where the transfer instruction registered on the membership has stood more than thirty days and the equity standing is above the class's minimum equity balance, the recording charge is forty dollars"
      recording_charge: "The charge for recording the transfer is the class's own transfer fee. A file the desk has had to carry costs more to work than one signed this week, so where the transfer instruction registered on the membership has stood more than thirty days and the equity standing is above the class's minimum equity balance, the recording charge is forty dollars; and where that instruction has stood thirty days or fewer and the equity standing is above the class's minimum equity balance, the recording charge is twenty-five dollars. Where no transfer instruction stands registered on the membership at all, the class's own transfer fee applies, since there is no file whose age could tell against it."
      input_past_due: "where a crop input account stands past due with a balance still standing on it, the balance standing on that account is taken off"
      input_owed: "where a crop input account stands past due with a balance still standing on it, the balance standing on that account is taken off"
      energy_owed: "where no crop input account stands past due and a refined fuels account stands active with a balance standing on it, the balance standing on that refined fuels account is taken off"
      offset_amount: "Equity may not leave the cooperative while the member owes it money, and what is owed is taken in the offset order the class fixes: where a crop input account stands past due with a balance still standing on it, the balance standing on that account is taken off; where no crop input account stands past due and a refined fuels account stands active with a balance standing on it, the balance standing on that refined fuels account is taken off; and where neither stands, nothing is taken off."
      certificate_rows: "where the class issues such a certificate and ten or more capital retain lines stand on the equity ledger, the certificate charge is fifteen dollars"
      certificate_charge: "Where the class issues a written certificate for retained equity, the transferee's certificate must be drawn afresh from the whole history: where the class issues such a certificate and ten or more capital retain lines stand on the equity ledger, the certificate charge is fifteen dollars; where the class issues such a certificate and fewer than ten capital retain lines stand on the equity ledger, the certificate charge is five dollars; and where the class issues no certificate, no certificate charge is made."
      years_on_books: "where shares of common stock stand recorded on the membership and it has stood on the books ten or more whole fiscal years, the shares recorded are redeemed at the class's par value"
      stock_credit: "Common stock is redeemed at par alongside the equity once the membership has been held long enough to have paid for it: where shares of common stock stand recorded on the membership and it has stood on the books ten or more whole fiscal years, the shares recorded are redeemed at the class's par value; where shares stand recorded and the membership has stood on the books three or more but fewer than ten whole fiscal years, they are redeemed at half the class's par value; and where fewer than three whole fiscal years have run or no shares stand recorded, no stock is redeemed."
      cash_declared: "where the cash portions standing on the equity ledger's allocation notices are above the cash delivered against them and allocations on the membership are reported as qualified, the whole of the difference between them is carried into what moves"
      cash_delivered: "where the cash delivered stands at or above the cash portions declared, or allocations on the membership are reported as mixed, nothing is carried in"
      cash_gap: "where the cash portions standing on the equity ledger's allocation notices are above the cash delivered against them and allocations on the membership are reported as qualified, the whole of the difference between them is carried into what moves"
      carried_cash: "Cash patronage the cooperative declared but never delivered belongs to the transferor and is carried out with the equity, and how much of it moves turns on whether the member has already been reported as having received it: where the cash portions standing on the equity ledger's allocation notices are above the cash delivered against them and allocations on the membership are reported as qualified, the whole of the difference between them is carried into what moves; where those cash portions are above the cash delivered and allocations on the membership are reported as nonqualified, the difference is carried in at the share the class's revolvement pool fixes; and where the cash delivered stands at or above the cash portions declared, or allocations on the membership are reported as mixed, nothing is carried in."
      result: "The equity standing, the cash carried in and the stock redeemed are added; the offset, the recording charge and the certificate charge are then taken off that sum; where the remainder would be less than nothing, nothing moves; and the result is rounded to two decimal places."
    factors:
      - id: equity_valuation_basis
        effect: method
        decides: equity_on_hand
        bindings: [retain_credits, notice_equity, superseded_equity, restated_allocation, restated_equity, revolved_out, equity_on_hand]
        ladder:
          - when: "a restatement stands on the equity ledger for the year most recently allocated"
            method: "the equity standing is the ledger's equity portions and capital retains with the equity portion of the restated allocation put in the place of the equity portion credited for that year, less everything revolved out"
          - when: "no restatement stands for the year most recently allocated and an equity balance stands recorded on the membership above nothing"
            method: "the equity standing is the equity balance recorded on the membership"
          - when: "otherwise"
            method: "the equity standing is the ledger's equity portions and capital retains less everything revolved out"
        baseline:
          equity_on_hand: "RND(retain_credits + notice_equity - revolved_out, 2)"
        evidence: [history]
        cross_difficulty: null
      - id: transfer_recording_charge
        effect: parameter
        decides: recording_charge
        bindings: [instruction_count, instruction_days, recording_charge]
        ladder:
          - when: "the transfer instruction registered on the membership has stood more than thirty days and the equity standing is above the class's minimum equity balance"
            value: "K('aged_charge')"
          - when: "the transfer instruction registered on the membership has stood thirty days or fewer and the equity standing is above the class's minimum equity balance"
            value: "K('prompt_charge')"
          - when: "otherwise"
            value: "P('transfer_fee_usd')"
        baseline:
          recording_charge: "P('transfer_fee_usd')"
        evidence: [date, history]
        cross_difficulty: null
      - id: owed_balance_offset
        effect: parameter
        decides: offset_amount
        bindings: [input_past_due, input_owed, energy_owed, offset_amount]
        ladder:
          - when: "a crop input account stands past due with a balance still standing on it"
            value: "the balance standing on that crop input account"
          - when: "no crop input account stands past due and a refined fuels account stands active with a balance standing on it"
            value: "the balance standing on that refined fuels account"
          - when: "otherwise"
            value: "K('no_offset')"
        baseline:
          offset_amount: "K('no_offset')"
        evidence: [cross_category]
        cross_difficulty: agronomy
      - id: certificate_reissue_charge
        effect: parameter
        decides: certificate_charge
        bindings: [certificate_rows, certificate_charge]
        ladder:
          - when: "the class issues a written certificate for retained equity and ten or more capital retain lines stand on the equity ledger"
            value: "K('certificate_charge_full')"
          - when: "the class issues a written certificate for retained equity and fewer than ten capital retain lines stand on the equity ledger"
            value: "K('certificate_charge_part')"
          - when: "otherwise"
            value: "K('no_certificate_charge')"
        baseline:
          certificate_charge: "K('no_certificate_charge')"
        evidence: [history]
        cross_difficulty: null
      - id: common_stock_redemption
        effect: parameter
        decides: stock_credit
        bindings: [years_on_books, stock_credit]
        ladder:
          - when: "shares of common stock stand recorded on the membership and it has stood on the books ten or more whole fiscal years"
            value: "the shares recorded at the class's par value"
          - when: "shares of common stock stand recorded on the membership and it has stood on the books three or more but fewer than ten whole fiscal years"
            value: "half the class's par value for each share recorded"
          - when: "otherwise"
            value: "K('no_stock_credit')"
        baseline:
          stock_credit: "K('no_stock_credit')"
        evidence: [date]
        cross_difficulty: null
      - id: undelivered_cash_carry
        effect: parameter
        decides: carried_cash
        bindings: [cash_declared, cash_delivered, cash_gap, carried_cash]
        ladder:
          - when: "the cash portions standing on the equity ledger's allocation notices are above the cash delivered against them and allocations on the membership are reported as qualified"
            value: "the whole of the difference between the cash declared and the cash delivered"
          - when: "the cash portions standing on those notices are above the cash delivered and allocations on the membership are reported as nonqualified"
            value: "that difference at the share the class's revolvement pool fixes"
          - when: "otherwise"
            value: "K('no_carry')"
        baseline:
          carried_cash: "K('no_carry')"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The equity standing on a membership is the equity portions and capital retains credited to it on the equity ledger, less everything that
        has been revolved out, rounded to two decimal places. The charge for recording the transfer is the class's own transfer fee. Nothing is
        taken off for what the member owes the cooperative, no charge is made for the certificate, no common stock is redeemed alongside the
        equity and no undelivered cash is carried in. The equity standing, the cash carried in and the stock redeemed are added; the offset, the
        recording charge and the certificate charge are then taken off that sum; where the remainder would be less than nothing, nothing moves;
        and the result is rounded to two decimal places. Every amount in this reckoning is carried to two decimal places, a half cent rounding up.
      params: [transfer_fee_usd, no_offset, no_certificate_charge, no_stock_credit, no_carry]
    inputs:
      history:
        - {table: patronage_ledger, aggregate: sum, field: retain_amount, within_months: null, filters: {event_type: patronage_retain_withheld}}
        - {table: patronage_ledger, aggregate: sum, field: allocated_amount, within_months: null, filters: {event_type: patronage_allocation_adjusted}}
        - {table: patronage_ledger, aggregate: sum, field: cash_portion_amount, within_months: null, filters: {event_type: patronage_allocation_posted}}
        - {table: patronage_requests, aggregate: count, field: request_id, within_months: null, filters: {request_type: equity_transfer}}
      cross_category: [agronomy, energy]

  - id: patronage_ext_cycle_revolvement
    base_policy_refs: [patronage_agg_equity_across_classes, patronage_revolvement]
    overwrite:
      - base_policy: patronage_agg_equity_across_classes
        superseded_clause: >-
          Revolvement is paid out of a single annual pool the board fixes as a percentage of unrevolved equity
        replaced_by: >-
          The pool the board fixes acts on the credits the fiscal year drawn on carries rather than on the whole of the equity standing
          unrevolved.
    trigger: state_due
    subject: [patronage_equity_revolved]
    computes: revolvement_amount
    target_tool: record_equity_revolvement_d16ad296
    params:
      overdue_pool_pct: 15.0
      current_pool_pct: 12.0
      estate_priority: 2.00
      death_only_priority: 1.50
      ordinary_priority: 1.00
      long_dividend_rate: 6.00
      short_dividend_rate: 3.00
      long_membership_years: 20
      no_offset: 0.00
    rule: >
      Equity comes back to the member on the board's cycle, and what a year's revolvement pays is worked out from the equity account itself
      rather than from any figure printed on a statement. The pool the board fixes acts on the credits the fiscal year drawn on carries rather
      than on the whole of the equity standing unrevolved.

      The equity revolved on a membership is drawn from the whole of the equity standing unrevolved on its equity ledger, which is the equity
      portions credited on its allocation notices plus its capital retains less everything already revolved out, rounded to two decimal places.
      A year that has come due is paid before the rest: where the fiscal year the membership records as its revolvement eligibility year stands
      at or before the year most recently allocated and credits stand on the ledger for that year, the payment is drawn from the credits
      carrying that eligibility year; and where the recorded eligibility year stands after the year most recently allocated and credits stand
      for the fiscal year before it, the payment is drawn from the credits carrying that earlier year.

      The share revolved is the percentage of that equity the class's annual pool fixes. The board revolves a larger share where a year has
      genuinely come due and carries a balance worth paying: where no revolvement payment stands against the recorded eligibility year and the
      credits that year carries stand above the class's minimum equity balance, the share is fifteen in the hundred; and where no revolvement
      payment stands against that year and the credits it carries stand at or below the class's minimum equity balance, the share is twelve in
      the hundred.

      The payment carries no weighting for the member's standing. A membership the cooperative has been notified is closing is moved up the
      queue, since the family cannot wait on a cycle: where notice of death stands recorded on the membership and a signed estate application
      stands registered and approved, the pool share is doubled; and where notice of death stands recorded and no signed estate application
      stands registered and approved, it is taken at one and a half times.

      The class's own dividend rate on preferred equity is applied to the same equity, and nothing is taken off for what the member owes the
      cooperative. What is paid here is the return on the equity being revolved and not the dividend the class pays on preferred equity still
      standing, and the board sets that return by how long the holding has been carried: where the class carries a dividend on preferred equity
      and the membership has stood on the books twenty or more whole fiscal years, the return is taken at six in the hundred; and where the class carries a dividend on preferred equity and the membership has stood on the books fewer than twenty whole
      fiscal years, it is taken at three in the hundred.

      What the member owes on their fuel account is settled out of the payment in the offset order the class fixes: where a refined fuels
      account stands past due with a balance still standing on it, the balance standing on that account is taken off; where no refined fuels
      account stands past due and a refined fuels account stands active with contracted gallons still owed on it, those gallons are taken off at
      the account's contracted price; and where neither stands, nothing is taken off.

      The pool share is worked out first and rounded to two decimal places, the weighting for standing then acts on that rounded figure and the
      result is rounded to two decimal places, the dividend is worked out on the same equity and rounded to two decimal places, the two are
      added, what is owed is taken off the sum and the remainder floored at nothing. The payment is then held back so that it is no more than the share the class's annual pool fixes of the credits the fiscal year drawn on carries, and the result is rounded to two decimal places. Amounts under this rule are carried to two decimal places, and a half cent rounds up. Where the cooperative has been notified the membership is closing the hold-back is relaxed: where notice of death stands recorded on the
      membership and no revolvement payment yet stands against the fiscal year drawn on, the payment is not held back at all; and where notice
      of death stands recorded and a revolvement payment already stands against that year, the payment is held back only so far as leaves the
      equity standing after it no lower than the class's minimum equity balance.
    prerequisite: []
    cross_category:
      - category: energy
        as: branch
        reads: [status, account_balance, current_gallons_owed, contract_price_per_gallon]
        note: the standing of the member's refined fuels accounts decides how much of the revolvement payment is settled against what they owe.
    compute:
      - retain_credits: "SUM('patronage_ledger','retain_amount', event_type='patronage_retain_withheld')"
      - notice_equity: "SUM('patronage_ledger','equity_portion_amount', event_type='patronage_allocation_posted')"
      - revolved_prior: "SUM('patronage_ledger','revolvement_amount', event_type='patronage_equity_revolved')"
      - equity_unrevolved: "RND(retain_credits + notice_equity - revolved_prior, 2)"
      - eligible_year: "F('revolvement_eligible_year')"
      - year_credits: "SUM('patronage_ledger','retain_amount', event_type='patronage_retain_withheld', fiscal_year=eligible_year) + SUM('patronage_ledger','equity_portion_amount', event_type='patronage_allocation_posted', fiscal_year=eligible_year)"
      - prior_year_credits: "SUM('patronage_ledger','retain_amount', event_type='patronage_retain_withheld', fiscal_year=eligible_year - 1) + SUM('patronage_ledger','equity_portion_amount', event_type='patronage_allocation_posted', fiscal_year=eligible_year - 1)"
      - eligible_credits: "year_credits if (eligible_year <= F('last_allocation_year') and year_credits > 0) else (prior_year_credits if (eligible_year > F('last_allocation_year') and prior_year_credits > 0) else equity_unrevolved)"
      - revolved_for_year: "SUM('patronage_ledger','revolvement_amount', event_type='patronage_equity_revolved', fiscal_year=eligible_year)"
      - pool_pct: "K('overdue_pool_pct') if (revolved_for_year <= 0 and year_credits > P('minimum_equity_balance_usd')) else (K('current_pool_pct') if (revolved_for_year <= 0 and year_credits <= P('minimum_equity_balance_usd')) else P('revolvement_annual_pool_pct'))"
      - estate_applications: "COUNT('patronage_requests', request_type='estate_retirement', request_status='approved', signed_by_member=True)"
      - priority_weight: "K('estate_priority') if (F('estate_flag') and estate_applications > 0) else (K('death_only_priority') if (F('estate_flag') and estate_applications <= 0) else K('ordinary_priority'))"
      - years_on_books: "int(MONTHS(F('joined_date'), NOW) / 12)"
      - dividend_rate: "K('long_dividend_rate') if (P('dividend_paid_on_preferred') and years_on_books >= K('long_membership_years')) else (K('short_dividend_rate') if (P('dividend_paid_on_preferred') and years_on_books < K('long_membership_years')) else P('dividend_rate_pct'))"
      - energy_past_due: "EXISTS('energy', status='past_due')"
      - energy_owed: "(CFIELD('energy','account_balance', status='past_due') or 0)"
      - gallons_owed_value: "RND((CFIELD('energy','current_gallons_owed', status='active') or 0) * (CFIELD('energy','contract_price_per_gallon', status='active') or 0), 2)"
      - offset_amount: "energy_owed if (energy_past_due and energy_owed > 0) else (gallons_owed_value if (energy_owed <= 0 and gallons_owed_value > 0) else K('no_offset'))"
      - base_payment: "RND(eligible_credits * pool_pct / 100, 2)"
      - uplifted_payment: "RND(base_payment * priority_weight, 2)"
      - dividend_due: "RND(eligible_credits * dividend_rate / 100, 2)"
      - gross_payment: "uplifted_payment + dividend_due"
      - net_payment: "MX(0, RND(gross_payment - offset_amount, 2))"
      - year_revolvements: "COUNT('patronage_ledger', event_type='patronage_equity_revolved', fiscal_year=eligible_year)"
      - capped_payment: "net_payment if (F('estate_flag') and year_revolvements <= 0) else (MN(net_payment, MX(0, RND(equity_unrevolved - P('minimum_equity_balance_usd'), 2))) if (F('estate_flag') and year_revolvements > 0) else MN(net_payment, RND(eligible_credits * P('revolvement_annual_pool_pct') / 100, 2)))"
      - result: "RND(capped_payment, 2)"
    compute_basis:
