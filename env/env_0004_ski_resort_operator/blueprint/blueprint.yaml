name: ski_resort_operator
company: Granite Ridge Mountain Collective

background: |
  Granite Ridge Mountain Collective runs five ski mountains under one roof: Granite Ridge and Hollow
  Creek on the Colorado Front Range, Copper Hollow in the San Juans, and Silverpine Basin and Talon
  Peak in the Utah Wasatch. Between them the mountains turn about two and a half million skier visits
  a season, from the first lift on the twentieth of November to the last on the eighteenth of April,
  and everything a guest buys at any of them hangs off one household account that the guest services
  centre in the Granite Ridge base village looks after. The collective sells season passes as the
  Granite Ridge Four-Day Flex Pass, the Granite Ridge Midweek Pass, the Granite Ridge Local Pass, the
  Granite Ridge Summit Pass, the Granite Ridge Summit Plus Pass, the Granite Ridge Collective
  Unlimited Pass and the Granite Ridge Collective Elite Pass, each held as a season-long record for
  one named passholder that is paid up front or financed over scheduled instalments and that books a
  row every time it is scanned at a lift. Day guests buy lift tickets as the Granite Ridge Window Day
  Ticket, the Granite Ridge 3-Day Advance Ticket, the Granite Ridge 7-Day Advance Ticket, the Granite
  Ridge Flex 4-Day Ticket Pack, the Granite Ridge Flex 8-Day Ticket Pack or the Granite Ridge
  Collective Multi-Mountain Ticket Pack, each an order that carries a block of ski days drawn down one
  date at a time. The snowsports school teaches the All-Mountain Adult Group Lesson, the Mountain
  Explorers Group Lesson, the Mountain Cubs Group Lesson, the Six-Week Development Programme, the
  Semi-Private Coaching Session, Private Instruction Full Day and the Elite Performance Camp, each
  booked as an enrolment for one participant that draws a session from its block every time an
  instructor takes them from the meeting point. The rental shops fit the Junior Ski & Board Rental,
  the Basic Ski & Board Rental, the Sport Ski & Board Rental, the Performance Ski & Board Rental, the
  Demo Ski & Board Rental and the Season-Long Lease Package, each a signed agreement over a named
  rider that holds a security deposit and consumes a rental day for every date the kit is out.
  Lodging runs from the Base Village Inn Room and the Slopeside Studio through the Slopeside
  One-Bedroom Residence, the Slopeside Two-Bedroom Residence and the Mountain Lodge Suite to the
  Summit Penthouse Residence and the Private Mountain Chalet, each a reservation with its own folio
  that collects a deposit before arrival and posts room, resort and incidental charges night by night.
  Protection is sold alongside those holdings as Season Pass Protection Basic, Season Pass Protection
  Plus, Season Pass Protection Premier, Collective Trip Protection Standard, Collective Trip
  Protection Elite and the Collective Total Protection Concierge plan, each written over one named
  holding and carrying a premium account and a season benefit limit that claims draw down. On-mountain
  food and drink runs on the Mountain Bites Dining Card, the Peak Plate Dining Plan, the Summit Table
  Dining Plan, the Alpine Club Dining Membership, the Chef's Table Dining Membership and the
  Collective Hospitality Dining Membership, each a loaded balance that earns a bonus when it is topped
  up and is drawn down at the tills. The people who call are mostly households rather than single
  skiers: two parents and two children on one account, a grandparent who skis midweek, a group of
  friends who share a chalet for a week in February. A typical Front Range family holds three or four
  season passes bought on one autumn application, finances them over the winter, books the children
  into a group lesson every Saturday, hires junior kit for the season and adds a protection plan to
  the passes; a destination household from out of state instead books a residence for a school break,
  buys a ticket pack and lessons to go with it, and hires performance skis for the week. Guests carry
  long histories with the collective, so the account the desk opens on a call usually already shows
  scans from three seasons, a couple of cancelled bookings, credit issued after a storm day and an
  instalment or two that bounced when a card expired. Calls come in heaviest in the week before the
  Christmas holidays and on the Monday after every big storm, and the guest services centre handles
  them from the same account view whichever mountain the guest is standing on.

logs:
  verification_log_table: identity_verifications
  handoff_log_table: human_handoffs

difficulties:
  - name: season_pass_billing_desk
    claim:
      categories: [passes]
      event_types: [passes_apply, passes_accept, passes_activate, passes_plan_open, passes_installment_charge, passes_installment_decline, passes_late_fee, passes_fee_charge, passes_upgrade, passes_upgrade_charge, passes_credit_issue, passes_credit_redeem, passes_suspend, passes_reinstate, passes_defer, passes_cancel]
    summary: >
      The callers on this desk are households who already hold one or more season passes for the
      current season and want something done about the money or the tier: an instalment that bounced
      when a card expired, a pass that stopped scanning, a move up from a restricted tier because the
      snow came in, a pass given up after an injury, or a carry-forward into next season. The setting
      varies sharply across the ladder, because the Four-Day Flex Pass cannot be financed at all while
      the Collective Elite Pass runs ten instalments with no service fee, and it varies again across
      status, since a pass standing in pending_activation, active, suspended or deferred admits
      entirely different handling from the same pass standing cancelled or expired. It varies a third
      time across the household portfolio, since several passholders on one account are priced as a
      group under passes_agg_household_pricing and financed on one schedule, and a fourth time across
      history, because the number of refused instalments in the rolling window and the number of days
      already scanned both change what may be done. The records in play are the pass record itself,
      which carries the tier, the status, the price committed to and the three running quantities, the
      pass account ledger of plan openings, instalments, refusals, fees, credit and scans, the
      household profile that says whether a payment method is stored, and the protection plan record
      that decides whether a medical cancellation or a waived carry-forward fee stands at all. The
      governing shape is a pre-action gate and then a calculation: passes_installment_plan fixes how
      the financed amount is divided and when the first instalment may fall, passes_evt_decline_handling
      fixes when a late fee attaches to a refusal, passes_arrears_suspension fixes when privileges come
      off and what restoring them costs, passes_upgrade_terms fixes the differential basis and the
      once-per-season limit, passes_cancellation_refund fixes the window and the day-use deduction, and
      passes_deferral fixes the election period and the no-days-taken condition; every one of these
      carries its own per-tier table and every date in them is counted from an anchor the pass record
      or the ledger actually holds. Most of the work is agent service on a verified account — opening a
      plan, recording a move up, placing or reversing a fee, restoring privileges, issuing credit — but
      the acts that dispose of the guest's own holding are theirs alone and are handed over to them:
      cancelling the pass, electing a carry-forward, and confirming a re-registration to another named
      passholder are user actions, which is why the request lands on the pass request record first and
      only becomes effective when the household confirms it. The uncovered ground is real and the desk
      must recognise it: reversing a late fee on the grounds that the collective's own billing was at
      fault, returning money to the original payment method rather than issuing resort credit, moving a
      passholder down a tier mid-season, honouring a price lock the guest believes they were promised
      verbally, or pricing a pass for a passholder outside every age band the tier is sold in — none of
      these is decided by any rule in this charter, and the only correct route is a POLICY_NOT_COVERED
      handoff rather than an improvised answer.

  - name: snowsports_school_desk
    claim:
      categories: [lessons]
      event_types: [lessons_book, lessons_waitlist, lessons_confirm, lessons_assign_instructor, lessons_reschedule, lessons_transfer, lessons_cancel, lessons_no_show, lessons_tuition_charge, lessons_equipment_addon, lessons_fee_charge, lessons_payment, lessons_credit_issue, lessons_credit_redeem]
    summary: >
      The callers on this desk are households arranging instruction for someone in the party and then
      changing their minds about it: a parent booking two children into a Saturday group and a private
      lesson for themselves, a family whose child woke up ill the morning of a full-day programme, a
      guest who wants to move a lesson because the forecast turned, a household chasing what they were
      told they would get back after the mountain shut on a storm day. The setting varies by product,
      because the Mountain Cubs Group Lesson includes rental and lunch while the All-Mountain Adult
      Group Lesson includes neither, and the Six-Week Development Programme takes a deposit and a
      balance while the day products take the whole price at once; it varies by status, since a booking
      standing requested or waitlisted is not yet firm and a booking standing in_progress has already
      drawn sessions from its block; it varies by portfolio, since siblings and multi-participant
      bookings are priced together under lessons_agg_household_group_pricing and a season pass held by
      the participant changes the price again; and it varies by history, since the sessions already
      delivered and the moves already used both bound what can still be done. The records in play are
      the booking itself with its participant, ability level, first session date and running session
      block, the school ledger of tuition, add-ons, fees, payments, deliveries and credit, the
      participant's own pass record where the product requires one, and the school request record that
      holds what the household has asked for until they confirm it. The governing shape is a notice
      deadline measured back from the scheduled start and then a proportion: lessons_booking_terms fixes
      the booking window, the age and ability range and the pass requirement, lessons_pricing fixes how
      tuition and add-ons are built, lessons_cancellation fixes the free cancellation deadline and the
      share retained after it, lessons_no_show_and_fees fixes when a missed session is charged and how
      much, lessons_change_terms fixes the notice and the fee for moving a date or changing the
      participant, lessons_session_delivery fixes what counts as delivered and what may be made up, and
      lessons_payment_terms fixes when the balance falls due — each with its own per-tier table. The
      agent does the service work on a verified account, taking the booking, allocating the place,
      moving the date, raising or waiving an add-on and issuing credit, while the acts that give up or
      hand on the household's own booking belong to them: cancelling, confirming a move that costs a
      fee, and re-registering the booking to a different participant are user actions, accepted at the
      desk and effective only once the household confirms. The uncovered ground includes a refund paid
      back to the original card rather than as school credit, a makeup session for a participant who
      simply did not turn up, an exception to the age or ability range because a parent insists their
      child is ready, compensation for an instructor the household disliked, and any complaint about an
      instructor's conduct — none of which this charter decides, and all of which are a
      POLICY_NOT_COVERED handoff.

  - name: equipment_rental_desk
    claim:
      categories: [rentals]
      event_types: [rentals_reserve, rentals_confirm, rentals_pickup, rentals_swap, rentals_extend, rentals_mark_overdue, rentals_return, rentals_cancel, rentals_reserve_load, rentals_day_consume, rentals_rate_charge, rentals_fee_charge, rentals_damage_charge, rentals_payment, rentals_deposit_hold, rentals_deposit_release]
    summary: >
      The callers on this desk are guests with kit reserved, out or overdue: a family whose four
      reservations were taken on one call and who now need a different boot size for one child, a skier
      who kept demo skis two days past the date on the agreement, a household querying why a security
      hold is still showing against their card a week after they handed the skis in, a guest disputing
      a base gouge a technician found on a returned ski. The setting varies by package, because the
      Demo Ski & Board Rental includes model changes and a large hold while the Basic Ski & Board
      Rental includes neither, and the Season-Long Lease Package is neither extended nor priced by the
      day at all; it varies by status, since kit reserved, confirmed, picked_up or overdue admits
      different handling from kit already returned; it varies by portfolio, since a season pass, a
      lesson booking or a lodging reservation on the same account each move the price under
      rentals_agg_party_pricing and only the largest of them is taken; and it varies by history, since
      the days already consumed and the model changes already used both bound what remains. The records
      in play are the agreement with its rider measurements, ability level, dates, item serial and
      three running quantities, the rental ledger of day consumption, rate and fee charges, damage
      assessments, payments and the hold and its release, the signed liability release recorded against
      the agreement, and the shop request record that holds an extension or a size change until the
      guest confirms it. The governing shape is a fitting range, then a state gate, then a per-day
      arithmetic: rentals_reservation_terms fixes the term and the fitting range, rentals_pricing fixes
      when the multi-day rate replaces the shop day rate and when the advance reduction applies,
      rentals_fitting_and_pickup fixes what must be on file before kit is handed over and how days are
      counted, rentals_swap_and_extension fixes the change allowance and the extension limit,
      rentals_late_return fixes the grace period and the daily late fee up to the replacement
      threshold, rentals_deposit_and_damage fixes the waiver, the excess and the release period, and
      rentals_cancellation fixes the free cancellation deadline measured back from the collection date.
      The agent handles the service actions on a verified account — taking the reservation, setting kit
      aside, recording a size change, raising an extension, assessing a fee, releasing a hold — while
      the guest alone signs the liability release, hands the kit in, and confirms an extension or a
      cancellation that costs them money, so those land on the shop request record first. The uncovered
      ground includes waiving an assessed damage charge on the guest's word that the ski was already
      marked, releasing a hold before the kit is back, hiring outside the fitting range because the
      guest insists, compensation for an injury the guest attributes to the binding setting, and any
      claim about kit quality — none of which this charter decides, and each of which is a
      POLICY_NOT_COVERED handoff.

  - name: lodging_reservations_desk
    claim:
      categories: [lodging]
      event_types: [lodging_book, lodging_hold_deposit, lodging_confirm, lodging_modify, lodging_assign_unit, lodging_checkin, lodging_checkout, lodging_cancel, lodging_no_show, lodging_deposit_charge, lodging_deposit_apply, lodging_room_charge, lodging_incidental_charge, lodging_resort_fee, lodging_fee_charge, lodging_payment]
    summary: >
      The callers on this desk are households with a stay booked or under way: a family whose deposit
      is about to fall due on a holiday-week residence, a party wanting to add two nights to the front
      of a stay that now straddles two rate windows, a guest cancelling a chalet three weeks out, a
      household querying a resort charge and a dog fee on a folio they have already left. The setting
      varies by unit type, because the Base Village Inn Room takes a one-night stay outside the peak
      window while the Private Mountain Chalet takes four and seven inside the holiday window, and the
      Summit Penthouse Residence holds a deposit that never comes back while the Slopeside Studio holds
      one that does; it varies by status, since a reservation standing held, deposit_pending, confirmed,
      checked_in or checked_out admits different handling; it varies by portfolio, since a season pass
      on the account, the length of the stay and how far ahead it was booked all move the rate under
      lodging_agg_household_stay_pricing, and several units on one account tip the reservation into a
      group block; and it varies by history, since the nights already occupied and the charges already
      posted decide what a change or a cancellation is worth. The records in play are the reservation
      with its dates, party size, rate plan, assigned unit and running deposit and folio balances, the
      folio ledger of nightly room, resort and incidental charges together with deposits, payments and
      fees, and the lodging request record that holds a date change or a cancellation until the
      household confirms it. The governing shape is a deadline counted back from the arrival date and a
      night-by-night price: lodging_booking_terms fixes the minimum nights per rate window and the
      occupancy, lodging_deposit_terms fixes the deposit share and when it must clear,
      lodging_rate_and_fees fixes which window each night is priced in and what the extra person and
      resort charges add, lodging_modification fixes the change deadline and its fee,
      lodging_cancellation fixes the free cancellation deadline and the nights retained after it,
      lodging_stay_operations fixes check-in and check-out and the incidental hold, and
      lodging_checkout_settlement fixes the order in which the folio is settled and when the hold is
      released. The agent does the service work on a verified account — taking the reservation, asking
      for the deposit, moving dates, assigning a unit, posting or reversing a charge, releasing a hold
      — while cancelling the stay, re-registering it to a different lead guest and confirming a change
      that costs money are the household's own acts, accepted at the desk and effective only on their
      confirmation. The uncovered ground includes waiving a resort charge because the guest did not use
      the shuttle, moving a confirmed party into a higher unit type at no cost, refunding a night the
      guest left early outside the cancellation terms, taking an incidental hold against a third
      party's card, and any dispute about damage found in the unit after departure — none of which this
      charter decides, and each of which is a POLICY_NOT_COVERED handoff.

  - name: pass_protection_desk
    claim:
      categories: [insure]
      event_types: [insure_quote, insure_activate, insure_amend, insure_claim_open, insure_claim_settle, insure_claim_decline, insure_lapse, insure_reinstate, insure_cancel, insure_premium_charge, insure_premium_payment, insure_coverage_load, insure_claim_payment, insure_document_receive, insure_fee_charge]
    summary: >
      The callers on this desk are households who bought protection over a holding and now want to use
      it, change it or give it up: a passholder who tore a knee ligament in January and wants the
      season back, a guest whose employer let them go in November, a household asking whether the plan
      they took on a pass can be moved to the residence they have since booked, a guest whose premium
      instalment bounced and who wants to know whether they were covered on the day they fell. The
      setting varies by plan, because Season Pass Protection Basic covers only medical grounds and
      pays a minority share after an excess while the Collective Total Protection Concierge plan covers
      seven perils with no excess and no waiting period, and the trip plans cover lodging and lessons
      rather than passes at all; it varies by status, since a plan standing quoted, active, claim_open,
      claim_settled or lapsed admits entirely different handling; it varies by portfolio, since the
      plan is written over exactly one holding whose value sets both the premium and the benefit, and
      the limits of two plans on one account are never pooled under insure_agg_portfolio_limits; and it
      varies by history, since the claims already paid this season and the papers already accepted both
      decide whether a further claim can be entertained. The records in play are the plan itself with
      its covered holding, covered value, effective and waiting-period dates and running premium and
      benefit balances, the protection ledger of premiums, payments, the benefit loaded, payouts and
      every paper received with a note of whether it was accepted, the covered holding's own record in
      another product line, and the protection request record that holds a claim, an amendment or a
      cancellation until the household confirms it. The governing shape is an evidence gate and then a
      capped proportion: insure_eligibility_and_quote fixes what may be covered and the purchase
      window, insure_premium_terms fixes the premium basis and its bounds, insure_cover_start fixes the
      waiting period and the benefit loaded, insure_claim_intake fixes the notice period and that only
      the collective's own record answers whether the papers are complete, insure_claim_assessment
      fixes the perils, the shares, the excess and the caps and that an exclusion always beats a cover,
      insure_lapse_and_reinstatement fixes the grace period and the reinstatement window, and
      insure_cancellation fixes the free look period and the refund basis. Assessing and settling a
      claim, recording a paper, reinstating cover and raising or collecting a premium are agent service
      actions on a verified account, while making the claim in the first place, cancelling the plan and
      confirming an amendment are the household's own acts and are handed over to them. The uncovered
      ground includes paying a claim on a peril the plan excludes because the household feels it is
      unfair, accepting a doctor's note the collective's record does not show as received, extending a
      notice period that has already run out, appealing a refusal on a plan that carries no appeal, and
      pricing cover over a holding on another household's account — none of which this charter decides,
      and each of which is a POLICY_NOT_COVERED handoff.
