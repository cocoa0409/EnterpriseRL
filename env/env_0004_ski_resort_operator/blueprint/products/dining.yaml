  - id: dining_replenishment_and_statements
    subject: [dining_replenish, dining_statement]
    rule: >
      A plan marked empty returns to use as soon as a load of at least the plan's top-up minimum clears, and
      nothing else is needed; the household does not reopen the plan or pay the enrolment fee a second time.
      Statements are drawn up at the plan's frequency and cover the period since the previous statement,
      showing every load, every bonus and every transaction with the outlet it arose at, and the balance
      standing at the end of the period. A statement is a record of what happened and never a demand: money
      owed on plan fees is shown on it but collected through the fee account rather than from the balance. A
      household that disputes a transaction on a statement raises it against that transaction's own entry,
      and the outlet's till record decides the matter rather than the household's recollection.
    eligibility: []
    params:
      per_tier:
        Mountain Bites Dining Card: {statement_frequency: "=statement_frequency", minimum_top_up_usd: "=minimum_top_up_usd", auto_top_up_amount_usd: "=auto_top_up_amount_usd"}
        Peak Plate Dining Plan: {statement_frequency: "=statement_frequency", minimum_top_up_usd: "=minimum_top_up_usd", auto_top_up_amount_usd: "=auto_top_up_amount_usd"}
        Summit Table Dining Plan: {statement_frequency: "=statement_frequency", minimum_top_up_usd: "=minimum_top_up_usd", auto_top_up_amount_usd: "=auto_top_up_amount_usd"}
        Alpine Club Dining Membership: {statement_frequency: "=statement_frequency", minimum_top_up_usd: "=minimum_top_up_usd", auto_top_up_amount_usd: "=auto_top_up_amount_usd"}
        Chef's Table Dining Membership: {statement_frequency: "=statement_frequency", minimum_top_up_usd: "=minimum_top_up_usd", auto_top_up_amount_usd: "=auto_top_up_amount_usd"}
        Collective Hospitality Dining Membership: {statement_frequency: "=statement_frequency", minimum_top_up_usd: "=minimum_top_up_usd", auto_top_up_amount_usd: "=auto_top_up_amount_usd"}

  - id: dining_card_and_fees
    subject: [dining_reissue_card, dining_fee_charge, dining_fee_payment]
    rule: >
      Cards are issued to the named holder and to the dependants the plan allows, and a lost or broken card
      is replaced against the plan's replacement fee with the balance moving to the new card and the old
      card stopped at every till. A plan fee is raised only while the plan record stands in the enrolled,
      active, suspended or exhausted state. Plan fees are collected from the household's payment method and
      never taken out of the dining balance, because the balance is money the household has already paid.
      Where the plan allows it, a plan may be moved to another household account against the plan's transfer
      fee, and the balance and the bonus already earned move with it; a plan that does not allow it is
      cancelled and a fresh plan opened on the other account.
    eligibility:
      - id: fee_bearing_plan_state
        applies_to: [dining_fee_charge]
        kind: state
        condition: "A plan fee is raised only while the plan record stands in the enrolled, active, suspended or exhausted state."
        evidence_fields: [dining_holdings.dining_plan_id, dining_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dining_holdings.dining_plan_id]
          action_bindings:
            dining_holdings.dining_plan_id: dining_plan_id
        state_contract:
          field: dining_holdings.status
          allowed: [enrolled, active, suspended, exhausted]
    params:
      per_tier:
        Mountain Bites Dining Card: {card_type: "=card_type", card_replacement_fee_usd: "=card_replacement_fee_usd", additional_card_fee_usd: "=additional_card_fee_usd", transferable: "=transferable", transfer_fee_usd: "=transfer_fee_usd", enrollment_fee_usd: "=enrollment_fee_usd"}
        Peak Plate Dining Plan: {card_type: "=card_type", card_replacement_fee_usd: "=card_replacement_fee_usd", additional_card_fee_usd: "=additional_card_fee_usd", transferable: "=transferable", transfer_fee_usd: "=transfer_fee_usd", enrollment_fee_usd: "=enrollment_fee_usd"}
        Summit Table Dining Plan: {card_type: "=card_type", card_replacement_fee_usd: "=card_replacement_fee_usd", additional_card_fee_usd: "=additional_card_fee_usd", transferable: "=transferable", transfer_fee_usd: "=transfer_fee_usd", enrollment_fee_usd: "=enrollment_fee_usd"}
        Alpine Club Dining Membership: {card_type: "=card_type", card_replacement_fee_usd: "=card_replacement_fee_usd", additional_card_fee_usd: "=additional_card_fee_usd", transferable: "=transferable", transfer_fee_usd: "=transfer_fee_usd", enrollment_fee_usd: "=enrollment_fee_usd"}
        Chef's Table Dining Membership: {card_type: "=card_type", card_replacement_fee_usd: "=card_replacement_fee_usd", additional_card_fee_usd: "=additional_card_fee_usd", transferable: "=transferable", transfer_fee_usd: "=transfer_fee_usd", enrollment_fee_usd: "=enrollment_fee_usd"}
        Collective Hospitality Dining Membership: {card_type: "=card_type", card_replacement_fee_usd: "=card_replacement_fee_usd", additional_card_fee_usd: "=additional_card_fee_usd", transferable: "=transferable", transfer_fee_usd: "=transfer_fee_usd", enrollment_fee_usd: "=enrollment_fee_usd"}

  - id: dining_suspension
    subject: [dining_suspend, dining_resume]
    rule: >
      Spending is stopped where the card is reported lost or stolen, or where plan fees have stood unpaid
      beyond the plan's arrears period counted in calendar days from the day the fee was raised. Calendar
      days are counted forward from the anchor date, the anchor date itself counting as day zero, every day
      of the week counting alike, and a calendar day is never mixed with a full 24-hour period; where the
      resulting boundary falls on a date that does not exist in the target month, the last day of that month
      is used. A stopped plan keeps its balance and its bonus; only the till is closed to it. Spending starts
      again when the card has been replaced or the arrears settled, against the plan's reinstatement fee
      where one applies. A transaction made on a card after it was reported lost is not charged to the
      household where the report reached the collective before the transaction, judged on the collective's
      own record of when the report was taken.
    eligibility:
      - id: arrears_period_elapsed
        applies_to: [dining_suspend]
        kind: time
        condition: "Spending is stopped where the card is reported lost or stolen, or where plan fees have stood unpaid beyond the plan's arrears period counted in calendar days from the day the fee was raised."
        evidence_fields: [dining_ledger.dining_plan_id, dining_ledger.event_date, dining_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dining_ledger.dining_plan_id]
          action_bindings:
            dining_ledger.dining_plan_id: dining_plan_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the fee was raised"
          anchor_source: dining_ledger.event_date
          relation: not_before
          duration_source: variants.arrears_suspension_days
          unit: calendar_days
          counting_rule: "Calendar days are counted forward from the anchor date, the anchor date itself counting as day zero, every day of the week counting alike, and a calendar day is never mixed with a full 24-hour period; where the resulting boundary falls on a date that does not exist in the target month, the last day of that month is used."
          boundary: inclusive
    params:
      per_tier:
        Mountain Bites Dining Card: {arrears_suspension_days: "=arrears_suspension_days", reinstatement_fee_usd: "=reinstatement_fee_usd", card_replacement_fee_usd: "=card_replacement_fee_usd"}
        Peak Plate Dining Plan: {arrears_suspension_days: "=arrears_suspension_days", reinstatement_fee_usd: "=reinstatement_fee_usd", card_replacement_fee_usd: "=card_replacement_fee_usd"}
        Summit Table Dining Plan: {arrears_suspension_days: "=arrears_suspension_days", reinstatement_fee_usd: "=reinstatement_fee_usd", card_replacement_fee_usd: "=card_replacement_fee_usd"}
        Alpine Club Dining Membership: {arrears_suspension_days: "=arrears_suspension_days", reinstatement_fee_usd: "=reinstatement_fee_usd", card_replacement_fee_usd: "=card_replacement_fee_usd"}
        Chef's Table Dining Membership: {arrears_suspension_days: "=arrears_suspension_days", reinstatement_fee_usd: "=reinstatement_fee_usd", card_replacement_fee_usd: "=card_replacement_fee_usd"}
        Collective Hospitality Dining Membership: {arrears_suspension_days: "=arrears_suspension_days", reinstatement_fee_usd: "=reinstatement_fee_usd", card_replacement_fee_usd: "=card_replacement_fee_usd"}

  - id: dining_cancellation_refund
    subject: [dining_cancel, dining_refund]
    rule: >
      A household may give a dining plan up. The plan's refund basis decides what comes back: on the loaded
      amount basis the balance is returned less every bonus still unspent, on the full balance basis the
      whole balance is returned, and on the no refund basis nothing is returned and the balance must be
      spent before the season ends. A balance is returned only while the plan record stands in the active,
      suspended, exhausted, cancelled or expired state. A refund is asked for no later than the plan's
      refund window counted in calendar days from the day the plan was opened. Calendar days are counted
      forward from the anchor date, the anchor date itself counting as day zero, every day of the week
      counting alike, and a calendar day is never mixed with a full 24-hour period; where the resulting
      boundary falls on a date that does not exist in the target month, the last day of that month is used.
      The plan's administration fee is retained from whatever is returned, and the money goes back to the
      method it was loaded from rather than to any other. Where the collective's own error caused the
      cancellation, nothing is retained and the bonus is returned with the balance.
    eligibility:
      - id: refundable_plan_state
        applies_to: [dining_refund]
        kind: state
        condition: "A balance is returned only while the plan record stands in the active, suspended, exhausted, cancelled or expired state."
        evidence_fields: [dining_holdings.dining_plan_id, dining_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dining_holdings.dining_plan_id]
          action_bindings:
            dining_holdings.dining_plan_id: dining_plan_id
        state_contract:
          field: dining_holdings.status
          allowed: [active, suspended, exhausted, cancelled, expired]
      - id: within_refund_window
        applies_to: [dining_cancel]
        kind: time
        condition: "A refund is asked for no later than the plan's refund window counted in calendar days from the day the plan was opened."
        evidence_fields: [dining_holdings.dining_plan_id, dining_holdings.opened_date, dining_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dining_holdings.dining_plan_id]
          action_bindings:
            dining_holdings.dining_plan_id: dining_plan_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the plan was opened"
          anchor_source: dining_holdings.opened_date
          relation: not_after
          duration_source: variants.refund_window_days
          unit: calendar_days
          counting_rule: "Calendar days are counted forward from the anchor date, the anchor date itself counting as day zero, every day of the week counting alike, and a calendar day is never mixed with a full 24-hour period; where the resulting boundary falls on a date that does not exist in the target month, the last day of that month is used."
          boundary: inclusive
    params:
      per_tier:
        Mountain Bites Dining Card: {refund_basis: "=refund_basis", refund_admin_fee_usd: "=refund_admin_fee_usd", refund_window_days: "=refund_window_days", cancellation_notice_days: "=cancellation_notice_days"}
        Peak Plate Dining Plan: {refund_basis: "=refund_basis", refund_admin_fee_usd: "=refund_admin_fee_usd", refund_window_days: "=refund_window_days", cancellation_notice_days: "=cancellation_notice_days"}
        Summit Table Dining Plan: {refund_basis: "=refund_basis", refund_admin_fee_usd: "=refund_admin_fee_usd", refund_window_days: "=refund_window_days", cancellation_notice_days: "=cancellation_notice_days"}
        Alpine Club Dining Membership: {refund_basis: "=refund_basis", refund_admin_fee_usd: "=refund_admin_fee_usd", refund_window_days: "=refund_window_days", cancellation_notice_days: "=cancellation_notice_days"}
        Chef's Table Dining Membership: {refund_basis: "=refund_basis", refund_admin_fee_usd: "=refund_admin_fee_usd", refund_window_days: "=refund_window_days", cancellation_notice_days: "=cancellation_notice_days"}
        Collective Hospitality Dining Membership: {refund_basis: "=refund_basis", refund_admin_fee_usd: "=refund_admin_fee_usd", refund_window_days: "=refund_window_days", cancellation_notice_days: "=cancellation_notice_days"}

  - id: dining_expiry_and_closure
    subject: [dining_expire, dining_close]
    rule: >
      A dining plan runs to the end of the season it was sold for and then stops being spendable. Where the
      plan allows carry-over, the balance up to the plan's carry-over ceiling moves to the plan the
      household opens for the next season, and anything above the ceiling must be used before the season
      ends or is lost. Where the plan does not allow carry-over, the balance left must be used within the
      plan's post-season period and is otherwise lost; bonus money never carries over whatever the plan
      says about the rest. A plan record is closed only when no plan fee is left to collect and no balance
      is left to spend or return. Closing is the last write on the record and nothing is added to it
      afterwards, so a transaction that reaches the collective late is settled against the outlet rather
      than against the closed plan.
    eligibility:
      - id: nothing_left_on_plan
        applies_to: [dining_close]
        kind: authorization
        condition: "A plan record is closed only when no plan fee is left to collect and no balance is left to spend or return."
        evidence_fields: [dining_holdings.dining_plan_id, dining_holdings.plan_fee_balance_usd, dining_holdings.dining_balance_usd]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dining_holdings.dining_plan_id]
          action_bindings:
            dining_holdings.dining_plan_id: dining_plan_id
    params:
      per_tier:
        Mountain Bites Dining Card: {carryover_allowed: "=carryover_allowed", carryover_cap_usd: "=carryover_cap_usd", balance_expiry_days: "=balance_expiry_days", season_start_date: "=season_start_date", season_end_date: "=season_end_date", season_code: "=season_code"}
        Peak Plate Dining Plan: {carryover_allowed: "=carryover_allowed", carryover_cap_usd: "=carryover_cap_usd", balance_expiry_days: "=balance_expiry_days", season_start_date: "=season_start_date", season_end_date: "=season_end_date", season_code: "=season_code"}
        Summit Table Dining Plan: {carryover_allowed: "=carryover_allowed", carryover_cap_usd: "=carryover_cap_usd", balance_expiry_days: "=balance_expiry_days", season_start_date: "=season_start_date", season_end_date: "=season_end_date", season_code: "=season_code"}
        Alpine Club Dining Membership: {carryover_allowed: "=carryover_allowed", carryover_cap_usd: "=carryover_cap_usd", balance_expiry_days: "=balance_expiry_days", season_start_date: "=season_start_date", season_end_date: "=season_end_date", season_code: "=season_code"}
        Chef's Table Dining Membership: {carryover_allowed: "=carryover_allowed", carryover_cap_usd: "=carryover_cap_usd", balance_expiry_days: "=balance_expiry_days", season_start_date: "=season_start_date", season_end_date: "=season_end_date", season_code: "=season_code"}
        Collective Hospitality Dining Membership: {carryover_allowed: "=carryover_allowed", carryover_cap_usd: "=carryover_cap_usd", balance_expiry_days: "=balance_expiry_days", season_start_date: "=season_start_date", season_end_date: "=season_end_date", season_code: "=season_code"}
