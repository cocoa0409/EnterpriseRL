events:
  - type: dining_open
    target: dining_holdings
    mutation: create
    meaning: "A household opens a mountain dining plan for a named holder and the plan record is created."
    grain: "One row per dining plan opened for one named holder for one season."
    fields:
      dining_plan_id: "Reference number of the dining plan."
      customer_id: "The household account the plan is opened on."
      variant_name: "The dining plan opened, written as its official full name."
      status: "Lifecycle state of the plan, pinned to the enrolled state when it is opened."
      season_code: "The season the plan is sold for."
      holder_name: "Name of the person the plan is registered to, exactly as the household states it."
      home_mountain: "Mountain whose outlets the household expects to use most."
      cards_issued: "Number of cards issued on the plan."
      opened_date: "Date the plan was opened."
      auto_top_up_enabled: "Whether the plan tops itself up when the balance runs low."
    triggers:
      - event: dining:dining_load
        map: {dining_plan_id: dining_plan_id, customer_id: customer_id, load_channel: online_account}

  - type: dining_activate
    target: dining_holdings
    mutation: {transition: {from: enrolled, to: active}}
    meaning: "The first load has cleared and the card may be spent at the collective's outlets."
    grain: "One row per plan; coming into use is recorded on the plan itself."
    fields:
      status: "Lifecycle state of the plan, moved to the in-use state."
      activated_date: "Date the plan first became spendable."
      card_serial: "Serial of the card issued to the holder."
    triggers: []

  - type: dining_reissue_card
    target: dining_holdings
    mutation: update
    meaning: "A lost or broken card is replaced and the balance moves to the new card."
    grain: "One row per plan; the replacement rewrites the card on the plan itself."
    fields:
      card_serial: "Serial of the card the holder now carries."
      cards_issued: "Number of cards now issued on the plan."
    triggers:
      - event: dining:dining_fee_charge
        map: {dining_plan_id: dining_plan_id, customer_id: customer_id, charge_category: card_replacement}

  - type: dining_suspend
    target: dining_holdings
    mutation: {transition: {from: active, to: suspended}}
    meaning: "The card has been reported lost or the plan account stands in arrears, and spending is stopped."
    grain: "One row per plan; the stop is recorded on the plan itself."
    fields:
      status: "Lifecycle state of the plan, moved to the stopped state."
      suspension_reason: "Why spending was stopped."
    triggers: []

  - type: dining_resume
    target: dining_holdings
    mutation: {transition: {from: suspended, to: active}}
    meaning: "The card has been replaced or the arrears settled, and spending starts again."
    grain: "One row per plan; the resumption is recorded on the plan itself."
    fields:
      status: "Lifecycle state of the plan, returned to the in-use state."
      suspension_reason: "Cleared once spending starts again."
    triggers: []

  - type: dining_exhaust
    target: dining_holdings
    mutation: {transition: {from: active, to: exhausted}}
    meaning: "The balance has run to nothing and no automatic top-up is set."
    grain: "One row per plan; the empty balance is recorded on the plan itself."
    fields:
      status: "Lifecycle state of the plan, moved to the empty state."
      dining_balance_usd: "Spending power left on the plan, which stands at nothing."
    triggers: []

  - type: dining_replenish
    target: dining_holdings
    mutation: {transition: {from: exhausted, to: active}}
    meaning: "A fresh load has cleared and the plan may be spent again."
    grain: "One row per plan; the return to use is recorded on the plan itself."
    fields:
      status: "Lifecycle state of the plan, returned to the in-use state."
      dining_balance_usd: "Spending power now on the plan."
    triggers: []

  - type: dining_cancel
    target: dining_holdings
    mutation:
      transition:
        - {from: enrolled, to: cancelled}
        - {from: active, to: cancelled}
        - {from: suspended, to: cancelled}
    meaning: "The household gives the dining plan up."
    grain: "One row per plan; the cancellation is recorded on the plan itself."
    fields:
      status: "Lifecycle state of the plan, moved to the cancelled state."
      cancellation_reason: "Why the plan was given up."
      closed_date: "Last date the plan could be spent."
    triggers:
      - event: dining:dining_refund
        when: {cancellation_reason: [guest_request, relocation, collective_error]}
        map: {dining_plan_id: dining_plan_id, customer_id: customer_id, credit_reason: plan_cancellation}

  - type: dining_expire
    target: dining_holdings
    mutation:
      transition:
        - {from: active, to: expired}
        - {from: suspended, to: expired}
        - {from: exhausted, to: expired}
    meaning: "The season has ended and the plan may no longer be spent."
    grain: "One row per plan; expiry is recorded on the plan itself."
    fields:
      status: "Lifecycle state of the plan, moved to the expired state."
      closed_date: "Last date the plan could be spent."
    triggers: []

  - type: dining_close
    target: dining_holdings
    mutation:
      transition:
        - {from: expired, to: closed}
        - {from: cancelled, to: closed}
    meaning: "Everything owed on and owed to the dining plan has been settled and the record is closed for good."
    grain: "One row per plan; closure is recorded on the plan itself."
    fields:
      status: "Lifecycle state of the plan, moved to the closed state."
      plan_fee_balance_usd: "Plan fees still to be collected, which stand at zero once the record is closed."
    triggers: []

  - type: dining_load
    target: dining_ledger
    meaning: "The household loads money onto the dining plan."
    grain: "One row per load of money onto one plan."
    distinguish_by: [event_date, amount_usd, load_channel]
    fields:
      dining_event_id: "Reference number of this dining account entry."
      dining_plan_id: "The plan this entry belongs to."
      customer_id: "The household account this entry belongs to."
      event_type: "The kind of dining account entry this row records."
      season_code: "The season the plan is sold for."
      event_date: "Date the load cleared."
      amount_usd: "Amount loaded."
      load_channel: "Where the load was made."
      payment_method: "How the money was taken."
    account: dining_balance
    direction: in
    triggers:
      - event: dining:dining_bonus_load
        map: {dining_plan_id: dining_plan_id, customer_id: customer_id, related_event_id: dining_event_id, load_channel: load_channel}

  - type: dining_bonus_load
    target: dining_ledger
    meaning: "The bonus a load earns is added to the dining plan."
    grain: "One row per bonus added against one load on one plan."
    distinguish_by: [related_event_id, event_date, amount_usd]
    fields:
      dining_event_id: "Reference number of this dining account entry."
      dining_plan_id: "The plan this entry belongs to."
      customer_id: "The household account this entry belongs to."
      event_type: "The kind of dining account entry this row records."
      related_event_id: "The load entry this bonus answers to."
      event_date: "Date the bonus was added."
      amount_usd: "Amount of bonus added."
      load_channel: "Where the load that earned the bonus was made."
    account: dining_balance
    direction: in
    triggers: []

  - type: dining_spend
    target: dining_ledger
    meaning: "The card is presented at a collective outlet and the bill is taken off the balance."
    grain: "One row per transaction at one outlet on one date under one plan."
    distinguish_by: [event_date, outlet, amount_usd]
    fields:
      dining_event_id: "Reference number of this dining account entry."
      dining_plan_id: "The plan this entry belongs to."
      customer_id: "The household account this entry belongs to."
      event_type: "The kind of dining account entry this row records."
      event_date: "Date the card was presented."
      amount_usd: "Amount taken off the balance after the card reduction."
      outlet: "Outlet the card was presented at."
      mountain: "Mountain the outlet stands at."
      card_serial: "Serial of the card presented."
      item_category: "What kind of goods the transaction covered."
    account: dining_balance
    direction: out
    triggers: []

  - type: dining_refund
    target: dining_ledger
    meaning: "A balance left on a cancelled plan is returned to the household and taken off the plan."
    grain: "One row per return of balance on one plan."
    distinguish_by: [event_date, amount_usd, credit_reason]
    fields:
      dining_event_id: "Reference number of this dining account entry."
      dining_plan_id: "The plan this entry belongs to."
      customer_id: "The household account this entry belongs to."
      event_type: "The kind of dining account entry this row records."
      related_event_id: "The load entry the return is worked out from."
      event_date: "Date the balance was returned."
      amount_usd: "Amount returned."
      credit_reason: "Why the balance was returned."
      payment_method: "Where the money went."
    account: dining_balance
    direction: out
    triggers: []

  - type: dining_fee_charge
    target: dining_ledger
    meaning: "A plan fee of some kind — enrolment, an extra card, a replacement card, a transfer or a reinstatement — is raised against the household account."
    grain: "One row per plan fee of one kind raised on one plan."
    distinguish_by: [charge_category, event_date, related_event_id]
    fields:
      dining_event_id: "Reference number of this dining account entry."
      dining_plan_id: "The plan this entry belongs to."
      customer_id: "The household account this entry belongs to."
      event_type: "The kind of dining account entry this row records."
      related_event_id: "The dining account entry this fee answers to, where it answers to one."
      event_date: "Date the fee was raised."
      amount_usd: "Amount of the fee."
      charge_category: "Which fee the amount is for."
    account: plan_fee_balance
    direction: in
    triggers: []

  - type: dining_fee_payment
    target: dining_ledger
    meaning: "Money is collected against the plan fees owed on a dining plan."
    grain: "One row per payment of plan fees on one plan."
    distinguish_by: [event_date, amount_usd, payment_method]
    fields:
      dining_event_id: "Reference number of this dining account entry."
      dining_plan_id: "The plan this entry belongs to."
      customer_id: "The household account this entry belongs to."
      event_type: "The kind of dining account entry this row records."
      related_event_id: "The fee this payment settles."
      event_date: "Date the payment cleared."
      amount_usd: "Amount collected."
      payment_method: "How the money was taken."
    account: plan_fee_balance
    direction: out
    triggers: []

  - type: dining_statement
    target: dining_ledger
    meaning: "A statement of the plan's loads, bonuses and spending is drawn up and sent to the household."
    grain: "One row per statement drawn up for one plan for one period."
    distinguish_by: [event_date, period_start_date, period_end_date]
    fields:
      dining_event_id: "Reference number of this dining account entry."
      dining_plan_id: "The plan this entry belongs to."
      customer_id: "The household account this entry belongs to."
      event_type: "The kind of dining account entry this row records."
      event_date: "Date the statement was drawn up."
      period_start_date: "First date the statement covers."
      period_end_date: "Last date the statement covers."
      amount_usd: "Balance standing on the plan at the end of the period."
    triggers: []

measures:
  - id: dining_msr_season_spend_count
    window: "The season named in the plan's season_code."
    measure: "Count of dining_ledger rows of event_type dining_spend carrying this dining_plan_id."
  - id: dining_msr_season_loaded_usd
    window: "The season named in the plan's season_code."
    measure: "Sum of amount_usd over dining_ledger rows of event_type dining_load carrying this dining_plan_id."

policies:
  - id: dining_agg_multi_holding
    subject: [dining_open]
    rule: >
      A household account may carry more than one dining plan at once, up to the number this charter allows,
      counting plans in the enrolled, active, suspended and exhausted states. Two live plans of the same
      kind are never opened for the same named holder in the same season; where a household wants more
      spending power they load the plan they hold rather than open a second, because two balances on one
      holder cannot both be presented at a till. Plans that have reached expired, cancelled or closed no
      longer count against the account. Corporate accounts take only the plans this charter sells to them,
      and a household plan is never converted into a corporate one.
    eligibility:
      - id: duplicate_plan_for_holder
        applies_to: [dining_open]
        kind: dedup
        condition: "Two live plans of the same kind are never opened for the same named holder in the same season; where a household wants more spending power they load the plan they hold rather than open a second, because two balances on one holder cannot both be presented at a till."
        evidence_fields: [dining_holdings.customer_id, dining_holdings.holder_name, dining_holdings.season_code, dining_holdings.variant_name, dining_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dining_holdings.customer_id, dining_holdings.holder_name, dining_holdings.season_code]
          action_bindings:
            dining_holdings.customer_id: customer_id
            dining_holdings.holder_name: holder_name
            dining_holdings.season_code: season_code
        dedup_contract:
          table: dining_holdings
          mode: separate_record
          object_bindings: {holder_name: holder_name, season_code: season_code}
          duplicate_filters: {status: [enrolled, active, suspended, exhausted]}
          distinct_fields: [variant_name]
    params:
      max_per_customer: 2

  - id: dining_agg_household_cards
    subject: [dining_open, dining_spend]
    rule: >
      A dining plan holds one balance and issues the cards the plan includes against it, so a household with
      four cards draws on one pot rather than four. Cards beyond those the plan includes are issued against
      the plan's extra card fee. A dependant may hold a card only up to the number of dependants the plan
      allows and only where they meet the plan's minimum holder age; alcohol is never paid for on a
      dependant's card whatever the plan allows the named holder. The daily and per-transaction caps stand
      against the plan as a whole and not against each card, so two cards spending together on one day are
      measured together against the daily cap. A corporate account takes only the plans this charter
      sells to corporate accounts, and on those plans the cards are issued to named employees exactly as
      they are to the named dependants of a household.
    eligibility: []
    params:
      per_tier:
        Mountain Bites Dining Card: {cardholders_included: "=cardholders_included", additional_card_fee_usd: "=additional_card_fee_usd", dependents_allowed: "=dependents_allowed", min_holder_age_years: "=min_holder_age_years", daily_spend_cap_usd: "=daily_spend_cap_usd", per_transaction_cap_usd: "=per_transaction_cap_usd", guest_spend_allowed: "=guest_spend_allowed", corporate_eligible: "=corporate_eligible"}
        Peak Plate Dining Plan: {cardholders_included: "=cardholders_included", additional_card_fee_usd: "=additional_card_fee_usd", dependents_allowed: "=dependents_allowed", min_holder_age_years: "=min_holder_age_years", daily_spend_cap_usd: "=daily_spend_cap_usd", per_transaction_cap_usd: "=per_transaction_cap_usd", guest_spend_allowed: "=guest_spend_allowed", corporate_eligible: "=corporate_eligible"}
        Summit Table Dining Plan: {cardholders_included: "=cardholders_included", additional_card_fee_usd: "=additional_card_fee_usd", dependents_allowed: "=dependents_allowed", min_holder_age_years: "=min_holder_age_years", daily_spend_cap_usd: "=daily_spend_cap_usd", per_transaction_cap_usd: "=per_transaction_cap_usd", guest_spend_allowed: "=guest_spend_allowed", corporate_eligible: "=corporate_eligible"}
        Alpine Club Dining Membership: {cardholders_included: "=cardholders_included", additional_card_fee_usd: "=additional_card_fee_usd", dependents_allowed: "=dependents_allowed", min_holder_age_years: "=min_holder_age_years", daily_spend_cap_usd: "=daily_spend_cap_usd", per_transaction_cap_usd: "=per_transaction_cap_usd", guest_spend_allowed: "=guest_spend_allowed", corporate_eligible: "=corporate_eligible"}
        Chef's Table Dining Membership: {cardholders_included: "=cardholders_included", additional_card_fee_usd: "=additional_card_fee_usd", dependents_allowed: "=dependents_allowed", min_holder_age_years: "=min_holder_age_years", daily_spend_cap_usd: "=daily_spend_cap_usd", per_transaction_cap_usd: "=per_transaction_cap_usd", guest_spend_allowed: "=guest_spend_allowed", corporate_eligible: "=corporate_eligible"}
        Collective Hospitality Dining Membership: {cardholders_included: "=cardholders_included", additional_card_fee_usd: "=additional_card_fee_usd", dependents_allowed: "=dependents_allowed", min_holder_age_years: "=min_holder_age_years", daily_spend_cap_usd: "=daily_spend_cap_usd", per_transaction_cap_usd: "=per_transaction_cap_usd", guest_spend_allowed: "=guest_spend_allowed", corporate_eligible: "=corporate_eligible"}

  - id: dining_enrollment
    subject: [dining_open, dining_activate, dining_load]
    rule: >
      A plan is opened for a named holder who meets the plan's minimum age, and the plan's enrolment fee is
      raised with it. The plan comes into use only once a load of at least the plan's first load amount has
      cleared. Money is loaded onto a plan only while the plan record stands in the enrolled, active or
      exhausted state. Later loads must reach the plan's top-up minimum, and no load may take the balance
      above the plan's ceiling or the season's total above the plan's season limit; a load that would do
      either is refused rather than trimmed. Where the plan offers it, the household may set an automatic
      top-up that presents the plan's top-up amount whenever the balance falls below its trigger, and a
      top-up that is refused stops spending until it is settled.
    eligibility:
      - id: loadable_plan_state
        applies_to: [dining_load]
        kind: state
        condition: "Money is loaded onto a plan only while the plan record stands in the enrolled, active or exhausted state."
        evidence_fields: [dining_holdings.dining_plan_id, dining_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dining_holdings.dining_plan_id]
          action_bindings:
            dining_holdings.dining_plan_id: dining_plan_id
        state_contract:
          field: dining_holdings.status
          allowed: [enrolled, active, exhausted]
    params:
      per_tier:
        Mountain Bites Dining Card: {enrollment_fee_usd: "=enrollment_fee_usd", minimum_first_load_usd: "=minimum_first_load_usd", minimum_top_up_usd: "=minimum_top_up_usd", maximum_balance_usd: "=maximum_balance_usd", maximum_season_load_usd: "=maximum_season_load_usd", auto_top_up_offered: "=auto_top_up_offered", auto_top_up_trigger_usd: "=auto_top_up_trigger_usd", auto_top_up_amount_usd: "=auto_top_up_amount_usd"}
        Peak Plate Dining Plan: {enrollment_fee_usd: "=enrollment_fee_usd", minimum_first_load_usd: "=minimum_first_load_usd", minimum_top_up_usd: "=minimum_top_up_usd", maximum_balance_usd: "=maximum_balance_usd", maximum_season_load_usd: "=maximum_season_load_usd", auto_top_up_offered: "=auto_top_up_offered", auto_top_up_trigger_usd: "=auto_top_up_trigger_usd", auto_top_up_amount_usd: "=auto_top_up_amount_usd"}
        Summit Table Dining Plan: {enrollment_fee_usd: "=enrollment_fee_usd", minimum_first_load_usd: "=minimum_first_load_usd", minimum_top_up_usd: "=minimum_top_up_usd", maximum_balance_usd: "=maximum_balance_usd", maximum_season_load_usd: "=maximum_season_load_usd", auto_top_up_offered: "=auto_top_up_offered", auto_top_up_trigger_usd: "=auto_top_up_trigger_usd", auto_top_up_amount_usd: "=auto_top_up_amount_usd"}
        Alpine Club Dining Membership: {enrollment_fee_usd: "=enrollment_fee_usd", minimum_first_load_usd: "=minimum_first_load_usd", minimum_top_up_usd: "=minimum_top_up_usd", maximum_balance_usd: "=maximum_balance_usd", maximum_season_load_usd: "=maximum_season_load_usd", auto_top_up_offered: "=auto_top_up_offered", auto_top_up_trigger_usd: "=auto_top_up_trigger_usd", auto_top_up_amount_usd: "=auto_top_up_amount_usd"}
        Chef's Table Dining Membership: {enrollment_fee_usd: "=enrollment_fee_usd", minimum_first_load_usd: "=minimum_first_load_usd", minimum_top_up_usd: "=minimum_top_up_usd", maximum_balance_usd: "=maximum_balance_usd", maximum_season_load_usd: "=maximum_season_load_usd", auto_top_up_offered: "=auto_top_up_offered", auto_top_up_trigger_usd: "=auto_top_up_trigger_usd", auto_top_up_amount_usd: "=auto_top_up_amount_usd"}
        Collective Hospitality Dining Membership: {enrollment_fee_usd: "=enrollment_fee_usd", minimum_first_load_usd: "=minimum_first_load_usd", minimum_top_up_usd: "=minimum_top_up_usd", maximum_balance_usd: "=maximum_balance_usd", maximum_season_load_usd: "=maximum_season_load_usd", auto_top_up_offered: "=auto_top_up_offered", auto_top_up_trigger_usd: "=auto_top_up_trigger_usd", auto_top_up_amount_usd: "=auto_top_up_amount_usd"}
    measures: [dining_msr_season_loaded_usd]

  - id: dining_bonus_programme
    subject: [dining_bonus_load]
    rule: >
      Every load earns a bonus worked out on the size of that load alone, never on the balance already
      standing and never on the loads of the season added together. The bonus band is the highest band whose
      threshold the load reaches, and the band's percentage is applied to the whole load rather than only to
      the part above the threshold. A household that also holds a season pass in force earns the plan's
      passholder addition on top of the band, and a household that also holds collective lodging over the
      season earns the plan's lodging addition; where both would apply the two are added, because they
      reward two different holdings. Bonus earned over the season is capped at the plan's bonus ceiling, and
      a load that would carry the season past it earns only the bonus left under it. Bonus money is spent
      exactly as loaded money is, but it is never returned on a cancellation.
    eligibility: []
    params:
      per_tier:
        Mountain Bites Dining Card: {bonus_tier_1_load_usd: "=bonus_tier_1_load_usd", bonus_tier_1_pct: "=bonus_tier_1_pct", bonus_tier_2_load_usd: "=bonus_tier_2_load_usd", bonus_tier_2_pct: "=bonus_tier_2_pct", bonus_tier_3_load_usd: "=bonus_tier_3_load_usd", bonus_tier_3_pct: "=bonus_tier_3_pct", bonus_cap_usd: "=bonus_cap_usd", passholder_bonus_pct: "=passholder_bonus_pct", lodging_guest_bonus_pct: "=lodging_guest_bonus_pct"}
        Peak Plate Dining Plan: {bonus_tier_1_load_usd: "=bonus_tier_1_load_usd", bonus_tier_1_pct: "=bonus_tier_1_pct", bonus_tier_2_load_usd: "=bonus_tier_2_load_usd", bonus_tier_2_pct: "=bonus_tier_2_pct", bonus_tier_3_load_usd: "=bonus_tier_3_load_usd", bonus_tier_3_pct: "=bonus_tier_3_pct", bonus_cap_usd: "=bonus_cap_usd", passholder_bonus_pct: "=passholder_bonus_pct", lodging_guest_bonus_pct: "=lodging_guest_bonus_pct"}
        Summit Table Dining Plan: {bonus_tier_1_load_usd: "=bonus_tier_1_load_usd", bonus_tier_1_pct: "=bonus_tier_1_pct", bonus_tier_2_load_usd: "=bonus_tier_2_load_usd", bonus_tier_2_pct: "=bonus_tier_2_pct", bonus_tier_3_load_usd: "=bonus_tier_3_load_usd", bonus_tier_3_pct: "=bonus_tier_3_pct", bonus_cap_usd: "=bonus_cap_usd", passholder_bonus_pct: "=passholder_bonus_pct", lodging_guest_bonus_pct: "=lodging_guest_bonus_pct"}
        Alpine Club Dining Membership: {bonus_tier_1_load_usd: "=bonus_tier_1_load_usd", bonus_tier_1_pct: "=bonus_tier_1_pct", bonus_tier_2_load_usd: "=bonus_tier_2_load_usd", bonus_tier_2_pct: "=bonus_tier_2_pct", bonus_tier_3_load_usd: "=bonus_tier_3_load_usd", bonus_tier_3_pct: "=bonus_tier_3_pct", bonus_cap_usd: "=bonus_cap_usd", passholder_bonus_pct: "=passholder_bonus_pct", lodging_guest_bonus_pct: "=lodging_guest_bonus_pct"}
        Chef's Table Dining Membership: {bonus_tier_1_load_usd: "=bonus_tier_1_load_usd", bonus_tier_1_pct: "=bonus_tier_1_pct", bonus_tier_2_load_usd: "=bonus_tier_2_load_usd", bonus_tier_2_pct: "=bonus_tier_2_pct", bonus_tier_3_load_usd: "=bonus_tier_3_load_usd", bonus_tier_3_pct: "=bonus_tier_3_pct", bonus_cap_usd: "=bonus_cap_usd", passholder_bonus_pct: "=passholder_bonus_pct", lodging_guest_bonus_pct: "=lodging_guest_bonus_pct"}
        Collective Hospitality Dining Membership: {bonus_tier_1_load_usd: "=bonus_tier_1_load_usd", bonus_tier_1_pct: "=bonus_tier_1_pct", bonus_tier_2_load_usd: "=bonus_tier_2_load_usd", bonus_tier_2_pct: "=bonus_tier_2_pct", bonus_tier_3_load_usd: "=bonus_tier_3_load_usd", bonus_tier_3_pct: "=bonus_tier_3_pct", bonus_cap_usd: "=bonus_cap_usd", passholder_bonus_pct: "=passholder_bonus_pct", lodging_guest_bonus_pct: "=lodging_guest_bonus_pct"}
    formula:
      bonus_pct: "bonus_tier_3_pct if amount_usd >= bonus_tier_3_load_usd else (bonus_tier_2_pct if amount_usd >= bonus_tier_2_load_usd else bonus_tier_1_pct)"
      bonus_amount_usd: "min(bonus_cap_usd, round(amount_usd * bonus_pct / 100, 2))"

  - id: dining_spending
    subject: [dining_spend, dining_exhaust]
    rule: >
      The card is presented at the till and the bill, after the plan's card reduction, is taken off the
      balance. The card is presented only while the plan record stands in the active state. The outlet must
      be one the plan covers and must stand at a mountain the plan is valid at; a card presented elsewhere
      is refused at the till and the guest pays by other means. On the plan's blackout dates the card is not
      taken at table service outlets, though quick service outlets take it as usual. Alcohol and resort
      retail are paid for on the card only where the plan allows them. A transaction above the plan's
      per-transaction cap, or one that would take the day past the plan's daily cap, is refused rather than
      split. Where the bill is larger than the balance, the balance is taken and the rest is paid by other
      means; the balance never goes below nothing. A plan whose balance runs to nothing with no automatic
      top-up set is marked empty until a fresh load clears. The plan carries table entitlements alongside
      the balance: the window ahead within which the holder may reserve a table, priority seating where
      the plan includes it, the chef's table seatings and the hours of private dining room use the plan
      carries for the season, and a wine locker at a collective outlet where the plan includes one.
      Those entitlements are drawn on by reserving rather than by spending, so using them moves nothing
      off the balance and a plan with no balance left keeps them until the season ends.
    eligibility:
      - id: spendable_plan_state
        applies_to: [dining_spend]
        kind: state
        condition: "The card is presented only while the plan record stands in the active state."
        evidence_fields: [dining_holdings.dining_plan_id, dining_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dining_holdings.dining_plan_id]
          action_bindings:
            dining_holdings.dining_plan_id: dining_plan_id
        state_contract:
          field: dining_holdings.status
