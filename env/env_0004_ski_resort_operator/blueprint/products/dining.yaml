category: dining
display_name: Mountain Dining Plans

binding:
  holding_table: dining_holdings
  event_tables: [dining_ledger]
  intake_tables: [dining_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields:
    dining_balance_usd: dining_balance
    plan_fee_balance_usd: plan_fee_balance

lifecycle:
  states: [enrolled, active, suspended, exhausted, expired, cancelled, closed]
  transitions:
    - {from: enrolled, to: active, by: system, means: "The first load has cleared and the dining card may be used at the collective's outlets."}
    - {from: enrolled, to: cancelled, by: user, means: "The household gives the plan up before the first load cleared."}
    - {from: active, to: suspended, by: agent, means: "The card has been reported lost or the plan account stands in arrears, and spending is stopped."}
    - {from: suspended, to: active, by: agent, means: "The card has been replaced or the arrears settled, and spending starts again."}
    - {from: active, to: exhausted, by: system, means: "The balance has run to nothing and no automatic top-up is set."}
    - {from: exhausted, to: active, by: system, means: "A fresh load has cleared and the plan may be spent again."}
    - {from: active, to: expired, by: system, means: "The season has ended with the plan in use."}
    - {from: suspended, to: expired, by: system, means: "The season has ended with the plan stopped."}
    - {from: exhausted, to: expired, by: system, means: "The season has ended with the balance at nothing."}
    - {from: active, to: cancelled, by: user, means: "The household gives the plan up during the season."}
    - {from: suspended, to: cancelled, by: user, means: "The household gives up a plan that was already stopped."}
    - {from: expired, to: closed, by: system, means: "The expired plan has been settled and the record closed."}
    - {from: cancelled, to: closed, by: system, means: "The cancelled plan has been settled and the record closed."}

accounts:
  - key: dining_balance
    unit: USD
    meaning: "The spending power left on this dining plan; it rises when the household loads money or earns a bonus and falls when the card is spent or the balance is returned."
  - key: plan_fee_balance
    unit: USD
    meaning: "The enrolment, card and administration fees still to be collected on this dining plan; it rises when a fee is raised and falls when a payment clears."

parameter_schema:
  enrollment_fee_usd: "One-off fee in USD for opening this dining plan."
  minimum_first_load_usd: "Smallest amount in USD the household must load to bring this plan into use."
  minimum_top_up_usd: "Smallest amount in USD that may be loaded onto this plan after the first load."
  maximum_balance_usd: "Largest balance in USD this plan may carry at any moment."
  maximum_season_load_usd: "Largest amount in USD that may be loaded onto this plan over one season."
  bonus_tier_1_load_usd: "Load amount in USD at which the first bonus band starts."
  bonus_tier_1_pct: "Percentage of the load added as a bonus in the first bonus band."
  bonus_tier_2_load_usd: "Load amount in USD at which the second bonus band starts."
  bonus_tier_2_pct: "Percentage of the load added as a bonus in the second bonus band."
  bonus_tier_3_load_usd: "Load amount in USD at which the third bonus band starts."
  bonus_tier_3_pct: "Percentage of the load added as a bonus in the third bonus band."
  bonus_cap_usd: "Most bonus in USD this plan earns over one season."
  outlet_discount_pct: "Percentage taken off the bill at a collective outlet when the card is presented."
  outlets_included: "List of the kinds of outlet this plan may be spent at."
  mountains_valid: "List of the collective's mountains whose outlets take this plan."
  blackout_dates: "List of dates, as YYYY-MM-DD, on which the plan may not be spent at table service outlets."
  alcohol_eligible: "Whether alcohol may be paid for with this plan (true/false)."
  retail_eligible: "Whether resort retail may be paid for with this plan (true/false)."
  gratuity_included: "Whether the service charge is covered by the card discount (true/false)."
  daily_spend_cap_usd: "Largest amount in USD that may be spent on this plan in one calendar day."
  per_transaction_cap_usd: "Largest amount in USD that may be spent on this plan in one transaction."
  guest_spend_allowed: "Whether someone other than the named holder may spend the plan (true/false)."
  cardholders_included: "Number of cards issued on this plan for the household (integer)."
  additional_card_fee_usd: "Fee in USD for each card beyond those included."
  card_replacement_fee_usd: "Fee in USD for replacing a lost or broken card."
  card_type: "What the plan is carried on; one of printed_card, rfid_card or mobile_wallet."
  auto_top_up_offered: "Whether the plan may be topped up automatically when the balance runs low (true/false)."
  auto_top_up_trigger_usd: "Balance in USD at which an automatic top-up is presented."
  auto_top_up_amount_usd: "Amount in USD loaded by an automatic top-up."
  statement_frequency: "How often the household is sent a statement of the plan; one of weekly, monthly or season_end."
  carryover_allowed: "Whether a balance left at the end of the season carries into the next one (true/false)."
  carryover_cap_usd: "Most balance in USD that carries into the next season."
  balance_expiry_days: "Number of calendar days after the season ends within which a balance left must be used (integer)."
  refund_basis: "How a balance returned on cancellation is worked out; one of loaded_amount_less_bonus, full_balance or no_refund."
  refund_admin_fee_usd: "Fee in USD retained from a balance returned on cancellation."
  refund_window_days: "Number of calendar days after the plan is opened within which a refund may be asked for (integer)."
  cancellation_notice_days: "Number of calendar days before the requested end date by which a cancellation must be recorded (integer)."
  arrears_suspension_days: "Number of calendar days a plan fee may stand unpaid before spending is stopped (integer)."
  reinstatement_fee_usd: "Fee in USD for starting spending again after it was stopped for arrears."
  priority_seating_included: "Whether the plan carries priority seating at table service outlets (true/false)."
  reservation_window_days: "Number of calendar days ahead a plan holder may reserve a table (integer)."
  chef_table_seats_per_season: "Number of chef's table seatings included with this plan over the season (integer)."
  wine_locker_included: "Whether a wine locker at a collective outlet is included with the plan (true/false)."
  private_event_hours: "Hours of private dining room use included with this plan over the season (integer)."
  season_start_date: "First date this plan may be spent, as YYYY-MM-DD."
  season_end_date: "Last date this plan may be spent, as YYYY-MM-DD."
  passholder_bonus_pct: "Extra percentage added to a load where the household also holds a season pass in force."
  lodging_guest_bonus_pct: "Extra percentage added to a load where the household also holds collective lodging over the season."
  transferable: "Whether the plan may be moved to a different household account (true/false)."
  transfer_fee_usd: "Fee in USD for moving the plan to a different household account."
  min_holder_age_years: "Youngest age in whole years a named holder may be (integer)."
  dependents_allowed: "Number of dependants who may hold a card on the plan (integer)."
  corporate_eligible: "Whether this plan is sold to corporate accounts as well as households (true/false)."
  season_code: "The season this plan is sold for."

