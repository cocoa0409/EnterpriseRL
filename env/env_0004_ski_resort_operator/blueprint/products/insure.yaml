        Collective Trip Protection Standard: {claim_notice_days: "=claim_notice_days", document_submission_days: "=document_submission_days", required_documents: "=required_documents", medical_certificate_required: "=medical_certificate_required", employer_letter_required: "=employer_letter_required", claim_appeal_allowed: "=claim_appeal_allowed", claim_appeal_days: "=claim_appeal_days", concierge_support_included: "=concierge_support_included"}
