  - id: insure_claim_intake
    subject: [insure_claim_open, insure_document_receive]
    rule: >
      A claim is made by the household, not opened by the collective on their behalf, and it names one of
      the events the plan covers. A claim is opened only when it is made no later than the plan's notice
      period counted in calendar days from the day the event claimed on occurred. Calendar days are counted
      forward from the anchor date, the anchor date itself counting as day zero, every day of the week
      counting alike, and a calendar day is never mixed with a full 24-hour period; where the resulting
      boundary falls on a date that does not exist in the target month, the last day of that month is used.
      The papers the plan requires must reach the collective within the plan's submission period, and each
      paper is recorded against the claim as it arrives with a note of whether it is enough for assessment.
      A paper is recorded against a claim only while the plan record stands in the claim_open state.
      Whether the papers are complete is answered by the collective's own record of what has been received,
      never by the household's account of what they sent. A claim whose papers are not complete by the end
      of the submission period is refused for want of papers, and the household may make it again only by
      way of an appeal where the plan allows one. On the plans that include it a named concierge gathers
      the papers on the household's behalf and files them for them, which changes who assembles the
      claim but never what the plan requires: the same papers must still reach the collective inside the
      same submission period.
    eligibility:
      - id: within_claim_notice_period
        applies_to: [insure_claim_open]
        kind: time
        condition: "A claim is opened only when it is made no later than the plan's notice period counted in calendar days from the day the event claimed on occurred."
        evidence_fields: [insure_holdings.protection_plan_id, insure_holdings.claim_opened_date, insure_holdings.effective_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [insure_holdings.protection_plan_id]
          action_bindings:
            insure_holdings.protection_plan_id: protection_plan_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the event claimed on occurred"
          anchor_source: insure_holdings.effective_date
          relation: not_after
          duration_source: variants.claim_notice_days
          unit: calendar_days
          counting_rule: "Calendar days are counted forward from the anchor date, the anchor date itself counting as day zero, every day of the week counting alike, and a calendar day is never mixed with a full 24-hour period; where the resulting boundary falls on a date that does not exist in the target month, the last day of that month is used."
          boundary: inclusive
      - id: document_recording_state
        applies_to: [insure_document_receive]
        kind: state
        condition: "A paper is recorded against a claim only while the plan record stands in the claim_open state."
        evidence_fields: [insure_holdings.protection_plan_id, insure_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [insure_holdings.protection_plan_id]
          action_bindings:
            insure_holdings.protection_plan_id: protection_plan_id
        state_contract:
          field: insure_holdings.status
          allowed: [claim_open]
      - id: papers_are_on_record
        applies_to: [insure_claim_open]
        kind: authorization
        condition: "Whether the papers are complete is answered by the collective's own record of what has been received, never by the household's account of what they sent."
        evidence_fields: [insure_holdings.protection_plan_id, insure_holdings.documents_complete]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [insure_holdings.protection_plan_id]
          action_bindings:
            insure_holdings.protection_plan_id: protection_plan_id
    params:
      per_tier:
        Season Pass Protection Basic: {claim_notice_days: "=claim_notice_days", document_submission_days: "=document_submission_days", required_documents: "=required_documents", medical_certificate_required: "=medical_certificate_required", employer_letter_required: "=employer_letter_required", claim_appeal_allowed: "=claim_appeal_allowed", claim_appeal_days: "=claim_appeal_days", concierge_support_included: "=concierge_support_included"}
        Season Pass Protection Plus: {claim_notice_days: "=claim_notice_days", document_submission_days: "=document_submission_days", required_documents: "=required_documents", medical_certificate_required: "=medical_certificate_required", employer_letter_required: "=employer_letter_required", claim_appeal_allowed: "=claim_appeal_allowed", claim_appeal_days: "=claim_appeal_days", concierge_support_included: "=concierge_support_included"}
