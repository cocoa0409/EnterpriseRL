category: insure
display_name: Pass and Trip Protection

binding:
  holding_table: insure_holdings
  event_tables: [insure_ledger]
  intake_tables: [insure_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields:
    premium_balance_usd: premium_balance
    benefit_remaining_usd: benefit_remaining

lifecycle:
  states: [quoted, active, claim_open, claim_settled, lapsed, cancelled, expired, closed]
  transitions:
    - {from: quoted, to: active, by: agent, means: "The premium has been taken and cover on the named holding has begun."}
    - {from: quoted, to: cancelled, by: user, means: "The household lets the quote go without taking the plan."}
    - {from: active, to: claim_open, by: user, means: "The household makes a claim on the plan and the claim is opened for assessment."}
    - {from: claim_open, to: claim_settled, by: agent, means: "The claim has been assessed, allowed and paid."}
    - {from: claim_open, to: active, by: agent, means: "The claim has been withdrawn or refused, and cover carries on unchanged."}
    - {from: claim_settled, to: active, by: system, means: "The settled claim is closed off and cover carries on with the benefit reduced by what was paid."}
    - {from: active, to: lapsed, by: system, means: "A premium instalment has gone unpaid past its grace period and cover has stopped."}
    - {from: lapsed, to: active, by: agent, means: "The unpaid premium has been settled and cover has been put back in force."}
    - {from: active, to: cancelled, by: user, means: "The household cancels the plan and gives up cover."}
    - {from: lapsed, to: cancelled, by: user, means: "The household gives up a plan that had already stopped for non-payment."}
    - {from: active, to: expired, by: system, means: "The covered season has ended with the plan in force."}
    - {from: claim_settled, to: expired, by: system, means: "The covered season has ended with a settled claim on the plan."}
    - {from: lapsed, to: expired, by: system, means: "The covered season has ended with the plan out of force."}
    - {from: expired, to: closed, by: system, means: "The expired plan has been settled and the record closed."}
    - {from: cancelled, to: closed, by: system, means: "The cancelled plan has been settled and the record closed."}

accounts:
  - key: premium_balance
    unit: USD
    meaning: "The premium and plan fees still to be collected for this protection plan; it rises when a premium or fee is raised and falls when a payment clears."
  - key: benefit_remaining
    unit: USD
    meaning: "The cover still available to be claimed on this protection plan for the season; the whole limit is loaded when the plan comes into force and it is drawn down by every claim paid."

parameter_schema:
  premium_basis: "How the premium for this plan is worked out; one of flat_premium or percent_of_covered_value."
  premium_flat_usd: "Premium in USD where the plan is priced as a flat amount."
  premium_rate_pct: "Percentage of the covered value taken as premium where the plan is priced on the value covered."
  premium_minimum_usd: "Smallest premium in USD this plan is written for whatever the covered value."
  premium_maximum_usd: "Largest premium in USD this plan is written for whatever the covered value."
  min_covered_value_usd: "Smallest value of a holding in USD this plan may be written over."
  max_covered_value_usd: "Largest value of a holding in USD this plan may be written over."
  covered_categories: "List of the collective's product categories a holding must belong to for this plan to be written over it."
  covered_perils: "List of the events this plan pays out on."
  excluded_perils: "List of the events this plan never pays out on, whatever else the wording says."
  benefit_limit_pct: "Percentage of the covered value that is the most this plan pays out over the season."
  per_claim_cap_usd: "Most this plan pays out in USD on any one claim."
  season_benefit_cap_usd: "Most this plan pays out in USD over the whole season across every claim."
  claims_per_season: "Number of claims this plan will entertain in one season (integer)."
  excess_usd: "Amount in USD the household bears on every claim before the plan pays anything."
  medical_benefit_pct: "Percentage of the covered value paid where the claim is made on medical grounds."
  job_loss_benefit_pct: "Percentage of the covered value paid where the claim is made on loss of employment."
  relocation_benefit_pct: "Percentage of the covered value paid where the claim is made on a permanent move away from the region."
  closure_benefit_pct: "Percentage of the covered value paid where the claim is made on the mountain being closed."
  trip_interruption_daily_usd: "Amount in USD paid for each day of a trip lost, where the plan covers interrupted trips."
  trip_interruption_max_days: "Most days of an interrupted trip this plan pays for (integer)."
  mountain_closure_threshold_days: "Number of consecutive days the mountain must be closed before a closure claim may be made (integer)."
  injury_threshold_days: "Number of consecutive days a doctor must certify the insured unfit to ski before a medical claim may be made (integer)."
  pre_existing_exclusion_months: "Number of months before the plan starts within which a treated condition is excluded (integer)."
  waiting_period_days: "Number of calendar days after the plan is taken before cover begins (integer)."
  free_look_days: "Number of calendar days after the plan is taken within which it may be given up with the premium returned in full (integer)."
  claim_notice_days: "Number of calendar days after the event within which a claim must be made (integer)."
  document_submission_days: "Number of calendar days after a claim is opened within which the supporting papers must reach the collective (integer)."
  required_documents: "List of the papers that must be on file before a claim is assessed."
  medical_certificate_required: "Whether a doctor's certificate must be on file for a medical claim (true/false)."
  employer_letter_required: "Whether a letter from the former employer must be on file for a loss of employment claim (true/false)."
  claim_assessment_days: "Number of business days within which a complete claim is assessed (integer)."
  settlement_days: "Number of business days after a claim is allowed within which the payout reaches the household (integer)."
  payout_method: "How an allowed claim is paid; one of resort_credit, original_payment_method or bank_transfer."
  premium_payment_schedule: "How the premium is collected; one of single_payment or with_holding_instalments."
  premium_grace_days: "Number of calendar days a premium instalment may go unpaid before cover stops (integer)."
  reinstatement_allowed: "Whether cover that has stopped for non-payment may be put back in force (true/false)."
  reinstatement_fee_usd: "Fee in USD for putting cover back in force after it stopped for non-payment."
  reinstatement_window_days: "Number of calendar days after cover stops within which it may be put back in force (integer)."
  cancellation_fee_usd: "Fee in USD retained when the household cancels the plan after the free look period."
  cancellation_refund_basis: "How the premium returned on cancellation is worked out; one of full_premium, pro_rata_by_days or no_refund."
  amendment_allowed: "Whether the holding covered or the beneficiary named on the plan may be changed (true/false)."
  amendment_fee_usd: "Fee in USD for changing the holding covered or the beneficiary named on the plan."
  plan_transferable: "Whether the plan may be moved to a different named insured (true/false)."
  family_cover_included: "Whether the plan covers the whole household rather than one named insured (true/false)."
  dependents_covered: "Number of dependants covered alongside the named insured (integer)."
  purchase_window_days: "Number of calendar days after the covered holding is opened within which this plan may still be taken (integer)."
  min_insured_age_years: "Youngest age in whole years a named insured may be (integer)."
  max_insured_age_years: "Oldest age in whole years a named insured may be (integer)."
  concierge_support_included: "Whether the plan includes a named concierge who handles the claim on the household's behalf (true/false)."
  season_start_date: "First date of the season this plan covers, as YYYY-MM-DD."
  season_end_date: "Last date of the season this plan covers, as YYYY-MM-DD."
  claim_appeal_allowed: "Whether a refused claim may be appealed to the collective's protection panel (true/false)."
  claim_appeal_days: "Number of calendar days after a refusal within which an appeal must be made (integer)."

