  - id: insure_claim_assessment
    subject: [insure_claim_settle, insure_claim_decline, insure_claim_payment]
    rule: >
      A complete claim is assessed against the plan's list of covered events. A claim made on an event the
      plan excludes is refused whatever the circumstances, and an exclusion always beats a cover, so a plan
      that covers loss of employment but excludes a voluntary resignation refuses a claim on a resignation.
      A medical claim is allowed only where a doctor has certified the insured unfit to ski for at least the
      plan's threshold in consecutive days, and a closure claim only where the mountain was shut for at
      least the plan's threshold in consecutive days. The amount allowed is the plan's benefit share for the
      event claimed on, taken of the covered value, less the plan's excess, and then brought down to the
      plan's per-claim cap; it is never below zero and never more than the benefit left on the plan. The
      payout is made only while the plan record stands in the claim_open or claim_settled state, and it
      draws down the benefit left for the rest of the season. A plan that has already met its allowance of
      claims for the season entertains no further claim, and a refused claim does not count against that
      allowance. The payout goes out by the plan's payout method and never in cash at the desk.
    eligibility:
      - id: payout_state
        applies_to: [insure_claim_payment]
        kind: state
        condition: "The payout is made only while the plan record stands in the claim_open or claim_settled state, and it draws down the benefit left for the rest of the season."
        evidence_fields: [insure_holdings.protection_plan_id, insure_holdings.status, insure_holdings.benefit_remaining_usd]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [insure_holdings.protection_plan_id]
          action_bindings:
            insure_holdings.protection_plan_id: protection_plan_id
        state_contract:
          field: insure_holdings.status
          allowed: [claim_open, claim_settled]
    params:
      per_tier:
        Season Pass Protection Basic: {covered_perils: "=covered_perils", excluded_perils: "=excluded_perils", medical_benefit_pct: "=medical_benefit_pct", job_loss_benefit_pct: "=job_loss_benefit_pct", relocation_benefit_pct: "=relocation_benefit_pct", closure_benefit_pct: "=closure_benefit_pct", excess_usd: "=excess_usd", per_claim_cap_usd: "=per_claim_cap_usd", season_benefit_cap_usd: "=season_benefit_cap_usd", claims_per_season: "=claims_per_season", injury_threshold_days: "=injury_threshold_days", mountain_closure_threshold_days: "=mountain_closure_threshold_days", trip_interruption_daily_usd: "=trip_interruption_daily_usd", trip_interruption_max_days: "=trip_interruption_max_days", claim_assessment_days: "=claim_assessment_days", settlement_days: "=settlement_days", payout_method: "=payout_method"}
        Season Pass Protection Plus: {covered_perils: "=covered_perils", excluded_perils: "=excluded_perils", medical_benefit_pct: "=medical_benefit_pct", job_loss_benefit_pct: "=job_loss_benefit_pct", relocation_benefit_pct: "=relocation_benefit_pct", closure_benefit_pct: "=closure_benefit_pct", excess_usd: "=excess_usd", per_claim_cap_usd: "=per_claim_cap_usd", season_benefit_cap_usd: "=season_benefit_cap_usd", claims_per_season: "=claims_per_season", injury_threshold_days: "=injury_threshold_days", mountain_closure_threshold_days: "=mountain_closure_threshold_days", trip_interruption_daily_usd: "=trip_interruption_daily_usd", trip_interruption_max_days: "=trip_interruption_max_days", claim_assessment_days: "=claim_assessment_days", settlement_days: "=settlement_days", payout_method: "=payout_method"}
        Season Pass Protection Premier: {covered_perils: "=covered_perils", excluded_perils: "=excluded_perils", medical_benefit_pct: "=medical_benefit_pct", job_loss_benefit_pct: "=job_loss_benefit_pct", relocation_benefit_pct: "=relocation_benefit_pct", closure_benefit_pct: "=closure_benefit_pct", excess_usd: "=excess_usd", per_claim_cap_usd: "=per_claim_cap_usd", season_benefit_cap_usd: "=season_benefit_cap_usd", claims_per_season: "=claims_per_season", injury_threshold_days: "=injury_threshold_days", mountain_closure_threshold_days: "=mountain_closure_threshold_days", trip_interruption_daily_usd: "=trip_interruption_daily_usd", trip_interruption_max_days: "=trip_interruption_max_days", claim_assessment_days: "=claim_assessment_days", settlement_days: "=settlement_days", payout_method: "=payout_method"}
        Collective Trip Protection Standard: {covered_perils: "=covered_perils", excluded_perils: "=excluded_perils", medical_benefit_pct: "=medical_benefit_pct", job_loss_benefit_pct: "=job_loss_benefit_pct", relocation_benefit_pct: "=relocation_benefit_pct", closure_benefit_pct: "=closure_benefit_pct", excess_usd: "=excess_usd", per_claim_cap_usd: "=per_claim_cap_usd", season_benefit_cap_usd: "=season_benefit_cap_usd", claims_per_season: "=claims_per_season", injury_threshold_days: "=injury_threshold_days", mountain_closure_threshold_days: "=mountain_closure_threshold_days", trip_interruption_daily_usd: "=trip_interruption_daily_usd", trip_interruption_max_days: "=trip_interruption_max_days", claim_assessment_days: "=claim_assessment_days", settlement_days: "=settlement_days", payout_method: "=payout_method"}
        Collective Trip Protection Elite: {covered_perils: "=covered_perils", excluded_perils: "=excluded_perils", medical_benefit_pct: "=medical_benefit_pct", job_loss_benefit_pct: "=job_loss_benefit_pct", relocation_benefit_pct: "=relocation_benefit_pct", closure_benefit_pct: "=closure_benefit_pct", excess_usd: "=excess_usd", per_claim_cap_usd: "=per_claim_cap_usd", season_benefit_cap_usd: "=season_benefit_cap_usd", claims_per_season: "=claims_per_season", injury_threshold_days: "=injury_threshold_days", mountain_closure_threshold_days: "=mountain_closure_threshold_days", trip_interruption_daily_usd: "=trip_interruption_daily_usd", trip_interruption_max_days: "=trip_interruption_max_days", claim_assessment_days: "=claim_assessment_days", settlement_days: "=settlement_days", payout_method: "=payout_method"}
        Collective Total Protection Concierge: {covered_perils: "=covered_perils", excluded_perils: "=excluded_perils", medical_benefit_pct: "=medical_benefit_pct", job_loss_benefit_pct: "=job_loss_benefit_pct", relocation_benefit_pct: "=relocation_benefit_pct", closure_benefit_pct: "=closure_benefit_pct", excess_usd: "=excess_usd", per_claim_cap_usd: "=per_claim_cap_usd", season_benefit_cap_usd: "=season_benefit_cap_usd", claims_per_season: "=claims_per_season", injury_threshold_days: "=injury_threshold_days", mountain_closure_threshold_days: "=mountain_closure_threshold_days", trip_interruption_daily_usd: "=trip_interruption_daily_usd", trip_interruption_max_days: "=trip_interruption_max_days", claim_assessment_days: "=claim_assessment_days", settlement_days: "=settlement_days", payout_method: "=payout_method"}
    formula:
      when_not: "claim_decision == 'refused'"
      benefit_pct: "medical_benefit_pct if claim_reason in ['medical_injury', 'medical_illness'] else (job_loss_benefit_pct if claim_reason == 'job_loss' else (relocation_benefit_pct if claim_reason == 'relocation' else closure_benefit_pct))"
      amount_usd: "max(0, min(per_claim_cap_usd, round(covered_value_usd * benefit_pct / 100 - excess_usd, 2)))"
    measures: [insure_msr_claims_paid_this_season]

  - id: insure_lapse_and_reinstatement
    subject: [insure_lapse, insure_reinstate, insure_fee_charge]
    rule: >
      Cover stops where an instalment of premium goes unpaid past the plan's grace period, counted from the
      day the instalment was presented and refused. Cover that has stopped pays nothing at all, and a loss
      arising while cover was stopped is never paid even where the premium is settled afterwards. Where the
      plan allows reinstatement, cover may be put back in force within the plan's reinstatement window on
      settlement of everything unpaid and payment of the plan's reinstatement fee; a plan that does not
      allow reinstatement is written afresh instead, with a fresh waiting period. Cover put back in force
      runs from the date of reinstatement and does not reach back over the days it was stopped. A plan fee
      is raised only while the plan record stands in the quoted, active, claim_open, claim_settled, lapsed
      or cancelled state. A plan that is not reinstated inside its window ends and the record is closed off
      at the end of the season.
    eligibility:
      - id: plan_fee_state
        applies_to: [insure_fee_charge]
        kind: state
        condition: "A plan fee is raised only while the plan record stands in the quoted, active, claim_open, claim_settled, lapsed or cancelled state."
        evidence_fields: [insure_holdings.protection_plan_id, insure_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [insure_holdings.protection_plan_id]
          action_bindings:
            insure_holdings.protection_plan_id: protection_plan_id
        state_contract:
          field: insure_holdings.status
          allowed: [quoted, active, claim_open, claim_settled, lapsed, cancelled]
    params:
      per_tier:
        Season Pass Protection Basic: {premium_grace_days: "=premium_grace_days", reinstatement_allowed: "=reinstatement_allowed", reinstatement_fee_usd: "=reinstatement_fee_usd", reinstatement_window_days: "=reinstatement_window_days", waiting_period_days: "=waiting_period_days"}
        Season Pass Protection Plus: {premium_grace_days: "=premium_grace_days", reinstatement_allowed: "=reinstatement_allowed", reinstatement_fee_usd: "=reinstatement_fee_usd", reinstatement_window_days: "=reinstatement_window_days", waiting_period_days: "=waiting_period_days"}
        Season Pass Protection Premier: {premium_grace_days: "=premium_grace_days", reinstatement_allowed: "=reinstatement_allowed", reinstatement_fee_usd: "=reinstatement_fee_usd", reinstatement_window_days: "=reinstatement_window_days", waiting_period_days: "=waiting_period_days"}
        Collective Trip Protection Standard: {premium_grace_days: "=premium_grace_days", reinstatement_allowed: "=reinstatement_allowed", reinstatement_fee_usd: "=reinstatement_fee_usd", reinstatement_window_days: "=reinstatement_window_days", waiting_period_days: "=waiting_period_days"}
        Collective Trip Protection Elite: {premium_grace_days: "=premium_grace_days", reinstatement_allowed: "=reinstatement_allowed", reinstatement_fee_usd: "=reinstatement_fee_usd", reinstatement_window_days: "=reinstatement_window_days", waiting_period_days: "=waiting_period_days"}
        Collective Total Protection Concierge: {premium_grace_days: "=premium_grace_days", reinstatement_allowed: "=reinstatement_allowed", reinstatement_fee_usd: "=reinstatement_fee_usd", reinstatement_window_days: "=reinstatement_window_days", waiting_period_days: "=waiting_period_days"}

  - id: insure_cancellation
    subject: [insure_cancel]
    rule: >
      A household may give a plan up at any time. The premium comes back in full only where the plan is
      given up no later than the free look period counted in calendar days from the day the plan was taken.
      Calendar days are counted forward from the anchor date, the anchor date itself counting as day zero,
      every day of the week counting alike, and a calendar day is never mixed with a full 24-hour period;
      where the resulting boundary falls on a date that does not exist in the target month, the last day of
      that month is used. After the free look period the plan's cancellation basis decides what comes back:
      on the pro rata basis the premium is returned for the days of cover still to come, worked out over the
      days between the date cover began and the date it was due to end; on the no refund basis nothing comes
      back at all. The plan's cancellation fee is retained from whatever comes back. A plan on which a claim
      has already been paid is never refunded any premium, whatever its basis, because the cover has already
      answered for itself. Cover ends on the day the cancellation is recorded and not on the day the
      household says they stopped wanting it.
    eligibility:
      - id: within_free_look
        applies_to: [insure_cancel]
        kind: time
        condition: "The premium comes back in full only where the plan is given up no later than the free look period counted in calendar days from the day the plan was taken."
        evidence_fields: [insure_holdings.protection_plan_id, insure_holdings.purchased_date, insure_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [insure_holdings.protection_plan_id]
          action_bindings:
            insure_holdings.protection_plan_id: protection_plan_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the plan was taken"
          anchor_source: insure_holdings.purchased_date
          relation: not_after
          duration_source: variants.free_look_days
          unit: calendar_days
          counting_rule: "Calendar days are counted forward from the anchor date, the anchor date itself counting as day zero, every day of the week counting alike, and a calendar day is never mixed with a full 24-hour period; where the resulting boundary falls on a date that does not exist in the target month, the last day of that month is used."
          boundary: inclusive
    params:
      per_tier:
        Season Pass Protection Basic: {free_look_days: "=free_look_days", cancellation_refund_basis: "=cancellation_refund_basis", cancellation_fee_usd: "=cancellation_fee_usd"}
        Season Pass Protection Plus: {free_look_days: "=free_look_days", cancellation_refund_basis: "=cancellation_refund_basis", cancellation_fee_usd: "=cancellation_fee_usd"}
        Season Pass Protection Premier: {free_look_days: "=free_look_days", cancellation_refund_basis: "=cancellation_refund_basis", cancellation_fee_usd: "=cancellation_fee_usd"}
        Collective Trip Protection Standard: {free_look_days: "=free_look_days", cancellation_refund_basis: "=cancellation_refund_basis", cancellation_fee_usd: "=cancellation_fee_usd"}
        Collective Trip Protection Elite: {free_look_days: "=free_look_days", cancellation_refund_basis: "=cancellation_refund_basis", cancellation_fee_usd: "=cancellation_fee_usd"}
        Collective Total Protection Concierge: {free_look_days: "=free_look_days", cancellation_refund_basis: "=cancellation_refund_basis", cancellation_fee_usd: "=cancellation_fee_usd"}
    measures: [insure_msr_claims_paid_this_season]

  - id: insure_term_end
    subject: [insure_expire, insure_resume, insure_close]
    rule: >
      A plan covers one season and ends with it. On the season's last day cover stops, whether the plan was
      in force, stopped for non-payment or carrying a settled claim, and the record is marked expired. A
      settled claim is closed off by returning the plan to force with the benefit reduced by what was paid,
      so a plan with an allowance of more than one claim may be claimed on again in the same season up to
      the benefit left. Expiry does not cancel what is still owed: premium instalments still to fall are
      presented after expiry exactly as before. A plan record is closed only when no premium is left to
      collect and no allowed claim is left to pay. Closing is the last write on the record and nothing is
      added to it afterwards; a household who wants cover for the next season takes a fresh plan over the
      holding they open for that season.
    eligibility:
      - id: plan_fully_settled
        applies_to: [insure_close]
        kind: authorization
        condition: "A plan record is closed only when no premium is left to collect and no allowed claim is left to pay."
        evidence_fields: [insure_holdings.protection_plan_id, insure_holdings.premium_balance_usd, insure_holdings.claim_decision]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [insure_holdings.protection_plan_id]
          action_bindings:
            insure_holdings.protection_plan_id: protection_plan_id
    params:
      per_tier:
        Season Pass Protection Basic: {season_end_date: "=season_end_date", claims_per_season: "=claims_per_season", season_benefit_cap_usd: "=season_benefit_cap_usd", settlement_days: "=settlement_days"}
        Season Pass Protection Plus: {season_end_date: "=season_end_date", claims_per_season: "=claims_per_season", season_benefit_cap_usd: "=season_benefit_cap_usd", settlement_days: "=settlement_days"}
        Season Pass Protection Premier: {season_end_date: "=season_end_date", claims_per_season: "=claims_per_season", season_benefit_cap_usd: "=season_benefit_cap_usd", settlement_days: "=settlement_days"}
        Collective Trip Protection Standard: {season_end_date: "=season_end_date", claims_per_season: "=claims_per_season", season_benefit_cap_usd: "=season_benefit_cap_usd", settlement_days: "=settlement_days"}
        Collective Trip Protection Elite: {season_end_date: "=season_end_date", claims_per_season: "=claims_per_season", season_benefit_cap_usd: "=season_benefit_cap_usd", settlement_days: "=settlement_days"}
        Collective Total Protection Concierge: {season_end_date: "=season_end_date", claims_per_season: "=claims_per_season", season_benefit_cap_usd: "=season_benefit_cap_usd", settlement_days: "=settlement_days"}
