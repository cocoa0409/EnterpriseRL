        Elite Performance Camp: {no_show_fee_pct: "=no_show_fee_pct", no_show_assessment_lag_days: "=no_show_assessment_lag_days", late_arrival_grace_minutes: "=late_arrival_grace_minutes", late_cancellation_fee_pct: "=late_cancellation_fee_pct", reschedule_fee_usd: "=reschedule_fee_usd", transfer_fee_usd: "=transfer_fee_usd", instructor_request_fee_usd: "=instructor_request_fee_usd"}

  - id: lessons_change_terms
    subject: [lessons_reschedule, lessons_assign_instructor, lessons_transfer]
    rule: >
      A booking may be moved to another date where the product allows it, up to the number of moves the
      product allows, and each move carries the product's move fee. A move to another date is accepted only
      when it is recorded on or before the move deadline, which is the product's notice period measured back
      from the moment the first session is due to start. The notice period is measured in whole elapsed
      hours on the mountain's local clock and is subtracted from the scheduled start of the first session to
      give the deadline; elapsed hours are never mixed with calendar days, and an hour begun is not an hour
      elapsed. A move does not reprice the booking: the tuition already raised stands even where the product
      costs more on the new date, and no difference is given back where it costs less. A booking may be
      re-registered to a different participant where the product allows it and the new participant meets the
      product's age range and ability level, against the product's re-registration fee. Instructors are
      assigned by the school and may change up to the morning of the session; where the household asked for
      a named instructor and the product allows the request, the request fee is raised and the collective
      makes good with credit if that instructor cannot teach the session after all.
    eligibility:
      - id: move_notice_deadline
        applies_to: [lessons_reschedule]
        kind: time
        condition: "A move to another date is accepted only when it is recorded on or before the move deadline, which is the product's notice period measured back from the moment the first session is due to start."
        evidence_fields: [lessons_holdings.lesson_id, lessons_holdings.first_session_date, lessons_holdings.session_time]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lessons_holdings.lesson_id]
          action_bindings:
            lessons_holdings.lesson_id: lesson_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the first session is due to start"
          anchor_source: lessons_holdings.first_session_date
          relation: not_after
          duration_source: variants.reschedule_notice_hours
          unit: elapsed_hours
          counting_rule: "The notice period is measured in whole elapsed hours on the mountain's local clock and is subtracted from the scheduled start of the first session to give the deadline; elapsed hours are never mixed with calendar days, and an hour begun is not an hour elapsed."
          boundary: inclusive
      - id: transferee_named
        applies_to: [lessons_transfer]
        kind: caller_fact
        condition: "A booking may be re-registered to a different participant where the product allows it and the new participant meets the product's age range and ability level, against the product's re-registration fee."
        evidence_fields: [lessons_holdings.lesson_id, lessons_holdings.participant_name, lessons_holdings.participant_age_band]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys:
            - [lessons_holdings.lesson_id]
          action_bindings:
            lessons_holdings.lesson_id: lesson_id
    params:
      per_tier:
