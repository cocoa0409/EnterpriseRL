category: lessons
display_name: Snowsports School

binding:
  holding_table: lessons_holdings
  event_tables: [lessons_ledger]
  intake_tables: [lessons_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields:
    sessions_remaining: session_credits
    tuition_balance_usd: tuition_balance
    lesson_credit_usd: lesson_credit

lifecycle:
  states: [requested, waitlisted, confirmed, in_progress, completed, cancelled, no_show, closed]
  transitions:
    - {from: requested, to: confirmed, by: agent, means: "A place in the product has been allocated to the participant and the booking is firm."}
    - {from: requested, to: waitlisted, by: agent, means: "No place is free on the date asked for and the participant is held in order of asking."}
    - {from: waitlisted, to: confirmed, by: agent, means: "A place has come free and the waiting participant takes it."}
    - {from: requested, to: cancelled, by: user, means: "The household gives up the request before a place was allocated."}
    - {from: waitlisted, to: cancelled, by: user, means: "The household gives up waiting for a place."}
    - {from: confirmed, to: in_progress, by: system, means: "The first session has been delivered and the booking is under way."}
    - {from: confirmed, to: cancelled, by: user, means: "The household cancels a firm booking before any session is delivered."}
    - {from: confirmed, to: no_show, by: system, means: "The participant did not present at the meeting point and the session ran without them."}
    - {from: in_progress, to: completed, by: system, means: "Every session the booking holds has been delivered."}
    - {from: in_progress, to: cancelled, by: user, means: "The household gives up the remaining sessions of a booking already under way."}
    - {from: completed, to: closed, by: system, means: "The booking has been delivered and settled, and the record is closed."}
    - {from: cancelled, to: closed, by: system, means: "The cancelled booking has been settled and the record is closed."}
    - {from: no_show, to: closed, by: system, means: "The missed booking has been settled and the record is closed."}

accounts:
  - key: session_credits
    unit: sessions
    meaning: "The number of instruction sessions the booking still holds for the participant; the whole block is loaded when the booking becomes firm and one is drawn each time a session is delivered."
  - key: tuition_balance
    unit: USD
    meaning: "The amount of tuition, add-ons and school fees still to be collected for this booking; it rises when a charge is raised against the booking and falls when a payment clears."
  - key: lesson_credit
    unit: USD
    meaning: "School credit held against this booking, issued when a booking is given up or a session is lost to the mountain, and spent when it is applied against a school charge."

parameter_schema:
  session_price_usd: "Price in USD of one session of this product for one participant at the standard rate."
  block_price_usd: "Price in USD of the whole block of sessions this product is sold as."
  session_duration_hours: "Length of one session in hours on the mountain's clock (number)."
  sessions_per_booking: "Number of instruction sessions one booking of this product holds (integer)."
  max_group_size: "Largest number of participants one instructor takes in this product (integer)."
  min_group_size: "Smallest number of participants at which this product still runs; below it the session is combined or given up (integer)."
  min_age_years: "Youngest age in whole years a participant may be booked into this product (integer)."
  max_age_years: "Oldest age in whole years a participant may be booked into this product (integer)."
  ability_levels_offered: "List of ability levels this product is taught at."
  disciplines_offered: "List of snowsports disciplines this product is taught in."
  languages_offered: "List of languages this product can be delivered in."
  mountains_offered: "List of the collective's mountains this product runs at."
  lift_ticket_included: "Whether a lift ticket for the session day is included in the price (true/false)."
  lift_ticket_addon_usd: "Price in USD of adding a lift ticket for the session day where it is not included."
  rental_included: "Whether equipment rental for the session day is included in the price (true/false)."
  rental_addon_usd: "Price in USD of adding equipment rental for the session day where it is not included."
  lunch_included: "Whether a supervised lunch is included in the price (true/false)."
  lunch_addon_usd: "Price in USD of adding a supervised lunch where it is not included."
  helmet_included: "Whether a helmet is issued with the product at no charge (true/false)."
  video_analysis_included: "Whether video analysis of the participant is included in the product (true/false)."
  instructor_request_allowed: "Whether the household may ask for a named instructor (true/false)."
  instructor_request_fee_usd: "Fee in USD for delivering the product with a named instructor the household asked for."
  instructor_level_minimum: "Minimum instructor certification level the collective assigns to this product (integer)."
  adaptive_certified_required: "Whether the assigned instructor must hold adaptive certification (true/false)."
  meeting_point: "Where participants in this product meet their instructor."
  session_start_time: "Scheduled start of a session of this product, on a 24-hour clock."
  late_arrival_grace_minutes: "Minutes after the scheduled start within which a late participant is still taken into the session (integer)."
  programme_weeks: "Number of consecutive weeks a multi-week product runs over (integer)."
  makeup_sessions_allowed: "Number of missed sessions that may be made up on another date over the life of the booking (integer)."
  makeup_booking_days: "Number of calendar days after a missed session within which a makeup session must be booked (integer)."
  advance_booking_days_min: "Fewest calendar days ahead of the session date a booking of this product is taken (integer)."
  advance_booking_days_max: "Most calendar days ahead of the session date a booking of this product is taken (integer)."
  booking_deposit_pct: "Percentage of the booking price taken as a deposit when the booking is made."
  balance_due_days: "Number of calendar days after the booking is recorded by which the balance falls due (integer)."
  free_cancellation_hours: "Whole hours before the scheduled start of the first session up to which a cancellation carries no fee (integer)."
  late_cancellation_fee_pct: "Percentage of the booking price retained when a cancellation is recorded after the free cancellation deadline."
  no_show_fee_pct: "Percentage of the booking price retained when the participant does not present for the session."
  no_show_assessment_lag_days: "Number of calendar days after the scheduled session before a missed session is charged (integer)."
  weather_cancellation_basis: "What the household receives when the collective cancels the session for weather or mountain conditions; one of full_credit, full_refund or partial_credit."
  reschedule_allowed: "Whether a booking of this product may be moved to another date (true/false)."
  reschedule_notice_hours: "Whole hours before the scheduled start of the first session by which a move to another date must be recorded (integer)."
  reschedule_fee_usd: "Fee in USD for moving a booking of this product to another date."
  max_reschedules: "Number of times one booking of this product may be moved to another date (integer)."
  lesson_transfer_allowed: "Whether a booking may be re-registered to a different participant (true/false)."
  transfer_fee_usd: "Fee in USD for re-registering a booking to a different participant."
  credit_validity_days: "Number of calendar days from issue within which school credit must be spent (integer)."
  credit_minimum_redemption_usd: "Smallest amount of school credit in USD that may be applied to a single charge."
  waitlist_offered: "Whether the collective holds participants in order of asking when this product is full (true/false)."
  waitlist_hold_hours: "Whole hours a waiting participant has to take a place that comes free before it passes on (integer)."
  passholder_discount_applies: "Whether a season passholder reduction is taken off this product (true/false)."
  multi_booking_discount_pct: "Percentage taken off when the household books this product for several participants at once."
  sibling_discount_pct: "Percentage taken off the second and each further child of one household booked into this product."
  season_pass_required: "Whether the participant must hold a season pass to be booked into this product (true/false)."
  payment_plan_offered: "Whether the price of this product may be collected in scheduled instalments (true/false)."
  refund_processing_days: "Number of business days within which a settled refund reaches the household's payment method (integer)."

