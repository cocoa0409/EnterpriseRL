measures:
  - id: lessons_msr_sessions_delivered
    window: "The life of the booking, from the date it was recorded through the handling date inclusive."
    measure: "Count of lessons_ledger rows of event_type lessons_session_deliver carrying this lesson_id."
  - id: lessons_msr_household_season_bookings
    window: "The season named in the booking's season_code."
    measure: "Count of lessons_holdings rows for this customer_id in that season whose status is requested, waitlisted, confirmed or in_progress."

policies:
  - id: lessons_agg_multi_holding
    subject: [lessons_book]
    rule: >
      A household account carries a separate school booking for every participant and every start date, so
      a family putting two children into a morning group and a parent into a private lesson holds three
      bookings, not one. The account may carry several live bookings at once up to the number this charter
      allows, counting bookings in the requested, waitlisted, confirmed and in_progress states; bookings
      that have reached completed, cancelled, no_show or closed no longer count. A further booking is
      refused once the account is already at that number, and the household is asked to let a live booking
      run through before adding another. Two bookings of the same product for the same participant on the
      same first session date are never opened; the second is treated as a duplicate of the first and the
      household is asked whether they meant a different date or a different participant.
    eligibility:
      - id: live_booking_count
        applies_to: [lessons_book]
        kind: dedup
        condition: "Two bookings of the same product for the same participant on the same first session date are never opened; the second is treated as a duplicate of the first and the household is asked whether they meant a different date or a different participant."
        evidence_fields: [lessons_holdings.customer_id, lessons_holdings.participant_name, lessons_holdings.first_session_date, lessons_holdings.variant_name, lessons_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lessons_holdings.customer_id, lessons_holdings.participant_name, lessons_holdings.first_session_date]
          action_bindings:
            lessons_holdings.customer_id: customer_id
            lessons_holdings.participant_name: participant_name
            lessons_holdings.first_session_date: first_session_date
        dedup_contract:
          table: lessons_holdings
          mode: separate_record
          object_bindings: {participant_name: participant_name, first_session_date: first_session_date}
          duplicate_filters: {status: [requested, waitlisted, confirmed, in_progress]}
          distinct_fields: [variant_name, mountain]
    params:
      max_per_customer: 8
    measures: [lessons_msr_household_season_bookings]

  - id: lessons_agg_household_group_pricing
    subject: [lessons_book, lessons_tuition_charge]
    rule: >
      Bookings made together by one household are priced as a group. Where the household books the same
      product for two or more participants starting on the same date, the multi-booking reduction for that
      product is taken off every one of those bookings. Where the participants are children of one
      household, the sibling reduction is taken off the second and each further child instead of the
      multi-booking reduction, whichever of the two is the larger; the two are never taken together. The
      season passholder reduction, where the product carries one, is taken first and the group reduction is
      worked out on the figure it leaves. Bookings made on different days are not grouped after the fact,
      because the group is judged at the moment the tuition is raised.
    eligibility: []
    params:
      group_minimum_participants: 2
      per_tier:
        All-Mountain Adult Group Lesson: {multi_booking_discount_pct: "=multi_booking_discount_pct", sibling_discount_pct: "=sibling_discount_pct", passholder_discount_applies: "=passholder_discount_applies"}
        Mountain Explorers Group Lesson: {multi_booking_discount_pct: "=multi_booking_discount_pct", sibling_discount_pct: "=sibling_discount_pct", passholder_discount_applies: "=passholder_discount_applies"}
        Mountain Cubs Group Lesson: {multi_booking_discount_pct: "=multi_booking_discount_pct", sibling_discount_pct: "=sibling_discount_pct", passholder_discount_applies: "=passholder_discount_applies"}
        Six-Week Development Programme: {multi_booking_discount_pct: "=multi_booking_discount_pct", sibling_discount_pct: "=sibling_discount_pct", passholder_discount_applies: "=passholder_discount_applies"}
        Semi-Private Coaching Session: {multi_booking_discount_pct: "=multi_booking_discount_pct", sibling_discount_pct: "=sibling_discount_pct", passholder_discount_applies: "=passholder_discount_applies"}
        Private Instruction Full Day: {multi_booking_discount_pct: "=multi_booking_discount_pct", sibling_discount_pct: "=sibling_discount_pct", passholder_discount_applies: "=passholder_discount_applies"}
        Elite Performance Camp: {multi_booking_discount_pct: "=multi_booking_discount_pct", sibling_discount_pct: "=sibling_discount_pct", passholder_discount_applies: "=passholder_discount_applies"}
    measures: [lessons_msr_household_season_bookings]

  - id: lessons_booking_terms
    subject: [lessons_book, lessons_waitlist, lessons_confirm]
    rule: >
      A booking is taken only inside the product's booking window, counted in calendar days between the day
      the booking is recorded and the date the first session is due to run, and only where the participant
      falls inside the product's age range and is booked at an ability level the product is taught at. A
      product that requires the participant to hold a season pass is booked only where the collective's pass
      records already show a pass registered to that participant standing in the active state. Where no
      place is free on the date asked for and the product carries a waiting list, the participant is held in
      order of asking; when a place comes free the household has the product's hold period to take it before
      it passes to the next household. A booking becomes firm when a place is allocated, and only then is
      the block of sessions loaded against the participant; a product that does not run because it is below
      its minimum group size is combined with another group at the same level or given up with the full
      amount returned as credit. A booking is taken only in a discipline the product is taught in, only
      at a mountain the product runs at, and only in a language the product is delivered in; where the
      household asks for a combination the product does not carry, the nearest product that does is
      offered instead, and a group already at the product's largest group size is closed to further
      bookings even where the date is still open.
    eligibility:
      - id: pass_required_for_product
        applies_to: [lessons_book]
        kind: authorization
        condition: "A product that requires the participant to hold a season pass is booked only where the collective's pass records already show a pass registered to that participant standing in the active state."
        evidence_fields: [passes_holdings.pass_id, passes_holdings.passholder_name, passes_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [passes_holdings.pass_id]
          action_bindings:
            passes_holdings.pass_id: pass_id
    params:
      per_tier:
        All-Mountain Adult Group Lesson: {advance_booking_days_min: "=advance_booking_days_min", advance_booking_days_max: "=advance_booking_days_max", min_age_years: "=min_age_years", max_age_years: "=max_age_years", ability_levels_offered: "=ability_levels_offered", waitlist_offered: "=waitlist_offered", waitlist_hold_hours: "=waitlist_hold_hours", min_group_size: "=min_group_size", max_group_size: "=max_group_size", season_pass_required: "=season_pass_required", disciplines_offered: "=disciplines_offered", languages_offered: "=languages_offered", mountains_offered: "=mountains_offered"}
        Mountain Explorers Group Lesson: {advance_booking_days_min: "=advance_booking_days_min", advance_booking_days_max: "=advance_booking_days_max", min_age_years: "=min_age_years", max_age_years: "=max_age_years", ability_levels_offered: "=ability_levels_offered", waitlist_offered: "=waitlist_offered", waitlist_hold_hours: "=waitlist_hold_hours", min_group_size: "=min_group_size", max_group_size: "=max_group_size", season_pass_required: "=season_pass_required", disciplines_offered: "=disciplines_offered", languages_offered: "=languages_offered", mountains_offered: "=mountains_offered"}
        Mountain Cubs Group Lesson: {advance_booking_days_min: "=advance_booking_days_min", advance_booking_days_max: "=advance_booking_days_max", min_age_years: "=min_age_years", max_age_years: "=max_age_years", ability_levels_offered: "=ability_levels_offered", waitlist_offered: "=waitlist_offered", waitlist_hold_hours: "=waitlist_hold_hours", min_group_size: "=min_group_size", max_group_size: "=max_group_size", season_pass_required: "=season_pass_required", disciplines_offered: "=disciplines_offered", languages_offered: "=languages_offered", mountains_offered: "=mountains_offered"}
        Six-Week Development Programme: {advance_booking_days_min: "=advance_booking_days_min", advance_booking_days_max: "=advance_booking_days_max", min_age_years: "=min_age_years", max_age_years: "=max_age_years", ability_levels_offered: "=ability_levels_offered", waitlist_offered: "=waitlist_offered", waitlist_hold_hours: "=waitlist_hold_hours", min_group_size: "=min_group_size", max_group_size: "=max_group_size", season_pass_required: "=season_pass_required", disciplines_offered: "=disciplines_offered", languages_offered: "=languages_offered", mountains_offered: "=mountains_offered"}
        Semi-Private Coaching Session: {advance_booking_days_min: "=advance_booking_days_min", advance_booking_days_max: "=advance_booking_days_max", min_age_years: "=min_age_years", max_age_years: "=max_age_years", ability_levels_offered: "=ability_levels_offered", waitlist_offered: "=waitlist_offered", waitlist_hold_hours: "=waitlist_hold_hours", min_group_size: "=min_group_size", max_group_size: "=max_group_size", season_pass_required: "=season_pass_required", disciplines_offered: "=disciplines_offered", languages_offered: "=languages_offered", mountains_offered: "=mountains_offered"}
        Private Instruction Full Day: {advance_booking_days_min: "=advance_booking_days_min", advance_booking_days_max: "=advance_booking_days_max", min_age_years: "=min_age_years", max_age_years: "=max_age_years", ability_levels_offered: "=ability_levels_offered", waitlist_offered: "=waitlist_offered", waitlist_hold_hours: "=waitlist_hold_hours", min_group_size: "=min_group_size", max_group_size: "=max_group_size", season_pass_required: "=season_pass_required", disciplines_offered: "=disciplines_offered", languages_offered: "=languages_offered", mountains_offered: "=mountains_offered"}
        Elite Performance Camp: {advance_booking_days_min: "=advance_booking_days_min", advance_booking_days_max: "=advance_booking_days_max", min_age_years: "=min_age_years", max_age_years: "=max_age_years", ability_levels_offered: "=ability_levels_offered", waitlist_offered: "=waitlist_offered", waitlist_hold_hours: "=waitlist_hold_hours", min_group_size: "=min_group_size", max_group_size: "=max_group_size", season_pass_required: "=season_pass_required", disciplines_offered: "=disciplines_offered", languages_offered: "=languages_offered", mountains_offered: "=mountains_offered"}

  - id: lessons_pricing
    subject: [lessons_tuition_charge, lessons_equipment_addon]
    rule: >
      The tuition raised for a booking is the product's block price where the product is sold as a block,
      and its session price multiplied by the number of sessions booked where it is sold session by session.
      The season passholder reduction is taken first where the product carries one and the participant is
      shown on the collective's records as holding a pass in the active state, then the group reduction, and
      the result is rounded to the cent. Add-ons the household asks for are raised as their own entries at
      the product's add-on prices, one entry for each kind of add-on and each session date, and an add-on
      already included in the product is never raised as a charge. Tuition is raised only while the booking
      record stands in the requested, waitlisted, confirmed or in_progress state. A product sold with a
      deposit raises the whole tuition at once and collects the deposit share of it at booking, with the
      balance falling due later; the deposit is not a separate price.
    eligibility:
      - id: chargeable_booking_state
        applies_to: [lessons_tuition_charge]
        kind: state
        condition: "Tuition is raised only while the booking record stands in the requested, waitlisted, confirmed or in_progress state."
        evidence_fields: [lessons_holdings.lesson_id, lessons_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lessons_holdings.lesson_id]
          action_bindings:
            lessons_holdings.lesson_id: lesson_id
        state_contract:
          field: lessons_holdings.status
          allowed: [requested, waitlisted, confirmed, in_progress]
    params:
      per_tier:
