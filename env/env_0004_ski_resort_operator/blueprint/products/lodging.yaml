        Slopeside Studio: {change_fee_usd: "=change_fee_usd", change_notice_days: "=change_notice_days", name_change_allowed: "=name_change_allowed", name_change_fee_usd: "=name_change_fee_usd", min_nights_standard: "=min_nights_standard", min_nights_peak: "=min_nights_peak", min_nights_holiday: "=min_nights_holiday"}
        Slopeside One-Bedroom Residence: {change_fee_usd: "=change_fee_usd", change_notice_days: "=change_notice_days", name_change_allowed: "=name_change_allowed", name_change_fee_usd: "=name_change_fee_usd", min_nights_standard: "=min_nights_standard", min_nights_peak: "=min_nights_peak", min_nights_holiday: "=min_nights_holiday"}
        Slopeside Two-Bedroom Residence: {change_fee_usd: "=change_fee_usd", change_notice_days: "=change_notice_days", name_change_allowed: "=name_change_allowed", name_change_fee_usd: "=name_change_fee_usd", min_nights_standard: "=min_nights_standard", min_nights_peak: "=min_nights_peak", min_nights_holiday: "=min_nights_holiday"}
