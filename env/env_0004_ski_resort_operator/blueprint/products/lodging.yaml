  - id: lodging_closure
    subject: [lodging_close]
    rule: >
      A reservation record is closed only when the folio shows nothing left to collect and no deposit left
      standing against it. Closing is the last write on the record and nothing is added to it afterwards; a
      household who finds a charge afterwards raises it with the finance team rather than at the desk. A
      cancelled reservation closes once whatever is retained has been taken and whatever comes back has been
      returned; an unclaimed reservation closes once the unclaimed nights have been taken. Lodging credit
      issued against a closed reservation keeps its own validity period and is spent against a later stay.
      The collective keeps the folio of a closed reservation for the household to ask for, but never reopens
      it to add a charge that was missed at the time.
    eligibility:
      - id: folio_fully_settled
        applies_to: [lodging_close]
        kind: authorization
        condition: "A reservation record is closed only when the folio shows nothing left to collect and no deposit left standing against it."
        evidence_fields: [lodging_holdings.lodging_id, lodging_holdings.folio_balance_usd, lodging_holdings.deposit_held_usd]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lodging_holdings.lodging_id]
          action_bindings:
            lodging_holdings.lodging_id: lodging_id
    params:
      per_tier:
        Base Village Inn Room: {credit_validity_days: "=credit_validity_days", damage_liability_cap_usd: "=damage_liability_cap_usd"}
        Slopeside Studio: {credit_validity_days: "=credit_validity_days", damage_liability_cap_usd: "=damage_liability_cap_usd"}
