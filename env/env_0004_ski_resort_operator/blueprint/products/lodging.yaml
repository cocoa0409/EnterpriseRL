  - id: lodging_checkout_settlement
    subject: [lodging_checkout, lodging_payment, lodging_deposit_apply]
    rule: >
      The folio is presented on departure and settled before the party leaves the mountain. The deposit
      already taken is applied against the folio first, then any lodging credit the household holds, and the
      remainder is taken from the payment method on file. A deposit is applied or returned only while the
      reservation stands in the checked_out, cancelled or no_show state. Where the deposit is larger than
      the folio, the difference goes back to the method it came from. The incidental hold is released no
      later than the unit type's release period counted in business days from the day the party departed.
      Business days are counted forward from the anchor date, the anchor date itself counting as day zero,
      only days the collective's finance office is open counting, which excludes Saturdays, Sundays and the
      collective's published holidays, and business days are never mixed with calendar days. Damage found
      after departure is charged against the hold up to the unit type's liability cap, and anything beyond
      the cap is a matter for the collective's insurers rather than for the desk.
    eligibility:
      - id: deposit_apply_state
        applies_to: [lodging_deposit_apply]
        kind: state
        condition: "A deposit is applied or returned only while the reservation stands in the checked_out, cancelled or no_show state."
        evidence_fields: [lodging_holdings.lodging_id, lodging_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lodging_holdings.lodging_id]
          action_bindings:
            lodging_holdings.lodging_id: lodging_id
        state_contract:
          field: lodging_holdings.status
          allowed: [checked_out, cancelled, no_show]
      - id: incidental_release_window
        applies_to: [lodging_deposit_apply]
        kind: time
        condition: "The incidental hold is released no later than the unit type's release period counted in business days from the day the party departed."
        evidence_fields: [lodging_holdings.lodging_id, lodging_holdings.checked_out_at, lodging_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lodging_holdings.lodging_id]
          action_bindings:
            lodging_holdings.lodging_id: lodging_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the party departed"
          anchor_source: lodging_holdings.checked_out_at
          relation: not_after
          duration_source: variants.incidental_release_days
          unit: business_days
          counting_rule: "Business days are counted forward from the anchor date, the anchor date itself counting as day zero, only days the collective's finance office is open counting, which excludes Saturdays, Sundays and the collective's published holidays, and business days are never mixed with calendar days."
          boundary: inclusive
    params:
      per_tier:
        Base Village Inn Room: {incidental_hold_usd: "=incidental_hold_usd", incidental_release_days: "=incidental_release_days", damage_liability_cap_usd: "=damage_liability_cap_usd", smoking_penalty_usd: "=smoking_penalty_usd", cleaning_fee_usd: "=cleaning_fee_usd"}
        Slopeside Studio: {incidental_hold_usd: "=incidental_hold_usd", incidental_release_days: "=incidental_release_days", damage_liability_cap_usd: "=damage_liability_cap_usd", smoking_penalty_usd: "=smoking_penalty_usd", cleaning_fee_usd: "=cleaning_fee_usd"}
        Slopeside One-Bedroom Residence: {incidental_hold_usd: "=incidental_hold_usd", incidental_release_days: "=incidental_release_days", damage_liability_cap_usd: "=damage_liability_cap_usd", smoking_penalty_usd: "=smoking_penalty_usd", cleaning_fee_usd: "=cleaning_fee_usd"}
        Slopeside Two-Bedroom Residence: {incidental_hold_usd: "=incidental_hold_usd", incidental_release_days: "=incidental_release_days", damage_liability_cap_usd: "=damage_liability_cap_usd", smoking_penalty_usd: "=smoking_penalty_usd", cleaning_fee_usd: "=cleaning_fee_usd"}
        Mountain Lodge Suite: {incidental_hold_usd: "=incidental_hold_usd", incidental_release_days: "=incidental_release_days", damage_liability_cap_usd: "=damage_liability_cap_usd", smoking_penalty_usd: "=smoking_penalty_usd", cleaning_fee_usd: "=cleaning_fee_usd"}
