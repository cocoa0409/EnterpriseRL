measures:
  - id: lodging_msr_nights_occupied
    window: "The life of the reservation, from the arrival date through the handling date inclusive."
    measure: "Count of lodging_folio rows of event_type lodging_night_consume carrying this lodging_id."
  - id: lodging_msr_household_season_stays
    window: "The season named in the reservation's season_code."
    measure: "Count of lodging_holdings rows for this customer_id in that season whose status is held, deposit_pending, confirmed or checked_in."

policies:
  - id: lodging_agg_multi_holding
    subject: [lodging_book]
    rule: >
      A household account carries a separate reservation for every unit it takes, so a family booking two
      residences side by side holds two reservations with two folios and two deposits. The account may carry
      several live reservations at once up to the number this charter allows, counting reservations in the
      held, deposit_pending, confirmed and checked_in states. Once the account reaches a unit type's group
      block threshold for one set of dates, the reservations are handled as a group block by the group sales
      desk rather than added one by one at the service desk. Two live reservations of the same unit type for
      the same lead guest over the same arrival date are never opened; the second is treated as a duplicate
      of the first and the household is asked whether they meant a second unit for a different lead guest.
    eligibility:
      - id: duplicate_reservation
        applies_to: [lodging_book]
        kind: dedup
        condition: "Two live reservations of the same unit type for the same lead guest over the same arrival date are never opened; the second is treated as a duplicate of the first and the household is asked whether they meant a second unit for a different lead guest."
        evidence_fields: [lodging_holdings.customer_id, lodging_holdings.lead_guest_name, lodging_holdings.arrival_date, lodging_holdings.variant_name, lodging_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lodging_holdings.customer_id, lodging_holdings.lead_guest_name, lodging_holdings.arrival_date]
          action_bindings:
            lodging_holdings.customer_id: customer_id
            lodging_holdings.lead_guest_name: lead_guest_name
            lodging_holdings.arrival_date: arrival_date
        dedup_contract:
          table: lodging_holdings
          mode: separate_record
          object_bindings: {lead_guest_name: lead_guest_name, arrival_date: arrival_date}
          duplicate_filters: {status: [held, deposit_pending, confirmed, checked_in]}
          distinct_fields: [variant_name, mountain, unit_number]
    params:
      max_per_customer: 5
    measures: [lodging_msr_household_season_stays]

  - id: lodging_agg_household_stay_pricing
    subject: [lodging_book, lodging_room_charge]
    rule: >
      Reductions on the room rate are worked out in a fixed order and the result is frozen on the
      reservation. The season passholder reduction is taken first, on the evidence of a pass held by the
      household standing in the active state on the arrival date. The advance booking reduction is taken
      next where the reservation was recorded at least the unit type's advance period before arrival. The
      length-of-stay reduction is taken last where the stay reaches the unit type's threshold in nights.
      Where several reservations on one household account share a set of dates, each is priced on its own
      and the nights are not pooled to reach a length-of-stay threshold. A reduction given at booking is not
      taken away when a later change makes the stay shorter, but a change that lengthens the stay is priced
      on the reductions that apply at the moment of the change.
    eligibility: []
    params:
      per_tier:
        Base Village Inn Room: {passholder_discount_pct: "=passholder_discount_pct", advance_booking_discount_pct: "=advance_booking_discount_pct", advance_booking_days_min: "=advance_booking_days_min", length_of_stay_discount_pct: "=length_of_stay_discount_pct", length_of_stay_threshold_nights: "=length_of_stay_threshold_nights", group_block_minimum_units: "=group_block_minimum_units"}
        Slopeside Studio: {passholder_discount_pct: "=passholder_discount_pct", advance_booking_discount_pct: "=advance_booking_discount_pct", advance_booking_days_min: "=advance_booking_days_min", length_of_stay_discount_pct: "=length_of_stay_discount_pct", length_of_stay_threshold_nights: "=length_of_stay_threshold_nights", group_block_minimum_units: "=group_block_minimum_units"}
        Slopeside One-Bedroom Residence: {passholder_discount_pct: "=passholder_discount_pct", advance_booking_discount_pct: "=advance_booking_discount_pct", advance_booking_days_min: "=advance_booking_days_min", length_of_stay_discount_pct: "=length_of_stay_discount_pct", length_of_stay_threshold_nights: "=length_of_stay_threshold_nights", group_block_minimum_units: "=group_block_minimum_units"}
        Slopeside Two-Bedroom Residence: {passholder_discount_pct: "=passholder_discount_pct", advance_booking_discount_pct: "=advance_booking_discount_pct", advance_booking_days_min: "=advance_booking_days_min", length_of_stay_discount_pct: "=length_of_stay_discount_pct", length_of_stay_threshold_nights: "=length_of_stay_threshold_nights", group_block_minimum_units: "=group_block_minimum_units"}
        Mountain Lodge Suite: {passholder_discount_pct: "=passholder_discount_pct", advance_booking_discount_pct: "=advance_booking_discount_pct", advance_booking_days_min: "=advance_booking_days_min", length_of_stay_discount_pct: "=length_of_stay_discount_pct", length_of_stay_threshold_nights: "=length_of_stay_threshold_nights", group_block_minimum_units: "=group_block_minimum_units"}
        Summit Penthouse Residence: {passholder_discount_pct: "=passholder_discount_pct", advance_booking_discount_pct: "=advance_booking_discount_pct", advance_booking_days_min: "=advance_booking_days_min", length_of_stay_discount_pct: "=length_of_stay_discount_pct", length_of_stay_threshold_nights: "=length_of_stay_threshold_nights", group_block_minimum_units: "=group_block_minimum_units"}
        Private Mountain Chalet: {passholder_discount_pct: "=passholder_discount_pct", advance_booking_discount_pct: "=advance_booking_discount_pct", advance_booking_days_min: "=advance_booking_days_min", length_of_stay_discount_pct: "=length_of_stay_discount_pct", length_of_stay_threshold_nights: "=length_of_stay_threshold_nights", group_block_minimum_units: "=group_block_minimum_units"}
    measures: [lodging_msr_household_season_stays]

  - id: lodging_booking_terms
    subject: [lodging_book, lodging_hold_deposit, lodging_assign_unit]
    rule: >
      A reservation is taken for a stated unit type over stated dates at a mountain the unit type exists at.
      The number of nights must reach the minimum the unit type carries for the rate window the arrival date
      falls in, and must not exceed its longest stay; a stay that straddles two windows must reach the
      higher of the two minimums. The party must fit the unit type's maximum occupancy counting adults and
      children alike, and infants under two are not counted. A unit is put on hold as soon as the
      reservation is taken, and the hold stands only until the deposit due date. Units are assigned by the
      front desk and may change up to the morning of arrival; a household may state a preference for a
      building or a floor but the collective never guarantees a particular unit number before arrival.
      Dogs are taken only in unit types that accept them, and a party arriving with a dog at a unit type
      that does not is moved at the collective's cost where a unit is free and handled by the duty manager
      where none is. A party is matched to the unit type by what the unit actually holds, so the
      bedrooms, the bathrooms and the cooking facilities are read off the unit type rather than promised
      at the desk, and a household that needs a full kitchen or a second bathroom is booked into a unit
      type that has one rather than told a smaller unit will do.
    eligibility: []
    params:
      per_tier:
        Base Village Inn Room: {min_nights_standard: "=min_nights_standard", min_nights_peak: "=min_nights_peak", min_nights_holiday: "=min_nights_holiday", max_nights: "=max_nights", standard_occupancy: "=standard_occupancy", max_occupancy: "=max_occupancy", bedrooms: "=bedrooms", bathrooms: "=bathrooms", kitchen_type: "=kitchen_type", mountains_offered: "=mountains_offered", pet_allowed: "=pet_allowed", pet_fee_nightly_usd: "=pet_fee_nightly_usd", parking_spaces_included: "=parking_spaces_included"}
        Slopeside Studio: {min_nights_standard: "=min_nights_standard", min_nights_peak: "=min_nights_peak", min_nights_holiday: "=min_nights_holiday", max_nights: "=max_nights", standard_occupancy: "=standard_occupancy", max_occupancy: "=max_occupancy", bedrooms: "=bedrooms", bathrooms: "=bathrooms", kitchen_type: "=kitchen_type", mountains_offered: "=mountains_offered", pet_allowed: "=pet_allowed", pet_fee_nightly_usd: "=pet_fee_nightly_usd", parking_spaces_included: "=parking_spaces_included"}
        Slopeside One-Bedroom Residence: {min_nights_standard: "=min_nights_standard", min_nights_peak: "=min_nights_peak", min_nights_holiday: "=min_nights_holiday", max_nights: "=max_nights", standard_occupancy: "=standard_occupancy", max_occupancy: "=max_occupancy", bedrooms: "=bedrooms", bathrooms: "=bathrooms", kitchen_type: "=kitchen_type", mountains_offered: "=mountains_offered", pet_allowed: "=pet_allowed", pet_fee_nightly_usd: "=pet_fee_nightly_usd", parking_spaces_included: "=parking_spaces_included"}
        Slopeside Two-Bedroom Residence: {min_nights_standard: "=min_nights_standard", min_nights_peak: "=min_nights_peak", min_nights_holiday: "=min_nights_holiday", max_nights: "=max_nights", standard_occupancy: "=standard_occupancy", max_occupancy: "=max_occupancy", bedrooms: "=bedrooms", bathrooms: "=bathrooms", kitchen_type: "=kitchen_type", mountains_offered: "=mountains_offered", pet_allowed: "=pet_allowed", pet_fee_nightly_usd: "=pet_fee_nightly_usd", parking_spaces_included: "=parking_spaces_included"}
        Mountain Lodge Suite: {min_nights_standard: "=min_nights_standard", min_nights_peak: "=min_nights_peak", min_nights_holiday: "=min_nights_holiday", max_nights: "=max_nights", standard_occupancy: "=standard_occupancy", max_occupancy: "=max_occupancy", bedrooms: "=bedrooms", bathrooms: "=bathrooms", kitchen_type: "=kitchen_type", mountains_offered: "=mountains_offered", pet_allowed: "=pet_allowed", pet_fee_nightly_usd: "=pet_fee_nightly_usd", parking_spaces_included: "=parking_spaces_included"}
        Summit Penthouse Residence: {min_nights_standard: "=min_nights_standard", min_nights_peak: "=min_nights_peak", min_nights_holiday: "=min_nights_holiday", max_nights: "=max_nights", standard_occupancy: "=standard_occupancy", max_occupancy: "=max_occupancy", bedrooms: "=bedrooms", bathrooms: "=bathrooms", kitchen_type: "=kitchen_type", mountains_offered: "=mountains_offered", pet_allowed: "=pet_allowed", pet_fee_nightly_usd: "=pet_fee_nightly_usd", parking_spaces_included: "=parking_spaces_included"}
        Private Mountain Chalet: {min_nights_standard: "=min_nights_standard", min_nights_peak: "=min_nights_peak", min_nights_holiday: "=min_nights_holiday", max_nights: "=max_nights", standard_occupancy: "=standard_occupancy", max_occupancy: "=max_occupancy", bedrooms: "=bedrooms", bathrooms: "=bathrooms", kitchen_type: "=kitchen_type", mountains_offered: "=mountains_offered", pet_allowed: "=pet_allowed", pet_fee_nightly_usd: "=pet_fee_nightly_usd", parking_spaces_included: "=parking_spaces_included"}

  - id: lodging_deposit_terms
    subject: [lodging_deposit_charge, lodging_confirm]
    rule: >
      A reservation becomes firm only once the deposit has cleared. The deposit is the unit type's share of
      the room rate for the whole stay, worked out on the rate after every reduction and rounded to the
      cent. The deposit is taken no later than the unit type's deposit period counted in calendar days from
      the day the unit was put on hold. Calendar days are counted forward from the anchor date, the anchor
