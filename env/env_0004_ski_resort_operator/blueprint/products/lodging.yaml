    meaning: "The deposit standing against a reservation is applied to the folio or returned to the household."
    grain: "One row per application or return of a deposit on one reservation."
    distinguish_by: [event_date, amount_usd, deposit_status]
    fields:
      folio_event_id: "Reference number of this folio entry."
      lodging_id: "The reservation this entry belongs to."
      customer_id: "The household account this entry belongs to."
      event_type: "The kind of folio entry this row records."
      related_event_id: "The deposit entry this application answers to."
      event_date: "Date the deposit was applied or returned."
      amount_usd: "Amount applied or returned."
      deposit_status: "Where the deposit stands after this entry."
      payment_method: "Where the money went."
    account: deposit_balance
    direction: out
    triggers: []

  - type: lodging_nights_load
    target: lodging_folio
    meaning: "The block of nights a firm reservation holds is loaded against the party."
    grain: "One row per loading of a block of nights onto one reservation."
    distinguish_by: [event_date, quantity, season_code]
    fields:
      folio_event_id: "Reference number of this folio entry."
      lodging_id: "The reservation this entry belongs to."
