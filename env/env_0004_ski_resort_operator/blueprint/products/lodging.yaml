events:
  - type: lodging_book
    target: lodging_holdings
    mutation: create
    meaning: "A household asks for a unit of a stated type over stated dates and the reservation record is opened with the unit on hold."
    grain: "One row per reservation of one unit type over one set of dates for one party."
    fields:
      lodging_id: "Reference number of the lodging reservation."
      customer_id: "The household account the reservation is made on."
      variant_name: "The unit type reserved, written as its official full name."
      status: "Lifecycle state of the reservation, pinned to the held state when it is opened."
      season_code: "The season the stay falls in."
      lead_guest_name: "Name of the lead guest the unit is reserved for, exactly as the household states it."
      mountain: "Mountain the unit stands at."
      arrival_date: "Date the party is due to arrive."
      departure_date: "Date the party is due to leave."
      nights_booked: "Number of nights the reservation covers."
      adults: "Number of adults in the party."
      children: "Number of children in the party."
      pets: "Number of dogs travelling with the party."
      parking_spaces: "Number of parking spaces the party asks for."
      booked_date: "Date the reservation was recorded."
      rate_plan: "Which published rate window the stay is priced on."
    triggers:
      - event: lodging:lodging_room_charge
        map: {lodging_id: lodging_id, customer_id: customer_id, charge_category: room_rate}

  - type: lodging_hold_deposit
    target: lodging_holdings
    mutation: {transition: {from: held, to: deposit_pending}}
    meaning: "A unit is put on hold for the dates and the deposit is asked for."
    grain: "One row per reservation; the hold is recorded on the reservation itself."
    fields:
      status: "Lifecycle state of the reservation, moved to the state in which it waits for the deposit."
      deposit_due_date: "Date by which the deposit must clear for the hold to stand."
    triggers:
      - event: lodging:lodging_deposit_charge
        map: {lodging_id: lodging_id, customer_id: customer_id, charge_category: deposit}

  - type: lodging_confirm
    target: lodging_holdings
    mutation: {transition: {from: deposit_pending, to: confirmed}}
    meaning: "The deposit has cleared and the reservation is firm."
    grain: "One row per reservation; the confirmation is recorded on the reservation itself."
    fields:
      status: "Lifecycle state of the reservation, moved to the firm state."
      nights_remaining: "Nights the reservation still holds for the party."
    triggers:
      - event: lodging:lodging_nights_load
        map: {lodging_id: lodging_id, customer_id: customer_id}

  - type: lodging_modify
    target: lodging_holdings
    mutation: update
    meaning: "The household changes the dates, the unit type or the size of the party on a reservation already made."
    grain: "One row per reservation; the change rewrites the stay on the reservation itself."
    fields:
      arrival_date: "The date the party is now due to arrive."
      departure_date: "The date the party is now due to leave."
      nights_booked: "Number of nights the reservation now covers."
      adults: "Number of adults now in the party."
      children: "Number of children now in the party."
      variant_name: "The unit type the reservation now holds."
      rate_plan: "The published rate window the changed stay is priced on."
    triggers:
      - event: lodging:lodging_fee_charge
        map: {lodging_id: lodging_id, customer_id: customer_id, charge_category: change_fee}

  - type: lodging_assign_unit
    target: lodging_holdings
    mutation: update
    meaning: "A particular unit is put against the reservation and the household is told which one they have."
    grain: "One row per reservation; the assignment rewrites the unit on the reservation itself."
    fields:
      unit_number: "Number of the unit the party will occupy."
      building_name: "Building the unit stands in."
    triggers: []

  - type: lodging_checkin
    target: lodging_holdings
    mutation: {transition: {from: confirmed, to: checked_in}}
    meaning: "The party arrives, keys are issued, the incidental hold is taken and the stay begins."
    grain: "One row per reservation; arrival is recorded on the reservation itself."
    fields:
      status: "Lifecycle state of the reservation, moved to the occupied state."
      checked_in_at: "Moment the keys were issued."
      unit_number: "Number of the unit the party actually occupies."
    triggers:
      - event: lodging:lodging_resort_fee
        map: {lodging_id: lodging_id, customer_id: customer_id, charge_category: resort_fee}

  - type: lodging_checkout
    target: lodging_holdings
    mutation: {transition: {from: checked_in, to: checked_out}}
    meaning: "The party leaves, the unit is released back to housekeeping and the folio is presented."
    grain: "One row per reservation; departure is recorded on the reservation itself."
    fields:
      status: "Lifecycle state of the reservation, moved to the departed state."
      checked_out_at: "Moment the unit was released."
    triggers:
      - event: lodging:lodging_deposit_apply
        map: {lodging_id: lodging_id, customer_id: customer_id, deposit_status: applied}

  - type: lodging_cancel
    target: lodging_holdings
    mutation:
      transition:
        - {from: held, to: cancelled}
        - {from: deposit_pending, to: cancelled}
        - {from: confirmed, to: cancelled}
    meaning: "The household gives the reservation up before arrival."
    grain: "One row per reservation; the cancellation is recorded on the reservation itself."
    fields:
      status: "Lifecycle state of the reservation, moved to the cancelled state."
      cancellation_reason: "Why the reservation was given up."
    triggers:
      - event: lodging:lodging_fee_charge
        when: {cancellation_reason: [guest_request, no_reason_given]}
        map: {lodging_id: lodging_id, customer_id: customer_id, charge_category: cancellation_fee}

  - type: lodging_no_show
    target: lodging_holdings
    mutation: {transition: {from: confirmed, to: no_show}}
    meaning: "The party never arrived and the unit was held empty for the first night."
    grain: "One row per reservation; the unclaimed night is recorded on the reservation itself."
