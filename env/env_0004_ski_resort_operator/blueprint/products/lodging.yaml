        map: {lodging_id: lodging_id, customer_id: customer_id, charge_category: no_show_fee}

  - type: lodging_close
    target: lodging_holdings
    mutation:
      transition:
        - {from: checked_out, to: closed}
        - {from: cancelled, to: closed}
        - {from: no_show, to: closed}
    meaning: "The folio has been settled, the incidental hold dealt with, and the reservation is closed for good."
    grain: "One row per reservation; closure is recorded on the reservation itself."
    fields:
      status: "Lifecycle state of the reservation, moved to the closed state."
      folio_balance_usd: "Amount still to be collected on the folio, which stands at zero once the reservation is closed."
    triggers: []

  - type: lodging_deposit_charge
    target: lodging_folio
    meaning: "The deposit for a reservation is taken from the household's payment method."
    grain: "One row per deposit taken on one reservation."
    distinguish_by: [event_date, amount_usd, deposit_status]
    fields:
      folio_event_id: "Reference number of this folio entry."
      lodging_id: "The reservation this entry belongs to."
      customer_id: "The household account this entry belongs to."
      event_type: "The kind of folio entry this row records."
      event_date: "Date the deposit was taken."
      amount_usd: "Amount of the deposit."
      charge_category: "What the amount is for."
      deposit_status: "Where the deposit stands after this entry."
      payment_method: "How the deposit was taken."
    account: deposit_balance
    direction: in
    triggers: []

