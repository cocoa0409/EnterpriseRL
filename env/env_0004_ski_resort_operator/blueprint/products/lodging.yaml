  - id: lodging_modification
    subject: [lodging_modify, lodging_assign_unit, lodging_fee_charge]
    rule: >
      A firm reservation may be changed in its dates, its unit type or the size of its party. A change is
      accepted only when it is recorded on or before the unit type's change deadline, which is its change
      notice period counted back in calendar days from the arrival date. Calendar days are counted back from
      the arrival date, the arrival date itself counting as day zero, every day of the week counting alike,
      and a calendar day is never mixed with a full 24-hour period; the deadline is the day the count lands
      on, and where that day does not exist in the target month the last day of that month is used. Each
      change carries the unit type's change fee, whatever the direction of the change. Nights added to a
      stay are priced on the rate window each new night falls in at the rate published on the day of the
      change, and nights taken off are credited at the rate they were booked at. A change that takes the
      stay below the minimum nights of the window it now falls in is refused, and the household is offered
      a cancellation instead. A reservation may be re-registered to a different lead guest where the unit
      type allows it, against the unit type's re-registration fee. A fee is posted to a folio only while the
      reservation stands in the deposit_pending, confirmed, checked_in, checked_out, cancelled or no_show
      state.
    eligibility:
      - id: change_notice_deadline
        applies_to: [lodging_modify]
        kind: time
        condition: "A change is accepted only when it is recorded on or before the unit type's change deadline, which is its change notice period counted back in calendar days from the arrival date."
        evidence_fields: [lodging_holdings.lodging_id, lodging_holdings.arrival_date, lodging_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lodging_holdings.lodging_id]
          action_bindings:
            lodging_holdings.lodging_id: lodging_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the arrival date"
          anchor_source: lodging_holdings.arrival_date
          relation: not_after
          duration_source: variants.change_notice_days
          unit: calendar_days
          counting_rule: "Calendar days are counted back from the arrival date, the arrival date itself counting as day zero, every day of the week counting alike, and a calendar day is never mixed with a full 24-hour period; the deadline is the day the count lands on, and where that day does not exist in the target month the last day of that month is used."
          boundary: inclusive
      - id: fee_bearing_reservation_state
        applies_to: [lodging_fee_charge]
        kind: state
        condition: "A fee is posted to a folio only while the reservation stands in the deposit_pending, confirmed, checked_in, checked_out, cancelled or no_show state."
        evidence_fields: [lodging_holdings.lodging_id, lodging_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lodging_holdings.lodging_id]
          action_bindings:
            lodging_holdings.lodging_id: lodging_id
        state_contract:
          field: lodging_holdings.status
          allowed: [deposit_pending, confirmed, checked_in, checked_out, cancelled, no_show]
    params:
      per_tier:
