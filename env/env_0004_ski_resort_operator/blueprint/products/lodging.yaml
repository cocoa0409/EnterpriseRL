        Slopeside Two-Bedroom Residence: {base_nightly_rate_usd: "=base_nightly_rate_usd", peak_nightly_rate_usd: "=peak_nightly_rate_usd", holiday_nightly_rate_usd: "=holiday_nightly_rate_usd", holiday_window_start: "=holiday_window_start", holiday_window_end: "=holiday_window_end", peak_window_start: "=peak_window_start", peak_window_end: "=peak_window_end", extra_person_nightly_usd: "=extra_person_nightly_usd", resort_fee_nightly_usd: "=resort_fee_nightly_usd", cleaning_fee_usd: "=cleaning_fee_usd", parking_nightly_usd: "=parking_nightly_usd", ski_valet_nightly_usd: "=ski_valet_nightly_usd"}
