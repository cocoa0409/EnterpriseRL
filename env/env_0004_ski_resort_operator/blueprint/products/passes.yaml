  - id: passes_buddy_programme
    subject: [passes_buddy_redeem]
    rule: >
      Each tier loads a buddy lift ticket allotment onto the pass at activation, and the holder buys
      those tickets at the tier's buddy price for guests skiing with them. A buddy ticket is drawn from
      the allotment on the day it is bought and is valid on that date at the mountain named on it; it is
      not dated forward and it is not refundable once the guest has been admitted on it. The tier's
      blackout dates apply to buddy tickets exactly as they apply to the pass itself, so a tier closed
      on a date cannot buy a buddy ticket for that date either. Once the allotment is used, further
      guest tickets are sold at the window price less the tier's friends and family reduction, and that
      reduction is taken instead of the buddy price rather than on top of it. The allotment belongs to
      the pass and not to the household, so allotments on two passes in one household are not pooled and
      an unused allotment does not pass to another pass or another season.
    eligibility: []
    params:
      per_tier:
        Granite Ridge Four-Day Flex Pass: {buddy_ticket_allotment: "=buddy_ticket_allotment", buddy_ticket_price_usd: "=buddy_ticket_price_usd", friends_family_ticket_discount_pct: "=friends_family_ticket_discount_pct"}
        Granite Ridge Midweek Pass: {buddy_ticket_allotment: "=buddy_ticket_allotment", buddy_ticket_price_usd: "=buddy_ticket_price_usd", friends_family_ticket_discount_pct: "=friends_family_ticket_discount_pct"}
        Granite Ridge Local Pass: {buddy_ticket_allotment: "=buddy_ticket_allotment", buddy_ticket_price_usd: "=buddy_ticket_price_usd", friends_family_ticket_discount_pct: "=friends_family_ticket_discount_pct"}
        Granite Ridge Summit Pass: {buddy_ticket_allotment: "=buddy_ticket_allotment", buddy_ticket_price_usd: "=buddy_ticket_price_usd", friends_family_ticket_discount_pct: "=friends_family_ticket_discount_pct"}
        Granite Ridge Summit Plus Pass: {buddy_ticket_allotment: "=buddy_ticket_allotment", buddy_ticket_price_usd: "=buddy_ticket_price_usd", friends_family_ticket_discount_pct: "=friends_family_ticket_discount_pct"}
        Granite Ridge Collective Unlimited Pass: {buddy_ticket_allotment: "=buddy_ticket_allotment", buddy_ticket_price_usd: "=buddy_ticket_price_usd", friends_family_ticket_discount_pct: "=friends_family_ticket_discount_pct"}
        Granite Ridge Collective Elite Pass: {buddy_ticket_allotment: "=buddy_ticket_allotment", buddy_ticket_price_usd: "=buddy_ticket_price_usd", friends_family_ticket_discount_pct: "=friends_family_ticket_discount_pct"}

  - id: passes_transfer_and_media
    subject: [passes_transfer, passes_fee_charge]
    rule: >
      A season pass belongs to the person it is registered to, and only the tiers that allow it may be
      re-registered to someone else. A pass is re-registered only to a person the account holder names
      in full, and the name given is recorded exactly as stated. Re-registration places the tier's
      transfer fee on the pass account, cancels the old media and issues fresh media, and it does not
      change the tier, the price already committed to or the instalment schedule. A tier that does not
      allow re-registration is not re-registered for any reason, and lending a pass to another person is
      grounds for the media being confiscated at the lift. Lost, stolen or broken media is replaced at
      the tier's replacement fee, which is placed on the pass account in the same way. A fee is placed
      on a pass account only while the pass record has not yet reached the expired or closed state.
      After that point a charge belongs to the following season's record or to the finance team. Where
      media fails through a fault of the media itself rather than the holder, the replacement is issued
      at no charge, and that judgement is made at the ticket office when the media is handed in.
    eligibility:
      - id: named_transferee
        applies_to: [passes_transfer]
        kind: caller_fact
        condition: "A pass is re-registered only to a person the account holder names in full, and the name given is recorded exactly as stated."
        evidence_fields: [passes_holdings.pass_id, passes_holdings.passholder_name]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys:
            - [passes_holdings.pass_id]
          action_bindings:
            passes_holdings.pass_id: pass_id
      - id: fee_bearing_record_state
        applies_to: [passes_fee_charge]
        kind: state
        condition: "A fee is placed on a pass account only while the pass record has not yet reached the expired or closed state."
        evidence_fields: [passes_holdings.pass_id, passes_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [passes_holdings.pass_id]
          action_bindings:
            passes_holdings.pass_id: pass_id
        state_contract:
          field: passes_holdings.status
          allowed: [applied, pending_activation, active, suspended, deferred, cancelled]
    params:
      per_tier:
        Granite Ridge Four-Day Flex Pass: {pass_transfer_allowed: "=pass_transfer_allowed", transfer_fee_usd: "=transfer_fee_usd", replacement_media_fee_usd: "=replacement_media_fee_usd"}
        Granite Ridge Midweek Pass: {pass_transfer_allowed: "=pass_transfer_allowed", transfer_fee_usd: "=transfer_fee_usd", replacement_media_fee_usd: "=replacement_media_fee_usd"}
        Granite Ridge Local Pass: {pass_transfer_allowed: "=pass_transfer_allowed", transfer_fee_usd: "=transfer_fee_usd", replacement_media_fee_usd: "=replacement_media_fee_usd"}
        Granite Ridge Summit Pass: {pass_transfer_allowed: "=pass_transfer_allowed", transfer_fee_usd: "=transfer_fee_usd", replacement_media_fee_usd: "=replacement_media_fee_usd"}
        Granite Ridge Summit Plus Pass: {pass_transfer_allowed: "=pass_transfer_allowed", transfer_fee_usd: "=transfer_fee_usd", replacement_media_fee_usd: "=replacement_media_fee_usd"}
        Granite Ridge Collective Unlimited Pass: {pass_transfer_allowed: "=pass_transfer_allowed", transfer_fee_usd: "=transfer_fee_usd", replacement_media_fee_usd: "=replacement_media_fee_usd"}
        Granite Ridge Collective Elite Pass: {pass_transfer_allowed: "=pass_transfer_allowed", transfer_fee_usd: "=transfer_fee_usd", replacement_media_fee_usd: "=replacement_media_fee_usd"}

  - id: passes_season_closure
    subject: [passes_expire, passes_close]
    rule: >
      Every pass record reaches the end of the season it was sold for. On the season's last operating
      day the pass stops admitting the holder and the record is marked expired, whether it was scanning
      freely or standing suspended; a pass carried forward that was never used in the season it was
      carried to expires in the same way. Expiry does not cancel what is still owed: the instalment
      schedule runs to its end after expiry, and resort credit on the record keeps its own validity
      period. A pass record is closed only when the pass account shows nothing left to collect and no
      credit left to spend. Closure is the last write on the record and nothing is added to it
      afterwards. Where the tier carries next season's price lock, holding the pass to expiry entitles
      the passholder to the same price for the following season, claimed by opening a fresh pass record
      for that season rather than by reopening this one.
    eligibility:
      - id: nothing_outstanding
        applies_to: [passes_close]
        kind: authorization
        condition: "A pass record is closed only when the pass account shows nothing left to collect and no credit left to spend."
        evidence_fields: [passes_holdings.pass_id, passes_holdings.installment_balance_usd, passes_holdings.pass_credit_usd]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [passes_holdings.pass_id]
          action_bindings:
            passes_holdings.pass_id: pass_id
    params:
      per_tier:
        Granite Ridge Four-Day Flex Pass: {season_end_date: "=season_end_date", price_lock_next_season: "=price_lock_next_season", operating_days_included: "=operating_days_included"}
        Granite Ridge Midweek Pass: {season_end_date: "=season_end_date", price_lock_next_season: "=price_lock_next_season", operating_days_included: "=operating_days_included"}
        Granite Ridge Local Pass: {season_end_date: "=season_end_date", price_lock_next_season: "=price_lock_next_season", operating_days_included: "=operating_days_included"}
        Granite Ridge Summit Pass: {season_end_date: "=season_end_date", price_lock_next_season: "=price_lock_next_season", operating_days_included: "=operating_days_included"}
        Granite Ridge Summit Plus Pass: {season_end_date: "=season_end_date", price_lock_next_season: "=price_lock_next_season", operating_days_included: "=operating_days_included"}
        Granite Ridge Collective Unlimited Pass: {season_end_date: "=season_end_date", price_lock_next_season: "=price_lock_next_season", operating_days_included: "=operating_days_included"}
