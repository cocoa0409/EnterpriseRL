measures:
  - id: passes_msr_season_scan_days
    window: "The season named in the pass record's season_code, from its season_start_date through the handling date inclusive."
    measure: "Count of distinct event_date values across passes_ledger rows of event_type passes_scan carrying this pass_id."
  - id: passes_msr_declines_rolling_90d
    window: "The 90 calendar days ending on the handling date inclusive, rolling."
    measure: "Count of passes_ledger rows of event_type passes_installment_decline carrying this pass_id."
  - id: passes_msr_household_season_passes
    window: "The season named in the season_code being priced."
    measure: "Count of passes_holdings rows for this customer_id in that season whose status is applied, pending_activation, active, suspended or deferred."

policies:
  - id: passes_agg_multi_holding
    subject: [passes_apply]
    rule: >
      A household account may carry season passes for several named passholders in the same season, and
      the charter fixes how many pass records one account may carry at once. Every pass record is
      registered to exactly one named passholder for exactly one season, so a household buying for two
      parents and two children opens four separate pass records on the same account rather than one
      record with four names. The application is refused when the account already carries the maximum
      number of pass records for that season across the applied, pending_activation, active, suspended
      and deferred states, or when a pass record for the same passholder in the same season already
      stands in any of those states. Records that have reached the cancelled, expired or closed state
      no longer occupy a place on the account, so a household that cancelled one pass may open another
      for a different passholder in the same season. Where a household needs more passes than the
      charter allows on one account, the further passes are sold on a separate household account; they
      are never squeezed onto this one, and the group and corporate programmes are the route for larger
      parties.
    eligibility:
      - id: household_pass_count
        applies_to: [passes_apply]
        kind: dedup
        condition: "The application is refused when the account already carries the maximum number of pass records for that season across the applied, pending_activation, active, suspended and deferred states, or when a pass record for the same passholder in the same season already stands in any of those states."
        evidence_fields: [passes_holdings.customer_id, passes_holdings.passholder_name, passes_holdings.season_code, passes_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [passes_holdings.customer_id, passes_holdings.passholder_name, passes_holdings.season_code]
          action_bindings:
            passes_holdings.customer_id: customer_id
            passes_holdings.passholder_name: passholder_name
            passes_holdings.season_code: season_code
        dedup_contract:
          table: passes_holdings
          mode: separate_record
          object_bindings: {passholder_name: passholder_name, season_code: season_code}
          duplicate_filters: {status: [applied, pending_activation, active, suspended, deferred]}
          distinct_fields: [variant_name]
    params:
      max_per_customer: 4
    measures: [passes_msr_household_season_passes]

  - id: passes_agg_household_pricing
    subject: [passes_apply, passes_plan_open]
    rule: >
      Passes bought on one household account for one season are priced as a group, not one at a time.
      Once the account reaches the qualifying number of pass records for that season, the household
      reduction for the tier being bought is taken off that pass and off every further pass opened on
      the account for the same season; passes already opened at full price are not repriced backwards,
      because the reduction is worked out at the moment each application is recorded. The qualifying
      count is the number of pass records on the account in that season standing in the applied,
      pending_activation, active, suspended or deferred states, counted before the new application is
      added. The household reduction is taken after the renewal reduction and is worked out on the
      price that reduction has already produced, never on the list price a second time. Where the
      household finances its passes, all pass records on the account for one season are financed on one
      plan, so the financed amount placed on the pass account is the sum of the household's pass prices
      less every deposit already taken.
    eligibility: []
    params:
      household_qualifying_count: 3
      per_tier:
        Granite Ridge Four-Day Flex Pass: {household_discount_pct: "=household_discount_pct"}
        Granite Ridge Midweek Pass: {household_discount_pct: "=household_discount_pct"}
        Granite Ridge Local Pass: {household_discount_pct: "=household_discount_pct"}
        Granite Ridge Summit Pass: {household_discount_pct: "=household_discount_pct"}
        Granite Ridge Summit Plus Pass: {household_discount_pct: "=household_discount_pct"}
        Granite Ridge Collective Unlimited Pass: {household_discount_pct: "=household_discount_pct"}
        Granite Ridge Collective Elite Pass: {household_discount_pct: "=household_discount_pct"}
    measures: [passes_msr_household_season_passes]

  - id: passes_pricing
    subject: [passes_apply, passes_accept]
    rule: >
      The price committed to on a pass application is built in a fixed order and then frozen on the
      record. The starting figure is the early commitment price where the application is recorded on or
      before that tier's early commitment deadline, and the standard season price otherwise; the
      deadline is read as a date in the calendar year the season opens in. The renewal reduction is
      taken off that starting figure next. The renewal reduction is given only when the collective's
      records already show a season pass registered to the same passholder_name in the immediately
      preceding season. The household reduction is taken last. An age band other than adult is priced
      only when the passholder's date of birth is on the household profile, and where this charter
      requires documentary proof of age the pass is not activated until that proof is recorded. The
      resulting figure is rounded to the cent and written to the pass record as the price committed to;
      it does not move again for the rest of the season except through a recorded move up. Acceptance of
      the application takes the tier's deposit, which is not refundable once taken and is credited
      against the price, and the remainder is either taken in full or financed. Where the guest names a
      tier they do not meet the entry conditions for, the application is not recorded at that tier; the
      nearest tier they do qualify for is offered instead.
      An age band is priced at all only where the tier is sold in that band, and a passholder
      whose band the tier does not carry is moved to a tier that does rather than priced outside
      the ladder.
    eligibility:
      - id: renewal_evidence
        applies_to: [passes_apply]
        kind: authorization
        condition: "The renewal reduction is given only when the collective's records already show a season pass registered to the same passholder_name in the immediately preceding season."
        evidence_fields: [passes_holdings.passholder_name, passes_holdings.season_code, passes_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [passes_holdings.passholder_name, passes_holdings.season_code]
          action_bindings:
            passes_holdings.passholder_name: passholder_name
            passes_holdings.season_code: season_code
      - id: age_band_basis
        applies_to: [passes_apply]
        kind: caller_fact
        condition: "An age band other than adult is priced only when the passholder's date of birth is on the household profile, and where this charter requires documentary proof of age the pass is not activated until that proof is recorded."
        evidence_fields: [customers.date_of_birth, passes_holdings.age_band]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys:
            - [passes_holdings.age_band]
          action_bindings:
            passes_holdings.age_band: age_band
    params:
      per_tier:
        Granite Ridge Four-Day Flex Pass: {pass_price_usd: "=pass_price_usd", early_commitment_price_usd: "=early_commitment_price_usd", early_commitment_deadline: "=early_commitment_deadline", renewal_discount_pct: "=renewal_discount_pct", deposit_usd: "=deposit_usd", age_bands_offered: "=age_bands_offered"}
        Granite Ridge Midweek Pass: {pass_price_usd: "=pass_price_usd", early_commitment_price_usd: "=early_commitment_price_usd", early_commitment_deadline: "=early_commitment_deadline", renewal_discount_pct: "=renewal_discount_pct", deposit_usd: "=deposit_usd", age_bands_offered: "=age_bands_offered"}
        Granite Ridge Local Pass: {pass_price_usd: "=pass_price_usd", early_commitment_price_usd: "=early_commitment_price_usd", early_commitment_deadline: "=early_commitment_deadline", renewal_discount_pct: "=renewal_discount_pct", deposit_usd: "=deposit_usd", age_bands_offered: "=age_bands_offered"}
        Granite Ridge Summit Pass: {pass_price_usd: "=pass_price_usd", early_commitment_price_usd: "=early_commitment_price_usd", early_commitment_deadline: "=early_commitment_deadline", renewal_discount_pct: "=renewal_discount_pct", deposit_usd: "=deposit_usd", age_bands_offered: "=age_bands_offered"}
        Granite Ridge Summit Plus Pass: {pass_price_usd: "=pass_price_usd", early_commitment_price_usd: "=early_commitment_price_usd", early_commitment_deadline: "=early_commitment_deadline", renewal_discount_pct: "=renewal_discount_pct", deposit_usd: "=deposit_usd", age_bands_offered: "=age_bands_offered"}
