        Granite Ridge Local Pass: {mountains_included: "=mountains_included", midweek_only: "=midweek_only", blackout_dates: "=blackout_dates", holiday_access: "=holiday_access", daily_scan_limit: "=daily_scan_limit", multi_mountain_same_day: "=multi_mountain_same_day", operating_days_included: "=operating_days_included", partner_resort_days: "=partner_resort_days", season_start_date: "=season_start_date", season_end_date: "=season_end_date"}
        Granite Ridge Summit Pass: {mountains_included: "=mountains_included", midweek_only: "=midweek_only", blackout_dates: "=blackout_dates", holiday_access: "=holiday_access", daily_scan_limit: "=daily_scan_limit", multi_mountain_same_day: "=multi_mountain_same_day", operating_days_included: "=operating_days_included", partner_resort_days: "=partner_resort_days", season_start_date: "=season_start_date", season_end_date: "=season_end_date"}
        Granite Ridge Summit Plus Pass: {mountains_included: "=mountains_included", midweek_only: "=midweek_only", blackout_dates: "=blackout_dates", holiday_access: "=holiday_access", daily_scan_limit: "=daily_scan_limit", multi_mountain_same_day: "=multi_mountain_same_day", operating_days_included: "=operating_days_included", partner_resort_days: "=partner_resort_days", season_start_date: "=season_start_date", season_end_date: "=season_end_date"}
