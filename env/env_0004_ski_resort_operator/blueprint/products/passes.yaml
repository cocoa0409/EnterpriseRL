    formula:
      starting_price_usd: "early_commitment_price_usd if applied_date <= early_commitment_deadline else pass_price_usd"
      after_renewal_usd: "starting_price_usd * (1 - renewal_discount_pct / 100)"
      price_paid_usd: "round(after_renewal_usd * (1 - household_discount_pct / 100), 2)"

  - id: passes_activation
    subject: [passes_activate, passes_buddy_issue]
    rule: >
      A pass becomes scannable only once the money due before access has been taken and the identity
      requirements of the tier have been met. The pass is activated only when the collective's pass
      account records show the deposit, or the first scheduled instalment, already cleared against this
      pass. Where the tier requires a passholder photograph, activation waits until the photograph is on
      file; a photograph the guest says they uploaded but which the record does not show is not enough.
      Activation issues pass media, writes the serial of that media to the pass record and stamps the
      activation date. The buddy lift ticket allotment of the tier is loaded onto the pass in the same
      step and is the allotment for the whole season; it is not topped up later and does not carry into
      the next season. The buddy lift ticket allotment is loaded only while the pass record stands in
      the pending_activation or active state. A pass that is activated after the season has already
      opened still receives the full allotment, because the allotment is a property of the tier and not
      of the days remaining.
      Activation is also what opens the tier's standing entitlements, so from that moment the
      priority lift lane, early lift loading before public opening, the complimentary parking days
      and the reductions the tier carries on lodging, equipment rental, snowsports school,
      on-mountain dining and resort retail are read off the pass whenever a charge is raised
      against the household; an entitlement the tier does not carry is not applicable rather than
      zero, and none of them stands before the pass is activated.
    eligibility:
      - id: opening_money_cleared
        applies_to: [passes_activate]
        kind: authorization
        condition: "The pass is activated only when the collective's pass account records show the deposit, or the first scheduled instalment, already cleared against this pass."
        evidence_fields: [passes_ledger.pass_id, passes_ledger.event_type, passes_ledger.amount_usd]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [passes_ledger.pass_id]
          action_bindings:
            passes_ledger.pass_id: pass_id
      - id: allotment_state
        applies_to: [passes_buddy_issue]
        kind: state
        condition: "The buddy lift ticket allotment is loaded only while the pass record stands in the pending_activation or active state."
        evidence_fields: [passes_holdings.status, passes_holdings.pass_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [passes_holdings.pass_id]
          action_bindings:
            passes_holdings.pass_id: pass_id
        state_contract:
          field: passes_holdings.status
          allowed: [pending_activation, active]
    params:
      per_tier:
