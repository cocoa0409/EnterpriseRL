  - id: rentals_fitting_and_pickup
    subject: [rentals_pickup, rentals_day_consume]
    rule: >
      Kit is handed over only to the rider it was fitted for or to the adult who opened the agreement on
      their behalf. Kit is handed over only when the rider's signed liability release is recorded against
      the agreement, and where the package calls for it, only when a photographic identity document has been
      seen at the counter. The binding release setting is worked from the rider's height, weight, age and
      ability as recorded on the agreement, and a technician resets it whenever any of those is corrected; a
      rider who tells the shop a different weight after collection has the kit reset rather than the record
      quietly changed. One rental day is drawn for each date the kit is out, counted from the date of
      collection through the date of hand-in inclusive, so kit collected in the afternoon and handed in the
      next morning has used two days. Days are not drawn for dates before collection even where the
      reservation covered them, and the days a guest does not ski are not given back.
    eligibility:
      - id: signed_release_recorded
        applies_to: [rentals_pickup]
        kind: authorization
        condition: "Kit is handed over only when the rider's signed liability release is recorded against the agreement, and where the package calls for it, only when a photographic identity document has been seen at the counter."
        evidence_fields: [rentals_holdings.rental_id, rentals_holdings.signed_release_on_file, rentals_holdings.renter_name]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rentals_holdings.rental_id]
          action_bindings:
            rentals_holdings.rental_id: rental_id
    params:
      per_tier:
        Junior Ski & Board Rental: {signed_release_required: "=signed_release_required", id_required_at_pickup: "=id_required_at_pickup", boot_fitting_included: "=boot_fitting_included", package_includes: "=package_includes", helmet_included: "=helmet_included"}
        Basic Ski & Board Rental: {signed_release_required: "=signed_release_required", id_required_at_pickup: "=id_required_at_pickup", boot_fitting_included: "=boot_fitting_included", package_includes: "=package_includes", helmet_included: "=helmet_included"}
        Sport Ski & Board Rental: {signed_release_required: "=signed_release_required", id_required_at_pickup: "=id_required_at_pickup", boot_fitting_included: "=boot_fitting_included", package_includes: "=package_includes", helmet_included: "=helmet_included"}
        Performance Ski & Board Rental: {signed_release_required: "=signed_release_required", id_required_at_pickup: "=id_required_at_pickup", boot_fitting_included: "=boot_fitting_included", package_includes: "=package_includes", helmet_included: "=helmet_included"}
        Demo Ski & Board Rental: {signed_release_required: "=signed_release_required", id_required_at_pickup: "=id_required_at_pickup", boot_fitting_included: "=boot_fitting_included", package_includes: "=package_includes", helmet_included: "=helmet_included"}
        Season-Long Lease Package: {signed_release_required: "=signed_release_required", id_required_at_pickup: "=id_required_at_pickup", boot_fitting_included: "=boot_fitting_included", package_includes: "=package_includes", helmet_included: "=helmet_included"}
    measures: [rentals_msr_days_used]

  - id: rentals_swap_and_extension
    subject: [rentals_swap, rentals_extend]
    rule: >
      A rider may change to a different model or size while the kit is out, up to the number of changes the
      package allows. Packages that include changes carry no fee for them; the rest carry the package's
      change fee for every change after the first refit for a genuine misfit, which is never charged.
      Changes are counted on the agreement, so a rider who has used the package's allowance is offered a
      new agreement at the day rate rather than a further change. An agreement may be extended while the kit
      is still out, where the package allows it and by no more than the package's extension limit; the extra
      days are charged at the rate the agreement was written on and the package's extension fee is raised on
      top. An extension is recorded before the kit falls due, not after: kit already overdue is handled as a
      late hand-in and the extension route is closed. A season lease is not extended at all; it runs to the
      end of the season it was written for.
    eligibility: []
    params:
      per_tier:
        Junior Ski & Board Rental: {demo_swap_included: "=demo_swap_included", swap_fee_usd: "=swap_fee_usd", max_swaps_per_rental: "=max_swaps_per_rental", extension_allowed: "=extension_allowed", extension_fee_usd: "=extension_fee_usd", extension_max_days: "=extension_max_days", lease_exchange_allowed: "=lease_exchange_allowed", lease_exchange_fee_usd: "=lease_exchange_fee_usd"}
        Basic Ski & Board Rental: {demo_swap_included: "=demo_swap_included", swap_fee_usd: "=swap_fee_usd", max_swaps_per_rental: "=max_swaps_per_rental", extension_allowed: "=extension_allowed", extension_fee_usd: "=extension_fee_usd", extension_max_days: "=extension_max_days", lease_exchange_allowed: "=lease_exchange_allowed", lease_exchange_fee_usd: "=lease_exchange_fee_usd"}
        Sport Ski & Board Rental: {demo_swap_included: "=demo_swap_included", swap_fee_usd: "=swap_fee_usd", max_swaps_per_rental: "=max_swaps_per_rental", extension_allowed: "=extension_allowed", extension_fee_usd: "=extension_fee_usd", extension_max_days: "=extension_max_days", lease_exchange_allowed: "=lease_exchange_allowed", lease_exchange_fee_usd: "=lease_exchange_fee_usd"}
        Performance Ski & Board Rental: {demo_swap_included: "=demo_swap_included", swap_fee_usd: "=swap_fee_usd", max_swaps_per_rental: "=max_swaps_per_rental", extension_allowed: "=extension_allowed", extension_fee_usd: "=extension_fee_usd", extension_max_days: "=extension_max_days", lease_exchange_allowed: "=lease_exchange_allowed", lease_exchange_fee_usd: "=lease_exchange_fee_usd"}
        Demo Ski & Board Rental: {demo_swap_included: "=demo_swap_included", swap_fee_usd: "=swap_fee_usd", max_swaps_per_rental: "=max_swaps_per_rental", extension_allowed: "=extension_allowed", extension_fee_usd: "=extension_fee_usd", extension_max_days: "=extension_max_days", lease_exchange_allowed: "=lease_exchange_allowed", lease_exchange_fee_usd: "=lease_exchange_fee_usd"}
