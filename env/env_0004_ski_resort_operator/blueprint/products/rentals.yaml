category: rentals
display_name: Equipment Rental and Demo

binding:
  holding_table: rentals_holdings
  event_tables: [rentals_ledger]
  intake_tables: [rentals_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields:
    rental_days_remaining: rental_days
    damage_deposit_usd: damage_deposit
    rental_balance_usd: rental_balance

lifecycle:
  states: [reserved, confirmed, picked_up, overdue, returned, cancelled, no_show, closed]
  transitions:
    - {from: reserved, to: confirmed, by: agent, means: "Kit of the right size has been set aside for the dates asked for and the security hold has been taken."}
    - {from: reserved, to: cancelled, by: user, means: "The guest gives the reservation up before any kit was set aside."}
    - {from: confirmed, to: picked_up, by: agent, means: "The guest has collected the kit from the shop and the serial of what they took is on the agreement."}
    - {from: confirmed, to: cancelled, by: user, means: "The guest gives up a reservation that kit was already set aside for."}
    - {from: confirmed, to: no_show, by: system, means: "The guest never collected the kit and the reservation ran out."}
    - {from: picked_up, to: returned, by: user, means: "The guest brings the kit back to a shop and hands it in."}
    - {from: picked_up, to: overdue, by: system, means: "The kit is still out after the time it was due back."}
    - {from: overdue, to: returned, by: user, means: "The guest brings back kit that was already overdue."}
    - {from: returned, to: closed, by: system, means: "The kit has been checked in, the security hold settled and the agreement closed."}
    - {from: cancelled, to: closed, by: system, means: "The cancelled reservation has been settled and the agreement closed."}
    - {from: no_show, to: closed, by: system, means: "The uncollected reservation has been settled and the agreement closed."}

accounts:
  - key: rental_days
    unit: days
    meaning: "The number of rental days this agreement still holds for the guest; the whole block is loaded when kit is set aside and one is drawn for each day the kit is out."
  - key: damage_deposit
    unit: USD
    meaning: "The security hold standing against this agreement; it is placed when kit is set aside and released, in whole or in part, when the kit is checked back in."
  - key: rental_balance
    unit: USD
    meaning: "The amount of rental rate, add-ons, fees and damage still to be collected on this agreement; it rises when a charge is raised and falls when a payment clears."

parameter_schema:
  daily_rate_usd: "Price in USD of one day of this package for one rider at the shop rate."
  multi_day_daily_rate_usd: "Price in USD per day of this package when the agreement runs for the multi-day threshold or longer."
  multi_day_threshold_days: "Number of rental days at which the multi-day daily rate replaces the shop day rate (integer)."
  weekly_rate_usd: "Price in USD of a full seven-day block of this package."
  season_lease_price_usd: "Price in USD of holding this package for the whole season under a lease rather than by the day."
  min_rental_days: "Fewest days an agreement for this package may run for (integer)."
  max_rental_days: "Most days an agreement for this package may run for before it becomes a season lease (integer)."
  advance_booking_discount_pct: "Percentage taken off the rate when the reservation is recorded at least the advance booking period before the collection date."
  advance_booking_days_min: "Number of calendar days before the collection date at which the advance booking reduction starts to apply (integer)."
  package_includes: "List of items handed over with this package."
  helmet_included: "Whether a helmet is handed over with this package at no charge (true/false)."
  helmet_daily_rate_usd: "Price in USD per day of adding a helmet where it is not included."
  boot_fitting_included: "Whether a fitting session with a boot technician is included in this package (true/false)."
  performance_boot_upgrade_usd: "Price in USD of moving from the package's standard boot to a performance boot for the whole agreement."
  demo_swap_included: "Whether the guest may change to a different model during the agreement at no charge (true/false)."
  swap_fee_usd: "Fee in USD for changing to a different model during the agreement where changes are not included."
  max_swaps_per_rental: "Number of times the kit on one agreement may be changed for a different model (integer)."
  damage_waiver_offered: "Whether a damage waiver may be taken on this package (true/false)."
  damage_waiver_daily_usd: "Price in USD per day of the damage waiver on this package."
  damage_waiver_excess_usd: "Amount in USD the guest still bears on a damage claim where the waiver was taken."
  damage_deposit_usd: "Security hold in USD placed against the agreement when kit is set aside."
  deposit_release_days: "Number of business days after check-in within which the security hold is released (integer)."
  replacement_value_usd: "Amount in USD charged where kit from this package is not brought back at all."
  late_return_grace_hours: "Whole hours after the time kit is due back within which no late fee arises (integer)."
  late_return_fee_per_day_usd: "Fee in USD for each calendar day kit from this package is out beyond its due date."
  max_late_days_before_replacement: "Number of calendar days beyond the due date after which kit is treated as not coming back and the replacement value is charged (integer)."
  free_cancellation_hours: "Whole hours before the collection date up to which a cancellation carries no fee (integer)."
  cancellation_fee_pct: "Percentage of the agreement value retained when a cancellation is recorded after the free cancellation deadline."
  no_show_fee_pct: "Percentage of the agreement value retained when the guest never collects the kit."
  extension_allowed: "Whether an agreement for this package may be extended while the kit is out (true/false)."
  extension_fee_usd: "Fee in USD for extending an agreement, charged on top of the rate for the extra days."
  extension_max_days: "Most days one agreement may be extended by (integer)."
  pickup_locations: "List of the collective's mountains whose shops carry this package."
  return_location_flexible: "Whether kit from this package may be handed in at a mountain other than the one it was collected from (true/false)."
  cross_mountain_return_fee_usd: "Fee in USD for handing kit in at a mountain other than the one it was collected from."
  overnight_storage_included: "Whether overnight storage of the kit at the shop is included in this package (true/false)."
  overnight_storage_daily_usd: "Price in USD per night of storing the kit at the shop where storage is not included."
  tuning_included: "Whether a mid-agreement tune of the kit is included in this package (true/false)."
  tuning_fee_usd: "Price in USD of a mid-agreement tune where it is not included."
  delivery_offered: "Whether kit from this package is delivered to the guest's lodging (true/false)."
  delivery_fee_usd: "Price in USD of delivering the kit to the guest's lodging and collecting it afterwards."
  min_age_years: "Youngest age in whole years a rider may be fitted in this package (integer)."
  max_age_years: "Oldest age in whole years a rider is fitted in this package (integer)."
  min_rider_height_cm: "Shortest rider height in centimetres this package is fitted for (integer)."
  max_rider_height_cm: "Tallest rider height in centimetres this package is fitted for (integer)."
  min_rider_weight_kg: "Lightest rider weight in kilograms this package is fitted for (integer)."
  max_rider_weight_kg: "Heaviest rider weight in kilograms this package is fitted for (integer)."
  passholder_discount_pct: "Percentage taken off this package for a rider shown on the collective's records as holding a season pass."
  lesson_bundle_discount_pct: "Percentage taken off this package when it is booked alongside a snowsports school booking for the same rider."
  lodging_bundle_discount_pct: "Percentage taken off this package when it is booked alongside collective lodging on the same household account."
  reservation_hold_hours: "Whole hours a reservation is held before the kit set aside for it is released (integer)."
  id_required_at_pickup: "Whether a photographic identity document must be shown when the kit is collected (true/false)."
  signed_release_required: "Whether a signed liability release must be on file before the kit is handed over (true/false)."
  lease_exchange_allowed: "Whether kit held on a season lease may be exchanged for another size during the season (true/false)."
  lease_exchange_fee_usd: "Fee in USD for exchanging kit held on a season lease for another size."
  payment_due_point: "When the agreement value is collected; one of at_booking, at_pickup or at_return."

