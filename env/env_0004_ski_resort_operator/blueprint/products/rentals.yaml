events:
  - type: rentals_reserve
    target: rentals_holdings
    mutation: create
    meaning: "A guest reserves a rental package for a named rider over stated dates and the rental agreement is opened."
    grain: "One row per rental agreement for one rider over one set of dates."
    fields:
      rental_id: "Reference number of the rental agreement."
      customer_id: "The household account the agreement is opened on."
      variant_name: "The rental package reserved, written as its official full name."
      status: "Lifecycle state of the agreement, pinned to the reserved state when it is opened."
      season_code: "The season the agreement falls in."
      renter_name: "Name of the rider the kit is fitted for, exactly as the guest states it."
      rider_age_band: "Age band the rider falls in."
      rider_height_cm: "Rider height in centimetres, as the guest states it and as the fitting is worked from."
      rider_weight_kg: "Rider weight in kilograms, as the guest states it and as the binding release is set from."
      ability_level: "Ability level the rider is fitted for, which sets the binding release setting."
      discipline: "Whether the rider is on skis or a snowboard."
      pickup_mountain: "Mountain whose shop the kit is collected from."
      pickup_date: "Date the kit is due to be collected."
      due_date: "Date the kit is due back."
      rental_days_booked: "Number of rental days the agreement covers."
      reserved_date: "Date the reservation was recorded."
      damage_waiver_taken: "Whether the guest has taken the damage waiver on this agreement."
    triggers:
      - event: rentals:rentals_rate_charge
        map: {rental_id: rental_id, customer_id: customer_id, charge_category: rental_rate}

  - type: rentals_confirm
    target: rentals_holdings
    mutation: {transition: {from: reserved, to: confirmed}}
    meaning: "Kit of the right size is set aside for the dates asked for and the security hold is taken."
    grain: "One row per agreement; the allocation is recorded on the agreement itself."
    fields:
      status: "Lifecycle state of the agreement, moved to the state in which kit is set aside."
      item_serial: "Serial of the kit set aside for this rider."
      boot_size_mondopoint: "Boot size in mondopoint the rider is fitted at."
      rental_days_remaining: "Rental days the agreement still holds."
    triggers:
      - event: rentals:rentals_reserve_load
        map: {rental_id: rental_id, customer_id: customer_id}
      - event: rentals:rentals_deposit_hold
        map: {rental_id: rental_id, customer_id: customer_id, deposit_status: held}

  - type: rentals_pickup
    target: rentals_holdings
    mutation: {transition: {from: confirmed, to: picked_up}}
    meaning: "The guest collects the kit from the shop and the serial of what they took is written on the agreement."
    grain: "One row per agreement; collection is recorded on the agreement itself."
    fields:
      status: "Lifecycle state of the agreement, moved to the state in which the kit is out."
      item_serial: "Serial of the kit actually handed over."
      signed_release_on_file: "Whether the rider's signed liability release is recorded against the agreement."
    triggers: []

  - type: rentals_swap
    target: rentals_holdings
    mutation: update
    meaning: "The rider changes to a different model or size part-way through the agreement and the shop records the new kit."
    grain: "One row per agreement; the change rewrites the kit on the agreement itself."
    fields:
      item_serial: "Serial of the kit the rider now holds."
      boot_size_mondopoint: "Boot size the rider is now fitted at."
      swap_count: "How many times the kit on this agreement has been changed."
    triggers:
      - event: rentals:rentals_fee_charge
        map: {rental_id: rental_id, customer_id: customer_id, charge_category: swap_fee}

  - type: rentals_extend
    target: rentals_holdings
    mutation: update
    meaning: "The guest keeps the kit longer than first agreed and the date it is due back is moved out."
    grain: "One row per agreement; the extension rewrites the due date on the agreement itself."
    fields:
      due_date: "The date the kit is now due back."
      rental_days_booked: "Number of rental days the agreement now covers."
    triggers:
      - event: rentals:rentals_fee_charge
        map: {rental_id: rental_id, customer_id: customer_id, charge_category: extension_fee}

  - type: rentals_mark_overdue
    target: rentals_holdings
    mutation: {transition: {from: picked_up, to: overdue}}
    meaning: "The kit is still out after the time it was due back and the agreement is flagged as overdue."
    grain: "One row per agreement; the overdue flag is recorded on the agreement itself."
    fields:
      status: "Lifecycle state of the agreement, moved to the overdue state."
    triggers:
      - event: rentals:rentals_fee_charge
        map: {rental_id: rental_id, customer_id: customer_id, charge_category: late_return_fee}

  - type: rentals_return
    target: rentals_holdings
    mutation:
      transition:
        - {from: picked_up, to: returned}
        - {from: overdue, to: returned}
    meaning: "The guest hands the kit in at a shop and it is checked back into stock."
    grain: "One row per agreement; the hand-in is recorded on the agreement itself."
    fields:
      status: "Lifecycle state of the agreement, moved to the handed-in state."
      returned_date: "Date the kit was handed in."
      return_mountain: "Mountain whose shop the kit was handed in at."
    triggers:
      - event: rentals:rentals_deposit_release
        map: {rental_id: rental_id, customer_id: customer_id, deposit_status: released}

  - type: rentals_cancel
    target: rentals_holdings
    mutation:
      transition:
        - {from: reserved, to: cancelled}
        - {from: confirmed, to: cancelled}
    meaning: "The guest gives the reservation up before the kit is collected."
    grain: "One row per agreement; the cancellation is recorded on the agreement itself."
    fields:
      status: "Lifecycle state of the agreement, moved to the cancelled state."
      cancellation_reason: "Why the reservation was given up."
    triggers:
      - event: rentals:rentals_fee_charge
        when: {cancellation_reason: [guest_request, no_reason_given]}
        map: {rental_id: rental_id, customer_id: customer_id, charge_category: cancellation_fee}

  - type: rentals_no_show
    target: rentals_holdings
    mutation: {transition: {from: confirmed, to: no_show}}
    meaning: "The guest never collected the kit and the reservation ran out."
    grain: "One row per agreement; the uncollected reservation is recorded on the agreement itself."
    fields:
      status: "Lifecycle state of the agreement, moved to the uncollected state."
    triggers:
      - event: rentals:rentals_fee_charge
        map: {rental_id: rental_id, customer_id: customer_id, charge_category: no_show_fee}

  - type: rentals_close
    target: rentals_holdings
    mutation:
      transition:
        - {from: returned, to: closed}
        - {from: cancelled, to: closed}
        - {from: no_show, to: closed}
    meaning: "Everything owed on the agreement has been settled, the security hold has been dealt with and the agreement is closed for good."
    grain: "One row per agreement; closure is recorded on the agreement itself."
    fields:
      status: "Lifecycle state of the agreement, moved to the closed state."
      rental_balance_usd: "Amount still to be collected on the agreement, which stands at zero once it is closed."
    triggers: []

  - type: rentals_reserve_load
    target: rentals_ledger
    meaning: "The block of rental days an agreement covers is loaded against the rider once kit is set aside."
    grain: "One row per loading of a block of rental days onto one agreement."
    distinguish_by: [event_date, quantity, season_code]
    fields:
      rental_event_id: "Reference number of this rental account entry."
      rental_id: "The agreement this entry belongs to."
      customer_id: "The household account this entry belongs to."
      event_type: "The kind of rental account entry this row records."
      season_code: "The season the agreement falls in."
      event_date: "Date the block was loaded."
      quantity: "Number of rental days loaded."
    account: rental_days
    direction: in
    triggers: []

  - type: rentals_day_consume
    target: rentals_ledger
    meaning: "One rental day is used because the kit was out on that date."
    grain: "One row per date the kit was out under one agreement."
    distinguish_by: [service_date, item_serial, mountain]
    fields:
      rental_event_id: "Reference number of this rental account entry."
      rental_id: "The agreement this entry belongs to."
      customer_id: "The household account this entry belongs to."
      event_type: "The kind of rental account entry this row records."
      event_date: "Date the use was recorded."
      service_date: "Date the kit was out."
      item_serial: "Serial of the kit that was out."
      item_category: "What kind of kit was out."
      mountain: "Mountain the kit was used at."
      quantity: "Number of rental days used."
    account: rental_days
    direction: out
    triggers: []

  - type: rentals_rate_charge
    target: rentals_ledger
    meaning: "The rate for the rental package over the days booked, and any add-ons taken with it, is raised against the household account."
    grain: "One row per charge of one kind raised for the rate or an add-on on one agreement."
    distinguish_by: [charge_category, event_date, amount_usd]
    fields:
      rental_event_id: "Reference number of this rental account entry."
      rental_id: "The agreement this entry belongs to."
      customer_id: "The household account this entry belongs to."
      event_type: "The kind of rental account entry this row records."
      season_code: "The season the agreement falls in."
      event_date: "Date the charge was raised."
      amount_usd: "Amount of the charge."
      charge_category: "What the amount is for."
      quantity: "Number of days or add-ons the amount covers."
      item_category: "What kind of kit the amount covers."
    account: rental_balance
    direction: in
    triggers: []

  - type: rentals_fee_charge
    target: rentals_ledger
    meaning: "A shop fee of some kind — a change of kit, an extension, a late hand-in, a cancellation or an uncollected reservation — is raised against the household account."
    grain: "One row per shop fee of one kind raised against one agreement."
    distinguish_by: [charge_category, event_date, related_event_id]
    fields:
      rental_event_id: "Reference number of this rental account entry."
      rental_id: "The agreement this entry belongs to."
      customer_id: "The household account this entry belongs to."
      event_type: "The kind of rental account entry this row records."
      related_event_id: "The rental account entry this fee answers to, where it answers to one."
      event_date: "Date the fee was raised."
      amount_usd: "Amount of the fee."
      charge_category: "Which fee the amount is for."
      quantity: "Number of days or occasions the fee covers."
    account: rental_balance
    direction: in
    triggers: []

  - type: rentals_damage_charge
    target: rentals_ledger
    meaning: "Damage found on kit handed in, or kit that never came back, is assessed and charged against the household account."
    grain: "One row per item of kit assessed for damage on one agreement."
    distinguish_by: [item_serial, damage_code, event_date]
    fields:
      rental_event_id: "Reference number of this rental account entry."
      rental_id: "The agreement this entry belongs to."
      customer_id: "The household account this entry belongs to."
      event_type: "The kind of rental account entry this row records."
      related_event_id: "The security hold entry this assessment is settled against."
      event_date: "Date the assessment was made."
      amount_usd: "Amount charged for the damage or for the kit not coming back."
      charge_category: "Whether the amount is damage or a replacement."
      item_serial: "Serial of the item assessed."
      item_category: "What kind of item was assessed."
      damage_code: "What was found wrong with the item."
    account: rental_balance
    direction: in
    triggers: []

  - type: rentals_payment
    target: rentals_ledger
    meaning: "Money is collected against what the household owes the shop on an agreement."
    grain: "One row per payment collected against one agreement."
    distinguish_by: [event_date, amount_usd, payment_method]
    fields:
      rental_event_id: "Reference number of this rental account entry."
      rental_id: "The agreement this entry belongs to."
      customer_id: "The household account this entry belongs to."
      event_type: "The kind of rental account entry this row records."
      related_event_id: "The charge this payment settles."
      event_date: "Date the payment cleared."
      amount_usd: "Amount collected."
      payment_method: "How the money was taken."
    account: rental_balance
    direction: out
    triggers: []

  - type: rentals_deposit_hold
    target: rentals_ledger
    meaning: "The security hold for an agreement is placed against the guest's payment method."
    grain: "One row per security hold placed on one agreement."
    distinguish_by: [event_date, amount_usd, deposit_status]
    fields:
      rental_event_id: "Reference number of this rental account entry."
      rental_id: "The agreement this entry belongs to."
      customer_id: "The household account this entry belongs to."
      event_type: "The kind of rental account entry this row records."
      event_date: "Date the hold was placed."
      amount_usd: "Amount held."
