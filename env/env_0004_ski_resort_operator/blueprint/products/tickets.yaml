events:
  - type: tickets_order
    target: tickets_holdings
    mutation: create
    meaning: "A guest orders lift tickets of one product for one holder and the ticket order is opened."
    grain: "One row per ticket order of one product for one holder."
    fields:
      ticket_order_id: "Reference number of the ticket order."
      customer_id: "The household account the order is placed on."
      variant_name: "The ticket product ordered, written as its official full name."
      status: "Lifecycle state of the order, pinned to the ordered state when it is opened."
      season_code: "The season the order is sold for."
      holder_name: "Name of the person the order is registered to, exactly as the guest states it."
      holder_age_band: "Age band the holder is priced in."
      ski_date: "The named ski date, where the product names one."
      ticket_count: "Number of tickets the order holds."
      days_purchased: "Number of ski days the order holds for the holder."
      mountain: "Mountain the order is bought against."
      ordered_date: "Date the order was recorded."
      price_paid_usd: "Amount committed to for the order after every reduction."
    triggers:
      - event: tickets:tickets_order_charge
        map: {ticket_order_id: ticket_order_id, customer_id: customer_id, charge_category: ticket_price}

  - type: tickets_pay
    target: tickets_holdings
    mutation: {transition: {from: ordered, to: paid}}
    meaning: "The money for the order has cleared."
    grain: "One row per order; payment is recorded on the order itself."
    fields:
      status: "Lifecycle state of the order, moved to the paid state."
    triggers: []

  - type: tickets_issue
    target: tickets_holdings
    mutation: {transition: {from: paid, to: issued}}
    meaning: "Ticket media is printed or loaded and the days are put onto it."
    grain: "One row per order; issuance is recorded on the order itself."
    fields:
      status: "Lifecycle state of the order, moved to the issued state."
      media_serial: "Serial of the media the days were loaded onto."
      days_remaining: "Ski days the order still holds."
      issued_date: "Date the media was issued."
    triggers:
      - event: tickets:tickets_days_load
        map: {ticket_order_id: ticket_order_id, customer_id: customer_id}

  - type: tickets_reassign
    target: tickets_holdings
    mutation: update
    meaning: "The order is re-registered from one named holder to another."
    grain: "One row per order; the re-registration rewrites the holder on the order itself."
    fields:
      holder_name: "Name of the person the order is now registered to."
      holder_age_band: "Age band the new holder is priced in."
    triggers:
      - event: tickets:tickets_fee_charge
        map: {ticket_order_id: ticket_order_id, customer_id: customer_id, charge_category: reassignment_fee}

  - type: tickets_begin_use
    target: tickets_holdings
    mutation: {transition: {from: issued, to: in_use}}
    meaning: "The first day of the order has been scanned at a lift."
    grain: "One row per order; the first use is recorded on the order itself."
    fields:
      status: "Lifecycle state of the order, moved to the part-used state."
      first_used_date: "Date the first day was scanned."
    triggers: []

  - type: tickets_exhaust
    target: tickets_holdings
    mutation: {transition: {from: in_use, to: used_up}}
    meaning: "Every day the order held has been scanned."
    grain: "One row per order; exhaustion is recorded on the order itself."
    fields:
      status: "Lifecycle state of the order, moved to the fully used state."
      days_remaining: "Ski days left on the order, which stand at zero once it is fully used."
    triggers: []

  - type: tickets_expire
    target: tickets_holdings
    mutation:
      transition:
        - {from: issued, to: expired}
        - {from: in_use, to: expired}
    meaning: "The order has run past its last valid date with days still unused."
    grain: "One row per order; expiry is recorded on the order itself."
    fields:
      status: "Lifecycle state of the order, moved to the expired state."
      closed_date: "Last date the order admitted the holder."
    triggers: []

  - type: tickets_cancel
    target: tickets_holdings
    mutation: {transition: {from: ordered, to: cancelled}}
    meaning: "The guest abandons the order before paying for it."
    grain: "One row per order; the abandonment is recorded on the order itself."
    fields:
      status: "Lifecycle state of the order, moved to the abandoned state."
      cancellation_reason: "Why the order was abandoned."
    triggers:
      - event: tickets:tickets_fee_charge
        when: {cancellation_reason: [guest_request, no_reason_given]}
        map: {ticket_order_id: ticket_order_id, customer_id: customer_id, charge_category: cancellation_fee}

  - type: tickets_refund
    target: tickets_holdings
    mutation:
      transition:
        - {from: paid, to: refunded}
        - {from: issued, to: refunded}
        - {from: in_use, to: refunded}
    meaning: "The guest gives the order, or the days still unused on it, back and a refund is settled."
    grain: "One row per order; the refund is recorded on the order itself."
    fields:
      status: "Lifecycle state of the order, moved to the refunded state."
      cancellation_reason: "Why the order was given back."
      closed_date: "Last date the order admitted the holder."
    triggers:
      - event: tickets:tickets_credit_issue
        map: {ticket_order_id: ticket_order_id, customer_id: customer_id, credit_reason: order_refund}

  - type: tickets_close
    target: tickets_holdings
    mutation:
      transition:
        - {from: used_up, to: closed}
        - {from: expired, to: closed}
        - {from: cancelled, to: closed}
        - {from: refunded, to: closed}
    meaning: "Everything owed on and owed to the order has been settled and the record is closed for good."
    grain: "One row per order; closure is recorded on the order itself."
    fields:
      status: "Lifecycle state of the order, moved to the closed state."
      order_balance_usd: "Amount still to be collected on the order, which stands at zero once it is closed."
    triggers: []

  - type: tickets_order_charge
    target: tickets_ledger
    meaning: "The price of a ticket order is raised against the household account."
    grain: "One row per charge of one kind raised on one ticket order."
    distinguish_by: [charge_category, event_date, amount_usd]
    fields:
      ticket_event_id: "Reference number of this ticket account entry."
      ticket_order_id: "The order this entry belongs to."
      customer_id: "The household account this entry belongs to."
      event_type: "The kind of ticket account entry this row records."
      season_code: "The season the order is sold for."
      event_date: "Date the charge was raised."
      amount_usd: "Amount of the charge."
      charge_category: "What the amount is for."
      quantity: "Number of tickets or days the amount covers."
    account: order_balance
    direction: in
    triggers: []

  - type: tickets_fee_charge
    target: tickets_ledger
    meaning: "A ticket office fee of some kind — a date change, a re-registration, replacement media or an abandoned order — is raised against the household account."
    grain: "One row per ticket office fee of one kind raised on one order."
    distinguish_by: [charge_category, event_date, related_event_id]
    fields:
      ticket_event_id: "Reference number of this ticket account entry."
      ticket_order_id: "The order this entry belongs to."
      customer_id: "The household account this entry belongs to."
      event_type: "The kind of ticket account entry this row records."
      related_event_id: "The ticket account entry this fee answers to, where it answers to one."
      event_date: "Date the fee was raised."
      amount_usd: "Amount of the fee."
      charge_category: "Which fee the amount is for."
    account: order_balance
    direction: in
    triggers: []

  - type: tickets_payment
    target: tickets_ledger
    meaning: "Money is collected against what the household owes on a ticket order."
    grain: "One row per payment collected against one order."
    distinguish_by: [event_date, amount_usd, payment_method]
    fields:
      ticket_event_id: "Reference number of this ticket account entry."
      ticket_order_id: "The order this entry belongs to."
      customer_id: "The household account this entry belongs to."
      event_type: "The kind of ticket account entry this row records."
      related_event_id: "The charge this payment settles."
      event_date: "Date the payment cleared."
      amount_usd: "Amount collected."
      payment_method: "How the money was taken."
    account: order_balance
    direction: out
    triggers: []

  - type: tickets_days_load
    target: tickets_ledger
    meaning: "The block of ski days an order holds is loaded onto the ticket media."
    grain: "One row per loading of a block of ski days onto one order."
    distinguish_by: [event_date, quantity, media_serial]
    fields:
      ticket_event_id: "Reference number of this ticket account entry."
      ticket_order_id: "The order this entry belongs to."
      customer_id: "The household account this entry belongs to."
      event_type: "The kind of ticket account entry this row records."
      season_code: "The season the order is sold for."
      event_date: "Date the block was loaded."
      quantity: "Number of ski days loaded."
      media_serial: "Serial of the media the days were loaded onto."
    account: ticket_days
    direction: in
    triggers: []

  - type: tickets_day_redeem
    target: tickets_ledger
    meaning: "One ski day is drawn from the order because the holder scanned at a lift on that date."
    grain: "One row per date the holder first scanned under one order."
    distinguish_by: [service_date, mountain, media_serial]
    fields:
      ticket_event_id: "Reference number of this ticket account entry."
      ticket_order_id: "The order this entry belongs to."
      customer_id: "The household account this entry belongs to."
      event_type: "The kind of ticket account entry this row records."
      event_date: "Date the draw was recorded."
      service_date: "Date the holder skied."
      mountain: "Mountain the holder skied at."
      media_serial: "Serial of the media that was scanned."
      quantity: "Number of ski days drawn."
    account: ticket_days
    direction: out
    triggers: []

  - type: tickets_credit_issue
    target: tickets_ledger
    meaning: "Ticket credit is issued against the order, on a refund or on a day lost to the mountain."
    grain: "One row per issue of ticket credit against one order."
    distinguish_by: [credit_reason, event_date, amount_usd]
    fields:
      ticket_event_id: "Reference number of this ticket account entry."
      ticket_order_id: "The order this entry belongs to."
      customer_id: "The household account this entry belongs to."
      event_type: "The kind of ticket account entry this row records."
      related_event_id: "The charge the credit is worked out from."
      event_date: "Date the credit was issued."
      amount_usd: "Amount of ticket credit issued."
      credit_reason: "Why the credit was issued."
      service_date: "The ski date the credit answers to, where it answers to one."
    account: ticket_credit
    direction: in
    triggers: []

  - type: tickets_credit_redeem
    target: tickets_ledger
    meaning: "Ticket credit held against the order is applied to a charge."
    grain: "One row per application of ticket credit to one charge."
    distinguish_by: [event_date, amount_usd, related_event_id]
    fields:
      ticket_event_id: "Reference number of this ticket account entry."
      ticket_order_id: "The order this entry belongs to."
      customer_id: "The household account this entry belongs to."
      event_type: "The kind of ticket account entry this row records."
      related_event_id: "The charge the credit was applied against."
      event_date: "Date the credit was applied."
      amount_usd: "Amount of ticket credit applied."
      credit_reason: "The credit pot the amount was drawn from."
    account: ticket_credit
    direction: out
    triggers: []

measures:
  - id: tickets_msr_days_redeemed
    window: "The life of the order, from the date the media was issued through the handling date inclusive."
    measure: "Count of tickets_ledger rows of event_type tickets_day_redeem carrying this ticket_order_id."

policies:
  - id: tickets_agg_multi_holding
    subject: [tickets_order]
    rule: >
      A household account may carry several ticket orders at once, up to the number this charter allows,
      counting orders in the ordered, paid, issued and in_use states. One order covers one product for one
      holder, and a party skiing on different products holds one order each. A product sold with a named
      holder is never opened twice for the same holder over the same named ski date; the second order is
      treated as a duplicate of the first and the household is asked whether they meant a different holder
      or a different date. Orders that have reached used_up, expired, cancelled, refunded or closed no
      longer count against the account.
    eligibility:
      - id: duplicate_named_order
        applies_to: [tickets_order]
        kind: dedup
        condition: "A product sold with a named holder is never opened twice for the same holder over the same named ski date; the second order is treated as a duplicate of the first and the household is asked whether they meant a different holder or a different date."
        evidence_fields: [tickets_holdings.customer_id, tickets_holdings.holder_name, tickets_holdings.ski_date, tickets_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [tickets_holdings.customer_id, tickets_holdings.holder_name, tickets_holdings.ski_date]
          action_bindings:
            tickets_holdings.customer_id: customer_id
            tickets_holdings.holder_name: holder_name
            tickets_holdings.ski_date: ski_date
        dedup_contract:
          table: tickets_holdings
          mode: separate_record
          object_bindings: {holder_name: holder_name, ski_date: ski_date}
          duplicate_filters: {status: [ordered, paid, issued, in_use]}
          distinct_fields: [variant_name, mountain]
    params:
      max_per_customer: 10

  - id: tickets_agg_party_pricing
    subject: [tickets_order, tickets_order_charge]
    rule: >
      Tickets bought together on one order are priced as a party. Once the order reaches the product's group
      threshold in tickets, the group reduction is taken off every ticket on that order, and tickets on two
      separate orders are never added together to reach the threshold. The season passholder guest
      reduction and the lodging guest reduction are taken where the collective's records show a pass or a
      stay on the same household account over the ski dates; where both would apply only the larger is
      taken. The lesson bundle reduction is taken where the same holder also holds a school booking over the
      ski date. Age band pricing is applied to each ticket on its own before any of these reductions, on the
      age the holder will be on the ski date.
    eligibility: []
    params:
      per_tier:
        Granite Ridge Window Day Ticket: {group_minimum_tickets: "=group_minimum_tickets", group_discount_pct: "=group_discount_pct", passholder_guest_discount_pct: "=passholder_guest_discount_pct", lodging_guest_discount_pct: "=lodging_guest_discount_pct", lesson_bundle_discount_pct: "=lesson_bundle_discount_pct", max_tickets_per_order: "=max_tickets_per_order"}
        Granite Ridge 3-Day Advance Ticket: {group_minimum_tickets: "=group_minimum_tickets", group_discount_pct: "=group_discount_pct", passholder_guest_discount_pct: "=passholder_guest_discount_pct", lodging_guest_discount_pct: "=lodging_guest_discount_pct", lesson_bundle_discount_pct: "=lesson_bundle_discount_pct", max_tickets_per_order: "=max_tickets_per_order"}
        Granite Ridge 7-Day Advance Ticket: {group_minimum_tickets: "=group_minimum_tickets", group_discount_pct: "=group_discount_pct", passholder_guest_discount_pct: "=passholder_guest_discount_pct", lodging_guest_discount_pct: "=lodging_guest_discount_pct", lesson_bundle_discount_pct: "=lesson_bundle_discount_pct", max_tickets_per_order: "=max_tickets_per_order"}
        Granite Ridge Flex 4-Day Ticket Pack: {group_minimum_tickets: "=group_minimum_tickets", group_discount_pct: "=group_discount_pct", passholder_guest_discount_pct: "=passholder_guest_discount_pct", lodging_guest_discount_pct: "=lodging_guest_discount_pct", lesson_bundle_discount_pct: "=lesson_bundle_discount_pct", max_tickets_per_order: "=max_tickets_per_order"}
        Granite Ridge Flex 8-Day Ticket Pack: {group_minimum_tickets: "=group_minimum_tickets", group_discount_pct: "=group_discount_pct", passholder_guest_discount_pct: "=passholder_guest_discount_pct", lodging_guest_discount_pct: "=lodging_guest_discount_pct", lesson_bundle_discount_pct: "=lesson_bundle_discount_pct", max_tickets_per_order: "=max_tickets_per_order"}
        Granite Ridge Collective Multi-Mountain Ticket Pack: {group_minimum_tickets: "=group_minimum_tickets", group_discount_pct: "=group_discount_pct", passholder_guest_discount_pct: "=passholder_guest_discount_pct", lodging_guest_discount_pct: "=lodging_guest_discount_pct", lesson_bundle_discount_pct: "=lesson_bundle_discount_pct", max_tickets_per_order: "=max_tickets_per_order"}

  - id: tickets_pricing
    subject: [tickets_order_charge, tickets_payment]
    rule: >
      A day bought at the window on the day costs the product's window price. A day bought at least the
      product's advance period ahead of the ski date costs its advance price, and the advance period is
      counted in whole calendar days between the order date and the ski date. A product sold as a block of
      days costs the block price whatever the dates the days are later used on. The age band of the holder
      sets a percentage of the adult price: child, youth, senior and super senior each take their own share,
      and the band is judged on the holder's age on the ski date rather than on the order date. A day
      scanned inside a published holiday period adds the product's holiday surcharge, raised when the day is
      drawn rather than when the order is placed. A charge is raised against an order only while the order
      stands in the ordered, paid or issued state. The product's payment point decides when the money is
      taken: at the order, or when the media is collected.
    eligibility:
      - id: chargeable_order_state
        applies_to: [tickets_order_charge]
        kind: state
        condition: "A charge is raised against an order only while the order stands in the ordered, paid or issued state."
        evidence_fields: [tickets_holdings.ticket_order_id, tickets_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [tickets_holdings.ticket_order_id]
          action_bindings:
            tickets_holdings.ticket_order_id: ticket_order_id
        state_contract:
          field: tickets_holdings.status
          allowed: [ordered, paid, issued]
    params:
      per_tier:
        Granite Ridge Window Day Ticket: {window_price_usd: "=window_price_usd", advance_price_usd: "=advance_price_usd", advance_purchase_days: "=advance_purchase_days", pack_price_usd: "=pack_price_usd", days_in_pack: "=days_in_pack", child_price_pct: "=child_price_pct", youth_price_pct: "=youth_price_pct", senior_price_pct: "=senior_price_pct", super_senior_price_pct: "=super_senior_price_pct", child_max_age_years: "=child_max_age_years", youth_max_age_years: "=youth_max_age_years", senior_min_age_years: "=senior_min_age_years", super_senior_min_age_years: "=super_senior_min_age_years", holiday_surcharge_usd: "=holiday_surcharge_usd", payment_due_point: "=payment_due_point"}
        Granite Ridge 3-Day Advance Ticket: {window_price_usd: "=window_price_usd", advance_price_usd: "=advance_price_usd", advance_purchase_days: "=advance_purchase_days", pack_price_usd: "=pack_price_usd", days_in_pack: "=days_in_pack", child_price_pct: "=child_price_pct", youth_price_pct: "=youth_price_pct", senior_price_pct: "=senior_price_pct", super_senior_price_pct: "=super_senior_price_pct", child_max_age_years: "=child_max_age_years", youth_max_age_years: "=youth_max_age_years", senior_min_age_years: "=senior_min_age_years", super_senior_min_age_years: "=super_senior_min_age_years", holiday_surcharge_usd: "=holiday_surcharge_usd", payment_due_point: "=payment_due_point"}
        Granite Ridge 7-Day Advance Ticket: {window_price_usd: "=window_price_usd", advance_price_usd: "=advance_price_usd", advance_purchase_days: "=advance_purchase_days", pack_price_usd: "=pack_price_usd", days_in_pack: "=days_in_pack", child_price_pct: "=child_price_pct", youth_price_pct: "=youth_price_pct", senior_price_pct: "=senior_price_pct", super_senior_price_pct: "=super_senior_price_pct", child_max_age_years: "=child_max_age_years", youth_max_age_years: "=youth_max_age_years", senior_min_age_years: "=senior_min_age_years", super_senior_min_age_years: "=super_senior_min_age_years", holiday_surcharge_usd: "=holiday_surcharge_usd", payment_due_point: "=payment_due_point"}
        Granite Ridge Flex 4-Day Ticket Pack: {window_price_usd: "=window_price_usd", advance_price_usd: "=advance_price_usd", advance_purchase_days: "=advance_purchase_days", pack_price_usd: "=pack_price_usd", days_in_pack: "=days_in_pack", child_price_pct: "=child_price_pct", youth_price_pct: "=youth_price_pct", senior_price_pct: "=senior_price_pct", super_senior_price_pct: "=super_senior_price_pct", child_max_age_years: "=child_max_age_years", youth_max_age_years: "=youth_max_age_years", senior_min_age_years: "=senior_min_age_years", super_senior_min_age_years: "=super_senior_min_age_years", holiday_surcharge_usd: "=holiday_surcharge_usd", payment_due_point: "=payment_due_point"}
        Granite Ridge Flex 8-Day Ticket Pack: {window_price_usd: "=window_price_usd", advance_price_usd: "=advance_price_usd", advance_purchase_days: "=advance_purchase_days", pack_price_usd: "=pack_price_usd", days_in_pack: "=days_in_pack", child_price_pct: "=child_price_pct", youth_price_pct: "=youth_price_pct", senior_price_pct: "=senior_price_pct", super_senior_price_pct: "=super_senior_price_pct", child_max_age_years: "=child_max_age_years", youth_max_age_years: "=youth_max_age_years", senior_min_age_years: "=senior_min_age_years", super_senior_min_age_years: "=super_senior_min_age_years", holiday_surcharge_usd: "=holiday_surcharge_usd", payment_due_point: "=payment_due_point"}
        Granite Ridge Collective Multi-Mountain Ticket Pack: {window_price_usd: "=window_price_usd", advance_price_usd: "=advance_price_usd", advance_purchase_days: "=advance_purchase_days", pack_price_usd: "=pack_price_usd", days_in_pack: "=days_in_pack", child_price_pct: "=child_price_pct", youth_price_pct: "=youth_price_pct", senior_price_pct: "=senior_price_pct", super_senior_price_pct: "=super_senior_price_pct", child_max_age_years: "=child_max_age_years", youth_max_age_years: "=youth_max_age_years", senior_min_age_years: "=senior_min_age_years", super_senior_min_age_years: "=super_senior_min_age_years", holiday_surcharge_usd: "=holiday_surcharge_usd", payment_due_point: "=payment_due_point"}

  - id: tickets_issuance
    subject: [tickets_pay, tickets_issue, tickets_days_load]
    rule: >
      Media is issued once the order is paid, and the block of days is loaded onto it in the same step. The
      block is loaded only while the order stands in the issued or in_use state. Where the product allows
      it, the days may be loaded onto media the guest already holds and no fresh media is issued; otherwise
      the product's media fee is raised with the order. A product that must be collected is collected at a
      ticket office that issues it, and the guest brings the order reference rather than the payment card.
      Media reported lost or broken is replaced against the product's replacement fee, and the days still
      unused move to the new media while the old media is stopped at the lift.
    eligibility:
      - id: days_load_state
        applies_to: [tickets_days_load]
        kind: state
        condition: "The block is loaded only while the order stands in the issued or in_use state."
        evidence_fields: [tickets_holdings.ticket_order_id, tickets_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [tickets_holdings.ticket_order_id]
          action_bindings:
            tickets_holdings.ticket_order_id: ticket_order_id
        state_contract:
          field: tickets_holdings.status
          allowed: [issued, in_use]
    params:
      per_tier:
        Granite Ridge Window Day Ticket: {media_type: "=media_type", media_fee_usd: "=media_fee_usd", media_reuse_allowed: "=media_reuse_allowed", replacement_media_fee_usd: "=replacement_media_fee_usd", collection_required: "=collection_required", collection_locations: "=collection_locations"}
        Granite Ridge 3-Day Advance Ticket: {media_type: "=media_type", media_fee_usd: "=media_fee_usd", media_reuse_allowed: "=media_reuse_allowed", replacement_media_fee_usd: "=replacement_media_fee_usd", collection_required: "=collection_required", collection_locations: "=collection_locations"}
        Granite Ridge 7-Day Advance Ticket: {media_type: "=media_type", media_fee_usd: "=media_fee_usd", media_reuse_allowed: "=media_reuse_allowed", replacement_media_fee_usd: "=replacement_media_fee_usd", collection_required: "=collection_required", collection_locations: "=collection_locations"}
        Granite Ridge Flex 4-Day Ticket Pack: {media_type: "=media_type", media_fee_usd: "=media_fee_usd", media_reuse_allowed: "=media_reuse_allowed", replacement_media_fee_usd: "=replacement_media_fee_usd", collection_required: "=collection_required", collection_locations: "=collection_locations"}
        Granite Ridge Flex 8-Day Ticket Pack: {media_type: "=media_type", media_fee_usd: "=media_fee_usd", media_reuse_allowed: "=media_reuse_allowed", replacement_media_fee_usd: "=replacement_media_fee_usd", collection_required: "=collection_required", collection_locations: "=collection_locations"}
        Granite Ridge Collective Multi-Mountain Ticket Pack: {media_type: "=media_type", media_fee_usd: "=media_fee_usd", media_reuse_allowed: "=media_reuse_allowed", replacement_media_fee_usd: "=replacement_media_fee_usd", collection_required: "=collection_required", collection_locations: "=collection_locations"}

  - id: tickets_redemption
    subject: [tickets_day_redeem, tickets_begin_use, tickets_exhaust]
    rule: >
      A day is drawn on the first scan of a date and is not drawn twice however many lifts are ridden that
      day. A day is drawn only while the order stands in the issued or in_use state. The mountain scanned at
      must be one the product admits the holder to, and where the product does not allow more than one
      mountain on a day, a second mountain on a date already scanned is refused at the lift. A date on the
      product's blackout list is refused whatever days are left. A product that names its ski date admits
      the holder only on that date. Scans beyond the product's daily limit are refused as a media
      protection measure rather than as a charge. Once the days are gone the order is fully used and no
      further date is admitted.
    eligibility:
      - id: redemption_state
        applies_to: [tickets_day_redeem]
        kind: state
        condition: "A day is drawn only while the order stands in the issued or in_use state."
        evidence_fields: [tickets_holdings.ticket_order_id, tickets_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [tickets_holdings.ticket_order_id]
          action_bindings:
            tickets_holdings.ticket_order_id: ticket_order_id
        state_contract:
          field: tickets_holdings.status
          allowed: [issued, in_use]
    params:
      per_tier:
        Granite Ridge Window Day Ticket: {mountains_valid: "=mountains_valid", multi_mountain_same_day: "=multi_mountain_same_day", date_specific: "=date_specific", blackout_dates: "=blackout_dates", daily_scan_limit: "=daily_scan_limit", validity_days: "=validity_days", first_tracks_access: "=first_tracks_access", priority_lift_access: "=priority_lift_access"}
