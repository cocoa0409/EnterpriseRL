category: tickets
display_name: Lift Tickets

binding:
  holding_table: tickets_holdings
  event_tables: [tickets_ledger]
  intake_tables: [tickets_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields:
    days_remaining: ticket_days
    ticket_credit_usd: ticket_credit
    order_balance_usd: order_balance

lifecycle:
  states: [ordered, paid, issued, in_use, used_up, expired, cancelled, refunded, closed]
  transitions:
    - {from: ordered, to: paid, by: system, means: "The money for the order has cleared."}
    - {from: ordered, to: cancelled, by: user, means: "The guest abandons the order before paying for it."}
    - {from: paid, to: issued, by: agent, means: "Ticket media has been printed or loaded and is ready for the holder to collect."}
    - {from: paid, to: refunded, by: user, means: "The guest gives a paid order up before any media was issued."}
    - {from: issued, to: in_use, by: system, means: "The first day of the order has been scanned at a lift."}
    - {from: issued, to: refunded, by: user, means: "The guest gives an issued order up before any day was scanned."}
    - {from: issued, to: expired, by: system, means: "The order ran past its last valid date without a day being scanned."}
    - {from: in_use, to: used_up, by: system, means: "Every day the order held has been scanned."}
    - {from: in_use, to: expired, by: system, means: "The order ran past its last valid date with days still unused."}
    - {from: in_use, to: refunded, by: user, means: "The guest gives up the days still unused on a part-used order."}
    - {from: used_up, to: closed, by: system, means: "The fully used order has been settled and closed."}
    - {from: expired, to: closed, by: system, means: "The expired order has been settled and closed."}
    - {from: cancelled, to: closed, by: system, means: "The abandoned order has been settled and closed."}
    - {from: refunded, to: closed, by: system, means: "The refunded order has been settled and closed."}

accounts:
  - key: ticket_days
    unit: days
    meaning: "The number of ski days this order still holds for the ticket holder; the whole block is loaded when media is issued and one is drawn each time a day is scanned."
  - key: ticket_credit
    unit: USD
    meaning: "Ticket credit held against this order, issued when days are given back or lost to the mountain, and spent when it is applied against a resort charge."
  - key: order_balance
    unit: USD
    meaning: "The amount still to be collected for this ticket order; it rises when the order or a fee is raised and falls when a payment clears."

parameter_schema:
  window_price_usd: "Price in USD of one day of this product bought at the ticket window on the day."
  advance_price_usd: "Price in USD of one day of this product bought at least the advance period ahead."
  advance_purchase_days: "Fewest calendar days ahead of the ski date this product must be bought to take the advance price (integer)."
  pack_price_usd: "Price in USD of the whole block of days this product is sold as."
  days_in_pack: "Number of ski days one order of this product holds (integer)."
  child_price_pct: "Percentage of the adult price charged for a child ticket."
  youth_price_pct: "Percentage of the adult price charged for a youth ticket."
  senior_price_pct: "Percentage of the adult price charged for a senior ticket."
  super_senior_price_pct: "Percentage of the adult price charged for a super senior ticket."
  child_max_age_years: "Oldest age in whole years priced as a child (integer)."
  youth_max_age_years: "Oldest age in whole years priced as a youth (integer)."
  senior_min_age_years: "Youngest age in whole years priced as a senior (integer)."
  super_senior_min_age_years: "Youngest age in whole years priced as a super senior (integer)."
  mountains_valid: "List of the collective's mountains this product admits the holder to."
  multi_mountain_same_day: "Whether the holder may scan at more than one mountain on the same calendar day (true/false)."
  date_specific: "Whether the order names the ski date when it is bought (true/false)."
  date_change_allowed: "Whether a named ski date may be moved to another date (true/false)."
  date_change_fee_usd: "Fee in USD for moving a named ski date to another date."
  date_change_notice_days: "Number of calendar days before the ski date by which a date change must be recorded (integer)."
  validity_days: "Number of calendar days from the first valid date within which the days on the order must be used (integer)."
  valid_from_date: "First date this product admits the holder, as YYYY-MM-DD."
  valid_to_date: "Last date this product admits the holder, as YYYY-MM-DD."
  blackout_dates: "List of dates, as YYYY-MM-DD, on which this product does not admit the holder."
  holiday_surcharge_usd: "Amount in USD added to each day of this product scanned inside a published holiday period."
  daily_scan_limit: "Maximum number of lift scans recorded against this product on one calendar day before scanning is refused (integer)."
  first_tracks_access: "Whether this product includes early-morning lift loading before public opening (true/false)."
  priority_lift_access: "Whether this product includes the priority lift lane (true/false)."
  media_type: "What the days are carried on; one of paper_ticket, rfid_card or mobile_pass."
  media_fee_usd: "One-off charge in USD for the reusable media the days are loaded onto."
  media_reuse_allowed: "Whether days may be loaded onto media the guest already holds (true/false)."
  replacement_media_fee_usd: "Fee in USD for replacing lost or broken ticket media."
  collection_required: "Whether the holder must collect the media at a ticket office before their first day (true/false)."
  collection_locations: "List of the collective's mountains whose ticket offices issue this product."
  holder_named: "Whether the order names the person who will use it (true/false)."
  reassignment_allowed: "Whether the order may be re-registered to a different named holder (true/false)."
  reassignment_fee_usd: "Fee in USD for re-registering the order to a different named holder."
  transferable_between_guests: "Whether an unused day may be used by anyone holding the media (true/false)."
  refund_basis: "How a refund on this product is worked out; one of full_price_paid, unused_days_pro_rata or no_refund."
  refund_window_days: "Number of calendar days after the order is recorded within which a refund may be asked for (integer)."
  refund_fee_usd: "Fee in USD retained from a refund on this product."
  cancellation_fee_usd: "Fee in USD retained when an unpaid order is abandoned."
  weather_credit_offered: "Whether a day lost to lift closures is credited back (true/false)."
  weather_closure_threshold_pct: "Percentage of the mountain's lifts that must be closed for a day to count as lost to the mountain."
  weather_credit_pct: "Percentage of the day's price credited back where a day is lost to the mountain."
  credit_validity_days: "Number of calendar days from issue within which ticket credit must be spent (integer)."
  credit_minimum_redemption_usd: "Smallest amount of ticket credit in USD that may be applied to a single charge."
  group_minimum_tickets: "Number of tickets on one order at which the group rate applies (integer)."
  group_discount_pct: "Percentage taken off each ticket once the group threshold is reached."
  passholder_guest_discount_pct: "Percentage taken off for a guest buying alongside a season passholder of the collective."
  lodging_guest_discount_pct: "Percentage taken off for a guest staying in collective lodging over the ski dates."
  lesson_bundle_discount_pct: "Percentage taken off when the ticket is bought alongside a snowsports school booking for the same holder."
  max_tickets_per_order: "Most tickets one order of this product may hold (integer)."
  payment_due_point: "When the order is collected; one of at_order or at_collection."
  season_code: "The season this product is sold for."

