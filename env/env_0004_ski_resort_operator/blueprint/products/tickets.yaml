  - id: tickets_date_change_and_reassignment
    subject: [tickets_reassign, tickets_fee_charge]
    rule: >
      A product that names its ski date may have that date moved where the product allows it, against the
      product's date change fee and no later than its notice period before the named date; a date moved onto
      a blackout date is refused, and a date moved into a higher priced window pays the difference. A
      product sold to a named holder may be re-registered to another person where the product allows it,
      against the product's re-registration fee, and only before the first day is scanned. A product that is
      transferable between guests needs no re-registration at all, because whoever holds the media may ski
      on it. A fee is raised against an order only while the order stands in the ordered, paid, issued,
      in_use, cancelled or refunded state.
    eligibility:
      - id: fee_bearing_order_state
        applies_to: [tickets_fee_charge]
        kind: state
        condition: "A fee is raised against an order only while the order stands in the ordered, paid, issued, in_use, cancelled or refunded state."
        evidence_fields: [tickets_holdings.ticket_order_id, tickets_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [tickets_holdings.ticket_order_id]
          action_bindings:
            tickets_holdings.ticket_order_id: ticket_order_id
        state_contract:
          field: tickets_holdings.status
          allowed: [ordered, paid, issued, in_use, cancelled, refunded]
    params:
      per_tier:
        Granite Ridge Window Day Ticket: {date_change_allowed: "=date_change_allowed", date_change_fee_usd: "=date_change_fee_usd", date_change_notice_days: "=date_change_notice_days", reassignment_allowed: "=reassignment_allowed", reassignment_fee_usd: "=reassignment_fee_usd", transferable_between_guests: "=transferable_between_guests", holder_named: "=holder_named"}
        Granite Ridge 3-Day Advance Ticket: {date_change_allowed: "=date_change_allowed", date_change_fee_usd: "=date_change_fee_usd", date_change_notice_days: "=date_change_notice_days", reassignment_allowed: "=reassignment_allowed", reassignment_fee_usd: "=reassignment_fee_usd", transferable_between_guests: "=transferable_between_guests", holder_named: "=holder_named"}
        Granite Ridge 7-Day Advance Ticket: {date_change_allowed: "=date_change_allowed", date_change_fee_usd: "=date_change_fee_usd", date_change_notice_days: "=date_change_notice_days", reassignment_allowed: "=reassignment_allowed", reassignment_fee_usd: "=reassignment_fee_usd", transferable_between_guests: "=transferable_between_guests", holder_named: "=holder_named"}
        Granite Ridge Flex 4-Day Ticket Pack: {date_change_allowed: "=date_change_allowed", date_change_fee_usd: "=date_change_fee_usd", date_change_notice_days: "=date_change_notice_days", reassignment_allowed: "=reassignment_allowed", reassignment_fee_usd: "=reassignment_fee_usd", transferable_between_guests: "=transferable_between_guests", holder_named: "=holder_named"}
        Granite Ridge Flex 8-Day Ticket Pack: {date_change_allowed: "=date_change_allowed", date_change_fee_usd: "=date_change_fee_usd", date_change_notice_days: "=date_change_notice_days", reassignment_allowed: "=reassignment_allowed", reassignment_fee_usd: "=reassignment_fee_usd", transferable_between_guests: "=transferable_between_guests", holder_named: "=holder_named"}
        Granite Ridge Collective Multi-Mountain Ticket Pack: {date_change_allowed: "=date_change_allowed", date_change_fee_usd: "=date_change_fee_usd", date_change_notice_days: "=date_change_notice_days", reassignment_allowed: "=reassignment_allowed", reassignment_fee_usd: "=reassignment_fee_usd", transferable_between_guests: "=transferable_between_guests", holder_named: "=holder_named"}

  - id: tickets_weather_credit
    subject: [tickets_credit_issue, tickets_credit_redeem]
    rule: >
      A day is lost to the mountain where at least the product's share of the mountain's lifts stood closed
      for the published operating hours of that date, as the mountain's own operations record shows rather
      than as the guest recalls the day. Where the product offers it, the product's share of that day's
      price is credited back and the day already drawn is not returned to the order. Ticket credit is
      applied only when it is applied no later than its validity period counted in calendar days from the
      day the credit was issued. Calendar days are counted forward from the anchor date, the anchor date
      itself counting as day zero, every day of the week counting alike, and a calendar day is never mixed
      with a full 24-hour period; where the resulting boundary falls on a date that does not exist in the
      target month, the last day of that month is used. A single application must be at least the product's
      minimum. Poor snow cover, crowding and queues with the lifts running are not days lost to the
      mountain, and no credit arises for them.
    eligibility:
      - id: closure_is_on_record
        applies_to: [tickets_credit_issue]
        kind: authorization
        condition: "A day is lost to the mountain where at least the product's share of the mountain's lifts stood closed for the published operating hours of that date, as the mountain's own operations record shows rather than as the guest recalls the day."
        evidence_fields: [tickets_ledger.ticket_event_id, tickets_ledger.service_date, tickets_ledger.mountain]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [tickets_ledger.ticket_event_id]
          action_bindings:
            tickets_ledger.ticket_event_id: related_event_id
      - id: credit_within_validity
        applies_to: [tickets_credit_redeem]
        kind: time
        condition: "Ticket credit is applied only when it is applied no later than its validity period counted in calendar days from the day the credit was issued."
        evidence_fields: [tickets_ledger.ticket_event_id, tickets_ledger.event_date, tickets_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [tickets_ledger.ticket_event_id]
          action_bindings:
            tickets_ledger.ticket_event_id: related_event_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the credit was issued"
          anchor_source: tickets_ledger.event_date
          relation: not_after
          duration_source: variants.credit_validity_days
          unit: calendar_days
          counting_rule: "Calendar days are counted forward from the anchor date, the anchor date itself counting as day zero, every day of the week counting alike, and a calendar day is never mixed with a full 24-hour period; where the resulting boundary falls on a date that does not exist in the target month, the last day of that month is used."
          boundary: inclusive
    params:
      per_tier:
        Granite Ridge Window Day Ticket: {weather_credit_offered: "=weather_credit_offered", weather_closure_threshold_pct: "=weather_closure_threshold_pct", weather_credit_pct: "=weather_credit_pct", credit_validity_days: "=credit_validity_days", credit_minimum_redemption_usd: "=credit_minimum_redemption_usd"}
        Granite Ridge 3-Day Advance Ticket: {weather_credit_offered: "=weather_credit_offered", weather_closure_threshold_pct: "=weather_closure_threshold_pct", weather_credit_pct: "=weather_credit_pct", credit_validity_days: "=credit_validity_days", credit_minimum_redemption_usd: "=credit_minimum_redemption_usd"}
        Granite Ridge 7-Day Advance Ticket: {weather_credit_offered: "=weather_credit_offered", weather_closure_threshold_pct: "=weather_closure_threshold_pct", weather_credit_pct: "=weather_credit_pct", credit_validity_days: "=credit_validity_days", credit_minimum_redemption_usd: "=credit_minimum_redemption_usd"}
        Granite Ridge Flex 4-Day Ticket Pack: {weather_credit_offered: "=weather_credit_offered", weather_closure_threshold_pct: "=weather_closure_threshold_pct", weather_credit_pct: "=weather_credit_pct", credit_validity_days: "=credit_validity_days", credit_minimum_redemption_usd: "=credit_minimum_redemption_usd"}
        Granite Ridge Flex 8-Day Ticket Pack: {weather_credit_offered: "=weather_credit_offered", weather_closure_threshold_pct: "=weather_closure_threshold_pct", weather_credit_pct: "=weather_credit_pct", credit_validity_days: "=credit_validity_days", credit_minimum_redemption_usd: "=credit_minimum_redemption_usd"}
        Granite Ridge Collective Multi-Mountain Ticket Pack: {weather_credit_offered: "=weather_credit_offered", weather_closure_threshold_pct: "=weather_closure_threshold_pct", weather_credit_pct: "=weather_credit_pct", credit_validity_days: "=credit_validity_days", credit_minimum_redemption_usd: "=credit_minimum_redemption_usd"}

  - id: tickets_refund_and_cancellation
    subject: [tickets_cancel, tickets_refund]
    rule: >
      An order not yet paid for may be abandoned against the product's abandonment fee. A paid order may be
      given back only where the product's refund basis allows it and only when the refund is asked for no
      later than the product's refund window counted in calendar days from the day the order was recorded.
      Calendar days are counted forward from the anchor date, the anchor date itself counting as day zero,
      every day of the week counting alike, and a calendar day is never mixed with a full 24-hour period;
      where the resulting boundary falls on a date that does not exist in the target month, the last day of
      that month is used. On the unused days basis the amount returned is the amount committed to divided by
      the days the order held and multiplied by the days still unused, less the product's refund fee; on the
      full price basis the whole amount committed to comes back less that fee; on the no refund basis
      nothing comes back at all. What comes back is issued as ticket credit rather than returned to the
      payment method, which is a finance team decision.
    eligibility:
      - id: within_refund_window
        applies_to: [tickets_refund]
        kind: time
        condition: "A paid order may be given back only where the product's refund basis allows it and only when the refund is asked for no later than the product's refund window counted in calendar days from the day the order was recorded."
        evidence_fields: [tickets_holdings.ticket_order_id, tickets_holdings.ordered_date, tickets_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [tickets_holdings.ticket_order_id]
          action_bindings:
            tickets_holdings.ticket_order_id: ticket_order_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the order was recorded"
          anchor_source: tickets_holdings.ordered_date
          relation: not_after
          duration_source: variants.refund_window_days
          unit: calendar_days
          counting_rule: "Calendar days are counted forward from the anchor date, the anchor date itself counting as day zero, every day of the week counting alike, and a calendar day is never mixed with a full 24-hour period; where the resulting boundary falls on a date that does not exist in the target month, the last day of that month is used."
          boundary: inclusive
    params:
      per_tier:
        Granite Ridge Window Day Ticket: {refund_basis: "=refund_basis", refund_window_days: "=refund_window_days", refund_fee_usd: "=refund_fee_usd", cancellation_fee_usd: "=cancellation_fee_usd"}
        Granite Ridge 3-Day Advance Ticket: {refund_basis: "=refund_basis", refund_window_days: "=refund_window_days", refund_fee_usd: "=refund_fee_usd", cancellation_fee_usd: "=cancellation_fee_usd"}
        Granite Ridge 7-Day Advance Ticket: {refund_basis: "=refund_basis", refund_window_days: "=refund_window_days", refund_fee_usd: "=refund_fee_usd", cancellation_fee_usd: "=cancellation_fee_usd"}
        Granite Ridge Flex 4-Day Ticket Pack: {refund_basis: "=refund_basis", refund_window_days: "=refund_window_days", refund_fee_usd: "=refund_fee_usd", cancellation_fee_usd: "=cancellation_fee_usd"}
        Granite Ridge Flex 8-Day Ticket Pack: {refund_basis: "=refund_basis", refund_window_days: "=refund_window_days", refund_fee_usd: "=refund_fee_usd", cancellation_fee_usd: "=cancellation_fee_usd"}
        Granite Ridge Collective Multi-Mountain Ticket Pack: {refund_basis: "=refund_basis", refund_window_days: "=refund_window_days", refund_fee_usd: "=refund_fee_usd", cancellation_fee_usd: "=cancellation_fee_usd"}
    measures: [tickets_msr_days_redeemed]

  - id: tickets_expiry_and_closure
    subject: [tickets_expire, tickets_close]
    rule: >
      Days on an order must be used by the product's last valid date, and a block of days runs out its
      validity period from the first date it was valid whether or not any day was skied. On that date the
      order is marked expired and the days still unused are gone; they are not carried into another season
      and they are not refunded. An order record is closed only when nothing is left to collect on it and no
      ticket credit issued on it is left to spend. Closing is the last write on the record and nothing is
      added to it afterwards. Ticket credit issued against a closed order keeps its own validity period and
      is spent against a later order.
    eligibility:
      - id: order_fully_settled
        applies_to: [tickets_close]
        kind: authorization
        condition: "An order record is closed only when nothing is left to collect on it and no ticket credit issued on it is left to spend."
        evidence_fields: [tickets_holdings.ticket_order_id, tickets_holdings.order_balance_usd, tickets_holdings.ticket_credit_usd]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [tickets_holdings.ticket_order_id]
          action_bindings:
            tickets_holdings.ticket_order_id: ticket_order_id
    params:
      per_tier:
        Granite Ridge Window Day Ticket: {validity_days: "=validity_days", valid_from_date: "=valid_from_date", valid_to_date: "=valid_to_date", season_code: "=season_code", credit_validity_days: "=credit_validity_days"}
        Granite Ridge 3-Day Advance Ticket: {validity_days: "=validity_days", valid_from_date: "=valid_from_date", valid_to_date: "=valid_to_date", season_code: "=season_code", credit_validity_days: "=credit_validity_days"}
        Granite Ridge 7-Day Advance Ticket: {validity_days: "=validity_days", valid_from_date: "=valid_from_date", valid_to_date: "=valid_to_date", season_code: "=season_code", credit_validity_days: "=credit_validity_days"}
