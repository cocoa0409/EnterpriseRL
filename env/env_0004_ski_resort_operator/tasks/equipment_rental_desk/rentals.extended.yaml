    measures: [rentals_msr_swaps_used]

  - id: rentals_deposit_and_damage
    subject: [rentals_deposit_hold, rentals_deposit_release, rentals_damage_charge]
    rule: >
      Every agreement carries a security hold sized to the package, placed against the guest's payment
      method when kit is set aside rather than when it is collected. A security hold is placed only while
      the agreement stands in the confirmed or picked_up state. Kit handed in is checked by a technician,
      and what is found is recorded against the serial of the item rather than against the agreement as a
      whole, so two damaged items on one agreement are two assessments. Fair wear on edges and bases is not
      charged. Where the guest took the damage waiver, the collective bears the assessed amount above the
      package's excess and the guest bears the excess; where they did not, the guest bears the whole
      assessed amount. Kit that never comes back is charged at the package's replacement value rather than
      assessed for damage, and the waiver does not cover it. The hold is released once the assessment is
      settled, in whole where nothing is owed and in part where something is. The hold is released no later
      than the package's release period counted in business days from the day the kit was handed in.
      Business days are counted forward from the anchor date, the anchor date itself counting as day zero,
      only days the collective's finance office is open counting, which excludes Saturdays, Sundays and the
      collective's published holidays, and business days are never mixed with calendar days. A hold is
      released only while the agreement stands in the overdue, returned, cancelled or no_show state.
    eligibility:
      - id: hold_placement_state
        applies_to: [rentals_deposit_hold]
        kind: state
        condition: "A security hold is placed only while the agreement stands in the confirmed or picked_up state."
        evidence_fields: [rentals_holdings.rental_id, rentals_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rentals_holdings.rental_id]
          action_bindings:
            rentals_holdings.rental_id: rental_id
        state_contract:
          field: rentals_holdings.status
          allowed: [confirmed, picked_up]
      - id: hold_release_state
        applies_to: [rentals_deposit_release]
        kind: state
        condition: "A hold is released only while the agreement stands in the overdue, returned, cancelled or no_show state."
        evidence_fields: [rentals_holdings.rental_id, rentals_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rentals_holdings.rental_id]
          action_bindings:
            rentals_holdings.rental_id: rental_id
        state_contract:
          field: rentals_holdings.status
          allowed: [overdue, returned, cancelled, no_show]
      - id: hold_release_window
        applies_to: [rentals_deposit_release]
        kind: time
        condition: "The hold is released no later than the package's release period counted in business days from the day the kit was handed in."
        evidence_fields: [rentals_holdings.rental_id, rentals_holdings.returned_date, rentals_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rentals_holdings.rental_id]
          action_bindings:
            rentals_holdings.rental_id: rental_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the kit was handed in"
          anchor_source: rentals_holdings.returned_date
          relation: not_after
          duration_source: variants.deposit_release_days
          unit: business_days
          counting_rule: "Business days are counted forward from the anchor date, the anchor date itself counting as day zero, only days the collective's finance office is open counting, which excludes Saturdays, Sundays and the collective's published holidays, and business days are never mixed with calendar days."
          boundary: inclusive
    params:
      per_tier:
        Junior Ski & Board Rental: {damage_deposit_usd: "=damage_deposit_usd", damage_waiver_offered: "=damage_waiver_offered", damage_waiver_daily_usd: "=damage_waiver_daily_usd", damage_waiver_excess_usd: "=damage_waiver_excess_usd", replacement_value_usd: "=replacement_value_usd", deposit_release_days: "=deposit_release_days"}
        Basic Ski & Board Rental: {damage_deposit_usd: "=damage_deposit_usd", damage_waiver_offered: "=damage_waiver_offered", damage_waiver_daily_usd: "=damage_waiver_daily_usd", damage_waiver_excess_usd: "=damage_waiver_excess_usd", replacement_value_usd: "=replacement_value_usd", deposit_release_days: "=deposit_release_days"}
        Sport Ski & Board Rental: {damage_deposit_usd: "=damage_deposit_usd", damage_waiver_offered: "=damage_waiver_offered", damage_waiver_daily_usd: "=damage_waiver_daily_usd", damage_waiver_excess_usd: "=damage_waiver_excess_usd", replacement_value_usd: "=replacement_value_usd", deposit_release_days: "=deposit_release_days"}
        Performance Ski & Board Rental: {damage_deposit_usd: "=damage_deposit_usd", damage_waiver_offered: "=damage_waiver_offered", damage_waiver_daily_usd: "=damage_waiver_daily_usd", damage_waiver_excess_usd: "=damage_waiver_excess_usd", replacement_value_usd: "=replacement_value_usd", deposit_release_days: "=deposit_release_days"}
        Demo Ski & Board Rental: {damage_deposit_usd: "=damage_deposit_usd", damage_waiver_offered: "=damage_waiver_offered", damage_waiver_daily_usd: "=damage_waiver_daily_usd", damage_waiver_excess_usd: "=damage_waiver_excess_usd", replacement_value_usd: "=replacement_value_usd", deposit_release_days: "=deposit_release_days"}
        Season-Long Lease Package: {damage_deposit_usd: "=damage_deposit_usd", damage_waiver_offered: "=damage_waiver_offered", damage_waiver_daily_usd: "=damage_waiver_daily_usd", damage_waiver_excess_usd: "=damage_waiver_excess_usd", replacement_value_usd: "=replacement_value_usd", deposit_release_days: "=deposit_release_days"}

  - id: rentals_late_return
    subject: [rentals_mark_overdue, rentals_fee_charge]
    rule: >
      Kit is due back by the shop's closing time on the date written on the agreement. Kit is flagged as
      overdue only once the grace period has run out counted in elapsed hours from the time the kit was due
      back. The grace period is measured in whole elapsed hours on the shop's local clock, counted forward
      from the shop's closing time on the date the kit was due back; elapsed hours are never mixed with
      calendar days, and an hour begun is not an hour elapsed. From then the package's late fee is raised
      for each calendar day the kit stays out, counted from the day after the due date through the day it
      is handed in inclusive, and a day begun is charged as a whole day. A fee is raised against an
      agreement only while the agreement stands in the confirmed, picked_up, overdue, returned, cancelled or
      no_show state. Once the kit has been out beyond the package's replacement threshold it is treated as
      not coming back: late fees stop accruing, the package's replacement value is charged instead, and the
      security hold is applied against it. Kit handed in after being charged as a replacement is refunded
      the replacement value less the late fees that had accrued to the threshold, and the shop, not the
      desk, decides whether the item is fit to go back into stock.
    eligibility:
      - id: grace_has_run_out
        applies_to: [rentals_mark_overdue]
        kind: time
        condition: "Kit is flagged as overdue only once the grace period has run out counted in elapsed hours from the time the kit was due back."
        evidence_fields: [rentals_holdings.rental_id, rentals_holdings.due_date, rentals_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rentals_holdings.rental_id]
          action_bindings:
            rentals_holdings.rental_id: rental_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the kit was due back"
          anchor_source: rentals_holdings.due_date
          relation: not_before
          duration_source: variants.late_return_grace_hours
          unit: elapsed_hours
          counting_rule: "The grace period is measured in whole elapsed hours on the shop's local clock, counted forward from the shop's closing time on the date the kit was due back; elapsed hours are never mixed with calendar days, and an hour begun is not an hour elapsed."
          boundary: inclusive
      - id: fee_bearing_agreement_state
        applies_to: [rentals_fee_charge]
        kind: state
        condition: "A fee is raised against an agreement only while the agreement stands in the confirmed, picked_up, overdue, returned, cancelled or no_show state."
        evidence_fields: [rentals_holdings.rental_id, rentals_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rentals_holdings.rental_id]
          action_bindings:
            rentals_holdings.rental_id: rental_id
        state_contract:
          field: rentals_holdings.status
          allowed: [confirmed, picked_up, overdue, returned, cancelled, no_show]
    params:
      per_tier:
        Junior Ski & Board Rental: {late_return_grace_hours: "=late_return_grace_hours", late_return_fee_per_day_usd: "=late_return_fee_per_day_usd", max_late_days_before_replacement: "=max_late_days_before_replacement", replacement_value_usd: "=replacement_value_usd"}
        Basic Ski & Board Rental: {late_return_grace_hours: "=late_return_grace_hours", late_return_fee_per_day_usd: "=late_return_fee_per_day_usd", max_late_days_before_replacement: "=max_late_days_before_replacement", replacement_value_usd: "=replacement_value_usd"}
        Sport Ski & Board Rental: {late_return_grace_hours: "=late_return_grace_hours", late_return_fee_per_day_usd: "=late_return_fee_per_day_usd", max_late_days_before_replacement: "=max_late_days_before_replacement", replacement_value_usd: "=replacement_value_usd"}
        Performance Ski & Board Rental: {late_return_grace_hours: "=late_return_grace_hours", late_return_fee_per_day_usd: "=late_return_fee_per_day_usd", max_late_days_before_replacement: "=max_late_days_before_replacement", replacement_value_usd: "=replacement_value_usd"}
        Demo Ski & Board Rental: {late_return_grace_hours: "=late_return_grace_hours", late_return_fee_per_day_usd: "=late_return_fee_per_day_usd", max_late_days_before_replacement: "=max_late_days_before_replacement", replacement_value_usd: "=replacement_value_usd"}
        Season-Long Lease Package: {late_return_grace_hours: "=late_return_grace_hours", late_return_fee_per_day_usd: "=late_return_fee_per_day_usd", max_late_days_before_replacement: "=max_late_days_before_replacement", replacement_value_usd: "=replacement_value_usd"}

  - id: rentals_cancellation
    subject: [rentals_cancel, rentals_no_show]
    rule: >
      A guest may give a reservation up before the kit is collected. A cancellation carries no fee only when
      it is recorded on or before the free cancellation deadline, which is the package's free cancellation
      period measured back from the start of the collection date. The notice period is measured in whole
      elapsed hours on the shop's local clock and is subtracted from the start of the collection date to
      give the deadline; elapsed hours are never mixed with calendar days, and an hour begun is not an hour
      elapsed. Inside the deadline the whole agreement value comes back and the security hold is released.
      After it, the package's cancellation share of the agreement value is retained and the rest comes back.
      A guest who never collects the kit and never cancels is treated as an uncollected reservation once the
      hold period has run out, and the package's uncollected share is retained instead. Where the collective
      cannot supply kit of the right size, or the mountain does not open, nothing is retained and the whole
      agreement value comes back whenever the cancellation is recorded. Kit already collected is never
      cancelled; it is handed in, and the days already used stand.
    eligibility:
      - id: free_cancellation_deadline
        applies_to: [rentals_cancel]
        kind: time
        condition: "A cancellation carries no fee only when it is recorded on or before the free cancellation deadline, which is the package's free cancellation period measured back from the start of the collection date."
        evidence_fields: [rentals_holdings.rental_id, rentals_holdings.pickup_date, rentals_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rentals_holdings.rental_id]
          action_bindings:
            rentals_holdings.rental_id: rental_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the collection date"
          anchor_source: rentals_holdings.pickup_date
          relation: not_after
          duration_source: variants.free_cancellation_hours
          unit: elapsed_hours
          counting_rule: "The notice period is measured in whole elapsed hours on the shop's local clock and is subtracted from the start of the collection date to give the deadline; elapsed hours are never mixed with calendar days, and an hour begun is not an hour elapsed."
          boundary: inclusive
    params:
      per_tier:
        Junior Ski & Board Rental: {free_cancellation_hours: "=free_cancellation_hours", cancellation_fee_pct: "=cancellation_fee_pct", no_show_fee_pct: "=no_show_fee_pct", reservation_hold_hours: "=reservation_hold_hours"}
        Basic Ski & Board Rental: {free_cancellation_hours: "=free_cancellation_hours", cancellation_fee_pct: "=cancellation_fee_pct", no_show_fee_pct: "=no_show_fee_pct", reservation_hold_hours: "=reservation_hold_hours"}
        Sport Ski & Board Rental: {free_cancellation_hours: "=free_cancellation_hours", cancellation_fee_pct: "=cancellation_fee_pct", no_show_fee_pct: "=no_show_fee_pct", reservation_hold_hours: "=reservation_hold_hours"}
        Performance Ski & Board Rental: {free_cancellation_hours: "=free_cancellation_hours", cancellation_fee_pct: "=cancellation_fee_pct", no_show_fee_pct: "=no_show_fee_pct", reservation_hold_hours: "=reservation_hold_hours"}
        Demo Ski & Board Rental: {free_cancellation_hours: "=free_cancellation_hours", cancellation_fee_pct: "=cancellation_fee_pct", no_show_fee_pct: "=no_show_fee_pct", reservation_hold_hours: "=reservation_hold_hours"}
        Season-Long Lease Package: {free_cancellation_hours: "=free_cancellation_hours", cancellation_fee_pct: "=cancellation_fee_pct", no_show_fee_pct: "=no_show_fee_pct", reservation_hold_hours: "=reservation_hold_hours"}

  - id: rentals_return_and_closure
    subject: [rentals_return, rentals_close]
    rule: >
      Kit is handed in at a shop, checked by a technician and taken back into stock. Where the package
      allows it, kit may be handed in at any of the collective's shops that carry the package, against the
      package's cross-mountain fee; where it does not, kit handed in elsewhere is moved back by the
      collective and the fee is raised all the same. The date of hand-in is the date the kit reaches the
      counter, not the date the guest says they finished with it, and an after-hours drop box is treated as
      the next opening morning. An agreement is closed only when nothing is left to collect on it and the
      security hold has been released or applied in full. Closing is the last write on the agreement and
      nothing is added to it afterwards. Kit belonging to a season lease is handed in at the end of the
      season it was written for, and a lease handed in early is not refunded for the season remaining
      because the price was for the season and not for the days.
    eligibility:
      - id: agreement_fully_settled
        applies_to: [rentals_close]
        kind: authorization
        condition: "An agreement is closed only when nothing is left to collect on it and the security hold has been released or applied in full."
        evidence_fields: [rentals_holdings.rental_id, rentals_holdings.rental_balance_usd, rentals_holdings.damage_deposit_usd]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
