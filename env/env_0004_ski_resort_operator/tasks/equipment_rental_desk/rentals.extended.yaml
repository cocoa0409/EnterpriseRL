        length of the agreement is the calendar days from the collection date through the date written on
        the agreement inclusive. The day rate is the package's shop day rate. The days charged for are the
        dates the account shows the kit out. No passholder share is taken off. No bundle share is taken off. No advance booking share is taken off.
        The passholder share acts on the days charged for at the day rate, the bundle share acts on the
        amount the passholder step left, and the advance booking share acts on the amount the bundle step
        left; the three are never combined into one share. The amount is rounded half up to two decimal
