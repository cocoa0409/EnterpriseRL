      params: [daily_rate_usd, multi_day_daily_rate_usd, multi_day_threshold_days, weekly_rate_usd, passholder_discount_pct, lesson_bundle_discount_pct, lodging_bundle_discount_pct, advance_booking_discount_pct, advance_booking_days_min]
