measures:
  - id: rentals_msr_days_used
    window: "The life of the agreement, from the date the kit was collected through the handling date inclusive."
    measure: "Count of rentals_ledger rows of event_type rentals_day_consume carrying this rental_id."
  - id: rentals_msr_swaps_used
    window: "The life of the agreement, from the date it was recorded through the handling date inclusive."
    measure: "Count of rentals_ledger rows of event_type rentals_fee_charge carrying this rental_id whose charge_category is swap_fee."

policies:
  - id: rentals_agg_multi_holding
    subject: [rentals_reserve]
    rule: >
      A household account carries a separate rental agreement for every rider, because kit is fitted to one
      body and one ability level. A family of four hiring together holds four agreements on one account,
      each with its own sizes, its own security hold and its own dates. The account may carry several live
      agreements at once up to the number this charter allows, counting agreements in the reserved,
      confirmed, picked_up and overdue states. Two live agreements for the same rider over overlapping dates
      are never opened; where the guest wants a second package for the same rider on the same dates the
      first agreement is changed rather than a second one added. Agreements that have reached returned,
      cancelled, no_show or closed no longer count against the account.
    eligibility:
      - id: one_live_agreement_per_rider
        applies_to: [rentals_reserve]
        kind: dedup
        condition: "Two live agreements for the same rider over overlapping dates are never opened; where the guest wants a second package for the same rider on the same dates the first agreement is changed rather than a second one added."
        evidence_fields: [rentals_holdings.customer_id, rentals_holdings.renter_name, rentals_holdings.pickup_date, rentals_holdings.due_date, rentals_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rentals_holdings.customer_id, rentals_holdings.renter_name, rentals_holdings.pickup_date]
          action_bindings:
            rentals_holdings.customer_id: customer_id
            rentals_holdings.renter_name: renter_name
            rentals_holdings.pickup_date: pickup_date
        dedup_contract:
          table: rentals_holdings
          mode: separate_record
          object_bindings: {renter_name: renter_name, pickup_date: pickup_date}
          duplicate_filters: {status: [reserved, confirmed, picked_up, overdue]}
          distinct_fields: [variant_name, pickup_mountain]
    params:
      max_per_customer: 6

  - id: rentals_agg_party_pricing
    subject: [rentals_reserve, rentals_rate_charge]
    rule: >
      Agreements opened together for one household are priced as a party. The season passholder reduction is
      taken per rider, on the evidence of a pass registered to that rider standing in the active state, and
      it is not lent from one rider to another. The lesson bundle reduction is taken where the same rider
      also holds a snowsports school booking over the same dates, and the lodging bundle reduction where the
      household holds collective lodging over the same dates. Where more than one bundle reduction would
      apply to the same agreement, only the largest is taken; they are never added together. Bundle
      reductions are worked out on the rate after the passholder reduction and before any advance booking
      reduction, and a booking that later loses the holding it was bundled with keeps the reduction it was
      given at the time.
    eligibility: []
    params:
      per_tier:
        Junior Ski & Board Rental: {passholder_discount_pct: "=passholder_discount_pct", lesson_bundle_discount_pct: "=lesson_bundle_discount_pct", lodging_bundle_discount_pct: "=lodging_bundle_discount_pct"}
        Basic Ski & Board Rental: {passholder_discount_pct: "=passholder_discount_pct", lesson_bundle_discount_pct: "=lesson_bundle_discount_pct", lodging_bundle_discount_pct: "=lodging_bundle_discount_pct"}
        Sport Ski & Board Rental: {passholder_discount_pct: "=passholder_discount_pct", lesson_bundle_discount_pct: "=lesson_bundle_discount_pct", lodging_bundle_discount_pct: "=lodging_bundle_discount_pct"}
        Performance Ski & Board Rental: {passholder_discount_pct: "=passholder_discount_pct", lesson_bundle_discount_pct: "=lesson_bundle_discount_pct", lodging_bundle_discount_pct: "=lodging_bundle_discount_pct"}
        Demo Ski & Board Rental: {passholder_discount_pct: "=passholder_discount_pct", lesson_bundle_discount_pct: "=lesson_bundle_discount_pct", lodging_bundle_discount_pct: "=lodging_bundle_discount_pct"}
        Season-Long Lease Package: {passholder_discount_pct: "=passholder_discount_pct", lesson_bundle_discount_pct: "=lesson_bundle_discount_pct", lodging_bundle_discount_pct: "=lodging_bundle_discount_pct"}

  - id: rentals_reservation_terms
    subject: [rentals_reserve, rentals_confirm, rentals_reserve_load]
    rule: >
      A reservation is taken for a stated rider over stated dates, and the number of days must fall between
      the package's shortest and longest terms. The rider's height, weight, age and ability are what the
      fitting is worked from, and a rider outside the package's fitting range is moved to the package that
      does fit them rather than fitted into this one. Kit is set aside only once the security hold has been
      taken and the sizes are on the agreement. A reservation is held for the package's hold period after
      the collection date passes, and kit set aside for a reservation nobody comes for is released back to
      the shop floor. The block of rental days is loaded only while the agreement stands in the confirmed or
      picked_up state. Where the package is only carried at some of the collective's shops, the collection
      mountain must be one of them, and a guest asking to collect elsewhere is offered the nearest package
      that shop does carry.
    eligibility:
      - id: block_load_state
        applies_to: [rentals_reserve_load]
        kind: state
        condition: "The block of rental days is loaded only while the agreement stands in the confirmed or picked_up state."
        evidence_fields: [rentals_holdings.rental_id, rentals_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rentals_holdings.rental_id]
          action_bindings:
            rentals_holdings.rental_id: rental_id
        state_contract:
          field: rentals_holdings.status
          allowed: [confirmed, picked_up]
    params:
      per_tier:
        Junior Ski & Board Rental: {min_rental_days: "=min_rental_days", max_rental_days: "=max_rental_days", min_rider_height_cm: "=min_rider_height_cm", max_rider_height_cm: "=max_rider_height_cm", min_rider_weight_kg: "=min_rider_weight_kg", max_rider_weight_kg: "=max_rider_weight_kg", min_age_years: "=min_age_years", max_age_years: "=max_age_years", reservation_hold_hours: "=reservation_hold_hours", pickup_locations: "=pickup_locations"}
        Basic Ski & Board Rental: {min_rental_days: "=min_rental_days", max_rental_days: "=max_rental_days", min_rider_height_cm: "=min_rider_height_cm", max_rider_height_cm: "=max_rider_height_cm", min_rider_weight_kg: "=min_rider_weight_kg", max_rider_weight_kg: "=max_rider_weight_kg", min_age_years: "=min_age_years", max_age_years: "=max_age_years", reservation_hold_hours: "=reservation_hold_hours", pickup_locations: "=pickup_locations"}
        Sport Ski & Board Rental: {min_rental_days: "=min_rental_days", max_rental_days: "=max_rental_days", min_rider_height_cm: "=min_rider_height_cm", max_rider_height_cm: "=max_rider_height_cm", min_rider_weight_kg: "=min_rider_weight_kg", max_rider_weight_kg: "=max_rider_weight_kg", min_age_years: "=min_age_years", max_age_years: "=max_age_years", reservation_hold_hours: "=reservation_hold_hours", pickup_locations: "=pickup_locations"}
        Performance Ski & Board Rental: {min_rental_days: "=min_rental_days", max_rental_days: "=max_rental_days", min_rider_height_cm: "=min_rider_height_cm", max_rider_height_cm: "=max_rider_height_cm", min_rider_weight_kg: "=min_rider_weight_kg", max_rider_weight_kg: "=max_rider_weight_kg", min_age_years: "=min_age_years", max_age_years: "=max_age_years", reservation_hold_hours: "=reservation_hold_hours", pickup_locations: "=pickup_locations"}
        Demo Ski & Board Rental: {min_rental_days: "=min_rental_days", max_rental_days: "=max_rental_days", min_rider_height_cm: "=min_rider_height_cm", max_rider_height_cm: "=max_rider_height_cm", min_rider_weight_kg: "=min_rider_weight_kg", max_rider_weight_kg: "=max_rider_weight_kg", min_age_years: "=min_age_years", max_age_years: "=max_age_years", reservation_hold_hours: "=reservation_hold_hours", pickup_locations: "=pickup_locations"}
        Season-Long Lease Package: {min_rental_days: "=min_rental_days", max_rental_days: "=max_rental_days", min_rider_height_cm: "=min_rider_height_cm", max_rider_height_cm: "=max_rider_height_cm", min_rider_weight_kg: "=min_rider_weight_kg", max_rider_weight_kg: "=max_rider_weight_kg", min_age_years: "=min_age_years", max_age_years: "=max_age_years", reservation_hold_hours: "=reservation_hold_hours", pickup_locations: "=pickup_locations"}

  - id: rentals_pricing
    subject: [rentals_rate_charge, rentals_payment]
    rule: >
      The rate for an agreement is worked out from the number of rental days it covers. Below the package's
      multi-day threshold the shop day rate applies to every day; at or above the threshold the multi-day
      day rate applies to every day, not only to the days beyond the threshold; a full seven-day block is
      charged at the package's weekly rate where that is the lower of the two. A season lease is charged at
      its own price and no day rate applies to it at all. The advance booking reduction is taken where the
      reservation was recorded at least the package's advance period before the collection date, and it is
      taken after the passholder and bundle reductions. Add-ons the guest takes are raised as their own
      entries at the package's add-on prices, and an add-on already included in the package is never raised
      as a charge. A charge is raised against an agreement only while the agreement stands in the reserved,
      confirmed, picked_up or overdue state. The package's payment point decides when the money is taken: at
      booking, at collection, or at hand-in with the security hold standing in the meantime.
    eligibility:
      - id: chargeable_agreement_state
        applies_to: [rentals_rate_charge]
        kind: state
        condition: "A charge is raised against an agreement only while the agreement stands in the reserved, confirmed, picked_up or overdue state."
        evidence_fields: [rentals_holdings.rental_id, rentals_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rentals_holdings.rental_id]
          action_bindings:
            rentals_holdings.rental_id: rental_id
        state_contract:
          field: rentals_holdings.status
          allowed: [reserved, confirmed, picked_up, overdue]
    params:
      per_tier:
        Junior Ski & Board Rental: {daily_rate_usd: "=daily_rate_usd", multi_day_daily_rate_usd: "=multi_day_daily_rate_usd", multi_day_threshold_days: "=multi_day_threshold_days", weekly_rate_usd: "=weekly_rate_usd", season_lease_price_usd: "=season_lease_price_usd", advance_booking_discount_pct: "=advance_booking_discount_pct", advance_booking_days_min: "=advance_booking_days_min", helmet_daily_rate_usd: "=helmet_daily_rate_usd", performance_boot_upgrade_usd: "=performance_boot_upgrade_usd", tuning_fee_usd: "=tuning_fee_usd", delivery_fee_usd: "=delivery_fee_usd", overnight_storage_daily_usd: "=overnight_storage_daily_usd", payment_due_point: "=payment_due_point"}
        Basic Ski & Board Rental: {daily_rate_usd: "=daily_rate_usd", multi_day_daily_rate_usd: "=multi_day_daily_rate_usd", multi_day_threshold_days: "=multi_day_threshold_days", weekly_rate_usd: "=weekly_rate_usd", season_lease_price_usd: "=season_lease_price_usd", advance_booking_discount_pct: "=advance_booking_discount_pct", advance_booking_days_min: "=advance_booking_days_min", helmet_daily_rate_usd: "=helmet_daily_rate_usd", performance_boot_upgrade_usd: "=performance_boot_upgrade_usd", tuning_fee_usd: "=tuning_fee_usd", delivery_fee_usd: "=delivery_fee_usd", overnight_storage_daily_usd: "=overnight_storage_daily_usd", payment_due_point: "=payment_due_point"}
        Sport Ski & Board Rental: {daily_rate_usd: "=daily_rate_usd", multi_day_daily_rate_usd: "=multi_day_daily_rate_usd", multi_day_threshold_days: "=multi_day_threshold_days", weekly_rate_usd: "=weekly_rate_usd", season_lease_price_usd: "=season_lease_price_usd", advance_booking_discount_pct: "=advance_booking_discount_pct", advance_booking_days_min: "=advance_booking_days_min", helmet_daily_rate_usd: "=helmet_daily_rate_usd", performance_boot_upgrade_usd: "=performance_boot_upgrade_usd", tuning_fee_usd: "=tuning_fee_usd", delivery_fee_usd: "=delivery_fee_usd", overnight_storage_daily_usd: "=overnight_storage_daily_usd", payment_due_point: "=payment_due_point"}
        Performance Ski & Board Rental: {daily_rate_usd: "=daily_rate_usd", multi_day_daily_rate_usd: "=multi_day_daily_rate_usd", multi_day_threshold_days: "=multi_day_threshold_days", weekly_rate_usd: "=weekly_rate_usd", season_lease_price_usd: "=season_lease_price_usd", advance_booking_discount_pct: "=advance_booking_discount_pct", advance_booking_days_min: "=advance_booking_days_min", helmet_daily_rate_usd: "=helmet_daily_rate_usd", performance_boot_upgrade_usd: "=performance_boot_upgrade_usd", tuning_fee_usd: "=tuning_fee_usd", delivery_fee_usd: "=delivery_fee_usd", overnight_storage_daily_usd: "=overnight_storage_daily_usd", payment_due_point: "=payment_due_point"}
