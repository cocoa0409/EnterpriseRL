    factors:
      - id: extra_day_rate_basis
        effect: method
        decides: extra_day_figure
        bindings: [rate_charged, extra_day_figure]
        ladder:
          - when: "the account carries the hire rate for the agreement and the agreement was written for at least the package's multi-day threshold in days"
            method: "each extra day is charged at the hire rate standing on the account divided by the days the agreement was written for, rounded half up to two decimal places"
          - when: "the account carries the hire rate for the agreement and the agreement was written for fewer days than the package's multi-day threshold"
            method: "each extra day is charged at the package's shop day rate"
          - when: "otherwise"
            method: "each extra day is charged at the package's multi-day day rate"
        baseline:
          extra_day_figure: "P('multi_day_daily_rate_usd')"
        evidence: [history]
        cross_difficulty: null
      - id: free_extension_days
        effect: parameter
        decides: free_extra_days
        bindings: [pass_active, season_scan_count, free_extra_days]
        ladder:
          - when: "the rider holds a season pass standing active for the season and the pass account carries at least the regular skier scan threshold of lift scans in the three months before the extension is priced"
            value: "K('regular_free_days')"
          - when: "the rider holds a season pass standing active for the season and the pass account carries fewer lift scans than that threshold in those three months"
            value: "K('passholder_free_days')"
          - when: "otherwise"
            value: "0"
        baseline:
          free_extra_days: "0"
        evidence: [cross_category]
        cross_difficulty: passes
      - id: residence_share_level
        effect: parameter
        decides: residence_share
        bindings: [lodging_departure_date, residence_share]
        ladder:
          - when: "the household holds a collective lodging reservation for the season whose departure date falls on or after the date the guest has asked the kit to be kept to"
            value: "K('resident_share_pct')"
          - when: "the household holds a collective lodging reservation for the season whose departure date falls before the date the guest has asked the kit to be kept to"
            value: "K('post_stay_share_pct')"
          - when: "otherwise"
            value: "the daily figure in full"
        baseline:
          residence_share: "1.0"
        evidence: [cross_category, date]
        cross_difficulty: lodging
      - id: notice_share_level
        effect: parameter
        decides: notice_share
        bindings: [notice_lead_days, notice_share]
        ladder:
          - when: "the shop holds the request to keep the kit to a later date raised at least the early notice days before the date written on the agreement"
            value: "K('early_notice_pct')"
          - when: "the request to keep the kit to a later date was raised on or after the date written on the agreement"
            value: "K('late_notice_pct')"
          - when: "otherwise"
            value: "the daily figure in full"
        baseline:
          notice_share: "1.0"
        evidence: [date, history]
        cross_difficulty: null
      - id: helmet_carry_on
        effect: parameter
        decides: helmet_day_addition
        bindings: [helmet_addon_entries, helmet_day_addition]
        ladder:
          - when: "the account carries the package's helmet add-on against the agreement and the agreement stands with the kit out"
            value: "P('helmet_daily_rate_usd')"
          - when: "the account carries the package's helmet add-on against the agreement and the agreement does not stand with the kit out"
            value: "half of P('helmet_daily_rate_usd')"
          - when: "otherwise"
            value: "0"
        baseline:
          helmet_day_addition: "0"
        evidence: [history]
        cross_difficulty: null
      - id: extension_fee_level
        effect: parameter
        decides: extension_fee_due
        bindings: [change_fee_entries, extension_fee_due]
        ladder:
          - when: "the account carries the shop's fee for a change of model against the agreement and the agreement was written for at least the package's multi-day threshold in days"
            value: "0"
          - when: "the account carries the shop's fee for a change of model against the agreement and the agreement was written for fewer days than the package's multi-day threshold"
            value: "half of P('extension_fee_usd')"
          - when: "otherwise"
            value: "P('extension_fee_usd')"
        baseline:
          extension_fee_due: "P('extension_fee_usd')"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The charge for keeping hire kit longer than the agreement was written for rests on the extra days
        asked for and the daily figure those days are charged at. The extra days are the calendar days from
        the date written on the agreement to the date the guest has asked the kit to be kept to, and they
        are never more than the package's extension limit and never below zero. No day of the extension is
        given free. The days given free are taken off the extra days before the charge is worked out, and
        the extra days are never taken below zero after they are taken off. Each extra day is charged at
        the package's multi-day day rate, and the package's extension fee is raised on top of the extra
        days. The daily figure is taken in full, without where the guest is staying weighed against it.
        The daily figure is taken in full, without the notice the guest gave weighed against it. Nothing is
        added to the daily figure for a helmet carried on into the extra days. The package's extension fee
        is raised in full on top. The daily figure is first taken at the resident share, and the figure that step leaves is
        then taken at the notice share, so the notice share acts on what the resident share left and
        not on the daily figure the step before it started from; the helmet addition is added to the
        figure the two shares leave, and the extension fee is added once to the whole rather than to
        each day. The
        charge is worked out once and rounded half up to two decimal places. An extension is recorded before the kit falls due, and kit already overdue is handled as a
        late hand-in instead. Where the package is one the collective does not extend, no charge for
        extra days arises under this rule and the agreement runs to the date written on it. A season
        lease is not extended at all.
      params: [multi_day_daily_rate_usd, extension_fee_usd, extension_max_days, extension_allowed]
    inputs:
      history:
        - {table: rentals_requests, aggregate: latest, field: requested_due_date, within_months: null, filters: {request_type: extension}}
        - {table: rentals_ledger, aggregate: sum, field: amount_usd, within_months: null, filters: {event_type: rentals_rate_charge, charge_category: rental_rate}}
        - {table: rentals_ledger, aggregate: count, field: rental_event_id, within_months: null, filters: {event_type: rentals_fee_charge, charge_category: swap_fee}}
        - {category: passes, table: passes_ledger, aggregate: count, field: pass_event_id, within_months: 3, filters: {event_type: passes_scan}}
      cross_category: [passes, lodging]
