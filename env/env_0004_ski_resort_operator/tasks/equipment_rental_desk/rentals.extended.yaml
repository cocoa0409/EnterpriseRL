            method: "the amount kept back is carried up to the whole dollar above"
          - when: "the kit reached the counter at least the prompt settlement day count of days before the hold is settled and the account carries one payment or none against the agreement"
            method: "the greater of the amount kept back and the assessments raised on the agreement is kept back, taken to the cent and never more than what the agreement still owes"
          - when: "otherwise"
            method: "the amount kept back is taken to the cent"
        baseline:
          retained_amount: "RND(retained_raw, 2)"
        evidence: [date, history]
        cross_difficulty: null
    baseline:
