            value: "K('assessed_retention_multiple_pct')"
          - when: "the agreement does not yet stand with the kit handed in"
            value: "K('open_retention_multiple_pct')"
          - when: "otherwise"
            value: "K('clean_retention_multiple_pct')"
        baseline:
          retention_multiple: "K('clean_retention_multiple_pct') / 100"
        evidence: [history]
        cross_difficulty: null
      - id: household_standing_allowance
        effect: parameter
        decides: standing_allowance
        bindings: [pass_active, pass_installment_balance, standing_allowance]
        ladder:
          - when: "the household holds a season pass standing active for the season and the pass account shows nothing still to be collected on its instalments"
            value: "K('clean_waiveback_usd')"
          - when: "the household holds a season pass standing active for the season and the pass account shows an instalment balance still to be collected"
            value: "K('declined_waiveback_usd')"
          - when: "otherwise"
