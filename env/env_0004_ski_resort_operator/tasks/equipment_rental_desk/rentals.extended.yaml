  - id: rentals_ext_model_change_fee
    base_policy_refs: [rentals_swap_and_extension, rentals_late_return, rentals_deposit_and_damage]
    overwrite:
      - base_policy: rentals_swap_and_extension
        superseded_clause: >-
          Packages that include changes carry no fee for them; the rest carry the package's change fee for
          every change after the first refit for a genuine misfit, which is never charged.
        replaced_by: >-
          Where the window between the agreement being taken and the change being asked for is shorter than
          a whole day, nothing is charged for the change; where it runs from a whole day up to the package's
          fitting window, the prompt change share of the package's change fee is charged.
    trigger: state_due
    subject: [rentals_swap, rentals_fee_charge]
    computes: change_fee_amount_usd
    target_tool: raise_model_change_fee_b751c3b4
    params:
      fitting_window_days: 3
      fitting_correction_pct: 0
      prompt_change_pct: 60
      full_change_pct: 100
      instructor_share_pct: 50
      school_booked_share_pct: 80
      high_hold_usd: 120
      high_value_uplift_pct: 30
      mid_value_uplift_pct: 15
    rule: >
      The fee for a change of model or size recorded on an agreement is worked out from the package's
      change fee. The window between the agreement being taken and the change being asked for is the
      calendar days from the date the reservation was recorded to the date the change was raised. Where
      the account carries at least one date the kit was out on the agreement, that window is instead the
      count of those dates less one. Where the account carries no date the kit was out and the agreement
      stands with kit set aside and not yet collected, the window is instead nil. The whole of the
      package's change fee stands, whatever that window is. Where the window between the agreement being
      taken and the change being asked for is shorter than a whole day, nothing is charged for the change;
      where it runs from a whole day up to the package's fitting window, the prompt change share of the
      package's change fee is charged. Nothing is taken off for the collective's own instruction having
      called for the change. Where the rider holds a school booking for the season and the school account
      carries at least one session delivered in the month before the change is priced, the instructor
      referred share of the fee is charged instead. Where the rider holds a school booking for the season
      and the school account carries no session delivered in that month, the school booked share is
      charged instead. The fee carries no uplift for what the collective has at stake in the kit. Where the security hold standing against the agreement is at or above the high hold figure and
      the agreement was written for at least the package's multi-day threshold in days, the fee is
      instead raised by the high value uplift; where the hold standing is at or above that figure
      and the agreement was written for fewer days than that threshold, it is instead raised by the
      mid value uplift. The package's change fee is first taken at the window share, the figure that step leaves is
      then taken at the instruction share, and the figure that step leaves is then raised by the
      uplift, so each of the three acts on what the step before it left and not on the package's
      change fee itself. The fee is worked out once and rounded half up to two decimal places. A rider who
      has used the package's allowance of changes is offered a new agreement at the day rate rather than a
      further change, and no fee under this rule arises for them.
    prerequisite: []
    cross_category:
      - category: lessons
        as: history
        reads: [season_code, lessons_ledger.event_type]
        note: "Whether the rider holds a school booking and how recently the school account carries a session delivered decide which instruction share of the change fee is charged."
    compute:
      - change_asked_date: "LATEST('rentals_requests','created_at', date_field='created_at', request_type='size_change')"
      - dates_out_recorded: "COUNT('rentals_ledger', event_type='rentals_day_consume')"
      - change_window_days: "MX(0, dates_out_recorded - 1) if dates_out_recorded >= 1 else (0 if F('status') == 'confirmed' else MX(0, DAYS(F('reserved_date'), change_asked_date)))"
      - timing_share: "K('fitting_correction_pct') / 100 if change_window_days < 1 else (K('prompt_change_pct') / 100 if change_window_days <= K('fitting_window_days') else K('full_change_pct') / 100)"
      - school_on_account: "EXISTS('lessons', season_code=F('season_code'))"
      - recent_sessions_delivered: "XCOUNT('lessons','lessons_ledger', within_months=1, event_type='lessons_session_deliver')"
      - instruction_share: "K('instructor_share_pct') / 100 if (school_on_account and recent_sessions_delivered >= 1) else (K('school_booked_share_pct') / 100 if school_on_account else 1.0)"
      - hold_standing: "SUM('rentals_ledger','amount_usd', event_type='rentals_deposit_hold') - SUM('rentals_ledger','amount_usd', event_type='rentals_deposit_release')"
      - kit_value_uplift: "(1 + K('high_value_uplift_pct') / 100) if (hold_standing >= K('high_hold_usd') and F('rental_days_booked') >= P('multi_day_threshold_days')) else ((1 + K('mid_value_uplift_pct') / 100) if (hold_standing >= K('high_hold_usd') and F('rental_days_booked') < P('multi_day_threshold_days')) else 1.0)"
      - result: "RND(P('swap_fee_usd') * timing_share * instruction_share * kit_value_uplift, 2)"
    compute_basis:
      change_asked_date: "The window between the agreement being taken and the change being asked for is the calendar days from the date the reservation was recorded to the date the change was raised."
      dates_out_recorded: "Where the account carries at least one date the kit was out on the agreement, that window is instead the count of those dates less one."
      change_window_days: "The window between the agreement being taken and the change being asked for is the calendar days from the date the reservation was recorded to the date the change was raised. Where the account carries at least one date the kit was out on the agreement, that window is instead the count of those dates less one. Where the account carries no date the kit was out and the agreement stands with kit set aside and not yet collected, the window is instead nil."
      timing_share: "The whole of the package's change fee stands, whatever that window is. Where the window between the agreement being taken and the change being asked for is shorter than a whole day, nothing is charged for the change; where it runs from a whole day up to the package's fitting window, the prompt change share of the package's change fee is charged."
      school_on_account: "Where the rider holds a school booking for the season and the school account carries at least one session delivered in the month before the change is priced, the instructor referred share of the fee is charged instead."
      recent_sessions_delivered: "Where the rider holds a school booking for the season and the school account carries at least one session delivered in the month before the change is priced, the instructor referred share of the fee is charged instead."
      instruction_share: "Nothing is taken off for the collective's own instruction having called for the change. Where the rider holds a school booking for the season and the school account carries at least one session delivered in the month before the change is priced, the instructor referred share of the fee is charged instead. Where the rider holds a school booking for the season and the school account carries no session delivered in that month, the school booked share is charged instead."
      hold_standing: "Where the security hold standing against the agreement is at or above the high hold figure and the agreement was written for at least the package's multi-day threshold in days, the fee is instead raised by the high value uplift; where the hold standing is at or above that figure and the agreement was written for fewer days than that threshold, it is instead raised by the mid value uplift."
      kit_value_uplift: "The fee carries no uplift for what the collective has at stake in the kit. Where the security hold standing against the agreement is at or above the high hold figure and the agreement was written for at least the package's multi-day threshold in days, the fee is instead raised by the high value uplift; where the hold standing is at or above that figure and the agreement was written for fewer days than that threshold, it is instead raised by the mid value uplift."
      result: "The package's change fee is first taken at the window share, the figure that step leaves is then taken at the instruction share, and the figure that step leaves is then raised by the uplift, so each of the three acts on what the step before it left and not on the package's change fee itself. The fee is worked out once and rounded half up to two decimal places."
    factors:
      - id: change_window_basis
        effect: method
        decides: change_window_days
        bindings: [dates_out_recorded, change_window_days]
        ladder:
          - when: "the account carries at least one date the kit was out on the agreement"
            method: "the window is the count of the dates the account shows the kit out, less one"
          - when: "the account carries no date the kit was out on the agreement and the agreement stands with kit set aside and not yet collected"
            method: "the window is nil"
          - when: "otherwise"
            method: "the window is the calendar days from the date the reservation was recorded to the date the change was raised"
        baseline:
          change_window_days: "MX(0, DAYS(F('reserved_date'), change_asked_date))"
        evidence: [history]
        cross_difficulty: null
      - id: change_timing_share
        effect: parameter
        decides: timing_share
        bindings: [change_asked_date, timing_share]
        ladder:
          - when: "the window between the agreement being taken and the change being asked for is shorter than a whole day"
            value: "K('fitting_correction_pct')"
          - when: "the window runs from a whole day up to the package's fitting window"
            value: "K('prompt_change_pct')"
          - when: "otherwise"
            value: "K('full_change_pct')"
        baseline:
          timing_share: "K('full_change_pct') / 100"
        evidence: [date, history]
        cross_difficulty: null
      - id: instruction_referral_share
        effect: parameter
        decides: instruction_share
        bindings: [school_on_account, recent_sessions_delivered, instruction_share]
        ladder:
          - when: "the rider holds a school booking for the season and the school account carries at least one session delivered in the month before the change is priced"
            value: "K('instructor_share_pct')"
          - when: "the rider holds a school booking for the season and the school account carries no session delivered in that month"
            value: "K('school_booked_share_pct')"
          - when: "otherwise"
            value: "the whole of the package's change fee"
        baseline:
          instruction_share: "1.0"
        evidence: [cross_category]
        cross_difficulty: lessons
      - id: kit_value_uplift_level
        effect: parameter
        decides: kit_value_uplift
        bindings: [hold_standing, kit_value_uplift]
        ladder:
          - when: "the security hold standing against the agreement is at or above the high hold figure and the agreement was written for at least the package's multi-day threshold in days"
            value: "K('high_value_uplift_pct')"
          - when: "the security hold standing against the agreement is at or above the high hold figure and the agreement was written for fewer days than the package's multi-day threshold"
            value: "K('mid_value_uplift_pct')"
          - when: "otherwise"
            value: "no uplift at all"
        baseline:
          kit_value_uplift: "1.0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The fee for a change of model or size recorded on an agreement is worked out from the package's
        change fee. The window between the agreement being taken and the change being asked for is the
        calendar days from the date the reservation was recorded to the date the change was raised. The
        whole of the package's change fee stands, whatever that window is. Nothing is taken off for the
        collective's own instruction having called for the change. The fee carries no uplift for what the
        collective has at stake in the kit. The package's change fee is first taken at the window share, the figure that step leaves is
        then taken at the instruction share, and the figure that step leaves is then raised by the
        uplift, so each of the three acts on what the step before it left and not on the package's
        change fee itself. The fee is worked out once
        and rounded half up to two decimal places. A rider who has used the package's allowance of changes
        is offered a new agreement at the day rate rather than a further change, and no fee under this rule
        arises for them.
      params: [swap_fee_usd, max_swaps_per_rental]
    inputs:
      history:
        - {table: rentals_requests, aggregate: latest, field: created_at, within_months: null, filters: {request_type: size_change}}
        - {table: rentals_ledger, aggregate: count, field: rental_event_id, within_months: null, filters: {event_type: rentals_day_consume}}
        - {table: rentals_ledger, aggregate: sum, field: amount_usd, within_months: null, filters: {event_type: rentals_deposit_hold}}
        - {category: lessons, table: lessons_ledger, aggregate: count, field: lesson_event_id, within_months: 1, filters: {event_type: lessons_session_deliver}}
      cross_category: [lessons]

  - id: rentals_ext_party_rate_charge
    base_policy_refs: [rentals_pricing, rentals_agg_party_pricing, rentals_reservation_terms, rentals_fitting_and_pickup]
    overwrite:
      - base_policy: rentals_agg_party_pricing
        superseded_clause: >-
          The season passholder reduction is taken per rider, on the evidence of a pass registered to that
          rider standing in the active state, and it is not lent from one rider to another.
        replaced_by: >-
          Where the rider holds a season pass standing active for the season and the pass account carries at
          least the regular skier scan threshold of lift scans in the three months before the hire rate is
          raised, the package's passholder share is taken in full; where the rider holds a season pass
          standing active for the season and the pass account carries fewer lift scans than that threshold
          in those three months, half the package's passholder share is taken.
      - base_policy: rentals_pricing
        superseded_clause: >-
          A charge is raised against an agreement only while the agreement stands in the reserved,
          confirmed, picked_up or overdue state.
        replaced_by: >-
          The standing requirement on raising a charge reaches the hire rate alone: the hire rate is raised
          against an agreement only while that agreement stands in the reserved, confirmed, picked_up or
          overdue state, and the shop fees and the assessments raised on an agreement stand or fall by the
          standing their own rules fix.
      - base_policy: rentals_pricing
        superseded_clause: >-
          The advance booking reduction is taken where the reservation was recorded at least the package's
          advance period before the collection date, and it is taken after the passholder and bundle
          reductions.
        replaced_by: >-
          Where the reservation was recorded at least the package's advance booking period in days before
          the collection date and the agreement runs for at least the package's multi-day threshold in days,
          the package's advance booking share is taken off last of the three; where the reservation was
          recorded at least that period before the collection date but the agreement runs for fewer days
          than that threshold, half the package's advance booking share is taken off last of the three.
    trigger: state_due
    subject: [rentals_rate_charge]
    computes: rate_charge_amount_usd
    target_tool: raise_rental_rate_charge_fcd244c0
    params:
      regular_scan_threshold: 6
    rule: >
      The hire rate for an agreement is worked out from the days it is charged for and the day
        rate those days are charged at, and the three reductions are then taken off in the order set
        out here. The standing requirement on raising a charge reaches the hire rate alone: the hire
        rate is raised against an agreement only while that agreement stands in the reserved,
        confirmed, picked_up or overdue state, and the shop fees and the assessments raised on an
        agreement stand or fall by the standing their own rules fix. The standing requirement on raising a charge reaches the hire rate alone: the hire rate
      is raised against an agreement only while that agreement stands in the reserved, confirmed,
      picked_up or overdue state, and the shop fees and the assessments raised on an agreement stand
      or fall by the standing their own rules fix. The
      length of the agreement is the calendar days from the collection date through the date written on
      the agreement inclusive. The day rate is the package's shop day rate. Where the agreement runs for at
      least the package's multi-day threshold in days, every day is charged at the package's multi-day day
      rate instead. Where the agreement runs for seven days or more and the package's weekly rate is lower
      than seven days at that multi-day day rate, every day is charged at a seventh of the package's
      weekly rate instead. The days charged for are the dates the account shows the kit out.
      Where the account carries at least one date the kit was out and the agreement stands with the kit
      out, the days charged for are instead the length of the agreement. Where the agreement stands with
      kit set aside and not yet collected, the days charged for are instead the days the agreement was
      written for. No passholder share is taken off. Where the rider holds a season pass standing active
      for the season and the pass account carries at least the regular skier scan threshold of lift scans
      in the three months before the hire rate is raised, the package's passholder share is taken in full;
      where the rider holds a season pass standing active for the season and the pass account carries
      fewer lift scans than that threshold in those three months, half the package's passholder share is
      taken. No bundle share is taken off. Where the rider holds a school booking for the season and the
      household holds a collective lodging reservation for the season, the larger of the package's lesson
      bundle share and its lodging bundle share is taken off, and the two are never added together; where the household holds a collective lodging reservation for the season and the rider holds
      no school booking for it, the package's lodging bundle share is taken off; and where the rider
      holds a school booking for the season and the household holds no collective lodging
      reservation for it, the package's lesson bundle share is taken off. No advance booking share is taken
      off. Where the reservation was recorded at least the package's advance booking period in days before
      the collection date and the agreement runs for at least the package's multi-day threshold in days,
      the package's advance booking share is taken off last of the three; where the reservation was
      recorded at least that period before the collection date but the agreement runs for fewer days than
      that threshold, half the package's advance booking share is taken off last of the three. The
      passholder share acts on the days charged for at the day rate, the bundle share acts on the amount
      the passholder step left, and the advance booking share acts on the amount the bundle step left; the
      three are never combined into one share. The amount is rounded half up to two decimal places at the
      end of each of those three steps. Add-ons the guest takes are raised as their own entries at the
      package's add-on prices and form no part of the hire rate.
    prerequisite: []
    cross_category:
      - category: passes
        as: history
        reads: [status, season_code, passes_ledger.event_type]
        note: "Whether the rider's season pass stands active and how many lift scans the pass account carries in the window decide how much of the package's passholder share is taken off."
      - category: lessons
        as: existence
        reads: [season_code]
        note: "Whether the rider holds a school booking for the season decides which bundle share the bundle factor takes off."
      - category: lodging
        as: existence
        reads: [season_code]
        note: "Whether the household holds a collective lodging reservation for the season decides which bundle share the bundle factor takes off."
    compute:
      - agreement_days: "MX(0, DAYS(F('pickup_date'), F('due_date')) + 1)"
      - day_rate: "RND(P('weekly_rate_usd') / 7, 2) if (agreement_days >= 7 and P('weekly_rate_usd') < P('multi_day_daily_rate_usd') * 7) else (P('multi_day_daily_rate_usd') if agreement_days >= P('multi_day_threshold_days') else P('daily_rate_usd'))"
      - dates_out_recorded: "COUNT('rentals_ledger', event_type='rentals_day_consume')"
      - chargeable_days: "agreement_days if (dates_out_recorded >= 1 and F('status') == 'picked_up') else (F('rental_days_booked') if F('status') == 'confirmed' else dates_out_recorded)"
      - base_block: "RND(day_rate * chargeable_days, 2)"
      - pass_active: "EXISTS('passes', status='active', season_code=F('season_code'))"
      - season_scan_count: "XCOUNT('passes','passes_ledger', within_months=3, event_type='passes_scan')"
      - passholder_share: "P('passholder_discount_pct') if (pass_active and season_scan_count >= K('regular_scan_threshold')) else (P('passholder_discount_pct') / 2 if (pass_active and season_scan_count < K('regular_scan_threshold')) else 0)"
      - after_passholder: "RND(base_block * (1 - passholder_share / 100), 2)"
      - school_on_account: "EXISTS('lessons', season_code=F('season_code'))"
      - lodging_on_account: "EXISTS('lodging', season_code=F('season_code'))"
      - bundle_share: "MX(P('lesson_bundle_discount_pct'), P('lodging_bundle_discount_pct')) if (school_on_account and lodging_on_account) else (P('lodging_bundle_discount_pct') if (lodging_on_account and not school_on_account) else (P('lesson_bundle_discount_pct') if (school_on_account and not lodging_on_account) else 0))"
      - after_bundle: "RND(after_passholder * (1 - bundle_share / 100), 2)"
      - advance_lead_days: "DAYS(F('reserved_date'), F('pickup_date'))"
      - advance_share: "P('advance_booking_discount_pct') if (advance_lead_days >= P('advance_booking_days_min') and agreement_days >= P('multi_day_threshold_days')) else (P('advance_booking_discount_pct') / 2 if (advance_lead_days >= P('advance_booking_days_min') and agreement_days < P('multi_day_threshold_days')) else 0)"
      - result: "RND(after_bundle * (1 - advance_share / 100), 2)"
    compute_basis:
      agreement_days: "The length of the agreement is the calendar days from the collection date through the date written on the agreement inclusive."
      day_rate: "The day rate is the package's shop day rate. Where the agreement runs for at least the package's multi-day threshold in days, every day is charged at the package's multi-day day rate instead. Where the agreement runs for seven days or more and the package's weekly rate is lower than seven days at that multi-day day rate, every day is charged at a seventh of the package's weekly rate instead."
      dates_out_recorded: "The days charged for are the dates the account shows the kit out."
      chargeable_days: "The days charged for are the dates the account shows the kit out. Where the account carries at least one date the kit was out and the agreement stands with the kit out, the days charged for are instead the length of the agreement. Where the agreement stands with kit set aside and not yet collected, the days charged for are instead the days the agreement was written for."
      base_block: "The hire rate for an agreement is worked out from the days it is charged for and the day rate those days are charged at, and the three reductions are then taken off in the order set out here."
      pass_active: "Where the rider holds a season pass standing active for the season and the pass account carries at least the regular skier scan threshold of lift scans in the three months before the hire rate is raised, the package's passholder share is taken in full; where the rider holds a season pass standing active for the season and the pass account carries fewer lift scans than that threshold in those three months, half the package's passholder share is taken."
      season_scan_count: "Where the rider holds a season pass standing active for the season and the pass account carries at least the regular skier scan threshold of lift scans in the three months before the hire rate is raised, the package's passholder share is taken in full; where the rider holds a season pass standing active for the season and the pass account carries fewer lift scans than that threshold in those three months, half the package's passholder share is taken."
      passholder_share: "No passholder share is taken off. Where the rider holds a season pass standing active for the season and the pass account carries at least the regular skier scan threshold of lift scans in the three months before the hire rate is raised, the package's passholder share is taken in full; where the rider holds a season pass standing active for the season and the pass account carries fewer lift scans than that threshold in those three months, half the package's passholder share is taken."
      after_passholder: "The passholder share acts on the days charged for at the day rate, the bundle share acts on the amount the passholder step left, and the advance booking share acts on the amount the bundle step left; the three are never combined into one share."
      school_on_account: "Where the rider holds a school booking for the season and the household holds a collective lodging reservation for the season, the larger of the package's lesson bundle share and its lodging bundle share is taken off, and the two are never added together; where the household holds a collective lodging reservation for the season and the rider holds no school booking for it, the package's lodging bundle share is taken off; and where the rider holds a school booking for the season and the household holds no collective lodging reservation for it, the package's lesson bundle share is taken off."
      lodging_on_account: "Where the rider holds a school booking for the season and the household holds a collective lodging reservation for the season, the larger of the package's lesson bundle share and its lodging bundle share is taken off, and the two are never added together; where the household holds a collective lodging reservation for the season and the rider holds no school booking for it, the package's lodging bundle share is taken off; and where the rider holds a school booking for the season and the household holds no collective lodging reservation for it, the package's lesson bundle share is taken off."
      bundle_share: "No bundle share is taken off. Where the rider holds a school booking for the season and the household holds a collective lodging reservation for the season, the larger of the package's lesson bundle share and its lodging bundle share is taken off, and the two are never added together; where the household holds a collective lodging reservation for the season and the rider holds no school booking for it, the package's lodging bundle share is taken off; and where the rider holds a school booking for the season and the household holds no collective lodging reservation for it, the package's lesson bundle share is taken off."
      after_bundle: "The passholder share acts on the days charged for at the day rate, the bundle share acts on the amount the passholder step left, and the advance booking share acts on the amount the bundle step left; the three are never combined into one share."
      advance_lead_days: "Where the reservation was recorded at least the package's advance booking period in days before the collection date and the agreement runs for at least the package's multi-day threshold in days, the package's advance booking share is taken off last of the three; where the reservation was recorded at least that period before the collection date but the agreement runs for fewer days than that threshold, half the package's advance booking share is taken off last of the three."
      advance_share: "No advance booking share is taken off. Where the reservation was recorded at least the package's advance booking period in days before the collection date and the agreement runs for at least the package's multi-day threshold in days, the package's advance booking share is taken off last of the three; where the reservation was recorded at least that period before the collection date but the agreement runs for fewer days than that threshold, half the package's advance booking share is taken off last of the three."
      result: "The amount is rounded half up to two decimal places at the end of each of those three steps."
    factors:
      - id: day_rate_basis
        effect: method
        decides: day_rate
        bindings: [agreement_days, day_rate]
        ladder:
          - when: "the agreement runs for seven days or more and the package's weekly rate is lower than seven days at the package's multi-day day rate"
            method: "every day is charged at a seventh of the package's weekly rate"
          - when: "the agreement runs for at least the package's multi-day threshold in days and is not a seven-day block priced below at the weekly rate"
            method: "every day is charged at the package's multi-day day rate"
          - when: "otherwise"
            method: "every day is charged at the package's shop day rate"
        baseline:
          day_rate: "P('daily_rate_usd')"
        evidence: [date]
        cross_difficulty: null
      - id: chargeable_day_basis
        effect: method
        decides: chargeable_days
        bindings: [dates_out_recorded, chargeable_days]
        ladder:
          - when: "the account carries at least one date the kit was out and the agreement stands with the kit out"
            method: "the days charged for are the length of the agreement"
          - when: "the agreement stands with kit set aside and not yet collected"
            method: "the days charged for are the days the agreement was written for"
          - when: "otherwise"
            method: "the days charged for are the dates the account shows the kit out"
        baseline:
