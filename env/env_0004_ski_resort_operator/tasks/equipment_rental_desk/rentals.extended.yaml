        ladder:
          - when: "the rider holds a season pass standing active for the season and the pass account carries at least the regular skier scan threshold of lift scans in the three months before the hire rate is raised"
            value: "P('passholder_discount_pct')"
          - when: "the rider holds a season pass standing active for the season and the pass account carries fewer lift scans than that threshold in those three months"
            value: "half of P('passholder_discount_pct')"
