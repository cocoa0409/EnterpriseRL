# ============================================================================
# extended_policies: the multi-factor calculation policies the equipment rental desk adds on
# top of the base charter. Each one is a problem a guest services call may have to resolve.
# ============================================================================
extended_policies:
  - id: rentals_ext_damage_assessment
    base_policy_refs: [rentals_deposit_and_damage, rentals_fitting_and_pickup, rentals_pricing]
    overwrite:
      - base_policy: rentals_deposit_and_damage
        superseded_clause: >-
          Where the guest took the damage waiver, the collective bears the assessed amount above the
          package's excess and the guest bears the excess; where they did not, the guest bears the whole
          assessed amount.
        replaced_by: >-
          The guest bears the full cover share of the amount left. Where the agreement shows no
          damage waiver taken and the account carries no waiver entry against it, the guest bears
          the whole of the amount left instead. Where the waiver was taken but the account carries
          the waiver charged for fewer dates than the account shows the kit was out, the guest bears
          the partial cover share of it instead.
    trigger: state_due
    subject: [rentals_damage_charge]
    computes: damage_charge_usd
    target_tool: assess_returned_kit_damage_f0dbd642
    params:
      light_use_days: 4
      heavy_use_days: 8
      light_use_share_pct: 22
      moderate_use_share_pct: 16
      heavy_use_share_pct: 10
      delivered_setaside_pct: 20
      delivered_bare_setaside_pct: 10
      inspection_day_count: 4
      twice_changed_setaside_pct: 30
      once_changed_setaside_pct: 15
      school_session_threshold: 3
      school_heavy_share_pct: 70
      school_light_share_pct: 85
      bare_cover_share_pct: 100
      partial_cover_share_pct: 60
      full_cover_share_pct: 20
      stale_look_days: 7
      prompt_look_days: 2
      recent_look_share_pct: 80
    rule: >
      An item of hire kit a technician has found fault with is assessed against the agreement it was
      hired on, one assessment for each item, and the amount the guest bears is worked out in the order
      set out here. The amount the finding carries is the heavy use share of the package's replacement
      value, rounded half up to two decimal places. Where the account carries fewer dates the kit was
      out than the light use day count, the amount the finding carries is instead the light use share of
      that replacement value; where the account carries at least that many dates but fewer than the
      heavy use day count, it is instead the moderate use share of it. Nothing is set aside for the kit
      having been taken out of the shop's sight. Where the account carries the package's delivery charge
      against the agreement and the household holds a collective lodging reservation for the season, the
      delivered set-aside share of the amount is instead set aside; where the account carries that
      delivery charge and the household holds no collective lodging reservation for the season, the bare
      delivered set-aside share is instead set aside. Nothing is set aside for a technician having had
      the kit in hand part-way through the hire. Where the agreement shows the kit was changed for
      another model at least twice and the account carries at least the inspection day count of dates
      the item now on the agreement was out, the twice changed set-aside share is instead set aside;
      where the agreement shows the kit was changed once and the account carries at least that many
      dates the item now on the agreement was out, the once changed set-aside share is instead set
      aside. Every set-aside and every share in the steps set out here acts on the amount left after the
      step before it, and the amount left is rounded half up to two decimal places at each of those
      steps. The whole of what is then left is
      carried to the cover step. Where the household holds a school booking for the season and the
      school account carries at least the school session threshold of sessions delivered in the four
      months before the assessment is made, the school heavy share of what is left is carried to the
      cover step instead; where the household holds a school booking for the season and the school
      account carries fewer sessions delivered than that in those four months, the school light share of
      it is carried instead. The guest bears the full cover share of the amount left. Where the agreement shows no damage
      waiver taken and the account carries no waiver entry against it, the guest bears the whole of
      the amount left instead. Where the waiver was taken but the account carries the waiver charged
      for fewer dates than the account shows the kit was out, the guest bears the partial cover
      share of it instead. The figure the guest bears is taken as it stands, rounded half up to two decimal places.
      Where the kit reached the counter more days before the assessment is made than the stale look day
      count, the figure is instead halved and taken down to the whole dollar below; where it reached the
      counter more days before than the prompt look day count but no more than the stale look day count,
      the figure is instead taken at the recent look share of itself and carried up to the whole dollar
      above. The figure the guest bears is never below zero. Fair wear on edges and bases is not
      charged, and kit that never comes back is charged at the package's replacement value rather than
      assessed under this rule.
    prerequisite: []
    cross_category:
      - category: lodging
        as: existence
        reads: [season_code]
        note: "Whether the household holds a collective lodging reservation for the season decides which delivered set-aside share the delivery factor selects."
      - category: lessons
        as: history
        reads: [season_code, lessons_ledger.event_type]
        note: "The count of school sessions delivered in the four-month window decides which share of the amount the school factor carries to the cover step."
    compute:
      - dates_out_recorded: "COUNT('rentals_ledger', event_type='rentals_day_consume')"
      - assessed_share_pct: "K('light_use_share_pct') if dates_out_recorded < K('light_use_days') else (K('moderate_use_share_pct') if dates_out_recorded < K('heavy_use_days') else K('heavy_use_share_pct'))"
      - assessed_amount: "RND(P('replacement_value_usd') * assessed_share_pct / 100, 2)"
      - delivery_charge_entries: "COUNT('rentals_ledger', event_type='rentals_rate_charge', charge_category='delivery_fee')"
      - lodging_on_account: "EXISTS('lodging', season_code=F('season_code'))"
      - delivered_setaside_pct: "K('delivered_setaside_pct') if (delivery_charge_entries >= 1 and lodging_on_account) else (K('delivered_bare_setaside_pct') if (delivery_charge_entries >= 1 and not lodging_on_account) else 0)"
      - after_delivery_setaside: "RND(assessed_amount * (1 - delivered_setaside_pct / 100), 2)"
      - dates_on_current_item: "COUNT('rentals_ledger', event_type='rentals_day_consume', item_serial=F('item_serial'))"
      - changed_setaside_pct: "K('twice_changed_setaside_pct') if (F('swap_count') >= 2 and dates_on_current_item >= K('inspection_day_count')) else (K('once_changed_setaside_pct') if (F('swap_count') >= 1 and dates_on_current_item >= K('inspection_day_count')) else 0)"
      - after_changed_setaside: "RND(after_delivery_setaside * (1 - changed_setaside_pct / 100), 2)"
      - school_on_account: "EXISTS('lessons', season_code=F('season_code'))"
      - school_sessions_delivered: "XCOUNT('lessons','lessons_ledger', within_months=4, event_type='lessons_session_deliver')"
      - school_share: "K('school_heavy_share_pct') / 100 if (school_on_account and school_sessions_delivered >= K('school_session_threshold')) else (K('school_light_share_pct') / 100 if (school_on_account and school_sessions_delivered < K('school_session_threshold')) else 1.0)"
      - after_school_share: "RND(after_changed_setaside * school_share, 2)"
      - waiver_dates_charged: "SUM('rentals_ledger','quantity', event_type='rentals_rate_charge', charge_category='damage_waiver')"
      - guest_cover_share: "K('bare_cover_share_pct') / 100 if not F('damage_waiver_taken') else (K('partial_cover_share_pct') / 100 if waiver_dates_charged < dates_out_recorded else K('full_cover_share_pct') / 100)"
      - borne_before_ageing: "RND(after_school_share * guest_cover_share, 2)"
      - look_gap_days: "DAYS(F('returned_date'), NOW)"
      - borne_after_ageing: "float(int(borne_before_ageing / 2)) if look_gap_days > K('stale_look_days') else (float(-(-(borne_before_ageing * K('recent_look_share_pct') / 100) // 1)) if look_gap_days > K('prompt_look_days') else RND(borne_before_ageing, 2))"
      - result: "MX(0.0, borne_after_ageing)"
    compute_basis:
      dates_out_recorded: "Where the account carries fewer dates the kit was out than the light use day count, the amount the finding carries is instead the light use share of that replacement value; where the account carries at least that many dates but fewer than the heavy use day count, it is instead the moderate use share of it."
      assessed_share_pct: "The amount the finding carries is the heavy use share of the package's replacement value, rounded half up to two decimal places. Where the account carries fewer dates the kit was out than the light use day count, the amount the finding carries is instead the light use share of that replacement value; where the account carries at least that many dates but fewer than the heavy use day count, it is instead the moderate use share of it."
      assessed_amount: "The amount the finding carries is the heavy use share of the package's replacement value, rounded half up to two decimal places."
      delivery_charge_entries: "Where the account carries the package's delivery charge against the agreement and the household holds a collective lodging reservation for the season, the delivered set-aside share of the amount is instead set aside; where the account carries that delivery charge and the household holds no collective lodging reservation for the season, the bare delivered set-aside share is instead set aside."
      lodging_on_account: "Where the account carries the package's delivery charge against the agreement and the household holds a collective lodging reservation for the season, the delivered set-aside share of the amount is instead set aside; where the account carries that delivery charge and the household holds no collective lodging reservation for the season, the bare delivered set-aside share is instead set aside."
      delivered_setaside_pct: "Nothing is set aside for the kit having been taken out of the shop's sight. Where the account carries the package's delivery charge against the agreement and the household holds a collective lodging reservation for the season, the delivered set-aside share of the amount is instead set aside; where the account carries that delivery charge and the household holds no collective lodging reservation for the season, the bare delivered set-aside share is instead set aside."
      after_delivery_setaside: "Every set-aside and every share in the steps set out here acts on the amount left after the step before it, and the amount left is rounded half up to two decimal places at each of those steps."
      dates_on_current_item: "Where the agreement shows the kit was changed for another model at least twice and the account carries at least the inspection day count of dates the item now on the agreement was out, the twice changed set-aside share is instead set aside; where the agreement shows the kit was changed once and the account carries at least that many dates the item now on the agreement was out, the once changed set-aside share is instead set aside."
      changed_setaside_pct: "Nothing is set aside for a technician having had the kit in hand part-way through the hire. Where the agreement shows the kit was changed for another model at least twice and the account carries at least the inspection day count of dates the item now on the agreement was out, the twice changed set-aside share is instead set aside; where the agreement shows the kit was changed once and the account carries at least that many dates the item now on the agreement was out, the once changed set-aside share is instead set aside."
      after_changed_setaside: "Every set-aside and every share in the steps set out here acts on the amount left after the step before it, and the amount left is rounded half up to two decimal places at each of those steps."
      school_on_account: "Where the household holds a school booking for the season and the school account carries at least the school session threshold of sessions delivered in the four months before the assessment is made, the school heavy share of what is left is carried to the cover step instead; where the household holds a school booking for the season and the school account carries fewer sessions delivered than that in those four months, the school light share of it is carried instead."
      school_sessions_delivered: "Where the household holds a school booking for the season and the school account carries at least the school session threshold of sessions delivered in the four months before the assessment is made, the school heavy share of what is left is carried to the cover step instead; where the household holds a school booking for the season and the school account carries fewer sessions delivered than that in those four months, the school light share of it is carried instead."
      school_share: "The whole of what is then left is carried to the cover step. Where the household holds a school booking for the season and the school account carries at least the school session threshold of sessions delivered in the four months before the assessment is made, the school heavy share of what is left is carried to the cover step instead; where the household holds a school booking for the season and the school account carries fewer sessions delivered than that in those four months, the school light share of it is carried instead."
      after_school_share: "Every set-aside and every share in the steps set out here acts on the amount left after the step before it, and the amount left is rounded half up to two decimal places at each of those steps."
      waiver_dates_charged: "Where the waiver was taken but the account carries the waiver charged for fewer dates than the account shows the kit was out, the guest bears the partial cover share of it instead."
      guest_cover_share: "The guest bears the full cover share of the amount left. Where the agreement shows no damage waiver taken and the account carries no waiver entry against it, the guest bears the whole of the amount left instead. Where the waiver was taken but the account carries the waiver charged for fewer dates than the account shows the kit was out, the guest bears the partial cover share of it instead."
      borne_before_ageing: "Every set-aside and every share in the steps set out here acts on the amount left after the step before it, and the amount left is rounded half up to two decimal places at each of those steps."
      look_gap_days: "Where the kit reached the counter more days before the assessment is made than the stale look day count, the figure is instead halved and taken down to the whole dollar below; where it reached the counter more days before than the prompt look day count but no more than the stale look day count, the figure is instead taken at the recent look share of itself and carried up to the whole dollar above."
      borne_after_ageing: "The figure the guest bears is taken as it stands, rounded half up to two decimal places. Where the kit reached the counter more days before the assessment is made than the stale look day count, the figure is instead halved and taken down to the whole dollar below; where it reached the counter more days before than the prompt look day count but no more than the stale look day count, the figure is instead taken at the recent look share of itself and carried up to the whole dollar above."
      result: "The figure the guest bears is never below zero."
    factors:
      - id: use_intensity_share
        effect: parameter
        decides: assessed_share_pct
        bindings: [dates_out_recorded, assessed_share_pct]
        ladder:
          - when: "the account carries fewer dates the kit was out on the agreement than the light use day count"
            value: "K('light_use_share_pct')"
          - when: "the account carries at least the light use day count of dates the kit was out but fewer than the heavy use day count"
            value: "K('moderate_use_share_pct')"
          - when: "otherwise"
            value: "K('heavy_use_share_pct')"
        baseline:
          assessed_share_pct: "K('heavy_use_share_pct')"
        evidence: [history]
        cross_difficulty: null
      - id: delivered_kit_setaside
        effect: parameter
        decides: delivered_setaside_pct
        bindings: [delivery_charge_entries, lodging_on_account, delivered_setaside_pct]
        ladder:
          - when: "the account carries the package's delivery charge against the agreement and the household holds a collective lodging reservation for the season"
            value: "K('delivered_setaside_pct')"
          - when: "the account carries the package's delivery charge against the agreement and the household holds no collective lodging reservation for the season"
            value: "K('delivered_bare_setaside_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          delivered_setaside_pct: "0"
        evidence: [history, cross_category]
        cross_difficulty: lodging
      - id: model_change_inspection_setaside
        effect: parameter
        decides: changed_setaside_pct
        bindings: [dates_on_current_item, changed_setaside_pct]
        ladder:
          - when: "the agreement shows the kit was changed for another model at least twice and the account carries at least the inspection day count of dates the item now on the agreement was out"
            value: "K('twice_changed_setaside_pct')"
          - when: "the agreement shows the kit was changed for another model once and the account carries at least the inspection day count of dates the item now on the agreement was out"
            value: "K('once_changed_setaside_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          changed_setaside_pct: "0"
        evidence: [history]
        cross_difficulty: null
      - id: school_delivery_share
        effect: parameter
        decides: school_share
        bindings: [school_on_account, school_sessions_delivered, school_share]
        ladder:
          - when: "the household holds a school booking for the season and the school account carries at least the school session threshold of sessions delivered in the four months before the assessment is made"
            value: "K('school_heavy_share_pct')"
          - when: "the household holds a school booking for the season and the school account carries fewer sessions delivered than the school session threshold in those four months"
            value: "K('school_light_share_pct')"
          - when: "otherwise"
            value: "the whole of what is left"
        baseline:
          school_share: "1.0"
        evidence: [cross_category]
        cross_difficulty: lessons
      - id: waiver_cover_share
        effect: parameter
        decides: guest_cover_share
        bindings: [waiver_dates_charged, guest_cover_share]
        ladder:
          - when: "the agreement shows no damage waiver taken and the account carries no waiver entry against it"
            value: "K('bare_cover_share_pct')"
          - when: "the agreement shows the damage waiver taken and the account carries the waiver charged for fewer dates than the account shows the kit was out"
            value: "K('partial_cover_share_pct')"
          - when: "otherwise"
            value: "K('full_cover_share_pct')"
        baseline:
          guest_cover_share: "K('full_cover_share_pct') / 100"
        evidence: [history]
        cross_difficulty: null
      - id: assessment_ageing_method
        effect: method
        decides: borne_after_ageing
        bindings: [look_gap_days, borne_after_ageing]
        ladder:
          - when: "the kit reached the counter more days before the assessment is made than the stale look day count"
            method: "the figure the guest bears is halved and taken down to the whole dollar below"
          - when: "the kit reached the counter more days before the assessment is made than the prompt look day count but no more than the stale look day count"
            method: "the figure the guest bears is taken at the recent look share of itself and carried up to the whole dollar above"
          - when: "otherwise"
            method: "the figure the guest bears is taken as it stands, rounded half up to two decimal places"
        baseline:
          borne_after_ageing: "RND(borne_before_ageing, 2)"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        An item of hire kit a technician has found fault with is assessed against the agreement it was
        hired on, one assessment for each item, and the amount the guest bears is worked out in the order
        set out here. The amount the finding carries is the heavy use share of the package's replacement
        value, rounded half up to two decimal places. Nothing is set aside for the kit having been taken
        out of the shop's sight. Nothing is set aside for a technician having had the kit in hand
        part-way through the hire. Every set-aside and every share in the steps set out here acts on the amount left after the
        step before it, and the amount left is rounded half up to two decimal places at each of
        those steps. The whole of
        what is then left is carried to the cover step. The guest bears the full cover share of the amount left. The figure the guest bears is taken as it stands, rounded
        half up to two decimal places. The figure the guest bears is never below zero. Fair wear on edges
        and bases is not charged, and kit that never comes back is charged at the package's replacement
        value rather than assessed under this rule.
      params: [replacement_value_usd, heavy_use_share_pct, full_cover_share_pct]
    inputs:
      history:
        - {table: rentals_ledger, aggregate: count, field: rental_event_id, within_months: null, filters: {event_type: rentals_day_consume}}
        - {table: rentals_ledger, aggregate: count, field: rental_event_id, within_months: null, filters: {event_type: rentals_rate_charge, charge_category: delivery_fee}}
        - {table: rentals_ledger, aggregate: sum, field: quantity, within_months: null, filters: {event_type: rentals_rate_charge, charge_category: damage_waiver}}
        - {category: lessons, table: lessons_ledger, aggregate: count, field: lesson_event_id, within_months: 4, filters: {event_type: lessons_session_deliver}}
      cross_category: [lodging, lessons]

  - id: rentals_ext_late_handin_fee
    base_policy_refs: [rentals_late_return, rentals_pricing, rentals_swap_and_extension]
    overwrite:
      - base_policy: rentals_late_return
        superseded_clause: >-
          From then the package's late fee is raised for each calendar day the kit stays out, counted from
          the day after the due date through the day it is handed in inclusive, and a day begun is charged
          as a whole day.
        replaced_by: >-
          The fee for kit handed in after the date written on the agreement is the number of days in the
          stretch multiplied by the daily figure that stretch is charged at, worked out once at the end and
          rounded half up to two decimal places.
      - base_policy: rentals_late_return
        superseded_clause: >-
          Once the kit has been out beyond the package's replacement threshold it is treated as not coming
          back: late fees stop accruing, the package's replacement value is charged instead, and the security
          hold is applied against it.
        replaced_by: >-
          Kit that has reached a shop counter is charged under this rule for the whole stretch it stayed out,
          the package's replacement threshold neither stopping the accrual nor diverting the agreement to a
          replacement charge, and the security hold is not applied against it.
      - base_policy: rentals_late_return
        superseded_clause: >-
          Kit handed in after being charged as a replacement is refunded the replacement value less the late
          fees that had accrued to the threshold, and the shop, not the desk, decides whether the item is fit
          to go back into stock.
        replaced_by: >-
          The fee is never more than the package's replacement value.
    trigger: state_due
    subject: [rentals_fee_charge]
    computes: late_fee_amount_usd
    target_tool: raise_late_handin_fee_417b2597
    params:
      late_uplift_pct: 35
      regular_scan_threshold: 8
      regular_skier_share_pct: 55
      passholder_share_pct: 80
      high_exposure_usd: 500
      moderate_exposure_usd: 200
      high_exposure_uplift_pct: 20
      moderate_exposure_uplift_pct: 10
      travel_day_relief_days: 1
    rule: >
      The fee for kit handed in after the date written on the agreement rests on the stretch of days the
      kit stayed out beyond that date. The stretch is counted from the day after the date written on the
      agreement through the date the kit reached the counter inclusive, a day begun counting as a whole
      day, and it is never taken below zero. Where the shop holds a request on the agreement to keep the
      kit to a later date, the stretch is instead counted from the day after the date the guest asked to
      keep the kit to, through the date the kit reached the counter inclusive. Where the shop holds no
      such request but the account already carries a date the kit was out falling on or after the date
      written on the agreement, the stretch is instead counted from the day after the last such date the
      account carries, through the date the kit reached the counter inclusive. No day of the stretch is
      set aside. Where the household holds a collective lodging reservation for the season whose
      departure date falls after the date written on the agreement, the days from the day after that
      date through the departure date are instead set aside. Where the household holds a collective
      lodging reservation for the season whose departure date falls on or before the date written on the
      agreement, the travel day relief is instead set aside. The days set aside are taken off the stretch
      before the fee is worked out, and the stretch is never taken below zero after they are taken off.
      The daily figure that stretch is charged at is the package's own daily late fee. Where the
      agreement was recorded at least the package's advance booking period in days before the collection
      date and was written for at least the package's multi-day threshold in days, the daily figure is instead
      the package's multi-day day rate raised by the late hand-in uplift and rounded half up to two
      decimal places. Where the agreement was recorded at least that period before the collection date
      but was written for fewer days than that threshold, the daily figure is instead the package's shop day
      rate raised by the same uplift and rounded half up to two decimal places. The daily figure is
      taken in full, without the household's standing with the collective weighed against it. Where the
      household holds a season pass standing active for the season and the pass account carries at least
      the regular skier scan threshold of lift scans in the four months before the fee is worked out, the
      daily figure is instead taken at the regular skier share of itself. Where the household holds a
      season pass standing active for the season and the pass account carries fewer lift scans than that
      threshold in those four months, the daily figure is instead taken at the passholder share of
      itself. The daily figure carries no uplift for what the collective has at stake in the kit. Where
      the security hold standing against the agreement is at or above the high exposure figure, the daily
      figure is instead raised by the high exposure uplift; where it is below that figure but at or above
      the moderate exposure figure, it is instead raised by the moderate exposure uplift. The daily figure is first taken at the standing share, and the figure that step leaves is then
      raised by the exposure uplift, so the uplift acts on what the share left and not on the daily
      figure the step before it started from; neither step is rounded before the fee is worked out. The fee for kit handed in after the date written on the
      agreement is the number of days in the stretch multiplied by the daily figure that stretch is
      charged at, worked out once at the end and rounded half up to two decimal places. The fee is never more than the package's replacement value. Kit that has reached a shop
      counter is charged under this rule for the whole stretch it stayed out, the package's
      replacement threshold neither stopping the accrual nor diverting the agreement to a
      replacement charge, and the security hold is not applied against it.
    prerequisite: []
    cross_category:
      - category: passes
        as: history
        reads: [status, season_code, passes_ledger.event_type]
        note: "Whether the household's season pass stands active and how many lift scans the pass account carries in the window decide which share of the daily figure the standing factor selects."
      - category: lodging
        as: branch
        reads: [season_code, departure_date]
        note: "The departure date of the household's collective lodging reservation decides how many days the resident relief factor sets aside."
    compute:
      - raw_stretch_days: "MX(0, DAYS(F('due_date'), F('returned_date')))"
      - notice_date: "LATEST('rentals_requests','requested_due_date', date_field='created_at', request_type='extension')"
      - last_use_date: "LATEST('rentals_ledger','service_date', date_field='service_date', event_type='rentals_day_consume')"
      - charged_stretch_days: "MX(0, DAYS(notice_date, F('returned_date'))) if notice_date else (MX(0, DAYS(last_use_date, F('returned_date'))) if (last_use_date and DAYS(F('due_date'), last_use_date) >= 0) else raw_stretch_days)"
      - lodging_departure_date: "CFIELD('lodging','departure_date', season_code=F('season_code'))"
      - relief_days: "MX(0, DAYS(F('due_date'), lodging_departure_date)) if (lodging_departure_date and DAYS(F('due_date'), lodging_departure_date) > 0) else (K('travel_day_relief_days') if lodging_departure_date else 0)"
      - billable_days: "MX(0, charged_stretch_days - relief_days)"
      - advance_lead_days: "DAYS(F('reserved_date'), F('pickup_date'))"
      - daily_figure: "RND(P('multi_day_daily_rate_usd') * (1 + K('late_uplift_pct') / 100), 2) if (advance_lead_days >= P('advance_booking_days_min') and F('rental_days_booked') >= P('multi_day_threshold_days')) else (RND(P('daily_rate_usd') * (1 + K('late_uplift_pct') / 100), 2) if advance_lead_days >= P('advance_booking_days_min') else P('late_return_fee_per_day_usd'))"
      - pass_active: "EXISTS('passes', status='active', season_code=F('season_code'))"
      - season_scan_count: "XCOUNT('passes','passes_ledger', within_months=4, event_type='passes_scan')"
      - standing_share: "K('regular_skier_share_pct') / 100 if (pass_active and season_scan_count >= K('regular_scan_threshold')) else (K('passholder_share_pct') / 100 if (pass_active and season_scan_count < K('regular_scan_threshold')) else 1.0)"
      - hold_standing: "SUM('rentals_ledger','amount_usd', event_type='rentals_deposit_hold') - SUM('rentals_ledger','amount_usd', event_type='rentals_deposit_release')"
      - exposure_uplift: "(1 + K('high_exposure_uplift_pct') / 100) if hold_standing >= K('high_exposure_usd') else ((1 + K('moderate_exposure_uplift_pct') / 100) if hold_standing >= K('moderate_exposure_usd') else 1.0)"
      - result: "RND(MN(billable_days * daily_figure * standing_share * exposure_uplift, P('replacement_value_usd')), 2)"
    compute_basis:
      raw_stretch_days: "The stretch is counted from the day after the date written on the agreement through the date the kit reached the counter inclusive, a day begun counting as a whole day, and it is never taken below zero."
      notice_date: "Where the shop holds a request on the agreement to keep the kit to a later date, the stretch is instead counted from the day after the date the guest asked to keep the kit to, through the date the kit reached the counter inclusive."
      last_use_date: "Where the shop holds no such request but the account already carries a date the kit was out falling on or after the date written on the agreement, the stretch is instead counted from the day after the last such date the account carries, through the date the kit reached the counter inclusive."
      charged_stretch_days: "The stretch is counted from the day after the date written on the agreement through the date the kit reached the counter inclusive, a day begun counting as a whole day, and it is never taken below zero. Where the shop holds a request on the agreement to keep the kit to a later date, the stretch is instead counted from the day after the date the guest asked to keep the kit to, through the date the kit reached the counter inclusive. Where the shop holds no such request but the account already carries a date the kit was out falling on or after the date written on the agreement, the stretch is instead counted from the day after the last such date the account carries, through the date the kit reached the counter inclusive."
      lodging_departure_date: "Where the household holds a collective lodging reservation for the season whose departure date falls after the date written on the agreement, the days from the day after that date through the departure date are instead set aside."
      relief_days: "No day of the stretch is set aside. Where the household holds a collective lodging reservation for the season whose departure date falls after the date written on the agreement, the days from the day after that date through the departure date are instead set aside. Where the household holds a collective lodging reservation for the season whose departure date falls on or before the date written on the agreement, the travel day relief is instead set aside."
      billable_days: "The days set aside are taken off the stretch before the fee is worked out, and the stretch is never taken below zero after they are taken off."
      advance_lead_days: "Where the agreement was recorded at least the package's advance booking period in days before the collection date and was written for at least the package's multi-day threshold in days, the daily figure is instead the package's multi-day day rate raised by the late hand-in uplift and rounded half up to two decimal places."
      daily_figure: "The daily figure that stretch is charged at is the package's own daily late fee. Where the agreement was recorded at least the package's advance booking period in days before the collection date and was written for at least the package's multi-day threshold in days, the daily figure is instead the package's multi-day day rate raised by the late hand-in uplift and rounded half up to two decimal places. Where the agreement was recorded at least that period before the collection date but was written for fewer days than that threshold, the daily figure is instead the package's shop day rate raised by the same uplift and rounded half up to two decimal places."
      pass_active: "Where the household holds a season pass standing active for the season and the pass account carries at least the regular skier scan threshold of lift scans in the four months before the fee is worked out, the daily figure is instead taken at the regular skier share of itself."
      season_scan_count: "Where the household holds a season pass standing active for the season and the pass account carries at least the regular skier scan threshold of lift scans in the four months before the fee is worked out, the daily figure is instead taken at the regular skier share of itself."
      standing_share: "The daily figure is taken in full, without the household's standing with the collective weighed against it. Where the household holds a season pass standing active for the season and the pass account carries at least the regular skier scan threshold of lift scans in the four months before the fee is worked out, the daily figure is instead taken at the regular skier share of itself. Where the household holds a season pass standing active for the season and the pass account carries fewer lift scans than that threshold in those four months, the daily figure is instead taken at the passholder share of itself."
      hold_standing: "Where the security hold standing against the agreement is at or above the high exposure figure, the daily figure is instead raised by the high exposure uplift; where it is below that figure but at or above the moderate exposure figure, it is instead raised by the moderate exposure uplift."
      exposure_uplift: "The daily figure carries no uplift for what the collective has at stake in the kit. Where the security hold standing against the agreement is at or above the high exposure figure, the daily figure is instead raised by the high exposure uplift; where it is below that figure but at or above the moderate exposure figure, it is instead raised by the moderate exposure uplift."
      result: "The daily figure is first taken at the standing share, and the figure that step leaves is then raised by the exposure uplift, so the uplift acts on what the share left and not on the daily figure the step before it started from; neither step is rounded before the fee is worked out. The fee for kit handed in after the date written on the agreement is the number of days in the stretch multiplied by the daily figure that stretch is charged at, worked out once at the end and rounded half up to two decimal places. The fee is never more than the package's replacement value."
    factors:
      - id: overdue_stretch_anchor
        effect: method
        decides: charged_stretch_days
        bindings: [notice_date, last_use_date, charged_stretch_days]
        ladder:
          - when: "the shop holds a request on the agreement to keep the kit to a later date"
            method: "the stretch is counted from the day after the date the guest asked to keep the kit to, through the date the kit reached the counter inclusive"
          - when: "the shop holds no request on the agreement to keep the kit to a later date and the account already carries a date the kit was out falling on or after the date written on the agreement"
            method: "the stretch is counted from the day after the last date the account carries for the kit being out, through the date the kit reached the counter inclusive"
          - when: "otherwise"
            method: "the stretch is counted from the day after the date written on the agreement through the date the kit reached the counter inclusive"
        baseline:
          charged_stretch_days: "raw_stretch_days"
        evidence: [history, date]
        cross_difficulty: null
      - id: resident_relief_days
        effect: parameter
        decides: relief_days
        bindings: [lodging_departure_date, relief_days]
        ladder:
          - when: "the household holds a collective lodging reservation for the season whose departure date falls after the date written on the agreement"
            value: "the days from the day after the date written on the agreement through that departure date"
          - when: "the household holds a collective lodging reservation for the season whose departure date falls on or before the date written on the agreement"
            value: "K('travel_day_relief_days')"
          - when: "otherwise"
            value: "0"
        baseline:
          relief_days: "0"
        evidence: [cross_category, date]
        cross_difficulty: lodging
      - id: daily_figure_basis
        effect: method
        decides: daily_figure
        bindings: [advance_lead_days, daily_figure]
        ladder:
          - when: "the agreement was recorded at least the package's advance booking period in days before the collection date and was written for at least the package's multi-day threshold in days"
            method: "the daily figure is the package's multi-day day rate raised by the late hand-in uplift and rounded half up to two decimal places"
          - when: "the agreement was recorded at least the package's advance booking period in days before the collection date and was written for fewer days than the package's multi-day threshold"
            method: "the daily figure is the package's shop day rate raised by the late hand-in uplift and rounded half up to two decimal places"
          - when: "otherwise"
            method: "the daily figure is the package's own daily late fee"
        baseline:
          daily_figure: "P('late_return_fee_per_day_usd')"
        evidence: [date]
        cross_difficulty: null
      - id: household_standing_share
        effect: parameter
        decides: standing_share
        bindings: [pass_active, season_scan_count, standing_share]
        ladder:
          - when: "the household holds a season pass standing active for the season and the pass account carries at least the regular skier scan threshold of lift scans in the four months before the fee is worked out"
            value: "K('regular_skier_share_pct')"
          - when: "the household holds a season pass standing active for the season and the pass account carries fewer lift scans than the regular skier scan threshold in those four months"
            value: "K('passholder_share_pct')"
          - when: "otherwise"
            value: "the daily figure in full"
        baseline:
          standing_share: "1.0"
        evidence: [cross_category, history]
        cross_difficulty: passes
      - id: kit_exposure_uplift
        effect: parameter
        decides: exposure_uplift
        bindings: [hold_standing, exposure_uplift]
        ladder:
          - when: "the security hold standing against the agreement is at or above the high exposure figure"
            value: "K('high_exposure_uplift_pct')"
          - when: "the security hold standing against the agreement is below the high exposure figure but at or above the moderate exposure figure"
            value: "K('moderate_exposure_uplift_pct')"
          - when: "otherwise"
            value: "no uplift at all"
        baseline:
          exposure_uplift: "1.0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The fee for kit handed in after the date written on the agreement rests on the stretch of days the
        kit stayed out beyond that date. The stretch is counted from the day after the date written on the
        agreement through the date the kit reached the counter inclusive, a day begun counting as a whole
        day, and it is never taken below zero. No day of the stretch is set aside. The days set aside are
        taken off the stretch before the fee is worked out, and the stretch is never taken below zero
        after they are taken off. The daily figure that stretch is charged at is the package's own daily
        late fee. The daily figure is taken in full, without the household's standing with the collective
        weighed against it. The daily figure carries no uplift for what the collective has at stake in the
        kit. The daily figure is first taken at the standing share, and the figure that step leaves is
        then raised by the exposure uplift, so the uplift acts on what the share left and not on the
        daily figure the step before it started from; neither step is rounded before the fee is
        worked out. The fee for kit handed in after the date
        written on the agreement is the number of days in the stretch multiplied by the daily figure that
        stretch is charged at, worked out once at the end and rounded half up to two decimal places. Kit that has reached a shop counter is charged under this rule for the whole stretch it
        stayed out, the package's replacement threshold neither stopping the accrual nor diverting
        the agreement to a replacement charge, and the security hold is not applied against it. The
        fee is never more than the package's replacement value.
      params: [late_return_fee_per_day_usd, replacement_value_usd]
    inputs:
      history:
        - {table: rentals_requests, aggregate: latest, field: requested_due_date, within_months: null, filters: {request_type: extension}}
        - {table: rentals_ledger, aggregate: latest, field: service_date, within_months: null, filters: {event_type: rentals_day_consume}}
        - {table: rentals_ledger, aggregate: sum, field: amount_usd, within_months: null, filters: {event_type: rentals_deposit_hold}}
        - {category: passes, table: passes_ledger, aggregate: count, field: pass_event_id, within_months: 4, filters: {event_type: passes_scan}}
      cross_category: [passes, lodging]

  - id: rentals_ext_counter_settlement
    base_policy_refs: [rentals_pricing, rentals_late_return, rentals_deposit_and_damage]
    overwrite: []
    trigger: state_due
    subject: [rentals_payment]
    computes: payment_amount_usd
    target_tool: settle_rental_balance_at_counter_64bcc7e2
    params:
      inactive_credit_cap_usd: 50
      long_hire_day_count: 5
      service_goodwill_usd: 25
      small_goodwill_usd: 10
      deferral_cap_usd: 50
    rule: >
      What the guest is asked to hand over at the counter on a rental agreement is worked out from what
      that agreement still owes the shop. The amount the guest is asked to hand over is fixed only after
      every finding a technician has entered against an item on the agreement carries the amount the guest
      bears for it.
      The amount the guest is asked to hand over is fixed only after the account carries the shop fee owed
      for the days the kit stayed out beyond the date written on the agreement. The whole of what still
      stands on the agreement, namely the hire rate and the add-ons raised on it together with the shop
      fees and the assessments raised on it, less the money already collected against it, is taken at the
      counter. Where the household holds a collective lodging reservation for the season, only the shop
      fees and the assessments raised on the agreement are taken at the counter, and what is left of the hire rate stands on the agreement to be collected another day. Where the household holds no collective lodging
      reservation for the season and the account carries no money collected against the agreement, only
      the hire rate and the add-ons raised on it, less the money already collected, are taken at the
      counter, and the shop fees and the assessments are left to the security hold. Nothing is set
      against what is taken from resort credit standing on the household's pass account. Where the
      household holds a season pass standing active for the season and the pass account carries resort
      credit issued and not yet drawn, the whole of that credit standing is set against what is taken.
      Where the household holds no season pass standing active for the season and the pass account
      carries resort credit issued and not yet drawn, that credit standing is set against what is taken
      up to the inactive credit cap. Nothing is written off for the shop's own part in the hire. Where
      the shop holds a request raised on the agreement and the account carries at least the long hire day
      count of dates the kit was out, the service goodwill allowance is written off what is taken. Where
      the shop holds a request raised on the agreement and the account carries fewer dates the kit was
      out than that count, the small goodwill allowance is written off instead. Nothing is left standing
      against the security hold. Where the account carries an assessment raised against the agreement and the security hold
      standing against it is at or above that assessment, the assessment is left standing against
      that hold up to the deferral cap. Where the account carries an assessment raised against the
      agreement and the security hold standing against it is below that assessment, the whole of the
      hold standing is left standing against the assessment. The credit set against what is taken, the allowance written off and the amount left standing
      against the hold are three amounts in money rather than shares of anything, and each is taken
      off the figure the counter step arrived at rather than off what another of the three has
      already left. The
      amount the guest is asked to hand over is what is left once all three are taken off, never below
      zero, and rounded half up to two decimal places at that last step only.
    prerequisite:
      - problem: rentals_ext_damage_assessment
        kind: value_input
        gate: assessments_raised
        form: state
        policy_source: >-
          The amount the guest is asked to hand over is fixed only after every finding a technician has
          entered against an item on the agreement carries the amount the guest bears for it.
        condition: >-
          Every finding a technician has entered against an item on the agreement carries, on the
          agreement's rental account, the amount the guest bears for it.
        resolved_by: assess_returned_kit_damage_f0dbd642
        effect: >-
          Once the amount the guest bears stands on that finding entry, the assessments raised on the
          agreement rise by that amount, and the figure taken at the counter is worked out over the larger
          sum.
      - problem: rentals_ext_late_handin_fee
        kind: value_input
        gate: shop_fees_raised
        form: state
        policy_source: >-
          The amount the guest is asked to hand over is fixed only after the account carries the shop fee
          owed for the days the kit stayed out beyond the date written on the agreement.
        condition: >-
          The agreement's rental account carries the shop fee owed for the days the kit stayed out beyond
          the date written on the agreement.
        resolved_by: raise_late_handin_fee_417b2597
        effect: >-
          Once that fee entry stands on the account, the shop fees raised on the agreement rise by the
          amount of the fee, and the figure taken at the counter is worked out over that larger sum.
    cross_category:
      - category: lodging
        as: existence
        reads: [season_code]
        note: "Whether the household holds a collective lodging reservation for the season decides which counter rule the settlement order factor selects."
      - category: passes
        as: history
        reads: [status, season_code, passes_ledger.event_type]
        note: "Whether the household's season pass stands active and how much resort credit the pass account carries decide how much the credit factor sets against what is taken."
    compute:
      - rate_charges_raised: "SUM('rentals_ledger','amount_usd', event_type='rentals_rate_charge')"
      - shop_fees_raised: "SUM('rentals_ledger','amount_usd', event_type='rentals_fee_charge')"
      - assessments_raised: "SUM('rentals_ledger','amount_usd', event_type='rentals_damage_charge')"
      - money_already_collected: "SUM('rentals_ledger','amount_usd', event_type='rentals_payment')"
      - lodging_on_account: "EXISTS('lodging', season_code=F('season_code'))"
      - payment_entries: "COUNT('rentals_ledger', event_type='rentals_payment')"
      - collectable_now: "MX(0.0, shop_fees_raised + assessments_raised) if lodging_on_account else (MX(0.0, rate_charges_raised - money_already_collected) if payment_entries < 1 else MX(0.0, rate_charges_raised + shop_fees_raised + assessments_raised - money_already_collected))"
      - pass_active: "EXISTS('passes', status='active', season_code=F('season_code'))"
      - credit_standing: "XSUM('passes','passes_ledger','amount_usd', event_type='passes_credit_issue') - XSUM('passes','passes_ledger','amount_usd', event_type='passes_credit_redeem')"
      - credit_applied: "credit_standing if (pass_active and credit_standing > 0) else (MN(credit_standing, K('inactive_credit_cap_usd')) if ((not pass_active) and credit_standing > 0) else 0.0)"
      - request_entries: "COUNT('rentals_requests')"
      - dates_out_recorded: "COUNT('rentals_ledger', event_type='rentals_day_consume')"
      - goodwill_allowed: "K('service_goodwill_usd') if (request_entries >= 1 and dates_out_recorded >= K('long_hire_day_count')) else (K('small_goodwill_usd') if (request_entries >= 1 and dates_out_recorded < K('long_hire_day_count')) else 0)"
      - hold_standing: "MX(0.0, SUM('rentals_ledger','amount_usd', event_type='rentals_deposit_hold') - SUM('rentals_ledger','amount_usd', event_type='rentals_deposit_release'))"
      - deferred_against_hold: "MN(assessments_raised, K('deferral_cap_usd')) if (assessments_raised > 0 and hold_standing >= assessments_raised) else (hold_standing if assessments_raised > 0 else 0.0)"
      - result: "RND(MX(0.0, collectable_now - credit_applied - goodwill_allowed - deferred_against_hold), 2)"
    compute_basis:
      rate_charges_raised: "The whole of what still stands on the agreement, namely the hire rate and the add-ons raised on it together with the shop fees and the assessments raised on it, less the money already collected against it, is taken at the counter."
      shop_fees_raised: "The whole of what still stands on the agreement, namely the hire rate and the add-ons raised on it together with the shop fees and the assessments raised on it, less the money already collected against it, is taken at the counter."
      assessments_raised: "The whole of what still stands on the agreement, namely the hire rate and the add-ons raised on it together with the shop fees and the assessments raised on it, less the money already collected against it, is taken at the counter."
      money_already_collected: "The whole of what still stands on the agreement, namely the hire rate and the add-ons raised on it together with the shop fees and the assessments raised on it, less the money already collected against it, is taken at the counter."
      lodging_on_account: "Where the household holds a collective lodging reservation for the season, only the shop fees and the assessments raised on the agreement are taken at the counter, and what is left of the hire rate stands on the agreement to be collected another day."
      payment_entries: "Where the household holds no collective lodging reservation for the season and the account carries no money collected against the agreement, only the hire rate and the add-ons raised on it, less the money already collected, are taken at the counter, and the shop fees and the assessments are left to the security hold."
      collectable_now: "The whole of what still stands on the agreement, namely the hire rate and the add-ons raised on it together with the shop fees and the assessments raised on it, less the money already collected against it, is taken at the counter. Where the household holds a collective lodging reservation for the season, only the shop fees and the assessments raised on the agreement are taken at the counter, and what is left of the hire rate stands on the agreement to be collected another day. Where the household holds no collective lodging reservation for the season and the account carries no money collected against the agreement, only the hire rate and the add-ons raised on it, less the money already collected, are taken at the counter, and the shop fees and the assessments are left to the security hold."
      pass_active: "Where the household holds a season pass standing active for the season and the pass account carries resort credit issued and not yet drawn, the whole of that credit standing is set against what is taken."
      credit_standing: "Where the household holds a season pass standing active for the season and the pass account carries resort credit issued and not yet drawn, the whole of that credit standing is set against what is taken."
      credit_applied: "Nothing is set against what is taken from resort credit standing on the household's pass account. Where the household holds a season pass standing active for the season and the pass account carries resort credit issued and not yet drawn, the whole of that credit standing is set against what is taken. Where the household holds no season pass standing active for the season and the pass account carries resort credit issued and not yet drawn, that credit standing is set against what is taken up to the inactive credit cap."
      request_entries: "Where the shop holds a request raised on the agreement and the account carries at least the long hire day count of dates the kit was out, the service goodwill allowance is written off what is taken."
      dates_out_recorded: "Where the shop holds a request raised on the agreement and the account carries fewer dates the kit was out than that count, the small goodwill allowance is written off instead."
      goodwill_allowed: "Nothing is written off for the shop's own part in the hire. Where the shop holds a request raised on the agreement and the account carries at least the long hire day count of dates the kit was out, the service goodwill allowance is written off what is taken. Where the shop holds a request raised on the agreement and the account carries fewer dates the kit was out than that count, the small goodwill allowance is written off instead."
      hold_standing: "Where the account carries an assessment raised against the agreement and the security hold standing against it is at or above that assessment, the assessment is left standing against that hold up to the deferral cap."
      deferred_against_hold: "Nothing is left standing against the security hold. Where the account carries an assessment raised against the agreement and the security hold standing against it is at or above that assessment, the assessment is left standing against that hold up to the deferral cap. Where the account carries an assessment raised against the agreement and the security hold standing against it is below that assessment, the whole of the hold standing is left standing against the assessment."
      result: "The credit set against what is taken, the allowance written off and the amount left standing against the hold are three amounts in money rather than shares of anything, and each is taken off the figure the counter step arrived at rather than off what another of the three has already left. The amount the guest is asked to hand over is what is left once all three are taken off, never below zero, and rounded half up to two decimal places at that last step only."
    factors:
      - id: counter_settlement_order
        effect: method
        decides: collectable_now
        bindings: [lodging_on_account, payment_entries, collectable_now]
        ladder:
          - when: "the household holds a collective lodging reservation for the season"
            method: "only the shop fees and the assessments raised on the agreement are taken at the counter, and what is left of the hire rate stands on the agreement to be collected another day"
          - when: "the household holds no collective lodging reservation for the season and the account carries no money collected against the agreement"
            method: "only the hire rate and the add-ons raised on it, less the money already collected, are taken at the counter, and the shop fees and the assessments are left to the security hold"
          - when: "otherwise"
            method: "the whole of what still stands on the agreement, less the money already collected against it, is taken at the counter"
        baseline:
          collectable_now: "MX(0.0, rate_charges_raised + shop_fees_raised + assessments_raised - money_already_collected)"
        evidence: [cross_category, history]
        cross_difficulty: lodging
      - id: resort_credit_offset
        effect: parameter
        decides: credit_applied
        bindings: [pass_active, credit_standing, credit_applied]
        ladder:
          - when: "the household holds a season pass standing active for the season and the pass account carries resort credit issued and not yet drawn"
            value: "the whole of the credit standing on the pass account"
          - when: "the household holds no season pass standing active for the season and the pass account carries resort credit issued and not yet drawn"
            value: "the credit standing, up to K('inactive_credit_cap_usd')"
          - when: "otherwise"
            value: "0"
        baseline:
          credit_applied: "0.0"
        evidence: [cross_category]
        cross_difficulty: passes
      - id: service_goodwill_allowance
        effect: parameter
        decides: goodwill_allowed
        bindings: [request_entries, dates_out_recorded, goodwill_allowed]
        ladder:
          - when: "the shop holds a request raised on the agreement and the account carries at least the long hire day count of dates the kit was out"
            value: "K('service_goodwill_usd')"
          - when: "the shop holds a request raised on the agreement and the account carries fewer dates the kit was out than the long hire day count"
            value: "K('small_goodwill_usd')"
          - when: "otherwise"
            value: "0"
        baseline:
          goodwill_allowed: "0"
        evidence: [history]
        cross_difficulty: null
      - id: assessment_left_to_hold
        effect: parameter
        decides: deferred_against_hold
        bindings: [hold_standing, deferred_against_hold]
        ladder:
          - when: "the account carries an assessment raised against the agreement and the security hold standing against it is at or above that assessment"
            value: "the assessment raised, up to K('deferral_cap_usd')"
          - when: "the account carries an assessment raised against the agreement and the security hold standing against it is below that assessment"
            value: "the whole of the hold standing"
          - when: "otherwise"
            value: "0"
        baseline:
          deferred_against_hold: "0.0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        What the guest is asked to hand over at the counter on a rental agreement is worked out from what
        that agreement still owes the shop. The whole of what still stands on the agreement, namely the
        hire rate and the add-ons raised on it together with the shop fees and the assessments raised on
        it, less the money already collected against it, is taken at the counter. Nothing is set against
        what is taken from resort credit standing on the household's pass account. Nothing is written off
        for the shop's own part in the hire. Nothing is left standing against the security hold. The credit set against what is taken, the allowance written off and the amount left standing
        against the hold are three amounts in money rather than shares of anything, and each is
        taken off the figure the counter step arrived at rather than off what another of the three
        has already left. The amount the guest is asked to hand over is what is left once all three are
        taken off, never below zero, and rounded half up to two decimal places at that last step only.
      params: []
    inputs:
      history:
        - {table: rentals_ledger, aggregate: sum, field: amount_usd, within_months: null, filters: {event_type: rentals_rate_charge}}
        - {table: rentals_ledger, aggregate: sum, field: amount_usd, within_months: null, filters: {event_type: rentals_fee_charge}}
        - {table: rentals_ledger, aggregate: sum, field: amount_usd, within_months: null, filters: {event_type: rentals_damage_charge}}
        - {table: rentals_ledger, aggregate: sum, field: amount_usd, within_months: null, filters: {event_type: rentals_payment}}
        - {category: passes, table: passes_ledger, aggregate: sum, field: amount_usd, within_months: null, filters: {event_type: passes_credit_issue}}
      cross_category: [lodging, passes]

  - id: rentals_ext_security_hold_settlement
    base_policy_refs: [rentals_deposit_and_damage, rentals_return_and_closure, rentals_pricing]
    overwrite:
      - base_policy: rentals_deposit_and_damage
        superseded_clause: >-
          The hold is released once the assessment is settled, in whole where nothing is owed and in part
          where something is.
        replaced_by: >-
          The amount kept back is what is then left taken once over.
    trigger: state_due
    subject: [rentals_deposit_release]
    computes: release_amount_usd
    target_tool: release_rental_security_hold_9f65c28a
    params:
      assessed_retention_multiple_pct: 125
      clean_retention_multiple_pct: 100
      open_retention_multiple_pct: 150
      folio_transfer_cap_usd: 120
      clean_waiveback_usd: 60
      declined_waiveback_usd: 20
      prompt_settlement_days: 2
    rule: >
      What goes back to the guest from the security hold standing against a rental agreement is the hold
      standing less the amount kept back against what that agreement still owes. What goes back to the
      guest is worked out only after the money collected against the agreement stands against the charges
      raised on it. What the agreement still owes is the hire rate and the add-ons raised on it together with the
      shop fees and the assessments raised on it, less the money collected against it, rounded half
      up to two decimal places, and it is never below zero. Nothing of what the
      agreement still owes is moved to a lodging folio. Where the household holds a collective lodging
      reservation for the season standing checked out whose folio carries money still to be collected,
      the whole of what the agreement still owes is moved to that folio. Where the household holds a
      collective lodging reservation for the season standing checked out whose folio carries nothing
      still to be collected, what is moved to that folio is capped at the folio transfer cap. Nothing of
      what the agreement still owes is met by a protection plan. Where the household holds a protection
      plan standing active written over the agreement whose cover left is at or above what the agreement
      still owes, the whole of what it still owes is met by that plan. Where the household holds a
      protection plan standing active written over the agreement whose cover left is below what the
      agreement still owes, the cover left on it is met by that plan. What is moved to a folio and what
      is met by a protection plan are both taken off what the agreement still owes before the multiple is
      applied, and what is left is never below zero. The amount kept back is what is then left taken once
      over. Where the account carries an assessment against an item on the agreement and the agreement
      stands with the kit handed in, the amount kept back is instead the assessed retention multiple of
      what is then left. Where the agreement does not yet stand with the kit handed in, the amount kept
      back is instead the open retention multiple of it. Nothing is released back to the household on its
      standing with the collective. Where the household holds a season pass standing active for the
      season and the pass account shows nothing still to be collected on its instalments, the clean
      standing allowance is released back and taken off the amount kept back. Where the household
      holds a season pass standing active for the season and the pass account shows an instalment
      balance still to be collected, the declined standing allowance is released back instead. The allowance is taken off the amount kept back after
      the multiple has been applied, and the amount kept back is never below zero. The amount kept back is
      taken to the cent. Where the kit reached the counter at least the prompt settlement day count of
      days before the hold is settled and the account carries more than one payment collected against the
      agreement, the amount kept back is instead carried up to the whole dollar above. Where the kit reached the counter at least that many days before the hold is settled and the
      account carries one payment or none against the agreement, the greater of the amount kept back and the assessments raised on the agreement is instead
      kept back, taken to the cent and never more than what the agreement still owes. What goes back to the guest is the security hold standing less the amount kept back, never
      below zero, rounded half up to two decimal places. Where the whole of the hold standing goes back
      the entry is recorded as released, where part of it is kept back the entry is recorded as partially
      forfeited, and where none of it goes back the entry is recorded as forfeited.
    prerequisite:
      - problem: rentals_ext_counter_settlement
        kind: value_input
        gate: money_collected
        form: state
        policy_source: >-
          What goes back to the guest is worked out only after the money collected against the agreement
          stands against the charges raised on it.
        condition: >-
          The agreement's rental account carries the money collected against the charges raised on the
          agreement.
        resolved_by: settle_rental_balance_at_counter_64bcc7e2
        effect: >-
          Once the money collected stands on the account, the money collected against the agreement rises
          by the amount taken, what the agreement still owes falls by the same amount, and less of the
          security hold is kept back.
    cross_category:
      - category: lodging
        as: branch
        reads: [season_code, status, folio_balance_usd]
        note: "The state of the household's collective lodging reservation and its folio balance decide how much the folio transfer factor moves off what the agreement still owes."
      - category: passes
        as: branch
        reads: [status, season_code, installment_balance_usd]
        note: "Whether the household's season pass stands active and whether its pass account shows an instalment balance still to be collected decide which standing allowance is released back."
      - category: insure
        as: branch
        reads: [status, covered_holding_id, benefit_remaining_usd]
        note: "The cover left on a protection plan written over the agreement decides how much the protection factor meets of what the agreement still owes."
    compute:
      - hold_placed: "SUM('rentals_ledger','amount_usd', event_type='rentals_deposit_hold')"
      - hold_given_back: "SUM('rentals_ledger','amount_usd', event_type='rentals_deposit_release')"
      - hold_standing: "MX(0.0, hold_placed - hold_given_back)"
      - charges_raised: "SUM('rentals_ledger','amount_usd', event_type='rentals_rate_charge') + SUM('rentals_ledger','amount_usd', event_type='rentals_fee_charge') + SUM('rentals_ledger','amount_usd', event_type='rentals_damage_charge')"
      - money_collected: "SUM('rentals_ledger','amount_usd', event_type='rentals_payment')"
      - assessments_standing: "SUM('rentals_ledger','amount_usd', event_type='rentals_damage_charge')"
      - uncollected_balance: "MX(0.0, RND(charges_raised - money_collected, 2))"
      - lodging_state: "CFIELD('lodging','status', season_code=F('season_code'))"
      - lodging_folio_balance: "CFIELD('lodging','folio_balance_usd', season_code=F('season_code'))"
      - folio_transfer: "uncollected_balance if (lodging_state == 'checked_out' and float(lodging_folio_balance or 0) > 0) else (MN(uncollected_balance, K('folio_transfer_cap_usd')) if (lodging_state == 'checked_out' and float(lodging_folio_balance or 0) <= 0) else 0.0)"
      - protection_cover_left: "CFIELD('insure','benefit_remaining_usd', covered_holding_id=HID, status='active')"
      - protection_met: "uncollected_balance if (protection_cover_left and float(protection_cover_left) >= uncollected_balance) else (float(protection_cover_left) if protection_cover_left else 0.0)"
      - kept_base: "MX(0.0, uncollected_balance - folio_transfer - protection_met)"
      - assessment_entries: "COUNT('rentals_ledger', event_type='rentals_damage_charge')"
      - retention_multiple: "K('assessed_retention_multiple_pct') / 100 if (assessment_entries >= 1 and F('status') == 'returned') else (K('open_retention_multiple_pct') / 100 if F('status') != 'returned' else K('clean_retention_multiple_pct') / 100)"
      - pass_active: "EXISTS('passes', status='active', season_code=F('season_code'))"
      - pass_installment_balance: "CFIELD('passes','installment_balance_usd', status='active', season_code=F('season_code'))"
      - standing_allowance: "K('clean_waiveback_usd') if (pass_active and float(pass_installment_balance or 0) <= 0) else (K('declined_waiveback_usd') if (pass_active and float(pass_installment_balance or 0) > 0) else 0)"
      - retained_raw: "MX(0.0, kept_base * retention_multiple - standing_allowance)"
      - settle_gap_days: "DAYS(F('returned_date'), NOW)"
      - payment_entries: "COUNT('rentals_ledger', event_type='rentals_payment')"
      - retained_amount: "float(-(-retained_raw // 1)) if (settle_gap_days >= K('prompt_settlement_days') and payment_entries > 1) else (RND(MN(MX(retained_raw, assessments_standing), uncollected_balance), 2) if settle_gap_days >= K('prompt_settlement_days') else RND(retained_raw, 2))"
      - result: "RND(MX(0.0, hold_standing - retained_amount), 2)"
    compute_basis:
      hold_placed: "What goes back to the guest from the security hold standing against a rental agreement is the hold standing less the amount kept back against what that agreement still owes."
      hold_given_back: "What goes back to the guest from the security hold standing against a rental agreement is the hold standing less the amount kept back against what that agreement still owes."
      hold_standing: "What goes back to the guest from the security hold standing against a rental agreement is the hold standing less the amount kept back against what that agreement still owes."
      charges_raised: "What the agreement still owes is the hire rate and the add-ons raised on it together with the shop fees and the assessments raised on it, less the money collected against it, rounded half up to two decimal places, and it is never below zero."
      money_collected: "What the agreement still owes is the hire rate and the add-ons raised on it together with the shop fees and the assessments raised on it, less the money collected against it, rounded half up to two decimal places, and it is never below zero."
      uncollected_balance: "What the agreement still owes is the hire rate and the add-ons raised on it together with the shop fees and the assessments raised on it, less the money collected against it, rounded half up to two decimal places, and it is never below zero."
      lodging_state: "Where the household holds a collective lodging reservation for the season standing checked out whose folio carries money still to be collected, the whole of what the agreement still owes is moved to that folio."
      lodging_folio_balance: "Where the household holds a collective lodging reservation for the season standing checked out whose folio carries nothing still to be collected, what is moved to that folio is capped at the folio transfer cap."
      folio_transfer: "Nothing of what the agreement still owes is moved to a lodging folio. Where the household holds a collective lodging reservation for the season standing checked out whose folio carries money still to be collected, the whole of what the agreement still owes is moved to that folio. Where the household holds a collective lodging reservation for the season standing checked out whose folio carries nothing still to be collected, what is moved to that folio is capped at the folio transfer cap."
      protection_cover_left: "Where the household holds a protection plan standing active written over the agreement whose cover left is below what the agreement still owes, the cover left on it is met by that plan."
      protection_met: "Nothing of what the agreement still owes is met by a protection plan. Where the household holds a protection plan standing active written over the agreement whose cover left is at or above what the agreement still owes, the whole of what it still owes is met by that plan. Where the household holds a protection plan standing active written over the agreement whose cover left is below what the agreement still owes, the cover left on it is met by that plan."
      kept_base: "What is moved to a folio and what is met by a protection plan are both taken off what the agreement still owes before the multiple is applied, and what is left is never below zero."
      assessment_entries: "Where the account carries an assessment against an item on the agreement and the agreement stands with the kit handed in, the amount kept back is instead the assessed retention multiple of what is then left."
      retention_multiple: "The amount kept back is what is then left taken once over. Where the account carries an assessment against an item on the agreement and the agreement stands with the kit handed in, the amount kept back is instead the assessed retention multiple of what is then left. Where the agreement does not yet stand with the kit handed in, the amount kept back is instead the open retention multiple of it."
      pass_active: "Where the household holds a season pass standing active for the season and the pass account shows nothing still to be collected on its instalments, the clean standing allowance is released back and taken off the amount kept back."
      pass_installment_balance: "Where the household holds a season pass standing active for the season and the pass account shows an instalment balance still to be collected, the declined standing allowance is released back instead."
      standing_allowance: "Nothing is released back to the household on its standing with the collective. Where the household holds a season pass standing active for the season and the pass account shows nothing still to be collected on its instalments, the clean standing allowance is released back and taken off the amount kept back. Where the household holds a season pass standing active for the season and the pass account shows an instalment balance still to be collected, the declined standing allowance is released back instead."
      retained_raw: "The allowance is taken off the amount kept back after the multiple has been applied, and the amount kept back is never below zero."
      settle_gap_days: "Where the kit reached the counter at least the prompt settlement day count of days before the hold is settled and the account carries more than one payment collected against the agreement, the amount kept back is instead carried up to the whole dollar above."
      payment_entries: "Where the kit reached the counter at least that many days before the hold is settled and the account carries one payment or none against the agreement, the greater of the amount kept back and the assessments raised on the agreement is instead kept back, taken to the cent and never more than what the agreement still owes."
      retained_amount: "The amount kept back is taken to the cent. Where the kit reached the counter at least the prompt settlement day count of days before the hold is settled and the account carries more than one payment collected against the agreement, the amount kept back is instead carried up to the whole dollar above. Where the kit reached the counter at least that many days before the hold is settled and the account carries one payment or none against the agreement, the greater of the amount kept back and the assessments raised on the agreement is instead kept back, taken to the cent and never more than what the agreement still owes."
      result: "What goes back to the guest is the security hold standing less the amount kept back, never below zero, rounded half up to two decimal places."
    factors:
      - id: folio_transfer_scope
        effect: parameter
        decides: folio_transfer
        bindings: [lodging_state, lodging_folio_balance, folio_transfer]
        ladder:
          - when: "the household holds a collective lodging reservation for the season standing checked out whose folio carries money still to be collected"
            value: "the whole of what the agreement still owes"
          - when: "the household holds a collective lodging reservation for the season standing checked out whose folio carries nothing still to be collected"
            value: "what the agreement still owes, up to K('folio_transfer_cap_usd')"
          - when: "otherwise"
            value: "0"
        baseline:
          folio_transfer: "0.0"
        evidence: [cross_category]
        cross_difficulty: lodging
      - id: protection_cover_offset
        effect: parameter
        decides: protection_met
        bindings: [protection_cover_left, protection_met]
        ladder:
          - when: "the household holds a protection plan standing active written over the agreement whose cover left is at or above what the agreement still owes"
            value: "the whole of what the agreement still owes"
          - when: "the household holds a protection plan standing active written over the agreement whose cover left is below what the agreement still owes"
            value: "the cover left on that plan"
          - when: "otherwise"
            value: "0"
        baseline:
          protection_met: "0.0"
        evidence: [cross_category]
