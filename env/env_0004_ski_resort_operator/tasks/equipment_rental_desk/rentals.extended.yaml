  - type: rentals_deposit_release
    target: rentals_ledger
    meaning: "The security hold on an agreement is released back to the guest, in whole or in part after damage is settled."
    grain: "One row per release of a security hold on one agreement."
    distinguish_by: [event_date, amount_usd, deposit_status]
    fields:
      rental_event_id: "Reference number of this rental account entry."
      rental_id: "The agreement this entry belongs to."
      customer_id: "The household account this entry belongs to."
      event_type: "The kind of rental account entry this row records."
      related_event_id: "The security hold entry this release answers to."
      event_date: "Date the release was made."
      amount_usd: "Amount released."
