            value: "P('advance_booking_discount_pct')"
          - when: "the reservation was recorded at least the package's advance booking period in days before the collection date and the agreement runs for fewer days than that threshold"
            value: "half of P('advance_booking_discount_pct')"
          - when: "otherwise"
