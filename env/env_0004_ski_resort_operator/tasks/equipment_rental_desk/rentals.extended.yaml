  - id: rentals_ext_extension_charge
    base_policy_refs: [rentals_swap_and_extension, rentals_late_return, rentals_pricing]
    overwrite:
      - base_policy: rentals_swap_and_extension
        superseded_clause: >-
          An agreement may be extended while the kit is still out, where the package allows it and by no
          more than the package's extension limit; the extra days are charged at the rate the agreement was
          written on and the package's extension fee is raised on top.
        replaced_by: >-
          Each extra day is charged at the package's multi-day day rate, and the package's extension fee is
          raised on top of the extra days.
      - base_policy: rentals_pricing
        superseded_clause: >-
          Add-ons the guest takes are raised as their own entries at the package's add-on prices, and an
          add-on already included in the package is never raised as a charge.
        replaced_by: >-
          Nothing is added to the daily figure for a helmet carried on into the extra days.
    trigger: on_request
    subject: [rentals_extend, rentals_fee_charge]
    computes: extension_charge_usd
    target_tool: confirm_rental_extension_b56bb368
    params:
      regular_scan_threshold: 6
      regular_free_days: 2
      passholder_free_days: 1
      resident_share_pct: 80
      post_stay_share_pct: 110
      early_notice_days: 2
      early_notice_pct: 92
      late_notice_pct: 115
    rule: >
      The charge for keeping hire kit longer than the agreement was written for rests on the extra days
      asked for and the daily figure those days are charged at. The extra days are the calendar days from
      the date written on the agreement to the date the guest has asked the kit to be kept to, and they
      are never more than the package's extension limit and never below zero. The charge for the extra
      days is fixed only after the hire rate for the days the agreement was written for stands on its
      rental account. The charge for the extra days is fixed only after every change of model recorded on
      the agreement carries the shop's fee owed for it. No day of the extension is given free. Where the
      rider holds a season pass standing active for the season and the pass account carries at least the
      regular skier scan threshold of lift scans in the three months before the extension is priced, the
      regular skier free days are given free; where the rider holds a season pass standing active for the
      season and the pass account carries fewer lift scans than that threshold in those three months, the
      passholder free days are given free. The days given free are taken off the extra days before the
      charge is worked out, and the extra days are never taken below zero after they are taken off. Each
      extra day is charged at the package's multi-day day rate, and the package's extension fee is raised
      on top of the extra days. Where the account carries the hire rate for the agreement and the
      agreement was written for at least the package's multi-day threshold in days, each extra day is
      instead charged at the rate the agreement was actually written on, namely the hire rate standing on
      the account divided by the days the agreement was written for and rounded half up to two decimal
      places. Where the account carries the hire rate for the agreement and the agreement was written for
      fewer days than that threshold, each extra day is instead charged at the package's shop day rate.
      The daily figure is taken in full, without where the guest is staying weighed against it. Where the
      household holds a collective lodging reservation for the season whose departure date falls on or
      after the date the guest has asked the kit to be kept to, the daily figure is instead taken at the
      resident share of itself; where the household holds a collective lodging reservation for the season
      whose departure date falls before that date, it is instead taken at the post stay share of itself.
      The daily figure is taken in full, without the notice the guest gave weighed against it. Where the
      shop holds the request to keep the kit to a later date raised at least the early notice days before
      the date written on the agreement, the daily figure is instead taken at the early notice share of
      itself; where that request was raised on or after the date written on the agreement, it is instead
      taken at the late notice share of itself. Nothing is added to the daily figure for a helmet carried
      on into the extra days. Where the account carries the package's helmet add-on against the agreement
      and the agreement stands with the kit out, the package's helmet day price is added to the daily
      figure for each extra day; where the account carries that add-on and the agreement does not stand
      with the kit out, half that price is added. The package's extension fee is raised in full on top.
      Where the account carries the shop's fee for a change of model against the agreement and the
      agreement was written for at least the package's multi-day threshold in days, no extension fee is
      raised at all; where the account carries that fee and the agreement was written for fewer days than
      that threshold, half the package's extension fee is raised. Where the package is one the collective does not extend, no charge for extra days arises under
      this rule and the agreement runs to the date written on it. The daily figure is first taken at
      the resident share, and the figure that step leaves is then taken at the notice share, so the
      notice share acts on what the resident share left and not on the daily figure the step before
      it started from; the helmet addition is added to the figure the two shares leave, and the
      extension fee is added once to the whole rather than to each day. The charge is worked out once and rounded half up to two decimal places. An extension is recorded before the kit falls due, and kit already overdue is handled as a
      late hand-in instead. A season lease is not extended at all.
    prerequisite:
      - problem: rentals_ext_party_rate_charge
        kind: value_input
        gate: rate_charged
        form: state
        policy_source: >-
          The charge for the extra days is fixed only after the hire rate for the days the agreement was
          written for stands on its rental account.
        condition: >-
          The agreement's rental account carries the hire rate entry for the days the agreement was written
          for.
        resolved_by: raise_rental_rate_charge_fcd244c0
        effect: >-
          Once the hire rate stands on the account, the hire rate standing on the agreement rises from
          nothing to that amount, and each extra day is charged at the rate the agreement was actually
          written on rather than at the package's multi-day day rate.
      - problem: rentals_ext_model_change_fee
        kind: value_input
        gate: change_fee_entries
        form: state
        policy_source: >-
          The charge for the extra days is fixed only after every change of model recorded on the agreement
          carries the shop's fee owed for it.
        condition: >-
          Every change of model recorded on the agreement carries, on the agreement's rental account, the
          shop's fee owed for it.
        resolved_by: raise_model_change_fee_b751c3b4
        effect: >-
          Once that fee entry stands on the account, the account carries the shop's fee for a change of
          model, and the package's extension fee falls away from the charge.
    cross_category:
      - category: passes
        as: history
        reads: [status, season_code, passes_ledger.event_type]
        note: "Whether the rider's season pass stands active and how many lift scans the pass account carries in the window decide how many days of the extension are given free."
      - category: lodging
        as: branch
        reads: [season_code, departure_date]
        note: "The departure date of the household's collective lodging reservation decides which share of the daily figure the residence factor takes."
    compute:
      - request_raised_date: "LATEST('rentals_requests','created_at', date_field='created_at', request_type='extension')"
      - requested_due_date: "LATEST('rentals_requests','requested_due_date', date_field='created_at', request_type='extension')"
      - asked_extra_days: "MX(0, DAYS(F('due_date'), requested_due_date))"
      - extra_days: "MN(asked_extra_days, P('extension_max_days'))"
      - pass_active: "EXISTS('passes', status='active', season_code=F('season_code'))"
      - season_scan_count: "XCOUNT('passes','passes_ledger', within_months=3, event_type='passes_scan')"
      - free_extra_days: "K('regular_free_days') if (pass_active and season_scan_count >= K('regular_scan_threshold')) else (K('passholder_free_days') if (pass_active and season_scan_count < K('regular_scan_threshold')) else 0)"
      - billable_extra_days: "MX(0, extra_days - free_extra_days)"
      - rate_charged: "SUM('rentals_ledger','amount_usd', event_type='rentals_rate_charge', charge_category='rental_rate')"
      - extra_day_figure: "RND(rate_charged / MX(1, F('rental_days_booked')), 2) if (rate_charged > 0 and F('rental_days_booked') >= P('multi_day_threshold_days')) else (P('daily_rate_usd') if rate_charged > 0 else P('multi_day_daily_rate_usd'))"
      - lodging_departure_date: "CFIELD('lodging','departure_date', season_code=F('season_code'))"
      - residence_share: "K('resident_share_pct') / 100 if (lodging_departure_date and DAYS(requested_due_date, lodging_departure_date) >= 0) else (K('post_stay_share_pct') / 100 if lodging_departure_date else 1.0)"
      - notice_lead_days: "MX(0, DAYS(request_raised_date, F('due_date')))"
      - notice_share: "K('early_notice_pct') / 100 if notice_lead_days >= K('early_notice_days') else (K('late_notice_pct') / 100 if notice_lead_days <= 0 else 1.0)"
      - helmet_addon_entries: "COUNT('rentals_ledger', event_type='rentals_rate_charge', charge_category='helmet_addon')"
      - helmet_day_addition: "P('helmet_daily_rate_usd') if (helmet_addon_entries >= 1 and F('status') == 'picked_up') else (RND(P('helmet_daily_rate_usd') / 2, 2) if (helmet_addon_entries >= 1 and F('status') != 'picked_up') else 0)"
      - change_fee_entries: "COUNT('rentals_ledger', event_type='rentals_fee_charge', charge_category='swap_fee')"
      - extension_fee_due: "0 if (change_fee_entries >= 1 and F('rental_days_booked') >= P('multi_day_threshold_days')) else (RND(P('extension_fee_usd') / 2, 2) if (change_fee_entries >= 1 and F('rental_days_booked') < P('multi_day_threshold_days')) else P('extension_fee_usd'))"
      - result: "RND(billable_extra_days * (extra_day_figure * residence_share * notice_share + helmet_day_addition) + extension_fee_due, 2) if P('extension_allowed') else 0.0"
    compute_basis:
