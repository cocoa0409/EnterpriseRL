      service_nights: "Where the folio shows the party occupied every night the reservation covers, they are worked out over every night the reservation covers. Where the folio shows the party occupied fewer nights than the reservation covers and a departure is recorded on the reservation, they are worked out over every night from the arrival date to the recorded departure, because a unit the party has not given back is a unit the collective cannot let. In every other case they are worked out over the nights the folio shows consumed."
      has_dog: "Where the reservation records one or more dogs and the folio shows the party occupied at least the unit type's length-of-stay threshold in nights, the deep clean share of the unit type's housekeeping charge is taken."
      long_stay_occupancy: "Where the reservation records one or more dogs, or the folio shows the party occupied at least that threshold in nights, but not both, the extended clean share of that charge is taken."
      housekeeping_amount: "The unit type's housekeeping charge and its nightly parking charge are the figures this charge starts from, and each of them is varied by what the records of the stay show, with a turnover charge added on top of the housekeeping charge for a party larger than the unit sleeps as standard. What the servicing itself costs turns on what the unit has to be put right from. Where the reservation records one or more dogs and the folio shows the party occupied at least the unit type's length-of-stay threshold in nights, the deep clean share of the unit type's housekeeping charge is taken. Where the reservation records one or more dogs, or the folio shows the party occupied at least that threshold in nights, but not both, the extended clean share of that charge is taken. Where neither holds, the unit type's housekeeping charge is taken as it stands."
      pet_element: "The departure services charge is what a stay owes on departure for servicing the unit and for the nightly extras the party asked for: the unit type's housekeeping charge, its nightly charge for each dog the reservation records and its nightly parking charge for each parking space beyond those the unit type includes, the nightly charges worked out over every night the folio shows the party occupied."
