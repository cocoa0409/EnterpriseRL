category: lodging
display_name: Resort Lodging

binding:
  holding_table: lodging_holdings
  event_tables: [lodging_folio]
  intake_tables: [lodging_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields:
    nights_remaining: lodging_nights
    deposit_held_usd: deposit_balance
    folio_balance_usd: folio_balance

lifecycle:
  states: [held, deposit_pending, confirmed, checked_in, checked_out, cancelled, no_show, closed]
  transitions:
    - {from: held, to: deposit_pending, by: agent, means: "A unit of the type asked for has been put on hold for the dates and the deposit has been asked for."}
    - {from: held, to: cancelled, by: user, means: "The guest lets the hold go before any deposit was asked for."}
    - {from: deposit_pending, to: confirmed, by: system, means: "The deposit has cleared and the reservation is firm."}
    - {from: deposit_pending, to: cancelled, by: user, means: "The guest gives the reservation up before the deposit cleared."}
    - {from: confirmed, to: checked_in, by: agent, means: "The party has arrived, keys have been issued and the stay has begun."}
    - {from: confirmed, to: cancelled, by: user, means: "The guest gives a firm reservation up before arrival."}
    - {from: confirmed, to: no_show, by: system, means: "The party never arrived and the unit was held empty for the first night."}
    - {from: checked_in, to: checked_out, by: agent, means: "The party has left, the unit has been released and the folio has been presented."}
    - {from: checked_out, to: closed, by: system, means: "The folio has been settled, the incidental hold dealt with and the reservation closed."}
    - {from: cancelled, to: closed, by: system, means: "The cancelled reservation has been settled and closed."}
    - {from: no_show, to: closed, by: system, means: "The unclaimed reservation has been settled and closed."}

accounts:
  - key: lodging_nights
    unit: nights
    meaning: "The number of nights this reservation still holds for the party; the whole stay is loaded when the reservation becomes firm and one is drawn for each night occupied."
  - key: deposit_balance
    unit: USD
    meaning: "The deposit standing against this reservation; it rises when a deposit is taken and falls when that deposit is applied to the folio or returned to the guest."
  - key: folio_balance
    unit: USD
    meaning: "The amount of room rate, resort charges, incidentals and fees still to be collected on this reservation's folio; it rises when a charge is posted and falls when a payment clears."

parameter_schema:
  base_nightly_rate_usd: "Nightly rate in USD for this unit type outside the peak and holiday windows."
  peak_nightly_rate_usd: "Nightly rate in USD for this unit type inside the published peak window."
  holiday_nightly_rate_usd: "Nightly rate in USD for this unit type inside the published holiday window."
  holiday_window_start: "First date of the published holiday window, as YYYY-MM-DD."
  holiday_window_end: "Last date of the published holiday window, as YYYY-MM-DD."
  peak_window_start: "First date of the published peak window, as YYYY-MM-DD."
  peak_window_end: "Last date of the published peak window, as YYYY-MM-DD."
  min_nights_standard: "Fewest nights this unit type is let for outside the peak and holiday windows (integer)."
  min_nights_peak: "Fewest nights this unit type is let for inside the peak window (integer)."
  min_nights_holiday: "Fewest nights this unit type is let for inside the holiday window (integer)."
  max_nights: "Most nights one reservation of this unit type may run for (integer)."
  standard_occupancy: "Number of guests the nightly rate covers (integer)."
  max_occupancy: "Most guests this unit type sleeps (integer)."
  extra_person_nightly_usd: "Nightly charge in USD for each guest beyond the standard occupancy."
  bedrooms: "Number of bedrooms in this unit type (integer)."
  bathrooms: "Number of bathrooms in this unit type (number)."
  kitchen_type: "What cooking facilities the unit type has; one of none, kitchenette or full_kitchen."
  deposit_pct: "Percentage of the room rate for the whole stay taken as a deposit when the reservation is made."
  deposit_due_days: "Number of calendar days after the hold is placed within which the deposit must clear (integer)."
  balance_due_days_before_arrival: "Number of calendar days before arrival by which the rest of the room rate falls due (integer)."
  free_cancellation_days: "Number of calendar days before arrival up to which a cancellation carries no fee (integer)."
  late_cancellation_fee_nights: "Number of nights of the room rate retained when a cancellation is recorded after the free cancellation deadline (integer)."
  no_show_fee_nights: "Number of nights of the room rate retained when the party never arrives (integer)."
  deposit_refundable: "Whether the deposit comes back when a cancellation falls inside the free cancellation period (true/false)."
  change_fee_usd: "Fee in USD for changing the dates, the unit type or the party size on a firm reservation."
  change_notice_days: "Number of calendar days before arrival by which a change must be recorded (integer)."
  name_change_allowed: "Whether the reservation may be re-registered to a different lead guest (true/false)."
  name_change_fee_usd: "Fee in USD for re-registering the reservation to a different lead guest."
  resort_fee_nightly_usd: "Nightly resort charge in USD covering the shuttle, the fitness centre and the pools."
  cleaning_fee_usd: "One-off housekeeping charge in USD raised on departure."
  pet_allowed: "Whether dogs are taken in this unit type (true/false)."
  pet_fee_nightly_usd: "Nightly charge in USD for a dog staying in the unit."
  parking_spaces_included: "Number of parking spaces included with the unit (integer)."
  parking_nightly_usd: "Nightly charge in USD for each parking space beyond those included."
  incidental_hold_usd: "Amount in USD held against the lead guest's payment method at check-in for incidentals and damage."
  incidental_release_days: "Number of business days after departure within which the incidental hold is released (integer)."
  check_in_time: "Earliest time keys are issued on the arrival date, on a 24-hour clock."
  check_out_time: "Latest time the unit must be left on the departure date, on a 24-hour clock."
  early_check_in_fee_usd: "Fee in USD for taking keys before the published check-in time where the unit is ready."
  late_check_out_fee_usd: "Fee in USD for staying in the unit beyond the published check-out time."
  housekeeping_frequency: "How often the unit is serviced during a stay; one of daily, every_third_day, on_request or departure_only."
  ski_valet_included: "Whether slopeside ski storage and boot warming is included with this unit type (true/false)."
  ski_valet_nightly_usd: "Nightly charge in USD for ski valet where it is not included."
  shuttle_included: "Whether the mountain shuttle serves this unit type at no charge (true/false)."
  hot_tub_access: "What hot tub the unit type has access to; one of none, shared or private."
  mountains_offered: "List of the collective's mountains this unit type exists at."
  passholder_discount_pct: "Percentage taken off the room rate for a household shown on the collective's records as holding a season pass."
  length_of_stay_discount_pct: "Percentage taken off the room rate when the stay reaches the length-of-stay threshold."
  length_of_stay_threshold_nights: "Number of nights at which the length-of-stay reduction starts to apply (integer)."
  advance_booking_discount_pct: "Percentage taken off the room rate when the reservation is recorded at least the advance period before arrival."
  advance_booking_days_min: "Number of calendar days before arrival at which the advance booking reduction starts to apply (integer)."
  group_block_minimum_units: "Number of units on one household account at which the reservation is handled as a group block instead (integer)."
  damage_liability_cap_usd: "Most the guest is held liable for in damage to the unit beyond the incidental hold."
  smoking_penalty_usd: "Charge in USD raised where the unit is found to have been smoked in."
  credit_validity_days: "Number of calendar days from issue within which lodging credit must be spent (integer)."

