  - id: lodging_cancellation
    subject: [lodging_cancel, lodging_no_show]
    rule: >
      A household may give a reservation up before arrival, and what they bear turns on how much notice they
      gave. A cancellation carries no fee only when it is recorded on or before the unit type's free
      cancellation deadline, which is its free cancellation period counted back in calendar days from the
      arrival date. Calendar days are counted back from the arrival date, the arrival date itself counting
      as day zero, every day of the week counting alike, and a calendar day is never mixed with a full
      24-hour period; the deadline is the day the count lands on, and where that day does not exist in the
      target month the last day of that month is used. Inside the deadline everything already taken comes
      back where the unit type's deposit is refundable, and the deposit alone is retained where it is not.
      After the deadline the unit type's late cancellation nights of room rate are retained, worked out at
      the rate of the first nights of the stay, and the remainder comes back. A party that never arrives is
      treated as unclaimed once the first night has passed, and the unit type's unclaimed nights of room
      rate are retained instead. Where the collective cannot supply the unit type reserved, or the mountain
      does not open at all, nothing is retained and everything comes back whenever the cancellation is
      recorded.
    eligibility:
      - id: free_cancellation_deadline
        applies_to: [lodging_cancel]
        kind: time
        condition: "A cancellation carries no fee only when it is recorded on or before the unit type's free cancellation deadline, which is its free cancellation period counted back in calendar days from the arrival date."
        evidence_fields: [lodging_holdings.lodging_id, lodging_holdings.arrival_date, lodging_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lodging_holdings.lodging_id]
          action_bindings:
            lodging_holdings.lodging_id: lodging_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the arrival date"
          anchor_source: lodging_holdings.arrival_date
          relation: not_after
          duration_source: variants.free_cancellation_days
          unit: calendar_days
          counting_rule: "Calendar days are counted back from the arrival date, the arrival date itself counting as day zero, every day of the week counting alike, and a calendar day is never mixed with a full 24-hour period; the deadline is the day the count lands on, and where that day does not exist in the target month the last day of that month is used."
          boundary: inclusive
    params:
      per_tier:
        Base Village Inn Room: {free_cancellation_days: "=free_cancellation_days", late_cancellation_fee_nights: "=late_cancellation_fee_nights", no_show_fee_nights: "=no_show_fee_nights", deposit_refundable: "=deposit_refundable", base_nightly_rate_usd: "=base_nightly_rate_usd", peak_nightly_rate_usd: "=peak_nightly_rate_usd", holiday_nightly_rate_usd: "=holiday_nightly_rate_usd"}
