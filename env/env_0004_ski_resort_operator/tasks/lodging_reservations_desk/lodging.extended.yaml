  - id: lodging_ext_early_departure_charge
    base_policy_refs: [lodging_modification, lodging_rate_and_fees, lodging_cancellation]
    overwrite:
      - base_policy: lodging_rate_and_fees
        superseded_clause: >-
          A night the party leaves early is still charged where the departure falls inside the cancellation terms
          of the stay.
        replaced_by: >-
          The room rate retained when a party leaves before the departure date on the reservation is worked out on
          the nights of the stay the party gave up, each of them priced at the nightly rate of the published window
          the stay falls in, and the whole of it is retained.
      - base_policy: lodging_cancellation
        superseded_clause: >-
          After the deadline the unit type's late cancellation nights of room rate are retained, worked out at the
          rate of the first nights of the stay, and the remainder comes back.
        replaced_by: >-
          Where a season pass stands active for the season of the stay on the household account and the folio
          carries the room rate posted for the stay, the retained nights are priced at the nightly average of that
          room rate, which is the room rate standing on the folio divided by the number of entries it was posted
          in.
    trigger: state_due
    subject: [lodging_fee_charge]
    computes: retained_amount_usd
    target_tool: post_early_departure_charge_bb461064
    prerequisite: []
    params:
      early_departure_notice_days: 7
      holiday_retention_share: 0.25
      peak_retention_share: 0.10
      allowed_claim_retention_share: 0.00
      open_claim_retention_share: 0.50
    rule: >
      The room rate retained when a party leaves before the departure date on the reservation is worked out on the
      nights of the stay the party gave up, each of them priced at the nightly rate of the published window the
      stay falls in, and the whole of it is retained. The nights given up are counted as the nights the reservation
      covers less the nights the folio shows consumed where a departure is recorded on the reservation, and where
      no departure is recorded on the reservation no night of the stay counts as given up. A party that leaves
      before the departure date on the reservation has not changed the reservation, so no change fee arises from
      the early departure. The amounts are carried
      at full precision and the entry posted to the folio is rounded to the nearest cent once, at the end.
      An amount that falls exactly halfway between two cents is rounded to the cent whose last digit is even, which is
      the convention the collective's finance office settles every folio on.
      Where a departure is recorded on the reservation and the folio shows fewer nights consumed than the nights
      from the arrival date to that departure, the nights given up are counted as the nights the reservation covers
      less the nights from the arrival date to the recorded departure, because the departure is the firm record of
      when the unit came back. Where a departure is recorded on the reservation and the folio shows a night
      consumed for every night from the arrival date to that departure, the nights given up are counted as the
      nights the reservation covers less the nights the folio shows consumed.
      How many of the nights given up are retained turns on the notice the household gave. Where a request to
      change the dates of the stay stands accepted at the desk and was raised more than the early departure notice
      period in calendar days before the departure date on the reservation, no night is retained. Where a request to change the dates of the stay
      stands accepted at the desk and was raised within that period of the departure date, the nights retained are
      the nights given up less the unit type's late cancellation nights, and never fewer than none, the notice
      earning the household that allowance. Where no request to change the dates of the stay stands accepted at the desk, every
      night given up is retained.
      The nightly rate the retained nights are priced at follows what the household was actually paying. Where a
      season pass stands active for the season of the stay on the household account and the folio carries the room
      rate posted for the stay, the retained nights are priced at the nightly average of that room rate, which is
      the room rate standing on the folio divided by the number of entries it was posted in. Where a season pass
      stands active for that season and the folio carries no room rate posted for the stay, they are priced at the
      published nightly rate of the window the stay falls in, less the unit type's passholder reduction. Where no
      season pass stands active for that season, they are priced at the published nightly rate of the window the
      stay falls in. A nightly rate worked out under any of those three readings is a working figure and not an
      amount posted to a folio: it is carried at full precision, is never rounded on its own, and reaches the cent
      only through the amount the entry is posted at.
      A retention supplement is added on the room rate retained, because a night given back in the busiest weeks is
      the hardest to let again. Where every night the reservation covers falls inside the unit type's published
      holiday window, the holiday retention share of the room rate retained is added to it. Where every night the
      reservation covers falls inside its published peak window, the peak retention share of that amount is added
      to it. In every other case nothing is added.
      The occupancy charge follows the retained nights in the same way. Where the folio carries an occupancy charge
      posted for the stay and the nights retained number the unit type's late cancellation nights or fewer, the
      unit type's extra person charge is retained for each guest beyond its standard occupancy for each night
      retained. Where the folio carries an occupancy charge posted for the stay and the nights retained number more
      than the unit type's late cancellation nights, that charge is retained for each such guest for the unit
      type's late cancellation nights only. Where the folio carries no occupancy charge posted for the stay,
      nothing is retained for occupancy.
      What is charged in the end turns on the protection written over the stay, because a household whose claim the
      collective has allowed does not also bear the nights. Where a protection plan standing active over the
      reservation carries a claim decision standing allowed, the allowed claim share of the room rate and occupancy
      retained is charged. Where a protection plan standing active over the reservation carries a claim decision
      standing under assessment, the open claim share of that amount is charged and the rest stands against the
      plan. Where no protection plan standing active over the reservation carries either decision, the whole of
      that amount is charged.
    baseline:
      rule: >-
        The room rate retained when a party leaves before the departure date on the reservation is worked out on
        the nights of the stay the party gave up, each of them priced at the nightly rate of the published window
        the stay falls in, and the whole of it is retained. The nights given up are counted as the nights the
        reservation covers less the nights the folio shows consumed where a departure is recorded on the
        reservation, and where no departure is recorded on the reservation no night of the stay counts as given up.
        The amounts are carried at full precision and the entry posted to the folio is rounded to the nearest cent
        once, at the end.
        An amount that falls exactly halfway between two cents is rounded to the cent whose last digit is even, which
        is the convention the collective's finance office settles every folio on.
      params: [holiday_nightly_rate_usd, peak_nightly_rate_usd, base_nightly_rate_usd, late_cancellation_fee_nights]
    cross_category:
      - category: passes
        as: branch
        reads: [status, season_code]
        note: "The nightly rate the retained nights are priced at is decided from the season passes standing on the household account."
      - category: insure
        as: branch
        reads: [status, covered_holding_id, claim_decision]
        note: "The share of the retained amount that is charged is decided from the protection plan written over this reservation."
    compute:
      - nights_covered_a: "DAYS(F('arrival_date'), F('departure_date'))"
      - folio_nights_consumed_a: "COUNT('lodging_folio', event_type='lodging_night_consume')"
      - departure_recorded_a: "F('checked_out_at') != ''"
      - nights_to_departure_a: "DAYS(F('arrival_date'), F('checked_out_at'))"
      - nights_given_up: "MX(0, nights_covered_a - nights_to_departure_a) if (departure_recorded_a and folio_nights_consumed_a < nights_to_departure_a) else (MX(0, nights_covered_a - folio_nights_consumed_a) if departure_recorded_a else 0)"
      - notice_requests: "COUNT('lodging_requests', request_type='date_change', outcome='accepted_pending_confirmation')"
      - notice_date: "LATEST('lodging_requests', 'created_at', date_field='created_at', request_type='date_change', outcome='accepted_pending_confirmation')"
      - notice_lead_days: "DAYS(notice_date, F('departure_date')) if notice_requests > 0 else 0"
      - retained_nights: "0 if (notice_requests > 0 and notice_lead_days > K('early_departure_notice_days')) else (MX(0, nights_given_up - P('late_cancellation_fee_nights')) if (notice_requests > 0 and notice_lead_days <= K('early_departure_notice_days')) else nights_given_up)"
      - posted_room_rate_a: "SUM('lodging_folio', 'amount_usd', event_type='lodging_room_charge', charge_category='room_rate')"
      - posted_room_nights_a: "COUNT('lodging_folio', event_type='lodging_room_charge', charge_category='room_rate')"
      - pass_active_a: "EXISTS('passes', status='active', season_code=F('season_code'))"
      - window_nightly_rate: "P('holiday_nightly_rate_usd') if (DAYS(P('holiday_window_start'), F('arrival_date')) >= 0 and DAYS(F('arrival_date'), P('holiday_window_end')) >= 0) else (P('peak_nightly_rate_usd') if (DAYS(P('peak_window_start'), F('arrival_date')) >= 0 and DAYS(F('arrival_date'), P('peak_window_end')) >= 0) else P('base_nightly_rate_usd'))"
      - retained_nightly: "posted_room_rate_a / MX(1, posted_room_nights_a) if (pass_active_a and posted_room_nights_a > 0) else (window_nightly_rate * (1 - P('passholder_discount_pct') / 100) if (pass_active_a and posted_room_nights_a <= 0) else window_nightly_rate)"
      - retained_room_rate: "retained_nightly * retained_nights"
      - nights_in_holiday_a: "MX(0, MN(nights_covered_a, DAYS(F('arrival_date'), P('holiday_window_end')) + 1) - MX(0, DAYS(F('arrival_date'), P('holiday_window_start'))))"
      - nights_in_peak_a: "MX(0, MN(nights_covered_a, DAYS(F('arrival_date'), P('peak_window_end')) + 1) - MX(0, DAYS(F('arrival_date'), P('peak_window_start'))))"
      - window_supplement_share: "K('holiday_retention_share') if nights_in_holiday_a >= nights_covered_a else (K('peak_retention_share') if nights_in_peak_a >= nights_covered_a else 0)"
      - retained_with_window: "retained_room_rate * (1 + window_supplement_share)"
      - occupancy_charge_posted: "SUM('lodging_folio', 'amount_usd', event_type='lodging_room_charge', charge_category='extra_person')"
      - guests_beyond_standard_a: "MX(0, F('adults') + F('children') - P('standard_occupancy'))"
      - occupancy_retained: "P('extra_person_nightly_usd') * guests_beyond_standard_a * retained_nights if (occupancy_charge_posted > 0 and retained_nights <= P('late_cancellation_fee_nights')) else (P('extra_person_nightly_usd') * guests_beyond_standard_a * P('late_cancellation_fee_nights') if (occupancy_charge_posted > 0 and retained_nights > P('late_cancellation_fee_nights')) else 0)"
      - plan_active_a: "EXISTS('insure', status='active', covered_holding_id=HID)"
      - claim_decision_read: "CFIELD('insure', 'claim_decision', status='active', covered_holding_id=HID)"
      - retention_share: "K('allowed_claim_retention_share') if (plan_active_a and claim_decision_read == 'allowed') else (K('open_claim_retention_share') if (plan_active_a and claim_decision_read == 'under_assessment') else 1)"
      - result: "RND((retained_with_window + occupancy_retained) * retention_share, 2)"
    compute_basis:
      nights_covered_a: "The nights given up are counted as the nights the reservation covers less the nights the folio shows consumed where a departure is recorded on the reservation, and where no departure is recorded on the reservation no night of the stay counts as given up."
      folio_nights_consumed_a: "The nights given up are counted as the nights the reservation covers less the nights the folio shows consumed where a departure is recorded on the reservation, and where no departure is recorded on the reservation no night of the stay counts as given up."
      departure_recorded_a: "The nights given up are counted as the nights the reservation covers less the nights the folio shows consumed where a departure is recorded on the reservation, and where no departure is recorded on the reservation no night of the stay counts as given up."
      nights_to_departure_a: "Where a departure is recorded on the reservation and the folio shows fewer nights consumed than the nights from the arrival date to that departure, the nights given up are counted as the nights the reservation covers less the nights from the arrival date to the recorded departure, because the departure is the firm record of when the unit came back."
      nights_given_up: "Where a departure is recorded on the reservation and the folio shows fewer nights consumed than the nights from the arrival date to that departure, the nights given up are counted as the nights the reservation covers less the nights from the arrival date to the recorded departure, because the departure is the firm record of when the unit came back. Where a departure is recorded on the reservation and the folio shows a night consumed for every night from the arrival date to that departure, the nights given up are counted as the nights the reservation covers less the nights the folio shows consumed."
      notice_requests: "Where no request to change the dates of the stay stands accepted at the desk, every night given up is retained."
