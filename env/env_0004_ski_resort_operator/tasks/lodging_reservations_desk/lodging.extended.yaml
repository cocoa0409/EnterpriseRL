extended_policies:
  - id: lodging_ext_stay_rate_posting
    base_policy_refs: [lodging_agg_household_stay_pricing, lodging_rate_and_fees]
    overwrite:
      - base_policy: lodging_rate_and_fees
        superseded_clause: >-
          The room rate is posted night by night rather than as one figure for the stay, because a stay that
          straddles two rate windows is priced on the window each night falls in.
        replaced_by: >-
          The room rate for a stay is worked out night by night and posted to the folio as a single entry covering
          every night of the stay.
      - base_policy: lodging_rate_and_fees
        superseded_clause: >-
          A night falling inside the published holiday window takes the holiday rate, a night inside the peak window
          takes the peak rate, and every other night takes the base rate; the window is judged on the night occupied
          and never on the arrival date.
        replaced_by: >-
          Where a stay straddles two published rate windows, the mix of its nights decides how it is priced.
      - base_policy: lodging_agg_household_stay_pricing
        superseded_clause: >-
          The season passholder reduction is taken first, on the evidence of a pass held by the household standing in
          the active state on the arrival date.
        replaced_by: >-
          The passholder reduction is taken first, on the reduction the unit type publishes for a household shown on
          the collective's records as holding a season pass.
      - base_policy: lodging_agg_household_stay_pricing
        superseded_clause: >-
          The advance booking reduction is taken next where the reservation was recorded at least the unit type's
          advance period before arrival.
        replaced_by: >-
          The advance booking reduction is taken next, on the amount left after the passholder reduction.
      - base_policy: lodging_agg_household_stay_pricing
        superseded_clause: >-
          The length-of-stay reduction is taken last where the stay reaches the unit type's threshold in nights.
        replaced_by: >-
          The length-of-stay reduction is taken third, on the amount left after the advance booking reduction.
      - base_policy: lodging_rate_and_fees
        superseded_clause: >-
          Guests beyond the unit type's standard occupancy add the extra person charge to each night they stay.
        replaced_by: >-
          Where the party is larger than the unit type's standard occupancy and carries children as well as adults,
          each guest beyond the standard occupancy is charged at the family share of the unit type's extra person
          nightly charge for every night of the stay.
    trigger: state_due
    subject: [lodging_room_charge]
    computes: room_charge_amount_usd
    target_tool: post_stay_room_charge_ee3504ba
    prerequisite: []
    params:
      household_pass_share: 0.50
      early_booking_reduction_pct: 20.00
      long_stay_reduction_pct: 15.00
      package_reduction_pct: 5.00
      half_package_reduction_pct: 2.50
      family_extra_person_pct: 60.00
      full_house_extra_person_pct: 125.00
    rule: >
      The room rate for a stay is worked out night by night and posted to the folio as a single entry covering
      every night of the stay. A night falling inside the published holiday window of the unit type is priced at
      its holiday nightly rate, a night falling inside its published peak window at its peak nightly rate, and
      every other night at its base nightly rate, and those nightly amounts are added together to give the room
      rate for the stay before any reduction. Each guest beyond the unit type's standard occupancy is charged at
      the unit type's extra person nightly charge for every night of the stay, and that occupancy charge is added
      only after every reduction has been taken, because reductions are given on the room rate and never on the
      occupancy charge. The amounts are carried at full precision through every step and the entry posted to the
      folio is rounded to the nearest cent once, at the end.
      An amount that falls exactly halfway between two cents is rounded to the cent whose last digit is even, which is
      the convention the collective's finance office settles every folio on.
      Where a stay straddles two published rate windows, the mix of its nights decides how it is priced. Where more
      than half of the nights of the stay fall inside the higher priced of the two windows it straddles, every night
      of the stay is priced at that window's nightly rate. Where half or fewer of the nights of the stay fall inside
      the higher priced of the two windows it straddles, every night of the stay is priced at the lower window's
      nightly rate. Where every night of the stay falls inside one published rate window, each night is priced on
      the window it falls in.
      The passholder reduction is taken first, on the reduction the unit type publishes for a household shown on
      the collective's records as holding a season pass. Where a season pass standing active for the season of the
      stay is registered to the guest named as the lead guest on the reservation, the whole of the unit type's
      passholder reduction is taken. Where a season pass standing active for the season of the stay stands on the
      household account but is registered to someone other than the lead guest, the household share of that
      reduction is taken. Where no season pass stands active for the season of the stay on the household account,
      no passholder reduction is taken.
      The advance booking reduction is taken next, on the amount left after the passholder reduction. Where the
      reservation was recorded at least twice the unit type's advance period in calendar days before the arrival
      date, the early booking reduction is taken. Where the reservation was recorded at least the unit type's
      advance period but less than twice that period in calendar days before the arrival date, the unit type's
      advance booking reduction is taken. Where the reservation was recorded less than the unit type's advance
      period in calendar days before the arrival date, no advance booking reduction is taken.
      The length-of-stay reduction is taken third, on the amount left after the advance booking reduction. Where
      the stay runs to at least twice the unit type's length-of-stay threshold in nights, the long stay reduction
      is taken. Where the stay runs to at least the unit type's length-of-stay threshold but fewer than twice that
      threshold in nights, the unit type's length-of-stay reduction is taken. Where the stay runs to fewer nights
      than that threshold, no length-of-stay reduction is taken.
      The package reduction is taken last, on the amount left after the length-of-stay reduction. Where the
      household holds both a school booking standing confirmed and a rental agreement standing confirmed for the
      season of the stay, the package reduction is taken. Where the household holds either a school booking
      standing confirmed or a rental agreement standing confirmed for that season but not both, the half package
      reduction is taken. Where the household holds neither for that season, no package reduction is taken.
      Where the party is larger than the unit type's standard occupancy and carries children as well as adults,
      each guest beyond the standard occupancy is charged at the family share of the unit type's extra person
      nightly charge for every night of the stay. Where the party is larger than the unit type's standard
      occupancy, carries adults only and fills the unit type's maximum occupancy, each guest beyond the standard
      occupancy is charged at the full house share of that nightly charge for every night of the stay. In every
      other case each guest beyond the unit type's standard occupancy is charged at the unit type's extra person
      nightly charge for every night of the stay.
    baseline:
      rule: >-
        The room rate for a stay is worked out night by night and posted to the folio as a single entry covering
        every night of the stay. A night falling inside the published holiday window of the unit type is priced at
        its holiday nightly rate, a night falling inside its published peak window at its peak nightly rate, and
        every other night at its base nightly rate, and those nightly amounts are added together to give the room
        rate for the stay before any reduction. Each guest beyond the unit type's standard occupancy is charged at
        the unit type's extra person nightly charge for every night of the stay, and that occupancy charge is added
        only after every reduction has been taken, because reductions are given on the room rate and never on the
        occupancy charge. The amounts are carried at full precision through every step and the entry posted to the
        folio is rounded to the nearest cent once, at the end.
        An amount that falls exactly halfway between two cents is rounded to the cent whose last digit is even, which
        is the convention the collective's finance office settles every folio on.
      params: [holiday_nightly_rate_usd, peak_nightly_rate_usd, base_nightly_rate_usd, holiday_window_start,
               holiday_window_end, peak_window_start, peak_window_end, extra_person_nightly_usd, standard_occupancy]
    cross_category:
      - category: passes
        as: branch
        reads: [status, passholder_name, season_code]
        note: "The passholder reduction tier is decided from the season pass records standing on the household account."
      - category: lessons
        as: existence
        reads: [status, season_code]
        note: "The package reduction tier is decided from the school bookings standing on the household account."
      - category: rentals
        as: existence
        reads: [status, season_code]
        note: "The package reduction tier is decided from the rental agreements standing on the household account."
    compute:
      - nights: "DAYS(F('arrival_date'), F('departure_date'))"
      - holiday_nights: "MX(0, MN(nights, DAYS(F('arrival_date'), P('holiday_window_end')) + 1) - MX(0, DAYS(F('arrival_date'), P('holiday_window_start'))))"
      - peak_nights: "MX(0, MN(nights, DAYS(F('arrival_date'), P('peak_window_end')) + 1) - MX(0, DAYS(F('arrival_date'), P('peak_window_start'))))"
      - base_nights: "MX(0, nights - holiday_nights - peak_nights)"
      - nightly_total_standard: "holiday_nights * P('holiday_nightly_rate_usd') + peak_nights * P('peak_nightly_rate_usd') + base_nights * P('base_nightly_rate_usd')"
      - high_window_nights: "holiday_nights if holiday_nights > 0 else peak_nights"
      - high_window_rate: "P('holiday_nightly_rate_usd') if holiday_nights > 0 else P('peak_nightly_rate_usd')"
      - low_window_rate: "P('peak_nightly_rate_usd') if (holiday_nights > 0 and peak_nights > 0) else P('base_nightly_rate_usd')"
      - straddles: "high_window_nights > 0 and high_window_nights < nights"
      - room_rate_before_reductions: "nights * high_window_rate if (straddles and high_window_nights * 2 > nights) else (nights * low_window_rate if (straddles and high_window_nights * 2 <= nights) else nightly_total_standard)"
      - active_pass_holder: "CFIELD('passes', 'passholder_name', status='active', season_code=F('season_code'))"
      - pass_on_account: "EXISTS('passes', status='active', season_code=F('season_code'))"
      - pass_is_lead_guest: "active_pass_holder == F('lead_guest_name')"
      - pass_reduction_pct: "P('passholder_discount_pct') if (pass_on_account and pass_is_lead_guest) else (P('passholder_discount_pct') * K('household_pass_share') if (pass_on_account and not pass_is_lead_guest) else 0)"
      - after_pass: "room_rate_before_reductions * (1 - pass_reduction_pct / 100)"
      - lead_days: "DAYS(F('booked_date'), F('arrival_date'))"
      - advance_reduction_pct: "K('early_booking_reduction_pct') if lead_days >= 2 * P('advance_booking_days_min') else (P('advance_booking_discount_pct') if lead_days >= P('advance_booking_days_min') else 0)"
      - after_advance: "after_pass * (1 - advance_reduction_pct / 100)"
      - stay_reduction_pct: "K('long_stay_reduction_pct') if nights >= 2 * P('length_of_stay_threshold_nights') else (P('length_of_stay_discount_pct') if nights >= P('length_of_stay_threshold_nights') else 0)"
      - after_stay: "after_advance * (1 - stay_reduction_pct / 100)"
      - school_booking: "EXISTS('lessons', status='confirmed', season_code=F('season_code'))"
      - rental_agreement: "EXISTS('rentals', status='confirmed', season_code=F('season_code'))"
      - package_reduction_pct: "K('package_reduction_pct') if (school_booking and rental_agreement) else (K('half_package_reduction_pct') if (school_booking or rental_agreement) else 0)"
      - after_package: "after_stay * (1 - package_reduction_pct / 100)"
      - occupancy_nights: "DAYS(F('arrival_date'), F('departure_date'))"
      - extra_guests: "MX(0, F('adults') + F('children') - P('standard_occupancy'))"
      - party_has_children: "F('children') > 0"
      - party_fills_unit: "F('adults') + F('children') >= P('max_occupancy')"
      - extra_person_nightly: "P('extra_person_nightly_usd') * K('family_extra_person_pct') / 100 if (extra_guests > 0 and party_has_children) else (P('extra_person_nightly_usd') * K('full_house_extra_person_pct') / 100 if (extra_guests > 0 and party_fills_unit) else P('extra_person_nightly_usd'))"
      - occupancy_charge: "extra_person_nightly * extra_guests * occupancy_nights"
      - result: "RND(after_package + occupancy_charge, 2)"
    compute_basis:
      nights: "A night falling inside the published holiday window of the unit type is priced at its holiday nightly rate, a night falling inside its published peak window at its peak nightly rate, and every other night at its base nightly rate, and those nightly amounts are added together to give the room rate for the stay before any reduction."
      holiday_nights: "A night falling inside the published holiday window of the unit type is priced at its holiday nightly rate, a night falling inside its published peak window at its peak nightly rate, and every other night at its base nightly rate, and those nightly amounts are added together to give the room rate for the stay before any reduction."
      peak_nights: "A night falling inside the published holiday window of the unit type is priced at its holiday nightly rate, a night falling inside its published peak window at its peak nightly rate, and every other night at its base nightly rate, and those nightly amounts are added together to give the room rate for the stay before any reduction."
      base_nights: "A night falling inside the published holiday window of the unit type is priced at its holiday nightly rate, a night falling inside its published peak window at its peak nightly rate, and every other night at its base nightly rate, and those nightly amounts are added together to give the room rate for the stay before any reduction."
      nightly_total_standard: "Where every night of the stay falls inside one published rate window, each night is priced on the window it falls in."
      high_window_nights: "Where a stay straddles two published rate windows, the mix of its nights decides how it is priced."
      high_window_rate: "Where more than half of the nights of the stay fall inside the higher priced of the two windows it straddles, every night of the stay is priced at that window's nightly rate."
      low_window_rate: "Where half or fewer of the nights of the stay fall inside the higher priced of the two windows it straddles, every night of the stay is priced at the lower window's nightly rate."
      straddles: "Where a stay straddles two published rate windows, the mix of its nights decides how it is priced."
      room_rate_before_reductions: "Where more than half of the nights of the stay fall inside the higher priced of the two windows it straddles, every night of the stay is priced at that window's nightly rate. Where half or fewer of the nights of the stay fall inside the higher priced of the two windows it straddles, every night of the stay is priced at the lower window's nightly rate. Where every night of the stay falls inside one published rate window, each night is priced on the window it falls in."
      active_pass_holder: "Where a season pass standing active for the season of the stay is registered to the guest named as the lead guest on the reservation, the whole of the unit type's passholder reduction is taken."
      pass_on_account: "Where no season pass stands active for the season of the stay on the household account, no passholder reduction is taken."
      pass_is_lead_guest: "Where a season pass standing active for the season of the stay stands on the household account but is registered to someone other than the lead guest, the household share of that reduction is taken."
      pass_reduction_pct: "Where a season pass standing active for the season of the stay is registered to the guest named as the lead guest on the reservation, the whole of the unit type's passholder reduction is taken. Where a season pass standing active for the season of the stay stands on the household account but is registered to someone other than the lead guest, the household share of that reduction is taken. Where no season pass stands active for the season of the stay on the household account, no passholder reduction is taken."
      after_pass: "The advance booking reduction is taken next, on the amount left after the passholder reduction."
      lead_days: "Where the reservation was recorded at least twice the unit type's advance period in calendar days before the arrival date, the early booking reduction is taken."
      advance_reduction_pct: "Where the reservation was recorded at least twice the unit type's advance period in calendar days before the arrival date, the early booking reduction is taken. Where the reservation was recorded at least the unit type's advance period but less than twice that period in calendar days before the arrival date, the unit type's advance booking reduction is taken. Where the reservation was recorded less than the unit type's advance period in calendar days before the arrival date, no advance booking reduction is taken."
      after_advance: "The length-of-stay reduction is taken third, on the amount left after the advance booking reduction."
      stay_reduction_pct: "Where the stay runs to at least twice the unit type's length-of-stay threshold in nights, the long stay reduction is taken. Where the stay runs to at least the unit type's length-of-stay threshold but fewer than twice that threshold in nights, the unit type's length-of-stay reduction is taken. Where the stay runs to fewer nights than that threshold, no length-of-stay reduction is taken."
      after_stay: "The package reduction is taken last, on the amount left after the length-of-stay reduction."
      school_booking: "Where the household holds either a school booking standing confirmed or a rental agreement standing confirmed for that season but not both, the half package reduction is taken."
      rental_agreement: "Where the household holds either a school booking standing confirmed or a rental agreement standing confirmed for that season but not both, the half package reduction is taken."
      package_reduction_pct: "Where the household holds both a school booking standing confirmed and a rental agreement standing confirmed for the season of the stay, the package reduction is taken. Where the household holds either a school booking standing confirmed or a rental agreement standing confirmed for that season but not both, the half package reduction is taken. Where the household holds neither for that season, no package reduction is taken."
      after_package: "Each guest beyond the unit type's standard occupancy is charged at the unit type's extra person nightly charge for every night of the stay, and that occupancy charge is added only after every reduction has been taken, because reductions are given on the room rate and never on the occupancy charge."
      occupancy_nights: "Each guest beyond the unit type's standard occupancy is charged at the unit type's extra person nightly charge for every night of the stay, and that occupancy charge is added only after every reduction has been taken, because reductions are given on the room rate and never on the occupancy charge."
      extra_guests: "Each guest beyond the unit type's standard occupancy is charged at the unit type's extra person nightly charge for every night of the stay, and that occupancy charge is added only after every reduction has been taken, because reductions are given on the room rate and never on the occupancy charge."
      party_has_children: "Where the party is larger than the unit type's standard occupancy and carries children as well as adults, each guest beyond the standard occupancy is charged at the family share of the unit type's extra person nightly charge for every night of the stay."
      party_fills_unit: "Where the party is larger than the unit type's standard occupancy, carries adults only and fills the unit type's maximum occupancy, each guest beyond the standard occupancy is charged at the full house share of that nightly charge for every night of the stay."
      extra_person_nightly: "Where the party is larger than the unit type's standard occupancy and carries children as well as adults, each guest beyond the standard occupancy is charged at the family share of the unit type's extra person nightly charge for every night of the stay. Where the party is larger than the unit type's standard occupancy, carries adults only and fills the unit type's maximum occupancy, each guest beyond the standard occupancy is charged at the full house share of that nightly charge for every night of the stay. In every other case each guest beyond the unit type's standard occupancy is charged at the unit type's extra person nightly charge for every night of the stay."
      occupancy_charge: "Each guest beyond the unit type's standard occupancy is charged at the unit type's extra person nightly charge for every night of the stay, and that occupancy charge is added only after every reduction has been taken, because reductions are given on the room rate and never on the occupancy charge."
      result: "The amounts are carried at full precision through every step and the entry posted to the folio is rounded to the nearest cent once, at the end. An amount that falls exactly halfway between two cents is rounded to the cent whose last digit is even, which is the convention the collective's finance office settles every folio on."
    factors:
      - id: passholder_reduction
        effect: parameter
        decides: pass_reduction_pct
        bindings: [active_pass_holder, pass_on_account, pass_is_lead_guest, pass_reduction_pct]
        ladder:
          - when: "a season pass standing active for the season of the stay is registered to the guest named as the lead guest on the reservation"
            value: "P('passholder_discount_pct')"
          - when: "a season pass standing active for the season of the stay stands on the household account but is registered to someone other than the lead guest"
            value: "P('passholder_discount_pct') * K('household_pass_share')"
          - when: "otherwise"
            value: "0"
        baseline:
          pass_reduction_pct: "0"
        evidence: [cross_category]
        cross_difficulty: passes
      - id: advance_booking_reduction
        effect: parameter
        decides: advance_reduction_pct
        bindings: [lead_days, advance_reduction_pct]
        ladder:
          - when: "the reservation was recorded at least twice the unit type's advance period in calendar days before the arrival date"
            value: "K('early_booking_reduction_pct')"
          - when: "the reservation was recorded at least the unit type's advance period but less than twice that period in calendar days before the arrival date"
            value: "P('advance_booking_discount_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          advance_reduction_pct: "0"
        evidence: [date]
        cross_difficulty: null
      - id: length_of_stay_reduction
        effect: parameter
        decides: stay_reduction_pct
        bindings: [nights, stay_reduction_pct]
        ladder:
          - when: "the stay runs to at least twice the unit type's length-of-stay threshold in nights"
            value: "K('long_stay_reduction_pct')"
          - when: "the stay runs to at least the unit type's length-of-stay threshold but fewer than twice that threshold in nights"
            value: "P('length_of_stay_discount_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          stay_reduction_pct: "0"
        evidence: [date]
        cross_difficulty: null
      - id: package_reduction
        effect: parameter
        decides: package_reduction_pct
        bindings: [school_booking, rental_agreement, package_reduction_pct]
        ladder:
          - when: "the household holds both a school booking standing confirmed and a rental agreement standing confirmed for the season of the stay"
            value: "K('package_reduction_pct')"
          - when: "the household holds either a school booking standing confirmed or a rental agreement standing confirmed for that season but not both"
            value: "K('half_package_reduction_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          package_reduction_pct: "0"
        evidence: [cross_category]
        cross_difficulty: lessons
      - id: straddling_window_pricing
        effect: method
        decides: room_rate_before_reductions
        bindings: [holiday_nights, peak_nights, base_nights, nightly_total_standard, high_window_nights, high_window_rate, low_window_rate, straddles, room_rate_before_reductions]
        ladder:
          - when: "more than half of the nights of the stay fall inside the higher priced of the two windows it straddles"
            method: "every night of the stay is priced at the higher window's nightly rate and those nightly amounts are added together"
          - when: "half or fewer of the nights of the stay fall inside the higher priced of the two windows it straddles"
            method: "every night of the stay is priced at the lower window's nightly rate and those nightly amounts are added together"
          - when: "otherwise"
            method: "each night is priced on the published rate window it falls in and those nightly amounts are added together"
        baseline:
          room_rate_before_reductions: "nightly_total_standard"
        evidence: [date]
        cross_difficulty: null
      - id: occupancy_charge_rate
        effect: parameter
        decides: extra_person_nightly
        bindings: [occupancy_nights, extra_guests, party_has_children, party_fills_unit, extra_person_nightly]
        ladder:
          - when: "the party is larger than the unit type's standard occupancy and carries children as well as adults"
            value: "P('extra_person_nightly_usd') * K('family_extra_person_pct') / 100"
          - when: "the party is larger than the unit type's standard occupancy, carries adults only and fills the unit type's maximum occupancy"
            value: "P('extra_person_nightly_usd') * K('full_house_extra_person_pct') / 100"
          - when: "otherwise"
            value: "P('extra_person_nightly_usd')"
        baseline:
          extra_person_nightly: "P('extra_person_nightly_usd')"
        evidence: [date, tier_param]
        cross_difficulty: null
    inputs:
      history: []
      cross_category: [passes, lessons, rentals]

  - id: lodging_ext_reservation_deposit
    base_policy_refs: [lodging_deposit_terms, lodging_rate_and_fees, lodging_stay_operations]
    overwrite:
      - base_policy: lodging_deposit_terms
        superseded_clause: >-
          The deposit is the unit type's share of the room rate for the whole stay, worked out on the rate after
          every reduction and rounded to the cent.
        replaced_by: >-
          The deposit asked for on a reservation is worked out on the nightly average of the room rate standing on
          the folio for the stay, that is the room rate standing on the folio divided by the number of nights it
          covers, multiplied by the fewest nights the unit type is let for outside its published peak and holiday
          windows.
      - base_policy: lodging_stay_operations
        superseded_clause: >-
          The incidental hold is taken at check-in against the lead guest's own payment method and is not taken
          against a third party's card.
        replaced_by: >-
          The unit type's deposit share of that amount is taken, and the whole of the unit type's incidental hold is
          collected with it in advance against incidentals.
    trigger: state_due
    subject: [lodging_deposit_charge]
    computes: deposit_amount_usd
    target_tool: authorise_reservation_deposit_3e63cb2f
    prerequisite:
      - problem: lodging_ext_stay_rate_posting
        kind: value_input
        gate: posted_room_rate
        form: state
        policy_source: >-
          The deposit asked for is fixed only after the folio carries the room rate posted for every night of the
          stay.
        condition: >-
          The folio of the reservation carries a room rate entry covering every night of the stay.
        resolved_by: post_stay_room_charge_ee3504ba
        effect: >-
          Once that entry stands on the folio, the room rate standing on the folio, which the deposit share is
          worked out on, takes the amount of the entry instead of nothing.
    params:
      protected_deposit_pct: 20.00
      part_protected_deposit_pct: 27.50
      known_household_hold_share: 0.50
    rule: >
      The deposit asked for on a reservation is worked out on the nightly average of the room rate standing on the
      folio for the stay, that is the room rate standing on the folio divided by the number of nights it covers,
      multiplied by the fewest nights the unit type is let for outside its published peak and holiday windows. The
      unit type's deposit share of that amount is taken, and the whole of the unit type's incidental hold is
      collected with it in advance against incidentals. The amounts are carried at full precision through every
      step and the deposit asked for is rounded to the nearest cent once, at the end.
      An amount that falls exactly halfway between two cents is rounded to the cent whose last digit is even, which is
      the convention the collective's finance office settles every folio on.
      The deposit asked for is fixed only after the folio carries the room rate posted for every night of the stay.
      Where the arrival date falls inside the unit type's published holiday window, the deposit share is worked out
      on the room rate standing on the folio for the whole stay together with the unit type's nightly resort charge
      for every night that room rate covers. Where the arrival date falls inside the unit type's published peak
      window, the deposit share is worked out on the room rate standing on the folio for the whole stay. Where the
      arrival date falls outside both of those published windows, the deposit share is worked out on the nightly
      average of the room rate standing on the folio multiplied by the fewest nights the unit type is let for
      outside those windows.
      Where a protection plan standing active is written over the reservation and the benefit remaining on it
      reaches the room rate standing on the folio, the protected deposit share is taken. Where a protection plan
      standing active is written over the reservation and the benefit remaining on it falls short of the room rate
      standing on the folio, the part protected deposit share is taken. Where no protection plan stands active over
      the reservation, the unit type's deposit share is taken.
      Where the household holds both a dining plan standing active and a rental agreement standing confirmed for
      the season of the stay, nothing is collected in advance against incidentals. Where the household holds either
      a dining plan standing active or a rental agreement standing confirmed for that season but not both, the
      known household share of the unit type's incidental hold is collected in advance against incidentals. Where
      the household holds neither for that season, the whole of the unit type's incidental hold is collected in
      advance against incidentals.
      Where the folio carries payments already collected against the stay totalling the deposit share worked out or
      more, the whole of that share is taken off, and the incidental hold collected in advance is still asked for.
      Where the folio carries one or more payments
      already collected against the stay totalling less than the share worked out, the whole of those payments is
      taken off. Where the folio carries no payment already collected against the stay, nothing is taken off.
    baseline:
      rule: >-
        The deposit asked for on a reservation is worked out on the nightly average of the room rate standing on the
        folio for the stay, that is the room rate standing on the folio divided by the number of nights it covers,
        multiplied by the fewest nights the unit type is let for outside its published peak and holiday windows. The
        unit type's deposit share of that amount is taken, and the whole of the unit type's incidental hold is
        collected with it in advance against incidentals. The amounts are carried at full precision through every
        step and the deposit asked for is rounded to the nearest cent once, at the end.
        An amount that falls exactly halfway between two cents is rounded to the cent whose last digit is even, which
        is the convention the collective's finance office settles every folio on.
      params: [deposit_pct, min_nights_standard, incidental_hold_usd]
    cross_category:
      - category: insure
        as: branch
        reads: [status, covered_holding_id, benefit_remaining_usd]
        note: "The deposit share tier is decided from the protection plan written over this reservation."
      - category: dining
        as: existence
        reads: [status, season_code]
        note: "The incidental prepay tier is decided from the dining plans standing on the household account."
      - category: rentals
        as: existence
        reads: [status, season_code]
        note: "The incidental prepay tier is decided from the rental agreements standing on the household account."
    compute:
      - posted_room_rate: "SUM('lodging_folio', 'amount_usd', event_type='lodging_room_charge', charge_category='room_rate')"
      - posted_nights: "SUM('lodging_folio', 'quantity', event_type='lodging_room_charge', charge_category='room_rate')"
      - nightly_average: "posted_room_rate / MX(1, posted_nights)"
      - arrival_in_holiday: "DAYS(P('holiday_window_start'), F('arrival_date')) >= 0 and DAYS(F('arrival_date'), P('holiday_window_end')) >= 0"
      - arrival_in_peak: "DAYS(P('peak_window_start'), F('arrival_date')) >= 0 and DAYS(F('arrival_date'), P('peak_window_end')) >= 0"
      - deposit_base: "posted_room_rate + P('resort_fee_nightly_usd') * posted_nights if arrival_in_holiday else (posted_room_rate if arrival_in_peak else nightly_average * P('min_nights_standard'))"
      - protection_benefit: "CFIELD('insure', 'benefit_remaining_usd', status='active', covered_holding_id=HID)"
      - protection_active: "EXISTS('insure', status='active', covered_holding_id=HID)"
      - share_pct: "K('protected_deposit_pct') if (protection_active and protection_benefit >= posted_room_rate) else (K('part_protected_deposit_pct') if (protection_active and protection_benefit < posted_room_rate) else P('deposit_pct'))"
      - share_amount: "deposit_base * share_pct / 100"
      - dining_plan: "EXISTS('dining', status='active', season_code=F('season_code'))"
      - rental_agreement_open: "EXISTS('rentals', status='confirmed', season_code=F('season_code'))"
      - incidental_prepay: "0 if (dining_plan and rental_agreement_open) else (P('incidental_hold_usd') * K('known_household_hold_share') if (dining_plan or rental_agreement_open) else P('incidental_hold_usd'))"
      - paid_to_date: "SUM('lodging_folio', 'amount_usd', event_type='lodging_payment')"
      - advance_credit: "share_amount if paid_to_date >= share_amount else (paid_to_date if paid_to_date > 0 else 0)"
      - result: "RND(share_amount + incidental_prepay - advance_credit, 2)"
    compute_basis:
      posted_room_rate: "The deposit asked for is fixed only after the folio carries the room rate posted for every night of the stay."
      posted_nights: "The deposit asked for on a reservation is worked out on the nightly average of the room rate standing on the folio for the stay, that is the room rate standing on the folio divided by the number of nights it covers, multiplied by the fewest nights the unit type is let for outside its published peak and holiday windows."
      nightly_average: "The deposit asked for on a reservation is worked out on the nightly average of the room rate standing on the folio for the stay, that is the room rate standing on the folio divided by the number of nights it covers, multiplied by the fewest nights the unit type is let for outside its published peak and holiday windows."
      arrival_in_holiday: "Where the arrival date falls inside the unit type's published holiday window, the deposit share is worked out on the room rate standing on the folio for the whole stay together with the unit type's nightly resort charge for every night that room rate covers."
      arrival_in_peak: "Where the arrival date falls inside the unit type's published peak window, the deposit share is worked out on the room rate standing on the folio for the whole stay."
      deposit_base: "Where the arrival date falls inside the unit type's published holiday window, the deposit share is worked out on the room rate standing on the folio for the whole stay together with the unit type's nightly resort charge for every night that room rate covers. Where the arrival date falls inside the unit type's published peak window, the deposit share is worked out on the room rate standing on the folio for the whole stay. Where the arrival date falls outside both of those published windows, the deposit share is worked out on the nightly average of the room rate standing on the folio multiplied by the fewest nights the unit type is let for outside those windows."
      protection_benefit: "Where a protection plan standing active is written over the reservation and the benefit remaining on it reaches the room rate standing on the folio, the protected deposit share is taken."
      protection_active: "Where no protection plan stands active over the reservation, the unit type's deposit share is taken."
      share_pct: "Where a protection plan standing active is written over the reservation and the benefit remaining on it reaches the room rate standing on the folio, the protected deposit share is taken. Where a protection plan standing active is written over the reservation and the benefit remaining on it falls short of the room rate standing on the folio, the part protected deposit share is taken. Where no protection plan stands active over the reservation, the unit type's deposit share is taken."
      share_amount: "The unit type's deposit share of that amount is taken, and the whole of the unit type's incidental hold is collected with it in advance against incidentals."
      dining_plan: "Where the household holds either a dining plan standing active or a rental agreement standing confirmed for that season but not both, the known household share of the unit type's incidental hold is collected in advance against incidentals."
      rental_agreement_open: "Where the household holds either a dining plan standing active or a rental agreement standing confirmed for that season but not both, the known household share of the unit type's incidental hold is collected in advance against incidentals."
      incidental_prepay: "Where the household holds both a dining plan standing active and a rental agreement standing confirmed for the season of the stay, nothing is collected in advance against incidentals. Where the household holds either a dining plan standing active or a rental agreement standing confirmed for that season but not both, the known household share of the unit type's incidental hold is collected in advance against incidentals. Where the household holds neither for that season, the whole of the unit type's incidental hold is collected in advance against incidentals."
      paid_to_date: "Where the folio carries one or more payments already collected against the stay totalling less than the share worked out, the whole of those payments is taken off."
      advance_credit: "Where the folio carries payments already collected against the stay totalling the deposit share worked out or more, the whole of that share is taken off, and the incidental hold collected in advance is still asked for. Where the folio carries one or more payments already collected against the stay totalling less than the share worked out, the whole of those payments is taken off. Where the folio carries no payment already collected against the stay, nothing is taken off."
      result: "The amounts are carried at full precision through every step and the deposit asked for is rounded to the nearest cent once, at the end. An amount that falls exactly halfway between two cents is rounded to the cent whose last digit is even, which is the convention the collective's finance office settles every folio on."
    factors:
      - id: deposit_working_base
        effect: method
        decides: deposit_base
        bindings: [nightly_average, arrival_in_holiday, arrival_in_peak, deposit_base]
        ladder:
          - when: "the arrival date falls inside the unit type's published holiday window"
            method: "the share is worked out on the room rate standing on the folio for the whole stay together with the unit type's nightly resort charge for every night that room rate covers"
          - when: "the arrival date falls inside the unit type's published peak window"
            method: "the share is worked out on the room rate standing on the folio for the whole stay"
          - when: "otherwise"
            method: "the share is worked out on the nightly average of the room rate standing on the folio multiplied by the fewest nights the unit type is let for outside both published windows"
        baseline:
          deposit_base: "nightly_average * P('min_nights_standard')"
        evidence: [date, tier_param]
        cross_difficulty: null
      - id: protected_deposit_share
        effect: parameter
        decides: share_pct
        bindings: [protection_benefit, protection_active, share_pct]
        ladder:
          - when: "a protection plan standing active is written over the reservation and the benefit remaining on it reaches the room rate standing on the folio"
            value: "K('protected_deposit_pct')"
          - when: "a protection plan standing active is written over the reservation and the benefit remaining on it falls short of the room rate standing on the folio"
            value: "K('part_protected_deposit_pct')"
          - when: "otherwise"
            value: "P('deposit_pct')"
        baseline:
          share_pct: "P('deposit_pct')"
        evidence: [cross_category]
        cross_difficulty: insure
      - id: incidental_prepay_share
        effect: parameter
        decides: incidental_prepay
        bindings: [dining_plan, rental_agreement_open, incidental_prepay]
        ladder:
          - when: "the household holds both a dining plan standing active and a rental agreement standing confirmed for the season of the stay"
            value: "0"
          - when: "the household holds either a dining plan standing active or a rental agreement standing confirmed for that season but not both"
            value: "P('incidental_hold_usd') * K('known_household_hold_share')"
          - when: "otherwise"
            value: "P('incidental_hold_usd')"
        baseline:
          incidental_prepay: "P('incidental_hold_usd')"
        evidence: [cross_category]
        cross_difficulty: dining
      - id: payments_already_collected
        effect: parameter
        decides: advance_credit
        bindings: [paid_to_date, advance_credit]
        ladder:
          - when: "the folio carries payments already collected against the stay totalling the deposit share worked out or more"
            value: "share_amount"
          - when: "the folio carries one or more payments already collected against the stay totalling less than the share worked out"
            value: "paid_to_date"
          - when: "otherwise"
            value: "0"
        baseline:
          advance_credit: "0"
        evidence: [history]
        cross_difficulty: null
    inputs:
      history:
        - {table: lodging_folio, aggregate: sum, field: amount_usd, within_months: null, filters: {event_type: lodging_room_charge, charge_category: room_rate}}
        - {table: lodging_folio, aggregate: sum, field: quantity, within_months: null, filters: {event_type: lodging_room_charge, charge_category: room_rate}}
        - {table: lodging_folio, aggregate: sum, field: amount_usd, within_months: null, filters: {event_type: lodging_payment}}
