    formula:
      nightly_rate_usd: "holiday_nightly_rate_usd if rate_plan == 'holiday' else (peak_nightly_rate_usd if rate_plan == 'peak' else base_nightly_rate_usd)"
      amount_usd: "round(nightly_rate_usd * (1 - passholder_discount_pct / 100) + extra_person_nightly_usd * max(0, adults + children - standard_occupancy), 2)"

  - id: lodging_stay_operations
    subject: [lodging_checkin, lodging_nights_load, lodging_night_consume, lodging_incidental_charge]
    rule: >
      Keys are issued from the unit type's check-in time on the arrival date, and the unit must be left by
      its check-out time on the departure date; taking keys earlier or staying later is charged at the unit
      type's early and late fees where the collective can accommodate it at all. The incidental hold is
      taken at check-in against the lead guest's own payment method and is not taken against a third party's
      card. The block of nights is loaded only while the reservation stands in the confirmed or checked_in
      state. One night is drawn for each night the party occupies the unit, counted from the arrival night
      through the night before departure, so a party arriving Friday and leaving Sunday has used two nights.
      Charges the party raises around the mountain are posted to the folio as they arise, each against the
      outlet it arose at, and a charge the party disputes is left on the folio and marked for the duty
      manager rather than removed at the desk. Housekeeping runs at the unit type's frequency, and a party
      asking for more is charged for the extra visits.
    eligibility:
      - id: nights_load_state
        applies_to: [lodging_nights_load]
        kind: state
        condition: "The block of nights is loaded only while the reservation stands in the confirmed or checked_in state."
        evidence_fields: [lodging_holdings.lodging_id, lodging_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lodging_holdings.lodging_id]
          action_bindings:
            lodging_holdings.lodging_id: lodging_id
        state_contract:
          field: lodging_holdings.status
          allowed: [confirmed, checked_in]
    params:
      per_tier:
        Base Village Inn Room: {check_in_time: "=check_in_time", check_out_time: "=check_out_time", early_check_in_fee_usd: "=early_check_in_fee_usd", late_check_out_fee_usd: "=late_check_out_fee_usd", incidental_hold_usd: "=incidental_hold_usd", housekeeping_frequency: "=housekeeping_frequency", ski_valet_included: "=ski_valet_included", shuttle_included: "=shuttle_included", hot_tub_access: "=hot_tub_access"}
