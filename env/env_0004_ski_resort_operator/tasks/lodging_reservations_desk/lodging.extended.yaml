  - id: lodging_rate_and_fees
    subject: [lodging_room_charge, lodging_resort_fee]
    rule: >
      The room rate is posted night by night rather than as one figure for the stay, because a stay that
      straddles two rate windows is priced on the window each night falls in. A night falling inside the
      published holiday window takes the holiday rate, a night inside the peak window takes the peak rate,
      and every other night takes the base rate; the window is judged on the night occupied and never on the
      arrival date. Guests beyond the unit type's standard occupancy add the extra person charge to each
      night they stay. The nightly resort charge is posted for every night occupied and is not reduced by
      any discount, because it pays for services the party has whether or not they use them. The resort
      charge is posted only while the reservation stands in the checked_in or checked_out state. The
      housekeeping charge is posted once on departure and the parking charge nightly for spaces beyond those
      included. A night the party leaves early is still charged where the departure falls inside the
      cancellation terms of the stay.
    eligibility:
      - id: resort_fee_stay_state
        applies_to: [lodging_resort_fee]
        kind: state
        condition: "The resort charge is posted only while the reservation stands in the checked_in or checked_out state."
        evidence_fields: [lodging_holdings.lodging_id, lodging_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lodging_holdings.lodging_id]
          action_bindings:
            lodging_holdings.lodging_id: lodging_id
        state_contract:
          field: lodging_holdings.status
          allowed: [checked_in, checked_out]
    params:
      per_tier:
        Base Village Inn Room: {base_nightly_rate_usd: "=base_nightly_rate_usd", peak_nightly_rate_usd: "=peak_nightly_rate_usd", holiday_nightly_rate_usd: "=holiday_nightly_rate_usd", holiday_window_start: "=holiday_window_start", holiday_window_end: "=holiday_window_end", peak_window_start: "=peak_window_start", peak_window_end: "=peak_window_end", extra_person_nightly_usd: "=extra_person_nightly_usd", resort_fee_nightly_usd: "=resort_fee_nightly_usd", cleaning_fee_usd: "=cleaning_fee_usd", parking_nightly_usd: "=parking_nightly_usd", ski_valet_nightly_usd: "=ski_valet_nightly_usd"}
