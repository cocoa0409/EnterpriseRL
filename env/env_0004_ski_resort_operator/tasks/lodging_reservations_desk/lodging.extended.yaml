  - id: lodging_ext_departure_service_charge
    base_policy_refs: [lodging_stay_operations, lodging_rate_and_fees]
    overwrite:
      - base_policy: lodging_rate_and_fees
        superseded_clause: >-
          The housekeeping charge is posted once on departure and the parking charge nightly for spaces beyond
          those included.
        replaced_by: >-
          The unit type's housekeeping charge and its nightly parking charge are the figures this charge starts
          from, and each of them is varied by what the records of the stay show, with a turnover charge added on top
          of the housekeeping charge for a party larger than the unit sleeps as standard.
    trigger: state_due
    subject: [lodging_incidental_charge]
    computes: service_charge_amount_usd
    target_tool: post_departure_service_charge_1468621e
    prerequisite: []
    params:
      deep_clean_share: 1.50
      extended_clean_share: 1.25
      passholder_parking_share: 0.25
      member_service_share: 0.12
      standard_service_share: 0.18
      full_turnover_share: 0.30
      half_turnover_share: 0.15
    rule: >
      The departure services charge is what a stay owes on departure for servicing the unit and for the nightly
      extras the party asked for: the unit type's housekeeping charge, its nightly charge for each dog the
      reservation records and its nightly parking charge for each parking space beyond those the unit type
      includes, the nightly charges worked out over every night the folio shows the party occupied. The elements
      of the charge are added together and the entry posted to the folio is rounded to the nearest cent once, at the
      end, after the elements have been carried at full precision. An amount that falls exactly halfway between
      two cents is rounded to the cent whose last digit is even, which is the convention the collective's finance
      office settles every folio on.
      The nights the nightly elements are worked out over follow the records of the stay. Where the folio shows the
      party occupied every night the reservation covers, they are worked out over every night the reservation
      covers. Where the folio shows the party occupied fewer nights than the reservation covers and a departure is
      recorded on the reservation, they are worked out over every night from the arrival date to the recorded
      departure, because a unit the party has not given back is a unit the collective cannot let. In every other
      case they are worked out over the nights the folio shows consumed.
      The unit type's housekeeping charge and its nightly parking charge are the figures this charge starts
      from, and each of them is varied by what the records of the stay show, with a turnover charge added on top
      of the housekeeping charge for a party larger than the unit sleeps as standard.
      What the servicing itself costs turns on what the unit has to be put right from. Where the reservation
      records one or more dogs and the folio shows the party occupied at least the unit type's length-of-stay
      threshold in nights, the deep clean share of the unit type's housekeeping charge is taken. Where the
      reservation records one or more dogs, or the folio shows the party occupied at least that threshold in
      nights, but not both, the extended clean share of that charge is taken. Where neither holds, the unit type's
      housekeeping charge is taken as it stands.
      Parking beyond what the unit type includes is charged at the unit type's nightly parking charge for each such
      space. Where the reservation asks for more parking spaces than the unit type includes and a season pass
      stands active for the season of the stay on the household account, that nightly charge is taken less the
      passholder parking share. Where the reservation asks for no more spaces than the unit type includes, nothing
      is charged for parking. In every other case the unit type's nightly parking charge is taken as it stands.
      A service charge is added on what the party had brought to the unit. Where the folio carries incidental
      charges raised at the in-room dining outlet for the stay and a dining plan stands active for the season of
      the stay, the member service share of those charges is added. Where the folio carries incidental charges
      raised at the in-room dining outlet for the stay and no dining plan stands active for that season, the
      standard service share of those charges is added. Where the folio carries no charge raised at that outlet,
      nothing is added.
      A turnover charge is added for a party larger than the unit sleeps as standard, because the linen and the
      turnaround are worked out per bed. Where the party recorded on the reservation fills the unit type's maximum
      occupancy and the folio shows the party occupied more than one night, the full turnover share of the unit
      type's housekeeping charge is added for each guest beyond its standard occupancy. Where the party recorded is
      larger than the unit type's standard occupancy and the folio shows the party occupied more than one night,
      the half turnover share of that charge is added for each guest beyond the standard occupancy. Where neither
      holds, nothing is added.
    baseline:
      rule: >-
        The departure services charge is what a stay owes on departure for servicing the unit and for the nightly
