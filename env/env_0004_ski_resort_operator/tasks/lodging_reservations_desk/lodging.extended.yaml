    inputs:
      history:
        - {table: lodging_folio, aggregate: count, field: folio_event_id, within_months: null, filters: {event_type: lodging_night_consume}}
        - {table: lodging_folio, aggregate: sum, field: amount_usd, within_months: null, filters: {event_type: lodging_room_charge, charge_category: room_rate}}
        - {table: lodging_folio, aggregate: sum, field: amount_usd, within_months: null, filters: {event_type: lodging_room_charge, charge_category: extra_person}}
        - {table: lodging_requests, aggregate: latest, field: created_at, within_months: null, filters: {request_type: date_change, outcome: accepted_pending_confirmation}}
      cross_category: [passes, insure]
    factors:
      - id: nights_given_up_basis
        effect: method
        decides: nights_given_up
        bindings: [nights_covered_a, folio_nights_consumed_a, departure_recorded_a, nights_to_departure_a, nights_given_up]
        ladder:
          - when: "a departure is recorded on the reservation and the folio shows fewer nights consumed than the nights from the arrival date to that departure"
            method: "the nights given up are counted as the nights the reservation covers less the nights from the arrival date to the recorded departure"
          - when: "a departure is recorded on the reservation and the folio shows a night consumed for every night from the arrival date to that departure"
            method: "the nights given up are counted as the nights the reservation covers less the nights the folio shows consumed"
          - when: "otherwise"
            method: "no night of the stay counts as given up"
        baseline:
          nights_given_up: "MX(0, nights_covered_a - folio_nights_consumed_a) if departure_recorded_a else 0"
        evidence: [history, date]
        cross_difficulty: null
      - id: notice_retained_nights
        effect: parameter
        decides: retained_nights
        bindings: [notice_requests, notice_date, notice_lead_days, retained_nights]
        ladder:
          - when: "a request to change the dates of the stay stands accepted at the desk and was raised more than the early departure notice period in calendar days before the departure date on the reservation"
            value: "0"
          - when: "a request to change the dates of the stay stands accepted at the desk and was raised within that period of the departure date"
            value: "MX(0, nights_given_up - P('late_cancellation_fee_nights'))"
          - when: "otherwise"
            value: "nights_given_up"
        baseline:
          retained_nights: "nights_given_up"
        evidence: [history, date]
        cross_difficulty: null
      - id: retained_nightly_rate
        effect: parameter
        decides: retained_nightly
        bindings: [posted_room_rate_a, posted_room_nights_a, pass_active_a, window_nightly_rate, retained_nightly]
        ladder:
          - when: "a season pass stands active for the season of the stay on the household account and the folio carries the room rate posted for the stay"
            value: "the nightly average of the room rate standing on the folio"
          - when: "a season pass stands active for that season and the folio carries no room rate posted for the stay"
            value: "window_nightly_rate * (1 - P('passholder_discount_pct') / 100)"
          - when: "otherwise"
            value: "window_nightly_rate"
        baseline:
          retained_nightly: "window_nightly_rate"
        evidence: [history, cross_category]
        cross_difficulty: passes
      - id: window_retention_supplement
        effect: parameter
        decides: window_supplement_share
        bindings: [nights_in_holiday_a, nights_in_peak_a, window_supplement_share]
        ladder:
          - when: "every night the reservation covers falls inside the unit type's published holiday window"
            value: "K('holiday_retention_share')"
          - when: "every night the reservation covers falls inside its published peak window"
            value: "K('peak_retention_share')"
          - when: "otherwise"
            value: "0"
        baseline:
          window_supplement_share: "0"
        evidence: [date]
        cross_difficulty: null
      - id: occupancy_retention
        effect: parameter
        decides: occupancy_retained
        bindings: [occupancy_charge_posted, guests_beyond_standard_a, occupancy_retained]
        ladder:
          - when: "the folio carries an occupancy charge posted for the stay and the nights retained number the unit type's late cancellation nights or fewer"
            value: "P('extra_person_nightly_usd') * guests_beyond_standard_a * retained_nights"
          - when: "the folio carries an occupancy charge posted for the stay and the nights retained number more than the unit type's late cancellation nights"
            value: "P('extra_person_nightly_usd') * guests_beyond_standard_a * P('late_cancellation_fee_nights')"
          - when: "otherwise"
            value: "0"
        baseline:
          occupancy_retained: "0"
        evidence: [history]
        cross_difficulty: null
      - id: protection_claim_retention
        effect: parameter
        decides: retention_share
        bindings: [plan_active_a, claim_decision_read, retention_share]
        ladder:
          - when: "a protection plan standing active over the reservation carries a claim decision standing allowed"
            value: "K('allowed_claim_retention_share')"
          - when: "a protection plan standing active over the reservation carries a claim decision standing under assessment"
            value: "K('open_claim_retention_share')"
          - when: "otherwise"
            value: "1"
        baseline:
          retention_share: "1"
        evidence: [cross_category]
        cross_difficulty: insure

  - id: lodging_ext_departure_settlement
    base_policy_refs: [lodging_checkout_settlement]
    overwrite:
      - base_policy: lodging_checkout_settlement
        superseded_clause: >-
          The deposit already taken is applied against the folio first, then any lodging credit the household
          holds, and the remainder is taken from the payment method on file.
        replaced_by: >-
          What is still to be collected is reduced in a fixed order: first the charges held back for the duty
          manager, then what the household's dining plan meets, then the deposit standing against the reservation,
          and last the resort credit the household holds, and what is left after all four is the amount collected.
      - base_policy: lodging_checkout_settlement
        superseded_clause: >-
          The folio is presented on departure and settled before the party leaves the mountain.
        replaced_by: >-
          Where the folio was not settled before the party left the mountain, it is settled when the household next
          takes it up, on the same basis.
    trigger: state_due
    subject: [lodging_payment]
    computes: settlement_amount_usd
    target_tool: settle_departure_folio_07fd1088
    prerequisite:
      - problem: lodging_ext_early_departure_charge
        kind: value_input
        gate: outstanding
        form: state
        policy_source: >-
          The amount collected at departure is fixed only after the folio carries the room rate retained for the
          nights of the stay the party gave up.
        condition: >-
          The folio of the reservation carries the retained room rate for the nights the party gave up by leaving
          before the departure date recorded on it.
        resolved_by: post_early_departure_charge_bb461064
        effect: >-
          Once that entry stands on the folio, what is still to be collected takes in the retained room rate as
          well, and the amount collected rises by it.
      - problem: lodging_ext_departure_service_charge
        kind: value_input
        gate: outstanding
        form: state
        policy_source: >-
          It is worked out only once the folio carries the departure services charge the stay owes for servicing
          the unit and for its nightly extras.
        condition: >-
          The folio of the reservation carries the departure services charge covering the servicing of the unit and
          the nightly extras the party asked for.
        resolved_by: post_departure_service_charge_1468621e
        effect: >-
          Once that entry stands on the folio, what is still to be collected takes in the departure services
          charge, and the amount collected rises by it.
      - problem: lodging_ext_stay_resort_charge
        kind: value_input
        gate: outstanding
        form: state
        policy_source: >-
          Before it is worked out, the folio must carry the resort charge owed for the nights of the stay.
        condition: >-
          The folio of the reservation carries the resort charge for every night of the stay it is owed on.
        resolved_by: post_stay_resort_charge_f79fa34a
        effect: >-
          Once that entry stands on the folio, what is still to be collected takes in the resort charge, and the
          amount collected rises by it.
    rule: >
      The amount collected from the household when the folio is settled is what is still to be collected on it:
      every room rate, resort, incidental and fee charge standing on the folio less every payment already collected
      against it, taken from the payment route the household names. A deposit standing against the reservation is
      not one of those charges: it is money already held, and it is set against what is left rather than counted as
      something owed. Where the folio was not settled before the party left the mountain, it is settled when the
      household next takes it up, on the same basis. The amount is carried at full precision and the payment is
      rounded to the nearest cent once, at the end.
      An amount that falls exactly halfway between two cents is rounded to the cent whose last digit is even, which is
      the convention the collective's finance office settles every folio on.
      The amount collected at departure is fixed only after the folio carries the room rate retained for the nights
      of the stay the party gave up. It is worked out only once the folio carries the departure services charge the
      stay owes for servicing the unit and for its nightly extras. Before it is worked out, the folio must carry the
      resort charge owed for the nights of the stay.
      What is still to be collected is reduced in a fixed order: first the charges held back for the duty manager,
      then what the household's dining plan meets, then the deposit standing against the reservation, and last the
      resort credit the household holds, and what is left after all four is the amount collected. Each of the four
      acts on what the one before it left, and none of them may take the amount collected below nothing.
      Charges are held back where the household has queried the folio. Where a folio dispute about the stay stands
      accepted at the desk and the folio carries an occupancy charge for the stay, the occupancy charge standing
      on the folio is held back from what is collected now and stands over for the duty manager. Where a folio
      dispute about the stay stands accepted at the desk and the folio carries no occupancy charge for the stay,
      the resort charge standing on the folio is held back instead. Where no folio dispute about the stay stands
      accepted at the desk, nothing is held back.
      A dining plan meets what the party put on the folio at the collective's tables. Where a dining plan stands
      active for the season of the stay and the balance loaded on it reaches the dining charges standing on the
      folio, those dining charges are met from the plan. Where a dining plan stands active for that season and the
      balance loaded on it falls short of those dining charges, the balance loaded on the plan is met from it.
      Where no dining plan stands active for that season, nothing is met from a plan.
      The deposit taken before the stay is then set against what is left. Where a deposit stands against the
      reservation and reaches what is left to be collected, only what is left to be collected is set against it and
      the balance of the deposit is returned to the household. Where a deposit stands against the reservation and
      falls short of what is left to be collected, the whole of the deposit standing is set against it. Where no
      deposit stands against the reservation, nothing is set against it.
      Resort credit is drawn last, and which pot it is drawn from follows what the household holds. Credit counts
      only where the record carrying it is itself live: a season pass record standing active for the season of the
      stay, or a ticket order standing in use for that season. Where the household holds resort credit standing on
      a season pass record standing active for the season of the stay and credit standing on a ticket order
      standing in use for that season as well, the credit on the pass record is drawn first and only what it does
      not cover is drawn from the ticket order. Where the household holds resort credit standing on a season pass
      record standing active for that season and none standing on a ticket order standing in use, the credit on
      the pass record is drawn. Where the household holds resort credit standing on a ticket order standing in use
      for that season and none standing on a season pass record standing active, the credit on the ticket order is
      drawn. Where the household holds neither, no credit is drawn.
    baseline:
      rule: >-
        The amount collected from the household when the folio is settled is what is still to be collected on it:
        every room rate, resort, incidental and fee charge standing on the folio less every payment already
        collected against it, taken from the payment route the household names. A deposit standing against the
        reservation is not one of those charges: it is money already held, and it is set against what is left
        rather than counted as something owed. The amount is carried at full precision and the payment is rounded
        to the nearest cent once, at the end.
        An amount that falls exactly halfway between two cents is rounded to the cent whose last digit is even, which
        is the convention the collective's finance office settles every folio on.
      params: []
    cross_category:
      - category: dining
        as: branch
        reads: [status, season_code, dining_balance_usd]
        note: "What the household's dining plan meets is decided from the dining plans standing on the household account."
      - category: passes
        as: branch
        reads: [status, season_code, pass_credit_usd]
        note: "Which credit pot is drawn, and how much, is decided from the season pass records standing on the household account."
      - category: tickets
        as: branch
        reads: [status, season_code, ticket_credit_usd]
        note: "Which credit pot is drawn, and how much, is decided from the ticket orders standing on the household account."
    compute:
      - folio_charges: "SUM('lodging_folio', 'amount_usd', event_type='lodging_room_charge') + SUM('lodging_folio', 'amount_usd', event_type='lodging_resort_fee') + SUM('lodging_folio', 'amount_usd', event_type='lodging_incidental_charge') + SUM('lodging_folio', 'amount_usd', event_type='lodging_fee_charge')"
      - folio_payments: "SUM('lodging_folio', 'amount_usd', event_type='lodging_payment')"
      - outstanding: "MX(0, folio_charges - folio_payments)"
      - dispute_requests: "COUNT('lodging_requests', request_type='folio_dispute', outcome='accepted_pending_confirmation')"
      - occupancy_charges_standing: "SUM('lodging_folio', 'amount_usd', event_type='lodging_room_charge', charge_category='extra_person')"
      - resort_charges_standing: "SUM('lodging_folio', 'amount_usd', event_type='lodging_resort_fee')"
      - withheld_charges: "occupancy_charges_standing if (dispute_requests > 0 and occupancy_charges_standing > 0) else (resort_charges_standing if (dispute_requests > 0 and occupancy_charges_standing <= 0) else 0)"
      - dining_charges_standing: "SUM('lodging_folio', 'amount_usd', event_type='lodging_incidental_charge', charge_category='dining')"
      - dining_plan_active: "EXISTS('dining', status='active', season_code=F('season_code'))"
      - dining_balance: "CFIELD('dining', 'dining_balance_usd', status='active', season_code=F('season_code')) or 0"
      - dining_met: "dining_charges_standing if (dining_plan_active and dining_balance >= dining_charges_standing) else (dining_balance if (dining_plan_active and dining_balance < dining_charges_standing) else 0)"
      - due_after_withholding: "MX(0, outstanding - withheld_charges - dining_met)"
      - deposit_standing: "SUM('lodging_folio', 'amount_usd', event_type='lodging_deposit_charge') - SUM('lodging_folio', 'amount_usd', event_type='lodging_deposit_apply')"
      - deposit_set_against: "due_after_withholding if (deposit_standing > 0 and deposit_standing >= due_after_withholding) else (deposit_standing if (deposit_standing > 0 and deposit_standing < due_after_withholding) else 0)"
      - due_after_deposit: "MX(0, due_after_withholding - deposit_set_against)"
      - pass_credit_amount: "CFIELD('passes', 'pass_credit_usd', status='active', season_code=F('season_code')) or 0"
      - ticket_credit_amount: "CFIELD('tickets', 'ticket_credit_usd', status='in_use', season_code=F('season_code')) or 0"
      - credit_drawn: "MN(due_after_deposit, pass_credit_amount + ticket_credit_amount) if (pass_credit_amount > 0 and ticket_credit_amount > 0) else (MN(due_after_deposit, pass_credit_amount) if (pass_credit_amount > 0 and ticket_credit_amount <= 0) else (MN(due_after_deposit, ticket_credit_amount) if ticket_credit_amount > 0 else 0))"
      - result: "RND(MX(0, due_after_deposit - credit_drawn), 2)"
    compute_basis:
      folio_charges: "The amount collected from the household when the folio is settled is what is still to be collected on it: every room rate, resort, incidental and fee charge standing on the folio less every payment already collected against it, taken from the payment route the household names."
      folio_payments: "The amount collected from the household when the folio is settled is what is still to be collected on it: every room rate, resort, incidental and fee charge standing on the folio less every payment already collected against it, taken from the payment route the household names."
      outstanding: "The amount collected from the household when the folio is settled is what is still to be collected on it: every room rate, resort, incidental and fee charge standing on the folio less every payment already collected against it, taken from the payment route the household names."
      dispute_requests: "Where no folio dispute about the stay stands accepted at the desk, nothing is held back."
      occupancy_charges_standing: "Where a folio dispute about the stay stands accepted at the desk and the folio carries an occupancy charge for the stay, the occupancy charge standing on the folio is held back from what is collected now and stands over for the duty manager."
      resort_charges_standing: "Where a folio dispute about the stay stands accepted at the desk and the folio carries no occupancy charge for the stay, the resort charge standing on the folio is held back instead."
      withheld_charges: "Where a folio dispute about the stay stands accepted at the desk and the folio carries an occupancy charge for the stay, the occupancy charge standing on the folio is held back from what is collected now and stands over for the duty manager. Where a folio dispute about the stay stands accepted at the desk and the folio carries no occupancy charge for the stay, the resort charge standing on the folio is held back instead. Where no folio dispute about the stay stands accepted at the desk, nothing is held back."
      dining_charges_standing: "Where a dining plan stands active for the season of the stay and the balance loaded on it reaches the dining charges standing on the folio, those dining charges are met from the plan."
      dining_plan_active: "Where no dining plan stands active for that season, nothing is met from a plan."
      dining_balance: "Where a dining plan stands active for that season and the balance loaded on it falls short of those dining charges, the balance loaded on the plan is met from it."
      dining_met: "Where a dining plan stands active for the season of the stay and the balance loaded on it reaches the dining charges standing on the folio, those dining charges are met from the plan. Where a dining plan stands active for that season and the balance loaded on it falls short of those dining charges, the balance loaded on the plan is met from it. Where no dining plan stands active for that season, nothing is met from a plan."
      due_after_withholding: "Each of the four acts on what the one before it left, and none of them may take the amount collected below nothing."
      deposit_standing: "Where no deposit stands against the reservation, nothing is set against it."
      deposit_set_against: "Where a deposit stands against the reservation and reaches what is left to be collected, only what is left to be collected is set against it and the balance of the deposit is returned to the household. Where a deposit stands against the reservation and falls short of what is left to be collected, the whole of the deposit standing is set against it. Where no deposit stands against the reservation, nothing is set against it."
      due_after_deposit: "Each of the four acts on what the one before it left, and none of them may take the amount collected below nothing."
      pass_credit_amount: "Where the household holds resort credit standing on a season pass record standing active for that season and none standing on a ticket order standing in use, the credit on the pass record is drawn."
      ticket_credit_amount: "Where the household holds resort credit standing on a ticket order standing in use for that season and none standing on a season pass record standing active, the credit on the ticket order is drawn."
      credit_drawn: "Where the household holds resort credit standing on a season pass record standing active for the season of the stay and credit standing on a ticket order standing in use for that season as well, the credit on the pass record is drawn first and only what it does not cover is drawn from the ticket order. Where the household holds resort credit standing on a season pass record standing active for that season and none standing on a ticket order standing in use, the credit on the pass record is drawn. Where the household holds resort credit standing on a ticket order standing in use for that season and none standing on a season pass record standing active, the credit on the ticket order is drawn. Where the household holds neither, no credit is drawn."
      result: "The amount is carried at full precision and the payment is rounded to the nearest cent once, at the end. An amount that falls exactly halfway between two cents is rounded to the cent whose last digit is even, which is the convention the collective's finance office settles every folio on."
    factors:
      - id: disputed_charges_held_back
        effect: parameter
        decides: withheld_charges
        bindings: [dispute_requests, occupancy_charges_standing, resort_charges_standing, withheld_charges]
        ladder:
          - when: "a folio dispute about the stay stands accepted at the desk and the folio carries an occupancy charge for the stay"
            value: "occupancy_charges_standing"
          - when: "a folio dispute about the stay stands accepted at the desk and the folio carries no occupancy charge for the stay"
            value: "resort_charges_standing"
          - when: "otherwise"
            value: "0"
        baseline:
          withheld_charges: "0"
        evidence: [history]
        cross_difficulty: null
      - id: dining_plan_met_charges
        effect: parameter
        decides: dining_met
        bindings: [dining_charges_standing, dining_plan_active, dining_balance, dining_met]
        ladder:
          - when: "a dining plan stands active for the season of the stay and the balance loaded on it reaches the dining charges standing on the folio"
            value: "dining_charges_standing"
          - when: "a dining plan stands active for that season and the balance loaded on it falls short of those dining charges"
            value: "dining_balance"
          - when: "otherwise"
            value: "0"
        baseline:
          dining_met: "0"
        evidence: [history, cross_category]
        cross_difficulty: dining
      - id: deposit_set_against_folio
        effect: parameter
        decides: deposit_set_against
        bindings: [deposit_standing, deposit_set_against]
        ladder:
          - when: "a deposit stands against the reservation and reaches what is left to be collected"
            value: "due_after_withholding"
          - when: "a deposit stands against the reservation and falls short of what is left to be collected"
            value: "deposit_standing"
          - when: "otherwise"
            value: "0"
        baseline:
          deposit_set_against: "0"
        evidence: [history]
        cross_difficulty: null
      - id: resort_credit_draw
        effect: method
        decides: credit_drawn
        bindings: [pass_credit_amount, ticket_credit_amount, credit_drawn]
        ladder:
          - when: "the household holds resort credit standing on a season pass record standing active for the season of the stay and credit standing on a ticket order standing in use for that season as well"
            method: "the credit on the pass record is drawn first and only what it does not cover is drawn from the ticket order, up to what is left to be collected"
          - when: "the household holds resort credit standing on a season pass record standing active for that season and none standing on a ticket order standing in use"
            method: "the credit on the pass record is drawn, up to what is left to be collected"
          - when: "the household holds resort credit standing on a ticket order standing in use for that season and none standing on a season pass record standing active"
            method: "the credit on the ticket order is drawn, up to what is left to be collected"
          - when: "otherwise"
            method: "no credit is drawn"
        baseline:
          credit_drawn: "0"
        evidence: [cross_category]
        cross_difficulty: passes
    inputs:
      history:
        - {table: lodging_folio, aggregate: sum, field: amount_usd, within_months: null, filters: {event_type: lodging_room_charge}}
        - {table: lodging_folio, aggregate: sum, field: amount_usd, within_months: null, filters: {event_type: lodging_payment}}
        - {table: lodging_folio, aggregate: sum, field: amount_usd, within_months: null, filters: {event_type: lodging_deposit_charge}}
        - {table: lodging_requests, aggregate: count, field: lodging_request_id, within_months: null, filters: {request_type: folio_dispute, outcome: accepted_pending_confirmation}}
      cross_category: [dining, passes, tickets]
