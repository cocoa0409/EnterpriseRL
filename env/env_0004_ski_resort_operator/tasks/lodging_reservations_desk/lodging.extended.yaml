      notice_lead_days: "Where a request to change the dates of the stay stands accepted at the desk and was raised within that period of the departure date, the nights retained are the nights given up less the unit type's late cancellation nights, and never fewer than none, the notice earning the household that allowance."
      retained_nights: "Where a request to change the dates of the stay stands accepted at the desk and was raised more than the early departure notice period in calendar days before the departure date on the reservation, no night is retained. Where a request to change the dates of the stay stands accepted at the desk and was raised within that period of the departure date, the nights retained are the nights given up less the unit type's late cancellation nights, and never fewer than none, the notice earning the household that allowance. Where no request to change the dates of the stay stands accepted at the desk, every night given up is retained."
      posted_room_rate_a: "Where a season pass stands active for the season of the stay on the household account and the folio carries the room rate posted for the stay, the retained nights are priced at the nightly average of that room rate, which is the room rate standing on the folio divided by the number of entries it was posted in."
      posted_room_nights_a: "Where a season pass stands active for the season of the stay on the household account and the folio carries the room rate posted for the stay, the retained nights are priced at the nightly average of that room rate, which is the room rate standing on the folio divided by the number of entries it was posted in."
      pass_active_a: "Where no season pass stands active for that season, they are priced at the published nightly rate of the window the stay falls in."
      window_nightly_rate: "The room rate retained when a party leaves before the departure date on the reservation is worked out on the nights of the stay the party gave up, each of them priced at the nightly rate of the published window the stay falls in, and the whole of it is retained."
      retained_nightly: "Where a season pass stands active for the season of the stay on the household account and the folio carries the room rate posted for the stay, the retained nights are priced at the nightly average of that room rate, which is the room rate standing on the folio divided by the number of entries it was posted in. Where a season pass stands active for that season and the folio carries no room rate posted for the stay, they are priced at the published nightly rate of the window the stay falls in, less the unit type's passholder reduction. Where no season pass stands active for that season, they are priced at the published nightly rate of the window the stay falls in. A nightly rate worked out under any of those three readings is a working figure and not an amount posted to a folio: it is carried at full precision, is never rounded on its own, and reaches the cent only through the amount the entry is posted at."
      retained_room_rate: "The room rate retained when a party leaves before the departure date on the reservation is worked out on the nights of the stay the party gave up, each of them priced at the nightly rate of the published window the stay falls in, and the whole of it is retained."
      nights_in_holiday_a: "Where every night the reservation covers falls inside the unit type's published holiday window, the holiday retention share of the room rate retained is added to it."
      nights_in_peak_a: "Where every night the reservation covers falls inside its published peak window, the peak retention share of that amount is added to it."
