      - dining_service_charge: "in_room_dining_charges * K('member_service_share') if (in_room_dining_charges > 0 and dining_active_b) else (in_room_dining_charges * K('standard_service_share') if (in_room_dining_charges > 0 and not dining_active_b) else 0)"
      - party_size: "F('adults') + F('children')"
      - occupied_more_than_one_night: "COUNT('lodging_folio', event_type='lodging_night_consume') > 1"
      - guests_beyond_standard: "MX(0, party_size - P('standard_occupancy'))"
      - turnover_element: "P('cleaning_fee_usd') * K('full_turnover_share') * guests_beyond_standard if (party_size >= P('max_occupancy') and occupied_more_than_one_night) else (P('cleaning_fee_usd') * K('half_turnover_share') * guests_beyond_standard if (party_size > P('standard_occupancy') and occupied_more_than_one_night) else 0)"
      - result: "RND(housekeeping_amount + pet_element + parking_element + dining_service_charge + turnover_element, 2)"
