      retained_with_window: "A retention supplement is added on the room rate retained, because a night given back in the busiest weeks is the hardest to let again."
      occupancy_charge_posted: "Where the folio carries no occupancy charge posted for the stay, nothing is retained for occupancy."
      guests_beyond_standard_a: "Where the folio carries an occupancy charge posted for the stay and the nights retained number the unit type's late cancellation nights or fewer, the unit type's extra person charge is retained for each guest beyond its standard occupancy for each night retained."
      occupancy_retained: "Where the folio carries an occupancy charge posted for the stay and the nights retained number the unit type's late cancellation nights or fewer, the unit type's extra person charge is retained for each guest beyond its standard occupancy for each night retained. Where the folio carries an occupancy charge posted for the stay and the nights retained number more than the unit type's late cancellation nights, that charge is retained for each such guest for the unit type's late cancellation nights only. Where the folio carries no occupancy charge posted for the stay, nothing is retained for occupancy."
      plan_active_a: "Where no protection plan standing active over the reservation carries either decision, the whole of that amount is charged."
