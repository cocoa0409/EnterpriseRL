  - id: lodging_ext_stay_resort_charge
    base_policy_refs: [lodging_rate_and_fees, lodging_agg_household_stay_pricing]
    overwrite:
      - base_policy: lodging_rate_and_fees
        superseded_clause: >-
          The nightly resort charge is posted for every night occupied and is not reduced by any discount, because
          it pays for services the party has whether or not they use them.
        replaced_by: >-
          The resort charge for a stay is the nightly resort charge of the unit type for every night the folio shows
          the party occupied, posted to the folio as a single entry carrying the number of nights it covers.
    trigger: state_due
    subject: [lodging_resort_fee]
    computes: resort_charge_amount_usd
    target_tool: post_stay_resort_charge_f79fa34a
    prerequisite: []
    params:
      member_resort_share: 0.70
      part_member_resort_share: 0.85
      holiday_resort_share: 0.25
      half_holiday_resort_share: 0.125
    rule: >
      The resort charge for a stay is the nightly resort charge of the unit type for every night the folio shows
      the party occupied, posted to the folio as a single entry carrying the number of nights it covers. The amount
      is carried at full precision and the entry posted to the folio is rounded to the nearest cent once, at the
      end.
      An amount that falls exactly halfway between two cents is rounded to the cent whose last digit is even, which is
      the convention the collective's finance office settles every folio on.
      Which nights the charge is worked out over depends on what the records of the stay show. Where a departure is
      recorded on the reservation and the folio shows fewer nights consumed than the nights from the arrival date
      to that departure, the charge is worked out over the nights from the arrival date to the recorded departure,
      because the occupancy file is the incomplete record and the departure is the firm one. Where no departure is
      recorded on the reservation, the charge is worked out over every night the reservation covers. In every other
      case the charge is worked out over the nights the folio shows consumed.
      The nightly charge itself turns on what else the household holds with the collective, because the shuttle,
      the fitness centre and the pools the charge pays for are already paid for elsewhere by a household that skis
      and eats on the mountain all season. Where a season pass stands active for the season of the stay on the
      household account and a dining plan stands active for that season as well, the member share of the unit
      type's nightly resort charge is taken. Where one of those two stands active for that season but not the
      other, the part member share of that nightly charge is taken. Where neither stands active for that season,
      the unit type's nightly resort charge is taken in full.
      A night already charged is never charged twice. Where the folio carries resort charge entries for the stay
      covering some but not all of the nights the charge is worked out over, only the nights those entries do not
      cover are charged. Where the folio carries resort charge entries covering every one of those nights, no night
      is charged again. Where the folio carries no resort charge entry for the stay, every one of those nights is
      charged.
      A holiday supplement is added to the nightly charge for the nights being charged. Where every night the
      reservation covers falls inside the unit type's published holiday window, the holiday share of the nightly
      charge is added to it for each night charged. Where some but not all of the nights the reservation covers
      fall inside that window, the half holiday share of the nightly charge is added to it for each night charged,
      which is how a stay spanning the turn of the window is blended. Where no night the reservation covers falls
      inside that window, nothing is added.
    baseline:
      rule: >-
        The resort charge for a stay is the nightly resort charge of the unit type for every night the folio shows
        the party occupied, posted to the folio as a single entry carrying the number of nights it covers. The
        amount is carried at full precision and the entry posted to the folio is rounded to the nearest cent once,
        at the end.
        An amount that falls exactly halfway between two cents is rounded to the cent whose last digit is even, which
        is the convention the collective's finance office settles every folio on.
      params: [resort_fee_nightly_usd]
    cross_category:
      - category: passes
        as: existence
        reads: [status, season_code]
        note: "The nightly resort charge tier is decided from the season passes standing on the household account."
      - category: dining
        as: existence
        reads: [status, season_code]
        note: "The nightly resort charge tier is decided from the dining plans standing on the household account."
    compute:
      - folio_nights_consumed: "COUNT('lodging_folio', event_type='lodging_night_consume')"
      - departure_recorded: "F('checked_out_at') != ''"
      - nights_to_departure: "DAYS(F('arrival_date'), F('checked_out_at'))"
      - nights_covered: "DAYS(F('arrival_date'), F('departure_date'))"
      - charged_nights: "nights_to_departure if (departure_recorded and folio_nights_consumed < nights_to_departure) else (nights_covered if not departure_recorded else folio_nights_consumed)"
      - pass_active: "EXISTS('passes', status='active', season_code=F('season_code'))"
      - dining_active: "EXISTS('dining', status='active', season_code=F('season_code'))"
      - resort_nightly: "P('resort_fee_nightly_usd') * K('member_resort_share') if (pass_active and dining_active) else (P('resort_fee_nightly_usd') * K('part_member_resort_share') if (pass_active or dining_active) else P('resort_fee_nightly_usd'))"
      - nights_already_charged: "SUM('lodging_folio', 'quantity', event_type='lodging_resort_fee')"
      - nights_to_charge: "MX(0, charged_nights - nights_already_charged) if (nights_already_charged > 0 and nights_already_charged < charged_nights) else (0 if (nights_already_charged > 0 and nights_already_charged >= charged_nights) else charged_nights)"
      - nights_in_holiday: "MX(0, MN(nights_covered, DAYS(F('arrival_date'), P('holiday_window_end')) + 1) - MX(0, DAYS(F('arrival_date'), P('holiday_window_start'))))"
      - every_night_in_holiday: "nights_in_holiday >= nights_covered"
      - some_night_in_holiday: "nights_in_holiday > 0"
      - holiday_supplement: "resort_nightly * K('holiday_resort_share') if (every_night_in_holiday and some_night_in_holiday) else (resort_nightly * K('half_holiday_resort_share') if some_night_in_holiday else 0)"
      - result: "RND((resort_nightly + holiday_supplement) * nights_to_charge, 2)"
    compute_basis:
      folio_nights_consumed: "In every other case the charge is worked out over the nights the folio shows consumed."
      departure_recorded: "Where no departure is recorded on the reservation, the charge is worked out over every night the reservation covers."
      nights_to_departure: "Where a departure is recorded on the reservation and the folio shows fewer nights consumed than the nights from the arrival date to that departure, the charge is worked out over the nights from the arrival date to the recorded departure, because the occupancy file is the incomplete record and the departure is the firm one."
      nights_covered: "Where no departure is recorded on the reservation, the charge is worked out over every night the reservation covers."
      charged_nights: "Where a departure is recorded on the reservation and the folio shows fewer nights consumed than the nights from the arrival date to that departure, the charge is worked out over the nights from the arrival date to the recorded departure, because the occupancy file is the incomplete record and the departure is the firm one. Where no departure is recorded on the reservation, the charge is worked out over every night the reservation covers. In every other case the charge is worked out over the nights the folio shows consumed."
      pass_active: "Where a season pass stands active for the season of the stay on the household account and a dining plan stands active for that season as well, the member share of the unit type's nightly resort charge is taken."
      dining_active: "Where one of those two stands active for that season but not the other, the part member share of that nightly charge is taken."
      resort_nightly: "Where a season pass stands active for the season of the stay on the household account and a dining plan stands active for that season as well, the member share of the unit type's nightly resort charge is taken. Where one of those two stands active for that season but not the other, the part member share of that nightly charge is taken. Where neither stands active for that season, the unit type's nightly resort charge is taken in full."
      nights_already_charged: "Where the folio carries resort charge entries for the stay covering some but not all of the nights the charge is worked out over, only the nights those entries do not cover are charged."
      nights_to_charge: "Where the folio carries resort charge entries for the stay covering some but not all of the nights the charge is worked out over, only the nights those entries do not cover are charged. Where the folio carries resort charge entries covering every one of those nights, no night is charged again. Where the folio carries no resort charge entry for the stay, every one of those nights is charged."
      nights_in_holiday: "Where every night the reservation covers falls inside the unit type's published holiday window, the holiday share of the nightly charge is added to it for each night charged."
      every_night_in_holiday: "Where every night the reservation covers falls inside the unit type's published holiday window, the holiday share of the nightly charge is added to it for each night charged."
      some_night_in_holiday: "Where some but not all of the nights the reservation covers fall inside that window, the half holiday share of the nightly charge is added to it for each night charged, which is how a stay spanning the turn of the window is blended."
      holiday_supplement: "Where every night the reservation covers falls inside the unit type's published holiday window, the holiday share of the nightly charge is added to it for each night charged. Where some but not all of the nights the reservation covers fall inside that window, the half holiday share of the nightly charge is added to it for each night charged, which is how a stay spanning the turn of the window is blended. Where no night the reservation covers falls inside that window, nothing is added."
      result: "The amount is carried at full precision and the entry posted to the folio is rounded to the nearest cent once, at the end. An amount that falls exactly halfway between two cents is rounded to the cent whose last digit is even, which is the convention the collective's finance office settles every folio on."
    factors:
      - id: charged_nights_basis
        effect: method
        decides: charged_nights
        bindings: [folio_nights_consumed, departure_recorded, nights_to_departure, nights_covered, charged_nights]
        ladder:
          - when: "a departure is recorded on the reservation and the folio shows fewer nights consumed than the nights from the arrival date to that departure"
            method: "the charge is worked out over the nights from the arrival date to the recorded departure"
          - when: "no departure is recorded on the reservation"
            method: "the charge is worked out over every night the reservation covers"
          - when: "otherwise"
            method: "the charge is worked out over the nights the folio shows consumed"
        baseline:
          charged_nights: "folio_nights_consumed"
        evidence: [history, date]
        cross_difficulty: null
      - id: member_resort_nightly
        effect: parameter
        decides: resort_nightly
        bindings: [pass_active, dining_active, resort_nightly]
        ladder:
          - when: "a season pass stands active for the season of the stay on the household account and a dining plan stands active for that season as well"
            value: "P('resort_fee_nightly_usd') * K('member_resort_share')"
          - when: "one of those two stands active for that season but not the other"
            value: "P('resort_fee_nightly_usd') * K('part_member_resort_share')"
          - when: "otherwise"
            value: "P('resort_fee_nightly_usd')"
        baseline:
          resort_nightly: "P('resort_fee_nightly_usd')"
        evidence: [cross_category]
        cross_difficulty: passes
      - id: nights_already_charged_offset
        effect: parameter
        decides: nights_to_charge
        bindings: [nights_already_charged, nights_to_charge]
        ladder:
          - when: "the folio carries resort charge entries for the stay covering some but not all of the nights the charge is worked out over"
            value: "the nights the charge is worked out over less the nights those entries cover"
          - when: "the folio carries resort charge entries covering every one of those nights"
            value: "0"
          - when: "otherwise"
            value: "charged_nights"
        baseline:
          nights_to_charge: "charged_nights"
        evidence: [history]
        cross_difficulty: null
      - id: holiday_window_supplement
        effect: parameter
        decides: holiday_supplement
        bindings: [nights_in_holiday, every_night_in_holiday, some_night_in_holiday, holiday_supplement]
        ladder:
          - when: "every night the reservation covers falls inside the unit type's published holiday window"
            value: "resort_nightly * K('holiday_resort_share')"
          - when: "some but not all of the nights the reservation covers fall inside that window"
            value: "resort_nightly * K('half_holiday_resort_share')"
          - when: "otherwise"
            value: "0"
        baseline:
          holiday_supplement: "0"
        evidence: [date]
        cross_difficulty: null
