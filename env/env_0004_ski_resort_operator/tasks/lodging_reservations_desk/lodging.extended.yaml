      - service_nights: "nights_covered_b if folio_nights_consumed_b >= nights_covered_b else (nights_to_departure_b if (departure_recorded_b and folio_nights_consumed_b < nights_covered_b) else folio_nights_consumed_b)"
      - has_dog: "F('pets') > 0"
      - long_stay_occupancy: "COUNT('lodging_folio', event_type='lodging_night_consume') >= P('length_of_stay_threshold_nights')"
      - housekeeping_amount: "P('cleaning_fee_usd') * K('deep_clean_share') if (has_dog and long_stay_occupancy) else (P('cleaning_fee_usd') * K('extended_clean_share') if (has_dog or long_stay_occupancy) else P('cleaning_fee_usd'))"
      - pet_element: "P('pet_fee_nightly_usd') * F('pets') * service_nights"
      - extra_spaces: "MX(0, F('parking_spaces') - P('parking_spaces_included'))"
