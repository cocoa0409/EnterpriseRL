    compute:
      - folio_nights_consumed_b: "COUNT('lodging_folio', event_type='lodging_night_consume')"
      - nights_covered_b: "DAYS(F('arrival_date'), F('departure_date'))"
      - departure_recorded_b: "F('checked_out_at') != ''"
