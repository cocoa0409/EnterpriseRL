  - id: insure_claim_assessment
    subject: [insure_claim_settle, insure_claim_decline, insure_claim_payment]
    rule: >
      A complete claim is assessed against the plan's list of covered events. A claim made on an event the
      plan excludes is refused whatever the circumstances, and an exclusion always beats a cover, so a plan
      that covers loss of employment but excludes a voluntary resignation refuses a claim on a resignation.
      A medical claim is allowed only where a doctor has certified the insured unfit to ski for at least the
      plan's threshold in consecutive days, and a closure claim only where the mountain was shut for at
      least the plan's threshold in consecutive days. The amount allowed is the plan's benefit share for the
      event claimed on, taken of the covered value, less the plan's excess, and then brought down to the
      plan's per-claim cap; it is never below zero and never more than the benefit left on the plan. The
      payout is made only while the plan record stands in the claim_open or claim_settled state, and it
      draws down the benefit left for the rest of the season. A plan that has already met its allowance of
      claims for the season entertains no further claim, and a refused claim does not count against that
      allowance. The payout goes out by the plan's payout method and never in cash at the desk.
    eligibility:
      - id: payout_state
        applies_to: [insure_claim_payment]
        kind: state
        condition: "The payout is made only while the plan record stands in the claim_open or claim_settled state, and it draws down the benefit left for the rest of the season."
        evidence_fields: [insure_holdings.protection_plan_id, insure_holdings.status, insure_holdings.benefit_remaining_usd]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [insure_holdings.protection_plan_id]
          action_bindings:
            insure_holdings.protection_plan_id: protection_plan_id
        state_contract:
          field: insure_holdings.status
          allowed: [claim_open, claim_settled]
    params:
      per_tier:
        Season Pass Protection Basic: {covered_perils: "=covered_perils", excluded_perils: "=excluded_perils", medical_benefit_pct: "=medical_benefit_pct", job_loss_benefit_pct: "=job_loss_benefit_pct", relocation_benefit_pct: "=relocation_benefit_pct", closure_benefit_pct: "=closure_benefit_pct", excess_usd: "=excess_usd", per_claim_cap_usd: "=per_claim_cap_usd", season_benefit_cap_usd: "=season_benefit_cap_usd", claims_per_season: "=claims_per_season", injury_threshold_days: "=injury_threshold_days", mountain_closure_threshold_days: "=mountain_closure_threshold_days", trip_interruption_daily_usd: "=trip_interruption_daily_usd", trip_interruption_max_days: "=trip_interruption_max_days", claim_assessment_days: "=claim_assessment_days", settlement_days: "=settlement_days", payout_method: "=payout_method"}
        Season Pass Protection Plus: {covered_perils: "=covered_perils", excluded_perils: "=excluded_perils", medical_benefit_pct: "=medical_benefit_pct", job_loss_benefit_pct: "=job_loss_benefit_pct", relocation_benefit_pct: "=relocation_benefit_pct", closure_benefit_pct: "=closure_benefit_pct", excess_usd: "=excess_usd", per_claim_cap_usd: "=per_claim_cap_usd", season_benefit_cap_usd: "=season_benefit_cap_usd", claims_per_season: "=claims_per_season", injury_threshold_days: "=injury_threshold_days", mountain_closure_threshold_days: "=mountain_closure_threshold_days", trip_interruption_daily_usd: "=trip_interruption_daily_usd", trip_interruption_max_days: "=trip_interruption_max_days", claim_assessment_days: "=claim_assessment_days", settlement_days: "=settlement_days", payout_method: "=payout_method"}
        Season Pass Protection Premier: {covered_perils: "=covered_perils", excluded_perils: "=excluded_perils", medical_benefit_pct: "=medical_benefit_pct", job_loss_benefit_pct: "=job_loss_benefit_pct", relocation_benefit_pct: "=relocation_benefit_pct", closure_benefit_pct: "=closure_benefit_pct", excess_usd: "=excess_usd", per_claim_cap_usd: "=per_claim_cap_usd", season_benefit_cap_usd: "=season_benefit_cap_usd", claims_per_season: "=claims_per_season", injury_threshold_days: "=injury_threshold_days", mountain_closure_threshold_days: "=mountain_closure_threshold_days", trip_interruption_daily_usd: "=trip_interruption_daily_usd", trip_interruption_max_days: "=trip_interruption_max_days", claim_assessment_days: "=claim_assessment_days", settlement_days: "=settlement_days", payout_method: "=payout_method"}
        Collective Trip Protection Standard: {covered_perils: "=covered_perils", excluded_perils: "=excluded_perils", medical_benefit_pct: "=medical_benefit_pct", job_loss_benefit_pct: "=job_loss_benefit_pct", relocation_benefit_pct: "=relocation_benefit_pct", closure_benefit_pct: "=closure_benefit_pct", excess_usd: "=excess_usd", per_claim_cap_usd: "=per_claim_cap_usd", season_benefit_cap_usd: "=season_benefit_cap_usd", claims_per_season: "=claims_per_season", injury_threshold_days: "=injury_threshold_days", mountain_closure_threshold_days: "=mountain_closure_threshold_days", trip_interruption_daily_usd: "=trip_interruption_daily_usd", trip_interruption_max_days: "=trip_interruption_max_days", claim_assessment_days: "=claim_assessment_days", settlement_days: "=settlement_days", payout_method: "=payout_method"}
        Collective Trip Protection Elite: {covered_perils: "=covered_perils", excluded_perils: "=excluded_perils", medical_benefit_pct: "=medical_benefit_pct", job_loss_benefit_pct: "=job_loss_benefit_pct", relocation_benefit_pct: "=relocation_benefit_pct", closure_benefit_pct: "=closure_benefit_pct", excess_usd: "=excess_usd", per_claim_cap_usd: "=per_claim_cap_usd", season_benefit_cap_usd: "=season_benefit_cap_usd", claims_per_season: "=claims_per_season", injury_threshold_days: "=injury_threshold_days", mountain_closure_threshold_days: "=mountain_closure_threshold_days", trip_interruption_daily_usd: "=trip_interruption_daily_usd", trip_interruption_max_days: "=trip_interruption_max_days", claim_assessment_days: "=claim_assessment_days", settlement_days: "=settlement_days", payout_method: "=payout_method"}
        Collective Total Protection Concierge: {covered_perils: "=covered_perils", excluded_perils: "=excluded_perils", medical_benefit_pct: "=medical_benefit_pct", job_loss_benefit_pct: "=job_loss_benefit_pct", relocation_benefit_pct: "=relocation_benefit_pct", closure_benefit_pct: "=closure_benefit_pct", excess_usd: "=excess_usd", per_claim_cap_usd: "=per_claim_cap_usd", season_benefit_cap_usd: "=season_benefit_cap_usd", claims_per_season: "=claims_per_season", injury_threshold_days: "=injury_threshold_days", mountain_closure_threshold_days: "=mountain_closure_threshold_days", trip_interruption_daily_usd: "=trip_interruption_daily_usd", trip_interruption_max_days: "=trip_interruption_max_days", claim_assessment_days: "=claim_assessment_days", settlement_days: "=settlement_days", payout_method: "=payout_method"}
    formula:
      when_not: "claim_decision == 'refused'"
      benefit_pct: "medical_benefit_pct if claim_reason in ['medical_injury', 'medical_illness'] else (job_loss_benefit_pct if claim_reason == 'job_loss' else (relocation_benefit_pct if claim_reason == 'relocation' else closure_benefit_pct))"
      amount_usd: "max(0, min(per_claim_cap_usd, round(covered_value_usd * benefit_pct / 100 - excess_usd, 2)))"
    measures: [insure_msr_claims_paid_this_season]

  - id: insure_lapse_and_reinstatement
    subject: [insure_lapse, insure_reinstate, insure_fee_charge]
    rule: >
      Cover stops where an instalment of premium goes unpaid past the plan's grace period, counted from the
      day the instalment was presented and refused. Cover that has stopped pays nothing at all, and a loss
      arising while cover was stopped is never paid even where the premium is settled afterwards. Where the
      plan allows reinstatement, cover may be put back in force within the plan's reinstatement window on
      settlement of everything unpaid and payment of the plan's reinstatement fee; a plan that does not
      allow reinstatement is written afresh instead, with a fresh waiting period. Cover put back in force
      runs from the date of reinstatement and does not reach back over the days it was stopped. A plan fee
      is raised only while the plan record stands in the quoted, active, claim_open, claim_settled, lapsed
      or cancelled state. A plan that is not reinstated inside its window ends and the record is closed off
      at the end of the season.
    eligibility:
      - id: plan_fee_state
        applies_to: [insure_fee_charge]
        kind: state
        condition: "A plan fee is raised only while the plan record stands in the quoted, active, claim_open, claim_settled, lapsed or cancelled state."
        evidence_fields: [insure_holdings.protection_plan_id, insure_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [insure_holdings.protection_plan_id]
          action_bindings:
            insure_holdings.protection_plan_id: protection_plan_id
        state_contract:
          field: insure_holdings.status
          allowed: [quoted, active, claim_open, claim_settled, lapsed, cancelled]
    params:
      per_tier:
        Season Pass Protection Basic: {premium_grace_days: "=premium_grace_days", reinstatement_allowed: "=reinstatement_allowed", reinstatement_fee_usd: "=reinstatement_fee_usd", reinstatement_window_days: "=reinstatement_window_days", waiting_period_days: "=waiting_period_days"}
        Season Pass Protection Plus: {premium_grace_days: "=premium_grace_days", reinstatement_allowed: "=reinstatement_allowed", reinstatement_fee_usd: "=reinstatement_fee_usd", reinstatement_window_days: "=reinstatement_window_days", waiting_period_days: "=waiting_period_days"}
        Season Pass Protection Premier: {premium_grace_days: "=premium_grace_days", reinstatement_allowed: "=reinstatement_allowed", reinstatement_fee_usd: "=reinstatement_fee_usd", reinstatement_window_days: "=reinstatement_window_days", waiting_period_days: "=waiting_period_days"}
        Collective Trip Protection Standard: {premium_grace_days: "=premium_grace_days", reinstatement_allowed: "=reinstatement_allowed", reinstatement_fee_usd: "=reinstatement_fee_usd", reinstatement_window_days: "=reinstatement_window_days", waiting_period_days: "=waiting_period_days"}
        Collective Trip Protection Elite: {premium_grace_days: "=premium_grace_days", reinstatement_allowed: "=reinstatement_allowed", reinstatement_fee_usd: "=reinstatement_fee_usd", reinstatement_window_days: "=reinstatement_window_days", waiting_period_days: "=waiting_period_days"}
        Collective Total Protection Concierge: {premium_grace_days: "=premium_grace_days", reinstatement_allowed: "=reinstatement_allowed", reinstatement_fee_usd: "=reinstatement_fee_usd", reinstatement_window_days: "=reinstatement_window_days", waiting_period_days: "=waiting_period_days"}

  - id: insure_cancellation
    subject: [insure_cancel]
    rule: >
      A household may give a plan up at any time. The premium comes back in full only where the plan is
      given up no later than the free look period counted in calendar days from the day the plan was taken.
      Calendar days are counted forward from the anchor date, the anchor date itself counting as day zero,
      every day of the week counting alike, and a calendar day is never mixed with a full 24-hour period;
      where the resulting boundary falls on a date that does not exist in the target month, the last day of
      that month is used. After the free look period the plan's cancellation basis decides what comes back:
      on the pro rata basis the premium is returned for the days of cover still to come, worked out over the
      days between the date cover began and the date it was due to end; on the no refund basis nothing comes
      back at all. The plan's cancellation fee is retained from whatever comes back. A plan on which a claim
      has already been paid is never refunded any premium, whatever its basis, because the cover has already
      answered for itself. Cover ends on the day the cancellation is recorded and not on the day the
      household says they stopped wanting it.
    eligibility:
      - id: within_free_look
        applies_to: [insure_cancel]
        kind: time
        condition: "The premium comes back in full only where the plan is given up no later than the free look period counted in calendar days from the day the plan was taken."
        evidence_fields: [insure_holdings.protection_plan_id, insure_holdings.purchased_date, insure_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [insure_holdings.protection_plan_id]
          action_bindings:
            insure_holdings.protection_plan_id: protection_plan_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the plan was taken"
          anchor_source: insure_holdings.purchased_date
          relation: not_after
          duration_source: variants.free_look_days
          unit: calendar_days
          counting_rule: "Calendar days are counted forward from the anchor date, the anchor date itself counting as day zero, every day of the week counting alike, and a calendar day is never mixed with a full 24-hour period; where the resulting boundary falls on a date that does not exist in the target month, the last day of that month is used."
          boundary: inclusive
    params:
      per_tier:
        Season Pass Protection Basic: {free_look_days: "=free_look_days", cancellation_refund_basis: "=cancellation_refund_basis", cancellation_fee_usd: "=cancellation_fee_usd"}
        Season Pass Protection Plus: {free_look_days: "=free_look_days", cancellation_refund_basis: "=cancellation_refund_basis", cancellation_fee_usd: "=cancellation_fee_usd"}
        Season Pass Protection Premier: {free_look_days: "=free_look_days", cancellation_refund_basis: "=cancellation_refund_basis", cancellation_fee_usd: "=cancellation_fee_usd"}
        Collective Trip Protection Standard: {free_look_days: "=free_look_days", cancellation_refund_basis: "=cancellation_refund_basis", cancellation_fee_usd: "=cancellation_fee_usd"}
        Collective Trip Protection Elite: {free_look_days: "=free_look_days", cancellation_refund_basis: "=cancellation_refund_basis", cancellation_fee_usd: "=cancellation_fee_usd"}
        Collective Total Protection Concierge: {free_look_days: "=free_look_days", cancellation_refund_basis: "=cancellation_refund_basis", cancellation_fee_usd: "=cancellation_fee_usd"}
    measures: [insure_msr_claims_paid_this_season]

  - id: insure_term_end
    subject: [insure_expire, insure_resume, insure_close]
    rule: >
      A plan covers one season and ends with it. On the season's last day cover stops, whether the plan was
      in force, stopped for non-payment or carrying a settled claim, and the record is marked expired. A
      settled claim is closed off by returning the plan to force with the benefit reduced by what was paid,
      so a plan with an allowance of more than one claim may be claimed on again in the same season up to
      the benefit left. Expiry does not cancel what is still owed: premium instalments still to fall are
      presented after expiry exactly as before. A plan record is closed only when no premium is left to
      collect and no allowed claim is left to pay. Closing is the last write on the record and nothing is
      added to it afterwards; a household who wants cover for the next season takes a fresh plan over the
      holding they open for that season.
    eligibility:
      - id: plan_fully_settled
        applies_to: [insure_close]
        kind: authorization
        condition: "A plan record is closed only when no premium is left to collect and no allowed claim is left to pay."
        evidence_fields: [insure_holdings.protection_plan_id, insure_holdings.premium_balance_usd, insure_holdings.claim_decision]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [insure_holdings.protection_plan_id]
          action_bindings:
            insure_holdings.protection_plan_id: protection_plan_id
    params:
      per_tier:
        Season Pass Protection Basic: {season_end_date: "=season_end_date", claims_per_season: "=claims_per_season", season_benefit_cap_usd: "=season_benefit_cap_usd", settlement_days: "=settlement_days"}
        Season Pass Protection Plus: {season_end_date: "=season_end_date", claims_per_season: "=claims_per_season", season_benefit_cap_usd: "=season_benefit_cap_usd", settlement_days: "=settlement_days"}
        Season Pass Protection Premier: {season_end_date: "=season_end_date", claims_per_season: "=claims_per_season", season_benefit_cap_usd: "=season_benefit_cap_usd", settlement_days: "=settlement_days"}
        Collective Trip Protection Standard: {season_end_date: "=season_end_date", claims_per_season: "=claims_per_season", season_benefit_cap_usd: "=season_benefit_cap_usd", settlement_days: "=settlement_days"}
        Collective Trip Protection Elite: {season_end_date: "=season_end_date", claims_per_season: "=claims_per_season", season_benefit_cap_usd: "=season_benefit_cap_usd", settlement_days: "=settlement_days"}
        Collective Total Protection Concierge: {season_end_date: "=season_end_date", claims_per_season: "=claims_per_season", season_benefit_cap_usd: "=season_benefit_cap_usd", settlement_days: "=settlement_days"}

extended_policies:
  - id: insure_ext_amendment_reprice
    base_policy_refs: [insure_eligibility_and_quote, insure_premium_terms]
    overwrite:
      - base_policy: insure_eligibility_and_quote
        superseded_clause: >-
          Where the plan allows it, the holding covered or the person a payout would be made to may be changed against the
          plan's amendment fee, and a change to a holding of a higher value reprices the premium from the date of the change
          rather than from the start of cover.
        replaced_by: >-
          The repriced premium is the premium frozen on the plan plus the difference that so falls due, rounded to the cent
          at the end and at no earlier step.
      - base_policy: insure_premium_terms
        superseded_clause: >-
          A plan priced on the value covered charges its rate of the covered value, then is brought up to the plan's smallest
          premium where it falls below and down to its largest where it rises above; the bounds are applied after the rate,
          never before.
        replaced_by: >-
          The premium at the new value is the plan's rate of the price the covered holding's record shows, brought up to the
          plan's smallest premium where it falls below it and down to the plan's largest premium where it rises above it, and
          rounded to the cent; the bounds are applied after the rate and never before.
    trigger: state_due
    subject: [insure_amend]
    computes: repriced_premium_usd
    target_tool: confirm_plan_value_amendment_50d33fe4
    params:
      arrears_rate_loading_pct: 1.00
      claim_free_rate_relief_pct: 0.75
      junior_age_step_pct: -6.00
      senior_age_step_pct: 4.00
      two_pass_step_pct: -3.00
      three_pass_step_pct: -5.00
      renewal_step_pct: -4.00
      carried_forward_step_pct: -2.50
    rule: >
      The premium on a plan whose covered value is brought onto the price the covered holding's own record shows is worked
      out afresh and replaces the premium frozen on the plan. The price the covered holding's record shows stands as the new
      covered value only where it falls between the plan's smallest and largest covered values; where it falls outside them
      the value the plan already covers stands and the premium is worked out on that instead. The premium at the new value is
      the plan's rate of the price the covered holding's record shows, brought up to the plan's smallest premium where it falls below it and down to the
      plan's largest premium where it rises above it, and rounded to the cent; the bounds are applied after the rate and
      never before. The rate that premium is worked out at is loaded by the arrears loading this rule sets where the covered
      holding's account carries an instalment the payment method refused in the season and the plan does not stand out of
      force for non-payment; it is relieved by the claim-free relief this rule sets where that account carries no refused
      instalment in the season and no payout stands on the plan for the season; and it is the plan's own rate in every other
      case. Three adjustments are then settled, each of them a percentage of the bounded premium. The age adjustment is the
      junior step this rule sets where the covered holding is priced in a child, youth or teen age band, the senior step
      where it is priced in a senior or super-senior age band, and nothing in every other case. The household adjustment is
      the three-pass step this rule sets where the household's own pass accounts carry the opening price entry of three or more season
      passes for the season, the two-pass step where they carry it for two, and nothing in every other case. The standing adjustment is the
      renewal step this rule sets where the covered holding's record shows it renewed from a previous season, the
      carry-forward step where its record shows it carried forward from a previous season, and nothing in every other case.
      The three adjustments are added together into one total percentage and the bounded premium is adjusted once by that
      total, the result rounded to the cent; they never act successively, and the total acts on the bounded premium and never
      on the premium frozen on the plan. The day the change takes effect from is the day the covered holding's account raised
      its entry for a move up of tier in the season where such an entry stands and the plan does not stand out of force for
      non-payment; where no such entry stands and the plan does not stand out of force for non-payment it is the day the
      change is recorded on the plan; and in every other case it is the day cover began. The whole difference between the
      premium at the new value and the premium frozen on the plan falls due at once. Where the covered holding's account
      carries an entry for a move up of tier in the season and the plan's premium is collected alongside that holding's
      instalments, that difference is instead spread over the days of cover still to come, counted from the day the change
      takes effect to the day cover is due to end, as a share of the days from the day cover began to the day cover is due to
      end; where that account carries no such entry and the plan's premium is collected alongside that holding's instalments,
      the difference is instead spread evenly over the instalments still to fall on that holding's schedule, as a share of
      all the instalments that schedule holds; and in every other case the whole difference falls due at once. The repriced
      premium is the premium frozen on the plan plus the difference that so falls due, rounded to the cent at the end and at
      no earlier step.
    prerequisite: []
    cross_category:
      - category: passes
        as: history
        reads: [passes_ledger.event_type, passes_ledger.charge_category, passes_ledger.event_date, passes_holdings.price_paid_usd, passes_holdings.age_band, passes_holdings.renewal_source, installment_count]
        note: "The rate loading, the age adjustment, the household adjustment, the standing adjustment and the day the change takes effect are all decided from the household's own pass records and pass account entries."
    compute:
      - refused_instalments: "XCOUNT('passes', 'passes_ledger', event_type='passes_installment_decline', season_code=F('season_code'), pass_id=F('covered_holding_id'))"
      - season_payouts: "COUNT('insure_ledger', event_type='insure_claim_payment')"
      - rate_applied_pct: "(P('premium_rate_pct') + K('arrears_rate_loading_pct')) if (refused_instalments >= 1 and F('status') != 'lapsed') else ((P('premium_rate_pct') - K('claim_free_rate_relief_pct')) if (refused_instalments == 0 and season_payouts == 0) else P('premium_rate_pct'))"
      - holding_price: "CFIELD('passes', 'price_paid_usd', pass_id=F('covered_holding_id'))"
      - new_covered_value: "holding_price if (holding_price >= P('min_covered_value_usd') and holding_price <= P('max_covered_value_usd')) else F('covered_value_usd')"
      - priced_premium: "MN(P('premium_maximum_usd'), MX(P('premium_minimum_usd'), RND(new_covered_value * rate_applied_pct / 100, 2)))"
      - covered_age_band: "CFIELD('passes', 'age_band', pass_id=F('covered_holding_id'))"
      - age_step_pct: "K('junior_age_step_pct') if (covered_age_band == 'child' or covered_age_band == 'youth' or covered_age_band == 'teen') else (K('senior_age_step_pct') if (covered_age_band == 'senior' or covered_age_band == 'super_senior') else 0.0)"
      - household_passes: "XCOUNT('passes', 'passes_ledger', event_type='passes_plan_open', charge_category='pass_price', season_code=F('season_code'))"
      - household_step_pct: "K('three_pass_step_pct') if household_passes >= 3 else (K('two_pass_step_pct') if household_passes == 2 else 0.0)"
      - covered_standing: "CFIELD('passes', 'renewal_source', pass_id=F('covered_holding_id'))"
      - standing_step_pct: "K('renewal_step_pct') if covered_standing == 'renewal' else (K('carried_forward_step_pct') if covered_standing == 'carried_forward' else 0.0)"
      - adjusted_premium: "RND(priced_premium * (100 + age_step_pct + household_step_pct + standing_step_pct) / 100, 2)"
      - upgrade_entry_date: "XLATEST('passes', 'passes_ledger', 'event_date', event_type='passes_upgrade_charge', season_code=F('season_code'), pass_id=F('covered_holding_id'))"
      - change_effective_date: "upgrade_entry_date if (upgrade_entry_date != None and F('status') != 'lapsed') else (NOW if F('status') != 'lapsed' else F('effective_date'))"
      - term_days: "DAYS(F('effective_date'), F('expiry_date'))"
      - schedule_instalments: "CPARAM('passes', 'installment_count', pass_id=F('covered_holding_id'))"
      - instalments_charged: "XCOUNT('passes', 'passes_ledger', event_type='passes_installment_charge', season_code=F('season_code'), pass_id=F('covered_holding_id'))"
      - spread_share: "MX(0.0, DAYS(change_effective_date, F('expiry_date'))) / term_days if (upgrade_entry_date != None and P('premium_payment_schedule') == 'with_holding_instalments') else (MX(0.0, schedule_instalments - instalments_charged) / schedule_instalments if (upgrade_entry_date == None and P('premium_payment_schedule') == 'with_holding_instalments') else 1.0)"
      - premium_difference: "adjusted_premium - F('premium_usd')"
      - result: "RND(F('premium_usd') + premium_difference * spread_share, 2)"
    compute_basis:
      refused_instalments: "The rate that premium is worked out at is loaded by the arrears loading this rule sets where the covered holding's account carries an instalment the payment method refused in the season and the plan does not stand out of force for non-payment"
      season_payouts: "it is relieved by the claim-free relief this rule sets where that account carries no refused instalment in the season and no payout stands on the plan for the season"
      rate_applied_pct: "The rate that premium is worked out at is loaded by the arrears loading this rule sets where the covered holding's account carries an instalment the payment method refused in the season and the plan does not stand out of force for non-payment; it is relieved by the claim-free relief this rule sets where that account carries no refused instalment in the season and no payout stands on the plan for the season; and it is the plan's own rate in every other case."
      holding_price: "The premium at the new value is the plan's rate of the price the covered holding's record shows"
      new_covered_value: "The price the covered holding's record shows stands as the new covered value only where it falls between the plan's smallest and largest covered values; where it falls outside them the value the plan already covers stands and the premium is worked out on that instead."
      priced_premium: "The premium at the new value is the plan's rate of the price the covered holding's record shows, brought up to the plan's smallest premium where it falls below it and down to the plan's largest premium where it rises above it, and rounded to the cent; the bounds are applied after the rate and never before."
      covered_age_band: "The age adjustment is the junior step this rule sets where the covered holding is priced in a child, youth or teen age band, the senior step where it is priced in a senior or super-senior age band, and nothing in every other case."
      age_step_pct: "The age adjustment is the junior step this rule sets where the covered holding is priced in a child, youth or teen age band, the senior step where it is priced in a senior or super-senior age band, and nothing in every other case."
      household_passes: "The household adjustment is the three-pass step this rule sets where the household's own pass accounts carry the opening price entry of three or more season passes for the season, the two-pass step where they carry it for two, and nothing in every other case."
      household_step_pct: "The household adjustment is the three-pass step this rule sets where the household's own pass accounts carry the opening price entry of three or more season passes for the season, the two-pass step where they carry it for two, and nothing in every other case."
      covered_standing: "The standing adjustment is the renewal step this rule sets where the covered holding's record shows it renewed from a previous season, the carry-forward step where its record shows it carried forward from a previous season, and nothing in every other case."
      standing_step_pct: "The standing adjustment is the renewal step this rule sets where the covered holding's record shows it renewed from a previous season, the carry-forward step where its record shows it carried forward from a previous season, and nothing in every other case."
      adjusted_premium: "The three adjustments are added together into one total percentage and the bounded premium is adjusted once by that total, the result rounded to the cent; they never act successively, and the total acts on the bounded premium and never on the premium frozen on the plan."
      upgrade_entry_date: "The day the change takes effect from is the day the covered holding's account raised its entry for a move up of tier in the season where such an entry stands and the plan does not stand out of force for non-payment"
      change_effective_date: "The day the change takes effect from is the day the covered holding's account raised its entry for a move up of tier in the season where such an entry stands and the plan does not stand out of force for non-payment; where no such entry stands and the plan does not stand out of force for non-payment it is the day the change is recorded on the plan; and in every other case it is the day cover began."
      term_days: "as a share of the days from the day cover began to the day cover is due to end"
      schedule_instalments: "the difference is instead spread evenly over the instalments still to fall on that holding's schedule, as a share of all the instalments that schedule holds"
      instalments_charged: "the difference is instead spread evenly over the instalments still to fall on that holding's schedule, as a share of all the instalments that schedule holds"
      spread_share: "Where the covered holding's account carries an entry for a move up of tier in the season and the plan's premium is collected alongside that holding's instalments, that difference is instead spread over the days of cover still to come, counted from the day the change takes effect to the day cover is due to end, as a share of the days from the day cover began to the day cover is due to end; where that account carries no such entry and the plan's premium is collected alongside that holding's instalments, the difference is instead spread evenly over the instalments still to fall on that holding's schedule, as a share of all the instalments that schedule holds; and in every other case the whole difference falls due at once."
      result: "The repriced premium is the premium frozen on the plan plus the difference that so falls due, rounded to the cent at the end and at no earlier step."
    factors:
      - id: rate_standing
        effect: parameter
        decides: rate_applied_pct
        bindings: [refused_instalments, season_payouts, rate_applied_pct]
        ladder:
          - when: "the covered holding's account carries an instalment the payment method refused in the season and the plan does not stand out of force for non-payment"
            value: "P('premium_rate_pct') + K('arrears_rate_loading_pct')"
          - when: "the covered holding's account carries no refused instalment in the season and no payout stands on the plan for the season"
            value: "P('premium_rate_pct') - K('claim_free_rate_relief_pct')"
          - when: "otherwise"
            value: "P('premium_rate_pct')"
        baseline:
          rate_applied_pct: "P('premium_rate_pct')"
        evidence: [cross_category, history]
        cross_difficulty: passes
      - id: age_adjustment
        effect: parameter
        decides: age_step_pct
        bindings: [covered_age_band, age_step_pct]
        ladder:
          - when: "the covered holding is priced in a child, youth or teen age band"
            value: "K('junior_age_step_pct')"
          - when: "the covered holding is priced in a senior or super-senior age band"
            value: "K('senior_age_step_pct')"
          - when: "otherwise"
            value: "0.0"
        baseline:
          age_step_pct: "0.0"
        evidence: [cross_category]
        cross_difficulty: passes
      - id: household_adjustment
        effect: parameter
        decides: household_step_pct
        bindings: [household_passes, household_step_pct]
        ladder:
          - when: "the household's own pass accounts carry the opening price entry of three or more season passes for the season"
            value: "K('three_pass_step_pct')"
          - when: "the household's own pass accounts carry the opening price entry of two season passes for the season"
            value: "K('two_pass_step_pct')"
          - when: "otherwise"
            value: "0.0"
        baseline:
          household_step_pct: "0.0"
        evidence: [cross_category, history]
        cross_difficulty: passes
      - id: standing_adjustment
        effect: parameter
        decides: standing_step_pct
        bindings: [covered_standing, standing_step_pct]
        ladder:
          - when: "the covered holding's record shows it renewed from a previous season"
            value: "K('renewal_step_pct')"
          - when: "the covered holding's record shows it carried forward from a previous season"
            value: "K('carried_forward_step_pct')"
          - when: "otherwise"
            value: "0.0"
        baseline:
          standing_step_pct: "0.0"
        evidence: [cross_category]
        cross_difficulty: passes
      - id: change_anchor
        effect: method
        decides: change_effective_date
        bindings: [upgrade_entry_date, change_effective_date]
        ladder:
          - when: "an entry for a move up of tier stands on the covered holding's account for the season and the plan does not stand out of force for non-payment"
            method: "the change takes effect from the day that entry was raised on the covered holding's account"
          - when: "no entry for a move up of tier stands on the covered holding's account for the season and the plan does not stand out of force for non-payment"
            method: "the change takes effect from the day it is recorded on the plan"
          - when: "otherwise"
            method: "the change takes effect from the day cover began"
        baseline:
          change_effective_date: "F('effective_date')"
        evidence: [cross_category, date]
        cross_difficulty: passes
      - id: difference_spread
        effect: method
        decides: spread_share
        bindings: [term_days, schedule_instalments, instalments_charged, spread_share]
        ladder:
          - when: "an entry for a move up of tier stands on the covered holding's account for the season and the plan's premium is collected alongside that holding's instalments"
            method: "the difference is spread over the days of cover still to come, counted from the day the change takes effect to the day cover is due to end, as a share of the days from the day cover began to the day cover is due to end"
          - when: "no entry for a move up of tier stands on the covered holding's account for the season and the plan's premium is collected alongside that holding's instalments"
            method: "the difference is spread evenly over the instalments still to fall on the covered holding's schedule, as a share of all the instalments that schedule holds"
          - when: "otherwise"
            method: "the whole difference falls due at once"
        baseline:
          spread_share: "1.0"
        evidence: [cross_category, date, tier_param]
        cross_difficulty: passes
    baseline:
      rule: >-
        The premium on a plan whose covered value is brought onto the price the covered holding's own record shows is worked
        out afresh and replaces the premium frozen on the plan. The price the covered holding's record shows stands as the new
        covered value only where it falls between the plan's smallest and largest covered values; where it falls outside them
        the value the plan already covers stands and the premium is worked out on that instead. The premium at the new value
        is the plan's rate of the price
        the covered holding's record shows, brought up to the plan's smallest premium where it falls below it and down to the
        plan's largest premium where it rises above it, and rounded to the cent; the bounds are applied after the rate and
        never before. The whole difference between the premium at the new value and the premium frozen on the plan falls due
        at once. The repriced premium is the premium frozen on the plan plus the difference that so falls due, rounded to the
        cent at the end and at no earlier step.
      params: [premium_rate_pct, premium_minimum_usd, premium_maximum_usd, min_covered_value_usd, max_covered_value_usd]
    inputs:
      history:
        - {category: passes, table: passes_ledger, aggregate: count, field: event_type, within_months: null, filters: {event_type: passes_installment_decline}}
        - {category: passes, table: passes_ledger, aggregate: count, field: event_type, within_months: null, filters: {event_type: passes_plan_open, charge_category: pass_price}}
        - {category: passes, table: passes_ledger, aggregate: count, field: event_type, within_months: null, filters: {event_type: passes_installment_charge}}
        - {category: passes, table: passes_ledger, aggregate: latest, field: event_date, within_months: null, filters: {event_type: passes_upgrade_charge}}
        - {table: insure_ledger, aggregate: count, field: event_type, within_months: null, filters: {event_type: insure_claim_payment}}
      cross_category: [passes]

  - id: insure_ext_claim_settlement
    base_policy_refs: [insure_claim_assessment, insure_claim_intake, insure_cover_start]
    overwrite:
      - base_policy: insure_claim_assessment
        superseded_clause: >-
          The amount allowed is the plan's benefit share for the event claimed on, taken of the covered value, less the plan's
          excess, and then brought down to the plan's per-claim cap; it is never below zero and never more than the benefit
          left on the plan.
        replaced_by: >-
          What a claim pays is the plan's share for the event claimed on, taken of the value at risk on the covered holding,
          less the plan's excess and less whatever is set against it, and it is never below zero.
    trigger: on_request
    subject: [insure_claim_payment]
    computes: payout_amount_usd
    target_tool: settle_protection_claim_ed51c2df
    params: {}
    rule: >
      What a claim pays is the plan's share for the event claimed on, taken of the value at risk on the covered holding, less
      the plan's excess and less whatever is set against it, and it is never below zero. What a claim pays is worked out only
      after the value the plan carries as covered stands at the price the covered holding's own record shows, since what is
      paid is measured against the value the plan covers. The share taken is the plan's medical share. It is instead the
      plan's share for loss of employment where a letter from the former employer stands accepted on the claim and the claim
      is made on loss of employment; it is instead the plan's share for a permanent move where proof of a permanent move
      stands accepted on the claim and the claim is made on a permanent move; and it is the plan's medical share in every
      other case. The value at risk on the covered holding is the value the plan covers, taken whole. Where the covered
      holding's account carries scans in the season and cover began on or before the day the season opened, the value at risk
      is instead the value the plan covers in proportion to the days of the season still to come, counted from the day the
      claim is measured from to the day cover is due to end, over the days the value is spread across, and never more than
      the value the plan covers; where that account
      carries scans in the season and cover began after the day the season opened, the value at risk is instead the value the
      plan covers less the day-use deduction the covered holding's own tier sets for each day it has been scanned in the
      season, and never below zero; and where that account carries no scan in the season the value the plan covers is taken
      whole. The day the claim is measured from is the day the last of the papers accepted on the claim reached the
      collective where a paper accepted on the claim reached it after the day the claim was made; it is the day the claim was
      made where every paper accepted on the claim reached the collective on or before that day; and it is the day cover
      began where no paper stands accepted on the claim at all. The days the value is spread across are the days from the first day
      of the season the plan covers to its last day where cover began on or before the day the season opened and the plan's
      waiting period ended after cover began; they are the days from the day cover began to the day cover is due to end where
      cover began after the day the season opened; and they are the days from the day the plan's waiting period ended to the
      day cover is due to end in every other case. Nothing is set against what a claim pays. Where the covered holding's account carries resort credit issued
      in the season for the pass being given up, the whole of that credit is instead set against what the claim pays; where
      no such credit stands on that account and it carries resort credit issued in the season in recovery of service, the
      whole of that credit is instead set against what the claim pays; and where that account carries neither, nothing is set
      against on that ground. Where the covered holding's account carries an instalment the payment method refused in the
      season, the amount so refused is also set against what the claim pays; where no instalment was refused in the season
      and the covered holding's account still carries a balance to be collected, that balance is also set against what the
      claim pays; and where neither stands, nothing is set against on that ground. The share is taken of the value at risk
      first, the plan's excess and everything set against it are taken off that product afterwards, and the two deductions
      never act on the share itself. What is paid is then brought down to the plan's per-claim cap and held to the cover left
      on the plan, which is the cover loaded onto the plan for the season less every payout already made on it, and the
      result is rounded to the cent. The payout is recorded against the paper it was assessed from, which is the last
      paper accepted on the claim that evidences the peril claimed on — the letter from the former employer on a claim made
      on loss of employment, the proof of a permanent move on a claim made on a permanent move, and the doctor's certificate
      in every other case — and where two such papers were accepted on the same day it is the first of them the record
      holds; where the claim carries no accepted paper of that kind at all, it is the last paper accepted on the claim. Nothing is paid on a claim made on a peril the plan does not cover, the
      events a plan pays out on being the ones its own list of covered perils names. A claim made on a peril the plan names
      as excluded is refused whatever this rule would otherwise work out, and nothing is paid on it, so that an exclusion
      beats a cover wherever a peril stands in both lists.
    prerequisite:
      - problem: insure_ext_amendment_reprice
        kind: value_input
        gate: covered_value
        form: state
        policy_source: >-
          What a claim pays is worked out only after the value the plan carries as covered stands at the price the covered
          holding's own record shows, since what is paid is measured against the value the plan covers.
        condition: >-
          The covered value carried on the protection plan equals the price the covered holding's own record shows for that
          holding.
        resolved_by: confirm_plan_value_amendment_50d33fe4
        effect: >-
          Once the covered value carried on the plan is brought onto the price the covered holding's record shows, the
          covered value binding of this computation takes that price, and every figure the share is taken of moves with it.
    cross_category:
      - category: passes
        as: history
        reads: [passes_ledger.event_type, passes_ledger.credit_reason, passes_ledger.amount_usd, passes_holdings.installment_balance_usd, day_use_deduction_usd]
        note: "The value at risk and both of the amounts set against the payout are decided from the covered pass record, its tier's day-use deduction and its own account entries."
    compute:
      - papers_employer: "COUNT('insure_ledger', event_type='insure_document_receive', document_type='employer_letter', document_status='accepted')"
      - papers_relocation: "COUNT('insure_ledger', event_type='insure_document_receive', document_type='proof_of_relocation', document_status='accepted')"
      - benefit_share_pct: "P('job_loss_benefit_pct') if (papers_employer >= 1 and F('claim_reason') == 'job_loss') else (P('relocation_benefit_pct') if (papers_relocation >= 1 and F('claim_reason') == 'relocation') else P('medical_benefit_pct'))"
      - papers_accepted: "COUNT('insure_ledger', event_type='insure_document_receive', document_status='accepted')"
      - last_paper_date: "LATEST('insure_ledger', 'event_date', event_type='insure_document_receive', document_status='accepted')"
      - claim_anchor_date: "last_paper_date if (papers_accepted >= 1 and DAYS(F('claim_opened_date'), last_paper_date) > 0) else (F('claim_opened_date') if papers_accepted >= 1 else F('effective_date'))"
      - season_days: "DAYS(P('season_start_date'), P('season_end_date'))"
      - claimable_days: "MX(1, DAYS(F('waiting_period_end_date'), F('expiry_date')))"
      - span_days: "season_days if (DAYS(F('effective_date'), P('season_start_date')) >= 0 and DAYS(F('effective_date'), F('waiting_period_end_date')) > 0) else (MX(1, DAYS(F('effective_date'), F('expiry_date'))) if DAYS(P('season_start_date'), F('effective_date')) > 0 else claimable_days)"
      - scan_days: "XCOUNT('passes', 'passes_ledger', event_type='passes_scan', season_code=F('season_code'), pass_id=F('covered_holding_id'))"
      - day_use_deduction: "CPARAM('passes', 'day_use_deduction_usd', pass_id=F('covered_holding_id'))"
      - covered_value: "F('covered_value_usd')"
      - value_at_risk: "MN(covered_value, RND(covered_value * MX(0, DAYS(claim_anchor_date, F('expiry_date'))) / span_days, 2)) if (scan_days >= 1 and DAYS(F('effective_date'), P('season_start_date')) >= 0) else (MX(0.0, RND(covered_value - day_use_deduction * scan_days, 2)) if scan_days >= 1 else covered_value)"
      - cancellation_credit: "XSUM('passes', 'passes_ledger', 'amount_usd', event_type='passes_credit_issue', credit_reason='pass_cancellation', season_code=F('season_code'), pass_id=F('covered_holding_id'))"
      - service_credit: "XSUM('passes', 'passes_ledger', 'amount_usd', event_type='passes_credit_issue', credit_reason='service_recovery', season_code=F('season_code'), pass_id=F('covered_holding_id'))"
      - credit_set_against: "cancellation_credit if cancellation_credit > 0 else (service_credit if service_credit > 0 else 0.0)"
      - refused_instalment_amount: "XSUM('passes', 'passes_ledger', 'amount_usd', event_type='passes_installment_decline', season_code=F('season_code'), pass_id=F('covered_holding_id'))"
      - holding_balance: "CFIELD('passes', 'installment_balance_usd', pass_id=F('covered_holding_id'))"
      - owed_set_against: "refused_instalment_amount if refused_instalment_amount > 0 else (MX(0.0, holding_balance) if holding_balance > 0 else 0.0)"
      - paper_for_peril: "LATEST('insure_ledger', 'insure_event_id', event_type='insure_document_receive', document_status='accepted', document_type='employer_letter') if F('claim_reason') == 'job_loss' else (LATEST('insure_ledger', 'insure_event_id', event_type='insure_document_receive', document_status='accepted', document_type='proof_of_relocation') if F('claim_reason') == 'relocation' else LATEST('insure_ledger', 'insure_event_id', event_type='insure_document_receive', document_status='accepted', document_type='medical_certificate'))"
      - assessed_from_paper: "paper_for_peril if paper_for_peril != None else LATEST('insure_ledger', 'insure_event_id', event_type='insure_document_receive', document_status='accepted')"
      - peril_covered: "1 if F('claim_reason') in P('covered_perils') else 0"
      - excluded_claim: "1 if F('claim_reason') in P('excluded_perils') else 0"
      - benefit_left: "MX(0.0, SUM('insure_ledger', 'amount_usd', event_type='insure_coverage_load') - SUM('insure_ledger', 'amount_usd', event_type='insure_claim_payment'))"
      - gross_allowed: "MX(0.0, RND(benefit_share_pct / 100 * value_at_risk - P('excess_usd') - credit_set_against - owed_set_against, 2))"
      - result: "0.0 if (peril_covered == 0 or excluded_claim == 1) else RND(MN(P('per_claim_cap_usd'), MN(benefit_left, gross_allowed)), 2)"
    compute_basis:
      papers_employer: "It is instead the plan's share for loss of employment where a letter from the former employer stands accepted on the claim and the claim is made on loss of employment"
      papers_relocation: "it is instead the plan's share for a permanent move where proof of a permanent move stands accepted on the claim and the claim is made on a permanent move"
      benefit_share_pct: "The share taken is the plan's medical share. It is instead the plan's share for loss of employment where a letter from the former employer stands accepted on the claim and the claim is made on loss of employment; it is instead the plan's share for a permanent move where proof of a permanent move stands accepted on the claim and the claim is made on a permanent move; and it is the plan's medical share in every other case."
      papers_accepted: "it is the day cover began where no paper stands accepted on the claim at all"
      last_paper_date: "The day the claim is measured from is the day the last of the papers accepted on the claim reached the collective where a paper accepted on the claim reached it after the day the claim was made"
      claim_anchor_date: "The day the claim is measured from is the day the last of the papers accepted on the claim reached the collective where a paper accepted on the claim reached it after the day the claim was made; it is the day the claim was made where every paper accepted on the claim reached the collective on or before that day; and it is the day cover began where no paper stands accepted on the claim at all."
      season_days: "The days the value is spread across are the days from the first day of the season the plan covers to its last day where cover began on or before the day the season opened and the plan's waiting period ended after cover began"
      claimable_days: "they are the days from the day the plan's waiting period ended to the day cover is due to end in every other case"
      span_days: "The days the value is spread across are the days from the first day of the season the plan covers to its last day where cover began on or before the day the season opened and the plan's waiting period ended after cover began; they are the days from the day cover began to the day cover is due to end where cover began after the day the season opened; and they are the days from the day the plan's waiting period ended to the day cover is due to end in every other case."
      scan_days: "Where the covered holding's account carries scans in the season and cover began on or before the day the season opened, the value at risk is instead the value the plan covers in proportion to the days of the season still to come, counted from the day the claim is measured from to the day cover is due to end, over the days the value is spread across, and never more than the value the plan covers"
      day_use_deduction: "the value at risk is instead the value the plan covers less the day-use deduction the covered holding's own tier sets for each day it has been scanned in the season, and never below zero"
      covered_value: "What a claim pays is worked out only after the value the plan carries as covered stands at the price the covered holding's own record shows, since what is paid is measured against the value the plan covers."
      value_at_risk: "The value at risk on the covered holding is the value the plan covers, taken whole. Where the covered holding's account carries scans in the season and cover began on or before the day the season opened, the value at risk is instead the value the plan covers in proportion to the days of the season still to come, counted from the day the claim is measured from to the day cover is due to end, over the days the value is spread across, and never more than the value the plan covers; where that account carries scans in the season and cover began after the day the season opened, the value at risk is instead the value the plan covers less the day-use deduction the covered holding's own tier sets for each day it has been scanned in the season, and never below zero; and where that account carries no scan in the season the value the plan covers is taken whole."
      cancellation_credit: "Where the covered holding's account carries resort credit issued in the season for the pass being given up, the whole of that credit is instead set against what the claim pays"
      service_credit: "where no such credit stands on that account and it carries resort credit issued in the season in recovery of service, the whole of that credit is instead set against what the claim pays"
      credit_set_against: "Nothing is set against what a claim pays. Where the covered holding's account carries resort credit issued in the season for the pass being given up, the whole of that credit is instead set against what the claim pays; where no such credit stands on that account and it carries resort credit issued in the season in recovery of service, the whole of that credit is instead set against what the claim pays; and where that account carries neither, nothing is set against on that ground."
      refused_instalment_amount: "Where the covered holding's account carries an instalment the payment method refused in the season, the amount so refused is also set against what the claim pays"
      holding_balance: "where no instalment was refused in the season and the covered holding's account still carries a balance to be collected, that balance is also set against what the claim pays"
      owed_set_against: "Where the covered holding's account carries an instalment the payment method refused in the season, the amount so refused is also set against what the claim pays; where no instalment was refused in the season and the covered holding's account still carries a balance to be collected, that balance is also set against what the claim pays; and where neither stands, nothing is set against on that ground."
      benefit_left: "What is paid is then brought down to the plan's per-claim cap and held to the cover left on the plan, which is the cover loaded onto the plan for the season less every payout already made on it, and the result is rounded to the cent."
      gross_allowed: "The share is taken of the value at risk first, the plan's excess and everything set against it are taken off that product afterwards, and the two deductions never act on the share itself."
      paper_for_peril: "The payout is recorded against the paper it was assessed from, which is the last paper accepted on the claim that evidences the peril claimed on — the letter from the former employer on a claim made on loss of employment, the proof of a permanent move on a claim made on a permanent move, and the doctor's certificate in every other case — and where two such papers were accepted on the same day it is the first of them the record holds"
      assessed_from_paper: "where the claim carries no accepted paper of that kind at all, it is the last paper accepted on the claim"
      peril_covered: "Nothing is paid on a claim made on a peril the plan does not cover, the events a plan pays out on being the ones its own list of covered perils names."
      excluded_claim: "A claim made on a peril the plan names as excluded is refused whatever this rule would otherwise work out, and nothing is paid on it, so that an exclusion beats a cover wherever a peril stands in both lists."
      result: "What is paid is then brought down to the plan's per-claim cap and held to the cover left on the plan, which is the cover loaded onto the plan for the season less every payout already made on it, and the result is rounded to the cent. Nothing is paid on a claim made on a peril the plan does not cover, the events a plan pays out on being the ones its own list of covered perils names. A claim made on a peril the plan names as excluded is refused whatever this rule would otherwise work out, and nothing is paid on it, so that an exclusion beats a cover wherever a peril stands in both lists."
    factors:
      - id: peril_share
        effect: parameter
        decides: benefit_share_pct
        bindings: [papers_employer, papers_relocation, benefit_share_pct]
        ladder:
          - when: "a letter from the former employer stands accepted on the claim and the claim is made on loss of employment"
            value: "P('job_loss_benefit_pct')"
          - when: "proof of a permanent move stands accepted on the claim and the claim is made on a permanent move"
            value: "P('relocation_benefit_pct')"
          - when: "otherwise"
            value: "P('medical_benefit_pct')"
        baseline:
          benefit_share_pct: "P('medical_benefit_pct')"
        evidence: [history]
        cross_difficulty: null
      - id: measuring_day
        effect: method
        decides: claim_anchor_date
        bindings: [papers_accepted, last_paper_date, claim_anchor_date]
        ladder:
          - when: "a paper accepted on the claim reached the collective after the day the claim was made"
            method: "the claim is measured from the day the last of the papers accepted on it reached the collective"
          - when: "every paper accepted on the claim reached the collective on or before the day the claim was made"
            method: "the claim is measured from the day the claim was made"
          - when: "otherwise"
            method: "the claim is measured from the day cover began"
        baseline:
          claim_anchor_date: "F('effective_date')"
        evidence: [history, date]
        cross_difficulty: null
      - id: spread_span
        effect: method
        decides: span_days
        bindings: [season_days, claimable_days, span_days]
        ladder:
          - when: "cover began on or before the day the season opened and the plan's waiting period ended after cover began"
            method: "the value is spread across the days from the first day of the season the plan covers to its last day"
          - when: "cover began after the day the season opened"
            method: "the value is spread across the days from the day cover began to the day cover is due to end"
          - when: "otherwise"
            method: "the value is spread across the days from the day the plan's waiting period ended to the day cover is due to end"
        baseline:
          span_days: "claimable_days"
        evidence: [date]
        cross_difficulty: null
      - id: value_at_risk_measure
        effect: method
        decides: value_at_risk
        bindings: [scan_days, day_use_deduction, covered_value, value_at_risk]
        ladder:
          - when: "the covered holding's account carries scans in the season and cover began on or before the day the season opened"
            method: "the value the plan covers is taken in proportion to the days of the season still to come, counted from the day the claim is measured from to the day cover is due to end, over the days the value is spread across, and never more than the value the plan covers"
          - when: "the covered holding's account carries scans in the season and cover began after the day the season opened"
            method: "the value the plan covers is reduced by the day-use deduction the covered holding's own tier sets for each day it has been scanned in the season, and never falls below zero"
          - when: "otherwise"
            method: "the value the plan covers is taken whole"
        baseline:
          value_at_risk: "covered_value"
        evidence: [cross_category, date]
        cross_difficulty: passes
      - id: credit_offset
        effect: parameter
        decides: credit_set_against
        bindings: [cancellation_credit, service_credit, credit_set_against]
        ladder:
          - when: "the covered holding's account carries resort credit issued in the season for the pass being given up"
            value: "the whole of the credit issued for the pass being given up"
          - when: "no credit for the pass being given up stands on that account and it carries resort credit issued in the season in recovery of service"
            value: "the whole of the credit issued in recovery of service"
          - when: "otherwise"
            value: "0.0"
        baseline:
          credit_set_against: "0.0"
        evidence: [cross_category, history]
        cross_difficulty: passes
      - id: holding_arrears_offset
        effect: parameter
        decides: owed_set_against
        bindings: [refused_instalment_amount, holding_balance, owed_set_against]
        ladder:
          - when: "the covered holding's account carries an instalment the payment method refused in the season"
            value: "the amount of the instalment so refused"
          - when: "no instalment was refused on that account in the season and the covered holding still carries a balance to be collected"
            value: "the balance still to be collected on the covered holding"
          - when: "otherwise"
            value: "0.0"
        baseline:
          owed_set_against: "0.0"
        evidence: [cross_category, history]
        cross_difficulty: passes
    baseline:
      rule: >-
        What a claim pays is the plan's share for the event claimed on, taken of the value at risk on the covered holding,
        less the plan's excess and less whatever is set against it, and it is never below zero. The share taken is the plan's
        medical share. The value at risk on the covered holding is the value the plan covers, taken whole. Nothing is set
        against what a claim pays. The share is taken of the value at risk first, the plan's excess and everything set
        against it are taken off that product afterwards, and the two deductions never act on the share itself. What is paid
        is then brought down to the plan's per-claim cap and held to the cover left on the plan, which is the cover loaded
        onto the plan for the season less every payout already made on it, and the result is rounded to the cent.
      params: [medical_benefit_pct, excess_usd, per_claim_cap_usd, season_benefit_cap_usd]
    inputs:
      history:
        - {table: insure_ledger, aggregate: count, field: event_type, within_months: null, filters: {event_type: insure_document_receive, document_status: accepted}}
        - {table: insure_ledger, aggregate: latest, field: event_date, within_months: null, filters: {event_type: insure_document_receive, document_status: accepted}}
        - {table: insure_ledger, aggregate: latest, field: insure_event_id, within_months: null, filters: {event_type: insure_document_receive, document_status: accepted}}
        - {table: insure_ledger, aggregate: sum, field: amount_usd, within_months: null, filters: {event_type: insure_coverage_load}}
        - {table: insure_ledger, aggregate: sum, field: amount_usd, within_months: null, filters: {event_type: insure_claim_payment}}
        - {category: passes, table: passes_ledger, aggregate: count, field: event_type, within_months: null, filters: {event_type: passes_scan}}
        - {category: passes, table: passes_ledger, aggregate: sum, field: amount_usd, within_months: null, filters: {event_type: passes_credit_issue}}
        - {category: passes, table: passes_ledger, aggregate: sum, field: amount_usd, within_months: null, filters: {event_type: passes_installment_decline}}
      cross_category: [passes]

  - id: insure_ext_premium_presentation
    base_policy_refs: [insure_premium_terms]
    overwrite:
      - base_policy: insure_premium_terms
        superseded_clause: >-
          a plan collected alongside the covered holding's instalments divides the premium over the instalments still to fall
          on that holding and is presented with them.
        replaced_by: >-
          The premium presented on a plan is one instalment of premium for each presentation that has fallen due on the
          covered holding's schedule and has not yet been raised on the plan, and it is never below zero.
    trigger: state_due
    subject: [insure_premium_charge]
    computes: premium_amount_usd
    target_tool: present_plan_premium_8deb00b0
    params: {}
    rule: >
      The premium presented on a plan is one instalment of premium for each presentation that has fallen due on the covered
      holding's schedule and has not yet been raised on the plan, and it is never below zero. The premium still to be
      collected on a plan is the balance the plan's own record carries. It is instead the premium frozen on the plan less the
      payments matched to premium entries on the protection account where the premium frozen on the plan stands above those
      payments and the balance the plan's record carries stands below the difference between them; it is instead the whole
      premium frozen on the plan where the protection account carries no payment matched to a premium entry; and it is the
      balance the plan's own record carries in every other case. The instalments still to fall on the covered holding's
      schedule are one. They are instead the number of instalments that holding's tier holds less the number its account
      shows charged in the season where its account shows instalments charged in the season and the holding stands active;
      they are instead the whole number its tier holds where its account shows no instalment charged in the season and the
      holding stands active; and they are one in every other case. One instalment of premium is the premium still to be
      collected divided equally over the whole months from the day cover began to the day cover is due to end, rounded to the
      cent. It is instead the premium still to be collected divided equally over the instalments still to fall on the covered
      holding's schedule, rounded to the cent, where the plan's premium is collected alongside that holding's instalments and
      instalments still fall on its schedule; it is instead the whole premium still to be collected where the plan's premium
      is collected in a single payment; and it is the premium still to be collected divided equally over the whole months
      from the day cover began to the day cover is due to end, rounded to the cent, in every other case. One instalment is
      presented. Two or more are presented where the plan's premium is collected alongside the covered holding's instalments
      and that holding's account shows more instalments charged in the season than the protection account shows premium
      entries raised on the plan, one for each of the difference; none is presented where the plan's premium is collected
      alongside that holding's instalments and its account shows fewer instalments charged in the season than the protection
      account shows premium entries raised on the plan; and one instalment is presented in every other case. The amount presented is the amount of one instalment multiplied by
      the number of instalments presented, each instalment having been rounded to the cent before that multiplication and the
      product taken as it stands with no adjustment for what the rounding of a single instalment leaves over. A premium is
      presented only on a plan the collective still collects premium on, and a plan carrying no premium still to be collected
      has nothing presented on it.
    prerequisite: []
    cross_category:
      - category: passes
        as: history
        reads: [passes_ledger.event_type, passes_ledger.event_date, passes_holdings.status, installment_count]
        note: "The number of instalments still to fall and the number of presentations that have fallen due unraised are both counted from the covered holding's own tier and account."
    compute:
      - premium_matched: "SUM('insure_ledger', 'amount_usd', event_type='insure_premium_payment')"
      - premium_raised_count: "COUNT('insure_ledger', event_type='insure_premium_charge')"
      - cached_balance: "F('premium_balance_usd')"
      - collectible: "RND(F('premium_usd') - premium_matched, 2) if (F('premium_usd') > premium_matched and cached_balance < RND(F('premium_usd') - premium_matched, 2)) else (F('premium_usd') if premium_matched == 0 else cached_balance)"
      - holding_state: "CFIELD('passes', 'status', pass_id=F('covered_holding_id'))"
      - schedule_instalments: "CPARAM('passes', 'installment_count', pass_id=F('covered_holding_id'))"
      - holding_charged: "XCOUNT('passes', 'passes_ledger', event_type='passes_installment_charge', season_code=F('season_code'), pass_id=F('covered_holding_id'))"
      - instalments_remaining: "MX(1, schedule_instalments - holding_charged) if (holding_charged >= 1 and holding_state == 'active') else (schedule_instalments if (holding_charged == 0 and holding_state == 'active') else 1)"
      - term_months: "MX(1, MONTHS(F('effective_date'), F('expiry_date')))"
      - instalment_amount: "RND(collectible / instalments_remaining, 2) if (P('premium_payment_schedule') == 'with_holding_instalments' and instalments_remaining >= 1) else (collectible if P('premium_payment_schedule') == 'single_payment' else RND(collectible / term_months, 2))"
      - presented_count: "MX(1, holding_charged - premium_raised_count) if (P('premium_payment_schedule') == 'with_holding_instalments' and holding_charged > premium_raised_count) else (0 if (P('premium_payment_schedule') == 'with_holding_instalments' and holding_charged < premium_raised_count) else 1)"
      - result: "MX(0.0, RND(instalment_amount * presented_count, 2))"
    compute_basis:
      premium_matched: "It is instead the premium frozen on the plan less the payments matched to premium entries on the protection account where the premium frozen on the plan stands above those payments and the balance the plan's record carries stands below the difference between them"
      premium_raised_count: "Two or more are presented where the plan's premium is collected alongside the covered holding's instalments and that holding's account shows more instalments charged in the season than the protection account shows premium entries raised on the plan, one for each of the difference"
      cached_balance: "The premium still to be collected on a plan is the balance the plan's own record carries."
      collectible: "The premium still to be collected on a plan is the balance the plan's own record carries. It is instead the premium frozen on the plan less the payments matched to premium entries on the protection account where the premium frozen on the plan stands above those payments and the balance the plan's record carries stands below the difference between them; it is instead the whole premium frozen on the plan where the protection account carries no payment matched to a premium entry; and it is the balance the plan's own record carries in every other case."
      holding_state: "where its account shows instalments charged in the season and the holding stands active"
      schedule_instalments: "They are instead the number of instalments that holding's tier holds less the number its account shows charged in the season where its account shows instalments charged in the season and the holding stands active"
      holding_charged: "They are instead the number of instalments that holding's tier holds less the number its account shows charged in the season where its account shows instalments charged in the season and the holding stands active"
      instalments_remaining: "The instalments still to fall on the covered holding's schedule are one. They are instead the number of instalments that holding's tier holds less the number its account shows charged in the season where its account shows instalments charged in the season and the holding stands active; they are instead the whole number its tier holds where its account shows no instalment charged in the season and the holding stands active; and they are one in every other case."
      term_months: "One instalment of premium is the premium still to be collected divided equally over the whole months from the day cover began to the day cover is due to end, rounded to the cent."
      instalment_amount: "One instalment of premium is the premium still to be collected divided equally over the whole months from the day cover began to the day cover is due to end, rounded to the cent. It is instead the premium still to be collected divided equally over the instalments still to fall on the covered holding's schedule, rounded to the cent, where the plan's premium is collected alongside that holding's instalments and instalments still fall on its schedule; it is instead the whole premium still to be collected where the plan's premium is collected in a single payment; and it is the premium still to be collected divided equally over the whole months from the day cover began to the day cover is due to end, rounded to the cent, in every other case."
      presented_count: "One instalment is presented. Two or more are presented where the plan's premium is collected alongside the covered holding's instalments and that holding's account shows more instalments charged in the season than the protection account shows premium entries raised on the plan, one for each of the difference; none is presented where the plan's premium is collected alongside that holding's instalments and its account shows fewer instalments charged in the season than the protection account shows premium entries raised on the plan; and one instalment is presented in every other case."
      result: "The amount presented is the amount of one instalment multiplied by the number of instalments presented, each instalment having been rounded to the cent before that multiplication and the product taken as it stands with no adjustment for what the rounding of a single instalment leaves over."
    factors:
      - id: collectible_basis
        effect: parameter
        decides: collectible
        bindings: [premium_matched, cached_balance, collectible]
        ladder:
          - when: "the premium frozen on the plan stands above the payments matched to premium entries on the protection account and the balance the plan's record carries stands below the difference between them"
            value: "the premium frozen on the plan less the payments matched to premium entries"
          - when: "the protection account carries no payment matched to a premium entry"
            value: "the whole premium frozen on the plan"
          - when: "otherwise"
            value: "the balance the plan's own record carries"
        baseline:
          collectible: "cached_balance"
        evidence: [history]
        cross_difficulty: null
      - id: schedule_remaining
        effect: parameter
        decides: instalments_remaining
        bindings: [holding_state, schedule_instalments, holding_charged, instalments_remaining]
        ladder:
          - when: "the covered holding's account shows instalments charged in the season and the holding stands active"
            value: "the number of instalments the holding's tier holds less the number its account shows charged in the season"
          - when: "the covered holding's account shows no instalment charged in the season and the holding stands active"
            value: "the whole number of instalments the holding's tier holds"
          - when: "otherwise"
            value: "1"
        baseline:
          instalments_remaining: "1"
        evidence: [cross_category, history]
        cross_difficulty: passes
      - id: instalment_measure
        effect: method
        decides: instalment_amount
        bindings: [term_months, instalment_amount]
        ladder:
          - when: "the plan's premium is collected alongside the covered holding's instalments and instalments still fall on its schedule"
            method: "one instalment is the premium still to be collected divided equally over the instalments still to fall on that schedule, rounded to the cent"
          - when: "the plan's premium is collected in a single payment"
            method: "one instalment is the whole premium still to be collected"
          - when: "otherwise"
            method: "one instalment is the premium still to be collected divided equally over the whole months from the day cover began to the day cover is due to end, rounded to the cent"
        baseline:
          instalment_amount: "RND(collectible / term_months, 2)"
        evidence: [date, tier_param]
        cross_difficulty: null
      - id: presentations_due
        effect: parameter
        decides: presented_count
        bindings: [premium_raised_count, presented_count]
        ladder:
          - when: "the plan's premium is collected alongside the covered holding's instalments and that holding's account shows more instalments charged in the season than the protection account shows premium entries raised on the plan"
            value: "one instalment for each of the difference"
          - when: "the plan's premium is collected alongside the covered holding's instalments and that holding's account shows fewer instalments charged in the season than the protection account shows premium entries raised on the plan"
            value: "0"
          - when: "otherwise"
            value: "1"
        baseline:
          presented_count: "1"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The premium presented on a plan is one instalment of premium for each presentation that has fallen due on the covered
        holding's schedule and has not yet been raised on the plan, and it is never below zero. The premium still to be
        collected on a plan is the balance the plan's own record carries. The instalments still to fall on the covered
        holding's schedule are one. One instalment of premium is the premium still to be collected divided equally over the
        whole months from the day cover began to the day cover is due to end, rounded to the cent. One instalment is
        presented. The amount presented is the amount of one instalment multiplied by the number of instalments presented,
        each instalment having been rounded to the cent before that multiplication and the product taken as it stands with no
        adjustment for what the rounding of a single instalment leaves over.
      params: [premium_payment_schedule]
    inputs:
      history:
        - {table: insure_ledger, aggregate: sum, field: amount_usd, within_months: null, filters: {event_type: insure_premium_payment}}
        - {table: insure_ledger, aggregate: count, field: event_type, within_months: null, filters: {event_type: insure_premium_charge}}
        - {category: passes, table: passes_ledger, aggregate: count, field: event_type, within_months: null, filters: {event_type: passes_installment_charge}}
      cross_category: [passes]

  - id: insure_ext_giveup_charge
    base_policy_refs: [insure_lapse_and_reinstatement, insure_cancellation]
    overwrite:
      - base_policy: insure_cancellation
        superseded_clause: >-
          The plan's cancellation fee is retained from whatever comes back.
        replaced_by: >-
          The charge raised on a plan for being given up is the plan's cancellation fee, and it is never below zero.
    trigger: on_request
    subject: [insure_fee_charge]
    computes: fee_amount_usd
    target_tool: raise_plan_giveup_charge_59dbe3e5
    params:
      minimum_earned_share_pct: 10.00
      holding_relief_share_pct: 25.00
    rule: >
      The charge raised on a plan for being given up is the plan's cancellation fee, and it is never below zero. The part of
      the fee the charge stands at is the whole of it. It is instead nothing where the plan is given up no later than its
      free look period counted in calendar days from the day the plan was taken, the anchor day counting as day zero; it is
      instead half of it where more than half of the term has run; and it is the whole of it in every other case. The term is
      counted from the day cover began where the plan's record carries a day cover began and the plan's premium is collected
      alongside the covered holding's instalments; it is counted from the day the covered holding was given up where that
      holding's record shows it given up in the season; and it is counted from the day the last premium entry was raised on
      the plan in every other case. The part of the term that has run is measured against the days from the day cover began
      to the day cover is due to end. The collective keeps a least amount on a plan given up, which is nothing. It is instead
      the minimum earned share this rule sets of the premium frozen on the plan where the plan is priced on the value
      covered, the plan is given up after its free look period has run out and cover has run past the plan's waiting period;
      it is instead half that share of the premium frozen on the plan where the plan is priced on the value covered, the plan
      is given up after its free look period has run out and cover has not run past the plan's waiting period; and it is
      nothing in every other case, a plan given up inside its free look period included, so that nothing at all is charged on
      a plan given up inside that period. The charge is the greater of the part of the fee the charge stands at and the least amount the
      collective keeps, and the greater of the two is taken before anything is allowed against it. An allowance is then made
      against the charge, which is nothing. It is instead the whole of the plan's cancellation fee where the covered
      holding's record shows it given up in the season; it is instead the relief share this rule sets of the plan's
      cancellation fee where the protection account carries a payment matched to a premium entry and the covered holding
      stands active; and it is nothing in every other case. The allowance is taken off the greater of the two amounts above and never off the
      plan's cancellation fee before that comparison, and the result is rounded to the cent and never falls below zero.
    prerequisite: []
    cross_category:
      - category: passes
        as: branch
        reads: [passes_holdings.status, passes_holdings.closed_date]
        note: "The day the term is counted from and the allowance made against the charge both turn on whether the covered holding still stands active or was given up in the season."
    compute:
      - holding_state: "CFIELD('passes', 'status', pass_id=F('covered_holding_id'))"
      - holding_closed_date: "CFIELD('passes', 'closed_date', pass_id=F('covered_holding_id'))"
      - last_premium_date: "LATEST('insure_ledger', 'event_date', event_type='insure_premium_charge')"
      - term_anchor_date: "F('effective_date') if (F('effective_date') != '' and P('premium_payment_schedule') == 'with_holding_instalments') else (holding_closed_date if holding_state == 'cancelled' else last_premium_date)"
      - term_days: "MX(1, DAYS(F('effective_date'), F('expiry_date')))"
      - run_share: "MX(0.0, DAYS(term_anchor_date, NOW)) / term_days"
      - free_look_days_used: "DAYS(F('purchased_date'), NOW)"
      - fee_share: "0.0 if free_look_days_used <= P('free_look_days') else (0.5 if run_share > 0.5 else 1.0)"
      - waiting_days_run: "DAYS(F('waiting_period_end_date'), NOW)"
      - minimum_kept: "RND(F('premium_usd') * K('minimum_earned_share_pct') / 100, 2) if (P('premium_basis') == 'percent_of_covered_value' and free_look_days_used > P('free_look_days') and waiting_days_run > 0) else (RND(F('premium_usd') * K('minimum_earned_share_pct') / 200, 2) if (P('premium_basis') == 'percent_of_covered_value' and free_look_days_used > P('free_look_days')) else 0.0)"
      - premium_payments_made: "COUNT('insure_ledger', event_type='insure_premium_payment')"
      - charge_allowance: "P('cancellation_fee_usd') if holding_state == 'cancelled' else (RND(P('cancellation_fee_usd') * K('holding_relief_share_pct') / 100, 2) if (premium_payments_made >= 1 and holding_state == 'active') else 0.0)"
      - result: "MX(0.0, RND(MX(RND(P('cancellation_fee_usd') * fee_share, 2), minimum_kept) - charge_allowance, 2))"
    compute_basis:
      holding_state: "It is instead the whole of the plan's cancellation fee where the covered holding's record shows it given up in the season"
      holding_closed_date: "it is counted from the day the covered holding was given up where that holding's record shows it given up in the season"
      last_premium_date: "it is counted from the day the last premium entry was raised on the plan in every other case"
      term_anchor_date: "The term is counted from the day cover began where the plan's record carries a day cover began and the plan's premium is collected alongside the covered holding's instalments; it is counted from the day the covered holding was given up where that holding's record shows it given up in the season; and it is counted from the day the last premium entry was raised on the plan in every other case."
      term_days: "The part of the term that has run is measured against the days from the day cover began to the day cover is due to end."
      run_share: "The part of the term that has run is measured against the days from the day cover began to the day cover is due to end."
      free_look_days_used: "It is instead nothing where the plan is given up no later than its free look period counted in calendar days from the day the plan was taken, the anchor day counting as day zero"
      fee_share: "The part of the fee the charge stands at is the whole of it. It is instead nothing where the plan is given up no later than its free look period counted in calendar days from the day the plan was taken, the anchor day counting as day zero; it is instead half of it where more than half of the term has run; and it is the whole of it in every other case."
      waiting_days_run: "It is instead the minimum earned share this rule sets of the premium frozen on the plan where the plan is priced on the value covered, the plan is given up after its free look period has run out and cover has run past the plan's waiting period"
      minimum_kept: "The collective keeps a least amount on a plan given up, which is nothing. It is instead the minimum earned share this rule sets of the premium frozen on the plan where the plan is priced on the value covered, the plan is given up after its free look period has run out and cover has run past the plan's waiting period; it is instead half that share of the premium frozen on the plan where the plan is priced on the value covered, the plan is given up after its free look period has run out and cover has not run past the plan's waiting period; and it is nothing in every other case, a plan given up inside its free look period included, so that nothing at all is charged on a plan given up inside that period."
      premium_payments_made: "it is instead the relief share this rule sets of the plan's cancellation fee where the protection account carries a payment matched to a premium entry and the covered holding stands active"
      charge_allowance: "An allowance is then made against the charge, which is nothing. It is instead the whole of the plan's cancellation fee where the covered holding's record shows it given up in the season; it is instead the relief share this rule sets of the plan's cancellation fee where the protection account carries a payment matched to a premium entry and the covered holding stands active; and it is nothing in every other case."
      result: "The charge is the greater of the part of the fee the charge stands at and the least amount the collective keeps, and the greater of the two is taken before anything is allowed against it. The allowance is taken off the greater of the two amounts above and never off the plan's cancellation fee before that comparison, and the result is rounded to the cent and never falls below zero."
    factors:
      - id: fee_scale
        effect: parameter
        decides: fee_share
        bindings: [free_look_days_used, fee_share]
        ladder:
          - when: "the plan is given up no later than its free look period counted in calendar days from the day the plan was taken"
            value: "0.0"
          - when: "more than half of the term has run"
            value: "0.5"
          - when: "otherwise"
            value: "1.0"
        baseline:
          fee_share: "1.0"
        evidence: [date]
        cross_difficulty: null
      - id: term_anchor
        effect: method
        decides: term_anchor_date
        bindings: [holding_closed_date, last_premium_date, term_anchor_date]
        ladder:
          - when: "the plan's record carries a day cover began and the plan's premium is collected alongside the covered holding's instalments"
            method: "the term is counted from the day cover began"
          - when: "the covered holding's record shows it given up in the season"
            method: "the term is counted from the day the covered holding was given up"
          - when: "otherwise"
            method: "the term is counted from the day the last premium entry was raised on the plan"
        baseline:
          term_anchor_date: "last_premium_date"
        evidence: [cross_category, history, date]
        cross_difficulty: passes
      - id: minimum_earned
        effect: parameter
        decides: minimum_kept
        bindings: [waiting_days_run, minimum_kept]
        ladder:
          - when: "the plan is priced on the value covered, the plan is given up after its free look period has run out and cover has run past the plan's waiting period"
            value: "K('minimum_earned_share_pct') of the premium frozen on the plan"
          - when: "the plan is priced on the value covered, the plan is given up after its free look period has run out and cover has not run past the plan's waiting period"
            value: "half of K('minimum_earned_share_pct') of the premium frozen on the plan"
          - when: "otherwise"
            value: "0.0"
        baseline:
          minimum_kept: "0.0"
        evidence: [date, tier_param]
        cross_difficulty: null
      - id: charge_relief
        effect: parameter
        decides: charge_allowance
        bindings: [holding_state, premium_payments_made, charge_allowance]
        ladder:
          - when: "the covered holding's record shows it given up in the season"
            value: "the whole of the plan's cancellation fee"
          - when: "the protection account carries a payment matched to a premium entry and the covered holding stands active"
            value: "K('holding_relief_share_pct') of the plan's cancellation fee"
          - when: "otherwise"
            value: "0.0"
        baseline:
          charge_allowance: "0.0"
        evidence: [cross_category, history]
        cross_difficulty: passes
    baseline:
      rule: >-
        The charge raised on a plan for being given up is the plan's cancellation fee, and it is never below zero. The part
        of the fee the charge stands at is the whole of it. The part of the term that has run is measured against the days
        from the day cover began to the day cover is due to end. The collective keeps a least amount on a plan given up,
        which is nothing. The charge is the greater of the part of the fee the charge stands at and the least amount the
        collective keeps, and the greater of the two is taken before anything is allowed against it. An allowance is then
        made against the charge, which is nothing. The allowance is taken off the greater of the two amounts above and never
        off the plan's cancellation fee before that comparison, and the result is rounded to the cent and never falls below
        zero.
      params: [cancellation_fee_usd, free_look_days]
    inputs:
      history:
        - {table: insure_ledger, aggregate: latest, field: event_date, within_months: null, filters: {event_type: insure_premium_charge}}
        - {table: insure_ledger, aggregate: count, field: event_type, within_months: null, filters: {event_type: insure_premium_payment}}
      cross_category: [passes]

  - id: insure_ext_giveup_settlement
    base_policy_refs: [insure_cancellation]
    overwrite:
      - base_policy: insure_cancellation
        superseded_clause: >-
          The premium comes back in full only where the plan is given up no later than the free look period counted in
          calendar days from the day the plan was taken.
        replaced_by: >-
          Where the plan is given up no later than its free look period counted in calendar days from the day the plan was
          taken, the anchor day counting as day zero, the whole of the premium collected on the plan answers for what stands
          unpaid instead of any unearned part of it.
      - base_policy: insure_cancellation
        superseded_clause: >-
          After the free look period the plan's cancellation basis decides what comes back: on the pro rata basis the premium
          is returned for the days of cover still to come, worked out over the days between the date cover began and the date
          it was due to end; on the no refund basis nothing comes back at all.
        replaced_by: >-
          The unearned premium on a plan given up is the amount the return is worked out on, taken for the part of the term
          still to come and at the share of it the plan returns, and rounded to the cent.
    trigger: on_request
    subject: [insure_cancel]
    computes: closing_premium_balance_usd
    target_tool: confirm_plan_giveup_9d16ef5f
    params:
      short_rate_return_share_pct: 90.00
    rule: >
      What the plan's premium account is left standing at when a household gives the plan up is what the unearned premium is
      set against, less that unearned premium, never below zero and rounded to the cent; where the unearned premium covers
      what it is set against, nothing is left standing and the difference goes back to the household by the route the plan
      settles by. What stands unpaid on the protection account is the premium raised on the plan and the charges raised on
      it, less the payments matched to premium entries, and it is never below zero. What the plan's premium account is left standing at is worked out only after every
      instalment of premium that has fallen due on the plan stands raised on the protection account. What the plan's premium
      account is left standing at is settled only once the charge the plan owes for being given up stands raised on the
      protection account. The unearned premium on a plan given up is the amount the return is worked out on, taken for the
      part of the term still to come and at the share of it the plan returns, and rounded to the cent. Where the plan is
      given up no later than its free look period counted in calendar days from the day the plan was taken, the anchor day
      counting as day zero, the whole of the premium collected on the plan answers for what stands unpaid instead of any
      unearned part of it. The amount the return is worked out on is the total of the payments matched to premium entries on
      the protection account. It is instead the premium frozen on the plan where the premium frozen on the plan stands above
      those payments and the plan's premium is collected alongside the covered holding's instalments; it is instead nothing
      where the protection account carries no payment matched to a premium entry; and it is the total of those payments in
      every other case. The day the plan is treated as given up from is the day cover began. It is instead the day the
      household gives the plan up where no claim has been made on the plan in the season, no paper stands filed against one
      and the plan's record carries no day on which cover was closed; it is instead the day the plan's record shows cover was closed where it carries one; and it
      is the day cover began in every other case. The part of the term still to come is the instalments still to fall on the
      covered holding's schedule as a share of all the instalments that schedule holds. It is instead the days from the day
      the plan is treated as given up from to the day cover is due to end, as a share of the days from the day cover began to
      the day cover is due to end, where the plan's premium is collected alongside that holding's instalments and instalments
      still fall on its schedule; it is instead the whole months still to come as a share of the whole months from the day
      cover began to the day cover is due to end where the plan's premium is collected in a single payment; and it is the
      instalments still to fall as a share of all the schedule holds in every other case. The share of the unearned premium
      the plan returns is nothing. It is instead the whole of it where the plan returns premium on a pro rata basis, no
      payout stands on the plan for the season and the plan is given up after the first half of its term has run; it is
      instead the short-rate share this rule sets of it where the plan returns premium on a pro rata basis, no payout stands
      on the plan for the season and the plan is given up inside the first half of its term; and it is nothing in every other
      case, a plan on which a payout stands for the season included, since the cover has already answered for itself. The
      part of the term that has run is measured from the day cover began to the day the plan is given up, against the days
      from the day cover began to the day cover is due to end. What is set against the unearned
      premium is the charges standing unpaid on the protection account, the premium standing unpaid being left on the
      schedule it rides on. It is instead everything standing unpaid on the protection account, premium and charges alike,
      where the covered holding's account carries an instalment the payment method refused in the season; it is instead
      nothing at all where that account carries no refused instalment in the season and the covered holding's record shows it
      given up in the season, what stands unpaid on the plan being dealt with on that holding's own settlement; and it is the
      charges standing unpaid in every other case. The unearned premium is worked out first and in full, and only then set against what is
      unpaid; the share the plan returns acts on the amount the return is worked out on after the part of the term still to
      come has been taken of it, and never on what stands unpaid. Cover ends on the day the giving up is recorded and not on
      the day the household says they stopped wanting it.
    prerequisite:
      - problem: insure_ext_premium_presentation
        kind: value_input
        gate: premium_raised
        form: state
        policy_source: >-
          What the plan's premium account is left standing at is worked out only after every instalment of premium that has
          fallen due on the plan stands raised on the protection account.
        condition: >-
          The protection account carries a premium entry for every presentation that has fallen due on the covered holding's
          schedule.
        resolved_by: present_plan_premium_8deb00b0
        effect: >-
          Once the premium that has fallen due stands raised on the protection account, the premium raised binding of this
          computation takes in that entry, and what stands unpaid rises by it.
      - problem: insure_ext_giveup_charge
        kind: value_input
        gate: fees_standing
        form: state
        policy_source: >-
          What the plan's premium account is left standing at is settled only once the charge the plan owes for being given
          up stands raised on the protection account.
        condition: >-
          The protection account carries the charge the plan owes for being given up.
        resolved_by: raise_plan_giveup_charge_59dbe3e5
        effect: >-
          Once the charge for being given up stands raised on the protection account, the charges standing binding of this
          computation takes in that entry, and what stands unpaid rises by it.
    cross_category:
      - category: passes
        as: history
        reads: [passes_ledger.event_type, passes_holdings.status, installment_count]
        note: "The part of the term still to come is measured from the covered holding's own schedule, and what is set against the unearned premium turns on whether that holding's account carries a refused instalment and whether the holding still stands active."
    compute:
      - premium_raised: "SUM('insure_ledger', 'amount_usd', event_type='insure_premium_charge')"
      - premium_matched: "SUM('insure_ledger', 'amount_usd', event_type='insure_premium_payment')"
      - fees_standing: "SUM('insure_ledger', 'amount_usd', event_type='insure_fee_charge')"
      - account_unpaid: "MX(0.0, RND(premium_raised + fees_standing - premium_matched, 2))"
      - return_base: "F('premium_usd') if (F('premium_usd') > premium_matched and P('premium_payment_schedule') == 'with_holding_instalments') else (0.0 if premium_matched == 0 else premium_matched)"
      - claim_papers_filed: "COUNT('insure_ledger', event_type='insure_document_receive')"
      - closed_on_record: "F('closed_date')"
      - giveup_day: "NOW if (claim_papers_filed == 0 and F('claim_opened_date') == '' and closed_on_record == '') else (closed_on_record if closed_on_record != '' else F('effective_date'))"
      - term_days: "MX(1, DAYS(F('effective_date'), F('expiry_date')))"
      - days_still_to_come: "MX(0, DAYS(giveup_day, F('expiry_date')))"
      - schedule_instalments_held: "CPARAM('passes', 'installment_count', pass_id=F('covered_holding_id'))"
      - schedule_instalments_charged: "XCOUNT('passes', 'passes_ledger', event_type='passes_installment_charge', season_code=F('season_code'), pass_id=F('covered_holding_id'))"
      - term_months_held: "MX(1, MONTHS(F('effective_date'), F('expiry_date')))"
      - months_still_to_come: "MX(0, MONTHS(giveup_day, F('expiry_date')))"
      - unearned_share: "days_still_to_come / term_days if (P('premium_payment_schedule') == 'with_holding_instalments' and schedule_instalments_charged < schedule_instalments_held) else (months_still_to_come / term_months_held if P('premium_payment_schedule') == 'single_payment' else MX(0, schedule_instalments_held - schedule_instalments_charged) / MX(1, schedule_instalments_held))"
      - payouts_standing: "COUNT('insure_ledger', event_type='insure_claim_payment')"
      - term_run_share: "MX(0.0, DAYS(F('effective_date'), NOW)) / term_days"
      - return_share: "1.0 if (P('cancellation_refund_basis') == 'pro_rata_by_days' and payouts_standing == 0 and term_run_share > 0.5) else (K('short_rate_return_share_pct') / 100 if (P('cancellation_refund_basis') == 'pro_rata_by_days' and payouts_standing == 0) else 0.0)"
      - refused_instalments_held: "XCOUNT('passes', 'passes_ledger', event_type='passes_installment_decline', season_code=F('season_code'), pass_id=F('covered_holding_id'))"
      - holding_standing: "CFIELD('passes', 'status', pass_id=F('covered_holding_id'))"
      - set_against: "account_unpaid if refused_instalments_held >= 1 else (0.0 if (refused_instalments_held == 0 and holding_standing == 'cancelled') else fees_standing)"
      - days_since_taken: "DAYS(F('purchased_date'), NOW)"
      - unearned_premium: "premium_matched if days_since_taken <= P('free_look_days') else RND(return_base * unearned_share * return_share, 2)"
      - result: "MX(0.0, RND(set_against - unearned_premium, 2))"
    compute_basis:
      premium_raised: "What the plan's premium account is left standing at is worked out only after every instalment of premium that has fallen due on the plan stands raised on the protection account."
      premium_matched: "The amount the return is worked out on is the total of the payments matched to premium entries on the protection account."
      fees_standing: "What the plan's premium account is left standing at is settled only once the charge the plan owes for being given up stands raised on the protection account."
      account_unpaid: "What stands unpaid on the protection account is the premium raised on the plan and the charges raised on it, less the payments matched to premium entries, and it is never below zero."
      return_base: "The amount the return is worked out on is the total of the payments matched to premium entries on the protection account. It is instead the premium frozen on the plan where the premium frozen on the plan stands above those payments and the plan's premium is collected alongside the covered holding's instalments; it is instead nothing where the protection account carries no payment matched to a premium entry; and it is the total of those payments in every other case."
      claim_papers_filed: "It is instead the day the household gives the plan up where no claim has been made on the plan in the season, no paper stands filed against one and the plan's record carries no day on which cover was closed"
      closed_on_record: "it is instead the day the plan's record shows cover was closed where it carries one"
      giveup_day: "The day the plan is treated as given up from is the day cover began. It is instead the day the household gives the plan up where no claim has been made on the plan in the season, no paper stands filed against one and the plan's record carries no day on which cover was closed; it is instead the day the plan's record shows cover was closed where it carries one; and it is the day cover began in every other case."
      term_days: "as a share of the days from the day cover began to the day cover is due to end"
      days_still_to_come: "It is instead the days from the day the plan is treated as given up from to the day cover is due to end"
      schedule_instalments_held: "The part of the term still to come is the instalments still to fall on the covered holding's schedule as a share of all the instalments that schedule holds."
      schedule_instalments_charged: "The part of the term still to come is the instalments still to fall on the covered holding's schedule as a share of all the instalments that schedule holds."
      term_months_held: "it is instead the whole months still to come as a share of the whole months from the day cover began to the day cover is due to end where the plan's premium is collected in a single payment"
      months_still_to_come: "it is instead the whole months still to come as a share of the whole months from the day cover began to the day cover is due to end where the plan's premium is collected in a single payment"
      unearned_share: "The part of the term still to come is the instalments still to fall on the covered holding's schedule as a share of all the instalments that schedule holds. It is instead the days from the day the plan is treated as given up from to the day cover is due to end, as a share of the days from the day cover began to the day cover is due to end, where the plan's premium is collected alongside that holding's instalments and instalments still fall on its schedule; it is instead the whole months still to come as a share of the whole months from the day cover began to the day cover is due to end where the plan's premium is collected in a single payment; and it is the instalments still to fall as a share of all the schedule holds in every other case."
      payouts_standing: "It is instead the whole of it where the plan returns premium on a pro rata basis, no payout stands on the plan for the season and the plan is given up after the first half of its term has run"
      term_run_share: "The part of the term that has run is measured from the day cover began to the day the plan is given up, against the days from the day cover began to the day cover is due to end."
      return_share: "The share of the unearned premium the plan returns is nothing. It is instead the whole of it where the plan returns premium on a pro rata basis, no payout stands on the plan for the season and the plan is given up after the first half of its term has run; it is instead the short-rate share this rule sets of it where the plan returns premium on a pro rata basis, no payout stands on the plan for the season and the plan is given up inside the first half of its term; and it is nothing in every other case, a plan on which a payout stands for the season included, since the cover has already answered for itself."
      refused_instalments_held: "It is instead everything standing unpaid on the protection account, premium and charges alike, where the covered holding's account carries an instalment the payment method refused in the season"
      holding_standing: "it is instead nothing at all where that account carries no refused instalment in the season and the covered holding's record shows it given up in the season, what stands unpaid on the plan being dealt with on that holding's own settlement"
      set_against: "What is set against the unearned premium is the charges standing unpaid on the protection account, the premium standing unpaid being left on the schedule it rides on. It is instead everything standing unpaid on the protection account, premium and charges alike, where the covered holding's account carries an instalment the payment method refused in the season; it is instead nothing at all where that account carries no refused instalment in the season and the covered holding's record shows it given up in the season, what stands unpaid on the plan being dealt with on that holding's own settlement; and it is the charges standing unpaid in every other case."
      days_since_taken: "Where the plan is given up no later than its free look period counted in calendar days from the day the plan was taken, the anchor day counting as day zero, the whole of the premium collected on the plan answers for what stands unpaid instead of any unearned part of it."
      unearned_premium: "The unearned premium on a plan given up is the amount the return is worked out on, taken for the part of the term still to come and at the share of it the plan returns, and rounded to the cent."
      result: "The unearned premium is worked out first and in full, and only then set against what is unpaid; the share the plan returns acts on the amount the return is worked out on after the part of the term still to come has been taken of it, and never on what stands unpaid."
    factors:
      - id: return_basis
        effect: parameter
        decides: return_base
        bindings: [premium_matched, return_base]
        ladder:
          - when: "the premium frozen on the plan stands above the payments matched to premium entries and the plan's premium is collected alongside the covered holding's instalments"
            value: "the premium frozen on the plan"
          - when: "the protection account carries no payment matched to a premium entry"
            value: "0.0"
          - when: "otherwise"
            value: "the total of the payments matched to premium entries"
        baseline:
          return_base: "premium_matched"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: giveup_anchor
        effect: method
        decides: giveup_day
        bindings: [claim_papers_filed, closed_on_record, giveup_day]
        ladder:
          - when: "no claim has been made on the plan in the season, no paper stands filed against one and the plan's record carries no day on which cover was closed"
            method: "the plan is treated as given up from the day the household gives it up"
          - when: "the plan's record carries a day on which cover was closed"
            method: "the plan is treated as given up from the day its record shows cover was closed"
          - when: "otherwise"
            method: "the plan is treated as given up from the day cover began"
        baseline:
          giveup_day: "F('effective_date')"
        evidence: [history, date]
        cross_difficulty: null
      - id: unearned_measure
        effect: method
        decides: unearned_share
        bindings: [schedule_instalments_held, schedule_instalments_charged, term_months_held, months_still_to_come, unearned_share]
        ladder:
          - when: "the plan's premium is collected alongside the covered holding's instalments and instalments still fall on its schedule"
            method: "the part still to come is the days from the day the plan is treated as given up from to the day cover is due to end, as a share of the days from the day cover began to the day cover is due to end"
          - when: "the plan's premium is collected in a single payment"
            method: "the part still to come is the whole months still to come as a share of the whole months from the day cover began to the day cover is due to end"
          - when: "otherwise"
            method: "the part still to come is the instalments still to fall on the covered holding's schedule as a share of all the instalments that schedule holds"
        baseline:
          unearned_share: "MX(0, schedule_instalments_held - schedule_instalments_charged) / MX(1, schedule_instalments_held)"
        evidence: [cross_category, date, tier_param]
        cross_difficulty: passes
      - id: return_allowance
        effect: parameter
        decides: return_share
        bindings: [payouts_standing, term_run_share, return_share]
        ladder:
          - when: "the plan returns premium on a pro rata basis, no payout stands on the plan for the season and the plan is given up after the first half of its term has run"
            value: "1.0"
          - when: "the plan returns premium on a pro rata basis, no payout stands on the plan for the season and the plan is given up inside the first half of its term"
            value: "K('short_rate_return_share_pct') of the unearned premium"
          - when: "otherwise"
            value: "0.0"
        baseline:
          return_share: "0.0"
        evidence: [history, date, tier_param]
        cross_difficulty: null
      - id: offset_reach
        effect: method
        decides: set_against
        bindings: [refused_instalments_held, holding_standing, set_against]
        ladder:
          - when: "the covered holding's account carries an instalment the payment method refused in the season"
            method: "everything standing unpaid on the protection account, premium and charges alike, is set against the unearned premium"
          - when: "the covered holding's account carries no refused instalment in the season and the covered holding's record shows it given up in the season"
            method: "nothing at all is set against the unearned premium, what stands unpaid on the plan being dealt with on the covered holding's own settlement"
          - when: "otherwise"
            method: "only the charges standing unpaid on the protection account are set against the unearned premium, the premium standing unpaid being left on the schedule it rides on"
        baseline:
          set_against: "fees_standing"
        evidence: [cross_category, history]
        cross_difficulty: passes
    baseline:
      rule: >-
        What the plan's premium account is left standing at when a household gives the plan up is what the unearned premium
        is set against, less that unearned premium, never below zero and rounded to the cent; where the unearned premium
        covers what it is set against, nothing is left standing and the difference goes back to the household by the route
        the plan settles by. What stands unpaid on the protection account is the premium raised on the plan and the charges
        raised on it, less the payments matched to premium entries, and it is never below zero. The unearned premium on a
        plan given up is the amount the return is worked out on, taken for the part of the term still to come and at the
        share of it the plan returns, and rounded to the cent. Where the plan is given up no later than its free look period
        counted in calendar days from the day the plan was taken, the anchor day counting as day zero, the whole of the
        premium collected on the plan answers for what stands unpaid instead of any unearned part of it. The amount the
        return is worked out on is the total of the payments matched to premium entries on the protection account. The day
        the plan is treated as given up from is the day cover began. The part of the term still to come is the instalments
        still to fall on the covered holding's schedule as a share of all the instalments that schedule holds. The share of
        the unearned premium the plan returns is nothing. What is set against the unearned premium is the charges standing
        unpaid on the protection account, the premium standing unpaid being left on the schedule it rides on. The unearned
        premium is worked out first and in full, and only then set against what is unpaid; the share the plan returns acts on
        the amount the return is worked out on after the part of the term still to come has been taken of it, and never on
        what stands unpaid.
      params: [free_look_days]
    inputs:
      history:
        - {table: insure_ledger, aggregate: sum, field: amount_usd, within_months: null, filters: {event_type: insure_premium_charge}}
        - {table: insure_ledger, aggregate: sum, field: amount_usd, within_months: null, filters: {event_type: insure_premium_payment}}
        - {table: insure_ledger, aggregate: sum, field: amount_usd, within_months: null, filters: {event_type: insure_fee_charge}}
        - {table: insure_ledger, aggregate: count, field: event_type, within_months: null, filters: {event_type: insure_claim_payment}}
        - {category: passes, table: passes_ledger, aggregate: count, field: event_type, within_months: null, filters: {event_type: passes_installment_charge}}
        - {category: passes, table: passes_ledger, aggregate: count, field: event_type, within_months: null, filters: {event_type: passes_installment_decline}}
      cross_category: [passes]
