events:
  - type: insure_quote
    target: insure_holdings
    mutation: create
    meaning: "A household asks for protection over a holding they already have, and the plan record is opened as a quote."
    grain: "One row per protection plan written over one holding for one named insured for one season."
    fields:
      protection_plan_id: "Reference number of the protection plan."
      customer_id: "The household account the plan is written on."
      variant_name: "The protection plan quoted, written as its official full name."
      status: "Lifecycle state of the plan, pinned to the quoted state when it is opened."
      season_code: "The season the plan covers."
      insured_name: "Name of the person the plan is written over, exactly as the household states it."
      covered_product_category: "Which of the collective's product lines the covered holding belongs to."
      covered_holding_id: "Reference number of the holding the plan is written over."
      covered_value_usd: "Value of the covered holding the premium and the benefit are worked out from."
      premium_usd: "Premium quoted for the plan."
      purchased_date: "Date the plan was quoted and taken."
      beneficiary_name: "Name of the person a payout is made to where it is not the insured."
    triggers:
      - event: insure:insure_premium_charge
        map: {protection_plan_id: protection_plan_id, customer_id: customer_id, charge_category: premium}

  - type: insure_activate
    target: insure_holdings
    mutation: {transition: {from: quoted, to: active}}
    meaning: "The premium has been taken and the plan comes into force over the named holding."
    grain: "One row per plan; coming into force is recorded on the plan itself."
    fields:
      status: "Lifecycle state of the plan, moved to the in-force state."
      effective_date: "Date cover begins."
      expiry_date: "Date cover ends."
      waiting_period_end_date: "Date the waiting period ends and a claim may first be made."
      benefit_remaining_usd: "Cover available to be claimed on the plan for the season."
    triggers:
      - event: insure:insure_coverage_load
        map: {protection_plan_id: protection_plan_id, customer_id: customer_id}

  - type: insure_amend
    target: insure_holdings
    mutation: update
    meaning: "The holding covered or the person a payout would be made to is changed on a plan already in force."
    grain: "One row per plan; the change rewrites the cover on the plan itself."
    fields:
      covered_holding_id: "Reference number of the holding the plan now covers."
      covered_value_usd: "Value of the holding the plan now covers."
      beneficiary_name: "Name of the person a payout would now be made to."
    triggers:
      - event: insure:insure_fee_charge
        map: {protection_plan_id: protection_plan_id, customer_id: customer_id, charge_category: amendment_fee}

  - type: insure_claim_open
    target: insure_holdings
    mutation: {transition: {from: active, to: claim_open}}
    meaning: "The household makes a claim on the plan and the claim is opened for assessment."
    grain: "One row per plan; the open claim is recorded on the plan itself."
    fields:
      status: "Lifecycle state of the plan, moved to the state in which a claim is open."
      claim_opened_date: "Date the claim was opened."
      claim_reason: "What the household is claiming on."
      documents_complete: "Whether every paper the plan requires is already on file."
    triggers: []

  - type: insure_claim_settle
    target: insure_holdings
    mutation: {transition: {from: claim_open, to: claim_settled}}
    meaning: "The claim has been assessed, allowed and settled against the plan."
    grain: "One row per plan; the settlement is recorded on the plan itself."
    fields:
      status: "Lifecycle state of the plan, moved to the settled state."
      claim_decision: "How the claim was decided."
    triggers:
      - event: insure:insure_claim_payment
        map: {protection_plan_id: protection_plan_id, customer_id: customer_id, claim_reason: claim_reason}

  - type: insure_claim_decline
    target: insure_holdings
    mutation: {transition: {from: claim_open, to: active}}
    meaning: "The claim has been withdrawn or refused, and cover carries on unchanged."
    grain: "One row per plan; the refusal is recorded on the plan itself."
    fields:
      status: "Lifecycle state of the plan, returned to the in-force state."
      claim_decision: "How the claim was decided."
    triggers: []

  - type: insure_resume
    target: insure_holdings
    mutation: {transition: {from: claim_settled, to: active}}
    meaning: "The settled claim is closed off and cover carries on with the benefit reduced by what was paid."
    grain: "One row per plan; the resumption is recorded on the plan itself."
    fields:
      status: "Lifecycle state of the plan, returned to the in-force state."
      benefit_remaining_usd: "Cover left on the plan for the rest of the season."
    triggers: []

  - type: insure_lapse
    target: insure_holdings
    mutation: {transition: {from: active, to: lapsed}}
    meaning: "A premium instalment has gone unpaid past its grace period and cover has stopped."
    grain: "One row per plan; the lapse is recorded on the plan itself."
    fields:
      status: "Lifecycle state of the plan, moved to the out-of-force state."
    triggers: []

  - type: insure_reinstate
    target: insure_holdings
    mutation: {transition: {from: lapsed, to: active}}
    meaning: "The unpaid premium has been settled and cover has been put back in force."
    grain: "One row per plan; the reinstatement is recorded on the plan itself."
    fields:
      status: "Lifecycle state of the plan, returned to the in-force state."
      effective_date: "Date cover begins again."
    triggers:
      - event: insure:insure_fee_charge
        map: {protection_plan_id: protection_plan_id, customer_id: customer_id, charge_category: reinstatement_fee}

  - type: insure_cancel
    target: insure_holdings
    mutation:
      transition:
        - {from: quoted, to: cancelled}
        - {from: active, to: cancelled}
        - {from: lapsed, to: cancelled}
    meaning: "The household gives the plan up and cover ends."
    grain: "One row per plan; the cancellation is recorded on the plan itself."
    fields:
      status: "Lifecycle state of the plan, moved to the cancelled state."
      cancellation_reason: "Why the plan was given up."
      closed_date: "Last date cover stood."
    triggers:
      - event: insure:insure_fee_charge
        when: {cancellation_reason: [guest_request, no_reason_given]}
        map: {protection_plan_id: protection_plan_id, customer_id: customer_id, charge_category: cancellation_fee}

  - type: insure_expire
    target: insure_holdings
    mutation:
      transition:
        - {from: active, to: expired}
        - {from: claim_settled, to: expired}
        - {from: lapsed, to: expired}
    meaning: "The covered season has ended and the plan no longer offers cover."
    grain: "One row per plan; expiry is recorded on the plan itself."
    fields:
      status: "Lifecycle state of the plan, moved to the expired state."
      closed_date: "Last date cover stood."
    triggers: []

  - type: insure_close
    target: insure_holdings
    mutation:
      transition:
        - {from: expired, to: closed}
        - {from: cancelled, to: closed}
    meaning: "Everything owed on and owed under the plan has been settled and the record is closed for good."
    grain: "One row per plan; closure is recorded on the plan itself."
    fields:
      status: "Lifecycle state of the plan, moved to the closed state."
      premium_balance_usd: "Premium still to be collected, which stands at zero once the record is closed."
    triggers: []

  - type: insure_premium_charge
    target: insure_ledger
    meaning: "A premium, whether the whole premium or one instalment of it, is raised against the household account."
    grain: "One row per premium amount raised on one plan."
    distinguish_by: [event_date, amount_usd, charge_category]
    fields:
      insure_event_id: "Reference number of this protection account entry."
      protection_plan_id: "The plan this entry belongs to."
      customer_id: "The household account this entry belongs to."
      event_type: "The kind of protection account entry this row records."
      season_code: "The season the plan covers."
      event_date: "Date the premium was raised."
      amount_usd: "Amount of premium raised."
      charge_category: "What the amount is for."
      covered_holding_id: "The holding the plan is written over."
    account: premium_balance
    direction: in
    triggers: []

  - type: insure_premium_payment
    target: insure_ledger
    meaning: "Money is collected against the premium owed on a plan."
    grain: "One row per payment collected against one plan."
    distinguish_by: [event_date, amount_usd, payment_method]
    fields:
      insure_event_id: "Reference number of this protection account entry."
      protection_plan_id: "The plan this entry belongs to."
      customer_id: "The household account this entry belongs to."
      event_type: "The kind of protection account entry this row records."
      related_event_id: "The premium entry this payment settles."
      event_date: "Date the payment cleared."
      amount_usd: "Amount collected."
      payment_method: "How the money was taken."
    account: premium_balance
    direction: out
    triggers: []

  - type: insure_fee_charge
    target: insure_ledger
    meaning: "A plan fee of some kind — a reinstatement, a cancellation or an amendment — is raised against the household account."
    grain: "One row per plan fee of one kind raised on one plan."
    distinguish_by: [charge_category, event_date, related_event_id]
    fields:
      insure_event_id: "Reference number of this protection account entry."
      protection_plan_id: "The plan this entry belongs to."
      customer_id: "The household account this entry belongs to."
      event_type: "The kind of protection account entry this row records."
      related_event_id: "The protection account entry this fee answers to, where it answers to one."
      event_date: "Date the fee was raised."
      amount_usd: "Amount of the fee."
      charge_category: "Which fee the amount is for."
    account: premium_balance
    direction: in
    triggers: []

  - type: insure_coverage_load
    target: insure_ledger
    meaning: "The season's benefit limit is loaded onto the plan when it comes into force."
    grain: "One row per loading of a benefit limit onto one plan for one season."
    distinguish_by: [event_date, amount_usd, season_code]
    fields:
      insure_event_id: "Reference number of this protection account entry."
      protection_plan_id: "The plan this entry belongs to."
      customer_id: "The household account this entry belongs to."
      event_type: "The kind of protection account entry this row records."
      season_code: "The season the limit belongs to."
      event_date: "Date the limit was loaded."
      amount_usd: "Amount of cover loaded."
      covered_holding_id: "The holding the cover is written over."
    account: benefit_remaining
    direction: in
    triggers: []

  - type: insure_claim_payment
    target: insure_ledger
    meaning: "An allowed claim is paid out and the benefit left on the plan is drawn down."
    grain: "One row per payout made on one claim on one plan."
    distinguish_by: [event_date, amount_usd, claim_reason]
    fields:
      insure_event_id: "Reference number of this protection account entry."
      protection_plan_id: "The plan this entry belongs to."
      customer_id: "The household account this entry belongs to."
      event_type: "The kind of protection account entry this row records."
      related_event_id: "The claim papers entry the payout was assessed from."
      season_code: "The season the claim falls in."
      event_date: "Date the payout was made."
      amount_usd: "Amount paid out after the excess has been taken off."
      claim_reason: "What the claim was made on."
      payout_method: "How the payout reached the household."
      covered_holding_id: "The holding the claim was made over."
    account: benefit_remaining
    direction: out
    triggers: []

  - type: insure_document_receive
    target: insure_ledger
    meaning: "One of the papers a claim needs reaches the collective and is recorded against the claim."
    grain: "One row per paper of one kind received against one claim on one plan."
    distinguish_by: [document_type, event_date, document_status]
    fields:
      insure_event_id: "Reference number of this protection account entry."
      protection_plan_id: "The plan this entry belongs to."
      customer_id: "The household account this entry belongs to."
      event_type: "The kind of protection account entry this row records."
      event_date: "Date the paper reached the collective."
      document_type: "Which paper was received."
      document_status: "Whether the paper as received is enough for assessment."
      claim_reason: "The claim the paper was filed against."
    triggers: []

measures:
  - id: insure_msr_claims_paid_this_season
    window: "The season named in the plan's season_code."
    measure: "Count of insure_ledger rows of event_type insure_claim_payment carrying this protection_plan_id."
  - id: insure_msr_documents_on_file
    window: "From the date the open claim was made through the handling date inclusive."
    measure: "Count of insure_ledger rows of event_type insure_document_receive carrying this protection_plan_id whose document_status is accepted."

policies:
  - id: insure_agg_multi_holding
    subject: [insure_quote]
    rule: >
      Protection is written over a holding, so a household that wants its passes, its lodging and its
      lessons covered holds a plan for each. The account may carry several plans at once up to the number
      this charter allows, counting plans in the quoted, active, claim_open, claim_settled and lapsed
      states. No two live plans are ever written over the same covered holding; where a household asks for
      more cover on a holding they have already protected, the plan they hold is moved up rather than a
      second one written, because two plans over one holding would pay twice for one loss. A plan that
      carries family cover stands for the whole household on the holdings it names, and no separate plan is
      written for a dependant already covered by it.
    eligibility:
      - id: one_plan_per_covered_holding
        applies_to: [insure_quote]
        kind: dedup
        condition: "No two live plans are ever written over the same covered holding; where a household asks for more cover on a holding they have already protected, the plan they hold is moved up rather than a second one written, because two plans over one holding would pay twice for one loss."
        evidence_fields: [insure_holdings.customer_id, insure_holdings.covered_holding_id, insure_holdings.season_code, insure_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [insure_holdings.covered_holding_id, insure_holdings.season_code]
          action_bindings:
            insure_holdings.covered_holding_id: covered_holding_id
            insure_holdings.season_code: season_code
        dedup_contract:
          table: insure_holdings
          mode: separate_record
          object_bindings: {covered_holding_id: covered_holding_id, season_code: season_code}
          duplicate_filters: {status: [quoted, active, claim_open, claim_settled, lapsed]}
          distinct_fields: [variant_name]
    params:
      max_per_customer: 3

  - id: insure_agg_portfolio_limits
    subject: [insure_quote, insure_coverage_load]
    rule: >
      The benefit limits of the plans on one household account stand on their own and are never pooled: a
      claim on the plan covering the passes is met out of that plan's limit alone, however much cover sits
      unused on the plan covering the lodging. The season cap of each plan is the most that plan pays over
      the season across every claim made on it, and it is not raised by adding a second plan over a
      different holding. Where one loss touches holdings covered by two plans, each plan pays its own share
      of the value of the holding it covers, and neither pays for the other's. A household holding a plan
      that carries family cover does not also count its dependants' losses against another plan on the same
      account.
    eligibility: []
    params:
      per_tier:
        Season Pass Protection Basic: {benefit_limit_pct: "=benefit_limit_pct", season_benefit_cap_usd: "=season_benefit_cap_usd", per_claim_cap_usd: "=per_claim_cap_usd", family_cover_included: "=family_cover_included", dependents_covered: "=dependents_covered"}
        Season Pass Protection Plus: {benefit_limit_pct: "=benefit_limit_pct", season_benefit_cap_usd: "=season_benefit_cap_usd", per_claim_cap_usd: "=per_claim_cap_usd", family_cover_included: "=family_cover_included", dependents_covered: "=dependents_covered"}
        Season Pass Protection Premier: {benefit_limit_pct: "=benefit_limit_pct", season_benefit_cap_usd: "=season_benefit_cap_usd", per_claim_cap_usd: "=per_claim_cap_usd", family_cover_included: "=family_cover_included", dependents_covered: "=dependents_covered"}
        Collective Trip Protection Standard: {benefit_limit_pct: "=benefit_limit_pct", season_benefit_cap_usd: "=season_benefit_cap_usd", per_claim_cap_usd: "=per_claim_cap_usd", family_cover_included: "=family_cover_included", dependents_covered: "=dependents_covered"}
        Collective Trip Protection Elite: {benefit_limit_pct: "=benefit_limit_pct", season_benefit_cap_usd: "=season_benefit_cap_usd", per_claim_cap_usd: "=per_claim_cap_usd", family_cover_included: "=family_cover_included", dependents_covered: "=dependents_covered"}
        Collective Total Protection Concierge: {benefit_limit_pct: "=benefit_limit_pct", season_benefit_cap_usd: "=season_benefit_cap_usd", per_claim_cap_usd: "=per_claim_cap_usd", family_cover_included: "=family_cover_included", dependents_covered: "=dependents_covered"}

  - id: insure_eligibility_and_quote
    subject: [insure_quote, insure_amend]
    rule: >
      A plan is written only over a holding that already exists on the household account and that belongs to
      one of the product lines the plan covers. The quote is worked out from the covered value, which is the
      price committed to on the covered holding as the collective's records show it, not as the household
      recalls it, and that value must fall between the plan's smallest and largest covered values. A plan is
      written only where the covered holding was opened no longer ago than the plan's purchase window
      counted in calendar days from the day the covered holding was opened. Calendar days are counted
      forward from the anchor date, the anchor date itself counting as day zero, every day of the week
      counting alike, and a calendar day is never mixed with a full 24-hour period; where the resulting
      boundary falls on a date that does not exist in the target month, the last day of that month is used.
      The named insured must fall inside the plan's age range on the date cover begins. Where the plan
      allows it, the holding covered or the person a payout would be made to may be changed against the
      plan's amendment fee, and a change to a holding of a higher value reprices the premium from the date
      of the change rather than from the start of cover.
    eligibility:
      - id: within_purchase_window
        applies_to: [insure_quote]
        kind: time
        condition: "A plan is written only where the covered holding was opened no longer ago than the plan's purchase window counted in calendar days from the day the covered holding was opened."
        evidence_fields: [passes_holdings.pass_id, passes_holdings.applied_date, passes_holdings.price_paid_usd]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [passes_holdings.pass_id]
          action_bindings:
            passes_holdings.pass_id: covered_holding_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the covered holding was opened"
          anchor_source: passes_holdings.applied_date
          relation: not_after
          duration_source: variants.purchase_window_days
          unit: calendar_days
          counting_rule: "Calendar days are counted forward from the anchor date, the anchor date itself counting as day zero, every day of the week counting alike, and a calendar day is never mixed with a full 24-hour period; where the resulting boundary falls on a date that does not exist in the target month, the last day of that month is used."
          boundary: inclusive
    params:
      per_tier:
        Season Pass Protection Basic: {covered_categories: "=covered_categories", min_covered_value_usd: "=min_covered_value_usd", max_covered_value_usd: "=max_covered_value_usd", purchase_window_days: "=purchase_window_days", min_insured_age_years: "=min_insured_age_years", max_insured_age_years: "=max_insured_age_years", amendment_allowed: "=amendment_allowed", amendment_fee_usd: "=amendment_fee_usd", plan_transferable: "=plan_transferable"}
        Season Pass Protection Plus: {covered_categories: "=covered_categories", min_covered_value_usd: "=min_covered_value_usd", max_covered_value_usd: "=max_covered_value_usd", purchase_window_days: "=purchase_window_days", min_insured_age_years: "=min_insured_age_years", max_insured_age_years: "=max_insured_age_years", amendment_allowed: "=amendment_allowed", amendment_fee_usd: "=amendment_fee_usd", plan_transferable: "=plan_transferable"}
        Season Pass Protection Premier: {covered_categories: "=covered_categories", min_covered_value_usd: "=min_covered_value_usd", max_covered_value_usd: "=max_covered_value_usd", purchase_window_days: "=purchase_window_days", min_insured_age_years: "=min_insured_age_years", max_insured_age_years: "=max_insured_age_years", amendment_allowed: "=amendment_allowed", amendment_fee_usd: "=amendment_fee_usd", plan_transferable: "=plan_transferable"}
        Collective Trip Protection Standard: {covered_categories: "=covered_categories", min_covered_value_usd: "=min_covered_value_usd", max_covered_value_usd: "=max_covered_value_usd", purchase_window_days: "=purchase_window_days", min_insured_age_years: "=min_insured_age_years", max_insured_age_years: "=max_insured_age_years", amendment_allowed: "=amendment_allowed", amendment_fee_usd: "=amendment_fee_usd", plan_transferable: "=plan_transferable"}
        Collective Trip Protection Elite: {covered_categories: "=covered_categories", min_covered_value_usd: "=min_covered_value_usd", max_covered_value_usd: "=max_covered_value_usd", purchase_window_days: "=purchase_window_days", min_insured_age_years: "=min_insured_age_years", max_insured_age_years: "=max_insured_age_years", amendment_allowed: "=amendment_allowed", amendment_fee_usd: "=amendment_fee_usd", plan_transferable: "=plan_transferable"}
        Collective Total Protection Concierge: {covered_categories: "=covered_categories", min_covered_value_usd: "=min_covered_value_usd", max_covered_value_usd: "=max_covered_value_usd", purchase_window_days: "=purchase_window_days", min_insured_age_years: "=min_insured_age_years", max_insured_age_years: "=max_insured_age_years", amendment_allowed: "=amendment_allowed", amendment_fee_usd: "=amendment_fee_usd", plan_transferable: "=plan_transferable"}

  - id: insure_premium_terms
    subject: [insure_premium_charge, insure_premium_payment]
    rule: >
      The premium is worked out on the plan's basis. A flat plan charges its stated premium whatever the
      covered value. A plan priced on the value covered charges its rate of the covered value, then is
      brought up to the plan's smallest premium where it falls below and down to its largest where it rises
      above; the bounds are applied after the rate, never before. The result is rounded to the cent and
      frozen on the plan record. A premium is raised only while the plan record stands in the quoted,
      active, claim_open or claim_settled state. A plan collected in a single payment takes the whole
      premium when the plan is taken; a plan collected alongside the covered holding's instalments divides
      the premium over the instalments still to fall on that holding and is presented with them. An
      instalment of premium that goes unpaid past the plan's grace period stops cover; premium already paid
      is not returned when cover stops.
    eligibility:
      - id: premium_chargeable_state
        applies_to: [insure_premium_charge]
        kind: state
        condition: "A premium is raised only while the plan record stands in the quoted, active, claim_open or claim_settled state."
        evidence_fields: [insure_holdings.protection_plan_id, insure_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [insure_holdings.protection_plan_id]
          action_bindings:
            insure_holdings.protection_plan_id: protection_plan_id
        state_contract:
          field: insure_holdings.status
          allowed: [quoted, active, claim_open, claim_settled]
    params:
      per_tier:
        Season Pass Protection Basic: {premium_basis: "=premium_basis", premium_flat_usd: "=premium_flat_usd", premium_rate_pct: "=premium_rate_pct", premium_minimum_usd: "=premium_minimum_usd", premium_maximum_usd: "=premium_maximum_usd", premium_payment_schedule: "=premium_payment_schedule", premium_grace_days: "=premium_grace_days"}
        Season Pass Protection Plus: {premium_basis: "=premium_basis", premium_flat_usd: "=premium_flat_usd", premium_rate_pct: "=premium_rate_pct", premium_minimum_usd: "=premium_minimum_usd", premium_maximum_usd: "=premium_maximum_usd", premium_payment_schedule: "=premium_payment_schedule", premium_grace_days: "=premium_grace_days"}
        Season Pass Protection Premier: {premium_basis: "=premium_basis", premium_flat_usd: "=premium_flat_usd", premium_rate_pct: "=premium_rate_pct", premium_minimum_usd: "=premium_minimum_usd", premium_maximum_usd: "=premium_maximum_usd", premium_payment_schedule: "=premium_payment_schedule", premium_grace_days: "=premium_grace_days"}
        Collective Trip Protection Standard: {premium_basis: "=premium_basis", premium_flat_usd: "=premium_flat_usd", premium_rate_pct: "=premium_rate_pct", premium_minimum_usd: "=premium_minimum_usd", premium_maximum_usd: "=premium_maximum_usd", premium_payment_schedule: "=premium_payment_schedule", premium_grace_days: "=premium_grace_days"}
        Collective Trip Protection Elite: {premium_basis: "=premium_basis", premium_flat_usd: "=premium_flat_usd", premium_rate_pct: "=premium_rate_pct", premium_minimum_usd: "=premium_minimum_usd", premium_maximum_usd: "=premium_maximum_usd", premium_payment_schedule: "=premium_payment_schedule", premium_grace_days: "=premium_grace_days"}
        Collective Total Protection Concierge: {premium_basis: "=premium_basis", premium_flat_usd: "=premium_flat_usd", premium_rate_pct: "=premium_rate_pct", premium_minimum_usd: "=premium_minimum_usd", premium_maximum_usd: "=premium_maximum_usd", premium_payment_schedule: "=premium_payment_schedule", premium_grace_days: "=premium_grace_days"}
    formula:
      when_not: "premium_basis == 'flat_premium'"
      premium_usd: "min(premium_maximum_usd, max(premium_minimum_usd, round(covered_value_usd * premium_rate_pct / 100, 2)))"

  - id: insure_cover_start
    subject: [insure_activate, insure_coverage_load]
    rule: >
      Cover begins once the premium, or the first instalment of it, has been taken, and the plan record
      carries the date it begins and the date it ends. The plan's benefit limit is loaded onto the plan in
      the same step, worked out as the plan's benefit share of the covered value and then brought down to
      the plan's season cap where it rises above it. The benefit limit is loaded only while the plan record
      stands in the active or claim_open state. No claim may be made during the plan's waiting period, which
      runs from the date cover begins, and a loss that arises inside the waiting period is never paid even
      where the claim is made after it. A condition treated inside the plan's pre-existing exclusion period
      before cover begins is not covered at all. Where the covered holding is itself cancelled, cover ends
      with it and the premium is dealt with on the plan's cancellation terms.
    eligibility:
      - id: cover_load_state
        applies_to: [insure_coverage_load]
        kind: state
        condition: "The benefit limit is loaded only while the plan record stands in the active or claim_open state."
        evidence_fields: [insure_holdings.protection_plan_id, insure_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [insure_holdings.protection_plan_id]
          action_bindings:
            insure_holdings.protection_plan_id: protection_plan_id
        state_contract:
          field: insure_holdings.status
          allowed: [active, claim_open]
    params:
      per_tier:
        Season Pass Protection Basic: {waiting_period_days: "=waiting_period_days", benefit_limit_pct: "=benefit_limit_pct", season_benefit_cap_usd: "=season_benefit_cap_usd", pre_existing_exclusion_months: "=pre_existing_exclusion_months", season_start_date: "=season_start_date", season_end_date: "=season_end_date"}
        Season Pass Protection Plus: {waiting_period_days: "=waiting_period_days", benefit_limit_pct: "=benefit_limit_pct", season_benefit_cap_usd: "=season_benefit_cap_usd", pre_existing_exclusion_months: "=pre_existing_exclusion_months", season_start_date: "=season_start_date", season_end_date: "=season_end_date"}
        Season Pass Protection Premier: {waiting_period_days: "=waiting_period_days", benefit_limit_pct: "=benefit_limit_pct", season_benefit_cap_usd: "=season_benefit_cap_usd", pre_existing_exclusion_months: "=pre_existing_exclusion_months", season_start_date: "=season_start_date", season_end_date: "=season_end_date"}
