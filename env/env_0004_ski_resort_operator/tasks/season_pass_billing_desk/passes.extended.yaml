    ladder:
    - when: the pass account carries at least as many refusals in the three whole months ending on the handling
        date as the number of refusals the tier tolerates before privileges are reviewed
      method: the base of the charge is the tier's reinstatement fee taken once for each refusal left uncured past
        its grace period
    - when: the pass account carries a charge already raised for restoring scanning privileges in this season and
        the refusals in the three whole months ending on the handling date are fewer than the number the tier tolerates
      method: the base of the charge is the tier's reinstatement fee taken once and a half
    - when: otherwise
