- id: passes_ext_settlement_credit
  base_policy_refs:
  - passes_cancellation_refund
  overwrite:
  - base_policy: passes_cancellation_refund
    superseded_clause: The refundable amount is never below zero.
    replaced_by: The amount coming back is the gross amount taken at the scan share, less the charge retained taken
      at the offset share and less what the protection plan has paid out taken at the payout share, and the figure
      that gives is then taken at the credit uplift; it is rounded to the cent once at the end and is never below
      zero.
  - base_policy: passes_cancellation_refund
    superseded_clause: 'Inside the window the refundable amount is worked out on the tier''s refund basis: on the
      day use basis it is the price committed to, less the tier''s cancellation fee, less the tier''s day use deduction
      for each day already scanned on the pass; on the pro rata basis it is the price committed to, less the tier''s
      cancellation fee, multiplied by the share of the season''s operating days still to come.'
    replaced_by: The gross amount coming back is the price committed to on the pass record multiplied by the share
      of the season still to come, less the tier's day use deduction taken once, and never below zero. Where the
      tier's refund basis is the pro rata basis and the pass account shows at least one lift scan entry, the gross
      amount is instead the price committed to multiplied by the share of the season still to come, with no day
      use deduction taken; and where the tier's refund basis is the pro rata basis and the pass account shows no
      lift scan entry at all, the gross amount is instead the price committed to in full.
  trigger: state_due
  subject:
  - passes_credit_issue
  computes: settlement_credit_usd
  target_tool: issue_settlement_credit_d3237287
  params:
    use_rate_heavy: 0.9
    use_rate_light: 0.95
    use_rate_none: 1.0
    offset_full: 1.0
    offset_part: 0.5
    offset_none: 0.0
    payout_full: 1.0
    payout_part: 0.5
    payout_none: 0.0
    uplift_financed: 1.05
    uplift_paid: 1.1
    uplift_none: 1.0
    heavy_scans: 6
    day_block_quarter: 4
    whole_share: 1.0
  rule: When a season pass has been given up, resort credit is issued against the pass record for what comes back
    to the household, and this rule fixes that amount. The resort credit issued when a pass is given up is worked
    out only after the pass account carries the charge retained on the pass being given up. The share of the season
    still to come is the days from the handling date to the season's last day set against the days of the season
    itself. Where the tier admits the holder on fewer days than a quarter of the days the season runs, that share
    is instead the whole, because a pass sold as a block of days is not used up by the calendar and what the holder
    has taken is settled by the day use deduction rather than by the time remaining; and where the tier admits the
    holder on at least a quarter of the days the season runs and the pass became scannable after the day the season
    opened, that share is instead the days from the handling date to the season's last day set against the days
    from the day the pass became scannable to the season's last day, so that only the part of the season the holder
    actually had is counted. The gross amount coming back is the price committed to on the pass record multiplied
    by the share of the season still to come, less the tier's day use deduction taken once, and never below zero.
    Where the tier's refund basis is the pro rata basis and the pass account shows at least one lift scan entry,
    the gross amount is instead the price committed to multiplied by the share of the season still to come, with
    no day use deduction taken; and where the tier's refund basis is the pro rata basis and the pass account shows
    no lift scan entry at all, the gross amount is instead the price committed to in full. The gross amount is taken
    as it stands whatever the pass account shows. Where the pass account shows at least the number of lift scan
    entries the charter treats as heavy use, nine tenths of the gross amount is taken; and where it shows at least
    one lift scan entry but fewer than that number, nineteen twentieths of the gross amount is taken. None of the
    charge retained on the pass being given up is taken off. Where that charge stands on the pass account and the
    account still shows an amount to collect, the whole of it is taken off; and where that charge stands on the
    pass account and the account shows nothing left to collect, half of it is taken off. Nothing the protection
    plan has paid out is taken off. Where the collective's protection records show a plan written over a season
    pass on the household account whose claim has been settled, the whole of what that plan has paid out this season
    is taken off, because the household is not put in funds twice for the same season; and where those records show
    such a plan with a claim still open, half of what it has paid out is taken off. No uplift is added for taking
    the value back as resort credit. Where the pass account shows an amount placed on it to be collected by instalments
    and the price is still being collected, the figure is increased by a twentieth; and where the pass account shows
    no amount placed on it to be collected by instalments and the pass was paid in full at the outset, it is increased
    by a tenth. The amount coming back is the gross amount taken at the scan share, less the charge retained taken
    at the offset share and less what the protection plan has paid out taken at the payout share, and the figure
    that gives is then taken at the credit uplift; it is rounded to the cent once at the end and is never below
    zero.
  prerequisite:
  - problem: passes_ext_cancellation_charge
    kind: value_input
    gate: retained_offset_rate
    form: state
    policy_source: The resort credit issued when a pass is given up is worked out only after the pass account carries
      the charge retained on the pass being given up.
    condition: The pass account carries a charge entry raised for the pass being given up.
    resolved_by: give_up_season_pass_8c1a0eca
    effect: Once the charge retained stands on the pass account, the share at which that charge is taken off moves
      off its fall-through of none, and the amount coming back falls by the charge.
  cross_category:
