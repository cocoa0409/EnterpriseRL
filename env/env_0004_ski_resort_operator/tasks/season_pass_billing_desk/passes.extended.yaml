- id: passes_ext_cancellation_charge
  base_policy_refs:
  - passes_cancellation_refund
  overwrite:
  - base_policy: passes_cancellation_refund
    superseded_clause: 'Inside the window the refundable amount is worked out on the tier''s refund basis: on the
      day use basis it is the price committed to, less the tier''s cancellation fee, less the tier''s day use deduction
      for each day already scanned on the pass; on the pro rata basis it is the price committed to, less the tier''s
      cancellation fee, multiplied by the share of the season''s operating days still to come.'
    replaced_by: The charge retained when a pass is given up is worked out from a charge base taken at the shares
      below, with the scan component added and the allowances settled against it, and it is what the amount coming
      back is reduced by rather than the tier's cancellation fee and day use deduction taken separately.
  trigger: on_request
  subject:
  - passes_cancel
  computes: retained_charge_usd
  target_tool: give_up_season_pass_8c1a0eca
  params:
    window_rate_late: 1.5
    window_rate_mid: 1.25
    window_rate_early: 1.0
    light_use_share: 0.5
    outstanding_rate_high: 1.25
    outstanding_rate_mid: 1.1
    outstanding_rate_base: 1.0
    outstanding_high_share: 0.95
    outstanding_mid_share: 0.8
    full_price_multiple: 1.1
    allowance_high: 25.0
    allowance_mid: 12.5
    allowance_none: 0.0
    cover_threshold_pct: 80
    relief_part_share: 0.5
    relief_none: 0.0
    heavy_use_scans: 6
    settled_record_days: 7
    scan_component_none: 0.0
  rule: A household may give a season pass up, and this rule fixes the charge the collective retains on the pass
    account when it does. The charge retained when a pass is given up is worked out only after the pass account
    carries an application of resort credit against the amount it still shows to collect. The charge retained when
    a pass is given up is worked out from a charge base taken at the shares below, with the scan component added
    and the allowances settled against it, and it is what the amount coming back is reduced by rather than the tier's
    cancellation fee and day use deduction taken separately. The charge base is the tier's cancellation fee. Where
    the pass record was opened as a renewal of a pass held in the preceding season and the price committed to stands
    below the tier's standard season price, the charge base is instead that cancellation fee reduced in the proportion
    the price committed to bears to the standard season price; and where the price committed to stands at or above
    the tier's standard season price and the pass became scannable at least the number of days the charter treats
