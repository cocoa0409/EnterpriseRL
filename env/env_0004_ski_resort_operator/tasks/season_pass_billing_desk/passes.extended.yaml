    - insure_ledger.amount_usd
    note: The share at which what the protection plan has already paid out is taken off is decided from the state
      of the plan written over a season pass on the household account, and the amount taken off is the payouts on
      that household's protection account.
  compute:
  - scans_counted: COUNT('passes_ledger', event_type='passes_scan')
  - scan_entries: COUNT('passes_ledger', event_type='passes_scan')
  - season_span: DAYS(P('season_start_date'), P('season_end_date'))
  - season_left_a: DAYS(NOW, P('season_end_date'))
  - held_span: DAYS(F('activated_date'), P('season_end_date'))
  - remaining_share: K('whole_share') if P('operating_days_included') * K('day_block_quarter') < season_span else
      (season_left_a / held_span if (F('activated_date') > P('season_start_date') and held_span > 0) else season_left_a
