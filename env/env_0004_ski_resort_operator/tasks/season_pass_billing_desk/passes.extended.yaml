      is taken; and where it shows at least one lift scan entry but fewer than that number, nineteen twentieths
      of the gross amount is taken.
    retained_standing: Where that charge stands on the pass account and the account still shows an amount to collect,
      the whole of it is taken off; and where that charge stands on the pass account and the account shows nothing
      left to collect, half of it is taken off.
    retained_offset_rate: None of the charge retained on the pass being given up is taken off. Where that charge
      stands on the pass account and the account still shows an amount to collect, the whole of it is taken off;
      and where that charge stands on the pass account and the account shows nothing left to collect, half of it
      is taken off.
    protection_state_a: Where the collective's protection records show a plan written over a season pass on the
      household account whose claim has been settled, the whole of what that plan has paid out this season is taken
      off, because the household is not put in funds twice for the same season; and where those records show such
      a plan with a claim still open, half of what it has paid out is taken off.
    protection_payout: Where the collective's protection records show a plan written over a season pass on the household
      account whose claim has been settled, the whole of what that plan has paid out this season is taken off, because
      the household is not put in funds twice for the same season; and where those records show such a plan with
      a claim still open, half of what it has paid out is taken off.
    payout_offset_rate: Nothing the protection plan has paid out is taken off. Where the collective's protection
      records show a plan written over a season pass on the household account whose claim has been settled, the
      whole of what that plan has paid out this season is taken off, because the household is not put in funds twice
      for the same season; and where those records show such a plan with a claim still open, half of what it has
      paid out is taken off.
    plan_entries: Where the pass account shows an amount placed on it to be collected by instalments and the price
      is still being collected, the figure is increased by a twentieth; and where the pass account shows no amount
      placed on it to be collected by instalments and the pass was paid in full at the outset, it is increased by
      a tenth.
    uplift_rate: No uplift is added for taking the value back as resort credit. Where the pass account shows an
      amount placed on it to be collected by instalments and the price is still being collected, the figure is increased
      by a twentieth; and where the pass account shows no amount placed on it to be collected by instalments and
      the pass was paid in full at the outset, it is increased by a tenth.
    net_back_usd: The amount coming back is the gross amount taken at the scan share, less the charge retained taken
      at the offset share and less what the protection plan has paid out taken at the payout share, and the figure
      that gives is then taken at the credit uplift; it is rounded to the cent once at the end and is never below
      zero.
    result: The amount coming back is the gross amount taken at the scan share, less the charge retained taken at
      the offset share and less what the protection plan has paid out taken at the payout share, and the figure
      that gives is then taken at the credit uplift; it is rounded to the cent once at the end and is never below
      zero.
    scans_counted: Where the pass account shows at least the number of lift scan entries the charter treats as heavy
      use, nine tenths of the gross amount is taken; and where it shows at least one lift scan entry but fewer than
      that number, nineteen twentieths of the gross amount is taken.
    scan_entries: Where the tier's refund basis is the pro rata basis and the pass account shows at least one lift
      scan entry, the gross amount is instead the price committed to multiplied by the share of the season still
      to come, with no day use deduction taken; and where the tier's refund basis is the pro rata basis and the
      pass account shows no lift scan entry at all, the gross amount is instead the price committed to in full.
  factors:
  - id: remaining_share_basis
    effect: method
    decides: remaining_share
    bindings:
    - season_span
    - season_left_a
    - held_span
    - remaining_share
    ladder:
    - when: the tier admits the holder on fewer days than a quarter of the days the season runs
      method: the share still to come is the whole, a pass sold as a block of days not being used up by the calendar
    - when: the tier admits the holder on at least a quarter of the days the season runs and the pass became scannable
        after the day the season opened
      method: the share still to come is the days from the handling date to the season's last day set against the
        days from the day the pass became scannable to the season's last day
    - when: otherwise
      method: the share still to come is the days from the handling date to the season's last day set against the
        days of the season itself
    baseline:
      remaining_share: season_left_a / season_span
    evidence:
    - date
    - tier_param
    cross_difficulty: null
  - id: gross_back_basis
    effect: method
    decides: gross_back_usd
    bindings:
    - scan_entries
    - gross_back_usd
    ladder:
    - when: the tier's refund basis is the pro rata basis and the pass account shows at least one lift scan entry
      method: the gross amount is the price committed to multiplied by the share of the season still to come, with
        no day use deduction taken
    - when: the tier's refund basis is the pro rata basis and the pass account shows no lift scan entry at all
      method: the gross amount is the price committed to in full
    - when: otherwise
      method: the gross amount is the price committed to multiplied by the share of the season still to come, less
        the tier's day use deduction taken once, and never below zero
    baseline:
      gross_back_usd: MX(0, F('price_paid_usd') * remaining_share - P('day_use_deduction_usd'))
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: scan_share
    effect: parameter
    decides: use_rate
    bindings:
    - scans_counted
    - use_rate
    ladder:
    - when: the pass account shows at least the number of lift scan entries the charter treats as heavy use
      value: K('use_rate_heavy')
    - when: the pass account shows at least one lift scan entry but fewer than the number the charter treats as
        heavy use
      value: K('use_rate_light')
    - when: otherwise
      value: K('use_rate_none')
    baseline:
      use_rate: K('use_rate_none')
    evidence:
    - history
    cross_difficulty: null
  - id: retained_charge_offset
    effect: parameter
    decides: retained_offset_rate
    bindings:
    - retained_standing
    - retained_offset_rate
    ladder:
    - when: the charge retained stands on the pass account and the account still shows an amount to collect
      value: K('offset_full')
    - when: the charge retained stands on the pass account and the account shows nothing left to collect
      value: K('offset_part')
    - when: otherwise
      value: K('offset_none')
    baseline:
      retained_offset_rate: K('offset_none')
    evidence:
    - history
    cross_difficulty: null
  - id: protection_payout_offset
    effect: parameter
    decides: payout_offset_rate
    bindings:
    - protection_state_a
    - protection_payout
    - payout_offset_rate
    ladder:
    - when: the protection records show a plan written over a season pass on the household account whose claim has
        been settled
      value: K('payout_full')
    - when: the protection records show such a plan with a claim still open
      value: K('payout_part')
    - when: otherwise
      value: K('payout_none')
    baseline:
      payout_offset_rate: K('payout_none')
    evidence:
    - cross_category
    - history
    cross_difficulty: insure
  - id: credit_uplift
    effect: parameter
    decides: uplift_rate
    bindings:
    - plan_entries
    - uplift_rate
    ladder:
    - when: the pass account shows an amount placed on it to be collected by instalments and the price is still
        being collected
      value: K('uplift_financed')
    - when: the pass account shows no amount placed on it to be collected by instalments and the pass was paid in
        full at the outset
      value: K('uplift_paid')
    - when: otherwise
      value: K('uplift_none')
    baseline:
      uplift_rate: K('uplift_none')
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: When a season pass has been given up, resort credit is issued against the pass record for what comes back
      to the household, and this rule fixes that amount. The share of the season still to come is the days from
      the handling date to the season's last day set against the days of the season itself. The gross amount coming
      back is the price committed to on the pass record multiplied by the share of the season still to come, less
      the tier's day use deduction taken once, and never below zero. The gross amount is taken as it stands whatever
      the pass account shows. None of the charge retained on the pass being given up is taken off. Nothing the protection
      plan has paid out is taken off. No uplift is added for taking the value back as resort credit. The amount
      coming back is the gross amount taken at the scan share, less the charge retained taken at the offset share
      and less what the protection plan has paid out taken at the payout share, and the figure that gives is then
      taken at the credit uplift; it is rounded to the cent once at the end and is never below zero.
    params:
    - use_rate_none
    - offset_none
    - payout_none
    - uplift_none
    - day_use_deduction_usd
  inputs:
    history:
    - table: passes_ledger
      aggregate: count
      field: pass_event_id
      within_months: null
      filters:
        event_type: passes_scan
    - table: passes_ledger
      aggregate: sum
      field: amount_usd
      within_months: null
      filters:
        event_type: passes_fee_charge
        charge_category: cancellation_fee
    - category: insure
      table: insure_ledger
      aggregate: sum
      field: amount_usd
      within_months: null
      filters:
        event_type: insure_claim_payment
    cross_category:
    - insure
