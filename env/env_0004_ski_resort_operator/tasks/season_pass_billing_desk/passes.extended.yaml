    cross_difficulty: null
  - id: uncured_refusal_window
    effect: method
    decides: uncured_count
    bindings:
    - refusals_recent
    - uncured_count
    ladder:
    - when: the pass record no longer admits the holder
      method: the refusals left uncured are counted as every late fee raised on the pass account since the plan
        was opened
    - when: the pass record still admits the holder and the pass account carries a refusal in the three whole months
        ending on the handling date
      method: the refusals left uncured are counted as the late fees raised in the three whole months ending on
        the handling date
    - when: otherwise
      method: the refusals left uncured are counted as the late fees raised in the cycle of the handling date
    baseline:
      uncured_count: COUNT('passes_ledger', within_months=1, event_type='passes_late_fee')
    evidence:
