  - id: passes_installment_plan
    subject: [passes_plan_open, passes_installment_charge]
    rule: >
      A pass may be financed where the tier offers instalments. The financed amount is the price
      committed to on the pass record, less the deposit already taken, plus the tier's plan service fee,
      and it is placed on the pass account in one entry when the plan is opened. That amount is divided
      into the tier's number of scheduled instalments; the division is to the cent, and any remainder of
      a cent is carried into the final instalment so the schedule sums exactly to the financed amount.
      An instalment plan is opened only where a stored payment method is already recorded against the
      household account. Each instalment falls on the tier's charge day of the month. Where a month has
      no such day, the instalment falls on the last day of that month. No instalment is presented
      earlier than the plan's first charge lag counted in calendar days from the day the instalment plan
      was opened. Calendar days are counted forward from the anchor date, the anchor date itself
      counting as day zero, every day of the week counting alike, and a calendar day is never mixed with
      a full 24-hour period; where the resulting boundary falls on a date that does not exist in the
      target month, the last day of that month is used. The plan is opened only while the pass record
      stands in the applied, pending_activation or active state. A guest may settle the whole remaining
      balance at any time without penalty, which closes the schedule; partial prepayment reduces the
      final instalments in reverse order and never the next one due.
    eligibility:
      - id: plan_open_state
        applies_to: [passes_plan_open]
        kind: state
        condition: "The plan is opened only while the pass record stands in the applied, pending_activation or active state."
        evidence_fields: [passes_holdings.status, passes_holdings.pass_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [passes_holdings.pass_id]
          action_bindings:
            passes_holdings.pass_id: pass_id
        state_contract:
          field: passes_holdings.status
          allowed: [applied, pending_activation, active]
      - id: stored_payment_method_on_file
        applies_to: [passes_plan_open]
        kind: authorization
        condition: "An instalment plan is opened only where a stored payment method is already recorded against the household account."
        evidence_fields: [customers.customer_id, customers.stored_payment_method]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [customers.customer_id]
          action_bindings:
            customers.customer_id: customer_id
      - id: first_charge_lag
        applies_to: [passes_installment_charge]
        kind: time
        condition: "No instalment is presented earlier than the plan's first charge lag counted in calendar days from the day the instalment plan was opened."
        evidence_fields: [passes_ledger.pass_id, passes_ledger.event_type, passes_ledger.event_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [passes_ledger.pass_id]
          action_bindings:
            passes_ledger.pass_id: pass_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the instalment plan was opened"
          anchor_source: passes_ledger.event_date
          relation: not_before
          duration_source: params.first_charge_lag_days
          unit: calendar_days
          counting_rule: "Calendar days are counted forward from the anchor date, the anchor date itself counting as day zero, every day of the week counting alike, and a calendar day is never mixed with a full 24-hour period; where the resulting boundary falls on a date that does not exist in the target month, the last day of that month is used."
          boundary: inclusive
    params:
      first_charge_lag_days: 30
      per_tier:
        Granite Ridge Four-Day Flex Pass: {installment_plan_offered: "=installment_plan_offered", installment_count: "=installment_count", installment_charge_day_of_month: "=installment_charge_day_of_month", installment_service_fee_usd: "=installment_service_fee_usd", autopay_required: "=autopay_required"}
        Granite Ridge Midweek Pass: {installment_plan_offered: "=installment_plan_offered", installment_count: "=installment_count", installment_charge_day_of_month: "=installment_charge_day_of_month", installment_service_fee_usd: "=installment_service_fee_usd", autopay_required: "=autopay_required"}
        Granite Ridge Local Pass: {installment_plan_offered: "=installment_plan_offered", installment_count: "=installment_count", installment_charge_day_of_month: "=installment_charge_day_of_month", installment_service_fee_usd: "=installment_service_fee_usd", autopay_required: "=autopay_required"}
        Granite Ridge Summit Pass: {installment_plan_offered: "=installment_plan_offered", installment_count: "=installment_count", installment_charge_day_of_month: "=installment_charge_day_of_month", installment_service_fee_usd: "=installment_service_fee_usd", autopay_required: "=autopay_required"}
        Granite Ridge Summit Plus Pass: {installment_plan_offered: "=installment_plan_offered", installment_count: "=installment_count", installment_charge_day_of_month: "=installment_charge_day_of_month", installment_service_fee_usd: "=installment_service_fee_usd", autopay_required: "=autopay_required"}
        Granite Ridge Collective Unlimited Pass: {installment_plan_offered: "=installment_plan_offered", installment_count: "=installment_count", installment_charge_day_of_month: "=installment_charge_day_of_month", installment_service_fee_usd: "=installment_service_fee_usd", autopay_required: "=autopay_required"}
        Granite Ridge Collective Elite Pass: {installment_plan_offered: "=installment_plan_offered", installment_count: "=installment_count", installment_charge_day_of_month: "=installment_charge_day_of_month", installment_service_fee_usd: "=installment_service_fee_usd", autopay_required: "=autopay_required"}
    formula:
      financed_amount_usd: "round(price_paid_usd - deposit_usd + installment_service_fee_usd, 2)"
      installment_amount_usd: "round(financed_amount_usd / installment_count, 2)"

  - id: passes_evt_decline_handling
    subject: [passes_installment_decline, passes_late_fee]
    rule: >
      When a scheduled instalment is refused by the payment method on file, the refusal is recorded with
      the reason the payment method gave, and the same instalment is presented again after the tier's
      retry interval. A late fee answers only to a refusal the collective's own pass account records
      show, never to a refusal the guest reports. A late fee is placed on the pass account only once the
      grace period has run out counted in calendar days from the day the instalment was refused.
      Calendar days are counted forward from the anchor date, the anchor date itself counting as day
      zero, every day of the week counting alike, and a calendar day is never mixed with a full 24-hour
      period; where the resulting boundary falls on a date that does not exist in the target month, the
      last day of that month is used. Exactly one late fee attaches to one refused instalment however
      many times that instalment is presented again, and a refusal recorded with no reason from the
      payment method carries no late fee at all. Where the guest settles the refused instalment inside
      the grace period by any means, no late fee arises and the schedule carries on untouched. A late
      fee already placed on the pass account is reversed only where the refusal was the collective's own
      error, which is a decision for the finance team and not for the desk.
    eligibility:
      - id: refusal_is_on_record
        applies_to: [passes_late_fee]
        kind: authorization
        condition: "A late fee answers only to a refusal the collective's own pass account records show, never to a refusal the guest reports."
        evidence_fields: [passes_ledger.pass_event_id, passes_ledger.event_type, passes_ledger.decline_code]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [passes_ledger.pass_event_id]
          action_bindings:
            passes_ledger.pass_event_id: related_event_id
      - id: grace_has_run_out
        applies_to: [passes_late_fee]
        kind: time
        condition: "A late fee is placed on the pass account only once the grace period has run out counted in calendar days from the day the instalment was refused."
        evidence_fields: [passes_ledger.pass_event_id, passes_ledger.event_date, passes_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [passes_ledger.pass_event_id]
          action_bindings:
            passes_ledger.pass_event_id: related_event_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the instalment was refused"
          anchor_source: passes_ledger.event_date
          relation: not_before
          duration_source: variants.late_fee_grace_days
          unit: calendar_days
          counting_rule: "Calendar days are counted forward from the anchor date, the anchor date itself counting as day zero, every day of the week counting alike, and a calendar day is never mixed with a full 24-hour period; where the resulting boundary falls on a date that does not exist in the target month, the last day of that month is used."
          boundary: inclusive
    params:
      per_tier:
        Granite Ridge Four-Day Flex Pass: {late_fee_usd: "=late_fee_usd", late_fee_grace_days: "=late_fee_grace_days", declined_charge_retry_days: "=declined_charge_retry_days"}
        Granite Ridge Midweek Pass: {late_fee_usd: "=late_fee_usd", late_fee_grace_days: "=late_fee_grace_days", declined_charge_retry_days: "=declined_charge_retry_days"}
        Granite Ridge Local Pass: {late_fee_usd: "=late_fee_usd", late_fee_grace_days: "=late_fee_grace_days", declined_charge_retry_days: "=declined_charge_retry_days"}
        Granite Ridge Summit Pass: {late_fee_usd: "=late_fee_usd", late_fee_grace_days: "=late_fee_grace_days", declined_charge_retry_days: "=declined_charge_retry_days"}
        Granite Ridge Summit Plus Pass: {late_fee_usd: "=late_fee_usd", late_fee_grace_days: "=late_fee_grace_days", declined_charge_retry_days: "=declined_charge_retry_days"}
        Granite Ridge Collective Unlimited Pass: {late_fee_usd: "=late_fee_usd", late_fee_grace_days: "=late_fee_grace_days", declined_charge_retry_days: "=declined_charge_retry_days"}
        Granite Ridge Collective Elite Pass: {late_fee_usd: "=late_fee_usd", late_fee_grace_days: "=late_fee_grace_days", declined_charge_retry_days: "=declined_charge_retry_days"}
    formula:
      when_not: "decline_code == 'none'"
      amount_usd: "late_fee_usd"

  - id: passes_arrears_suspension
    subject: [passes_suspend, passes_reinstate]
    rule: >
      A pass account that stands in arrears loses its scanning privileges rather than its contract. The
      arrears position is the amount still to be collected that is already past its scheduled date.
      Scanning privileges are withdrawn only once the tolerated arrears period has run out counted in
      calendar days from the day the earliest unsettled instalment was refused. Calendar days are
      counted forward from the anchor date, the anchor date itself counting as day zero, every day of
      the week counting alike, and a calendar day is never mixed with a full 24-hour period; where the
      resulting boundary falls on a date that does not exist in the target month, the last day of that
      month is used. A pass is also brought into suspension review once refusals on it in the rolling
      review window reach the tier's tolerance, whether or not the arrears period has run out. A
      suspended pass keeps its tier, its price and its schedule; only admission stops, and the remaining
      instalments continue to be presented. Privileges are restored only when the pass account records
      show every refused instalment settled. Restoration places the tier's reinstatement fee on the pass
      account, and that fee is not charged where the refusal was the collective's own error. A pass may
      be suspended and restored more than once in a season, and each restoration carries its own fee.
    eligibility:
      - id: arrears_period_elapsed
        applies_to: [passes_suspend]
        kind: time
        condition: "Scanning privileges are withdrawn only once the tolerated arrears period has run out counted in calendar days from the day the earliest unsettled instalment was refused."
        evidence_fields: [passes_ledger.pass_id, passes_ledger.event_date, passes_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [passes_ledger.pass_id]
          action_bindings:
            passes_ledger.pass_id: pass_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the earliest unsettled instalment was refused"
          anchor_source: passes_ledger.event_date
          relation: not_before
          duration_source: variants.arrears_suspension_days
          unit: calendar_days
          counting_rule: "Calendar days are counted forward from the anchor date, the anchor date itself counting as day zero, every day of the week counting alike, and a calendar day is never mixed with a full 24-hour period; where the resulting boundary falls on a date that does not exist in the target month, the last day of that month is used."
          boundary: inclusive
      - id: arrears_settled_on_record
        applies_to: [passes_reinstate]
        kind: authorization
        condition: "Privileges are restored only when the pass account records show every refused instalment settled."
        evidence_fields: [passes_ledger.pass_id, passes_ledger.event_type, passes_ledger.amount_usd]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [passes_ledger.pass_id]
          action_bindings:
            passes_ledger.pass_id: pass_id
    params:
      per_tier:
        Granite Ridge Four-Day Flex Pass: {arrears_suspension_days: "=arrears_suspension_days", max_declines_before_suspension: "=max_declines_before_suspension", reinstatement_fee_usd: "=reinstatement_fee_usd"}
        Granite Ridge Midweek Pass: {arrears_suspension_days: "=arrears_suspension_days", max_declines_before_suspension: "=max_declines_before_suspension", reinstatement_fee_usd: "=reinstatement_fee_usd"}
        Granite Ridge Local Pass: {arrears_suspension_days: "=arrears_suspension_days", max_declines_before_suspension: "=max_declines_before_suspension", reinstatement_fee_usd: "=reinstatement_fee_usd"}
        Granite Ridge Summit Pass: {arrears_suspension_days: "=arrears_suspension_days", max_declines_before_suspension: "=max_declines_before_suspension", reinstatement_fee_usd: "=reinstatement_fee_usd"}
        Granite Ridge Summit Plus Pass: {arrears_suspension_days: "=arrears_suspension_days", max_declines_before_suspension: "=max_declines_before_suspension", reinstatement_fee_usd: "=reinstatement_fee_usd"}
        Granite Ridge Collective Unlimited Pass: {arrears_suspension_days: "=arrears_suspension_days", max_declines_before_suspension: "=max_declines_before_suspension", reinstatement_fee_usd: "=reinstatement_fee_usd"}
        Granite Ridge Collective Elite Pass: {arrears_suspension_days: "=arrears_suspension_days", max_declines_before_suspension: "=max_declines_before_suspension", reinstatement_fee_usd: "=reinstatement_fee_usd"}
    measures: [passes_msr_declines_rolling_90d]

  - id: passes_upgrade_terms
    subject: [passes_upgrade, passes_upgrade_charge]
    rule: >
      A holder may move up to a higher tier during the season where the tier they hold offers a move up
      and the higher tier's entry conditions are met. A move up is recorded only on a pass record that
      stands in the active state. The amount due is worked out on the tier's differential basis: on the
      list price basis it is the higher tier's standard season price less the price committed to on the
      pass record, and on the price paid basis it is the higher tier's price worked out as if the guest
      were buying it today, less the price committed to on the pass record. The tier's move up service
      fee is added, and the total is placed on the pass account as one entry; where the pass is
      financed, that entry joins the existing schedule and the remaining instalments are re-divided over
      the instalments still to fall. Resort credit held on the pass may be applied to the amount due.
      The amount due is never negative: where the higher tier works out cheaper than what the guest has
      already committed to, the move up is recorded at no charge and no credit is issued. A pass that
      already shows a tier it was moved up from in this season is not moved up a second time. A move
      down within a season is not offered at all, and the days already skied do not reduce the amount
      due, because the higher tier is priced for the season and not for the days remaining.
    eligibility:
      - id: upgrade_from_active_pass
        applies_to: [passes_upgrade]
        kind: state
        condition: "A move up is recorded only on a pass record that stands in the active state."
        evidence_fields: [passes_holdings.pass_id, passes_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [passes_holdings.pass_id]
          action_bindings:
            passes_holdings.pass_id: pass_id
        state_contract:
          field: passes_holdings.status
          allowed: [active]
      - id: one_move_up_per_season
        applies_to: [passes_upgrade]
        kind: dedup
        condition: "A pass that already shows a tier it was moved up from in this season is not moved up a second time."
        evidence_fields: [passes_holdings.pass_id, passes_holdings.upgrade_from_variant, passes_holdings.season_code]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [passes_holdings.pass_id]
          action_bindings:
            passes_holdings.pass_id: pass_id
        dedup_contract:
          table: passes_holdings
          mode: same_record
          object_bindings: {pass_id: pass_id}
          duplicate_filters:
            upgrade_from_variant: [Granite Ridge Four-Day Flex Pass, Granite Ridge Midweek Pass, Granite Ridge Local Pass, Granite Ridge Summit Pass, Granite Ridge Summit Plus Pass, Granite Ridge Collective Unlimited Pass, Granite Ridge Collective Elite Pass]
          distinct_fields: [season_code]
    params:
      target_list_price_usd: "=pass_price_usd"
      per_tier:
        Granite Ridge Four-Day Flex Pass: {upgrade_offered: "=upgrade_offered", upgrade_differential_basis: "=upgrade_differential_basis", upgrade_service_fee_usd: "=upgrade_service_fee_usd", upgrade_deadline: "=upgrade_deadline"}
        Granite Ridge Midweek Pass: {upgrade_offered: "=upgrade_offered", upgrade_differential_basis: "=upgrade_differential_basis", upgrade_service_fee_usd: "=upgrade_service_fee_usd", upgrade_deadline: "=upgrade_deadline"}
        Granite Ridge Local Pass: {upgrade_offered: "=upgrade_offered", upgrade_differential_basis: "=upgrade_differential_basis", upgrade_service_fee_usd: "=upgrade_service_fee_usd", upgrade_deadline: "=upgrade_deadline"}
        Granite Ridge Summit Pass: {upgrade_offered: "=upgrade_offered", upgrade_differential_basis: "=upgrade_differential_basis", upgrade_service_fee_usd: "=upgrade_service_fee_usd", upgrade_deadline: "=upgrade_deadline"}
        Granite Ridge Summit Plus Pass: {upgrade_offered: "=upgrade_offered", upgrade_differential_basis: "=upgrade_differential_basis", upgrade_service_fee_usd: "=upgrade_service_fee_usd", upgrade_deadline: "=upgrade_deadline"}
        Granite Ridge Collective Unlimited Pass: {upgrade_offered: "=upgrade_offered", upgrade_differential_basis: "=upgrade_differential_basis", upgrade_service_fee_usd: "=upgrade_service_fee_usd", upgrade_deadline: "=upgrade_deadline"}
        Granite Ridge Collective Elite Pass: {upgrade_offered: "=upgrade_offered", upgrade_differential_basis: "=upgrade_differential_basis", upgrade_service_fee_usd: "=upgrade_service_fee_usd", upgrade_deadline: "=upgrade_deadline"}
    formula:
      when_not: "upgrade_offered == false"
      amount_usd: "max(0, round(target_list_price_usd - price_paid_usd + upgrade_service_fee_usd, 2))"

  - id: passes_cancellation_refund
    subject: [passes_cancel, passes_credit_issue]
    rule: >
      A guest may give up a pass, and what comes back to them depends on when they say so and on how
      much of the season they have already taken. The cancellation is honoured for a refund only when it
      is recorded no later than the cancellation window counted in calendar days from the day the pass
      application was recorded. Calendar days are counted forward from the anchor date, the anchor date
      itself counting as day zero, every day of the week counting alike, and a calendar day is never
      mixed with a full 24-hour period; where the resulting boundary falls on a date that does not exist
      in the target month, the last day of that month is used. Inside the window the refundable amount
      is worked out on the tier's refund basis: on the day use basis it is the price committed to, less
      the tier's cancellation fee, less the tier's day use deduction for each day already scanned on the
      pass; on the pro rata basis it is the price committed to, less the tier's cancellation fee,
      multiplied by the share of the season's operating days still to come. The refundable amount is
      never below zero. Outside the window nothing is refundable and the pass runs to the end of the
      season unless the guest still wants it cancelled for their own reasons. A cancellation given on
      medical grounds is honoured only when the collective's protection records already show a settled
      claim on a protection plan held by the same household account. A pass record that already stands
      in the cancelled or closed state is not cancelled again. What comes back is issued as resort
      credit against the pass record, and a return to the original payment method is a finance team
      decision rather than a desk decision.
    eligibility:
      - id: inside_cancellation_window
        applies_to: [passes_cancel]
        kind: time
        condition: "The cancellation is honoured for a refund only when it is recorded no later than the cancellation window counted in calendar days from the day the pass application was recorded."
        evidence_fields: [passes_holdings.pass_id, passes_holdings.applied_date, passes_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [passes_holdings.pass_id]
          action_bindings:
            passes_holdings.pass_id: pass_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the pass application was recorded"
          anchor_source: passes_holdings.applied_date
          relation: not_after
          duration_source: variants.cancellation_window_days
          unit: calendar_days
          counting_rule: "Calendar days are counted forward from the anchor date, the anchor date itself counting as day zero, every day of the week counting alike, and a calendar day is never mixed with a full 24-hour period; where the resulting boundary falls on a date that does not exist in the target month, the last day of that month is used."
          boundary: inclusive
      - id: medical_claim_settled
        applies_to: [passes_cancel, passes_credit_issue]
        kind: authorization
        condition: "A cancellation given on medical grounds is honoured only when the collective's protection records already show a settled claim on a protection plan held by the same household account."
        evidence_fields: [insure_holdings.protection_plan_id, insure_holdings.customer_id, insure_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [insure_holdings.protection_plan_id]
          action_bindings:
            insure_holdings.protection_plan_id: protection_plan_id
      - id: not_already_given_up
        applies_to: [passes_cancel]
        kind: dedup
        condition: "A pass record that already stands in the cancelled or closed state is not cancelled again."
        evidence_fields: [passes_holdings.pass_id, passes_holdings.status, passes_holdings.season_code]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [passes_holdings.pass_id]
          action_bindings:
            passes_holdings.pass_id: pass_id
        dedup_contract:
          table: passes_holdings
          mode: same_record
          object_bindings: {pass_id: pass_id}
          duplicate_filters: {status: [cancelled, closed]}
          distinct_fields: [season_code]
    params:
      per_tier:
        Granite Ridge Four-Day Flex Pass: {cancellation_window_days: "=cancellation_window_days", cancellation_fee_usd: "=cancellation_fee_usd", refund_basis: "=refund_basis", day_use_deduction_usd: "=day_use_deduction_usd"}
        Granite Ridge Midweek Pass: {cancellation_window_days: "=cancellation_window_days", cancellation_fee_usd: "=cancellation_fee_usd", refund_basis: "=refund_basis", day_use_deduction_usd: "=day_use_deduction_usd"}
        Granite Ridge Local Pass: {cancellation_window_days: "=cancellation_window_days", cancellation_fee_usd: "=cancellation_fee_usd", refund_basis: "=refund_basis", day_use_deduction_usd: "=day_use_deduction_usd"}
        Granite Ridge Summit Pass: {cancellation_window_days: "=cancellation_window_days", cancellation_fee_usd: "=cancellation_fee_usd", refund_basis: "=refund_basis", day_use_deduction_usd: "=day_use_deduction_usd"}
        Granite Ridge Summit Plus Pass: {cancellation_window_days: "=cancellation_window_days", cancellation_fee_usd: "=cancellation_fee_usd", refund_basis: "=refund_basis", day_use_deduction_usd: "=day_use_deduction_usd"}
        Granite Ridge Collective Unlimited Pass: {cancellation_window_days: "=cancellation_window_days", cancellation_fee_usd: "=cancellation_fee_usd", refund_basis: "=refund_basis", day_use_deduction_usd: "=day_use_deduction_usd"}
        Granite Ridge Collective Elite Pass: {cancellation_window_days: "=cancellation_window_days", cancellation_fee_usd: "=cancellation_fee_usd", refund_basis: "=refund_basis", day_use_deduction_usd: "=day_use_deduction_usd"}
    formula:
      when_not: "refund_basis == 'pro_rata_by_operating_days'"
      refundable_usd: "max(0, round(price_paid_usd - cancellation_fee_usd - day_use_deduction_usd * passes_msr_season_scan_days, 2))"
    measures: [passes_msr_season_scan_days]

  - id: passes_credit_redemption
    subject: [passes_credit_redeem]
    rule: >
      Resort credit issued against a pass record is spent, not paid out. It may be applied to any charge
      raised on that household account across the collective, taking the charge down before any payment
      method is presented. Resort credit is applied only when it is applied no later than its validity
      period counted in calendar days from the day the credit was issued. Calendar days are counted
      forward from the anchor date, the anchor date itself counting as day zero, every day of the week
      counting alike, and a calendar day is never mixed with a full 24-hour period; where the resulting
      boundary falls on a date that does not exist in the target month, the last day of that month is
      used. A single application of credit must be at least the tier's minimum, and credit may be
      applied to part of a charge, leaving the remainder to be paid. Resort credit is applied only while
      the pass record it sits on has not reached the cancelled or closed state. Credit is never
      exchanged for cash, never transferred to another household account, and never reinstated once its
      validity period has run out. Where several credit entries sit on one pass, the entry closest to
      running out is applied first.
    eligibility:
      - id: credit_within_validity
        applies_to: [passes_credit_redeem]
        kind: time
        condition: "Resort credit is applied only when it is applied no later than its validity period counted in calendar days from the day the credit was issued."
        evidence_fields: [passes_ledger.pass_event_id, passes_ledger.event_date, passes_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [passes_ledger.pass_event_id]
          action_bindings:
            passes_ledger.pass_event_id: related_event_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the credit was issued"
          anchor_source: passes_ledger.event_date
          relation: not_after
          duration_source: variants.credit_validity_days
          unit: calendar_days
          counting_rule: "Calendar days are counted forward from the anchor date, the anchor date itself counting as day zero, every day of the week counting alike, and a calendar day is never mixed with a full 24-hour period; where the resulting boundary falls on a date that does not exist in the target month, the last day of that month is used."
          boundary: inclusive
      - id: credit_record_state
        applies_to: [passes_credit_redeem]
        kind: state
        condition: "Resort credit is applied only while the pass record it sits on has not reached the cancelled or closed state."
        evidence_fields: [passes_holdings.pass_id, passes_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [passes_holdings.pass_id]
          action_bindings:
            passes_holdings.pass_id: pass_id
        state_contract:
          field: passes_holdings.status
          allowed: [applied, pending_activation, active, suspended, deferred, expired]
    params:
      per_tier:
        Granite Ridge Four-Day Flex Pass: {credit_validity_days: "=credit_validity_days", credit_minimum_redemption_usd: "=credit_minimum_redemption_usd"}
        Granite Ridge Midweek Pass: {credit_validity_days: "=credit_validity_days", credit_minimum_redemption_usd: "=credit_minimum_redemption_usd"}
        Granite Ridge Local Pass: {credit_validity_days: "=credit_validity_days", credit_minimum_redemption_usd: "=credit_minimum_redemption_usd"}
        Granite Ridge Summit Pass: {credit_validity_days: "=credit_validity_days", credit_minimum_redemption_usd: "=credit_minimum_redemption_usd"}
        Granite Ridge Summit Plus Pass: {credit_validity_days: "=credit_validity_days", credit_minimum_redemption_usd: "=credit_minimum_redemption_usd"}
        Granite Ridge Collective Unlimited Pass: {credit_validity_days: "=credit_validity_days", credit_minimum_redemption_usd: "=credit_minimum_redemption_usd"}
        Granite Ridge Collective Elite Pass: {credit_validity_days: "=credit_validity_days", credit_minimum_redemption_usd: "=credit_minimum_redemption_usd"}

  - id: passes_deferral
    subject: [passes_defer, passes_resume_deferred]
    rule: >
      Where the tier offers it, a holder who cannot ski the season may carry the pass forward to the
      following season instead of giving it up. A carry-forward is accepted only when it is recorded no
      later than the election period counted in calendar days from the day the pass was activated.
      Calendar days are counted forward from the anchor date, the anchor date itself counting as day
      zero, every day of the week counting alike, and a calendar day is never mixed with a full 24-hour
      period; where the resulting boundary falls on a date that does not exist in the target month, the
      last day of that month is used. A carry-forward is accepted only when the collective's scan
      records show no day used on the pass in the season being given up. The tier's carry-forward fee is
      placed on the pass account when the election is recorded, and that fee is not charged where the
      household holds a protection plan standing in the active or claim_open state at the moment of the
      election. The carried-forward pass returns at the tier it was bought at and at the price already
      committed to, even where that tier's price has moved; it is not repriced and it does not earn the
      renewal reduction a second time. A pass carried forward may not also be cancelled for a refund,
      because the value has already been moved rather than returned. The pass becomes scannable again on
      the opening day of the season it was carried forward to, and a pass carried forward that is not
      used in that season expires with no further value.
      A carry-forward is elected only on a tier that is itself eligible to carry a protection
      plan, because the carry-forward and the protection plan are the two routes the collective
      offers to the same relief and it offers neither on a tier sold without the other.
    eligibility:
      - id: within_election_period
        applies_to: [passes_defer]
        kind: time
        condition: "A carry-forward is accepted only when it is recorded no later than the election period counted in calendar days from the day the pass was activated."
        evidence_fields: [passes_holdings.pass_id, passes_holdings.activated_date, passes_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [passes_holdings.pass_id]
          action_bindings:
            passes_holdings.pass_id: pass_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the pass was activated"
          anchor_source: passes_holdings.activated_date
          relation: not_after
          duration_source: variants.deferral_election_days
          unit: calendar_days
          counting_rule: "Calendar days are counted forward from the anchor date, the anchor date itself counting as day zero, every day of the week counting alike, and a calendar day is never mixed with a full 24-hour period; where the resulting boundary falls on a date that does not exist in the target month, the last day of that month is used."
          boundary: inclusive
      - id: no_days_taken
        applies_to: [passes_defer]
        kind: authorization
        condition: "A carry-forward is accepted only when the collective's scan records show no day used on the pass in the season being given up."
        evidence_fields: [passes_ledger.pass_id, passes_ledger.event_type, passes_ledger.event_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [passes_ledger.pass_id]
          action_bindings:
            passes_ledger.pass_id: pass_id
    params:
      per_tier:
        Granite Ridge Four-Day Flex Pass: {deferral_offered: "=deferral_offered", deferral_fee_usd: "=deferral_fee_usd", deferral_election_days: "=deferral_election_days", protection_plan_eligible: "=protection_plan_eligible"}
        Granite Ridge Midweek Pass: {deferral_offered: "=deferral_offered", deferral_fee_usd: "=deferral_fee_usd", deferral_election_days: "=deferral_election_days", protection_plan_eligible: "=protection_plan_eligible"}
        Granite Ridge Local Pass: {deferral_offered: "=deferral_offered", deferral_fee_usd: "=deferral_fee_usd", deferral_election_days: "=deferral_election_days", protection_plan_eligible: "=protection_plan_eligible"}
        Granite Ridge Summit Pass: {deferral_offered: "=deferral_offered", deferral_fee_usd: "=deferral_fee_usd", deferral_election_days: "=deferral_election_days", protection_plan_eligible: "=protection_plan_eligible"}
        Granite Ridge Summit Plus Pass: {deferral_offered: "=deferral_offered", deferral_fee_usd: "=deferral_fee_usd", deferral_election_days: "=deferral_election_days", protection_plan_eligible: "=protection_plan_eligible"}
        Granite Ridge Collective Unlimited Pass: {deferral_offered: "=deferral_offered", deferral_fee_usd: "=deferral_fee_usd", deferral_election_days: "=deferral_election_days", protection_plan_eligible: "=protection_plan_eligible"}
        Granite Ridge Collective Elite Pass: {deferral_offered: "=deferral_offered", deferral_fee_usd: "=deferral_fee_usd", deferral_election_days: "=deferral_election_days", protection_plan_eligible: "=protection_plan_eligible"}
    measures: [passes_msr_season_scan_days]

  - id: passes_access_control
    subject: [passes_scan]
    rule: >
      A scan admits the holder only where every access condition of the tier is met at that moment. A
      scan admits the holder only while the pass record stands in the active state. The mountain must be
      one the tier includes; a scan at a mountain outside the tier is refused at the lift and the guest
      is offered a window ticket. Where the tier is midweek only, the day must fall Monday to Friday by
      the mountain's local calendar. The date must not be one of the tier's blackout dates, and where
      the tier does not carry holiday access the published holiday periods are closed to it. Where the
      tier does not allow more than one mountain on the same day, a second mountain on a day already
      scanned is refused. Scans beyond the tier's daily limit are refused as a media protection measure
      rather than as a charge. A tier sold with a fixed number of days admits the holder on that many
      distinct dates in the season; the day is counted on the first scan of that date and is not counted
      twice however many lifts are ridden, and once the days are used the pass no longer admits the
      holder even though the season runs on. Partner resort days are counted separately from the
      collective's own days and are redeemed at the partner's ticket office rather than at a collective
      lift.
      A scan admits the holder only on a date falling between the tier's season start date and its
      season end date inclusive, and a scan outside that window is refused whatever days the pass
      has left.
    eligibility:
      - id: scan_on_active_pass
        applies_to: [passes_scan]
        kind: state
        condition: "A scan admits the holder only while the pass record stands in the active state."
        evidence_fields: [passes_holdings.pass_id, passes_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [passes_holdings.pass_id]
          action_bindings:
            passes_holdings.pass_id: pass_id
        state_contract:
          field: passes_holdings.status
          allowed: [active]
    params:
      per_tier:
        Granite Ridge Four-Day Flex Pass: {mountains_included: "=mountains_included", midweek_only: "=midweek_only", blackout_dates: "=blackout_dates", holiday_access: "=holiday_access", daily_scan_limit: "=daily_scan_limit", multi_mountain_same_day: "=multi_mountain_same_day", operating_days_included: "=operating_days_included", partner_resort_days: "=partner_resort_days", season_start_date: "=season_start_date", season_end_date: "=season_end_date"}
