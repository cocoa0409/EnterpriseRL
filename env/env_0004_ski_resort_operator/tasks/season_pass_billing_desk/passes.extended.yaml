- id: passes_ext_carry_forward_fee
  base_policy_refs:
  - passes_deferral
  overwrite:
  - base_policy: passes_deferral
    superseded_clause: The tier's carry-forward fee is placed on the pass account when the election is recorded,
      and that fee is not charged where the household holds a protection plan standing in the active or claim_open
      state at the moment of the election.
    replaced_by: The fee placed on the pass account when a carry-forward is elected is worked out from a fee base,
      taken at the shares below, and the allowance and the schedule carry component are settled against it.
  trigger: on_request
  subject:
  - passes_defer
  computes: carry_forward_fee_usd
  target_tool: elect_pass_carry_forward_09e30d1a
  params:
    protection_rate_settled: 0.0
    protection_rate_in_force: 0.5
    protection_rate_none: 1.0
    timing_rate_early: 0.75
    timing_rate_mid: 0.9
    timing_rate_late: 1.0
    standing_rate_clean: 0.7
    standing_rate_light: 0.85
    standing_rate_heavy: 1.0
    standing_charge_share: 0.5
    allowance_early: 20.0
    allowance_mid: 10.0
    allowance_none: 0.0
    renewal_fee_share: 0.1
    schedule_component_full: 25.0
    schedule_component_part: 12.5
    schedule_component_none: 0.0
    schedule_share_threshold: 0.5
  rule: A holder who carries a pass forward to the following season has a fee placed on the pass account for the
    election, and this rule fixes that fee. The fee for carrying a pass forward is worked out only after the pass
    record stands in the state in which it admits the holder. The fee placed on the pass account when a carry-forward
    is elected is worked out from a fee base, taken at the shares below, and the allowance and the schedule carry
    component are settled against it. The fee base is the carry-forward fee the tier carries. Where the pass record
    was opened as a renewal of a pass held in the preceding season and the price committed to on the pass record
    stands below the tier's standard season price, the fee base is instead one tenth of the price committed to on
    the pass record; and where the pass record was not opened as such a renewal, the pass account shows an amount
    placed on it to be collected by instalments, and the price committed to stands below the tier's standard season
    price, the fee base is instead the carry-forward fee the tier carries reduced in the proportion the price committed
    to bears to that standard season price. The fee base is taken in full whatever protection the household holds.
    Where the collective's protection records show a plan written over a season pass on the household account whose
    claim has been settled, no part of the fee base is taken; and where those records show such a plan standing
    in force or with a claim open, half of the fee base is taken. The figure the protection share produces is taken
    in full whenever the election is recorded. Where the election is recorded before a third of the election period
    counted from the day the pass became scannable has run, three quarters of that figure is taken; and where it
    is recorded after a third but before two thirds of that period has run, nine tenths of that figure is taken.
    The figure the election timing share produces is taken in full whatever charges stand on the pass account. Where
    the pass account carries no service charge raised on it, seven tenths of that figure is taken; and where the
    service charges raised on the pass account come to less than half the carry-forward fee the tier carries, seventeen
    twentieths of that figure is taken. No allowance is settled against the figure the account standing share produces.
    Where fewer than a quarter of the season's days have run on the handling date, the early election allowance
    the charter sets is settled against it; and where at least a quarter but fewer than half of the season's days
    have run, the mid-season allowance the charter sets is settled against it. No component is added for carrying
    an open instalment schedule into the following season. Where the pass account shows an amount placed on it to
    be collected by instalments and the amount still to be collected is at least half of that amount, the schedule
    carry component the charter sets is added, because the plan runs on into the season the pass is carried to;
    and where the pass account shows such an amount placed on it and the amount still to be collected is less than
    half of it, half the schedule carry component is added. The three shares act one after another, each on the
    figure the step before it produced, and never on the fee base a second time; the allowance is then settled against
    that figure and the schedule carry component is added to what remains; and the fee is rounded to the cent only
    once, on that final figure, which is never below zero.
  prerequisite:
  - problem: passes_ext_reinstatement_charge
    kind: value_input
    gate: standing_rate
    form: state
    policy_source: The fee for carrying a pass forward is worked out only after the pass record stands in the state
      in which it admits the holder.
    condition: The pass record's lifecycle state stands at the state in which the pass admits the holder at the
      moment the election is recorded.
    resolved_by: restore_pass_scanning_08275b43
    effect: Once the pass record admits the holder again, the charge raised for that restoration stands on the pass
      account, so the account standing share moves off its clean-account tier and the fee for carrying the pass
      forward rises with it.
  cross_category:
  - category: insure
    as: branch
    reads:
    - status
    note: The protection share of the carry-forward fee is decided from the state of the protection plan written
      over a season pass on the household account.
  compute:
  - protection_status: CFIELD('insure','status', covered_product_category='passes')
  - protection_rate: K('protection_rate_settled') if protection_status == 'claim_settled' else (K('protection_rate_in_force')
      if (protection_status == 'active' or protection_status == 'claim_open') else K('protection_rate_none'))
  - days_since_scannable: DAYS(F('activated_date'), NOW)
  - timing_rate: K('timing_rate_early') if days_since_scannable * 3 < P('deferral_election_days') else (K('timing_rate_mid')
      if days_since_scannable * 3 < P('deferral_election_days') * 2 else K('timing_rate_late'))
  - service_charges_standing: SUM('passes_ledger','amount_usd', event_type='passes_fee_charge')
  - standing_rate: K('standing_rate_clean') if service_charges_standing <= 0 else (K('standing_rate_light') if service_charges_standing
      < P('deferral_fee_usd') * K('standing_charge_share') else K('standing_rate_heavy'))
  - days_since_season_open: DAYS(P('season_start_date'), NOW)
  - season_days: DAYS(P('season_start_date'), P('season_end_date'))
  - early_allowance_usd: K('allowance_early') if days_since_season_open * 4 < season_days else (K('allowance_mid')
      if days_since_season_open * 2 < season_days else K('allowance_none'))
  - financed_amount: LATEST('passes_ledger','amount_usd', event_type='passes_plan_open')
  - fee_base_usd: F('price_paid_usd') * K('renewal_fee_share') if (F('renewal_source') == 'renewal' and F('price_paid_usd')
      < P('pass_price_usd')) else (P('deferral_fee_usd') * F('price_paid_usd') / P('pass_price_usd') if (F('renewal_source')
      != 'renewal' and financed_amount > 0 and F('price_paid_usd') < P('pass_price_usd')) else P('deferral_fee_usd'))
  - plan_amount_carried: LATEST('passes_ledger','amount_usd', event_type='passes_plan_open')
  - outstanding_share_carried: F('installment_balance_usd') / plan_amount_carried if plan_amount_carried > 0 else
      0
  - schedule_component_usd: K('schedule_component_full') if (plan_amount_carried > 0 and outstanding_share_carried
      >= K('schedule_share_threshold')) else (K('schedule_component_part') if (plan_amount_carried > 0 and outstanding_share_carried
      < K('schedule_share_threshold')) else K('schedule_component_none'))
  - result: RND(MX(0, fee_base_usd * protection_rate * timing_rate * standing_rate - early_allowance_usd + schedule_component_usd),
      2)
  compute_basis:
    protection_status: Where the collective's protection records show a plan written over a season pass on the household
      account whose claim has been settled, no part of the fee base is taken
    protection_rate: The fee base is taken in full whatever protection the household holds. Where the collective's
      protection records show a plan written over a season pass on the household account whose claim has been settled,
      no part of the fee base is taken; and where those records show such a plan standing in force or with a claim
      open, half of the fee base is taken.
    days_since_scannable: Where the election is recorded before a third of the election period counted from the
      day the pass became scannable has run, three quarters of that figure is taken
    timing_rate: The figure the protection share produces is taken in full whenever the election is recorded. Where
      the election is recorded before a third of the election period counted from the day the pass became scannable
      has run, three quarters of that figure is taken; and where it is recorded after a third but before two thirds
      of that period has run, nine tenths of that figure is taken.
    service_charges_standing: where the service charges raised on the pass account come to less than half the carry-forward
      fee the tier carries, seventeen twentieths of that figure is taken
    standing_rate: The figure the election timing share produces is taken in full whatever charges stand on the
      pass account. Where the pass account carries no service charge raised on it, seven tenths of that figure is
      taken; and where the service charges raised on the pass account come to less than half the carry-forward fee
      the tier carries, seventeen twentieths of that figure is taken.
    days_since_season_open: Where fewer than a quarter of the season's days have run on the handling date, the early
      election allowance the charter sets is settled against it
    season_days: Where fewer than a quarter of the season's days have run on the handling date, the early election
      allowance the charter sets is settled against it; and where at least a quarter but fewer than half of the
      season's days have run, the mid-season allowance the charter sets is settled against it.
    early_allowance_usd: No allowance is settled against the figure the account standing share produces. Where fewer
      than a quarter of the season's days have run on the handling date, the early election allowance the charter
      sets is settled against it; and where at least a quarter but fewer than half of the season's days have run,
      the mid-season allowance the charter sets is settled against it.
    financed_amount: where the pass record was not opened as such a renewal, the pass account shows an amount placed
      on it to be collected by instalments, and the price committed to stands below the tier's standard season price,
      the fee base is instead the carry-forward fee the tier carries reduced in the proportion the price committed
      to bears to that standard season price
    fee_base_usd: The fee base is the carry-forward fee the tier carries. Where the pass record was opened as a
      renewal of a pass held in the preceding season and the price committed to on the pass record stands below
      the tier's standard season price, the fee base is instead one tenth of the price committed to on the pass
      record; and where the pass record was not opened as such a renewal, the pass account shows an amount placed
      on it to be collected by instalments, and the price committed to stands below the tier's standard season price,
      the fee base is instead the carry-forward fee the tier carries reduced in the proportion the price committed
      to bears to that standard season price.
    result: The three shares act one after another, each on the figure the step before it produced, and never on
      the fee base a second time; the allowance is then settled against that figure and the schedule carry component
      is added to what remains; and the fee is rounded to the cent only once, on that final figure, which is never
      below zero.
    plan_amount_carried: Where the pass account shows an amount placed on it to be collected by instalments and
      the amount still to be collected is at least half of that amount, the schedule carry component the charter
      sets is added
    outstanding_share_carried: where the pass account shows such an amount placed on it and the amount still to
      be collected is less than half of it, half the schedule carry component is added
    schedule_component_usd: No component is added for carrying an open instalment schedule into the following season.
      Where the pass account shows an amount placed on it to be collected by instalments and the amount still to
      be collected is at least half of that amount, the schedule carry component the charter sets is added, because
      the plan runs on into the season the pass is carried to; and where the pass account shows such an amount placed
      on it and the amount still to be collected is less than half of it, half the schedule carry component is added.
  factors:
  - id: protection_share
    effect: parameter
    decides: protection_rate
    bindings:
    - protection_status
    - protection_rate
    ladder:
    - when: the collective's protection records show a plan written over a season pass on the household account
        whose claim has been settled
      value: K('protection_rate_settled')
    - when: the collective's protection records show a plan written over a season pass on the household account
        standing in force or with a claim open
      value: K('protection_rate_in_force')
    - when: otherwise
      value: K('protection_rate_none')
    baseline:
      protection_rate: K('protection_rate_none')
    evidence:
    - cross_category
    cross_difficulty: insure
  - id: election_timing_share
    effect: parameter
    decides: timing_rate
    bindings:
    - days_since_scannable
    - timing_rate
    ladder:
    - when: the election is recorded before a third of the election period counted from the day the pass became
        scannable has run
      value: K('timing_rate_early')
    - when: the election is recorded after a third but before two thirds of the election period counted from the
        day the pass became scannable has run
      value: K('timing_rate_mid')
    - when: otherwise
      value: K('timing_rate_late')
    baseline:
      timing_rate: K('timing_rate_late')
    evidence:
    - date
    - tier_param
    cross_difficulty: null
  - id: account_standing_share
    effect: parameter
    decides: standing_rate
    bindings:
    - service_charges_standing
    - standing_rate
    ladder:
    - when: the pass account carries no service charge raised on it
      value: K('standing_rate_clean')
    - when: the service charges raised on the pass account come to less than half the carry-forward fee the tier
        carries
      value: K('standing_rate_light')
    - when: otherwise
      value: K('standing_rate_heavy')
    baseline:
      standing_rate: K('standing_rate_heavy')
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: season_elapsed_allowance
    effect: parameter
    decides: early_allowance_usd
    bindings:
    - days_since_season_open
    - season_days
    - early_allowance_usd
    ladder:
    - when: fewer than a quarter of the season's days have run on the handling date
      value: K('allowance_early')
    - when: at least a quarter but fewer than half of the season's days have run on the handling date
      value: K('allowance_mid')
    - when: otherwise
      value: K('allowance_none')
    baseline:
      early_allowance_usd: K('allowance_none')
    evidence:
    - date
    - tier_param
    cross_difficulty: null
  - id: fee_base_basis
    effect: method
    decides: fee_base_usd
    bindings:
    - financed_amount
    - fee_base_usd
    ladder:
    - when: the pass record was opened as a renewal of a pass held in the preceding season and the price committed
        to on the pass record stands below the tier's standard season price
      method: the fee base is one tenth of the price committed to on the pass record
    - when: the pass record was not opened as such a renewal, the pass account shows an amount placed on it to be
        collected by instalments, and the price committed to stands below the tier's standard season price
      method: the fee base is the carry-forward fee the tier carries reduced in the proportion the price committed
        to bears to the tier's standard season price
    - when: otherwise
      method: the fee base is the carry-forward fee the tier carries
    baseline:
      fee_base_usd: P('deferral_fee_usd')
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: schedule_carry_component
    effect: parameter
    decides: schedule_component_usd
    bindings:
    - plan_amount_carried
    - outstanding_share_carried
    - schedule_component_usd
    ladder:
    - when: the pass account shows an amount placed on it to be collected by instalments and the amount still to
        be collected is at least half of that amount
      value: K('schedule_component_full')
    - when: the pass account shows an amount placed on it to be collected by instalments and the amount still to
        be collected is less than half of that amount
      value: half the schedule carry component the charter sets
    - when: otherwise
      value: K('schedule_component_none')
    baseline:
      schedule_component_usd: K('schedule_component_none')
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: A holder who carries a pass forward to the following season has a fee placed on the pass account for the
      election, and this rule fixes that fee. The fee base is the carry-forward fee the tier carries. The fee base
      is taken in full whatever protection the household holds. The figure the protection share produces is taken
      in full whenever the election is recorded. The figure the election timing share produces is taken in full
      whatever charges stand on the pass account. No allowance is settled against the figure the account standing
      share produces. No component is added for carrying an open instalment schedule into the following season.
      The three shares act one after another, each on the figure the step before it produced, and never on the fee
      base a second time; the allowance is then settled against that figure and the schedule carry component is
      added to what remains; and the fee is rounded to the cent only once, on that final figure, which is never
      below zero.
    params:
    - protection_rate_none
    - timing_rate_late
    - standing_rate_heavy
    - allowance_none
    - schedule_component_none
    - deferral_fee_usd
  inputs:
    history:
    - table: passes_ledger
      aggregate: sum
      field: amount_usd
      within_months: null
      filters:
        event_type: passes_fee_charge
    - table: passes_ledger
      aggregate: latest
      field: amount_usd
      within_months: null
      filters:
        event_type: passes_plan_open
    cross_category:
    - insure
- id: passes_ext_credit_offset
  base_policy_refs:
  - passes_credit_redemption
  overwrite: []
  trigger: state_due
  subject:
  - passes_credit_redeem
  computes: credit_applied_usd
  target_tool: apply_pass_credit_52fe36c9
  params:
    draw_share_opening: 0.75
    draw_share_running: 0.9
    draw_share_full: 1.0
    error_retained_share: 0.5
    retained_none: 0.0
    premium_hold_share: 0.5
    premium_hold_none: 0.0
  rule: Resort credit standing on a pass record is drawn down against the amount the pass account still shows to
    collect, and this rule fixes how much is applied in one application. The pot the application is drawn from is
    the resort credit the pass record shows standing. Where the pass account shows credit issued to put a billing
    error right, the pot is instead the sum of every credit entry the pass account shows issued less every application
    already drawn against them, since a record whose running figure has had to be corrected is no longer the authority
    on what stands; and where the pass account shows no credit issued to put a billing error right but does show
    credit issued to put a service failure right, the pot is instead the sum of the entries issued to put a service
    failure right less every application already drawn. The pot is never below zero, however many applications the
    pass account already shows drawn against it. The whole of the pot is drawn in one application. Where the pass
    account shows no scheduled instalment presented and none refused, three quarters of the pot is drawn and the
    rest stays on the pass record for the instalments still to fall; and where the pass account shows at least one
    scheduled instalment cleared and no refusal standing, nine tenths of the pot is drawn. Nothing is held back
    from the amount drawn for credit issued to put a billing error right. Where the pass account shows credit issued
    to put a billing error right and the pass record still admits the holder, the whole of that error credit is
    held back, because money credited to correct a charge is returned rather than recycled against what is owed;
    and where the pass account shows credit issued to put a billing error right and the pass record does not admit
    the holder, half of that error credit is held back. Nothing is held back for a protection premium. Where the
    collective's protection records show a plan written over a season pass on the household account with premium
    still to be collected and that plan stands with a settled claim, the whole of the premium still to be collected
    is held back, because the pass account will present it alongside the next instalment; and where such a plan
    shows premium still to be collected and stands in any other state, half of the premium still to be collected
    is held back. The amount applied is the pot taken at the share drawn and rounded to the cent, less the error
    credit held back and less the protection premium held back, the two amounts held back being deducted from that
    rounded figure rather than from the pot; the result is never below zero, never more than the amount the pass
    account still shows to collect, and is rounded to the cent once at the end. Where the figure those deductions
    leave falls below the smallest single application the tier allows, the application is raised to that smallest
    single application, and where the pot itself or the amount the pass account still shows to collect is smaller
    than that, the smaller of those two is applied instead; that figure too is never below zero.
  prerequisite: []
  cross_category:
  - category: insure
    as: branch
    reads:
    - status
    - premium_balance_usd
    note: The amount held back for a protection premium is decided from the premium still to be collected on the
      plan written over a season pass on the household account and from the state that plan stands in.
  compute:
  - credit_on_record: F('pass_credit_usd')
  - balance_due: F('installment_balance_usd')
  - recovery_credit: SUM('passes_ledger','amount_usd', event_type='passes_credit_issue', credit_reason='service_recovery')
  - credit_issued_total: SUM('passes_ledger','amount_usd', event_type='passes_credit_issue')
  - credit_drawn_total: SUM('passes_ledger','amount_usd', event_type='passes_credit_redeem')
  - error_credit: SUM('passes_ledger','amount_usd', event_type='passes_credit_issue', credit_reason='duplicate_charge')
  - pot_usd: MX(0, credit_issued_total - credit_drawn_total) if error_credit > 0 else (MX(0, recovery_credit - credit_drawn_total)
      if recovery_credit > 0 else credit_on_record)
  - presented_count: COUNT('passes_ledger', event_type='passes_installment_charge')
  - refused_count: COUNT('passes_ledger', event_type='passes_installment_decline')
  - draw_share: K('draw_share_opening') if (presented_count == 0 and refused_count == 0) else (K('draw_share_running')
      if (presented_count >= 1 and refused_count == 0) else K('draw_share_full'))
  - retained_usd: error_credit if (error_credit > 0 and F('status') == 'active') else (error_credit * K('error_retained_share')
      if (error_credit > 0 and F('status') != 'active') else K('retained_none'))
  - premium_balance: CFIELD('insure','premium_balance_usd', covered_product_category='passes')
  - protection_state: CFIELD('insure','status', covered_product_category='passes')
  - premium_hold_usd: premium_balance if (premium_balance > 0 and protection_state == 'claim_settled') else (premium_balance
      * K('premium_hold_share') if premium_balance > 0 else K('premium_hold_none'))
  - drawn_usd: RND(pot_usd * draw_share, 2)
  - net_application_usd: RND(MN(MX(0, drawn_usd - retained_usd - premium_hold_usd), balance_due), 2)
  - result: net_application_usd if net_application_usd >= P('credit_minimum_redemption_usd') else RND(MX(0, MN(MN(pot_usd,
      balance_due), P('credit_minimum_redemption_usd'))), 2)
  compute_basis:
    credit_on_record: The pot the application is drawn from is the resort credit the pass record shows standing.
    balance_due: never more than the amount the pass account still shows to collect
    recovery_credit: where the pass account shows no credit issued to put a billing error right but does show credit
      issued to put a service failure right, the pot is instead the sum of the entries issued to put a service failure
      right less every application already drawn
    credit_issued_total: Where the pass account shows credit issued to put a billing error right, the pot is instead
      the sum of every credit entry the pass account shows issued less every application already drawn against them
    credit_drawn_total: The pot is never below zero, however many applications the pass account already shows drawn
      against it.
    error_credit: Where the pass account shows credit issued to put a billing error right and the pass record still
      admits the holder, the whole of that error credit is held back, because money credited to correct a charge
      is returned rather than recycled against what is owed
    pot_usd: The pot the application is drawn from is the resort credit the pass record shows standing. Where the
      pass account shows credit issued to put a billing error right, the pot is instead the sum of every credit
      entry the pass account shows issued less every application already drawn against them, since a record whose
      running figure has had to be corrected is no longer the authority on what stands; and where the pass account
      shows no credit issued to put a billing error right but does show credit issued to put a service failure right,
      the pot is instead the sum of the entries issued to put a service failure right less every application already
      drawn. The pot is never below zero, however many applications the pass account already shows drawn against
      it.
    presented_count: Where the pass account shows no scheduled instalment presented and none refused, three quarters
      of the pot is drawn and the rest stays on the pass record for the instalments still to fall
    refused_count: where the pass account shows at least one scheduled instalment cleared and no refusal standing,
      nine tenths of the pot is drawn
    draw_share: The whole of the pot is drawn in one application. Where the pass account shows no scheduled instalment
      presented and none refused, three quarters of the pot is drawn and the rest stays on the pass record for the
      instalments still to fall; and where the pass account shows at least one scheduled instalment cleared and
      no refusal standing, nine tenths of the pot is drawn.
    retained_usd: Nothing is held back from the amount drawn for credit issued to put a billing error right. Where
      the pass account shows credit issued to put a billing error right and the pass record still admits the holder,
      the whole of that error credit is held back, because money credited to correct a charge is returned rather
      than recycled against what is owed; and where the pass account shows credit issued to put a billing error
      right and the pass record does not admit the holder, half of that error credit is held back.
    premium_balance: Where the collective's protection records show a plan written over a season pass on the household
      account with premium still to be collected and that plan stands with a settled claim, the whole of the premium
      still to be collected is held back
    protection_state: that plan stands with a settled claim
    premium_hold_usd: Nothing is held back for a protection premium. Where the collective's protection records show
      a plan written over a season pass on the household account with premium still to be collected and that plan
      stands with a settled claim, the whole of the premium still to be collected is held back, because the pass
      account will present it alongside the next instalment; and where such a plan shows premium still to be collected
      and stands in any other state, half of the premium still to be collected is held back.
    drawn_usd: The amount applied is the pot taken at the share drawn and rounded to the cent
    result: Where the figure those deductions leave falls below the smallest single application the tier allows,
      the application is raised to that smallest single application, and where the pot itself or the amount the
      pass account still shows to collect is smaller than that, the smaller of those two is applied instead; that
      figure too is never below zero.
    net_application_usd: The amount applied is the pot taken at the share drawn and rounded to the cent, less the
      error credit held back and less the protection premium held back, the two amounts held back being deducted
      from that rounded figure rather than from the pot; the result is never below zero, never more than the amount
      the pass account still shows to collect, and is rounded to the cent once at the end.
  factors:
  - id: credit_pot_basis
    effect: method
    decides: pot_usd
    bindings:
    - credit_on_record
    - recovery_credit
    - credit_issued_total
    - credit_drawn_total
    - pot_usd
    ladder:
    - when: the pass account shows credit issued to put a billing error right
      method: the pot is the sum of every credit entry the pass account shows issued, less every application already
        drawn against them, and never below zero
    - when: the pass account shows no credit issued to put a billing error right but does show credit issued to
        put a service failure right
      method: the pot is the sum of the entries issued to put a service failure right, less every application already
        drawn, and never below zero
    - when: otherwise
      method: the pot is the resort credit the pass record shows standing
    baseline:
      pot_usd: credit_on_record
    evidence:
    - history
    cross_difficulty: null
  - id: schedule_stage_share
    effect: parameter
    decides: draw_share
    bindings:
    - presented_count
    - refused_count
    - draw_share
    ladder:
    - when: the pass account shows no scheduled instalment presented and none refused
      value: K('draw_share_opening')
    - when: the pass account shows at least one scheduled instalment cleared and no refusal standing
      value: K('draw_share_running')
    - when: otherwise
      value: K('draw_share_full')
    baseline:
      draw_share: K('draw_share_full')
    evidence:
    - history
    cross_difficulty: null
  - id: error_credit_hold
    effect: parameter
    decides: retained_usd
    bindings:
    - error_credit
    - retained_usd
    ladder:
    - when: the pass account shows credit issued to put a billing error right and the pass record still admits the
        holder
      value: the whole of the error credit standing
    - when: the pass account shows credit issued to put a billing error right and the pass record does not admit
        the holder
      value: half of the error credit standing
    - when: otherwise
      value: K('retained_none')
    baseline:
      retained_usd: K('retained_none')
    evidence:
    - history
    cross_difficulty: null
  - id: protection_premium_hold
    effect: parameter
    decides: premium_hold_usd
    bindings:
    - premium_balance
    - protection_state
    - premium_hold_usd
    ladder:
    - when: the protection records show a plan written over a season pass on the household account with premium
        still to be collected and that plan stands with a settled claim
      value: the whole of the premium still to be collected on that plan
    - when: the protection records show such a plan with premium still to be collected standing in any other state
      value: half of the premium still to be collected on that plan
    - when: otherwise
      value: K('premium_hold_none')
    baseline:
      premium_hold_usd: K('premium_hold_none')
    evidence:
    - cross_category
    cross_difficulty: insure
  baseline:
    rule: Resort credit standing on a pass record is drawn down against the amount the pass account still shows
