      within_months: null
      filters:
        event_type: passes_installment_decline
    cross_category: []
- id: passes_ext_reinstatement_charge
  base_policy_refs:
  - passes_arrears_suspension
  overwrite:
  - base_policy: passes_arrears_suspension
    superseded_clause: Restoration places the tier's reinstatement fee on the pass account, and that fee is not
      charged where the refusal was the collective's own error.
    replaced_by: The charge placed on the pass account when scanning privileges are restored is worked out from
      the reinstatement fee the tier carries, and the reliefs below are taken off it.
  trigger: state_due
  subject:
  - passes_reinstate
  computes: restoration_charge_usd
  target_tool: restore_pass_scanning_08275b43
  params:
    expired_relief_high: 0.25
    expired_relief_low: 0.1
    expired_relief_none: 0.0
    unused_relief_high: 0.3
    unused_relief_low: 0.2
    unused_relief_none: 0.0
    long_unused_days: 45
    loyalty_relief_high: 0.15
    loyalty_relief_low: 0.1
    loyalty_relief_none: 0.0
    loyalty_days: 60
    single_uncured_multiple: 1.5
  rule: Scanning privileges that have been withdrawn are restored on the pass record, and this rule fixes the charge
    placed on the pass account for the restoration. The charge for restoring scanning privileges is worked out only
    after the pass account carries a cleared payment entry dated later than every refusal standing against the pass.
    The charge placed on the pass account when scanning privileges are restored is worked out from the reinstatement
    fee the tier carries, and the reliefs below are taken off it. The base of the charge is the reinstatement fee
    the tier carries, taken once. Where the pass account carries at least as many refusals in the three whole months
    ending on the handling date as the number of refusals the tier tolerates before privileges are reviewed, the
    base is instead that reinstatement fee taken once for each refusal the pass account shows left uncured past
    its grace period; and where the pass account instead carries a charge already raised for restoring scanning
    privileges in this season, the base is that reinstatement fee taken once and a half. The refusals left uncured
    past their grace period are counted as the late fees raised on the pass account in the cycle of the handling
    date. Where the pass record no longer admits the holder, every late fee raised on the pass account since the
    plan was opened is counted instead; and where the pass record still admits the holder and the pass account carries
    a refusal in the three whole months ending on the handling date, the late fees raised in the three whole months
    ending on the handling date are counted. No relief is given for a refusal the payment method recorded as the
    card having expired. Where the pass account carries at least as many refusals recorded as the card having expired
    in the three whole months ending on the handling date as the number of refusals the tier tolerates before privileges
    are reviewed, and a scheduled instalment has cleared on the pass account later than the most recent refusal,
    a quarter of the charge is relieved; and where the pass account carries at least one refusal recorded as the
    card having expired in that window, fewer than the number the tier tolerates, and a scheduled instalment has
    cleared later than the most recent refusal, a tenth of the charge is relieved. No relief is given for a season
    the holder has not used. Where the pass account shows no scan at all and the pass has been scannable for at
    least the number of days the charter treats as a long unused stretch, three tenths of the charge is relieved;
    and where the pass account shows no scan at all and the pass has been scannable for fewer days than that, a
    fifth of the charge is relieved. No relief is given for how the pass record was opened. Where the pass record
    was opened as a carry-over from the preceding season and the application was recorded at least the number of
    days the charter treats as settled standing before the handling date, three twentieths of the charge is relieved;
    and where the pass record was opened as a renewal of a pass held in the preceding season and the application
    was recorded at least that many days before the handling date, a tenth of the charge is relieved. The reliefs
    are first added together into one total relief rate and the base of the charge is reduced once by that total
    rate; the reliefs do not act one after another on what the previous relief has left. The restoration charge
    is the base of the charge less that single reduction, never below zero, and it is rounded to the cent only once
    the reduction has been taken.
  prerequisite:
  - problem: passes_ext_arrears_recovery
    kind: value_input
    gate: expired_relief_rate
    form: state
    policy_source: The charge for restoring scanning privileges is worked out only after the pass account carries
      a cleared payment entry dated later than every refusal standing against the pass.
    condition: The pass account carries a cleared scheduled-instalment entry whose date is later than the date of
      the most recent refusal standing on that pass account.
    resolved_by: collect_past_due_0159c539
    effect: Once a cleared payment entry stands later than the most recent refusal, the relief given for refusals
      recorded as the card having expired moves off its fall-through of no relief, and the restoration charge falls
      with it.
  cross_category: []
  compute:
  - expired_refusals: COUNT('passes_ledger', within_months=3, event_type='passes_installment_decline', decline_code='expired_card')
  - last_refusal_on: LATEST('passes_ledger','event_date', event_type='passes_installment_decline')
  - last_settlement_on: LATEST('passes_ledger','event_date', event_type='passes_installment_charge')
  - expired_relief_rate: K('expired_relief_high') if (expired_refusals >= P('max_declines_before_suspension') and
      last_settlement_on > last_refusal_on) else (K('expired_relief_low') if (expired_refusals >= 1 and last_settlement_on
      > last_refusal_on) else K('expired_relief_none'))
  - scan_count: COUNT('passes_ledger', event_type='passes_scan')
  - days_scannable: DAYS(F('activated_date'), NOW)
  - unused_relief_rate: K('unused_relief_high') if (scan_count == 0 and days_scannable >= K('long_unused_days'))
      else (K('unused_relief_low') if (scan_count == 0 and days_scannable < K('long_unused_days')) else K('unused_relief_none'))
  - days_since_application: DAYS(F('applied_date'), NOW)
  - loyalty_relief_rate: K('loyalty_relief_high') if (F('renewal_source') == 'carried_forward' and days_since_application
      >= K('loyalty_days')) else (K('loyalty_relief_low') if (F('renewal_source') == 'renewal' and days_since_application
      >= K('loyalty_days')) else K('loyalty_relief_none'))
  - refusals_recent: COUNT('passes_ledger', within_months=3, event_type='passes_installment_decline')
  - uncured_count: COUNT('passes_ledger', event_type='passes_late_fee') if F('status') == 'suspended' else (COUNT('passes_ledger',
      within_months=3, event_type='passes_late_fee') if refusals_recent >= 1 else COUNT('passes_ledger', within_months=1,
      event_type='passes_late_fee'))
  - restorations_this_season: COUNT('passes_ledger', event_type='passes_fee_charge', charge_category='reinstatement_fee')
  - charge_base_usd: P('reinstatement_fee_usd') * uncured_count if refusals_recent >= P('max_declines_before_suspension')
      else (P('reinstatement_fee_usd') * K('single_uncured_multiple') if restorations_this_season >= 1 else P('reinstatement_fee_usd'))
  - total_relief_rate: expired_relief_rate + unused_relief_rate + loyalty_relief_rate
  - result: RND(MX(0, charge_base_usd * (1 - total_relief_rate)), 2)
  compute_basis:
    expired_refusals: Where the pass account carries at least as many refusals recorded as the card having expired
      in the three whole months ending on the handling date as the number of refusals the tier tolerates before
      privileges are reviewed, and a scheduled instalment has cleared on the pass account later than the most recent
      refusal, a quarter of the charge is relieved
    last_refusal_on: a scheduled instalment has cleared on the pass account later than the most recent refusal
    last_settlement_on: The charge for restoring scanning privileges is worked out only after the pass account carries
      a cleared payment entry dated later than every refusal standing against the pass.
    expired_relief_rate: No relief is given for a refusal the payment method recorded as the card having expired.
      Where the pass account carries at least as many refusals recorded as the card having expired in the three
      whole months ending on the handling date as the number of refusals the tier tolerates before privileges are
      reviewed, and a scheduled instalment has cleared on the pass account later than the most recent refusal, a
      quarter of the charge is relieved; and where the pass account carries at least one refusal recorded as the
      card having expired in that window, fewer than the number the tier tolerates, and a scheduled instalment has
      cleared later than the most recent refusal, a tenth of the charge is relieved.
    scan_count: Where the pass account shows no scan at all and the pass has been scannable for at least the number
      of days the charter treats as a long unused stretch, three tenths of the charge is relieved
    days_scannable: the pass has been scannable for at least the number of days the charter treats as a long unused
      stretch
    unused_relief_rate: No relief is given for a season the holder has not used. Where the pass account shows no
      scan at all and the pass has been scannable for at least the number of days the charter treats as a long unused
      stretch, three tenths of the charge is relieved; and where the pass account shows no scan at all and the pass
      has been scannable for fewer days than that, a fifth of the charge is relieved.
    days_since_application: the application was recorded at least the number of days the charter treats as settled
      standing before the handling date
    loyalty_relief_rate: No relief is given for how the pass record was opened. Where the pass record was opened
      as a carry-over from the preceding season and the application was recorded at least the number of days the
      charter treats as settled standing before the handling date, three twentieths of the charge is relieved; and
      where the pass record was opened as a renewal of a pass held in the preceding season and the application was
      recorded at least that many days before the handling date, a tenth of the charge is relieved.
    refusals_recent: Where the pass account carries at least as many refusals in the three whole months ending on
      the handling date as the number of refusals the tier tolerates before privileges are reviewed, the base is
      instead that reinstatement fee taken once for each refusal the pass account shows left uncured past its grace
      period
    uncured_count: The refusals left uncured past their grace period are counted as the late fees raised on the
      pass account in the cycle of the handling date. Where the pass record no longer admits the holder, every late
      fee raised on the pass account since the plan was opened is counted instead; and where the pass record still
      admits the holder and the pass account carries a refusal in the three whole months ending on the handling
      date, the late fees raised in the three whole months ending on the handling date are counted.
    restorations_this_season: where the pass account instead carries a charge already raised for restoring scanning
      privileges in this season, the base is that reinstatement fee taken once and a half
    charge_base_usd: The base of the charge is the reinstatement fee the tier carries, taken once. Where the pass
      account carries at least as many refusals in the three whole months ending on the handling date as the number
      of refusals the tier tolerates before privileges are reviewed, the base is instead that reinstatement fee
      taken once for each refusal the pass account shows left uncured past its grace period; and where the pass
      account instead carries a charge already raised for restoring scanning privileges in this season, the base
      is that reinstatement fee taken once and a half.
    total_relief_rate: The reliefs are first added together into one total relief rate and the base of the charge
      is reduced once by that total rate; the reliefs do not act one after another on what the previous relief has
      left.
    result: The restoration charge is the base of the charge less that single reduction, never below zero, and it
      is rounded to the cent only once the reduction has been taken.
  factors:
  - id: expired_card_relief
    effect: parameter
    decides: expired_relief_rate
    bindings:
    - expired_refusals
    - last_refusal_on
    - last_settlement_on
    - expired_relief_rate
    ladder:
    - when: the pass account carries at least as many refusals recorded as the card having expired in the three
        whole months ending on the handling date as the number of refusals the tier tolerates before privileges
        are reviewed, and a scheduled instalment has cleared later than the most recent refusal
      value: K('expired_relief_high')
    - when: the pass account carries at least one refusal recorded as the card having expired in the three whole
        months ending on the handling date, fewer than the number the tier tolerates, and a scheduled instalment
        has cleared later than the most recent refusal
      value: K('expired_relief_low')
    - when: otherwise
      value: K('expired_relief_none')
    baseline:
      expired_relief_rate: K('expired_relief_none')
    evidence:
    - history
    - date
    - tier_param
    cross_difficulty: null
  - id: unused_season_relief
    effect: parameter
    decides: unused_relief_rate
    bindings:
    - scan_count
    - days_scannable
    - unused_relief_rate
    ladder:
    - when: the pass account shows no scan at all and the pass has been scannable for at least the number of days
        the charter treats as a long unused stretch
      value: K('unused_relief_high')
    - when: the pass account shows no scan at all and the pass has been scannable for fewer days than the number
        the charter treats as a long unused stretch
      value: K('unused_relief_low')
    - when: otherwise
      value: K('unused_relief_none')
    baseline:
      unused_relief_rate: K('unused_relief_none')
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: standing_loyalty_relief
    effect: parameter
    decides: loyalty_relief_rate
    bindings:
    - days_since_application
    - loyalty_relief_rate
    ladder:
    - when: the pass record was opened as a carry-over from the preceding season and the application was recorded
        at least the number of days the charter treats as settled standing before the handling date
      value: K('loyalty_relief_high')
    - when: the pass record was opened as a renewal of a pass held in the preceding season and the application was
        recorded at least the number of days the charter treats as settled standing before the handling date
      value: K('loyalty_relief_low')
    - when: otherwise
      value: K('loyalty_relief_none')
    baseline:
      loyalty_relief_rate: K('loyalty_relief_none')
    evidence:
