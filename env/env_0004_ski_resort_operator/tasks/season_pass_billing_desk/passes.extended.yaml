category: passes
display_name: Season Pass Programme

binding:
  holding_table: passes_holdings
  event_tables: [passes_ledger]
  intake_tables: [passes_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields:
    installment_balance_usd: installment_balance
    pass_credit_usd: pass_credit
    buddy_tickets_remaining: buddy_tickets

lifecycle:
  states: [applied, pending_activation, active, suspended, deferred, expired, cancelled, closed]
  transitions:
    - {from: applied, to: pending_activation, by: agent, means: "The pass application has been accepted and the pass is waiting for the deposit or the first scheduled payment to clear."}
    - {from: applied, to: cancelled, by: user, means: "The guest withdraws the application before any money has been taken."}
    - {from: pending_activation, to: active, by: system, means: "The deposit or first payment has cleared and the pass media is issued, so the pass may be scanned."}
    - {from: pending_activation, to: cancelled, by: user, means: "The guest abandons the purchase before the pass is issued."}
    - {from: active, to: suspended, by: agent, means: "Scanning privileges are withdrawn because the pass account has stood in arrears beyond the tolerated period."}
    - {from: suspended, to: active, by: agent, means: "The arrears have been settled and scanning privileges are restored."}
    - {from: active, to: deferred, by: user, means: "The guest elects to carry the pass forward to the following season instead of using it this season."}
    - {from: deferred, to: active, by: system, means: "The season the pass was carried forward to has opened and the pass is live again."}
    - {from: active, to: cancelled, by: user, means: "The guest cancels the pass and gives up the remaining season."}
    - {from: suspended, to: cancelled, by: user, means: "The guest cancels a pass that was already suspended for arrears."}
    - {from: active, to: expired, by: system, means: "The season has ended with the pass in good standing."}
    - {from: suspended, to: expired, by: system, means: "The season has ended while the pass was still suspended."}
    - {from: deferred, to: expired, by: system, means: "The carried-forward season has ended without the pass being used."}
    - {from: expired, to: closed, by: system, means: "The expired pass has been financially settled and the record is closed."}
    - {from: cancelled, to: closed, by: system, means: "The cancelled pass has been financially settled and the record is closed."}

accounts:
  - key: installment_balance
    unit: USD
    meaning: "The amount of pass price and pass-account fees still to be collected from the guest for this pass; it rises when an amount is placed on the pass account and falls when a payment clears."
  - key: pass_credit
    unit: USD
    meaning: "Resort credit held against this pass record, issued when a pass is cancelled, downgraded or settled, and spent when it is applied against a resort charge."
  - key: buddy_tickets
    unit: tickets
    meaning: "The number of discounted buddy lift tickets left on this pass for the season; the allotment is loaded at activation and drawn down each time one is bought."

parameter_schema:
  pass_price_usd: "Standard season price of this pass for an adult passholder, in USD to 2 decimal places."
  early_commitment_price_usd: "Price of this pass in USD when the application is recorded on or before the early commitment deadline."
  early_commitment_deadline: "Last calendar date, as MM-DD, on which the early commitment price may be given for this pass."
  renewal_discount_pct: "Percentage taken off the applicable price when the passholder held any Granite Ridge season pass in the immediately preceding season."
  deposit_usd: "Non-refundable amount in USD that must be taken before this pass leaves the application state."
  installment_plan_offered: "Whether this pass may be financed over scheduled instalments (true/false)."
  installment_count: "Number of scheduled instalment charges the financed balance of this pass is divided into (integer)."
  installment_charge_day_of_month: "Day of the month, as an integer, on which each scheduled instalment for this pass is presented."
  installment_service_fee_usd: "One-off service fee in USD added to the pass account when an instalment plan is opened on this pass."
  autopay_required: "Whether a stored payment method must be on file for this pass to be financed (true/false)."
  declined_charge_retry_days: "Number of calendar days after a declined instalment before the same instalment is presented again (integer)."
  late_fee_usd: "Fee in USD placed on the pass account for each instalment that is declined and not cured within the grace period."
  late_fee_grace_days: "Number of calendar days after a declined instalment during which the guest may settle without a late fee (integer)."
  max_declines_before_suspension: "Number of declined instalments on this pass in the rolling review window that brings the pass into suspension review (integer)."
  arrears_suspension_days: "Number of calendar days a balance may stand past due on this pass before scanning privileges are withdrawn (integer)."
  reinstatement_fee_usd: "Fee in USD placed on the pass account when a suspended pass is brought back to active."
  season_start_date: "First date of the season this pass gives access to, as YYYY-MM-DD."
  season_end_date: "Last date of the season this pass gives access to, as YYYY-MM-DD."
  operating_days_included: "Number of scheduled operating days the pass admits the holder on during the season (integer)."
  mountains_included: "List of the collective's mountains this pass admits the holder to."
  midweek_only: "Whether this pass admits the holder only Monday to Friday (true/false)."
  blackout_dates: "List of dates, as YYYY-MM-DD, on which this pass does not admit the holder."
  holiday_access: "Whether this pass admits the holder during the published holiday periods (true/false)."
  partner_resort_days: "Number of days this pass admits the holder at partner resorts outside the collective (integer)."
  multi_mountain_same_day: "Whether the holder may scan at more than one mountain on the same calendar day (true/false)."
  daily_scan_limit: "Maximum number of lift scans recorded against this pass on one calendar day before scanning is refused (integer)."
  first_tracks_access: "Whether this pass includes early-morning lift loading before public opening (true/false)."
  priority_lift_access: "Whether this pass includes the priority lift lane (true/false)."
  parking_days_included: "Number of days of complimentary parking included with this pass for the season (integer)."
  buddy_ticket_allotment: "Number of discounted buddy lift tickets loaded onto this pass at activation (integer)."
  buddy_ticket_price_usd: "Price in USD the holder pays for each buddy lift ticket drawn from the allotment."
  friends_family_ticket_discount_pct: "Percentage taken off a window lift ticket bought by the holder for a guest beyond the buddy allotment."
  lodging_discount_pct: "Percentage taken off collective lodging booked in the holder's name."
  rental_discount_pct: "Percentage taken off collective equipment rental booked in the holder's name."
  lesson_discount_pct: "Percentage taken off snowsports school bookings made in the holder's name."
  dining_discount_pct: "Percentage taken off on-mountain dining charged to the holder."
  retail_discount_pct: "Percentage taken off resort retail purchases by the holder."
  pass_transfer_allowed: "Whether this pass may be re-registered to a different named passholder (true/false)."
  transfer_fee_usd: "Fee in USD placed on the pass account when the pass is re-registered to a different named passholder."
  replacement_media_fee_usd: "Fee in USD placed on the pass account when replacement pass media is issued."
  deferral_offered: "Whether this pass may be carried forward to the following season (true/false)."
  deferral_fee_usd: "Fee in USD placed on the pass account when the guest elects to carry this pass forward."
  deferral_election_days: "Number of calendar days after activation within which a carry-forward may be elected on this pass (integer)."
  cancellation_window_days: "Number of calendar days after the application is recorded within which this pass may be cancelled for a refund (integer)."
  cancellation_fee_usd: "Fee in USD retained by the resort when this pass is cancelled inside the cancellation window."
  refund_basis: "Basis on which the refundable amount of this pass is worked out; one of full_price_paid, price_paid_less_day_use or pro_rata_by_operating_days."
  day_use_deduction_usd: "Amount in USD deducted from the refundable amount for each day already scanned on this pass."
  credit_validity_days: "Number of calendar days from issue within which resort credit issued on this pass must be spent (integer)."
  credit_minimum_redemption_usd: "Smallest amount of resort credit in USD that may be applied to a single charge on this pass."
  upgrade_offered: "Whether the holder may move up to a higher pass during the season (true/false)."
  upgrade_differential_basis: "Basis on which the amount due for moving up from this pass is worked out; one of list_price_difference or price_paid_difference."
  upgrade_service_fee_usd: "Fee in USD placed on the pass account when the holder moves up from this pass."
  upgrade_deadline: "Last calendar date, as MM-DD, on which a move up from this pass may be recorded."
  household_discount_pct: "Percentage taken off this pass when it is the third or a later pass bought on one household account for the same season."
  protection_plan_eligible: "Whether a pass protection plan may be attached to this pass (true/false)."
  age_bands_offered: "List of age bands this pass is sold in."
  proof_of_age_required: "Whether documentary proof of age must be on file before this pass is activated (true/false)."
  photo_required_for_activation: "Whether a passholder photograph must be on file before this pass is activated (true/false)."
  price_lock_next_season: "Whether holding this pass to the end of the season locks the same price for the following season (true/false)."

