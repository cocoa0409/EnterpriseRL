  - plan_entries: COUNT('passes_ledger', event_type='passes_plan_open')
  - uplift_rate: K('uplift_financed') if (plan_entries >= 1 and F('installment_balance_usd') > 0) else (K('uplift_paid')
      if (plan_entries == 0 and F('payment_plan') == 'paid_in_full') else K('uplift_none'))
  - net_back_usd: gross_back_usd * use_rate - retained_standing * retained_offset_rate - protection_payout * payout_offset_rate
  - result: RND(MX(0, net_back_usd * uplift_rate), 2)
