        Granite Ridge Local Pass: {mountains_included: "=mountains_included", midweek_only: "=midweek_only", blackout_dates: "=blackout_dates", holiday_access: "=holiday_access", daily_scan_limit: "=daily_scan_limit", multi_mountain_same_day: "=multi_mountain_same_day", operating_days_included: "=operating_days_included", partner_resort_days: "=partner_resort_days", season_start_date: "=season_start_date", season_end_date: "=season_end_date"}
        Granite Ridge Summit Pass: {mountains_included: "=mountains_included", midweek_only: "=midweek_only", blackout_dates: "=blackout_dates", holiday_access: "=holiday_access", daily_scan_limit: "=daily_scan_limit", multi_mountain_same_day: "=multi_mountain_same_day", operating_days_included: "=operating_days_included", partner_resort_days: "=partner_resort_days", season_start_date: "=season_start_date", season_end_date: "=season_end_date"}
        Granite Ridge Summit Plus Pass: {mountains_included: "=mountains_included", midweek_only: "=midweek_only", blackout_dates: "=blackout_dates", holiday_access: "=holiday_access", daily_scan_limit: "=daily_scan_limit", multi_mountain_same_day: "=multi_mountain_same_day", operating_days_included: "=operating_days_included", partner_resort_days: "=partner_resort_days", season_start_date: "=season_start_date", season_end_date: "=season_end_date"}
        Granite Ridge Collective Unlimited Pass: {mountains_included: "=mountains_included", midweek_only: "=midweek_only", blackout_dates: "=blackout_dates", holiday_access: "=holiday_access", daily_scan_limit: "=daily_scan_limit", multi_mountain_same_day: "=multi_mountain_same_day", operating_days_included: "=operating_days_included", partner_resort_days: "=partner_resort_days", season_start_date: "=season_start_date", season_end_date: "=season_end_date"}
        Granite Ridge Collective Elite Pass: {mountains_included: "=mountains_included", midweek_only: "=midweek_only", blackout_dates: "=blackout_dates", holiday_access: "=holiday_access", daily_scan_limit: "=daily_scan_limit", multi_mountain_same_day: "=multi_mountain_same_day", operating_days_included: "=operating_days_included", partner_resort_days: "=partner_resort_days", season_start_date: "=season_start_date", season_end_date: "=season_end_date"}
    measures: [passes_msr_season_scan_days]

  - id: passes_buddy_programme
    subject: [passes_buddy_redeem]
    rule: >
      Each tier loads a buddy lift ticket allotment onto the pass at activation, and the holder buys
      those tickets at the tier's buddy price for guests skiing with them. A buddy ticket is drawn from
      the allotment on the day it is bought and is valid on that date at the mountain named on it; it is
      not dated forward and it is not refundable once the guest has been admitted on it. The tier's
      blackout dates apply to buddy tickets exactly as they apply to the pass itself, so a tier closed
      on a date cannot buy a buddy ticket for that date either. Once the allotment is used, further
      guest tickets are sold at the window price less the tier's friends and family reduction, and that
      reduction is taken instead of the buddy price rather than on top of it. The allotment belongs to
      the pass and not to the household, so allotments on two passes in one household are not pooled and
      an unused allotment does not pass to another pass or another season.
    eligibility: []
    params:
      per_tier:
        Granite Ridge Four-Day Flex Pass: {buddy_ticket_allotment: "=buddy_ticket_allotment", buddy_ticket_price_usd: "=buddy_ticket_price_usd", friends_family_ticket_discount_pct: "=friends_family_ticket_discount_pct"}
        Granite Ridge Midweek Pass: {buddy_ticket_allotment: "=buddy_ticket_allotment", buddy_ticket_price_usd: "=buddy_ticket_price_usd", friends_family_ticket_discount_pct: "=friends_family_ticket_discount_pct"}
        Granite Ridge Local Pass: {buddy_ticket_allotment: "=buddy_ticket_allotment", buddy_ticket_price_usd: "=buddy_ticket_price_usd", friends_family_ticket_discount_pct: "=friends_family_ticket_discount_pct"}
        Granite Ridge Summit Pass: {buddy_ticket_allotment: "=buddy_ticket_allotment", buddy_ticket_price_usd: "=buddy_ticket_price_usd", friends_family_ticket_discount_pct: "=friends_family_ticket_discount_pct"}
        Granite Ridge Summit Plus Pass: {buddy_ticket_allotment: "=buddy_ticket_allotment", buddy_ticket_price_usd: "=buddy_ticket_price_usd", friends_family_ticket_discount_pct: "=friends_family_ticket_discount_pct"}
        Granite Ridge Collective Unlimited Pass: {buddy_ticket_allotment: "=buddy_ticket_allotment", buddy_ticket_price_usd: "=buddy_ticket_price_usd", friends_family_ticket_discount_pct: "=friends_family_ticket_discount_pct"}
        Granite Ridge Collective Elite Pass: {buddy_ticket_allotment: "=buddy_ticket_allotment", buddy_ticket_price_usd: "=buddy_ticket_price_usd", friends_family_ticket_discount_pct: "=friends_family_ticket_discount_pct"}

  - id: passes_transfer_and_media
    subject: [passes_transfer, passes_fee_charge]
    rule: >
      A season pass belongs to the person it is registered to, and only the tiers that allow it may be
      re-registered to someone else. A pass is re-registered only to a person the account holder names
      in full, and the name given is recorded exactly as stated. Re-registration places the tier's
      transfer fee on the pass account, cancels the old media and issues fresh media, and it does not
      change the tier, the price already committed to or the instalment schedule. A tier that does not
      allow re-registration is not re-registered for any reason, and lending a pass to another person is
      grounds for the media being confiscated at the lift. Lost, stolen or broken media is replaced at
      the tier's replacement fee, which is placed on the pass account in the same way. A fee is placed
      on a pass account only while the pass record has not yet reached the expired or closed state.
      After that point a charge belongs to the following season's record or to the finance team. Where
      media fails through a fault of the media itself rather than the holder, the replacement is issued
      at no charge, and that judgement is made at the ticket office when the media is handed in.
    eligibility:
      - id: named_transferee
        applies_to: [passes_transfer]
        kind: caller_fact
        condition: "A pass is re-registered only to a person the account holder names in full, and the name given is recorded exactly as stated."
        evidence_fields: [passes_holdings.pass_id, passes_holdings.passholder_name]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys:
            - [passes_holdings.pass_id]
          action_bindings:
            passes_holdings.pass_id: pass_id
      - id: fee_bearing_record_state
        applies_to: [passes_fee_charge]
        kind: state
        condition: "A fee is placed on a pass account only while the pass record has not yet reached the expired or closed state."
        evidence_fields: [passes_holdings.pass_id, passes_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [passes_holdings.pass_id]
          action_bindings:
            passes_holdings.pass_id: pass_id
        state_contract:
          field: passes_holdings.status
          allowed: [applied, pending_activation, active, suspended, deferred, cancelled]
    params:
      per_tier:
        Granite Ridge Four-Day Flex Pass: {pass_transfer_allowed: "=pass_transfer_allowed", transfer_fee_usd: "=transfer_fee_usd", replacement_media_fee_usd: "=replacement_media_fee_usd"}
        Granite Ridge Midweek Pass: {pass_transfer_allowed: "=pass_transfer_allowed", transfer_fee_usd: "=transfer_fee_usd", replacement_media_fee_usd: "=replacement_media_fee_usd"}
        Granite Ridge Local Pass: {pass_transfer_allowed: "=pass_transfer_allowed", transfer_fee_usd: "=transfer_fee_usd", replacement_media_fee_usd: "=replacement_media_fee_usd"}
        Granite Ridge Summit Pass: {pass_transfer_allowed: "=pass_transfer_allowed", transfer_fee_usd: "=transfer_fee_usd", replacement_media_fee_usd: "=replacement_media_fee_usd"}
        Granite Ridge Summit Plus Pass: {pass_transfer_allowed: "=pass_transfer_allowed", transfer_fee_usd: "=transfer_fee_usd", replacement_media_fee_usd: "=replacement_media_fee_usd"}
        Granite Ridge Collective Unlimited Pass: {pass_transfer_allowed: "=pass_transfer_allowed", transfer_fee_usd: "=transfer_fee_usd", replacement_media_fee_usd: "=replacement_media_fee_usd"}
        Granite Ridge Collective Elite Pass: {pass_transfer_allowed: "=pass_transfer_allowed", transfer_fee_usd: "=transfer_fee_usd", replacement_media_fee_usd: "=replacement_media_fee_usd"}

  - id: passes_season_closure
    subject: [passes_expire, passes_close]
    rule: >
      Every pass record reaches the end of the season it was sold for. On the season's last operating
      day the pass stops admitting the holder and the record is marked expired, whether it was scanning
      freely or standing suspended; a pass carried forward that was never used in the season it was
      carried to expires in the same way. Expiry does not cancel what is still owed: the instalment
      schedule runs to its end after expiry, and resort credit on the record keeps its own validity
      period. A pass record is closed only when the pass account shows nothing left to collect and no
      credit left to spend. Closure is the last write on the record and nothing is added to it
      afterwards. Where the tier carries next season's price lock, holding the pass to expiry entitles
      the passholder to the same price for the following season, claimed by opening a fresh pass record
      for that season rather than by reopening this one.
    eligibility:
      - id: nothing_outstanding
        applies_to: [passes_close]
        kind: authorization
        condition: "A pass record is closed only when the pass account shows nothing left to collect and no credit left to spend."
        evidence_fields: [passes_holdings.pass_id, passes_holdings.installment_balance_usd, passes_holdings.pass_credit_usd]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [passes_holdings.pass_id]
          action_bindings:
            passes_holdings.pass_id: pass_id
    params:
      per_tier:
        Granite Ridge Four-Day Flex Pass: {season_end_date: "=season_end_date", price_lock_next_season: "=price_lock_next_season", operating_days_included: "=operating_days_included"}
        Granite Ridge Midweek Pass: {season_end_date: "=season_end_date", price_lock_next_season: "=price_lock_next_season", operating_days_included: "=operating_days_included"}
        Granite Ridge Local Pass: {season_end_date: "=season_end_date", price_lock_next_season: "=price_lock_next_season", operating_days_included: "=operating_days_included"}
        Granite Ridge Summit Pass: {season_end_date: "=season_end_date", price_lock_next_season: "=price_lock_next_season", operating_days_included: "=operating_days_included"}
        Granite Ridge Summit Plus Pass: {season_end_date: "=season_end_date", price_lock_next_season: "=price_lock_next_season", operating_days_included: "=operating_days_included"}
        Granite Ridge Collective Unlimited Pass: {season_end_date: "=season_end_date", price_lock_next_season: "=price_lock_next_season", operating_days_included: "=operating_days_included"}
        Granite Ridge Collective Elite Pass: {season_end_date: "=season_end_date", price_lock_next_season: "=price_lock_next_season", operating_days_included: "=operating_days_included"}

extended_policies:
- id: passes_ext_arrears_recovery
  base_policy_refs:
  - passes_installment_plan
  overwrite:
  - base_policy: passes_installment_plan
    superseded_clause: That amount is divided into the tier's number of scheduled instalments; the division is to
      the cent, and any remainder of a cent is carried into the final instalment so the schedule sums exactly to
      the financed amount.
    replaced_by: Each instalment still to be settled is taken at the scheduled instalment amount, which is the financed
      amount placed on the pass account when the plan was opened divided by the number of instalments the schedule
      holds, rounded to the cent.
  trigger: state_due
  subject:
  - passes_installment_charge
  computes: presented_amount_usd
  target_tool: collect_past_due_0159c539
  params:
    fee_share_full: 1.0
    fee_share_part: 0.5
    fee_share_none: 0.0
    part_share_refusals: 2
    held_over_when_suspended: 1
    held_over_none: 0
  rule: A pass account that has fallen behind is brought back into good standing by one presentation taken at the
    desk, and this rule fixes the amount presented. The number of instalments that have fallen due is the number
    of whole months between the day the season opened and the handling date, capped at the number of instalments
    the schedule holds. Where the instalment plan was opened before the day the season opened and the pass account
    shows at least one scheduled instalment already cleared, that number is instead the whole months between the
    day the instalment plan was opened and the handling date, capped in the same way; and where the instalment plan
    was opened on or after the day the season opened, it is instead the whole months between the day the pass became
    scannable and the handling date, capped in the same way. The number of instalments still to be settled is the
    number of refusals standing on the pass account in the three whole months ending on the handling date. Where
    the pass account carries more refusals in that window than there are instalments that have fallen due and not
    been cleared, because an instalment was presented again or has since cleared, the number still to be settled
    is instead the number of instalments that have fallen due less the number of scheduled instalments the pass
    account shows as cleared, and never below zero; and where the pass account shows no scheduled instalment cleared
    at all and carries fewer refusals in that window than there are instalments that have fallen due, the number
    still to be settled is the number of instalments that have fallen due. Each instalment still to be settled is
    taken at the scheduled instalment amount, which is the financed amount placed on the pass account when the plan
    was opened divided by the number of instalments the schedule holds, rounded to the cent. Nothing is left to
    the presentation the schedule will make again. Where the most recent refusal standing on the pass account was
    recorded fewer days ago than the retry interval the tier carries and the pass record still admits the holder,
    every instalment still to be settled is left to that presentation instead; and where the most recent refusal
    was recorded fewer days ago than the retry interval the tier carries and the pass record no longer admits the
    holder, one instalment is left to it. The past-due principal is the number of instalments still to be settled,
    less the number left to the presentation the schedule will make again and never below zero, multiplied by the
    scheduled instalment amount, and that product is rounded to the cent. The late fees standing on the pass account
    are those raised in the cycle of the handling date. Where the pass record no longer admits the holder and the
    pass account carries at least as many refusals in the three whole months ending on the handling date as the
    number of refusals the tier tolerates before privileges are reviewed, every late fee raised on the pass account
    since the plan was opened is gathered instead; and where the pass record no longer admits the holder but the
    refusals in that window are fewer than that number, the late fees raised in the three whole months ending on
    the handling date are gathered. None of the late fees standing is taken with the amount presented; they stay
    on the pass account until the schedule runs its course. Where the pass account carries at least as many refusals
    in the three whole months ending on the handling date as the number of refusals the tier tolerates before privileges
    are reviewed, the late fees standing are taken in full; and where it carries at least two refusals in that window
    but fewer than that number, half of the late fees standing is taken. The fee component is the late fees standing
    multiplied by the share taken, rounded to the cent. The amount presented is the past-due principal plus the
    fee component, rounded to the cent; the two components are worked out separately and added once, and no further
    reduction is given.
  prerequisite: []
  cross_category: []
  compute:
  - plan_amount: LATEST('passes_ledger','amount_usd', event_type='passes_plan_open')
  - plan_opened_on: LATEST('passes_ledger','event_date', event_type='passes_plan_open')
  - season_opened_on: P('season_start_date')
  - cleared_count: COUNT('passes_ledger', event_type='passes_installment_charge')
  - due_count: MN(P('installment_count'), MONTHS(plan_opened_on, NOW)) if (plan_opened_on < season_opened_on and
      cleared_count >= 1) else (MN(P('installment_count'), MONTHS(F('activated_date'), NOW)) if plan_opened_on >=
      season_opened_on else MN(P('installment_count'), MONTHS(season_opened_on, NOW)))
  - refusals_window: COUNT('passes_ledger', within_months=3, event_type='passes_installment_decline')
  - unsettled_count: MX(0, due_count - cleared_count) if refusals_window > due_count - cleared_count else (due_count
      if (cleared_count == 0 and refusals_window < due_count) else refusals_window)
  - fee_share: K('fee_share_full') if refusals_window >= P('max_declines_before_suspension') else (K('fee_share_part')
      if refusals_window >= K('part_share_refusals') else K('fee_share_none'))
  - days_since_last_refusal: DAYS(LATEST('passes_ledger','event_date', event_type='passes_installment_decline'),
      NOW)
  - held_over_count: unsettled_count if (days_since_last_refusal < P('declined_charge_retry_days') and F('status')
      == 'active') else (K('held_over_when_suspended') if (days_since_last_refusal < P('declined_charge_retry_days')
      and F('status') == 'suspended') else K('held_over_none'))
  - late_fees_standing: SUM('passes_ledger','amount_usd', event_type='passes_late_fee') if (F('status') == 'suspended'
      and refusals_window >= P('max_declines_before_suspension')) else (SUM('passes_ledger','amount_usd', within_months=3,
      event_type='passes_late_fee') if F('status') == 'suspended' else SUM('passes_ledger','amount_usd', within_months=1,
      event_type='passes_late_fee'))
  - instalment_amount: RND(plan_amount / P('installment_count'), 2)
  - principal_due: RND(MX(0, unsettled_count - held_over_count) * instalment_amount, 2)
  - fee_component: RND(late_fees_standing * fee_share, 2)
  - result: RND(principal_due + fee_component, 2)
  compute_basis:
    plan_amount: Each instalment still to be settled is taken at the scheduled instalment amount, which is the financed
      amount placed on the pass account when the plan was opened divided by the number of instalments the schedule
      holds, rounded to the cent.
    plan_opened_on: Where the instalment plan was opened before the day the season opened and the pass account shows
      at least one scheduled instalment already cleared, that number is instead the whole months between the day
      the instalment plan was opened and the handling date, capped in the same way
    season_opened_on: The number of instalments that have fallen due is the number of whole months between the day
      the season opened and the handling date, capped at the number of instalments the schedule holds.
    cleared_count: the number still to be settled is instead the number of instalments that have fallen due less
      the number of scheduled instalments the pass account shows as cleared, and never below zero
    due_count: The number of instalments that have fallen due is the number of whole months between the day the
      season opened and the handling date, capped at the number of instalments the schedule holds. Where the instalment
      plan was opened before the day the season opened and the pass account shows at least one scheduled instalment
      already cleared, that number is instead the whole months between the day the instalment plan was opened and
      the handling date, capped in the same way; and where the instalment plan was opened on or after the day the
      season opened, it is instead the whole months between the day the pass became scannable and the handling date,
      capped in the same way.
    refusals_window: The number of instalments still to be settled is the number of refusals standing on the pass
      account in the three whole months ending on the handling date.
    unsettled_count: Where the pass account carries more refusals in that window than there are instalments that
      have fallen due and not been cleared, because an instalment was presented again or has since cleared, the
      number still to be settled is instead the number of instalments that have fallen due less the number of scheduled
      instalments the pass account shows as cleared, and never below zero; and where the pass account shows no scheduled
      instalment cleared at all and carries fewer refusals in that window than there are instalments that have fallen
      due, the number still to be settled is the number of instalments that have fallen due.
    fee_share: None of the late fees standing is taken with the amount presented; they stay on the pass account
      until the schedule runs its course. Where the pass account carries at least as many refusals in the three
      whole months ending on the handling date as the number of refusals the tier tolerates before privileges are
      reviewed, the late fees standing are taken in full; and where it carries at least two refusals in that window
      but fewer than that number, half of the late fees standing is taken.
    days_since_last_refusal: Where the most recent refusal standing on the pass account was recorded fewer days
      ago than the retry interval the tier carries and the pass record still admits the holder, every instalment
      still to be settled is left to that presentation instead
    held_over_count: Nothing is left to the presentation the schedule will make again. Where the most recent refusal
      standing on the pass account was recorded fewer days ago than the retry interval the tier carries and the
      pass record still admits the holder, every instalment still to be settled is left to that presentation instead;
      and where the most recent refusal was recorded fewer days ago than the retry interval the tier carries and
      the pass record no longer admits the holder, one instalment is left to it.
    late_fees_standing: The late fees standing on the pass account are those raised in the cycle of the handling
      date. Where the pass record no longer admits the holder and the pass account carries at least as many refusals
      in the three whole months ending on the handling date as the number of refusals the tier tolerates before
      privileges are reviewed, every late fee raised on the pass account since the plan was opened is gathered instead;
      and where the pass record no longer admits the holder but the refusals in that window are fewer than that
      number, the late fees raised in the three whole months ending on the handling date are gathered.
    instalment_amount: Each instalment still to be settled is taken at the scheduled instalment amount, which is
      the financed amount placed on the pass account when the plan was opened divided by the number of instalments
      the schedule holds, rounded to the cent.
    principal_due: The past-due principal is the number of instalments still to be settled, less the number left
      to the presentation the schedule will make again and never below zero, multiplied by the scheduled instalment
      amount, and that product is rounded to the cent.
    fee_component: The fee component is the late fees standing multiplied by the share taken, rounded to the cent.
    result: The amount presented is the past-due principal plus the fee component, rounded to the cent; the two
      components are worked out separately and added once, and no further reduction is given.
  factors:
  - id: fallen_due_anchor
    effect: method
    decides: due_count
    bindings:
    - due_count
    ladder:
    - when: the instalment plan was opened before the day the season opened and the pass account shows at least
        one scheduled instalment already cleared
      method: the instalments that have fallen due are the whole months between the day the instalment plan was
        opened and the handling date, capped at the number of instalments the schedule holds
    - when: the instalment plan was opened on or after the day the season opened
      method: the instalments that have fallen due are the whole months between the day the pass became scannable
        and the handling date, capped at the number of instalments the schedule holds
    - when: otherwise
      method: the instalments that have fallen due are the whole months between the day the season opened and the
        handling date, capped at the number of instalments the schedule holds
    baseline:
      due_count: MN(P('installment_count'), MONTHS(season_opened_on, NOW))
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: unsettled_reconciliation
    effect: method
    decides: unsettled_count
    bindings:
    - cleared_count
    - unsettled_count
    ladder:
    - when: the pass account carries more refusals in the three whole months ending on the handling date than there
        are instalments that have fallen due and not been cleared
      method: the instalments still to be settled are the instalments that have fallen due less the scheduled instalments
        the pass account shows as cleared, and never below zero
    - when: the pass account shows no scheduled instalment cleared at all and carries fewer refusals in the three
        whole months ending on the handling date than there are instalments that have fallen due
      method: the instalments still to be settled are every instalment that has fallen due
    - when: otherwise
      method: the instalments still to be settled are the refusals standing on the pass account in the three whole
        months ending on the handling date
    baseline:
      unsettled_count: refusals_window
    evidence:
    - history
    cross_difficulty: null
  - id: late_fee_collection
    effect: parameter
    decides: fee_share
    bindings:
    - refusals_window
    - fee_share
    ladder:
    - when: the pass account carries at least as many refusals in the three whole months ending on the handling
        date as the number of refusals the tier tolerates before privileges are reviewed
      value: K('fee_share_full')
    - when: the pass account carries at least two refusals in the three whole months ending on the handling date
        but fewer than the number the tier tolerates before privileges are reviewed
      value: K('fee_share_part')
    - when: otherwise
      value: K('fee_share_none')
    baseline:
      fee_share: K('fee_share_none')
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: retry_hold_over
    effect: parameter
    decides: held_over_count
    bindings:
    - days_since_last_refusal
    - held_over_count
    ladder:
    - when: the most recent refusal standing on the pass account was recorded fewer days ago than the retry interval
        the tier carries and the pass record still admits the holder
      value: every instalment still to be settled
    - when: the most recent refusal standing on the pass account was recorded fewer days ago than the retry interval
        the tier carries and the pass record no longer admits the holder
      value: K('held_over_when_suspended')
    - when: otherwise
      value: K('held_over_none')
    baseline:
      held_over_count: K('held_over_none')
    evidence:
    - history
    - date
    - tier_param
    cross_difficulty: null
  - id: late_fee_gathering
    effect: method
    decides: late_fees_standing
    bindings:
    - late_fees_standing
    ladder:
    - when: the pass record no longer admits the holder and the pass account carries at least as many refusals in
        the three whole months ending on the handling date as the number of refusals the tier tolerates before privileges
        are reviewed
      method: every late fee raised on the pass account since the plan was opened is gathered
    - when: the pass record no longer admits the holder and the refusals in the three whole months ending on the
        handling date are fewer than the number the tier tolerates before privileges are reviewed
      method: the late fees raised in the three whole months ending on the handling date are gathered
    - when: otherwise
      method: the late fees raised in the cycle of the handling date are gathered
    baseline:
      late_fees_standing: SUM('passes_ledger','amount_usd', within_months=1, event_type='passes_late_fee')
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: A pass account that has fallen behind is brought back into good standing by one presentation taken at
      the desk, and this rule fixes the amount presented. The number of instalments that have fallen due is the
      number of whole months between the day the season opened and the handling date, capped at the number of instalments
      the schedule holds. The number of instalments still to be settled is the number of refusals standing on the
      pass account in the three whole months ending on the handling date. Each instalment still to be settled is
      taken at the scheduled instalment amount, which is the financed amount placed on the pass account when the
      plan was opened divided by the number of instalments the schedule holds, rounded to the cent. Nothing is left
      to the presentation the schedule will make again. The past-due principal is the number of instalments still
      to be settled, less the number left to the presentation the schedule will make again and never below zero,
      multiplied by the scheduled instalment amount, and that product is rounded to the cent. The late fees standing
      on the pass account are those raised in the cycle of the handling date. None of the late fees standing is
      taken with the amount presented; they stay on the pass account until the schedule runs its course. The fee
      component is the late fees standing multiplied by the share taken, rounded to the cent. The amount presented
      is the past-due principal plus the fee component, rounded to the cent; the two components are worked out separately
      and added once, and no further reduction is given.
    params:
    - fee_share_none
    - held_over_none
    - installment_count
    - season_start_date
  inputs:
    history:
    - table: passes_ledger
      aggregate: latest
      field: amount_usd
      within_months: null
      filters:
        event_type: passes_plan_open
    - table: passes_ledger
      aggregate: count
      field: pass_event_id
      within_months: 3
      filters:
        event_type: passes_installment_decline
    - table: passes_ledger
