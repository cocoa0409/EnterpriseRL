  baseline:
    rule: A household may give a season pass up, and this rule fixes the charge the collective retains on the pass
      account when it does. The charge base is the tier's cancellation fee. The charge base is taken as it stands
      wherever in the cancellation window the pass is given up. The figure the window share produces is taken as
      it stands whatever the pass account still shows to collect. Nothing further is retained for the lift scans
      the pass account shows. No allowance is settled against the charge for the season still to come. No relief
      is given for protection the household holds. The charge base is taken at the window share and the figure that
      produces is taken at the outstanding share, each share acting on the figure the step before it produced and
      never on the charge base a second time; the scan component is then added to that figure, the two allowances
      are settled against what that gives, and the charge retained is rounded to the cent once at the end and is
      never below zero.
    params:
    - window_rate_early
    - outstanding_rate_base
    - scan_component_none
    - allowance_none
    - relief_none
    - cancellation_fee_usd
