events:
  - type: passes_apply
    target: passes_holdings
    mutation: create
    meaning: "A guest commits to a season pass for a named passholder and the pass record is opened in the application state."
    grain: "One row per season pass bought for one named passholder for one season."
    fields:
      pass_id: "Reference number of the season pass record."
      customer_id: "The household account the pass is bought on."
      variant_name: "The pass tier committed to, written as its official full name."
      status: "Lifecycle state of the pass record, pinned to the application state when it is opened."
      season_code: "The season the pass admits the holder to."
      passholder_name: "Name of the person the pass is registered to, exactly as the guest states it."
      age_band: "Age band the passholder is priced in."
      home_mountain: "Mountain the passholder nominates as their home hill."
      payment_plan: "How the pass price is to be collected."
      renewal_source: "Whether the pass is new business, a renewal, a carry-over from the prior season or a staff comp."
      applied_date: "Date the application was recorded."
      price_paid_usd: "Price committed to for this pass after every discount that applies."
      photo_on_file: "Whether a passholder photograph is already on file."
    triggers:
      - event: passes:passes_plan_open
        when: {payment_plan: [autumn_installments, monthly_installments]}
        map: {pass_id: pass_id, customer_id: customer_id, season_code: season_code, charge_category: pass_price}

  - type: passes_accept
    target: passes_holdings
    mutation: {transition: {from: applied, to: pending_activation}}
    meaning: "The resort accepts the application and holds the pass for the guest while the deposit or first scheduled payment clears."
    grain: "One row per pass record; the acceptance is recorded on the pass itself."
    fields:
      status: "Lifecycle state of the pass record, moved to the state in which the pass waits for money to clear."
    triggers: []

  - type: passes_activate
    target: passes_holdings
    mutation: {transition: {from: pending_activation, to: active}}
    meaning: "The money due before access has cleared, pass media is issued and the pass becomes scannable."
    grain: "One row per pass record; activation is recorded on the pass itself."
    fields:
      status: "Lifecycle state of the pass record, moved to the scannable state."
      activated_date: "Date the pass became scannable."
      media_serial: "Serial number of the pass media issued to the holder."
      buddy_tickets_remaining: "Buddy lift ticket allotment loaded onto the pass at activation."
    triggers:
      - event: passes:passes_buddy_issue
        map: {pass_id: pass_id, customer_id: customer_id, season_code: season_code}

  - type: passes_upgrade
    target: passes_holdings
    mutation: update
    meaning: "The holder moves up to a higher pass tier part-way through the season and the pass record now carries the higher tier."
    grain: "One row per pass record; the move up rewrites the tier on the pass itself."
    fields:
      variant_name: "The pass tier the holder has moved up to."
      upgrade_from_variant: "The pass tier the holder held before the move up."
      price_paid_usd: "Price committed to for the pass after the move up."
    triggers:
      - event: passes:passes_upgrade_charge
        map: {pass_id: pass_id, customer_id: customer_id, charge_category: upgrade_differential}

  - type: passes_transfer
    target: passes_holdings
    mutation: update
    meaning: "The pass is re-registered from one named passholder to another and fresh media is issued."
    grain: "One row per pass record; the re-registration rewrites the registered name on the pass itself."
    fields:
      passholder_name: "Name of the person the pass is now registered to."
      media_serial: "Serial number of the replacement media issued in the new name."
    triggers:
      - event: passes:passes_fee_charge
        map: {pass_id: pass_id, customer_id: customer_id, charge_category: transfer_fee}

  - type: passes_suspend
    target: passes_holdings
    mutation: {transition: {from: active, to: suspended}}
    meaning: "Scanning privileges are withdrawn because money owed on the pass account has stood past due beyond the tolerated period."
    grain: "One row per pass record; the withdrawal of privileges is recorded on the pass itself."
    fields:
      status: "Lifecycle state of the pass record, moved to the state in which the pass no longer scans."
    triggers: []

  - type: passes_reinstate
    target: passes_holdings
    mutation: {transition: {from: suspended, to: active}}
    meaning: "The past-due money has been settled and scanning privileges are restored to the pass."
    grain: "One row per pass record; the restoration is recorded on the pass itself."
    fields:
      status: "Lifecycle state of the pass record, moved back to the scannable state."
    triggers:
      - event: passes:passes_fee_charge
        map: {pass_id: pass_id, customer_id: customer_id, charge_category: reinstatement_fee}

  - type: passes_defer
    target: passes_holdings
    mutation: {transition: {from: active, to: deferred}}
    meaning: "The holder elects to carry the pass forward to the following season instead of skiing on it this season."
    grain: "One row per pass record; the carry-forward is recorded on the pass itself."
    fields:
      status: "Lifecycle state of the pass record, moved to the carried-forward state."
      deferred_to_season: "The season the pass has been carried forward to."
    triggers:
      - event: passes:passes_fee_charge
        map: {pass_id: pass_id, customer_id: customer_id, charge_category: deferral_fee}

  - type: passes_resume_deferred
    target: passes_holdings
    mutation: {transition: {from: deferred, to: active}}
    meaning: "The season a pass was carried forward to has opened and the pass is live again."
    grain: "One row per pass record; the resumption is recorded on the pass itself."
    fields:
      status: "Lifecycle state of the pass record, returned to the scannable state."
      activated_date: "Date the carried-forward pass became scannable again."
    triggers: []

  - type: passes_cancel
    target: passes_holdings
    mutation:
      transition:
        - {from: applied, to: cancelled}
        - {from: pending_activation, to: cancelled}
        - {from: active, to: cancelled}
        - {from: suspended, to: cancelled}
    meaning: "The guest gives up the pass and the pass record is cancelled."
    grain: "One row per pass record; the cancellation is recorded on the pass itself."
