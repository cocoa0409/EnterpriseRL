events:
  - type: lessons_book
    target: lessons_holdings
    mutation: create
    meaning: "A household asks the school for a place in one of its products for one named participant on a stated date."
    grain: "One row per booking of one product for one participant starting on one date."
    fields:
      lesson_id: "Reference number of the school booking."
      customer_id: "The household account the booking is made on."
      variant_name: "The school product booked, written as its official full name."
      status: "Lifecycle state of the booking, pinned to the state of being asked for when it is opened."
      season_code: "The season the booking falls in."
      participant_name: "Name of the person to be taught, exactly as the household states it."
      participant_age_band: "Age band the participant falls in on the session date."
      ability_level: "Ability level the participant is booked at."
      discipline: "Snowsports discipline the participant is booked in."
      mountain: "Mountain the sessions are to run at."
      first_session_date: "Date the first session is due to run."
      session_time: "Scheduled start of the session on the mountain's clock."
      sessions_booked: "Number of sessions the booking holds."
      booked_date: "Date the booking was recorded."
      language: "Language the household asks for the sessions to be delivered in."
    triggers:
      - event: lessons:lessons_tuition_charge
        map: {lesson_id: lesson_id, customer_id: customer_id, charge_category: tuition}

  - type: lessons_waitlist
    target: lessons_holdings
    mutation: {transition: {from: requested, to: waitlisted}}
    meaning: "No place is free on the date asked for, so the participant is held in order of asking."
    grain: "One row per booking; the wait is recorded on the booking itself."
    fields:
      status: "Lifecycle state of the booking, moved to the waiting state."
    triggers: []

  - type: lessons_confirm
    target: lessons_holdings
    mutation:
      transition:
        - {from: requested, to: confirmed}
        - {from: waitlisted, to: confirmed}
    meaning: "A place is allocated to the participant and the booking becomes firm."
    grain: "One row per booking; the allocation is recorded on the booking itself."
    fields:
      status: "Lifecycle state of the booking, moved to the firm state."
      sessions_remaining: "Number of sessions the participant still has to come."
      meeting_point: "Where the participant meets their instructor."
    triggers:
      - event: lessons:lessons_enroll_load
        map: {lesson_id: lesson_id, customer_id: customer_id}

  - type: lessons_assign_instructor
    target: lessons_holdings
    mutation: update
    meaning: "An instructor is put against the booking and the household is told who will teach the participant."
    grain: "One row per booking; the assignment rewrites the instructor on the booking itself."
    fields:
      instructor_name: "Name of the instructor assigned to teach the participant."
      meeting_point: "Where the participant meets that instructor."
    triggers: []

  - type: lessons_reschedule
    target: lessons_holdings
    mutation: update
    meaning: "The booking is moved to another date at the household's request."
    grain: "One row per booking; the move rewrites the session date on the booking itself."
    fields:
      first_session_date: "The date the first session is now due to run."
      session_time: "The scheduled start on the new date."
      reschedule_count: "How many times this booking has been moved to another date."
    triggers:
      - event: lessons:lessons_fee_charge
        map: {lesson_id: lesson_id, customer_id: customer_id, charge_category: reschedule_fee}

  - type: lessons_transfer
    target: lessons_holdings
    mutation: update
    meaning: "The booking is re-registered from one participant to another."
    grain: "One row per booking; the re-registration rewrites the participant on the booking itself."
    fields:
      participant_name: "Name of the person now to be taught."
      participant_age_band: "Age band the new participant falls in."
      ability_level: "Ability level the new participant is booked at."
    triggers:
      - event: lessons:lessons_fee_charge
        map: {lesson_id: lesson_id, customer_id: customer_id, charge_category: transfer_fee}

  - type: lessons_start
    target: lessons_holdings
    mutation: {transition: {from: confirmed, to: in_progress}}
    meaning: "The first session has been delivered and the booking is under way."
    grain: "One row per booking; the start is recorded on the booking itself."
    fields:
      status: "Lifecycle state of the booking, moved to the state of being under way."
    triggers: []

  - type: lessons_complete
    target: lessons_holdings
    mutation: {transition: {from: in_progress, to: completed}}
    meaning: "Every session the booking holds has been delivered."
    grain: "One row per booking; completion is recorded on the booking itself."
    fields:
      status: "Lifecycle state of the booking, moved to the delivered state."
      completed_date: "Date the last session was delivered."
    triggers: []

  - type: lessons_cancel
    target: lessons_holdings
    mutation:
      transition:
        - {from: requested, to: cancelled}
        - {from: waitlisted, to: cancelled}
        - {from: confirmed, to: cancelled}
        - {from: in_progress, to: cancelled}
    meaning: "The household gives the booking up, or the collective gives it up on the household's behalf."
    grain: "One row per booking; the cancellation is recorded on the booking itself."
    fields:
      status: "Lifecycle state of the booking, moved to the cancelled state."
      cancellation_reason: "Why the booking was given up."
      completed_date: "Last date on which a session was delivered before the booking was given up."
    triggers:
      - event: lessons:lessons_credit_issue
        when: {cancellation_reason: [guest_request, illness, injury, mountain_conditions, instructor_unavailable]}
        map: {lesson_id: lesson_id, customer_id: customer_id, credit_reason: booking_cancellation}
      - event: lessons:lessons_fee_charge
        when: {cancellation_reason: [guest_request, no_reason_given]}
        map: {lesson_id: lesson_id, customer_id: customer_id, charge_category: late_cancellation_fee}

  - type: lessons_no_show
    target: lessons_holdings
    mutation: {transition: {from: confirmed, to: no_show}}
    meaning: "The participant did not present at the meeting point and the session ran without them."
    grain: "One row per booking; the missed session is recorded on the booking itself."
    fields:
      status: "Lifecycle state of the booking, moved to the missed state."
    triggers:
      - event: lessons:lessons_fee_charge
        map: {lesson_id: lesson_id, customer_id: customer_id, charge_category: no_show_fee}

  - type: lessons_close
    target: lessons_holdings
    mutation:
      transition:
        - {from: completed, to: closed}
        - {from: cancelled, to: closed}
        - {from: no_show, to: closed}
    meaning: "Everything owed on and owed to the booking has been settled and the record is closed for good."
    grain: "One row per booking; closure is recorded on the booking itself."
    fields:
      status: "Lifecycle state of the booking, moved to the closed state."
      tuition_balance_usd: "Amount still to be collected on the booking, which stands at zero once the record is closed."
    triggers: []

  - type: lessons_tuition_charge
    target: lessons_ledger
    meaning: "The tuition due for a booking is raised against the household account."
    grain: "One row per raising of tuition against one booking."
    distinguish_by: [event_date, amount_usd, charge_category]
    fields:
      lesson_event_id: "Reference number of this school account entry."
      lesson_id: "The booking this entry belongs to."
      customer_id: "The household account this entry belongs to."
      event_type: "The kind of school account entry this row records."
      season_code: "The season the booking falls in."
      event_date: "Date the tuition was raised."
      amount_usd: "Amount of tuition raised."
      charge_category: "What the amount is for."
      payment_method: "How the household is expected to settle the amount."
    account: tuition_balance
    direction: in
    triggers: []

  - type: lessons_equipment_addon
    target: lessons_ledger
    meaning: "An add-on the household asks for alongside the lesson — a lift ticket, rental equipment or a supervised lunch — is raised against the household account."
    grain: "One row per add-on of one kind raised against one booking for one session date."
    distinguish_by: [charge_category, session_date, amount_usd]
    fields:
      lesson_event_id: "Reference number of this school account entry."
      lesson_id: "The booking this entry belongs to."
      customer_id: "The household account this entry belongs to."
      event_type: "The kind of school account entry this row records."
      event_date: "Date the add-on was raised."
      session_date: "Session date the add-on is for."
      amount_usd: "Amount of the add-on."
      charge_category: "Which add-on the amount is for."
      quantity: "Number of add-ons of this kind raised."
    account: tuition_balance
    direction: in
    triggers: []

  - type: lessons_fee_charge
    target: lessons_ledger
    meaning: "A school fee of some kind — a late cancellation, a missed session, a move to another date, a re-registration or a named instructor — is raised against the household account."
    grain: "One row per school fee of one kind raised against one booking."
    distinguish_by: [charge_category, event_date, related_event_id]
    fields:
      lesson_event_id: "Reference number of this school account entry."
      lesson_id: "The booking this entry belongs to."
      customer_id: "The household account this entry belongs to."
      event_type: "The kind of school account entry this row records."
      related_event_id: "The school account entry this fee answers to, where it answers to one."
      event_date: "Date the fee was raised."
      amount_usd: "Amount of the fee."
      charge_category: "Which fee the amount is for."
    account: tuition_balance
    direction: in
    triggers: []

  - type: lessons_payment
    target: lessons_ledger
    meaning: "Money is collected against what the household owes the school for a booking."
    grain: "One row per payment collected against one booking."
    distinguish_by: [event_date, amount_usd, payment_method]
    fields:
      lesson_event_id: "Reference number of this school account entry."
      lesson_id: "The booking this entry belongs to."
      customer_id: "The household account this entry belongs to."
      event_type: "The kind of school account entry this row records."
      related_event_id: "The charge this payment settles."
      event_date: "Date the payment cleared."
      amount_usd: "Amount collected."
      payment_method: "How the money was taken."
    account: tuition_balance
    direction: out
    triggers: []

  - type: lessons_enroll_load
    target: lessons_ledger
    meaning: "The block of sessions a firm booking holds is loaded against the participant."
    grain: "One row per loading of a session block onto one booking."
    distinguish_by: [event_date, quantity, season_code]
    fields:
      lesson_event_id: "Reference number of this school account entry."
      lesson_id: "The booking this entry belongs to."
      customer_id: "The household account this entry belongs to."
      event_type: "The kind of school account entry this row records."
      season_code: "The season the booking falls in."
      event_date: "Date the block was loaded."
      quantity: "Number of sessions loaded."
    account: session_credits
    direction: in
    triggers: []

  - type: lessons_session_deliver
    target: lessons_ledger
    meaning: "One instruction session is delivered to the participant and drawn from the block the booking holds."
    grain: "One row per session delivered to one participant on one date."
    distinguish_by: [session_date, session_number, instructor_name]
    fields:
      lesson_event_id: "Reference number of this school account entry."
      lesson_id: "The booking this entry belongs to."
