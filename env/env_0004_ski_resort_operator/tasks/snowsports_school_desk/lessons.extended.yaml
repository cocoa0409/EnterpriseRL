  - id: lessons_ext_session_tuition_charge
    base_policy_refs: [lessons_agg_household_group_pricing, lessons_pricing]
    overwrite:
      - base_policy: lessons_pricing
        superseded_clause: >-
          The tuition raised for a booking is the product's block price where the product is sold as a block, and
          its session price multiplied by the number of sessions booked where it is sold session by session.
        replaced_by: >-
          The tuition raised for a booking is the product's block price, and the figure is rounded to the nearest
          cent.
      - base_policy: lessons_pricing
        superseded_clause: >-
          The season passholder reduction is taken first where the product carries one and the participant is
          shown on the collective's records as holding a pass in the active state, then the group reduction, and
          the result is rounded to the cent.
        replaced_by: >-
          The reductions this policy names are the only ones taken off the block price
    trigger: state_due
    subject: [lessons_tuition_charge]
    computes: tuition_amount_usd
    target_tool: raise_session_tuition_charge_38aef0d5
    params:
      early_booking_points: 8
      ahead_booking_points: 4
      no_advance_points: 0
      long_stay_points: 14
      short_stay_points: 7
      no_stay_points: 0
      provisional_instructor_charge: 35.00
      no_instructor_charge: 0.00
      long_block_supplement: 40.00
      short_block_supplement: 20.00
      no_place_supplement: 0.00
      holiday_window_supplement: 60.00
      peak_window_supplement: 30.00
      base_window_supplement: 0.00
    rule: >
      The tuition raised for a booking is the product's block price, and the figure is rounded to the nearest
      cent. Where the booking earns no reduction the block price stands as it is, and nothing is added to it.
      Tuition is raised once for the booking, whatever the block holds, and an add-on the household asks for
      alongside the lesson is never folded into it. The reductions this policy names are the only ones taken off
      the block price, and each is expressed in percentage points off that price.
      A household that commits early earns the early booking reduction, counted in calendar days between the day
      the booking was recorded and the date the first session is due to run, the day of recording counting as day
      zero. Where a booking was recorded fourteen or more days ahead of its first session and the product is sold
      up to a hundred and twenty days ahead or further, the early booking points are earned. Where a booking was
      recorded fourteen or more days ahead of its first session and the product is sold up to fewer than a
      hundred and twenty days ahead, the ahead booking points are earned. Where a booking was recorded fewer than
      fourteen days ahead of its first session, no advance points are earned.
      A household staying with the collective earns the stay reduction, judged from the state of its lodging
      reservation and the deposit charged on that reservation's folio. Where the household holds a lodging
      reservation standing in the confirmed state and the deposit charged on that folio comes to a thousand
      dollars or more, the long stay points are earned. Where the household holds a lodging reservation standing
      in the confirmed state and the deposit charged on that folio comes to less than a thousand dollars, the
      short stay points are earned. Where the household holds no lodging reservation standing in the confirmed
      state, no stay points are earned.
      Which of the two reductions the school actually takes off is settled before either is applied, and it turns
      on whether the household is staying with the collective and on how far ahead the booking was recorded.
      Where the household holds a lodging reservation standing in the confirmed state and the booking was
      recorded fourteen or more days ahead of its first session, the two are combined into one total in
      percentage points and the block price is reduced once by that total. Where the household holds a lodging
      reservation standing in the confirmed state and the booking was recorded fewer than fourteen days ahead of
      its first session, the stay points alone are taken and the advance points are not taken at all. Where the
      household holds no lodging reservation standing in the confirmed state, the advance points alone are taken.
      A household that asked for a named instructor pays for that instructor, judged from the school's own
      request record against the booking. Where a request for a named instructor stands against the booking with
      an outcome of confirmed, the product's instructor request fee is added. Where a request for a named
      instructor stands against the booking with an outcome of accepted pending confirmation, the provisional
      instructor charge is added. Where no request for a named instructor stands against the booking, nothing is
      added on that count.
      A place already held for a block of sessions carries a place holding supplement, judged from the block
      loaded against the booking. Where the block loaded holds three or more sessions, the long block supplement
      is added. Where the block loaded holds one or two sessions, the short block supplement is added. Where no
      block has been loaded against the booking, no place holding supplement is added.
      The collective prices the same session differently by the rate window its own dates fall in, read from the
      state of the household's lodging reservation and the rate plan that reservation is priced on. Where the
      household holds a lodging reservation standing in the confirmed state priced on the holiday window, the
      holiday window supplement is added. Where the household holds a lodging reservation standing in the
      confirmed state priced on the peak window, the peak window supplement is added. Where the household holds
      no lodging reservation standing in the confirmed state, or its reservation is priced on the base window,
      the base window supplement is added.
      The points reduction acts on the block price and on nothing else; the instructor charge, the place holding
      supplement and the rate window supplement are then added to the figure the reduction leaves, and the
      tuition raised is that total rounded once to the nearest cent.
    prerequisite: []
    cross_category:
      - category: lodging
        as: branch
        reads: [status, rate_plan, lodging_folio.amount_usd]
        note: >-
          The stay reduction factor decides its tier from the state of the household's lodging reservation and
          the deposit charged on its folio, the selection factor from that reservation's state, and the rate
          window factor from the state and the rate plan that reservation is priced on.
    compute:
      - base_price: "P('block_price_usd')"
      - advance_days: "DAYS(F('booked_date'), F('first_session_date'))"
      - advance_points: "K('early_booking_points') if (advance_days >= 14 and P('advance_booking_days_max') >= 120) else (K('ahead_booking_points') if (advance_days >= 14 and P('advance_booking_days_max') < 120) else K('no_advance_points'))"
      - stay_deposit: "XSUM('lodging','lodging_folio','amount_usd', event_type='lodging_deposit_charge')"
      - stay_status: "CFIELD('lodging','status')"
      - stay_points: "K('long_stay_points') if (stay_status == 'confirmed' and stay_deposit >= 1000) else (K('short_stay_points') if (stay_status == 'confirmed' and stay_deposit < 1000) else K('no_stay_points'))"
      - selection_status: "CFIELD('lodging','status')"
      - taken_points: "advance_points + stay_points if (selection_status == 'confirmed' and advance_days >= 14) else (stay_points if (selection_status == 'confirmed' and advance_days < 14) else advance_points)"
      - after_reduction: "base_price * (100 - taken_points) / 100"
      - instructor_confirmed: "COUNT('lessons_requests', request_type='instructor_request', outcome='confirmed')"
      - instructor_pending: "COUNT('lessons_requests', request_type='instructor_request', outcome='accepted_pending_confirmation')"
      - instructor_charge: "P('instructor_request_fee_usd') if instructor_confirmed >= 1 else (K('provisional_instructor_charge') if instructor_pending >= 1 else K('no_instructor_charge'))"
      - sessions_loaded: "MAX('lessons_ledger','quantity', event_type='lessons_enroll_load')"
      - place_supplement: "K('long_block_supplement') if sessions_loaded >= 3 else (K('short_block_supplement') if sessions_loaded >= 1 else K('no_place_supplement'))"
      - window_status: "CFIELD('lodging','status')"
      - stay_rate_plan: "CFIELD('lodging','rate_plan')"
      - window_supplement: "K('holiday_window_supplement') if (window_status == 'confirmed' and stay_rate_plan == 'holiday') else (K('peak_window_supplement') if (window_status == 'confirmed' and stay_rate_plan == 'peak') else K('base_window_supplement'))"
      - result: "RND(after_reduction + instructor_charge + place_supplement + window_supplement, 2)"
    compute_basis:
      base_price: "The tuition raised for a booking is the product's block price, and the figure is rounded to the nearest cent."
      advance_days: "A household that commits early earns the early booking reduction, counted in calendar days between the day the booking was recorded and the date the first session is due to run, the day of recording counting as day zero."
      advance_points: "Where a booking was recorded fourteen or more days ahead of its first session and the product is sold up to a hundred and twenty days ahead or further, the early booking points are earned. Where a booking was recorded fourteen or more days ahead of its first session and the product is sold up to fewer than a hundred and twenty days ahead, the ahead booking points are earned. Where a booking was recorded fewer than fourteen days ahead of its first session, no advance points are earned."
      stay_deposit: "A household staying with the collective earns the stay reduction, judged from the state of its lodging reservation and the deposit charged on that reservation's folio."
      stay_status: "A household staying with the collective earns the stay reduction, judged from the state of its lodging reservation and the deposit charged on that reservation's folio."
      stay_points: "Where the household holds a lodging reservation standing in the confirmed state and the deposit charged on that folio comes to a thousand dollars or more, the long stay points are earned. Where the household holds a lodging reservation standing in the confirmed state and the deposit charged on that folio comes to less than a thousand dollars, the short stay points are earned. Where the household holds no lodging reservation standing in the confirmed state, no stay points are earned."
      selection_status: "Which of the two reductions the school actually takes off is settled before either is applied, and it turns on whether the household is staying with the collective and on how far ahead the booking was recorded."
      taken_points: "Where the household holds a lodging reservation standing in the confirmed state and the booking was recorded fourteen or more days ahead of its first session, the two are combined into one total in percentage points and the block price is reduced once by that total. Where the household holds a lodging reservation standing in the confirmed state and the booking was recorded fewer than fourteen days ahead of its first session, the stay points alone are taken and the advance points are not taken at all. Where the household holds no lodging reservation standing in the confirmed state, the advance points alone are taken."
      after_reduction: "The points reduction acts on the block price and on nothing else; the instructor charge, the place holding supplement and the rate window supplement are then added to the figure the reduction leaves, and the tuition raised is that total rounded once to the nearest cent."
      instructor_confirmed: "A household that asked for a named instructor pays for that instructor, judged from the school's own request record against the booking."
      instructor_pending: "A household that asked for a named instructor pays for that instructor, judged from the school's own request record against the booking."
      instructor_charge: "Where a request for a named instructor stands against the booking with an outcome of confirmed, the product's instructor request fee is added. Where a request for a named instructor stands against the booking with an outcome of accepted pending confirmation, the provisional instructor charge is added. Where no request for a named instructor stands against the booking, nothing is added on that count."
      sessions_loaded: "A place already held for a block of sessions carries a place holding supplement, judged from the block loaded against the booking."
      place_supplement: "Where the block loaded holds three or more sessions, the long block supplement is added. Where the block loaded holds one or two sessions, the short block supplement is added. Where no block has been loaded against the booking, no place holding supplement is added."
      window_status: "The collective prices the same session differently by the rate window its own dates fall in, read from the state of the household's lodging reservation and the rate plan that reservation is priced on."
      stay_rate_plan: "The collective prices the same session differently by the rate window its own dates fall in, read from the state of the household's lodging reservation and the rate plan that reservation is priced on."
      window_supplement: "Where the household holds a lodging reservation standing in the confirmed state priced on the holiday window, the holiday window supplement is added. Where the household holds a lodging reservation standing in the confirmed state priced on the peak window, the peak window supplement is added. Where the household holds no lodging reservation standing in the confirmed state, or its reservation is priced on the base window, the base window supplement is added."
      result: "The points reduction acts on the block price and on nothing else; the instructor charge, the place holding supplement and the rate window supplement are then added to the figure the reduction leaves, and the tuition raised is that total rounded once to the nearest cent."
    factors:
      - id: advance_rate_points
        effect: parameter
        decides: advance_points
        bindings: [advance_days, advance_points]
        ladder:
          - when: "the booking was recorded fourteen or more days ahead of its first session and the product is sold up to a hundred and twenty days ahead or further"
            value: "K('early_booking_points')"
          - when: "the booking was recorded fourteen or more days ahead of its first session and the product is sold up to fewer than a hundred and twenty days ahead"
            value: "K('ahead_booking_points')"
          - when: "otherwise"
            value: "K('no_advance_points')"
        baseline:
          advance_points: "K('no_advance_points')"
        evidence: [date, tier_param]
        cross_difficulty: null
      - id: resort_stay_points
        effect: parameter
        decides: stay_points
        bindings: [stay_deposit, stay_status, stay_points]
        ladder:
          - when: "the household holds a lodging reservation standing in the confirmed state and the deposit charged on that folio comes to a thousand dollars or more"
            value: "K('long_stay_points')"
          - when: "the household holds a lodging reservation standing in the confirmed state and the deposit charged on that folio comes to less than a thousand dollars"
            value: "K('short_stay_points')"
          - when: "otherwise"
            value: "K('no_stay_points')"
        baseline:
          stay_points: "K('no_stay_points')"
        evidence: [cross_category, history]
        cross_difficulty: lodging
      - id: reduction_selection_method
        effect: method
        decides: taken_points
        bindings: [selection_status, taken_points]
        ladder:
          - when: "the household holds a lodging reservation standing in the confirmed state and the booking was recorded fourteen or more days ahead of its first session"
            method: "the advance points and the stay points are combined into one total and the block price is reduced once by that total"
          - when: "the household holds a lodging reservation standing in the confirmed state and the booking was recorded fewer than fourteen days ahead of its first session"
            method: "the stay points alone are taken and the advance points are not taken at all"
          - when: "otherwise"
            method: "the advance points alone are taken"
        baseline:
          taken_points: "advance_points"
        evidence: [cross_category]
        cross_difficulty: lodging
      - id: named_instructor_charge
        effect: parameter
        decides: instructor_charge
        bindings: [instructor_confirmed, instructor_pending, instructor_charge]
        ladder:
          - when: "a request for a named instructor stands against the booking with an outcome of confirmed"
            value: "P('instructor_request_fee_usd')"
          - when: "a request for a named instructor stands against the booking with an outcome of accepted pending confirmation"
            value: "K('provisional_instructor_charge')"
          - when: "otherwise"
            value: "K('no_instructor_charge')"
        baseline:
          instructor_charge: "K('no_instructor_charge')"
        evidence: [history]
        cross_difficulty: null
      - id: place_hold_supplement
        effect: parameter
        decides: place_supplement
        bindings: [sessions_loaded, place_supplement]
        ladder:
          - when: "the block loaded against the booking holds three or more sessions"
            value: "K('long_block_supplement')"
          - when: "the block loaded against the booking holds one or two sessions"
            value: "K('short_block_supplement')"
          - when: "otherwise"
            value: "K('no_place_supplement')"
        baseline:
          place_supplement: "K('no_place_supplement')"
        evidence: [history]
        cross_difficulty: null
      - id: rate_window_supplement
        effect: parameter
        decides: window_supplement
        bindings: [window_status, stay_rate_plan, window_supplement]
        ladder:
          - when: "the household holds a lodging reservation standing in the confirmed state priced on the holiday window"
            value: "K('holiday_window_supplement')"
          - when: "the household holds a lodging reservation standing in the confirmed state priced on the peak window"
            value: "K('peak_window_supplement')"
          - when: "otherwise"
            value: "K('base_window_supplement')"
        baseline:
          window_supplement: "K('base_window_supplement')"
        evidence: [cross_category]
        cross_difficulty: lodging
    baseline:
      rule: >-
        The tuition raised for a booking is the product's block price, and the figure is rounded to the nearest
        cent. Where the booking earns no reduction the block price stands as it is, and nothing is added to it.
        Tuition is raised once for the booking, whatever the block holds, and an add-on the household asks for
        alongside the lesson is never folded into it.
      params: [block_price_usd, no_advance_points, no_stay_points, no_instructor_charge, no_place_supplement, base_window_supplement]
    inputs:
      history:
        - {table: lessons_requests, aggregate: count, field: lesson_request_id, within_months: null, filters: {request_type: instructor_request, outcome: confirmed}}
        - {table: lessons_ledger, aggregate: max, field: quantity, within_months: null, filters: {event_type: lessons_enroll_load}}
        - {category: lodging, table: lodging_folio, aggregate: sum, field: amount_usd, within_months: null, filters: {event_type: lodging_deposit_charge}}
      cross_category: [lodging]

  - id: lessons_ext_lift_access_addon
    base_policy_refs: [lessons_pricing]
    overwrite:
      - base_policy: lessons_pricing
        superseded_clause: >-
          Add-ons the household asks for are raised as their own entries at the product's add-on prices, one
          entry for each kind of add-on and each session date, and an add-on already included in the product is
          never raised as a charge.
        replaced_by: >-
          The lift access add-on raised for a booking is the product's lift ticket add-on price multiplied by the
          number of sessions the booking holds, and the figure is rounded to the nearest cent.
    trigger: state_due
    subject: [lessons_equipment_addon]
    computes: addon_charge_usd
    target_tool: raise_lift_access_addon_aea17349
    params:
      half_day_share: 50
      advance_ticket_points: 15
      near_ticket_points: 5
      window_ticket_points: 0
      holiday_stay_points: 20
      peak_stay_points: 10
      no_stay_ticket_points: 0
      full_bundle_points: 10
      part_bundle_points: 5
      no_bundle_points: 0
    rule: >
      A participant who holds neither a season pass standing in the active state nor a ticket order carrying a
      ski day for the session date cannot reach the teaching terrain, so the school puts the lift access the
      lesson day needs on the booking as an add-on of its own. The lift access add-on raised for a booking is the
      product's lift ticket add-on price multiplied by the number of sessions the booking holds, and the figure
      is rounded to the nearest cent. A product that includes a lift ticket in its price never carries this
      add-on at all, and one entry is raised for each session date the access covers. The entry names the date
      the booking's first session is due to run at the moment the access is put on the booking, and a date the
      household has asked the school to move the lesson to, which the booking does not yet stand on, is never
      named.
      How long the participant is actually on the hill decides which count the price is taken on. Where a block
      has been loaded against the booking and the product's session runs for four hours or more, the price is
      taken in full for each session the block loaded. Where a block has been loaded against the booking and the
      product's session runs for fewer than four hours, the price is taken at the half day share for each session
      the block loaded, a short session needing only half a lift day. Where no block has been loaded against the
      booking, the price is taken in full for each session the booking holds.
      Lift access bought ahead of the day costs less than lift access bought at the window, counted in calendar
      days between the handling date and the date the session is due to run, the handling date counting as day
      zero. Where the session is seven or more days off, the advance ticket points are allowed. Where the session
      is between one and six days off, the near ticket points are allowed. Where the session falls on the
      handling date or has already passed, the window ticket points are allowed.
      A household staying with the collective is allowed lift access on the terms its stay is priced on, read
      from the state of its lodging reservation and the rate plan that reservation is priced on. Where the
      household holds a lodging reservation standing in the confirmed state priced on the holiday window, the
      holiday stay points are allowed. Where the household holds a lodging reservation standing in the confirmed
      state priced on the peak window, the peak stay points are allowed. Where the household holds no lodging
      reservation standing in the confirmed state, no stay points are allowed.
      Extras taken together cost less than extras taken one at a time, judged by the add-on entries already
      standing against the booking. Where two or more add-on entries already stand against the booking, the full
      bundle points are allowed. Where exactly one add-on entry already stands against it, the part bundle points
      are allowed. Where no add-on entry stands against it, no bundle points are allowed.
      The three reductions are first combined into one total in percentage points and the figure taken on the
      count above is reduced once by that total; they never act one after another on what the previous one left,
      and the result is rounded once to the nearest cent.
    prerequisite: []
    cross_category:
      - category: lodging
        as: branch
        reads: [status, rate_plan]
        note: >-
          The stay points factor decides its tier from the state of the household's lodging reservation and the
          rate window that reservation is priced on.
    compute:
      - sessions_loaded: "MAX('lessons_ledger','quantity', event_type='lessons_enroll_load')"
      - load_entries: "COUNT('lessons_ledger', event_type='lessons_enroll_load')"
      - access_basis: "P('lift_ticket_addon_usd') * sessions_loaded if (load_entries >= 1 and P('session_duration_hours') >= 4) else ((P('lift_ticket_addon_usd') * K('half_day_share') / 100) * sessions_loaded if (load_entries >= 1 and P('session_duration_hours') < 4) else P('lift_ticket_addon_usd') * F('sessions_booked'))"
      - days_to_session: "DAYS(NOW, F('first_session_date'))"
      - advance_points: "K('advance_ticket_points') if days_to_session >= 7 else (K('near_ticket_points') if days_to_session >= 1 else K('window_ticket_points'))"
      - stay_status: "CFIELD('lodging','status')"
      - stay_rate_plan: "CFIELD('lodging','rate_plan')"
      - stay_ticket_points: "K('holiday_stay_points') if (stay_status == 'confirmed' and stay_rate_plan == 'holiday') else (K('peak_stay_points') if (stay_status == 'confirmed' and stay_rate_plan == 'peak') else K('no_stay_ticket_points'))"
      - addon_entries: "COUNT('lessons_ledger', event_type='lessons_equipment_addon')"
      - bundle_points: "K('full_bundle_points') if addon_entries >= 2 else (K('part_bundle_points') if addon_entries >= 1 else K('no_bundle_points'))"
      - total_points: "advance_points + stay_ticket_points + bundle_points"
      - result: "RND(access_basis * (100 - total_points) / 100, 2)"
    compute_basis:
      sessions_loaded: "How long the participant is actually on the hill decides which count the price is taken on."
      load_entries: "How long the participant is actually on the hill decides which count the price is taken on."
      access_basis: "Where a block has been loaded against the booking and the product's session runs for four hours or more, the price is taken in full for each session the block loaded. Where a block has been loaded against the booking and the product's session runs for fewer than four hours, the price is taken at the half day share for each session the block loaded, a short session needing only half a lift day. Where no block has been loaded against the booking, the price is taken in full for each session the booking holds."
      days_to_session: "Lift access bought ahead of the day costs less than lift access bought at the window, counted in calendar days between the handling date and the date the session is due to run, the handling date counting as day zero."
      advance_points: "Where the session is seven or more days off, the advance ticket points are allowed. Where the session is between one and six days off, the near ticket points are allowed. Where the session falls on the handling date or has already passed, the window ticket points are allowed."
      stay_status: "A household staying with the collective is allowed lift access on the terms its stay is priced on, read from the state of its lodging reservation and the rate plan that reservation is priced on."
      stay_rate_plan: "A household staying with the collective is allowed lift access on the terms its stay is priced on, read from the state of its lodging reservation and the rate plan that reservation is priced on."
      stay_ticket_points: "Where the household holds a lodging reservation standing in the confirmed state priced on the holiday window, the holiday stay points are allowed. Where the household holds a lodging reservation standing in the confirmed state priced on the peak window, the peak stay points are allowed. Where the household holds no lodging reservation standing in the confirmed state, no stay points are allowed."
      addon_entries: "Extras taken together cost less than extras taken one at a time, judged by the add-on entries already standing against the booking."
      bundle_points: "Where two or more add-on entries already stand against the booking, the full bundle points are allowed. Where exactly one add-on entry already stands against it, the part bundle points are allowed. Where no add-on entry stands against it, no bundle points are allowed."
      total_points: "The three reductions are first combined into one total in percentage points and the figure taken on the count above is reduced once by that total; they never act one after another on what the previous one left, and the result is rounded once to the nearest cent."
      result: "The three reductions are first combined into one total in percentage points and the figure taken on the count above is reduced once by that total; they never act one after another on what the previous one left, and the result is rounded once to the nearest cent."
    factors:
      - id: session_length_method
        effect: method
        decides: access_basis
        bindings: [sessions_loaded, load_entries, access_basis]
        ladder:
          - when: "a block has been loaded against the booking and the product's session runs for four hours or more"
            method: "the price is taken in full for each session the block loaded"
          - when: "a block has been loaded against the booking and the product's session runs for fewer than four hours"
            method: "the price is taken at the half day share for each session the block loaded"
          - when: "otherwise"
            method: "the price is taken in full for each session the booking holds"
        baseline:
          access_basis: "P('lift_ticket_addon_usd') * F('sessions_booked')"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: advance_purchase_points
        effect: parameter
        decides: advance_points
        bindings: [days_to_session, advance_points]
        ladder:
          - when: "the session is seven or more days off"
            value: "K('advance_ticket_points')"
          - when: "the session is between one and six days off"
            value: "K('near_ticket_points')"
          - when: "otherwise"
            value: "K('window_ticket_points')"
        baseline:
          advance_points: "K('window_ticket_points')"
        evidence: [date]
        cross_difficulty: null
      - id: resort_guest_ticket_points
        effect: parameter
        decides: stay_ticket_points
        bindings: [stay_status, stay_rate_plan, stay_ticket_points]
        ladder:
          - when: "the household holds a lodging reservation standing in the confirmed state priced on the holiday window"
            value: "K('holiday_stay_points')"
          - when: "the household holds a lodging reservation standing in the confirmed state priced on the peak window"
            value: "K('peak_stay_points')"
          - when: "otherwise"
            value: "K('no_stay_ticket_points')"
        baseline:
          stay_ticket_points: "K('no_stay_ticket_points')"
        evidence: [cross_category]
        cross_difficulty: lodging
      - id: extras_bundle_points
        effect: parameter
        decides: bundle_points
        bindings: [addon_entries, bundle_points]
        ladder:
          - when: "two or more add-on entries already stand against the booking"
            value: "K('full_bundle_points')"
          - when: "exactly one add-on entry already stands against the booking"
            value: "K('part_bundle_points')"
          - when: "otherwise"
            value: "K('no_bundle_points')"
        baseline:
          bundle_points: "K('no_bundle_points')"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        A participant who holds neither a season pass standing in the active state nor a ticket order carrying a
        ski day for the session date cannot reach the teaching terrain, so the school puts the lift access the
        lesson day needs on the booking as an add-on of its own. The lift access add-on raised for a booking is
        the product's lift ticket add-on price multiplied by the number of sessions the booking holds, and the
        figure is rounded to the nearest cent. A product that includes a lift ticket in its price never carries
        this add-on at all, and one entry is raised for each session date the access covers.
      params: [lift_ticket_addon_usd, window_ticket_points, no_stay_ticket_points, no_bundle_points]
    inputs:
      history:
        - {table: lessons_ledger, aggregate: max, field: quantity, within_months: null, filters: {event_type: lessons_enroll_load}}
        - {table: lessons_ledger, aggregate: count, field: lesson_event_id, within_months: null, filters: {event_type: lessons_equipment_addon}}
      cross_category: [lodging]


  - id: lessons_ext_date_change_fee
    base_policy_refs: [lessons_change_terms, lessons_pricing]
    overwrite:
      - base_policy: lessons_change_terms
        superseded_clause: >-
          A booking may be moved to another date where the product allows it, up to the number of moves the
          product allows, and each move carries the product's move fee.
        replaced_by: >-
          The fee for a change of date is the product's move fee, and the figure is rounded to the nearest cent.
    trigger: on_request
    subject: [lessons_reschedule]
    computes: change_fee_usd
    target_tool: confirm_lesson_date_change_58e66cab
    params:
      long_notice_fee: 20.00
      mid_notice_fee: 35.00
      multi_addon_handling: 30.00
      single_addon_handling: 18.00
      no_addon_handling: 0.00
      named_instructor_rebooking: 40.00
      pending_instructor_rebooking: 15.00
      no_instructor_rebooking: 0.00
      large_booking_share: 4
      small_booking_share: 2
      no_booking_share: 0
    rule: >
      The fee for a change of date is the product's move fee, and the figure is rounded to the nearest cent. The
      share of the booking's value that is added to it is taken on the tuition standing alone, and where the
      booking earns no share nothing is added on that count. A move does not reprice the booking, so the tuition
      already standing on it is untouched by the change.
      The more warning the school is given, the less the change costs, counted in calendar days between the
      handling date and the date the first session is due to run, the handling date counting as day zero. Where
      the first session is seven or more days off, the long notice fee is charged. Where the first session is
      between three and six days off, the mid notice fee is charged. Where the first session is fewer than three
      days off, the product's move fee is charged.
      Whatever the school laid on for the old date has to be laid on again for the new one, so a handling amount
      is added by the number of add-on entries standing against the booking. The handling amount for re-arranging
      what the school laid on is worked out only once the school account carries the add-on entry due for the
      lift access the session date requires. Where two or more add-on entries stand against the booking, the
      multi add-on handling is added. Where exactly one add-on entry stands against it, the single add-on
      handling is added. Where no add-on entry stands against it, no handling amount is added.
      An instructor the household asked for by name has to be freed for the new date, judged from the school's
      own request record and the instructor written on the booking. Where a request for a named instructor stands
      against the booking with an outcome of confirmed and an instructor is written on the booking, the named
      instructor rebooking amount is added. Where a request for a named instructor stands against the booking
      with an outcome of confirmed and no instructor is written on the booking, the pending instructor rebooking
      amount is added. Where no confirmed request for a named instructor stands against the booking, no rebooking
      amount is added.
      What the booking's value is reckoned on turns on what the move actually disturbs, judged from the block
      loaded against the booking. Where a block has been loaded against the booking and it holds more than one
      session, the value is reckoned on the tuition standing divided by the sessions that block loaded, only the
      session being moved carrying value. Where a block has been loaded against the booking and it holds a single
      session, the value is reckoned on the tuition standing together with the add-ons standing on the booking,
      the whole engagement moving with its one session. Where no block has been loaded against the booking, the
      value is reckoned on the tuition standing alone.
      A share of the booking's value is added to the figure, because a place worth more costs more to move. The
      share of the booking's value that is added to the fee is fixed only after the school account carries the
      tuition entry due for the booking. Where the tuition standing reaches the product's session price, the
      large booking share is added. Where the tuition standing is above nothing but short of the product's
      session price, the small booking share is added. Where no tuition stands on the booking, no booking share
      is added.
      The notice fee, the handling amount and the rebooking amount are added together; the share of the booking's
      value is worked out on the figure the reckoning above names and added to that total; and the fee charged is
      the whole rounded once to the nearest cent.
    prerequisite:
      - problem: lessons_ext_session_tuition_charge
        kind: value_input
        gate: tuition_standing
        form: state
        policy_source: >-
          The share of the booking's value that is added to the fee is fixed only after the school account
          carries the tuition entry due for the booking.
        condition: >-
          The booking's school account carries a tuition entry for the amount of tuition due on the booking.
        resolved_by: raise_session_tuition_charge_38aef0d5
        effect: >-
          The tuition standing binding rises from nothing to the tuition raised, the figure the booking's value
          is reckoned on rises with it, and the share added to the fee rises with the amount, so the fee charged
          changes.
      - problem: lessons_ext_lift_access_addon
        kind: value_input
        gate: addon_entries
        form: state
        policy_source: >-
          The handling amount for re-arranging what the school laid on is worked out only once the school account
          carries the add-on entry due for the lift access the session date requires.
        condition: >-
          The booking's school account carries an add-on entry covering the lift access the session date
          requires, alongside whatever other add-on entries already stand on it.
        resolved_by: raise_lift_access_addon_aea17349
        effect: >-
          The add-on entries binding rises by one, so the handling amount moves up a tier, and the add-ons
          standing on the booking rise with it, so the fee charged changes twice over.
    cross_category: []
    compute:
      - days_of_notice: "DAYS(NOW, F('first_session_date'))"
      - notice_fee: "K('long_notice_fee') if days_of_notice >= 7 else (K('mid_notice_fee') if days_of_notice >= 3 else P('reschedule_fee_usd'))"
      - addon_entries: "COUNT('lessons_ledger', event_type='lessons_equipment_addon')"
      - addon_handling: "K('multi_addon_handling') if addon_entries >= 2 else (K('single_addon_handling') if addon_entries >= 1 else K('no_addon_handling'))"
      - instructor_requests: "COUNT('lessons_requests', request_type='instructor_request', outcome='confirmed')"
      - instructor_rebooking: "K('named_instructor_rebooking') if (instructor_requests >= 1 and F('instructor_name') != '') else (K('pending_instructor_rebooking') if (instructor_requests >= 1 and F('instructor_name') == '') else K('no_instructor_rebooking'))"
      - raw_fee: "notice_fee + addon_handling + instructor_rebooking"
      - tuition_standing: "SUM('lessons_ledger','amount_usd', event_type='lessons_tuition_charge')"
      - value_share: "K('large_booking_share') if tuition_standing >= P('session_price_usd') else (K('small_booking_share') if tuition_standing > 0 else K('no_booking_share'))"
      - sessions_loaded: "MAX('lessons_ledger','quantity', event_type='lessons_enroll_load')"
      - load_entries: "COUNT('lessons_ledger', event_type='lessons_enroll_load')"
      - addon_total: "SUM('lessons_ledger','amount_usd', event_type='lessons_equipment_addon')"
      - value_base: "tuition_standing / sessions_loaded if (load_entries >= 1 and sessions_loaded > 1) else (tuition_standing + addon_total if (load_entries >= 1 and sessions_loaded <= 1) else tuition_standing)"
      - value_component: "value_base * value_share / 100"
      - result: "RND(raw_fee + value_component, 2)"
    compute_basis:
      days_of_notice: "The more warning the school is given, the less the change costs, counted in calendar days between the handling date and the date the first session is due to run, the handling date counting as day zero."
      notice_fee: "Where the first session is seven or more days off, the long notice fee is charged. Where the first session is between three and six days off, the mid notice fee is charged. Where the first session is fewer than three days off, the product's move fee is charged."
      addon_entries: "Whatever the school laid on for the old date has to be laid on again for the new one, so a handling amount is added by the number of add-on entries standing against the booking."
      addon_handling: "Where two or more add-on entries stand against the booking, the multi add-on handling is added. Where exactly one add-on entry stands against it, the single add-on handling is added. Where no add-on entry stands against it, no handling amount is added."
      instructor_requests: "An instructor the household asked for by name has to be freed for the new date, judged from the school's own request record and the instructor written on the booking."
      instructor_rebooking: "Where a request for a named instructor stands against the booking with an outcome of confirmed and an instructor is written on the booking, the named instructor rebooking amount is added. Where a request for a named instructor stands against the booking with an outcome of confirmed and no instructor is written on the booking, the pending instructor rebooking amount is added. Where no confirmed request for a named instructor stands against the booking, no rebooking amount is added."
      raw_fee: "The notice fee, the handling amount and the rebooking amount are added together; the share of the booking's value is worked out on the figure the reckoning above names and added to that total; and the fee charged is the whole rounded once to the nearest cent."
      tuition_standing: "The share of the booking's value that is added to the fee is fixed only after the school account carries the tuition entry due for the booking."
      value_share: "Where the tuition standing reaches the product's session price, the large booking share is added. Where the tuition standing is above nothing but short of the product's session price, the small booking share is added. Where no tuition stands on the booking, no booking share is added."
      sessions_loaded: "What the booking's value is reckoned on turns on what the move actually disturbs, judged from the block loaded against the booking."
      load_entries: "What the booking's value is reckoned on turns on what the move actually disturbs, judged from the block loaded against the booking."
      addon_total: "Where a block has been loaded against the booking and it holds a single session, the value is reckoned on the tuition standing together with the add-ons standing on the booking, the whole engagement moving with its one session."
      value_base: "Where a block has been loaded against the booking and it holds more than one session, the value is reckoned on the tuition standing divided by the sessions that block loaded, only the session being moved carrying value. Where a block has been loaded against the booking and it holds a single session, the value is reckoned on the tuition standing together with the add-ons standing on the booking, the whole engagement moving with its one session. Where no block has been loaded against the booking, the value is reckoned on the tuition standing alone."
      value_component: "A share of the booking's value is added to the figure, because a place worth more costs more to move."
      result: "The notice fee, the handling amount and the rebooking amount are added together; the share of the booking's value is worked out on the figure the reckoning above names and added to that total; and the fee charged is the whole rounded once to the nearest cent."
    factors:
      - id: notice_band_fee
        effect: parameter
        decides: notice_fee
        bindings: [days_of_notice, notice_fee]
        ladder:
          - when: "the first session is seven or more days off"
            value: "K('long_notice_fee')"
          - when: "the first session is between three and six days off"
            value: "K('mid_notice_fee')"
          - when: "otherwise"
            value: "P('reschedule_fee_usd')"
        baseline:
          notice_fee: "P('reschedule_fee_usd')"
        evidence: [date]
        cross_difficulty: null
      - id: addon_rearrangement
        effect: parameter
        decides: addon_handling
        bindings: [addon_entries, addon_handling]
        ladder:
          - when: "two or more add-on entries stand against the booking"
            value: "K('multi_addon_handling')"
          - when: "exactly one add-on entry stands against the booking"
            value: "K('single_addon_handling')"
          - when: "otherwise"
            value: "K('no_addon_handling')"
        baseline:
          addon_handling: "K('no_addon_handling')"
        evidence: [history]
        cross_difficulty: null
      - id: instructor_rebooking_amount
        effect: parameter
        decides: instructor_rebooking
        bindings: [instructor_requests, instructor_rebooking]
        ladder:
          - when: "a request for a named instructor stands against the booking with an outcome of confirmed and an instructor is written on the booking"
            value: "K('named_instructor_rebooking')"
          - when: "a request for a named instructor stands against the booking with an outcome of confirmed and no instructor is written on the booking"
            value: "K('pending_instructor_rebooking')"
          - when: "otherwise"
            value: "K('no_instructor_rebooking')"
        baseline:
          instructor_rebooking: "K('no_instructor_rebooking')"
        evidence: [history]
        cross_difficulty: null
      - id: moved_value_method
        effect: method
        decides: value_base
        bindings: [sessions_loaded, load_entries, addon_total, value_base]
        ladder:
          - when: "a block has been loaded against the booking and it holds more than one session"
            method: "the value is reckoned on the tuition standing divided by the sessions that block loaded"
          - when: "a block has been loaded against the booking and it holds a single session"
            method: "the value is reckoned on the tuition standing together with the add-ons standing on the booking"
          - when: "otherwise"
            method: "the value is reckoned on the tuition standing alone"
        baseline:
          value_base: "tuition_standing"
        evidence: [history]
        cross_difficulty: null
      - id: booking_value_share
        effect: parameter
        decides: value_share
        bindings: [tuition_standing, value_share]
        ladder:
          - when: "the tuition standing on the booking reaches the product's session price"
            value: "K('large_booking_share')"
          - when: "the tuition standing on the booking is above nothing but short of the product's session price"
            value: "K('small_booking_share')"
          - when: "otherwise"
            value: "K('no_booking_share')"
        baseline:
          value_share: "K('no_booking_share')"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The fee for a change of date is the product's move fee, and the figure is rounded to the nearest cent. The
        share of the booking's value that is added to it is taken on the tuition standing alone, and where the
        booking earns no share nothing is added on that count. A move does not reprice the booking, so the tuition
        already standing on it is untouched by the change.
      params: [reschedule_fee_usd, no_addon_handling, no_instructor_rebooking, no_booking_share]
    inputs:
      history:
        - {table: lessons_ledger, aggregate: count, field: lesson_event_id, within_months: null, filters: {event_type: lessons_equipment_addon}}
        - {table: lessons_ledger, aggregate: sum, field: amount_usd, within_months: null, filters: {event_type: lessons_equipment_addon}}
        - {table: lessons_ledger, aggregate: sum, field: amount_usd, within_months: null, filters: {event_type: lessons_tuition_charge}}
        - {table: lessons_ledger, aggregate: max, field: quantity, within_months: null, filters: {event_type: lessons_enroll_load}}
        - {table: lessons_requests, aggregate: count, field: lesson_request_id, within_months: null, filters: {request_type: instructor_request, outcome: confirmed}}
      cross_category: []
