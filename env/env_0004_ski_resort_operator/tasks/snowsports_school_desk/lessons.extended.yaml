  - id: lessons_session_delivery
    subject: [lessons_enroll_load, lessons_session_deliver, lessons_start]
    rule: >
      The block of sessions a product holds is loaded against the participant once the booking becomes firm,
      and one session is drawn each time a session is delivered. The block is loaded only while the booking
      record stands in the confirmed or in_progress state. A session counts as delivered when the instructor
      takes the participant from the meeting point, and a participant who arrives after the product's grace
      period has run out has missed that session rather than shortened it. The booking moves to the state of
      being under way on the first delivery and to the delivered state when the block runs out. Where a
      session is lost to weather or mountain conditions the collective makes good on the product's weather
      basis, and that session is not drawn from the block. Sessions the participant misses for their own
      reasons may be made up only up to the product's makeup allowance and only where the makeup is booked
      within the product's makeup period; beyond that the session is drawn from the block and gone.
      Sessions run from the product's published start time at the product's own meeting point, a helmet
      is issued with the products that include one, and a product that calls for adaptive certification
      is staffed only by an instructor who holds it, so a session whose assigned instructor does not is
      stood down and made good rather than delivered.
    eligibility:
      - id: block_loaded_on_firm_booking
        applies_to: [lessons_enroll_load]
        kind: state
        condition: "The block is loaded only while the booking record stands in the confirmed or in_progress state."
        evidence_fields: [lessons_holdings.lesson_id, lessons_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lessons_holdings.lesson_id]
          action_bindings:
            lessons_holdings.lesson_id: lesson_id
        state_contract:
          field: lessons_holdings.status
          allowed: [confirmed, in_progress]
    params:
      per_tier:
        All-Mountain Adult Group Lesson: {sessions_per_booking: "=sessions_per_booking", session_duration_hours: "=session_duration_hours", session_start_time: "=session_start_time", meeting_point: "=meeting_point", late_arrival_grace_minutes: "=late_arrival_grace_minutes", makeup_sessions_allowed: "=makeup_sessions_allowed", makeup_booking_days: "=makeup_booking_days", weather_cancellation_basis: "=weather_cancellation_basis", programme_weeks: "=programme_weeks", helmet_included: "=helmet_included", adaptive_certified_required: "=adaptive_certified_required"}
        Mountain Explorers Group Lesson: {sessions_per_booking: "=sessions_per_booking", session_duration_hours: "=session_duration_hours", session_start_time: "=session_start_time", meeting_point: "=meeting_point", late_arrival_grace_minutes: "=late_arrival_grace_minutes", makeup_sessions_allowed: "=makeup_sessions_allowed", makeup_booking_days: "=makeup_booking_days", weather_cancellation_basis: "=weather_cancellation_basis", programme_weeks: "=programme_weeks", helmet_included: "=helmet_included", adaptive_certified_required: "=adaptive_certified_required"}
        Mountain Cubs Group Lesson: {sessions_per_booking: "=sessions_per_booking", session_duration_hours: "=session_duration_hours", session_start_time: "=session_start_time", meeting_point: "=meeting_point", late_arrival_grace_minutes: "=late_arrival_grace_minutes", makeup_sessions_allowed: "=makeup_sessions_allowed", makeup_booking_days: "=makeup_booking_days", weather_cancellation_basis: "=weather_cancellation_basis", programme_weeks: "=programme_weeks", helmet_included: "=helmet_included", adaptive_certified_required: "=adaptive_certified_required"}
        Six-Week Development Programme: {sessions_per_booking: "=sessions_per_booking", session_duration_hours: "=session_duration_hours", session_start_time: "=session_start_time", meeting_point: "=meeting_point", late_arrival_grace_minutes: "=late_arrival_grace_minutes", makeup_sessions_allowed: "=makeup_sessions_allowed", makeup_booking_days: "=makeup_booking_days", weather_cancellation_basis: "=weather_cancellation_basis", programme_weeks: "=programme_weeks", helmet_included: "=helmet_included", adaptive_certified_required: "=adaptive_certified_required"}
        Semi-Private Coaching Session: {sessions_per_booking: "=sessions_per_booking", session_duration_hours: "=session_duration_hours", session_start_time: "=session_start_time", meeting_point: "=meeting_point", late_arrival_grace_minutes: "=late_arrival_grace_minutes", makeup_sessions_allowed: "=makeup_sessions_allowed", makeup_booking_days: "=makeup_booking_days", weather_cancellation_basis: "=weather_cancellation_basis", programme_weeks: "=programme_weeks", helmet_included: "=helmet_included", adaptive_certified_required: "=adaptive_certified_required"}
