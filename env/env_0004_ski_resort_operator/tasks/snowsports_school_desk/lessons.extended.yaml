  - id: lessons_cancellation
    subject: [lessons_cancel, lessons_credit_issue]
    rule: >
      A household may give a booking up at any time, and what they get back turns on how much notice they
      gave. A cancellation carries no fee only when it is recorded on or before the free cancellation
      deadline, which is the product's free cancellation period measured back from the moment the first
      session is due to start. The notice period is measured in whole elapsed hours on the mountain's local
      clock and is subtracted from the scheduled start of the first session to give the deadline; elapsed
      hours are never mixed with calendar days, and an hour begun is not an hour elapsed. Inside that
      deadline the whole tuition raised for the booking comes back and any add-ons come back with it.
      After it, the product's late cancellation share of the booking price is retained as a fee and the
      remainder comes back. Where sessions have already been delivered, only the sessions still to come are
      given back, worked out as the tuition divided by the sessions the block held and multiplied by the
      sessions still to come. Where the collective cancels the session for weather, mountain conditions or
      an instructor being unavailable, the product's weather basis decides what the household receives and
      no fee is retained. What comes back is issued as school credit; a return to the original payment
      method is a finance team decision rather than a desk decision.
    eligibility:
      - id: free_cancellation_deadline
        applies_to: [lessons_cancel]
        kind: time
        condition: "A cancellation carries no fee only when it is recorded on or before the free cancellation deadline, which is the product's free cancellation period measured back from the moment the first session is due to start."
        evidence_fields: [lessons_holdings.lesson_id, lessons_holdings.first_session_date, lessons_holdings.session_time, lessons_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lessons_holdings.lesson_id]
          action_bindings:
            lessons_holdings.lesson_id: lesson_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the first session is due to start"
          anchor_source: lessons_holdings.first_session_date
          relation: not_after
          duration_source: variants.free_cancellation_hours
          unit: elapsed_hours
          counting_rule: "The notice period is measured in whole elapsed hours on the mountain's local clock and is subtracted from the scheduled start of the first session to give the deadline; elapsed hours are never mixed with calendar days, and an hour begun is not an hour elapsed."
          boundary: inclusive
    params:
      per_tier:
        All-Mountain Adult Group Lesson: {free_cancellation_hours: "=free_cancellation_hours", late_cancellation_fee_pct: "=late_cancellation_fee_pct", weather_cancellation_basis: "=weather_cancellation_basis", sessions_per_booking: "=sessions_per_booking", refund_processing_days: "=refund_processing_days"}
        Mountain Explorers Group Lesson: {free_cancellation_hours: "=free_cancellation_hours", late_cancellation_fee_pct: "=late_cancellation_fee_pct", weather_cancellation_basis: "=weather_cancellation_basis", sessions_per_booking: "=sessions_per_booking", refund_processing_days: "=refund_processing_days"}
        Mountain Cubs Group Lesson: {free_cancellation_hours: "=free_cancellation_hours", late_cancellation_fee_pct: "=late_cancellation_fee_pct", weather_cancellation_basis: "=weather_cancellation_basis", sessions_per_booking: "=sessions_per_booking", refund_processing_days: "=refund_processing_days"}
        Six-Week Development Programme: {free_cancellation_hours: "=free_cancellation_hours", late_cancellation_fee_pct: "=late_cancellation_fee_pct", weather_cancellation_basis: "=weather_cancellation_basis", sessions_per_booking: "=sessions_per_booking", refund_processing_days: "=refund_processing_days"}
        Semi-Private Coaching Session: {free_cancellation_hours: "=free_cancellation_hours", late_cancellation_fee_pct: "=late_cancellation_fee_pct", weather_cancellation_basis: "=weather_cancellation_basis", sessions_per_booking: "=sessions_per_booking", refund_processing_days: "=refund_processing_days"}
        Private Instruction Full Day: {free_cancellation_hours: "=free_cancellation_hours", late_cancellation_fee_pct: "=late_cancellation_fee_pct", weather_cancellation_basis: "=weather_cancellation_basis", sessions_per_booking: "=sessions_per_booking", refund_processing_days: "=refund_processing_days"}
        Elite Performance Camp: {free_cancellation_hours: "=free_cancellation_hours", late_cancellation_fee_pct: "=late_cancellation_fee_pct", weather_cancellation_basis: "=weather_cancellation_basis", sessions_per_booking: "=sessions_per_booking", refund_processing_days: "=refund_processing_days"}
    measures: [lessons_msr_sessions_delivered]
    formula:
      when_not: "weather_cancellation_basis == 'full_refund'"
      refundable_usd: "max(0, round(block_price_usd * (sessions_per_booking - lessons_msr_sessions_delivered) / sessions_per_booking * (1 - late_cancellation_fee_pct / 100), 2))"

  - id: lessons_no_show_and_fees
    subject: [lessons_no_show, lessons_fee_charge]
    rule: >
      A participant who does not present at the meeting point within the product's grace period has missed
      the session, and the booking is marked as missed rather than cancelled. The missed session fee is
      raised only once the assessment lag has run out counted in calendar days from the day the session was
      due to run. Calendar days are counted forward from the anchor date, the anchor date itself counting as
      day zero, every day of the week counting alike, and a calendar day is never mixed with a full 24-hour
      period; where the resulting boundary falls on a date that does not exist in the target month, the last
      day of that month is used. The fee is the product's missed session share of the booking price, and it
      is raised once for the booking however many sessions of a block were missed together. A fee is raised
      against a booking only while the booking record stands in the confirmed, in_progress, cancelled or
      no_show state. A missed session is never made up: the makeup allowance covers sessions the household
      gave notice of, not sessions nobody turned up for. Where the participant was prevented from presenting
      by the mountain being closed or by the instructor not arriving, no fee is raised at all and the session
      is treated as lost to the mountain.
    eligibility:
      - id: assessment_lag_elapsed
        applies_to: [lessons_fee_charge]
        kind: time
        condition: "The missed session fee is raised only once the assessment lag has run out counted in calendar days from the day the session was due to run."
        evidence_fields: [lessons_holdings.lesson_id, lessons_holdings.first_session_date, lessons_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lessons_holdings.lesson_id]
          action_bindings:
            lessons_holdings.lesson_id: lesson_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the session was due to run"
          anchor_source: lessons_holdings.first_session_date
          relation: not_before
          duration_source: variants.no_show_assessment_lag_days
          unit: calendar_days
          counting_rule: "Calendar days are counted forward from the anchor date, the anchor date itself counting as day zero, every day of the week counting alike, and a calendar day is never mixed with a full 24-hour period; where the resulting boundary falls on a date that does not exist in the target month, the last day of that month is used."
          boundary: inclusive
      - id: fee_bearing_booking_state
        applies_to: [lessons_fee_charge]
        kind: state
        condition: "A fee is raised against a booking only while the booking record stands in the confirmed, in_progress, cancelled or no_show state."
        evidence_fields: [lessons_holdings.lesson_id, lessons_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lessons_holdings.lesson_id]
          action_bindings:
            lessons_holdings.lesson_id: lesson_id
        state_contract:
          field: lessons_holdings.status
          allowed: [confirmed, in_progress, cancelled, no_show]
    params:
      per_tier:
        All-Mountain Adult Group Lesson: {no_show_fee_pct: "=no_show_fee_pct", no_show_assessment_lag_days: "=no_show_assessment_lag_days", late_arrival_grace_minutes: "=late_arrival_grace_minutes", late_cancellation_fee_pct: "=late_cancellation_fee_pct", reschedule_fee_usd: "=reschedule_fee_usd", transfer_fee_usd: "=transfer_fee_usd", instructor_request_fee_usd: "=instructor_request_fee_usd"}
        Mountain Explorers Group Lesson: {no_show_fee_pct: "=no_show_fee_pct", no_show_assessment_lag_days: "=no_show_assessment_lag_days", late_arrival_grace_minutes: "=late_arrival_grace_minutes", late_cancellation_fee_pct: "=late_cancellation_fee_pct", reschedule_fee_usd: "=reschedule_fee_usd", transfer_fee_usd: "=transfer_fee_usd", instructor_request_fee_usd: "=instructor_request_fee_usd"}
        Mountain Cubs Group Lesson: {no_show_fee_pct: "=no_show_fee_pct", no_show_assessment_lag_days: "=no_show_assessment_lag_days", late_arrival_grace_minutes: "=late_arrival_grace_minutes", late_cancellation_fee_pct: "=late_cancellation_fee_pct", reschedule_fee_usd: "=reschedule_fee_usd", transfer_fee_usd: "=transfer_fee_usd", instructor_request_fee_usd: "=instructor_request_fee_usd"}
        Six-Week Development Programme: {no_show_fee_pct: "=no_show_fee_pct", no_show_assessment_lag_days: "=no_show_assessment_lag_days", late_arrival_grace_minutes: "=late_arrival_grace_minutes", late_cancellation_fee_pct: "=late_cancellation_fee_pct", reschedule_fee_usd: "=reschedule_fee_usd", transfer_fee_usd: "=transfer_fee_usd", instructor_request_fee_usd: "=instructor_request_fee_usd"}
        Semi-Private Coaching Session: {no_show_fee_pct: "=no_show_fee_pct", no_show_assessment_lag_days: "=no_show_assessment_lag_days", late_arrival_grace_minutes: "=late_arrival_grace_minutes", late_cancellation_fee_pct: "=late_cancellation_fee_pct", reschedule_fee_usd: "=reschedule_fee_usd", transfer_fee_usd: "=transfer_fee_usd", instructor_request_fee_usd: "=instructor_request_fee_usd"}
