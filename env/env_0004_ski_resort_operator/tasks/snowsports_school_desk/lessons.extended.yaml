  - id: lessons_credit_use
    subject: [lessons_credit_redeem]
    rule: >
      School credit is spent against school charges on the household account and is not paid out. School
      credit is applied only when it is applied no later than its validity period counted in calendar days
      from the day the credit was issued. Calendar days are counted forward from the anchor date, the anchor
      date itself counting as day zero, every day of the week counting alike, and a calendar day is never
      mixed with a full 24-hour period; where the resulting boundary falls on a date that does not exist in
      the target month, the last day of that month is used. A single application must be at least the
      product's minimum, and credit may be applied to part of a charge, leaving the remainder to be paid.
      School credit is applied only while the booking record it sits on has not reached the cancelled,
      no_show or closed state. Credit issued on one booking may be applied to any school booking on the same
      household account, but never to another household, never to lift tickets, lodging or retail, and never
      to cash. Where several credit entries sit on one household account, the entry closest to running out is
      applied first.
    eligibility:
      - id: credit_within_validity
        applies_to: [lessons_credit_redeem]
        kind: time
        condition: "School credit is applied only when it is applied no later than its validity period counted in calendar days from the day the credit was issued."
        evidence_fields: [lessons_ledger.lesson_event_id, lessons_ledger.event_date, lessons_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lessons_ledger.lesson_event_id]
          action_bindings:
            lessons_ledger.lesson_event_id: related_event_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the credit was issued"
          anchor_source: lessons_ledger.event_date
          relation: not_after
          duration_source: variants.credit_validity_days
          unit: calendar_days
          counting_rule: "Calendar days are counted forward from the anchor date, the anchor date itself counting as day zero, every day of the week counting alike, and a calendar day is never mixed with a full 24-hour period; where the resulting boundary falls on a date that does not exist in the target month, the last day of that month is used."
          boundary: inclusive
      - id: credit_booking_state
        applies_to: [lessons_credit_redeem]
        kind: state
        condition: "School credit is applied only while the booking record it sits on has not reached the cancelled, no_show or closed state."
        evidence_fields: [lessons_holdings.lesson_id, lessons_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lessons_holdings.lesson_id]
          action_bindings:
            lessons_holdings.lesson_id: lesson_id
        state_contract:
          field: lessons_holdings.status
          allowed: [requested, waitlisted, confirmed, in_progress, completed]
    params:
      per_tier:
        All-Mountain Adult Group Lesson: {credit_validity_days: "=credit_validity_days", credit_minimum_redemption_usd: "=credit_minimum_redemption_usd"}
        Mountain Explorers Group Lesson: {credit_validity_days: "=credit_validity_days", credit_minimum_redemption_usd: "=credit_minimum_redemption_usd"}
        Mountain Cubs Group Lesson: {credit_validity_days: "=credit_validity_days", credit_minimum_redemption_usd: "=credit_minimum_redemption_usd"}
        Six-Week Development Programme: {credit_validity_days: "=credit_validity_days", credit_minimum_redemption_usd: "=credit_minimum_redemption_usd"}
        Semi-Private Coaching Session: {credit_validity_days: "=credit_validity_days", credit_minimum_redemption_usd: "=credit_minimum_redemption_usd"}
        Private Instruction Full Day: {credit_validity_days: "=credit_validity_days", credit_minimum_redemption_usd: "=credit_minimum_redemption_usd"}
        Elite Performance Camp: {credit_validity_days: "=credit_validity_days", credit_minimum_redemption_usd: "=credit_minimum_redemption_usd"}

  - id: lessons_payment_terms
    subject: [lessons_payment]
    rule: >
      A booking takes the product's deposit share of the tuition when it is recorded, and the rest falls due
      later. The balance is collected no later than the product's balance period counted in calendar days
      from the day the booking was recorded. Calendar days are counted forward from the anchor date, the
      anchor date itself counting as day zero, every day of the week counting alike, and a calendar day is
      never mixed with a full 24-hour period; where the resulting boundary falls on a date that does not
      exist in the target month, the last day of that month is used. A product whose deposit is the whole
      price has no balance to collect. Where the product offers scheduled instalments, the balance may be
      divided instead of collected at once, and the booking is still firm while the schedule runs. A balance
      that is not collected by its due date puts the place at risk: the place is released back to the
      waiting list, and where it is taken by another household the booking is given up on the late
      cancellation terms rather than held open.
    eligibility:
      - id: balance_due_period
        applies_to: [lessons_payment]
        kind: time
        condition: "The balance is collected no later than the product's balance period counted in calendar days from the day the booking was recorded."
        evidence_fields: [lessons_holdings.lesson_id, lessons_holdings.booked_date, lessons_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lessons_holdings.lesson_id]
          action_bindings:
            lessons_holdings.lesson_id: lesson_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the booking was recorded"
          anchor_source: lessons_holdings.booked_date
          relation: not_after
          duration_source: variants.balance_due_days
          unit: calendar_days
          counting_rule: "Calendar days are counted forward from the anchor date, the anchor date itself counting as day zero, every day of the week counting alike, and a calendar day is never mixed with a full 24-hour period; where the resulting boundary falls on a date that does not exist in the target month, the last day of that month is used."
          boundary: inclusive
    params:
      per_tier:
        All-Mountain Adult Group Lesson: {booking_deposit_pct: "=booking_deposit_pct", balance_due_days: "=balance_due_days", payment_plan_offered: "=payment_plan_offered", refund_processing_days: "=refund_processing_days"}
        Mountain Explorers Group Lesson: {booking_deposit_pct: "=booking_deposit_pct", balance_due_days: "=balance_due_days", payment_plan_offered: "=payment_plan_offered", refund_processing_days: "=refund_processing_days"}
        Mountain Cubs Group Lesson: {booking_deposit_pct: "=booking_deposit_pct", balance_due_days: "=balance_due_days", payment_plan_offered: "=payment_plan_offered", refund_processing_days: "=refund_processing_days"}
        Six-Week Development Programme: {booking_deposit_pct: "=booking_deposit_pct", balance_due_days: "=balance_due_days", payment_plan_offered: "=payment_plan_offered", refund_processing_days: "=refund_processing_days"}
        Semi-Private Coaching Session: {booking_deposit_pct: "=booking_deposit_pct", balance_due_days: "=balance_due_days", payment_plan_offered: "=payment_plan_offered", refund_processing_days: "=refund_processing_days"}
        Private Instruction Full Day: {booking_deposit_pct: "=booking_deposit_pct", balance_due_days: "=balance_due_days", payment_plan_offered: "=payment_plan_offered", refund_processing_days: "=refund_processing_days"}
        Elite Performance Camp: {booking_deposit_pct: "=booking_deposit_pct", balance_due_days: "=balance_due_days", payment_plan_offered: "=payment_plan_offered", refund_processing_days: "=refund_processing_days"}

  - id: lessons_completion
    subject: [lessons_complete, lessons_close]
    rule: >
      A booking is delivered when the block of sessions it holds has run out, and the date of the last
      session is written to the record. A delivered booking earns the participant a written progress card at
      the ability level they reached, which the school uses to place them the next time they book. A booking
      record is closed only when nothing is left to collect against it and no school credit issued on it is
      left to spend. Closing is the last write on the record and nothing is added to it afterwards; a
      household who wants more instruction opens a fresh booking rather than reopening this one. A booking
      that ends without every session being delivered is closed on the terms that applied when it ended, so
      a cancelled booking closes once its credit has been issued and a missed booking closes once its fee has
      been settled.
    eligibility:
      - id: nothing_outstanding_on_booking
        applies_to: [lessons_close]
        kind: authorization
        condition: "A booking record is closed only when nothing is left to collect against it and no school credit issued on it is left to spend."
        evidence_fields: [lessons_holdings.lesson_id, lessons_holdings.tuition_balance_usd, lessons_holdings.lesson_credit_usd]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lessons_holdings.lesson_id]
          action_bindings:
            lessons_holdings.lesson_id: lesson_id
    params:
      per_tier:
        All-Mountain Adult Group Lesson: {sessions_per_booking: "=sessions_per_booking", programme_weeks: "=programme_weeks", video_analysis_included: "=video_analysis_included"}
        Mountain Explorers Group Lesson: {sessions_per_booking: "=sessions_per_booking", programme_weeks: "=programme_weeks", video_analysis_included: "=video_analysis_included"}
        Mountain Cubs Group Lesson: {sessions_per_booking: "=sessions_per_booking", programme_weeks: "=programme_weeks", video_analysis_included: "=video_analysis_included"}
        Six-Week Development Programme: {sessions_per_booking: "=sessions_per_booking", programme_weeks: "=programme_weeks", video_analysis_included: "=video_analysis_included"}
        Semi-Private Coaching Session: {sessions_per_booking: "=sessions_per_booking", programme_weeks: "=programme_weeks", video_analysis_included: "=video_analysis_included"}
        Private Instruction Full Day: {sessions_per_booking: "=sessions_per_booking", programme_weeks: "=programme_weeks", video_analysis_included: "=video_analysis_included"}
        Elite Performance Camp: {sessions_per_booking: "=sessions_per_booking", programme_weeks: "=programme_weeks", video_analysis_included: "=video_analysis_included"}


# ===========================================================================
# extended_policies — the multi-factor calculation policies this difficulty
# layers on top of the base snowsports school charter.
# ===========================================================================
extended_policies:
  - id: lessons_ext_weather_session_credit
    base_policy_refs: [lessons_cancellation, lessons_session_delivery]
    overwrite:
      - base_policy: lessons_cancellation
        superseded_clause: >-
          Where the collective cancels the session for weather, mountain conditions or an instructor being
          unavailable, the product's weather basis decides what the household receives and no fee is retained.
        replaced_by: >-
          The amount made good is the value of one session taken at the standard weather share, and the figure is
          rounded to the nearest cent.
      - base_policy: lessons_session_delivery
        superseded_clause: >-
          Where a session is lost to weather or mountain conditions the collective makes good on the product's
          weather basis, and that session is not drawn from the block.
        replaced_by: >-
          The amount made good is the value of one session taken at the standard weather share, and the figure is
          rounded to the nearest cent.
    trigger: state_due
    subject: [lessons_credit_issue]
    computes: credit_amount_usd
    target_tool: issue_weather_session_credit_1ce20aea
    params:
      standard_weather_share: 50
      mid_block_share: 80
      late_block_share: 100
      single_addon_makegood: 45.00
      no_addon_makegood: 0.00
      skied_on_offset: 45.00
      idle_pass_offset: 15.00
      no_pass_offset: 0.00
    rule: >
      Where the collective cannot run a session because the mountain is shut, the lifts the session depends on
      are held, or conditions on the hill make the session unsafe, the school makes good the value of that
      session as school credit on the booking it was lost from. The value of one session is the product's block
      price divided by the number of sessions the product's block holds. The amount made good is the value of
      one session taken at the standard weather share, and the figure is rounded to the nearest cent. One credit
      entry is issued for each session the collective could not run.
      The share of the session value that is made good turns on how much of the block the school had already
      taught when the session was lost, counted as the delivery entries standing on the booking's school
      account: where three or more of the block's sessions had already been delivered the late block share is
      made good; where one or two of them had been delivered the mid block share is made good; and where none of
      them had been delivered the standard weather share is made good.
      A product that carries a makeup allowance works the amount out differently, because a date the participant
      may still take answers for part of what was lost. The makeup period is counted in calendar days from the
      day the request raised over the lost session was registered, the day of registration counting as day zero,
      every day of the week counting alike; where no request raised over a lost session stands against the
      booking, the handling date is taken to fall outside that makeup period. Where the product allows a makeup
      session and the handling date
      falls inside that makeup period, the amount made good is the session value taken at the share above and
      then halved. Where the product allows a makeup session and the handling date falls outside that makeup
      period, the amount made good is the whole session value and the share is not applied to it at all. Where
      the product allows no makeup session, the amount made good is the session value taken at the share above.
      The school also makes good the equipment and extras it had laid on for the participant, by the number of
      add-on entries standing against the booking: where two or more add-on entries stand against the booking
      the product's rental add-on price is added; where exactly one add-on entry stands against it the single
      add-on make-good is added; and where no add-on entry stands against it nothing is added.
      Where the collective's own lift records show the household was on the mountain in any case, the day was
      not wholly lost to them and what is made good is reduced. Where the household holds a season pass standing
      in the active state and that pass account shows three or more lift scans in the month running to the
      handling date, the skied on offset is taken off; where the household holds a season pass standing in the
      active state and that pass account shows fewer than three lift scans in the month running to the handling
      date, the idle pass offset is taken off; where the household holds no season pass standing in the active
      state, no offset is taken off.
      The add-on make-good is added to the amount made good and the pass offset is then taken off that combined
      figure; the credit issued is that result rounded to the nearest cent, and where the offset exceeds the
      combined figure no credit is issued at all.
    prerequisite: []
    cross_category:
      - category: passes
        as: history
        reads: [status, passes_ledger.event_type]
        note: >-
          The pass offset factor decides its tier from the household's season pass record and the lift scans
          standing on that pass account in the month running to the handling date.
    compute:
      - session_value: "P('block_price_usd') / P('sessions_per_booking')"
      - delivered_before_loss: "COUNT('lessons_ledger', event_type='lessons_session_deliver')"
      - weather_share: "K('late_block_share') if delivered_before_loss >= 3 else (K('mid_block_share') if delivered_before_loss >= 1 else K('standard_weather_share'))"
      - storm_notice_date: "LATEST('lessons_requests','created_at', date_field='created_at', stated_reason='mountain_conditions')"
      - days_since_loss: "DAYS(storm_notice_date, NOW) if storm_notice_date else P('makeup_booking_days') + 1"
      - made_good: "(session_value * weather_share / 100) / 2 if (P('makeup_sessions_allowed') >= 1 and days_since_loss <= P('makeup_booking_days')) else (session_value if (P('makeup_sessions_allowed') >= 1 and days_since_loss > P('makeup_booking_days')) else session_value * weather_share / 100)"
      - addon_entries: "COUNT('lessons_ledger', event_type='lessons_equipment_addon')"
      - addon_makegood: "P('rental_addon_usd') if addon_entries >= 2 else (K('single_addon_makegood') if addon_entries == 1 else K('no_addon_makegood'))"
      - active_pass: "EXISTS('passes', status='active')"
      - pass_scans_recent: "XCOUNT('passes','passes_ledger', event_type='passes_scan', within_months=1)"
      - pass_offset: "K('skied_on_offset') if (active_pass and pass_scans_recent >= 3) else (K('idle_pass_offset') if (active_pass and pass_scans_recent < 3) else K('no_pass_offset'))"
      - result: "RND(MX(made_good + addon_makegood - pass_offset, 0), 2)"
    compute_basis:
      session_value: "The value of one session is the product's block price divided by the number of sessions the product's block holds."
      delivered_before_loss: "The share of the session value that is made good turns on how much of the block the school had already taught when the session was lost, counted as the delivery entries standing on the booking's school account"
      weather_share: "where three or more of the block's sessions had already been delivered the late block share is made good; where one or two of them had been delivered the mid block share is made good; and where none of them had been delivered the standard weather share is made good."
      storm_notice_date: "The makeup period is counted in calendar days from the day the request raised over the lost session was registered, the day of registration counting as day zero, every day of the week counting alike; where no request raised over a lost session stands against the booking, the handling date is taken to fall outside that makeup period."
      days_since_loss: "The makeup period is counted in calendar days from the day the request raised over the lost session was registered, the day of registration counting as day zero, every day of the week counting alike; where no request raised over a lost session stands against the booking, the handling date is taken to fall outside that makeup period."
      made_good: "Where the product allows a makeup session and the handling date falls inside that makeup period, the amount made good is the session value taken at the share above and then halved. Where the product allows a makeup session and the handling date falls outside that makeup period, the amount made good is the whole session value and the share is not applied to it at all. Where the product allows no makeup session, the amount made good is the session value taken at the share above."
      addon_entries: "The school also makes good the equipment and extras it had laid on for the participant, by the number of add-on entries standing against the booking"
      addon_makegood: "where two or more add-on entries stand against the booking the product's rental add-on price is added; where exactly one add-on entry stands against it the single add-on make-good is added; and where no add-on entry stands against it nothing is added."
      active_pass: "Where the collective's own lift records show the household was on the mountain in any case, the day was not wholly lost to them and what is made good is reduced."
      pass_scans_recent: "Where the collective's own lift records show the household was on the mountain in any case, the day was not wholly lost to them and what is made good is reduced."
      pass_offset: "Where the household holds a season pass standing in the active state and that pass account shows three or more lift scans in the month running to the handling date, the skied on offset is taken off; where the household holds a season pass standing in the active state and that pass account shows fewer than three lift scans in the month running to the handling date, the idle pass offset is taken off; where the household holds no season pass standing in the active state, no offset is taken off."
      result: "The add-on make-good is added to the amount made good and the pass offset is then taken off that combined figure; the credit issued is that result rounded to the nearest cent, and where the offset exceeds the combined figure no credit is issued at all."
    factors:
      - id: block_progress_share
        effect: parameter
        decides: weather_share
        bindings: [delivered_before_loss, weather_share]
        ladder:
          - when: "three or more of the block's sessions had already been delivered when the session was lost"
            value: "K('late_block_share')"
          - when: "one or two of the block's sessions had already been delivered when the session was lost"
            value: "K('mid_block_share')"
          - when: "otherwise"
            value: "K('standard_weather_share')"
        baseline:
          weather_share: "K('standard_weather_share')"
        evidence: [history]
        cross_difficulty: null
      - id: makeup_answer_method
        effect: method
        decides: made_good
        bindings: [storm_notice_date, days_since_loss, made_good]
        ladder:
          - when: "the product allows a makeup session and the handling date falls inside the product's makeup period counted from the day the request over the lost session was registered"
            method: "the amount made good is the session value taken at the weather share and then halved, the balance being answered by the makeup date still open to the participant"
          - when: "the product allows a makeup session and the handling date falls outside that makeup period"
            method: "the amount made good is the whole session value, the weather share not being applied to it at all"
          - when: "otherwise"
            method: "the amount made good is the session value taken at the weather share"
        baseline:
          made_good: "session_value * weather_share / 100"
        evidence: [date, history]
        cross_difficulty: null
      - id: laid_on_extras_makegood
        effect: parameter
        decides: addon_makegood
        bindings: [addon_entries, addon_makegood]
        ladder:
          - when: "two or more add-on entries stand against the booking"
            value: "P('rental_addon_usd')"
          - when: "exactly one add-on entry stands against the booking"
            value: "K('single_addon_makegood')"
          - when: "otherwise"
            value: "K('no_addon_makegood')"
        baseline:
          addon_makegood: "K('no_addon_makegood')"
        evidence: [history]
        cross_difficulty: null
      - id: pass_day_offset
        effect: parameter
        decides: pass_offset
        bindings: [active_pass, pass_scans_recent, pass_offset]
        ladder:
          - when: "the household holds a season pass standing in the active state and that pass account shows three or more lift scans in the month running to the handling date"
            value: "K('skied_on_offset')"
          - when: "the household holds a season pass standing in the active state and that pass account shows fewer than three lift scans in the month running to the handling date"
            value: "K('idle_pass_offset')"
          - when: "otherwise"
            value: "K('no_pass_offset')"
        baseline:
          pass_offset: "K('no_pass_offset')"
        evidence: [cross_category, history]
        cross_difficulty: passes
    baseline:
      rule: >-
        Where the collective cannot run a session because the mountain is shut, the lifts the session depends on
        are held, or conditions on the hill make the session unsafe, the school makes good the value of that
        session as school credit on the booking it was lost from. The value of one session is the product's block
        price divided by the number of sessions the product's block holds. The amount made good is the value of
        one session taken at the standard weather share, and the figure is rounded to the nearest cent. One credit
        entry is issued for each session the collective could not run.
      params: [standard_weather_share, block_price_usd, sessions_per_booking, no_addon_makegood, no_pass_offset]
    inputs:
      history:
        - {table: lessons_ledger, aggregate: count, field: lesson_event_id, within_months: null, filters: {event_type: lessons_session_deliver}}
        - {table: lessons_ledger, aggregate: count, field: lesson_event_id, within_months: null, filters: {event_type: lessons_equipment_addon}}
        - {table: lessons_requests, aggregate: latest, field: created_at, within_months: null, filters: {stated_reason: mountain_conditions}}
        - {category: passes, table: passes_ledger, aggregate: count, field: pass_event_id, within_months: 1, filters: {event_type: passes_scan}}
      cross_category: [passes]

  - id: lessons_ext_balance_settlement
    base_policy_refs: [lessons_payment_terms, lessons_credit_use]
    overwrite:
      - base_policy: lessons_credit_use
        superseded_clause: >-
          School credit is applied only when it is applied no later than its validity period counted in calendar
          days from the day the credit was issued.
        replaced_by: >-
          Credit issued longer ago than the product's credit validity period, counted in whole months of thirty
          days from the day of issue, has run out and no longer counts toward the credit standing
    trigger: on_request
    subject: [lessons_payment]
    computes: payment_amount_usd
    target_tool: settle_school_balance_78bdef11
    params:
      no_credit_set_against: 0.00
      first_instalment_share: 50
      final_instalment_share: 80
      whole_share: 100
      settled_account_points: 5
      part_settled_points: 2
      no_points: 0
      early_settlement_reduction: 60.00
      prompt_settlement_reduction: 25.00
      no_reduction: 0.00
    rule: >
      When a household settles what it owes the school on one of its bookings, the figure collected is worked
      out from the entries standing on that booking's school account rather than from the figure printed on any
      earlier confirmation. The figure owed is the tuition raised against the booking, plus the add-ons raised
      against it, plus the school fees raised against it, less the payments already collected on it. The amount
      collected is that figure owed, and the result is rounded to the nearest cent. The amount collected is
      settled only after the school account carries the credit entry owed for every session the collective could
      not run.
      School credit standing on the booking, being the credit issued on it less the credit already applied from
      it, is set against the figure owed and money is taken only for what is left. Credit issued longer ago than
      the product's credit validity period, counted in whole months of thirty days from the day of issue, has
      run out and no longer counts toward the credit standing, and where several credit entries stand they are
      counted together, the entry closest to running out being the first spent. Where the credit standing is
      at or above the product's minimum redemption and falls short of the figure owed, the whole of the credit
      standing is set against the figure owed and the remainder is collected. Where the credit standing is at or
      above the product's minimum redemption and is at or above the figure owed, only as much of the credit as
      the figure owed is set against it and nothing further is collected. Where the credit standing falls below
      the product's minimum redemption, no credit is set against the figure owed and the whole of it is
      collected.
      A product offered with scheduled instalments does not ask the household for the whole of what remains in
      one go, and the sessions still to come are counted as the sessions the block holds less the delivery
      entries standing on the account. Where the product is offered with scheduled instalments and the booking
      still holds three or more sessions to come, the first instalment share of what remains is collected. Where
      the product is offered with scheduled instalments and the booking holds one or two sessions to come, the
      final instalment share of what remains is collected. Where the product is not offered with scheduled
      instalments, or the booking holds no session still to come, the whole share of what remains is collected.
      A household that has already settled a good part of its tuition is allowed a reduction in percentage points
      on the figure collected, judged as the payments collected on the booking measured against the tuition
      raised on it, and where no tuition has been raised on the booking there is nothing for the payments to be
      measured against and no points are allowed on that count. Where the payments cover half or more of the
      tuition raised the settled account points are allowed; where they cover at least a quarter of it but less
      than half the part settled points are allowed; and where they cover less than a quarter no points are
      allowed.
      A household settling ahead of the day the balance falls due is allowed a further reduction in money. The
      balance falls due the product's balance period in calendar days from the day the booking was recorded, the
      day of recording counting as day zero, every day of the week counting alike. Where the handling date falls
      fourteen or more days short of that day the early settlement reduction is allowed; where the handling date
      falls between one and thirteen days short of it the prompt settlement reduction is allowed; and where the
      balance falls due on the handling date or has already fallen due, no reduction in money is allowed.
      The points reduction acts on the figure left once the instalment share has been taken, the reduction in
      money is then taken off that result, and the amount collected is what remains rounded to the nearest cent;
      where the reductions come to more than the figure, nothing is collected.
    prerequisite:
      - problem: lessons_ext_weather_session_credit
        kind: value_input
        gate: credit_standing
        form: state
        policy_source: >-
          The amount collected is settled only after the school account carries the credit entry owed for every
          session the collective could not run.
        condition: >-
          The booking's school account carries a credit entry noted as answering for a session lost to the
          mountain for every session the collective could not run on that booking.
        resolved_by: issue_weather_session_credit_1ce20aea
        effect: >-
          The credit standing binding rises by the amount of the credit entry, so the credit set against the
          figure owed and therefore the amount collected both change.
    cross_category: []
    compute:
      - tuition_raised: "SUM('lessons_ledger','amount_usd', event_type='lessons_tuition_charge')"
      - addons_raised: "SUM('lessons_ledger','amount_usd', event_type='lessons_equipment_addon')"
      - fees_raised: "SUM('lessons_ledger','amount_usd', event_type='lessons_fee_charge')"
      - payments_collected: "SUM('lessons_ledger','amount_usd', event_type='lessons_payment')"
      - figure_owed: "tuition_raised + addons_raised + fees_raised - payments_collected"
      - credit_issued: "SUM('lessons_ledger','amount_usd', within_months=P('credit_validity_days') / 30, event_type='lessons_credit_issue')"
      - credit_applied: "SUM('lessons_ledger','amount_usd', event_type='lessons_credit_redeem')"
      - credit_standing: "credit_issued - credit_applied"
      - credit_set_against: "credit_standing if (credit_standing >= P('credit_minimum_redemption_usd') and credit_standing < figure_owed) else (figure_owed if (credit_standing >= P('credit_minimum_redemption_usd') and credit_standing >= figure_owed) else K('no_credit_set_against'))"
      - after_credit: "MX(figure_owed - credit_set_against, 0)"
      - sessions_to_come: "F('sessions_booked') - COUNT('lessons_ledger', event_type='lessons_session_deliver')"
      - instalment_share: "K('first_instalment_share') if (P('payment_plan_offered') and sessions_to_come >= 3) else (K('final_instalment_share') if (P('payment_plan_offered') and sessions_to_come >= 1) else K('whole_share'))"
      - instalment_due: "after_credit * instalment_share / 100"
      - settled_ratio: "SUM('lessons_ledger','amount_usd', event_type='lessons_payment') / SUM('lessons_ledger','amount_usd', event_type='lessons_tuition_charge') if SUM('lessons_ledger','amount_usd', event_type='lessons_tuition_charge') > 0 else 0"
      - standing_points: "K('settled_account_points') if settled_ratio >= 0.5 else (K('part_settled_points') if settled_ratio >= 0.25 else K('no_points'))"
      - days_since_booked: "DAYS(F('booked_date'), NOW)"
      - prompt_reduction: "K('early_settlement_reduction') if days_since_booked <= P('balance_due_days') - 14 else (K('prompt_settlement_reduction') if days_since_booked < P('balance_due_days') else K('no_reduction'))"
      - result: "RND(MX(instalment_due - instalment_due * standing_points / 100 - prompt_reduction, 0), 2)"
    compute_basis:
      tuition_raised: "The figure owed is the tuition raised against the booking, plus the add-ons raised against it, plus the school fees raised against it, less the payments already collected on it."
      addons_raised: "The figure owed is the tuition raised against the booking, plus the add-ons raised against it, plus the school fees raised against it, less the payments already collected on it."
      fees_raised: "The figure owed is the tuition raised against the booking, plus the add-ons raised against it, plus the school fees raised against it, less the payments already collected on it."
      payments_collected: "The figure owed is the tuition raised against the booking, plus the add-ons raised against it, plus the school fees raised against it, less the payments already collected on it."
      credit_issued: "Credit issued longer ago than the product's credit validity period, counted in whole months of thirty days from the day of issue, has run out and no longer counts toward the credit standing, and where several credit entries stand they are counted together, the entry closest to running out being the first spent."
      credit_applied: "School credit standing on the booking, being the credit issued on it less the credit already applied from it, is set against the figure owed and money is taken only for what is left."
      credit_standing: "The amount collected is settled only after the school account carries the credit entry owed for every session the collective could not run."
      credit_set_against: "Where the credit standing is at or above the product's minimum redemption and falls short of the figure owed, the whole of the credit standing is set against the figure owed and the remainder is collected. Where the credit standing is at or above the product's minimum redemption and is at or above the figure owed, only as much of the credit as the figure owed is set against it and nothing further is collected. Where the credit standing falls below the product's minimum redemption, no credit is set against the figure owed and the whole of it is collected."
      sessions_to_come: "the sessions still to come are counted as the sessions the block holds less the delivery entries standing on the account"
      instalment_share: "Where the product is offered with scheduled instalments and the booking still holds three or more sessions to come, the first instalment share of what remains is collected. Where the product is offered with scheduled instalments and the booking holds one or two sessions to come, the final instalment share of what remains is collected. Where the product is not offered with scheduled instalments, or the booking holds no session still to come, the whole share of what remains is collected."
      settled_ratio: "A household that has already settled a good part of its tuition is allowed a reduction in percentage points on the figure collected, judged as the payments collected on the booking measured against the tuition raised on it, and where no tuition has been raised on the booking there is nothing for the payments to be measured against and no points are allowed on that count."
      standing_points: "Where the payments cover half or more of the tuition raised the settled account points are allowed; where they cover at least a quarter of it but less than half the part settled points are allowed; and where they cover less than a quarter no points are allowed."
      days_since_booked: "The balance falls due the product's balance period in calendar days from the day the booking was recorded, the day of recording counting as day zero, every day of the week counting alike."
      prompt_reduction: "Where the handling date falls fourteen or more days short of that day the early settlement reduction is allowed; where the handling date falls between one and thirteen days short of it the prompt settlement reduction is allowed; and where the balance falls due on the handling date or has already fallen due, no reduction in money is allowed."
      figure_owed: "The figure owed is the tuition raised against the booking, plus the add-ons raised against it, plus the school fees raised against it, less the payments already collected on it."
      instalment_due: "Where the product is offered with scheduled instalments and the booking still holds three or more sessions to come, the first instalment share of what remains is collected."
      after_credit: "School credit standing on the booking, being the credit issued on it less the credit already applied from it, is set against the figure owed and money is taken only for what is left."
      result: "The points reduction acts on the figure left once the instalment share has been taken, the reduction in money is then taken off that result, and the amount collected is what remains rounded to the nearest cent; where the reductions come to more than the figure, nothing is collected."
    factors:
      - id: credit_offset_method
        effect: method
        decides: credit_set_against
        bindings: [credit_issued, credit_applied, credit_standing, credit_set_against]
        ladder:
          - when: "the school credit standing on the booking is at or above the product's minimum redemption and falls short of the figure owed"
            method: "the whole of the credit standing is set against the figure owed and only the remainder is collected"
          - when: "the school credit standing on the booking is at or above the product's minimum redemption and is at or above the figure owed"
            method: "only as much of the credit as the figure owed is set against it and nothing further is collected"
          - when: "otherwise"
            method: "no credit is set against the figure owed and the whole of it is collected"
        baseline:
          credit_set_against: "K('no_credit_set_against')"
        evidence: [history]
        cross_difficulty: null
      - id: instalment_split
        effect: parameter
        decides: instalment_share
        bindings: [sessions_to_come, instalment_share]
        ladder:
          - when: "the product is offered with scheduled instalments and the booking still holds three or more sessions to come"
            value: "K('first_instalment_share')"
          - when: "the product is offered with scheduled instalments and the booking holds one or two sessions to come"
            value: "K('final_instalment_share')"
          - when: "otherwise"
            value: "K('whole_share')"
        baseline:
          instalment_share: "K('whole_share')"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: settled_account_standing
        effect: parameter
        decides: standing_points
        bindings: [settled_ratio, standing_points]
        ladder:
          - when: "the payments collected on the booking cover half or more of the tuition raised on it"
            value: "K('settled_account_points')"
          - when: "the payments collected on the booking cover at least a quarter of the tuition raised on it but less than half"
            value: "K('part_settled_points')"
          - when: "otherwise"
            value: "K('no_points')"
        baseline:
          standing_points: "K('no_points')"
        evidence: [history]
        cross_difficulty: null
      - id: early_settlement
        effect: parameter
        decides: prompt_reduction
        bindings: [days_since_booked, prompt_reduction]
        ladder:
          - when: "the handling date falls fourteen or more days short of the day the balance falls due"
            value: "K('early_settlement_reduction')"
          - when: "the handling date falls between one and thirteen days short of the day the balance falls due"
            value: "K('prompt_settlement_reduction')"
          - when: "otherwise"
            value: "K('no_reduction')"
        baseline:
          prompt_reduction: "K('no_reduction')"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        When a household settles what it owes the school on one of its bookings, the figure collected is worked
        out from the entries standing on that booking's school account rather than from the figure printed on any
        earlier confirmation. The figure owed is the tuition raised against the booking, plus the add-ons raised
        against it, plus the school fees raised against it, less the payments already collected on it. The amount
