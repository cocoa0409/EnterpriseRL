name: consumer_electronics_retailer
company: Northbeam Electronics

background: |
  Northbeam Electronics is a national consumer electronics retailer running two hundred and fourteen stores, a web
  and mobile storefront, and a business sales desk that supplies offices, schools, clinics and building trades.
  It sells televisions and home theatre, computing and mobile, cameras and drones, gaming and major appliances, and
  alongside the boxes it sells the services that surround them: delivery, installation, repair, protection,
  trade-in and store financing. Customer care takes household callers and business buyers on the same desk, and the
  house style is plain, patient and unhurried, with the record read out to the customer rather than summarised at
  them. Seven product lines are held as running contracts on a customer profile, and each of them keeps producing
  records of what the customer has actually done. Northbeam Circle Membership ladders from Circle Free Membership
  through Circle Plus Annual, Circle Total Annual and Circle Total Household Annual up to Circle Business Pro and
  Circle Business Elite, held on a customer profile and booking dues, reward points and benefit credits as the year
  goes on.
  Northbeam ShieldCare Protection Plans each cover one identified item, from ShieldCare Essential Parts and Labour
  and ShieldCare Accidental Damage Plus through ShieldCare Total Device Protection, ShieldCare Home Theatre Premium
  and ShieldCare Major Appliance Extended Service to ShieldCare Business Fleet Protection, booking premiums,
  claims, payouts and deductibles against the item. Northbeam Returns and Restocking handles every return on one of
  its schedules, Standard Fifteen Day Return, Member Extended Thirty Day Return, Major Appliance Forty Eight Hour
  Return, Activated Wireless Device Return, Open Box and Clearance Final Sale and Business Contract Return
  Schedule, each authorisation booking the receipt of the goods, the inspection grade, the fees and the refund.
  Northbeam Renew Trade-In writes agreements under Renew Instant Store Quote, Renew Mail In Appraisal, Renew Trade
  Up Guarantee Twelve Month, Renew Trade Up Guarantee Twenty Four Month, Renew Business Asset Buyback and Renew
  Bulk IT Refresh Agreement, booking the quote, the appraisal, the credit issued and how that credit is later
  spent. Northbeam TechWorks Installation and Repair works to TechWorks In Store Bench Service, TechWorks Standard
  Home Installation, TechWorks Home Theatre Calibration, TechWorks Appliance Install and Haul Away, TechWorks
  Business On Site Deployment and TechWorks Managed IT Care Annual, booking appointments, labour, parts and the
  fees that attendance produces. Store credit and financing sit on Northbeam Store Card, Northbeam Store Card Plus,
  Northbeam Signature Rewards Card, Northbeam Deferred Interest Promotion Account, Northbeam Business Net Thirty
  Account and Northbeam Business Fleet Line of Credit, booking draws, payments, interest, fees and store credit
  postings. Purchases themselves are fulfilled as Standard Parcel Delivery, Store Pickup Hold, Threshold Delivery,
  Room of Choice Delivery with Haul Away, White Glove Delivery and Installation or Business Dock and Freight
  Delivery, each order booking its merchandise lines, its fees, the money taken and every delivery attempt made.
  A household profile carries the customer's name, a mobile number, an email address, the last four digits of the
  card kept on file, the postal code of the service address and the day the profile was first opened; a business
  profile carries its registered name as well and, where one has been filed, a tax exemption certificate. The
  callers are mostly households a few weeks or a few years into owning something large: a cracked tablet, a
  refrigerator that stopped cooling, a television delivered to the wrong room, a trade-in quote that came back
  lower than the screen said. Business buyers call about fleet refreshes, dock deliveries, invoice credits, asset
  buybacks and deployments that have to happen before a term starts. Most profiles carry several of these lines at
  once, so a single call routinely touches a membership, a protection plan, an order and a store credit balance
  belonging to the same person. Event histories run long: years of points and dues on a membership, several claims
  on one plan, a string of returns and exchanges around one household, and dozens of invoice lines on a business
  account.

logs:
  verification_log_table: identity_verifications
  handoff_log_table: human_handoffs

difficulties:
  - name: membership_benefits_desk
    claim:
      categories: [membership]
      event_types: [membership_benefit_grant, membership_benefit_redeem, membership_points_accrue,
                    membership_points_redeem, membership_points_expire, membership_tier_change,
                    membership_dues_charge, membership_dues_payment, membership_cancel]
    summary: >
      Callers on this desk are Circle members asking what their membership is actually worth right now: why an
      anniversary reward has not appeared, whether an installation credit can be put against a bill they are
      holding, how many reward points they have and what those points are worth, whether the tier they pay for can
      be changed today, and what they get back if they stop paying. The setting varies across the whole ladder from
      Circle Free Membership to Circle Business Elite, across memberships standing active, in grace after unpaid
      dues, lapsed after grace ran out, or cancelled last month, and across event histories that may hold years of
      accrual, a sweep that already forfeited points, benefit credits granted for one membership year and spent
      against another, and dues part paid across two billing periods. The records in play are the membership
      holding with its tier, status, term dates and three running quantities, the membership event ledger of dues,
      points and benefit rows, the change request record through which a customer confirms a cancellation or a
      downgrade, and, read across from other lines, the protection plans, service agreements, orders and store
      credit accounts the same profile holds; the governing rules are membership_enrollment_admission and
      membership_excl_consumer_business for who may hold what, membership_dues_billing and
      membership_dues_delinquency for what is owed and what grace and reinstatement allow,
      membership_points_accrual, membership_points_redemption and membership_points_expiry for the points
      arithmetic, membership_benefit_grant_cycle and membership_benefit_redemption for what is granted and how it
      may be spent, membership_tier_migration for moving up or down, membership_cancellation_refund for what comes
      back, membership_combo_protection_interaction for what holding a plan changes, and
      membership_agg_multi_holding for the single-enrolment charter, each carrying its own per-tier figures rather
      than a single house rate. Reading the membership, checking the ledger, granting or spending a benefit credit,
      billing or applying dues, moving the tier and booking the points movement are agent service actions on a
      verified profile, while anything that disposes of the customer's own position — confirming a cancellation,
      agreeing to a downgrade that takes effect at the end of the term, switching automatic renewal off — is the
      customer's own act, taken through a handover rather than performed for them. Genuinely possible requests that
      no policy here can decide include converting reward points or benefit credit into cash, moving points to a
      profile on a tier that does not permit transfer, reinstating a membership past its reinstatement window or
      beyond the reinstatements its tier allows, restoring points a sweep has already taken, granting a benefit
      credit for a membership year in which the membership stood lapsed, and back-dating a tier change so that a
      purchase already made earns at the higher rate; on those the only correct route is a POLICY_NOT_COVERED
      handoff to a human representative.

  - name: protection_claims_desk
    claim:
      categories: [protection]
      event_types: [protection_claim_file, protection_claim_decision, protection_claim_payout,
                    protection_deductible_charge, protection_deductible_payment, protection_claim_hold_start,
                    protection_claim_hold_release, protection_premium_charge, protection_premium_payment,
                    protection_premium_refund, protection_plan_cancel]
    summary: >
      Callers on this desk have something broken and a ShieldCare plan they believe covers it: a tablet dropped on
      a tiled floor, a television panel that failed after a storm, a refrigerator that spoiled a freezer full of
      food, a handset stolen from a car, a laptop already repaired twice for the same fault, a fleet machine a
      business needs back before Monday. The setting varies across all six plans from ShieldCare Essential Parts
      and Labour to ShieldCare Business Fleet Protection, across plans standing in application_received, active,
      claim_hold while an earlier claim is reviewed, expired, cancelled or void, across customers holding one plan
      or a dozen, and across histories carrying payouts that have already eaten into the term limit, unpaid
      instalments, deductibles billed and never settled, and claims reported weeks after the incident. The records
      in play are the plan with its covered item, serial, coverage window and three running quantities, the
      protection event ledger of coverage grants, premiums, claims, decisions, payouts and deductibles, the claim
      intake record that carries the customer's signed statement and which documents have arrived, and the
      membership, service and order records of the same profile read across for context; the governing rules are
      protection_plan_admission for what may be covered at all, protection_premium_billing and
      protection_premium_delinquency for what is owed and when non-payment ends the plan,
      protection_coverage_ledger for how the coverage pool is credited and reinstated, protection_claim_intake for
      the report window and the state a plan must be in, protection_claim_adjudication for which perils each plan
      carries and what proof it needs, protection_claim_settlement for the per-claim limit, the deductible and the
      depreciation ladder, protection_agg_payout_cap for the rolling twelve-month cap read across every plan the
      customer holds, protection_claim_review_hold for how long a review may run,
      protection_excl_duplicate_coverage for the manufacturer's warranty and other cover,
      protection_combo_membership_interaction for what a membership changes, protection_plan_expiry,
      protection_plan_transfer_rules and protection_cancellation_refund for the end of a plan, and
      protection_agg_multi_holding for one plan per serial, each with its own per-plan figures. Opening the claim,
      recording the adjudication once the required documents are on file, booking the payout and the deductible,
      putting a plan under review and releasing it, and billing or refunding premium are agent service actions on a
      verified profile, while signing the statement of loss and confirming the cancellation of a plan the customer
      pays for are the customer's own acts, taken through a handover. Genuinely possible requests that no policy
      here can decide include paying a claim on a peril the plan does not carry however sympathetic the case,
      accepting a claim reported after the report window has run, paying above the per-claim limit or beyond the
      coverage remaining, waiving a deductible on a plan that does not waive it, transferring a plan the plan
      forbids transferring or one already terminated for non-payment, covering a device the plan was never eligible
      for, and paying twice for one loss already met by a household insurer; on those the only correct route is a
      POLICY_NOT_COVERED handoff to a human representative.

  - name: returns_and_restocking_desk
    claim:
      categories: [returns]
      event_types: [returns_rma_open, returns_rma_authorize, returns_rma_deny, returns_rma_withdraw,
                    returns_item_receive, returns_inspection_complete, returns_inspection_grade_record,
                    returns_restocking_fee_charge, returns_restocking_fee_waive, returns_refund_authorize,
                    returns_refund_disburse, returns_refund_offset, returns_rma_settle, returns_exchange_issue,
                    returns_shipping_label_issue]
    summary: >
      Callers on this desk want something to go back: a soundbar that did not fit the cabinet, a refrigerator
      delivered two days ago that is too wide for the alcove, a handset already activated on a network, an open box
      clearance monitor bought at a discount, a business over-order of forty monitors, a machine that arrived with
      a cracked panel in the carton. The setting varies across all six schedules from Standard Fifteen Day Return
      to Business Contract Return Schedule, across authorisations standing requested, authorized, in transit,
      received, inspected, settled, denied or withdrawn, across items graded anywhere from sealed to beyond
      economic repair, and across profiles whose rolling-year return history sits comfortably inside or well beyond
      what the schedule tolerates. The records in play are the return authorisation with its order line, item
      details, delivery day, grade and two running quantities, the returns event ledger of grades, fees, refund
      components and labels, the collection request through which the customer confirms a pickup slot, and the
      membership, protection, order and store credit records of the same profile read across for the window
      extension, the plan on the item and the method the money went out by; the governing rules are
      returns_window_eligibility for whether the return may be raised at all,
      returns_authorization_and_logistics for how the item comes back and who pays, returns_condition_grading for
      what the inspection decides, returns_restocking_fee for the percentage, floor and cap and the grounds for a
      waiver, returns_refund_settlement for the grade ladder, which components are refunded and how the money goes
      back, returns_exchange_handling and returns_excl_refund_or_exchange for the single settlement form,
      returns_withdrawal for calling a return off, returns_denial_and_appeal for refusals,
      returns_combo_membership_protection for what a membership or a plan changes, returns_agg_history_review for
      the rolling-year count and value read across the profile, and returns_agg_multi_holding for one live
      authorisation per order line, each carrying its own per-schedule figures. Raising and authorising the
      return, issuing the label, booking the item in, recording the inspection, charging or waiving the restocking
      fee, authorising the refund components, offsetting what is owed and settling the authorisation are agent
      service actions on a verified profile, while handing the goods to a carrier, confirming a collection slot and
      withdrawing a return already authorised are the customer's own acts, taken through a handover. Genuinely
      possible requests that no policy here can decide include returning a final sale line that arrived in perfect
      order, accepting a return after the window and its grace hours have run, refunding to a method the schedule
      does not allow when the original method is still creditable, refunding an installation charge on a schedule
      that never refunds it, exchanging an item graded as damaged by the customer, taking back an item whose serial
      does not match what was sold, and paying a refund on goods the retailer never sold; on those the only correct
      route is a POLICY_NOT_COVERED handoff to a human representative.

  - name: trade_in_appraisal_desk
    claim:
      categories: [tradein]
      event_types: [tradein_quote_create, tradein_quote_accept, tradein_quote_expire, tradein_device_receive,
                    tradein_appraisal_record, tradein_quote_revise, tradein_offer_decline, tradein_device_return,
                    tradein_agreement_credit, tradein_credit_issue, tradein_promo_boost_issue,
                    tradein_credit_redeem, tradein_credit_expire, tradein_handling_fee_charge,
                    tradein_handling_fee_waive, tradein_data_wipe_certify]
    summary: >
      Callers on this desk are trading a device in and arguing about what it is worth: a handset quoted at one
      figure online and appraised lower on arrival, a tablet bought two years ago under a trade-up guarantee, a
      console that will not power on, a laptop still locked to a work account, a business pallet of forty machines
      due for refresh, a credit issued months ago that has quietly expired. The setting varies across all six
      programmes from Renew Instant Store Quote to Renew Bulk IT Refresh Agreement, across agreements standing
      quoted, accepted, device received, appraised, credited, declined, expired or returned to the customer, across
      devices whose appraised condition matches or contradicts what was declared, and across profiles already at or
      near the yearly device count and credit value their programme allows. The records in play are the trade-in
      agreement with its device details, declared and appraised condition, quoted and appraised amounts, guarantee
      floor and two running quantities, the trade-in event ledger of revisions, credits, uplifts, redemptions,
      expiries, fees and erasure certificates, the shipping request that carries the customer's consent to hand the
      device over and to have its data destroyed, and the membership, order and store credit records read across
      for the member bonus, the linked purchase and where the credit went; the governing rules are
      tradein_quote_issue for what may be quoted and for how long, tradein_quote_acceptance for consent, identity
      and the linked purchase, tradein_device_logistics for how the device travels and what the handling and
      freight fees are, tradein_appraisal_grading for the condition ladder, the deductions and the tolerance before
      a revision is needed, tradein_revision_and_decline for the revised offer, the decision days and the device
      going back, tradein_data_sanitisation for erasure, tradein_credit_issue_rules and tradein_credit_redemption
      for how credit is issued, spent and swept, tradein_guarantee_floor for the trade-up floor,
      tradein_excl_guarantee_or_promotion for the single uplift, tradein_combo_membership_interaction for the
      membership bonus, tradein_agg_annual_limits for the rolling-year count and value, and
      tradein_agg_multi_holding for one live agreement per serial, each with its own per-programme figures.
      Writing the quote, booking the device in, recording the appraisal, putting a revised offer, charging or
      waiving the handling fee, certifying the erasure, issuing the credit and its uplift and booking a redemption
      are agent service actions on a verified profile, while accepting a quote for a device the customer owns,
      consenting to the handover and the data erasure, and declining a revised offer are the customer's own acts,
      taken through a handover. Genuinely possible requests that no policy here can decide include honouring a
      quote that has already expired, paying the quoted figure on a device found to be a different model, accepting
      a device the programme will not take locked or with liquid ingress, reinstating credit already swept at
      expiry, paying both a guaranteed floor and a promotional uplift on one device, returning a device already
      recycled under the programme's sanitisation rules, and crediting a trade-in above the profile's yearly value
      cap; on those the only correct route is a POLICY_NOT_COVERED handoff to a human representative.

  - name: installation_service_desk
    claim:
      categories: [service]
      event_types: [service_agreement_open, service_appointment_confirm, service_appointment_reschedule,
                    service_technician_dispatch, service_parts_hold_start, service_parts_hold_release,
                    service_work_complete, service_no_show_record, service_agreement_cancel,
                    service_visit_allowance_grant, service_visit_consume, service_labour_charge,
                    service_parts_charge, service_fee_charge, service_payment, service_waiver,
                    service_parts_order_record, service_diagnostic_record, service_rework_open]
    summary: >
      Callers on this desk want work done or want to argue about work already done: a television to be mounted on a
      brick chimney breast, a washer installed where the old one must come out first, a calibration that did not
      hold, a repair held three weeks waiting for a panel, a crew that arrived to an empty house, a business
      deployment that has to finish before term starts. The setting varies across all six services from TechWorks
      In Store Bench Service to TechWorks Managed IT Care Annual, across jobs standing requested, scheduled,
      dispatched, held for parts, completed, cancelled or recorded as a no-show, across work that is chargeable,
      covered by a protection plan or covered by the manufacturer's warranty, and across profiles whose included
      visit pool is full, part drawn or exhausted and whose rolling year already carries no-shows and reworks. The
      records in play are the service agreement with its work type, item, address, assigned technician and two
      running quantities, the service event ledger of visit grants and uses, labour, parts, fees, payments,
      write-offs, parts orders, diagnoses and reworks, the appointment request through which the customer confirms
      a slot and declares the site ready, and the protection, membership and order records read across for plan
      cover, the labour discount and what was bought; the governing rules are service_appointment_scheduling for
      lead days, windows, certification and rescheduling, service_labour_pricing for the rate, the minimum hours,
      the trip charge, mileage and wall surcharges, service_parts_handling for markup, deposits and how long a job
      may be held, service_diagnostic_scope for the diagnostic fee and work the service does not carry out,
      service_attendance_and_cancellation for no-shows, notice and cancellation fees,
      service_completion_and_workmanship for sign-off, rework and the workmanship guarantee,
      service_visit_allowance and service_agg_visit_pool for the pooled included visits, service_charge_waivers
      for the recognised grounds for a write-off, service_excl_warranty_or_chargeable for one billing basis per
      line, service_combo_plan_membership_interaction for what a plan or a membership changes, and
      service_agg_multi_holding for one open job per item and work type, each with its own per-service figures.
      Opening the job, assigning and dispatching a crew, moving a slot the retailer cannot keep, holding and
      releasing for parts, ordering the part, recording the diagnosis, billing labour, parts and fees, writing a
      charge off, drawing an included visit and recording completion are agent service actions on a verified
      profile, while confirming the slot offered, declaring the site ready, signing the finished work off and
      stopping work the customer no longer wants are the customer's own acts, taken through a handover. Genuinely
      possible requests that no policy here can decide include carrying out new electrical circuits or water and
      waste work the service excludes, reworking a fault free of charge after the rework window has run, waiving a
      no-show fee where the crew waited out the grace minutes and no notice was given, billing a plan for labour
      after the same line has been billed to the customer, booking a slot inside the lead days because the customer
      is leaving the country, crediting an included visit back after the visit term has ended, and meeting damage
      above the service's liability cap; on those the only correct route is a POLICY_NOT_COVERED handoff to a human
      representative.
