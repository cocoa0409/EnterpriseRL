- id: credit_disputes_and_fraud
  subject:
  - credit_purchase_draw
  - credit_refund_credit
  rule: A charge is disputed only within the product's dispute window, counted from the day the statement carrying it closed. The dispute window is counted in calendar days from the statement closing day,
    which counts as day zero. While a dispute is looked into the products that give provisional credit credit the disputed amount and charge no interest on it; the products that do not leave the amount
    payable and refund it if the dispute succeeds. Unauthorised use is met by the retailer above the product's liability cap, and the cap is not applied at all where the customer reported the card lost
    before the draw. A dispute about merchandise rather than the charge is a returns matter, and the returns schedule governs it; the charge stands while that is worked out. A dispute resolved against the
    customer is rebilled with the original purchase reference, so the history stays on file.
  eligibility:
  - id: dispute_window_open
    applies_to:
    - credit_refund_credit
    kind: time
    condition: A charge is disputed only within the product's dispute window, counted from the day the statement carrying it closed.
    evidence_fields:
    - credit_events.statement_period_end
    - credit_events.order_reference
    - credit_accounts.credit_account_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - credit_events.order_reference
      action_bindings:
        credit_events.order_reference: order_reference
    temporal_basis:
      clock: frozen_time
      anchor_event: the day the statement carrying it closed
      anchor_source: credit_events.statement_period_end
      relation: not_after
      duration_source: params.dispute_window_days
      unit: calendar_days
      counting_rule: The dispute window is counted in calendar days from the statement closing day, which counts as day zero.
      boundary: inclusive
  params:
    per_tier:
      Northbeam Store Card:
        dispute_window_days: =dispute_window_days
        dispute_provisional_credit: =dispute_provisional_credit
        fraud_liability_cap_usd: =fraud_liability_cap_usd
      Northbeam Store Card Plus:
        dispute_window_days: =dispute_window_days
        dispute_provisional_credit: =dispute_provisional_credit
        fraud_liability_cap_usd: =fraud_liability_cap_usd
      Northbeam Signature Rewards Card:
        dispute_window_days: =dispute_window_days
        dispute_provisional_credit: =dispute_provisional_credit
        fraud_liability_cap_usd: =fraud_liability_cap_usd
      Northbeam Deferred Interest Promotion Account:
        dispute_window_days: =dispute_window_days
        dispute_provisional_credit: =dispute_provisional_credit
        fraud_liability_cap_usd: =fraud_liability_cap_usd
      Northbeam Business Net Thirty Account:
        dispute_window_days: =dispute_window_days
        dispute_provisional_credit: =dispute_provisional_credit
        fraud_liability_cap_usd: =fraud_liability_cap_usd
      Northbeam Business Fleet Line of Credit:
