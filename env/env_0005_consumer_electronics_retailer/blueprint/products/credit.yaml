- id: credit_msr_balance_across_accounts
  window: the moment of handling, with no historical window
  measure: sum of current_balance over every credit_accounts row of the profile standing active, delinquent or suspended
- id: credit_msr_rewards_earned_year
  window: the current calendar year to the handling date
  measure: sum of store_credit_amount over credit_store_credit_post rows carrying post_reason promotional_award on the account
