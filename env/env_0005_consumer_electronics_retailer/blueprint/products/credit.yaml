      timing: pre_action
      correlation_keys:
      - - credit_events.order_reference
      action_bindings:
        credit_events.order_reference: order_reference
    dedup_contract:
      table: credit_events
      mode: separate_record
      object_bindings:
        order_reference: order_reference
      duplicate_filters:
        event_type:
        - credit_purchase_draw
      distinct_fields:
