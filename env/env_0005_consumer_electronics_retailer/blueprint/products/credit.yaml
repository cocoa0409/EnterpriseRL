- id: credit_excl_promotional_or_revolving
  subject:
  - credit_purchase_draw
  - credit_interest_charge
  rule: A purchase sits either on promotional financing or on the ordinary revolving balance, never on both, and the choice is fixed when the draw is booked. Interest is charged on a promotional plan at
    the promotional rate and on the revolving balance at the purchase rate, and the same amount is never charged at both rates in one statement period. A promotional plan may not be moved onto the revolving
    balance to lower the minimum payment, and a revolving balance may not be moved onto a promotional plan after the purchase. Where a promotional purchase is returned, the plan is reduced by the refund
    and the plan's end day does not move. A profile may hold several promotional plans at once, each with its own end day, and a payment is applied to them as the product's allocation basis states.
  eligibility:
  - id: single_financing_basis_per_purchase
    applies_to:
    - credit_purchase_draw
    kind: dedup
    condition: A purchase sits either on promotional financing or on the ordinary revolving balance, never on both, and the choice is fixed when the draw is booked.
    evidence_fields:
