events:
- type: credit_account_open
  target: credit_accounts
  mutation: create
  meaning: An application for a store credit or financing account is taken and the account record is opened.
  grain: one row per account a customer holds
  fields:
    customer_id: the applying customer
    variant_name: the credit product applied for
    status: set to the entry state application_received
    applied_date: the day the application was taken
    credit_limit: the limit the application is written for
    statement_day: the day of the month the statement will close
    autopay_flag: whether the customer asked for automatic collection
    paperless_flag: whether the customer asked for electronic statements
  triggers: []
- type: credit_account_activate
  target: credit_accounts
  mutation:
    transition:
      from: application_received
      to: active
  meaning: The account is opened for spending once the checks are complete.
  grain: one row per account; the opening day is written onto it
  fields:
    status: moved to active
    opened_date: the day the account was opened for spending
    credit_limit: the limit finally set
    payment_due_date: the day the first payment will fall due
  triggers: []
- type: credit_limit_change
  target: credit_accounts
  mutation: update
  meaning: The spending limit on the account is raised or lowered.
  grain: one row per account; each change overwrites the limit
  fields:
    credit_limit: the limit now set
    promotional_plan_reference: the promotional plan now running
    promotional_expiry_date: the day that plan ends
  triggers: []
- type: credit_delinquency_start
  target: credit_accounts
  mutation:
    transition:
      from: active
      to: delinquent
  meaning: The minimum payment went unpaid far enough past its due day for the account to fall behind.
  grain: one row per account; the day it fell behind is written onto it
  fields:
    status: moved to delinquent
    delinquent_since_date: the day the account fell behind
  triggers:
  - event: credit:credit_fee_charge
    map:
      customer_id: customer_id
      fee_kind: late_fee
- type: credit_account_reinstate
  target: credit_accounts
  mutation:
    transition:
    - from: delinquent
      to: active
    - from: suspended
      to: active
  meaning: The arrears are cured or the suspension lifted and the account spends again.
  grain: one row per account; the account returns to spending
  fields:
    status: moved back to active
    payment_due_date: the day the next payment falls due
    last_payment_date: the day the curing payment was received
  triggers: []
- type: credit_account_suspend
  target: credit_accounts
  mutation:
    transition:
    - from: active
      to: suspended
    - from: delinquent
      to: suspended
  meaning: Further spending on the account is stopped, for arrears, utilisation or suspected fraud.
  grain: one row per account; the suspension is recorded on the account itself
  fields:
    status: moved to suspended
    credit_limit: the limit as it stands at suspension
  triggers: []
- type: credit_account_close
  target: credit_accounts
  mutation:
    transition:
    - from: active
      to: closed
    - from: delinquent
      to: closed
    - from: suspended
      to: closed
    - from: application_received
      to: closed
  meaning: The account is closed, at the customer's request, for inactivity, or because the application was declined.
  grain: one row per account; the closing day is written onto it
  fields:
    status: moved to closed
    closed_date: the day the account was closed
  triggers: []
- type: credit_purchase_draw
  target: credit_events
  meaning: A purchase, a service charge or a plan premium is drawn on the account.
  grain: one row per amount drawn against one purchase or charge
  distinguish_by:
  - order_reference
  - merchant_category
  - event_date
  fields:
    draw_amount: the amount drawn
    merchant_category: what the amount was spent on
    order_reference: the purchase or charge drawn against
    promotional_plan_reference: the promotional plan the draw was put on, where it was
    event_date: the day the draw was booked
    channel: the channel the purchase was made through
    tier_at_event: the credit product the draw was booked under
    customer_id: the spending customer
  account: credit_balance
  direction: in
  triggers: []
- type: credit_payment_post
  target: credit_events
  meaning: The customer settles part or all of what is owed on the account.
  grain: one row per payment received against one statement period
  distinguish_by:
  - statement_period_start
  - payment_method
  - event_date
  fields:
    payment_amount: the amount received
    payment_method: how the customer paid
    statement_period_start: first day of the statement period the payment was applied to
    event_date: the day the payment was received
    channel: the channel the payment came through
    customer_id: the customer who paid
  account: credit_balance
  direction: out
  triggers: []
- type: credit_interest_charge
  target: credit_events
  meaning: Interest for a statement period is charged on the balance carried.
  grain: one row per statement period on one account
  distinguish_by:
  - statement_period_start
  - apr_applied
  fields:
    interest_amount: the interest charged
    apr_applied: the rate it was worked out at
    statement_period_start: first day of the period charged for
    statement_period_end: last day of the period charged for
    promotional_plan_reference: the promotional plan the interest belongs to, where it does
    event_date: the day the interest was charged
    tier_at_event: the credit product the interest was charged under
    customer_id: the customer charged
  account: credit_balance
  direction: in
  triggers: []
- type: credit_fee_charge
  target: credit_events
  meaning: A late fee, annual fee, returned payment fee, over-limit fee or paper statement fee is charged.
  grain: one row per fee of one kind charged in one statement period
  distinguish_by:
  - fee_kind
  - statement_period_start
  fields:
    fee_amount: the fee charged
    fee_kind: which fee it is
    statement_period_start: first day of the statement period the fee belongs to
    event_date: the day the fee was charged
    tier_at_event: the credit product the fee was charged under
    customer_id: the customer charged
  account: credit_balance
  direction: in
  triggers: []
- type: credit_refund_credit
  target: credit_events
  meaning: A refund from a returned purchase or a reversed charge is credited against the balance.
  grain: one row per refund credited against one purchase
  distinguish_by:
  - order_reference
  - event_date
  fields:
    payment_amount: the amount credited
    order_reference: the purchase the refund came from
    event_date: the day the credit was booked
    channel: the channel the refund came through
    customer_id: the refunded customer
  account: credit_balance
  direction: out
  triggers: []
- type: credit_store_credit_post
  target: credit_events
  meaning: Store credit is posted to the account, from a return, a refunded premium, a trade-in or a goodwill award.
  grain: one row per store credit posting on one account
  distinguish_by:
  - post_reason
  - order_reference
  - event_date
  fields:
    store_credit_amount: the credit posted
    post_reason: why it was posted
    order_reference: the record the credit came from
    event_date: the day the credit was posted
    channel: the channel the credit came through
    tier_at_event: the credit product the posting was made under
    customer_id: the credited customer
  account: store_credit
  direction: in
  triggers: []
- type: credit_store_credit_spend
  target: credit_events
  meaning: Store credit held on the account is spent against a purchase.
  grain: one row per amount of store credit spent against one purchase
  distinguish_by:
  - order_reference
  - event_date
  fields:
    store_credit_amount: the credit spent
    order_reference: the purchase it was spent against
    merchant_category: what it was spent on
    event_date: the day it was spent
    channel: the channel it was spent through
    customer_id: the spending customer
  account: store_credit
  direction: out
  triggers: []
- type: credit_store_credit_expire
  target: credit_events
  meaning: Store credit left unspent at the end of its life is written off.
  grain: one row per sweep year on one account
  distinguish_by:
  - expiry_cycle_year
  fields:
    store_credit_amount: the credit written off
    expiry_cycle_year: the sweep year it belongs to
    event_date: the day the sweep was run
    customer_id: the customer whose credit was swept
  account: store_credit
  direction: out
  triggers: []
- type: credit_statement_close
  target: credit_events
  meaning: The statement period closes and the minimum payment and due day are set.
  grain: one row per statement period on one account
  distinguish_by:
  - statement_period_start
  - statement_period_end
  fields:
    statement_period_start: first day of the period
    statement_period_end: last day of the period
    minimum_payment_due: the least payment the statement asks for
    apr_applied: the rate the statement was worked out at
    event_date: the day the statement closed
    tier_at_event: the credit product the statement was issued under
    customer_id: the billed customer
  triggers:
  - event: credit:credit_interest_charge
