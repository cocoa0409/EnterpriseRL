category: credit
display_name: Northbeam Store Credit and Financing Accounts
binding:
  holding_table: credit_accounts
  event_tables:
  - credit_events
  intake_tables:
  - credit_limit_requests
  status_field: status
  variant_field: variant_name
  quantity_fields:
    current_balance: credit_balance
    store_credit_balance: store_credit
lifecycle:
  states:
  - application_received
  - active
  - delinquent
  - suspended
  - closed
  transitions:
  - from: application_received
    to: active
    by: agent
    means: the checks were completed and the account was opened for spending
  - from: application_received
    to: closed
    by: agent
    means: the application was declined
  - from: active
    to: delinquent
    by: system
    means: the minimum payment went unpaid past the delinquency days
  - from: delinquent
    to: active
    by: agent
    means: the arrears were cured on the product's cure basis
  - from: active
    to: suspended
    by: agent
    means: spending was stopped for utilisation or suspected unauthorised use
  - from: delinquent
    to: suspended
    by: agent
    means: spending was stopped while the arrears were pursued
  - from: suspended
    to: active
    by: agent
    means: the suspension was lifted and the account spends again
  - from: active
    to: closed
    by: user
    means: the customer asked for their own account to be closed
  - from: delinquent
    to: closed
    by: agent
    means: the account was closed with the arrears left in collections
  - from: suspended
    to: closed
    by: agent
    means: the suspended account was closed
accounts:
- key: credit_balance
  unit: USD
  meaning: amount owed on the account; an in delta increases what is owed by a draw, interest or a fee, and an out delta records a payment or a refund
- key: store_credit
  unit: USD
  meaning: unspent store credit held on the account; an in delta posts credit and an out delta records it spent or swept
parameter_schema:
  purchase_apr_pct: Annual rate charged on purchases carried past the grace period, percent.
  promotional_apr_pct: Annual rate charged during a promotional financing period, percent.
  deferred_interest_basis: What happens to deferred interest if the plan is not cleared in time (string).
  promotional_terms_ladder: Promotional financing months offered at each purchase amount, as a ladder of amount band to months.
  promotional_minimum_purchase_usd: Smallest purchase that may be put on promotional financing, USD.
  cash_advance_allowed: Whether cash may be drawn on the account.
  credit_limit_min_usd: Smallest limit the product is opened at, USD.
  credit_limit_max_usd: Largest limit the product is written to, USD.
  limit_increase_review_months: Months on the account before a limit increase is considered.
  limit_increase_income_check: Whether stated income must be checked before a limit increase.
  over_limit_allowed_pct: How far over the limit a transaction may still go, percent of the limit.
  over_limit_fee_usd: Fee charged when the balance goes past the limit, USD.
  annual_fee_usd: Annual fee for holding the account, USD.
  annual_fee_waiver_spend_usd: Yearly spend at or above which the annual fee is waived, USD.
  statement_cycle_days: Days in a statement period.
  payment_due_days_after_statement: Days after the statement closes that the payment falls due.
  grace_days_on_purchases: Days a purchase may be carried without interest when the balance is cleared in full.
  minimum_payment_pct: Least payment as a percentage of the statement balance, percent.
  minimum_payment_floor_usd: Least payment in money whatever the percentage gives, USD.
  payment_allocation_basis: Which balance a payment is applied to first (string).
  payment_methods_allowed: Ways the account may be settled (string).
  autopay_available: Whether the minimum payment may be collected automatically.
  late_fee_usd: Fee charged when the minimum payment misses its due day, USD.
  late_fee_grace_days: Days past the due day before the late fee is charged.
  returned_payment_fee_usd: Fee charged when a payment is returned unpaid, USD.
  paper_statement_fee_usd: Fee for a posted paper statement where electronic delivery is available, USD.
  delinquency_days: Days past the due day at which the account is treated as delinquent.
  delinquency_reporting_days: Days past the due day at which the arrears are reported to the credit bureaux.
  suspension_utilization_pct: Utilisation of the limit at which further spending is suspended, percent.
  reinstatement_cure_basis: What must be paid to bring a delinquent account back (string).
  closure_notice_days: Days of notice the retailer gives before closing an account for inactivity.
  inactivity_closure_months: Months without a transaction after which the account is closed.
  closure_balance_handling: What happens to a balance on a closing account (string).
  rewards_pct_on_merchandise: Statement credit earned on merchandise spend, percent.
  rewards_cap_per_year_usd: Most statement credit that may be earned in a year, USD.
  store_credit_validity_days: Days posted store credit stays spendable.
  store_credit_min_spend_usd: Smallest amount of store credit that may be spent at once, USD.
  store_credit_transferable: Whether store credit may be moved to another profile.
  store_credit_spend_priority: Whether store credit is spent before the card balance is drawn (string).
  store_credit_refundable_to_cash: Whether store credit may be turned back into money.
  store_credit_expiry_sweep_basis: When unspent store credit is swept (string).
  business_net_terms_days: Days a business invoice may run before it is overdue.
  purchase_order_required: Whether a purchase order number must be quoted on every draw.
  authorized_buyer_slots: Named buyers who may draw on the account.
  joint_account_allowed: Whether a second individual may be added as jointly liable.
  identity_verification_required: Whether identity documents must be checked before the account is opened.
  minimum_age_years: Least age at which the account may be opened.
  dispute_window_days: Days after a statement closes within which a charge may be disputed.
  dispute_provisional_credit: Whether the disputed amount is credited while the dispute is looked into.
  fraud_liability_cap_usd: Most the customer may be held to for unauthorised use, USD.
  statement_delivery_methods: Ways the statement is delivered (string).
