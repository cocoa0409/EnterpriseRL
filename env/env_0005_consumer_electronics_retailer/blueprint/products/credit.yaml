    entry gate is read against the profile: the least age, the kind of credit check, the trade references a business product needs and the prior account months a step-up product needs. Identity documents
    are checked before any account is opened, and a business account additionally names its authorised buyers up to the product''s buyer slots. The limit is written inside the product''s band, and a limit
