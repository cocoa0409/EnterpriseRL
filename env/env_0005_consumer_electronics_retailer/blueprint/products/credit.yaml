- id: credit_store_credit_ledger
  subject:
  - credit_store_credit_post
  - credit_store_credit_spend
  - credit_store_credit_expire
  - credit_refund_credit
  rule: Store credit posted to the account carries the reason it was posted, so a return, a refunded premium, a trade-in credit and a goodwill award can be told apart on the statement. Store credit is posted,
    spent or swept only while the account stands active, delinquent or suspended. Store credit is spent at face value on merchandise and service charges, never on interest, fees or dues, and never turned
    back into money. Store credit stays spendable for the product's validity days and is swept as the product's sweep basis states; a sweep is never reversed as a courtesy. A refund from a returned purchase
    is credited against the balance where the purchase was drawn on the account, and posted as store credit only where the balance has already been cleared. Store credit moves to another profile only on
    the products that allow it, and it moves once, keeping its original sweep day.
  eligibility:
  - id: postable_account_state
    applies_to:
    - credit_store_credit_post
    - credit_store_credit_spend
    - credit_store_credit_expire
    kind: state
    condition: Store credit is posted, spent or swept only while the account stands active, delinquent or suspended.
    evidence_fields:
    - credit_accounts.status
    - credit_accounts.credit_account_id
    - credit_accounts.store_credit_balance
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - credit_accounts.credit_account_id
      action_bindings:
        credit_accounts.credit_account_id: credit_account_id
    state_contract:
      field: credit_accounts.status
      allowed:
      - active
      - delinquent
      - suspended
  params:
    per_tier:
      Northbeam Store Card:
        store_credit_validity_days: =store_credit_validity_days
        store_credit_min_spend_usd: =store_credit_min_spend_usd
        store_credit_transferable: =store_credit_transferable
        store_credit_refundable_to_cash: =store_credit_refundable_to_cash
        store_credit_expiry_sweep_basis: =store_credit_expiry_sweep_basis
      Northbeam Store Card Plus:
        store_credit_validity_days: =store_credit_validity_days
        store_credit_min_spend_usd: =store_credit_min_spend_usd
