- id: credit_closure
  subject:
  - credit_account_close
  rule: A customer may close an account at any time, and the balance stays payable as the product's closure handling states; on the deferred interest product the accrued interest becomes payable at once.
    The retailer closes an account for inactivity after the product's inactivity months, having given the product's notice days, and closes a declined application on the day it is declined. Store credit
    unspent on a closing account stays spendable until its own sweep day and is not forfeited by the closure. A promotional financing plan running on a closing account keeps its own end day, and closing
    the account does not shorten the plan. An account closed with arrears stays in collections, and closing it does not stop the reporting already made.
  eligibility: []
  params:
    per_tier:
      Northbeam Store Card:
        closure_notice_days: =closure_notice_days
        inactivity_closure_months: =inactivity_closure_months
        closure_balance_handling: =closure_balance_handling
        annual_fee_usd: =annual_fee_usd
        annual_fee_waiver_spend_usd: =annual_fee_waiver_spend_usd
