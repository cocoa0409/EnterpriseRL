- id: credit_combo_membership_rewards
  subject:
  - credit_payment_post
  - credit_store_credit_post
  rule: 'Holding a Circle membership and a rewards card together changes what the spend earns: the statement credit the card earns is posted as store credit, and the membership''s reward points are earned
    on the same spend, so the two run alongside each other rather than one replacing the other. The card''s yearly reward cap is read on the card alone, and the membership''s yearly points cap on the membership
    alone; neither cap is read against the other. The annual fee of a card is waived where the profile''s yearly spend on that card reaches the product''s waiver figure, and membership standing does not
    waive it. Membership dues drawn on the card earn the card''s statement credit but earn no membership points, because dues are not merchandise. A business fleet line earns its statement credit to the
    business profile only, whatever named buyer made the purchase.'
