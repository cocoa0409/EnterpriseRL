- id: credit_agg_multi_holding
  subject:
  - credit_account_open
  rule: A customer may hold more than one credit account, since a promotional financing account sits alongside a card and a business line sits alongside a consumer card. A second account of the same credit
    product is never opened while one stands in application_received, active, delinquent or suspended. A profile holds at most one consumer card and one promotional account at a time, and a business profile
    at most one net account and one fleet line. A closed account does not block a fresh application, and the earlier record stays on file.
  eligibility:
  - id: one_account_per_product
    applies_to:
    - credit_account_open
    kind: dedup
    condition: A second account of the same credit product is never opened while one stands in application_received, active, delinquent or suspended.
    evidence_fields:
    - credit_accounts.variant_name
    - credit_accounts.status
    - credit_accounts.customer_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - credit_accounts.customer_id
      action_bindings:
        credit_accounts.customer_id: customer_id
    dedup_contract:
      table: credit_accounts
      mode: separate_record
      object_bindings:
        customer_id: customer_id
        variant_name: variant_name
      duplicate_filters:
        status:
        - application_received
        - active
        - delinquent
        - suspended
      distinct_fields:
      - applied_date
      - credit_limit
  params:
    max_per_customer: 2
- id: credit_agg_exposure
  subject:
  - credit_purchase_draw
  - credit_limit_change
  rule: 'Exposure is read across every account the profile holds rather than account by account: the balances carried, read from credit_msr_balance_across_accounts, are set against the sum of the limits,
    and a draw that would take total utilisation past the product''s suspension figure is refused even where the single account has room. A limit increase on one account is considered against total exposure
    and the income stated on the request, and the increase is never written above the product''s largest limit. A business fleet line and a business net account are read together, because the same business
    stands behind both. Store credit held on any account reduces exposure only when it is actually spent, not while it sits unspent. Where the profile also carries a promotional financing plan, the balance
    on that plan counts toward exposure at its full amount however far off its end day is.'
