- id: credit_delinquency_and_collections
  subject:
  - credit_delinquency_start
  - credit_account_suspend
  - credit_account_reinstate
  - credit_fee_charge
  rule: An account is not treated as delinquent before the product's delinquency days have run from the day the minimum payment fell due. Delinquency days are counted as calendar days from the payment due
    day, which counts as day zero, and a due day falling on a day the banks are shut moves to the next banking day. The product's late fee is charged once the product's late fee grace days have run past
    the due day, and it is charged once per statement period however many payments are missed in it. Spending is suspended when utilisation passes the product's suspension figure, when the account is delinquent,
    or when unauthorised use is suspected; suspension does not close the account and the balance stays payable. The arrears are reported to the credit bureaux once the product's reporting days have run,
    and the account is brought back only on what the product's cure basis requires. A returned payment carries the product's returned payment fee, and a payment returned after the account was reinstated
    puts it back into delinquency on the original due day rather than a fresh one.
  eligibility:
  - id: delinquency_days_run
    applies_to:
    - credit_delinquency_start
    kind: time
    condition: An account is not treated as delinquent before the product's delinquency days have run from the day the minimum payment fell due.
    evidence_fields:
    - credit_accounts.payment_due_date
    - credit_accounts.credit_account_id
    - credit_accounts.minimum_payment_due
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - credit_accounts.credit_account_id
      action_bindings:
        credit_accounts.credit_account_id: credit_account_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the day the minimum payment fell due
      anchor_source: credit_accounts.payment_due_date
      relation: not_before
      duration_source: params.delinquency_days
      unit: calendar_days
      counting_rule: Delinquency days are counted as calendar days from the payment due day, which counts as day zero, and a due day falling on a day the banks are shut moves to the next banking day.
      boundary: inclusive
  params:
    per_tier:
      Northbeam Store Card:
        delinquency_days: =delinquency_days
        delinquency_reporting_days: =delinquency_reporting_days
        late_fee_usd: =late_fee_usd
        late_fee_grace_days: =late_fee_grace_days
