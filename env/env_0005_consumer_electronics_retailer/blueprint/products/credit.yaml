- id: credit_statement_and_interest
  subject:
  - credit_statement_close
  - credit_interest_charge
  rule: The statement closes on the account's statement day, covering the product's cycle days, and the minimum payment is the product's percentage of the statement balance raised to the product's money
    floor, rounded up to the cent. Interest is charged on the balance carried past the product's grace days at the product's purchase rate, worked out on the average daily balance of the statement period;
    a balance cleared in full inside the grace days is charged nothing. A promotional financing plan is charged at the product's promotional rate while it runs; on the deferred interest product, a plan
    not cleared by its end day has the interest accrued from the purchase day become payable in full in that statement period. A payment is applied as the product's allocation basis states, and the customer
    may not direct it elsewhere. The statement is delivered by a way the product offers, and the paper statement fee is charged only where electronic delivery was available and the customer chose paper.
