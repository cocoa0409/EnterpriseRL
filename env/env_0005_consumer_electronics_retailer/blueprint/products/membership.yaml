  params:
    per_tier:
      Circle Free Membership:
        tier_upgrade_basis: =tier_upgrade_basis
        tier_downgrade_basis: =tier_downgrade_basis
        proration_rounding: =proration_rounding
        qualifying_spend_for_tier_usd: =qualifying_spend_for_tier_usd
        household_member_slots: =household_member_slots
        business_seat_slots: =business_seat_slots
        seat_addition_fee_usd: =seat_addition_fee_usd
      Circle Plus Annual:
        tier_upgrade_basis: =tier_upgrade_basis
        tier_downgrade_basis: =tier_downgrade_basis
        proration_rounding: =proration_rounding
        qualifying_spend_for_tier_usd: =qualifying_spend_for_tier_usd
        household_member_slots: =household_member_slots
