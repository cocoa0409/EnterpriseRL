- id: membership_cancellation_refund
  subject:
  - membership_cancel
  rule: A cancellation is carried into the membership record only against a change request standing as confirmed by the customer for that membership. Benefits stop on the day the cancellation takes effect,
    unspent benefit credit is written off, and live points are swept after the sweep rules. Dues are refunded in full only when the cancellation is confirmed within the tier's full refund window, counted
    from the day the membership was activated. The full refund window is counted in calendar days from the activation day, which counts as day zero. After that window the tiers that refund pro rata refund
    the whole unused months of the term at the dues actually billed, rounded as the tier's proration rounding states, and the tiers that do not refund pay nothing back. An enrollment fee, a late fee and
    a reinstatement fee are never refunded, and dues for a period already used are never refunded. A refund is returned to the card the dues were taken from where that card is still on file, and otherwise
    posted as store credit.
  eligibility:
  - id: customer_confirmed_cancellation
    applies_to:
    - membership_cancel
    kind: authorization
    condition: A cancellation is carried into the membership record only against a change request standing as confirmed by the customer for that membership.
    evidence_fields:
    - membership_change_requests.outcome
    - membership_change_requests.membership_id
    - membership_change_requests.request_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - membership_change_requests.membership_id
      action_bindings:
        membership_change_requests.membership_id: membership_id
  - id: full_refund_window
    applies_to:
    - membership_cancel
    kind: time
    condition: Dues are refunded in full only when the cancellation is confirmed within the tier's full refund window, counted from the day the membership was activated.
    evidence_fields:
    - membership_holdings.activation_date
    - membership_holdings.membership_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - membership_holdings.membership_id
      action_bindings:
        membership_holdings.membership_id: membership_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the day the membership was activated
      anchor_source: membership_holdings.activation_date
      relation: not_after
      duration_source: params.cancellation_full_refund_window_days
      unit: calendar_days
      counting_rule: The full refund window is counted in calendar days from the activation day, which counts as day zero.
      boundary: inclusive
  params:
    per_tier:
      Circle Free Membership:
        cancellation_refund_basis: =cancellation_refund_basis
        cancellation_full_refund_window_days: =cancellation_full_refund_window_days
        proration_rounding: =proration_rounding
      Circle Plus Annual:
        cancellation_refund_basis: =cancellation_refund_basis
        cancellation_full_refund_window_days: =cancellation_full_refund_window_days
        proration_rounding: =proration_rounding
      Circle Total Annual:
        cancellation_refund_basis: =cancellation_refund_basis
        cancellation_full_refund_window_days: =cancellation_full_refund_window_days
        proration_rounding: =proration_rounding
      Circle Total Household Annual:
        cancellation_refund_basis: =cancellation_refund_basis
        cancellation_full_refund_window_days: =cancellation_full_refund_window_days
        proration_rounding: =proration_rounding
      Circle Business Pro:
        cancellation_refund_basis: =cancellation_refund_basis
        cancellation_full_refund_window_days: =cancellation_full_refund_window_days
        proration_rounding: =proration_rounding
      Circle Business Elite:
        cancellation_refund_basis: =cancellation_refund_basis
        cancellation_full_refund_window_days: =cancellation_full_refund_window_days
        proration_rounding: =proration_rounding
- id: membership_combo_protection_interaction
  subject:
  - membership_points_accrue
  - membership_benefit_grant
  rule: 'Holding a protection plan changes what the membership earns and what it is granted: while the customer holds at least one protection plan standing active, the plan bonus percentage of the tier
    is earned on every protection plan bought in that membership year, and the service credit of the tier is granted as well as the anniversary reward rather than instead of it. The protection plan discount
    of the tier is applied to the plan price before the plan bonus points are worked out, so the discount lowers both the price and the points. A plan standing in claim_hold counts as held for the purposes
    of this rule; a plan that is expired, cancelled or void does not, and the service credit is not granted on that ground alone. Where the customer holds several plans the interaction is counted once per
    membership year, not once per plan.'
  eligibility: []
  params:
    per_tier:
      Circle Free Membership:
        points_bonus_on_protection_plan_pct: =points_bonus_on_protection_plan_pct
        protection_plan_discount_pct: =protection_plan_discount_pct
        service_benefit_credit_usd: =service_benefit_credit_usd
      Circle Plus Annual:
        points_bonus_on_protection_plan_pct: =points_bonus_on_protection_plan_pct
        protection_plan_discount_pct: =protection_plan_discount_pct
        service_benefit_credit_usd: =service_benefit_credit_usd
      Circle Total Annual:
        points_bonus_on_protection_plan_pct: =points_bonus_on_protection_plan_pct
        protection_plan_discount_pct: =protection_plan_discount_pct
        service_benefit_credit_usd: =service_benefit_credit_usd
