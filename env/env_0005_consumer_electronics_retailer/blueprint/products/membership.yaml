- id: membership_benefit_redemption
  subject:
  - membership_benefit_redeem
  rule: 'A benefit credit is spent only against a charge of the kind the benefit names: the installation credit against installation labour, the delivery credit against a delivery charge, the haul-away
    credit against a haul-away charge, and the service credit against bench or on-site repair labour. Where the tier allows only one credit per charge, the credit that leaves the customer paying least is
    applied and the others stay unspent; where the tier is additive, credits are applied together up to the value of the charge and never beyond it. A benefit code that already has a redemption booked against
    the same charge reference is not redeemed a second time. A credit is never spent against tax, against dues, or against the price of merchandise. Once the membership has booked as many redemptions in
    the membership year as the tier allows, measured by membership_msr_benefit_redemptions_term, further redemptions are refused until the next anniversary. Where the charge is later reversed the credit
    is restored by a fresh grant carrying the same benefit code, and the original redemption row stays on file.'
  eligibility:
  - id: one_redemption_per_charge
    applies_to:
    - membership_benefit_redeem
    kind: dedup
    condition: A benefit code that already has a redemption booked against the same charge reference is not redeemed a second time.
    evidence_fields:
    - membership_events.benefit_code
    - membership_events.redemption_ref
    - membership_events.event_type
    - membership_events.membership_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - membership_events.redemption_ref
        - membership_events.membership_id
      action_bindings:
        membership_events.redemption_ref: redemption_ref
        membership_events.membership_id: membership_id
    dedup_contract:
      table: membership_events
      mode: separate_record
      object_bindings:
        redemption_ref: redemption_ref
        benefit_code: benefit_code
      duplicate_filters:
        event_type:
        - membership_benefit_redeem
      distinct_fields:
      - event_date
      - channel
  params:
    per_tier:
      Circle Free Membership:
        benefit_credit_stacking_basis: =benefit_credit_stacking_basis
        max_benefit_redemptions_per_year: =max_benefit_redemptions_per_year
      Circle Plus Annual:
        benefit_credit_stacking_basis: =benefit_credit_stacking_basis
        max_benefit_redemptions_per_year: =max_benefit_redemptions_per_year
      Circle Total Annual:
        benefit_credit_stacking_basis: =benefit_credit_stacking_basis
        max_benefit_redemptions_per_year: =max_benefit_redemptions_per_year
      Circle Total Household Annual:
        benefit_credit_stacking_basis: =benefit_credit_stacking_basis
        max_benefit_redemptions_per_year: =max_benefit_redemptions_per_year
      Circle Business Pro:
        benefit_credit_stacking_basis: =benefit_credit_stacking_basis
        max_benefit_redemptions_per_year: =max_benefit_redemptions_per_year
      Circle Business Elite:
        benefit_credit_stacking_basis: =benefit_credit_stacking_basis
        max_benefit_redemptions_per_year: =max_benefit_redemptions_per_year
  measures:
  - membership_msr_benefit_redemptions_term
- id: membership_tier_migration
  subject:
  - membership_tier_change
  rule: 'An upgrade takes effect on the day it is asked for: the difference in annual dues is billed as a proration over the whole unused months of the current term, and the new tier''s parameters apply
    from that day to every benefit not yet redeemed. A downgrade takes effect at the end of the current term, the current tier''s parameters stand until then, and no dues are refunded for the unused part
    of the term on a downgrade. A migration between a consumer tier and a business tier is not a migration but a fresh enrollment, because the entry gate differs on account type. A membership standing in
    grace may be upgraded only after the outstanding dues are settled, and a lapsed membership cannot be migrated at all. A profile whose trailing-term qualifying spend, read from membership_msr_qualifying_spend_term,
    reaches the tier''s qualifying spend figure is moved up without a proration being billed. Household or business seats above the new tier''s allowance are removed as part of the migration, oldest seat
    first.'
