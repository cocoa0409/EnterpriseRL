- id: membership_excl_consumer_business
  subject:
  - membership_enroll
  rule: 'A consumer tier and a business tier are never held at the same time on one profile, and a profile carrying a business name and a tax exempt certificate is enrolled only on a business tier. Household
    seats are a consumer-tier arrangement and business seats a business-tier arrangement; neither kind of seat may be attached to the other kind of tier. A customer who runs a business from the household
    address chooses one arrangement: the household tier, whose seats must share the primary member''s service address, or a business tier, whose seats are named buyers of the business. Where both kinds
    of enrollment are asked for on one profile the business tier is opened and the consumer enrollment is refused, because the tax exempt certificate governs how the profile is invoiced.'
  eligibility:
  - id: one_market_side_only
    applies_to:
    - membership_enroll
    kind: authorization
    condition: A consumer tier and a business tier are never held at the same time on one profile, and a profile carrying a business name and a tax exempt certificate is enrolled only on a business tier.
    evidence_fields:
    - customers.account_type
    - customers.tax_exempt_certificate
    - customers.business_name
    - customers.customer_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - customers.customer_id
      action_bindings:
        customers.customer_id: customer_id
  params:
    per_tier:
      Circle Free Membership:
        household_member_slots: =household_member_slots
        business_seat_slots: =business_seat_slots
        tax_exempt_enrollment_allowed: =tax_exempt_enrollment_allowed
