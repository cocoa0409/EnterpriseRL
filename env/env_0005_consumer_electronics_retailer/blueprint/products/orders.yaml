- id: orders_backorder_handling
  subject:
  - orders_stock_hold
  - orders_backorder_notice
  rule: The customer is told within the service's notice days that the item has gone to backorder, and is given the day it is expected. An order awaiting stock may be cancelled without charge once the service's
    backorder days have run from the day the order went to backorder. Backorder days are counted as calendar days from the day the order went to backorder, which counts as day zero. The price the order
    was placed at is held while it waits, so a price rise in the meantime is not passed on. Where the service allows partial shipment the lines in stock are sent first and the rest follow, and where it
    does not the whole order waits. Where the item is discontinued and the service allows substitution, a like model is offered at the price originally paid; where it does not, the order is cancelled and
    everything taken is returned. A backorder does not extend the return window, which still runs from the day the goods are finally delivered.
  eligibility:
  - id: backorder_days_run
    applies_to:
    - orders_stock_hold
    kind: time
    condition: An order awaiting stock may be cancelled without charge once the service's backorder days have run from the day the order went to backorder.
    evidence_fields:
    - purchase_orders.backorder_since_date
    - purchase_orders.purchase_order_id
    - purchase_orders.promised_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - purchase_orders.purchase_order_id
      action_bindings:
        purchase_orders.purchase_order_id: purchase_order_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the day the order went to backorder
      anchor_source: purchase_orders.backorder_since_date
      relation: not_before
      duration_source: params.backorder_max_days
      unit: calendar_days
      counting_rule: Backorder days are counted as calendar days from the day the order went to backorder, which counts as day zero.
      boundary: inclusive
  params:
    per_tier:
      Standard Parcel Delivery:
        backorder_notice_days: =backorder_notice_days
        backorder_max_days: =backorder_max_days
        backorder_price_hold: =backorder_price_hold
        partial_shipment_allowed: =partial_shipment_allowed
        substitution_allowed: =substitution_allowed
      Store Pickup Hold:
        backorder_notice_days: =backorder_notice_days
        backorder_max_days: =backorder_max_days
        backorder_price_hold: =backorder_price_hold
        partial_shipment_allowed: =partial_shipment_allowed
        substitution_allowed: =substitution_allowed
      Threshold Delivery:
        backorder_notice_days: =backorder_notice_days
        backorder_max_days: =backorder_max_days
        backorder_price_hold: =backorder_price_hold
        partial_shipment_allowed: =partial_shipment_allowed
        substitution_allowed: =substitution_allowed
      Room of Choice Delivery with Haul Away:
        backorder_notice_days: =backorder_notice_days
        backorder_max_days: =backorder_max_days
        backorder_price_hold: =backorder_price_hold
        partial_shipment_allowed: =partial_shipment_allowed
        substitution_allowed: =substitution_allowed
      White Glove Delivery and Installation:
        backorder_notice_days: =backorder_notice_days
        backorder_max_days: =backorder_max_days
        backorder_price_hold: =backorder_price_hold
        partial_shipment_allowed: =partial_shipment_allowed
        substitution_allowed: =substitution_allowed
      Business Dock and Freight Delivery:
        backorder_notice_days: =backorder_notice_days
        backorder_max_days: =backorder_max_days
        backorder_price_hold: =backorder_price_hold
        partial_shipment_allowed: =partial_shipment_allowed
        substitution_allowed: =substitution_allowed
- id: orders_cancellation
  subject:
  - orders_order_cancel
  - orders_credit_apply
  rule: 'An order cancelled with at least the service''s notice hours before the slot is charged nothing and everything taken is reversed to the method it was taken from. Cancelled inside the notice period,
    the service''s cancellation fee is kept, and cancelled once the goods are already on the van the fee is kept and the goods go back to stock. An order cancelled because the retailer cannot supply, because
    the item is discontinued with no substitute, or because the backorder days have run is charged nothing whatever the notice. A deposit is reversed in full where nothing is charged, and a cancellation
    reversal is booked against the same order line the deposit was taken on. A cancelled order never becomes a return: where the goods have been handed over the customer raises a return under the returns
    schedule instead.'
  eligibility: []
  params:
    per_tier:
      Standard Parcel Delivery:
        cancellation_notice_hours: =cancellation_notice_hours
        cancellation_fee_usd: =cancellation_fee_usd
        deposit_pct_on_placement: =deposit_pct_on_placement
      Store Pickup Hold:
        cancellation_notice_hours: =cancellation_notice_hours
