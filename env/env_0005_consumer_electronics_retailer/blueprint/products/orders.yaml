- id: orders_charge_composition
  subject:
  - orders_line_charge
  - orders_payment_capture
  rule: 'The order is billed line by line: merchandise at the shelf price times the units, the tax on it, then the delivery charge the service''s band mapping gives for the order value, then installation,
    haul-away and the statutory recycling charge where they apply. Delivery is free where the order value reaches the service''s free delivery threshold, and where the service takes the member threshold
    the Circle tier''s threshold replaces the service''s own. Haul-away is included up to the service''s included units and billed at the service''s fee beyond them; where the service includes installation
    nothing is billed for it, and where it does not, installation is bought as a TechWorks service instead. Money is taken as the service''s capture basis states: in full on placement, as the service''s
    deposit percentage with the balance on delivery, or on invoice after delivery. A pallet on a freight delivery is billed the service''s pallet fee for each pallet moved, and goods held in store beyond
    the hold days carry the service''s daily storage charge.'
