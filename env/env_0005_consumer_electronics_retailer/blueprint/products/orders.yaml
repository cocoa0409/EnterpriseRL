- id: orders_excl_delivery_or_pickup
  subject:
  - orders_order_place
  - orders_order_fulfil
  rule: 'One order is fulfilled by delivery or by collection, never by both, and the service chosen at placement fixes which. A customer who wants to collect goods on a delivery order cancels it and places
    a collection order, and the price is held where the change is made inside the amendment cutoff. Collection goods are held for the service''s hold days and then returned to stock, with the daily storage
    charge applied first where the service charges one. A part-collected order is not permitted: the lines on a collection order are handed over together or held together. Identity is checked at collection
    where the service requires it, and goods are handed to the buyer or a person the buyer named when the order was placed and to nobody else.'
