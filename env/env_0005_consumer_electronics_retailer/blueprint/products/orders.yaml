- id: orders_delivery_attempts
  subject:
  - orders_delivery_attempt
  - orders_fee_charge
  - orders_order_fulfil
  - orders_return_to_stock
  rule: Each attempt at handing the goods over is recorded with how it ended, and the attempts the service includes are made at no further charge. A delivery attempt, and a fee arising from one, is recorded
    only while the order stands scheduled, out_for_delivery, fulfilled or returned_to_stock. An attempt that fails because nobody was at the address or the crew could not get in is charged the service's
    redelivery fee from the first attempt beyond those included; an attempt that fails because the crew brought the wrong item, or the goods were damaged in transit, is charged nothing. Goods refused at
    the door go back to stock and the service's refusal restock percentage is kept from the refund, unless the refusal was because the goods arrived damaged or were not what was ordered. Handover is evidenced
    as the service's confirmation basis states, a signature is taken where the service requires one, and identity is checked where the order value reaches the service's figure. Goods lost on the way are
    met up to the service's liability figure and replaced at the price originally paid rather than today's price.
  eligibility:
  - id: attemptable_order_state
    applies_to:
    - orders_delivery_attempt
    - orders_fee_charge
    kind: state
    condition: A delivery attempt, and a fee arising from one, is recorded only while the order stands scheduled, out_for_delivery, fulfilled or returned_to_stock.
    evidence_fields:
    - purchase_orders.status
    - purchase_orders.purchase_order_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - purchase_orders.purchase_order_id
      action_bindings:
        purchase_orders.purchase_order_id: purchase_order_id
    state_contract:
      field: purchase_orders.status
      allowed:
      - scheduled
      - out_for_delivery
      - fulfilled
      - returned_to_stock
  params:
    per_tier:
      Standard Parcel Delivery:
        delivery_attempts_included: =delivery_attempts_included
        redelivery_fee_usd: =redelivery_fee_usd
        restock_fee_pct_on_refusal: =restock_fee_pct_on_refusal
        signature_required: =signature_required
        id_check_on_high_value_usd: =id_check_on_high_value_usd
        delivery_confirmation_methods: =delivery_confirmation_methods
        lost_in_transit_liability_usd: =lost_in_transit_liability_usd
        pickup_identification_required: =pickup_identification_required
      Store Pickup Hold:
        delivery_attempts_included: =delivery_attempts_included
        redelivery_fee_usd: =redelivery_fee_usd
        restock_fee_pct_on_refusal: =restock_fee_pct_on_refusal
        signature_required: =signature_required
