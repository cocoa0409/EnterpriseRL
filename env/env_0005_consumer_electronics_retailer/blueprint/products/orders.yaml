- id: orders_haul_away_and_site_work
  subject:
  - orders_haul_away_record
  rule: 'An old item is taken away only where the service includes or offers it, and only an item of the same kind as the one delivered: one refrigerator for one refrigerator, not a second appliance besides.
    The old item is disconnected first only where the service includes disconnection; where it does not, the customer has it disconnected before the crew arrives or the haul-away is not carried out. Water,
    waste and gas connections on the new item are made only where the service includes them, and a crew that finds the connection unsafe leaves the item in place and records the reason. Packaging is taken
    away with every delivery at no charge, and packaging alone is recorded as such rather than as a haul-away. Where nothing was taken although the customer asked for it, the haul-away charge is credited
    back on the same order line.'
