events:
- type: orders_order_place
  target: purchase_orders
  mutation: create
  meaning: A purchase order is placed for goods, with a fulfilment service chosen for it.
  grain: one row per order a customer places
  fields:
    customer_id: the buying customer
    variant_name: the fulfilment service chosen
    status: set to the entry state placed
    placed_date: the day the order was placed
    promised_date: the day the goods were promised
    item_category: department of the main item
    item_sku: stock number of the main item
    line_count: lines on the order
    order_total: total billed on the order
    delivery_postal_code: postal code the goods are going to
    pickup_store_code: store holding the goods for collection
    payment_method: how the order is being paid for
    haul_away_requested: whether the old item is to be taken away
    installation_requested: whether installation was bought
  triggers:
  - event: orders:orders_line_charge
    map:
      customer_id: customer_id
      charge_kind: merchandise_line
      item_sku: item_sku
      tier_at_event: variant_name
  - event: membership:membership_points_accrue
    map:
      customer_id: customer_id
      accrual_basis: store_purchase
- type: orders_stock_hold
  target: purchase_orders
  mutation:
    transition:
      from: placed
      to: awaiting_stock
  meaning: The item is not in stock, so the order waits for the next shipment.
  grain: one row per order; the day it went to backorder is written onto it
  fields:
    status: moved to awaiting_stock
    backorder_since_date: the day the order went to backorder
    promised_date: the day the goods are now promised
  triggers:
  - event: orders:orders_backorder_notice
    map:
      customer_id: customer_id
- type: orders_delivery_schedule
  target: purchase_orders
  mutation:
    transition:
    - from: placed
      to: scheduled
    - from: awaiting_stock
      to: scheduled
  meaning: A delivery or collection slot is set for the order.
  grain: one row per order; the booked slot is written onto it
  fields:
    status: moved to scheduled
    scheduled_date: the day the slot is booked for
    scheduled_window: the part of the day booked
    reschedule_count: times the slot has been moved so far
  triggers: []
- type: orders_dispatch
  target: purchase_orders
  mutation:
    transition:
      from: scheduled
      to: out_for_delivery
  meaning: The goods leave the warehouse or the store for the customer.
  grain: one row per order; the dispatch day is written onto it
  fields:
    status: moved to out_for_delivery
    dispatched_date: the day the goods left
    item_serial: serial number allocated to the item on this order
  triggers: []
- type: orders_order_fulfil
  target: purchase_orders
  mutation:
    transition:
      from: out_for_delivery
      to: fulfilled
  meaning: The goods are handed over to the customer and the order is complete.
  grain: one row per order; the handover day is written onto it
  fields:
    status: moved to fulfilled
    fulfilled_date: the day the goods were handed over
    haul_away_requested: whether an old item was taken away at handover
  triggers:
  - event: orders:orders_haul_away_record
    when:
      haul_away_requested: true
    map:
      customer_id: customer_id
- type: orders_order_cancel
  target: purchase_orders
  mutation:
    transition:
    - from: placed
      to: cancelled
    - from: awaiting_stock
      to: cancelled
    - from: scheduled
      to: cancelled
    - from: out_for_delivery
      to: cancelled
  meaning: The order is cancelled before the goods are handed over.
  grain: one row per order; the cancellation day is written onto it
  fields:
    status: moved to cancelled
    cancelled_date: the day the order was cancelled
  triggers:
  - event: orders:orders_credit_apply
    map:
      customer_id: customer_id
      credit_kind: cancellation_reversal
- type: orders_return_to_stock
  target: purchase_orders
  mutation:
    transition:
    - from: out_for_delivery
      to: returned_to_stock
    - from: scheduled
      to: returned_to_stock
  meaning: The goods come back to the retailer because the customer refused them at the door or could not be reached.
  grain: one row per order; the goods return to stock and the order is closed
  fields:
    status: moved to returned_to_stock
    cancelled_date: the day the goods went back to stock
  triggers:
  - event: orders:orders_fee_charge
    map:
      customer_id: customer_id
      charge_kind: restock_fee
- type: orders_order_update
  target: purchase_orders
  mutation: update
  meaning: 'The order is amended: the address, the slot, the haul-away or the installation is changed.'
  grain: one row per order; each amendment overwrites the details it touches
  fields:
    delivery_postal_code: postal code the goods are now going to
    scheduled_date: the day the slot now stands for
    scheduled_window: the part of the day it now stands in
    reschedule_count: times the slot has now been moved
    haul_away_requested: whether an old item is now to be taken away
    installation_requested: whether installation is now bought
    order_total: total as it now stands
  triggers: []
- type: orders_line_charge
  target: order_events
  meaning: A merchandise line, the tax on it, or a delivery, installation, haul-away or recycling charge is billed on the order.
  grain: one row per charge of one kind on one order line
  distinguish_by:
  - charge_kind
  - order_line_reference
  fields:
    charge_amount: the amount billed
    charge_kind: which kind of charge this is
    order_line_reference: the order line the charge belongs to
    item_sku: stock number of the item
    unit_price: the shelf price the line was sold at
    quantity: units on the line
    event_date: the day the charge was booked
    tier_at_event: the fulfilment service the charge was billed under
    customer_id: the customer billed
  account: order_receivable
  direction: in
  triggers: []
- type: orders_fee_charge
  target: order_events
  meaning: A reschedule, redelivery, storage, restock or pallet fee is billed on the order.
  grain: one row per fee of one kind billed on one order
  distinguish_by:
  - charge_kind
  - event_date
  fields:
    charge_amount: the amount billed
    charge_kind: which fee this is
    order_line_reference: the order line the fee belongs to
    event_date: the day the fee was booked
    channel: the channel the fee arose through
    tier_at_event: the fulfilment service the fee was billed under
    customer_id: the customer billed
  account: order_receivable
  direction: in
  triggers: []
- type: orders_payment_capture
  target: order_events
  meaning: Money is taken from the customer for the order, as a deposit, in full, or on the invoice.
  grain: one row per amount taken on one order
  distinguish_by:
  - payment_method
  - event_date
  fields:
    payment_amount: the amount taken
    payment_method: how it was taken
    event_date: the day it was taken
    channel: the channel the payment came through
    order_line_reference: the order line the payment was applied to
    customer_id: the paying customer
  account: order_receivable
  direction: out
  triggers: []
- type: orders_credit_apply
  target: order_events
  meaning: 'An amount is credited back on the order: a price match, a promotional discount, a goodwill credit, a cancellation reversal, a late delivery credit or a damage allowance.'
  grain: one row per credit of one kind on one order line
  distinguish_by:
  - credit_kind
  - order_line_reference
  - event_date
  fields:
    credit_amount: the amount credited
    credit_kind: why it was credited
    order_line_reference: the order line credited
    competitor_name: the competitor matched, on a price match
    matched_price: the price the competitor was advertising
    event_date: the day the credit was applied
    channel: the channel the credit was applied through
    tier_at_event: the fulfilment service the credit was applied under
    customer_id: the credited customer
  account: order_receivable
  direction: out
  triggers: []
- type: orders_backorder_notice
  target: order_events
  meaning: The customer is told the item is out of stock and when it is expected.
  grain: one row per notice given on one order
  distinguish_by:
  - expected_stock_date
  - event_date
  fields:
    expected_stock_date: the day the item is expected back in stock
    item_sku: stock number of the item awaited
    event_date: the day the notice was given
    channel: how the customer was told
    customer_id: the customer told
  triggers: []
- type: orders_delivery_attempt
  target: order_events
  meaning: An attempt to hand the goods over is recorded, whether it succeeded or not.
  grain: one row per attempt at one delivery on one order
  distinguish_by:
  - attempt_number
  - event_date
  fields:
    attempt_outcome: how the attempt ended
    attempt_number: which attempt this was
    event_date: the day of the attempt
    item_sku: stock number of the item brought
    tier_at_event: the fulfilment service the attempt was made under
    customer_id: the customer attended
  triggers:
  - event: orders:orders_fee_charge
    when:
      attempt_outcome:
      - nobody_home
      - access_blocked
    map:
      customer_id: customer_id
      charge_kind: redelivery_fee
- type: orders_haul_away_record
  target: order_events
  meaning: The old item taken away at delivery is recorded, with what was taken.
  grain: one row per haul-away carried out on one order
  distinguish_by:
  - haul_away_item_description
  - event_date
  fields:
    haul_away_item_description: what was taken away
    event_date: the day it was taken away
    item_sku: stock number of the item delivered in its place
    customer_id: the customer the item was taken from
  triggers: []
measures:
- id: orders_msr_open_order_value
  window: the moment of handling, with no historical window
  measure: sum of order_total over purchase_orders of the profile standing placed, awaiting_stock, scheduled or out_for_delivery
policies:
- id: orders_agg_multi_holding
  subject:
  - orders_order_place
  rule: A customer may have as many orders open as they care to place, and the number on one profile is not limited. A second order is never raised for the same order line reference while one stands in
    placed, awaiting_stock, scheduled or out_for_delivery. Lines needing different fulfilment services are placed as separate orders, because the service is a property of the order rather than of the line.
    A business profile's orders are raised against its named buyers and are all counted to the one profile.
  eligibility:
  - id: no_duplicate_order_line
    applies_to:
    - orders_order_place
    kind: dedup
    condition: A second order is never raised for the same order line reference while one stands in placed, awaiting_stock, scheduled or out_for_delivery.
    evidence_fields:
    - purchase_orders.item_sku
    - purchase_orders.status
    - purchase_orders.customer_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - purchase_orders.customer_id
      action_bindings:
        purchase_orders.customer_id: customer_id
    dedup_contract:
      table: purchase_orders
      mode: separate_record
      object_bindings:
        customer_id: customer_id
        item_sku: item_sku
      duplicate_filters:
        status:
        - placed
        - awaiting_stock
        - scheduled
        - out_for_delivery
      distinct_fields:
      - placed_date
      - order_total
  params:
    max_per_customer: null
- id: orders_agg_open_value
  subject:
  - orders_order_place
  - orders_payment_capture
  rule: 'Open order value is read across the profile rather than order by order: the value of orders not yet handed over, read from orders_msr_open_order_value, governs how much may be taken on deposit
    and whether a further large order is accepted without payment cleared. Where the profile pays on a financing account the open value is set against the room left on that account, and an order beyond
    the room is held until the customer pays another way. A business profile on invoice terms has its open value set against its net terms, and an overdue invoice stops further orders being accepted on
    invoice. Orders awaiting stock count toward open value at their full amount, because the price is held. Cancelled orders and orders returned to stock drop out of the count on the day they close.'
  eligibility: []
  params:
    per_tier:
      Standard Parcel Delivery:
        payment_capture_basis: =payment_capture_basis
        deposit_pct_on_placement: =deposit_pct_on_placement
        payment_methods_allowed: =payment_methods_allowed
      Store Pickup Hold:
        payment_capture_basis: =payment_capture_basis
        deposit_pct_on_placement: =deposit_pct_on_placement
        payment_methods_allowed: =payment_methods_allowed
      Threshold Delivery:
        payment_capture_basis: =payment_capture_basis
        deposit_pct_on_placement: =deposit_pct_on_placement
        payment_methods_allowed: =payment_methods_allowed
      Room of Choice Delivery with Haul Away:
        payment_capture_basis: =payment_capture_basis
        deposit_pct_on_placement: =deposit_pct_on_placement
        payment_methods_allowed: =payment_methods_allowed
      White Glove Delivery and Installation:
        payment_capture_basis: =payment_capture_basis
        deposit_pct_on_placement: =deposit_pct_on_placement
        payment_methods_allowed: =payment_methods_allowed
      Business Dock and Freight Delivery:
        payment_capture_basis: =payment_capture_basis
        deposit_pct_on_placement: =deposit_pct_on_placement
        payment_methods_allowed: =payment_methods_allowed
  measures:
  - orders_msr_open_order_value
- id: orders_fulfilment_scheduling
  subject:
  - orders_delivery_schedule
  - orders_order_update
  - orders_dispatch
  rule: A slot is set, or an order amended, only against a change request standing as confirmed by the customer for that order. An order may not be amended later than the service's amendment cutoff hours
    before the slot it stands on. Cutoff hours are counted as elapsed hours back from the start of the booked window, and a cutoff that falls outside trading hours is not moved. A slot is offered no earlier
    than the service's least lead days and ordinarily no later than its longest, in one of the windows the service offers, and a dock slot needs the service's booking notice. The customer is told what the
    service's access requirements are before the slot is set, and a delivery beyond the service's radius carries the service's out of radius surcharge. Stairs above the first flight carry the service's
    surcharge for each further flight, and a crew of two attends where the service requires it. A slot may be moved as often as the service's allowance permits with its notice hours given; beyond that the
    service's reschedule fee is billed, and a move the retailer makes is billed nothing. An address change to a different delivery radius is a fresh quotation rather than an amendment, and the order is
    re-priced before the new slot is set.
  eligibility:
  - id: customer_confirmed_change
    applies_to:
    - orders_order_update
    kind: authorization
    condition: A slot is set, or an order amended, only against a change request standing as confirmed by the customer for that order.
    evidence_fields:
    - order_change_requests.customer_confirmation
    - order_change_requests.purchase_order_id
    - order_change_requests.request_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - order_change_requests.purchase_order_id
      action_bindings:
        order_change_requests.purchase_order_id: purchase_order_id
  - id: amendment_before_cutoff
    applies_to:
    - orders_order_update
    kind: time
    condition: An order may not be amended later than the service's amendment cutoff hours before the slot it stands on.
    evidence_fields:
    - purchase_orders.scheduled_date
    - purchase_orders.purchase_order_id
    - purchase_orders.reschedule_count
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - purchase_orders.purchase_order_id
      action_bindings:
        purchase_orders.purchase_order_id: purchase_order_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the slot it stands on
      anchor_source: purchase_orders.scheduled_date
      relation: not_after
      duration_source: params.order_amendment_cutoff_hours
      unit: elapsed_hours
      counting_rule: Cutoff hours are counted as elapsed hours back from the start of the booked window, and a cutoff that falls outside trading hours is not moved.
      boundary: exclusive
