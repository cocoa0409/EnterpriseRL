category: orders
display_name: Northbeam Purchase Orders and Fulfilment
binding:
  holding_table: purchase_orders
  event_tables:
  - order_events
  intake_tables:
  - order_change_requests
  status_field: status
  variant_field: variant_name
  quantity_fields:
    balance_outstanding: order_receivable
lifecycle:
  states:
  - placed
  - awaiting_stock
  - scheduled
  - out_for_delivery
  - fulfilled
  - cancelled
  - returned_to_stock
  transitions:
  - from: placed
    to: awaiting_stock
    by: system
    means: the item was not in stock and the order waits for a shipment
  - from: placed
    to: scheduled
    by: agent
    means: a delivery or collection slot was set
  - from: awaiting_stock
    to: scheduled
    by: agent
    means: the stock arrived and a slot was set
  - from: scheduled
    to: out_for_delivery
    by: agent
    means: the goods left for the customer
  - from: out_for_delivery
    to: fulfilled
    by: agent
    means: the goods were handed over
  - from: out_for_delivery
    to: returned_to_stock
    by: agent
    means: the goods were refused at the door or nobody could be reached
  - from: scheduled
    to: returned_to_stock
    by: agent
    means: collection goods were not picked up and went back to stock
  - from: placed
    to: cancelled
    by: user
    means: the customer cancelled before a slot was set
  - from: awaiting_stock
    to: cancelled
    by: user
    means: the customer cancelled while the order waited for stock
  - from: scheduled
    to: cancelled
    by: user
    means: the customer cancelled a booked delivery
  - from: out_for_delivery
    to: cancelled
    by: agent
    means: the retailer stopped the delivery because it could not be completed
accounts:
- key: order_receivable
  unit: USD
  meaning: amounts billed on the order and not yet settled; an in delta bills a line or a fee and an out delta records money taken or credited back
parameter_schema:
  delivery_fee_bands_usd: Delivery charge at each order value band, as a mapping of band to amount, USD.
  free_delivery_threshold_usd: Order value at or above which delivery is free, USD.
  delivery_lead_days_min: Least days from the order to the earliest slot offered.
  delivery_lead_days_max: Days from the order to the latest slot ordinarily offered.
  delivery_windows_offered: Slots the customer may choose from (string).
  delivery_radius_miles: Miles from the fulfilment point served without a surcharge.
  out_of_radius_fee_usd: Surcharge for delivering beyond the served radius, USD.
  installation_fee_usd: Charge for installing the goods where installation is bought, USD.
  installation_included: Whether installation is part of the fulfilment service.
  haul_away_fee_usd: Charge to take the old item away, USD.
  haul_away_included: Whether taking the old item away is part of the service.
  haul_away_units_included: Old items taken away at no charge on one delivery.
  recycling_fee_usd: Statutory recycling charge collected on the goods, USD.
  pickup_hold_days: Days the goods are held in store for collection.
  pickup_storage_fee_usd_per_day: Charge for each day the goods are held beyond the hold days, USD.
  pickup_identification_required: Whether photographic identity is checked at collection.
  delivery_attempts_included: Attempts made at no further charge.
  redelivery_fee_usd: Charge for an attempt beyond those included, USD.
  reschedule_limit: Times the slot may be moved at the customer's request before a fee applies.
  reschedule_fee_usd: Charge to move the slot beyond the allowance, USD.
  reschedule_notice_hours: Hours of notice needed to move the slot without a charge.
  cancellation_notice_hours: Hours of notice needed to cancel without a charge.
  cancellation_fee_usd: Charge for cancelling inside the notice period, USD.
  restock_fee_pct_on_refusal: Charge for goods refused at the door, as a percentage of the line, percent.
  payment_capture_basis: When the money is taken (string).
  deposit_pct_on_placement: Deposit taken when the order is placed, percent of the order total.
  payment_methods_allowed: Ways the order may be paid for (string).
  price_match_window_days: Days after the order within which a lower advertised price is matched.
  price_match_sources: Where a competing price is accepted from (string).
  price_match_excluded_events: Sales the price match does not apply to (string).
  late_delivery_credit_usd: Credit paid when the goods miss the promised day, USD.
  late_delivery_grace_days: Days past the promised day before the late credit is paid.
  backorder_notice_days: Days within which the customer is told the item has gone to backorder.
  backorder_max_days: Days an order may sit awaiting stock before the customer may cancel without charge.
  backorder_price_hold: Whether the price is held while the item is on backorder.
  partial_shipment_allowed: Whether lines in stock are sent before the rest.
  substitution_allowed: Whether a like model may be sent where the item is discontinued.
  damage_claim_window_days: Days after delivery within which transit damage must be reported.
  damage_allowance_pct: Allowance offered for cosmetic transit damage the customer accepts, percent of the line.
  signature_required: Whether a signature is taken at handover.
  id_check_on_high_value_usd: Order value at or above which identity is checked at handover, USD.
  two_person_crew_required: Whether two people attend the delivery.
  stairs_surcharge_usd_per_flight: Charge for each flight of stairs above the first, USD.
  site_access_requirements: What must be clear for the crew to deliver (string).
  appliance_connection_included: Whether water, waste or gas connections are made at delivery.
  old_item_disconnection_included: Whether the old item is disconnected before it is taken away.
  delivery_confirmation_methods: How the handover is evidenced (string).
  lost_in_transit_liability_usd: Most the retailer meets for goods lost on the way, USD.
  business_purchase_order_required: Whether a purchase order number must be quoted on the order.
  business_dock_booking_lead_days: Days of notice needed to book a dock slot.
  freight_pallet_fee_usd: Charge for each pallet moved on a freight delivery, USD.
  order_amendment_cutoff_hours: Hours before the slot after which the order may no longer be amended.
  member_free_delivery_applies: Whether the Circle tier's free delivery threshold replaces the service's own.
