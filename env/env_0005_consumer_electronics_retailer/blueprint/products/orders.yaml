- id: orders_price_and_service_credits
  subject:
  - orders_credit_apply
  rule: A lower advertised price is matched only within the service's price match window, counted from the day the order was placed. The price match window is counted in calendar days from the day the order
    was placed, which counts as day zero. The price is matched only against a source the service accepts, for the identical model in stock and available to buy from that seller, and never against the sales
    the service excludes. Where the goods miss the promised day by more than the service's grace days the service's late delivery credit is paid, once per order rather than once per day. Cosmetic transit
    damage the customer chooses to accept is met with the service's damage allowance percentage of the line, and damage they do not accept is a refusal instead. A goodwill credit is granted for the inconvenience
    the retailer caused, is recorded as goodwill, and does not become a standing entitlement. Credits are applied to the order line they arise on, and several credits on one line are added together up to
    the value of the line and never beyond it.
  eligibility:
  - id: price_match_window_open
    applies_to:
    - orders_credit_apply
    kind: time
    condition: A lower advertised price is matched only within the service's price match window, counted from the day the order was placed.
    evidence_fields:
    - purchase_orders.placed_date
    - purchase_orders.purchase_order_id
    - purchase_orders.order_total
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - purchase_orders.purchase_order_id
      action_bindings:
        purchase_orders.purchase_order_id: purchase_order_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the day the order was placed
      anchor_source: purchase_orders.placed_date
      relation: not_after
      duration_source: params.price_match_window_days
      unit: calendar_days
      counting_rule: The price match window is counted in calendar days from the day the order was placed, which counts as day zero.
      boundary: inclusive
  params:
    per_tier:
      Standard Parcel Delivery:
        price_match_window_days: =price_match_window_days
        price_match_sources: =price_match_sources
        price_match_excluded_events: =price_match_excluded_events
        late_delivery_credit_usd: =late_delivery_credit_usd
        late_delivery_grace_days: =late_delivery_grace_days
        damage_claim_window_days: =damage_claim_window_days
        damage_allowance_pct: =damage_allowance_pct
