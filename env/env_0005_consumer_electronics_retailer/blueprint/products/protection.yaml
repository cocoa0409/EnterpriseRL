events:
- type: protection_plan_purchase
  target: protection_plans
  mutation: create
  meaning: A ShieldCare plan is sold against one identified item the customer has bought.
  grain: one row per plan sold on one covered item
  fields:
    customer_id: the customer buying the plan
    variant_name: the plan sold, as the official full plan name
    status: set to the entry state application_received
    purchased_date: the day the plan was sold
    covered_item_serial: serial number of the item to be covered
    covered_item_category: department the covered item belongs to
    covered_item_purchase_price: price the item was bought for
    covered_item_purchase_date: day the item itself was bought
    source_order_reference: order the item was bought on
    plan_term_months: length of the term sold
    premium_plan: how the premium is to be collected
    transferable_flag: whether the plan may move with the item
    service_provider_preference: where the customer asked work to be carried out
  triggers:
  - event: protection:protection_premium_charge
    map:
      customer_id: customer_id
      premium_kind: premium_plan
      tier_at_event: variant_name
      covered_item_serial: covered_item_serial
- type: protection_plan_activate
  target: protection_plans
  mutation:
    transition:
      from: application_received
      to: active
  meaning: The plan is activated once the first premium has cleared, and the coverage window is written onto it.
  grain: one row per plan; activation writes the coverage window
  fields:
    status: moved to active
    activation_date: the day the plan was activated
    coverage_start_date: first day the plan will pay, after any waiting period
    coverage_end_date: last day the plan will pay
  triggers:
  - event: protection:protection_coverage_grant
    map:
      customer_id: customer_id
      period_start: coverage_start_date
      period_end: coverage_end_date
- type: protection_plan_transfer
  target: protection_plans
  mutation: update
  meaning: The plan is moved to a new owner with the item, or the covered item record is corrected to the serial actually held.
  grain: one row per plan; each transfer or correction overwrites the owner and item details
  fields:
    customer_id: the customer the plan now belongs to
    covered_item_serial: serial number now recorded as covered
    transferable_flag: whether the plan may be transferred again
    service_provider_preference: where the new owner asked work to be carried out
  triggers:
  - event: protection:protection_premium_charge
    map:
      premium_kind: transfer_fee
      customer_id: customer_id
      covered_item_serial: covered_item_serial
- type: protection_claim_hold_start
  target: protection_plans
  mutation:
    transition:
      from: active
      to: claim_hold
  meaning: A filed claim goes under review and the plan is held so no second claim is worked at the same time.
  grain: one row per plan; the hold is recorded on the plan itself
  fields:
    status: moved to claim_hold
    claims_filed_count: claims filed against the plan so far
  triggers: []
- type: protection_claim_hold_release
  target: protection_plans
  mutation:
    transition:
      from: claim_hold
      to: active
  meaning: The review closes and the plan returns to ordinary coverage.
  grain: one row per plan; the release is recorded on the plan itself
  fields:
    status: moved back to active
    repair_attempts_count: repairs authorised on the covered item so far
  triggers: []
- type: protection_plan_expire
  target: protection_plans
  mutation:
    transition:
    - from: active
      to: expired
    - from: claim_hold
      to: expired
  meaning: The coverage term runs out and the plan stops paying.
  grain: one row per plan; the expiry is recorded on the plan itself
  fields:
    status: moved to expired
    coverage_remaining: coverage left unused at expiry
  triggers: []
- type: protection_plan_cancel
  target: protection_plans
  mutation:
    transition:
    - from: active
      to: cancelled
    - from: claim_hold
      to: cancelled
  meaning: The customer ends the plan and any premium refund is settled.
  grain: one row per plan; the cancellation day is recorded on the plan itself
  fields:
    status: moved to cancelled
    cancelled_date: the day the cancellation took effect
  triggers:
  - event: protection:protection_premium_refund
    map:
      customer_id: customer_id
      premium_kind: single_payment
- type: protection_plan_terminate_nonpayment
  target: protection_plans
  mutation:
    transition:
      from: active
      to: cancelled
  meaning: An unpaid instalment ran past grace and the retailer ends the plan for non-payment.
  grain: one row per plan; the termination day is recorded on the plan itself
  fields:
    status: moved to cancelled
    cancelled_date: the day the termination took effect
    premium_outstanding: premium still owed at termination
  triggers: []
- type: protection_plan_void
  target: protection_plans
  mutation:
    transition:
    - from: application_received
      to: void
    - from: active
      to: void
  meaning: The plan is declared void because the item was never eligible or the sale rested on a misstatement.
  grain: one row per plan; the void day is recorded on the plan itself
  fields:
    status: moved to void
    void_date: the day the plan was declared void
    coverage_remaining: set to nothing, since a void plan never had coverage
  triggers:
  - event: protection:protection_premium_refund
    map:
      customer_id: customer_id
      premium_kind: administration_fee
- type: protection_coverage_grant
  target: protection_events
  meaning: The coverage limit of the plan is credited to the plan when the term opens.
  grain: one row per coverage term opened on one plan
  distinguish_by:
  - period_start
  - period_end
  fields:
    coverage_amount: coverage credited
    period_start: first day of the coverage term
    period_end: last day of the coverage term
    event_date: the day the coverage was credited
    tier_at_event: the plan the coverage was credited under
    customer_id: the covered customer
  account: coverage_pool
  direction: in
  triggers: []
- type: protection_coverage_reinstate
  target: protection_events
  meaning: On the plans that reinstate, the coverage limit is put back at the coverage anniversary.
  grain: one row per coverage year reinstated on one plan
  distinguish_by:
  - reinstatement_cycle_year
  fields:
    coverage_amount: coverage put back
    reinstatement_cycle_year: the coverage year reinstated
    event_date: the day the reinstatement was booked
    tier_at_event: the plan the reinstatement was booked under
    customer_id: the covered customer
  account: coverage_pool
  direction: in
  triggers: []
- type: protection_premium_charge
  target: protection_events
  meaning: A premium, an instalment, a late fee, a transfer fee or an administration fee is billed on the plan.
  grain: one row per amount billed for one premium period on one plan
  distinguish_by:
  - premium_kind
  - period_start
  - channel
  fields:
    premium_amount: the amount billed
    premium_kind: which kind of premium or fee this is
    period_start: first day of the period billed
    period_end: last day of the period billed
    event_date: the day the charge was booked
    channel: the channel the charge arose through
    tier_at_event: the plan the charge was booked under
    covered_item_serial: serial of the item the plan covers
    customer_id: the customer billed
  account: premium_receivable
  direction: in
  triggers: []
- type: protection_premium_payment
  target: protection_events
  meaning: The customer settles a billed premium or fee.
  grain: one row per payment received against one premium period on one plan
  distinguish_by:
  - period_start
  - payment_method
  - event_date
  fields:
    premium_amount: the amount received
    payment_method: how the customer paid
    period_start: first day of the period the payment was applied to
    event_date: the day the payment was received
    channel: the channel the payment came through
    customer_id: the customer who paid
  account: premium_receivable
  direction: out
  triggers: []
- type: protection_premium_refund
  target: protection_events
  meaning: Premium already paid is returned on a free-look cancellation, a pro rata cancellation or a void plan.
  grain: one row per refund settled on one plan
  distinguish_by:
  - premium_kind
  - event_date
  - payment_method
  fields:
    premium_amount: the amount returned
    premium_kind: which premium the refund is against
    payment_method: how the refund was returned
    event_date: the day the refund was settled
    period_start: first day of the unused period being refunded
    period_end: last day of the unused period being refunded
    customer_id: the customer refunded
  account: premium_receivable
  direction: out
  triggers: []
- type: protection_claim_file
  target: protection_events
  meaning: The customer reports a failure or damage on the covered item and a claim is opened.
  grain: one row per claim reference opened on one plan
  distinguish_by:
  - claim_reference
  fields:
    claim_reference: the claim reference issued
    claim_type: the peril reported
    incident_date: the day the failure or damage happened
    report_date: the day the customer reported it
    event_date: the day the claim was opened
    channel: the channel the claim was reported through
    covered_item_serial: serial of the item the claim concerns
    customer_id: the claiming customer
  triggers:
  - event: protection:protection_claim_hold_start
    map:
      status: claim_hold
- type: protection_claim_decision
  target: protection_events
  meaning: The claim is adjudicated and the outcome and the basis of settlement are recorded.
  grain: one row per decision recorded on one claim reference
  distinguish_by:
  - claim_reference
  - claim_decision
  - event_date
  fields:
    claim_reference: the claim being decided
    claim_decision: the outcome recorded
    settlement_basis: how an approved claim is to be settled
    service_provider: who is to carry out the work
    repair_authorization_number: authorisation number issued to the repairer
    event_date: the day the decision was recorded
    covered_item_serial: serial of the item decided on
    customer_id: the claiming customer
  triggers:
  - event: protection:protection_claim_payout
    when:
      claim_decision:
      - approved_repair
      - approved_replacement
      - approved_reimbursement
    map:
      claim_reference: claim_reference
      settlement_basis: settlement_basis
      customer_id: customer_id
      covered_item_serial: covered_item_serial
  - event: protection:protection_deductible_charge
    when:
      claim_decision:
      - approved_replacement
      - approved_reimbursement
    map:
      claim_reference: claim_reference
      customer_id: customer_id
- type: protection_claim_payout
  target: protection_events
  meaning: The plan pays the approved amount for the claim, as repair cost, replacement cost or cash reimbursement.
  grain: one row per amount paid on one claim reference
  distinguish_by:
  - claim_reference
  - settlement_basis
  - event_date
  fields:
    claim_reference: the claim paid
    payout_amount: the amount paid
    settlement_basis: the form the settlement took
    payment_method: how the payout was made
    service_provider: who carried out the work
    event_date: the day the payout was booked
    covered_item_serial: serial of the item paid on
    customer_id: the paid customer
  account: coverage_pool
  direction: out
  triggers: []
- type: protection_deductible_charge
  target: protection_events
  meaning: The claim deductible is billed to the customer.
  grain: one row per deductible billed on one claim reference
  distinguish_by:
  - claim_reference
  - event_date
  fields:
    claim_reference: the claim the deductible belongs to
    deductible_amount: the amount billed
    event_date: the day the deductible was billed
    tier_at_event: the plan the deductible was billed under
    customer_id: the customer billed
  account: deductible_receivable
  direction: in
  triggers: []
- type: protection_deductible_payment
  target: protection_events
  meaning: The customer settles a billed claim deductible.
  grain: one row per payment received against one claim deductible
  distinguish_by:
  - claim_reference
  - payment_method
  - event_date
  fields:
    claim_reference: the claim the payment belongs to
    deductible_amount: the amount received
    payment_method: how the customer paid
    event_date: the day the payment was received
    channel: the channel the payment came through
    customer_id: the customer who paid
  account: deductible_receivable
  direction: out
  triggers: []
measures:
- id: protection_msr_payouts_12m
  window: the rolling twelve calendar months ending on the handling date
  measure: sum of payout_amount over protection_claim_payout rows on every plan the customer holds, whatever the plan status
- id: protection_msr_claims_filed_term
  window: the plan's coverage term, from coverage_start_date to coverage_end_date inclusive
  measure: count of protection_claim_file rows on the plan
- id: protection_msr_repair_attempts_item
  window: the whole life of the covered item, from its purchase day to the handling date
  measure: count of protection_claim_decision rows carrying settlement_basis repair on the same covered_item_serial
policies:
- id: protection_agg_multi_holding
  subject:
  - protection_plan_purchase
  rule: A customer may hold as many ShieldCare plans as they have items to cover, and the number of plans on one profile is not limited. A second plan is never opened on an item whose serial already carries
    a plan standing in application_received, active or claim_hold. Where the customer wants better cover on an item already covered, the plan on file is cancelled under the cancellation rules and the new
    plan is sold afresh; the two are never run side by side. A business fleet plan carries several serials on one plan record up to its item slots, and each serial still counts as covered only once.
  eligibility:
  - id: one_live_plan_per_serial
    applies_to:
    - protection_plan_purchase
    kind: dedup
    condition: A second plan is never opened on an item whose serial already carries a plan standing in application_received, active or claim_hold.
    evidence_fields:
    - protection_plans.covered_item_serial
    - protection_plans.status
    - protection_plans.customer_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - protection_plans.covered_item_serial
      action_bindings:
        protection_plans.covered_item_serial: covered_item_serial
    dedup_contract:
      table: protection_plans
      mode: separate_record
      object_bindings:
        covered_item_serial: covered_item_serial
      duplicate_filters:
        status:
        - application_received
        - active
        - claim_hold
      distinct_fields:
      - purchased_date
      - variant_name
  params:
    max_per_customer: null
- id: protection_plan_admission
  subject:
  - protection_plan_purchase
  - protection_plan_activate
  - protection_plan_void
  rule: 'A plan is sold only on an item whose recorded purchase price falls inside the plan''s price band and whose department is one the plan covers. A plan is added to an item already owned only when
    the day the item was bought is no further back than the plan''s item age limit. The item age limit is counted in calendar days from the item purchase day, which counts as day zero, and a plan sold on
    the same receipt as the item always meets it. The business fleet plan is sold only on a profile recorded as a business, and commercial use of an item covered by a consumer plan is outside cover rather
    than a reason to void. A plan is activated when the single premium has cleared, or when the first instalment has cleared on an instalment plan, and the coverage window then runs from what the plan''s
    coverage start basis names for the term of months sold. Where the item turns out never to have been eligible, or the serial given at the sale belongs to no purchase on file, the plan is declared void,
    every premium taken is returned less nothing, and no claim is paid from it. A plan that is void was never in force: it is not a cancellation, and the customer keeps no free-look right to argue about.'
  eligibility:
  - id: item_inside_price_band
    applies_to:
    - protection_plan_purchase
    kind: authorization
    condition: A plan is sold only on an item whose recorded purchase price falls inside the plan's price band and whose department is one the plan covers.
    evidence_fields:
    - protection_plans.covered_item_purchase_price
    - protection_plans.covered_item_category
    - protection_plans.covered_item_serial
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - protection_plans.covered_item_serial
      action_bindings:
        protection_plans.covered_item_serial: covered_item_serial
  - id: item_age_inside_limit
    applies_to:
    - protection_plan_purchase
    kind: time
    condition: A plan is added to an item already owned only when the day the item was bought is no further back than the plan's item age limit.
    evidence_fields:
    - protection_plans.covered_item_purchase_date
    - protection_plans.covered_item_serial
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - protection_plans.covered_item_serial
      action_bindings:
        protection_plans.covered_item_serial: covered_item_serial
    temporal_basis:
      clock: frozen_time
      anchor_event: the day the item was bought
      anchor_source: protection_plans.covered_item_purchase_date
      relation: not_after
      duration_source: params.covered_item_age_limit_days
      unit: calendar_days
      counting_rule: The item age limit is counted in calendar days from the item purchase day, which counts as day zero, and a plan sold on the same receipt as the item always meets it.
      boundary: inclusive
  params:
    per_tier:
      ShieldCare Essential Parts and Labour:
        covered_item_price_band_usd: =covered_item_price_band_usd
        covered_item_age_limit_days: =covered_item_age_limit_days
        covered_item_categories: =covered_item_categories
        plan_term_months: =plan_term_months
        coverage_start_basis: =coverage_start_basis
        multi_item_plan_slots: =multi_item_plan_slots
      ShieldCare Accidental Damage Plus:
        covered_item_price_band_usd: =covered_item_price_band_usd
        covered_item_age_limit_days: =covered_item_age_limit_days
        covered_item_categories: =covered_item_categories
        plan_term_months: =plan_term_months
        coverage_start_basis: =coverage_start_basis
        multi_item_plan_slots: =multi_item_plan_slots
      ShieldCare Total Device Protection:
        covered_item_price_band_usd: =covered_item_price_band_usd
        covered_item_age_limit_days: =covered_item_age_limit_days
        covered_item_categories: =covered_item_categories
        plan_term_months: =plan_term_months
        coverage_start_basis: =coverage_start_basis
        multi_item_plan_slots: =multi_item_plan_slots
      ShieldCare Home Theatre Premium:
        covered_item_price_band_usd: =covered_item_price_band_usd
        covered_item_age_limit_days: =covered_item_age_limit_days
        covered_item_categories: =covered_item_categories
        plan_term_months: =plan_term_months
        coverage_start_basis: =coverage_start_basis
        multi_item_plan_slots: =multi_item_plan_slots
      ShieldCare Major Appliance Extended Service:
        covered_item_price_band_usd: =covered_item_price_band_usd
        covered_item_age_limit_days: =covered_item_age_limit_days
        covered_item_categories: =covered_item_categories
        plan_term_months: =plan_term_months
        coverage_start_basis: =coverage_start_basis
        multi_item_plan_slots: =multi_item_plan_slots
      ShieldCare Business Fleet Protection:
        covered_item_price_band_usd: =covered_item_price_band_usd
        covered_item_age_limit_days: =covered_item_age_limit_days
        covered_item_categories: =covered_item_categories
        plan_term_months: =plan_term_months
        coverage_start_basis: =coverage_start_basis
        multi_item_plan_slots: =multi_item_plan_slots
- id: protection_premium_billing
  subject:
  - protection_premium_charge
  - protection_premium_payment
  rule: The single premium is the plan's percentage of the covered item price, rounded to the cent, and is billed once on the day of sale; an instalment plan bills the monthly premium of the plan on the
    same day of each month, with a month-end day falling back to the last day of a shorter month. Premium is billed, and premium payments applied, only while the plan stands in application_received, active
    or claim_hold. A plan offered on single payment only may not be put on instalments afterwards, and a plan offered on instalments only may not be bought out in one payment. A payment is applied to the
    oldest unpaid premium period first; a surplus is held against the next period and never returned as cash while the plan is in force. Where the customer holds a Circle membership whose tier gives a plan
    discount and the plan applies the membership discount, the discount is taken off the premium before it is billed, not refunded afterwards.
  eligibility:
  - id: billable_plan_state
    applies_to:
    - protection_premium_charge
    - protection_premium_payment
    kind: state
    condition: Premium is billed, and premium payments applied, only while the plan stands in application_received, active or claim_hold.
    evidence_fields:
    - protection_plans.status
    - protection_plans.plan_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - protection_plans.plan_id
      action_bindings:
        protection_plans.plan_id: plan_id
    state_contract:
      field: protection_plans.status
      allowed:
      - application_received
      - active
      - claim_hold
  params:
    per_tier:
      ShieldCare Essential Parts and Labour:
        single_payment_premium_pct_of_price: =single_payment_premium_pct_of_price
        monthly_premium_usd: =monthly_premium_usd
        premium_payment_options: =premium_payment_options
        membership_discount_applies: =membership_discount_applies
      ShieldCare Accidental Damage Plus:
        single_payment_premium_pct_of_price: =single_payment_premium_pct_of_price
        monthly_premium_usd: =monthly_premium_usd
        premium_payment_options: =premium_payment_options
        membership_discount_applies: =membership_discount_applies
      ShieldCare Total Device Protection:
        single_payment_premium_pct_of_price: =single_payment_premium_pct_of_price
        monthly_premium_usd: =monthly_premium_usd
        premium_payment_options: =premium_payment_options
        membership_discount_applies: =membership_discount_applies
      ShieldCare Home Theatre Premium:
        single_payment_premium_pct_of_price: =single_payment_premium_pct_of_price
        monthly_premium_usd: =monthly_premium_usd
        premium_payment_options: =premium_payment_options
        membership_discount_applies: =membership_discount_applies
      ShieldCare Major Appliance Extended Service:
        single_payment_premium_pct_of_price: =single_payment_premium_pct_of_price
        monthly_premium_usd: =monthly_premium_usd
        premium_payment_options: =premium_payment_options
        membership_discount_applies: =membership_discount_applies
      ShieldCare Business Fleet Protection:
        single_payment_premium_pct_of_price: =single_payment_premium_pct_of_price
        monthly_premium_usd: =monthly_premium_usd
        premium_payment_options: =premium_payment_options
        membership_discount_applies: =membership_discount_applies
  formula:
    when: premium_kind == "single_payment"
    premium_amount: round(covered_item_purchase_price * single_payment_premium_pct_of_price / 100, 2)
- id: protection_premium_delinquency
  subject:
  - protection_plan_terminate_nonpayment
  rule: 'A plan is not terminated for non-payment before the plan''s premium grace days have run in full from the first day of the unpaid premium period. Premium grace days are counted as calendar days
    from the first day of the unpaid period, which counts as day zero, with no business-day adjustment. The plan''s late fee is billed once when grace runs out, and the premium already owed stays owed after
    termination. A claim whose incident day falls inside an unpaid period is not paid until that period is settled, and a claim whose incident day falls after termination is not paid at all. Where the customer
    settles everything outstanding on the day of termination or before it, the plan is left in force and the termination is not booked. A terminated plan is not reinstated: the customer is sold a fresh
    plan if the item still meets the admission rules.'
  eligibility:
  - id: premium_grace_run
    applies_to:
    - protection_plan_terminate_nonpayment
    kind: time
    condition: A plan is not terminated for non-payment before the plan's premium grace days have run in full from the first day of the unpaid premium period.
    evidence_fields:
    - protection_events.period_start
    - protection_plans.plan_id
    - protection_plans.premium_outstanding
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - protection_plans.plan_id
      action_bindings:
        protection_plans.plan_id: plan_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the first day of the unpaid premium period
      anchor_source: protection_events.period_start
      relation: not_before
      duration_source: params.premium_grace_days
      unit: calendar_days
      counting_rule: Premium grace days are counted as calendar days from the first day of the unpaid period, which counts as day zero, with no business-day adjustment.
      boundary: inclusive
  params:
    per_tier:
      ShieldCare Essential Parts and Labour:
        premium_grace_days: =premium_grace_days
        premium_late_fee_usd: =premium_late_fee_usd
      ShieldCare Accidental Damage Plus:
        premium_grace_days: =premium_grace_days
        premium_late_fee_usd: =premium_late_fee_usd
      ShieldCare Total Device Protection:
        premium_grace_days: =premium_grace_days
        premium_late_fee_usd: =premium_late_fee_usd
      ShieldCare Home Theatre Premium:
        premium_grace_days: =premium_grace_days
        premium_late_fee_usd: =premium_late_fee_usd
      ShieldCare Major Appliance Extended Service:
        premium_grace_days: =premium_grace_days
        premium_late_fee_usd: =premium_late_fee_usd
      ShieldCare Business Fleet Protection:
        premium_grace_days: =premium_grace_days
        premium_late_fee_usd: =premium_late_fee_usd
- id: protection_coverage_ledger
  subject:
  - protection_coverage_grant
  - protection_coverage_reinstate
  rule: 'The plan''s term coverage limit is credited once when the coverage window opens, and every payout is taken from that credited pool, so the coverage remaining on the plan is the credited coverage
    less the payouts booked. Coverage is credited only to a plan standing in application_received, active or claim_hold. On the plans that reinstate, the full term limit is credited again at each coverage
    anniversary and the unused remainder of the previous year is not carried forward; on the plans that do not reinstate, the term limit is credited once for the whole term. A reinstatement is booked once
    per coverage year, and a plan that expires, is cancelled or is terminated before an anniversary is not reinstated for that year. Coverage is never credited above the plan''s term limit by way of a correction:
    an over-payment is put right by reversing the payout that caused it.'
  eligibility:
  - id: creditable_plan_state
    applies_to:
    - protection_coverage_grant
    - protection_coverage_reinstate
    kind: state
    condition: Coverage is credited only to a plan standing in application_received, active or claim_hold.
    evidence_fields:
