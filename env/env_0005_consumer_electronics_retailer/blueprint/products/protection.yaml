- id: protection_plan_expiry
  subject:
  - protection_plan_expire
  rule: 'A plan expires at the end of its coverage end day, and coverage left unused is written off rather than refunded. A claim whose incident day falls on or before the coverage end day is paid after
    expiry provided it was reported inside the claim report window, and the plan is worked to a decision even though it has expired. An expired plan is not renewed in place; a fresh plan may be sold only
    where the item still meets the admission rules, and the item''s age is counted from its original purchase day. A plan whose term is cut short by cancellation or termination for non-payment does not
    expire as well: the earlier ending stands and only one ending is recorded. The coverage end day is not moved because the item was away for repair, and no credit is given for days the item could not
    be used.'
