- id: protection_plan_transfer_rules
  subject:
  - protection_plan_transfer
  rule: 'A plan moves to a new owner with the item only where the plan allows transfer and the plan is still standing active, and the transfer fee of the plan is billed to the party asking for the transfer.
    The coverage window, the coverage remaining, the claims already counted and the repairs already authorised all move with the plan; the new owner inherits the history rather than a fresh plan. A serial
    correction is not a transfer: where the serial recorded at the sale is wrong and the right serial belongs to the same purchase, the record is corrected with no fee and no change of owner. A plan on
    a fleet record is not transferred item by item; the whole record moves or none of it does. A plan that has been terminated for non-payment, cancelled or declared void does not transfer, and the item''s
    new owner is offered a fresh plan under the admission rules.'
  eligibility: []
  params:
    per_tier:
      ShieldCare Essential Parts and Labour:
        transfer_allowed: =transfer_allowed
        transfer_fee_usd: =transfer_fee_usd
        multi_item_plan_slots: =multi_item_plan_slots
      ShieldCare Accidental Damage Plus:
        transfer_allowed: =transfer_allowed
        transfer_fee_usd: =transfer_fee_usd
        multi_item_plan_slots: =multi_item_plan_slots
      ShieldCare Total Device Protection:
        transfer_allowed: =transfer_allowed
        transfer_fee_usd: =transfer_fee_usd
        multi_item_plan_slots: =multi_item_plan_slots
      ShieldCare Home Theatre Premium:
        transfer_allowed: =transfer_allowed
