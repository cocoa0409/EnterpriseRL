events:
- type: returns_rma_open
  target: return_authorizations
  mutation: create
  meaning: The customer asks to return one order line and a return authorisation is raised for it.
  grain: one row per order line the customer asks to return
  fields:
    customer_id: the returning customer
    variant_name: the return schedule the line falls under
    status: set to the entry state requested
    requested_date: the day the return was asked for
    source_order_reference: the order the item was bought on
    order_line_reference: the single order line being returned
    item_sku: stock number of the item
    item_serial: serial number of the item
    item_category: department the item belongs to
    purchase_date: the day the item was bought
    delivery_date: the day the item was delivered or collected
    purchase_price: price paid on the line
    quantity_returned: units being returned
    return_reason: the reason the customer gave
    return_method: how the item is to come back
    original_payment_method: how the item was paid for
    exchange_flag: whether an exchange was asked for
    inspection_grade: set to not_yet_graded until the item is inspected
  triggers:
  - event: returns:returns_shipping_label_issue
    when:
      return_method: prepaid_label
    map:
      customer_id: customer_id
      order_line_reference: order_line_reference
      tier_at_event: variant_name
- type: returns_rma_authorize
  target: return_authorizations
  mutation:
    transition:
      from: requested
      to: authorized
  meaning: The return is authorised and the customer is told how to bring the item back.
  grain: one row per authorisation; the authorised day and restock destination are written onto it
  fields:
    status: moved to authorized
    authorized_date: the day the return was authorised
    return_method: the way the item is to come back
    restock_location_code: where the item is to be restocked
  triggers:
  - event: returns:returns_shipping_label_issue
    when:
      return_method:
      - prepaid_label
      - carrier_pickup
    map:
      customer_id: customer_id
      order_line_reference: order_line_reference
- type: returns_rma_deny
  target: return_authorizations
  mutation:
    transition:
    - from: requested
      to: denied
    - from: inspected
      to: denied
  meaning: The return is refused, either at the request or after the item has been inspected.
  grain: one row per authorisation; the refusal day is written onto it
  fields:
    status: moved to denied
    denied_date: the day the return was refused
    inspection_grade: the grade the refusal rests on where the item was inspected
  triggers: []
- type: returns_rma_withdraw
  target: return_authorizations
  mutation:
    transition:
    - from: requested
      to: withdrawn
    - from: authorized
      to: withdrawn
  meaning: The customer calls the return off before the item has been received.
  grain: one row per authorisation; the withdrawal day is written onto it
  fields:
    status: moved to withdrawn
    withdrawn_date: the day the customer withdrew the return
  triggers: []
- type: returns_item_dispatch
  target: return_authorizations
  mutation:
    transition:
      from: authorized
      to: in_transit
  meaning: The customer hands the item to a carrier or to a collection crew.
  grain: one row per authorisation; the dispatch day is written onto it
  fields:
    status: moved to in_transit
    dispatched_date: the day the item was handed over
    return_method: the way the item was sent back
  triggers: []
- type: returns_item_receive
  target: return_authorizations
  mutation:
    transition:
    - from: authorized
      to: received
    - from: in_transit
      to: received
  meaning: The item arrives at the store or the returns centre and is booked in.
  grain: one row per authorisation; the receipt day is written onto it
  fields:
    status: moved to received
    received_date: the day the item was booked in
    restock_location_code: where the item was booked in
  triggers: []
- type: returns_inspection_complete
  target: return_authorizations
  mutation:
    transition:
      from: received
      to: inspected
  meaning: The inspection finishes and the grade is carried onto the authorisation.
  grain: one row per authorisation; the grade and the inspection day are written onto it
  fields:
    status: moved to inspected
    inspected_date: the day the inspection finished
    inspection_grade: the condition the item was graded at
  triggers:
  - event: returns:returns_restocking_fee_charge
    when:
      inspection_grade:
      - open_box_complete
      - open_box_incomplete
      - damaged_by_customer
    map:
      customer_id: customer_id
      inspection_grade: inspection_grade
  - event: returns:returns_refund_authorize
    map:
      customer_id: customer_id
      inspection_grade: inspection_grade
- type: returns_rma_settle
  target: return_authorizations
  mutation:
    transition:
      from: inspected
      to: settled
  meaning: The return is closed out, the refund or exchange having been settled with the customer.
  grain: one row per authorisation; the settlement day is written onto it
  fields:
    status: moved to settled
    settled_date: the day the return was settled
    refund_method: how the refund was paid
  triggers:
  - event: returns:returns_refund_disburse
    map:
      customer_id: customer_id
      refund_method: refund_method
- type: returns_inspection_grade_record
  target: return_events
  meaning: The condition of the returned item and anything missing from the box are recorded.
  grain: one row per inspection carried out on one authorisation
  distinguish_by:
  - inspection_grade
  - event_date
  fields:
    inspection_grade: the condition graded
    missing_accessories: what was missing from the box
    deduction_amount: amount to be taken off the refund for what is missing or damaged
    event_date: the day the inspection was carried out
    channel: where the inspection was carried out
    order_line_reference: the order line inspected
    customer_id: the returning customer
  triggers: []
- type: returns_restocking_fee_charge
  target: return_events
  meaning: A restocking fee is charged against the return.
  grain: one row per restocking fee charged on one authorisation
  distinguish_by:
  - settlement_component
  - event_date
  fields:
    restocking_fee_amount: the fee charged
    settlement_component: recorded as the restocking fee component
    inspection_grade: the grade the fee rests on
    event_date: the day the fee was charged
    tier_at_event: the return schedule the fee was charged under
    order_line_reference: the order line the fee belongs to
    customer_id: the customer charged
  account: restocking_fee_receivable
  direction: in
  triggers: []
- type: returns_restocking_fee_waive
  target: return_events
  meaning: A restocking fee already charged is waived, in whole or in part.
  grain: one row per waiver granted on one authorisation
  distinguish_by:
  - fee_waiver_reason
  - event_date
  fields:
    restocking_fee_amount: the fee waived
    fee_waiver_reason: why the fee was waived
    event_date: the day the waiver was granted
    channel: the channel the waiver was granted through
    order_line_reference: the order line the waiver belongs to
    customer_id: the customer relieved of the fee
  account: restocking_fee_receivable
  direction: out
  triggers: []
- type: returns_refund_authorize
  target: return_events
  meaning: The refund owed on one component of the original charge is worked out and authorised.
  grain: one row per component of the original charge authorised for refund on one authorisation
  distinguish_by:
  - settlement_component
  - event_date
  fields:
    refund_amount: the amount authorised
    settlement_component: which part of the original charge this refunds
    inspection_grade: the grade the amount was worked out from
    deduction_amount: amount taken off for what was missing or damaged
    event_date: the day the refund was authorised
    tier_at_event: the return schedule the refund was worked out under
    order_line_reference: the order line refunded
    customer_id: the refunded customer
  account: refund_payable
  direction: in
  triggers: []
- type: returns_refund_disburse
  target: return_events
  meaning: Authorised refund money leaves the retailer to the customer.
  grain: one row per payment made to the customer on one authorisation
  distinguish_by:
  - refund_method
  - event_date
  fields:
    refund_amount: the amount paid
    refund_method: how it was paid
    event_date: the day it was paid
    channel: the channel the payment went out through
    order_line_reference: the order line paid against
    customer_id: the paid customer
  account: refund_payable
  direction: out
  triggers:
  - event: credit:credit_store_credit_post
    when:
      refund_method: store_credit
    map:
      customer_id: customer_id
      post_reason: merchandise_return
- type: returns_refund_offset
  target: return_events
  meaning: Part of the authorised refund is kept back to settle a fee or an amount the customer owes.
  grain: one row per offset applied on one authorisation
  distinguish_by:
  - settlement_component
  - event_date
  fields:
    refund_amount: the amount kept back
    settlement_component: what the amount was kept back for
    event_date: the day the offset was applied
    order_line_reference: the order line the offset belongs to
    customer_id: the customer whose refund was reduced
  account: refund_payable
  direction: out
  triggers: []
- type: returns_exchange_issue
  target: return_events
  meaning: An exchange item is issued to the customer in place of a refund.
  grain: one row per exchange item issued on one authorisation
  distinguish_by:
  - exchange_sku
  - exchange_reference
  fields:
    exchange_sku: stock number of the item given in exchange
    exchange_reference: reference of the exchange order raised
    refund_amount: any price difference returned to the customer on the exchange
    event_date: the day the exchange was issued
    channel: where the exchange was issued
    order_line_reference: the order line exchanged
    customer_id: the exchanging customer
  triggers: []
- type: returns_shipping_label_issue
  target: return_events
  meaning: A prepaid return label or a collection booking is issued so the item can come back.
  grain: one row per label or collection booking issued on one authorisation
  distinguish_by:
  - carrier_name
  - label_expiry_date
  fields:
    carrier_name: who is to move the item
    tracking_reference: the carrier tracking reference
    label_expiry_date: the last day the label may be used
    event_date: the day the label was issued
    channel: the channel the label was issued through
    tier_at_event: the return schedule the label was issued under
    order_line_reference: the order line the label belongs to
    customer_id: the customer the label was issued to
  triggers: []
measures:
- id: returns_msr_returns_12m
  window: the rolling twelve calendar months ending on the handling date
  measure: count of return_authorizations raised on the profile whose status is not withdrawn or denied
- id: returns_msr_refund_value_12m
  window: the rolling twelve calendar months ending on the handling date
  measure: sum of refund_amount over returns_refund_disburse rows on every authorisation of the profile
- id: returns_msr_open_authorizations
  window: the moment of handling, with no historical window
  measure: count of return_authorizations on the profile standing in requested, authorized, in_transit, received or inspected
policies:
- id: returns_agg_multi_holding
  subject:
  - returns_rma_open
  rule: A customer may have several return authorisations open at once, and the number on one profile is not limited in itself. A second authorisation is never raised on an order line that already carries
    one standing in requested, authorized, in_transit, received or inspected. Where a line was returned in part and the customer wants to return more of it, a fresh authorisation is raised for the further
    units, and the units already settled are not counted again. A profile may not have more authorisations open at one time than the schedule's concurrent limit allows, counted across every schedule; where
    the limit is reached the customer settles or withdraws one before another is raised. The concurrent limit is read from returns_msr_open_authorizations at the moment the new authorisation is raised.
  eligibility:
  - id: one_open_rma_per_line
    applies_to:
    - returns_rma_open
    kind: dedup
    condition: A second authorisation is never raised on an order line that already carries one standing in requested, authorized, in_transit, received or inspected.
    evidence_fields:
    - return_authorizations.order_line_reference
    - return_authorizations.status
    - return_authorizations.quantity_returned
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - return_authorizations.order_line_reference
      action_bindings:
        return_authorizations.order_line_reference: order_line_reference
    dedup_contract:
      table: return_authorizations
      mode: separate_record
      object_bindings:
        order_line_reference: order_line_reference
      duplicate_filters:
        status:
        - requested
        - authorized
        - in_transit
        - received
        - inspected
      distinct_fields:
      - requested_date
      - quantity_returned
  params:
    max_per_customer: null
    per_tier:
      Standard Fifteen Day Return:
        concurrent_open_returns_limit: =concurrent_open_returns_limit
      Member Extended Thirty Day Return:
        concurrent_open_returns_limit: =concurrent_open_returns_limit
      Major Appliance Forty Eight Hour Return:
        concurrent_open_returns_limit: =concurrent_open_returns_limit
      Activated Wireless Device Return:
        concurrent_open_returns_limit: =concurrent_open_returns_limit
      Open Box and Clearance Final Sale:
        concurrent_open_returns_limit: =concurrent_open_returns_limit
      Business Contract Return Schedule:
        concurrent_open_returns_limit: =concurrent_open_returns_limit
  measures:
  - returns_msr_open_authorizations
- id: returns_agg_history_review
  subject:
  - returns_rma_open
  - returns_refund_authorize
  rule: 'Return behaviour is read across the whole profile rather than authorisation by authorisation: the count of authorisations raised in the rolling year, read from returns_msr_returns_12m, and the
    refund value settled in the rolling year, read from returns_msr_refund_value_12m, are both compared with the figures of the schedule the new line falls under. Where either figure is at or above its
    limit the return is still taken but is marked for review, the refund is settled only after the review closes, and store credit is used in place of a card refund. Authorisations that were withdrawn or
    refused do not count toward the count, because nothing came back; refunds later reversed do still count toward the value. A business contract profile is read against its own far larger figures, and
    the buyers named on it are counted together rather than one by one. Nothing in this rule refuses a return for a defective item, however often the profile has returned things.'
  eligibility: []
  params:
    per_tier:
      Standard Fifteen Day Return:
        max_returns_per_rolling_year: =max_returns_per_rolling_year
        abuse_review_threshold_usd: =abuse_review_threshold_usd
      Member Extended Thirty Day Return:
        max_returns_per_rolling_year: =max_returns_per_rolling_year
        abuse_review_threshold_usd: =abuse_review_threshold_usd
      Major Appliance Forty Eight Hour Return:
        max_returns_per_rolling_year: =max_returns_per_rolling_year
        abuse_review_threshold_usd: =abuse_review_threshold_usd
      Activated Wireless Device Return:
        max_returns_per_rolling_year: =max_returns_per_rolling_year
        abuse_review_threshold_usd: =abuse_review_threshold_usd
      Open Box and Clearance Final Sale:
        max_returns_per_rolling_year: =max_returns_per_rolling_year
        abuse_review_threshold_usd: =abuse_review_threshold_usd
      Business Contract Return Schedule:
        max_returns_per_rolling_year: =max_returns_per_rolling_year
        abuse_review_threshold_usd: =abuse_review_threshold_usd
  measures:
  - returns_msr_returns_12m
  - returns_msr_refund_value_12m
- id: returns_window_eligibility
  subject:
  - returns_rma_open
  - returns_rma_deny
  rule: A return is raised only when the customer asks within the return window of the schedule the line falls under, counted from the day the item was delivered or collected. The return window is counted
    in calendar days from the anchor day, which counts as day zero, and the grace hours the schedule allows are added to the end of the last day. The anchor is what the schedule's anchor basis names, and
    where the item was collected in store the collection day is the delivery day; a line never yet delivered is cancelled on the order rather than returned. A line on a final sale schedule is not returned
    at all, and the only ground on which it comes back is that it arrived defective or was not what was described. Where the window has run out the return is refused and the customer is pointed to the protection
    plan on the item if one is in force, because a lapsed window is not a fault. A refusal may be appealed within the schedule's appeal window, and an appeal is decided on the same authorisation rather
    than by raising a new one.
  eligibility:
  - id: inside_return_window
    applies_to:
    - returns_rma_open
    kind: time
    condition: A return is raised only when the customer asks within the return window of the schedule the line falls under, counted from the day the item was delivered or collected.
    evidence_fields:
    - return_authorizations.delivery_date
    - return_authorizations.order_line_reference
    - return_authorizations.purchase_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - return_authorizations.order_line_reference
      action_bindings:
        return_authorizations.order_line_reference: order_line_reference
    temporal_basis:
      clock: frozen_time
      anchor_event: the day the item was delivered or collected
      anchor_source: return_authorizations.delivery_date
      relation: not_after
      duration_source: params.return_window_days
      unit: calendar_days
      counting_rule: The return window is counted in calendar days from the anchor day, which counts as day zero, and the grace hours the schedule allows are added to the end of the last day.
      boundary: inclusive
  params:
    per_tier:
      Standard Fifteen Day Return:
        return_window_days: =return_window_days
        window_anchor_basis: =window_anchor_basis
        late_return_grace_hours: =late_return_grace_hours
        final_sale: =final_sale
        denial_appeal_window_days: =denial_appeal_window_days
      Member Extended Thirty Day Return:
        return_window_days: =return_window_days
        window_anchor_basis: =window_anchor_basis
        late_return_grace_hours: =late_return_grace_hours
        final_sale: =final_sale
        denial_appeal_window_days: =denial_appeal_window_days
      Major Appliance Forty Eight Hour Return:
        return_window_days: =return_window_days
        window_anchor_basis: =window_anchor_basis
        late_return_grace_hours: =late_return_grace_hours
        final_sale: =final_sale
        denial_appeal_window_days: =denial_appeal_window_days
      Activated Wireless Device Return:
        return_window_days: =return_window_days
        window_anchor_basis: =window_anchor_basis
        late_return_grace_hours: =late_return_grace_hours
        final_sale: =final_sale
        denial_appeal_window_days: =denial_appeal_window_days
      Open Box and Clearance Final Sale:
        return_window_days: =return_window_days
        window_anchor_basis: =window_anchor_basis
        late_return_grace_hours: =late_return_grace_hours
        final_sale: =final_sale
        denial_appeal_window_days: =denial_appeal_window_days
      Business Contract Return Schedule:
        return_window_days: =return_window_days
        window_anchor_basis: =window_anchor_basis
        late_return_grace_hours: =late_return_grace_hours
        final_sale: =final_sale
        denial_appeal_window_days: =denial_appeal_window_days
- id: returns_authorization_and_logistics
  subject:
  - returns_rma_authorize
  - returns_shipping_label_issue
  - returns_item_dispatch
  - returns_item_receive
  rule: A return is authorised, and a label or collection issued, only while the authorisation stands in requested or authorized. The way the item comes back is one the schedule allows, and where the customer
    asks for a way it does not allow the nearest allowed way is offered instead. A prepaid label stays usable for the schedule's label validity days from the day it is issued, and an expired label is reissued
    once without a fee; a collection needs the schedule's lead days of notice and may be moved only as often as the schedule allows. Where the customer pays the return shipping the carrier fee of the schedule
    is charged, and where the item is graded defective on arrival that fee is refunded with the line. A palletised business return is collected on freight at the freight fee of the schedule, and the business
    authorisation the schedule requires is on file before the crew is booked. An item damaged on the way back is settled against whoever the schedule's liability basis names, and the customer is not refused
    the refund while that is worked out.
  eligibility:
  - id: authorizable_rma_state
    applies_to:
    - returns_rma_authorize
    - returns_shipping_label_issue
    kind: state
    condition: A return is authorised, and a label or collection issued, only while the authorisation stands in requested or authorized.
    evidence_fields:
    - return_authorizations.status
    - return_authorizations.return_authorization_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - return_authorizations.return_authorization_id
      action_bindings:
        return_authorizations.return_authorization_id: return_authorization_id
    state_contract:
      field: return_authorizations.status
      allowed:
      - requested
      - authorized
