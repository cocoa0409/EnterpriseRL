    - return_authorizations.received_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - return_authorizations.return_authorization_id
      action_bindings:
        return_authorizations.return_authorization_id: return_authorization_id
    state_contract:
      field: return_authorizations.status
      allowed:
      - requested
      - authorized
      - withdrawn
  params:
    per_tier:
      Standard Fifteen Day Return:
