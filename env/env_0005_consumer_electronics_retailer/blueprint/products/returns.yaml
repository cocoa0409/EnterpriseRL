- id: returns_excl_refund_or_exchange
  subject:
  - returns_rma_settle
  - returns_exchange_issue
  rule: 'One authorisation is settled either by refund or by exchange, never by both, and the choice is fixed when the authorisation is settled. Where the customer has taken an exchange and then wants money
    back instead, the exchange item is returned on its own fresh authorisation under whatever schedule that item falls under, and its window runs from the day the exchange was delivered. A price difference
    returned on an exchange is not a refund of the line and does not make the authorisation a refund settlement. A price protection claim inside the schedule''s price protection days is neither a refund
    nor an exchange: the difference is returned with the item kept, and it does not use up the return window. Partial quantity settlement follows the same exclusion: the units refunded and the units exchanged
    are carried on separate authorisations.'
