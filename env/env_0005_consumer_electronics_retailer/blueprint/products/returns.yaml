- id: returns_refund_settlement
  subject:
  - returns_refund_authorize
  - returns_refund_disburse
  - returns_refund_offset
  - returns_rma_settle
  rule: The merchandise refund is the line price times the units returned, times the percentage the schedule's grade ladder gives for the grade recorded, less the deductions for missing accessories, rounded
    to the cent. A refund is authorised, offset or paid out only while the authorisation stands inspected or settled. Sales tax is refunded in proportion to the merchandise actually refunded; the delivery
    charge, the installation charge and the recycling fee are refunded only where the schedule says so, and each is authorised as its own component so the customer can see what was and was not returned.
    The restocking fee still outstanding is kept back from the refund as an offset rather than billed separately, and the refund never goes below nothing. The refund goes back by the method the schedule
    requires; where the schedule requires the original method and that method can no longer be credited, store credit is used on the schedules that allow the fallback and a bank transfer is arranged on
    those that do not. The money leaves the retailer within the schedule's settlement days counted in business days from the day the return was settled, and a business invoice credit appears within the
    schedule's invoice credit days.
