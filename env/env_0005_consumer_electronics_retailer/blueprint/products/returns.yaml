- id: returns_combo_membership_protection
  subject:
  - returns_rma_open
  - returns_restocking_fee_waive
  rule: 'Holding a Circle membership changes the return schedule the line falls under and what the return costs: where the schedule takes the member extension, the membership tier''s window extension days
    are added to the schedule''s window, and the tier''s restocking fee waiver percentage is applied to the fee the schedule charges. The extension is read from the membership tier standing on the day the
    return is asked for, not the tier held when the item was bought, and a membership in grace on a tier that suspends benefits gives no extension at all. Holding a protection plan on the returned item
    does not extend the window, and the plan is cancelled with the return where the schedule says so, its premium refunded under the plan''s own free-look or pro rata rules rather than as part of the refund
    worked out here. A member who returns an item bought with reward points has the points restored rather than refunded in money, and the money part of a split payment is refunded by the method the schedule
    requires. Where both the membership waiver and a defective grade would waive the same fee the fee is waived once, and the defective grade is recorded as the reason because it is the stronger ground.'
  eligibility: []
  params:
    per_tier:
      Standard Fifteen Day Return:
        member_window_extension_applies: =member_window_extension_applies
        restocking_fee_waived_for_member: =restocking_fee_waived_for_member
        protection_plan_cancelled_on_return: =protection_plan_cancelled_on_return
