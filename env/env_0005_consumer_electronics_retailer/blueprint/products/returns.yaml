category: returns
display_name: Northbeam Returns and Restocking
binding:
  holding_table: return_authorizations
  event_tables:
  - return_events
  intake_tables:
  - return_pickup_requests
  status_field: status
  variant_field: variant_name
  quantity_fields:
    refund_outstanding: refund_payable
    restocking_fee_outstanding: restocking_fee_receivable
lifecycle:
  states:
  - requested
  - authorized
  - in_transit
  - received
  - inspected
  - settled
  - denied
  - withdrawn
  transitions:
  - from: requested
    to: authorized
    by: agent
    means: the return was authorised and the way back was agreed
  - from: requested
    to: denied
    by: agent
    means: the return was refused at the request
  - from: requested
    to: withdrawn
    by: user
    means: the customer called the return off before it was authorised
  - from: authorized
    to: in_transit
    by: user
    means: the customer handed their own item to a carrier
  - from: authorized
    to: received
    by: agent
    means: the customer brought the item into the store and it was booked in
  - from: authorized
    to: withdrawn
    by: user
    means: the customer called the return off before sending the item
  - from: in_transit
    to: received
    by: agent
    means: the item arrived at the returns centre and was booked in
  - from: received
    to: inspected
    by: agent
    means: the inspection finished and a grade was recorded
  - from: inspected
    to: settled
    by: agent
    means: the refund or exchange was settled with the customer
  - from: inspected
    to: denied
    by: agent
    means: the inspection showed the item could not be taken back
accounts:
- key: refund_payable
  unit: USD
  meaning: refund authorised to the customer and not yet paid out; an in delta authorises money owed and an out delta records it paid or kept back
- key: restocking_fee_receivable
  unit: USD
  meaning: restocking and activated-device fees charged against a return and not yet settled or waived
parameter_schema:
  return_window_days: Days from the window anchor within which a return may be raised.
  window_anchor_basis: What the return window is counted from (string).
  late_return_grace_hours: Hours past the end of the window that are still accepted at the counter.
  restocking_fee_pct: Restocking fee as a percentage of the line price, percent.
  restocking_fee_min_usd: Smallest restocking fee charged where the fee applies, USD.
  restocking_fee_cap_usd: Largest restocking fee charged on one line, USD.
  activated_device_fee_usd: Flat fee on returning a device already activated on a network, USD.
  restocking_fee_waived_if_defective: Whether the restocking fee is waived when the item is graded defective.
  restocking_fee_waived_for_member: Whether a Circle member's fee is waived on this schedule.
  original_packaging_required: Whether the original packaging must come back with the item.
  accessories_required: Whether every accessory in the box must come back with the item.
  serial_match_required: Whether the serial returned must match the serial sold.
  proof_of_purchase_required: Whether proof of purchase must be produced to raise the return.
  photo_evidence_required: Whether photographs of the fault are required before a collection is booked.
  return_methods_allowed: Ways the item may come back on this schedule (string).
  return_shipping_paid_by: Who pays to bring the item back (string).
  carrier_pickup_fee_usd: Fee for a carrier collection from the address, USD.
  freight_collection_fee_usd: Fee for a freight collection of a palletised return, USD.
  label_validity_days: Days a prepaid return label stays usable from the day it is issued.
  pickup_lead_days: Days of notice needed to book a collection.
  pickup_reschedule_limit: Times a collection may be moved at the customer's request.
  inspection_required: Whether the item is inspected before the refund is worked out.
  inspection_days: Business days the inspection may take once the item is received.
  grade_refund_ladder: Share of the line price refunded at each inspection grade, as a ladder of grade to percentage.
  missing_accessory_deduction_usd: Amount taken off the refund for each missing accessory, USD.
  refund_methods_allowed: Ways the refund may be paid on this schedule (string).
  refund_to_original_method_required: Whether the refund must go back the way the item was paid for.
  store_credit_fallback: Whether store credit is used when the original method can no longer be credited.
  refund_settlement_days: Business days from settlement within which the money leaves the retailer.
  tax_refunded: Whether sales tax on the line is refunded with it.
  delivery_fee_refunded: Whether the delivery charge on the line is refunded.
  installation_fee_refunded: Whether an installation charge on the line is refunded.
  recycling_fee_refunded: Whether a recycling or disposal fee on the line is refunded.
  protection_plan_cancelled_on_return: Whether a protection plan on the returned item is cancelled with the return.
  exchange_allowed: Whether the line may be exchanged instead of refunded.
  exchange_window_days: Days from the window anchor within which an exchange may be raised.
  exchange_price_difference_basis: How a price difference on an exchange is settled (string).
  partial_quantity_return_allowed: Whether part of a multi-unit line may be returned.
  quantity_cap_per_rma: Units of one line that may be returned on a single authorisation.
  max_returns_per_rolling_year: Returns the profile may raise in a rolling year before it is reviewed.
  abuse_review_threshold_usd: Refund value in a rolling year beyond which the profile is reviewed, USD.
  concurrent_open_returns_limit: Return authorisations the profile may have open at one time.
  denial_appeal_window_days: Days after a refusal within which the customer may appeal.
  haul_away_of_replaced_item: Whether the old item is taken away when an exchange is delivered.
  restock_location_basis: Where the item is restocked (string).
  open_box_discount_pct_on_resale: Discount the item is put back on the shelf at once graded open box, percent.
  final_sale: Whether the line may not be returned at all.
  member_window_extension_applies: Whether the Circle tier's window extension is added to this schedule.
  business_authorization_required: Whether a signed authorisation from the business is needed before collection.
  business_invoice_credit_days: Days a business invoice credit takes to appear on the account.
  price_protection_days: Days after purchase within which a price drop is refunded without a return.
  carrier_damage_liability: Who carries the loss when the item is damaged on the way back (string).
  withdrawal_allowed_before_receipt: Whether the customer may call the return off before the item is received.
  reshipment_fee_on_withdrawal_usd: Fee to send an item back out after the customer withdraws a return in transit, USD.
