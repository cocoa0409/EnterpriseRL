- id: returns_denial_and_appeal
  subject:
  - returns_rma_deny
  rule: 'A return is refused at the request where the line is final sale, where the window has run out, or where the customer cannot produce the proof of purchase a schedule requires and none is on file.
    A return is refused after inspection where the serial does not match what was sold, where the item is not the item described on the authorisation, or where the item was never the retailer''s merchandise.
    A refusal names the ground it rests on and the grade it rests on where the item was inspected, and the item is sent back to the customer at the retailer''s cost when the refusal follows an inspection.
    The customer may appeal inside the schedule''s appeal window and the appeal is decided on the same authorisation; a second refusal on the same ground closes the matter. A return is never refused because
    the profile has returned a great deal: that is a matter for review, and the review governs the refund method rather than the right to return.'
