  - service_waiver
  rule: 'Holding a protection plan or a Circle membership changes what the work costs: where a protection plan standing active or in claim_hold authorises the work and the service covers plan labour, the
    labour and the trip charge are written off against the plan and only parts outside the plan are billed. Where no plan covers the work and the service applies the membership discount, the membership
    tier''s repair labour discount is taken off the chargeable labour before any surcharge is added, and the membership''s service benefit credit may then be spent against what is left. The plan cover and
    the membership discount are never applied to the same labour line: covered labour is already free, so a discount on it is meaningless. A membership standing in grace on a tier that suspends benefits
    gives neither the discount nor the credit, and the charge stands in full. The membership tier and the plan status are both read as they stand on the day the work is carried out, not the day the job
    was booked.'
