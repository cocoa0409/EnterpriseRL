    - service_events.charge_kind
    - service_events.service_agreement_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - service_events.work_order_line_reference
      action_bindings:
        service_events.work_order_line_reference: work_order_line_reference
    dedup_contract:
      table: service_events
