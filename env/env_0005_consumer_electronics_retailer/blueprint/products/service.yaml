category: service
display_name: Northbeam TechWorks Installation and Repair
binding:
  holding_table: service_agreements
  event_tables:
  - service_events
  intake_tables:
  - service_appointment_requests
  status_field: status
  variant_field: variant_name
  quantity_fields:
    visits_remaining: prepaid_visits
    service_charges_outstanding: service_receivable
lifecycle:
  states:
  - requested
  - scheduled
  - dispatched
  - parts_hold
  - completed
  - cancelled
  - no_show
  transitions:
  - from: requested
    to: scheduled
    by: user
    means: the customer confirmed a slot offered for the work
  - from: requested
    to: cancelled
    by: user
    means: the customer called the work off before a slot was confirmed
  - from: scheduled
    to: dispatched
    by: agent
    means: the crew was dispatched or the bench work began
  - from: scheduled
    to: cancelled
    by: user
    means: the customer called the booked work off
  - from: scheduled
    to: no_show
    by: system
    means: the bench slot passed with the item not brought in
  - from: dispatched
    to: parts_hold
    by: agent
    means: the work was held because a part was needed
  - from: parts_hold
    to: dispatched
    by: agent
    means: the part arrived and the crew returned to finish
  - from: dispatched
    to: completed
    by: agent
    means: the work was finished and signed off
  - from: dispatched
    to: no_show
    by: agent
    means: the crew attended and nobody was at the address
  - from: dispatched
    to: cancelled
    by: user
    means: the customer stopped the work while the crew was on site
  - from: parts_hold
    to: cancelled
    by: agent
    means: the part could not be obtained and the job was closed
accounts:
- key: prepaid_visits
  unit: visits
  meaning: service visits included in an agreement, a protection plan or a membership benefit and not yet used; an in delta grants visits and an out delta uses one
- key: service_receivable
  unit: USD
  meaning: service labour, parts and fees billed and not yet settled or written off; an in delta bills the customer and an out delta records money received or written off
parameter_schema:
  base_labour_rate_usd_per_hour: Standard chargeable labour rate, USD per hour.
  minimum_labour_hours: Least labour billed on a job, hours.
  labour_rounding_basis: How labour time is rounded when billed (string).
  trip_charge_usd: Charge for bringing a crew to the address, USD.
  trip_charge_waived_above_usd: Labour and parts total at or above which the trip charge is waived, USD.
  after_hours_surcharge_pct: Surcharge on labour outside ordinary service hours, percent.
  weekend_surcharge_pct: Surcharge on labour on a Saturday or Sunday, percent.
  service_hours: Ordinary service hours for this service (string).
  travel_radius_miles: Miles from the service point covered without a mileage charge.
  out_of_radius_fee_usd_per_mile: Charge for each mile beyond the covered radius, USD.
  diagnostic_fee_usd: Charge for diagnosing a fault before any repair is agreed, USD.
  diagnostic_fee_credited_to_repair: Whether the diagnostic charge is credited against the repair when the customer goes ahead.
  included_visits_per_term: Visits included in the agreement term at no charge.
  visit_term_months: Months the included visits belong to.
  annual_agreement_fee_usd: Fee for an annual care agreement, USD.
  agreement_term_months: Months an annual care agreement runs.
  preventive_visits_per_year: Planned maintenance visits carried out each year without a fault being reported.
  appointment_lead_days: Days of notice needed to book a slot.
  appointment_windows_offered: Slots the customer may choose from (string).
  reschedule_limit: Times a slot may be moved at the customer's request before a fee applies.
  reschedule_fee_usd: Fee to move a slot beyond the allowance, USD.
  reschedule_notice_hours: Hours of notice needed to move a slot without a fee.
  cancellation_notice_hours: Hours of notice needed to call the work off without a fee.
  cancellation_fee_usd: Fee charged when the work is called off inside the notice period, USD.
  no_show_fee_usd: Fee charged when nobody is at the address or the item is not brought in, USD.
  no_show_grace_minutes: Minutes the crew waits at the address before recording a no-show.
  haul_away_fee_usd: Charge to take the old item away, USD.
  haul_away_included: Whether taking the old item away is included in the service.
  parts_markup_pct: Markup on the parts cost when parts are billed, percent.
  parts_eta_days_standard: Business days a stocked part ordinarily takes to reach the service point.
  parts_hold_max_days: Calendar days a job may be held waiting for parts before it is escalated.
  parts_sourcing_basis: Where parts are sourced from (string).
  special_order_deposit_pct: Deposit taken before a special-order part is bought, percent of the part price.
  escalation_to_depot_days: Calendar days on site after which the job goes to the depot instead.
  warranty_labour_covered: Whether labour is covered without charge when the work is manufacturer warranty work.
  protection_plan_labour_covered: Whether labour is covered without charge when a protection plan authorises the work.
  membership_labour_discount_applies: Whether the Circle tier's repair labour discount is applied to chargeable labour.
  rework_window_days: Days after completion within which the same fault is put right as rework.
  rework_free: Whether rework inside the window is carried out without charge.
  workmanship_guarantee_days: Days the retailer stands behind the workmanship itself.
  completion_sign_off_required: Whether the customer must sign the work off before it is recorded complete.
  photo_documentation_required: Whether photographs of the finished work are kept on file.
  technician_certification_required: Certification the technician must hold for this work (string).
  two_person_crew_required: Whether two people must attend.
  site_readiness_requirements: What must be ready before the crew arrives (string).
  electrical_work_included: Whether new electrical work is part of the service.
  plumbing_work_included: Whether water or waste connections are part of the service.
  mounting_hardware_included: Whether brackets and fixings are included in the price.
  wall_type_surcharge_usd: Surcharge for mounting to each wall construction, as a mapping of wall type to amount, USD.
  calibration_passes_included: Calibration passes included in one visit.
  max_devices_per_visit: Items that may be worked on in one visit.
  response_time_hours_target: Hours within which the retailer aims to attend a reported fault.
  priority_response: Whether the work goes in the priority queue.
  remote_diagnostic_included: Whether a remote diagnosis is attempted before a visit is booked.
  loaner_equipment_included: Whether loan equipment is left while the item is away.
  payment_terms_days: Days a business account may take to settle a service invoice.
  payment_methods_allowed: Ways service charges may be settled (string).
  damage_liability_cap_usd: Most the retailer will meet for damage caused during the work, USD.
