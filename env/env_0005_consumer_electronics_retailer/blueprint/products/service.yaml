events:
- type: service_agreement_open
  target: service_agreements
  mutation: create
  meaning: A work order or annual care agreement is opened for a piece of work the customer has asked for.
  grain: one row per job or annual agreement the customer holds
  fields:
    customer_id: the customer the work is for
    variant_name: the TechWorks service the work falls under
    status: set to the entry state requested
    requested_date: the day the work was asked for
    work_type: what the job is for
    item_category: department of the item worked on
    item_sku: stock number of the item
    item_serial: serial number of the item
    service_address_postal_code: postal code of the address the work is for
    source_order_reference: the order the item or service was bought on
    protection_plan_reference: the protection plan the work is claimed under, where it is
    warranty_work_flag: whether the work is warranty or plan work rather than chargeable
    agreement_term_end: last day an annual agreement runs
    priority_flag: whether the work goes in the priority queue
  triggers: []
- type: service_appointment_confirm
  target: service_agreements
  mutation:
    transition:
      from: requested
      to: scheduled
  meaning: The customer confirms a slot and the visit or bench session is booked.
  grain: one row per agreement; the confirmed slot is written onto it
  fields:
    status: moved to scheduled
    scheduled_date: the day the slot is booked for
    scheduled_window: the part of the day booked
    technician_code: the technician or crew assigned
  triggers: []
- type: service_appointment_reschedule
  target: service_agreements
  mutation: update
  meaning: The booked slot is moved to another day or window at the customer's request or because the crew cannot attend.
  grain: one row per agreement; each move overwrites the slot and raises the move count
  fields:
    scheduled_date: the day the slot now stands for
    scheduled_window: the part of the day it now stands in
    reschedule_count: times the slot has now been moved
    technician_code: the technician or crew now assigned
  triggers: []
- type: service_technician_dispatch
  target: service_agreements
  mutation:
    transition:
      from: scheduled
      to: dispatched
  meaning: The crew is dispatched to the address, or the bench work begins on the item.
  grain: one row per agreement; the dispatch day is written onto it
  fields:
    status: moved to dispatched
    dispatched_date: the day the crew was dispatched or bench work began
    technician_code: the technician or crew attending
  triggers:
  - event: service:service_diagnostic_record
    map:
      customer_id: customer_id
      technician_code: technician_code
- type: service_parts_hold_start
  target: service_agreements
  mutation:
    transition:
      from: dispatched
      to: parts_hold
  meaning: The work cannot be finished until a part arrives, so the job is held.
  grain: one row per agreement; the day the hold began is written onto it
  fields:
    status: moved to parts_hold
    parts_hold_started_date: the day the job was held for parts
  triggers:
  - event: service:service_parts_order_record
    map:
      customer_id: customer_id
- type: service_parts_hold_release
  target: service_agreements
  mutation:
    transition:
      from: parts_hold
      to: dispatched
  meaning: The part arrives and the crew returns to finish the work.
  grain: one row per agreement; the job returns to being worked
  fields:
    status: moved back to dispatched
    scheduled_date: the day the return visit is booked for
    scheduled_window: the part of the day the return visit is booked in
  triggers: []
- type: service_work_complete
  target: service_agreements
  mutation:
    transition:
      from: dispatched
      to: completed
  meaning: The work is finished and signed off.
  grain: one row per agreement; the completion day is written onto it
  fields:
    status: moved to completed
    completed_date: the day the work was signed off
    technician_code: the technician or crew who finished the work
    warranty_work_flag: whether the finished work was warranty or plan work
  triggers:
  - event: service:service_labour_charge
    when:
      warranty_work_flag: false
    map:
      customer_id: customer_id
      charge_kind: labour
      technician_code: technician_code
  - event: service:service_visit_consume
    when:
      warranty_work_flag: true
    map:
      customer_id: customer_id
      visit_grant_reason: plan_included
- type: service_no_show_record
  target: service_agreements
  mutation:
    transition:
    - from: scheduled
      to: no_show
    - from: dispatched
      to: no_show
  meaning: Nobody was at the address when the crew arrived, or the item was never brought in.
  grain: one row per agreement; the day of the failed attendance is written onto it
  fields:
    status: moved to no_show
    no_show_date: the day the attendance failed
    technician_code: the technician or crew who attended
  triggers:
  - event: service:service_fee_charge
    map:
      customer_id: customer_id
      charge_kind: no_show_fee
- type: service_agreement_cancel
  target: service_agreements
  mutation:
    transition:
    - from: requested
      to: cancelled
    - from: scheduled
      to: cancelled
    - from: dispatched
      to: cancelled
    - from: parts_hold
      to: cancelled
  meaning: The work is called off, by the customer or because it cannot be carried out.
  grain: one row per agreement; the day the work was called off is written onto it
  fields:
    status: moved to cancelled
    cancelled_date: the day the work was called off
  triggers: []
- type: service_visit_allowance_grant
  target: service_events
  meaning: Visits included in the service, in a protection plan or in a membership benefit are credited to the agreement.
  grain: one row per grant of included visits on one agreement
  distinguish_by:
  - visit_grant_reason
  - event_date
  fields:
    visits_delta: visits credited, positive
    visit_grant_reason: why the visits were granted
    event_date: the day the visits were credited
    tier_at_event: the service the visits were credited under
    customer_id: the customer credited
  account: prepaid_visits
  direction: in
  triggers: []
- type: service_visit_consume
  target: service_events
  meaning: An included visit is used up by a visit actually carried out.
  grain: one row per visit carried out against the included allowance on one agreement
  distinguish_by:
  - visit_date
  - technician_code
  fields:
    visits_delta: visits used, negative
    visit_date: the day the visit was carried out
    technician_code: the technician or crew who attended
    visit_grant_reason: the allowance the visit was taken from
    event_date: the day the use was booked
    customer_id: the customer whose allowance was used
  account: prepaid_visits
  direction: out
  triggers: []
- type: service_labour_charge
  target: service_events
  meaning: Chargeable labour, with any surcharge, is billed for the work carried out.
  grain: one row per labour charge billed for one visit on one agreement
  distinguish_by:
  - charge_kind
  - visit_date
  fields:
    charge_amount: the amount billed
    charge_kind: whether ordinary or overtime labour
    labour_hours: the chargeable hours recorded
    hourly_rate: the rate they were charged at
    visit_date: the day the work was carried out
    technician_code: the technician or crew who did it
    event_date: the day the charge was booked
    work_order_line_reference: the line of work the charge belongs to
    tier_at_event: the service the charge was billed under
    customer_id: the customer billed
  account: service_receivable
  direction: in
  triggers: []
- type: service_parts_charge
  target: service_events
  meaning: A part fitted during the work is billed, at cost plus the service's markup.
  grain: one row per part billed on one agreement
  distinguish_by:
  - part_number
  - visit_date
  fields:
    charge_amount: the amount billed
    charge_kind: whether a stocked or special-order part
    part_number: the part billed
    visit_date: the day the part was fitted
    event_date: the day the charge was booked
    work_order_line_reference: the line of work the part belongs to
    tier_at_event: the service the part was billed under
    customer_id: the customer billed
  account: service_receivable
  direction: in
  triggers: []
- type: service_fee_charge
  target: service_events
  meaning: A trip charge, a no-show fee, a reschedule fee, a cancellation fee, a haul-away fee, a diagnostic fee, a surcharge or a mileage charge is billed.
  grain: one row per fee of one kind billed on one agreement
  distinguish_by:
  - charge_kind
  - event_date
  fields:
    charge_amount: the amount billed
    charge_kind: which fee or surcharge this is
    visit_date: the day the visit the fee arose on was booked for
    event_date: the day the fee was booked
    channel: the channel the fee arose through
    work_order_line_reference: the line of work the fee belongs to
    tier_at_event: the service the fee was billed under
    customer_id: the customer billed
  account: service_receivable
  direction: in
  triggers: []
- type: service_payment
  target: service_events
  meaning: The customer settles billed service charges.
  grain: one row per payment received on one agreement
  distinguish_by:
  - payment_method
  - event_date
  fields:
    payment_amount: the amount received
    payment_method: how the customer paid
    event_date: the day the payment was received
    channel: the channel the payment came through
    customer_id: the customer who paid
  account: service_receivable
  direction: out
  triggers: []
- type: service_waiver
  target: service_events
  meaning: A billed service charge is written off, because a plan or warranty covers it or as a goodwill gesture.
  grain: one row per write-off granted on one agreement
  distinguish_by:
  - waiver_reason
  - event_date
  fields:
    waiver_amount: the amount written off
    waiver_reason: why it was written off
    event_date: the day the write-off was granted
    work_order_line_reference: the line of work the write-off belongs to
    channel: the channel the write-off was granted through
    customer_id: the customer relieved of the charge
  account: service_receivable
  direction: out
  triggers: []
- type: service_parts_order_record
  target: service_events
  meaning: A part is ordered for the job and its expected arrival is recorded.
  grain: one row per part ordered for one agreement
  distinguish_by:
  - parts_order_reference
  - part_number
  fields:
    part_number: the part ordered
    parts_order_reference: the parts order raised
    part_eta_date: the day the part is expected
    event_date: the day the part was ordered
    customer_id: the customer the part is for
  triggers: []
- type: service_diagnostic_record
  target: service_events
  meaning: What the technician found is recorded, whether or not any repair follows.
  grain: one row per diagnosis carried out on one agreement
  distinguish_by:
  - diagnostic_code
  - visit_date
  fields:
    diagnostic_code: what the diagnosis found
    visit_date: the day the diagnosis was made
    technician_code: the technician who made it
    event_date: the day the diagnosis was recorded
    work_order_line_reference: the line of work the diagnosis belongs to
    customer_id: the customer diagnosed for
  triggers: []
- type: service_rework_open
  target: service_events
  meaning: The same fault comes back after the work was signed off and a rework job is raised against it.
  grain: one row per rework job raised against one agreement
  distinguish_by:
  - rework_reference
  - event_date
  fields:
    rework_reference: the rework job raised
    diagnostic_code: what the returning fault was found to be
    event_date: the day the rework was raised
    work_order_line_reference: the original line of work the rework is against
    channel: the channel the rework was raised through
    customer_id: the customer the rework is for
  triggers: []
measures:
- id: service_msr_visits_used_term
  window: the current visit term, from the day the visits were granted to the last day of the visit term months
  measure: sum of the absolute visits_delta over service_visit_consume rows on every agreement of the profile
- id: service_msr_reworks_12m
  window: the rolling twelve calendar months ending on the handling date
  measure: count of service_rework_open rows on every agreement of the profile
- id: service_msr_no_shows_12m
  window: the rolling twelve calendar months ending on the handling date
  measure: count of service_agreements of the profile whose status reached no_show
policies:
- id: service_agg_multi_holding
  subject:
  - service_agreement_open
  rule: 'A customer may hold several work orders at once, one for each job, and a business profile may hold many at the same time. A second work order is never opened on the same item serial for the same
    work type while one stands in requested, scheduled, dispatched or parts_hold. An annual care agreement is held alongside work orders rather than instead of them: the jobs carried out under it are their
    own work orders, and only one annual care agreement may run on a profile at a time. A rework job is opened as a work order of its own against the original one and is not counted as a second job on the
    item.'
  eligibility:
  - id: one_open_job_per_item
    applies_to:
    - service_agreement_open
    kind: dedup
    condition: A second work order is never opened on the same item serial for the same work type while one stands in requested, scheduled, dispatched or parts_hold.
    evidence_fields:
    - service_agreements.item_serial
    - service_agreements.work_type
    - service_agreements.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - service_agreements.item_serial
      action_bindings:
        service_agreements.item_serial: item_serial
    dedup_contract:
      table: service_agreements
      mode: separate_record
      object_bindings:
        item_serial: item_serial
        work_type: work_type
      duplicate_filters:
        status:
        - requested
        - scheduled
        - dispatched
        - parts_hold
      distinct_fields:
      - requested_date
      - variant_name
  params:
    max_per_customer: null
- id: service_agg_visit_pool
  subject:
  - service_visit_allowance_grant
  - service_visit_consume
  rule: 'Included visits are pooled across the profile rather than counted job by job: the visits used in the term, read from service_msr_visits_used_term, are set against the visits included by every agreement
    the profile holds, and the pool is drawn down in the order the visits were granted, oldest grant first. Where the pool is empty the visit is carried out and billed as ordinary labour, and the customer
    is told which grant ran out. Visits granted under a protection plan are drawn before visits granted by a membership, and visits granted as goodwill are drawn last. A visit that ends as a no-show is
    not drawn from the pool, because no work was carried out. Unused visits do not carry into the next term and are not paid out.'
  eligibility: []
  params:
    per_tier:
      TechWorks In Store Bench Service:
        included_visits_per_term: =included_visits_per_term
        visit_term_months: =visit_term_months
        preventive_visits_per_year: =preventive_visits_per_year
      TechWorks Standard Home Installation:
        included_visits_per_term: =included_visits_per_term
        visit_term_months: =visit_term_months
        preventive_visits_per_year: =preventive_visits_per_year
      TechWorks Home Theatre Calibration:
        included_visits_per_term: =included_visits_per_term
        visit_term_months: =visit_term_months
        preventive_visits_per_year: =preventive_visits_per_year
      TechWorks Appliance Install and Haul Away:
        included_visits_per_term: =included_visits_per_term
        visit_term_months: =visit_term_months
        preventive_visits_per_year: =preventive_visits_per_year
      TechWorks Business On Site Deployment:
        included_visits_per_term: =included_visits_per_term
        visit_term_months: =visit_term_months
        preventive_visits_per_year: =preventive_visits_per_year
      TechWorks Managed IT Care Annual:
        included_visits_per_term: =included_visits_per_term
        visit_term_months: =visit_term_months
        preventive_visits_per_year: =preventive_visits_per_year
    draw_order: protection plan visits, then membership visits, then goodwill visits
  measures:
  - service_msr_visits_used_term
- id: service_appointment_scheduling
  subject:
  - service_agreement_open
  - service_appointment_confirm
  - service_appointment_reschedule
  - service_technician_dispatch
  rule: A slot is booked only against an appointment request standing as confirmed by the customer for that agreement. A slot is booked no sooner than the service's lead days after the day the customer
    asked for the work. Lead days are counted as calendar days from the day the work was asked for, which counts as day zero, and a slot that would fall earlier is offered on the first day that satisfies
    the lead. Only the windows the service offers may be booked, and a crew is dispatched only where the technician holds the certification the service requires and, where the service requires two people,
    a second is available. The customer is told what the service's site readiness requirements are before the slot is confirmed, and a crew that finds the site not ready records a no-show rather than carrying
    the work out badly. A slot may be moved as often as the service's allowance permits with the service's notice hours given; beyond that allowance, or with less notice, the service's reschedule fee is
    billed. Where the retailer moves the slot, nothing is billed and the move does not count against the customer's allowance. Work outside the service's ordinary hours or at a weekend carries the service's
    surcharge on the labour, and the two surcharges are not both applied to the same hour.
  eligibility:
  - id: customer_confirmed_slot
    applies_to:
    - service_appointment_confirm
    kind: authorization
    condition: A slot is booked only against an appointment request standing as confirmed by the customer for that agreement.
    evidence_fields:
    - service_appointment_requests.customer_confirmation
    - service_appointment_requests.service_agreement_id
    - service_appointment_requests.site_readiness_declared
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - service_appointment_requests.service_agreement_id
      action_bindings:
        service_appointment_requests.service_agreement_id: service_agreement_id
  - id: lead_time_respected
    applies_to:
    - service_appointment_confirm
    kind: time
    condition: A slot is booked no sooner than the service's lead days after the day the customer asked for the work.
    evidence_fields:
    - service_agreements.requested_date
    - service_agreements.service_agreement_id
    - service_agreements.scheduled_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - service_agreements.service_agreement_id
      action_bindings:
        service_agreements.service_agreement_id: service_agreement_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the day the customer asked for the work
      anchor_source: service_agreements.requested_date
      relation: not_before
      duration_source: params.appointment_lead_days
      unit: calendar_days
      counting_rule: Lead days are counted as calendar days from the day the work was asked for, which counts as day zero, and a slot that would fall earlier is offered on the first day that satisfies the
        lead.
      boundary: inclusive
  params:
    per_tier:
      TechWorks In Store Bench Service:
        appointment_lead_days: =appointment_lead_days
        appointment_windows_offered: =appointment_windows_offered
        reschedule_limit: =reschedule_limit
        reschedule_fee_usd: =reschedule_fee_usd
        reschedule_notice_hours: =reschedule_notice_hours
        technician_certification_required: =technician_certification_required
        two_person_crew_required: =two_person_crew_required
        site_readiness_requirements: =site_readiness_requirements
        service_hours: =service_hours
        after_hours_surcharge_pct: =after_hours_surcharge_pct
