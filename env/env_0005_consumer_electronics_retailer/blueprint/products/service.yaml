- id: service_labour_pricing
  subject:
  - service_labour_charge
  - service_payment
  rule: Chargeable labour is the hours actually worked, rounded up as the service's rounding basis states and raised to the service's minimum hours, times the service's hourly rate. Labour is billed, and
    payments applied, only while the agreement stands dispatched, parts_hold or completed. The trip charge of the service is billed once per visit and is waived where the labour and parts on that visit
    reach the service's waiver figure; a return visit after a parts hold carries no second trip charge. Mileage beyond the service's covered radius is billed at the service's rate for each mile beyond it,
    measured from the service point to the address. Mounting to a wall other than drywall on studs carries the surcharge the service's wall type mapping gives for that construction, and brackets and fixings
    are billed separately unless the service includes them. A business account settles within the service's payment terms, and a consumer account settles on the day; a payment is applied to the oldest unsettled
    charge first.
  eligibility:
  - id: billable_job_state
    applies_to:
    - service_labour_charge
    - service_payment
    kind: state
    condition: Labour is billed, and payments applied, only while the agreement stands dispatched, parts_hold or completed.
    evidence_fields:
    - service_agreements.status
    - service_agreements.service_agreement_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - service_agreements.service_agreement_id
      action_bindings:
        service_agreements.service_agreement_id: service_agreement_id
    state_contract:
      field: service_agreements.status
      allowed:
      - dispatched
      - parts_hold
      - completed
  params:
    per_tier:
      TechWorks In Store Bench Service:
        base_labour_rate_usd_per_hour: =base_labour_rate_usd_per_hour
        minimum_labour_hours: =minimum_labour_hours
        labour_rounding_basis: =labour_rounding_basis
        trip_charge_usd: =trip_charge_usd
        trip_charge_waived_above_usd: =trip_charge_waived_above_usd
        travel_radius_miles: =travel_radius_miles
        out_of_radius_fee_usd_per_mile: =out_of_radius_fee_usd_per_mile
        wall_type_surcharge_usd: =wall_type_surcharge_usd
