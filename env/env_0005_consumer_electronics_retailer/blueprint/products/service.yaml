- id: service_parts_handling
  subject:
  - service_parts_charge
  - service_parts_order_record
  - service_parts_hold_start
  - service_parts_hold_release
  rule: Parts are sourced as the service's sourcing basis states, and a part is billed at its cost plus the service's markup, rounded to the cent. A job is held for parts for no longer than the service's
    parts hold days, counted from the day the job was held for parts. Parts hold days are counted as calendar days from the day the hold began, which counts as day zero, and a part that arrives late does
    not restart the count. A special-order part is ordered only once the service's deposit percentage has been taken, and that deposit is set against the final bill rather than refunded separately. Where
    the part has not arrived by the end of the hold days the job is escalated to the depot after the service's escalation days, and the customer is not billed for the wait. A part fitted under a protection
    plan or under the manufacturer's warranty is not billed to the customer, and the markup is not applied to it either. A part ordered and then not needed is returned to stock and the deposit released,
    and the customer is billed nothing where the part was never fitted.
