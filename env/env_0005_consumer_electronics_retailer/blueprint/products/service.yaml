- id: service_excl_warranty_or_chargeable
  subject:
  - service_labour_charge
  - service_parts_charge
  rule: One line of work is either warranty or plan work or chargeable work, never both, and the flag on the agreement decides which before any charge is booked. Where a job turns out to be partly covered,
    the covered work is recorded on its own line as warranty or plan work and the uncovered work on a chargeable line, so no line carries both. A customer cannot be billed for labour on a line whose charge
    has been written off as plan covered, and a line billed to the customer is not later claimed from the plan. Manufacturer warranty work is never billed to the customer at all, including the trip charge,
    and a diagnostic fee taken before the warranty was established is refunded. Where the plan declines the claim after the work was carried out as plan work, the line is rebilled as chargeable work with
    the plan's decision recorded against it.
  eligibility:
  - id: single_billing_basis_per_line
    applies_to:
    - service_labour_charge
    - service_parts_charge
    kind: dedup
    condition: One line of work is either warranty or plan work or chargeable work, never both, and the flag on the agreement decides which before any charge is booked.
