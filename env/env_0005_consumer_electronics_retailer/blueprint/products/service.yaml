  rule: Work is recorded complete only where the service requires no sign-off, or where the customer's sign-off is on file for that agreement. Photographs of the finished work are kept where the service
    requires them, and a job completed without them is not refused but is flagged for the supervisor. A rework job is raised without charge only within the service's rework window, counted from the day
    the original work was signed off. The rework window is counted in calendar days from the completion day, which counts as day zero. Rework inside the window is carried out without labour or trip charges
    where the service makes rework free, and parts are still billed unless the part itself failed. The retailer stands behind the workmanship for the service's guarantee days, which run alongside the rework
    window and are not shortened by it; a fault arising from the item rather than the work is a protection plan or warranty matter instead. Where the profile has raised rework repeatedly on the same item,
    read from service_msr_reworks_12m, the job is escalated to a senior technician rather than reworked a third time by the same crew. Damage caused during the work is met up to the service's liability
    cap and is never set against the customer's own charges.
