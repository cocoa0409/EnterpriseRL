- id: tradein_device_logistics
  subject:
  - tradein_device_receive
  - tradein_handling_fee_charge
  - tradein_handling_fee_waive
  - tradein_device_return
  rule: The device reaches the retailer by a way the programme allows, and a prepaid label stays usable for the programme's label validity days from the day it is issued. A handling or freight fee is charged
    or waived only while the agreement stands accepted, device_received, appraised or credited. The programme's handling fee is charged on a mailed-in device and is waived where the quote is at or above
    the programme's waiver figure; the freight fee is charged on a palletised collection, which needs the programme's lead days of notice. A device lost or damaged on the way in is settled up to the programme's
    transit cover figure, and the customer is not asked to prove the value beyond the quote already written. A declined device is sent back within the programme's return days, carried by whoever the programme's
    return shipping basis names. A shipment arriving with fewer units than the request declared is booked in at the units actually received, and the agreement is appraised on those.
  eligibility:
  - id: feeable_agreement_state
    applies_to:
    - tradein_handling_fee_charge
    - tradein_handling_fee_waive
    kind: state
    condition: A handling or freight fee is charged or waived only while the agreement stands accepted, device_received, appraised or credited.
