      anchor_event: the day the revised offer was put to the customer
      anchor_source: tradein_events.event_date
      relation: not_after
      duration_source: params.customer_decision_days
      unit: calendar_days
      counting_rule: Decision days are counted as calendar days from the day the revised offer was put to the customer, which counts as day zero.
