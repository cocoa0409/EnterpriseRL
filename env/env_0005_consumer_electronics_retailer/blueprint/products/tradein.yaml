- id: tradein_quote_acceptance
  subject:
  - tradein_quote_accept
  - tradein_agreement_update
  rule: A device is taken from the customer only against a shipping request standing as consented by the customer for that agreement, since the device is the customer's own property. Where the programme
    requires it, photographic identity is checked against the profile before the device changes hands, and the trade is refused to anyone below the least age. A correction to the make, model or serial recorded
    on the agreement is made from the device itself rather than from what the customer remembers, and correcting the serial does not reopen the quote. Where the programme requires the trade-in to be set
    against a purchase, that purchase is attached within the programme's linked purchase window, and an agreement with no purchase attached by the end of the window is not credited. A business agreement
    is accepted only once the signed asset list the programme requires is on file, and the units on the list govern what may be collected.
  eligibility:
  - id: customer_consented_handover
    applies_to:
    - tradein_quote_accept
    kind: authorization
    condition: A device is taken from the customer only against a shipping request standing as consented by the customer for that agreement, since the device is the customer's own property.
    evidence_fields:
    - tradein_shipping_requests.customer_consent
    - tradein_shipping_requests.tradein_agreement_id
    - tradein_shipping_requests.units_declared
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - tradein_shipping_requests.tradein_agreement_id
      action_bindings:
        tradein_shipping_requests.tradein_agreement_id: tradein_agreement_id
  params:
    per_tier:
      Renew Instant Store Quote:
        identity_check_required: =identity_check_required
        age_minimum_years: =age_minimum_years
        linked_purchase_required: =linked_purchase_required
        linked_purchase_window_days: =linked_purchase_window_days
        business_asset_list_required: =business_asset_list_required
        bulk_minimum_units: =bulk_minimum_units
      Renew Mail In Appraisal:
