        ladder:
          - when: "fees stand on the job both for moving the slot and for the distance travelled"
            value: "every fee standing on the job"
          - when: "a fee stands on the job for the distance travelled and none for moving the slot"
            value: "the fees booked for the day the crew was dispatched"
          - when: "otherwise"
            value: "the fees booked for the day the job was completed"
