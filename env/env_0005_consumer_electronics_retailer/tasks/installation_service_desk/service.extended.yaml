          surcharge_scope: "0"
        evidence: [history]
        cross_difficulty: null
      - id: service_credit_available
        effect: parameter
        decides: credit_available
        bindings: [tier_credit, credit_balance, credit_available]
        ladder:
          - when: "no Circle membership stands active on the profile"
            value: "nothing"
          - when: "a Circle membership stands active on the profile and its unspent benefit credit is below the service visit credit its tier grants"
            value: "the unspent benefit credit standing on the membership"
          - when: "otherwise"
            value: "the service visit credit the tier grants"
