- id: service_charge_waivers
  subject:
  - service_waiver
  rule: 'A charge is written off only on a ground the retailer recognises: a protection plan authorising the work, the manufacturer''s warranty covering it, a membership benefit, an error the retailer made,
    a term of a business contract, or an express goodwill decision. A write-off names its ground, and the strongest ground is recorded where more than one would serve: plan cover before warranty, warranty
    before membership, and goodwill last of all. A write-off never exceeds the charge outstanding on the line it is granted against, and a charge already settled is refunded rather than written off. Goodwill
    is granted for the inconvenience the retailer caused rather than for the price of the work, and the same charge is not written off twice on different grounds. A write-off granted in error is reversed
    by billing the charge afresh with the same line reference, so the history stays on file.'
