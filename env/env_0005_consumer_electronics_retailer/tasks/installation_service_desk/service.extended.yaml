          relief_recognised: "0"
        evidence: [history]
        cross_difficulty: null
      - id: money_already_held_on_invoice
        effect: method
        decides: payments_held
        bindings: [payments_all, payments_dispatch, payments_rows, payments_held]
        ladder:
          - when: "a payment stands recorded on the job for the day the crew was dispatched"
            method: "that payment is treated as held against the charges and taken off them"
          - when: "payments stand recorded on the job and none of them is for the day the crew was dispatched"
