        effect: method
        decides: window_months
        bindings: [months_since_term, months_since_tier, window_months]
        ladder:
          - when: "the membership's current term began within the last twelve months and the membership stands active"
            method: "the redemptions of the membership year are counted over the months since that term began, and never fewer than one month"
          - when: "the tier now recorded on the membership took effect within the last twelve months"
            method: "the redemptions are counted over the months since that tier took effect, and never fewer than one month"
          - when: "otherwise"
            method: "the redemptions are counted over the twelve months ending on the day the relief is granted"
        baseline:
          window_months: "12"
        evidence: [cross_category, date]
        cross_difficulty: membership
      - id: labour_the_share_is_worked_out_on
        effect: parameter
        decides: discount_base
        bindings: [plan_cover_waivers, other_waivers, discount_base]
        ladder:
          - when: "a write-off granted on a plan's cover stands on the job"
            value: "no part of that labour at all"
          - when: "write-offs on another ground stand on the job and none granted on a plan's cover does"
            value: "that labour less what those write-offs have already taken off it"
          - when: "otherwise"
            value: "that labour as it stands"
        baseline:
          discount_base: "labour_scope"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        A write-off granted on the membership ground sets the membership's service credit against the charges
        standing unsettled on the job, and adds to it the share of the job's chargeable labour that the
        membership's own discount should have taken off. The labour the relief is worked out on is the labour
        standing on the job less the payments already received against it. That labour is taken into the share
        as it stands. No part of a surcharge booked on that labour is taken into the relief. Nothing of that labour is taken into the relief. The share is
        applied to the labour figure and the surcharge figure added together, and the outcome is rounded to the
        nearest cent. The credit available on the membership is the service visit credit its tier grants. The
        credit the membership year still allows for service work is the service visit credit the tier grants
        less the credit already spent inside the window, and never below nothing. The credit set against what
        is left is the lower of the credit available on the membership and the credit the membership year still
        allows for service work, so no redemption already netted out of the membership's own balance is
        deducted from that balance a second time. The redemptions of the membership year are counted over the
        twelve months ending on the day the relief is granted. The relief is rounded to the nearest
        cent and never exceeds the charges standing unsettled on the job, which are every charge booked on it
        less every payment received and every amount already written off, and it is never below nothing.
      params: []
    inputs:
      history:
        - {table: service_events, aggregate: sum, field: charge_amount, within_months: null, filters: {event_type: service_labour_charge}}
        - {table: service_events, aggregate: sum, field: payment_amount, within_months: null, filters: {event_type: service_payment}}
        - {table: service_events, aggregate: sum, field: waiver_amount, within_months: null, filters: {event_type: service_waiver}}
        - {category: membership, table: membership_events, aggregate: sum, field: benefit_amount, within_months: 12, filters: {event_type: membership_benefit_redeem}}
      cross_category: [membership]
  - id: service_ext_visit_settlement_payment
    base_policy_refs: [service_labour_pricing, service_charge_waivers, service_attendance_and_cancellation, service_parts_handling]
    overwrite: []
    trigger: on_request
    subject: [service_payment]
    computes: payment_amount
    target_tool: settle_service_bill_ea31a412
    params: {}
    rule: >
      When a customer asks to settle a job at the desk, the figure they settle is the charges the settlement
      covers, plus the older charges standing unsettled that are due with them, less the relief already
      recognised on the job and less the money already held against those charges, and it is never below
      nothing. The figure the customer settles is worked out only after the write-off owed on the membership
      ground stands recorded against the job's charges. The charges the settlement covers are every charge
      standing on the job less the payments already received against it. Where a payment has already been
      received on the job and the job carries labour for two or more attendances, only the charges booked for
      the day the crew was last sent out are covered instead; where no payment has been received on the job,
      every charge standing on the job is covered instead. No relief is recognised against those charges. Where
      a write-off granted on the membership ground stands on the job, every write-off standing on the job is
      recognised against them; where the only write-offs standing on the job were granted as goodwill, those
      goodwill write-offs are recognised against them. No money is treated as already held against those
      charges. Where a part was ordered for the job and a payment stands recorded on it for the day the job was
      held for parts, that payment stands as the deposit taken on the part and comes off the charges being
      covered; where no part was ordered for the job and a payment stands recorded on it, the payments already
      received come off the charges being covered. Nothing older is due with the settlement. Where a fee for
      moving the slot stands on the job and no write-off on the retailer's own error stands against it, that fee
      is due with the settlement; where a fee for moving the slot stands on the job and a write-off on the
      retailer's own error stands on it, what is left of that fee after that write-off is due with the
      settlement. The figure is rounded to the nearest cent, and a consumer profile settles it on the day it is
      worked out.
    prerequisite:
      - problem: service_ext_membership_service_relief
        kind: value_input
        gate: reliefs_recognised
        form: state
        policy_source: >-
          The figure the customer settles is worked out only after the write-off owed on the membership ground
          stands recorded against the job's charges.
        condition: >-
          a service history entry standing on the job records a write-off granted on the membership ground
        resolved_by: writeoff_service_charge_816a24da
        effect: >-
          once that write-off stands on the job, the relief recognised against the charges being covered
          changes from the write-offs granted as goodwill alone to every write-off standing on the job
    cross_category: []
    compute:
      - charges_total: "SUM('service_events','charge_amount')"
      - payments_total: "SUM('service_events','payment_amount')"
      - labour_lines: "COUNT('service_events', event_type='service_labour_charge')"
      - payments_count: "COUNT('service_events', event_type='service_payment')"
      - charges_last_sent: "SUM('service_events','charge_amount', visit_date=F('dispatched_date'))"
      - scope_total: "charges_last_sent if (payments_count >= 1 and labour_lines >= 2) else (charges_total if payments_count == 0 else MX(charges_total - payments_total, 0))"
      - waivers_total: "SUM('service_events','waiver_amount')"
      - membership_waivers: "SUM('service_events','waiver_amount', waiver_reason='membership_benefit')"
      - goodwill_waivers: "SUM('service_events','waiver_amount', waiver_reason='goodwill')"
      - reliefs_recognised: "waivers_total if membership_waivers > 0 else (goodwill_waivers if (goodwill_waivers > 0 and goodwill_waivers == waivers_total) else 0)"
      - parts_orders: "COUNT('service_events', event_type='service_parts_order_record')"
      - deposit_payments: "SUM('service_events','payment_amount', event_date=F('parts_hold_started_date'))"
      - payments_recognised: "deposit_payments if (parts_orders >= 1 and deposit_payments > 0) else (payments_total if (payments_count >= 1 and parts_orders == 0) else 0)"
      - slot_move_fee: "SUM('service_events','charge_amount', event_type='service_fee_charge', charge_kind='reschedule_fee')"
      - retailer_error_waivers: "SUM('service_events','waiver_amount', waiver_reason='retailer_error')"
      - older_due: "slot_move_fee if (slot_move_fee > 0 and retailer_error_waivers == 0) else (MX(slot_move_fee - retailer_error_waivers, 0) if retailer_error_waivers > 0 else 0)"
      - result: "MX(RND(scope_total + older_due - reliefs_recognised - payments_recognised, 2), 0)"
    compute_basis:
      charges_total: "where no payment has been received on the job, every charge standing on the job is covered instead"
      payments_total: "The charges the settlement covers are every charge standing on the job less the payments already received against it"
      labour_lines: "Where a payment has already been received on the job and the job carries labour for two or more attendances, only the charges booked for the day the crew was last sent out are covered instead"
      payments_count: "where no payment has been received on the job, every charge standing on the job is covered instead"
      charges_last_sent: "only the charges booked for the day the crew was last sent out are covered instead"
      scope_total: "The charges the settlement covers are every charge standing on the job less the payments already received against it"
      waivers_total: "Where a write-off granted on the membership ground stands on the job, every write-off standing on the job is recognised against them"
      membership_waivers: "Where a write-off granted on the membership ground stands on the job"
      goodwill_waivers: "where the only write-offs standing on the job were granted as goodwill, those goodwill write-offs are recognised against them"
      reliefs_recognised: "No relief is recognised against those charges"
      parts_orders: "Where a part was ordered for the job and a payment stands recorded on it for the day the job was held for parts"
      deposit_payments: "that payment stands as the deposit taken on the part and comes off the charges being covered"
      payments_recognised: "No money is treated as already held against those charges"
      slot_move_fee: "Where a fee for moving the slot stands on the job and no write-off on the retailer's own error stands against it, that fee is due with the settlement"
      retailer_error_waivers: "where a fee for moving the slot stands on the job and a write-off on the retailer's own error stands on it, what is left of that fee after that write-off is due with the settlement"
      older_due: "Nothing older is due with the settlement"
      result: "the figure they settle is the charges the settlement covers, plus the older charges standing unsettled that are due with them, less the relief already recognised on the job and less the money already held against those charges, and it is never below nothing"
    factors:
      - id: settlement_charge_scope
        effect: parameter
        decides: scope_total
        bindings: [labour_lines, payments_count, charges_last_sent, scope_total]
        ladder:
          - when: "a payment has already been received on the job and the job carries labour for two or more attendances"
            value: "the charges booked for the day the crew was last sent out"
          - when: "no payment has been received on the job"
            value: "every charge standing on the job"
          - when: "otherwise"
            value: "every charge standing on the job less the payments already received against it"
        baseline:
          scope_total: "MX(charges_total - payments_total, 0)"
        evidence: [history]
        cross_difficulty: null
      - id: relief_recognised_ground
        effect: parameter
        decides: reliefs_recognised
        bindings: [waivers_total, membership_waivers, goodwill_waivers, reliefs_recognised]
        ladder:
          - when: "a write-off granted on the membership ground stands on the job"
            value: "every write-off standing on the job"
          - when: "the only write-offs standing on the job were granted as goodwill"
            value: "the write-offs granted as goodwill"
          - when: "otherwise"
            value: "nothing"
        baseline:
          reliefs_recognised: "0"
        evidence: [history]
        cross_difficulty: null
      - id: money_already_held
        effect: method
        decides: payments_recognised
        bindings: [parts_orders, deposit_payments, payments_recognised]
        ladder:
          - when: "a part was ordered for the job and a payment stands recorded on it for the day the job was held for parts"
            method: "that payment is treated as the deposit taken on the part and taken off the charges being covered"
          - when: "no part was ordered for the job and a payment stands recorded on it"
            method: "the payments already received are taken off the charges being covered"
          - when: "otherwise"
            method: "no payment at all is taken off the charges being covered"
        baseline:
          payments_recognised: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: older_charges_due
        effect: parameter
        decides: older_due
        bindings: [slot_move_fee, retailer_error_waivers, older_due]
        ladder:
          - when: "a fee for moving the slot stands on the job and no write-off on the retailer's own error stands against it"
            value: "that fee in full"
          - when: "a fee for moving the slot stands on the job and a write-off on the retailer's own error stands on it"
            value: "what is left of that fee after that write-off"
          - when: "otherwise"
            value: "nothing"
        baseline:
          older_due: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        When a customer asks to settle a job at the desk, the figure they settle is the charges the settlement
        covers, plus the older charges standing unsettled that are due with them, less the relief already
        recognised on the job and less the money already held against those charges, and it is never below
        nothing. The charges the settlement covers are every charge standing on the job less the payments
        already received against it. No relief is recognised against those charges. No money is treated as
        already held against those charges. Nothing older is due with the settlement. The figure is rounded to
