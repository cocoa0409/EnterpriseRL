extended_policies:
  - id: service_ext_out_of_hours_surcharge
    base_policy_refs: [service_attendance_and_cancellation, service_labour_pricing, service_appointment_scheduling]
    overwrite:
      - base_policy: service_appointment_scheduling
        superseded_clause: >-
          Work outside the service's ordinary hours or at a weekend carries the service's surcharge on the
          labour
        replaced_by: >-
          Where write-offs already stand on the job, the write-offs recorded on it come off the labour before
          the surcharge is worked out
    trigger: state_due
    subject: [service_fee_charge]
    computes: surcharge_amount
    target_tool: bill_out_of_hours_surcharge_9a215bff
    params: {}
    rule: >
      Where an attendance on a job was carried out at a weekend or outside the service's ordinary hours, the
      surcharge that attendance adds is booked as a charge of its own against the line of work it belongs to,
      and it is booked once for that attendance. The surcharge booked for an attendance is the labour standing
      on the job for it, taken as it was booked, multiplied by the surcharge percent that applies to the day
      the surcharge is booked and divided by one hundred, and the figure is rounded to the nearest cent. An
      attendance whose day falls from Monday to Friday and whose slot stood in a window inside the service's
      ordinary hours carries no surcharge on its labour, so nothing is added for it. The day whose surcharge
      percent is read is settled first. Where the slot booked for the job has been moved at least once since
      the work was asked for and the job carries labour for two or more attendances, the day of the latest
      attendance carrying labour is the day read; where the slot has never been moved, the day the slot stands
      booked for is the day read. Where neither of those situations holds, the surcharge percent that applies
      to the day the surcharge is booked is read. The surcharge percent is the service's weekend surcharge
      percent where that day falls on a Saturday or a Sunday and the slot booked for the attendance stood in a
      window other than the evening; it is the service's after-hours surcharge percent where that day falls
      from Monday to Friday and the slot booked for the attendance stood in the evening. The weekend percent
      and the after-hours percent are never both applied to the same hour, so exactly one of them is read for
      an attendance, and where neither situation holds no surcharge at all is read. The labour the surcharge is
      worked out on is chosen attendance by attendance: where the job carries labour for two or more
      attendances and a part was ordered for it, the labour booked for the day the crew was last sent out is
      the figure taken; where the job carries labour for two or more attendances and no part was ordered for
      it, the labour booked for the day the slot stands booked for is the figure taken. Where neither of those
      situations holds, the labour standing on the job for it is the figure taken. That figure is then taken as
      follows. Where write-offs already stand on the job, the write-offs recorded on it come off the labour
      before the surcharge is worked out; where no write-off stands on the job and the labour was booked at a
      rate other than the service's own hourly rate, the labour the surcharge acts on is restated as the hours
      recorded on the latest labour entry multiplied by the service's hourly rate. Where neither of those
      situations holds, the labour is taken as it was booked. A surcharge is never booked against work the
      customer is not billed for at all.
    prerequisite: []
    cross_category: []
    compute:
      - labour_lines: "COUNT('service_events', event_type='service_labour_charge')"
      - parts_orders: "COUNT('service_events', event_type='service_parts_order_record')"
      - labour_all: "SUM('service_events','charge_amount', event_type='service_labour_charge')"
      - labour_slot_day: "SUM('service_events','charge_amount', event_type='service_labour_charge', visit_date=F('scheduled_date'))"
      - labour_last_sent: "SUM('service_events','charge_amount', event_type='service_labour_charge', visit_date=F('dispatched_date'))"
      - labour_base: "labour_last_sent if (labour_lines >= 2 and parts_orders >= 1) else (labour_slot_day if labour_lines >= 2 else labour_all)"
      - job_waivers: "SUM('service_events','waiver_amount', event_type='service_waiver')"
      - hours_recorded: "LATEST('service_events','labour_hours', date_field='visit_date', event_type='service_labour_charge')"
      - rate_recorded: "LATEST('service_events','hourly_rate', date_field='visit_date', event_type='service_labour_charge')"
      - net_base: "MX(labour_base - job_waivers, 0) if job_waivers > 0 else (hours_recorded * P('base_labour_rate_usd_per_hour') if rate_recorded != P('base_labour_rate_usd_per_hour') else labour_base)"
      - rate_day: "LATEST('service_events','visit_date', date_field='visit_date', event_type='service_labour_charge') if (F('reschedule_count') >= 1 and labour_lines >= 2) else (F('scheduled_date') if F('reschedule_count') == 0 else NOW)"
      - attendance_dow: "DAYS('2026-01-04', rate_day) % 7"
      - rate_pct: "P('weekend_surcharge_pct') if ((attendance_dow == 6 or attendance_dow == 0) and F('scheduled_window') != 'evening') else (P('after_hours_surcharge_pct') if (attendance_dow > 0 and attendance_dow < 6 and F('scheduled_window') == 'evening') else 0)"
      - result: "RND(net_base * rate_pct / 100, 2)"
    compute_basis:
      labour_lines: "The labour the surcharge is worked out on is chosen attendance by attendance: where the job carries labour for two or more attendances and a part was ordered for it, the labour booked for the day the crew was last sent out is the figure taken"
      parts_orders: "where the job carries labour for two or more attendances and no part was ordered for it, the labour booked for the day the slot stands booked for is the figure taken"
      labour_all: "Where neither of those situations holds, the labour standing on the job for it is the figure taken"
      labour_slot_day: "the labour booked for the day the slot stands booked for is the figure taken"
      labour_last_sent: "the labour booked for the day the crew was last sent out is the figure taken"
      labour_base: "The labour the surcharge is worked out on is chosen attendance by attendance"
      job_waivers: "Where write-offs already stand on the job, the write-offs recorded on it come off the labour before the surcharge is worked out"
      hours_recorded: "the labour the surcharge acts on is restated as the hours recorded on the latest labour entry multiplied by the service's hourly rate"
      rate_recorded: "where no write-off stands on the job and the labour was booked at a rate other than the service's own hourly rate"
      net_base: "That figure is then taken as follows"
      rate_day: "The day whose surcharge percent is read is settled first"
      attendance_dow: "The surcharge percent is the service's weekend surcharge percent where that day falls on a Saturday or a Sunday"
      rate_pct: "it is the service's after-hours surcharge percent where that day falls from Monday to Friday and the slot booked for the attendance stood in the evening"
      result: "multiplied by the surcharge percent that applies to the day the surcharge is booked and divided by one hundred, and the figure is rounded to the nearest cent"
    factors:
      - id: surcharge_percent_read
        effect: parameter
        decides: rate_pct
        bindings: [attendance_dow, rate_pct]
        ladder:
          - when: "the day read falls on a Saturday or a Sunday and the slot booked for the attendance stood in a window other than the evening"
            value: "the service's weekend surcharge percent"
          - when: "the day read falls from Monday to Friday and the slot booked for the attendance stood in the evening"
            value: "the service's after-hours surcharge percent"
          - when: "otherwise"
            value: "no surcharge at all"
        baseline:
          rate_pct: "0"
        evidence: [date, tier_param]
        cross_difficulty: null
      - id: surcharge_labour_figure
        effect: parameter
        decides: labour_base
        bindings: [labour_lines, parts_orders, labour_all, labour_slot_day, labour_last_sent, labour_base]
        ladder:
          - when: "the job carries labour for two or more attendances and a part was ordered for it"
            value: "the labour booked for the day the crew was last sent out"
          - when: "the job carries labour for two or more attendances and no part was ordered for it"
            value: "the labour booked for the day the slot stands booked for"
          - when: "otherwise"
            value: "the labour standing on the job"
        baseline:
          labour_base: "labour_all"
        evidence: [history]
        cross_difficulty: null
      - id: surcharge_base_restatement
        effect: method
        decides: net_base
        bindings: [job_waivers, hours_recorded, rate_recorded, net_base]
        ladder:
          - when: "write-offs already stand on the job"
            method: "the write-offs recorded on the job come off the labour figure before the surcharge is worked out"
          - when: "no write-off stands on the job and the labour was booked at a rate other than the service's own hourly rate"
            method: "the labour figure is restated as the hours recorded on the latest labour entry multiplied by the service's hourly rate"
          - when: "otherwise"
            method: "the labour figure is taken as it was booked"
        baseline:
          net_base: "labour_base"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: surcharge_day_anchor
        effect: method
        decides: rate_day
        bindings: [rate_day]
        ladder:
          - when: "the slot booked for the job has been moved at least once since the work was asked for and the job carries labour for two or more attendances"
            method: "the surcharge percent is read for the day of the latest attendance carrying labour"
          - when: "the slot has never been moved"
            method: "the surcharge percent is read for the day the slot stands booked for"
          - when: "otherwise"
            method: "the surcharge percent is read for the day the surcharge is booked"
        baseline:
          rate_day: "NOW"
        evidence: [history, date]
        cross_difficulty: null
    baseline:
      rule: >-
        The surcharge booked for an attendance is the labour standing on the job for it, taken as it was
        booked, multiplied by the surcharge percent that applies to the day the surcharge is booked and
        divided by one hundred, and the figure is rounded to the nearest cent. An attendance whose day falls
        from Monday to Friday and whose slot stood in a window inside the service's ordinary hours carries no
        surcharge on its labour, so nothing is added for it. A surcharge is never booked against work the
        customer is not billed for at all.
      params: []
    inputs:
      history:
        - {table: service_events, aggregate: count, field: service_event_id, within_months: null, filters: {event_type: service_labour_charge}}
        - {table: service_events, aggregate: sum, field: charge_amount, within_months: null, filters: {event_type: service_labour_charge}}
        - {table: service_events, aggregate: sum, field: waiver_amount, within_months: null, filters: {event_type: service_waiver}}
        - {table: service_events, aggregate: latest, field: visit_date, within_months: null, filters: {event_type: service_labour_charge}}
      cross_category: []
  - id: service_ext_membership_service_relief
    base_policy_refs: [service_charge_waivers, service_combo_plan_membership_interaction, service_labour_pricing]
    overwrite:
      - base_policy: service_combo_plan_membership_interaction
        superseded_clause: >-
          the membership tier's repair labour discount is taken off the chargeable labour before any surcharge
          is added
        replaced_by: >-
          Where the labour was billed before the discount had been taken off it, the relief covers the same
          share of the surcharge booked on that labour as it covers of the labour itself, and the labour that
          share is worked out on is the labour the customer is actually charged for.
      - base_policy: service_combo_plan_membership_interaction
        superseded_clause: >-
          and the membership's service benefit credit may then be spent against what is left
        replaced_by: >-
          The credit set against what is left is the lower of the credit available on the membership and the
          credit the membership year still allows for service work, so no redemption already netted out of the
          membership's own balance is deducted from that balance a second time.
      - base_policy: service_combo_plan_membership_interaction
        superseded_clause: >-
          A membership standing in grace on a tier that suspends benefits gives neither the discount nor the
          credit, and the charge stands in full
        replaced_by: >-
          A Circle membership that does not stand active on the profile, whether it sits in grace with dues
          unpaid or has lapsed altogether, gives neither the discount nor the credit on this job, and the
          charge stands in full.
      - base_policy: service_charge_waivers
        superseded_clause: >-
          A write-off never exceeds the charge outstanding on the line it is granted against
        replaced_by: >-
          The relief is rounded to the nearest cent and never exceeds the charges standing unsettled on the job,
          which are every charge booked on it less every payment received and every amount already written off,
          and it is never below nothing.
    trigger: state_due
    subject: [service_waiver]
    computes: waiver_amount
    target_tool: writeoff_service_charge_816a24da
    params: {}
    rule: >
      A write-off granted on the membership ground sets the membership's service credit against the charges
      standing unsettled on the job, and adds to it the share of the job's chargeable labour that the
      membership's own discount should have taken off. The relief is worked out only after the surcharge entry
      owed for the attendance it covers stands on the job's account. The labour the relief is worked out on is
      the labour standing on the job less the payments already received against it. Where a payment has already
      been received on the job and the job carries labour for two or more attendances, the labour booked for
      the day the crew was last sent out is taken instead; where no payment has been received on the job, every
      labour charge standing on the job is taken instead. No part of a surcharge booked on that labour is taken
      into the relief. Where a surcharge stands booked on the job for the day the crew was last sent out, that
      surcharge is taken into the relief; where a surcharge stands booked on the job only for the day the job
      was held for parts, that earlier surcharge is taken into the relief. Where the labour was billed before
      the discount had been taken off it, the relief covers the same share of the surcharge booked on that
      labour as it covers of the labour itself, and the labour that share is worked out on is the labour the
      customer is actually charged for. That labour is taken into the share as it stands. Where a write-off
      granted on a plan's cover stands on the job, no part of that labour is taken into the share at all,
      since labour a plan has covered is already free and a discount on it would mean nothing; where
      write-offs on another ground stand on the job and none granted on a plan's cover does, the share is
      worked out on that labour less what those write-offs have already taken off it, since the discount is
      given on the labour the customer is charged for. Nothing of that labour is taken into the relief. Where the
      attendance was a rework of work already signed off and the job itself was raised as a rework, one hundred
      percent of the labour figure and the surcharge figure is taken into the relief; where a Circle membership
      stands active on the profile and its tier carries a repair labour discount, that tier's repair labour
      discount percent is taken into the relief instead. The share is applied to the labour figure and the
      surcharge figure added together, and the outcome is rounded to the nearest cent. The credit available on
      the membership is the service visit credit its tier grants. Where no Circle membership stands active on
      the profile, nothing of a membership's credit is available to set against what is left; where a Circle
      membership stands active on the profile and its unspent benefit credit is below the service visit credit
      its tier grants, that unspent benefit credit is the credit available instead. Where no Circle membership
      stands active on the profile, the tier figures a membership would have supplied — its service visit
      credit, its unspent credit and the redemptions its tier allows in a year — are all taken as nothing, and
      the windows below are counted as one month. A Circle membership that does not stand active on the
      profile, whether it sits in grace with dues unpaid or has lapsed altogether, gives neither the discount
      nor the credit on this job, and the charge stands in full. The credit the membership year still allows for service work
      is the service visit credit the tier grants less the credit already spent inside the window, and never
      below nothing. The credit set against what is left is the lower of the credit available on the membership
      and the credit the membership year still allows for service work, so no redemption already netted out of
      the membership's own balance is deducted from that balance a second time. The redemptions of the
      membership year are counted over the twelve months ending on the day the relief is granted. Where the
      membership's current term began within the last twelve months and the membership stands active, they are
      counted over the months since that term began instead, and never fewer than one month; where the tier now
      recorded on the membership took effect within the last twelve months, they are counted over the months
      since that tier took effect instead, and never fewer than one month. The relief is rounded to the
      nearest cent and never
      exceeds the charges standing unsettled on the job, which are every charge booked on it less every payment
      received and every amount already written off, and it is never below nothing.
    prerequisite:
      - problem: service_ext_out_of_hours_surcharge
        kind: value_input
        gate: surcharge_scope
        form: state
        policy_source: >-
          The relief is worked out only after the surcharge entry owed for the attendance it covers stands on
          the job's account.
        condition: >-
          a service history entry standing on the job carries an out-of-hours surcharge for the day the crew
          was last sent out
        resolved_by: bill_out_of_hours_surcharge_9a215bff
        effect: >-
          once that surcharge entry stands on the job, the surcharge figure the relief covers changes from
          nothing to the surcharge booked for the day the crew was last sent out
    cross_category:
      - category: membership
        as: branch
        reads: [status, variant_name, benefit_credit_balance, current_term_start, tier_effective_date, membership_events.benefit_amount]
        note: The Circle membership's standing, its tier figures and its benefit redemption ledger decide the labour share relieved, the credit available and what the membership year still allows.
    compute:
      - charges_total: "SUM('service_events','charge_amount')"
      - payments_total: "SUM('service_events','payment_amount')"
      - waivers_total: "SUM('service_events','waiver_amount')"
      - labour_lines: "COUNT('service_events', event_type='service_labour_charge')"
      - payments_count: "COUNT('service_events', event_type='service_payment')"
      - labour_total: "SUM('service_events','charge_amount', event_type='service_labour_charge')"
      - labour_last_sent: "SUM('service_events','charge_amount', event_type='service_labour_charge', visit_date=F('dispatched_date'))"
      - labour_scope: "labour_last_sent if (payments_count >= 1 and labour_lines >= 2) else (labour_total if payments_count == 0 else MX(labour_total - payments_total, 0))"
      - plan_cover_waivers: "SUM('service_events','waiver_amount', event_type='service_waiver', waiver_reason='protection_plan_covered')"
      - other_waivers: "MX(waivers_total - plan_cover_waivers, 0)"
      - discount_base: "0 if plan_cover_waivers > 0 else (MX(labour_scope - other_waivers, 0) if other_waivers > 0 else labour_scope)"
      - surcharge_rows: "COUNT('service_events', event_type='service_fee_charge', charge_kind='after_hours_surcharge')"
      - surcharge_last_sent: "SUM('service_events','charge_amount', event_type='service_fee_charge', charge_kind='after_hours_surcharge', visit_date=F('dispatched_date'))"
      - surcharge_hold_day: "SUM('service_events','charge_amount', event_type='service_fee_charge', charge_kind='after_hours_surcharge', visit_date=F('parts_hold_started_date'))"
      - surcharge_scope: "surcharge_last_sent if (surcharge_rows >= 1 and surcharge_last_sent > 0) else (surcharge_hold_day if surcharge_rows >= 1 else 0)"
      - rework_rows: "COUNT('service_events', event_type='service_rework_open')"
      - membership_active: "EXISTS('membership', status='active')"
      - relief_rate: "100 if (rework_rows >= 1 and F('work_type') == 'rework') else (CPARAM('membership','repair_labour_discount_pct', status='active') if (membership_active and CPARAM('membership','repair_labour_discount_pct', status='active') > 0) else 0)"
      - discount_owed: "RND((discount_base + surcharge_scope) * relief_rate / 100, 2)"
      - tier_credit: "CPARAM('membership','service_benefit_credit_usd', status='active') if membership_active else 0"
      - credit_balance: "CFIELD('membership','benefit_credit_balance', status='active') if membership_active else 0"
      - credit_available: "0 if not membership_active else (credit_balance if credit_balance < tier_credit else tier_credit)"
      - months_since_term: "MONTHS(CFIELD('membership','current_term_start', status='active'), NOW) if membership_active else 0"
      - months_since_tier: "MONTHS(CFIELD('membership','tier_effective_date', status='active'), NOW) if membership_active else 0"
      - window_months: "MX(months_since_term, 1) if (months_since_term <= 12 and membership_active) else (MX(months_since_tier, 1) if months_since_tier <= 12 else 12)"
      - credit_spent_window: "XSUM('membership','membership_events','benefit_amount', within_months=window_months, event_type='membership_benefit_redeem')"
      - year_allowance: "MX(tier_credit - credit_spent_window, 0)"
      - credit_applied: "MN(credit_available, year_allowance)"
      - outstanding_all: "MX(charges_total - payments_total - waivers_total, 0)"
      - result: "MN(MX(RND(discount_owed + credit_applied, 2), 0), outstanding_all)"
    compute_basis:
      charges_total: "never exceeds the charges standing unsettled on the job, which are every charge booked on it less every payment received and every amount already written off"
      payments_total: "The labour the relief is worked out on is the labour standing on the job less the payments already received against it"
      waivers_total: "less every payment received and every amount already written off"
      labour_lines: "Where a payment has already been received on the job and the job carries labour for two or more attendances, the labour booked for the day the crew was last sent out is taken instead"
      payments_count: "where no payment has been received on the job, every labour charge standing on the job is taken instead"
      labour_total: "every labour charge standing on the job is taken instead"
      labour_last_sent: "the labour booked for the day the crew was last sent out is taken instead"
      labour_scope: "The labour the relief is worked out on is the labour standing on the job less the payments already received against it"
      plan_cover_waivers: "Where a write-off granted on a plan's cover stands on the job, no part of that labour is taken into the share at all"
      other_waivers: "where write-offs on another ground stand on the job and none granted on a plan's cover does, the share is worked out on that labour less what those write-offs have already taken off it"
      discount_base: "That labour is taken into the share as it stands"
      surcharge_rows: "Where a surcharge stands booked on the job for the day the crew was last sent out, that surcharge is taken into the relief"
      surcharge_last_sent: "that surcharge is taken into the relief"
      surcharge_hold_day: "where a surcharge stands booked on the job only for the day the job was held for parts, that earlier surcharge is taken into the relief"
      surcharge_scope: "No part of a surcharge booked on that labour is taken into the relief"
      rework_rows: "Where the attendance was a rework of work already signed off and the job itself was raised as a rework, one hundred percent of the labour figure and the surcharge figure is taken into the relief"
      membership_active: "where a Circle membership stands active on the profile and its tier carries a repair labour discount, that tier's repair labour discount percent is taken into the relief instead"
      relief_rate: "Nothing of that labour is taken into the relief"
      discount_owed: "The share is applied to the labour figure and the surcharge figure added together, and the outcome is rounded to the nearest cent"
      tier_credit: "The credit available on the membership is the service visit credit its tier grants"
      credit_balance: "where a Circle membership stands active on the profile and its unspent benefit credit is below the service visit credit its tier grants, that unspent benefit credit is the credit available instead"
      credit_available: "Where no Circle membership stands active on the profile, nothing of a membership's credit is available to set against what is left"
      months_since_term: "Where the membership's current term began within the last twelve months and the membership stands active, they are counted over the months since that term began instead, and never fewer than one month"
      months_since_tier: "where the tier now recorded on the membership took effect within the last twelve months, they are counted over the months since that tier took effect instead, and never fewer than one month"
      window_months: "The redemptions of the membership year are counted over the twelve months ending on the day the relief is granted"
      credit_spent_window: "the service visit credit the tier grants less the credit already spent inside the window"
      year_allowance: "The credit the membership year still allows for service work is the service visit credit the tier grants less the credit already spent inside the window, and never below nothing"
      credit_applied: "The credit set against what is left is the lower of the credit available on the membership and the credit the membership year still allows for service work"
      outstanding_all: "The relief is rounded to the nearest cent and never exceeds the charges standing unsettled on the job"
      result: "and adds to it the share of the job's chargeable labour that the membership's own discount should have taken off"
    factors:
      - id: labour_relief_share
        effect: parameter
        decides: relief_rate
        bindings: [rework_rows, membership_active, relief_rate]
        ladder:
          - when: "the attendance was a rework of work already signed off and the job itself was raised as a rework"
            value: "one hundred percent of the labour figure and the surcharge figure"
          - when: "a Circle membership stands active on the profile and its tier carries a repair labour discount"
            value: "the membership tier's repair labour discount percent"
          - when: "otherwise"
            value: "nothing"
        baseline:
          relief_rate: "0"
        evidence: [history, cross_category]
        cross_difficulty: membership
      - id: relief_labour_figure
        effect: parameter
        decides: labour_scope
        bindings: [labour_lines, payments_count, labour_total, labour_last_sent, labour_scope]
        ladder:
          - when: "a payment has already been received on the job and the job carries labour for two or more attendances"
            value: "the labour booked for the day the crew was last sent out"
          - when: "no payment has been received on the job"
            value: "every labour charge standing on the job"
          - when: "otherwise"
