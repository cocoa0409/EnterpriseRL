  - id: service_ext_declined_claim_labour_rebill
    base_policy_refs: [service_labour_pricing, service_combo_plan_membership_interaction, service_excl_warranty_or_chargeable, service_diagnostic_scope]
    overwrite:
      - base_policy: service_excl_warranty_or_chargeable
        superseded_clause: >-
          A customer cannot be billed for labour on a line whose charge has been written off as plan covered
        replaced_by: >-
          The write-off the plan's cover carried is not set against the rebilled figure.
      - base_policy: service_labour_pricing
        superseded_clause: >-
          raised to the service's minimum hours
        replaced_by: >-
          Where the line carries labour for more than one attendance day and the service requires two people to
          attend, the service's minimum hours are applied to the day the crew was dispatched and to the hours of the
          line's later attendances taken together, and the two raised figures are added
    trigger: state_due
    subject: [service_labour_charge]
    computes: labour_amount
    target_tool: bill_uncovered_device_labour_51108cc0
    params: {}
    rule: >
      Where a plan's decision refuses a claim after the work was carried out as plan work, the labour of
      that line is rebilled to the customer as chargeable work. The write-off the plan's cover carried is
      not set against the rebilled figure. The attendances of the refused line are counted from the labour entries
      standing on the job other than those booked for the day the job was completed, and the entry the rebill
      books is stamped with the day the crew was dispatched, whatever attendances of that line its hours were
      drawn from. The hours rebilled are the hours recorded for the day the crew was dispatched. Where the line
      the plan refused carries labour for more than one attendance day, the hours recorded on the job less the
      hours recorded for the day it was completed are taken instead; where that line carries labour for one
      attendance day, the hours recorded on the job are taken instead. The service's minimum hours are applied
      once to the hours taken. Where the line carries labour for more than one attendance day and the service
      requires two people to attend, the service's minimum hours are applied to the day the crew was
      dispatched and to the hours of the line's later attendances taken together, and the two raised figures
      are added; where the line carries labour for one attendance day and the service requires two people to
      attend, the service's
      minimum hours are doubled and applied to that attendance. The rate is the rate recorded on the labour of
      the day the crew was dispatched. Where that labour was recorded at any rate other than the service's own
      hourly rate, the service's own hourly rate is the rate instead; where that labour was recorded at the
      service's own rate, the slot for the work stood in the evening and no out-of-hours surcharge stands booked
      on the job, the service's own hourly rate raised by its after-hours surcharge percent is the rate
      instead, and where such a surcharge does stand booked on the job the rate is not raised, so the same hour
      never carries the surcharge twice. The hours and the rate are multiplied and the outcome rounded to the
      nearest cent, and the entry the rebill books carries those hours and that rate, while the amount billed
      on it is that gross figure less the credit allowed below. What the gross figure is rebilled at is settled next: the gross figure less what the plan has already
      paid out on the item, never below nothing and never more than the per-claim limit the plan carries, is
      rebilled. Where no plan stands active on the item there is no per-claim limit and no refused claim, so
      nothing is rebilled under this rule at all. Where the plan covering the item stands active and the decision recorded against its claim
      refused the claim, the whole of the gross figure is rebilled, to the extent of the per-claim limit the
      plan carries, because a claim never asks the plan for more than that limit; where the plan covering the
      item stands active and the decision recorded against its claim approved a repair, nothing is rebilled.
      From the figure rebilled come the write-offs that already stand on the job. Where a write-off granted on
      the plan's cover stands on the job, nothing comes off; where write-offs granted as a goodwill gesture
      stand on the job and none granted on the plan's cover does, those goodwill write-offs come off. Nothing
      is credited for a diagnostic fee. Where the diagnostic fees standing on the job are more than the figure
      being rebilled, the figure being rebilled is credited in full, so nothing is left to bill; where a
      diagnostic fee stands on the job and every diagnosis recorded on it found a fault, the diagnostic fees
      standing on the job are credited in full. What remains after those deductions, rounded to the nearest cent
      and never below nothing, is the labour billed on the line, and the line is billed to the customer once and
      is not claimed from the plan again.
    prerequisite: []
    cross_category:
      - category: protection
        as: branch
        reads: [status, per_claim_limit_usd, protection_events.claim_decision, protection_events.payout_amount]
        note: The ShieldCare plan's standing, the decision recorded against its claim, its per-claim limit and what it has already paid out on the item decide how much of the gross figure is rebilled to the customer.
    compute:
      - labour_lines_all: "COUNT('service_events', event_type='service_labour_charge')"
      - labour_lines_completed: "COUNT('service_events', event_type='service_labour_charge', visit_date=F('completed_date'))"
      - line_attendances: "labour_lines_all - labour_lines_completed"
      - hours_all: "SUM('service_events','labour_hours', event_type='service_labour_charge')"
      - hours_completed_day: "SUM('service_events','labour_hours', event_type='service_labour_charge', visit_date=F('completed_date'))"
      - hours_dispatch_day: "SUM('service_events','labour_hours', event_type='service_labour_charge', visit_date=F('dispatched_date'))"
      - hours_selected: "MX(hours_all - hours_completed_day, 0) if line_attendances >= 2 else (hours_all if line_attendances == 1 else hours_dispatch_day)"
      - dispatch_day_rows: "COUNT('service_events', event_type='service_labour_charge', visit_date=F('dispatched_date'))"
      - hours_second: "MX(hours_selected - hours_dispatch_day, 0)"
      - hours_billed: "MX(hours_dispatch_day, P('minimum_labour_hours')) + (MX(hours_second, P('minimum_labour_hours')) if hours_second > 0 else 0) if (line_attendances >= 2 and dispatch_day_rows >= 1 and P('two_person_crew_required')) else (MX(hours_selected, P('minimum_labour_hours') * 2) if (line_attendances == 1 and P('two_person_crew_required')) else MX(hours_selected, P('minimum_labour_hours')))"
      - rate_dispatch_day: "LATEST('service_events','hourly_rate', date_field='visit_date', event_type='service_labour_charge', visit_date=F('dispatched_date'))"
      - surcharge_rows_on_job: "COUNT('service_events', event_type='service_fee_charge', charge_kind='after_hours_surcharge')"
      - rebill_rate: "P('base_labour_rate_usd_per_hour') if rate_dispatch_day != P('base_labour_rate_usd_per_hour') else (P('base_labour_rate_usd_per_hour') * (1 + P('after_hours_surcharge_pct') / 100) if (F('scheduled_window') == 'evening' and surcharge_rows_on_job == 0) else rate_dispatch_day)"
      - gross: "RND(hours_billed * rebill_rate, 2)"
      - plan_active: "EXISTS('protection', status='active')"
      - last_decision: "XLATEST('protection','protection_events','claim_decision', date_field='event_date', event_type='protection_claim_decision')"
      - claim_limit: "CPARAM('protection','per_claim_limit_usd', status='active') if plan_active else 0"
      - payouts_item: "XSUM('protection','protection_events','payout_amount', event_type='protection_claim_payout')"
      - rebilled_base: "MN(gross, claim_limit) if (plan_active and (last_decision == 'denied_not_covered' or last_decision == 'denied_outside_term' or last_decision ==
      'denied_no_proof_of_purchase' or last_decision == 'denied_pre_existing')) else (0 if (plan_active and last_decision == 'approved_repair') else MN(MX(gross - payouts_item, 0), claim_limit))"
      - plan_writeoffs: "SUM('service_events','waiver_amount', event_type='service_waiver', waiver_reason='protection_plan_covered')"
      - goodwill_writeoffs: "SUM('service_events','waiver_amount', event_type='service_waiver', waiver_reason='goodwill')"
      - all_writeoffs: "SUM('service_events','waiver_amount', event_type='service_waiver')"
      - writeoff_offset: "0 if plan_writeoffs > 0 else (goodwill_writeoffs if goodwill_writeoffs > 0 else all_writeoffs)"
      - diag_fees: "SUM('service_events','charge_amount', event_type='service_fee_charge', charge_kind='diagnostic_fee')"
      - no_fault_diags: "COUNT('service_events', event_type='service_diagnostic_record', diagnostic_code='no_fault_found')"
      - diag_credit: "rebilled_base if diag_fees > rebilled_base else (diag_fees if (diag_fees > 0 and no_fault_diags == 0) else 0)"
      - result: "MX(RND(rebilled_base - writeoff_offset - diag_credit, 2), 0)"
    compute_basis:
      labour_lines_all: "The attendances of the refused line are counted from the labour entries standing on the job other than those booked for the day the job was completed"
      labour_lines_completed: "other than those booked for the day the job was completed"
      line_attendances: "The attendances of the refused line are counted from the labour entries standing on the job"
      hours_all: "the hours recorded on the job less the hours recorded for the day it was completed are taken instead"
      hours_completed_day: "less the hours recorded for the day it was completed"
      hours_dispatch_day: "The hours rebilled are the hours recorded for the day the crew was dispatched"
      hours_selected: "Where the line the plan refused carries labour for more than one attendance day, the hours recorded on the job less the hours recorded for the day it was completed are taken instead"
      dispatch_day_rows: "the service's minimum hours are applied to the day the crew was dispatched and to
      the hours of the line's later attendances taken together, and the two raised figures are added"
      hours_second: "the hours of the line's later attendances taken together"
      hours_billed: "The service's minimum hours are applied once to the hours taken"
      rate_dispatch_day: "The rate is the rate recorded on the labour of the day the crew was dispatched"
      surcharge_rows_on_job: "where such a surcharge does stand booked on the job the rate is not raised, so the same hour never carries the surcharge twice"
      rebill_rate: "Where that labour was recorded at any rate other than the service's own hourly rate, the service's own hourly rate is the rate instead"
      gross: "The hours and the rate are multiplied and the outcome rounded to the nearest cent"
      plan_active: "Where the plan covering the item stands active and the decision recorded against its claim refused the claim, the whole of the gross figure is rebilled, to the extent of the per-claim limit the plan carries"
      last_decision: "where the plan covering the item stands active and the decision recorded against its claim approved a repair, nothing is rebilled"
      claim_limit: "Where no plan stands active on the item there is no per-claim limit and no refused
      claim, so nothing is rebilled under this rule at all"
      payouts_item: "the gross figure less what the plan has already paid out on the item, never below nothing and never more than the per-claim limit the plan carries, is rebilled"
      rebilled_base: "What the gross figure is rebilled at is settled next"
      plan_writeoffs: "Where a write-off granted on the plan's cover stands on the job, nothing comes off"
      goodwill_writeoffs: "where write-offs granted as a goodwill gesture stand on the job and none granted on the plan's cover does, those goodwill write-offs come off"
      all_writeoffs: "From the figure rebilled come the write-offs that already stand on the job"
      writeoff_offset: "From the figure rebilled come the write-offs that already stand on the job"
      diag_fees: "where a diagnostic fee stands on the job and every diagnosis recorded on it found a fault, the diagnostic fees standing on the job are credited in full"
      no_fault_diags: "every diagnosis recorded on it found a fault"
      diag_credit: "Nothing is credited for a diagnostic fee"
      result: "What remains after those deductions, rounded to the nearest cent and never below nothing, is the labour billed on the line"
    factors:
      - id: rebill_hourly_rate
        effect: parameter
        decides: rebill_rate
        bindings: [rate_dispatch_day, surcharge_rows_on_job, rebill_rate]
        ladder:
          - when: "the labour of the day the crew was dispatched was recorded at any rate other than the service's own hourly rate"
            value: "the service's own hourly rate"
          - when: "that labour was recorded at the service's own rate, the slot for the work stood in the evening and no out-of-hours surcharge stands booked on the job"
            value: "the service's own hourly rate raised by its after-hours surcharge percent"
          - when: "otherwise"
            value: "the rate recorded on the labour of the day the crew was dispatched"
        baseline:
          rebill_rate: "rate_dispatch_day"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: rebilled_hours_selection
        effect: method
        decides: hours_selected
        bindings: [labour_lines_all, labour_lines_completed, line_attendances, hours_all, hours_completed_day, hours_dispatch_day, hours_selected]
        ladder:
          - when: "the line the plan refused carries labour for more than one attendance day"
            method: "the hours recorded on the job are added and the hours recorded for the day it was completed are taken off them"
          - when: "that line carries labour for one attendance day"
            method: "the hours recorded on the job are taken as they stand"
          - when: "otherwise"
            method: "only the hours recorded for the day the crew was dispatched are taken"
        baseline:
          hours_selected: "hours_dispatch_day"
        evidence: [history, date]
        cross_difficulty: null
      - id: minimum_hours_application
        effect: method
        decides: hours_billed
        bindings: [dispatch_day_rows, hours_second, hours_billed]
        ladder:
          - when: "the line carries labour for more than one attendance day and the service requires two people to attend"
            method: "the service's minimum hours are applied to the day the crew was dispatched and to the hours of the line's later attendances taken together, and the two raised figures are added"
          - when: "the line carries labour for one attendance day and the service requires two people to attend"
            method: "the service's minimum hours are doubled and applied to that attendance"
          - when: "otherwise"
            method: "the service's minimum hours are applied once to the hours taken"
        baseline:
          hours_billed: "MX(hours_selected, P('minimum_labour_hours'))"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: rebilled_share_after_decision
        effect: parameter
        decides: rebilled_base
        bindings: [plan_active, last_decision, claim_limit, payouts_item, rebilled_base]
        ladder:
          - when: "the plan covering the item stands active and the decision recorded against its claim refused the claim"
            value: "the whole of the gross figure, to the extent of the per-claim limit the plan carries"
          - when: "the plan covering the item stands active and the decision recorded against its claim approved a repair"
            value: "nothing"
          - when: "otherwise"
            value: "the gross figure less what the plan has already paid out on the item, held to the per-claim limit the plan carries"
        baseline:
          rebilled_base: "MN(MX(gross - payouts_item, 0), claim_limit)"
        evidence: [cross_category, history]
        cross_difficulty: protection
      - id: standing_writeoff_offset
        effect: parameter
        decides: writeoff_offset
        bindings: [plan_writeoffs, goodwill_writeoffs, all_writeoffs, writeoff_offset]
        ladder:
          - when: "a write-off granted on the plan's cover stands on the job"
            value: "nothing"
          - when: "write-offs granted as a goodwill gesture stand on the job and none granted on the plan's cover does"
            value: "those goodwill write-offs"
          - when: "otherwise"
            value: "the write-offs standing on the job"
        baseline:
          writeoff_offset: "all_writeoffs"
        evidence: [history]
        cross_difficulty: null
      - id: diagnostic_fee_credit
        effect: parameter
        decides: diag_credit
        bindings: [diag_fees, no_fault_diags, diag_credit]
        ladder:
          - when: "the diagnostic fees standing on the job are more than the figure being rebilled"
            value: "the figure being rebilled in full"
          - when: "a diagnostic fee stands on the job and every diagnosis recorded on it found a fault"
            value: "the diagnostic fees standing on the job"
          - when: "otherwise"
            value: "nothing"
        baseline:
          diag_credit: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        Where a plan's decision refuses a claim after the work was carried out as plan work, the labour of
        that line is rebilled to the customer as chargeable work. The attendances of the refused line are counted from the labour entries
        standing on the job other than those booked for the day the job was completed, and the entry the rebill
        books is stamped with the day the crew was dispatched, whatever attendances of that line its hours were
        drawn from. The hours rebilled are the hours recorded for the day the crew was dispatched. The service's
        minimum hours are applied once to the hours taken. The rate is the rate recorded on the labour of the
        day the crew was dispatched. The hours and the rate are multiplied and the outcome rounded to the
        nearest cent, and the entry the rebill books carries those hours and that rate, while the amount billed
        on it is that gross figure less the credit allowed below. What the gross figure is rebilled at is
        settled next: the gross figure less what the plan has already paid out on the item, never below nothing
        and never more than the per-claim limit the plan carries, is rebilled. From the figure rebilled come the
        write-offs that already stand on the job. Nothing is
        credited for a diagnostic fee. What remains after those deductions, rounded to the nearest cent and
        never below nothing, is the labour billed on the line, and the line is billed to the customer once and
        is not claimed from the plan again.
      params: [base_labour_rate_usd_per_hour, minimum_labour_hours, after_hours_surcharge_pct]
    inputs:
      history:
        - {table: service_events, aggregate: sum, field: labour_hours, within_months: null, filters: {event_type: service_labour_charge}}
        - {table: service_events, aggregate: latest, field: hourly_rate, within_months: null, filters: {event_type: service_labour_charge}}
        - {table: service_events, aggregate: sum, field: waiver_amount, within_months: null, filters: {event_type: service_waiver}}
        - {table: service_events, aggregate: sum, field: charge_amount, within_months: null, filters: {event_type: service_fee_charge, charge_kind: diagnostic_fee}}
        - {category: protection, table: protection_events, aggregate: latest, field: claim_decision, within_months: null, filters: {event_type: protection_claim_decision}}
        - {category: protection, table: protection_events, aggregate: sum, field: payout_amount, within_months: null, filters: {event_type: protection_claim_payout}}
      cross_category: [protection]
  - id: service_ext_business_contract_relief
    base_policy_refs: [service_charge_waivers, service_combo_plan_membership_interaction, service_agg_visit_pool, service_visit_allowance]
    overwrite:
      - base_policy: service_charge_waivers
        superseded_clause: >-
          A write-off never exceeds the charge outstanding on the line it is granted against
        replaced_by: >-
          The relief is rounded to the nearest cent, is never below nothing, and never exceeds the charges
          standing unsettled on the job, which are every charge booked on it less every payment received and
          every amount already written off.
      - base_policy: service_agg_visit_pool
        superseded_clause: >-
          Included visits are pooled across the profile rather than counted job by job
        replaced_by: >-
          The pool those visits stand in is read from the visits credited and used on the job the relief is
          granted against.
    trigger: state_due
    subject: [service_waiver]
    computes: relief_amount
    target_tool: credit_contract_relief_ce7af535
    params: {}
    rule: >
      A business profile whose contract carries included visits is relieved of what those visits should have
      covered on a job, together with the attendance charges its contract does not leave with it. The relief is
      fixed only once the chargeable labour the plan's refusal sends back to the customer stands billed on the
      job on the day the relief is granted. The visits taken as creditable are the visits standing in the pool
      of the visit term less the planned visits the service carries each year. Where visits stand in that pool and visits granted under a plan covering the item stand among them,
      every visit standing in the pool is creditable instead; where the visits standing in the pool were
      granted only as a gesture of goodwill, none of them is creditable. The pool those visits stand in is read from the visits credited and used on the job the relief is
      granted against. The share of the chargeable labour those visits relieve is the proportion the visits
      standing in the pool bear to the visits the service includes in its visit term, counted as at least
      one visit.
      Where visits stand creditable and the labour rebilled covers more than one attendance day, the visits
      creditable are set against the attendances rebilled and the share is the attendances they cover divided by
      the attendances rebilled instead; where visits stand creditable and the labour rebilled covers one
      attendance day, the whole of that labour is relieved instead. The attendances rebilled are counted from
      the labour entries standing on the job other than those booked for the day it was completed and those
      booked on the day the relief is granted. That share is applied to the chargeable labour billed on the day
      the relief is granted and the outcome rounded to the nearest cent. To it are added the attendance charges
      the contract does not leave with the business. Nothing of the charge for bringing the crew out is added.
      Where such a charge stands on the job and the labour and parts booked for the day the crew was dispatched
      reach the figure at which the service waives it, that charge is added in full; where such charges stand on
      the job for more than one attendance, only the charge booked for the day the crew was dispatched is added.
      Nothing of the charge for the distance travelled is added. Where such a charge stands on the job for the
      day the crew was dispatched, that charge is added; where such charges stand on the job only for days other
      than the day the crew was dispatched, the charges standing on the job less those booked for the day the
      crew was dispatched are added. Nothing of the fee for moving the slot is added. Where such a fee stands on the job and no write-off
      on the retailer's own error stands against it, that fee is added in full; where such a fee stands on
      the job and a write-off on the retailer's own error stands against it, what is left of that fee after
      that write-off is added. What the plan has met of the same work is then taken off, so that no charge is
      relieved twice on different grounds: what has been written off to the plan's cover on the job is taken off.
      Where the plan covering the item stands active and the decision recorded against its claim refused the
      claim, nothing is taken off, because a refused claim has met nothing of the work; where the plan stands
      active and that decision approved a repair, what the plan has already paid out on the item is taken off.
      The relief is rounded to the nearest cent, is never below nothing, and never exceeds the charges standing
      unsettled on the job, which are every charge booked on it less every payment received and every amount
      already written off.
    prerequisite:
      - problem: service_ext_declined_claim_labour_rebill
        kind: value_input
        gate: labour_rebilled_today
        form: state
        policy_source: >-
          The relief is fixed only once the chargeable labour the plan's refusal sends back to the customer
          stands billed on the job on the day the relief is granted.
        condition: >-
          a chargeable labour entry for the line the plan refused stands on the job, booked on the day the
          relief is granted
        resolved_by: bill_uncovered_device_labour_51108cc0
        effect: >-
          once that labour entry stands on the job, the chargeable labour the share is applied to changes from
          nothing to the figure billed on the day the relief is granted
    cross_category:
      - category: protection
        as: branch
        reads: [status, protection_events.claim_decision, protection_events.payout_amount]
        note: The ShieldCare plan's standing, the decision recorded against its claim and what it has already paid out on the item decide what the plan has met of the same work, which the contract relief does not cover again.
    compute:
      - labour_rebilled_today: "SUM('service_events','charge_amount', event_type='service_labour_charge', event_date=NOW)"
      - grants_term: "SUM('service_events','visits_delta', within_months=P('visit_term_months'), event_type='service_visit_allowance_grant')"
      - uses_term: "ABS(SUM('service_events','visits_delta', within_months=P('visit_term_months'), event_type='service_visit_consume'))"
      - goodwill_grants: "SUM('service_events','visits_delta', within_months=P('visit_term_months'), event_type='service_visit_allowance_grant', visit_grant_reason='goodwill')"
      - plan_grants: "SUM('service_events','visits_delta', within_months=P('visit_term_months'), event_type='service_visit_allowance_grant', visit_grant_reason='plan_included')"
      - pool_left: "MX(grants_term - uses_term, 0)"
      - visits_creditable: "pool_left if (pool_left > 0 and plan_grants > 0) else (0 if goodwill_grants > 0 else MX(pool_left - P('preventive_visits_per_year'), 0))"
      - labour_rows_all: "COUNT('service_events', event_type='service_labour_charge')"
      - labour_rows_completed: "COUNT('service_events', event_type='service_labour_charge', visit_date=F('completed_date'))"
      - labour_rows_today: "COUNT('service_events', event_type='service_labour_charge', event_date=NOW)"
      - attendances_rebilled: "MX(labour_rows_all - labour_rows_completed - labour_rows_today, 0)"
      - covered_share: "(MN(visits_creditable, attendances_rebilled) / attendances_rebilled) if (visits_creditable >= 1 and attendances_rebilled >= 2) else (1 if (visits_creditable >= 1 and attendances_rebilled == 1) else pool_left / MX(P('included_visits_per_term'), 1))"
      - relief_labour: "RND(labour_rebilled_today * covered_share, 2)"
      - trip_rows: "COUNT('service_events', event_type='service_fee_charge', charge_kind='trip_charge')"
      - trip_fees: "SUM('service_events','charge_amount', event_type='service_fee_charge', charge_kind='trip_charge')"
      - trip_fees_dispatch: "SUM('service_events','charge_amount', event_type='service_fee_charge', charge_kind='trip_charge', visit_date=F('dispatched_date'))"
      - labour_parts_dispatch: "SUM('service_events','charge_amount', event_type='service_labour_charge', visit_date=F('dispatched_date')) + SUM('service_events','charge_amount', event_type='service_parts_charge', visit_date=F('dispatched_date'))"
      - trip_relief: "trip_fees if (trip_rows >= 1 and labour_parts_dispatch >= P('trip_charge_waived_above_usd')) else (trip_fees_dispatch if trip_rows >= 2 else 0)"
      - mileage_rows: "COUNT('service_events', event_type='service_fee_charge', charge_kind='out_of_radius_fee')"
      - mileage_fees: "SUM('service_events','charge_amount', event_type='service_fee_charge', charge_kind='out_of_radius_fee')"
      - mileage_dispatch: "SUM('service_events','charge_amount', event_type='service_fee_charge', charge_kind='out_of_radius_fee', visit_date=F('dispatched_date'))"
      - mileage_relief: "mileage_dispatch if mileage_dispatch > 0 else (MX(mileage_fees - mileage_dispatch, 0) if mileage_rows >= 1 else 0)"
      - slot_rows: "COUNT('service_events', event_type='service_fee_charge', charge_kind='reschedule_fee')"
      - slot_fees: "SUM('service_events','charge_amount', event_type='service_fee_charge', charge_kind='reschedule_fee')"
      - slot_error_waivers: "SUM('service_events','waiver_amount', event_type='service_waiver',
      waiver_reason='retailer_error')"
      - slot_fee_relief: "slot_fees if (slot_rows >= 1 and slot_error_waivers == 0) else (MX(slot_fees -
      slot_error_waivers, 0) if slot_error_waivers > 0 else 0)"
      - plan_active: "EXISTS('protection', status='active')"
      - last_decision: "XLATEST('protection','protection_events','claim_decision', date_field='event_date', event_type='protection_claim_decision')"
      - payouts_item: "XSUM('protection','protection_events','payout_amount', event_type='protection_claim_payout')"
      - plan_writeoffs: "SUM('service_events','waiver_amount', event_type='service_waiver', waiver_reason='protection_plan_covered')"
      - plan_met_offset: "0 if (plan_active and (last_decision == 'denied_not_covered' or last_decision == 'denied_outside_term' or last_decision ==
      'denied_no_proof_of_purchase' or last_decision == 'denied_pre_existing')) else (payouts_item if (plan_active and last_decision == 'approved_repair') else plan_writeoffs)"
      - unsettled: "MX(SUM('service_events','charge_amount') - SUM('service_events','payment_amount') - SUM('service_events','waiver_amount'), 0)"
      - result: "MN(MX(RND(relief_labour + trip_relief + mileage_relief + slot_fee_relief - plan_met_offset, 2), 0), unsettled)"
    compute_basis:
      labour_rebilled_today: "That share is applied to the chargeable labour billed on the day the relief is granted and the outcome rounded to the nearest cent"
      grants_term: "The visits taken as creditable are the visits standing in the pool of the visit term less the planned visits the service carries each year"
      uses_term: "the visits standing in the pool of the visit term"
      goodwill_grants: "where the visits standing in the pool were granted only as a gesture of goodwill, none of them is creditable"
      pool_left: "the visits standing in the pool of the visit term"
      plan_grants: "where visits granted under a plan covering the item stand among them"
      visits_creditable: "Where visits stand in that pool and visits granted under a plan covering the item stand among them, every visit standing in the pool is creditable instead"
      labour_rows_all: "The attendances rebilled are counted from the labour entries standing on the job other than those booked for the day it was completed and those booked on the day the relief is granted"
      labour_rows_completed: "other than those booked for the day it was completed"
      labour_rows_today: "and those booked on the day the relief is granted"
      attendances_rebilled: "the visits creditable are set against the attendances rebilled and the share is the attendances they cover divided by the attendances rebilled instead"
      covered_share: "The share of the chargeable labour those visits relieve is the proportion the visits standing in the pool bear to the visits the service includes in its visit term, counted as at least one visit"
      relief_labour: "That share is applied to the chargeable labour billed on the day the relief is granted and the outcome rounded to the nearest cent"
      trip_rows: "where such charges stand on the job for more than one attendance, only the charge booked for the day the crew was dispatched is added"
      trip_fees: "Where such a charge stands on the job and the labour and parts booked for the day the crew was dispatched reach the figure at which the service waives it, that charge is added in full"
      trip_fees_dispatch: "only the charge booked for the day the crew was dispatched is added"
      labour_parts_dispatch: "the labour and parts booked for the day the crew was dispatched reach the figure at which the service waives it"
      trip_relief: "Nothing of the charge for bringing the crew out is added"
      mileage_rows: "where such charges stand on the job only for days other than the day the crew was dispatched, the charges standing on the job less those booked for the day the crew was dispatched are added"
      mileage_fees: "the charges standing on the job less those booked for the day the crew was dispatched are added"
      mileage_dispatch: "Where such a charge stands on the job for the day the crew was dispatched, that charge is added"
      mileage_relief: "Nothing of the charge for the distance travelled is added"
      slot_rows: "Where such a fee stands on the job and no write-off on the retailer's own error stands
      against it, that fee is added in full"
      slot_fees: "that fee is added in full"
      slot_error_waivers: "where such a fee stands on the job and a write-off on the retailer's own error
      stands against it, what is left of that fee after that write-off is added"
      slot_fee_relief: "Nothing of the fee for moving the slot is added"
      plan_active: "Where the plan covering the item stands active and the decision recorded against its claim refused the claim, nothing is taken off, because a refused claim has met nothing of the work"
      last_decision: "where the plan stands active and that decision approved a repair, what the plan has already paid out on the item is taken off"
      payouts_item: "what the plan has already paid out on the item is taken off"
      plan_writeoffs: "what has been written off to the plan's cover on the job is taken off"
      plan_met_offset: "What the plan has met of the same work is then taken off, so that no charge is relieved twice on different grounds"
      unsettled: "never exceeds the charges standing unsettled on the job, which are every charge booked on it less every payment received and every amount already written off"
      result: "The relief is rounded to the nearest cent, is never below nothing, and never exceeds the charges standing unsettled on the job"
    factors:
      - id: creditable_included_visits
        effect: parameter
        decides: visits_creditable
        bindings: [grants_term, uses_term, goodwill_grants, plan_grants, pool_left, visits_creditable]
        ladder:
          - when: "visits stand in the pool of the visit term and visits granted under a plan covering the item
          stand among them"
            value: "every visit standing in the pool"
          - when: "the visits standing in the pool were granted only as a gesture of goodwill"
            value: "nothing"
          - when: "otherwise"
            value: "the visits standing in the pool less the planned visits the service carries each year"
        baseline:
          visits_creditable: "MX(pool_left - P('preventive_visits_per_year'), 0)"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: labour_share_relieved
        effect: method
        decides: covered_share
        bindings: [labour_rows_all, labour_rows_completed, labour_rows_today, attendances_rebilled, covered_share]
        ladder:
          - when: "visits stand creditable and the labour rebilled covers more than one attendance day"
            method: "the visits creditable are set against the attendances rebilled and the share is the attendances they cover divided by the attendances rebilled"
          - when: "visits stand creditable and the labour rebilled covers one attendance day"
            method: "the whole of the labour rebilled is relieved"
          - when: "otherwise"
            method: "the share is the proportion the visits standing in the pool bear to the visits the service includes in its visit term, counted as at least one visit"
        baseline:
          covered_share: "pool_left / MX(P('included_visits_per_term'), 1)"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: crew_attendance_charge_relief
        effect: parameter
        decides: trip_relief
        bindings: [trip_rows, trip_fees, trip_fees_dispatch, labour_parts_dispatch, trip_relief]
        ladder:
          - when: "a charge for bringing the crew out stands on the job and the labour and parts booked for the day the crew was dispatched reach the figure at which the service waives it"
            value: "that charge in full"
          - when: "such charges stand on the job for more than one attendance"
            value: "only the charge booked for the day the crew was dispatched"
          - when: "otherwise"
            value: "nothing"
        baseline:
          trip_relief: "0"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: distance_charge_relief
        effect: parameter
        decides: mileage_relief
        bindings: [mileage_rows, mileage_fees, mileage_dispatch, mileage_relief]
        ladder:
          - when: "a charge for the distance travelled stands on the job for the day the crew was dispatched"
            value: "that charge"
          - when: "such charges stand on the job only for days other than the day the crew was dispatched"
            value: "the charges standing on the job less those booked for the day the crew was dispatched"
          - when: "otherwise"
            value: "nothing"
        baseline:
          mileage_relief: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: slot_move_fee_relief
        effect: parameter
        decides: slot_fee_relief
        bindings: [slot_rows, slot_fees, slot_error_waivers, slot_fee_relief]
        ladder:
          - when: "a fee for moving the slot stands on the job and no write-off on the retailer's own error stands against it"
            value: "that fee in full"
          - when: "a fee for moving the slot stands on the job and a write-off on the retailer's own error stands against it"
            value: "what is left of that fee after that write-off"
          - when: "otherwise"
            value: "nothing"
        baseline:
          slot_fee_relief: "0"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: plan_met_of_same_work
        effect: parameter
        decides: plan_met_offset
        bindings: [plan_active, last_decision, payouts_item, plan_writeoffs, plan_met_offset]
        ladder:
          - when: "the plan covering the item stands active and the decision recorded against its claim refused the claim"
            value: "nothing"
          - when: "the plan stands active and that decision approved a repair"
            value: "what the plan has already paid out on the item"
          - when: "otherwise"
            value: "what has been written off to the plan's cover on the job"
        baseline:
          plan_met_offset: "plan_writeoffs"
        evidence: [cross_category, history]
        cross_difficulty: protection
    baseline:
      rule: >-
        A business profile whose contract carries included visits is relieved of what those visits should have
        covered on a job, together with the attendance charges its contract does not leave with it. The visits
        taken as creditable are the visits standing in the pool of the visit term less the planned visits the
        service carries each year. The share of the chargeable labour those visits relieve is the proportion the
        visits standing in the pool bear to the visits the service includes in its visit term, counted as at
        least one visit. That share is applied to the chargeable labour billed on the day the relief is granted
        and the outcome rounded to the nearest cent. To it are added the attendance charges the contract does not
        leave with the business. Nothing of the charge for bringing the crew out is added. Nothing of the charge
        for the distance travelled is added. Nothing of the fee for moving the slot is added. What the plan has
        met of the same work is then taken off, so that no charge is relieved twice on different grounds: what
        has been written off to the plan's cover on the job is taken off. The relief is rounded to the nearest
        cent, is never below nothing, and never exceeds the charges standing unsettled on the job, which are
        every charge booked on it less every payment received and every amount already written off.
      params: [visit_term_months, included_visits_per_term, preventive_visits_per_year]
    inputs:
      history:
        - {table: service_events, aggregate: sum, field: charge_amount, within_months: null, filters: {event_type: service_labour_charge}}
        - {table: service_events, aggregate: sum, field: visits_delta, within_months: 12, filters: {event_type: service_visit_allowance_grant}}
        - {table: service_events, aggregate: sum, field: visits_delta, within_months: 12, filters: {event_type: service_visit_consume}}
        - {table: service_events, aggregate: sum, field: charge_amount, within_months: null, filters: {event_type: service_fee_charge}}
        - {category: protection, table: protection_events, aggregate: latest, field: claim_decision, within_months: null, filters: {event_type: protection_claim_decision}}
        - {category: protection, table: protection_events, aggregate: sum, field: payout_amount, within_months: null, filters: {event_type: protection_claim_payout}}
      cross_category: [protection]
  - id: service_ext_invoice_settlement_payment
    base_policy_refs: [service_labour_pricing, service_charge_waivers, service_attendance_and_cancellation, service_parts_handling]
    overwrite: []
    trigger: on_request
    subject: [service_payment]
    computes: payment_amount
    target_tool: settle_deployment_invoice_642fded5
    params: {}
    rule: >
      When a business asks to settle the invoice standing on a job, the figure it settles is the labour, the
      parts and the fees the settlement covers, less the relief already recognised on the job, less the money
      already held against those charges, less what is left for its next invoice and less what the plan has met
      of the same work, and it is never below nothing. The figure the invoice settles is worked out only after
      the relief the business contract owes stands recorded against the job's charges. The labour the settlement
      covers is the labour billed on the day the invoice is settled. Where the job stands completed and labour
      stands billed on it both for the day it was completed and for earlier days, every labour charge standing on
      the job is covered instead; where the job stands completed and labour stands billed on it only for the day
      it was completed, the labour billed for that day is covered instead. The parts the settlement covers are
      the parts standing billed on the job. The fees the settlement covers are the fees booked for the day the
      job was completed. Where fees stand on the job both for moving the slot and for the distance travelled,
      every fee standing on the job is covered instead; where a fee stands on the job for the distance travelled
      and none for moving the slot, the fees booked for the day the crew was dispatched are covered instead. No
      relief is recognised against those charges. Where a write-off granted on a term of the customer's business
      contract stands on the job, every write-off standing on the job is recognised; where the only write-offs
      standing on the job were granted on the plan's cover, those plan write-offs are recognised. No payment is
      taken off the charges being covered. Where a payment stands recorded on the job for the day the crew was
      dispatched, that payment is taken off them; where payments stand recorded on the job and none of them is
      for the day the crew was dispatched, the payments already received are taken off them. What is left for the
      next invoice is the charges booked on the day of settlement together with the fees the settlement covers.
      Where the job carries charges booked on the day of settlement and the day the work was asked for lies
      further back than the service's payment terms, only the charges booked on the day of settlement are left
      for the next invoice, the earlier charges having already run their terms; where the job carries charges
      booked on the day of settlement and the day the work was asked for lies inside the service's payment terms,
      nothing is left for the next invoice, because the whole of the job still sits on the invoice now being
      settled. What the plan has met of the same work is what has been written off to the plan's cover on the
      job. Where the plan covering the item stands active and the decision recorded against its claim refused the
      claim, nothing has been met by the plan; where the plan stands active and that decision approved a repair,
      what the plan has already paid out on the item has been met by it. The figure is rounded to the nearest
      cent, and a business profile settles it within the service's payment terms.
    prerequisite:
      - problem: service_ext_business_contract_relief
        kind: value_input
        gate: relief_recognised
        form: state
        policy_source: >-
          The figure the invoice settles is worked out only after the relief the business contract owes stands
          recorded against the job's charges.
        condition: >-
          a service history entry standing on the job records a write-off granted on a term of the customer's
          business contract
        resolved_by: credit_contract_relief_ce7af535
        effect: >-
          once that write-off stands on the job, the relief recognised against the charges being covered changes
          from the write-offs granted on the plan's cover alone to every write-off standing on the job
    cross_category:
      - category: protection
        as: branch
        reads: [status, protection_events.claim_decision, protection_events.payout_amount]
        note: The ShieldCare plan's standing, the decision recorded against its claim and what it has already paid out on the item decide what the plan has met of the same work, which the business does not settle again.
    compute:
      - labour_all: "SUM('service_events','charge_amount', event_type='service_labour_charge')"
      - labour_completed_day: "SUM('service_events','charge_amount', event_type='service_labour_charge', visit_date=F('completed_date'))"
      - labour_today: "SUM('service_events','charge_amount', event_type='service_labour_charge', event_date=NOW)"
      - labour_rows_all: "COUNT('service_events', event_type='service_labour_charge')"
      - labour_rows_completed: "COUNT('service_events', event_type='service_labour_charge', visit_date=F('completed_date'))"
      - labour_in_scope: "labour_all if (F('status') == 'completed' and labour_rows_all > labour_rows_completed) else (labour_completed_day if F('status') == 'completed' else labour_today)"
      - parts_in_scope: "SUM('service_events','charge_amount', event_type='service_parts_charge')"
      - fees_all: "SUM('service_events','charge_amount', event_type='service_fee_charge')"
      - fees_dispatch: "SUM('service_events','charge_amount', event_type='service_fee_charge', visit_date=F('dispatched_date'))"
      - fees_completed_day: "SUM('service_events','charge_amount', event_type='service_fee_charge', visit_date=F('completed_date'))"
      - slot_rows: "COUNT('service_events', event_type='service_fee_charge', charge_kind='reschedule_fee')"
      - mileage_rows: "COUNT('service_events', event_type='service_fee_charge', charge_kind='out_of_radius_fee')"
      - fees_in_scope: "fees_all if (slot_rows >= 1 and mileage_rows >= 1) else (fees_dispatch if mileage_rows >= 1 else fees_completed_day)"
      - waivers_all: "SUM('service_events','waiver_amount', event_type='service_waiver')"
      - contract_waivers: "SUM('service_events','waiver_amount', event_type='service_waiver', waiver_reason='contract_term')"
      - plan_waivers: "SUM('service_events','waiver_amount', event_type='service_waiver', waiver_reason='protection_plan_covered')"
      - relief_recognised: "waivers_all if contract_waivers > 0 else (plan_waivers if (plan_waivers > 0 and plan_waivers == waivers_all) else 0)"
      - payments_all: "SUM('service_events','payment_amount', event_type='service_payment')"
      - payments_dispatch: "SUM('service_events','payment_amount', event_type='service_payment', event_date=F('dispatched_date'))"
      - payments_rows: "COUNT('service_events', event_type='service_payment')"
      - payments_held: "payments_dispatch if payments_dispatch > 0 else (payments_all if payments_rows >= 1 else 0)"
      - charges_today: "SUM('service_events','charge_amount', event_date=NOW)"
      - job_age_days: "DAYS(F('requested_date'), NOW)"
      - terms_deferral: "charges_today if (charges_today > 0 and job_age_days > P('payment_terms_days')) else (0 if (charges_today > 0 and job_age_days <= P('payment_terms_days')) else charges_today + fees_in_scope)"
      - plan_active: "EXISTS('protection', status='active')"
      - last_decision: "XLATEST('protection','protection_events','claim_decision', date_field='event_date', event_type='protection_claim_decision')"
      - payouts_item: "XSUM('protection','protection_events','payout_amount', event_type='protection_claim_payout')"
      - plan_writeoffs_job: "SUM('service_events','waiver_amount', event_type='service_waiver', waiver_reason='protection_plan_covered')"
      - plan_settled_offset: "0 if (plan_active and (last_decision == 'denied_not_covered' or last_decision == 'denied_outside_term' or last_decision ==
      'denied_no_proof_of_purchase' or last_decision == 'denied_pre_existing')) else (payouts_item if (plan_active and last_decision == 'approved_repair') else plan_writeoffs_job)"
      - result: "MX(RND(labour_in_scope + parts_in_scope + fees_in_scope - relief_recognised - payments_held - terms_deferral - plan_settled_offset, 2), 0)"
    compute_basis:
      labour_all: "Where the job stands completed and labour stands billed on it both for the day it was completed and for earlier days, every labour charge standing on the job is covered instead"
      labour_completed_day: "where the job stands completed and labour stands billed on it only for the day it was completed, the labour billed for that day is covered instead"
      labour_today: "The labour the settlement covers is the labour billed on the day the invoice is settled"
      labour_rows_all: "labour stands billed on it both for the day it was completed and for earlier days"
      labour_rows_completed: "labour stands billed on it only for the day it was completed"
      labour_in_scope: "The labour the settlement covers is the labour billed on the day the invoice is settled"
      parts_in_scope: "The parts the settlement covers are the parts standing billed on the job"
      fees_all: "Where fees stand on the job both for moving the slot and for the distance travelled, every fee standing on the job is covered instead"
      fees_dispatch: "where a fee stands on the job for the distance travelled and none for moving the slot, the fees booked for the day the crew was dispatched are covered instead"
      fees_completed_day: "The fees the settlement covers are the fees booked for the day the job was completed"
      slot_rows: "where fees stand on the job both for moving the slot and for the distance travelled"
      mileage_rows: "where a fee stands on the job for the distance travelled and none for moving the slot"
      fees_in_scope: "The fees the settlement covers are the fees booked for the day the job was completed"
      waivers_all: "Where a write-off granted on a term of the customer's business contract stands on the job, every write-off standing on the job is recognised"
      contract_waivers: "Where a write-off granted on a term of the customer's business contract stands on the job"
      plan_waivers: "where the only write-offs standing on the job were granted on the plan's cover, those plan write-offs are recognised"
      relief_recognised: "No relief is recognised against those charges"
      payments_all: "where payments stand recorded on the job and none of them is for the day the crew was dispatched, the payments already received are taken off them"
      payments_dispatch: "Where a payment stands recorded on the job for the day the crew was dispatched, that payment is taken off them"
      payments_rows: "where payments stand recorded on the job and none of them is for the day the crew was dispatched"
      payments_held: "No payment is taken off the charges being covered"
      charges_today: "Where the job carries charges booked on the day of settlement and the day the work was asked for lies further back than the service's payment terms, only the charges booked on the day of settlement are left for the next invoice"
      job_age_days: "the day the work was asked for lies inside the service's payment terms"
      terms_deferral: "What is left for the next invoice is the charges booked on the day of settlement together with the fees the settlement covers"
      plan_active: "Where the plan covering the item stands active and the decision recorded against its claim refused the claim, nothing has been met by the plan"
      last_decision: "where the plan stands active and that decision approved a repair, what the plan has already paid out on the item has been met by it"
      payouts_item: "what the plan has already paid out on the item has been met by it"
      plan_writeoffs_job: "What the plan has met of the same work is what has been written off to the plan's cover on the job"
      plan_settled_offset: "What the plan has met of the same work is what has been written off to the plan's cover on the job"
      result: "the figure it settles is the labour, the parts and the fees the settlement covers, less the relief already recognised on the job, less the money already held against those charges, less what is left for its next invoice and less what the plan has met of the same work, and it is never below nothing"
    factors:
      - id: invoice_labour_scope
        effect: parameter
        decides: labour_in_scope
        bindings: [labour_all, labour_completed_day, labour_today, labour_rows_all, labour_rows_completed, labour_in_scope]
        ladder:
          - when: "the job stands completed and labour stands billed on it both for the day it was completed and for earlier days"
            value: "every labour charge standing on the job"
          - when: "the job stands completed and labour stands billed on it only for the day it was completed"
            value: "the labour billed for the day it was completed"
          - when: "otherwise"
            value: "the labour billed on the day the invoice is settled"
        baseline:
          labour_in_scope: "labour_today"
        evidence: [history, date]
        cross_difficulty: null
      - id: invoice_fee_scope
        effect: parameter
        decides: fees_in_scope
