  baseline:
    rule: 'Reward points earned on a purchase are worked out from what the profile''s orders are billed
      at, the work carried out alongside them and the goods that have gone back, and the whole of that
      spend is taken at one rate. The spend the points are earned on is the merchandise lines billed to
      the profile in the twelve months ending on the handling day. Discounts credited on the profile''s
      orders are taken off the lines counted before any rate is applied. The spend is the lines counted
      as they stand. Goods that have gone back are taken off the same spend, so that points are not earned
      on merchandise the profile no longer has. Nothing is taken off the spend for goods going back. Chargeable
      work carried out on the TechWorks agreement the profile holds is brought into the same spend. Nothing
      is brought into the spend for work. The spend the rate is applied to never falls below nothing:
      where the goods that have gone back come to more than the lines counted and the work brought into
      the spend together, the spend is nothing and no points are earned on it. The rate is the base rate
      of the tier recorded on the membership, and the department bonus and the volume uplift are added
      on top of it; the rate so built applies to the whole of the spend rather than to a part of it. There
      is no department bonus. There is no volume uplift. The order is fixed: the spend is settled first,
      then the rate is built and applied once to the whole of it, and only that figure is rounded, to
      the nearest whole point, with a half point rounded to the nearest even point. Once the points earned
      in the twelve months ending on the handling day reach the yearly points cap of the tier, no further
      points are earned, and what is booked never takes the membership past that cap.'
    params:
    - points_per_dollar_base
    - points_cap_per_calendar_year
