      spent, the points already taken and the points already had the value of are taken off it one after
      another, and the figure swept is a whole number of points that never falls below nothing. The sweep
      year a forfeiture belongs to is the calendar year the day it is booked falls in, and one sweep entry
      is booked for each sweep year, so the forfeiture can be told apart from a redemption.'
