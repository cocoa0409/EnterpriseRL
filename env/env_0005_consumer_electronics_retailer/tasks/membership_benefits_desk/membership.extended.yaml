extended_policies:
- id: membership_ext_grace_dues_settlement
  base_policy_refs:
  - membership_dues_billing
  - membership_dues_delinquency
  overwrite:
  - base_policy: membership_dues_delinquency
    superseded_clause: The late fee of the tier is billed when grace begins, and it is owed whether or
      not the membership is later reinstated.
    replaced_by: Where the membership stands in grace, the record carries no lapse day inside the reinstatement
      window of the tier, and the ledger carries an earlier late fee entry booked in the twelve months
      ending on the handling day, the repeat late fee of this schedule is taken in.
  trigger: on_request
  subject:
  - membership_dues_payment
  computes: settlement_payment_usd
  target_tool: settle_membership_dues_c8b60f0e
  params:
    repeat_late_fee_usd: 18.0
    opening_window_months: 24
  rule: 'The figure a member must pay to bring a Circle membership back into good standing is worked out
    from the membership ledger itself and never from the running dues figure shown on the membership record,
    which is refreshed only when the nightly collection run reaches it. The entries counted are the dues
    charges and the dues payments booked in the twelve months ending on the handling day. Where the membership
    stands in grace and the ledger carries an annual dues charge booked in the twelve months ending on
    the handling day, the entries counted are instead those booked in the month ending on the handling
    day. Where the membership stands in application_received and the ledger carries no dues payment at
    all, the entries counted are instead those booked in the twenty-four months ending on the handling
    day. The dues side is the total of the annual dues charges and the proration charges among the entries
    counted, and the payments side is the total of the dues payments among them. The payments side is
    taken off the dues side once, on the whole of it, before anything further is added or set against
    it. A fee for putting the standing right is then taken into the figure on the schedule below. Where
    the membership record carries a lapse day and that day falls within the reinstatement window of the
    tier, the reinstatement fee of the tier is taken in. Where the membership stands in grace, the record
    carries no lapse day inside the reinstatement window of the tier, and the ledger carries an earlier
    late fee entry booked in the twelve months ending on the handling day, the repeat late fee of this
    schedule is taken in. Where the membership stands in grace, the record carries no lapse day inside
    that reinstatement window, and the ledger carries no earlier late fee entry in the twelve months ending
    on the handling day, the late fee figure of the tier is taken in. Where none of those holds, no fee
    for putting the standing right is taken in. Store credit standing on the Northbeam credit account
    the profile holds is set against the amount, a consumer tier settling its dues from the card on file
    or from store credit, and store credit may be drawn only while it is still spendable. Where that credit
    account stands active and the store credit posted to it inside the days that account''s store credit
    stays spendable is at or above the balance standing on it, the whole of that balance is set against
    the amount. Where that credit account stands active and the credit posted inside those days falls
    below the balance standing on it, only the credit posted inside those days is set against the amount.
    Where that credit account does not stand active, no store credit is set against the amount. Money
    the member owes on the ShieldCare plan the profile holds is brought into the same settlement. Where
    that plan stands active or in claim hold and the premium charged on it in the twelve months ending
    on the handling day is above the premium paid on it in that window, the shortfall between the two
    is brought in. Where that plan stands active or in claim hold, no such shortfall stands and a deductible
    stands unsettled on it, that unsettled deductible is brought in. Where neither of those holds, nothing
    is brought in for the plan. The return authorisation the profile holds is brought into the same settlement,
    on the side the money runs. Where that return stands inspected or settled and a restocking fee stands
    outstanding on it, that outstanding restocking fee is brought in. Where that return stands inspected
    or settled, no restocking fee stands outstanding on it and a refund stands outstanding to the member,
    that outstanding refund is set against the amount. Where neither of those holds, nothing is brought
    in for the return. The parts are combined in one sum, in this order: the dues side less the payments
    side, plus the fee for putting the standing right, less the store credit set against the amount, plus
    what is owed on the plan, plus what is owed on the return and less what is owed to the member on it.
    That sum is rounded to the nearest cent only at the end, no intermediate being rounded, and the figure
    never falls below nothing. The money received is applied to the oldest unpaid billing period first,
    and any remainder to the next. Dues are billed, and payments applied, only while the membership record
    stands in application_received, active or grace.'
  prerequisite: []
  cross_category:
