events:
- type: membership_enroll
  target: membership_holdings
  mutation: create
  meaning: A Circle membership is opened for a customer at a chosen tier, before any dues have cleared.
  grain: one row per membership a customer holds
  fields:
    customer_id: the customer the membership belongs to
    variant_name: the tier applied for, written as the official full tier name
    status: set to the entry state application_received
    enrolled_date: the day the enrollment was taken
    billing_frequency: how the customer chose to be billed on this tier
    auto_renew_flag: whether the customer agreed to automatic renewal
    primary_store_code: the store the enrollment was taken at
    tier_effective_date: the day the applied-for tier takes effect
  triggers:
  - event: membership:membership_dues_charge
    when:
      billing_frequency:
      - annual
      - monthly
    map:
      customer_id: customer_id
      charge_kind: annual_dues
      tier_at_event: variant_name
- type: membership_activate
  target: membership_holdings
  mutation:
    transition:
      from: application_received
      to: active
  meaning: The membership is activated once the first dues charge has cleared, or at once on the free
    tier, and benefits become usable.
  grain: one row per membership; the activation writes the term dates onto it
  fields:
    status: moved to active
    activation_date: the day benefits became usable
    current_term_start: first day of the first billed term
    current_term_end: last day of the first billed term
    next_renewal_date: the day the following dues charge is scheduled
  triggers:
  - event: membership:membership_benefit_grant
    map:
      benefit_code: anniversary_reward
      customer_id: customer_id
- type: membership_tier_change
  target: membership_holdings
  mutation: update
  meaning: The membership is moved to another tier, up at once or down at the end of the term.
  grain: one row per membership; each migration overwrites the tier and its effective day
  fields:
    variant_name: the tier now held
    tier_effective_date: the day the new tier takes effect
    billing_frequency: the billing frequency the new tier is held on
    current_term_end: last day of the term as it stands after the migration
  triggers:
  - event: membership:membership_dues_charge
    map:
      charge_kind: proration
      tier_at_event: variant_name
      customer_id: customer_id
- type: membership_grace_start
  target: membership_holdings
  mutation:
    transition:
      from: active
      to: grace
  meaning: Dues went unpaid past their due day and the membership drops into grace.
  grain: one row per membership; the grace entry day is written onto it
  fields:
    status: moved to grace
    grace_start_date: the day grace began
    dues_outstanding: dues billed and still unpaid
  triggers:
  - event: membership:membership_dues_charge
    map:
      charge_kind: late_fee
      customer_id: customer_id
- type: membership_lapse
  target: membership_holdings
  mutation:
    transition:
      from: grace
      to: lapsed
  meaning: Grace ran out with the dues still unpaid and the membership lapses.
  grain: one row per membership; the lapse day is written onto it
  fields:
    status: moved to lapsed
    lapsed_date: the day the membership lapsed
    next_renewal_date: cleared, since no further dues are scheduled
  triggers:
  - event: membership:membership_points_expire
    map:
      customer_id: customer_id
- type: membership_reinstate
  target: membership_holdings
  mutation:
    transition:
      from: lapsed
      to: active
  meaning: A lapsed membership is put back at its former tier inside the reinstatement window.
  grain: one row per membership; the reinstatement counter and fresh term dates are written onto it
  fields:
    status: moved back to active
    activation_date: the day benefits became usable again
    current_term_start: first day of the fresh term
    current_term_end: last day of the fresh term
    next_renewal_date: the day the following dues charge is scheduled
    reinstatement_count: how many times this membership has now been reinstated
  triggers:
  - event: membership:membership_dues_charge
    map:
      charge_kind: reinstatement_fee
      customer_id: customer_id
- type: membership_cancel
  target: membership_holdings
  mutation:
    transition:
    - from: active
      to: cancelled
    - from: grace
      to: cancelled
  meaning: The customer ends the membership; benefits stop and any dues refund is settled against the
    record.
  grain: one row per membership; the cancellation day is written onto it
  fields:
    status: moved to cancelled
    cancelled_date: the day the cancellation took effect
    auto_renew_flag: switched off so no further dues are collected
    next_renewal_date: cleared, since no further dues are scheduled
  triggers:
  - event: credit:credit_store_credit_post
    map:
      customer_id: customer_id
      post_reason: membership_dues_refund
- type: membership_dues_charge
  target: membership_events
  meaning: Membership dues, a proration, a reinstatement fee, a late fee or the enrollment fee are billed
    to the customer.
  grain: one row per amount billed for one billing period on one membership
  distinguish_by:
  - charge_kind
  - billing_period_start
  - channel
  fields:
    charge_amount: the amount billed
    charge_kind: which kind of dues charge this is
    billing_period_start: first day of the period billed
    billing_period_end: last day of the period billed
    event_date: the day the charge was booked
    channel: the channel the charge arose through
    tier_at_event: the tier the membership stood at when the charge was booked
    customer_id: the customer billed
  account: dues_receivable
  direction: in
  triggers: []
- type: membership_dues_payment
  target: membership_events
  meaning: The customer settles billed dues, in part or in full.
  grain: one row per payment received against one billing period on one membership
  distinguish_by:
  - applied_period_start
  - payment_method
  - event_date
  fields:
    payment_amount: the amount received
    payment_method: how the customer paid
    applied_period_start: first day of the billing period the payment was applied to
    event_date: the day the payment was received
    channel: the channel the payment came through
    customer_id: the customer who paid
  account: dues_receivable
  direction: out
  triggers: []
- type: membership_points_accrue
  target: membership_events
  meaning: Reward points are earned on a purchase, a plan, a service visit, a trade-in or a promotion.
  grain: one row per earning occasion on one membership
  distinguish_by:
  - accrual_basis
  - source_order_id
  - event_date
  fields:
    points_delta: points earned, positive
    qualifying_spend_usd: the spend the points were earned on
    accrual_basis: which earning occasion this was
    source_order_id: the purchase, plan or work order the points were earned on
    event_date: the day the points were earned
    channel: the channel the purchase was made through
    tier_at_event: the tier the membership stood at when the points were earned
    customer_id: the customer who earned the points
  account: reward_points
  direction: in
  triggers: []
- type: membership_points_redeem
  target: membership_events
  meaning: Reward points are spent as a certificate, an instant checkout discount, a donation or a transfer.
  grain: one row per redemption on one membership
  distinguish_by:
  - redemption_kind
  - redemption_ref
  - event_date
  fields:
    points_delta: points spent, negative
    redemption_kind: the form the redemption took
    redemption_ref: the reference the customer reads out for the redemption
    event_date: the day the redemption was made
    channel: the channel the redemption was made through
    customer_id: the customer who redeemed
  account: reward_points
  direction: out
  triggers: []
- type: membership_points_expire
  target: membership_events
  meaning: Points that reached the end of their life, or that a lapse forfeited, are swept off the balance.
  grain: one row per expiry sweep year on one membership
  distinguish_by:
  - expiry_cycle_year
  fields:
    points_delta: points swept off, negative
    expiry_cycle_year: the sweep year this forfeiture belongs to
    event_date: the day the sweep was run
    customer_id: the customer whose points were swept
  account: reward_points
  direction: out
  triggers: []
- type: membership_benefit_grant
  target: membership_events
  meaning: A named membership benefit credit is granted for the membership year.
  grain: one row per benefit code per membership year on one membership
  distinguish_by:
  - benefit_code
  - grant_cycle_year
  fields:
    benefit_amount: the credit granted
    benefit_code: which named benefit this is
    grant_cycle_year: the membership year granted for
    event_date: the day the credit was granted
    tier_at_event: the tier the membership stood at when the credit was granted
    customer_id: the customer the credit was granted to
  account: benefit_credit
  direction: in
  triggers: []
- type: membership_benefit_redeem
  target: membership_events
  meaning: Granted benefit credit is spent against a delivery, installation, haul-away or repair charge.
  grain: one row per benefit credit spent against one charge on one membership
  distinguish_by:
  - benefit_code
  - redemption_ref
  fields:
    benefit_amount: the credit spent
    benefit_code: which named benefit was spent
    redemption_ref: the charge the credit was spent against, as the customer reads it out
    event_date: the day the credit was spent
    channel: the channel the credit was spent through
    customer_id: the customer who spent the credit
  account: benefit_credit
  direction: out
  triggers: []
measures:
- id: membership_msr_points_earned_12m
  window: the rolling twelve calendar months ending on the handling date, month boundaries inclusive
  measure: sum of points_delta over membership_points_accrue rows on the membership
- id: membership_msr_benefit_redemptions_term
  window: the current membership year, from the activation anniversary on or before the handling date
    to the day before the next anniversary
  measure: count of membership_benefit_redeem rows on the membership
- id: membership_msr_qualifying_spend_term
  window: the current membership term, from current_term_start to current_term_end inclusive
  measure: sum of qualifying_spend_usd over membership_points_accrue rows on the membership
policies:
- id: membership_agg_multi_holding
  subject:
  - membership_enroll
  rule: 'A customer profile carries at most one Circle membership at a time, whatever the tier. Enrollment
    is refused when the profile already holds a membership whose status is application_received, active
    or grace, and the customer is moved between tiers instead of being enrolled a second time. A membership
    whose status is lapsed or cancelled does not block a fresh enrollment: the earlier record stays on
    file for history and a new membership record is opened alongside it. Household seats and business
    seats attached to a membership are shared use of one membership and are never counted as memberships
    of their own.'
  eligibility:
  - id: single_live_membership
    applies_to:
    - membership_enroll
    kind: dedup
    condition: Enrollment is refused when the profile already holds a membership whose status is application_received,
      active or grace, and the customer is moved between tiers instead of being enrolled a second time.
    evidence_fields:
    - membership_holdings.customer_id
    - membership_holdings.status
    - membership_holdings.variant_name
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - membership_holdings.customer_id
      action_bindings:
        membership_holdings.customer_id: customer_id
    dedup_contract:
      table: membership_holdings
      mode: separate_record
      object_bindings:
        customer_id: customer_id
      duplicate_filters:
        status:
        - application_received
        - active
        - grace
      distinct_fields:
      - enrolled_date
      - variant_name
  params:
    max_per_customer: 1
- id: membership_enrollment_admission
  subject:
  - membership_enroll
  - membership_activate
  rule: Admission to a tier is decided by the tier's entry gate read against the customer profile. The
    consumer tiers are open to any consumer profile of full age; the household tier additionally requires
    that the further seats share the primary member's service address. A business tier is opened only
    on a profile whose account type is recorded as business, and a caller's statement that the paperwork
    is on its way does not open one. A tax exempt business profile may only be enrolled on a tier whose
    enrollment allows it. Dues are payable on every tier except the free tier; on a tier with a trial
    the first dues charge is booked when the trial days run out, and the membership is activated at once
    so the trial can be used. A membership is activated only from a record that stands in application_received
    or is already active, and activating an already active membership changes nothing. Where the entry
    gate is not met the enrollment is refused and the customer is offered the highest tier whose gate
    the profile does meet.
  eligibility:
  - id: business_profile_on_file
    applies_to:
    - membership_enroll
    kind: authorization
    condition: A business tier is opened only on a profile whose account type is recorded as business,
      and a caller's statement that the paperwork is on its way does not open one.
    evidence_fields:
    - customers.account_type
    - customers.business_name
    - customers.customer_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - customers.customer_id
      action_bindings:
        customers.customer_id: customer_id
  - id: activation_from_pending
    applies_to:
    - membership_activate
    kind: state
    condition: A membership is activated only from a record that stands in application_received or is
      already active, and activating an already active membership changes nothing.
    evidence_fields:
    - membership_holdings.status
    - membership_holdings.membership_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - membership_holdings.membership_id
      action_bindings:
        membership_holdings.membership_id: membership_id
    state_contract:
      field: membership_holdings.status
      allowed:
      - application_received
      - active
  params:
    per_tier:
      Circle Free Membership:
        annual_dues_usd: =annual_dues_usd
        enrollment_fee_usd: =enrollment_fee_usd
        free_trial_days: =free_trial_days
        tax_exempt_enrollment_allowed: =tax_exempt_enrollment_allowed
      Circle Plus Annual:
        annual_dues_usd: =annual_dues_usd
        enrollment_fee_usd: =enrollment_fee_usd
        free_trial_days: =free_trial_days
        tax_exempt_enrollment_allowed: =tax_exempt_enrollment_allowed
      Circle Total Annual:
        annual_dues_usd: =annual_dues_usd
        enrollment_fee_usd: =enrollment_fee_usd
        free_trial_days: =free_trial_days
        tax_exempt_enrollment_allowed: =tax_exempt_enrollment_allowed
      Circle Total Household Annual:
        annual_dues_usd: =annual_dues_usd
        enrollment_fee_usd: =enrollment_fee_usd
        free_trial_days: =free_trial_days
        tax_exempt_enrollment_allowed: =tax_exempt_enrollment_allowed
      Circle Business Pro:
        annual_dues_usd: =annual_dues_usd
        enrollment_fee_usd: =enrollment_fee_usd
        free_trial_days: =free_trial_days
        tax_exempt_enrollment_allowed: =tax_exempt_enrollment_allowed
      Circle Business Elite:
        annual_dues_usd: =annual_dues_usd
        enrollment_fee_usd: =enrollment_fee_usd
        free_trial_days: =free_trial_days
        tax_exempt_enrollment_allowed: =tax_exempt_enrollment_allowed
- id: membership_dues_billing
  subject:
  - membership_dues_charge
  - membership_dues_payment
  rule: Dues are billed for a whole billing period at the dues figure of the tier recorded on the membership
    on the first day of that period, annually or monthly according to the billing frequency the membership
    is held on. Dues are billed, and payments applied, only while the membership record stands in application_received,
    active or grace. The enrollment fee, where the tier charges one, is billed once on the enrollment
    day and is never refunded on cancellation. A payment is applied to the oldest unpaid billing period
    first, and any remainder to the next; a payment larger than everything outstanding leaves the surplus
    as unapplied credit on the membership rather than being returned. Business tiers may settle dues on
    invoice, and an invoice is treated as unpaid only after its terms have run; consumer tiers settle
    on the card on file or from store credit. Dues already billed for a period the customer has used are
    owed in full even if the membership later lapses or is cancelled.
  eligibility:
  - id: billable_membership_state
    applies_to:
    - membership_dues_charge
    - membership_dues_payment
    kind: state
    condition: Dues are billed, and payments applied, only while the membership record stands in application_received,
      active or grace.
    evidence_fields:
    - membership_holdings.status
    - membership_holdings.membership_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - membership_holdings.membership_id
      action_bindings:
        membership_holdings.membership_id: membership_id
    state_contract:
      field: membership_holdings.status
      allowed:
      - application_received
      - active
      - grace
  params:
    per_tier:
      Circle Free Membership:
        annual_dues_usd: =annual_dues_usd
        monthly_dues_usd: =monthly_dues_usd
        invoice_terms_days: =invoice_terms_days
        dues_payment_methods: =dues_payment_methods
      Circle Plus Annual:
        annual_dues_usd: =annual_dues_usd
        monthly_dues_usd: =monthly_dues_usd
        invoice_terms_days: =invoice_terms_days
        dues_payment_methods: =dues_payment_methods
      Circle Total Annual:
        annual_dues_usd: =annual_dues_usd
        monthly_dues_usd: =monthly_dues_usd
        invoice_terms_days: =invoice_terms_days
        dues_payment_methods: =dues_payment_methods
      Circle Total Household Annual:
        annual_dues_usd: =annual_dues_usd
        monthly_dues_usd: =monthly_dues_usd
        invoice_terms_days: =invoice_terms_days
        dues_payment_methods: =dues_payment_methods
      Circle Business Pro:
        annual_dues_usd: =annual_dues_usd
        monthly_dues_usd: =monthly_dues_usd
        invoice_terms_days: =invoice_terms_days
        dues_payment_methods: =dues_payment_methods
      Circle Business Elite:
        annual_dues_usd: =annual_dues_usd
        monthly_dues_usd: =monthly_dues_usd
        invoice_terms_days: =invoice_terms_days
        dues_payment_methods: =dues_payment_methods
  formula:
    when: charge_kind == "annual_dues"
    charge_amount: annual_dues_usd
- id: membership_dues_delinquency
  subject:
  - membership_grace_start
  - membership_lapse
  - membership_reinstate
  rule: When a billed dues period goes unpaid past its due day the membership drops into grace, and where
    the tier suspends benefits in grace the member may not redeem points or benefit credit until the dues
    are settled. A membership may not be moved to lapsed before the grace days of its tier have run in
    full, counted from the day the retailer books the dues charge for the current billing period. Grace
    days are counted as calendar days with the day the dues charge is booked counting as day zero, no
    business-day adjustment is made, and a period that ends on a day the stores are shut is not extended.
    The late fee of the tier is billed when grace begins, and it is owed whether or not the membership
    is later reinstated. A lapsed membership is reinstated at its former tier only when the customer asks
    within the reinstatement window of that tier, measured from the day the membership was moved to lapsed.
    The reinstatement window is counted in calendar days from the lapse day itself, which counts as day
    zero. Reinstatement is refused once the membership has already been reinstated as many times as the
    tier allows, and after the window the customer enrolls afresh at the dues then published, with the
    former term dates not carried over. The reinstatement fee of the tier is billed on reinstatement,
    and unpaid dues from before the lapse stay owed.
  eligibility:
  - id: grace_run_in_full
    applies_to:
    - membership_lapse
    kind: time
    condition: A membership may not be moved to lapsed before the grace days of its tier have run in full,
      counted from the day the retailer books the dues charge for the current billing period.
    evidence_fields:
    - membership_events.billing_period_start
    - membership_holdings.membership_id
    - membership_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - membership_holdings.membership_id
      action_bindings:
        membership_holdings.membership_id: membership_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the retailer books the dues charge for the current billing period
      anchor_source: membership_events.billing_period_start
      relation: not_before
      duration_source: params.grace_period_days
      unit: calendar_days
      counting_rule: Grace days are counted as calendar days with the day the dues charge is booked counting
        as day zero, no business-day adjustment is made, and a period that ends on a day the stores are
        shut is not extended.
      boundary: inclusive
  - id: reinstatement_window_open
    applies_to:
    - membership_reinstate
    kind: time
    condition: A lapsed membership is reinstated at its former tier only when the customer asks within
      the reinstatement window of that tier, measured from the day the membership was moved to lapsed.
    evidence_fields:
    - membership_holdings.lapsed_date
    - membership_holdings.membership_id
    - membership_holdings.reinstatement_count
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - membership_holdings.membership_id
      action_bindings:
        membership_holdings.membership_id: membership_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the day the membership was moved to lapsed
      anchor_source: membership_holdings.lapsed_date
      relation: not_after
      duration_source: params.reinstatement_window_days
      unit: calendar_days
      counting_rule: The reinstatement window is counted in calendar days from the lapse day itself, which
        counts as day zero.
      boundary: inclusive
  params:
    per_tier:
      Circle Free Membership:
        grace_period_days: =grace_period_days
        late_dues_fee_usd: =late_dues_fee_usd
        reinstatement_window_days: =reinstatement_window_days
        reinstatement_fee_usd: =reinstatement_fee_usd
        max_reinstatements: =max_reinstatements
        benefit_suspension_on_grace: =benefit_suspension_on_grace
      Circle Plus Annual:
        grace_period_days: =grace_period_days
        late_dues_fee_usd: =late_dues_fee_usd
        reinstatement_window_days: =reinstatement_window_days
        reinstatement_fee_usd: =reinstatement_fee_usd
        max_reinstatements: =max_reinstatements
        benefit_suspension_on_grace: =benefit_suspension_on_grace
      Circle Total Annual:
        grace_period_days: =grace_period_days
        late_dues_fee_usd: =late_dues_fee_usd
        reinstatement_window_days: =reinstatement_window_days
        reinstatement_fee_usd: =reinstatement_fee_usd
        max_reinstatements: =max_reinstatements
        benefit_suspension_on_grace: =benefit_suspension_on_grace
      Circle Total Household Annual:
        grace_period_days: =grace_period_days
        late_dues_fee_usd: =late_dues_fee_usd
        reinstatement_window_days: =reinstatement_window_days
        reinstatement_fee_usd: =reinstatement_fee_usd
        max_reinstatements: =max_reinstatements
        benefit_suspension_on_grace: =benefit_suspension_on_grace
      Circle Business Pro:
        grace_period_days: =grace_period_days
        late_dues_fee_usd: =late_dues_fee_usd
        reinstatement_window_days: =reinstatement_window_days
        reinstatement_fee_usd: =reinstatement_fee_usd
        max_reinstatements: =max_reinstatements
        benefit_suspension_on_grace: =benefit_suspension_on_grace
      Circle Business Elite:
        grace_period_days: =grace_period_days
        late_dues_fee_usd: =late_dues_fee_usd
        reinstatement_window_days: =reinstatement_window_days
        reinstatement_fee_usd: =reinstatement_fee_usd
        max_reinstatements: =max_reinstatements
        benefit_suspension_on_grace: =benefit_suspension_on_grace
- id: membership_points_accrual
  subject:
  - membership_points_accrue
  rule: Points are earned on qualifying merchandise spend, which is the merchandise total of the purchase
    net of tax, delivery, installation and every discount applied at the till. The base rate of the tier
    recorded on the membership on the day of the purchase applies to all qualifying spend, and the computing,
    mobile and home-theatre bonus or the major appliance bonus is added on top of the base rate for the
    part of the spend in that department; the two department bonuses are never added to each other on
    the same line. A protection plan bought at the same time earns the plan bonus percentage of the plan
    price in points, and this is booked as its own earning occasion rather than folded into the purchase.
    Earned points are rounded to the nearest whole point, with a half point rounded up. Once the membership
    has earned the yearly points cap of its tier within one calendar year, further purchases in that year
    earn nothing, and the cap is read against membership_msr_points_earned_12m only for the part of the
    window falling inside the calendar year. Points on a purchase that is later returned are removed as
    a goodwill adjustment against the original purchase reference. No points are earned while the membership
    stands in grace on a tier that suspends benefits, and none at all once it has lapsed or been cancelled.
  eligibility: []
  params:
    per_tier:
      Circle Free Membership:
        points_per_dollar_base: =points_per_dollar_base
        points_per_dollar_electronics_bonus: =points_per_dollar_electronics_bonus
        points_per_dollar_appliance_bonus: =points_per_dollar_appliance_bonus
        points_cap_per_calendar_year: =points_cap_per_calendar_year
        points_bonus_on_protection_plan_pct: =points_bonus_on_protection_plan_pct
      Circle Plus Annual:
        points_per_dollar_base: =points_per_dollar_base
        points_per_dollar_electronics_bonus: =points_per_dollar_electronics_bonus
        points_per_dollar_appliance_bonus: =points_per_dollar_appliance_bonus
        points_cap_per_calendar_year: =points_cap_per_calendar_year
        points_bonus_on_protection_plan_pct: =points_bonus_on_protection_plan_pct
      Circle Total Annual:
