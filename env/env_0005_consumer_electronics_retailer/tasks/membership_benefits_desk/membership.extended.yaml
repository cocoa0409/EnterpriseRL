  rule: 'A consumer tier and a business tier are never held at the same time on one profile, and a profile
    carrying a business name and a tax exempt certificate is enrolled only on a business tier. Household
    seats are a consumer-tier arrangement and business seats a business-tier arrangement; neither kind
    of seat may be attached to the other kind of tier. A customer who runs a business from the household
    address chooses one arrangement: the household tier, whose seats must share the primary member''s
