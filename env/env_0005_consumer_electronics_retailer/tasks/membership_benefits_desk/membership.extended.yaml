  baseline:
    rule: 'The figure a member must pay to bring a Circle membership back into good standing is worked
      out from the membership ledger itself and never from the running dues figure shown on the membership
      record, which is refreshed only when the nightly collection run reaches it. The entries counted
      are the dues charges and the dues payments booked in the twelve months ending on the handling day.
      The dues side is the total of the annual dues charges and the proration charges among the entries
      counted, and the payments side is the total of the dues payments among them. The payments side is
      taken off the dues side once, on the whole of it, before anything further is added or set against
      it. The parts are combined in one sum, in this order: the dues side less the payments side, plus
      the fee for putting the standing right, less the store credit set against the amount, plus what
      is owed on the plan, plus what is owed on the return and less what is owed to the member on it.
      That sum is rounded to the nearest cent only at the end, no intermediate being rounded, and the
      figure never falls below nothing. The money received is applied to the oldest unpaid billing period
      first, and any remainder to the next. Dues are billed, and payments applied, only while the membership
      record stands in application_received, active or grace.'
