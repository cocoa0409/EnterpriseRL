- id: membership_cancellation_refund
  subject:
  - membership_cancel
  rule: A cancellation is carried into the membership record only against a change request standing as
    confirmed by the customer for that membership. Benefits stop on the day the cancellation takes effect,
    unspent benefit credit is written off, and live points are swept after the sweep rules. Dues are refunded
    in full only when the cancellation is confirmed within the tier's full refund window, counted from
    the day the membership was activated. The full refund window is counted in calendar days from the
    activation day, which counts as day zero. After that window the tiers that refund pro rata refund
    the whole unused months of the term at the dues actually billed, rounded as the tier's proration rounding
    states, and the tiers that do not refund pay nothing back. An enrollment fee, a late fee and a reinstatement
    fee are never refunded, and dues for a period already used are never refunded. A refund is returned
    to the card the dues were taken from where that card is still on file, and otherwise posted as store
    credit.
