    against a haul-away charge, and the service credit against bench or on-site repair labour. Where the
    tier allows only one credit per charge, the credit that leaves the customer paying least is applied
    and the others stay unspent; where the tier is additive, credits are applied together up to the value
    of the charge and never beyond it. A benefit code that already has a redemption booked against the
    same charge reference is not redeemed a second time. A credit is never spent against tax, against
    dues, or against the price of merchandise. Once the membership has booked as many redemptions in the
    membership year as the tier allows, measured by membership_msr_benefit_redemptions_term, further redemptions
