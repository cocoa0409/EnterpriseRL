- id: membership_points_expiry
  subject:
  - membership_points_expire
  rule: A point stays live for the expiry months of the tier held on the day it was earned, counted from
    the end of the calendar month in which it was earned, and is swept off at the end of the sweep month.
    The sweep takes the oldest live points first, and one sweep row is booked per sweep year so the forfeiture
    can be told apart from a redemption. An expiry sweep is booked only against a membership standing
    in active, grace or lapsed. A lapse forfeits every live point at once, whatever its age, and a reinstatement
    inside the window restores only points whose expiry months have not since run out. Points already
    swept are never restored as a courtesy, and a customer who disputes a sweep is shown the earning dates
    rather than being granted a fresh balance.
  eligibility:
  - id: sweepable_membership_state
    applies_to:
    - membership_points_expire
    kind: state
    condition: An expiry sweep is booked only against a membership standing in active, grace or lapsed.
    evidence_fields:
    - membership_holdings.status
    - membership_holdings.membership_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - membership_holdings.membership_id
      action_bindings:
        membership_holdings.membership_id: membership_id
    state_contract:
      field: membership_holdings.status
      allowed:
      - active
      - grace
      - lapsed
  params:
    per_tier:
