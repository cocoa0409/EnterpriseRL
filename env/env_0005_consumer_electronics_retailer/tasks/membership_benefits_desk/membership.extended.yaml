  compute:
  - term_dues_charges: COUNT('membership_events', within_months=12, event_type='membership_dues_charge',
      charge_kind='annual_dues')
  - any_dues_payment: COUNT('membership_events', event_type='membership_dues_payment')
  - settlement_window: 1 if (F('status') == 'grace' and term_dues_charges >= 1) else (K('opening_window_months')
      if (F('status') == 'application_received' and any_dues_payment == 0) else 12)
  - dues_side: SUM('membership_events', 'charge_amount', within_months=settlement_window, event_type='membership_dues_charge',
      charge_kind='annual_dues') + SUM('membership_events', 'charge_amount', within_months=settlement_window,
      event_type='membership_dues_charge', charge_kind='proration')
  - payments_side: SUM('membership_events', 'payment_amount', within_months=settlement_window, event_type='membership_dues_payment')
  - earlier_late_fees_12m: COUNT('membership_events', within_months=12, event_type='membership_dues_charge',
      charge_kind='late_fee')
  - standing_fee: P('reinstatement_fee_usd') if (F('lapsed_date') != '' and DAYS(F('lapsed_date'), NOW)
      <= P('reinstatement_window_days')) else (K('repeat_late_fee_usd') if (F('status') == 'grace' and
      (F('lapsed_date') == '' or DAYS(F('lapsed_date'), NOW) > P('reinstatement_window_days')) and earlier_late_fees_12m
      >= 1) else (P('late_dues_fee_usd') if (F('status') == 'grace' and (F('lapsed_date') == '' or DAYS(F('lapsed_date'),
      NOW) > P('reinstatement_window_days')) and earlier_late_fees_12m == 0) else 0.0))
  - credit_status: CFIELD('credit', 'status')
  - credit_store_balance: float(CFIELD('credit', 'store_credit_balance') or 0)
  - credit_posted_in_validity: XSUM('credit', 'credit_events', 'store_credit_amount', within_months=12,
      event_type='credit_store_credit_post')
  - store_credit_offset: credit_store_balance if (credit_status == 'active' and credit_posted_in_validity
      >= credit_store_balance) else (credit_posted_in_validity if (credit_status == 'active' and credit_posted_in_validity
      < credit_store_balance) else 0.0)
  - plan_status: CFIELD('protection', 'status')
  - premium_shortfall: MX(0.0, XSUM('protection', 'protection_events', 'premium_amount', within_months=12,
      event_type='protection_premium_charge') - XSUM('protection', 'protection_events', 'premium_amount',
      within_months=12, event_type='protection_premium_payment'))
  - plan_deductible_due: float(CFIELD('protection', 'deductible_outstanding') or 0)
  - plan_component: premium_shortfall if ((plan_status == 'active' or plan_status == 'claim_hold') and
      premium_shortfall > 0) else (plan_deductible_due if ((plan_status == 'active' or plan_status ==
      'claim_hold') and premium_shortfall <= 0 and plan_deductible_due > 0) else 0.0)
  - return_status: CFIELD('returns', 'status')
  - return_fee_due: float(CFIELD('returns', 'restocking_fee_outstanding') or 0)
  - return_refund_due: float(CFIELD('returns', 'refund_outstanding') or 0)
  - return_component: return_fee_due if ((return_status == 'inspected' or return_status == 'settled')
      and return_fee_due > 0) else (0.0 - return_refund_due if ((return_status == 'inspected' or return_status
      == 'settled') and return_fee_due == 0 and return_refund_due > 0) else 0.0)
  - result: MX(0.0, RND(dues_side - payments_side + standing_fee - store_credit_offset + plan_component
      + return_component, 2))
  compute_basis:
    term_dues_charges: Where the membership stands in grace and the ledger carries an annual dues charge
      booked in the twelve months ending on the handling day, the entries counted are instead those booked
      in the month ending on the handling day.
    any_dues_payment: Where the membership stands in application_received and the ledger carries no dues
      payment at all, the entries counted are instead those booked in the twenty-four months ending on
      the handling day.
    settlement_window: The entries counted are the dues charges and the dues payments booked in the twelve
      months ending on the handling day. Where the membership stands in grace and the ledger carries an
      annual dues charge booked in the twelve months ending on the handling day, the entries counted are
      instead those booked in the month ending on the handling day. Where the membership stands in application_received
      and the ledger carries no dues payment at all, the entries counted are instead those booked in the
      twenty-four months ending on the handling day.
    dues_side: The dues side is the total of the annual dues charges and the proration charges among the
      entries counted, and the payments side is the total of the dues payments among them.
    payments_side: The dues side is the total of the annual dues charges and the proration charges among
      the entries counted, and the payments side is the total of the dues payments among them. The payments
      side is taken off the dues side once, on the whole of it, before anything further is added or set
      against it.
    earlier_late_fees_12m: Where the membership stands in grace, the record carries no lapse day inside
      the reinstatement window of the tier, and the ledger carries an earlier late fee entry booked in
      the twelve months ending on the handling day, the repeat late fee of this schedule is taken in.
    standing_fee: A fee for putting the standing right is then taken into the figure on the schedule below.
      Where the membership record carries a lapse day and that day falls within the reinstatement window
      of the tier, the reinstatement fee of the tier is taken in. Where the membership stands in grace,
      the record carries no lapse day inside the reinstatement window of the tier, and the ledger carries
      an earlier late fee entry booked in the twelve months ending on the handling day, the repeat late
      fee of this schedule is taken in. Where the membership stands in grace, the record carries no lapse
      day inside that reinstatement window, and the ledger carries no earlier late fee entry in the twelve
      months ending on the handling day, the late fee figure of the tier is taken in. Where none of those
      holds, no fee for putting the standing right is taken in.
    credit_status: Store credit standing on the Northbeam credit account the profile holds is set against
      the amount, a consumer tier settling its dues from the card on file or from store credit, and store
      credit may be drawn only while it is still spendable.
    credit_store_balance: Store credit standing on the Northbeam credit account the profile holds is set
      against the amount, a consumer tier settling its dues from the card on file or from store credit,
      and store credit may be drawn only while it is still spendable.
    credit_posted_in_validity: Where that credit account stands active and the store credit posted to
      it inside the days that account's store credit stays spendable is at or above the balance standing
      on it, the whole of that balance is set against the amount.
    store_credit_offset: Where that credit account stands active and the store credit posted to it inside
      the days that account's store credit stays spendable is at or above the balance standing on it,
      the whole of that balance is set against the amount. Where that credit account stands active and
      the credit posted inside those days falls below the balance standing on it, only the credit posted
      inside those days is set against the amount. Where that credit account does not stand active, no
      store credit is set against the amount.
    plan_status: Money the member owes on the ShieldCare plan the profile holds is brought into the same
      settlement.
    premium_shortfall: Where that plan stands active or in claim hold and the premium charged on it in
      the twelve months ending on the handling day is above the premium paid on it in that window, the
      shortfall between the two is brought in.
    plan_deductible_due: Where that plan stands active or in claim hold, no such shortfall stands and
      a deductible stands unsettled on it, that unsettled deductible is brought in.
    plan_component: Where that plan stands active or in claim hold and the premium charged on it in the
      twelve months ending on the handling day is above the premium paid on it in that window, the shortfall
      between the two is brought in. Where that plan stands active or in claim hold, no such shortfall
      stands and a deductible stands unsettled on it, that unsettled deductible is brought in. Where neither
      of those holds, nothing is brought in for the plan.
    return_status: The return authorisation the profile holds is brought into the same settlement, on
      the side the money runs.
    return_fee_due: Where that return stands inspected or settled and a restocking fee stands outstanding
      on it, that outstanding restocking fee is brought in.
    return_refund_due: Where that return stands inspected or settled, no restocking fee stands outstanding
      on it and a refund stands outstanding to the member, that outstanding refund is set against the
      amount.
    return_component: Where that return stands inspected or settled and a restocking fee stands outstanding
      on it, that outstanding restocking fee is brought in. Where that return stands inspected or settled,
      no restocking fee stands outstanding on it and a refund stands outstanding to the member, that outstanding
      refund is set against the amount. Where neither of those holds, nothing is brought in for the return.
    result: 'The parts are combined in one sum, in this order: the dues side less the payments side, plus
      the fee for putting the standing right, less the store credit set against the amount, plus what
      is owed on the plan, plus what is owed on the return and less what is owed to the member on it.
      That sum is rounded to the nearest cent only at the end, no intermediate being rounded, and the
      figure never falls below nothing.'
