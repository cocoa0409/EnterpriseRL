  rule: The named benefit credits of the tier are granted once per membership year, on the activation
    anniversary, and the grant year is recorded so a second grant in the same year cannot be booked. A
    membership activated part way through a year is granted the full credits of its tier for that year;
    credits are never prorated on the way in. An upgrade grants the difference between the new tier's
    credits and the credits already granted in that membership year; a downgrade grants nothing further
    until the next anniversary. A granted credit stays spendable for the expiry days of the tier and is
    then written off; an unspent credit is never carried into the next membership year and is never paid
    out. Nothing is granted for a membership year in which the membership was in lapsed or cancelled status
