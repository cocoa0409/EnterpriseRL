- id: membership_ext_year_benefit_credit_grant
  base_policy_refs:
  - membership_benefit_grant_cycle
  - membership_combo_protection_interaction
  overwrite:
  - base_policy: membership_benefit_grant_cycle
    superseded_clause: The named benefit credits of the tier are granted once per membership year, on
      the activation anniversary, and the grant year is recorded so a second grant in the same year cannot
      be booked.
    replaced_by: The benefit credit a membership is granted for the membership year now running is worked
      out for the member rather than taken as a single house figure, and it is granted once for that year
      under the service credit, the named benefit that goes toward bench and on-site repair labour.
  - base_policy: membership_combo_protection_interaction
    superseded_clause: the service credit of the tier is granted as well as the anniversary reward rather
      than instead of it
    replaced_by: Where the ShieldCare plan the profile holds stands active or in claim hold and a claim
      has been paid on it in the twelve months ending on the handling day, the figure the year's credit
      starts from is instead the deductible figure that plan carries, so that the next repair costs the
      member nothing.
  trigger: state_due
  subject:
  - membership_benefit_grant
  computes: credit_granted_usd
  target_tool: grant_benefit_credit_b1d93258
  params:
    high_spend_multiple: 1.2
    middle_spend_multiple: 1.1
    mid_spend_share: 0.5
    long_tenure_months: 60
    middle_tenure_months: 24
    long_tenure_addition_usd: 20.0
    middle_tenure_addition_usd: 10.0
    arrears_threshold_usd: 50.0
    arrears_offset_usd: 30.0
    paid_in_full_addition_usd: 25.0
    tier_change_window_months: 6
    reinstated_window_months: 3
  rule: 'The benefit credit a membership is granted for the membership year now running is worked out
    for the member rather than taken as a single house figure, and it is granted once for that year under
    the service credit, the named benefit that goes toward bench and on-site repair labour. The credit
    granted for a membership year starts from the anniversary reward figure of the tier recorded on the
    membership. Where the ShieldCare plan the profile holds stands active or in claim hold and a claim
    has been paid on it in the twelve months ending on the handling day, the figure the year''s credit
    starts from is instead the deductible figure that plan carries, so that the next repair costs the
    member nothing. Where that plan stands active or in claim hold and no claim has been paid on it in
    that window, the figure the year''s credit starts from is instead the service credit figure of the
    tier. Where no plan on the profile stands active or in claim hold, the figure the year''s credit starts
    from is the anniversary reward figure of the tier. The credit already granted under the service credit
    inside the membership year is taken off, and the entries counted for that purpose are the benefit
    grants booked in the twelve months ending on the handling day. Where the day the tier now recorded
    took effect falls within the twelve months ending on the handling day and the ledger carries a proration
    charge booked in that window, the entries counted are instead the benefit grants booked in the six
    months ending on the handling day. Where the membership record carries a lapse day, its reinstatement
    count stands above nothing and the day the tier now recorded took effect falls outside the twelve
    months ending on the handling day, the entries counted are instead the benefit grants booked in the
    three months ending on the handling day. The figure the year''s credit starts from is then scaled
    by what the member has spent. Where the qualifying spend booked on the membership in the twelve months
    ending on the handling day reaches the qualifying spend figure of the tier and three or more earning
    occasions were booked in that window, the figure is taken at the higher spend multiple of this schedule.
    Where that qualifying spend reaches the mid spend share of the qualifying spend figure of the tier
    but not the figure itself, and two or more earning occasions were booked in that window, the figure
    is taken at the middle spend multiple of this schedule. Where neither of those holds, the figure is
    taken as it stands. An addition is made for work the member has open with TechWorks. Where the TechWorks
    agreement the profile holds stands scheduled, dispatched or held for parts and labour has been charged
    on it in the twelve months ending on the handling day, the diagnostic fee figure of the service that
    agreement is handled under is added. Where that agreement stands scheduled, dispatched or held for
    parts and no labour has been charged on it in that window, the least labour billed on that service
    at its labour rate is added. Where no TechWorks agreement on the profile stands scheduled, dispatched
    or held for parts, nothing is added for work in hand. An addition is made for how long the profile
    has held a Circle membership. Where the months since the membership was taken out reach the long tenure
    months of this schedule and the membership record carries no lapse day, the long tenure addition of
    this schedule is added. Where those months reach the middle tenure months of this schedule but not
    the long tenure months, and the membership record carries no lapse day, the middle tenure addition
    of this schedule is added. Where neither of those holds, nothing is added for tenure. The figure is
    then adjusted for how the year''s dues stand. No adjustment is made for how the year''s dues stand.
    Where the dues payments booked in the twelve months ending on the handling day stand at or above the
    dues charged in that window, the paid in full addition of this schedule is added instead. Where those
    payments stand below the dues charged in that window by the arrears threshold of this schedule or
    more, the arrears offset of this schedule is taken off instead. The credit granted for a membership
    year is worked out only after the dues charged for the billing period the membership is now in stand
    met in full by the payments applied to that period. The parts are combined in this order: the figure
    the year''s credit starts from, scaled by the spend multiple, then the addition for work in hand and
    the addition for tenure, then less the credit already granted inside the year, and last the adjustment
    for how the year''s dues stand. The result is rounded to the nearest cent only at the end, no intermediate
    being rounded, and nothing is granted below nothing.'
  prerequisite:
  - problem: membership_ext_grace_dues_settlement
    kind: value_input
    gate: dues_standing_adjustment
    form: state
    policy_source: The credit granted for a membership year is worked out only after the dues charged
      for the billing period the membership is now in stand met in full by the payments applied to that
      period.
    condition: the dues charged for the billing period the membership record is now in are met in full
      by the dues payments applied to that period
    resolved_by: settle_membership_dues_c8b60f0e
    effect: the dues payments booked in the twelve-month window come to stand at or above the dues charged
      in it, so the dues standing adjustment binding moves from the arrears offset to the paid in full
      addition and the credit granted rises by the two together
  cross_category:
  - category: protection
    as: branch
    reads:
    - status
    - deductible_usd
    - protection_events.payout_amount
    note: decides the tier of the figure the year's credit starts from, from the standing of the one plan
      the profile holds and its payout ledger
  - category: service
    as: branch
    reads:
    - status
    - diagnostic_fee_usd
    - minimum_labour_hours
    - base_labour_rate_usd_per_hour
    - service_events.charge_amount
    note: decides the tier of the addition for work in hand, from the standing of the one TechWorks agreement
      the profile holds and its labour ledger
  compute:
  - plan_status: CFIELD('protection', 'status')
  - plan_claims_paid_12m: XCOUNT('protection', 'protection_events', within_months=12, event_type='protection_claim_payout')
  - year_credit_figure: float(CPARAM('protection', 'deductible_usd') or 0) if ((plan_status == 'active'
      or plan_status == 'claim_hold') and plan_claims_paid_12m >= 1) else (P('service_benefit_credit_usd')
      if ((plan_status == 'active' or plan_status == 'claim_hold') and plan_claims_paid_12m == 0) else
      P('anniversary_benefit_credit_usd'))
  - months_on_tier: MONTHS(F('tier_effective_date'), NOW)
  - prorations_12m: COUNT('membership_events', within_months=12, event_type='membership_dues_charge',
      charge_kind='proration')
  - counted_grant_window: K('tier_change_window_months') if (months_on_tier <= 12 and prorations_12m >=
      1) else (K('reinstated_window_months') if (F('lapsed_date') != '' and F('reinstatement_count') >=
      1 and months_on_tier > 12) else 12)
  - prior_same_code_grants: SUM('membership_events', 'benefit_amount', within_months=counted_grant_window,
      event_type='membership_benefit_grant', benefit_code='service_credit')
  - qualifying_spend_12m: SUM('membership_events', 'qualifying_spend_usd', within_months=12, event_type='membership_points_accrue')
  - earning_occasions_12m: COUNT('membership_events', within_months=12, event_type='membership_points_accrue')
  - spend_multiple: K('high_spend_multiple') if (qualifying_spend_12m >= P('qualifying_spend_for_tier_usd')
      and earning_occasions_12m >= 3) else (K('middle_spend_multiple') if (qualifying_spend_12m >= P('qualifying_spend_for_tier_usd')
      * K('mid_spend_share') and qualifying_spend_12m < P('qualifying_spend_for_tier_usd') and earning_occasions_12m
      >= 2) else 1.0)
  - job_status: CFIELD('service', 'status')
  - job_labour_12m: XSUM('service', 'service_events', 'charge_amount', within_months=12, charge_kind='labour')
  - work_in_hand_addition: float(CPARAM('service', 'diagnostic_fee_usd') or 0) if ((job_status == 'scheduled'
      or job_status == 'dispatched' or job_status == 'parts_hold') and job_labour_12m > 0) else (RND(float(CPARAM('service',
      'minimum_labour_hours') or 0) * float(CPARAM('service', 'base_labour_rate_usd_per_hour') or 0),
      2) if ((job_status == 'scheduled' or job_status == 'dispatched' or job_status == 'parts_hold') and
      job_labour_12m == 0) else 0.0)
  - tenure_months: MONTHS(F('enrolled_date'), NOW)
  - tenure_addition: K('long_tenure_addition_usd') if (tenure_months >= K('long_tenure_months') and F('lapsed_date')
      == '') else (K('middle_tenure_addition_usd') if (tenure_months >= K('middle_tenure_months') and
      tenure_months < K('long_tenure_months') and F('lapsed_date') == '') else 0.0)
  - dues_position_12m: RND(SUM('membership_events', 'payment_amount', within_months=12, event_type='membership_dues_payment')
      - SUM('membership_events', 'charge_amount', within_months=12, event_type='membership_dues_charge'),
      2)
  - dues_standing_adjustment: K('paid_in_full_addition_usd') if dues_position_12m >= 0 else (0.0 - K('arrears_offset_usd')
      if dues_position_12m <= 0.0 - K('arrears_threshold_usd') else 0.0)
  - result: MX(0.0, RND(year_credit_figure * spend_multiple + work_in_hand_addition + tenure_addition
      - prior_same_code_grants + dues_standing_adjustment, 2))
  compute_basis:
    plan_status: Where the ShieldCare plan the profile holds stands active or in claim hold and a claim
      has been paid on it in the twelve months ending on the handling day, the figure the year's credit
      starts from is instead the deductible figure that plan carries, so that the next repair costs the
      member nothing.
    plan_claims_paid_12m: Where the ShieldCare plan the profile holds stands active or in claim hold and
      a claim has been paid on it in the twelve months ending on the handling day, the figure the year's
      credit starts from is instead the deductible figure that plan carries, so that the next repair costs
      the member nothing.
    year_credit_figure: The credit granted for a membership year starts from the anniversary reward figure
      of the tier recorded on the membership. Where the ShieldCare plan the profile holds stands active
      or in claim hold and a claim has been paid on it in the twelve months ending on the handling day,
      the figure the year's credit starts from is instead the deductible figure that plan carries, so
      that the next repair costs the member nothing. Where that plan stands active or in claim hold and
      no claim has been paid on it in that window, the figure the year's credit starts from is instead
      the service credit figure of the tier. Where no plan on the profile stands active or in claim hold,
      the figure the year's credit starts from is the anniversary reward figure of the tier.
    months_on_tier: Where the day the tier now recorded took effect falls within the twelve months ending
      on the handling day and the ledger carries a proration charge booked in that window, the entries
      counted are instead the benefit grants booked in the six months ending on the handling day.
    prorations_12m: Where the day the tier now recorded took effect falls within the twelve months ending
      on the handling day and the ledger carries a proration charge booked in that window, the entries
      counted are instead the benefit grants booked in the six months ending on the handling day.
    counted_grant_window: The credit already granted under the service credit inside the membership year
      is taken off, and the entries counted for that purpose are the benefit grants booked in the twelve
      months ending on the handling day. Where the day the tier now recorded took effect falls within
      the twelve months ending on the handling day and the ledger carries a proration charge booked in
      that window, the entries counted are instead the benefit grants booked in the six months ending
      on the handling day. Where the membership record carries a lapse day, its reinstatement count stands
      above nothing and the day the tier now recorded took effect falls outside the twelve months ending
      on the handling day, the entries counted are instead the benefit grants booked in the three months
      ending on the handling day.
    prior_same_code_grants: The credit already granted under the service credit inside the membership
      year is taken off, and the entries counted for that purpose are the benefit grants booked in the
      twelve months ending on the handling day.
    qualifying_spend_12m: Where the qualifying spend booked on the membership in the twelve months ending
      on the handling day reaches the qualifying spend figure of the tier and three or more earning occasions
      were booked in that window, the figure is taken at the higher spend multiple of this schedule.
    earning_occasions_12m: Where the qualifying spend booked on the membership in the twelve months ending
      on the handling day reaches the qualifying spend figure of the tier and three or more earning occasions
      were booked in that window, the figure is taken at the higher spend multiple of this schedule.
    spend_multiple: The figure the year's credit starts from is then scaled by what the member has spent.
      Where the qualifying spend booked on the membership in the twelve months ending on the handling
      day reaches the qualifying spend figure of the tier and three or more earning occasions were booked
      in that window, the figure is taken at the higher spend multiple of this schedule. Where that qualifying
      spend reaches the mid spend share of the qualifying spend figure of the tier but not the figure
      itself, and two or more earning occasions were booked in that window, the figure is taken at the
      middle spend multiple of this schedule. Where neither of those holds, the figure is taken as it
      stands.
    job_status: Where the TechWorks agreement the profile holds stands scheduled, dispatched or held for
      parts and labour has been charged on it in the twelve months ending on the handling day, the diagnostic
      fee figure of the service that agreement is handled under is added.
    job_labour_12m: Where the TechWorks agreement the profile holds stands scheduled, dispatched or held
      for parts and labour has been charged on it in the twelve months ending on the handling day, the
      diagnostic fee figure of the service that agreement is handled under is added.
    work_in_hand_addition: An addition is made for work the member has open with TechWorks. Where the
      TechWorks agreement the profile holds stands scheduled, dispatched or held for parts and labour
      has been charged on it in the twelve months ending on the handling day, the diagnostic fee figure
      of the service that agreement is handled under is added. Where that agreement stands scheduled,
      dispatched or held for parts and no labour has been charged on it in that window, the least labour
      billed on that service at its labour rate is added. Where no TechWorks agreement on the profile
      stands scheduled, dispatched or held for parts, nothing is added for work in hand.
    tenure_months: Where the months since the membership was taken out reach the long tenure months of
      this schedule and the membership record carries no lapse day, the long tenure addition of this schedule
      is added.
    tenure_addition: An addition is made for how long the profile has held a Circle membership. Where
      the months since the membership was taken out reach the long tenure months of this schedule and
      the membership record carries no lapse day, the long tenure addition of this schedule is added.
      Where those months reach the middle tenure months of this schedule but not the long tenure months,
      and the membership record carries no lapse day, the middle tenure addition of this schedule is added.
      Where neither of those holds, nothing is added for tenure.
    dues_position_12m: Where the dues payments booked in the twelve months ending on the handling day
      stand at or above the dues charged in that window, the paid in full addition of this schedule is
      added instead.
    dues_standing_adjustment: The figure is then adjusted for how the year's dues stand. No adjustment
      is made for how the year's dues stand. Where the dues payments booked in the twelve months ending
      on the handling day stand at or above the dues charged in that window, the paid in full addition
      of this schedule is added instead. Where those payments stand below the dues charged in that window
      by the arrears threshold of this schedule or more, the arrears offset of this schedule is taken
      off instead.
    result: 'The parts are combined in this order: the figure the year''s credit starts from, scaled by
      the spend multiple, then the addition for work in hand and the addition for tenure, then less the
      credit already granted inside the year, and last the adjustment for how the year''s dues stand.
      The result is rounded to the nearest cent only at the end, no intermediate being rounded, and nothing
      is granted below nothing.'
  factors:
  - id: plan_backed_starting_figure
    effect: parameter
    decides: year_credit_figure
    bindings:
    - plan_status
    - plan_claims_paid_12m
    - year_credit_figure
    ladder:
    - when: the plan the profile holds stands active or in claim hold and a claim has been paid on it
        in the twelve months ending on the handling day
      value: the deductible figure that plan carries
    - when: that plan stands active or in claim hold and no claim has been paid on it in that window
      value: P('service_benefit_credit_usd')
    - when: otherwise
      value: P('anniversary_benefit_credit_usd')
    baseline:
      year_credit_figure: P('anniversary_benefit_credit_usd')
    evidence:
    - cross_category
    - history
    cross_difficulty: protection
  - id: counted_prior_grant_window
    effect: method
    decides: counted_grant_window
    bindings:
    - months_on_tier
    - prorations_12m
    - counted_grant_window
    - prior_same_code_grants
    ladder:
    - when: the day the tier now recorded took effect falls within the twelve months ending on the handling
        day and the ledger carries a proration charge booked in that window
      method: the entries counted against the year's entitlement are the benefit grants booked in the
        six months ending on the handling day
    - when: the membership record carries a lapse day, its reinstatement count stands above nothing and
        the day the tier now recorded took effect falls outside the twelve months ending on the handling
        day
      method: the entries counted are the benefit grants booked in the three months ending on the handling
        day
    - when: otherwise
      method: the entries counted are the benefit grants booked in the twelve months ending on the handling
        day
    baseline:
      counted_grant_window: '12'
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: spend_backed_multiple
    effect: parameter
    decides: spend_multiple
    bindings:
    - qualifying_spend_12m
    - earning_occasions_12m
    - spend_multiple
    ladder:
    - when: the qualifying spend booked in the twelve months ending on the handling day reaches the qualifying
        spend figure of the tier and three or more earning occasions were booked in that window
      value: K('high_spend_multiple')
    - when: that qualifying spend reaches the mid spend share of the qualifying spend figure of the tier
        but not the figure itself, and two or more earning occasions were booked in that window
      value: K('middle_spend_multiple')
    - when: otherwise
      value: '1'
    baseline:
      spend_multiple: '1.0'
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: work_in_hand_addition_rule
    effect: parameter
    decides: work_in_hand_addition
    bindings:
    - job_status
    - job_labour_12m
    - work_in_hand_addition
    ladder:
    - when: the TechWorks agreement the profile holds stands scheduled, dispatched or held for parts and
        labour has been charged on it in the twelve months ending on the handling day
      value: the diagnostic fee figure of the service that agreement is handled under
    - when: that agreement stands scheduled, dispatched or held for parts and no labour has been charged
        on it in that window
      value: the least labour billed on that service at its labour rate
    - when: otherwise
      value: '0.00'
    baseline:
      work_in_hand_addition: '0.0'
    evidence:
    - cross_category
    - history
    cross_difficulty: service
  - id: tenure_addition_rule
    effect: parameter
    decides: tenure_addition
    bindings:
    - tenure_months
    - tenure_addition
    ladder:
    - when: the months since the membership was taken out reach the long tenure months of this schedule
        and the membership record carries no lapse day
      value: K('long_tenure_addition_usd')
    - when: those months reach the middle tenure months of this schedule but not the long tenure months,
        and the membership record carries no lapse day
      value: K('middle_tenure_addition_usd')
    - when: otherwise
      value: '0.00'
    baseline:
      tenure_addition: '0.0'
    evidence:
    - date
    cross_difficulty: null
  - id: dues_standing_adjustment_rule
    effect: parameter
    decides: dues_standing_adjustment
    bindings:
    - dues_position_12m
    - dues_standing_adjustment
    ladder:
    - when: the dues payments booked in the twelve months ending on the handling day stand at or above
        the dues charged in that window
      value: K('paid_in_full_addition_usd')
    - when: those payments stand below the dues charged in that window by the arrears threshold of this
        schedule or more
      value: the arrears offset of this schedule, taken off
    - when: otherwise
      value: '0.00'
    baseline:
      dues_standing_adjustment: '0.0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: 'The benefit credit a membership is granted for the membership year now running is worked out
      for the member rather than taken as a single house figure, and it is granted once for that year
      under the service credit, the named benefit that goes toward bench and on-site repair labour. The
      credit granted for a membership year starts from the anniversary reward figure of the tier recorded
      on the membership. The credit already granted under the service credit inside the membership year
      is taken off, and the entries counted for that purpose are the benefit grants booked in the twelve
      months ending on the handling day. No adjustment is made for how the year''s dues stand. The parts
      are combined in this order: the figure the year''s credit starts from, scaled by the spend multiple,
      then the addition for work in hand and the addition for tenure, then less the credit already granted
      inside the year, and last the adjustment for how the year''s dues stand. The result is rounded to
      the nearest cent only at the end, no intermediate being rounded, and nothing is granted below nothing.'
    params:
    - anniversary_benefit_credit_usd
  inputs:
    history:
    - table: membership_events
      aggregate: sum
      field: benefit_amount
      within_months: 12
      filters:
        event_type: membership_benefit_grant
        benefit_code: service_credit
    - table: membership_events
      aggregate: sum
      field: qualifying_spend_usd
      within_months: 12
      filters:
        event_type: membership_points_accrue
    - table: membership_events
      aggregate: sum
      field: charge_amount
      within_months: 12
      filters:
        event_type: membership_dues_charge
    - category: protection
      table: protection_events
      aggregate: count
      field: payout_amount
      within_months: 12
      filters:
        event_type: protection_claim_payout
    - category: service
      table: service_events
      aggregate: sum
      field: charge_amount
      within_months: 12
      filters:
        charge_kind: labour
    cross_category:
    - protection
    - service
- id: membership_ext_benefit_credit_application
  base_policy_refs:
  - membership_benefit_redemption
  overwrite:
  - base_policy: membership_benefit_redemption
    superseded_clause: Where the tier allows only one credit per charge, the credit that leaves the customer
      paying least is applied and the others stay unspent; where the tier is additive, credits are applied
      together up to the value of the charge and never beyond it.
    replaced_by: Benefit credit is set against one charge the member is holding, and the amount set against
      it is the smaller of the credit standing under the named benefit that charge's kind calls for and
      the part of that charge the member is left to meet.
  - base_policy: membership_benefit_redemption
    superseded_clause: 'A benefit credit is spent only against a charge of the kind the benefit names:
      the installation credit against installation labour, the delivery credit against a delivery charge,
      the haul-away credit against a haul-away charge, and the service credit against bench or on-site
      repair labour.'
    replaced_by: The part of the charge the member is left to meet is the labour taken, the parts taken
      and the attendance charges taken on the TechWorks job the charge belongs to, less what cover has
      already met, then at the member's discount share and then at the redemption headroom.
  - base_policy: membership_benefit_redemption
    superseded_clause: Once the membership has booked as many redemptions in the membership year as the
      tier allows, measured by membership_msr_benefit_redemptions_term, further redemptions are refused
      until the next anniversary.
    replaced_by: Where the benefit redemptions booked in the twelve months ending on the handling day
      reach the yearly redemption allowance of the tier, no part of the charge is met from benefit credit.
  trigger: on_request
  subject:
  - membership_benefit_redeem
  computes: credit_applied_usd
  target_tool: apply_benefit_credit_8295b346
  params:
    reduced_headroom_share: 0.8
    half_allowance_share: 0.5
    near_window_months: 3
  rule: 'Benefit credit is set against one charge the member is holding, and the amount set against it
    is the smaller of the credit standing under the named benefit that charge''s kind calls for and the
    part of that charge the member is left to meet. The credit standing under a named benefit is the benefit
    credit granted under it in the twelve months ending on the handling day less the benefit credit spent
    under it in that window, and it never falls below nothing. The named benefit a charge''s kind calls
    for is the service credit where the charge is bench or on-site repair labour, the installation credit
    where it is installation labour, the delivery credit where it is a delivery charge and the haul-away
    credit where it is a haul-away charge. The credit set against a charge is worked out only after the
    ledger carries, for the membership year in which that charge falls, a grant of the very named benefit
    that charge''s kind calls for. The labour taken is the least labour billed on that service at its
    labour rate. Where that job stands scheduled, dispatched or held for parts and labour has been charged
    on it in the twelve months ending on the handling day, the labour taken is instead the labour charged
    on the job in that window. Where that job stands completed and labour has been charged on it in that
    window, the labour taken is instead the labour charged on the job in that window less the service
    payments booked on it in that window. No parts are taken. Where the parts charged on the job in the
    twelve months ending on the handling day stand at or above the least labour billed on that service
    at its labour rate and the job stands scheduled, dispatched or held for parts, the parts taken are
    instead the parts charged as they stand. Where the parts charged on the job in that window stand above
    nothing but below the least labour billed on that service at its labour rate and the job stands scheduled,
    dispatched or held for parts, the parts taken are instead the parts charged net of the parts markup
    that service applies. No attendance charges are taken. Where a trip charge stands on the job in the
    twelve months ending on the handling day and the job stands scheduled, dispatched or held for parts,
    the attendance charges taken are instead that trip charge. Where no trip charge stands on the job
    in that window, an after hours surcharge stands on it in that window and the job stands scheduled,
    dispatched or held for parts, the attendance charges taken are instead that surcharge. Nothing is
    taken off for cover. Where the ShieldCare plan the profile holds stands active or in claim hold and
    a payout has been booked on it in the three months ending on the handling day, what cover has met
    is instead the payouts booked on it in those three months. Where that plan stands active or in claim
    hold, no payout stands on it in those three months and a payout stands on it in the twelve months
    ending on the handling day, what cover has met is instead the payouts booked on it in those twelve
    months. There is no member''s discount share. Where the service the job is handled under applies the
    Circle labour discount and an included visit on that job has been used in the twelve months ending
    on the handling day, the share is instead the repair labour discount of the tier together with the
    member only discount of the tier. Where the service the job is handled under applies the Circle labour
    discount and no included visit on that job has been used in that window, the share is instead the
    repair labour discount of the tier alone. The whole of what remains is met at the redemption headroom.
    Where the benefit redemptions booked in the twelve months ending on the handling day reach the yearly
    redemption allowance of the tier, no part of the charge is met from benefit credit. Where those redemptions
    reach the half allowance share of that allowance but not the allowance itself, and the credit spent
    in that window stands at or above the delivery credit figure of the tier, the reduced headroom share
    of this schedule of what remains is met. The part of the charge the member is left to meet is the
    labour taken, the parts taken and the attendance charges taken on the TechWorks job the charge belongs
    to, less what cover has already met, then at the member''s discount share and then at the redemption
    headroom. The order is fixed: the labour, the parts and the attendance charges are added, what cover
    has met is taken off that sum, the discount share is applied once to the whole of the remainder rather
    than line by line, the headroom is then applied to that, and only that final figure is rounded to
    the nearest cent; no intermediate is rounded and the part the member is left to meet never falls below
    nothing. A benefit code that already has a redemption booked against the same charge reference is
    not redeemed a second time. A credit is never set against tax, against dues, or against the price
    of merchandise bought as goods.'
  prerequisite:
  - problem: membership_ext_year_benefit_credit_grant
    kind: value_input
    gate: credit_standing
    form: state
    policy_source: The credit set against a charge is worked out only after the ledger carries, for the
      membership year in which that charge falls, a grant of the very named benefit that charge's kind
      calls for.
    condition: the membership ledger carries a benefit grant entry under the named benefit the charge's
      kind calls for whose grant cycle year is the membership year the charge falls in
    resolved_by: grant_benefit_credit_b1d93258
    effect: the credit standing binding rises from nothing to the credit granted for the membership year
      less what has been spent under that named benefit, so the amount set against the charge is no longer
      held down to nothing
  cross_category:
  - category: service
    as: history
    reads:
    - status
    - minimum_labour_hours
    - base_labour_rate_usd_per_hour
    - parts_markup_pct
    - membership_labour_discount_applies
    - service_events.charge_amount
    - service_events.payment_amount
    note: decides the labour, parts, attendance and discount-share tiers of the part the member must meet,
      from the standing of the one TechWorks agreement the profile holds and its charge ledger
  - category: protection
    as: history
    reads:
    - status
    - protection_events.payout_amount
    note: decides the cover tier of what has already been met, from the standing of the one plan the profile
      holds and its payout ledger
  compute:
  - grants_same_code_12m: SUM('membership_events', 'benefit_amount', within_months=12, event_type='membership_benefit_grant',
      benefit_code='service_credit')
  - redeems_same_code_12m: SUM('membership_events', 'benefit_amount', within_months=12, event_type='membership_benefit_redeem',
      benefit_code='service_credit')
  - credit_standing: MX(0.0, RND(grants_same_code_12m - redeems_same_code_12m, 2))
  - job_status: CFIELD('service', 'status')
  - job_labour_12m: XSUM('service', 'service_events', 'charge_amount', within_months=12, charge_kind='labour')
  - job_payments_12m: XSUM('service', 'service_events', 'payment_amount', within_months=12, event_type='service_payment')
  - least_labour_billed: RND(float(CPARAM('service', 'minimum_labour_hours') or 0) * float(CPARAM('service',
      'base_labour_rate_usd_per_hour') or 0), 2)
  - labour_taken: job_labour_12m if ((job_status == 'scheduled' or job_status == 'dispatched' or job_status
      == 'parts_hold') and job_labour_12m > 0) else (RND(job_labour_12m - job_payments_12m, 2) if (job_status
      == 'completed' and job_labour_12m > 0) else least_labour_billed)
  - job_parts_12m: XSUM('service', 'service_events', 'charge_amount', within_months=12, charge_kind='parts')
  - parts_taken: job_parts_12m if (job_parts_12m >= least_labour_billed and (job_status == 'scheduled'
      or job_status == 'dispatched' or job_status == 'parts_hold')) else (RND(job_parts_12m / (1 + float(CPARAM('service',
      'parts_markup_pct') or 0) / 100), 2) if (job_parts_12m > 0 and (job_status == 'scheduled' or job_status
      == 'dispatched' or job_status == 'parts_hold')) else 0.0)
  - job_trip_12m: XSUM('service', 'service_events', 'charge_amount', within_months=12, charge_kind='trip_charge')
  - job_after_hours_12m: XSUM('service', 'service_events', 'charge_amount', within_months=12, charge_kind='after_hours_surcharge')
  - attendance_taken: job_trip_12m if (job_trip_12m > 0 and (job_status == 'scheduled' or job_status ==
      'dispatched' or job_status == 'parts_hold')) else (job_after_hours_12m if (job_after_hours_12m >
      0 and (job_status == 'scheduled' or job_status == 'dispatched' or job_status == 'parts_hold')) else
      0.0)
  - plan_status: CFIELD('protection', 'status')
  - plan_payouts_3m: XSUM('protection', 'protection_events', 'payout_amount', within_months=K('near_window_months'),
      event_type='protection_claim_payout')
  - plan_payouts_12m: XSUM('protection', 'protection_events', 'payout_amount', within_months=12, event_type='protection_claim_payout')
  - cover_met: plan_payouts_3m if ((plan_status == 'active' or plan_status == 'claim_hold') and plan_payouts_3m
      > 0) else (plan_payouts_12m if ((plan_status == 'active' or plan_status == 'claim_hold') and plan_payouts_3m
      == 0 and plan_payouts_12m > 0) else 0.0)
  - labour_discount_applies: CPARAM('service', 'membership_labour_discount_applies')
  - visits_used_12m: XCOUNT('service', 'service_events', within_months=12, event_type='service_visit_consume')
  - member_share: (P('repair_labour_discount_pct') + P('member_only_discount_pct')) / 100 if (labour_discount_applies
      == True and visits_used_12m >= 1) else (P('repair_labour_discount_pct') / 100 if (labour_discount_applies
      == True and visits_used_12m == 0) else 0.0)
  - redeem_count_12m: COUNT('membership_events', within_months=12, event_type='membership_benefit_redeem')
  - redeem_value_12m: SUM('membership_events', 'benefit_amount', within_months=12, event_type='membership_benefit_redeem')
  - headroom_share: 0.0 if redeem_count_12m >= P('max_benefit_redemptions_per_year') else (K('reduced_headroom_share')
      if (redeem_count_12m >= P('max_benefit_redemptions_per_year') * K('half_allowance_share') and redeem_count_12m
      < P('max_benefit_redemptions_per_year') and redeem_value_12m >= P('delivery_benefit_credit_usd'))
      else 1.0)
  - member_left_to_meet: MX(0.0, RND((labour_taken + parts_taken + attendance_taken - cover_met) * (1
      - member_share) * headroom_share, 2))
  - result: RND(MN(credit_standing, member_left_to_meet), 2)
  compute_basis:
    grants_same_code_12m: The credit standing under a named benefit is the benefit credit granted under
      it in the twelve months ending on the handling day less the benefit credit spent under it in that
      window, and it never falls below nothing.
    redeems_same_code_12m: The credit standing under a named benefit is the benefit credit granted under
      it in the twelve months ending on the handling day less the benefit credit spent under it in that
      window, and it never falls below nothing.
    credit_standing: The credit standing under a named benefit is the benefit credit granted under it
      in the twelve months ending on the handling day less the benefit credit spent under it in that window,
      and it never falls below nothing.
    job_status: Where that job stands scheduled, dispatched or held for parts and labour has been charged
      on it in the twelve months ending on the handling day, the labour taken is instead the labour charged
      on the job in that window.
    job_labour_12m: Where that job stands scheduled, dispatched or held for parts and labour has been
      charged on it in the twelve months ending on the handling day, the labour taken is instead the labour
      charged on the job in that window.
    job_payments_12m: Where that job stands completed and labour has been charged on it in that window,
      the labour taken is instead the labour charged on the job in that window less the service payments
      booked on it in that window.
    least_labour_billed: The labour taken is the least labour billed on that service at its labour rate.
    labour_taken: The labour taken is the least labour billed on that service at its labour rate. Where
      that job stands scheduled, dispatched or held for parts and labour has been charged on it in the
      twelve months ending on the handling day, the labour taken is instead the labour charged on the
      job in that window. Where that job stands completed and labour has been charged on it in that window,
      the labour taken is instead the labour charged on the job in that window less the service payments
      booked on it in that window.
    job_parts_12m: Where the parts charged on the job in the twelve months ending on the handling day
      stand at or above the least labour billed on that service at its labour rate and the job stands
      scheduled, dispatched or held for parts, the parts taken are instead the parts charged as they stand.
    parts_taken: No parts are taken. Where the parts charged on the job in the twelve months ending on
      the handling day stand at or above the least labour billed on that service at its labour rate and
      the job stands scheduled, dispatched or held for parts, the parts taken are instead the parts charged
      as they stand. Where the parts charged on the job in that window stand above nothing but below the
      least labour billed on that service at its labour rate and the job stands scheduled, dispatched
      or held for parts, the parts taken are instead the parts charged net of the parts markup that service
      applies.
    job_trip_12m: Where a trip charge stands on the job in the twelve months ending on the handling day
      and the job stands scheduled, dispatched or held for parts, the attendance charges taken are instead
      that trip charge.
    job_after_hours_12m: Where no trip charge stands on the job in that window, an after hours surcharge
      stands on it in that window and the job stands scheduled, dispatched or held for parts, the attendance
      charges taken are instead that surcharge.
    attendance_taken: No attendance charges are taken. Where a trip charge stands on the job in the twelve
      months ending on the handling day and the job stands scheduled, dispatched or held for parts, the
      attendance charges taken are instead that trip charge. Where no trip charge stands on the job in
      that window, an after hours surcharge stands on it in that window and the job stands scheduled,
      dispatched or held for parts, the attendance charges taken are instead that surcharge.
    plan_status: Where the ShieldCare plan the profile holds stands active or in claim hold and a payout
      has been booked on it in the three months ending on the handling day, what cover has met is instead
      the payouts booked on it in those three months.
    plan_payouts_3m: Where the ShieldCare plan the profile holds stands active or in claim hold and a
      payout has been booked on it in the three months ending on the handling day, what cover has met
      is instead the payouts booked on it in those three months.
    plan_payouts_12m: Where that plan stands active or in claim hold, no payout stands on it in those
      three months and a payout stands on it in the twelve months ending on the handling day, what cover
      has met is instead the payouts booked on it in those twelve months.
    cover_met: Nothing is taken off for cover. Where the ShieldCare plan the profile holds stands active
      or in claim hold and a payout has been booked on it in the three months ending on the handling day,
      what cover has met is instead the payouts booked on it in those three months. Where that plan stands
      active or in claim hold, no payout stands on it in those three months and a payout stands on it
      in the twelve months ending on the handling day, what cover has met is instead the payouts booked
      on it in those twelve months.
    labour_discount_applies: Where the service the job is handled under applies the Circle labour discount
      and an included visit on that job has been used in the twelve months ending on the handling day,
      the share is instead the repair labour discount of the tier together with the member only discount
      of the tier.
    visits_used_12m: Where the service the job is handled under applies the Circle labour discount and
      an included visit on that job has been used in the twelve months ending on the handling day, the
      share is instead the repair labour discount of the tier together with the member only discount of
      the tier.
    member_share: There is no member's discount share. Where the service the job is handled under applies
      the Circle labour discount and an included visit on that job has been used in the twelve months
      ending on the handling day, the share is instead the repair labour discount of the tier together
      with the member only discount of the tier. Where the service the job is handled under applies the
      Circle labour discount and no included visit on that job has been used in that window, the share
      is instead the repair labour discount of the tier alone.
    redeem_count_12m: Where the benefit redemptions booked in the twelve months ending on the handling
      day reach the yearly redemption allowance of the tier, no part of the charge is met from benefit
      credit.
    redeem_value_12m: Where those redemptions reach the half allowance share of that allowance but not
      the allowance itself, and the credit spent in that window stands at or above the delivery credit
      figure of the tier, the reduced headroom share of this schedule of what remains is met.
    headroom_share: The whole of what remains is met at the redemption headroom. Where the benefit redemptions
      booked in the twelve months ending on the handling day reach the yearly redemption allowance of
      the tier, no part of the charge is met from benefit credit. Where those redemptions reach the half
      allowance share of that allowance but not the allowance itself, and the credit spent in that window
      stands at or above the delivery credit figure of the tier, the reduced headroom share of this schedule
      of what remains is met.
    member_left_to_meet: 'The part of the charge the member is left to meet is the labour taken, the parts
      taken and the attendance charges taken on the TechWorks job the charge belongs to, less what cover
      has already met, then at the member''s discount share and then at the redemption headroom. The order
      is fixed: the labour, the parts and the attendance charges are added, what cover has met is taken
      off that sum, the discount share is applied once to the whole of the remainder rather than line
      by line, the headroom is then applied to that, and only that final figure is rounded to the nearest
      cent; no intermediate is rounded and the part the member is left to meet never falls below nothing.'
    result: Benefit credit is set against one charge the member is holding, and the amount set against
      it is the smaller of the credit standing under the named benefit that charge's kind calls for and
      the part of that charge the member is left to meet.
  factors:
  - id: labour_basis_taken
    effect: method
    decides: labour_taken
    bindings:
    - job_status
    - job_labour_12m
    - job_payments_12m
    - least_labour_billed
    - labour_taken
    ladder:
    - when: the job stands scheduled, dispatched or held for parts and labour has been charged on it in
        the twelve months ending on the handling day
      method: the labour taken is the labour charged on the job in that window
    - when: the job stands completed and labour has been charged on it in that window
      method: the labour taken is the labour charged on the job in that window less the service payments
        booked on it in that window
    - when: otherwise
      method: the labour taken is the least labour billed on that service at its labour rate
    baseline:
      labour_taken: least_labour_billed
    evidence:
    - cross_category
    - history
    cross_difficulty: service
  - id: parts_brought_in
    effect: method
    decides: parts_taken
    bindings:
    - job_parts_12m
    - parts_taken
    ladder:
    - when: the parts charged on the job in the twelve months ending on the handling day stand at or above
        the least labour billed on that service at its labour rate and the job stands scheduled, dispatched
        or held for parts
      method: the parts taken are the parts charged as they stand
    - when: the parts charged on the job in that window stand above nothing but below the least labour
        billed on that service at its labour rate and the job stands scheduled, dispatched or held for
        parts
      method: the parts taken are the parts charged net of the parts markup that service applies
    - when: otherwise
      method: no parts are taken
    baseline:
      parts_taken: '0.0'
    evidence:
    - cross_category
    - history
    cross_difficulty: service
  - id: attendance_charges_brought_in
    effect: method
    decides: attendance_taken
    bindings:
    - job_trip_12m
    - job_after_hours_12m
    - attendance_taken
    ladder:
    - when: a trip charge stands on the job in the twelve months ending on the handling day and the job
        stands scheduled, dispatched or held for parts
      method: the attendance charges taken are that trip charge
    - when: no trip charge stands on the job in that window, an after hours surcharge stands on it in
        that window and the job stands scheduled, dispatched or held for parts
      method: the attendance charges taken are that surcharge
    - when: otherwise
      method: no attendance charges are taken
    baseline:
      attendance_taken: '0.0'
    evidence:
    - cross_category
    - history
    cross_difficulty: service
  - id: cover_already_met
    effect: method
    decides: cover_met
    bindings:
    - plan_status
    - plan_payouts_3m
    - plan_payouts_12m
    - cover_met
    ladder:
    - when: the plan the profile holds stands active or in claim hold and a payout has been booked on
        it in the three months ending on the handling day
      method: what cover has met is the payouts booked on that plan in those three months
    - when: that plan stands active or in claim hold, no payout stands on it in those three months and
        a payout stands on it in the twelve months ending on the handling day
      method: what cover has met is the payouts booked on that plan in those twelve months
    - when: otherwise
      method: nothing is taken off for cover
    baseline:
      cover_met: '0.0'
    evidence:
    - cross_category
    - history
    cross_difficulty: protection
  - id: member_discount_share
    effect: parameter
    decides: member_share
    bindings:
    - labour_discount_applies
    - visits_used_12m
    - member_share
    ladder:
    - when: the service the job is handled under applies the Circle labour discount and an included visit
        on that job has been used in the twelve months ending on the handling day
      value: P('repair_labour_discount_pct') together with P('member_only_discount_pct')
    - when: the service the job is handled under applies the Circle labour discount and no included visit
        on that job has been used in that window
      value: P('repair_labour_discount_pct')
    - when: otherwise
      value: '0'
    baseline:
      member_share: '0.0'
    evidence:
    - cross_category
    - history
    cross_difficulty: service
  - id: redemption_headroom
    effect: parameter
    decides: headroom_share
    bindings:
    - redeem_count_12m
    - redeem_value_12m
    - headroom_share
    ladder:
    - when: the benefit redemptions booked in the twelve months ending on the handling day reach the yearly
        redemption allowance of the tier
      value: '0'
    - when: those redemptions reach the half allowance share of that allowance but not the allowance itself,
        and the credit spent in that window stands at or above the delivery credit figure of the tier
      value: K('reduced_headroom_share')
    - when: otherwise
      value: '1'
    baseline:
      headroom_share: '1.0'
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  baseline:
    rule: 'Benefit credit is set against one charge the member is holding, and the amount set against
      it is the smaller of the credit standing under the named benefit that charge''s kind calls for and
      the part of that charge the member is left to meet. The credit standing under a named benefit is
      the benefit credit granted under it in the twelve months ending on the handling day less the benefit
      credit spent under it in that window, and it never falls below nothing. The named benefit a charge''s
      kind calls for is the service credit where the charge is bench or on-site repair labour, the installation
      credit where it is installation labour, the delivery credit where it is a delivery charge and the
      haul-away credit where it is a haul-away charge. The labour taken is the least labour billed on
      that service at its labour rate. No parts are taken. No attendance charges are taken. Nothing is
      taken off for cover. There is no member''s discount share. The whole of what remains is met at the
      redemption headroom. The part of the charge the member is left to meet is the labour taken, the
      parts taken and the attendance charges taken on the TechWorks job the charge belongs to, less what
      cover has already met, then at the member''s discount share and then at the redemption headroom.
      The order is fixed: the labour, the parts and the attendance charges are added, what cover has met
      is taken off that sum, the discount share is applied once to the whole of the remainder rather than
      line by line, the headroom is then applied to that, and only that final figure is rounded to the
      nearest cent; no intermediate is rounded and the part the member is left to meet never falls below
      nothing. A benefit code that already has a redemption booked against the same charge reference is
      not redeemed a second time. A credit is never set against tax, against dues, or against the price
      of merchandise bought as goods.'
    params: []
  inputs:
    history:
    - table: membership_events
      aggregate: sum
      field: benefit_amount
      within_months: 12
      filters:
        event_type: membership_benefit_grant
        benefit_code: service_credit
    - table: membership_events
      aggregate: count
      field: benefit_amount
      within_months: 12
      filters:
        event_type: membership_benefit_redeem
    - category: service
      table: service_events
      aggregate: sum
      field: charge_amount
      within_months: 12
      filters:
        charge_kind: labour
    - category: protection
      table: protection_events
      aggregate: sum
      field: payout_amount
      within_months: 12
      filters:
        event_type: protection_claim_payout
    cross_category:
    - service
    - protection
- id: membership_ext_purchase_points_accrual
  base_policy_refs:
  - membership_points_accrual
  - membership_combo_protection_interaction
  overwrite:
  - base_policy: membership_points_accrual
    superseded_clause: The base rate of the tier recorded on the membership on the day of the purchase
      applies to all qualifying spend, and the computing, mobile and home-theatre bonus or the major appliance
      bonus is added on top of the base rate for the part of the spend in that department; the two department
      bonuses are never added to each other on the same line.
    replaced_by: The rate is the base rate of the tier recorded on the membership, and the department
      bonus and the volume uplift are added on top of it; the rate so built applies to the whole of the
      spend rather than to a part of it.
  - base_policy: membership_points_accrual
    superseded_clause: Points are earned on qualifying merchandise spend, which is the merchandise total
      of the purchase net of tax, delivery, installation and every discount applied at the till.
    replaced_by: Chargeable work carried out on the TechWorks agreement the profile holds is brought into
      the same spend.
  - base_policy: membership_points_accrual
    superseded_clause: Once the membership has earned the yearly points cap of its tier within one calendar
      year, further purchases in that year earn nothing, and the cap is read against membership_msr_points_earned_12m
      only for the part of the window falling inside the calendar year.
    replaced_by: Once the points earned in the twelve months ending on the handling day reach the yearly
      points cap of the tier, no further points are earned, and what is booked never takes the membership
      past that cap.
  - base_policy: membership_points_accrual
    superseded_clause: Earned points are rounded to the nearest whole point, with a half point rounded
      up.
    replaced_by: 'The order is fixed: the spend is settled first, then the rate is built and applied once
      to the whole of it, and only that figure is rounded, to the nearest whole point, with a half point
      rounded to the nearest even point.'
  - base_policy: membership_points_accrual
    superseded_clause: Points on a purchase that is later returned are removed as a goodwill adjustment
      against the original purchase reference.
    replaced_by: Goods that have gone back are taken off the same spend, so that points are not earned
      on merchandise the profile no longer has.
  trigger: state_due
  subject:
  - membership_points_accrue
  computes: points_earned
  target_tool: book_purchase_points_235cc6ac
  params:
    loyal_rate_uplift: 0.5
    middle_rate_uplift: 0.25
    mid_spend_share: 0.5
    near_window_months: 3
  rule: 'Reward points earned on a purchase are worked out from what the profile''s orders are billed
    at, the work carried out alongside them and the goods that have gone back, and the whole of that spend
    is taken at one rate. The spend the points are earned on is the merchandise lines billed to the profile
    in the twelve months ending on the handling day. Where merchandise lines were billed to the profile
    in the month ending on the handling day and a payment was taken on the profile''s orders in that month,
    the lines counted are instead those billed in that month. Where no merchandise line was billed in
    that month and lines were billed in the three months ending on the handling day, the lines counted
    are instead those billed in those three months. Discounts credited on the profile''s orders are taken
    off the lines counted before any rate is applied. The spend is the lines counted as they stand. Where
    a promotional discount was credited inside the window the lines are counted over, the spend is instead
    the lines counted less that promotional discount. Where no promotional discount was credited inside
    that window and a price match was credited inside it, the spend is instead the lines counted less
    that price match. Goods that have gone back are taken off the same spend, so that points are not earned
    on merchandise the profile no longer has. Nothing is taken off the spend for goods going back. Where
    the return authorisation the profile holds stands inspected or settled and a refund was authorised
    on it in the three months ending on the handling day, that refund is instead taken off the spend.
    Where that return stands authorised or received and no refund has yet been authorised on it, the purchase
    price recorded on it is instead taken off the spend. Chargeable work carried out on the TechWorks
    agreement the profile holds is brought into the same spend. Nothing is brought into the spend for
    work. Where that agreement stands completed and labour was charged on it in the month ending on the
    handling day, the labour charged in that month is instead brought into the spend. Where that agreement
    stands completed and no labour was charged on it in that month, the least labour billed on that service
    at its labour rate is instead brought into the spend. The spend the rate is applied to never falls
    below nothing: where the goods that have gone back come to more than the lines counted and the work
    brought into the spend together, the spend is nothing and no points are earned on it. The rate is
    the base rate of the tier recorded on the membership, and the department bonus and the volume uplift
    are added on top of it; the rate so built applies to the whole of the spend rather than to a part
    of it. There is no department bonus. Where the department of the item that agreement was carried out
    on is computing, mobile or home theatre, the department bonus is instead the computing, mobile and
    home-theatre bonus of the tier. Where the department of that item is a major appliance, the department
    bonus is instead the major appliance bonus of the tier. There is no volume uplift. Where the qualifying
    spend booked on the membership in the twelve months ending on the handling day reaches the qualifying
    spend figure of the tier and four or more earning occasions stand in that window, the volume uplift
    is instead the loyal rate uplift of this schedule. Where that spend reaches the mid spend share of
    the qualifying spend figure of the tier but not the figure itself, and two or more earning occasions
    stand in that window, the volume uplift is instead the middle rate uplift of this schedule. The order
    is fixed: the spend is settled first, then the rate is built and applied once to the whole of it,
    and only that figure is rounded, to the nearest whole point, with a half point rounded to the nearest
    even point. Once the points earned in the twelve months ending on the handling day reach the yearly
    points cap of the tier, no further points are earned, and what is booked never takes the membership
    past that cap.'
  prerequisite: []
  cross_category:
  - category: orders
    as: history
    reads:
    - order_events.charge_amount
    - order_events.payment_amount
    - order_events.credit_amount
    note: gives the merchandise lines, the payments taken and the discounts credited on the profile's
      orders, aggregated over the window the first factor selects
  - category: returns
    as: branch
    reads:
    - status
    - purchase_price
    - return_events.refund_amount
    note: decides the tier of what is taken off the spend for goods going back, from the standing of the
      one return authorisation the profile holds and its refund ledger
  - category: service
    as: branch
    reads:
    - status
    - item_category
    - minimum_labour_hours
    - base_labour_rate_usd_per_hour
    - service_events.charge_amount
    note: decides the work brought into the spend and the department bonus, from the standing of the one
      TechWorks agreement the profile holds, the department of the item it was carried out on and its
      labour ledger
  compute:
  - merch_month: XSUM('orders', 'order_events', 'charge_amount', within_months=1, charge_kind='merchandise_line')
  - payments_month: XSUM('orders', 'order_events', 'payment_amount', within_months=1, event_type='orders_payment_capture')
  - merch_quarter: XSUM('orders', 'order_events', 'charge_amount', within_months=K('near_window_months'),
      charge_kind='merchandise_line')
  - merch_window: 1 if (merch_month > 0 and payments_month > 0) else (K('near_window_months') if (merch_month
      == 0 and merch_quarter > 0) else 12)
  - merch_lines: XSUM('orders', 'order_events', 'charge_amount', within_months=merch_window, charge_kind='merchandise_line')
  - promo_credits: XSUM('orders', 'order_events', 'credit_amount', within_months=merch_window, credit_kind='promotional_discount')
  - match_credits: XSUM('orders', 'order_events', 'credit_amount', within_months=merch_window, credit_kind='price_match')
  - purchase_spend: RND(merch_lines - promo_credits, 2) if promo_credits > 0 else (RND(merch_lines - match_credits,
      2) if (promo_credits == 0 and match_credits > 0) else merch_lines)
  - return_status: CFIELD('returns', 'status')
  - return_refunds_3m: XSUM('returns', 'return_events', 'refund_amount', within_months=K('near_window_months'),
      event_type='returns_refund_authorize')
  - returned_spend_taken_off: return_refunds_3m if ((return_status == 'inspected' or return_status ==
      'settled') and return_refunds_3m > 0) else (float(CFIELD('returns', 'purchase_price') or 0) if ((return_status
      == 'authorized' or return_status == 'received') and return_refunds_3m == 0) else 0.0)
  - job_status: CFIELD('service', 'status')
  - job_labour_month: XSUM('service', 'service_events', 'charge_amount', within_months=1, charge_kind='labour')
  - work_spend_added: job_labour_month if (job_status == 'completed' and job_labour_month > 0) else (RND(float(CPARAM('service',
      'minimum_labour_hours') or 0) * float(CPARAM('service', 'base_labour_rate_usd_per_hour') or 0),
      2) if (job_status == 'completed' and job_labour_month == 0) else 0.0)
  - job_department: CFIELD('service', 'item_category')
  - department_bonus: P('points_per_dollar_electronics_bonus') if (job_department == 'laptop_and_tablet'
      or job_department == 'mobile_handset' or job_department == 'television_and_projector' or job_department
      == 'audio_and_home_theatre') else (P('points_per_dollar_appliance_bonus') if job_department == 'major_appliance'
      else 0.0)
  - occasions_12m: COUNT('membership_events', within_months=12, event_type='membership_points_accrue')
  - spend_12m: SUM('membership_events', 'qualifying_spend_usd', within_months=12, event_type='membership_points_accrue')
  - volume_uplift: K('loyal_rate_uplift') if (spend_12m >= P('qualifying_spend_for_tier_usd') and occasions_12m
      >= 4) else (K('middle_rate_uplift') if (spend_12m >= P('qualifying_spend_for_tier_usd') * K('mid_spend_share')
      and spend_12m < P('qualifying_spend_for_tier_usd') and occasions_12m >= 2) else 0.0)
  - earned_points_12m: SUM('membership_events', 'points_delta', within_months=12, event_type='membership_points_accrue')
  - raw_points: RND(MX(0.0, purchase_spend - returned_spend_taken_off + work_spend_added) * (P('points_per_dollar_base')
      + department_bonus + volume_uplift), 0)
  - result: int(MX(0, MN(raw_points, MX(0, P('points_cap_per_calendar_year') - earned_points_12m))))
  compute_basis:
    merch_month: Where merchandise lines were billed to the profile in the month ending on the handling
      day and a payment was taken on the profile's orders in that month, the lines counted are instead
      those billed in that month.
    payments_month: Where merchandise lines were billed to the profile in the month ending on the handling
      day and a payment was taken on the profile's orders in that month, the lines counted are instead
      those billed in that month.
    merch_quarter: Where no merchandise line was billed in that month and lines were billed in the three
      months ending on the handling day, the lines counted are instead those billed in those three months.
    merch_window: The spend the points are earned on is the merchandise lines billed to the profile in
      the twelve months ending on the handling day. Where merchandise lines were billed to the profile
      in the month ending on the handling day and a payment was taken on the profile's orders in that
      month, the lines counted are instead those billed in that month. Where no merchandise line was billed
      in that month and lines were billed in the three months ending on the handling day, the lines counted
      are instead those billed in those three months.
    merch_lines: The spend the points are earned on is the merchandise lines billed to the profile in
      the twelve months ending on the handling day.
    promo_credits: Where a promotional discount was credited inside the window the lines are counted over,
      the spend is instead the lines counted less that promotional discount.
    match_credits: Where no promotional discount was credited inside that window and a price match was
      credited inside it, the spend is instead the lines counted less that price match.
    purchase_spend: Discounts credited on the profile's orders are taken off the lines counted before
      any rate is applied. The spend is the lines counted as they stand. Where a promotional discount
      was credited inside the window the lines are counted over, the spend is instead the lines counted
      less that promotional discount. Where no promotional discount was credited inside that window and
      a price match was credited inside it, the spend is instead the lines counted less that price match.
    return_status: Where the return authorisation the profile holds stands inspected or settled and a
      refund was authorised on it in the three months ending on the handling day, that refund is instead
      taken off the spend.
    return_refunds_3m: Where the return authorisation the profile holds stands inspected or settled and
      a refund was authorised on it in the three months ending on the handling day, that refund is instead
      taken off the spend.
    returned_spend_taken_off: Goods that have gone back are taken off the same spend, so that points are
      not earned on merchandise the profile no longer has. Nothing is taken off the spend for goods going
      back. Where the return authorisation the profile holds stands inspected or settled and a refund
      was authorised on it in the three months ending on the handling day, that refund is instead taken
      off the spend. Where that return stands authorised or received and no refund has yet been authorised
      on it, the purchase price recorded on it is instead taken off the spend.
    job_status: Where that agreement stands completed and labour was charged on it in the month ending
      on the handling day, the labour charged in that month is instead brought into the spend.
    job_labour_month: Where that agreement stands completed and labour was charged on it in the month
      ending on the handling day, the labour charged in that month is instead brought into the spend.
    work_spend_added: Chargeable work carried out on the TechWorks agreement the profile holds is brought
      into the same spend. Nothing is brought into the spend for work. Where that agreement stands completed
      and labour was charged on it in the month ending on the handling day, the labour charged in that
      month is instead brought into the spend. Where that agreement stands completed and no labour was
      charged on it in that month, the least labour billed on that service at its labour rate is instead
      brought into the spend.
    job_department: Where the department of the item that agreement was carried out on is computing, mobile
      or home theatre, the department bonus is instead the computing, mobile and home-theatre bonus of
      the tier.
    department_bonus: There is no department bonus. Where the department of the item that agreement was
      carried out on is computing, mobile or home theatre, the department bonus is instead the computing,
      mobile and home-theatre bonus of the tier. Where the department of that item is a major appliance,
      the department bonus is instead the major appliance bonus of the tier.
    occasions_12m: Where the qualifying spend booked on the membership in the twelve months ending on
      the handling day reaches the qualifying spend figure of the tier and four or more earning occasions
      stand in that window, the volume uplift is instead the loyal rate uplift of this schedule.
    spend_12m: Where the qualifying spend booked on the membership in the twelve months ending on the
      handling day reaches the qualifying spend figure of the tier and four or more earning occasions
      stand in that window, the volume uplift is instead the loyal rate uplift of this schedule.
    volume_uplift: There is no volume uplift. Where the qualifying spend booked on the membership in the
      twelve months ending on the handling day reaches the qualifying spend figure of the tier and four
      or more earning occasions stand in that window, the volume uplift is instead the loyal rate uplift
      of this schedule. Where that spend reaches the mid spend share of the qualifying spend figure of
      the tier but not the figure itself, and two or more earning occasions stand in that window, the
      volume uplift is instead the middle rate uplift of this schedule.
    earned_points_12m: Once the points earned in the twelve months ending on the handling day reach the
      yearly points cap of the tier, no further points are earned, and what is booked never takes the
      membership past that cap.
    raw_points: 'The spend the rate is applied to never falls below nothing: where the goods that have
      gone back come to more than the lines counted and the work brought into the spend together, the
      spend is nothing and no points are earned on it. The rate is the base rate of the tier recorded
      on the membership, and the department bonus and the volume uplift are added on top of it; the rate
      so built applies to the whole of the spend rather than to a part of it.'
    result: 'The order is fixed: the spend is settled first, then the rate is built and applied once to
      the whole of it, and only that figure is rounded, to the nearest whole point, with a half point
      rounded to the nearest even point. Once the points earned in the twelve months ending on the handling
      day reach the yearly points cap of the tier, no further points are earned, and what is booked never
      takes the membership past that cap.'
