- id: membership_combo_protection_interaction
  subject:
  - membership_points_accrue
  - membership_benefit_grant
  rule: 'Holding a protection plan changes what the membership earns and what it is granted: while the
    customer holds at least one protection plan standing active, the plan bonus percentage of the tier
    is earned on every protection plan bought in that membership year, and the service credit of the tier
    is granted as well as the anniversary reward rather than instead of it. The protection plan discount
    of the tier is applied to the plan price before the plan bonus points are worked out, so the discount
    lowers both the price and the points. A plan standing in claim_hold counts as held for the purposes
    of this rule; a plan that is expired, cancelled or void does not, and the service credit is not granted
    on that ground alone. Where the customer holds several plans the interaction is counted once per membership
    year, not once per plan.'
