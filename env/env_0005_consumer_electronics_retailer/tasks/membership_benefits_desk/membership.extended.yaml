- id: membership_ext_points_redemption_release
  base_policy_refs:
  - membership_points_redemption
  overwrite:
  - base_policy: membership_points_redemption
    superseded_clause: Points are redeemed in whole blocks of the tier's minimum redemption block
    replaced_by: 'The order is fixed: the live balance is settled first, the share released is applied
      to it, the three amounts held back are then taken off one after another, the figure is capped at
      what the redemption is being spent against is worth, and only then is it brought down to whole blocks
      of the tier''s minimum redemption block; a balance below one block cannot be redeemed at all.'
  - base_policy: membership_points_redemption
    superseded_clause: A redemption may be taken as a reward certificate, as an instant discount at the
      till, as a donation to the retailer's recycling fund, or, on the tiers that allow it, as a transfer
      of points to another profile; a transfer moves points at face value and earns nothing.
    replaced_by: A redemption put against a charge already standing on the profile is taken as an instant
      discount on that charge rather than as a certificate the member spends later.
  trigger: on_request
  subject:
  - membership_points_redeem
  computes: points_redeemed
  target_tool: redeem_reward_points_8621cafe
  params:
    transfer_share: 0.5
    other_redemption_share: 0.75
    long_window_months: 36
  rule: 'The points a redemption spends are the whole blocks of the balance a member may release at once,
    and never more points than what they are being spent against is worth at the tier''s value per hundred
    points. The points a redemption spends are settled only after the ledger carries an earning entry
    for every purchase already billed on the profile. No points are released until the balance carries
    the sweep entry owed for the calendar year the handling day falls in. The balance a member may release
    starts from the live balance, which is the points earned over the whole ledger less every point spent
    and every point swept. A live balance worked out on this schedule never falls below nothing. Where
    the tier issues a yearly points statement and a sweep entry stands in the twelve months ending on
    the handling day, the live balance is instead the points earned inside the expiry months of the tier
    less the points spent and the points swept inside that same window. Where the tier issues a yearly
    points statement and no sweep entry stands in that window, the live balance is instead the points
    earned in the thirty-six months ending on the handling day less the points spent and the points swept
    in that window. Only a share of that live balance may be released in one redemption. The whole of
    the live balance may be released. Where a transfer out stands in the twelve months ending on the handling
    day and the membership stands active, the share released is instead the transfer share of this schedule.
    Where no transfer out stands in that window, a redemption of another kind stands in it and the membership
    stands active, the share released is instead the other redemption share of this schedule. Points are
    then held back against money the member already owes Northbeam on other lines, each amount held back
    being taken at the tier''s value per hundred points. The figure left when the amounts held back are
    taken off the share released never falls below nothing: where those amounts come to more than that
    share, no points stand to be released. No points are held back for goods coming back. Where the return
    authorisation the profile holds stands inspected or settled and a restocking fee stands outstanding
    on it, the points held back for goods coming back are instead that outstanding restocking fee taken
    at the tier''s value per hundred points. Where that return stands received or in transit and no restocking
    fee stands outstanding on it, the points held back for goods coming back are instead the purchase
    price recorded on it taken at the same rate. No points are held back for cover. Where the ShieldCare
    plan the profile holds stands active or in claim hold and a deductible stands unsettled on it, the
    points held back for cover are instead that unsettled deductible taken at the tier''s value per hundred
    points. Where that plan stands active or in claim hold, no deductible stands unsettled on it and a
    premium stands unsettled on it, the points held back for cover are instead that unsettled premium
    taken at the same rate. No points are held back for work. Where the TechWorks agreement the profile
    holds stands completed and service charges stand outstanding on it, the points held back for work
    are instead those outstanding charges taken at the tier''s value per hundred points. Where that agreement
    stands scheduled, dispatched or held for parts and labour was charged on it in the month ending on
    the handling day, the points held back for work are instead that labour taken at the same rate. What
    the redemption is being spent against is what stands unsettled on the profile''s orders, taken as
    the charges billed less the credits applied and the payments taken over the twelve months ending on
    the handling day, and the points that amount is worth are it taken at the tier''s value per hundred
    points. Where the credits applied and the payments taken come to as much as the charges billed or
    more, nothing stands unsettled on those orders. A redemption put against a charge already standing
    on the profile is taken as an instant discount on that charge rather than as a certificate the member
    spends later. The order is fixed: the live balance is settled first, the share released is applied
    to it, the three amounts held back are then taken off one after another, the figure is capped at what
    the redemption is being spent against is worth, and only then is it brought down to whole blocks of
    the tier''s minimum redemption block; a balance below one block cannot be redeemed at all. Points
    are redeemed only while the membership stands active.'
  prerequisite:
  - problem: membership_ext_purchase_points_accrual
    kind: value_input
    gate: earned_in_life
    form: state
    policy_source: The points a redemption spends are settled only after the ledger carries an earning
      entry for every purchase already billed on the profile.
    condition: the membership ledger carries an earning entry naming every purchase already billed to
      the profile
    resolved_by: book_purchase_points_235cc6ac
    effect: the points earned inside the expiry months rise by the points the purchase earns, so the live
      balance and the balance the redemption may release rise with it
  - problem: membership_ext_points_expiry_sweep
    kind: value_input
    gate: swept_in_life
    form: state
    policy_source: No points are released until the balance carries the sweep entry owed for the calendar
      year the handling day falls in.
    condition: the membership ledger carries a points expiry entry whose sweep year is the calendar year
      the handling day falls in
    resolved_by: sweep_expired_points_bcca39ef
    effect: a sweep entry comes to stand in the twelve months ending on the handling day, so the live
      balance is measured over the expiry months of the tier and falls by the points that sweep takes
  cross_category:
  - category: returns
    as: branch
    reads:
    - status
    - restocking_fee_outstanding
    - purchase_price
    note: decides the tier of the points held back for goods coming back, from the standing of the one
      return authorisation the profile holds and the amounts outstanding on it
  - category: protection
    as: branch
    reads:
    - status
    - deductible_outstanding
    - premium_outstanding
    note: decides the tier of the points held back for cover, from the standing of the one plan the profile
      holds and the amounts standing unsettled on it
  - category: service
    as: branch
    reads:
    - status
    - service_charges_outstanding
    - service_events.charge_amount
    note: decides the tier of the points held back for work, from the standing of the one TechWorks agreement
      the profile holds, the charges outstanding on it and its labour ledger
  - category: orders
    as: history
    reads:
    - order_events.charge_amount
    - order_events.credit_amount
    - order_events.payment_amount
    note: gives what the redemption is being spent against, as the charges billed on the profile's orders
      less the credits applied and the payments taken
  compute:
  - earned_all: SUM('membership_events', 'points_delta', event_type='membership_points_accrue')
  - spent_all: ABS(SUM('membership_events', 'points_delta', event_type='membership_points_redeem'))
  - swept_all: ABS(SUM('membership_events', 'points_delta', event_type='membership_points_expire'))
  - full_net: MX(0.0, earned_all - spent_all - swept_all)
  - earned_in_life: SUM('membership_events', 'points_delta', within_months=P('points_expiry_months'),
      event_type='membership_points_accrue')
  - spent_in_life: ABS(SUM('membership_events', 'points_delta', within_months=P('points_expiry_months'),
      event_type='membership_points_redeem'))
  - swept_in_life: ABS(SUM('membership_events', 'points_delta', within_months=P('points_expiry_months'),
      event_type='membership_points_expire'))
  - rolling_net: MX(0.0, earned_in_life - spent_in_life - swept_in_life)
  - long_net: MX(0.0, SUM('membership_events', 'points_delta', within_months=K('long_window_months'),
      event_type='membership_points_accrue') - ABS(SUM('membership_events', 'points_delta', within_months=K('long_window_months'),
      event_type='membership_points_redeem')) - ABS(SUM('membership_events', 'points_delta', within_months=K('long_window_months'),
      event_type='membership_points_expire')))
  - sweeps_12m: COUNT('membership_events', within_months=12, event_type='membership_points_expire')
  - live_balance: rolling_net if (P('annual_points_statement') == True and sweeps_12m >= 1) else (long_net
      if (P('annual_points_statement') == True and sweeps_12m == 0) else full_net)
  - transfers_12m: COUNT('membership_events', within_months=12, event_type='membership_points_redeem',
      redemption_kind='points_transfer')
  - redemptions_12m: COUNT('membership_events', within_months=12, event_type='membership_points_redeem')
  - share_released: K('transfer_share') if (transfers_12m >= 1 and F('status') == 'active') else (K('other_redemption_share')
      if (transfers_12m == 0 and redemptions_12m >= 1 and F('status') == 'active') else 1.0)
  - return_status: CFIELD('returns', 'status')
  - return_fee_due: float(CFIELD('returns', 'restocking_fee_outstanding') or 0)
  - held_for_returns: RND(return_fee_due / P('points_value_usd_per_100_points') * 100, 0) if ((return_status
      == 'inspected' or return_status == 'settled') and return_fee_due > 0) else (RND(float(CFIELD('returns',
      'purchase_price') or 0) / P('points_value_usd_per_100_points') * 100, 0) if ((return_status == 'received'
      or return_status == 'in_transit') and return_fee_due == 0) else 0.0)
  - plan_status: CFIELD('protection', 'status')
  - plan_deductible_due: float(CFIELD('protection', 'deductible_outstanding') or 0)
  - plan_premium_due: float(CFIELD('protection', 'premium_outstanding') or 0)
  - held_for_cover: RND(plan_deductible_due / P('points_value_usd_per_100_points') * 100, 0) if ((plan_status
      == 'active' or plan_status == 'claim_hold') and plan_deductible_due > 0) else (RND(plan_premium_due
      / P('points_value_usd_per_100_points') * 100, 0) if ((plan_status == 'active' or plan_status ==
      'claim_hold') and plan_deductible_due == 0 and plan_premium_due > 0) else 0.0)
  - job_status: CFIELD('service', 'status')
  - job_charges_due: float(CFIELD('service', 'service_charges_outstanding') or 0)
  - job_labour_month: XSUM('service', 'service_events', 'charge_amount', within_months=1, charge_kind='labour')
  - held_for_work: RND(job_charges_due / P('points_value_usd_per_100_points') * 100, 0) if (job_status
      == 'completed' and job_charges_due > 0) else (RND(job_labour_month / P('points_value_usd_per_100_points')
      * 100, 0) if ((job_status == 'scheduled' or job_status == 'dispatched' or job_status == 'parts_hold')
      and job_labour_month > 0) else 0.0)
  - releasable: MX(0.0, live_balance * share_released - held_for_returns - held_for_cover - held_for_work)
  - orders_unsettled: MX(0.0, RND(XSUM('orders', 'order_events', 'charge_amount', within_months=12) -
      XSUM('orders', 'order_events', 'credit_amount', within_months=12) - XSUM('orders', 'order_events',
      'payment_amount', within_months=12), 2))
  - spent_against_worth: RND(orders_unsettled / P('points_value_usd_per_100_points') * 100, 0)
  - result: int(MN(spent_against_worth, releasable) / P('points_min_redemption_block')) * P('points_min_redemption_block')
