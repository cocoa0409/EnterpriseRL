- id: membership_ext_points_expiry_sweep
  base_policy_refs:
  - membership_points_expiry
  overwrite:
  - base_policy: membership_points_expiry
    superseded_clause: A point stays live for the expiry months of the tier held on the day it was earned,
      counted from the end of the calendar month in which it was earned, and is swept off at the end of
      the sweep month.
    replaced_by: A point is given the expiry months of the tier as its life, counted back from the handling
      day, and the pool swept is the points earned over the whole ledger less the points earned inside
      that life.
  trigger: state_due
  subject:
  - membership_points_expire
  computes: points_swept
  target_tool: sweep_expired_points_bcca39ef
  params:
    active_member_extension_months: 6
    dormancy_reduction_months: 6
    near_window_months: 3
  rule: 'The points a sweep forfeits are the points that have outlived the life a point is given on the
    tier, less what has already gone off the balance on their account. A point is given the expiry months
    of the tier as its life, counted back from the handling day, and the pool swept is the points earned
    over the whole ledger less the points earned inside that life. Where the membership stands active
    and an earning occasion stands in the three months ending on the handling day, the pool swept is measured
    against a life of the expiry months of the tier and the active member extension of this schedule together.
    Where the membership does not stand active and no earning occasion stands in the three months ending
    on the handling day, the pool swept is measured against a life of the expiry months of the tier less
    the dormancy reduction of this schedule. Points already spent are set against the pool before it is
    swept, the oldest points having gone first. The points set against the pool are every point spent
    on the ledger. Where one or more redemptions stand in the twelve months ending on the handling day
    and the membership stands active, the points set against the pool are instead the points spent in
    that window. Where no redemption stands in that window, a transfer out stands on the ledger and the
    membership stands active, the points set against the pool are instead the points transferred out over
    the whole ledger. Points an earlier sweep has already taken are set against the pool as well. No points
    are treated as already taken. Where a sweep entry stands in the twenty-four months ending on the handling
    day and the membership stands active, the points already taken are instead those swept in that window.
    Where no sweep entry stands in that window and a sweep entry stands earlier on the ledger, the points
    already taken are instead those swept over the whole ledger. Points the member has already had the
    value of, as store credit posted to the Northbeam credit account the profile holds as a promotional
    award, are set against the pool at the tier''s value per hundred points. Nothing is set against the
    pool on that account. Where that credit account stands active and store credit was posted to it as
    a promotional award in the twelve months ending on the handling day, the points set against the pool
    on that account are instead what the awards posted in that window are worth at the tier''s value per
    hundred points. Where that credit account stands active and awards were posted to it only earlier
    than that window, the points set against the pool on that account are instead what the awards posted
    over the whole ledger are worth at the same rate. The order is fixed: the pool is settled first, then
    the points spent, the points already taken and the points already had the value of are taken off it
    one after another, and the figure swept is a whole number of points that never falls below nothing.
    The sweep year a forfeiture belongs to is the calendar year the day it is booked falls in, and one
    sweep entry is booked for each sweep year, so the forfeiture can be told apart from a redemption.'
  prerequisite: []
  cross_category:
  - category: credit
    as: history
    reads:
    - status
    - credit_events.store_credit_amount
    note: decides the tier of the points already had the value of, from the standing of the one credit
      account the profile holds and the promotional awards posted to it
  compute:
  - recent_occasions_3m: COUNT('membership_events', within_months=K('near_window_months'), event_type='membership_points_accrue')
  - point_life_months: P('points_expiry_months') + K('active_member_extension_months') if (F('status')
      == 'active' and recent_occasions_3m >= 1) else (P('points_expiry_months') - K('dormancy_reduction_months')
      if (F('status') != 'active' and recent_occasions_3m == 0) else P('points_expiry_months'))
  - earned_all: SUM('membership_events', 'points_delta', event_type='membership_points_accrue')
  - earned_in_life: SUM('membership_events', 'points_delta', within_months=point_life_months, event_type='membership_points_accrue')
  - aged_pool: MX(0.0, earned_all - earned_in_life)
  - redemptions_12m: COUNT('membership_events', within_months=12, event_type='membership_points_redeem')
  - transfers_all: COUNT('membership_events', event_type='membership_points_redeem', redemption_kind='points_transfer')
  - spent_12m: ABS(SUM('membership_events', 'points_delta', within_months=12, event_type='membership_points_redeem'))
  - transferred_all: ABS(SUM('membership_events', 'points_delta', event_type='membership_points_redeem',
      redemption_kind='points_transfer'))
  - spent_all: ABS(SUM('membership_events', 'points_delta', event_type='membership_points_redeem'))
  - spend_set_against_pool: spent_12m if (redemptions_12m >= 1 and F('status') == 'active') else (transferred_all
      if (redemptions_12m == 0 and transfers_all >= 1 and F('status') == 'active') else spent_all)
  - swept_24m: ABS(SUM('membership_events', 'points_delta', within_months=24, event_type='membership_points_expire'))
  - swept_all: ABS(SUM('membership_events', 'points_delta', event_type='membership_points_expire'))
  - already_taken: swept_24m if (swept_24m > 0 and F('status') == 'active') else (swept_all if (swept_24m
      == 0 and swept_all > 0) else 0.0)
  - credit_status: CFIELD('credit', 'status')
  - award_posted_12m: XSUM('credit', 'credit_events', 'store_credit_amount', within_months=12, event_type='credit_store_credit_post',
      post_reason='promotional_award')
  - award_posted_all: XSUM('credit', 'credit_events', 'store_credit_amount', event_type='credit_store_credit_post',
      post_reason='promotional_award')
  - value_already_had: RND(award_posted_12m / P('points_value_usd_per_100_points') * 100, 0) if (credit_status
      == 'active' and award_posted_12m > 0) else (RND(award_posted_all / P('points_value_usd_per_100_points')
      * 100, 0) if (credit_status == 'active' and award_posted_12m == 0 and award_posted_all > 0) else
      0.0)
  - result: int(MX(0.0, aged_pool - spend_set_against_pool - already_taken - value_already_had))
  compute_basis:
    recent_occasions_3m: Where the membership stands active and an earning occasion stands in the three
      months ending on the handling day, the pool swept is measured against a life of the expiry months
      of the tier and the active member extension of this schedule together.
    point_life_months: A point is given the expiry months of the tier as its life, counted back from the
      handling day, and the pool swept is the points earned over the whole ledger less the points earned
      inside that life. Where the membership stands active and an earning occasion stands in the three
      months ending on the handling day, the pool swept is measured against a life of the expiry months
      of the tier and the active member extension of this schedule together. Where the membership does
      not stand active and no earning occasion stands in the three months ending on the handling day,
      the pool swept is measured against a life of the expiry months of the tier less the dormancy reduction
      of this schedule.
    earned_all: A point is given the expiry months of the tier as its life, counted back from the handling
      day, and the pool swept is the points earned over the whole ledger less the points earned inside
      that life.
    earned_in_life: A point is given the expiry months of the tier as its life, counted back from the
      handling day, and the pool swept is the points earned over the whole ledger less the points earned
      inside that life.
    aged_pool: A point is given the expiry months of the tier as its life, counted back from the handling
      day, and the pool swept is the points earned over the whole ledger less the points earned inside
      that life.
    redemptions_12m: Where one or more redemptions stand in the twelve months ending on the handling day
      and the membership stands active, the points set against the pool are instead the points spent in
      that window.
    transfers_all: Where no redemption stands in that window, a transfer out stands on the ledger and
      the membership stands active, the points set against the pool are instead the points transferred
      out over the whole ledger.
    spent_12m: Where one or more redemptions stand in the twelve months ending on the handling day and
      the membership stands active, the points set against the pool are instead the points spent in that
      window.
    transferred_all: Where no redemption stands in that window, a transfer out stands on the ledger and
      the membership stands active, the points set against the pool are instead the points transferred
      out over the whole ledger.
    spent_all: The points set against the pool are every point spent on the ledger.
    spend_set_against_pool: Points already spent are set against the pool before it is swept, the oldest
      points having gone first. The points set against the pool are every point spent on the ledger. Where
      one or more redemptions stand in the twelve months ending on the handling day and the membership
      stands active, the points set against the pool are instead the points spent in that window. Where
      no redemption stands in that window, a transfer out stands on the ledger and the membership stands
      active, the points set against the pool are instead the points transferred out over the whole ledger.
    swept_24m: Where a sweep entry stands in the twenty-four months ending on the handling day and the
      membership stands active, the points already taken are instead those swept in that window.
    swept_all: Where no sweep entry stands in that window and a sweep entry stands earlier on the ledger,
      the points already taken are instead those swept over the whole ledger.
    already_taken: Points an earlier sweep has already taken are set against the pool as well. No points
      are treated as already taken. Where a sweep entry stands in the twenty-four months ending on the
      handling day and the membership stands active, the points already taken are instead those swept
      in that window. Where no sweep entry stands in that window and a sweep entry stands earlier on the
      ledger, the points already taken are instead those swept over the whole ledger.
    credit_status: Where that credit account stands active and store credit was posted to it as a promotional
      award in the twelve months ending on the handling day, the points set against the pool on that account
      are instead what the awards posted in that window are worth at the tier's value per hundred points.
    award_posted_12m: Where that credit account stands active and store credit was posted to it as a promotional
      award in the twelve months ending on the handling day, the points set against the pool on that account
      are instead what the awards posted in that window are worth at the tier's value per hundred points.
    award_posted_all: Where that credit account stands active and awards were posted to it only earlier
      than that window, the points set against the pool on that account are instead what the awards posted
      over the whole ledger are worth at the same rate.
    value_already_had: Points the member has already had the value of, as store credit posted to the Northbeam
      credit account the profile holds as a promotional award, are set against the pool at the tier's
      value per hundred points. Nothing is set against the pool on that account. Where that credit account
      stands active and store credit was posted to it as a promotional award in the twelve months ending
      on the handling day, the points set against the pool on that account are instead what the awards
      posted in that window are worth at the tier's value per hundred points. Where that credit account
      stands active and awards were posted to it only earlier than that window, the points set against
      the pool on that account are instead what the awards posted over the whole ledger are worth at the
      same rate.
    result: 'The order is fixed: the pool is settled first, then the points spent, the points already
      taken and the points already had the value of are taken off it one after another, and the figure
      swept is a whole number of points that never falls below nothing. The sweep year a forfeiture belongs
      to is the calendar year the day it is booked falls in, and one sweep entry is booked for each sweep
      year, so the forfeiture can be told apart from a redemption.'
