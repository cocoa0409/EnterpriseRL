category: membership
display_name: Northbeam Circle Membership
binding:
  holding_table: membership_holdings
  event_tables:
  - membership_events
  intake_tables:
  - membership_change_requests
  status_field: status
  variant_field: variant_name
  quantity_fields:
    points_balance: reward_points
    benefit_credit_balance: benefit_credit
    dues_outstanding: dues_receivable
lifecycle:
  states:
  - application_received
  - active
  - grace
  - lapsed
  - cancelled
  transitions:
  - from: application_received
    to: active
    by: agent
    means: the first dues charge cleared, or the free tier needs none, and benefits become usable
  - from: active
    to: grace
    by: system
    means: a billed dues period went unpaid past its due day
  - from: grace
    to: active
    by: agent
    means: the outstanding dues and the late fee were settled inside grace
  - from: grace
    to: lapsed
    by: system
    means: grace ran out with the dues still unpaid
  - from: lapsed
    to: active
    by: agent
    means: the former tier was reinstated inside the reinstatement window
  - from: active
    to: cancelled
    by: user
    means: the customer confirmed the cancellation of an active membership
  - from: grace
    to: cancelled
    by: user
    means: the customer confirmed the cancellation while dues were outstanding
accounts:
- key: reward_points
  unit: points
  meaning: reward points earned on spend and spent on redemptions; the balance is the running sum of the
    deltas
- key: benefit_credit
  unit: USD
  meaning: granted membership benefit credit still available to spend against delivery, installation,
    haul-away and repair charges
- key: dues_receivable
  unit: USD
  meaning: membership dues and fees billed and not yet settled; an in delta bills the customer and an
    out delta records money received
parameter_schema:
  annual_dues_usd: Annual membership dues billed for a full term, USD.
  monthly_dues_usd: Monthly membership dues where monthly billing is offered, USD; 0.00 where the tier
    is annual only or free.
  billing_frequencies_offered: Billing frequencies the tier may be held on (string list).
  enrollment_fee_usd: One-off fee charged when the membership is opened, USD.
  free_trial_days: Days of full benefits before the first dues charge is booked.
  points_per_dollar_base: Reward points earned per USD of qualifying merchandise spend.
  points_per_dollar_electronics_bonus: Extra points per USD on computing, mobile and home-theatre merchandise.
  points_per_dollar_appliance_bonus: Extra points per USD on major appliances.
  points_value_usd_per_100_points: Redemption value of 100 reward points, USD.
  points_min_redemption_block: Smallest block of points that may be redeemed at once.
  points_expiry_months: Months a point stays live from the month it was earned.
  points_cap_per_calendar_year: Most points a membership may earn in one calendar year.
  points_bonus_on_protection_plan_pct: Extra points, as a percentage of the plan price, when a protection
    plan is bought.
  points_transfer_allowed: Whether points may be transferred to another profile.
  annual_points_statement: Whether a yearly points statement is issued to the member.
  anniversary_benefit_credit_usd: Benefit credit granted on each membership anniversary, USD.
  install_benefit_credit_usd: Benefit credit granted each membership year toward installation labour,
    USD.
  delivery_benefit_credit_usd: Benefit credit granted each membership year toward delivery charges, USD.
  service_benefit_credit_usd: Benefit credit granted each membership year toward bench and on-site repair
    labour, USD.
  benefit_credit_expiry_days: Days a granted benefit credit stays spendable from the grant date.
  benefit_credit_stacking_basis: How several benefit credits combine on one charge (string).
  max_benefit_redemptions_per_year: Most benefit redemptions allowed in one membership year.
  free_standard_delivery_threshold_usd: Order value at or above which standard delivery is free, USD.
  free_haul_away_per_year: Appliance haul-aways included each membership year.
  return_window_extension_days: Extra days added to the published return window for members.
  restocking_fee_waiver_pct: Share of a restocking fee waived for the member, percent.
  price_match_window_days: Days after purchase within which a lower advertised price is matched.
  price_match_channels: Where a competing price is accepted from (string).
  exclusive_presale_access: Whether the member may buy in a presale window before general release.
  member_only_discount_pct: Standing discount on member-priced merchandise, percent.
  protection_plan_discount_pct: Discount on the price of a protection plan bought by the member, percent.
  repair_labour_discount_pct: Discount on chargeable repair labour, percent.
  included_support_visits_per_year: On-site or bench support visits included each membership year.
  remote_support_included: Whether unlimited remote support sessions are included.
  priority_support_queue: Whether calls are routed to the priority queue.
  dedicated_account_manager: Whether a named account manager is assigned.
  grace_period_days: Calendar days a membership stays in grace after dues fall due.
  late_dues_fee_usd: Fee charged when dues are still unpaid at the end of grace, USD.
  reinstatement_fee_usd: Fee charged to reinstate a lapsed membership at its former tier, USD.
  reinstatement_window_days: Calendar days after lapse within which the former tier may be reinstated.
  max_reinstatements: Most reinstatements allowed on one membership record.
  cancellation_refund_basis: How dues are refunded on cancellation (string).
  cancellation_full_refund_window_days: Days from activation within which dues are refunded in full.
  proration_rounding: How a prorated amount is rounded (string).
  household_member_slots: Household seats that may share the membership benefits.
  business_seat_slots: Named business buyers that may transact on the membership.
  seat_addition_fee_usd: Fee to add one further seat beyond those included, USD.
  tier_upgrade_basis: How an upgrade is charged and when it takes effect (string).
  tier_downgrade_basis: When a downgrade takes effect (string).
  auto_renew_default: Whether auto renewal is switched on when the membership is opened.
  renewal_notice_days: Days before renewal that the renewal notice is sent.
  dues_payment_methods: Ways dues may be settled on this tier (string).
  invoice_terms_days: Days a business invoice for dues may run before it is treated as unpaid.
  trade_in_bonus_pct: Uplift applied to a trade-in appraisal for the member, percent.
  trade_in_bonus_cap_usd: Most the trade-in uplift may add on one appraisal, USD.
  abuse_return_count_threshold: Returns in a rolling year beyond which the membership is reviewed for
    abuse.
  qualifying_spend_for_tier_usd: Trailing-term merchandise spend that qualifies the profile for this tier
    without a dues charge, USD.
  tax_exempt_enrollment_allowed: Whether the tier may be opened on a tax exempt business profile.
  benefit_suspension_on_grace: Whether benefits stop being usable while the membership sits in grace.
