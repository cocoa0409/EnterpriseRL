- id: membership_points_redemption
  subject:
  - membership_points_redeem
  rule: Points are redeemed only while the membership stands active. Points are redeemed in whole blocks
    of the tier's minimum redemption block, and a balance below one block cannot be redeemed at all. The
    value of a redemption is the tier's value per hundred points applied to the points spent, rounded
    to the nearest cent. A redemption may be taken as a reward certificate, as an instant discount at
    the till, as a donation to the retailer's recycling fund, or, on the tiers that allow it, as a transfer
    of points to another profile; a transfer moves points at face value and earns nothing. Points spent
    on a purchase that is then returned are restored to the balance as a fresh earning occasion, not by
    deleting the redemption. Points may never be redeemed against dues, and they may never be paid out
    as cash.
  eligibility:
  - id: active_for_redemption
    applies_to:
