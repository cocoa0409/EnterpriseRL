    bindings: [autopay_on, admin_charge]
    ladder:
    - when: no automatic payment instruction stands on the store credit account and the plan is one whose claims are worked ahead of the ordinary queue
      value: fifteen dollars
    - when: no automatic payment instruction stands on that account and the plan is not one whose claims are worked ahead of the ordinary queue
      value: seven dollars and fifty cents
    - when: otherwise
      value: no charge for raising the invoice
    baseline:
      admin_charge: "0.0"
    evidence: [cross_category, tier_param]
    cross_difficulty: credit
  baseline:
    rule: >-
      The premium entries the invoice carries come to the plan's monthly premium. No period is billed in advance with
      the invoice. A period billed in advance is priced at the plan's monthly premium. No discount for the account's
      payment record is allowed. No charge for raising the invoice is added. The amount settled is the premium entries
      the invoice carries together with the periods billed in advance at the price they carry, that total reduced once
      by the discount for the account's payment record, and the charge for raising the invoice then added, taken to the
      cent and never below nothing.
    params: [monthly_premium_usd]
  inputs:
    history:
    - {table: protection_events, aggregate: sum, field: premium_amount, within_months: null, filters: {event_type: protection_premium_charge}}
    - {table: protection_events, aggregate: sum, field: premium_amount, within_months: null, filters: {event_type: protection_premium_payment}}
    - {table: protection_events, aggregate: latest, field: premium_amount, within_months: null, filters: {event_type: protection_premium_charge, premium_kind: monthly_instalment}}
    - {table: protection_events, aggregate: sum, field: premium_amount, within_months: 3, filters: {event_type: protection_premium_charge, premium_kind: monthly_instalment}}
    - {category: credit, table: credit_events, aggregate: count, field: statement_period_end, within_months: 3, filters: {event_type: credit_statement_close}}
    cross_category: [credit]
