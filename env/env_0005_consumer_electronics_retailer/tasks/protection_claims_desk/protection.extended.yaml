- id: protection_agg_payout_cap
  subject:
  - protection_claim_payout
  rule: 'Payouts are counted across every plan the customer holds, not plan by plan: the rolling twelve-month total read from protection_msr_payouts_12m is compared with the aggregate cap of the plan the
    claim sits on, and the payout is cut back to whatever room the cap leaves. Where the customer holds plans of different tiers the aggregate cap of the highest-ranked plan standing active or in claim_hold
    governs, and the caps of the other plans are not added to it. Payouts on plans that are expired, cancelled or void still count toward the rolling total, because the money was paid inside the window.
    Where the cap leaves no room the claim is still decided on its merits and the approval is recorded with nothing to pay, so the customer can see the cap rather than a bare refusal. The aggregate cap
    is applied after the per-claim limit and the coverage remaining, and never before them.'
  eligibility: []
  params:
    per_tier:
      ShieldCare Essential Parts and Labour:
        aggregate_payout_cap_per_12m_usd: =aggregate_payout_cap_per_12m_usd
      ShieldCare Accidental Damage Plus:
