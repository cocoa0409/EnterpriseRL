    cost is above either cap the plan pays the cap and the customer pays the rest, and the claim is not split into two to get round the cap. A cash reimbursement is the item purchase price less the depreciation
    the plan's schedule gives for the item's age in whole months at the incident day, and is then capped at the plan's reimbursement percentage of that purchase price. The plan's deductible is billed once
    per approved claim, and it is waived where the plan waives it on a claim settled by repair; a deductible is never billed on a denied or withdrawn claim. The food spoilage allowance, the data recovery
    credit and the haul-away on a replacement are paid outside the per-claim limit but inside the term coverage limit. A payout is made by the plan's default settlement method unless the customer asks for
    another the plan allows, and a payout to a repairer is made against the authorisation number issued for that claim.
