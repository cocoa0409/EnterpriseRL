      timing: pre_action
      correlation_keys:
      - - protection_plans.plan_id
      action_bindings:
        protection_plans.plan_id: plan_id
    state_contract:
      field: protection_plans.status
      allowed:
      - active
      - claim_hold
  - id: report_window_open
    applies_to:
    - protection_claim_file
    kind: time
    condition: A claim is opened only when the customer reports the incident within the plan's claim report window, counted from the day the failure or damage happened.
    evidence_fields:
    - protection_events.incident_date
    - protection_events.claim_reference
    - protection_plans.plan_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - protection_events.claim_reference
      action_bindings:
        protection_events.claim_reference: claim_reference
    temporal_basis:
