- id: protection_ext_claim_excess_settlement
  base_policy_refs: [protection_claim_settlement]
  overwrite: []
  trigger: on_request
  subject: [protection_deductible_payment]
  computes: settlement_amount
  target_tool: settle_claim_deductible_46d57fef
  params:
    share_due_now_low_pct: 60
    share_due_now_mid_pct: 80
    handling_po_usd: 18.0
    handling_standard_usd: 9.0
    deferred_late_usd: 24.0
    deferred_standard_usd: 12.0
    deferral_late_days: 40
    deferral_standard_days: 20
  rule: >
    Where a customer asks to settle the excess standing against a claim, what is taken now is the excess owed at the
    share the account must meet straight away, together with the handling charge on an invoiced settlement and less any
    part of it deferred because the excess was billed late.
    What the account settles on a claim excess is fixed only after that excess stands billed on the plan.
    The excess owed is the plan's deductible. The share the account must meet straight away is the whole of the excess
    owed. No handling charge is added to an invoiced settlement. No part of the excess is deferred. The delay in
    billing is counted from the day the loss was reported. What is taken now is the excess owed at the share the
    account must meet straight away, together with the handling charge and less the part deferred, taken to the cent
    and never below nothing.
    The excess owed is every excess standing unsettled on the plan, the excesses billed on it less the excess payments
    received against them, where the excesses billed come to more than what stands settled against them, no excess
    payment stands on the plan inside the last twelve months and the plan stands active; it is the excess most recently
    billed on the plan alone where the excesses billed come to more than what stands settled against them and an excess
    payment stands on the plan inside the last twelve months; and for every other plan the excess owed is the plan's
    deductible.
    The share the account must meet straight away is sixty percent where the store credit account runs on terms of
    thirty days or more and its balance stands below half its limit; it is eighty percent where that account runs on
    terms of thirty days or more and its balance stands at or above half its limit; and for every other profile the
    share is the whole of the excess owed.
    The handling charge on an invoiced settlement is eighteen dollars where a purchase order is required on the account
    and the excess owed is above the plan's own deductible figure; it is nine dollars where a purchase order is required
    on the account and the excess owed is no more than the plan's own deductible figure; and for every other profile no
    handling charge is added to an invoiced settlement.
    The delay in billing is counted to the day the excess stands billed on the plan. It is counted from the day the
    amount settled on the claim was paid out where a payout stands booked on the claim and the plan is one whose claims
    are worked ahead of the ordinary queue; it is counted from the day the claim was decided where a payout stands
    booked on the claim and the plan is not one whose claims are worked ahead of the ordinary queue; and for every
    other claim the delay in billing is counted from the day the loss was reported.
    The part of the excess deferred is twenty-four dollars where the delay in billing runs beyond forty days; it is
    twelve dollars where that delay runs beyond twenty days but no further than forty; and for every other claim no
    part of the excess is deferred.
  prerequisite:
  - problem: protection_ext_claim_excess_charge
    kind: value_input
    gate: owed_measure
    form: state
    policy_source: What the account settles on a claim excess is fixed only after that excess stands billed on the plan.
    condition: the plan's history carries an excess entry for the approved claim, so the excesses billed on the plan come to more than what stands settled against them
    resolved_by: bill_claim_deductible_d5a520f4
    effect: once the excess stands billed, the excess owed rises from the plan's own deductible figure to the amount standing unsettled on the plan, and the share taken now is measured on that
  cross_category:
  - category: credit
    as: branch
    reads: [status, current_balance, credit_limit, business_net_terms_days, purchase_order_required]
    note: the share the account must meet straight away and the handling charge on an invoiced settlement are decided from the terms the store credit account runs on, from its balance against its limit and from whether a purchase order is required on it.
  compute:
  - ded_billed: "SUM('protection_events','deductible_amount', event_type='protection_deductible_charge')"
  - ded_paid: "SUM('protection_events','deductible_amount', event_type='protection_deductible_payment')"
  - latest_excess: "LATEST('protection_events','deductible_amount', event_type='protection_deductible_charge')"
  - prior_excess_payments_12m: "COUNT('protection_events', within_months=12, event_type='protection_deductible_payment')"
  - owed_measure: "RND(ded_billed - ded_paid, 2) if (ded_billed > ded_paid and prior_excess_payments_12m <= 0 and F('status') == 'active') else (float(latest_excess or 0) if (ded_billed > ded_paid and prior_excess_payments_12m >= 1) else P('deductible_usd'))"
  - terms_days: "CPARAM('credit','business_net_terms_days', status='active')"
  - acct_balance: "CFIELD('credit','current_balance', status='active')"
  - acct_limit: "CFIELD('credit','credit_limit', status='active')"
  - share_due_now_pct: "K('share_due_now_low_pct') if ((terms_days or 0) >= 30 and float(acct_balance or 0) < float(acct_limit or 0) / 2) else (K('share_due_now_mid_pct') if ((terms_days or 0) >= 30 and float(acct_balance or 0) >= float(acct_limit or 0) / 2) else 100)"
  - po_required: "CPARAM('credit','purchase_order_required', status='active')"
  - handling_charge: "K('handling_po_usd') if (po_required == True and owed_measure > P('deductible_usd')) else (K('handling_standard_usd') if (po_required == True and owed_measure <= P('deductible_usd')) else 0.0)"
  - payout_date: "LATEST('protection_events','event_date', event_type='protection_claim_payout')"
  - decision_date: "LATEST('protection_events','event_date', event_type='protection_claim_decision')"
  - loss_report_date: "LATEST('protection_events','report_date', event_type='protection_claim_file')"
  - excess_billed_day: "LATEST('protection_events','event_date', event_type='protection_deductible_charge') or NOW"
  - billing_delay_days: "DAYS(payout_date, excess_billed_day) if (payout_date != None and P('priority_claim_handling') == True) else (DAYS(decision_date, excess_billed_day) if (payout_date != None and P('priority_claim_handling') != True) else DAYS(loss_report_date, excess_billed_day))"
  - deferred_amount: "K('deferred_late_usd') if (billing_delay_days > K('deferral_late_days')) else (K('deferred_standard_usd') if (billing_delay_days > K('deferral_standard_days') and billing_delay_days <= K('deferral_late_days')) else 0.0)"
  - result: "MX(0.0, RND(owed_measure * share_due_now_pct / 100 + handling_charge - deferred_amount, 2))"
  compute_basis:
    ded_billed: The excess owed is every excess standing unsettled on the plan, the excesses billed on it less the excess payments received against them, where the excesses billed come to more than what stands settled against them, no excess payment stands on the plan inside the last twelve months and the plan stands active; it is the excess most recently billed on the plan alone where the excesses billed come to more than what stands settled against them and an excess payment stands on the plan inside the last twelve months; and for every other plan the excess owed is the plan's deductible.
    ded_paid: The excess owed is every excess standing unsettled on the plan, the excesses billed on it less the excess payments received against them, where the excesses billed come to more than what stands settled against them, no excess payment stands on the plan inside the last twelve months and the plan stands active; it is the excess most recently billed on the plan alone where the excesses billed come to more than what stands settled against them and an excess payment stands on the plan inside the last twelve months; and for every other plan the excess owed is the plan's deductible.
    latest_excess: The excess owed is every excess standing unsettled on the plan, the excesses billed on it less the excess payments received against them, where the excesses billed come to more than what stands settled against them, no excess payment stands on the plan inside the last twelve months and the plan stands active; it is the excess most recently billed on the plan alone where the excesses billed come to more than what stands settled against them and an excess payment stands on the plan inside the last twelve months; and for every other plan the excess owed is the plan's deductible.
    owed_measure: The excess owed is every excess standing unsettled on the plan, the excesses billed on it less the excess payments received against them, where the excesses billed come to more than what stands settled against them, no excess payment stands on the plan inside the last twelve months and the plan stands active; it is the excess most recently billed on the plan alone where the excesses billed come to more than what stands settled against them and an excess payment stands on the plan inside the last twelve months; and for every other plan the excess owed is the plan's deductible.
    terms_days: The share the account must meet straight away is sixty percent where the store credit account runs on terms of thirty days or more and its balance stands below half its limit; it is eighty percent where that account runs on terms of thirty days or more and its balance stands at or above half its limit; and for every other profile the share is the whole of the excess owed.
    acct_balance: The share the account must meet straight away is sixty percent where the store credit account runs on terms of thirty days or more and its balance stands below half its limit; it is eighty percent where that account runs on terms of thirty days or more and its balance stands at or above half its limit; and for every other profile the share is the whole of the excess owed.
    acct_limit: The share the account must meet straight away is sixty percent where the store credit account runs on terms of thirty days or more and its balance stands below half its limit; it is eighty percent where that account runs on terms of thirty days or more and its balance stands at or above half its limit; and for every other profile the share is the whole of the excess owed.
    share_due_now_pct: The share the account must meet straight away is sixty percent where the store credit account runs on terms of thirty days or more and its balance stands below half its limit; it is eighty percent where that account runs on terms of thirty days or more and its balance stands at or above half its limit; and for every other profile the share is the whole of the excess owed.
    prior_excess_payments_12m: The excess owed is every excess standing unsettled on the plan, the excesses billed on it less the excess payments received against them, where the excesses billed come to more than what stands settled against them, no excess payment stands on the plan inside the last twelve months and the plan stands active; it is the excess most recently billed on the plan alone where the excesses billed come to more than what stands settled against them and an excess payment stands on the plan inside the last twelve months; and for every other plan the excess owed is the plan's deductible.
    po_required: The handling charge on an invoiced settlement is eighteen dollars where a purchase order is required on the account and the excess owed is above the plan's own deductible figure; it is nine dollars where a purchase order is required on the account and the excess owed is no more than the plan's own deductible figure; and for every other profile no handling charge is added to an invoiced settlement.
    handling_charge: The handling charge on an invoiced settlement is eighteen dollars where a purchase order is required on the account and the excess owed is above the plan's own deductible figure; it is nine dollars where a purchase order is required on the account and the excess owed is no more than the plan's own deductible figure; and for every other profile no handling charge is added to an invoiced settlement.
    excess_billed_day: The delay in billing is counted to the day the excess stands billed on the plan.
    payout_date: It is counted from the day the amount settled on the claim was paid out where a payout stands booked on the claim and the plan is one whose claims are worked ahead of the ordinary queue; it is counted from the day the claim was decided where a payout stands booked on the claim and the plan is not one whose claims are worked ahead of the ordinary queue; and for every other claim the delay in billing is counted from the day the loss was reported.
    decision_date: It is counted from the day the amount settled on the claim was paid out where a payout stands booked on the claim and the plan is one whose claims are worked ahead of the ordinary queue; it is counted from the day the claim was decided where a payout stands booked on the claim and the plan is not one whose claims are worked ahead of the ordinary queue; and for every other claim the delay in billing is counted from the day the loss was reported.
    loss_report_date: The delay in billing is counted from the day the loss was reported.
    billing_delay_days: It is counted from the day the amount settled on the claim was paid out where a payout stands booked on the claim and the plan is one whose claims are worked ahead of the ordinary queue; it is counted from the day the claim was decided where a payout stands booked on the claim and the plan is not one whose claims are worked ahead of the ordinary queue; and for every other claim the delay in billing is counted from the day the loss was reported.
    deferred_amount: The part of the excess deferred is twenty-four dollars where the delay in billing runs beyond forty days; it is twelve dollars where that delay runs beyond twenty days but no further than forty; and for every other claim no part of the excess is deferred.
    result: What is taken now is the excess owed at the share the account must meet straight away, together with the handling charge and less the part deferred, taken to the cent and never below nothing.
  factors:
  - id: excess_owed_measure
    effect: method
    decides: owed_measure
    bindings: [ded_billed, ded_paid, latest_excess, prior_excess_payments_12m, owed_measure]
    ladder:
    - when: the excesses billed on the plan come to more than what stands settled against them, no excess payment stands on the plan inside the last twelve months and the plan stands active
      method: the excess owed is every excess standing unsettled on the plan, the excesses billed less the excess payments received
    - when: the excesses billed come to more than what stands settled against them and an excess payment stands on the plan inside the last twelve months
      method: the excess owed is the excess most recently billed on the plan alone
    - when: otherwise
      method: the excess owed is the plan's deductible
    baseline:
      owed_measure: "P('deductible_usd')"
    evidence: [history]
    cross_difficulty: null
  - id: share_due_straight_away
    effect: parameter
    decides: share_due_now_pct
    bindings: [terms_days, acct_balance, acct_limit, share_due_now_pct]
    ladder:
    - when: the store credit account runs on terms of thirty days or more and its balance stands below half its limit
      value: sixty percent
    - when: that account runs on terms of thirty days or more and its balance stands at or above half its limit
      value: eighty percent
    - when: otherwise
      value: the whole of the excess owed
    baseline:
      share_due_now_pct: "100"
    evidence: [cross_category]
    cross_difficulty: credit
  - id: invoiced_settlement_handling
    effect: parameter
    decides: handling_charge
    bindings: [po_required, handling_charge]
    ladder:
    - when: a purchase order is required on the account and the excess owed is above the plan's own deductible figure
      value: eighteen dollars
    - when: a purchase order is required on the account and the excess owed is no more than the plan's own deductible figure
      value: nine dollars
    - when: otherwise
      value: no handling charge
    baseline:
      handling_charge: "0.0"
    evidence: [history, cross_category]
    cross_difficulty: credit
  - id: billing_delay_clock
    effect: method
    decides: billing_delay_days
    bindings: [payout_date, decision_date, excess_billed_day, billing_delay_days]
    ladder:
    - when: a payout stands booked on the claim and the plan is one whose claims are worked ahead of the ordinary queue
      method: the delay is counted from the day the amount settled on the claim was paid out
    - when: a payout stands booked on the claim and the plan is not one whose claims are worked ahead of the ordinary queue
      method: the delay is counted from the day the claim was decided
    - when: otherwise
      method: the delay is counted from the day the loss was reported
    baseline:
      billing_delay_days: "DAYS(loss_report_date, excess_billed_day)"
    evidence: [history, date]
    cross_difficulty: null
  - id: deferred_part_of_excess
    effect: parameter
    decides: deferred_amount
    bindings: [loss_report_date, deferred_amount]
    ladder:
    - when: the delay in billing runs beyond forty days
      value: twenty-four dollars
    - when: that delay runs beyond twenty days but no further than forty
      value: twelve dollars
    - when: otherwise
      value: no part of the excess is deferred
    baseline:
      deferred_amount: "0.0"
    evidence: [date]
    cross_difficulty: null
  baseline:
    rule: >-
      The excess owed is the plan's deductible. The share the account must meet straight away is the whole of the
      excess owed. No handling charge is added to an invoiced settlement. No part of the excess is deferred. The delay
      in billing is counted to the day the excess stands billed on the plan. The delay in billing is counted from the
      day the loss was reported. What is taken now is the excess owed at the share the
      account must meet straight away, together with the handling charge and less the part deferred, taken to the cent
      and never below nothing.
    params: [deductible_usd]
  inputs:
    history:
    - {table: protection_events, aggregate: sum, field: deductible_amount, within_months: null, filters: {event_type: protection_deductible_charge}}
    - {table: protection_events, aggregate: sum, field: deductible_amount, within_months: null, filters: {event_type: protection_deductible_payment}}
    - {table: protection_events, aggregate: count, field: claim_reference, within_months: 12, filters: {event_type: protection_deductible_payment}}
    - {table: protection_events, aggregate: latest, field: event_date, within_months: null, filters: {event_type: protection_claim_payout}}
    - {table: protection_events, aggregate: latest, field: report_date, within_months: null, filters: {event_type: protection_claim_file}}
