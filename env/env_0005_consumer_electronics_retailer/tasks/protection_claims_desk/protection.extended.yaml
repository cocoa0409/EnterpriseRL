extended_policies:
- id: protection_ext_premium_late_fee_scale
  base_policy_refs: [protection_premium_billing, protection_combo_membership_interaction, protection_premium_delinquency]
  overwrite:
  - base_policy: protection_premium_delinquency
    superseded_clause: The plan's late fee is billed once
    replaced_by: The fee billed is the fee for each unpaid period multiplied by the periods counted and by the rate at which it is billed, less anything written off, taken to the cent and never below nothing.
  - base_policy: protection_premium_delinquency
    superseded_clause: when grace runs out
    replaced_by: The fee is billed against the first day of the oldest premium period standing unpaid on the plan, whichever later periods the fee is worked out over.
  trigger: state_due
  subject: [protection_premium_charge]
  computes: late_fee_amount
  target_tool: bill_premium_late_fee_5ae6a6af
  params:
    fee_per_period_long_standing: 4.0
    fee_per_period_established: 8.0
    escalation_repeat_arrears_pct: 150
    escalation_long_arrears_pct: 125
    escalation_plain_pct: 100
    write_off_claim_open_low_cover: 6.5
    write_off_claim_open: 3.0
  rule: >
    A late fee falls due on a plan whose premium instalments have run past grace, and what is billed rests on how
    much premium stands unpaid, on how the customer has kept up with the plan and on the standing of the Circle
    membership the profile holds.
    The instalment arrears on the plan is the premium instalments billed on it less the premium payments received
    against it, taken to the cent and never below nothing. The unpaid periods are that arrears divided by the monthly
    premium of the plan, counted as whole periods. The fee for each unpaid period is the plan's late fee. Every
    unpaid period counts toward the fee. The fee is billed at the plain rate of one hundred percent, without
    escalation. Nothing is written off the fee. The fee billed is the fee for each unpaid period multiplied by the
    periods counted and by the rate at which it is billed, less anything written off, taken to the cent and never
    below nothing. The fee is billed against the first day of the oldest premium period standing unpaid on the plan,
    whichever later periods the fee is worked out over.
    The fee for each unpaid period is four dollars where the Circle membership on the profile stands on a tier whose
    protection plan discount is fifteen percent or more and that membership has stood active for at least three
    years; it is eight dollars where that discount is five percent or more but under fifteen percent and the
    membership has stood active for at least one year; and for every other profile it is the plan's late fee.
    The periods counted toward the fee are the unpaid periods whose grace has fully run, which is the unpaid periods
    less the most recent one and never fewer than one, where at least three premium payments stand on the plan in the
    last twelve months and the most recent period billed is still inside the plan's grace days; the oldest unpaid
    period alone is counted where the most recent period billed is still inside the plan's grace days and fewer than
    three premium payments stand on the plan in the last twelve months; and for every other plan every unpaid period
    counts toward the fee.
    The rate at which the fee is billed is one hundred and fifty percent where the arrears covers more than three
    periods and a fee already stands billed on the plan inside the last twelve months; it is one hundred and
    twenty-five percent where the arrears covers more than three periods and no fee stands billed on the plan inside
    the last twelve months; and for every other plan the fee is billed at the plain rate of one hundred percent,
    without escalation.
    The amount written off the fee is six dollars and fifty cents where a claim stands decided on the plan inside the
    last three months and the cover left on the plan is below half its term limit; it is three dollars where a claim
    stands decided on the plan inside the last three months and the cover left on the plan is at or above half its
    term limit; and for every other plan nothing is written off the fee.
    The cover left on the plan is the cover credited to it, together with any cover put back at an anniversary, less
    the payouts booked against it.
  prerequisite: []
  cross_category:
  - category: membership
    as: branch
    reads: [variant_name, status, activation_date]
    note: the fee for each unpaid period is decided from the plan discount the profile's Circle membership tier carries and from how long that membership has stood active.
  compute:
  - instalments_billed: "SUM('protection_events','premium_amount', event_type='protection_premium_charge', premium_kind='monthly_instalment')"
  - instalments_paid: "SUM('protection_events','premium_amount', event_type='protection_premium_payment')"
  - arrears_amount: "MX(0.0, RND(instalments_billed - instalments_paid, 2))"
  - unpaid_periods: "int(arrears_amount / P('monthly_premium_usd') + 0.0001)"
  - member_plan_discount: "CPARAM('membership','protection_plan_discount_pct', status='active')"
  - member_years: "int(DAYS(CFIELD('membership','activation_date', status='active'), NOW) / 365)"
  - fee_per_period: "K('fee_per_period_long_standing') if ((member_plan_discount or 0) >= 15 and member_years >= 3) else (K('fee_per_period_established') if ((member_plan_discount or 0) >= 5 and (member_plan_discount or 0) < 15 and member_years >= 1) else P('premium_late_fee_usd'))"
  - payments_12m: "COUNT('protection_events', within_months=12, event_type='protection_premium_payment')"
  - newest_period_start: "LATEST('protection_events','period_start', event_type='protection_premium_charge', premium_kind='monthly_instalment')"
  - days_since_newest_period: "DAYS(newest_period_start, NOW)"
  - chargeable_periods: "MX(1, unpaid_periods - 1) if (payments_12m >= 3 and days_since_newest_period < P('premium_grace_days')) else (1 if (days_since_newest_period < P('premium_grace_days') and payments_12m < 3) else unpaid_periods)"
  - prior_fees_12m: "SUM('protection_events','premium_amount', within_months=12, event_type='protection_premium_charge', premium_kind='late_fee')"
  - escalation_pct: "K('escalation_repeat_arrears_pct') if (unpaid_periods > 3 and prior_fees_12m > 0) else (K('escalation_long_arrears_pct') if (unpaid_periods > 3 and prior_fees_12m <= 0) else K('escalation_plain_pct'))"
  - decisions_3m: "COUNT('protection_events', within_months=3, event_type='protection_claim_decision')"
  - cover_left: "RND(SUM('protection_events','coverage_amount', event_type='protection_coverage_grant') + SUM('protection_events','coverage_amount', event_type='protection_coverage_reinstate') - SUM('protection_events','payout_amount', event_type='protection_claim_payout'), 2)"
  - write_off: "K('write_off_claim_open_low_cover') if (decisions_3m >= 1 and cover_left < P('coverage_limit_usd') / 2) else (K('write_off_claim_open') if (decisions_3m >= 1 and cover_left >= P('coverage_limit_usd') / 2) else 0.0)"
  - result: "MX(0.0, RND(fee_per_period * chargeable_periods * escalation_pct / 100 - write_off, 2))"
  compute_basis:
    instalments_billed: The instalment arrears on the plan is the premium instalments billed on it less the premium payments received against it, taken to the cent and never below nothing.
    instalments_paid: The instalment arrears on the plan is the premium instalments billed on it less the premium payments received against it, taken to the cent and never below nothing.
    arrears_amount: The instalment arrears on the plan is the premium instalments billed on it less the premium payments received against it, taken to the cent and never below nothing.
    unpaid_periods: The unpaid periods are that arrears divided by the monthly premium of the plan, counted as whole periods.
    member_plan_discount: The fee for each unpaid period is four dollars where the Circle membership on the profile stands on a tier whose protection plan discount is fifteen percent or more and that membership has stood active for at least three years; it is eight dollars where that discount is five percent or more but under fifteen percent and the membership has stood active for at least one year; and for every other profile it is the plan's late fee.
    member_years: The fee for each unpaid period is four dollars where the Circle membership on the profile stands on a tier whose protection plan discount is fifteen percent or more and that membership has stood active for at least three years; it is eight dollars where that discount is five percent or more but under fifteen percent and the membership has stood active for at least one year; and for every other profile it is the plan's late fee.
    fee_per_period: The fee for each unpaid period is four dollars where the Circle membership on the profile stands on a tier whose protection plan discount is fifteen percent or more and that membership has stood active for at least three years; it is eight dollars where that discount is five percent or more but under fifteen percent and the membership has stood active for at least one year; and for every other profile it is the plan's late fee.
    payments_12m: The periods counted toward the fee are the unpaid periods whose grace has fully run, which is the unpaid periods less the most recent one and never fewer than one, where at least three premium payments stand on the plan in the last twelve months and the most recent period billed is still inside the plan's grace days; the oldest unpaid period alone is counted where the most recent period billed is still inside the plan's grace days and fewer than three premium payments stand on the plan in the last twelve months; and for every other plan every unpaid period counts toward the fee.
    newest_period_start: The periods counted toward the fee are the unpaid periods whose grace has fully run, which is the unpaid periods less the most recent one and never fewer than one, where at least three premium payments stand on the plan in the last twelve months and the most recent period billed is still inside the plan's grace days; the oldest unpaid period alone is counted where the most recent period billed is still inside the plan's grace days and fewer than three premium payments stand on the plan in the last twelve months; and for every other plan every unpaid period counts toward the fee.
    days_since_newest_period: The periods counted toward the fee are the unpaid periods whose grace has fully run, which is the unpaid periods less the most recent one and never fewer than one, where at least three premium payments stand on the plan in the last twelve months and the most recent period billed is still inside the plan's grace days; the oldest unpaid period alone is counted where the most recent period billed is still inside the plan's grace days and fewer than three premium payments stand on the plan in the last twelve months; and for every other plan every unpaid period counts toward the fee.
    chargeable_periods: The periods counted toward the fee are the unpaid periods whose grace has fully run, which is the unpaid periods less the most recent one and never fewer than one, where at least three premium payments stand on the plan in the last twelve months and the most recent period billed is still inside the plan's grace days; the oldest unpaid period alone is counted where the most recent period billed is still inside the plan's grace days and fewer than three premium payments stand on the plan in the last twelve months; and for every other plan every unpaid period counts toward the fee.
    prior_fees_12m: The rate at which the fee is billed is one hundred and fifty percent where the arrears covers more than three periods and a fee already stands billed on the plan inside the last twelve months; it is one hundred and twenty-five percent where the arrears covers more than three periods and no fee stands billed on the plan inside the last twelve months; and for every other plan the fee is billed at the plain rate of one hundred percent, without escalation.
    escalation_pct: The rate at which the fee is billed is one hundred and fifty percent where the arrears covers more than three periods and a fee already stands billed on the plan inside the last twelve months; it is one hundred and twenty-five percent where the arrears covers more than three periods and no fee stands billed on the plan inside the last twelve months; and for every other plan the fee is billed at the plain rate of one hundred percent, without escalation.
    decisions_3m: The amount written off the fee is six dollars and fifty cents where a claim stands decided on the plan inside the last three months and the cover left on the plan is below half its term limit; it is three dollars where a claim stands decided on the plan inside the last three months and the cover left on the plan is at or above half its term limit; and for every other plan nothing is written off the fee.
    cover_left: The cover left on the plan is the cover credited to it, together with any cover put back at an anniversary, less the payouts booked against it.
    write_off: The amount written off the fee is six dollars and fifty cents where a claim stands decided on the plan inside the last three months and the cover left on the plan is below half its term limit; it is three dollars where a claim stands decided on the plan inside the last three months and the cover left on the plan is at or above half its term limit; and for every other plan nothing is written off the fee.
    result: The fee billed is the fee for each unpaid period multiplied by the periods counted and by the rate at which it is billed, less anything written off, taken to the cent and never below nothing.
  factors:
  - id: fee_per_unpaid_period
    effect: parameter
    decides: fee_per_period
    bindings: [member_plan_discount, member_years, fee_per_period]
    ladder:
    - when: the Circle membership on the profile stands on a tier whose protection plan discount is fifteen percent or more and that membership has stood active for at least three years
      value: four dollars
    - when: that discount is five percent or more but under fifteen percent and the membership has stood active for at least one year
      value: eight dollars
    - when: otherwise
      value: the plan's late fee
    baseline:
      fee_per_period: "P('premium_late_fee_usd')"
    evidence: [cross_category, date]
    cross_difficulty: membership
  - id: periods_counted_toward_fee
    effect: method
    decides: chargeable_periods
    bindings: [payments_12m, newest_period_start, days_since_newest_period, chargeable_periods]
    ladder:
    - when: at least three premium payments stand on the plan in the last twelve months and the most recent period billed is still inside the plan's grace days
      method: the unpaid periods whose grace has fully run are counted, which is the unpaid periods less the most recent one and never fewer than one
    - when: the most recent period billed is still inside the plan's grace days and fewer than three premium payments stand on the plan in the last twelve months
      method: the oldest unpaid period alone is counted
    - when: otherwise
      method: every unpaid period counts toward the fee
    baseline:
