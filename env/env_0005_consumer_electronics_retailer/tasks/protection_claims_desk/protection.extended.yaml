    ledger_arrears: The arrears standing on the plan is rebuilt from the premium entries booked on the plan, as the premium instalments billed less the premium payments received, where the premium entries booked on the plan add up to more than the outstanding premium recorded on it and the plan stands active; it is the periods whose grace has fully run, priced at the plan's monthly premium, where the plan stands active and those entries add up to no more than the outstanding premium recorded on it; and for every other plan it is the outstanding premium recorded on it.
    newest_period_start: The periods whose grace has fully run are the unpaid periods less the most recent period billed where that period is still inside the plan's grace days, and never fewer than none.
    days_since_newest_period: The periods whose grace has fully run are the unpaid periods less the most recent period billed where that period is still inside the plan's grace days, and never fewer than none.
    periods_past_grace: The periods whose grace has fully run are the unpaid periods less the most recent period billed where that period is still inside the plan's grace days, and never fewer than none.
