  baseline:
    rule: >-
      The instalment arrears on the plan is the premium instalments billed on it less the premium payments received
      against it, taken to the cent and never below nothing. The unpaid periods are that arrears divided by the
      monthly premium of the plan, counted as whole periods. The fee for each unpaid period is the plan's late fee.
      Every unpaid period counts toward the fee. The fee is billed at the plain rate of one hundred percent, without
      escalation. Nothing is written off the fee. The fee billed is the fee for each unpaid period multiplied by the
      periods counted and by the rate at which it is billed, less anything written off, taken to the cent and never
      below nothing.
    params: [premium_late_fee_usd, monthly_premium_usd, escalation_plain_pct]
