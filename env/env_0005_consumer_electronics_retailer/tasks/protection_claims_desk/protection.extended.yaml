  baseline:
    rule: >-
      The base excess is the plan's deductible. The claims that load the excess are counted over the whole term of the
      plan. No loading for the claims already filed is added. No reduction for a prompt report is allowed. No allowance
      for a managed care agreement is allowed. The adjustment for the age of the covered item is forty dollars added.
      The excess billed on an approved claim is the base excess together with the loading for the claims already
      filed, less the reduction for a prompt report and the allowance a managed care agreement carries, and adjusted
      for the age of the covered item, billed once for that claim and never below nothing. No excess is billed on a
      claim the plan settles by repair where the plan waives its excess on a repair, and the excess billed on such a
