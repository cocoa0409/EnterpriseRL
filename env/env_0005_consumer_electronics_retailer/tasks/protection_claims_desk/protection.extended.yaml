    - when: the item has run less than two thirds of that term
      value: ninety-five percent of the labour booked
    - when: otherwise
      value: ninety percent of the labour booked
    baseline:
      labour_share_pct: "K('labour_share_aged_pct')"
    evidence: [date, tier_param]
    cross_difficulty: null
