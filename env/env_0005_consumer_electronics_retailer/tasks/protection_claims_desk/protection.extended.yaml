- id: protection_excl_duplicate_coverage
  subject:
  - protection_plan_purchase
  - protection_claim_payout
  rule: A ShieldCare plan and a manufacturer's warranty are never both settled for the same repair, and a plan does not pay while the manufacturer's warranty on that item is still running unless the peril
    is one the manufacturer excludes. Where the item also carries cover from a card issuer or a household insurer, the retailer settles only the part of the loss those have not met, and the customer is
    asked what has already been paid rather than being paid twice. A plan is never sold alongside another retailer plan on the same serial, and where one is found on file the later sale is void and its
    premium returned. The food spoilage allowance is not paid where a household insurer has already met the same spoiled food. Nothing in this rule reduces a payout below what the plan's own limits would
    give when no other cover exists.
