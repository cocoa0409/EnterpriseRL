  - id: no_overlapping_warranty_settlement
    applies_to:
    - protection_claim_payout
    kind: caller_fact
    condition: A ShieldCare plan and a manufacturer's warranty are never both settled for the same repair, and a plan does not pay while the manufacturer's warranty on that item is still running unless
      the peril is one the manufacturer excludes.
