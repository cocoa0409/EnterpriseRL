- id: protection_ext_claim_excess_charge
  base_policy_refs: [protection_claim_settlement]
  overwrite:
  - base_policy: protection_claim_settlement
    superseded_clause: The plan's deductible is billed once per approved claim
    replaced_by: The excess billed on an approved claim is the base excess together with the loading for the claims already filed, less the reduction for a prompt report and the allowance a managed care agreement carries, and adjusted for the age of the covered item, billed once for that claim and never below nothing.
  trigger: state_due
  subject: [protection_deductible_charge]
  computes: deductible_amount
  target_tool: bill_claim_deductible_d5a520f4
  params:
    excess_theft_high_multiple: 2
    excess_theft_multiple: 1.5
    settled_multiple_of_excess: 10
    frequency_loading_heavy_usd: 75.0
    frequency_loading_standard_usd: 35.0
    prompt_report_full_usd: 50.0
    prompt_report_part_usd: 22.5
    care_allowance_full_usd: 60.0
    care_allowance_part_usd: 30.0
    care_visits_threshold: 12
    loading_window_year_months: 12
    age_adjustment_new_usd: -25.0
    age_adjustment_mid_usd: 0.0
    age_adjustment_aged_usd: 40.0
  rule: >
    The excess a customer owes on an approved claim is priced from the peril reported and what the claim was settled
    at, and is then adjusted for how often the plan has been claimed on, how promptly the loss was reported, what
    managed care the profile holds and how old the covered item was when the loss happened.
    The base excess is the plan's deductible. The claims that load the excess are counted over the whole term of the
    plan. No loading for the claims already filed is added. No reduction for a prompt report is allowed. No allowance
    for a managed care agreement is allowed. The adjustment for the age of the covered item is forty dollars added. The
    excess billed on an approved claim is the base excess together with the loading for the claims already filed, less
    the reduction for a prompt report and the allowance a managed care agreement carries, and adjusted for the age of
    the covered item, billed once for that claim and never below nothing. No excess is billed on a claim the plan
    settles by repair where the plan waives its excess on a repair, and the excess billed on such a claim is nothing.
    The base excess is the plan's deductible taken twice where the peril reported is theft and the amount settled on
    the claim is above ten times that deductible; it is the plan's deductible and a half where the peril reported is
    theft and the amount settled is no more than ten times that deductible; and for every other claim the base excess
    is the plan's deductible.
    The claims that load the excess are counted from the month the cover was most recently put back at an anniversary
    where the plan is one that puts its cover back at each anniversary and such an entry stands on it; they are counted
    over the last twelve months where the plan puts its cover back at each anniversary and no such entry stands on it;
    and for every other plan the claims that load the excess are counted over the whole term of the plan.
    The loading for the claims already filed is seventy-five dollars where three or more claims stand filed on the plan
    over the window counted and the plan is one that puts its cover back at each anniversary; it is thirty-five dollars
    where two claims stand filed over that window; and for every other plan no loading for the claims already filed is
    added.
    The reduction for a prompt report is fifty dollars where the loss was reported inside three days of it happening;
    it is twenty-two dollars and fifty cents where the loss was reported more than three days but no more than seven
    days after it happened; and for every other claim no reduction for a prompt report is allowed.
    The care agreement read is the one standing scheduled on the profile, and the included visits it carries are the
    visits its own term allows rather than the visits left on it. The allowance for a managed care agreement is sixty
    dollars where the profile holds a care agreement whose included visits run to twelve or more in its term and a visit
    stands drawn on it inside the last twelve months; it is thirty dollars where the profile holds a care agreement
    whose included visits run to twelve or more in its term and no visit stands drawn on it inside that time; and for
    every other profile, including one holding a care agreement whose term carries fewer than twelve included visits, no
    allowance for a managed care agreement is allowed.
    The adjustment for the age of the covered item is twenty-five dollars taken off where the item was under a year old
    when the loss happened; it is nothing where the item was at least a year but under two years old when the loss
    happened; and for every other item the adjustment for the age of the covered item is forty dollars added.
  prerequisite: []
  cross_category:
  - category: service
    as: branch
    reads: [variant_name, status, included_visits_per_term, service_events.event_type]
    note: the allowance for a managed care agreement is decided from the included visits the profile's care agreement carries in its term and from whether a visit stands drawn on it.
  compute:
  - peril: "LATEST('protection_events','claim_type', event_type='protection_claim_file')"
  - claim_settled: "LATEST('protection_events','payout_amount', event_type='protection_claim_payout')"
  - base_excess: "RND(P('deductible_usd') * K('excess_theft_high_multiple'), 2) if (peril == 'theft' and float(claim_settled or 0) > P('deductible_usd') * K('settled_multiple_of_excess')) else (RND(P('deductible_usd') * K('excess_theft_multiple'), 2) if (peril == 'theft' and float(claim_settled or 0) <= P('deductible_usd') * K('settled_multiple_of_excess')) else P('deductible_usd'))"
  - latest_reinstatement: "LATEST('protection_events','event_date', event_type='protection_coverage_reinstate')"
  - loading_window_months: "(MONTHS(latest_reinstatement, NOW) + 1) if (P('annual_coverage_reinstatement') == True and latest_reinstatement != None) else (K('loading_window_year_months') if (P('annual_coverage_reinstatement') == True and latest_reinstatement == None) else int(P('plan_term_months')))"
  - claims_in_window: "COUNT('protection_events', within_months=loading_window_months, event_type='protection_claim_file')"
  - frequency_loading: "K('frequency_loading_heavy_usd') if (claims_in_window >= 3 and P('annual_coverage_reinstatement') == True) else (K('frequency_loading_standard_usd') if (claims_in_window >= 2 and claims_in_window < 3) else 0.0)"
  - incident_date: "LATEST('protection_events','incident_date', event_type='protection_claim_file')"
  - report_date: "LATEST('protection_events','report_date', event_type='protection_claim_file')"
  - days_to_report: "DAYS(incident_date, report_date)"
  - prompt_report_reduction: "K('prompt_report_full_usd') if (days_to_report <= 3) else (K('prompt_report_part_usd') if (days_to_report > 3 and days_to_report <= 7) else 0.0)"
  - care_visits: "CPARAM('service','included_visits_per_term', status='scheduled')"
  - care_agreement_job: "CFIELD('service','service_agreement_id', status='scheduled')"
  - care_visits_drawn: "XCOUNT('service','service_events', within_months=12, event_type='service_visit_consume', service_agreement_id=care_agreement_job)"
  - care_allowance: "K('care_allowance_full_usd') if ((care_visits or 0) >= K('care_visits_threshold') and care_visits_drawn >= 1) else (K('care_allowance_part_usd') if ((care_visits or 0) >= K('care_visits_threshold') and care_visits_drawn <= 0) else 0.0)"
  - item_age_at_loss: "MONTHS(F('covered_item_purchase_date'), incident_date)"
  - age_adjustment: "K('age_adjustment_new_usd') if (item_age_at_loss < 12) else (K('age_adjustment_mid_usd') if (item_age_at_loss >= 12 and item_age_at_loss < 24) else K('age_adjustment_aged_usd'))"
  - claim_settlement_basis: "LATEST('protection_events','settlement_basis', event_type='protection_claim_decision')"
  - excess_waived: "1 if (claim_settlement_basis == 'repair' and P('deductible_waiver_on_repair') == True) else 0"
  - result: "MX(0.0, RND((base_excess + frequency_loading - prompt_report_reduction - care_allowance + age_adjustment) * (1 - excess_waived), 2))"
  compute_basis:
    peril: The base excess is the plan's deductible taken twice where the peril reported is theft and the amount settled on the claim is above ten times that deductible; it is the plan's deductible and a half where the peril reported is theft and the amount settled is no more than ten times that deductible; and for every other claim the base excess is the plan's deductible.
    claim_settled: The base excess is the plan's deductible taken twice where the peril reported is theft and the amount settled on the claim is above ten times that deductible; it is the plan's deductible and a half where the peril reported is theft and the amount settled is no more than ten times that deductible; and for every other claim the base excess is the plan's deductible.
    base_excess: The base excess is the plan's deductible taken twice where the peril reported is theft and the amount settled on the claim is above ten times that deductible; it is the plan's deductible and a half where the peril reported is theft and the amount settled is no more than ten times that deductible; and for every other claim the base excess is the plan's deductible.
    latest_reinstatement: The claims that load the excess are counted from the month the cover was most recently put back at an anniversary where the plan is one that puts its cover back at each anniversary and such an entry stands on it; they are counted over the last twelve months where the plan puts its cover back at each anniversary and no such entry stands on it; and for every other plan the claims that load the excess are counted over the whole term of the plan.
    loading_window_months: The claims that load the excess are counted from the month the cover was most recently put back at an anniversary where the plan is one that puts its cover back at each anniversary and such an entry stands on it; they are counted over the last twelve months where the plan puts its cover back at each anniversary and no such entry stands on it; and for every other plan the claims that load the excess are counted over the whole term of the plan.
    claims_in_window: The loading for the claims already filed is seventy-five dollars where three or more claims stand filed on the plan over the window counted and the plan is one that puts its cover back at each anniversary; it is thirty-five dollars where two claims stand filed over that window; and for every other plan no loading for the claims already filed is added.
    frequency_loading: The loading for the claims already filed is seventy-five dollars where three or more claims stand filed on the plan over the window counted and the plan is one that puts its cover back at each anniversary; it is thirty-five dollars where two claims stand filed over that window; and for every other plan no loading for the claims already filed is added.
    incident_date: The reduction for a prompt report is fifty dollars where the loss was reported inside three days of it happening; it is twenty-two dollars and fifty cents where the loss was reported more than three days but no more than seven days after it happened; and for every other claim no reduction for a prompt report is allowed.
    report_date: The reduction for a prompt report is fifty dollars where the loss was reported inside three days of it happening; it is twenty-two dollars and fifty cents where the loss was reported more than three days but no more than seven days after it happened; and for every other claim no reduction for a prompt report is allowed.
    days_to_report: The reduction for a prompt report is fifty dollars where the loss was reported inside three days of it happening; it is twenty-two dollars and fifty cents where the loss was reported more than three days but no more than seven days after it happened; and for every other claim no reduction for a prompt report is allowed.
    prompt_report_reduction: The reduction for a prompt report is fifty dollars where the loss was reported inside three days of it happening; it is twenty-two dollars and fifty cents where the loss was reported more than three days but no more than seven days after it happened; and for every other claim no reduction for a prompt report is allowed.
    care_visits: The care agreement read is the one standing scheduled on the profile, and the included visits it carries are the visits its own term allows rather than the visits left on it. The allowance for a managed care agreement is sixty dollars where the profile holds a care agreement whose included visits run to twelve or more in its term and a visit stands drawn on it inside the last twelve months; it is thirty dollars where the profile holds a care agreement whose included visits run to twelve or more in its term and no visit stands drawn on it inside that time; and for every other profile, including one holding a care agreement whose term carries fewer than twelve included visits, no allowance for a managed care agreement is allowed.
    care_agreement_job: The care agreement read is the one standing scheduled on the profile, and the included visits it carries are the visits its own term allows rather than the visits left on it.
    care_visits_drawn: The allowance for a managed care agreement is sixty dollars where the profile holds a care agreement whose included visits run to twelve or more in its term and a visit stands drawn on it inside the last twelve months; it is thirty dollars where the profile holds a care agreement whose included visits run to twelve or more in its term and no visit stands drawn on it inside that time; and for every other profile, including one holding a care agreement whose term carries fewer than twelve included visits, no allowance for a managed care agreement is allowed.
    care_allowance: The allowance for a managed care agreement is sixty dollars where the profile holds a care agreement whose included visits run to twelve or more in its term and a visit stands drawn on it inside the last twelve months; it is thirty dollars where the profile holds a care agreement whose included visits run to twelve or more in its term and no visit stands drawn on it inside that time; and for every other profile, including one holding a care agreement whose term carries fewer than twelve included visits, no allowance for a managed care agreement is allowed.
    item_age_at_loss: The adjustment for the age of the covered item is twenty-five dollars taken off where the item was under a year old when the loss happened; it is nothing where the item was at least a year but under two years old when the loss happened; and for every other item the adjustment for the age of the covered item is forty dollars added.
    age_adjustment: The adjustment for the age of the covered item is twenty-five dollars taken off where the item was under a year old when the loss happened; it is nothing where the item was at least a year but under two years old when the loss happened; and for every other item the adjustment for the age of the covered item is forty dollars added.
    claim_settlement_basis: No excess is billed on a claim the plan settles by repair where the plan waives its excess on a repair, and the excess billed on such a claim is nothing.
    excess_waived: No excess is billed on a claim the plan settles by repair where the plan waives its excess on a repair, and the excess billed on such a claim is nothing.
    result: The excess billed on an approved claim is the base excess together with the loading for the claims already filed, less the reduction for a prompt report and the allowance a managed care agreement carries, and adjusted for the age of the covered item, billed once for that claim and never below nothing.
  factors:
  - id: base_excess_basis
    effect: method
    decides: base_excess
    bindings: [peril, claim_settled, base_excess]
    ladder:
    - when: the peril reported is theft and the amount settled on the claim is above ten times the plan's deductible
      method: the base excess is the plan's deductible taken twice
    - when: the peril reported is theft and the amount settled is no more than ten times that deductible
      method: the base excess is the plan's deductible and a half
    - when: otherwise
      method: the base excess is the plan's deductible
    baseline:
