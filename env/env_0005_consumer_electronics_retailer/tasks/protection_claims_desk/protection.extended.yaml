- id: protection_ext_fleet_invoice_settlement
  base_policy_refs: [protection_premium_billing]
  overwrite: []
  trigger: on_request
  subject: [protection_premium_payment]
  computes: settlement_amount
  target_tool: settle_fleet_invoice_2818623b
  params:
    prompt_discount_full_pct: 2
    prompt_discount_standard_pct: 1
    prompt_payment_window_days: 30
    advance_periods_po_terms: 2
    advance_periods_standard: 1
    cover_months_threshold: 12
    admin_charge_priority_usd: 15.0
    admin_charge_standard_usd: 7.5
  rule: >
    Where a customer asks to settle the premium invoice standing on a plan held on instalments and invoiced to a store
    credit account the profile settles on terms, what they settle covers the premium entries the invoice carries and
    the periods billed in advance with it, less the discount the account's payment record earns and together with the
    charge for raising the invoice.
    The amount the account settles is fixed only after every premium period the plan has reached stands billed on it.
    The premium on the plan is taken only once a payment against the claim excess stands received on the plan for
    every claim the plan has settled by replacement.
    The premium entries the invoice carries come to the plan's monthly premium. No period is billed in advance with the
    invoice. A period billed in advance is priced at the plan's monthly premium. No discount for the account's payment
    record is allowed. No charge for raising the invoice is added. The amount settled is the premium entries the invoice
    carries together with the periods billed in advance at the price they carry, that total reduced once by the discount
    for the account's payment record, and the charge for raising the invoice then added, taken to the cent and never
    below nothing. The discount acts once on the total of the entries and the periods billed in advance, and the charge
    for raising the invoice is added after it rather than discounted with it.
    The premium entries the invoice carries are every premium entry standing unsettled on the plan, the premium billed
    on it less the premium received against it, where the premium billed comes to more than the premium received and a
    statement has closed on the customer's store credit account inside the last three months; they are the instalment
    most recently billed on the plan alone where the premium billed comes to more than the premium received and no
    statement has closed on that account inside the last three months; and for every other plan the premium entries the
    invoice carries come to the plan's monthly premium.
    The periods billed in advance with the invoice are two where a purchase order is required on the account and the
    plan has more than twelve months of cover left to run; it is one where no purchase order is required on the account
    and the plan has more than twelve months of cover left to run; and for every other plan no period is billed in
    advance with the invoice.
    A period billed in advance is priced at the instalment most recently billed on the plan where that instalment
    differs from the plan's monthly premium and a statement has closed on the store credit account inside the last
    three months; it is priced at the average of the instalments billed on the plan inside the last three months where
    that instalment differs from the plan's monthly premium and no statement has closed on that account inside the last
    three months; and for every other plan a period billed in advance is priced at the plan's monthly premium.
    The discount for the account's payment record is two percent where the store credit account runs on terms of thirty
    days or more and a payment was received on it inside the last thirty days; it is one percent where that account runs
    on terms of thirty days or more and no payment was received on it inside the last thirty days; and for every other
    profile no discount for the account's payment record is allowed.
    The charge for raising the invoice is fifteen dollars where no automatic payment instruction stands on the store
    credit account and the plan is one whose claims are worked ahead of the ordinary queue; it is seven dollars and
    fifty cents where no automatic payment instruction stands on that account and the plan is not one whose claims are
    worked ahead of the ordinary queue; and for every other profile no charge for raising the invoice is added.
  prerequisite:
  - problem: protection_ext_fleet_instalment_billing
    kind: value_input
    gate: invoice_items
    form: state
    policy_source: The amount the account settles is fixed only after every premium period the plan has reached stands billed on it.
    condition: the plan's premium history carries an instalment entry for every period the plan has reached, so the premium billed comes to more than the premium received
    resolved_by: bill_premium_instalment_3dd4c03b
    effect: once the period now running stands billed, the premium billed exceeds the premium received and the premium entries the invoice carries become the amount standing unsettled rather than the plan's monthly premium
  - problem: protection_ext_claim_excess_settlement
    kind: state_gate
    gate: protection_events.deductible_amount
    form: state
    policy_source: The premium on the plan is taken only once a payment against the claim excess stands received on the plan for every claim the plan has settled by replacement.
    condition: for every claim the plan has settled by replacement, the plan's history carries an excess payment entry against that claim, and the outstanding excess figure on the plan stands reduced by it
    resolved_by: settle_claim_deductible_46d57fef
    effect: once a payment against the claim excess stands received for the claim the plan settled by replacement, the outstanding excess on the plan falls by it and the premium invoice may be taken
  cross_category:
  - category: credit
    as: branch
    reads: [status, credit_limit, last_payment_date, autopay_flag, business_net_terms_days, purchase_order_required, credit_events.event_type]
    note: the entries the invoice carries, the price of a period billed in advance, the periods billed in advance and the discount for the payment record all turn on the store credit account, its terms, its last payment and the statements that have closed on it.
  compute:
  - prem_billed: "SUM('protection_events','premium_amount', event_type='protection_premium_charge')"
  - prem_paid: "SUM('protection_events','premium_amount', event_type='protection_premium_payment')"
  - statements_3m: "XCOUNT('credit','credit_events', within_months=3, event_type='credit_statement_close')"
  - invoice_items: "RND(prem_billed - prem_paid, 2) if (prem_billed > prem_paid and statements_3m >= 1) else (float(LATEST('protection_events','premium_amount', event_type='protection_premium_charge', premium_kind='monthly_instalment') or 0) if (prem_billed > prem_paid and statements_3m <= 0) else P('monthly_premium_usd'))"
  - terms_days: "CPARAM('credit','business_net_terms_days', status='active')"
  - last_payment_days: "DAYS(CFIELD('credit','last_payment_date', status='active'), NOW)"
  - prompt_discount_pct: "K('prompt_discount_full_pct') if ((terms_days or 0) >= 30 and last_payment_days <= K('prompt_payment_window_days')) else (K('prompt_discount_standard_pct') if ((terms_days or 0) >= 30 and last_payment_days > K('prompt_payment_window_days')) else 0)"
  - po_required: "CPARAM('credit','purchase_order_required', status='active')"
  - months_of_cover_left: "MONTHS(NOW, F('coverage_end_date'))"
  - advance_periods: "K('advance_periods_po_terms') if (po_required == True and months_of_cover_left > K('cover_months_threshold')) else (K('advance_periods_standard') if (po_required != True and months_of_cover_left > K('cover_months_threshold')) else 0)"
  - latest_instalment: "LATEST('protection_events','premium_amount', event_type='protection_premium_charge', premium_kind='monthly_instalment')"
  - instalments_3m_total: "SUM('protection_events','premium_amount', within_months=3, event_type='protection_premium_charge', premium_kind='monthly_instalment')"
  - instalments_3m_count: "COUNT('protection_events', within_months=3, event_type='protection_premium_charge', premium_kind='monthly_instalment')"
  - advance_price: "float(latest_instalment or 0) if (float(latest_instalment or 0) != P('monthly_premium_usd') and statements_3m >= 1) else (RND(instalments_3m_total / MX(1, instalments_3m_count), 2) if (float(latest_instalment or 0) != P('monthly_premium_usd') and statements_3m <= 0) else P('monthly_premium_usd'))"
  - autopay_on: "CFIELD('credit','autopay_flag', status='active')"
  - admin_charge: "K('admin_charge_priority_usd') if (autopay_on != True and P('priority_claim_handling') == True) else (K('admin_charge_standard_usd') if (autopay_on != True and P('priority_claim_handling') != True) else 0.0)"
  - invoice_base: "RND(invoice_items + advance_periods * advance_price, 2)"
  - result: "MX(0.0, RND(invoice_base * (100 - prompt_discount_pct) / 100 + admin_charge, 2))"
