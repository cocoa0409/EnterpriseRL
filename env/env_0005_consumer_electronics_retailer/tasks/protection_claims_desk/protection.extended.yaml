- id: protection_claim_intake
  subject:
  - protection_claim_file
  rule: A claim is opened only while the plan stands active or in claim_hold. A claim is opened only when the customer reports the incident within the plan's claim report window, counted from the day the
    failure or damage happened. The claim report window is counted in calendar days from the incident day, which counts as day zero, and a window whose last day falls on a day the stores are shut is not
    extended. A claim whose incident day falls before the coverage start day, in the waiting period, or after the coverage end day is taken but decided as outside the term rather than refused at the door.
    One incident carries one claim reference, and a second claim is not opened on a reference that already has a decision recorded against it. The customer's own statement of the incident is taken as the
    report, and the signed statement of loss and the documents the plan requires are collected before the claim is adjudicated rather than before it is opened. Once the claims already paid in the term reach
    the plan's claim count limit, a further claim is taken and decided as not covered, and membership standing never adds to that count. A claim opened while the plan sits in claim_hold is queued behind
    the claim under review and worked only after that review closes.
  eligibility:
  - id: plan_in_force_for_claim
    applies_to:
    - protection_claim_file
    kind: state
    condition: A claim is opened only while the plan stands active or in claim_hold.
    evidence_fields:
