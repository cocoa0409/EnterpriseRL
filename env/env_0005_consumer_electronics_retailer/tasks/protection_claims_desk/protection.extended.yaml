  factors:
  - id: arrears_measurement_basis
    effect: method
    decides: arrears_measure
    bindings: [recorded_arrears, charges_all, arrears_measure]
    ladder:
    - when: the premium entries booked on the plan add up to more than the outstanding premium recorded on it and the plan stands active
      method: the arrears is rebuilt from the premium entries booked on the plan, as the premium instalments billed less the premium payments received
    - when: the plan stands active and those entries add up to no more than the outstanding premium recorded on it
      method: the arrears is the periods whose grace has fully run, priced at the plan's monthly premium
    - when: otherwise
      method: the arrears is the outstanding premium recorded on the plan
    baseline:
      arrears_measure: "recorded_arrears"
    evidence: [history, tier_param]
    cross_difficulty: null
  - id: fees_taken_with_settlement
    effect: method
    decides: fees_taken
    bindings: [fees_in_year, latest_fee_amount, payments_12m, fees_taken]
    ladder:
    - when: a fee stands billed on the plan inside the last twelve months and at least six premium payments stand on it in that time
      method: the fees billed on the plan inside the last twelve months are taken
    - when: at least six premium payments stand on the plan in the last twelve months and no fee stands billed on the plan in that time
      method: the most recent fee standing on the plan is taken, whenever it was billed
    - when: otherwise
      method: no fee standing on the plan is taken with the settlement
    baseline:
      fees_taken: "0.0"
    evidence: [history]
    cross_difficulty: null
  - id: fee_share_charged
    effect: parameter
    decides: fee_share_pct
    bindings: [unpaid_periods_count, fee_count_12m, fee_share_pct]
    ladder:
    - when: the arrears covers no more than four periods and no more than one fee stands billed on the plan inside the last twelve months
      value: the whole of the fees taken
    - when: no more than one fee stands billed on the plan inside the last twelve months and the arrears covers more than four periods
      value: half of the fees taken
    - when: otherwise
      value: none of them
    baseline:
      fee_share_pct: "0"
    evidence: [history]
    cross_difficulty: null
  - id: periods_taken_ahead
    effect: parameter
    decides: advance_periods
    bindings: [decisions_3m, months_of_cover_left, advance_periods]
    ladder:
    - when: the plan has more than two years of cover left to run and no claim stands decided on it inside the last three months
      value: two periods
    - when: the plan has more than two years of cover left to run and a claim stands decided on it inside the last three months
      value: one period
    - when: otherwise
      value: no period ahead of the arrears
    baseline:
      advance_periods: "0"
    evidence: [history, date]
    cross_difficulty: null
  - id: advance_period_discount
    effect: parameter
    decides: advance_discount_pct
    bindings: [member_plan_discount, member_grace_discount, advance_discount_pct]
    ladder:
    - when: the plan applies the membership discount, the Circle membership on the profile stands active and its tier carries a plan discount of more than nothing
      value: the protection plan discount of that membership tier
    - when: the plan applies the membership discount, that membership stands in grace and its tier carries a plan discount of more than nothing
      value: half that discount
    - when: otherwise
      value: no discount
    baseline:
      advance_discount_pct: "0"
    evidence: [cross_category]
    cross_difficulty: membership
