    ladder:
    - when: two or more parts entries stand on the job in the window read and the diagnosis most recently recorded on the job names a board-level failure
      method: every parts entry booked on the job inside the window read is taken
    - when: two or more parts entries stand on the job in the window read and the diagnosis most recently recorded names something other than a board-level failure
