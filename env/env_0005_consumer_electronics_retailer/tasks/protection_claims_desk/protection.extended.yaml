- id: protection_ext_spoilage_allowance
  base_policy_refs: [protection_claim_settlement, protection_agg_payout_cap, protection_combo_membership_interaction, protection_excl_duplicate_coverage]
  overwrite:
  - base_policy: protection_agg_payout_cap
    superseded_clause: the rolling twelve-month total read from protection_msr_payouts_12m is compared with the aggregate cap of the plan the claim sits on, and the payout is cut back to whatever room the cap leaves
    replaced_by: The allowance is then cut back to the room the plan's aggregate cap leaves, that cap less the payouts booked on the plan in the rolling twelve months ending on the day it is paid, and never below nothing.
  trigger: on_request
  subject: [protection_claim_payout]
  computes: allowance_amount
  target_tool: book_spoilage_allowance_79e3e314
  params:
    spoilage_excess_standard: 30.0
    spoilage_excess_repeat_claims: 15.0
    outage_share_full_pct: 100
    outage_share_part_pct: 70
    outage_share_short_pct: 40
    promptness_share_full_pct: 100
    promptness_share_week_pct: 90
    promptness_share_late_pct: 80
  rule: >
    Where a customer asks for the food spoiled by a covered appliance failure to be met, the plan pays an allowance
    for it alongside whatever the claim is settled by, and the allowance is worked out from how long the appliance
    stood out of use, how promptly the failure was reported and what cover the plan has left.
    The allowance for spoiled food is worked out only after every cost the claim has already been approved for stands
    booked as paid against the plan's cover.
    The cover left on the plan is what remains of the cover credited to it, and of any cover put back at an
    anniversary, once the payouts booked against it are taken off. The ceiling on the allowance is the plan's food
    spoilage cover. The days the appliance stood out of use are counted from the day the failure happened to the day
    the claim was decided. The share met for the days the appliance stood out of use is forty percent. The share met
    for promptness of the report is eighty percent. The household's excess on spoiled food is thirty dollars. The
    allowance paid is the ceiling on the allowance taken at the share met for the days the appliance stood out of use
    and at the share met for promptness of the report, less the household's excess on spoiled food, taken to the cent
    and never below nothing. The allowance is then cut back to the room the plan's aggregate cap leaves, that cap less
    the payouts booked on the plan in the rolling twelve months ending on the day it is paid, and never below nothing.
    The allowance never exceeds the plan's food spoilage cover, and it is paid alongside the
    settlement of the claim rather than inside the plan's per-claim limit.
    An allowance paid out as money to the customer is a payout on the plan whose settlement took the form of a
    reimbursement, rather than one settled by repair, by replacement or by a buyout.
    The ceiling on the allowance is the cover left on the plan where that cover has fallen below three tenths of the
    plan's term limit and an allowance already stands paid out as money to the customer on the plan inside the last
    twelve months; it is half the plan's food spoilage cover where that cover has fallen below half the term limit and
    no such allowance stands paid inside the last twelve months; and for every other plan the ceiling on the allowance
    is the plan's food spoilage cover.
    The days the appliance stood out of use are counted from the day the failure happened to the day the work on the
    covered item was completed, where a completion day stands recorded on the job for that item and a diagnosis
    stands recorded on it; they are counted from the day the failure was reported to the day the work was completed,
    where a completion day stands recorded and no diagnosis stands recorded on the job; and for every other claim they
    are counted from the day the failure happened to the day the claim was decided.
    The share met for the days the appliance stood out of use is the whole of the ceiling where the appliance stood
    out of use for more than ten days; it is seventy percent where the appliance stood out of use for more than three
    days and no more than ten; and for every other claim it is forty percent.
    The share met for promptness of the report is the whole of the ceiling where the failure was reported inside three
    days of it happening; it is ninety percent where the failure was reported inside seven days of it happening; and
    for every other claim the share met for promptness of the report is eighty percent.
    A claim deductible stands unsettled on the plan where the excesses billed on it come to more than the excess
    payments received against them. The household's excess on spoiled food is nothing where no claim deductible stands
    unsettled on the plan and
    fewer than two claims stand decided on it inside the last twelve months; it is fifteen dollars where no claim
    deductible stands unsettled on the plan and two or more claims stand decided on it inside that time; and for
    every other plan the household's excess on spoiled food is thirty dollars.
  prerequisite:
  - problem: protection_ext_claim_repair_settlement
    kind: value_input
    gate: allowance_ceiling
    form: state
    policy_source: The allowance for spoiled food is worked out only after every cost the claim has already been approved for stands booked as paid against the plan's cover.
    condition: the plan's history carries a payout entry for the cost the claim was approved for, so the cover left on the plan already stands reduced by it
    resolved_by: book_claim_payout_542e239c
    effect: once the approved cost stands booked as paid, the cover left on the plan falls by that payout and the ceiling on the allowance is taken from the reduced cover
  cross_category:
  - category: service
    as: history
    reads: [completed_date, status, service_events.event_type]
    note: the days the appliance stood out of use are counted to the day the repairer completed the work on the covered item, and the clock used turns on whether a diagnosis stands recorded on that job.
  compute:
  - coverage_credited: "SUM('protection_events','coverage_amount', event_type='protection_coverage_grant') + SUM('protection_events','coverage_amount', event_type='protection_coverage_reinstate')"
  - payouts_booked: "SUM('protection_events','payout_amount', event_type='protection_claim_payout')"
  - cover_left: "RND(coverage_credited - payouts_booked, 2)"
  - prior_allowances_12m: "SUM('protection_events','payout_amount', within_months=12, event_type='protection_claim_payout', settlement_basis='reimbursement')"
  - allowance_ceiling: "MN(P('food_spoilage_cover_usd'), cover_left if (cover_left < P('coverage_limit_usd') * 3 / 10 and prior_allowances_12m > 0) else (RND(P('food_spoilage_cover_usd') / 2, 2) if (cover_left < P('coverage_limit_usd') / 2 and prior_allowances_12m <= 0) else P('food_spoilage_cover_usd')))"
  - incident_date: "LATEST('protection_events','incident_date', event_type='protection_claim_file')"
  - report_date: "LATEST('protection_events','report_date', event_type='protection_claim_file')"
  - decision_date: "LATEST('protection_events','event_date', event_type='protection_claim_decision')"
  - covered_item_job: "CFIELD('service','service_agreement_id', item_serial=F('covered_item_serial'))"
  - work_completed_date: "CFIELD('service','completed_date', item_serial=F('covered_item_serial'))"
  - diagnoses_on_job: "XCOUNT('service','service_events', event_type='service_diagnostic_record', service_agreement_id=covered_item_job)"
  - days_out_of_use: "DAYS(incident_date, work_completed_date) if (work_completed_date != None and diagnoses_on_job >= 1) else (DAYS(report_date, work_completed_date) if (work_completed_date != None and diagnoses_on_job <= 0) else DAYS(incident_date, decision_date))"
  - outage_share_pct: "K('outage_share_full_pct') if (days_out_of_use > 10) else (K('outage_share_part_pct') if (days_out_of_use > 3 and days_out_of_use <= 10) else K('outage_share_short_pct'))"
  - days_to_report: "DAYS(incident_date, report_date)"
  - promptness_share_pct: "K('promptness_share_full_pct') if (days_to_report <= 3) else (K('promptness_share_week_pct') if (days_to_report <= 7) else K('promptness_share_late_pct'))"
  - deductible_billed: "SUM('protection_events','deductible_amount', event_type='protection_deductible_charge')"
  - deductible_paid: "SUM('protection_events','deductible_amount', event_type='protection_deductible_payment')"
  - decisions_12m: "COUNT('protection_events', within_months=12, event_type='protection_claim_decision')"
  - spoilage_excess: "0.0 if (deductible_billed - deductible_paid <= 0 and decisions_12m < 2) else (K('spoilage_excess_repeat_claims') if (deductible_billed - deductible_paid <= 0 and decisions_12m >= 2) else K('spoilage_excess_standard'))"
  - payouts_rolling_12m: "SUM('protection_events','payout_amount', within_months=12, event_type='protection_claim_payout')"
  - cap_room: "MX(0.0, RND(P('aggregate_payout_cap_per_12m_usd') - payouts_rolling_12m, 2))"
  - result: "MN(cap_room, MX(0.0, RND(allowance_ceiling * outage_share_pct / 100 * promptness_share_pct / 100 - spoilage_excess, 2)))"
  compute_basis:
    coverage_credited: The cover left on the plan is what remains of the cover credited to it, and of any cover put back at an anniversary, once the payouts booked against it are taken off.
    payouts_booked: The cover left on the plan is what remains of the cover credited to it, and of any cover put back at an anniversary, once the payouts booked against it are taken off.
    cover_left: The cover left on the plan is what remains of the cover credited to it, and of any cover put back at an anniversary, once the payouts booked against it are taken off.
    prior_allowances_12m: An allowance paid out as money to the customer is a payout on the plan whose settlement took the form of a reimbursement, rather than one settled by repair, by replacement or by a buyout. The ceiling on the allowance is the cover left on the plan where that cover has fallen below three tenths of the plan's term limit and an allowance already stands paid out as money to the customer on the plan inside the last twelve months; it is half the plan's food spoilage cover where that cover has fallen below half the term limit and no such allowance stands paid inside the last twelve months; and for every other plan the ceiling on the allowance is the plan's food spoilage cover.
    allowance_ceiling: The ceiling on the allowance is the cover left on the plan where that cover has fallen below three tenths of the plan's term limit and an allowance already stands paid out as money to the customer on the plan inside the last twelve months; it is half the plan's food spoilage cover where that cover has fallen below half the term limit and no such allowance stands paid inside the last twelve months; and for every other plan the ceiling on the allowance is the plan's food spoilage cover.
    incident_date: The days the appliance stood out of use are counted from the day the failure happened to the day the claim was decided.
    report_date: The share met for promptness of the report is the whole of the ceiling where the failure was reported inside three days of it happening; it is ninety percent where the failure was reported inside seven days of it happening; and for every other claim the share met for promptness of the report is eighty percent.
    decision_date: The days the appliance stood out of use are counted from the day the failure happened to the day the claim was decided.
    work_completed_date: The days the appliance stood out of use are counted from the day the failure happened to the day the work on the covered item was completed, where a completion day stands recorded on the job for that item and a diagnosis stands recorded on it; they are counted from the day the failure was reported to the day the work was completed, where a completion day stands recorded and no diagnosis stands recorded on the job; and for every other claim they are counted from the day the failure happened to the day the claim was decided.
    diagnoses_on_job: The days the appliance stood out of use are counted from the day the failure happened to the day the work on the covered item was completed, where a completion day stands recorded on the job for that item and a diagnosis stands recorded on it; they are counted from the day the failure was reported to the day the work was completed, where a completion day stands recorded and no diagnosis stands recorded on the job; and for every other claim they are counted from the day the failure happened to the day the claim was decided.
    days_out_of_use: The days the appliance stood out of use are counted from the day the failure happened to the day the work on the covered item was completed, where a completion day stands recorded on the job for that item and a diagnosis stands recorded on it; they are counted from the day the failure was reported to the day the work was completed, where a completion day stands recorded and no diagnosis stands recorded on the job; and for every other claim they are counted from the day the failure happened to the day the claim was decided.
    covered_item_job: The days the appliance stood out of use are counted from the day the failure happened to the day the work on the covered item was completed, where a completion day stands recorded on the job for that item and a diagnosis stands recorded on it; they are counted from the day the failure was reported to the day the work was completed, where a completion day stands recorded and no diagnosis stands recorded on the job; and for every other claim they are counted from the day the failure happened to the day the claim was decided.
    payouts_rolling_12m: The allowance is then cut back to the room the plan's aggregate cap leaves, that cap less the payouts booked on the plan in the rolling twelve months ending on the day it is paid, and never below nothing.
    cap_room: The allowance is then cut back to the room the plan's aggregate cap leaves, that cap less the payouts booked on the plan in the rolling twelve months ending on the day it is paid, and never below nothing.
    outage_share_pct: The share met for the days the appliance stood out of use is the whole of the ceiling where the appliance stood out of use for more than ten days; it is seventy percent where the appliance stood out of use for more than three days and no more than ten; and for every other claim it is forty percent.
    days_to_report: The share met for promptness of the report is the whole of the ceiling where the failure was reported inside three days of it happening; it is ninety percent where the failure was reported inside seven days of it happening; and for every other claim the share met for promptness of the report is eighty percent.
    promptness_share_pct: The share met for promptness of the report is the whole of the ceiling where the failure was reported inside three days of it happening; it is ninety percent where the failure was reported inside seven days of it happening; and for every other claim the share met for promptness of the report is eighty percent.
    deductible_billed: A claim deductible stands unsettled on the plan where the excesses billed on it come to more than the excess payments received against them. The household's excess on spoiled food is nothing where no claim deductible stands unsettled on the plan and fewer than two claims stand decided on it inside the last twelve months; it is fifteen dollars where no claim deductible stands unsettled on the plan and two or more claims stand decided on it inside that time; and for every other plan the household's excess on spoiled food is thirty dollars.
    deductible_paid: A claim deductible stands unsettled on the plan where the excesses billed on it come to more than the excess payments received against them. The household's excess on spoiled food is nothing where no claim deductible stands unsettled on the plan and fewer than two claims stand decided on it inside the last twelve months; it is fifteen dollars where no claim deductible stands unsettled on the plan and two or more claims stand decided on it inside that time; and for every other plan the household's excess on spoiled food is thirty dollars.
    decisions_12m: The household's excess on spoiled food is nothing where no claim deductible stands unsettled on the plan and fewer than two claims stand decided on it inside the last twelve months; it is fifteen dollars where no claim deductible stands unsettled on the plan and two or more claims stand decided on it inside that time; and for every other plan the household's excess on spoiled food is thirty dollars.
    spoilage_excess: The household's excess on spoiled food is nothing where no claim deductible stands unsettled on the plan and fewer than two claims stand decided on it inside the last twelve months; it is fifteen dollars where no claim deductible stands unsettled on the plan and two or more claims stand decided on it inside that time; and for every other plan the household's excess on spoiled food is thirty dollars.
    result: The allowance is then cut back to the room the plan's aggregate cap leaves, that cap less the payouts booked on the plan in the rolling twelve months ending on the day it is paid, and never below nothing.
  factors:
  - id: allowance_ceiling_basis
    effect: method
    decides: allowance_ceiling
    bindings: [prior_allowances_12m, allowance_ceiling]
    ladder:
    - when: the cover left on the plan has fallen below three tenths of the plan's term limit and an allowance already stands paid out as money to the customer on the plan inside the last twelve months
      method: the ceiling is taken from the cover left on the plan
    - when: the cover left on the plan has fallen below half the term limit and no such allowance stands paid inside the last twelve months
      method: the ceiling is half the plan's food spoilage cover
    - when: otherwise
      method: the ceiling is the plan's food spoilage cover
    baseline:
      allowance_ceiling: "P('food_spoilage_cover_usd')"
    evidence: [history]
    cross_difficulty: null
  - id: outage_clock
    effect: method
    decides: days_out_of_use
    bindings: [work_completed_date, diagnoses_on_job, days_out_of_use]
    ladder:
    - when: a completion day stands recorded on the job for the covered item and a diagnosis stands recorded on it
      method: the days are counted from the day the failure happened to the day the work was completed
    - when: a completion day stands recorded and no diagnosis stands recorded on the job
      method: the days are counted from the day the failure was reported to the day the work was completed
    - when: otherwise
      method: the days are counted from the day the failure happened to the day the claim was decided
    baseline:
      days_out_of_use: "DAYS(incident_date, decision_date)"
    evidence: [cross_category, date]
    cross_difficulty: service
  - id: outage_share_met
    effect: parameter
    decides: outage_share_pct
    bindings: [incident_date, outage_share_pct]
    ladder:
    - when: the appliance stood out of use for more than ten days
      value: the whole of the ceiling
    - when: the appliance stood out of use for more than three days and no more than ten
      value: seventy percent
    - when: otherwise
      value: forty percent
    baseline:
      outage_share_pct: "K('outage_share_short_pct')"
    evidence: [date]
    cross_difficulty: null
  - id: report_promptness_share
    effect: parameter
    decides: promptness_share_pct
    bindings: [days_to_report, promptness_share_pct]
    ladder:
    - when: the failure was reported inside three days of it happening
      value: the whole of the ceiling
    - when: the failure was reported inside seven days of it happening
      value: ninety percent
    - when: otherwise
      value: eighty percent
    baseline:
      promptness_share_pct: "K('promptness_share_late_pct')"
    evidence: [date]
    cross_difficulty: null
  - id: household_excess_on_food
    effect: parameter
    decides: spoilage_excess
    bindings: [deductible_billed, deductible_paid, decisions_12m, spoilage_excess]
    ladder:
    - when: no claim deductible stands unsettled on the plan and fewer than two claims stand decided on it inside the last twelve months
      value: nothing
    - when: no claim deductible stands unsettled on the plan and two or more claims stand decided on it inside that time
      value: fifteen dollars
    - when: otherwise
      value: thirty dollars
    baseline:
      spoilage_excess: "K('spoilage_excess_standard')"
    evidence: [history]
    cross_difficulty: null
  baseline:
    rule: >-
      The cover left on the plan is what remains of the cover credited to it, and of any cover put back at an
      anniversary, once the payouts booked against it are taken off. The ceiling on the allowance is the plan's food
      spoilage cover. The days the appliance stood out of use are counted from the day the failure happened to the day
      the claim was decided. The share met for the days the appliance stood out of use is forty percent. The share met
      for promptness of the report is eighty percent. The household's excess on spoiled food is thirty dollars. The
      allowance paid is the ceiling on the allowance taken at the share met for the days the appliance stood out of
      use and at the share met for promptness of the report, less the household's excess on spoiled food, taken to the
      cent and never below nothing. The allowance is then cut back to the room the plan's aggregate cap leaves, that
