  rule: 'A claim is approved only when the peril reported is one the plan covers: the plan''s switches for accidental damage, liquid ingress, power surge, screen breakage, theft, battery health and cosmetic
    marks decide the peril, and a peril the plan does not carry is denied as not covered whatever the repair would cost. A claim is adjudicated only once the documents the plan requires are recorded as
    received against that claim reference, and the customer''s word that the receipt was emailed is not a substitute. A theft claim additionally needs a police report on file, and a claim on a plan that
    requires proof of purchase needs that proof; where either is missing the customer is given the plan''s days to supply it and the claim is denied for want of proof only after that. A fault the item already
    had before coverage started is denied as pre-existing, and use of the item in a business on a plan that does not cover commercial use is denied as not covered. An approved claim is settled by repair
    while repairs on the item are still below the plan''s repair attempts figure; once that figure is reached, or the same fault has been repaired as often as the no-lemon figure allows, the next approval
    is settled by replacement instead, read from protection_msr_repair_attempts_item. A replacement is settled at what the plan''s replacement basis names, and a reimbursement is offered instead only where
    no equivalent model is stocked. A denial may be appealed within the plan''s appeal window, and an appeal is a fresh decision on the same claim reference rather than a new claim.'
