- id: protection_claim_review_hold
  subject:
  - protection_claim_hold_start
  - protection_claim_hold_release
  rule: 'A claim that needs an inspection, a police report or a second opinion puts the plan into claim_hold so that only one claim is worked at a time. A claim is held under review for no longer than the
    plan''s review days, counted from the day the claim was opened. Review days are counted as business days on the retailer''s trading calendar from the day the claim was opened, which counts as day zero,
    and days the stores are shut do not count. The hold is released when the decision is recorded, when the customer withdraws, or when the review days run out, in which case the claim is decided on the
    evidence then on file. Coverage is not suspended by a hold: the coverage window keeps running and the term still ends on its own day. A plan on a tier with priority claim handling is reviewed ahead
    of the ordinary queue, which shortens the wait but does not change the review days themselves.'
  eligibility:
  - id: review_days_not_exceeded
    applies_to:
    - protection_claim_hold_release
    kind: time
    condition: A claim is held under review for no longer than the plan's review days, counted from the day the claim was opened.
    evidence_fields:
    - protection_events.event_date
    - protection_events.claim_reference
    - protection_plans.plan_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - protection_events.claim_reference
      action_bindings:
        protection_events.claim_reference: claim_reference
    temporal_basis:
      clock: frozen_time
      anchor_event: the day the claim was opened
      anchor_source: protection_events.event_date
      relation: not_after
      duration_source: params.claim_hold_review_days
      unit: business_days
      counting_rule: Review days are counted as business days on the retailer's trading calendar from the day the claim was opened, which counts as day zero, and days the stores are shut do not count.
      boundary: inclusive
  params:
    per_tier:
