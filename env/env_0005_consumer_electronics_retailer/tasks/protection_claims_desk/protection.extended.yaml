- id: protection_ext_fleet_instalment_billing
  base_policy_refs: [protection_premium_billing, protection_combo_membership_interaction]
  overwrite:
  - base_policy: protection_premium_billing
    superseded_clause: an instalment plan bills the monthly premium of the plan on the same day of each month
    replaced_by: The instalment billed is the plan's monthly premium adjusted once by the loadings and discounts combined into a single rate, taken to the cent and never below nothing.
  trigger: state_due
  subject: [protection_premium_charge]
  computes: instalment_amount
  target_tool: bill_premium_instalment_3dd4c03b
  params:
    volume_band_high_usd: 25000.0
    volume_band_mid_usd: 10000.0
    volume_discount_high_pct: 12
    volume_discount_mid_pct: 6
    loading_payout_band_high_usd: 2500.0
    loading_payout_band_low_usd: 1000.0
    claims_loading_high_pct: 15
    claims_loading_mid_pct: 8
    trading_window_long_months: 12
    trading_window_mid_months: 6
    trading_window_short_months: 3
    terms_discount_clear_pct: 3
    terms_discount_standard_pct: 1
  rule: >
    The instalment for a premium period on a plan held on instalments and invoiced to a store credit account the
    profile settles on terms is priced from the plan's monthly premium and then adjusted for the trading the account
    has done, for the claims the plan has already met and for the terms the account is settled on. A plan whose
    premium is not invoiced to such an account is priced as the premium billing rules of the product state, and
    nothing in this rule changes what it pays.
    The instalment billed for a premium period is the plan's monthly premium. The trading record on the account is
    read over the last three months. No discount for the trading record is allowed on the instalment. No loading for
    the claims already met is added to it. No discount for the terms the account is settled on is allowed. The
    instalment billed is the plan's monthly premium adjusted once by the loadings and discounts combined into a single
    rate, taken to the cent and never below nothing. The loading and the discounts are first combined into one rate
    and the plan's monthly premium is adjusted once by that rate; they do not act one after another on the figure the
    previous one left.
    The instalment is billed for the period running from the plan's billing day in the month reached to the day
    before that day in the month following.
    The trading record on the account is read over the last twelve months where a statement has closed on the
    customer's store credit account inside the last three months and that account stands active; it is read over the
    last six months where that account stands active and no statement has closed on it inside the last three months;
    and for every other profile the trading record on the account is read over the last three months.
    The discount for the trading record is twelve percent where the merchandise the profile has bought over the window
    read comes to twenty-five thousand dollars or more and the store credit account stands active; it is six percent
    where that merchandise comes to ten thousand dollars or more but under twenty-five thousand and the account stands
    active; and for every other profile no discount for the trading record is allowed on the instalment.
    The loading for the claims already met is fifteen percent where the payouts booked on the plan inside the last
    twelve months come to more than two thousand five hundred dollars and two or more claims stand filed on it in that
    time; it is eight percent where those payouts come to more than one thousand dollars but no more than two thousand
    five hundred and at least one claim stands filed in that time; and for every other plan no loading for the claims
    already met is added to it.
    The discount for the terms the account is settled on is three percent where the store credit account runs on terms
    of thirty days or more and no payment stands returned on it inside the last twelve months; it is one percent where
    the account runs on terms of thirty days or more and a payment stands returned on it inside that time; and for
    every other profile no discount for the terms the account is settled on is allowed.
  prerequisite: []
  cross_category:
  - category: credit
    as: branch
    reads: [status, credit_events.event_type, business_net_terms_days]
    note: the window the trading record is read over and the discount for the terms turn on the state of the store credit account, on the statements that have closed on it and on the terms its tier carries.
  - category: orders
    as: history
    reads: [order_events.charge_amount, order_events.charge_kind]
    note: the discount for the trading record is decided from the merchandise the profile has bought on its purchase orders over the window read.
  compute:
  - statements_3m: "XCOUNT('credit','credit_events', within_months=3, event_type='credit_statement_close')"
  - account_active: "EXISTS('credit', status='active')"
  - trading_window_months: "K('trading_window_long_months') if (statements_3m >= 1 and account_active) else (K('trading_window_mid_months') if (account_active and statements_3m <= 0) else K('trading_window_short_months'))"
  - merch_spend: "XSUM('orders','order_events','charge_amount', within_months=trading_window_months, event_type='orders_line_charge', charge_kind='merchandise_line')"
  - volume_discount_pct: "K('volume_discount_high_pct') if (merch_spend >= K('volume_band_high_usd') and account_active) else (K('volume_discount_mid_pct') if (merch_spend >= K('volume_band_mid_usd') and merch_spend < K('volume_band_high_usd') and account_active) else 0)"
  - payouts_12m: "SUM('protection_events','payout_amount', within_months=12, event_type='protection_claim_payout')"
  - claims_12m: "COUNT('protection_events', within_months=12, event_type='protection_claim_file')"
  - claims_loading_pct: "K('claims_loading_high_pct') if (payouts_12m > K('loading_payout_band_high_usd') and claims_12m >= 2) else (K('claims_loading_mid_pct') if (payouts_12m > K('loading_payout_band_low_usd') and payouts_12m <= K('loading_payout_band_high_usd') and claims_12m >= 1) else 0)"
  - terms_days: "CPARAM('credit','business_net_terms_days', status='active')"
  - returned_payments_12m: "XCOUNT('credit','credit_events', within_months=12, event_type='credit_fee_charge', fee_kind='returned_payment_fee')"
  - terms_discount_pct: "K('terms_discount_clear_pct') if ((terms_days or 0) >= 30 and returned_payments_12m <= 0) else (K('terms_discount_standard_pct') if ((terms_days or 0) >= 30 and returned_payments_12m >= 1) else 0)"
  - result: "MX(0.0, RND(P('monthly_premium_usd') * (100 + claims_loading_pct - volume_discount_pct - terms_discount_pct) / 100, 2))"
  compute_basis:
    statements_3m: The trading record on the account is read over the last twelve months where a statement has closed on the customer's store credit account inside the last three months and that account stands active; it is read over the last six months where that account stands active and no statement has closed on it inside the last three months; and for every other profile the trading record on the account is read over the last three months.
    account_active: The trading record on the account is read over the last twelve months where a statement has closed on the customer's store credit account inside the last three months and that account stands active; it is read over the last six months where that account stands active and no statement has closed on it inside the last three months; and for every other profile the trading record on the account is read over the last three months.
    trading_window_months: The trading record on the account is read over the last twelve months where a statement has closed on the customer's store credit account inside the last three months and that account stands active; it is read over the last six months where that account stands active and no statement has closed on it inside the last three months; and for every other profile the trading record on the account is read over the last three months.
    merch_spend: The discount for the trading record is twelve percent where the merchandise the profile has bought over the window read comes to twenty-five thousand dollars or more and the store credit account stands active; it is six percent where that merchandise comes to ten thousand dollars or more but under twenty-five thousand and the account stands active; and for every other profile no discount for the trading record is allowed on the instalment.
    volume_discount_pct: The discount for the trading record is twelve percent where the merchandise the profile has bought over the window read comes to twenty-five thousand dollars or more and the store credit account stands active; it is six percent where that merchandise comes to ten thousand dollars or more but under twenty-five thousand and the account stands active; and for every other profile no discount for the trading record is allowed on the instalment.
    payouts_12m: The loading for the claims already met is fifteen percent where the payouts booked on the plan inside the last twelve months come to more than two thousand five hundred dollars and two or more claims stand filed on it in that time; it is eight percent where those payouts come to more than one thousand dollars but no more than two thousand five hundred and at least one claim stands filed in that time; and for every other plan no loading for the claims already met is added to it.
    claims_12m: The loading for the claims already met is fifteen percent where the payouts booked on the plan inside the last twelve months come to more than two thousand five hundred dollars and two or more claims stand filed on it in that time; it is eight percent where those payouts come to more than one thousand dollars but no more than two thousand five hundred and at least one claim stands filed in that time; and for every other plan no loading for the claims already met is added to it.
    claims_loading_pct: The loading for the claims already met is fifteen percent where the payouts booked on the plan inside the last twelve months come to more than two thousand five hundred dollars and two or more claims stand filed on it in that time; it is eight percent where those payouts come to more than one thousand dollars but no more than two thousand five hundred and at least one claim stands filed in that time; and for every other plan no loading for the claims already met is added to it.
    terms_days: The discount for the terms the account is settled on is three percent where the store credit account runs on terms of thirty days or more and no payment stands returned on it inside the last twelve months; it is one percent where the account runs on terms of thirty days or more and a payment stands returned on it inside that time; and for every other profile no discount for the terms the account is settled on is allowed.
    returned_payments_12m: The discount for the terms the account is settled on is three percent where the store credit account runs on terms of thirty days or more and no payment stands returned on it inside the last twelve months; it is one percent where the account runs on terms of thirty days or more and a payment stands returned on it inside that time; and for every other profile no discount for the terms the account is settled on is allowed.
    terms_discount_pct: The discount for the terms the account is settled on is three percent where the store credit account runs on terms of thirty days or more and no payment stands returned on it inside the last twelve months; it is one percent where the account runs on terms of thirty days or more and a payment stands returned on it inside that time; and for every other profile no discount for the terms the account is settled on is allowed.
    result: The loading and the discounts are first combined into one rate and the plan's monthly premium is adjusted once by that rate; they do not act one after another on the figure the previous one left.
  factors:
  - id: trading_record_window
    effect: method
    decides: trading_window_months
    bindings: [statements_3m, account_active, trading_window_months]
    ladder:
    - when: a statement has closed on the customer's store credit account inside the last three months and that account stands active
      method: the trading record is read over the last twelve months
    - when: that account stands active and no statement has closed on it inside the last three months
