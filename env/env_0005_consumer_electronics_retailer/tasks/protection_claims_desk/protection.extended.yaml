- id: protection_cancellation_refund
  subject:
  - protection_plan_cancel
  - protection_premium_refund
  rule: A cancellation is carried into the plan record only against a claim intake or change record standing as signed by the customer for that plan. The whole premium is returned only when the cancellation
    is confirmed within the plan's free look days, counted from the day the plan was activated. Free look days are counted as calendar days from the activation day, which counts as day zero. A cancellation
    confirmed inside the free look returns everything taken, including any administration fee, and the plan is treated as never having been in force for premium purposes even though claims already paid
    are recovered from the refund. A premium refund is booked only on a plan standing active, in claim_hold, cancelled or void. After the free look the plans that refund pro rata return the premium for
    the whole unused months of the term, deduct every payout already made and the plan's administration fee, and pay nothing where that leaves a negative figure; the plan whose basis gives no refund after
    the free look pays nothing. A void plan returns every premium taken with no administration fee deducted, because the plan was never in force. A refund goes back to the method the premium was taken from
    where it is still on file, and otherwise as store credit.
  eligibility:
  - id: customer_signed_cancellation
    applies_to:
    - protection_plan_cancel
    kind: authorization
    condition: A cancellation is carried into the plan record only against a claim intake or change record standing as signed by the customer for that plan.
    evidence_fields:
    - protection_claim_intakes.customer_attestation
    - protection_claim_intakes.plan_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - protection_claim_intakes.plan_id
      action_bindings:
        protection_claim_intakes.plan_id: plan_id
  - id: free_look_open
    applies_to:
    - protection_plan_cancel
    kind: time
    condition: The whole premium is returned only when the cancellation is confirmed within the plan's free look days, counted from the day the plan was activated.
    evidence_fields:
    - protection_plans.activation_date
    - protection_plans.plan_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - protection_plans.plan_id
      action_bindings:
        protection_plans.plan_id: plan_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the day the plan was activated
      anchor_source: protection_plans.activation_date
      relation: not_after
      duration_source: params.cancellation_free_look_days
      unit: calendar_days
      counting_rule: Free look days are counted as calendar days from the activation day, which counts as day zero.
      boundary: inclusive
  - id: refundable_plan_state
