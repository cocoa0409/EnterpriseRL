- id: protection_combo_membership_interaction
  subject:
  - protection_premium_charge
  - protection_claim_payout
  rule: 'Holding a Circle membership changes what a plan costs and how a claim is worked: where the plan applies the membership discount, the membership tier''s plan discount is taken off the premium, and
    the membership''s repair labour discount is never applied on top of a covered repair because covered labour is already paid in full by the plan. A member''s benefit credit may be spent on a deductible
    but never on a premium, because a premium is not a service charge. Where the membership stands in grace on a tier that suspends benefits, the discount is not applied to a premium billed in that period
    and is not applied afterwards by way of correction. A business fleet plan takes its pricing from the contract price book and no membership discount applies to it at all. The membership tier is read
    as it stands on the day the premium is billed or the payout is booked, not as it stood when the plan was sold.'
