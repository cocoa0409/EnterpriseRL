category: protection
display_name: Northbeam ShieldCare Protection Plans
binding:
  holding_table: protection_plans
  event_tables:
  - protection_events
  intake_tables:
  - protection_claim_intakes
  status_field: status
  variant_field: variant_name
  quantity_fields:
    coverage_remaining: coverage_pool
    premium_outstanding: premium_receivable
    deductible_outstanding: deductible_receivable
lifecycle:
  states:
  - application_received
  - active
  - claim_hold
  - expired
  - cancelled
  - void
  transitions:
  - from: application_received
    to: active
    by: agent
    means: the premium cleared and the coverage window was written onto the plan
  - from: application_received
    to: void
    by: agent
    means: the item was never eligible or the serial belonged to no purchase on file
  - from: active
    to: claim_hold
    by: agent
    means: a filed claim went under review and the plan is held while it is worked
  - from: claim_hold
    to: active
    by: agent
    means: the review closed and ordinary coverage resumed
  - from: active
    to: expired
    by: system
    means: the coverage term ran to its end day
  - from: claim_hold
    to: expired
    by: system
    means: the coverage term ran out while a claim was still under review
  - from: active
    to: cancelled
    by: user
    means: the customer confirmed the cancellation of the plan
  - from: claim_hold
    to: cancelled
    by: user
    means: the customer confirmed the cancellation while a claim was under review
  - from: active
    to: cancelled
    by: agent
    means: an unpaid instalment ran past grace and the retailer ended the plan
  - from: active
    to: void
    by: agent
    means: the sale was found to rest on a misstatement about the item
accounts:
- key: coverage_pool
  unit: USD
  meaning: coverage credited to the plan and drawn down by payouts; the remaining figure on the plan is the running sum of the deltas
- key: premium_receivable
  unit: USD
  meaning: premium and plan fees billed and not yet settled; an in delta bills the customer, an out delta records money received or returned
- key: deductible_receivable
  unit: USD
  meaning: claim deductibles billed and not yet settled; an in delta bills the customer and an out delta records money received
parameter_schema:
  single_payment_premium_pct_of_price: Premium for the whole term as a percentage of the covered item price, percent; 0.0 where a single payment is not offered.
  monthly_premium_usd: Premium billed each month where the plan is held on instalments, USD; 0.00 where instalments are not offered.
  premium_payment_options: How the premium may be collected on this plan (string).
  plan_term_months: Length of the coverage term sold, whole months.
  coverage_waiting_period_days: Days after activation before the plan will pay a claim.
  coverage_start_basis: What the coverage term is counted from (string).
  coverage_limit_usd: Total the plan will pay across the whole term, USD.
  per_claim_limit_usd: Most the plan will pay on one claim, USD.
  claim_limit_count_per_term: Claims the plan will pay in one term.
  deductible_usd: Amount the customer pays toward each approved claim, USD.
  deductible_waiver_on_repair: Whether the deductible is waived when the claim is settled by repair rather than replacement.
  parts_covered: Whether replacement parts are covered.
  labour_covered: Whether repair labour is covered.
  accidental_damage_covered: Whether drops, knocks and cracks from handling are covered.
  liquid_damage_covered: Whether liquid ingress is covered.
  power_surge_covered: Whether damage from a mains power surge is covered.
  screen_breakage_covered: Whether a cracked screen or panel is covered.
  theft_covered: Whether theft of the covered item is covered.
  battery_replacement_covered: Whether a battery that has fallen below the stated health floor is replaced.
  food_spoilage_cover_usd: Most the plan pays for food spoiled by a covered appliance failure, USD.
  normal_wear_covered: Whether wear from ordinary use is covered.
  cosmetic_damage_covered: Whether marks that do not affect function are covered.
  pre_existing_condition_excluded: Whether a fault present before coverage started is excluded.
  commercial_use_covered: Whether use of the item in a business is covered.
  international_service_covered: Whether work carried out outside the country is covered.
  claim_report_window_days: Days from the incident within which the claim must be reported.
  proof_of_purchase_required: Whether the original proof of purchase must be on file before a claim is adjudicated.
  police_report_required_for_theft: Whether a police report is required before a theft claim is adjudicated.
  documentation_days_to_supply: Days the customer has to supply missing documents before the claim is denied for want of proof.
  max_repair_attempts_before_replacement: Authorised repairs on the same item after which the next approved claim is settled by replacement.
  no_lemon_repairs: Repairs for the same fault after which the item is replaced outright under the no-lemon rule.
  replacement_basis: What an approved replacement is valued at (string).
  depreciation_schedule: Depreciation applied to a reimbursement, as a threshold ladder of item age in months to percentage taken off.
  reimbursement_cap_pct_of_purchase_price: Most a cash reimbursement may be, as a percentage of the item purchase price.
  settlement_payment_method_default: How an approved settlement is paid unless the customer asks otherwise (string).
  data_recovery_credit_usd: Credit toward professional data recovery after a covered failure, USD.
  haul_away_on_replacement: Whether the failed item is taken away when a replacement is delivered.
  loaner_device_included: Whether a loan unit is provided while the item is in for repair.
  loaner_days_included: Days the loan unit may be kept.
  service_providers_allowed: Who may carry out covered work (string).
  on_site_service_included: Whether a technician attends the address instead of the item being brought in.
  depot_shipping_paid_by: Who pays to send the item to the depot and back (string).
  priority_claim_handling: Whether claims on this plan are worked ahead of the ordinary queue.
  annual_coverage_reinstatement: Whether the coverage limit is reinstated at each coverage anniversary.
  reinstatement_basis: How the coverage limit is put back (string).
  covered_item_categories: Merchandise departments the plan may be sold on (string).
  covered_item_price_band_usd: Price band of item the plan may be sold on, as the inclusive minimum and maximum, USD.
  covered_item_age_limit_days: Days after the item purchase within which a plan may still be added to it.
  multi_item_plan_slots: Covered items one plan record may carry.
  aggregate_payout_cap_per_12m_usd: Most the retailer pays across every plan the customer holds in a rolling twelve months, USD.
  premium_grace_days: Days an unpaid instalment may run before the plan is terminated for non-payment.
  premium_late_fee_usd: Fee billed when an instalment is still unpaid at the end of grace, USD.
  cancellation_free_look_days: Days from activation within which the whole premium is refunded.
  cancellation_refund_basis: How the premium is refunded after the free look (string).
  cancellation_admin_fee_usd: Administration fee kept from a pro rata refund, USD.
  transfer_allowed: Whether the plan may move with the item to a new owner.
  transfer_fee_usd: Fee to transfer the plan to a new owner, USD.
  claim_hold_review_days: Days a claim may sit under review before a decision must be recorded.
  claim_appeal_window_days: Days after a denial within which the customer may appeal.
  membership_discount_applies: Whether the customer's Circle membership discount is applied to the premium.
