- id: protection_ext_claim_repair_settlement
  base_policy_refs: [protection_claim_settlement, protection_agg_payout_cap, protection_combo_membership_interaction, protection_excl_duplicate_coverage]
  overwrite:
  - base_policy: protection_agg_payout_cap
    superseded_clause: the rolling twelve-month total read from protection_msr_payouts_12m is compared with the aggregate cap of the plan the claim sits on, and the payout is cut back to whatever room the cap leaves
    replaced_by: The room the plan's aggregate cap leaves is that cap less the payouts booked on the plan in the rolling twelve months ending on the day of settlement, and never below nothing; the cut-back to that room is made after the per-claim limit and the cover left, and never before them.
  - base_policy: protection_excl_duplicate_coverage
    superseded_clause: A ShieldCare plan and a manufacturer's warranty are never both settled for the same repair, and a plan does not pay while the manufacturer's warranty on that item is still running unless the peril is one the manufacturer excludes.
    replaced_by: The plan meets nothing of a job the repairer has booked as work the manufacturer's warranty on the covered item was still running to meet, and the entries the plan meets are read from the repairer's own ledger on that job.
  trigger: state_due
  subject: [protection_claim_payout]
  computes: payout_amount
  target_tool: book_claim_payout_542e239c
  params:
    bill_window_priority_months: 3
    bill_window_diagnosed_months: 6
    bill_window_standard_months: 12
    parts_share_full_pct: 100
    parts_share_standard_pct: 90
    parts_share_worn_pct: 75
    attendance_share_full_pct: 100
    attendance_share_part_pct: 60
    labour_share_full_pct: 100
    labour_share_mid_pct: 95
    labour_share_aged_pct: 90
  rule: >
    Where a claim stands approved for repair on a covered item, the plan pays the part of the repairer's bill that the
    cover carries, worked out from the entries the repairer has booked against the job on that item.
    The amount the plan pays on the claim is released only once no premium period covering the day the failure
    happened stands unpaid on the plan.
    The covered bill is the labour, the parts and the attendance charges booked against the job on the covered item
    inside the window read, each met at the share the plan carries. The window read is the last twelve months. The
    parts met are the most recent parts entry booked on the job, whenever it was booked. The plan meets seventy-five
    percent of the parts
    booked, ninety percent of the labour booked and none of the attendance charges booked. The covered bill is the
    labour met, the parts met and the attendance met added together and taken to the cent. The ceiling on the
    settlement is the plan's per-claim limit or the cover left on the plan, whichever is the lower. The amount the plan
    pays is the covered bill or that ceiling, whichever is the lower, and is then cut back to the room the plan's
    aggregate cap leaves for the rolling twelve months, taken to the cent.
    The attendance charges are the trip charge, the after hours surcharge and the mileage beyond the covered radius
    booked on that job; a no-show fee, a reschedule fee, a cancellation fee, a haul-away fee and a diagnostic fee are
    not attendance charges and the plan meets none of them under this head.
    The cover left on the plan is the cover credited to it, together with any cover put back at an anniversary, less
    the payouts already booked against it. The room the plan's aggregate cap leaves is that cap less the payouts
    booked on the plan in the rolling twelve months ending on the day of settlement, and never below nothing; the
    cut-back to that room is made after the per-claim limit and the cover left, and never before them.
    The window read is the last three months where a diagnosis stands recorded on the job for the covered item inside
    the last twelve months and the plan is one whose claims are worked ahead of the ordinary queue; it is the last six
    months where such a diagnosis stands recorded and the plan is not one whose claims are worked ahead of the
    ordinary queue; and for every other plan the window read is the last twelve months.
    The parts met are every parts entry booked on the job inside the window read where two or more parts entries
    stand on the job in that window and the diagnosis most recently recorded on the job names a board-level failure;
    they are the largest single parts entry booked on the job, whenever it was booked, where two or more parts entries
    stand on the job in that window and the diagnosis most recently recorded names something other than a board-level
    failure; and for every other job the parts met are the most recent parts entry booked on the job, whenever it was
    booked.
    The plan meets the whole of the parts booked where no repair stands authorised on the covered item and at least
    one parts entry stands in the window read; it meets ninety percent of them where at least one repair stands
    authorised on the item and the repairs authorised are no more than the plan's repair attempts figure; and for every
    other item it meets seventy-five percent of the parts booked.
    The plan meets the whole of the attendance charges booked where the plan carries attendance at the address and no
    included visit stands drawn on the job inside the last twelve months; it meets sixty percent of them where the
    plan carries attendance at the address and an included visit stands drawn on the job inside that time; and for
    every other plan it meets none of the attendance charges booked.
    The plan meets the whole of the labour booked where the covered item has run less than a third of the plan's term
    since it was bought; it meets ninety-five percent of the labour booked where the item has run less than two
    thirds of that term; and for every other item it meets ninety percent of the labour booked.
    The plan meets nothing of a job the repairer has booked as work the manufacturer's warranty on the covered item
    was still running to meet, and the entries the plan meets are read from the repairer's own ledger on that job.
    The payment is made to the party the decision on the claim named to carry out the work, against the authorisation
    number that decision issued for it.
  prerequisite:
  - problem: protection_ext_premium_arrears_settlement
    kind: state_gate
    gate: protection_events.premium_amount
    form: state
    policy_source: The amount the plan pays on the claim is released only once no premium period covering the day the failure happened stands unpaid on the plan.
    condition: the plan's premium history shows the period whose span covers the incident day settled, so nothing stands unpaid for that period
    resolved_by: settle_premium_arrears_c5640f60
    effect: once the premium standing owed is settled, the period covering the day the failure happened no longer stands unpaid and the payout may be released
  cross_category:
  - category: service
    as: history
    reads: [service_events.charge_amount, service_events.event_type, service_events.diagnostic_code]
    note: the window read, the parts met and the whole covered bill are taken from the labour, parts, attendance and diagnosis entries the repairer has booked on the TechWorks job for the covered item.
  compute:
  - covered_item_job: "CFIELD('service','service_agreement_id', item_serial=F('covered_item_serial'))"
  - warranty_job: "CFIELD('service','warranty_work_flag', item_serial=F('covered_item_serial'))"
  - diagnoses_recorded: "XCOUNT('service','service_events', within_months=12, event_type='service_diagnostic_record', service_agreement_id=covered_item_job)"
  - priority_handling: "P('priority_claim_handling')"
  - bill_window_months: "K('bill_window_priority_months') if (diagnoses_recorded >= 1 and priority_handling == True) else (K('bill_window_diagnosed_months') if (diagnoses_recorded >= 1 and priority_handling != True) else K('bill_window_standard_months'))"
  - labour_billed: "XSUM('service','service_events','charge_amount', within_months=bill_window_months, event_type='service_labour_charge', service_agreement_id=covered_item_job)"
  - parts_entries: "XCOUNT('service','service_events', within_months=bill_window_months, event_type='service_parts_charge', service_agreement_id=covered_item_job)"
  - largest_part: "XMAX('service','service_events','charge_amount', event_type='service_parts_charge', service_agreement_id=covered_item_job)"
  - latest_part: "XLATEST('service','service_events','charge_amount', event_type='service_parts_charge', service_agreement_id=covered_item_job)"
  - latest_diagnosis: "XLATEST('service','service_events','diagnostic_code', event_type='service_diagnostic_record', service_agreement_id=covered_item_job)"
  - parts_base: "XSUM('service','service_events','charge_amount', within_months=bill_window_months, event_type='service_parts_charge', service_agreement_id=covered_item_job) if (parts_entries >= 2 and latest_diagnosis == 'board_level_failure') else (largest_part if (parts_entries >= 2 and latest_diagnosis != 'board_level_failure') else float(latest_part or 0))"
  - repairs_authorised: "COUNT('protection_events', event_type='protection_claim_decision', settlement_basis='repair')"
  - parts_share_pct: "K('parts_share_full_pct') if (repairs_authorised <= 0 and parts_entries >= 1) else (K('parts_share_standard_pct') if (repairs_authorised >= 1 and repairs_authorised <= P('max_repair_attempts_before_replacement')) else K('parts_share_worn_pct'))"
  - visits_drawn: "XCOUNT('service','service_events', within_months=12, event_type='service_visit_consume', service_agreement_id=covered_item_job)"
  - onsite_included: "P('on_site_service_included')"
  - attendance_billed: "RND(XSUM('service','service_events','charge_amount', within_months=bill_window_months, event_type='service_fee_charge', charge_kind='trip_charge', service_agreement_id=covered_item_job) + XSUM('service','service_events','charge_amount', within_months=bill_window_months, event_type='service_fee_charge', charge_kind='after_hours_surcharge', service_agreement_id=covered_item_job) + XSUM('service','service_events','charge_amount', within_months=bill_window_months, event_type='service_fee_charge', charge_kind='out_of_radius_fee', service_agreement_id=covered_item_job), 2)"
  - attendance_share_pct: "K('attendance_share_full_pct') if (onsite_included == True and visits_drawn <= 0) else (K('attendance_share_part_pct') if (onsite_included == True and visits_drawn >= 1) else 0)"
  - item_age_months: "MONTHS(F('covered_item_purchase_date'), NOW)"
  - labour_share_pct: "K('labour_share_full_pct') if (item_age_months * 3 < P('plan_term_months')) else (K('labour_share_mid_pct') if (item_age_months * 3 < P('plan_term_months') * 2) else K('labour_share_aged_pct'))"
  - coverage_credited: "SUM('protection_events','coverage_amount', event_type='protection_coverage_grant') + SUM('protection_events','coverage_amount', event_type='protection_coverage_reinstate')"
  - payouts_booked: "SUM('protection_events','payout_amount', event_type='protection_claim_payout')"
  - cover_left: "RND(coverage_credited - payouts_booked, 2)"
  - warranty_exclusion: "0 if (warranty_job == True) else 1"
  - covered_bill: "RND((labour_billed * labour_share_pct / 100 + parts_base * parts_share_pct / 100 + attendance_billed * attendance_share_pct / 100) * warranty_exclusion, 2)"
  - claim_ceiling: "MN(P('per_claim_limit_usd'), cover_left)"
  - payouts_rolling_12m: "SUM('protection_events','payout_amount', within_months=12, event_type='protection_claim_payout')"
  - cap_room: "MX(0.0, RND(P('aggregate_payout_cap_per_12m_usd') - payouts_rolling_12m, 2))"
  - result: "RND(MN(MN(covered_bill, claim_ceiling), cap_room), 2)"
  compute_basis:
    covered_item_job: The window read is the last three months where a diagnosis stands recorded on the job for the covered item inside the last twelve months and the plan is one whose claims are worked ahead of the ordinary queue; it is the last six months where such a diagnosis stands recorded and the plan is not one whose claims are worked ahead of the ordinary queue; and for every other plan the window read is the last twelve months.
    warranty_job: The plan meets nothing of a job the repairer has booked as work the manufacturer's warranty on the covered item was still running to meet, and the entries the plan meets are read from the repairer's own ledger on that job.
    warranty_exclusion: The plan meets nothing of a job the repairer has booked as work the manufacturer's warranty on the covered item was still running to meet, and the entries the plan meets are read from the repairer's own ledger on that job.
    payouts_rolling_12m: The room the plan's aggregate cap leaves is that cap less the payouts booked on the plan in the rolling twelve months ending on the day of settlement, and never below nothing; the cut-back to that room is made after the per-claim limit and the cover left, and never before them.
    cap_room: The room the plan's aggregate cap leaves is that cap less the payouts booked on the plan in the rolling twelve months ending on the day of settlement, and never below nothing; the cut-back to that room is made after the per-claim limit and the cover left, and never before them.
    diagnoses_recorded: The window read is the last three months where a diagnosis stands recorded on the job for the covered item inside the last twelve months and the plan is one whose claims are worked ahead of the ordinary queue; it is the last six months where such a diagnosis stands recorded and the plan is not one whose claims are worked ahead of the ordinary queue; and for every other plan the window read is the last twelve months.
    priority_handling: The window read is the last three months where a diagnosis stands recorded on the job for the covered item inside the last twelve months and the plan is one whose claims are worked ahead of the ordinary queue; it is the last six months where such a diagnosis stands recorded and the plan is not one whose claims are worked ahead of the ordinary queue; and for every other plan the window read is the last twelve months.
    bill_window_months: The window read is the last three months where a diagnosis stands recorded on the job for the covered item inside the last twelve months and the plan is one whose claims are worked ahead of the ordinary queue; it is the last six months where such a diagnosis stands recorded and the plan is not one whose claims are worked ahead of the ordinary queue; and for every other plan the window read is the last twelve months.
    labour_billed: The covered bill is the labour, the parts and the attendance charges booked against the job on the covered item inside the window read, each met at the share the plan carries.
    parts_entries: The parts met are every parts entry booked on the job inside the window read where two or more parts entries stand on the job in that window and the diagnosis most recently recorded on the job names a board-level failure; they are the largest single parts entry booked on the job, whenever it was booked, where two or more parts entries stand on the job in that window and the diagnosis most recently recorded names something other than a board-level failure; and for every other job the parts met are the most recent parts entry booked on the job, whenever it was booked.
    largest_part: The parts met are every parts entry booked on the job inside the window read where two or more parts entries stand on the job in that window and the diagnosis most recently recorded on the job names a board-level failure; they are the largest single parts entry booked on the job, whenever it was booked, where two or more parts entries stand on the job in that window and the diagnosis most recently recorded names something other than a board-level failure; and for every other job the parts met are the most recent parts entry booked on the job, whenever it was booked.
    latest_part: The parts met are every parts entry booked on the job inside the window read where two or more parts entries stand on the job in that window and the diagnosis most recently recorded on the job names a board-level failure; they are the largest single parts entry booked on the job, whenever it was booked, where two or more parts entries stand on the job in that window and the diagnosis most recently recorded names something other than a board-level failure; and for every other job the parts met are the most recent parts entry booked on the job, whenever it was booked.
    latest_diagnosis: The parts met are every parts entry booked on the job inside the window read where two or more parts entries stand on the job in that window and the diagnosis most recently recorded on the job names a board-level failure; they are the largest single parts entry booked on the job, whenever it was booked, where two or more parts entries stand on the job in that window and the diagnosis most recently recorded names something other than a board-level failure; and for every other job the parts met are the most recent parts entry booked on the job, whenever it was booked.
    parts_base: The parts met are every parts entry booked on the job inside the window read where two or more parts entries stand on the job in that window and the diagnosis most recently recorded on the job names a board-level failure; they are the largest single parts entry booked on the job, whenever it was booked, where two or more parts entries stand on the job in that window and the diagnosis most recently recorded names something other than a board-level failure; and for every other job the parts met are the most recent parts entry booked on the job, whenever it was booked.
    repairs_authorised: The plan meets the whole of the parts booked where no repair stands authorised on the covered item and at least one parts entry stands in the window read; it meets ninety percent of them where at least one repair stands authorised on the item and the repairs authorised are no more than the plan's repair attempts figure; and for every other item it meets seventy-five percent of the parts booked.
    parts_share_pct: The plan meets the whole of the parts booked where no repair stands authorised on the covered item and at least one parts entry stands in the window read; it meets ninety percent of them where at least one repair stands authorised on the item and the repairs authorised are no more than the plan's repair attempts figure; and for every other item it meets seventy-five percent of the parts booked.
    visits_drawn: The plan meets the whole of the attendance charges booked where the plan carries attendance at the address and no included visit stands drawn on the job inside the last twelve months; it meets sixty percent of them where the plan carries attendance at the address and an included visit stands drawn on the job inside that time; and for every other plan it meets none of the attendance charges booked.
    onsite_included: The plan meets the whole of the attendance charges booked where the plan carries attendance at the address and no included visit stands drawn on the job inside the last twelve months; it meets sixty percent of them where the plan carries attendance at the address and an included visit stands drawn on the job inside that time; and for every other plan it meets none of the attendance charges booked.
    attendance_billed: The attendance charges are the trip charge, the after hours surcharge and the mileage beyond the covered radius booked on that job; a no-show fee, a reschedule fee, a cancellation fee, a haul-away fee and a diagnostic fee are not attendance charges and the plan meets none of them under this head.
    attendance_share_pct: The plan meets the whole of the attendance charges booked where the plan carries attendance at the address and no included visit stands drawn on the job inside the last twelve months; it meets sixty percent of them where the plan carries attendance at the address and an included visit stands drawn on the job inside that time; and for every other plan it meets none of the attendance charges booked.
    item_age_months: The plan meets the whole of the labour booked where the covered item has run less than a third of the plan's term since it was bought; it meets ninety-five percent of the labour booked where the item has run less than two thirds of that term; and for every other item it meets ninety percent of the labour booked.
    labour_share_pct: The plan meets the whole of the labour booked where the covered item has run less than a third of the plan's term since it was bought; it meets ninety-five percent of the labour booked where the item has run less than two thirds of that term; and for every other item it meets ninety percent of the labour booked.
    coverage_credited: The cover left on the plan is the cover credited to it, together with any cover put back at an anniversary, less the payouts already booked against it.
    payouts_booked: The cover left on the plan is the cover credited to it, together with any cover put back at an anniversary, less the payouts already booked against it.
    cover_left: The cover left on the plan is the cover credited to it, together with any cover put back at an anniversary, less the payouts already booked against it.
    covered_bill: The covered bill is the labour met, the parts met and the attendance met added together and taken to the cent.
    claim_ceiling: The ceiling on the settlement is the plan's per-claim limit or the cover left on the plan, whichever is the lower.
    result: The amount the plan pays is the covered bill or that ceiling, whichever is the lower, and is then cut back to the room the plan's aggregate cap leaves for the rolling twelve months, taken to the cent.
  factors:
  - id: repairer_bill_window
    effect: method
    decides: bill_window_months
    bindings: [diagnoses_recorded, priority_handling, bill_window_months]
    ladder:
    - when: a diagnosis stands recorded on the job for the covered item inside the last twelve months and the plan is one whose claims are worked ahead of the ordinary queue
      method: the entries booked in the last three months are read
    - when: such a diagnosis stands recorded and the plan is not one whose claims are worked ahead of the ordinary queue
      method: the entries booked in the last six months are read
    - when: otherwise
      method: the entries booked in the last twelve months are read
