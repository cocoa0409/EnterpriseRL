- id: protection_ext_premium_arrears_settlement
  base_policy_refs: [protection_premium_billing, protection_premium_delinquency, protection_combo_membership_interaction]
  overwrite: []
  trigger: on_request
  subject: [protection_premium_payment]
  computes: settlement_amount
  target_tool: settle_premium_arrears_c5640f60
  params:
    fee_share_full_pct: 100
    fee_share_part_pct: 50
    advance_periods_clear_run: 2
    advance_periods_standard: 1
  rule: >
    Where the customer asks to bring the premium on a plan back into order, what they settle covers the arrears
    standing on the plan, the share charged of the fees standing on it and any period taken ahead of the arrears.
    The amount the customer settles is fixed only after every fee owed for a period that has run past grace stands
    billed on the plan.
    The arrears standing on the plan is the outstanding premium recorded on it. No fee standing on the plan is taken
    with the settlement, and no share of those fees is charged to it. No period ahead of the arrears is taken with the
    settlement, and no discount is allowed on a period taken ahead. The amount the customer settles is the arrears
    standing on the plan, together with the share charged of the fees taken from it and the periods taken ahead
    priced at the plan's monthly premium less the discount allowed on them, taken to the cent and never below nothing.
    The arrears standing on the plan is rebuilt from the premium entries booked on the plan, as the premium
    instalments billed less the premium payments received, where the premium entries booked on the plan add up to
    more than the outstanding premium recorded on it and the plan stands active; it is the periods whose grace has
    fully run, priced at the plan's monthly premium, where the plan stands active and those entries add up to no more
    than the outstanding premium recorded on it; and for every other plan it is the outstanding premium recorded on
    it. The periods whose grace has fully run are the unpaid periods less the most recent period billed where that
    period is still inside the plan's grace days, and never fewer than none.
    The fees taken with the settlement are the fees billed on the plan inside the last twelve months, where a fee
    stands billed on the plan inside the last twelve months and at least six premium payments stand on it in that
    time; they are the most recent fee standing on the plan, whenever it was billed, where at least six premium
    payments stand on it in the last twelve months and no fee stands billed on the plan in that time; and for every
    other plan no fee standing on the plan is taken with the settlement, and no share of those fees is charged to it.
    The share charged of the fees taken is the whole of them where the arrears covers no more than four periods and
    no more than one fee stands billed on the plan inside the last twelve months; it is half of them where no more
    than one fee stands billed on the plan inside the last twelve months and the arrears covers more than four
    periods; and for every other plan none of them is charged.
    The periods taken ahead of the arrears are two where the plan has more than two years of cover left to run and no
    claim stands decided on it inside the last three months; one where the plan has more than two years of cover left
    to run and a claim stands decided on it inside the last three months; and for every other plan no period ahead of
    the arrears is taken with the settlement, and no discount is allowed on a period taken ahead.
    The discount allowed on a period taken ahead is the protection plan discount of the Circle membership tier on the
    profile where the plan applies the membership discount, that membership stands active and its tier carries a plan
    discount of more than nothing; it is half that discount where the plan applies the membership discount, that
    membership stands in grace and its tier carries a plan discount of more than nothing; and for every other plan no
    discount is allowed on a period taken ahead.
  prerequisite:
  - problem: protection_ext_premium_late_fee_scale
    kind: value_input
    gate: fees_taken
    form: state
    policy_source: The amount the customer settles is fixed only after every fee owed for a period that has run past grace stands billed on the plan.
    condition: the plan's premium history carries a fee entry billed for the periods whose grace has run, so that the fees standing on the plan inside the last twelve months are more than nothing
    resolved_by: bill_premium_late_fee_5ae6a6af
    effect: once the fee owed for the periods past grace stands billed, the fees standing on the plan inside the last twelve months carry that amount and the fees taken with the settlement rise from nothing to it
  cross_category:
  - category: membership
    as: branch
    reads: [variant_name, status]
    note: the discount allowed on a period taken ahead is decided from the plan discount the profile's Circle membership tier carries and from whether that membership stands active or in grace.
  compute:
  - instalments_billed: "SUM('protection_events','premium_amount', event_type='protection_premium_charge', premium_kind='monthly_instalment')"
  - instalments_paid: "SUM('protection_events','premium_amount', event_type='protection_premium_payment')"
  - ledger_arrears: "RND(instalments_billed - instalments_paid, 2)"
  - newest_period_start: "LATEST('protection_events','period_start', event_type='protection_premium_charge', premium_kind='monthly_instalment')"
  - days_since_newest_period: "DAYS(newest_period_start, NOW)"
  - periods_past_grace: "MX(0, int(ledger_arrears / P('monthly_premium_usd') + 0.0001) - (1 if days_since_newest_period <= P('premium_grace_days') else 0))"
  - recorded_arrears: "F('premium_outstanding')"
  - charges_all: "SUM('protection_events','premium_amount', event_type='protection_premium_charge')"
  - arrears_measure: "ledger_arrears if (charges_all - instalments_paid > recorded_arrears and F('status') == 'active') else (RND(periods_past_grace * P('monthly_premium_usd'), 2) if (F('status') == 'active' and charges_all - instalments_paid <= recorded_arrears) else recorded_arrears)"
  - fees_in_year: "SUM('protection_events','premium_amount', within_months=12, event_type='protection_premium_charge', premium_kind='late_fee')"
  - latest_fee_amount: "LATEST('protection_events','premium_amount', event_type='protection_premium_charge', premium_kind='late_fee')"
  - payments_12m: "COUNT('protection_events', within_months=12, event_type='protection_premium_payment')"
  - fees_taken: "fees_in_year if (fees_in_year > 0 and payments_12m >= 6) else (float(latest_fee_amount or 0) if (payments_12m >= 6 and fees_in_year <= 0) else 0.0)"
  - unpaid_periods_count: "int(ledger_arrears / P('monthly_premium_usd') + 0.0001)"
  - fee_count_12m: "COUNT('protection_events', within_months=12, event_type='protection_premium_charge', premium_kind='late_fee')"
  - fee_share_pct: "K('fee_share_full_pct') if (unpaid_periods_count <= 4 and fee_count_12m <= 1) else (K('fee_share_part_pct') if (fee_count_12m <= 1 and unpaid_periods_count > 4) else 0)"
  - fees_component: "RND(fees_taken * fee_share_pct / 100, 2)"
  - decisions_3m: "COUNT('protection_events', within_months=3, event_type='protection_claim_decision')"
  - months_of_cover_left: "MONTHS(NOW, F('coverage_end_date'))"
  - advance_periods: "K('advance_periods_clear_run') if (months_of_cover_left > 24 and decisions_3m <= 0) else (K('advance_periods_standard') if (months_of_cover_left > 24 and decisions_3m >= 1) else 0)"
  - member_plan_discount: "CPARAM('membership','protection_plan_discount_pct', status='active')"
  - member_grace_discount: "CPARAM('membership','protection_plan_discount_pct', status='grace')"
  - advance_discount_pct: "(member_plan_discount or 0) if (P('membership_discount_applies') == True and EXISTS('membership', status='active') and (member_plan_discount or 0) > 0) else (RND((member_grace_discount or 0) / 2, 2) if (P('membership_discount_applies') == True and EXISTS('membership', status='grace') and (member_grace_discount or 0) > 0) else 0)"
  - advance_component: "RND(advance_periods * P('monthly_premium_usd') * (100 - advance_discount_pct) / 100, 2)"
  - result: "MX(0.0, RND(arrears_measure + fees_component + advance_component, 2))"
  compute_basis:
    instalments_billed: The arrears standing on the plan is rebuilt from the premium entries booked on the plan, as the premium instalments billed less the premium payments received, where the premium entries booked on the plan add up to more than the outstanding premium recorded on it and the plan stands active; it is the periods whose grace has fully run, priced at the plan's monthly premium, where the plan stands active and those entries add up to no more than the outstanding premium recorded on it; and for every other plan it is the outstanding premium recorded on it.
