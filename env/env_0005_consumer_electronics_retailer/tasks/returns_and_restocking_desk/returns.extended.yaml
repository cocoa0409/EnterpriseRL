  compute:
  - schedule_notice_days: P('pickup_lead_days')
  - crew_lead_days: CPARAM('orders','delivery_lead_days_min', item_serial=F('item_serial')) or 0
  - crew_notice_days: K('freight_crew_notice_days') if crew_lead_days >= K('freight_crew_lead_days') else (K('two_person_crew_notice_days') if crew_lead_days >= K('crew_lead_threshold_days') else schedule_notice_days)
  - connection_included: CPARAM('orders','appliance_connection_included', item_serial=F('item_serial')) or False
  - disconnection_included: CPARAM('orders','old_item_disconnection_included', item_serial=F('item_serial')) or False
  - site_extra_days: K('plumbed_site_days') if (connection_included and disconnection_included) else (K('disconnect_site_days') if (disconnection_included and not connection_included) else 0)
  - member_extension_days: CPARAM('membership','return_window_extension_days', status='active') or 0
  - member_dues_due: CFIELD('membership','dues_outstanding', status='active') or 0
  - priority_reduction_days: K('top_member_priority_days') if (member_extension_days >= K('top_member_extension_days') and member_dues_due <= 0) else (K('paid_member_priority_days') if (member_extension_days
      >= K('paid_member_extension_days') and member_dues_due <= 0) else 0)
  - notice_before_priority: MX(0, crew_notice_days + site_extra_days - priority_reduction_days)
  - freight_collection_charge: P('freight_collection_fee_usd')
  - days_since_requested: DAYS(F('requested_date'), NOW)
  - counted_notice_days: int((notice_before_priority * 7 + 4) / 5) if (freight_collection_charge > 0 and days_since_requested > schedule_notice_days) else (notice_before_priority + 1 if (freight_collection_charge
      > 0 and days_since_requested <= schedule_notice_days) else notice_before_priority)
  - standing_days: DAYS(F('authorized_date'), NOW)
  - bookings_on_file: COUNT('return_events', event_type='returns_shipping_label_issue')
  - offered_notice_days: int(counted_notice_days * 0.5) if (standing_days > K('waiting_notice_multiple') * schedule_notice_days and bookings_on_file >= K('earlier_booking_count')) else (int(counted_notice_days
      * 0.75) if (standing_days > K('waiting_notice_multiple') * schedule_notice_days and bookings_on_file < K('earlier_booking_count')) else counted_notice_days)
  - booking_recorded_day: LATEST('return_events','event_date', event_type='returns_shipping_label_issue')
  - days_since_booking: DAYS(booking_recorded_day, NOW) if booking_recorded_day else 0
  - result: MX(K('same_day_floor_days'), offered_notice_days - days_since_booking)
  compute_basis:
    schedule_notice_days: The earliest day a collection may be booked for is the schedule's collection lead days of notice, counted in calendar days from the day the collection booking now standing on the
      return was recorded, the day it was recorded counted as day zero and the days that have already passed since then taken off, and the notice is never fewer than the floor this desk keeps for a collection
      agreed with a customer in person.
    crew_lead_days: Where the service the item was delivered on offers no slot inside the freight crew lead days, the freight crew notice days are the notice.
    crew_notice_days: The crew notice is fixed as follows. Where the service the item was delivered on offers no slot inside the freight crew lead days, the freight crew notice days are the notice. Where
      that service offers no slot inside the crew lead threshold days but does offer one inside the freight crew lead days, the two person crew notice days are the notice. Where that service offers a slot
      inside the crew lead threshold days, the schedule's collection lead days are the notice.
    connection_included: Where the service the item was delivered on makes the water, waste or gas connections and takes the old item away, the plumbed site days are added.
    disconnection_included: Where that service takes the old item away but makes no connections, the disconnect site days are added.
    site_extra_days: Site preparation days are then added. Where the service the item was delivered on makes the water, waste or gas connections and takes the old item away, the plumbed site days are added.
      Where that service takes the old item away but makes no connections, the disconnect site days are added. Where neither holds, nothing is added.
    member_extension_days: Where the membership standing on the profile is active, the tier it stands on adds at least the top member extension days to the published return window, and its dues carry nothing
      outstanding, the top member priority days are taken off.
    member_dues_due: Where the membership standing on the profile is active, the tier it stands on adds at least the paid member extension days to the published return window, and its dues carry nothing
      outstanding, the paid member priority days are taken off.
    priority_reduction_days: Membership priority days are then taken off. Where the membership standing on the profile is active, the tier it stands on adds at least the top member extension days to the
      published return window, and its dues carry nothing outstanding, the top member priority days are taken off. Where the membership standing on the profile is active, the tier it stands on adds at least
      the paid member extension days to the published return window, and its dues carry nothing outstanding, the paid member priority days are taken off. Where neither holds, nothing is taken off.
    notice_before_priority: What these three steps leave is never less than nothing.
    freight_collection_charge: Where the schedule charges no freight collection fee, the notice is counted in calendar days as it stands.
    days_since_requested: Where the schedule charges a freight collection fee and the return has been standing since the day it was asked for longer than the schedule's collection lead days, the notice
      is counted in days the depot is open, five in every seven, and rounded up to a whole day.
    counted_notice_days: The notice so far is then counted under the convention the schedule keeps. Where the schedule charges a freight collection fee and the return has been standing since the day it
      was asked for longer than the schedule's collection lead days, the notice is counted in days the depot is open, five in every seven, and rounded up to a whole day. Where the schedule charges a freight
      collection fee and the return has been standing since the day it was asked for no longer than the schedule's collection lead days, the day the booking was recorded is not counted and one further day
      is needed. Where the schedule charges no freight collection fee, the notice is counted in calendar days as it stands.
    standing_days: The waiting the return has already done is then measured against the notice so counted.
    bookings_on_file: Where the return has been standing authorised for longer than the waiting notice multiple of the schedule's collection lead days and two or more collection bookings stand on it, the
      notice is halved and rounded down to a whole day.
    offered_notice_days: Where the return has been standing authorised for longer than the waiting notice multiple of the schedule's collection lead days and two or more collection bookings stand on it,
      the notice is halved and rounded down to a whole day. Where the return has been standing authorised for longer than that multiple of the schedule's collection lead days and fewer than two collection
      bookings stand on it, a quarter is taken off the notice and the result is rounded down to a whole day. Where the return has been standing authorised for no longer than that multiple of the schedule's
      collection lead days, the notice stands as counted.
    booking_recorded_day: The earliest day the collection may be booked for is settled only after a collection booking naming the carrier that is to move the item stands recorded against the return with
      a last usable day that has not passed.
    days_since_booking: The earliest day a collection may be booked for is the schedule's collection lead days of notice, counted in calendar days from the day the collection booking now standing on the
      return was recorded, the day it was recorded counted as day zero and the days that have already passed since then taken off, and the notice is never fewer than the floor this desk keeps for a collection
      agreed with a customer in person.
    result: The earliest day a collection may be booked for is the schedule's collection lead days of notice, counted in calendar days from the day the collection booking now standing on the return was
      recorded, the day it was recorded counted as day zero and the days that have already passed since then taken off, and the notice is never fewer than the floor this desk keeps for a collection agreed
      with a customer in person.
