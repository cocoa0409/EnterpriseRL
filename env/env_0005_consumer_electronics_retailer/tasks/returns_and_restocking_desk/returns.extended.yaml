- id: returns_ext_collection_slot_notice
  base_policy_refs:
  - returns_authorization_and_logistics
  overwrite:
  - base_policy: returns_authorization_and_logistics
    superseded_clause: a collection needs the schedule's lead days of notice and may be moved only as often as the schedule allows
    replaced_by: 'The notice is settled in this order: the crew notice fixes it, the site preparation days are added to it, the membership priority days are taken off what those two give, the notice so
      far is then counted under the convention the schedule keeps, the waiting the return has already done is measured against what that counting gives, and the days already passed since the booking was
      recorded are taken off last.'
  trigger: on_request
  subject:
  - returns_shipping_label_issue
  computes: pickup_notice_days
  target_tool: confirm_collection_slot_e0893723
  params:
    crew_lead_threshold_days: 3
    freight_crew_lead_days: 5
    freight_crew_notice_days: 8
    two_person_crew_notice_days: 6
    plumbed_site_days: 2
    disconnect_site_days: 1
