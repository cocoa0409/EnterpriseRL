- id: returns_withdrawal
  subject:
  - returns_rma_withdraw
  rule: 'The customer may withdraw a return only before the item has been received, and a withdrawal is recorded only against a collection request the customer has cancelled or an authorisation not yet
    booked in. Where the item is already with the carrier the retailer sends it back out and the schedule''s reshipment fee is charged; where it has not left the customer nothing is charged. A withdrawn
    authorisation closes the line: the window is not extended by the time the authorisation was open, and a customer who changes their mind again raises a fresh return inside whatever window is left. A
    withdrawal does not count toward the profile''s return history, because nothing came back. An authorisation the customer has stopped answering about is not withdrawn by the retailer; it is left open
    until the label expires and then refused.'
