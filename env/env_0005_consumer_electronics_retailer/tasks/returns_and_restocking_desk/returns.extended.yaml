    same_day_floor_days: 1
  rule: 'The earliest day a collection may be booked for is the schedule''s collection lead days of notice, counted in calendar days from the day the collection booking now standing on the return was recorded,
    the day it was recorded counted as day zero and the days that have already passed since then taken off, and the notice is never fewer than the floor this desk keeps for a collection agreed with a customer
    in person. The earliest day the collection may be booked for is settled only after a collection booking naming the carrier that is to move the item stands recorded against the return with a last usable
    day that has not passed. The notice is settled in this order: the crew notice fixes it, the site preparation days are added to it, the membership priority days are taken off what those two give, the
    notice so far is then counted under the convention the schedule keeps, the waiting the return has already done is measured against what that counting gives, and the days already passed since the booking
    was recorded are taken off last. The crew notice is fixed as follows. Where the service the item was delivered on offers no slot inside the freight crew lead days, the freight crew notice days are the
    notice. Where that service offers no slot inside the crew lead threshold days but does offer one inside the freight crew lead days, the two person crew notice days are the notice. Where that service
    offers a slot inside the crew lead threshold days, the schedule''s collection lead days are the notice. Site preparation days are then added. Where the service the item was delivered on makes the water,
    waste or gas connections and takes the old item away, the plumbed site days are added. Where that service takes the old item away but makes no connections, the disconnect site days are added. Where
    neither holds, nothing is added. Membership priority days are then taken off. Where the membership standing on the profile is active, the tier it stands on adds at least the top member extension days
    to the published return window, and its dues carry nothing outstanding, the top member priority days are taken off. Where the membership standing on the profile is active, the tier it stands on adds
    at least the paid member extension days to the published return window, and its dues carry nothing outstanding, the paid member priority days are taken off. Where neither holds, nothing is taken off.
    What these three steps leave is never less than nothing. The notice so far is then counted under the convention the schedule keeps. Where the schedule charges a freight collection fee and the return
    has been standing since the day it was asked for longer than the schedule''s collection lead days, the notice is counted in days the depot is open, five in every seven, and rounded up to a whole day.
    Where the schedule charges a freight collection fee and the return has been standing since the day it was asked for no longer than the schedule''s collection lead days, the day the booking was recorded
    is not counted and one further day is needed. Where the schedule charges no freight collection fee, the notice is counted in calendar days as it stands. The waiting the return has already done is then
    measured against the notice so counted. Where the return has been standing authorised for longer than the waiting notice multiple of the schedule''s collection lead days and two or more collection bookings
    stand on it, the notice is halved and rounded down to a whole day. Where the return has been standing authorised for longer than that multiple of the schedule''s collection lead days and fewer than
    two collection bookings stand on it, a quarter is taken off the notice and the result is rounded down to a whole day. Where the return has been standing authorised for no longer than that multiple of
    the schedule''s collection lead days, the notice stands as counted. The part of the day recorded on the collection is the one the customer agrees to when the slot is put to them, and no part of the
    day is recorded that the customer has not agreed to.'
