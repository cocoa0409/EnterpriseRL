- id: returns_restocking_fee
  subject:
  - returns_restocking_fee_charge
  - returns_restocking_fee_waive
  rule: The restocking fee is the schedule's percentage of the line price, then raised to the schedule's minimum and cut to the schedule's cap, and rounded to the cent. A restocking fee is charged or waived
    only while the authorisation stands inspected or settled. No restocking fee is charged where the item is graded defective on arrival or not as described, or where the retailer shipped the wrong item,
    because the fee pays for putting saleable stock back. A device already activated on a network carries the schedule's flat activated device fee instead of a percentage fee, and the two are never charged
    together. Where the schedule waives the fee for a Circle member the waiver is recorded with the membership as its reason, and the member's tier waiver percentage is applied to whatever fee is left where
    the schedule does not waive it outright. A fee waived as goodwill is recorded as goodwill and does not change what the schedule charges the next time.
  eligibility:
  - id: feeable_rma_state
