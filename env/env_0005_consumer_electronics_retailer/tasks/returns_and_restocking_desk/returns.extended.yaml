  rule: 'An exchange is offered only on the schedules that allow it and only inside the schedule''s exchange window, counted from the same anchor as the return window. A price difference is settled as the
    schedule''s difference basis names: where today''s shelf price is higher the customer pays the difference, where it is lower the difference is returned by the refund method, and on a like-for-like schedule
    no difference is settled at all. An exchange item is issued only once the returned item has been received and graded at a grade the schedule refunds in full; a customer who wants an exchange on a customer-damaged
    item is offered the reduced refund instead. Where the exchange is delivered and the schedule takes the old item away, the haul-away is booked with the delivery and is not charged. A protection plan
