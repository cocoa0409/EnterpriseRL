extended_policies:
- id: returns_ext_collection_booking_window
  base_policy_refs:
  - returns_authorization_and_logistics
  overwrite:
  - base_policy: returns_authorization_and_logistics
    superseded_clause: A prepaid label stays usable for the schedule's label validity days from the day it is issued, and an expired label is reissued once without a fee
    replaced_by: 'The days the booking is held open are settled in four steps and in this order: the route the item must travel back on fixes the window, the reissue reduction is taken off that window,
      the resulting window is then measured against how long the return has been standing, and the membership allowance is added last to what that measurement leaves.'
  trigger: on_request
  subject:
  - returns_shipping_label_issue
  computes: booking_open_days
  target_tool: issue_collection_booking_70222685
  params:
    crew_lead_threshold_days: 3
    freight_slot_days: 7
    van_slot_days: 3
    first_reissue_reduction_days: 3
    second_reissue_reduction_days: 6
    aged_window_multiple: 2
    top_member_extension_days: 45
    paid_member_extension_days: 15
    top_member_hold_days: 4
    paid_member_hold_days: 2
    floor_open_days: 2
  rule: 'A collection booking stays usable for the schedule''s label validity days, counted in calendar days from the day it is issued, so that the last day it may be used is that many days after the day
    of issue. The days a booking stays open are never fewer than the floor this desk keeps for a booking of any kind. The days the booking is held open are settled in four steps and in this order: the route
    the item must travel back on fixes the window, the reissue reduction is taken off that window, the resulting window is then measured against how long the return has been standing, and the membership
    allowance is added last to what that measurement leaves. The route the item must travel back on fixes the window as follows. Where the service the item was delivered on offers no slot inside the crew
    lead threshold days and the schedule charges a freight collection fee, the window is the schedule''s label validity days plus the freight slot days. Where that service offers no slot inside the crew
    lead threshold days and the schedule charges no freight collection fee, the window is the schedule''s label validity days plus the van slot days. Where that service offers a slot inside the crew lead
    threshold days, the window is the schedule''s label validity days. A reduction is then taken off that window for collection bookings already standing on the same return. Where two or more collection
    bookings already stand on the return, the second reissue reduction days are taken off. Where exactly one collection booking stands on the return and its last usable day has already passed, the first
    reissue reduction days are taken off. Where neither holds, nothing is taken off, and the window after the reduction is never less than nothing. How long the return has already been standing decides
    how the window left after that reduction is measured. Where the return has been standing authorised for longer than the aged window multiple of the schedule''s label validity days, that window is halved
    and rounded down to a whole day. Where the return has been standing authorised for longer than the schedule''s label validity days but not longer than that multiple of them, a quarter is taken off that
    window and the result is rounded down to a whole day. Where the return has been standing authorised for no longer than the schedule''s label validity days, that window is taken as counted. The membership
    allowance is added last. Where the membership standing on the profile is active, the tier it stands on adds at least the top member extension days to the published return window, and its dues carry
    nothing outstanding, the top member hold days are added. Where the membership standing on the profile is active, the tier it stands on adds at least the paid member extension days to the published return
    window, and its dues carry nothing outstanding, the paid member hold days are added. Where neither holds, nothing is added. The carrier recorded on the booking is the one that is to move the item: a
    return the schedule charges a freight collection fee for is moved by regional freight, a collection from the customer''s address on a schedule that charges no freight collection fee is moved by the
    retailer''s own van, an item travelling back through the parcel network on a label is moved by national parcel, and an item the customer brings to a store counter is recorded as delivered by the customer.'
  prerequisite: []
  cross_category:
  - category: orders
    as: branch
    reads:
    - variant_name
    - delivery_lead_days_min
    note: The lead the fulfilment service that delivered the item needs decides the tier of the collection route factor.
  - category: membership
    as: branch
    reads:
    - status
    - dues_outstanding
    - return_window_extension_days
    note: The tier the membership stands on and whether its dues are settled decide the tier of the membership hold factor.
  compute:
  - schedule_open_days: P('label_validity_days')
  - crew_lead_days: CPARAM('orders','delivery_lead_days_min', item_serial=F('item_serial')) or 0
  - freight_collection_charge: P('freight_collection_fee_usd')
  - route_open_days: schedule_open_days + K('freight_slot_days') if (crew_lead_days >= K('crew_lead_threshold_days') and freight_collection_charge > 0) else (schedule_open_days + K('van_slot_days') if (crew_lead_days
      >= K('crew_lead_threshold_days') and freight_collection_charge <= 0) else schedule_open_days)
  - bookings_on_file: COUNT('return_events', event_type='returns_shipping_label_issue')
  - last_booking_last_day: LATEST('return_events','label_expiry_date', event_type='returns_shipping_label_issue')
  - reissue_reduction_days: K('second_reissue_reduction_days') if bookings_on_file >= 2 else (K('first_reissue_reduction_days') if (bookings_on_file == 1 and last_booking_last_day < NOW) else 0)
  - window_after_reissue: MX(0, route_open_days - reissue_reduction_days)
  - standing_days: DAYS(F('authorized_date'), NOW)
  - aged_open_days: int(window_after_reissue * 0.5) if standing_days > K('aged_window_multiple') * schedule_open_days else (int(window_after_reissue * 0.75) if standing_days > schedule_open_days else window_after_reissue)
  - member_extension_days: CPARAM('membership','return_window_extension_days', status='active') or 0
  - member_dues_due: CFIELD('membership','dues_outstanding', status='active') or 0
  - member_extra_days: K('top_member_hold_days') if (member_extension_days >= K('top_member_extension_days') and member_dues_due <= 0) else (K('paid_member_hold_days') if (member_extension_days >= K('paid_member_extension_days')
      and member_dues_due <= 0) else 0)
  - result: MX(K('floor_open_days'), aged_open_days + member_extra_days)
  compute_basis:
    schedule_open_days: A collection booking stays usable for the schedule's label validity days, counted in calendar days from the day it is issued, so that the last day it may be used is that many days
      after the day of issue.
    crew_lead_days: Where the service the item was delivered on offers no slot inside the crew lead threshold days and the schedule charges a freight collection fee, the window is the schedule's label validity
      days plus the freight slot days.
    freight_collection_charge: Where that service offers no slot inside the crew lead threshold days and the schedule charges no freight collection fee, the window is the schedule's label validity days
      plus the van slot days.
    route_open_days: The route the item must travel back on fixes the window as follows. Where the service the item was delivered on offers no slot inside the crew lead threshold days and the schedule charges
      a freight collection fee, the window is the schedule's label validity days plus the freight slot days. Where that service offers no slot inside the crew lead threshold days and the schedule charges
      no freight collection fee, the window is the schedule's label validity days plus the van slot days. Where that service offers a slot inside the crew lead threshold days, the window is the schedule's
      label validity days.
    bookings_on_file: Where two or more collection bookings already stand on the return, the second reissue reduction days are taken off.
    last_booking_last_day: Where exactly one collection booking stands on the return and its last usable day has already passed, the first reissue reduction days are taken off.
    reissue_reduction_days: A reduction is then taken off that window for collection bookings already standing on the same return. Where two or more collection bookings already stand on the return, the
      second reissue reduction days are taken off. Where exactly one collection booking stands on the return and its last usable day has already passed, the first reissue reduction days are taken off. Where
      neither holds, nothing is taken off, and the window after the reduction is never less than nothing.
    window_after_reissue: Where neither holds, nothing is taken off, and the window after the reduction is never less than nothing.
    standing_days: How long the return has already been standing decides how the window left after that reduction is measured.
    aged_open_days: Where the return has been standing authorised for longer than the aged window multiple of the schedule's label validity days, that window is halved and rounded down to a whole day. Where
      the return has been standing authorised for longer than the schedule's label validity days but not longer than that multiple of them, a quarter is taken off that window and the result is rounded down
      to a whole day. Where the return has been standing authorised for no longer than the schedule's label validity days, that window is taken as counted.
    member_extension_days: Where the membership standing on the profile is active, the tier it stands on adds at least the top member extension days to the published return window, and its dues carry nothing
      outstanding, the top member hold days are added.
    member_dues_due: Where the membership standing on the profile is active, the tier it stands on adds at least the paid member extension days to the published return window, and its dues carry nothing
      outstanding, the paid member hold days are added.
    member_extra_days: The membership allowance is added last. Where the membership standing on the profile is active, the tier it stands on adds at least the top member extension days to the published
      return window, and its dues carry nothing outstanding, the top member hold days are added. Where the membership standing on the profile is active, the tier it stands on adds at least the paid member
      extension days to the published return window, and its dues carry nothing outstanding, the paid member hold days are added. Where neither holds, nothing is added.
    result: 'The days the booking is held open are settled in four steps and in this order: the route the item must travel back on fixes the window, the reissue reduction is taken off that window, the resulting
      window is then measured against how long the return has been standing, and the membership allowance is added last to what that measurement leaves. The days a booking stays open are never fewer than
      the floor this desk keeps for a booking of any kind.'
