- id: returns_ext_member_fee_relief
  base_policy_refs:
  - returns_restocking_fee
  - returns_combo_membership_protection
  overwrite:
  - base_policy: returns_restocking_fee
    superseded_clause: the member's tier waiver percentage is applied to whatever fee is left where the schedule does not waive it outright
    replaced_by: 'The share is settled in three steps and then scaled: the membership''s standing fixes the share, the year''s earning adds to it, the grade the item came back at adds to it, and the total
      share is taken on the fee still standing and then scaled by how long the membership has stood active.'
  - base_policy: returns_combo_membership_protection
    superseded_clause: the tier's restocking fee waiver percentage is applied to the fee the schedule charges
    replaced_by: The relief the membership gives against a restocking fee is the tier's published restocking fee waiver share of the fee still standing against the return, and the relief never exceeds the
      fee still standing.
  trigger: state_due
  subject:
  - returns_restocking_fee_waive
  computes: waived_fee_amount
  target_tool: waive_restocking_fee_47bbe442
  params:
    high_spend_points: 6000
    mid_spend_points: 2500
    high_spend_share_pct: 10
    mid_spend_share_pct: 5
    sealed_grade_share_pct: 15
    complete_grade_share_pct: 8
    long_member_tenure_months: 24
    member_tenure_months: 12
  rule: 'The relief the membership gives against a restocking fee is the tier''s published restocking fee waiver share of the fee still standing against the return, and the relief never exceeds the fee
    still standing. Where the schedule waives the fee for a Circle member outright, the whole fee still standing is relieved and no share is worked out. The fee still standing against the return is what
    has been charged against it less what has already been relieved, and is never less than nothing. The relief is recorded with the membership as its ground. The relief is worked out only after the restocking
    fee it relieves stands charged against the return. The share is settled in three steps and then scaled: the membership''s standing fixes the share, the year''s earning adds to it, the grade the item
    came back at adds to it, and the total share is taken on the fee still standing and then scaled by how long the membership has stood active. The membership''s standing fixes the share. Where the membership
    stands active and its dues carry nothing outstanding, the tier''s published restocking fee waiver share is the share. Where the membership stands active and part of its dues stands unpaid, half the
    tier''s published share is the share. In any other case there is no share and no relief is given. The year''s earning is then added. Where the membership stands active and the reward points it has earned
    in the last twelve months come to the high spend points or more, the high spend share is added. Where the membership stands active and those points come to the mid spend points or more but fewer than
    the high spend points, the mid spend share is added. In any other case nothing is added. The grade the item came back at is then added. Where an inspection stands on the return and the grade last recorded
    is that the item came back new and sealed, the sealed grade share is added. Where an inspection stands on the return and the grade last recorded is that it came back opened with everything in the box,
    the complete grade share is added. In any other case nothing is added. The share so totalled is taken on the fee still standing and then scaled by how long the membership has stood active. Where the
    membership has stood active for the long member tenure months or more, the relief is taken at half as much again. Where it has stood active for the member tenure months or more but fewer than the long
    member tenure months, the relief is taken as the share gives. In any other case the relief is taken at half what the share gives. The relief is rounded to the cent.'
  prerequisite:
  - problem: returns_ext_restocking_fee_charge
    kind: value_input
    gate: fee_charged
    form: state
    policy_source: The relief is worked out only after the restocking fee it relieves stands charged against the return.
    condition: A restocking fee entry stands charged against the return, so that the fee still standing against it is more than nothing.
    resolved_by: charge_restocking_fee_677c7b7a
    effect: Once a fee stands charged, the binding that reads what has been charged against the return takes that amount, the fee still standing becomes more than nothing, and the share worked out on it
      produces a relief rather than nothing at all.
  cross_category:
  - category: membership
    as: history
    reads:
    - status
    - dues_outstanding
    - activation_date
    - restocking_fee_waiver_pct
    - membership_events.points_delta
    note: The membership's standing, the points it earned in the last twelve months and how long it has stood active decide the standing share, the year's earning share and the scaling.
  compute:
  - fee_charged: SUM('return_events','restocking_fee_amount', event_type='returns_restocking_fee_charge')
  - fee_relieved: SUM('return_events','restocking_fee_amount', event_type='returns_restocking_fee_waive')
  - fee_standing: MX(0, fee_charged - fee_relieved)
  - published_share_pct: CPARAM('membership','restocking_fee_waiver_pct') or 0
  - member_status: CFIELD('membership','status') or ''
  - member_dues_due: CFIELD('membership','dues_outstanding') or 0
  - standing_share_pct: published_share_pct if (member_status == 'active' and member_dues_due <= 0) else (published_share_pct * 0.5 if (member_status == 'active' and member_dues_due > 0) else 0)
  - points_last_year: XSUM('membership','membership_events','points_delta', within_months=12, event_type='membership_points_accrue')
  - spend_share_pct: K('high_spend_share_pct') if (member_status == 'active' and points_last_year >= K('high_spend_points')) else (K('mid_spend_share_pct') if (member_status == 'active' and points_last_year
      >= K('mid_spend_points')) else 0)
  - latest_grade: LATEST('return_events','inspection_grade', event_type='returns_inspection_grade_record')
  - inspections_on_file: COUNT('return_events', event_type='returns_inspection_grade_record')
  - grade_share_pct: K('sealed_grade_share_pct') if (inspections_on_file > 0 and latest_grade == 'as_new_sealed') else (K('complete_grade_share_pct') if (inspections_on_file > 0 and latest_grade == 'open_box_complete')
      else 0)
  - total_share_pct: standing_share_pct + spend_share_pct + grade_share_pct
  - relief_before_scaling: fee_standing * total_share_pct / 100
  - member_activation_day: CFIELD('membership','activation_date') or NOW
  - tenure_months: MONTHS(member_activation_day, NOW)
  - scaled_relief: relief_before_scaling * 1.5 if tenure_months >= K('long_member_tenure_months') else (relief_before_scaling if tenure_months >= K('member_tenure_months') else relief_before_scaling * 0.5)
  - outright_member_waiver: 1 if P('restocking_fee_waived_for_member') else 0
  - result: RND(fee_standing, 2) if outright_member_waiver == 1 else RND(MN(scaled_relief, fee_standing), 2)
  compute_basis:
    fee_charged: The fee still standing against the return is what has been charged against it less what has already been relieved, and is never less than nothing.
    fee_relieved: The fee still standing against the return is what has been charged against it less what has already been relieved, and is never less than nothing.
    fee_standing: The relief the membership gives against a restocking fee is the tier's published restocking fee waiver share of the fee still standing against the return, and the relief never exceeds
      the fee still standing.
    published_share_pct: Where the membership stands active and its dues carry nothing outstanding, the tier's published restocking fee waiver share is the share.
    member_status: Where the membership stands active and part of its dues stands unpaid, half the tier's published share is the share.
    member_dues_due: Where the membership stands active and part of its dues stands unpaid, half the tier's published share is the share.
    standing_share_pct: The membership's standing fixes the share. Where the membership stands active and its dues carry nothing outstanding, the tier's published restocking fee waiver share is the share.
      Where the membership stands active and part of its dues stands unpaid, half the tier's published share is the share. In any other case there is no share and no relief is given.
    points_last_year: Where the membership stands active and the reward points it has earned in the last twelve months come to the high spend points or more, the high spend share is added.
    spend_share_pct: The year's earning is then added. Where the membership stands active and the reward points it has earned in the last twelve months come to the high spend points or more, the high spend
      share is added. Where the membership stands active and those points come to the mid spend points or more but fewer than the high spend points, the mid spend share is added. In any other case nothing
      is added.
    latest_grade: Where an inspection stands on the return and the grade last recorded is that it came back opened with everything in the box, the complete grade share is added.
    inspections_on_file: Where an inspection stands on the return and the grade last recorded is that the item came back new and sealed, the sealed grade share is added.
    grade_share_pct: The grade the item came back at is then added. Where an inspection stands on the return and the grade last recorded is that the item came back new and sealed, the sealed grade share
      is added. Where an inspection stands on the return and the grade last recorded is that it came back opened with everything in the box, the complete grade share is added. In any other case nothing
      is added.
    total_share_pct: 'The share is settled in three steps and then scaled: the membership''s standing fixes the share, the year''s earning adds to it, the grade the item came back at adds to it, and the
      total share is taken on the fee still standing and then scaled by how long the membership has stood active.'
    relief_before_scaling: The share so totalled is taken on the fee still standing and then scaled by how long the membership has stood active.
    member_activation_day: Where the membership has stood active for the long member tenure months or more, the relief is taken at half as much again.
    tenure_months: Where it has stood active for the member tenure months or more but fewer than the long member tenure months, the relief is taken as the share gives.
    scaled_relief: Where the membership has stood active for the long member tenure months or more, the relief is taken at half as much again. Where it has stood active for the member tenure months or more
      but fewer than the long member tenure months, the relief is taken as the share gives. In any other case the relief is taken at half what the share gives.
    outright_member_waiver: Where the schedule waives the fee for a Circle member outright, the whole fee still standing is relieved and no share is worked out.
    result: The relief is rounded to the cent.
  factors:
  - id: membership_standing_share
    effect: parameter
    decides: standing_share_pct
    bindings:
    - published_share_pct
    - member_status
    - member_dues_due
    - standing_share_pct
    ladder:
    - when: the membership stands active and its dues carry nothing outstanding
      value: the tier's published restocking fee waiver share
    - when: the membership stands active and part of its dues stands unpaid
      value: half the tier's published restocking fee waiver share
    - when: otherwise
      value: no share at all
    baseline:
      standing_share_pct: published_share_pct
    evidence:
    - cross_category
    cross_difficulty: membership
  - id: year_earning_share
    effect: parameter
    decides: spend_share_pct
    bindings:
    - points_last_year
    - spend_share_pct
    ladder:
    - when: the membership stands active and the reward points it has earned in the last twelve months come to the high spend points or more
      value: the high spend share
    - when: the membership stands active and those points come to the mid spend points or more but fewer than the high spend points
      value: the mid spend share
    - when: otherwise
      value: nothing is added
    baseline:
      spend_share_pct: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: membership
  - id: returned_grade_share
    effect: parameter
    decides: grade_share_pct
    bindings:
    - latest_grade
    - inspections_on_file
    - grade_share_pct
    ladder:
    - when: an inspection stands on the return and the grade last recorded is that the item came back new and sealed
      value: the sealed grade share
    - when: an inspection stands on the return and the grade last recorded is that it came back opened with everything in the box
      value: the complete grade share
    - when: otherwise
      value: nothing is added
    baseline:
      grade_share_pct: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: membership_tenure_scaling
    effect: method
    decides: scaled_relief
    bindings:
    - member_activation_day
    - tenure_months
    - scaled_relief
    ladder:
    - when: the membership has stood active for the long member tenure months or more
      method: the relief is taken at half as much again
    - when: the membership has stood active for the member tenure months or more but fewer than the long member tenure months
      method: the relief is taken as the share gives
    - when: otherwise
      method: the relief is taken at half what the share gives
    baseline:
      scaled_relief: relief_before_scaling
    evidence:
    - cross_category
    - date
    cross_difficulty: membership
  baseline:
    rule: The relief the membership gives against a restocking fee is the tier's published restocking fee waiver share of the fee still standing against the return, and the relief never exceeds the fee
      still standing. Where the schedule waives the fee for a Circle member outright, the whole fee still standing is relieved and no share is worked out. The fee still standing against the return is what
      has been charged against it less what has already been relieved, and is never less than nothing. The relief is recorded with the membership as its ground. The relief is rounded to the cent.
    params: []
  inputs:
    history:
    - table: return_events
      aggregate: sum
      field: restocking_fee_amount
      within_months: null
      filters:
        event_type: returns_restocking_fee_charge
    - table: return_events
      aggregate: latest
      field: inspection_grade
      within_months: null
      filters:
        event_type: returns_inspection_grade_record
    - category: membership
      table: membership_events
      aggregate: sum
      field: points_delta
      within_months: 12
      filters:
        event_type: membership_points_accrue
    cross_category:
    - membership
- id: returns_ext_exchange_difference
  base_policy_refs:
  - returns_exchange_handling
  - returns_excl_refund_or_exchange
  - returns_refund_settlement
  overwrite:
  - base_policy: returns_exchange_handling
    superseded_clause: An exchange is offered only on the schedules that allow it and only inside the schedule's exchange window, counted from the same anchor as the return window.
    replaced_by: An exchange is offered on the schedules that allow one and inside the schedule's exchange window, counted in calendar days from the day the item was delivered as day zero, to which the
      window extension days of the tier the membership stood on when the return was asked for are added where the schedule takes the member extension.
  - base_policy: returns_exchange_handling
    superseded_clause: 'A price difference is settled as the schedule''s difference basis names: where today''s shelf price is higher the customer pays the difference, where it is lower the difference is
      returned by the refund method'
    replaced_by: 'The difference is settled in this order: the replacement going out is priced, the drop between the price paid and that price is worked out, the share of the drop the schedule returns is
      taken on it, the delivery charge carried over is added, the carriage the retailer spent on collections that went unused and the part of the drop that goes back as reward points rather than money are
      taken off, the restocking fee still standing on the return is kept back last, and the result is never less than nothing and is rounded to the cent.'
  - base_policy: returns_refund_settlement
    superseded_clause: The restocking fee still outstanding is kept back from the refund as an offset rather than billed separately
    replaced_by: The restocking fee still standing on the return is kept back last.
  trigger: on_request
  subject:
  - returns_exchange_issue
  computes: price_difference_amount
  target_tool: accept_exchange_item_1cf629c9
  params:
    top_member_discount_pct: 5
    short_hold_divisor: 2
    stale_drop_pct: 40
    held_drop_pct: 70
    whole_drop_pct: 100
    delivery_carry_pct: 50
    points_block: 250
  rule: 'The difference returned to the customer on an exchange is the price paid on the line, times the units coming back, less the price of the replacement going out, and the whole of that drop is returned.
    The price of the replacement going out is today''s shelf price of the stock number going out, which is the unit price on the most recent merchandise line the records carry for that stock number, and
    where the records carry none it is the price paid on the line itself. Where the price of the replacement going out is the same as or more than the price paid on the line, the drop is nothing rather
    than a negative figure, and the drop is held at nothing before the share of the drop is taken. The difference returned is never less than nothing and is rounded to the cent. Where the schedule settles
    an exchange like for like only, no difference is settled at all. The stock number recorded on the exchange is the stock number of the item the return was raised on, since the replacement going out is
    the same model. An exchange is offered on the schedules that allow one and inside the schedule''s exchange window, counted in calendar days from the day the item was delivered as day zero, to which
    the window extension days of the tier the membership stood on when the return was asked for are added where the schedule takes the member extension. The difference returned on an exchange is fixed only
    after the relief the membership allows against the restocking fee owed on the return stands recorded against that return with the membership as its ground. The difference is settled in this order: the
    replacement going out is priced, the drop between the price paid and that price is worked out, the share of the drop the schedule returns is taken on it, the delivery charge carried over is added, the
    carriage the retailer spent on collections that went unused and the part of the drop that goes back as reward points rather than money are taken off, the restocking fee still standing on the return
    is kept back last, and the result is never less than nothing and is rounded to the cent. The replacement going out is priced as follows. Where the membership standing on the profile is active and the
    tier''s published member only discount is the top member discount or more, the replacement is priced at today''s shelf price less that discount. Where the membership standing on the profile is active
    and the tier''s published member only discount is above nothing but below the top member discount, the replacement is priced at today''s shelf price less half that discount. In any other case the replacement
    is priced at today''s shelf price. The share of the drop returned is then fixed by how long the item was away from the shelf, counted from the day it was delivered to the day it was booked in. Where
    it was away from the shelf longer than the schedule''s return window, the stale drop share is returned. Where it was away from the shelf longer than that window divided by the short hold divisor but
    not longer than the window, the held drop share is returned. In any other case the whole drop share is returned. The delivery charge carried over is then added, because the charge paid on the line bought
    one delivery of goods the customer is giving back and the replacement is delivered again at no further charge, so the share of it the first delivery did not earn goes back with the difference. Where
    a delivery charge stands against the line and the schedule does not refund the delivery charge, the delivery carry share of that charge is added. Where a delivery charge stands against the line and
    the schedule refunds the delivery charge, the whole of that charge is added. In any other case nothing is added. The carriage the retailer spent on collections that went unused is then taken off. Where
    two or more prepaid labels or collection bookings stand on the return and the schedule charges the customer for a carrier collection, the schedule''s carrier collection fee is taken off. Where exactly
    one prepaid label or collection booking stands on the return and the schedule charges the customer for a carrier collection, half that fee is taken off. In any other case nothing is taken off. The part
    of the drop that goes back as reward points rather than money is then taken off. Where the membership standing on the profile is active and the reward points redeemed against the order come to the points
    block or more, the value of those points at the tier''s published redemption rate is taken off, because points come back as points and not as money. Where the membership standing on the profile is active
    and some points were redeemed against the order but fewer than the points block, half that value is taken off. In any other case nothing is taken off. The restocking fee still standing on the return
    is kept back last. Where a restocking fee stands charged against the return and relief against it stands recorded, what is left after that relief is kept back. Where a restocking fee stands charged
    against the return and no relief against it stands recorded, the whole fee charged is kept back. In any other case nothing is kept back.'
  prerequisite:
  - problem: returns_ext_member_fee_relief
    kind: value_input
    gate: fee_held_back
    form: state
    policy_source: The difference returned on an exchange is fixed only after the relief the membership allows against the restocking fee owed on the return stands recorded against that return with the
      membership as its ground.
    condition: A waiver entry recorded on the ground of the membership stands against the return, so that what is kept back from the difference is the fee left after that relief rather than the whole fee
      charged.
    resolved_by: waive_restocking_fee_47bbe442
    effect: Once such a waiver stands on the return, the binding that reads what is kept back takes the fee charged less the relief recorded rather than the whole fee charged, so the difference returned
      to the customer rises by the amount relieved.
  cross_category:
  - category: orders
    as: history
    reads:
    - order_events.unit_price
    - order_events.charge_amount
    note: The most recent merchandise line recorded for the stock number gives today's shelf price, and the delivery charge standing against the order line decides the delivery carried over.
  - category: membership
    as: history
    reads:
    - status
    - member_only_discount_pct
    - points_value_usd_per_100_points
    - membership_events.points_delta
    note: The tier's member only discount decides how the replacement is priced, and the points redeemed against the order decide the part that goes back as points.
  compute:
  - line_price: F('purchase_price') * F('quantity_returned')
  - shelf_price_today: XLATEST('orders','order_events','unit_price', item_sku=F('item_sku'), charge_kind='merchandise_line') or F('purchase_price')
  - member_status: CFIELD('membership','status') or ''
  - member_discount_pct: CPARAM('membership','member_only_discount_pct') or 0
  - replacement_price: shelf_price_today * (1 - member_discount_pct / 100) if (member_status == 'active' and member_discount_pct >= K('top_member_discount_pct')) else (shelf_price_today * (1 - member_discount_pct
      / 200) if (member_status == 'active' and member_discount_pct > 0) else shelf_price_today)
  - raw_difference: MX(0, line_price - replacement_price)
  - window_days: P('return_window_days')
  - off_shelf_days: DAYS(F('delivery_date'), F('received_date'))
  - drop_share_pct: K('stale_drop_pct') if off_shelf_days > window_days else (K('held_drop_pct') if (off_shelf_days > window_days / K('short_hold_divisor') and off_shelf_days <= window_days) else K('whole_drop_pct'))
  - difference_before_adjustments: raw_difference * drop_share_pct / 100
  - line_delivery_charge: XSUM('orders','order_events','charge_amount', charge_kind='delivery_fee', order_line_reference=F('order_line_reference'))
  - delivery_carried: RND(line_delivery_charge * K('delivery_carry_pct') / 100, 2) if (line_delivery_charge > 0 and not P('delivery_fee_refunded')) else (line_delivery_charge if (line_delivery_charge >
      0 and P('delivery_fee_refunded')) else 0)
  - labels_on_file: COUNT('return_events', event_type='returns_shipping_label_issue')
  - carriage_deduction: P('carrier_pickup_fee_usd') if (labels_on_file >= 2 and P('carrier_pickup_fee_usd') > 0) else (RND(P('carrier_pickup_fee_usd') / 2, 2) if (labels_on_file == 1 and P('carrier_pickup_fee_usd')
      > 0) else 0)
  - points_redeemed_on_line: ABS(XSUM('membership','membership_events','points_delta', event_type='membership_points_redeem', redemption_ref=F('source_order_reference')))
  - points_value_rate: CPARAM('membership','points_value_usd_per_100_points') or 0
  - points_restored_part: RND(points_redeemed_on_line * points_value_rate / 100, 2) if (member_status == 'active' and points_redeemed_on_line >= K('points_block')) else (RND(points_redeemed_on_line * points_value_rate
      / 200, 2) if (member_status == 'active' and points_redeemed_on_line > 0) else 0)
  - fee_charged: SUM('return_events','restocking_fee_amount', event_type='returns_restocking_fee_charge')
  - fee_relieved: SUM('return_events','restocking_fee_amount', event_type='returns_restocking_fee_waive')
  - fee_held_back: RND(fee_charged - fee_relieved, 2) if (fee_charged > 0 and fee_relieved > 0) else (fee_charged if fee_charged > 0 else 0)
  - like_for_like_only: 1 if P('exchange_price_difference_basis') == 'an exchange is like for like only' else 0
  - result: 0.0 if like_for_like_only == 1 else RND(MX(0, difference_before_adjustments + delivery_carried - carriage_deduction - points_restored_part - fee_held_back), 2)
  compute_basis:
    line_price: The difference returned to the customer on an exchange is the price paid on the line, times the units coming back, less the price of the replacement going out, and the whole of that drop
      is returned.
    shelf_price_today: The price of the replacement going out is today's shelf price of the stock number going out, which is the unit price on the most recent merchandise line the records carry for that
      stock number, and where the records carry none it is the price paid on the line itself.
    member_status: Where the membership standing on the profile is active and the tier's published member only discount is the top member discount or more, the replacement is priced at today's shelf price
      less that discount.
    member_discount_pct: Where the membership standing on the profile is active and the tier's published member only discount is above nothing but below the top member discount, the replacement is priced
      at today's shelf price less half that discount.
    replacement_price: The replacement going out is priced as follows. Where the membership standing on the profile is active and the tier's published member only discount is the top member discount or
      more, the replacement is priced at today's shelf price less that discount. Where the membership standing on the profile is active and the tier's published member only discount is above nothing but
      below the top member discount, the replacement is priced at today's shelf price less half that discount. In any other case the replacement is priced at today's shelf price.
    raw_difference: Where the price of the replacement going out is the same as or more than the price paid on the line, the drop is nothing rather than a negative figure, and the drop is held at nothing
      before the share of the drop is taken.
    window_days: Where it was away from the shelf longer than that window divided by the short hold divisor but not longer than the window, the held drop share is returned.
    off_shelf_days: The share of the drop returned is then fixed by how long the item was away from the shelf, counted from the day it was delivered to the day it was booked in.
    drop_share_pct: The share of the drop returned is then fixed by how long the item was away from the shelf, counted from the day it was delivered to the day it was booked in. Where it was away from the
      shelf longer than the schedule's return window, the stale drop share is returned. Where it was away from the shelf longer than that window divided by the short hold divisor but not longer than the
      window, the held drop share is returned. In any other case the whole drop share is returned.
    difference_before_adjustments: the share of the drop the schedule returns is taken on it
    line_delivery_charge: Where a delivery charge stands against the line and the schedule does not refund the delivery charge, the delivery carry share of that charge is added.
    delivery_carried: The delivery charge carried over is then added, because the charge paid on the line bought one delivery of goods the customer is giving back and the replacement is delivered again
      at no further charge, so the share of it the first delivery did not earn goes back with the difference. Where a delivery charge stands against the line and the schedule does not refund the delivery
      charge, the delivery carry share of that charge is added. Where a delivery charge stands against the line and the schedule refunds the delivery charge, the whole of that charge is added. In any other
      case nothing is added.
    labels_on_file: Where two or more prepaid labels or collection bookings stand on the return and the schedule charges the customer for a carrier collection, the schedule's carrier collection fee is taken
      off.
    carriage_deduction: The carriage the retailer spent on collections that went unused is then taken off. Where two or more prepaid labels or collection bookings stand on the return and the schedule charges
      the customer for a carrier collection, the schedule's carrier collection fee is taken off. Where exactly one prepaid label or collection booking stands on the return and the schedule charges the customer
      for a carrier collection, half that fee is taken off. In any other case nothing is taken off.
    points_redeemed_on_line: Where the membership standing on the profile is active and the reward points redeemed against the order come to the points block or more, the value of those points at the tier's
      published redemption rate is taken off, because points come back as points and not as money.
    points_value_rate: the value of those points at the tier's published redemption rate is taken off
    points_restored_part: The part of the drop that goes back as reward points rather than money is then taken off. Where the membership standing on the profile is active and the reward points redeemed
      against the order come to the points block or more, the value of those points at the tier's published redemption rate is taken off, because points come back as points and not as money. Where the membership
      standing on the profile is active and some points were redeemed against the order but fewer than the points block, half that value is taken off. In any other case nothing is taken off.
    fee_charged: Where a restocking fee stands charged against the return and no relief against it stands recorded, the whole fee charged is kept back.
    fee_relieved: Where a restocking fee stands charged against the return and relief against it stands recorded, what is left after that relief is kept back.
    fee_held_back: The restocking fee still standing on the return is kept back last. Where a restocking fee stands charged against the return and relief against it stands recorded, what is left after that
      relief is kept back. Where a restocking fee stands charged against the return and no relief against it stands recorded, the whole fee charged is kept back. In any other case nothing is kept back.
    like_for_like_only: Where the schedule settles an exchange like for like only, no difference is settled at all.
    result: The difference returned is never less than nothing and is rounded to the cent. Where the schedule settles an exchange like for like only, no difference is settled at all.
  factors:
  - id: member_replacement_pricing
    effect: method
    decides: replacement_price
    bindings:
    - member_status
    - member_discount_pct
    - replacement_price
    ladder:
    - when: the membership standing on the profile is active and the tier's published member only discount is the top member discount or more
      method: the replacement is priced at today's shelf price less the tier's published member only discount
    - when: the membership standing on the profile is active and the tier's published member only discount is above nothing but below the top member discount
      method: the replacement is priced at today's shelf price less half the tier's published member only discount
    - when: otherwise
      method: the replacement is priced at today's shelf price
    baseline:
      replacement_price: shelf_price_today
    evidence:
    - cross_category
    cross_difficulty: membership
  - id: held_item_drop_share
    effect: parameter
    decides: drop_share_pct
    bindings:
    - window_days
    - off_shelf_days
    - drop_share_pct
    ladder:
    - when: the item was away from the shelf longer than the schedule's return window, counted from the day it was delivered to the day it was booked in
      value: the stale drop share
    - when: the item was away from the shelf longer than that window divided by the short hold divisor but not longer than the window
      value: the held drop share
    - when: otherwise
      value: the whole drop share
    baseline:
      drop_share_pct: K('whole_drop_pct')
    evidence:
    - date
    - tier_param
    cross_difficulty: null
  - id: delivery_carried_over
    effect: parameter
    decides: delivery_carried
    bindings:
    - line_delivery_charge
    - delivery_carried
    ladder:
    - when: a delivery charge stands against the line and the schedule does not refund the delivery charge
      value: the delivery carry share of that charge
    - when: a delivery charge stands against the line and the schedule refunds the delivery charge
      value: the whole of that charge
    - when: otherwise
      value: nothing is added
    baseline:
      delivery_carried: '0'
    evidence:
    - cross_category
    cross_difficulty: orders
  - id: unused_carriage_deduction
    effect: parameter
    decides: carriage_deduction
    bindings:
    - labels_on_file
    - carriage_deduction
    ladder:
    - when: two or more prepaid labels or collection bookings stand on the return and the schedule charges the customer for a carrier collection
      value: the schedule's carrier collection fee
    - when: exactly one prepaid label or collection booking stands on the return and the schedule charges the customer for a carrier collection
      value: half the schedule's carrier collection fee
    - when: otherwise
      value: nothing is taken off
    baseline:
      carriage_deduction: '0'
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: points_back_as_points
    effect: parameter
    decides: points_restored_part
    bindings:
    - points_redeemed_on_line
    - points_value_rate
    - points_restored_part
    ladder:
    - when: the membership standing on the profile is active and the reward points redeemed against the order come to the points block or more
      value: the value of those points at the tier's published redemption rate
    - when: the membership standing on the profile is active and some points were redeemed against the order but fewer than the points block
      value: half the value of those points at the tier's published redemption rate
    - when: otherwise
      value: nothing is taken off
    baseline:
      points_restored_part: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: membership
  - id: standing_fee_holdback
    effect: method
    decides: fee_held_back
    bindings:
    - fee_charged
    - fee_relieved
    - fee_held_back
    ladder:
    - when: a restocking fee stands charged against the return and relief against it stands recorded
      method: what is left after that relief is kept back
    - when: a restocking fee stands charged against the return and no relief against it stands recorded
      method: the whole fee charged is kept back
    - when: otherwise
      method: nothing is kept back
    baseline:
      fee_held_back: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: The difference returned to the customer on an exchange is the price paid on the line, times the units coming back, less the price of the replacement going out, and the whole of that drop is returned.
      The price of the replacement going out is today's shelf price of the stock number going out, which is the unit price on the most recent merchandise line the records carry for that stock number, and
      where the records carry none it is the price paid on the line itself. Where the price of the replacement going out is the same as or more than the price paid on the line, the drop is nothing rather
      than a negative figure, and the drop is held at nothing before the share of the drop is taken. The difference returned is never less than nothing and is rounded to the cent. Where the schedule settles
      an exchange like for like only, no difference is settled at all. The stock number recorded on the exchange is the stock number of the item the return was raised on, since the replacement going out
      is the same model.
    params:
    - whole_drop_pct
  inputs:
    history:
    - table: return_events
      aggregate: sum
      field: restocking_fee_amount
      within_months: null
      filters:
        event_type: returns_restocking_fee_charge
    - table: return_events
      aggregate: count
      field: return_event_id
      within_months: null
      filters:
        event_type: returns_shipping_label_issue
    - category: orders
      table: order_events
      aggregate: latest
      field: unit_price
      within_months: null
      filters:
        charge_kind: merchandise_line
    - category: membership
      table: membership_events
      aggregate: sum
      field: points_delta
      within_months: null
      filters:
        event_type: membership_points_redeem
    cross_category:
    - orders
    - membership
