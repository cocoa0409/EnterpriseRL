- id: returns_ext_restocking_fee_charge
  base_policy_refs:
  - returns_restocking_fee
  overwrite:
  - base_policy: returns_restocking_fee
    superseded_clause: The restocking fee is the schedule's percentage of the line price, then raised to the schedule's minimum and cut to the schedule's cap, and rounded to the cent.
    replaced_by: 'The fee is worked out in this order: the days the item was held are counted, the percentage the days and the grade give is taken on the price paid for the units coming back, that percentage
      fee is then taken at the share the reason and the inspection allow, the handling the route back cost and the value of any reward points that cannot be clawed back are added to it, the credit already
      given on the line is taken off, and the result is held between the schedule''s minimum and its cap and rounded to the cent.'
  trigger: state_due
  subject:
  - returns_restocking_fee_charge
  computes: restocking_fee_amount
  target_tool: charge_restocking_fee_677c7b7a
  params:
    short_hold_divisor: 2
    stale_damaged_fee_pct: 22
    stale_fee_pct: 18
    held_fee_pct: 14
    crew_handling_usd: 35.0
    parcel_handling_usd: 12.0
    material_credit_usd: 25.0
    large_credit_reduction_usd: 20.0
    small_credit_reduction_usd: 10.0
  rule: 'The restocking fee is the schedule''s percentage of the price paid on the line, times the units coming back, then raised to the schedule''s minimum, cut to the schedule''s cap, and rounded to the
    cent. Where the schedule charges a flat activated device fee, that fee is charged instead of the percentage fee, the two are never charged together, and the schedule''s percentage minimum and percentage
    cap do not bound it, though the fee charged on that branch is never less than nothing. No fee at all is charged where the grade recorded is that the item was defective on arrival or not as described,
    or where the reason recorded is that the wrong item was shipped, and in that case nothing is charged and the schedule''s minimum does not apply. The grade recorded on the fee entry is the condition
    the inspection recorded for the item, and no other condition is recorded against the fee. The fee is worked out in this order: the days the item was held are counted, the percentage the days and the
    grade give is taken on the price paid for the units coming back, that percentage fee is then taken at the share the reason and the inspection allow, the handling the route back cost and the value of
    any reward points that cannot be clawed back are added to it, the credit already given on the line is taken off, and the result is held between the schedule''s minimum and its cap and rounded to the
    cent. The days the item was held are counted from the day the item was delivered to the day it was booked in. Where a prepaid label or collection booking stands on the return and the item was booked
    in on or after the day the latest of them was issued, the days are counted instead from the day the return was authorised to the day the item was booked in, so the days it spent travelling back are
    not counted against the customer. Where no prepaid label or collection booking stands on the return and the item was handed in at a store counter, the days are counted from the day the item was delivered
    to the day it was booked in and the day of delivery is not counted. The percentage charged is then fixed. Where the item was held longer than the schedule''s return window and the grade recorded is
    that it came back opened with something missing from the box or damaged by the customer, the stale damaged fee percentage is charged. Where the item was held longer than the schedule''s return window
    and the grade recorded is that it came back new and sealed or opened with everything in the box, the stale fee percentage is charged. Where the item was held longer than the schedule''s return window
    divided by the short hold divisor but not longer than that window, the held fee percentage is charged. In any other case the schedule''s own restocking percentage is charged. The fee so fixed is then
    taken at the share the reason and the inspection allow. Where the reason recorded is that the item arrived damaged in transit, no fee is taken at all, because the damage happened in the carrier''s hands
    and not the customer''s. Where the reason recorded is that the item did not perform as the customer expected and an inspection recorded that it came back opened with everything in the box, the fee is
    taken at half. In any other case the fee is taken in full. The handling the route back cost is then added. Where the service the item was delivered on schedules a two person crew and offers no slot
    on the day of the order, the crew handling amount is added. Where that service schedules no two person crew and offers no slot on the day of the order, the parcel handling amount is added. In any other
    case nothing is added. The value of reward points that cannot be clawed back is then added. Where the profile''s membership stands active and its reward point balance now stands at nothing, the value
    of the whole of the points the line earned at the tier''s published redemption rate is added, because none of them can be taken back off a balance that is empty. Where the membership stands active and
    its balance stands above nothing but below the points the line earned, the value of the part that cannot be taken back, that is the points the line earned less the balance now standing, is added at
    that rate. In any other case nothing is added, because the points the line earned are taken back off the balance instead. The credit already given on the line is then taken off, because a line the retailer
    has already credited for its own failure does not then carry the full charge for putting the stock back. Where the credits already recorded against the line come to the material credit amount or more,
    the large credit reduction is taken off. Where they come to less than that but to more than nothing, the small credit reduction is taken off. In any other case nothing is taken off.'
  prerequisite: []
  cross_category:
  - category: orders
    as: history
    reads:
    - variant_name
    - two_person_crew_required
    - delivery_lead_days_min
    - order_events.credit_amount
    note: The crew the delivering service schedules decides the handling addition, and the credits already recorded against the order line decide the credit reduction.
  - category: membership
    as: history
    reads:
