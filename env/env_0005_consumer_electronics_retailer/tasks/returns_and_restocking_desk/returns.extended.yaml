- id: returns_condition_grading
  subject:
  - returns_inspection_grade_record
  - returns_inspection_complete
  rule: 'Every returned item is inspected before the refund is worked out, and the inspection is completed within the schedule''s inspection days counted in business days from the day the item was booked
    in. The grade recorded by the inspection governs what is refunded, and the customer''s account of the condition does not stand in for it. An item is graded as new and sealed only where the packaging
    has not been opened; an opened item with everything in the box is graded open box complete, and one missing anything is graded open box incomplete with the schedule''s deduction taken for each missing
    accessory. Damage the customer caused is graded as such, damage or failure present on arrival is graded defective on arrival, and an item that cannot be put right economically is graded beyond economic
    repair. Where the schedule requires the original packaging and it is missing, the item is graded open box incomplete rather than refused, and the deduction applies. Where the serial returned does not
    match the serial sold the item is not graded at all: the return is refused and the item is sent back to the customer at the retailer''s cost.'
  eligibility:
  - id: inspection_is_authoritative
    applies_to:
    - returns_inspection_complete
    kind: authorization
    condition: The grade recorded by the inspection governs what is refunded, and the customer's account of the condition does not stand in for it.
    evidence_fields:
    - return_authorizations.inspection_grade
    - return_authorizations.order_line_reference
    - return_authorizations.item_serial
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - return_authorizations.order_line_reference
      action_bindings:
        return_authorizations.order_line_reference: order_line_reference
