    - points_balance
    - points_value_usd_per_100_points
    - membership_events.points_delta
    note: The points the line earned in the membership ledger, the balance standing now and the tier's redemption rate decide the points addition.
  compute:
  - line_price: F('purchase_price') * F('quantity_returned')
  - labels_on_file: COUNT('return_events', event_type='returns_shipping_label_issue')
  - latest_label_day: LATEST('return_events','event_date', event_type='returns_shipping_label_issue')
  - days_held: DAYS(F('authorized_date'), F('received_date')) if (labels_on_file >= 1 and latest_label_day <= F('received_date')) else (DAYS(F('delivery_date'), F('received_date')) - 1 if (labels_on_file
      == 0 and F('return_method') == 'in_store_dropoff') else DAYS(F('delivery_date'), F('received_date')))
  - window_days: P('return_window_days')
  - latest_grade: LATEST('return_events','inspection_grade', event_type='returns_inspection_grade_record')
  - fee_rate: K('stale_damaged_fee_pct') if (days_held > window_days and (latest_grade == 'open_box_incomplete' or latest_grade == 'damaged_by_customer')) else (K('stale_fee_pct') if (days_held > window_days
      and (latest_grade == 'as_new_sealed' or latest_grade == 'open_box_complete')) else (K('held_fee_pct') if (days_held > window_days / K('short_hold_divisor') and days_held <= window_days) else P('restocking_fee_pct')))
  - percentage_fee: line_price * fee_rate / 100
  - activated_device_fee: P('activated_device_fee_usd')
  - chargeable_fee_base: activated_device_fee if activated_device_fee > 0 else percentage_fee
  - clear_inspections: COUNT('return_events', event_type='returns_inspection_grade_record', inspection_grade='open_box_complete')
  - good_faith_fee: 0 if F('return_reason') == 'damaged_in_transit' else (chargeable_fee_base * 0.5 if (F('return_reason') == 'performance_disappointing' and clear_inspections > 0) else chargeable_fee_base)
  - crew_required: CPARAM('orders','two_person_crew_required', item_serial=F('item_serial')) or False
  - service_lead_days: CPARAM('orders','delivery_lead_days_min', item_serial=F('item_serial')) or 0
  - handling_addition: K('crew_handling_usd') if (crew_required and service_lead_days > 0) else (K('parcel_handling_usd') if (not crew_required and service_lead_days > 0) else 0)
  - points_earned: XSUM('membership','membership_events','points_delta', event_type='membership_points_accrue', source_order_id=F('source_order_reference'))
  - points_value_rate: CPARAM('membership','points_value_usd_per_100_points') or 0
  - member_points_now: CFIELD('membership','points_balance') or 0
  - member_status: CFIELD('membership','status') or ''
  - points_addition: RND(points_earned * points_value_rate / 100, 2) if (member_status == 'active' and member_points_now <= 0) else (RND((points_earned - member_points_now) * points_value_rate / 100, 2)
      if (member_status == 'active' and member_points_now > 0 and member_points_now < points_earned) else 0)
  - line_credits: XSUM('orders','order_events','credit_amount', order_line_reference=F('order_line_reference'))
  - credited_reduction: K('large_credit_reduction_usd') if line_credits >= K('material_credit_usd') else (K('small_credit_reduction_usd') if line_credits > 0 else 0)
  - fee_before_bounds: good_faith_fee + handling_addition + points_addition - credited_reduction
  - retailer_ground_no_fee: 1 if (latest_grade == 'defective_on_arrival' or latest_grade == 'not_as_described' or F('return_reason') == 'wrong_item_shipped') else 0
  - bounded_fee: MX(0, fee_before_bounds) if activated_device_fee > 0 else MN(MX(fee_before_bounds, P('restocking_fee_min_usd')), P('restocking_fee_cap_usd'))
  - result: 0.0 if retailer_ground_no_fee == 1 else RND(bounded_fee, 2)
  compute_basis:
    line_price: The restocking fee is the schedule's percentage of the price paid on the line, times the units coming back, then raised to the schedule's minimum, cut to the schedule's cap, and rounded
      to the cent.
    labels_on_file: Where a prepaid label or collection booking stands on the return and the item was booked in on or after the day the latest of them was issued, the days are counted instead from the day
