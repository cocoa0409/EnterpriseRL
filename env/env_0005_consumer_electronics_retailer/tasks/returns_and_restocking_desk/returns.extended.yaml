    latest_label_day: Where a prepaid label or collection booking stands on the return and the item was booked in on or after the day the latest of them was issued, the days are counted instead from the
      day the return was authorised to the day the item was booked in, so the days it spent travelling back are not counted against the customer.
    days_held: The days the item was held are counted from the day the item was delivered to the day it was booked in. Where a prepaid label or collection booking stands on the return and the item was booked
      in on or after the day the latest of them was issued, the days are counted instead from the day the return was authorised to the day the item was booked in, so the days it spent travelling back are
      not counted against the customer. Where no prepaid label or collection booking stands on the return and the item was handed in at a store counter, the days are counted from the day the item was delivered
      to the day it was booked in and the day of delivery is not counted.
    window_days: Where the item was held longer than the schedule's return window divided by the short hold divisor but not longer than that window, the held fee percentage is charged.
    latest_grade: Where the item was held longer than the schedule's return window and the grade recorded is that it came back opened with something missing from the box or damaged by the customer, the
      stale damaged fee percentage is charged.
    fee_rate: The percentage charged is then fixed. Where the item was held longer than the schedule's return window and the grade recorded is that it came back opened with something missing from the box
      or damaged by the customer, the stale damaged fee percentage is charged. Where the item was held longer than the schedule's return window and the grade recorded is that it came back new and sealed
      or opened with everything in the box, the stale fee percentage is charged. Where the item was held longer than the schedule's return window divided by the short hold divisor but not longer than that
      window, the held fee percentage is charged. In any other case the schedule's own restocking percentage is charged.
    percentage_fee: the percentage the days and the grade give is taken on the price paid for the units coming back
    activated_device_fee: Where the schedule charges a flat activated device fee, that fee is charged instead of the percentage fee, the two are never charged together, and the schedule's percentage minimum
      and percentage cap do not bound it, though the fee charged on that branch is never less than nothing.
    chargeable_fee_base: Where the schedule charges a flat activated device fee, that fee is charged instead of the percentage fee, the two are never charged together, and the schedule's percentage minimum
