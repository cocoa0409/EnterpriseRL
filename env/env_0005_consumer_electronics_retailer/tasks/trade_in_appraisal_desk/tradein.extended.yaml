category: tradein
display_name: Northbeam Renew Trade-In
binding:
  holding_table: tradein_agreements
  event_tables:
  - tradein_events
  intake_tables:
  - tradein_shipping_requests
  status_field: status
  variant_field: variant_name
  quantity_fields:
    credit_outstanding: trade_credit
    handling_fee_outstanding: handling_fee_receivable
lifecycle:
  states:
  - quoted
  - accepted
  - device_received
  - appraised
  - credited
  - declined
  - expired
  - returned_to_customer
  transitions:
  - from: quoted
    to: accepted
    by: user
    means: the customer accepted the quote for their own device
  - from: quoted
    to: expired
    by: system
    means: the quote was not accepted before its last day
  - from: accepted
    to: device_received
    by: agent
    means: the device arrived and was booked in
  - from: accepted
    to: expired
    by: system
    means: the accepted device never reached the retailer
  - from: device_received
    to: appraised
    by: agent
    means: the appraisal was carried out and recorded
  - from: appraised
    to: credited
    by: agent
    means: the settled amount was credited to the customer
  - from: appraised
    to: declined
    by: user
    means: the customer turned the revised offer down
  - from: declined
    to: returned_to_customer
    by: agent
    means: the declined device was sent back
accounts:
- key: trade_credit
  unit: USD
  meaning: trade-in credit issued to the customer and still unspent; an in delta issues credit or an uplift and an out delta records it spent or written off
- key: handling_fee_receivable
  unit: USD
  meaning: handling and freight fees charged on a trade-in and not yet settled or waived
parameter_schema:
  quote_validity_days: Days a quote may be accepted for, counted from the day it was given.
  quote_anchor_basis: What the quote validity is counted from (string).
  device_categories_accepted: Kinds of device the programme takes (string).
  max_devices_per_agreement: Devices one agreement may cover.
  min_quote_amount_usd: Smallest quote the programme will write, USD.
  max_quote_amount_usd: Largest quote the programme will write on one device, USD.
  condition_grade_ladder: Share of the quoted amount paid at each appraised condition, as a ladder of condition to percentage.
  grade_definitions: What each condition means on this programme (string).
  appraisal_days: Business days the appraisal may take once the device is received.
  revision_tolerance_pct: Percentage the appraisal may fall below the quote before the customer must be asked again.
  revision_notice_days: Business days within which a revised offer must be put to the customer.
  customer_decision_days: Calendar days the customer has to answer a revised offer.
  auto_accept_on_silence: Whether silence past the decision days is taken as acceptance of the revised offer.
  identity_check_required: Whether photographic identity must be checked before the device is taken.
  age_minimum_years: Least age at which a customer may trade a device in.
  locked_device_accepted: Whether a device still locked to a carrier or an account is taken at all.
  locked_device_deduction_pct: Percentage taken off where a locked device is nonetheless accepted.
  missing_accessory_deduction_pct: Percentage taken off where the charger or stylus that should come with the device is missing.
  no_power_deduction_pct: Percentage taken off where the device will not power on.
  cracked_screen_deduction_pct: Percentage taken off for a cracked screen or panel.
  water_damage_accepted: Whether a device showing liquid ingress is taken at all.
  shipment_methods_allowed: Ways the device may reach the retailer (string).
  shipping_label_validity_days: Days a prepaid shipping label stays usable from the day it is issued.
  handling_fee_usd: Handling fee charged for appraising a mailed-in device, USD.
  handling_fee_waived_above_usd: Quote at or above which the handling fee is waived, USD.
  freight_fee_usd: Freight fee charged to collect a palletised batch, USD.
  insurance_cover_in_transit_usd: Most the retailer will cover for a device lost or damaged on the way in, USD.
  bulk_pickup_lead_days: Days of notice needed to book a bulk collection.
  bulk_minimum_units: Least devices a bulk agreement will be written for.
  business_asset_list_required: Whether a signed asset list must be filed before collection.
  data_wipe_required: Whether the retailer must destroy the data on the device before it is resold.
  data_wipe_methods_allowed: Ways the data may be destroyed on this programme (string).
  wipe_certificate_issued: Whether an erasure certificate is issued to the customer.
  credit_settlement_methods: Ways the credit may be put into the customer's hands (string).
  instant_credit_at_till: Whether the credit may be taken off a purchase at the till the same day.
  credit_validity_days: Days the issued credit stays spendable from the day it was issued.
  credit_transferable: Whether the credit may be passed to another profile.
  credit_min_redemption_usd: Smallest amount of credit that may be spent at once, USD.
  credit_partial_redemption_allowed: Whether the credit may be spent a little at a time.
  promotional_boost_pct: Uplift paid on the appraised amount during a named promotion, percent.
  promotional_boost_cap_usd: Most the promotional uplift may add on one device, USD.
  member_bonus_applies: Whether the Circle tier's trade-in bonus is added on this programme.
  guarantee_floor_pct_of_purchase_price: Guaranteed minimum trade value as a percentage of what the device was bought for.
  guarantee_term_months: Months from the purchase within which the guaranteed value stands.
  guarantee_condition_requirement: Condition the device must be in for the guarantee to stand (string).
  guarantee_forfeit_on_damage: Whether damage beyond the condition requirement forfeits the guarantee outright.
  linked_purchase_required: Whether the trade-in must be set against a purchase.
  linked_purchase_window_days: Days either side of the trade-in within which the linked purchase must fall.
  trade_in_limit_count_per_year: Devices one profile may trade in a rolling year.
  trade_in_value_cap_per_year_usd: Most credit one profile may be issued in a rolling year, USD.
  recycling_credit_usd: Credit paid for a device the appraisal finds worth nothing but which is still recycled, USD.
  zero_value_device_handling: What is done with a device found worth nothing (string).
  device_return_shipping_paid_by: Who pays to send a declined device back (string).
  device_return_days: Business days within which a declined device is sent back.
  dispute_window_days: Days after the credit is issued within which the customer may dispute the appraisal.
  appraisal_photo_evidence: Whether photographs of the appraised device are kept on file.
