- id: tradein_appraisal_grading
  subject:
  - tradein_appraisal_record
  - tradein_quote_revise
  rule: 'The appraisal is carried out within the programme''s appraisal days counted in business days from the day the device was booked in, and the condition found governs the amount, not the condition
    declared. An appraisal is recorded only while the agreement stands device_received or appraised. The amount the appraisal supports is the quoted amount times the percentage the programme''s condition
    ladder gives for the condition found, rounded to the cent. Deductions are then taken in turn for a cracked screen, for a device that will not power on, for a missing charger or stylus, and for a device
    accepted while still locked; each deduction is a percentage of the amount reached so far, and the deductions are applied in that order. Where the amount the appraisal supports falls below the quote
    by no more than the programme''s tolerance, the quote is honoured as written and no revised offer is put to the customer. A device found to be a different model from the one quoted is not appraised
    on the quote at all: the offer is revised to the price of the model actually sent. Where the appraisal finds the device worth nothing, the programme''s zero value handling decides whether it is recycled
    for the recycling credit or sent back.'
