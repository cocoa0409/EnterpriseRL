  - tradein_agreement_credit
  rule: 'On the trade-up programmes the customer was sold a guaranteed minimum value: the credit is never below the programme''s guarantee percentage of what the device was bought for, provided the trade
    falls inside the guarantee term counted in whole months from the purchase day. The guarantee stands only while the device meets the programme''s condition requirement; where it does not and the programme
    forfeits the guarantee on damage, the ordinary condition ladder governs and the guarantee pays nothing. Where the ordinary appraisal supports more than the guaranteed floor the higher amount is credited,
    since the guarantee is a floor and not a ceiling. The guaranteed floor is read from the amount written onto the agreement when it was opened, not recalculated from today''s prices. A device traded outside
    the guarantee term is appraised as an ordinary trade-in on that programme, and the floor is not prorated for the months that had run.'
