extended_policies:
- id: tradein_ext_collection_handover_units
  base_policy_refs:
  - tradein_quote_acceptance
  overwrite:
  - base_policy: tradein_quote_acceptance
    superseded_clause: >-
      the units on the list govern what may be collected
    replaced_by: >-
      The units one collection may carry are the machines the agreement covers, capped at the full batch allowance the carrier books for a collection on the programme, and the run lifts those machines in full.
  trigger: on_request
  subject:
  - tradein_quote_accept
  computes: units_declared
  target_tool: confirm_handover_units_5801b6db
  params:
    slot_units_restricted: 24
    slot_units_opening: 30
    slot_units_full: 40
    restricted_balance_usd: 60.0
    crew_holdback_full: 4
    crew_holdback_part: 2
    spot_fill_pct: 75
    lane_fill_pct: 90
    full_fill_pct: 100
    consolidated_notice_days: 21
  rule: >
    A Renew Business Asset Buyback agreement is collected in runs, and the machines one run carries are settled with the
    customer before the customer consents to the handover. The machines of a run are settled only while the agreement is
    still waiting for machines to be collected and none has been booked in on it. An agreement the customer has accepted runs
    out where the machines never reach the retailer, the day it runs out is written onto it, and no run is settled on it
    thereafter. The units one collection may carry are the machines the agreement covers, capped
    at the full batch allowance the carrier books for a collection on the programme, and the run lifts those machines in
    full. The figure the customer consents to is a whole count of machines.
    The batch allowance the carrier books is read from the agreement's own collection account and from the shipment
    requests already taken on it. Where the freight charges raised on the agreement and not yet settled or waived stand
    above the restricted balance and a shipment request has already been taken on the agreement, the carrier books the
    restricted batch allowance. Where those charges stand above the restricted balance and no shipment request has yet
    been taken on the agreement, the carrier books the opening batch allowance. Where no freight charge raised on the
    agreement stands unsettled above the restricted balance, the carrier books the full batch allowance.
    Machines whose protection cover is in question are held back from the run, and how many they are is counted from the
    claim history of the plans the profile holds. Where the profile holds a protection plan and a claim was filed on it
    within the last three months, the machines held back are counted as the claims filed in those three months. Where the
    profile holds a protection plan and no claim was filed on it within the last three months but a claim was filed within
    the last twelve months, the machines held back are counted as the claims filed in those twelve months that carry no
    decision. Where the profile holds no protection plan, or no claim has been filed on one within the last twelve months,
    no machine is held back on that account.
    A service crew attending the site holds machines back from the run as well, because the crew has machines open on the
    bench while it is there. Where the profile holds a service agreement standing dispatched and a visit was drawn on it
    within the last month, the machines held back while a service crew is attending are the full crew figure. Where the
    profile holds a service agreement standing scheduled and no visit was drawn on it within the last month, the machines
    held back while a service crew is attending are the part crew figure. Where the profile holds neither, no machine is
    held back on that account.
    The share the run lifts follows the room the run has left on the quote, counted in calendar days from the day the units
    are settled to the last day the quote may be accepted, because the machines must reach the retailer while the quote
    still stands. Where the last day the quote may be accepted falls within the programme's pickup lead days, the run is a
    spot lift and the share the run lifts is the spot share. Where that day falls at or beyond the programme's pickup lead
    days but within the consolidated notice days, the run is a lane lift and the share the run lifts is the lane share.
    Where that day falls at or beyond the consolidated notice days, the run is a consolidated lift and the share the run
    lifts is the whole share.
    The units one collection may carry are worked out in one order and no other. The machines the agreement covers are
    first capped at the batch allowance the carrier books. The machines held back for a claim and the machines held back
    while a service crew is attending are then taken off that capped figure, leaving never fewer than none. The share the
    run lifts is applied last to what that step leaves, and the result is rounded down to a whole machine.
  prerequisite: []
  cross_category:
  - category: protection
    as: history
    reads:
    - protection_events.event_type
    - status
    note: the claim history of the plans the profile holds decides how many machines are held back from the run
  - category: service
    as: branch
    reads:
    - status
    - service_events.event_type
    note: an open service agreement and the visits drawn on it decide how many machines are out with a crew
  compute:
  - devices_on_list: "F('device_count')"
  - freight_charged: "SUM('tradein_events','handling_fee_amount', event_type='tradein_handling_fee_charge')"
  - freight_relieved: "SUM('tradein_events','handling_fee_amount', event_type='tradein_handling_fee_waive')"
  - freight_outstanding: "RND(freight_charged - freight_relieved, 2)"
  - requests_taken: "COUNT('tradein_shipping_requests')"
  - batch_allowance: "K('slot_units_restricted') if (freight_outstanding > K('restricted_balance_usd') and requests_taken >= 1) else (K('slot_units_opening') if (freight_outstanding > K('restricted_balance_usd') and requests_taken < 1) else K('slot_units_full'))"
  - plan_held: "1 if EXISTS('protection') else 0"
  - claims_last_quarter: "XCOUNT('protection','protection_events', within_months=3, event_type='protection_claim_file')"
  - claims_last_year: "XCOUNT('protection','protection_events', within_months=12, event_type='protection_claim_file')"
  - decisions_last_year: "XCOUNT('protection','protection_events', within_months=12, event_type='protection_claim_decision')"
  - claim_holdback: "claims_last_quarter if (plan_held == 1 and claims_last_quarter > 0) else (MX(0, claims_last_year - decisions_last_year) if (plan_held == 1 and claims_last_year > 0) else 0)"
  - crew_visits_last_month: "XCOUNT('service','service_events', within_months=1, event_type='service_visit_consume')"
  - crew_holdback: "K('crew_holdback_full') if (EXISTS('service', status='dispatched') and crew_visits_last_month > 0) else (K('crew_holdback_part') if (EXISTS('service', status='scheduled') and crew_visits_last_month == 0) else 0)"
  - quote_days_left: "DAYS(NOW, F('quote_expiry_date'))"
  - run_fill_pct: "K('spot_fill_pct') if quote_days_left < P('bulk_pickup_lead_days') else (K('lane_fill_pct') if quote_days_left < K('consolidated_notice_days') else K('full_fill_pct'))"
  - collectable_units: "MX(0, MN(batch_allowance, devices_on_list) - claim_holdback - crew_holdback)"
  - result: "int(collectable_units * run_fill_pct / 100)"
  compute_basis:
    freight_charged: "The batch allowance the carrier books is read from the agreement's own collection account and from the shipment requests already taken on it."
    freight_relieved: "Where no freight charge raised on the agreement stands unsettled above the restricted balance, the carrier books the full batch allowance."
    requests_taken: "Where those charges stand above the restricted balance and no shipment request has yet been taken on the agreement, the carrier books the opening batch allowance."
    batch_allowance: "Where the freight charges raised on the agreement and not yet settled or waived stand above the restricted balance and a shipment request has already been taken on the agreement, the carrier books the restricted batch allowance. Where those charges stand above the restricted balance and no shipment request has yet been taken on the agreement, the carrier books the opening batch allowance. Where no freight charge raised on the agreement stands unsettled above the restricted balance, the carrier books the full batch allowance."
    plan_held: "Where the profile holds no protection plan, or no claim has been filed on one within the last twelve months, no machine is held back on that account."
    claims_last_quarter: "Where the profile holds a protection plan and a claim was filed on it within the last three months, the machines held back are counted as the claims filed in those three months."
    claims_last_year: "Where the profile holds a protection plan and no claim was filed on it within the last three months but a claim was filed within the last twelve months, the machines held back are counted as the claims filed in those twelve months that carry no decision."
    decisions_last_year: "the machines held back are counted as the claims filed in those twelve months that carry no decision"
    claim_holdback: "Where the profile holds a protection plan and a claim was filed on it within the last three months, the machines held back are counted as the claims filed in those three months. Where the profile holds a protection plan and no claim was filed on it within the last three months but a claim was filed within the last twelve months, the machines held back are counted as the claims filed in those twelve months that carry no decision. Where the profile holds no protection plan, or no claim has been filed on one within the last twelve months, no machine is held back on that account."
    crew_visits_last_month: "Where the profile holds a service agreement standing dispatched and a visit was drawn on it within the last month, the machines held back while a service crew is attending are the full crew figure."
    crew_holdback: "Where the profile holds a service agreement standing dispatched and a visit was drawn on it within the last month, the machines held back while a service crew is attending are the full crew figure. Where the profile holds a service agreement standing scheduled and no visit was drawn on it within the last month, the machines held back while a service crew is attending are the part crew figure. Where the profile holds neither, no machine is held back on that account."
    quote_days_left: "The share the run lifts follows the room the run has left on the quote, counted in calendar days from the day the units are settled to the last day the quote may be accepted, because the machines must reach the retailer while the quote still stands."
    run_fill_pct: "Where the last day the quote may be accepted falls within the programme's pickup lead days, the run is a spot lift and the share the run lifts is the spot share. Where that day falls at or beyond the programme's pickup lead days but within the consolidated notice days, the run is a lane lift and the share the run lifts is the lane share. Where that day falls at or beyond the consolidated notice days, the run is a consolidated lift and the share the run lifts is the whole share."
    collectable_units: "The machines held back for a claim and the machines held back while a service crew is attending are then taken off that capped figure, leaving never fewer than none."
    result: "The units one collection may carry are worked out in one order and no other. The machines the agreement covers are first capped at the batch allowance the carrier books. The machines held back for a claim and the machines held back while a service crew is attending are then taken off that capped figure, leaving never fewer than none. The share the run lifts is applied last to what that step leaves, and the result is rounded down to a whole machine."
  factors:
  - id: carrier_batch_allowance
    effect: parameter
    decides: batch_allowance
    bindings: [freight_charged, freight_relieved, freight_outstanding, requests_taken, batch_allowance]
    ladder:
    - when: "the freight charges raised on the agreement and not yet settled or waived stand above the restricted balance and a shipment request has already been taken on the agreement"
      value: "K('slot_units_restricted')"
    - when: "those charges stand above the restricted balance and no shipment request has yet been taken on the agreement"
      value: "K('slot_units_opening')"
    - when: "otherwise, no freight charge raised on the agreement stands unsettled above the restricted balance"
      value: "K('slot_units_full')"
    baseline:
      batch_allowance: "K('slot_units_full')"
    evidence: [history]
    cross_difficulty: null
  - id: claim_holdback_basis
    effect: method
    decides: claim_holdback
    bindings: [plan_held, claims_last_quarter, claims_last_year, decisions_last_year, claim_holdback]
    ladder:
    - when: "the profile holds a protection plan and a claim was filed on it within the last three months"
      method: "the machines held back are counted as the claims filed in those three months"
    - when: "the profile holds a protection plan and no claim was filed on it within the last three months but a claim was filed within the last twelve months"
      method: "the machines held back are counted as the claims filed in those twelve months that carry no decision"
    - when: "otherwise, the profile holds no protection plan or no claim has been filed on one within the last twelve months"
      method: "no machine is held back on that account"
    baseline:
      claim_holdback: "0"
    evidence: [cross_category, history]
    cross_difficulty: protection
  - id: crew_machine_holdback
    effect: parameter
    decides: crew_holdback
    bindings: [crew_visits_last_month, crew_holdback]
    ladder:
    - when: "the profile holds a service agreement standing dispatched and a visit was drawn on it within the last month, so the machines held back while a service crew is attending are the full crew figure"
      value: "K('crew_holdback_full')"
    - when: "the profile holds a service agreement standing scheduled and no visit was drawn on it within the last month, so the machines held back while a service crew is attending are the part crew figure"
      value: "K('crew_holdback_part')"
    - when: "otherwise, the profile holds neither"
      value: "0"
    baseline:
      crew_holdback: "0"
    evidence: [cross_category, history]
    cross_difficulty: service
  - id: run_lift_share
    effect: parameter
    decides: run_fill_pct
    bindings: [quote_days_left, run_fill_pct]
    ladder:
    - when: "the last day the quote may be accepted falls within the programme's pickup lead days, so the run is a spot lift"
      value: "K('spot_fill_pct')"
    - when: "the last day the quote may be accepted falls at or beyond the programme's pickup lead days but within the consolidated notice days, so the run is a lane lift"
      value: "K('lane_fill_pct')"
    - when: "otherwise, the last day the quote may be accepted falls at or beyond the consolidated notice days, so the run is a consolidated lift"
      value: "K('full_fill_pct')"
    baseline:
      run_fill_pct: "K('full_fill_pct')"
    evidence: [date, history]
    cross_difficulty: null
  baseline:
    rule: >-
      The units one collection may carry are the machines the agreement covers, capped at the full batch allowance the
      carrier books for a collection on the programme, and the run lifts those machines in full. The figure the customer
      consents to is a whole count of machines.
    params: [slot_units_full, full_fill_pct]
  inputs:
    history:
    - {table: tradein_events, aggregate: sum, field: handling_fee_amount, within_months: null, filters: {event_type: tradein_handling_fee_charge}}
    - {table: tradein_events, aggregate: sum, field: handling_fee_amount, within_months: null, filters: {event_type: tradein_handling_fee_waive}}
    - {table: tradein_shipping_requests, aggregate: count, field: tradein_shipping_request_id, within_months: null, filters: {}}
    - {category: protection, table: protection_events, aggregate: count, field: event_type, within_months: 12, filters: {event_type: protection_claim_file}}
    - {category: service, table: service_events, aggregate: count, field: event_type, within_months: 1, filters: {event_type: service_visit_consume}}
    cross_category: [protection, service]
- id: tradein_ext_collection_freight_charge
  base_policy_refs:
  - tradein_device_logistics
  overwrite:
  - base_policy: tradein_device_logistics
    superseded_clause: >-
      The programme's handling fee is charged on a mailed-in device and is waived where the quote is at or above the programme's waiver figure
    replaced_by: >-
      The handling charged for each machine on a palletised collection is neither the programme's handling fee for a mailed-in device nor waived by the programme's waiver figure, and what it comes to is settled by the load alone
  - base_policy: tradein_device_logistics
    superseded_clause: >-
      the freight fee is charged on a palletised collection, which needs the programme's lead days of notice
    replaced_by: >-
      The collection charge is the pallet rate for each pallet the collection is charged for, together with the handling
      charged for each machine the customer consents to hand over, the spot premium the notice attracts and the cover
      uplift the declared value attracts, less the relief the profile's membership carries, and the figure is rounded to
      the cent.
  trigger: on_request
  subject:
  - tradein_handling_fee_charge
  computes: handling_fee_amount
  target_tool: charge_collection_freight_530ef4f1
  params:
    pallet_capacity_units: 8
    lane_opening_usd: 40.0
    short_load_handling_usd: 3.5
    clearing_load_handling_usd: 2.4
    standard_handling_usd: 1.1
    full_load_units: 20
    included_collections_floor: 4
    member_collection_relief_usd: 55.0
    member_residual_relief_usd: 20.0
    spot_premium_usd: 45.0
    repeat_spot_premium_usd: 85.0
    cover_uplift_usd: 38.0
    cover_uplift_stale_usd: 52.0
  rule: >
    A palletised collection on a Renew Business Asset Buyback agreement is charged to the profile when the run is booked,
    that is while the agreement is still waiting for machines to be collected and none has been booked in on it; a
    collection on any other Renew programme, and a batch already booked in, carry no collection charge under this rule. The
    collection charge is fixed only after the machines the customer consents to hand over stand on a shipment request for a freight
    collection. The collection charge is the pallet rate for each pallet the collection is charged for, together with the
    handling charged for each machine the customer consents to hand over, the spot premium the notice attracts and the
    cover uplift the declared value attracts, less the relief the profile's membership carries, and the figure is rounded
    to the cent. The charge is never below nothing. The pallets the collection fills are the machines the customer consents
    to hand over divided by the machines one pallet holds, and the collection is charged for the pallets it fills as they
    stand, a part pallet counting for the share of a pallet it takes. The pallet rate is the programme's freight fee, the
    handling charged for each machine is the standard handling, no spot premium and no cover uplift are added, and no
    relief is taken off.
    The pallet rate follows the freight arrangement the profile already buys from the retailer and how much of a pallet
    the run fills. The rate that arrangement carries is the charge for each pallet moved that the arrangement's own freight
    terms set, and it stands on no order of the profile; what the profile's own orders show is whether it buys under that
    arrangement at all. Where the profile holds a business dock and freight delivery arrangement and the run fills a whole
    pallet or more, the pallet rate is the pallet rate that arrangement carries. Where the profile holds a business dock
    and freight delivery arrangement and the run does not fill a whole pallet, the pallet rate is the pallet rate that
    arrangement carries together with the lane opening charge. Where the profile holds no such arrangement, the pallet
    rate is the programme's freight fee.
    How the pallets the collection is charged for are counted follows the state of the agreement's collection account.
    Where the run leaves a part pallet and a freight charge raised on the agreement stands unsettled, the pallets charged
    for are counted up to the whole pallet. Where the run leaves a part pallet and every freight charge raised on the
    agreement stands settled or waived, the pallets charged for are the whole pallets the run fills together with a further
    half pallet for the part, whatever the size of the part. Where the run
    leaves no part pallet, the pallets charged for are the pallets the run fills as they stand.
    The handling charged for each machine on a palletised collection is neither the programme's handling fee for a
    mailed-in device nor waived by the programme's waiver figure, and what it comes to is settled by the load alone: it
    follows the size of the load and whether the run finishes the batch, and the machines already consented to on the
    agreement are the machines the shipment requests taken on it declare, less the machines the customer consents to hand
    over on this run. Where the
    machines the customer consents to hand over are fewer than a full load and they leave machines of the agreement still
    to be consented to, the handling charged for each machine is the short load handling. Where the machines the customer
    consents to hand over are fewer than a full load and they finish the machines the agreement covers, the handling
    charged for each machine is the clearing load handling. Where the machines the customer consents to hand over are a
    full load or more, the handling charged for each machine is the standard handling.
    The relief the profile's membership carries is read from the collections the membership tier includes in a year and
    from the haul-away credits already redeemed on the membership in the last twelve months. Where the membership tier
    includes at least the collection floor of hauls away in the year and fewer haul-away credits than that have been
    redeemed on it in the last twelve months, the member collection relief is taken off the charge. Where the membership
    tier includes at least the collection floor of hauls away in the year and at least that many haul-away credits have
    been redeemed on it in the last twelve months, the member residual relief is taken off the charge. Where the profile
    holds no membership tier that includes that many hauls away in the year, no relief is taken off the charge.
    The spot premium follows the notice the collection is asked with, counted in calendar days from the day the charge is
    raised to the day the collection is asked for, and how often the carrier has been asked to come. Where the collection
    is asked for within the programme's pickup lead days and more than one shipment request has been taken on the
    agreement, the spot premium is the repeat spot premium. Where the collection is asked for within the programme's
    pickup lead days and no more than one shipment request has been taken on the agreement, the spot premium is the
    opening spot premium. Where the collection is asked for at or beyond the programme's pickup lead days, no spot premium
    is added.
    The cover uplift follows the value the collection declares against the programme's transit cover and how long the
    quote has run, counted in calendar days from the day the quote was given to the day the collection charge is raised. The value the collection declares is the
    amount quoted on the agreement spread over the machines the agreement covers and taken on the machines the customer
    consents to hand over. Where the value the collection declares is above the programme's transit cover and the quote
    has run no longer than the programme's quote validity days, the cover uplift is the standing cover uplift. Where the
    value the collection declares is above the programme's transit cover and the quote has run longer than the programme's
    quote validity days, the cover uplift is the stale quote cover uplift. Where the value the collection declares is at
    or below the programme's transit cover, no cover uplift is added.
  prerequisite:
  - problem: tradein_ext_collection_handover_units
    kind: value_input
    gate: consented_units
    form: state
    policy_source: >-
      The collection charge is fixed only after the machines the customer consents to hand over stand on a shipment
      request for a freight collection.
    condition: >-
      the latest shipment request taken on the agreement for a freight collection carries the machines the customer
      consents to hand over on this run
    resolved_by: confirm_handover_units_5801b6db
    effect: >-
      once the machines consented to stand on the shipment request for the freight collection, the binding that reads the
      machines the customer consents to hand over takes that figure, and the pallets, the handling and the declared value
      of the collection are all worked out from it
  cross_category:
  - category: orders
    as: branch
    reads:
    - variant_name
    - freight_pallet_fee_usd
    note: the charge for each pallet moved set by the freight delivery arrangement's own terms decides the pallet rate of the collection, while the profile's orders show only whether it buys under that arrangement
  - category: membership
    as: history
    reads:
    - free_haul_away_per_year
    - membership_events.event_type
    note: the hauls away the membership tier includes and the haul-away credits already redeemed decide the membership relief
  compute:
  - consented_units: "LATEST('tradein_shipping_requests','units_declared', date_field='created_at', requested_shipment_method='freight_collection')"
  - raw_pallets: "consented_units / K('pallet_capacity_units')"
  - dock_freight_held: "1 if EXISTS('orders', variant_name='Business Dock and Freight Delivery') else 0"
  - pallet_rate: "CPARAM('orders','freight_pallet_fee_usd', variant_name='Business Dock and Freight Delivery') if (dock_freight_held == 1 and raw_pallets >= 1) else ((CPARAM('orders','freight_pallet_fee_usd', variant_name='Business Dock and Freight Delivery') + K('lane_opening_usd')) if (dock_freight_held == 1 and raw_pallets < 1) else P('freight_fee_usd'))"
  - freight_charged: "SUM('tradein_events','handling_fee_amount', event_type='tradein_handling_fee_charge')"
  - freight_relieved: "SUM('tradein_events','handling_fee_amount', event_type='tradein_handling_fee_waive')"
  - freight_outstanding: "RND(freight_charged - freight_relieved, 2)"
  - part_pallet: "1 if raw_pallets > int(raw_pallets) else 0"
  - pallets_charged: "float(int(raw_pallets) + 1) if (part_pallet == 1 and freight_outstanding > 0) else ((int(raw_pallets) + 0.5) if (part_pallet == 1 and freight_outstanding <= 0) else raw_pallets)"
  - machines_consented_before: "MX(0, SUM('tradein_shipping_requests','units_declared', date_field='created_at') - consented_units)"
  - handling_per_machine: "K('short_load_handling_usd') if (consented_units < K('full_load_units') and machines_consented_before + consented_units < F('device_count')) else (K('clearing_load_handling_usd') if (consented_units < K('full_load_units') and machines_consented_before + consented_units >= F('device_count')) else K('standard_handling_usd'))"
  - member_haul_allowance: "CPARAM('membership','free_haul_away_per_year')"
  - member_benefits_redeemed: "XCOUNT('membership','membership_events', within_months=12, event_type='membership_benefit_redeem', benefit_code='haul_away_credit')"
  - member_relief: "K('member_collection_relief_usd') if ((member_haul_allowance or 0) >= K('included_collections_floor') and member_benefits_redeemed < (member_haul_allowance or 0)) else (K('member_residual_relief_usd') if ((member_haul_allowance or 0) >= K('included_collections_floor') and member_benefits_redeemed >= (member_haul_allowance or 0)) else 0)"
  - notice_days: "DAYS(NOW, LATEST('tradein_shipping_requests','requested_collection_date', date_field='created_at', requested_shipment_method='freight_collection'))"
  - runs_asked_for: "COUNT('tradein_shipping_requests')"
  - spot_premium: "K('repeat_spot_premium_usd') if (notice_days < P('bulk_pickup_lead_days') and runs_asked_for > 1) else (K('spot_premium_usd') if (notice_days < P('bulk_pickup_lead_days') and runs_asked_for <= 1) else 0)"
  - collection_value: "RND(F('quoted_amount') / MX(1, F('device_count')) * consented_units, 2)"
  - quote_days_run: "DAYS(F('quote_date'), NOW)"
  - cover_uplift: "K('cover_uplift_usd') if (collection_value > P('insurance_cover_in_transit_usd') and quote_days_run <= P('quote_validity_days')) else (K('cover_uplift_stale_usd') if (collection_value > P('insurance_cover_in_transit_usd') and quote_days_run > P('quote_validity_days')) else 0)"
  - result: "RND(MX(0, pallet_rate * pallets_charged + handling_per_machine * consented_units + spot_premium + cover_uplift - member_relief), 2)"
  compute_basis:
    consented_units: "The collection charge is fixed only after the machines the customer consents to hand over stand on a shipment request for a freight collection."
    raw_pallets: "The pallets the collection fills are the machines the customer consents to hand over divided by the machines one pallet holds, and the collection is charged for the pallets it fills as they stand, a part pallet counting for the share of a pallet it takes."
    dock_freight_held: "what the profile's own orders show is whether it buys under that arrangement at all"
    pallet_rate: "Where the profile holds a business dock and freight delivery arrangement and the run fills a whole pallet or more, the pallet rate is the pallet rate that arrangement carries. Where the profile holds a business dock and freight delivery arrangement and the run does not fill a whole pallet, the pallet rate is the pallet rate that arrangement carries together with the lane opening charge. Where the profile holds no such arrangement, the pallet rate is the programme's freight fee."
    freight_charged: "How the pallets the collection is charged for are counted follows the state of the agreement's collection account."
    freight_relieved: "Where the run leaves a part pallet and every freight charge raised on the agreement stands settled or waived, the pallets charged for are the whole pallets the run fills together with a further half pallet for the part, whatever the size of the part."
    part_pallet: "Where the run leaves no part pallet, the pallets charged for are the pallets the run fills as they stand."
    pallets_charged: "Where the run leaves a part pallet and a freight charge raised on the agreement stands unsettled, the pallets charged for are counted up to the whole pallet. Where the run leaves a part pallet and every freight charge raised on the agreement stands settled or waived, the pallets charged for are the whole pallets the run fills together with a further half pallet for the part, whatever the size of the part. Where the run leaves no part pallet, the pallets charged for are the pallets the run fills as they stand."
    machines_consented_before: "the machines already consented to on the agreement are the machines the shipment requests taken on it declare, less the machines the customer consents to hand over on this run"
    handling_per_machine: "Where the machines the customer consents to hand over are fewer than a full load and they leave machines of the agreement still to be consented to, the handling charged for each machine is the short load handling. Where the machines the customer consents to hand over are fewer than a full load and they finish the machines the agreement covers, the handling charged for each machine is the clearing load handling. Where the machines the customer consents to hand over are a full load or more, the handling charged for each machine is the standard handling."
    member_haul_allowance: "The relief the profile's membership carries is read from the collections the membership tier includes in a year and from the haul-away credits already redeemed on the membership in the last twelve months."
    member_benefits_redeemed: "The relief the profile's membership carries is read from the collections the membership tier includes in a year and from the haul-away credits already redeemed on the membership in the last twelve months."
    member_relief: "Where the membership tier includes at least the collection floor of hauls away in the year and fewer haul-away credits than that have been redeemed on it in the last twelve months, the member collection relief is taken off the charge. Where the membership tier includes at least the collection floor of hauls away in the year and at least that many haul-away credits have been redeemed on it in the last twelve months, the member residual relief is taken off the charge. Where the profile holds no membership tier that includes that many hauls away in the year, no relief is taken off the charge."
    notice_days: "The spot premium follows the notice the collection is asked with, counted in calendar days from the day the charge is raised to the day the collection is asked for, and how often the carrier has been asked to come."
    runs_asked_for: "Where the collection is asked for within the programme's pickup lead days and more than one shipment request has been taken on the agreement, the spot premium is the repeat spot premium."
    spot_premium: "Where the collection is asked for within the programme's pickup lead days and more than one shipment request has been taken on the agreement, the spot premium is the repeat spot premium. Where the collection is asked for within the programme's pickup lead days and no more than one shipment request has been taken on the agreement, the spot premium is the opening spot premium. Where the collection is asked for at or beyond the programme's pickup lead days, no spot premium is added."
    collection_value: "The value the collection declares is the amount quoted on the agreement spread over the machines the agreement covers and taken on the machines the customer consents to hand over."
    quote_days_run: "The cover uplift follows the value the collection declares against the programme's transit cover and how long the quote has run, counted in calendar days from the day the quote was given to the day the collection charge is raised."
    cover_uplift: "Where the value the collection declares is above the programme's transit cover and the quote has run no longer than the programme's quote validity days, the cover uplift is the standing cover uplift. Where the value the collection declares is above the programme's transit cover and the quote has run longer than the programme's quote validity days, the cover uplift is the stale quote cover uplift. Where the value the collection declares is at or below the programme's transit cover, no cover uplift is added."
    result: "The collection charge is the pallet rate for each pallet the collection is charged for, together with the handling charged for each machine the customer consents to hand over, the spot premium the notice attracts and the cover uplift the declared value attracts, less the relief the profile's membership carries, and the figure is rounded to the cent. The charge is never below nothing."
  factors:
  - id: lane_pallet_rate
    effect: parameter
    decides: pallet_rate
    bindings: [dock_freight_held, pallet_rate]
    ladder:
    - when: "the profile holds a business dock and freight delivery arrangement and the run fills a whole pallet or more"
      value: "the pallet rate that arrangement carries"
    - when: "the profile holds a business dock and freight delivery arrangement and the run does not fill a whole pallet"
      value: "the pallet rate that arrangement carries together with K('lane_opening_usd')"
    - when: "otherwise, the profile holds no such arrangement"
      value: "P('freight_fee_usd')"
    baseline:
      pallet_rate: "P('freight_fee_usd')"
    evidence: [cross_category]
    cross_difficulty: orders
  - id: pallet_count_basis
    effect: method
    decides: pallets_charged
    bindings: [freight_charged, freight_relieved, freight_outstanding, part_pallet, pallets_charged]
    ladder:
    - when: "the run leaves a part pallet and a freight charge raised on the agreement stands unsettled"
      method: "the pallets charged for are counted up to the whole pallet"
    - when: "the run leaves a part pallet and every freight charge raised on the agreement stands settled or waived"
      method: "the pallets charged for are the whole pallets the run fills together with a further half pallet for the part, whatever the size of the part"
    - when: "otherwise, the run leaves no part pallet"
      method: "the pallets charged for are the pallets the run fills as they stand"
    baseline:
      pallets_charged: "raw_pallets"
    evidence: [history]
    cross_difficulty: null
  - id: machine_handling_rate
    effect: parameter
    decides: handling_per_machine
    bindings: [machines_consented_before, handling_per_machine]
    ladder:
    - when: "the machines the customer consents to hand over are fewer than a full load and they leave machines of the agreement still to be consented to"
      value: "K('short_load_handling_usd')"
    - when: "the machines the customer consents to hand over are fewer than a full load and they finish the machines the agreement covers"
      value: "K('clearing_load_handling_usd')"
    - when: "otherwise, the machines the customer consents to hand over are a full load or more"
      value: "K('standard_handling_usd')"
    baseline:
      handling_per_machine: "K('standard_handling_usd')"
    evidence: [history]
    cross_difficulty: null
  - id: member_collection_relief
    effect: parameter
    decides: member_relief
    bindings: [member_haul_allowance, member_benefits_redeemed, member_relief]
    ladder:
    - when: "the membership tier includes at least the collection floor of hauls away in the year and fewer haul-away credits than that have been redeemed on it in the last twelve months"
      value: "K('member_collection_relief_usd')"
    - when: "the membership tier includes at least the collection floor of hauls away in the year and at least that many haul-away credits have been redeemed on it in the last twelve months"
      value: "K('member_residual_relief_usd')"
    - when: "otherwise, the profile holds no membership tier that includes that many hauls away in the year"
      value: "0"
    baseline:
      member_relief: "0"
    evidence: [cross_category, history]
    cross_difficulty: membership
  - id: short_notice_spot_premium
    effect: parameter
    decides: spot_premium
    bindings: [notice_days, runs_asked_for, spot_premium]
    ladder:
    - when: "the collection is asked for within the programme's pickup lead days and more than one shipment request has been taken on the agreement"
      value: "K('repeat_spot_premium_usd')"
    - when: "the collection is asked for within the programme's pickup lead days and no more than one shipment request has been taken on the agreement"
      value: "K('spot_premium_usd')"
    - when: "otherwise, the collection is asked for at or beyond the programme's pickup lead days"
      value: "0"
    baseline:
      spot_premium: "0"
    evidence: [date, history]
    cross_difficulty: null
  - id: declared_value_cover_uplift
    effect: parameter
    decides: cover_uplift
    bindings: [collection_value, quote_days_run, cover_uplift]
    ladder:
    - when: "the value the collection declares is above the programme's transit cover and the quote has run no longer than the programme's quote validity days"
      value: "K('cover_uplift_usd')"
    - when: "the value the collection declares is above the programme's transit cover and the quote has run longer than the programme's quote validity days"
      value: "K('cover_uplift_stale_usd')"
    - when: "otherwise, the value the collection declares is at or below the programme's transit cover"
      value: "0"
    baseline:
      cover_uplift: "0"
    evidence: [date]
    cross_difficulty: null
  baseline:
    rule: >-
      The collection charge is the pallet rate for each pallet the collection is charged for, together with the handling
      charged for each machine the customer consents to hand over, the spot premium the notice attracts and the cover
      uplift the declared value attracts, less the relief the profile's membership carries, and the figure is rounded to
      the cent. The pallets the collection fills are the machines the customer consents to hand over divided by the
      machines one pallet holds, and the collection is charged for the pallets it fills as they stand, a part pallet
      counting for the share of a pallet it takes. The pallet rate is the programme's freight fee, the handling charged
      for each machine is the standard handling, no spot premium and no cover uplift are added, and no relief is taken
      off. The charge is never below nothing.
    params: [pallet_capacity_units, standard_handling_usd, freight_fee_usd]
  inputs:
    history:
    - {table: tradein_shipping_requests, aggregate: latest, field: units_declared, within_months: null, filters: {requested_shipment_method: freight_collection}}
    - {table: tradein_shipping_requests, aggregate: sum, field: units_declared, within_months: null, filters: {}}
    - {table: tradein_shipping_requests, aggregate: count, field: tradein_shipping_request_id, within_months: null, filters: {}}
    - {table: tradein_events, aggregate: sum, field: handling_fee_amount, within_months: null, filters: {event_type: tradein_handling_fee_charge}}
    - {category: membership, table: membership_events, aggregate: count, field: event_type, within_months: 12, filters: {event_type: membership_benefit_redeem, benefit_code: haul_away_credit}}
    cross_category: [orders, membership]
- id: tradein_ext_revised_offer_amount
  base_policy_refs:
  - tradein_appraisal_grading
  - tradein_revision_and_decline
  overwrite:
  - base_policy: tradein_appraisal_grading
    superseded_clause: >-
      The amount the appraisal supports is the quoted amount times the percentage the programme's condition ladder gives for the condition found, rounded to the cent.
    replaced_by: >-
      The amount the appraisal supports is the figure the appraisal recorded on the agreement, which covers the devices booked in and whatever deductions the bench found on them.
  - base_policy: tradein_appraisal_grading
    superseded_clause: >-
      counted in business days from the day the device was booked in
    replaced_by: >-
      The days between the batch being booked in and the appraisal being recorded are counted in calendar days, and the programme's appraisal days are read against that calendar count.
  - base_policy: tradein_revision_and_decline
    superseded_clause: >-
      A device already recycled or destroyed under the programme's sanitisation rules cannot be sent back, so on those programmes the revised offer is put before the data is destroyed.
    replaced_by: >-
      a batch whose serials have begun to carry erasure certificates cannot be sent back whole and its offer follows the market as it now stands, while a batch that could still go back whole is offered without an ageing markdown
  - base_policy: tradein_appraisal_grading
    superseded_clause: >-
      Where the amount the appraisal supports falls below the quote by no more than the programme's tolerance, the quote is honoured as written and no revised offer is put to the customer.
    replaced_by: >-
      Where the amount the appraisal supports falls below the figure the agreement stands at by no more than the programme's revision tolerance, the offer is put at the figure the agreement stands at.
  trigger: state_due
  subject:
  - tradein_quote_revise
  computes: revised_amount
  target_tool: put_revised_offer_f86761c2
  params:
    half_gap_share_pct: 50
    stale_markdown_pct: 12
    ageing_markdown_pct: 6
    deep_ageing_days: 21
    ageing_days_floor: 7
    untransferable_cover_deduction_usd: 220.0
    held_cover_deduction_usd: 90.0
  rule: >
    Where an appraisal finds a batch other than the condition declared, a revised offer is owed to the customer and is
    put at the amount the appraisal supports, rounded to the cent. The amount the appraisal supports is the figure the
    appraisal recorded on the agreement, which covers the devices booked in and whatever deductions the bench found on
    them. The revised offer is worked out in one order and no other: it starts from the figure the gap treatment reaches,
    the cover deduction is then taken off that figure, and the ageing markdown is applied last to what that step leaves;
    the figure is rounded to the cent and never falls below nothing.
    The figure the agreement stands at is the amount quoted, or the highest revised offer already put on the agreement
    where that is higher.
    How the gap between the figure the agreement stands at and the amount the appraisal supports is treated follows the
    programme's revision tolerance. Where the amount the appraisal supports falls below the figure the agreement stands at
    by no more than the programme's revision tolerance, the offer is put at the figure the agreement stands at. Where the
    amount the appraisal supports falls below the figure the agreement stands at by more than the programme's revision
    tolerance but by no more than twice that tolerance, the offer is put at the amount the appraisal supports together with
    the half gap share of the difference to the figure the agreement stands at. Where the amount the appraisal supports
    falls below the figure the agreement stands at by more than twice the programme's revision tolerance, the offer is put
    at the amount the appraisal supports as it stands.
    The day the offer's ageing is counted from follows how the batch travelled and how long the appraisal took. The days
    between the batch being booked in and the appraisal being recorded are counted in calendar days, and the programme's
    appraisal days are read against that calendar count. Where the
    batch was booked in more than the programme's quote validity days after the day the quote was given, the days the
    offer has aged are counted from the day the quote was given. Where the batch was booked in within the programme's
    quote validity days of the day the quote was given and the appraisal was recorded more than the programme's appraisal
    days after the batch was booked in, the days the offer has aged are counted from the day the batch was booked in.
    Where the batch was booked in within the programme's quote validity days and the appraisal was recorded within the
    programme's appraisal days of the batch being booked in, the offer has not aged and the days it has aged are counted
    as none.
    The ageing markdown follows the days the offer has aged and whether the retailer has already begun to sanitise the
    batch, since a batch whose serials have begun to carry erasure certificates cannot be sent back whole and its offer
    follows the market as it now stands, while a batch that could still go back whole is offered without an ageing
    markdown. Where the offer has aged more than the deep ageing days and an erasure certificate already stands recorded
    on the agreement, the ageing markdown is the stale markdown. Where the offer has aged more than the ageing days floor
    but no more than the deep ageing days and an erasure certificate already stands recorded on the agreement, the ageing
    markdown is the standing ageing markdown. Where the offer has aged no more than the ageing days floor, or no erasure
    certificate stands recorded on the agreement, no ageing markdown is applied.
    The cover deduction follows the protection cover the profile holds on the batch, because a batch whose cover cannot
    travel with the machines is worth less on resale than one whose cover can, and a plan whose own claim is still under
    review may yet pay out on those machines, which leaves less of the cover to lose. Where the profile holds a protection
    plan standing active on the batch whose cover may not be transferred, the cover deduction is the untransferable cover
    deduction. Where the profile holds a protection plan standing in claim hold on the batch whose cover may not be
    transferred, the cover deduction is the held cover deduction. Where the profile holds no protection plan on the batch
    standing active or in claim hold, or the cover on it may be transferred with the machines, no cover deduction is taken
    off.
  prerequisite: []
  cross_category:
  - category: protection
    as: branch
    reads:
    - status
    - transferable_flag
    note: whether the cover on the batch may travel with the machines, and whether its own claim is still under review, decide the cover deduction
  compute:
  - appraisal_amount: "F('appraised_amount')"
  - standing_offer: "MX(F('quoted_amount'), MAX('tradein_events','revised_amount'))"
  - gap_to_quote: "RND(MX(0, standing_offer - appraisal_amount), 2)"
  - tolerance_amount: "RND(standing_offer * P('revision_tolerance_pct') / 100, 2)"
  - offer_before_deduction: "standing_offer if gap_to_quote <= tolerance_amount else (RND(appraisal_amount + gap_to_quote * K('half_gap_share_pct') / 100, 2) if gap_to_quote <= 2 * tolerance_amount else appraisal_amount)"
  - cover_travels: "1 if CFIELD('protection','transferable_flag', covered_item_serial=F('device_serial')) == True else 0"
  - cover_deduction: "K('untransferable_cover_deduction_usd') if (EXISTS('protection', status='active', covered_item_serial=F('device_serial')) and cover_travels == 0) else (K('held_cover_deduction_usd') if (EXISTS('protection', status='claim_hold', covered_item_serial=F('device_serial')) and cover_travels == 0) else 0)"
  - quote_to_receipt_days: "DAYS(F('quote_date'), F('device_received_date'))"
  - receipt_to_appraisal_days: "DAYS(F('device_received_date'), F('appraised_date'))"
  - ageing_days: "DAYS(F('quote_date'), NOW) if quote_to_receipt_days > P('quote_validity_days') else (DAYS(F('device_received_date'), NOW) if receipt_to_appraisal_days > P('appraisal_days') else 0)"
  - certificates_on_record: "COUNT('tradein_events', event_type='tradein_data_wipe_certify')"
  - ageing_markdown_pct: "K('stale_markdown_pct') if (ageing_days > K('deep_ageing_days') and certificates_on_record > 0) else (K('ageing_markdown_pct') if (ageing_days > K('ageing_days_floor') and certificates_on_record > 0) else 0)"
  - result: "RND(MX(0, (offer_before_deduction - cover_deduction) * (1 - ageing_markdown_pct / 100)), 2)"
  compute_basis:
    standing_offer: "The figure the agreement stands at is the amount quoted, or the highest revised offer already put on the agreement where that is higher."
    gap_to_quote: "How the gap between the figure the agreement stands at and the amount the appraisal supports is treated follows the programme's revision tolerance."
    tolerance_amount: "Where the amount the appraisal supports falls below the figure the agreement stands at by no more than the programme's revision tolerance, the offer is put at the figure the agreement stands at."
    offer_before_deduction: "Where the amount the appraisal supports falls below the figure the agreement stands at by no more than the programme's revision tolerance, the offer is put at the figure the agreement stands at. Where the amount the appraisal supports falls below the figure the agreement stands at by more than the programme's revision tolerance but by no more than twice that tolerance, the offer is put at the amount the appraisal supports together with the half gap share of the difference to the figure the agreement stands at. Where the amount the appraisal supports falls below the figure the agreement stands at by more than twice the programme's revision tolerance, the offer is put at the amount the appraisal supports as it stands."
    cover_travels: "Where the profile holds no protection plan on the batch standing active or in claim hold, or the cover on it may be transferred with the machines, no cover deduction is taken off."
    cover_deduction: "Where the profile holds a protection plan standing active on the batch whose cover may not be transferred, the cover deduction is the untransferable cover deduction. Where the profile holds a protection plan standing in claim hold on the batch whose cover may not be transferred, the cover deduction is the held cover deduction. Where the profile holds no protection plan on the batch standing active or in claim hold, or the cover on it may be transferred with the machines, no cover deduction is taken off."
    quote_to_receipt_days: "Where the batch was booked in more than the programme's quote validity days after the day the quote was given, the days the offer has aged are counted from the day the quote was given."
    receipt_to_appraisal_days: "The days between the batch being booked in and the appraisal being recorded are counted in calendar days, and the programme's appraisal days are read against that calendar count."
    ageing_days: "Where the batch was booked in more than the programme's quote validity days after the day the quote was given, the days the offer has aged are counted from the day the quote was given. Where the batch was booked in within the programme's quote validity days of the day the quote was given and the appraisal was recorded more than the programme's appraisal days after the batch was booked in, the days the offer has aged are counted from the day the batch was booked in. Where the batch was booked in within the programme's quote validity days and the appraisal was recorded within the programme's appraisal days of the batch being booked in, the offer has not aged and the days it has aged are counted as none."
    certificates_on_record: "The ageing markdown follows the days the offer has aged and whether the retailer has already begun to sanitise the batch, since a batch whose serials have begun to carry erasure certificates cannot be sent back whole and its offer follows the market as it now stands, while a batch that could still go back whole is offered without an ageing markdown."
    ageing_markdown_pct: "Where the offer has aged more than the deep ageing days and an erasure certificate already stands recorded on the agreement, the ageing markdown is the stale markdown. Where the offer has aged more than the ageing days floor but no more than the deep ageing days and an erasure certificate already stands recorded on the agreement, the ageing markdown is the standing ageing markdown. Where the offer has aged no more than the ageing days floor, or no erasure certificate stands recorded on the agreement, no ageing markdown is applied."
    result: "The revised offer is worked out in one order and no other: it starts from the figure the gap treatment reaches, the cover deduction is then taken off that figure, and the ageing markdown is applied last to what that step leaves; the figure is rounded to the cent and never falls below nothing."
  factors:
  - id: tolerance_gap_treatment
    effect: method
    decides: offer_before_deduction
    bindings: [standing_offer, gap_to_quote, tolerance_amount, offer_before_deduction]
    ladder:
    - when: "the amount the appraisal supports falls below the figure the agreement stands at by no more than the programme's revision tolerance"
      method: "the offer is put at the figure the agreement stands at"
    - when: "the amount the appraisal supports falls below the figure the agreement stands at by more than the programme's revision tolerance but by no more than twice that tolerance"
      method: "the offer is put at the amount the appraisal supports together with the half gap share of the difference to the figure the agreement stands at"
    - when: "otherwise, the amount the appraisal supports falls below the figure the agreement stands at by more than twice the programme's revision tolerance"
      method: "the offer is put at the amount the appraisal supports as it stands"
    baseline:
      offer_before_deduction: "appraisal_amount"
    evidence: [tier_param, history]
    cross_difficulty: null
  - id: cover_transfer_deduction
    effect: parameter
    decides: cover_deduction
    bindings: [cover_travels, cover_deduction]
    ladder:
    - when: "the profile holds a protection plan standing active on the batch whose cover may not be transferred"
      value: "K('untransferable_cover_deduction_usd')"
    - when: "the profile holds a protection plan standing in claim hold on the batch whose cover may not be transferred"
      value: "K('held_cover_deduction_usd')"
    - when: "otherwise, the profile holds no protection plan on the batch standing active or in claim hold, or the cover on it may be transferred with the machines"
      value: "0"
    baseline:
      cover_deduction: "0"
    evidence: [cross_category]
    cross_difficulty: protection
  - id: offer_ageing_anchor
    effect: method
    decides: ageing_days
    bindings: [quote_to_receipt_days, receipt_to_appraisal_days, ageing_days]
    ladder:
    - when: "the batch was booked in more than the programme's quote validity days after the day the quote was given"
      method: "the days the offer has aged are counted from the day the quote was given"
    - when: "the batch was booked in within the programme's quote validity days and the appraisal was recorded more than the programme's appraisal days after the batch was booked in"
      method: "the days the offer has aged are counted from the day the batch was booked in"
    - when: "otherwise, the batch was booked in within the programme's quote validity days and the appraisal was recorded within the programme's appraisal days"
      method: "the offer has not aged and the days it has aged are counted as none"
    baseline:
      ageing_days: "0"
    evidence: [date]
    cross_difficulty: null
  - id: offer_ageing_markdown
    effect: parameter
    decides: ageing_markdown_pct
    bindings: [certificates_on_record, ageing_markdown_pct]
    ladder:
    - when: "the offer has aged more than the deep ageing days and an erasure certificate already stands recorded on the agreement"
      value: "K('stale_markdown_pct')"
    - when: "the offer has aged more than the ageing days floor but no more than the deep ageing days and an erasure certificate already stands recorded on the agreement"
      value: "K('ageing_markdown_pct')"
    - when: "otherwise, the offer has aged no more than the ageing days floor or no erasure certificate stands recorded on the agreement"
      value: "0"
    baseline:
      ageing_markdown_pct: "0"
    evidence: [history, date]
    cross_difficulty: null
  baseline:
    rule: >-
      Where an appraisal finds a batch other than the condition declared, a revised offer is owed to the customer and is
      put at the amount the appraisal supports, rounded to the cent. The amount the appraisal supports is the figure the
      appraisal recorded on the agreement, which covers the devices booked in and whatever deductions the bench found on
      them.
    params: []
  inputs:
    history:
    - {table: tradein_events, aggregate: max, field: revised_amount, within_months: null, filters: {}}
    - {table: tradein_events, aggregate: count, field: tradein_event_id, within_months: null, filters: {event_type: tradein_data_wipe_certify}}
    cross_category: [protection]
- id: tradein_ext_batch_settlement_credit
  base_policy_refs:
  - tradein_credit_issue_rules
  - tradein_guarantee_floor
  - tradein_data_sanitisation
  - tradein_appraisal_grading
  overwrite:
  - base_policy: tradein_appraisal_grading
    superseded_clause: >-
      counted in business days from the day the device was booked in
    replaced_by: >-
      The allowance a late appraisal attracts follows the days the appraisal took, counted in calendar days from the day the batch was booked in to the day the appraisal was recorded, and the programme's appraisal days are read against that calendar count.
  - base_policy: tradein_data_sanitisation
    superseded_clause: >-
      a business agreement is not closed out until every serial on the asset list carries one
    replaced_by: >-
      A batch is closed out before every serial on it carries its erasure certificate, and the holdback the serials without one attract stands against the credit until they do.
  - base_policy: tradein_credit_issue_rules
    superseded_clause: >-
      the credit is issued once for the batch rather than device by device
    replaced_by: >-
      The credit already issued on the agreement is read from the trade-in history and taken off, so that a batch is never paid for twice.
  - base_policy: tradein_credit_issue_rules
    superseded_clause: >-
      The credit issued is the amount finally settled with the customer, which is the appraised amount where no revision was needed and the revised amount where one was accepted.
    replaced_by: >-
      The amount credited on a batch is the amount settled with the customer, less the credit already issued on the agreement, together with the transit settlement the devices short of the shipment request attract and the allowance a late appraisal attracts, less the premium standing on the profile's protection cover and the holdback the devices without an erasure certificate attract, and the figure is rounded to the cent and never falls below nothing.
  trigger: state_due
  subject:
  - tradein_agreement_credit
  computes: final_credit_amount
  target_tool: credit_batch_settlement_af2cb6f5
  params:
    delayed_allowance_usd: 60.0
    late_allowance_usd: 140.0
    uncertified_device_holdback_usd: 25.0
    certified_device_holdback_usd: 8.0
  rule: >
    A batch that has been appraised is closed out by crediting the customer, and the credit is owed as soon as the amount
    settled stands on the records. A batch is closed out before every serial on it carries its erasure certificate, and the
    holdback the serials without one attract stands against the credit until they do. The day the credit expires is written
    onto the agreement when the credit is issued, and it falls the programme's credit validity days after the day of issue.
    The amount credited is worked out only after the revised offer the appraisal calls for stands on the agreement's
    trade-in history. The amount credited on a batch is the amount settled with the customer,
    less the credit already issued on the agreement, together with the transit settlement the devices short of the
    shipment request attract and the allowance a late appraisal attracts, less the premium standing on the profile's
    protection cover and the holdback the devices without an erasure certificate attract, and the figure is rounded to the
    cent and never falls below nothing. The amount settled is the amount the appraisal supports, the credit already issued
    on the agreement is nothing, and no transit settlement, no late appraisal allowance, no protection premium and no
    erasure holdback are counted.
    Which figure is settled follows the revised offers standing on the agreement's trade-in history, since a revised offer
    put to the customer is the figure the retailer has undertaken to pay. Where more than one revised offer stands on the
    agreement's trade-in history, the amount settled is the highest of them, because the retailer holds to the best offer it
    has put. Where one revised offer stands on the agreement's trade-in history, the amount settled is that revised offer.
    Where no revised offer stands on the agreement's trade-in history, the amount settled is the amount the appraisal
    supports.
    The credit already issued on the agreement is read from the trade-in history and taken off, so that a batch is never
    paid for twice. Where credit has been issued on the agreement and no expiry of unspent credit stands on it, the credit
    already issued on the agreement is taken off in full. Where credit has been issued on the agreement and an expiry of
    unspent credit stands on it, the credit already issued less the credit written off at that expiry is taken off. Where
    no credit has been issued on the agreement, nothing is taken off on that account.
    The transit settlement covers the devices the shipment request declared that were never booked in, and the value of
    each device is the amount quoted spread over the devices the request declared. Where fewer devices were booked in than
    the shipment request declared and the value of each device is at or above the programme's transit cover, the transit
    settlement is the programme's transit cover for each device short. Where fewer devices were booked in than the
    shipment request declared and the value of each device is below the programme's transit cover, the transit settlement
    is the value of each device for each device short. Where every device the shipment request declared was booked in, no
    transit settlement is counted.
    The allowance a late appraisal attracts follows the days the appraisal took, counted in calendar days from the day the
    batch was booked in to the day the appraisal was recorded, and the programme's appraisal days are read against that
    calendar count. Where the appraisal was recorded more than twice the
    programme's appraisal days after the batch was booked in, the late appraisal allowance is added. Where the appraisal
    was recorded more than the programme's appraisal days but no more than twice the programme's appraisal days after the
    batch was booked in, the delayed appraisal allowance is added. Where the appraisal was recorded within the programme's
    appraisal days of the batch being booked in, no allowance is added.
    The premium standing on the profile's protection cover is held back from the credit, because the cover on the devices
    ends with the devices. Where the profile holds a protection plan standing active and premium stands outstanding on it,
    the whole premium outstanding is held back. Where the profile holds a protection plan standing in claim hold and
    premium stands outstanding on it, half the premium outstanding is held back and the rest is carried until the claim is
    decided. Where the profile holds no protection plan with premium outstanding, nothing is held back on that account.
    The holdback the devices without an erasure certificate attract follows the erasure certificates recorded on the
    agreement against the devices booked in. Where the data on the batch stands pending and fewer erasure certificates
    stand recorded on the agreement than the devices booked in, the uncertified device holdback is held back for each
    device booked in without a certificate. Where the data on the batch stands verified by the retailer and fewer erasure
    certificates stand recorded on the agreement than the devices booked in, the certified device holdback is held back
    for each device booked in without a certificate. Where an erasure certificate stands recorded for every device booked
    in, nothing is held back on that account.
  prerequisite:
  - problem: tradein_ext_revised_offer_amount
    kind: value_input
    gate: settled_amount
    form: state
    policy_source: >-
      The amount credited is worked out only after the revised offer the appraisal calls for stands on the agreement's
      trade-in history.
    condition: >-
      the agreement's trade-in history carries the revised offer the appraisal on the batch calls for
    resolved_by: put_revised_offer_f86761c2
    effect: >-
      once the revised offer stands on the trade-in history, the binding that settles which figure is credited takes the
      latest revised offer instead of the amount the appraisal supports
  cross_category:
  - category: protection
    as: branch
    reads:
    - status
    - premium_outstanding
    note: the state of the profile's protection cover and the premium standing on it decide the premium holdback
  compute:
  - appraisal_amount: "F('appraised_amount')"
  - revisions_put: "COUNT('tradein_events', event_type='tradein_quote_revise')"
  - latest_revised: "LATEST('tradein_events','revised_amount', event_type='tradein_quote_revise')"
  - highest_revised: "MAX('tradein_events','revised_amount', event_type='tradein_quote_revise')"
  - settled_amount: "float(highest_revised) if revisions_put > 1 else (float(latest_revised) if revisions_put == 1 else appraisal_amount)"
  - credit_already_issued: "SUM('tradein_events','credit_amount', event_type='tradein_credit_issue')"
  - credit_swept: "SUM('tradein_events','credit_amount', event_type='tradein_credit_expire')"
  - interim_credit_offset: "credit_already_issued if (credit_already_issued > 0 and credit_swept <= 0) else (RND(credit_already_issued - credit_swept, 2) if (credit_already_issued > 0 and credit_swept > 0) else 0)"
  - devices_booked_in: "F('device_count')"
  - devices_declared: "LATEST('tradein_shipping_requests','units_declared', date_field='created_at')"
  - devices_short: "MX(0, devices_declared - devices_booked_in)"
  - value_each_device: "RND(F('quoted_amount') / MX(1, devices_declared), 2)"
  - transit_settlement: "RND(P('insurance_cover_in_transit_usd') * devices_short, 2) if (devices_short > 0 and value_each_device >= P('insurance_cover_in_transit_usd')) else (RND(value_each_device * devices_short, 2) if (devices_short > 0 and value_each_device < P('insurance_cover_in_transit_usd')) else 0)"
  - appraisal_days_taken: "DAYS(F('device_received_date'), F('appraised_date'))"
  - late_allowance: "K('late_allowance_usd') if appraisal_days_taken > 2 * P('appraisal_days') else (K('delayed_allowance_usd') if appraisal_days_taken > P('appraisal_days') else 0)"
  - plan_premium_outstanding: "float(CFIELD('protection','premium_outstanding') or 0)"
  - premium_holdback: "plan_premium_outstanding if (EXISTS('protection', status='active') and plan_premium_outstanding > 0) else (RND(plan_premium_outstanding / 2, 2) if (EXISTS('protection', status='claim_hold') and plan_premium_outstanding > 0) else 0)"
  - certificates_recorded: "COUNT('tradein_events', event_type='tradein_data_wipe_certify')"
  - uncertified_devices: "MX(0, devices_booked_in - certificates_recorded)"
  - erasure_holdback: "RND(K('uncertified_device_holdback_usd') * uncertified_devices, 2) if (F('data_wipe_status') == 'pending' and uncertified_devices > 0) else (RND(K('certified_device_holdback_usd') * uncertified_devices, 2) if (F('data_wipe_status') == 'verified_by_retailer' and uncertified_devices > 0) else 0)"
  - result: "RND(MX(0, settled_amount - interim_credit_offset + transit_settlement + late_allowance - premium_holdback - erasure_holdback), 2)"
  compute_basis:
    revisions_put: "Which figure is settled follows the revised offers standing on the agreement's trade-in history, since a revised offer put to the customer is the figure the retailer has undertaken to pay."
    latest_revised: "Where one revised offer stands on the agreement's trade-in history, the amount settled is that revised offer."
    highest_revised: "Where more than one revised offer stands on the agreement's trade-in history, the amount settled is the highest of them, because the retailer holds to the best offer it has put."
    settled_amount: "Where more than one revised offer stands on the agreement's trade-in history, the amount settled is the highest of them, because the retailer holds to the best offer it has put. Where one revised offer stands on the agreement's trade-in history, the amount settled is that revised offer. Where no revised offer stands on the agreement's trade-in history, the amount settled is the amount the appraisal supports."
    credit_already_issued: "The credit already issued on the agreement is read from the trade-in history and taken off, so that a batch is never paid for twice."
    credit_swept: "Where credit has been issued on the agreement and an expiry of unspent credit stands on it, the credit already issued less the credit written off at that expiry is taken off."
    interim_credit_offset: "Where credit has been issued on the agreement and no expiry of unspent credit stands on it, the credit already issued on the agreement is taken off in full. Where credit has been issued on the agreement and an expiry of unspent credit stands on it, the credit already issued less the credit written off at that expiry is taken off. Where no credit has been issued on the agreement, nothing is taken off on that account."
    devices_declared: "The transit settlement covers the devices the shipment request declared that were never booked in, and the value of each device is the amount quoted spread over the devices the request declared."
    devices_short: "The transit settlement covers the devices the shipment request declared that were never booked in, and the value of each device is the amount quoted spread over the devices the request declared."
    value_each_device: "the value of each device is the amount quoted spread over the devices the request declared"
    transit_settlement: "Where fewer devices were booked in than the shipment request declared and the value of each device is at or above the programme's transit cover, the transit settlement is the programme's transit cover for each device short. Where fewer devices were booked in than the shipment request declared and the value of each device is below the programme's transit cover, the transit settlement is the value of each device for each device short. Where every device the shipment request declared was booked in, no transit settlement is counted."
    appraisal_days_taken: "The allowance a late appraisal attracts follows the days the appraisal took, counted in calendar days from the day the batch was booked in to the day the appraisal was recorded, and the programme's appraisal days are read against that calendar count."
    late_allowance: "Where the appraisal was recorded more than twice the programme's appraisal days after the batch was booked in, the late appraisal allowance is added. Where the appraisal was recorded more than the programme's appraisal days but no more than twice the programme's appraisal days after the batch was booked in, the delayed appraisal allowance is added. Where the appraisal was recorded within the programme's appraisal days of the batch being booked in, no allowance is added."
    plan_premium_outstanding: "The premium standing on the profile's protection cover is held back from the credit, because the cover on the devices ends with the devices."
    premium_holdback: "Where the profile holds a protection plan standing active and premium stands outstanding on it, the whole premium outstanding is held back. Where the profile holds a protection plan standing in claim hold and premium stands outstanding on it, half the premium outstanding is held back and the rest is carried until the claim is decided. Where the profile holds no protection plan with premium outstanding, nothing is held back on that account."
    certificates_recorded: "The holdback the devices without an erasure certificate attract follows the erasure certificates recorded on the agreement against the devices booked in."
    uncertified_devices: "the uncertified device holdback is held back for each device booked in without a certificate"
    erasure_holdback: "Where the data on the batch stands pending and fewer erasure certificates stand recorded on the agreement than the devices booked in, the uncertified device holdback is held back for each device booked in without a certificate. Where the data on the batch stands verified by the retailer and fewer erasure certificates stand recorded on the agreement than the devices booked in, the certified device holdback is held back for each device booked in without a certificate. Where an erasure certificate stands recorded for every device booked in, nothing is held back on that account."
    result: "The amount credited on a batch is the amount settled with the customer, less the credit already issued on the agreement, together with the transit settlement the devices short of the shipment request attract and the allowance a late appraisal attracts, less the premium standing on the profile's protection cover and the holdback the devices without an erasure certificate attract, and the figure is rounded to the cent and never falls below nothing."
  factors:
  - id: settled_figure_basis
    effect: method
    decides: settled_amount
    bindings: [revisions_put, latest_revised, highest_revised, settled_amount]
    ladder:
    - when: "more than one revised offer stands on the agreement's trade-in history"
      method: "the amount settled is the highest revised offer standing on it"
    - when: "one revised offer stands on the agreement's trade-in history"
      method: "the amount settled is that revised offer"
    - when: "otherwise, no revised offer stands on the agreement's trade-in history"
      method: "the amount settled is the amount the appraisal supports"
    baseline:
      settled_amount: "appraisal_amount"
    evidence: [history]
    cross_difficulty: null
  - id: interim_credit_recovery
    effect: parameter
    decides: interim_credit_offset
    bindings: [credit_already_issued, credit_swept, interim_credit_offset]
    ladder:
    - when: "credit has been issued on the agreement and no expiry of unspent credit stands on it"
      value: "the credit already issued on the agreement in full"
    - when: "credit has been issued on the agreement and an expiry of unspent credit stands on it"
      value: "the credit already issued less the credit written off at that expiry"
    - when: "otherwise, no credit has been issued on the agreement"
      value: "0"
    baseline:
      interim_credit_offset: "0"
    evidence: [history]
    cross_difficulty: null
  - id: transit_shortfall_settlement
    effect: parameter
    decides: transit_settlement
    bindings: [devices_declared, devices_short, value_each_device, transit_settlement]
    ladder:
    - when: "fewer devices were booked in than the shipment request declared and the value of each device is at or above the programme's transit cover"
      value: "P('insurance_cover_in_transit_usd') for each device short"
    - when: "fewer devices were booked in than the shipment request declared and the value of each device is below the programme's transit cover"
      value: "the value of each device for each device short"
    - when: "otherwise, every device the shipment request declared was booked in"
      value: "0"
    baseline:
      transit_settlement: "0"
    evidence: [history]
    cross_difficulty: null
  - id: late_appraisal_allowance
    effect: parameter
    decides: late_allowance
    bindings: [appraisal_days_taken, late_allowance]
    ladder:
    - when: "the appraisal was recorded more than twice the programme's appraisal days after the batch was booked in"
      value: "K('late_allowance_usd')"
    - when: "the appraisal was recorded more than the programme's appraisal days but no more than twice the programme's appraisal days after the batch was booked in"
      value: "K('delayed_allowance_usd')"
    - when: "otherwise, the appraisal was recorded within the programme's appraisal days of the batch being booked in"
      value: "0"
    baseline:
      late_allowance: "0"
    evidence: [date]
    cross_difficulty: null
  - id: protection_premium_holdback
    effect: parameter
    decides: premium_holdback
    bindings: [plan_premium_outstanding, premium_holdback]
    ladder:
    - when: "the profile holds a protection plan standing active and premium stands outstanding on it"
      value: "the whole premium outstanding"
    - when: "the profile holds a protection plan standing in claim hold and premium stands outstanding on it"
      value: "half the premium outstanding"
    - when: "otherwise, the profile holds no protection plan with premium outstanding"
      value: "0"
    baseline:
      premium_holdback: "0"
    evidence: [cross_category]
    cross_difficulty: protection
  - id: erasure_certificate_holdback
    effect: parameter
    decides: erasure_holdback
    bindings: [certificates_recorded, uncertified_devices, erasure_holdback]
    ladder:
    - when: "the data on the batch stands pending and fewer erasure certificates stand recorded on the agreement than the devices booked in"
      value: "K('uncertified_device_holdback_usd') for each device booked in without a certificate"
    - when: "the data on the batch stands verified by the retailer and fewer erasure certificates stand recorded on the agreement than the devices booked in"
      value: "K('certified_device_holdback_usd') for each device booked in without a certificate"
    - when: "otherwise, an erasure certificate stands recorded for every device booked in"
      value: "0"
    baseline:
      erasure_holdback: "0"
    evidence: [history]
    cross_difficulty: null
  baseline:
    rule: >-
      The amount credited on a batch is the amount settled with the customer, less the credit already issued on the
      agreement, together with the transit settlement the devices short of the shipment request attract and the allowance
      a late appraisal attracts, less the premium standing on the profile's protection cover and the holdback the devices
      without an erasure certificate attract, and the figure is rounded to the cent and never falls below nothing. The
      amount settled is the amount the appraisal supports, the credit already issued on the agreement is nothing, and no
      transit settlement, no late appraisal allowance, no protection premium and no erasure holdback are counted.
    params: []
  inputs:
    history:
    - {table: tradein_events, aggregate: latest, field: revised_amount, within_months: null, filters: {event_type: tradein_quote_revise}}
    - {table: tradein_events, aggregate: sum, field: credit_amount, within_months: null, filters: {event_type: tradein_credit_issue}}
    - {table: tradein_events, aggregate: count, field: tradein_event_id, within_months: null, filters: {event_type: tradein_data_wipe_certify}}
    - {table: tradein_shipping_requests, aggregate: latest, field: units_declared, within_months: null, filters: {}}
    cross_category: [protection]
- id: tradein_ext_refresh_wave_units
  base_policy_refs:
  - tradein_quote_acceptance
  overwrite:
  - base_policy: tradein_quote_acceptance
    superseded_clause: >-
      the units on the list govern what may be collected
    replaced_by: >-
      The machines a wave carries are the machines the schedule covers, capped at the machines the programme's transit cover will bear, less the machines a live return authorisation holds back, the machines a recent purchase holds back and the machines the profile's store account holds back, and the figure is a whole count of machines and never fewer than none.
  trigger: on_request
  subject:
  - tradein_quote_accept
  computes: units_declared
  target_tool: confirm_refresh_wave_units_923c3678
  params:
    authorized_return_holdback: 3
    received_return_holdback: 1
    recent_purchase_days: 30
    unpaid_order_holdback: 4
    recent_order_holdback: 2
    finance_hold_balance_usd: 5000.0
    finance_holdback_full: 4
    finance_holdback_part: 2
  rule: >
    A Renew Bulk IT Refresh Agreement is collected in waves, and the machines a wave carries are settled with the customer
    before the customer consents to the handover; a wave carries no collection charge under this rule, the freight on a
    refresh schedule being charged under the programme's own freight terms and not here. The machines a wave of the refresh schedule carries are settled only after every
    batch already appraised on the profile stands credited with the amount owed on it. The machines a wave carries are the
    machines the schedule covers, capped at the machines the programme's transit cover will bear, less the machines a live
    return authorisation holds back, the machines a recent purchase holds back and the machines the profile's store account
    holds back, and the figure is a whole count of machines and never fewer than none. The value of each machine is the
    amount quoted on the schedule spread over the machines the schedule covers. The machines the programme's transit cover
    will bear are the machines the schedule covers, and no machines are held back for a live return authorisation, for a
    recent purchase or by the profile's store account.
    How many machines the programme's transit cover will bear follows the value of each machine against that cover, how the
    value of the whole schedule stands against it, and how long the quote has run, counted in calendar days from the day
    the quote was given to the day the machines of the wave are settled. Where the value of each machine is at or above the programme's transit cover and the quote has run
    no longer than the programme's quote validity days, the cover bears one machine. Where the value of each machine is at
    or above the programme's transit cover and the quote has run longer than the programme's quote validity days, the cover
    bears no machine until a fresh quote is written. Where the value of each machine is below the programme's transit cover
    and the value of the whole schedule is above that cover, the cover bears the cover divided by the value of each
    machine, rounded down to a whole machine. Where the value of each machine is below the programme's transit cover and
    the value of the whole schedule is at or below that cover, the cover bears the machines the schedule covers.
    The machines a live return authorisation holds back follow the returns standing on the profile, because goods still
    owed back to the retailer are not put into a trade-in wave. Where a return authorisation on the profile stands
    authorized and no inspection has been recorded on the profile's returns within the last twelve months, the machines
    held back are the authorized return figure. Where a return authorisation on the profile stands received and an inspection
    has been recorded on the profile's returns within the last twelve months, the machines held back are the received
    return figure. Where the profile carries no return authorisation standing authorized or received, no machine is held
    back on that account.
    The machines a recent purchase holds back follow the profile's fulfilled orders, because machines that have only just
    been delivered are returned rather than traded. Where an order on the profile was fulfilled within the recent purchase
    days and a balance stands outstanding on it, the machines held back are the unpaid order figure. Where an order on the
    profile was fulfilled within the recent purchase days and no balance stands outstanding on it, the machines held back
    are the recent order figure. Where no order on the profile was fulfilled within the recent purchase days, no machine
    is held back on that account.
    The machines the profile's store account holds back follow the state of that account and the balance standing on it,
    because machines drawn on a store account are not disposed of while the draw stands against them. Where the profile
    holds a store account standing delinquent and the balance on it is above the finance hold balance, the machines held
    back are the full finance figure. Where the profile holds a store account standing active and the balance on it is
    above the finance hold balance, the machines held back are the part finance figure. Where the profile holds no store
    account with a balance above the finance hold balance, no machine is held back on that account.
  prerequisite:
  - problem: tradein_ext_batch_settlement_credit
    kind: state_gate
    form: state
    gate: tradein_agreements.final_credit_amount
    policy_source: >-
      The machines a wave of the refresh schedule carries are settled only after every batch already appraised on the
      profile stands credited with the amount owed on it.
    condition: >-
      every trade-in agreement on the profile that stands appraised carries the amount credited on it and stands credited
    resolved_by: credit_batch_settlement_af2cb6f5
    effect: >-
      once the appraised batch carries the amount credited on it and stands credited, the state the machines of a further
      wave wait on holds, and the wave may be settled; no figure of this policy moves with it, because what the edge
      carries is the eligibility and not an input
  cross_category:
  - category: returns
    as: branch
    reads:
    - status
    - return_events.event_type
    note: a live return authorisation on the profile decides the machines held back from the wave
  - category: orders
    as: branch
    reads:
    - status
    - fulfilled_date
    - balance_outstanding
    note: a recently fulfilled order and the balance standing on it decide the machines held back from the wave
  - category: credit
    as: branch
    reads:
    - status
    - current_balance
    note: the state of the profile's store account and the balance on it decide the machines held back from the wave
  compute:
  - devices_on_schedule: "F('device_count')"
  - value_each_device: "RND(F('quoted_amount') / MX(1, F('device_count')), 2)"
  - quote_days_run: "DAYS(F('quote_date'), NOW)"
  - cover_units: "1 if (value_each_device >= P('insurance_cover_in_transit_usd') and quote_days_run <= P('quote_validity_days')) else (0 if (value_each_device >= P('insurance_cover_in_transit_usd') and quote_days_run > P('quote_validity_days')) else (int(P('insurance_cover_in_transit_usd') / MX(1, value_each_device)) if (value_each_device < P('insurance_cover_in_transit_usd') and value_each_device * devices_on_schedule > P('insurance_cover_in_transit_usd')) else devices_on_schedule))"
  - returns_booked_in: "XCOUNT('returns','return_events', within_months=12, event_type='returns_inspection_grade_record')"
  - return_holdback: "K('authorized_return_holdback') if (EXISTS('returns', status='authorized') and returns_booked_in == 0) else (K('received_return_holdback') if (EXISTS('returns', status='received') and returns_booked_in > 0) else 0)"
  - order_balance: "float(CFIELD('orders','balance_outstanding', status='fulfilled') or 0)"
  - days_since_fulfilled: "DAYS(CFIELD('orders','fulfilled_date', status='fulfilled') or '1900-01-01', NOW)"
  - order_holdback: "K('unpaid_order_holdback') if (days_since_fulfilled <= K('recent_purchase_days') and order_balance > 0) else (K('recent_order_holdback') if (days_since_fulfilled <= K('recent_purchase_days') and order_balance <= 0) else 0)"
  - account_balance: "float(CFIELD('credit','current_balance') or 0)"
  - finance_holdback: "K('finance_holdback_full') if (EXISTS('credit', status='delinquent') and account_balance > K('finance_hold_balance_usd')) else (K('finance_holdback_part') if (EXISTS('credit', status='active') and account_balance > K('finance_hold_balance_usd')) else 0)"
  - result: "int(MX(0, MN(cover_units, devices_on_schedule) - return_holdback - order_holdback - finance_holdback))"
  compute_basis:
    value_each_device: "The value of each machine is the amount quoted on the schedule spread over the machines the schedule covers."
    quote_days_run: "How many machines the programme's transit cover will bear follows the value of each machine against that cover, how the value of the whole schedule stands against it, and how long the quote has run, counted in calendar days from the day the quote was given to the day the machines of the wave are settled."
    cover_units: "Where the value of each machine is at or above the programme's transit cover and the quote has run no longer than the programme's quote validity days, the cover bears one machine. Where the value of each machine is at or above the programme's transit cover and the quote has run longer than the programme's quote validity days, the cover bears no machine until a fresh quote is written. Where the value of each machine is below the programme's transit cover and the value of the whole schedule is above that cover, the cover bears the cover divided by the value of each machine, rounded down to a whole machine. Where the value of each machine is below the programme's transit cover and the value of the whole schedule is at or below that cover, the cover bears the machines the schedule covers."
    returns_booked_in: "Where a return authorisation on the profile stands authorized and no inspection has been recorded on the profile's returns within the last twelve months, the machines held back are the authorized return figure."
    return_holdback: "Where a return authorisation on the profile stands authorized and no inspection has been recorded on the profile's returns within the last twelve months, the machines held back are the authorized return figure. Where a return authorisation on the profile stands received and an inspection has been recorded on the profile's returns within the last twelve months, the machines held back are the received return figure. Where the profile carries no return authorisation standing authorized or received, no machine is held back on that account."
    order_balance: "Where an order on the profile was fulfilled within the recent purchase days and a balance stands outstanding on it, the machines held back are the unpaid order figure."
    days_since_fulfilled: "The machines a recent purchase holds back follow the profile's fulfilled orders, because machines that have only just been delivered are returned rather than traded."
    order_holdback: "Where an order on the profile was fulfilled within the recent purchase days and a balance stands outstanding on it, the machines held back are the unpaid order figure. Where an order on the profile was fulfilled within the recent purchase days and no balance stands outstanding on it, the machines held back are the recent order figure. Where no order on the profile was fulfilled within the recent purchase days, no machine is held back on that account."
    account_balance: "The machines the profile's store account holds back follow the state of that account and the balance standing on it, because machines drawn on a store account are not disposed of while the draw stands against them."
    finance_holdback: "Where the profile holds a store account standing delinquent and the balance on it is above the finance hold balance, the machines held back are the full finance figure. Where the profile holds a store account standing active and the balance on it is above the finance hold balance, the machines held back are the part finance figure. Where the profile holds no store account with a balance above the finance hold balance, no machine is held back on that account."
    result: "The machines a wave carries are the machines the schedule covers, capped at the machines the programme's transit cover will bear, less the machines a live return authorisation holds back, the machines a recent purchase holds back and the machines the profile's store account holds back, and the figure is a whole count of machines and never fewer than none."
