- id: tradein_revision_and_decline
  subject:
  - tradein_quote_revise
  - tradein_offer_decline
  - tradein_device_return
  rule: A revised offer is put to the customer within the programme's revision notice days of the appraisal, and it names the reason the offer moved. A revised offer is refused by the customer only within
    the decision days of the programme, counted from the day the revised offer was put to the customer. Decision days are counted as calendar days from the day the revised offer was put to the customer,
    which counts as day zero. Where the programme takes silence as acceptance and the decision days run out with no answer, the revised offer is credited; where the programme does not, the device is sent
    back. A customer who declines gets the device back at whoever the programme's return shipping basis names, within the programme's return days, and nothing is charged for the appraisal itself. A device
    already recycled or destroyed under the programme's sanitisation rules cannot be sent back, so on those programmes the revised offer is put before the data is destroyed. A dispute about the appraisal
    is taken within the programme's dispute days of the credit being issued, and it is decided on the photographs and the grading notes on file.
  eligibility:
  - id: decision_days_open
    applies_to:
    - tradein_offer_decline
    kind: time
    condition: A revised offer is refused by the customer only within the decision days of the programme, counted from the day the revised offer was put to the customer.
