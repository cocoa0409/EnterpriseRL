events:
- type: tradein_quote_create
  target: tradein_agreements
  mutation: create
  meaning: A trade-in quote is written for a device the customer describes, and the agreement is opened at that quote.
  grain: one row per quote written for one device or batch
  fields:
    customer_id: the trading customer
    variant_name: the Renew programme the quote is written under
    status: set to the entry state quoted
    quote_date: the day the quote was given
    quote_expiry_date: the last day the quote may be accepted
    device_make: make of the device as the customer states it
    device_model: model of the device as the customer states it
    device_serial: serial or IMEI of the device
    device_category: kind of device
    device_count: devices covered by the agreement
    declared_condition: condition the customer declared
    lock_status: whether the device is locked
    quoted_amount: the amount quoted
    guarantee_floor_amount: the guaranteed minimum where the programme gives one
    shipment_method: how the device is to reach the retailer
    linked_purchase_reference: the purchase the trade-in is set against
    promotion_code: the promotion the quote was written under
    appraised_condition: set to not_yet_appraised until the appraisal is recorded
    data_wipe_status: set to pending until the data is destroyed
  triggers: []
- type: tradein_quote_accept
  target: tradein_agreements
  mutation:
    transition:
      from: quoted
      to: accepted
  meaning: The customer accepts the quote and undertakes to hand the device over.
  grain: one row per agreement; the acceptance day is written onto it
  fields:
    status: moved to accepted
    accepted_date: the day the customer accepted
    shipment_method: the way the customer chose to send the device
  triggers: []
- type: tradein_quote_expire
  target: tradein_agreements
  mutation:
    transition:
    - from: quoted
      to: expired
    - from: accepted
      to: expired
  meaning: The quote runs out because it was not accepted in time, or the accepted device never arrived.
  grain: one row per agreement; the expiry is recorded on the agreement itself
  fields:
    status: moved to expired
    quote_expiry_date: the day the quote ran out
  triggers: []
- type: tradein_device_receive
  target: tradein_agreements
  mutation:
    transition:
      from: accepted
      to: device_received
  meaning: The device reaches the retailer and is booked in against the agreement.
  grain: one row per agreement; the receipt day is written onto it
  fields:
    status: moved to device_received
    device_received_date: the day the device was booked in
    device_serial: serial or IMEI read from the device as booked in
    device_count: devices actually in the shipment
    shipment_method: the way the device actually reached the retailer
  triggers:
  - event: tradein:tradein_handling_fee_charge
    when:
      shipment_method:
      - mail_in_prepaid_label
      - freight_collection
    map:
      customer_id: customer_id
      device_serial: device_serial
- type: tradein_appraisal_record
  target: tradein_agreements
  mutation:
    transition:
      from: device_received
      to: appraised
  meaning: The retailer's appraisal of the device is recorded, with the condition found and the amount it supports.
  grain: one row per agreement; the appraisal result is written onto it
  fields:
    status: moved to appraised
    appraised_date: the day the appraisal was recorded
    appraised_condition: the condition the appraisal found
    appraised_amount: the amount the appraisal supports
    lock_status: whether the device was found locked
    device_make: make read from the device itself
    device_model: model read from the device itself
  triggers:
  - event: tradein:tradein_quote_revise
    when:
      appraised_condition:
      - fair
      - poor
      - broken
      - not_as_declared
    map:
      customer_id: customer_id
      appraised_condition: appraised_condition
      device_serial: device_serial
- type: tradein_agreement_update
  target: tradein_agreements
  mutation: update
  meaning: The device details on the agreement are corrected to what the device actually is, or the linked purchase is attached.
  grain: one row per agreement; each correction overwrites the device details
  fields:
    device_make: make now recorded
    device_model: model now recorded
    device_serial: serial or IMEI now recorded
    linked_purchase_reference: the purchase the trade-in is now set against
    shipment_method: the way the device is now to reach the retailer
  triggers: []
- type: tradein_agreement_credit
  target: tradein_agreements
  mutation:
    transition:
      from: appraised
      to: credited
  meaning: The agreement is closed out by crediting the customer the settled amount.
  grain: one row per agreement; the credited day and final amount are written onto it
  fields:
    status: moved to credited
    credited_date: the day the credit was issued
    final_credit_amount: the amount credited
    credit_expiry_date: the last day the credit may be spent
    data_wipe_status: how far data sanitisation had got when the credit was issued
    device_serial: serial or IMEI of the device credited for
  triggers:
  - event: tradein:tradein_credit_issue
    map:
      customer_id: customer_id
      device_serial: device_serial
- type: tradein_offer_decline
  target: tradein_agreements
  mutation:
    transition:
      from: appraised
      to: declined
  meaning: The customer turns the revised offer down and asks for the device back.
  grain: one row per agreement; the decline day is written onto it
  fields:
    status: moved to declined
    declined_date: the day the customer declined the revised offer
  triggers:
  - event: tradein:tradein_device_return
    map:
      status: returned_to_customer
- type: tradein_device_return
  target: tradein_agreements
  mutation:
    transition:
      from: declined
      to: returned_to_customer
  meaning: The declined device is sent back to the customer.
  grain: one row per agreement; the return day is written onto it
  fields:
    status: moved to returned_to_customer
    returned_date: the day the device was sent back
    shipment_method: the way the device was sent back
  triggers: []
- type: tradein_quote_revise
  target: tradein_events
  meaning: The offer is revised away from the quote because the appraisal found the device other than declared.
  grain: one row per revised offer put to the customer on one agreement
  distinguish_by:
  - revision_reason
  - event_date
  fields:
    revised_amount: the amount the revised offer stands at
    revision_reason: why the offer was revised
    appraised_condition: the condition the appraisal found
    event_date: the day the revised offer was put to the customer
    channel: how the revised offer was put to the customer
    device_serial: serial or IMEI of the device appraised
    tier_at_event: the programme the revision was made under
    customer_id: the trading customer
  triggers: []
- type: tradein_credit_issue
  target: tradein_events
  meaning: Trade-in credit is issued to the customer in the form they chose.
  grain: one row per credit issued on one agreement
  distinguish_by:
  - settlement_method
  - event_date
  fields:
    credit_amount: the credit issued
    settlement_method: how the credit was put into the customer's hands
    event_date: the day the credit was issued
    channel: the channel the credit was issued through
    device_serial: serial or IMEI of the device credited for
    tier_at_event: the programme the credit was issued under
    customer_id: the credited customer
  account: trade_credit
  direction: in
  triggers: []
- type: tradein_promo_boost_issue
  target: tradein_events
  meaning: A promotional or membership uplift is added to the trade-in credit.
  grain: one row per uplift paid under one promotion on one agreement
  distinguish_by:
  - promotion_code
  - event_date
  fields:
    boost_amount: the uplift paid
    promotion_code: the promotion the uplift was paid under
    credit_amount: the credit the uplift was worked out from
    event_date: the day the uplift was paid
    channel: the channel the uplift was paid through
    tier_at_event: the programme the uplift was paid under
    customer_id: the credited customer
  account: trade_credit
  direction: in
  triggers: []
- type: tradein_credit_redeem
  target: tradein_events
  meaning: Issued trade-in credit is spent against a purchase.
  grain: one row per amount of credit spent on one agreement
  distinguish_by:
  - redemption_reference
  - event_date
  fields:
    credit_amount: the credit spent
    redemption_reference: the purchase the credit was spent against
    settlement_method: the form the credit was spent in
    event_date: the day the credit was spent
    channel: the channel the credit was spent through
    customer_id: the spending customer
  account: trade_credit
  direction: out
  triggers: []
- type: tradein_credit_expire
  target: tradein_events
  meaning: Credit left unspent at the end of its life is written off.
  grain: one row per sweep year on one agreement
  distinguish_by:
  - expiry_cycle_year
  fields:
    credit_amount: the credit written off
    expiry_cycle_year: the sweep year the write-off belongs to
    event_date: the day the write-off was booked
    customer_id: the customer whose credit was written off
  account: trade_credit
  direction: out
  triggers: []
- type: tradein_handling_fee_charge
  target: tradein_events
  meaning: A handling or freight fee is charged for appraising or collecting the device.
  grain: one row per fee charged on one agreement
  distinguish_by:
  - handling_fee_amount
  - event_date
  fields:
    handling_fee_amount: the fee charged
    event_date: the day the fee was charged
    channel: the channel the fee arose through
    device_serial: serial or IMEI the fee relates to
    tier_at_event: the programme the fee was charged under
    customer_id: the customer charged
  account: handling_fee_receivable
  direction: in
  triggers: []
- type: tradein_handling_fee_waive
  target: tradein_events
  meaning: A handling or freight fee already charged is waived.
  grain: one row per waiver granted on one agreement
  distinguish_by:
  - fee_waiver_reason
  - event_date
  fields:
    handling_fee_amount: the fee waived
    fee_waiver_reason: why the fee was waived
    event_date: the day the waiver was granted
    channel: the channel the waiver was granted through
    customer_id: the customer relieved of the fee
  account: handling_fee_receivable
  direction: out
  triggers: []
- type: tradein_data_wipe_certify
  target: tradein_events
  meaning: The data on the device is destroyed and the method used is recorded.
  grain: one row per device sanitised on one agreement
  distinguish_by:
  - data_wipe_method
  - device_serial
  fields:
    data_wipe_method: how the data was destroyed
    wipe_certificate_reference: the erasure certificate issued
    device_serial: serial or IMEI of the device sanitised
    event_date: the day the data was destroyed
    customer_id: the trading customer
  triggers: []
measures:
- id: tradein_msr_devices_traded_12m
  window: the rolling twelve calendar months ending on the handling date
  measure: sum of device_count over tradein_agreements of the profile whose status is credited
- id: tradein_msr_credit_issued_12m
  window: the rolling twelve calendar months ending on the handling date
  measure: sum of credit_amount over tradein_credit_issue rows on every agreement of the profile
- id: tradein_msr_boosts_paid_12m
  window: the rolling twelve calendar months ending on the handling date
  measure: count of tradein_promo_boost_issue rows on every agreement of the profile
policies:
- id: tradein_agg_multi_holding
  subject:
  - tradein_quote_create
  rule: A customer may hold as many trade-in agreements as they have devices to trade, and the number on one profile is not limited in itself. A second agreement is never opened on a serial that already
    carries one standing in quoted, accepted, device_received or appraised. A batch agreement covers up to its programme's device count on one record, and each serial inside the batch still counts once
    toward the profile's yearly figures. Where a quote has expired or the device has been sent back, a fresh quote may be written on the same serial, and the earlier agreement stays on file.
  eligibility:
  - id: one_live_agreement_per_serial
    applies_to:
    - tradein_quote_create
    kind: dedup
    condition: A second agreement is never opened on a serial that already carries one standing in quoted, accepted, device_received or appraised.
    evidence_fields:
    - tradein_agreements.device_serial
    - tradein_agreements.status
    - tradein_agreements.device_count
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - tradein_agreements.device_serial
      action_bindings:
        tradein_agreements.device_serial: device_serial
    dedup_contract:
      table: tradein_agreements
      mode: separate_record
      object_bindings:
        device_serial: device_serial
      duplicate_filters:
        status:
        - quoted
        - accepted
        - device_received
        - appraised
      distinct_fields:
      - quote_date
      - variant_name
  params:
    max_per_customer: null
    per_tier:
      Renew Instant Store Quote:
        max_devices_per_agreement: =max_devices_per_agreement
      Renew Mail In Appraisal:
        max_devices_per_agreement: =max_devices_per_agreement
      Renew Trade Up Guarantee Twelve Month:
        max_devices_per_agreement: =max_devices_per_agreement
      Renew Trade Up Guarantee Twenty Four Month:
        max_devices_per_agreement: =max_devices_per_agreement
      Renew Business Asset Buyback:
        max_devices_per_agreement: =max_devices_per_agreement
      Renew Bulk IT Refresh Agreement:
        max_devices_per_agreement: =max_devices_per_agreement
- id: tradein_agg_annual_limits
  subject:
  - tradein_quote_create
  - tradein_credit_issue
  rule: 'Trade-in activity is counted across the whole profile: the devices traded in the rolling year, read from tradein_msr_devices_traded_12m, and the credit issued in the rolling year, read from tradein_msr_credit_issued_12m,
    are compared with the figures of the programme the new quote is written under. Where the device count is already at its limit no further quote is written until the window rolls on, and the customer
    is told the day the oldest device drops out of the count. Where the value cap is already reached the quote is still written but the credit is issued only up to whatever room the cap leaves, and the
    remainder is not carried into the next year. Devices on agreements that expired or were sent back do not count, because no credit was issued; recycling credits do count. A business profile is counted
    together across its named buyers, and a consumer profile only for itself.'
  eligibility: []
  params:
    per_tier:
      Renew Instant Store Quote:
        trade_in_limit_count_per_year: =trade_in_limit_count_per_year
        trade_in_value_cap_per_year_usd: =trade_in_value_cap_per_year_usd
      Renew Mail In Appraisal:
        trade_in_limit_count_per_year: =trade_in_limit_count_per_year
        trade_in_value_cap_per_year_usd: =trade_in_value_cap_per_year_usd
      Renew Trade Up Guarantee Twelve Month:
        trade_in_limit_count_per_year: =trade_in_limit_count_per_year
        trade_in_value_cap_per_year_usd: =trade_in_value_cap_per_year_usd
      Renew Trade Up Guarantee Twenty Four Month:
        trade_in_limit_count_per_year: =trade_in_limit_count_per_year
        trade_in_value_cap_per_year_usd: =trade_in_value_cap_per_year_usd
      Renew Business Asset Buyback:
        trade_in_limit_count_per_year: =trade_in_limit_count_per_year
        trade_in_value_cap_per_year_usd: =trade_in_value_cap_per_year_usd
      Renew Bulk IT Refresh Agreement:
        trade_in_limit_count_per_year: =trade_in_limit_count_per_year
        trade_in_value_cap_per_year_usd: =trade_in_value_cap_per_year_usd
  measures:
  - tradein_msr_devices_traded_12m
  - tradein_msr_credit_issued_12m
- id: tradein_quote_issue
  subject:
  - tradein_quote_create
  - tradein_quote_expire
  rule: A quote is written only for a device of a kind the programme takes and only for an amount inside the programme's quote band; a device the programme does not take is offered recycling instead. A
    quote is accepted only within the quote validity days of the programme, counted from the day the quote was given. Quote validity is counted in calendar days from the quote day, which counts as day zero,
    and a quote whose last day falls on a day the stores are shut is not extended. A quote rests on the condition the customer declares, and the declared condition is what the programme's grade definitions
    describe rather than the customer's own words for it. A device the programme will not take locked, or will not take with liquid ingress, is quoted at nothing and the customer is told so before they
    send it. An expired quote is not honoured later, however small the delay, and a fresh quote is written at the prices then standing.
  eligibility:
  - id: quote_still_valid
    applies_to:
    - tradein_quote_expire
    kind: time
    condition: A quote is accepted only within the quote validity days of the programme, counted from the day the quote was given.
    evidence_fields:
    - tradein_agreements.quote_date
    - tradein_agreements.tradein_agreement_id
    - tradein_agreements.quote_expiry_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - tradein_agreements.tradein_agreement_id
      action_bindings:
        tradein_agreements.tradein_agreement_id: tradein_agreement_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the day the quote was given
      anchor_source: tradein_agreements.quote_date
      relation: not_after
      duration_source: params.quote_validity_days
      unit: calendar_days
      counting_rule: Quote validity is counted in calendar days from the quote day, which counts as day zero, and a quote whose last day falls on a day the stores are shut is not extended.
      boundary: inclusive
  params:
    per_tier:
      Renew Instant Store Quote:
        quote_validity_days: =quote_validity_days
        quote_anchor_basis: =quote_anchor_basis
        device_categories_accepted: =device_categories_accepted
        min_quote_amount_usd: =min_quote_amount_usd
        max_quote_amount_usd: =max_quote_amount_usd
        grade_definitions: =grade_definitions
        locked_device_accepted: =locked_device_accepted
        water_damage_accepted: =water_damage_accepted
      Renew Mail In Appraisal:
        quote_validity_days: =quote_validity_days
        quote_anchor_basis: =quote_anchor_basis
        device_categories_accepted: =device_categories_accepted
        min_quote_amount_usd: =min_quote_amount_usd
        max_quote_amount_usd: =max_quote_amount_usd
        grade_definitions: =grade_definitions
        locked_device_accepted: =locked_device_accepted
        water_damage_accepted: =water_damage_accepted
      Renew Trade Up Guarantee Twelve Month:
        quote_validity_days: =quote_validity_days
        quote_anchor_basis: =quote_anchor_basis
        device_categories_accepted: =device_categories_accepted
        min_quote_amount_usd: =min_quote_amount_usd
        max_quote_amount_usd: =max_quote_amount_usd
        grade_definitions: =grade_definitions
        locked_device_accepted: =locked_device_accepted
        water_damage_accepted: =water_damage_accepted
      Renew Trade Up Guarantee Twenty Four Month:
        quote_validity_days: =quote_validity_days
        quote_anchor_basis: =quote_anchor_basis
        device_categories_accepted: =device_categories_accepted
        min_quote_amount_usd: =min_quote_amount_usd
        max_quote_amount_usd: =max_quote_amount_usd
        grade_definitions: =grade_definitions
        locked_device_accepted: =locked_device_accepted
        water_damage_accepted: =water_damage_accepted
      Renew Business Asset Buyback:
        quote_validity_days: =quote_validity_days
        quote_anchor_basis: =quote_anchor_basis
        device_categories_accepted: =device_categories_accepted
        min_quote_amount_usd: =min_quote_amount_usd
