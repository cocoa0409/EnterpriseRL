name: env_0006_medicare_advantage_plan_sponsor
company: Ridgecrest Health Plans, Inc.

background: |
  Ridgecrest Health Plans, Inc. is a regional Medicare plan sponsor with its home office in
  Ridgecrest and service centres in Alder and Marwick, looking after a little over three hundred
  thousand people with Medicare across the Northfield, Calder, Wexham and Brennan region. It holds
  Centers for Medicare and Medicaid Services contracts for individual Medicare Advantage plans, for
  stand-alone prescription drug plans, for Special Needs Plans and for employer group retiree
  coverage, and it writes Medicare Supplement policies through its own licensed insurance
  subsidiary. Almost everything the company sells is a contract a member holds for a contract year
  and renews each autumn, and almost everything that then happens to the member — a premium billed,
  a claim settled, a prescription dispensed, a card swiped at a grocery till, a coverage request
  decided — is booked as a dated record against that contract. Its Medicare Advantage Health Plans
  are sold as Ridgecrest Advantage Value (HMO), Ridgecrest Advantage Essential (HMO), Ridgecrest
  Advantage Plus (HMO-POS), Ridgecrest Advantage Premier (PPO), Ridgecrest Advantage Signature
  (PPO) and Ridgecrest Advantage Elite Choice (PPO), each held as an enrollment carrying a premium
  account, a cost-share accumulator and a medical claim history. Its Stand-Alone Medicare Part D
  Prescription Drug Plans are sold as Ridgecrest RxSecure Basic (PDP), Ridgecrest RxSecure Value
  (PDP), Ridgecrest RxSecure Select (PDP), Ridgecrest RxSecure Plus (PDP), Ridgecrest RxSecure
  Complete (PDP) and Ridgecrest RxSecure Premier (PDP), each held as an enrollment whose pharmacy
  fills carry the member through the year's drug payment stages. Its Supplemental Benefit Allowance
  Programmes — Ridgecrest Healthy Options Card - Core, Ridgecrest Healthy Options Card - Select,
  Ridgecrest Healthy Options Card - Plus, Ridgecrest Healthy Options Card - Premier, Ridgecrest
  Healthy Options Card - Dual Complete and Ridgecrest Healthy Options Card - Chronic Care Plus —
  open alongside a medical plan and are held as a card whose loads, purchases, refunds and expiries
  are booked entry by entry. Its Medicare Supplement Insurance Policies are written as Ridgecrest
  Medicare Supplement Plan A, Ridgecrest Medicare Supplement Plan B, Ridgecrest Medicare Supplement
  Plan D, Ridgecrest Medicare Supplement Plan K, Ridgecrest Medicare Supplement Plan N, Ridgecrest
  Medicare Supplement Plan G and Ridgecrest Medicare Supplement High Deductible Plan G, each held
  as a policy with its own premium account and its own history of claims crossed over from
  Medicare. Its Optional Supplemental Benefit Riders — the Ridgecrest Preventive Dental Rider, the
  Ridgecrest Vision Plus Rider, the Ridgecrest Hearing Advantage Rider, the Ridgecrest
  Comprehensive Dental Rider, the Ridgecrest Premier Dental Rider and the Ridgecrest Dental Vision
  Hearing Bundle Rider — attach to a medical plan and are held as records of their own, each with
  its own premium and its own dental, vision and hearing claims. Its Special Needs Plans are sold
  as Ridgecrest Dual Complete Essentials (HMO D-SNP), Ridgecrest Dual Complete Advantage (HMO
  D-SNP), Ridgecrest Heart Care Select (HMO C-SNP), Ridgecrest Diabetes Care Select (HMO C-SNP),
  Ridgecrest Lung Care Select (HMO C-SNP) and Ridgecrest Institutional Care (HMO I-SNP), each held
  alongside a care management record built from a health risk assessment. Its Employer and Union
  Group Retiree Plans are sold to employers and unions as Ridgecrest Group Retiree Standard (PPO),
  Ridgecrest Group Retiree Enhanced (PPO), Ridgecrest Group Retiree Premium (PPO), Ridgecrest Group
  Retiree Rx Standard (EGWP), Ridgecrest Group Retiree Rx Enhanced (EGWP) and Ridgecrest Group
  Retiree Rx Premium (EGWP), and are held by retirees whose names reach the plan on their sponsor's
  eligibility file rather than by their own application. The people who telephone member services
  are overwhelmingly older adults, many of them calling about a letter that arrived that morning, a
  bill that looks wrong, a pharmacy that turned them away or a card that would not work at the
  till. Most hold a single medical plan or a single drug plan, but a substantial minority hold two
  or three records at once — a medical plan with an allowance card and a dental rider, or a
  supplement policy alongside a stand-alone drug plan — and often do not know which of their
  records a question belongs to. Their histories are long and uneven: years of quiet premium
  payments interrupted by a hospital stay, a run of pharmacy fills that suddenly changes price in
  the middle of the year, a card that sat unused for months, a rider taken out and let go again.
  Around a fifth of the membership also has Medicaid, and a smaller group are in long-term care
  facilities or are represented by an adult child or a care manager who calls on their behalf.
  Calls are taken from early morning to evening every day of the week, and the company's own
  training tells its representatives to speak plainly, to say what a record actually shows rather
  than what the caller hopes it shows, and never to leave somebody with the impression that
  something has been settled when it has not.

