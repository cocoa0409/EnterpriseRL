difficulties:
  - name: medicare_advantage_member_services
    claim:
      categories: [advantage]
      event_types:
        - advantage_enrollment_created
        - advantage_cms_transmission
        - advantage_coverage_effectuation
        - advantage_application_withdrawal
        - advantage_grace_period_start
        - advantage_grace_period_cure
        - advantage_nonpayment_termination
        - advantage_voluntary_disenrollment
        - advantage_reinstatement
        - advantage_profile_update
        - advantage_premium_charge
        - advantage_premium_payment
        - advantage_premium_credit_adjustment
        - advantage_claim_adjudication
        - advantage_claim_reversal
        - advantage_authorization_request
        - advantage_authorization_decision
        - advantage_appeal_filing
    summary: >
      The people who reach this desk are Medicare Advantage members and, quite often, the adult
      children or appointed representatives calling for them: somebody who wants to join, change
      or leave a plan; somebody holding a bill they do not recognise or a termination notice they
      did not expect; somebody whose scan or surgery was refused before it happened, or whose claim
      was denied after it; and somebody who simply wants to know what a visit will cost them now
      that they have been in hospital. What makes the judgement hard is that the answer moves with
      the tier held, because the six Ridgecrest Advantage plans differ in premium, in medical
      deductible, in every copay and coinsurance, in maximum out-of-pocket, in which benefit
      categories need authorisation and in whether out-of-network care is covered at all
      (advantage_claim_cost_share, advantage_coverage_request_timeliness); with the status the
      enrollment happens to be in, since an application that has not yet been accepted by CMS, a
      coverage that is in its premium grace period, and a coverage terminated for non-payment all
      behave differently from an ordinary active one; with what else the member holds, since a
      stand-alone drug plan, a Special Needs Plan or an optional rider changes what may be elected
      and what the plan pays (advantage_drug_coverage_exclusivity,
      advantage_rider_and_allowance_interaction); and with the history on the record, because how
      much cost share has already accumulated, how many coverage months are unpaid and how long
      ago a denial notice was mailed all decide the outcome. The records the desk works from are
      the enrollment itself, the premium account with its charges, payments and credits, the
      processed medical claim lines with their allowed amounts and denial reasons, the coverage
      requests and the decisions and reconsiderations filed against them, and the enrollment
      intakes the member has raised; the rules over them are partly eligibility gates that turn on
      a status or a recorded decision — coverage must be in force for a claim to be adjudicated or
      a premium to be billed, CMS must have accepted the transaction before coverage is effectuated,
      an underwriter's good-cause determination must be on record before a reinstatement, an
      appointment of representative form must be on file before a third party may appeal — and
      partly quantitative rules that are per tier throughout: premiums and due days, grace periods
      and reinstatement windows (advantage_premium_billing, advantage_premium_delinquency,
      advantage_reinstatement_for_good_cause), cost-share figures and maximum out-of-pocket
      (advantage_claim_cost_share), decision deadlines in days and in hours
      (advantage_coverage_request_timeliness) and appeal filing windows
      (advantage_appeal_rights). In the ordinary run of things a business event follows its
      predecessor — an election is taken, transmitted, accepted and effectuated before a premium is
      ever charged; a premium goes unpaid before a grace period begins and a grace period runs out
      before any termination; a service is authorised before it is rendered and adjudicated before
      it can be appealed; a line is reversed before a corrected one is posted — and reading a
      member's file means seeing where in that natural order they stand. The desk itself performs
      the service actions: recording enrollment intakes, posting payments and credits, adjudicating
      and reversing claim lines, recording coverage requests and issuing decisions, and moving an
      enrollment between its lifecycle states. But the acts that are the member's own may only be
      done by the member, on a handover: electing a plan, withdrawing an application, disenrolling,
      and filing a reconsideration in their own name are theirs to make
      (advantage_disenrollment_and_withdrawal, advantage_appeal_rights), and the desk arranges them
      rather than performing them. Several genuinely possible requests fall outside anything the
      charter decides — a member asking the plan to change their Medicare entitlement dates or
      their Medicare identifier, to guarantee a network provider will stay in network, to create an
      election period that Medicare does not recognise, to quote what a provider will charge before
      the claim arrives, to waive a cost share on hardship grounds, or to pursue a complaint about
      a provider's clinical conduct — and for these the only correct route is a handover to a human
      representative on the ground that no policy covers the request.

  - name: part_d_pharmacy_and_coverage_desk
    claim:
      categories: [pdp]
      event_types:
        - pdp_enrollment_created
        - pdp_cms_transmission
        - pdp_coverage_effectuation
        - pdp_application_withdrawal
        - pdp_grace_period_start
        - pdp_grace_period_cure
        - pdp_nonpayment_termination
        - pdp_voluntary_disenrollment
        - pdp_reinstatement
        - pdp_coverage_stage_update
        - pdp_premium_charge
        - pdp_premium_payment
        - pdp_premium_credit_adjustment
        - pdp_penalty_assessment
        - pdp_penalty_removal
        - pdp_pharmacy_claim_adjudication
        - pdp_pharmacy_claim_reversal
        - pdp_coverage_determination_request
        - pdp_coverage_determination_decision
        - pdp_redetermination_filing
    summary: >
      Callers here are members of the stand-alone Ridgecrest RxSecure drug plans, their
      prescribers' offices and the pharmacies dispensing for them, and the commonest calls are
      about a price that changed at the counter, a fill the pharmacy would not hand over, a bill
      that carries a late enrollment penalty the member does not accept, and a request that the
      plan cover a drug it does not ordinarily cover. The setting varies along several axes at
      once: the six tiers differ in premium and its basic and supplemental split, in deductible and
      which formulary tiers the deductible is taken on, in every tier copay and coinsurance, in
      which tiers carry prior authorisation and step therapy, in extended-supply multipliers and in
      decision deadlines (pdp_point_of_sale_cost_share, pdp_coverage_determination_timeliness); the
      payment stage the member has reached changes what the same drug costs on two consecutive days
      (pdp_coverage_stage_progression); the status of the enrollment matters, since an enrollment
      still awaiting CMS, one in its premium grace period and one terminated for non-payment behave
      quite differently; the low-income subsidy CMS has supplied overrides the tier's own figures
      and removes the penalty altogether (pdp_late_enrollment_penalty); and the history on the
      record decides much of it, because what the member has already paid this year, how many
      transition fills they have used and how long ago a denial notice was dated are all read off
      the file rather than assumed. The records involved are the enrollment with its stage and
      accumulators, the premium account where basic premium, supplemental premium and penalty are
      charged as separate components, the priced pharmacy fills with their negotiated prices and
      rejection reasons, the coverage determinations, exceptions and redeterminations, and the
      enrollment intakes with whatever evidence of earlier creditable coverage the member has
      produced; the governing rules are in part eligibility gates — coverage must be in force on
      the fill date, an approved determination must be on record before a restricted drug is
      dispensed, the prescriber's supporting statement must be in hand before an exception can be
      decided, a certificate of creditable coverage or a verified prior carrier is needed before a
      penalty is removed, and an appointment of representative is needed where somebody other than
      the member or the prescriber files — and in part quantitative rules that are per tier
      throughout: premiums and grace periods (pdp_premium_billing, pdp_premium_delinquency),
      deductibles and out-of-pocket thresholds (pdp_coverage_stage_progression), tier copays,
      coinsurance and the insulin cap (pdp_point_of_sale_cost_share), transition supplies and
      refill-too-soon thresholds (pdp_transition_and_utilization_management), decision deadlines
      measured in hours and redetermination windows measured in days
      (pdp_coverage_determination_timeliness, pdp_redetermination_rights). The natural order of
      this domain's events is worth holding in mind when reading a file: an election is transmitted
      and accepted before coverage is effectuated and a premium charged; a fill is priced before it
      can be reversed; a coverage determination is requested and decided before a redetermination
      can be filed against it; and a penalty is assessed before it can be removed. The desk itself
      prices and reverses fills, posts premium and penalty entries and the credits against them,
      records coverage requests and issues decisions, and restates the member's payment stage; the
      acts reserved to the member are electing or withdrawing a drug plan, disenrolling from it and
      filing a redetermination in their own name (pdp_disenrollment_and_withdrawal,
      pdp_redetermination_rights), and these are handed over rather than performed. Requests that no
      rule here can settle — asking the plan to add a drug to its formulary, to overrule the number
      of uncovered months CMS has counted rather than send a reconsideration, to reimburse a drug
      bought abroad, to guarantee a price for the rest of the year, to change a prescriber's
      clinical decision, or to grant a subsidy the member has not been awarded — leave a handover
      to a human representative as the only correct route.

  - name: supplemental_benefit_allowance_desk
    claim:
      categories: [allowance]
      event_types:
        - allowance_program_created
        - allowance_card_issued
        - allowance_card_activation
        - allowance_card_suspension
        - allowance_card_release
        - allowance_dormancy_flagged
        - allowance_reactivation
        - allowance_program_closure
        - allowance_card_detail_update
        - allowance_quarterly_load
        - allowance_bonus_load
        - allowance_purchase
        - allowance_purchase_refund
        - allowance_period_expiry
        - allowance_balance_forfeiture
        - allowance_catalog_order_placed
        - allowance_catalog_order_cancelled
    summary: >
      This desk hears from members of the Ridgecrest Healthy Options Card programmes, very often
      standing at a checkout or holding a statement: the card was declined, the balance is not what
      they expected, a purchase they do not recognise has appeared, a catalogue order has not
      arrived, or the card has simply stopped working. The setting turns on which of the six card
      programmes they hold, because the tiers differ in how much is loaded and how often, in
      whether anything rolls over and how much, in which spending categories the card is good for
      and what the monthly and quarterly sublimits are, in transaction sizes and daily counts, in
      catalogue minimums and delivery charges, and in dispute and dormancy periods
      (allowance_load_schedule, allowance_eligible_spending, allowance_rollover_and_expiry); on the
      state the programme is in, since a card that has not been activated, one stopped after a
      reported theft, one lying dormant and one on a closed programme all behave differently; on
      what else the member holds, since the programme exists only alongside a medical plan whose
      tier decides which card was opened, and a member may hold a second programme against a
      combined annual cap (allowance_agg_multi_holding, allowance_agg_combined_annual_cap,
      allowance_health_plan_tier_interaction); and on the history on the card, because what has
      already been spent this period, when the last settled purchase was, and which benefit period
      a load belonged to all decide the answer. The records are the programme itself with its
      current balance and card details, the card ledger where loads, purchases, refunds, expiries
      and forfeitures are booked with their benefit periods and retailers, the catalogue orders and
      their cancellations, and the service intakes the member has raised; the rules over them are
      eligibility gates that turn on state and on recorded fact — the linked medical plan must be
      in force before a programme is opened, the programme must be active before a transaction is
      authorised, a closure must be recorded on a member's own intake, a card must be activated
      inside its window, and no second credit may be posted against a purchase already credited —
      together with quantitative rules that are per tier throughout: load amounts and frequency
      (allowance_load_schedule), rollover caps and expiry bases (allowance_rollover_and_expiry),
      per-transaction and per-day limits and category sublimits (allowance_eligible_spending),
      dispute windows, provisional credit and resolution days
      (allowance_purchase_dispute_and_refund), catalogue minimums, delivery charges and
      cancellation windows (allowance_catalog_ordering), and dormancy and suspension periods
      (allowance_dormancy_and_card_security). Ordinarily these events fall in a natural order — a
      programme is opened, a card produced, then activated before any allowance is spendable; an
      allowance is loaded before it can be spent, and spent before it can be refunded or expire; an
      order is placed before it can be cancelled; the medical plan ends before a balance is
      forfeited — and a file is read against that order. The desk itself opens programmes, issues
      and releases cards, posts loads, purchases, refunds and expiries, records catalogue orders
      and cancellations, and flags dormancy; but stopping a card on a report of theft, saying that
      a purchase was never made, activating the card and closing the programme are the member's own
      acts and are handed over to them (allowance_closure_and_forfeiture,
      allowance_purchase_dispute_and_refund, allowance_card_activation_and_replacement). Some
      requests no rule here can decide — asking for the balance to be paid out in cash or moved to
      another member's card, asking for a retailer the network does not include to be accepted,
      asking for an expired allowance to be restored as a goodwill gesture, asking the plan to
      settle a quarrel with a retailer about the quality of goods bought, or asking for a load the
      member's health plan tier does not carry — and these leave a handover to a human
      representative as the only correct route.

  - name: medicare_supplement_policy_desk
    claim:
      categories: [medigap]
      event_types:
        - medigap_application_recorded
        - medigap_underwriting_started
        - medigap_policy_issued
        - medigap_application_declined
        - medigap_grace_period_start
        - medigap_grace_period_cure
        - medigap_policy_lapse
        - medigap_reinstatement
        - medigap_policy_cancellation
        - medigap_rescission
        - medigap_policy_servicing_update
        - medigap_premium_charge
        - medigap_premium_payment
        - medigap_premium_refund
        - medigap_claim_crossover_processed
        - medigap_claim_adjustment
    summary: >
      Callers here are applicants for and holders of the Ridgecrest Medicare Supplement policies,
      and the questions are the ones any supplement carrier hears every day: whether they can be
      accepted now or must answer health questions, why the premium has gone up, why a particular
      bill was not paid when the policy is supposed to cover everything, what happens if a payment
      was missed, and whether they may switch to another plan letter or cancel. The judgement moves
      with the plan letter held, because the seven products differ sharply in which Medicare cost
      sharing they pay and at what share, in whether excess charges are covered at all, in whether
      there is an annual out-of-pocket limit or a high deductible to meet first, in foreign travel
      cover and its lifetime maximum, and in the whole rate structure — base rate, rating method,
      age steps, tobacco and area factors, household and annual payment discounts and the policy
      fee (medigap_benefit_payment, medigap_premium_rating); with the status of the policy, since
      an application in underwriting, a policy in its grace period, one that has lapsed and one that
      has been rescinded each behave differently; with what else the person holds, because a
      supplement pays nothing while a Medicare Advantage plan is in force and sits perfectly well
      beside a stand-alone drug plan (medigap_exclusivity_with_medicare_advantage); and with
      history, since how long the policy has been in force, how much of a high deductible has been
      met this year and how much foreign travel benefit has ever been paid all decide the outcome.
      The records are the policy with its issue age, rating class and issue basis, the premium
      account with its charges, payments and refunds and the rate component each came from, the
      crossover claim lines carrying Medicare's own approved and paid amounts, and the underwriting
      files with their health questionnaire and the underwriter's recorded decision; the rules over
      them are in part eligibility gates — the underwriter's recorded acceptance before any policy
      is issued, Medicare's own determination on record before the supplement pays, the policy in
      force on the date of service, a policyholder's own recorded request before a cancellation, no
      duplicate payment posted against the same remittance reference, and no Medicare Advantage
      enrollment in force at issue — and in part quantitative rules that are per tier throughout:
      base rates, factors and discounts (medigap_premium_rating), grace and reinstatement periods
      (medigap_lapse_and_reinstatement), the free look and cancellation notice
      (medigap_free_look_and_cancellation), open enrollment months, waiting periods and guaranteed
      issue (medigap_open_enrollment_and_guaranteed_issue), coverage shares, limits and deductibles
      (medigap_benefit_payment), filing and payment windows
      (medigap_claim_adjustment_and_recovery) and the contestability period
      (medigap_rescission_for_misrepresentation). These events ordinarily fall in order — an
      application is taken and underwritten before a policy is issued and a premium charged; a
      premium goes unpaid before a grace period begins and a grace period ends before a lapse; a
      lapse precedes any reinstatement; Medicare settles a claim before it crosses over, and a
      crossover line is processed before it can be adjusted — and a file is read against that
      order. The desk itself records applications, issues and declines policies on the
      underwriter's decision, posts premium charges, payments and refunds, processes and adjusts
      crossover lines, and moves a policy through its lifecycle; but returning the policy inside
      the free look period, cancelling it later, withdrawing an application and signing the
      replacement notice are the policyholder's own acts and are handed over
      (medigap_free_look_and_cancellation). Requests that no rule here can settle — asking the plan
      to guarantee acceptance before underwriting has decided, to change the underwriter's recorded
      class, to pay a bill Medicare itself denied, to waive a rate increase that has already been
      noticed, to cover care given outside the United States beyond the foreign travel benefit, or
      to advise which plan letter the caller ought to buy — leave a handover to a human
      representative as the only correct route.

  - name: optional_rider_benefit_desk
    claim:
      categories: [osb]
      event_types:
        - osb_rider_requested
        - osb_rider_accepted
        - osb_rider_effectuation
        - osb_rider_request_withdrawal
        - osb_premium_suspension
        - osb_premium_suspension_cure
        - osb_rider_termination
        - osb_rider_detail_update
        - osb_rider_premium_charge
        - osb_rider_premium_payment
        - osb_rider_premium_credit
        - osb_benefit_claim_processed
        - osb_benefit_claim_reversal
    summary: >
      The callers are members who bought one of the Ridgecrest optional dental, vision or hearing
      riders on top of their medical plan, and their dental offices and hearing centres calling on
      their behalf, and the questions are about what the rider will pay before treatment starts,
      why a claim paid less than expected, why a cleaning or a new pair of frames was refused, why
      a premium is being charged for cover that is not yet paying, and how to get out of the rider
      again. What makes each answer different is the rider held, because the six riders differ in
      premium, in waiting period, in annual maximum and deductible, in the coinsurance for every
      dental category and the flat allowances for frames, lenses and hearing aids, in every
      frequency limit, in out-of-network reimbursement, and in predetermination thresholds and
      minimum holding periods (osb_benefit_payment, osb_frequency_limitations,
      osb_waiting_period); the state of the rider, since one still inside its waiting period, one
      suspended for unpaid premium and one already terminated all behave differently; what else the
      member holds, since a rider only exists alongside a medical plan whose tier decides which
      riders are even sold to them, a second rider brings a combined cap into play, and the medical
      plan's own embedded dental, vision and hearing allowance and the allowance card both have to
      be ordered against the rider rather than added to it (osb_agg_multi_holding,
      osb_agg_combined_rider_maximum, osb_coordination_with_medical_plan); and the history on the
      record, because how much of the annual maximum is left, how many cleanings have been used
      this year and how long ago the last crown or hearing aid was paid for all decide the outcome.
      The records are the rider with its effective date, the date benefits became payable and the
      maximum used so far, the rider premium account with its charges, payments and credits, the
      processed dental, vision and hearing claim lines with their allowed amounts, tooth or eye
      references and denial reasons, and the rider service intakes carrying predeterminations and
      appeals; the rules over them are partly eligibility gates — the medical plan in force before a
      rider is accepted, the request inside the rider enrollment window, the rider active on the
      date of service, an approved predetermination on record above the tier's threshold, a
      member's own recorded request before a cancellation, and no second reversal against a line
      already reversed — and partly quantitative rules that are per tier throughout: rider premiums
      and grace periods (osb_rider_premium_billing_and_posting,
      osb_premium_suspension_and_recovery), waiting periods and their waivers
      (osb_waiting_period), maximums, deductibles, coinsurance and allowances
      (osb_benefit_payment), frequency limits counted in visits a year or months between
      (osb_frequency_limitations), predetermination thresholds, validity and decision days and
      appeal windows (osb_predetermination_and_appeal), and minimum holding months
      (osb_termination_and_cancellation). The ordinary order of these events is that a rider is
      requested and accepted before any premium is charged, the waiting period runs before benefits
      become payable, a claim line is processed before it can be reversed, a predetermination is
      answered before the treatment it covers is claimed, and the medical plan ends before the
      rider does. The desk itself accepts riders, posts rider premium charges, payments and
      credits, processes and reverses benefit claim lines, answers predeterminations and moves a
      rider through its lifecycle; the acts reserved to the member are asking for the rider in the
      first place, withdrawing that request before it takes effect, and cancelling the rider later
      (osb_rider_enrollment, osb_termination_and_cancellation), and these are handed over rather
      than performed. A number of genuinely possible requests fall outside every rule here — asking
      the plan to pay for orthodontia no rider covers, to raise the annual maximum for a particular
      course of treatment, to accept a dentist the network does not include at network rates, to
      reimburse work done before the rider began, to waive a frequency limit on a clinician's
      recommendation alone, or to settle a dispute about the quality of dental work — and for these
      the only correct route is a handover to a human representative.
