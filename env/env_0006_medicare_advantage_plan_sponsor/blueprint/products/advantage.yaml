- id: advantage_coverage_request_timeliness
  subject:
  - advantage_authorization_request
  - advantage_authorization_decision
  rule: 'Every coverage request the plan accepts receives a decision, and the deadline for that decision is fixed by whether the request is standard or expedited and by whether it is an initial determination or a plan-level reconsideration. A standard initial determination is decided within the standard decision days the tier fixes; an expedited initial determination within the expedited decision hours; a standard reconsideration and an expedited reconsideration each within their own tier figures. The plan issues its decision no later than the decision deadline counted from the date the plan received the request. Calendar days are counted from the day after that receipt date and every day of the week counts, expedited hours are counted as full 24-hour periods from the recorded receipt time, a decision issued exactly on the deadline is in time, and the two units are never mixed. The deadline may be extended once by the tier''s extension days, either at the plan''s initiative where more information is needed and the delay is in the member''s interest, or at the member''s request, and the extension taken is recorded on the request. Where the plan does not decide by the deadline the request is treated as an adverse determination and forwarded to the independent review entity without the member having to ask. A request for a service the tier does not list as needing prior authorisation is not refused but decided as an organisation determination, which a member may ask for before receiving the service. Where the member has already made more expedited requests inside the rolling ninety-day window than the expedited review threshold, the plan still decides each request on its clinical merits and never refuses expedition on the ground of frequency alone. A request the plan cannot decide because the clinical information is missing is not denied on that ground alone: the plan asks the prescribing or treating provider for it and takes the extension while it waits.'
  eligibility:
  - id: decision_within_deadline
    applies_to:
    - advantage_authorization_decision
    kind: time
    condition: The plan issues its decision no later than the decision deadline counted from the date the plan received the request.
