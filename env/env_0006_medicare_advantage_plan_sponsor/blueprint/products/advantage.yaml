  rule: 'A member whose coverage was terminated for non-payment may ask to be reinstated where the failure to pay was caused by circumstances beyond their control. The member asks for reinstatement no later than the last day of the reinstatement window counted from the coverage end date recorded on the terminated enrollment. Calendar days are counted from the day after that coverage end date, every day of the week counts, a request made on the final day of the window is still in time, and full 24-hour periods are never used in place of calendar days. A good-cause determination for this enrollment is recorded on the enrollment intake by the plan''s reinstatement reviewer before the reinstatement is processed. Reinstatement restores the original coverage effective date with no gap, and the member must pay every premium owed for the months the coverage is restored for. The member''s own account of why they could not pay is taken as the explanation but never as the determination: without the reviewer''s recorded decision the reinstatement is refused, and a refused member is told which election period is next open to them. Reinstatement is granted once for any one terminated enrollment; a second request on the same enrollment is refused whatever the reason given.'
