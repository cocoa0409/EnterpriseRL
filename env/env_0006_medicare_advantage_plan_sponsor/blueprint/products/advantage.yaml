  rule: Coverage comes into force on the date the tier's effective date rule produces from the day the plan received the completed election form, and never on any other date. CMS has returned an accepting transaction reply code for this enrollment and that code is recorded on the enrollment record. Under the rule first_of_month_following_receipt an election received in any month takes effect on the first day of the next month; an election made in the annual election period takes effect on 1 January of the following contract year however early in the period it was received; and an initial coverage election takes effect on the first day of the month in which the member's Part B entitlement begins. Retroactive effectuation is made only where CMS directs it, and then only back to the number of months the tier allows; the plan never chooses a retroactive date to suit the member's claims. Where CMS rejects the transaction the enrollment is not effectuated, the member keeps whatever coverage they had, and the rejection reason is explained to them in plain words. Effectuation mails the member identification card and opens the first premium charge; it never opens a premium charge for a month before the coverage effective date.
