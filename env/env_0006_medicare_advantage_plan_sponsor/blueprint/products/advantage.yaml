- id: advantage_disenrollment_and_withdrawal
  subject:
  - advantage_voluntary_disenrollment
  - advantage_application_withdrawal
  rule: 'Only the member, or a representative they have appointed in writing, may end a Medicare Advantage enrollment or withdraw an application; the plan never ends coverage at a provider''s or a relative''s request. A request to end the enrollment is recorded on the enrollment intake with the request action voluntary_disenrollment and an intake status of recorded, awaiting_member_signature or submitted_to_cms before the enrollment is ended. A voluntary disenrollment takes effect on the last day of the month in which the plan received the request, and the member keeps full coverage until that day. An application withdrawn before the coverage effective date leaves no coverage period at all: the enrollment is cancelled before effective, the disenrollment reason recorded is withdrawn_before_effective, and any premium already paid is refunded in full. A member who disenrolls outside an election period returns to Original Medicare rather than to another Medicare Advantage plan, and the plan says so plainly before the request is recorded. Ending the medical plan ends the supplemental benefit allowance card and every optional supplemental benefit rider on the same day, and whatever allowance is left on the card is forfeited rather than paid out. A disenrollment already transmitted to CMS is withdrawn only by a further member request inside the same month; the plan never reverses it on its own initiative.'
  eligibility:
  - id: member_request_recorded
    applies_to:
    - advantage_voluntary_disenrollment
    - advantage_application_withdrawal
    kind: state
    condition: A request to end the enrollment is recorded on the enrollment intake with the request action voluntary_disenrollment and an intake status of recorded, awaiting_member_signature or submitted_to_cms before the enrollment is ended.
    evidence_fields:
    - advantage_enrollment_requests.advantage_enrollment_request_id
    - advantage_enrollment_requests.request_action
    - advantage_enrollment_requests.intake_status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - advantage_enrollment_requests.advantage_enrollment_request_id
      action_bindings:
        advantage_enrollment_requests.advantage_enrollment_request_id: advantage_enrollment_request_id
    state_contract:
      field: advantage_enrollment_requests.intake_status
      allowed:
      - recorded
      - awaiting_member_signature
      - submitted_to_cms
  params:
    per_tier:
      Ridgecrest Advantage Value (HMO):
        disenrollment_effective_rule: =disenrollment_effective_rule
      Ridgecrest Advantage Essential (HMO):
        disenrollment_effective_rule: =disenrollment_effective_rule
      Ridgecrest Advantage Plus (HMO-POS):
