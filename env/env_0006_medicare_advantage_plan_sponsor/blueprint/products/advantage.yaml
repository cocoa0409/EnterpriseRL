- id: advantage_premium_billing
  subject:
  - advantage_premium_charge
  rule: 'The plan bills the monthly plan premium of the tier held for each coverage month from the coverage effective date to the coverage end date, and the charge falls due on the premium due day of that coverage month. The enrollment is in a status of active or premium_grace_period on the day the charge is posted. A quarterly billing frequency bills three coverage months in one charge posted in the first of those months; what the member owes for a coverage month never changes with the frequency. Where the member qualifies for the low-income premium subsidy the full premium is still charged and the subsidy is posted separately as a credit adjustment, so the amount owed is always the charge less the credits posted against it. The Part B premium reduction the tier carries is never billed or credited here: Social Security applies it to the member''s Part B premium, and it never appears on the plan premium account. No premium is charged for a coverage month beginning after the coverage end date, and a charge already posted for such a month is relieved by a credit adjustment rather than left outstanding.'
