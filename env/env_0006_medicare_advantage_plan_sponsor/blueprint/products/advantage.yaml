events:
- type: advantage_enrollment_created
  target: advantage_enrollments
  mutation: create
  meaning: A member's election of a Ridgecrest Medicare Advantage plan is accepted and an enrollment record is opened for the contract year.
  grain: One row per Medicare Advantage enrollment a member holds for one contract year.
  fields:
    advantage_enrollment_id: Reference number the plan assigns to this enrollment.
    customer_id: The member whose election this is.
    variant_name: The official plan name elected.
    status: Opens at enrollment_submitted, the lifecycle entry state.
    plan_year: Contract year the election belongs to.
    contract_plan_segment: CMS contract, plan benefit package and segment elected.
    application_received_date: Date the plan received the completed election form.
    coverage_effective_date: First day coverage will be in force once CMS accepts the transaction.
    election_period_code: Election period the member is enrolling under.
    premium_payment_method: Payment method the member chose on the election form.
    premium_billing_frequency: Billing cadence assigned at election.
    primary_care_provider_npi: Primary care provider chosen on the election form; empty on tiers that need none.
    premium_balance_due: 'Opens at zero: nothing has been billed yet.'
    moop_accumulated: Opens at zero for the contract year.
    disenrollment_reason_code: Opens at not_applicable.
  triggers:
  - event: advantage:advantage_cms_transmission
    map:
      advantage_enrollment_id: advantage_enrollment_id
      status: cms_transaction_pending
- type: advantage_cms_transmission
  target: advantage_enrollments
  mutation:
    transition:
      from: enrollment_submitted
      to: cms_transaction_pending
  meaning: The accepted election is transmitted to CMS on the next daily enrollment file and waits for the transaction reply.
  grain: One row per enrollment awaiting a CMS reply.
  fields:
    advantage_enrollment_id: The enrollment transmitted.
    status: Moves to cms_transaction_pending.
    cms_transaction_reply_code: Left empty until CMS replies, then written with the reply code received.
  triggers: []
- type: advantage_coverage_effectuation
  target: advantage_enrollments
  mutation:
    transition:
      from: cms_transaction_pending
      to: active
  meaning: CMS accepts the enrollment transaction and the coverage effective date arrives, so coverage comes into force and the member identification card is mailed.
  grain: One row per enrollment brought into force.
  fields:
    advantage_enrollment_id: The enrollment brought into force.
    customer_id: The member now covered.
    variant_name: The plan tier carried forward unchanged; it decides which supplemental allowance programme opens alongside the medical plan.
    status: Moves to active.
    coverage_effective_date: Confirmed first day of coverage as CMS accepted it.
    id_card_mailed_date: Date the member identification card was mailed.
  triggers:
  - event: advantage:advantage_premium_charge
    map:
      advantage_enrollment_id: advantage_enrollment_id
      customer_id: customer_id
  - event: allowance:allowance_program_created
    when:
      variant_name:
      - Ridgecrest Advantage Essential (HMO)
      - Ridgecrest Advantage Plus (HMO-POS)
      - Ridgecrest Advantage Signature (PPO)
      - Ridgecrest Advantage Elite Choice (PPO)
    map:
      customer_id: customer_id
- type: advantage_application_withdrawal
  target: advantage_enrollments
  mutation:
    transition:
    - from: enrollment_submitted
      to: cancelled_before_effective
    - from: cms_transaction_pending
      to: cancelled_before_effective
  meaning: The member withdraws their application before coverage has begun, so no coverage period ever exists.
  grain: One row per application withdrawn before its effective date.
  fields:
    advantage_enrollment_id: The application withdrawn.
    customer_id: The member who withdrew it.
    status: Moves to cancelled_before_effective.
    coverage_end_date: Set equal to the coverage effective date that will now never be reached.
    disenrollment_reason_code: Set to withdrawn_before_effective.
  triggers: []
- type: advantage_grace_period_start
  target: advantage_enrollments
  mutation:
    transition:
      from: active
      to: premium_grace_period
  meaning: A monthly plan premium is still unpaid after its due day, so the enrollment enters the premium grace period and a delinquency notice is sent.
  grain: One row per delinquency that puts an enrollment into the grace period.
  fields:
    advantage_enrollment_id: The delinquent enrollment.
    status: Moves to premium_grace_period.
    premium_balance_due: The outstanding premium as at the day the grace period began.
  triggers: []
- type: advantage_grace_period_cure
  target: advantage_enrollments
  mutation:
    transition:
      from: premium_grace_period
      to: active
  meaning: The full outstanding premium reaches the plan before the grace period ends, so the enrollment returns to active with no break in coverage.
  grain: One row per delinquency cured within its grace period.
  fields:
    advantage_enrollment_id: The enrollment restored.
    status: Returns to active.
    premium_balance_due: Falls to zero once the outstanding premium is settled.
  triggers: []
- type: advantage_nonpayment_termination
  target: advantage_enrollments
  mutation:
    transition:
      from: premium_grace_period
      to: terminated_for_nonpayment
  meaning: The grace period expires with premium still outstanding, so coverage is ended involuntarily for non-payment.
  grain: One row per enrollment terminated for non-payment.
  fields:
    advantage_enrollment_id: The enrollment terminated.
    customer_id: The member whose coverage ends.
    status: Moves to terminated_for_nonpayment.
    coverage_end_date: Last day of the month in which the grace period expired.
    disenrollment_reason_code: Set to nonpayment_of_premium.
  triggers:
  - event: allowance:allowance_balance_forfeiture
    map:
      customer_id: customer_id
- type: advantage_voluntary_disenrollment
  target: advantage_enrollments
  mutation:
    transition:
    - from: active
      to: disenrolled
    - from: premium_grace_period
      to: disenrolled
  meaning: The member elects to leave the plan during an election period open to them, and coverage ends at the end of that month.
  grain: One row per enrollment the member ends voluntarily.
  fields:
    advantage_enrollment_id: The enrollment being ended.
    customer_id: The member ending it.
    status: Moves to disenrolled.
    coverage_end_date: Last day of the month in which the plan received the request.
    disenrollment_reason_code: voluntary_election, or other_plan_election where the member is moving to another plan.
  triggers:
  - event: allowance:allowance_balance_forfeiture
    map:
      customer_id: customer_id
  - event: osb:osb_rider_termination
    map:
      customer_id: customer_id
- type: advantage_reinstatement
  target: advantage_enrollments
  mutation:
    transition:
      from: terminated_for_nonpayment
      to: active
  meaning: A good-cause determination restores coverage that had been terminated for non-payment, without a gap in the coverage period.
  grain: One row per enrollment reinstated after an involuntary termination.
  fields:
    advantage_enrollment_id: The enrollment reinstated.
    status: Returns to active.
    coverage_end_date: Cleared, because the coverage period is continuous again.
    disenrollment_reason_code: Returns to not_applicable.
  triggers: []
- type: advantage_profile_update
  target: advantage_enrollments
  mutation: update
  meaning: 'The member changes the service details the plan holds on the enrollment: the primary care provider, how the premium is paid, how often it is billed, or the reissue of an identification card.'
  grain: One row per enrollment record whose service details are amended.
  fields:
    advantage_enrollment_id: The enrollment amended.
    primary_care_provider_npi: The primary care provider now on record.
    premium_payment_method: The payment method now on record.
    premium_billing_frequency: The billing cadence now on record.
    id_card_mailed_date: Date a replacement identification card was mailed.
  triggers: []
- type: advantage_premium_charge
  target: advantage_premium_ledger
  meaning: The plan premium for one coverage month is billed to the member's premium account.
  grain: One row per coverage month billed on one enrollment.
  distinguish_by:
  - billing_period
  - posted_date
  - amount
  fields:
    advantage_premium_entry_id: Reference number of this ledger entry.
    advantage_enrollment_id: The enrollment billed.
    customer_id: The member billed.
    event_type: advantage_premium_charge.
    billing_period: The coverage month this charge pays for.
    posted_date: Date the charge was posted.
    amount: The plan premium billed for that coverage month.
    payment_channel: not_applicable on a charge.
    balance_effect: not_applicable on a charge.
    adjustment_reason_code: not_applicable on a charge.
  account: premium_receivable
  direction: in
  triggers: []
- type: advantage_premium_payment
  target: advantage_premium_ledger
  meaning: Money the member paid toward the plan premium is posted against the oldest unpaid coverage month.
  grain: One row per payment received and posted on one enrollment.
  distinguish_by:
  - posted_date
  - amount
  - payment_channel
  - remittance_reference
  fields:
    advantage_premium_entry_id: Reference number of this ledger entry.
    advantage_enrollment_id: The enrollment credited.
    customer_id: The member who paid.
    event_type: advantage_premium_payment.
    billing_period: The oldest coverage month the money is applied to.
    posted_date: Date the money was posted.
    amount: Amount received.
    payment_channel: How the money reached the plan.
    balance_effect: Whether the posting left part of the balance outstanding, settled it exactly, or exceeded it.
    remittance_reference: The payment reference the member reads from their bank or card statement, recorded exactly as stated.
  account: premium_receivable
  direction: out
  triggers:
  - event: advantage:advantage_grace_period_cure
    when:
      balance_effect: settles_balance
    map:
      advantage_enrollment_id: advantage_enrollment_id
      status: active
- type: advantage_premium_credit_adjustment
  target: advantage_premium_ledger
  meaning: A credit is posted against a named premium charge, because the rate changed retroactively, the member's low-income subsidy applies, the charge was raised in error, or CMS disenrolled the member retroactively.
  grain: One row per credit posted against one named premium charge.
  distinguish_by:
  - source_premium_entry_id
  - adjustment_reason_code
  - posted_date
  - amount
  fields:
    advantage_premium_entry_id: Reference number of this ledger entry.
    advantage_enrollment_id: The enrollment credited.
    customer_id: The member credited.
    event_type: advantage_premium_credit_adjustment.
    billing_period: The coverage month of the charge being relieved.
    posted_date: Date the credit was posted.
    amount: Amount of the credit.
    payment_channel: not_applicable on a credit.
    balance_effect: Whether the credit left part of the charge outstanding, settled it exactly, or exceeded it.
    source_premium_entry_id: The single premium charge this credit applies to.
    adjustment_reason_code: Why the credit was granted.
  account: premium_receivable
  direction: out
  triggers: []
- type: advantage_claim_adjudication
  target: advantage_medical_claims
  meaning: One line of a medical claim is adjudicated and the member's liability for it is fixed.
  grain: One row per claim line the plan adjudicates for one member.
  distinguish_by:
  - date_of_service
  - service_category
  - provider_npi
  - line_sequence
  - plan_allowed_amount
  fields:
    advantage_claim_id: Reference number of this adjudicated line.
    advantage_enrollment_id: The enrollment the service was rendered under.
    customer_id: The member treated.
    event_type: advantage_claim_adjudication.
    date_of_service: Date the service was rendered.
    processed_date: Date adjudication finished.
    service_category: Benefit category, which selects the cost-share parameter.
    place_of_service: Where the service was delivered.
    network_status: The provider's contract standing on the date of service.
    billed_amount: What the provider billed.
    plan_allowed_amount: The contracted amount cost share is taken from.
    member_cost_share: What the member owes on this line.
    claim_status: paid, denied or pended.
    denial_reason_code: Why the line was denied; not_applicable when paid.
    provider_npi: The rendering provider.
    authorization_reference: The coverage request that authorised the service; empty where none is needed.
    source_claim_id: The reversed line this corrected line replaces; empty on an original line.
    line_sequence: Position of this line inside the submitted claim.
  account: moop_accrual
  direction: in
  triggers: []
- type: advantage_claim_reversal
  target: advantage_medical_claims
  meaning: An already adjudicated claim line is reversed, backing out the member liability it had posted, so that a corrected line can take its place.
  grain: One row per adjudicated claim line reversed.
  distinguish_by:
  - source_claim_id
  - processed_date
  - member_cost_share
  fields:
    advantage_claim_id: Reference number of this reversal.
    advantage_enrollment_id: The enrollment the reversed line sits on.
    customer_id: The member whose liability is backed out.
    event_type: advantage_claim_reversal.
    date_of_service: Carried over from the line being reversed.
    processed_date: Date the reversal was posted.
    service_category: Carried over from the line being reversed.
    network_status: Carried over from the line being reversed.
    plan_allowed_amount: Carried over from the line being reversed.
    member_cost_share: The negative of the liability the reversed line posted.
    claim_status: reversed, or adjusted where a corrected line follows.
    source_claim_id: The single originally adjudicated claim line this reversal applies to.
    line_sequence: Carried over from the line being reversed.
  account: moop_accrual
  direction: out
  triggers:
  - event: advantage:advantage_claim_adjudication
    when:
      claim_status: adjusted
    map:
      advantage_enrollment_id: advantage_enrollment_id
      customer_id: customer_id
      source_claim_id: source_claim_id
- type: advantage_authorization_request
  target: advantage_service_requests
  meaning: A member or their provider asks the plan, before the service is given, whether it will be covered and on what terms.
  grain: One row per coverage request received for one service.
  distinguish_by:
  - requested_service_code
  - received_date
  - received_time
  - request_type
  fields:
    advantage_service_request_id: Reference number of this coverage request.
    advantage_enrollment_id: The enrollment the request is made under.
    customer_id: The member the request concerns.
    event_type: advantage_authorization_request.
    request_type: Standard or expedited, prior authorisation or organisation determination.
    requested_service_code: The procedure or item requested.
    received_date: Date the plan received the request; the anchor of the decision deadline.
    received_time: Time of day the request arrived, used for expedited requests measured in hours.
    decision_outcome: Opens at pending.
    requesting_provider_npi: The provider who submitted it; empty when the member submitted it.
    representative_form_on_file: Whether an appointment of representative form is needed and held.
    request_channel: How the request reached the plan.
  triggers:
  - event: advantage:advantage_authorization_decision
    map:
      advantage_enrollment_id: advantage_enrollment_id
      customer_id: customer_id
      request_type: request_type
      requested_service_code: requested_service_code
      source_service_request_id: advantage_service_request_id
- type: advantage_authorization_decision
  target: advantage_service_requests
  meaning: The plan disposes of a coverage request or a reconsideration and records the decision and the reason for it.
  grain: One row per decision the plan issues on one named request.
  distinguish_by:
  - source_service_request_id
  - decision_date
  - decision_outcome
  fields:
    advantage_service_request_id: Reference number of this decision record.
    advantage_enrollment_id: The enrollment the decision is made under.
    customer_id: The member the decision concerns.
    event_type: advantage_authorization_decision.
    request_type: Carried over from the request being decided.
    requested_service_code: The procedure or item decided on.
    decision_date: Date the plan mailed or conveyed the decision.
    decision_outcome: Fully favourable, partially favourable, adverse, dismissed or withdrawn.
    decision_rationale_code: The reason recorded with the disposition.
    extension_applied: Whether the deadline was extended and at whose initiative.
    source_service_request_id: The single request or appeal this decision disposes of.
  triggers: []
- type: advantage_appeal_filing
  target: advantage_service_requests
  meaning: The member, or someone appointed in writing, asks the plan to reconsider an adverse determination or a denied claim line.
  grain: One row per reconsideration filed against one named determination.
  distinguish_by:
  - source_service_request_id
  - received_date
  - request_type
  fields:
    advantage_service_request_id: Reference number of this reconsideration.
    advantage_enrollment_id: The enrollment the appeal is filed under.
    customer_id: The member appealing.
    event_type: advantage_appeal_filing.
    request_type: Standard or expedited reconsideration.
    requested_service_code: The procedure or item in dispute.
    received_date: Date the plan received the reconsideration.
    received_time: Time of day it arrived, used for expedited reconsiderations.
    decision_outcome: Opens at pending.
    source_service_request_id: The single adverse determination this reconsideration is filed against.
    representative_form_on_file: Whether an appointment of representative form is needed and held.
    request_channel: How the reconsideration reached the plan.
  triggers:
  - event: advantage:advantage_authorization_decision
    map:
      advantage_enrollment_id: advantage_enrollment_id
      customer_id: customer_id
      request_type: request_type
      source_service_request_id: advantage_service_request_id
measures:
- id: advantage_msr_ytd_member_cost_share
  window: 'The current contract year to date: from 1 January of the plan_year on the enrollment through the handling date inclusive.'
  measure: Sum of member_cost_share on advantage_claim_adjudication rows for the enrollment, less the member_cost_share backed out by advantage_claim_reversal rows whose processed_date falls in the same window; denied lines contribute nothing.
- id: advantage_msr_unpaid_premium_months
  window: From the billing_period of the oldest advantage_premium_charge not yet fully relieved, through the handling date inclusive.
  measure: Count of distinct billing_period values on advantage_premium_charge rows whose amount has not been fully offset by advantage_premium_payment and advantage_premium_credit_adjustment rows applied to the same coverage month.
- id: advantage_msr_expedited_requests_90d
  window: Rolling 90 calendar days ending on the handling date inclusive.
  measure: Count of advantage_authorization_request rows for the member whose request_type is expedited_prior_authorization or expedited_organization_determination.
policies:
- id: advantage_agg_multi_holding
  subject:
  - advantage_enrollment_created
  rule: 'A member may hold only one Ridgecrest Medicare Advantage enrollment at a time, because Medicare allows only one Medicare Advantage election to be in force in any coverage month. No other Medicare Advantage enrollment for the same member is in a status of enrollment_submitted, cms_transaction_pending, active or premium_grace_period on the day the new election is recorded. Where such an enrollment exists, the new election is recorded only as a plan change: the earlier enrollment is ended with the disenrollment reason other_plan_election on the day before the new coverage begins, so the member is never left holding two plans in one coverage month and never left with a gap between them. An enrollment for a later contract year that begins only after the earlier enrollment has already ended is not a duplicate; enrollments are told apart by contract year and coverage effective date, and the same member may show several ended enrollments in their history. Where the member asks to hold two plans at once the request is refused and the reason explained, because the plan cannot record what Medicare will not accept.'
  eligibility:
  - id: single_enrollment_in_force
    applies_to:
    - advantage_enrollment_created
    kind: dedup
    condition: No other Medicare Advantage enrollment for the same member is in a status of enrollment_submitted, cms_transaction_pending, active or premium_grace_period on the day the new election is recorded.
    evidence_fields:
    - advantage_enrollments.customer_id
    - advantage_enrollments.status
    - advantage_enrollments.plan_year
    - advantage_enrollments.coverage_effective_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - advantage_enrollments.customer_id
      action_bindings:
        advantage_enrollments.customer_id: customer_id
    dedup_contract:
      table: advantage_enrollments
      mode: separate_record
      object_bindings:
        customer_id: customer_id
      duplicate_filters:
        status:
        - enrollment_submitted
        - cms_transaction_pending
        - active
        - premium_grace_period
      distinct_fields:
      - plan_year
      - coverage_effective_date
  params:
    max_per_customer: 1
- id: advantage_election_period_eligibility
  subject:
  - advantage_enrollment_created
  - advantage_cms_transmission
  rule: An election is accepted only under an election period that is open to the member on the day the plan receives the completed election form, and the plan records which one it relied on. The member's permanent residence recorded on their profile lies in one of the counties in the elected plan's service area. The enrollment request on file carries an election period code, and where that code names a special election period the request also carries the member's matching attestation. The annual election period runs from 15 October to 7 December for coverage beginning the following 1 January; the Medicare Advantage open enrollment period runs from 1 January to 31 March and allows one change to a member already enrolled in a Medicare Advantage plan; the initial coverage election period surrounds the member's first entitlement to Part A and Part B. A special election period is open only for the circumstance its code names, and the plan may take the member's own account of that circumstance, but it may never take the member's word in place of the Part A and Part B entitlement dates held on the profile. An election for a plan whose approved enrollment capacity is already reached is held rather than refused, and the member is told where they stand in the queue. Where no election period is open the election is refused, the member is told the date the next one opens, and the plan never back-dates a receipt date to reach a period that has closed.
  eligibility:
  - id: service_area_residence
    applies_to:
    - advantage_enrollment_created
    kind: caller_fact
    condition: The member's permanent residence recorded on their profile lies in one of the counties in the elected plan's service area.
    evidence_fields:
    - customers.customer_id
    - customers.residence_county
    - customers.residence_zip_code
    evidence_contract:
      authority: mixed
      timing: pre_action
      correlation_keys:
      - - customers.customer_id
      action_bindings:
        customers.customer_id: customer_id
  - id: election_period_recorded
    applies_to:
    - advantage_enrollment_created
    - advantage_cms_transmission
    kind: caller_fact
    condition: The enrollment request on file carries an election period code, and where that code names a special election period the request also carries the member's matching attestation.
    evidence_fields:
