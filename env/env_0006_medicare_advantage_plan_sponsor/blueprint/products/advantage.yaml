- id: advantage_premium_delinquency
  subject:
  - advantage_grace_period_start
  - advantage_grace_period_cure
  - advantage_nonpayment_termination
  rule: 'A monthly premium charge still unpaid after its due day puts the enrollment into the premium grace period, and the member is sent a delinquency notice naming the amount owed and the last day of that grace period. The grace period runs for the number of calendar days the tier held fixes, counted from the day the plan posted the first unpaid monthly premium charge. The plan has not received the full outstanding premium by the last day of the grace period counted from the day the plan posted the first unpaid monthly premium charge. Calendar days are counted from the day after that posting date, every day of the week counts including weekends and public holidays, the last day of the grace period is itself still inside the grace period, and full 24-hour periods are never used in place of calendar days. Where the full outstanding premium reaches the plan at any time before that day ends, the enrollment returns to active with no break in coverage and keeps its original coverage effective date. A partial payment does not cure the delinquency however small the remainder, and it never restarts the clock: the grace period keeps running on the original posting date. Termination for non-payment ends coverage on the last day of the month in which the grace period expired, and the disenrollment reason recorded is nonpayment_of_premium. While the enrollment is in the grace period the member keeps full coverage and claims are adjudicated normally; the plan never withholds care during the grace period.'
  eligibility:
  - id: grace_period_exhausted
    applies_to:
    - advantage_nonpayment_termination
    kind: time
    condition: The plan has not received the full outstanding premium by the last day of the grace period counted from the day the plan posted the first unpaid monthly premium charge.
    evidence_fields:
    - advantage_premium_ledger.advantage_premium_entry_id
