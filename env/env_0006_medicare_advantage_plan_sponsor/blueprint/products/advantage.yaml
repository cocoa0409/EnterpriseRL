- id: advantage_premium_posting
  subject:
  - advantage_premium_payment
  - advantage_premium_credit_adjustment
  rule: 'Money the member pays is posted against the oldest unpaid coverage month first, and the balance effect recorded on the entry says whether it left part of the balance outstanding, settled it exactly, or exceeded it. The enrollment is in a status of active, premium_grace_period or terminated_for_nonpayment on the day the money is posted. No payment entry carrying the same remittance reference and the same amount is already posted on this enrollment. An overpayment is refunded by the channel the money arrived on and is never held against a coverage month the plan has not yet billed. A credit adjustment always names the single premium charge it relieves and the reason it was granted, and may never exceed the amount of that charge; a credit larger than one charge is split across the charges it relieves. Money that arrives after termination is accepted only while the reinstatement window is still open and is refunded in full where reinstatement is not granted; it never by itself restores coverage. A member''s statement that they have paid is a reason to look for the money, never a reason to post it: nothing is credited until the payment is on the plan''s record.'
