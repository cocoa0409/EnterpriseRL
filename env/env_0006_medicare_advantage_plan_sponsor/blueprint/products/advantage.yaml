- id: advantage_drug_coverage_exclusivity
  subject:
  - advantage_enrollment_created
  rule: A member enrolled in a Ridgecrest Medicare Advantage plan that includes Part D prescription drug coverage may not at the same time hold a stand-alone Medicare Part D prescription drug plan. No stand-alone Part D enrollment for the same member is in force on the day the new Medicare Advantage coverage begins, unless the tier being elected is one that carries no Part D coverage. Where a stand-alone drug plan is in force and the elected tier includes Part D, accepting the Medicare Advantage election ends the stand-alone drug plan on the day before the new coverage begins, and the member is told this before the election is recorded. A member electing the tier that carries no Part D coverage keeps their stand-alone drug plan, and the plan checks that they hold one before recording the election, because a Medicare Advantage member with no drug coverage pays the full price at the pharmacy and may later owe a late enrollment penalty. A Special Needs Plan enrollment and an ordinary Medicare Advantage enrollment are mutually exclusive in the same way, and a member who would qualify for a Special Needs Plan is told what they would gain and lose before either election is recorded.
  eligibility:
  - id: no_conflicting_drug_plan
    applies_to:
    - advantage_enrollment_created
    kind: state
    condition: No stand-alone Part D enrollment for the same member is in force on the day the new Medicare Advantage coverage begins, unless the tier being elected is one that carries no Part D coverage.
    evidence_fields:
    - pdp_enrollments.pdp_enrollment_id
    - pdp_enrollments.customer_id
    - pdp_enrollments.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - pdp_enrollments.customer_id
      action_bindings:
        pdp_enrollments.customer_id: customer_id
    state_contract:
      field: pdp_enrollments.status
      allowed:
      - disenrolled
      - terminated_for_nonpayment
      - cancelled_before_effective
  params:
    per_tier:
      Ridgecrest Advantage Value (HMO):
        part_d_included: =part_d_included
        part_d_annual_deductible: =part_d_annual_deductible
      Ridgecrest Advantage Essential (HMO):
        part_d_included: =part_d_included
