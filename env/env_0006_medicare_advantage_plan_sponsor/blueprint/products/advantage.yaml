- id: advantage_enrollment_record_maintenance
  subject:
  - advantage_profile_update
  rule: 'The member may change the primary care provider on record, the premium payment method and the billing frequency while the enrollment is open, and may ask for a replacement identification card at any time. The enrollment is in a status of active, premium_grace_period or cms_transaction_pending when the change is recorded. A primary care provider change takes effect on the first day of the month after it is recorded, and on a tier that requires a primary care provider the enrollment is never left without one. A change of premium payment method takes effect from the next coverage month billed; a change to withholding from a Social Security payment is requested of Social Security by the plan and can take two coverage months to begin, during which the member continues to be billed directly and is told to keep paying. A change of billing frequency takes effect at the start of the next quarter, and the plan never re-bills coverage months it has already billed at the old frequency. Reissuing an identification card costs the member the tier''s reissue fee and is recorded by the date the replacement was mailed. The member''s name, address, Medicare identifier and entitlement dates are not changed here: they belong to the member profile and to Medicare, and a member asking to change them is told which record holds them and who can change it.'
  eligibility:
  - id: enrollment_open_for_changes
    applies_to:
    - advantage_profile_update
    kind: state
    condition: The enrollment is in a status of active, premium_grace_period or cms_transaction_pending when the change is recorded.
    evidence_fields:
    - advantage_enrollments.advantage_enrollment_id
    - advantage_enrollments.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - advantage_enrollments.advantage_enrollment_id
      action_bindings:
        advantage_enrollments.advantage_enrollment_id: advantage_enrollment_id
    state_contract:
      field: advantage_enrollments.status
      allowed:
      - active
      - premium_grace_period
      - cms_transaction_pending
  params:
    per_tier:
      Ridgecrest Advantage Value (HMO):
        primary_care_provider_required: =primary_care_provider_required
        id_card_reissue_fee: =id_card_reissue_fee
        referral_required: =referral_required
      Ridgecrest Advantage Essential (HMO):
        primary_care_provider_required: =primary_care_provider_required
        id_card_reissue_fee: =id_card_reissue_fee
        referral_required: =referral_required
