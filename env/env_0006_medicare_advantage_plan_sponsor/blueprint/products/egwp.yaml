- id: egwp_arrears_and_termination
  subject:
  - egwp_arrears_start
  - egwp_arrears_cure
  - egwp_group_termination
  rule: A retiree contribution unpaid after its due day moves the enrollment into arrears, and both the retiree and the sponsor are told. The contribution has been outstanding past the last day of the grace period counted from the day the plan posted the first unpaid retiree contribution charge. Calendar days are counted from the day after that posting date, every day of the week counts, the last day of the grace period is itself inside it, and full 24-hour periods are never used in place of calendar days. Cover carries on in full throughout the grace period, and no claim is refused because a contribution is late. Paying the outstanding amount in full at any time before that day ends returns the enrollment to ordinary standing with no break in cover. Where the grace period ends unpaid, whether the enrollment ends is the sponsor's decision under its group contract, and the plan does not end cover on its own initiative. Where the sponsor ends the group contract entirely, retirees get the tier's notice days, are told the exact date cover ends, and are told which individual plans they could move to and by when.
  eligibility:
  - id: grace_period_exhausted
    applies_to:
    - egwp_group_termination
    kind: time
    condition: The contribution has been outstanding past the last day of the grace period counted from the day the plan posted the first unpaid retiree contribution charge.
    evidence_fields:
    - egwp_premium_ledger.egwp_premium_entry_id
    - egwp_premium_ledger.posted_date
    - egwp_enrollments.egwp_enrollment_id
    - egwp_enrollments.premium_balance_due
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - egwp_enrollments.egwp_enrollment_id
        - egwp_premium_ledger.egwp_premium_entry_id
      action_bindings:
        egwp_enrollments.egwp_enrollment_id: egwp_enrollment_id
        egwp_premium_ledger.egwp_premium_entry_id: egwp_premium_entry_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the day the plan posted the first unpaid retiree contribution charge
      anchor_source: egwp_premium_ledger.posted_date
      relation: not_before
      duration_source: variants.contribution_grace_period_days
      unit: calendar_days
      counting_rule: Calendar days are counted from the day after that posting date, every day of the week counts, the last day of the grace period is itself inside it, and full 24-hour periods are never used in place of calendar days.
      boundary: inclusive
  params:
    per_tier:
      Ridgecrest Group Retiree Standard (PPO):
        contribution_grace_period_days: =contribution_grace_period_days
        group_contract_notice_days: =group_contract_notice_days
        retiree_notice_days_on_group_termination: =retiree_notice_days_on_group_termination
      Ridgecrest Group Retiree Enhanced (PPO):
        contribution_grace_period_days: =contribution_grace_period_days
        group_contract_notice_days: =group_contract_notice_days
        retiree_notice_days_on_group_termination: =retiree_notice_days_on_group_termination
      Ridgecrest Group Retiree Premium (PPO):
