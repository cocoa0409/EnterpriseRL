- id: egwp_roster_reconciliation_handling
  subject:
  - egwp_roster_reconciliation
  rule: The plan reconciles each sponsor's roster against its own enrollment records on the tier's reconciliation cycle, so that nobody is covered who should not be and nobody is billed for cover that ended. The reconciliation finding names the single change record it puts right, and that record stands at not_reconciled or disputed_with_sponsor. Where the plan and the sponsor disagree, the sponsor has the tier's dispute window to answer, and the enrollment stands as it is while the disagreement is worked out. A retiree is never left without cover because of a reconciliation dispute, and is never billed for a month the reconciliation shows they were not enrolled. Where a reconciliation shows the retiree was taken off the roster earlier than the plan knew, every contribution charged for those months is credited back and any claims paid are recovered from the providers rather than from the retiree. Findings the sponsor never answers inside the dispute window are written off in the retiree's favour, and the record says so plainly. Each finding names the single change record it puts right, because one file cycle may carry several changes for one retiree.
  eligibility:
  - id: reconciliation_names_open_change
    applies_to:
    - egwp_roster_reconciliation
    kind: state
    condition: The reconciliation finding names the single change record it puts right, and that record stands at not_reconciled or disputed_with_sponsor.
    evidence_fields:
    - egwp_group_change_log.egwp_group_change_id
    - egwp_group_change_log.source_change_id
    - egwp_group_change_log.reconciliation_status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - egwp_group_change_log.source_change_id
      action_bindings:
        egwp_group_change_log.source_change_id: source_change_id
    state_contract:
      field: egwp_group_change_log.reconciliation_status
      allowed:
      - not_reconciled
      - disputed_with_sponsor
  params:
    per_tier:
      Ridgecrest Group Retiree Standard (PPO):
        reconciliation_cycle_days: =reconciliation_cycle_days
        reconciliation_dispute_window_days: =reconciliation_dispute_window_days
      Ridgecrest Group Retiree Enhanced (PPO):
        reconciliation_cycle_days: =reconciliation_cycle_days
        reconciliation_dispute_window_days: =reconciliation_dispute_window_days
      Ridgecrest Group Retiree Premium (PPO):
