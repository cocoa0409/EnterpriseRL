- id: egwp_exclusivity_with_individual_plans
  subject:
  - egwp_enrollment_created
  - egwp_coverage_effectuation
  rule: A group retiree Medicare Advantage plan is still a Medicare Advantage plan, so it may not be held alongside an individual one. No individual Medicare Advantage enrollment is in force for this retiree on the day the group coverage would begin. Where the retiree holds an individual plan, accepting the group enrollment ends it on the day before the group coverage begins, and the retiree is told what they are giving up before the change is made. A drug-only employer group waiver plan and an individual medical plan without drug coverage may be held together, and the plan says which of the retiree's records carries which benefit. A retiree who holds a Medicare Supplement policy is told that it pays nothing while a group Medicare Advantage plan is in force, so that they can decide whether to keep paying for it. A retiree whose group plan ends has a special election period to take an individual plan, and the plan tells them the dates rather than leaving them to find out.
  eligibility:
  - id: no_individual_plan_in_force
    applies_to:
