events:
- type: egwp_enrollment_created
  target: egwp_enrollments
  mutation: create
  meaning: A sponsor's eligibility file names a retiree for group coverage and an enrollment record is opened.
  grain: One row per group retiree enrollment a person holds for one contract year.
  fields:
    egwp_enrollment_id: Reference number of this enrollment.
    customer_id: The retiree named.
    variant_name: The official group plan name the sponsor bought.
    status: Opens at group_file_received, the lifecycle entry state.
    group_number: The group contract the retiree is enrolled under.
    group_sponsor_name: The employer or union that sponsors the group.
    subscriber_reference: The sponsor's own reference for this retiree.
    relationship_to_subscriber: Who this person is on the sponsor's roster.
    plan_year: Contract year the enrollment belongs to.
    eligibility_file_received_date: Date the naming file reached the plan.
    coverage_effective_date: First day coverage will be in force.
    premium_responsibility: Who pays the group premium.
    retiree_contribution_amount: The retiree's monthly share as the sponsor set it.
    premium_balance_due: Opens at zero.
    collection_method: How the retiree's share will be collected.
    disenrollment_reason_code: Opens at not_applicable.
  triggers:
  - event: egwp:egwp_eligibility_confirmed
    map:
      egwp_enrollment_id: egwp_enrollment_id
      status: eligibility_confirmed
  - event: egwp:egwp_group_change_recorded
    map:
      egwp_enrollment_id: egwp_enrollment_id
      customer_id: customer_id
      change_type: roster_addition
      change_source: sponsor_eligibility_file
- type: egwp_eligibility_confirmed
  target: egwp_enrollments
  mutation:
    transition:
      from: group_file_received
      to: eligibility_confirmed
  meaning: The plan checks the retiree against Medicare entitlement and the group contract and confirms they may be enrolled.
  grain: One row per enrollment whose eligibility is confirmed.
  fields:
    egwp_enrollment_id: The enrollment confirmed.
    status: Moves to eligibility_confirmed.
    coverage_effective_date: The confirmed first day of coverage.
  triggers: []
- type: egwp_coverage_effectuation
  target: egwp_enrollments
  mutation:
    transition:
      from: eligibility_confirmed
      to: active
  meaning: The coverage effective date arrives, so group coverage comes into force and the retiree's contribution begins.
  grain: One row per group retiree enrollment brought into force.
  fields:
    egwp_enrollment_id: The enrollment brought into force.
    customer_id: The retiree now covered.
    status: Moves to active.
    coverage_effective_date: Confirmed first day of coverage.
    retiree_contribution_amount: The monthly share now being billed.
  triggers:
  - event: egwp:egwp_premium_charge
    map:
      egwp_enrollment_id: egwp_enrollment_id
      customer_id: customer_id
      payer_side: retiree_share
- type: egwp_arrears_start
  target: egwp_enrollments
  mutation:
    transition:
      from: active
      to: premium_arrears
  meaning: The retiree's contribution goes unpaid past its due day, so the enrollment moves into arrears and the sponsor is told.
  grain: One row per enrollment that falls into arrears.
  fields:
    egwp_enrollment_id: The enrollment in arrears.
    status: Moves to premium_arrears.
    premium_balance_due: The outstanding contribution as at that day.
  triggers: []
- type: egwp_arrears_cure
  target: egwp_enrollments
  mutation:
    transition:
      from: premium_arrears
      to: active
  meaning: The outstanding contribution reaches the plan inside the grace period, so coverage carries on unbroken.
  grain: One row per enrollment brought out of arrears.
  fields:
    egwp_enrollment_id: The enrollment restored.
    status: Returns to active.
    premium_balance_due: Falls to zero once the arrears are settled.
  triggers: []
- type: egwp_group_termination
  target: egwp_enrollments
  mutation:
    transition:
    - from: active
      to: group_terminated
    - from: premium_arrears
      to: group_terminated
  meaning: The sponsor ends the group contract or removes the retiree from its roster, so the enrollment ends with it.
  grain: One row per enrollment ended because the group ended it.
  fields:
    egwp_enrollment_id: The enrollment ended.
    customer_id: The retiree whose cover ends.
    status: Moves to group_terminated.
    coverage_end_date: Last day of cover.
    disenrollment_reason_code: group_contract_ended, removed_from_group_roster or nonpayment_of_contribution.
  triggers: []
- type: egwp_voluntary_disenrollment
  target: egwp_enrollments
  mutation:
    transition:
    - from: active
      to: disenrolled
    - from: premium_arrears
      to: disenrolled
    - from: group_file_received
      to: disenrolled
  meaning: The retiree themselves asks to leave the group plan, or declines it before it ever takes effect.
  grain: One row per group retiree enrollment the retiree ends.
  fields:
    egwp_enrollment_id: The enrollment being ended.
    customer_id: The retiree ending it.
    status: Moves to disenrolled.
    coverage_end_date: Last day of cover.
    disenrollment_reason_code: voluntary_election or other_plan_election.
  triggers: []
- type: egwp_enrollment_record_update
  target: egwp_enrollments
  mutation: update
  meaning: 'The enrollment record is brought into line with the sponsor''s file or the retiree''s own instruction: the contribution, how it is collected, or the sponsor reference.'
  grain: One row per group retiree enrollment whose service details are amended.
  fields:
    egwp_enrollment_id: The enrollment amended.
    retiree_contribution_amount: The monthly share now on record.
    collection_method: How the share is now collected.
    premium_responsibility: Who now pays the premium.
    subscriber_reference: The sponsor's reference now on record.
  triggers: []
- type: egwp_premium_charge
  target: egwp_premium_ledger
  meaning: The premium for one coverage month is charged, split between the sponsor's share and the retiree's own contribution.
  grain: One row per coverage month and payer side charged on one enrollment.
  distinguish_by:
  - billing_period
  - payer_side
  - posted_date
  - amount
  fields:
    egwp_premium_entry_id: Reference number of this ledger entry.
    egwp_enrollment_id: The enrollment charged.
    customer_id: The retiree charged.
    event_type: egwp_premium_charge.
    billing_period: The coverage month this charge pays for.
    posted_date: Date the charge was posted.
    amount: The share charged.
    payer_side: retiree_share or sponsor_share.
    collection_channel: not_applicable on a charge.
    balance_effect: not_applicable on a charge.
  account: premium_receivable
  direction: in
  triggers: []
- type: egwp_premium_payment
  target: egwp_premium_ledger
  meaning: Money reaching the plan, whether deducted from a pension, paid by the retiree or remitted in bulk by the sponsor, is posted against the oldest unpaid coverage month.
  grain: One row per payment posted on one enrollment.
  distinguish_by:
  - posted_date
  - amount
  - collection_channel
  - remittance_reference
  fields:
    egwp_premium_entry_id: Reference number of this ledger entry.
    egwp_enrollment_id: The enrollment credited.
    customer_id: The retiree credited.
    event_type: egwp_premium_payment.
    billing_period: The oldest coverage month the money is applied to.
    posted_date: Date the money was posted.
    amount: Amount received.
    payer_side: Which side of the split the money settles.
    collection_channel: How the money reached the plan.
    balance_effect: Whether the posting left part of the balance outstanding, settled it exactly, or exceeded it.
    remittance_reference: The reference on the pension advice or bank statement, recorded exactly as stated.
  account: premium_receivable
  direction: out
  triggers:
  - event: egwp:egwp_arrears_cure
    when:
      balance_effect: settles_balance
    map:
      egwp_enrollment_id: egwp_enrollment_id
      status: active
- type: egwp_premium_credit
  target: egwp_premium_ledger
  meaning: A credit is posted against a named charge, because the sponsor's subsidy applies, the retiree was taken off the roster retroactively, the rate was wrong, or a pension deduction never ran.
  grain: One row per credit posted against one named charge.
  distinguish_by:
  - source_premium_entry_id
  - credit_reason_code
  - posted_date
  - amount
  fields:
    egwp_premium_entry_id: Reference number of this ledger entry.
    egwp_enrollment_id: The enrollment credited.
    customer_id: The retiree credited.
    event_type: egwp_premium_credit.
    billing_period: The coverage month of the charge being relieved.
    posted_date: Date the credit was posted.
    amount: Amount of the credit.
    payer_side: Which side of the split the credit relieves.
    balance_effect: Whether the credit left part of the charge outstanding, settled it exactly, or exceeded it.
    source_premium_entry_id: The single charge this credit relieves.
    credit_reason_code: Why the credit was granted.
  account: premium_receivable
  direction: out
  triggers: []
- type: egwp_group_change_recorded
  target: egwp_group_change_log
  meaning: A change instructed by the sponsor or asked for by the retiree is recorded against the enrollment, with what it changed from and to.
  grain: One row per change recorded on one enrollment in one file cycle.
  distinguish_by:
  - change_date
  - change_type
  - file_cycle_reference
  - effective_date
  fields:
    egwp_group_change_id: Reference number of this change record.
    egwp_enrollment_id: The enrollment changed.
    customer_id: The retiree whose record changed.
    event_type: egwp_group_change_recorded.
    change_date: Date the change was recorded.
    change_type: What the change was.
    change_source: Who the change came from.
    effective_date: First day the change applies from.
    prior_value: What the record said before.
    new_value: What the record says now.
    file_cycle_reference: Which eligibility file cycle carried it.
    reconciliation_status: How the change stands against the plan's reconciliation.
  triggers: []
- type: egwp_roster_reconciliation
  target: egwp_group_change_log
  meaning: The plan reconciles the sponsor's roster against its own enrollment records and records what it found, so that a retiree is never billed for cover the sponsor thinks ended.
  grain: One row per reconciliation finding on one enrollment in one cycle.
  distinguish_by:
  - change_date
  - file_cycle_reference
  - reconciliation_status
  - source_change_id
  fields:
    egwp_group_change_id: Reference number of this reconciliation record.
    egwp_enrollment_id: The enrollment reconciled.
    customer_id: The retiree concerned.
    event_type: egwp_roster_reconciliation.
    change_date: Date of the reconciliation.
    change_type: reconciliation_correction.
    change_source: plan_reconciliation.
    effective_date: First day the correction applies from.
    prior_value: What the plan's record said.
    new_value: What the reconciled record says.
    file_cycle_reference: The file cycle reconciled.
    reconciliation_status: How the finding stands.
    source_change_id: The change this correction puts right.
  triggers:
  - event: egwp:egwp_premium_credit
    when:
      reconciliation_status: corrected
    map:
      egwp_enrollment_id: egwp_enrollment_id
      customer_id: customer_id
      credit_reason_code: retroactive_roster_removal
measures:
- id: egwp_msr_months_in_arrears
  window: From the billing_period of the oldest unrelieved retiree_share charge through the handling date inclusive.
  measure: Count of distinct billing_period values on egwp_premium_charge rows with payer_side retiree_share whose amount has not been fully offset by payments or credits.
- id: egwp_msr_unreconciled_changes
  window: The current reconciliation cycle on the tier's cycle length, through the handling date inclusive.
  measure: Count of egwp_group_change_recorded rows whose reconciliation_status is not_reconciled or disputed_with_sponsor.
policies:
- id: egwp_agg_multi_holding
  subject:
  - egwp_enrollment_created
  rule: A retiree may hold only one group retiree enrollment under any one sponsor at a time, though a person who worked for two employers may hold one under each. No other group retiree enrollment for the same member under the same group number is in a status of group_file_received, eligibility_confirmed, active or premium_arrears on the day the new record is opened. Where a sponsor's file names a retiree who already holds an enrollment under that group, the file line is treated as a change to the enrollment they hold rather than as a new one. A retiree holding enrollments under two sponsors is billed and serviced on each separately, and the plan tells them which group each benefit comes from whenever they ask. Enrollments in different contract years that do not overlap are never duplicates.
  eligibility:
  - id: single_enrollment_per_group
    applies_to:
    - egwp_enrollment_created
    kind: dedup
    condition: No other group retiree enrollment for the same member under the same group number is in a status of group_file_received, eligibility_confirmed, active or premium_arrears on the day the new record is opened.
    evidence_fields:
    - egwp_enrollments.customer_id
    - egwp_enrollments.group_number
    - egwp_enrollments.status
    - egwp_enrollments.plan_year
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - egwp_enrollments.customer_id
      action_bindings:
        egwp_enrollments.customer_id: customer_id
    dedup_contract:
      table: egwp_enrollments
      mode: separate_record
      object_bindings:
        customer_id: customer_id
        group_number: group_number
      duplicate_filters:
        status:
        - group_file_received
        - eligibility_confirmed
        - active
        - premium_arrears
      distinct_fields:
      - plan_year
      - coverage_effective_date
  params:
    max_per_customer: 2
- id: egwp_agg_combined_group_billing
  subject:
  - egwp_premium_charge
  - egwp_premium_payment
  rule: Where a retiree holds enrollments under more than one sponsor, each is billed on its own group contract and the balances are never pooled. Money arriving without a group reference is applied to the oldest unpaid coverage month across the retiree's enrollments, and the retiree is told which enrollment it was applied to. A sponsor's bulk remittance is split across the retirees it names and never applied to a retiree the sponsor did not name, however obvious the intention seems. Where a retiree is enrolled under two sponsors for the same coverage month, the plan tells them plainly that only one plan pays as primary and helps them end the other. A retiree's total monthly contribution is the sum of what each sponsor set, and no cap applies across sponsors because each group contract stands alone.
  eligibility: []
  params:
    per_tier:
      Ridgecrest Group Retiree Standard (PPO):
        default_retiree_contribution: =default_retiree_contribution
        group_premium_per_member: =group_premium_per_member
        sponsor_subsidy_default: =sponsor_subsidy_default
      Ridgecrest Group Retiree Enhanced (PPO):
        default_retiree_contribution: =default_retiree_contribution
        group_premium_per_member: =group_premium_per_member
        sponsor_subsidy_default: =sponsor_subsidy_default
      Ridgecrest Group Retiree Premium (PPO):
        default_retiree_contribution: =default_retiree_contribution
        group_premium_per_member: =group_premium_per_member
        sponsor_subsidy_default: =sponsor_subsidy_default
      Ridgecrest Group Retiree Rx Standard (EGWP):
        default_retiree_contribution: =default_retiree_contribution
        group_premium_per_member: =group_premium_per_member
        sponsor_subsidy_default: =sponsor_subsidy_default
      Ridgecrest Group Retiree Rx Enhanced (EGWP):
        default_retiree_contribution: =default_retiree_contribution
        group_premium_per_member: =group_premium_per_member
        sponsor_subsidy_default: =sponsor_subsidy_default
      Ridgecrest Group Retiree Rx Premium (EGWP):
        default_retiree_contribution: =default_retiree_contribution
        group_premium_per_member: =group_premium_per_member
        sponsor_subsidy_default: =sponsor_subsidy_default
  measures:
  - egwp_msr_months_in_arrears
- id: egwp_group_eligibility_and_changes
  subject:
  - egwp_enrollment_created
  - egwp_eligibility_confirmed
  - egwp_group_change_recorded
  - egwp_enrollment_record_update
  rule: 'A retiree joins a group plan because their sponsor names them on its eligibility file, and the plan confirms their Medicare entitlement before coverage begins. The change being recorded comes from the sponsor''s eligibility file or a written sponsor instruction where it is a roster or contribution change, and from the retiree themselves where it is a disenrollment. A retiree may never add themselves to a group, and a sponsor may never disenroll a retiree who has not asked to leave: each change has exactly one proper source, and a change from the wrong source is refused and its source told why. A sponsor may add a retiree back as far as the tier''s retroactive addition months and remove one as far as its retroactive removal months; anything further back is handled as a reconciliation rather than as a roster change. The plan allows the tier''s file lag between a change happening at the sponsor and its appearing on the file, and a retiree calling inside that lag is told the change may not yet be visible rather than that it has not happened. Every change records what the record said before and what it says now, so that a retiree disputing a contribution can be shown exactly when it changed and on whose instruction. A retiree who says their employer told them something different is taken seriously and the sponsor is asked, but the plan never changes a record on the retiree''s account of what the sponsor said.'
  eligibility:
  - id: change_from_proper_source
    applies_to:
    - egwp_group_change_recorded
    - egwp_enrollment_record_update
    kind: state
    condition: The change being recorded comes from the sponsor's eligibility file or a written sponsor instruction where it is a roster or contribution change, and from the retiree themselves where it is a disenrollment.
    evidence_fields:
    - egwp_group_change_log.egwp_group_change_id
    - egwp_group_change_log.change_source
    - egwp_group_change_log.change_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - egwp_group_change_log.egwp_group_change_id
      action_bindings:
        egwp_group_change_log.egwp_group_change_id: egwp_group_change_id
    state_contract:
      field: egwp_group_change_log.change_source
      allowed:
      - sponsor_eligibility_file
      - sponsor_written_instruction
      - retiree_request
  params:
    per_tier:
      Ridgecrest Group Retiree Standard (PPO):
        eligibility_file_cycle_days: =eligibility_file_cycle_days
        eligibility_file_lag_days: =eligibility_file_lag_days
        retroactive_addition_months: =retroactive_addition_months
        retroactive_removal_months: =retroactive_removal_months
        minimum_group_size: =minimum_group_size
        spouse_and_dependent_eligible: =spouse_and_dependent_eligible
      Ridgecrest Group Retiree Enhanced (PPO):
        eligibility_file_cycle_days: =eligibility_file_cycle_days
        eligibility_file_lag_days: =eligibility_file_lag_days
        retroactive_addition_months: =retroactive_addition_months
        retroactive_removal_months: =retroactive_removal_months
        minimum_group_size: =minimum_group_size
        spouse_and_dependent_eligible: =spouse_and_dependent_eligible
      Ridgecrest Group Retiree Premium (PPO):
        eligibility_file_cycle_days: =eligibility_file_cycle_days
        eligibility_file_lag_days: =eligibility_file_lag_days
        retroactive_addition_months: =retroactive_addition_months
        retroactive_removal_months: =retroactive_removal_months
        minimum_group_size: =minimum_group_size
        spouse_and_dependent_eligible: =spouse_and_dependent_eligible
      Ridgecrest Group Retiree Rx Standard (EGWP):
        eligibility_file_cycle_days: =eligibility_file_cycle_days
        eligibility_file_lag_days: =eligibility_file_lag_days
        retroactive_addition_months: =retroactive_addition_months
        retroactive_removal_months: =retroactive_removal_months
        minimum_group_size: =minimum_group_size
        spouse_and_dependent_eligible: =spouse_and_dependent_eligible
      Ridgecrest Group Retiree Rx Enhanced (EGWP):
        eligibility_file_cycle_days: =eligibility_file_cycle_days
        eligibility_file_lag_days: =eligibility_file_lag_days
        retroactive_addition_months: =retroactive_addition_months
        retroactive_removal_months: =retroactive_removal_months
        minimum_group_size: =minimum_group_size
        spouse_and_dependent_eligible: =spouse_and_dependent_eligible
      Ridgecrest Group Retiree Rx Premium (EGWP):
        eligibility_file_cycle_days: =eligibility_file_cycle_days
        eligibility_file_lag_days: =eligibility_file_lag_days
        retroactive_addition_months: =retroactive_addition_months
        retroactive_removal_months: =retroactive_removal_months
        minimum_group_size: =minimum_group_size
        spouse_and_dependent_eligible: =spouse_and_dependent_eligible
- id: egwp_contribution_billing
  subject:
  - egwp_premium_charge
  - egwp_premium_credit
  rule: The group premium for each coverage month is split between the sponsor's share and the retiree's contribution exactly as the group contract sets it, and each side is charged as its own entry. The enrollment is in a status of active or premium_arrears on the day the charge is posted. Where the sponsor pays in full the retiree is charged nothing and receives no bill, and a retiree who receives one anyway is credited rather than asked to pay and claim back. A contribution change instructed by the sponsor applies from the effective date on the instruction and is never applied to months already billed except by a credit naming each charge it relieves. Where a pension deduction fails, the months it should have covered are billed directly to the retiree, who is given the tier's grace period from the first direct bill rather than from the failed deduction. No contribution is charged for a coverage month beginning after the coverage end date, and a charge already posted for such a month is credited rather than pursued.
  eligibility:
  - id: enrollment_open_for_billing
    applies_to:
    - egwp_premium_charge
    - egwp_premium_credit
    kind: state
    condition: The enrollment is in a status of active or premium_arrears on the day the charge is posted.
    evidence_fields:
    - egwp_enrollments.egwp_enrollment_id
    - egwp_enrollments.status
    - egwp_enrollments.coverage_effective_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - egwp_enrollments.egwp_enrollment_id
      action_bindings:
        egwp_enrollments.egwp_enrollment_id: egwp_enrollment_id
    state_contract:
      field: egwp_enrollments.status
      allowed:
      - active
      - premium_arrears
  params:
    per_tier:
      Ridgecrest Group Retiree Standard (PPO):
        group_premium_per_member: =group_premium_per_member
        default_retiree_contribution: =default_retiree_contribution
        sponsor_subsidy_default: =sponsor_subsidy_default
        premium_due_day_of_month: =premium_due_day_of_month
      Ridgecrest Group Retiree Enhanced (PPO):
        group_premium_per_member: =group_premium_per_member
        default_retiree_contribution: =default_retiree_contribution
        sponsor_subsidy_default: =sponsor_subsidy_default
        premium_due_day_of_month: =premium_due_day_of_month
      Ridgecrest Group Retiree Premium (PPO):
        group_premium_per_member: =group_premium_per_member
        default_retiree_contribution: =default_retiree_contribution
        sponsor_subsidy_default: =sponsor_subsidy_default
        premium_due_day_of_month: =premium_due_day_of_month
      Ridgecrest Group Retiree Rx Standard (EGWP):
        group_premium_per_member: =group_premium_per_member
        default_retiree_contribution: =default_retiree_contribution
        sponsor_subsidy_default: =sponsor_subsidy_default
        premium_due_day_of_month: =premium_due_day_of_month
      Ridgecrest Group Retiree Rx Enhanced (EGWP):
        group_premium_per_member: =group_premium_per_member
        default_retiree_contribution: =default_retiree_contribution
        sponsor_subsidy_default: =sponsor_subsidy_default
        premium_due_day_of_month: =premium_due_day_of_month
      Ridgecrest Group Retiree Rx Premium (EGWP):
        group_premium_per_member: =group_premium_per_member
        default_retiree_contribution: =default_retiree_contribution
        sponsor_subsidy_default: =sponsor_subsidy_default
        premium_due_day_of_month: =premium_due_day_of_month
  formula:
    amount: default_retiree_contribution
    sponsor_amount: max(0, group_premium_per_member - default_retiree_contribution)
- id: egwp_contribution_collection
  subject:
  - egwp_premium_payment
  rule: 'The retiree''s contribution is collected by the method their group contract offers and they chose: deducted from their pension, billed to them directly, taken by bank transfer, or remitted in bulk by the sponsor. No payment entry carrying the same remittance reference and the same amount is already posted on this enrollment. A pension deduction takes the tier''s lead months to begin, during which the retiree is billed directly and must keep paying; the plan says so when the deduction is set up rather than letting arrears build. Money is posted against the oldest unpaid coverage month first, and within a month against the retiree''s own share before the sponsor''s. A bulk remittance from the sponsor is split across the retirees the file names, and a line that names nobody the plan holds is queried with the sponsor rather than posted to the nearest match. An overpayment is refunded by the channel the money arrived on, and a deduction that kept running after cover ended is refunded in full without the retiree having to ask.'
  eligibility:
  - id: payment_not_already_posted
    applies_to:
    - egwp_premium_payment
    kind: dedup
    condition: No payment entry carrying the same remittance reference and the same amount is already posted on this enrollment.
    evidence_fields:
    - egwp_premium_ledger.egwp_premium_entry_id
    - egwp_premium_ledger.remittance_reference
    - egwp_premium_ledger.amount
    - egwp_premium_ledger.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - egwp_premium_ledger.egwp_premium_entry_id
      action_bindings:
        egwp_premium_ledger.egwp_premium_entry_id: egwp_premium_entry_id
    dedup_contract:
      table: egwp_premium_ledger
      mode: separate_record
      object_bindings:
        remittance_reference: remittance_reference
        egwp_enrollment_id: egwp_enrollment_id
      duplicate_filters:
        event_type:
        - egwp_premium_payment
      distinct_fields:
      - posted_date
      - billing_period
      - payer_side
  params:
    per_tier:
      Ridgecrest Group Retiree Standard (PPO):
        collection_methods_offered: =collection_methods_offered
        pension_deduction_lead_months: =pension_deduction_lead_months
      Ridgecrest Group Retiree Enhanced (PPO):
        collection_methods_offered: =collection_methods_offered
        pension_deduction_lead_months: =pension_deduction_lead_months
      Ridgecrest Group Retiree Premium (PPO):
        collection_methods_offered: =collection_methods_offered
        pension_deduction_lead_months: =pension_deduction_lead_months
      Ridgecrest Group Retiree Rx Standard (EGWP):
        collection_methods_offered: =collection_methods_offered
        pension_deduction_lead_months: =pension_deduction_lead_months
      Ridgecrest Group Retiree Rx Enhanced (EGWP):
        collection_methods_offered: =collection_methods_offered
        pension_deduction_lead_months: =pension_deduction_lead_months
      Ridgecrest Group Retiree Rx Premium (EGWP):
