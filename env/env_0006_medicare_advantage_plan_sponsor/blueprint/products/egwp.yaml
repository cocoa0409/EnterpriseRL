# Product and event policy charter — Employer and Union Group Retiree Plans.
# The single registry of every quantified policy in this category; every number appears here once.
category: egwp
display_name: Employer and Union Group Retiree Plans
binding:
  holding_table: egwp_enrollments
  event_tables:
  - egwp_premium_ledger
  - egwp_group_change_log
  status_field: status
  variant_field: variant_name
  quantity_fields:
    premium_balance_due: premium_receivable
lifecycle:
  states:
  - group_file_received
  - eligibility_confirmed
  - active
  - premium_arrears
  - group_terminated
  - disenrolled
  transitions:
  - from: group_file_received
    to: eligibility_confirmed
    by: system
    means: The plan confirms the retiree's Medicare entitlement and the group contract.
  - from: group_file_received
    to: disenrolled
    by: user
    means: The retiree declines the group plan before it takes effect.
  - from: eligibility_confirmed
    to: active
    by: system
    means: The coverage effective date arrives and group coverage comes into force.
  - from: active
    to: premium_arrears
    by: system
    means: The retiree's contribution goes unpaid after its due day.
  - from: premium_arrears
    to: active
    by: agent
    means: The outstanding contribution is received inside the grace period.
  - from: active
    to: group_terminated
    by: system
    means: The sponsor ends the group contract or removes the retiree from its roster.
  - from: premium_arrears
    to: group_terminated
    by: system
    means: The sponsor ends cover after the contribution grace period expires unpaid.
  - from: active
    to: disenrolled
    by: user
    means: The retiree asks to leave the group plan.
  - from: premium_arrears
    to: disenrolled
    by: user
    means: The retiree asks to leave the group plan while in arrears.
accounts:
- key: premium_receivable
  unit: USD
  meaning: 'Group premium owed but not yet paid, kept by payer side: charges increase it and payments and credits reduce it, and the retiree''s part of its running total is the premium balance due on the enrollment.'
parameter_schema:
  plan_form: 'Contract form of the group plan: a medical plan or a drug-only employer group waiver plan (string).'
  group_premium_per_member: Total monthly premium the plan charges the group for each enrolled retiree, in USD.
  default_retiree_contribution: Monthly share of that premium the plan bills the retiree where the sponsor sets none, in USD.
  sponsor_subsidy_default: Monthly share of the premium the sponsor pays where the group contract sets none, in USD.
  premium_due_day_of_month: Calendar day of the coverage month on which the retiree contribution falls due (integer 1-28).
  contribution_grace_period_days: Calendar days after the first unpaid contribution before disenrollment may be processed (integer days).
  collection_methods_offered: Ways the retiree's share may be collected (list of method names).
  pension_deduction_lead_months: Months a pension deduction takes to begin after it is set up (integer months).
  eligibility_file_cycle_days: Calendar days between the sponsor's eligibility files (integer days).
  eligibility_file_lag_days: Calendar days the plan allows between a change at the sponsor and its appearance on the file (integer days).
  retroactive_addition_months: Months back a sponsor may add a retiree to the roster (integer months).
  retroactive_removal_months: Months back a sponsor may remove a retiree from the roster (integer months).
  reconciliation_cycle_days: Calendar days between the plan's reconciliations of the roster against its own records (integer days).
  reconciliation_dispute_window_days: Calendar days the sponsor has to dispute a reconciliation finding (integer days).
  annual_medical_deductible: In-network medical deductible for the plan year, in USD.
  in_network_moop: Annual in-network maximum out-of-pocket, in USD.
  out_of_network_moop: Annual combined in- and out-of-network maximum out-of-pocket, in USD.
  primary_care_copay: Member copay for an in-network primary care visit, in USD.
  specialist_copay: Member copay for an in-network specialist visit, in USD.
  emergency_room_copay: Member copay for an emergency department visit, in USD.
  inpatient_per_admission_copay: Member copay for each in-network inpatient admission, in USD.
  outpatient_surgery_copay: Member copay for in-network outpatient surgery, in USD.
  diagnostic_imaging_copay: Member copay for in-network advanced diagnostic imaging, in USD.
  out_of_network_coinsurance: Member coinsurance on covered out-of-network services, as a percentage.
  passive_ppo_nationwide: Whether the retiree may see any provider who accepts Medicare at the in-network cost share (true or false).
  referral_required: Whether an in-network specialist visit needs a referral (true or false).
  part_d_included: Whether the plan includes Part D prescription drug coverage (true or false).
  part_d_annual_deductible: Part D deductible for the plan year, in USD.
  part_d_generic_copay: Member copay for a 30-day generic fill, in USD.
  part_d_preferred_brand_copay: Member copay for a 30-day preferred brand fill, in USD.
  part_d_specialty_coinsurance: Member coinsurance on a 30-day specialty fill, as a percentage.
  part_d_wrap_coverage: Whether the group buys extra drug coverage above the standard Part D benefit (true or false).
  mail_order_90_day_multiplier: Multiplier applied to the 30-day retail cost share for a 90-day mail-order fill (decimal).
  insulin_copay_cap_month: Maximum member copay for a one-month supply of covered insulin, in USD.
  retiree_dental_included: Whether group dental cover is included (true or false).
  retiree_vision_included: Whether group vision cover is included (true or false).
  fitness_benefit_included: Whether the network fitness membership is included (true or false).
  otc_allowance_quarterly: Over-the-counter allowance loaded each calendar quarter, in USD.
  hearing_aid_allowance_per_ear: Embedded hearing aid allowance per ear per plan year, in USD.
  worldwide_emergency_coverage_limit: Annual plan payment limit for emergency care outside the United States, in USD.
  prior_auth_standard_decision_days: Calendar days within which a standard organisation determination must be decided (integer days).
  prior_auth_expedited_decision_hours: Hours within which an expedited organisation determination must be decided (integer hours).
  appeal_filing_window_days: Calendar days after an adverse determination within which a reconsideration may be filed (integer days).
  group_open_enrollment_month: Month each year, as MM, in which the sponsor runs its retiree open enrollment (string).
  plan_option_change_effective_rule: Rule that turns a retiree's plan option change into an effective date (string).
  disenrollment_effective_rule: Rule that turns a disenrollment into a coverage end date (string).
  minimum_group_size: Smallest number of retirees a sponsor must enrol to hold this plan (integer).
  group_contract_notice_days: Calendar days of notice a sponsor must give to end the group contract (integer days).
  retiree_notice_days_on_group_termination: Calendar days of notice retirees get when the sponsor ends the contract (integer days).
  spouse_and_dependent_eligible: Whether a Medicare-eligible spouse or dependent may be enrolled (true or false).
  surviving_spouse_continuation_months: Months a surviving spouse may stay on the group plan after the retiree's death (integer months).
  service_area_basis: Where the plan may be held (string).
  star_rating: Most recent CMS overall star rating published for this plan (decimal, 1.0 to 5.0).
  enrollment_capacity_limit: Maximum number of retirees CMS has approved for this plan benefit package (integer).
