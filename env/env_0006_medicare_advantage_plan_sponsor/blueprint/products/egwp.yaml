- id: egwp_retiree_disenrollment
  subject:
  - egwp_voluntary_disenrollment
  rule: Only the retiree may choose to leave a group plan of their own accord, and the plan never records a voluntary disenrollment on a sponsor's word. The disenrollment comes from the retiree themselves, recorded as a change of type retiree_requested_disenrollment sourced from the retiree. A voluntary disenrollment takes effect on the last day of the month the request was received, and the retiree keeps full cover until that day. A retiree who leaves a group plan ordinarily cannot rejoin it until the sponsor's next open enrollment, and the plan says which month that is before the request is recorded. A retiree leaving a group plan that includes drug coverage is told they must arrange other creditable drug coverage or face a late enrollment penalty later. A retiree declining the plan before it ever takes effect leaves no coverage period and owes no contribution at all. A surviving spouse may stay on the group plan for the tier's continuation months after the retiree's death, and is told the date their own cover would end.
