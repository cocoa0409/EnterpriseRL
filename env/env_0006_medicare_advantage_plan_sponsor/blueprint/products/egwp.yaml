- id: egwp_benefit_entitlements
  subject:
  - egwp_coverage_effectuation
  rule: A group retiree plan pays on the benefit design the sponsor bought, which is ordinarily richer than the plans sold to individuals and always differs from them. A medical group plan pays at the in-network cost share wherever the retiree lives, at any provider who accepts Medicare, which is why retirees who move are still covered on the same terms. A drug-only employer group waiver plan carries no medical benefit at all, and a retiree of such a group keeps Original Medicare or another medical plan for their medical care. Where the sponsor bought wrap coverage the plan pays above the standard Part D benefit, so a retiree's drug costs may look nothing like what an individual plan would charge. Supplemental benefits such as dental, vision, fitness and the allowance card are the sponsor's choice, and a retiree asking for one their group did not buy is told plainly that their employer did not include it rather than that the plan does not offer it. Coverage decisions and appeals follow the same deadlines as any Medicare Advantage plan, and a group retiree has exactly the same appeal rights as anybody else.
