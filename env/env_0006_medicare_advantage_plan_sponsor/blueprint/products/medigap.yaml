- id: medigap_premium_billing_and_posting
  subject:
  - medigap_premium_payment
  - medigap_premium_refund
  rule: Premium is billed for the span the chosen frequency covers and falls due on the tier's due day of the first month of that span. The policy stands at active or grace_period on the day the charge is posted. No payment entry carrying the same remittance reference and the same amount is already posted on this policy. Money is posted against the oldest unpaid billing period first, and the balance effect recorded says whether it left part of the balance outstanding, settled it exactly, or exceeded it. Premium already paid for cover beyond a termination date is returned on the tier's unearned premium basis, and the refund names the single charge it returns. A refund is paid by the way the money came in wherever that can be done, and by cheque to the address on file where it cannot. A payment that arrives after the policy has lapsed is held rather than posted while reinstatement is considered, and returned in full where reinstatement is refused.
  eligibility:
  - id: policy_open_for_posting
    applies_to:
    - medigap_premium_payment
    kind: state
    condition: The policy stands at active or grace_period on the day the charge is posted.
    evidence_fields:
    - medigap_policies.medigap_policy_id
    - medigap_policies.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - medigap_policies.medigap_policy_id
      action_bindings:
        medigap_policies.medigap_policy_id: medigap_policy_id
    state_contract:
      field: medigap_policies.status
      allowed:
      - active
      - grace_period
  - id: payment_not_already_posted
    applies_to:
    - medigap_premium_payment
    kind: dedup
    condition: No payment entry carrying the same remittance reference and the same amount is already posted on this policy.
    evidence_fields:
    - medigap_premium_ledger.medigap_premium_entry_id
    - medigap_premium_ledger.remittance_reference
    - medigap_premium_ledger.amount
    - medigap_premium_ledger.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - medigap_premium_ledger.medigap_premium_entry_id
      action_bindings:
        medigap_premium_ledger.medigap_premium_entry_id: medigap_premium_entry_id
