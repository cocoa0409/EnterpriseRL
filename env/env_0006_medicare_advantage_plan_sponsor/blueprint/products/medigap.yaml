- id: medigap_free_look_and_cancellation
  subject:
  - medigap_policy_cancellation
  - medigap_policy_servicing_update
  rule: 'Only the policyholder may end a Medicare Supplement policy, because the contract and the premium are theirs; no relative, agent or provider may end it for them. The policyholder returns the policy no later than the last day of the free look period counted from the policy effective date. Calendar days are counted from the day after the policy effective date, every day of the week counts, a return made on the final day is in time, and full 24-hour periods are never used in place of calendar days. The cancellation is recorded on an underwriting file with the request action policy_cancellation or free_look_return and an intake status of recorded, awaiting_applicant_signature or under_review. A policy returned inside the free look period is treated as never having been bought: every penny of premium is returned, and any benefit already paid is recovered from the policyholder. A cancellation outside the free look period takes effect at the end of the notice the tier requires, and premium paid beyond that date is returned on the tier''s unearned premium basis. A policyholder cancelling because they are moving is told which of the plan''s policies are sold where they are going, because a supplement is not always portable. A change of payment method, billing frequency or discount does not end the policy and never restarts a waiting period; it takes effect from the next billing period.'
  eligibility:
  - id: free_look_window_open
    applies_to:
    - medigap_policy_cancellation
    kind: time
    condition: The policyholder returns the policy no later than the last day of the free look period counted from the policy effective date.
    evidence_fields:
    - medigap_policies.medigap_policy_id
    - medigap_policies.policy_effective_date
    - medigap_policies.termination_reason
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - medigap_policies.medigap_policy_id
      action_bindings:
        medigap_policies.medigap_policy_id: medigap_policy_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the policy effective date
      anchor_source: medigap_policies.policy_effective_date
      relation: not_after
      duration_source: variants.free_look_period_days
      unit: calendar_days
      counting_rule: Calendar days are counted from the day after the policy effective date, every day of the week counts, a return made on the final day is in time, and full 24-hour periods are never used in place of calendar days.
      boundary: inclusive
  - id: policyholder_request_recorded
    applies_to:
    - medigap_policy_cancellation
    kind: state
    condition: The cancellation is recorded on an underwriting file with the request action policy_cancellation or free_look_return and an intake status of recorded, awaiting_applicant_signature or under_review.
