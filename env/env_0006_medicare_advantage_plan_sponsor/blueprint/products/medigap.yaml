# Product and event policy charter — Medicare Supplement Insurance Policies.
# The single registry of every quantified policy in this category; every number appears here once.
category: medigap
display_name: Medicare Supplement Insurance Policies
binding:
  holding_table: medigap_policies
  event_tables:
  - medigap_premium_ledger
  - medigap_claim_crossovers
  intake_tables:
  - medigap_underwriting_files
  status_field: status
  variant_field: variant_name
  quantity_fields:
    premium_balance_due: premium_receivable
    deductible_accumulated: deductible_accrual
lifecycle:
  states:
  - application_received
  - underwriting_review
  - active
  - grace_period
  - lapsed
  - cancelled
  - rescinded
  transitions:
  - from: application_received
    to: underwriting_review
    by: system
    means: The signed application passes to the underwriter.
  - from: application_received
    to: cancelled
    by: user
    means: The applicant withdraws the application before it is underwritten.
  - from: underwriting_review
    to: active
    by: agent
    means: The underwriter accepts the application and the policy is issued.
  - from: underwriting_review
    to: cancelled
    by: agent
    means: The underwriter declines the application, so no policy comes into force.
  - from: active
    to: grace_period
    by: system
    means: A supplement premium is unpaid after its due date.
  - from: grace_period
    to: active
    by: agent
    means: The outstanding premium is received inside the grace period.
  - from: grace_period
    to: lapsed
    by: system
    means: The grace period ends with premium still unpaid.
  - from: lapsed
    to: active
    by: agent
    means: The lapsed policy is reinstated on the evidence the plan requires.
  - from: active
    to: cancelled
    by: user
    means: The policyholder returns the policy in the free look period or gives notice later.
  - from: grace_period
    to: cancelled
    by: user
    means: The policyholder ends the policy while premium is in arrears.
  - from: active
    to: rescinded
    by: agent
    means: The plan rescinds inside the contestability period for a material misstatement.
accounts:
- key: premium_receivable
  unit: USD
  meaning: 'Supplement premium the policyholder owes but has not yet paid: charges increase it, payments and refunds reduce it, and its running total is the premium balance due on the policy.'
- key: deductible_accrual
  unit: USD
  meaning: 'What the policyholder has paid this calendar year toward a high-deductible plan''s annual deductible: processed crossover lines add to it and adjustments take back out of it.'
parameter_schema:
  standardized_plan_letter: The standardised Medicare Supplement plan letter this product is (string).
  part_a_coinsurance_coverage_percent: Share of the Part A hospital coinsurance the policy pays, as a percentage.
  part_a_deductible_coverage_percent: Share of the Part A inpatient deductible the policy pays, as a percentage.
  part_b_coinsurance_coverage_percent: Share of the Part B coinsurance the policy pays, as a percentage.
  part_b_deductible_covered: Whether the policy pays the annual Part B deductible (true or false).
  part_b_excess_charges_covered: Whether the policy pays charges above the Medicare approved amount from providers who do not accept assignment (true or false).
  skilled_nursing_coinsurance_percent: Share of the skilled nursing facility coinsurance the policy pays, as a percentage.
  hospice_coinsurance_percent: Share of the Part A hospice coinsurance the policy pays, as a percentage.
  blood_first_three_pints_percent: Share of the first three pints of blood the policy pays, as a percentage.
  part_b_office_visit_copay: Copay the policyholder pays for an office visit before the policy pays, in USD.
  emergency_department_copay: Copay the policyholder pays for an emergency department visit that does not lead to admission, in USD.
  foreign_travel_emergency_covered: Whether emergency care outside the United States is covered (true or false).
  foreign_travel_emergency_deductible: Deductible taken each calendar year on foreign travel emergency care, in USD.
  foreign_travel_emergency_coinsurance_percent: Share of foreign travel emergency care the policy pays after the deductible, as a percentage.
  foreign_travel_lifetime_maximum: Lifetime maximum the policy will pay for foreign travel emergency care, in USD.
  annual_out_of_pocket_limit: Annual limit on what the policyholder pays before the policy pays everything, in USD; zero where the plan has no such limit.
  high_deductible_amount: Annual deductible the policyholder meets before a high-deductible plan pays anything, in USD.
  base_monthly_premium_age_65: Monthly premium for a standard-class policyholder issued at age 65, in USD.
  rating_method: 'How the premium changes with age: issue age, attained age or community rated (string).'
  attained_age_annual_increase_percent: Percentage the premium rises each policy anniversary under attained-age rating.
  issue_age_rate_step_percent: Percentage the base premium rises for each year of issue age above 65.
  household_discount_percent: Discount where another adult in the household holds a Ridgecrest supplement, as a percentage.
  annual_payment_discount_percent: Discount for paying a full year in advance, as a percentage.
  electronic_funds_transfer_discount: Flat reduction each billing period for paying by bank transfer, in USD.
  tobacco_rate_factor: Multiplier applied to the base premium for a tobacco-using applicant (decimal).
  area_rate_factor: Multiplier applied to the base premium for the policyholder's rating area (decimal).
  policy_fee_annual: Flat annual policy fee added to the premium, in USD.
  premium_due_day_of_month: Calendar day of the billing period on which the premium falls due (integer 1-28).
  premium_grace_period_days: Calendar days after the due date before the policy lapses for non-payment (integer days).
  premium_billing_frequency_options: Billing cadences the policyholder may choose (list of cadence names).
  reinstatement_window_days: Calendar days after lapse within which reinstatement may still be asked for (integer days).
  reinstatement_evidence_required: What the policyholder must show to be reinstated (string).
  free_look_period_days: Calendar days from delivery within which the policy may be returned for a full refund (integer days).
  open_enrollment_period_months: Months from the start of Part B during which the policy must be issued without health questions (integer months).
  guaranteed_issue_permitted: Whether the plan is offered on a guaranteed issue right (true or false).
  underwriting_required_outside_open_enrollment: Whether health questions are asked outside open enrollment and guaranteed issue (true or false).
  underwriting_decision_days: Calendar days within which the underwriter must record a decision (integer days).
  contestability_period_months: Months from issue during which the plan may rescind for a material misstatement (integer months).
  pre_existing_condition_waiting_months: Months from issue during which a condition treated before issue is not covered (integer months).
  pre_existing_waiver_with_creditable_coverage: Whether prior creditable coverage shortens or removes that waiting period (true or false).
  claim_crossover_automatic: Whether Medicare sends claims to the supplement automatically (true or false).
  claim_filing_window_days: Calendar days after Medicare's determination within which a claim must reach the supplement (integer days).
  claim_payment_days: Calendar days within which the supplement must pay a clean crossover claim (integer days).
  annual_rate_review_month: Month each year, as MM, in which rates are reviewed and any increase applied (string).
  rate_increase_notice_days: Calendar days before a rate increase takes effect that the policyholder must be told (integer days).
  policy_anniversary_basis: What the policy anniversary is measured from (string).
  cancellation_notice_days: Calendar days of notice the policyholder gives to cancel (integer days).
  unearned_premium_refund_basis: How premium already paid beyond the termination date is worked out and returned (string).
  birthday_rule_switch_permitted: Whether the policyholder may move to an equal or lesser plan without health questions around their birthday (true or false).
  birthday_rule_window_days: Calendar days around the policyholder's birthday during which that switch may be made (integer days).
  minimum_issue_age: Youngest age at which the policy may be issued (integer years).
  maximum_issue_age: Oldest age at which the policy may be issued (integer years).
  under_65_eligible: Whether the plan may be issued to a Medicare beneficiary under 65 (true or false).
  medicare_part_b_required: Whether the applicant must be enrolled in Part B to hold the policy (true or false).
  provider_acceptance_basis: Which providers the policy pays for (string).
