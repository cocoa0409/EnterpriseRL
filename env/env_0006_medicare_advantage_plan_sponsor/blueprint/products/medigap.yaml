- id: medigap_benefit_payment
  subject:
  - medigap_claim_crossover_processed
  rule: The supplement pays the share of the Medicare cost sharing its plan letter covers, always worked out from the amount Medicare approved and never from what the provider billed. The policy stands at active or grace_period on the date of service of the line. Medicare has made its own determination on the claim and the amount Medicare approved is recorded on the crossover line. A benefit the plan letter does not cover is not paid at all, and the line is denied with the reason benefit_not_in_plan rather than paid in part; the policyholder is told which of the standardised plans would have covered it. Excess charges arise only where the provider does not accept Medicare assignment, so a policyholder complaining of a balance bill from an assigned provider is told that the bill is wrong rather than that their plan does not cover it. On a plan letter with an annual out-of-pocket limit the supplement pays everything once the policyholder's own payments reach that limit for the calendar year. On a high-deductible plan letter the supplement pays nothing until the policyholder's own payments for the calendar year reach the high deductible, and from that point it pays as the standard plan letter would. Foreign travel emergency care is paid after its own yearly deductible, at the tier's coinsurance, and only up to the lifetime maximum; once that maximum is reached further foreign claims are denied and the policyholder is told so before they travel again. A condition treated in the six months before issue is not covered during the tier's waiting period, unless the policyholder had creditable coverage and the tier waives it on that ground.
