- id: medigap_claim_adjustment_and_recovery
  subject:
  - medigap_claim_adjustment
  rule: 'Where Medicare restates its own payment, or the supplement finds it paid the wrong share, the line already processed is taken back and a corrected line put in its place. The adjustment names the single processed crossover line it applies to, and that line is on record with a claim status of paid or adjusted. No adjustment of that same processed crossover line is already on record. The adjustment carries the negative of what the earlier line paid, so that the deductible accumulator and the foreign travel lifetime total return to what they were before it. Money the supplement overpaid a provider is recovered from that provider and never from the policyholder, unless the policyholder was paid directly. A policyholder who has already paid a balance the corrected line shows they did not owe is refunded rather than credited against a future claim. Each line is adjusted on its own reference: a Medicare claim covering several services is never adjusted as one, because the lines may be settled differently. A line more than the tier''s filing window old is not reopened for the policyholder''s benefit or the plan''s, and the policyholder is told the date it closed.'
  eligibility:
  - id: original_line_on_record
    applies_to:
    - medigap_claim_adjustment
    kind: state
    condition: The adjustment names the single processed crossover line it applies to, and that line is on record with a claim status of paid or adjusted.
    evidence_fields:
    - medigap_claim_crossovers.medigap_claim_id
    - medigap_claim_crossovers.source_claim_id
    - medigap_claim_crossovers.claim_status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - medigap_claim_crossovers.source_claim_id
      action_bindings:
        medigap_claim_crossovers.source_claim_id: source_claim_id
    state_contract:
      field: medigap_claim_crossovers.claim_status
      allowed:
      - paid
      - adjusted
  - id: adjustment_not_already_posted
    applies_to:
    - medigap_claim_adjustment
    kind: dedup
    condition: No adjustment of that same processed crossover line is already on record.
    evidence_fields:
    - medigap_claim_crossovers.medigap_claim_id
    - medigap_claim_crossovers.source_claim_id
    - medigap_claim_crossovers.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
