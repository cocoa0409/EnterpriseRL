  - id: policy_in_force_on_service_date
    applies_to:
    - medigap_claim_crossover_processed
    kind: state
    condition: The policy stands at active or grace_period on the date of service of the line.
    evidence_fields:
    - medigap_policies.medigap_policy_id
    - medigap_policies.status
    - medigap_policies.policy_effective_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - medigap_policies.medigap_policy_id
      action_bindings:
        medigap_policies.medigap_policy_id: medigap_policy_id
    state_contract:
      field: medigap_policies.status
      allowed:
      - active
      - grace_period
