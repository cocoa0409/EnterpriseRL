- id: medigap_rescission_for_misrepresentation
  subject:
  - medigap_rescission
  rule: 'A policy issued on an answer to a health question that was materially untrue may be rescinded, which means treating it as never having come into force. The plan rescinds no later than the last day of the contestability period counted from the policy effective date. Calendar months are counted from the day of the month the policy took effect, a month with no matching day ends on its last day, the final day of the period is itself inside it, and calendar days are never used in place of calendar months. After the contestability period the policy may not be rescinded for anything the applicant said at issue, however the plan later views it, and a policyholder asking whether their old answers can still be used against them is told plainly that they cannot. A misstatement is material only where the plan would not have issued the policy, or would have issued it on different terms, had it known; an answer that would have changed nothing is never a ground. A policy issued during open enrollment or on a guaranteed issue right is never rescinded for a health answer, because no health answer was allowed to matter. On rescission every premium paid is returned and every benefit paid is recovered, and the policyholder is told in writing what was found and how to dispute it. An innocent error of fact, such as a wrong date of birth, is not a rescission ground: the premium is put right from issue and the difference billed or refunded.'
  eligibility:
  - id: within_contestability_period
    applies_to:
    - medigap_rescission
    kind: time
    condition: The plan rescinds no later than the last day of the contestability period counted from the policy effective date.
    evidence_fields:
    - medigap_policies.medigap_policy_id
    - medigap_policies.policy_effective_date
    - medigap_policies.issue_basis
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - medigap_policies.medigap_policy_id
      action_bindings:
        medigap_policies.medigap_policy_id: medigap_policy_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the policy effective date
      anchor_source: medigap_policies.policy_effective_date
      relation: not_after
      duration_source: variants.contestability_period_months
      unit: calendar_months
      counting_rule: Calendar months are counted from the day of the month the policy took effect, a month with no matching day ends on its last day, the final day of the period is itself inside it, and calendar days are never used in place of calendar months.
      boundary: inclusive
  params:
    per_tier:
      Ridgecrest Medicare Supplement Plan A:
        contestability_period_months: =contestability_period_months
        pre_existing_condition_waiting_months: =pre_existing_condition_waiting_months
      Ridgecrest Medicare Supplement Plan B:
        contestability_period_months: =contestability_period_months
        pre_existing_condition_waiting_months: =pre_existing_condition_waiting_months
      Ridgecrest Medicare Supplement Plan D:
        contestability_period_months: =contestability_period_months
        pre_existing_condition_waiting_months: =pre_existing_condition_waiting_months
      Ridgecrest Medicare Supplement Plan K:
        contestability_period_months: =contestability_period_months
        pre_existing_condition_waiting_months: =pre_existing_condition_waiting_months
      Ridgecrest Medicare Supplement Plan N:
        contestability_period_months: =contestability_period_months
        pre_existing_condition_waiting_months: =pre_existing_condition_waiting_months
      Ridgecrest Medicare Supplement Plan G:
        contestability_period_months: =contestability_period_months
        pre_existing_condition_waiting_months: =pre_existing_condition_waiting_months
      Ridgecrest Medicare Supplement High Deductible Plan G:
        contestability_period_months: =contestability_period_months
        pre_existing_condition_waiting_months: =pre_existing_condition_waiting_months
- id: medigap_exclusivity_with_medicare_advantage
  subject:
  - medigap_application_recorded
  - medigap_policy_issued
  rule: A Medicare Supplement policy pays only alongside Original Medicare, so it is unlawful to sell one to a member who is enrolled in a Medicare Advantage plan unless they are leaving it. No Medicare Advantage enrollment is in force for this member on the day the supplement policy would take effect. Where the member holds a Medicare Advantage plan the application is taken only where their disenrollment is already recorded and the supplement is dated to begin the day the Medicare Advantage coverage ends, so that there is no day on which both are in force. A member who keeps their Medicare Advantage plan is told plainly that a supplement would pay them nothing, and the application is not taken however firmly they ask. Holding a stand-alone Part D drug plan alongside a supplement is perfectly proper, because no supplement sold today carries drug coverage; the two are billed and serviced entirely apart. A member inside their first year of a first Medicare Advantage plan has a trial right to return to Original Medicare with a guaranteed issue right to a supplement, and the plan checks their enrolment history rather than taking their word for the trial right.
  eligibility:
  - id: no_medicare_advantage_in_force
    applies_to:
    - medigap_policy_issued
    kind: state
    condition: No Medicare Advantage enrollment is in force for this member on the day the supplement policy would take effect.
    evidence_fields:
    - advantage_enrollments.advantage_enrollment_id
    - advantage_enrollments.customer_id
    - advantage_enrollments.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - advantage_enrollments.customer_id
      action_bindings:
        advantage_enrollments.customer_id: customer_id
    state_contract:
      field: advantage_enrollments.status
      allowed:
      - disenrolled
      - terminated_for_nonpayment
      - cancelled_before_effective
  params:
    per_tier:
      Ridgecrest Medicare Supplement Plan A:
