        cancellation_notice_days: =cancellation_notice_days
        unearned_premium_refund_basis: =unearned_premium_refund_basis
      Ridgecrest Medicare Supplement Plan D:
        free_look_period_days: =free_look_period_days
        cancellation_notice_days: =cancellation_notice_days
