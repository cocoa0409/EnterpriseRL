- id: osb_predetermination_and_appeal
  subject:
  - osb_benefit_claim_processed
  - osb_benefit_claim_reversal
  rule: 'A treatment plan worth more than the tier''s predetermination threshold is sent to the plan before the work begins, so that the member knows what the rider will pay before they commit. The plan answers the predetermination no later than the decision deadline counted from the date the plan received the treatment plan. Calendar days are counted from the day after that receipt date, every day of the week counts, an answer given on the final day is in time, and full 24-hour periods are never used in place of calendar days. An approved predetermination holds good for the tier''s validity months and fixes what the rider will pay, provided the rider is still in force and the annual maximum still allows it when the work is done. A predetermination is an estimate of benefit and never a promise of payment: where the member''s benefit year maximum has since been used up, the rider pays only what is left and the member is told so as soon as the claim is seen. Work begun without a predetermination where one was required is denied with the reason no_predetermination_on_file, and the member may appeal that denial like any other. A member may appeal any denial inside the tier''s appeal window, counted from the date of the denial notice, and the appeal is decided by somebody who took no part in the original decision. Where the appeal succeeds the original line is reversed and a corrected line processed, so that the member''s benefit history shows both what was decided and what was put right.'
  eligibility:
  - id: predetermination_answered_in_time
    applies_to:
    - osb_benefit_claim_processed
    kind: time
    condition: The plan answers the predetermination no later than the decision deadline counted from the date the plan received the treatment plan.
    evidence_fields:
    - osb_rider_requests.osb_rider_request_id
    - osb_rider_requests.created_at
    - osb_rider_requests.decision_date
    - osb_rider_requests.predetermination_outcome
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - osb_rider_requests.osb_rider_request_id
      action_bindings:
        osb_rider_requests.osb_rider_request_id: osb_rider_request_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the date the plan received the treatment plan
      anchor_source: osb_rider_requests.created_at
      relation: not_after
      duration_source: variants.predetermination_decision_days
      unit: calendar_days
      counting_rule: Calendar days are counted from the day after that receipt date, every day of the week counts, an answer given on the final day is in time, and full 24-hour periods are never used in place of calendar days.
      boundary: inclusive
  params:
    per_tier:
      Ridgecrest Preventive Dental Rider:
        predetermination_required_above: =predetermination_required_above
        predetermination_decision_days: =predetermination_decision_days
        predetermination_valid_months: =predetermination_valid_months
        benefit_appeal_window_days: =benefit_appeal_window_days
      Ridgecrest Vision Plus Rider:
