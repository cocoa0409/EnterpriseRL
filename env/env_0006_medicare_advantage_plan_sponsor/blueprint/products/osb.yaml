- id: osb_rider_premium_billing_and_posting
  subject:
  - osb_rider_premium_charge
  - osb_rider_premium_payment
  - osb_rider_premium_credit
  rule: The rider premium is charged for each coverage month from the rider effective date to the rider end date, and on the tiers that bill it with the plan it appears as its own line on the medical plan bill. The rider stands at waiting_period, active or premium_suspended on the day the charge is posted. No payment entry carrying the same remittance reference and the same amount is already posted on this rider. Premium is owed during the waiting period, because the rider is in force even though it is not yet paying, and a member surprised by that is shown the two dates on their record. Money is posted against the oldest unpaid coverage month first, and a payment that covers both the plan premium and the rider premium is split between them in that order. A credit always names the single rider premium charge it relieves and the reason, and never exceeds that charge; a rider cancelled part way through a month is credited in whole months only. No rider premium is charged for a coverage month beginning after the rider end date, and a charge already posted for such a month is relieved by a credit rather than chased.
  eligibility:
  - id: rider_open_for_billing
    applies_to:
    - osb_rider_premium_charge
    - osb_rider_premium_payment
    - osb_rider_premium_credit
    kind: state
    condition: The rider stands at waiting_period, active or premium_suspended on the day the charge is posted.
    evidence_fields:
    - osb_riders.osb_rider_id
    - osb_riders.status
    - osb_riders.rider_effective_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - osb_riders.osb_rider_id
      action_bindings:
        osb_riders.osb_rider_id: osb_rider_id
    state_contract:
      field: osb_riders.status
      allowed:
      - waiting_period
      - active
      - premium_suspended
  - id: payment_not_already_posted
    applies_to:
    - osb_rider_premium_payment
    kind: dedup
    condition: No payment entry carrying the same remittance reference and the same amount is already posted on this rider.
    evidence_fields:
    - osb_rider_premium_ledger.osb_rider_premium_entry_id
    - osb_rider_premium_ledger.remittance_reference
    - osb_rider_premium_ledger.amount
    - osb_rider_premium_ledger.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - osb_rider_premium_ledger.osb_rider_premium_entry_id
      action_bindings:
        osb_rider_premium_ledger.osb_rider_premium_entry_id: osb_rider_premium_entry_id
    dedup_contract:
      table: osb_rider_premium_ledger
      mode: separate_record
      object_bindings:
        remittance_reference: remittance_reference
        osb_rider_id: osb_rider_id
      duplicate_filters:
        event_type:
        - osb_rider_premium_payment
