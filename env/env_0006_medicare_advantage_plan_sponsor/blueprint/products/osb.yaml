# Product and event policy charter — Optional Supplemental Benefit Riders.
# The single registry of every quantified policy in this category; every number appears here once.
category: osb
display_name: Optional Supplemental Benefit Riders
binding:
  holding_table: osb_riders
  event_tables:
  - osb_rider_premium_ledger
  - osb_benefit_claims
  intake_tables:
  - osb_rider_requests
  status_field: status
  variant_field: variant_name
  quantity_fields:
    rider_premium_balance_due: rider_premium_receivable
    annual_maximum_used: benefit_maximum_used
lifecycle:
  states:
  - rider_requested
  - waiting_period
  - active
  - premium_suspended
  - terminated
  - cancelled_before_effective
  transitions:
  - from: rider_requested
    to: waiting_period
    by: agent
    means: The rider is accepted onto the medical plan and its premium and waiting period begin.
  - from: rider_requested
    to: cancelled_before_effective
    by: user
    means: The member withdraws the rider request before it takes effect.
  - from: waiting_period
    to: active
    by: system
    means: The waiting period ends and the rider begins paying for services.
  - from: waiting_period
    to: terminated
    by: user
    means: The rider is ended before benefits ever became payable.
  - from: active
    to: premium_suspended
    by: system
    means: The rider premium goes unpaid past its grace period.
  - from: premium_suspended
    to: active
    by: agent
    means: The rider arrears are paid in full and benefits resume.
  - from: premium_suspended
    to: terminated
    by: user
    means: A suspended rider is ended rather than brought back.
  - from: active
    to: terminated
    by: user
    means: The rider ends at the member's request or with the medical plan that carried it.
accounts:
- key: rider_premium_receivable
  unit: USD
  meaning: 'Rider premium the member owes but has not yet paid: charges increase it, payments and credits reduce it, and its running total is the rider premium balance due.'
- key: benefit_maximum_used
  unit: USD
  meaning: 'Benefit the rider has paid toward this benefit year''s annual maximum: processed lines add to it and reversals take back out of it.'
parameter_schema:
  rider_type: 'What the rider covers: dental, vision, hearing or a bundle of them (string).'
  monthly_rider_premium: Premium charged for the rider each coverage month, in USD.
  rider_premium_due_day_of_month: Calendar day of the coverage month on which the rider premium falls due (integer 1-28).
  rider_premium_grace_period_days: Calendar days after the first unpaid rider premium before the rider is suspended (integer days).
  rider_premium_billed_with_plan: Whether the rider premium appears on the medical plan bill rather than on its own (true or false).
  waiting_period_months: Months from the rider effective date before benefits are payable (integer months).
  waiting_period_waived_at_initial_enrollment: Whether the waiting period is waived for a member taking the rider when their medical plan first begins (true or false).
  waiting_period_waived_with_prior_coverage: Whether proof of earlier comparable coverage waives the waiting period (true or false).
  annual_benefit_maximum: Most the rider will pay in one benefit year, in USD.
  lifetime_benefit_maximum: Most the rider will pay over the life of the rider, in USD; zero where there is no lifetime limit.
  annual_deductible: Deductible taken each benefit year before the rider pays, in USD.
  deductible_applies_to_categories: Benefit categories the deductible is taken on (list of service_category values).
  preventive_coinsurance_percent: Share of the allowed amount the rider pays for preventive dental care, as a percentage.
  basic_restorative_coinsurance_percent: Share of the allowed amount the rider pays for basic restorative dental care, as a percentage.
  major_restorative_coinsurance_percent: Share of the allowed amount the rider pays for major restorative dental care, as a percentage.
  endodontic_coinsurance_percent: Share of the allowed amount the rider pays for root canal treatment, as a percentage.
  periodontic_coinsurance_percent: Share of the allowed amount the rider pays for gum treatment, as a percentage.
  oral_surgery_coinsurance_percent: Share of the allowed amount the rider pays for oral surgery, as a percentage.
  denture_coinsurance_percent: Share of the allowed amount the rider pays for dentures, as a percentage.
  dental_implant_coinsurance_percent: Share of the allowed amount the rider pays for implants, as a percentage.
  orthodontia_covered: Whether orthodontic treatment is covered at all (true or false).
  cleanings_per_benefit_year: How many routine cleanings the rider pays for in a benefit year (integer).
  dental_exams_per_benefit_year: How many dental examinations the rider pays for in a benefit year (integer).
  bitewing_xrays_per_benefit_year: How many bitewing radiograph sets the rider pays for in a benefit year (integer).
  full_mouth_xray_frequency_months: Months that must pass between full-mouth radiograph sets (integer months).
  fluoride_treatments_per_benefit_year: How many fluoride treatments the rider pays for in a benefit year (integer).
  crown_replacement_frequency_months: Months that must pass before a crown on the same tooth is paid for again (integer months).
  denture_replacement_frequency_months: Months that must pass before a denture is paid for again (integer months).
  routine_eye_exam_copay: What the member pays for a routine eye examination, in USD.
  eye_exams_per_benefit_year: How many routine eye examinations the rider pays for in a benefit year (integer).
  frame_allowance: Most the rider pays toward eyeglass frames, in USD.
  frame_frequency_months: Months that must pass before frames are paid for again (integer months).
  lens_allowance: Most the rider pays toward a pair of standard spectacle lenses, in USD.
  contact_lens_allowance: Most the rider pays toward contact lenses instead of spectacles, in USD.
  lens_enhancement_covered: Whether lens enhancements such as anti-reflective coating are covered (true or false).
  hearing_exam_copay: What the member pays for a hearing examination, in USD.
  hearing_aid_allowance_per_ear: Most the rider pays toward a hearing aid for one ear, in USD.
  hearing_aids_per_benefit_year: How many hearing aids the rider pays for in a benefit year (integer).
  hearing_aid_frequency_months: Months that must pass before a hearing aid for the same ear is paid for again (integer months).
  hearing_aid_trial_period_days: Calendar days a member may try a hearing aid and return it for a full refund (integer days).
  hearing_aid_warranty_months: Months of manufacturer warranty included with a hearing aid bought through the rider (integer months).
  out_of_network_reimbursement_percent: Share of the allowed amount the rider pays at a provider outside the network, as a percentage.
  network_provider_count: Number of dental, vision and hearing providers in the rider's network (integer).
  balance_billing_protection: Whether a network provider may bill the member above the allowed amount (true or false).
  claim_filing_window_days: Calendar days after the date of service within which a claim must reach the plan (integer days).
  claim_payment_days: Calendar days within which the rider must pay a clean claim (integer days).
  predetermination_required_above: Treatment plan value above which a predetermination must be obtained first, in USD.
  predetermination_decision_days: Calendar days within which a predetermination must be answered (integer days).
  predetermination_valid_months: Months an approved predetermination holds good for (integer months).
  benefit_appeal_window_days: Calendar days after a denial within which the member may appeal (integer days).
  rider_enrollment_window_days: Calendar days from the start of the medical plan within which the rider may be added outside the annual election period (integer days).
  rider_effective_date_rule: Rule that turns an accepted rider request into a start date (string).
  rider_cancellation_effective_rule: Rule that turns a cancellation into an end date (string).
  minimum_rider_holding_months: Months the rider must be held before it may be cancelled (integer months).
  rider_reinstatement_permitted: Whether a rider terminated for non-payment may be put back in force (true or false).
  available_on_plan_tiers: Medical plan tiers this rider may be attached to (list of official plan names).
  coordination_with_embedded_allowance: How the rider and the medical plan's own embedded allowance are ordered against one service (string).
  maximum_riders_per_member: How many riders one member may hold at once (integer).
  combined_rider_annual_maximum: Most every rider a member holds will pay between them in one benefit year, in USD.
