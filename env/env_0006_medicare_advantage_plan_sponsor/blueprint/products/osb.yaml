- id: osb_claim_reversal_and_correction
  subject:
  - osb_benefit_claim_reversal
  rule: 'A rider claim line already processed is corrected by reversing that exact line and posting a corrected line in its place, never by editing the line that is already there. The reversal names the single processed rider claim line it applies to, and that line is on record with a claim status of paid, denied or adjusted. No reversal of that same processed rider claim line is already on record. The reversal carries the negative of what the reversed line paid, so the benefit year maximum, the combined cap and the frequency counts all return to what they were before it. Where the correction follows a successful appeal the corrected line is processed on the terms the appeal decision directs, and any amount the member already paid the provider above their proper share is refunded to the member. Money the rider overpaid a network provider is recovered from that provider and never taken from the member''s next benefit. Each line is reversed on its own reference: a claim covering several teeth or both eyes is never reversed as a whole, because the lines may be settled differently.'
  eligibility:
  - id: original_line_on_record
    applies_to:
    - osb_benefit_claim_reversal
    kind: state
    condition: The reversal names the single processed rider claim line it applies to, and that line is on record with a claim status of paid, denied or adjusted.
    evidence_fields:
    - osb_benefit_claims.osb_benefit_claim_id
    - osb_benefit_claims.source_claim_id
    - osb_benefit_claims.claim_status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - osb_benefit_claims.source_claim_id
      action_bindings:
        osb_benefit_claims.source_claim_id: source_claim_id
    state_contract:
      field: osb_benefit_claims.claim_status
      allowed:
      - paid
      - denied
      - adjusted
  - id: reversal_not_already_posted
    applies_to:
    - osb_benefit_claim_reversal
    kind: dedup
    condition: No reversal of that same processed rider claim line is already on record.
    evidence_fields:
    - osb_benefit_claims.osb_benefit_claim_id
    - osb_benefit_claims.source_claim_id
    - osb_benefit_claims.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - osb_benefit_claims.source_claim_id
      action_bindings:
        osb_benefit_claims.source_claim_id: source_claim_id
    dedup_contract:
      table: osb_benefit_claims
      mode: separate_record
      object_bindings:
        source_claim_id: source_claim_id
      duplicate_filters:
        event_type:
        - osb_benefit_claim_reversal
      distinct_fields:
      - processed_date
  params:
