events:
- type: osb_rider_requested
  target: osb_riders
  mutation: create
  meaning: A member asks to add an optional supplemental benefit rider to their medical plan and a rider record is opened.
  grain: One row per rider a member holds for one benefit year.
  fields:
    osb_rider_id: Reference number of this rider.
    customer_id: The member asking for the rider.
    variant_name: The official name of the rider asked for.
    status: Opens at rider_requested, the lifecycle entry state.
    linked_plan_reference: The medical plan enrollment the rider attaches to.
    benefit_year: The benefit year the rider covers.
    request_received_date: Date the plan received the request.
    rider_effective_date: First day the rider premium will be charged.
    waiting_period_basis: Why the waiting period on this record is the length it is.
    rider_premium_balance_due: Opens at zero.
    annual_maximum_used: Opens at zero for the benefit year.
    termination_reason: Opens at not_applicable.
  triggers:
  - event: osb:osb_rider_accepted
    map:
      osb_rider_id: osb_rider_id
      status: waiting_period
- type: osb_rider_accepted
  target: osb_riders
  mutation:
    transition:
      from: rider_requested
      to: waiting_period
  meaning: The rider is accepted, the premium begins on its effective date, and any waiting period starts to run.
  grain: One row per rider accepted onto a medical plan.
  fields:
    osb_rider_id: The rider accepted.
    customer_id: The member who holds it.
    status: Moves to waiting_period.
    rider_effective_date: First day the rider premium is charged.
    benefits_available_from: First day the rider will pay for services.
    waiting_period_basis: Why the waiting period is the length it is.
  triggers:
  - event: osb:osb_rider_premium_charge
    map:
      osb_rider_id: osb_rider_id
      customer_id: customer_id
- type: osb_rider_effectuation
  target: osb_riders
  mutation:
    transition:
      from: waiting_period
      to: active
  meaning: The waiting period ends, so the rider begins paying for covered services.
  grain: One row per rider whose benefits become payable.
  fields:
    osb_rider_id: The rider now paying benefits.
    status: Moves to active.
    benefits_available_from: The confirmed first day benefits are payable.
  triggers: []
- type: osb_rider_request_withdrawal
  target: osb_riders
  mutation:
    transition:
      from: rider_requested
      to: cancelled_before_effective
  meaning: The member withdraws the rider request before it takes effect, so no rider premium is ever charged.
  grain: One row per rider request withdrawn before it takes effect.
  fields:
    osb_rider_id: The request withdrawn.
    status: Moves to cancelled_before_effective.
    rider_end_date: Set equal to the effective date that will never be reached.
    termination_reason: Set to withdrawn_before_effective.
  triggers: []
- type: osb_premium_suspension
  target: osb_riders
  mutation:
    transition:
      from: active
      to: premium_suspended
  meaning: The rider premium goes unpaid past its grace period, so the rider stops paying benefits while the arrears stand.
  grain: One row per rider suspended for unpaid premium.
  fields:
    osb_rider_id: The suspended rider.
    status: Moves to premium_suspended.
    rider_premium_balance_due: The arrears as at the day of suspension.
  triggers: []
- type: osb_premium_suspension_cure
  target: osb_riders
  mutation:
    transition:
      from: premium_suspended
      to: active
  meaning: The rider arrears are paid, so the rider pays benefits again from the day the money is posted.
  grain: One row per suspended rider restored.
  fields:
    osb_rider_id: The rider restored.
    status: Returns to active.
    rider_premium_balance_due: Falls to zero once the arrears are settled.
  triggers: []
- type: osb_rider_termination
  target: osb_riders
  mutation:
    transition:
    - from: active
      to: terminated
    - from: premium_suspended
      to: terminated
    - from: waiting_period
      to: terminated
  meaning: The rider ends, because the member cancelled it, because the medical plan it hangs on ended, or because the arrears were never paid.
  grain: One row per rider ended.
  fields:
    osb_rider_id: The rider ended.
    customer_id: The member whose rider ends.
    status: Moves to terminated.
    rider_end_date: Last day the rider pays benefits.
    termination_reason: Why the rider ended.
  triggers: []
- type: osb_rider_detail_update
  target: osb_riders
  mutation: update
  meaning: 'The service details the plan holds on the rider are amended: the network provider on record, or the date benefits become payable after a waiting period is waived.'
  grain: One row per rider record whose service details are amended.
  fields:
    osb_rider_id: The rider amended.
    network_provider_reference: The network provider now on record.
    benefits_available_from: The date benefits become payable, as now recorded.
    waiting_period_basis: Why that date is what it is.
  triggers: []
- type: osb_rider_premium_charge
  target: osb_rider_premium_ledger
  meaning: The rider premium for one coverage month is charged, ordinarily on the same bill as the medical plan premium.
  grain: One row per coverage month of rider premium charged on one rider.
  distinguish_by:
  - billing_period
  - posted_date
  - amount
  fields:
    osb_rider_premium_entry_id: Reference number of this ledger entry.
    osb_rider_id: The rider charged.
    customer_id: The member charged.
    event_type: osb_rider_premium_charge.
    billing_period: The coverage month this charge pays for.
    posted_date: Date the charge was posted.
    amount: The rider premium for that coverage month.
    payment_channel: not_applicable on a charge.
    balance_effect: not_applicable on a charge.
    credit_reason_code: not_applicable on a charge.
  account: rider_premium_receivable
  direction: in
  triggers: []
- type: osb_rider_premium_payment
  target: osb_rider_premium_ledger
  meaning: Money the member paid toward the rider premium is posted against the oldest unpaid coverage month.
  grain: One row per payment posted to one rider.
  distinguish_by:
  - posted_date
  - amount
  - payment_channel
  - remittance_reference
  fields:
    osb_rider_premium_entry_id: Reference number of this ledger entry.
    osb_rider_id: The rider credited.
    customer_id: The member who paid.
    event_type: osb_rider_premium_payment.
    billing_period: The oldest coverage month the money is applied to.
    posted_date: Date the money was posted.
    amount: Amount received.
    payment_channel: How the money reached the plan.
    balance_effect: Whether the posting left part of the balance outstanding, settled it exactly, or exceeded it.
    remittance_reference: The payment reference the member reads from their statement, recorded exactly as stated.
  account: rider_premium_receivable
  direction: out
  triggers:
  - event: osb:osb_premium_suspension_cure
    when:
      balance_effect: settles_balance
    map:
      osb_rider_id: osb_rider_id
      status: active
- type: osb_rider_premium_credit
  target: osb_rider_premium_ledger
  meaning: A credit is posted against a named rider premium charge, because the rider ended part way through the month, was billed during a waiting period it should not have been, or was rated wrongly.
  grain: One row per credit posted against one named rider premium charge.
  distinguish_by:
  - source_premium_entry_id
  - credit_reason_code
  - posted_date
  - amount
  fields:
    osb_rider_premium_entry_id: Reference number of this ledger entry.
    osb_rider_id: The rider credited.
    customer_id: The member credited.
    event_type: osb_rider_premium_credit.
    billing_period: The coverage month of the charge being relieved.
    posted_date: Date the credit was posted.
    amount: Amount of the credit.
    balance_effect: Whether the credit left part of the charge outstanding, settled it exactly, or exceeded it.
    source_premium_entry_id: The single rider premium charge this credit relieves.
    credit_reason_code: Why the credit was granted.
  account: rider_premium_receivable
  direction: out
  triggers: []
- type: osb_benefit_claim_processed
  target: osb_benefit_claims
  meaning: A dental, vision or hearing claim line is processed and the rider's payment and the member's share are fixed.
  grain: One row per claim line the rider processes for one member.
  distinguish_by:
  - date_of_service
  - procedure_code
  - tooth_or_eye_reference
  - provider_npi
  - line_sequence
  fields:
    osb_benefit_claim_id: Reference number of this processed line.
    osb_rider_id: The rider the line was paid under.
    customer_id: The member treated.
    event_type: osb_benefit_claim_processed.
    date_of_service: Date the service was provided.
    processed_date: Date processing finished.
    service_category: The benefit category the service falls under.
    procedure_code: The exact procedure performed.
    tooth_or_eye_reference: Which tooth, eye or ear the service was on.
    network_status: The provider's contract standing on the date of service.
    submitted_charge: What the provider charged.
    allowed_amount: The contracted amount benefit is taken from.
    rider_paid_amount: What the rider paid.
    member_share: What the member owes.
    claim_status: paid, denied or pended.
    denial_reason_code: Why the line was not paid; not_applicable when it was.
    provider_npi: The treating provider.
    predetermination_reference: The predetermination that cleared the service; empty where none was needed.
    line_sequence: Position of this line inside the submitted claim.
  account: benefit_maximum_used
  direction: in
  triggers: []
- type: osb_benefit_claim_reversal
  target: osb_benefit_claims
  meaning: A processed rider claim line is reversed, backing out the benefit it used, so that a corrected line can take its place.
  grain: One row per processed rider claim line reversed.
  distinguish_by:
  - source_claim_id
  - processed_date
  - rider_paid_amount
  fields:
    osb_benefit_claim_id: Reference number of this reversal.
    osb_rider_id: The rider the reversed line sits on.
    customer_id: The member whose benefit is backed out.
    event_type: osb_benefit_claim_reversal.
    date_of_service: Carried over from the line being reversed.
    processed_date: Date the reversal was posted.
    service_category: Carried over from the line being reversed.
    procedure_code: Carried over from the line being reversed.
    tooth_or_eye_reference: Carried over from the line being reversed.
    allowed_amount: Carried over from the line being reversed.
    rider_paid_amount: The negative of what the reversed line paid.
    member_share: What the member owes once the line is restated.
    claim_status: reversed, or adjusted where a corrected line follows.
    source_claim_id: The single processed line this reversal applies to.
    line_sequence: Carried over from the line being reversed.
  account: benefit_maximum_used
  direction: out
  triggers:
  - event: osb:osb_benefit_claim_processed
    when:
      claim_status: adjusted
    map:
      osb_rider_id: osb_rider_id
      customer_id: customer_id
      procedure_code: procedure_code
      tooth_or_eye_reference: tooth_or_eye_reference
measures:
- id: osb_msr_year_to_date_benefit_paid
  window: The current benefit year on the rider, from its first day through the handling date inclusive.
  measure: Sum of rider_paid_amount on osb_benefit_claim_processed rows with claim_status paid, less the amount backed out by osb_benefit_claim_reversal rows in the same benefit year.
- id: osb_msr_preventive_visits_used
  window: The current benefit year on the rider, from its first day through the handling date inclusive.
  measure: Count of osb_benefit_claim_processed rows with claim_status paid, grouped by procedure_code, which is what each frequency limit is counted against.
- id: osb_msr_combined_rider_benefit_paid
  window: The current benefit year, across every rider the member holds.
  measure: Sum of rider_paid_amount on osb_benefit_claim_processed rows with claim_status paid on all of the member's riders, less what osb_benefit_claim_reversal rows backed out in the same benefit year.
policies:
- id: osb_agg_multi_holding
  subject:
  - osb_rider_requested
  rule: A member may hold up to the tier's maximum number of riders at once, so that somebody who wants both a dental and a vision rider is served rather than made to choose. No rider of the same official name is already in force for this member in the same benefit year, standing at rider_requested, waiting_period, active or premium_suspended. The bundle rider is a single rider in its own right and may never be held alongside another rider, because it already covers dental, vision and hearing. Riders in different benefit years are not duplicates, and a member's history usually shows one ended rider record for each year they held it. Where the member already holds the maximum, a further rider is taken only after one is cancelled, and the member is told what the minimum holding period on the existing rider means for that.
  eligibility:
  - id: no_duplicate_rider
    applies_to:
    - osb_rider_requested
    kind: dedup
    condition: No rider of the same official name is already in force for this member in the same benefit year, standing at rider_requested, waiting_period, active or premium_suspended.
    evidence_fields:
    - osb_riders.customer_id
    - osb_riders.variant_name
    - osb_riders.benefit_year
    - osb_riders.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - osb_riders.customer_id
      action_bindings:
        osb_riders.customer_id: customer_id
    dedup_contract:
      table: osb_riders
      mode: separate_record
      object_bindings:
        customer_id: customer_id
        variant_name: variant_name
      duplicate_filters:
        status:
        - rider_requested
        - waiting_period
        - active
        - premium_suspended
      distinct_fields:
      - benefit_year
      - rider_effective_date
  params:
    max_per_customer: 2
    per_tier:
      Ridgecrest Preventive Dental Rider:
        maximum_riders_per_member: =maximum_riders_per_member
      Ridgecrest Vision Plus Rider:
        maximum_riders_per_member: =maximum_riders_per_member
      Ridgecrest Hearing Advantage Rider:
        maximum_riders_per_member: =maximum_riders_per_member
      Ridgecrest Comprehensive Dental Rider:
        maximum_riders_per_member: =maximum_riders_per_member
      Ridgecrest Premier Dental Rider:
        maximum_riders_per_member: =maximum_riders_per_member
      Ridgecrest Dental Vision Hearing Bundle Rider:
        maximum_riders_per_member: =maximum_riders_per_member
- id: osb_agg_combined_rider_maximum
  subject:
  - osb_benefit_claim_processed
  - osb_benefit_claim_reversal
  rule: Where a member holds more than one rider, what the riders pay between them in a benefit year is capped by one combined maximum as well as by each rider's own maximum. Each rider's own annual maximum is applied first on its own claims; the combined cap then applies across the riders, and a line that would pass it is paid only up to what is left. What counts toward both maximums is what the riders actually paid, so a line denied or reversed uses none of the member's entitlement and a member whose claim was reversed gets that headroom back. Where two riders could both pay for the same service, the rider whose benefit category names the service pays it, and the other pays nothing; the two are never added together for one line. The combined cap resets with the benefit year and nothing carries forward, and a member close to it is told before they begin treatment rather than afterwards.
  eligibility: []
  params:
    per_tier:
      Ridgecrest Preventive Dental Rider:
        combined_rider_annual_maximum: =combined_rider_annual_maximum
        annual_benefit_maximum: =annual_benefit_maximum
      Ridgecrest Vision Plus Rider:
        combined_rider_annual_maximum: =combined_rider_annual_maximum
        annual_benefit_maximum: =annual_benefit_maximum
      Ridgecrest Hearing Advantage Rider:
        combined_rider_annual_maximum: =combined_rider_annual_maximum
        annual_benefit_maximum: =annual_benefit_maximum
      Ridgecrest Comprehensive Dental Rider:
        combined_rider_annual_maximum: =combined_rider_annual_maximum
        annual_benefit_maximum: =annual_benefit_maximum
      Ridgecrest Premier Dental Rider:
        combined_rider_annual_maximum: =combined_rider_annual_maximum
        annual_benefit_maximum: =annual_benefit_maximum
      Ridgecrest Dental Vision Hearing Bundle Rider:
        combined_rider_annual_maximum: =combined_rider_annual_maximum
        annual_benefit_maximum: =annual_benefit_maximum
  measures:
  - osb_msr_combined_rider_benefit_paid
- id: osb_rider_enrollment
  subject:
  - osb_rider_requested
  - osb_rider_accepted
  - osb_rider_request_withdrawal
  rule: An optional supplemental benefit rider is bought alongside a medical plan and never on its own, and only on the plan tiers the rider is sold with. The medical plan enrollment the rider names stands at active or premium_grace_period on the day the rider is accepted. The plan receives the rider request no later than the last day of the rider enrollment window counted from the coverage effective date of that medical plan enrollment. Calendar days are counted from the day after the medical plan's coverage effective date, every day of the week counts, a request received on the final day of the window is in time, and full 24-hour periods are never used in place of calendar days. Outside that window a rider may be added only during the annual election period, for cover beginning the following 1 January, and the member is told that date plainly rather than being left to expect cover sooner. The rider takes effect on the date its effective date rule produces from the day the request was received, and the premium runs from that day whether or not the waiting period has ended. Only the member may ask for a rider, because it is an extra premium out of their own pocket, and the plan never adds one because a dentist or a relative asked. A request withdrawn before the rider takes effect leaves no rider at all and no premium is charged; a request withdrawn afterwards is a cancellation and follows the cancellation rules instead. A member on a plan tier the rider is not sold with is told which tiers carry it and when they could move, rather than having the request simply refused.
  eligibility:
  - id: medical_plan_in_force
    applies_to:
    - osb_rider_accepted
    kind: state
    condition: The medical plan enrollment the rider names stands at active or premium_grace_period on the day the rider is accepted.
    evidence_fields:
    - advantage_enrollments.advantage_enrollment_id
    - advantage_enrollments.customer_id
    - advantage_enrollments.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - advantage_enrollments.advantage_enrollment_id
      action_bindings:
        advantage_enrollments.advantage_enrollment_id: linked_plan_reference
    state_contract:
      field: advantage_enrollments.status
      allowed:
      - active
      - premium_grace_period
  - id: rider_enrollment_window_open
    applies_to:
    - osb_rider_requested
    kind: time
    condition: The plan receives the rider request no later than the last day of the rider enrollment window counted from the coverage effective date of that medical plan enrollment.
    evidence_fields:
    - advantage_enrollments.advantage_enrollment_id
    - advantage_enrollments.coverage_effective_date
    - osb_riders.request_received_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - advantage_enrollments.advantage_enrollment_id
      action_bindings:
        advantage_enrollments.advantage_enrollment_id: linked_plan_reference
    temporal_basis:
      clock: frozen_time
      anchor_event: the coverage effective date of that medical plan enrollment
      anchor_source: advantage_enrollments.coverage_effective_date
      relation: not_after
      duration_source: variants.rider_enrollment_window_days
      unit: calendar_days
      counting_rule: Calendar days are counted from the day after the medical plan's coverage effective date, every day of the week counts, a request received on the final day of the window is in time, and full 24-hour periods are never used in place of calendar days.
      boundary: inclusive
  params:
    per_tier:
      Ridgecrest Preventive Dental Rider:
        available_on_plan_tiers: =available_on_plan_tiers
        rider_enrollment_window_days: =rider_enrollment_window_days
        rider_effective_date_rule: =rider_effective_date_rule
        monthly_rider_premium: =monthly_rider_premium
      Ridgecrest Vision Plus Rider:
        available_on_plan_tiers: =available_on_plan_tiers
        rider_enrollment_window_days: =rider_enrollment_window_days
        rider_effective_date_rule: =rider_effective_date_rule
        monthly_rider_premium: =monthly_rider_premium
      Ridgecrest Hearing Advantage Rider:
        available_on_plan_tiers: =available_on_plan_tiers
        rider_enrollment_window_days: =rider_enrollment_window_days
        rider_effective_date_rule: =rider_effective_date_rule
        monthly_rider_premium: =monthly_rider_premium
      Ridgecrest Comprehensive Dental Rider:
        available_on_plan_tiers: =available_on_plan_tiers
        rider_enrollment_window_days: =rider_enrollment_window_days
        rider_effective_date_rule: =rider_effective_date_rule
        monthly_rider_premium: =monthly_rider_premium
      Ridgecrest Premier Dental Rider:
        available_on_plan_tiers: =available_on_plan_tiers
        rider_enrollment_window_days: =rider_enrollment_window_days
        rider_effective_date_rule: =rider_effective_date_rule
        monthly_rider_premium: =monthly_rider_premium
      Ridgecrest Dental Vision Hearing Bundle Rider:
        available_on_plan_tiers: =available_on_plan_tiers
        rider_enrollment_window_days: =rider_enrollment_window_days
        rider_effective_date_rule: =rider_effective_date_rule
        monthly_rider_premium: =monthly_rider_premium
- id: osb_waiting_period
  subject:
  - osb_rider_effectuation
  - osb_rider_detail_update
  rule: 'A rider charges premium from its effective date but pays for services only once its waiting period has run, and the member is told both dates when the rider is taken. The waiting period the tier fixes has run out, counted in whole months from the rider effective date. Calendar months are counted from the day of the month the rider took effect, a month with no matching day ends on its last day, the final day of the waiting period is itself still inside it, and calendar days are never used in place of calendar months. A member who takes the rider when their medical plan first begins has the waiting period waived on the tiers that waive it, and the rider pays from its effective date. A member who shows comparable dental, vision or hearing coverage held immediately before, evidenced by a certificate or verified with the earlier carrier, has the waiting period waived; their own recollection of having had coverage opens the enquiry but never waives it by itself. Preventive care is not exempt: on a tier with a waiting period even a cleaning is the member''s own cost until the period ends, and the plan says so before the appointment rather than after the claim. A claim for a service given inside the waiting period is denied with the reason within_waiting_period, and the member is told the date from which the same service would be paid. Cancelling and retaking a rider starts a fresh waiting period; the months already served are not carried over, and the member is warned of this before cancelling.'
  eligibility:
  - id: waiting_period_elapsed
    applies_to:
    - osb_rider_effectuation
    kind: time
    condition: The waiting period the tier fixes has run out, counted in whole months from the rider effective date.
    evidence_fields:
    - osb_riders.osb_rider_id
    - osb_riders.rider_effective_date
    - osb_riders.waiting_period_basis
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - osb_riders.osb_rider_id
      action_bindings:
        osb_riders.osb_rider_id: osb_rider_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the rider effective date
      anchor_source: osb_riders.rider_effective_date
      relation: not_before
      duration_source: variants.waiting_period_months
      unit: calendar_months
      counting_rule: Calendar months are counted from the day of the month the rider took effect, a month with no matching day ends on its last day, the final day of the waiting period is itself still inside it, and calendar days are never used in place of calendar months.
      boundary: inclusive
  params:
    per_tier:
      Ridgecrest Preventive Dental Rider:
        waiting_period_months: =waiting_period_months
        waiting_period_waived_at_initial_enrollment: =waiting_period_waived_at_initial_enrollment
        waiting_period_waived_with_prior_coverage: =waiting_period_waived_with_prior_coverage
