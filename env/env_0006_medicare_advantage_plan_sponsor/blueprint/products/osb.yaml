- id: osb_coordination_with_medical_plan
  subject:
  - osb_benefit_claim_processed
  - osb_rider_detail_update
  rule: 'The rider and the medical plan''s own embedded dental, vision and hearing allowance are ordered rather than added: the rider pays first on its benefit categories, and the medical plan''s embedded allowance pays only what the rider left unpaid. The rider held is in force on the date of service of the line the medical plan is paying. The supplemental benefit allowance card may then be used toward whatever both have left, on the card tiers that make dental, vision and hearing costs eligible, but never toward an amount the rider has already met. Holding a rider never reduces the medical plan''s embedded allowance and never uses it up: the two maximums stand apart and are shown apart on the member''s benefit summary. A member holding a stand-alone Part D drug plan and no medical plan may hold no rider at all, because a rider is an optional supplemental benefit of a medical plan. Where the member moves to a medical plan tier the rider is not sold with, the rider is ended on the day the old plan ends and the member is told which rider the new tier carries instead.'
