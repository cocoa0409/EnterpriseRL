- id: pdp_redetermination_rights
  subject:
  - pdp_redetermination_filing
  rule: A member, their prescriber, or someone they have appointed in writing may ask the plan to look again at a denied drug coverage determination. The plan receives the redetermination no later than the last day of the filing window counted from the date of the denial notice. Calendar days are counted from the day after that notice date, every day of the week counts, a redetermination received on the final day of the window is in time, and full 24-hour periods are never used in place of calendar days. Where someone other than the member is filing, a valid appointment of representative form is on file, or the appointment is not required because the filer is the member's prescriber. A redetermination received after that day is accepted only where good cause is shown and then only inside the tier's good-cause extension; otherwise it is dismissed with the rationale filed_after_window and the reason explained. A prescriber may ask for a redetermination on the member's behalf without any appointment form, because Medicare treats the prescriber as able to act for the member on drug coverage. The redetermination names the single denial it is filed against; one that names none is held while the plan asks the member which decision they mean, and is never dismissed for that reason alone. Where the plan upholds the denial the case goes to the independent review entity, and the member is told how and by when to take it further.
  eligibility:
  - id: filing_window_open
    applies_to:
    - pdp_redetermination_filing
    kind: time
    condition: The plan receives the redetermination no later than the last day of the filing window counted from the date of the denial notice.
    evidence_fields:
    - pdp_coverage_determinations.pdp_determination_id
    - pdp_coverage_determinations.source_determination_id
    - pdp_coverage_determinations.decision_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - pdp_coverage_determinations.source_determination_id
      action_bindings:
        pdp_coverage_determinations.source_determination_id: source_determination_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the date of the denial notice
      anchor_source: pdp_coverage_determinations.decision_date
      relation: not_after
