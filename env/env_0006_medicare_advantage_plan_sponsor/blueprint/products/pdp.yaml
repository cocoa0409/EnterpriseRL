- id: pdp_transition_and_utilization_management
  subject:
  - pdp_pharmacy_claim_adjudication
  - pdp_coverage_stage_update
  rule: 'A member new to the plan who is already taking a drug that is not on the formulary, or that the formulary restricts, is given a one-time transition supply so that therapy is never interrupted while a coverage determination is sought. The transition supply is of the tier''s transition days supply and may be given the tier''s transition fill count of times inside the member''s first ninety days; a member in a long-term care setting may have the supply repeated for as long as the transition period lasts. Prior authorisation, step therapy and quantity limits apply only on the formulary tiers the tier held lists, and a drug on a tier the plan does not restrict is never held up at the counter for one of these reasons. A refill is refused as too soon until the member has used the tier''s threshold percentage of the previous days supply, except where the member is travelling, has lost the medicine, or the prescriber has changed the dose. The opioid safety edit fires at the tier''s daily morphine milligram equivalent threshold and is a conversation with the prescriber rather than a refusal: the pharmacist may dispense once the prescriber confirms the dose is intended. Where the member has already used every transition fill the plan tells them so plainly and helps them file an exception, rather than letting them find out at the counter. Medication therapy management is offered where the member takes at least the tier''s drug count of maintenance drugs and their annual drug cost passes the tier''s threshold; it is an offer, never a condition of coverage.'
  eligibility: []
  params:
    per_tier:
      Ridgecrest RxSecure Basic (PDP):
        transition_fill_days_supply: =transition_fill_days_supply
        transition_fill_count: =transition_fill_count
        prior_authorization_required_tiers: =prior_authorization_required_tiers
        step_therapy_required_tiers: =step_therapy_required_tiers
        quantity_limit_enforced: =quantity_limit_enforced
