- id: pdp_point_of_sale_cost_share
  subject:
  - pdp_pharmacy_claim_adjudication
  rule: 'What the member pays at the counter is taken from the negotiated price for the product, chosen by the formulary tier the product sits on, the standing of the dispensing pharmacy and the payment stage the member is in. The enrollment is in a status of active or premium_grace_period on the fill date of the prescription. A preferred retail pharmacy gives the tier''s preferred figure and a standard retail pharmacy its standard figure; mail order and ninety-day retail fills take the one-month figure multiplied by the tier''s extended-supply multiplier, and the member never pays more than the negotiated price however the multiplier falls. A covered insulin product costs the member no more than the insulin cap for a one-month supply, whatever tier it sits on and whatever stage the member is in, and the deductible is never taken on insulin. Adult vaccines recommended by the immunisation schedule cost the member nothing at any stage. Where the fill''s formulary tier is one the tier enforces prior authorisation on, an approved coverage determination covering that product and still inside its approved through date is on record. A fill rejected at the counter is never simply refused: the member is told the reason code, what the plan needs, and that they may ask for a coverage determination the same day. A fill at an out-of-network pharmacy is handled on the footing the tier''s out-of-network rule gives, and where it is covered only in an emergency the member pays the pharmacy and claims the difference back from the plan. Where CMS has told the plan that the member has the full low-income subsidy, the subsidy copays replace the tier''s own figures and the tier''s deductible does not apply.'
