- id: pdp_claim_reversal_and_repricing
  subject:
  - pdp_pharmacy_claim_reversal
  rule: 'A fill already priced is corrected by reversing that exact fill and, where a correction is due, pricing a fresh fill in its place. The reversal names the single priced fill it applies to, and that fill is on record with a claim status of paid or adjusted. No reversal of that same priced fill is already on record. The reversal carries the negative of what the member and the plan paid, so the out-of-pocket accumulator and the payment stage return to what they were before the fill. A pharmacy may reverse a fill it never handed over, and a member may have a fill reversed where state law lets them return an unopened product; a fill the member has taken away is never reversed on the member''s word alone. Where the correction follows an approved exception the fresh fill is priced at the tier the decision directs, and the difference is refunded to the member. Each fill is reversed on its own reference: a prescription with several refills is never reversed as a whole.'
  eligibility:
  - id: original_fill_on_record
    applies_to:
    - pdp_pharmacy_claim_reversal
    kind: state
    condition: The reversal names the single priced fill it applies to, and that fill is on record with a claim status of paid or adjusted.
