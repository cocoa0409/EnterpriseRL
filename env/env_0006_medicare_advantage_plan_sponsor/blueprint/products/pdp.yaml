events:
- type: pdp_enrollment_created
  target: pdp_enrollments
  mutation: create
  meaning: A member's election of a Ridgecrest stand-alone prescription drug plan is accepted and an enrollment record is opened for the contract year.
  grain: One row per stand-alone drug plan enrollment a member holds for one contract year.
  fields:
    pdp_enrollment_id: Reference number the plan assigns to this enrollment.
    customer_id: The member whose election this is.
    variant_name: The official drug plan name elected.
    status: Opens at enrollment_submitted, the lifecycle entry state.
    plan_year: Contract year the election belongs to.
    contract_plan_segment: CMS contract, plan benefit package and segment elected.
    application_received_date: Date the plan received the completed election form.
    coverage_effective_date: First day drug coverage will be in force once CMS accepts the transaction.
    election_period_code: Election period the member is enrolling under.
    coverage_stage: Opens at not_yet_effective.
    troop_accumulated: Opens at zero for the contract year.
    premium_balance_due: 'Opens at zero: nothing has been billed yet.'
    penalty_balance_due: Opens at zero.
    late_enrollment_penalty_months: The months without creditable coverage CMS has counted, as known at election.
    low_income_subsidy_applied: The subsidy CMS has told the plan to apply, or no_subsidy.
    premium_payment_method: Payment method chosen on the election form.
    premium_billing_frequency: Billing cadence assigned at election.
    disenrollment_reason_code: Opens at not_applicable.
  triggers:
  - event: pdp:pdp_cms_transmission
    map:
      pdp_enrollment_id: pdp_enrollment_id
      status: cms_transaction_pending
- type: pdp_cms_transmission
  target: pdp_enrollments
  mutation:
    transition:
      from: enrollment_submitted
      to: cms_transaction_pending
  meaning: The accepted election is transmitted to CMS on the daily enrollment file and waits for the transaction reply.
  grain: One row per drug plan enrollment awaiting a CMS reply.
  fields:
    pdp_enrollment_id: The enrollment transmitted.
    status: Moves to cms_transaction_pending.
    cms_transaction_reply_code: Written with the reply code once CMS answers.
  triggers: []
- type: pdp_coverage_effectuation
  target: pdp_enrollments
  mutation:
    transition:
      from: cms_transaction_pending
      to: active
  meaning: CMS accepts the transaction and the coverage effective date arrives, so drug coverage comes into force and the member's payment stage opens.
  grain: One row per drug plan enrollment brought into force.
  fields:
    pdp_enrollment_id: The enrollment brought into force.
    customer_id: The member now covered.
    status: Moves to active.
    coverage_effective_date: Confirmed first day of drug coverage.
    coverage_stage: Opens at deductible, or at initial_coverage on a tier whose deductible is zero.
    late_enrollment_penalty_months: The months CMS counted, carried into billing.
    low_income_subsidy_applied: The subsidy in force on the effective date.
  triggers:
  - event: pdp:pdp_premium_charge
    map:
      pdp_enrollment_id: pdp_enrollment_id
      customer_id: customer_id
  - event: pdp:pdp_penalty_assessment
    when:
      low_income_subsidy_applied: no_subsidy
    map:
      pdp_enrollment_id: pdp_enrollment_id
      customer_id: customer_id
      charge_component: late_enrollment_penalty
- type: pdp_application_withdrawal
  target: pdp_enrollments
  mutation:
    transition:
    - from: enrollment_submitted
      to: cancelled_before_effective
    - from: cms_transaction_pending
      to: cancelled_before_effective
  meaning: The member withdraws their drug plan application before coverage has begun, so no coverage period ever exists.
  grain: One row per drug plan application withdrawn before its effective date.
  fields:
    pdp_enrollment_id: The application withdrawn.
    status: Moves to cancelled_before_effective.
    coverage_end_date: Set equal to the effective date that will never be reached.
    disenrollment_reason_code: Set to withdrawn_before_effective.
  triggers: []
- type: pdp_grace_period_start
  target: pdp_enrollments
  mutation:
    transition:
      from: active
      to: premium_grace_period
  meaning: A monthly drug plan premium is still unpaid after its due day, so the enrollment enters the premium grace period.
  grain: One row per delinquency that puts a drug plan enrollment into the grace period.
  fields:
    pdp_enrollment_id: The delinquent enrollment.
    status: Moves to premium_grace_period.
    premium_balance_due: The outstanding premium as at the day the grace period began.
  triggers: []
- type: pdp_grace_period_cure
  target: pdp_enrollments
  mutation:
    transition:
      from: premium_grace_period
      to: active
  meaning: The full outstanding premium reaches the plan inside the grace period, so drug coverage carries on unbroken.
  grain: One row per drug plan delinquency cured inside its grace period.
  fields:
    pdp_enrollment_id: The enrollment restored.
    status: Returns to active.
    premium_balance_due: Falls to zero once the outstanding premium is settled.
  triggers: []
- type: pdp_nonpayment_termination
  target: pdp_enrollments
  mutation:
    transition:
      from: premium_grace_period
      to: terminated_for_nonpayment
  meaning: The grace period expires with drug plan premium still outstanding, so coverage ends involuntarily.
  grain: One row per drug plan enrollment terminated for non-payment.
  fields:
    pdp_enrollment_id: The enrollment terminated.
    customer_id: The member whose drug coverage ends.
    status: Moves to terminated_for_nonpayment.
    coverage_end_date: Last day of the month in which the grace period expired.
    disenrollment_reason_code: Set to nonpayment_of_premium.
  triggers: []
- type: pdp_voluntary_disenrollment
  target: pdp_enrollments
  mutation:
    transition:
    - from: active
      to: disenrolled
    - from: premium_grace_period
      to: disenrolled
  meaning: The member leaves the drug plan during an election period open to them, or is moved out because they have joined a Medicare Advantage plan that includes drug coverage.
  grain: One row per drug plan enrollment ended at the member's election.
  fields:
    pdp_enrollment_id: The enrollment being ended.
    customer_id: The member ending it.
    status: Moves to disenrolled.
    coverage_end_date: Last day of the month in which the plan received the request.
    disenrollment_reason_code: voluntary_election, other_plan_election or enrolled_in_ma_pd.
  triggers: []
- type: pdp_reinstatement
  target: pdp_enrollments
  mutation:
    transition:
      from: terminated_for_nonpayment
      to: active
  meaning: A recorded good-cause determination restores drug coverage that had been terminated for non-payment, without a gap in the coverage period.
  grain: One row per drug plan enrollment reinstated after an involuntary termination.
  fields:
    pdp_enrollment_id: The enrollment reinstated.
    status: Returns to active.
    coverage_end_date: Cleared, because the coverage period is continuous again.
    coverage_stage: The payment stage the member stood in when coverage ended, restored unchanged.
    disenrollment_reason_code: Returns to not_applicable.
  triggers: []
- type: pdp_coverage_stage_update
  target: pdp_enrollments
  mutation: update
  meaning: The member's drug payment stage and accumulators are brought up to date after a fill is priced or backed out, or after CMS supplies a new subsidy level.
  grain: One row per drug plan enrollment whose accumulators are restated.
  fields:
    pdp_enrollment_id: The enrollment restated.
    coverage_stage: The payment stage the member is now in.
    troop_accumulated: True out-of-pocket accumulated this contract year.
    low_income_subsidy_applied: The subsidy level now in force.
    late_enrollment_penalty_months: The months without creditable coverage as CMS now counts them.
  triggers: []
- type: pdp_premium_charge
  target: pdp_premium_ledger
  meaning: The drug plan premium for one coverage month is billed to the member's premium account.
  grain: One row per coverage month and premium component billed on one enrollment.
  distinguish_by:
  - billing_period
  - charge_component
  - posted_date
  - amount
  fields:
    pdp_premium_entry_id: Reference number of this ledger entry.
    pdp_enrollment_id: The enrollment billed.
    customer_id: The member billed.
    event_type: pdp_premium_charge.
    billing_period: The coverage month this charge pays for.
    posted_date: Date the charge was posted.
    amount: The premium component billed for that coverage month.
    charge_component: basic_premium or supplemental_premium.
    payment_channel: not_applicable on a charge.
    balance_effect: not_applicable on a charge.
    adjustment_reason_code: not_applicable on a charge.
  account: premium_receivable
  direction: in
  triggers: []
- type: pdp_premium_payment
  target: pdp_premium_ledger
  meaning: Money the member paid toward the drug plan premium is posted against the oldest unpaid coverage month.
  grain: One row per payment received and posted on one drug plan enrollment.
  distinguish_by:
  - posted_date
  - amount
  - payment_channel
  - remittance_reference
  fields:
    pdp_premium_entry_id: Reference number of this ledger entry.
    pdp_enrollment_id: The enrollment credited.
    customer_id: The member who paid.
    event_type: pdp_premium_payment.
    billing_period: The oldest coverage month the money is applied to.
    posted_date: Date the money was posted.
    amount: Amount received.
    charge_component: not_applicable on a payment.
    payment_channel: How the money reached the plan.
    balance_effect: Whether the posting left part of the balance outstanding, settled it exactly, or exceeded it.
    remittance_reference: The payment reference the member reads from their statement, recorded exactly as stated.
  account: premium_receivable
  direction: out
  triggers:
  - event: pdp:pdp_grace_period_cure
    when:
      balance_effect: settles_balance
    map:
      pdp_enrollment_id: pdp_enrollment_id
      status: active
- type: pdp_premium_credit_adjustment
  target: pdp_premium_ledger
  meaning: A credit is posted against a named premium charge, because the low-income subsidy applies, the rate changed retroactively, or the charge was raised in error.
  grain: One row per credit posted against one named premium charge.
  distinguish_by:
  - source_premium_entry_id
  - adjustment_reason_code
  - posted_date
  - amount
  fields:
    pdp_premium_entry_id: Reference number of this ledger entry.
    pdp_enrollment_id: The enrollment credited.
    customer_id: The member credited.
    event_type: pdp_premium_credit_adjustment.
    billing_period: The coverage month of the charge being relieved.
    posted_date: Date the credit was posted.
    amount: Amount of the credit.
    charge_component: The component of the bill the credit relieves.
    balance_effect: Whether the credit left part of the charge outstanding, settled it exactly, or exceeded it.
    source_premium_entry_id: The single premium charge this credit applies to.
    adjustment_reason_code: Why the credit was granted.
  account: premium_receivable
  direction: out
  triggers:
  - event: pdp:pdp_penalty_removal
    when:
      adjustment_reason_code: low_income_subsidy_premium_reduction
    map:
      pdp_enrollment_id: pdp_enrollment_id
      customer_id: customer_id
      adjustment_reason_code: adjustment_reason_code
      charge_component: late_enrollment_penalty
- type: pdp_penalty_assessment
  target: pdp_premium_ledger
  meaning: The late enrollment penalty for one coverage month is billed alongside the premium, because CMS has counted months in which the member had no creditable drug coverage.
  grain: One row per coverage month of late enrollment penalty billed on one enrollment.
  distinguish_by:
  - billing_period
  - charge_component
  - amount
  - posted_date
  fields:
    pdp_premium_entry_id: Reference number of this ledger entry.
    pdp_enrollment_id: The enrollment charged.
    customer_id: The member charged.
    event_type: pdp_penalty_assessment.
    billing_period: The coverage month the penalty is charged for.
    posted_date: Date the penalty was posted.
    amount: The monthly penalty amount.
    charge_component: late_enrollment_penalty.
    adjustment_reason_code: not_applicable on an assessment.
  account: penalty_receivable
  direction: in
  triggers: []
- type: pdp_penalty_removal
  target: pdp_premium_ledger
  meaning: A late enrollment penalty already charged is taken back off the account, because the member proved earlier creditable coverage, CMS recalculated the months, or a low-income subsidy now applies.
  grain: One row per penalty charge relieved on one enrollment.
  distinguish_by:
  - source_premium_entry_id
  - adjustment_reason_code
  - posted_date
  - amount
  fields:
    pdp_premium_entry_id: Reference number of this ledger entry.
    pdp_enrollment_id: The enrollment credited.
    customer_id: The member credited.
    event_type: pdp_penalty_removal.
    billing_period: The coverage month whose penalty is relieved.
    posted_date: Date the removal was posted.
    amount: Amount of penalty taken back off.
    charge_component: late_enrollment_penalty.
    source_premium_entry_id: The single penalty charge this removal applies to.
    adjustment_reason_code: Why the penalty was removed.
  account: penalty_receivable
  direction: out
  triggers: []
- type: pdp_pharmacy_claim_adjudication
  target: pdp_pharmacy_claims
  meaning: A pharmacy dispenses a prescription and the plan prices the fill, fixing what the member pays at the counter and what the plan pays the pharmacy.
  grain: One row per fill of one prescription at one pharmacy.
  distinguish_by:
  - fill_date
  - prescription_reference
  - refill_number
  - national_drug_code
  - days_supply
  fields:
    pdp_pharmacy_claim_id: Reference number of this fill.
    pdp_enrollment_id: The enrollment the fill was priced under.
    customer_id: The member the drug was dispensed to.
    event_type: pdp_pharmacy_claim_adjudication.
    fill_date: Date the pharmacy dispensed the prescription.
    prescription_reference: The prescription this fill belongs to.
    refill_number: Which fill of that prescription this is.
    national_drug_code: The exact product dispensed.
    formulary_tier: The tier the product sits on.
    days_supply: Days of therapy dispensed.
    pharmacy_network_status: The dispensing pharmacy's network standing.
    negotiated_price: The negotiated price cost share is taken from.
    member_paid_amount: What the member paid at the counter.
    plan_paid_amount: What the plan paid the pharmacy.
    coverage_stage_at_fill: The payment stage the member was in when the fill was priced.
    claim_status: paid or rejected.
    rejection_reason_code: Why the fill was rejected; not_applicable when it was paid.
    determination_reference: The coverage determination that allowed the fill; empty where none was needed.
    transition_fill_flag: Whether the fill was supplied under the transition policy.
  account: true_out_of_pocket
  direction: in
  triggers:
  - event: pdp:pdp_coverage_stage_update
    when:
      claim_status: paid
    map:
      pdp_enrollment_id: pdp_enrollment_id
- type: pdp_pharmacy_claim_reversal
  target: pdp_pharmacy_claims
  meaning: A priced fill is reversed, because the pharmacy did not hand the drug over, the member returned it unopened under state law, or the fill is being repriced.
  grain: One row per priced fill reversed.
  distinguish_by:
  - source_pharmacy_claim_id
  - fill_date
  - member_paid_amount
  fields:
    pdp_pharmacy_claim_id: Reference number of this reversal.
    pdp_enrollment_id: The enrollment the reversed fill sits on.
    customer_id: The member whose payment is backed out.
    event_type: pdp_pharmacy_claim_reversal.
    fill_date: Carried over from the fill being reversed.
    prescription_reference: Carried over from the fill being reversed.
    national_drug_code: Carried over from the fill being reversed.
    formulary_tier: Carried over from the fill being reversed.
    days_supply: Carried over from the fill being reversed.
    negotiated_price: Carried over from the fill being reversed.
    member_paid_amount: The negative of what the member paid on the reversed fill.
    plan_paid_amount: The negative of what the plan paid on the reversed fill.
    coverage_stage_at_fill: Carried over from the fill being reversed.
    claim_status: reversed, or adjusted where a repriced fill follows.
    source_pharmacy_claim_id: The single priced fill this reversal applies to.
  account: true_out_of_pocket
  direction: out
  triggers:
  - event: pdp:pdp_coverage_stage_update
    map:
      pdp_enrollment_id: pdp_enrollment_id
- type: pdp_coverage_determination_request
  target: pdp_coverage_determinations
  meaning: The member or their prescriber asks the plan to cover a drug, to make an exception to the formulary, or to place a drug on a lower cost-share tier.
  grain: One row per drug coverage request received for one product.
  distinguish_by:
  - national_drug_code
  - received_date
  - received_time
  - request_type
  fields:
    pdp_determination_id: Reference number of this request.
    pdp_enrollment_id: The enrollment the request is made under.
    customer_id: The member the request concerns.
    event_type: pdp_coverage_determination_request.
    request_type: Which kind of determination or exception is being asked for.
    national_drug_code: The product in question.
    received_date: Date the plan received the request.
    received_time: Time of day the request arrived.
    prescriber_statement_received: Whether the prescriber's supporting statement is in hand.
    decision_outcome: Opens at pending.
    prescriber_npi: The prescriber supporting the request.
    request_channel: How the request reached the plan.
    representative_form_on_file: Whether an appointment of representative form is needed and held.
  triggers:
  - event: pdp:pdp_coverage_determination_decision
    map:
      pdp_enrollment_id: pdp_enrollment_id
      customer_id: customer_id
      request_type: request_type
      national_drug_code: national_drug_code
      source_determination_id: pdp_determination_id
- type: pdp_coverage_determination_decision
  target: pdp_coverage_determinations
  meaning: The plan decides a drug coverage request, an exception or a redetermination, and records the outcome, the reason and how long an approval holds good.
  grain: One row per decision the plan issues on one named drug request.
  distinguish_by:
  - source_determination_id
  - decision_date
  - decision_time
  - decision_outcome
  fields:
    pdp_determination_id: Reference number of this decision record.
    pdp_enrollment_id: The enrollment the decision is made under.
    customer_id: The member the decision concerns.
    event_type: pdp_coverage_determination_decision.
    request_type: Carried over from the request being decided.
    national_drug_code: The product decided on.
    decision_date: Date the decision was given.
    decision_time: Time of day the decision was given.
    decision_outcome: Approved, partially approved, denied, dismissed or withdrawn.
    decision_rationale_code: The reason recorded with the disposition.
    approved_through_date: Last day the approval holds good; empty on a denial.
    source_determination_id: The single request or redetermination this decision disposes of.
  triggers: []
- type: pdp_redetermination_filing
  target: pdp_coverage_determinations
  meaning: The member, their prescriber or an appointed representative asks the plan to look again at a denied drug coverage determination.
  grain: One row per redetermination filed against one named determination.
  distinguish_by:
  - source_determination_id
  - received_date
  - received_time
  - request_type
  fields:
    pdp_determination_id: Reference number of this redetermination.
    pdp_enrollment_id: The enrollment the redetermination is filed under.
    customer_id: The member appealing.
    event_type: pdp_redetermination_filing.
    request_type: Standard or expedited redetermination.
    national_drug_code: The product in dispute.
    received_date: Date the plan received the redetermination.
    received_time: Time of day it arrived.
    prescriber_statement_received: Whether the prescriber's supporting statement is in hand.
    decision_outcome: Opens at pending.
    source_determination_id: The single denial this redetermination is filed against.
    representative_form_on_file: Whether an appointment of representative form is needed and held.
    request_channel: How the redetermination reached the plan.
  triggers:
  - event: pdp:pdp_coverage_determination_decision
    map:
      pdp_enrollment_id: pdp_enrollment_id
      customer_id: customer_id
      request_type: request_type
      national_drug_code: national_drug_code
      source_determination_id: pdp_determination_id
measures:
- id: pdp_msr_year_to_date_troop
  window: 'The current contract year to date: from 1 January of the plan_year on the enrollment through the handling date inclusive.'
  measure: Sum of member_paid_amount on pdp_pharmacy_claim_adjudication rows with claim_status paid, less the member_paid_amount backed out by pdp_pharmacy_claim_reversal rows in the same window.
- id: pdp_msr_creditable_coverage_gap_months
  window: From the end of the member's initial enrollment period for Part D through the coverage effective date of this enrollment.
  measure: Whole months in that span in which the member held neither Part D coverage nor other creditable drug coverage, as counted by CMS and carried on late_enrollment_penalty_months.
- id: pdp_msr_transition_fills_used
  window: The first 90 calendar days from the coverage effective date of this enrollment.
  measure: Count of pdp_pharmacy_claim_adjudication rows whose transition_fill_flag is transition_fill_supplied.
policies:
- id: pdp_agg_multi_holding
  subject:
  - pdp_enrollment_created
  rule: A member may hold only one stand-alone Part D prescription drug plan at a time, because Medicare allows only one drug plan election to be in force in any coverage month. No other stand-alone Part D enrollment for the same member is in a status of enrollment_submitted, cms_transaction_pending, active or premium_grace_period on the day the new election is recorded. Where such an enrollment exists the new election is recorded as a plan change and the earlier enrollment ends on the day before the new coverage begins, so the member is never left without drug coverage for a day and never billed twice for one month. Enrollments for different contract years that do not overlap are not duplicates, and a member's history may show several ended drug plans. A member who asks to keep two drug plans at once is refused and told why, because Medicare will not accept the second election.
  eligibility:
  - id: single_drug_plan_in_force
    applies_to:
    - pdp_enrollment_created
    kind: dedup
    condition: No other stand-alone Part D enrollment for the same member is in a status of enrollment_submitted, cms_transaction_pending, active or premium_grace_period on the day the new election is recorded.
    evidence_fields:
    - pdp_enrollments.customer_id
    - pdp_enrollments.status
    - pdp_enrollments.plan_year
    - pdp_enrollments.coverage_effective_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - pdp_enrollments.customer_id
      action_bindings:
        pdp_enrollments.customer_id: customer_id
    dedup_contract:
      table: pdp_enrollments
      mode: separate_record
      object_bindings:
        customer_id: customer_id
      duplicate_filters:
        status:
        - enrollment_submitted
        - cms_transaction_pending
        - active
        - premium_grace_period
      distinct_fields:
      - plan_year
      - coverage_effective_date
  params:
    max_per_customer: 1
- id: pdp_election_period_eligibility
  subject:
  - pdp_enrollment_created
  - pdp_cms_transmission
  rule: A drug plan election is accepted only under an election period open to the member on the day the plan receives the completed election form. The member's permanent residence recorded on their profile lies in one of the states in the elected plan's region. The enrollment request on file carries an election period code, and where that code names a special election period the request also carries what the plan holds as evidence of the circumstance. The annual election period runs from 15 October to 7 December for coverage beginning the following 1 January; the initial enrollment period for Part D surrounds the member's first entitlement to Part A or enrollment in Part B; a member who loses creditable drug coverage has two months from the loss to elect a plan. A member receiving the low-income subsidy may change drug plans once in each calendar quarter of the first three quarters of the year, and that right is checked against the subsidy level CMS supplied rather than against the member's own account of it. Where no election period is open the election is refused, the member is told when the next one opens, and the plan never moves a receipt date to reach a closed period.
  eligibility:
  - id: plan_region_residence
    applies_to:
    - pdp_enrollment_created
    kind: caller_fact
    condition: The member's permanent residence recorded on their profile lies in one of the states in the elected plan's region.
    evidence_fields:
    - customers.customer_id
    - customers.residence_zip_code
    - customers.residence_county
    evidence_contract:
      authority: mixed
      timing: pre_action
      correlation_keys:
      - - customers.customer_id
      action_bindings:
        customers.customer_id: customer_id
  - id: election_period_recorded
    applies_to:
    - pdp_enrollment_created
    - pdp_cms_transmission
    kind: caller_fact
    condition: The enrollment request on file carries an election period code, and where that code names a special election period the request also carries what the plan holds as evidence of the circumstance.
    evidence_fields:
    - pdp_enrollment_requests.pdp_enrollment_request_id
    - pdp_enrollment_requests.election_period_code
    - pdp_enrollment_requests.prior_coverage_evidence
    evidence_contract:
      authority: mixed
      timing: pre_action
      correlation_keys:
      - - pdp_enrollment_requests.pdp_enrollment_request_id
      action_bindings:
        pdp_enrollment_requests.pdp_enrollment_request_id: pdp_enrollment_request_id
  params:
    per_tier:
      Ridgecrest RxSecure Basic (PDP):
        service_area_states: =service_area_states
        enrollment_capacity_limit: =enrollment_capacity_limit
        star_rating: =star_rating
      Ridgecrest RxSecure Value (PDP):
        service_area_states: =service_area_states
        enrollment_capacity_limit: =enrollment_capacity_limit
        star_rating: =star_rating
      Ridgecrest RxSecure Select (PDP):
        service_area_states: =service_area_states
        enrollment_capacity_limit: =enrollment_capacity_limit
        star_rating: =star_rating
      Ridgecrest RxSecure Plus (PDP):
        service_area_states: =service_area_states
        enrollment_capacity_limit: =enrollment_capacity_limit
        star_rating: =star_rating
      Ridgecrest RxSecure Complete (PDP):
        service_area_states: =service_area_states
        enrollment_capacity_limit: =enrollment_capacity_limit
        star_rating: =star_rating
      Ridgecrest RxSecure Premier (PDP):
        service_area_states: =service_area_states
        enrollment_capacity_limit: =enrollment_capacity_limit
        star_rating: =star_rating
- id: pdp_coverage_effective_date
  subject:
  - pdp_coverage_effectuation
  rule: 'Drug coverage comes into force on the date the tier''s effective date rule produces from the day the plan received the completed election form. CMS has returned an accepting transaction reply code for this drug plan enrollment and that code is recorded on the enrollment record. Under the rule first_of_month_following_receipt an election received in any month takes effect on the first day of the next month; an election made in the annual election period takes effect on 1 January of the following contract year. Effectuation opens the member''s payment stage: at the deductible stage where the tier carries a deductible, and directly at initial coverage where it does not. Retroactive effectuation happens only where CMS directs it and only as far back as the tier allows; a member who paid cash at the pharmacy during a retroactive period is reimbursed on a direct member reimbursement claim rather than by repricing the pharmacy''s own claim.'
  eligibility:
  - id: cms_acceptance_recorded
    applies_to:
    - pdp_coverage_effectuation
    kind: authorization
    condition: CMS has returned an accepting transaction reply code for this drug plan enrollment and that code is recorded on the enrollment record.
    evidence_fields:
    - pdp_enrollments.pdp_enrollment_id
    - pdp_enrollments.cms_transaction_reply_code
    - pdp_enrollments.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - pdp_enrollments.pdp_enrollment_id
      action_bindings:
        pdp_enrollments.pdp_enrollment_id: pdp_enrollment_id
  params:
    per_tier:
      Ridgecrest RxSecure Basic (PDP):
        effective_date_rule: =effective_date_rule
        maximum_retroactive_months: =maximum_retroactive_months
        annual_deductible: =annual_deductible
      Ridgecrest RxSecure Value (PDP):
        effective_date_rule: =effective_date_rule
        maximum_retroactive_months: =maximum_retroactive_months
        annual_deductible: =annual_deductible
      Ridgecrest RxSecure Select (PDP):
        effective_date_rule: =effective_date_rule
        maximum_retroactive_months: =maximum_retroactive_months
        annual_deductible: =annual_deductible
      Ridgecrest RxSecure Plus (PDP):
        effective_date_rule: =effective_date_rule
        maximum_retroactive_months: =maximum_retroactive_months
        annual_deductible: =annual_deductible
      Ridgecrest RxSecure Complete (PDP):
        effective_date_rule: =effective_date_rule
        maximum_retroactive_months: =maximum_retroactive_months
        annual_deductible: =annual_deductible
      Ridgecrest RxSecure Premier (PDP):
        effective_date_rule: =effective_date_rule
        maximum_retroactive_months: =maximum_retroactive_months
        annual_deductible: =annual_deductible
- id: pdp_premium_billing
  subject:
  - pdp_premium_charge
  - pdp_penalty_assessment
  rule: The plan bills the drug plan premium of the tier held for each coverage month from the coverage effective date to the coverage end date, split into its basic and supplemental components so that each can be relieved on its own. The enrollment is in a status of active or premium_grace_period on the day the charge is posted. The late enrollment penalty is billed as its own component of the same coverage month, never folded into the premium, because the two are relieved by different events and a member may owe one without the other. Where CMS has told the plan that a low-income subsidy applies, the full premium is still charged and the subsidy is posted separately as a credit, so the member can see what the plan charged and what the subsidy paid. A quarterly billing frequency bills three coverage months in one charge posted in the first of those months, and what is owed for a coverage month never changes with the frequency. No premium or penalty is charged for a coverage month beginning after the coverage end date, and a charge already posted for such a month is relieved by a credit rather than left outstanding.
  eligibility:
  - id: coverage_in_force_for_billing
    applies_to:
    - pdp_premium_charge
    - pdp_penalty_assessment
    kind: state
    condition: The enrollment is in a status of active or premium_grace_period on the day the charge is posted.
    evidence_fields:
    - pdp_enrollments.pdp_enrollment_id
    - pdp_enrollments.status
    - pdp_enrollments.coverage_effective_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - pdp_enrollments.pdp_enrollment_id
      action_bindings:
        pdp_enrollments.pdp_enrollment_id: pdp_enrollment_id
    state_contract:
      field: pdp_enrollments.status
      allowed:
      - active
      - premium_grace_period
  params:
    per_tier:
      Ridgecrest RxSecure Basic (PDP):
        monthly_plan_premium: =monthly_plan_premium
        basic_premium_portion: =basic_premium_portion
        supplemental_premium_portion: =supplemental_premium_portion
        premium_due_day_of_month: =premium_due_day_of_month
        premium_billing_frequency_default: =premium_billing_frequency_default
      Ridgecrest RxSecure Value (PDP):
        monthly_plan_premium: =monthly_plan_premium
        basic_premium_portion: =basic_premium_portion
        supplemental_premium_portion: =supplemental_premium_portion
        premium_due_day_of_month: =premium_due_day_of_month
        premium_billing_frequency_default: =premium_billing_frequency_default
      Ridgecrest RxSecure Select (PDP):
        monthly_plan_premium: =monthly_plan_premium
        basic_premium_portion: =basic_premium_portion
        supplemental_premium_portion: =supplemental_premium_portion
        premium_due_day_of_month: =premium_due_day_of_month
        premium_billing_frequency_default: =premium_billing_frequency_default
      Ridgecrest RxSecure Plus (PDP):
        monthly_plan_premium: =monthly_plan_premium
        basic_premium_portion: =basic_premium_portion
        supplemental_premium_portion: =supplemental_premium_portion
        premium_due_day_of_month: =premium_due_day_of_month
        premium_billing_frequency_default: =premium_billing_frequency_default
      Ridgecrest RxSecure Complete (PDP):
        monthly_plan_premium: =monthly_plan_premium
        basic_premium_portion: =basic_premium_portion
        supplemental_premium_portion: =supplemental_premium_portion
        premium_due_day_of_month: =premium_due_day_of_month
        premium_billing_frequency_default: =premium_billing_frequency_default
      Ridgecrest RxSecure Premier (PDP):
        monthly_plan_premium: =monthly_plan_premium
        basic_premium_portion: =basic_premium_portion
        supplemental_premium_portion: =supplemental_premium_portion
        premium_due_day_of_month: =premium_due_day_of_month
        premium_billing_frequency_default: =premium_billing_frequency_default
  formula:
    amount: basic_premium_portion + supplemental_premium_portion
- id: pdp_premium_posting
  subject:
  - pdp_premium_payment
  - pdp_premium_credit_adjustment
  - pdp_penalty_removal
  rule: 'Money the member pays is posted against the oldest unpaid coverage month first, and within a coverage month against the premium components before the penalty. The enrollment is in a status of active, premium_grace_period or terminated_for_nonpayment on the day the money is posted. No payment entry carrying the same remittance reference and the same amount is already posted on this enrollment. A credit adjustment and a penalty removal each name the single charge they relieve and the reason, and neither may exceed the amount of that charge. An overpayment is refunded by the channel the money arrived on and never held against a coverage month the plan has not yet billed. A member''s statement that they have paid is a reason to look for the money, never a reason to post it: nothing is credited until the payment is on the plan''s record.'
  eligibility:
  - id: account_open_for_posting
    applies_to:
    - pdp_premium_payment
    - pdp_premium_credit_adjustment
    - pdp_penalty_removal
    kind: state
    condition: The enrollment is in a status of active, premium_grace_period or terminated_for_nonpayment on the day the money is posted.
    evidence_fields:
    - pdp_enrollments.pdp_enrollment_id
    - pdp_enrollments.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - pdp_enrollments.pdp_enrollment_id
      action_bindings:
        pdp_enrollments.pdp_enrollment_id: pdp_enrollment_id
    state_contract:
      field: pdp_enrollments.status
      allowed:
      - active
      - premium_grace_period
      - terminated_for_nonpayment
  - id: payment_not_already_posted
    applies_to:
    - pdp_premium_payment
    kind: dedup
    condition: No payment entry carrying the same remittance reference and the same amount is already posted on this enrollment.
    evidence_fields:
    - pdp_premium_ledger.pdp_premium_entry_id
    - pdp_premium_ledger.remittance_reference
    - pdp_premium_ledger.amount
    - pdp_premium_ledger.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - pdp_premium_ledger.pdp_premium_entry_id
      action_bindings:
        pdp_premium_ledger.pdp_premium_entry_id: pdp_premium_entry_id
    dedup_contract:
      table: pdp_premium_ledger
      mode: separate_record
      object_bindings:
        remittance_reference: remittance_reference
        pdp_enrollment_id: pdp_enrollment_id
      duplicate_filters:
        event_type:
        - pdp_premium_payment
      distinct_fields:
      - posted_date
      - billing_period
      - charge_component
  params:
    posting_order_basis: oldest unpaid billing_period first, and inside a month the basic and supplemental premium components before the late enrollment penalty
- id: pdp_premium_delinquency
  subject:
  - pdp_grace_period_start
  - pdp_grace_period_cure
  - pdp_nonpayment_termination
  - pdp_reinstatement
  rule: A drug plan premium still unpaid after its due day puts the enrollment into the premium grace period, and the member is sent a notice naming the amount owed and the last day of that grace period. The grace period runs for the number of calendar days the tier held fixes, counted from the day the plan posted the first unpaid drug plan premium charge. The plan has not received the full outstanding premium by the last day of the grace period counted from the day the plan posted the first unpaid drug plan premium charge. Calendar days are counted from the day after that posting date, every day of the week counts including weekends and public holidays, the last day of the grace period is itself still inside the grace period, and full 24-hour periods are never used in place of calendar days. Where the full outstanding amount reaches the plan before that day ends the enrollment returns to active with no break, and the member keeps their accumulated out-of-pocket total and their payment stage. A partial payment does not cure the delinquency and never restarts the clock, however small the remainder. While the enrollment is in the grace period the member's prescriptions are still covered and priced normally; the plan never turns a member away at the pharmacy for premium arrears. Termination for non-payment ends drug coverage on the last day of the month in which the grace period expired, and the member is told that a gap in drug coverage may add to a future late enrollment penalty. A member terminated for non-payment may ask to be reinstated where the failure to pay was caused by circumstances beyond their control, and the request must reach the plan inside the tier's reinstatement window counted from the coverage end date. Reinstatement is granted only on a good-cause determination recorded by the plan's reviewer and restores the original coverage effective date with no gap, so the member keeps the out-of-pocket total and payment stage they had reached; the member's own account of why they could not pay opens the review but never decides it. Money arriving from a terminated member is held rather than posted while that review runs, and is returned in full where reinstatement is refused.
  eligibility:
  - id: grace_period_exhausted
    applies_to:
    - pdp_nonpayment_termination
    kind: time
    condition: The plan has not received the full outstanding premium by the last day of the grace period counted from the day the plan posted the first unpaid drug plan premium charge.
    evidence_fields:
    - pdp_premium_ledger.pdp_premium_entry_id
    - pdp_premium_ledger.posted_date
    - pdp_enrollments.pdp_enrollment_id
    - pdp_enrollments.premium_balance_due
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - pdp_enrollments.pdp_enrollment_id
        - pdp_premium_ledger.pdp_premium_entry_id
      action_bindings:
        pdp_enrollments.pdp_enrollment_id: pdp_enrollment_id
        pdp_premium_ledger.pdp_premium_entry_id: pdp_premium_entry_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the day the plan posted the first unpaid drug plan premium charge
      anchor_source: pdp_premium_ledger.posted_date
      relation: not_before
      duration_source: variants.premium_grace_period_days
      unit: calendar_days
      counting_rule: Calendar days are counted from the day after that posting date, every day of the week counts including weekends and public holidays, the last day of the grace period is itself still inside the grace period, and full 24-hour periods are never used in place of calendar days.
      boundary: inclusive
  params:
    per_tier:
      Ridgecrest RxSecure Basic (PDP):
        premium_grace_period_days: =premium_grace_period_days
        premium_due_day_of_month: =premium_due_day_of_month
        late_payment_reinstatement_window_days: =late_payment_reinstatement_window_days
      Ridgecrest RxSecure Value (PDP):
        premium_grace_period_days: =premium_grace_period_days
        premium_due_day_of_month: =premium_due_day_of_month
        late_payment_reinstatement_window_days: =late_payment_reinstatement_window_days
      Ridgecrest RxSecure Select (PDP):
        premium_grace_period_days: =premium_grace_period_days
        premium_due_day_of_month: =premium_due_day_of_month
        late_payment_reinstatement_window_days: =late_payment_reinstatement_window_days
      Ridgecrest RxSecure Plus (PDP):
        premium_grace_period_days: =premium_grace_period_days
        premium_due_day_of_month: =premium_due_day_of_month
        late_payment_reinstatement_window_days: =late_payment_reinstatement_window_days
      Ridgecrest RxSecure Complete (PDP):
        premium_grace_period_days: =premium_grace_period_days
        premium_due_day_of_month: =premium_due_day_of_month
        late_payment_reinstatement_window_days: =late_payment_reinstatement_window_days
      Ridgecrest RxSecure Premier (PDP):
        premium_grace_period_days: =premium_grace_period_days
        premium_due_day_of_month: =premium_due_day_of_month
        late_payment_reinstatement_window_days: =late_payment_reinstatement_window_days
- id: pdp_late_enrollment_penalty
  subject:
  - pdp_penalty_assessment
  - pdp_penalty_removal
  rule: 'A member who went without Part D or other creditable drug coverage after their initial enrollment period pays a late enrollment penalty for as long as they hold Part D coverage. The monthly penalty is the late enrollment penalty rate applied to the national base beneficiary premium for the contract year, multiplied by the number of months CMS has counted without creditable coverage, and rounded on the tier''s rounding basis. The count of months is CMS''s, not the plan''s: the plan bills what CMS supplies and never adds or removes a month on its own view of the member''s history. The evidence of earlier creditable drug coverage held on the enrollment intake is a certificate of creditable coverage on file or coverage verified with the prior carrier. Where that evidence is on file the plan sends a reconsideration to CMS, and the penalty is removed and every month of it credited back once CMS confirms the earlier coverage was creditable; the member''s own statement that they had drug coverage starts that enquiry but never removes the penalty by itself. A member who becomes eligible for the low-income subsidy stops owing the penalty from the month the subsidy begins, and any penalty already charged for those months is removed. A member who reaches 65 and had the penalty applied while under 65 on a disability entitlement has the count reset to zero from the month they turn 65.'
  eligibility:
  - id: creditable_coverage_evidence_on_file
    applies_to:
    - pdp_penalty_removal
    kind: state
    condition: The evidence of earlier creditable drug coverage held on the enrollment intake is a certificate of creditable coverage on file or coverage verified with the prior carrier.
    evidence_fields:
    - pdp_enrollment_requests.pdp_enrollment_request_id
    - pdp_enrollment_requests.prior_coverage_evidence
    - pdp_enrollment_requests.request_action
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - pdp_enrollment_requests.pdp_enrollment_request_id
      action_bindings:
        pdp_enrollment_requests.pdp_enrollment_request_id: pdp_enrollment_request_id
    state_contract:
      field: pdp_enrollment_requests.prior_coverage_evidence
      allowed:
      - certificate_of_creditable_coverage_on_file
      - verified_with_prior_carrier
  params:
    per_tier:
      Ridgecrest RxSecure Basic (PDP):
        late_enrollment_penalty_rate_percent: =late_enrollment_penalty_rate_percent
        national_base_beneficiary_premium: =national_base_beneficiary_premium
        penalty_rounding_basis: =penalty_rounding_basis
        lis_premium_subsidy_benchmark: =lis_premium_subsidy_benchmark
      Ridgecrest RxSecure Value (PDP):
        late_enrollment_penalty_rate_percent: =late_enrollment_penalty_rate_percent
        national_base_beneficiary_premium: =national_base_beneficiary_premium
        penalty_rounding_basis: =penalty_rounding_basis
        lis_premium_subsidy_benchmark: =lis_premium_subsidy_benchmark
      Ridgecrest RxSecure Select (PDP):
        late_enrollment_penalty_rate_percent: =late_enrollment_penalty_rate_percent
        national_base_beneficiary_premium: =national_base_beneficiary_premium
        penalty_rounding_basis: =penalty_rounding_basis
        lis_premium_subsidy_benchmark: =lis_premium_subsidy_benchmark
      Ridgecrest RxSecure Plus (PDP):
        late_enrollment_penalty_rate_percent: =late_enrollment_penalty_rate_percent
        national_base_beneficiary_premium: =national_base_beneficiary_premium
        penalty_rounding_basis: =penalty_rounding_basis
        lis_premium_subsidy_benchmark: =lis_premium_subsidy_benchmark
      Ridgecrest RxSecure Complete (PDP):
        late_enrollment_penalty_rate_percent: =late_enrollment_penalty_rate_percent
        national_base_beneficiary_premium: =national_base_beneficiary_premium
        penalty_rounding_basis: =penalty_rounding_basis
        lis_premium_subsidy_benchmark: =lis_premium_subsidy_benchmark
      Ridgecrest RxSecure Premier (PDP):
        late_enrollment_penalty_rate_percent: =late_enrollment_penalty_rate_percent
        national_base_beneficiary_premium: =national_base_beneficiary_premium
        penalty_rounding_basis: =penalty_rounding_basis
        lis_premium_subsidy_benchmark: =lis_premium_subsidy_benchmark
  formula:
    monthly_penalty_amount: round(national_base_beneficiary_premium * late_enrollment_penalty_rate_percent / 100 * pdp_msr_creditable_coverage_gap_months, 2)
  measures:
  - pdp_msr_creditable_coverage_gap_months
- id: pdp_coverage_stage_progression
  subject:
  - pdp_coverage_stage_update
  rule: 'A member moves through the payment stages in one direction over the contract year, and the stage they are in decides what they pay at the counter. At the deductible stage the member pays the negotiated price of every fill whose formulary tier the deductible applies to, until what they have paid reaches the tier''s annual deductible. At the initial coverage stage the member pays the cost share their tier and pharmacy give, and every dollar they pay counts toward the annual out-of-pocket threshold. Catastrophic coverage begins on the fill that takes the member''s true out-of-pocket total to the annual out-of-pocket threshold, and from that fill on the member pays nothing for covered drugs for the rest of the contract year. Only what the member or a qualifying third party actually paid counts toward the threshold: plan payments, premiums and the late enrollment penalty never count, and a member who asks why their total has not moved is shown which of their payments counted and which did not. A fill that straddles a stage boundary is split at the boundary, so the member pays the earlier stage''s cost share only up to the distance remaining and the later stage''s terms on the rest. Reversing a fill takes its member payment back out of the accumulator and can return the member to an earlier stage; the stages are restated from the accumulator rather than kept as a separate fact. The stages reset to the deductible stage on 1 January, whatever the member reached the year before.'
  eligibility: []
  params:
    per_tier:
      Ridgecrest RxSecure Basic (PDP):
        annual_deductible: =annual_deductible
        deductible_applies_to_tiers: =deductible_applies_to_tiers
        annual_out_of_pocket_threshold: =annual_out_of_pocket_threshold
        catastrophic_member_coinsurance: =catastrophic_member_coinsurance
        medicare_prescription_payment_plan_offered: =medicare_prescription_payment_plan_offered
      Ridgecrest RxSecure Value (PDP):
        annual_deductible: =annual_deductible
        deductible_applies_to_tiers: =deductible_applies_to_tiers
        annual_out_of_pocket_threshold: =annual_out_of_pocket_threshold
        catastrophic_member_coinsurance: =catastrophic_member_coinsurance
        medicare_prescription_payment_plan_offered: =medicare_prescription_payment_plan_offered
      Ridgecrest RxSecure Select (PDP):
        annual_deductible: =annual_deductible
        deductible_applies_to_tiers: =deductible_applies_to_tiers
        annual_out_of_pocket_threshold: =annual_out_of_pocket_threshold
        catastrophic_member_coinsurance: =catastrophic_member_coinsurance
        medicare_prescription_payment_plan_offered: =medicare_prescription_payment_plan_offered
      Ridgecrest RxSecure Plus (PDP):
        annual_deductible: =annual_deductible
        deductible_applies_to_tiers: =deductible_applies_to_tiers
        annual_out_of_pocket_threshold: =annual_out_of_pocket_threshold
        catastrophic_member_coinsurance: =catastrophic_member_coinsurance
