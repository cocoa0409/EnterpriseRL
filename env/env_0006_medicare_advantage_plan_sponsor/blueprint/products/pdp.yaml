# Product and event policy charter — Stand-Alone Medicare Part D Prescription Drug Plans.
# The single registry of every quantified policy in this category; every number appears here once.
category: pdp
display_name: Stand-Alone Medicare Part D Prescription Drug Plans
binding:
  holding_table: pdp_enrollments
  event_tables:
  - pdp_premium_ledger
  - pdp_pharmacy_claims
  - pdp_coverage_determinations
  intake_tables:
  - pdp_enrollment_requests
  status_field: status
  variant_field: variant_name
  quantity_fields:
    premium_balance_due: premium_receivable
    penalty_balance_due: penalty_receivable
    troop_accumulated: true_out_of_pocket
lifecycle:
  states:
  - enrollment_submitted
  - cms_transaction_pending
  - active
  - premium_grace_period
  - terminated_for_nonpayment
  - disenrolled
  - cancelled_before_effective
  transitions:
  - from: enrollment_submitted
    to: cms_transaction_pending
    by: system
    means: The accepted election is placed on the daily enrollment file sent to CMS.
  - from: enrollment_submitted
    to: cancelled_before_effective
    by: user
    means: The member withdraws the application before it has been transmitted.
  - from: cms_transaction_pending
    to: active
    by: system
    means: CMS accepts the transaction and the coverage effective date arrives.
  - from: cms_transaction_pending
    to: cancelled_before_effective
    by: user
    means: The member withdraws the application before drug coverage begins.
  - from: active
    to: premium_grace_period
    by: system
    means: A monthly drug plan premium is unpaid after its due day.
  - from: premium_grace_period
    to: active
    by: agent
    means: The full outstanding premium is received inside the grace period.
  - from: premium_grace_period
    to: terminated_for_nonpayment
    by: system
    means: The grace period expires with premium still outstanding.
  - from: active
    to: disenrolled
    by: user
    means: The member leaves the drug plan during an election period open to them.
  - from: premium_grace_period
    to: disenrolled
    by: user
    means: The member leaves the drug plan while their premium is in arrears.
  - from: terminated_for_nonpayment
    to: active
    by: agent
    means: A recorded good-cause determination reinstates the terminated drug coverage.
accounts:
- key: premium_receivable
  unit: USD
  meaning: 'Drug plan premium the member owes but has not yet paid: charges increase it, payments and credits reduce it, and its running total is the premium balance due on the enrollment.'
- key: penalty_receivable
  unit: USD
  meaning: 'Late enrollment penalty the member owes but has not yet paid: monthly assessments increase it and removals reduce it, kept apart from premium so that either can be relieved on its own.'
- key: true_out_of_pocket
  unit: USD
  meaning: 'What the member has actually paid for covered drugs this contract year: priced fills add to it and reversals take back out of it, and its running total decides the payment stage.'
parameter_schema:
  monthly_plan_premium: Total plan premium billed to the member each coverage month, in USD.
  basic_premium_portion: Part of the monthly premium attributable to basic Part D benefits, in USD.
  supplemental_premium_portion: Part of the monthly premium attributable to enhanced benefits above the defined standard, in USD.
  premium_due_day_of_month: Calendar day of the coverage month on which the premium falls due (integer 1-28).
  premium_billing_frequency_default: 'Default billing cadence assigned at enrollment: monthly or quarterly (string).'
  premium_grace_period_days: Calendar days after the first unpaid premium charge before involuntary termination may be processed (integer days).
  late_payment_reinstatement_window_days: Calendar days after the coverage end date within which a good-cause reinstatement may still be requested (integer days).
  annual_deductible: Part D deductible for the contract year, in USD.
  deductible_applies_to_tiers: Formulary tiers the deductible is taken on (list of formulary_tier values).
  medicare_prescription_payment_plan_offered: Whether the member may elect to spread their out-of-pocket drug costs across the remaining months of the year instead of paying at the counter (true or false).
  m3p_maximum_monthly_cap_basis: How the largest monthly instalment under that payment plan is worked out (string).
  annual_out_of_pocket_threshold: True out-of-pocket spend at which catastrophic coverage begins, in USD.
  catastrophic_member_coinsurance: Member coinsurance once catastrophic coverage begins, as a percentage of the negotiated price.
  tier_1_preferred_generic_copay_30: Member copay for a 30-day tier 1 fill at a preferred retail pharmacy, in USD.
  tier_2_generic_copay_30: Member copay for a 30-day tier 2 fill at a preferred retail pharmacy, in USD.
  tier_3_preferred_brand_copay_30: Member copay for a 30-day tier 3 fill at a preferred retail pharmacy, in USD.
  tier_4_non_preferred_coinsurance: Member coinsurance on a 30-day tier 4 fill, as a percentage of the negotiated price.
  tier_5_specialty_coinsurance: Member coinsurance on a 30-day tier 5 specialty fill, as a percentage of the negotiated price.
  tier_6_select_care_copay_30: Member copay for a 30-day tier 6 select care fill, in USD.
  standard_retail_tier_1_copay_30: Member copay for a 30-day tier 1 fill at a standard, non-preferred retail pharmacy, in USD.
  standard_retail_tier_3_copay_30: Member copay for a 30-day tier 3 fill at a standard, non-preferred retail pharmacy, in USD.
  mail_order_90_day_multiplier: Multiplier applied to the 30-day preferred retail cost share for a 90-day mail-order fill (decimal).
  retail_90_day_multiplier: Multiplier applied to the 30-day preferred retail cost share for a 90-day retail fill (decimal).
  long_term_care_days_supply_limit: Largest days supply a long-term care pharmacy may dispense at once (integer days).
  insulin_copay_cap_month: Maximum member cost for a one-month supply of any covered insulin product, in USD.
  vaccine_member_cost: Member cost for an adult vaccine recommended by the immunisation schedule, in USD.
  formulary_tier_count: Number of cost-share tiers on this plan's formulary (integer).
  formulary_id: The CMS formulary identifier this plan uses (string).
  prior_authorization_required_tiers: Formulary tiers on which prior authorisation is enforced (list of formulary_tier values).
  step_therapy_required_tiers: Formulary tiers on which step therapy is enforced (list of formulary_tier values).
  quantity_limit_enforced: Whether quantity limits are enforced at the point of sale (true or false).
  transition_fill_days_supply: Days supply of a one-time transition fill for a new member already taking a drug not on the formulary (integer days).
  transition_fill_count: How many transition fills a new member may have in their first ninety days (integer).
  refill_too_soon_threshold_percent: Percentage of the previous days supply that must be used before a refill is allowed (integer percentage).
  opioid_safety_edit_mme_threshold: Daily morphine milligram equivalent at which the point-of-sale opioid safety edit fires (integer).
  out_of_network_pharmacy_coverage: Whether fills at an out-of-network pharmacy are covered, and on what footing (string).
  coverage_determination_standard_hours: Hours within which a standard coverage determination must be decided (integer hours).
  coverage_determination_expedited_hours: Hours within which an expedited coverage determination must be decided (integer hours).
  exception_request_standard_hours: Hours within which a standard formulary or tiering exception must be decided once the prescriber's statement is in hand (integer hours).
  exception_request_expedited_hours: Hours within which an expedited exception must be decided once the prescriber's statement is in hand (integer hours).
  redetermination_standard_days: Calendar days within which a standard plan-level redetermination must be decided (integer days).
  redetermination_expedited_hours: Hours within which an expedited plan-level redetermination must be decided (integer hours).
  appeal_filing_window_days: Calendar days after the adverse determination notice within which a redetermination may be filed (integer days).
  good_cause_extension_days: Additional calendar days a late redetermination may be accepted for when good cause is shown (integer days).
  late_enrollment_penalty_rate_percent: Percentage of the national base beneficiary premium added for each month without creditable coverage (decimal percentage).
  national_base_beneficiary_premium: The national base beneficiary premium CMS published for the contract year, in USD.
  penalty_rounding_basis: How the calculated penalty is rounded before it is billed (string).
  lis_premium_subsidy_benchmark: Regional low-income premium subsidy benchmark for the contract year, in USD.
  lis_deductible: Deductible a member with the full low-income subsidy pays, in USD.
  lis_generic_copay: Copay a member with the full low-income subsidy pays for a generic fill, in USD.
  lis_brand_copay: Copay a member with the full low-income subsidy pays for a brand fill, in USD.
  pharmacy_network_size: Number of pharmacies in the plan's network (integer).
  preferred_pharmacy_count: Number of network pharmacies that carry preferred cost sharing (integer).
  mail_order_available: Whether the plan offers a mail-order pharmacy benefit (true or false).
  medication_therapy_management_drug_count: Number of maintenance drugs a member must be taking to be offered medication therapy management (integer).
  medication_therapy_management_cost_threshold: Annual drug cost at which a member is offered medication therapy management, in USD.
  star_rating: Most recent CMS overall star rating published for this plan (decimal, 1.0 to 5.0).
  service_area_states: States in which this plan may be sold and held (list of state names).
  enrollment_capacity_limit: Maximum number of members CMS has approved for this plan benefit package (integer).
  effective_date_rule: Rule that turns an accepted election into a coverage start date (string).
  disenrollment_effective_rule: Rule that turns an accepted disenrollment into a coverage end date (string).
  maximum_retroactive_months: Months of retroactive coverage the plan may accept on a CMS-directed correction (integer months).
  annual_notice_of_change_mail_by: Latest date each year, as MM-DD, by which the annual notice of change must be mailed (string).
