- id: pdp_exclusivity_with_medicare_advantage
  subject:
  - pdp_enrollment_created
  - pdp_voluntary_disenrollment
  rule: 'A member enrolled in a Medicare Advantage plan that includes prescription drug coverage may not also hold a stand-alone Part D plan, and Medicare will disenroll them from the Medicare Advantage plan if they try. No Medicare Advantage enrollment that includes Part D coverage is in force for the same member on the day the stand-alone drug coverage would begin. Where the member holds such a Medicare Advantage plan the stand-alone election is not simply refused: the plan explains that accepting it would end their medical plan as well, and records the election only once the member says they understand. A member holding a Medicare Advantage plan that carries no drug coverage may hold a stand-alone drug plan alongside it, and the two are billed and appealed separately. Holding a Medicare Supplement policy changes nothing here, because a supplement policy has carried no drug coverage for many years and never conflicts with a stand-alone drug plan. Where a member is moved out of this plan because they joined a Medicare Advantage plan with drug coverage, the disenrollment reason recorded is enrolled_in_ma_pd and coverage ends the day before the new plan begins.'
  eligibility:
  - id: no_conflicting_medical_drug_plan
    applies_to:
    - pdp_enrollment_created
    kind: state
    condition: No Medicare Advantage enrollment that includes Part D coverage is in force for the same member on the day the stand-alone drug coverage would begin.
    evidence_fields:
    - advantage_enrollments.advantage_enrollment_id
    - advantage_enrollments.customer_id
    - advantage_enrollments.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - advantage_enrollments.customer_id
      action_bindings:
        advantage_enrollments.customer_id: customer_id
    state_contract:
      field: advantage_enrollments.status
      allowed:
      - disenrolled
      - terminated_for_nonpayment
      - cancelled_before_effective
  params:
    per_tier:
      Ridgecrest RxSecure Basic (PDP):
        disenrollment_effective_rule: =disenrollment_effective_rule
      Ridgecrest RxSecure Value (PDP):
        disenrollment_effective_rule: =disenrollment_effective_rule
      Ridgecrest RxSecure Select (PDP):
        disenrollment_effective_rule: =disenrollment_effective_rule
      Ridgecrest RxSecure Plus (PDP):
        disenrollment_effective_rule: =disenrollment_effective_rule
      Ridgecrest RxSecure Complete (PDP):
        disenrollment_effective_rule: =disenrollment_effective_rule
      Ridgecrest RxSecure Premier (PDP):
        disenrollment_effective_rule: =disenrollment_effective_rule
- id: pdp_disenrollment_and_withdrawal
  subject:
  - pdp_voluntary_disenrollment
  - pdp_application_withdrawal
  rule: 'Only the member, or a representative they have appointed in writing, may end a stand-alone drug plan enrollment or withdraw an application; a pharmacy, a prescriber or a relative may never end it for them. A request to end the drug plan is recorded on the enrollment intake with the request action voluntary_disenrollment and an intake status of recorded, awaiting_member_signature or submitted_to_cms before the enrollment is ended. A voluntary disenrollment takes effect on the last day of the month in which the plan received the request, and the member keeps drug coverage until that day. An application withdrawn before the coverage effective date leaves no coverage period at all: the enrollment is cancelled before effective, the disenrollment reason recorded is withdrawn_before_effective, and any premium already paid is refunded in full. The plan tells a member ending their drug coverage outside an election period that they may not be able to join another plan until the next annual election period, and that months without creditable coverage will count toward a future late enrollment penalty. Ending the drug plan does not by itself end any medical plan the member holds, and a member who meant to end both is asked plainly which they want ended.'
  eligibility:
  - id: member_request_recorded
    applies_to:
    - pdp_voluntary_disenrollment
    - pdp_application_withdrawal
    kind: state
    condition: A request to end the drug plan is recorded on the enrollment intake with the request action voluntary_disenrollment and an intake status of recorded, awaiting_member_signature or submitted_to_cms before the enrollment is ended.
    evidence_fields:
    - pdp_enrollment_requests.pdp_enrollment_request_id
