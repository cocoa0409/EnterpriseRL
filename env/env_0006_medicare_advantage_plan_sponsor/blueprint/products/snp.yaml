# Product and event policy charter — Special Needs Plans.
# The single registry of every quantified policy in this category; every number appears here once.
category: snp
display_name: Special Needs Plans
binding:
  holding_table: snp_enrollments
  event_tables:
  - snp_premium_ledger
  - snp_care_records
  intake_tables:
  - snp_enrollment_requests
  status_field: status
  variant_field: variant_name
  quantity_fields:
    premium_balance_due: premium_receivable
    state_cost_share_balance: state_cost_share_receivable
lifecycle:
  states:
  - enrollment_submitted
  - eligibility_verification
  - active
  - deemed_continued_eligibility
  - terminated_for_ineligibility
  - disenrolled
  transitions:
  - from: enrollment_submitted
    to: eligibility_verification
    by: system
    means: The election goes to the authoritative source for the qualifying special need.
  - from: enrollment_submitted
    to: disenrolled
    by: user
    means: The member withdraws the election before coverage begins.
  - from: eligibility_verification
    to: active
    by: system
    means: The qualifying need is confirmed and the coverage effective date arrives.
  - from: active
    to: deemed_continued_eligibility
    by: system
    means: The member loses the status the plan rests on and a deemed period begins.
  - from: deemed_continued_eligibility
    to: active
    by: agent
    means: The qualifying status is confirmed again inside the deemed period.
  - from: deemed_continued_eligibility
    to: terminated_for_ineligibility
    by: system
    means: The deemed period ends with the qualifying need still unconfirmed.
  - from: active
    to: disenrolled
    by: user
    means: The member leaves the plan during an election period open to them.
  - from: deemed_continued_eligibility
    to: disenrolled
    by: user
    means: The member leaves the plan while their qualifying status is being sorted out.
accounts:
- key: premium_receivable
  unit: USD
  meaning: 'Plan premium and member cost share owed but not yet paid: charges increase it and payments and credits reduce it, and its running total is the premium balance due on the enrollment.'
- key: state_cost_share_receivable
  unit: USD
  meaning: 'Cost share billed to the state Medicaid agency on behalf of a protected member: billings increase it and state remittances and write-offs reduce it.'
parameter_schema:
  special_needs_type: 'Which kind of Special Needs Plan this is: dual eligible, chronic condition or institutional (string).'
  qualifying_condition: The special need a member must have to hold this plan (string).
  qualifying_evidence_source: The authoritative source the qualifying need is confirmed from (string).
  medicaid_category_required: The Medicaid categories that qualify a member for this plan (list of category names).
  monthly_plan_premium: Plan premium billed to the member each coverage month, in USD.
  premium_due_day_of_month: Calendar day of the coverage month on which the premium falls due (integer 1-28).
  premium_grace_period_days: Calendar days after the first unpaid premium before termination may be processed (integer days).
  part_b_premium_buy_down: Part B premium the state or the plan pays on the member's behalf each month, in USD.
  annual_medical_deductible: In-network medical deductible for the plan year, in USD.
  in_network_moop: Annual in-network maximum out-of-pocket, in USD.
  primary_care_copay: Member copay for an in-network primary care visit, in USD.
  specialist_copay: Member copay for an in-network specialist visit, in USD.
  emergency_room_copay: Member copay for an emergency department visit, in USD.
  inpatient_day_1_to_5_copay: Per-day member copay for days 1 to 5 of an in-network inpatient stay, in USD.
  skilled_nursing_day_1_to_20_copay: Per-day member copay for days 1 to 20 of a skilled nursing facility stay, in USD.
  dual_cost_share_protection: Whether members in a qualifying Medicaid category owe no plan cost share (true or false).
  state_cost_share_billing_permitted: Whether the plan may bill the state for cost share the member is protected from (true or false).
  state_remittance_cycle_days: Calendar days between the plan's cost-share billings to the state (integer days).
  state_payment_due_days: Calendar days the state has to pay a billed cost share (integer days).
  deemed_eligibility_period_months: Months a member keeps the plan after losing their qualifying Medicaid status (integer months).
  eligibility_reverification_frequency_months: Months between confirmations of the qualifying special need (integer months).
  chronic_condition_attestation_valid_days: Calendar days a prescriber's attestation of the chronic condition holds good while the plan confirms it (integer days).
  institutional_stay_qualifying_days: Days of institutional residence a member must have to qualify for an institutional plan (integer days).
  health_risk_assessment_initial_days: Calendar days from the coverage effective date within which the first health risk assessment must be completed (integer days).
  health_risk_assessment_annual_days: Calendar days from the previous assessment within which the annual one must be completed (integer days).
  care_plan_review_frequency_days_high_risk: Calendar days between care plan reviews for a high-risk member (integer days).
  care_plan_review_frequency_days_low_risk: Calendar days between care plan reviews for a low-risk member (integer days).
  contact_attempts_before_unreachable: How many attempts the care team makes before recording a member as unreachable (integer).
  interdisciplinary_team_meeting_frequency_days: Calendar days between interdisciplinary care team meetings (integer days).
  care_manager_caseload: Members one care manager may carry (integer).
  transition_of_care_review_days: Calendar days after an inpatient discharge within which a transition review must happen (integer days).
  transportation_trips_per_year: Plan-covered one-way non-emergency transportation trips per plan year (integer).
  otc_allowance_quarterly: Over-the-counter and healthy-food allowance loaded each calendar quarter, in USD.
  dental_allowance_annual: Embedded comprehensive dental allowance for the plan year, in USD.
  vision_allowance_annual: Embedded eyewear allowance for the plan year, in USD.
  hearing_aid_allowance_per_ear: Embedded hearing aid allowance per ear per plan year, in USD.
  meals_after_discharge_count: Home-delivered meals covered after an inpatient discharge (integer meals).
  in_home_support_hours_per_year: Hours of in-home personal support the plan covers each plan year (integer hours).
  long_term_services_copay: Member copay toward covered long-term services and supports, in USD.
  part_d_included: Whether the plan includes Part D prescription drug coverage (true or false).
  part_d_annual_deductible: Part D deductible for the plan year, in USD.
  part_d_generic_copay: Member copay for a 30-day generic fill, in USD.
  part_d_brand_copay: Member copay for a 30-day brand fill, in USD.
  prior_auth_standard_decision_days: Calendar days within which a standard organisation determination must be decided (integer days).
  prior_auth_expedited_decision_hours: Hours within which an expedited organisation determination must be decided (integer hours).
  appeal_filing_window_days: Calendar days after an adverse determination within which a reconsideration may be filed (integer days).
  integrated_appeal_process: Whether Medicare and Medicaid appeals are handled as one integrated process (true or false).
  service_area_counties: Counties in which the plan may be sold and held (list of county names).
  enrollment_capacity_limit: Maximum number of members CMS has approved for this plan benefit package (integer).
  effective_date_rule: Rule that turns an accepted election into a coverage start date (string).
  disenrollment_effective_rule: Rule that turns an accepted disenrollment into a coverage end date (string).
  special_enrollment_period_code: The special election period a member of this plan may ordinarily use (string).
  star_rating: Most recent CMS overall star rating published for this plan (decimal, 1.0 to 5.0).
  model_of_care_approval_years: Years the plan's CMS-approved model of care runs before it must be renewed (integer years).
