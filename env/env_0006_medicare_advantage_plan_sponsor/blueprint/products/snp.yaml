  - snp_state_payment_received
  rule: 'Cost share a protected member does not owe is billed to the state Medicaid agency on the tier''s remittance cycle, and never to the member. The cost share being billed arose on an enrollment whose tier permits billing the state, and the member''s Medicaid category on the day of service was one the tier protects. The state has the tier''s payment days to answer each billing, and each remittance is posted against the single billing it answers so that the plan can always say which months are settled. Where the state declines a billing the amount is written off by the plan and never passed back to the member, however the state explains its decision. A retroactive grant of Medicaid is applied back to the month it took effect: cost share the member already paid for those months is refunded to them and rebilled to the state. Nothing in this arrangement is the member''s concern, and a member who asks about a bill they were never meant to receive is told simply that they owe nothing.'
