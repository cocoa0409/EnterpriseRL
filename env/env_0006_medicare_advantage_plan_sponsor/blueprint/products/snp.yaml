- id: snp_coverage_decisions_and_appeals
  subject:
  - snp_care_plan_review
  - snp_premium_credit
  rule: 'Coverage decisions on a Special Needs Plan follow the same deadlines as any Medicare Advantage plan: the tier''s standard days for an ordinary determination and its expedited hours where waiting could seriously harm the member. On the tiers with an integrated appeal process a member appeals once and both the Medicare and the Medicaid parts of the decision are looked at together, so the member is never sent back and forth between two programmes. An appeal must reach the plan inside the tier''s filing window counted from the adverse notice, and a late appeal is accepted where good cause is shown. Where a service is covered by Medicaid rather than by the plan, the plan says which programme covers it and helps the member reach it rather than simply denying the request. A member''s care manager may file an appeal on their behalf where the member has appointed them in writing, and the appointment is recorded before the appeal is taken. A credit granted because an appeal succeeded names the charge it relieves, so that the member''s statement shows plainly what was put right.'
