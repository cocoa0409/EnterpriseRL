- id: snp_exclusivity_and_service_area
  subject:
  - snp_enrollment_created
  - snp_coverage_effectuation
  rule: 'A Special Needs Plan is a Medicare Advantage plan with drug coverage, so it may not be held alongside an ordinary Medicare Advantage plan or a stand-alone drug plan. No Medicare Advantage enrollment or stand-alone Part D enrollment is in force for the same member on the day the Special Needs Plan coverage would begin. Where the member holds one of those, accepting this election ends it on the day before the new coverage begins, and the member is told which cover is ending. The member''s permanent residence must lie in one of the counties in the tier''s service area, taken from the address on their profile rather than from where they say they are staying. A member who moves out of the service area is given a special election period and told the date their cover will end, rather than being left to discover it. Holding a Medicare Supplement policy alongside a Special Needs Plan is never right: the supplement pays nothing while a Medicare Advantage plan is in force, and the member is told so before they keep paying two premiums.'
  eligibility:
  - id: no_conflicting_advantage_plan
    applies_to:
    - snp_enrollment_created
    kind: state
    condition: No Medicare Advantage enrollment or stand-alone Part D enrollment is in force for the same member on the day the Special Needs Plan coverage would begin.
    evidence_fields:
    - advantage_enrollments.advantage_enrollment_id
    - advantage_enrollments.customer_id
    - advantage_enrollments.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - advantage_enrollments.customer_id
      action_bindings:
        advantage_enrollments.customer_id: customer_id
    state_contract:
      field: advantage_enrollments.status
      allowed:
      - disenrolled
      - terminated_for_nonpayment
      - cancelled_before_effective
