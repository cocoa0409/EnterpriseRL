- id: snp_care_management
  subject:
  - snp_care_assessment_recorded
  - snp_care_plan_review
  - snp_care_plan_update
  rule: 'Every member of a Special Needs Plan has an individualised care plan built from a health risk assessment, and the plan''s approved model of care sets how that is done. The first health risk assessment is completed no later than the assessment deadline counted from the coverage effective date of the enrollment. Calendar days are counted from the day after the coverage effective date, every day of the week counts, an assessment completed on the final day is in time, and full 24-hour periods are never used in place of calendar days. The assessment is repeated each year within the tier''s annual assessment days, and a member who moves to a different risk band is reviewed on the frequency their new band calls for rather than the old one. The care team makes the tier''s number of attempts to reach a member before recording them as unreachable, and each attempt is recorded on its own so that the history shows what was tried. A member may decline care management without losing any benefit of the plan, and a declined assessment is recorded as declined rather than left looking overdue. A member discharged from hospital is reviewed within the tier''s transition days, because that is when things most often go wrong. Care management is a benefit and never a condition: no claim is ever refused because an assessment is outstanding.'
  eligibility:
  - id: initial_assessment_in_time
    applies_to:
    - snp_care_assessment_recorded
    kind: time
    condition: The first health risk assessment is completed no later than the assessment deadline counted from the coverage effective date of the enrollment.
    evidence_fields:
    - snp_enrollments.snp_enrollment_id
    - snp_enrollments.coverage_effective_date
