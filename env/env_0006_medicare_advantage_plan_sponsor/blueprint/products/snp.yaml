      action_bindings:
        snp_enrollments.snp_enrollment_id: snp_enrollment_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the coverage effective date of the enrollment
      anchor_source: snp_enrollments.coverage_effective_date
      relation: not_after
      duration_source: variants.health_risk_assessment_initial_days
      unit: calendar_days
