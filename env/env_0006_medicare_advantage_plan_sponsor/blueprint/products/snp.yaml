events:
- type: snp_enrollment_created
  target: snp_enrollments
  mutation: create
  meaning: A member's election of a Special Needs Plan is accepted and an enrollment record is opened while the qualifying special need is confirmed.
  grain: One row per Special Needs Plan enrollment a member holds for one contract year.
  fields:
    snp_enrollment_id: Reference number of this enrollment.
    customer_id: The member whose election this is.
    variant_name: The official plan name elected.
    status: Opens at enrollment_submitted, the lifecycle entry state.
    plan_year: Contract year the election belongs to.
    contract_plan_segment: CMS contract, plan benefit package and segment elected.
    application_received_date: Date the plan received the completed election form.
    coverage_effective_date: First day coverage will be in force once the need is confirmed.
    special_needs_basis: The special need the member is enrolling on.
    medicaid_eligibility_category: The Medicaid category the state last reported.
    care_plan_status: Opens at not_started.
    premium_balance_due: Opens at zero.
    state_cost_share_balance: Opens at zero.
    disenrollment_reason_code: Opens at not_applicable.
  triggers:
  - event: snp:snp_eligibility_verification_started
    map:
      snp_enrollment_id: snp_enrollment_id
      status: eligibility_verification
- type: snp_eligibility_verification_started
  target: snp_enrollments
  mutation:
    transition:
      from: enrollment_submitted
      to: eligibility_verification
  meaning: The plan puts the election to the authoritative source for the qualifying special need and waits for confirmation.
  grain: One row per enrollment awaiting confirmation of the qualifying need.
  fields:
    snp_enrollment_id: The enrollment being verified.
    status: Moves to eligibility_verification.
    special_needs_basis: The need being confirmed.
  triggers: []
- type: snp_coverage_effectuation
  target: snp_enrollments
  mutation:
    transition:
      from: eligibility_verification
      to: active
  meaning: The qualifying special need is confirmed and the coverage effective date arrives, so coverage comes into force and care management begins.
  grain: One row per Special Needs Plan enrollment brought into force.
  fields:
    snp_enrollment_id: The enrollment brought into force.
    customer_id: The member now covered.
    status: Moves to active.
    coverage_effective_date: Confirmed first day of coverage.
    eligibility_verified_date: Date the qualifying need was confirmed.
    care_plan_status: Moves to assessment_scheduled.
  triggers:
  - event: snp:snp_premium_charge
    map:
      snp_enrollment_id: snp_enrollment_id
      customer_id: customer_id
      cost_share_category: plan_premium
      payer: member
  - event: snp:snp_care_assessment_recorded
    map:
      snp_enrollment_id: snp_enrollment_id
      customer_id: customer_id
      assessment_type: initial_health_risk_assessment
- type: snp_deemed_period_start
  target: snp_enrollments
  mutation:
    transition:
      from: active
      to: deemed_continued_eligibility
  meaning: The state reports that the member has lost the Medicaid status their plan rests on, so a deemed continued eligibility period begins during which cover carries on unchanged.
  grain: One row per enrollment entering a deemed continued eligibility period.
  fields:
    snp_enrollment_id: The enrollment now deemed.
    status: Moves to deemed_continued_eligibility.
    medicaid_eligibility_category: Set to lost_medicaid.
    deemed_period_end_date: Last day of the deemed period.
  triggers: []
- type: snp_eligibility_restored
  target: snp_enrollments
  mutation:
    transition:
      from: deemed_continued_eligibility
      to: active
  meaning: The qualifying status is confirmed again inside the deemed period, so the enrollment returns to ordinary standing with no break in cover.
  grain: One row per enrollment whose qualifying need is confirmed again.
  fields:
    snp_enrollment_id: The enrollment restored.
    status: Returns to active.
    medicaid_eligibility_category: The category the state now reports.
    eligibility_verified_date: Date the need was confirmed again.
    deemed_period_end_date: Cleared, because the deemed period has ended early.
  triggers: []
- type: snp_ineligibility_termination
  target: snp_enrollments
  mutation:
    transition:
      from: deemed_continued_eligibility
      to: terminated_for_ineligibility
  meaning: The deemed period ends with the qualifying special need still unconfirmed, so the enrollment ends and the member is moved to ordinary Medicare coverage.
  grain: One row per enrollment ended for loss of the qualifying need.
  fields:
    snp_enrollment_id: The enrollment ended.
    customer_id: The member whose cover ends.
    status: Moves to terminated_for_ineligibility.
    coverage_end_date: Last day of cover.
    disenrollment_reason_code: Set to loss_of_special_needs_status.
  triggers: []
- type: snp_voluntary_disenrollment
  target: snp_enrollments
  mutation:
    transition:
    - from: active
      to: disenrolled
    - from: deemed_continued_eligibility
      to: disenrolled
    - from: enrollment_submitted
      to: disenrolled
  meaning: The member leaves the Special Needs Plan during an election period open to them, or withdraws the election before it takes effect.
  grain: One row per Special Needs Plan enrollment the member ends.
  fields:
    snp_enrollment_id: The enrollment being ended.
    customer_id: The member ending it.
    status: Moves to disenrolled.
    coverage_end_date: Last day of cover.
    disenrollment_reason_code: voluntary_election, other_plan_election or withdrawn_before_effective.
  triggers: []
- type: snp_care_plan_update
  target: snp_enrollments
  mutation: update
  meaning: The care management details the plan holds on the enrollment are brought up to date after an assessment, a review or a fresh eligibility confirmation.
  grain: One row per enrollment whose care management details are restated.
  fields:
    snp_enrollment_id: The enrollment restated.
    care_plan_status: How far the individualised care plan has got.
    eligibility_verified_date: Date the qualifying need was last confirmed.
    medicaid_eligibility_category: The Medicaid category the state now reports.
  triggers: []
- type: snp_premium_charge
  target: snp_premium_ledger
  meaning: A plan premium or a cost share for one coverage month is charged to the member's account.
  grain: One row per coverage month and charge category raised on one enrollment.
  distinguish_by:
  - billing_period
  - cost_share_category
  - posted_date
  - amount
  fields:
    snp_premium_entry_id: Reference number of this ledger entry.
    snp_enrollment_id: The enrollment charged.
    customer_id: The member charged.
    event_type: snp_premium_charge.
    billing_period: The coverage month this charge pays for.
    posted_date: Date the charge was posted.
    amount: The amount charged.
    payer: member.
    cost_share_category: What the amount is for.
    balance_effect: not_applicable on a charge.
  account: premium_receivable
  direction: in
  triggers: []
- type: snp_premium_payment
  target: snp_premium_ledger
  meaning: Money the member paid is posted against the oldest unpaid coverage month.
  grain: One row per payment posted on one enrollment.
  distinguish_by:
  - posted_date
  - amount
  - payment_channel
  - remittance_reference
  fields:
    snp_premium_entry_id: Reference number of this ledger entry.
    snp_enrollment_id: The enrollment credited.
    customer_id: The member who paid.
    event_type: snp_premium_payment.
    billing_period: The oldest coverage month the money is applied to.
    posted_date: Date the money was posted.
    amount: Amount received.
    payer: member.
    payment_channel: How the money reached the plan.
    balance_effect: Whether the posting left part of the balance outstanding, settled it exactly, or exceeded it.
    remittance_reference: The payment reference on the member's statement, recorded exactly as stated.
  account: premium_receivable
  direction: out
  triggers: []
- type: snp_premium_credit
  target: snp_premium_ledger
  meaning: A credit is posted against a named charge, because Medicaid was granted retroactively, the deemed period was restated, or the charge was raised in error.
  grain: One row per credit posted against one named charge.
  distinguish_by:
  - source_premium_entry_id
  - adjustment_reason_code
  - posted_date
  - amount
  fields:
    snp_premium_entry_id: Reference number of this ledger entry.
    snp_enrollment_id: The enrollment credited.
    customer_id: The member credited.
    event_type: snp_premium_credit.
    billing_period: The coverage month of the charge being relieved.
    posted_date: Date the credit was posted.
    amount: Amount of the credit.
    payer: plan_write_off.
    cost_share_category: The category of the charge being relieved.
    source_premium_entry_id: The single charge this credit relieves.
    adjustment_reason_code: Why the credit was granted.
  account: premium_receivable
  direction: out
  triggers: []
- type: snp_cost_share_billed_to_state
  target: snp_premium_ledger
  meaning: Cost share the member is protected from is billed to the state Medicaid agency instead of to the member.
  grain: One row per billing cycle and cost-share category billed to the state on one enrollment.
  distinguish_by:
  - billing_period
  - cost_share_category
  - posted_date
  - amount
  fields:
    snp_premium_entry_id: Reference number of this ledger entry.
    snp_enrollment_id: The enrollment the cost share arose on.
    customer_id: The member protected from the cost share.
    event_type: snp_cost_share_billed_to_state.
    billing_period: The coverage month the cost share arose in.
    posted_date: Date the state was billed.
    amount: Amount billed to the state.
    payer: state_medicaid_agency.
    cost_share_category: What the cost share was for.
  account: state_cost_share_receivable
  direction: in
  triggers: []
- type: snp_state_payment_received
  target: snp_premium_ledger
  meaning: The state Medicaid agency pays, or declines, a cost share the plan billed it, and the entry is settled against the billing it answers.
  grain: One row per state remittance posted against one named billing.
  distinguish_by:
  - source_premium_entry_id
  - posted_date
  - amount
  - adjustment_reason_code
  fields:
    snp_premium_entry_id: Reference number of this ledger entry.
    snp_enrollment_id: The enrollment credited.
    customer_id: The member whose cost share was billed.
    event_type: snp_state_payment_received.
    billing_period: The coverage month of the billing being settled.
    posted_date: Date the remittance was posted.
    amount: Amount the state paid or wrote off.
    payer: state_medicaid_agency.
    payment_channel: state_remittance_file.
    balance_effect: Whether the remittance left part of the billing outstanding, settled it exactly, or exceeded it.
    source_premium_entry_id: The single billing this remittance answers.
    adjustment_reason_code: state_denied_cost_share where the state refused it.
    remittance_reference: The reference on the state's remittance file, recorded exactly as stated.
  account: state_cost_share_receivable
  direction: out
  triggers: []
- type: snp_care_assessment_recorded
  target: snp_care_records
  meaning: A health risk assessment is carried out, or an attempt to carry one out is recorded, and the member's risk band is set.
  grain: One row per assessment attempt on one enrollment.
  distinguish_by:
  - record_date
  - assessment_type
  - contact_attempt_number
  fields:
    snp_care_record_id: Reference number of this care record.
    snp_enrollment_id: The enrollment assessed.
    customer_id: The member assessed.
    event_type: snp_care_assessment_recorded.
    record_date: Date of the assessment or the attempt.
    assessment_type: Which assessment this is.
    completion_status: How the attempt ended.
    risk_stratification: The risk band the assessment set.
    care_manager_npi: The care manager who carried it out.
    next_review_due_date: When the next review falls due.
    contact_attempt_number: Which attempt to reach the member this was.
  triggers:
  - event: snp:snp_care_plan_update
    when:
      completion_status: completed
    map:
      snp_enrollment_id: snp_enrollment_id
      care_plan_status: care_plan_active
- type: snp_care_plan_review
  target: snp_care_records
  meaning: The interdisciplinary care team reviews the member's individualised care plan and sets the date of the next review.
  grain: One row per care plan review on one enrollment.
  distinguish_by:
  - record_date
  - assessment_type
  - source_care_record_id
  fields:
    snp_care_record_id: Reference number of this care record.
    snp_enrollment_id: The enrollment reviewed.
    customer_id: The member reviewed.
    event_type: snp_care_plan_review.
    record_date: Date of the review.
    assessment_type: Which review this is.
    completion_status: How the review ended.
    risk_stratification: The risk band confirmed or changed at the review.
    care_manager_npi: The care manager who led the review.
    next_review_due_date: When the next review falls due.
    source_care_record_id: The assessment this review follows on from.
  triggers: []
measures:
- id: snp_msr_days_since_last_assessment
  window: From the record_date of the most recent completed assessment through the handling date inclusive.
  measure: Count of calendar days since the most recent snp_care_assessment_recorded row with completion_status completed; where there has never been one, counted from the coverage effective date.
- id: snp_msr_contact_attempts_this_cycle
  window: From the start of the current assessment cycle through the handling date inclusive.
  measure: Count of snp_care_assessment_recorded rows whose completion_status is attempted_not_reached in the current cycle.
- id: snp_msr_state_cost_share_outstanding
  window: The current contract year to date.
  measure: Sum of amount on snp_cost_share_billed_to_state rows less the amount settled by snp_state_payment_received rows in the same window.
policies:
- id: snp_agg_multi_holding
  subject:
  - snp_enrollment_created
  rule: A member may hold only one Special Needs Plan at a time, and never alongside an ordinary Medicare Advantage plan, because Medicare allows one Medicare Advantage election in any coverage month. No other Special Needs Plan enrollment for the same member is in a status of enrollment_submitted, eligibility_verification, active or deemed_continued_eligibility on the day the new election is recorded. Where such an enrollment exists the new election is recorded as a plan change, and the earlier enrollment ends the day before the new coverage begins. Enrollments in different contract years that do not overlap are not duplicates. A member who qualifies for two different Special Needs Plans is told what each would give them before either election is recorded, rather than being signed into whichever was mentioned first.
  eligibility:
  - id: single_snp_in_force
    applies_to:
    - snp_enrollment_created
    kind: dedup
    condition: No other Special Needs Plan enrollment for the same member is in a status of enrollment_submitted, eligibility_verification, active or deemed_continued_eligibility on the day the new election is recorded.
    evidence_fields:
    - snp_enrollments.customer_id
    - snp_enrollments.status
    - snp_enrollments.plan_year
    - snp_enrollments.coverage_effective_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - snp_enrollments.customer_id
      action_bindings:
        snp_enrollments.customer_id: customer_id
    dedup_contract:
      table: snp_enrollments
      mode: separate_record
      object_bindings:
        customer_id: customer_id
      duplicate_filters:
        status:
        - enrollment_submitted
        - eligibility_verification
        - active
        - deemed_continued_eligibility
      distinct_fields:
      - plan_year
      - coverage_effective_date
  params:
    max_per_customer: 1
- id: snp_eligibility_verification
  subject:
  - snp_eligibility_verification_started
  - snp_coverage_effectuation
  rule: A Special Needs Plan may be held only by a member who has the special need the plan is built for, and the plan confirms that need from its own authoritative source before coverage begins. The enrollment intake carries evidence of the qualifying special need from the tier's authoritative source, and that evidence is not the member's own statement alone. For a dual eligible plan the source is the monthly state Medicaid eligibility file; for a chronic condition plan it is a prescriber attestation confirmed against the member's claim history; for an institutional plan it is a completed level-of-care assessment. A member's own account of their diagnosis or their Medicaid status is enough to take the election and start the enquiry, and never enough to effectuate coverage; a member told otherwise by anyone is put right plainly. Where a prescriber attestation is outstanding the plan may effectuate coverage for the tier's attestation validity days while it waits, and ends the enrollment if the attestation never arrives. The qualifying need is confirmed again on the tier's reverification frequency, and a member is never asked to prove it more often than that.
  eligibility:
  - id: special_needs_evidence_on_file
    applies_to:
    - snp_eligibility_verification_started
    - snp_coverage_effectuation
    kind: state
    condition: The enrollment intake carries evidence of the qualifying special need from the tier's authoritative source, and that evidence is not the member's own statement alone.
    evidence_fields:
    - snp_enrollment_requests.snp_enrollment_request_id
    - snp_enrollment_requests.special_needs_evidence
    - snp_enrollment_requests.intake_status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - snp_enrollment_requests.snp_enrollment_request_id
      action_bindings:
        snp_enrollment_requests.snp_enrollment_request_id: snp_enrollment_request_id
    state_contract:
      field: snp_enrollment_requests.special_needs_evidence
      allowed:
      - state_medicaid_file_match
      - prescriber_attestation_on_file
      - institutional_assessment_on_file
  params:
    per_tier:
      Ridgecrest Dual Complete Essentials (HMO D-SNP):
        qualifying_condition: =qualifying_condition
        qualifying_evidence_source: =qualifying_evidence_source
        medicaid_category_required: =medicaid_category_required
        eligibility_reverification_frequency_months: =eligibility_reverification_frequency_months
        chronic_condition_attestation_valid_days: =chronic_condition_attestation_valid_days
        institutional_stay_qualifying_days: =institutional_stay_qualifying_days
      Ridgecrest Dual Complete Advantage (HMO D-SNP):
        qualifying_condition: =qualifying_condition
        qualifying_evidence_source: =qualifying_evidence_source
        medicaid_category_required: =medicaid_category_required
        eligibility_reverification_frequency_months: =eligibility_reverification_frequency_months
        chronic_condition_attestation_valid_days: =chronic_condition_attestation_valid_days
        institutional_stay_qualifying_days: =institutional_stay_qualifying_days
      Ridgecrest Heart Care Select (HMO C-SNP):
        qualifying_condition: =qualifying_condition
        qualifying_evidence_source: =qualifying_evidence_source
        medicaid_category_required: =medicaid_category_required
        eligibility_reverification_frequency_months: =eligibility_reverification_frequency_months
        chronic_condition_attestation_valid_days: =chronic_condition_attestation_valid_days
        institutional_stay_qualifying_days: =institutional_stay_qualifying_days
      Ridgecrest Diabetes Care Select (HMO C-SNP):
        qualifying_condition: =qualifying_condition
        qualifying_evidence_source: =qualifying_evidence_source
        medicaid_category_required: =medicaid_category_required
        eligibility_reverification_frequency_months: =eligibility_reverification_frequency_months
        chronic_condition_attestation_valid_days: =chronic_condition_attestation_valid_days
        institutional_stay_qualifying_days: =institutional_stay_qualifying_days
      Ridgecrest Lung Care Select (HMO C-SNP):
        qualifying_condition: =qualifying_condition
        qualifying_evidence_source: =qualifying_evidence_source
        medicaid_category_required: =medicaid_category_required
        eligibility_reverification_frequency_months: =eligibility_reverification_frequency_months
        chronic_condition_attestation_valid_days: =chronic_condition_attestation_valid_days
        institutional_stay_qualifying_days: =institutional_stay_qualifying_days
      Ridgecrest Institutional Care (HMO I-SNP):
        qualifying_condition: =qualifying_condition
        qualifying_evidence_source: =qualifying_evidence_source
        medicaid_category_required: =medicaid_category_required
        eligibility_reverification_frequency_months: =eligibility_reverification_frequency_months
        chronic_condition_attestation_valid_days: =chronic_condition_attestation_valid_days
        institutional_stay_qualifying_days: =institutional_stay_qualifying_days
- id: snp_deemed_eligibility
  subject:
  - snp_deemed_period_start
  - snp_eligibility_restored
  - snp_ineligibility_termination
  rule: 'A member who loses the status their Special Needs Plan rests on does not lose their cover at once: a deemed continued eligibility period begins, during which every benefit is paid exactly as before. The deemed continued eligibility period has run out, counted in whole months from the date the plan last confirmed the qualifying special need. Calendar months are counted from the day of the month the need was last confirmed, a month with no matching day ends on its last day, the final day of the deemed period is itself inside it, and calendar days are never used in place of calendar months. The plan writes to the member on the day the deemed period begins, saying what has happened, what they must do, and the exact date cover would end. Where the qualifying status is confirmed again at any point inside the period the enrollment returns to ordinary standing with no gap, no new assessment and no fresh election. A member whose deemed period ends unconfirmed is disenrolled, given the special election period their circumstances allow, and told plainly what cover they will have in the meantime. Cost-share protection carries on through the deemed period on the tiers that give it, so a member is never billed cost share while their Medicaid status is being sorted out.'
  eligibility:
  - id: deemed_period_exhausted
    applies_to:
    - snp_ineligibility_termination
    kind: time
    condition: The deemed continued eligibility period has run out, counted in whole months from the date the plan last confirmed the qualifying special need.
    evidence_fields:
    - snp_enrollments.snp_enrollment_id
    - snp_enrollments.eligibility_verified_date
    - snp_enrollments.deemed_period_end_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - snp_enrollments.snp_enrollment_id
      action_bindings:
        snp_enrollments.snp_enrollment_id: snp_enrollment_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the date the plan last confirmed the qualifying special need
      anchor_source: snp_enrollments.eligibility_verified_date
      relation: not_before
      duration_source: variants.deemed_eligibility_period_months
      unit: calendar_months
      counting_rule: Calendar months are counted from the day of the month the need was last confirmed, a month with no matching day ends on its last day, the final day of the deemed period is itself inside it, and calendar days are never used in place of calendar months.
      boundary: inclusive
  params:
    per_tier:
      Ridgecrest Dual Complete Essentials (HMO D-SNP):
        deemed_eligibility_period_months: =deemed_eligibility_period_months
        dual_cost_share_protection: =dual_cost_share_protection
      Ridgecrest Dual Complete Advantage (HMO D-SNP):
        deemed_eligibility_period_months: =deemed_eligibility_period_months
        dual_cost_share_protection: =dual_cost_share_protection
      Ridgecrest Heart Care Select (HMO C-SNP):
        deemed_eligibility_period_months: =deemed_eligibility_period_months
        dual_cost_share_protection: =dual_cost_share_protection
      Ridgecrest Diabetes Care Select (HMO C-SNP):
        deemed_eligibility_period_months: =deemed_eligibility_period_months
        dual_cost_share_protection: =dual_cost_share_protection
      Ridgecrest Lung Care Select (HMO C-SNP):
        deemed_eligibility_period_months: =deemed_eligibility_period_months
        dual_cost_share_protection: =dual_cost_share_protection
      Ridgecrest Institutional Care (HMO I-SNP):
        deemed_eligibility_period_months: =deemed_eligibility_period_months
        dual_cost_share_protection: =dual_cost_share_protection
- id: snp_premium_and_cost_share_billing
  subject:
  - snp_premium_charge
  - snp_premium_payment
  - snp_premium_credit
  rule: Where the tier carries a plan premium it is billed for each coverage month from the coverage effective date to the coverage end date, on the tier's due day. The enrollment is in a status of active or deemed_continued_eligibility on the day the charge is posted. A member in a Medicaid category the tier protects owes no plan cost share at all, and a charge raised against such a member is relieved by a credit rather than pursued. The Part B premium the tier buys down is paid by the state or the plan directly to Medicare and never appears on the member's own account. Money is posted against the oldest unpaid coverage month first, and a credit always names the single charge it relieves and the reason it was granted. A member protected from cost share who is nevertheless billed by a provider is told the bill is improper, and the plan takes it up with the provider rather than leaving the member to argue.
  eligibility:
  - id: enrollment_open_for_billing
    applies_to:
    - snp_premium_charge
    - snp_premium_payment
    - snp_premium_credit
    kind: state
    condition: The enrollment is in a status of active or deemed_continued_eligibility on the day the charge is posted.
    evidence_fields:
    - snp_enrollments.snp_enrollment_id
    - snp_enrollments.status
    - snp_enrollments.coverage_effective_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - snp_enrollments.snp_enrollment_id
      action_bindings:
        snp_enrollments.snp_enrollment_id: snp_enrollment_id
    state_contract:
      field: snp_enrollments.status
      allowed:
      - active
      - deemed_continued_eligibility
  params:
    per_tier:
      Ridgecrest Dual Complete Essentials (HMO D-SNP):
        monthly_plan_premium: =monthly_plan_premium
        premium_due_day_of_month: =premium_due_day_of_month
        premium_grace_period_days: =premium_grace_period_days
        part_b_premium_buy_down: =part_b_premium_buy_down
        dual_cost_share_protection: =dual_cost_share_protection
      Ridgecrest Dual Complete Advantage (HMO D-SNP):
        monthly_plan_premium: =monthly_plan_premium
        premium_due_day_of_month: =premium_due_day_of_month
        premium_grace_period_days: =premium_grace_period_days
        part_b_premium_buy_down: =part_b_premium_buy_down
        dual_cost_share_protection: =dual_cost_share_protection
      Ridgecrest Heart Care Select (HMO C-SNP):
        monthly_plan_premium: =monthly_plan_premium
        premium_due_day_of_month: =premium_due_day_of_month
        premium_grace_period_days: =premium_grace_period_days
