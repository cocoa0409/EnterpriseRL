extended_policies:
- id: advantage_ext_premium_subsidy_relief
  base_policy_refs:
  - advantage_premium_posting
  overwrite:
  - base_policy: advantage_premium_posting
    superseded_clause: may never exceed the amount of that charge; a credit larger than one charge is split across
      the charges it relieves
    replaced_by: The relief owed is posted as a single credit entry naming the most recent plan premium charge standing
      on the premium account, whatever the size of that charge, so that the relief reaches the account in one entry
      rather than being split across the charges it relieves.
  trigger: state_due
  subject:
  - advantage_premium_credit_adjustment
  computes: credit_amount
  target_tool: post_premium_relief_credit_3acf64b3
  params:
    standard_member_share: 1.0
    three_quarter_member_share: 0.75
    half_member_share: 0.5
    full_subsidy_member_share: 0.0
    standard_reachback_months: 0
    reachback_months_recent: 1
    reachback_months_established: 3
    established_award_credit_count: 3
    reckoning_charge_count: 2
    reckoning_window_months: 3
    quarterly_coverage_months: 3
    quarter_member_share: 0.25
  rule: 'The premium relief credited to a member is what the plan gives back on the plan premium account of a Medicare
    Advantage enrollment where more plan premium has been charged on it than the member is liable for, because the
    low income premium subsidy the member has been awarded reduces the plan premium of a plan that carries prescription
    drug coverage while the full premium is still charged. The premium relief credited to a member is the plan premium
    reckoned on the account, less the plan premium the member is liable for, less the relief already set off, rounded
    to the nearest cent once at the end, and it is never less than nothing. The plan premium reckoned on the account
    is the most recent plan premium charge standing on it. The plan premium the member is liable for is the coverage
    months chargeable to the member multiplied by the plan premium of one coverage month. The coverage months chargeable
    to the member are the coverage months reckoned as owed less the coverage months the low income premium subsidy
    award reaches back over, and are never fewer than none. The coverage months reckoned as owed are the whole months
    that have passed since the coverage effective date, and one more for the month in hand. The plan premium of
    one coverage month is the monthly plan premium of the tier held taken at the share of it the member meets, rounded
    to the nearest cent. The share of the monthly plan premium the member meets is the whole of it. The low income
    premium subsidy award reaches back over no coverage months. The relief already set off is nothing.

    Where more plan premium charges stand on the premium account than the coverage months the enrollment has been
    in force, the coverage months reckoned as owed are counted as one for every plan premium charge standing on
    the account; where the enrollment is billed quarterly and no more plan premium charges stand on the account
    than the coverage months it has been in force, they are counted as three for every plan premium charge standing
    on the account; and where the enrollment is billed monthly and no more plan premium charges stand on the account
    than the coverage months it has been in force, they are the whole months that have passed since the coverage
    effective date, and one more for the month in hand.

    Where the low income premium subsidy recorded for the member on their Medicare prescription drug plan record
    is a full subsidy, the share of the monthly plan premium the member meets is none of it; where that record shows
    a seventy-five per cent subsidy, the member meets a quarter of it; where that record shows a fifty per cent
    subsidy, the member meets half of it; where that record shows a twenty-five per cent subsidy, the member meets
    three quarters of it; and where that record shows no subsidy at all, the member meets the whole of it.

    Where at least three low income premium subsidy credits stand on the member''s Medicare prescription drug plan
    premium account, the low income premium subsidy award reaches back over three coverage months; where at least
    one but fewer than three such credits stand on that account, the award reaches back over one coverage month;
    and where no such credit stands on that account, the award reaches back over no coverage months.

    Where the enrollment is billed quarterly and at least two plan premium charges stand on the premium account,
    the plan premium reckoned on the account is every plan premium charge posted on it in the contract year; where
    the enrollment is billed monthly and at least two plan premium charges stand on the premium account, the plan
    premium reckoned on the account is the plan premium charges posted on it in the last three months; and where
    fewer than two plan premium charges stand on the premium account, the plan premium reckoned on the account is
    the most recent plan premium charge standing on it.

    Where the enrollment is billed quarterly and at least one credit adjustment stands on the premium account, the
    relief already set off is every credit adjustment posted on the account in the contract year, whatever reason
    each of them carries; where the enrollment is billed monthly and at least one credit adjustment stands on the
    premium account, the relief already set off is the credit adjustments posted on the account in the last three
    months, whatever reason each of them carries; and where no credit adjustment stands on the premium account,
    the relief already set off is nothing.

    The credit names the single plan premium charge it relieves and the reason it was granted, and the full plan
    premium stays charged on the account so that what the member owes is always the charge less the credits posted
    against it. The relief owed is posted as a single credit entry naming the most recent plan premium charge standing
    on the premium account, whatever the size of that charge, so that the relief reaches the account in one entry
    rather than being split across the charges it relieves. The reason recorded with the credit is the low income
    premium subsidy the member has been awarded.

    '
  prerequisite: []
  cross_category:
  - category: pdp
    as: history
    reads:
    - low_income_subsidy_applied
    - pdp_premium_ledger.adjustment_reason_code
    note: The share of the monthly plan premium the member meets and the coverage months the award reaches back
      over are both decided from the member's Medicare prescription drug plan record and the low income premium
      subsidy credits standing on its premium account.
  compute:
  - charge_count: COUNT('advantage_premium_ledger', event_type='advantage_premium_charge')
  - months_in_force: MONTHS(F('coverage_effective_date'), NOW) + 1
  - owed_months: charge_count if charge_count > months_in_force else (charge_count * K('quarterly_coverage_months')
      if F('premium_billing_frequency') == 'quarterly' else months_in_force)
  - subsidy_award: CFIELD('pdp', 'low_income_subsidy_applied')
  - member_share: K('full_subsidy_member_share') if subsidy_award == 'full_subsidy' else (K('quarter_member_share')
      if subsidy_award == 'partial_subsidy_75' else (K('half_member_share') if subsidy_award == 'partial_subsidy_50'
      else (K('three_quarter_member_share') if subsidy_award == 'partial_subsidy_25' else K('standard_member_share'))))
  - monthly_owed: RND(P('monthly_plan_premium') * member_share, 2)
  - award_credit_count: XCOUNT('pdp', 'pdp_premium_ledger', event_type='pdp_premium_credit_adjustment', adjustment_reason_code='low_income_subsidy_premium_reduction')
  - reachback_months: K('reachback_months_established') if award_credit_count >= K('established_award_credit_count')
      else (K('reachback_months_recent') if award_credit_count >= 1 else K('standard_reachback_months'))
  - chargeable_months: MX(0, owed_months - reachback_months)
  - charges_in_year: SUM('advantage_premium_ledger', 'amount', event_type='advantage_premium_charge')
  - charges_in_window: SUM('advantage_premium_ledger', 'amount', within_months=K('reckoning_window_months'), date_field='posted_date',
      event_type='advantage_premium_charge')
  - latest_charge: LATEST('advantage_premium_ledger', 'amount', date_field='posted_date', event_type='advantage_premium_charge')
  - charges_reckoned: charges_in_year if (F('premium_billing_frequency') == 'quarterly' and charge_count >= K('reckoning_charge_count'))
      else (charges_in_window if (F('premium_billing_frequency') == 'monthly' and charge_count >= K('reckoning_charge_count'))
      else latest_charge)
  - credit_count: COUNT('advantage_premium_ledger', event_type='advantage_premium_credit_adjustment')
  - credits_in_year: SUM('advantage_premium_ledger', 'amount', event_type='advantage_premium_credit_adjustment')
  - credits_in_window: SUM('advantage_premium_ledger', 'amount', within_months=K('reckoning_window_months'), date_field='posted_date',
      event_type='advantage_premium_credit_adjustment')
  - relief_set_off: credits_in_year if (F('premium_billing_frequency') == 'quarterly' and credit_count >= 1) else
      (credits_in_window if (F('premium_billing_frequency') == 'monthly' and credit_count >= 1) else 0)
  - result: MX(0, RND(charges_reckoned - chargeable_months * monthly_owed - relief_set_off, 2))
  compute_basis:
    charge_count: Where more plan premium charges stand on the premium account than the coverage months the enrollment
      has been in force, the coverage months reckoned as owed are counted as one for every plan premium charge standing
      on the account
    months_in_force: The coverage months reckoned as owed are the whole months that have passed since the coverage
      effective date, and one more for the month in hand.
    owed_months: Where more plan premium charges stand on the premium account than the coverage months the enrollment
      has been in force, the coverage months reckoned as owed are counted as one for every plan premium charge standing
      on the account; where the enrollment is billed quarterly and no more plan premium charges stand on the account
      than the coverage months it has been in force, they are counted as three for every plan premium charge standing
      on the account; and where the enrollment is billed monthly and no more plan premium charges stand on the account
      than the coverage months it has been in force, they are the whole months that have passed since the coverage
      effective date, and one more for the month in hand.
    subsidy_award: Where the low income premium subsidy recorded for the member on their Medicare prescription drug
      plan record is a full subsidy, the share of the monthly plan premium the member meets is none of it
    member_share: Where the low income premium subsidy recorded for the member on their Medicare prescription drug
      plan record is a full subsidy, the share of the monthly plan premium the member meets is none of it; where
      that record shows a seventy-five per cent subsidy, the member meets a quarter of it; where that record shows
      a fifty per cent subsidy, the member meets half of it; where that record shows a twenty-five per cent subsidy,
      the member meets three quarters of it; and where that record shows no subsidy at all, the member meets the
      whole of it.
    monthly_owed: The plan premium of one coverage month is the monthly plan premium of the tier held taken at the
      share of it the member meets, rounded to the nearest cent.
    award_credit_count: Where at least three low income premium subsidy credits stand on the member's Medicare prescription
      drug plan premium account, the low income premium subsidy award reaches back over three coverage months
    reachback_months: Where at least three low income premium subsidy credits stand on the member's Medicare prescription
      drug plan premium account, the low income premium subsidy award reaches back over three coverage months; where
      at least one but fewer than three such credits stand on that account, the award reaches back over one coverage
      month; and where no such credit stands on that account, the award reaches back over no coverage months.
    chargeable_months: The coverage months chargeable to the member are the coverage months reckoned as owed less
      the coverage months the low income premium subsidy award reaches back over, and are never fewer than none.
    charges_in_year: the plan premium reckoned on the account is every plan premium charge posted on it in the contract
      year
    charges_in_window: the plan premium reckoned on the account is the plan premium charges posted on it in the
      last three months
    latest_charge: The plan premium reckoned on the account is the most recent plan premium charge standing on it.
    charges_reckoned: Where the enrollment is billed quarterly and at least two plan premium charges stand on the
      premium account, the plan premium reckoned on the account is every plan premium charge posted on it in the
      contract year; where the enrollment is billed monthly and at least two plan premium charges stand on the premium
      account, the plan premium reckoned on the account is the plan premium charges posted on it in the last three
      months; and where fewer than two plan premium charges stand on the premium account, the plan premium reckoned
      on the account is the most recent plan premium charge standing on it.
    credit_count: Where the enrollment is billed quarterly and at least one credit adjustment stands on the premium
      account, the relief already set off is every credit adjustment posted on the account in the contract year,
      whatever reason each of them carries
    credits_in_year: the relief already set off is every credit adjustment posted on the account in the contract
      year, whatever reason each of them carries
    credits_in_window: the relief already set off is the credit adjustments posted on the account in the last three
      months, whatever reason each of them carries
    relief_set_off: Where the enrollment is billed quarterly and at least one credit adjustment stands on the premium
      account, the relief already set off is every credit adjustment posted on the account in the contract year,
      whatever reason each of them carries; where the enrollment is billed monthly and at least one credit adjustment
      stands on the premium account, the relief already set off is the credit adjustments posted on the account
      in the last three months, whatever reason each of them carries; and where no credit adjustment stands on the
      premium account, the relief already set off is nothing.
    result: The premium relief credited to a member is the plan premium reckoned on the account, less the plan premium
      the member is liable for, less the relief already set off, rounded to the nearest cent once at the end, and
      it is never less than nothing.
  factors:
  - id: owed_month_count
    effect: method
    decides: owed_months
    bindings:
    - charge_count
    - owed_months
    ladder:
    - when: more plan premium charges stand on the premium account than the coverage months the enrollment has been
        in force
      method: the coverage months reckoned as owed are counted as one for every plan premium charge standing on
        the account
    - when: the enrollment is billed quarterly and no more plan premium charges stand on the account than the coverage
        months it has been in force
      method: the coverage months reckoned as owed are counted as three for every plan premium charge standing on
        the account
    - when: the enrollment is billed monthly and no more plan premium charges stand on the account than the coverage
