- id: advantage_ext_reinstatement_restored_premium
  base_policy_refs:
  - advantage_reinstatement_for_good_cause
  overwrite: []
  trigger: state_due
  subject:
  - advantage_reinstatement
  computes: restored_premium_balance
  target_tool: reinstate_terminated_coverage_2c8af1d8
  params:
    standard_restored_months: 1
    restored_charge_count: 2
    recognised_payment_count: 2
    relief_credit_count: 2
    settlement_window_months: 3
    long_gap_months: 2
    whole_share: 1.0
    three_quarter_share: 0.75
    half_share: 0.5
    no_share: 0.0
    whole_collection_share: 1.0
    three_quarter_collection_share: 0.75
    half_collection_share: 0.5
    quarter_share: 0.25
  rule: 'The restored premium balance is what a member must pay on restoration for the coverage months a terminated
    enrollment is brought back for when a good-cause determination restores it. Coverage terminated for non-payment
    is restored only once no other Medicare Advantage election for the member stands awaiting the transaction reply.
    The restored premium balance is the plan premium for the coverage months restored, together with the arrears
    collected on restoration, less the relief allowed against it, rounded to the nearest cent once at the end, and
    it is never less than nothing. The plan premium for the coverage months restored is the coverage months restored
    multiplied by the plan premium of a restored coverage month. The coverage months restored are one. The plan
    premium of a restored coverage month is the monthly plan premium of the tier held taken at the share of it the
    member meets, rounded to the nearest cent. The share of the monthly plan premium the member meets is the whole
    of it. The arrears collected on restoration are the arrears standing when the coverage ended taken at the share
    of them the plan collects on restoration, rounded to the nearest cent. The arrears standing when the coverage
    ended are the plan premium reckoned as owed when the coverage ended less the payments recognised against it,
    rounded to the nearest cent, and never less than nothing. The share of the arrears the plan collects on restoration
    is the whole of them. The plan premium reckoned as owed when the coverage ended is the most recent plan premium
    charge standing on the premium account. The payments recognised against it are the most recent plan premium
    payment standing on the premium account. The relief allowed against it is nothing. The whole months since the
    coverage ended are the whole months that have passed since the coverage end date recorded on the terminated
    enrollment.

    Where the coverage ended at least one whole month before the handling date and at least two plan premium charges
    stand on the premium account, the coverage months restored are the whole months that have passed since the coverage
    end date, and one more for the month in hand; where the coverage ended at least one whole month before the handling
    date and fewer than two plan premium charges stand on the premium account, the coverage months restored are
    the whole months that have passed since the coverage end date; and where the coverage ended less than a whole
    month before the handling date, the coverage months restored are one.

    Where the low income premium subsidy recorded for the member on their Medicare prescription drug plan record
    is a full subsidy, the share of the monthly plan premium the member meets is none of it; where that record shows
    a seventy-five per cent subsidy, the member meets a quarter of it; where that record shows a fifty per cent
    subsidy, the member meets half of it; where that record shows a twenty-five per cent subsidy, the member meets
    three quarters of it; and where that record shows no subsidy at all, the member meets the whole of it.

    Where the enrollment is billed quarterly and at least two plan premium charges stand on the premium account,
    the plan premium reckoned as owed when the coverage ended is every plan premium charge posted on the account
    in the contract year; where the enrollment is billed monthly and at least two plan premium charges stand on
    the premium account, the plan premium reckoned as owed when the coverage ended is the plan premium charges posted
    on the account in the last three months; and where fewer than two plan premium charges stand on the premium
    account, the plan premium reckoned as owed when the coverage ended is the most recent plan premium charge standing
    on it.

    Where the enrollment is billed quarterly and at least two plan premium payments stand on the premium account,
    the payments recognised against it are every plan premium payment posted on the account in the contract year;
    where the enrollment is billed monthly and at least two plan premium payments stand on the premium account,
    the payments recognised against it are the plan premium payments posted on the account in the last three months;
    and where fewer than two plan premium payments stand on the premium account, the payments recognised against
    it are the most recent plan premium payment standing on the premium account.

    Where at least two plan premium payments stand on the premium account and the coverage ended less than two whole
    months before the handling date, the share of the arrears the plan collects on restoration is half of them,
    the rest being billed over the coverage months that follow; where at least two plan premium payments stand on
    the premium account and the coverage ended at least two whole months before the handling date, that share is
    three quarters of them; and where fewer than two plan premium payments stand on the premium account, that share
    is the whole of them.

    Where at least two credit adjustments stand on the premium account, the relief allowed against it is every credit
    adjustment posted on the account in the contract year, whatever reason each of them carries; where one credit
    adjustment stands on the premium account, the relief allowed against it is the credit adjustments posted on
    the account in the last three months, whatever reason each of them carries; and where no credit adjustment stands
    on the premium account, the relief allowed against it is nothing.

    The restoration keeps the original coverage effective date so that the coverage period is continuous again,
    and reinstatement is granted once for any one terminated enrollment.

    '
  prerequisite:
  - problem: advantage_ext_pending_election_withdrawal_credit
    kind: state_gate
    gate: advantage_enrollments.status
    form: state
    policy_source: Coverage terminated for non-payment is restored only once no other Medicare Advantage election
      for the member stands awaiting the transaction reply.
    condition: No other Medicare Advantage enrollment for the member stands in a status of enrollment_submitted
      or cms_transaction_pending.
    resolved_by: withdraw_pending_election_40acc444
    effect: Once no other election stands awaiting the transaction reply, the terminated enrollment is the member's
      only Medicare Advantage enrollment and its status may be returned to active.
  cross_category:
  - category: pdp
    as: branch
    reads:
    - low_income_subsidy_applied
    note: The share of the monthly plan premium the member meets for a restored coverage month is decided from the
      low income premium subsidy recorded on the member's Medicare prescription drug plan record.
  compute:
  - months_since_end: MONTHS(F('coverage_end_date'), NOW)
  - charge_count: COUNT('advantage_premium_ledger', event_type='advantage_premium_charge')
  - restored_months: (months_since_end + 1) if (months_since_end >= 1 and charge_count >= K('restored_charge_count'))
      else (months_since_end if (months_since_end >= 1 and charge_count < K('restored_charge_count')) else K('standard_restored_months'))
  - subsidy_award: CFIELD('pdp', 'low_income_subsidy_applied')
  - restored_share: K('no_share') if subsidy_award == 'full_subsidy' else (K('quarter_share') if subsidy_award ==
      'partial_subsidy_75' else (K('half_share') if subsidy_award == 'partial_subsidy_50' else (K('three_quarter_share')
      if subsidy_award == 'partial_subsidy_25' else K('whole_share'))))
  - month_rate: RND(P('monthly_plan_premium') * restored_share, 2)
  - charges_all: SUM('advantage_premium_ledger', 'amount', event_type='advantage_premium_charge')
  - charges_window: SUM('advantage_premium_ledger', 'amount', within_months=K('settlement_window_months'), date_field='posted_date',
      event_type='advantage_premium_charge')
  - latest_charge: LATEST('advantage_premium_ledger', 'amount', date_field='posted_date', event_type='advantage_premium_charge')
  - charges_reckoned: charges_all if (F('premium_billing_frequency') == 'quarterly' and charge_count >= K('restored_charge_count'))
      else (charges_window if (F('premium_billing_frequency') == 'monthly' and charge_count >= K('restored_charge_count'))
      else latest_charge)
  - payment_count: COUNT('advantage_premium_ledger', event_type='advantage_premium_payment')
  - collection_share: K('half_collection_share') if (payment_count >= K('recognised_payment_count') and months_since_end
      < K('long_gap_months')) else (K('three_quarter_collection_share') if (payment_count >= K('recognised_payment_count')
      and months_since_end >= K('long_gap_months')) else K('whole_collection_share'))
  - payments_all: SUM('advantage_premium_ledger', 'amount', event_type='advantage_premium_payment')
  - payments_window: SUM('advantage_premium_ledger', 'amount', within_months=K('settlement_window_months'), date_field='posted_date',
      event_type='advantage_premium_payment')
  - latest_payment: LATEST('advantage_premium_ledger', 'amount', date_field='posted_date', event_type='advantage_premium_payment')
  - payments_recognised: payments_all if (F('premium_billing_frequency') == 'quarterly' and payment_count >= K('recognised_payment_count'))
      else (payments_window if (F('premium_billing_frequency') == 'monthly' and payment_count >= K('recognised_payment_count'))
      else latest_payment)
  - arrears_standing: MX(0, RND(charges_reckoned - payments_recognised, 2))
  - arrears_collected: RND(arrears_standing * collection_share, 2)
  - relief_count: COUNT('advantage_premium_ledger', event_type='advantage_premium_credit_adjustment')
  - relief_all: SUM('advantage_premium_ledger', 'amount', event_type='advantage_premium_credit_adjustment')
  - relief_window: SUM('advantage_premium_ledger', 'amount', within_months=K('settlement_window_months'), date_field='posted_date',
      event_type='advantage_premium_credit_adjustment')
  - relief_allowed: relief_all if relief_count >= K('relief_credit_count') else (relief_window if relief_count >=
      1 else 0)
  - result: MX(0, RND(restored_months * month_rate + arrears_collected - relief_allowed, 2))
  compute_basis:
    months_since_end: The whole months since the coverage ended are the whole months that have passed since the
      coverage end date recorded on the terminated enrollment.
    charge_count: Where the coverage ended at least one whole month before the handling date and at least two plan
      premium charges stand on the premium account, the coverage months restored are the whole months that have
      passed since the coverage end date, and one more for the month in hand
    restored_months: Where the coverage ended at least one whole month before the handling date and at least two
      plan premium charges stand on the premium account, the coverage months restored are the whole months that
      have passed since the coverage end date, and one more for the month in hand; where the coverage ended at least
      one whole month before the handling date and fewer than two plan premium charges stand on the premium account,
      the coverage months restored are the whole months that have passed since the coverage end date; and where
      the coverage ended less than a whole month before the handling date, the coverage months restored are one.
    subsidy_award: Where the low income premium subsidy recorded for the member on their Medicare prescription drug
      plan record is a full subsidy, the share of the monthly plan premium the member meets is none of it
    restored_share: Where the low income premium subsidy recorded for the member on their Medicare prescription
      drug plan record is a full subsidy, the share of the monthly plan premium the member meets is none of it;
      where that record shows a seventy-five per cent subsidy, the member meets a quarter of it; where that record
      shows a fifty per cent subsidy, the member meets half of it; where that record shows a twenty-five per cent
      subsidy, the member meets three quarters of it; and where that record shows no subsidy at all, the member
      meets the whole of it.
    month_rate: The plan premium of a restored coverage month is the monthly plan premium of the tier held taken
      at the share of it the member meets, rounded to the nearest cent.
    charges_all: the plan premium reckoned as owed when the coverage ended is every plan premium charge posted on
      the account in the contract year
    charges_window: the plan premium reckoned as owed when the coverage ended is the plan premium charges posted
      on the account in the last three months
    latest_charge: The plan premium reckoned as owed when the coverage ended is the most recent plan premium charge
      standing on the premium account.
    charges_reckoned: Where the enrollment is billed quarterly and at least two plan premium charges stand on the
      premium account, the plan premium reckoned as owed when the coverage ended is every plan premium charge posted
      on the account in the contract year; where the enrollment is billed monthly and at least two plan premium
      charges stand on the premium account, the plan premium reckoned as owed when the coverage ended is the plan
      premium charges posted on the account in the last three months; and where fewer than two plan premium charges
      stand on the premium account, the plan premium reckoned as owed when the coverage ended is the most recent
      plan premium charge standing on it.
    payment_count: Where at least two plan premium payments stand on the premium account and the coverage ended
      less than two whole months before the handling date, the share of the arrears the plan collects on restoration
      is half of them, the rest being billed over the coverage months that follow
    collection_share: Where at least two plan premium payments stand on the premium account and the coverage ended
      less than two whole months before the handling date, the share of the arrears the plan collects on restoration
      is half of them, the rest being billed over the coverage months that follow; where at least two plan premium
      payments stand on the premium account and the coverage ended at least two whole months before the handling
      date, that share is three quarters of them; and where fewer than two plan premium payments stand on the premium
      account, that share is the whole of them.
    payments_all: the payments recognised against it are every plan premium payment posted on the account in the
      contract year
    payments_window: the payments recognised against it are the plan premium payments posted on the account in the
      last three months
    latest_payment: The payments recognised against it are the most recent plan premium payment standing on the
      premium account.
    payments_recognised: Where the enrollment is billed quarterly and at least two plan premium payments stand on
      the premium account, the payments recognised against it are every plan premium payment posted on the account
      in the contract year; where the enrollment is billed monthly and at least two plan premium payments stand
      on the premium account, the payments recognised against it are the plan premium payments posted on the account
      in the last three months; and where fewer than two plan premium payments stand on the premium account, the
      payments recognised against it are the most recent plan premium payment standing on the premium account.
    arrears_standing: The arrears standing when the coverage ended are the plan premium reckoned as owed when the
      coverage ended less the payments recognised against it, rounded to the nearest cent, and never less than nothing.
    arrears_collected: The arrears collected on restoration are the arrears standing when the coverage ended taken
      at the share of them the plan collects on restoration, rounded to the nearest cent.
    relief_count: Where at least two credit adjustments stand on the premium account, the relief allowed against
      it is every credit adjustment posted on the account in the contract year, whatever reason each of them carries
    relief_all: the relief allowed against it is every credit adjustment posted on the account in the contract year,
      whatever reason each of them carries
    relief_window: the relief allowed against it is the credit adjustments posted on the account in the last three
      months, whatever reason each of them carries
    relief_allowed: Where at least two credit adjustments stand on the premium account, the relief allowed against
      it is every credit adjustment posted on the account in the contract year, whatever reason each of them carries;
      where one credit adjustment stands on the premium account, the relief allowed against it is the credit adjustments
      posted on the account in the last three months, whatever reason each of them carries; and where no credit
      adjustment stands on the premium account, the relief allowed against it is nothing.
    result: The restored premium balance is the plan premium for the coverage months restored, together with the
      arrears collected on restoration, less the relief allowed against it, rounded to the nearest cent once at
      the end, and it is never less than nothing.
