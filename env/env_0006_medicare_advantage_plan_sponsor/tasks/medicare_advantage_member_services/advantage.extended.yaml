  rule: 'The closing premium balance is what a member is left owing for plan premium when their Medicare Advantage
    enrollment is brought to an end at their own election. The closing premium balance is not struck before the
    premium relief the member is owed stands on the premium account as a credit entry. The closing premium balance
    is the plan premium reckoned against the settlement, together with the plan premium for the coverage months
    the settlement still charges for, less the payments allowed against the settlement, less the relief allowed
    against the settlement, rounded to the nearest cent once at the end, and it is never less than nothing. The
    plan premium reckoned against the settlement is the most recent plan premium charge standing on the premium
    account. The coverage months the settlement still charges for are none. The plan premium for the coverage months
    the settlement still charges for is those coverage months multiplied by the plan premium of a coverage month
    the settlement charges for. The plan premium of a coverage month the settlement charges for is the monthly plan
    premium of the tier held taken at the share of it charged to the member, rounded to the nearest cent. The share
    of the monthly plan premium charged to the member is the whole of it. The coverage months the plan premium charges
    standing on the account cover are counted as three for every such charge where the enrollment is billed quarterly,
    and as one for every such charge where the enrollment is billed monthly. The coverage months the enrollment
    has been in force are the whole months that have passed since the coverage effective date, and one more for
    the month in hand. The payments allowed against the settlement are the most recent plan premium payment standing
    on the premium account. The relief allowed against the settlement is nothing.

    Where the enrollment is billed quarterly and at least two plan premium charges stand on the premium account,
    the plan premium reckoned against the settlement is every plan premium charge posted on the account in the contract
    year; where the enrollment is billed monthly and at least two plan premium charges stand on the premium account,
    the plan premium reckoned against the settlement is the plan premium charges posted on the account in the last
    three months; and where fewer than two plan premium charges stand on the premium account, the plan premium reckoned
    against the settlement is the most recent plan premium charge standing on it.

    Where the enrollment is billed quarterly and the plan premium charges standing on the account leave at least
    three coverage months the enrollment has been in force uncovered, the coverage months the settlement still charges
    for are three; where those charges leave the enrollment covered for fewer coverage months than it has been in
    force and either fewer than three are left uncovered or the enrollment is billed monthly, they are one; and
    where those charges cover every coverage month the enrollment has been in force, there are none. No coverage
    month beginning after the coverage end date is ever charged into the closing settlement, because the coverage
    months the settlement still charges for are only ever coverage months the enrollment has already been in force
    for.

    Where the low income premium subsidy recorded for the member on their Medicare prescription drug plan record
    is a full subsidy, the share of the monthly plan premium charged to the member is none of it; where that record
    shows a seventy-five per cent subsidy, a quarter of it is charged; where that record shows a fifty per cent
    subsidy, half of it is charged; where that record shows a twenty-five per cent subsidy, three quarters of it
    are charged; and where that record shows no subsidy at all, the whole of it is charged.

    Where the enrollment is billed quarterly and at least two plan premium payments stand on the premium account,
    the payments allowed against the settlement are every plan premium payment posted on the account in the contract
    year; where the enrollment is billed monthly and at least two plan premium payments stand on the premium account,
    the payments allowed against the settlement are the plan premium payments posted on the account in the last
    three months; and where fewer than two plan premium payments stand on the premium account, the payments allowed
    against the settlement are the most recent plan premium payment standing on it.

    Where the enrollment is billed quarterly and at least two credit adjustments stand on the premium account, the
    relief allowed against the settlement is every credit adjustment posted on the account in the contract year,
    whatever reason each of them carries; where at least one credit adjustment stands on the premium account and
    either fewer than two of them stand on it or the enrollment is billed monthly, the relief allowed against the
    settlement is the credit adjustments posted on the account in the last three months, whatever reason each of
    them carries; and where no credit adjustment stands on the premium account, the relief allowed against the settlement
    is nothing.

    Only the member, or a representative they have appointed in writing, may bring the enrollment to an end, the
    coverage runs to the last day of the month in which the plan received their request, and a member who leaves
    outside an election period returns to Original Medicare.

    '
