- id: advantage_ext_pending_election_withdrawal_credit
  base_policy_refs:
  - advantage_disenrollment_and_withdrawal
  overwrite:
  - base_policy: advantage_disenrollment_and_withdrawal
    superseded_clause: and any premium already paid is refunded in full
    replaced_by: The money the plan hands back on a withdrawn application is applied first to the rider premium
      the member still owes on their optional supplemental benefit rider, and only the remainder stands to the member's
      credit.
  trigger: state_due
  subject:
  - advantage_application_withdrawal
  computes: premium_standing_to_credit
  target_tool: withdraw_pending_election_40acc444
  params:
    advance_window_months: 3
    all_payment_count: 3
    window_payment_count: 2
    rider_window_months: 6
    rider_charge_count_threshold: 2
    suspended_months_owed: 3
    active_months_owed: 2
    standard_months_owed: 1
    full_offset_share: 1.0
    part_offset_share: 0.5
    no_offset_share: 0.0
  rule: 'The premium standing to a member''s credit is what the plan is left handing back when an application for
    a Medicare Advantage plan is withdrawn before coverage has begun, because a withdrawn application leaves no
    coverage period at all and nothing was ever owed on it. The money the plan hands back on a withdrawn application
    is applied first to the rider premium the member still owes on their optional supplemental benefit rider, and
    only the remainder stands to the member''s credit. The premium standing to a member''s credit is the money returned
    on the application less the rider premium met out of it, rounded to the nearest cent once at the end, and it
    is never less than nothing. The money returned on the application is the most recent payment posted to its premium
    account. The rider premium met out of it is the rider premium owing taken at the share of it the plan meets,
    rounded to the nearest cent. The rider premium owing is the monthly rider premium multiplied by the coverage
    months of rider premium reckoned as owing, rounded to the nearest cent. The monthly rider premium is nothing.
    The coverage months of rider premium reckoned as owing are one. The share of the rider premium owing the plan
    meets is none of it.

    Where at least three payments stand on the application''s premium account, the money returned on the application
    is every payment posted to that account; where two payments stand on the application''s premium account, the
    money returned on the application is the payments posted to that account in the last three months; and where
    fewer than two payments stand on the application''s premium account, the money returned on the application is
    the most recent payment posted to it.

    Where at least two rider premium charges have been posted to the member''s optional supplemental benefit rider
    account in the last six months and the rider carries rider premium owing, the monthly rider premium is the rider
    premium charged to that account in the last six months spread over those charges; where the rider carries rider
    premium owing and fewer than two rider premium charges have been posted to that account in the last six months,
    the monthly rider premium is the most recent rider premium charge standing on that account, and is nothing where
    no rider premium charge stands on it at all; and where the rider carries no rider premium owing, or the member
    holds no optional supplemental benefit rider, the monthly rider premium is nothing.

    Where the member''s optional supplemental benefit rider stands suspended for unpaid rider premium, the coverage
    months of rider premium reckoned as owing are three; where the member''s optional supplemental benefit rider
    stands in force or in its waiting period and rider premium has been charged to its account in the last six months,
    they are two; and where that rider stands in force or in its waiting period and no rider premium has been charged
    to its account in the last six months, where the rider stands in any state other than suspended for unpaid rider
    premium, in force or in its waiting period, or where the member holds no optional supplemental benefit rider,
    they are one.

    Where the member''s optional supplemental benefit rider stands suspended for unpaid rider premium and rider
    premium has been charged to its account, the share of the rider premium owing the plan meets is the whole of
    it; where the member''s optional supplemental benefit rider stands in force or in its waiting period and rider
    premium has been charged to its account, the share the plan meets is half of it; and where no rider premium
    has been charged to the member''s rider account, where the rider stands in any state other than suspended for
    unpaid rider premium, in force or in its waiting period, or where the member holds no optional supplemental
    benefit rider, the share the plan meets is none of it.

    Only the member, or a representative they have appointed in writing, may withdraw an application, the application
    is cancelled before it ever takes effect, and the reason recorded is that it was withdrawn before the coverage
    was due to begin.

    '
  prerequisite: []
  cross_category:
  - category: osb
    as: history
    reads:
    - status
    - rider_premium_balance_due
    - osb_rider_premium_ledger.amount
    note: The monthly rider premium, the coverage months of rider premium reckoned as owing and the share of it
      the plan meets are all decided from the member's optional supplemental benefit rider and the rider premium
      charged to its account.
  compute:
  - advance_payment_count: COUNT('advantage_premium_ledger', event_type='advantage_premium_payment')
  - advance_payments_all: SUM('advantage_premium_ledger', 'amount', event_type='advantage_premium_payment')
  - advance_payments_window: SUM('advantage_premium_ledger', 'amount', within_months=K('advance_window_months'),
      date_field='posted_date', event_type='advantage_premium_payment')
  - latest_advance_payment: LATEST('advantage_premium_ledger', 'amount', date_field='posted_date', event_type='advantage_premium_payment')
  - money_returned: advance_payments_all if advance_payment_count >= K('all_payment_count') else (advance_payments_window
      if advance_payment_count >= K('window_payment_count') else latest_advance_payment)
  - rider_balance: CFIELD('osb', 'rider_premium_balance_due')
  - rider_charge_count: XCOUNT('osb', 'osb_rider_premium_ledger', within_months=K('rider_window_months'), date_field='posted_date',
      event_type='osb_rider_premium_charge')
  - rider_charges_window: XSUM('osb', 'osb_rider_premium_ledger', 'amount', within_months=K('rider_window_months'),
      date_field='posted_date', event_type='osb_rider_premium_charge')
  - rider_ledger_count: XCOUNT('osb', 'osb_rider_premium_ledger', event_type='osb_rider_premium_charge')
  - latest_rider_charge: XLATEST('osb', 'osb_rider_premium_ledger', 'amount', date_field='posted_date', event_type='osb_rider_premium_charge')
  - rider_monthly: RND(rider_charges_window / MX(rider_charge_count, 1), 2) if (rider_charge_count >= K('rider_charge_count_threshold')
      and rider_ledger_count >= 1 and rider_balance > 0) else (latest_rider_charge if (rider_ledger_count >= 1 and
      rider_balance > 0) else 0)
  - rider_status: CFIELD('osb', 'status')
  - rider_months_owed: K('suspended_months_owed') if rider_status == 'premium_suspended' else (K('active_months_owed')
      if ((rider_status == 'active' or rider_status == 'waiting_period') and rider_charge_count >= 1) else K('standard_months_owed'))
  - rider_owing: RND(rider_monthly * rider_months_owed, 2)
  - offset_share: K('full_offset_share') if (rider_status == 'premium_suspended' and rider_ledger_count >= 1) else
      (K('part_offset_share') if ((rider_status == 'active' or rider_status == 'waiting_period') and rider_ledger_count
