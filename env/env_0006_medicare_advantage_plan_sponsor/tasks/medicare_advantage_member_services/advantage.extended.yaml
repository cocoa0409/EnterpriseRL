  baseline:
    rule: The restored premium balance is what a member must pay on restoration for the coverage months a terminated
      enrollment is brought back for when a good-cause determination restores it. The restored premium balance is
      the plan premium for the coverage months restored, together with the arrears collected on restoration, less
      the relief allowed against it, rounded to the nearest cent once at the end, and it is never less than nothing.
      The plan premium for the coverage months restored is the coverage months restored multiplied by the plan premium
      of a restored coverage month. The coverage months restored are one. The plan premium of a restored coverage
      month is the monthly plan premium of the tier held taken at the share of it the member meets, rounded to the
      nearest cent. The share of the monthly plan premium the member meets is the whole of it. The arrears collected
      on restoration are the arrears standing when the coverage ended taken at the share of them the plan collects
      on restoration, rounded to the nearest cent. The arrears standing when the coverage ended are the plan premium
      reckoned as owed when the coverage ended less the payments recognised against it, rounded to the nearest cent,
      and never less than nothing. The share of the arrears the plan collects on restoration is the whole of them.
      The plan premium reckoned as owed when the coverage ended is the most recent plan premium charge standing
      on the premium account. The payments recognised against it are the most recent plan premium payment standing
      on the premium account. The relief allowed against it is nothing. The whole months since the coverage ended
      are the whole months that have passed since the coverage end date recorded on the terminated enrollment. The
      restoration keeps the original coverage effective date so that the coverage period is continuous again, and
      reinstatement is granted once for any one terminated enrollment.
    params:
    - standard_restored_months
    - whole_share
    - whole_collection_share
    - monthly_plan_premium
