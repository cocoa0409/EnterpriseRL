# Product and event policy charter — Medicare Advantage Health Plans.
# The single registry of every quantified policy in this category; every number appears here once.
category: advantage
display_name: Medicare Advantage Health Plans
binding:
  holding_table: advantage_enrollments
  event_tables:
  - advantage_premium_ledger
  - advantage_medical_claims
  - advantage_service_requests
  intake_tables:
  - advantage_enrollment_requests
  status_field: status
  variant_field: variant_name
  quantity_fields:
    premium_balance_due: premium_receivable
    moop_accumulated: moop_accrual
lifecycle:
  states:
  - enrollment_submitted
  - cms_transaction_pending
  - active
  - premium_grace_period
  - terminated_for_nonpayment
  - disenrolled
  - cancelled_before_effective
  transitions:
  - from: enrollment_submitted
    to: cms_transaction_pending
    by: system
    means: The accepted election is placed on the daily enrollment file sent to CMS.
  - from: enrollment_submitted
    to: cancelled_before_effective
    by: user
    means: The member withdraws the application before it has been transmitted.
  - from: cms_transaction_pending
    to: active
    by: system
    means: CMS accepts the transaction and the coverage effective date arrives.
  - from: cms_transaction_pending
    to: cancelled_before_effective
    by: user
    means: The member withdraws the application before coverage begins.
  - from: active
    to: premium_grace_period
    by: system
    means: A monthly plan premium is unpaid after its due day.
  - from: premium_grace_period
    to: active
    by: agent
    means: The full outstanding premium is received inside the grace period.
  - from: premium_grace_period
    to: terminated_for_nonpayment
    by: system
    means: The grace period expires with premium still outstanding.
  - from: active
    to: disenrolled
    by: user
    means: The member elects to leave the plan during an election period open to them.
  - from: premium_grace_period
    to: disenrolled
    by: user
    means: The member elects to leave the plan while their premium is in arrears.
  - from: terminated_for_nonpayment
    to: active
    by: agent
    means: A recorded good-cause determination reinstates the terminated coverage.
accounts:
- key: premium_receivable
  unit: USD
  meaning: 'Plan premium the member owes but has not yet paid: charges increase it and payments and credit adjustments
    reduce it, and its running total is the premium balance due on the enrollment.'
- key: moop_accrual
  unit: USD
  meaning: 'Member cost share accumulated toward the contract year''s maximum out-of-pocket: adjudicated lines add
    to it and reversals take back out of it.'
parameter_schema:
  plan_type: 'Contract form of the plan: HMO, HMO-POS or PPO (string).'
  monthly_plan_premium: Plan premium billed to the member each coverage month, in USD.
  premium_billing_frequency_default: 'Default billing cadence assigned at enrollment: monthly or quarterly (string).'
  premium_due_day_of_month: Calendar day of the coverage month on which the plan premium falls due (integer 1-28).
  premium_grace_period_days: Calendar days after the first unpaid premium charge before involuntary termination
    may be processed (integer days).
  late_payment_reinstatement_window_days: Calendar days after the coverage end date within which a good-cause reinstatement
    may still be requested (integer days).
  part_b_premium_reduction: Monthly Part B premium reduction credited to the member through Social Security, in
    USD.
  annual_medical_deductible: In-network medical deductible for the plan year, in USD.
  in_network_moop: Annual in-network maximum out-of-pocket, in USD.
  combined_moop: Annual combined in- and out-of-network maximum out-of-pocket, in USD; equals the in-network figure
    on HMO plans.
  primary_care_copay: Member copay for an in-network primary care visit, in USD.
  specialist_copay: Member copay for an in-network specialist visit, in USD.
  urgent_care_copay: Member copay for an urgent care centre visit, in USD.
  emergency_room_copay: Member copay for an emergency department visit, in USD, waived when the visit leads to an
    inpatient admission.
  inpatient_day_1_to_6_copay: Per-day member copay for days 1 to 6 of an in-network acute inpatient stay, in USD.
  inpatient_day_7_onward_copay: Per-day member copay from day 7 of an in-network acute inpatient stay, in USD.
  outpatient_surgery_coinsurance: Member coinsurance on in-network outpatient surgery, as a percentage of the plan
    allowed amount.
  diagnostic_imaging_coinsurance: Member coinsurance on in-network advanced diagnostic imaging, as a percentage
    of the plan allowed amount.
  laboratory_copay: Member copay for in-network clinical laboratory services, in USD.
  ambulance_copay: Member copay for a one-way ground ambulance trip, in USD.
  skilled_nursing_day_1_to_20_copay: Per-day member copay for days 1 to 20 of a skilled nursing facility stay, in
    USD.
  skilled_nursing_day_21_to_100_copay: Per-day member copay for days 21 to 100 of a skilled nursing facility stay,
    in USD.
  durable_medical_equipment_coinsurance: Member coinsurance on durable medical equipment, as a percentage of the
    plan allowed amount.
  part_b_drug_coinsurance: Member coinsurance on Part B administered drugs, as a percentage of the plan allowed
    amount.
  dialysis_coinsurance: Member coinsurance on outpatient dialysis, as a percentage of the plan allowed amount.
  out_of_network_coinsurance: Member coinsurance on covered out-of-network services, as a percentage of the plan
    allowed amount; 100 means the plan pays nothing out of network.
  referral_required: Whether an in-network specialist visit needs a referral from the primary care provider (true
    or false).
  primary_care_provider_required: Whether the enrollment must carry a primary care provider on record (true or false).
  network_tier_count: Number of provider cost-share tiers in the network (integer).
  worldwide_emergency_coverage_limit: Annual plan payment limit for emergency care received outside the United States,
    in USD.
  prior_authorization_required_categories: Benefit categories that need prior authorisation before the service is
    rendered (list of service_category values).
  prior_auth_standard_decision_days: Calendar days within which a standard prior authorisation or organisation determination
    must be decided (integer days).
  prior_auth_expedited_decision_hours: Hours within which an expedited prior authorisation or organisation determination
    must be decided (integer hours).
  prior_auth_extension_days: Calendar days a decision deadline may be extended when the extension test is met (integer
    days).
  reconsideration_standard_decision_days: Calendar days within which a standard plan-level reconsideration must
    be decided (integer days).
  reconsideration_expedited_decision_hours: Hours within which an expedited plan-level reconsideration must be decided
    (integer hours).
  appeal_filing_window_days: Calendar days after the adverse determination notice within which a reconsideration
    may be filed (integer days).
  good_cause_extension_days: Additional calendar days a late appeal may be accepted for when good cause is shown
    (integer days).
  timely_filing_days: Calendar days after the date of service within which a provider claim must reach the plan
    (integer days).
  dental_allowance_annual: Embedded comprehensive dental allowance for the plan year, in USD.
  vision_allowance_annual: Embedded eyewear allowance for the plan year, in USD.
  hearing_aid_allowance_per_ear: Embedded hearing aid allowance per ear per plan year, in USD.
  otc_allowance_quarterly: Over-the-counter and healthy-food allowance loaded each calendar quarter, in USD.
  fitness_benefit_included: Whether the plan includes the network fitness membership (true or false).
  transportation_trips_per_year: Plan-covered one-way non-emergency transportation trips per plan year (integer).
  meals_after_discharge_count: Home-delivered meals covered after an inpatient discharge (integer meals).
  part_d_included: Whether the plan includes Part D prescription drug coverage (true or false).
  part_d_annual_deductible: Part D deductible for the plan year, in USD.
  part_d_initial_coverage_limit: Total drug spend at which the initial coverage stage ends, in USD.
  part_d_annual_out_of_pocket_threshold: Member out-of-pocket drug spend at which catastrophic coverage begins,
    in USD.
  part_d_preferred_generic_copay: Member copay for a 30-day preferred generic fill at a preferred retail pharmacy,
    in USD.
  part_d_preferred_brand_copay: Member copay for a 30-day preferred brand fill at a preferred retail pharmacy, in
    USD.
  part_d_specialty_coinsurance: Member coinsurance on a 30-day specialty tier fill, as a percentage of the negotiated
    price.
  insulin_copay_cap_month: Maximum member copay for a one-month supply of a covered insulin product, in USD.
  mail_order_90_day_multiplier: Multiplier applied to the 30-day retail cost share for a 90-day mail-order fill
    (decimal).
  star_rating: Most recent CMS overall star rating published for this plan (decimal, 1.0 to 5.0).
  service_area_counties: Counties in which the plan may be sold and held (list of county names).
  enrollment_capacity_limit: Maximum number of members CMS has approved for this plan benefit package (integer).
  effective_date_rule: Rule that turns an accepted election into a coverage start date (string).
  disenrollment_effective_rule: Rule that turns an accepted disenrollment into a coverage end date (string).
  maximum_retroactive_months: Months of retroactive coverage the plan may accept on a CMS-directed correction (integer
    months).
  id_card_reissue_fee: Fee charged to reissue a member identification card, in USD.
  chronic_condition_requirement: Chronic condition a member must have to hold this plan, or none (string).
  dual_eligible_cost_share_protection: Whether members with qualifying Medicaid status are held harmless from plan
    cost share (true or false).
  annual_notice_of_change_mail_by: Latest date each year, as MM-DD, by which the annual notice of change must be
    mailed (string).
