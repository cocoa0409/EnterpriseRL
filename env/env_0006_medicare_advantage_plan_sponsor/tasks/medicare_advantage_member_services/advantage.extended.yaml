- id: advantage_rider_and_allowance_interaction
  subject:
  - advantage_claim_adjudication
  - advantage_coverage_effectuation
  rule: 'Holding an optional supplemental benefit rider changes how this plan pays dental, vision and hearing services:
    the rider''s own annual maximum is applied first, and only what the rider does not cover is charged against
    the plan''s embedded allowance for that benefit. The rider the member holds is in force on the date of service
    of the line the plan is paying. The two are never stacked into one larger payment for a single service, and
    the plan never pays twice for the same line. Where the member holds no rider the plan''s embedded allowance
    applies on its own, and once that allowance is exhausted for the contract year further services of that kind
    are the member''s own cost and do not count toward the maximum out-of-pocket. Effectuating the medical plan
    opens the supplemental benefit allowance card programme the tier carries and makes the first quarterly load
    available on the coverage effective date; the card is never opened before coverage begins. A member whose tier
    carries no allowance card is told so plainly rather than being enrolled in a card programme with nothing on
    it.'
