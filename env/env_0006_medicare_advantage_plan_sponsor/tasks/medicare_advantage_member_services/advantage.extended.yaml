- id: advantage_ext_corrected_claim_cost_share
  base_policy_refs:
  - advantage_claim_cost_share
  - advantage_rider_and_allowance_interaction
  overwrite:
  - base_policy: advantage_claim_cost_share
    superseded_clause: Cost share stops at the tier's in-network maximum out-of-pocket
    replaced_by: The corrected liability stops at the maximum out-of-pocket the line is capped against, which on
      a line given out of network by a tier that pays for covered out-of-network care is the combined in- and out-of-network
      maximum out-of-pocket of the tier held.
  trigger: on_request
  subject:
  - advantage_claim_adjudication
  computes: member_cost_share
  target_tool: post_corrected_claim_line_a6b381de
  params:
    accumulator_line_count: 3
    accumulator_window_months: 3
    denied_line_count: 1
    recent_denied_window_months: 3
  rule: 'The corrected liability on a claim line is what the member owes once the plan restates a line it has already
    adjudicated, and it is fixed this way on a line whose benefit category the tier held prices by a coinsurance;
    a line whose benefit category the tier held prices by a copay is outside this rule and is restated on the copay
    basis the plan''s cost-share rules already fix for it. A corrected liability is not fixed on a claim line before
    the enrollment it was rendered under stands in force with no coverage end date recorded on it. The corrected
    liability on a claim line is the amount after the deductible taken at the share of it the member meets, rounded
    to the nearest cent once at the end. Where the amount after the deductible taken at the share of it the member
    meets is more than the distance remaining to the maximum out-of-pocket, only that distance remaining is charged.
    The corrected liability stops at the maximum out-of-pocket the line is capped against, which on a line given
    out of network by a tier that pays for covered out-of-network care is the combined in- and out-of-network maximum
    out-of-pocket of the tier held. The amount after the deductible is the plan allowed amount of the line the correction
    restates less the deductible taken out of that line, and is never less than nothing. The plan allowed amount
    of the line the correction restates is the plan allowed amount of the most recently processed claim line standing
    denied on the enrollment. The deductible taken out of that line is the annual medical deductible still unmet,
    or the plan allowed amount of the line where that is smaller. The annual medical deductible still unmet is the
    annual medical deductible of the tier held less the plan allowed amount of the in-network claim lines already
    adjudicated on the enrollment, and is never less than nothing. The share of the amount after the deductible
    the member meets is the coinsurance the tier fixes for in-network outpatient surgery. The distance remaining
    to the maximum out-of-pocket is the maximum out-of-pocket the line is capped against less the cost share accumulated
    for the contract year, and is never less than nothing. The maximum out-of-pocket the line is capped against
    is the in-network maximum out-of-pocket of the tier held. The cost share accumulated for the contract year is
    the member cost share of every adjudicated claim line standing on the enrollment.

    Where more than one claim line stands denied on the enrollment and at least one of them was processed in the
    last three months, the plan allowed amount of the line the correction restates is the plan allowed amount of
    the denied line carrying the largest plan allowed amount; where more than one claim line stands denied on the
    enrollment and none of them was processed in the last three months, it is the plan allowed amount of the most
    recently processed claim line standing on the enrollment, denied or not; and where one claim line stands denied
    on the enrollment, it is the plan allowed amount of that line.

    Where the line the correction restates is an out-of-network line, no part of the annual medical deductible is
    taken out of it; where the line the correction restates is an in-network line and the annual medical deductible
    still unmet is more than the plan allowed amount of that line, the whole plan allowed amount of the line is
    taken for the deductible; and where the line the correction restates is an in-network line and the annual medical
    deductible still unmet is no more than the plan allowed amount of that line, the annual medical deductible still
    unmet is taken out of it.

    Where the line the correction restates is an out-of-network line whose benefit category is not one the plan
    always covers at the in-network cost share, the share of the amount after the deductible the member meets is
    the coinsurance the tier fixes for covered out-of-network care; where the line the correction restates is an
    out-of-network line whose benefit category is one the plan always covers at the in-network cost share, that
    share is the coinsurance the tier fixes for outpatient dialysis, that being the only such benefit category the
    tier prices by a coinsurance; and where the line the correction restates is an in-network line, that share is
    the coinsurance the tier fixes for in-network outpatient surgery.

    Where the line the correction restates is an out-of-network line and the tier held pays for covered out-of-network
    care, the maximum out-of-pocket the line is capped against is the combined in- and out-of-network maximum out-of-pocket
    of the tier held; where the line the correction restates is an out-of-network line and the tier held pays nothing
    for covered out-of-network care, the maximum out-of-pocket the line is capped against is nothing; and where
    the line the correction restates is an in-network line, it is the in-network maximum out-of-pocket of the tier
    held.

    Where the enrollment carries no coverage end date and at least three claim lines stand adjudicated on it, the
    cost share accumulated for the contract year is the member cost share of every claim line standing on the enrollment,
    with the liability backed out by reversals counted as negative; where the enrollment carries a coverage end
    date and at least three claim lines stand adjudicated on it, the cost share accumulated for the contract year
    is the member cost share of the claim lines processed in the last three months; and where fewer than three claim
    lines stand adjudicated on the enrollment, the cost share accumulated for the contract year is the member cost
    share of every adjudicated claim line standing on the enrollment.

    The corrected line carries the reference of the line it replaces and the coverage request that authorised the
    service, and amounts the member pays for services the plan does not cover at all never count toward the maximum
    out-of-pocket.

    '
  prerequisite:
  - problem: advantage_ext_reinstatement_restored_premium
    kind: value_input
    gate: accumulated_share
    form: state
    policy_source: A corrected liability is not fixed on a claim line before the enrollment it was rendered under
      stands in force with no coverage end date recorded on it.
    condition: The enrollment the line was rendered under stands in force and carries no coverage end date.
    resolved_by: reinstate_terminated_coverage_2c8af1d8
    effect: Once the enrollment stands in force with no coverage end date, the cost share accumulated for the contract
      year is measured over every claim line standing on the enrollment rather than over the claim lines processed
      in the last three months, and the distance remaining to the maximum out-of-pocket moves with it.
  cross_category: []
  compute:
  - denied_count: COUNT('advantage_medical_claims', event_type='advantage_claim_adjudication', claim_status='denied')
  - recent_denied_count: COUNT('advantage_medical_claims', within_months=K('recent_denied_window_months'), date_field='processed_date',
      event_type='advantage_claim_adjudication', claim_status='denied')
  - largest_denied_allowed: MAX('advantage_medical_claims', 'plan_allowed_amount', event_type='advantage_claim_adjudication',
      claim_status='denied')
  - latest_any_allowed: LATEST('advantage_medical_claims', 'plan_allowed_amount', date_field='processed_date', event_type='advantage_claim_adjudication')
  - latest_denied_allowed: LATEST('advantage_medical_claims', 'plan_allowed_amount', date_field='processed_date',
      event_type='advantage_claim_adjudication', claim_status='denied')
  - line_allowed: largest_denied_allowed if (denied_count > K('denied_line_count') and recent_denied_count >= 1)
      else (latest_any_allowed if denied_count > K('denied_line_count') else latest_denied_allowed)
  - line_network: LATEST('advantage_medical_claims', 'network_status', date_field='processed_date', event_type='advantage_claim_adjudication',
      claim_status='denied')
  - moop_limit: P('combined_moop') if (line_network == 'out_of_network' and P('out_of_network_coinsurance') < 100)
      else (0 if line_network == 'out_of_network' else P('in_network_moop'))
  - allowed_in_network: SUM('advantage_medical_claims', 'plan_allowed_amount', event_type='advantage_claim_adjudication',
      network_status='in_network')
  - deductible_left: MX(0, P('annual_medical_deductible') - allowed_in_network)
  - deductible_taken: 0 if line_network == 'out_of_network' else (line_allowed if deductible_left > line_allowed
      else deductible_left)
  - after_deductible: MX(0, line_allowed - deductible_taken)
  - line_category: LATEST('advantage_medical_claims', 'service_category', date_field='processed_date', event_type='advantage_claim_adjudication',
      claim_status='denied')
  - share_rate: P('out_of_network_coinsurance') / 100 if (line_network == 'out_of_network' and line_category !=
      'dialysis') else (P('dialysis_coinsurance') / 100 if line_network == 'out_of_network' else P('outpatient_surgery_coinsurance')
      / 100)
  - gross_share: RND(after_deductible * share_rate, 2)
  - adjudicated_count: COUNT('advantage_medical_claims', event_type='advantage_claim_adjudication')
  - accumulated_share: SUM('advantage_medical_claims', 'member_cost_share') if (F('coverage_end_date') == '' and
      adjudicated_count >= K('accumulator_line_count')) else (SUM('advantage_medical_claims', 'member_cost_share',
      within_months=K('accumulator_window_months'), date_field='processed_date', event_type='advantage_claim_adjudication')
      if adjudicated_count >= K('accumulator_line_count') else SUM('advantage_medical_claims', 'member_cost_share',
      event_type='advantage_claim_adjudication'))
  - moop_headroom: MX(0, moop_limit - accumulated_share)
  - result: RND(MN(moop_headroom, gross_share), 2)
  compute_basis:
    denied_count: Where more than one claim line stands denied on the enrollment and at least one of them was processed
      in the last three months, the plan allowed amount of the line the correction restates is the plan allowed
      amount of the denied line carrying the largest plan allowed amount
    recent_denied_count: where more than one claim line stands denied on the enrollment and none of them was processed
      in the last three months, it is the plan allowed amount of the most recently processed claim line standing
      on the enrollment, denied or not
    largest_denied_allowed: the plan allowed amount of the line the correction restates is the plan allowed amount
      of the denied line carrying the largest plan allowed amount
    latest_any_allowed: it is the plan allowed amount of the most recently processed claim line standing on the
      enrollment, denied or not
    latest_denied_allowed: The plan allowed amount of the line the correction restates is the plan allowed amount
      of the most recently processed claim line standing denied on the enrollment.
    line_allowed: Where more than one claim line stands denied on the enrollment and at least one of them was processed
      in the last three months, the plan allowed amount of the line the correction restates is the plan allowed
      amount of the denied line carrying the largest plan allowed amount; where more than one claim line stands
      denied on the enrollment and none of them was processed in the last three months, it is the plan allowed amount
      of the most recently processed claim line standing on the enrollment, denied or not; and where one claim line
      stands denied on the enrollment, it is the plan allowed amount of that line.
    line_network: Where the line the correction restates is an out-of-network line and the tier held pays for covered
      out-of-network care, the maximum out-of-pocket the line is capped against is the combined in- and out-of-network
      maximum out-of-pocket of the tier held
    moop_limit: Where the line the correction restates is an out-of-network line and the tier held pays for covered
      out-of-network care, the maximum out-of-pocket the line is capped against is the combined in- and out-of-network
      maximum out-of-pocket of the tier held; where the line the correction restates is an out-of-network line and
      the tier held pays nothing for covered out-of-network care, the maximum out-of-pocket the line is capped against
      is nothing; and where the line the correction restates is an in-network line, it is the in-network maximum
      out-of-pocket of the tier held.
    allowed_in_network: The annual medical deductible still unmet is the annual medical deductible of the tier held
      less the plan allowed amount of the in-network claim lines already adjudicated on the enrollment, and is never
      less than nothing.
    deductible_left: The annual medical deductible still unmet is the annual medical deductible of the tier held
      less the plan allowed amount of the in-network claim lines already adjudicated on the enrollment, and is never
      less than nothing.
    deductible_taken: Where the line the correction restates is an out-of-network line, no part of the annual medical
      deductible is taken out of it; where the line the correction restates is an in-network line and the annual
      medical deductible still unmet is more than the plan allowed amount of that line, the whole plan allowed amount
      of the line is taken for the deductible; and where the line the correction restates is an in-network line
      and the annual medical deductible still unmet is no more than the plan allowed amount of that line, the annual
      medical deductible still unmet is taken out of it.
    after_deductible: The amount after the deductible is the plan allowed amount of the line the correction restates
      less the deductible taken out of that line, and is never less than nothing.
    line_category: Where the line the correction restates is an out-of-network line whose benefit category is not
      one the plan always covers at the in-network cost share, the share of the amount after the deductible the
      member meets is the coinsurance the tier fixes for covered out-of-network care
    share_rate: Where the line the correction restates is an out-of-network line whose benefit category is not one
      the plan always covers at the in-network cost share, the share of the amount after the deductible the member
      meets is the coinsurance the tier fixes for covered out-of-network care; where the line the correction restates
      is an out-of-network line whose benefit category is one the plan always covers at the in-network cost share,
      that share is the coinsurance the tier fixes for outpatient dialysis, that being the only such benefit category
      the tier prices by a coinsurance; and where the line the correction restates is an in-network line, that share
      is the coinsurance the tier fixes for in-network outpatient surgery.
    gross_share: The corrected liability on a claim line is the amount after the deductible taken at the share of
      it the member meets, rounded to the nearest cent once at the end.
    adjudicated_count: Where the enrollment carries no coverage end date and at least three claim lines stand adjudicated
      on it, the cost share accumulated for the contract year is the member cost share of every claim line standing
      on the enrollment, with the liability backed out by reversals counted as negative
    accumulated_share: Where the enrollment carries no coverage end date and at least three claim lines stand adjudicated
      on it, the cost share accumulated for the contract year is the member cost share of every claim line standing
      on the enrollment, with the liability backed out by reversals counted as negative; where the enrollment carries
      a coverage end date and at least three claim lines stand adjudicated on it, the cost share accumulated for
      the contract year is the member cost share of the claim lines processed in the last three months; and where
      fewer than three claim lines stand adjudicated on the enrollment, the cost share accumulated for the contract
      year is the member cost share of every adjudicated claim line standing on the enrollment.
    moop_headroom: The distance remaining to the maximum out-of-pocket is the maximum out-of-pocket the line is
      capped against less the cost share accumulated for the contract year, and is never less than nothing.
    result: The corrected liability on a claim line is the amount after the deductible taken at the share of it
      the member meets, rounded to the nearest cent once at the end. Where the amount after the deductible taken
      at the share of it the member meets is more than the distance remaining to the maximum out-of-pocket, only
      that distance remaining is charged.
  factors:
  - id: restated_line_selection
    effect: method
    decides: line_allowed
    bindings:
    - denied_count
    - recent_denied_count
    - largest_denied_allowed
    - latest_any_allowed
    - latest_denied_allowed
    - line_allowed
    ladder:
    - when: more than one claim line stands denied on the enrollment and at least one of them was processed in the
        last three months
      method: the plan allowed amount of the line the correction restates is the plan allowed amount of the denied
        line carrying the largest plan allowed amount
    - when: more than one claim line stands denied on the enrollment and none of them was processed in the last
        three months
      method: the plan allowed amount of the line the correction restates is the plan allowed amount of the most
        recently processed claim line standing on the enrollment, denied or not
    - when: one claim line stands denied on the enrollment
      method: the plan allowed amount of the line the correction restates is the plan allowed amount of that line
    baseline:
      line_allowed: latest_denied_allowed
    evidence:
    - history
    cross_difficulty: null
  - id: maximum_out_of_pocket_basis
    effect: parameter
    decides: moop_limit
    bindings:
    - line_network
    - moop_limit
    ladder:
    - when: the line the correction restates is an out-of-network line and the tier held pays for covered out-of-network
        care
      value: the combined in- and out-of-network maximum out-of-pocket of the tier held
    - when: the line the correction restates is an out-of-network line and the tier held pays nothing for covered
        out-of-network care
      value: nothing
    - when: the line the correction restates is an in-network line
      value: the in-network maximum out-of-pocket of the tier held
    baseline:
      moop_limit: P('in_network_moop')
    evidence:
    - history
    cross_difficulty: null
  - id: deductible_application
    effect: method
    decides: deductible_taken
    bindings:
    - allowed_in_network
    - deductible_left
    - deductible_taken
    ladder:
    - when: the line the correction restates is an out-of-network line
      method: no part of the annual medical deductible is taken out of it
    - when: the line the correction restates is an in-network line and the annual medical deductible still unmet
        is more than the plan allowed amount of that line
      method: the whole plan allowed amount of the line is taken for the deductible
    - when: the line the correction restates is an in-network line and the annual medical deductible still unmet
        is no more than the plan allowed amount of that line
      method: the annual medical deductible still unmet is taken out of it
    baseline:
      deductible_taken: MN(deductible_left, line_allowed)
    evidence:
    - history
    cross_difficulty: null
  - id: member_share_rate
    effect: parameter
    decides: share_rate
    bindings:
    - line_category
    - share_rate
    ladder:
    - when: the line the correction restates is an out-of-network line whose benefit category is not one the plan
        always covers at the in-network cost share
      value: the coinsurance the tier fixes for covered out-of-network care
    - when: the line the correction restates is an out-of-network line whose benefit category is one the plan always
        covers at the in-network cost share
      value: the coinsurance the tier fixes for outpatient dialysis
    - when: the line the correction restates is an in-network line
      value: the coinsurance the tier fixes for in-network outpatient surgery
    baseline:
      share_rate: P('outpatient_surgery_coinsurance') / 100
    evidence:
    - history
    cross_difficulty: null
  - id: accumulator_measure
    effect: method
    decides: accumulated_share
    bindings:
    - adjudicated_count
    - accumulated_share
    ladder:
    - when: the enrollment carries no coverage end date and at least three claim lines stand adjudicated on it
      method: the cost share accumulated for the contract year is the member cost share of every claim line standing
        on the enrollment, with the liability backed out by reversals counted as negative
    - when: the enrollment carries a coverage end date and at least three claim lines stand adjudicated on it
      method: the cost share accumulated for the contract year is the member cost share of the claim lines processed
        in the last three months
    - when: fewer than three claim lines stand adjudicated on the enrollment
      method: the cost share accumulated for the contract year is the member cost share of every adjudicated claim
        line standing on the enrollment
    baseline:
      accumulated_share: SUM('advantage_medical_claims', 'member_cost_share', event_type='advantage_claim_adjudication')
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: The corrected liability on a claim line is what the member owes once the plan restates a line it has already
      adjudicated, and it is fixed this way on a line whose benefit category the tier held prices by a coinsurance;
      a line whose benefit category the tier held prices by a copay is outside this rule and is restated on the
      copay basis the plan's cost-share rules already fix for it. The corrected liability on a claim line is the
      amount after the deductible taken at the share of it the member meets, rounded to the nearest cent once at
      the end. Where the amount after the deductible taken at the share of it the member meets is more than the
      distance remaining to the maximum out-of-pocket, only that distance remaining is charged. The amount after
      the deductible is the plan allowed amount of the line the correction restates less the deductible taken out
      of that line, and is never less than nothing. The plan allowed amount of the line the correction restates
      is the plan allowed amount of the most recently processed claim line standing denied on the enrollment. The
      deductible taken out of that line is the annual medical deductible still unmet, or the plan allowed amount
      of the line where that is smaller. The annual medical deductible still unmet is the annual medical deductible
      of the tier held less the plan allowed amount of the in-network claim lines already adjudicated on the enrollment,
      and is never less than nothing. The share of the amount after the deductible the member meets is the coinsurance
      the tier fixes for in-network outpatient surgery. The distance remaining to the maximum out-of-pocket is the
      maximum out-of-pocket the line is capped against less the cost share accumulated for the contract year, and
      is never less than nothing. The maximum out-of-pocket the line is capped against is the in-network maximum
      out-of-pocket of the tier held. The cost share accumulated for the contract year is the member cost share
      of every adjudicated claim line standing on the enrollment. The corrected line carries the reference of the
      line it replaces and the coverage request that authorised the service, and amounts the member pays for services
      the plan does not cover at all never count toward the maximum out-of-pocket.
    params:
    - annual_medical_deductible
    - outpatient_surgery_coinsurance
    - in_network_moop
  inputs:
    history:
    - table: advantage_medical_claims
      aggregate: sum
      field: member_cost_share
      within_months: 12
      filters:
        event_type: advantage_claim_adjudication
    - table: advantage_medical_claims
      aggregate: sum
      field: plan_allowed_amount
      within_months: 12
      filters:
        network_status: in_network
    - table: advantage_medical_claims
      aggregate: max
      field: plan_allowed_amount
      within_months: 12
      filters:
        claim_status: denied
    cross_category: []
