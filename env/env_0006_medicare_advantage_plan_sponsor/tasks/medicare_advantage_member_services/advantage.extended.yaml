      action_bindings:
        advantage_service_requests.advantage_service_request_id: advantage_service_request_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the date the plan received the request
      anchor_source: advantage_service_requests.received_date
      relation: not_after
      duration_source: variants.prior_auth_standard_decision_days
      unit: calendar_days
      counting_rule: Calendar days are counted from the day after that receipt date and every day of the week counts,
        expedited hours are counted as full 24-hour periods from the recorded receipt time, a decision issued exactly
        on the deadline is in time, and the two units are never mixed.
      boundary: inclusive
  params:
