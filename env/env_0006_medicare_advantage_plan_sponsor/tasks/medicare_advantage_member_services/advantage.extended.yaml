- id: advantage_claim_cost_share
  subject:
  - advantage_claim_adjudication
  rule: 'Member cost share on an adjudicated line is taken from the plan allowed amount for the line''s benefit
    category at the tier held, never from the amount the provider billed. The enrollment is in a status of active
    or premium_grace_period on the date of service of the line. Where the category''s cost share is a copay the
    member owes the copay or the plan allowed amount, whichever is lower; where it is a coinsurance the member owes
    that percentage of the plan allowed amount, rounded to the nearest cent. Any medical deductible the tier carries
    is met first out of the plan allowed amount of in-network lines in the order they were processed, before any
    copay or coinsurance applies. Cost share stops at the tier''s in-network maximum out-of-pocket: once the member''s
    accumulated cost share for the contract year has reached it every further covered in-network line is adjudicated
    at zero member liability, and a line that would cross it is charged only up to the distance remaining. The emergency
    department copay is waived where the visit leads to an inpatient admission within one day, and the inpatient
    per-day copay applies instead. An out-of-network line on a plan whose out-of-network coinsurance is one hundred
    per cent is denied with the reason out_of_network_no_coverage, except for emergency, urgently needed and renal
    dialysis services, which are always covered at the in-network cost share. Where the member''s Medicaid status
    gives them cost-share protection on a tier that carries it, the member owes nothing on the line and the cost
    share is billed to the state instead. An authorisation reference issued before the date of service is on record
    for every line whose benefit category the tier lists as needing prior authorisation. A line rendered without
    that authorisation is denied with the reason no_prior_authorization, and the denial notice carries the member''s
    appeal rights. Amounts the member pays for services the plan does not cover at all never count toward the maximum
    out-of-pocket, and the member is told so when they ask why their accumulator has not moved.'
