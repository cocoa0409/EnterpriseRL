      action_bindings:
        advantage_premium_ledger.advantage_premium_entry_id: advantage_premium_entry_id
    dedup_contract:
      table: advantage_premium_ledger
      mode: separate_record
      object_bindings:
        remittance_reference: remittance_reference
        advantage_enrollment_id: advantage_enrollment_id
      duplicate_filters:
        event_type:
        - advantage_premium_payment
      distinct_fields:
