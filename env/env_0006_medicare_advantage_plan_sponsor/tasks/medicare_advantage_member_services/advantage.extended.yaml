    posting_order_basis: oldest unpaid billing_period first
- id: advantage_premium_delinquency
  subject:
  - advantage_grace_period_start
  - advantage_grace_period_cure
  - advantage_nonpayment_termination
  rule: 'A monthly premium charge still unpaid after its due day puts the enrollment into the premium grace period,
    and the member is sent a delinquency notice naming the amount owed and the last day of that grace period. The
    grace period runs for the number of calendar days the tier held fixes, counted from the day the plan posted
    the first unpaid monthly premium charge. The plan has not received the full outstanding premium by the last
    day of the grace period counted from the day the plan posted the first unpaid monthly premium charge. Calendar
    days are counted from the day after that posting date, every day of the week counts including weekends and public
    holidays, the last day of the grace period is itself still inside the grace period, and full 24-hour periods
    are never used in place of calendar days. Where the full outstanding premium reaches the plan at any time before
    that day ends, the enrollment returns to active with no break in coverage and keeps its original coverage effective
    date. A partial payment does not cure the delinquency however small the remainder, and it never restarts the
    clock: the grace period keeps running on the original posting date. Termination for non-payment ends coverage
    on the last day of the month in which the grace period expired, and the disenrollment reason recorded is nonpayment_of_premium.
    While the enrollment is in the grace period the member keeps full coverage and claims are adjudicated normally;
    the plan never withholds care during the grace period.'
  eligibility:
  - id: grace_period_exhausted
    applies_to:
    - advantage_nonpayment_termination
    kind: time
    condition: The plan has not received the full outstanding premium by the last day of the grace period counted
      from the day the plan posted the first unpaid monthly premium charge.
    evidence_fields:
    - advantage_premium_ledger.advantage_premium_entry_id
    - advantage_premium_ledger.posted_date
    - advantage_enrollments.advantage_enrollment_id
    - advantage_enrollments.premium_balance_due
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - advantage_enrollments.advantage_enrollment_id
        - advantage_premium_ledger.advantage_premium_entry_id
      action_bindings:
        advantage_enrollments.advantage_enrollment_id: advantage_enrollment_id
        advantage_premium_ledger.advantage_premium_entry_id: advantage_premium_entry_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the day the plan posted the first unpaid monthly premium charge
      anchor_source: advantage_premium_ledger.posted_date
      relation: not_before
      duration_source: variants.premium_grace_period_days
      unit: calendar_days
      counting_rule: Calendar days are counted from the day after that posting date, every day of the week counts
        including weekends and public holidays, the last day of the grace period is itself still inside the grace
        period, and full 24-hour periods are never used in place of calendar days.
      boundary: inclusive
  params:
    per_tier:
      Ridgecrest Advantage Value (HMO):
        premium_grace_period_days: =premium_grace_period_days
        premium_due_day_of_month: =premium_due_day_of_month
      Ridgecrest Advantage Essential (HMO):
        premium_grace_period_days: =premium_grace_period_days
        premium_due_day_of_month: =premium_due_day_of_month
      Ridgecrest Advantage Plus (HMO-POS):
        premium_grace_period_days: =premium_grace_period_days
        premium_due_day_of_month: =premium_due_day_of_month
      Ridgecrest Advantage Premier (PPO):
        premium_grace_period_days: =premium_grace_period_days
        premium_due_day_of_month: =premium_due_day_of_month
      Ridgecrest Advantage Signature (PPO):
        premium_grace_period_days: =premium_grace_period_days
        premium_due_day_of_month: =premium_due_day_of_month
      Ridgecrest Advantage Elite Choice (PPO):
        premium_grace_period_days: =premium_grace_period_days
        premium_due_day_of_month: =premium_due_day_of_month
  measures:
  - advantage_msr_unpaid_premium_months
- id: advantage_reinstatement_for_good_cause
  subject:
  - advantage_reinstatement
  rule: 'A member whose coverage was terminated for non-payment may ask to be reinstated where the failure to pay
    was caused by circumstances beyond their control. The member asks for reinstatement no later than the last day
    of the reinstatement window counted from the coverage end date recorded on the terminated enrollment. Calendar
    days are counted from the day after that coverage end date, every day of the week counts, a request made on
    the final day of the window is still in time, and full 24-hour periods are never used in place of calendar days.
    A good-cause determination for this enrollment is recorded on the enrollment intake by the plan''s reinstatement
    reviewer before the reinstatement is processed. Reinstatement restores the original coverage effective date
    with no gap, and the member must pay every premium owed for the months the coverage is restored for. The member''s
    own account of why they could not pay is taken as the explanation but never as the determination: without the
    reviewer''s recorded decision the reinstatement is refused, and a refused member is told which election period
    is next open to them. Reinstatement is granted once for any one terminated enrollment; a second request on the
    same enrollment is refused whatever the reason given.'
  eligibility:
  - id: reinstatement_window_open
    applies_to:
    - advantage_reinstatement
    kind: time
    condition: The member asks for reinstatement no later than the last day of the reinstatement window counted
      from the coverage end date recorded on the terminated enrollment.
    evidence_fields:
