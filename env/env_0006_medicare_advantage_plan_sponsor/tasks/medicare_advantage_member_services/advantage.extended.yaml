        prior_auth_standard_decision_days: =prior_auth_standard_decision_days
        prior_auth_expedited_decision_hours: =prior_auth_expedited_decision_hours
        prior_auth_extension_days: =prior_auth_extension_days
        reconsideration_standard_decision_days: =reconsideration_standard_decision_days
        reconsideration_expedited_decision_hours: =reconsideration_expedited_decision_hours
        prior_authorization_required_categories: =prior_authorization_required_categories
      Ridgecrest Advantage Essential (HMO):
        prior_auth_standard_decision_days: =prior_auth_standard_decision_days
        prior_auth_expedited_decision_hours: =prior_auth_expedited_decision_hours
        prior_auth_extension_days: =prior_auth_extension_days
        reconsideration_standard_decision_days: =reconsideration_standard_decision_days
        reconsideration_expedited_decision_hours: =reconsideration_expedited_decision_hours
        prior_authorization_required_categories: =prior_authorization_required_categories
      Ridgecrest Advantage Plus (HMO-POS):
        prior_auth_standard_decision_days: =prior_auth_standard_decision_days
        prior_auth_expedited_decision_hours: =prior_auth_expedited_decision_hours
