- id: advantage_claim_reversal_and_reprocessing
  subject:
  - advantage_claim_reversal
  rule: 'A claim line already adjudicated is corrected by reversing that exact line and posting a corrected line
    in its place; the plan never edits an adjudicated line where the member''s liability changes. The reversal names
    the single originally adjudicated claim line it applies to, and that line is on record with a claim status of
    paid, denied or adjusted. No reversal of that same originally adjudicated claim line is already on record. The
    reversal carries the negative of the member cost share the original line posted, so that the year-to-date accumulator
    returns to what it was before that line. Where the correction follows a favourable reconsideration the corrected
    line is adjudicated at the cost share the decision directs, and any amount the member has already paid the provider
    above that figure is refunded to the member. A reversal of a line the member owed nothing on is still posted,
    at zero, so that the claim history shows plainly what the plan did. A whole claim is never reversed as one:
    each line is reversed on its own reference, because a claim number can cover several services with different
    outcomes.'
  eligibility:
  - id: original_line_on_record
    applies_to:
    - advantage_claim_reversal
    kind: state
    condition: The reversal names the single originally adjudicated claim line it applies to, and that line is on
      record with a claim status of paid, denied or adjusted.
    evidence_fields:
    - advantage_medical_claims.advantage_claim_id
    - advantage_medical_claims.source_claim_id
    - advantage_medical_claims.claim_status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - advantage_medical_claims.source_claim_id
      action_bindings:
        advantage_medical_claims.source_claim_id: source_claim_id
    state_contract:
      field: advantage_medical_claims.claim_status
      allowed:
      - paid
      - denied
      - adjusted
  - id: reversal_not_already_posted
    applies_to:
    - advantage_claim_reversal
    kind: dedup
    condition: No reversal of that same originally adjudicated claim line is already on record.
    evidence_fields:
    - advantage_medical_claims.advantage_claim_id
    - advantage_medical_claims.source_claim_id
    - advantage_medical_claims.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - advantage_medical_claims.source_claim_id
      action_bindings:
        advantage_medical_claims.source_claim_id: source_claim_id
    dedup_contract:
      table: advantage_medical_claims
      mode: separate_record
      object_bindings:
        source_claim_id: source_claim_id
      duplicate_filters:
        event_type:
        - advantage_claim_reversal
      distinct_fields:
      - processed_date
  params:
    per_tier:
      Ridgecrest Advantage Value (HMO):
        timely_filing_days: =timely_filing_days
      Ridgecrest Advantage Essential (HMO):
        timely_filing_days: =timely_filing_days
      Ridgecrest Advantage Plus (HMO-POS):
        timely_filing_days: =timely_filing_days
      Ridgecrest Advantage Premier (PPO):
        timely_filing_days: =timely_filing_days
      Ridgecrest Advantage Signature (PPO):
        timely_filing_days: =timely_filing_days
      Ridgecrest Advantage Elite Choice (PPO):
        timely_filing_days: =timely_filing_days
- id: advantage_appeal_rights
  subject:
  - advantage_appeal_filing
  rule: A member, or someone they have appointed in writing, may ask the plan to reconsider an adverse organisation
    determination or a denied claim line. The plan receives the reconsideration no later than the last day of the
    filing window counted from the date the plan mailed the adverse determination notice. Calendar days are counted
    from the day after that notice date, every day of the week counts, a reconsideration received on the final day
    of the window is in time, and full 24-hour periods are never used in place of calendar days. Where someone other
    than the member is filing, a valid appointment of representative form is on file, or the appointment is not
    required because the filer is the member's treating provider asking for an expedited reconsideration. A reconsideration
    received after that day is accepted only where the member shows good cause and then only inside the tier's good-cause
    extension; otherwise it is dismissed with the rationale filed_after_window and the member is told why. A reconsideration
    is expedited where applying the standard deadline could seriously jeopardise the member's life, health or ability
    to regain maximum function, and a treating provider's request for expedition is always granted. The reconsideration
    names the single determination or claim line it is filed against; one that names none is not dismissed but held
    while the plan asks the member which decision they mean. Where the plan upholds its adverse decision in whole
    or in part the case goes to the independent review entity automatically, and the decision letter tells the member
    so. A grievance about how the member was treated is not an appeal and never restarts an appeal window; the two
    are recorded separately and answered separately.
  eligibility:
  - id: filing_window_open
    applies_to:
    - advantage_appeal_filing
    kind: time
    condition: The plan receives the reconsideration no later than the last day of the filing window counted from
      the date the plan mailed the adverse determination notice.
    evidence_fields:
    - advantage_service_requests.advantage_service_request_id
    - advantage_service_requests.source_service_request_id
    - advantage_service_requests.decision_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - advantage_service_requests.source_service_request_id
      action_bindings:
        advantage_service_requests.source_service_request_id: source_service_request_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the date the plan mailed the adverse determination notice
      anchor_source: advantage_service_requests.decision_date
      relation: not_after
      duration_source: variants.appeal_filing_window_days
      unit: calendar_days
      counting_rule: Calendar days are counted from the day after that notice date, every day of the week counts,
        a reconsideration received on the final day of the window is in time, and full 24-hour periods are never
        used in place of calendar days.
      boundary: inclusive
  - id: representative_appointment_on_file
    applies_to:
    - advantage_appeal_filing
    kind: state
    condition: Where someone other than the member is filing, a valid appointment of representative form is on file,
      or the appointment is not required because the filer is the member's treating provider asking for an expedited
      reconsideration.
    evidence_fields:
    - advantage_service_requests.advantage_service_request_id
    - advantage_service_requests.representative_form_on_file
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - advantage_service_requests.advantage_service_request_id
      action_bindings:
        advantage_service_requests.advantage_service_request_id: advantage_service_request_id
    state_contract:
      field: advantage_service_requests.representative_form_on_file
      allowed:
      - not_required
      - cms1696_on_file
  params:
    per_tier:
      Ridgecrest Advantage Value (HMO):
        appeal_filing_window_days: =appeal_filing_window_days
        good_cause_extension_days: =good_cause_extension_days
        reconsideration_standard_decision_days: =reconsideration_standard_decision_days
      Ridgecrest Advantage Essential (HMO):
        appeal_filing_window_days: =appeal_filing_window_days
        good_cause_extension_days: =good_cause_extension_days
        reconsideration_standard_decision_days: =reconsideration_standard_decision_days
      Ridgecrest Advantage Plus (HMO-POS):
        appeal_filing_window_days: =appeal_filing_window_days
        good_cause_extension_days: =good_cause_extension_days
        reconsideration_standard_decision_days: =reconsideration_standard_decision_days
      Ridgecrest Advantage Premier (PPO):
        appeal_filing_window_days: =appeal_filing_window_days
        good_cause_extension_days: =good_cause_extension_days
        reconsideration_standard_decision_days: =reconsideration_standard_decision_days
      Ridgecrest Advantage Signature (PPO):
