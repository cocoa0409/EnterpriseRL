- id: medigap_premium_rating
  subject:
  - medigap_premium_charge
  rule: 'The premium is built from the tier''s base monthly premium for a standard policyholder issued at 65, adjusted
    for the rating method the tier uses, the policyholder''s rating class and area, and then reduced by whichever
    discounts they qualify for. On an issue-age tier the base premium rises by the issue-age step for each year
    of age above 65 at issue and never rises again with age; on an attained-age tier it rises by the attained-age
    increase at each policy anniversary. The tobacco factor and the area factor multiply the base premium before
    any discount is taken, and the annual policy fee is added afterwards and is never discounted. The household
    discount and the annual payment discount stack: both are taken, one after the other, on the premium after the
    rating factors and before the policy fee. An across-the-board rate increase is applied in the tier''s annual
    rate review month and only after the policyholder has had the tier''s notice days of written warning; a rate
    increase is never applied retrospectively to a period already billed. Each rate component is posted as its own
    ledger entry, so that a policyholder asking why their bill changed can be shown the base premium, the increase
    and the fee separately rather than one figure.'
