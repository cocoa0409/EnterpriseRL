  params: {}
  rule: 'Money the supplement paid on a day the policy did not cover is recovered from whoever received it, and
    where that money reached the policyholder herself it is she who sends it back. What she is asked to send back
    is what the supplement overpaid on the lines that fall outside cover, less what has been recovered from anyone
    else on them and less the balance those lines record standing to her credit, and it is never more than what
    reached her. What the policyholder is asked to send back is fixed only after the claim record carries the entry
    taking back what the supplement paid on the lines that fall outside cover and reached someone other than her.
    The standard method treats nothing as having reached the policyholder. Where lines outside cover were submitted
    by the policyholder herself, what reached her is what the supplement paid on those lines. Where no line outside
    cover was submitted by her but lines outside cover record her owing nothing at all, what reached her is what
    the supplement paid on those lines, she having already settled with the provider. The overpayment on those lines
    is then measured. The standard method finds nothing overpaid. Where the lines fall on days this policy did not
    cover, the whole of what the supplement paid on every line outside cover is overpaid, none of it having been
    owed. Where the lines fall on days the policy covered but carry a share the plan letter does not support, only
    the part of those payments above the share the plan letter supports on the amounts Medicare approved is overpaid.
    What has already come back from others is then set against it. The standard method sets nothing against it.
    Where entries stand taking back what the supplement paid to someone other than the policyholder on those lines,
    the amounts those entries take back are set against it. Where no such entry stands and entries stand recording
    money already returned by the policyholder on those lines, the amounts they record are set against it. The balance
    those lines record standing to the policyholder''s credit is set against it as well. The standard method credits
    her with nothing. Where the lines she submitted record her owing a balance and those days were not covered by
    this policy, the whole of that recorded balance is set against what she sends back. Where the plan letter''s
    own cost sharing would have left her a balance on those days, only the part of the recorded balance above what
    the plan letter would have left is set against it. What is asked of her is the overpayment less what has come
    back from others and less the balance credited to her, rounded to the cent once at the end, never more than
    what reached her and never less than nothing.

    '
