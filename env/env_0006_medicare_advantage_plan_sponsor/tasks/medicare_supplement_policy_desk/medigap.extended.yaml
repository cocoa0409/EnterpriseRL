  params: {}
  rule: 'A Medicare Supplement policy pays nothing for any day on which a Medicare Advantage enrollment of the same
    member is still in force, so supplement premium charged for such a month buys the policyholder nothing and is
    returned to them as a correction of the rate charged. The return is worked out from the entries standing on
    the policy''s premium account for the span in which the supplement took effect, never from the rate table, because
    what is given back is what was taken. The months returned are the months of that opening span on which the two
    coverages ran together. The standard method counts no month as run together: premium is owed from the day the
    supplement took effect. Where the other Medicare coverage ended in the same calendar month in which the supplement
    took effect and premium has been charged since the supplement took effect, the month in which the other coverage
    ended is counted. Where the other Medicare coverage ended in a later calendar month than the one in which the
    supplement took effect and premium has been charged since the supplement took effect, the months counted run
    from the month the supplement took effect up to but not including the month in which the other coverage ended.
    Each month counted is returned at the value of a month of the opening span. The standard method values a month
    at the amount posted for the opening span, taken in full. Where the charge posted for the opening span covers
    more than one month of cover, a month is valued at the amount posted for that charge divided by the months of
    cover it pays for, rounded to the cent. Where no charge stands for the opening span but premium has been charged
    since the supplement took effect, a month is valued at the premium charged since the supplement took effect
    divided by the months the policy has been in force. Alongside the premium itself the plan returns the other
    rate components posted for the opening span, month by month. The standard method returns the premium alone and
    adds nothing for any other rate component. Where an entry carrying the policy fee stands for the opening span,
    the share of that fee falling on each month returned, being the annual fee spread over the twelve months of
    the policy year, is returned with the premium for that month. Where no entry carrying the policy fee stands
    for the opening span and an entry carrying an annual rate increase stands for it, the share of that increase
    falling on each month returned, being the increase posted for the span spread over the months of cover the span
