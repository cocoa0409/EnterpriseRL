- id: medigap_ext_crossover_benefit_settlement
  base_policy_refs:
  - medigap_benefit_payment
  overwrite:
  - base_policy: medigap_benefit_payment
    superseded_clause: On a high-deductible plan letter the supplement pays nothing until the policyholder's own
      payments for the calendar year reach the high deductible, and from that point it pays as the standard plan
      letter would.
    replaced_by: On a high-deductible plan letter the supplement pays nothing until the liability the policyholder's
      paid lines record over the twelve months to date reaches the tier's high deductible, and from that point it
      pays as the plan letter otherwise would.
  trigger: state_due
  subject:
  - medigap_claim_crossover_processed
  computes: supplement_payment_amount
  target_tool: settle_crossover_benefit_9f3dc765
  params: {}
  rule: 'A crossover line waiting on the supplement is settled by paying the share of the Medicare cost sharing
    the plan letter covers, worked out from the amount Medicare approved and from what the line records the policyholder
    owing, and never from what the provider billed. What the supplement pays on a line waiting on it is fixed only
    after the claim record carries the entry recording the money the policyholder has sent back on the lines the
    supplement paid her for days the policy did not cover. The line settled is first identified. The standard method
    settles the line most recently rendered and works the payment out from its figures. Where more than one line
    stands waiting on the supplement and Medicare''s determination is recorded on only one of them, that determined
    line is the one settled. Where more than one line stands waiting and each carries Medicare''s determination,
    the liabilities those lines record are taken together and settled as one. The amount the share is taken on is
    then fixed. The standard method takes the whole amount recorded as approved. Where the line records the policyholder
    owing more than the amount recorded as approved and the plan letter pays charges above the Medicare approved
    amount, the amount the line records the policyholder owing is taken. Where the line records the policyholder
    owing no more than the amount recorded as approved and Medicare has paid part of it, the amount approved less
    what Medicare paid is taken. The share the plan letter covers is then selected. The standard method takes the
    tier''s share of the Part B coinsurance. Where a line waiting on the supplement falls under foreign travel emergency
    care, the tier''s foreign travel coinsurance is taken. Where a line waiting on the supplement falls under skilled
    nursing facility care, the tier''s share of the skilled nursing coinsurance is taken. A yearly deductible is
    taken from that amount before the share is worked out. The standard method takes no yearly deductible, the benefit
    carrying none. Where a line waiting on the supplement falls under foreign travel emergency care and no such
    line has been paid since the policy took effect, the tier''s foreign travel emergency deductible is taken in
    full. Where a line waiting on the supplement falls under foreign travel emergency care and such lines have been
    paid since the policy took effect, only what remains of that deductible after the liability those lines record
    is taken, and never less than nothing. On a high-deductible plan letter the supplement pays nothing until the
    liability the policyholder''s paid lines record over the twelve months to date reaches the tier''s high deductible,
    and from that point it pays as the plan letter otherwise would. What counts toward that deductible is measured
    from the claim record. The standard method counts the liability the paid lines of the twelve months to date
    record. Where entries stand both restating lines of those months and recording money recovered from the policyholder
    on them, what counts is that liability less what all those entries take back. Where entries stand restating
    lines of those months and none records money recovered from the policyholder, what counts is that liability
    less what the restatements take back. Foreign travel emergency care is paid only up to the tier''s lifetime
    maximum, what has already been paid on that benefit over the life of the policy being counted against it. The
    amount approved less the yearly deductible is taken at the share the plan letter covers, what remains of the
    high deductible is taken from that share, the figure is rounded to the cent once at the end, it is never more
    than what remains of the lifetime maximum, and where what remains of the high deductible exceeds the share nothing
    is paid and the whole of it stands to the policyholder.

    '
  prerequisite:
  - problem: medigap_ext_uncovered_day_direct_repayment
    kind: value_input
    gate: counted_toward_deductible
    form: state
    policy_source: What the supplement pays on a line waiting on it is fixed only after the claim record carries
      the entry recording the money the policyholder has sent back on the lines the supplement paid her for days
      the policy did not cover.
    condition: the claim record carries an entry recording money recovered from the policyholder on the lines the
      supplement paid her for days the policy did not cover
    resolved_by: repay_direct_benefit_f162ba18
    effect: once that entry stands on the claim record the settlement's counted_toward_deductible binding falls
      by the liability it credits, so that more of the high deductible remains and the supplement pays less on the
      line it settles
  cross_category: []
  compute:
  - months_since_effective: MONTHS(F('policy_effective_date'), NOW)
  - pending_line_count: COUNT('medigap_claim_crossovers', date_field='date_of_service', claim_status='pending_medicare')
  - latest_pending_approved: LATEST('medigap_claim_crossovers','medicare_approved_amount', date_field='date_of_service',
      claim_status='pending_medicare')
  - latest_pending_owing: LATEST('medigap_claim_crossovers','member_responsibility', date_field='date_of_service',
      claim_status='pending_medicare')
  - largest_pending_owing: MAX('medigap_claim_crossovers','member_responsibility', claim_status='pending_medicare')
  - total_pending_owing: SUM('medigap_claim_crossovers','member_responsibility', date_field='date_of_service', claim_status='pending_medicare')
  - settled_line_owing: largest_pending_owing if (pending_line_count > 1 and latest_pending_approved <= 0) else
      (total_pending_owing if (pending_line_count > 1 and latest_pending_approved > 0) else latest_pending_owing)
  - largest_pending_approved: MAX('medigap_claim_crossovers','medicare_approved_amount', claim_status='pending_medicare')
  - largest_pending_medicare_paid: MAX('medigap_claim_crossovers','medicare_paid_amount', claim_status='pending_medicare')
  - cost_share_base: settled_line_owing if (settled_line_owing > largest_pending_approved and P('part_b_excess_charges_covered'))
      else (RND(largest_pending_approved - largest_pending_medicare_paid, 2) if (settled_line_owing <= largest_pending_approved
      and largest_pending_medicare_paid > 0) else largest_pending_approved)
  - foreign_pending_lines: COUNT('medigap_claim_crossovers', date_field='date_of_service', claim_status='pending_medicare',
      benefit_category='foreign_travel_emergency')
  - skilled_pending_lines: COUNT('medigap_claim_crossovers', date_field='date_of_service', claim_status='pending_medicare',
      benefit_category='skilled_nursing_coinsurance')
  - benefit_coverage_share: P('foreign_travel_emergency_coinsurance_percent') if foreign_pending_lines > 0 else
      (P('skilled_nursing_coinsurance_percent') if skilled_pending_lines > 0 else P('part_b_coinsurance_coverage_percent'))
  - foreign_paid_lines_since_start: COUNT('medigap_claim_crossovers', within_months=months_since_effective + 1,
      date_field='date_of_service', event_type='medigap_claim_crossover_processed', claim_status='paid', benefit_category='foreign_travel_emergency')
  - foreign_paid_liability_since_start: SUM('medigap_claim_crossovers','member_responsibility', within_months=months_since_effective
      + 1, date_field='date_of_service', event_type='medigap_claim_crossover_processed', claim_status='paid', benefit_category='foreign_travel_emergency')
  - yearly_travel_deductible: P('foreign_travel_emergency_deductible') if (foreign_pending_lines > 0 and foreign_paid_lines_since_start
      <= 0) else (MX(0.0, P('foreign_travel_emergency_deductible') - foreign_paid_liability_since_start) if (foreign_pending_lines
      > 0 and foreign_paid_lines_since_start > 0) else 0.0)
  - paid_liability_recent: SUM('medigap_claim_crossovers','member_responsibility', within_months=12, date_field='date_of_service',
      event_type='medigap_claim_crossover_processed', claim_status='paid')
  - restatement_takeback: SUM('medigap_claim_crossovers','member_responsibility', within_months=12, date_field='processed_date',
      event_type='medigap_claim_adjustment', claim_status='adjusted')
  - recovery_takeback: SUM('medigap_claim_crossovers','member_responsibility', within_months=12, date_field='processed_date',
      event_type='medigap_claim_adjustment', claim_status='recovered')
  - counted_toward_deductible: RND(paid_liability_recent - restatement_takeback - recovery_takeback, 2) if (restatement_takeback
      > 0 and recovery_takeback > 0) else (RND(paid_liability_recent - restatement_takeback, 2) if restatement_takeback
      > 0 else paid_liability_recent)
  - deductible_remaining: MX(0.0, RND(P('high_deductible_amount') - counted_toward_deductible, 2))
  - foreign_lifetime_paid: SUM('medigap_claim_crossovers','supplement_paid_amount', date_field='date_of_service',
      event_type='medigap_claim_crossover_processed', claim_status='paid', benefit_category='foreign_travel_emergency')
  - lifetime_room: MX(0.0, RND(P('foreign_travel_lifetime_maximum') - foreign_lifetime_paid, 2))
  - share_due: RND((cost_share_base - yearly_travel_deductible) * benefit_coverage_share / 100, 2)
  - result: MX(0.0, MN(RND(share_due - deductible_remaining, 2), lifetime_room))
  compute_basis:
    months_since_effective: Where a line waiting on the supplement falls under foreign travel emergency care and
      no such line has been paid since the policy took effect, the tier's foreign travel emergency deductible is
      taken in full.
    pending_line_count: Where more than one line stands waiting on the supplement and Medicare's determination is
      recorded on only one of them, that determined line is the one settled.
    latest_pending_approved: Where more than one line stands waiting and each carries Medicare's determination,
      the liabilities those lines record are taken together and settled as one.
    latest_pending_owing: The standard method settles the line most recently rendered and works the payment out
      from its figures.
    largest_pending_owing: Where more than one line stands waiting on the supplement and Medicare's determination
      is recorded on only one of them, that determined line is the one settled.
    total_pending_owing: Where more than one line stands waiting and each carries Medicare's determination, the
      liabilities those lines record are taken together and settled as one.
    settled_line_owing: The standard method settles the line most recently rendered and works the payment out from
      its figures. Where more than one line stands waiting on the supplement and Medicare's determination is recorded
      on only one of them, that determined line is the one settled. Where more than one line stands waiting and
      each carries Medicare's determination, the liabilities those lines record are taken together and settled as
      one.
    largest_pending_approved: The standard method takes the whole amount recorded as approved.
    largest_pending_medicare_paid: Where the line records the policyholder owing no more than the amount recorded
      as approved and Medicare has paid part of it, the amount approved less what Medicare paid is taken.
    cost_share_base: The standard method takes the whole amount recorded as approved. Where the line records the
      policyholder owing more than the amount recorded as approved and the plan letter pays charges above the Medicare
      approved amount, the amount the line records the policyholder owing is taken. Where the line records the policyholder
      owing no more than the amount recorded as approved and Medicare has paid part of it, the amount approved less
      what Medicare paid is taken.
    foreign_pending_lines: Where a line waiting on the supplement falls under foreign travel emergency care, the
      tier's foreign travel coinsurance is taken.
    skilled_pending_lines: Where a line waiting on the supplement falls under skilled nursing facility care, the
      tier's share of the skilled nursing coinsurance is taken.
    benefit_coverage_share: The standard method takes the tier's share of the Part B coinsurance. Where a line waiting
      on the supplement falls under foreign travel emergency care, the tier's foreign travel coinsurance is taken.
      Where a line waiting on the supplement falls under skilled nursing facility care, the tier's share of the
      skilled nursing coinsurance is taken.
    foreign_paid_lines_since_start: Where a line waiting on the supplement falls under foreign travel emergency
      care and no such line has been paid since the policy took effect, the tier's foreign travel emergency deductible
      is taken in full.
    foreign_paid_liability_since_start: Where a line waiting on the supplement falls under foreign travel emergency
      care and such lines have been paid since the policy took effect, only what remains of that deductible after
      the liability those lines record is taken, and never less than nothing.
    yearly_travel_deductible: The standard method takes no yearly deductible, the benefit carrying none. Where a
      line waiting on the supplement falls under foreign travel emergency care and no such line has been paid since
      the policy took effect, the tier's foreign travel emergency deductible is taken in full. Where a line waiting
      on the supplement falls under foreign travel emergency care and such lines have been paid since the policy
      took effect, only what remains of that deductible after the liability those lines record is taken, and never
      less than nothing.
    paid_liability_recent: The standard method counts the liability the paid lines of the twelve months to date
      record.
    restatement_takeback: Where entries stand restating lines of those months and none records money recovered from
      the policyholder, what counts is that liability less what the restatements take back.
    recovery_takeback: Where entries stand both restating lines of those months and recording money recovered from
      the policyholder on them, what counts is that liability less what all those entries take back.
    counted_toward_deductible: The standard method counts the liability the paid lines of the twelve months to date
      record. Where entries stand both restating lines of those months and recording money recovered from the policyholder
      on them, what counts is that liability less what all those entries take back. Where entries stand restating
      lines of those months and none records money recovered from the policyholder, what counts is that liability
      less what the restatements take back.
    deductible_remaining: On a high-deductible plan letter the supplement pays nothing until the liability the policyholder's
      paid lines record over the twelve months to date reaches the tier's high deductible, and from that point it
      pays as the plan letter otherwise would.
    foreign_lifetime_paid: Foreign travel emergency care is paid only up to the tier's lifetime maximum, what has
      already been paid on that benefit over the life of the policy being counted against it.
    lifetime_room: Foreign travel emergency care is paid only up to the tier's lifetime maximum, what has already
      been paid on that benefit over the life of the policy being counted against it.
    share_due: The amount approved less the yearly deductible is taken at the share the plan letter covers, what
      remains of the high deductible is taken from that share, the figure is rounded to the cent once at the end,
      it is never more than what remains of the lifetime maximum, and where what remains of the high deductible
      exceeds the share nothing is paid and the whole of it stands to the policyholder.
    result: The amount approved less the yearly deductible is taken at the share the plan letter covers, what remains
      of the high deductible is taken from that share, the figure is rounded to the cent once at the end, it is
      never more than what remains of the lifetime maximum, and where what remains of the high deductible exceeds
      the share nothing is paid and the whole of it stands to the policyholder.
  factors:
  - id: settled_line_selection
    effect: method
    decides: settled_line_owing
    bindings:
    - pending_line_count
    - latest_pending_approved
    - latest_pending_owing
    - largest_pending_owing
    - total_pending_owing
    - settled_line_owing
    ladder:
    - when: more than one line stands waiting on the supplement and Medicare's determination is recorded on only
        one of them
      method: the determined line is the one settled and its recorded liability is the figure taken
    - when: more than one line stands waiting and each carries Medicare's determination
      method: the liabilities those lines record are taken together and settled as one
    - when: otherwise
      method: the line most recently rendered is settled and its recorded liability is the figure taken
    baseline:
      settled_line_owing: latest_pending_owing
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: settlement_base
    effect: parameter
    decides: cost_share_base
    bindings:
    - largest_pending_approved
    - largest_pending_medicare_paid
    - cost_share_base
    ladder:
    - when: the line records the policyholder owing more than the amount recorded as approved and the plan letter
        pays charges above the Medicare approved amount
      value: the amount the line records the policyholder owing
    - when: the line records the policyholder owing no more than the amount recorded as approved and Medicare has
        paid part of it
      value: the amount approved less what Medicare paid
    - when: otherwise
      value: the whole amount recorded as approved
    baseline:
      cost_share_base: largest_pending_approved
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: covered_benefit_share
    effect: parameter
    decides: benefit_coverage_share
    bindings:
    - foreign_pending_lines
    - skilled_pending_lines
    - benefit_coverage_share
    ladder:
    - when: a line waiting on the supplement falls under foreign travel emergency care
      value: the tier's foreign travel coinsurance
    - when: a line waiting on the supplement falls under skilled nursing facility care
      value: the tier's share of the skilled nursing coinsurance
    - when: otherwise
      value: the tier's share of the Part B coinsurance
    baseline:
      benefit_coverage_share: P('part_b_coinsurance_coverage_percent')
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: travel_deductible_taken
    effect: parameter
    decides: yearly_travel_deductible
    bindings:
    - foreign_paid_lines_since_start
    - foreign_paid_liability_since_start
    - yearly_travel_deductible
    ladder:
    - when: a line waiting on the supplement falls under foreign travel emergency care and no such line has been
        paid since the policy took effect
      value: the tier's foreign travel emergency deductible in full
    - when: a line waiting on the supplement falls under foreign travel emergency care and such lines have been
        paid since the policy took effect
      value: what remains of that deductible after the liability those lines record
    - when: otherwise
      value: no yearly deductible, the benefit carrying none
    baseline:
      yearly_travel_deductible: '0.0'
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: deductible_counting_basis
    effect: method
    decides: counted_toward_deductible
    bindings:
    - paid_liability_recent
    - restatement_takeback
    - recovery_takeback
    - counted_toward_deductible
    ladder:
    - when: entries stand both restating lines of the twelve months to date and recording money recovered from the
        policyholder on them
      method: what counts is the liability the paid lines record less what all those entries take back
    - when: entries stand restating lines of those months and none records money recovered from the policyholder
      method: what counts is that liability less what the restatements take back
    - when: otherwise
      method: what counts is the liability the paid lines of those months record
    baseline:
      counted_toward_deductible: paid_liability_recent
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: A crossover line waiting on the supplement is settled by paying the share of the Medicare cost sharing
      the plan letter covers, worked out from the amount Medicare approved and from what the line records the policyholder
      owing, and never from what the provider billed. The standard method settles the line most recently rendered
      and works the payment out from its figures. The standard method takes the whole amount recorded as approved.
      The standard method takes the tier's share of the Part B coinsurance. The standard method takes no yearly
      deductible, the benefit carrying none. On a high-deductible plan letter the supplement pays nothing until
      the liability the policyholder's paid lines record over the twelve months to date reaches the tier's high
      deductible, and from that point it pays as the plan letter otherwise would. The standard method counts the
      liability the paid lines of the twelve months to date record. Foreign travel emergency care is paid only up
      to the tier's lifetime maximum, what has already been paid on that benefit over the life of the policy being
      counted against it. The amount approved less the yearly deductible is taken at the share the plan letter covers,
      what remains of the high deductible is taken from that share, the figure is rounded to the cent once at the
      end, it is never more than what remains of the lifetime maximum, and where what remains of the high deductible
      exceeds the share nothing is paid and the whole of it stands to the policyholder.
    params:
    - part_b_coinsurance_coverage_percent
    - high_deductible_amount
    - foreign_travel_lifetime_maximum
  inputs:
    history:
    - table: medigap_claim_crossovers
      aggregate: sum
      field: member_responsibility
      within_months: 12
      filters:
        event_type: medigap_claim_crossover_processed
        claim_status: paid
    - table: medigap_claim_crossovers
      aggregate: sum
      field: member_responsibility
      within_months: 12
      filters:
        event_type: medigap_claim_adjustment
    cross_category: []
