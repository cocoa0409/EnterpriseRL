- id: medigap_open_enrollment_and_guaranteed_issue
  subject:
  - medigap_application_recorded
  rule: Every applicant has one open enrollment period for a Medicare Supplement, during which the plan must issue
    any policy it sells at the standard rate with no health questions and no waiting period for a condition treated
    before issue. The plan receives the signed application no later than the last day of the open enrollment period
    counted from the date the applicant's Medicare Part B enrolment began. Calendar months are counted from the
    day of the month the Part B enrolment began, a month that has no matching day ends on its last day, the final
    day of the period is itself inside it, and calendar days and full 24-hour periods are never used in place of
    calendar months. Outside that period a guaranteed issue right still requires the plan to issue certain of its
    policies without health questions, and the applicant must show the event that gave them the right rather than
    merely assert it. A guaranteed issue right lasts sixty-three calendar days from the loss of the coverage that
    gave rise to it, and the plan tells an applicant who is inside that window which of its policies they may have
    without answering questions. An applicant who is inside their open enrollment period is never underwritten even
    where they volunteer health information, and the plan records the issue basis so that the rate and the waiting
    period can never be applied by mistake. A policy the tier does not offer on a guaranteed issue right may still
    be applied for with health questions, and the applicant is told which of the two routes they are on before the
    application is taken.
  eligibility:
  - id: open_enrollment_window
    applies_to:
    - medigap_application_recorded
    kind: time
    condition: The plan receives the signed application no later than the last day of the open enrollment period
      counted from the date the applicant's Medicare Part B enrolment began.
    evidence_fields:
