    - customers.part_b_effective_date
    - medigap_policies.application_received_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - customers.customer_id
      action_bindings:
        customers.customer_id: customer_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the date the applicant's Medicare Part B enrolment began
      anchor_source: customers.part_b_effective_date
      relation: not_after
      duration_source: variants.open_enrollment_period_months
      unit: calendar_months
      counting_rule: Calendar months are counted from the day of the month the Part B enrolment began, a month that
        has no matching day ends on its last day, the final day of the period is itself inside it, and calendar
        days and full 24-hour periods are never used in place of calendar months.
      boundary: inclusive
  params:
