        claim_payment_days: =claim_payment_days
        claim_crossover_automatic: =claim_crossover_automatic
      Ridgecrest Medicare Supplement Plan D:
        claim_filing_window_days: =claim_filing_window_days
        claim_payment_days: =claim_payment_days
