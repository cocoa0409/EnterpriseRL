- id: medigap_lapse_and_reinstatement
  subject:
  - medigap_grace_period_start
  - medigap_grace_period_cure
  - medigap_policy_lapse
  - medigap_reinstatement
  rule: A supplement premium unpaid after its due date puts the policy into its grace period, during which benefits
    carry on exactly as before and claims are paid. The plan has not received the outstanding premium by the last
    day of the grace period counted from the date the unpaid premium fell due. Calendar days are counted from the
    day after the due date, every day of the week counts, the last day of the grace period is itself inside it,
    and full 24-hour periods are never used in place of calendar days. Where the outstanding premium reaches the
    plan before that day ends the policy continues unbroken, with no new waiting period and no fresh health questions.
    A policy that lapses stops paying benefits for services on or after its end date, and claims for services before
    it are still paid. A lapsed policy may be put back in force inside the tier's reinstatement window on the evidence
    the tier requires, and reinstatement restores the original effective date so that no new waiting period begins.
    After that window the policyholder must apply afresh and may be underwritten, and the plan says so plainly rather
    than letting the policyholder assume they can pay their way back in.
  eligibility:
  - id: grace_period_exhausted
    applies_to:
    - medigap_policy_lapse
    kind: time
    condition: The plan has not received the outstanding premium by the last day of the grace period counted from
      the date the unpaid premium fell due.
    evidence_fields:
    - medigap_premium_ledger.medigap_premium_entry_id
    - medigap_premium_ledger.posted_date
    - medigap_policies.medigap_policy_id
    - medigap_policies.premium_balance_due
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - medigap_policies.medigap_policy_id
        - medigap_premium_ledger.medigap_premium_entry_id
      action_bindings:
        medigap_policies.medigap_policy_id: medigap_policy_id
        medigap_premium_ledger.medigap_premium_entry_id: medigap_premium_entry_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the date the unpaid premium fell due
      anchor_source: medigap_premium_ledger.posted_date
      relation: not_before
      duration_source: variants.premium_grace_period_days
      unit: calendar_days
      counting_rule: Calendar days are counted from the day after the due date, every day of the week counts, the
        last day of the grace period is itself inside it, and full 24-hour periods are never used in place of calendar
        days.
      boundary: inclusive
  params:
    per_tier:
      Ridgecrest Medicare Supplement Plan A:
        premium_grace_period_days: =premium_grace_period_days
        reinstatement_window_days: =reinstatement_window_days
        reinstatement_evidence_required: =reinstatement_evidence_required
      Ridgecrest Medicare Supplement Plan B:
        premium_grace_period_days: =premium_grace_period_days
        reinstatement_window_days: =reinstatement_window_days
        reinstatement_evidence_required: =reinstatement_evidence_required
      Ridgecrest Medicare Supplement Plan D:
        premium_grace_period_days: =premium_grace_period_days
        reinstatement_window_days: =reinstatement_window_days
        reinstatement_evidence_required: =reinstatement_evidence_required
      Ridgecrest Medicare Supplement Plan K:
        premium_grace_period_days: =premium_grace_period_days
        reinstatement_window_days: =reinstatement_window_days
        reinstatement_evidence_required: =reinstatement_evidence_required
      Ridgecrest Medicare Supplement Plan N:
        premium_grace_period_days: =premium_grace_period_days
        reinstatement_window_days: =reinstatement_window_days
        reinstatement_evidence_required: =reinstatement_evidence_required
      Ridgecrest Medicare Supplement Plan G:
