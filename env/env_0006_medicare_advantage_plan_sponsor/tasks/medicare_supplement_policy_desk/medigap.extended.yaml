    policy''s premium account, the amount already returned is deducted from this return. Where no return has yet
    been paid on the policy''s premium account and the money received on it exceeds the premium charged on it, the
    amount by which the money received exceeds the premium charged is deducted from this return. The months counted
    are multiplied by the value of a month together with the rate components returned with it, the deduction is
