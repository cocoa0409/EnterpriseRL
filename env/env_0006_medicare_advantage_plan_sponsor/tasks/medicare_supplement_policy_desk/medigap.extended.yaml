      action_bindings:
        medigap_underwriting_files.medigap_underwriting_file_id: medigap_underwriting_file_id
    state_contract:
      field: medigap_underwriting_files.intake_status
      allowed:
      - recorded
      - awaiting_applicant_signature
      - under_review
  params:
