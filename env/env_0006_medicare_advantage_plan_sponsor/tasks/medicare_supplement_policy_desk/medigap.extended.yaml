events:
- type: medigap_application_recorded
  target: medigap_policies
  mutation: create
  meaning: A signed Medicare Supplement application is received and a policy record is opened in application status.
  grain: One row per supplement policy an applicant applies for.
  fields:
    medigap_policy_id: Reference number of this policy record.
    customer_id: The applicant.
    variant_name: The standardised plan applied for.
    status: Opens at application_received, the lifecycle entry state.
    policy_number: The policy number reserved for this application.
    application_received_date: Date the signed application arrived.
    issue_age: The applicant's age on the application date.
    issue_basis: The right under which the application is being taken.
    rating_class: The rating class assumed until underwriting decides.
    premium_balance_due: Opens at zero.
    deductible_accumulated: Opens at zero.
    premium_payment_method: The payment method chosen on the application.
    premium_billing_frequency: The billing cadence chosen on the application.
    household_discount_applied: The discounts claimed on the application.
    termination_reason: Opens at not_applicable.
  triggers:
  - event: medigap:medigap_underwriting_started
    map:
      medigap_policy_id: medigap_policy_id
      status: underwriting_review
- type: medigap_underwriting_started
  target: medigap_policies
  mutation:
    transition:
      from: application_received
      to: underwriting_review
  meaning: The application passes to the underwriter, who will either record a decision or, where the applicant
    has an open enrollment or guaranteed issue right, accept it without health questions.
  grain: One row per application in front of the underwriter.
  fields:
    medigap_policy_id: The application under review.
    status: Moves to underwriting_review.
    issue_basis: The right the application relies on.
  triggers: []
- type: medigap_policy_issued
  target: medigap_policies
  mutation:
    transition:
      from: underwriting_review
      to: active
  meaning: The policy is issued and comes into force on its effective date, and the certificate is posted to the
    policyholder.
  grain: One row per supplement policy brought into force.
  fields:
    medigap_policy_id: The policy issued.
    customer_id: The policyholder.
    status: Moves to active.
    policy_effective_date: First day the supplement pays benefits.
    rating_class: The class the underwriter placed the policyholder in.
    issue_basis: The right the policy was issued on.
  triggers:
  - event: medigap:medigap_premium_charge
    map:
      medigap_policy_id: medigap_policy_id
      customer_id: customer_id
      rate_basis: issue_age_table
- type: medigap_application_declined
  target: medigap_policies
  mutation:
    transition:
      from: underwriting_review
      to: cancelled
  meaning: The underwriter declines the application, so no policy ever comes into force and the applicant is told
    why in writing.
  grain: One row per application declined at underwriting.
  fields:
    medigap_policy_id: The application declined.
    status: Moves to cancelled.
    policy_end_date: Date the application was closed.
    termination_reason: Set to declined_at_underwriting.
  triggers: []
- type: medigap_grace_period_start
  target: medigap_policies
  mutation:
    transition:
      from: active
      to: grace_period
  meaning: A supplement premium is unpaid after its due date, so the policy enters its grace period while benefits
    carry on.
  grain: One row per policy that falls into its grace period.
  fields:
    medigap_policy_id: The policy in arrears.
    status: Moves to grace_period.
    premium_balance_due: The outstanding premium as at the day the grace period began.
  triggers: []
- type: medigap_grace_period_cure
  target: medigap_policies
  mutation:
    transition:
      from: grace_period
      to: active
  meaning: The outstanding supplement premium reaches the plan inside the grace period, so the policy carries on
    unbroken.
  grain: One row per grace period cured.
  fields:
    medigap_policy_id: The policy restored.
    status: Returns to active.
    premium_balance_due: Falls to zero once the arrears are settled.
  triggers: []
- type: medigap_policy_lapse
  target: medigap_policies
  mutation:
    transition:
      from: grace_period
      to: lapsed
  meaning: The grace period ends with premium still unpaid, so the policy lapses and pays no benefit for services
    after its end date.
  grain: One row per policy lapsed for non-payment.
  fields:
    medigap_policy_id: The lapsed policy.
    status: Moves to lapsed.
    policy_end_date: Last day the supplement paid benefits.
    termination_reason: Set to nonpayment_of_premium.
  triggers: []
- type: medigap_reinstatement
  target: medigap_policies
  mutation:
    transition:
      from: lapsed
      to: active
  meaning: A lapsed policy is put back in force from its original effective date once every unpaid premium is paid
    and the evidence the plan requires is on file.
  grain: One row per lapsed policy put back in force.
  fields:
    medigap_policy_id: The policy reinstated.
    status: Returns to active.
    policy_end_date: Cleared, because cover is continuous again.
    termination_reason: Returns to not_applicable.
  triggers: []
- type: medigap_policy_cancellation
  target: medigap_policies
  mutation:
    transition:
    - from: active
      to: cancelled
    - from: grace_period
      to: cancelled
    - from: application_received
      to: cancelled
  meaning: The policyholder ends the policy, either by returning it inside the free look period or by giving notice
    later, or withdraws the application before it is underwritten.
  grain: One row per supplement policy the policyholder ends.
  fields:
    medigap_policy_id: The policy being ended.
    customer_id: The policyholder ending it.
    status: Moves to cancelled.
    policy_end_date: Last day the supplement pays benefits.
    termination_reason: policyholder_request, free_look_return or moved_out_of_state.
  triggers:
  - event: medigap:medigap_premium_refund
    map:
      medigap_policy_id: medigap_policy_id
      customer_id: customer_id
      refund_reason_code: unearned_premium_on_cancellation
- type: medigap_rescission
  target: medigap_policies
  mutation:
    transition:
      from: active
      to: rescinded
  meaning: The plan rescinds a policy issued on a materially untrue answer to a health question, inside the contestability
    period, and treats it as never having been in force.
  grain: One row per policy rescinded.
  fields:
    medigap_policy_id: The policy rescinded.
    customer_id: The policyholder.
    status: Moves to rescinded.
    policy_end_date: Set back to the day before the policy effective date.
    termination_reason: Set to material_misrepresentation.
  triggers:
  - event: medigap:medigap_premium_refund
    map:
      medigap_policy_id: medigap_policy_id
      customer_id: customer_id
      refund_reason_code: rescission
- type: medigap_policy_servicing_update
  target: medigap_policies
  mutation: update
  meaning: 'The service details the plan holds on the policy are amended: how the premium is paid, how often it
    is billed, or which discounts are being applied.'
  grain: One row per supplement policy whose service details are amended.
  fields:
    medigap_policy_id: The policy amended.
    premium_payment_method: The payment method now on record.
    premium_billing_frequency: The billing cadence now on record.
    household_discount_applied: The discounts now being applied.
  triggers: []
- type: medigap_premium_charge
  target: medigap_premium_ledger
  meaning: The supplement premium for one billing period is charged to the policyholder's account, together with
    any policy fee.
  grain: One row per billing period and rate component charged on one policy.
  distinguish_by:
  - billing_period
  - period_months
  - rate_basis
  - amount
  fields:
    medigap_premium_entry_id: Reference number of this ledger entry.
    medigap_policy_id: The policy charged.
    customer_id: The policyholder charged.
    event_type: medigap_premium_charge.
    billing_period: First month of the span billed.
    period_months: How many months of cover the charge pays for.
    posted_date: Date the charge was posted.
    amount: The premium component charged.
    rate_basis: Which part of the rate calculation this entry came from.
    payment_channel: not_applicable on a charge.
    balance_effect: not_applicable on a charge.
    refund_reason_code: not_applicable on a charge.
  account: premium_receivable
  direction: in
  triggers: []
- type: medigap_premium_payment
  target: medigap_premium_ledger
  meaning: Money the policyholder paid toward the supplement premium is posted against the oldest unpaid billing
    period.
  grain: One row per payment received and posted on one policy.
  distinguish_by:
  - posted_date
  - amount
  - payment_channel
  - remittance_reference
  fields:
    medigap_premium_entry_id: Reference number of this ledger entry.
    medigap_policy_id: The policy credited.
    customer_id: The policyholder who paid.
    event_type: medigap_premium_payment.
    billing_period: The oldest billing period the money is applied to.
    period_months: How many months of cover the payment covers.
    posted_date: Date the money was posted.
    amount: Amount received.
    payment_channel: How the money reached the plan.
    balance_effect: Whether the posting left part of the balance outstanding, settled it exactly, or exceeded it.
    remittance_reference: The payment reference the policyholder reads from their statement, recorded exactly as
      stated.
  account: premium_receivable
  direction: out
  triggers:
  - event: medigap:medigap_grace_period_cure
    when:
      balance_effect: settles_balance
    map:
      medigap_policy_id: medigap_policy_id
      status: active
- type: medigap_premium_refund
  target: medigap_premium_ledger
  meaning: Premium the policyholder paid for cover they will not receive is returned, after a free look return,
    a cancellation, a rescission or a rate correction.
  grain: One row per refund paid against one named charge.
  distinguish_by:
  - source_premium_entry_id
  - refund_reason_code
  - posted_date
  - amount
  fields:
    medigap_premium_entry_id: Reference number of this ledger entry.
    medigap_policy_id: The policy refunded.
    customer_id: The policyholder refunded.
    event_type: medigap_premium_refund.
    billing_period: The billing period whose premium is returned.
    period_months: How many months of cover are being returned.
    posted_date: Date the refund was paid.
    amount: Amount returned.
    payment_channel: How the money was returned.
    source_premium_entry_id: The single charge this refund returns.
    refund_reason_code: Why the refund was paid.
  account: premium_receivable
  direction: out
  triggers: []
- type: medigap_claim_crossover_processed
  target: medigap_claim_crossovers
  meaning: A claim Medicare has settled crosses over to the supplement, which pays the share of the Medicare cost
    sharing its plan letter covers.
  grain: One row per Medicare claim line the supplement processes.
  distinguish_by:
  - medicare_claim_number
  - line_sequence
  - date_of_service
  - benefit_category
  fields:
    medigap_claim_id: Reference number of this processed line.
    medigap_policy_id: The policy the line was paid under.
    customer_id: The policyholder treated.
    event_type: medigap_claim_crossover_processed.
    medicare_claim_number: The number Medicare gave the original claim.
    date_of_service: Date the service was rendered.
    processed_date: Date the supplement finished processing the line.
    benefit_category: The supplement benefit the line falls under.
    medicare_approved_amount: The amount Medicare approved.
    medicare_paid_amount: What Medicare paid.
    supplement_paid_amount: What the supplement paid.
    member_responsibility: What the policyholder still owes.
    claim_status: paid, denied or pending_medicare.
    denial_reason_code: Why the line was not paid; not_applicable when it was.
    provider_accepts_assignment: Whether the provider accepted Medicare assignment.
    crossover_source: How the claim reached the supplement.
    line_sequence: Position of this line inside the Medicare claim.
  account: deductible_accrual
  direction: in
  triggers: []
- type: medigap_claim_adjustment
  target: medigap_claim_crossovers
  meaning: A processed crossover line is put right after Medicare adjusts its own payment or the supplement finds
    it paid the wrong share, and the earlier payment is taken back.
  grain: One row per processed crossover line adjusted.
  distinguish_by:
  - source_claim_id
  - processed_date
  - supplement_paid_amount
  fields:
    medigap_claim_id: Reference number of this adjustment.
    medigap_policy_id: The policy the adjusted line sits on.
    customer_id: The policyholder.
    event_type: medigap_claim_adjustment.
    medicare_claim_number: Carried over from the line being adjusted.
    date_of_service: Carried over from the line being adjusted.
    processed_date: Date the adjustment was made.
    benefit_category: Carried over from the line being adjusted.
    medicare_approved_amount: The approved amount as Medicare now states it.
    supplement_paid_amount: The negative of what the earlier line paid.
    member_responsibility: What the policyholder owes once the line is restated.
    claim_status: adjusted or recovered.
    source_claim_id: The single processed line this adjustment applies to.
    line_sequence: Carried over from the line being adjusted.
  account: deductible_accrual
  direction: out
  triggers:
  - event: medigap:medigap_claim_crossover_processed
    when:
      claim_status: adjusted
    map:
      medigap_policy_id: medigap_policy_id
      customer_id: customer_id
      medicare_claim_number: medicare_claim_number
      line_sequence: line_sequence
measures:
- id: medigap_msr_high_deductible_met
  window: The current calendar year, from 1 January through the handling date inclusive.
  measure: Sum of member_responsibility on medigap_claim_crossover_processed rows that would have been paid but
    for the high deductible, less the amounts taken back by medigap_claim_adjustment rows in the same year.
- id: medigap_msr_months_in_force
  window: From the policy effective date through the handling date inclusive.
  measure: Whole months the policy has been in force, counting a grace period as in force and excluding any period
    between a lapse and a reinstatement.
- id: medigap_msr_foreign_travel_lifetime_paid
  window: The whole life of the policy, from its effective date through the handling date inclusive.
  measure: Sum of supplement_paid_amount on medigap_claim_crossover_processed rows whose benefit_category is foreign_travel_emergency,
    less the amounts taken back by medigap_claim_adjustment rows on the same benefit.
policies:
- id: medigap_agg_multi_holding
  subject:
  - medigap_application_recorded
  rule: 'A member may hold only one Medicare Supplement policy at a time, because selling a second supplement to
    someone who already holds one is a duplicate policy and is not permitted. No other Medicare Supplement policy
    is already in force for this member, standing at active or grace_period, on the day the new policy would take
    effect. Where the member already holds one, the new application is taken only as a replacement: the applicant
    signs the replacement notice, the old policy ends the day before the new one begins, and no day is covered twice
    or left uncovered. A policy that has already lapsed, been cancelled or been rescinded is no bar to a new application,
    and an applicant''s history may show several ended policies. An applicant who says they want to keep both policies
    is told plainly why they cannot, and that paying two supplement premiums would buy them nothing.'
  eligibility:
  - id: single_supplement_in_force
    applies_to:
    - medigap_application_recorded
    kind: dedup
    condition: No other Medicare Supplement policy is already in force for this member, standing at active or grace_period,
      on the day the new policy would take effect.
    evidence_fields:
    - medigap_policies.customer_id
    - medigap_policies.status
    - medigap_policies.policy_effective_date
    - medigap_policies.variant_name
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - medigap_policies.customer_id
      action_bindings:
        medigap_policies.customer_id: customer_id
    dedup_contract:
      table: medigap_policies
      mode: separate_record
      object_bindings:
        customer_id: customer_id
      duplicate_filters:
        status:
        - active
        - grace_period
      distinct_fields:
      - policy_effective_date
      - variant_name
  params:
    max_per_customer: 1
- id: medigap_underwriting_and_issue
  subject:
  - medigap_underwriting_started
  - medigap_policy_issued
  - medigap_application_declined
  rule: 'Outside an open enrollment or guaranteed issue right the plan asks health questions, and the policy is
    issued only on the underwriter''s recorded decision. The underwriting file carries a recorded underwriting decision
    of accepted_standard, accepted_preferred or accepted_substandard before the policy is issued. The underwriter
    records a decision no later than the decision deadline counted from the date the plan received the signed application.
    Calendar days are counted from the day after the receipt date, every day of the week counts, a decision recorded
    on the final day is in time, and full 24-hour periods are never used in place of calendar days. The applicant''s
    own account of their health opens the file and is what the questions are answered from, but it is never the
    decision: an applicant who says they were told they would be accepted is still subject to the underwriter''s
    recorded answer. The class the underwriter records fixes the rating class the premium is built on, and a tobacco
    user is rated with the tier''s tobacco factor whatever class they are placed in. A declined applicant is told
    in writing which answers led to the decision and what other rights, such as a guaranteed issue right, may still
    be open to them. An application with an incomplete health questionnaire is not declined on that ground: the
    plan asks for the missing answers and the decision clock runs from the day the file is complete.'
  eligibility:
  - id: underwriting_decision_recorded
    applies_to:
    - medigap_policy_issued
    kind: state
    condition: The underwriting file carries a recorded underwriting decision of accepted_standard, accepted_preferred
      or accepted_substandard before the policy is issued.
    evidence_fields:
    - medigap_underwriting_files.medigap_underwriting_file_id
    - medigap_underwriting_files.underwriting_decision
    - medigap_underwriting_files.health_questions_answered
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - medigap_underwriting_files.medigap_underwriting_file_id
      action_bindings:
        medigap_underwriting_files.medigap_underwriting_file_id: medigap_underwriting_file_id
    state_contract:
      field: medigap_underwriting_files.underwriting_decision
      allowed:
      - accepted_standard
      - accepted_preferred
      - accepted_substandard
  - id: decision_within_deadline
    applies_to:
    - medigap_application_declined
    kind: time
    condition: The underwriter records a decision no later than the decision deadline counted from the date the
      plan received the signed application.
    evidence_fields:
    - medigap_policies.medigap_policy_id
    - medigap_policies.application_received_date
    - medigap_policies.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - medigap_policies.medigap_policy_id
      action_bindings:
        medigap_policies.medigap_policy_id: medigap_policy_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the date the plan received the signed application
      anchor_source: medigap_policies.application_received_date
      relation: not_after
      duration_source: variants.underwriting_decision_days
      unit: calendar_days
      counting_rule: Calendar days are counted from the day after the receipt date, every day of the week counts,
        a decision recorded on the final day is in time, and full 24-hour periods are never used in place of calendar
        days.
      boundary: inclusive
  params:
    per_tier:
      Ridgecrest Medicare Supplement Plan A:
        underwriting_required_outside_open_enrollment: =underwriting_required_outside_open_enrollment
        underwriting_decision_days: =underwriting_decision_days
        minimum_issue_age: =minimum_issue_age
        maximum_issue_age: =maximum_issue_age
        under_65_eligible: =under_65_eligible
        tobacco_rate_factor: =tobacco_rate_factor
      Ridgecrest Medicare Supplement Plan B:
        underwriting_required_outside_open_enrollment: =underwriting_required_outside_open_enrollment
        underwriting_decision_days: =underwriting_decision_days
        minimum_issue_age: =minimum_issue_age
        maximum_issue_age: =maximum_issue_age
        under_65_eligible: =under_65_eligible
        tobacco_rate_factor: =tobacco_rate_factor
      Ridgecrest Medicare Supplement Plan D:
        underwriting_required_outside_open_enrollment: =underwriting_required_outside_open_enrollment
        underwriting_decision_days: =underwriting_decision_days
        minimum_issue_age: =minimum_issue_age
        maximum_issue_age: =maximum_issue_age
        under_65_eligible: =under_65_eligible
        tobacco_rate_factor: =tobacco_rate_factor
      Ridgecrest Medicare Supplement Plan K:
        underwriting_required_outside_open_enrollment: =underwriting_required_outside_open_enrollment
        underwriting_decision_days: =underwriting_decision_days
        minimum_issue_age: =minimum_issue_age
        maximum_issue_age: =maximum_issue_age
        under_65_eligible: =under_65_eligible
        tobacco_rate_factor: =tobacco_rate_factor
      Ridgecrest Medicare Supplement Plan N:
        underwriting_required_outside_open_enrollment: =underwriting_required_outside_open_enrollment
        underwriting_decision_days: =underwriting_decision_days
        minimum_issue_age: =minimum_issue_age
        maximum_issue_age: =maximum_issue_age
        under_65_eligible: =under_65_eligible
        tobacco_rate_factor: =tobacco_rate_factor
      Ridgecrest Medicare Supplement Plan G:
        underwriting_required_outside_open_enrollment: =underwriting_required_outside_open_enrollment
        underwriting_decision_days: =underwriting_decision_days
        minimum_issue_age: =minimum_issue_age
        maximum_issue_age: =maximum_issue_age
        under_65_eligible: =under_65_eligible
        tobacco_rate_factor: =tobacco_rate_factor
      Ridgecrest Medicare Supplement High Deductible Plan G:
        underwriting_required_outside_open_enrollment: =underwriting_required_outside_open_enrollment
        underwriting_decision_days: =underwriting_decision_days
        minimum_issue_age: =minimum_issue_age
