- id: medigap_ext_premium_account_settlement
  base_policy_refs:
  - medigap_premium_billing_and_posting
  - medigap_premium_rating
  overwrite: []
  trigger: on_request
  subject:
  - medigap_premium_payment
  computes: settlement_amount
  target_tool: remit_supplement_settlement_23b5df61
  params:
    extended_arrears_window_months: 12
  rule: 'Where a policyholder asks what must reach the plan to bring their Medicare Supplement premium account up
    to date, the figure is the premium owed for the billing period now current, together with the charges standing
    on the account for the periods the settlement reaches back over and the policy fee falling due with it, less
    the money already standing to the policyholder''s credit. The amount a policyholder must pay to bring the account
    up to date is not fixed before the premium account carries the return owed on premium charged for months in
    which other Medicare coverage was still in force. The months a billing period covers are the months the policyholder''s
    billing cadence bills at a time: twelve on an annual cadence, six on a semi-annual cadence, three on a quarterly
    cadence and one on a monthly cadence. The monthly premium the policy is rated on is built from the tier''s base
    monthly premium for a policyholder issued at 65. The standard method takes that base monthly premium as it stands,
    whatever the policyholder''s age. Where the policy is rated on the age at issue and the age at issue is above
    65, the base monthly premium rises by the tier''s issue-age step for each year of age above 65. Where the policy
    is rated on attained age and the policy has been in force a full year or more, the base monthly premium rises
    by the tier''s attained-age increase for each full year it has been in force. That monthly premium is then multiplied
    by the tier''s area factor, and by the tier''s tobacco factor where the policy is rated as a tobacco user, before
    any discount is taken. Where the plan holds the policy as taking the household discount, the tier''s household
    discount is then taken from that monthly premium; where it does not, the monthly premium stands as rated. A
    reduction is then taken for the way the policyholder pays from the monthly premium the household discount leaves,
    so that the household discount and the reduction for the way they pay are taken one after the other and are
    never combined into a single rate. The standard method takes no reduction from that monthly premium. Where a
    payment covering twelve months of cover stands on the account and a payment that settled a billing period in
    full stands within the twelve months to date, the reduction is the tier''s annual payment discount taken on
    the monthly premium the household discount leaves. Where no payment covering twelve months of cover stands on
    the account, the premium is drawn by bank transfer and at least two payments that settled a billing period in
    full stand within the twelve months to date, the reduction is the tier''s flat electronic funds transfer reduction
    for each month of the span. The premium owed for the billing period now current is then fixed. The standard
    method values the billing period now current at the amount posted for that period. Where no charge stands for
    the billing period now current, that period is valued at the monthly premium the household discount leaves,
    less the reduction, taken for each month the cadence covers. Where a charge stands for the billing period now
    current and a return has been paid against that period, it is valued at the amount posted less the amount returned.
    The settlement then reaches back over the periods still standing on the account. The standard method reaches
    back over the billing period now current alone. Where the policy has been in force more than twelve months and
    a payment that settled a billing period in full stands within the twelve months to date, the settlement reaches
    back over the twelve months to date. Where the policy has been in force twelve months or less and a payment
    that settled a billing period in full stands within the twelve months to date, the settlement reaches back to
    the day the policy took effect. Every charge posted within the span reached back over is owed. The policy fee
    is charged once a policy year and falls due with the settlement. The standard method adds the share of the annual
    policy fee falling on the months the billing period now current covers. Where no entry carrying the policy fee
    stands on the account for the twelve months to date and the settlement covers a span of twelve months, the whole
    annual policy fee is added. Where an entry carrying the policy fee stands on the account for the twelve months
    to date, nothing further is added for the policy fee. Money already received is then set against what is owed.
    The standard method credits the payments that settled a billing period in full within the span reached back
    over. Where a payment posted within that span left part of its billing period unpaid, the payments posted within
    the span are credited in full, the part payment included. Where no payment posted within that span left part
    of its billing period unpaid and the money received within that span exceeds the charges posted within it, the
    payments that settled a billing period in full are credited together with the amount by which the money received
    within the span exceeds the charges posted within it. Every return already credited on the account within the
    span reached back over is set against the settlement as well. The premium for the billing period now current,
    the charges reached back over and the policy fee are added together, the credits and the returns are taken from
    that total, the figure is rounded to the cent once at the end, and where the credits and returns standing exceed
    what is owed nothing is payable and the difference stands to the policyholder''s credit.

    '
  prerequisite:
  - problem: medigap_ext_dual_coverage_premium_return
    kind: value_input
    gate: returns_credited
    form: state
    policy_source: The amount a policyholder must pay to bring the account up to date is not fixed before the premium
      account carries the return owed on premium charged for months in which other Medicare coverage was still in
      force.
    condition: the policy's premium account carries a return entry for the premium charged for the months in which
      the policyholder's other Medicare coverage was still in force
    resolved_by: post_overlap_premium_return_c83152d2
    effect: once that return stands on the premium account it is credited by the settlement's returns_credited binding,
      which falls by the amount returned and lowers the figure the policyholder must pay by the same amount
  cross_category: []
  compute:
  - months_in_force: MONTHS(F('policy_effective_date'), NOW)
  - issue_age_steps: MX(0, F('issue_age') - 65)
  - age_rated_monthly_premium: RND(P('base_monthly_premium_age_65') * (1 + P('issue_age_rate_step_percent') / 100
      * issue_age_steps), 2) if (P('rating_method') == 'issue_age' and issue_age_steps > 0) else (RND(P('base_monthly_premium_age_65')
      * (1 + P('attained_age_annual_increase_percent') / 100 * int(months_in_force / 12)), 2) if (P('rating_method')
      == 'attained_age' and months_in_force >= 12) else P('base_monthly_premium_age_65'))
  - rated_monthly_premium: RND(age_rated_monthly_premium * P('area_rate_factor') * (P('tobacco_rate_factor') if
      F('rating_class') == 'tobacco_user' else 1.0), 2)
  - household_adjusted_monthly_premium: RND(rated_monthly_premium * (100 - P('household_discount_percent')) / 100,
      2) if (F('household_discount_applied') == 'household_discount' or F('household_discount_applied') == 'household_and_annual_discount')
      else rated_monthly_premium
  - span_months: 12 if F('premium_billing_frequency') == 'annual' else (6 if F('premium_billing_frequency') == 'semi_annual'
      else (3 if F('premium_billing_frequency') == 'quarterly' else 1))
  - settling_payments_in_year: COUNT('medigap_premium_ledger', within_months=12, date_field='posted_date', event_type='medigap_premium_payment',
      balance_effect='settles_balance')
  - longest_payment_span: MAX('medigap_premium_ledger','period_months', event_type='medigap_premium_payment')
  - monthly_premium_reduction: RND(household_adjusted_monthly_premium * P('annual_payment_discount_percent') / 100,
      2) if (longest_payment_span >= 12 and settling_payments_in_year >= 1) else (P('electronic_funds_transfer_discount')
      if (F('premium_payment_method') == 'electronic_funds_transfer' and settling_payments_in_year >= 2) else 0.0)
  - current_span_charges: SUM('medigap_premium_ledger','amount', within_months=span_months, date_field='posted_date',
      event_type='medigap_premium_charge')
  - returns_against_current_span: SUM('medigap_premium_ledger','amount', within_months=span_months, date_field='posted_date',
      event_type='medigap_premium_refund')
  - current_span_value: RND((household_adjusted_monthly_premium - monthly_premium_reduction) * span_months, 2) if
      current_span_charges <= 0 else (RND(current_span_charges - returns_against_current_span, 2) if returns_against_current_span
      > 0 else RND(current_span_charges, 2))
  - arrears_window_months: K('extended_arrears_window_months') if (months_in_force > 12 and settling_payments_in_year
      >= 1) else ((months_in_force + 1) if (months_in_force <= 12 and settling_payments_in_year >= 1) else span_months)
  - arrears_charges: SUM('medigap_premium_ledger','amount', within_months=arrears_window_months, date_field='posted_date',
      event_type='medigap_premium_charge')
  - settling_payments_amount: SUM('medigap_premium_ledger','amount', within_months=arrears_window_months, date_field='posted_date',
      event_type='medigap_premium_payment', balance_effect='settles_balance')
  - partial_payments_in_window: SUM('medigap_premium_ledger','amount', within_months=arrears_window_months, date_field='posted_date',
      event_type='medigap_premium_payment', balance_effect='partial_payment')
  - overpayment_credit_in_window: MX(0.0, RND(SUM('medigap_premium_ledger','amount', within_months=arrears_window_months,
      date_field='posted_date', event_type='medigap_premium_payment') - arrears_charges, 2))
  - credits_allowed: RND(settling_payments_amount + partial_payments_in_window, 2) if partial_payments_in_window
      > 0 else (RND(settling_payments_amount + overpayment_credit_in_window, 2) if overpayment_credit_in_window
      > 0 else RND(settling_payments_amount, 2))
  - policy_fee_entries_in_year: COUNT('medigap_premium_ledger', within_months=12, date_field='posted_date', rate_basis='policy_fee')
  - fee_instalment: P('policy_fee_annual') if (policy_fee_entries_in_year <= 0 and span_months >= 12) else (0.0
      if policy_fee_entries_in_year >= 1 else RND(P('policy_fee_annual') / 12 * span_months, 2))
  - returns_credited: SUM('medigap_premium_ledger','amount', within_months=arrears_window_months, date_field='posted_date',
      event_type='medigap_premium_refund')
  - result: MX(0.0, RND(current_span_value + arrears_charges + fee_instalment - credits_allowed - returns_credited,
      2))
  compute_basis:
    months_in_force: Where the policy is rated on attained age and the policy has been in force a full year or more,
      the base monthly premium rises by the tier's attained-age increase for each full year it has been in force.
    issue_age_steps: Where the policy is rated on the age at issue and the age at issue is above 65, the base monthly
      premium rises by the tier's issue-age step for each year of age above 65.
    age_rated_monthly_premium: The standard method takes that base monthly premium as it stands, whatever the policyholder's
      age. Where the policy is rated on the age at issue and the age at issue is above 65, the base monthly premium
      rises by the tier's issue-age step for each year of age above 65. Where the policy is rated on attained age
      and the policy has been in force a full year or more, the base monthly premium rises by the tier's attained-age
      increase for each full year it has been in force.
    rated_monthly_premium: That monthly premium is then multiplied by the tier's area factor, and by the tier's
      tobacco factor where the policy is rated as a tobacco user, before any discount is taken.
    span_months: 'The months a billing period covers are the months the policyholder''s billing cadence bills at
      a time: twelve on an annual cadence, six on a semi-annual cadence, three on a quarterly cadence and one on
      a monthly cadence.'
    settling_payments_in_year: Where no payment covering twelve months of cover stands on the account, the premium
      is drawn by bank transfer and at least two payments that settled a billing period in full stand within the
      twelve months to date, the reduction is the tier's flat electronic funds transfer reduction for each month
      of the span.
    longest_payment_span: Where a payment covering twelve months of cover stands on the account and a payment that
      settled a billing period in full stands within the twelve months to date, the reduction is the tier's annual
      payment discount taken on the monthly premium the household discount leaves.
    monthly_premium_reduction: The standard method takes no reduction from that monthly premium. Where a payment
      covering twelve months of cover stands on the account and a payment that settled a billing period in full
      stands within the twelve months to date, the reduction is the tier's annual payment discount taken on the
      monthly premium the household discount leaves. Where no payment covering twelve months of cover stands on
      the account, the premium is drawn by bank transfer and at least two payments that settled a billing period
      in full stand within the twelve months to date, the reduction is the tier's flat electronic funds transfer
      reduction for each month of the span.
    current_span_charges: The standard method values the billing period now current at the amount posted for that
      period.
    returns_against_current_span: Where a charge stands for the billing period now current and a return has been
      paid against that period, it is valued at the amount posted less the amount returned.
    current_span_value: The standard method values the billing period now current at the amount posted for that
      period. Where no charge stands for the billing period now current, that period is valued at the monthly premium
      the household discount leaves, less the reduction, taken for each month the cadence covers. Where a charge
      stands for the billing period now current and a return has been paid against that period, it is valued at
      the amount posted less the amount returned.
    arrears_window_months: The standard method reaches back over the billing period now current alone. Where the
      policy has been in force more than twelve months and a payment that settled a billing period in full stands
      within the twelve months to date, the settlement reaches back over the twelve months to date. Where the policy
      has been in force twelve months or less and a payment that settled a billing period in full stands within
      the twelve months to date, the settlement reaches back to the day the policy took effect.
    arrears_charges: Every charge posted within the span reached back over is owed.
    settling_payments_amount: The standard method credits the payments that settled a billing period in full within
      the span reached back over.
    partial_payments_in_window: Where a payment posted within that span left part of its billing period unpaid,
      the payments posted within the span are credited in full, the part payment included.
    overpayment_credit_in_window: Where no payment posted within that span left part of its billing period unpaid
      and the money received within that span exceeds the charges posted within it, the payments that settled a
      billing period in full are credited together with the amount by which the money received within the span exceeds
      the charges posted within it.
    credits_allowed: The standard method credits the payments that settled a billing period in full within the span
      reached back over. Where a payment posted within that span left part of its billing period unpaid, the payments
      posted within the span are credited in full, the part payment included. Where no payment posted within that
      span left part of its billing period unpaid and the money received within that span exceeds the charges posted
      within it, the payments that settled a billing period in full are credited together with the amount by which
      the money received within the span exceeds the charges posted within it.
    policy_fee_entries_in_year: Where an entry carrying the policy fee stands on the account for the twelve months
      to date, nothing further is added for the policy fee.
    fee_instalment: The standard method adds the share of the annual policy fee falling on the months the billing
      period now current covers. Where no entry carrying the policy fee stands on the account for the twelve months
      to date and the settlement covers a span of twelve months, the whole annual policy fee is added. Where an
      entry carrying the policy fee stands on the account for the twelve months to date, nothing further is added
      for the policy fee.
    returns_credited: Every return already credited on the account within the span reached back over is set against
      the settlement as well.
    result: The premium for the billing period now current, the charges reached back over and the policy fee are
      added together, the credits and the returns are taken from that total, the figure is rounded to the cent once
      at the end, and where the credits and returns standing exceed what is owed nothing is payable and the difference
      stands to the policyholder's credit.
    household_adjusted_monthly_premium: Where the plan holds the policy as taking the household discount, the tier's
      household discount is then taken from that monthly premium; where it does not, the monthly premium stands
      as rated.
  factors:
  - id: age_rating_basis
    effect: method
    decides: age_rated_monthly_premium
    bindings:
    - months_in_force
    - issue_age_steps
    - age_rated_monthly_premium
    ladder:
    - when: the policy is rated on the age at issue and the age at issue is above 65
      method: the base monthly premium rises by the tier's issue-age step for each year of age above 65
    - when: the policy is rated on attained age and the policy has been in force a full year or more
      method: the base monthly premium rises by the tier's attained-age increase for each full year it has been
        in force
    - when: otherwise
      method: the base monthly premium is taken as it stands, whatever the policyholder's age
    baseline:
      age_rated_monthly_premium: P('base_monthly_premium_age_65')
    evidence:
    - date
    - tier_param
    cross_difficulty: null
  - id: payment_method_reduction
    effect: parameter
    decides: monthly_premium_reduction
    bindings:
    - settling_payments_in_year
    - longest_payment_span
    - monthly_premium_reduction
    ladder:
    - when: a payment covering twelve months of cover stands on the account and a payment that settled a billing
        period in full stands within the twelve months to date
      value: the tier's annual payment discount taken on the monthly premium the household discount leaves
    - when: no payment covering twelve months of cover stands on the account, the premium is drawn by bank transfer
        and at least two payments that settled a billing period in full stand within the twelve months to date
      value: the tier's flat electronic funds transfer reduction for each month of the span
    - when: otherwise
      value: no reduction is taken
    baseline:
      monthly_premium_reduction: '0.0'
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: current_period_valuation
    effect: method
    decides: current_span_value
    bindings:
    - current_span_charges
    - returns_against_current_span
    - current_span_value
    ladder:
    - when: no charge stands for the billing period now current
      method: the period is valued at the monthly premium the household discount leaves, less the reduction, taken
        for each month the cadence covers
    - when: a charge stands for the billing period now current and a return has been paid against that period
      method: the period is valued at the amount posted less the amount returned
    - when: otherwise
      method: the period is valued at the amount posted for it
    baseline:
      current_span_value: RND(current_span_charges, 2)
    evidence:
    - history
    cross_difficulty: null
  - id: arrears_reach
    effect: method
    decides: arrears_window_months
    bindings:
    - arrears_window_months
    - arrears_charges
    ladder:
    - when: the policy has been in force more than twelve months and a payment that settled a billing period in
        full stands within the twelve months to date
      method: the settlement reaches back over the twelve months to date
    - when: the policy has been in force twelve months or less and a payment that settled a billing period in full
        stands within the twelve months to date
      method: the settlement reaches back to the day the policy took effect
    - when: otherwise
      method: the settlement reaches back over the billing period now current alone
    baseline:
      arrears_window_months: span_months
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: credit_for_money_received
    effect: parameter
    decides: credits_allowed
    bindings:
    - settling_payments_amount
    - partial_payments_in_window
    - overpayment_credit_in_window
    - credits_allowed
    ladder:
    - when: a payment posted within the span reached back over left part of its billing period unpaid
      value: the payments posted within the span, the part payment included
    - when: no payment posted within the span reached back over left part of its billing period unpaid and the money
        received within that span exceeds the charges posted within it
      value: the payments that settled a billing period in full together with the amount by which the money received
        within the span exceeds the charges posted within it
    - when: otherwise
      value: the payments that settled a billing period in full
    baseline:
      credits_allowed: RND(settling_payments_amount, 2)
    evidence:
    - history
    cross_difficulty: null
  - id: policy_fee_due_with_settlement
    effect: parameter
    decides: fee_instalment
    bindings:
    - policy_fee_entries_in_year
    - fee_instalment
    ladder:
    - when: no entry carrying the policy fee stands on the account for the twelve months to date and the settlement
        covers a span of twelve months
      value: the whole annual policy fee
    - when: an entry carrying the policy fee stands on the account for the twelve months to date
      value: nothing further for the policy fee
    - when: otherwise
      value: the share of the annual policy fee falling on the months the billing period now current covers
    baseline:
      fee_instalment: RND(P('policy_fee_annual') / 12 * span_months, 2)
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  baseline:
    rule: 'Where a policyholder asks what must reach the plan to bring their Medicare Supplement premium account
      up to date, the figure is the premium owed for the billing period now current, together with the charges standing
      on the account for the periods the settlement reaches back over and the policy fee falling due with it, less
      the money already standing to the policyholder''s credit. The months a billing period covers are the months
      the policyholder''s billing cadence bills at a time: twelve on an annual cadence, six on a semi-annual cadence,
      three on a quarterly cadence and one on a monthly cadence. The monthly premium the policy is rated on is built
      from the tier''s base monthly premium for a policyholder issued at 65. The standard method takes that base
      monthly premium as it stands, whatever the policyholder''s age. That monthly premium is then multiplied by
      the tier''s area factor, and by the tier''s tobacco factor where the policy is rated as a tobacco user, before
      any discount is taken. Where the plan holds the policy as taking the household discount, the tier''s household
      discount is then taken from that monthly premium; where it does not, the monthly premium stands as rated.
      The standard method takes no reduction from that monthly premium. The standard method values the billing period
      now current at the amount posted for that period. The standard method reaches back over the billing period
      now current alone. Every charge posted within the span reached back over is owed. The policy fee is charged
      once a policy year and falls due with the settlement. The standard method adds the share of the annual policy
      fee falling on the months the billing period now current covers. The standard method credits the payments
      that settled a billing period in full within the span reached back over. Every return already credited on
      the account within the span reached back over is set against the settlement as well. The premium for the billing
      period now current, the charges reached back over and the policy fee are added together, the credits and the
      returns are taken from that total, the figure is rounded to the cent once at the end, and where the credits
      and returns standing exceed what is owed nothing is payable and the difference stands to the policyholder''s
      credit.'
    params:
    - base_monthly_premium_age_65
    - area_rate_factor
    - tobacco_rate_factor
    - household_discount_percent
    - policy_fee_annual
  inputs:
    history:
    - table: medigap_premium_ledger
      aggregate: sum
      field: amount
      within_months: 12
      filters:
        event_type: medigap_premium_charge
    - table: medigap_premium_ledger
      aggregate: sum
      field: amount
      within_months: 12
      filters:
        event_type: medigap_premium_payment
    - table: medigap_premium_ledger
      aggregate: sum
      field: amount
      within_months: 12
      filters:
        event_type: medigap_premium_refund
    cross_category: []
- id: medigap_ext_uncovered_day_line_restatement
  base_policy_refs:
  - medigap_claim_adjustment_and_recovery
  - medigap_exclusivity_with_medicare_advantage
  overwrite: []
  trigger: state_due
  subject:
  - medigap_claim_adjustment
  computes: liability_restated
  target_tool: book_precoverage_restatement_aba9484f
  params: {}
  rule: 'A Medicare Supplement policy settles nothing for a day it was not in force, so a crossover line the supplement
    has paid whose date of service falls on such a day is put right: what the supplement paid is taken back from
    whoever received it, and the liability the line records is restated to what the policyholder genuinely owes
    for that day. What is restated is the recorded liability of the lines that fall outside cover, less what the
    coverage that was in force on those days leaves the policyholder and less what has already been taken back.
    The lines that fall outside cover are found by comparing the date of service of each paid line with the day
    the policy took effect. The standard method finds no line outside cover, the policy having been in force for
    every day its paid lines fall on. Where the policy took effect within the period its paid lines fall in, the
    lines counted are those the supplement paid whose date of service falls before the day the policy took effect.
    Where the policy stood ended and was afterwards put back in force, the lines counted are those whose date of
    service falls in the twelve months to date but outside the period since it was put back in force. Only some
    of those lines are restated here. The standard method restates every line that falls outside cover. Where lines
    outside cover reached the supplement as an automatic crossover from Medicare, those lines are the ones restated,
    the money having gone to the provider. Where lines outside cover were submitted by the policyholder herself,
    they are not restated here, the money having gone to her and being asked of her instead. The liability of the
    lines restated is measured from the record. The standard method takes nothing as the liability of those lines.
    Where the lines record the policyholder owing an amount, that recorded amount is the liability restated. Where
    the lines record nothing owing but the supplement paid on them, what the supplement paid on them is the liability
    restated. Part of that liability is not restated, because the coverage that was in force on those days leaves
    the policyholder something of its own. The standard method leaves the policyholder nothing and restates the
    whole of the liability. Where a Medicare Advantage enrollment of the member was in force up to the day before
    this policy took effect and lines stand paid for days before it, what is left with the policyholder is the copay
    that plan''s tier carries for a specialist visit. Where no other Medicare coverage of the member was in force
    on those days, the whole of the recorded liability stays with the policyholder and nothing is restated. What
    is left with the policyholder falls across the lines outside cover. The standard method does not apply it at
    all, no line falling outside cover. Where more than one line falls outside cover and each was a visit of its
    own, what is left with the policyholder falls on each of those lines separately. Where lines fall outside cover
    and belong to one Medicare claim, what is left with the policyholder falls once on each such claim. Money already
    taken back is never taken back twice. The standard method deducts nothing already taken back. Where an entry
    already stands restating one of the lines outside cover, the liability it has already taken back is deducted.
    Where an entry already stands recording money recovered from the policyholder on one of those lines, the amount
    it records is deducted. The liability of the lines restated is reduced by what is left with the policyholder
    and by what has already been taken back, the figure is rounded to the cent once at the end, and where those
    reductions exceed the liability nothing is restated.

    '
  prerequisite: []
  cross_category:
  - category: advantage
    as: branch
    reads:
    - coverage_end_date
    - specialist_copay
    note: what the coverage in force on the uncovered days leaves the policyholder is the copay carried by the tier
      of the member's Medicare Advantage enrollment, read from that enrollment and its plan tier.
  compute:
  - months_since_effective: MONTHS(F('policy_effective_date'), NOW)
  - other_coverage_end_date: CFIELD('advantage','coverage_end_date')
  - days_between_other_coverage_and_cover: DAYS(other_coverage_end_date, F('policy_effective_date'))
  - auto_paid_liability_all: SUM('medigap_claim_crossovers','member_responsibility', date_field='date_of_service',
      event_type='medigap_claim_crossover_processed', claim_status='paid', crossover_source='medicare_automatic_crossover')
  - auto_paid_liability_in_cover: SUM('medigap_claim_crossovers','member_responsibility', within_months=months_since_effective
      + 1, date_field='date_of_service', event_type='medigap_claim_crossover_processed', claim_status='paid', crossover_source='medicare_automatic_crossover')
  - auto_paid_liability_last_year: SUM('medigap_claim_crossovers','member_responsibility', within_months=12, date_field='date_of_service',
      event_type='medigap_claim_crossover_processed', claim_status='paid', crossover_source='medicare_automatic_crossover')
  - outside_cover_liability_span: MX(0.0, auto_paid_liability_all - auto_paid_liability_in_cover) if (F('policy_end_date')
      == '' and auto_paid_liability_all > auto_paid_liability_in_cover) else (MX(0.0, auto_paid_liability_last_year
      - auto_paid_liability_in_cover) if F('policy_end_date') != '' else 0.0)
  - member_paid_liability_all: SUM('medigap_claim_crossovers','member_responsibility', date_field='date_of_service',
      event_type='medigap_claim_crossover_processed', claim_status='paid', crossover_source='member_submitted')
  - member_paid_liability_in_cover: SUM('medigap_claim_crossovers','member_responsibility', within_months=months_since_effective
      + 1, date_field='date_of_service', event_type='medigap_claim_crossover_processed', claim_status='paid', crossover_source='member_submitted')
  - auto_outside_cover_payments: MX(0.0, SUM('medigap_claim_crossovers','supplement_paid_amount', date_field='date_of_service',
      event_type='medigap_claim_crossover_processed', claim_status='paid', crossover_source='medicare_automatic_crossover')
      - SUM('medigap_claim_crossovers','supplement_paid_amount', within_months=months_since_effective + 1, date_field='date_of_service',
      event_type='medigap_claim_crossover_processed', claim_status='paid', crossover_source='medicare_automatic_crossover'))
  - lines_restated_liability: outside_cover_liability_span if auto_outside_cover_payments > 0 else (0.0 if member_paid_liability_all
      - member_paid_liability_in_cover > 0 else outside_cover_liability_span + MX(0.0, member_paid_liability_all
      - member_paid_liability_in_cover))
  - outside_cover_line_count: COUNT('medigap_claim_crossovers', date_field='date_of_service', event_type='medigap_claim_crossover_processed',
      claim_status='paid') - COUNT('medigap_claim_crossovers', within_months=months_since_effective + 1, date_field='date_of_service',
      event_type='medigap_claim_crossover_processed', claim_status='paid')
  - restated_liability_measure: lines_restated_liability if (lines_restated_liability > 0 and outside_cover_line_count
      > 0) else (auto_outside_cover_payments if (lines_restated_liability <= 0 and auto_outside_cover_payments >
      0) else 0.0)
  - other_plan_specialist_copay: CPARAM('advantage','specialist_copay')
  - retained_by_policyholder: other_plan_specialist_copay if (days_between_other_coverage_and_cover == 1 and restated_liability_measure
      > 0) else (restated_liability_measure if (days_between_other_coverage_and_cover != 1 and restated_liability_measure
      > 0) else 0.0)
  - auto_outside_cover_lines: COUNT('medigap_claim_crossovers', date_field='date_of_service', event_type='medigap_claim_crossover_processed',
      claim_status='paid', crossover_source='medicare_automatic_crossover') - COUNT('medigap_claim_crossovers',
      within_months=months_since_effective + 1, date_field='date_of_service', event_type='medigap_claim_crossover_processed',
      claim_status='paid', crossover_source='medicare_automatic_crossover')
  - distinct_claims_outside_cover: COUNT('medigap_claim_crossovers', date_field='date_of_service', event_type='medigap_claim_crossover_processed',
      claim_status='paid', crossover_source='medicare_automatic_crossover', line_sequence=1) - COUNT('medigap_claim_crossovers',
      within_months=months_since_effective + 1, date_field='date_of_service', event_type='medigap_claim_crossover_processed',
      claim_status='paid', crossover_source='medicare_automatic_crossover', line_sequence=1)
  - retention_applied: RND(retained_by_policyholder * auto_outside_cover_lines, 2) if (auto_outside_cover_lines
      > 1 and distinct_claims_outside_cover == auto_outside_cover_lines) else (RND(retained_by_policyholder * MX(1,
      distinct_claims_outside_cover), 2) if auto_outside_cover_lines > 0 else 0.0)
  - liability_already_restated: SUM('medigap_claim_crossovers','member_responsibility', event_type='medigap_claim_adjustment',
      claim_status='adjusted', date_field='processed_date')
  - liability_already_recovered: SUM('medigap_claim_crossovers','member_responsibility', event_type='medigap_claim_adjustment',
      claim_status='recovered', date_field='processed_date')
  - already_taken_back: liability_already_restated if liability_already_restated > 0 else (liability_already_recovered
      if liability_already_recovered > 0 else 0.0)
  - result: MX(0.0, RND(restated_liability_measure - retention_applied - already_taken_back, 2))
  compute_basis:
    months_since_effective: The lines that fall outside cover are found by comparing the date of service of each
      paid line with the day the policy took effect.
    other_coverage_end_date: Where a Medicare Advantage enrollment of the member was in force up to the day before
      this policy took effect and lines stand paid for days before it, what is left with the policyholder is the
      copay that plan's tier carries for a specialist visit.
    days_between_other_coverage_and_cover: Where no other Medicare coverage of the member was in force on those
      days, the whole of the recorded liability stays with the policyholder and nothing is restated.
    auto_paid_liability_all: Where lines outside cover reached the supplement as an automatic crossover from Medicare,
      those lines are the ones restated, the money having gone to the provider.
    auto_paid_liability_in_cover: Where the policy took effect within the period its paid lines fall in, the lines
      counted are those the supplement paid whose date of service falls before the day the policy took effect.
    auto_paid_liability_last_year: Where the policy stood ended and was afterwards put back in force, the lines
      counted are those whose date of service falls in the twelve months to date but outside the period since it
      was put back in force.
    outside_cover_liability_span: The standard method finds no line outside cover, the policy having been in force
      for every day its paid lines fall on. Where the policy took effect within the period its paid lines fall in,
      the lines counted are those the supplement paid whose date of service falls before the day the policy took
      effect. Where the policy stood ended and was afterwards put back in force, the lines counted are those whose
      date of service falls in the twelve months to date but outside the period since it was put back in force.
    member_paid_liability_all: Where lines outside cover were submitted by the policyholder herself, they are not
      restated here, the money having gone to her and being asked of her instead.
    member_paid_liability_in_cover: The lines that fall outside cover are found by comparing the date of service
      of each paid line with the day the policy took effect.
    auto_outside_cover_payments: Where the lines record nothing owing but the supplement paid on them, what the
      supplement paid on them is the liability restated.
    lines_restated_liability: The standard method restates every line that falls outside cover. Where lines outside
      cover reached the supplement as an automatic crossover from Medicare, those lines are the ones restated, the
      money having gone to the provider. Where lines outside cover were submitted by the policyholder herself, they
      are not restated here, the money having gone to her and being asked of her instead.
    outside_cover_line_count: Where the lines record the policyholder owing an amount, that recorded amount is the
      liability restated.
    restated_liability_measure: The standard method takes nothing as the liability of those lines. Where the lines
      record the policyholder owing an amount, that recorded amount is the liability restated. Where the lines record
      nothing owing but the supplement paid on them, what the supplement paid on them is the liability restated.
    other_plan_specialist_copay: Where a Medicare Advantage enrollment of the member was in force up to the day
      before this policy took effect and lines stand paid for days before it, what is left with the policyholder
      is the copay that plan's tier carries for a specialist visit.
    retained_by_policyholder: The standard method leaves the policyholder nothing and restates the whole of the
      liability. Where a Medicare Advantage enrollment of the member was in force up to the day before this policy
      took effect and lines stand paid for days before it, what is left with the policyholder is the copay that
      plan's tier carries for a specialist visit. Where no other Medicare coverage of the member was in force on
      those days, the whole of the recorded liability stays with the policyholder and nothing is restated.
    auto_outside_cover_lines: Where more than one line falls outside cover and each was a visit of its own, what
      is left with the policyholder falls on each of those lines separately.
    distinct_claims_outside_cover: Where lines fall outside cover and belong to one Medicare claim, what is left
      with the policyholder falls once on each such claim.
    retention_applied: The standard method does not apply it at all, no line falling outside cover. Where more than
      one line falls outside cover and each was a visit of its own, what is left with the policyholder falls on
      each of those lines separately. Where lines fall outside cover and belong to one Medicare claim, what is left
      with the policyholder falls once on each such claim.
    liability_already_restated: Where an entry already stands restating one of the lines outside cover, the liability
      it has already taken back is deducted.
    liability_already_recovered: Where an entry already stands recording money recovered from the policyholder on
      one of those lines, the amount it records is deducted.
    already_taken_back: The standard method deducts nothing already taken back. Where an entry already stands restating
      one of the lines outside cover, the liability it has already taken back is deducted. Where an entry already
      stands recording money recovered from the policyholder on one of those lines, the amount it records is deducted.
    result: The liability of the lines restated is reduced by what is left with the policyholder and by what has
      already been taken back, the figure is rounded to the cent once at the end, and where those reductions exceed
      the liability nothing is restated.
  factors:
  - id: outside_cover_span
    effect: method
    decides: outside_cover_liability_span
    bindings:
    - months_since_effective
    - auto_paid_liability_all
    - auto_paid_liability_in_cover
    - auto_paid_liability_last_year
    - outside_cover_liability_span
    ladder:
    - when: the policy took effect within the period its paid lines fall in
      method: the lines counted are those the supplement paid whose date of service falls before the day the policy
        took effect
    - when: the policy stood ended and was afterwards put back in force
      method: the lines counted are those whose date of service falls in the twelve months to date but outside the
        period since it was put back in force
    - when: otherwise
      method: no line falls outside cover, the policy having been in force for every day its paid lines fall on
    baseline:
      outside_cover_liability_span: '0.0'
