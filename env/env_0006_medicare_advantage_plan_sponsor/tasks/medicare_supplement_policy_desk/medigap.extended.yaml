  baseline:
    rule: 'A Medicare Supplement policy settles nothing for a day it was not in force, so a crossover line the supplement
      has paid whose date of service falls on such a day is put right: what the supplement paid is taken back from
      whoever received it, and the liability the line records is restated to what the policyholder genuinely owes
      for that day. What is restated is the recorded liability of the lines that fall outside cover, less what the
      coverage that was in force on those days leaves the policyholder and less what has already been taken back.
      The lines that fall outside cover are found by comparing the date of service of each paid line with the day
      the policy took effect. The standard method finds no line outside cover, the policy having been in force for
      every day its paid lines fall on. The standard method restates every line that falls outside cover. The standard
      method takes nothing as the liability of those lines. The standard method leaves the policyholder nothing
      and restates the whole of the liability. The standard method does not apply it at all, no line falling outside
      cover. The standard method deducts nothing already taken back. The liability of the lines restated is reduced
      by what is left with the policyholder and by what has already been taken back, the figure is rounded to the
      cent once at the end, and where those reductions exceed the liability nothing is restated.'
