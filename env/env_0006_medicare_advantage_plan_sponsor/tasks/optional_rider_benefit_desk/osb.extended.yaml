      premium, every rider premium charge posted to the rider premium account is counted instead; where
      the rider stands in its waiting period, only the rider premium charges posted from the day benefits
      became payable are counted.
    payments_all: >-
      The money counted as having reached the rider premium account is the money posted to it within
      those same days of grace. Where the rider stands suspended for unpaid premium, every payment posted
      to the rider premium account is counted instead; where the rider stands ended, only the payments
      posted from the day the rider ended are counted.
    payments_in_grace: >-
      The money counted as having reached the rider premium account is the money posted to it within
      those same days of grace. Where the rider stands suspended for unpaid premium, every payment posted
      to the rider premium account is counted instead; where the rider stands ended, only the payments
      posted from the day the rider ended are counted.
    payments_counted: >-
      The money counted as having reached the rider premium account is the money posted to it within
      those same days of grace. Where the rider stands suspended for unpaid premium, every payment posted
      to the rider premium account is counted instead; where the rider stands ended, only the payments
      posted from the day the rider ended are counted.
    credits_all: >-
      The credits set off are the credits posted to the rider premium account within those same days
      of grace. Where the rider stands suspended for unpaid premium, every credit posted to the rider
      premium account is set off instead; where the rider stands ended, no credit is set off, a credit
      standing on an ended rider being paid back to the member.
    credits_in_grace: >-
      The credits set off are the credits posted to the rider premium account within those same days
      of grace. Where the rider stands suspended for unpaid premium, every credit posted to the rider
      premium account is set off instead; where the rider stands ended, no credit is set off, a credit
      standing on an ended rider being paid back to the member.
    credits_counted: >-
      The credits set off are the credits posted to the rider premium account within those same days
      of grace. Where the rider stands suspended for unpaid premium, every credit posted to the rider
      premium account is set off instead; where the rider stands ended, no credit is set off, a credit
      standing on an ended rider being paid back to the member.
    rider_span_months: >-
      The money left over on the medical plan bill is taken over every bill raised on the medical plan
      enrollment the rider hangs on. Where that enrollment does not stand in force and carries a day
      its coverage ended, it is taken over the bills raised up to that day; where that enrollment stands
      in force and the rider took effect after it did, it is taken over the bills raised from the day
      the rider took effect to the handling date.
    plan_paid_span: >-
      The money left over on the medical plan bill is taken over every bill raised on the medical plan
      enrollment the rider hangs on. Where that enrollment does not stand in force and carries a day
      its coverage ended, it is taken over the bills raised up to that day; where that enrollment stands
      in force and the rider took effect after it did, it is taken over the bills raised from the day
      the rider took effect to the handling date.
    plan_charged_span: >-
      The money left over on the medical plan bill is taken over every bill raised on the medical plan
      enrollment the rider hangs on. Where that enrollment does not stand in force and carries a day
      its coverage ended, it is taken over the bills raised up to that day; where that enrollment stands
      in force and the rider took effect after it did, it is taken over the bills raised from the day
      the rider took effect to the handling date.
    plan_status: >-
      The money left over on the medical plan bill is taken over every bill raised on the medical plan
      enrollment the rider hangs on. Where that enrollment does not stand in force and carries a day
      its coverage ended, it is taken over the bills raised up to that day; where that enrollment stands
      in force and the rider took effect after it did, it is taken over the bills raised from the day
      the rider took effect to the handling date.
    plan_paid: >-
      The money left over on the medical plan bill is taken over every bill raised on the medical plan
      enrollment the rider hangs on. Where that enrollment does not stand in force and carries a day
      its coverage ended, it is taken over the bills raised up to that day; where that enrollment stands
      in force and the rider took effect after it did, it is taken over the bills raised from the day
      the rider took effect to the handling date.
    plan_charged: >-
      The money left over on the medical plan bill is taken over every bill raised on the medical plan
      enrollment the rider hangs on. Where that enrollment does not stand in force and carries a day
      its coverage ended, it is taken over the bills raised up to that day; where that enrollment stands
      in force and the rider took effect after it did, it is taken over the bills raised from the day
      the rider took effect to the handling date.
    plan_bill_payments_seen: >-
      The money left over on the medical plan bill is what has been paid on it less the medical plan
      premium charged on it over the same span, and is never less than nothing. Nothing of it is carried
      to the rider premium account. Where the money left over comes to more than the rider premium charged
      that is counted, the rider premium charged that is counted is carried instead; where the medical
      plan bill carries money received against it and the money left over does not come to more than
      that, the whole of the money left over is carried.
    plan_bill_charges_seen: >-
      The money counted as having reached the rider premium account is the money posted to that account
      alone. Where what has been paid on the medical plan bill is above the medical plan premium charged
      on it, the money posted to that account is counted together with the money left over that is carried;
      where the medical plan bill carries medical plan premium charged on it and what has been paid
      on it is not above that, the shortfall on the bill is taken off the money posted to that account,
      the medical plan premium standing to be met first out of a combined payment.
    plan_surplus: >-
      The money left over on the medical plan bill is what has been paid on it less the medical plan
      premium charged on it over the same span, and is never less than nothing. Nothing of it is carried
      to the rider premium account. Where the money left over comes to more than the rider premium charged
      that is counted, the rider premium charged that is counted is carried instead; where the medical
      plan bill carries money received against it and the money left over does not come to more than
      that, the whole of the money left over is carried.
    surplus_counted: >-
      The money left over on the medical plan bill is what has been paid on it less the medical plan
      premium charged on it over the same span, and is never less than nothing. Nothing of it is carried
      to the rider premium account. Where the money left over comes to more than the rider premium charged
      that is counted, the rider premium charged that is counted is carried instead; where the medical
      plan bill carries money received against it and the money left over does not come to more than
      that, the whole of the money left over is carried.
    money_reaching_rider: >-
      The money counted as having reached the rider premium account is the money posted to that account
      alone. Where what has been paid on the medical plan bill is above the medical plan premium charged
      on it, the money posted to that account is counted together with the money left over that is carried;
      where the medical plan bill carries medical plan premium charged on it and what has been paid
      on it is not above that, the shortfall on the bill is taken off the money posted to that account,
      the medical plan premium standing to be met first out of a combined payment.
    result: >-
      The money a member is asked for to clear the rider premium they owe is the rider premium charged
      that is counted, less the money counted as having reached the rider premium account, less the
      credits set off; the figure is rounded to the nearest cent and is never less than nothing.
