- id: osb_premium_suspension_and_recovery
  subject:
  - osb_premium_suspension
  - osb_premium_suspension_cure
  rule: 'A rider premium unpaid past its grace period suspends the rider: it stops paying for services while the arrears stand, though the member keeps their medical plan untouched. The rider premium has been outstanding past the last day of the rider grace period counted from the day the plan posted the first unpaid rider premium charge. Calendar days are counted from the day after that posting date, every day of the week counts, the last day of the grace period is itself inside it, and full 24-hour periods are never used in place of calendar days. Suspension never affects the medical plan or any other rider: each rider stands or falls on its own premium, and a member in arrears on one is told exactly which cover is affected. Paying the arrears in full restores the rider from the day the money is posted, and services given while it was suspended stay the member''s own cost. A partial payment does not restore the rider, and the member is told what is still owed rather than being left to assume the rider is back. A rider left suspended past its grace period is terminated for non-payment, and on the tiers that permit no reinstatement the member must wait for the next annual election period to take it again. Months already served toward a waiting period are kept through a suspension that is cured, and lost only where the rider is terminated.'
  eligibility:
  - id: rider_grace_period_exhausted
    applies_to:
    - osb_premium_suspension
    kind: time
    condition: The rider premium has been outstanding past the last day of the rider grace period counted from the day the plan posted the first unpaid rider premium charge.
    evidence_fields:
    - osb_rider_premium_ledger.osb_rider_premium_entry_id
    - osb_rider_premium_ledger.posted_date
    - osb_riders.osb_rider_id
    - osb_riders.rider_premium_balance_due
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - osb_riders.osb_rider_id
        - osb_rider_premium_ledger.osb_rider_premium_entry_id
      action_bindings:
        osb_riders.osb_rider_id: osb_rider_id
        osb_rider_premium_ledger.osb_rider_premium_entry_id: osb_rider_premium_entry_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the day the plan posted the first unpaid rider premium charge
      anchor_source: osb_rider_premium_ledger.posted_date
      relation: not_before
      duration_source: variants.rider_premium_grace_period_days
      unit: calendar_days
      counting_rule: Calendar days are counted from the day after that posting date, every day of the week counts, the last day of the grace period is itself inside it, and full 24-hour periods are never used in place of calendar days.
      boundary: inclusive
  params:
    per_tier:
      Ridgecrest Preventive Dental Rider:
        rider_premium_grace_period_days: =rider_premium_grace_period_days
        rider_reinstatement_permitted: =rider_reinstatement_permitted
      Ridgecrest Vision Plus Rider:
        rider_premium_grace_period_days: =rider_premium_grace_period_days
        rider_reinstatement_permitted: =rider_reinstatement_permitted
      Ridgecrest Hearing Advantage Rider:
        rider_premium_grace_period_days: =rider_premium_grace_period_days
        rider_reinstatement_permitted: =rider_reinstatement_permitted
      Ridgecrest Comprehensive Dental Rider:
        rider_premium_grace_period_days: =rider_premium_grace_period_days
        rider_reinstatement_permitted: =rider_reinstatement_permitted
      Ridgecrest Premier Dental Rider:
        rider_premium_grace_period_days: =rider_premium_grace_period_days
        rider_reinstatement_permitted: =rider_reinstatement_permitted
      Ridgecrest Dental Vision Hearing Bundle Rider:
        rider_premium_grace_period_days: =rider_premium_grace_period_days
        rider_reinstatement_permitted: =rider_reinstatement_permitted
- id: osb_benefit_payment
  subject:
  - osb_benefit_claim_processed
  rule: 'The rider pays the share of the allowed amount its benefit category fixes for the tier held, always worked out from the allowed amount and never from what the provider charged. The rider stands at active on the date of service of the line. Any deductible the tier carries is met first, out of the categories the tier takes it on, before any coinsurance applies; preventive care is never subject to a deductible on any tier. Vision and hearing benefits are paid as flat allowances rather than percentages: the rider pays up to the frame, lens, contact lens or hearing aid allowance and the member pays the rest, and an unused part of an allowance is never paid out in cash. The rider pays nothing more once the benefit year''s annual maximum is reached, and a line that would cross it is paid only up to what is left; the member is told the remaining figure whenever they ask about treatment. A network provider may not bill the member above the allowed amount on the tiers that carry balance billing protection, and a member shown such a bill is told it is wrong and the provider is contacted. An out-of-network line is paid at the tier''s out-of-network share of the allowed amount, and where that share is zero the line is denied and the member is told which network providers are near them. Where the treatment plan value is above the tier''s predetermination threshold, an approved predetermination covering that service and still inside its validity period is on record. A claim reaching the plan more than the tier''s filing window after the date of service is denied with the reason filed_after_window, and the denial is explained to the member rather than simply recorded.'
  eligibility:
  - id: rider_in_force_on_service_date
    applies_to:
    - osb_benefit_claim_processed
    kind: state
    condition: The rider stands at active on the date of service of the line.
    evidence_fields:
    - osb_riders.osb_rider_id
    - osb_riders.status
    - osb_riders.benefits_available_from
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - osb_riders.osb_rider_id
      action_bindings:
        osb_riders.osb_rider_id: osb_rider_id
    state_contract:
      field: osb_riders.status
      allowed:
      - active
  - id: predetermination_on_record
    applies_to:
    - osb_benefit_claim_processed
    kind: authorization
    condition: Where the treatment plan value is above the tier's predetermination threshold, an approved predetermination covering that service and still inside its validity period is on record.
