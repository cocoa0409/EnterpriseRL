      of payments posted to the rider premium account. Where the money left standing on the medical
      plan bill comes to at least one month's rider premium, the coverage months already met are instead
      the whole months that money covers at the monthly rider premium the rider held carries; where
      that bill carries money received against it and the money left standing on it comes to less than
