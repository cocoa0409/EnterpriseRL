- id: osb_frequency_limitations
  subject:
  - osb_benefit_claim_processed
  rule: Each routine benefit has its own frequency limit, and the rider pays for it only while the limit still allows it in the benefit year or period the limit is counted on. Cleanings, examinations, radiograph sets and fluoride treatments are counted per benefit year, and the count resets on the first day of the new benefit year whatever was used the year before. Crowns, dentures, frames and hearing aids are counted on months that must pass since the last one the rider paid for, measured on the same tooth, the same eye or the same ear, so that two crowns on different teeth in one year are both paid. A service beyond its limit is denied with the reason frequency_limit_reached, and the member is told the exact date from which it would be paid again. A service the rider denied or reversed does not use up a frequency, so a member whose claim was put right does not lose a cleaning they never had. A member who asks how many cleanings they have left is told the figure and the date it resets, rather than being sent to their dentist to find out. Where a member changes rider part way through a benefit year, the frequencies already used under the old rider count against the new one, because the limit follows the member and not the record.
