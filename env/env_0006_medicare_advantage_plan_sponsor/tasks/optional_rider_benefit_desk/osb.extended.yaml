  computes: arrears_at_suspension
  target_tool: suspend_rider_for_unpaid_premium_a0d6b513
  params: {}
  rule: >-
    The rider premium standing owed when a rider is put into premium suspension is the rider premium
    charged that is struck, less the money struck against it, less the credits struck, rounded to the
    nearest cent and never less than nothing. The days of grace that govern the span the figure is struck
    over are the days of grace the rider held allows; this bears on the span alone and not on whether
    the days of grace have run out. Where the medical plan enrollment the rider hangs on allows more
    days of grace than the rider held, the days of grace that enrollment allows govern that span instead;
    where the rider stands ended, no days of grace govern it at all. The days of grace that govern are
    reckoned into whole months at thirty days to the month, any part month being dropped, and the span
    runs back over that many whole calendar months from the handling date, an entry posted in an earlier
    calendar month falling outside it; where no days of grace govern, the span is empty and no entry
    falls inside it. The rider premium charged that is struck is every rider premium charge posted to
    the rider premium account. Where the rider stands at active and the rider record carries no day
    it ended, only the rider premium charges posted within the span are struck; where the rider record
    carries a day the rider ended, only those posted from that day are struck. The money struck against
    the figure is every payment posted to the rider premium account. Where the rider stands at active
    and the rider record carries no day it ended, only the payments posted within the span are struck;
    where the rider stands in its waiting period, only those posted from the day benefits became payable
    are struck. The credits struck are every credit posted to the rider premium account. Where the rider
    stands at active and the rider record carries no day it ended, only the credits posted within the
    span are struck; where the rider stands ended, no credit is struck at all. The figure taken is the
    one the rider record shows standing owed. Where the figure the rider record shows standing owed
    is not the one the entries struck give and the rider stands at active, the figure taken is instead
    the one those entries give; where the rider stands ended, it is what every charge on the account
    comes to less every payment and every credit on it. The rider premium standing owed is not struck
    until every billing cycle the rider has been in force through carries a rider premium charge on
    the rider premium account.
  prerequisite:
  - problem: osb_ext_unbilled_cycle_premium_charge
    kind: value_input
    gate: charges_counted
    form: state
    policy_source: >-
      The rider premium standing owed is not struck until every billing cycle the rider has been in
      force through carries a rider premium charge on the rider premium account.
    condition: >-
