    note: >-
      Decides the coverage-months-carried factor and the months-charged-before-cover factor from the
      medical plan enrollment the rider is billed with.
  compute:
  - charge_relieved: MAX('osb_rider_premium_ledger','amount', event_type='osb_rider_premium_charge')
  - plan_status: CFIELD('advantage','status')
  - plan_cycle: CFIELD('advantage','premium_billing_frequency')
  - charge_months: >-
      3 if (plan_status=='active' and plan_cycle=='quarterly') else (MX(1, MONTHS(F('request_received_date'),
      NOW)) if (plan_status!='active' and charge_relieved>0) else 1)
  - rate_credited: >-
      RND(charge_relieved / charge_months, 2) if charge_months>1 else (P('monthly_rider_premium') if
      charge_relieved>P('monthly_rider_premium') else charge_relieved)
  - plan_started: CFIELD('advantage','coverage_effective_date')
  - months_before_cover: >-
      MX(0, MONTHS(plan_started, F('rider_effective_date'))) if F('rider_effective_date')>plan_started
      else (0 if plan_status!='active' else MX(0, MONTHS(F('rider_effective_date'), F('benefits_available_from'))))
  - credit_before_cap: RND(rate_credited * months_before_cover, 2)
  - credits_already_posted: SUM('osb_rider_premium_ledger','amount', event_type='osb_rider_premium_credit')
  - credit_ceiling: >-
      charge_relieved if F('status')=='premium_suspended' else (0.0 if F('rider_end_date')!='' else
      MX(0.0, charge_relieved - credits_already_posted))
  - result: RND(MN(credit_before_cap, credit_ceiling), 2)
