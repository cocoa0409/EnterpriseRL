- id: osb_ext_precover_premium_credit
  base_policy_refs:
  - osb_rider_premium_billing_and_posting
  - osb_rider_enrollment
  overwrite: []
  trigger: state_due
  subject:
  - osb_rider_premium_credit
  computes: credit_amount
  target_tool: post_rider_premium_credit_050a58f6
  params: {}
  rule: >-
    Rider premium charged for a coverage month beginning before the day the rider took effect is owed
    back to the member, and is relieved by a credit against the single rider premium charge that carried
    it. The charge put right is the rider premium charge carrying the most money of any standing on
    the rider premium account. The coverage months one rider premium charge carries are the single coverage
    month it is booked to. Where the medical plan enrollment the rider hangs on stands in force and
    is billed quarterly, the charge carries three coverage months instead; where that enrollment does
    not stand in force and a rider premium charge stands on the rider premium account, it carries the
    whole calendar months from the day the plan received the rider request to the handling date. The
    rate each coverage month is credited at is the amount of the charge being put right. Where that
    charge carries more than one coverage month, the rate is instead that amount divided by the coverage
    months it carries, rounded to the nearest cent; where it carries a single coverage month and its
    amount is above the monthly rider premium the rider held carries, the rate is the monthly rider
    premium the rider held carries. The coverage months charged before cover began are the whole calendar
    months from the day the rider took effect to the day benefits became payable. Where the rider took
    effect after the medical plan enrollment it hangs on took effect, they are instead the whole calendar
    months from the day that enrollment took effect to the day the rider took effect; where the rider
    took effect no later than that enrollment did and that enrollment does not stand in force, no coverage
    month counts as charged before cover began. The credit before any ceiling is the rate each coverage
    month is credited at multiplied by the coverage months charged before cover began, rounded to the
    nearest cent. The ceiling on the credit is the amount of the charge being put right less the credits
    already posted to the rider premium account, and is never less than nothing. Where the rider stands
    suspended for unpaid premium, the ceiling is instead the whole of the charge being put right, the
    whole of it standing to be relieved while the premium is owed; where the rider record carries a
    day the rider ended, nothing further is credited, what was owed having been settled when the rider
    was closed. The credit posted is the lesser of the credit before any ceiling and that ceiling, rounded
    to the nearest cent, and a credit never exceeds the charge it relieves.
