- id: osb_ext_unbilled_cycle_premium_charge
  base_policy_refs:
  - osb_rider_premium_billing_and_posting
  - osb_waiting_period
  overwrite:
  - base_policy: osb_rider_premium_billing_and_posting
    superseded_clause: >-
      The rider premium is charged for each coverage month from the rider effective date to the rider
      end date, and on the tiers that bill it with the plan it appears as its own line on the medical
      plan bill.
    replaced_by: >-
      The coverage months one rider premium charge carries are the single coverage month it is booked
      to.
  trigger: state_due
  subject:
  - osb_rider_premium_charge
  computes: charge_amount
  target_tool: post_rider_premium_charge_4237e97e
  params: {}
  rule: >-
    The rider premium the plan raises for coverage a member has been in force for but has not yet been
    billed for is the monthly rider premium the rider held carries, multiplied by the coverage months
    charged, rounded to the nearest cent. The coverage months one rider premium charge carries are the
    single coverage month it is booked to. Where the medical plan enrollment the rider hangs on stands
    in force and is billed quarterly, one charge carries three coverage months instead; where that enrollment
    does not stand in force and a rider premium charge already stands on the rider premium account,
    it carries the whole calendar months from the day the rider took effect to the handling date, and
    never fewer than one. The coverage months not yet billed are the whole calendar months from the
    day the rider took effect to the handling date, the month the rider took effect in counting as one
    of them. Where a rider premium charge already stands on the rider premium account and the rider
    record carries no day the rider ended, the coverage months not yet billed are instead a whole cycle's
    worth once as long as a cycle has passed since the last charge was posted, and none before then;
    where a rider premium charge already stands and the rider record carries a day the rider ended,
    they are the whole calendar months from the day the last charge was posted to that day. The most
    coverage months one charge may carry is the whole calendar months from the day benefits became payable
    to the handling date. Where the rider stands at active and the rider record carries no day it ended,
    the most one charge may carry is instead a benefit year's worth of twelve coverage months; where
    the rider stands suspended for unpaid premium, it is the coverage months the days of grace the rider
    held allows cover, reckoned in whole months at thirty days to the month. The coverage months already
    met out of money standing on the medical plan bill are the number of payments posted to the rider
    premium account. Where the money left standing on the medical plan bill comes to at least one month's
    rider premium, the coverage months already met are instead the whole months that money covers at
    the monthly rider premium the rider held carries; where that bill carries money received against
    it and the money left standing on it comes to less than one month's rider premium, no coverage month
    is met out of it. The money left standing on the medical plan bill is what has been paid on it less
    the medical plan premium charged on it, and is never less than nothing. The coverage months charged
    are the lesser of the coverage months not yet billed and the most one charge may carry, less the
    coverage months already met, and never fewer than none.
  prerequisite: []
  cross_category:
  - category: advantage
    as: history
    reads:
    - status
    - premium_billing_frequency
    - advantage_premium_ledger.amount
    - advantage_premium_ledger.event_type
    note: >-
      Decides the cycle-length factor from the medical plan enrollment's billing frequency and the coverage-months-met
      factor from the money left standing on that enrollment's own premium ledger.
  compute:
  - plan_status: CFIELD('advantage','status')
  - plan_cycle: CFIELD('advantage','premium_billing_frequency')
  - last_charge_posted: >-
      LATEST('osb_rider_premium_ledger','posted_date', date_field='posted_date', event_type='osb_rider_premium_charge')
  - charges_raised: COUNT('osb_rider_premium_ledger', event_type='osb_rider_premium_charge')
  - cycle_months: >-
      3 if (plan_status=='active' and plan_cycle=='quarterly') else (MX(1, MONTHS(F('rider_effective_date'),
      NOW)) if (plan_status!='active' and charges_raised>0) else 1)
  - months_unbilled: >-
      (cycle_months if MONTHS(last_charge_posted, NOW)>=cycle_months else 0) if (charges_raised>0 and
      F('rider_end_date')=='') else (MX(0, MONTHS(last_charge_posted, F('rider_end_date'))) if charges_raised>0
      else MX(0, MONTHS(F('rider_effective_date'), NOW) + 1))
  - months_ceiling: >-
      12 if (F('status')=='active' and F('rider_end_date')=='') else (MX(0, int(P('rider_premium_grace_period_days')
      / 30)) if F('status')=='premium_suspended' else MX(0, MONTHS(F('benefits_available_from'), NOW)))
  - plan_paid: XSUM('advantage','advantage_premium_ledger','amount', event_type='advantage_premium_payment')
  - plan_charged: XSUM('advantage','advantage_premium_ledger','amount', event_type='advantage_premium_charge')
  - bill_money_left: MX(0.0, RND(plan_paid - plan_charged, 2))
  - payments_made: COUNT('osb_rider_premium_ledger', event_type='osb_rider_premium_payment')
  - plan_bill_payments_seen: XCOUNT('advantage','advantage_premium_ledger', event_type='advantage_premium_payment')
  - months_met_from_bill: >-
      int(bill_money_left / P('monthly_rider_premium')) if bill_money_left>=P('monthly_rider_premium')
      else (0 if plan_bill_payments_seen>0 else payments_made)
  - months_charged: MX(0, MN(months_unbilled, months_ceiling) - months_met_from_bill)
  - result: RND(P('monthly_rider_premium') * months_charged, 2)
  compute_basis:
