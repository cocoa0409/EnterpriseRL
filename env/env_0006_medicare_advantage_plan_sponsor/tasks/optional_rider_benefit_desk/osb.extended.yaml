    the member is left owing on it; the line put right is the settled line marked as adjusted carrying
    the most money of any on the member's benefit history. The whole of the allowed amount the line
    carries is taken as the benefit basis. Where the line was given by a provider outside the network
    and the rider held carries an out-of-network share above nil, that share of the allowed amount is
    taken as the benefit basis instead; where the line was given by a provider outside the network and
    the rider held carries no out-of-network share, nothing is taken as the benefit basis. A benefit
    category may carry a flat allowance: the allowance for a hearing aid for one ear on a hearing aid,
    the frame allowance on a set of eyeglass frames, the lens allowance on a pair of spectacle lenses
    and the contact lens allowance on contact lenses worn instead of spectacles, every other benefit
    category carrying no flat allowance. The benefit that properly stands on the line is the coinsurance
    percentage the line's benefit category carries taken on the benefit basis, rounded to the nearest
