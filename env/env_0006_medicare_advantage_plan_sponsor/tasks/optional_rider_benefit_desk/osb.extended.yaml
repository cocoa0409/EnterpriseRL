- id: osb_termination_and_cancellation
  subject:
  - osb_rider_termination
  rule: A rider ends when the member cancels it, when the medical plan it hangs on ends, or when its premium is never paid. The rider cancellation is recorded on a rider service intake with the request action rider_cancellation and an intake status of recorded, awaiting_member_signature or under_review. Only the member may cancel a rider they are paying for, and the cancellation takes effect on the date the tier's cancellation rule produces from the day the request was received. A rider may not be cancelled before the tier's minimum holding months have passed, and a member asking earlier is told the date they may cancel and what they would otherwise still owe. When the medical plan ends the rider ends on the same day without the member having to ask, and the rider premium for months after that day is credited back. Services given on or before the rider end date are still paid even where the claim reaches the plan afterwards, so a member who had treatment on their last covered day keeps the benefit. Ending a rider does not end the allowance card or the medical plan, and a member who meant to end everything is asked plainly which cover they want stopped.
