# ============================================================================
# extended_policies: the multi-factor calculation policies this difficulty adds
# ============================================================================
extended_policies:
- id: osb_ext_rider_benefit_line_settlement
  base_policy_refs:
  - osb_benefit_payment
  - osb_frequency_limitations
  - osb_agg_combined_rider_maximum
  - osb_coordination_with_medical_plan
  - osb_predetermination_and_appeal
  - osb_premium_suspension_and_recovery
  overwrite:
  - base_policy: osb_benefit_payment
    superseded_clause: >-
      An out-of-network line is paid at the tier's out-of-network share of the allowed amount, and where
      that share is zero the line is denied and the member is told which network providers are near
      them.
    replaced_by: >-
      Where the line was given by a provider outside the network and the rider held carries an out-of-network
      share above nil, that share of it is carried into the benefit calculation instead; where the line
      was given by a provider outside the network and the rider held carries no out-of-network share,
      nothing is carried into the benefit calculation and no benefit is paid on the line.
  - base_policy: osb_benefit_payment
    superseded_clause: >-
      The rider pays nothing more once the benefit year's annual maximum is reached, and a line that
      would cross it is paid only up to what is left; the member is told the remaining figure whenever
      they ask about treatment.
    replaced_by: >-
      What is left of the benefit year's maximum is the benefit year's maximum the rider held carries
      less the benefit already paid in the benefit year, and is never less than nothing.
  - base_policy: osb_premium_suspension_and_recovery
    superseded_clause: services given while it was suspended stay the member's own cost
    replaced_by: >-
      A benefit is not settled on a submitted line until the rider it is claimed under stands in force
      with no rider premium outstanding against it.
  trigger: state_due
  subject:
  - osb_benefit_claim_processed
  computes: rider_paid_amount
  target_tool: settle_rider_benefit_line_e49937be
  params: {}
  rule: >-
    The benefit a rider pays on a submitted line is worked out from the allowed amount the line carries
    and never from what the provider charged. The amount the benefit is taken from is the allowed amount
    carried by the line standing on the member's benefit history awaiting a decision. Where the plan
    has answered a treatment plan sent before the work began by approving it in part, the amount the
    benefit is taken from is instead the lesser of that allowed amount and the treatment plan value
    the plan approved; where the plan has answered no treatment plan at all and that allowed amount
    is above the treatment plan value above which the rider held requires one, no amount is taken and
    the work is the member's own cost. The whole of the amount the benefit is taken from is carried
    into the benefit calculation. Where the line was given by a provider outside the network and the
    rider held carries an out-of-network share above nil, that share of it is carried into the benefit
    calculation instead; where the line was given by a provider outside the network and the rider held
    carries no out-of-network share, nothing is carried into the benefit calculation and no benefit
    is paid on the line. The benefit year's deductible the rider held carries is taken off what is carried
    into the benefit calculation before any share is applied, on the benefit categories the rider takes
    its deductible on and only while the rider has paid no line in such a category in the benefit year;
    preventive care is never subject to a deductible. The share taken is the coinsurance percentage
    the rider held carries for the line's benefit category: the preventive share on preventive dental
    care, the basic restorative share on basic restorative dental care, the major restorative share
    on major restorative dental care, the root canal share on endodontic treatment, the gum treatment
    share on periodontic treatment, the oral surgery share on oral surgery, the denture share on dentures
    and the implant share on implants, and a benefit category the rider held carries no coinsurance
    percentage for is not paid at all. The benefit is that share of what is left after the deductible,
    rounded to the nearest cent. A benefit category may instead carry a flat allowance: the allowance
    for a hearing aid for one ear on a hearing aid, the frame allowance on a set of eyeglass frames,
    the lens allowance on a pair of spectacle lenses and the contact lens allowance on contact lenses
    worn instead of spectacles, every other benefit category carrying no flat allowance. Where the line's
    benefit category carries a flat allowance, the benefit is the lesser of what is carried into the
    benefit calculation and that flat allowance and no percentage is taken; where the line is a hearing
    examination, the benefit is what is carried into the benefit calculation less the hearing examination
    copayment the rider held carries. Every line counted is one the rider record itself carries, that
    record covering a single benefit year. The benefit already paid in the benefit year is the figure
    the rider record shows used toward the benefit year's maximum. Where a reversal stands on the member's
    benefit history against a settled line, the benefit already paid in the benefit year is instead
    what the rider paid on the lines it has settled in the benefit year less what those reversals backed
    out; where no such reversal stands but the figure the rider record shows used toward the benefit
    year's maximum is not what the rider paid on the lines it has settled in the benefit year, the benefit
    already paid in the benefit year is what the rider paid on those settled lines. What is left of
    the benefit year's maximum is the benefit year's maximum the rider held carries less the benefit
    already paid in the benefit year, and is never less than nothing. The figure booked is the lesser
    of the benefit so worked out and what is left of the benefit year's maximum, rounded to the nearest
    cent. A benefit is not settled on a submitted line until the rider it is claimed under stands in
    force with no rider premium outstanding against it. What is left of the benefit year's maximum is
    not worked out before a reversal stands on the member's benefit history against every settled line
    the plan has marked as adjusted.
  prerequisite:
  - problem: osb_ext_rider_arrears_settlement
    kind: state_gate
    gate: osb_riders.status
    form: state
    policy_source: >-
      A benefit is not settled on a submitted line until the rider it is claimed under stands in force
      with no rider premium outstanding against it.
    condition: The rider carries status active and a rider premium balance due of nothing.
    resolved_by: pay_rider_premium_by_telephone_9597e982
    effect: >-
      The rider's own record moves from premium_suspended to active and the rider premium balance due
      standing on it falls to nothing, so the rider stands in force with no rider premium outstanding
      against it and the benefit on the submitted line may be settled.
  - problem: osb_ext_adjusted_line_restatement
    kind: value_input
    gate: benefit_used
    form: state
    policy_source: >-
      What is left of the benefit year's maximum is not worked out before a reversal stands on the member's
      benefit history against every settled line the plan has marked as adjusted.
    condition: >-
      Every osb_benefit_claims row on the rider whose claim_status is adjusted is named as the source_claim_id
      of an osb_benefit_claim_reversal row.
    resolved_by: reverse_rider_benefit_line_9daedfb7
    effect: >-
      The binding benefit_used falls by the benefit the backed-out line had used, so that what is left
      of the benefit year's maximum rises by the same amount.
  cross_category: []
  compute:
  - line_allowed: SUM('osb_benefit_claims','allowed_amount', claim_status='pended')
  - line_category: >-
      LATEST('osb_benefit_claims','service_category', date_field='date_of_service', claim_status='pended')
  - line_network: >-
      LATEST('osb_benefit_claims','network_status', date_field='date_of_service', claim_status='pended')
  - predet_outcome: >-
      LATEST('osb_rider_requests','predetermination_outcome', date_field='decision_date', request_action='predetermination')
  - predet_value: >-
      LATEST('osb_rider_requests','predetermination_amount', date_field='decision_date', request_action='predetermination')
  - benefit_basis: >-
      MN(line_allowed, predet_value) if predet_outcome=='partially_approved' else (0.0 if (predet_outcome!='approved'
      and line_allowed>P('predetermination_required_above')) else line_allowed)
  - network_share: >-
      P('out_of_network_reimbursement_percent') if (line_network=='out_of_network' and P('out_of_network_reimbursement_percent')>0)
      else (0.0 if line_network=='out_of_network' else 100.0)
  - basis_after_network: RND(benefit_basis * network_share / 100.0, 2)
  - item_allowance: >-
      P('hearing_aid_allowance_per_ear') if line_category=='hearing_aid_device' else (P('frame_allowance')
      if line_category=='eyeglass_frame' else (P('lens_allowance') if line_category=='eyeglass_lens'
      else (P('contact_lens_allowance') if line_category=='contact_lens' else 0.0)))
  - category_share: >-
      P('preventive_coinsurance_percent') if line_category=='preventive_dental' else (P('basic_restorative_coinsurance_percent')
      if line_category=='basic_restorative_dental' else (P('major_restorative_coinsurance_percent')
      if line_category=='major_restorative_dental' else (P('endodontic_coinsurance_percent') if line_category=='endodontic'
      else (P('periodontic_coinsurance_percent') if line_category=='periodontic' else (P('oral_surgery_coinsurance_percent')
      if line_category=='oral_surgery' else (P('denture_coinsurance_percent') if line_category=='denture'
      else (P('dental_implant_coinsurance_percent') if line_category=='dental_implant' else 0.0)))))))
  - deductible_lines_paid: >-
      COUNT('osb_benefit_claims', claim_status='paid', service_category='basic_restorative_dental')
      + COUNT('osb_benefit_claims', claim_status='paid', service_category='major_restorative_dental')
      + COUNT('osb_benefit_claims', claim_status='paid', service_category='endodontic') + COUNT('osb_benefit_claims',
      claim_status='paid', service_category='periodontic') + COUNT('osb_benefit_claims', claim_status='paid',
      service_category='oral_surgery') + COUNT('osb_benefit_claims', claim_status='paid', service_category='denture')
      + COUNT('osb_benefit_claims', claim_status='paid', service_category='dental_implant')
  - deductible_due: >-
      P('annual_deductible') if ((line_category=='basic_restorative_dental' or line_category=='major_restorative_dental'
      or line_category=='endodontic' or line_category=='periodontic' or line_category=='oral_surgery'
      or line_category=='denture' or line_category=='dental_implant') and deductible_lines_paid==0)
      else 0.0
  - category_benefit: >-
      MN(MX(0.0, basis_after_network - deductible_due), item_allowance) if item_allowance>0 else (MX(0.0,
      basis_after_network - P('hearing_exam_copay')) if line_category=='hearing_exam' else RND(MX(0.0,
      basis_after_network - deductible_due) * category_share / 100.0, 2))
  - benefit_used_recorded: F('annual_maximum_used')
  - benefit_settled_lines: >-
      SUM('osb_benefit_claims','rider_paid_amount', claim_status='paid') + SUM('osb_benefit_claims','rider_paid_amount',
      claim_status='adjusted')
  - benefit_after_reversals: >-
      RND(benefit_settled_lines + SUM('osb_benefit_claims','rider_paid_amount', claim_status='reversed'),
      2)
  - lines_backed_out: COUNT('osb_benefit_claims', claim_status='reversed')
  - benefit_used: >-
      benefit_after_reversals if lines_backed_out>0 else (benefit_settled_lines if benefit_used_recorded!=benefit_settled_lines
      else benefit_used_recorded)
  - maximum_left: MX(0.0, RND(P('annual_benefit_maximum') - benefit_used, 2))
  - result: RND(MN(category_benefit, maximum_left), 2)
  compute_basis:
    line_allowed: >-
      The amount the benefit is taken from is the allowed amount carried by the line standing on the
      member's benefit history awaiting a decision.
    line_category: >-
      The share taken is the coinsurance percentage the rider held carries for the line's benefit category
    line_network: >-
      Where the line was given by a provider outside the network and the rider held carries an out-of-network
      share above nil, that share of it is carried into the benefit calculation instead
    predet_outcome: >-
      Where the plan has answered a treatment plan sent before the work began by approving it in part,
      the amount the benefit is taken from is instead the lesser of that allowed amount and the treatment
      plan value the plan approved; where the plan has answered no treatment plan at all and that allowed
      amount is above the treatment plan value above which the rider held requires one, no amount is
      taken and the work is the member's own cost.
    predet_value: >-
      Where the plan has answered a treatment plan sent before the work began by approving it in part,
      the amount the benefit is taken from is instead the lesser of that allowed amount and the treatment
      plan value the plan approved; where the plan has answered no treatment plan at all and that allowed
      amount is above the treatment plan value above which the rider held requires one, no amount is
      taken and the work is the member's own cost.
    benefit_basis: >-
      Where the plan has answered a treatment plan sent before the work began by approving it in part,
      the amount the benefit is taken from is instead the lesser of that allowed amount and the treatment
      plan value the plan approved; where the plan has answered no treatment plan at all and that allowed
      amount is above the treatment plan value above which the rider held requires one, no amount is
      taken and the work is the member's own cost.
    network_share: >-
      The whole of the amount the benefit is taken from is carried into the benefit calculation. Where
      the line was given by a provider outside the network and the rider held carries an out-of-network
      share above nil, that share of it is carried into the benefit calculation instead; where the line
      was given by a provider outside the network and the rider held carries no out-of-network share,
      nothing is carried into the benefit calculation and no benefit is paid on the line.
    basis_after_network: >-
      The whole of the amount the benefit is taken from is carried into the benefit calculation. Where
      the line was given by a provider outside the network and the rider held carries an out-of-network
      share above nil, that share of it is carried into the benefit calculation instead; where the line
      was given by a provider outside the network and the rider held carries no out-of-network share,
      nothing is carried into the benefit calculation and no benefit is paid on the line.
    item_allowance: >-
      A benefit category may instead carry a flat allowance: the allowance for a hearing aid for one
      ear on a hearing aid, the frame allowance on a set of eyeglass frames, the lens allowance on a
      pair of spectacle lenses and the contact lens allowance on contact lenses worn instead of spectacles,
      every other benefit category carrying no flat allowance.
    category_share: >-
      The share taken is the coinsurance percentage the rider held carries for the line's benefit category
    deductible_lines_paid: >-
      The benefit year's deductible the rider held carries is taken off what is carried into the benefit
      calculation before any share is applied, on the benefit categories the rider takes its deductible
      on and only while the rider has paid no line in such a category in the benefit year; preventive
      care is never subject to a deductible.
    deductible_due: >-
      The benefit year's deductible the rider held carries is taken off what is carried into the benefit
      calculation before any share is applied, on the benefit categories the rider takes its deductible
      on and only while the rider has paid no line in such a category in the benefit year; preventive
      care is never subject to a deductible.
    category_benefit: >-
      Where the line's benefit category carries a flat allowance, the benefit is the lesser of what
      is carried into the benefit calculation and that flat allowance and no percentage is taken; where
      the line is a hearing examination, the benefit is what is carried into the benefit calculation
      less the hearing examination copayment the rider held carries.
    benefit_used_recorded: >-
      Every line counted is one the rider record itself carries, that record covering a single benefit
      year. The benefit already paid in the benefit year is the figure the rider record shows used toward
      the benefit year's maximum. Where a reversal stands on the member's benefit history against a
      settled line, the benefit already paid in the benefit year is instead what the rider paid on the
      lines it has settled in the benefit year less what those reversals backed out; where no such reversal
      stands but the figure the rider record shows used toward the benefit year's maximum is not what
      the rider paid on the lines it has settled in the benefit year, the benefit already paid in the
      benefit year is what the rider paid on those settled lines.
    benefit_settled_lines: >-
      Every line counted is one the rider record itself carries, that record covering a single benefit
      year. The benefit already paid in the benefit year is the figure the rider record shows used toward
      the benefit year's maximum. Where a reversal stands on the member's benefit history against a
      settled line, the benefit already paid in the benefit year is instead what the rider paid on the
      lines it has settled in the benefit year less what those reversals backed out; where no such reversal
      stands but the figure the rider record shows used toward the benefit year's maximum is not what
      the rider paid on the lines it has settled in the benefit year, the benefit already paid in the
      benefit year is what the rider paid on those settled lines.
    benefit_after_reversals: >-
      Every line counted is one the rider record itself carries, that record covering a single benefit
      year. The benefit already paid in the benefit year is the figure the rider record shows used toward
      the benefit year's maximum. Where a reversal stands on the member's benefit history against a
      settled line, the benefit already paid in the benefit year is instead what the rider paid on the
      lines it has settled in the benefit year less what those reversals backed out; where no such reversal
      stands but the figure the rider record shows used toward the benefit year's maximum is not what
      the rider paid on the lines it has settled in the benefit year, the benefit already paid in the
      benefit year is what the rider paid on those settled lines.
    lines_backed_out: >-
      Every line counted is one the rider record itself carries, that record covering a single benefit
      year. The benefit already paid in the benefit year is the figure the rider record shows used toward
      the benefit year's maximum. Where a reversal stands on the member's benefit history against a
      settled line, the benefit already paid in the benefit year is instead what the rider paid on the
      lines it has settled in the benefit year less what those reversals backed out; where no such reversal
      stands but the figure the rider record shows used toward the benefit year's maximum is not what
      the rider paid on the lines it has settled in the benefit year, the benefit already paid in the
      benefit year is what the rider paid on those settled lines.
    benefit_used: >-
      Every line counted is one the rider record itself carries, that record covering a single benefit
      year. The benefit already paid in the benefit year is the figure the rider record shows used toward
      the benefit year's maximum. Where a reversal stands on the member's benefit history against a
      settled line, the benefit already paid in the benefit year is instead what the rider paid on the
      lines it has settled in the benefit year less what those reversals backed out; where no such reversal
      stands but the figure the rider record shows used toward the benefit year's maximum is not what
      the rider paid on the lines it has settled in the benefit year, the benefit already paid in the
      benefit year is what the rider paid on those settled lines.
    maximum_left: >-
      What is left of the benefit year's maximum is the benefit year's maximum the rider held carries
      less the benefit already paid in the benefit year, and is never less than nothing.
    result: >-
      The figure booked is the lesser of the benefit so worked out and what is left of the benefit year's
      maximum, rounded to the nearest cent.
  factors:
  - id: approved_treatment_plan_basis
    effect: parameter
    decides: benefit_basis
    bindings:
    - predet_outcome
    - predet_value
    - benefit_basis
    ladder:
    - when: the plan has answered a treatment plan sent before the work began by approving it in part
      value: the lesser of the line's allowed amount and the treatment plan value the plan approved
    - when: >-
        the plan has answered no treatment plan at all and the line's allowed amount is above the treatment
        plan value above which the rider held requires one
      value: nothing, the work being the member's own cost
    - when: otherwise
      value: the allowed amount carried by the line awaiting a decision
    baseline:
      benefit_basis: line_allowed
    evidence:
    - history
    - cross_category
  - id: provider_network_share
    effect: parameter
    decides: network_share
    bindings:
    - line_network
    - network_share
    ladder:
    - when: >-
        the line was given by a provider outside the network and the rider held carries an out-of-network
        share above nil
      value: the out-of-network share the rider held carries
    - when: >-
        the line was given by a provider outside the network and the rider held carries no out-of-network
        share
      value: nothing, no benefit being paid on the line
    - when: otherwise, the line having been given by a provider inside the network
      value: the whole of the amount the benefit is taken from
    baseline:
      network_share: '100.0'
    evidence:
    - history
    - tier_param
  - id: item_flat_allowance
    effect: parameter
    decides: item_allowance
    bindings:
    - line_category
    - item_allowance
    ladder:
    - when: the line is a hearing aid
      value: the allowance for a hearing aid for one ear the rider held carries
    - when: the line is a set of eyeglass frames
      value: the frame allowance the rider held carries
    - when: the line is a pair of spectacle lenses
      value: the lens allowance the rider held carries
    - when: the line is contact lenses worn instead of spectacles
      value: the contact lens allowance the rider held carries
    - when: otherwise
      value: nothing, the benefit category carrying no flat allowance
    baseline:
      item_allowance: '0.0'
    evidence:
    - history
    - tier_param
  - id: category_benefit_method
    effect: method
    decides: category_benefit
    bindings:
    - category_share
    - deductible_lines_paid
    - deductible_due
    - category_benefit
    ladder:
    - when: the line's benefit category carries a flat allowance
      method: >-
        the benefit is the lesser of what is carried into the benefit calculation and that flat allowance,
        and no percentage is taken
    - when: the line is a hearing examination
      method: >-
        the benefit is what is carried into the benefit calculation less the hearing examination copayment
        the rider held carries
    - when: otherwise
      method: >-
        the benefit year's deductible is taken off first where it is due, the coinsurance percentage
        the line's benefit category carries is taken on what is left, and the result is rounded to the
        nearest cent
    baseline:
      category_benefit: RND(MX(0.0, basis_after_network - deductible_due) * category_share / 100.0,
        2)
    evidence:
    - history
    - tier_param
  - id: benefit_used_basis
    effect: method
    decides: benefit_used
    bindings:
    - benefit_used_recorded
    - benefit_settled_lines
    - benefit_after_reversals
    - lines_backed_out
    - benefit_used
    ladder:
    - when: a reversal stands on the member's benefit history against a settled line
      method: >-
        the benefit already paid in the benefit year is what the rider paid on the lines it has settled
        in the benefit year less what those reversals backed out
    - when: >-
        no such reversal stands and the figure the rider record shows used toward the benefit year's
        maximum is not what the rider paid on the lines it has settled in the benefit year
      method: the benefit already paid in the benefit year is what the rider paid on those settled lines
    - when: otherwise
      method: >-
        the benefit already paid in the benefit year is the figure the rider record shows used toward
        the benefit year's maximum
    baseline:
      benefit_used: benefit_used_recorded
    evidence:
    - history
  baseline:
    rule: >-
      The benefit a rider pays on a submitted line is worked out from the allowed amount the line carries
      and never from what the provider charged. The amount the benefit is taken from is the allowed
      amount carried by the line standing on the member's benefit history awaiting a decision. The whole
      of the amount the benefit is taken from is carried into the benefit calculation. The benefit year's
      deductible the rider held carries is taken off what is carried into the benefit calculation before
      any share is applied, on the benefit categories the rider takes its deductible on and only while
      the rider has paid no line in such a category in the benefit year; preventive care is never subject
      to a deductible. The share taken is the coinsurance percentage the rider held carries for the
      line's benefit category: the preventive share on preventive dental care, the basic restorative
      share on basic restorative dental care, the major restorative share on major restorative dental
      care, the root canal share on endodontic treatment, the gum treatment share on periodontic treatment,
      the oral surgery share on oral surgery, the denture share on dentures and the implant share on
      implants, and a benefit category the rider held carries no coinsurance percentage for is not paid
      at all. The benefit is that share of what is left after the deductible, rounded to the nearest
      cent. Every line counted is one the rider record itself carries, that record covering a single
      benefit year. The benefit already paid in the benefit year is the figure the rider record shows
      used toward the benefit year's maximum. What is left of the benefit year's maximum is the benefit
      year's maximum the rider held carries less the benefit already paid in the benefit year, and is
      never less than nothing. The figure booked is the lesser of the benefit so worked out and what
      is left of the benefit year's maximum, rounded to the nearest cent.
    params:
    - annual_benefit_maximum
    - annual_deductible
    - preventive_coinsurance_percent
    - basic_restorative_coinsurance_percent
    - major_restorative_coinsurance_percent
    - endodontic_coinsurance_percent
    - periodontic_coinsurance_percent
    - oral_surgery_coinsurance_percent
    - denture_coinsurance_percent
    - dental_implant_coinsurance_percent
    - deductible_applies_to_categories
  inputs:
    history:
    - table: osb_benefit_claims
      aggregate: sum
      field: allowed_amount
      within_months: null
      filters:
        claim_status: pended
    - table: osb_benefit_claims
      aggregate: sum
      field: rider_paid_amount
      within_months: null
      filters:
        claim_status: paid
    - table: osb_benefit_claims
      aggregate: sum
      field: rider_paid_amount
      within_months: null
      filters:
        claim_status: reversed
    - table: osb_rider_requests
      aggregate: latest
      field: predetermination_outcome
      within_months: null
      filters:
        request_action: predetermination
    cross_category: []
- id: osb_ext_rider_arrears_settlement
  base_policy_refs:
  - osb_rider_premium_billing_and_posting
  - osb_premium_suspension_and_recovery
  overwrite: []
  trigger: on_request
  subject:
  - osb_rider_premium_payment
  computes: settlement_amount
  target_tool: pay_rider_premium_by_telephone_9597e982
  params: {}
  rule: >-
    The money a member is asked for to clear the rider premium they owe is the rider premium charged
    that is counted, less the money counted as having reached the rider premium account, less the credits
    set off; the figure is rounded to the nearest cent and is never less than nothing. The days of grace
    the rider held allows are reckoned into whole months at thirty days to the month, any part month
    being dropped, and a span of so many months runs back over that many whole calendar months from
    the handling date, an entry posted in an earlier calendar month falling outside it; this bears on
    which entries are counted and not on whether the days of grace have run out. The rider premium charged
    that is counted is the rider premium charges posted to the rider premium account within the days
    of grace the rider held allows. Where the rider stands suspended for unpaid premium, every rider
    premium charge posted to the rider premium account is counted instead; where the rider stands in
    its waiting period, only the rider premium charges posted from the day benefits became payable are
    counted. The money counted as having reached the rider premium account is the money posted to it
    within those same days of grace. Where the rider stands suspended for unpaid premium, every payment
    posted to the rider premium account is counted instead; where the rider stands ended, only the payments
    posted from the day the rider ended are counted. The credits set off are the credits posted to the
    rider premium account within those same days of grace. Where the rider stands suspended for unpaid
    premium, every credit posted to the rider premium account is set off instead; where the rider stands
    ended, no credit is set off, a credit standing on an ended rider being paid back to the member.
    The money left over on the medical plan bill is taken over every bill raised on the medical plan
    enrollment the rider hangs on. Where that enrollment does not stand in force and carries a day its
    coverage ended, it is taken over the bills raised up to that day; where that enrollment stands in
    force and the rider took effect after it did, it is taken over the bills raised from the day the
    rider took effect to the handling date. The money left over on the medical plan bill is what has
    been paid on it less the medical plan premium charged on it over the same span, and is never less
    than nothing. Nothing of it is carried to the rider premium account. Where the money left over comes
    to more than the rider premium charged that is counted, the rider premium charged that is counted
    is carried instead; where the medical plan bill carries money received against it and the money
    left over does not come to more than that, the whole of the money left over is carried. The money
    counted as having reached the rider premium account is the money posted to that account alone. Where
    what has been paid on the medical plan bill is above the medical plan premium charged on it, the
    money posted to that account is counted together with the money left over that is carried; where
    the medical plan bill carries medical plan premium charged on it and what has been paid on it is
    not above that, the shortfall on the bill is taken off the money posted to that account, the medical
    plan premium standing to be met first out of a combined payment. The money a member is asked for
    is fixed only after every rider premium charge raised for a coverage month beginning before the
    day the rider took effect carries a credit against it.
  prerequisite:
  - problem: osb_ext_precover_premium_credit
    kind: value_input
    gate: credits_counted
    form: state
    policy_source: >-
      The money a member is asked for is fixed only after every rider premium charge raised for a coverage
      month beginning before the day the rider took effect carries a credit against it.
    condition: >-
      Every osb_rider_premium_ledger charge whose billing_period begins before osb_riders.rider_effective_date
      is named as the source_premium_entry_id of an osb_rider_premium_credit row.
    resolved_by: post_rider_premium_credit_050a58f6
    effect: >-
      The binding credits_counted rises by the credit posted, so the money the member is asked for falls
      by the same amount.
  cross_category:
  - category: advantage
    as: history
    reads:
    - status
    - coverage_effective_date
    - coverage_end_date
    - advantage_premium_ledger.amount
    - advantage_premium_ledger.event_type
    - advantage_premium_ledger.posted_date
    note: >-
      Decides the combined-bill-span factor from whether the medical plan enrollment the rider hangs
      on stands in force and when its coverage began and ended, and the surplus and money-reaching factors
      from the money left standing on that enrollment's own premium ledger.
  compute:
  - grace_window_months: int(P('rider_premium_grace_period_days') / 30)
  - benefits_window_months: MX(1, MONTHS(F('benefits_available_from'), NOW) + 1)
  - charges_all: SUM('osb_rider_premium_ledger','amount', event_type='osb_rider_premium_charge')
  - charges_since_benefits: >-
      SUM('osb_rider_premium_ledger','amount', within_months=benefits_window_months, date_field='posted_date',
      event_type='osb_rider_premium_charge')
  - charges_in_grace: >-
      SUM('osb_rider_premium_ledger','amount', within_months=grace_window_months, date_field='posted_date',
      event_type='osb_rider_premium_charge')
  - charges_counted: >-
      charges_all if F('status')=='premium_suspended' else (charges_since_benefits if F('status')=='waiting_period'
      else charges_in_grace)
  - payments_all: SUM('osb_rider_premium_ledger','amount', event_type='osb_rider_premium_payment')
  - payments_in_grace: >-
      SUM('osb_rider_premium_ledger','amount', within_months=grace_window_months, date_field='posted_date',
      event_type='osb_rider_premium_payment')
  - payments_counted: >-
      payments_all if F('status')=='premium_suspended' else (SUM('osb_rider_premium_ledger','amount',
      within_months=MX(1, MONTHS(F('rider_end_date'), NOW)), date_field='posted_date', event_type='osb_rider_premium_payment')
      if F('status')=='terminated' else payments_in_grace)
  - credits_all: SUM('osb_rider_premium_ledger','amount', event_type='osb_rider_premium_credit')
  - credits_in_grace: >-
      SUM('osb_rider_premium_ledger','amount', within_months=grace_window_months, date_field='posted_date',
      event_type='osb_rider_premium_credit')
  - credits_counted: >-
      0.0 if F('status')=='terminated' else (credits_all if F('status')=='premium_suspended' else credits_in_grace)
  - rider_span_months: MX(1, MONTHS(F('rider_effective_date'), NOW) + 1)
  - plan_paid_span: >-
      XSUM('advantage','advantage_premium_ledger','amount', within_months=rider_span_months, date_field='posted_date',
      event_type='advantage_premium_payment')
  - plan_charged_span: >-
      XSUM('advantage','advantage_premium_ledger','amount', within_months=rider_span_months, date_field='posted_date',
      event_type='advantage_premium_charge')
  - plan_status: CFIELD('advantage','status')
  - plan_paid: >-
      XSUM('advantage','advantage_premium_ledger','amount', within_months=MX(1, MONTHS(CFIELD('advantage','coverage_end_date'),
      NOW)), date_field='posted_date', event_type='advantage_premium_payment') if (plan_status!='active'
      and CFIELD('advantage','coverage_end_date')!='') else (plan_paid_span if F('rider_effective_date')>CFIELD('advantage','coverage_effective_date')
      else XSUM('advantage','advantage_premium_ledger','amount', event_type='advantage_premium_payment'))
  - plan_charged: >-
      XSUM('advantage','advantage_premium_ledger','amount', within_months=MX(1, MONTHS(CFIELD('advantage','coverage_end_date'),
      NOW)), date_field='posted_date', event_type='advantage_premium_charge') if (plan_status!='active'
      and CFIELD('advantage','coverage_end_date')!='') else (plan_charged_span if F('rider_effective_date')>CFIELD('advantage','coverage_effective_date')
      else XSUM('advantage','advantage_premium_ledger','amount', event_type='advantage_premium_charge'))
  - plan_bill_payments_seen: XCOUNT('advantage','advantage_premium_ledger', event_type='advantage_premium_payment')
  - plan_bill_charges_seen: XCOUNT('advantage','advantage_premium_ledger', event_type='advantage_premium_charge')
  - plan_surplus: MX(0.0, RND(plan_paid - plan_charged, 2))
  - surplus_counted: >-
      charges_counted if plan_surplus>charges_counted else (plan_surplus if plan_bill_payments_seen>0
      else 0.0)
  - money_reaching_rider: >-
      RND(payments_counted + surplus_counted, 2) if plan_paid>plan_charged else (MX(0.0, RND(payments_counted
      - (plan_charged - plan_paid), 2)) if plan_bill_charges_seen>0 else payments_counted)
  - result: MX(0.0, RND(charges_counted - money_reaching_rider - credits_counted, 2))
  compute_basis:
    grace_window_months: >-
      The days of grace the rider held allows are reckoned into whole months at thirty days to the month,
      any part month being dropped, and a span of so many months runs back over that many whole calendar
      months from the handling date, an entry posted in an earlier calendar month falling outside it;
      this bears on which entries are counted and not on whether the days of grace have run out.
    benefits_window_months: >-
      The rider premium charged that is counted is the rider premium charges posted to the rider premium
      account within the days of grace the rider held allows. Where the rider stands suspended for unpaid
      premium, every rider premium charge posted to the rider premium account is counted instead; where
      the rider stands in its waiting period, only the rider premium charges posted from the day benefits
      became payable are counted.
    charges_all: >-
