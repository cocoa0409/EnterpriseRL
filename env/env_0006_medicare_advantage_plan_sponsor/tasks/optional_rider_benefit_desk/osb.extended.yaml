- id: osb_ext_rider_closure_settlement
  base_policy_refs:
  - osb_termination_and_cancellation
  - osb_rider_premium_billing_and_posting
  overwrite: []
  trigger: on_request
  subject:
  - osb_rider_termination
  computes: closing_premium_balance
  target_tool: end_rider_at_member_request_09efad65
  params: {}
  rule: >-
    The rider premium left owed when a rider is closed at the member's own request is what stands owed
    on it, less the rider premium refunded for coverage months beyond the day it ends, less the money
    on the medical plan bill set against it, rounded to the nearest cent and never less than nothing.
    A billing cycle carries a single coverage month. Where the medical plan enrollment the rider hangs
    on stands in force and is billed quarterly, a billing cycle carries three coverage months instead;
    where that enrollment does not stand in force, it carries the whole calendar months from the day
    the rider took effect to the handling date, and never fewer than one. What stands owed is what every
    charge on the rider premium account comes to less every payment and every credit on it. Where the
    rider stands suspended for unpaid premium, what stands owed is instead the figure the rider record
    shows standing owed; where the rider stands ended, nothing stands owed. No coverage month falls
    beyond the day the rider ends. Where a rider service intake stands asking for the rider to be cancelled
    and the rider record carries no day it ended, the coverage months beyond the day it ends are instead
    the coverage months a billing cycle carries, less the month in which that intake reached the plan
    and less any whole calendar month that has passed since; where the rider record carries a day the
    rider ended, they are the coverage months a billing cycle carries, less the month that day falls
    in and less any whole calendar month that has passed since. The rate each coverage month is refunded
    at is the amount of the rider premium charge carrying the most money of any standing on the account.
    Where that charge carries more than one coverage month, the rate is instead that amount divided
    by the coverage months it carries, rounded to the nearest cent; where it carries a single coverage
    month and its amount is above the monthly rider premium the rider held carries, the rate is the
    monthly rider premium the rider held carries. The most that may be refunded is the amount of the
    rider premium charge carrying the most money of any standing on the account, a credit never exceeding
    the charge it relieves. The rider premium refunded is the rate each coverage month is refunded at
    multiplied by the coverage months beyond the day the rider ends, rounded to the nearest cent, and
    never more than the most that may be refunded. The money on the medical plan bill set against what
    is left owed is nothing. Where the money left standing on that bill comes to more than what would
    otherwise be left owed, what would otherwise be left owed is set against it instead; where that
    bill carries money received against it and the money left standing on it does not come to more than
    that, the whole of the money left standing on the bill is set against it. The money left standing
    on the medical plan bill is what has been paid on it less the medical plan premium charged on it,
    and is never less than nothing. The rider premium left owed when a rider is closed is fixed only
    once the rider stands suspended for unpaid premium on its own record.
  prerequisite:
  - problem: osb_ext_unpaid_premium_suspension_arrears
    kind: value_input
    gate: standing_basis
    form: state
    policy_source: >-
      The rider premium left owed when a rider is closed is fixed only once the rider stands suspended
      for unpaid premium on its own record.
    condition: >-
      osb_riders.status carries premium_suspended and osb_riders.rider_premium_balance_due carries the
      figure struck as the suspension was recorded.
    resolved_by: suspend_rider_for_unpaid_premium_a0d6b513
    effect: >-
      The binding standing_basis takes the figure the rider record shows standing owed rather than what
      the entries come to, so the closing figure falls to the arrears struck at suspension less what
      is refunded and set off.
  cross_category:
  - category: advantage
    as: history
    reads:
    - status
    - premium_billing_frequency
    - advantage_premium_ledger.amount
    - advantage_premium_ledger.event_type
    note: >-
      Decides the billing-cycle-length factor from whether the medical plan enrollment the rider hangs
      on stands in force and how often it is billed, and the money-set-off factor from the money left
      standing on that enrollment's own premium ledger.
  compute:
  - plan_status: CFIELD('advantage','status')
  - plan_cycle: CFIELD('advantage','premium_billing_frequency')
  - cycle_months: >-
      3 if (plan_status=='active' and plan_cycle=='quarterly') else (MX(1, MONTHS(F('rider_effective_date'),
      NOW)) if plan_status!='active' else 1)
  - charges_all: SUM('osb_rider_premium_ledger','amount', event_type='osb_rider_premium_charge')
  - payments_all: SUM('osb_rider_premium_ledger','amount', event_type='osb_rider_premium_payment')
  - credits_all: SUM('osb_rider_premium_ledger','amount', event_type='osb_rider_premium_credit')
  - entries_figure: MX(0.0, RND(charges_all - payments_all - credits_all, 2))
  - record_figure: F('rider_premium_balance_due')
  - standing_basis: >-
      record_figure if F('status')=='premium_suspended' else (0.0 if F('status')=='terminated' else
      entries_figure)
  - cancellation_received: >-
      LATEST('osb_rider_requests','created_at', date_field='created_at', request_action='rider_cancellation')
  - months_after_end: >-
      MX(0, cycle_months - 1 - MX(0, MONTHS(cancellation_received, NOW))) if (cancellation_received!=None
      and F('rider_end_date')=='') else (MX(0, cycle_months - 1 - MX(0, MONTHS(F('rider_end_date'),
      NOW))) if F('rider_end_date')!='' else 0)
  - last_charge_amount: MAX('osb_rider_premium_ledger','amount', event_type='osb_rider_premium_charge')
  - refund_rate: >-
      RND(last_charge_amount / cycle_months, 2) if cycle_months>1 else (P('monthly_rider_premium') if
      last_charge_amount>P('monthly_rider_premium') else last_charge_amount)
  - refund_ceiling: last_charge_amount
  - refund_due: MN(RND(refund_rate * months_after_end, 2), refund_ceiling)
  - plan_paid: XSUM('advantage','advantage_premium_ledger','amount', event_type='advantage_premium_payment')
  - plan_charged: XSUM('advantage','advantage_premium_ledger','amount', event_type='advantage_premium_charge')
  - bill_money_left: MX(0.0, RND(plan_paid - plan_charged, 2))
  - owed_before_bill_money: MX(0.0, RND(standing_basis - refund_due, 2))
  - plan_bill_payments_seen: XCOUNT('advantage','advantage_premium_ledger', event_type='advantage_premium_payment')
  - bill_money_set_off: >-
      owed_before_bill_money if bill_money_left>owed_before_bill_money else (bill_money_left if plan_bill_payments_seen>0
      else 0.0)
  - result: MX(0.0, RND(standing_basis - refund_due - bill_money_set_off, 2))
  compute_basis:
    plan_status: >-
      A billing cycle carries a single coverage month. Where the medical plan enrollment the rider hangs
      on stands in force and is billed quarterly, a billing cycle carries three coverage months instead;
      where that enrollment does not stand in force, it carries the whole calendar months from the day
      the rider took effect to the handling date, and never fewer than one.
    plan_cycle: >-
      A billing cycle carries a single coverage month. Where the medical plan enrollment the rider hangs
      on stands in force and is billed quarterly, a billing cycle carries three coverage months instead;
      where that enrollment does not stand in force, it carries the whole calendar months from the day
      the rider took effect to the handling date, and never fewer than one.
    cycle_months: >-
      A billing cycle carries a single coverage month. Where the medical plan enrollment the rider hangs
      on stands in force and is billed quarterly, a billing cycle carries three coverage months instead;
      where that enrollment does not stand in force, it carries the whole calendar months from the day
      the rider took effect to the handling date, and never fewer than one.
    charges_all: >-
      What stands owed is what every charge on the rider premium account comes to less every payment
      and every credit on it. Where the rider stands suspended for unpaid premium, what stands owed
      is instead the figure the rider record shows standing owed; where the rider stands ended, nothing
      stands owed.
    payments_all: >-
      What stands owed is what every charge on the rider premium account comes to less every payment
      and every credit on it. Where the rider stands suspended for unpaid premium, what stands owed
      is instead the figure the rider record shows standing owed; where the rider stands ended, nothing
      stands owed.
    credits_all: >-
      What stands owed is what every charge on the rider premium account comes to less every payment
      and every credit on it. Where the rider stands suspended for unpaid premium, what stands owed
      is instead the figure the rider record shows standing owed; where the rider stands ended, nothing
      stands owed.
    entries_figure: >-
      What stands owed is what every charge on the rider premium account comes to less every payment
      and every credit on it. Where the rider stands suspended for unpaid premium, what stands owed
      is instead the figure the rider record shows standing owed; where the rider stands ended, nothing
      stands owed.
    record_figure: >-
      What stands owed is what every charge on the rider premium account comes to less every payment
      and every credit on it. Where the rider stands suspended for unpaid premium, what stands owed
      is instead the figure the rider record shows standing owed; where the rider stands ended, nothing
      stands owed.
    standing_basis: >-
      What stands owed is what every charge on the rider premium account comes to less every payment
      and every credit on it. Where the rider stands suspended for unpaid premium, what stands owed
      is instead the figure the rider record shows standing owed; where the rider stands ended, nothing
      stands owed.
    cancellation_received: >-
      No coverage month falls beyond the day the rider ends. Where a rider service intake stands asking
      for the rider to be cancelled and the rider record carries no day it ended, the coverage months
      beyond the day it ends are instead the coverage months a billing cycle carries, less the month
      in which that intake reached the plan and less any whole calendar month that has passed since;
      where the rider record carries a day the rider ended, they are the coverage months a billing cycle
      carries, less the month that day falls in and less any whole calendar month that has passed since.
    months_after_end: >-
      No coverage month falls beyond the day the rider ends. Where a rider service intake stands asking
      for the rider to be cancelled and the rider record carries no day it ended, the coverage months
      beyond the day it ends are instead the coverage months a billing cycle carries, less the month
      in which that intake reached the plan and less any whole calendar month that has passed since;
      where the rider record carries a day the rider ended, they are the coverage months a billing cycle
      carries, less the month that day falls in and less any whole calendar month that has passed since.
    last_charge_amount: >-
      The rate each coverage month is refunded at is the amount of the rider premium charge carrying
      the most money of any standing on the account. Where that charge carries more than one coverage
      month, the rate is instead that amount divided by the coverage months it carries, rounded to the
      nearest cent; where it carries a single coverage month and its amount is above the monthly rider
      premium the rider held carries, the rate is the monthly rider premium the rider held carries.
    refund_rate: >-
      The rate each coverage month is refunded at is the amount of the rider premium charge carrying
      the most money of any standing on the account. Where that charge carries more than one coverage
      month, the rate is instead that amount divided by the coverage months it carries, rounded to the
      nearest cent; where it carries a single coverage month and its amount is above the monthly rider
      premium the rider held carries, the rate is the monthly rider premium the rider held carries.
    refund_ceiling: >-
      The most that may be refunded is the amount of the rider premium charge carrying the most money
      of any standing on the account, a credit never exceeding the charge it relieves.
    refund_due: >-
      The rider premium refunded is the rate each coverage month is refunded at multiplied by the coverage
      months beyond the day the rider ends, rounded to the nearest cent, and never more than the most
      that may be refunded.
    plan_paid: >-
      The money left standing on the medical plan bill is what has been paid on it less the medical
      plan premium charged on it, and is never less than nothing.
    plan_charged: >-
      The money left standing on the medical plan bill is what has been paid on it less the medical
      plan premium charged on it, and is never less than nothing.
    bill_money_left: >-
      The money left standing on the medical plan bill is what has been paid on it less the medical
      plan premium charged on it, and is never less than nothing.
    owed_before_bill_money: >-
      The money on the medical plan bill set against what is left owed is nothing. Where the money left
      standing on that bill comes to more than what would otherwise be left owed, what would otherwise
      be left owed is set against it instead; where that bill carries money received against it and
      the money left standing on it does not come to more than that, the whole of the money left standing
      on the bill is set against it.
    plan_bill_payments_seen: >-
      The money on the medical plan bill set against what is left owed is nothing. Where the money left
      standing on that bill comes to more than what would otherwise be left owed, what would otherwise
      be left owed is set against it instead; where that bill carries money received against it and
      the money left standing on it does not come to more than that, the whole of the money left standing
      on the bill is set against it.
    bill_money_set_off: >-
      The money on the medical plan bill set against what is left owed is nothing. Where the money left
      standing on that bill comes to more than what would otherwise be left owed, what would otherwise
      be left owed is set against it instead; where that bill carries money received against it and
      the money left standing on it does not come to more than that, the whole of the money left standing
      on the bill is set against it.
    result: >-
      The rider premium left owed when a rider is closed at the member's own request is what stands
      owed on it, less the rider premium refunded for coverage months beyond the day it ends, less the
      money on the medical plan bill set against it, rounded to the nearest cent and never less than
      nothing.
  factors:
  - id: closing_standing_basis
    effect: method
    decides: standing_basis
    bindings:
    - charges_all
    - payments_all
    - credits_all
    - entries_figure
    - record_figure
    - standing_basis
    ladder:
    - when: the rider stands suspended for unpaid premium
      method: what stands owed is the figure the rider record shows standing owed
    - when: the rider stands ended
      method: nothing stands owed
    - when: otherwise
      method: >-
        what stands owed is what every charge on the rider premium account comes to less every payment
        and every credit on it
    baseline:
      standing_basis: entries_figure
    evidence:
    - history
  - id: months_beyond_the_end_date
    effect: method
    decides: months_after_end
    bindings:
    - cancellation_received
    - months_after_end
    ladder:
    - when: >-
        a rider service intake stands asking for the rider to be cancelled and the rider record carries
        no day it ended
      method: >-
        the coverage months beyond the end are the coverage months a billing cycle carries, less the
        month in which that intake reached the plan and less any whole calendar month that has passed
        since
    - when: the rider record carries a day the rider ended
      method: >-
        the coverage months beyond the end are the coverage months a billing cycle carries, less the
        month that day falls in and less any whole calendar month that has passed since
    - when: otherwise
      method: no coverage month falls beyond the day the rider ends
    baseline:
      months_after_end: '0'
    evidence:
    - history
    - date
  - id: refund_rate_per_month
    effect: parameter
    decides: refund_rate
    bindings:
    - last_charge_amount
    - refund_rate
    ladder:
    - when: >-
        the rider premium charge carrying the most money of any standing on the account carries more
        than one coverage month
      value: that amount divided by the coverage months it carries, rounded to the nearest cent
    - when: >-
        that charge carries a single coverage month and its amount is above the monthly rider premium
        the rider held carries
      value: the monthly rider premium the rider held carries
    - when: otherwise
      value: the amount of the rider premium charge carrying the most money of any standing on the account
    baseline:
      refund_rate: last_charge_amount
    evidence:
    - history
    - tier_param
  - id: billing_cycle_length
    effect: method
    decides: cycle_months
    bindings:
    - plan_status
    - plan_cycle
    - cycle_months
    ladder:
    - when: the medical plan enrollment the rider hangs on stands in force and is billed quarterly
      method: a billing cycle carries three coverage months
    - when: that enrollment does not stand in force
      method: >-
        a billing cycle carries the whole calendar months from the day the rider took effect to the
        handling date, and never fewer than one
    - when: otherwise
      method: a billing cycle carries a single coverage month
    baseline:
      cycle_months: '1'
    evidence:
    - cross_category
    - date
    cross_difficulty: advantage
  - id: bill_money_set_against_closing
    effect: parameter
    decides: bill_money_set_off
    bindings:
    - plan_paid
    - plan_charged
    - bill_money_left
    - owed_before_bill_money
    - plan_bill_payments_seen
    - bill_money_set_off
    ladder:
    - when: >-
        the money left standing on the medical plan bill comes to more than what would otherwise be
        left owed
      value: what would otherwise be left owed
    - when: >-
        that bill carries money received against it and the money left standing on it does not come
        to more than that
      value: the whole of the money left standing on the medical plan bill
    - when: otherwise
      value: nothing, no money having been received on the medical plan bill
    baseline:
      bill_money_set_off: '0.0'
    evidence:
    - cross_category
    - history
    cross_difficulty: advantage
  baseline:
    rule: >-
      The rider premium left owed when a rider is closed at the member's own request is what stands
      owed on it, less the rider premium refunded for coverage months beyond the day it ends, less the
      money on the medical plan bill set against it, rounded to the nearest cent and never less than
      nothing. A billing cycle carries a single coverage month. What stands owed is what every charge
      on the rider premium account comes to less every payment and every credit on it. No coverage month
      falls beyond the day the rider ends. The rate each coverage month is refunded at is the amount
      of the rider premium charge carrying the most money of any standing on the account. The most that
      may be refunded is the amount of the rider premium charge carrying the most money of any standing
      on the account, a credit never exceeding the charge it relieves. The rider premium refunded is
      the rate each coverage month is refunded at multiplied by the coverage months beyond the day the
      rider ends, rounded to the nearest cent, and never more than the most that may be refunded. The
      money on the medical plan bill set against what is left owed is nothing. The money left standing
      on the medical plan bill is what has been paid on it less the medical plan premium charged on
      it, and is never less than nothing.
    params:
    - monthly_rider_premium
    - rider_cancellation_effective_rule
    - minimum_rider_holding_months
  inputs:
    history:
    - table: osb_rider_premium_ledger
      aggregate: sum
      field: amount
      within_months: null
      filters:
        event_type: osb_rider_premium_charge
    - table: osb_rider_premium_ledger
      aggregate: max
      field: amount
      within_months: null
      filters:
        event_type: osb_rider_premium_charge
    - table: osb_rider_requests
      aggregate: latest
      field: created_at
      within_months: null
      filters:
        request_action: rider_cancellation
    - category: advantage
      table: advantage_premium_ledger
      aggregate: sum
      field: amount
      within_months: null
      filters:
        event_type: advantage_premium_payment
    cross_category:
    - advantage
