extended_policies:
- id: pdp_ext_penalty_relief
  base_policy_refs:
  - pdp_late_enrollment_penalty
  - pdp_premium_posting
  overwrite:
  - base_policy: pdp_premium_posting
    superseded_clause: >-
      A credit adjustment and a penalty removal each name the single charge they relieve and the reason, and neither may exceed the amount of that charge.
    replaced_by: >-
      Where earlier creditable drug coverage is proved, the coverage months it covers are relieved together on one removal entry, which names the earliest penalty charge standing unrelieved on the account and carries the whole amount taken back off.
  - base_policy: pdp_late_enrollment_penalty
    superseded_clause: >-
      the penalty is removed and every month of it credited back once CMS confirms the earlier coverage was creditable
    replaced_by: >-
      Where the evidence of earlier creditable drug coverage stands on the enrollment intake, the plan relieves at once the coverage months that evidence and the records prove, and the months it cannot prove are sent to CMS for reconsideration.
  - base_policy: pdp_late_enrollment_penalty
    superseded_clause: >-
      The count of months is CMS's, not the plan's: the plan bills what CMS supplies and never adds or removes a month on its own view of the member's history.
    replaced_by: >-
      Where the plan's own records prove how many coverage months the member held creditable drug coverage for, the months relieved are taken from what those records carry rather than from the count of uncovered months the enrollment carries.
  trigger: state_due
  subject:
  - pdp_penalty_removal
  computes: removal_amount
  target_tool: post_penalty_removal_e1c246c8
  params:
    group_election_months_proved: 6
    group_record_month_floor: 3
  rule: >
    The late enrollment penalty taken back off a member's account is the monthly penalty the relief is
    worked out on, multiplied by the coverage months whose penalty is being relieved, rounded to the
    nearest ten cents, and held to the ceiling the account allows. Where earlier creditable drug
    coverage is proved, the coverage months it covers are relieved together on one removal entry, which
    names the earliest penalty charge standing unrelieved on the account and carries the whole amount
    taken back off. Where the evidence of earlier creditable drug coverage stands on the enrollment
    intake, the plan relieves at once the coverage months that evidence and the records prove, and the
    months it cannot prove are sent to CMS for reconsideration. Where the plan's own records prove how
    many coverage months the member held creditable drug coverage for, the months relieved are taken
    from what those records carry rather than from the count of uncovered months the enrollment
    carries. The monthly penalty the relief is
    worked out on is the figure the national base
    beneficiary premium and the plan's penalty rate give for the months without creditable coverage the
    enrollment carries. Where a penalty charge larger than the latest one stands on the premium account
    and two or more penalty charges stand on it, the relief is worked out on the largest penalty
    charged instead. Where no penalty charge larger than the latest one stands on the premium account
    and at least one penalty charge stands on it, the relief is worked out on the latest penalty
    charged instead. The coverage months whose penalty is relieved are the coverage months the premium
    account has charged a penalty for in the three months up to the handling date, held down to the
    months the member's earlier coverage proves. Where the evidence of earlier creditable coverage held
    on the enrollment intake is a certificate of creditable coverage on file and a penalty charge
    stands on the premium account, those months are counted over every coverage month the account has
    charged a penalty for since coverage began. Where the evidence held on the enrollment intake is
    coverage verified with the prior carrier and a penalty charge stands on the premium account, those
    months are counted over the coverage months the account has charged a penalty for in the twelve
    months up to the handling date. The months the member's earlier coverage proves are the months
    without creditable coverage the enrollment carries. Where the member's employer group retiree drug
    coverage ended when the group's own contract ended and the group premium record carries at least
    the floor of coverage months charged for that member, the months proved are the coverage months
    that record carries. Where the member's employer group retiree drug coverage ended at the member's
    own election and the group premium record carries at least that floor of coverage months charged
    for that member, the months proved are the fixed allowance of months the plan credits without
    further enquiry. The relief is held to the latest penalty charge the premium account carries and
    never exceeds it. Where the enrollment stands in its premium grace period and two or more penalty
    charges stand on the premium account, the relief is held instead to the whole penalty the account
    has charged since coverage began less every removal already posted. Where the enrollment stands
    active and two or more penalty charges stand on the premium account, the relief is held instead to
    the penalty charged in the six months up to the handling date less every removal already posted.
    The multiplication is carried out first and its product rounded once to the nearest ten cents,
    and only that rounded product is then compared with the ceiling; no intermediate is rounded
    before it. The member's own account of holding earlier drug coverage opens the enquiry and never
    fixes any of these figures.
  prerequisite: []
  cross_category:
  - category: egwp
    as: history
    reads:
    - status
    - egwp_premium_ledger.event_type
    note: the months the member's former employer group retiree drug coverage proves are decided from that enrollment's standing and the coverage months its premium record carries.
  compute:
  - penalty_charges_on_record: "COUNT('pdp_premium_ledger', event_type='pdp_penalty_assessment')"
  - largest_penalty_charged: "MAX('pdp_premium_ledger','amount', event_type='pdp_penalty_assessment')"
  - latest_penalty_charged: "float(LATEST('pdp_premium_ledger','amount', date_field='posted_date', event_type='pdp_penalty_assessment') or 0)"
  - published_monthly_penalty: "RND(P('national_base_beneficiary_premium') * P('late_enrollment_penalty_rate_percent') / 100 * float(F('late_enrollment_penalty_months')), 1)"
  - monthly_penalty_basis: "largest_penalty_charged if (largest_penalty_charged > latest_penalty_charged and penalty_charges_on_record >= 2) else (latest_penalty_charged if (largest_penalty_charged <= latest_penalty_charged and penalty_charges_on_record >= 1) else published_monthly_penalty)"
  - coverage_evidence_held: "LATEST('pdp_enrollment_requests','prior_coverage_evidence', date_field='created_at')"
  - penalty_months_all: "COUNT('pdp_premium_ledger', event_type='pdp_penalty_assessment')"
  - penalty_months_last_twelve: "COUNT('pdp_premium_ledger', within_months=12, date_field='posted_date', event_type='pdp_penalty_assessment')"
  - penalty_months_last_three: "COUNT('pdp_premium_ledger', within_months=3, date_field='posted_date', event_type='pdp_penalty_assessment')"
  - months_in_evidence_window: "penalty_months_all if (coverage_evidence_held == 'certificate_of_creditable_coverage_on_file' and penalty_months_all >= 1) else (penalty_months_last_twelve if (coverage_evidence_held == 'verified_with_prior_carrier' and penalty_months_all >= 1) else penalty_months_last_three)"
  - group_plan_standing: "CFIELD('egwp','status')"
  - group_coverage_months: "XCOUNT('egwp','egwp_premium_ledger', event_type='egwp_premium_charge')"
  - months_proved_by_group: "group_coverage_months if (group_plan_standing == 'group_terminated' and group_coverage_months >= K('group_record_month_floor')) else (K('group_election_months_proved') if (group_plan_standing == 'disenrolled' and group_coverage_months >= K('group_record_month_floor')) else float(F('late_enrollment_penalty_months')))"
  - months_relieved: "MN(months_in_evidence_window, months_proved_by_group)"
  - penalty_charged_since_start: "SUM('pdp_premium_ledger','amount', event_type='pdp_penalty_assessment')"
  - penalty_charged_last_six: "SUM('pdp_premium_ledger','amount', within_months=6, date_field='posted_date', event_type='pdp_penalty_assessment')"
  - penalty_already_removed: "SUM('pdp_premium_ledger','amount', event_type='pdp_penalty_removal')"
  - relief_ceiling: "(penalty_charged_since_start - penalty_already_removed) if (F('status') == 'premium_grace_period' and penalty_charges_on_record >= 2) else ((penalty_charged_last_six - penalty_already_removed) if (F('status') == 'active' and penalty_charges_on_record >= 2) else latest_penalty_charged)"
  - relief_before_ceiling: "RND(monthly_penalty_basis * months_relieved, 1)"
  - result: "MN(relief_before_ceiling, relief_ceiling)"
  compute_basis:
    penalty_charges_on_record: "Where a penalty charge larger than the latest one stands on the premium account and two or more penalty charges stand on it, the relief is worked out on the largest penalty charged instead."
    largest_penalty_charged: "Where a penalty charge larger than the latest one stands on the premium account and two or more penalty charges stand on it, the relief is worked out on the largest penalty charged instead."
    latest_penalty_charged: "Where no penalty charge larger than the latest one stands on the premium account and at least one penalty charge stands on it, the relief is worked out on the latest penalty charged instead."
    published_monthly_penalty: "The monthly penalty the relief is worked out on is the figure the national base beneficiary premium and the plan's penalty rate give for the months without creditable coverage the enrollment carries."
    monthly_penalty_basis: "The monthly penalty the relief is worked out on is the figure the national base beneficiary premium and the plan's penalty rate give for the months without creditable coverage the enrollment carries. Where a penalty charge larger than the latest one stands on the premium account and two or more penalty charges stand on it, the relief is worked out on the largest penalty charged instead. Where no penalty charge larger than the latest one stands on the premium account and at least one penalty charge stands on it, the relief is worked out on the latest penalty charged instead."
    coverage_evidence_held: "Where the evidence of earlier creditable coverage held on the enrollment intake is a certificate of creditable coverage on file and a penalty charge stands on the premium account, those months are counted over every coverage month the account has charged a penalty for since coverage began."
    penalty_months_all: "those months are counted over every coverage month the account has charged a penalty for since coverage began"
    penalty_months_last_twelve: "those months are counted over the coverage months the account has charged a penalty for in the twelve months up to the handling date"
    penalty_months_last_three: "The coverage months whose penalty is relieved are the coverage months the premium account has charged a penalty for in the three months up to the handling date, held down to the months the member's earlier coverage proves."
    months_in_evidence_window: "Where the evidence of earlier creditable coverage held on the enrollment intake is a certificate of creditable coverage on file and a penalty charge stands on the premium account, those months are counted over every coverage month the account has charged a penalty for since coverage began. Where the evidence held on the enrollment intake is coverage verified with the prior carrier and a penalty charge stands on the premium account, those months are counted over the coverage months the account has charged a penalty for in the twelve months up to the handling date."
    group_plan_standing: "Where the member's employer group retiree drug coverage ended when the group's own contract ended and the group premium record carries at least the floor of coverage months charged for that member, the months proved are the coverage months that record carries."
    group_coverage_months: "Where the member's employer group retiree drug coverage ended at the member's own election and the group premium record carries at least that floor of coverage months charged for that member, the months proved are the fixed allowance of months the plan credits without further enquiry."
    months_proved_by_group: "The months the member's earlier coverage proves are the months without creditable coverage the enrollment carries. Where the member's employer group retiree drug coverage ended when the group's own contract ended and the group premium record carries at least the floor of coverage months charged for that member, the months proved are the coverage months that record carries. Where the member's employer group retiree drug coverage ended at the member's own election and the group premium record carries at least that floor of coverage months charged for that member, the months proved are the fixed allowance of months the plan credits without further enquiry."
    months_relieved: "The coverage months whose penalty is relieved are the coverage months the premium account has charged a penalty for in the three months up to the handling date, held down to the months the member's earlier coverage proves."
    penalty_charged_since_start: "Where the enrollment stands in its premium grace period and two or more penalty charges stand on the premium account, the relief is held instead to the whole penalty the account has charged since coverage began less every removal already posted."
    penalty_charged_last_six: "Where the enrollment stands active and two or more penalty charges stand on the premium account, the relief is held instead to the penalty charged in the six months up to the handling date less every removal already posted."
    penalty_already_removed: "the whole penalty the account has charged since coverage began less every removal already posted"
    relief_ceiling: "The relief is held to the latest penalty charge the premium account carries and never exceeds it. Where the enrollment stands in its premium grace period and two or more penalty charges stand on the premium account, the relief is held instead to the whole penalty the account has charged since coverage began less every removal already posted. Where the enrollment stands active and two or more penalty charges stand on the premium account, the relief is held instead to the penalty charged in the six months up to the handling date less every removal already posted."
    relief_before_ceiling: "The multiplication is carried out first and its product rounded once to the nearest ten cents, and only that rounded product is then compared with the ceiling; no intermediate is rounded before it."
    result: "The late enrollment penalty taken back off a member's account is the monthly penalty the relief is worked out on, multiplied by the coverage months whose penalty is being relieved, rounded to the nearest ten cents, and held to the ceiling the account allows."
  factors:
  - id: monthly_penalty_basis_rule
    effect: parameter
    decides: monthly_penalty_basis
    bindings: [penalty_charges_on_record, largest_penalty_charged, latest_penalty_charged, published_monthly_penalty, monthly_penalty_basis]
    ladder:
    - when: "a penalty charge larger than the latest one stands on the premium account and two or more penalty charges stand on it"
      value: "the largest penalty charged"
    - when: "no penalty charge larger than the latest one stands on the premium account and at least one penalty charge stands on it"
      value: "the latest penalty charged"
    - when: "otherwise"
      value: "the figure the national base beneficiary premium and the plan's penalty rate give for the months without creditable coverage the enrollment carries"
    baseline:
      monthly_penalty_basis: "published_monthly_penalty"
    evidence: [history]
    cross_difficulty: null
  - id: relieved_month_window
    effect: method
    decides: months_in_evidence_window
    bindings: [coverage_evidence_held, penalty_months_all, penalty_months_last_twelve, penalty_months_last_three, months_in_evidence_window]
    ladder:
    - when: "the evidence of earlier creditable coverage held on the enrollment intake is a certificate of creditable coverage on file and a penalty charge stands on the premium account"
      method: "the months are counted over every coverage month the account has charged a penalty for since coverage began"
    - when: "the evidence held on the enrollment intake is coverage verified with the prior carrier and a penalty charge stands on the premium account"
      method: "the months are counted over the coverage months the account has charged a penalty for in the twelve months up to the handling date"
    - when: "otherwise"
      method: "the months are counted over the coverage months the account has charged a penalty for in the three months up to the handling date"
    baseline:
      months_in_evidence_window: "penalty_months_last_three"
    evidence: [history, date]
    cross_difficulty: null
  - id: group_coverage_months_proved
    effect: parameter
    decides: months_proved_by_group
    bindings: [group_plan_standing, group_coverage_months, months_proved_by_group]
    ladder:
    - when: "the member's employer group retiree drug coverage ended when the group's own contract ended and the group premium record carries at least the floor of coverage months charged for that member"
      value: "the coverage months that group premium record carries"
    - when: "the member's employer group retiree drug coverage ended at the member's own election and the group premium record carries at least that floor of coverage months charged for that member"
      value: "the fixed allowance of months the plan credits without further enquiry"
    - when: "otherwise"
      value: "the months without creditable coverage the enrollment carries"
    baseline:
      months_proved_by_group: "float(F('late_enrollment_penalty_months'))"
    evidence: [cross_category, history]
    cross_difficulty: egwp
  - id: relief_ceiling_rule
    effect: method
    decides: relief_ceiling
    bindings: [penalty_charged_since_start, penalty_charged_last_six, penalty_already_removed, relief_ceiling]
    ladder:
    - when: "the enrollment stands in its premium grace period and two or more penalty charges stand on the premium account"
      method: "the ceiling is worked out by totalling the penalty the account has charged since coverage began and taking off every removal already posted"
    - when: "the enrollment stands active and two or more penalty charges stand on the premium account"
      method: "the ceiling is worked out by totalling the penalty charged in the six months up to the handling date and taking off every removal already posted"
    - when: "otherwise"
      method: "the ceiling is taken from the single latest penalty charge the premium account carries"
    baseline:
      relief_ceiling: "latest_penalty_charged"
    evidence: [history]
    cross_difficulty: null
  baseline:
    rule: >-
      The late enrollment penalty taken back off a member's account is the monthly penalty the relief is
      worked out on, multiplied by the coverage months whose penalty is being relieved, rounded to the
      nearest ten cents, and held to the ceiling the account allows. The monthly penalty the relief is
      worked out on is the figure the national base beneficiary premium and the plan's penalty rate give
      for the months without creditable coverage the enrollment carries. The coverage months whose
      penalty is relieved are the coverage months the premium account has charged a penalty for in the
      three months up to the handling date, held down to the months the member's earlier coverage
      proves. The months the member's earlier coverage proves are the months without creditable coverage
      the enrollment carries. The relief is held to the latest penalty charge the premium account
      carries and never exceeds it. The multiplication is carried out first and its product rounded once
      to the nearest ten cents, and only that rounded product is then compared with the ceiling; no
      intermediate is rounded before it. The member's own account of holding earlier drug coverage opens
      the enquiry and never fixes any of these figures.
    params:
    - national_base_beneficiary_premium
    - late_enrollment_penalty_rate_percent
    - penalty_rounding_basis
  inputs:
    history:
    - {table: pdp_premium_ledger, aggregate: count, field: amount, within_months: 12, filters: {event_type: pdp_penalty_assessment}}
    - {table: pdp_premium_ledger, aggregate: sum, field: amount, within_months: 6, filters: {event_type: pdp_penalty_assessment}}
    - {table: pdp_enrollment_requests, aggregate: latest, field: prior_coverage_evidence, within_months: null, filters: {}}
    - {category: egwp, table: egwp_premium_ledger, aggregate: count, field: amount, within_months: null, filters: {event_type: egwp_premium_charge}}
    cross_category: [egwp]
- id: pdp_ext_premium_arrears_settlement
  base_policy_refs:
  - pdp_premium_posting
  - pdp_premium_billing
  - pdp_premium_delinquency
  - pdp_late_enrollment_penalty
  overwrite:
  - base_policy: pdp_premium_posting
    superseded_clause: >-
      An overpayment is refunded by the channel the money arrived on and never held against a coverage month the plan has not yet billed.
    replaced_by: >-
      Where the coverage month's premium charge has stood posted for as many days as the plan's premium due day and the plan bills the premium monthly, the settlement also asks for one further coverage month at the plan's monthly premium, and that further month is held against the coverage month it names rather than refunded.
  - base_policy: pdp_premium_posting
    superseded_clause: >-
      No payment entry carrying the same remittance reference and the same amount is already posted on this enrollment.
    replaced_by: >-
      A settlement taken over the telephone is identified by the payment reference the plan issues at the moment the money is taken, so no settlement can repeat a reference already standing on the account.
  trigger: on_request
  subject:
  - pdp_premium_payment
  computes: payment_amount
  target_tool: authorize_arrears_payment_7dfec3b3
  params:
    frequent_payer_count: 3
  rule: >
    The amount a member is asked to settle on a drug plan premium account is the premium standing
    unsettled for the coverage months the figure runs over, together with the penalty the settlement
    asks for and any further coverage month the settlement asks for, and the three are added and the
    total rounded once to two decimal places; no intermediate is rounded before that. The amount the
    member is asked to settle is fixed only after every coverage month whose penalty the record no
    longer owes carries its removal entry on the premium account. The premium standing unsettled is
    the premium charged for the coverage months the figure runs over, less what the account treats as
    already settled and less the credit the settlement takes off, and where that comes out below
    nothing it is taken as nothing. The figure runs over the coverage months the premium account has
    charged for in the three months up to the handling date. Where the enrollment stands in its
    premium grace period and the plan bills the premium monthly, the figure runs instead over every
    coverage month the account has charged for since coverage began. Where the enrollment stands in
    its premium grace period and the plan bills the premium quarterly, the figure runs instead over
    the coverage months the account has charged for in the six months up to the handling date. What
    the account treats as already settled is the latest premium payment posted on it. Where the
    premium payments standing posted on the account are at least the number the plan treats as a
    settled payment history and the enrollment stands in its premium grace period, what the account
    treats as already settled is instead every premium payment posted on it. Where the premium
    payments standing posted on the account are fewer than that number and the enrollment stands in
    its premium grace period, what the account treats as already settled is instead the premium
    payments posted on it in the six months up to the handling date. The credit the settlement takes
    off is nothing. Where a credit stands posted on the account for a premium rate changed after the
    fact and the enrollment stands in its premium grace period, the credit the settlement takes off is
    instead the credits posted on the account for a premium rate changed after the fact. Where no
    credit stands posted on the account for a premium rate changed after the fact, a credit stands
    posted on it for a charge raised in error and the enrollment stands in its premium grace period,
    the credit the settlement takes off is instead the credits posted on the account for a charge
    raised in error. A credit posted for any other reason is left on the account and is not taken off
    the settlement. The penalty still
    standing is the penalty balance the enrollment carries. Where the penalty balance the enrollment
    carries is more than the penalty the account has charged less the penalty taken back off it, and
    the enrollment stands in its premium grace period, the penalty still standing is worked out
    instead from the account's own entries as the penalty charged less the penalty taken back off.
    Where the penalty balance the enrollment carries is less than the penalty the account has charged
    less the penalty taken back off it, and the enrollment stands in its premium grace period, the
    penalty still standing is worked out instead from the account's entries for the twelve months up
    to the handling date less the penalty taken back off. The settlement asks for no penalty. Where
    the enrollment stands in its premium grace period and the penalty still standing is more than
    nothing, the settlement asks instead for the whole penalty still standing. Where the enrollment
    stands active and the penalty still standing is more than nothing, the settlement asks instead for
    one coverage month of penalty at the latest penalty charged. The settlement asks for no further
    coverage month. Where the coverage month's premium charge has stood posted for as many days as the
    plan's premium due day and the plan bills the premium monthly, the settlement also asks for one
    further coverage month at the plan's monthly premium, and that further month is held against the
    coverage month it names rather than refunded. Where the coverage month's premium charge has stood
    posted for as many days as the plan's premium due day and the plan bills the premium quarterly,
    the settlement also asks for three further coverage months at the plan's monthly premium. A
    settlement taken over the telephone is identified by the payment reference the plan issues at the
    moment the money is taken, so no settlement can repeat a reference already standing on the
    account. The money the member settles is applied to the oldest coverage month for which the
    account still shows a premium component unsettled; a coverage month whose basic and supplemental
    premium components are both settled is not reopened by a late enrollment penalty still standing
    against it, because premium and penalty are relieved by different events and either may be owed
    without the other. A partial payment never cures a delinquency, so the member is told one figure and
    is never invited to pay part of it, and the member's own recollection of what they have paid is a
    reason to read the account rather than a figure to work from.
  prerequisite:
  - problem: pdp_ext_penalty_relief
    kind: value_input
    gate: penalty_outstanding
    form: state
    policy_source: >-
      The amount the member is asked to settle is fixed only after every coverage month whose penalty the record no longer owes carries its removal entry on the premium account.
    condition: >-
      Every penalty charge on the premium account for a coverage month the member is no longer liable for carries a matching penalty removal entry, so that the penalty charged less the penalty taken back off is the penalty the member genuinely still owes.
    resolved_by: post_penalty_removal_e1c246c8
    effect: >-
      Once the removal entry stands on the premium account, the penalty taken back off rises by the amount relieved, so the penalty still standing falls to the penalty genuinely owed and the settlement figure falls with it.
  cross_category: []
  compute:
  - premium_charged_all: "SUM('pdp_premium_ledger','amount', event_type='pdp_premium_charge')"
  - premium_charged_last_six: "SUM('pdp_premium_ledger','amount', within_months=6, date_field='posted_date', event_type='pdp_premium_charge')"
  - premium_charged_last_three: "SUM('pdp_premium_ledger','amount', within_months=3, date_field='posted_date', event_type='pdp_premium_charge')"
  - premium_in_window: "premium_charged_all if (F('status') == 'premium_grace_period' and F('premium_billing_frequency') == 'monthly') else (premium_charged_last_six if (F('status') == 'premium_grace_period' and F('premium_billing_frequency') == 'quarterly') else premium_charged_last_three)"
  - payments_on_record: "COUNT('pdp_premium_ledger', event_type='pdp_premium_payment')"
  - premium_paid_all: "SUM('pdp_premium_ledger','amount', event_type='pdp_premium_payment')"
  - premium_paid_last_six: "SUM('pdp_premium_ledger','amount', within_months=6, date_field='posted_date', event_type='pdp_premium_payment')"
  - latest_premium_payment: "float(LATEST('pdp_premium_ledger','amount', date_field='posted_date', event_type='pdp_premium_payment') or 0)"
  - premium_settled_taken: "premium_paid_all if (payments_on_record >= K('frequent_payer_count') and F('status') == 'premium_grace_period') else (premium_paid_last_six if (payments_on_record < K('frequent_payer_count') and F('status') == 'premium_grace_period') else latest_premium_payment)"
  - rate_change_credits: "COUNT('pdp_premium_ledger', event_type='pdp_premium_credit_adjustment', adjustment_reason_code='retroactive_rate_change')"
  - error_credits: "COUNT('pdp_premium_ledger', event_type='pdp_premium_credit_adjustment', adjustment_reason_code='billing_error_correction')"
  - premium_credited_rate_change: "SUM('pdp_premium_ledger','amount', event_type='pdp_premium_credit_adjustment', adjustment_reason_code='retroactive_rate_change')"
  - premium_credited_error: "SUM('pdp_premium_ledger','amount', event_type='pdp_premium_credit_adjustment', adjustment_reason_code='billing_error_correction')"
  - credit_taken: "premium_credited_rate_change if (rate_change_credits >= 1 and F('status') == 'premium_grace_period') else (premium_credited_error if (rate_change_credits == 0 and error_credits >= 1 and F('status') == 'premium_grace_period') else 0)"
  - premium_due: "MX(0, premium_in_window - premium_settled_taken - credit_taken)"
  - penalty_charged_total: "SUM('pdp_premium_ledger','amount', event_type='pdp_penalty_assessment')"
  - penalty_charged_last_twelve: "SUM('pdp_premium_ledger','amount', within_months=12, date_field='posted_date', event_type='pdp_penalty_assessment')"
  - penalty_removed_total: "SUM('pdp_premium_ledger','amount', event_type='pdp_penalty_removal')"
  - penalty_outstanding: "(penalty_charged_total - penalty_removed_total) if (float(F('penalty_balance_due')) > (penalty_charged_total - penalty_removed_total) and F('status') == 'premium_grace_period') else ((penalty_charged_last_twelve - penalty_removed_total) if (float(F('penalty_balance_due')) < (penalty_charged_total - penalty_removed_total) and F('status') == 'premium_grace_period') else float(F('penalty_balance_due')))"
  - latest_penalty_charge_amount: "float(LATEST('pdp_premium_ledger','amount', date_field='posted_date', event_type='pdp_penalty_assessment') or 0)"
  - penalty_asked: "penalty_outstanding if (F('status') == 'premium_grace_period' and penalty_outstanding > 0) else (latest_penalty_charge_amount if (F('status') == 'active' and penalty_outstanding > 0) else 0)"
  - days_since_latest_charge: "DAYS(LATEST('pdp_premium_ledger','posted_date', date_field='posted_date', event_type='pdp_premium_charge'), NOW)"
  - advance_month_asked: "P('monthly_plan_premium') if (days_since_latest_charge >= P('premium_due_day_of_month') and F('premium_billing_frequency') == 'monthly') else (3 * P('monthly_plan_premium') if (days_since_latest_charge >= P('premium_due_day_of_month') and F('premium_billing_frequency') == 'quarterly') else 0)"
  - result: "RND(premium_due + penalty_asked + advance_month_asked, 2)"
