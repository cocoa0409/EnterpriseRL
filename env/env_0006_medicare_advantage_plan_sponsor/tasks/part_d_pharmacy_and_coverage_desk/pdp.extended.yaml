      action_bindings:
        pdp_enrollment_requests.pdp_enrollment_request_id: pdp_enrollment_request_id
    state_contract:
      field: pdp_enrollment_requests.intake_status
      allowed:
      - recorded
      - awaiting_member_signature
      - submitted_to_cms
  params:
