- id: pdp_coverage_determination_timeliness
  subject:
  - pdp_coverage_determination_request
  - pdp_coverage_determination_decision
  rule: Every drug coverage request the plan accepts receives a decision, and its deadline is fixed by whether the request is standard or expedited and by whether it is an initial determination, an exception or a redetermination. The plan gives its decision no later than the decision deadline counted from the time the plan received the request, or from the time the prescriber's supporting statement arrived where the request is an exception. Hours are counted as full 24-hour periods from the recorded receipt time, calendar days are counted from the day after the receipt date with every day of the week counting, a decision given exactly on the deadline is in time, and the two units are never mixed. A formulary or tiering exception cannot be decided without the prescriber's supporting statement, and the clock for an exception starts when that statement arrives rather than when the member first asked. A request is expedited where waiting the standard time could seriously harm the member's life, health or ability to regain maximum function, and a prescriber's request for expedition is always granted. Where the plan does not decide by the deadline the request goes to the independent review entity automatically, and the member is told so without having to ask. An approval holds good until its approved through date, and a member whose approval is running out is told before it lapses rather than discovering it at the counter. A tiering exception may never move a drug to the specialty tier's cost share, and a request to do so is dismissed with the reason explained rather than silently denied.
  eligibility:
  - id: decision_within_deadline
    applies_to:
    - pdp_coverage_determination_decision
    kind: time
    condition: The plan gives its decision no later than the decision deadline counted from the time the plan received the request, or from the time the prescriber's supporting statement arrived where the request is an exception.
    evidence_fields:
    - pdp_coverage_determinations.pdp_determination_id
    - pdp_coverage_determinations.received_date
    - pdp_coverage_determinations.received_time
    - pdp_coverage_determinations.request_type
    - pdp_coverage_determinations.prescriber_statement_received
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - pdp_coverage_determinations.pdp_determination_id
      action_bindings:
        pdp_coverage_determinations.pdp_determination_id: pdp_determination_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the time the plan received the request
      anchor_source: pdp_coverage_determinations.received_time
      relation: not_after
      duration_source: variants.coverage_determination_standard_hours
      unit: elapsed_hours
      counting_rule: Hours are counted as full 24-hour periods from the recorded receipt time, calendar days are counted from the day after the receipt date with every day of the week counting, a decision given exactly on the deadline is in time, and the two units are never mixed.
      boundary: inclusive
  params:
    per_tier:
      Ridgecrest RxSecure Basic (PDP):
        coverage_determination_standard_hours: =coverage_determination_standard_hours
        coverage_determination_expedited_hours: =coverage_determination_expedited_hours
        exception_request_standard_hours: =exception_request_standard_hours
        exception_request_expedited_hours: =exception_request_expedited_hours
        redetermination_standard_days: =redetermination_standard_days
        redetermination_expedited_hours: =redetermination_expedited_hours
      Ridgecrest RxSecure Value (PDP):
        coverage_determination_standard_hours: =coverage_determination_standard_hours
        coverage_determination_expedited_hours: =coverage_determination_expedited_hours
        exception_request_standard_hours: =exception_request_standard_hours
        exception_request_expedited_hours: =exception_request_expedited_hours
        redetermination_standard_days: =redetermination_standard_days
        redetermination_expedited_hours: =redetermination_expedited_hours
      Ridgecrest RxSecure Select (PDP):
        coverage_determination_standard_hours: =coverage_determination_standard_hours
        coverage_determination_expedited_hours: =coverage_determination_expedited_hours
