    - {table: pdp_premium_ledger, aggregate: sum, field: amount, within_months: 12, filters: {event_type: pdp_penalty_assessment}}
    - {table: pdp_premium_ledger, aggregate: count, field: amount, within_months: null, filters: {event_type: pdp_premium_credit_adjustment, adjustment_reason_code: retroactive_rate_change}}
    - {table: pdp_premium_ledger, aggregate: count, field: amount, within_months: null, filters: {event_type: pdp_premium_credit_adjustment, adjustment_reason_code: billing_error_correction}}
