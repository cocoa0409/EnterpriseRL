- id: pdp_ext_troop_restatement
  base_policy_refs:
  - pdp_coverage_stage_progression
  - pdp_transition_and_utilization_management
  - pdp_point_of_sale_cost_share
  overwrite:
  - base_policy: pdp_coverage_stage_progression
    superseded_clause: >-
      Only what the member or a qualifying third party actually paid counts toward the threshold: plan payments, premiums and the late enrollment penalty never count
    replaced_by: >-
      Only what the member or a qualifying third party actually paid counts toward the out-of-pocket total, and never more than the plan's negotiated price recorded for the fill; plan payments, premiums, the late enrollment penalty and what a supplemental benefit card met at a pharmacy never count.
  trigger: state_due
  subject:
  - pdp_coverage_stage_update
  computes: restated_out_of_pocket_total
  target_tool: restate_out_of_pocket_total_a40a5cef
  params:
    long_history_fill_count: 4
    reversal_run_count: 2
  rule: >
    The out-of-pocket total restated on a drug plan enrollment for the contract year is what the
    member has paid on the fills the total is gathered over, less what a supplemental benefit card
    met at a pharmacy, less what the reversals on the pharmacy record take back out, together with
    what counts from a fill dispensed by an out-of-network pharmacy; the four are added and
    subtracted in that order and the total rounded once to two decimal places, and where the total
    comes out below nothing it is taken as nothing. Only what the member or a qualifying third party
    actually paid counts toward the out-of-pocket total, and never more than the plan's negotiated
    price recorded for the fill; plan payments, premiums, the late enrollment penalty and what a
    supplemental benefit card met at a pharmacy never count. The total is gathered over the fills
    standing paid on the pharmacy record with a fill date in the three months up to the handling
    date. Where the member's fills standing paid on the pharmacy record for the contract year are at
    least the number the plan treats as a long fill history and the enrollment stands active, the
    total is gathered instead over every fill standing paid on the record. Where the member's fills
    standing paid on the pharmacy record for the contract year are fewer than that number and the
    enrollment stands active, the total is gathered instead over the fills standing paid with a fill
    date in the six months up to the handling date. Nothing is taken as met by a supplemental benefit
    card. Where the member holds a supplemental benefit card programme standing active and the
    pharmacy and over-the-counter purchases settled on its card in the contract year are at least
    that programme's own quarterly over-the-counter sublimit, the amount taken as met by the card is
    that sublimit. Where the member holds a supplemental benefit card programme standing active and
    those settled purchases are below that programme's own quarterly over-the-counter sublimit, the
    amount taken as met by the card is the whole of those settled purchases. Nothing is taken back
    out for reversals. Where the reversals standing on the pharmacy record are at least the number
    the plan treats as a run of reversals and the enrollment stands active, what is taken back out is
    the whole of what every reversal on the record carries. Where the reversals standing on the
    pharmacy record are fewer than that number and the enrollment stands active, what is taken back
    out is what the reversals with a fill date in the three months up to the handling date carry.
    Nothing counts from a fill dispensed by an out-of-network pharmacy. Where a fill dispensed by an
    out-of-network pharmacy stands on the pharmacy record and the member's fills standing paid for
    the contract year are at least the number the plan treats as a long fill history, what counts
    from such a fill is worked out as the largest plan negotiated price recorded on one of them.
    Where a fill dispensed by an out-of-network pharmacy stands on the pharmacy record and the
    member's fills standing paid are fewer than that number, what counts from such a fill is worked
    out as the plan negotiated price recorded on the latest of them. What the member handed over at
    such a pharmacy above the plan's negotiated price for the fill never counts. The payment stage
    the enrollment then
    shows is read off the restated total rather than kept as a separate fact, so a restatement can
    return a member to an earlier stage.
  prerequisite: []
  cross_category:
  - category: allowance
    as: history
    reads:
    - status
    - otc_quarterly_sublimit
    - allowance_card_ledger.amount
    - allowance_card_ledger.event_type
    - allowance_card_ledger.merchant_category
    - allowance_card_ledger.settlement_status
    note: what a supplemental benefit card met at a pharmacy, which never counts toward the out-of-pocket total, is decided from the card programme's standing, its own quarterly over-the-counter sublimit and the purchases settled on its card ledger.
  compute:
  - paid_fill_count: "COUNT('pdp_pharmacy_claims', event_type='pdp_pharmacy_claim_adjudication', claim_status='paid')"
  - member_paid_all: "SUM('pdp_pharmacy_claims','member_paid_amount', event_type='pdp_pharmacy_claim_adjudication', claim_status='paid')"
  - member_paid_last_six: "SUM('pdp_pharmacy_claims','member_paid_amount', within_months=6, date_field='fill_date', event_type='pdp_pharmacy_claim_adjudication', claim_status='paid')"
  - member_paid_last_three: "SUM('pdp_pharmacy_claims','member_paid_amount', within_months=3, date_field='fill_date', event_type='pdp_pharmacy_claim_adjudication', claim_status='paid')"
  - paid_counted: "member_paid_all if (paid_fill_count >= K('long_history_fill_count') and F('status') == 'active') else (member_paid_last_six if (paid_fill_count < K('long_history_fill_count') and F('status') == 'active') else member_paid_last_three)"
  - card_standing: "CFIELD('allowance','status')"
  - card_otc_sublimit: "float(CPARAM('allowance','otc_quarterly_sublimit') or 0)"
  - card_pharmacy_settled: "XSUM('allowance','allowance_card_ledger','amount', event_type='allowance_purchase', merchant_category='pharmacy_and_otc', settlement_status='settled')"
  - card_met_amount: "card_otc_sublimit if (card_standing == 'active' and card_pharmacy_settled >= card_otc_sublimit) else (card_pharmacy_settled if (card_standing == 'active' and card_pharmacy_settled < card_otc_sublimit) else 0)"
  - reversal_count: "COUNT('pdp_pharmacy_claims', event_type='pdp_pharmacy_claim_reversal')"
  - reversal_all: "SUM('pdp_pharmacy_claims','member_paid_amount', event_type='pdp_pharmacy_claim_reversal')"
  - reversal_last_three: "SUM('pdp_pharmacy_claims','member_paid_amount', within_months=3, date_field='fill_date', event_type='pdp_pharmacy_claim_reversal')"
  - reversal_offset: "ABS(reversal_all) if (reversal_count >= K('reversal_run_count') and F('status') == 'active') else (ABS(reversal_last_three) if (reversal_count < K('reversal_run_count') and F('status') == 'active') else 0)"
  - out_of_network_count: "COUNT('pdp_pharmacy_claims', pharmacy_network_status='out_of_network')"
  - out_of_network_price: "MAX('pdp_pharmacy_claims','negotiated_price', pharmacy_network_status='out_of_network')"
  - out_of_network_latest_price: "float(LATEST('pdp_pharmacy_claims','negotiated_price', date_field='fill_date', pharmacy_network_status='out_of_network') or 0)"
  - out_of_network_counted: "out_of_network_price if (out_of_network_count >= 1 and paid_fill_count >= K('long_history_fill_count')) else (out_of_network_latest_price if (out_of_network_count >= 1 and paid_fill_count < K('long_history_fill_count')) else 0)"
  - result: "MX(0, RND(paid_counted - card_met_amount - reversal_offset + out_of_network_counted, 2))"
  compute_basis:
    paid_fill_count: "Where the member's fills standing paid on the pharmacy record for the contract year are at least the number the plan treats as a long fill history and the enrollment stands active, the total is gathered instead over every fill standing paid on the record."
    member_paid_all: "the total is gathered instead over every fill standing paid on the record"
    member_paid_last_six: "the total is gathered instead over the fills standing paid with a fill date in the six months up to the handling date"
    member_paid_last_three: "The total is gathered over the fills standing paid on the pharmacy record with a fill date in the three months up to the handling date."
    paid_counted: "The total is gathered over the fills standing paid on the pharmacy record with a fill date in the three months up to the handling date. Where the member's fills standing paid on the pharmacy record for the contract year are at least the number the plan treats as a long fill history and the enrollment stands active, the total is gathered instead over every fill standing paid on the record. Where the member's fills standing paid on the pharmacy record for the contract year are fewer than that number and the enrollment stands active, the total is gathered instead over the fills standing paid with a fill date in the six months up to the handling date."
    card_standing: "Where the member holds a supplemental benefit card programme standing active and the pharmacy and over-the-counter purchases settled on its card in the contract year are at least that programme's own quarterly over-the-counter sublimit, the amount taken as met by the card is that sublimit."
    card_otc_sublimit: "the amount taken as met by the card is that sublimit"
    card_pharmacy_settled: "Where the member holds a supplemental benefit card programme standing active and those settled purchases are below that programme's own quarterly over-the-counter sublimit, the amount taken as met by the card is the whole of those settled purchases."
    card_met_amount: "Nothing is taken as met by a supplemental benefit card. Where the member holds a supplemental benefit card programme standing active and the pharmacy and over-the-counter purchases settled on its card in the contract year are at least that programme's own quarterly over-the-counter sublimit, the amount taken as met by the card is that sublimit. Where the member holds a supplemental benefit card programme standing active and those settled purchases are below that programme's own quarterly over-the-counter sublimit, the amount taken as met by the card is the whole of those settled purchases."
    reversal_count: "Where the reversals standing on the pharmacy record are at least the number the plan treats as a run of reversals and the enrollment stands active, what is taken back out is the whole of what every reversal on the record carries."
    reversal_all: "what is taken back out is the whole of what every reversal on the record carries"
    reversal_last_three: "what is taken back out is what the reversals with a fill date in the three months up to the handling date carry"
    reversal_offset: "Nothing is taken back out for reversals. Where the reversals standing on the pharmacy record are at least the number the plan treats as a run of reversals and the enrollment stands active, what is taken back out is the whole of what every reversal on the record carries. Where the reversals standing on the pharmacy record are fewer than that number and the enrollment stands active, what is taken back out is what the reversals with a fill date in the three months up to the handling date carry."
    out_of_network_count: "Where a fill dispensed by an out-of-network pharmacy stands on the pharmacy record and the member's fills standing paid for the contract year are at least the number the plan treats as a long fill history, what counts from such a fill is worked out as the largest plan negotiated price recorded on one of them."
    out_of_network_price: "what counts from such a fill is worked out as the largest plan negotiated price recorded on one of them"
    out_of_network_latest_price: "what counts from such a fill is worked out as the plan negotiated price recorded on the latest of them"
    out_of_network_counted: "Nothing counts from a fill dispensed by an out-of-network pharmacy. Where a fill dispensed by an out-of-network pharmacy stands on the pharmacy record and the member's fills standing paid for the contract year are at least the number the plan treats as a long fill history, what counts from such a fill is worked out as the largest plan negotiated price recorded on one of them. Where a fill dispensed by an out-of-network pharmacy stands on the pharmacy record and the member's fills standing paid are fewer than that number, what counts from such a fill is worked out as the plan negotiated price recorded on the latest of them. What the member handed over at such a pharmacy above the plan's negotiated price for the fill never counts."
    result: "The out-of-pocket total restated on a drug plan enrollment for the contract year is what the member has paid on the fills the total is gathered over, less what a supplemental benefit card met at a pharmacy, less what the reversals on the pharmacy record take back out, together with what counts from a fill dispensed by an out-of-network pharmacy; the four are added and subtracted in that order and the total rounded once to two decimal places, and where the total comes out below nothing it is taken as nothing."
  factors:
  - id: gathered_fill_window
    effect: method
    decides: paid_counted
    bindings: [paid_fill_count, member_paid_all, member_paid_last_six, member_paid_last_three, paid_counted]
    ladder:
    - when: "the member's fills standing paid on the pharmacy record for the contract year are at least the number the plan treats as a long fill history and the enrollment stands active"
      method: "the total is gathered over every fill standing paid on the record"
    - when: "the member's fills standing paid on the pharmacy record for the contract year are fewer than that number and the enrollment stands active"
      method: "the total is gathered over the fills standing paid with a fill date in the six months up to the handling date"
    - when: "otherwise"
      method: "the total is gathered over the fills standing paid with a fill date in the three months up to the handling date"
    baseline:
      paid_counted: "member_paid_last_three"
    evidence: [history, date]
    cross_difficulty: null
  - id: card_met_at_pharmacy
    effect: parameter
    decides: card_met_amount
    bindings: [card_standing, card_otc_sublimit, card_pharmacy_settled, card_met_amount]
    ladder:
    - when: "the member holds a supplemental benefit card programme standing active and the pharmacy and over-the-counter purchases settled on its card in the contract year are at least that programme's own quarterly over-the-counter sublimit"
      value: "that programme's own quarterly over-the-counter sublimit"
    - when: "the member holds a supplemental benefit card programme standing active and those settled purchases are below that programme's own quarterly over-the-counter sublimit"
