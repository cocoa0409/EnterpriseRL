  factors:
  - id: formulary_tier_figure
    effect: parameter
    decides: tier_figure
    bindings: [rejected_fill_tier, tier_figure]
    ladder:
    - when: "the fill the pharmacy is holding sits on the preferred brand tier"
      value: "the tier's preferred brand figure"
    - when: "the fill the pharmacy is holding sits on the preferred generic tier"
      value: "the tier's preferred generic figure"
    - when: "otherwise"
      value: "the tier's generic figure"
    baseline:
      tier_figure: "P('tier_2_generic_copay_30')"
    evidence: [history]
    cross_difficulty: null
  - id: pharmacy_standing_addition
    effect: parameter
    decides: standing_differential
    bindings: [rejected_fill_network, standing_differential]
    ladder:
    - when: "the dispensing pharmacy carries standard cost sharing and the fill sits on the preferred brand tier"
      value: "the difference between the tier's standard retail preferred brand figure and its preferred brand figure"
    - when: "the dispensing pharmacy carries standard cost sharing and the fill sits on the preferred generic tier"
      value: "the difference between the tier's standard retail preferred generic figure and its preferred generic figure"
    - when: "otherwise"
      value: "nothing"
    baseline:
      standing_differential: "0"
    evidence: [history]
    cross_difficulty: null
  - id: extended_supply_basis
    effect: method
    decides: supply_charge
    bindings: [rejected_fill_days, supply_charge]
    ladder:
    - when: "the fill is for more than thirty days' supply and the dispensing pharmacy is the plan's mail order pharmacy"
      method: "the figure the formulary tier gives is multiplied by the tier's mail order multiplier and rounded to two decimal places"
    - when: "the fill is for more than thirty days' supply and the dispensing pharmacy carries preferred or standard cost sharing"
      method: "the figure the formulary tier gives is multiplied by the tier's ninety-day retail multiplier and rounded to two decimal places"
    - when: "otherwise"
      method: "the figure the formulary tier gives stands as the supply charge"
    baseline:
      supply_charge: "tier_figure"
    evidence: [history]
    cross_difficulty: null
  - id: acting_price_basis
    effect: method
    decides: price_used
    bindings: [rejected_fill_price, paid_fill_count, latest_paid_price, largest_paid_price, price_used]
    ladder:
    - when: "the fill the pharmacy is holding carries a plan negotiated price and the member's fills standing paid for the contract year are at least the number the plan treats as settled therapy"
      method: "the price is taken from the fill the pharmacy is holding"
    - when: "the fill the pharmacy is holding carries no plan negotiated price and the member's fills standing paid for the contract year are at least that number"
      method: "the price is taken from the member's latest fill standing paid"
    - when: "otherwise"
      method: "the price is taken from the largest plan negotiated price standing on a fill the member has paid for in the contract year"
    baseline:
      price_used: "largest_paid_price"
    evidence: [history]
    cross_difficulty: null
  - id: deductible_still_to_be_met
    effect: parameter
    decides: deductible_left
    bindings: [troop_on_record, member_paid_last_six, deductible_left]
    ladder:
    - when: "the member's fills standing paid for the contract year are at least the number the plan treats as a long fill history and the out-of-pocket total standing on the enrollment is more than nothing"
      value: "the tier's annual deductible less that out-of-pocket total, never below nothing"
    - when: "the member's fills standing paid for the contract year are fewer than that number and the out-of-pocket total standing on the enrollment is more than nothing"
      value: "the tier's annual deductible less what the member has paid on fills with a fill date in the six months up to the handling date, never below nothing"
    - when: "otherwise"
      value: "the tier's annual deductible in full"
    baseline:
      deductible_left: "P('annual_deductible')"
    evidence: [history]
    cross_difficulty: null
  - id: stage_boundary_split
    effect: method
    decides: member_share
    bindings: [fills_at_deductible_stage, member_share]
    ladder:
    - when: "a fill stands paid on the pharmacy record at the deductible stage and the price the cost share is taken from is more than the deductible still to be met"
      method: "the fill is split at the boundary: the member pays the deductible still to be met together with the cost share for the fill in the proportion the price above the deductible bears to the whole price, that proportional part being rounded to two decimal places before it is added"
    - when: "a fill stands paid on the pharmacy record at the deductible stage and the price the cost share is taken from is at most the deductible still to be met"
      method: "the member pays the whole of that price"
    - when: "otherwise"
      method: "the member pays the cost share for the fill"
    baseline:
      member_share: "fill_cost_share"
    evidence: [history]
    cross_difficulty: null
  baseline:
    rule: >-
      What a member pays at the counter for a fill the pharmacy is holding is the share the payment
      stage leaves them, held to the ceiling the fill is held to, and rounded once to two decimal
      places; no intermediate is rounded except where this rule says so. The supply charge the
      fill earns is the figure the formulary tier gives. The figure the formulary tier gives is the
      tier's generic figure. Nothing is added for the dispensing pharmacy's standing. The cost share
      for the fill is the supply charge the fill earns together with whatever the dispensing
      pharmacy's standing adds, and the multiplier never acts on what the pharmacy's standing adds.
      The price the cost share is taken from is the largest plan
      negotiated price standing on a fill the member has paid for in the contract year. The
      deductible still to be met is the tier's annual deductible in full. The share the payment stage
      leaves the member is the cost share for the fill. The member never pays more than the plan's
      negotiated price recorded for the fill the pharmacy is holding, however the multiplier falls;
      where that fill carries no such price, the price the cost share is taken from serves as the
      ceiling instead. A fill rejected at the counter is never simply refused: the member is told the reason code and
      what the plan needs.
    params:
    - tier_2_generic_copay_30
    - annual_deductible
  inputs:
    history:
    - {table: pdp_pharmacy_claims, aggregate: latest, field: negotiated_price, within_months: null, filters: {claim_status: rejected}}
    - {table: pdp_pharmacy_claims, aggregate: sum, field: member_paid_amount, within_months: 6, filters: {event_type: pdp_pharmacy_claim_adjudication, claim_status: paid}}
    - {table: pdp_pharmacy_claims, aggregate: max, field: negotiated_price, within_months: null, filters: {event_type: pdp_pharmacy_claim_adjudication, claim_status: paid}}
    - {table: pdp_pharmacy_claims, aggregate: count, field: pdp_pharmacy_claim_id, within_months: null, filters: {event_type: pdp_pharmacy_claim_adjudication, claim_status: paid, coverage_stage_at_fill: deductible}}
    cross_category: []
