- id: pdp_ext_exception_approval_term
  base_policy_refs:
  - pdp_coverage_determination_timeliness
  - pdp_point_of_sale_cost_share
  - pdp_transition_and_utilization_management
  overwrite: []
  trigger: state_due
  subject:
  - pdp_coverage_determination_decision
  computes: approval_term_days
  target_tool: issue_exception_decision_dd13544d
  params:
    expedited_term_days: 90
    maintenance_term_days: 365
    ordinary_term_days: 180
    long_review_days: 60
    short_review_days: 30
    mail_extension_days: 30
    long_term_care_extension_days: 60
    quantity_review_days: 45
    short_quantity_review_days: 15
    settled_therapy_fill_count: 3
    floor_days: 30
  rule: >
    The run for which an approval on a drug coverage request holds good is worked out in whole days
    from the day the decision is given. The plan starts from the term the request itself earns,
    counts that term on the basis the member's fill history gives, takes off the allowance a standing
    denial earns, adds the allowance the pharmacy channel earns, takes off the days already elapsed
    from the day the run is anchored to, takes off the allowance the plan's quantity limits earn, and
    never issues a run shorter than the plan's floor; the subtractions and the addition are made in
    that order on the counted term, and the floor is compared only with the figure they leave. The
    term the request earns is the plan's ordinary term. Where the request the decision disposes of is
    an expedited coverage determination and the prescriber's supporting statement stands received on
    it, the term the request earns is instead the plan's expedited term, because an expedited
    decision rests on the evidence that could be gathered in the time allowed. Where the request the
    decision disposes of is a standard coverage determination and the prescriber's supporting
    statement stands received on it, the term the request earns is instead the plan's maintenance
    term. The counted term is the term the request earns, counted as booked. Where the member's fills
    standing paid on the pharmacy record for the contract year are at least the number the plan
    treats as settled therapy and the prescriber's supporting statement stands received, the counted
    term is instead taken in whole thirty-day supply cycles and rounded down to a whole cycle. Where
    the member's fills standing paid on the pharmacy record for the contract year are fewer than that
    number and the prescriber's supporting statement stands received, the counted term is instead
    taken in whole weeks and rounded down to a whole week. No allowance is taken
    off for a standing denial. Where a denied decision stands on the member's coverage determination
    record and the member's fills standing paid for the contract year are at least the number the
    plan treats as settled therapy, the allowance taken off is the plan's longer review allowance.
    Where a denied decision stands on the member's coverage determination record and the member's
    fills standing paid are fewer than that number, the allowance taken off is the plan's shorter
    review allowance. No allowance is added for the pharmacy channel. Where the member's fills
    standing paid and dispensed by the plan's mail order pharmacy are at least the number the plan
    treats as settled therapy, the allowance added is the plan's mail order allowance, because a
    ninety-day supply by post must be covered to the end of its own run. Where the member's fills
    standing paid and dispensed by a long-term care pharmacy are at least that number, the allowance
    added is the plan's long-term care allowance. The run is anchored to the day the decision is
    given, so no days are taken off as already elapsed. Where a fill stands paid on the pharmacy
    record and the member's fills standing paid for the contract year are at least the number the
    plan treats as settled therapy, the run is anchored instead to the day of the member's latest
    fill standing paid, and the days from that day to the handling date are taken off as already
    elapsed. Where no fill stands paid on the pharmacy record and a request stands received on the
    member's coverage determination record, the run is anchored instead to the day the plan received
    the latest request, and the days from that day to the handling date are taken off as already
    elapsed. No allowance is taken off for quantity limits. Where the plan enforces quantity limits
    at the point of sale and a fill standing paid on the pharmacy record sits on the preferred brand
    tier, the allowance taken off is the plan's quantity review allowance. Where the plan enforces
    quantity limits at the point of sale and no fill standing paid on the pharmacy record sits on the
    preferred brand tier, the allowance taken off is the plan's shorter quantity review allowance. A request the prescriber has asked to have expedited is always expedited, and
    the run a decision earns is never shortened because the member rather than the prescriber asked
    for the drug.
  prerequisite: []
  cross_category: []
  compute:
  - latest_request_type: "LATEST('pdp_coverage_determinations','request_type', date_field='received_date', event_type='pdp_coverage_determination_request')"
  - latest_statement_state: "LATEST('pdp_coverage_determinations','prescriber_statement_received', date_field='received_date', event_type='pdp_coverage_determination_request')"
  - base_term_days: "K('expedited_term_days') if (latest_request_type == 'expedited_coverage_determination' and latest_statement_state == 'received') else (K('maintenance_term_days') if (latest_request_type == 'standard_coverage_determination' and latest_statement_state == 'received') else K('ordinary_term_days'))"
  - paid_fill_count: "COUNT('pdp_pharmacy_claims', event_type='pdp_pharmacy_claim_adjudication', claim_status='paid')"
  - term_counted: "int(base_term_days / 30) * 30 if (paid_fill_count >= K('settled_therapy_fill_count') and latest_statement_state == 'received') else (int(base_term_days / 7) * 7 if (paid_fill_count < K('settled_therapy_fill_count') and latest_statement_state == 'received') else base_term_days)"
  - denied_decisions: "COUNT('pdp_coverage_determinations', event_type='pdp_coverage_determination_decision', decision_outcome='denied')"
  - denial_allowance: "K('long_review_days') if (denied_decisions >= 1 and paid_fill_count >= K('settled_therapy_fill_count')) else (K('short_review_days') if (denied_decisions >= 1 and paid_fill_count < K('settled_therapy_fill_count')) else 0)"
  - mail_order_fills: "COUNT('pdp_pharmacy_claims', event_type='pdp_pharmacy_claim_adjudication', claim_status='paid', pharmacy_network_status='mail_order')"
  - long_term_care_fills: "COUNT('pdp_pharmacy_claims', event_type='pdp_pharmacy_claim_adjudication', claim_status='paid', pharmacy_network_status='long_term_care')"
  - channel_extension: "K('mail_extension_days') if (mail_order_fills >= K('settled_therapy_fill_count')) else (K('long_term_care_extension_days') if (long_term_care_fills >= K('settled_therapy_fill_count')) else 0)"
  - latest_paid_fill_date: "LATEST('pdp_pharmacy_claims','fill_date', date_field='fill_date', event_type='pdp_pharmacy_claim_adjudication', claim_status='paid')"
  - latest_request_date: "LATEST('pdp_coverage_determinations','received_date', date_field='received_date', event_type='pdp_coverage_determination_request')"
  - requests_on_record: "COUNT('pdp_coverage_determinations', event_type='pdp_coverage_determination_request')"
  - anchor_offset: "DAYS(latest_paid_fill_date, NOW) if (latest_paid_fill_date != None and paid_fill_count >= K('settled_therapy_fill_count')) else (DAYS(latest_request_date, NOW) if (paid_fill_count < 1 and requests_on_record >= 1) else 0)"
  - restricted_tier_fills: "COUNT('pdp_pharmacy_claims', event_type='pdp_pharmacy_claim_adjudication', claim_status='paid', formulary_tier='tier_3_preferred_brand')"
  - quantity_allowance: "K('quantity_review_days') if (P('quantity_limit_enforced') == True and restricted_tier_fills >= 1) else (K('short_quantity_review_days') if (P('quantity_limit_enforced') == True and restricted_tier_fills < 1) else 0)"
  - result: "MX(K('floor_days'), term_counted - denial_allowance + channel_extension - anchor_offset - quantity_allowance)"
  compute_basis:
    latest_request_type: "Where the request the decision disposes of is a standard coverage determination and the prescriber's supporting statement stands received on it, the term the request earns is instead the plan's maintenance term."
    latest_statement_state: "Where the request the decision disposes of is an expedited coverage determination and the prescriber's supporting statement stands received on it, the term the request earns is instead the plan's expedited term, because an expedited decision rests on the evidence that could be gathered in the time allowed."
    base_term_days: "The term the request earns is the plan's ordinary term. Where the request the decision disposes of is an expedited coverage determination and the prescriber's supporting statement stands received on it, the term the request earns is instead the plan's expedited term, because an expedited decision rests on the evidence that could be gathered in the time allowed. Where the request the decision disposes of is a standard coverage determination and the prescriber's supporting statement stands received on it, the term the request earns is instead the plan's maintenance term."
    paid_fill_count: "Where the member's fills standing paid on the pharmacy record for the contract year are at least the number the plan treats as settled therapy and the prescriber's supporting statement stands received, the counted term is instead taken in whole thirty-day supply cycles and rounded down to a whole cycle."
    term_counted: "The counted term is the term the request earns, counted as booked. Where the member's fills standing paid on the pharmacy record for the contract year are at least the number the plan treats as settled therapy and the prescriber's supporting statement stands received, the counted term is instead taken in whole thirty-day supply cycles and rounded down to a whole cycle. Where the member's fills standing paid on the pharmacy record for the contract year are fewer than that number and the prescriber's supporting statement stands received, the counted term is instead taken in whole weeks and rounded down to a whole week."
    denied_decisions: "Where a denied decision stands on the member's coverage determination record and the member's fills standing paid for the contract year are at least the number the plan treats as settled therapy, the allowance taken off is the plan's longer review allowance."
    denial_allowance: "No allowance is taken off for a standing denial. Where a denied decision stands on the member's coverage determination record and the member's fills standing paid for the contract year are at least the number the plan treats as settled therapy, the allowance taken off is the plan's longer review allowance. Where a denied decision stands on the member's coverage determination record and the member's fills standing paid are fewer than that number, the allowance taken off is the plan's shorter review allowance."
    mail_order_fills: "Where the member's fills standing paid and dispensed by the plan's mail order pharmacy are at least the number the plan treats as settled therapy, the allowance added is the plan's mail order allowance, because a ninety-day supply by post must be covered to the end of its own run."
    long_term_care_fills: "Where the member's fills standing paid and dispensed by a long-term care pharmacy are at least that number, the allowance added is the plan's long-term care allowance."
    channel_extension: "No allowance is added for the pharmacy channel. Where the member's fills standing paid and dispensed by the plan's mail order pharmacy are at least the number the plan treats as settled therapy, the allowance added is the plan's mail order allowance, because a ninety-day supply by post must be covered to the end of its own run. Where the member's fills standing paid and dispensed by a long-term care pharmacy are at least that number, the allowance added is the plan's long-term care allowance."
    latest_paid_fill_date: "Where a fill stands paid on the pharmacy record and the member's fills standing paid for the contract year are at least the number the plan treats as settled therapy, the run is anchored instead to the day of the member's latest fill standing paid, and the days from that day to the handling date are taken off as already elapsed."
    latest_request_date: "Where no fill stands paid on the pharmacy record and a request stands received on the member's coverage determination record, the run is anchored instead to the day the plan received the latest request, and the days from that day to the handling date are taken off as already elapsed."
    requests_on_record: "Where no fill stands paid on the pharmacy record and a request stands received on the member's coverage determination record, the run is anchored instead to the day the plan received the latest request, and the days from that day to the handling date are taken off as already elapsed."
    anchor_offset: "The run is anchored to the day the decision is given, so no days are taken off as already elapsed. Where a fill stands paid on the pharmacy record and the member's fills standing paid for the contract year are at least the number the plan treats as settled therapy, the run is anchored instead to the day of the member's latest fill standing paid, and the days from that day to the handling date are taken off as already elapsed. Where no fill stands paid on the pharmacy record and a request stands received on the member's coverage determination record, the run is anchored instead to the day the plan received the latest request, and the days from that day to the handling date are taken off as already elapsed."
    restricted_tier_fills: "Where the plan enforces quantity limits at the point of sale and a fill standing paid on the pharmacy record sits on the preferred brand tier, the allowance taken off is the plan's quantity review allowance."
    quantity_allowance: "No allowance is taken off for quantity limits. Where the plan enforces quantity limits at the point of sale and a fill standing paid on the pharmacy record sits on the preferred brand tier, the allowance taken off is the plan's quantity review allowance. Where the plan enforces quantity limits at the point of sale and no fill standing paid on the pharmacy record sits on the preferred brand tier, the allowance taken off is the plan's shorter quantity review allowance."
    result: "The plan starts from the term the request itself earns, counts that term on the basis the member's fill history gives, takes off the allowance a standing denial earns, adds the allowance the pharmacy channel earns, takes off the days already elapsed from the day the run is anchored to, takes off the allowance the plan's quantity limits earn, and never issues a run shorter than the plan's floor; the subtractions and the addition are made in that order on the counted term, and the floor is compared only with the figure they leave."
  factors:
  - id: request_earned_term
    effect: parameter
    decides: base_term_days
    bindings: [latest_request_type, latest_statement_state, base_term_days]
    ladder:
    - when: "the request the decision disposes of is an expedited coverage determination and the prescriber's supporting statement stands received on it"
      value: "the plan's expedited term"
    - when: "the request the decision disposes of is a standard coverage determination and the prescriber's supporting statement stands received on it"
      value: "the plan's maintenance term"
    - when: "otherwise"
      value: "the plan's ordinary term"
    baseline:
      base_term_days: "K('ordinary_term_days')"
    evidence: [history]
    cross_difficulty: null
  - id: term_counting_basis
    effect: method
    decides: term_counted
    bindings: [paid_fill_count, term_counted]
    ladder:
    - when: "the member's fills standing paid on the pharmacy record for the contract year are at least the number the plan treats as settled therapy and the prescriber's supporting statement stands received"
      method: "the term is taken in whole thirty-day supply cycles and rounded down to a whole cycle"
    - when: "the member's fills standing paid on the pharmacy record for the contract year are fewer than that number and the prescriber's supporting statement stands received"
      method: "the term is taken in whole weeks and rounded down to a whole week"
    - when: "otherwise"
      method: "the term is counted as booked"
    baseline:
      term_counted: "base_term_days"
    evidence: [history]
    cross_difficulty: null
  - id: standing_denial_allowance
    effect: parameter
    decides: denial_allowance
    bindings: [denied_decisions, denial_allowance]
    ladder:
    - when: "a denied decision stands on the member's coverage determination record and the member's fills standing paid for the contract year are at least the number the plan treats as settled therapy"
      value: "the plan's longer review allowance"
    - when: "a denied decision stands on the member's coverage determination record and the member's fills standing paid are fewer than that number"
      value: "the plan's shorter review allowance"
    - when: "otherwise"
      value: "nothing"
    baseline:
      denial_allowance: "0"
    evidence: [history]
    cross_difficulty: null
  - id: pharmacy_channel_allowance
    effect: parameter
    decides: channel_extension
    bindings: [mail_order_fills, long_term_care_fills, channel_extension]
    ladder:
    - when: "the member's fills standing paid and dispensed by the plan's mail order pharmacy are at least the number the plan treats as settled therapy"
      value: "the plan's mail order allowance"
    - when: "the member's fills standing paid and dispensed by a long-term care pharmacy are at least that number"
      value: "the plan's long-term care allowance"
    - when: "otherwise"
      value: "nothing"
    baseline:
      channel_extension: "0"
    evidence: [history]
    cross_difficulty: null
  - id: run_anchor
    effect: method
    decides: anchor_offset
    bindings: [latest_paid_fill_date, latest_request_date, requests_on_record, anchor_offset]
    ladder:
    - when: "a fill stands paid on the pharmacy record and the member's fills standing paid for the contract year are at least the number the plan treats as settled therapy"
      method: "the run is anchored to the day of the member's latest fill standing paid, and the days from that day to the handling date are taken off as already elapsed"
    - when: "no fill stands paid on the pharmacy record and a request stands received on the member's coverage determination record"
      method: "the run is anchored to the day the plan received the latest request, and the days from that day to the handling date are taken off as already elapsed"
    - when: "otherwise"
      method: "the run is anchored to the day the decision is given, so no days are taken off as already elapsed"
    baseline:
      anchor_offset: "0"
    evidence: [history, date]
    cross_difficulty: null
  - id: quantity_limit_allowance
    effect: parameter
    decides: quantity_allowance
    bindings: [restricted_tier_fills, quantity_allowance]
    ladder:
    - when: "the plan enforces quantity limits at the point of sale and a fill standing paid on the pharmacy record sits on the preferred brand tier"
      value: "the plan's quantity review allowance"
    - when: "the plan enforces quantity limits at the point of sale and no fill standing paid on the pharmacy record sits on the preferred brand tier"
      value: "the plan's shorter quantity review allowance"
    - when: "otherwise"
      value: "nothing"
    baseline:
      quantity_allowance: "0"
    evidence: [history]
    cross_difficulty: null
  baseline:
    rule: >-
      The run for which an approval on a drug coverage request holds good is worked out in whole days
      from the day the decision is given. The plan starts from the term the request itself earns,
      counts that term on the basis the member's fill history gives, takes off the allowance a
      standing denial earns, adds the allowance the pharmacy channel earns, takes off the days
      already elapsed from the day the run is anchored to, takes off the allowance the plan's
      quantity limits earn, and never issues a run shorter than the plan's floor; the subtractions
      and the addition are made in that order on the counted term, and the floor is compared only
      with the figure they leave. The term the request earns is the plan's ordinary term. The counted
      term is the term the request earns, counted as booked. No allowance is taken off for a standing
      denial. No allowance is added for the pharmacy channel. The run is anchored to the day the
      decision is given, so no days are taken off as already elapsed. No allowance is taken off for
      quantity limits. A request the prescriber has asked to have expedited is always expedited, and
      the run a decision earns is never shortened because the member rather than the prescriber asked
      for the drug.
    params:
    - ordinary_term_days
    - floor_days
  inputs:
    history:
    - {table: pdp_coverage_determinations, aggregate: latest, field: request_type, within_months: null, filters: {event_type: pdp_coverage_determination_request}}
    - {table: pdp_coverage_determinations, aggregate: count, field: pdp_determination_id, within_months: null, filters: {event_type: pdp_coverage_determination_decision, decision_outcome: denied}}
    - {table: pdp_pharmacy_claims, aggregate: count, field: pdp_pharmacy_claim_id, within_months: null, filters: {event_type: pdp_pharmacy_claim_adjudication, claim_status: paid, pharmacy_network_status: mail_order}}
    - {table: pdp_pharmacy_claims, aggregate: latest, field: fill_date, within_months: null, filters: {event_type: pdp_pharmacy_claim_adjudication, claim_status: paid}}
    cross_category: []
- id: pdp_ext_counter_cost_share
  base_policy_refs:
  - pdp_point_of_sale_cost_share
  - pdp_transition_and_utilization_management
  - pdp_coverage_stage_progression
  overwrite:
  - base_policy: pdp_point_of_sale_cost_share
    superseded_clause: >-
      What the member pays at the counter is taken from the negotiated price for the product
    replaced_by: >-
      Where the fill the pharmacy is holding carries no plan negotiated price, the cost share is taken from a price standing on another of the member's fills rather than from that fill.
  - base_policy: pdp_point_of_sale_cost_share
    superseded_clause: >-
      mail order and ninety-day retail fills take the one-month figure multiplied by the tier's extended-supply multiplier
    replaced_by: >-
      The cost share for the fill is the supply charge the fill earns together with whatever the dispensing pharmacy's standing adds, and the multiplier never acts on what the pharmacy's standing adds.
  trigger: on_request
  subject:
  - pdp_pharmacy_claim_adjudication
  computes: member_paid_amount
  target_tool: settle_counter_fill_eaef344a
  params:
    settled_therapy_fill_count: 3
    long_history_fill_count: 4
  rule: >
    What a member pays at the counter for a fill the pharmacy is holding is the share the payment
    stage leaves them, held to the ceiling the fill is held to, and rounded once to two decimal
    places; no intermediate is rounded except where this rule says so. What the member pays at the
    counter is not fixed before the out-of-pocket total standing on the drug plan enrollment agrees
    with what the pharmacy record shows the member has borne for the contract year. What the member pays at the counter for a fill on a tier the plan enforces prior
    authorisation on is not fixed until an approved coverage determination for that product stands on
    the member's coverage determination record, good through a day not earlier than the fill date.
    The supply charge the fill earns is the figure the formulary tier gives. Where the fill is for
    more than thirty days' supply and the dispensing pharmacy is the plan's mail order pharmacy, the
    supply charge the fill earns is instead the figure the formulary tier gives multiplied by the
    tier's mail order multiplier and rounded to two decimal places. Where the fill is for more than
    thirty days' supply and the dispensing pharmacy carries preferred or standard cost sharing, the
    supply charge the fill earns is instead the figure the formulary tier gives multiplied by the
    tier's ninety-day retail multiplier and rounded to two decimal places. The figure the formulary
    tier gives is the tier's generic figure. Where the fill the pharmacy is holding sits on the preferred brand
    tier, the figure the formulary tier gives is instead the tier's preferred brand figure. Where the
    fill the pharmacy is holding sits on the preferred generic tier, the figure the formulary tier
    gives is instead the tier's preferred generic figure. Nothing is added for the dispensing
    pharmacy's standing. Where the dispensing pharmacy carries standard cost sharing and the fill
    sits on the preferred brand tier, what is added is the difference between the tier's standard
    retail preferred brand figure and its preferred brand figure. Where the dispensing pharmacy
    carries standard cost sharing and the fill sits on the preferred generic tier, what is added is
    the difference between the tier's standard retail preferred generic figure and its preferred
    generic figure. The cost share for the fill is the supply charge the fill earns together with
    whatever the dispensing pharmacy's standing adds, and the multiplier never acts on what the
    pharmacy's standing adds. The price the cost share is taken from is the largest plan negotiated price
    standing on a fill the member has paid for in the contract year. Where the fill the pharmacy is
    holding carries a plan negotiated price and the member's fills standing paid for the contract
    year are at least the number the plan treats as settled therapy, the price the cost share is
    taken from is instead the price recorded on the fill the pharmacy is holding. Where the fill the
    pharmacy is holding carries no plan negotiated price and the member's fills standing paid for the
    contract year are at least that number, the price the cost share is taken from is instead the
    price recorded on the member's latest fill standing paid. The deductible still to be met is the
    tier's annual deductible in full. Where the member's fills standing paid for the contract year
    are at least the number the plan treats as a long fill history and the out-of-pocket total
    standing on the enrollment is more than nothing, the deductible still to be met is instead the
    tier's annual deductible less that out-of-pocket total, and is never below nothing. Where the
    member's fills standing paid for the contract year are fewer than that number and the
    out-of-pocket total standing on the enrollment is more than nothing, the deductible still to be
    met is instead the tier's annual deductible less what the member has paid on fills with a fill
    date in the six months up to the handling date, and is never below nothing. The share the payment
    stage leaves the member is the cost share for the fill. Where a fill stands paid on the pharmacy
    record at the deductible stage and the price the cost share is taken from is more than the
    deductible still to be met, the fill is split at the boundary: the share the payment stage leaves
    the member is instead the deductible still to be met, together with the cost share for the fill
    in the proportion the price above the deductible bears to the whole price, that proportional part
    being rounded to two decimal places before it is added. Where a fill stands paid on the pharmacy
    record at the deductible stage and the price the cost share is taken from is at most the
    deductible still to be met, the share the payment stage leaves the member is instead the whole of
    that price. The member never pays more than the plan's negotiated price recorded for the fill the
    pharmacy is holding, however the multiplier falls; where that fill carries no such price, the
    price the cost share is taken from serves as the ceiling instead. Where the fill the pharmacy is
    holding carries no plan negotiated price, the cost share is taken from a price standing on
    another of the member's fills rather than from that fill. A fill rejected at the counter is never simply
    refused: the member is told the reason code and what the plan needs.
  prerequisite:
  - problem: pdp_ext_troop_restatement
    kind: value_input
    gate: troop_on_record
    form: state
    policy_source: >-
      What the member pays at the counter is not fixed before the out-of-pocket total standing on the drug plan enrollment agrees with what the pharmacy record shows the member has borne for the contract year.
    condition: >-
      The out-of-pocket total standing on the drug plan enrollment equals what the pharmacy record shows the member has borne for the contract year, once every fill standing paid, every fill backed out, what a supplemental benefit card met at a pharmacy and what counts from a fill dispensed by an out-of-network pharmacy have been taken into account.
    resolved_by: restate_out_of_pocket_total_a40a5cef
    effect: >-
      Once the out-of-pocket total on the enrollment is brought into agreement with the pharmacy record, the total the deductible is measured against changes, so the deductible still to be met changes and the share the payment stage leaves the member changes with it.
  - problem: pdp_ext_exception_approval_term
    kind: state_gate
    form: state
    gate: pdp_point_of_sale_cost_share.determination_on_record
    policy_source: >-
      What the member pays at the counter for a fill on a tier the plan enforces prior authorisation on is not fixed until an approved coverage determination for that product stands on the member's coverage determination record, good through a day not earlier than the fill date.
    condition: >-
      An approved coverage determination for the product on the fill stands on the member's coverage determination record, carrying a decision outcome of approved and an approved through date not earlier than the fill date.
    resolved_by: issue_exception_decision_dd13544d
    effect: >-
      Once the approved determination stands on the record, the base eligibility requiring an approved determination for a fill on a tier the plan enforces prior authorisation on is satisfied, and the fill may be priced at all.
  cross_category: []
  compute:
  - rejected_fill_price: "float(LATEST('pdp_pharmacy_claims','negotiated_price', date_field='fill_date', claim_status='rejected') or 0)"
  - rejected_fill_tier: "LATEST('pdp_pharmacy_claims','formulary_tier', date_field='fill_date', claim_status='rejected')"
  - tier_figure: "P('tier_3_preferred_brand_copay_30') if (rejected_fill_tier == 'tier_3_preferred_brand') else (P('tier_1_preferred_generic_copay_30') if (rejected_fill_tier == 'tier_1_preferred_generic') else P('tier_2_generic_copay_30'))"
  - rejected_fill_network: "LATEST('pdp_pharmacy_claims','pharmacy_network_status', date_field='fill_date', claim_status='rejected')"
  - standing_differential: "(P('standard_retail_tier_3_copay_30') - P('tier_3_preferred_brand_copay_30')) if (rejected_fill_network == 'standard_retail' and rejected_fill_tier == 'tier_3_preferred_brand') else ((P('standard_retail_tier_1_copay_30') - P('tier_1_preferred_generic_copay_30')) if (rejected_fill_network == 'standard_retail' and rejected_fill_tier == 'tier_1_preferred_generic') else 0)"
  - rejected_fill_days: "float(LATEST('pdp_pharmacy_claims','days_supply', date_field='fill_date', claim_status='rejected') or 0)"
  - supply_charge: "RND(tier_figure * P('mail_order_90_day_multiplier'), 2) if (rejected_fill_days > 30 and rejected_fill_network == 'mail_order') else (RND(tier_figure * P('retail_90_day_multiplier'), 2) if (rejected_fill_days > 30 and (rejected_fill_network == 'preferred_retail' or rejected_fill_network == 'standard_retail')) else tier_figure)"
  - fill_cost_share: "supply_charge + standing_differential"
  - paid_fill_count: "COUNT('pdp_pharmacy_claims', event_type='pdp_pharmacy_claim_adjudication', claim_status='paid')"
  - latest_paid_price: "float(LATEST('pdp_pharmacy_claims','negotiated_price', date_field='fill_date', event_type='pdp_pharmacy_claim_adjudication', claim_status='paid') or 0)"
  - largest_paid_price: "MAX('pdp_pharmacy_claims','negotiated_price', event_type='pdp_pharmacy_claim_adjudication', claim_status='paid')"
  - price_used: "rejected_fill_price if (rejected_fill_price > 0 and paid_fill_count >= K('settled_therapy_fill_count')) else (latest_paid_price if (rejected_fill_price <= 0 and paid_fill_count >= K('settled_therapy_fill_count')) else largest_paid_price)"
  - troop_on_record: "float(F('troop_accumulated'))"
  - member_paid_last_six: "SUM('pdp_pharmacy_claims','member_paid_amount', within_months=6, date_field='fill_date', event_type='pdp_pharmacy_claim_adjudication', claim_status='paid')"
  - deductible_left: "MX(0, P('annual_deductible') - troop_on_record) if (paid_fill_count >= K('long_history_fill_count') and troop_on_record > 0) else (MX(0, P('annual_deductible') - member_paid_last_six) if (paid_fill_count < K('long_history_fill_count') and troop_on_record > 0) else P('annual_deductible'))"
  - fills_at_deductible_stage: "COUNT('pdp_pharmacy_claims', event_type='pdp_pharmacy_claim_adjudication', claim_status='paid', coverage_stage_at_fill='deductible')"
  - member_share: "(deductible_left + RND(fill_cost_share * (price_used - deductible_left) / price_used, 2)) if (fills_at_deductible_stage >= 1 and price_used > deductible_left) else (price_used if (fills_at_deductible_stage >= 1 and price_used <= deductible_left) else fill_cost_share)"
  - price_ceiling: "rejected_fill_price if rejected_fill_price > 0 else price_used"
  - result: "RND(MN(member_share, price_ceiling), 2)"
  compute_basis:
