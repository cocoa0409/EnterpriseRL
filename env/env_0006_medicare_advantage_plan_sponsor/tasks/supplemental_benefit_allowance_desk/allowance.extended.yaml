  - id: allowance_ext_period_end_expiry
    base_policy_refs:
    - allowance_rollover_and_expiry
    - allowance_load_schedule
    overwrite:
    - base_policy: allowance_rollover_and_expiry
      superseded_clause: On a tier that permits rollover, the unspent allowance carries into the next period up
        to the tier's rollover cap, and whatever is above the cap is taken back off the card.
      replaced_by: What may carry forward is the share the card allows of the base it is measured on, and never
        more than what is unspent; the rest is taken back.
    trigger: state_due
    subject:
    - allowance_period_expiry
    computes: expiry_amount
    target_tool: post_period_expiry_1d3932f1
    params:
      quarter_months: 3
      month_months: 1
      year_months: 12
      last_period_index: 3
      min_periods_loaded: 2
      full_carry_percent: 100
      half_carry_percent: 50
      whole_share: 1.0
      half_share: 0.5
    rule: |-
      An allowance belongs to the benefit period it was loaded for, and what is left of it when it reaches the end of its life is dealt with on the card's own expiry basis. The amount taken back is what is unspent from that period's allowance less what may carry forward, never less than nothing, rounded to the nearest cent at the end and at no earlier step. What is unspent from that period's allowance is the allowance loaded for the period, together with the money put back into it, less what was spent from the card in it and less anything already taken back from it, never less than nothing. The benefit periods that have passed are counted as the whole quarters of the benefit year gone by where the card's allowance is loaded on calendar quarters, and as the whole months gone by where it is loaded on calendar months. The period whose allowance is being taken back is the period that ended one whole period before the current one, counting back from the periods that have passed and from how long an allowance stands. What may carry forward is the share the card allows of the base it is measured on, and never more than what is unspent; the rest is taken back. An allowance stands only to the last day of the benefit period it was loaded for. The allowance loaded for that period is taken as the quarterly allowance the card's tier carries. What was spent from the card in that period is taken as the total of every transaction posted in it. No money put back is counted into that period. Nothing carries forward, so the whole of what is unspent is taken back.
      An allowance stands to the last day of the benefit period after the one it was loaded for, where the card lets an unspent allowance carry into the next period, its allowance is loaded on calendar quarters of the benefit year and at least two loads have been made to it; it stands to the last day of the benefit year, where the card lets an unspent allowance carry into the next period, its allowance is loaded on calendar months of the benefit year and at least two loads have been made to it; and it stands only to the last day of the benefit period it was loaded for in every other case.
      The allowance loaded for that period is the total of the loads posted for it, where more than one load was posted for the period; it is that load, where exactly one was posted for it; and it is the quarterly allowance the card's tier carries in every other case.
      What was spent from the card in that period is counted from the transactions that settled alone, where the period carries a transaction the card network refused; from the transactions that settled together with those still only authorised, where the period carries no refused transaction but carries one still only authorised; and from every transaction posted in the period in every other case.
      The money counted back into that period is the total of the retailer's own refunds posted into it, where the period carries such a refund; the total of the credits put on the card for a purchase the member questioned, where the period carries no retailer's refund but carries such a credit; and nothing in every other case.
      The base the carried-forward share is measured on is the whole allowance loaded for the period, where an allowance was loaded for it and the member spent at least half of that allowance from the card in it; it is what is left unspent from that period, where an allowance was loaded for it and the member spent less than half of that allowance from the card in it; and nothing carries forward in every other case.
      The share that carries forward is the whole of the base it is measured on, where the card lets an unspent allowance carry forward in full and an allowance was loaded for that period; it is half of that base, where the card lets an unspent allowance carry forward up to half of a period's allowance and an allowance was loaded for that period; and it is nothing in every other case.
    prerequisite: []
    cross_category: []
    compute:
    - months_elapsed: MONTHS(F('benefit_year') + '-01-01', NOW)
    - period_months: K('quarter_months') if P('benefit_period_basis') == 'calendar quarters of the benefit year'
        else (K('year_months') if P('load_frequency') == 'annually' else K('month_months'))
    - current_index: int(months_elapsed / period_months) if P('benefit_period_basis') == 'calendar quarters of the
        benefit year' else months_elapsed
    - periods_loaded: COUNT('allowance_card_ledger', event_type='allowance_quarterly_load')
    - life_periods: 1 if (P('rollover_permitted') and P('benefit_period_basis') == 'calendar quarters of the benefit
        year' and periods_loaded >= K('min_periods_loaded')) else ((K('last_period_index') - current_index) if (P('rollover_permitted')
        and P('benefit_period_basis') == 'calendar months of the benefit year' and periods_loaded >= K('min_periods_loaded'))
        else 0)
    - dying_index: current_index - life_periods - 1
    - dying_label: ''''' if dying_index < 0 else ((F(''benefit_year'') + ''-Q1'') if dying_index == 0 else ((F(''benefit_year'')
        + ''-Q2'') if dying_index == 1 else ((F(''benefit_year'') + ''-Q3'') if dying_index == 2 else (F(''benefit_year'')
        + ''-Q4''))))'
    - period_load_count: COUNT('allowance_card_ledger', benefit_period=dying_label, event_type='allowance_quarterly_load')
        + COUNT('allowance_card_ledger', benefit_period=dying_label, event_type='allowance_bonus_load')
    - period_loads_posted: SUM('allowance_card_ledger','amount', benefit_period=dying_label, event_type='allowance_quarterly_load')
        + SUM('allowance_card_ledger','amount', benefit_period=dying_label, event_type='allowance_bonus_load')
    - period_loads: period_loads_posted if period_load_count > 1 else (period_loads_posted if period_load_count
        == 1 else P('quarterly_allowance_amount'))
    - period_settled: SUM('allowance_card_ledger','amount', benefit_period=dying_label, event_type='allowance_purchase',
