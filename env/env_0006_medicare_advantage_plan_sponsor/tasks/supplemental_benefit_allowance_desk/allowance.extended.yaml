- id: allowance_purchase_dispute_and_refund
  subject:
  - allowance_purchase_refund
  rule: 'A member who does not recognise a purchase on their card, or who returned what they bought, may have it looked into and the money put back. The member raises the dispute no later than the last day of the dispute window counted from the date the purchase posted to the card. Calendar days are counted from the day after the posting date, every day of the week counts, a dispute raised on the final day of the window is in time, and full 24-hour periods are never used in place of calendar days. No credit against that same purchase is already posted on this programme. Only the member may say that a purchase was not theirs, and their statement is what opens the enquiry; but the money goes back on the card on the plan''s finding, never on the statement alone. A provisional credit is put on the card inside the tier''s provisional credit days while the enquiry runs, so the member is not left without their allowance, and it is taken back if the purchase turns out to have been theirs. The plan settles a disputed purchase inside the tier''s resolution days and tells the member the outcome in writing whichever way it goes. A retailer''s own refund for a returned item is not a dispute: it posts on its own when the retailer sends it, inside the tier''s refund posting days, and it names the purchase it reverses. A refund always goes back to the card it was spent from and into the benefit period the purchase belonged to, so that a refund near a period end does not quietly become a fresh allowance.'
  eligibility:
  - id: dispute_window_open
    applies_to:
    - allowance_purchase_refund
    kind: time
    condition: The member raises the dispute no later than the last day of the dispute window counted from the date the purchase posted to the card.
    evidence_fields:
    - allowance_card_ledger.allowance_ledger_entry_id
    - allowance_card_ledger.source_ledger_entry_id
    - allowance_card_ledger.posted_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - allowance_card_ledger.source_ledger_entry_id
      action_bindings:
        allowance_card_ledger.source_ledger_entry_id: source_ledger_entry_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the date the purchase posted to the card
      anchor_source: allowance_card_ledger.posted_date
      relation: not_after
      duration_source: variants.purchase_dispute_window_days
      unit: calendar_days
      counting_rule: Calendar days are counted from the day after the posting date, every day of the week counts, a dispute raised on the final day of the window is in time, and full 24-hour periods are never used in place of calendar days.
      boundary: inclusive
  - id: credit_not_already_posted
    applies_to:
    - allowance_purchase_refund
    kind: dedup
    condition: No credit against that same purchase is already posted on this programme.
    evidence_fields:
    - allowance_card_ledger.allowance_ledger_entry_id
    - allowance_card_ledger.source_ledger_entry_id
    - allowance_card_ledger.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - allowance_card_ledger.source_ledger_entry_id
      action_bindings:
        allowance_card_ledger.source_ledger_entry_id: source_ledger_entry_id
    dedup_contract:
      table: allowance_card_ledger
      mode: separate_record
      object_bindings:
        source_ledger_entry_id: source_ledger_entry_id
      duplicate_filters:
        event_type:
        - allowance_purchase_refund
      distinct_fields:
      - posted_date
      - entry_reason
  params:
