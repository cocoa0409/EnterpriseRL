      A benefit period is taken to have three months, where the card's allowance is loaded on calendar quarters of the benefit year and the programme opened within the benefit year; it is taken to have twelve months, where the card's allowance is made available once a year and the programme opened within the benefit year; and it is taken to have one month in every other case.
