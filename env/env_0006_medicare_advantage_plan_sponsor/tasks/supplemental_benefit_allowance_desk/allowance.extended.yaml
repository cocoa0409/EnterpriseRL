- id: allowance_load_schedule
  subject:
  - allowance_quarterly_load
  - allowance_bonus_load
  rule: The tier's allowance is made available on the load day of each benefit period, on the tier's load frequency, and it is spendable from that day until it expires. The programme stands at active or dormant on the day the load is made available. A programme opened part way through a benefit period takes its first load on the tier's proration basis, and the member is told the figure before they shop rather than discovering it at the till. A member whose profile carries a qualifying chronic condition takes the tier's chronic condition bonus once in the benefit year, on top of the scheduled loads. A load made short or made twice is put right by a correcting load that names the load it corrects; a load is never quietly edited, because the member's statement must still add up. No load is made after the programme has closed, and a load already made for a period beginning after the programme end date is taken back rather than left spendable. Where the member changes health plan tier part way through the year, the new tier's load applies from the first day of the next benefit period and what is already loaded is left alone.
  eligibility:
  - id: programme_open_for_loading
    applies_to:
    - allowance_quarterly_load
    - allowance_bonus_load
    kind: state
    condition: The programme stands at active or dormant on the day the load is made available.
    evidence_fields:
    - allowance_programs.allowance_program_id
    - allowance_programs.status
    - allowance_programs.program_end_date
    evidence_contract:
      authority: system_record
