- id: allowance_card_activation_and_replacement
  subject:
  - allowance_card_activation
  - allowance_card_detail_update
  rule: On tiers that require it the card must be activated by the member before it will work, because only the member can confirm that the card reached them. The member activates the card no later than the last day of the activation window counted from the date the card was posted. Calendar days are counted from the day after the card was posted, every day of the week counts, a card activated on the final day of the window is activated in time, and full 24-hour periods are never used in place of calendar days. A card not activated inside that window is stopped for safety and a fresh card is posted at no charge; the allowance itself is never lost for want of activation. A lost, stolen or damaged card is replaced for the tier's replacement fee and reaches the member in the tier's replacement delivery days, and the balance moves to the new card untouched. The plan keeps only the last four digits of the card and can never read the full number back to a caller; a member who needs the full number is sent a fresh card rather than told the digits. A member may change how their statement is delivered at any time, and the change takes effect from the next statement rather than reissuing the last one.
  eligibility:
  - id: activation_window_open
    applies_to:
    - allowance_card_activation
    kind: time
    condition: The member activates the card no later than the last day of the activation window counted from the date the card was posted.
    evidence_fields:
    - allowance_programs.allowance_program_id
    - allowance_programs.card_issued_date
    - allowance_programs.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - allowance_programs.allowance_program_id
      action_bindings:
        allowance_programs.allowance_program_id: allowance_program_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the date the card was posted
      anchor_source: allowance_programs.card_issued_date
      relation: not_after
      duration_source: variants.card_activation_window_days
      unit: calendar_days
      counting_rule: Calendar days are counted from the day after the card was posted, every day of the week counts, a card activated on the final day of the window is activated in time, and full 24-hour periods are never used in place of calendar days.
      boundary: inclusive
  params:
    per_tier:
      Ridgecrest Healthy Options Card - Core:
        card_activation_required: =card_activation_required
        card_activation_window_days: =card_activation_window_days
        card_replacement_fee: =card_replacement_fee
        card_replacement_delivery_days: =card_replacement_delivery_days
        statement_frequency: =statement_frequency
        balance_inquiry_channels: =balance_inquiry_channels
      Ridgecrest Healthy Options Card - Select:
        card_activation_required: =card_activation_required
        card_activation_window_days: =card_activation_window_days
        card_replacement_fee: =card_replacement_fee
        card_replacement_delivery_days: =card_replacement_delivery_days
        statement_frequency: =statement_frequency
        balance_inquiry_channels: =balance_inquiry_channels
      Ridgecrest Healthy Options Card - Plus:
        card_activation_required: =card_activation_required
        card_activation_window_days: =card_activation_window_days
        card_replacement_fee: =card_replacement_fee
        card_replacement_delivery_days: =card_replacement_delivery_days
        statement_frequency: =statement_frequency
        balance_inquiry_channels: =balance_inquiry_channels
      Ridgecrest Healthy Options Card - Premier:
        card_activation_required: =card_activation_required
