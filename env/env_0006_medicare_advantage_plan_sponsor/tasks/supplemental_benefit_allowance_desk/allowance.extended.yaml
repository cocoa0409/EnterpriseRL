        medical plan covered, where that plan's cover began part way through it; they are the whole months of it
        the programme has been open, where the programme opened part way through it and that plan's cover began
        before it; and they are the whole of a benefit period in every other case.
      first_period_covered_months: The months of that first period the allowance is owed for are the whole months
        of it the medical plan covered, where that plan's cover began part way through it; they are the whole months
        of it the programme has been open, where the programme opened part way through it and that plan's cover
        began before it; and they are the whole of a benefit period in every other case.
      card_rate: The allowance a benefit period carries is the quarterly allowance the member's medical plan tier
        carries where that is larger than the card's own, and the card's own quarterly allowance otherwise.
      plan_rate: The allowance a benefit period carries is the quarterly allowance the member's medical plan tier
        carries where that is larger than the card's own, and the card's own quarterly allowance otherwise.
      period_rate: The allowance a benefit period carries is the quarterly allowance the member's medical plan tier
        carries where that is larger than the card's own, and the card's own quarterly allowance otherwise.
      card_in_use: The last benefit period that has fallen due is the current one, where the card stands in use
        and at least one whole month has passed since the programme opened; no benefit period has fallen due, where
        the card does not stand in use; and it is the period before the current one in every other case.
      months_open: The last benefit period that has fallen due is the current one, where the card stands in use
        and at least one whole month has passed since the programme opened; no benefit period has fallen due, where
        the card does not stand in use; and it is the period before the current one in every other case.
      last_period_index: The last benefit period that has fallen due is the current one, where the card stands in
        use and at least one whole month has passed since the programme opened; no benefit period has fallen due,
        where the card does not stand in use; and it is the period before the current one in every other case.
      owed_total: What the schedule owed is the share of the first benefit period the allowance is owed for, together
        with the whole allowance of each benefit period from that one up to the last that has fallen due.
      loads_posted: What has already been made available is the total of the loads posted on the card, where the
        card carries at least one load and nothing has been taken back from it; it is the loads posted less what
        has been taken back, where the card carries a load and an allowance taken back for want of spending; and
        it is nothing in every other case.
      loads_count: What has already been made available is the total of the loads posted on the card, where the
        card carries at least one load and nothing has been taken back from it; it is the loads posted less what
        has been taken back, where the card carries a load and an allowance taken back for want of spending; and
        it is nothing in every other case.
      taken_back: What has already been made available is the total of the loads posted on the card, where the card
        carries at least one load and nothing has been taken back from it; it is the loads posted less what has
        been taken back, where the card carries a load and an allowance taken back for want of spending; and it
        is nothing in every other case.
      loads_made: What has already been made available is the total of the loads posted on the card, where the card
        carries at least one load and nothing has been taken back from it; it is the loads posted less what has
        been taken back, where the card carries a load and an allowance taken back for want of spending; and it
        is nothing in every other case.
      plan_in_force: The ceiling on the benefit year is the card's own tier yearly allowance, where the card's tier
        sets a yearly allowance and the medical plan carrying the card is in force; it is that yearly allowance
        reduced to the share of the year the medical plan was charged for, where the card's tier sets a yearly allowance
        and the medical plan carrying the card is no longer in force; and it is the allowance a benefit period carries
        in every other case.
      plan_charged_months: The ceiling on the benefit year is the card's own tier yearly allowance, where the card's
        tier sets a yearly allowance and the medical plan carrying the card is in force; it is that yearly allowance
        reduced to the share of the year the medical plan was charged for, where the card's tier sets a yearly allowance
        and the medical plan carrying the card is no longer in force; and it is the allowance a benefit period carries
        in every other case.
      year_ceiling: The ceiling on the benefit year is the card's own tier yearly allowance, where the card's tier
        sets a yearly allowance and the medical plan carrying the card is in force; it is that yearly allowance
        reduced to the share of the year the medical plan was charged for, where the card's tier sets a yearly allowance
        and the medical plan carrying the card is no longer in force; and it is the allowance a benefit period carries
        in every other case.
      result: The allowance still owed is what the schedule owed for the benefit periods already gone, held at the
        ceiling on the benefit year, less what has already been made available, never less than nothing and rounded
        to the nearest cent at the end and at no earlier step.
    factors:
    - id: catch_up_periods_counted
      effect: method
      decides: current_index
      bindings:
      - year_start_months
      - ledger_entries
      - current_index
      ladder:
      - when: the card's allowance is loaded on calendar quarters of the benefit year and the card carries at least
          one entry
        method: the benefit periods that have passed are counted as the whole quarters of the benefit year gone
          by
      - when: the card's allowance is made available once a year
        method: the benefit year counts as a single period, of which none has passed
      - when: otherwise
        method: the benefit periods that have passed are counted as the whole months of the benefit year gone by
      baseline:
        current_index: year_start_months
      evidence:
      - date
      - history
      - tier_param
      cross_difficulty: null
    - id: catch_up_first_period
      effect: parameter
      decides: first_period_index
      bindings:
      - plan_start
      - plan_start_months
      - programme_start_months
      - first_period_index
      ladder:
      - when: the medical plan carrying the card began cover after the first day of the benefit year
        value: the benefit period that plan's cover began in
      - when: the medical plan carrying the card began cover on the first day of the benefit year
        value: the first benefit period of the benefit year
      - when: otherwise
        value: the benefit period the programme opened in
      baseline:
        first_period_index: int(programme_start_months / period_months)
      evidence:
      - cross_category
      - date
      cross_difficulty: advantage
    - id: catch_up_first_period_share
      effect: method
      decides: first_period_covered_months
      bindings:
      - plan_cover_start
      - first_period_covered_months
      ladder:
      - when: the medical plan's cover began part way through the first benefit period the allowance is owed for
        method: the months owed are the whole months of that period the medical plan covered
      - when: the programme opened part way through that period and the medical plan's cover began before it
        method: the months owed are the whole months of that period the programme has been open
      - when: otherwise
        method: the months owed are the whole of a benefit period
      baseline:
        first_period_covered_months: period_months
      evidence:
      - cross_category
      - date
      cross_difficulty: advantage
    - id: catch_up_last_period
      effect: method
      decides: last_period_index
      bindings:
      - card_in_use
      - months_open
      - last_period_index
      ladder:
      - when: the card stands in use and at least one whole month has passed since the programme opened
        method: the last benefit period that has fallen due is the current one
      - when: the card does not stand in use
        method: no benefit period has fallen due
      - when: otherwise
        method: the last benefit period that has fallen due is the period before the current one
      baseline:
        last_period_index: current_index - 1
      evidence:
      - date
      cross_difficulty: null
    - id: catch_up_already_available
      effect: parameter
      decides: loads_made
      bindings:
      - loads_posted
      - loads_count
      - taken_back
      - loads_made
      ladder:
      - when: the card carries at least one load and nothing has been taken back from it
        value: the total of the loads posted on the card
      - when: the card carries a load and an allowance taken back for want of spending
        value: the loads posted less what has been taken back
      - when: otherwise
        value: nothing
      baseline:
        loads_made: '0.0'
      evidence:
      - history
      cross_difficulty: null
    - id: catch_up_year_ceiling
      effect: parameter
      decides: year_ceiling
      bindings:
      - plan_in_force
      - plan_charged_months
      - year_ceiling
      ladder:
      - when: the card's tier sets a yearly allowance and the medical plan carrying the card is in force
        value: the card's own tier yearly allowance
      - when: the card's tier sets a yearly allowance and the medical plan carrying the card is no longer in force
        value: that yearly allowance reduced to the share of the year the medical plan was charged for
      - when: otherwise
        value: the allowance a benefit period carries
      baseline:
        year_ceiling: period_rate
      evidence:
      - cross_category
      - history
      cross_difficulty: advantage
    baseline:
      rule: The allowance still owed is what the schedule owed for the benefit periods already gone, held at the
        ceiling on the benefit year, less what has already been made available, never less than nothing and rounded
        to the nearest cent at the end and at no earlier step. What the schedule owed is the share of the first
        benefit period the allowance is owed for, together with the whole allowance of each benefit period from
        that one up to the last that has fallen due. The allowance a benefit period carries is the quarterly allowance
        the member's medical plan tier carries where that is larger than the card's own, and the card's own quarterly
        allowance otherwise. The allowance still owed is placed in the benefit period in which it is made available,
        because it makes good several benefit periods at once and belongs to none of them alone. The benefit periods
        that have passed are taken to be counted as the whole months of the benefit year gone by. The first benefit
        period the allowance is owed for is taken to be the benefit period the programme opened in. The months of
        that first period the allowance is owed for are taken as the whole of a benefit period. The last benefit
        period that has fallen due is taken to be the period before the current one. What has already been made
        available is taken as nothing. The ceiling on the benefit year is taken as the allowance a benefit period
        carries.
      params:
      - month_months
      - quarterly_allowance_amount
    inputs:
      history:
      - table: allowance_card_ledger
        aggregate: sum
        field: amount
        within_months: 12
        filters:
          event_type: allowance_quarterly_load
      - category: advantage
        table: advantage_premium_ledger
        aggregate: count
        field: amount
        within_months: 12
        filters:
          event_type: advantage_premium_charge
      cross_category:
      - advantage
