- id: allowance_health_plan_tier_interaction
  subject:
  - allowance_program_created
  - allowance_quarterly_load
  rule: 'The allowance programme a member may hold is decided by the health plan they hold: the tier of the medical plan fixes which card programme is opened and what the quarterly allowance is, and a member never chooses a richer card than their plan carries. No allowance programme named Ridgecrest Healthy Options Card - Dual Complete is open for this member when a Ridgecrest Healthy Options Card - Chronic Care Plus programme is opened, and none named Chronic Care Plus is open when a Dual Complete programme is opened. The Dual Complete card and the Chronic Care Plus card are alternatives rather than companions: both are built on the same grocery and pharmacy network, and a member who qualifies for both is told which one leaves them better off before either is opened. Where the member moves to a health plan tier that carries a different card, the programme is closed and a new one opened for the new tier, and the balance is forfeited on the tiers that forfeit on disenrollment. A member holding a stand-alone Part D drug plan and no medical plan holds no allowance card at all, because the allowance is a supplemental benefit of a medical plan and never of a drug plan. A member who holds an optional supplemental benefit rider may use the card toward what the rider did not pay, on the tiers that make dental, vision and hearing costs eligible, but never toward a cost the rider has already met.'
  eligibility:
  - id: card_programmes_mutually_exclusive
