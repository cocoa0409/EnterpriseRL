  - id: allowance_ext_standing_order_refund
    base_policy_refs:
    - allowance_catalog_ordering
    overwrite:
    - base_policy: allowance_catalog_ordering
      superseded_clause: The member asks for the order to be cancelled no later than the cancellation deadline counted
        from the time the order was placed.
      replaced_by: The member asks for the order to be stopped on the day it was placed, before it has been despatched.
    - base_policy: allowance_catalog_ordering
      superseded_clause: Hours are counted as full 24-hour periods from the moment the order was placed, a request
        made exactly on the deadline is in time, and calendar days are never used in place of hours.
      replaced_by: The day the order was placed is read from the order's own record, which carries that day and
        no time of day, so the deadline is settled in whole days and never in hours.
    trigger: on_request
    subject:
    - allowance_catalog_order_cancelled
    computes: refund_amount
    target_tool: cancel_catalog_order_88277d51
    params:
      same_day: 0
    rule: |-
      A catalogue order that is stopped before it goes out puts back on the card what it took off. The member asks for the order to be stopped on the day it was placed, before it has been despatched. The day the order was placed is read from the order's own record, which carries that day and no time of day, so the deadline is settled in whole days and never in hours. The money put back is what comes back for the order, and never more than the ceiling on what may go back; it is rounded to the nearest cent at the end and at no earlier step. The money returns to the benefit period the order was paid from rather than becoming a fresh allowance. The value of the items is taken as the smallest order the card's tier will process. The delivery charge the order carried is taken as nothing. What comes back is taken as the value of the items alone. The ceiling on what may go back is taken as the value of the items.
      The value of the items is the total the order's own record shows the items came to, where an order stands on the card and its record shows that total; it is what the catalogue took off the card less the delivery charge the order carried, where an order stands whose record does not show that total but the card shows a transaction made through the catalogue for it; and it is the smallest order the card's tier will process in every other case.
      The delivery charge the order carried is the expedited delivery charge the card's tier makes, where an order stands on the card that was sent by the expedited service and the card is one that offers catalogue ordering; it is the standard delivery charge the card's tier makes, where an order stands that was sent by the standard service and the card's tier makes a charge for standard delivery; and it is nothing in every other case.
      What comes back is the value of the items together with the delivery charge the order carried, where the member asks for the order to be stopped on the day it was placed and it has not been despatched; it is the value of the items alone, where the member asks after that day and it has not been despatched, the plan having already paid for the despatch; and nothing comes back until the goods are returned in every other case.
      The ceiling on what may go back is the largest single transaction the catalogue has taken from the card, where the catalogue has taken more than one transaction from it; it is that transaction, where the catalogue has taken exactly one; and it is the value of the items in every other case.
    prerequisite: []
    cross_category: []
    compute:
    - placed_orders: COUNT('allowance_catalog_orders', order_status='placed')
    - order_recorded_total: float(LATEST('allowance_catalog_orders','order_total', date_field='order_date', order_status='placed')
        or 0)
    - catalogue_txn_count: COUNT('allowance_card_ledger', event_type='allowance_purchase', purchase_channel='catalog_order',
        settlement_status='settled')
    - catalogue_txn_total: SUM('allowance_card_ledger','amount', event_type='allowance_purchase', purchase_channel='catalog_order',
        settlement_status='settled')
    - catalogue_txn_max: MAX('allowance_card_ledger','amount', event_type='allowance_purchase', purchase_channel='catalog_order',
        settlement_status='settled')
    - expedited_orders: COUNT('allowance_catalog_orders', order_status='placed', shipping_method='expedited')
    - standard_orders: COUNT('allowance_catalog_orders', order_status='placed', shipping_method='standard')
    - delivery_paid: P('expedited_shipping_fee') if (expedited_orders >= 1 and P('catalog_ordering_available'))
        else (P('catalog_shipping_fee') if (standard_orders >= 1 and P('catalog_shipping_fee') > 0) else 0.0)
    - items_back: order_recorded_total if order_recorded_total > 0 else (MX(0.0, catalogue_txn_total - delivery_paid)
        if catalogue_txn_count >= 1 else P('catalog_order_minimum'))
    - order_days: DAYS(LATEST('allowance_catalog_orders','order_date', date_field='order_date', order_status='placed')
        or NOW, NOW)
    - money_back: (items_back + delivery_paid) if (placed_orders >= 1 and order_days == K('same_day')) else (items_back
        if (placed_orders >= 1 and order_days > K('same_day')) else 0.0)
    - charge_ceiling: catalogue_txn_max if catalogue_txn_count > 1 else (catalogue_txn_total if catalogue_txn_count
        == 1 else items_back)
    - result: RND(MN(money_back, charge_ceiling), 2)
    compute_basis:
      placed_orders: What comes back is the value of the items together with the delivery charge the order carried,
        where the member asks for the order to be stopped on the day it was placed and it has not been despatched;
        it is the value of the items alone, where the member asks after that day and it has not been despatched,
        the plan having already paid for the despatch; and nothing comes back until the goods are returned in every
        other case.
      order_recorded_total: The value of the items is the total the order's own record shows the items came to,
        where an order stands on the card and its record shows that total; it is what the catalogue took off the
        card less the delivery charge the order carried, where an order stands whose record does not show that total
        but the card shows a transaction made through the catalogue for it; and it is the smallest order the card's
        tier will process in every other case.
      catalogue_txn_count: The ceiling on what may go back is the largest single transaction the catalogue has taken
        from the card, where the catalogue has taken more than one transaction from it; it is that transaction,
        where the catalogue has taken exactly one; and it is the value of the items in every other case.
      catalogue_txn_total: The ceiling on what may go back is the largest single transaction the catalogue has taken
        from the card, where the catalogue has taken more than one transaction from it; it is that transaction,
        where the catalogue has taken exactly one; and it is the value of the items in every other case.
      catalogue_txn_max: The ceiling on what may go back is the largest single transaction the catalogue has taken
        from the card, where the catalogue has taken more than one transaction from it; it is that transaction,
        where the catalogue has taken exactly one; and it is the value of the items in every other case.
      expedited_orders: The delivery charge the order carried is the expedited delivery charge the card's tier makes,
        where an order stands on the card that was sent by the expedited service and the card is one that offers
        catalogue ordering; it is the standard delivery charge the card's tier makes, where an order stands that
        was sent by the standard service and the card's tier makes a charge for standard delivery; and it is nothing
        in every other case.
      standard_orders: The delivery charge the order carried is the expedited delivery charge the card's tier makes,
        where an order stands on the card that was sent by the expedited service and the card is one that offers
        catalogue ordering; it is the standard delivery charge the card's tier makes, where an order stands that
        was sent by the standard service and the card's tier makes a charge for standard delivery; and it is nothing
        in every other case.
      delivery_paid: The delivery charge the order carried is the expedited delivery charge the card's tier makes,
        where an order stands on the card that was sent by the expedited service and the card is one that offers
        catalogue ordering; it is the standard delivery charge the card's tier makes, where an order stands that
        was sent by the standard service and the card's tier makes a charge for standard delivery; and it is nothing
        in every other case.
      items_back: The value of the items is the total the order's own record shows the items came to, where an order
        stands on the card and its record shows that total; it is what the catalogue took off the card less the
        delivery charge the order carried, where an order stands whose record does not show that total but the card
        shows a transaction made through the catalogue for it; and it is the smallest order the card's tier will
        process in every other case.
      order_days: The member asks for the order to be stopped on the day it was placed, before it has been despatched.
      money_back: What comes back is the value of the items together with the delivery charge the order carried,
        where the member asks for the order to be stopped on the day it was placed and it has not been despatched;
        it is the value of the items alone, where the member asks after that day and it has not been despatched,
        the plan having already paid for the despatch; and nothing comes back until the goods are returned in every
        other case.
      charge_ceiling: The ceiling on what may go back is the largest single transaction the catalogue has taken
        from the card, where the catalogue has taken more than one transaction from it; it is that transaction,
        where the catalogue has taken exactly one; and it is the value of the items in every other case.
      result: The money put back is what comes back for the order, and never more than the ceiling on what may go
        back; it is rounded to the nearest cent at the end and at no earlier step.
    factors:
    - id: order_items_read
      effect: method
      decides: items_back
      bindings:
      - order_recorded_total
      - items_back
      ladder:
      - when: an order stands on the card and its own record shows what the items came to
        method: the value of the items is read from the order's own record
      - when: an order stands whose record does not show what the items came to, but the card shows a transaction
          made through the catalogue for it
        method: the value of the items is read from what the catalogue took off the card, less the delivery charge
          the order carried
      - when: otherwise
        method: the value of the items is taken as the smallest order the card's tier will process
      baseline:
        items_back: P('catalog_order_minimum')
      evidence:
      - history
      cross_difficulty: null
    - id: order_delivery_charge
      effect: parameter
      decides: delivery_paid
      bindings:
      - expedited_orders
      - standard_orders
      - delivery_paid
      ladder:
      - when: an order stands on the card that was sent by the expedited service and the card is one that offers
          catalogue ordering
        value: the expedited delivery charge the card's tier makes
      - when: an order stands that was sent by the standard service and the card's tier makes a charge for standard
          delivery
        value: the standard delivery charge the card's tier makes
      - when: otherwise
        value: nothing
      baseline:
        delivery_paid: '0.0'
      evidence:
      - history
      - tier_param
      cross_difficulty: null
    - id: order_money_back
      effect: method
      decides: money_back
      bindings:
      - placed_orders
      - order_days
      - money_back
      ladder:
      - when: the member asks for the order to be stopped on the day it was placed and it has not been despatched
        method: the value of the items and the delivery charge the order carried both come back
      - when: the member asks after the day it was placed and it has not been despatched
        method: the value of the items alone comes back, the plan having already paid for the despatch
      - when: otherwise
        method: nothing comes back until the goods are returned
      baseline:
        money_back: items_back
      evidence:
      - history
      - date
      cross_difficulty: null
    - id: order_charge_ceiling
      effect: parameter
      decides: charge_ceiling
      bindings:
      - catalogue_txn_count
      - catalogue_txn_total
      - catalogue_txn_max
      - charge_ceiling
      ladder:
      - when: the catalogue has taken more than one transaction from the card
        value: the largest single transaction the catalogue has taken from the card
      - when: the catalogue has taken exactly one transaction from the card
        value: that transaction
      - when: otherwise
        value: the value of the items
      baseline:
        charge_ceiling: items_back
      evidence:
      - history
      cross_difficulty: null
    baseline:
      rule: The money put back is what comes back for the order, and never more than the ceiling on what may go
        back; it is rounded to the nearest cent at the end and at no earlier step. The money returns to the benefit
        period the order was paid from rather than becoming a fresh allowance. The value of the items is taken as
        the smallest order the card's tier will process. The delivery charge the order carried is taken as nothing.
        What comes back is taken as the value of the items alone. The ceiling on what may go back is taken as the
        value of the items.
      params:
      - catalog_order_minimum
    inputs:
      history:
      - table: allowance_catalog_orders
        aggregate: latest
        field: order_total
        within_months: 12
        filters:
          order_status: placed
      - table: allowance_card_ledger
        aggregate: sum
        field: amount
        within_months: 12
        filters:
          event_type: allowance_purchase
          purchase_channel: catalog_order
      cross_category: []
  - id: allowance_ext_closing_balance_forfeiture
    base_policy_refs:
    - allowance_closure_and_forfeiture
    overwrite:
    - base_policy: allowance_closure_and_forfeiture
      superseded_clause: On the tiers that forfeit on disenrollment, whatever is still on the card when the programme
        closes is taken off in one entry on the closing day and is not paid out in cash, refunded or moved to another
        card.
      replaced_by: The balance given up on the closing day is what is still standing on the card less what is kept
        back for card transactions made before that day which have not yet settled, never less than nothing and
        rounded to the nearest cent at the end and at no earlier step.
    trigger: on_request
    subject:
    - allowance_program_closure
    computes: forfeited_balance
    target_tool: close_allowance_programme_5a9eaadb
    params:
      minimum_giveup: 0.0
    rule: |-
      When an allowance programme is closed, what is still on the card is given up in one entry on the closing day, and the member is told the figure before they give it up rather than discovering it on a statement afterwards. The balance given up on the closing day is what is still standing on the card less what is kept back for card transactions made before that day which have not yet settled, never less than nothing and rounded to the nearest cent at the end and at no earlier step. What is still standing on the card is taken as the balance the card record shows. What has already been taken off the card is taken as nothing. The closing day is taken as the day the member's request to close the card was taken. Nothing is kept back for card transactions that have not yet settled.
      The balance given up on the closing day is not fixed until every card transaction at a dental, vision or hearing provider that the member's other cover has since paid its part of carries on the card the money put back for it.
      The balance given up on the closing day is worked out only after the allowance of the benefit period whose life has ended stands taken back on the card.
      The balance given up on the closing day is not worked out before the card shows no catalogue order left standing to be sent.
      What is still standing on the card is worked out entry by entry from the card's own record, being the loads and the money put back less the transactions that settled and less what has already been taken off, where the card carries a transaction the network refused or one authorised and not yet settled; it is the balance the card record shows together with the money put back for purchases the member questioned, where the card carries no such transaction but carries such money put back; and it is the balance the card record shows in every other case.
      What has already been taken off the card is the total of the allowances taken back for want of spending, where the card carries such an allowance taken back and no balance given up at a closure; it is those allowances together with any balance already given up at a closure, where the card carries a balance given up at a closure; and it is nothing in every other case.
      The closing day is the last day on which the allowance could be spent that the card record carries, where the card record carries such a day; it is the day the member gives their signature to the request, where the card record carries no such day and the member's request to close the card is waiting for that signature; and it is the day the member's request to close the card was taken in every other case.
      What is kept back for card transactions made before the closing day which have not yet settled is the whole of those transactions, where such a transaction stands on the card made no longer before the closing day than the days the card's tier allows a retailer to send a refund in; it is the largest single transaction the card's tier will authorise, or the whole of those transactions where they come to less, where such a transaction stands made longer before the closing day than that but still inside the days the card's tier gives the member to question a purchase; and it is nothing in every other case.
    prerequisite:
    - problem: allowance_ext_dvh_recovery_credit
      kind: value_input
      gate: ledger_credits
      form: state
      policy_source: The balance given up on the closing day is not fixed until every card transaction at a dental,
        vision or hearing provider that the member's other cover has since paid its part of carries on the card
        the money put back for it.
      condition: Every card transaction at a dental, vision or hearing provider that the member's other cover has
        since paid its part of carries a credit entry against it on the card's running record.
      resolved_by: post_dispute_credit_634307a6
      effect: The money put back on the card enters the money put back that is counted into the balance still standing,
        raising the balance given up on the closing day.
    - problem: allowance_ext_period_end_expiry
      kind: value_input
      gate: already_off
      form: state
      policy_source: The balance given up on the closing day is worked out only after the allowance of the benefit
        period whose life has ended stands taken back on the card.
      condition: The allowance of the benefit period whose life has ended carries an entry on the card's running
        record taking back what was left unspent from it.
      resolved_by: post_period_expiry_1d3932f1
      effect: What has already been taken off the card rises by the allowance taken back, lowering the balance given
        up on the closing day.
    - problem: allowance_ext_standing_order_refund
      kind: value_input
      gate: ledger_credits
      form: state
      policy_source: The balance given up on the closing day is not worked out before the card shows no catalogue
        order left standing to be sent.
      condition: No catalogue order stands against the card waiting to be sent.
      resolved_by: cancel_catalog_order_88277d51
      effect: The money the stopped order took off the card returns to it and enters the money put back that is
        counted into the balance still standing, raising the balance given up.
    cross_category: []
    compute:
    - ledger_loads: SUM('allowance_card_ledger','amount', event_type='allowance_quarterly_load') + SUM('allowance_card_ledger','amount',
        event_type='allowance_bonus_load')
    - ledger_credits: SUM('allowance_card_ledger','amount', event_type='allowance_purchase_refund')
    - ledger_spend: SUM('allowance_card_ledger','amount', event_type='allowance_purchase', settlement_status='settled')
    - expiries_taken: SUM('allowance_card_ledger','amount', event_type='allowance_period_expiry')
    - forfeits_taken: SUM('allowance_card_ledger','amount', event_type='allowance_balance_forfeiture')
    - already_off: expiries_taken if (expiries_taken > 0 and forfeits_taken == 0) else ((expiries_taken + forfeits_taken)
        if forfeits_taken > 0 else 0.0)
    - ledger_balance: ledger_loads + ledger_credits - ledger_spend - already_off
    - record_balance: float(F('current_balance') or 0)
    - credits_since: SUM('allowance_card_ledger','amount', event_type='allowance_purchase_refund', entry_reason='dispute_credit')
    - refused_count: COUNT('allowance_card_ledger', event_type='allowance_purchase', settlement_status='declined')
    - unsettled_count: COUNT('allowance_card_ledger', event_type='allowance_purchase', settlement_status='authorised')
    - standing_balance: ledger_balance if (refused_count >= 1 or unsettled_count >= 1) else ((record_balance + credits_since)
        if credits_since > 0 else record_balance)
    - closure_requests: COUNT('allowance_benefit_requests', request_action='programme_closure', intake_status='awaiting_member_signature')
    - request_day: LATEST('allowance_benefit_requests','created_at', date_field='created_at', request_action='programme_closure')
