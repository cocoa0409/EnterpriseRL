- type: allowance_catalog_order_cancelled
  target: allowance_catalog_orders
  meaning: A catalogue order is cancelled before it ships, at the member's request or because the plan cannot fill it.
  grain: One row per catalogue order cancelled.
  distinguish_by:
  - source_order_id
  - order_date
  - cancellation_reason
  fields:
    allowance_order_id: Reference number of this cancellation.
    allowance_program_id: The programme the cancelled order sat on.
    customer_id: The member whose order is cancelled.
    event_type: allowance_catalog_order_cancelled.
    order_date: Date the cancellation was recorded.
    order_total: Value of the items no longer being sent.
    order_status: cancelled.
    cancellation_reason: Why the order was cancelled.
    source_order_id: The single order this cancellation applies to.
  triggers:
  - event: allowance:allowance_purchase_refund
    when:
      cancellation_reason:
      - member_request
      - item_out_of_stock
      - address_undeliverable
    map:
      allowance_program_id: allowance_program_id
      customer_id: customer_id
      entry_reason: merchant_refund
measures:
- id: allowance_msr_period_to_date_spend
  window: The current benefit period on the tier's benefit period basis, from its first day through the handling date inclusive.
  measure: Sum of amount on allowance_purchase rows with settlement_status settled, less the amount returned by allowance_purchase_refund rows in the same benefit period.
- id: allowance_msr_days_since_last_purchase
  window: From the last_purchase_date on the programme through the handling date inclusive.
  measure: Count of calendar days since the most recent allowance_purchase row with settlement_status settled; where there has never been one, counted from the card activation date.
- id: allowance_msr_combined_year_loads
  window: The current benefit year, across every allowance programme the member holds.
  measure: Sum of amount on allowance_quarterly_load and allowance_bonus_load rows for the member, less the amount taken back by allowance_period_expiry and allowance_balance_forfeiture rows in the same benefit year.
policies:
- id: allowance_agg_multi_holding
  subject:
  - allowance_program_created
  rule: A member may hold at most the tier's maximum number of allowance programmes at one time, so that a member on a health plan with an everyday card and a separate chronic care card is served properly rather than refused. No other allowance programme of the same official name is already open for this member in the same benefit year. Two programmes of the same name in one benefit year are always a duplicate, however they were raised, and the second is not opened; the member is shown the one they already hold and its balance. Programmes in different benefit years are never duplicates, and a member's history ordinarily shows one closed programme for each year they have been with the plan. Where a member already holds the maximum, a new programme is opened only after one of the existing ones is closed, and the member is told what closing it would forfeit.
  eligibility:
  - id: no_duplicate_programme
    applies_to:
    - allowance_program_created
    kind: dedup
    condition: No other allowance programme of the same official name is already open for this member in the same benefit year.
    evidence_fields:
    - allowance_programs.customer_id
    - allowance_programs.variant_name
    - allowance_programs.benefit_year
    - allowance_programs.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - allowance_programs.customer_id
      action_bindings:
        allowance_programs.customer_id: customer_id
    dedup_contract:
      table: allowance_programs
      mode: separate_record
      object_bindings:
        customer_id: customer_id
        variant_name: variant_name
      duplicate_filters:
        status:
        - enrollment_recorded
        - card_issued
        - active
        - suspended
        - dormant
      distinct_fields:
      - benefit_year
      - program_start_date
  params:
    max_per_customer: 2
    per_tier:
      Ridgecrest Healthy Options Card - Core:
        maximum_programmes_per_member: =maximum_programmes_per_member
      Ridgecrest Healthy Options Card - Select:
        maximum_programmes_per_member: =maximum_programmes_per_member
      Ridgecrest Healthy Options Card - Plus:
        maximum_programmes_per_member: =maximum_programmes_per_member
      Ridgecrest Healthy Options Card - Premier:
        maximum_programmes_per_member: =maximum_programmes_per_member
      Ridgecrest Healthy Options Card - Dual Complete:
        maximum_programmes_per_member: =maximum_programmes_per_member
      Ridgecrest Healthy Options Card - Chronic Care Plus:
        maximum_programmes_per_member: =maximum_programmes_per_member
- id: allowance_agg_combined_annual_cap
  subject:
  - allowance_quarterly_load
  - allowance_bonus_load
  rule: 'Where a member holds more than one allowance programme, the loads are added together against one combined annual cap: the programmes are separate cards but a single entitlement. A load that would take the member''s combined loads for the benefit year past the combined annual allowance cap is made only up to the distance remaining, and the member is told which card was reduced and why. What counts toward the cap is what has been loaded less what has expired or been forfeited, so an allowance the member never had the chance to spend never uses up their entitlement. Where the member holds programmes of different tiers, the cap taken is the highest cap among the programmes held, never the sum of the caps. Spending is not pooled: money on one card cannot be spent at a retailer only the other card is good for, and the member is told which card to use rather than being left to find out at the till.'
  eligibility: []
  params:
    per_tier:
      Ridgecrest Healthy Options Card - Core:
        combined_annual_allowance_cap: =combined_annual_allowance_cap
        annual_allowance_amount: =annual_allowance_amount
      Ridgecrest Healthy Options Card - Select:
        combined_annual_allowance_cap: =combined_annual_allowance_cap
        annual_allowance_amount: =annual_allowance_amount
      Ridgecrest Healthy Options Card - Plus:
        combined_annual_allowance_cap: =combined_annual_allowance_cap
        annual_allowance_amount: =annual_allowance_amount
      Ridgecrest Healthy Options Card - Premier:
        combined_annual_allowance_cap: =combined_annual_allowance_cap
        annual_allowance_amount: =annual_allowance_amount
      Ridgecrest Healthy Options Card - Dual Complete:
        combined_annual_allowance_cap: =combined_annual_allowance_cap
        annual_allowance_amount: =annual_allowance_amount
      Ridgecrest Healthy Options Card - Chronic Care Plus:
        combined_annual_allowance_cap: =combined_annual_allowance_cap
        annual_allowance_amount: =annual_allowance_amount
  measures:
  - allowance_msr_combined_year_loads
- id: allowance_programme_opening
  subject:
  - allowance_program_created
  - allowance_card_issued
  rule: An allowance programme is opened only alongside a health plan enrollment whose tier carries an allowance, and it is opened as that plan is effectuated rather than when the application is taken. The health plan enrollment named on the programme is in force, standing at active or premium_grace_period on the day the programme is opened. Where the tier requires a chronic condition or a Medicaid standing, the member's profile carries the standing the entry gate names, and the plan has it from the state or from the member's care team rather than from the member alone. The programme runs for the benefit year of the health plan that carries it, starts on the health plan's coverage effective date, and can never start before it. The card is produced and posted as soon as the programme opens and reaches the member in the tier's first card delivery days; the member is told that date rather than being left to wonder. Where the member's tier carries no allowance no programme is opened, and the member is told plainly that their plan does not include a card rather than being enrolled in an empty one. A member whose chronic condition is later confirmed may have the chronic care programme opened part way through the year, and the first load is worked out on the tier's proration basis.
  eligibility:
  - id: linked_plan_in_force
    applies_to:
    - allowance_program_created
    kind: state
    condition: The health plan enrollment named on the programme is in force, standing at active or premium_grace_period on the day the programme is opened.
    evidence_fields:
    - advantage_enrollments.advantage_enrollment_id
    - advantage_enrollments.customer_id
    - advantage_enrollments.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - advantage_enrollments.advantage_enrollment_id
      action_bindings:
        advantage_enrollments.advantage_enrollment_id: linked_plan_reference
    state_contract:
      field: advantage_enrollments.status
      allowed:
      - active
      - premium_grace_period
  - id: entry_standing_on_profile
    applies_to:
    - allowance_program_created
    kind: caller_fact
    condition: Where the tier requires a chronic condition or a Medicaid standing, the member's profile carries the standing the entry gate names, and the plan has it from the state or from the member's care team rather than from the member alone.
    evidence_fields:
    - customers.customer_id
    - customers.medicaid_status
    - customers.low_income_subsidy_level
    evidence_contract:
      authority: mixed
      timing: pre_action
      correlation_keys:
      - - customers.customer_id
      action_bindings:
        customers.customer_id: customer_id
  params:
    per_tier:
      Ridgecrest Healthy Options Card - Core:
        chronic_condition_required: =chronic_condition_required
        dual_status_required: =dual_status_required
        first_card_delivery_days: =first_card_delivery_days
        card_issue_fee: =card_issue_fee
        enrollment_proration_basis: =enrollment_proration_basis
      Ridgecrest Healthy Options Card - Select:
        chronic_condition_required: =chronic_condition_required
        dual_status_required: =dual_status_required
        first_card_delivery_days: =first_card_delivery_days
        card_issue_fee: =card_issue_fee
        enrollment_proration_basis: =enrollment_proration_basis
      Ridgecrest Healthy Options Card - Plus:
        chronic_condition_required: =chronic_condition_required
        dual_status_required: =dual_status_required
        first_card_delivery_days: =first_card_delivery_days
        card_issue_fee: =card_issue_fee
        enrollment_proration_basis: =enrollment_proration_basis
      Ridgecrest Healthy Options Card - Premier:
        chronic_condition_required: =chronic_condition_required
