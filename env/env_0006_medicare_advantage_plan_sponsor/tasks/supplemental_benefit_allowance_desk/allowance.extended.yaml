    - plan_end_day: F('program_end_date') or ''
    - closing_day: plan_end_day if plan_end_day != '' else (NOW if closure_requests >= 1 else request_day)
    - unsettled_total: SUM('allowance_card_ledger','amount', event_type='allowance_purchase', settlement_status='authorised')
    - unsettled_last: LATEST('allowance_card_ledger','posted_date', date_field='posted_date', event_type='allowance_purchase',
        settlement_status='authorised') or NOW
    - unsettled_age: DAYS(unsettled_last, closing_day)
    - honoured_reserve: unsettled_total if (unsettled_age >= 0 and unsettled_age <= P('merchant_refund_posting_days'))
