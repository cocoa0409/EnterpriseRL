- id: allowance_rollover_and_expiry
  subject:
  - allowance_period_expiry
  rule: 'An allowance belongs to the benefit period it was loaded for, and what is not spent by the end of that period is dealt with on the tier''s expiry basis. The benefit period the load belonged to ended no later than the expiry day counted from the last day of that benefit period. Calendar days are counted from the day after the last day of the benefit period, every day of the week counts, an allowance spent on the final day still counts as spent, and full 24-hour periods are never used in place of calendar days. On a tier that permits rollover, the unspent allowance carries into the next period up to the tier''s rollover cap, and whatever is above the cap is taken back off the card. On a tier that permits no rollover the whole unspent allowance is taken back, and the member is told before the period ends how much they stand to lose and by when. Money is always spent oldest load first, so a member spending steadily never loses an allowance while a newer one sits on the card. Nothing carries past the last day of the benefit year on any tier: the card starts each year fresh, however generous the rollover inside the year. An expiry that was taken in error is put right by a correcting load naming the entry it corrects, never by editing the expiry.'
  eligibility:
  - id: benefit_period_ended
    applies_to:
    - allowance_period_expiry
    kind: time
    condition: The benefit period the load belonged to ended no later than the expiry day counted from the last day of that benefit period.
    evidence_fields:
    - allowance_card_ledger.allowance_ledger_entry_id
    - allowance_card_ledger.posted_date
    - allowance_card_ledger.benefit_period
    - allowance_programs.allowance_program_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - allowance_programs.allowance_program_id
        - allowance_card_ledger.allowance_ledger_entry_id
      action_bindings:
        allowance_programs.allowance_program_id: allowance_program_id
        allowance_card_ledger.allowance_ledger_entry_id: source_ledger_entry_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the last day of that benefit period
      anchor_source: allowance_card_ledger.posted_date
      relation: not_before
      duration_source: params.expiry_grace_days
      unit: calendar_days
      counting_rule: Calendar days are counted from the day after the last day of the benefit period, every day of the week counts, an allowance spent on the final day still counts as spent, and full 24-hour periods are never used in place of calendar days.
      boundary: inclusive
  params:
    expiry_grace_days: 5
    per_tier:
      Ridgecrest Healthy Options Card - Core:
        rollover_permitted: =rollover_permitted
        rollover_cap_percent: =rollover_cap_percent
        unused_balance_expiry_basis: =unused_balance_expiry_basis
        benefit_period_basis: =benefit_period_basis
      Ridgecrest Healthy Options Card - Select:
        rollover_permitted: =rollover_permitted
        rollover_cap_percent: =rollover_cap_percent
        unused_balance_expiry_basis: =unused_balance_expiry_basis
        benefit_period_basis: =benefit_period_basis
      Ridgecrest Healthy Options Card - Plus:
        rollover_permitted: =rollover_permitted
        rollover_cap_percent: =rollover_cap_percent
        unused_balance_expiry_basis: =unused_balance_expiry_basis
        benefit_period_basis: =benefit_period_basis
      Ridgecrest Healthy Options Card - Premier:
        rollover_permitted: =rollover_permitted
        rollover_cap_percent: =rollover_cap_percent
        unused_balance_expiry_basis: =unused_balance_expiry_basis
        benefit_period_basis: =benefit_period_basis
      Ridgecrest Healthy Options Card - Dual Complete:
