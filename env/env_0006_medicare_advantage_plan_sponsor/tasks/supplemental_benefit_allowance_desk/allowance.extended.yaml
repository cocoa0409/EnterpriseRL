# ============================================================================
# extended_policies
# ============================================================================
extended_policies:
  - id: allowance_ext_dvh_recovery_credit
    base_policy_refs:
    - allowance_purchase_dispute_and_refund
    - allowance_health_plan_tier_interaction
    overwrite: []
    trigger: state_due
    subject:
    - allowance_purchase_refund
    computes: credit_amount
    target_tool: post_dispute_credit_634307a6
    params:
      lookback_long_months: 4
      lookback_standard_months: 3
      year_to_date_months: 12
      wide_dispute_window_days: 90
      standard_dispute_window_days: 75
    rule: |-
      The card may be used toward a dental, vision or hearing cost the member's other cover did not pay, and never toward a cost that cover has already met, so where another payer has since met a cost the card has already paid, the money is put back on the card rather than leaving the member out of pocket twice. The money put back is what the card has been charged at dental, vision and hearing providers in the stretch of the card's own record that is looked at, worked out on the basis the card's tier gives, and never more than what the card was charged at those providers; it is rounded to the nearest cent at the end and at no earlier step. The stretch looked at is the whole of the benefit year to date. What the card has been charged at those providers is the total of every transaction posted at them in that stretch, whatever became of it. What another payer has met is taken as nothing. What the member was left to bear is taken as nothing. The money going back is taken as the whole of what the card was charged at those providers. It is placed in the benefit period the transaction it relates to belonged to, so that money coming back near the end of a period does not quietly become a fresh allowance.
      The stretch of the card's record that is looked at runs back four whole months where the card is one that gives the member ninety days or more to question a purchase and the card has been used at a dental, vision or hearing provider; it runs back three whole months where the card is one that gives the member seventy-five days or more to question a purchase and the card has been used at such a provider; and in every other case it is the whole of the benefit year to date.
      What the card has been charged at those providers is counted from the transactions that settled alone where the card carries a transaction at such a provider the network refused in that stretch; from the transactions that settled together with those still only authorised where the card carries no refused transaction but carries one still only authorised at such a provider in that stretch; and from every transaction posted at those providers in that stretch in every other case.
      What another payer has met is what a dental, vision and hearing rider paid on the claims it settled in that stretch, where the member holds such a rider that is in force and its own record shows it paid on a claim settled in that stretch; it is the yearly dental allowance the member's medical plan tier carries, where the member holds no such rider in force and that medical plan tier carries such an allowance; and it is nothing in every other case.
      What the member was left to bear is the amount those claims were recognised at less what that rider paid, never less than nothing, where the member holds such a rider that is in force and its own record shows it paid on a claim settled in that stretch; it is the whole amount those claims were recognised at, where the member holds such a rider that is in force and claims were recognised in that stretch but it paid nothing on them; and it is nothing in every other case.
      The money going back is what the card was charged at those providers less what the member was left to bear, where the card is one on which dental, vision and hearing costs may be met and the card has been used at such a provider; it is nothing at all, where the card is one on which such costs may be met and the card has not been used at such a provider in the stretch looked at; and it is the whole of what the card was charged at those providers in every other case, the cost never having been one the card could meet.
    prerequisite: []
    cross_category:
    - category: osb
      as: history
      reads:
      - status
      - osb_benefit_claims.rider_paid_amount
      - osb_benefit_claims.allowed_amount
      - osb_benefit_claims.claim_status
      - osb_benefit_claims.processed_date
      note: The rider's own settled claims decide the tier of what another payer has met and of what the member
        was left to bear.
    - category: advantage
      as: branch
      reads:
      - dental_allowance_annual
      - status
      note: Where no rider is in force, the medical plan tier's yearly dental allowance is the tier the other-payer
        ladder selects.
    compute:
    - dvh_visits: COUNT('allowance_card_ledger', event_type='allowance_purchase', merchant_category='dental_vision_hearing')
    - lookback_months: K('lookback_long_months') if (P('purchase_dispute_window_days') >= K('wide_dispute_window_days')
        and dvh_visits >= 1) else (K('lookback_standard_months') if (P('purchase_dispute_window_days') >= K('standard_dispute_window_days')
        and dvh_visits >= 1) else K('year_to_date_months'))
    - dvh_refused: COUNT('allowance_card_ledger', within_months=lookback_months, date_field='posted_date', event_type='allowance_purchase',
        merchant_category='dental_vision_hearing', settlement_status='declined')
    - dvh_authorised: COUNT('allowance_card_ledger', within_months=lookback_months, date_field='posted_date', event_type='allowance_purchase',
        merchant_category='dental_vision_hearing', settlement_status='authorised')
    - dvh_authorised_amount: SUM('allowance_card_ledger','amount', within_months=lookback_months, date_field='posted_date',
        event_type='allowance_purchase', merchant_category='dental_vision_hearing', settlement_status='authorised')
    - dvh_settled: SUM('allowance_card_ledger','amount', within_months=lookback_months, date_field='posted_date',
        event_type='allowance_purchase', merchant_category='dental_vision_hearing', settlement_status='settled')
    - dvh_posted: SUM('allowance_card_ledger','amount', within_months=lookback_months, date_field='posted_date',
        event_type='allowance_purchase', merchant_category='dental_vision_hearing')
    - card_dvh_charge: dvh_settled if dvh_refused >= 1 else ((dvh_settled + dvh_authorised_amount) if dvh_authorised
        >= 1 else dvh_posted)
    - rider_in_force: EXISTS('osb', status='active')
    - rider_paid: XSUM('osb','osb_benefit_claims','rider_paid_amount', within_months=lookback_months, date_field='processed_date',
        claim_status='paid')
    - plan_dvh_allowance: CPARAM('advantage','dental_allowance_annual', status='active') or 0.0
    - other_payer_met: rider_paid if (rider_in_force and rider_paid > 0) else (plan_dvh_allowance if (not rider_in_force
        and plan_dvh_allowance > 0) else 0.0)
    - allowed_total: XSUM('osb','osb_benefit_claims','allowed_amount', within_months=lookback_months, date_field='processed_date',
        claim_status='paid')
    - member_left: MX(0.0, allowed_total - other_payer_met) if (rider_in_force and rider_paid > 0) else (allowed_total
        if (rider_in_force and allowed_total > 0) else 0.0)
    - dvh_settled_visits: COUNT('allowance_card_ledger', within_months=lookback_months, date_field='posted_date',
        event_type='allowance_purchase', merchant_category='dental_vision_hearing', settlement_status='settled')
    - credit_before_cap: MX(0.0, card_dvh_charge - member_left) if (P('dental_vision_hearing_eligible') and dvh_settled_visits
        >= 1) else (0.0 if (P('dental_vision_hearing_eligible') and dvh_settled_visits == 0) else card_dvh_charge)
    - result: RND(MX(0.0, MN(credit_before_cap, card_dvh_charge)), 2)
    compute_basis:
      dvh_visits: The stretch of the card's record that is looked at runs back four whole months where the card
        is one that gives the member ninety days or more to question a purchase and the card has been used at a
        dental, vision or hearing provider; it runs back three whole months where the card is one that gives the
        member seventy-five days or more to question a purchase and the card has been used at such a provider; and
        in every other case it is the whole of the benefit year to date.
      lookback_months: The stretch of the card's record that is looked at runs back four whole months where the
        card is one that gives the member ninety days or more to question a purchase and the card has been used
        at a dental, vision or hearing provider; it runs back three whole months where the card is one that gives
        the member seventy-five days or more to question a purchase and the card has been used at such a provider;
        and in every other case it is the whole of the benefit year to date.
      dvh_refused: What the card has been charged at those providers is counted from the transactions that settled
        alone where the card carries a transaction at such a provider the network refused in that stretch; from
        the transactions that settled together with those still only authorised where the card carries no refused
        transaction but carries one still only authorised at such a provider in that stretch; and from every transaction
        posted at those providers in that stretch in every other case.
      dvh_authorised: What the card has been charged at those providers is counted from the transactions that settled
        alone where the card carries a transaction at such a provider the network refused in that stretch; from
        the transactions that settled together with those still only authorised where the card carries no refused
        transaction but carries one still only authorised at such a provider in that stretch; and from every transaction
        posted at those providers in that stretch in every other case.
      dvh_authorised_amount: What the card has been charged at those providers is counted from the transactions
        that settled alone where the card carries a transaction at such a provider the network refused in that stretch;
        from the transactions that settled together with those still only authorised where the card carries no refused
        transaction but carries one still only authorised at such a provider in that stretch; and from every transaction
        posted at those providers in that stretch in every other case.
      dvh_settled: What the card has been charged at those providers is counted from the transactions that settled
        alone where the card carries a transaction at such a provider the network refused in that stretch; from
        the transactions that settled together with those still only authorised where the card carries no refused
        transaction but carries one still only authorised at such a provider in that stretch; and from every transaction
        posted at those providers in that stretch in every other case.
      dvh_posted: What the card has been charged at those providers is the total of every transaction posted at
        them in that stretch, whatever became of it.
      card_dvh_charge: What the card has been charged at those providers is counted from the transactions that settled
        alone where the card carries a transaction at such a provider the network refused in that stretch; from
        the transactions that settled together with those still only authorised where the card carries no refused
        transaction but carries one still only authorised at such a provider in that stretch; and from every transaction
        posted at those providers in that stretch in every other case.
      rider_in_force: What another payer has met is what a dental, vision and hearing rider paid on the claims it
        settled in that stretch, where the member holds such a rider that is in force and its own record shows it
        paid on a claim settled in that stretch; it is the yearly dental allowance the member's medical plan tier
        carries, where the member holds no such rider in force and that medical plan tier carries such an allowance;
        and it is nothing in every other case.
      rider_paid: What another payer has met is what a dental, vision and hearing rider paid on the claims it settled
        in that stretch, where the member holds such a rider that is in force and its own record shows it paid on
        a claim settled in that stretch; it is the yearly dental allowance the member's medical plan tier carries,
        where the member holds no such rider in force and that medical plan tier carries such an allowance; and
        it is nothing in every other case.
      plan_dvh_allowance: What another payer has met is what a dental, vision and hearing rider paid on the claims
        it settled in that stretch, where the member holds such a rider that is in force and its own record shows
        it paid on a claim settled in that stretch; it is the yearly dental allowance the member's medical plan
        tier carries, where the member holds no such rider in force and that medical plan tier carries such an allowance;
        and it is nothing in every other case.
      other_payer_met: What another payer has met is what a dental, vision and hearing rider paid on the claims
        it settled in that stretch, where the member holds such a rider that is in force and its own record shows
        it paid on a claim settled in that stretch; it is the yearly dental allowance the member's medical plan
        tier carries, where the member holds no such rider in force and that medical plan tier carries such an allowance;
        and it is nothing in every other case.
      allowed_total: What the member was left to bear is the amount those claims were recognised at less what that
        rider paid, never less than nothing, where the member holds such a rider that is in force and its own record
        shows it paid on a claim settled in that stretch; it is the whole amount those claims were recognised at,
        where the member holds such a rider that is in force and claims were recognised in that stretch but it paid
        nothing on them; and it is nothing in every other case.
      member_left: What the member was left to bear is the amount those claims were recognised at less what that
        rider paid, never less than nothing, where the member holds such a rider that is in force and its own record
        shows it paid on a claim settled in that stretch; it is the whole amount those claims were recognised at,
        where the member holds such a rider that is in force and claims were recognised in that stretch but it paid
        nothing on them; and it is nothing in every other case.
      dvh_settled_visits: The money going back is what the card was charged at those providers less what the member
        was left to bear, where the card is one on which dental, vision and hearing costs may be met and the card
        has been used at such a provider; it is nothing at all, where the card is one on which such costs may be
        met and the card has not been used at such a provider in the stretch looked at; and it is the whole of what
        the card was charged at those providers in every other case, the cost never having been one the card could
        meet.
      credit_before_cap: The money going back is what the card was charged at those providers less what the member
        was left to bear, where the card is one on which dental, vision and hearing costs may be met and the card
        has been used at such a provider; it is nothing at all, where the card is one on which such costs may be
        met and the card has not been used at such a provider in the stretch looked at; and it is the whole of what
        the card was charged at those providers in every other case, the cost never having been one the card could
        meet.
      result: The money put back is what the card has been charged at dental, vision and hearing providers in the
        stretch of the card's own record that is looked at, worked out on the basis the card's tier gives, and never
        more than what the card was charged at those providers; it is rounded to the nearest cent at the end and
        at no earlier step.
    factors:
    - id: recovery_lookback
      effect: method
      decides: lookback_months
      bindings:
      - dvh_visits
      - lookback_months
      ladder:
      - when: the card gives the member ninety days or more to question a purchase and the card has been used at
          a dental, vision or hearing provider
        method: the stretch of the card's record looked at runs back four whole months from the day the money going
          back is worked out
      - when: the card gives the member seventy-five days or more to question a purchase and the card has been used
          at a dental, vision or hearing provider
        method: the stretch of the card's record looked at runs back three whole months from the day the money going
          back is worked out
      - when: otherwise
        method: the stretch of the card's record looked at is the whole of the benefit year to date
      baseline:
        lookback_months: K('year_to_date_months')
      evidence:
      - history
      - tier_param
      cross_difficulty: null
    - id: recovery_charge_counted
      effect: method
      decides: card_dvh_charge
      bindings:
      - dvh_refused
      - dvh_authorised
      - dvh_authorised_amount
      - dvh_settled
      - dvh_posted
      - card_dvh_charge
      ladder:
      - when: the card carries a transaction at a dental, vision or hearing provider that the network refused in
          the stretch looked at
        method: what the card was charged at those providers is counted from the transactions that settled alone
      - when: the card carries no refused transaction at such a provider but carries one still only authorised in
          the stretch looked at
        method: what the card was charged at those providers is counted from the transactions that settled together
          with those still only authorised
      - when: otherwise
        method: what the card was charged at those providers is counted from every transaction posted at them in
          the stretch looked at
      baseline:
        card_dvh_charge: dvh_posted
      evidence:
      - history
      cross_difficulty: null
    - id: recovery_other_payer
      effect: parameter
      decides: other_payer_met
      bindings:
      - rider_in_force
      - rider_paid
      - plan_dvh_allowance
      - other_payer_met
      ladder:
      - when: the member holds a dental, vision and hearing rider that is in force and its own record shows it paid
          on a claim settled in the stretch looked at
        value: what that rider paid on the claims it settled in the stretch looked at
      - when: the member holds no such rider in force and the member's medical plan tier carries a yearly dental
          allowance
        value: the yearly dental allowance that medical plan tier carries
      - when: otherwise
        value: nothing
      baseline:
        other_payer_met: '0.0'
      evidence:
      - cross_category
      - history
      cross_difficulty: osb
    - id: recovery_member_share
      effect: parameter
      decides: member_left
      bindings:
      - allowed_total
      - member_left
      ladder:
      - when: the member holds a dental, vision and hearing rider that is in force and its own record shows it paid
          on a claim settled in the stretch looked at
        value: the amount those claims were recognised at less what that rider paid, never less than nothing
      - when: the member holds such a rider that is in force and claims were recognised in the stretch looked at
          but it paid nothing on them
        value: the whole amount those claims were recognised at
      - when: otherwise
        value: nothing
      baseline:
        member_left: '0.0'
      evidence:
      - cross_category
      - history
      cross_difficulty: osb
    - id: recovery_credit_basis
      effect: method
      decides: credit_before_cap
      bindings:
      - dvh_settled_visits
      - credit_before_cap
      ladder:
      - when: the card is one on which dental, vision and hearing costs may be met and the card has been used at
          such a provider
        method: the money going back is what the card was charged at those providers less what the member was left
          to bear
      - when: the card is one on which such costs may be met and the card has not been used at such a provider in
          the stretch looked at
        method: no money goes back
      - when: otherwise
        method: the money going back is the whole of what the card was charged at those providers
      baseline:
        credit_before_cap: card_dvh_charge
      evidence:
      - history
      - tier_param
      cross_difficulty: null
    baseline:
      rule: The money put back is what the card has been charged at dental, vision and hearing providers in the
        stretch of the card's own record that is looked at, worked out on the basis the card's tier gives, and never
        more than what the card was charged at those providers; it is rounded to the nearest cent at the end and
        at no earlier step. The stretch looked at is the whole of the benefit year to date. What the card has been
        charged at those providers is the total of every transaction posted at them in that stretch, whatever became
        of it. What another payer has met is taken as nothing. What the member was left to bear is taken as nothing.
        The money going back is taken as the whole of what the card was charged at those providers. It is placed
        in the benefit period the transaction it relates to belonged to, so that money coming back near the end
        of a period does not quietly become a fresh allowance.
