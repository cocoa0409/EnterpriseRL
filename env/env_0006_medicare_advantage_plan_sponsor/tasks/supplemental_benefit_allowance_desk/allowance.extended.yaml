          quarters of the benefit year, and at least two loads have been made to it
        method: an allowance stands to the last day of the benefit period after the one it was loaded for
      - when: the card lets an unspent allowance carry into the next period, its allowance is loaded on calendar
          months of the benefit year, and at least two loads have been made to it
