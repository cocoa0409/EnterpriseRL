  - id: allowance_ext_schedule_catch_up_load
    base_policy_refs:
    - allowance_load_schedule
    - allowance_agg_combined_annual_cap
    - allowance_programme_opening
    overwrite:
    - base_policy: allowance_load_schedule
      superseded_clause: The tier's allowance is made available on the load day of each benefit period, on the tier's
        load frequency, and it is spendable from that day until it expires.
      replaced_by: The allowance still owed is what the schedule owed for the benefit periods already gone, held
        at the ceiling on the benefit year, less what has already been made available, never less than nothing and
        rounded to the nearest cent at the end and at no earlier step.
    - base_policy: allowance_programme_opening
      superseded_clause: The programme runs for the benefit year of the health plan that carries it, starts on the
        health plan's coverage effective date, and can never start before it.
      replaced_by: Where a programme is opened later than the day the health plan carrying it began cover, it still
        runs for that plan's benefit year and the allowance is owed from the benefit period that plan's cover began
        in, not from the day the programme was opened.
    trigger: state_due
    subject:
    - allowance_bonus_load
    computes: catch_up_amount
    target_tool: post_catch_up_load_838eeda2
    params:
      quarter_months: 3
      month_months: 1
      year_months: 12
    rule: |-
      An allowance the schedule owed for a benefit period that has already gone by is not lost because the card was not in use when its load day passed; it is made available as one extra load that names the load it puts right, and the member is told the figure rather than finding it on a statement. The allowance owed for the benefit periods already gone is not made available before the card stands in use on the programme record. Where a programme is opened later than the day the health plan carrying it began cover, it still runs for that plan's benefit year and the allowance is owed from the benefit period that plan's cover began in, not from the day the programme was opened. The allowance still owed is what the schedule owed for the benefit periods already gone, held at the ceiling on the benefit year, less what has already been made available, never less than nothing and rounded to the nearest cent at the end and at no earlier step. What the schedule owed is the share of the first benefit period the allowance is owed for, together with the whole allowance of each benefit period from that one up to the last that has fallen due. The allowance a benefit period carries is the quarterly allowance the member's medical plan tier carries where that is larger than the card's own, and the card's own quarterly allowance otherwise. The allowance still owed is placed in the benefit period in which it is made available, because it makes good several benefit periods at once and belongs to none of them alone. The benefit periods that have passed are taken to be counted as the whole months of the benefit year gone by. The first benefit period the allowance is owed for is taken to be the benefit period the programme opened in. The months of that first period the allowance is owed for are taken as the whole of a benefit period. The last benefit period that has fallen due is taken to be the period before the current one. What has already been made available is taken as nothing. The ceiling on the benefit year is taken as the allowance a benefit period carries.
      The benefit periods that have passed are counted as the whole quarters of the benefit year gone by, where the card's allowance is loaded on calendar quarters of the benefit year and the card carries at least one entry; as a single period of which none has passed, where the card's allowance is made available once a year; and as the whole months of the benefit year gone by in every other case.
      The first benefit period the allowance is owed for is the benefit period the medical plan carrying the card began cover in, where that plan's cover began after the first day of the benefit year; it is the first benefit period of the benefit year, where that plan's cover began on the first day of the benefit year; and it is the benefit period the programme opened in in every other case.
      The months of that first period the allowance is owed for are the whole months of it the medical plan covered, where that plan's cover began part way through it; they are the whole months of it the programme has been open, where the programme opened part way through it and that plan's cover began before it; and they are the whole of a benefit period in every other case.
      The last benefit period that has fallen due is the current one, where the card stands in use and at least one whole month has passed since the programme opened; no benefit period has fallen due, where the card does not stand in use; and it is the period before the current one in every other case.
      What has already been made available is the total of the loads posted on the card, where the card carries at least one load and nothing has been taken back from it; it is the loads posted less what has been taken back, where the card carries a load and an allowance taken back for want of spending; and it is nothing in every other case.
      The ceiling on the benefit year is the card's own tier yearly allowance, where the card's tier sets a yearly allowance and the medical plan carrying the card is in force; it is that yearly allowance reduced to the share of the year the medical plan was charged for, where the card's tier sets a yearly allowance and the medical plan carrying the card is no longer in force; and it is the allowance a benefit period carries in every other case.
    prerequisite:
    - problem: allowance_ext_card_in_use_first_load
      kind: value_input
      gate: loads_made
      form: state
      policy_source: The allowance owed for the benefit periods already gone is not made available before the card
        stands in use on the programme record.
      condition: The programme record shows the card in use, carrying the day the member brought it into use.
      resolved_by: activate_allowance_card_a5740baf
      effect: What has already been made available rises from nothing to the allowance made available when the card
        came into use, and the last benefit period that has fallen due becomes the current one, so that the allowance
        still owed rises from nothing to what the schedule owed less that first load.
    cross_category:
    - category: advantage
      as: history
      reads:
      - status
      - otc_allowance_quarterly
      - coverage_effective_date
      - advantage_premium_ledger.event_type
      - advantage_premium_ledger.posted_date
      note: The medical plan's cover start decides which benefit period the allowance is first owed for, its tier
        decides the allowance a period carries, and the coverage months it has been charged for decide the ceiling
        tier where that plan is no longer in force.
    compute:
    - year_start_months: MONTHS(F('benefit_year') + '-01-01', NOW)
    - period_months: K('quarter_months') if P('benefit_period_basis') == 'calendar quarters of the benefit year'
        else (K('year_months') if P('load_frequency') == 'annually' else K('month_months'))
    - ledger_entries: COUNT('allowance_card_ledger')
    - current_index: int(year_start_months / period_months) if (P('benefit_period_basis') == 'calendar quarters
        of the benefit year' and ledger_entries >= 1) else (0 if P('load_frequency') == 'annually' else year_start_months)
    - plan_start: CFIELD('advantage','coverage_effective_date', status='active') or ''
    - plan_start_months: MONTHS(F('benefit_year') + '-01-01', plan_start) if plan_start != '' else 0
    - programme_start_months: MONTHS(F('benefit_year') + '-01-01', F('program_start_date'))
    - first_period_index: int(plan_start_months / period_months) if (plan_start != '' and plan_start_months >= 1)
        else (0 if (plan_start != '' and plan_start_months == 0) else int(programme_start_months / period_months))
    - plan_cover_start: CFIELD('advantage','coverage_effective_date', status='active') or ''
    - first_period_covered_months: (period_months - (MONTHS(F('benefit_year') + '-01-01', plan_cover_start) % period_months))
        if (plan_cover_start != '' and MONTHS(F('benefit_year') + '-01-01', plan_cover_start) % period_months >=
        1) else ((period_months - (programme_start_months % period_months)) if (plan_cover_start != '' and programme_start_months
        % period_months >= 1) else period_months)
    - card_rate: P('quarterly_allowance_amount')
    - plan_rate: CPARAM('advantage','otc_allowance_quarterly', status='active') or 0.0
    - period_rate: plan_rate if plan_rate > card_rate else card_rate
    - card_in_use: F('card_activated_date') or ''
    - months_open: MONTHS(F('program_start_date'), NOW)
    - last_period_index: current_index if (card_in_use != '' and months_open >= 1) else (-1 if card_in_use == ''
        else current_index - 1)
    - owed_total: RND(period_rate / period_months * first_period_covered_months, 2) + (last_period_index - first_period_index)
        * period_rate
    - loads_posted: SUM('allowance_card_ledger','amount', event_type='allowance_quarterly_load') + SUM('allowance_card_ledger','amount',
        event_type='allowance_bonus_load')
    - loads_count: COUNT('allowance_card_ledger', event_type='allowance_quarterly_load')
    - taken_back: SUM('allowance_card_ledger','amount', event_type='allowance_period_expiry')
    - loads_made: loads_posted if (loads_count >= 1 and taken_back == 0) else ((loads_posted - taken_back) if (loads_count
        >= 1 and taken_back > 0) else 0.0)
    - plan_in_force: EXISTS('advantage', status='active')
    - plan_charged_months: XCOUNT('advantage','advantage_premium_ledger', within_months=K('year_months'), date_field='posted_date',
        event_type='advantage_premium_charge')
    - year_ceiling: P('annual_allowance_amount') if (P('annual_allowance_amount') > 0 and plan_in_force) else (RND(P('annual_allowance_amount')
        * plan_charged_months / K('year_months'), 2) if (P('annual_allowance_amount') > 0 and plan_charged_months
        >= 1) else period_rate)
    - result: RND(MX(0.0, MN(owed_total, year_ceiling) - loads_made), 2)
