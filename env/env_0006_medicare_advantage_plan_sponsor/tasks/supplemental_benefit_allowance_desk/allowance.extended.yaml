- id: allowance_dormancy_and_card_security
  subject:
  - allowance_dormancy_flagged
  - allowance_reactivation
  - allowance_card_suspension
  - allowance_card_release
  rule: 'A card that has gone the tier''s dormancy period without a settled purchase is flagged dormant, and the member is written to and asked whether they still want it. Dormancy stops nothing the member has already earned: the balance stays on the card subject to the ordinary expiry rules, and nothing is charged for bringing the card back into use. A dormant card is brought back into use on the member''s word alone, because only they can say they still want it, and the loads for later periods carry on as before. A card the member reports lost or stolen is stopped at once, on their statement, because the money on it is theirs to protect and delay costs them. A card the plan itself stops for suspected misuse stays stopped for no longer than the tier''s suspension days while the transactions are looked into, and the member is told on the day it is stopped what is happening and when they will hear. A stopped card is released only once the enquiry ends or a replacement card is activated, and the balance is never lost while the card is stopped. Dormancy is measured from the last settled purchase, never from the last authorisation or the last load, so a card that only ever received loads becomes dormant on time.'
  eligibility: []
  params:
    per_tier:
      Ridgecrest Healthy Options Card - Core:
        dormancy_period_days: =dormancy_period_days
        dormancy_reactivation_fee: =dormancy_reactivation_fee
        suspected_misuse_suspension_days: =suspected_misuse_suspension_days
        card_replacement_delivery_days: =card_replacement_delivery_days
      Ridgecrest Healthy Options Card - Select:
        dormancy_period_days: =dormancy_period_days
