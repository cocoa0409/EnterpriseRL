events:
- type: allowance_program_created
  target: allowance_programs
  mutation: create
  meaning: A supplemental benefit allowance programme is opened for a member whose health plan tier carries one, and the card is ordered.
  grain: One row per allowance programme a member holds for one benefit year.
  fields:
    allowance_program_id: Reference number of this programme.
    customer_id: The member the allowance belongs to.
    variant_name: The official name of the allowance programme opened.
    status: Opens at enrollment_recorded, the lifecycle entry state.
    linked_plan_reference: The health plan enrollment that carries this allowance.
    benefit_year: The benefit year the programme covers.
    program_start_date: First day the allowance may be spent.
    current_balance: 'Opens at zero: nothing has been loaded yet.'
    suspension_reason: Opens at not_suspended.
    statement_delivery: How the member asked to receive their statement.
  triggers:
  - event: allowance:allowance_card_issued
    map:
      allowance_program_id: allowance_program_id
      status: card_issued
- type: allowance_card_issued
  target: allowance_programs
  mutation:
    transition:
      from: enrollment_recorded
      to: card_issued
  meaning: The allowance card is produced and posted to the member's address on file.
  grain: One row per programme whose card has been produced.
  fields:
    allowance_program_id: The programme whose card was produced.
    status: Moves to card_issued.
    card_number_last_four: Last four digits of the card produced.
    card_issued_date: Date the card was posted.
  triggers: []
- type: allowance_card_activation
  target: allowance_programs
  mutation:
    transition:
      from: card_issued
      to: active
  meaning: The member activates the card, so the allowance becomes spendable and the first load is made available.
  grain: One row per card the member activates.
  fields:
    allowance_program_id: The programme activated.
    customer_id: The member who activated it.
    status: Moves to active.
    card_activated_date: Date the member activated the card.
  triggers:
  - event: allowance:allowance_quarterly_load
    map:
      allowance_program_id: allowance_program_id
      customer_id: customer_id
      entry_reason: scheduled_quarterly_load
- type: allowance_card_suspension
  target: allowance_programs
  mutation:
    transition:
      from: active
      to: suspended
  meaning: The card is stopped after the member reports it lost or stolen, asks for it to be stopped, or the plan sees a pattern it must look into.
  grain: One row per card stopped.
  fields:
    allowance_program_id: The programme whose card is stopped.
    status: Moves to suspended.
    suspension_reason: Why the card was stopped.
  triggers: []
- type: allowance_card_release
  target: allowance_programs
  mutation:
    transition:
      from: suspended
      to: active
  meaning: The card is put back into use once the enquiry ends or a replacement card is activated.
  grain: One row per card put back into use.
  fields:
    allowance_program_id: The programme whose card is released.
    status: Returns to active.
    suspension_reason: Returns to not_suspended.
    card_number_last_four: Last four digits of the card now in the member's hand.
  triggers: []
- type: allowance_dormancy_flagged
  target: allowance_programs
  mutation:
    transition:
      from: active
      to: dormant
  meaning: The card has gone unused for the dormancy period, so it is flagged dormant and the member is written to.
  grain: One row per card flagged dormant.
  fields:
    allowance_program_id: The dormant programme.
    status: Moves to dormant.
    last_purchase_date: The date of the last settled purchase the dormancy was measured from.
  triggers: []
- type: allowance_reactivation
  target: allowance_programs
  mutation:
    transition:
      from: dormant
      to: active
  meaning: A dormant card is brought back into use at the member's request, with whatever balance had not expired.
  grain: One row per dormant card brought back into use.
  fields:
    allowance_program_id: The programme brought back into use.
    status: Returns to active.
    current_balance: The balance still spendable after any expiry.
  triggers: []
- type: allowance_program_closure
  target: allowance_programs
  mutation:
    transition:
    - from: active
      to: closed
    - from: suspended
      to: closed
    - from: dormant
      to: closed
    - from: card_issued
      to: closed
  meaning: The allowance programme is closed, because the member asked for it or because the health plan enrollment that carried it has ended.
  grain: One row per allowance programme closed.
  fields:
    allowance_program_id: The programme closed.
    customer_id: The member whose programme is closed.
    status: Moves to closed.
    program_end_date: Last day the allowance could be spent.
  triggers:
  - event: allowance:allowance_balance_forfeiture
    map:
      allowance_program_id: allowance_program_id
      customer_id: customer_id
      entry_reason: disenrollment_forfeiture
- type: allowance_card_detail_update
  target: allowance_programs
  mutation: update
  meaning: 'The service details the plan holds on the programme are amended: the card in the member''s hand, how their statement is delivered, or the date of their last purchase.'
  grain: One row per allowance programme whose service details are amended.
  fields:
    allowance_program_id: The programme amended.
    card_number_last_four: Last four digits of the card now in the member's hand.
    statement_delivery: How the member now receives their statement.
    last_purchase_date: The date of the most recent settled purchase.
  triggers: []
- type: allowance_quarterly_load
  target: allowance_card_ledger
  meaning: The scheduled allowance for one benefit period is made available on the card.
  grain: One row per benefit period loaded on one programme.
  distinguish_by:
  - benefit_period
  - entry_reason
  - posted_date
  - amount
  fields:
    allowance_ledger_entry_id: Reference number of this entry.
    allowance_program_id: The programme loaded.
    customer_id: The member whose card is loaded.
    event_type: allowance_quarterly_load.
    posted_date: Date the allowance became spendable.
    amount: The allowance made available.
    benefit_period: The benefit period this load belongs to.
    entry_reason: scheduled_quarterly_load, or enrollment_proration on a first, part-period load.
    purchase_channel: not_applicable on a load.
    settlement_status: not_applicable on a load.
  account: allowance_balance
  direction: in
  triggers: []
- type: allowance_bonus_load
  target: allowance_card_ledger
  meaning: An extra allowance is made available to a member who has a qualifying chronic condition on record, or to correct a load that was made short.
  grain: One row per extra load made on one programme.
  distinguish_by:
  - benefit_period
  - entry_reason
  - amount
  - posted_date
  fields:
    allowance_ledger_entry_id: Reference number of this entry.
    allowance_program_id: The programme loaded.
    customer_id: The member whose card is loaded.
    event_type: allowance_bonus_load.
    posted_date: Date the extra allowance became spendable.
    amount: The extra allowance made available.
    benefit_period: The benefit period the extra load belongs to.
    entry_reason: chronic_condition_bonus or load_correction.
    source_ledger_entry_id: The load being corrected, on a correction; empty on a bonus.
  account: allowance_balance
  direction: in
  triggers: []
- type: allowance_purchase
  target: allowance_card_ledger
  meaning: The member spends part of the allowance at an approved retailer, online or through the catalogue.
  grain: One row per card transaction the member makes.
  distinguish_by:
  - posted_date
  - amount
  - merchant_name
  - authorization_code
  fields:
    allowance_ledger_entry_id: Reference number of this entry.
    allowance_program_id: The programme spent from.
    customer_id: The member who spent it.
    event_type: allowance_purchase.
    posted_date: Date the transaction posted to the card.
    amount: Value of the transaction.
    benefit_period: The benefit period the spending is counted in.
    entry_reason: eligible_purchase, or declined_purchase where the card network refused it.
    merchant_name: The retailer as it appears on the statement.
    merchant_category: The spending category the retailer falls into.
    purchase_channel: How the purchase was made.
    authorization_code: The authorisation the card network returned.
    settlement_status: How far the transaction got.
  account: allowance_balance
  direction: out
  triggers: []
- type: allowance_purchase_refund
  target: allowance_card_ledger
  meaning: Money comes back onto the card, because the retailer refunded a returned item or because a disputed purchase was decided in the member's favour.
  grain: One row per refund or dispute credit posted against one named purchase.
  distinguish_by:
  - source_ledger_entry_id
  - entry_reason
  - posted_date
  - amount
  fields:
    allowance_ledger_entry_id: Reference number of this entry.
    allowance_program_id: The programme credited.
    customer_id: The member credited.
    event_type: allowance_purchase_refund.
    posted_date: Date the money came back onto the card.
    amount: Amount returned to the card.
    benefit_period: The benefit period the credit is placed in.
    entry_reason: merchant_refund or dispute_credit.
    merchant_name: The retailer the refund came from.
    source_ledger_entry_id: The single purchase this refund or credit relates to.
    settlement_status: How far the refund got.
  account: allowance_balance
  direction: in
  triggers: []
- type: allowance_period_expiry
  target: allowance_card_ledger
  meaning: An allowance that was not spent by the end of the period it belonged to is taken back off the card.
  grain: One row per benefit period whose unspent allowance is taken back on one programme.
  distinguish_by:
  - benefit_period
  - posted_date
  - amount
  - source_ledger_entry_id
  fields:
    allowance_ledger_entry_id: Reference number of this entry.
    allowance_program_id: The programme the allowance is taken from.
    customer_id: The member whose allowance expires.
    event_type: allowance_period_expiry.
    posted_date: Date the unspent allowance was taken off.
    amount: Amount taken off.
    benefit_period: The benefit period whose allowance expired.
    entry_reason: period_end_expiry.
    source_ledger_entry_id: The load whose unspent part is being taken back.
  account: allowance_balance
  direction: out
  triggers: []
- type: allowance_balance_forfeiture
  target: allowance_card_ledger
  meaning: The whole spendable balance is taken off the card because the health plan enrollment that carried the allowance has ended.
  grain: One row per programme whose balance is forfeited.
  distinguish_by:
  - posted_date
  - amount
  - entry_reason
  fields:
    allowance_ledger_entry_id: Reference number of this entry.
    allowance_program_id: The programme whose balance is forfeited.
    customer_id: The member whose balance is forfeited.
    event_type: allowance_balance_forfeiture.
    posted_date: Date the balance was taken off.
    amount: The whole spendable balance taken off.
    benefit_period: The benefit period in which the forfeiture falls.
    entry_reason: disenrollment_forfeiture.
  account: allowance_balance
  direction: out
  triggers: []
- type: allowance_catalog_order_placed
  target: allowance_catalog_orders
  meaning: The member orders items from the plan's supplemental benefit catalogue, to be delivered to the address on file.
  grain: One row per catalogue order the member places.
  distinguish_by:
  - order_date
  - order_total
  - item_count
  - shipping_method
  fields:
    allowance_order_id: Reference number of this order.
    allowance_program_id: The programme the order is paid from.
    customer_id: The member who ordered.
    event_type: allowance_catalog_order_placed.
    order_date: Date the order was placed.
    order_total: Value of the items ordered.
    item_count: How many items the order contains.
    shipping_fee: Delivery charge taken off the allowance.
    shipping_method: Delivery service chosen.
    order_status: Opens at placed.
    cancellation_reason: Opens at not_applicable.
    expected_delivery_date: The delivery date quoted to the member.
  triggers:
  - event: allowance:allowance_purchase
