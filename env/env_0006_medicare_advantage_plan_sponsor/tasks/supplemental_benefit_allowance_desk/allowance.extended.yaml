- id: allowance_eligible_spending
  subject:
  - allowance_purchase
  rule: 'The card is good only at approved retailers and only for the spending categories the tier allows; a transaction anywhere else is declined at the till rather than paid and recovered later. The programme stands at active on the day the transaction is authorised. The retailer''s spending category is one of the categories the tier makes the card good for, and the transaction is no larger than the tier''s per-transaction maximum. Each category the tier limits has its own ceiling inside the period: what is spent on over-the-counter items, on approved groceries and on utilities is counted separately, and a transaction that would pass one of those ceilings is declined even where the card still holds money. The card is never good for cash, and a member asking to take cash out is told so plainly and offered the catalogue instead. A member may make only the tier''s number of transactions in one day; a further attempt is declined for safety and released once the member confirms it was theirs. A declined transaction is still recorded, with its reason, so that a member who says the card did not work can be told exactly what happened. A transaction that is authorised but never settled does not take money off the card, and a member who sees an authorisation fall away is told it was never a charge.'
  eligibility:
  - id: programme_active_for_spending
    applies_to:
    - allowance_purchase
    kind: state
    condition: The programme stands at active on the day the transaction is authorised.
    evidence_fields:
