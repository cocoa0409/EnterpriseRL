- id: allowance_closure_and_forfeiture
  subject:
  - allowance_program_closure
  - allowance_balance_forfeiture
  rule: An allowance programme ends when the health plan enrollment that carried it ends, or when the member asks for it to be closed. The closure is recorded on an allowance service intake with the request action programme_closure and an intake status of recorded, awaiting_member_signature or under_review, or the health plan enrollment that carried the allowance has already ended. Only the member may ask for the programme to be closed while their health plan continues, because the card and its balance are theirs to give up. On the tiers that forfeit on disenrollment, whatever is still on the card when the programme closes is taken off in one entry on the closing day and is not paid out in cash, refunded or moved to another card. Purchases made before the closing day are honoured even where they settle after it, and a member who spent their allowance on the last day keeps what they bought. A member who is moving from one Ridgecrest health plan to another is told before they decide that the card ends with the old plan, so that they can spend the balance first. Where a closure was recorded in error the programme is opened again and the forfeited balance restored by a correcting load naming the forfeiture.
  eligibility:
  - id: closure_authority
    applies_to:
    - allowance_program_closure
    kind: state
    condition: The closure is recorded on an allowance service intake with the request action programme_closure and an intake status of recorded, awaiting_member_signature or under_review, or the health plan enrollment that carried the allowance has already ended.
    evidence_fields:
    - allowance_benefit_requests.allowance_benefit_request_id
    - allowance_benefit_requests.request_action
    - allowance_benefit_requests.intake_status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - allowance_benefit_requests.allowance_benefit_request_id
      action_bindings:
        allowance_benefit_requests.allowance_benefit_request_id: allowance_benefit_request_id
    state_contract:
      field: allowance_benefit_requests.intake_status
      allowed:
      - recorded
      - awaiting_member_signature
      - under_review
  params:
    per_tier:
      Ridgecrest Healthy Options Card - Core:
        forfeiture_on_disenrollment: =forfeiture_on_disenrollment
        unused_balance_expiry_basis: =unused_balance_expiry_basis
      Ridgecrest Healthy Options Card - Select:
        forfeiture_on_disenrollment: =forfeiture_on_disenrollment
        unused_balance_expiry_basis: =unused_balance_expiry_basis
