      - carry_base
      ladder:
      - when: an allowance was loaded for that period and the member spent at least half of it from the card in
          that period
        method: the share that carries forward is measured on the whole allowance loaded for the period
      - when: an allowance was loaded for that period and the member spent less than half of it from the card in
          that period
