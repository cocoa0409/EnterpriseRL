    - period_credits: merchant_refunds if merchant_refunds > 0 else (dispute_credits if dispute_credits > 0 else
        0.0)
    - already_taken: SUM('allowance_card_ledger','amount', benefit_period=dying_label, event_type='allowance_period_expiry')
    - unspent: MX(0.0, period_loads + period_credits - period_spend - already_taken)
    - period_settled_for_base: SUM('allowance_card_ledger','amount', benefit_period=dying_label, event_type='allowance_purchase',
        settlement_status='settled')
    - carry_base: period_loads if (period_load_count >= 1 and period_settled_for_base >= period_loads / 2) else
        (unspent if (period_load_count >= 1 and period_settled_for_base < period_loads / 2) else 0.0)
    - period_load_entries: COUNT('allowance_card_ledger', benefit_period=dying_label, event_type='allowance_quarterly_load')
    - carry_share: K('whole_share') if (P('rollover_cap_percent') >= K('full_carry_percent') and period_load_entries
        >= 1) else (K('half_share') if (P('rollover_cap_percent') >= K('half_carry_percent') and period_load_entries
        >= 1) else 0.0)
    - carry_forward: RND(MN(carry_base * carry_share, unspent), 2)
    - result: RND(MX(0.0, unspent - carry_forward), 2)
    compute_basis:
      months_elapsed: The benefit periods that have passed are counted as the whole quarters of the benefit year
