# Product and event policy charter — Supplemental Benefit Allowance Programmes.
# The single registry of every quantified policy in this category; every number appears here once.
category: allowance
display_name: Supplemental Benefit Allowance Programmes
binding:
  holding_table: allowance_programs
  event_tables:
  - allowance_card_ledger
  - allowance_catalog_orders
  intake_tables:
  - allowance_benefit_requests
  status_field: status
  variant_field: variant_name
  quantity_fields:
    current_balance: allowance_balance
lifecycle:
  states:
  - enrollment_recorded
  - card_issued
  - active
  - suspended
  - dormant
  - closed
  transitions:
  - from: enrollment_recorded
    to: card_issued
    by: system
    means: The card is produced and posted to the member's address on file.
  - from: card_issued
    to: active
    by: user
    means: The member activates the card and the allowance becomes spendable.
  - from: card_issued
    to: closed
    by: user
    means: The member gives up the programme before ever activating the card.
  - from: active
    to: suspended
    by: agent
    means: The card is stopped after a reported loss or theft, at the member's request, or while suspected misuse is looked into.
  - from: suspended
    to: active
    by: agent
    means: The card is released once the enquiry ends or a replacement is activated.
  - from: active
    to: dormant
    by: system
    means: The card goes the dormancy period without a settled purchase.
  - from: dormant
    to: active
    by: agent
    means: The member asks for the dormant card to be brought back into use.
  - from: active
    to: closed
    by: user
    means: The programme ends at the member's request or with the health plan that carried it.
  - from: suspended
    to: closed
    by: user
    means: A stopped programme is ended rather than released.
  - from: dormant
    to: closed
    by: user
    means: A dormant programme is ended at the member's request or with the health plan that carried it.
accounts:
- key: allowance_balance
  unit: USD
  meaning: 'Spendable supplemental benefit allowance on the card: loads and refunds add to it, purchases, period expiries and forfeitures take off it, and its running total is the current balance on the programme.'
parameter_schema:
  quarterly_allowance_amount: Allowance loaded onto the card at the start of each benefit quarter, in USD.
  annual_allowance_amount: Total allowance a member may be loaded across the benefit year, in USD.
  load_frequency: 'How often the allowance is loaded: quarterly, monthly or annually (string).'
  load_day_of_period: Day of the benefit period on which the load is made available (integer 1-28).
  benefit_period_basis: 'What a benefit period is measured on: calendar quarters of the benefit year, or months (string).'
  rollover_permitted: Whether an unspent balance carries into the next benefit period (true or false).
  rollover_cap_percent: Largest share of one period's load that may carry forward, as a percentage.
  unused_balance_expiry_basis: When an unspent balance expires (string).
  enrollment_proration_basis: How a first load is reduced when the programme opens part way through a benefit period (string).
  otc_eligible: Whether over-the-counter health items may be bought with the card (true or false).
  healthy_food_eligible: Whether approved groceries may be bought with the card (true or false).
  utilities_eligible: Whether household utility bills may be paid with the card (true or false).
  rent_and_housing_eligible: Whether rent and housing costs may be paid with the card (true or false).
  transportation_eligible: Whether transport fares may be paid with the card (true or false).
  pet_supplies_eligible: Whether pet food and supplies may be bought with the card (true or false).
  fitness_eligible: Whether fitness memberships and equipment may be bought with the card (true or false).
  dental_vision_hearing_eligible: Whether dental, vision and hearing costs the health plan did not pay may be met from the card (true or false).
  eligible_merchant_categories: The spending categories the card may be used in (list of merchant_category values).
  otc_quarterly_sublimit: Largest part of a quarter's allowance that may be spent on over-the-counter items, in USD.
  food_monthly_sublimit: Largest amount that may be spent on approved groceries in one calendar month, in USD.
  utilities_monthly_sublimit: Largest amount that may be paid toward utilities in one calendar month, in USD.
  per_transaction_maximum: Largest single card transaction the plan will authorise, in USD.
  per_day_transaction_count_limit: How many card transactions may be authorised in one day (integer).
  cash_withdrawal_permitted: Whether the card may be used to take out cash (true or false).
  approved_retailer_count: Number of retailers that accept the card (integer).
  online_ordering_available: Whether the member may spend the allowance on the plan's website (true or false).
  catalog_ordering_available: Whether the member may order from the printed catalogue (true or false).
  catalog_order_minimum: Smallest catalogue order the plan will process, in USD.
  catalog_shipping_fee: Standard delivery charge taken off the allowance for a catalogue order, in USD.
  expedited_shipping_fee: Expedited delivery charge taken off the allowance for a catalogue order, in USD.
  catalog_order_processing_days: Business days between the order and its despatch (integer days).
  standard_shipping_days: Business days a standard delivery takes once despatched (integer days).
  expedited_shipping_days: Business days an expedited delivery takes once despatched (integer days).
  catalog_cancellation_window_hours: Hours after an order is placed within which the member may cancel it without a charge (integer hours).
  card_issue_fee: Fee for the first card, in USD.
  card_replacement_fee: Fee for replacing a lost or damaged card, in USD.
  card_replacement_delivery_days: Business days a replacement card takes to reach the member (integer days).
  first_card_delivery_days: Business days the first card takes to reach the member after the programme opens (integer days).
  card_activation_required: Whether the member must activate the card before it will work (true or false).
  card_activation_window_days: Calendar days after issue within which the card must be activated (integer days).
  dormancy_period_days: Calendar days without a settled purchase after which the card is treated as dormant (integer days).
  dormancy_reactivation_fee: Fee for bringing a dormant card back into use, in USD.
  suspected_misuse_suspension_days: Calendar days a card stays suspended while suspected misuse is looked into (integer days).
  purchase_dispute_window_days: Calendar days after a purchase posts within which the member may dispute it (integer days).
  dispute_resolution_days: Calendar days within which the plan must settle a disputed purchase (integer days).
  provisional_credit_days: Calendar days within which a provisional credit is put on the card while a dispute is looked into (integer days).
  merchant_refund_posting_days: Calendar days a retailer's refund takes to reach the card (integer days).
  chronic_condition_required: Chronic condition a member must have to hold this programme, or none (string).
  chronic_condition_bonus_amount: Extra load made available to members with the qualifying chronic condition, in USD.
  dual_status_required: Medicaid standing a member must have to hold this programme, or none (string).
  statement_frequency: How often the allowance statement is sent (string).
  balance_inquiry_channels: Ways the member may check their balance (list of channel names).
  mid_year_tier_change_basis: How the allowance is restated when the member moves to a different health plan tier part way through the year (string).
  forfeiture_on_disenrollment: Whether an unspent balance is forfeited when the health plan enrollment ends (true or false).
  maximum_programmes_per_member: How many allowance programmes one member may hold at once (integer).
  combined_annual_allowance_cap: Largest total allowance one member may be loaded across every programme they hold in a benefit year, in USD.
