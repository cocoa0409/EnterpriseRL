      Ridgecrest Healthy Options Card - Core:
        purchase_dispute_window_days: =purchase_dispute_window_days
        dispute_resolution_days: =dispute_resolution_days
        provisional_credit_days: =provisional_credit_days
        merchant_refund_posting_days: =merchant_refund_posting_days
      Ridgecrest Healthy Options Card - Select:
        purchase_dispute_window_days: =purchase_dispute_window_days
        dispute_resolution_days: =dispute_resolution_days
        provisional_credit_days: =provisional_credit_days
        merchant_refund_posting_days: =merchant_refund_posting_days
      Ridgecrest Healthy Options Card - Plus:
