      evidence:
      - history
      - tier_param
      cross_difficulty: null
    - id: expiry_spend_counted
      effect: method
      decides: period_spend
      bindings:
      - period_settled
      - period_refused
      - period_authorised
      - period_authorised_amount
      - period_posted
      - period_spend
      ladder:
      - when: the period carries a transaction the card network refused
        method: what was spent in the period is counted from the transactions that settled alone
      - when: the period carries no refused transaction but carries one still only authorised
        method: what was spent in the period is counted from the transactions that settled together with those still
          only authorised
      - when: otherwise
