- id: allowance_catalog_ordering
  subject:
  - allowance_catalog_order_placed
  - allowance_catalog_order_cancelled
  rule: A member may spend the allowance by ordering from the plan's catalogue, and the value of the items and the delivery charge come off the card when the order is placed. An order must reach the tier's order minimum before the plan will process it, and the delivery charge depends on the service chosen; expedited delivery costs the tier's expedited fee whatever the order is worth. The member asks for the order to be cancelled no later than the cancellation deadline counted from the time the order was placed. Hours are counted as full 24-hour periods from the moment the order was placed, a request made exactly on the deadline is in time, and calendar days are never used in place of hours. After that deadline the order may still be cancelled while it has not shipped, but the delivery charge is not returned, because the plan has already paid for the despatch. The plan quotes a delivery date from the tier's processing days and the shipping days of the service chosen, counted in business days, and tells the member that date when the order is taken. Where the plan cannot fill an item the whole order is cancelled and every penny, including the delivery charge, goes back on the card in the benefit period it came from. An order the member has not got can be traced by its tracking reference, and a delivery the carrier shows as made is re-sent once rather than argued over.
  eligibility:
  - id: cancellation_window_open
    applies_to:
    - allowance_catalog_order_cancelled
    kind: time
    condition: The member asks for the order to be cancelled no later than the cancellation deadline counted from the time the order was placed.
    evidence_fields:
    - allowance_catalog_orders.allowance_order_id
    - allowance_catalog_orders.source_order_id
    - allowance_catalog_orders.order_date
    - allowance_catalog_orders.order_status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - allowance_catalog_orders.source_order_id
      action_bindings:
        allowance_catalog_orders.source_order_id: source_order_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the time the order was placed
      anchor_source: allowance_catalog_orders.order_date
      relation: not_after
      duration_source: variants.catalog_cancellation_window_hours
      unit: elapsed_hours
      counting_rule: Hours are counted as full 24-hour periods from the moment the order was placed, a request made exactly on the deadline is in time, and calendar days are never used in place of hours.
      boundary: inclusive
  params:
    per_tier:
      Ridgecrest Healthy Options Card - Core:
        catalog_ordering_available: =catalog_ordering_available
        catalog_order_minimum: =catalog_order_minimum
        catalog_shipping_fee: =catalog_shipping_fee
        expedited_shipping_fee: =expedited_shipping_fee
        catalog_order_processing_days: =catalog_order_processing_days
        standard_shipping_days: =standard_shipping_days
        expedited_shipping_days: =expedited_shipping_days
        catalog_cancellation_window_hours: =catalog_cancellation_window_hours
      Ridgecrest Healthy Options Card - Select:
        catalog_ordering_available: =catalog_ordering_available
        catalog_order_minimum: =catalog_order_minimum
        catalog_shipping_fee: =catalog_shipping_fee
        expedited_shipping_fee: =expedited_shipping_fee
