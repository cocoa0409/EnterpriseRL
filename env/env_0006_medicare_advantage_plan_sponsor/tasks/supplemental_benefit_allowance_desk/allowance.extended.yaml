    - period_posted: SUM('allowance_card_ledger','amount', benefit_period=dying_label, event_type='allowance_purchase')
    - period_spend: period_settled if period_refused >= 1 else ((period_settled + period_authorised_amount) if period_authorised
        >= 1 else period_posted)
    - merchant_refunds: SUM('allowance_card_ledger','amount', benefit_period=dying_label, event_type='allowance_purchase_refund',
        entry_reason='merchant_refund')
    - dispute_credits: SUM('allowance_card_ledger','amount', benefit_period=dying_label, event_type='allowance_purchase_refund',
