name: env_0013_workplace_dining_and_catering_provider
company: Larkspur Table Workplace Dining Group

background: |
  Larkspur Table Workplace Dining Group is a contract food service company that runs workplace dining and corporate catering for employers across twelve metropolitan markets in the United States. It operates staffed cafes inside office buildings and research campuses, runs unattended micro markets in buildings too small to carry a kitchen, stocks office pantries and coffee bars, keeps vending banks on factory floors and loading docks, and caters everything from a fifteen-person working lunch to a nine-hundred-guest annual gala. Its clients are employers — technology firms, hospitals, law firms, manufacturers, property owners and universities — who buy dining as an employee benefit and hold a contract site by site; its other customers are the employees themselves, who eat in those cafes every working day and hold meal accounts in their own names.
  Seven service lines make up the book of business. The Workplace Cafe Management Program runs an employer's on-site cafe under one of six service models, from Grab & Go Cafe Service through Limited Service Cafe, Full Service Cafe, Culinary Center Cafe and Executive Dining Service up to Campus Dining Commons Service; a contract is signed per site, the cafe opens once mobilisation finishes, and from then on the contract keeps producing management fee invoices, subsidy funding paid in by the employer and subsidy drawn back down as employees eat. The Corporate Catering Service Agreement carries ordered catering at six service levels — Drop-Off Catering Account, Delivered Buffet Account, Attended Buffet Account, Staffed Full-Service Catering Account, Executive Hospitality Catering Account and Campus Catering Master Account — with every order, amendment, cancellation, delivery, invoice and payment booked against the agreement it was placed under. Private Event & Banquet Services covers hosted events under the Meeting Room Refreshment Package, Boardroom Reception Package, Conference Day Delegate Package, Seated Banquet Package, Gala Reception Package and Multi-Day Conference Residency Package, where each booking takes a deposit, is confirmed against a guaranteed guest count and settles after the event. The Unattended Micro Market Program places self-checkout stores — Cooler & Snack Wall, Compact Micro Market, Standard Micro Market, Fresh Food Micro Market, Expanded Campus Micro Market and Smart Store Micro Market — and settles with the client monthly. The Office Pantry & Beverage Program delivers stocked pantries as Coffee & Tea Service, Standard Snack Pantry, Fresh Pantry Program, Barista Bar Program, Full Hospitality Pantry Program or Campus Pantry Network Program, and the Vending Services Program places machines as Single Machine Snack Service, Snack & Cold Beverage Bank, Combination Vending Bank, Fresh Food Vending Service, Campus Vending Network Service or Managed Vending & Kiosk Service, paying commission back to the client on what sells.
  On the employee side, the Employee Meal Account is held by the diner rather than the employer, in six plans: Pay-As-You-Go Badge Account, Prepaid Declining Balance Account, Payroll Deduction Meal Account, Subsidized Daily Allowance Account, Full Subsidy Employee Meal Account and Executive Dining Charge Account. Each account is tapped at the till with a site badge and carries three running quantities — spendable stored value, unspent employer allowance and charges awaiting payroll recovery — so an employee's week of lunches arrives in the records as a stream of till transactions, allowance grants, loads and payroll deductions.
  The people who call the client services desk are a mixed population. On one line are workplace experience managers, office administrators, executive assistants and accounts payable clerks calling about a site they run: they usually hold several service lines at once — a cafe contract and a pantry programme at headquarters, a micro market and a vending bank at the warehouse, a catering agreement used weekly and a banquet agreement used twice a year — and they arrive mid-stream, with invoices already issued, subsidy already funded, orders already placed and events already deposited. On the other line are employees calling about their own meal account: a charge they do not recognise, an allowance that did not appear, a payroll deduction that looks wrong, or a plan they want to change now that they have moved sites or gone on leave. Larger clients run many sites under one account code and hold a dozen contracts at once, while a single-floor tenant may hold nothing but a cooler wall; both are ordinary here.

logs:
  verification_log_table: verification_log
  handoff_log_table: handoff_log

difficulties:
  - name: cafe_contract_desk
    claim:
      categories: [cafe]
      event_types: [cafe_contract_opened, cafe_mobilization_started, cafe_service_commenced, cafe_service_suspended, cafe_service_resumed, cafe_termination_notice_filed, cafe_contract_closed, cafe_service_model_changed, cafe_management_fee_invoiced, cafe_subsidy_funding_posted, cafe_subsidy_drawdown_posted, cafe_invoice_payment_posted, cafe_service_credit_issued, cafe_penalty_fee_posted]
    summary: >
      The callers here run an employer's on-site cafe: workplace experience managers, facilities leads and accounts payable clerks
      ringing about one site's Workplace Cafe Management Program contract, and often about several sites at once. Their situations
      vary along four axes that all bite at the same time: which of the six service models the site holds, since every fee, notice
      period, subsidy model and credit percentage is a different column of the same dictionary; where the contract stands in its
      lifecycle, because a proposal, a contract in mobilization, one that is open, one paused for a building closure and one already
      winding down after notice are each handled differently; what else the same client holds, since a portfolio of cafe contracts
      moves the management fee band and a pantry or micro market at the same site changes what the cafe may charge and where its
      subsidy reaches; and what history the contract carries, because subsidy funding lots, months of invoices, suspended days already
      taken and a participation record all sit behind the answer. The records in play are the cafe contract itself, its ledger of
      management fee invoices, subsidy funding and drawdowns, payments, service credits and contractual charges, and the service
      request log through which suspensions, resumptions, model changes, termination notices and credit claims are taken. The rules
      the agent must locate are gates before anything is written (which lifecycle states admit the work, and which anchor date and
      counting basis a deadline is measured from, as in cafe_mobilization_terms, cafe_termination_terms and cafe_service_credit_terms),
      and quantities that vary by service model and by portfolio (cafe_management_fee_calc, cafe_agg_portfolio_fee_band,
      cafe_subsidy_funding_terms, cafe_subsidy_drawdown_order, cafe_service_suspension_terms, cafe_service_model_change,
      cafe_invoice_payment_terms, cafe_participation_guarantee and cafe_combination_pantry_interaction); the natural order of the
      domain is that a contract is proposed, countersigned, mobilised and opened before it invoices, funds subsidy and eventually
      winds down, and that order is background to reading the records rather than a rule in itself. Most of the work is the agent's
      own: reading the contract and its ledger, deriving the figure the policy yields, and writing the invoice, funding, drawdown,
      credit or charge the derivation supports; but the acts that belong to the client alone - countersigning a proposal into
      mobilization, giving written notice of termination, confirming a change of service model - are theirs to perform through a
      user tool the agent hands over, and the desk records the request rather than making the decision for them. Some genuinely
      common requests fall outside every rule written here and leave the agent only a POLICY_NOT_COVERED handoff: a client asking to
      renegotiate the management fee or the participation guarantee itself, a request to transfer a contract to a different legal
      entity or to novate it to an acquirer, a demand for a credit larger than the billing period ceiling or for a mechanism the
      charter does not carry such as a shared-savings arrangement, and any question about a cafe at a site the client does not hold
      a contract for.
  - name: catering_order_desk
    claim:
      categories: [catering]
      event_types: [catering_agreement_opened, catering_agreement_activated, catering_agreement_placed_on_hold, catering_agreement_reinstated, catering_agreement_closed, catering_order_placed, catering_order_amended, catering_order_cancelled, catering_order_delivered, catering_order_invoiced, catering_cancellation_fee_posted, catering_order_payment_posted, catering_service_credit_issued]
    summary: >
      The callers here are the people who order food for meetings: executive assistants, office managers, event coordinators and the
      accounts payable clerks who pay for what they ordered, each working under a Corporate Catering Service Agreement at one of six
      service levels. Their settings differ by the service level held, which fixes lead times, minimums, cancellation ladders,
      staffing and invoicing basis; by where the agreement stands, since an account in credit review takes no orders, an account on
      credit hold takes none either and may not be amended upward, and a closed account may still carry a balance; by how many
      agreements the same client holds and how much exposure sits across their open orders; and by the history of the order in
      question, because an order that has been amended twice, delivered late, or cancelled after a run of earlier cancellations is
      priced from what stands on it now rather than what it was first quoted at. The records are the agreement, the order history
      that carries every placement, amendment, cancellation, delivery, invoice, cancellation charge, payment and credit against one
      order reference, and the change request log through which cancellations, guest count changes, date moves and credit claims are
      taken. The governing rules are gates on state and on time (catering_order_intake_terms, catering_agg_credit_exposure,
      catering_amendment_terms, catering_cancellation_charges and catering_service_credit_terms all say which statuses admit the work,
      which day starts a clock and whether the boundary day counts) and quantities that are per service level throughout
      (catering_onboarding_terms, catering_delivery_and_service_terms, catering_invoicing_terms, catering_payment_terms,
      catering_hold_and_closure_terms and catering_combination_cafe_interaction); the ordinary order of the domain is that an
      agreement is credit-reviewed and activated, then orders are placed, amended, served, invoiced and paid, and that sequence is
      background for reading the records rather than a rule of its own. The agent does the service work - locating the agreement and
      the order, deriving the charge, credit or invoice the policy yields, and writing it - while the acts only the client can take,
      such as ending the agreement or confirming a cancellation that carries a charge, are handed over as the client's own action and
      logged as a request until they confirm. Requests that no rule here can settle, and that leave only a POLICY_NOT_COVERED
      handoff, include a demand to waive a cancellation charge as a commercial gesture, a request to raise the credit limit or change
      the negotiated standing discount, catering for a guest count above the service level's ceiling or at a site with no delivery
      coverage, and anything asking Larkspur Table to contract with or pay an outside caterer on the client's behalf.
  - name: banquet_event_desk
    claim:
      categories: [banquet]
      event_types: [banquet_agreement_opened, banquet_agreement_activated, banquet_agreement_hold_changed, banquet_agreement_closed, banquet_event_booked, banquet_deposit_received, banquet_guarantee_confirmed, banquet_event_delivered, banquet_event_invoiced, banquet_deposit_applied, banquet_booking_cancelled, banquet_cancellation_charge_posted, banquet_deposit_refunded, banquet_payment_posted]
    summary: >
      The callers here are clients planning and settling hosted events under a Private Event & Banquet Services agreement: an
      executive assistant holding a boardroom reception, a conference organiser running a multi-day residency, a finance manager
      querying a final bill weeks after a gala. What makes the judgement hard is the combination of the event package held, which
      fixes minimum spend, room rental and its waiver, deposit percentages and due dates, the guarantee deadline and shortfall
      treatment, the cancellation ladder and the payment terms; the state of the agreement, since a proposal cannot take bookings, an
      agreement on hold has had booking stopped while its confirmed events are still delivered, and a closed agreement may still hold
      deposits and an unsettled bill; the money already held, because deposits sit booking by booking and are applied, returned or set
      against a charge rather than pooled; and the history of the booking itself, which may have been moved to a new date once
      already, had its guarantee raised after the deadline, or been delivered to a guest count quite different from the one
      guaranteed. The records are the agreement, the event ledger that carries the booking, its deposits, guarantee, delivery, bill,
      deposit applications, cancellation and payments under one booking reference, and the event request log through which
      cancellations, date moves, guarantee changes and credit claims are taken. The rules are state and time gates on every write
      (banquet_agreement_terms, banquet_booking_terms, banquet_deposit_terms, banquet_cancellation_terms, banquet_settlement_terms and
      banquet_payment_terms each name the statuses that admit the work and the anchor, counting basis and boundary of their deadlines)
      together with per-package quantities and aggregation bases (banquet_agg_multi_holding, banquet_agg_deposit_and_diary_pooling,
      banquet_guarantee_terms, banquet_hold_and_closure_terms and banquet_combination_venue_interaction); the natural flow from
      booking through deposit, guarantee, delivery and settlement is background for reading a booking's records rather than a rule.
      The agent reads the agreement and the ledger, derives what the package yields and writes the booking, deposit, guarantee,
      invoice, application, charge, refund or payment; the client's own acts - cancelling their event, moving its date, confirming a
      guarantee that will be billed, ending the agreement - are handed over to them through a user tool and recorded as a request
      until confirmed. Situations no rule here decides, where the only correct route is a POLICY_NOT_COVERED handoff, include a client
      asking for a cancellation charge to be waived outside the stated exceptions, a request to move a deposit to a different client's
      agreement, a demand for a goodwill adjustment beyond the package ceiling, a request for a venue or licence the agreement does
      not cover, and any claim for consequential loss arising from an event.
  - name: micro_market_desk
    claim:
      categories: [market]
      event_types: [market_agreement_opened, market_installation_scheduled, market_service_commenced, market_service_suspended, market_service_resumed, market_agreement_closed, market_monthly_settlement_invoiced, market_subsidy_funding_posted, market_subsidy_drawdown_posted, market_settlement_payment_posted, market_shrink_adjustment_posted, market_service_credit_issued]
    summary: >
      The callers here look after an unattended self-checkout store on their floor: workplace managers querying a monthly settlement,
      finance clerks disputing a shrink charge, site leads asking to close the market for a refurbishment or to change what it carries.
      Their settings vary by the market format held, since each of the six formats has its own commercial basis - commission, subsidy
      true-up or management fee - and its own lease, markup, sales guarantee, shrink allowance, uptime guarantee and notice periods;
      by the state of the agreement, because a market still installing, one open, one closed off for a floor move and one being taken
      out are each treated differently; by what else the client holds, since a portfolio of markets moves the settlement discount band
      and a cafe contract at the same site pools the employee daily subsidy ceiling across both outlets; and by the period's history,
      because settlement, shrink and outage credits are all measured over a settlement period against records that may be incomplete
      when the client rings. The records are the market agreement, the ledger of settlement invoices, subsidy funding and kiosk
      drawdowns, settlement payments, shrink adjustments and service credits, and the service request log through which suspensions,
      resumptions, planogram changes, shrink disputes and credit claims are taken. The rules are state gates saying which statuses
      admit each write and time gates fixing the anchor and counting basis of each deadline (market_installation_terms,
      market_settlement_terms, market_subsidy_funding_terms, market_subsidy_drawdown_rules, market_shrink_terms,
      market_service_credit_terms, market_settlement_payment_terms and market_suspension_and_closure_terms), alongside portfolio and
      combination bases (market_agg_multi_holding, market_agg_portfolio_settlement_band and market_combination_dining_interaction);
      that a market is proposed, installed, opened, settled monthly and eventually removed is the domain's ordinary sequence and is
      background for reading the records rather than a rule. The agent locates the agreement and its ledger, works out what the format
      yields, and writes the settlement, funding, drawdown, adjustment, credit or payment; the acts reserved to the client - giving
      notice to end the agreement, confirming a suspension that carries a standby charge, confirming a planogram change - are handed
      over as the client's own action and logged as a request until they confirm. Requests no rule can settle, leaving only a
      POLICY_NOT_COVERED handoff, include a client asking to change the shrink allowance or the commission basis on the agreement in
      force, a demand to write off shrink already charged outside the dispute route, a request to stock a product group the format does
      not carry or to install a market at a site that fails the entry gate, and any request to pay employees back directly for
      purchases made at the kiosk.
  - name: employee_meal_account_desk
    claim:
      categories: [meal]
      event_types: [meal_account_opened, meal_account_activated, meal_account_restricted, meal_account_reinstated, meal_account_leave_status_changed, meal_account_closed, meal_plan_changed, meal_purchase_posted, meal_account_load_posted, meal_subsidy_granted, meal_subsidy_applied, meal_refund_posted, meal_charge_accrued, meal_payroll_deduction_posted, meal_overdraft_fee_posted]
    summary: >
      The callers here are the diners themselves: employees ringing about a charge they do not recognise, an allowance that did not
      appear, a payroll deduction that looks wrong, a badge that stopped working, or a plan they want to change now that they have
      moved site or come back from leave. The setting varies by the plan held, since each of the six plans carries its own transaction
      and daily ceilings, allowance basis and expiry, payroll terms, overdraft treatment, refund window and closure terms; by the state
      of the account, because an enrolled account has never been activated, a restricted one keeps its value but has lost payroll
      tender, a parked one is declined at the till and a closed one may still be owed a balance; by whether the employee holds more
      than one account, since arrears are read across the portfolio under one employer while daily ceilings are read account by
      account; and by what the employer holds at the site, because allowance only reaches outlets the employer funds and stops with a
      cafe contract that closes or a market that never opened. The records are the meal account with its three running quantities,
      the transaction history of purchases, loads, allowance grants and applications, refunds, accrued charges, payroll deductions and
      overdraft charges, each carrying the till reference it concerns, and the request log through which closures, plan changes, refund
      requests, leave and restriction reviews are taken. The rules are state gates on every write and time gates with a named anchor
      and counting basis (meal_enrollment_terms, meal_purchase_and_tender_rules, meal_load_and_refund_terms, meal_subsidy_grant_rules,
      meal_subsidy_application_rules, meal_payroll_recovery_terms, meal_restriction_terms, meal_leave_and_closure_terms and
      meal_plan_change_terms), together with the portfolio and combination bases in meal_agg_multi_holding,
      meal_agg_employee_portfolio and meal_combination_employer_program_interaction; the ordinary flow from enrolment through
      activation, spending, allowance, payroll recovery and closure is background for reading an account rather than a rule. The agent
      verifies who is on the line, reads the account and its transactions, derives what the plan yields and writes the load, grant,
      application, refund, accrual, deduction, charge or status change; but closing the account, confirming a plan change and
      consenting to payroll recovery are the employee's own acts, handed over through a user tool and recorded as a request until they
      confirm. Requests no rule here can settle, where the only correct route is a POLICY_NOT_COVERED handoff, include an employee
      asking for unspent employer allowance to be paid out in cash, a request to move stored value or arrears to a colleague's account
      or to an account under a different employer, a dispute about the employer's own subsidy policy or about tax on the benefit, a
      demand to waive arrears the employer has already been billed for, and any request about a payroll deduction that has already
      left the employee's pay.
