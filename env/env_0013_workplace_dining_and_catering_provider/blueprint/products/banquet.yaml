  - id: banquet_settlement_terms
    subject: [banquet_event_invoiced, banquet_deposit_applied]
    rule: >
      The final bill is raised the number of calendar days after the event printed against the package, and it gathers food and beverage actually consumed, the billable guest count, room rental, the service charge, audio-visual, any dance floor, additional service hours, security hours and corkage onto one document.
      The service charge printed against the package is applied to food and beverage and to additional service hours, and never to room rental, audio-visual or corkage.
      Deposits held against the booking are applied to the final bill before it is issued, oldest deposit first, and the bill shows the gross charge, the deposits applied and the balance due.
      A final bill is only raised while the agreement stands active or on hold, and where an agreement closes with an event already delivered, the bill is raised against the closing agreement before it is settled out.
      A goodwill adjustment may be made on the final bill up to the ceiling printed against the package, as a percentage of the contracted event value, and an adjustment beyond that ceiling is not made at the desk.
      Where the client disputes a line on the final bill, the undisputed balance falls due on the ordinary terms and only the disputed line is held over.
      Where the deposits applied exceed the gross charge, no bill is raised and the surplus is returned as a deposit refund instead.
    eligibility:
      - id: settlement_state
        applies_to: [banquet_event_invoiced, banquet_deposit_applied]
        kind: state
        condition: A final bill is only raised while the agreement stands active or on hold, and where an agreement closes with an event already delivered, the bill is raised against the closing agreement before it is settled out.
        evidence_fields: [banquet_agreements.status, banquet_agreements.receivable_balance_usd, banquet_agreements.banquet_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [banquet_agreements.banquet_agreement_id]
          action_bindings:
            banquet_agreements.banquet_agreement_id: banquet_agreement_id
        state_contract:
          field: banquet_agreements.status
          allowed: [active, on_hold]
    params:
      per_tier:
        "Meeting Room Refreshment Package": {bill_days_after: "=final_invoice_days_after_event", service_charge_pct: "=service_charge_pct", av_usd: "=av_package_usd", dance_floor_usd: "=dance_floor_fee_usd", overtime_rate_usd: "=overtime_rate_per_hour_usd", included_hours: "=included_service_hours", corkage_usd: "=corkage_fee_per_bottle_usd", adjustment_cap_pct: "=final_bill_adjustment_cap_pct_of_event"}
        "Boardroom Reception Package": {bill_days_after: "=final_invoice_days_after_event", service_charge_pct: "=service_charge_pct", av_usd: "=av_package_usd", dance_floor_usd: "=dance_floor_fee_usd", overtime_rate_usd: "=overtime_rate_per_hour_usd", included_hours: "=included_service_hours", corkage_usd: "=corkage_fee_per_bottle_usd", adjustment_cap_pct: "=final_bill_adjustment_cap_pct_of_event"}
        "Conference Day Delegate Package": {bill_days_after: "=final_invoice_days_after_event", service_charge_pct: "=service_charge_pct", av_usd: "=av_package_usd", dance_floor_usd: "=dance_floor_fee_usd", overtime_rate_usd: "=overtime_rate_per_hour_usd", included_hours: "=included_service_hours", corkage_usd: "=corkage_fee_per_bottle_usd", adjustment_cap_pct: "=final_bill_adjustment_cap_pct_of_event"}
        "Seated Banquet Package": {bill_days_after: "=final_invoice_days_after_event", service_charge_pct: "=service_charge_pct", av_usd: "=av_package_usd", dance_floor_usd: "=dance_floor_fee_usd", overtime_rate_usd: "=overtime_rate_per_hour_usd", included_hours: "=included_service_hours", corkage_usd: "=corkage_fee_per_bottle_usd", adjustment_cap_pct: "=final_bill_adjustment_cap_pct_of_event"}
        "Gala Reception Package": {bill_days_after: "=final_invoice_days_after_event", service_charge_pct: "=service_charge_pct", av_usd: "=av_package_usd", dance_floor_usd: "=dance_floor_fee_usd", overtime_rate_usd: "=overtime_rate_per_hour_usd", included_hours: "=included_service_hours", corkage_usd: "=corkage_fee_per_bottle_usd", adjustment_cap_pct: "=final_bill_adjustment_cap_pct_of_event"}
