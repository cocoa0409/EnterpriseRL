  - id: banquet_hold_and_closure_terms
    subject: [banquet_agreement_hold_changed, banquet_agreement_closed]
    rule: >
      Booking is stopped on an agreement when arrears pass the credit hold threshold or when a required certificate of event insurance lapses, and it restarts once the balance is settled or the certificate replaced.
      A hold or a closure is only worked while the agreement stands active, on hold or closed, and never on a proposal, which is withdrawn instead.
      Events already confirmed when a hold goes on are still delivered, because the client has paid deposits against them and the venue has held the date.
      Only the client may end an event services agreement, and the desk records the request for the client to confirm rather than closing the agreement on their word alone.
      Notice to end the agreement is the number of calendar days printed against the package, and every confirmed event inside that notice period is delivered or cancelled on the ordinary cancellation terms before the agreement closes.
      An agreement is not closed while deposit money is still held against an unserved booking; the deposit is returned or applied first.
      Where the client has not reached the minimum number of events a year printed against the package, no shortfall charge falls due, since the package prices each event on its own.
    eligibility:
      - id: lifecycle_state
        applies_to: [banquet_agreement_hold_changed, banquet_agreement_closed]
        kind: state
        condition: A hold or a closure is only worked while the agreement stands active, on hold or closed, and never on a proposal, which is withdrawn instead.
        evidence_fields: [banquet_agreements.status, banquet_agreements.deposit_balance_usd, banquet_agreements.banquet_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [banquet_agreements.banquet_agreement_id]
          action_bindings:
            banquet_agreements.banquet_agreement_id: banquet_agreement_id
        state_contract:
          field: banquet_agreements.status
          allowed: [active, on_hold, closed]
    params:
      per_tier:
        "Meeting Room Refreshment Package": {notice_days: "=agreement_notice_days", hold_days: "=credit_hold_threshold_days_past_due", insurance_required: "=insurance_certificate_required"}
        "Boardroom Reception Package": {notice_days: "=agreement_notice_days", hold_days: "=credit_hold_threshold_days_past_due", insurance_required: "=insurance_certificate_required"}
        "Conference Day Delegate Package": {notice_days: "=agreement_notice_days", hold_days: "=credit_hold_threshold_days_past_due", insurance_required: "=insurance_certificate_required"}
        "Seated Banquet Package": {notice_days: "=agreement_notice_days", hold_days: "=credit_hold_threshold_days_past_due", insurance_required: "=insurance_certificate_required"}
        "Gala Reception Package": {notice_days: "=agreement_notice_days", hold_days: "=credit_hold_threshold_days_past_due", insurance_required: "=insurance_certificate_required"}
        "Multi-Day Conference Residency Package": {notice_days: "=agreement_notice_days", hold_days: "=credit_hold_threshold_days_past_due", insurance_required: "=insurance_certificate_required"}
  - id: banquet_combination_venue_interaction
    subject: [banquet_event_booked, banquet_event_invoiced]
    rule: >
      What a client holds elsewhere in the dining programme changes what an event costs and who produces it.
      Where the same client holds an active workplace cafe management contract at the site the venue sits in, and that contract's service model permits catering out of the cafe kitchen, the event is produced in that kitchen and no preferred vendor fee is charged for the food.
      Where the client brings an outside caterer into a venue at a site where they already hold a cafe contract permitting catering, the preferred vendor fee printed against the package is charged in full, because the in-house kitchen was available and was not used.
      A private event and banquet booking and a corporate catering order for the same room on the same day are mutually exclusive: the room is held by the booking, and any additional food for that room is added to the event rather than ordered through the catering agreement.
      Where the client holds a catering agreement whose largest guest count is smaller than the event's guaranteed count, the event stays on the event services agreement whatever the client asks, since only the venue can seat it.
      Where the cafe contract at the site closes or stands suspended, production moves to the district kitchen and the event price is unchanged, since the package rate already covers production.
    eligibility: []
    params:
      per_tier:
        "Meeting Room Refreshment Package": {vendor_fee_waived_with_cafe: true, room_exclusive_to_booking: true}
        "Boardroom Reception Package": {vendor_fee_waived_with_cafe: true, room_exclusive_to_booking: true}
        "Conference Day Delegate Package": {vendor_fee_waived_with_cafe: true, room_exclusive_to_booking: true}
        "Seated Banquet Package": {vendor_fee_waived_with_cafe: true, room_exclusive_to_booking: true}
        "Gala Reception Package": {vendor_fee_waived_with_cafe: false, room_exclusive_to_booking: true}
        "Multi-Day Conference Residency Package": {vendor_fee_waived_with_cafe: true, room_exclusive_to_booking: true}
