events:
  - type: banquet_agreement_opened
    target: banquet_agreements
    mutation: create
    meaning: a private event and banquet services agreement is drawn up for a client against a venue
    grain: one row per event services agreement a client holds at one venue
    fields:
      customer_id: the client organisation that will hold the agreement
      variant_name: the event package the agreement is written against
      status: the agreement opens in the proposed state
      client_account_code: the client account code the agreement bills under
      agreement_start_date: first day of the proposed term
      agreement_end_date: last day of the proposed term
      venue_code: the venue the agreement is written against
      billing_contact_email: where event invoices will be sent
      purchase_order_reference: the client's purchase order reference, when they use one
      deposit_balance_usd: money held on deposit, zero on a new agreement
      receivable_balance_usd: opening unsettled balance, zero on a new agreement
    triggers: []
  - type: banquet_agreement_activated
    target: banquet_agreements
    mutation: {transition: {from: proposed, to: active}}
    meaning: the agreement is countersigned and the venue opens for booking
    grain: one row per agreement, on the day booking opens
    fields:
      status: the agreement moves into active
      activated_date: the day booking opened
    triggers: []
  - type: banquet_agreement_hold_changed
    target: banquet_agreements
    mutation: {transition: [{from: active, to: on_hold}, {from: on_hold, to: active}]}
    meaning: booking is stopped or restarted on the agreement while arrears or an insurance lapse are dealt with
    grain: one row per agreement, on the day the hold goes on or comes off
    fields:
      status: the agreement moves between active and on_hold
      hold_start_date: the day the hold was applied, cleared when it is lifted
    triggers: []
  - type: banquet_agreement_closed
    target: banquet_agreements
    mutation: {transition: [{from: active, to: closed}, {from: on_hold, to: closed}, {from: proposed, to: closed}]}
    meaning: the event services agreement ends and no further events are booked under it
    grain: one row per agreement, on the day it closes
    fields:
      status: the agreement moves into closed
      closed_date: the day the agreement closed
    triggers: []
  - type: banquet_event_booked
    target: banquet_ledger
    meaning: an event is confirmed into the diary for a date, a venue, a package and an estimated value
    grain: one row per confirmed event booking
    distinguish_by: [booking_reference, event_date, venue_code]
    fields:
      banquet_agreement_id: the agreement the booking sits under
      customer_id: the client booking
      event_type: the event family of this row
      booking_reference: the booking this row opens
      charge_code: event_minimum on every row of this family
      amount_usd: the estimated contracted value of the event
      posted_date: the day the booking was confirmed
      event_date: the day the event is to be held
      venue_code: the venue held for the event
      package_name: the package named on the booking
      setup_style: the room set-up ordered
      guaranteed_headcount: the working guest count at the time of booking
    triggers: []
  - type: banquet_deposit_received
    target: banquet_ledger
    meaning: the client pays a deposit against a booked event
    grain: one row per deposit payment received against one booking
    distinguish_by: [booking_reference, posted_date, amount_usd]
    fields:
      banquet_agreement_id: the agreement the deposit sits under
      customer_id: the client paying
      event_type: the event family of this row
      booking_reference: the booking the deposit is held against
      charge_code: deposit_payment on every row of this family
      amount_usd: the deposit received
      posted_date: the day the deposit cleared
      event_date: the day of the event the deposit is held for
      payment_channel: how the client paid the deposit
    account: deposit_held
    direction: in
    triggers: []
  - type: banquet_guarantee_confirmed
    target: banquet_ledger
    meaning: the client gives the final guaranteed guest count for a booked event
    grain: one row per guarantee given against one booking
    distinguish_by: [booking_reference, posted_date, guaranteed_headcount]
    fields:
      banquet_agreement_id: the agreement the booking sits under
      customer_id: the client guaranteeing
      event_type: the event family of this row
      booking_reference: the booking guaranteed
      charge_code: event_minimum on every row of this family
      amount_usd: the contracted event value the guarantee prices to
      posted_date: the day the guarantee was given
      event_date: the day of the event
      guaranteed_headcount: the guest count guaranteed
      setup_style: the room set-up the guarantee is built to
    triggers: []
  - type: banquet_event_delivered
    target: banquet_ledger
    meaning: the event is held and the actual guest count and service hours are recorded
    grain: one row per event delivered
    distinguish_by: [booking_reference, event_date, actual_headcount]
    fields:
      banquet_agreement_id: the agreement the booking sits under
      customer_id: the client served
      event_type: the event family of this row
      booking_reference: the booking delivered
      charge_code: food_and_beverage on every row of this family
      amount_usd: the value actually consumed at the event
      posted_date: the day the event was closed off
      event_date: the day the event was held
      guaranteed_headcount: the guest count guaranteed
      actual_headcount: the guest count actually served
      venue_code: the venue used
    triggers:
      - event: banquet:banquet_event_invoiced
        map: {booking_reference: booking_reference, event_date: event_date, charge_code: invoice}
  - type: banquet_event_invoiced
    target: banquet_ledger
    meaning: the final bill for a delivered event is raised
    grain: one row per final bill raised for one booking
    distinguish_by: [booking_reference, invoice_reference, posted_date]
    fields:
      banquet_agreement_id: the agreement invoiced
      customer_id: the client invoiced
      event_type: the event family of this row
      booking_reference: the booking billed
      charge_code: invoice on every row of this family
      amount_usd: the amount billed before deposits are applied
      posted_date: the day the final bill was raised
      event_date: the day of the event billed
      invoice_reference: the final bill this row is
      guaranteed_headcount: the guest count the bill is priced on
      actual_headcount: the guest count actually served
    account: event_receivable
    direction: in
    triggers:
      - event: banquet:banquet_deposit_applied
        map: {booking_reference: booking_reference, invoice_reference: invoice_reference, charge_code: deposit_application}
  - type: banquet_deposit_applied
    target: banquet_ledger
    meaning: money held on deposit is set against a final bill or a cancellation charge
    grain: one row per deposit application against one bill or charge
    distinguish_by: [booking_reference, invoice_reference, posted_date]
    fields:
      banquet_agreement_id: the agreement the deposit sits under
      customer_id: the client whose deposit is applied
      event_type: the event family of this row
      booking_reference: the booking the deposit was held against
      charge_code: deposit_application on every row of this family
      amount_usd: the deposit money applied
      posted_date: the day the deposit was applied
      invoice_reference: the bill or charge the deposit was set against
      event_date: the day of the event concerned
    account: deposit_held
    direction: out
    triggers: []
  - type: banquet_booking_cancelled
    target: banquet_ledger
    meaning: the client cancels a confirmed event before it is held
    grain: one row per cancellation of one booking
    distinguish_by: [booking_reference, notice_given_date, posted_date]
    fields:
      banquet_agreement_id: the agreement the booking sits under
      customer_id: the client cancelling
      event_type: the event family of this row
      booking_reference: the booking cancelled
      charge_code: cancellation_fee on every row of this family
      amount_usd: the contracted event value at the moment of cancellation
      posted_date: the day the cancellation was registered
      event_date: the day the event was to have been held
      notice_given_date: the day the client gave written notice of cancellation
      guaranteed_headcount: the guest count standing at cancellation
    triggers:
      - event: banquet:banquet_cancellation_charge_posted
        map: {booking_reference: booking_reference, event_date: event_date, notice_given_date: notice_given_date, charge_code: cancellation_fee}
  - type: banquet_cancellation_charge_posted
    target: banquet_ledger
    meaning: a cancellation charge falls due on an event the client cancelled inside the charging window
    grain: one row per cancellation charge against one booking
    distinguish_by: [booking_reference, posted_date, amount_usd]
    fields:
      banquet_agreement_id: the agreement charged
      customer_id: the client charged
      event_type: the event family of this row
      booking_reference: the cancelled booking the charge answers
      charge_code: cancellation_fee on every row of this family
      amount_usd: the charge raised
      posted_date: the day the charge was raised
      event_date: the day the cancelled event was to have been held
      notice_given_date: the day written notice of cancellation was given
      invoice_reference: the bill the charge sits on
    account: event_receivable
    direction: in
    triggers:
      - event: banquet:banquet_deposit_applied
        map: {booking_reference: booking_reference, charge_code: deposit_application}
  - type: banquet_deposit_refunded
    target: banquet_ledger
    meaning: deposit money is returned to the client after a cancellation that carries no charge, or after a final bill leaves money over
    grain: one row per refund paid against one booking
    distinguish_by: [booking_reference, posted_date, amount_usd]
    fields:
      banquet_agreement_id: the agreement the deposit sat under
      customer_id: the client refunded
      event_type: the event family of this row
      booking_reference: the booking the deposit was held against
      charge_code: deposit_refund on every row of this family
      amount_usd: the deposit money returned
      posted_date: the day the refund was paid
      event_date: the day of the event concerned
      payment_channel: how the refund was paid
    account: deposit_held
    direction: out
    triggers: []
  - type: banquet_payment_posted
    target: banquet_ledger
    meaning: the client settles all or part of an event bill
    grain: one row per payment received against one bill
    distinguish_by: [invoice_reference, posted_date, payment_channel]
    fields:
      banquet_agreement_id: the agreement paid against
      customer_id: the client paying
      event_type: the event family of this row
      booking_reference: the booking the payment is allocated to
      charge_code: payment on every row of this family
      amount_usd: the amount received
      posted_date: the day the payment cleared
      invoice_reference: the bill settled
      payment_channel: how the client paid
    account: event_receivable
    direction: out
    triggers: []

measures:
  - id: banquet_msr_open_booking_count
    window: point in time on the day the booking is confirmed, across every event services agreement the same client holds
    measure: count of banquet_event_booked rows whose event_date has not yet passed and which have neither been delivered nor cancelled
  - id: banquet_msr_deposit_held_total
    window: point in time on the day the deposit movement is posted, across the whole agreement
    measure: sum of amount_usd over banquet_deposit_received rows less amount_usd over banquet_deposit_applied and banquet_deposit_refunded rows
  - id: banquet_msr_cancelled_events_12m
    window: the twelve calendar months ending on the day the cancellation is registered
    measure: count of banquet_booking_cancelled rows on this agreement

policies:
  - id: banquet_agg_multi_holding
    subject: [banquet_agreement_opened]
    rule: >
      A client may hold a private event and banquet services agreement at more than one venue, because each venue carries its own diary, its own room rental and its own licence.
      No client holds more than two event services agreements at once, counting every agreement that is proposed, active or on hold.
      Each agreement is written against exactly one venue, and every booking, deposit and bill belongs to the agreement its venue sits under.
      Where a client wants events at a third venue, those events are booked into whichever of the two existing agreements covers that venue's operating company rather than opened as a third agreement.
      A closed agreement does not count toward the ceiling, so a client who has closed an old venue agreement may open one at a new venue in its place.
    eligibility:
      - id: agreement_count_ceiling
        applies_to: [banquet_agreement_opened]
        kind: dedup
        condition: No client holds more than two event services agreements at once, counting every agreement that is proposed, active or on hold.
        evidence_fields: [banquet_agreements.customer_id, banquet_agreements.status, banquet_agreements.venue_code, banquet_agreements.banquet_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [banquet_agreements.customer_id, banquet_agreements.venue_code]
          action_bindings:
            banquet_agreements.customer_id: customer_id
            banquet_agreements.venue_code: venue_code
        dedup_contract:
          table: banquet_agreements
          mode: separate_record
          object_bindings: {customer_id: customer_id, venue_code: venue_code}
          duplicate_filters: {status: [proposed, active, on_hold]}
          distinct_fields: [agreement_start_date, variant_name]
    params: {max_per_customer: 2}
  - id: banquet_agg_deposit_and_diary_pooling
    subject: [banquet_event_booked, banquet_deposit_applied]
    rule: >
      Deposits and diary space are held at the level of the agreement rather than the single booking, and both are read across every booking the agreement carries.
      An agreement may carry no more than the number of confirmed unserved events printed against its package at any one time, counted across every venue date in the diary, and a further booking is offered the next available date instead.
      Money held on deposit is tracked booking by booking, and a deposit taken for one event is never applied to another event's bill without the client's written instruction; where such an instruction is on file, the transfer is recorded as an application on the first booking and a fresh deposit on the second.
      Where a final bill leaves deposit money over, the surplus is returned rather than carried forward, unless another booking on the same agreement is due inside thirty days and the client asks in writing for it to be carried.
      Deposits held against bookings that have neither been delivered nor cancelled are the client's money and are never set against arrears on another bill.
    eligibility: []
    params:
      carry_forward_window_days: 30
      per_tier:
        "Meeting Room Refreshment Package": {max_open_bookings: "=max_concurrent_bookings"}
        "Boardroom Reception Package": {max_open_bookings: "=max_concurrent_bookings"}
        "Conference Day Delegate Package": {max_open_bookings: "=max_concurrent_bookings"}
        "Seated Banquet Package": {max_open_bookings: "=max_concurrent_bookings"}
        "Gala Reception Package": {max_open_bookings: "=max_concurrent_bookings"}
        "Multi-Day Conference Residency Package": {max_open_bookings: "=max_concurrent_bookings"}
    measures: [banquet_msr_open_booking_count, banquet_msr_deposit_held_total]
  - id: banquet_agreement_terms
    subject: [banquet_agreement_opened, banquet_agreement_activated]
    rule: >
      An event services agreement is drawn up against one venue and one event package, and booking does not open until the agreement is countersigned.
      An agreement is only opened or activated while it stands proposed or already active, and a proposal that is withdrawn before countersignature closes without charge.
      Packages above the meeting room package require a signed agreement on file, and packages from the conference day package upward require a certificate of event insurance before any event is held, though not before the agreement is activated.
      The package the agreement is written against sets the whole parameter column that every booking under it takes — minimum spend, room rental, deposits, guarantee deadline, cancellation ladder and payment terms together.
      Where the client's expected number of events a year does not reach the minimum printed against the package applied for, the agreement is written at the highest package whose minimum the client does meet.
      A client may hold agreements at two venues on different packages, and a booking always takes the package of the agreement its venue sits under rather than the client's best package.
    eligibility:
      - id: agreement_state
        applies_to: [banquet_agreement_opened, banquet_agreement_activated]
        kind: state
        condition: An agreement is only opened or activated while it stands proposed or already active, and a proposal that is withdrawn before countersignature closes without charge.
        evidence_fields: [banquet_agreements.status, banquet_agreements.banquet_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [banquet_agreements.banquet_agreement_id]
          action_bindings:
            banquet_agreements.banquet_agreement_id: banquet_agreement_id
        state_contract:
          field: banquet_agreements.status
          allowed: [proposed, active]
    params:
      per_tier:
        "Meeting Room Refreshment Package": {term_months: "=agreement_term_months", min_events: "=min_annual_events", insurance_required: "=insurance_certificate_required"}
        "Boardroom Reception Package": {term_months: "=agreement_term_months", min_events: "=min_annual_events", insurance_required: "=insurance_certificate_required"}
        "Conference Day Delegate Package": {term_months: "=agreement_term_months", min_events: "=min_annual_events", insurance_required: "=insurance_certificate_required"}
        "Seated Banquet Package": {term_months: "=agreement_term_months", min_events: "=min_annual_events", insurance_required: "=insurance_certificate_required"}
        "Gala Reception Package": {term_months: "=agreement_term_months", min_events: "=min_annual_events", insurance_required: "=insurance_certificate_required"}
        "Multi-Day Conference Residency Package": {term_months: "=agreement_term_months", min_events: "=min_annual_events", insurance_required: "=insurance_certificate_required"}
  - id: banquet_booking_terms
    subject: [banquet_event_booked]
    rule: >
      An event is confirmed into the diary against a date, a venue, a room set-up and an estimated contracted value, and the estimate is what every deposit and cancellation percentage is later applied to until a guarantee replaces it.
      A booking is only taken on an agreement that stands active, since an agreement on hold has had booking stopped and a proposed agreement has not yet been countersigned.
      The event must reach the minimum food and beverage spend printed against the package and sit between the smallest and largest guest counts printed against it; an event above the largest guest count is quoted on the next package up rather than squeezed into this one.
      Room rental is charged at the rate printed against the package and is waived in full once food and beverage spend reaches the waiver threshold printed against the same package; a partial waiver is never given.
      A booking taken inside the booking lead time printed against the package is only confirmed where the kitchen and the room are both free, and where either is not, the next available date is offered rather than the event squeezed in.
      Events on declared peak dates carry the peak surcharge printed against the package, and events on published blackout dates are not booked at all.
      Where the client brings in an outside caterer or florist, the preferred vendor fee printed against the package is charged on that vendor's invoice, and on packages where the fee is zero no such fee is raised.
    eligibility:
      - id: bookable_state
        applies_to: [banquet_event_booked]
        kind: state
        condition: A booking is only taken on an agreement that stands active, since an agreement on hold has had booking stopped and a proposed agreement has not yet been countersigned.
        evidence_fields: [banquet_agreements.status, banquet_agreements.venue_code, banquet_agreements.banquet_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [banquet_agreements.banquet_agreement_id]
          action_bindings:
            banquet_agreements.banquet_agreement_id: banquet_agreement_id
        state_contract:
          field: banquet_agreements.status
          allowed: [active]
    params:
      per_tier:
        "Meeting Room Refreshment Package": {min_fb_usd: "=min_food_beverage_spend_usd", room_rental_usd: "=room_rental_usd", rental_waiver_usd: "=room_rental_waiver_spend_usd", lead_days: "=booking_lead_days", min_guests: "=min_guests", max_guests: "=max_guests", peak_pct: "=peak_date_surcharge_pct", vendor_fee_pct: "=preferred_vendor_fee_pct"}
        "Boardroom Reception Package": {min_fb_usd: "=min_food_beverage_spend_usd", room_rental_usd: "=room_rental_usd", rental_waiver_usd: "=room_rental_waiver_spend_usd", lead_days: "=booking_lead_days", min_guests: "=min_guests", max_guests: "=max_guests", peak_pct: "=peak_date_surcharge_pct", vendor_fee_pct: "=preferred_vendor_fee_pct"}
        "Conference Day Delegate Package": {min_fb_usd: "=min_food_beverage_spend_usd", room_rental_usd: "=room_rental_usd", rental_waiver_usd: "=room_rental_waiver_spend_usd", lead_days: "=booking_lead_days", min_guests: "=min_guests", max_guests: "=max_guests", peak_pct: "=peak_date_surcharge_pct", vendor_fee_pct: "=preferred_vendor_fee_pct"}
        "Seated Banquet Package": {min_fb_usd: "=min_food_beverage_spend_usd", room_rental_usd: "=room_rental_usd", rental_waiver_usd: "=room_rental_waiver_spend_usd", lead_days: "=booking_lead_days", min_guests: "=min_guests", max_guests: "=max_guests", peak_pct: "=peak_date_surcharge_pct", vendor_fee_pct: "=preferred_vendor_fee_pct"}
        "Gala Reception Package": {min_fb_usd: "=min_food_beverage_spend_usd", room_rental_usd: "=room_rental_usd", rental_waiver_usd: "=room_rental_waiver_spend_usd", lead_days: "=booking_lead_days", min_guests: "=min_guests", max_guests: "=max_guests", peak_pct: "=peak_date_surcharge_pct", vendor_fee_pct: "=preferred_vendor_fee_pct"}
        "Multi-Day Conference Residency Package": {min_fb_usd: "=min_food_beverage_spend_usd", room_rental_usd: "=room_rental_usd", rental_waiver_usd: "=room_rental_waiver_spend_usd", lead_days: "=booking_lead_days", min_guests: "=min_guests", max_guests: "=max_guests", peak_pct: "=peak_date_surcharge_pct", vendor_fee_pct: "=preferred_vendor_fee_pct"}
    measures: [banquet_msr_open_booking_count]
  - id: banquet_deposit_terms
    subject: [banquet_deposit_received, banquet_deposit_refunded]
    rule: >
      Deposits are taken in up to two instalments against the estimated contracted value of the event, at the percentages printed against the package.
      The first deposit is due no later than the deposit due window for the package, counted in calendar days from the day the booking is confirmed.
      Calendar days are counted from the day after the booking is confirmed, every day of the week counts, and a deposit paid on the boundary day itself is in time; calendar days are never converted into full 24-hour periods.
      The second deposit, where the package carries one, is due the number of calendar days before the event printed against the package, and a package whose second deposit percentage is zero takes no second deposit however large the event.
      A booking whose first deposit is not paid by the due day is released from the diary and the date offered to other clients, and the client is told before the date is released.
      Deposits are returnable in full where written notice of cancellation reaches Larkspur Table more than the refundable window printed against the package before the event date, and are not returnable at all inside that window, where they are set against the cancellation charge instead.
      A deposit is only taken or returned on an agreement that stands active or on hold, since a closed agreement holds no diary and a proposed agreement carries no bookings.
      Where the deposit held exceeds the cancellation charge, the difference is returned to the client rather than held on account.
    eligibility:
      - id: deposit_state
        applies_to: [banquet_deposit_received, banquet_deposit_refunded]
        kind: state
        condition: A deposit is only taken or returned on an agreement that stands active or on hold, since a closed agreement holds no diary and a proposed agreement carries no bookings.
        evidence_fields: [banquet_agreements.status, banquet_agreements.deposit_balance_usd, banquet_agreements.banquet_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [banquet_agreements.banquet_agreement_id]
          action_bindings:
            banquet_agreements.banquet_agreement_id: banquet_agreement_id
        state_contract:
          field: banquet_agreements.status
          allowed: [active, on_hold]
      - id: first_deposit_due
        applies_to: [banquet_deposit_received]
        kind: time
        condition: The first deposit is due no later than the deposit due window for the package, counted in calendar days from the day the booking is confirmed.
        evidence_fields: [banquet_ledger.posted_date, banquet_ledger.booking_reference, banquet_ledger.event_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [banquet_ledger.booking_reference]
          action_bindings:
            banquet_ledger.booking_reference: booking_reference
        temporal_basis:
          clock: frozen_time
          anchor_event: the day the booking is confirmed
          anchor_source: banquet_ledger.posted_date
          relation: not_after
          duration_source: variants.deposit_due_days_from_booking
          unit: calendar_days
          counting_rule: Calendar days are counted from the day after the booking is confirmed, every day of the week counts, and a deposit paid on the boundary day itself is in time; calendar days are never converted into full 24-hour periods.
          boundary: inclusive
    params:
      per_tier:
        "Meeting Room Refreshment Package": {first_pct: "=deposit_pct_of_estimate", first_due_days: "=deposit_due_days_from_booking", second_pct: "=second_deposit_pct", second_due_days_before: "=second_deposit_due_days_before_event", refundable_days_before: "=deposit_refundable_until_days_before"}
        "Boardroom Reception Package": {first_pct: "=deposit_pct_of_estimate", first_due_days: "=deposit_due_days_from_booking", second_pct: "=second_deposit_pct", second_due_days_before: "=second_deposit_due_days_before_event", refundable_days_before: "=deposit_refundable_until_days_before"}
        "Conference Day Delegate Package": {first_pct: "=deposit_pct_of_estimate", first_due_days: "=deposit_due_days_from_booking", second_pct: "=second_deposit_pct", second_due_days_before: "=second_deposit_due_days_before_event", refundable_days_before: "=deposit_refundable_until_days_before"}
        "Seated Banquet Package": {first_pct: "=deposit_pct_of_estimate", first_due_days: "=deposit_due_days_from_booking", second_pct: "=second_deposit_pct", second_due_days_before: "=second_deposit_due_days_before_event", refundable_days_before: "=deposit_refundable_until_days_before"}
        "Gala Reception Package": {first_pct: "=deposit_pct_of_estimate", first_due_days: "=deposit_due_days_from_booking", second_pct: "=second_deposit_pct", second_due_days_before: "=second_deposit_due_days_before_event", refundable_days_before: "=deposit_refundable_until_days_before"}
        "Multi-Day Conference Residency Package": {first_pct: "=deposit_pct_of_estimate", first_due_days: "=deposit_due_days_from_booking", second_pct: "=second_deposit_pct", second_due_days_before: "=second_deposit_due_days_before_event", refundable_days_before: "=deposit_refundable_until_days_before"}
    formula:
      first_deposit_usd: round(amount_usd * deposit_pct_of_estimate / 100, 2)
      second_deposit_usd: round(amount_usd * second_deposit_pct / 100, 2)
  - id: banquet_guarantee_terms
    subject: [banquet_guarantee_confirmed, banquet_event_delivered]
    rule: >
      The final guaranteed guest count must be given by the guarantee deadline printed against the package, measured in whole hours before the start of the event on the event date.
      Where no guarantee is given by the deadline, the working guest count standing on the booking becomes the guarantee, and the client is billed against it as though they had confirmed it.
      The kitchen sets and prepares above the guarantee by the overset percentage printed against the package, and those extra places are not charged unless they are used.
      Where fewer guests attend than were guaranteed, the event is billed on the guaranteed count at the shortfall percentage printed against the package, applied to the per-guest value of the contracted event.
      Where more guests attend than were guaranteed, every guest served is billed, and guests beyond the overset are billed at the same per-guest value without surcharge.
      A guarantee may be raised after the deadline where the kitchen can still buy the food, and it may never be lowered after the deadline.
      The attrition allowance printed against the package absorbs a shortfall against a contracted room or cover block before the shortfall percentage is applied, and a package whose allowance is small absorbs proportionately less.
      Security staff are required once the guaranteed count passes the threshold printed against the package, and are charged at the security rate printed against the same package for the hours the event runs.
    eligibility: []
    params:
      per_tier:
        "Meeting Room Refreshment Package": {deadline_hours: "=guarantee_deadline_hours", shortfall_pct: "=guarantee_shortfall_charge_pct", overset_pct: "=overset_pct_above_guarantee", attrition_pct: "=attrition_allowance_pct", security_above_guests: "=security_staff_required_above_guests", security_rate_usd: "=security_rate_per_hour_usd"}
        "Boardroom Reception Package": {deadline_hours: "=guarantee_deadline_hours", shortfall_pct: "=guarantee_shortfall_charge_pct", overset_pct: "=overset_pct_above_guarantee", attrition_pct: "=attrition_allowance_pct", security_above_guests: "=security_staff_required_above_guests", security_rate_usd: "=security_rate_per_hour_usd"}
        "Conference Day Delegate Package": {deadline_hours: "=guarantee_deadline_hours", shortfall_pct: "=guarantee_shortfall_charge_pct", overset_pct: "=overset_pct_above_guarantee", attrition_pct: "=attrition_allowance_pct", security_above_guests: "=security_staff_required_above_guests", security_rate_usd: "=security_rate_per_hour_usd"}
        "Seated Banquet Package": {deadline_hours: "=guarantee_deadline_hours", shortfall_pct: "=guarantee_shortfall_charge_pct", overset_pct: "=overset_pct_above_guarantee", attrition_pct: "=attrition_allowance_pct", security_above_guests: "=security_staff_required_above_guests", security_rate_usd: "=security_rate_per_hour_usd"}
        "Gala Reception Package": {deadline_hours: "=guarantee_deadline_hours", shortfall_pct: "=guarantee_shortfall_charge_pct", overset_pct: "=overset_pct_above_guarantee", attrition_pct: "=attrition_allowance_pct", security_above_guests: "=security_staff_required_above_guests", security_rate_usd: "=security_rate_per_hour_usd"}
        "Multi-Day Conference Residency Package": {deadline_hours: "=guarantee_deadline_hours", shortfall_pct: "=guarantee_shortfall_charge_pct", overset_pct: "=overset_pct_above_guarantee", attrition_pct: "=attrition_allowance_pct", security_above_guests: "=security_staff_required_above_guests", security_rate_usd: "=security_rate_per_hour_usd"}
    formula:
      billable_headcount: max(actual_headcount, round(guaranteed_headcount * guarantee_shortfall_charge_pct / 100, 0))
      prepared_headcount: round(guaranteed_headcount * (100 + overset_pct_above_guarantee) / 100, 0)
  - id: banquet_cancellation_terms
    subject: [banquet_booking_cancelled, banquet_cancellation_charge_posted]
    rule: >
      What a cancelled event costs is set by how much notice the client gave, measured in whole calendar days from the day the client gives written notice of cancellation to the event date on the booking.
      Notice at or beyond the free-cancellation days printed against the package carries no charge; notice between ninety and thirty days before the event carries the ninety-to-thirty percentage; notice between thirty and seven days carries the thirty-to-seven percentage; and notice inside seven days carries the within-seven-days percentage, each applied to the contracted event value standing at the moment notice is given.
      Where a package's free-cancellation days already fall inside one of those bands, the free window governs first and the band applies only to notice later than it.
      A cancellation charge is raised no later than the charge posting window, counted in calendar days from the day the client gives written notice of cancellation.
      Charge posting days are counted as calendar days from the day after written notice is given, every day of the week counts, and a charge raised on the boundary day itself is in time; calendar days are never converted into full 24-hour periods.
      Deposits held against the cancelled booking are set against the charge first, and only the balance is invoiced; where the deposit exceeds the charge the difference is returned.
      A client may move a confirmed event to another date rather than cancel it, up to the number of date moves printed against the package, paying the date change charge printed against the same package; a move beyond that number is treated as a cancellation on the ladder above and a fresh booking.
      An event cancelled by Larkspur Table — a venue closure, a licence withdrawn, a kitchen that cannot staff the date — carries no charge and every deposit is returned in full.
      Once an event has been delivered it can no longer be cancelled, and a complaint about it is settled as a goodwill adjustment on the final bill instead.
    eligibility:
