      service_charge_usd: round(amount_usd * service_charge_pct / 100, 2)
      gross_bill_usd: round(amount_usd + service_charge_usd + room_rental_usd + av_package_usd, 2)
    measures: [banquet_msr_deposit_held_total]
  - id: banquet_payment_terms
    subject: [banquet_payment_posted]
    rule: >
      An event bill falls due the number of days after the final bill date printed against the package, and a payment is recorded against the single bill it settles.
      A payment is accepted while the agreement stands active, on hold or closed, since settling arrears is exactly how a hold comes off and a closed agreement may still carry a balance.
      A part payment settles the named bill in part and never spills onto another bill; an overpayment leaves the excess on the agreement to be applied to the next bill raised.
      A late charge is the monthly late percentage printed against the package applied to the amount still outstanding once the grace days printed against the same package have passed, held to the late charge ceiling printed against that package.
      The client may dispute a final bill no later than the dispute window for the package, counted in calendar days from the day the final bill was raised.
      Dispute window days are counted as calendar days from the day after the bill was raised, every day of the week counts, and a dispute reaching Larkspur Table on the boundary day itself is in time; calendar days are never converted into full 24-hour periods.
      Once a bill is past due by the credit hold threshold printed against the package, booking stops on the agreement until the balance is settled.
    eligibility:
      - id: payable_state
        applies_to: [banquet_payment_posted]
        kind: state
        condition: A payment is accepted while the agreement stands active, on hold or closed, since settling arrears is exactly how a hold comes off and a closed agreement may still carry a balance.
        evidence_fields: [banquet_agreements.status, banquet_agreements.receivable_balance_usd, banquet_agreements.banquet_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [banquet_agreements.banquet_agreement_id]
          action_bindings:
            banquet_agreements.banquet_agreement_id: banquet_agreement_id
        state_contract:
          field: banquet_agreements.status
          allowed: [active, on_hold, closed]
      - id: dispute_window
        applies_to: [banquet_payment_posted]
        kind: time
        condition: The client may dispute a final bill no later than the dispute window for the package, counted in calendar days from the day the final bill was raised.
        evidence_fields: [banquet_ledger.posted_date, banquet_ledger.invoice_reference, banquet_ledger.booking_reference]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [banquet_ledger.invoice_reference]
          action_bindings:
            banquet_ledger.invoice_reference: invoice_reference
        temporal_basis:
          clock: frozen_time
          anchor_event: the day the final bill was raised
          anchor_source: banquet_ledger.posted_date
          relation: not_after
          duration_source: variants.billing_dispute_window_days
          unit: calendar_days
          counting_rule: Dispute window days are counted as calendar days from the day after the bill was raised, every day of the week counts, and a dispute reaching Larkspur Table on the boundary day itself is in time; calendar days are never converted into full 24-hour periods.
          boundary: inclusive
    params:
