        "Boardroom Reception Package": {terms_days: "=payment_terms_days", grace_days: "=late_fee_grace_days", late_pct: "=late_fee_monthly_pct", late_cap_usd: "=late_fee_cap_usd", hold_days: "=credit_hold_threshold_days_past_due", dispute_days: "=billing_dispute_window_days"}
        "Conference Day Delegate Package": {terms_days: "=payment_terms_days", grace_days: "=late_fee_grace_days", late_pct: "=late_fee_monthly_pct", late_cap_usd: "=late_fee_cap_usd", hold_days: "=credit_hold_threshold_days_past_due", dispute_days: "=billing_dispute_window_days"}
        "Seated Banquet Package": {terms_days: "=payment_terms_days", grace_days: "=late_fee_grace_days", late_pct: "=late_fee_monthly_pct", late_cap_usd: "=late_fee_cap_usd", hold_days: "=credit_hold_threshold_days_past_due", dispute_days: "=billing_dispute_window_days"}
        "Gala Reception Package": {terms_days: "=payment_terms_days", grace_days: "=late_fee_grace_days", late_pct: "=late_fee_monthly_pct", late_cap_usd: "=late_fee_cap_usd", hold_days: "=credit_hold_threshold_days_past_due", dispute_days: "=billing_dispute_window_days"}
