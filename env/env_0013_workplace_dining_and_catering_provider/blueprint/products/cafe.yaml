category: cafe
display_name: Workplace Cafe Management Program

binding:
  holding_table: cafe_contracts
  event_tables: [cafe_ledger]
  intake_tables: [cafe_service_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {subsidy_pool_balance_usd: subsidy_pool, receivable_balance_usd: receivable}

lifecycle:
  states: [proposed, mobilizing, active, suspended, in_transition_out, closed]
  transitions:
    - {from: proposed, to: mobilizing, by: agent, means: the client countersigns the contract and the opening project starts}
    - {from: mobilizing, to: active, by: system, means: the cafe opens to employees on its first service day}
    - {from: active, to: suspended, by: agent, means: service is paused at the client's instruction while the contract stands}
    - {from: suspended, to: active, by: agent, means: service resumes after a pause}
    - {from: active, to: in_transition_out, by: user, means: the client gives written notice of termination and the wind-down begins}
    - {from: suspended, to: in_transition_out, by: user, means: the client gives written notice of termination while service is paused}
    - {from: in_transition_out, to: closed, by: system, means: the final service day passes and the contract is settled out}
    - {from: proposed, to: closed, by: agent, means: the proposal is withdrawn or declined before countersignature}

accounts:
  - key: subsidy_pool
    unit: USD
    meaning: client money funded in advance to pay down employee meal prices at this cafe, drawn on as employees eat
  - key: receivable
    unit: USD
    meaning: amounts invoiced to the client under this contract and not yet settled

parameter_schema:
  min_annual_client_subsidy_usd: minimum annual meal subsidy the client commits to fund for this service model, in USD per contract year
  management_fee_monthly_usd: standard monthly management fee for the service model, in USD
  management_fee_basis: the commercial basis the fee is written on, one of profit_and_loss, fixed_fee or cost_plus
  admin_fee_pct_of_food_cost: administration fee charged on invoiced food cost, as a percentage
  operating_days_per_week: number of days per week the cafe serves, as a whole number
  meal_periods_served: number of meal periods served each operating day, as a whole number
  service_hours_per_day: hours of counter service per operating day, to one decimal place
  min_labor_fte: minimum culinary and service headcount staffed, in full-time equivalents to one decimal place
  labor_rate_per_fte_hour_usd: billed labour rate per full-time-equivalent hour, in USD
  menu_cycle_weeks: length of the published menu rotation, in whole weeks
  station_count: number of serving stations operated, as a whole number
  pos_terminal_count: number of till terminals installed, as a whole number
  mobile_order_enabled: whether mobile ordering ahead is included, true or false
  catering_from_cafe_enabled: whether catering may be ordered out of this cafe kitchen, true or false
  subsidy_model: how the client subsidy reaches the employee, one of none, percent_discount, fixed_per_meal or full
  subsidy_pct_of_menu_price: percentage of the menu price met by client subsidy under a percent_discount model
  subsidy_cap_per_employee_per_day_usd: ceiling on subsidy drawn for one employee on one service day, in USD
  subsidy_funding_minimum_usd: smallest single subsidy funding lot the client may pay in, in USD
  subsidy_funding_lot_expiry_months: months a funding lot stays drawable before it expires, in whole months
  subsidy_unused_rollover_pct: percentage of an expiring lot that rolls into the next funding lot rather than lapsing
  mobilization_fee_usd: one-off opening project fee for the service model, in USD
  mobilization_lead_days: calendar days of opening lead time required before service may commence
  equipment_deposit_usd: refundable equipment deposit held for the term, in USD
  smallwares_allowance_usd: annual smallwares replacement allowance included, in USD
  opening_inventory_usd: opening food and beverage inventory invested at commencement, in USD
  contract_term_months: standard initial term of the contract, in whole months
  renewal_notice_days: calendar days before term end by which renewal intentions must be exchanged
  termination_notice_days: calendar days of written notice required to terminate the contract
  early_termination_fee_months_of_fee: number of monthly management fees charged when the contract ends before term
  standby_fee_pct_of_management_fee: percentage of the monthly management fee charged for each month of suspended service
  max_suspension_days_per_contract_year: ceiling on suspended calendar days in one contract year
  min_suspension_days: shortest suspension the service model accepts, in calendar days
  resumption_lead_days: calendar days of notice needed to bring service back from suspension
  service_model_change_lead_days: calendar days of notice needed before a change of service model takes effect
  downgrade_cooldown_months: months that must pass after a change of service model before a downgrade is accepted
  service_model_change_fee_usd: administration fee charged for a change of service model, in USD
  price_increase_notice_days: calendar days of notice given before menu prices rise
  annual_price_escalation_pct: contractual annual escalation applied to the management fee, as a percentage
  invoice_cycle: how often the contract is invoiced, one of monthly or semimonthly
  payment_terms_days: calendar days from invoice date within which payment is due
  late_fee_monthly_pct: monthly late charge on an overdue invoice, as a percentage of the overdue amount
  late_fee_grace_days: calendar days past the due date before a late charge may be raised
  late_fee_cap_usd: ceiling on the late charge raised against one invoice, in USD
  credit_hold_threshold_days_past_due: days past due at which the contract is escalated for credit hold
  service_credit_pct_per_missed_meal_period: credit allowed for each missed meal period, as a percentage of the monthly management fee
  service_credit_cap_pct_of_monthly_fee: ceiling on service credits allowed in one billing period, as a percentage of the monthly management fee
  service_credit_claim_window_days: calendar days after the covering invoice within which a service credit claim is accepted
  guest_meal_surcharge_usd: surcharge added to a non-employee guest meal, in USD
  participation_guarantee_pct: participation rate the client guarantees for the service model, as a percentage of headcount
  participation_shortfall_fee_per_point_usd: charge for each whole percentage point of participation below the guarantee, in USD
  dietitian_hours_per_month: registered dietitian hours included each month, as a whole number
  allergen_program_level: depth of the allergen programme run at the cafe, one of standard, enhanced or dedicated
  waste_diversion_reporting_included: whether monthly waste diversion reporting is included, true or false
  portfolio_fee_discount_ladder: threshold ladder mapping the number of cafe contracts the client holds to the management fee discount percentage

