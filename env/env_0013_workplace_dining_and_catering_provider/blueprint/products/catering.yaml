  - id: catering_invoicing_terms
    subject: [catering_order_invoiced]
    rule: >
      How catering is invoiced follows the consolidation basis printed against the service level: a per-order basis raises one invoice for each delivered order, a weekly basis gathers the week's delivered orders onto one invoice, and a monthly basis gathers the month's onto one invoice raised on the invoice day printed against the service level.
      An order is only invoiced once it has been delivered, and an order cancelled before delivery is never invoiced as an order; any charge it carries is raised as a cancellation charge instead.
      The invoiced amount is the order value after the standing discount and the volume discount step the client's trailing ninety-day catering spend reaches, then the service charge, the delivery fee, any rush surcharge, any peak surcharge and any additional service hours, in that order.
      The standing discount and the volume discount are added together rather than the better of the two being taken, and neither is applied to the delivery fee, the rush surcharge or the peak surcharge.
      Where the client's purchase order reference is recorded on the agreement it is quoted on every invoice, and where the client asks for a different reference on one order that reference is carried on that order's invoice alone.
      A consolidated invoice that gathers orders delivered under two different service levels is not raised; each agreement is invoiced on its own basis.
    eligibility: []
    params:
      per_tier:
        "Drop-Off Catering Account": {consolidation: "=invoice_consolidation", cycle_day: "=invoice_cycle_day", standing_discount_pct: "=standing_discount_pct", volume_ladder: "=volume_discount_ladder"}
        "Delivered Buffet Account": {consolidation: "=invoice_consolidation", cycle_day: "=invoice_cycle_day", standing_discount_pct: "=standing_discount_pct", volume_ladder: "=volume_discount_ladder"}
        "Attended Buffet Account": {consolidation: "=invoice_consolidation", cycle_day: "=invoice_cycle_day", standing_discount_pct: "=standing_discount_pct", volume_ladder: "=volume_discount_ladder"}
        "Staffed Full-Service Catering Account": {consolidation: "=invoice_consolidation", cycle_day: "=invoice_cycle_day", standing_discount_pct: "=standing_discount_pct", volume_ladder: "=volume_discount_ladder"}
        "Executive Hospitality Catering Account": {consolidation: "=invoice_consolidation", cycle_day: "=invoice_cycle_day", standing_discount_pct: "=standing_discount_pct", volume_ladder: "=volume_discount_ladder"}
        "Campus Catering Master Account": {consolidation: "=invoice_consolidation", cycle_day: "=invoice_cycle_day", standing_discount_pct: "=standing_discount_pct", volume_ladder: "=volume_discount_ladder"}
    formula:
      discounted_food_usd: round(amount_usd * (100 - standing_discount_pct - volume_discount_ladder) / 100, 2)
      service_charge_usd: round(discounted_food_usd * service_charge_pct / 100, 2)
      invoice_total_usd: round(discounted_food_usd + service_charge_usd + delivery_fee_usd, 2)
    measures: [catering_msr_spend_trailing_90d]
  - id: catering_payment_terms
    subject: [catering_order_payment_posted]
    rule: >
      Catering invoices fall due the number of days after the invoice date printed against the service level, and a payment is recorded against the single invoice it settles.
      A payment is accepted on an agreement that stands active, on credit hold or closed, because a client settling arrears is exactly how a hold is lifted and a closed agreement may still carry a balance.
      A payment that clears the whole unsettled balance on an agreement standing on credit hold is the trigger for the hold to be reviewed, and ordering reopens once the review is done rather than automatically on receipt.
      A part payment settles the named invoice in part and never spills onto another invoice; an overpayment leaves the excess on the agreement to be applied to the next invoice raised.
      A late charge is the monthly late percentage printed against the service level applied to the amount still outstanding once the grace days printed against the same service level have passed, held to the late charge ceiling printed against that service level.
      Where an invoice is disputed in writing before the grace days expire, no late charge is raised while the dispute stands open, and the due date is not moved.
    eligibility:
      - id: payable_state
        applies_to: [catering_order_payment_posted]
        kind: state
        condition: A payment is accepted on an agreement that stands active, on credit hold or closed, because a client settling arrears is exactly how a hold is lifted and a closed agreement may still carry a balance.
        evidence_fields: [catering_agreements.status, catering_agreements.receivable_balance_usd, catering_agreements.catering_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [catering_agreements.catering_agreement_id]
          action_bindings:
            catering_agreements.catering_agreement_id: catering_agreement_id
        state_contract:
          field: catering_agreements.status
          allowed: [active, credit_hold, closed]
    params:
      per_tier:
        "Drop-Off Catering Account": {terms_days: "=payment_terms_days", grace_days: "=late_fee_grace_days", late_pct: "=late_fee_monthly_pct", late_cap_usd: "=late_fee_cap_usd"}
        "Delivered Buffet Account": {terms_days: "=payment_terms_days", grace_days: "=late_fee_grace_days", late_pct: "=late_fee_monthly_pct", late_cap_usd: "=late_fee_cap_usd"}
        "Attended Buffet Account": {terms_days: "=payment_terms_days", grace_days: "=late_fee_grace_days", late_pct: "=late_fee_monthly_pct", late_cap_usd: "=late_fee_cap_usd"}
        "Staffed Full-Service Catering Account": {terms_days: "=payment_terms_days", grace_days: "=late_fee_grace_days", late_pct: "=late_fee_monthly_pct", late_cap_usd: "=late_fee_cap_usd"}
        "Executive Hospitality Catering Account": {terms_days: "=payment_terms_days", grace_days: "=late_fee_grace_days", late_pct: "=late_fee_monthly_pct", late_cap_usd: "=late_fee_cap_usd"}
        "Campus Catering Master Account": {terms_days: "=payment_terms_days", grace_days: "=late_fee_grace_days", late_pct: "=late_fee_monthly_pct", late_cap_usd: "=late_fee_cap_usd"}
  - id: catering_service_credit_terms
    subject: [catering_service_credit_issued]
    rule: >
      Where catering arrives late or falls short of what was ordered, the client is credited against the invoice for that order rather than refunded separately.
      Lateness is measured from the service start time on the order to the time the team actually began service, and each complete quarter hour late earns the percentage of order value printed against the service level.
      An upheld food quality complaint earns the quality credit percentage printed against the service level, and where an order is both late and short the two credits are added together rather than the larger being taken alone.
      Credits against one order are held to the ceiling printed against the service level, and a claim worth more than the ceiling is settled at the ceiling and closed rather than carried onto the next order.
      A credit is allowed only when the claim reaches Larkspur Table no later than the claim window for the service level, counted in calendar days from the day the order was delivered.
      Claim window days are counted as calendar days from the day after delivery, every day of the week counts, and a claim arriving on the boundary day itself is still in time; calendar days are never converted into full 24-hour periods.
      Lateness caused by the client — a room that was not free, a security desk that held the team, a delivery address changed on the day — is not a late delivery for this purpose and earns no credit.
      A credit is never allowed against an order that was cancelled and never delivered, since no service was given to fall short of.
    eligibility:
      - id: credit_claim_window
        applies_to: [catering_service_credit_issued]
        kind: time
        condition: A credit is allowed only when the claim reaches Larkspur Table no later than the claim window for the service level, counted in calendar days from the day the order was delivered.
        evidence_fields: [catering_orders.posted_date, catering_orders.order_reference, catering_orders.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [catering_orders.order_reference]
          action_bindings:
            catering_orders.order_reference: order_reference
        temporal_basis:
          clock: frozen_time
          anchor_event: the day the order was delivered
          anchor_source: catering_orders.posted_date
          relation: not_after
          duration_source: variants.service_credit_claim_window_days
          unit: calendar_days
          counting_rule: Claim window days are counted as calendar days from the day after delivery, every day of the week counts, and a claim arriving on the boundary day itself is still in time; calendar days are never converted into full 24-hour periods.
          boundary: inclusive
    params:
      per_tier:
        "Drop-Off Catering Account": {late_pct_per_quarter_hour: "=service_credit_late_delivery_pct_per_15min", quality_pct: "=quality_credit_pct", order_cap_pct: "=service_credit_cap_pct_of_order", claim_window_days: "=service_credit_claim_window_days"}
        "Delivered Buffet Account": {late_pct_per_quarter_hour: "=service_credit_late_delivery_pct_per_15min", quality_pct: "=quality_credit_pct", order_cap_pct: "=service_credit_cap_pct_of_order", claim_window_days: "=service_credit_claim_window_days"}
        "Attended Buffet Account": {late_pct_per_quarter_hour: "=service_credit_late_delivery_pct_per_15min", quality_pct: "=quality_credit_pct", order_cap_pct: "=service_credit_cap_pct_of_order", claim_window_days: "=service_credit_claim_window_days"}
        "Staffed Full-Service Catering Account": {late_pct_per_quarter_hour: "=service_credit_late_delivery_pct_per_15min", quality_pct: "=quality_credit_pct", order_cap_pct: "=service_credit_cap_pct_of_order", claim_window_days: "=service_credit_claim_window_days"}
        "Executive Hospitality Catering Account": {late_pct_per_quarter_hour: "=service_credit_late_delivery_pct_per_15min", quality_pct: "=quality_credit_pct", order_cap_pct: "=service_credit_cap_pct_of_order", claim_window_days: "=service_credit_claim_window_days"}
        "Campus Catering Master Account": {late_pct_per_quarter_hour: "=service_credit_late_delivery_pct_per_15min", quality_pct: "=quality_credit_pct", order_cap_pct: "=service_credit_cap_pct_of_order", claim_window_days: "=service_credit_claim_window_days"}
    formula:
      order_ceiling_usd: round(amount_usd * service_credit_cap_pct_of_order / 100, 2)
      quality_credit_usd: round(amount_usd * quality_credit_pct / 100, 2)
  - id: catering_hold_and_closure_terms
    subject: [catering_agreement_placed_on_hold, catering_agreement_reinstated, catering_agreement_closed]
    rule: >
      A credit hold is applied by the system when exposure or arrears cross the limit, and it is lifted only after a review that the desk performs once the balance has been settled or the limit formally raised.
      A hold, a reinstatement or a closure is only worked while the agreement stands active, on credit hold or closed, and never while it is still in credit review, where the application is withdrawn instead.
      Only the client may end a catering agreement, and the desk records the request for the client to confirm rather than closing the agreement on their word alone.
      Notice to end the agreement is the number of calendar days printed against the service level, and orders already accepted for service days inside the notice period are served rather than cancelled.
      An agreement is not closed while any order stands accepted and unserved; those orders are served or cancelled on the ordinary cancellation terms first, and the agreement closes once none remain.
      Where the client's annual spend for the agreement year has not reached the minimum printed against the service level, the shortfall is settled on the final invoice rather than waived at closure.
      A closed agreement keeps its invoices, credits and history, and a client returning later opens a fresh agreement rather than reviving the closed one.
    eligibility:
      - id: lifecycle_state
        applies_to: [catering_agreement_placed_on_hold, catering_agreement_reinstated, catering_agreement_closed]
        kind: state
        condition: A hold, a reinstatement or a closure is only worked while the agreement stands active, on credit hold or closed, and never while it is still in credit review, where the application is withdrawn instead.
        evidence_fields: [catering_agreements.status, catering_agreements.catering_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [catering_agreements.catering_agreement_id]
          action_bindings:
            catering_agreements.catering_agreement_id: catering_agreement_id
        state_contract:
          field: catering_agreements.status
          allowed: [active, credit_hold, closed]
    params:
      per_tier:
        "Drop-Off Catering Account": {notice_days: "=agreement_notice_days", min_annual_spend_usd: "=min_annual_spend_usd", term_months: "=agreement_term_months"}
        "Delivered Buffet Account": {notice_days: "=agreement_notice_days", min_annual_spend_usd: "=min_annual_spend_usd", term_months: "=agreement_term_months"}
        "Attended Buffet Account": {notice_days: "=agreement_notice_days", min_annual_spend_usd: "=min_annual_spend_usd", term_months: "=agreement_term_months"}
        "Staffed Full-Service Catering Account": {notice_days: "=agreement_notice_days", min_annual_spend_usd: "=min_annual_spend_usd", term_months: "=agreement_term_months"}
        "Executive Hospitality Catering Account": {notice_days: "=agreement_notice_days", min_annual_spend_usd: "=min_annual_spend_usd", term_months: "=agreement_term_months"}
        "Campus Catering Master Account": {notice_days: "=agreement_notice_days", min_annual_spend_usd: "=min_annual_spend_usd", term_months: "=agreement_term_months"}
  - id: catering_combination_cafe_interaction
    subject: [catering_order_placed, catering_order_invoiced]
    rule: >
      What a client holds elsewhere in the dining programme changes what a catering order costs and where it may be sent.
      Where the same client holds an active workplace cafe management contract whose service model permits catering out of the cafe kitchen, and the delivery site on the order is that cafe's site, the delivery fee is not charged because the food does not leave the building.
      Where that cafe contract does not permit catering out of its kitchen, the order is produced at the district kitchen and the ordinary delivery fee applies however close the cafe is.
      Where the same client holds an active private event and banquet agreement at the delivery site, an order whose guest count exceeds the largest guest count printed against the catering service level is placed as an event booking on that agreement instead, and the two are never run as one order.
      A catering agreement and an unattended micro market at the same site sit side by side without interaction, since a market sells to employees rather than to the client.
      Where the cafe contract at the delivery site stands suspended, catering out of that kitchen stops with it and orders are produced at the district kitchen at the ordinary delivery fee until service resumes.
    eligibility: []
    params:
      per_tier:
        "Drop-Off Catering Account": {delivery_fee_waived_with_cafe: true, escalate_to_banquet_above_guests: "=max_headcount"}
        "Delivered Buffet Account": {delivery_fee_waived_with_cafe: true, escalate_to_banquet_above_guests: "=max_headcount"}
        "Attended Buffet Account": {delivery_fee_waived_with_cafe: true, escalate_to_banquet_above_guests: "=max_headcount"}
        "Staffed Full-Service Catering Account": {delivery_fee_waived_with_cafe: true, escalate_to_banquet_above_guests: "=max_headcount"}
        "Executive Hospitality Catering Account": {delivery_fee_waived_with_cafe: false, escalate_to_banquet_above_guests: "=max_headcount"}
        "Campus Catering Master Account": {delivery_fee_waived_with_cafe: true, escalate_to_banquet_above_guests: "=max_headcount"}
