events:
  - type: catering_agreement_opened
    target: catering_agreements
    mutation: create
    meaning: a corporate catering service agreement is opened for a client and sent for credit review
    grain: one row per catering service agreement held by a client
    fields:
      customer_id: the client organisation that will hold the agreement
      variant_name: the catering service level applied for
      status: the agreement opens in the pending_credit_review state
      client_account_code: the client account code the agreement bills under
      agreement_start_date: first day of the proposed term
      agreement_end_date: last day of the proposed term
      credit_limit_usd: the exposure limit proposed for the service level
      delivery_site_code: the default delivery site named on the agreement
      billing_contact_email: where catering invoices will be sent
      purchase_order_reference: the client's purchase order reference, when they use one
      standing_discount_pct: the standing discount negotiated on menu prices
      receivable_balance_usd: opening unsettled balance, zero on a new agreement
    triggers: []
  - type: catering_agreement_activated
    target: catering_agreements
    mutation: {transition: {from: pending_credit_review, to: active}}
    meaning: credit review clears and the client may start placing catering orders
    grain: one row per agreement, on the day ordering opens
    fields:
      status: the agreement moves into active
      activated_date: the day ordering opened
    triggers: []
  - type: catering_agreement_placed_on_hold
    target: catering_agreements
    mutation: {transition: {from: active, to: credit_hold}}
    meaning: exposure or arrears cross the agreement's limit and no further orders are taken
    grain: one row per agreement, on the day the hold is applied
    fields:
      status: the agreement moves into credit_hold
      credit_hold_date: the day the hold was applied
    triggers: []
  - type: catering_agreement_reinstated
    target: catering_agreements
    mutation: {transition: {from: credit_hold, to: active}}
    meaning: the balance is settled or the limit raised and ordering reopens
    grain: one row per agreement, on the day the hold is lifted
    fields:
      status: the agreement moves back into active
      credit_hold_date: cleared once the hold is lifted
      credit_limit_usd: the exposure limit in force after the review
    triggers: []
  - type: catering_agreement_closed
    target: catering_agreements
    mutation: {transition: [{from: active, to: closed}, {from: credit_hold, to: closed}, {from: pending_credit_review, to: closed}]}
    meaning: the catering agreement ends and no further orders are taken under it
    grain: one row per agreement, on the day it closes
    fields:
      status: the agreement moves into closed
      closed_date: the day the agreement closed
    triggers: []
  - type: catering_order_placed
    target: catering_orders
    meaning: the client orders catering for a date, a guest count and a menu package
    grain: one row per catering order accepted
    distinguish_by: [order_reference, service_date, service_start_time]
    fields:
      catering_agreement_id: the agreement the order is placed under
      customer_id: the client ordering
      event_type: the event family of this row
      order_reference: the order this row opens
      charge_code: order_total on every row of this family
      amount_usd: the quoted value of the order
      posted_date: the day the order was accepted
      service_date: the day the catering is to be served
      service_start_time: the time service is to begin
      headcount: the guest count the order is priced on
      menu_package: the menu package ordered
      delivery_site_code: where the order is to be delivered
      order_channel: how the order reached Larkspur Table
      payment_channel: not_applicable while nothing has been tendered
    triggers: []
  - type: catering_order_amended
    target: catering_orders
    meaning: the client changes the guest count, the menu or the timing of an order already placed
    grain: one row per amendment accepted against one order
    distinguish_by: [order_reference, notice_given_date, headcount]
    fields:
      catering_agreement_id: the agreement the order sits under
      customer_id: the client amending
      event_type: the event family of this row
      order_reference: the order being amended
      charge_code: amendment on every row of this family
      amount_usd: the revised value of the order after the amendment
      posted_date: the day the amendment was accepted
      service_date: the service day after the amendment
      service_start_time: the service time after the amendment
      headcount: the guest count after the amendment
      menu_package: the menu package after the amendment
      notice_given_date: the day the client asked for the change
      order_channel: how the amendment reached Larkspur Table
    triggers: []
  - type: catering_order_cancelled
    target: catering_orders
    meaning: the client cancels an order that has not been served
    grain: one row per cancellation of one order
    distinguish_by: [order_reference, notice_given_date]
    fields:
      catering_agreement_id: the agreement the order sits under
      customer_id: the client cancelling
      event_type: the event family of this row
      order_reference: the order being cancelled
      charge_code: cancellation_fee on every row of this family
      amount_usd: the value of the order at the moment of cancellation
      posted_date: the day the cancellation was registered
      service_date: the day the order was to have been served
      service_start_time: the time service was to have begun
      headcount: the guest count the order stood at
      notice_given_date: the day the client gave notice of the cancellation
      order_channel: how the cancellation reached Larkspur Table
    triggers:
      - event: catering:catering_cancellation_fee_posted
        map: {order_reference: order_reference, service_date: service_date, notice_given_date: notice_given_date, charge_code: cancellation_fee}
  - type: catering_order_delivered
    target: catering_orders
    meaning: the order is delivered or served and the service is complete
    grain: one row per delivery of one order
    distinguish_by: [order_reference, posted_date, headcount]
    fields:
      catering_agreement_id: the agreement the order sits under
      customer_id: the client served
      event_type: the event family of this row
      order_reference: the order delivered
      charge_code: delivery_confirmation on every row of this family
      amount_usd: the value delivered
      posted_date: the day delivery was confirmed
      service_date: the service day
      service_start_time: the time the team actually began service
      headcount: the guest count actually served
      delivery_site_code: where the order was delivered
    triggers:
      - event: catering:catering_order_invoiced
        map: {order_reference: order_reference, service_date: service_date, charge_code: invoice}
  - type: catering_order_invoiced
    target: catering_orders
    meaning: an invoice is raised for a delivered order, alone or consolidated with others in the period
    grain: one row per order billed, on one invoice
    distinguish_by: [order_reference, invoice_reference, posted_date]
    fields:
      catering_agreement_id: the agreement invoiced
      customer_id: the client invoiced
      event_type: the event family of this row
      order_reference: the order being billed
      charge_code: invoice on every row of this family
      amount_usd: the amount invoiced for the order
      posted_date: the day the invoice was raised
      service_date: the service day the invoice covers
      invoice_reference: the invoice the order sits on
      payment_channel: not_applicable while nothing has been tendered
    account: order_receivable
    direction: in
    triggers: []
  - type: catering_cancellation_fee_posted
    target: catering_orders
    meaning: a cancellation charge falls due on an order the client cancelled inside the notice window
    grain: one row per cancellation charge against one order
    distinguish_by: [order_reference, posted_date, amount_usd]
    fields:
      catering_agreement_id: the agreement charged
      customer_id: the client charged
      event_type: the event family of this row
      order_reference: the cancelled order the charge answers
      charge_code: cancellation_fee on every row of this family
      amount_usd: the charge raised
      posted_date: the day the charge was raised
      service_date: the day the cancelled order was to have been served
      notice_given_date: the day notice of the cancellation was given
      invoice_reference: the invoice the charge sits on
    account: order_receivable
    direction: in
    triggers: []
  - type: catering_order_payment_posted
    target: catering_orders
    meaning: the client settles all or part of a catering invoice
    grain: one row per payment received against one invoice
    distinguish_by: [invoice_reference, posted_date, payment_channel]
    fields:
      catering_agreement_id: the agreement paid against
      customer_id: the client paying
      event_type: the event family of this row
      order_reference: the order the payment is allocated to
      charge_code: payment on every row of this family
      amount_usd: the amount received
      posted_date: the day the payment cleared
      invoice_reference: the invoice settled
      payment_channel: how the client paid
    account: order_receivable
    direction: out
    triggers: []
  - type: catering_service_credit_issued
    target: catering_orders
    meaning: a credit is allowed against an order because it arrived late or fell short of the standard ordered
    grain: one row per credit allowed against one order
    distinguish_by: [order_reference, charge_code, posted_date]
    fields:
      catering_agreement_id: the agreement credited
      customer_id: the client credited
      event_type: the event family of this row
      order_reference: the order credited
      charge_code: service_credit on every row of this family
      amount_usd: the credit allowed
      posted_date: the day the credit was allowed
      service_date: the service day the credit relates to
      invoice_reference: the invoice credited
      headcount: the guest count the order stood at
    account: order_receivable
    direction: out
    triggers: []

measures:
  - id: catering_msr_open_order_value
    window: point in time on the day the order is accepted, across every catering agreement the same client holds
    measure: sum of amount_usd over catering_order_placed rows whose service_date has not yet passed and which have neither been delivered nor cancelled
  - id: catering_msr_spend_trailing_90d
    window: the ninety calendar days ending on the day before the order is accepted
    measure: sum of amount_usd over catering_order_invoiced rows on this agreement
  - id: catering_msr_cancellations_rolling_12m
    window: the twelve calendar months ending on the day the cancellation is registered
    measure: count of catering_order_cancelled rows on this agreement whose notice_given_date falls inside the chargeable notice window

policies:
  - id: catering_agg_multi_holding
    subject: [catering_agreement_opened]
    rule: >
      A client may hold more than one corporate catering service agreement, because a group with separate operating companies or separate delivery cities is billed and credit-reviewed separately.
      No client holds more than four catering service agreements at once, counting every agreement that is pending credit review, active or on credit hold.
      Each agreement is written against one default delivery site and one client account code, and orders, invoices and credit exposure belong to the agreement they were placed under.
      Where a client asks for a fifth agreement, the request is declined and the nearest existing agreement is extended to cover the additional site instead.
      A closed agreement does not count toward the ceiling, so a client who has closed an old agreement may open a fresh one in its place.
    eligibility:
      - id: agreement_count_ceiling
        applies_to: [catering_agreement_opened]
        kind: dedup
        condition: No client holds more than four catering service agreements at once, counting every agreement that is pending credit review, active or on credit hold.
        evidence_fields: [catering_agreements.customer_id, catering_agreements.status, catering_agreements.catering_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [catering_agreements.customer_id]
          action_bindings:
            catering_agreements.customer_id: customer_id
        dedup_contract:
          table: catering_agreements
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [pending_credit_review, active, credit_hold]}
          distinct_fields: [delivery_site_code, client_account_code, agreement_start_date]
    params: {max_per_customer: 4}
  - id: catering_agg_credit_exposure
    subject: [catering_order_placed, catering_agreement_placed_on_hold]
    rule: >
      Credit exposure is judged across everything the client has on the books, not on the single order being placed.
      Exposure is the unsettled invoiced balance on the agreement plus the value of every order already accepted whose service day has not yet passed and which has neither been delivered nor cancelled.
      An order is accepted while exposure after the order stays within the credit limit printed against the service level; an order that would carry exposure past the limit is held for the client to settle, part-pay or reduce.
      Where open orders alone reach the open-order multiple of the credit limit printed against the service level, the agreement is put on credit hold even though nothing is overdue, because the kitchen commitment alone is the risk.
      An agreement is only put on credit hold while it stands active or already on credit hold, and an agreement still in credit review is declined rather than held.
      Where a client holds more than one catering agreement, exposure is measured on each agreement separately and never pooled, since each carries its own limit.
      Once a hold is on, no order is accepted, no amendment that raises order value is accepted, and orders already in the kitchen for the next service day are served rather than cancelled.
    eligibility:
      - id: hold_state
        applies_to: [catering_agreement_placed_on_hold]
        kind: state
        condition: An agreement is only put on credit hold while it stands active or already on credit hold, and an agreement still in credit review is declined rather than held.
        evidence_fields: [catering_agreements.status, catering_agreements.receivable_balance_usd, catering_agreements.credit_limit_usd, catering_agreements.catering_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [catering_agreements.catering_agreement_id]
          action_bindings:
            catering_agreements.catering_agreement_id: catering_agreement_id
        state_contract:
          field: catering_agreements.status
          allowed: [active, credit_hold]
    params:
      per_tier:
        "Drop-Off Catering Account": {limit_usd: "=credit_limit_usd", open_order_multiple: "=credit_hold_open_order_multiple", max_open_orders: "=max_open_orders"}
        "Delivered Buffet Account": {limit_usd: "=credit_limit_usd", open_order_multiple: "=credit_hold_open_order_multiple", max_open_orders: "=max_open_orders"}
        "Attended Buffet Account": {limit_usd: "=credit_limit_usd", open_order_multiple: "=credit_hold_open_order_multiple", max_open_orders: "=max_open_orders"}
        "Staffed Full-Service Catering Account": {limit_usd: "=credit_limit_usd", open_order_multiple: "=credit_hold_open_order_multiple", max_open_orders: "=max_open_orders"}
        "Executive Hospitality Catering Account": {limit_usd: "=credit_limit_usd", open_order_multiple: "=credit_hold_open_order_multiple", max_open_orders: "=max_open_orders"}
        "Campus Catering Master Account": {limit_usd: "=credit_limit_usd", open_order_multiple: "=credit_hold_open_order_multiple", max_open_orders: "=max_open_orders"}
    measures: [catering_msr_open_order_value]
  - id: catering_onboarding_terms
    subject: [catering_agreement_opened, catering_agreement_activated]
    rule: >
      A catering agreement is opened against the service level whose entry gate the client meets on annual spend commitment and largest guest count, and ordering does not open until credit review is complete.
      Credit review takes the number of working days printed against the service level, and an agreement is only opened or activated while it stands in credit review or already active.
      Service levels above the drop-off level require a signed master agreement on file before ordering opens, and an application without one stays in credit review rather than being activated.
      The standing discount recorded on the agreement is the discount printed against the service level unless a larger one was separately negotiated and written onto the agreement, in which case the written figure governs.
      Where the client's declared annual spend does not reach the commitment printed against the service level applied for, the agreement is opened at the highest service level whose commitment the client does meet.
      An application withdrawn or declined during credit review closes without charge and without any minimum spend falling due.
    eligibility:
      - id: onboarding_state
        applies_to: [catering_agreement_opened, catering_agreement_activated]
        kind: state
        condition: Credit review takes the number of working days printed against the service level, and an agreement is only opened or activated while it stands in credit review or already active.
        evidence_fields: [catering_agreements.status, catering_agreements.catering_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [catering_agreements.catering_agreement_id]
          action_bindings:
            catering_agreements.catering_agreement_id: catering_agreement_id
        state_contract:
          field: catering_agreements.status
          allowed: [pending_credit_review, active]
    params:
      per_tier:
        "Drop-Off Catering Account": {review_days: "=credit_review_days", min_annual_spend_usd: "=min_annual_spend_usd", term_months: "=agreement_term_months", standing_discount_pct: "=standing_discount_pct"}
        "Delivered Buffet Account": {review_days: "=credit_review_days", min_annual_spend_usd: "=min_annual_spend_usd", term_months: "=agreement_term_months", standing_discount_pct: "=standing_discount_pct"}
        "Attended Buffet Account": {review_days: "=credit_review_days", min_annual_spend_usd: "=min_annual_spend_usd", term_months: "=agreement_term_months", standing_discount_pct: "=standing_discount_pct"}
        "Staffed Full-Service Catering Account": {review_days: "=credit_review_days", min_annual_spend_usd: "=min_annual_spend_usd", term_months: "=agreement_term_months", standing_discount_pct: "=standing_discount_pct"}
        "Executive Hospitality Catering Account": {review_days: "=credit_review_days", min_annual_spend_usd: "=min_annual_spend_usd", term_months: "=agreement_term_months", standing_discount_pct: "=standing_discount_pct"}
        "Campus Catering Master Account": {review_days: "=credit_review_days", min_annual_spend_usd: "=min_annual_spend_usd", term_months: "=agreement_term_months", standing_discount_pct: "=standing_discount_pct"}
  - id: catering_order_intake_terms
    subject: [catering_order_placed]
    rule: >
      An order is accepted against the published lead time for the service level, measured in whole hours from the moment the order reaches Larkspur Table to the service start time on the service date.
      An order placed at or beyond the standard lead time carries no rush surcharge; an order placed inside the standard lead time but at or beyond the shortest accepted notice carries the rush percentage printed against the service level on the order value; an order placed inside the shortest accepted notice is declined outright and no rush surcharge can buy it in.
      An order is only taken on an agreement that stands active, and an agreement in credit review, on credit hold or closed takes no orders at all.
      The order must reach the minimum order value printed against the service level and sit between the smallest and largest guest counts printed against it; an order below the minimum value is offered at the minimum value rather than declined, while an order above the largest guest count is referred to the private event and banquet desk.
      Orders taken by telephone carry the telephone surcharge printed against the service level, and the same order placed through the client ordering portal does not; a service level whose portal is not enabled carries no telephone surcharge at all because telephone is its ordinary channel.
      Orders served in the declared peak weeks carry the peak surcharge printed against the service level, and orders falling on a published blackout day are not taken in any channel.
      Allergen and dietary meals must be asked for at least the dietary lead hours printed against the service level before service, and a dietary request made later than that is answered with the standard menu rather than a built meal.
    eligibility:
      - id: orderable_state
        applies_to: [catering_order_placed]
        kind: state
        condition: An order is only taken on an agreement that stands active, and an agreement in credit review, on credit hold or closed takes no orders at all.
        evidence_fields: [catering_agreements.status, catering_agreements.catering_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [catering_agreements.catering_agreement_id]
          action_bindings:
            catering_agreements.catering_agreement_id: catering_agreement_id
        state_contract:
          field: catering_agreements.status
          allowed: [active]
    params:
      per_tier:
        "Drop-Off Catering Account": {lead_hours: "=standard_lead_time_hours", rush_hours: "=rush_lead_time_hours", rush_pct: "=rush_fee_pct_of_order", min_value_usd: "=min_order_value_usd", min_guests: "=min_headcount", max_guests: "=max_headcount", phone_surcharge_usd: "=order_channel_phone_surcharge_usd", peak_pct: "=peak_season_surcharge_pct"}
        "Delivered Buffet Account": {lead_hours: "=standard_lead_time_hours", rush_hours: "=rush_lead_time_hours", rush_pct: "=rush_fee_pct_of_order", min_value_usd: "=min_order_value_usd", min_guests: "=min_headcount", max_guests: "=max_headcount", phone_surcharge_usd: "=order_channel_phone_surcharge_usd", peak_pct: "=peak_season_surcharge_pct"}
        "Attended Buffet Account": {lead_hours: "=standard_lead_time_hours", rush_hours: "=rush_lead_time_hours", rush_pct: "=rush_fee_pct_of_order", min_value_usd: "=min_order_value_usd", min_guests: "=min_headcount", max_guests: "=max_headcount", phone_surcharge_usd: "=order_channel_phone_surcharge_usd", peak_pct: "=peak_season_surcharge_pct"}
        "Staffed Full-Service Catering Account": {lead_hours: "=standard_lead_time_hours", rush_hours: "=rush_lead_time_hours", rush_pct: "=rush_fee_pct_of_order", min_value_usd: "=min_order_value_usd", min_guests: "=min_headcount", max_guests: "=max_headcount", phone_surcharge_usd: "=order_channel_phone_surcharge_usd", peak_pct: "=peak_season_surcharge_pct"}
        "Executive Hospitality Catering Account": {lead_hours: "=standard_lead_time_hours", rush_hours: "=rush_lead_time_hours", rush_pct: "=rush_fee_pct_of_order", min_value_usd: "=min_order_value_usd", min_guests: "=min_headcount", max_guests: "=max_headcount", phone_surcharge_usd: "=order_channel_phone_surcharge_usd", peak_pct: "=peak_season_surcharge_pct"}
        "Campus Catering Master Account": {lead_hours: "=standard_lead_time_hours", rush_hours: "=rush_lead_time_hours", rush_pct: "=rush_fee_pct_of_order", min_value_usd: "=min_order_value_usd", min_guests: "=min_headcount", max_guests: "=max_headcount", phone_surcharge_usd: "=order_channel_phone_surcharge_usd", peak_pct: "=peak_season_surcharge_pct"}
    measures: [catering_msr_spend_trailing_90d]
  - id: catering_amendment_terms
    subject: [catering_order_amended]
    rule: >
      An order may be amended until the guest count deadline printed against the service level, measured in whole hours before the service start time on the service date.
      A reduction in guest count inside the free reduction band printed against the service level does not reprice the order; a reduction beyond that band reprices the order to the reduced count, and a reduction asked for after the deadline does not reprice it at all because the food has been bought.
      An increase in guest count is accepted up to the increase ceiling printed against the service level and reprices the order upward; an increase beyond the ceiling is taken as a second order at the prevailing lead time and surcharges rather than folded into the first.
      A change of menu package inside the dietary lead hours printed against the service level is not accepted, and a change of service date is handled as a cancellation of the first order and a fresh order on the new day.
      Every amendment rewrites the order value, and the value that governs any later cancellation charge is the value on the order at the moment notice of cancellation is given.
      An amendment that raises the order value is not accepted while the agreement stands on credit hold, and an amendment that lowers it is accepted whatever the credit position.
    eligibility:
      - id: amendable_state
        applies_to: [catering_order_amended]
        kind: state
        condition: An amendment that raises the order value is not accepted while the agreement stands on credit hold, and an amendment that lowers it is accepted whatever the credit position.
        evidence_fields: [catering_agreements.status, catering_agreements.catering_agreement_id, catering_orders.order_reference]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [catering_orders.order_reference]
          action_bindings:
            catering_orders.order_reference: order_reference
        state_contract:
          field: catering_agreements.status
          allowed: [active, credit_hold]
    params:
      per_tier:
        "Drop-Off Catering Account": {change_deadline_hours: "=headcount_change_deadline_hours", free_reduction_pct: "=headcount_reduction_free_pct", increase_ceiling_pct: "=headcount_increase_max_pct", dietary_lead_hours: "=dietary_accommodation_lead_hours"}
        "Delivered Buffet Account": {change_deadline_hours: "=headcount_change_deadline_hours", free_reduction_pct: "=headcount_reduction_free_pct", increase_ceiling_pct: "=headcount_increase_max_pct", dietary_lead_hours: "=dietary_accommodation_lead_hours"}
        "Attended Buffet Account": {change_deadline_hours: "=headcount_change_deadline_hours", free_reduction_pct: "=headcount_reduction_free_pct", increase_ceiling_pct: "=headcount_increase_max_pct", dietary_lead_hours: "=dietary_accommodation_lead_hours"}
        "Staffed Full-Service Catering Account": {change_deadline_hours: "=headcount_change_deadline_hours", free_reduction_pct: "=headcount_reduction_free_pct", increase_ceiling_pct: "=headcount_increase_max_pct", dietary_lead_hours: "=dietary_accommodation_lead_hours"}
        "Executive Hospitality Catering Account": {change_deadline_hours: "=headcount_change_deadline_hours", free_reduction_pct: "=headcount_reduction_free_pct", increase_ceiling_pct: "=headcount_increase_max_pct", dietary_lead_hours: "=dietary_accommodation_lead_hours"}
        "Campus Catering Master Account": {change_deadline_hours: "=headcount_change_deadline_hours", free_reduction_pct: "=headcount_reduction_free_pct", increase_ceiling_pct: "=headcount_increase_max_pct", dietary_lead_hours: "=dietary_accommodation_lead_hours"}
  - id: catering_cancellation_charges
    subject: [catering_order_cancelled, catering_cancellation_fee_posted]
    rule: >
      What a cancellation costs is set by how much notice the client gave, measured in whole hours from the day the client gives notice of the cancellation to the service start time on the service date.
      Notice at or beyond the free-cancellation hours printed against the service level carries no charge at all; notice inside that window but before the service day carries the within-notice percentage of the order value; and notice on the service day itself carries the same-day percentage of the order value.
      The order value the percentage is applied to is the value standing on the order at the moment notice is given, after every amendment already accepted, and never the value the order was first quoted at.
      A cancellation is registered against the order on the day notice is given, and the registration may not be made later than the registration window, counted in elapsed hours from the day the client gives notice of the cancellation.
      Elapsed hours run continuously from the moment notice is given, nights, weekends and public holidays included, and a registration made exactly on the boundary hour is still in time; elapsed hours are never rounded up to whole calendar days.
      A cancellation forced by Larkspur Table — a kitchen failure, a delivery the team cannot staff, a blackout day taken after the order was accepted — carries no charge whatever the notice given.
      Where the same agreement has already cancelled inside the chargeable window four times in the rolling twelve months, the within-notice percentage is charged even on notice that would otherwise have been free, and the client is told at the point of the fourth cancellation.
      A cancellation charge is only raised against an order that has not been delivered; once an order is delivered the charge is a quality matter and is handled as a service credit instead.
    eligibility:
      - id: cancellable_state
        applies_to: [catering_order_cancelled, catering_cancellation_fee_posted]
        kind: state
        condition: A cancellation charge is only raised against an order that has not been delivered; once an order is delivered the charge is a quality matter and is handled as a service credit instead.
        evidence_fields: [catering_agreements.status, catering_agreements.catering_agreement_id, catering_orders.order_reference, catering_orders.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [catering_orders.order_reference]
          action_bindings:
            catering_orders.order_reference: order_reference
        state_contract:
          field: catering_agreements.status
          allowed: [active, credit_hold]
      - id: registration_window
        applies_to: [catering_cancellation_fee_posted]
        kind: time
        condition: A cancellation is registered against the order on the day notice is given, and the registration may not be made later than the registration window, counted in elapsed hours from the day the client gives notice of the cancellation.
        evidence_fields: [catering_orders.notice_given_date, catering_orders.order_reference, catering_orders.service_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [catering_orders.order_reference]
          action_bindings:
            catering_orders.order_reference: order_reference
        temporal_basis:
          clock: frozen_time
          anchor_event: the day the client gives notice of the cancellation
          anchor_source: catering_orders.notice_given_date
          relation: not_after
          duration_source: params.registration_window_hours
          unit: elapsed_hours
          counting_rule: Elapsed hours run continuously from the moment notice is given, nights, weekends and public holidays included, and a registration made exactly on the boundary hour is still in time; elapsed hours are never rounded up to whole calendar days.
          boundary: inclusive
    params:
      registration_window_hours: 24
      repeat_cancellation_threshold: 4
      per_tier:
        "Drop-Off Catering Account": {free_hours: "=cancellation_notice_hours_full_refund", within_notice_pct: "=cancellation_fee_pct_within_notice", same_day_pct: "=cancellation_fee_pct_same_day"}
        "Delivered Buffet Account": {free_hours: "=cancellation_notice_hours_full_refund", within_notice_pct: "=cancellation_fee_pct_within_notice", same_day_pct: "=cancellation_fee_pct_same_day"}
        "Attended Buffet Account": {free_hours: "=cancellation_notice_hours_full_refund", within_notice_pct: "=cancellation_fee_pct_within_notice", same_day_pct: "=cancellation_fee_pct_same_day"}
        "Staffed Full-Service Catering Account": {free_hours: "=cancellation_notice_hours_full_refund", within_notice_pct: "=cancellation_fee_pct_within_notice", same_day_pct: "=cancellation_fee_pct_same_day"}
        "Executive Hospitality Catering Account": {free_hours: "=cancellation_notice_hours_full_refund", within_notice_pct: "=cancellation_fee_pct_within_notice", same_day_pct: "=cancellation_fee_pct_same_day"}
        "Campus Catering Master Account": {free_hours: "=cancellation_notice_hours_full_refund", within_notice_pct: "=cancellation_fee_pct_within_notice", same_day_pct: "=cancellation_fee_pct_same_day"}
    formula:
      amount_usd: round(amount_usd * cancellation_fee_pct_within_notice / 100, 2)
    measures: [catering_msr_cancellations_rolling_12m]
  - id: catering_delivery_and_service_terms
    subject: [catering_order_delivered]
    rule: >
      Delivery is charged at the delivery fee printed against the service level for each order delivered inside the delivery radius printed against the same service level, and a site beyond that radius is quoted separately before the order is accepted.
      The service charge printed against the service level is applied to food and beverage on the order and never to the delivery fee, the rush surcharge or rented equipment.
      The on-site service hours printed against the service level are included in the order; hours beyond that are billed at the additional service hour rate printed against the same service level, counted in whole hours and rounded up.
      Where china, linen or set-down is included at the service level, no separate charge is raised for it; where it is not included and the client asks for it, the order is moved up to the service level that includes it rather than charged as an extra.
      The team returns to clear within the clean-up window printed against the service level, and equipment left beyond that window is treated as rented equipment from the following day.
      Rented service equipment is held against the deposit printed against the service level, and equipment returned late carries the daily late return charge printed against the same service level.
      Licensed beverage service is only delivered on a service level that permits it, and an order that includes alcohol on a service level that does not is delivered without the alcohol.
    eligibility: []
    params:
      per_tier:
        "Drop-Off Catering Account": {delivery_fee_usd: "=delivery_fee_usd", radius_miles: "=delivery_radius_miles", service_charge_pct: "=service_charge_pct", included_hours: "=staffing_included_hours", extra_hour_rate_usd: "=staff_rate_per_hour_usd", cleanup_minutes: "=cleanup_window_minutes", deposit_usd: "=equipment_rental_deposit_usd", late_return_usd: "=late_return_fee_per_day_usd"}
