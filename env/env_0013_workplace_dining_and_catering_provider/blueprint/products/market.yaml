category: market
display_name: Unattended Micro Market Program

binding:
  holding_table: market_agreements
  event_tables: [market_ledger]
  intake_tables: [market_service_intake]
  status_field: status
  variant_field: variant_name
  quantity_fields: {subsidy_pool_balance_usd: market_subsidy, receivable_balance_usd: market_receivable}

lifecycle:
  states: [proposed, installing, active, suspended, closed]
  transitions:
    - {from: proposed, to: installing, by: agent, means: the client signs and the fixtures and kiosk are scheduled in}
    - {from: installing, to: active, by: system, means: the market is stocked and opens to employees}
    - {from: active, to: suspended, by: agent, means: the market is closed off at the client's instruction while the agreement stands}
    - {from: suspended, to: active, by: agent, means: the market is restocked and reopens}
    - {from: active, to: closed, by: user, means: the client ends the agreement and the fixtures come out}
    - {from: suspended, to: closed, by: agent, means: a suspended market is closed out rather than reopened}
    - {from: installing, to: closed, by: agent, means: the installation is abandoned before the market opens}
    - {from: proposed, to: closed, by: agent, means: the proposal is withdrawn or declined before signature}

accounts:
  - key: market_subsidy
    unit: USD
    meaning: client money funded in advance to discount employee purchases at the market kiosk, drawn on as employees buy
  - key: market_receivable
    unit: USD
    meaning: amounts invoiced to the client on the monthly market settlement and not yet settled

parameter_schema:
  install_fee_usd: one-off charge for fixtures, kiosk and first stocking, in USD
  equipment_lease_monthly_usd: monthly charge for coolers, shelving and kiosk hardware, in USD
  kiosk_count: self-checkout kiosks installed, as a whole number
  cooler_count: refrigerated units installed, as a whole number
  freezer_included: whether a frozen unit is part of the format, true or false
  sku_count: distinct products carried in the planogram, as a whole number
  fresh_sku_count: distinct fresh and chilled products carried, as a whole number
  planogram_change_lead_days: calendar days of notice needed to change the planogram
  restock_visits_per_week: scheduled restocking visits each week, as a whole number
  restock_window_hours: length of each scheduled restocking visit, to one decimal place
  min_headcount_served: smallest badged headcount the market format is written for, as a whole number
  min_monthly_sales_usd: monthly sales the format is written against, in USD
  monthly_sales_guarantee_usd: monthly sales the client guarantees, in USD
  sales_shortfall_subsidy_pct: share of the gap between guaranteed and actual sales invoiced to the client, as a percentage
  management_fee_basis: the commercial basis the market settles on, one of commission, subsidy_true_up or management_fee
  management_fee_monthly_usd: monthly management fee where the format settles on a management fee, in USD
  commission_pct_of_sales: commission paid back to the client where the format settles on commission, as a percentage of sales
  product_markup_pct: markup applied to landed product cost to set shelf prices, as a percentage
  subsidy_model: how the client subsidy reaches the employee, one of none, percent_discount or fixed_per_visit
  subsidy_pct_of_shelf_price: percentage of shelf price met by client subsidy under a percent_discount model
  subsidy_cap_per_employee_per_day_usd: ceiling on subsidy drawn for one employee on one day, in USD
  subsidy_funding_minimum_usd: smallest single subsidy funding lot the client may pay in, in USD
  subsidy_funding_lot_expiry_months: months a funding lot stays drawable before it expires, in whole months
  shrink_allowance_pct_of_sales: unexplained inventory loss absorbed without charge, as a percentage of sales
  shrink_charge_pct_above_allowance: share of the loss above the allowance invoiced to the client, as a percentage
  shrink_dispute_window_days: calendar days after a shrink adjustment within which the client may dispute it
  inventory_count_frequency_weeks: weeks between full inventory counts, as a whole number
  spoilage_credit_pct: share of dated-out fresh stock credited back before shrink is measured, as a percentage
  install_lead_days: calendar days of installation lead time before the market may open
  contract_term_months: standard initial term of the agreement, in whole months
  termination_notice_days: calendar days of written notice required to end the agreement
  early_removal_fee_usd: charge for ending the agreement before the end of the term, in USD
  equipment_removal_fee_usd: charge for taking the fixtures and kiosk out at closure, in USD
  max_suspension_days_per_contract_year: ceiling on suspended calendar days in one contract year
  min_suspension_days: shortest suspension the format accepts, in calendar days
  resumption_lead_days: calendar days of notice needed to reopen a suspended market
  suspension_standby_fee_usd: monthly charge while the market stands suspended, in USD
  invoice_cycle_day: day of the month the settlement invoice is raised, from 1 to 28
  payment_terms_days: calendar days from the settlement invoice within which payment is due
  late_fee_monthly_pct: monthly late charge on an overdue settlement invoice, as a percentage of the overdue amount
  late_fee_grace_days: calendar days past the due date before a late charge may be raised
  late_fee_cap_usd: ceiling on the late charge raised against one settlement invoice, in USD
  credit_hold_threshold_days_past_due: days past due at which restocking stops on the agreement
  outage_credit_pct_per_hour: credit for each hour the kiosk is out of service, as a percentage of the monthly settlement
  outage_credit_cap_pct_of_settlement: ceiling on outage credits in one settlement period, as a percentage of that settlement
  service_credit_claim_window_days: calendar days after the settlement invoice within which a service credit claim is accepted
  kiosk_uptime_guarantee_pct: kiosk availability the format guarantees, as a percentage of opening hours
  card_processing_fee_pct: card processing charge passed through on employee card purchases, as a percentage
  mobile_pay_enabled: whether employees may pay by the mobile wallet at the kiosk, true or false
  loss_prevention_camera_included: whether a loss prevention camera is installed with the market, true or false
  nutrition_labeling_level: depth of shelf nutrition labelling, one of basic, standard or enhanced
  planogram_refresh_per_year: planned planogram refreshes each year, as a whole number
  portfolio_fee_discount_ladder: threshold ladder mapping the number of micro markets the client holds to the settlement discount percentage
  restocking_call_out_fee_usd: charge for an unscheduled restocking visit asked for by the client, in USD

