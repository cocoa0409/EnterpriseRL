  - id: market_settlement_payment_terms
    subject: [market_settlement_payment_posted]
    rule: >
      Settlement invoices fall due the number of days after the invoice date printed against the market format, and a payment is recorded against the single invoice it settles.
      A payment is accepted while the agreement stands active, suspended or closed, since a closed market may still carry a final settlement.
      A part payment settles the named invoice in part and never spills onto another; an overpayment leaves the excess on the agreement to be applied to the next settlement raised.
      A late charge is the monthly late percentage printed against the market format applied to the amount still outstanding once the grace days printed against the same format have passed, held to the late charge ceiling printed against that format.
      Where a settlement is disputed in writing before the grace days expire, no late charge is raised while the dispute stands open, and the due date is not moved.
      Once a settlement invoice is past due by the credit hold threshold printed against the market format, restocking stops and the market is drawn down to empty rather than replenished, until the balance is settled.
    eligibility:
      - id: payable_state
        applies_to: [market_settlement_payment_posted]
        kind: state
        condition: A payment is accepted while the agreement stands active, suspended or closed, since a closed market may still carry a final settlement.
        evidence_fields: [market_agreements.status, market_agreements.receivable_balance_usd, market_agreements.market_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [market_agreements.market_agreement_id]
          action_bindings:
            market_agreements.market_agreement_id: market_agreement_id
        state_contract:
          field: market_agreements.status
          allowed: [active, suspended, closed]
    params:
      per_tier:
        "Cooler & Snack Wall": {terms_days: "=payment_terms_days", grace_days: "=late_fee_grace_days", late_pct: "=late_fee_monthly_pct", late_cap_usd: "=late_fee_cap_usd", hold_days: "=credit_hold_threshold_days_past_due"}
        "Compact Micro Market": {terms_days: "=payment_terms_days", grace_days: "=late_fee_grace_days", late_pct: "=late_fee_monthly_pct", late_cap_usd: "=late_fee_cap_usd", hold_days: "=credit_hold_threshold_days_past_due"}
        "Standard Micro Market": {terms_days: "=payment_terms_days", grace_days: "=late_fee_grace_days", late_pct: "=late_fee_monthly_pct", late_cap_usd: "=late_fee_cap_usd", hold_days: "=credit_hold_threshold_days_past_due"}
        "Fresh Food Micro Market": {terms_days: "=payment_terms_days", grace_days: "=late_fee_grace_days", late_pct: "=late_fee_monthly_pct", late_cap_usd: "=late_fee_cap_usd", hold_days: "=credit_hold_threshold_days_past_due"}
        "Expanded Campus Micro Market": {terms_days: "=payment_terms_days", grace_days: "=late_fee_grace_days", late_pct: "=late_fee_monthly_pct", late_cap_usd: "=late_fee_cap_usd", hold_days: "=credit_hold_threshold_days_past_due"}
        "Smart Store Micro Market": {terms_days: "=payment_terms_days", grace_days: "=late_fee_grace_days", late_pct: "=late_fee_monthly_pct", late_cap_usd: "=late_fee_cap_usd", hold_days: "=credit_hold_threshold_days_past_due"}
  - id: market_service_credit_terms
    subject: [market_service_credit_issued]
    rule: >
      Where the kiosk could not take a payment, or the market stood empty because a scheduled restock was missed, the client is credited against the settlement invoice for that period.
      Each hour of kiosk outage inside opening hours earns the percentage of the settlement printed against the market format, and the credits allowed in one settlement period are held to the ceiling printed against the same format.
      Outage is measured from the approved market service requests on the agreement for that period, and not from the client's recollection of when the screen was dark.
      A credit is allowed only when the claim reaches Larkspur Table no later than the claim window for the market format, counted in calendar days from the day the settlement invoice was posted.
      Claim window days are counted as calendar days from the day after the settlement invoice posting day, every day of the week counts, and a claim arriving on the boundary day itself is still in time; calendar days are never converted into full 24-hour periods.
      Outage caused by the client — a power cut on their floor, a network they took down, a door they locked — is not kiosk outage for this purpose and earns no credit.
      Where measured availability stayed at or above the uptime guarantee printed against the market format, no credit is allowed however many short interruptions there were.
      Where the credits that would be due exceed the settlement period ceiling, the ceiling is allowed and the balance of the claim is closed rather than carried forward.
    eligibility:
      - id: credit_claim_window
        applies_to: [market_service_credit_issued]
        kind: time
        condition: A credit is allowed only when the claim reaches Larkspur Table no later than the claim window for the market format, counted in calendar days from the day the settlement invoice was posted.
        evidence_fields: [market_ledger.posted_date, market_ledger.invoice_reference, market_ledger.market_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [market_ledger.invoice_reference]
          action_bindings:
            market_ledger.invoice_reference: invoice_reference
        temporal_basis:
          clock: frozen_time
          anchor_event: the day the settlement invoice was posted
          anchor_source: market_ledger.posted_date
          relation: not_after
          duration_source: variants.service_credit_claim_window_days
          unit: calendar_days
          counting_rule: Claim window days are counted as calendar days from the day after the settlement invoice posting day, every day of the week counts, and a claim arriving on the boundary day itself is still in time; calendar days are never converted into full 24-hour periods.
          boundary: inclusive
    params:
      per_tier:
        "Cooler & Snack Wall": {credit_pct_per_hour: "=outage_credit_pct_per_hour", period_cap_pct: "=outage_credit_cap_pct_of_settlement", claim_window_days: "=service_credit_claim_window_days", uptime_guarantee_pct: "=kiosk_uptime_guarantee_pct"}
        "Compact Micro Market": {credit_pct_per_hour: "=outage_credit_pct_per_hour", period_cap_pct: "=outage_credit_cap_pct_of_settlement", claim_window_days: "=service_credit_claim_window_days", uptime_guarantee_pct: "=kiosk_uptime_guarantee_pct"}
        "Standard Micro Market": {credit_pct_per_hour: "=outage_credit_pct_per_hour", period_cap_pct: "=outage_credit_cap_pct_of_settlement", claim_window_days: "=service_credit_claim_window_days", uptime_guarantee_pct: "=kiosk_uptime_guarantee_pct"}
        "Fresh Food Micro Market": {credit_pct_per_hour: "=outage_credit_pct_per_hour", period_cap_pct: "=outage_credit_cap_pct_of_settlement", claim_window_days: "=service_credit_claim_window_days", uptime_guarantee_pct: "=kiosk_uptime_guarantee_pct"}
        "Expanded Campus Micro Market": {credit_pct_per_hour: "=outage_credit_pct_per_hour", period_cap_pct: "=outage_credit_cap_pct_of_settlement", claim_window_days: "=service_credit_claim_window_days", uptime_guarantee_pct: "=kiosk_uptime_guarantee_pct"}
        "Smart Store Micro Market": {credit_pct_per_hour: "=outage_credit_pct_per_hour", period_cap_pct: "=outage_credit_cap_pct_of_settlement", claim_window_days: "=service_credit_claim_window_days", uptime_guarantee_pct: "=kiosk_uptime_guarantee_pct"}
    formula:
      uncapped_credit_usd: round(amount_usd * outage_credit_pct_per_hour * market_msr_kiosk_outage_hours / 100, 2)
      period_ceiling_usd: round(amount_usd * outage_credit_cap_pct_of_settlement / 100, 2)
    measures: [market_msr_kiosk_outage_hours]
  - id: market_suspension_and_closure_terms
    subject: [market_service_suspended, market_service_resumed, market_agreement_closed]
    rule: >
      A client may close the market off without ending the agreement, for a floor move, a building closure or a seasonal shutdown.
      A suspension, a resumption or a closure is only worked while the agreement stands active, suspended or closed, and a market still installing is abandoned rather than suspended.
      A suspension shorter than the minimum printed against the market format is handled as ordinary closed days, and suspended days accumulate against the contract year ceiling printed against the same format; once the ceiling is reached the client is asked either to reopen or to give notice.
      While suspended the standby charge printed against the market format replaces the equipment lease, and perishable stock is removed at the start of the suspension without charge.
      Reopening needs the notice printed against the market format, counted in calendar days, so that the planogram can be rebuilt and the coolers restocked.
      Only the client may end the agreement, and the desk records the request as a termination notice for the client to confirm; notice is the number of calendar days printed against the market format.
      Where the closure day falls before the end of the term, the early removal charge printed against the market format falls due, and on or after the end of the term it does not; the equipment removal charge printed against the format falls due either way.
      On closure the subsidy funding left undrawn is refunded to the client on the final settlement rather than forfeited.
    eligibility:
      - id: lifecycle_state
        applies_to: [market_service_suspended, market_service_resumed, market_agreement_closed]
        kind: state
        condition: A suspension, a resumption or a closure is only worked while the agreement stands active, suspended or closed, and a market still installing is abandoned rather than suspended.
        evidence_fields: [market_agreements.status, market_agreements.suspension_start_date, market_agreements.market_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [market_agreements.market_agreement_id]
          action_bindings:
            market_agreements.market_agreement_id: market_agreement_id
        state_contract:
          field: market_agreements.status
          allowed: [active, suspended, closed]
    params:
      per_tier:
        "Cooler & Snack Wall": {min_days: "=min_suspension_days", annual_cap_days: "=max_suspension_days_per_contract_year", resume_notice_days: "=resumption_lead_days", standby_usd: "=suspension_standby_fee_usd", notice_days: "=termination_notice_days", early_removal_usd: "=early_removal_fee_usd", removal_usd: "=equipment_removal_fee_usd", term_months: "=contract_term_months"}
        "Compact Micro Market": {min_days: "=min_suspension_days", annual_cap_days: "=max_suspension_days_per_contract_year", resume_notice_days: "=resumption_lead_days", standby_usd: "=suspension_standby_fee_usd", notice_days: "=termination_notice_days", early_removal_usd: "=early_removal_fee_usd", removal_usd: "=equipment_removal_fee_usd", term_months: "=contract_term_months"}
        "Standard Micro Market": {min_days: "=min_suspension_days", annual_cap_days: "=max_suspension_days_per_contract_year", resume_notice_days: "=resumption_lead_days", standby_usd: "=suspension_standby_fee_usd", notice_days: "=termination_notice_days", early_removal_usd: "=early_removal_fee_usd", removal_usd: "=equipment_removal_fee_usd", term_months: "=contract_term_months"}
        "Fresh Food Micro Market": {min_days: "=min_suspension_days", annual_cap_days: "=max_suspension_days_per_contract_year", resume_notice_days: "=resumption_lead_days", standby_usd: "=suspension_standby_fee_usd", notice_days: "=termination_notice_days", early_removal_usd: "=early_removal_fee_usd", removal_usd: "=equipment_removal_fee_usd", term_months: "=contract_term_months"}
        "Expanded Campus Micro Market": {min_days: "=min_suspension_days", annual_cap_days: "=max_suspension_days_per_contract_year", resume_notice_days: "=resumption_lead_days", standby_usd: "=suspension_standby_fee_usd", notice_days: "=termination_notice_days", early_removal_usd: "=early_removal_fee_usd", removal_usd: "=equipment_removal_fee_usd", term_months: "=contract_term_months"}
