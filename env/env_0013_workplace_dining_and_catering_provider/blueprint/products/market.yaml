  - id: market_combination_dining_interaction
    subject: [market_monthly_settlement_invoiced, market_subsidy_drawdown_posted]
    rule: >
      What a client holds elsewhere in the dining programme changes what the market settles and where its subsidy may be spent.
      Where the same client holds an active workplace cafe management contract at the site the market stands in, the two subsidy pools are read as one for the employee daily ceiling, and the ceiling printed against the cafe service model governs both outlets together rather than each separately.
      Where there is no cafe contract at the site, the market's own daily ceiling printed against its format governs, and nothing is pooled.
      Where the same client holds an active vending programme at the site, the equipment lease on the market is invoiced in full, and the commission the vending programme pays back is settled on its own statement; the two are never netted against each other.
      A micro market and a full service cafe at the same site are not mutually exclusive, and clients commonly hold both; but a market may not be installed at a site where the cafe contract's service model already includes an unattended grab and go wall, since that wall is the market.
      Where the cafe contract at the site closes, the market's own daily ceiling takes over from the next settlement period, and drawdowns already posted are not reopened.
    eligibility: []
    params:
      per_tier:
        "Cooler & Snack Wall": {pool_with_cafe: false, net_against_vending: false}
        "Compact Micro Market": {pool_with_cafe: true, net_against_vending: false}
        "Standard Micro Market": {pool_with_cafe: true, net_against_vending: false}
        "Fresh Food Micro Market": {pool_with_cafe: true, net_against_vending: false}
        "Expanded Campus Micro Market": {pool_with_cafe: true, net_against_vending: false}
        "Smart Store Micro Market": {pool_with_cafe: true, net_against_vending: false}
