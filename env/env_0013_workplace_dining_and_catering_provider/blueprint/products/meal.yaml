events:
  - type: meal_account_opened
    target: meal_accounts
    mutation: create
    meaning: an employee is enrolled onto a workplace meal plan at a site
    grain: one row per meal account an employee holds at one site
    fields:
      customer_id: the employee who holds the account
      variant_name: the meal plan enrolled on
      status: the account opens in the enrolled state
      employee_badge_number: the badge the account will be tapped with
      site_code: the site the account is enrolled at
      employer_account_code: the employer whose dining programme funds the account
      enrolled_date: the day the account was enrolled
      payroll_cycle: the employer payroll cycle the account is recovered on
      meal_balance_usd: opening stored value, zero on a new account
      subsidy_allowance_usd: opening allowance, zero until the first grant
      payroll_arrears_usd: opening arrears, zero on a new account
    triggers: []
  - type: meal_account_activated
    target: meal_accounts
    mutation: {transition: {from: enrolled, to: active}}
    meaning: the badge is registered at the till and the account opens for spending
    grain: one row per account, on the day it first becomes spendable
    fields:
      status: the account moves into active
      activated_date: the day the account became spendable
    triggers:
      - event: meal:meal_subsidy_granted
        map: {transaction_code: subsidy_grant}
  - type: meal_account_restricted
    target: meal_accounts
    mutation: {transition: {from: active, to: restricted}}
    meaning: arrears pass the restriction threshold and payroll tender is switched off
    grain: one row per account, on the day the restriction is applied
    fields:
      status: the account moves into restricted
      restriction_start_date: the day the restriction was applied
    triggers: []
  - type: meal_account_reinstated
    target: meal_accounts
    mutation: {transition: {from: restricted, to: active}}
    meaning: arrears are brought down far enough and payroll tender is switched back on
    grain: one row per account, on the day the restriction is lifted
    fields:
      status: the account moves back into active
      restriction_start_date: cleared once the restriction is lifted
    triggers: []
  - type: meal_account_leave_status_changed
    target: meal_accounts
    mutation: {transition: [{from: active, to: suspended}, {from: suspended, to: active}]}
    meaning: the account is parked for recorded leave, or unparked when the employee returns
    grain: one row per account, on the day leave starts or ends
    fields:
      status: the account moves between active and suspended
      suspension_start_date: first day of the leave, cleared on return
    triggers: []
  - type: meal_account_closed
    target: meal_accounts
    mutation: {transition: [{from: active, to: closed}, {from: restricted, to: closed}, {from: suspended, to: closed}, {from: enrolled, to: closed}]}
    meaning: the meal account is closed, on leaving the employer or at the employee's request
    grain: one row per account, on the day it closes
    fields:
      status: the account moves into closed
      closed_date: the day the account closed
    triggers:
      - event: meal:meal_payroll_deduction_posted
        map: {transaction_code: payroll_deduction}
  - type: meal_plan_changed
    target: meal_accounts
    mutation: update
    meaning: the employee moves onto a different meal plan without closing the account
    grain: one row per account, on the day a new plan takes effect
    fields:
      variant_name: the meal plan now in force
      plan_change_effective_date: the day the new plan took effect
    triggers:
      - event: meal:meal_subsidy_granted
        map: {transaction_code: subsidy_grant}
  - type: meal_purchase_posted
    target: meal_transactions
    meaning: the employee rings a meal at a dining outlet on the account
    grain: one row per till transaction rung on the account
    distinguish_by: [pos_reference, posted_date, meal_period]
    fields:
      meal_account_id: the account rung against
      customer_id: the employee eating
      event_type: the event family of this row
      transaction_code: meal_purchase on an employee meal, guest_meal on a guest
      amount_usd: the value rung at the till
      posted_date: the day the meal was rung
      meal_period: the meal period the meal was rung in
      venue_code: the outlet the meal was rung at
      pos_reference: the till transaction this row is
      payment_channel: how the meal was tendered
      pay_period: the payroll period the charge is recovered in, where it is tendered against payroll
      item_count: the number of items on the till transaction
    account: meal_balance
    direction: out
    triggers:
      - event: meal:meal_subsidy_applied
        when: {payment_channel: subsidy}
        map: {original_pos_reference: pos_reference, transaction_code: subsidy_application, meal_period: meal_period, venue_code: venue_code}
      - event: meal:meal_charge_accrued
        when: {payment_channel: payroll_deduction}
        map: {original_pos_reference: pos_reference, transaction_code: charge_accrual, amount_usd: amount_usd, pay_period: pay_period}
      - event: cafe:cafe_subsidy_drawdown_posted
        when: {payment_channel: subsidy}
        map: {source_reference: pos_reference, amount_usd: amount_usd, posted_date: posted_date, meal_period: meal_period, charge_code: subsidy_drawdown}
  - type: meal_account_load_posted
    target: meal_transactions
    meaning: the employee adds stored value to the account, by card or by an automatic reload
    grain: one row per load of value onto the account
    distinguish_by: [pos_reference, posted_date, payment_channel]
    fields:
      meal_account_id: the account loaded
      customer_id: the employee loading it
      event_type: the event family of this row
      transaction_code: account_load on every row of this family
      amount_usd: the value added
      posted_date: the day the load cleared
      pos_reference: the load transaction this row is
      payment_channel: how the load was paid for
      venue_code: the outlet the load was made at, empty on an online or automatic load
    account: meal_balance
    direction: in
    triggers: []
  - type: meal_subsidy_granted
    target: meal_transactions
    meaning: the employer's allowance for a grant period is placed on the account
    grain: one row per allowance lot granted for one grant period
    distinguish_by: [subsidy_lot_reference, posted_date, amount_usd]
    fields:
      meal_account_id: the account granted allowance
      customer_id: the employee granted allowance
      event_type: the event family of this row
      transaction_code: subsidy_grant on every row of this family
      amount_usd: the allowance granted
      posted_date: the day the allowance was placed on the account
      subsidy_lot_reference: the allowance lot created
      original_pos_reference: the till transaction whose reversal restored this allowance, empty on an ordinary grant
      pay_period: the payroll period the grant belongs to, empty on a daily grant
    account: subsidy_allowance
    direction: in
    triggers: []
  - type: meal_subsidy_applied
    target: meal_transactions
    meaning: employer allowance is spent against an eligible till transaction
    grain: one row per allowance lot drawn against one till transaction
    distinguish_by: [original_pos_reference, subsidy_lot_reference, meal_period]
    fields:
      meal_account_id: the account whose allowance is spent
      customer_id: the employee spending it
      event_type: the event family of this row
      transaction_code: subsidy_application on every row of this family
      amount_usd: the allowance applied
      posted_date: the day the allowance was applied
      meal_period: the meal period the allowance was spent in
      venue_code: the outlet the allowance was spent at
      original_pos_reference: the till transaction the allowance was applied to
      subsidy_lot_reference: the allowance lot drawn against
      pos_reference: the allowance application this row is
    account: subsidy_allowance
    direction: out
    triggers: []
  - type: meal_refund_posted
    target: meal_transactions
    meaning: a till transaction is reversed and its value returned to the employee
    grain: one row per refund of one till transaction
    distinguish_by: [original_pos_reference, posted_date, amount_usd]
    fields:
      meal_account_id: the account refunded
      customer_id: the employee refunded
      event_type: the event family of this row
      transaction_code: refund on every row of this family
      amount_usd: the value returned
      posted_date: the day the refund was made
      original_pos_reference: the till transaction being reversed
      pos_reference: the refund transaction this row is
      payment_channel: where the refund was returned to
      venue_code: the outlet the original meal was rung at
    account: meal_balance
    direction: in
    triggers:
      - event: meal:meal_subsidy_granted
        when: {payment_channel: subsidy}
        map: {original_pos_reference: original_pos_reference, transaction_code: subsidy_grant, amount_usd: amount_usd}
  - type: meal_charge_accrued
    target: meal_transactions
    meaning: a meal tendered against payroll is added to the charges awaiting recovery
    grain: one row per till transaction charged to payroll
    distinguish_by: [original_pos_reference, pay_period, posted_date]
    fields:
      meal_account_id: the account charged
      customer_id: the employee charged
      event_type: the event family of this row
      transaction_code: charge_accrual on every row of this family
      amount_usd: the charge added to arrears
      posted_date: the day the charge was accrued
      original_pos_reference: the till transaction the charge answers
      pay_period: the payroll period the charge is to be recovered in
      pos_reference: the accrual this row is
    account: payroll_arrears
    direction: in
    triggers: []
  - type: meal_payroll_deduction_posted
    target: meal_transactions
    meaning: a payroll period's charges are recovered from the employee's pay and cleared from arrears
    grain: one row per payroll period recovered on the account
    distinguish_by: [pay_period, posted_date, amount_usd]
    fields:
      meal_account_id: the account recovered against
      customer_id: the employee whose pay was deducted
      event_type: the event family of this row
      transaction_code: payroll_deduction on every row of this family
      amount_usd: the amount recovered
      posted_date: the day the deduction was remitted
      pay_period: the payroll period recovered
      pos_reference: the deduction this row is
      payment_channel: payroll_deduction on every row of this family
    account: payroll_arrears
    direction: out
    triggers: []
  - type: meal_overdraft_fee_posted
    target: meal_transactions
    meaning: a charge is raised because a till transaction took the stored value below zero
    grain: one row per overdraft charge raised against one till transaction
    distinguish_by: [original_pos_reference, posted_date, amount_usd]
    fields:
      meal_account_id: the account charged
      customer_id: the employee charged
      event_type: the event family of this row
      transaction_code: overdraft_fee on every row of this family
      amount_usd: the charge raised
      posted_date: the day the charge was raised
      original_pos_reference: the till transaction that took the balance below zero
      pos_reference: the charge this row is
    account: meal_balance
    direction: out
    triggers: []

measures:
  - id: meal_msr_subsidy_drawn_today
    window: the service day the till transaction was rung, from the first transaction of that day through the transaction being priced
    measure: sum of amount_usd over meal_subsidy_applied rows on the account for that day
  - id: meal_msr_arrears_outstanding
    window: point in time on the day the restriction is considered, across every meal account the employee holds under the same employer account code
    measure: sum of amount_usd over meal_charge_accrued rows less amount_usd over meal_payroll_deduction_posted rows
  - id: meal_msr_overdraft_fees_this_month
    window: the calendar month the till transaction falls in, through the day of the transaction
    measure: count of meal_overdraft_fee_posted rows on the account
  - id: meal_msr_guest_meals_this_month
    window: the calendar month the till transaction falls in, through the day of the transaction
    measure: count of meal_purchase_posted rows on the account whose transaction_code is guest_meal

policies:
  - id: meal_agg_multi_holding
    subject: [meal_account_opened]
    rule: >
      An employee who works across more than one site may hold a meal account at each of them, because a badge is registered against a site's tills and an employer funds each site's programme separately.
      No employee holds more than the number of accounts printed against the meal plan at once, counting every account that is enrolled, active, restricted or suspended.
      A second account is never opened on the same plan at the same site; where an employee asks for one, the existing account at that site is used instead.
      Plans written for a single account do not sit alongside a second account of any plan, so an employee moving onto one of those plans closes their other accounts first.
      A closed account does not count toward the ceiling, so an employee who has left a site and closed its account may enrol afresh on returning.
    eligibility:
      - id: one_account_per_site_and_plan
        applies_to: [meal_account_opened]
        kind: dedup
        condition: A second account is never opened on the same plan at the same site; where an employee asks for one, the existing account at that site is used instead.
        evidence_fields: [meal_accounts.customer_id, meal_accounts.site_code, meal_accounts.variant_name, meal_accounts.status, meal_accounts.meal_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [meal_accounts.customer_id, meal_accounts.site_code]
          action_bindings:
            meal_accounts.customer_id: customer_id
            meal_accounts.site_code: site_code
        dedup_contract:
          table: meal_accounts
          mode: separate_record
          object_bindings: {customer_id: customer_id, site_code: site_code, variant_name: variant_name}
          duplicate_filters: {status: [enrolled, active, restricted, suspended]}
          distinct_fields: [enrolled_date, employee_badge_number]
    params: {max_per_customer: 2}
  - id: meal_agg_employee_portfolio
    subject: [meal_purchase_posted, meal_account_restricted]
    rule: >
      Where an employee holds more than one meal account, the two figures that decide what they may do are read across the whole portfolio rather than one account at a time.
      Arrears are summed across every account the employee holds under the same employer account code, and it is that total that is measured against the restriction threshold printed against the plan of the account being restricted.
      The daily spend ceiling, by contrast, is read on each account separately, because each site's tills price and cap their own service day.
      Employer allowance never moves between accounts: allowance granted on one site's account is spent at that site's eligible outlets and lapses there, whatever the employee holds elsewhere.
      Where the employee's accounts sit under two different employer account codes, the two portfolios are kept apart entirely and neither arrears nor allowance is read across them.
      A restriction applied on one account does not restrict the others by itself; each account is restricted on its own record once the portfolio arrears total is what the threshold is measured against.
    eligibility: []
    params:
      per_tier:
        "Pay-As-You-Go Badge Account": {arrears_threshold_usd: "=arrears_restriction_threshold_usd", daily_cap_usd: "=daily_spend_cap_usd"}
        "Prepaid Declining Balance Account": {arrears_threshold_usd: "=arrears_restriction_threshold_usd", daily_cap_usd: "=daily_spend_cap_usd"}
        "Payroll Deduction Meal Account": {arrears_threshold_usd: "=arrears_restriction_threshold_usd", daily_cap_usd: "=daily_spend_cap_usd"}
        "Subsidized Daily Allowance Account": {arrears_threshold_usd: "=arrears_restriction_threshold_usd", daily_cap_usd: "=daily_spend_cap_usd"}
        "Full Subsidy Employee Meal Account": {arrears_threshold_usd: "=arrears_restriction_threshold_usd", daily_cap_usd: "=daily_spend_cap_usd"}
        "Executive Dining Charge Account": {arrears_threshold_usd: "=arrears_restriction_threshold_usd", daily_cap_usd: "=daily_spend_cap_usd"}
    measures: [meal_msr_arrears_outstanding]
  - id: meal_enrollment_terms
    subject: [meal_account_opened, meal_account_activated]
    rule: >
      An employee is enrolled onto the highest meal plan whose entry gate they meet on length of service, on whether their employer runs the programme, on whether payroll consent has been given and on whether a manager has approved.
      An account is only opened or activated while it stands enrolled or already active, and an enrolment cancelled before the badge is ever used closes without charge.
      The enrolment charge printed against the plan is raised on the account at activation and never at enrolment, so an enrolment that is cancelled costs the employee nothing.
      Plans that require payroll consent are not activated until that consent is recorded, and until then the account stays enrolled and the badge is declined at the till.
      Where the employee does not meet the length of service printed against the plan asked for, the account is opened on the highest plan whose service requirement they do meet, and the employee is told when they will qualify.
      The badge registered on the account is the badge the employer issued; a replacement badge carries the replacement charge printed against the plan and the account is frozen for the freeze hours printed against the same plan from the moment a loss is reported.
    eligibility:
      - id: enrollment_state
        applies_to: [meal_account_opened, meal_account_activated]
        kind: state
        condition: An account is only opened or activated while it stands enrolled or already active, and an enrolment cancelled before the badge is ever used closes without charge.
        evidence_fields: [meal_accounts.status, meal_accounts.meal_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [meal_accounts.meal_account_id]
          action_bindings:
            meal_accounts.meal_account_id: meal_account_id
        state_contract:
          field: meal_accounts.status
          allowed: [enrolled, active]
    params:
      per_tier:
        "Pay-As-You-Go Badge Account": {enrollment_fee_usd: "=enrollment_fee_usd", min_tenure_months: "=tier_entry_min_tenure_months", badge_fee_usd: "=badge_replacement_fee_usd", freeze_hours: "=lost_badge_freeze_hours"}
        "Prepaid Declining Balance Account": {enrollment_fee_usd: "=enrollment_fee_usd", min_tenure_months: "=tier_entry_min_tenure_months", badge_fee_usd: "=badge_replacement_fee_usd", freeze_hours: "=lost_badge_freeze_hours"}
        "Payroll Deduction Meal Account": {enrollment_fee_usd: "=enrollment_fee_usd", min_tenure_months: "=tier_entry_min_tenure_months", badge_fee_usd: "=badge_replacement_fee_usd", freeze_hours: "=lost_badge_freeze_hours"}
        "Subsidized Daily Allowance Account": {enrollment_fee_usd: "=enrollment_fee_usd", min_tenure_months: "=tier_entry_min_tenure_months", badge_fee_usd: "=badge_replacement_fee_usd", freeze_hours: "=lost_badge_freeze_hours"}
        "Full Subsidy Employee Meal Account": {enrollment_fee_usd: "=enrollment_fee_usd", min_tenure_months: "=tier_entry_min_tenure_months", badge_fee_usd: "=badge_replacement_fee_usd", freeze_hours: "=lost_badge_freeze_hours"}
        "Executive Dining Charge Account": {enrollment_fee_usd: "=enrollment_fee_usd", min_tenure_months: "=tier_entry_min_tenure_months", badge_fee_usd: "=badge_replacement_fee_usd", freeze_hours: "=lost_badge_freeze_hours"}
  - id: meal_purchase_and_tender_rules
    subject: [meal_purchase_posted, meal_overdraft_fee_posted]
    rule: >
      A meal rung on the account is met from the tenders the plan allows, and where more than one is available they are taken in a fixed order: employer allowance first, then stored value, then payroll.
      A till transaction may not exceed the single transaction ceiling printed against the plan, and the account may not spend more across all tenders in one service day than the daily ceiling printed against the same plan; a meal that would breach either is rung for the part that fits and the rest is taken in cash or on the employee's own card.
      A meal is only rung while the account stands active or restricted; a restricted account may still spend stored value and allowance but may not tender against payroll, and an enrolled, parked or closed account is declined at the till.
      Where stored value is short, the plan's overdraft limit carries the transaction down to that limit and the overdraft charge printed against the plan is raised; a plan whose overdraft limit is zero declines the transaction instead.
      No more overdraft charges are raised in a calendar month than the count printed against the plan, and once that count is reached further short transactions are declined rather than charged.
      A guest meal is only rung on a plan that allows guest meals, carries the guest surcharge printed against the plan, and counts against the monthly guest meal allowance printed against the same plan; the guest surcharge is never met from employer allowance.
      A meal rung at an outlet outside the plan's allowance scope is still rung, but is met from stored value or payroll alone, since allowance does not travel outside the outlets the employer funds.
    eligibility:
      - id: spendable_state
        applies_to: [meal_purchase_posted, meal_overdraft_fee_posted]
        kind: state
        condition: A meal is only rung while the account stands active or restricted; a restricted account may still spend stored value and allowance but may not tender against payroll, and an enrolled, parked or closed account is declined at the till.
        evidence_fields: [meal_accounts.status, meal_accounts.meal_balance_usd, meal_accounts.subsidy_allowance_usd, meal_accounts.meal_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [meal_accounts.meal_account_id]
          action_bindings:
            meal_accounts.meal_account_id: meal_account_id
        state_contract:
          field: meal_accounts.status
          allowed: [active, restricted]
    params:
      per_tier:
        "Pay-As-You-Go Badge Account": {per_txn_cap_usd: "=per_transaction_cap_usd", daily_cap_usd: "=daily_spend_cap_usd", overdraft_limit_usd: "=overdraft_limit_usd", overdraft_fee_usd: "=overdraft_fee_usd", overdraft_count_max: "=overdraft_fees_per_month_max", guest_allowed: "=guest_meal_allowed", guest_surcharge_usd: "=guest_meal_surcharge_usd", guest_per_month: "=guest_meals_per_month", stacking: "=discount_stacking_basis"}
        "Prepaid Declining Balance Account": {per_txn_cap_usd: "=per_transaction_cap_usd", daily_cap_usd: "=daily_spend_cap_usd", overdraft_limit_usd: "=overdraft_limit_usd", overdraft_fee_usd: "=overdraft_fee_usd", overdraft_count_max: "=overdraft_fees_per_month_max", guest_allowed: "=guest_meal_allowed", guest_surcharge_usd: "=guest_meal_surcharge_usd", guest_per_month: "=guest_meals_per_month", stacking: "=discount_stacking_basis"}
        "Payroll Deduction Meal Account": {per_txn_cap_usd: "=per_transaction_cap_usd", daily_cap_usd: "=daily_spend_cap_usd", overdraft_limit_usd: "=overdraft_limit_usd", overdraft_fee_usd: "=overdraft_fee_usd", overdraft_count_max: "=overdraft_fees_per_month_max", guest_allowed: "=guest_meal_allowed", guest_surcharge_usd: "=guest_meal_surcharge_usd", guest_per_month: "=guest_meals_per_month", stacking: "=discount_stacking_basis"}
        "Subsidized Daily Allowance Account": {per_txn_cap_usd: "=per_transaction_cap_usd", daily_cap_usd: "=daily_spend_cap_usd", overdraft_limit_usd: "=overdraft_limit_usd", overdraft_fee_usd: "=overdraft_fee_usd", overdraft_count_max: "=overdraft_fees_per_month_max", guest_allowed: "=guest_meal_allowed", guest_surcharge_usd: "=guest_meal_surcharge_usd", guest_per_month: "=guest_meals_per_month", stacking: "=discount_stacking_basis"}
        "Full Subsidy Employee Meal Account": {per_txn_cap_usd: "=per_transaction_cap_usd", daily_cap_usd: "=daily_spend_cap_usd", overdraft_limit_usd: "=overdraft_limit_usd", overdraft_fee_usd: "=overdraft_fee_usd", overdraft_count_max: "=overdraft_fees_per_month_max", guest_allowed: "=guest_meal_allowed", guest_surcharge_usd: "=guest_meal_surcharge_usd", guest_per_month: "=guest_meals_per_month", stacking: "=discount_stacking_basis"}
        "Executive Dining Charge Account": {per_txn_cap_usd: "=per_transaction_cap_usd", daily_cap_usd: "=daily_spend_cap_usd", overdraft_limit_usd: "=overdraft_limit_usd", overdraft_fee_usd: "=overdraft_fee_usd", overdraft_count_max: "=overdraft_fees_per_month_max", guest_allowed: "=guest_meal_allowed", guest_surcharge_usd: "=guest_meal_surcharge_usd", guest_per_month: "=guest_meals_per_month", stacking: "=discount_stacking_basis"}
    formula:
      tender_from_balance_usd: max(0, amount_usd - subsidy_allowance_usd)
      overdraft_charge_usd: overdraft_fee_usd
    measures: [meal_msr_overdraft_fees_this_month, meal_msr_guest_meals_this_month]
  - id: meal_load_and_refund_terms
    subject: [meal_account_load_posted, meal_refund_posted]
    rule: >
      Stored value is loaded in amounts between the smallest and largest single load printed against the plan, and the account may not be carried above the balance ceiling printed against the same plan; a load that would breach the ceiling is taken down to the amount that fits.
      Where the plan carries an automatic reload, it fires once the balance falls to the reload threshold printed against the plan and adds the reload amount printed against it, and it fires no more than once in a service day.
      A load or a refund is only made while the account stands active or restricted, since an account that is parked or closed takes no value and an enrolled account has not yet been activated.
      A refund of a till transaction is only made where the request reaches Larkspur Table no later than the refund window for the meal plan, counted in calendar days from the day the till transaction was rung.
      Refund window days are counted as calendar days from the day after the transaction was rung, every day of the week counts, and a request arriving on the boundary day itself is still in time; calendar days are never converted into full 24-hour periods.
      A refund is returned by the method printed against the plan — to stored value, through payroll, or to the card originally used — and never by a method the employee chooses on the day.
      A refund smaller than the minimum printed against the plan is not made, and the employee is offered a replacement item instead.
      A refund of a transaction that was met from employer allowance restores that allowance rather than paying the employee, and the restored allowance keeps the expiry of the lot it came from rather than starting afresh.
    eligibility:
      - id: loadable_state
        applies_to: [meal_account_load_posted, meal_refund_posted]
        kind: state
        condition: A load or a refund is only made while the account stands active or restricted, since an account that is parked or closed takes no value and an enrolled account has not yet been activated.
        evidence_fields: [meal_accounts.status, meal_accounts.meal_balance_usd, meal_accounts.meal_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [meal_accounts.meal_account_id]
          action_bindings:
            meal_accounts.meal_account_id: meal_account_id
        state_contract:
          field: meal_accounts.status
          allowed: [active, restricted]
      - id: refund_window
        applies_to: [meal_refund_posted]
        kind: time
        condition: A refund of a till transaction is only made where the request reaches Larkspur Table no later than the refund window for the meal plan, counted in calendar days from the day the till transaction was rung.
        evidence_fields: [meal_transactions.posted_date, meal_transactions.pos_reference, meal_transactions.meal_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [meal_transactions.pos_reference]
          action_bindings:
            meal_transactions.pos_reference: original_pos_reference
        temporal_basis:
          clock: frozen_time
          anchor_event: the day the till transaction was rung
          anchor_source: meal_transactions.posted_date
          relation: not_after
          duration_source: variants.refund_request_window_days
          unit: calendar_days
          counting_rule: Refund window days are counted as calendar days from the day after the transaction was rung, every day of the week counts, and a request arriving on the boundary day itself is still in time; calendar days are never converted into full 24-hour periods.
          boundary: inclusive
    params:
      per_tier:
        "Pay-As-You-Go Badge Account": {min_load_usd: "=min_load_usd", max_load_usd: "=max_load_usd", max_balance_usd: "=max_balance_usd", reload_threshold_usd: "=auto_reload_threshold_usd", reload_amount_usd: "=auto_reload_amount_usd", refund_window_days: "=refund_request_window_days", refund_method: "=refund_method", refund_min_usd: "=refund_min_amount_usd"}
        "Prepaid Declining Balance Account": {min_load_usd: "=min_load_usd", max_load_usd: "=max_load_usd", max_balance_usd: "=max_balance_usd", reload_threshold_usd: "=auto_reload_threshold_usd", reload_amount_usd: "=auto_reload_amount_usd", refund_window_days: "=refund_request_window_days", refund_method: "=refund_method", refund_min_usd: "=refund_min_amount_usd"}
        "Payroll Deduction Meal Account": {min_load_usd: "=min_load_usd", max_load_usd: "=max_load_usd", max_balance_usd: "=max_balance_usd", reload_threshold_usd: "=auto_reload_threshold_usd", reload_amount_usd: "=auto_reload_amount_usd", refund_window_days: "=refund_request_window_days", refund_method: "=refund_method", refund_min_usd: "=refund_min_amount_usd"}
        "Subsidized Daily Allowance Account": {min_load_usd: "=min_load_usd", max_load_usd: "=max_load_usd", max_balance_usd: "=max_balance_usd", reload_threshold_usd: "=auto_reload_threshold_usd", reload_amount_usd: "=auto_reload_amount_usd", refund_window_days: "=refund_request_window_days", refund_method: "=refund_method", refund_min_usd: "=refund_min_amount_usd"}
        "Full Subsidy Employee Meal Account": {min_load_usd: "=min_load_usd", max_load_usd: "=max_load_usd", max_balance_usd: "=max_balance_usd", reload_threshold_usd: "=auto_reload_threshold_usd", reload_amount_usd: "=auto_reload_amount_usd", refund_window_days: "=refund_request_window_days", refund_method: "=refund_method", refund_min_usd: "=refund_min_amount_usd"}
        "Executive Dining Charge Account": {min_load_usd: "=min_load_usd", max_load_usd: "=max_load_usd", max_balance_usd: "=max_balance_usd", reload_threshold_usd: "=auto_reload_threshold_usd", reload_amount_usd: "=auto_reload_amount_usd", refund_window_days: "=refund_request_window_days", refund_method: "=refund_method", refund_min_usd: "=refund_min_amount_usd"}
  - id: meal_subsidy_grant_rules
    subject: [meal_subsidy_granted]
    rule: >
      Employer allowance is granted on the basis printed against the plan: a daily basis places the allowance on the account at the start of each service day, a monthly basis on the first day of the calendar month, and a plan whose basis is none is granted nothing at all.
      Each grant is recorded as its own allowance lot so that spending, lapsing and restoration can be traced lot by lot, and a lot may not exceed the grant ceiling printed against the plan for one grant period.
      A lot lapses the number of days printed against the plan after it was granted, and what is left of it is written off unless the plan allows rollover, in which case the unspent balance is carried into the next lot.
      Allowance is only granted while the account stands active or parked for leave, since an enrolled account has no badge in use and a restricted account keeps the allowance it already holds without receiving more.
      Where the plan prorates allowance for leave, a part month of recorded leave reduces the grant in proportion to the working days the employee was actually available; where it does not, the grant is made in full or not at all.
      Allowance granted in a year above the taxable benefit ceiling printed against the plan is reported to the employer for payroll treatment, and the grant itself is not reduced.
      Allowance restored by a refund is granted back to the lot the spending came from, and where that lot has already lapsed the allowance is not restored at all.
    eligibility:
      - id: grantable_state
        applies_to: [meal_subsidy_granted]
        kind: state
        condition: Allowance is only granted while the account stands active or parked for leave, since an enrolled account has no badge in use and a restricted account keeps the allowance it already holds without receiving more.
        evidence_fields: [meal_accounts.status, meal_accounts.subsidy_allowance_usd, meal_accounts.meal_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [meal_accounts.meal_account_id]
          action_bindings:
            meal_accounts.meal_account_id: meal_account_id
        state_contract:
          field: meal_accounts.status
          allowed: [active, suspended]
    params:
      per_tier:
