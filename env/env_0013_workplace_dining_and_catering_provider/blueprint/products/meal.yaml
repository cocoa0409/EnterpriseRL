category: meal
display_name: Employee Meal Account

binding:
  holding_table: meal_accounts
  event_tables: [meal_transactions]
  intake_tables: [meal_closure_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {meal_balance_usd: meal_balance, subsidy_allowance_usd: subsidy_allowance, payroll_arrears_usd: payroll_arrears}

lifecycle:
  states: [enrolled, active, restricted, suspended, closed]
  transitions:
    - {from: enrolled, to: active, by: system, means: the badge is registered at the till and the account opens for spending}
    - {from: active, to: restricted, by: agent, means: arrears pass the restriction threshold and payroll tender is switched off}
    - {from: restricted, to: active, by: agent, means: arrears are brought down and payroll tender is switched back on}
    - {from: active, to: suspended, by: agent, means: the employee goes on recorded leave and the account is parked}
    - {from: suspended, to: active, by: agent, means: the employee returns from leave and the account is unparked}
    - {from: active, to: closed, by: user, means: the employee closes the account, on leaving or on request}
    - {from: restricted, to: closed, by: agent, means: a restricted account is closed out once arrears are settled}
    - {from: suspended, to: closed, by: agent, means: a parked account is closed out when the employee does not return}
    - {from: enrolled, to: closed, by: agent, means: an enrolment is cancelled before the badge is ever used}

accounts:
  - key: meal_balance
    unit: USD
    meaning: spendable stored value the employee has on the account
  - key: subsidy_allowance
    unit: USD
    meaning: unspent employer meal allowance granted to the employee and not yet eaten
  - key: payroll_arrears
    unit: USD
    meaning: meal charges the employee has run up that payroll has not yet recovered

parameter_schema:
  enrollment_fee_usd: one-off charge to open an account on this plan, in USD
  min_load_usd: smallest single load of stored value the plan accepts, in USD
  max_load_usd: largest single load of stored value the plan accepts, in USD
  max_balance_usd: ceiling on stored value held on the account, in USD
  auto_reload_threshold_usd: balance at or below which an automatic reload is triggered, in USD
  auto_reload_amount_usd: value added by an automatic reload, in USD
  daily_spend_cap_usd: ceiling on what the account may spend across all tenders in one service day, in USD
  per_transaction_cap_usd: ceiling on a single till transaction, in USD
  guest_meal_allowed: whether the employee may ring a guest meal on the account, true or false
  guest_meal_surcharge_usd: surcharge added to each guest meal, in USD
  guest_meals_per_month: guest meals the plan allows in one calendar month, as a whole number
  subsidy_grant_basis: how often employer allowance is granted, one of none, daily, weekly or monthly
  subsidy_grant_amount_usd: allowance granted each grant period, in USD
  subsidy_grant_cap_per_period_usd: ceiling on allowance held for one grant period, in USD
  subsidy_expiry_days: calendar days an allowance lot stays spendable before it lapses
  subsidy_rollover_allowed: whether unspent allowance rolls into the next grant period, true or false
  subsidy_eligible_meal_periods: number of meal periods each day at which allowance may be spent, as a whole number
  subsidy_pct_of_ticket: share of an eligible till transaction allowance may meet, as a percentage
  subsidy_max_per_transaction_usd: ceiling on allowance applied to a single till transaction, in USD
  subsidy_venue_scope: where allowance may be spent, one of cafe_only, cafe_and_market or all_outlets
  payroll_deduction_enabled: whether meals may be tendered against payroll rather than stored value, true or false
  payroll_arrears_limit_usd: ceiling on charges awaiting payroll recovery, in USD
  payroll_deduction_cap_per_period_usd: ceiling on what one payroll period may recover, in USD
  payroll_deduction_lag_days: calendar days between a pay period closing and its deduction being remitted
  arrears_restriction_threshold_usd: arrears at which payroll tender is switched off, in USD
  arrears_restriction_grace_days: calendar days of grace after the threshold is passed before restriction applies
  reinstatement_min_payment_pct: share of outstanding arrears that must be paid before restriction is lifted, as a percentage
  overdraft_limit_usd: how far below zero stored value may go on a single till transaction, in USD
  overdraft_fee_usd: charge raised when a till transaction takes the balance below zero, in USD
  overdraft_fees_per_month_max: overdraft charges the plan raises in one calendar month, as a whole number
  refund_request_window_days: calendar days after a till transaction within which a refund may be asked for
  refund_method: where a refund is returned, one of to_balance, to_payroll or to_card
  refund_min_amount_usd: smallest amount the plan refunds, in USD
  balance_return_window_days: calendar days after closure within which unspent stored value is returned
  balance_return_min_usd: smallest unspent balance the plan returns at closure, in USD
  dormancy_months: months without a till transaction after which the account counts as dormant
  dormancy_fee_monthly_usd: monthly charge on a dormant account, in USD
  plan_change_window_days: calendar days each year during which the employee may change plan outside a life event
  plan_change_cooldown_months: months that must pass after a plan change before another is accepted
  plan_change_fee_usd: administration charge for a plan change, in USD
  plan_change_effective_basis: when a plan change takes effect, one of immediate, next_pay_period or next_month
  leave_max_months: longest recorded leave the account may be parked for, in whole months
  leave_subsidy_proration: whether allowance is prorated for part months of leave, true or false
  leave_reinstatement_lead_days: calendar days of notice needed to unpark an account on return from leave
  closure_notice_days: calendar days of notice the employee gives before the account closes
  statement_frequency: how often a statement is issued, one of none, monthly or per_pay_period
  mobile_order_enabled: whether the employee may order ahead from the mobile app, true or false
  badge_replacement_fee_usd: charge for replacing a lost site badge linked to the account, in USD
  lost_badge_freeze_hours: hours the account is frozen after a badge is reported lost, as a whole number
  discount_stacking_basis: how employer allowance and published discounts combine, one of best_of, additive or subsidy_first
  eligible_dependents: dependents who may be added to the account, as a whole number
  annual_taxable_benefit_cap_usd: employer allowance a year above which the benefit is reported as taxable, in USD
  tier_entry_min_tenure_months: months of service required to enrol on the plan, as a whole number
  max_accounts_per_employee: accounts on this plan one employee may hold at once, as a whole number

