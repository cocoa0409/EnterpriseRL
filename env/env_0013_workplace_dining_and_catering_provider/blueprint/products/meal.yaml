  - id: meal_subsidy_application_rules
    subject: [meal_subsidy_applied]
    rule: >
      Allowance is applied to a till transaction only where that transaction is eligible: rung in one of the meal periods the plan funds, at an outlet inside the allowance scope printed against the plan, and on the employee's own meal rather than a guest's.
      The allowance applied is the plan's share of the eligible ticket, held to the per transaction ceiling printed against the plan and to what is left in the employee's lots for the day.
      Lots are drawn oldest first, so a lot about to lapse is always spent before a fresher one, and a transaction that exhausts one lot takes the rest from the next, producing one application row per lot touched.
      Where the plan's stacking basis is subsidy_first, allowance is applied to the full menu price and any published discount is then applied to what remains; where it is additive, the discount is taken first and allowance meets the discounted ticket; and where it is best_of, whichever of the two leaves the employee paying less is used and the other is not applied at all.
      Allowance is only applied while the account stands active, since a restricted account is settling arrears and a parked account is not eating.
      Where the eligible ticket is smaller than the allowance available, only the ticket is met and the remainder stays in the lot until it lapses; allowance is never paid out as value.
      A transaction rung outside the funded meal periods draws no allowance however much is left in the lots, and the employee pays it from stored value or payroll.
    eligibility:
      - id: applicable_state
        applies_to: [meal_subsidy_applied]
        kind: state
        condition: Allowance is only applied while the account stands active, since a restricted account is settling arrears and a parked account is not eating.
        evidence_fields: [meal_accounts.status, meal_accounts.subsidy_allowance_usd, meal_accounts.meal_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [meal_accounts.meal_account_id]
          action_bindings:
            meal_accounts.meal_account_id: meal_account_id
        state_contract:
          field: meal_accounts.status
          allowed: [active]
    params:
      per_tier:
        "Pay-As-You-Go Badge Account": {pct_of_ticket: "=subsidy_pct_of_ticket", per_txn_cap_usd: "=subsidy_max_per_transaction_usd", eligible_periods: "=subsidy_eligible_meal_periods", scope: "=subsidy_venue_scope", stacking: "=discount_stacking_basis"}
        "Prepaid Declining Balance Account": {pct_of_ticket: "=subsidy_pct_of_ticket", per_txn_cap_usd: "=subsidy_max_per_transaction_usd", eligible_periods: "=subsidy_eligible_meal_periods", scope: "=subsidy_venue_scope", stacking: "=discount_stacking_basis"}
        "Payroll Deduction Meal Account": {pct_of_ticket: "=subsidy_pct_of_ticket", per_txn_cap_usd: "=subsidy_max_per_transaction_usd", eligible_periods: "=subsidy_eligible_meal_periods", scope: "=subsidy_venue_scope", stacking: "=discount_stacking_basis"}
        "Subsidized Daily Allowance Account": {pct_of_ticket: "=subsidy_pct_of_ticket", per_txn_cap_usd: "=subsidy_max_per_transaction_usd", eligible_periods: "=subsidy_eligible_meal_periods", scope: "=subsidy_venue_scope", stacking: "=discount_stacking_basis"}
        "Full Subsidy Employee Meal Account": {pct_of_ticket: "=subsidy_pct_of_ticket", per_txn_cap_usd: "=subsidy_max_per_transaction_usd", eligible_periods: "=subsidy_eligible_meal_periods", scope: "=subsidy_venue_scope", stacking: "=discount_stacking_basis"}
        "Executive Dining Charge Account": {pct_of_ticket: "=subsidy_pct_of_ticket", per_txn_cap_usd: "=subsidy_max_per_transaction_usd", eligible_periods: "=subsidy_eligible_meal_periods", scope: "=subsidy_venue_scope", stacking: "=discount_stacking_basis"}
    formula:
      allowance_left_today_usd: max(0, subsidy_grant_amount_usd - meal_msr_subsidy_drawn_today)
      amount_usd: min(round(amount_usd * subsidy_pct_of_ticket / 100, 2), subsidy_max_per_transaction_usd, allowance_left_today_usd)
    measures: [meal_msr_subsidy_drawn_today]
  - id: meal_payroll_recovery_terms
    subject: [meal_charge_accrued, meal_payroll_deduction_posted]
    rule: >
      A meal tendered against payroll is added to the charges awaiting recovery and carries the payroll period it belongs to, so that every charge can be matched to the pay packet that will recover it.
      Payroll tender is only available on a plan that enables it, and the charges awaiting recovery may not pass the arrears ceiling printed against the plan; a meal that would take them past it is declined for payroll and met from stored value instead.
      A payroll period's charges are remitted the number of days after the period closes printed against the plan, and no more than the deduction ceiling printed against the same plan is recovered in one period; what is left over rolls into the next period.
      A recovery is only posted while the account stands active, restricted, parked for leave or closed, because a leaver's last charges are still recovered from their final pay.
      Where an employee leaves with charges still awaiting recovery, the whole outstanding balance is recovered in the final pay period whatever the deduction ceiling says, and where final pay does not cover it, the balance is passed to the employer to collect.
      A charge accrued in error is reversed against the same payroll period it was accrued in, never against a later one, so that the employee's payslip and the account agree.
      An employee on recorded leave accrues no new charges, because the account is parked and the badge is declined at the till.
    eligibility:
      - id: recoverable_state
        applies_to: [meal_charge_accrued, meal_payroll_deduction_posted]
        kind: state
        condition: A recovery is only posted while the account stands active, restricted, parked for leave or closed, because a leaver's last charges are still recovered from their final pay.
        evidence_fields: [meal_accounts.status, meal_accounts.payroll_arrears_usd, meal_accounts.payroll_cycle, meal_accounts.meal_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [meal_accounts.meal_account_id]
          action_bindings:
            meal_accounts.meal_account_id: meal_account_id
        state_contract:
          field: meal_accounts.status
          allowed: [active, restricted, suspended, closed]
    params:
      per_tier:
        "Pay-As-You-Go Badge Account": {payroll_enabled: "=payroll_deduction_enabled", arrears_limit_usd: "=payroll_arrears_limit_usd", period_cap_usd: "=payroll_deduction_cap_per_period_usd", lag_days: "=payroll_deduction_lag_days"}
        "Prepaid Declining Balance Account": {payroll_enabled: "=payroll_deduction_enabled", arrears_limit_usd: "=payroll_arrears_limit_usd", period_cap_usd: "=payroll_deduction_cap_per_period_usd", lag_days: "=payroll_deduction_lag_days"}
        "Payroll Deduction Meal Account": {payroll_enabled: "=payroll_deduction_enabled", arrears_limit_usd: "=payroll_arrears_limit_usd", period_cap_usd: "=payroll_deduction_cap_per_period_usd", lag_days: "=payroll_deduction_lag_days"}
        "Subsidized Daily Allowance Account": {payroll_enabled: "=payroll_deduction_enabled", arrears_limit_usd: "=payroll_arrears_limit_usd", period_cap_usd: "=payroll_deduction_cap_per_period_usd", lag_days: "=payroll_deduction_lag_days"}
        "Full Subsidy Employee Meal Account": {payroll_enabled: "=payroll_deduction_enabled", arrears_limit_usd: "=payroll_arrears_limit_usd", period_cap_usd: "=payroll_deduction_cap_per_period_usd", lag_days: "=payroll_deduction_lag_days"}
        "Executive Dining Charge Account": {payroll_enabled: "=payroll_deduction_enabled", arrears_limit_usd: "=payroll_arrears_limit_usd", period_cap_usd: "=payroll_deduction_cap_per_period_usd", lag_days: "=payroll_deduction_lag_days"}
    formula:
      recovered_this_period_usd: min(payroll_arrears_usd, payroll_deduction_cap_per_period_usd)
    measures: [meal_msr_arrears_outstanding]
  - id: meal_restriction_terms
    subject: [meal_account_restricted, meal_account_reinstated]
    rule: >
      Payroll tender is switched off once the charges awaiting recovery pass the restriction threshold printed against the plan and the grace days printed against the same plan have gone by without the balance coming down.
      A restriction or a reinstatement is only worked while the account stands active or restricted, since a parked, enrolled or closed account has no payroll tender to switch.
      A restricted account keeps its stored value and its allowance and may go on eating; only the payroll tender is withdrawn, and the badge is not blocked.
      The restriction is lifted once the employee has paid down at least the share of the outstanding arrears printed against their plan, whether by loading value, by a one-off payment or by a payroll period clearing.
      Where the plan requires the whole balance paid, a part payment does not lift the restriction however large it is, and the employee is told exactly what remains.
      A restriction applied in error is lifted at once and no charge falls due, and any meal declined for payroll while it stood may be rung again on the ordinary tender order.
      Where an employee holds more than one account under the same employer, the arrears measured against the threshold are the portfolio total rather than the single account's.
    eligibility:
      - id: restriction_state
        applies_to: [meal_account_restricted, meal_account_reinstated]
        kind: state
        condition: A restriction or a reinstatement is only worked while the account stands active or restricted, since a parked, enrolled or closed account has no payroll tender to switch.
        evidence_fields: [meal_accounts.status, meal_accounts.payroll_arrears_usd, meal_accounts.restriction_start_date, meal_accounts.meal_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [meal_accounts.meal_account_id]
          action_bindings:
            meal_accounts.meal_account_id: meal_account_id
        state_contract:
          field: meal_accounts.status
          allowed: [active, restricted]
    params:
      per_tier:
        "Pay-As-You-Go Badge Account": {threshold_usd: "=arrears_restriction_threshold_usd", grace_days: "=arrears_restriction_grace_days", reinstate_pct: "=reinstatement_min_payment_pct"}
        "Prepaid Declining Balance Account": {threshold_usd: "=arrears_restriction_threshold_usd", grace_days: "=arrears_restriction_grace_days", reinstate_pct: "=reinstatement_min_payment_pct"}
        "Payroll Deduction Meal Account": {threshold_usd: "=arrears_restriction_threshold_usd", grace_days: "=arrears_restriction_grace_days", reinstate_pct: "=reinstatement_min_payment_pct"}
        "Subsidized Daily Allowance Account": {threshold_usd: "=arrears_restriction_threshold_usd", grace_days: "=arrears_restriction_grace_days", reinstate_pct: "=reinstatement_min_payment_pct"}
        "Full Subsidy Employee Meal Account": {threshold_usd: "=arrears_restriction_threshold_usd", grace_days: "=arrears_restriction_grace_days", reinstate_pct: "=reinstatement_min_payment_pct"}
        "Executive Dining Charge Account": {threshold_usd: "=arrears_restriction_threshold_usd", grace_days: "=arrears_restriction_grace_days", reinstate_pct: "=reinstatement_min_payment_pct"}
    formula:
      reinstatement_payment_usd: round(payroll_arrears_usd * reinstatement_min_payment_pct / 100, 2)
    measures: [meal_msr_arrears_outstanding]
  - id: meal_leave_and_closure_terms
    subject: [meal_account_leave_status_changed, meal_account_closed]
    rule: >
      An account is parked for recorded leave at the employer's instruction and unparked when the employee returns, and it may stay parked no longer than the leave ceiling printed against the plan before it is closed instead.
      A parking, an unparking or a closure is only worked while the account stands active, parked for leave or closed, and an account still enrolled is cancelled rather than parked.
      Unparking needs the notice printed against the plan, counted in calendar days, so that allowance can be rebuilt before the employee returns to the counter.
      Only the employee may close their own meal account, and the desk records the request for the employee to confirm rather than closing it on their word alone; a closure needs the notice printed against the plan.
      Unspent stored value is returned no later than the balance return window for the meal plan, counted in calendar days from the day the account is closed.
      Balance return days are counted as calendar days from the day after closure, every day of the week counts, and a return made on the boundary day itself is in time; calendar days are never converted into full 24-hour periods.
      A balance below the minimum return printed against the plan is not returned, and a plan whose return window is zero holds no stored value to return in the first place.
      Unspent employer allowance is never returned to the employee at closure; it goes back to the employer's funding, since it was never the employee's money.
      Charges awaiting payroll recovery are settled before closure, from stored value first and then from final pay, and an account is not closed while arrears stand unrecovered and no final pay is due.
    eligibility:
      - id: closure_state
        applies_to: [meal_account_leave_status_changed, meal_account_closed]
        kind: state
        condition: A parking, an unparking or a closure is only worked while the account stands active, parked for leave or closed, and an account still enrolled is cancelled rather than parked.
        evidence_fields: [meal_accounts.status, meal_accounts.meal_balance_usd, meal_accounts.payroll_arrears_usd, meal_accounts.meal_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [meal_accounts.meal_account_id]
          action_bindings:
            meal_accounts.meal_account_id: meal_account_id
        state_contract:
          field: meal_accounts.status
          allowed: [active, suspended, closed]
      - id: balance_return_window
        applies_to: [meal_account_closed]
        kind: time
        condition: Unspent stored value is returned no later than the balance return window for the meal plan, counted in calendar days from the day the account is closed.
        evidence_fields: [meal_accounts.closed_date, meal_accounts.meal_balance_usd, meal_accounts.meal_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [meal_accounts.meal_account_id]
          action_bindings:
            meal_accounts.meal_account_id: meal_account_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the day the account is closed
          anchor_source: meal_accounts.closed_date
          relation: not_after
          duration_source: variants.balance_return_window_days
          unit: calendar_days
          counting_rule: Balance return days are counted as calendar days from the day after closure, every day of the week counts, and a return made on the boundary day itself is in time; calendar days are never converted into full 24-hour periods.
          boundary: inclusive
    params:
      per_tier:
        "Pay-As-You-Go Badge Account": {leave_max_months: "=leave_max_months", unpark_lead_days: "=leave_reinstatement_lead_days", closure_notice_days: "=closure_notice_days", return_window_days: "=balance_return_window_days", return_min_usd: "=balance_return_min_usd", dormancy_months: "=dormancy_months", dormancy_fee_usd: "=dormancy_fee_monthly_usd"}
        "Prepaid Declining Balance Account": {leave_max_months: "=leave_max_months", unpark_lead_days: "=leave_reinstatement_lead_days", closure_notice_days: "=closure_notice_days", return_window_days: "=balance_return_window_days", return_min_usd: "=balance_return_min_usd", dormancy_months: "=dormancy_months", dormancy_fee_usd: "=dormancy_fee_monthly_usd"}
        "Payroll Deduction Meal Account": {leave_max_months: "=leave_max_months", unpark_lead_days: "=leave_reinstatement_lead_days", closure_notice_days: "=closure_notice_days", return_window_days: "=balance_return_window_days", return_min_usd: "=balance_return_min_usd", dormancy_months: "=dormancy_months", dormancy_fee_usd: "=dormancy_fee_monthly_usd"}
        "Subsidized Daily Allowance Account": {leave_max_months: "=leave_max_months", unpark_lead_days: "=leave_reinstatement_lead_days", closure_notice_days: "=closure_notice_days", return_window_days: "=balance_return_window_days", return_min_usd: "=balance_return_min_usd", dormancy_months: "=dormancy_months", dormancy_fee_usd: "=dormancy_fee_monthly_usd"}
        "Full Subsidy Employee Meal Account": {leave_max_months: "=leave_max_months", unpark_lead_days: "=leave_reinstatement_lead_days", closure_notice_days: "=closure_notice_days", return_window_days: "=balance_return_window_days", return_min_usd: "=balance_return_min_usd", dormancy_months: "=dormancy_months", dormancy_fee_usd: "=dormancy_fee_monthly_usd"}
        "Executive Dining Charge Account": {leave_max_months: "=leave_max_months", unpark_lead_days: "=leave_reinstatement_lead_days", closure_notice_days: "=closure_notice_days", return_window_days: "=balance_return_window_days", return_min_usd: "=balance_return_min_usd", dormancy_months: "=dormancy_months", dormancy_fee_usd: "=dormancy_fee_monthly_usd"}
  - id: meal_plan_change_terms
    subject: [meal_plan_changed]
    rule: >
      An employee may move onto a different meal plan without closing the account, provided they meet the entry gate of the plan they are moving to on length of service, payroll consent and manager approval.
      A change is accepted during the annual change window printed against the plan in force, or at any time on a recorded life event such as a move between sites, a change of employer programme or a return from long leave.
      A change is only accepted once the cooldown printed against the plan in force has passed since the last plan change on this account, and a plan that has never been changed carries no cooldown.
      The change takes effect on the basis printed against the plan being moved to — at once, at the start of the next payroll period, or on the first day of the next month — and the administration charge printed against that plan is raised on the account when it takes effect.
      From the effective day the whole parameter column of the new plan applies together: ceilings, allowance, payroll terms, overdraft, refunds and closure terms all move at once, and no parameter of the old plan survives.
      Allowance lots granted under the old plan keep their own expiry and are spent under the rules they were granted under, so an employee changing plan mid-month does not lose allowance already on the account.
      Charges awaiting payroll recovery move with the account and are recovered under the new plan's deduction ceiling from the effective day onward.
      Where the employee does not meet the entry gate of the plan asked for, the change is declined and the highest plan whose gate they do meet is offered instead.
    eligibility:
      - id: change_state
        applies_to: [meal_plan_changed]
        kind: state
        condition: An employee may move onto a different meal plan without closing the account, provided they meet the entry gate of the plan they are moving to on length of service, payroll consent and manager approval.
        evidence_fields: [meal_accounts.status, meal_accounts.variant_name, meal_accounts.plan_change_effective_date, meal_accounts.meal_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [meal_accounts.meal_account_id]
          action_bindings:
            meal_accounts.meal_account_id: meal_account_id
        state_contract:
          field: meal_accounts.status
          allowed: [active, restricted]
    params:
      per_tier:
        "Pay-As-You-Go Badge Account": {change_window_days: "=plan_change_window_days", cooldown_months: "=plan_change_cooldown_months", change_fee_usd: "=plan_change_fee_usd", effective_basis: "=plan_change_effective_basis", min_tenure_months: "=tier_entry_min_tenure_months"}
        "Prepaid Declining Balance Account": {change_window_days: "=plan_change_window_days", cooldown_months: "=plan_change_cooldown_months", change_fee_usd: "=plan_change_fee_usd", effective_basis: "=plan_change_effective_basis", min_tenure_months: "=tier_entry_min_tenure_months"}
        "Payroll Deduction Meal Account": {change_window_days: "=plan_change_window_days", cooldown_months: "=plan_change_cooldown_months", change_fee_usd: "=plan_change_fee_usd", effective_basis: "=plan_change_effective_basis", min_tenure_months: "=tier_entry_min_tenure_months"}
        "Subsidized Daily Allowance Account": {change_window_days: "=plan_change_window_days", cooldown_months: "=plan_change_cooldown_months", change_fee_usd: "=plan_change_fee_usd", effective_basis: "=plan_change_effective_basis", min_tenure_months: "=tier_entry_min_tenure_months"}
        "Full Subsidy Employee Meal Account": {change_window_days: "=plan_change_window_days", cooldown_months: "=plan_change_cooldown_months", change_fee_usd: "=plan_change_fee_usd", effective_basis: "=plan_change_effective_basis", min_tenure_months: "=tier_entry_min_tenure_months"}
        "Executive Dining Charge Account": {change_window_days: "=plan_change_window_days", cooldown_months: "=plan_change_cooldown_months", change_fee_usd: "=plan_change_fee_usd", effective_basis: "=plan_change_effective_basis", min_tenure_months: "=tier_entry_min_tenure_months"}
  - id: meal_combination_employer_program_interaction
    subject: [meal_purchase_posted, meal_subsidy_applied]
    rule: >
      What the employer holds at the site changes where an employee's allowance reaches and what the account may do.
      Where the employer holds an active workplace cafe management contract at the account's site, allowance is spendable at the cafe counter, and the employer's own subsidy funding meets the drawdown behind it; where that contract stands suspended, the counter is shut and no allowance is spent there.
      Where the employer also holds an active micro market at the site and the plan's allowance scope reaches beyond the cafe, allowance is spendable at the kiosk as well, and the employee's daily ceiling is read across both outlets together rather than once at each.
      Where the plan's allowance scope is limited to the cafe, a purchase at the kiosk draws no allowance however much is left, and the employee pays it from stored value or payroll.
      A meal account and an employer's catering agreement never interact: food ordered on a catering agreement is the employer's purchase, and an employee may not put a catering order on their meal account.
      Where the employer's cafe contract closes and no micro market stands at the site, the account keeps its stored value and its payroll terms, but no further allowance is granted, since there is no programme left to fund it.
    eligibility: []
    params:
      per_tier:
        "Pay-As-You-Go Badge Account": {scope: "=subsidy_venue_scope", daily_cap_shared_across_outlets: false}
        "Prepaid Declining Balance Account": {scope: "=subsidy_venue_scope", daily_cap_shared_across_outlets: false}
        "Payroll Deduction Meal Account": {scope: "=subsidy_venue_scope", daily_cap_shared_across_outlets: false}
        "Subsidized Daily Allowance Account": {scope: "=subsidy_venue_scope", daily_cap_shared_across_outlets: true}
        "Full Subsidy Employee Meal Account": {scope: "=subsidy_venue_scope", daily_cap_shared_across_outlets: true}
        "Executive Dining Charge Account": {scope: "=subsidy_venue_scope", daily_cap_shared_across_outlets: true}
