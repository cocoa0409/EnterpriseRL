category: pantry
display_name: Office Pantry & Beverage Program

binding:
  holding_table: pantry_agreements
  event_tables: [pantry_ledger]
  status_field: status
  variant_field: variant_name
  quantity_fields: {receivable_balance_usd: pantry_receivable}

lifecycle:
  states: [proposed, active, paused, closed]
  transitions:
    - {from: proposed, to: active, by: agent, means: the client signs and the first standing delivery is made}
    - {from: active, to: paused, by: agent, means: deliveries stop at the client's instruction while the agreement stands}
    - {from: paused, to: active, by: agent, means: standing deliveries start again}
    - {from: active, to: closed, by: user, means: the client ends the programme and equipment is collected}
    - {from: paused, to: closed, by: agent, means: a paused programme is closed out rather than restarted}
    - {from: proposed, to: closed, by: agent, means: the proposal is withdrawn or declined before signature}

accounts:
  - key: pantry_receivable
    unit: USD
    meaning: amounts invoiced to the client for the pantry programme and not yet settled

parameter_schema:
  program_fee_monthly_usd: standard monthly programme fee for the pantry tier, in USD
  per_head_monthly_usd: monthly charge for each badged employee served, in USD
  min_headcount: smallest badged headcount the tier is written for, as a whole number
  max_headcount: largest badged headcount the tier serves from one pantry, as a whole number
  deliveries_per_week: standing replenishment deliveries each week, as a whole number
  delivery_window_hours: length of each standing delivery window, to one decimal place
  sku_count: distinct products carried on the standing list, as a whole number
  fresh_sku_count: distinct fresh and chilled products carried, as a whole number
  coffee_brands_offered: distinct coffee brands on the standing list, as a whole number
  espresso_machine_included: whether a bean-to-cup espresso machine is part of the tier, true or false
  water_filtration_included: whether plumbed filtered water is part of the tier, true or false
  barista_hours_per_week: attended barista hours included each week, to one decimal place
  barista_rate_per_hour_usd: billed rate for each additional barista hour, in USD
  product_allowance_monthly_usd: product value included in the programme fee each month, in USD
  overage_markup_pct: markup applied to product taken above the monthly allowance, as a percentage
  overage_grace_pct: consumption above the allowance absorbed without charge, as a percentage of the allowance
  rush_delivery_fee_usd: charge for an unscheduled replenishment asked for by the client, in USD
  rush_delivery_lead_hours: shortest notice at which an unscheduled replenishment is accepted, in whole hours
  standard_order_lead_days: calendar days of notice needed to change the standing list
  order_change_deadline_hours: hours before a delivery after which its contents are fixed
  seasonal_item_count: seasonal products rotated onto the list each quarter, as a whole number
  dietary_range_level: depth of the dietary and allergen range carried, one of basic, standard or enhanced
  paper_goods_included: whether cups, napkins and cutlery are included in the programme fee, true or false
  equipment_service_visits_per_year: planned service visits to pantry equipment each year, as a whole number
  equipment_deposit_usd: refundable deposit held for pantry equipment, in USD
  equipment_removal_fee_usd: charge for collecting equipment at closure, in USD
  install_fee_usd: one-off charge for fitting shelving, dispensers and machines, in USD
  install_lead_days: calendar days of fitting lead time before the first delivery
  contract_term_months: standard initial term of the agreement, in whole months
  termination_notice_days: calendar days of written notice required to end the agreement
  early_termination_fee_usd: charge for ending the agreement before the end of the term, in USD
  min_pause_days: shortest delivery pause the tier accepts, in calendar days
  max_pause_days_per_year: ceiling on paused calendar days in one contract year
  pause_standby_fee_usd: monthly charge while deliveries stand paused, in USD
  resume_lead_days: calendar days of notice needed to restart standing deliveries
  invoice_cycle_day: day of the month the programme invoice is raised, from 1 to 28
  payment_terms_days: calendar days from the invoice date within which payment is due
  late_fee_monthly_pct: monthly late charge on an overdue pantry invoice, as a percentage of the overdue amount
  late_fee_grace_days: calendar days past the due date before a late charge may be raised
  late_fee_cap_usd: ceiling on the late charge raised against one pantry invoice, in USD
  credit_hold_threshold_days_past_due: days past due at which standing deliveries stop
  missed_delivery_credit_pct: credit for each missed standing delivery, as a percentage of the monthly programme fee
  service_credit_cap_pct_of_program_fee: ceiling on credits allowed in one billing period, as a percentage of the monthly programme fee
  service_credit_claim_window_days: calendar days after the covering invoice within which a credit claim is accepted
  substitution_allowed_pct: share of a delivery that may be substituted when a product is short, as a percentage
  waste_reporting_included: whether monthly waste and consumption reporting is included, true or false
  annual_price_escalation_pct: contractual annual escalation applied to the programme fee, as a percentage
  price_increase_notice_days: calendar days of notice given before product prices rise
  portfolio_fee_discount_ladder: threshold ladder mapping the number of pantry programmes the client holds to the programme fee discount percentage
  min_annual_spend_usd: annual pantry spend the tier is written against, in USD
  consumption_review_frequency_months: months between consumption reviews with the client, as a whole number
  restock_call_out_fee_usd: charge for an emergency restock outside the delivery schedule, in USD

