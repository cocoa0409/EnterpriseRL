  - id: pantry_combination_cafe_interaction
    subject: [pantry_program_fee_invoiced, pantry_delivery_posted]
    rule: >
      What a client holds elsewhere in the dining programme changes what the pantry charges and how it is delivered.
      Where the same client holds an active workplace cafe management contract at the pantry's site, pantry deliveries ride the cafe's own delivery run and the rush delivery charge is not raised on an unscheduled replenishment at that site.
      Where the same client holds an active micro market at the pantry's site, the pantry's standing list is trimmed of the product groups the market already carries, and the product allowance printed against the pantry tier is unchanged, since the allowance prices the pantry rather than the site.
      A barista bar programme and an executive dining cafe at the same site are mutually exclusive: the barista bar is served from the executive kitchen and is written into that contract rather than held as a separate pantry programme.
      Where the cafe contract at the site closes or stands suspended, pantry deliveries move onto the district round and the rush delivery charge applies again from the next unscheduled replenishment.
    eligibility: []
    params:
      per_tier:
        "Coffee & Tea Service": {rush_fee_waived_with_cafe: true, trim_list_with_market: true}
        "Standard Snack Pantry": {rush_fee_waived_with_cafe: true, trim_list_with_market: true}
        "Fresh Pantry Program": {rush_fee_waived_with_cafe: true, trim_list_with_market: true}
        "Barista Bar Program": {rush_fee_waived_with_cafe: false, trim_list_with_market: false}
        "Full Hospitality Pantry Program": {rush_fee_waived_with_cafe: true, trim_list_with_market: true}
        "Campus Pantry Network Program": {rush_fee_waived_with_cafe: true, trim_list_with_market: true}
