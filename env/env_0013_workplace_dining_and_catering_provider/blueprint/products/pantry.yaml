    params: {max_per_customer: null, max_open_programs_per_site: 1}
  - id: pantry_agg_portfolio_fee_band
    subject: [pantry_program_fee_invoiced]
    rule: >
      The programme fee is discounted by a portfolio band that reads the client's whole pantry estate rather than the single site being invoiced.
      The band is found by counting the client's pantry programmes standing active or paused on the day the invoice is raised, then taking the highest ladder step whose programme count does not exceed that number, using the ladder printed against the tier of the programme being invoiced.
      The discount applies to the programme fee alone; per-head charges, product overage, rush deliveries and equipment charges carry no portfolio discount.
      Programmes still proposed and programmes already closed are outside the count.
      Where the estate changes part way through a billing period, the count on the invoice day governs that whole invoice and earlier invoices are not reopened.
    eligibility: []
    params:
      per_tier:
        "Coffee & Tea Service": {ladder: "=portfolio_fee_discount_ladder", fee_usd: "=program_fee_monthly_usd"}
        "Standard Snack Pantry": {ladder: "=portfolio_fee_discount_ladder", fee_usd: "=program_fee_monthly_usd"}
        "Fresh Pantry Program": {ladder: "=portfolio_fee_discount_ladder", fee_usd: "=program_fee_monthly_usd"}
        "Barista Bar Program": {ladder: "=portfolio_fee_discount_ladder", fee_usd: "=program_fee_monthly_usd"}
        "Full Hospitality Pantry Program": {ladder: "=portfolio_fee_discount_ladder", fee_usd: "=program_fee_monthly_usd"}
        "Campus Pantry Network Program": {ladder: "=portfolio_fee_discount_ladder", fee_usd: "=program_fee_monthly_usd"}
    measures: [pantry_msr_active_program_count]
  - id: pantry_onboarding_terms
    subject: [pantry_agreement_opened, pantry_service_commenced]
    rule: >
      A pantry programme is drawn up as a proposal against the tier whose entry gate the site meets on headcount, plumbed water, storage space and annual spend, and it starts with the first standing delivery.
      The fitting charge and the refundable equipment deposit printed against the tier are invoiced when the programme starts, and a proposal withdrawn before signature carries neither.
      A programme is only opened or started while it stands proposed or already active, and a proposal withdrawn before signature closes without charge.
      Fitting takes the lead days printed against the tier, counted in calendar days from signature, and the first delivery is scheduled on the standing delivery weekday on or after that lead time.
      Where the site does not meet the entry gate of the tier asked for, the programme is written at the highest tier whose entry gate the site does meet.
      The standing list is set at the start from the product count printed against the tier, and changes to it need the order lead days printed against the same tier.
    eligibility:
      - id: onboarding_state
        applies_to: [pantry_agreement_opened, pantry_service_commenced]
        kind: state
        condition: A programme is only opened or started while it stands proposed or already active, and a proposal withdrawn before signature closes without charge.
        evidence_fields: [pantry_agreements.status, pantry_agreements.pantry_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [pantry_agreements.pantry_agreement_id]
          action_bindings:
            pantry_agreements.pantry_agreement_id: pantry_agreement_id
        state_contract:
          field: pantry_agreements.status
          allowed: [proposed, active]
    params:
      per_tier:
        "Coffee & Tea Service": {install_fee_usd: "=install_fee_usd", deposit_usd: "=equipment_deposit_usd", lead_days: "=install_lead_days", order_lead_days: "=standard_order_lead_days"}
        "Standard Snack Pantry": {install_fee_usd: "=install_fee_usd", deposit_usd: "=equipment_deposit_usd", lead_days: "=install_lead_days", order_lead_days: "=standard_order_lead_days"}
        "Fresh Pantry Program": {install_fee_usd: "=install_fee_usd", deposit_usd: "=equipment_deposit_usd", lead_days: "=install_lead_days", order_lead_days: "=standard_order_lead_days"}
        "Barista Bar Program": {install_fee_usd: "=install_fee_usd", deposit_usd: "=equipment_deposit_usd", lead_days: "=install_lead_days", order_lead_days: "=standard_order_lead_days"}
        "Full Hospitality Pantry Program": {install_fee_usd: "=install_fee_usd", deposit_usd: "=equipment_deposit_usd", lead_days: "=install_lead_days", order_lead_days: "=standard_order_lead_days"}
        "Campus Pantry Network Program": {install_fee_usd: "=install_fee_usd", deposit_usd: "=equipment_deposit_usd", lead_days: "=install_lead_days", order_lead_days: "=standard_order_lead_days"}
  - id: pantry_delivery_terms
    subject: [pantry_delivery_posted]
    rule: >
      Standing deliveries are made on the weekday recorded on the programme, at the number of visits a week and within the window printed against the tier.
      The contents of a delivery are fixed the number of hours before it printed against the tier, and a change asked for later than that is made on the following delivery instead.
      Where a product on the standing list is short, it is substituted with an equivalent up to the substitution share printed against the tier; beyond that share the delivery is made short and the shortfall is credited.
      An unscheduled replenishment asked for by the client carries the rush delivery charge printed against the tier and is only accepted at or beyond the rush lead hours printed against the same tier.
      An emergency restock outside the delivery schedule carries the call-out charge printed against the tier, and is distinct from a rush replenishment because it is unplanned on both sides.
      Deliveries are only made while the programme stands active; a paused programme takes no delivery, and a closed programme takes none at all.
      Fresh items are delivered only on tiers whose fresh product count is above zero, and a client asking for fresh items on a tier without them is offered the tier that carries them.
    eligibility:
      - id: deliverable_state
        applies_to: [pantry_delivery_posted]
        kind: state
        condition: Deliveries are only made while the programme stands active; a paused programme takes no delivery, and a closed programme takes none at all.
        evidence_fields: [pantry_agreements.status, pantry_agreements.delivery_day, pantry_agreements.pantry_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [pantry_agreements.pantry_agreement_id]
          action_bindings:
            pantry_agreements.pantry_agreement_id: pantry_agreement_id
        state_contract:
          field: pantry_agreements.status
          allowed: [active]
    params:
      per_tier:
        "Coffee & Tea Service": {visits_per_week: "=deliveries_per_week", window_hours: "=delivery_window_hours", change_deadline_hours: "=order_change_deadline_hours", substitution_pct: "=substitution_allowed_pct", rush_fee_usd: "=rush_delivery_fee_usd", rush_lead_hours: "=rush_delivery_lead_hours", call_out_usd: "=restock_call_out_fee_usd"}
        "Standard Snack Pantry": {visits_per_week: "=deliveries_per_week", window_hours: "=delivery_window_hours", change_deadline_hours: "=order_change_deadline_hours", substitution_pct: "=substitution_allowed_pct", rush_fee_usd: "=rush_delivery_fee_usd", rush_lead_hours: "=rush_delivery_lead_hours", call_out_usd: "=restock_call_out_fee_usd"}
        "Fresh Pantry Program": {visits_per_week: "=deliveries_per_week", window_hours: "=delivery_window_hours", change_deadline_hours: "=order_change_deadline_hours", substitution_pct: "=substitution_allowed_pct", rush_fee_usd: "=rush_delivery_fee_usd", rush_lead_hours: "=rush_delivery_lead_hours", call_out_usd: "=restock_call_out_fee_usd"}
        "Barista Bar Program": {visits_per_week: "=deliveries_per_week", window_hours: "=delivery_window_hours", change_deadline_hours: "=order_change_deadline_hours", substitution_pct: "=substitution_allowed_pct", rush_fee_usd: "=rush_delivery_fee_usd", rush_lead_hours: "=rush_delivery_lead_hours", call_out_usd: "=restock_call_out_fee_usd"}
        "Full Hospitality Pantry Program": {visits_per_week: "=deliveries_per_week", window_hours: "=delivery_window_hours", change_deadline_hours: "=order_change_deadline_hours", substitution_pct: "=substitution_allowed_pct", rush_fee_usd: "=rush_delivery_fee_usd", rush_lead_hours: "=rush_delivery_lead_hours", call_out_usd: "=restock_call_out_fee_usd"}
        "Campus Pantry Network Program": {visits_per_week: "=deliveries_per_week", window_hours: "=delivery_window_hours", change_deadline_hours: "=order_change_deadline_hours", substitution_pct: "=substitution_allowed_pct", rush_fee_usd: "=rush_delivery_fee_usd", rush_lead_hours: "=rush_delivery_lead_hours", call_out_usd: "=restock_call_out_fee_usd"}
  - id: pantry_program_fee_terms
    subject: [pantry_program_fee_invoiced]
    rule: >
      Each billing period the programme is invoiced the monthly programme fee printed against the tier in force, plus the per-head charge printed against the same tier applied to the headcount the client reports for that period.
      The programme fee is only invoiced while the programme stands active or paused; a paused programme is invoiced the standby charge printed against its tier in place of the programme fee, and no per-head charge is raised for the paused months.
      Barista hours included in the tier are covered by the programme fee, and hours beyond them are billed at the barista rate printed against the tier, counted in whole hours and rounded up.
      The annual escalation printed against the tier is applied on the first invoice raised on or after each anniversary of the agreement start date, and never mid-year.
      Product price increases are notified the number of days in advance printed against the tier, and an increase applied without that notice is credited back on the next invoice.
      Paper goods and equipment servicing at the visit count printed against the tier are inside the programme fee and are never charged separately.
    eligibility:
      - id: invoiceable_state
        applies_to: [pantry_program_fee_invoiced]
        kind: state
        condition: The programme fee is only invoiced while the programme stands active or paused; a paused programme is invoiced the standby charge printed against its tier in place of the programme fee, and no per-head charge is raised for the paused months.
        evidence_fields: [pantry_agreements.status, pantry_agreements.headcount_served, pantry_agreements.pantry_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [pantry_agreements.pantry_agreement_id]
          action_bindings:
            pantry_agreements.pantry_agreement_id: pantry_agreement_id
        state_contract:
          field: pantry_agreements.status
          allowed: [active, paused]
    params:
      per_tier:
        "Coffee & Tea Service": {fee_usd: "=program_fee_monthly_usd", per_head_usd: "=per_head_monthly_usd", standby_usd: "=pause_standby_fee_usd", barista_hours: "=barista_hours_per_week", barista_rate_usd: "=barista_rate_per_hour_usd", escalation_pct: "=annual_price_escalation_pct", notice_days: "=price_increase_notice_days", cycle_day: "=invoice_cycle_day"}
        "Standard Snack Pantry": {fee_usd: "=program_fee_monthly_usd", per_head_usd: "=per_head_monthly_usd", standby_usd: "=pause_standby_fee_usd", barista_hours: "=barista_hours_per_week", barista_rate_usd: "=barista_rate_per_hour_usd", escalation_pct: "=annual_price_escalation_pct", notice_days: "=price_increase_notice_days", cycle_day: "=invoice_cycle_day"}
        "Fresh Pantry Program": {fee_usd: "=program_fee_monthly_usd", per_head_usd: "=per_head_monthly_usd", standby_usd: "=pause_standby_fee_usd", barista_hours: "=barista_hours_per_week", barista_rate_usd: "=barista_rate_per_hour_usd", escalation_pct: "=annual_price_escalation_pct", notice_days: "=price_increase_notice_days", cycle_day: "=invoice_cycle_day"}
        "Barista Bar Program": {fee_usd: "=program_fee_monthly_usd", per_head_usd: "=per_head_monthly_usd", standby_usd: "=pause_standby_fee_usd", barista_hours: "=barista_hours_per_week", barista_rate_usd: "=barista_rate_per_hour_usd", escalation_pct: "=annual_price_escalation_pct", notice_days: "=price_increase_notice_days", cycle_day: "=invoice_cycle_day"}
        "Full Hospitality Pantry Program": {fee_usd: "=program_fee_monthly_usd", per_head_usd: "=per_head_monthly_usd", standby_usd: "=pause_standby_fee_usd", barista_hours: "=barista_hours_per_week", barista_rate_usd: "=barista_rate_per_hour_usd", escalation_pct: "=annual_price_escalation_pct", notice_days: "=price_increase_notice_days", cycle_day: "=invoice_cycle_day"}
        "Campus Pantry Network Program": {fee_usd: "=program_fee_monthly_usd", per_head_usd: "=per_head_monthly_usd", standby_usd: "=pause_standby_fee_usd", barista_hours: "=barista_hours_per_week", barista_rate_usd: "=barista_rate_per_hour_usd", escalation_pct: "=annual_price_escalation_pct", notice_days: "=price_increase_notice_days", cycle_day: "=invoice_cycle_day"}
    formula:
      headcount_charge_usd: round(per_head_monthly_usd * headcount_served, 2)
      amount_usd: round(program_fee_monthly_usd + headcount_charge_usd, 2)
  - id: pantry_overage_terms
    subject: [pantry_overage_charge_posted]
    rule: >
      Product delivered in a billing period is measured against the monthly product allowance printed against the tier, product group by product group.
      Consumption inside the grace share printed against the tier is absorbed without charge; consumption beyond that grace is charged at landed cost plus the overage markup printed against the same tier.
      The allowance is not carried forward: a light month does not build credit for a heavy one, and a heavy month is charged in the period it falls in.
      Where the client asks to raise the allowance, the programme is moved to the tier whose allowance covers their consumption rather than the allowance being varied on the tier in force.
      Product taken during a pause is impossible, since no deliveries are made, so a paused month produces no overage whatever the site consumed from stock already on the shelf.
      A consumption review is held at the frequency printed against the tier, and a client whose consumption has run above the allowance for three periods running is offered the next tier up.
    eligibility: []
    params:
      per_tier:
        "Coffee & Tea Service": {allowance_usd: "=product_allowance_monthly_usd", grace_pct: "=overage_grace_pct", markup_pct: "=overage_markup_pct", review_months: "=consumption_review_frequency_months"}
        "Standard Snack Pantry": {allowance_usd: "=product_allowance_monthly_usd", grace_pct: "=overage_grace_pct", markup_pct: "=overage_markup_pct", review_months: "=consumption_review_frequency_months"}
        "Fresh Pantry Program": {allowance_usd: "=product_allowance_monthly_usd", grace_pct: "=overage_grace_pct", markup_pct: "=overage_markup_pct", review_months: "=consumption_review_frequency_months"}
        "Barista Bar Program": {allowance_usd: "=product_allowance_monthly_usd", grace_pct: "=overage_grace_pct", markup_pct: "=overage_markup_pct", review_months: "=consumption_review_frequency_months"}
        "Full Hospitality Pantry Program": {allowance_usd: "=product_allowance_monthly_usd", grace_pct: "=overage_grace_pct", markup_pct: "=overage_markup_pct", review_months: "=consumption_review_frequency_months"}
        "Campus Pantry Network Program": {allowance_usd: "=product_allowance_monthly_usd", grace_pct: "=overage_grace_pct", markup_pct: "=overage_markup_pct", review_months: "=consumption_review_frequency_months"}
    formula:
      grace_ceiling_usd: round(product_allowance_monthly_usd * (100 + overage_grace_pct) / 100, 2)
      amount_usd: round(max(0, amount_usd - grace_ceiling_usd) * (100 + overage_markup_pct) / 100, 2)
    measures: [pantry_msr_consumption_vs_allowance]
  - id: pantry_payment_terms
    subject: [pantry_invoice_payment_posted]
    rule: >
      Pantry invoices fall due the number of days after the invoice date printed against the tier, and a payment is recorded against the single invoice it settles.
      A payment is accepted while the programme stands active, paused or closed, since a closed programme may still carry a final invoice.
      A part payment settles the named invoice in part and never spills onto another; an overpayment leaves the excess on the programme to be applied to the next invoice raised.
      A late charge is the monthly late percentage printed against the tier applied to the amount still outstanding once the grace days printed against the same tier have passed, held to the late charge ceiling printed against that tier.
      Where an invoice is disputed in writing before the grace days expire, no late charge is raised while the dispute stands open.
      Once an invoice is past due by the credit hold threshold printed against the tier, standing deliveries stop until the balance is settled, and the programme is not paused for this, since the stoppage is ours rather than the client's.
    eligibility:
      - id: payable_state
        applies_to: [pantry_invoice_payment_posted]
        kind: state
        condition: A payment is accepted while the programme stands active, paused or closed, since a closed programme may still carry a final invoice.
        evidence_fields: [pantry_agreements.status, pantry_agreements.receivable_balance_usd, pantry_agreements.pantry_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [pantry_agreements.pantry_agreement_id]
          action_bindings:
            pantry_agreements.pantry_agreement_id: pantry_agreement_id
        state_contract:
          field: pantry_agreements.status
          allowed: [active, paused, closed]
    params:
      per_tier:
        "Coffee & Tea Service": {terms_days: "=payment_terms_days", grace_days: "=late_fee_grace_days", late_pct: "=late_fee_monthly_pct", late_cap_usd: "=late_fee_cap_usd", hold_days: "=credit_hold_threshold_days_past_due"}
        "Standard Snack Pantry": {terms_days: "=payment_terms_days", grace_days: "=late_fee_grace_days", late_pct: "=late_fee_monthly_pct", late_cap_usd: "=late_fee_cap_usd", hold_days: "=credit_hold_threshold_days_past_due"}
        "Fresh Pantry Program": {terms_days: "=payment_terms_days", grace_days: "=late_fee_grace_days", late_pct: "=late_fee_monthly_pct", late_cap_usd: "=late_fee_cap_usd", hold_days: "=credit_hold_threshold_days_past_due"}
        "Barista Bar Program": {terms_days: "=payment_terms_days", grace_days: "=late_fee_grace_days", late_pct: "=late_fee_monthly_pct", late_cap_usd: "=late_fee_cap_usd", hold_days: "=credit_hold_threshold_days_past_due"}
        "Full Hospitality Pantry Program": {terms_days: "=payment_terms_days", grace_days: "=late_fee_grace_days", late_pct: "=late_fee_monthly_pct", late_cap_usd: "=late_fee_cap_usd", hold_days: "=credit_hold_threshold_days_past_due"}
        "Campus Pantry Network Program": {terms_days: "=payment_terms_days", grace_days: "=late_fee_grace_days", late_pct: "=late_fee_monthly_pct", late_cap_usd: "=late_fee_cap_usd", hold_days: "=credit_hold_threshold_days_past_due"}
  - id: pantry_service_credit_terms
    subject: [pantry_service_credit_issued]
    rule: >
      Where a standing delivery was missed, or arrived so short that the pantry stood empty, the client is credited against the invoice for that period.
      Each missed delivery earns the percentage of the monthly programme fee printed against the tier, and the credits allowed in one billing period are held to the ceiling printed against the same tier.
      A credit is allowed only when the claim reaches Larkspur Table no later than the claim window for the pantry tier, counted in calendar days from the day the invoice covering the missed delivery was posted.
      Claim window days are counted as calendar days from the day after the invoice posting day, every day of the week counts, and a claim arriving on the boundary day itself is still in time; calendar days are never converted into full 24-hour periods.
      Whether a delivery was missed is settled from the delivery records on the programme for that period, and not from the client's recollection of which mornings the shelves were bare.
      A delivery missed because the client's building was shut, the loading bay was blocked or access was refused is not a missed delivery for this purpose and earns no credit.
      Where the credits that would be due exceed the billing period ceiling, the ceiling is allowed and the balance of the claim is closed rather than carried forward.
    eligibility:
      - id: credit_claim_window
        applies_to: [pantry_service_credit_issued]
        kind: time
        condition: A credit is allowed only when the claim reaches Larkspur Table no later than the claim window for the pantry tier, counted in calendar days from the day the invoice covering the missed delivery was posted.
        evidence_fields: [pantry_ledger.posted_date, pantry_ledger.invoice_reference, pantry_ledger.pantry_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [pantry_ledger.invoice_reference]
          action_bindings:
            pantry_ledger.invoice_reference: invoice_reference
        temporal_basis:
          clock: frozen_time
          anchor_event: the day the invoice covering the missed delivery was posted
          anchor_source: pantry_ledger.posted_date
          relation: not_after
          duration_source: variants.service_credit_claim_window_days
          unit: calendar_days
          counting_rule: Claim window days are counted as calendar days from the day after the invoice posting day, every day of the week counts, and a claim arriving on the boundary day itself is still in time; calendar days are never converted into full 24-hour periods.
          boundary: inclusive
    params:
      per_tier:
        "Coffee & Tea Service": {credit_pct: "=missed_delivery_credit_pct", period_cap_pct: "=service_credit_cap_pct_of_program_fee", claim_window_days: "=service_credit_claim_window_days"}
        "Standard Snack Pantry": {credit_pct: "=missed_delivery_credit_pct", period_cap_pct: "=service_credit_cap_pct_of_program_fee", claim_window_days: "=service_credit_claim_window_days"}
        "Fresh Pantry Program": {credit_pct: "=missed_delivery_credit_pct", period_cap_pct: "=service_credit_cap_pct_of_program_fee", claim_window_days: "=service_credit_claim_window_days"}
        "Barista Bar Program": {credit_pct: "=missed_delivery_credit_pct", period_cap_pct: "=service_credit_cap_pct_of_program_fee", claim_window_days: "=service_credit_claim_window_days"}
        "Full Hospitality Pantry Program": {credit_pct: "=missed_delivery_credit_pct", period_cap_pct: "=service_credit_cap_pct_of_program_fee", claim_window_days: "=service_credit_claim_window_days"}
        "Campus Pantry Network Program": {credit_pct: "=missed_delivery_credit_pct", period_cap_pct: "=service_credit_cap_pct_of_program_fee", claim_window_days: "=service_credit_claim_window_days"}
    formula:
      uncapped_credit_usd: round(program_fee_monthly_usd * missed_delivery_credit_pct * pantry_msr_missed_deliveries / 100, 2)
      period_ceiling_usd: round(program_fee_monthly_usd * service_credit_cap_pct_of_program_fee / 100, 2)
      amount_usd: min(uncapped_credit_usd, period_ceiling_usd)
    measures: [pantry_msr_missed_deliveries]
  - id: pantry_pause_and_closure_terms
    subject: [pantry_service_paused, pantry_service_resumed, pantry_agreement_closed]
    rule: >
      A client may stop standing deliveries without ending the programme, for a building closure, a floor move or a seasonal shutdown.
      A pause, a restart or a closure is only worked while the programme stands active, paused or closed, and a proposal is withdrawn rather than paused.
      A pause shorter than the minimum printed against the tier is handled as a skipped delivery, and paused days accumulate against the contract year ceiling printed against the same tier.
      While paused the standby charge printed against the tier replaces the programme fee, and perishable stock is removed at the start of the pause without charge.
      Restarting needs the notice printed against the tier, counted in calendar days, so that the standing list can be rebuilt before the first delivery.
      Only the client may end the programme, and the desk records the request for the client to confirm; notice is the number of calendar days printed against the tier.
      Where the closure day falls before the end of the term, the early termination charge printed against the tier falls due; the equipment collection charge printed against the same tier falls due either way, and the deposit is returned net of anything outstanding.
    eligibility:
      - id: lifecycle_state
        applies_to: [pantry_service_paused, pantry_service_resumed, pantry_agreement_closed]
        kind: state
        condition: A pause, a restart or a closure is only worked while the programme stands active, paused or closed, and a proposal is withdrawn rather than paused.
        evidence_fields: [pantry_agreements.status, pantry_agreements.pause_start_date, pantry_agreements.pantry_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [pantry_agreements.pantry_agreement_id]
          action_bindings:
            pantry_agreements.pantry_agreement_id: pantry_agreement_id
        state_contract:
          field: pantry_agreements.status
          allowed: [active, paused, closed]
