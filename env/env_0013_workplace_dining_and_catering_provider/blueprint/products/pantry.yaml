events:
  - type: pantry_agreement_opened
    target: pantry_agreements
    mutation: create
    meaning: an office pantry and beverage programme is drawn up for a client site
    grain: one row per pantry programme at one client site
    fields:
      customer_id: the client organisation that will hold the programme
      variant_name: the pantry tier proposed
      status: the programme opens in the proposed state
      site_code: the workplace site the pantry serves
      agreement_start_date: first day of the proposed term
      agreement_end_date: last day of the proposed term
      headcount_served: badged employee headcount the site reports
      delivery_day: the weekday standing deliveries will be made
      billing_contact_email: where pantry invoices will be sent
      purchase_order_reference: the client's purchase order reference, when they use one
      receivable_balance_usd: opening unsettled balance, zero on a new programme
    triggers: []
  - type: pantry_service_commenced
    target: pantry_agreements
    mutation: {transition: {from: proposed, to: active}}
    meaning: the client signs, fitting is done and the first standing delivery is made
    grain: one row per programme, on the day the first delivery lands
    fields:
      status: the programme moves into active
      service_commenced_date: the day of the first standing delivery
    triggers:
      - event: pantry:pantry_program_fee_invoiced
        map: {charge_code: program_fee}
  - type: pantry_service_paused
    target: pantry_agreements
    mutation: {transition: {from: active, to: paused}}
    meaning: standing deliveries stop at the client's instruction while the programme stands
    grain: one row per programme, on the first day of a pause
    fields:
      status: the programme moves into paused
      pause_start_date: first day of the pause
    triggers: []
  - type: pantry_service_resumed
    target: pantry_agreements
    mutation: {transition: {from: paused, to: active}}
    meaning: standing deliveries start again after a pause
    grain: one row per programme, on the day deliveries restart
    fields:
      status: the programme moves back into active
      pause_start_date: cleared once deliveries restart
    triggers: []
  - type: pantry_agreement_closed
    target: pantry_agreements
    mutation: {transition: [{from: active, to: closed}, {from: paused, to: closed}, {from: proposed, to: closed}]}
    meaning: the pantry programme ends and equipment is collected from the site
    grain: one row per programme, on the day it closes
    fields:
      status: the programme moves into closed
      closed_date: the day the programme closed
    triggers: []
  - type: pantry_delivery_posted
    target: pantry_ledger
    meaning: a standing or unscheduled replenishment is delivered to the site
    grain: one row per delivery made to one site
    distinguish_by: [delivery_reference, posted_date, product_category]
    fields:
      pantry_agreement_id: the programme delivered to
      customer_id: the client served
      event_type: the event family of this row
      charge_code: delivery_confirmation on every row of this family
      amount_usd: the product value delivered
      posted_date: the day the delivery landed
      service_period: the billing period the delivery falls in
      delivery_reference: the delivery this row records
      product_category: the product group delivered
      delivery_site_code: the site delivered to
    triggers: []
  - type: pantry_program_fee_invoiced
    target: pantry_ledger
    meaning: the monthly programme fee and any one-off charges are invoiced to the client
    grain: one row per invoiced charge, for one billing period, on one invoice
    distinguish_by: [charge_code, service_period, invoice_reference]
    fields:
      pantry_agreement_id: the programme invoiced
      customer_id: the client invoiced
      event_type: the event family of this row
      charge_code: which invoiced charge this is
      amount_usd: the amount invoiced
      posted_date: the day the invoice was raised
      service_period: the billing period the charge covers
      invoice_reference: the invoice this charge sits on
      payment_channel: not_applicable while nothing has been tendered
      product_category: the product group the charge relates to
    account: pantry_receivable
    direction: in
    triggers: []
  - type: pantry_overage_charge_posted
    target: pantry_ledger
    meaning: product taken above the monthly allowance is charged to the client
    grain: one row per overage charge, for one billing period, on one product group
    distinguish_by: [service_period, product_category, invoice_reference]
    fields:
      pantry_agreement_id: the programme charged
      customer_id: the client charged
      event_type: the event family of this row
      charge_code: product_overage on every row of this family
      amount_usd: the overage charged
      posted_date: the day the charge was raised
      service_period: the billing period the overage falls in
      product_category: the product group the overage fell in
      invoice_reference: the invoice the charge sits on
    account: pantry_receivable
    direction: in
    triggers: []
  - type: pantry_invoice_payment_posted
    target: pantry_ledger
    meaning: the client settles all or part of a pantry invoice
    grain: one row per payment received against one invoice
    distinguish_by: [invoice_reference, posted_date, payment_channel]
    fields:
      pantry_agreement_id: the programme paid against
      customer_id: the client paying
      event_type: the event family of this row
      charge_code: invoice_payment on every row of this family
      amount_usd: the amount received
      posted_date: the day the payment cleared
      service_period: the period of the invoice being settled
      invoice_reference: the invoice settled
      payment_channel: how the client paid
    account: pantry_receivable
    direction: out
    triggers: []
  - type: pantry_service_credit_issued
    target: pantry_ledger
    meaning: a credit is allowed because a standing delivery was missed or fell short
    grain: one row per credit allowed, for one billing period, against one invoice
    distinguish_by: [invoice_reference, service_period, delivery_reference]
    fields:
      pantry_agreement_id: the programme credited
      customer_id: the client credited
      event_type: the event family of this row
      charge_code: service_credit on every row of this family
      amount_usd: the credit allowed
      posted_date: the day the credit was allowed
      service_period: the billing period the credit relates to
      invoice_reference: the invoice credited
      delivery_reference: the delivery the credit answers
    account: pantry_receivable
    direction: out
    triggers: []

measures:
  - id: pantry_msr_active_program_count
    window: point in time on the day the invoice is raised, across the client's whole pantry portfolio
    measure: count of pantry programmes held by the same client whose status is active or paused
  - id: pantry_msr_consumption_vs_allowance
    window: the billing period named on the invoice
    measure: product value delivered in the period divided by the monthly product allowance, expressed as a percentage
  - id: pantry_msr_missed_deliveries
    window: the billing period named on the invoice the claim concerns
    measure: count of scheduled standing deliveries in that period for which no pantry_delivery_posted row exists

policies:
  - id: pantry_agg_multi_holding
    subject: [pantry_agreement_opened]
    rule: >
      A client may hold a pantry programme at as many sites as it has, and there is no ceiling on the number held at once.
      Each programme is written against exactly one site, with its own standing list, delivery weekday and allowance.
      A further pantry programme is not opened for a site that already carries an open pantry programme.
      A site's programme counts as open while it is proposed, active or paused, and counts as gone once it is closed.
      Where a client wants a second pantry point on another floor of a site already under agreement, it is added to the existing programme as a second delivery point rather than opened separately.
    eligibility:
      - id: one_open_program_per_site
        applies_to: [pantry_agreement_opened]
        kind: dedup
        condition: A further pantry programme is not opened for a site that already carries an open pantry programme.
        evidence_fields: [pantry_agreements.site_code, pantry_agreements.customer_id, pantry_agreements.status, pantry_agreements.pantry_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [pantry_agreements.customer_id, pantry_agreements.site_code]
          action_bindings:
