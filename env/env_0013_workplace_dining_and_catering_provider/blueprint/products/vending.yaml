events:
  - type: vending_agreement_opened
    target: vending_agreements
    mutation: create
    meaning: a vending services agreement is drawn up for a client site
    grain: one row per vending agreement at one client site
    fields:
      customer_id: the client organisation that will hold the agreement
      variant_name: the vending programme proposed
      status: the agreement opens in the proposed state
      site_code: the workplace site the machines will stand at
      agreement_start_date: first day of the proposed term
      agreement_end_date: last day of the proposed term
      machine_count: the number of machines the agreement is written for
      billing_contact_email: where vending statements will be sent
      purchase_order_reference: the client's purchase order reference, when they use one
      commission_payable_usd: commission owed to the client, zero on a new agreement
      receivable_balance_usd: opening unsettled balance, zero on a new agreement
    triggers: []
  - type: vending_service_commenced
    target: vending_agreements
    mutation: {transition: {from: proposed, to: active}}
    meaning: the machines are sited, filled and switched on
    grain: one row per agreement, on the day the machines go into service
    fields:
      status: the agreement moves into active
      service_commenced_date: the day the machines went into service
    triggers:
      - event: vending:vending_commission_accrued
        map: {charge_code: commission_accrual}
  - type: vending_service_suspended
    target: vending_agreements
    mutation: {transition: {from: active, to: suspended}}
    meaning: the machines are switched off at the client's instruction while the agreement stands
    grain: one row per agreement, on the first day of a suspension
    fields:
      status: the agreement moves into suspended
      suspension_start_date: first day of the suspension
    triggers: []
  - type: vending_service_resumed
    target: vending_agreements
    mutation: {transition: {from: suspended, to: active}}
    meaning: the machines are refilled and switched back on
    grain: one row per agreement, on the day the machines return to service
    fields:
      status: the agreement moves back into active
      suspension_start_date: cleared once the machines return to service
    triggers: []
  - type: vending_agreement_closed
    target: vending_agreements
    mutation: {transition: [{from: active, to: closed}, {from: suspended, to: closed}, {from: proposed, to: closed}]}
    meaning: the vending agreement ends and the machines are collected from the site
    grain: one row per agreement, on the day it closes
    fields:
      status: the agreement moves into closed
      closed_date: the day the agreement closed
    triggers: []
  - type: vending_commission_accrued
    target: vending_ledger
    meaning: commission earned by the client on a statement period's machine sales is accrued to them
    grain: one row per machine, for one statement period
    distinguish_by: [machine_reference, service_period, product_category]
    fields:
      vending_agreement_id: the agreement the commission belongs to
      customer_id: the client earning the commission
      event_type: the event family of this row
      charge_code: commission_accrual on every row of this family
      amount_usd: the commission accrued
      posted_date: the day the accrual was made
      service_period: the statement period the commission covers
      machine_reference: the machine the commission was earned on
      product_category: the product group the sales fell in
      payment_channel: not_applicable while nothing has been paid out
    account: commission_payable
    direction: in
    triggers: []
  - type: vending_commission_paid
    target: vending_ledger
    meaning: accrued commission is paid out to the client
    grain: one row per commission payment made for one statement period
    distinguish_by: [service_period, posted_date, payment_channel]
    fields:
      vending_agreement_id: the agreement the payment belongs to
      customer_id: the client paid
      event_type: the event family of this row
      charge_code: commission_payment on every row of this family
      amount_usd: the commission paid out
      posted_date: the day the payment left
      service_period: the statement period paid for
      payment_channel: how the commission was paid
      invoice_reference: the statement the payment answers
    account: commission_payable
    direction: out
    triggers: []
  - type: vending_service_call_logged
    target: vending_ledger
    meaning: a fault on a machine is reported and a service call is raised against it
    grain: one row per service call raised on one machine
    distinguish_by: [service_call_reference, machine_reference, posted_date]
    fields:
      vending_agreement_id: the agreement the machine sits under
      customer_id: the client reporting the fault
      event_type: the event family of this row
      charge_code: service_call on every row of this family
      amount_usd: the call-out charge raised, zero where the call is inside the included count
      posted_date: the day the call was logged
      service_period: the statement period the call falls in
      machine_reference: the machine reported faulty
      service_call_reference: the service call this row records
    triggers: []
  - type: vending_subsidy_invoiced
    target: vending_ledger
    meaning: the subsidy the client has met on vend prices, the machine lease and one-off charges are invoiced
    grain: one row per invoiced charge, for one statement period, on one statement
    distinguish_by: [charge_code, service_period, invoice_reference]
    fields:
      vending_agreement_id: the agreement invoiced
      customer_id: the client invoiced
      event_type: the event family of this row
      charge_code: subsidy_invoice on every row of this family
      amount_usd: the amount invoiced
      posted_date: the day the statement was raised
      service_period: the statement period the charge covers
      invoice_reference: the statement the charge sits on
      machine_reference: the machine the charge relates to, empty where the charge covers the estate
      product_category: the product group the charge relates to
    account: vending_receivable
    direction: in
    triggers: []
  - type: vending_invoice_payment_posted
    target: vending_ledger
    meaning: the client settles all or part of a vending statement
    grain: one row per payment received against one statement
    distinguish_by: [invoice_reference, posted_date, payment_channel]
    fields:
      vending_agreement_id: the agreement paid against
      customer_id: the client paying
      event_type: the event family of this row
      charge_code: invoice_payment on every row of this family
      amount_usd: the amount received
      posted_date: the day the payment cleared
      service_period: the period of the statement being settled
      invoice_reference: the statement settled
      payment_channel: how the client paid
    account: vending_receivable
    direction: out
    triggers: []

measures:
  - id: vending_msr_active_machine_count
    window: point in time on the day the statement is raised, across every vending agreement the same client holds
    measure: sum of machine_count over vending agreements whose status is active or suspended
  - id: vending_msr_sales_per_machine
    window: the statement period named on the accrual
    measure: gross machine sales in the period divided by the number of machines in service over that period
  - id: vending_msr_service_calls_12m
    window: the twelve calendar months ending on the day the service call is logged
    measure: count of vending_service_call_logged rows on this agreement

policies:
  - id: vending_agg_multi_holding
    subject: [vending_agreement_opened]
    rule: >
      A client may hold a vending agreement at as many sites as it has, and there is no ceiling on the number held at once.
      Each agreement is written against exactly one site, and machines, sales, commission and statements belong to that site's agreement alone.
      A further vending agreement is not opened for a site that already carries an open vending agreement.
      A site's agreement counts as open while it is proposed, active or suspended, and counts as gone once it is closed.
      Where a client wants more machines at a site already under agreement, the machine count on the existing agreement is raised rather than a second agreement opened.
    eligibility:
      - id: one_open_agreement_per_site
        applies_to: [vending_agreement_opened]
        kind: dedup
        condition: A further vending agreement is not opened for a site that already carries an open vending agreement.
        evidence_fields: [vending_agreements.site_code, vending_agreements.customer_id, vending_agreements.status, vending_agreements.vending_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [vending_agreements.customer_id, vending_agreements.site_code]
          action_bindings:
            vending_agreements.customer_id: customer_id
            vending_agreements.site_code: site_code
        dedup_contract:
          table: vending_agreements
          mode: separate_record
          object_bindings: {customer_id: customer_id, site_code: site_code}
          duplicate_filters: {status: [proposed, active, suspended]}
          distinct_fields: [agreement_start_date, variant_name]
    params: {max_per_customer: null, max_open_agreements_per_site: 1}
  - id: vending_agg_portfolio_commission_band
    subject: [vending_commission_accrued]
    rule: >
      The commission percentage a client earns is lifted by a portfolio band that reads every machine the client hosts rather than the single site being accrued.
      The band is found by adding the machine counts on the client's vending agreements standing active or suspended on the day the statement is raised, then taking the highest ladder step whose machine count does not exceed that number, using the ladder printed against the programme of the agreement being accrued.
      The uplift is added to the commission percentage printed against the programme, and the sum is applied to gross machine sales after card processing has been deducted.
      Agreements still proposed and agreements already closed are outside the count, and machines standing out of service are counted, since they are still placed.
      Where the estate changes part way through a statement period, the count taken on the statement day governs that whole statement and earlier statements are not reopened.
    eligibility: []
    params:
      per_tier:
        "Single Machine Snack Service": {ladder: "=portfolio_commission_uplift_ladder", base_pct: "=commission_pct_of_gross_sales", card_fee_pct: "=card_processing_fee_pct"}
        "Snack & Cold Beverage Bank": {ladder: "=portfolio_commission_uplift_ladder", base_pct: "=commission_pct_of_gross_sales", card_fee_pct: "=card_processing_fee_pct"}
        "Combination Vending Bank": {ladder: "=portfolio_commission_uplift_ladder", base_pct: "=commission_pct_of_gross_sales", card_fee_pct: "=card_processing_fee_pct"}
        "Fresh Food Vending Service": {ladder: "=portfolio_commission_uplift_ladder", base_pct: "=commission_pct_of_gross_sales", card_fee_pct: "=card_processing_fee_pct"}
        "Campus Vending Network Service": {ladder: "=portfolio_commission_uplift_ladder", base_pct: "=commission_pct_of_gross_sales", card_fee_pct: "=card_processing_fee_pct"}
        "Managed Vending & Kiosk Service": {ladder: "=portfolio_commission_uplift_ladder", base_pct: "=commission_pct_of_gross_sales", card_fee_pct: "=card_processing_fee_pct"}
    measures: [vending_msr_active_machine_count]
  - id: vending_placement_terms
    subject: [vending_agreement_opened, vending_service_commenced]
    rule: >
      A vending agreement is drawn up against the programme whose entry gate the site meets on headcount, expected monthly sales, dedicated power and loading access, and the machines go into service once they are sited and filled.
      The placement charge printed against the programme is raised for each machine when the machines go into service, and the monthly machine lease printed against the same programme is raised from that period onward where the programme carries one.
      An agreement is only opened or commenced while it stands proposed or already active, and a proposal withdrawn before signature closes without charge.
      Machines are placed after the installation lead days printed against the programme, counted in calendar days from signature, and a client asking for an earlier date is offered the earliest the lead time allows.
      Vend prices are set from landed product cost at the markup printed against the programme, and price increases are notified the number of days in advance printed against the same programme.
      Where the site does not meet the entry gate of the programme asked for, the agreement is written at the highest programme whose entry gate the site does meet.
      A machine whose sales fall below the minimum printed against the programme for the review months printed against it is reviewed for removal, and is taken out on the removal notice printed against the same programme.
    eligibility:
      - id: placement_state
        applies_to: [vending_agreement_opened, vending_service_commenced]
        kind: state
        condition: An agreement is only opened or commenced while it stands proposed or already active, and a proposal withdrawn before signature closes without charge.
        evidence_fields: [vending_agreements.status, vending_agreements.vending_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [vending_agreements.vending_agreement_id]
          action_bindings:
            vending_agreements.vending_agreement_id: vending_agreement_id
        state_contract:
          field: vending_agreements.status
          allowed: [proposed, active]
    params:
