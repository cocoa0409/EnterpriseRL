category: vending
display_name: Vending Services Program

binding:
  holding_table: vending_agreements
  event_tables: [vending_ledger]
  status_field: status
  variant_field: variant_name
  quantity_fields: {commission_payable_usd: commission_payable, receivable_balance_usd: vending_receivable}

lifecycle:
  states: [proposed, active, suspended, closed]
  transitions:
    - {from: proposed, to: active, by: agent, means: the client signs and the machines are placed into service}
    - {from: active, to: suspended, by: agent, means: the machines are switched off at the client's instruction while the agreement stands}
    - {from: suspended, to: active, by: agent, means: the machines are restocked and switched back on}
    - {from: active, to: closed, by: user, means: the client ends the agreement and the machines are collected}
    - {from: suspended, to: closed, by: agent, means: a suspended estate is collected rather than restarted}
    - {from: proposed, to: closed, by: agent, means: the proposal is withdrawn or declined before signature}

accounts:
  - key: commission_payable
    unit: USD
    meaning: commission earned by the client on machine sales and not yet paid out to them
  - key: vending_receivable
    unit: USD
    meaning: amounts invoiced to the client for subsidised vending and not yet settled

parameter_schema:
  machines_included: machines the programme is written for, as a whole number
  machine_placement_fee_usd: one-off charge for siting and commissioning each machine, in USD
  monthly_machine_lease_usd: monthly charge for each machine where the client leases rather than hosts, in USD
  commission_pct_of_gross_sales: commission paid back to the client, as a percentage of gross machine sales
  commission_min_monthly_usd: smallest commission paid out in one statement period, in USD
  commission_payment_frequency: how often commission is paid out, one of monthly or quarterly
  commission_payment_lag_days: calendar days after the statement period closes by which commission is paid
  sales_threshold_for_commission_usd: monthly sales a machine must reach before commission accrues on it, in USD
  product_markup_pct: markup applied to landed product cost to set vend prices, as a percentage
  sku_count: distinct products carried across the estate, as a whole number
  fresh_food_offered: whether chilled fresh food is vended on this programme, true or false
  hot_beverage_offered: whether hot beverages are vended on this programme, true or false
  cashless_reader_included: whether a card reader is fitted to each machine, true or false
  card_processing_fee_pct: card processing charge deducted before commission, as a percentage
  mobile_pay_enabled: whether employees may pay by mobile wallet at the machine, true or false
  restock_visits_per_week: scheduled restocking visits to the estate each week, as a whole number
  restock_window_hours: length of each scheduled restocking visit, to one decimal place
  planogram_change_lead_days: calendar days of notice needed to change the machine planogram
  planogram_refresh_per_year: planned planogram refreshes each year, as a whole number
  service_response_hours: hours within which a logged service call is attended, as a whole number
  service_calls_included_per_year: service calls included without charge each year, as a whole number
  service_call_out_fee_usd: charge for a service call beyond the included count, in USD
  uptime_guarantee_pct: machine availability the programme guarantees, as a percentage of opening hours
  outage_credit_per_machine_per_day_usd: credit for each day a machine stands out of service, in USD
  refund_window_days: calendar days after a failed vend within which an employee refund is made
  refund_max_per_transaction_usd: ceiling on a single failed-vend refund, in USD
  subsidy_invoiced: whether the client subsidises vend prices and is invoiced for it, true or false
  subsidy_pct_of_shelf_price: share of the vend price met by client subsidy, as a percentage
  subsidy_cap_per_employee_per_day_usd: ceiling on subsidy drawn for one employee on one day, in USD
  min_monthly_sales_per_machine_usd: monthly sales a machine must make to stay on site, in USD
  underperformance_review_months: months of sales below the minimum before a machine is reviewed for removal
  machine_removal_notice_days: calendar days of notice given before an underperforming machine is removed
  install_lead_days: calendar days of lead time before machines are placed into service
  contract_term_months: standard initial term of the agreement, in whole months
  termination_notice_days: calendar days of written notice required to end the agreement
  early_termination_fee_per_machine_usd: charge for each machine removed before the end of the term, in USD
  equipment_removal_fee_per_machine_usd: charge for collecting each machine at closure, in USD
  max_suspension_days_per_contract_year: ceiling on suspended calendar days in one contract year
  min_suspension_days: shortest suspension the programme accepts, in calendar days
  resumption_lead_days: calendar days of notice needed to switch the machines back on
  suspension_standby_fee_per_machine_usd: monthly charge for each machine while the estate stands suspended, in USD
  statement_cycle_day: day of the month the vending statement is raised, from 1 to 28
  payment_terms_days: calendar days from the statement within which payment is due
  late_fee_monthly_pct: monthly late charge on an overdue vending invoice, as a percentage of the overdue amount
  late_fee_grace_days: calendar days past the due date before a late charge may be raised
  late_fee_cap_usd: ceiling on the late charge raised against one vending invoice, in USD
  credit_hold_threshold_days_past_due: days past due at which restocking stops on the agreement
  energy_efficient_machines: whether low-energy machines are fitted as standard, true or false
  nutrition_labeling_level: depth of vend-front nutrition labelling, one of basic, standard or enhanced
  portfolio_commission_uplift_ladder: threshold ladder mapping the number of machines the client hosts to an uplift on the commission percentage
  min_annual_sales_usd: annual estate sales the programme is written against, in USD
  vend_price_increase_notice_days: calendar days of notice given before vend prices rise

