  - id: vending_suspension_and_closure_terms
    subject: [vending_service_suspended, vending_service_resumed, vending_agreement_closed]
    rule: >
      A client may switch the machines off without ending the agreement, for a floor move, a building closure or a seasonal shutdown.
      A suspension, a resumption or a closure is only worked while the agreement stands active, suspended or closed, and a proposal is withdrawn rather than suspended.
      A suspension shorter than the minimum printed against the programme is handled as ordinary closed days, and suspended days accumulate against the contract year ceiling printed against the same programme.
      While suspended the standby charge printed against the programme is raised for each machine, perishable stock is removed at the start of the suspension without charge, and no commission accrues because no sales are made.
      Switching the machines back on needs the notice printed against the programme, counted in calendar days, so that the planogram can be rebuilt and the machines refilled.
      Only the client may end the agreement, and the desk records the request as a termination notice for the client to confirm; notice is the number of calendar days printed against the programme.
      Where the closure day falls before the end of the term, the early termination charge printed against the programme falls due for each machine, and on or after the end of the term it does not; the collection charge printed against the programme falls due for each machine either way.
      Commission accrued and not yet paid out is paid on closure whatever the minimum payout says, since there is no later period to carry it into.
    eligibility:
      - id: lifecycle_state
        applies_to: [vending_service_suspended, vending_service_resumed, vending_agreement_closed]
        kind: state
        condition: A suspension, a resumption or a closure is only worked while the agreement stands active, suspended or closed, and a proposal is withdrawn rather than suspended.
        evidence_fields: [vending_agreements.status, vending_agreements.suspension_start_date, vending_agreements.vending_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [vending_agreements.vending_agreement_id]
          action_bindings:
            vending_agreements.vending_agreement_id: vending_agreement_id
        state_contract:
          field: vending_agreements.status
          allowed: [active, suspended, closed]
    params:
      per_tier:
        "Single Machine Snack Service": {min_days: "=min_suspension_days", annual_cap_days: "=max_suspension_days_per_contract_year", resume_notice_days: "=resumption_lead_days", standby_usd: "=suspension_standby_fee_per_machine_usd", notice_days: "=termination_notice_days", early_fee_usd: "=early_termination_fee_per_machine_usd", removal_fee_usd: "=equipment_removal_fee_per_machine_usd", term_months: "=contract_term_months"}
        "Snack & Cold Beverage Bank": {min_days: "=min_suspension_days", annual_cap_days: "=max_suspension_days_per_contract_year", resume_notice_days: "=resumption_lead_days", standby_usd: "=suspension_standby_fee_per_machine_usd", notice_days: "=termination_notice_days", early_fee_usd: "=early_termination_fee_per_machine_usd", removal_fee_usd: "=equipment_removal_fee_per_machine_usd", term_months: "=contract_term_months"}
