        "Snack & Cold Beverage Bank": {machines: "=machines_included", placement_fee_usd: "=machine_placement_fee_usd", lease_usd: "=monthly_machine_lease_usd", lead_days: "=install_lead_days", markup_pct: "=product_markup_pct", price_notice_days: "=vend_price_increase_notice_days", min_sales_usd: "=min_monthly_sales_per_machine_usd", review_months: "=underperformance_review_months", removal_notice_days: "=machine_removal_notice_days"}
        "Combination Vending Bank": {machines: "=machines_included", placement_fee_usd: "=machine_placement_fee_usd", lease_usd: "=monthly_machine_lease_usd", lead_days: "=install_lead_days", markup_pct: "=product_markup_pct", price_notice_days: "=vend_price_increase_notice_days", min_sales_usd: "=min_monthly_sales_per_machine_usd", review_months: "=underperformance_review_months", removal_notice_days: "=machine_removal_notice_days"}
        "Fresh Food Vending Service": {machines: "=machines_included", placement_fee_usd: "=machine_placement_fee_usd", lease_usd: "=monthly_machine_lease_usd", lead_days: "=install_lead_days", markup_pct: "=product_markup_pct", price_notice_days: "=vend_price_increase_notice_days", min_sales_usd: "=min_monthly_sales_per_machine_usd", review_months: "=underperformance_review_months", removal_notice_days: "=machine_removal_notice_days"}
        "Campus Vending Network Service": {machines: "=machines_included", placement_fee_usd: "=machine_placement_fee_usd", lease_usd: "=monthly_machine_lease_usd", lead_days: "=install_lead_days", markup_pct: "=product_markup_pct", price_notice_days: "=vend_price_increase_notice_days", min_sales_usd: "=min_monthly_sales_per_machine_usd", review_months: "=underperformance_review_months", removal_notice_days: "=machine_removal_notice_days"}
        "Managed Vending & Kiosk Service": {machines: "=machines_included", placement_fee_usd: "=machine_placement_fee_usd", lease_usd: "=monthly_machine_lease_usd", lead_days: "=install_lead_days", markup_pct: "=product_markup_pct", price_notice_days: "=vend_price_increase_notice_days", min_sales_usd: "=min_monthly_sales_per_machine_usd", review_months: "=underperformance_review_months", removal_notice_days: "=machine_removal_notice_days"}
    measures: [vending_msr_sales_per_machine]
  - id: vending_commission_terms
    subject: [vending_commission_accrued, vending_commission_paid]
    rule: >
      Commission accrues machine by machine on gross sales for the statement period, after card processing at the percentage printed against the programme has been deducted, at the commission percentage printed against the programme as lifted by the portfolio band.
      A machine whose sales for the period fall below the commission threshold printed against the programme accrues no commission at all, and its sales are not pooled with other machines to reach the threshold.
      Where the whole estate's commission for a period falls below the minimum payout printed against the programme, nothing is paid out and the accrual is carried into the next period until the minimum is reached.
      Commission is accrued or paid while the agreement stands active, suspended or closed, because a closed estate still has a final period to settle and a suspended one still has earlier periods outstanding.
      Commission is paid out no later than the commission payment window, counted in calendar days from the day the statement period closes.
      Payment window days are counted as calendar days from the day after the statement period closes, every day of the week counts, and a payment made on the boundary day itself is in time; calendar days are never converted into full 24-hour periods.
      Commission is never netted against what the client owes on a vending statement; the two move separately, so a client in arrears still receives their commission.
      Where a machine is removed part way through a period, commission accrues on the sales it made up to the day of removal and no further.
    eligibility:
      - id: commission_state
        applies_to: [vending_commission_accrued, vending_commission_paid]
        kind: state
        condition: Commission is accrued or paid while the agreement stands active, suspended or closed, because a closed estate still has a final period to settle and a suspended one still has earlier periods outstanding.
        evidence_fields: [vending_agreements.status, vending_agreements.commission_payable_usd, vending_agreements.vending_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [vending_agreements.vending_agreement_id]
          action_bindings:
            vending_agreements.vending_agreement_id: vending_agreement_id
        state_contract:
          field: vending_agreements.status
          allowed: [active, suspended, closed]
      - id: payout_window
        applies_to: [vending_commission_paid]
        kind: time
        condition: Commission is paid out no later than the commission payment window, counted in calendar days from the day the statement period closes.
        evidence_fields: [vending_ledger.posted_date, vending_ledger.service_period, vending_ledger.vending_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [vending_ledger.service_period, vending_ledger.vending_agreement_id]
          action_bindings:
            vending_ledger.service_period: service_period
            vending_ledger.vending_agreement_id: vending_agreement_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the day the statement period closes
          anchor_source: vending_ledger.posted_date
          relation: not_after
          duration_source: variants.commission_payment_lag_days
          unit: calendar_days
          counting_rule: Payment window days are counted as calendar days from the day after the statement period closes, every day of the week counts, and a payment made on the boundary day itself is in time; calendar days are never converted into full 24-hour periods.
          boundary: inclusive
    params:
      per_tier:
        "Single Machine Snack Service": {commission_pct: "=commission_pct_of_gross_sales", min_payout_usd: "=commission_min_monthly_usd", frequency: "=commission_payment_frequency", lag_days: "=commission_payment_lag_days", threshold_usd: "=sales_threshold_for_commission_usd", card_fee_pct: "=card_processing_fee_pct"}
        "Snack & Cold Beverage Bank": {commission_pct: "=commission_pct_of_gross_sales", min_payout_usd: "=commission_min_monthly_usd", frequency: "=commission_payment_frequency", lag_days: "=commission_payment_lag_days", threshold_usd: "=sales_threshold_for_commission_usd", card_fee_pct: "=card_processing_fee_pct"}
        "Combination Vending Bank": {commission_pct: "=commission_pct_of_gross_sales", min_payout_usd: "=commission_min_monthly_usd", frequency: "=commission_payment_frequency", lag_days: "=commission_payment_lag_days", threshold_usd: "=sales_threshold_for_commission_usd", card_fee_pct: "=card_processing_fee_pct"}
        "Fresh Food Vending Service": {commission_pct: "=commission_pct_of_gross_sales", min_payout_usd: "=commission_min_monthly_usd", frequency: "=commission_payment_frequency", lag_days: "=commission_payment_lag_days", threshold_usd: "=sales_threshold_for_commission_usd", card_fee_pct: "=card_processing_fee_pct"}
        "Campus Vending Network Service": {commission_pct: "=commission_pct_of_gross_sales", min_payout_usd: "=commission_min_monthly_usd", frequency: "=commission_payment_frequency", lag_days: "=commission_payment_lag_days", threshold_usd: "=sales_threshold_for_commission_usd", card_fee_pct: "=card_processing_fee_pct"}
        "Managed Vending & Kiosk Service": {commission_pct: "=commission_pct_of_gross_sales", min_payout_usd: "=commission_min_monthly_usd", frequency: "=commission_payment_frequency", lag_days: "=commission_payment_lag_days", threshold_usd: "=sales_threshold_for_commission_usd", card_fee_pct: "=card_processing_fee_pct"}
    formula:
      net_sales_usd: round(amount_usd * (100 - card_processing_fee_pct) / 100, 2)
      amount_usd: round(net_sales_usd * commission_pct_of_gross_sales / 100, 2)
    measures: [vending_msr_sales_per_machine]
  - id: vending_subsidy_invoice_terms
    subject: [vending_subsidy_invoiced]
    rule: >
      Where the programme carries client subsidy, the share of vend prices the client meets is invoiced on the statement for the period, alongside the machine lease and any one-off charges.
      Subsidy is the percentage of the vend price printed against the programme, held to the daily ceiling printed against the same programme for each employee on each day; a programme that carries no subsidy invoices none however the client asks.
      A statement is only raised while the agreement stands active or suspended; a suspended estate is invoiced the standby charge printed against its programme for each machine in place of the lease, and no subsidy is invoiced for the suspended period.
      A service call beyond the included count printed against the programme is invoiced at the call-out charge printed against the same programme, and calls inside the included count are invoiced at nothing.
      The statement is raised on the statement day printed against the programme, and a statement covering two different programmes is never raised; each agreement is stated on its own.
      Where the estate's annual sales fall short of the sales the programme is written against, nothing further is invoiced, and the programme is reviewed at the next renewal instead.
    eligibility:
      - id: statement_state
        applies_to: [vending_subsidy_invoiced]
        kind: state
        condition: A statement is only raised while the agreement stands active or suspended; a suspended estate is invoiced the standby charge printed against its programme for each machine in place of the lease, and no subsidy is invoiced for the suspended period.
        evidence_fields: [vending_agreements.status, vending_agreements.machine_count, vending_agreements.vending_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [vending_agreements.vending_agreement_id]
          action_bindings:
            vending_agreements.vending_agreement_id: vending_agreement_id
        state_contract:
          field: vending_agreements.status
          allowed: [active, suspended]
