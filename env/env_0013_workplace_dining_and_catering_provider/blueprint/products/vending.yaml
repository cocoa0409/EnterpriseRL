  - id: vending_combination_market_interaction
    subject: [vending_commission_accrued, vending_subsidy_invoiced]
    rule: >
      What a client holds elsewhere in the dining programme changes what the vending estate earns and what it may carry.
      Where the same client holds an active unattended micro market at the site the machines stand in, the machines carry no fresh food and no hot beverage, because the market already carries both, and the planogram is trimmed at the next refresh.
      Where a micro market stands at the site, commission accrues only on the machines outside the market room, since machines inside it are part of the market's own settlement rather than the vending statement.
      Where the same client holds an active workplace cafe management contract at the site, vend prices are set to match the cafe's shelf prices for the same items, and the markup printed against the vending programme is applied only to items the cafe does not carry.
      A vending agreement and a micro market at the same site are not mutually exclusive, and many sites hold both; but a vending agreement is never opened at a site where the only demand is inside the market room.
      Where the micro market at the site closes, the trimmed planogram is restored at the next refresh and commission accrues on the whole estate from the next statement period.
    eligibility: []
    params:
      per_tier:
        "Single Machine Snack Service": {trim_with_market: true, price_match_with_cafe: true}
        "Snack & Cold Beverage Bank": {trim_with_market: true, price_match_with_cafe: true}
        "Combination Vending Bank": {trim_with_market: true, price_match_with_cafe: true}
        "Fresh Food Vending Service": {trim_with_market: true, price_match_with_cafe: false}
        "Campus Vending Network Service": {trim_with_market: true, price_match_with_cafe: true}
        "Managed Vending & Kiosk Service": {trim_with_market: false, price_match_with_cafe: true}
