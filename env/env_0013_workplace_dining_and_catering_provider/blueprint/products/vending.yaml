        "Snack & Cold Beverage Bank": {subsidised: "=subsidy_invoiced", subsidy_pct: "=subsidy_pct_of_shelf_price", daily_cap_usd: "=subsidy_cap_per_employee_per_day_usd", lease_usd: "=monthly_machine_lease_usd", standby_usd: "=suspension_standby_fee_per_machine_usd", call_out_usd: "=service_call_out_fee_usd", included_calls: "=service_calls_included_per_year", cycle_day: "=statement_cycle_day"}
        "Combination Vending Bank": {subsidised: "=subsidy_invoiced", subsidy_pct: "=subsidy_pct_of_shelf_price", daily_cap_usd: "=subsidy_cap_per_employee_per_day_usd", lease_usd: "=monthly_machine_lease_usd", standby_usd: "=suspension_standby_fee_per_machine_usd", call_out_usd: "=service_call_out_fee_usd", included_calls: "=service_calls_included_per_year", cycle_day: "=statement_cycle_day"}
        "Fresh Food Vending Service": {subsidised: "=subsidy_invoiced", subsidy_pct: "=subsidy_pct_of_shelf_price", daily_cap_usd: "=subsidy_cap_per_employee_per_day_usd", lease_usd: "=monthly_machine_lease_usd", standby_usd: "=suspension_standby_fee_per_machine_usd", call_out_usd: "=service_call_out_fee_usd", included_calls: "=service_calls_included_per_year", cycle_day: "=statement_cycle_day"}
