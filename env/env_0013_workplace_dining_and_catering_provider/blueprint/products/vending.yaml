        "Managed Vending & Kiosk Service": {subsidised: "=subsidy_invoiced", subsidy_pct: "=subsidy_pct_of_shelf_price", daily_cap_usd: "=subsidy_cap_per_employee_per_day_usd", lease_usd: "=monthly_machine_lease_usd", standby_usd: "=suspension_standby_fee_per_machine_usd", call_out_usd: "=service_call_out_fee_usd", included_calls: "=service_calls_included_per_year", cycle_day: "=statement_cycle_day"}
  - id: vending_service_call_terms
    subject: [vending_service_call_logged]
    rule: >
      A fault reported on a machine is logged as a service call against that machine, and the call carries the machine it concerns so that repeat faults on one machine can be seen.
      A logged service call is attended no later than the response window for the programme, counted in elapsed hours from the day the client logs the service call.
      Elapsed hours run continuously from the moment the call is logged, nights, weekends and public holidays included, and a visit made exactly on the boundary hour is in time; elapsed hours are never rounded up to whole calendar days.
      Calls inside the included count printed against the programme for the agreement year carry no charge; calls beyond that count carry the call-out charge printed against the same programme.
      A call raised for a fault that turns out to be a power supply, a network or an access problem on the client's side is charged as a call-out whether or not the included count has been used up.
      A machine standing out of service beyond the response window earns the daily outage credit printed against the programme for each further day, credited on the next statement.
      Calls are logged while the agreement stands active or suspended, since a suspended machine may still need attention before it is switched back on.
      A machine that has needed more than six calls in the rolling twelve months is replaced rather than repaired again, at no charge to the client.
    eligibility:
      - id: callable_state
        applies_to: [vending_service_call_logged]
        kind: state
        condition: Calls are logged while the agreement stands active or suspended, since a suspended machine may still need attention before it is switched back on.
        evidence_fields: [vending_agreements.status, vending_agreements.machine_count, vending_agreements.vending_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [vending_agreements.vending_agreement_id]
          action_bindings:
            vending_agreements.vending_agreement_id: vending_agreement_id
        state_contract:
          field: vending_agreements.status
          allowed: [active, suspended]
      - id: response_window
        applies_to: [vending_service_call_logged]
        kind: time
        condition: A logged service call is attended no later than the response window for the programme, counted in elapsed hours from the day the client logs the service call.
        evidence_fields: [vending_ledger.posted_date, vending_ledger.service_call_reference, vending_ledger.machine_reference]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [vending_ledger.service_call_reference]
          action_bindings:
            vending_ledger.service_call_reference: service_call_reference
        temporal_basis:
          clock: frozen_time
          anchor_event: the day the client logs the service call
          anchor_source: vending_ledger.posted_date
          relation: not_after
          duration_source: variants.service_response_hours
          unit: elapsed_hours
          counting_rule: Elapsed hours run continuously from the moment the call is logged, nights, weekends and public holidays included, and a visit made exactly on the boundary hour is in time; elapsed hours are never rounded up to whole calendar days.
          boundary: inclusive
    params:
      machine_replacement_call_threshold: 6
      per_tier:
        "Single Machine Snack Service": {response_hours: "=service_response_hours", included_calls: "=service_calls_included_per_year", call_out_usd: "=service_call_out_fee_usd", uptime_pct: "=uptime_guarantee_pct", outage_credit_usd: "=outage_credit_per_machine_per_day_usd"}
        "Snack & Cold Beverage Bank": {response_hours: "=service_response_hours", included_calls: "=service_calls_included_per_year", call_out_usd: "=service_call_out_fee_usd", uptime_pct: "=uptime_guarantee_pct", outage_credit_usd: "=outage_credit_per_machine_per_day_usd"}
        "Combination Vending Bank": {response_hours: "=service_response_hours", included_calls: "=service_calls_included_per_year", call_out_usd: "=service_call_out_fee_usd", uptime_pct: "=uptime_guarantee_pct", outage_credit_usd: "=outage_credit_per_machine_per_day_usd"}
        "Fresh Food Vending Service": {response_hours: "=service_response_hours", included_calls: "=service_calls_included_per_year", call_out_usd: "=service_call_out_fee_usd", uptime_pct: "=uptime_guarantee_pct", outage_credit_usd: "=outage_credit_per_machine_per_day_usd"}
        "Campus Vending Network Service": {response_hours: "=service_response_hours", included_calls: "=service_calls_included_per_year", call_out_usd: "=service_call_out_fee_usd", uptime_pct: "=uptime_guarantee_pct", outage_credit_usd: "=outage_credit_per_machine_per_day_usd"}
        "Managed Vending & Kiosk Service": {response_hours: "=service_response_hours", included_calls: "=service_calls_included_per_year", call_out_usd: "=service_call_out_fee_usd", uptime_pct: "=uptime_guarantee_pct", outage_credit_usd: "=outage_credit_per_machine_per_day_usd"}
    measures: [vending_msr_service_calls_12m]
  - id: vending_payment_terms
    subject: [vending_invoice_payment_posted]
    rule: >
      Vending statements fall due the number of days after the statement date printed against the programme, and a payment is recorded against the single statement it settles.
      A payment is accepted while the agreement stands active, suspended or closed, since a collected estate may still carry a final statement.
      A part payment settles the named statement in part and never spills onto another; an overpayment leaves the excess on the agreement to be applied to the next statement raised.
      A late charge is the monthly late percentage printed against the programme applied to the amount still outstanding once the grace days printed against the same programme have passed, held to the late charge ceiling printed against that programme.
      Where a statement is disputed in writing before the grace days expire, no late charge is raised while the dispute stands open, and commission due to the client is still paid out.
      Once a statement is past due by the credit hold threshold printed against the programme, restocking stops and the machines are drawn down to empty, until the balance is settled.
    eligibility:
      - id: payable_state
        applies_to: [vending_invoice_payment_posted]
        kind: state
        condition: A payment is accepted while the agreement stands active, suspended or closed, since a collected estate may still carry a final statement.
        evidence_fields: [vending_agreements.status, vending_agreements.receivable_balance_usd, vending_agreements.vending_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [vending_agreements.vending_agreement_id]
          action_bindings:
            vending_agreements.vending_agreement_id: vending_agreement_id
        state_contract:
          field: vending_agreements.status
          allowed: [active, suspended, closed]
    params:
      per_tier:
