  - id: banquet_hold_and_closure_terms
    subject: [banquet_agreement_hold_changed, banquet_agreement_closed]
    rule: >
      Booking is stopped on an agreement when arrears pass the credit hold threshold or when a required certificate of event insurance lapses, and it restarts once the balance is settled or the certificate replaced.
      A hold or a closure is only worked while the agreement stands active, on hold or closed, and never on a proposal, which is withdrawn instead.
      Events already confirmed when a hold goes on are still delivered, because the client has paid deposits against them and the venue has held the date.
      Only the client may end an event services agreement, and the desk records the request for the client to confirm rather than closing the agreement on their word alone.
      Notice to end the agreement is the number of calendar days printed against the package, and every confirmed event inside that notice period is delivered or cancelled on the ordinary cancellation terms before the agreement closes.
      An agreement is not closed while deposit money is still held against an unserved booking; the deposit is returned or applied first.
      Where the client has not reached the minimum number of events a year printed against the package, no shortfall charge falls due, since the package prices each event on its own.
    eligibility:
      - id: lifecycle_state
        applies_to: [banquet_agreement_hold_changed, banquet_agreement_closed]
        kind: state
        condition: A hold or a closure is only worked while the agreement stands active, on hold or closed, and never on a proposal, which is withdrawn instead.
        evidence_fields: [banquet_agreements.status, banquet_agreements.deposit_balance_usd, banquet_agreements.banquet_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [banquet_agreements.banquet_agreement_id]
          action_bindings:
            banquet_agreements.banquet_agreement_id: banquet_agreement_id
        state_contract:
          field: banquet_agreements.status
          allowed: [active, on_hold, closed]
    params:
      per_tier:
        "Meeting Room Refreshment Package": {notice_days: "=agreement_notice_days", hold_days: "=credit_hold_threshold_days_past_due", insurance_required: "=insurance_certificate_required"}
        "Boardroom Reception Package": {notice_days: "=agreement_notice_days", hold_days: "=credit_hold_threshold_days_past_due", insurance_required: "=insurance_certificate_required"}
        "Conference Day Delegate Package": {notice_days: "=agreement_notice_days", hold_days: "=credit_hold_threshold_days_past_due", insurance_required: "=insurance_certificate_required"}
        "Seated Banquet Package": {notice_days: "=agreement_notice_days", hold_days: "=credit_hold_threshold_days_past_due", insurance_required: "=insurance_certificate_required"}
        "Gala Reception Package": {notice_days: "=agreement_notice_days", hold_days: "=credit_hold_threshold_days_past_due", insurance_required: "=insurance_certificate_required"}
        "Multi-Day Conference Residency Package": {notice_days: "=agreement_notice_days", hold_days: "=credit_hold_threshold_days_past_due", insurance_required: "=insurance_certificate_required"}
  - id: banquet_combination_venue_interaction
    subject: [banquet_event_booked, banquet_event_invoiced]
    rule: >
      What a client holds elsewhere in the dining programme changes what an event costs and who produces it.
      Where the same client holds an active workplace cafe management contract at the site the venue sits in, and that contract's service model permits catering out of the cafe kitchen, the event is produced in that kitchen and no preferred vendor fee is charged for the food.
      Where the client brings an outside caterer into a venue at a site where they already hold a cafe contract permitting catering, the preferred vendor fee printed against the package is charged in full, because the in-house kitchen was available and was not used.
      A private event and banquet booking and a corporate catering order for the same room on the same day are mutually exclusive: the room is held by the booking, and any additional food for that room is added to the event rather than ordered through the catering agreement.
      Where the client holds a catering agreement whose largest guest count is smaller than the event's guaranteed count, the event stays on the event services agreement whatever the client asks, since only the venue can seat it.
      Where the cafe contract at the site closes or stands suspended, production moves to the district kitchen and the event price is unchanged, since the package rate already covers production.
    eligibility: []
    params:
      per_tier:
        "Meeting Room Refreshment Package": {vendor_fee_waived_with_cafe: true, room_exclusive_to_booking: true}
        "Boardroom Reception Package": {vendor_fee_waived_with_cafe: true, room_exclusive_to_booking: true}
        "Conference Day Delegate Package": {vendor_fee_waived_with_cafe: true, room_exclusive_to_booking: true}
        "Seated Banquet Package": {vendor_fee_waived_with_cafe: true, room_exclusive_to_booking: true}
        "Gala Reception Package": {vendor_fee_waived_with_cafe: false, room_exclusive_to_booking: true}
        "Multi-Day Conference Residency Package": {vendor_fee_waived_with_cafe: true, room_exclusive_to_booking: true}

extended_policies:
  - id: banquet_ext_cancellation_notice_value
    base_policy_refs: [banquet_cancellation_terms, banquet_booking_terms, banquet_guarantee_terms, banquet_combination_venue_interaction]
    overwrite:
      - base_policy: banquet_booking_terms
        superseded_clause: >-
          The event must reach the minimum food and beverage spend printed against the package and sit between the smallest and largest guest counts printed against it; an event above the largest guest count is quoted on the next package up rather than squeezed into this one.
        replaced_by: >-
          Where the food and beverage value standing on the booking entry falls short of the minimum food and beverage spend printed against the package, the room rental printed against the package stands in the contracted value together with the difference between that minimum spend and the value standing, which is taken as room hire.
      - base_policy: banquet_combination_venue_interaction
        superseded_clause: >-
          A private event and banquet booking and a corporate catering order for the same room on the same day are mutually exclusive: the room is held by the booking, and any additional food for that room is added to the event rather than ordered through the catering agreement.
        replaced_by: >-
          The room a confirmed booking holds is held for the whole of the event day, so an order standing on the client's corporate catering account for that day is food for that room, and the day alone settles it, whether or not the order names the room.
      - base_policy: banquet_guarantee_terms
        superseded_clause: >-
          Where no guarantee is given by the deadline, the working guest count standing on the booking becomes the guarantee, and the client is billed against it as though they had confirmed it.
        replaced_by: >-
          Where no confirmed guarantee entry stands on the booking, the working count the booking was taken at is not read as a guarantee in its place, and the contracted value is built on the booking entry's own estimate, with no guaranteed count to dress the room or to price a bar against.
    trigger: on_request
    subject: [banquet_booking_cancelled]
    computes: contracted_value_usd
    target_tool: confirm_event_cancellation_0abc9941
    params:
      seated_bar_share: 0.50
    rule: >
      The contracted event value standing at the moment written notice of cancellation is given is the estimated contracted value
      standing on the booking entry in the event ledger. The room rental printed against the package is added to it in full. The service charge printed against the package is worked on the food and beverage value the contracted value is built on and added, and no service charge is worked on the room rental, on the audio-visual package or on the dance floor charge. The contracted value is the estimated value, the
      room rental and that service charge added together and rounded to two decimal places at the end only, the parts themselves
      being left unrounded. The food and beverage value the contracted value is built on is settled by what the records show the client has committed to for the event day. The room a confirmed booking holds is held for the whole of the event day, so an order standing on the client's corporate catering account for that day is food for that room, and the day alone settles it, whether or not the order names the room. Where a confirmed guarantee entry stands on the booking and catering orders stand on the client's
      corporate catering account for the event's own day, that value is the value the guarantee prices to together with the value
      of those same-day catering orders, because food ordered for that room on that day belongs to the event rather than to the
      catering account. Where a confirmed guarantee entry stands on the booking and no catering order stands for the event's own
      day, that value is the value the guarantee prices to alone. Where no confirmed guarantee entry stands on the booking, that value is the estimated contracted value standing on the booking entry. Where no confirmed guarantee entry stands on the booking, the working count the booking was taken at is not read as a guarantee in its place, and the contracted value is built on the booking entry's own estimate, with no guaranteed count to dress the room or to price a bar against. The room set-up the confirmed guarantee entry is built to settles which contracted extras stand in the value. Where the room stands set for
      seated rounds or for a reception, the audio-visual package and the dance floor charge printed against the package both stand
      in the contracted value, because a floor is laid and dressed for those set-ups. Where the room stands set for theater, for
      classroom or for boardroom, the audio-visual package printed against the package stands in the contracted value and no dance
      floor charge is added. Where no confirmed guarantee entry stands to name a room set-up, neither of those two charges stands in the contracted value.
      Room rental is settled against the food and beverage value the booking entry itself records. Where that value reaches the
      room rental waiver spend printed against the package, no room rental stands in the contracted value, and a partial waiver is
      never given. Where the food and beverage value standing on the booking entry falls short of the minimum food and beverage
      spend printed against the package, the room rental printed against the package stands in the contracted value together with
      the difference between that minimum spend and the value standing, which is taken as room hire.
      The service hours the contracted staffing is counted over are settled by how the guaranteed count compares with the working
      count the booking was taken at. Where a confirmed guarantee entry stands on the booking and the count it guarantees exceeds
      the working count the booking was taken at, the hours counted are the service hours included in the package together with
      the set-up lead hours and the tear-down window hours printed against the same package, because the room has to be re-dressed
      to the larger count and cleared after it. Where a confirmed guarantee entry stands on the booking and the count it guarantees
      does not exceed the working count the booking was taken at, the hours counted are the service hours included in the package
      together with the tear-down window hours printed against the same package. Where no confirmed guarantee entry stands on the
      booking, the hours counted are the service hours included in the package alone.
      Contracted service staff are counted up to the next whole member at the guests per server printed against the package, and
      charged at the staff rate per hour printed against the same package for the hours counted. Where a confirmed guarantee entry
      stands on the booking and the count it guarantees reaches the smallest guest count printed against the package, the staff are
      counted on the guaranteed count. Where no confirmed guarantee entry stands on the booking and the working count the booking
      was taken at reaches the smallest guest count printed against the package, the staff are counted on that working count.
      Where neither count reaches the smallest guest count printed against the package, no contracted staffing stands in the value.
      The bar element standing in the contracted value follows the room set-up and the count standing on the booking. Where the
      room stands set for a reception and the count standing on the booking reaches the smallest guest count printed against the
      package, the bar minimum printed against the package stands in the contracted value in full, a reception being drinks-led.
      Where the room stands set for seated rounds and the count standing on the booking reaches the smallest guest count printed
      against the package, the seated share of that bar minimum stands in the contracted value, wine being taken at the table
      rather than at a full bar. Where the room stands set otherwise, or the count standing on the booking does not reach the
      smallest guest count printed against the package, no bar element stands in the contracted value.
    prerequisite: []
    cross_category:
      - category: catering
        as: history
        reads: [catering_orders.amount_usd, catering_orders.service_date]
        note: the food and beverage value tier reads the client's corporate catering orders standing for the event's own day, from that account's order ledger.
    compute:
      - booked_value: "MAX('banquet_ledger','amount_usd', event_type='banquet_event_booked')"
      - booked_count: "MAX('banquet_ledger','guaranteed_headcount', event_type='banquet_event_booked')"
      - guarantee_value: "MAX('banquet_ledger','amount_usd', event_type='banquet_guarantee_confirmed')"
      - event_day: "LATEST('banquet_ledger','event_date', date_field='posted_date', event_type='banquet_guarantee_confirmed')"
      - same_day_catering_usd: "XSUM('catering','catering_orders','amount_usd', date_field='service_date', event_type='catering_order_placed', service_date=event_day)"
      - contracted_base_usd: "(guarantee_value + same_day_catering_usd) if (guarantee_value > 0 and same_day_catering_usd > 0) else ((guarantee_value) if (guarantee_value > 0 and same_day_catering_usd <= 0) else booked_value)"
      - setup_style: "LATEST('banquet_ledger','setup_style', date_field='posted_date', event_type='banquet_guarantee_confirmed')"
      - extras_usd: "(P('av_package_usd') + P('dance_floor_fee_usd')) if (setup_style == 'seated_rounds' or setup_style == 'reception') else (P('av_package_usd') if (setup_style == 'theater' or setup_style == 'classroom' or setup_style == 'boardroom') else 0)"
      - fb_standing_usd: "MAX('banquet_ledger','amount_usd', event_type='banquet_event_booked')"
      - rental_component_usd: "0 if fb_standing_usd >= P('room_rental_waiver_spend_usd') else (P('room_rental_usd') + P('min_food_beverage_spend_usd') - fb_standing_usd if fb_standing_usd < P('min_food_beverage_spend_usd') else P('room_rental_usd'))"
      - guarantee_entry_count: "COUNT('banquet_ledger', event_type='banquet_guarantee_confirmed')"
      - guaranteed_count: "MAX('banquet_ledger','guaranteed_headcount', event_type='banquet_guarantee_confirmed')"
      - staff_hours: "(P('included_service_hours') + P('setup_lead_hours') + P('teardown_window_hours')) if (guarantee_entry_count > 0 and guaranteed_count > booked_count) else ((P('included_service_hours') + P('teardown_window_hours')) if (guarantee_entry_count > 0 and guaranteed_count <= booked_count) else P('included_service_hours'))"
      - staffing_usd: "int((guaranteed_count + P('staffing_ratio_guests_per_server') - 1) / P('staffing_ratio_guests_per_server')) * P('staff_rate_per_hour_usd') * staff_hours if (guarantee_entry_count > 0 and guaranteed_count >= P('min_guests')) else (int((booked_count + P('staffing_ratio_guests_per_server') - 1) / P('staffing_ratio_guests_per_server')) * P('staff_rate_per_hour_usd') * staff_hours if (guarantee_entry_count <= 0 and booked_count >= P('min_guests')) else 0)"
      - covers_standing: "MX(MAX('banquet_ledger','guaranteed_headcount', event_type='banquet_guarantee_confirmed'), MAX('banquet_ledger','guaranteed_headcount', event_type='banquet_event_booked'))"
      - bar_component_usd: "P('bar_minimum_usd') if (setup_style == 'reception' and covers_standing >= P('min_guests')) else (K('seated_bar_share') * P('bar_minimum_usd') if (setup_style == 'seated_rounds' and covers_standing >= P('min_guests')) else 0)"
      - service_charge_usd: "contracted_base_usd * P('service_charge_pct') / 100"
      - result: "RND(contracted_base_usd + extras_usd + rental_component_usd + staffing_usd + bar_component_usd + service_charge_usd, 2)"
    compute_basis:
      booked_value: "The contracted event value standing at the moment written notice of cancellation is given is the estimated contracted value standing on the booking entry in the event ledger."
      guarantee_value: "Where a confirmed guarantee entry stands on the booking and no catering order stands for the event's own day, that value is the value the guarantee prices to alone."
      event_day: "Where a confirmed guarantee entry stands on the booking and catering orders stand on the client's corporate catering account for the event's own day, that value is the value the guarantee prices to together with the value of those same-day catering orders, because food ordered for that room on that day belongs to the event rather than to the catering account."
      same_day_catering_usd: "Where a confirmed guarantee entry stands on the booking and catering orders stand on the client's corporate catering account for the event's own day, that value is the value the guarantee prices to together with the value of those same-day catering orders, because food ordered for that room on that day belongs to the event rather than to the catering account."
      contracted_base_usd: "The food and beverage value the contracted value is built on is settled by what the records show the client has committed to for the event day. Where a confirmed guarantee entry stands on the booking and catering orders stand on the client's corporate catering account for the event's own day, that value is the value the guarantee prices to together with the value of those same-day catering orders, because food ordered for that room on that day belongs to the event rather than to the catering account. Where a confirmed guarantee entry stands on the booking and no catering order stands for the event's own day, that value is the value the guarantee prices to alone. Where no confirmed guarantee entry stands on the booking, that value is the estimated contracted value standing on the booking entry."
      setup_style: "The room set-up the confirmed guarantee entry is built to settles which contracted extras stand in the value."
      extras_usd: "Where the room stands set for seated rounds or for a reception, the audio-visual package and the dance floor charge printed against the package both stand in the contracted value, because a floor is laid and dressed for those set-ups. Where the room stands set for theater, for classroom or for boardroom, the audio-visual package printed against the package stands in the contracted value and no dance floor charge is added. Where no confirmed guarantee entry stands to name a room set-up, neither of those two charges stands in the contracted value."
      fb_standing_usd: "Room rental is settled against the food and beverage value the booking entry itself records."
      rental_component_usd: "Where that value reaches the room rental waiver spend printed against the package, no room rental stands in the contracted value, and a partial waiver is never given. Where the food and beverage value standing on the booking entry falls short of the minimum food and beverage spend printed against the package, the room rental printed against the package stands in the contracted value together with the difference between that minimum spend and the value standing, which is taken as room hire. The room rental printed against the package is added to it in full."
      guarantee_entry_count: "The service hours the contracted staffing is counted over are settled by how the guaranteed count compares with the working count the booking was taken at."
      staff_hours: "Where a confirmed guarantee entry stands on the booking and the count it guarantees exceeds the working count the booking was taken at, the hours counted are the service hours included in the package together with the set-up lead hours and the tear-down window hours printed against the same package, because the room has to be re-dressed to the larger count and cleared after it. Where a confirmed guarantee entry stands on the booking and the count it guarantees does not exceed the working count the booking was taken at, the hours counted are the service hours included in the package together with the tear-down window hours printed against the same package. Where no confirmed guarantee entry stands on the booking, the hours counted are the service hours included in the package alone."
      guaranteed_count: "Contracted service staff are counted up to the next whole member at the guests per server printed against the package, and charged at the staff rate per hour printed against the same package for the hours counted."
      staffing_usd: "Where a confirmed guarantee entry stands on the booking and the count it guarantees reaches the smallest guest count printed against the package, the staff are counted on the guaranteed count. Where no confirmed guarantee entry stands on the booking and the working count the booking was taken at reaches the smallest guest count printed against the package, the staff are counted on that working count. Where neither count reaches the smallest guest count printed against the package, no contracted staffing stands in the value."
      covers_standing: "The bar element standing in the contracted value follows the room set-up and the count standing on the booking."
      bar_component_usd: "Where the room stands set for a reception and the count standing on the booking reaches the smallest guest count printed against the package, the bar minimum printed against the package stands in the contracted value in full, a reception being drinks-led. Where the room stands set for seated rounds and the count standing on the booking reaches the smallest guest count printed against the package, the seated share of that bar minimum stands in the contracted value, wine being taken at the table rather than at a full bar. Where the room stands set otherwise, or the count standing on the booking does not reach the smallest guest count printed against the package, no bar element stands in the contracted value."
      service_charge_usd: "The service charge printed against the package is worked on the food and beverage value the contracted value is built on and added, and no service charge is worked on the room rental, on the audio-visual package or on the dance floor charge."
      result: "The contracted value is the estimated value, the room rental and that service charge added together and rounded to two decimal places at the end only, the parts themselves being left unrounded."
    factors:
      - id: committed_food_value
        effect: method
        decides: contracted_base_usd
        bindings: [guarantee_value, event_day, same_day_catering_usd, contracted_base_usd]
        ladder:
          - when: "a confirmed guarantee entry stands on the booking and catering orders stand on the client's corporate catering account for the event's own day"
            method: "the food and beverage value is the value the guarantee prices to together with the value of those same-day catering orders"
          - when: "a confirmed guarantee entry stands on the booking and no catering order stands for the event's own day"
            method: "the food and beverage value is the value the guarantee prices to alone"
          - when: "otherwise"
            method: "the food and beverage value is the estimated contracted value standing on the booking entry"
        baseline:
          contracted_base_usd: "booked_value"
        evidence: [history, cross_category]
        cross_difficulty: catering
      - id: contracted_room_extras
        effect: parameter
        decides: extras_usd
        bindings: [setup_style, extras_usd]
        ladder:
          - when: "the room stands set for seated rounds or for a reception"
            value: "P('av_package_usd') + P('dance_floor_fee_usd')"
          - when: "the room stands set for theater, for classroom or for boardroom"
            value: "P('av_package_usd')"
          - when: "otherwise"
            value: "0"
        baseline:
          extras_usd: "0"
        evidence: [history]
        cross_difficulty: null
      - id: room_rental_standing
        effect: parameter
        decides: rental_component_usd
        bindings: [fb_standing_usd, rental_component_usd]
        ladder:
          - when: "the food and beverage value standing on the booking entry reaches the room rental waiver spend printed against the package"
            value: "0"
          - when: "the food and beverage value standing on the booking entry falls short of the minimum food and beverage spend printed against the package"
            value: "P('room_rental_usd') + P('min_food_beverage_spend_usd') - fb_standing_usd"
          - when: "otherwise"
            value: "P('room_rental_usd')"
        baseline:
          rental_component_usd: "P('room_rental_usd')"
        evidence: [history]
        cross_difficulty: null
      - id: contracted_hours_counted
        effect: method
        decides: staff_hours
        bindings: [guarantee_entry_count, staff_hours]
        ladder:
          - when: "a confirmed guarantee entry stands on the booking and the count it guarantees exceeds the working count the booking was taken at"
            method: "the hours counted are the service hours included in the package together with the set-up lead hours and the tear-down window hours printed against the same package"
          - when: "a confirmed guarantee entry stands on the booking and the count it guarantees does not exceed the working count the booking was taken at"
            method: "the hours counted are the service hours included in the package together with the tear-down window hours printed against the same package"
          - when: "otherwise"
            method: "the hours counted are the service hours included in the package alone"
        baseline:
          staff_hours: "P('included_service_hours')"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: contracted_staffing
        effect: parameter
        decides: staffing_usd
        bindings: [guaranteed_count, staffing_usd]
        ladder:
          - when: "a confirmed guarantee entry stands on the booking and the count it guarantees reaches the smallest guest count printed against the package"
            value: "the contracted staff counted on the guaranteed count at the staff rate per hour printed against the package"
          - when: "no confirmed guarantee entry stands on the booking and the working count the booking was taken at reaches the smallest guest count printed against the package"
            value: "the contracted staff counted on that working count at the staff rate per hour printed against the package"
          - when: "otherwise"
            value: "0"
        baseline:
          staffing_usd: "0"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: bar_element_standing
        effect: parameter
        decides: bar_component_usd
        bindings: [covers_standing, bar_component_usd]
        ladder:
          - when: "the room stands set for a reception and the count standing on the booking reaches the smallest guest count printed against the package"
            value: "P('bar_minimum_usd')"
          - when: "the room stands set for seated rounds and the count standing on the booking reaches the smallest guest count printed against the package"
            value: "K('seated_bar_share') * P('bar_minimum_usd')"
          - when: "otherwise"
            value: "0"
        baseline:
          bar_component_usd: "0"
        evidence: [history, tier_param]
        cross_difficulty: null
    baseline:
      rule: >-
        The contracted event value standing at the moment written notice of cancellation is given is the estimated contracted
        value standing on the booking entry in the event ledger. The room rental printed against the package is added to it in
        full. The service charge printed against the package is worked on the food and beverage value the contracted value is built on and added, and no service charge is worked on the room rental, on the audio-visual package or on the dance floor charge. The contracted value is the
        estimated value, the room rental and that service charge added together and rounded to two decimal places at the end
        only, the parts themselves being left unrounded.
      params: [room_rental_usd, service_charge_pct]
    inputs:
      history:
        - {table: banquet_ledger, aggregate: max, field: amount_usd, filters: {event_type: banquet_event_booked}}
        - {table: banquet_ledger, aggregate: max, field: amount_usd, filters: {event_type: banquet_guarantee_confirmed}}
        - {table: banquet_ledger, aggregate: latest, field: setup_style, filters: {event_type: banquet_event_booked}}
        - {table: banquet_ledger, aggregate: count, field: banquet_ledger_id, filters: {event_type: banquet_guarantee_confirmed}}
        - {category: catering, table: catering_orders, aggregate: sum, field: amount_usd, filters: {event_type: catering_order_placed}}
      cross_category: [catering]
  - id: banquet_ext_cancellation_charge_assessment
    base_policy_refs: [banquet_cancellation_terms, banquet_agg_deposit_and_diary_pooling, banquet_guarantee_terms]
    overwrite:
      - base_policy: banquet_cancellation_terms
        superseded_clause: >-
          Notice at or beyond the free-cancellation days printed against the package carries no charge; notice between ninety and thirty days before the event carries the ninety-to-thirty percentage; notice between thirty and seven days carries the thirty-to-seven percentage; and notice inside seven days carries the within-seven-days percentage, each applied to the contracted event value standing at the moment notice is given.
        replaced_by: >-
          The percentage the charge is worked at is the notice percentage and the repeat percentage added together and held to one hundred, and the charge is that percentage of the contracted event value standing in the cancellation entry.
      - base_policy: banquet_cancellation_terms
        superseded_clause: >-
          Deposits held against the cancelled booking are set against the charge first, and only the balance is invoiced; where the deposit exceeds the charge the difference is returned.
        replaced_by: >-
          What is raised is the full charge the cancelled booking carries, and deposit money standing against that booking is set against it when the charge is settled rather than when it is raised.
    trigger: state_due
    subject: [banquet_cancellation_charge_posted]
    computes: cancellation_charge_usd
    target_tool: post_cancellation_charge_5262dfa3
    params:
      diary_relief_two_share: 0.75
      diary_relief_one_share: 0.90
      repeat_uplift_two_pct: 10.00
      repeat_uplift_one_pct: 5.00
    rule: >
      The charge for a cancelled event is not fixed until the event ledger carries, for that booking, a cancellation entry
      recording the day written notice was given and the contracted event value standing at that day. The charge for a cancelled
      event is the contracted event value standing in the cancellation entry for that booking, taken at the thirty-to-seven-days
      cancellation percentage printed against the package, and rounded to two decimal places at the end only.
      The notice percentage is settled by the whole calendar days between the day written notice was given and the event date the
      cancellation entry records. Notice given at or beyond the free-cancellation days printed against the package carries no
      notice percentage at all. Notice given inside the free-cancellation days but at or beyond thirty days before the event
      carries the ninety-to-thirty percentage printed against the package. Notice given inside thirty days but at or beyond seven
      days before the event carries the thirty-to-seven percentage printed against the package. Notice given inside seven days of
      the event carries the within-seven-days percentage printed against the package.
      A diary that has already lost events to cancellation is read as well, over the twelve months ending on the day the charge is
      raised. Where the agreement has already carried two or more cancellation charges in those twelve months, the repeat
      percentage is the higher repeat uplift. Where the agreement has carried exactly one cancellation charge in those twelve
      months, the repeat percentage is the lower repeat uplift. Where the agreement has carried no cancellation charge in those
      twelve months, there is no repeat percentage. The percentage the charge is worked at is the notice percentage and the repeat
      percentage added together and held to one hundred, and the charge is that percentage of the contracted event value standing
      in the cancellation entry.
      What the client still has in the diary is then read, counting the confirmed events on the agreement that have neither been
      delivered nor cancelled. Where two or more such events stand on the agreement, the charge worked at that percentage is
      reduced by a quarter, because the business that remains keeps the venue whole. Where exactly one such event stands on the
      agreement, the charge worked at that percentage is reduced by a tenth. Where no such event stands on the agreement, the
      charge worked at that percentage stands as it is.
      Licensed security rostered for the date is charged on top where it can no longer be stood down. Where written notice was
      given inside seven days of the event and the count standing in the cancellation entry passes the security threshold printed
      against the package, the security rate per hour printed against the package is charged for the service hours included in the
      same package. Where written notice was given at or beyond seven days before the event but inside the days deposits stay
      returnable printed against the package, and the count standing in the cancellation entry passes that same threshold, the
      security rate per hour printed against the package is charged for the set-up lead hours printed against the same package.
      Where neither holds, no security stands on the charge.
      The diary work already done on the agreement is charged on top as well. Where the event request log carries a venue change the desk has approved on the agreement, the venue change charge printed against the package is added. Where the event request log carries a date change the desk has approved on the agreement and no approved venue change, the date change charge printed against the package is added. Where the event request log carries neither, no such charge is added. What is raised is the full charge the cancelled booking carries, and deposit money standing against that booking is set against it when the charge is settled rather than when it is raised. The charge raised is the charge after the diary reduction, the security standing on it and the diary work charge added together, and rounded to two decimal places at the end only.
    prerequisite:
      - problem: banquet_ext_cancellation_notice_value
        kind: value_input
        gate: contracted_value
        form: state
        policy_source: >-
          The charge for a cancelled event is not fixed until the event ledger carries, for that booking, a cancellation entry recording the day written notice was given and the contracted event value standing at that day.
        condition: >-
          A banquet_ledger row of event family banquet_booking_cancelled stands for the booking, carrying notice_given_date and the contracted amount_usd standing at that day.
        resolved_by: confirm_event_cancellation_0abc9941
        effect: >-
          Once that cancellation entry stands, contracted_value takes the contracted event value the entry records instead of zero, and notice_day and cancelled_day become readable.
    cross_category: []
    compute:
      - notice_day: "LATEST('banquet_ledger','notice_given_date', date_field='posted_date', event_type='banquet_booking_cancelled')"
      - cancelled_day: "LATEST('banquet_ledger','event_date', date_field='posted_date', event_type='banquet_booking_cancelled')"
      - notice_days: "DAYS(notice_day, cancelled_day)"
      - band_pct: "0 if notice_days >= P('cancellation_notice_days_full_refund') else (P('cancellation_fee_pct_90_to_30_days') if notice_days >= 30 else (P('cancellation_fee_pct_30_to_7_days') if notice_days >= 7 else P('cancellation_fee_pct_within_7_days')))"
      - contracted_value: "MAX('banquet_ledger','amount_usd', event_type='banquet_booking_cancelled')"
      - prior_charges_12m: "COUNT('banquet_ledger', within_months=12, date_field='posted_date', event_type='banquet_cancellation_charge_posted')"
      - repeat_uplift_pct: "K('repeat_uplift_two_pct') if prior_charges_12m >= 2 else (K('repeat_uplift_one_pct') if prior_charges_12m == 1 else 0)"
      - effective_pct: "MN(band_pct + repeat_uplift_pct, 100)"
      - banded_charge_usd: "contracted_value * effective_pct / 100"
      - open_diary_events: "COUNT('banquet_ledger', event_type='banquet_event_booked') - COUNT('banquet_ledger', event_type='banquet_event_delivered') - COUNT('banquet_ledger', event_type='banquet_booking_cancelled')"
      - charge_after_relief: "banded_charge_usd * K('diary_relief_two_share') if open_diary_events >= 2 else (banded_charge_usd * K('diary_relief_one_share') if open_diary_events == 1 else banded_charge_usd)"
      - cancelled_count: "MAX('banquet_ledger','guaranteed_headcount', event_type='banquet_booking_cancelled')"
      - security_standdown_usd: "P('security_rate_per_hour_usd') * P('included_service_hours') if (notice_days < 7 and cancelled_count > P('security_staff_required_above_guests')) else (P('security_rate_per_hour_usd') * P('setup_lead_hours') if (notice_days < P('deposit_refundable_until_days_before') and cancelled_count > P('security_staff_required_above_guests')) else 0)"
      - approved_venue_changes: "COUNT('banquet_event_intake', request_type='venue_change', request_status='approved')"
      - approved_date_changes: "COUNT('banquet_event_intake', request_type='date_change', request_status='approved')"
      - admin_component_usd: "P('venue_change_fee_usd') if approved_venue_changes >= 1 else (P('date_change_fee_usd') if (approved_date_changes >= 1 and approved_venue_changes < 1) else 0)"
      - result: "RND(charge_after_relief + security_standdown_usd + admin_component_usd, 2)"
    compute_basis:
      notice_day: "The notice percentage is settled by the whole calendar days between the day written notice was given and the event date the cancellation entry records."
      cancelled_day: "The notice percentage is settled by the whole calendar days between the day written notice was given and the event date the cancellation entry records."
      notice_days: "The notice percentage is settled by the whole calendar days between the day written notice was given and the event date the cancellation entry records."
      band_pct: "Notice given at or beyond the free-cancellation days printed against the package carries no notice percentage at all. Notice given inside the free-cancellation days but at or beyond thirty days before the event carries the ninety-to-thirty percentage printed against the package. Notice given inside thirty days but at or beyond seven days before the event carries the thirty-to-seven percentage printed against the package. Notice given inside seven days of the event carries the within-seven-days percentage printed against the package."
      contracted_value: "The charge for a cancelled event is the contracted event value standing in the cancellation entry for that booking, taken at the thirty-to-seven-days cancellation percentage printed against the package, and rounded to two decimal places at the end only."
      prior_charges_12m: "A diary that has already lost events to cancellation is read as well, over the twelve months ending on the day the charge is raised."
      repeat_uplift_pct: "Where the agreement has already carried two or more cancellation charges in those twelve months, the repeat percentage is the higher repeat uplift. Where the agreement has carried exactly one cancellation charge in those twelve months, the repeat percentage is the lower repeat uplift. Where the agreement has carried no cancellation charge in those twelve months, there is no repeat percentage."
      effective_pct: "The percentage the charge is worked at is the notice percentage and the repeat percentage added together and held to one hundred, and the charge is that percentage of the contracted event value standing in the cancellation entry."
      banded_charge_usd: "The percentage the charge is worked at is the notice percentage and the repeat percentage added together and held to one hundred, and the charge is that percentage of the contracted event value standing in the cancellation entry."
      open_diary_events: "What the client still has in the diary is then read, counting the confirmed events on the agreement that have neither been delivered nor cancelled."
      charge_after_relief: "Where two or more such events stand on the agreement, the charge worked at that percentage is reduced by a quarter, because the business that remains keeps the venue whole. Where exactly one such event stands on the agreement, the charge worked at that percentage is reduced by a tenth. Where no such event stands on the agreement, the charge worked at that percentage stands as it is."
      cancelled_count: "Licensed security rostered for the date is charged on top where it can no longer be stood down."
      security_standdown_usd: "Where written notice was given inside seven days of the event and the count standing in the cancellation entry passes the security threshold printed against the package, the security rate per hour printed against the package is charged for the service hours included in the same package. Where written notice was given at or beyond seven days before the event but inside the days deposits stay returnable printed against the package, and the count standing in the cancellation entry passes that same threshold, the security rate per hour printed against the package is charged for the set-up lead hours printed against the same package. Where neither holds, no security stands on the charge."
      approved_venue_changes: "The diary work already done on the agreement is charged on top as well."
      approved_date_changes: "The diary work already done on the agreement is charged on top as well."
      admin_component_usd: "Where the event request log carries a venue change the desk has approved on the agreement, the venue change charge printed against the package is added. Where the event request log carries a date change the desk has approved on the agreement and no approved venue change, the date change charge printed against the package is added. Where the event request log carries neither, no such charge is added."
      result: "The charge raised is the charge after the diary reduction, the security standing on it and the diary work charge added together, and rounded to two decimal places at the end only."
    factors:
      - id: notice_percentage
        effect: parameter
        decides: band_pct
        bindings: [notice_day, cancelled_day, notice_days, band_pct]
        ladder:
          - when: "notice was given at or beyond the free-cancellation days printed against the package"
            value: "0"
          - when: "notice was given inside the free-cancellation days but at or beyond thirty days before the event"
            value: "P('cancellation_fee_pct_90_to_30_days')"
          - when: "notice was given inside thirty days but at or beyond seven days before the event"
            value: "P('cancellation_fee_pct_30_to_7_days')"
          - when: "notice was given inside seven days of the event"
            value: "P('cancellation_fee_pct_within_7_days')"
        baseline:
          band_pct: "P('cancellation_fee_pct_30_to_7_days')"
        evidence: [date, history]
        cross_difficulty: null
      - id: repeat_cancellation_percentage
        effect: parameter
        decides: repeat_uplift_pct
        bindings: [prior_charges_12m, repeat_uplift_pct]
        ladder:
          - when: "the agreement has already carried two or more cancellation charges in the twelve months ending on the day the charge is raised"
            value: "K('repeat_uplift_two_pct')"
          - when: "the agreement has carried exactly one cancellation charge in those twelve months"
            value: "K('repeat_uplift_one_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          repeat_uplift_pct: "0"
        evidence: [history]
        cross_difficulty: null
      - id: remaining_diary_relief
        effect: method
        decides: charge_after_relief
        bindings: [open_diary_events, charge_after_relief]
        ladder:
          - when: "two or more confirmed events that have neither been delivered nor cancelled stand on the agreement"
            method: "the charge worked at that percentage is reduced by a quarter"
          - when: "exactly one confirmed event that has neither been delivered nor cancelled stands on the agreement"
            method: "the charge worked at that percentage is reduced by a tenth"
          - when: "otherwise"
            method: "the charge worked at that percentage stands as it is"
        baseline:
          charge_after_relief: "banded_charge_usd"
        evidence: [history]
        cross_difficulty: null
      - id: security_standdown
        effect: parameter
        decides: security_standdown_usd
        bindings: [cancelled_count, security_standdown_usd]
        ladder:
          - when: "written notice was given inside seven days of the event and the count standing in the cancellation entry passes the security threshold printed against the package"
            value: "P('security_rate_per_hour_usd') * P('included_service_hours')"
          - when: "written notice was given at or beyond seven days before the event but inside the days deposits stay returnable printed against the package, and the count standing in the cancellation entry passes that same threshold"
            value: "P('security_rate_per_hour_usd') * P('setup_lead_hours')"
          - when: "otherwise"
            value: "0"
        baseline:
          security_standdown_usd: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: diary_work_charge
        effect: parameter
        decides: admin_component_usd
        bindings: [approved_venue_changes, approved_date_changes, admin_component_usd]
        ladder:
          - when: "the event request log carries a venue change the desk has approved on the agreement"
            value: "P('venue_change_fee_usd')"
          - when: "the event request log carries a date change the desk has approved on the agreement and no approved venue change"
            value: "P('date_change_fee_usd')"
          - when: "otherwise"
            value: "0"
        baseline:
          admin_component_usd: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The charge for a cancelled event is the contracted event value standing in the cancellation entry for that booking, taken
        at the thirty-to-seven-days cancellation percentage printed against the package, and rounded to two decimal places at the
        end only.
      params: [cancellation_fee_pct_30_to_7_days]
    inputs:
      history:
        - {table: banquet_ledger, aggregate: latest, field: notice_given_date, filters: {event_type: banquet_booking_cancelled}}
        - {table: banquet_ledger, aggregate: max, field: amount_usd, filters: {event_type: banquet_booking_cancelled}}
        - {table: banquet_ledger, aggregate: count, field: banquet_ledger_id, within_months: 12, filters: {event_type: banquet_cancellation_charge_posted}}
        - {table: banquet_ledger, aggregate: count, field: banquet_ledger_id, filters: {event_type: banquet_event_booked}}
        - {table: banquet_event_intake, aggregate: count, field: banquet_event_request_id, filters: {request_type: date_change, request_status: approved}}
      cross_category: []
  - id: banquet_ext_delivered_event_bill
    base_policy_refs: [banquet_settlement_terms, banquet_combination_venue_interaction, banquet_guarantee_terms]
    overwrite:
      - base_policy: banquet_guarantee_terms
        superseded_clause: >-
          Where fewer guests attend than were guaranteed, the event is billed on the guaranteed count at the shortfall percentage printed against the package, applied to the per-guest value of the contracted event.
        replaced_by: >-
          Where the guests served fell short of the count the guarantee confirmed, the food and beverage the bill is priced on is the guaranteed count at the per-guest value the guarantee priced to, the shortfall itself being dealt with when the bill is settled rather than when it is raised.
      - base_policy: banquet_settlement_terms
        superseded_clause: >-
          Deposits held against the booking are applied to the final bill before it is issued, oldest deposit first, and the bill shows the gross charge, the deposits applied and the balance due.
        replaced_by: >-
          No deposit money is set against the bill at the moment it is raised: the bill is the gross charge for the event, and deposit money standing against the booking is set against it when it is settled.
    trigger: state_due
    subject: [banquet_event_invoiced]
    computes: invoice_amount_usd
    target_tool: raise_event_final_bill_fa928380
    params:
      seated_bar_share: 0.50
    rule: >
      The final bill for an event that has been held is the food and beverage actually consumed, as the delivered entry standing
      in the event ledger records it. The room rental printed against the package is added to it in full. The service charge
      printed against the package is worked on the food and beverage the bill is priced on and added, and no service charge is
      worked on the room rental, on the audio-visual package or on the bar minimum. The bill is the food and beverage the bill is priced on, the room rental and that service charge added together and rounded to two decimal places at the end only, the parts themselves being left unrounded. No deposit money is set against the bill at the moment it is raised: the bill is the gross charge for the event, and deposit money standing against the booking is set against it when it is settled. What the food and beverage is priced on is settled by the guest count the event was actually served to against the count the
      guarantee confirmed, at the per-guest value the guarantee priced to, which is the value the guarantee entry carries divided
      by the count it guarantees. Where the guests served passed the count the guarantee confirmed, the food and beverage the bill
      is priced on is every guest served at that per-guest value. Where the guests served fell short of the count the guarantee
      confirmed, the food and beverage the bill is priced on is the guaranteed count at the per-guest value the guarantee priced
      to, the shortfall itself being dealt with when the bill is settled rather than when it is raised. Where the guests served
      match the count the guarantee confirmed, or no delivered entry stands for the booking, the food and beverage the bill is
      priced on is the value actually consumed as the delivered entry records it.
      Room rental is settled against the food and beverage actually consumed at the event. Where that consumed value reaches the room rental waiver spend printed against the package, no room rental stands on the bill, and a partial waiver is never given. Where that consumed value falls short of the minimum food and beverage spend printed against the package, the room rental printed against the package stands on the bill together with the difference between that minimum spend and the consumed value, which is taken as room hire.
      The room set-up the guarantee entry is built to settles the production charges standing on the bill. Where the room stood
      set for seated rounds or for a reception, the audio-visual package and the dance floor charge printed against the package
      both stand on the bill. Where the room stood set for theater, for classroom or for boardroom, the audio-visual package
      printed against the package stands on the bill and no dance floor charge is added. Where no confirmed guarantee entry stands
      to name a room set-up, neither of those two charges stands on the bill.
      Service staff are counted up to the next whole member at the guests per server printed against the package and charged at
      the staff rate per hour printed against the same package for the service hours included in it. Where a delivered entry
      stands for the booking and the guests served passed the count the guarantee confirmed, the staff are counted on the guests
      served. Where a delivered entry stands for the booking and the guests served did not pass the count the guarantee confirmed,
      the staff are counted on the guaranteed count, the roster having been booked to it. Where no delivered entry stands for the
      booking, no service staff stand on the bill.
      Licensed security is charged at the security rate per hour printed against the package. Where the guests served pass the
      security threshold printed against the package, the rate is charged for the service hours included in the package together
      with the set-up lead hours printed against the same package, the doors being covered from set-up. Where the guests served do
      not pass that threshold but the count the delivered entry was guaranteed to does, the rate is charged for the service hours
      included in the package alone, the roster having been booked to the guarantee. Where neither count passes that threshold, no
      security stands on the bill.
      The bar element standing on the bill follows the room the booking was taken for and the guests served. Where that room stood
      set for a reception and the guests served reach the smallest guest count printed against the package, the bar minimum
      printed against the package stands on the bill in full, a reception being drinks-led. Where that room stood set for seated
      rounds and the guests served reach the smallest guest count printed against the package, the seated share of that bar
      minimum stands on the bill, wine being taken at the table rather than at a full bar. Where that room stood set otherwise, or
      the guests served do not reach the smallest guest count printed against the package, no bar element stands on the bill.
    prerequisite: []
    cross_category: []
    compute:
      - guarantee_value: "MAX('banquet_ledger','amount_usd', event_type='banquet_guarantee_confirmed')"
      - guaranteed_count: "MAX('banquet_ledger','guaranteed_headcount', event_type='banquet_guarantee_confirmed')"
      - per_cover_usd: "guarantee_value / MX(guaranteed_count, 1)"
      - served_count: "MAX('banquet_ledger','actual_headcount', event_type='banquet_event_delivered')"
      - delivered_value: "MAX('banquet_ledger','amount_usd', event_type='banquet_event_delivered')"
      - billed_food_usd: "served_count * per_cover_usd if (served_count > 0 and served_count > guaranteed_count) else (guaranteed_count * per_cover_usd if (served_count > 0 and served_count < guaranteed_count) else delivered_value)"
      - rental_component_usd: "0 if delivered_value >= P('room_rental_waiver_spend_usd') else (P('room_rental_usd') + P('min_food_beverage_spend_usd') - delivered_value if delivered_value < P('min_food_beverage_spend_usd') else P('room_rental_usd'))"
      - setup_style: "LATEST('banquet_ledger','setup_style', date_field='posted_date', event_type='banquet_guarantee_confirmed')"
      - av_component_usd: "(P('av_package_usd') + P('dance_floor_fee_usd')) if (setup_style == 'seated_rounds' or setup_style == 'reception') else (P('av_package_usd') if (setup_style == 'theater' or setup_style == 'classroom' or setup_style == 'boardroom') else 0)"
      - delivered_entries: "COUNT('banquet_ledger', event_type='banquet_event_delivered')"
      - service_staff_usd: "int((served_count + P('staffing_ratio_guests_per_server') - 1) / P('staffing_ratio_guests_per_server')) * P('staff_rate_per_hour_usd') * P('included_service_hours') if (delivered_entries > 0 and served_count > guaranteed_count) else (int((guaranteed_count + P('staffing_ratio_guests_per_server') - 1) / P('staffing_ratio_guests_per_server')) * P('staff_rate_per_hour_usd') * P('included_service_hours') if (delivered_entries > 0 and served_count <= guaranteed_count) else 0)"
      - security_basis_count: "MAX('banquet_ledger','guaranteed_headcount', event_type='banquet_event_delivered')"
      - security_usd: "P('security_rate_per_hour_usd') * (P('included_service_hours') + P('setup_lead_hours')) if served_count > P('security_staff_required_above_guests') else (P('security_rate_per_hour_usd') * P('included_service_hours') if (served_count <= P('security_staff_required_above_guests') and security_basis_count > P('security_staff_required_above_guests')) else 0)"
      - bar_setup: "LATEST('banquet_ledger','setup_style', date_field='posted_date', event_type='banquet_event_booked')"
      - bar_component_usd: "P('bar_minimum_usd') if (bar_setup == 'reception' and served_count >= P('min_guests')) else (K('seated_bar_share') * P('bar_minimum_usd') if (bar_setup == 'seated_rounds' and served_count >= P('min_guests')) else 0)"
      - service_charge_usd: "billed_food_usd * P('service_charge_pct') / 100"
      - result: "RND(billed_food_usd + rental_component_usd + av_component_usd + service_staff_usd + security_usd + bar_component_usd + service_charge_usd, 2)"
    compute_basis:
      guarantee_value: "What the food and beverage is priced on is settled by the guest count the event was actually served to against the count the guarantee confirmed, at the per-guest value the guarantee priced to, which is the value the guarantee entry carries divided by the count it guarantees."
      guaranteed_count: "What the food and beverage is priced on is settled by the guest count the event was actually served to against the count the guarantee confirmed, at the per-guest value the guarantee priced to, which is the value the guarantee entry carries divided by the count it guarantees."
      per_cover_usd: "at the per-guest value the guarantee priced to, which is the value the guarantee entry carries divided by the count it guarantees"
      served_count: "What the food and beverage is priced on is settled by the guest count the event was actually served to against the count the guarantee confirmed."
      delivered_value: "Room rental is settled against the food and beverage actually consumed at the event."
      billed_food_usd: "Where the guests served passed the count the guarantee confirmed, the food and beverage the bill is priced on is every guest served at that per-guest value. Where the guests served fell short of the count the guarantee confirmed, the food and beverage the bill is priced on is the guaranteed count at the per-guest value the guarantee priced to, the shortfall itself being dealt with when the bill is settled rather than when it is raised. Where the guests served match the count the guarantee confirmed, or no delivered entry stands for the booking, the food and beverage the bill is priced on is the value actually consumed as the delivered entry records it."
      rental_component_usd: "Where that consumed value reaches the room rental waiver spend printed against the package, no room rental stands on the bill, and a partial waiver is never given. Where that consumed value falls short of the minimum food and beverage spend printed against the package, the room rental printed against the package stands on the bill together with the difference between that minimum spend and the consumed value, which is taken as room hire. The room rental printed against the package is added to it in full."
      setup_style: "The room set-up the guarantee entry is built to settles the production charges standing on the bill."
      av_component_usd: "Where the room stood set for seated rounds or for a reception, the audio-visual package and the dance floor charge printed against the package both stand on the bill. Where the room stood set for theater, for classroom or for boardroom, the audio-visual package printed against the package stands on the bill and no dance floor charge is added. Where no confirmed guarantee entry stands to name a room set-up, neither of those two charges stands on the bill."
      delivered_entries: "Service staff are counted up to the next whole member at the guests per server printed against the package and charged at the staff rate per hour printed against the same package for the service hours included in it."
      service_staff_usd: "Where a delivered entry stands for the booking and the guests served passed the count the guarantee confirmed, the staff are counted on the guests served. Where a delivered entry stands for the booking and the guests served did not pass the count the guarantee confirmed, the staff are counted on the guaranteed count, the roster having been booked to it. Where no delivered entry stands for the booking, no service staff stand on the bill."
      security_basis_count: "Licensed security is charged at the security rate per hour printed against the package."
      security_usd: "Where the guests served pass the security threshold printed against the package, the rate is charged for the service hours included in the package together with the set-up lead hours printed against the same package, the doors being covered from set-up. Where the guests served do not pass that threshold but the count the delivered entry was guaranteed to does, the rate is charged for the service hours included in the package alone, the roster having been booked to the guarantee. Where neither count passes that threshold, no security stands on the bill."
      bar_setup: "The bar element standing on the bill follows the room the booking was taken for and the guests served."
      bar_component_usd: "Where that room stood set for a reception and the guests served reach the smallest guest count printed against the package, the bar minimum printed against the package stands on the bill in full, a reception being drinks-led. Where that room stood set for seated rounds and the guests served reach the smallest guest count printed against the package, the seated share of that bar minimum stands on the bill, wine being taken at the table rather than at a full bar. Where that room stood set otherwise, or the guests served do not reach the smallest guest count printed against the package, no bar element stands on the bill."
      service_charge_usd: "The service charge printed against the package is worked on the food and beverage the bill is priced on and added, and no service charge is worked on the room rental, on the audio-visual package or on the bar minimum."
      result: "The bill is the food and beverage the bill is priced on, the room rental and that service charge added together and rounded to two decimal places at the end only, the parts themselves being left unrounded."
    factors:
      - id: billed_food_basis
        effect: method
        decides: billed_food_usd
        bindings: [guarantee_value, guaranteed_count, per_cover_usd, served_count, billed_food_usd]
        ladder:
          - when: "the guests served passed the count the guarantee confirmed"
            method: "the food and beverage the bill is priced on is every guest served at the per-guest value the guarantee priced to"
          - when: "the guests served fell short of the count the guarantee confirmed"
            method: "the food and beverage the bill is priced on is the guaranteed count at the per-guest value the guarantee priced to"
          - when: "otherwise"
            method: "the food and beverage the bill is priced on is the value actually consumed as the delivered entry records it"
        baseline:
          billed_food_usd: "delivered_value"
        evidence: [history]
        cross_difficulty: null
      - id: room_rental_on_bill
        effect: parameter
        decides: rental_component_usd
        bindings: [delivered_value, rental_component_usd]
        ladder:
          - when: "the food and beverage actually consumed at the event reaches the room rental waiver spend printed against the package"
            value: "0"
          - when: "the food and beverage actually consumed at the event falls short of the minimum food and beverage spend printed against the package"
            value: "P('room_rental_usd') + P('min_food_beverage_spend_usd') - delivered_value"
          - when: "otherwise"
            value: "P('room_rental_usd')"
        baseline:
          rental_component_usd: "P('room_rental_usd')"
        evidence: [history]
        cross_difficulty: null
      - id: production_charges
        effect: parameter
        decides: av_component_usd
        bindings: [setup_style, av_component_usd]
        ladder:
          - when: "the room stood set for seated rounds or for a reception"
            value: "P('av_package_usd') + P('dance_floor_fee_usd')"
          - when: "the room stood set for theater, for classroom or for boardroom"
            value: "P('av_package_usd')"
          - when: "otherwise"
            value: "0"
        baseline:
          av_component_usd: "0"
        evidence: [history]
        cross_difficulty: null
      - id: service_staff_on_bill
        effect: parameter
        decides: service_staff_usd
        bindings: [delivered_entries, service_staff_usd]
        ladder:
          - when: "a delivered entry stands for the booking and the guests served passed the count the guarantee confirmed"
            value: "the staff counted on the guests served at the staff rate per hour printed against the package"
          - when: "a delivered entry stands for the booking and the guests served did not pass the count the guarantee confirmed"
            value: "the staff counted on the guaranteed count at the staff rate per hour printed against the package"
          - when: "otherwise"
