        "Gala Reception Package": {bill_days_after: "=final_invoice_days_after_event", service_charge_pct: "=service_charge_pct", av_usd: "=av_package_usd", dance_floor_usd: "=dance_floor_fee_usd", overtime_rate_usd: "=overtime_rate_per_hour_usd", included_hours: "=included_service_hours", corkage_usd: "=corkage_fee_per_bottle_usd", adjustment_cap_pct: "=final_bill_adjustment_cap_pct_of_event"}
