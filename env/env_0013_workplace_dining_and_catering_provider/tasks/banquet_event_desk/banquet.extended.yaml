        bindings: [security_basis_count, security_usd]
        ladder:
          - when: "the guests served pass the security threshold printed against the package"
            value: "P('security_rate_per_hour_usd') * (P('included_service_hours') + P('setup_lead_hours'))"
          - when: "the guests served do not pass that threshold but the count the delivered entry was guaranteed to does"
            value: "P('security_rate_per_hour_usd') * P('included_service_hours')"
