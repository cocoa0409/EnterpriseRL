  - id: banquet_ext_event_bill_settlement
    base_policy_refs: [banquet_payment_terms, banquet_settlement_terms, banquet_agg_deposit_and_diary_pooling, banquet_guarantee_terms, banquet_combination_venue_interaction]
    overwrite:
      - base_policy: banquet_settlement_terms
        superseded_clause: >-
          Deposits held against the booking are applied to the final bill before it is issued, oldest deposit first, and the bill shows the gross charge, the deposits applied and the balance due.
        replaced_by: >-
          Deposit money standing against the booking is set against the amount billed at settlement rather than before the bill is issued, and where that money reaches the amount billed the whole of the amount billed is met from it, the surplus being returned rather than carried.
      - base_policy: banquet_payment_terms
        superseded_clause: >-
          The client may dispute a final bill no later than the dispute window for the package, counted in calendar days from the day the final bill was raised.
        replaced_by: >-
          Where the bill was raised later after the event than the days the package prints for raising it, and a delivered entry stands for the booking, the window runs from the day the event was delivered, the client having had the substance of the bill at the event itself.
      - base_policy: banquet_combination_venue_interaction
        superseded_clause: >-
          A private event and banquet booking and a corporate catering order for the same room on the same day are mutually exclusive: the room is held by the booking, and any additional food for that room is added to the event rather than ordered through the catering agreement.
        replaced_by: >-
          The room a confirmed booking holds is held for the whole of the event day, so an order standing on that account for that day is food for that room, and the day alone settles it, whether or not the order names the room.
    trigger: on_request
    subject: [banquet_payment_posted]
    computes: payment_amount_usd
    target_tool: settle_event_bill_79f0663f
    params:
      single_claim_adjustment_pct: 5.00
    rule: >
      The amount an event bill is settled with is fixed only after the event ledger carries the final bill for that booking, with
      the amount billed and the bill reference the payment settles. The amount an event bill is settled with is the amount the
      bill was raised for, as the invoice entry standing in the event ledger records it, rounded to two decimal places at the end
      only, the parts themselves being left unrounded.
      Deposit money standing against the booking is set against the amount billed at settlement rather than before the bill is
      issued, and where that money reaches the amount billed the whole of the amount billed is met from it, the surplus being
      returned rather than carried. Where deposit money stands against the booking and falls short of the amount billed, all of
      that money comes off what is settled. Where no deposit money stands against the booking, nothing comes off on that account.
      The deposit money the settlement draws on is what the agreement's event ledger shows taken in deposits, less anything already set against a bill and less anything already returned.
      A goodwill adjustment is allowed on the final bill up to the ceiling printed against the package, worked on the contracted
      event value the guarantee priced to, and an adjustment beyond that ceiling is not made at the desk. Where two or more credit
      claims on the booking stand approved in the event request log, the adjustment is the ceiling percentage printed against the
      package. Where exactly one credit claim on the booking stands approved in the event request log, the adjustment is the
      single-claim percentage. Where no credit claim on the booking stands approved, no goodwill adjustment is made. The day the client's window to dispute the bill runs from is settled by whether the desk raised the bill in time. The days the desk took to raise the bill are counted from the day the event was delivered, or, where no delivered entry stands for the booking, from the day the booking's event was to have been held. Where the
      bill was raised later after the event than the days the package prints for raising it, and a delivered entry stands for the
      booking, the window runs from the day the event was delivered, the client having had the substance of the bill at the event
      itself. Where the bill was raised later than those days and no delivered entry stands for the booking, the window runs from
      the day the booking's event was to have been held. Where the bill was raised within those days, the window runs from the day
      the bill was raised.
      Where the client disputes a line on the final bill, the undisputed balance falls due on the ordinary terms and only the
      disputed line is held over. Where a credit claim on the booking stands in review in the event request log and that window is
      still open, the audio-visual package and the dance floor charge printed against the package are both held over. Where a
      credit claim on the booking stands in review in the event request log and that window has closed, the audio-visual package
      printed against the package alone is held over. Where no credit claim on the booking stands in review, nothing is held over.
      Food ordered on the client's corporate catering account for the room on the event's own day belongs to the event rather than to that account. The room a confirmed booking holds is held for the whole of the event day, so an order standing on that account for that day is food for that room, and the day alone settles it, whether or not the order names the room. Where such orders stand and the count the bill was priced on passes the largest guest count the catering
      account's service level carries, the value of those orders is settled on the event bill, since only the venue could seat the
      event. Where such orders stand and the count the bill was priced on does not pass that largest guest count, the food stays on
      the catering account and only the service charge printed against the package on those orders is settled on the event bill,
      the venue having served it. Where no such order stands for the event's own day, nothing on that account is settled here.
      The attrition allowance printed against the package absorbs a shortfall against the count the bill was priced on before the
      guarantee shortfall percentage is applied, and the covers it absorbs come off what is settled at the per-guest value the
      guarantee priced to. Where the guests served fell short of the count the bill was priced on by more than the covers the
      attrition allowance absorbs, the covers absorbed come off in full at that per-guest value and the covers beyond them come off
      at so much of that per-guest value as the guarantee shortfall percentage printed against the package leaves. Where the guests
      served fell short of the count the bill was priced on by no more than the covers the attrition allowance absorbs, every cover
      short comes off at that per-guest value. Where the guests served match the count the bill was priced on or pass it, nothing
      comes off on that account.
      What the client settles is the amount billed, less the deposit money set against it, less the goodwill adjustment, less the
      lines held over, plus what is settled here from the catering account, less the attrition covers, rounded to two decimal
      places at the end only.
    prerequisite:
      - problem: banquet_ext_delivered_event_bill
        kind: value_input
        gate: bill_amount
        form: state
        policy_source: >-
          The amount an event bill is settled with is fixed only after the event ledger carries the final bill for that booking, with the amount billed and the bill reference the payment settles.
        condition: >-
          A banquet_ledger row of event family banquet_event_invoiced stands for the booking, carrying amount_usd and an invoice_reference.
        resolved_by: raise_event_final_bill_fa928380
        effect: >-
          Once that invoice entry stands, bill_amount takes the amount billed instead of an earlier booking's figure, and the bill reference the payment settles becomes readable.
    cross_category:
      - category: catering
        as: history
        reads: [catering_orders.amount_usd, catering_orders.service_date, max_headcount]
        note: the catering-account tier of the settlement reads the client's orders standing for the event's own day and the largest guest count the account's service level carries.
    compute:
      - bill_amount: "MAX('banquet_ledger','amount_usd', event_type='banquet_event_invoiced')"
      - deposits_received: "SUM('banquet_ledger','amount_usd', date_field='posted_date', event_type='banquet_deposit_received')"
      - deposits_applied: "SUM('banquet_ledger','amount_usd', date_field='posted_date', event_type='banquet_deposit_applied')"
      - deposits_returned: "SUM('banquet_ledger','amount_usd', date_field='posted_date', event_type='banquet_deposit_refunded')"
      - deposit_pool_usd: "MX(deposits_received - deposits_applied - deposits_returned, 0)"
      - deposit_offset_usd: "bill_amount if (deposit_pool_usd > 0 and deposit_pool_usd >= bill_amount) else (deposit_pool_usd if (deposit_pool_usd > 0 and deposit_pool_usd < bill_amount) else 0)"
      - approved_claims: "COUNT('banquet_event_intake', request_type='credit_claim', request_status='approved')"
      - contracted_event_value: "MAX('banquet_ledger','amount_usd', event_type='banquet_guarantee_confirmed')"
      - goodwill_usd: "contracted_event_value * P('final_bill_adjustment_cap_pct_of_event') / 100 if approved_claims >= 2 else (contracted_event_value * K('single_claim_adjustment_pct') / 100 if approved_claims == 1 else 0)"
      - bill_day: "LATEST('banquet_ledger','posted_date', date_field='posted_date', event_type='banquet_event_invoiced')"
      - delivered_day: "LATEST('banquet_ledger','event_date', date_field='posted_date', event_type='banquet_event_delivered')"
      - booked_event_day: "LATEST('banquet_ledger','event_date', date_field='posted_date', event_type='banquet_event_booked')"
      - delivered_entries: "COUNT('banquet_ledger', event_type='banquet_event_delivered')"
      - reference_day: "delivered_day if delivered_entries > 0 else booked_event_day"
      - bill_lateness_days: "DAYS(reference_day, bill_day)"
      - dispute_anchor_day: "delivered_day if (bill_lateness_days > P('final_invoice_days_after_event') and delivered_entries > 0) else (booked_event_day if (bill_lateness_days > P('final_invoice_days_after_event') and delivered_entries <= 0) else bill_day)"
      - claims_in_review: "COUNT('banquet_event_intake', request_type='credit_claim', request_status='in_review')"
      - dispute_days_run: "DAYS(dispute_anchor_day, NOW)"
      - held_over_usd: "(P('av_package_usd') + P('dance_floor_fee_usd')) if (claims_in_review >= 1 and dispute_days_run <= P('billing_dispute_window_days')) else (P('av_package_usd') if (claims_in_review >= 1 and dispute_days_run > P('billing_dispute_window_days')) else 0)"
      - billed_count: "MAX('banquet_ledger','guaranteed_headcount', event_type='banquet_event_delivered')"
      - served_count: "MAX('banquet_ledger','actual_headcount', event_type='banquet_event_delivered')"
      - event_day: "LATEST('banquet_ledger','event_date', date_field='posted_date', event_type='banquet_event_delivered')"
      - same_day_catering_usd: "XSUM('catering','catering_orders','amount_usd', date_field='service_date', event_type='catering_order_placed', service_date=event_day)"
      - catering_ceiling: "CPARAM('catering','max_headcount')"
      - event_food_usd: "same_day_catering_usd if (same_day_catering_usd > 0 and billed_count > catering_ceiling) else (same_day_catering_usd * P('service_charge_pct') / 100 if (same_day_catering_usd > 0 and billed_count <= catering_ceiling) else 0)"
      - cover_value_usd: "contracted_event_value / MX(billed_count, 1)"
      - attrition_covers: "int(billed_count * P('attrition_allowance_pct') / 100)"
      - attrition_relief_usd: "(attrition_covers * cover_value_usd + (billed_count - served_count - attrition_covers) * cover_value_usd * (100 - P('guarantee_shortfall_charge_pct')) / 100) if (served_count > 0 and (billed_count - served_count) > attrition_covers) else (((billed_count - served_count) * cover_value_usd) if (served_count > 0 and billed_count > served_count) else 0)"
      - result: "RND(bill_amount - deposit_offset_usd - goodwill_usd - held_over_usd + event_food_usd - attrition_relief_usd, 2)"
    compute_basis:
      bill_amount: "The amount an event bill is settled with is the amount the bill was raised for, as the invoice entry standing in the event ledger records it, rounded to two decimal places at the end only, the parts themselves being left unrounded."
      deposits_received: "The deposit money the settlement draws on is what the agreement's event ledger shows taken in deposits, less anything already set against a bill and less anything already returned."
      deposits_applied: "The deposit money the settlement draws on is what the agreement's event ledger shows taken in deposits, less anything already set against a bill and less anything already returned."
      deposits_returned: "The deposit money the settlement draws on is what the agreement's event ledger shows taken in deposits, less anything already set against a bill and less anything already returned."
      deposit_pool_usd: "The deposit money the settlement draws on is what the agreement's event ledger shows taken in deposits, less anything already set against a bill and less anything already returned."
      deposit_offset_usd: "Deposit money standing against the booking is set against the amount billed at settlement rather than before the bill is issued, and where that money reaches the amount billed the whole of the amount billed is met from it, the surplus being returned rather than carried. Where deposit money stands against the booking and falls short of the amount billed, all of that money comes off what is settled. Where no deposit money stands against the booking, nothing comes off on that account."
      approved_claims: "A goodwill adjustment is allowed on the final bill up to the ceiling printed against the package, worked on the contracted event value the guarantee priced to, and an adjustment beyond that ceiling is not made at the desk."
      contracted_event_value: "worked on the contracted event value the guarantee priced to"
      goodwill_usd: "Where two or more credit claims on the booking stand approved in the event request log, the adjustment is the ceiling percentage printed against the package. Where exactly one credit claim on the booking stands approved in the event request log, the adjustment is the single-claim percentage. Where no credit claim on the booking stands approved, no goodwill adjustment is made."
      bill_day: "The day the client's window to dispute the bill runs from is settled by whether the desk raised the bill in time."
      delivered_day: "Where the bill was raised later after the event than the days the package prints for raising it, and a delivered entry stands for the booking, the window runs from the day the event was delivered, the client having had the substance of the bill at the event itself."
      booked_event_day: "The days the desk took to raise the bill are counted from the day the event was delivered, or, where no delivered entry stands for the booking, from the day the booking's event was to have been held."
      reference_day: "The days the desk took to raise the bill are counted from the day the event was delivered, or, where no delivered entry stands for the booking, from the day the booking's event was to have been held."
      bill_lateness_days: "The day the client's window to dispute the bill runs from is settled by whether the desk raised the bill in time."
      delivered_entries: "Where the bill was raised later than those days and no delivered entry stands for the booking, the window runs from the day the booking's event was to have been held."
      dispute_anchor_day: "Where the bill was raised later after the event than the days the package prints for raising it, and a delivered entry stands for the booking, the window runs from the day the event was delivered, the client having had the substance of the bill at the event itself. Where the bill was raised later than those days and no delivered entry stands for the booking, the window runs from the day the booking's event was to have been held. Where the bill was raised within those days, the window runs from the day the bill was raised."
      claims_in_review: "Where the client disputes a line on the final bill, the undisputed balance falls due on the ordinary terms and only the disputed line is held over."
      dispute_days_run: "The day the client's window to dispute the bill runs from is settled by whether the desk raised the bill in time."
      held_over_usd: "Where a credit claim on the booking stands in review in the event request log and that window is still open, the audio-visual package and the dance floor charge printed against the package are both held over. Where a credit claim on the booking stands in review in the event request log and that window has closed, the audio-visual package printed against the package alone is held over. Where no credit claim on the booking stands in review, nothing is held over."
      billed_count: "The attrition allowance printed against the package absorbs a shortfall against the count the bill was priced on before the guarantee shortfall percentage is applied, and the covers it absorbs come off what is settled at the per-guest value the guarantee priced to."
      served_count: "The attrition allowance printed against the package absorbs a shortfall against the count the bill was priced on before the guarantee shortfall percentage is applied, and the covers it absorbs come off what is settled at the per-guest value the guarantee priced to."
      event_day: "Food ordered on the client's corporate catering account for the room on the event's own day belongs to the event rather than to that account."
      same_day_catering_usd: "Food ordered on the client's corporate catering account for the room on the event's own day belongs to the event rather than to that account."
      catering_ceiling: "Where such orders stand and the count the bill was priced on passes the largest guest count the catering account's service level carries, the value of those orders is settled on the event bill, since only the venue could seat the event."
      event_food_usd: "Where such orders stand and the count the bill was priced on passes the largest guest count the catering account's service level carries, the value of those orders is settled on the event bill, since only the venue could seat the event. Where such orders stand and the count the bill was priced on does not pass that largest guest count, the food stays on the catering account and only the service charge printed against the package on those orders is settled on the event bill, the venue having served it. Where no such order stands for the event's own day, nothing on that account is settled here."
      cover_value_usd: "the covers it absorbs come off what is settled at the per-guest value the guarantee priced to"
      attrition_covers: "The attrition allowance printed against the package absorbs a shortfall against the count the bill was priced on before the guarantee shortfall percentage is applied."
      attrition_relief_usd: "Where the guests served fell short of the count the bill was priced on by more than the covers the attrition allowance absorbs, the covers absorbed come off in full at that per-guest value and the covers beyond them come off at so much of that per-guest value as the guarantee shortfall percentage printed against the package leaves. Where the guests served fell short of the count the bill was priced on by no more than the covers the attrition allowance absorbs, every cover short comes off at that per-guest value. Where the guests served match the count the bill was priced on or pass it, nothing comes off on that account."
      result: "What the client settles is the amount billed, less the deposit money set against it, less the goodwill adjustment, less the lines held over, plus what is settled here from the catering account, less the attrition covers, rounded to two decimal places at the end only."
    factors:
      - id: deposit_money_set_against_the_bill
        effect: parameter
        decides: deposit_offset_usd
        bindings: [deposits_received, deposits_applied, deposits_returned, deposit_pool_usd, deposit_offset_usd]
        ladder:
          - when: "deposit money stands against the booking and reaches the amount billed"
            value: "the amount billed, the surplus being returned rather than carried"
          - when: "deposit money stands against the booking and falls short of the amount billed"
            value: "all of that deposit money"
          - when: "otherwise"
            value: "0"
        baseline:
          deposit_offset_usd: "0"
        evidence: [history]
        cross_difficulty: null
      - id: goodwill_adjustment_allowed
        effect: parameter
        decides: goodwill_usd
        bindings: [approved_claims, contracted_event_value, goodwill_usd]
        ladder:
          - when: "two or more credit claims on the booking stand approved in the event request log"
            value: "P('final_bill_adjustment_cap_pct_of_event')"
          - when: "exactly one credit claim on the booking stands approved in the event request log"
            value: "K('single_claim_adjustment_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          goodwill_usd: "0"
        evidence: [history]
        cross_difficulty: null
      - id: dispute_window_anchor
        effect: method
        decides: dispute_anchor_day
        bindings: [bill_day, delivered_day, booked_event_day, delivered_entries, reference_day, bill_lateness_days, dispute_anchor_day]
        ladder:
          - when: "the bill was raised later after the event than the days the package prints for raising it, and a delivered entry stands for the booking"
            method: "the window runs from the day the event was delivered"
          - when: "the bill was raised later than those days and no delivered entry stands for the booking"
            method: "the window runs from the day the booking's event was to have been held"
          - when: "otherwise"
            method: "the window runs from the day the bill was raised"
        baseline:
          dispute_anchor_day: "bill_day"
        evidence: [history, date]
        cross_difficulty: null
      - id: disputed_lines_held_over
        effect: parameter
        decides: held_over_usd
        bindings: [claims_in_review, dispute_days_run, held_over_usd]
        ladder:
          - when: "a credit claim on the booking stands in review in the event request log and the dispute window is still open"
            value: "P('av_package_usd') + P('dance_floor_fee_usd')"
          - when: "a credit claim on the booking stands in review in the event request log and the dispute window has closed"
            value: "P('av_package_usd')"
          - when: "otherwise"
            value: "0"
        baseline:
          held_over_usd: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: catering_account_food_settled_here
        effect: parameter
        decides: event_food_usd
        bindings: [event_day, same_day_catering_usd, catering_ceiling, event_food_usd]
        ladder:
          - when: "orders stand on the client's corporate catering account for the event's own day and the count the bill was priced on passes the largest guest count that account's service level carries"
            value: "the value of those same-day orders"
          - when: "orders stand for the event's own day and the count the bill was priced on does not pass that largest guest count"
            value: "the service charge printed against the package worked on those same-day orders"
          - when: "otherwise"
            value: "0"
        baseline:
          event_food_usd: "0"
        evidence: [cross_category, history]
        cross_difficulty: catering
      - id: attrition_covers_absorbed
        effect: method
        decides: attrition_relief_usd
        bindings: [billed_count, served_count, cover_value_usd, attrition_covers, attrition_relief_usd]
        ladder:
          - when: "the guests served fell short of the count the bill was priced on by more than the covers the attrition allowance absorbs"
            method: "the covers absorbed come off in full at the per-guest value and the covers beyond them come off at so much of it as the guarantee shortfall percentage leaves"
          - when: "the guests served fell short of the count the bill was priced on by no more than the covers the attrition allowance absorbs"
            method: "every cover short comes off at the per-guest value"
          - when: "otherwise"
            method: "nothing comes off on that account"
        baseline:
          attrition_relief_usd: "0"
        evidence: [history, tier_param]
        cross_difficulty: null
    baseline:
      rule: >-
        The amount an event bill is settled with is the amount the bill was raised for, as the invoice entry standing in the
        event ledger records it, rounded to two decimal places at the end only, the parts themselves being left unrounded.
      params: []
    inputs:
      history:
        - {table: banquet_ledger, aggregate: max, field: amount_usd, filters: {event_type: banquet_event_invoiced}}
        - {table: banquet_ledger, aggregate: sum, field: amount_usd, filters: {event_type: banquet_deposit_received}}
        - {table: banquet_event_intake, aggregate: count, field: banquet_event_request_id, filters: {request_type: credit_claim, request_status: approved}}
        - {category: catering, table: catering_orders, aggregate: sum, field: amount_usd, filters: {event_type: catering_order_placed}}
      cross_category: [catering]
