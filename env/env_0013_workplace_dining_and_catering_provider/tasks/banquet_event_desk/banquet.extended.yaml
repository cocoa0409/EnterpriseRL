category: banquet
display_name: Private Event & Banquet Services

binding:
  holding_table: banquet_agreements
  event_tables: [banquet_ledger]
  intake_tables: [banquet_event_intake]
  status_field: status
  variant_field: variant_name
  quantity_fields: {deposit_balance_usd: deposit_held, receivable_balance_usd: event_receivable}

lifecycle:
  states: [proposed, active, on_hold, closed]
  transitions:
    - {from: proposed, to: active, by: agent, means: the agreement is countersigned and the venue opens for booking}
    - {from: active, to: on_hold, by: agent, means: booking is stopped while arrears or an insurance lapse are resolved}
    - {from: on_hold, to: active, by: agent, means: the matter is resolved and booking reopens}
    - {from: active, to: closed, by: user, means: the client ends the agreement and no further events are booked}
    - {from: on_hold, to: closed, by: agent, means: the agreement is closed out from hold once every booked event is settled}
    - {from: proposed, to: closed, by: agent, means: the proposal is withdrawn or declined before countersignature}

accounts:
  - key: deposit_held
    unit: USD
    meaning: client money taken in advance against booked events and held until it is applied to a final bill or returned
  - key: event_receivable
    unit: USD
    meaning: amounts invoiced for events under this agreement and not yet settled

parameter_schema:
  min_food_beverage_spend_usd: smallest food and beverage spend the package is written against, in USD per event
  room_rental_usd: standard room rental charged for the package, in USD per event
  max_guests: largest guest count the package handles, as a whole number
  min_guests: smallest guest count the package is written for, as a whole number
  booking_lead_days: calendar days of notice a booking needs before the event date
  deposit_pct_of_estimate: first deposit taken on confirmation, as a percentage of the estimated event value
  deposit_due_days_from_booking: calendar days after the booking is confirmed by which the first deposit is due
  second_deposit_pct: second deposit taken before the event, as a percentage of the estimated event value
  second_deposit_due_days_before_event: calendar days before the event by which the second deposit is due
  deposit_refundable_until_days_before: calendar days before the event up to which deposits are still returnable
  guarantee_deadline_hours: hours before the event by which the final guaranteed guest count must be given
  guarantee_shortfall_charge_pct: share of the guaranteed count still charged when fewer guests attend, as a percentage
  overset_pct_above_guarantee: places set and prepared above the guaranteed count, as a percentage of that count
  service_charge_pct: service charge added to food and beverage, as a percentage
  room_rental_waiver_spend_usd: food and beverage spend at or above which room rental is waived, in USD
  bar_minimum_usd: smallest beverage spend required where a bar is opened, in USD
  alcohol_service_permitted: whether licensed beverage service may be ordered on this package, true or false
  corkage_fee_per_bottle_usd: charge for each bottle the client supplies themselves, in USD
  staffing_ratio_guests_per_server: guests per service staff member the package is staffed to, as a whole number
  staff_rate_per_hour_usd: billed rate for each service staff hour, in USD
  included_service_hours: on-site service hours included in the package, to one decimal place
  overtime_rate_per_hour_usd: billed rate for each service hour beyond the included hours, in USD
  setup_lead_hours: hours before the event the room is held for set-up, to one decimal place
  teardown_window_hours: hours after the event allowed for clearing the room, to one decimal place
  av_package_usd: standard audio-visual package for the event, in USD
  dance_floor_fee_usd: charge for laying a dance floor, in USD
  menu_tasting_guests_included: guests included in a complimentary menu tasting, as a whole number
  tasting_lead_days: calendar days before the event by which a tasting must be held
  cancellation_notice_days_full_refund: calendar days before the event at which a cancellation carries no charge
  cancellation_fee_pct_90_to_30_days: charge for a cancellation between ninety and thirty days before the event, as a percentage of the contracted event value
  cancellation_fee_pct_30_to_7_days: charge for a cancellation between thirty and seven days before the event, as a percentage of the contracted event value
  cancellation_fee_pct_within_7_days: charge for a cancellation inside seven days of the event, as a percentage of the contracted event value
  date_change_fee_usd: administration charge for moving a confirmed event to another date, in USD
  date_change_allowed_times: number of date moves a booking may take before it is treated as a cancellation, as a whole number
  venue_change_fee_usd: administration charge for moving a confirmed event to another venue, in USD
  payment_terms_days: calendar days from the final invoice within which payment is due
  late_fee_monthly_pct: monthly late charge on an overdue event invoice, as a percentage of the overdue amount
  late_fee_grace_days: calendar days past the due date before a late charge may be raised
  late_fee_cap_usd: ceiling on the late charge raised against one event invoice, in USD
  final_invoice_days_after_event: calendar days after the event by which the final invoice is raised
  credit_hold_threshold_days_past_due: days past due at which booking stops on the agreement
  final_bill_adjustment_cap_pct_of_event: ceiling on any goodwill adjustment applied to a final bill, as a percentage of event value
  billing_dispute_window_days: calendar days after the final invoice within which the client may dispute it
  insurance_certificate_required: whether a certificate of event insurance is required before the event, true or false
  security_staff_required_above_guests: guest count above which licensed security staff are required, as a whole number
  security_rate_per_hour_usd: billed rate for each security staff hour, in USD
  agreement_term_months: standard initial term of the event services agreement, in whole months
  agreement_notice_days: calendar days of notice required to end the agreement
  min_annual_events: events a year the package is written against, as a whole number
  peak_date_surcharge_pct: surcharge for events on declared peak dates, as a percentage
  blackout_dates_per_year: published dates in the year on which the package takes no bookings, as a whole number
  max_concurrent_bookings: confirmed unserved events the agreement may carry at once, as a whole number
  attrition_allowance_pct: shortfall against a contracted room or cover block absorbed without charge, as a percentage
  preferred_vendor_fee_pct: fee charged when the client brings an outside caterer or florist into the venue, as a percentage of that vendor's invoice

