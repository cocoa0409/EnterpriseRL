            value: "P('bar_minimum_usd')"
          - when: "the room the booking was taken for stood set for seated rounds and the guests served reach the smallest guest count printed against the package"
            value: "K('seated_bar_share') * P('bar_minimum_usd')"
          - when: "otherwise"
