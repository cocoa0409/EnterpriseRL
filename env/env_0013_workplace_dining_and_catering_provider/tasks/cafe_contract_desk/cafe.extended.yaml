      (RND(mgmt_fees_3m / MX(1, mgmt_invoices_3m), 2) if (mgmt_invoices_3m >= 3 and latest_mgmt_fee_usd <= P('management_fee_monthly_usd'))
      else P('management_fee_monthly_usd'))
  - credit_per_period_usd: RND(fee_base_usd * credit_rate_pct / 100, 2)
  - period_ceiling_usd: RND(P('management_fee_monthly_usd') * P('service_credit_cap_pct_of_monthly_fee') / 100,
      2)
  - result: MN(RND(credit_per_period_usd * credited_periods, 2), period_ceiling_usd)
  compute_basis:
