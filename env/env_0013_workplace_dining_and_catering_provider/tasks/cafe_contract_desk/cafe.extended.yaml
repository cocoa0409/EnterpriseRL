- id: cafe_ext_late_charge_assessment
  base_policy_refs:
  - cafe_invoice_payment_terms
  - cafe_participation_guarantee
  overwrite:
  - base_policy: cafe_invoice_payment_terms
    superseded_clause: >-
      A late charge may only be raised once the grace days printed against the service model have passed beyond
      the due date, and it is the monthly late percentage applied to the amount still outstanding, held to the late
      charge ceiling printed against the service model.
    replaced_by: >-
      The late charge is the amount still outstanding taken at the late charge rate, rounded to the nearest cent,
      charged for each month charged, and held to the late charge ceiling printed against the service model.
  - base_policy: cafe_invoice_payment_terms
    superseded_clause: >-
      A payment smaller than the invoiced amount settles that invoice in part, leaves the remainder outstanding
      on the same invoice, and never spills over onto another invoice.
    replaced_by: >-
      Where a service credit stands allowed on the contract in the twelve months up to the day the charge is raised
      and the payments received over those twelve months fall short of the management fees invoiced over them, the
      amount still outstanding is the management fees invoiced over those twelve months less both the payments received
      and the service credits allowed over them, rounded to the nearest cent; where no service credit stands allowed
      over those twelve months and the payments received fall short of the management fees invoiced over them, the
      amount still outstanding is the management fees invoiced over those twelve months less the payments received
      over them, rounded to the nearest cent; and where the payments received over those twelve months reach the
      management fees invoiced over them, nothing stands outstanding.
  trigger: state_due
  subject:
  - cafe_penalty_fee_posted
  computes: late_charge_usd
  target_tool: post_late_charge_719c9a63
  params:
    disputed_account_grace_days: 21
    wind_down_grace_days: 14
    repeat_arrears_rate_pct: 1.6
    first_arrears_rate_pct: 1.3
    heavy_arrears_threshold_usd: 30000.0
  rule: >-
    A cafe invoice that has stood unpaid beyond its grace days carries a late charge on the contract. The amount
    still outstanding is the management fees invoiced on the contract over the twelve months up to the day the charge
    is raised less the payments received over those same twelve months, and it is never less than nil. The grace
    days allowed are the late charge grace days printed against the service model, the days overdue run from the
    day after the management fee invoice most recently posted up to and including the day the charge is raised,
    and the late charge rate is the monthly late charge percentage printed against the service model. The months
    charged are the days overdue less the grace days allowed, divided by thirty and rounded down to a whole month,
    and never less than nil. The late charge is the amount still outstanding taken at the late charge rate, rounded
    to the nearest cent, charged for each month charged, and held to the late charge ceiling printed against the
    service model. The late charge is recorded against the billing period in which it is raised. Where a service
    credit stands allowed on the contract in the twelve months up to the day the charge is raised and the payments
    received over those twelve months fall short of the management fees invoiced over them, the amount still outstanding
    is the management fees invoiced over those twelve months less both the payments received and the service credits
    allowed over them, rounded to the nearest cent; where no service credit stands allowed over those twelve months
    and the payments received fall short of the management fees invoiced over them, the amount still outstanding
    is the management fees invoiced over those twelve months less the payments received over them, rounded to the
    nearest cent; and where the payments received over those twelve months reach the management fees invoiced over
    them, nothing stands outstanding. Where a payment stands received on the contract in the three months up to
    the day the charge is raised and no service credit stands allowed over those three months, the days overdue
    run from the day after the payment most recently received up to and including the day the charge is raised;
    where a payment stands received over those three months and a service credit stands allowed over them, the days
    overdue run from the day after the service credit most recently allowed up to and including the day the charge
    is raised; and where no payment stands received over those three months, the days overdue run from the day after
    the management fee invoice most recently posted up to and including the day the charge is raised. Where two
    or more service credits stand allowed on the contract in the twelve months up to the day the charge is raised
    and a day of written notice of termination stands on the contract, the grace days allowed are the disputed account
    grace days; where fewer than two service credits stand allowed over those twelve months and a day of written
    notice of termination stands on the contract, the grace days allowed are the wind-down grace days; and where
    no day of written notice of termination stands on the contract, the grace days allowed are the late charge grace
    days printed against the service model. Where two or more late charges stand raised on the contract in the twenty-four
    months up to the day this charge is raised and the amount still outstanding reaches the heavy arrears threshold,
    the late charge rate is the repeat arrears rate; where fewer than two late charges stand raised over those twenty-four
    months and the amount still outstanding reaches the heavy arrears threshold, the late charge rate is the first
    arrears rate; and where the amount still outstanding falls below the heavy arrears threshold, the late charge
    rate is the monthly late charge percentage printed against the service model.
  prerequisite: []
  cross_category: []
  compute:
  - mgmt_fees_12m: >-
      SUM('cafe_ledger','amount_usd', within_months=12, date_field='posted_date', charge_code='management_fee')
  - payments_12m: >-
      SUM('cafe_ledger','amount_usd', within_months=12, date_field='posted_date', charge_code='invoice_payment')
  - credits_12m: >-
      SUM('cafe_ledger','amount_usd', within_months=12, date_field='posted_date', charge_code='service_credit')
  - outstanding_amount_usd: >-
      MX(0.0, RND(mgmt_fees_12m - payments_12m - credits_12m, 2)) if (credits_12m > 0 and payments_12m < mgmt_fees_12m)
      else (MX(0.0, RND(mgmt_fees_12m - payments_12m, 2)) if (credits_12m <= 0 and payments_12m < mgmt_fees_12m)
      else 0.0)
  - latest_payment_on: >-
      LATEST('cafe_ledger','posted_date', date_field='posted_date', charge_code='invoice_payment')
  - latest_credit_on: >-
      LATEST('cafe_ledger','posted_date', date_field='posted_date', charge_code='service_credit')
  - latest_invoice_on: >-
      LATEST('cafe_ledger','posted_date', date_field='posted_date', charge_code='management_fee')
  - payments_3m: >-
      COUNT('cafe_ledger', within_months=3, date_field='posted_date', charge_code='invoice_payment')
  - credits_3m: >-
      COUNT('cafe_ledger', within_months=3, date_field='posted_date', charge_code='service_credit')
  - days_overdue: >-
      DAYS(latest_payment_on, NOW) if (payments_3m >= 1 and credits_3m < 1) else (DAYS(latest_credit_on, NOW) if
      (payments_3m >= 1 and credits_3m >= 1) else DAYS(latest_invoice_on, NOW))
  - credits_allowed_12m: >-
      COUNT('cafe_ledger', within_months=12, date_field='posted_date', charge_code='service_credit')
  - notice_days_standing: DAYS(F('termination_notice_date'), NOW) if F('termination_notice_date') != '' else -1
  - grace_days_allowed: >-
      K('disputed_account_grace_days') if (credits_allowed_12m >= 2 and notice_days_standing >= 0) else (K('wind_down_grace_days')
      if (credits_allowed_12m < 2 and notice_days_standing >= 0) else P('late_fee_grace_days'))
  - months_charged: MX(0, int((days_overdue - grace_days_allowed) / 30))
  - late_charges_24m: COUNT('cafe_ledger', within_months=24, date_field='posted_date', charge_code='late_fee')
  - late_charge_rate_pct: >-
      K('repeat_arrears_rate_pct') if (late_charges_24m >= 2 and outstanding_amount_usd >= K('heavy_arrears_threshold_usd'))
      else (K('first_arrears_rate_pct') if (late_charges_24m < 2 and outstanding_amount_usd >= K('heavy_arrears_threshold_usd'))
      else P('late_fee_monthly_pct'))
  - result: >-
      MN(RND(outstanding_amount_usd * late_charge_rate_pct / 100, 2) * months_charged, P('late_fee_cap_usd'))
  compute_basis:
    mgmt_fees_12m: >-
      Where a service credit stands allowed on the contract in the twelve months up to the day the charge is raised
      and the payments received over those twelve months fall short of the management fees invoiced over them, the
      amount still outstanding is the management fees invoiced over those twelve months less both the payments received
      and the service credits allowed over them, rounded to the nearest cent; where no service credit stands allowed
      over those twelve months and the payments received fall short of the management fees invoiced over them, the
      amount still outstanding is the management fees invoiced over those twelve months less the payments received
      over them, rounded to the nearest cent; and where the payments received over those twelve months reach the
      management fees invoiced over them, nothing stands outstanding.
    payments_12m: >-
      Where a service credit stands allowed on the contract in the twelve months up to the day the charge is raised
      and the payments received over those twelve months fall short of the management fees invoiced over them, the
      amount still outstanding is the management fees invoiced over those twelve months less both the payments received
      and the service credits allowed over them, rounded to the nearest cent; where no service credit stands allowed
      over those twelve months and the payments received fall short of the management fees invoiced over them, the
      amount still outstanding is the management fees invoiced over those twelve months less the payments received
      over them, rounded to the nearest cent; and where the payments received over those twelve months reach the
      management fees invoiced over them, nothing stands outstanding.
    credits_12m: >-
      Where a service credit stands allowed on the contract in the twelve months up to the day the charge is raised
      and the payments received over those twelve months fall short of the management fees invoiced over them, the
      amount still outstanding is the management fees invoiced over those twelve months less both the payments received
      and the service credits allowed over them, rounded to the nearest cent; where no service credit stands allowed
      over those twelve months and the payments received fall short of the management fees invoiced over them, the
      amount still outstanding is the management fees invoiced over those twelve months less the payments received
      over them, rounded to the nearest cent; and where the payments received over those twelve months reach the
      management fees invoiced over them, nothing stands outstanding.
    outstanding_amount_usd: >-
      Where a service credit stands allowed on the contract in the twelve months up to the day the charge is raised
      and the payments received over those twelve months fall short of the management fees invoiced over them, the
      amount still outstanding is the management fees invoiced over those twelve months less both the payments received
      and the service credits allowed over them, rounded to the nearest cent; where no service credit stands allowed
      over those twelve months and the payments received fall short of the management fees invoiced over them, the
      amount still outstanding is the management fees invoiced over those twelve months less the payments received
      over them, rounded to the nearest cent; and where the payments received over those twelve months reach the
      management fees invoiced over them, nothing stands outstanding.
    latest_payment_on: >-
      Where a payment stands received on the contract in the three months up to the day the charge is raised and
      no service credit stands allowed over those three months, the days overdue run from the day after the payment
      most recently received up to and including the day the charge is raised; where a payment stands received over
      those three months and a service credit stands allowed over them, the days overdue run from the day after
      the service credit most recently allowed up to and including the day the charge is raised; and where no payment
      stands received over those three months, the days overdue run from the day after the management fee invoice
      most recently posted up to and including the day the charge is raised.
    latest_credit_on: >-
      Where a payment stands received on the contract in the three months up to the day the charge is raised and
      no service credit stands allowed over those three months, the days overdue run from the day after the payment
      most recently received up to and including the day the charge is raised; where a payment stands received over
      those three months and a service credit stands allowed over them, the days overdue run from the day after
      the service credit most recently allowed up to and including the day the charge is raised; and where no payment
      stands received over those three months, the days overdue run from the day after the management fee invoice
      most recently posted up to and including the day the charge is raised.
    latest_invoice_on: >-
      Where a payment stands received on the contract in the three months up to the day the charge is raised and
      no service credit stands allowed over those three months, the days overdue run from the day after the payment
      most recently received up to and including the day the charge is raised; where a payment stands received over
      those three months and a service credit stands allowed over them, the days overdue run from the day after
      the service credit most recently allowed up to and including the day the charge is raised; and where no payment
      stands received over those three months, the days overdue run from the day after the management fee invoice
      most recently posted up to and including the day the charge is raised.
    payments_3m: >-
      Where a payment stands received on the contract in the three months up to the day the charge is raised and
      no service credit stands allowed over those three months, the days overdue run from the day after the payment
      most recently received up to and including the day the charge is raised; where a payment stands received over
      those three months and a service credit stands allowed over them, the days overdue run from the day after
      the service credit most recently allowed up to and including the day the charge is raised; and where no payment
      stands received over those three months, the days overdue run from the day after the management fee invoice
      most recently posted up to and including the day the charge is raised.
    credits_3m: >-
      Where a payment stands received on the contract in the three months up to the day the charge is raised and
      no service credit stands allowed over those three months, the days overdue run from the day after the payment
      most recently received up to and including the day the charge is raised; where a payment stands received over
      those three months and a service credit stands allowed over them, the days overdue run from the day after
      the service credit most recently allowed up to and including the day the charge is raised; and where no payment
      stands received over those three months, the days overdue run from the day after the management fee invoice
      most recently posted up to and including the day the charge is raised.
    days_overdue: >-
      Where a payment stands received on the contract in the three months up to the day the charge is raised and
      no service credit stands allowed over those three months, the days overdue run from the day after the payment
      most recently received up to and including the day the charge is raised; where a payment stands received over
      those three months and a service credit stands allowed over them, the days overdue run from the day after
      the service credit most recently allowed up to and including the day the charge is raised; and where no payment
      stands received over those three months, the days overdue run from the day after the management fee invoice
      most recently posted up to and including the day the charge is raised.
    credits_allowed_12m: >-
      Where two or more service credits stand allowed on the contract in the twelve months up to the day the charge
      is raised and a day of written notice of termination stands on the contract, the grace days allowed are the
      disputed account grace days; where fewer than two service credits stand allowed over those twelve months and
      a day of written notice of termination stands on the contract, the grace days allowed are the wind-down grace
      days; and where no day of written notice of termination stands on the contract, the grace days allowed are
      the late charge grace days printed against the service model.
    notice_days_standing: >-
      Where two or more service credits stand allowed on the contract in the twelve months up to the day the charge
      is raised and a day of written notice of termination stands on the contract, the grace days allowed are the
      disputed account grace days; where fewer than two service credits stand allowed over those twelve months and
      a day of written notice of termination stands on the contract, the grace days allowed are the wind-down grace
      days; and where no day of written notice of termination stands on the contract, the grace days allowed are
      the late charge grace days printed against the service model.
    grace_days_allowed: >-
      Where two or more service credits stand allowed on the contract in the twelve months up to the day the charge
      is raised and a day of written notice of termination stands on the contract, the grace days allowed are the
      disputed account grace days; where fewer than two service credits stand allowed over those twelve months and
      a day of written notice of termination stands on the contract, the grace days allowed are the wind-down grace
      days; and where no day of written notice of termination stands on the contract, the grace days allowed are
      the late charge grace days printed against the service model.
    months_charged: >-
      The months charged are the days overdue less the grace days allowed, divided by thirty and rounded down to
      a whole month, and never less than nil.
    late_charges_24m: >-
      Where two or more late charges stand raised on the contract in the twenty-four months up to the day this charge
      is raised and the amount still outstanding reaches the heavy arrears threshold, the late charge rate is the
      repeat arrears rate; where fewer than two late charges stand raised over those twenty-four months and the
      amount still outstanding reaches the heavy arrears threshold, the late charge rate is the first arrears rate;
      and where the amount still outstanding falls below the heavy arrears threshold, the late charge rate is the
      monthly late charge percentage printed against the service model.
    late_charge_rate_pct: >-
      Where two or more late charges stand raised on the contract in the twenty-four months up to the day this charge
      is raised and the amount still outstanding reaches the heavy arrears threshold, the late charge rate is the
      repeat arrears rate; where fewer than two late charges stand raised over those twenty-four months and the
      amount still outstanding reaches the heavy arrears threshold, the late charge rate is the first arrears rate;
      and where the amount still outstanding falls below the heavy arrears threshold, the late charge rate is the
      monthly late charge percentage printed against the service model.
    result: >-
      The late charge is the amount still outstanding taken at the late charge rate, rounded to the nearest cent,
      charged for each month charged, and held to the late charge ceiling printed against the service model.
  factors:
  - id: outstanding_amount_basis
    effect: method
    decides: outstanding_amount_usd
    bindings:
    - mgmt_fees_12m
    - payments_12m
    - credits_12m
    - outstanding_amount_usd
    ladder:
    - when: >-
        a service credit stands allowed on the contract in the twelve months up to the day the charge is raised
        and the payments received over those twelve months fall short of the management fees invoiced over them
      method: >-
        the amount still outstanding is the management fees invoiced over those twelve months less both the payments
        received and the service credits allowed over them, rounded to the nearest cent
    - when: >-
        no service credit stands allowed over those twelve months and the payments received over them fall short
        of the management fees invoiced over them
      method: >-
        the amount still outstanding is the management fees invoiced over those twelve months less the payments
        received over them, rounded to the nearest cent
    - when: otherwise
      method: nothing stands outstanding
    baseline:
      outstanding_amount_usd: MX(0.0, RND(mgmt_fees_12m - payments_12m, 2))
    evidence:
    - history
    cross_difficulty: null
  - id: overdue_clock_anchor
    effect: method
    decides: days_overdue
    bindings:
    - latest_payment_on
    - latest_credit_on
    - latest_invoice_on
    - payments_3m
    - credits_3m
    - days_overdue
    ladder:
    - when: >-
        a payment stands received on the contract in the three months up to the day the charge is raised and no
        service credit stands allowed over those three months
      method: >-
        the days overdue run from the day after the payment most recently received up to and including the day the
        charge is raised
    - when: >-
        a payment stands received over those three months and a service credit stands allowed over them
      method: >-
        the days overdue run from the day after the service credit most recently allowed up to and including the
        day the charge is raised
    - when: otherwise
      method: >-
        the days overdue run from the day after the management fee invoice most recently posted up to and including
        the day the charge is raised
    baseline:
      days_overdue: DAYS(latest_invoice_on, NOW)
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: grace_days_band
    effect: parameter
    decides: grace_days_allowed
    bindings:
    - credits_allowed_12m
    - notice_days_standing
    - grace_days_allowed
    ladder:
    - when: >-
        two or more service credits stand allowed on the contract in the twelve months up to the day the charge
        is raised and a day of written notice of termination stands on the contract
      value: the disputed account grace days
    - when: >-
        fewer than two service credits stand allowed over those twelve months and a day of written notice of termination
        stands on the contract
      value: the wind-down grace days
    - when: otherwise
      value: the late charge grace days printed against the service model
    baseline:
      grace_days_allowed: P('late_fee_grace_days')
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: arrears_rate_band
    effect: parameter
    decides: late_charge_rate_pct
    bindings:
    - late_charges_24m
    - late_charge_rate_pct
    ladder:
    - when: >-
        two or more late charges stand raised on the contract in the twenty-four months up to the day this charge
        is raised and the amount still outstanding reaches the heavy arrears threshold
      value: the repeat arrears rate
    - when: >-
        fewer than two late charges stand raised over those twenty-four months and the amount still outstanding
        reaches the heavy arrears threshold
      value: the first arrears rate
    - when: otherwise
      value: the monthly late charge percentage printed against the service model
    baseline:
      late_charge_rate_pct: P('late_fee_monthly_pct')
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: >-
      A cafe invoice that has stood unpaid beyond its grace days carries a late charge on the contract. The amount
      still outstanding is the management fees invoiced on the contract over the twelve months up to the day the
      charge is raised less the payments received over those same twelve months, and it is never less than nil.
      The grace days allowed are the late charge grace days printed against the service model, the days overdue
      run from the day after the management fee invoice most recently posted up to and including the day the charge
      is raised, and the late charge rate is the monthly late charge percentage printed against the service model.
      The months charged are the days overdue less the grace days allowed, divided by thirty and rounded down to
      a whole month, and never less than nil. The late charge is the amount still outstanding taken at the late
      charge rate, rounded to the nearest cent, charged for each month charged, and held to the late charge ceiling
      printed against the service model. The late charge is recorded against the billing period in which it is raised.
    params:
    - late_fee_grace_days
    - late_fee_monthly_pct
    - late_fee_cap_usd
  inputs:
    history:
    - table: cafe_ledger
      aggregate: sum
      field: amount_usd
      within_months: 12
      filters:
        charge_code: management_fee
    - table: cafe_ledger
      aggregate: sum
      field: amount_usd
      within_months: 12
      filters:
        charge_code: invoice_payment
    - table: cafe_ledger
      aggregate: sum
      field: amount_usd
      within_months: 12
      filters:
        charge_code: service_credit
    - table: cafe_ledger
      aggregate: count
      field: cafe_ledger_id
      within_months: 24
      filters:
        charge_code: late_fee
    - table: cafe_ledger
      aggregate: latest
      field: posted_date
      within_months: null
      filters:
        charge_code: invoice_payment
    cross_category: []
- id: cafe_ext_early_exit_charge
  base_policy_refs:
  - cafe_invoice_payment_terms
  - cafe_participation_guarantee
  - cafe_termination_terms
  overwrite:
  - base_policy: cafe_termination_terms
    superseded_clause: >-
      Where the closure day falls before the end of the contracted term, the early exit charge is the number of
      monthly management fees printed against the service model, calculated on the fee in force on the notice day.
    replaced_by: >-
      The exit charge before allowances is the months charged multiplied by the exit fee base, rounded to the nearest
      cent.
  trigger: state_due
  subject:
  - cafe_penalty_fee_posted
  computes: exit_charge_usd
  target_tool: post_early_exit_charge_dadd74c6
  params:
    long_remaining_term_exit_months: 5
    settled_site_exit_months: 3
    major_continuing_outlet_pct: 35.0
    minor_continuing_outlet_pct: 15.0
    no_continuing_outlet_pct: 0.0
    continuing_outlet_threshold_usd: 90000.0
  rule: >-
    Where a cafe management contract is brought to an end before the last day of its contracted term, an early exit
    charge falls due on it. The months charged are the number of monthly management fees printed against the service
    model, and the exit fee base is the monthly management fee printed against that same service model. The exit
    charge before allowances is the months charged multiplied by the exit fee base, rounded to the nearest cent.
    No notice relief is given on that charge and no continuing outlet allowance is taken off it. The notice relief
    is taken off the exit charge before allowances first, and the continuing outlet allowance is then taken off
    the figure that step leaves; the result is rounded to the nearest cent and is never less than nil. The early
    exit charge is recorded against the billing period in which it is raised. Where twelve or more whole months
    of the contracted term stood unrun on the day written notice of termination was given and the cafe has been
    serving for fewer than twenty-four whole months, the months charged are the long remaining term exit months;
    where twelve or more whole months stood unrun on that day and the cafe has been serving for twenty-four whole
    months or more, the months charged are the settled site exit months; and where fewer than twelve whole months
    stood unrun on that day, the months charged are the number of monthly management fees printed against the service
    model. Where three or more management fee invoices stand on the contract in the six months up to the day the
    charge is raised and the highest management fee ever invoiced on the contract stands above the monthly management
    fee printed against the service model, the exit fee base is that highest management fee; where three or more
    management fee invoices stand over those six months and the highest management fee ever invoiced on the contract
    stands at or below the monthly management fee printed against the service model, the exit fee base is the mean
    of the management fees invoiced over those six months, rounded to the nearest cent; and where fewer than three
    management fee invoices stand over those six months, the exit fee base is the monthly management fee printed
    against the service model. Where the calendar days from the day written notice of termination was given to the
    day the charge is raised reach the termination notice printed against the service model and a resumption request
    stands approved on the contract, the notice given beyond that termination notice is counted in whole weeks and
    the exit charge before allowances is reduced for each of them by one fiftieth of itself rounded to the nearest
    cent, a part week being left unrelieved; where those calendar days reach the termination notice printed against
    the service model and no resumption request stands approved on the contract, the notice given beyond that termination
    notice is counted in calendar days and the exit charge before allowances is reduced for each of them by one
    three hundred and fiftieth of itself rounded to the nearest cent; and where those calendar days fall short of
    the termination notice printed against the service model, no notice relief is given on that charge. Where the
    client holds an unattended micro market standing open and the market settlement invoices raised to that client
    over the twelve months up to the day the charge is raised reach the continuing outlet threshold, the continuing
    outlet allowance is the major continuing outlet rate; where the client holds an unattended micro market standing
    open and those settlement invoices fall below that threshold, the continuing outlet allowance is the minor continuing
    outlet rate; and where the client holds no unattended micro market standing open, the continuing outlet allowance
    is the nil continuing outlet rate.
  prerequisite: []
  cross_category:
  - category: market
    as: history
    reads:
    - status
    - market_ledger.amount_usd
    note: >-
      The continuing outlet allowance tier is decided from whether the client's unattended micro market stands open
      and from the market settlement invoices raised to that client over the last twelve months.
  compute:
  - months_unrun_at_notice: MONTHS(F('termination_notice_date') or NOW, F('contract_end_date'))
  - service_months_at_charge: MONTHS(F('service_commenced_date') or F('contract_start_date'), NOW)
  - exit_months_charged: >-
      K('long_remaining_term_exit_months') if (months_unrun_at_notice >= 12 and service_months_at_charge < 24) else
      (K('settled_site_exit_months') if (months_unrun_at_notice >= 12 and service_months_at_charge >= 24) else P('early_termination_fee_months_of_fee'))
  - mgmt_invoices_6m: >-
      COUNT('cafe_ledger', within_months=6, date_field='posted_date', charge_code='management_fee')
  - mgmt_fees_6m: >-
      SUM('cafe_ledger','amount_usd', within_months=6, date_field='posted_date', charge_code='management_fee')
  - highest_mgmt_fee_usd: MAX('cafe_ledger','amount_usd', charge_code='management_fee')
  - exit_fee_base_usd: >-
      highest_mgmt_fee_usd if (mgmt_invoices_6m >= 3 and highest_mgmt_fee_usd > P('management_fee_monthly_usd'))
      else (RND(mgmt_fees_6m / MX(1, mgmt_invoices_6m), 2) if (mgmt_invoices_6m >= 3 and highest_mgmt_fee_usd <=
      P('management_fee_monthly_usd')) else P('management_fee_monthly_usd'))
  - exit_charge_before_allowances_usd: RND(exit_months_charged * exit_fee_base_usd, 2)
  - notice_days_given: DAYS(F('termination_notice_date') or NOW, NOW)
  - approved_resumptions: >-
      COUNT('cafe_service_requests', request_type='resumption_request', request_status='approved')
  - notice_relief_usd: >-
      RND(exit_charge_before_allowances_usd / 50, 2) * int((notice_days_given - P('termination_notice_days')) /
      7) if (notice_days_given >= P('termination_notice_days') and approved_resumptions >= 1) else (RND(exit_charge_before_allowances_usd
      / 350, 2) * (notice_days_given - P('termination_notice_days')) if (notice_days_given >= P('termination_notice_days')
      and approved_resumptions < 1) else 0.0)
  - market_status: CFIELD('market','status')
  - market_settlements_12m: >-
      XSUM('market','market_ledger','amount_usd', within_months=12, date_field='posted_date', charge_code='monthly_settlement')
  - continuing_outlet_pct: >-
      K('major_continuing_outlet_pct') if (market_status == 'active' and market_settlements_12m >= K('continuing_outlet_threshold_usd'))
      else (K('minor_continuing_outlet_pct') if (market_status == 'active' and market_settlements_12m < K('continuing_outlet_threshold_usd'))
      else K('no_continuing_outlet_pct'))
  - charge_after_relief_usd: RND(exit_charge_before_allowances_usd - notice_relief_usd, 2)
  - result: MX(0.0, RND(charge_after_relief_usd * (1 - continuing_outlet_pct / 100), 2))
  compute_basis:
    months_unrun_at_notice: >-
      Where twelve or more whole months of the contracted term stood unrun on the day written notice of termination
      was given and the cafe has been serving for fewer than twenty-four whole months, the months charged are the
      long remaining term exit months; where twelve or more whole months stood unrun on that day and the cafe has
      been serving for twenty-four whole months or more, the months charged are the settled site exit months; and
      where fewer than twelve whole months stood unrun on that day, the months charged are the number of monthly
      management fees printed against the service model.
    service_months_at_charge: >-
      Where twelve or more whole months of the contracted term stood unrun on the day written notice of termination
      was given and the cafe has been serving for fewer than twenty-four whole months, the months charged are the
      long remaining term exit months; where twelve or more whole months stood unrun on that day and the cafe has
      been serving for twenty-four whole months or more, the months charged are the settled site exit months; and
      where fewer than twelve whole months stood unrun on that day, the months charged are the number of monthly
      management fees printed against the service model.
    exit_months_charged: >-
      Where twelve or more whole months of the contracted term stood unrun on the day written notice of termination
      was given and the cafe has been serving for fewer than twenty-four whole months, the months charged are the
      long remaining term exit months; where twelve or more whole months stood unrun on that day and the cafe has
      been serving for twenty-four whole months or more, the months charged are the settled site exit months; and
      where fewer than twelve whole months stood unrun on that day, the months charged are the number of monthly
      management fees printed against the service model.
    mgmt_invoices_6m: >-
      Where three or more management fee invoices stand on the contract in the six months up to the day the charge
      is raised and the highest management fee ever invoiced on the contract stands above the monthly management
      fee printed against the service model, the exit fee base is that highest management fee; where three or more
      management fee invoices stand over those six months and the highest management fee ever invoiced on the contract
      stands at or below the monthly management fee printed against the service model, the exit fee base is the
      mean of the management fees invoiced over those six months, rounded to the nearest cent; and where fewer than
      three management fee invoices stand over those six months, the exit fee base is the monthly management fee
      printed against the service model.
    mgmt_fees_6m: >-
      Where three or more management fee invoices stand on the contract in the six months up to the day the charge
      is raised and the highest management fee ever invoiced on the contract stands above the monthly management
      fee printed against the service model, the exit fee base is that highest management fee; where three or more
      management fee invoices stand over those six months and the highest management fee ever invoiced on the contract
      stands at or below the monthly management fee printed against the service model, the exit fee base is the
      mean of the management fees invoiced over those six months, rounded to the nearest cent; and where fewer than
      three management fee invoices stand over those six months, the exit fee base is the monthly management fee
      printed against the service model.
    highest_mgmt_fee_usd: >-
      Where three or more management fee invoices stand on the contract in the six months up to the day the charge
      is raised and the highest management fee ever invoiced on the contract stands above the monthly management
      fee printed against the service model, the exit fee base is that highest management fee; where three or more
      management fee invoices stand over those six months and the highest management fee ever invoiced on the contract
      stands at or below the monthly management fee printed against the service model, the exit fee base is the
      mean of the management fees invoiced over those six months, rounded to the nearest cent; and where fewer than
      three management fee invoices stand over those six months, the exit fee base is the monthly management fee
      printed against the service model.
    exit_fee_base_usd: >-
      Where three or more management fee invoices stand on the contract in the six months up to the day the charge
      is raised and the highest management fee ever invoiced on the contract stands above the monthly management
      fee printed against the service model, the exit fee base is that highest management fee; where three or more
      management fee invoices stand over those six months and the highest management fee ever invoiced on the contract
      stands at or below the monthly management fee printed against the service model, the exit fee base is the
      mean of the management fees invoiced over those six months, rounded to the nearest cent; and where fewer than
      three management fee invoices stand over those six months, the exit fee base is the monthly management fee
      printed against the service model.
    exit_charge_before_allowances_usd: >-
      The exit charge before allowances is the months charged multiplied by the exit fee base, rounded to the nearest
      cent.
    notice_days_given: >-
      Where the calendar days from the day written notice of termination was given to the day the charge is raised
      reach the termination notice printed against the service model and a resumption request stands approved on
      the contract, the notice given beyond that termination notice is counted in whole weeks and the exit charge
      before allowances is reduced for each of them by one fiftieth of itself rounded to the nearest cent, a part
      week being left unrelieved; where those calendar days reach the termination notice printed against the service
      model and no resumption request stands approved on the contract, the notice given beyond that termination
      notice is counted in calendar days and the exit charge before allowances is reduced for each of them by one
      three hundred and fiftieth of itself rounded to the nearest cent; and where those calendar days fall short
      of the termination notice printed against the service model, no notice relief is given on that charge.
    approved_resumptions: >-
      Where the calendar days from the day written notice of termination was given to the day the charge is raised
      reach the termination notice printed against the service model and a resumption request stands approved on
      the contract, the notice given beyond that termination notice is counted in whole weeks and the exit charge
      before allowances is reduced for each of them by one fiftieth of itself rounded to the nearest cent, a part
      week being left unrelieved; where those calendar days reach the termination notice printed against the service
      model and no resumption request stands approved on the contract, the notice given beyond that termination
      notice is counted in calendar days and the exit charge before allowances is reduced for each of them by one
      three hundred and fiftieth of itself rounded to the nearest cent; and where those calendar days fall short
      of the termination notice printed against the service model, no notice relief is given on that charge.
    notice_relief_usd: >-
      Where the calendar days from the day written notice of termination was given to the day the charge is raised
      reach the termination notice printed against the service model and a resumption request stands approved on
      the contract, the notice given beyond that termination notice is counted in whole weeks and the exit charge
      before allowances is reduced for each of them by one fiftieth of itself rounded to the nearest cent, a part
      week being left unrelieved; where those calendar days reach the termination notice printed against the service
      model and no resumption request stands approved on the contract, the notice given beyond that termination
      notice is counted in calendar days and the exit charge before allowances is reduced for each of them by one
      three hundred and fiftieth of itself rounded to the nearest cent; and where those calendar days fall short
      of the termination notice printed against the service model, no notice relief is given on that charge.
    market_status: >-
      Where the client holds an unattended micro market standing open and the market settlement invoices raised
      to that client over the twelve months up to the day the charge is raised reach the continuing outlet threshold,
      the continuing outlet allowance is the major continuing outlet rate; where the client holds an unattended
      micro market standing open and those settlement invoices fall below that threshold, the continuing outlet
      allowance is the minor continuing outlet rate; and where the client holds no unattended micro market standing
      open, the continuing outlet allowance is the nil continuing outlet rate.
    market_settlements_12m: >-
      Where the client holds an unattended micro market standing open and the market settlement invoices raised
      to that client over the twelve months up to the day the charge is raised reach the continuing outlet threshold,
      the continuing outlet allowance is the major continuing outlet rate; where the client holds an unattended
      micro market standing open and those settlement invoices fall below that threshold, the continuing outlet
      allowance is the minor continuing outlet rate; and where the client holds no unattended micro market standing
      open, the continuing outlet allowance is the nil continuing outlet rate.
    continuing_outlet_pct: >-
      Where the client holds an unattended micro market standing open and the market settlement invoices raised
      to that client over the twelve months up to the day the charge is raised reach the continuing outlet threshold,
      the continuing outlet allowance is the major continuing outlet rate; where the client holds an unattended
      micro market standing open and those settlement invoices fall below that threshold, the continuing outlet
      allowance is the minor continuing outlet rate; and where the client holds no unattended micro market standing
      open, the continuing outlet allowance is the nil continuing outlet rate.
    charge_after_relief_usd: >-
      The notice relief is taken off the exit charge before allowances first, and the continuing outlet allowance
      is then taken off the figure that step leaves; the result is rounded to the nearest cent and is never less
      than nil.
    result: >-
      The notice relief is taken off the exit charge before allowances first, and the continuing outlet allowance
      is then taken off the figure that step leaves; the result is rounded to the nearest cent and is never less
      than nil.
  factors:
  - id: unrun_term_exit_months
    effect: parameter
    decides: exit_months_charged
    bindings:
    - months_unrun_at_notice
    - service_months_at_charge
    - exit_months_charged
    ladder:
    - when: >-
        twelve or more whole months of the contracted term stood unrun on the day written notice of termination
        was given and the cafe has been serving for fewer than twenty-four whole months
      value: the long remaining term exit months
    - when: >-
        twelve or more whole months stood unrun on that day and the cafe has been serving for twenty-four whole
        months or more
      value: the settled site exit months
    - when: otherwise
      value: the number of monthly management fees printed against the service model
    baseline:
      exit_months_charged: P('early_termination_fee_months_of_fee')
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: exit_fee_base_band
    effect: parameter
    decides: exit_fee_base_usd
    bindings:
    - mgmt_invoices_6m
    - mgmt_fees_6m
    - highest_mgmt_fee_usd
    - exit_fee_base_usd
    ladder:
    - when: >-
        three or more management fee invoices stand on the contract in the six months up to the day the charge is
        raised and the highest management fee ever invoiced on the contract stands above the monthly management
        fee printed against the service model
      value: the highest management fee ever invoiced on the contract
    - when: >-
        three or more management fee invoices stand over those six months and the highest management fee ever invoiced
        on the contract stands at or below the monthly management fee printed against the service model
      value: >-
        the mean of the management fees invoiced over those six months, rounded to the nearest cent
    - when: otherwise
      value: the monthly management fee printed against the service model
    baseline:
      exit_fee_base_usd: P('management_fee_monthly_usd')
    evidence:
    - history
    cross_difficulty: null
  - id: notice_relief_basis
    effect: method
    decides: notice_relief_usd
    bindings:
    - notice_days_given
    - approved_resumptions
    - notice_relief_usd
    ladder:
    - when: >-
        the calendar days from the day written notice of termination was given to the day the charge is raised reach
        the termination notice printed against the service model and a resumption request stands approved on the
        contract
      method: >-
        the notice given beyond that termination notice is counted in whole weeks and the exit charge before allowances
        is reduced for each of them by one fiftieth of itself rounded to the nearest cent, a part week being left
        unrelieved
    - when: >-
        those calendar days reach the termination notice printed against the service model and no resumption request
        stands approved on the contract
      method: >-
        the notice given beyond that termination notice is counted in calendar days and the exit charge before allowances
        is reduced for each of them by one three hundred and fiftieth of itself rounded to the nearest cent
    - when: otherwise
      method: no notice relief is given on that charge
    baseline:
      notice_relief_usd: '0.0'
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: continuing_outlet_allowance
    effect: parameter
    decides: continuing_outlet_pct
    bindings:
    - market_status
    - market_settlements_12m
    - continuing_outlet_pct
    ladder:
    - when: >-
        the client holds an unattended micro market standing open and the market settlement invoices raised to that
        client over the twelve months up to the day the charge is raised reach the continuing outlet threshold
      value: the major continuing outlet rate
    - when: >-
        the client holds an unattended micro market standing open and those settlement invoices fall below the continuing
        outlet threshold
      value: the minor continuing outlet rate
    - when: otherwise
      value: the nil continuing outlet rate
    baseline:
      continuing_outlet_pct: K('no_continuing_outlet_pct')
    evidence:
    - cross_category
    - history
    cross_difficulty: market
  baseline:
    rule: >-
      Where a cafe management contract is brought to an end before the last day of its contracted term, an early
      exit charge falls due on it. The months charged are the number of monthly management fees printed against
      the service model, and the exit fee base is the monthly management fee printed against that same service model.
      The exit charge before allowances is the months charged multiplied by the exit fee base, rounded to the nearest
      cent. No notice relief is given on that charge and no continuing outlet allowance is taken off it. The notice
      relief is taken off the exit charge before allowances first, and the continuing outlet allowance is then taken
      off the figure that step leaves; the result is rounded to the nearest cent and is never less than nil. The
      early exit charge is recorded against the billing period in which it is raised.
    params:
    - early_termination_fee_months_of_fee
    - management_fee_monthly_usd
    - no_continuing_outlet_pct
  inputs:
    history:
    - table: cafe_ledger
      aggregate: sum
      field: amount_usd
      within_months: 6
      filters:
        charge_code: management_fee
    - table: cafe_ledger
      aggregate: max
      field: amount_usd
      within_months: null
      filters:
        charge_code: management_fee
    - table: cafe_service_requests
      aggregate: count
      field: cafe_service_request_id
      within_months: null
      filters:
        request_type: resumption_request
        request_status: approved
    - category: market
      table: market_ledger
      aggregate: sum
      field: amount_usd
      within_months: 12
      filters:
        charge_code: monthly_settlement
    cross_category:
    - market
- id: cafe_ext_standby_charge_assessment
  base_policy_refs:
  - cafe_invoice_payment_terms
  - cafe_participation_guarantee
  - cafe_service_suspension_terms
  overwrite:
  - base_policy: cafe_service_suspension_terms
    superseded_clause: >-
      For each month or part month of pause the standby charge is raised, calculated as the standby percentage printed
      against the service model applied to the monthly management fee, and the management fee itself is not raised
      for the same period.
    replaced_by: >-
      The standby charge is the standby fee base taken at the standby rate, rounded to the nearest cent, charged
      for each month of pause charged, and the late resumption loading is then applied once to the figure that step
      leaves; the result is rounded to the nearest cent.
  - base_policy: cafe_service_suspension_terms
    superseded_clause: >-
      Where the client asks to resume sooner than the resumption notice allows, the cafe reopens on the earliest
      day the notice permits and the standby charge runs to that day.
    replaced_by: >-
      Where the calendar days between the day an approved resumption request was logged and the day it asked service
      to return fall short of the resumption notice printed against the service model and two or more suspension
      requests stand approved on the contract, the late resumption loading is the repeated short resumption loading;
      where those calendar days fall short of the resumption notice printed against the service model and fewer
      than two suspension requests stand approved on the contract, the late resumption loading is the single short
      resumption loading; and where those calendar days reach the resumption notice printed against the service
      model, the late resumption loading is the nil late resumption loading.
  trigger: state_due
  subject:
  - cafe_penalty_fee_posted
  computes: standby_charge_usd
  target_tool: post_standby_charge_21704194
  params:
    wind_down_standby_pct: 60.0
    notice_standby_pct: 48.0
    repeated_short_resumption_loading_pct: 20.0
    single_short_resumption_loading_pct: 10.0
    no_resumption_loading_pct: 0.0
  rule: >-
    A cafe contract on which counter service has been paused carries a standby charge for the pause. The suspended
    days counted are the suspended calendar days standing against the current contract year, the suspended days
    counted are divided by thirty and rounded down to a whole month with a minimum of one to give the months of
    pause charged, and the standby rate is the standby percentage printed against the service model. The standby
    fee base is the monthly management fee printed against the service model. The late resumption loading is the
    nil late resumption loading. The standby charge is the standby fee base taken at the standby rate, rounded to
    the nearest cent, charged for each month of pause charged, and the late resumption loading is then applied once
    to the figure that step leaves; the result is rounded to the nearest cent. The standby charge is recorded against
    the billing period in which it is raised. Where a resumption request stands approved on the contract and the
    day it asked service to return falls after the day the latest approved suspension request asked service to stop,
    the suspended days counted are the calendar days from the day service was asked to stop to the day it was asked
    to return, both days counted; where a resumption request stands approved on the contract and the day it asked
    service to return falls on or before the day the latest approved suspension request asked service to stop, the
    suspended days counted are the calendar days from the day service was asked to stop to the day the charge is
    raised; and where no resumption request stands approved on the contract, the suspended days counted are the
    suspended calendar days standing against the current contract year. Where two or more suspension requests stand
    approved on the contract and the suspended days counted exceed the shortest suspension printed against the service
    model, every whole thirty days of suspended time counted is a month of pause charged and any part beyond them
    is a further month; where the suspended days counted do not exceed the shortest suspension printed against the
    service model, the pause is handled as ordinary closed days and no month of pause is charged; and otherwise
    the suspended days counted are divided by thirty and rounded down to a whole month with a minimum of one. Where
    a day of written notice of termination stands on the contract and the suspended days counted reach half the
    contract year suspension ceiling printed against the service model, the standby rate is the wind-down standby
    rate; where a day of written notice of termination stands on the contract and the suspended days counted fall
    below half that ceiling, the standby rate is the notice standby rate; and where no day of written notice of
    termination stands on the contract, the standby rate is the standby percentage printed against the service model.
    Where the contract carries a management fee invoice in the three months up to the day the charge is raised and
    the management fee most recently invoiced stands below the monthly management fee printed against the service
    model, the standby fee base is the management fee most recently invoiced; where the contract carries a management
    fee invoice over those three months and the management fee most recently invoiced stands at or above the monthly
    management fee printed against the service model, the standby fee base is the mean of the management fees invoiced
    over those three months, rounded to the nearest cent; and where the contract carries no management fee invoice
    over those three months, the standby fee base is the monthly management fee printed against the service model.
    Where the calendar days between the day an approved resumption request was logged and the day it asked service
    to return fall short of the resumption notice printed against the service model and two or more suspension requests
    stand approved on the contract, the late resumption loading is the repeated short resumption loading; where
    those calendar days fall short of the resumption notice printed against the service model and fewer than two
    suspension requests stand approved on the contract, the late resumption loading is the single short resumption
    loading; and where those calendar days reach the resumption notice printed against the service model, the late
    resumption loading is the nil late resumption loading.
  prerequisite: []
  cross_category: []
  compute:
  - approved_suspensions: >-
      COUNT('cafe_service_requests', request_type='suspension_request', request_status='approved')
  - approved_resumptions: >-
      COUNT('cafe_service_requests', request_type='resumption_request', request_status='approved')
  - suspension_asked_for: >-
      LATEST('cafe_service_requests','requested_effective_date', date_field='created_at', request_type='suspension_request',
      request_status='approved')
  - resumption_asked_for: >-
      LATEST('cafe_service_requests','requested_effective_date', date_field='created_at', request_type='resumption_request',
      request_status='approved')
  - suspended_days_counted: >-
      DAYS(suspension_asked_for, resumption_asked_for) + 1 if (approved_resumptions >= 1 and DAYS(suspension_asked_for,
      resumption_asked_for) > 0) else (DAYS(suspension_asked_for, NOW) if (approved_resumptions >= 1 and DAYS(suspension_asked_for,
      resumption_asked_for) <= 0) else F('suspension_days_used_ytd'))
  - pause_months_charged: >-
      int(suspended_days_counted / 30) + (1 if suspended_days_counted % 30 > 0 else 0) if (approved_suspensions
      >= 2 and suspended_days_counted > P('min_suspension_days')) else (0 if suspended_days_counted <= P('min_suspension_days')
      else MX(1, int(suspended_days_counted / 30)))
  - notice_days_standing: DAYS(F('termination_notice_date'), NOW) if F('termination_notice_date') != '' else -1
  - standby_rate_pct: >-
      K('wind_down_standby_pct') if (notice_days_standing >= 0 and suspended_days_counted >= P('max_suspension_days_per_contract_year')
      / 2) else (K('notice_standby_pct') if (notice_days_standing >= 0 and suspended_days_counted < P('max_suspension_days_per_contract_year')
      / 2) else P('standby_fee_pct_of_management_fee'))
  - mgmt_invoices_3m: >-
      COUNT('cafe_ledger', within_months=3, date_field='posted_date', charge_code='management_fee')
  - mgmt_fees_3m: >-
      SUM('cafe_ledger','amount_usd', within_months=3, date_field='posted_date', charge_code='management_fee')
  - latest_mgmt_fee_usd: LATEST('cafe_ledger','amount_usd', date_field='posted_date', charge_code='management_fee')
  - standby_fee_base_usd: >-
      latest_mgmt_fee_usd if (mgmt_invoices_3m >= 1 and latest_mgmt_fee_usd < P('management_fee_monthly_usd')) else
      (RND(mgmt_fees_3m / MX(1, mgmt_invoices_3m), 2) if (mgmt_invoices_3m >= 1 and latest_mgmt_fee_usd >= P('management_fee_monthly_usd'))
      else P('management_fee_monthly_usd'))
  - resumption_logged_on: >-
      LATEST('cafe_service_requests','created_at', date_field='created_at', request_type='resumption_request', request_status='approved')
  - resumption_notice_days_given: DAYS(resumption_logged_on, resumption_asked_for)
  - late_resumption_loading_pct: >-
      K('repeated_short_resumption_loading_pct') if (resumption_notice_days_given < P('resumption_lead_days') and
      approved_suspensions >= 2) else (K('single_short_resumption_loading_pct') if (resumption_notice_days_given
      < P('resumption_lead_days') and approved_suspensions < 2) else K('no_resumption_loading_pct'))
  - standby_before_loading_usd: RND(standby_fee_base_usd * standby_rate_pct / 100, 2) * pause_months_charged
  - result: RND(standby_before_loading_usd * (1 + late_resumption_loading_pct / 100), 2)
  compute_basis:
    approved_suspensions: >-
      Where two or more suspension requests stand approved on the contract and the suspended days counted exceed
      the shortest suspension printed against the service model, every whole thirty days of suspended time counted
      is a month of pause charged and any part beyond them is a further month; where the suspended days counted
      do not exceed the shortest suspension printed against the service model, the pause is handled as ordinary
      closed days and no month of pause is charged; and otherwise the suspended days counted are divided by thirty
      and rounded down to a whole month with a minimum of one.
    approved_resumptions: >-
      Where a resumption request stands approved on the contract and the day it asked service to return falls after
      the day the latest approved suspension request asked service to stop, the suspended days counted are the calendar
      days from the day service was asked to stop to the day it was asked to return, both days counted; where a
      resumption request stands approved on the contract and the day it asked service to return falls on or before
      the day the latest approved suspension request asked service to stop, the suspended days counted are the calendar
      days from the day service was asked to stop to the day the charge is raised; and where no resumption request
      stands approved on the contract, the suspended days counted are the suspended calendar days standing against
      the current contract year.
    suspension_asked_for: >-
      Where a resumption request stands approved on the contract and the day it asked service to return falls after
      the day the latest approved suspension request asked service to stop, the suspended days counted are the calendar
      days from the day service was asked to stop to the day it was asked to return, both days counted; where a
      resumption request stands approved on the contract and the day it asked service to return falls on or before
      the day the latest approved suspension request asked service to stop, the suspended days counted are the calendar
      days from the day service was asked to stop to the day the charge is raised; and where no resumption request
      stands approved on the contract, the suspended days counted are the suspended calendar days standing against
      the current contract year.
    resumption_asked_for: >-
      Where a resumption request stands approved on the contract and the day it asked service to return falls after
      the day the latest approved suspension request asked service to stop, the suspended days counted are the calendar
      days from the day service was asked to stop to the day it was asked to return, both days counted; where a
      resumption request stands approved on the contract and the day it asked service to return falls on or before
      the day the latest approved suspension request asked service to stop, the suspended days counted are the calendar
      days from the day service was asked to stop to the day the charge is raised; and where no resumption request
      stands approved on the contract, the suspended days counted are the suspended calendar days standing against
      the current contract year.
    suspended_days_counted: >-
      Where a resumption request stands approved on the contract and the day it asked service to return falls after
      the day the latest approved suspension request asked service to stop, the suspended days counted are the calendar
      days from the day service was asked to stop to the day it was asked to return, both days counted; where a
      resumption request stands approved on the contract and the day it asked service to return falls on or before
      the day the latest approved suspension request asked service to stop, the suspended days counted are the calendar
      days from the day service was asked to stop to the day the charge is raised; and where no resumption request
      stands approved on the contract, the suspended days counted are the suspended calendar days standing against
      the current contract year.
    pause_months_charged: >-
      Where two or more suspension requests stand approved on the contract and the suspended days counted exceed
      the shortest suspension printed against the service model, every whole thirty days of suspended time counted
      is a month of pause charged and any part beyond them is a further month; where the suspended days counted
      do not exceed the shortest suspension printed against the service model, the pause is handled as ordinary
      closed days and no month of pause is charged; and otherwise the suspended days counted are divided by thirty
      and rounded down to a whole month with a minimum of one.
    notice_days_standing: >-
      Where a day of written notice of termination stands on the contract and the suspended days counted reach half
      the contract year suspension ceiling printed against the service model, the standby rate is the wind-down
      standby rate; where a day of written notice of termination stands on the contract and the suspended days counted
      fall below half that ceiling, the standby rate is the notice standby rate; and where no day of written notice
      of termination stands on the contract, the standby rate is the standby percentage printed against the service
      model.
    standby_rate_pct: >-
      Where a day of written notice of termination stands on the contract and the suspended days counted reach half
      the contract year suspension ceiling printed against the service model, the standby rate is the wind-down
      standby rate; where a day of written notice of termination stands on the contract and the suspended days counted
      fall below half that ceiling, the standby rate is the notice standby rate; and where no day of written notice
      of termination stands on the contract, the standby rate is the standby percentage printed against the service
      model.
    mgmt_invoices_3m: >-
      Where the contract carries a management fee invoice in the three months up to the day the charge is raised
      and the management fee most recently invoiced stands below the monthly management fee printed against the
      service model, the standby fee base is the management fee most recently invoiced; where the contract carries
      a management fee invoice over those three months and the management fee most recently invoiced stands at or
      above the monthly management fee printed against the service model, the standby fee base is the mean of the
      management fees invoiced over those three months, rounded to the nearest cent; and where the contract carries
      no management fee invoice over those three months, the standby fee base is the monthly management fee printed
      against the service model.
    mgmt_fees_3m: >-
      Where the contract carries a management fee invoice in the three months up to the day the charge is raised
      and the management fee most recently invoiced stands below the monthly management fee printed against the
      service model, the standby fee base is the management fee most recently invoiced; where the contract carries
      a management fee invoice over those three months and the management fee most recently invoiced stands at or
      above the monthly management fee printed against the service model, the standby fee base is the mean of the
      management fees invoiced over those three months, rounded to the nearest cent; and where the contract carries
      no management fee invoice over those three months, the standby fee base is the monthly management fee printed
      against the service model.
    latest_mgmt_fee_usd: >-
      Where the contract carries a management fee invoice in the three months up to the day the charge is raised
      and the management fee most recently invoiced stands below the monthly management fee printed against the
      service model, the standby fee base is the management fee most recently invoiced; where the contract carries
      a management fee invoice over those three months and the management fee most recently invoiced stands at or
      above the monthly management fee printed against the service model, the standby fee base is the mean of the
      management fees invoiced over those three months, rounded to the nearest cent; and where the contract carries
      no management fee invoice over those three months, the standby fee base is the monthly management fee printed
      against the service model.
    standby_fee_base_usd: >-
      Where the contract carries a management fee invoice in the three months up to the day the charge is raised
      and the management fee most recently invoiced stands below the monthly management fee printed against the
      service model, the standby fee base is the management fee most recently invoiced; where the contract carries
      a management fee invoice over those three months and the management fee most recently invoiced stands at or
      above the monthly management fee printed against the service model, the standby fee base is the mean of the
      management fees invoiced over those three months, rounded to the nearest cent; and where the contract carries
      no management fee invoice over those three months, the standby fee base is the monthly management fee printed
      against the service model.
    resumption_logged_on: >-
      Where the calendar days between the day an approved resumption request was logged and the day it asked service
      to return fall short of the resumption notice printed against the service model and two or more suspension
      requests stand approved on the contract, the late resumption loading is the repeated short resumption loading;
      where those calendar days fall short of the resumption notice printed against the service model and fewer
      than two suspension requests stand approved on the contract, the late resumption loading is the single short
      resumption loading; and where those calendar days reach the resumption notice printed against the service
      model, the late resumption loading is the nil late resumption loading.
    resumption_notice_days_given: >-
      Where the calendar days between the day an approved resumption request was logged and the day it asked service
      to return fall short of the resumption notice printed against the service model and two or more suspension
      requests stand approved on the contract, the late resumption loading is the repeated short resumption loading;
      where those calendar days fall short of the resumption notice printed against the service model and fewer
      than two suspension requests stand approved on the contract, the late resumption loading is the single short
      resumption loading; and where those calendar days reach the resumption notice printed against the service
      model, the late resumption loading is the nil late resumption loading.
    late_resumption_loading_pct: >-
      Where the calendar days between the day an approved resumption request was logged and the day it asked service
      to return fall short of the resumption notice printed against the service model and two or more suspension
      requests stand approved on the contract, the late resumption loading is the repeated short resumption loading;
      where those calendar days fall short of the resumption notice printed against the service model and fewer
      than two suspension requests stand approved on the contract, the late resumption loading is the single short
      resumption loading; and where those calendar days reach the resumption notice printed against the service
      model, the late resumption loading is the nil late resumption loading.
    standby_before_loading_usd: >-
      The standby charge is the standby fee base taken at the standby rate, rounded to the nearest cent, charged
      for each month of pause charged, and the late resumption loading is then applied once to the figure that step
      leaves; the result is rounded to the nearest cent.
    result: >-
      The standby charge is the standby fee base taken at the standby rate, rounded to the nearest cent, charged
      for each month of pause charged, and the late resumption loading is then applied once to the figure that step
      leaves; the result is rounded to the nearest cent.
  factors:
  - id: suspended_day_count_basis
    effect: method
    decides: suspended_days_counted
    bindings:
    - approved_resumptions
    - suspension_asked_for
    - resumption_asked_for
    - suspended_days_counted
    ladder:
    - when: >-
        a resumption request stands approved on the contract and the day it asked service to return falls after
        the day the latest approved suspension request asked service to stop
      method: >-
        the suspended days counted are the calendar days from the day service was asked to stop to the day it was
        asked to return, both days counted
    - when: >-
        a resumption request stands approved on the contract and the day it asked service to return falls on or
        before the day the latest approved suspension request asked service to stop
      method: >-
        the suspended days counted are the calendar days from the day service was asked to stop to the day the charge
        is raised
    - when: otherwise
      method: >-
        the suspended days counted are the suspended calendar days standing against the current contract year
    baseline:
      suspended_days_counted: F('suspension_days_used_ytd')
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: pause_month_count_basis
    effect: method
    decides: pause_months_charged
    bindings:
    - approved_suspensions
    - pause_months_charged
    ladder:
    - when: >-
        two or more suspension requests stand approved on the contract and the suspended days counted exceed the
        shortest suspension printed against the service model
      method: >-
        every whole thirty days of suspended time counted is a month of pause charged and any part beyond them is
        a further month
    - when: >-
        the suspended days counted do not exceed the shortest suspension printed against the service model
      method: the pause is handled as ordinary closed days and no month of pause is charged
    - when: otherwise
      method: >-
        the suspended days counted are divided by thirty and rounded down to a whole month with a minimum of one
    baseline:
      pause_months_charged: MX(1, int(suspended_days_counted / 30))
    evidence:
    - history
    cross_difficulty: null
  - id: standby_rate_band
    effect: parameter
    decides: standby_rate_pct
    bindings:
    - notice_days_standing
    - standby_rate_pct
    ladder:
    - when: >-
        a day of written notice of termination stands on the contract and the suspended days counted reach half
        the contract year suspension ceiling printed against the service model
      value: the wind-down standby rate
    - when: >-
        a day of written notice of termination stands on the contract and the suspended days counted fall below
        half that ceiling
      value: the notice standby rate
    - when: otherwise
      value: the standby percentage printed against the service model
    baseline:
      standby_rate_pct: P('standby_fee_pct_of_management_fee')
    evidence:
    - date
    cross_difficulty: null
  - id: standby_fee_base_band
    effect: parameter
    decides: standby_fee_base_usd
    bindings:
    - mgmt_invoices_3m
    - mgmt_fees_3m
    - latest_mgmt_fee_usd
    - standby_fee_base_usd
    ladder:
    - when: >-
        the contract carries a management fee invoice in the three months up to the day the charge is raised and
        the management fee most recently invoiced stands below the monthly management fee printed against the service
        model
      value: the management fee most recently invoiced
    - when: >-
        the contract carries a management fee invoice over those three months and the management fee most recently
        invoiced stands at or above the monthly management fee printed against the service model
      value: >-
        the mean of the management fees invoiced over those three months, rounded to the nearest cent
    - when: otherwise
      value: the monthly management fee printed against the service model
    baseline:
      standby_fee_base_usd: P('management_fee_monthly_usd')
    evidence:
    - history
    cross_difficulty: null
  - id: late_resumption_loading_band
    effect: parameter
    decides: late_resumption_loading_pct
    bindings:
    - resumption_logged_on
    - resumption_notice_days_given
    - late_resumption_loading_pct
    ladder:
    - when: >-
        the calendar days between the day an approved resumption request was logged and the day it asked service
        to return fall short of the resumption notice printed against the service model and two or more suspension
        requests stand approved on the contract
      value: the repeated short resumption loading
    - when: >-
        those calendar days fall short of the resumption notice printed against the service model and fewer than
        two suspension requests stand approved on the contract
      value: the single short resumption loading
    - when: otherwise
      value: the nil late resumption loading
    baseline:
      late_resumption_loading_pct: K('no_resumption_loading_pct')
    evidence:
    - history
    - date
    cross_difficulty: null
  baseline:
    rule: >-
      A cafe contract on which counter service has been paused carries a standby charge for the pause. The suspended
      days counted are the suspended calendar days standing against the current contract year, the suspended days
      counted are divided by thirty and rounded down to a whole month with a minimum of one to give the months of
      pause charged, and the standby rate is the standby percentage printed against the service model. The standby
      fee base is the monthly management fee printed against the service model. The late resumption loading is the
      nil late resumption loading. The standby charge is the standby fee base taken at the standby rate, rounded
      to the nearest cent, charged for each month of pause charged, and the late resumption loading is then applied
      once to the figure that step leaves; the result is rounded to the nearest cent. The standby charge is recorded
      against the billing period in which it is raised.
    params:
    - standby_fee_pct_of_management_fee
    - management_fee_monthly_usd
    - no_resumption_loading_pct
  inputs:
    history:
    - table: cafe_service_requests
      aggregate: count
      field: cafe_service_request_id
      within_months: null
      filters:
        request_type: suspension_request
        request_status: approved
    - table: cafe_service_requests
      aggregate: latest
      field: requested_effective_date
      within_months: null
      filters:
        request_type: resumption_request
        request_status: approved
    - table: cafe_ledger
      aggregate: count
      field: cafe_ledger_id
      within_months: 3
      filters:
        charge_code: management_fee
    - table: cafe_ledger
      aggregate: latest
      field: amount_usd
      within_months: null
      filters:
        charge_code: management_fee
    cross_category: []
- id: cafe_ext_closing_settlement_payment
  base_policy_refs:
  - cafe_invoice_payment_terms
  - cafe_termination_terms
  overwrite:
  - base_policy: cafe_termination_terms
    superseded_clause: >-
      On closure the equipment deposit is returned net of any charge outstanding, drawable subsidy funding left
      on the contract is refunded to the client, and the final invoice settles the balance in one document.
    replaced_by: >-
      The closing settlement is the unsettled balance carried into the settlement, plus the opening inventory recovery,
      less the equipment deposit returned, less the drawable subsidy funding refunded after any carry-over, and
      less the smallwares allowance credited back; the result is rounded to the nearest cent and is never less than
      nil.
  - base_policy: cafe_invoice_payment_terms
    superseded_clause: >-
      A payment larger than the invoiced amount settles that invoice and leaves the excess on the contract as a
      credit applied to the next invoice raised.
    replaced_by: >-
      When a workplace cafe management contract is settled out, the client pays one closing settlement that clears
      the contract in a single document.
  trigger: on_request
  subject:
  - cafe_invoice_payment_posted
  computes: settlement_amount_usd
  target_tool: settle_contract_balance_f9be2425
  params:
    retained_deposit_pct: 40.0
    part_retained_deposit_pct: 70.0
    whole_deposit_pct: 100.0
    early_inventory_recovery_pct: 100.0
    part_inventory_recovery_pct: 50.0
    no_inventory_recovery_pct: 0.0
    major_carry_over_pct: 75.0
    minor_carry_over_pct: 40.0
    no_carry_over_pct: 0.0
    outlet_carry_over_threshold_usd: 26000.0
    half_smallwares_share_pct: 50.0
    whole_smallwares_share_pct: 100.0
    no_smallwares_share_pct: 0.0
  rule: >-
    When a workplace cafe management contract is settled out, the client pays one closing settlement that clears
    the contract in a single document. The unsettled balance carried into the settlement is the amount invoiced
    and not yet settled standing on the contract. The contract year elapsed is the whole months between the first
    day of the contract term and the day the settlement is worked out, reduced by whole years. The opening inventory
    recovery is nil, the equipment deposit returned is the whole refundable equipment deposit printed against the
    service model, rounded to the nearest cent, the drawable subsidy funding refunded is the subsidy funding balance
    standing on the contract, the carry-over share is the nil carry-over share, and the smallwares share is nil.
    The smallwares allowance credited back is the smallwares allowance printed against the service model taken at
    the smallwares share and then reduced to the proportion that the whole months of the contract year still to
    run bear to twelve, rounded to the nearest cent; the whole months still to run are twelve less the contract
    year elapsed. The drawable subsidy funding paid back is what is left of the drawable subsidy funding refunded
    once the carry-over share is taken off it, rounded to the nearest cent. The settlement is recorded against the
    billing period in which it is paid. The closing settlement is the unsettled balance carried into the settlement,
    plus the opening inventory recovery, less the equipment deposit returned, less the drawable subsidy funding
    refunded after any carry-over, and less the smallwares allowance credited back; the result is rounded to the
    nearest cent and is never less than nil. The closing settlement is fixed only after the late charge owed on
    the contract's overdue invoice stands on its ledger. Before the closing settlement is worked out, the early
    exit charge due on the contract ending ahead of its term must stand recorded against the contract. The closing
    settlement is not worked out until the standby charge owed for the months the cafe has stood suspended stands
    on the contract's ledger. Where a first service day is recorded on the contract and it falls more than sixty
    calendar days after the first day of the contract term, the contract year elapsed is the whole months between
    the first service day and the day the settlement is worked out, reduced by whole years; where no first service
    day is recorded on the contract, no month of the contract year has elapsed; and otherwise the contract year
    elapsed is the whole months between the first day of the contract term and the day the settlement is worked
    out, reduced by whole years. Where two or more contractual charges stand raised on the contract in the three
    months up to the day the settlement is worked out and a day of written notice of termination stands on the contract,
    the equipment deposit returned is the retained deposit share of the refundable equipment deposit printed against
    the service model, rounded to the nearest cent; where exactly one contractual charge stands raised over those
    three months and a day of written notice of termination stands on the contract, the equipment deposit returned
    is the part retained deposit share of that deposit, rounded to the nearest cent; and where no contractual charge
    stands raised over those three months, the equipment deposit returned is the whole refundable equipment deposit
    printed against the service model, rounded to the nearest cent. Where two or more subsidy funding lots stand
    on the contract in the twelve months up to the day the settlement is worked out and the subsidy drawn over those
    twelve months falls short of the lots funded over them, the drawable subsidy funding refunded is the lots funded
    over those twelve months less the subsidy drawn over them, rounded to the nearest cent; where fewer than two
    subsidy funding lots stand over those twelve months and the subsidy drawn over them falls short of the lots
    funded over them, the drawable subsidy funding refunded is the subsidy funding balance standing on the contract
    taken at the unused rollover percentage printed against the service model, rounded to the nearest cent; and
    where the subsidy drawn over those twelve months reaches the lots funded over them, the drawable subsidy funding
    refunded is the subsidy funding balance standing on the contract. Where the cafe has been serving for fewer
    than twelve whole months on the day the settlement is worked out and a day of written notice of termination
    stands on the contract, the opening inventory recovery is the early inventory recovery share of the opening
    inventory printed against the service model, rounded to the nearest cent; where the cafe has been serving for
    twelve whole months or more but fewer than twenty-four on that day and a day of written notice of termination
    stands on the contract, the opening inventory recovery is the part inventory recovery share of that opening
    inventory, rounded to the nearest cent; and where the cafe has been serving for twenty-four whole months or
    more, the opening inventory recovery is nil. Where the client holds an unattended micro market standing open
    and the subsidy the client has funded at the market kiosk over the twelve months up to the day the settlement
    is worked out reaches the outlet carry-over threshold, the major carry-over share of the drawable subsidy funding
    refunded is carried over to that market rather than paid back; where the client holds an unattended micro market
    standing open and that kiosk subsidy funding falls below the outlet carry-over threshold, the minor carry-over
    share of it is carried over to that market rather than paid back; and where the client holds no unattended micro
    market standing open, the carry-over share is the nil carry-over share. Where the cafe has stood suspended for
    ten or more calendar days in the current contract year and a day of written notice of termination stands on
    the contract, the smallwares share is one half; where the cafe has stood suspended for fewer than ten calendar
    days in the current contract year and a day of written notice of termination stands on the contract, the smallwares
    share is the whole; and where no day of written notice of termination stands on the contract, the smallwares
    share is nil.
  prerequisite:
  - problem: cafe_ext_late_charge_assessment
    kind: value_input
    gate: unsettled_balance_usd
    form: state
    policy_source: >-
      The closing settlement is fixed only after the late charge owed on the contract's overdue invoice stands on
      its ledger.
    condition: >-
      a cafe_ledger row of charge_code late_fee whose service_period is the calendar month in which the settlement
      is worked out stands against the contract, and cafe_contracts.receivable_balance_usd carries it.
    resolved_by: post_late_charge_719c9a63
    effect: >-
      Once the late charge stands on the ledger the unsettled balance binding reads it, and the contractual charges
      counted in the three month window rise by one.
  - problem: cafe_ext_early_exit_charge
    kind: value_input
    gate: unsettled_balance_usd
    form: state
    policy_source: >-
      Before the closing settlement is worked out, the early exit charge due on the contract ending ahead of its
      term must stand recorded against the contract.
    condition: >-
      a cafe_ledger row of charge_code early_termination_fee whose service_period is the calendar month in which
      the settlement is worked out stands against the contract, and cafe_contracts.receivable_balance_usd carries
      it.
    resolved_by: post_early_exit_charge_dadd74c6
    effect: >-
      Once the early exit charge stands on the ledger the unsettled balance binding reads it, and the contractual
      charges counted in the three month window rise by one.
  - problem: cafe_ext_standby_charge_assessment
    kind: value_input
    gate: unsettled_balance_usd
    form: state
    policy_source: >-
      The closing settlement is not worked out until the standby charge owed for the months the cafe has stood suspended
      stands on the contract's ledger.
    condition: >-
      a cafe_ledger row of charge_code standby_fee whose service_period is the calendar month in which the settlement
      is worked out stands against the contract, and cafe_contracts.receivable_balance_usd carries it.
    resolved_by: post_standby_charge_21704194
    effect: >-
      Once the standby charge stands on the ledger the unsettled balance binding reads it, and the contractual charges
      counted in the three month window rise by one.
  cross_category:
  - category: market
    as: history
    reads:
    - status
    - market_ledger.amount_usd
    note: >-
      The outlet carry-over tier is decided from whether the client's unattended micro market stands open and from
      the subsidy the client has funded at its kiosk over the last twelve months.
  compute:
  - unsettled_balance_usd: F('receivable_balance_usd')
  - service_gap_days: DAYS(F('contract_start_date'), F('service_commenced_date') or F('contract_start_date'))
  - service_months: MONTHS(F('service_commenced_date') or F('contract_start_date'), NOW)
  - term_months: MONTHS(F('contract_start_date'), NOW)
  - contract_year_elapsed_months: >-
      service_months % 12 if (F('service_commenced_date') != '' and service_gap_days > 60) else (0 if F('service_commenced_date')
      == '' else term_months % 12)
  - penalty_charges_3m: >-
      COUNT('cafe_ledger', within_months=3, date_field='posted_date', event_type='cafe_penalty_fee_posted')
  - notice_days_standing: DAYS(F('termination_notice_date'), NOW) if F('termination_notice_date') != '' else -1
  - deposit_returned_usd: >-
      RND(P('equipment_deposit_usd') * K('retained_deposit_pct') / 100, 2) if (penalty_charges_3m >= 2 and notice_days_standing
      >= 0) else (RND(P('equipment_deposit_usd') * K('part_retained_deposit_pct') / 100, 2) if (penalty_charges_3m
      == 1 and notice_days_standing >= 0) else RND(P('equipment_deposit_usd') * K('whole_deposit_pct') / 100, 2))
  - funding_lots_12m: >-
      COUNT('cafe_ledger', within_months=12, date_field='posted_date', charge_code='subsidy_funding')
  - funding_paid_12m: >-
      SUM('cafe_ledger','amount_usd', within_months=12, date_field='posted_date', charge_code='subsidy_funding')
  - subsidy_drawn_12m: >-
      SUM('cafe_ledger','amount_usd', within_months=12, date_field='posted_date', charge_code='subsidy_drawdown')
  - subsidy_refund_usd: >-
      RND(funding_paid_12m - subsidy_drawn_12m, 2) if (funding_lots_12m >= 2 and subsidy_drawn_12m < funding_paid_12m)
      else (RND(F('subsidy_pool_balance_usd') * P('subsidy_unused_rollover_pct') / 100, 2) if (funding_lots_12m
      < 2 and subsidy_drawn_12m < funding_paid_12m) else F('subsidy_pool_balance_usd'))
  - months_in_service: MONTHS(F('service_commenced_date') or F('contract_start_date'), NOW)
  - inventory_recovery_usd: >-
      RND(P('opening_inventory_usd') * K('early_inventory_recovery_pct') / 100, 2) if (months_in_service < 12 and
      notice_days_standing >= 0) else (RND(P('opening_inventory_usd') * K('part_inventory_recovery_pct') / 100,
      2) if (months_in_service >= 12 and months_in_service < 24 and notice_days_standing >= 0) else RND(P('opening_inventory_usd')
      * K('no_inventory_recovery_pct') / 100, 2))
  - market_status: CFIELD('market','status')
  - kiosk_subsidy_funded_12m: >-
      XSUM('market','market_ledger','amount_usd', within_months=12, date_field='posted_date', charge_code='subsidy_funding')
  - carry_over_pct: >-
      K('major_carry_over_pct') if (market_status == 'active' and kiosk_subsidy_funded_12m >= K('outlet_carry_over_threshold_usd'))
      else (K('minor_carry_over_pct') if (market_status == 'active' and kiosk_subsidy_funded_12m < K('outlet_carry_over_threshold_usd'))
      else K('no_carry_over_pct'))
  - subsidy_refunded_after_carry_over_usd: RND(subsidy_refund_usd * (1 - carry_over_pct / 100), 2)
  - suspended_days_ytd: F('suspension_days_used_ytd')
  - days_since_notice_given: DAYS(F('termination_notice_date'), NOW) if F('termination_notice_date') != '' else
      -1
  - smallwares_share_pct: >-
      K('half_smallwares_share_pct') if (suspended_days_ytd >= 10 and days_since_notice_given >= 0) else (K('whole_smallwares_share_pct')
      if (suspended_days_ytd < 10 and days_since_notice_given >= 0) else K('no_smallwares_share_pct'))
  - smallwares_credit_usd: >-
      RND(P('smallwares_allowance_usd') * smallwares_share_pct / 100 * (12 - contract_year_elapsed_months) / 12,
      2)
  - result: >-
      MX(0.0, RND(unsettled_balance_usd + inventory_recovery_usd - deposit_returned_usd - subsidy_refunded_after_carry_over_usd
      - smallwares_credit_usd, 2))
  compute_basis:
    unsettled_balance_usd: >-
      The unsettled balance carried into the settlement is the amount invoiced and not yet settled standing on the
      contract.
    service_gap_days: >-
      Where a first service day is recorded on the contract and it falls more than sixty calendar days after the
      first day of the contract term, the contract year elapsed is the whole months between the first service day
      and the day the settlement is worked out, reduced by whole years; where no first service day is recorded on
      the contract, no month of the contract year has elapsed; and otherwise the contract year elapsed is the whole
      months between the first day of the contract term and the day the settlement is worked out, reduced by whole
      years.
    service_months: >-
      Where a first service day is recorded on the contract and it falls more than sixty calendar days after the
      first day of the contract term, the contract year elapsed is the whole months between the first service day
      and the day the settlement is worked out, reduced by whole years; where no first service day is recorded on
      the contract, no month of the contract year has elapsed; and otherwise the contract year elapsed is the whole
      months between the first day of the contract term and the day the settlement is worked out, reduced by whole
      years.
    term_months: >-
      Where a first service day is recorded on the contract and it falls more than sixty calendar days after the
      first day of the contract term, the contract year elapsed is the whole months between the first service day
      and the day the settlement is worked out, reduced by whole years; where no first service day is recorded on
      the contract, no month of the contract year has elapsed; and otherwise the contract year elapsed is the whole
      months between the first day of the contract term and the day the settlement is worked out, reduced by whole
      years.
    contract_year_elapsed_months: >-
      Where a first service day is recorded on the contract and it falls more than sixty calendar days after the
      first day of the contract term, the contract year elapsed is the whole months between the first service day
      and the day the settlement is worked out, reduced by whole years; where no first service day is recorded on
      the contract, no month of the contract year has elapsed; and otherwise the contract year elapsed is the whole
      months between the first day of the contract term and the day the settlement is worked out, reduced by whole
      years.
    penalty_charges_3m: >-
      Where two or more contractual charges stand raised on the contract in the three months up to the day the settlement
      is worked out and a day of written notice of termination stands on the contract, the equipment deposit returned
      is the retained deposit share of the refundable equipment deposit printed against the service model, rounded
      to the nearest cent; where exactly one contractual charge stands raised over those three months and a day
      of written notice of termination stands on the contract, the equipment deposit returned is the part retained
      deposit share of that deposit, rounded to the nearest cent; and where no contractual charge stands raised
      over those three months, the equipment deposit returned is the whole refundable equipment deposit printed
      against the service model, rounded to the nearest cent.
    notice_days_standing: >-
      Where two or more contractual charges stand raised on the contract in the three months up to the day the settlement
      is worked out and a day of written notice of termination stands on the contract, the equipment deposit returned
      is the retained deposit share of the refundable equipment deposit printed against the service model, rounded
      to the nearest cent; where exactly one contractual charge stands raised over those three months and a day
      of written notice of termination stands on the contract, the equipment deposit returned is the part retained
      deposit share of that deposit, rounded to the nearest cent; and where no contractual charge stands raised
      over those three months, the equipment deposit returned is the whole refundable equipment deposit printed
      against the service model, rounded to the nearest cent.
    deposit_returned_usd: >-
      Where two or more contractual charges stand raised on the contract in the three months up to the day the settlement
      is worked out and a day of written notice of termination stands on the contract, the equipment deposit returned
      is the retained deposit share of the refundable equipment deposit printed against the service model, rounded
      to the nearest cent; where exactly one contractual charge stands raised over those three months and a day
      of written notice of termination stands on the contract, the equipment deposit returned is the part retained
      deposit share of that deposit, rounded to the nearest cent; and where no contractual charge stands raised
      over those three months, the equipment deposit returned is the whole refundable equipment deposit printed
      against the service model, rounded to the nearest cent.
    funding_lots_12m: >-
      Where two or more subsidy funding lots stand on the contract in the twelve months up to the day the settlement
      is worked out and the subsidy drawn over those twelve months falls short of the lots funded over them, the
      drawable subsidy funding refunded is the lots funded over those twelve months less the subsidy drawn over
      them, rounded to the nearest cent; where fewer than two subsidy funding lots stand over those twelve months
      and the subsidy drawn over them falls short of the lots funded over them, the drawable subsidy funding refunded
      is the subsidy funding balance standing on the contract taken at the unused rollover percentage printed against
      the service model, rounded to the nearest cent; and where the subsidy drawn over those twelve months reaches
      the lots funded over them, the drawable subsidy funding refunded is the subsidy funding balance standing on
      the contract.
    funding_paid_12m: >-
      Where two or more subsidy funding lots stand on the contract in the twelve months up to the day the settlement
      is worked out and the subsidy drawn over those twelve months falls short of the lots funded over them, the
      drawable subsidy funding refunded is the lots funded over those twelve months less the subsidy drawn over
      them, rounded to the nearest cent; where fewer than two subsidy funding lots stand over those twelve months
      and the subsidy drawn over them falls short of the lots funded over them, the drawable subsidy funding refunded
      is the subsidy funding balance standing on the contract taken at the unused rollover percentage printed against
      the service model, rounded to the nearest cent; and where the subsidy drawn over those twelve months reaches
      the lots funded over them, the drawable subsidy funding refunded is the subsidy funding balance standing on
      the contract.
    subsidy_drawn_12m: >-
      Where two or more subsidy funding lots stand on the contract in the twelve months up to the day the settlement
      is worked out and the subsidy drawn over those twelve months falls short of the lots funded over them, the
      drawable subsidy funding refunded is the lots funded over those twelve months less the subsidy drawn over
      them, rounded to the nearest cent; where fewer than two subsidy funding lots stand over those twelve months
      and the subsidy drawn over them falls short of the lots funded over them, the drawable subsidy funding refunded
      is the subsidy funding balance standing on the contract taken at the unused rollover percentage printed against
      the service model, rounded to the nearest cent; and where the subsidy drawn over those twelve months reaches
      the lots funded over them, the drawable subsidy funding refunded is the subsidy funding balance standing on
      the contract.
    subsidy_refund_usd: >-
      Where two or more subsidy funding lots stand on the contract in the twelve months up to the day the settlement
      is worked out and the subsidy drawn over those twelve months falls short of the lots funded over them, the
      drawable subsidy funding refunded is the lots funded over those twelve months less the subsidy drawn over
      them, rounded to the nearest cent; where fewer than two subsidy funding lots stand over those twelve months
      and the subsidy drawn over them falls short of the lots funded over them, the drawable subsidy funding refunded
      is the subsidy funding balance standing on the contract taken at the unused rollover percentage printed against
      the service model, rounded to the nearest cent; and where the subsidy drawn over those twelve months reaches
      the lots funded over them, the drawable subsidy funding refunded is the subsidy funding balance standing on
      the contract.
    months_in_service: >-
      Where the cafe has been serving for fewer than twelve whole months on the day the settlement is worked out
      and a day of written notice of termination stands on the contract, the opening inventory recovery is the early
      inventory recovery share of the opening inventory printed against the service model, rounded to the nearest
      cent; where the cafe has been serving for twelve whole months or more but fewer than twenty-four on that day
      and a day of written notice of termination stands on the contract, the opening inventory recovery is the part
      inventory recovery share of that opening inventory, rounded to the nearest cent; and where the cafe has been
      serving for twenty-four whole months or more, the opening inventory recovery is nil.
    inventory_recovery_usd: >-
      Where the cafe has been serving for fewer than twelve whole months on the day the settlement is worked out
      and a day of written notice of termination stands on the contract, the opening inventory recovery is the early
      inventory recovery share of the opening inventory printed against the service model, rounded to the nearest
      cent; where the cafe has been serving for twelve whole months or more but fewer than twenty-four on that day
      and a day of written notice of termination stands on the contract, the opening inventory recovery is the part
      inventory recovery share of that opening inventory, rounded to the nearest cent; and where the cafe has been
      serving for twenty-four whole months or more, the opening inventory recovery is nil.
    market_status: >-
      Where the client holds an unattended micro market standing open and the subsidy the client has funded at the
      market kiosk over the twelve months up to the day the settlement is worked out reaches the outlet carry-over
      threshold, the major carry-over share of the drawable subsidy funding refunded is carried over to that market
      rather than paid back; where the client holds an unattended micro market standing open and that kiosk subsidy
      funding falls below the outlet carry-over threshold, the minor carry-over share of it is carried over to that
      market rather than paid back; and where the client holds no unattended micro market standing open, the carry-over
      share is the nil carry-over share.
    kiosk_subsidy_funded_12m: >-
      Where the client holds an unattended micro market standing open and the subsidy the client has funded at the
      market kiosk over the twelve months up to the day the settlement is worked out reaches the outlet carry-over
      threshold, the major carry-over share of the drawable subsidy funding refunded is carried over to that market
      rather than paid back; where the client holds an unattended micro market standing open and that kiosk subsidy
      funding falls below the outlet carry-over threshold, the minor carry-over share of it is carried over to that
      market rather than paid back; and where the client holds no unattended micro market standing open, the carry-over
      share is the nil carry-over share.
    carry_over_pct: >-
      Where the client holds an unattended micro market standing open and the subsidy the client has funded at the
      market kiosk over the twelve months up to the day the settlement is worked out reaches the outlet carry-over
      threshold, the major carry-over share of the drawable subsidy funding refunded is carried over to that market
      rather than paid back; where the client holds an unattended micro market standing open and that kiosk subsidy
      funding falls below the outlet carry-over threshold, the minor carry-over share of it is carried over to that
      market rather than paid back; and where the client holds no unattended micro market standing open, the carry-over
      share is the nil carry-over share.
    subsidy_refunded_after_carry_over_usd: >-
      The drawable subsidy funding paid back is what is left of the drawable subsidy funding refunded once the carry-over
      share is taken off it, rounded to the nearest cent.
    suspended_days_ytd: >-
      Where the cafe has stood suspended for ten or more calendar days in the current contract year and a day of
      written notice of termination stands on the contract, the smallwares share is one half; where the cafe has
      stood suspended for fewer than ten calendar days in the current contract year and a day of written notice
      of termination stands on the contract, the smallwares share is the whole; and where no day of written notice
      of termination stands on the contract, the smallwares share is nil.
    days_since_notice_given: >-
      Where the cafe has stood suspended for ten or more calendar days in the current contract year and a day of
      written notice of termination stands on the contract, the smallwares share is one half; where the cafe has
      stood suspended for fewer than ten calendar days in the current contract year and a day of written notice
      of termination stands on the contract, the smallwares share is the whole; and where no day of written notice
      of termination stands on the contract, the smallwares share is nil.
    smallwares_share_pct: >-
      Where the cafe has stood suspended for ten or more calendar days in the current contract year and a day of
      written notice of termination stands on the contract, the smallwares share is one half; where the cafe has
      stood suspended for fewer than ten calendar days in the current contract year and a day of written notice
      of termination stands on the contract, the smallwares share is the whole; and where no day of written notice
      of termination stands on the contract, the smallwares share is nil.
    smallwares_credit_usd: >-
      The smallwares allowance credited back is the smallwares allowance printed against the service model taken
      at the smallwares share and then reduced to the proportion that the whole months of the contract year still
      to run bear to twelve, rounded to the nearest cent; the whole months still to run are twelve less the contract
      year elapsed.
    result: >-
      The closing settlement is the unsettled balance carried into the settlement, plus the opening inventory recovery,
      less the equipment deposit returned, less the drawable subsidy funding refunded after any carry-over, and
      less the smallwares allowance credited back; the result is rounded to the nearest cent and is never less than
      nil.
  factors:
  - id: contract_year_anchor
    effect: method
    decides: contract_year_elapsed_months
    bindings:
    - service_gap_days
    - service_months
    - term_months
    - contract_year_elapsed_months
    ladder:
    - when: >-
        a first service day is recorded on the contract and it falls more than sixty calendar days after the first
        day of the contract term
      method: >-
        the contract year elapsed is the whole months between the first service day and the day the settlement is
        worked out, reduced by whole years
    - when: no first service day is recorded on the contract
      method: no month of the contract year has elapsed
    - when: otherwise
      method: >-
        the contract year elapsed is the whole months between the first day of the contract term and the day the
        settlement is worked out, reduced by whole years
    baseline:
      contract_year_elapsed_months: term_months % 12
    evidence:
    - date
    cross_difficulty: null
  - id: equipment_deposit_return_band
    effect: parameter
    decides: deposit_returned_usd
    bindings:
    - penalty_charges_3m
    - notice_days_standing
    - deposit_returned_usd
    ladder:
    - when: >-
        two or more contractual charges stand raised on the contract in the three months up to the day the settlement
        is worked out and a day of written notice of termination stands on the contract
      value: >-
        the retained deposit share of the refundable equipment deposit printed against the service model, rounded
        to the nearest cent
    - when: >-
        exactly one contractual charge stands raised over those three months and a day of written notice of termination
        stands on the contract
      value: the part retained deposit share of that deposit, rounded to the nearest cent
    - when: otherwise
      value: >-
        the whole refundable equipment deposit printed against the service model, rounded to the nearest cent
    baseline:
      deposit_returned_usd: RND(P('equipment_deposit_usd') * K('whole_deposit_pct') / 100, 2)
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: drawable_funding_refund_basis
    effect: method
    decides: subsidy_refund_usd
    bindings:
    - funding_lots_12m
    - funding_paid_12m
    - subsidy_drawn_12m
    - subsidy_refund_usd
    ladder:
    - when: >-
        two or more subsidy funding lots stand on the contract in the twelve months up to the day the settlement
        is worked out and the subsidy drawn over those twelve months falls short of the lots funded over them
      method: >-
        the drawable subsidy funding refunded is the lots funded over those twelve months less the subsidy drawn
        over them, rounded to the nearest cent
    - when: >-
        fewer than two subsidy funding lots stand over those twelve months and the subsidy drawn over them falls
        short of the lots funded over them
      method: >-
        the drawable subsidy funding refunded is the subsidy funding balance standing on the contract taken at the
        unused rollover percentage printed against the service model, rounded to the nearest cent
    - when: otherwise
      method: >-
        the drawable subsidy funding refunded is the subsidy funding balance standing on the contract
    baseline:
      subsidy_refund_usd: F('subsidy_pool_balance_usd')
    evidence:
    - history
    cross_difficulty: null
  - id: opening_inventory_recovery_band
    effect: parameter
    decides: inventory_recovery_usd
    bindings:
    - months_in_service
    - inventory_recovery_usd
    ladder:
    - when: >-
        the cafe has been serving for fewer than twelve whole months on the day the settlement is worked out and
        a day of written notice of termination stands on the contract
      value: >-
        the early inventory recovery share of the opening inventory printed against the service model, rounded to
        the nearest cent
    - when: >-
        the cafe has been serving for twelve whole months or more but fewer than twenty-four on that day and a day
        of written notice of termination stands on the contract
      value: the part inventory recovery share of that opening inventory, rounded to the nearest cent
    - when: otherwise
      value: nil
    baseline:
      inventory_recovery_usd: RND(P('opening_inventory_usd') * K('no_inventory_recovery_pct') / 100, 2)
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: outlet_carry_over_band
    effect: parameter
    decides: carry_over_pct
    bindings:
    - market_status
    - kiosk_subsidy_funded_12m
    - carry_over_pct
    ladder:
    - when: >-
        the client holds an unattended micro market standing open and the subsidy the client has funded at the market
        kiosk over the twelve months up to the day the settlement is worked out reaches the outlet carry-over threshold
      value: the major carry-over share
    - when: >-
        the client holds an unattended micro market standing open and that kiosk subsidy funding falls below the
        outlet carry-over threshold
      value: the minor carry-over share
    - when: otherwise
      value: the nil carry-over share
    baseline:
      carry_over_pct: K('no_carry_over_pct')
    evidence:
    - cross_category
    - history
    cross_difficulty: market
  - id: smallwares_credit_band
    effect: parameter
    decides: smallwares_share_pct
    bindings:
    - suspended_days_ytd
    - days_since_notice_given
    - smallwares_share_pct
    ladder:
    - when: >-
        the cafe has stood suspended for ten or more calendar days in the current contract year and a day of written
        notice of termination stands on the contract
      value: the smallwares share is one half
    - when: >-
        the cafe has stood suspended for fewer than ten calendar days in the current contract year and a day of
        written notice of termination stands on the contract
      value: the smallwares share is the whole
    - when: otherwise
      value: the smallwares share is nil
    baseline:
      smallwares_share_pct: K('no_smallwares_share_pct')
    evidence:
    - date
    - history
    cross_difficulty: null
  baseline:
    rule: >-
      When a workplace cafe management contract is settled out, the client pays one closing settlement that clears
      the contract in a single document. The unsettled balance carried into the settlement is the amount invoiced
      and not yet settled standing on the contract. The contract year elapsed is the whole months between the first
      day of the contract term and the day the settlement is worked out, reduced by whole years. The opening inventory
      recovery is nil, the equipment deposit returned is the whole refundable equipment deposit printed against
      the service model, rounded to the nearest cent, the drawable subsidy funding refunded is the subsidy funding
      balance standing on the contract, the carry-over share is the nil carry-over share, and the smallwares share
      is nil. The smallwares allowance credited back is the smallwares allowance printed against the service model
      taken at the smallwares share and then reduced to the proportion that the whole months of the contract year
      still to run bear to twelve, rounded to the nearest cent; the whole months still to run are twelve less the
      contract year elapsed. The drawable subsidy funding paid back is what is left of the drawable subsidy funding
      refunded once the carry-over share is taken off it, rounded to the nearest cent. The settlement is recorded
      against the billing period in which it is paid. The closing settlement is the unsettled balance carried into
      the settlement, plus the opening inventory recovery, less the equipment deposit returned, less the drawable
      subsidy funding refunded after any carry-over, and less the smallwares allowance credited back; the result
      is rounded to the nearest cent and is never less than nil.
    params:
    - equipment_deposit_usd
    - opening_inventory_usd
    - smallwares_allowance_usd
    - whole_deposit_pct
    - no_inventory_recovery_pct
    - no_carry_over_pct
    - no_smallwares_share_pct
