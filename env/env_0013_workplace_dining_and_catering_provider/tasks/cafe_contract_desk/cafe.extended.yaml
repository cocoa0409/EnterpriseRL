    - table: cafe_ledger
      aggregate: count
      field: cafe_ledger_id
      within_months: 12
      filters:
        charge_code: subsidy_funding
    - table: cafe_ledger
      aggregate: sum
      field: amount_usd
      within_months: 12
      filters:
        charge_code: subsidy_funding
    - table: cafe_ledger
      aggregate: sum
      field: amount_usd
      within_months: 12
      filters:
        charge_code: subsidy_drawdown
    - category: market
      table: market_ledger
      aggregate: sum
      field: amount_usd
      within_months: 12
      filters:
        charge_code: subsidy_funding
    cross_category:
    - market
