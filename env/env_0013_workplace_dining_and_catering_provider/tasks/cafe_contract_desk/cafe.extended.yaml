  - suspended_days_ytd: F('suspension_days_used_ytd')
  - periods_set_aside: >-
      K('extended_closure_periods_set_aside') if (approved_suspensions >= 2 and suspended_days_ytd >= 10) else (K('short_closure_periods_set_aside')
      if (approved_suspensions == 1 and suspended_days_ytd >= 10) else K('no_periods_set_aside'))
  - net_claim_days: MX(0, approved_claim_days - periods_set_aside)
  - credited_periods: >-
      net_claim_days * P('meal_periods_served') if (P('meal_periods_served') >= 2 and net_claim_days >= 3) else
      (MX(0, net_claim_days * P('meal_periods_served') - 1) if (P('meal_periods_served') >= 2 and net_claim_days
