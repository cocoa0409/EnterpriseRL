events:
  - type: cafe_contract_opened
    target: cafe_contracts
    mutation: create
    meaning: a cafe management contract is opened for a client site and sits as a proposal awaiting countersignature
    grain: one row per cafe management contract at one client site
    fields:
      customer_id: the client organisation that will hold the contract
      variant_name: the service model the proposal is written for
      status: the contract opens in the proposed state
      site_code: the workplace site whose cafe the contract will operate
      contract_start_date: first day of the proposed term
      contract_end_date: last day of the proposed term
      headcount_served: badged employee headcount the site reports
      invoice_cycle_day: day of the month the contract will be invoiced on
      billing_contact_email: where invoices will be sent
      purchase_order_reference: the client's purchase order reference, when they use one
      subsidy_pool_balance_usd: opening subsidy funding, zero until the client funds a lot
      receivable_balance_usd: opening unsettled balance, zero on a new contract
      suspension_days_used_ytd: suspended days taken this contract year, zero on a new contract
    triggers: []
  - type: cafe_mobilization_started
    target: cafe_contracts
    mutation: {transition: {from: proposed, to: mobilizing}}
    meaning: the client countersigns and the opening project begins
    grain: one row per contract, on the day the opening project starts
    fields:
      status: the contract moves into mobilizing
    triggers:
      - event: cafe:cafe_management_fee_invoiced
        map: {charge_code: mobilization_fee}
  - type: cafe_service_commenced
    target: cafe_contracts
    mutation: {transition: {from: mobilizing, to: active}}
    meaning: the cafe opens its doors to employees for the first time
    grain: one row per contract, on its first service day
    fields:
      status: the contract moves into active
      service_commenced_date: the first service day
    triggers:
      - event: cafe:cafe_management_fee_invoiced
        map: {charge_code: management_fee}
  - type: cafe_service_suspended
    target: cafe_contracts
    mutation: {transition: {from: active, to: suspended}}
    meaning: counter service is paused at the client's instruction while the contract stands
    grain: one row per contract, on the first day of a pause
    fields:
      status: the contract moves into suspended
      suspension_start_date: first day of the pause
      suspension_days_used_ytd: running total of suspended days in the contract year
    triggers:
      - event: cafe:cafe_penalty_fee_posted
        map: {charge_code: standby_fee}
  - type: cafe_service_resumed
    target: cafe_contracts
    mutation: {transition: {from: suspended, to: active}}
    meaning: counter service starts again after a pause
    grain: one row per contract, on the day service returns
    fields:
      status: the contract moves back into active
      suspension_start_date: cleared once the pause ends
      suspension_days_used_ytd: running total of suspended days in the contract year
    triggers: []
  - type: cafe_termination_notice_filed
    target: cafe_contracts
    mutation: {transition: [{from: active, to: in_transition_out}, {from: suspended, to: in_transition_out}]}
    meaning: the client gives written notice of termination and the contract begins winding down
    grain: one row per contract, on the day notice is given
    fields:
      status: the contract moves into in_transition_out
      termination_notice_date: the day written notice was given
    triggers:
      - event: cafe:cafe_penalty_fee_posted
        map: {charge_code: early_termination_fee}
  - type: cafe_contract_closed
    target: cafe_contracts
    mutation: {transition: [{from: in_transition_out, to: closed}, {from: proposed, to: closed}]}
    meaning: the contract is closed, either after the final service day or because the proposal was withdrawn
    grain: one row per contract, on the day it closes
    fields:
      status: the contract moves into closed
      closed_date: the day the contract closed
    triggers: []
  - type: cafe_service_model_changed
    target: cafe_contracts
    mutation: update
    meaning: the client moves the cafe onto a different service model within the same contract
    grain: one row per contract, on the day a new service model takes effect
    fields:
      variant_name: the service model now in force
      service_model_change_effective_date: the day the new service model took effect
    triggers:
      - event: cafe:cafe_management_fee_invoiced
        map: {charge_code: admin_fee}
  - type: cafe_management_fee_invoiced
    target: cafe_ledger
    meaning: an invoice is raised on the contract for the management fee, the opening project fee or an administration fee
    grain: one row per invoiced charge, for one billing period, on one invoice
    distinguish_by: [charge_code, service_period, invoice_reference]
    fields:
      cafe_contract_id: the contract invoiced
      customer_id: the client invoiced
      event_type: the event family of this posting
      charge_code: which invoiced charge this is
      amount_usd: the amount invoiced
      posted_date: the day the invoice was raised
      service_period: the billing period the charge covers
      invoice_reference: the invoice this charge sits on
      payment_channel: not_applicable while nothing has been tendered
      meal_period: all_day on a fee charge that is not meal-period specific
      site_code: the site invoiced
    account: receivable
    direction: in
    triggers: []
  - type: cafe_subsidy_funding_posted
    target: cafe_ledger
    meaning: the client pays a lot of meal subsidy funding into the contract
    grain: one row per funding lot paid in
    distinguish_by: [funding_lot_reference, posted_date, amount_usd]
    fields:
      cafe_contract_id: the contract funded
      customer_id: the client funding it
      event_type: the event family of this posting
      charge_code: subsidy_funding on every row of this family
      amount_usd: the amount funded
      posted_date: the day the funding cleared
      service_period: the period the lot is opened against
      funding_lot_reference: the funding lot created
      payment_channel: how the client paid the lot in
      site_code: the site the lot funds
    account: subsidy_pool
    direction: in
    triggers: []
  - type: cafe_subsidy_drawdown_posted
    target: cafe_ledger
    meaning: an employee meal is met in part or in whole from the client's subsidy funding
    grain: one row per employee meal that draws subsidy, against one funding lot
    distinguish_by: [source_reference, funding_lot_reference, meal_period]
    fields:
      cafe_contract_id: the contract whose funding is drawn
      customer_id: the client whose funding is drawn
      event_type: the event family of this posting
      charge_code: subsidy_drawdown on every row of this family
      amount_usd: the subsidy applied to the meal
      posted_date: the day the meal was rung
      service_period: the period the drawdown falls in
      funding_lot_reference: the lot drawn against
      source_reference: the employee till transaction that drew the subsidy
      meal_period: the meal period the employee ate in
      site_code: the site the meal was served at
    account: subsidy_pool
    direction: out
    triggers: []
  - type: cafe_invoice_payment_posted
    target: cafe_ledger
    meaning: the client settles all or part of a cafe invoice
    grain: one row per payment received against one invoice
    distinguish_by: [invoice_reference, posted_date, payment_channel]
    fields:
      cafe_contract_id: the contract paid against
      customer_id: the client paying
      event_type: the event family of this posting
      charge_code: invoice_payment on every row of this family
      amount_usd: the amount received
      posted_date: the day the payment cleared
      service_period: the period of the invoice being settled
      invoice_reference: the invoice settled
      payment_channel: how the client paid
    account: receivable
    direction: out
    triggers: []
  - type: cafe_service_credit_issued
    target: cafe_ledger
    meaning: a credit is allowed against an invoice because service was not delivered as contracted
    grain: one row per credit allowed, for one meal period, against one invoice
    distinguish_by: [invoice_reference, meal_period, service_period]
    fields:
      cafe_contract_id: the contract credited
      customer_id: the client credited
      event_type: the event family of this posting
      charge_code: service_credit on every row of this family
      amount_usd: the credit allowed
      posted_date: the day the credit was allowed
      service_period: the period the credit relates to
      invoice_reference: the invoice credited
      meal_period: the meal period that was missed
      source_reference: the service credit claim the credit answers
    account: receivable
    direction: out
    triggers: []
  - type: cafe_penalty_fee_posted
    target: cafe_ledger
    meaning: a contractual charge falls due against the client for lateness, suspension, early exit or a participation shortfall
    grain: one row per charge, for one billing period, on one invoice
    distinguish_by: [charge_code, service_period, invoice_reference]
    fields:
      cafe_contract_id: the contract charged
      customer_id: the client charged
      event_type: the event family of this posting
      charge_code: which contractual charge this is
      amount_usd: the amount charged
      posted_date: the day the charge was raised
      service_period: the period the charge relates to
      invoice_reference: the invoice the charge sits on
      site_code: the site the charge relates to
    account: receivable
    direction: in
    triggers: []

measures:
  - id: cafe_msr_active_contract_count
    window: point in time, taken on the day the invoice is raised, across the client's whole cafe portfolio
    measure: count of cafe management contracts held by the same client whose status is active or suspended
  - id: cafe_msr_subsidy_drawn_mtd
    window: from the first day of the billing period named on the drawdown through the day the drawdown is posted
    measure: sum of amount_usd over cafe_subsidy_drawdown_posted rows on this contract
  - id: cafe_msr_missed_meal_periods
    window: the billing period named on the invoice the claim concerns
    measure: count of cafe_service_requests rows of request_type service_credit_claim in request_status approved for this contract and that period
  - id: cafe_msr_participation_rate
    window: the three complete billing periods preceding the one being invoiced
    measure: average number of distinct employees served per operating day divided by headcount_served, expressed as a percentage

policies:
  - id: cafe_agg_multi_holding
    subject: [cafe_contract_opened]
    rule: >
      A client may hold as many workplace cafe management contracts as it has sites, and there is no ceiling on the number held at once.
      Each contract is written against exactly one site, and every fee, subsidy lot and invoice belongs to that site's contract alone.
      A further cafe management contract is not opened for a site that already carries an open cafe management contract.
      A site's contract counts as open while it is proposed, mobilizing, active, suspended or in_transition_out, and counts as gone once it is closed, so a site whose earlier contract has closed may be reopened on a fresh contract.
      Where the client wants a second dining outlet inside a site already under contract, that outlet is added to the existing contract as a further serving station rather than opened as a second contract.
    eligibility:
      - id: one_open_contract_per_site
        applies_to: [cafe_contract_opened]
        kind: dedup
        condition: A further cafe management contract is not opened for a site that already carries an open cafe management contract.
        evidence_fields: [cafe_contracts.site_code, cafe_contracts.customer_id, cafe_contracts.status, cafe_contracts.cafe_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [cafe_contracts.customer_id, cafe_contracts.site_code]
          action_bindings:
            cafe_contracts.customer_id: customer_id
            cafe_contracts.site_code: site_code
        dedup_contract:
          table: cafe_contracts
          mode: separate_record
          object_bindings: {customer_id: customer_id, site_code: site_code}
          duplicate_filters: {status: [proposed, mobilizing, active, suspended, in_transition_out]}
          distinct_fields: [contract_start_date, variant_name]
    params: {max_per_customer: null, max_open_contracts_per_site: 1}
  - id: cafe_agg_portfolio_fee_band
    subject: [cafe_management_fee_invoiced]
    rule: >
      The management fee a client pays on each cafe contract is discounted by a portfolio band that reads the client's whole cafe portfolio rather than the single contract being invoiced.
      The band is found by counting the client's cafe contracts that stand active or suspended on the day the invoice is raised, then taking the highest ladder step whose contract count does not exceed that number; the ladder is the one printed against the service model of the contract being invoiced, so two contracts of different service models in the same portfolio take different discount percentages from the same count.
      The discount is applied to the management fee charge only; opening project fees, administration fees, contractual charges and food cost carry no portfolio discount.
      Contracts still in proposal or mobilization and contracts already closed are outside the count, and a contract in transition out is outside it as well.
      Where the portfolio count changes part way through a billing period, the count taken on the invoice day governs the whole of that invoice, and no retrospective adjustment is made to invoices already raised.
    eligibility: []
    params:
      per_tier:
        "Grab & Go Cafe Service": {portfolio_discount_ladder: "=portfolio_fee_discount_ladder", base_fee_usd: "=management_fee_monthly_usd"}
        "Limited Service Cafe": {portfolio_discount_ladder: "=portfolio_fee_discount_ladder", base_fee_usd: "=management_fee_monthly_usd"}
        "Full Service Cafe": {portfolio_discount_ladder: "=portfolio_fee_discount_ladder", base_fee_usd: "=management_fee_monthly_usd"}
        "Culinary Center Cafe": {portfolio_discount_ladder: "=portfolio_fee_discount_ladder", base_fee_usd: "=management_fee_monthly_usd"}
        "Executive Dining Service": {portfolio_discount_ladder: "=portfolio_fee_discount_ladder", base_fee_usd: "=management_fee_monthly_usd"}
        "Campus Dining Commons Service": {portfolio_discount_ladder: "=portfolio_fee_discount_ladder", base_fee_usd: "=management_fee_monthly_usd"}
    measures: [cafe_msr_active_contract_count]
  - id: cafe_mobilization_terms
    subject: [cafe_contract_opened, cafe_mobilization_started, cafe_service_commenced]
    rule: >
      A cafe management contract is opened as a proposal, moves into mobilization on countersignature, and only opens to employees once the opening project is complete.
      The opening project fee, the refundable equipment deposit and the opening inventory investment are those printed against the service model proposed, and the opening project fee is invoiced when mobilization starts rather than at commencement.
      Service may not commence earlier than the mobilisation lead time for the service model, counted in calendar days from the day the client countersigns the cafe management contract.
      Calendar days are counted from the day after countersignature, every day of the week counts, and the boundary day itself is a permitted commencement day; calendar days are never converted into full 24-hour periods.
      A contract may only be worked on for mobilization while it stands in proposed, mobilizing or active, and a proposal that is withdrawn before countersignature closes without any opening project fee falling due.
      Where the client asks to open earlier than the lead time allows, the opening is not accelerated; the request is declined and the earliest permitted commencement day is offered instead.
      Where the entry gate for the proposed service model is not met by the site's reported headcount or annual food spend, the proposal is written for the highest service model whose entry gate the site does meet.
    eligibility:
      - id: mobilization_state
        applies_to: [cafe_contract_opened, cafe_mobilization_started, cafe_service_commenced]
        kind: state
        condition: A contract may only be worked on for mobilization while it stands in proposed, mobilizing or active, and a proposal that is withdrawn before countersignature closes without any opening project fee falling due.
        evidence_fields: [cafe_contracts.status, cafe_contracts.cafe_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [cafe_contracts.cafe_contract_id]
          action_bindings:
            cafe_contracts.cafe_contract_id: cafe_contract_id
        state_contract:
          field: cafe_contracts.status
          allowed: [proposed, mobilizing, active]
      - id: mobilization_lead_time
        applies_to: [cafe_service_commenced]
        kind: time
        condition: Service may not commence earlier than the mobilisation lead time for the service model, counted in calendar days from the day the client countersigns the cafe management contract.
        evidence_fields: [cafe_contracts.contract_start_date, cafe_contracts.status, cafe_contracts.cafe_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [cafe_contracts.cafe_contract_id]
          action_bindings:
            cafe_contracts.cafe_contract_id: cafe_contract_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the day the client countersigns the cafe management contract
          anchor_source: cafe_contracts.contract_start_date
          relation: not_before
          duration_source: variants.mobilization_lead_days
          unit: calendar_days
          counting_rule: Calendar days are counted from the day after countersignature, every day of the week counts, and the boundary day itself is a permitted commencement day; calendar days are never converted into full 24-hour periods.
          boundary: inclusive
    params:
      per_tier:
        "Grab & Go Cafe Service": {lead_days: "=mobilization_lead_days", opening_fee_usd: "=mobilization_fee_usd", deposit_usd: "=equipment_deposit_usd", opening_inventory_usd: "=opening_inventory_usd"}
        "Limited Service Cafe": {lead_days: "=mobilization_lead_days", opening_fee_usd: "=mobilization_fee_usd", deposit_usd: "=equipment_deposit_usd", opening_inventory_usd: "=opening_inventory_usd"}
        "Full Service Cafe": {lead_days: "=mobilization_lead_days", opening_fee_usd: "=mobilization_fee_usd", deposit_usd: "=equipment_deposit_usd", opening_inventory_usd: "=opening_inventory_usd"}
        "Culinary Center Cafe": {lead_days: "=mobilization_lead_days", opening_fee_usd: "=mobilization_fee_usd", deposit_usd: "=equipment_deposit_usd", opening_inventory_usd: "=opening_inventory_usd"}
        "Executive Dining Service": {lead_days: "=mobilization_lead_days", opening_fee_usd: "=mobilization_fee_usd", deposit_usd: "=equipment_deposit_usd", opening_inventory_usd: "=opening_inventory_usd"}
        "Campus Dining Commons Service": {lead_days: "=mobilization_lead_days", opening_fee_usd: "=mobilization_fee_usd", deposit_usd: "=equipment_deposit_usd", opening_inventory_usd: "=opening_inventory_usd"}
  - id: cafe_management_fee_calc
    subject: [cafe_management_fee_invoiced]
    rule: >
      Each billing period the contract is invoiced for the management fee printed against the service model in force on the invoice day, reduced by the portfolio discount percentage the client's portfolio band yields, and rounded to the nearest cent.
      Where the service model changed part way through a billing period, the fee for that period is the fee of the model in force on the invoice day and no proration is carried out between the two models.
      The annual escalation is applied to the management fee on the first invoice raised on or after each anniversary of the contract start date, and never mid-year.
      A management fee is only invoiced while the contract stands in mobilizing, active, suspended or in_transition_out; on a suspended contract the standby charge replaces the management fee for that period and the management fee is not raised at all.
      On a cost_plus or fixed_fee basis the administration fee is charged on invoiced food cost in addition to the management fee, and on a profit_and_loss basis no administration fee is charged.
    eligibility:
      - id: invoiceable_state
        applies_to: [cafe_management_fee_invoiced]
        kind: state
        condition: A management fee is only invoiced while the contract stands in mobilizing, active, suspended or in_transition_out; on a suspended contract the standby charge replaces the management fee for that period and the management fee is not raised at all.
        evidence_fields: [cafe_contracts.status, cafe_contracts.cafe_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [cafe_contracts.cafe_contract_id]
          action_bindings:
            cafe_contracts.cafe_contract_id: cafe_contract_id
        state_contract:
          field: cafe_contracts.status
          allowed: [mobilizing, active, suspended, in_transition_out]
    params:
      per_tier:
        "Grab & Go Cafe Service": {monthly_fee_usd: "=management_fee_monthly_usd", escalation_pct: "=annual_price_escalation_pct", admin_fee_pct: "=admin_fee_pct_of_food_cost", fee_basis: "=management_fee_basis"}
        "Limited Service Cafe": {monthly_fee_usd: "=management_fee_monthly_usd", escalation_pct: "=annual_price_escalation_pct", admin_fee_pct: "=admin_fee_pct_of_food_cost", fee_basis: "=management_fee_basis"}
        "Full Service Cafe": {monthly_fee_usd: "=management_fee_monthly_usd", escalation_pct: "=annual_price_escalation_pct", admin_fee_pct: "=admin_fee_pct_of_food_cost", fee_basis: "=management_fee_basis"}
        "Culinary Center Cafe": {monthly_fee_usd: "=management_fee_monthly_usd", escalation_pct: "=annual_price_escalation_pct", admin_fee_pct: "=admin_fee_pct_of_food_cost", fee_basis: "=management_fee_basis"}
        "Executive Dining Service": {monthly_fee_usd: "=management_fee_monthly_usd", escalation_pct: "=annual_price_escalation_pct", admin_fee_pct: "=admin_fee_pct_of_food_cost", fee_basis: "=management_fee_basis"}
        "Campus Dining Commons Service": {monthly_fee_usd: "=management_fee_monthly_usd", escalation_pct: "=annual_price_escalation_pct", admin_fee_pct: "=admin_fee_pct_of_food_cost", fee_basis: "=management_fee_basis"}
    formula:
      base_fee_usd: management_fee_monthly_usd
      portfolio_discount_usd: round(management_fee_monthly_usd * portfolio_discount_ladder / 100, 2)
      amount_usd: round(base_fee_usd - portfolio_discount_usd, 2)
  - id: cafe_subsidy_funding_terms
    subject: [cafe_subsidy_funding_posted]
    rule: >
      Client meal subsidy is funded in advance in lots, and each lot is recorded against the contract with its own funding lot reference so that drawdowns can be traced back to the money that paid for them.
      A lot may not be smaller than the minimum funding lot printed against the service model, and a client wishing to fund less is asked to combine the amount into the next scheduled lot instead.
      A lot stays drawable for the number of months printed against the service model, counted from the day the funding cleared, and lapses at the end of that period.
      When a lot lapses, the rollover percentage printed against the service model is carried into the client's next lot and the remainder is written off in the client's favour on the following invoice.
      Funding is only accepted onto a contract that stands in mobilizing, active or suspended, since a proposal has no cafe to spend it at and a contract in transition out is being settled rather than funded.
      The client's annual subsidy commitment is measured against the sum of lots funded in the contract year, and a shortfall against that commitment is settled on the final invoice of the contract year rather than charged lot by lot.
    eligibility:
      - id: fundable_state
        applies_to: [cafe_subsidy_funding_posted]
        kind: state
        condition: Funding is only accepted onto a contract that stands in mobilizing, active or suspended, since a proposal has no cafe to spend it at and a contract in transition out is being settled rather than funded.
        evidence_fields: [cafe_contracts.status, cafe_contracts.cafe_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [cafe_contracts.cafe_contract_id]
          action_bindings:
            cafe_contracts.cafe_contract_id: cafe_contract_id
        state_contract:
          field: cafe_contracts.status
          allowed: [mobilizing, active, suspended]
    params:
      per_tier:
        "Grab & Go Cafe Service": {min_lot_usd: "=subsidy_funding_minimum_usd", lot_expiry_months: "=subsidy_funding_lot_expiry_months", rollover_pct: "=subsidy_unused_rollover_pct", annual_commitment_usd: "=min_annual_client_subsidy_usd"}
        "Limited Service Cafe": {min_lot_usd: "=subsidy_funding_minimum_usd", lot_expiry_months: "=subsidy_funding_lot_expiry_months", rollover_pct: "=subsidy_unused_rollover_pct", annual_commitment_usd: "=min_annual_client_subsidy_usd"}
        "Full Service Cafe": {min_lot_usd: "=subsidy_funding_minimum_usd", lot_expiry_months: "=subsidy_funding_lot_expiry_months", rollover_pct: "=subsidy_unused_rollover_pct", annual_commitment_usd: "=min_annual_client_subsidy_usd"}
        "Culinary Center Cafe": {min_lot_usd: "=subsidy_funding_minimum_usd", lot_expiry_months: "=subsidy_funding_lot_expiry_months", rollover_pct: "=subsidy_unused_rollover_pct", annual_commitment_usd: "=min_annual_client_subsidy_usd"}
        "Executive Dining Service": {min_lot_usd: "=subsidy_funding_minimum_usd", lot_expiry_months: "=subsidy_funding_lot_expiry_months", rollover_pct: "=subsidy_unused_rollover_pct", annual_commitment_usd: "=min_annual_client_subsidy_usd"}
        "Campus Dining Commons Service": {min_lot_usd: "=subsidy_funding_minimum_usd", lot_expiry_months: "=subsidy_funding_lot_expiry_months", rollover_pct: "=subsidy_unused_rollover_pct", annual_commitment_usd: "=min_annual_client_subsidy_usd"}
  - id: cafe_subsidy_drawdown_order
    subject: [cafe_subsidy_drawdown_posted]
    rule: >
      When an employee meal draws on client subsidy, the subsidy is calculated from the subsidy model printed against the service model in force: a percent_discount model meets the stated percentage of the menu price, a fixed_per_meal model meets a flat amount per meal, a full model meets the whole menu price, and a model of none draws nothing at all.
      Whatever the model yields is then held to the daily ceiling printed against the service model, measured as the total subsidy already drawn for that employee on that service day plus the subsidy this meal would draw; the excess above the ceiling is left with the employee to pay.
      Drawdowns are taken from funding lots in order of the day the lot was funded, oldest lot first, and a meal that exhausts one lot takes the remainder from the next lot in that order, producing one drawdown row per lot touched.
      Where no drawable funding remains on the contract, no drawdown is posted, the employee pays the full menu price, and the shortfall is reported to the client on the next invoice rather than carried as a negative pool.
      Every drawdown row carries the employee till transaction that caused it, so that a reversal of that till transaction can be matched back to the exact drawdown to be reversed.
    eligibility:
      - id: drawable_state
        applies_to: [cafe_subsidy_drawdown_posted]
        kind: state
        condition: Drawdowns are taken from funding lots in order of the day the lot was funded, oldest lot first, and a meal that exhausts one lot takes the remainder from the next lot in that order, producing one drawdown row per lot touched.
        evidence_fields: [cafe_contracts.status, cafe_contracts.subsidy_pool_balance_usd, cafe_contracts.cafe_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [cafe_contracts.cafe_contract_id]
          action_bindings:
            cafe_contracts.cafe_contract_id: cafe_contract_id
        state_contract:
          field: cafe_contracts.status
          allowed: [active, suspended, in_transition_out]
    params:
      per_tier:
        "Grab & Go Cafe Service": {model: "=subsidy_model", pct_of_menu_price: "=subsidy_pct_of_menu_price", daily_cap_usd: "=subsidy_cap_per_employee_per_day_usd"}
        "Limited Service Cafe": {model: "=subsidy_model", pct_of_menu_price: "=subsidy_pct_of_menu_price", daily_cap_usd: "=subsidy_cap_per_employee_per_day_usd"}
        "Full Service Cafe": {model: "=subsidy_model", pct_of_menu_price: "=subsidy_pct_of_menu_price", daily_cap_usd: "=subsidy_cap_per_employee_per_day_usd"}
        "Culinary Center Cafe": {model: "=subsidy_model", pct_of_menu_price: "=subsidy_pct_of_menu_price", daily_cap_usd: "=subsidy_cap_per_employee_per_day_usd"}
        "Executive Dining Service": {model: "=subsidy_model", pct_of_menu_price: "=subsidy_pct_of_menu_price", daily_cap_usd: "=subsidy_cap_per_employee_per_day_usd"}
        "Campus Dining Commons Service": {model: "=subsidy_model", pct_of_menu_price: "=subsidy_pct_of_menu_price", daily_cap_usd: "=subsidy_cap_per_employee_per_day_usd"}
    measures: [cafe_msr_subsidy_drawn_mtd]
  - id: cafe_service_suspension_terms
    subject: [cafe_service_suspended, cafe_service_resumed]
    rule: >
      A client may pause counter service without ending the contract, for a building closure, a floor move or a seasonal shutdown.
      A pause is only taken on a contract that stands active or suspended, and a pause shorter than the minimum suspension printed against the service model is handled as ordinary closed days rather than as a suspension.
      For each month or part month of pause the standby charge is raised, calculated as the standby percentage printed against the service model applied to the monthly management fee, and the management fee itself is not raised for the same period.
      Suspended days accumulate against the contract year ceiling printed against the service model; once the ceiling is reached the pause is not extended further and the client is asked either to resume service or to give notice of termination.
      Resumption needs the notice printed against the service model, counted in calendar days, and the resumption day is the first day the standby charge stops accruing.
      Where the client asks to resume sooner than the resumption notice allows, the cafe reopens on the earliest day the notice permits and the standby charge runs to that day.
    eligibility:
      - id: suspension_state
        applies_to: [cafe_service_suspended, cafe_service_resumed]
        kind: state
        condition: A pause is only taken on a contract that stands active or suspended, and a pause shorter than the minimum suspension printed against the service model is handled as ordinary closed days rather than as a suspension.
        evidence_fields: [cafe_contracts.status, cafe_contracts.suspension_days_used_ytd, cafe_contracts.cafe_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [cafe_contracts.cafe_contract_id]
          action_bindings:
            cafe_contracts.cafe_contract_id: cafe_contract_id
        state_contract:
          field: cafe_contracts.status
          allowed: [active, suspended]
    params:
      per_tier:
        "Grab & Go Cafe Service": {standby_pct: "=standby_fee_pct_of_management_fee", min_days: "=min_suspension_days", annual_cap_days: "=max_suspension_days_per_contract_year", resume_notice_days: "=resumption_lead_days"}
        "Limited Service Cafe": {standby_pct: "=standby_fee_pct_of_management_fee", min_days: "=min_suspension_days", annual_cap_days: "=max_suspension_days_per_contract_year", resume_notice_days: "=resumption_lead_days"}
        "Full Service Cafe": {standby_pct: "=standby_fee_pct_of_management_fee", min_days: "=min_suspension_days", annual_cap_days: "=max_suspension_days_per_contract_year", resume_notice_days: "=resumption_lead_days"}
        "Culinary Center Cafe": {standby_pct: "=standby_fee_pct_of_management_fee", min_days: "=min_suspension_days", annual_cap_days: "=max_suspension_days_per_contract_year", resume_notice_days: "=resumption_lead_days"}
        "Executive Dining Service": {standby_pct: "=standby_fee_pct_of_management_fee", min_days: "=min_suspension_days", annual_cap_days: "=max_suspension_days_per_contract_year", resume_notice_days: "=resumption_lead_days"}
        "Campus Dining Commons Service": {standby_pct: "=standby_fee_pct_of_management_fee", min_days: "=min_suspension_days", annual_cap_days: "=max_suspension_days_per_contract_year", resume_notice_days: "=resumption_lead_days"}
  - id: cafe_termination_terms
    subject: [cafe_termination_notice_filed, cafe_contract_closed]
    rule: >
      Only the client may terminate a cafe management contract, and termination begins with written notice from the client rather than with anything the desk does on their behalf.
      Notice is handled on a contract that stands active, suspended or already in transition out, and never on one that is still proposed, still mobilizing or already closed; the desk records the request as a termination notice for the client to confirm.
      A closure may not be dated earlier than the service model's termination notice period, counted in calendar days from the day the client gives written notice of termination.
      Notice days are counted as calendar days beginning the day after written notice is given, weekends and public holidays included, and where the resulting day falls on a date the month does not contain, the last day of that month is used instead.
      Where the closure day falls before the end of the contracted term, the early exit charge is the number of monthly management fees printed against the service model, calculated on the fee in force on the notice day.
      Where the closure day falls on or after the end of the contracted term and the renewal notice was exchanged in time, no early exit charge falls due.
      On closure the equipment deposit is returned net of any charge outstanding, drawable subsidy funding left on the contract is refunded to the client, and the final invoice settles the balance in one document.
      A proposal that never reached countersignature closes without notice, without an early exit charge and without a final invoice.
    eligibility:
      - id: notice_state
        applies_to: [cafe_termination_notice_filed]
        kind: state
        condition: Notice is handled on a contract that stands active, suspended or already in transition out, and never on one that is still proposed, still mobilizing or already closed; the desk records the request as a termination notice for the client to confirm.
        evidence_fields: [cafe_contracts.status, cafe_contracts.cafe_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [cafe_contracts.cafe_contract_id]
          action_bindings:
            cafe_contracts.cafe_contract_id: cafe_contract_id
        state_contract:
          field: cafe_contracts.status
          allowed: [active, suspended, in_transition_out]
      - id: notice_period
        applies_to: [cafe_contract_closed]
        kind: time
        condition: A closure may not be dated earlier than the service model's termination notice period, counted in calendar days from the day the client gives written notice of termination.
        evidence_fields: [cafe_contracts.termination_notice_date, cafe_contracts.status, cafe_contracts.cafe_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [cafe_contracts.cafe_contract_id]
          action_bindings:
            cafe_contracts.cafe_contract_id: cafe_contract_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the day the client gives written notice of termination
          anchor_source: cafe_contracts.termination_notice_date
          relation: not_before
          duration_source: variants.termination_notice_days
          unit: calendar_days
          counting_rule: Notice days are counted as calendar days beginning the day after written notice is given, weekends and public holidays included, and where the resulting day falls on a date the month does not contain, the last day of that month is used instead.
          boundary: inclusive
    params:
      per_tier:
        "Grab & Go Cafe Service": {notice_days: "=termination_notice_days", early_exit_months: "=early_termination_fee_months_of_fee", renewal_notice_days: "=renewal_notice_days", term_months: "=contract_term_months"}
        "Limited Service Cafe": {notice_days: "=termination_notice_days", early_exit_months: "=early_termination_fee_months_of_fee", renewal_notice_days: "=renewal_notice_days", term_months: "=contract_term_months"}
        "Full Service Cafe": {notice_days: "=termination_notice_days", early_exit_months: "=early_termination_fee_months_of_fee", renewal_notice_days: "=renewal_notice_days", term_months: "=contract_term_months"}
        "Culinary Center Cafe": {notice_days: "=termination_notice_days", early_exit_months: "=early_termination_fee_months_of_fee", renewal_notice_days: "=renewal_notice_days", term_months: "=contract_term_months"}
        "Executive Dining Service": {notice_days: "=termination_notice_days", early_exit_months: "=early_termination_fee_months_of_fee", renewal_notice_days: "=renewal_notice_days", term_months: "=contract_term_months"}
        "Campus Dining Commons Service": {notice_days: "=termination_notice_days", early_exit_months: "=early_termination_fee_months_of_fee", renewal_notice_days: "=renewal_notice_days", term_months: "=contract_term_months"}
  - id: cafe_service_model_change
    subject: [cafe_service_model_changed]
    rule: >
      A client may move an existing cafe onto a different service model without closing the contract, provided the site meets the entry gate of the model it is moving to.
      The change takes effect no sooner than the change notice printed against the service model being left, counted in calendar days from the day the client asks for the change, and the administration fee printed against the model being moved to is invoiced in the period the change takes effect.
      A move to a lower ranked service model is only accepted once the cooldown printed against the model in force has passed since the last change of service model on this contract.
      A move to a higher ranked service model carries no cooldown, but the opening project fee difference between the two models is invoiced alongside the administration fee where the higher model needs kitchen works.
      From the effective day the whole parameter column of the new service model applies — fee, subsidy model, daily ceiling, notice periods, credits and guarantees together — and no parameter of the old model survives the change.
      Where the site does not meet the entry gate of the model asked for, the change is declined and the highest model whose entry gate the site meets is offered instead.
    eligibility:
      - id: change_state
        applies_to: [cafe_service_model_changed]
        kind: state
        condition: A client may move an existing cafe onto a different service model without closing the contract, provided the site meets the entry gate of the model it is moving to.
        evidence_fields: [cafe_contracts.status, cafe_contracts.variant_name, cafe_contracts.headcount_served, cafe_contracts.cafe_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [cafe_contracts.cafe_contract_id]
          action_bindings:
            cafe_contracts.cafe_contract_id: cafe_contract_id
        state_contract:
          field: cafe_contracts.status
          allowed: [active, suspended]
    params:
      per_tier:
        "Grab & Go Cafe Service": {change_lead_days: "=service_model_change_lead_days", cooldown_months: "=downgrade_cooldown_months", change_fee_usd: "=service_model_change_fee_usd"}
        "Limited Service Cafe": {change_lead_days: "=service_model_change_lead_days", cooldown_months: "=downgrade_cooldown_months", change_fee_usd: "=service_model_change_fee_usd"}
        "Full Service Cafe": {change_lead_days: "=service_model_change_lead_days", cooldown_months: "=downgrade_cooldown_months", change_fee_usd: "=service_model_change_fee_usd"}
        "Culinary Center Cafe": {change_lead_days: "=service_model_change_lead_days", cooldown_months: "=downgrade_cooldown_months", change_fee_usd: "=service_model_change_fee_usd"}
        "Executive Dining Service": {change_lead_days: "=service_model_change_lead_days", cooldown_months: "=downgrade_cooldown_months", change_fee_usd: "=service_model_change_fee_usd"}
        "Campus Dining Commons Service": {change_lead_days: "=service_model_change_lead_days", cooldown_months: "=downgrade_cooldown_months", change_fee_usd: "=service_model_change_fee_usd"}
  - id: cafe_invoice_payment_terms
    subject: [cafe_invoice_payment_posted, cafe_penalty_fee_posted]
    rule: >
      Cafe invoices fall due the number of days after the invoice date printed against the service model, and a payment is recorded against the single invoice it settles rather than against the contract as a whole.
      A payment smaller than the invoiced amount settles that invoice in part, leaves the remainder outstanding on the same invoice, and never spills over onto another invoice.
      A payment larger than the invoiced amount settles that invoice and leaves the excess on the contract as a credit applied to the next invoice raised.
      A late charge may only be raised once the grace days printed against the service model have passed beyond the due date, and it is the monthly late percentage applied to the amount still outstanding, held to the late charge ceiling printed against the service model.
      A late charge is only raised while the contract stands in mobilizing, active, suspended or in_transition_out, and never on a closed contract, where the balance is pursued as a closed account instead.
      Only one late charge is raised per invoice per month, and where an invoice is disputed in writing before the grace days expire, no late charge is raised while the dispute stands open.
      Once an invoice is past due by the credit hold threshold printed against the service model, no further ordering or funding is accepted on the contract until the balance is settled.
    eligibility:
      - id: chargeable_state
        applies_to: [cafe_invoice_payment_posted, cafe_penalty_fee_posted]
        kind: state
        condition: A late charge is only raised while the contract stands in mobilizing, active, suspended or in_transition_out, and never on a closed contract, where the balance is pursued as a closed account instead.
        evidence_fields: [cafe_contracts.status, cafe_contracts.receivable_balance_usd, cafe_contracts.cafe_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [cafe_contracts.cafe_contract_id]
          action_bindings:
            cafe_contracts.cafe_contract_id: cafe_contract_id
        state_contract:
          field: cafe_contracts.status
          allowed: [mobilizing, active, suspended, in_transition_out]
    params:
      per_tier:
        "Grab & Go Cafe Service": {terms_days: "=payment_terms_days", grace_days: "=late_fee_grace_days", late_pct: "=late_fee_monthly_pct", late_cap_usd: "=late_fee_cap_usd", hold_days: "=credit_hold_threshold_days_past_due"}
        "Limited Service Cafe": {terms_days: "=payment_terms_days", grace_days: "=late_fee_grace_days", late_pct: "=late_fee_monthly_pct", late_cap_usd: "=late_fee_cap_usd", hold_days: "=credit_hold_threshold_days_past_due"}
        "Full Service Cafe": {terms_days: "=payment_terms_days", grace_days: "=late_fee_grace_days", late_pct: "=late_fee_monthly_pct", late_cap_usd: "=late_fee_cap_usd", hold_days: "=credit_hold_threshold_days_past_due"}
        "Culinary Center Cafe": {terms_days: "=payment_terms_days", grace_days: "=late_fee_grace_days", late_pct: "=late_fee_monthly_pct", late_cap_usd: "=late_fee_cap_usd", hold_days: "=credit_hold_threshold_days_past_due"}
        "Executive Dining Service": {terms_days: "=payment_terms_days", grace_days: "=late_fee_grace_days", late_pct: "=late_fee_monthly_pct", late_cap_usd: "=late_fee_cap_usd", hold_days: "=credit_hold_threshold_days_past_due"}
        "Campus Dining Commons Service": {terms_days: "=payment_terms_days", grace_days: "=late_fee_grace_days", late_pct: "=late_fee_monthly_pct", late_cap_usd: "=late_fee_cap_usd", hold_days: "=credit_hold_threshold_days_past_due"}
    formula:
      late_fee_usd: min(round(receivable_balance_usd * late_fee_monthly_pct / 100, 2), late_fee_cap_usd)
  - id: cafe_service_credit_terms
    subject: [cafe_service_credit_issued]
    rule: >
      Where a contracted meal period was not served, the client is credited for it, and the credit is allowed against the invoice that charged for the period rather than paid out.
      Each missed meal period earns the percentage of the monthly management fee printed against the service model, and the credits allowed in one billing period are held to the ceiling printed against the same service model.
      A service credit is allowed only when the claim reaches Larkspur Table no later than the claim window for the service model, counted in calendar days from the day the invoice covering the missed meal period was posted.
      Claim window days are counted as calendar days from the day after the invoice posting day, every day of the week counts, and a claim arriving on the boundary day itself is still in time.
      Whether a meal period was missed is settled from the approved service credit claims on the contract for that period, and not from the client's recollection of which days the cafe was shut.
      A meal period missed because the client closed the building, moved the floor or asked for the pause is not a missed meal period for this purpose, and earns no credit.
      Where the credits that would be due exceed the billing period ceiling, the ceiling is allowed and the balance of the claim is closed rather than carried into the next period.
    eligibility:
      - id: claim_window
        applies_to: [cafe_service_credit_issued]
        kind: time
        condition: A service credit is allowed only when the claim reaches Larkspur Table no later than the claim window for the service model, counted in calendar days from the day the invoice covering the missed meal period was posted.
        evidence_fields: [cafe_ledger.posted_date, cafe_ledger.invoice_reference, cafe_ledger.cafe_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [cafe_ledger.invoice_reference]
          action_bindings:
            cafe_ledger.invoice_reference: invoice_reference
        temporal_basis:
          clock: frozen_time
          anchor_event: the day the invoice covering the missed meal period was posted
          anchor_source: cafe_ledger.posted_date
          relation: not_after
          duration_source: variants.service_credit_claim_window_days
          unit: calendar_days
          counting_rule: Claim window days are counted as calendar days from the day after the invoice posting day, every day of the week counts, and a claim arriving on the boundary day itself is still in time.
          boundary: inclusive
    params:
      per_tier:
        "Grab & Go Cafe Service": {credit_pct_per_period: "=service_credit_pct_per_missed_meal_period", period_cap_pct: "=service_credit_cap_pct_of_monthly_fee", claim_window_days: "=service_credit_claim_window_days"}
        "Limited Service Cafe": {credit_pct_per_period: "=service_credit_pct_per_missed_meal_period", period_cap_pct: "=service_credit_cap_pct_of_monthly_fee", claim_window_days: "=service_credit_claim_window_days"}
        "Full Service Cafe": {credit_pct_per_period: "=service_credit_pct_per_missed_meal_period", period_cap_pct: "=service_credit_cap_pct_of_monthly_fee", claim_window_days: "=service_credit_claim_window_days"}
        "Culinary Center Cafe": {credit_pct_per_period: "=service_credit_pct_per_missed_meal_period", period_cap_pct: "=service_credit_cap_pct_of_monthly_fee", claim_window_days: "=service_credit_claim_window_days"}
        "Executive Dining Service": {credit_pct_per_period: "=service_credit_pct_per_missed_meal_period", period_cap_pct: "=service_credit_cap_pct_of_monthly_fee", claim_window_days: "=service_credit_claim_window_days"}
        "Campus Dining Commons Service": {credit_pct_per_period: "=service_credit_pct_per_missed_meal_period", period_cap_pct: "=service_credit_cap_pct_of_monthly_fee", claim_window_days: "=service_credit_claim_window_days"}
    formula:
      uncapped_credit_usd: round(management_fee_monthly_usd * service_credit_pct_per_missed_meal_period * cafe_msr_missed_meal_periods / 100, 2)
      period_ceiling_usd: round(management_fee_monthly_usd * service_credit_cap_pct_of_monthly_fee / 100, 2)
      amount_usd: min(uncapped_credit_usd, period_ceiling_usd)
    measures: [cafe_msr_missed_meal_periods]
  - id: cafe_participation_guarantee
    subject: [cafe_penalty_fee_posted]
    rule: >
      Service models above the unsubsidised entry model are written against a participation guarantee, the share of the site's reported headcount the client undertakes will eat at the cafe.
      Participation is measured over the three complete billing periods before the one being invoiced, as the average number of distinct employees served per operating day against the reported headcount, and a period in which service was suspended is left out of the average altogether.
      Where measured participation falls below the guarantee printed against the service model, a shortfall charge is raised for each whole percentage point below it, at the rate printed against the same service model, and part points are not charged.
      A shortfall charge is only raised while the contract stands active, suspended or in transition out, and it is never raised in the first three billing periods of a contract because the measurement window is not yet complete.
      Where the service model carries no participation guarantee, no shortfall charge is ever raised however few employees eat at the cafe.
      Where the client's own headcount report has fallen since the contract was written, the guarantee is measured against the reported headcount in force on the invoice day rather than the headcount at signature.
    eligibility:
      - id: shortfall_state
        applies_to: [cafe_penalty_fee_posted]
        kind: state
        condition: A shortfall charge is only raised while the contract stands active, suspended or in transition out, and it is never raised in the first three billing periods of a contract because the measurement window is not yet complete.
        evidence_fields: [cafe_contracts.status, cafe_contracts.headcount_served, cafe_contracts.service_commenced_date, cafe_contracts.cafe_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [cafe_contracts.cafe_contract_id]
          action_bindings:
            cafe_contracts.cafe_contract_id: cafe_contract_id
        state_contract:
          field: cafe_contracts.status
          allowed: [active, suspended, in_transition_out]
    params:
      per_tier:
        "Grab & Go Cafe Service": {guarantee_pct: "=participation_guarantee_pct", fee_per_point_usd: "=participation_shortfall_fee_per_point_usd"}
        "Limited Service Cafe": {guarantee_pct: "=participation_guarantee_pct", fee_per_point_usd: "=participation_shortfall_fee_per_point_usd"}
        "Full Service Cafe": {guarantee_pct: "=participation_guarantee_pct", fee_per_point_usd: "=participation_shortfall_fee_per_point_usd"}
        "Culinary Center Cafe": {guarantee_pct: "=participation_guarantee_pct", fee_per_point_usd: "=participation_shortfall_fee_per_point_usd"}
        "Executive Dining Service": {guarantee_pct: "=participation_guarantee_pct", fee_per_point_usd: "=participation_shortfall_fee_per_point_usd"}
        "Campus Dining Commons Service": {guarantee_pct: "=participation_guarantee_pct", fee_per_point_usd: "=participation_shortfall_fee_per_point_usd"}
    formula:
      shortfall_points: max(0, participation_guarantee_pct - cafe_msr_participation_rate)
      amount_usd: round(shortfall_points * participation_shortfall_fee_per_point_usd, 2)
    measures: [cafe_msr_participation_rate]
  - id: cafe_combination_pantry_interaction
    subject: [cafe_management_fee_invoiced, cafe_subsidy_funding_posted]
    rule: >
      Holding an office pantry programme at the same site as a cafe management contract changes what the cafe contract charges and what it will accept.
      Where the same client holds an active pantry programme at the site named on the cafe contract, the cafe administration fee is not charged on invoiced food cost for that site, because the pantry programme already carries a delivery and handling charge for the same kitchen.
      Where the same client holds an active micro market at the site named on the cafe contract, subsidy funding paid into the cafe contract may be drawn at the market kiosk as well as at the cafe counter, and the daily ceiling printed against the cafe service model then covers both outlets together rather than each separately.
      A cafe contract and an executive dining service at the same site are mutually exclusive: a site already holding an Executive Dining Service contract does not take a second cafe contract of any service model, and the additional floor is served as a further station on the executive contract.
      Where the pantry or market programme at the site closes, the exemptions it carried stop with the next invoice raised and are not clawed back on invoices already issued.
    eligibility: []
    params:
      per_tier:
        "Grab & Go Cafe Service": {admin_fee_waived_with_pantry: true, shared_daily_cap_with_market: true}
        "Limited Service Cafe": {admin_fee_waived_with_pantry: true, shared_daily_cap_with_market: true}
        "Full Service Cafe": {admin_fee_waived_with_pantry: true, shared_daily_cap_with_market: true}
        "Culinary Center Cafe": {admin_fee_waived_with_pantry: true, shared_daily_cap_with_market: true}
        "Executive Dining Service": {admin_fee_waived_with_pantry: false, shared_daily_cap_with_market: false}
        "Campus Dining Commons Service": {admin_fee_waived_with_pantry: true, shared_daily_cap_with_market: true}

extended_policies:
- id: cafe_ext_model_change_confirmation
  base_policy_refs:
  - cafe_service_model_change
  overwrite:
  - base_policy: cafe_service_model_change
    superseded_clause: >-
      The change takes effect no sooner than the change notice printed against the service model being left, counted
      in calendar days from the day the client asks for the change, and the administration fee printed against the
      model being moved to is invoiced in the period the change takes effect.
    replaced_by: >-
      The change administration fee the contract carries is the change administration fee printed against the service
      model the contract is moving from.
  - base_policy: cafe_service_model_change
    superseded_clause: >-
      A move to a higher ranked service model carries no cooldown, but the opening project fee difference between
      the two models is invoiced alongside the administration fee where the higher model needs kitchen works.
    replaced_by: >-
      Where the opening project fee already invoiced on the contract falls below the opening project fee printed
      against the service model the contract is moving from and the cafe has been serving for more than twenty-four
      months, the whole difference between the two, rounded to the nearest cent, is settled with the change; where
      the opening project fee already invoiced falls below the opening project fee printed against the service model
      the contract is moving from and the cafe has been serving for twenty-four months or less, half that difference,
      rounded to the nearest cent, is settled with the change; and where the opening project fee already invoiced
      is not below the opening project fee printed against the service model the contract is moving from, nothing
      is settled for opening project works.
  trigger: state_due
  subject:
  - cafe_service_model_changed
  computes: change_admin_fee_usd
  target_tool: confirm_service_model_change_fa28a84a
  params:
    repeat_change_admin_fee_usd: 2450.0
    settled_change_admin_fee_usd: 1180.0
    exposed_account_threshold_usd: 8000.0
    exposed_account_loading_pct: 15.0
    watched_account_loading_pct: 7.5
    clear_account_loading_pct: 0.0
    large_site_headcount: 400
  rule: >-
    A change of service model that the client has already approved is put into force on the day the client confirms
    it, and the contract carries one administration charge for that change. Every parameter this charge is worked
    out from is the one printed against the service model the contract is moving from, that is the service model
    recorded on the contract immediately before the change is put into force, and no parameter of the service model
    being moved to enters it. The charge worked out under this rule prices a change of service model that the contract
    is permitted to make, and decides nothing about whether a change is accepted. The charge is recorded against
    the billing period in which the client confirms the change. The change administration fee the contract carries
    is the change administration fee printed against the service model the contract is moving from. Nothing is settled
    for opening project works, no short notice charge is made, and the clear account loading is applied. The change
    administration fee the contract carries, the opening project settlement and the short notice charge are added
    together first, and the loading is then applied once to that total; the figure the loading leaves is rounded
    to the nearest cent. A contract whose record already shows a change of service model that took effect less than
    twelve months before the day the client confirms carries the repeat change administration fee in place of the
    printed change administration fee; a contract whose record shows a change of service model that took effect
    twelve months or more before that day carries the settled change administration fee in place of it; and a contract
    whose record shows no earlier change of service model carries the printed change administration fee. Where the
    opening project fee already invoiced on the contract falls below the opening project fee printed against the
    service model the contract is moving from and the cafe has been serving for more than twenty-four months, the
    whole difference between the two, rounded to the nearest cent, is settled with the change; where the opening
    project fee already invoiced falls below the opening project fee printed against the service model the contract
    is moving from and the cafe has been serving for twenty-four months or less, half that difference, rounded to
    the nearest cent, is settled with the change; and where the opening project fee already invoiced is not below
    the opening project fee printed against the service model the contract is moving from, nothing is settled for
    opening project works. The short notice shortfall is the change notice printed against the service model the
    contract is moving from less the calendar days between the day the approved change of service model was asked
    for and the day the client confirms, and it is never less than nil. Where a shortfall stands and the site's
    reported headcount reaches the large site headcount, the shortfall is counted in whole weeks and one fifteenth
    of the change administration fee the contract carries, rounded to the nearest cent, is charged for each of them,
    a part week being left uncharged; where a shortfall stands and the site's reported headcount falls below the
    large site headcount, the shortfall is counted in calendar days and one hundred and fifth of the change administration
    fee the contract carries, rounded to the nearest cent, is charged for each of them; and where no shortfall stands,
    no short notice charge is made. Where the contract's unsettled invoice balance stands above the exposed account
    threshold and no payment has been received on the contract in the three months up to the day the client confirms,
    the exposed account loading is applied; where the unsettled invoice balance stands above that threshold and
    a payment has been received on the contract over those three months, the watched account loading is applied;
    and where the unsettled invoice balance does not stand above that threshold, the clear account loading is applied.
  prerequisite: []
  cross_category: []
  compute:
  - months_since_recorded_change: MONTHS(F('service_model_change_effective_date') or F('contract_start_date'), NOW)
  - change_admin_fee_usd: >-
      K('repeat_change_admin_fee_usd') if (F('service_model_change_effective_date') != '' and months_since_recorded_change
      < 12) else (K('settled_change_admin_fee_usd') if (F('service_model_change_effective_date') != '' and months_since_recorded_change
      >= 12) else P('service_model_change_fee_usd'))
  - opening_fee_invoiced_usd: MAX('cafe_ledger','amount_usd', charge_code='mobilization_fee')
  - service_months: MONTHS(F('service_commenced_date') or F('contract_start_date'), NOW)
  - opening_project_settlement_usd: >-
      RND(P('mobilization_fee_usd') - opening_fee_invoiced_usd, 2) if (opening_fee_invoiced_usd < P('mobilization_fee_usd')
      and service_months > 24) else (RND((P('mobilization_fee_usd') - opening_fee_invoiced_usd) / 2, 2) if (opening_fee_invoiced_usd
      < P('mobilization_fee_usd') and service_months <= 24) else 0.0)
  - change_asked_on: >-
      LATEST('cafe_service_requests','created_at', date_field='created_at', request_type='service_model_change_request',
      request_status='approved')
  - notice_shortfall_days: MX(0, P('service_model_change_lead_days') - DAYS(change_asked_on, NOW))
  - short_notice_charge_usd: >-
      RND(change_admin_fee_usd / 15, 2) * int(notice_shortfall_days / 7) if (notice_shortfall_days > 0 and F('headcount_served')
      >= K('large_site_headcount')) else (RND(change_admin_fee_usd / 105, 2) * notice_shortfall_days if (notice_shortfall_days
      > 0 and F('headcount_served') < K('large_site_headcount')) else 0.0)
  - payments_3m: >-
      COUNT('cafe_ledger', within_months=3, date_field='posted_date', charge_code='invoice_payment')
  - unsettled_balance_usd: F('receivable_balance_usd')
  - account_loading_pct: >-
      K('exposed_account_loading_pct') if (unsettled_balance_usd > K('exposed_account_threshold_usd') and payments_3m
      < 1) else (K('watched_account_loading_pct') if (unsettled_balance_usd > K('exposed_account_threshold_usd')
      and payments_3m >= 1) else K('clear_account_loading_pct'))
  - change_charge_subtotal_usd: change_admin_fee_usd + opening_project_settlement_usd + short_notice_charge_usd
  - result: RND(change_charge_subtotal_usd * (1 + account_loading_pct / 100), 2)
  compute_basis:
    months_since_recorded_change: >-
      A contract whose record already shows a change of service model that took effect less than twelve months before
      the day the client confirms carries the repeat change administration fee in place of the printed change administration
      fee; a contract whose record shows a change of service model that took effect twelve months or more before
      that day carries the settled change administration fee in place of it; and a contract whose record shows no
      earlier change of service model carries the printed change administration fee.
    change_admin_fee_usd: >-
      A contract whose record already shows a change of service model that took effect less than twelve months before
      the day the client confirms carries the repeat change administration fee in place of the printed change administration
      fee; a contract whose record shows a change of service model that took effect twelve months or more before
      that day carries the settled change administration fee in place of it; and a contract whose record shows no
      earlier change of service model carries the printed change administration fee.
    opening_fee_invoiced_usd: >-
      Where the opening project fee already invoiced on the contract falls below the opening project fee printed
      against the service model the contract is moving from and the cafe has been serving for more than twenty-four
      months, the whole difference between the two, rounded to the nearest cent, is settled with the change; where
      the opening project fee already invoiced falls below the opening project fee printed against the service model
      the contract is moving from and the cafe has been serving for twenty-four months or less, half that difference,
      rounded to the nearest cent, is settled with the change; and where the opening project fee already invoiced
      is not below the opening project fee printed against the service model the contract is moving from, nothing
      is settled for opening project works.
    service_months: >-
      Where the opening project fee already invoiced on the contract falls below the opening project fee printed
      against the service model the contract is moving from and the cafe has been serving for more than twenty-four
      months, the whole difference between the two, rounded to the nearest cent, is settled with the change; where
      the opening project fee already invoiced falls below the opening project fee printed against the service model
      the contract is moving from and the cafe has been serving for twenty-four months or less, half that difference,
      rounded to the nearest cent, is settled with the change; and where the opening project fee already invoiced
      is not below the opening project fee printed against the service model the contract is moving from, nothing
      is settled for opening project works.
    opening_project_settlement_usd: >-
      Where the opening project fee already invoiced on the contract falls below the opening project fee printed
      against the service model the contract is moving from and the cafe has been serving for more than twenty-four
      months, the whole difference between the two, rounded to the nearest cent, is settled with the change; where
      the opening project fee already invoiced falls below the opening project fee printed against the service model
      the contract is moving from and the cafe has been serving for twenty-four months or less, half that difference,
      rounded to the nearest cent, is settled with the change; and where the opening project fee already invoiced
      is not below the opening project fee printed against the service model the contract is moving from, nothing
      is settled for opening project works.
    change_asked_on: >-
      The short notice shortfall is the change notice printed against the service model the contract is moving from
      less the calendar days between the day the approved change of service model was asked for and the day the
      client confirms, and it is never less than nil.
    notice_shortfall_days: >-
      The short notice shortfall is the change notice printed against the service model the contract is moving from
      less the calendar days between the day the approved change of service model was asked for and the day the
      client confirms, and it is never less than nil.
    short_notice_charge_usd: >-
      Where a shortfall stands and the site's reported headcount reaches the large site headcount, the shortfall
      is counted in whole weeks and one fifteenth of the change administration fee the contract carries, rounded
      to the nearest cent, is charged for each of them, a part week being left uncharged; where a shortfall stands
      and the site's reported headcount falls below the large site headcount, the shortfall is counted in calendar
      days and one hundred and fifth of the change administration fee the contract carries, rounded to the nearest
      cent, is charged for each of them; and where no shortfall stands, no short notice charge is made.
    payments_3m: >-
      Where the contract's unsettled invoice balance stands above the exposed account threshold and no payment has
      been received on the contract in the three months up to the day the client confirms, the exposed account loading
      is applied; where the unsettled invoice balance stands above that threshold and a payment has been received
      on the contract over those three months, the watched account loading is applied; and where the unsettled invoice
      balance does not stand above that threshold, the clear account loading is applied.
    unsettled_balance_usd: >-
      Where the contract's unsettled invoice balance stands above the exposed account threshold and no payment has
      been received on the contract in the three months up to the day the client confirms, the exposed account loading
      is applied; where the unsettled invoice balance stands above that threshold and a payment has been received
      on the contract over those three months, the watched account loading is applied; and where the unsettled invoice
      balance does not stand above that threshold, the clear account loading is applied.
    account_loading_pct: >-
      Where the contract's unsettled invoice balance stands above the exposed account threshold and no payment has
      been received on the contract in the three months up to the day the client confirms, the exposed account loading
      is applied; where the unsettled invoice balance stands above that threshold and a payment has been received
      on the contract over those three months, the watched account loading is applied; and where the unsettled invoice
      balance does not stand above that threshold, the clear account loading is applied.
    change_charge_subtotal_usd: >-
      The change administration fee the contract carries, the opening project settlement and the short notice charge
      are added together first, and the loading is then applied once to that total; the figure the loading leaves
      is rounded to the nearest cent.
    result: >-
      The change administration fee the contract carries, the opening project settlement and the short notice charge
      are added together first, and the loading is then applied once to that total; the figure the loading leaves
      is rounded to the nearest cent.
  factors:
  - id: change_administration_fee_band
    effect: parameter
    decides: change_admin_fee_usd
    bindings:
    - months_since_recorded_change
    - change_admin_fee_usd
    ladder:
    - when: >-
        the contract's record shows a change of service model and that change took effect less than twelve months
        before the day the client confirms
      value: the repeat change administration fee
    - when: >-
        the contract's record shows a change of service model and that change took effect twelve months or more
        before the day the client confirms
      value: the settled change administration fee
    - when: otherwise
      value: >-
        the change administration fee printed against the service model the contract is moving from
    baseline:
      change_admin_fee_usd: P('service_model_change_fee_usd')
    evidence:
    - date
    - tier_param
    cross_difficulty: null
  - id: opening_project_settlement_band
    effect: parameter
    decides: opening_project_settlement_usd
    bindings:
    - opening_fee_invoiced_usd
    - service_months
    - opening_project_settlement_usd
    ladder:
    - when: >-
        the opening project fee already invoiced on the contract falls below the opening project fee printed against
        the service model the contract is moving from and the cafe has been serving for more than twenty-four months
      value: >-
        the whole difference between the opening project fee printed against the service model the contract is moving
        from and the opening project fee already invoiced, rounded to the nearest cent
    - when: >-
        the opening project fee already invoiced on the contract falls below the opening project fee printed against
        the service model the contract is moving from and the cafe has been serving for twenty-four months or less
      value: half that difference, rounded to the nearest cent
    - when: otherwise
      value: nothing is settled for opening project works
    baseline:
      opening_project_settlement_usd: '0.0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: short_notice_charge_basis
    effect: method
    decides: short_notice_charge_usd
    bindings:
    - change_asked_on
    - notice_shortfall_days
    - short_notice_charge_usd
    ladder:
    - when: >-
        a short notice shortfall stands and the site's reported headcount reaches the large site headcount
      method: >-
        the shortfall is counted in whole weeks and one fifteenth of the change administration fee the contract
        carries, rounded to the nearest cent, is charged for each of them, a part week being left uncharged
    - when: >-
        a short notice shortfall stands and the site's reported headcount falls below the large site headcount
      method: >-
        the shortfall is counted in calendar days and one hundred and fifth of the change administration fee the
        contract carries, rounded to the nearest cent, is charged for each of them
    - when: otherwise
      method: no short notice charge is made
    baseline:
      short_notice_charge_usd: '0.0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: account_exposure_loading_band
    effect: parameter
    decides: account_loading_pct
    bindings:
    - payments_3m
    - unsettled_balance_usd
    - account_loading_pct
    ladder:
    - when: >-
        the contract's unsettled invoice balance stands above the exposed account threshold and no payment has been
        received on the contract in the three months up to the day the client confirms
      value: the exposed account loading
    - when: >-
        the contract's unsettled invoice balance stands above the exposed account threshold and a payment has been
        received on the contract in the three months up to the day the client confirms
      value: the watched account loading
    - when: otherwise
      value: the clear account loading
    baseline:
      account_loading_pct: K('clear_account_loading_pct')
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: >-
      A change of service model that the client has already approved is put into force on the day the client confirms
      it, and the contract carries one administration charge for that change. Every parameter this charge is worked
      out from is the one printed against the service model the contract is moving from, that is the service model
      recorded on the contract immediately before the change is put into force, and no parameter of the service
      model being moved to enters it. The charge worked out under this rule prices a change of service model that
      the contract is permitted to make, and decides nothing about whether a change is accepted. The charge is recorded
      against the billing period in which the client confirms the change. The change administration fee the contract
      carries is the change administration fee printed against the service model the contract is moving from. Nothing
      is settled for opening project works, no short notice charge is made, and the clear account loading is applied.
      The change administration fee the contract carries, the opening project settlement and the short notice charge
      are added together first, and the loading is then applied once to that total; the figure the loading leaves
      is rounded to the nearest cent.
    params:
    - service_model_change_fee_usd
    - clear_account_loading_pct
  inputs:
    history:
    - table: cafe_ledger
      aggregate: max
      field: amount_usd
      within_months: null
      filters:
        charge_code: mobilization_fee
    - table: cafe_ledger
      aggregate: count
      field: cafe_ledger_id
      within_months: 3
      filters:
        charge_code: invoice_payment
    - table: cafe_service_requests
      aggregate: latest
      field: created_at
      within_months: null
      filters:
        request_type: service_model_change_request
        request_status: approved
    cross_category: []
- id: cafe_ext_management_fee_invoice
  base_policy_refs:
  - cafe_agg_portfolio_fee_band
  - cafe_management_fee_calc
  - cafe_combination_pantry_interaction
  overwrite:
  - base_policy: cafe_management_fee_calc
    superseded_clause: >-
      Each billing period the contract is invoiced for the management fee printed against the service model in force
      on the invoice day, reduced by the portfolio discount percentage the client's portfolio band yields, and rounded
      to the nearest cent.
    replaced_by: >-
      The co-location allowance and the suspended day relief are each worked out on the escalated fee and subtracted
      from it, the subsidy commitment surcharge is worked out on the escalated fee and added to it, and the management
      fee invoiced is the escalated fee less those two reductions plus that surcharge, rounded to the nearest cent
      and never below nil.
  - base_policy: cafe_management_fee_calc
    superseded_clause: >-
      Where the service model changed part way through a billing period, the fee for that period is the fee of the
      model in force on the invoice day and no proration is carried out between the two models.
    replaced_by: >-
      Where the service model standing on the contract took effect within the billing period being invoiced and
      the contract carries at least one management fee invoice in the three months up to the day the invoice is
      raised, the base fee is the mean of the monthly management fee printed against the service model standing
      on the contract and the management fee most recently invoiced on the contract, rounded to the nearest cent;
      where the service model standing on the contract took effect within that period and the contract carries no
      management fee invoice over those three months, the base fee is the management fee most recently invoiced
      on the contract; and where the service model standing on the contract took effect outside that period, the
      base fee is the monthly management fee printed against the service model standing on the contract.
  - base_policy: cafe_management_fee_calc
    superseded_clause: >-
      The annual escalation is applied to the management fee on the first invoice raised on or after each anniversary
      of the contract start date, and never mid-year.
    replaced_by: >-
      Where a first service day is recorded on the contract and it falls more than thirty calendar days after the
      first day of the contract term, the escalation steps are the whole years between the first service day and
      the day the invoice is raised; where a first service day is recorded and it falls thirty calendar days or
      less after the first day of the term, the escalation steps are the whole years between the first day of the
      term and the day the invoice is raised; and where no first service day is recorded, no escalation step is
      taken.
  - base_policy: cafe_agg_portfolio_fee_band
    superseded_clause: >-
      The band is found by counting the client's cafe contracts that stand active or suspended on the day the invoice
      is raised, then taking the highest ladder step whose contract count does not exceed that number; the ladder
      is the one printed against the service model of the contract being invoiced, so two contracts of different
      service models in the same portfolio take different discount percentages from the same count.
    replaced_by: >-
      The management fee worked out under this rule carries the allowances, reliefs and surcharges set out below
      in place of any portfolio band discount.
  - base_policy: cafe_agg_portfolio_fee_band
    superseded_clause: >-
      The management fee a client pays on each cafe contract is discounted by a portfolio band that reads the client's
      whole cafe portfolio rather than the single contract being invoiced.
    replaced_by: >-
      The management fee worked out under this rule carries the allowances, reliefs and surcharges set out below
      in place of any portfolio band discount.
  - base_policy: cafe_combination_pantry_interaction
    superseded_clause: >-
      Where the same client holds an active pantry programme at the site named on the cafe contract, the cafe administration
      fee is not charged on invoiced food cost for that site, because the pantry programme already carries a delivery
      and handling charge for the same kitchen.
    replaced_by: >-
      Where the client holds an office pantry programme standing open and the pantry programme fees invoiced to
      that client over the twelve months up to the day the invoice is raised reach the pantry co-location threshold,
      the co-location allowance is the major pantry co-location rate of the escalated fee; where the client holds
      an office pantry programme standing open and those pantry programme fees fall below that threshold, the co-location
      allowance is the minor pantry co-location rate of the escalated fee; and where the client holds no office
      pantry programme standing open, the co-location allowance is the nil co-location rate of the escalated fee.
  trigger: state_due
  subject:
  - cafe_management_fee_invoiced
  computes: amount_usd
  target_tool: raise_management_fee_invoice_00d6d0cf
  params:
    clean_account_escalation_pct: 2.25
    partially_settled_escalation_pct: 3.0
    major_pantry_colocation_pct: 6.0
    minor_pantry_colocation_pct: 3.0
    no_colocation_pct: 0.0
    pantry_colocation_threshold_usd: 45000.0
    deep_subsidy_shortfall_pct: 8.0
    partial_subsidy_shortfall_pct: 3.5
    no_subsidy_shortfall_pct: 0.0
    large_site_headcount: 400
    suspended_day_divisor: 30
  rule: >-
    Each billing period a workplace cafe management contract is invoiced for its management fee, worked out from
    the monthly management fee printed against the service model standing on the contract on the day the invoice
    is raised. That fee is the base fee, the escalation steps are the whole years between the first day of the contract
    term and the day the invoice is raised, and the escalation rate is the annual price escalation printed against
    the service model. The base fee is carried forward at the escalation rate once for each escalation step, and
    the figure so obtained is the escalated fee, rounded to the nearest cent. The co-location allowance is nil,
    the suspended day relief is nil and the subsidy commitment surcharge is nil. The co-location allowance is the
    co-location rate taken on the escalated fee, rounded to the nearest cent. The subsidy commitment surcharge is
    the subsidy shortfall rate taken on the escalated fee, rounded to the nearest cent. The management fee worked
    out under this rule carries the allowances, reliefs and surcharges set out below in place of any portfolio band
    discount. The management fee is recorded against the billing period it covers. The co-location allowance and
    the suspended day relief are each worked out on the escalated fee and subtracted from it, the subsidy commitment
    surcharge is worked out on the escalated fee and added to it, and the management fee invoiced is the escalated
    fee less those two reductions plus that surcharge, rounded to the nearest cent and never below nil. The management
    fee for a billing period is not worked out before the service model standing on the contract is the one named
    on the contract's approved change of service model. Where the service model standing on the contract took effect
    within the billing period being invoiced and the contract carries at least one management fee invoice in the
    three months up to the day the invoice is raised, the base fee is the mean of the monthly management fee printed
    against the service model standing on the contract and the management fee most recently invoiced on the contract,
    rounded to the nearest cent; where the service model standing on the contract took effect within that period
    and the contract carries no management fee invoice over those three months, the base fee is the management fee
    most recently invoiced on the contract; and where the service model standing on the contract took effect outside
    that period, the base fee is the monthly management fee printed against the service model standing on the contract.
    Where a first service day is recorded on the contract and it falls more than thirty calendar days after the
    first day of the contract term, the escalation steps are the whole years between the first service day and the
    day the invoice is raised; where a first service day is recorded and it falls thirty calendar days or less after
    the first day of the term, the escalation steps are the whole years between the first day of the term and the
    day the invoice is raised; and where no first service day is recorded, no escalation step is taken. Where the
    contract carries no late charge in the twenty-four months up to the day the invoice is raised and the payments
    received on the contract over the twelve months up to that day reach the management fees invoiced over those
    same twelve months, the escalation rate is the clean account escalation rate; where the contract carries no
    late charge over those twenty-four months and the payments received over those twelve months fall short of the
    management fees invoiced over them, the escalation rate is the partially settled escalation rate; and where
    the contract carries a late charge over those twenty-four months, the escalation rate is the annual price escalation
    printed against the service model. Where the client holds an office pantry programme standing open and the pantry
    programme fees invoiced to that client over the twelve months up to the day the invoice is raised reach the
    pantry co-location threshold, the co-location allowance is the major pantry co-location rate of the escalated
    fee; where the client holds an office pantry programme standing open and those pantry programme fees fall below
    that threshold, the co-location allowance is the minor pantry co-location rate of the escalated fee; and where
    the client holds no office pantry programme standing open, the co-location allowance is the nil co-location
    rate of the escalated fee. Where two or more standby charges stand on the contract in the twelve months up to
    the day the invoice is raised and ten or more suspended calendar days stand against the current contract year,
    the escalated fee is relieved in the share that those suspended calendar days bear to a thirty-day month, the
    figure so obtained rounded to the nearest cent; where fewer than two standby charges stand on the contract over
    those twelve months and ten or more suspended calendar days stand against the current contract year, the escalated
    fee is relieved in the share that the days falling within whole weeks of those suspended days bear to a thirty-day
    month, the figure so obtained rounded to the nearest cent; and where fewer than ten suspended calendar days
    stand against the current contract year, no suspended day relief is taken. Where the subsidy funding lots paid
    in over the twelve months up to the day the invoice is raised fall below half the minimum annual client subsidy
    printed against the service model and the site's reported headcount reaches the large site headcount, the subsidy
    commitment surcharge is the deep subsidy shortfall rate of the escalated fee; where those funding lots reach
    half that minimum annual client subsidy but fall below it and the site's reported headcount reaches the large
    site headcount, the surcharge is the partial subsidy shortfall rate of the escalated fee; and where those funding
    lots reach that minimum annual client subsidy or the site's reported headcount falls below the large site headcount,
    the surcharge is the nil subsidy shortfall rate of the escalated fee.
  prerequisite:
  - problem: cafe_ext_model_change_confirmation
    kind: value_input
    gate: base_fee_usd
    form: state
    policy_source: >-
      The management fee for a billing period is not worked out before the service model standing on the contract
      is the one named on the contract's approved change of service model.
    condition: >-
      cafe_contracts.variant_name equals the requested_variant_name carried by the approved service model change
      request standing on the contract, and cafe_contracts.service_model_change_effective_date falls within the
      billing period being invoiced.
    resolved_by: confirm_service_model_change_fa28a84a
    effect: >-
      Once the contract's service model is the approved one, the base fee binding reads the monthly management fee
      printed against that model rather than the one the contract stood on beforehand, and the transition mean applies
      for the period the change takes effect in.
  cross_category:
  - category: pantry
    as: history
    reads:
    - status
    - pantry_ledger.amount_usd
    note: >-
      The co-location allowance tier is decided from whether the client's office pantry programme stands open and
      from the pantry programme fees invoiced to that client over the last twelve months.
  compute:
  - contract_months: MONTHS(F('contract_start_date'), NOW)
  - service_months: MONTHS(F('service_commenced_date') or F('contract_start_date'), NOW)
  - service_gap_days: DAYS(F('contract_start_date'), F('service_commenced_date') or F('contract_start_date'))
  - escalation_steps: >-
      int(service_months / 12) if (F('service_commenced_date') != '' and service_gap_days > 30) else (int(contract_months
      / 12) if (F('service_commenced_date') != '' and service_gap_days <= 30) else 0)
  - months_since_model_change: MONTHS(F('service_model_change_effective_date') or F('contract_start_date'), NOW)
  - mgmt_invoices_3m: >-
      COUNT('cafe_ledger', within_months=3, date_field='posted_date', charge_code='management_fee')
  - latest_mgmt_fee_usd: LATEST('cafe_ledger','amount_usd', date_field='posted_date', charge_code='management_fee')
  - base_fee_usd: >-
      RND((P('management_fee_monthly_usd') + latest_mgmt_fee_usd) / 2, 2) if (months_since_model_change == 0 and
      mgmt_invoices_3m >= 1) else (latest_mgmt_fee_usd if (months_since_model_change == 0 and mgmt_invoices_3m <
      1) else P('management_fee_monthly_usd'))
  - late_charges_24m: COUNT('cafe_ledger', within_months=24, date_field='posted_date', charge_code='late_fee')
  - payments_12m: >-
      SUM('cafe_ledger','amount_usd', within_months=12, date_field='posted_date', charge_code='invoice_payment')
  - mgmt_fees_12m: >-
      SUM('cafe_ledger','amount_usd', within_months=12, date_field='posted_date', charge_code='management_fee')
  - escalation_rate_pct: >-
      K('clean_account_escalation_pct') if (late_charges_24m == 0 and payments_12m >= mgmt_fees_12m) else (K('partially_settled_escalation_pct')
      if (late_charges_24m == 0 and payments_12m < mgmt_fees_12m) else P('annual_price_escalation_pct'))
  - escalated_fee_usd: RND(base_fee_usd * (1 + escalation_rate_pct / 100) ** escalation_steps, 2)
  - pantry_status: CFIELD('pantry','status')
  - pantry_fees_12m: >-
      XSUM('pantry','pantry_ledger','amount_usd', within_months=12, date_field='posted_date', charge_code='program_fee')
  - colocation_pct: >-
      K('major_pantry_colocation_pct') if (pantry_status == 'active' and pantry_fees_12m >= K('pantry_colocation_threshold_usd'))
      else (K('minor_pantry_colocation_pct') if (pantry_status == 'active' and pantry_fees_12m < K('pantry_colocation_threshold_usd'))
      else K('no_colocation_pct'))
  - colocation_allowance_usd: RND(escalated_fee_usd * colocation_pct / 100, 2)
  - standby_charges_12m: >-
      COUNT('cafe_ledger', within_months=12, date_field='posted_date', charge_code='standby_fee')
  - suspended_days_ytd: F('suspension_days_used_ytd')
  - suspended_day_relief_usd: >-
      RND(escalated_fee_usd * suspended_days_ytd / K('suspended_day_divisor'), 2) if (standby_charges_12m >= 2 and
      suspended_days_ytd >= 10) else (RND(escalated_fee_usd * int(suspended_days_ytd / 7) * 7 / K('suspended_day_divisor'),
      2) if (standby_charges_12m < 2 and suspended_days_ytd >= 10) else 0.0)
  - subsidy_funded_12m: >-
      SUM('cafe_ledger','amount_usd', within_months=12, date_field='posted_date', charge_code='subsidy_funding')
  - subsidy_shortfall_pct: >-
      K('deep_subsidy_shortfall_pct') if (subsidy_funded_12m < P('min_annual_client_subsidy_usd') / 2 and F('headcount_served')
      >= K('large_site_headcount')) else (K('partial_subsidy_shortfall_pct') if (subsidy_funded_12m >= P('min_annual_client_subsidy_usd')
      / 2 and subsidy_funded_12m < P('min_annual_client_subsidy_usd') and F('headcount_served') >= K('large_site_headcount'))
      else K('no_subsidy_shortfall_pct'))
  - subsidy_surcharge_usd: RND(escalated_fee_usd * subsidy_shortfall_pct / 100, 2)
  - result: >-
      MX(0.0, RND(escalated_fee_usd - colocation_allowance_usd - suspended_day_relief_usd + subsidy_surcharge_usd,
      2))
  compute_basis:
    contract_months: >-
      Where a first service day is recorded on the contract and it falls more than thirty calendar days after the
      first day of the contract term, the escalation steps are the whole years between the first service day and
      the day the invoice is raised; where a first service day is recorded and it falls thirty calendar days or
      less after the first day of the term, the escalation steps are the whole years between the first day of the
      term and the day the invoice is raised; and where no first service day is recorded, no escalation step is
      taken.
    service_months: >-
      Where a first service day is recorded on the contract and it falls more than thirty calendar days after the
      first day of the contract term, the escalation steps are the whole years between the first service day and
      the day the invoice is raised; where a first service day is recorded and it falls thirty calendar days or
      less after the first day of the term, the escalation steps are the whole years between the first day of the
      term and the day the invoice is raised; and where no first service day is recorded, no escalation step is
      taken.
    service_gap_days: >-
      Where a first service day is recorded on the contract and it falls more than thirty calendar days after the
      first day of the contract term, the escalation steps are the whole years between the first service day and
      the day the invoice is raised; where a first service day is recorded and it falls thirty calendar days or
      less after the first day of the term, the escalation steps are the whole years between the first day of the
      term and the day the invoice is raised; and where no first service day is recorded, no escalation step is
      taken.
    escalation_steps: >-
      Where a first service day is recorded on the contract and it falls more than thirty calendar days after the
      first day of the contract term, the escalation steps are the whole years between the first service day and
      the day the invoice is raised; where a first service day is recorded and it falls thirty calendar days or
      less after the first day of the term, the escalation steps are the whole years between the first day of the
      term and the day the invoice is raised; and where no first service day is recorded, no escalation step is
      taken.
    months_since_model_change: >-
      Where the service model standing on the contract took effect within the billing period being invoiced and
      the contract carries at least one management fee invoice in the three months up to the day the invoice is
      raised, the base fee is the mean of the monthly management fee printed against the service model standing
      on the contract and the management fee most recently invoiced on the contract, rounded to the nearest cent;
      where the service model standing on the contract took effect within that period and the contract carries no
      management fee invoice over those three months, the base fee is the management fee most recently invoiced
      on the contract; and where the service model standing on the contract took effect outside that period, the
      base fee is the monthly management fee printed against the service model standing on the contract.
    mgmt_invoices_3m: >-
      Where the service model standing on the contract took effect within the billing period being invoiced and
      the contract carries at least one management fee invoice in the three months up to the day the invoice is
      raised, the base fee is the mean of the monthly management fee printed against the service model standing
      on the contract and the management fee most recently invoiced on the contract, rounded to the nearest cent;
      where the service model standing on the contract took effect within that period and the contract carries no
      management fee invoice over those three months, the base fee is the management fee most recently invoiced
      on the contract; and where the service model standing on the contract took effect outside that period, the
      base fee is the monthly management fee printed against the service model standing on the contract.
    latest_mgmt_fee_usd: >-
      Where the service model standing on the contract took effect within the billing period being invoiced and
      the contract carries at least one management fee invoice in the three months up to the day the invoice is
      raised, the base fee is the mean of the monthly management fee printed against the service model standing
      on the contract and the management fee most recently invoiced on the contract, rounded to the nearest cent;
      where the service model standing on the contract took effect within that period and the contract carries no
      management fee invoice over those three months, the base fee is the management fee most recently invoiced
      on the contract; and where the service model standing on the contract took effect outside that period, the
      base fee is the monthly management fee printed against the service model standing on the contract.
    base_fee_usd: >-
      Where the service model standing on the contract took effect within the billing period being invoiced and
      the contract carries at least one management fee invoice in the three months up to the day the invoice is
      raised, the base fee is the mean of the monthly management fee printed against the service model standing
      on the contract and the management fee most recently invoiced on the contract, rounded to the nearest cent;
      where the service model standing on the contract took effect within that period and the contract carries no
      management fee invoice over those three months, the base fee is the management fee most recently invoiced
      on the contract; and where the service model standing on the contract took effect outside that period, the
      base fee is the monthly management fee printed against the service model standing on the contract.
    late_charges_24m: >-
      Where the contract carries no late charge in the twenty-four months up to the day the invoice is raised and
      the payments received on the contract over the twelve months up to that day reach the management fees invoiced
      over those same twelve months, the escalation rate is the clean account escalation rate; where the contract
      carries no late charge over those twenty-four months and the payments received over those twelve months fall
      short of the management fees invoiced over them, the escalation rate is the partially settled escalation rate;
      and where the contract carries a late charge over those twenty-four months, the escalation rate is the annual
      price escalation printed against the service model.
    payments_12m: >-
      Where the contract carries no late charge in the twenty-four months up to the day the invoice is raised and
      the payments received on the contract over the twelve months up to that day reach the management fees invoiced
      over those same twelve months, the escalation rate is the clean account escalation rate; where the contract
      carries no late charge over those twenty-four months and the payments received over those twelve months fall
      short of the management fees invoiced over them, the escalation rate is the partially settled escalation rate;
      and where the contract carries a late charge over those twenty-four months, the escalation rate is the annual
      price escalation printed against the service model.
    mgmt_fees_12m: >-
      Where the contract carries no late charge in the twenty-four months up to the day the invoice is raised and
      the payments received on the contract over the twelve months up to that day reach the management fees invoiced
      over those same twelve months, the escalation rate is the clean account escalation rate; where the contract
      carries no late charge over those twenty-four months and the payments received over those twelve months fall
      short of the management fees invoiced over them, the escalation rate is the partially settled escalation rate;
      and where the contract carries a late charge over those twenty-four months, the escalation rate is the annual
      price escalation printed against the service model.
    escalation_rate_pct: >-
      Where the contract carries no late charge in the twenty-four months up to the day the invoice is raised and
      the payments received on the contract over the twelve months up to that day reach the management fees invoiced
      over those same twelve months, the escalation rate is the clean account escalation rate; where the contract
      carries no late charge over those twenty-four months and the payments received over those twelve months fall
      short of the management fees invoiced over them, the escalation rate is the partially settled escalation rate;
      and where the contract carries a late charge over those twenty-four months, the escalation rate is the annual
      price escalation printed against the service model.
    escalated_fee_usd: >-
      The base fee is carried forward at the escalation rate once for each escalation step, and the figure so obtained
      is the escalated fee, rounded to the nearest cent.
    pantry_status: >-
      Where the client holds an office pantry programme standing open and the pantry programme fees invoiced to
      that client over the twelve months up to the day the invoice is raised reach the pantry co-location threshold,
      the co-location allowance is the major pantry co-location rate of the escalated fee; where the client holds
      an office pantry programme standing open and those pantry programme fees fall below that threshold, the co-location
      allowance is the minor pantry co-location rate of the escalated fee; and where the client holds no office
      pantry programme standing open, the co-location allowance is the nil co-location rate of the escalated fee.
    pantry_fees_12m: >-
      Where the client holds an office pantry programme standing open and the pantry programme fees invoiced to
      that client over the twelve months up to the day the invoice is raised reach the pantry co-location threshold,
      the co-location allowance is the major pantry co-location rate of the escalated fee; where the client holds
      an office pantry programme standing open and those pantry programme fees fall below that threshold, the co-location
      allowance is the minor pantry co-location rate of the escalated fee; and where the client holds no office
      pantry programme standing open, the co-location allowance is the nil co-location rate of the escalated fee.
    colocation_pct: >-
      Where the client holds an office pantry programme standing open and the pantry programme fees invoiced to
      that client over the twelve months up to the day the invoice is raised reach the pantry co-location threshold,
      the co-location allowance is the major pantry co-location rate of the escalated fee; where the client holds
      an office pantry programme standing open and those pantry programme fees fall below that threshold, the co-location
      allowance is the minor pantry co-location rate of the escalated fee; and where the client holds no office
      pantry programme standing open, the co-location allowance is the nil co-location rate of the escalated fee.
    colocation_allowance_usd: >-
      The co-location allowance is the co-location rate taken on the escalated fee, rounded to the nearest cent.
    standby_charges_12m: >-
      Where two or more standby charges stand on the contract in the twelve months up to the day the invoice is
      raised and ten or more suspended calendar days stand against the current contract year, the escalated fee
      is relieved in the share that those suspended calendar days bear to a thirty-day month, the figure so obtained
      rounded to the nearest cent; where fewer than two standby charges stand on the contract over those twelve
      months and ten or more suspended calendar days stand against the current contract year, the escalated fee
      is relieved in the share that the days falling within whole weeks of those suspended days bear to a thirty-day
      month, the figure so obtained rounded to the nearest cent; and where fewer than ten suspended calendar days
      stand against the current contract year, no suspended day relief is taken.
    suspended_days_ytd: >-
      Where two or more standby charges stand on the contract in the twelve months up to the day the invoice is
      raised and ten or more suspended calendar days stand against the current contract year, the escalated fee
      is relieved in the share that those suspended calendar days bear to a thirty-day month, the figure so obtained
      rounded to the nearest cent; where fewer than two standby charges stand on the contract over those twelve
      months and ten or more suspended calendar days stand against the current contract year, the escalated fee
      is relieved in the share that the days falling within whole weeks of those suspended days bear to a thirty-day
      month, the figure so obtained rounded to the nearest cent; and where fewer than ten suspended calendar days
      stand against the current contract year, no suspended day relief is taken.
    suspended_day_relief_usd: >-
      Where two or more standby charges stand on the contract in the twelve months up to the day the invoice is
      raised and ten or more suspended calendar days stand against the current contract year, the escalated fee
      is relieved in the share that those suspended calendar days bear to a thirty-day month, the figure so obtained
      rounded to the nearest cent; where fewer than two standby charges stand on the contract over those twelve
      months and ten or more suspended calendar days stand against the current contract year, the escalated fee
      is relieved in the share that the days falling within whole weeks of those suspended days bear to a thirty-day
      month, the figure so obtained rounded to the nearest cent; and where fewer than ten suspended calendar days
      stand against the current contract year, no suspended day relief is taken.
    subsidy_funded_12m: >-
      Where the subsidy funding lots paid in over the twelve months up to the day the invoice is raised fall below
      half the minimum annual client subsidy printed against the service model and the site's reported headcount
      reaches the large site headcount, the subsidy commitment surcharge is the deep subsidy shortfall rate of the
      escalated fee; where those funding lots reach half that minimum annual client subsidy but fall below it and
      the site's reported headcount reaches the large site headcount, the surcharge is the partial subsidy shortfall
      rate of the escalated fee; and where those funding lots reach that minimum annual client subsidy or the site's
      reported headcount falls below the large site headcount, the surcharge is the nil subsidy shortfall rate of
      the escalated fee.
    subsidy_shortfall_pct: >-
      Where the subsidy funding lots paid in over the twelve months up to the day the invoice is raised fall below
      half the minimum annual client subsidy printed against the service model and the site's reported headcount
      reaches the large site headcount, the subsidy commitment surcharge is the deep subsidy shortfall rate of the
      escalated fee; where those funding lots reach half that minimum annual client subsidy but fall below it and
      the site's reported headcount reaches the large site headcount, the surcharge is the partial subsidy shortfall
      rate of the escalated fee; and where those funding lots reach that minimum annual client subsidy or the site's
      reported headcount falls below the large site headcount, the surcharge is the nil subsidy shortfall rate of
      the escalated fee.
    subsidy_surcharge_usd: >-
      The subsidy commitment surcharge is the subsidy shortfall rate taken on the escalated fee, rounded to the
      nearest cent.
    result: >-
      The co-location allowance and the suspended day relief are each worked out on the escalated fee and subtracted
      from it, the subsidy commitment surcharge is worked out on the escalated fee and added to it, and the management
      fee invoiced is the escalated fee less those two reductions plus that surcharge, rounded to the nearest cent
      and never below nil.
  factors:
  - id: transition_period_base_fee
    effect: parameter
    decides: base_fee_usd
    bindings:
    - months_since_model_change
    - mgmt_invoices_3m
    - latest_mgmt_fee_usd
    - base_fee_usd
    ladder:
    - when: >-
        the service model standing on the contract took effect within the billing period being invoiced and the
        contract carries at least one management fee invoice in the three months up to the day the invoice is raised
      value: >-
        the mean of the monthly management fee printed against the service model standing on the contract and the
        management fee most recently invoiced, rounded to the nearest cent
    - when: >-
        the service model standing on the contract took effect within the billing period being invoiced and the
        contract carries no management fee invoice in the three months up to the day the invoice is raised
      value: the management fee most recently invoiced on the contract
    - when: otherwise
      value: the monthly management fee printed against the service model standing on the contract
    baseline:
      base_fee_usd: P('management_fee_monthly_usd')
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: escalation_step_anchor
    effect: method
    decides: escalation_steps
    bindings:
    - contract_months
    - service_months
    - service_gap_days
    - escalation_steps
    ladder:
    - when: >-
        a first service day is recorded on the contract and it falls more than thirty calendar days after the first
        day of the contract term
      method: >-
        the escalation steps are the whole years between the first service day and the day the invoice is raised
    - when: >-
        a first service day is recorded on the contract and it falls thirty calendar days or less after the first
        day of the contract term
      method: >-
        the escalation steps are the whole years between the first day of the term and the day the invoice is raised
    - when: otherwise
      method: no escalation step is taken
    baseline:
      escalation_steps: int(contract_months / 12)
    evidence:
    - date
    cross_difficulty: null
  - id: settlement_record_escalation_rate
    effect: parameter
    decides: escalation_rate_pct
    bindings:
    - late_charges_24m
    - payments_12m
    - mgmt_fees_12m
    - escalation_rate_pct
    ladder:
    - when: >-
        the contract carries no late charge in the twenty-four months up to the day the invoice is raised and the
        payments received over the twelve months up to that day reach the management fees invoiced over those twelve
        months
      value: the clean account escalation rate
    - when: >-
        the contract carries no late charge in the twenty-four months up to the day the invoice is raised and the
        payments received over the twelve months up to that day fall short of the management fees invoiced over
        those twelve months
      value: the partially settled escalation rate
    - when: otherwise
      value: the annual price escalation printed against the service model
    baseline:
      escalation_rate_pct: P('annual_price_escalation_pct')
    evidence:
    - history
    cross_difficulty: null
  - id: pantry_colocation_allowance
    effect: parameter
    decides: colocation_pct
    bindings:
    - pantry_status
    - pantry_fees_12m
    - colocation_pct
    ladder:
    - when: >-
        the client holds an office pantry programme standing open and the pantry programme fees invoiced to that
        client over the twelve months up to the day the invoice is raised reach the pantry co-location threshold
      value: the major pantry co-location rate
    - when: >-
        the client holds an office pantry programme standing open and those pantry programme fees fall below the
        pantry co-location threshold
      value: the minor pantry co-location rate
    - when: otherwise
      value: the nil co-location rate
    baseline:
      colocation_pct: K('no_colocation_pct')
    evidence:
    - cross_category
    - history
    cross_difficulty: pantry
  - id: suspended_day_relief_basis
    effect: method
    decides: suspended_day_relief_usd
    bindings:
    - standby_charges_12m
    - suspended_days_ytd
    - suspended_day_relief_usd
    ladder:
    - when: >-
        two or more standby charges stand on the contract in the twelve months up to the day the invoice is raised
        and ten or more suspended calendar days stand against the current contract year
      method: >-
        the escalated fee is relieved in the share that those suspended calendar days bear to a thirty-day month,
        the figure so obtained rounded to the nearest cent
    - when: >-
        fewer than two standby charges stand on the contract in those twelve months and ten or more suspended calendar
        days stand against the current contract year
      method: >-
        the escalated fee is relieved in the share that the days falling within whole weeks of those suspended days
        bear to a thirty-day month, the figure so obtained rounded to the nearest cent
    - when: otherwise
      method: no suspended day relief is taken
    baseline:
      suspended_day_relief_usd: '0.0'
    evidence:
    - history
    cross_difficulty: null
  - id: subsidy_commitment_surcharge
    effect: parameter
    decides: subsidy_shortfall_pct
    bindings:
    - subsidy_funded_12m
    - subsidy_shortfall_pct
    ladder:
    - when: >-
        the subsidy funding lots paid in over the twelve months up to the day the invoice is raised fall below half
        the minimum annual client subsidy printed against the service model and the site's reported headcount reaches
        the large site headcount
      value: the deep subsidy shortfall rate
    - when: >-
        those funding lots reach half the minimum annual client subsidy but fall below it and the site's reported
        headcount reaches the large site headcount
      value: the partial subsidy shortfall rate
    - when: otherwise
      value: the nil subsidy shortfall rate
    baseline:
      subsidy_shortfall_pct: K('no_subsidy_shortfall_pct')
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: >-
      Each billing period a workplace cafe management contract is invoiced for its management fee, worked out from
      the monthly management fee printed against the service model standing on the contract on the day the invoice
      is raised. That fee is the base fee, the escalation steps are the whole years between the first day of the
      contract term and the day the invoice is raised, and the escalation rate is the annual price escalation printed
      against the service model. The base fee is carried forward at the escalation rate once for each escalation
      step, and the figure so obtained is the escalated fee, rounded to the nearest cent. The co-location allowance
      is nil, the suspended day relief is nil and the subsidy commitment surcharge is nil. The co-location allowance
      is the co-location rate taken on the escalated fee, rounded to the nearest cent. The subsidy commitment surcharge
      is the subsidy shortfall rate taken on the escalated fee, rounded to the nearest cent. The management fee
      worked out under this rule carries the allowances, reliefs and surcharges set out below in place of any portfolio
      band discount. The management fee is recorded against the billing period it covers. The co-location allowance
      and the suspended day relief are each worked out on the escalated fee and subtracted from it, the subsidy
      commitment surcharge is worked out on the escalated fee and added to it, and the management fee invoiced is
      the escalated fee less those two reductions plus that surcharge, rounded to the nearest cent and never below
      nil.
    params:
    - management_fee_monthly_usd
    - annual_price_escalation_pct
    - no_colocation_pct
    - no_subsidy_shortfall_pct
  inputs:
    history:
    - table: cafe_ledger
      aggregate: count
      field: cafe_ledger_id
      within_months: 3
      filters:
        charge_code: management_fee
    - table: cafe_ledger
      aggregate: latest
      field: amount_usd
      within_months: null
      filters:
        charge_code: management_fee
    - table: cafe_ledger
      aggregate: sum
      field: amount_usd
      within_months: 12
      filters:
        charge_code: invoice_payment
    - table: cafe_ledger
      aggregate: sum
      field: amount_usd
      within_months: 12
      filters:
        charge_code: management_fee
    - table: cafe_ledger
      aggregate: count
      field: cafe_ledger_id
      within_months: 24
      filters:
        charge_code: late_fee
    - table: cafe_ledger
      aggregate: count
      field: cafe_ledger_id
      within_months: 12
      filters:
        charge_code: standby_fee
    - table: cafe_ledger
      aggregate: sum
      field: amount_usd
      within_months: 12
      filters:
        charge_code: subsidy_funding
    - category: pantry
      table: pantry_ledger
      aggregate: sum
      field: amount_usd
      within_months: 12
      filters:
        charge_code: program_fee
    cross_category:
    - pantry
- id: cafe_ext_service_credit_settlement
  base_policy_refs:
  - cafe_service_credit_terms
  overwrite:
  - base_policy: cafe_service_credit_terms
    superseded_clause: >-
      Each missed meal period earns the percentage of the monthly management fee printed against the service model,
      and the credits allowed in one billing period are held to the ceiling printed against the same service model.
    replaced_by: >-
      The credit for one meal period is the fee base taken at the credit rate and rounded to the nearest cent, the
      credit worked out is that figure multiplied by the credited meal periods and rounded to the nearest cent,
      and the credit allowed is the lesser of the credit worked out and the billing period ceiling, which is the
      monthly management fee printed against the service model in force taken at the service credit ceiling printed
      against that same service model.
  - base_policy: cafe_service_credit_terms
    superseded_clause: >-
      Whether a meal period was missed is settled from the approved service credit claims on the contract for that
      period, and not from the client's recollection of which days the cafe was shut.
    replaced_by: >-
      Where the cafe has been serving for more than the long service term and a resumption request stands approved
      on the contract, the claim days counted are those approved over the wide claim window up to the day the credit
      is worked out; where the cafe has been serving for more than the long service term and no resumption request
      stands approved on the contract, the claim days counted are those approved over the medium claim window up
      to that day; and where the cafe has been serving for the long service term or less, the claim days counted
      are those approved over the standard claim window up to that day.
  - base_policy: cafe_service_credit_terms
    superseded_clause: >-
      A service credit is allowed only when the claim reaches Larkspur Table no later than the claim window for
      the service model, counted in calendar days from the day the invoice covering the missed meal period was posted.
    replaced_by: >-
      Where the cafe has been serving for more than the long service term and a resumption request stands approved
      on the contract, the claim days counted are those approved over the wide claim window up to the day the credit
      is worked out; where the cafe has been serving for more than the long service term and no resumption request
      stands approved on the contract, the claim days counted are those approved over the medium claim window up
      to that day; and where the cafe has been serving for the long service term or less, the claim days counted
      are those approved over the standard claim window up to that day.
  - base_policy: cafe_service_credit_terms
    superseded_clause: >-
      Claim window days are counted as calendar days from the day after the invoice posting day, every day of the
      week counts, and a claim arriving on the boundary day itself is still in time.
    replaced_by: >-
      The claim days counted are the service credit claims standing approved on the contract over the standard claim
      window up to the day the credit is worked out, no claim day is set aside, and the net claim days are the claim
      days counted.
  - base_policy: cafe_service_credit_terms
    superseded_clause: >-
      Where a contracted meal period was not served, the client is credited for it, and the credit is allowed against
      the invoice that charged for the period rather than paid out.
    replaced_by: >-
      The credit is allowed against the management fee invoice most recently raised on the contract and is quoted
      against the billing period that invoice covers, whatever periods the claims behind it concern.
  - base_policy: cafe_service_credit_terms
    superseded_clause: >-
      A meal period missed because the client closed the building, moved the floor or asked for the pause is not
      a missed meal period for this purpose, and earns no credit.
    replaced_by: >-
      Where two or more suspension requests stand approved on the contract and ten or more suspended calendar days
      stand against the current contract year, the extended closure claim days are set aside; where exactly one
      suspension request stands approved on the contract and ten or more suspended calendar days stand against the
      current contract year, the short closure claim days are set aside; and where fewer than ten suspended calendar
      days stand against the current contract year, no claim day is set aside.
  trigger: on_request
  subject:
  - cafe_service_credit_issued
  computes: credit_amount_usd
  target_tool: issue_service_credit_9f99d1a6
  params:
    repeat_disruption_credit_pct: 5.25
    recurring_disruption_credit_pct: 4.25
    extended_closure_periods_set_aside: 2
    short_closure_periods_set_aside: 1
    no_periods_set_aside: 0
    long_service_months: 24
    wide_claim_window_months: 12
    medium_claim_window_months: 6
    standard_claim_window_months: 3
  rule: >-
    Where contracted meal periods were not served, the client is credited for them, and the credit is allowed rather
    than paid out. The credit is allowed against the management fee invoice most recently raised on the contract
    and is quoted against the billing period that invoice covers, whatever periods the claims behind it concern.
    The claim days counted are the service credit claims standing approved on the contract over the standard claim
    window up to the day the credit is worked out, no claim day is set aside, and the net claim days are the claim
    days counted. Each net claim day is credited as one meal period, and each credited meal period earns the credit
    rate printed against the service model in force applied to the fee base, which is the monthly management fee
    printed against that service model. The credit for one meal period is the fee base taken at the credit rate
    and rounded to the nearest cent, the credit worked out is that figure multiplied by the credited meal periods
    and rounded to the nearest cent, and the credit allowed is the lesser of the credit worked out and the billing
    period ceiling, which is the monthly management fee printed against the service model in force taken at the
    service credit ceiling printed against that same service model. The credit allowed is not worked out until the
    management fee for the billing period in which it is worked out stands invoiced on the contract's ledger. Where
    the cafe has been serving for more than the long service term and a resumption request stands approved on the
    contract, the claim days counted are those approved over the wide claim window up to the day the credit is worked
    out; where the cafe has been serving for more than the long service term and no resumption request stands approved
    on the contract, the claim days counted are those approved over the medium claim window up to that day; and
    where the cafe has been serving for the long service term or less, the claim days counted are those approved
    over the standard claim window up to that day. Where two or more suspension requests stand approved on the contract
    and ten or more suspended calendar days stand against the current contract year, the extended closure claim
    days are set aside; where exactly one suspension request stands approved on the contract and ten or more suspended
    calendar days stand against the current contract year, the short closure claim days are set aside; and where
    fewer than ten suspended calendar days stand against the current contract year, no claim day is set aside. Where
    the service model serves two or more meal periods each operating day and three or more net claim days stand,
    each net claim day is credited for every meal period the service model serves that day; where the service model
    serves two or more meal periods each operating day and fewer than three net claim days stand, each net claim
    day is credited for every meal period the service model serves that day less one period in all, and never below
    nil; and where the service model serves one meal period each operating day, each net claim day is credited as
    one meal period. Where six or more service credit claims have been logged on the contract in the twelve months
    up to the day the credit is worked out, each credited meal period earns the repeat disruption credit rate; where
    three, four or five such claims have been logged over those twelve months, each credited meal period earns the
    recurring disruption credit rate; and where fewer than three such claims have been logged over those twelve
    months, each credited meal period earns the credit rate printed against the service model. Where three or more
    management fee invoices stand on the contract in the three months up to the day the credit is worked out and
    the management fee most recently invoiced stands above the monthly management fee printed against the service
    model in force, the fee base is the management fee most recently invoiced; where three or more management fee
    invoices stand over those three months and the management fee most recently invoiced stands at or below the
    monthly management fee printed against the service model in force, the fee base is the mean of the management
    fees invoiced over those three months, rounded to the nearest cent; and where fewer than three management fee
    invoices stand over those three months, the fee base is the monthly management fee printed against the service
    model in force.
  prerequisite:
  - problem: cafe_ext_management_fee_invoice
    kind: value_input
    gate: fee_base_usd
    form: state
    policy_source: >-
      The credit allowed is not worked out until the management fee for the billing period in which it is worked
      out stands invoiced on the contract's ledger.
    condition: >-
      a cafe_ledger row of charge_code management_fee whose service_period is the calendar month in which the credit
      is worked out stands against the contract.
    resolved_by: raise_management_fee_invoice_00d6d0cf
    effect: >-
      Once the management fee for the month the credit is worked out in stands invoiced, the fee base binding counts
      three management fee invoices over the last three months and reads their mean instead of falling back to the
      monthly management fee printed against the service model, and that invoice is the one the credit is quoted
      against.
  cross_category: []
  compute:
  - service_months: MONTHS(F('service_commenced_date') or F('contract_start_date'), NOW)
  - approved_resumptions: >-
      COUNT('cafe_service_requests', request_type='resumption_request', request_status='approved')
  - claim_window_months: >-
      K('wide_claim_window_months') if (service_months > K('long_service_months') and approved_resumptions >= 1)
      else (K('medium_claim_window_months') if (service_months > K('long_service_months') and approved_resumptions
      < 1) else K('standard_claim_window_months'))
  - approved_claim_days: >-
      COUNT('cafe_service_requests', within_months=claim_window_months, date_field='created_at', request_type='service_credit_claim',
      request_status='approved')
  - claims_logged_12m: >-
      COUNT('cafe_service_requests', within_months=12, date_field='created_at', request_type='service_credit_claim')
  - credit_rate_pct: >-
      K('repeat_disruption_credit_pct') if claims_logged_12m >= 6 else (K('recurring_disruption_credit_pct') if
      (claims_logged_12m >= 3 and claims_logged_12m < 6) else P('service_credit_pct_per_missed_meal_period'))
  - approved_suspensions: >-
