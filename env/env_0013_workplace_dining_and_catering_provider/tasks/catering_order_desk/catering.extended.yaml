- id: catering_service_credit_terms
  subject:
  - catering_service_credit_issued
  rule: 'Where catering arrives late or falls short of what was ordered, the client is credited against the invoice for that order rather than refunded separately. Lateness is measured from the service start time on the order to the time the team actually began service, and each complete quarter hour late earns the percentage of order value printed against the service level. An upheld food quality complaint earns the quality credit percentage printed against the service level, and where an order is both late and short the two credits are added together rather than the larger being taken alone. Credits against one order are held to the ceiling printed against the service level, and a claim worth more than the ceiling is settled at the ceiling and closed rather than carried onto the next order. A credit is allowed only when the claim reaches Larkspur Table no later than the claim window for the service level, counted in calendar days from the day the order was delivered. Claim window days are counted as calendar days from the day after delivery, every day of the week counts, and a claim arriving on the boundary day itself is still in time; calendar days are never converted into full 24-hour periods. Lateness caused by the client — a room that was not free, a security desk that held the team, a delivery address changed on the day — is not a late delivery for this purpose and earns no credit. A credit is never allowed against an order that was cancelled and never delivered, since no service was given to fall short of.

    '
  eligibility:
  - id: credit_claim_window
    applies_to:
    - catering_service_credit_issued
    kind: time
    condition: A credit is allowed only when the claim reaches Larkspur Table no later than the claim window for the service level, counted in calendar days from the day the order was delivered.
    evidence_fields:
    - catering_orders.posted_date
    - catering_orders.order_reference
    - catering_orders.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - catering_orders.order_reference
      action_bindings:
        catering_orders.order_reference: order_reference
    temporal_basis:
      clock: frozen_time
      anchor_event: the day the order was delivered
      anchor_source: catering_orders.posted_date
      relation: not_after
      duration_source: variants.service_credit_claim_window_days
      unit: calendar_days
      counting_rule: Claim window days are counted as calendar days from the day after delivery, every day of the week counts, and a claim arriving on the boundary day itself is still in time; calendar days are never converted into full 24-hour periods.
      boundary: inclusive
  params:
