  rule: 'Catering invoices fall due the number of days after the invoice date printed against the service level, and a payment is recorded against the single invoice it settles. A payment is accepted on an agreement that stands active, on credit hold or closed, because a client settling arrears is exactly how a hold is lifted and a closed agreement may still carry a balance. A payment that clears the whole unsettled balance on an agreement standing on credit hold is the trigger for the hold to be reviewed, and ordering reopens once the review is done rather than automatically on receipt. A part payment settles the named invoice in part and never spills onto another invoice; an overpayment leaves the excess on the agreement to be applied to the next invoice raised. A late charge is the monthly late percentage printed against the service level applied to the amount still outstanding once the grace days printed against the same service level have passed, held to the late charge ceiling printed against that service level. Where an invoice is disputed in writing before the grace days expire, no late charge is raised while the dispute stands open, and the due date is not moved.

    '
