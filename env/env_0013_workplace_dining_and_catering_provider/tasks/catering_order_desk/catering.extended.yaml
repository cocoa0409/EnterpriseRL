- id: catering_ext_agreement_closure_settlement
  base_policy_refs:
  - catering_hold_and_closure_terms
  overwrite:
  - base_policy: catering_hold_and_closure_terms
    superseded_clause: Where the client's annual spend for the agreement year has not reached the minimum printed against the service level, the shortfall is settled on the final invoice rather than waived at closure.
    replaced_by: Where the spend counted reaches three quarters of the minimum tested against and the agreement carried three or more invoiced orders in those twelve months, none of the shortfall falls due; where the spend counted reaches half of the minimum tested against and the agreement carried three or more invoiced orders in that window, half of the shortfall falls due.
  - base_policy: catering_hold_and_closure_terms
    superseded_clause: Notice to end the agreement is the number of calendar days printed against the service level, and orders already accepted for service days inside the notice period are served rather than cancelled.
    replaced_by: Where the agreement is ended with more than twice the notice days printed against the catering service level still to run before the last day of its term and the spend counted has not reached three quarters of the minimum tested against, the early-exit charge is a tenth of the minimum tested against; where it is ended with more than the notice days but not more than twice that many still to run and the spend counted has not reached three quarters of the minimum tested against, the early-exit charge is a twentieth of the minimum tested against.
  trigger: on_request
  subject:
  - catering_agreement_closed
  computes: closing_settlement_usd
  target_tool: confirm_agreement_closure_1e20ba9d
  params:
    wide_programme_benchmark_share: 0.75
    programme_benchmark_share: 0.875
    long_relationship_months: 24
    established_relationship_months: 12
    counted_spend_window_months: 12
    near_miss_share: 0.75
    half_share: 0.5
    shortfall_relief_orders: 3
    shortfall_rate_none_pct: 0.0
    shortfall_rate_half_pct: 50.0
    shortfall_rate_whole_pct: 100.0
    late_charge_long_days: 60
    late_charge_short_days: 30
    late_multiple_long: 2
    late_multiple_short: 1
    early_exit_notice_multiple: 2
    early_exit_high_share: 0.1
    early_exit_low_share: 0.05
  rule: The closing figure of a corporate catering service agreement is the amount the client is asked for on the final catering statement when the agreement ends. The closing figure is not fixed until every order delivered on the agreement carries an invoice entry. The closing figure is the shortfall that falls due on the agreement's spend commitment, then the late charge, then the early-exit charge, then the amount standing unsettled on the agreement, added in that order and rounded to two decimal places only at the end. The minimum tested against is the minimum annual catering spend printed against the catering service level. Where the agreement has run for two years or more and the client holds a cafe contract at the agreement's delivery site that stands active and whose service model permits catering to be ordered out of that kitchen, the minimum tested against is three quarters of the minimum annual catering spend printed against that service level; where the agreement has run for at least a year but less than two years and the client holds a cafe contract at that site that stands active, the minimum tested against is seven eighths of that minimum annual catering spend. The spend counted toward that minimum is what has been invoiced on the agreement in the twelve months ending on the day it closes. Where cancellation charges stand raised on the agreement in those twelve months and service credits stand allowed in the same twelve months, the spend counted is what has been invoiced in that window together with those cancellation charges and less those service credits; where cancellation charges stand raised in that window and no service credit stands allowed in it, the spend counted is what has been invoiced in that window together with those cancellation charges. The shortfall is the minimum tested against less the spend counted, and never less than nothing. The whole of the shortfall falls due. Where the spend counted reaches three quarters of the minimum tested against and the agreement carried three or more invoiced orders in those twelve months, none of the shortfall falls due; where the spend counted reaches half of the minimum tested against and the agreement carried three or more invoiced orders in that window, half of the shortfall falls due. No late charge is raised on the closing figure. Where the most recent payment entry on the agreement fell more than sixty days before the day it closes and an amount stands unsettled on it, the late charge is twice the monthly late percentage printed against the catering service level; where the most recent payment entry fell more than thirty but not more than sixty days before that day and an amount stands unsettled on it, the late charge is that monthly late percentage once. The late charge is worked out on the amount standing unsettled on the agreement and is held to the late charge ceiling printed against the catering service level, the ceiling applying after the percentage has been taken. No early-exit charge is raised on the closing figure. Where the agreement is ended with more than twice the notice days printed against the catering service level still to run before the last day of its term and the spend counted has not reached three quarters of the minimum tested against, the early-exit charge is a tenth of the minimum tested against; where it is ended with more than the notice days but not more than twice that many still to run and the spend counted has not reached three quarters of the minimum tested against, the early-exit charge is a twentieth of the minimum tested against. The amount standing unsettled on the agreement is carried onto the closing figure in full.
  prerequisite:
  - problem: catering_ext_delivered_order_invoicing
    kind: value_input
    gate: invoiced_12m
    form: state
    policy_source: The closing figure is not fixed until every order delivered on the agreement carries an invoice entry.
    condition: every order on the agreement that carries a delivery entry also carries an invoice entry standing against the same order reference
    resolved_by: raise_catering_invoice_cb57dc9d
    effect: the invoiced total the spend counted rests on rises by the amount of the invoice entry raised for the delivered order, which lowers the shortfall and with it the closing figure
  cross_category:
  - category: cafe
    as: branch
    reads:
    - site_code
    - status
    - variant_name
    note: 'the tier of the minimum tested against is decided from the client''s cafe contract at the agreement''s delivery site: whether it stands active, and whether its service model permits catering to be ordered out of that kitchen'
  compute:
  - months_in_force: MONTHS(F('agreement_start_date'), NOW)
  - cafe_status: CFIELD('cafe','status', site_code=F('delivery_site_code'))
  - cafe_takes_catering: CPARAM('cafe','catering_from_cafe_enabled', site_code=F('delivery_site_code'))
  - minimum_benchmark: RND(P('min_annual_spend_usd') * K('wide_programme_benchmark_share'), 2) if (months_in_force >= K('long_relationship_months') and cafe_status == 'active' and cafe_takes_catering == True) else (RND(P('min_annual_spend_usd') * K('programme_benchmark_share'), 2) if (months_in_force >= K('established_relationship_months') and months_in_force < K('long_relationship_months') and cafe_status == 'active') else P('min_annual_spend_usd'))
  - invoiced_12m: SUM('catering_orders','amount_usd', within_months=K('counted_spend_window_months'), date_field='posted_date', event_type='catering_order_invoiced')
  - cancel_charges_12m: SUM('catering_orders','amount_usd', within_months=K('counted_spend_window_months'), date_field='posted_date', event_type='catering_cancellation_fee_posted')
  - credits_12m: SUM('catering_orders','amount_usd', within_months=K('counted_spend_window_months'), date_field='posted_date', event_type='catering_service_credit_issued')
  - cancel_count_12m: COUNT('catering_orders', within_months=K('counted_spend_window_months'), date_field='posted_date', event_type='catering_cancellation_fee_posted')
  - credit_count_12m: COUNT('catering_orders', within_months=K('counted_spend_window_months'), date_field='posted_date', event_type='catering_service_credit_issued')
  - counted_spend: RND(invoiced_12m + cancel_charges_12m - credits_12m, 2) if (cancel_count_12m > 0 and credit_count_12m > 0) else (RND(invoiced_12m + cancel_charges_12m, 2) if (cancel_count_12m > 0 and credit_count_12m == 0) else invoiced_12m)
  - shortfall_base: MX(0.0, RND(minimum_benchmark - counted_spend, 2))
  - orders_invoiced_12m: COUNT('catering_orders', within_months=K('counted_spend_window_months'), date_field='posted_date', event_type='catering_order_invoiced')
  - shortfall_rate_pct: K('shortfall_rate_none_pct') if (counted_spend >= RND(minimum_benchmark * K('near_miss_share'), 2) and orders_invoiced_12m >= K('shortfall_relief_orders')) else (K('shortfall_rate_half_pct') if (counted_spend >= RND(minimum_benchmark * K('half_share'), 2) and orders_invoiced_12m >= K('shortfall_relief_orders')) else K('shortfall_rate_whole_pct'))
  - shortfall_due: RND(shortfall_base * shortfall_rate_pct / 100, 2)
  - unsettled: F('receivable_balance_usd')
  - last_payment_date: LATEST('catering_orders','posted_date', date_field='posted_date', event_type='catering_order_payment_posted')
  - days_since_last_payment: DAYS(last_payment_date, NOW)
  - late_charge_pct: RND(P('late_fee_monthly_pct') * K('late_multiple_long'), 2) if (days_since_last_payment > K('late_charge_long_days') and unsettled > 0) else (RND(P('late_fee_monthly_pct') * K('late_multiple_short'), 2) if (days_since_last_payment > K('late_charge_short_days') and days_since_last_payment <= K('late_charge_long_days') and unsettled > 0) else 0.0)
  - late_charge: MN(RND(unsettled * late_charge_pct / 100, 2), P('late_fee_cap_usd'))
  - days_to_term_end: DAYS(NOW, F('agreement_end_date'))
  - early_exit_charge: RND(minimum_benchmark * K('early_exit_high_share'), 2) if (days_to_term_end > K('early_exit_notice_multiple') * P('agreement_notice_days') and counted_spend < RND(minimum_benchmark * K('near_miss_share'), 2)) else (RND(minimum_benchmark * K('early_exit_low_share'), 2) if (days_to_term_end > P('agreement_notice_days') and days_to_term_end <= K('early_exit_notice_multiple') * P('agreement_notice_days') and counted_spend < RND(minimum_benchmark * K('near_miss_share'), 2)) else 0.0)
  - result: RND(shortfall_due + late_charge + early_exit_charge + unsettled, 2)
  compute_basis:
    months_in_force: Where the agreement has run for two years or more and the client holds a cafe contract at the agreement's delivery site that stands active and whose service model permits catering to be ordered out of that kitchen, the minimum tested against is three quarters of the minimum annual catering spend printed against that service level; where the agreement has run for at least a year but less than two years and the client holds a cafe contract at that site that stands active, the minimum tested against is seven eighths of that minimum annual catering spend.
    cafe_status: Where the agreement has run for two years or more and the client holds a cafe contract at the agreement's delivery site that stands active and whose service model permits catering to be ordered out of that kitchen, the minimum tested against is three quarters of the minimum annual catering spend printed against that service level; where the agreement has run for at least a year but less than two years and the client holds a cafe contract at that site that stands active, the minimum tested against is seven eighths of that minimum annual catering spend.
    cafe_takes_catering: Where the agreement has run for two years or more and the client holds a cafe contract at the agreement's delivery site that stands active and whose service model permits catering to be ordered out of that kitchen, the minimum tested against is three quarters of the minimum annual catering spend printed against that service level; where the agreement has run for at least a year but less than two years and the client holds a cafe contract at that site that stands active, the minimum tested against is seven eighths of that minimum annual catering spend.
    minimum_benchmark: The minimum tested against is the minimum annual catering spend printed against the catering service level. Where the agreement has run for two years or more and the client holds a cafe contract at the agreement's delivery site that stands active and whose service model permits catering to be ordered out of that kitchen, the minimum tested against is three quarters of the minimum annual catering spend printed against that service level; where the agreement has run for at least a year but less than two years and the client holds a cafe contract at that site that stands active, the minimum tested against is seven eighths of that minimum annual catering spend.
    invoiced_12m: The spend counted toward that minimum is what has been invoiced on the agreement in the twelve months ending on the day it closes.
    cancel_charges_12m: Where cancellation charges stand raised on the agreement in those twelve months and service credits stand allowed in the same twelve months, the spend counted is what has been invoiced in that window together with those cancellation charges and less those service credits; where cancellation charges stand raised in that window and no service credit stands allowed in it, the spend counted is what has been invoiced in that window together with those cancellation charges.
    credits_12m: Where cancellation charges stand raised on the agreement in those twelve months and service credits stand allowed in the same twelve months, the spend counted is what has been invoiced in that window together with those cancellation charges and less those service credits; where cancellation charges stand raised in that window and no service credit stands allowed in it, the spend counted is what has been invoiced in that window together with those cancellation charges.
    cancel_count_12m: Where cancellation charges stand raised on the agreement in those twelve months and service credits stand allowed in the same twelve months, the spend counted is what has been invoiced in that window together with those cancellation charges and less those service credits; where cancellation charges stand raised in that window and no service credit stands allowed in it, the spend counted is what has been invoiced in that window together with those cancellation charges.
    credit_count_12m: Where cancellation charges stand raised on the agreement in those twelve months and service credits stand allowed in the same twelve months, the spend counted is what has been invoiced in that window together with those cancellation charges and less those service credits; where cancellation charges stand raised in that window and no service credit stands allowed in it, the spend counted is what has been invoiced in that window together with those cancellation charges.
    counted_spend: The spend counted toward that minimum is what has been invoiced on the agreement in the twelve months ending on the day it closes. Where cancellation charges stand raised on the agreement in those twelve months and service credits stand allowed in the same twelve months, the spend counted is what has been invoiced in that window together with those cancellation charges and less those service credits; where cancellation charges stand raised in that window and no service credit stands allowed in it, the spend counted is what has been invoiced in that window together with those cancellation charges.
    shortfall_base: The shortfall is the minimum tested against less the spend counted, and never less than nothing.
    orders_invoiced_12m: Where the spend counted reaches three quarters of the minimum tested against and the agreement carried three or more invoiced orders in those twelve months, none of the shortfall falls due; where the spend counted reaches half of the minimum tested against and the agreement carried three or more invoiced orders in that window, half of the shortfall falls due.
    shortfall_rate_pct: The whole of the shortfall falls due. Where the spend counted reaches three quarters of the minimum tested against and the agreement carried three or more invoiced orders in those twelve months, none of the shortfall falls due; where the spend counted reaches half of the minimum tested against and the agreement carried three or more invoiced orders in that window, half of the shortfall falls due.
    shortfall_due: The shortfall is the minimum tested against less the spend counted, and never less than nothing.
    unsettled: The amount standing unsettled on the agreement is carried onto the closing figure in full.
    last_payment_date: Where the most recent payment entry on the agreement fell more than sixty days before the day it closes and an amount stands unsettled on it, the late charge is twice the monthly late percentage printed against the catering service level; where the most recent payment entry fell more than thirty but not more than sixty days before that day and an amount stands unsettled on it, the late charge is that monthly late percentage once.
    days_since_last_payment: Where the most recent payment entry on the agreement fell more than sixty days before the day it closes and an amount stands unsettled on it, the late charge is twice the monthly late percentage printed against the catering service level; where the most recent payment entry fell more than thirty but not more than sixty days before that day and an amount stands unsettled on it, the late charge is that monthly late percentage once.
    late_charge_pct: No late charge is raised on the closing figure. Where the most recent payment entry on the agreement fell more than sixty days before the day it closes and an amount stands unsettled on it, the late charge is twice the monthly late percentage printed against the catering service level; where the most recent payment entry fell more than thirty but not more than sixty days before that day and an amount stands unsettled on it, the late charge is that monthly late percentage once.
    late_charge: The late charge is worked out on the amount standing unsettled on the agreement and is held to the late charge ceiling printed against the catering service level, the ceiling applying after the percentage has been taken.
    days_to_term_end: Where the agreement is ended with more than twice the notice days printed against the catering service level still to run before the last day of its term and the spend counted has not reached three quarters of the minimum tested against, the early-exit charge is a tenth of the minimum tested against; where it is ended with more than the notice days but not more than twice that many still to run and the spend counted has not reached three quarters of the minimum tested against, the early-exit charge is a twentieth of the minimum tested against.
    early_exit_charge: No early-exit charge is raised on the closing figure. Where the agreement is ended with more than twice the notice days printed against the catering service level still to run before the last day of its term and the spend counted has not reached three quarters of the minimum tested against, the early-exit charge is a tenth of the minimum tested against; where it is ended with more than the notice days but not more than twice that many still to run and the spend counted has not reached three quarters of the minimum tested against, the early-exit charge is a twentieth of the minimum tested against.
    result: The closing figure is the shortfall that falls due on the agreement's spend commitment, then the late charge, then the early-exit charge, then the amount standing unsettled on the agreement, added in that order and rounded to two decimal places only at the end.
  factors:
  - id: programme_spend_benchmark
    effect: parameter
    decides: minimum_benchmark
    bindings:
    - months_in_force
    - cafe_status
    - cafe_takes_catering
    - minimum_benchmark
    ladder:
    - when: the agreement has run for two years or more and the client holds a cafe contract at the agreement's delivery site that stands active and whose service model permits catering to be ordered out of that kitchen
      value: three quarters of the minimum annual catering spend printed against the catering service level
    - when: the agreement has run for at least a year but less than two years and the client holds a cafe contract at that site that stands active
      value: seven eighths of the minimum annual catering spend printed against the catering service level
    - when: otherwise
      value: P('min_annual_spend_usd')
    baseline:
      minimum_benchmark: P('min_annual_spend_usd')
    evidence:
    - date
    - cross_category
    cross_difficulty: cafe
  - id: counted_spend_basis
    effect: method
    decides: counted_spend
    bindings:
    - invoiced_12m
    - cancel_charges_12m
    - credits_12m
    - cancel_count_12m
    - credit_count_12m
    - counted_spend
    ladder:
    - when: cancellation charges stand raised on the agreement in the twelve months ending on the day it closes and service credits stand allowed in the same twelve months
      method: the spend counted is what has been invoiced in that window together with those cancellation charges and less those service credits
    - when: cancellation charges stand raised in that window and no service credit stands allowed in it
      method: the spend counted is what has been invoiced in that window together with those cancellation charges
    - when: otherwise
      method: the spend counted is what has been invoiced in that window
    baseline:
      counted_spend: invoiced_12m
    evidence:
    - history
    cross_difficulty: null
  - id: shortfall_share_due
    effect: parameter
    decides: shortfall_rate_pct
    bindings:
    - orders_invoiced_12m
    - shortfall_rate_pct
    ladder:
    - when: the spend counted reaches three quarters of the minimum tested against and the agreement carried three or more invoiced orders in the twelve months ending on the day it closes
      value: K('shortfall_rate_none_pct')
    - when: the spend counted reaches half of the minimum tested against and the agreement carried three or more invoiced orders in that window
      value: K('shortfall_rate_half_pct')
    - when: otherwise
      value: K('shortfall_rate_whole_pct')
    baseline:
      shortfall_rate_pct: K('shortfall_rate_whole_pct')
    evidence:
    - history
    cross_difficulty: null
  - id: closing_late_charge_rate
    effect: parameter
    decides: late_charge_pct
    bindings:
    - last_payment_date
    - days_since_last_payment
    - late_charge_pct
    ladder:
    - when: the most recent payment entry on the agreement fell more than sixty days before the day it closes and an amount stands unsettled on it
      value: twice the monthly late percentage printed against the catering service level
    - when: the most recent payment entry fell more than thirty but not more than sixty days before that day and an amount stands unsettled on it
      value: the monthly late percentage printed against the catering service level, taken once
    - when: otherwise
      value: no late charge
    baseline:
      late_charge_pct: '0.0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: early_exit_charge_share
    effect: parameter
    decides: early_exit_charge
    bindings:
    - days_to_term_end
    - early_exit_charge
    ladder:
    - when: the agreement is ended with more than twice the notice days printed against the catering service level still to run before the last day of its term and the spend counted has not reached three quarters of the minimum tested against
      value: a tenth of the minimum tested against
    - when: the agreement is ended with more than the notice days but not more than twice that many still to run and the spend counted has not reached three quarters of the minimum tested against
      value: a twentieth of the minimum tested against
    - when: otherwise
      value: no early-exit charge
    baseline:
      early_exit_charge: '0.0'
    evidence:
    - date
    cross_difficulty: null
  baseline:
    rule: The closing figure of a corporate catering service agreement is the amount the client is asked for on the final catering statement when the agreement ends. The closing figure is the shortfall that falls due on the agreement's spend commitment, then the late charge, then the early-exit charge, then the amount standing unsettled on the agreement, added in that order and rounded to two decimal places only at the end. The minimum tested against is the minimum annual catering spend printed against the catering service level. The spend counted toward that minimum is what has been invoiced on the agreement in the twelve months ending on the day it closes. The shortfall is the minimum tested against less the spend counted, and never less than nothing. The whole of the shortfall falls due. No late charge is raised on the closing figure. The late charge is worked out on the amount standing unsettled on the agreement and is held to the late charge ceiling printed against the catering service level, the ceiling applying after the percentage has been taken. No early-exit charge is raised on the closing figure. The amount standing unsettled on the agreement is carried onto the closing figure in full.
    params:
    - counted_spend_window_months
    - min_annual_spend_usd
    - late_fee_cap_usd
  inputs:
    history:
    - table: catering_orders
      aggregate: sum
      field: amount_usd
      within_months: 12
      filters:
        event_type: catering_order_invoiced
    - table: catering_orders
      aggregate: sum
      field: amount_usd
      within_months: 12
      filters:
        event_type: catering_cancellation_fee_posted
    - table: catering_orders
      aggregate: sum
      field: amount_usd
      within_months: 12
      filters:
        event_type: catering_service_credit_issued
    - table: catering_orders
      aggregate: latest
      field: posted_date
      within_months: null
      filters:
        event_type: catering_order_payment_posted
    cross_category:
    - cafe
- id: catering_ext_client_cancellation_registration
  base_policy_refs:
  - catering_cancellation_charges
  - catering_amendment_terms
  - catering_onboarding_terms
  overwrite:
  - base_policy: catering_cancellation_charges
    superseded_clause: The order value the percentage is applied to is the value standing on the order at the moment notice is given, after every amendment already accepted, and never the value the order was first quoted at.
    replaced_by: The trading discount taken and the programme concession are first added into one total concession rate, and the value selected above is reduced once by that total rate; the two do not act successively, and the result is rounded to two decimal places only at the end.
  - base_policy: catering_amendment_terms
    superseded_clause: A reduction in guest count inside the free reduction band printed against the service level does not reprice the order; a reduction beyond that band reprices the order to the reduced count, and a reduction asked for after the deadline does not reprice it at all because the food has been bought.
    replaced_by: Where an amendment entry stands on the order and the guest count has been reduced by no more than the free reduction band standing on the order, the value the most recent amendment entry records stands; where an amendment entry stands on the order, the guest count has been reduced beyond the free reduction band standing on the order and that amendment was asked for no later than the guest count deadline printed against the catering service level, counted in whole days from the day the amendment was asked for to the service day and taken at twenty-four hours to the day, the value is reset to the amended guest count at the per-guest rate the order was placed at.
  - base_policy: catering_amendment_terms
    superseded_clause: Every amendment rewrites the order value, and the value that governs any later cancellation charge is the value on the order at the moment notice of cancellation is given.
    replaced_by: The trading discount taken and the programme concession are first added into one total concession rate, and the value selected above is reduced once by that total rate; the two do not act successively, and the result is rounded to two decimal places only at the end.
  - base_policy: catering_onboarding_terms
    superseded_clause: The standing discount recorded on the agreement is the discount printed against the service level unless a larger one was separately negotiated and written onto the agreement, in which case the written figure governs.
    replaced_by: Where the agreement carried three or more deliveries in the six months ending on the day notice is given, the trading discount taken is the discount written onto the agreement; where the agreement carried at least one but fewer than three deliveries in those six months, the trading discount taken is the discount printed against the catering service level.
  trigger: on_request
  subject:
  - catering_order_cancelled
  computes: standing_order_value_usd
  target_tool: register_order_cancellation_69ffeeb0
  params:
    order_history_window_months: 12
    long_relationship_months: 24
    established_relationship_months: 12
    band_orders_long: 6
    band_orders_mid: 3
    band_multiple_long: 2.0
    band_multiple_mid: 1.5
    delivery_window_months: 12
    discount_window_months: 6
    discount_orders_high: 3
    discount_orders_low: 1
    programme_concession_large_pct: 4.0
    programme_concession_small_pct: 2.0
    large_event_guests: 200
  rule: The value standing on a catering order at the moment the client gives notice of cancellation is worked out afresh from the entries the order carries rather than read off the quotation it was first placed at. The value the order was placed at stands. Where an amendment entry stands on the order and the guest count has been reduced by no more than the free reduction band standing on the order, the value the most recent amendment entry records stands; where an amendment entry stands on the order, the guest count has been reduced beyond the free reduction band standing on the order and that amendment was asked for no later than the guest count deadline printed against the catering service level, counted in whole days from the day the amendment was asked for to the service day and taken at twenty-four hours to the day, the value is reset to the amended guest count at the per-guest rate the order was placed at. The free reduction band standing on an order is the band printed against the catering service level. Where the agreement has run for two years or more and carried six or more deliveries in the twelve months ending on the day notice is given, the free reduction band standing on the order is twice the band printed against that service level; where the agreement has run for at least a year but less than two years and carried three or more deliveries in those twelve months, it is one and a half times the band printed against that service level. No trading discount is taken on the value standing. Where the agreement carried three or more deliveries in the six months ending on the day notice is given, the trading discount taken is the discount written onto the agreement; where the agreement carried at least one but fewer than three deliveries in those six months, the trading discount taken is the discount printed against the catering service level. No programme concession is taken on the value standing. Where the client holds a private event and banquet agreement billing under the same client account code as the catering agreement, that agreement stands active and the largest guest count its package handles reaches two hundred, a programme concession of four points is taken on the value standing; where the client holds such an agreement under that account code that stands active and the largest guest count its package handles falls short of two hundred, a programme concession of two points is taken. The trading discount taken and the programme concession are first added into one total concession rate, and the value selected above is reduced once by that total rate; the two do not act successively, and the result is rounded to two decimal places only at the end.
  prerequisite: []
  cross_category:
  - category: banquet
    as: branch
    reads:
    - client_account_code
    - status
    - variant_name
    note: 'the programme concession tier is decided from the client''s private event and banquet agreement billing under the same client account code: whether it stands active, and the largest guest count its package handles'
  compute:
  - placed_value: LATEST('catering_orders','amount_usd', date_field='posted_date', event_type='catering_order_placed')
  - placed_headcount: LATEST('catering_orders','headcount', date_field='posted_date', event_type='catering_order_placed')
  - service_day: LATEST('catering_orders','service_date', date_field='posted_date', event_type='catering_order_placed')
  - amendment_count: COUNT('catering_orders', within_months=K('order_history_window_months'), date_field='posted_date', event_type='catering_order_amended')
  - amended_value: LATEST('catering_orders','amount_usd', date_field='posted_date', event_type='catering_order_amended')
  - amended_headcount: LATEST('catering_orders','headcount', date_field='posted_date', event_type='catering_order_amended')
  - amendment_notice_day: LATEST('catering_orders','notice_given_date', date_field='posted_date', event_type='catering_order_amended')
  - months_in_force: MONTHS(F('agreement_start_date'), NOW)
  - delivered_12m: COUNT('catering_orders', within_months=K('delivery_window_months'), date_field='posted_date', event_type='catering_order_delivered')
  - free_band_pct: RND(P('headcount_reduction_free_pct') * K('band_multiple_long'), 2) if (months_in_force >= K('long_relationship_months') and delivered_12m >= K('band_orders_long')) else (RND(P('headcount_reduction_free_pct') * K('band_multiple_mid'), 2) if (months_in_force >= K('established_relationship_months') and months_in_force < K('long_relationship_months') and delivered_12m >= K('band_orders_mid')) else P('headcount_reduction_free_pct'))
  - reduction_pct: RND((placed_headcount - amended_headcount) * 100 / placed_headcount, 2) if amendment_count > 0 else 0.0
  - amendment_lead_hours: DAYS(amendment_notice_day, service_day) * 24 if amendment_count > 0 else 0
  - selected_value: amended_value if (amendment_count > 0 and reduction_pct <= free_band_pct) else (RND(placed_value / placed_headcount * amended_headcount, 2) if (amendment_count > 0 and reduction_pct > free_band_pct and amendment_lead_hours >= P('headcount_change_deadline_hours')) else placed_value)
  - delivered_6m: COUNT('catering_orders', within_months=K('discount_window_months'), date_field='posted_date', event_type='catering_order_delivered')
  - discount_pct: F('standing_discount_pct') if delivered_6m >= K('discount_orders_high') else (P('standing_discount_pct') if (delivered_6m >= K('discount_orders_low') and delivered_6m < K('discount_orders_high')) else 0.0)
  - banquet_status: CFIELD('banquet','status', client_account_code=F('client_account_code'))
  - banquet_max_guests: CPARAM('banquet','max_guests', client_account_code=F('client_account_code'))
  - programme_concession_pct: K('programme_concession_large_pct') if (banquet_status == 'active' and banquet_max_guests >= K('large_event_guests')) else (K('programme_concession_small_pct') if (banquet_status == 'active' and banquet_max_guests < K('large_event_guests')) else 0.0)
  - total_concession_pct: discount_pct + programme_concession_pct
  - result: RND(selected_value * (100 - total_concession_pct) / 100, 2)
  compute_basis:
