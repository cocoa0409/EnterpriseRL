      Drop-Off Catering Account:
        terms_days: =payment_terms_days
        grace_days: =late_fee_grace_days
        late_pct: =late_fee_monthly_pct
        late_cap_usd: =late_fee_cap_usd
      Delivered Buffet Account:
        terms_days: =payment_terms_days
        grace_days: =late_fee_grace_days
        late_pct: =late_fee_monthly_pct
        late_cap_usd: =late_fee_cap_usd
      Attended Buffet Account:
        terms_days: =payment_terms_days
        grace_days: =late_fee_grace_days
        late_pct: =late_fee_monthly_pct
        late_cap_usd: =late_fee_cap_usd
      Staffed Full-Service Catering Account:
