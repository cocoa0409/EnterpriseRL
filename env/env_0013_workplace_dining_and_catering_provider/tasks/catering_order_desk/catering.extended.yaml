- id: catering_amendment_terms
  subject:
  - catering_order_amended
  rule: 'An order may be amended until the guest count deadline printed against the service level, measured in whole hours before the service start time on the service date. A reduction in guest count inside the free reduction band printed against the service level does not reprice the order; a reduction beyond that band reprices the order to the reduced count, and a reduction asked for after the deadline does not reprice it at all because the food has been bought. An increase in guest count is accepted up to the increase ceiling printed against the service level and reprices the order upward; an increase beyond the ceiling is taken as a second order at the prevailing lead time and surcharges rather than folded into the first. A change of menu package inside the dietary lead hours printed against the service level is not accepted, and a change of service date is handled as a cancellation of the first order and a fresh order on the new day. Every amendment rewrites the order value, and the value that governs any later cancellation charge is the value on the order at the moment notice of cancellation is given. An amendment that raises the order value is not accepted while the agreement stands on credit hold, and an amendment that lowers it is accepted whatever the credit position.

    '
  eligibility:
  - id: amendable_state
    applies_to:
    - catering_order_amended
    kind: state
    condition: An amendment that raises the order value is not accepted while the agreement stands on credit hold, and an amendment that lowers it is accepted whatever the credit position.
    evidence_fields:
    - catering_agreements.status
    - catering_agreements.catering_agreement_id
    - catering_orders.order_reference
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - catering_orders.order_reference
      action_bindings:
        catering_orders.order_reference: order_reference
    state_contract:
      field: catering_agreements.status
      allowed:
      - active
      - credit_hold
  params:
    per_tier:
      Drop-Off Catering Account:
        change_deadline_hours: =headcount_change_deadline_hours
        free_reduction_pct: =headcount_reduction_free_pct
        increase_ceiling_pct: =headcount_increase_max_pct
        dietary_lead_hours: =dietary_accommodation_lead_hours
      Delivered Buffet Account:
        change_deadline_hours: =headcount_change_deadline_hours
        free_reduction_pct: =headcount_reduction_free_pct
        increase_ceiling_pct: =headcount_increase_max_pct
        dietary_lead_hours: =dietary_accommodation_lead_hours
      Attended Buffet Account:
        change_deadline_hours: =headcount_change_deadline_hours
        free_reduction_pct: =headcount_reduction_free_pct
        increase_ceiling_pct: =headcount_increase_max_pct
        dietary_lead_hours: =dietary_accommodation_lead_hours
      Staffed Full-Service Catering Account:
        change_deadline_hours: =headcount_change_deadline_hours
        free_reduction_pct: =headcount_reduction_free_pct
        increase_ceiling_pct: =headcount_increase_max_pct
        dietary_lead_hours: =dietary_accommodation_lead_hours
      Executive Hospitality Catering Account:
        change_deadline_hours: =headcount_change_deadline_hours
        free_reduction_pct: =headcount_reduction_free_pct
        increase_ceiling_pct: =headcount_increase_max_pct
        dietary_lead_hours: =dietary_accommodation_lead_hours
      Campus Catering Master Account:
        change_deadline_hours: =headcount_change_deadline_hours
        free_reduction_pct: =headcount_reduction_free_pct
        increase_ceiling_pct: =headcount_increase_max_pct
        dietary_lead_hours: =dietary_accommodation_lead_hours
- id: catering_cancellation_charges
  subject:
  - catering_order_cancelled
  - catering_cancellation_fee_posted
  rule: 'What a cancellation costs is set by how much notice the client gave, measured in whole hours from the day the client gives notice of the cancellation to the service start time on the service date. Notice at or beyond the free-cancellation hours printed against the service level carries no charge at all; notice inside that window but before the service day carries the within-notice percentage of the order value; and notice on the service day itself carries the same-day percentage of the order value. The order value the percentage is applied to is the value standing on the order at the moment notice is given, after every amendment already accepted, and never the value the order was first quoted at. A cancellation is registered against the order on the day notice is given, and the registration may not be made later than the registration window, counted in elapsed hours from the day the client gives notice of the cancellation. Elapsed hours run continuously from the moment notice is given, nights, weekends and public holidays included, and a registration made exactly on the boundary hour is still in time; elapsed hours are never rounded up to whole calendar days. A cancellation forced by Larkspur Table — a kitchen failure, a delivery the team cannot staff, a blackout day taken after the order was accepted — carries no charge whatever the notice given. Where the same agreement has already cancelled inside the chargeable window four times in the rolling twelve months, the within-notice percentage is charged even on notice that would otherwise have been free, and the client is told at the point of the fourth cancellation. A cancellation charge is only raised against an order that has not been delivered; once an order is delivered the charge is a quality matter and is handled as a service credit instead.

    '
  eligibility:
  - id: cancellable_state
    applies_to:
    - catering_order_cancelled
    - catering_cancellation_fee_posted
    kind: state
    condition: A cancellation charge is only raised against an order that has not been delivered; once an order is delivered the charge is a quality matter and is handled as a service credit instead.
    evidence_fields:
    - catering_agreements.status
    - catering_agreements.catering_agreement_id
    - catering_orders.order_reference
    - catering_orders.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - catering_orders.order_reference
      action_bindings:
        catering_orders.order_reference: order_reference
    state_contract:
      field: catering_agreements.status
      allowed:
      - active
      - credit_hold
  - id: registration_window
    applies_to:
    - catering_cancellation_fee_posted
    kind: time
    condition: A cancellation is registered against the order on the day notice is given, and the registration may not be made later than the registration window, counted in elapsed hours from the day the client gives notice of the cancellation.
    evidence_fields:
    - catering_orders.notice_given_date
    - catering_orders.order_reference
    - catering_orders.service_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - catering_orders.order_reference
      action_bindings:
        catering_orders.order_reference: order_reference
    temporal_basis:
      clock: frozen_time
      anchor_event: the day the client gives notice of the cancellation
      anchor_source: catering_orders.notice_given_date
      relation: not_after
      duration_source: params.registration_window_hours
      unit: elapsed_hours
      counting_rule: Elapsed hours run continuously from the moment notice is given, nights, weekends and public holidays included, and a registration made exactly on the boundary hour is still in time; elapsed hours are never rounded up to whole calendar days.
      boundary: inclusive
  params:
