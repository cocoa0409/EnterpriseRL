    amendment_count: Where an amendment entry stands on the order and the guest count has been reduced by no more than the free reduction band standing on the order, the value the most recent amendment entry records stands; where an amendment entry stands on the order, the guest count has been reduced beyond the free reduction band standing on the order and that amendment was asked for no later than the guest count deadline printed against the catering service level, counted in whole days from the day the amendment was asked for to the service day and taken at twenty-four hours to the day, the value is reset to the amended guest count at the per-guest rate the order was placed at.
    amended_value: Where an amendment entry stands on the order and the guest count has been reduced by no more than the free reduction band standing on the order, the value the most recent amendment entry records stands; where an amendment entry stands on the order, the guest count has been reduced beyond the free reduction band standing on the order and that amendment was asked for no later than the guest count deadline printed against the catering service level, counted in whole days from the day the amendment was asked for to the service day and taken at twenty-four hours to the day, the value is reset to the amended guest count at the per-guest rate the order was placed at.
    amended_headcount: Where an amendment entry stands on the order and the guest count has been reduced by no more than the free reduction band standing on the order, the value the most recent amendment entry records stands; where an amendment entry stands on the order, the guest count has been reduced beyond the free reduction band standing on the order and that amendment was asked for no later than the guest count deadline printed against the catering service level, counted in whole days from the day the amendment was asked for to the service day and taken at twenty-four hours to the day, the value is reset to the amended guest count at the per-guest rate the order was placed at.
    amendment_notice_day: Where an amendment entry stands on the order and the guest count has been reduced by no more than the free reduction band standing on the order, the value the most recent amendment entry records stands; where an amendment entry stands on the order, the guest count has been reduced beyond the free reduction band standing on the order and that amendment was asked for no later than the guest count deadline printed against the catering service level, counted in whole days from the day the amendment was asked for to the service day and taken at twenty-four hours to the day, the value is reset to the amended guest count at the per-guest rate the order was placed at.
    months_in_force: Where the agreement has run for two years or more and carried six or more deliveries in the twelve months ending on the day notice is given, the free reduction band standing on the order is twice the band printed against that service level; where the agreement has run for at least a year but less than two years and carried three or more deliveries in those twelve months, it is one and a half times the band printed against that service level.
    delivered_12m: Where the agreement has run for two years or more and carried six or more deliveries in the twelve months ending on the day notice is given, the free reduction band standing on the order is twice the band printed against that service level; where the agreement has run for at least a year but less than two years and carried three or more deliveries in those twelve months, it is one and a half times the band printed against that service level.
    free_band_pct: The free reduction band standing on an order is the band printed against the catering service level. Where the agreement has run for two years or more and carried six or more deliveries in the twelve months ending on the day notice is given, the free reduction band standing on the order is twice the band printed against that service level; where the agreement has run for at least a year but less than two years and carried three or more deliveries in those twelve months, it is one and a half times the band printed against that service level.
    reduction_pct: Where an amendment entry stands on the order and the guest count has been reduced by no more than the free reduction band standing on the order, the value the most recent amendment entry records stands; where an amendment entry stands on the order, the guest count has been reduced beyond the free reduction band standing on the order and that amendment was asked for no later than the guest count deadline printed against the catering service level, counted in whole days from the day the amendment was asked for to the service day and taken at twenty-four hours to the day, the value is reset to the amended guest count at the per-guest rate the order was placed at.
    amendment_lead_hours: Where an amendment entry stands on the order and the guest count has been reduced by no more than the free reduction band standing on the order, the value the most recent amendment entry records stands; where an amendment entry stands on the order, the guest count has been reduced beyond the free reduction band standing on the order and that amendment was asked for no later than the guest count deadline printed against the catering service level, counted in whole days from the day the amendment was asked for to the service day and taken at twenty-four hours to the day, the value is reset to the amended guest count at the per-guest rate the order was placed at.
    selected_value: The value the order was placed at stands. Where an amendment entry stands on the order and the guest count has been reduced by no more than the free reduction band standing on the order, the value the most recent amendment entry records stands; where an amendment entry stands on the order, the guest count has been reduced beyond the free reduction band standing on the order and that amendment was asked for no later than the guest count deadline printed against the catering service level, counted in whole days from the day the amendment was asked for to the service day and taken at twenty-four hours to the day, the value is reset to the amended guest count at the per-guest rate the order was placed at.
    delivered_6m: Where the agreement carried three or more deliveries in the six months ending on the day notice is given, the trading discount taken is the discount written onto the agreement; where the agreement carried at least one but fewer than three deliveries in those six months, the trading discount taken is the discount printed against the catering service level.
    discount_pct: No trading discount is taken on the value standing. Where the agreement carried three or more deliveries in the six months ending on the day notice is given, the trading discount taken is the discount written onto the agreement; where the agreement carried at least one but fewer than three deliveries in those six months, the trading discount taken is the discount printed against the catering service level.
    banquet_status: Where the client holds a private event and banquet agreement billing under the same client account code as the catering agreement, that agreement stands active and the largest guest count its package handles reaches two hundred, a programme concession of four points is taken on the value standing; where the client holds such an agreement under that account code that stands active and the largest guest count its package handles falls short of two hundred, a programme concession of two points is taken.
    banquet_max_guests: Where the client holds a private event and banquet agreement billing under the same client account code as the catering agreement, that agreement stands active and the largest guest count its package handles reaches two hundred, a programme concession of four points is taken on the value standing; where the client holds such an agreement under that account code that stands active and the largest guest count its package handles falls short of two hundred, a programme concession of two points is taken.
    programme_concession_pct: No programme concession is taken on the value standing. Where the client holds a private event and banquet agreement billing under the same client account code as the catering agreement, that agreement stands active and the largest guest count its package handles reaches two hundred, a programme concession of four points is taken on the value standing; where the client holds such an agreement under that account code that stands active and the largest guest count its package handles falls short of two hundred, a programme concession of two points is taken.
    total_concession_pct: The trading discount taken and the programme concession are first added into one total concession rate, and the value selected above is reduced once by that total rate; the two do not act successively, and the result is rounded to two decimal places only at the end.
    result: The trading discount taken and the programme concession are first added into one total concession rate, and the value selected above is reduced once by that total rate; the two do not act successively, and the result is rounded to two decimal places only at the end.
