- id: catering_ext_cancellation_charge_assessment
  base_policy_refs:
  - catering_cancellation_charges
  overwrite:
  - base_policy: catering_cancellation_charges
    superseded_clause: What a cancellation costs is set by how much notice the client gave, measured in whole hours from the day the client gives notice of the cancellation to the service start time on the service date.
    replaced_by: Where the cancellation reached Larkspur Table through the client's named account manager, the notice given is counted from the day before notice was given, the account manager flagging it to the kitchen a day ahead; where the cancellation reached Larkspur Table by email or through the client ordering portal, it is counted from the day after notice was given, the desk registering a written instruction on the next working day.
  - base_policy: catering_cancellation_charges
    superseded_clause: Where the same agreement has already cancelled inside the chargeable window four times in the rolling twelve months, the within-notice percentage is charged even on notice that would otherwise have been free, and the client is told at the point of the fourth cancellation.
    replaced_by: Where four or more cancellation charges stand raised inside the counting window and two or more cancellations were registered on the agreement in the twelve months ending on the day notice is given, the rate charged is the within-notice percentage printed against the catering service level whatever notice was given; where at least two but fewer than four cancellation charges stand raised inside the counting window and two or more cancellations were registered in those twelve months, the rate charged is the higher of the percentage the notice given yields and half the within-notice percentage printed against that service level.
  trigger: state_due
  subject:
  - catering_cancellation_fee_posted
  computes: cancellation_charge_usd
  target_tool: post_cancellation_charge_b7aa0639
  params:
    long_window_months: 12
    mid_window_months: 6
    short_window_months: 3
    payment_window_months: 3
    repeat_high: 4
    repeat_low: 2
    registered_min: 2
    half_share: 0.5
    rebate_high_pct: 30.0
    rebate_low_pct: 15.0
    rebate_orders_high: 6
    rebate_orders_low: 3
    large_order_multiple: 2
  rule: A cancellation charge answers an order the client has pulled, and it is worked out from the value the cancellation entry carries, the notice that entry records and the agreement's own cancellation record. The cancellation charge is fixed only after a cancellation entry stands against the order, carrying the value the order held when notice was given. The notice given is counted in whole days from the day notice was given to the service day, taken at twenty-four hours to the day. Where the cancellation reached Larkspur Table through the client's named account manager, the notice given is counted from the day before notice was given, the account manager flagging it to the kitchen a day ahead; where the cancellation reached Larkspur Table by email or through the client ordering portal, it is counted from the day after notice was given, the desk registering a written instruction on the next working day. The percentage the notice given yields is the within-notice percentage printed against the catering service level. Where notice was given on the service day itself, the percentage the notice given yields is the same-day percentage printed against that service level; where the notice given reaches the free-cancellation hours printed against that service level, it yields no percentage at all. The cancellation charges already raised on the agreement are counted over the three months ending on the day notice is given. Where an amount stands unsettled on the agreement, those charges are counted over the twelve months ending on that day; where no amount stands unsettled and a payment entry stands on the agreement in the three months ending on that day, they are counted over the six months ending on that day. The rate charged is the percentage the notice given yields. Where four or more cancellation charges stand raised inside the counting window and two or more cancellations were registered on the agreement in the twelve months ending on the day notice is given, the rate charged is the within-notice percentage printed against the catering service level whatever notice was given; where at least two but fewer than four cancellation charges stand raised inside the counting window and two or more cancellations were registered in those twelve months, the rate charged is the higher of the percentage the notice given yields and half the within-notice percentage printed against that service level. No rebate is allowed on the charge. Where the agreement carried six or more deliveries in the twelve months ending on the day notice is given and the value the cancellation entry carries reaches twice the minimum order value printed against the catering service level, a rebate of thirty per cent of the charge is allowed; where the agreement carried at least three but fewer than six deliveries in those twelve months and the value the cancellation entry carries reaches the minimum order value printed against that service level, a rebate of fifteen per cent is allowed. The rate charged is applied to the value the cancellation entry carries and rounded to two decimal places, and the rebate is then taken off that charge and the result rounded to two decimal places again.
  prerequisite:
  - problem: catering_ext_client_cancellation_registration
    kind: value_input
    gate: cancelled_value
    form: state
    policy_source: The cancellation charge is fixed only after a cancellation entry stands against the order, carrying the value the order held when notice was given.
    condition: a cancellation entry stands in the order history against the order reference, carrying the value the order held on the day notice was given
    resolved_by: register_order_cancellation_69ffeeb0
    effect: the value the charge is worked out on becomes the value that cancellation entry carries, and the notice day, the service day and the channel the charge reads are the ones that entry records
  cross_category: []
  compute:
  - cancelled_value: LATEST('catering_orders','amount_usd', date_field='posted_date', event_type='catering_order_cancelled')
  - notice_day: LATEST('catering_orders','notice_given_date', date_field='posted_date', event_type='catering_order_cancelled')
  - service_day: LATEST('catering_orders','service_date', date_field='posted_date', event_type='catering_order_cancelled')
  - notice_channel: LATEST('catering_orders','order_channel', date_field='posted_date', event_type='catering_order_cancelled')
  - notice_days: DAYS(notice_day, service_day)
  - notice_hours: RND((notice_days + 1) * 24, 2) if notice_channel == 'account_manager' else (RND((notice_days - 1) * 24, 2) if (notice_channel == 'email' or notice_channel == 'online_portal') else RND(notice_days * 24, 2))
  - notice_rate_pct: P('cancellation_fee_pct_same_day') if notice_days <= 0 else (0.0 if notice_hours >= P('cancellation_notice_hours_full_refund') else P('cancellation_fee_pct_within_notice'))
  - unsettled: F('receivable_balance_usd')
  - recent_payments: COUNT('catering_orders', within_months=K('payment_window_months'), date_field='posted_date', event_type='catering_order_payment_posted')
  - chargeable_cancels: COUNT('catering_orders', within_months=K('long_window_months'), date_field='posted_date', event_type='catering_cancellation_fee_posted') if unsettled > 0 else (COUNT('catering_orders', within_months=K('mid_window_months'), date_field='posted_date', event_type='catering_cancellation_fee_posted') if (unsettled <= 0 and recent_payments > 0) else COUNT('catering_orders', within_months=K('short_window_months'), date_field='posted_date', event_type='catering_cancellation_fee_posted'))
  - registered_cancels: COUNT('catering_orders', within_months=K('long_window_months'), date_field='posted_date', event_type='catering_order_cancelled')
  - charge_rate_pct: P('cancellation_fee_pct_within_notice') if (chargeable_cancels >= K('repeat_high') and registered_cancels >= K('registered_min')) else (MX(notice_rate_pct, RND(P('cancellation_fee_pct_within_notice') * K('half_share'), 2)) if (chargeable_cancels >= K('repeat_low') and chargeable_cancels < K('repeat_high') and registered_cancels >= K('registered_min')) else notice_rate_pct)
  - gross_charge: RND(cancelled_value * charge_rate_pct / 100, 2)
  - delivered_12m: COUNT('catering_orders', within_months=K('long_window_months'), date_field='posted_date', event_type='catering_order_delivered')
  - rebate_pct: K('rebate_high_pct') if (delivered_12m >= K('rebate_orders_high') and cancelled_value >= RND(P('min_order_value_usd') * K('large_order_multiple'), 2)) else (K('rebate_low_pct') if (delivered_12m >= K('rebate_orders_low') and delivered_12m < K('rebate_orders_high') and cancelled_value >= P('min_order_value_usd')) else 0.0)
  - result: RND(gross_charge * (100 - rebate_pct) / 100, 2)
  compute_basis:
    cancelled_value: The rate charged is applied to the value the cancellation entry carries and rounded to two decimal places, and the rebate is then taken off that charge and the result rounded to two decimal places again.
    notice_day: The notice given is counted in whole days from the day notice was given to the service day, taken at twenty-four hours to the day.
    service_day: The notice given is counted in whole days from the day notice was given to the service day, taken at twenty-four hours to the day.
    notice_channel: Where the cancellation reached Larkspur Table through the client's named account manager, the notice given is counted from the day before notice was given, the account manager flagging it to the kitchen a day ahead; where the cancellation reached Larkspur Table by email or through the client ordering portal, it is counted from the day after notice was given, the desk registering a written instruction on the next working day.
    notice_days: The notice given is counted in whole days from the day notice was given to the service day, taken at twenty-four hours to the day.
    notice_hours: The notice given is counted in whole days from the day notice was given to the service day, taken at twenty-four hours to the day. Where the cancellation reached Larkspur Table through the client's named account manager, the notice given is counted from the day before notice was given, the account manager flagging it to the kitchen a day ahead; where the cancellation reached Larkspur Table by email or through the client ordering portal, it is counted from the day after notice was given, the desk registering a written instruction on the next working day.
    notice_rate_pct: The percentage the notice given yields is the within-notice percentage printed against the catering service level. Where notice was given on the service day itself, the percentage the notice given yields is the same-day percentage printed against that service level; where the notice given reaches the free-cancellation hours printed against that service level, it yields no percentage at all.
    unsettled: Where an amount stands unsettled on the agreement, those charges are counted over the twelve months ending on that day; where no amount stands unsettled and a payment entry stands on the agreement in the three months ending on that day, they are counted over the six months ending on that day.
    recent_payments: Where an amount stands unsettled on the agreement, those charges are counted over the twelve months ending on that day; where no amount stands unsettled and a payment entry stands on the agreement in the three months ending on that day, they are counted over the six months ending on that day.
    chargeable_cancels: The cancellation charges already raised on the agreement are counted over the three months ending on the day notice is given. Where an amount stands unsettled on the agreement, those charges are counted over the twelve months ending on that day; where no amount stands unsettled and a payment entry stands on the agreement in the three months ending on that day, they are counted over the six months ending on that day.
    registered_cancels: Where four or more cancellation charges stand raised inside the counting window and two or more cancellations were registered on the agreement in the twelve months ending on the day notice is given, the rate charged is the within-notice percentage printed against the catering service level whatever notice was given; where at least two but fewer than four cancellation charges stand raised inside the counting window and two or more cancellations were registered in those twelve months, the rate charged is the higher of the percentage the notice given yields and half the within-notice percentage printed against that service level.
    charge_rate_pct: The rate charged is the percentage the notice given yields. Where four or more cancellation charges stand raised inside the counting window and two or more cancellations were registered on the agreement in the twelve months ending on the day notice is given, the rate charged is the within-notice percentage printed against the catering service level whatever notice was given; where at least two but fewer than four cancellation charges stand raised inside the counting window and two or more cancellations were registered in those twelve months, the rate charged is the higher of the percentage the notice given yields and half the within-notice percentage printed against that service level.
    gross_charge: The rate charged is applied to the value the cancellation entry carries and rounded to two decimal places, and the rebate is then taken off that charge and the result rounded to two decimal places again.
    delivered_12m: Where the agreement carried six or more deliveries in the twelve months ending on the day notice is given and the value the cancellation entry carries reaches twice the minimum order value printed against the catering service level, a rebate of thirty per cent of the charge is allowed; where the agreement carried at least three but fewer than six deliveries in those twelve months and the value the cancellation entry carries reaches the minimum order value printed against that service level, a rebate of fifteen per cent is allowed.
    rebate_pct: No rebate is allowed on the charge. Where the agreement carried six or more deliveries in the twelve months ending on the day notice is given and the value the cancellation entry carries reaches twice the minimum order value printed against the catering service level, a rebate of thirty per cent of the charge is allowed; where the agreement carried at least three but fewer than six deliveries in those twelve months and the value the cancellation entry carries reaches the minimum order value printed against that service level, a rebate of fifteen per cent is allowed.
    result: The rate charged is applied to the value the cancellation entry carries and rounded to two decimal places, and the rebate is then taken off that charge and the result rounded to two decimal places again.
