- id: catering_invoicing_terms
  subject:
  - catering_order_invoiced
  rule: 'How catering is invoiced follows the consolidation basis printed against the service level: a per-order basis raises one invoice for each delivered order, a weekly basis gathers the week''s delivered orders onto one invoice, and a monthly basis gathers the month''s onto one invoice raised on the invoice day printed against the service level. An order is only invoiced once it has been delivered, and an order cancelled before delivery is never invoiced as an order; any charge it carries is raised as a cancellation charge instead. The invoiced amount is the order value after the standing discount and the volume discount step the client''s trailing ninety-day catering spend reaches, then the service charge, the delivery fee, any rush surcharge, any peak surcharge and any additional service hours, in that order. The standing discount and the volume discount are added together rather than the better of the two being taken, and neither is applied to the delivery fee, the rush surcharge or the peak surcharge. Where the client''s purchase order reference is recorded on the agreement it is quoted on every invoice, and where the client asks for a different reference on one order that reference is carried on that order''s invoice alone. A consolidated invoice that gathers orders delivered under two different service levels is not raised; each agreement is invoiced on its own basis.

    '
  eligibility: []
  params:
    per_tier:
      Drop-Off Catering Account:
        consolidation: =invoice_consolidation
        cycle_day: =invoice_cycle_day
        standing_discount_pct: =standing_discount_pct
        volume_ladder: =volume_discount_ladder
      Delivered Buffet Account:
        consolidation: =invoice_consolidation
        cycle_day: =invoice_cycle_day
        standing_discount_pct: =standing_discount_pct
        volume_ladder: =volume_discount_ladder
      Attended Buffet Account:
        consolidation: =invoice_consolidation
        cycle_day: =invoice_cycle_day
        standing_discount_pct: =standing_discount_pct
        volume_ladder: =volume_discount_ladder
      Staffed Full-Service Catering Account:
        consolidation: =invoice_consolidation
        cycle_day: =invoice_cycle_day
        standing_discount_pct: =standing_discount_pct
        volume_ladder: =volume_discount_ladder
      Executive Hospitality Catering Account:
        consolidation: =invoice_consolidation
        cycle_day: =invoice_cycle_day
        standing_discount_pct: =standing_discount_pct
        volume_ladder: =volume_discount_ladder
      Campus Catering Master Account:
        consolidation: =invoice_consolidation
        cycle_day: =invoice_cycle_day
        standing_discount_pct: =standing_discount_pct
        volume_ladder: =volume_discount_ladder
  formula:
    discounted_food_usd: round(amount_usd * (100 - standing_discount_pct - volume_discount_ladder) / 100, 2)
    service_charge_usd: round(discounted_food_usd * service_charge_pct / 100, 2)
    invoice_total_usd: round(discounted_food_usd + service_charge_usd + delivery_fee_usd, 2)
  measures:
