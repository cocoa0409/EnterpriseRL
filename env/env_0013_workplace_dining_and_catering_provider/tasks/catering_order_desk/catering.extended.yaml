- id: catering_hold_and_closure_terms
  subject:
  - catering_agreement_placed_on_hold
  - catering_agreement_reinstated
  - catering_agreement_closed
  rule: 'A credit hold is applied by the system when exposure or arrears cross the limit, and it is lifted only after a review that the desk performs once the balance has been settled or the limit formally raised. A hold, a reinstatement or a closure is only worked while the agreement stands active, on credit hold or closed, and never while it is still in credit review, where the application is withdrawn instead. Only the client may end a catering agreement, and the desk records the request for the client to confirm rather than closing the agreement on their word alone. Notice to end the agreement is the number of calendar days printed against the service level, and orders already accepted for service days inside the notice period are served rather than cancelled. An agreement is not closed while any order stands accepted and unserved; those orders are served or cancelled on the ordinary cancellation terms first, and the agreement closes once none remain. Where the client''s annual spend for the agreement year has not reached the minimum printed against the service level, the shortfall is settled on the final invoice rather than waived at closure. A closed agreement keeps its invoices, credits and history, and a client returning later opens a fresh agreement rather than reviving the closed one.

    '
  eligibility:
  - id: lifecycle_state
    applies_to:
    - catering_agreement_placed_on_hold
    - catering_agreement_reinstated
    - catering_agreement_closed
    kind: state
