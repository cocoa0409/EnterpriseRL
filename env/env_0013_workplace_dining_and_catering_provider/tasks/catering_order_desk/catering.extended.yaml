        claim_window_days: =service_credit_claim_window_days
      Delivered Buffet Account:
        late_pct_per_quarter_hour: =service_credit_late_delivery_pct_per_15min
        quality_pct: =quality_credit_pct
        order_cap_pct: =service_credit_cap_pct_of_order
        claim_window_days: =service_credit_claim_window_days
      Attended Buffet Account:
        late_pct_per_quarter_hour: =service_credit_late_delivery_pct_per_15min
        quality_pct: =quality_credit_pct
        order_cap_pct: =service_credit_cap_pct_of_order
        claim_window_days: =service_credit_claim_window_days
      Staffed Full-Service Catering Account:
