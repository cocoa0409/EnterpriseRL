category: catering
display_name: Corporate Catering Service Agreement
binding:
  holding_table: catering_agreements
  event_tables:
  - catering_orders
  intake_tables:
  - catering_change_requests
  status_field: status
  variant_field: variant_name
  quantity_fields:
    receivable_balance_usd: order_receivable
lifecycle:
  states:
  - pending_credit_review
  - active
  - credit_hold
  - closed
  transitions:
  - from: pending_credit_review
    to: active
    by: agent
    means: credit review clears and the account is opened for ordering
  - from: active
    to: credit_hold
    by: system
    means: exposure or arrears cross the account's limit and ordering stops
  - from: credit_hold
    to: active
    by: agent
    means: the balance is settled or the limit raised and ordering reopens
  - from: active
    to: closed
    by: user
    means: the client ends the agreement and no further orders are taken
  - from: credit_hold
    to: closed
    by: agent
    means: the agreement is closed out from hold once the balance is settled
  - from: pending_credit_review
    to: closed
    by: agent
    means: the application is withdrawn or declined before ordering opens
accounts:
- key: order_receivable
  unit: USD
  meaning: amounts invoiced for catering under this agreement and not yet settled
parameter_schema:
  min_order_value_usd: smallest order value the service level accepts, in USD
  min_headcount: smallest guest count the service level is written for, as a whole number
  max_headcount: largest guest count the service level handles without a separate event agreement, as a whole number
  standard_lead_time_hours: hours of notice an ordinary order needs before service, as a whole number
  rush_lead_time_hours: shortest notice at which an order is still accepted, as a whole number of hours
  rush_fee_pct_of_order: surcharge on an order placed inside the standard lead time, as a percentage of order value
  delivery_fee_usd: standard delivery charge per order, in USD
  delivery_radius_miles: distance from the production kitchen served without a special quote, in whole miles
  service_charge_pct: service charge added to food and beverage on the order, as a percentage
  staffing_included_hours: on-site service hours included in the service level, to one decimal place
  staff_rate_per_hour_usd: billed rate for each additional on-site service hour, in USD
  china_service_included: whether china, glass and flatware are included rather than disposable service, true or false
  linen_included: whether table linen is included, true or false
  setup_included: whether the team sets the buffet down and presents it, true or false
  cleanup_window_minutes: minutes after service during which the team returns to clear, as a whole number
  menu_tiers_available: number of published menu tiers the service level may order from, as a whole number
  dietary_accommodation_lead_hours: notice needed to build allergen and dietary meals into an order, in whole hours
  standing_discount_pct: negotiated standing discount on menu prices for the service level, as a percentage
  volume_discount_ladder: threshold ladder mapping trailing ninety-day catering spend in USD to an extra discount percentage
  cancellation_notice_hours_full_refund: hours of notice before service at which a cancellation carries no charge
  cancellation_fee_pct_within_notice: charge for a cancellation made inside the free window but before the service day, as a percentage of order value
  cancellation_fee_pct_same_day: charge for a cancellation made on the service day itself, as a percentage of order value
  headcount_reduction_free_pct: reduction in guest count absorbed without repricing, as a percentage of the confirmed count
  headcount_change_deadline_hours: hours before service after which the guest count is fixed, as a whole number
  headcount_increase_max_pct: increase in guest count the kitchen will take inside the deadline, as a percentage
  guarantee_headcount_deadline_hours: hours before service by which the final guaranteed count must be given
  credit_limit_usd: open-order and unsettled exposure the service level allows before ordering stops, in USD
  credit_review_days: working days a credit review takes before ordering opens, as a whole number
  payment_terms_days: calendar days from invoice date within which payment is due
  late_fee_monthly_pct: monthly late charge on an overdue catering invoice, as a percentage of the overdue amount
  late_fee_grace_days: calendar days past the due date before a late charge may be raised
  late_fee_cap_usd: ceiling on the late charge raised against one catering invoice, in USD
  credit_hold_open_order_multiple: multiple of the credit limit at which open orders alone trigger a hold, to one decimal place
  invoice_consolidation: how catering invoices are grouped, one of per_order, weekly or monthly
  invoice_cycle_day: day of the month a consolidated catering invoice is raised, from 1 to 28
  service_credit_late_delivery_pct_per_15min: credit for each quarter hour a delivery arrives late, as a percentage of order value
  service_credit_cap_pct_of_order: ceiling on the credits allowed against one order, as a percentage of order value
  service_credit_claim_window_days: calendar days after the order was delivered within which a credit claim is accepted
  quality_credit_pct: credit allowed for an upheld food quality complaint, as a percentage of order value
  reorder_priority_level: production priority the service level holds when kitchen capacity is short, from 1 to 5
  account_manager_assigned: whether a named catering account manager is assigned, true or false
  tasting_sessions_per_year: complimentary menu tastings included each agreement year, as a whole number
  order_channel_online_enabled: whether orders may be placed through the client ordering portal, true or false
  order_channel_phone_surcharge_usd: surcharge for an order taken by telephone rather than through the portal, in USD
  equipment_rental_deposit_usd: refundable deposit held for chafing, urn and display equipment, in USD
  late_return_fee_per_day_usd: charge for each day rented service equipment is returned late, in USD
  alcohol_service_permitted: whether licensed beverage service may be ordered on this service level, true or false
  event_insurance_required_above_usd: order value above which a certificate of event insurance is required, in USD
  agreement_term_months: standard initial term of the catering agreement, in whole months
  agreement_notice_days: calendar days of notice required to end the agreement
  min_annual_spend_usd: annual catering spend the service level is written against, in USD
  peak_season_surcharge_pct: surcharge applied to orders served in the declared peak weeks, as a percentage
  holiday_blackout_days: published days in the year on which the service level takes no orders, as a whole number
  max_open_orders: number of unserved orders the agreement may carry at once, as a whole number
