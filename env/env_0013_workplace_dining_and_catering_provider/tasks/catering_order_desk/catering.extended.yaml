- id: catering_combination_cafe_interaction
  subject:
  - catering_order_placed
  - catering_order_invoiced
  rule: 'What a client holds elsewhere in the dining programme changes what a catering order costs and where it may be sent. Where the same client holds an active workplace cafe management contract whose service model permits catering out of the cafe kitchen, and the delivery site on the order is that cafe''s site, the delivery fee is not charged because the food does not leave the building. Where that cafe contract does not permit catering out of its kitchen, the order is produced at the district kitchen and the ordinary delivery fee applies however close the cafe is. Where the same client holds an active private event and banquet agreement at the delivery site, an order whose guest count exceeds the largest guest count printed against the catering service level is placed as an event booking on that agreement instead, and the two are never run as one order. A catering agreement and an unattended micro market at the same site sit side by side without interaction, since a market sells to employees rather than to the client. Where the cafe contract at the delivery site stands suspended, catering out of that kitchen stops with it and orders are produced at the district kitchen at the ordinary delivery fee until service resumes.

    '
  eligibility: []
  params:
    per_tier:
      Drop-Off Catering Account:
        delivery_fee_waived_with_cafe: true
        escalate_to_banquet_above_guests: =max_headcount
      Delivered Buffet Account:
        delivery_fee_waived_with_cafe: true
        escalate_to_banquet_above_guests: =max_headcount
      Attended Buffet Account:
        delivery_fee_waived_with_cafe: true
        escalate_to_banquet_above_guests: =max_headcount
      Staffed Full-Service Catering Account:
        delivery_fee_waived_with_cafe: true
        escalate_to_banquet_above_guests: =max_headcount
      Executive Hospitality Catering Account:
        delivery_fee_waived_with_cafe: false
        escalate_to_banquet_above_guests: =max_headcount
      Campus Catering Master Account:
        delivery_fee_waived_with_cafe: true
        escalate_to_banquet_above_guests: =max_headcount
extended_policies:
- id: catering_ext_delivered_order_invoicing
  base_policy_refs:
  - catering_invoicing_terms
  - catering_combination_cafe_interaction
  overwrite:
  - base_policy: catering_invoicing_terms
    superseded_clause: The invoiced amount is the order value after the standing discount and the volume discount step the client's trailing ninety-day catering spend reaches, then the service charge, the delivery fee, any rush surcharge, any peak surcharge and any additional service hours, in that order.
    replaced_by: The amount invoiced is the discounted food and beverage value, then the service charge, then the rush surcharge, then the delivery charge, added in that order and rounded to two decimal places only at the end.
  - base_policy: catering_combination_cafe_interaction
    superseded_clause: Where the same client holds an active workplace cafe management contract whose service model permits catering out of the cafe kitchen, and the delivery site on the order is that cafe's site, the delivery fee is not charged because the food does not leave the building.
    replaced_by: The concession for an order produced out of the client's own cafe kitchen is taken on the service charge rather than on the delivery charge, because the service charge answers the brigade that served the order.
  - base_policy: catering_combination_cafe_interaction
    superseded_clause: Where that cafe contract does not permit catering out of its kitchen, the order is produced at the district kitchen and the ordinary delivery fee applies however close the cafe is.
    replaced_by: An agreement that carried five or more deliveries in the twelve months ending on the day the invoice is raised, where the order was delivered to the site named on the agreement, carries no delivery charge at all, the site sitting on a standing round; an agreement that carried two or more deliveries in those twelve months, where the order was delivered to the site named on the agreement, carries half the fee printed against that service level.
  - base_policy: catering_invoicing_terms
    superseded_clause: 'How catering is invoiced follows the consolidation basis printed against the service level: a per-order basis raises one invoice for each delivered order, a weekly basis gathers the week''s delivered orders onto one invoice, and a monthly basis gathers the month''s onto one invoice raised on the invoice day printed against the service level.'
    replaced_by: The amount invoiced for a catering order that has been served is worked out from the value the delivery entry most recently recorded on the agreement carries.
  trigger: state_due
  subject:
  - catering_order_invoiced
  computes: invoice_amount_usd
  target_tool: raise_catering_invoice_cb57dc9d
  params:
    volume_threshold_top_usd: 40000
    volume_threshold_mid_usd: 15000
    volume_threshold_entry_usd: 5000
    volume_orders_top: 6
    volume_orders_mid: 3
    volume_orders_entry: 2
    volume_step_top_pct: 2.5
    volume_step_mid_pct: 1.5
    volume_step_entry_pct: 0.75
    long_account_months: 24
    established_account_months: 12
    long_account_window_months: 12
    established_account_window_months: 6
    standard_window_months: 3
    invoiced_order_window_months: 12
    rush_regular_orders: 3
    rush_regular_window_months: 6
    rush_share_regular: 0.5
    cafe_service_share: 0.5
    standing_round_deliveries: 5
    occasional_round_deliveries: 2
    standing_round_window_months: 12
    delivery_share_occasional: 0.5
  rule: The amount invoiced for a catering order that has been served is worked out from the value the delivery entry most recently recorded on the agreement carries. That value is reduced once by the total discount rate, and the discount does not act a second time on any later step. The total discount rate is the standing discount rate recorded on the agreement. Any volume step the agreement earns is added to that rate. The volume step is measured from the catering spend invoiced on the agreement inside the counting window and from the number of orders invoiced on it in the twelve months ending on the day the invoice is raised. An agreement whose spend inside the counting window reaches forty thousand dollars and which carried six or more invoiced orders in those twelve months earns a volume step of two and a half points; one whose spend reaches fifteen thousand dollars and which carried three or more invoiced orders earns a step of one and a half points; one whose spend reaches five thousand dollars and which carried two or more invoiced orders earns a step of three quarters of a point; and an agreement meeting none of those earns no volume step. The counting window over which that spend is measured is the three months ending on the day the invoice is raised. An agreement that has been in force for two years or more has its spend counted over the twelve months ending on that day instead, and one that has been in force for at least a year but less than two years has its spend counted over the six months ending on that day. The service charge is the percentage printed against the catering service level, applied to the discounted food and beverage value and never to the rush surcharge or the delivery charge. The concession for an order produced out of the client's own cafe kitchen is taken on the service charge rather than on the delivery charge, because the service charge answers the brigade that served the order. Where the client holds a cafe contract at the agreement's delivery site that stands active and whose service model permits catering to be ordered out of that kitchen, no service charge is raised, the client's own cafe brigade having served the order; where the client holds a cafe contract at that site that stands active and whose service model does not permit catering to be ordered out of that kitchen, the service charge is half the percentage printed against the catering service level, the cafe team having set down what the district kitchen produced; and where the client holds no cafe contract at that site, or holds one that does not stand active, the service charge is the whole percentage printed against the catering service level. The rush surcharge is worked out on the value the delivery entry carries rather than on the discounted food and beverage value, and an order carries no rush percentage. An order accepted inside the standard lead time printed against the catering service level, on an agreement that carried three or more deliveries in the six months ending on the day the invoice is raised, carries half the rush percentage printed against that service level; one accepted inside the standard lead time on an agreement that carried fewer than three deliveries in those six months carries the whole rush percentage printed against that service level. The delivery charge is the fee printed against the catering service level, raised once for the order. An agreement that carried five or more deliveries in the twelve months ending on the day the invoice is raised, where the order was delivered to the site named on the agreement, carries no delivery charge at all, the site sitting on a standing round; an agreement that carried two or more deliveries in those twelve months, where the order was delivered to the site named on the agreement, carries half the fee printed against that service level. The amount invoiced is the discounted food and beverage value, then the service charge, then the rush surcharge, then the delivery charge, added in that order and rounded to two decimal places only at the end.
