    condition: the payroll period the account's latest accrued charge belongs to carries its own recovery entry on the ledger, so the charges awaiting recovery stand net of it
    resolved_by: post_payroll_recovery_c9e76aa9
    effect: the balance standing falls by the recovery entry that period books, and the charges carried forward fall with it
