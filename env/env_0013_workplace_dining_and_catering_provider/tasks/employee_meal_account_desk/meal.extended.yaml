    - history
    cross_difficulty: null
  baseline:
    rule: 'When a spending restriction is taken off an employee meal account, the charges the account carries forward are restated on the spot so that the employee and the payroll office read the same figure. The balance standing is every charge accrued on the account to date less every recovery remitted on it to date, and it is never read as less than nothing. Nothing the employee holds as stored value is taken off the balance standing at reinstatement: stored value is spendable money of the employee''s own, the charges awaiting recovery are met from pay, and the two are never set against each other by this restatement. The employer''s dining programme picks up part of the balance standing, and that part is the base it picks up from taken at the share it picks up. The base the employer''s programme picks up from is nothing. The standing share the employer''s programme allows is nothing. The uplift the employer''s programme allows for the employee''s own payment is nothing. The uplift the employer''s programme allows for length of service is nothing. The part the employer''s dining programme picks up is the base it picks up from taken at the share it picks up, rounded to two decimal places at that step, and it is met from the employer''s own funding rather than by the employee. The charges an account carries forward at reinstatement are the balance standing less the part the employer''s dining programme picks up, and that figure is never read as less than nothing. That figure is rounded to two decimal places once, at the end. A window of calendar months in this policy runs back from the day the account is worked and never from the turn of a named month: an entry falls inside such a window while fewer than that many whole months have gone by since the day it was booked, a whole month going by only when the same day of the month comes round again, so an entry exactly that many whole months old falls outside it, and an entry booked after the day the account is worked falls outside it too.'
    params: []
  inputs:
    history:
    - table: meal_transactions
      aggregate: sum
      field: amount_usd
      within_months: 12
      filters:
        transaction_code: charge_accrual
    - table: meal_transactions
      aggregate: sum
      field: amount_usd
      within_months: 1
      filters:
        transaction_code: account_load
    - table: meal_transactions
      aggregate: count
      field: amount_usd
      within_months: 1
      filters:
        transaction_code: charge_accrual
    cross_category:
    - market
    - cafe
  temporal_basis:
    clock: frozen_time
    anchor_event: the day the account is worked
    anchor_source: frozen_time
    relation: not_before
    duration_source: the window of calendar months named in the sentence that uses it
    unit: calendar_months
    counting_rule: 'A window of calendar months in this policy runs back from the day the account is worked and never from the turn of a named month: an entry falls inside such a window while fewer than that many whole months have gone by since the day it was booked, a whole month going by only when the same day of the month comes round again, so an entry exactly that many whole months old falls outside it, and an entry booked after the day the account is worked falls outside it too.'
    boundary: exclusive
- id: meal_ext_daily_allowance_grant
  base_policy_refs:
  - meal_subsidy_grant_rules
  overwrite:
  - base_policy: meal_subsidy_grant_rules
    superseded_clause: a lot may not exceed the grant ceiling printed against the plan for one grant period
    replaced_by: A lot may not exceed the grant period ceiling worked out above, which stands in place of the grant ceiling printed against the plan.
  trigger: state_due
  subject:
  - meal_subsidy_granted
  computes: granted_amount_usd
  target_tool: grant_daily_allowance_lot_ed948b99
  params:
    suspended_counter_share_pct: 40
    long_leave_share_pct: 45
    part_month_share_pct: 70
    heavy_use_ceiling_pct: 150
    light_use_ceiling_pct: 60
  rule: 'The employer allowance placed on a meal account for a grant period is worked out from the plan the account is held on, from the employer''s dining programme at the account''s site and from what the account''s own ledger shows has already been granted and spent. The base grant is the grant amount printed against the meal plan the account is held on. Where the employer''s cafe programme at the account''s site stands active and the subsidy it publishes for one employee in one service day is below that printed grant amount, the base grant is instead that published daily subsidy, since the employer funds no more than it buys at its own counter; where that programme stands suspended and it publishes a daily subsidy at all, the base grant is instead the printed grant amount taken at the suspended counter share; where neither holds, the base grant is the printed grant amount. The availability share is the whole of the grant period. Where the plan prorates allowance for recorded leave and two or more leaves of absence stand on the account''s request log from the three calendar months running back from the day the account is worked, the availability share is instead the long leave share; where the plan prorates allowance for recorded leave and exactly one leave of absence stands on that log from the three calendar months running back from the day the account is worked, it is instead the part month share; where neither holds, the availability share is the whole of the grant period. Nothing is carried into the new lot from allowance the account already holds. Where the plan allows unspent allowance to roll over and allowance stands unspent on the account, the amount carried into the new lot is that unspent allowance; where the plan does not allow unspent allowance to roll over and a refund restoring allowance has been posted on the account in the calendar month running back from the day the account is worked, the amount carried in is that restored allowance, since allowance restored by a refund is granted back rather than written off; where neither holds, nothing is carried in. The grant period ceiling is the grant ceiling printed against the meal plan the account is held on. Where allowance has been applied on the account on two or more occasions in the calendar month running back from the day the account is worked and four or more meals of the employee''s own have been rung on it in that same month, the grant period ceiling is instead the printed grant ceiling taken at the heavy use share; where allowance has been applied on fewer than two occasions in the calendar month running back from the day the account is worked and four or more meals of the employee''s own have been rung on it in that same month, it is instead the printed grant ceiling taken at the light use share; where neither holds, it is the printed grant ceiling. Nothing already on the account is treated as standing against the new lot. Where the plan grants allowance on a daily basis and allowance has been applied on the account at least once in the calendar month running back from the day the account is worked, the allowance already standing is the unspent allowance figure the account carries; where the plan grants allowance on a daily basis and no allowance has been applied on the account in the calendar month running back from the day the account is worked, the allowance already standing is recomputed from the ledger as every lot granted in the calendar month running back from the day the account is worked less every application made in that month, never read as less than nothing; where neither holds, nothing is treated as already standing. The allowance granted is worked out in this order and in no other: the base grant is taken at the availability share and rounded to two decimal places at that step; the amount carried in is added to that figure; the sum is then held to the grant period ceiling; and the allowance already standing is taken off last, the result never being read as less than nothing. A lot may not exceed the grant period ceiling worked out above, which stands in place of the grant ceiling printed against the plan. The figure is rounded to two decimal places at the end, over and above the rounding named above. A window of calendar months in this policy runs back from the day the account is worked and never from the turn of a named month: an entry falls inside such a window while fewer than that many whole months have gone by since the day it was booked, a whole month going by only when the same day of the month comes round again, so an entry exactly that many whole months old falls outside it, and an entry booked after the day the account is worked falls outside it too.'
  prerequisite: []
  cross_category:
  - category: cafe
    as: branch
    reads:
    - status
    - subsidy_cap_per_employee_per_day_usd
    note: the employer funded base factor takes its tier from the cafe contract standing at the account's site and from the daily subsidy that contract's service model publishes.
  compute:
  - site_cafe_status: CFIELD('cafe','status', site_code=F('site_code'))
  - site_cafe_daily_cap_usd: CPARAM('cafe','subsidy_cap_per_employee_per_day_usd', site_code=F('site_code'))
  - base_grant_usd: site_cafe_daily_cap_usd if (site_cafe_status == 'active' and site_cafe_daily_cap_usd < P('subsidy_grant_amount_usd')) else (RND(P('subsidy_grant_amount_usd') * K('suspended_counter_share_pct') / 100, 2) if (site_cafe_status == 'suspended' and site_cafe_daily_cap_usd > 0) else P('subsidy_grant_amount_usd'))
  - leave_records_3m: COUNT('meal_closure_requests', within_months=3, date_field='created_at', request_type='leave_of_absence')
  - availability_share_pct: K('long_leave_share_pct') if (P('leave_subsidy_proration') and leave_records_3m >= 2) else (K('part_month_share_pct') if (P('leave_subsidy_proration') and leave_records_3m == 1) else 100)
  - allowance_refunds_1m: SUM('meal_transactions','amount_usd', within_months=1, date_field='posted_date', transaction_code='refund', payment_channel='subsidy')
  - carried_in_usd: F('subsidy_allowance_usd') if (P('subsidy_rollover_allowed') and F('subsidy_allowance_usd') > 0) else (allowance_refunds_1m if (not P('subsidy_rollover_allowed') and allowance_refunds_1m > 0) else 0.0)
  - applications_1m_count: COUNT('meal_transactions', within_months=1, date_field='posted_date', transaction_code='subsidy_application')
  - meals_1m_count: COUNT('meal_transactions', within_months=1, date_field='posted_date', transaction_code='meal_purchase')
  - grant_period_ceiling_usd: RND(P('subsidy_grant_cap_per_period_usd') * K('heavy_use_ceiling_pct') / 100, 2) if (applications_1m_count >= 2 and meals_1m_count >= 4) else (RND(P('subsidy_grant_cap_per_period_usd') * K('light_use_ceiling_pct') / 100, 2) if (applications_1m_count < 2 and meals_1m_count >= 4) else P('subsidy_grant_cap_per_period_usd'))
  - grants_1m: SUM('meal_transactions','amount_usd', within_months=1, date_field='posted_date', transaction_code='subsidy_grant')
  - applications_1m: SUM('meal_transactions','amount_usd', within_months=1, date_field='posted_date', transaction_code='subsidy_application')
  - already_standing_usd: F('subsidy_allowance_usd') if (P('subsidy_grant_basis') == 'daily' and applications_1m_count >= 1) else (MX(0.0, grants_1m - applications_1m) if (P('subsidy_grant_basis') == 'daily' and applications_1m_count == 0) else 0.0)
  - result: RND(MX(0.0, MN(RND(base_grant_usd * availability_share_pct / 100, 2) + carried_in_usd, grant_period_ceiling_usd) - already_standing_usd), 2)
  compute_basis:
    site_cafe_status: Where the employer's cafe programme at the account's site stands active and the subsidy it publishes for one employee in one service day is below that printed grant amount, the base grant is instead that published daily subsidy
    site_cafe_daily_cap_usd: the base grant is instead that published daily subsidy, since the employer funds no more than it buys at its own counter
    base_grant_usd: The base grant is the grant amount printed against the meal plan the account is held on. Where the employer's cafe programme at the account's site stands active and the subsidy it publishes for one employee in one service day is below that printed grant amount, the base grant is instead that published daily subsidy, since the employer funds no more than it buys at its own counter; where that programme stands suspended and it publishes a daily subsidy at all, the base grant is instead the printed grant amount taken at the suspended counter share; where neither holds, the base grant is the printed grant amount.
    leave_records_3m: Where the plan prorates allowance for recorded leave and two or more leaves of absence stand on the account's request log from the three calendar months running back from the day the account is worked, the availability share is instead the long leave share
    availability_share_pct: The availability share is the whole of the grant period. Where the plan prorates allowance for recorded leave and two or more leaves of absence stand on the account's request log from the three calendar months running back from the day the account is worked, the availability share is instead the long leave share; where the plan prorates allowance for recorded leave and exactly one leave of absence stands on that log from the three calendar months running back from the day the account is worked, it is instead the part month share; where neither holds, the availability share is the whole of the grant period.
    allowance_refunds_1m: where the plan does not allow unspent allowance to roll over and a refund restoring allowance has been posted on the account in the calendar month running back from the day the account is worked, the amount carried in is that restored allowance
    carried_in_usd: Nothing is carried into the new lot from allowance the account already holds. Where the plan allows unspent allowance to roll over and allowance stands unspent on the account, the amount carried into the new lot is that unspent allowance; where the plan does not allow unspent allowance to roll over and a refund restoring allowance has been posted on the account in the calendar month running back from the day the account is worked, the amount carried in is that restored allowance, since allowance restored by a refund is granted back rather than written off; where neither holds, nothing is carried in.
    applications_1m_count: Where allowance has been applied on the account on two or more occasions in the calendar month running back from the day the account is worked and four or more meals of the employee's own have been rung on it in that same month, the grant period ceiling is instead the printed grant ceiling taken at the heavy use share
    meals_1m_count: Where allowance has been applied on the account on two or more occasions in the calendar month running back from the day the account is worked and four or more meals of the employee's own have been rung on it in that same month, the grant period ceiling is instead the printed grant ceiling taken at the heavy use share
    grant_period_ceiling_usd: The grant period ceiling is the grant ceiling printed against the meal plan the account is held on. Where allowance has been applied on the account on two or more occasions in the calendar month running back from the day the account is worked and four or more meals of the employee's own have been rung on it in that same month, the grant period ceiling is instead the printed grant ceiling taken at the heavy use share; where allowance has been applied on fewer than two occasions in the calendar month running back from the day the account is worked and four or more meals of the employee's own have been rung on it in that same month, it is instead the printed grant ceiling taken at the light use share; where neither holds, it is the printed grant ceiling.
    grants_1m: the allowance already standing is recomputed from the ledger as every lot granted in the calendar month running back from the day the account is worked less every application made in that month, never read as less than nothing
    applications_1m: the allowance already standing is recomputed from the ledger as every lot granted in the calendar month running back from the day the account is worked less every application made in that month, never read as less than nothing
    already_standing_usd: Nothing already on the account is treated as standing against the new lot. Where the plan grants allowance on a daily basis and allowance has been applied on the account at least once in the calendar month running back from the day the account is worked, the allowance already standing is the unspent allowance figure the account carries; where the plan grants allowance on a daily basis and no allowance has been applied on the account in the calendar month running back from the day the account is worked, the allowance already standing is recomputed from the ledger as every lot granted in the calendar month running back from the day the account is worked less every application made in that month, never read as less than nothing; where neither holds, nothing is treated as already standing.
    result: 'The allowance granted is worked out in this order and in no other: the base grant is taken at the availability share and rounded to two decimal places at that step; the amount carried in is added to that figure; the sum is then held to the grant period ceiling; and the allowance already standing is taken off last, the result never being read as less than nothing. The figure is rounded to two decimal places at the end, over and above the rounding named above.'
  factors:
  - id: employer_funded_base
    effect: parameter
