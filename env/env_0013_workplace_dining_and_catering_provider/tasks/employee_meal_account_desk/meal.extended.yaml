events:
- type: meal_account_opened
  target: meal_accounts
  mutation: create
  meaning: an employee is enrolled onto a workplace meal plan at a site
  grain: one row per meal account an employee holds at one site
  fields:
    customer_id: the employee who holds the account
    variant_name: the meal plan enrolled on
    status: the account opens in the enrolled state
    employee_badge_number: the badge the account will be tapped with
    site_code: the site the account is enrolled at
    employer_account_code: the employer whose dining programme funds the account
    enrolled_date: the day the account was enrolled
    payroll_cycle: the employer payroll cycle the account is recovered on
    meal_balance_usd: opening stored value, zero on a new account
    subsidy_allowance_usd: opening allowance, zero until the first grant
    payroll_arrears_usd: opening arrears, zero on a new account
  triggers: []
- type: meal_account_activated
  target: meal_accounts
  mutation:
    transition:
      from: enrolled
      to: active
  meaning: the badge is registered at the till and the account opens for spending
  grain: one row per account, on the day it first becomes spendable
  fields:
    status: the account moves into active
    activated_date: the day the account became spendable
  triggers:
  - event: meal:meal_subsidy_granted
    map:
      transaction_code: subsidy_grant
- type: meal_account_restricted
  target: meal_accounts
  mutation:
    transition:
      from: active
      to: restricted
  meaning: arrears pass the restriction threshold and payroll tender is switched off
  grain: one row per account, on the day the restriction is applied
  fields:
    status: the account moves into restricted
    restriction_start_date: the day the restriction was applied
  triggers: []
- type: meal_account_reinstated
  target: meal_accounts
  mutation:
    transition:
      from: restricted
      to: active
  meaning: arrears are brought down far enough and payroll tender is switched back on
  grain: one row per account, on the day the restriction is lifted
  fields:
    status: the account moves back into active
    restriction_start_date: cleared once the restriction is lifted
  triggers: []
- type: meal_account_leave_status_changed
  target: meal_accounts
  mutation:
    transition:
    - from: active
      to: suspended
    - from: suspended
      to: active
  meaning: the account is parked for recorded leave, or unparked when the employee returns
  grain: one row per account, on the day leave starts or ends
  fields:
    status: the account moves between active and suspended
    suspension_start_date: first day of the leave, cleared on return
  triggers: []
- type: meal_account_closed
  target: meal_accounts
  mutation:
    transition:
    - from: active
      to: closed
    - from: restricted
      to: closed
    - from: suspended
      to: closed
    - from: enrolled
      to: closed
  meaning: the meal account is closed, on leaving the employer or at the employee's request
  grain: one row per account, on the day it closes
  fields:
    status: the account moves into closed
    closed_date: the day the account closed
  triggers:
  - event: meal:meal_payroll_deduction_posted
    map:
      transaction_code: payroll_deduction
- type: meal_plan_changed
  target: meal_accounts
  mutation: update
  meaning: the employee moves onto a different meal plan without closing the account
  grain: one row per account, on the day a new plan takes effect
  fields:
