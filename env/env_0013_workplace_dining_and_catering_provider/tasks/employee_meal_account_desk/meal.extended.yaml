    grants_3m: where the plan grants allowance on a monthly basis or its lots lapse after more than two days, the lots counted are instead those granted in the three calendar months running back from the day the account is worked
    lots_in_window_usd: The lots counted toward the allowance pot are the unspent allowance figure the account carries. Where the plan grants allowance on a daily basis and its lots lapse within two days, the lots counted are instead those granted in the calendar month running back from the day the account is worked; where the plan grants allowance on a monthly basis or its lots lapse after more than two days, the lots counted are instead those granted in the three calendar months running back from the day the account is worked; where neither holds, the unspent allowance figure the account carries is taken as it stands.
