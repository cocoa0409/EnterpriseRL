    - when: the plan grants allowance on a daily basis and allowance has been applied on the account at least once in the calendar month running back from the day the account is worked
      method: the allowance already standing is read as the unspent allowance figure the account carries
    - when: the plan grants allowance on a daily basis and no allowance has been applied on the account in the calendar month running back from the day the account is worked
