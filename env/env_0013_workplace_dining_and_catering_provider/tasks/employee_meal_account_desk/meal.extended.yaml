    clock: frozen_time
    anchor_event: the day the account is worked
    anchor_source: frozen_time
    relation: not_before
    duration_source: the window of calendar months named in the sentence that uses it
    unit: calendar_months
    counting_rule: 'A window of calendar months in this policy runs back from the day the account is worked and never from the turn of a named month: an entry falls inside such a window while fewer than that many whole months have gone by since the day it was booked, a whole month going by only when the same day of the month comes round again, so an entry exactly that many whole months old falls outside it, and an entry booked after the day the account is worked falls outside it too.'
