- id: meal_combination_employer_program_interaction
  subject:
  - meal_purchase_posted
  - meal_subsidy_applied
  rule: 'What the employer holds at the site changes where an employee''s allowance reaches and what the account may do. Where the employer holds an active workplace cafe management contract at the account''s site, allowance is spendable at the cafe counter, and the employer''s own subsidy funding meets the drawdown behind it; where that contract stands suspended, the counter is shut and no allowance is spent there. Where the employer also holds an active micro market at the site and the plan''s allowance scope reaches beyond the cafe, allowance is spendable at the kiosk as well, and the employee''s daily ceiling is read across both outlets together rather than once at each. Where the plan''s allowance scope is limited to the cafe, a purchase at the kiosk draws no allowance however much is left, and the employee pays it from stored value or payroll. A meal account and an employer''s catering agreement never interact: food ordered on a catering agreement is the employer''s purchase, and an employee may not put a catering order on their meal account. Where the employer''s cafe contract closes and no micro market stands at the site, the account keeps its stored value and its payroll terms, but no further allowance is granted, since there is no programme left to fund it.

    '
  eligibility: []
  params:
    per_tier:
