  - event: meal:meal_subsidy_granted
    map:
      transaction_code: subsidy_grant
- type: meal_purchase_posted
  target: meal_transactions
  meaning: the employee rings a meal at a dining outlet on the account
  grain: one row per till transaction rung on the account
  distinguish_by:
  - pos_reference
  - posted_date
  - meal_period
  fields:
    meal_account_id: the account rung against
    customer_id: the employee eating
    event_type: the event family of this row
    transaction_code: meal_purchase on an employee meal, guest_meal on a guest
    amount_usd: the value rung at the till
