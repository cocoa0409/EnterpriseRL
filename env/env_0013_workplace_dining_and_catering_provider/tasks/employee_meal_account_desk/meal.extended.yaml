- id: meal_ext_reinstatement_paydown
  base_policy_refs:
  - meal_load_and_refund_terms
  - meal_restriction_terms
  overwrite:
  - base_policy: meal_restriction_terms
    superseded_clause: The restriction is lifted once the employee has paid down at least the share of the outstanding arrears printed against their plan, whether by loading value, by a one-off payment or by a payroll period clearing.
    replaced_by: A restriction is lifted once the employee has paid in at least the paydown worked out here, and a smaller payment does not lift it however it was made.
  trigger: on_request
  subject:
  - meal_account_load_posted
  computes: paydown_amount_usd
  target_tool: load_arrears_paydown_ff1c695b
  params:
    escalated_paydown_share_pct: 75
    eased_paydown_share_pct: 30
    recent_load_window_days: 90
    dormant_value_credit_pct: 50
    heavy_use_reload_multiple: 2
    single_guest_relief_usd: 1.5
  rule: 'The paydown an employee is asked to pay onto their own meal account before a spending restriction can be taken off is worked out from the charges the account carries and from the value already standing on it. The paydown the employee is asked for is not worked out before the charges awaiting recovery stand net of the recovery entry owed for the payroll period the account''s most recent accrued charge carries. The measured balance is every charge accrued on the account to date less every recovery remitted on it to date, and it is never read as less than nothing. Where the account has stood restricted for longer than twice the grace days printed against the plan and a recovery has been remitted on it in the calendar month running back from the day the account is worked, the measured balance is instead the charges accrued in the three calendar months running back from the day the account is worked less the recoveries remitted in those same three months; where the account has stood restricted for longer than twice those grace days and no recovery has been remitted on it in the calendar month running back from the day the account is worked, it is instead the charges accrued in the twelve calendar months running back from the day the account is worked less the recoveries remitted in those same twelve months; where neither holds, it is the measured balance as first described. The required share is the reinstatement share printed against the meal plan the account is held on. Where the account has stood restricted for longer than the grace days printed against the plan and two or more charges have been accrued on it in the two calendar months running back from the day the account is worked, the required share is instead the escalated paydown share; where the account has stood restricted for no longer than those grace days and no charge has been accrued on it in the two calendar months running back from the day the account is worked, it is instead the eased paydown share; where neither holds, it is the printed reinstatement share. The gross paydown is the measured balance taken at the required share and rounded to two decimal places at that step. None of the stored value already standing on the account is credited against the gross paydown. Where the stored value standing is at least the smallest single load the plan accepts and a load has been made on the account within the recent load window, the credit for stored value is the whole of the stored value standing; where the stored value standing is at least that smallest single load and the last load was made before the recent load window opened, the credit is the dormant share of the stored value standing, rounded to two decimal places at that step; where neither holds, nothing is credited. Nothing is added to the paydown to restore a working balance at the till. Where the stored value standing is below the single transaction ceiling printed against the plan and at least one meal of the employee''s own has been rung on the account in the calendar month running back from the day the account is worked, the amount added to restore a working balance is the reload amount printed against the plan taken at the heavy use multiple; where the stored value standing is below that single transaction ceiling and no meal of the employee''s own has been rung on the account in the calendar month running back from the day the account is worked, the amount added is the reload amount printed against the plan; where neither holds, nothing is added. A guest meal is charged to payroll net of the guest surcharge printed against the plan, so that surcharge stands to be settled by the employee rather than recovered from their pay. Nothing is added to the paydown for guest meals. Where the plan allows guest meals and two or more guest meals have been rung on the account in the three calendar months running back from the day the account is worked, the amount added for guest meals is the guest surcharge printed against the plan counted once for each of them; where the plan allows guest meals and exactly one guest meal has been rung on the account in the three calendar months running back from the day the account is worked, the amount added is that printed guest surcharge less the single guest relief, never read as less than nothing; where neither holds, nothing is added for guest meals. The paydown is worked out in this order and in no other: the credit for stored value is taken off the gross paydown first, and that remainder, never read as less than nothing, has the amount added to restore a working balance and the amount added for guest meals put on top of it; the figure is then raised to the smallest single load the plan accepts if it falls below it, and finally held to the largest single load the plan accepts. A restriction is lifted once the employee has paid in at least the paydown worked out here, and a smaller payment does not lift it however it was made. The figure is rounded to two decimal places at the end, over and above the two roundings named above. The employee makes this payment in person from a card they hold, since it is their own money. A window of calendar months in this policy runs back from the day the account is worked and never from the turn of a named month: an entry falls inside such a window while fewer than that many whole months have gone by since the day it was booked, a whole month going by only when the same day of the month comes round again, so an entry exactly that many whole months old falls outside it, and an entry booked after the day the account is worked falls outside it too.'
