measures:
- id: meal_msr_subsidy_drawn_today
  window: the service day the till transaction was rung, from the first transaction of that day through the transaction being priced
  measure: sum of amount_usd over meal_subsidy_applied rows on the account for that day
- id: meal_msr_arrears_outstanding
  window: point in time on the day the restriction is considered, across every meal account the employee holds under the same employer account code
  measure: sum of amount_usd over meal_charge_accrued rows less amount_usd over meal_payroll_deduction_posted rows
- id: meal_msr_overdraft_fees_this_month
  window: the calendar month the till transaction falls in, through the day of the transaction
  measure: count of meal_overdraft_fee_posted rows on the account
- id: meal_msr_guest_meals_this_month
  window: the calendar month the till transaction falls in, through the day of the transaction
  measure: count of meal_purchase_posted rows on the account whose transaction_code is guest_meal
policies:
- id: meal_agg_multi_holding
  subject:
  - meal_account_opened
  rule: 'An employee who works across more than one site may hold a meal account at each of them, because a badge is registered against a site''s tills and an employer funds each site''s programme separately. No employee holds more than the number of accounts printed against the meal plan at once, counting every account that is enrolled, active, restricted or suspended. A second account is never opened on the same plan at the same site; where an employee asks for one, the existing account at that site is used instead. Plans written for a single account do not sit alongside a second account of any plan, so an employee moving onto one of those plans closes their other accounts first. A closed account does not count toward the ceiling, so an employee who has left a site and closed its account may enrol afresh on returning.

    '
  eligibility:
  - id: one_account_per_site_and_plan
    applies_to:
    - meal_account_opened
    kind: dedup
    condition: A second account is never opened on the same plan at the same site; where an employee asks for one, the existing account at that site is used instead.
    evidence_fields:
    - meal_accounts.customer_id
    - meal_accounts.site_code
    - meal_accounts.variant_name
    - meal_accounts.status
    - meal_accounts.meal_account_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - meal_accounts.customer_id
        - meal_accounts.site_code
      action_bindings:
        meal_accounts.customer_id: customer_id
        meal_accounts.site_code: site_code
    dedup_contract:
      table: meal_accounts
      mode: separate_record
      object_bindings:
        customer_id: customer_id
        site_code: site_code
        variant_name: variant_name
      duplicate_filters:
        status:
        - enrolled
        - active
        - restricted
        - suspended
      distinct_fields:
      - enrolled_date
      - employee_badge_number
  params:
    max_per_customer: 2
- id: meal_agg_employee_portfolio
  subject:
  - meal_purchase_posted
  - meal_account_restricted
  rule: 'Where an employee holds more than one meal account, the two figures that decide what they may do are read across the whole portfolio rather than one account at a time. Arrears are summed across every account the employee holds under the same employer account code, and it is that total that is measured against the restriction threshold printed against the plan of the account being restricted. The daily spend ceiling, by contrast, is read on each account separately, because each site''s tills price and cap their own service day. Employer allowance never moves between accounts: allowance granted on one site''s account is spent at that site''s eligible outlets and lapses there, whatever the employee holds elsewhere. Where the employee''s accounts sit under two different employer account codes, the two portfolios are kept apart entirely and neither arrears nor allowance is read across them. A restriction applied on one account does not restrict the others by itself; each account is restricted on its own record once the portfolio arrears total is what the threshold is measured against.

    '
  eligibility: []
  params:
    per_tier:
      Pay-As-You-Go Badge Account:
        arrears_threshold_usd: =arrears_restriction_threshold_usd
        daily_cap_usd: =daily_spend_cap_usd
      Prepaid Declining Balance Account:
        arrears_threshold_usd: =arrears_restriction_threshold_usd
        daily_cap_usd: =daily_spend_cap_usd
      Payroll Deduction Meal Account:
        arrears_threshold_usd: =arrears_restriction_threshold_usd
        daily_cap_usd: =daily_spend_cap_usd
      Subsidized Daily Allowance Account:
        arrears_threshold_usd: =arrears_restriction_threshold_usd
        daily_cap_usd: =daily_spend_cap_usd
      Full Subsidy Employee Meal Account:
        arrears_threshold_usd: =arrears_restriction_threshold_usd
        daily_cap_usd: =daily_spend_cap_usd
      Executive Dining Charge Account:
        arrears_threshold_usd: =arrears_restriction_threshold_usd
        daily_cap_usd: =daily_spend_cap_usd
  measures:
  - meal_msr_arrears_outstanding
- id: meal_enrollment_terms
  subject:
  - meal_account_opened
  - meal_account_activated
  rule: 'An employee is enrolled onto the highest meal plan whose entry gate they meet on length of service, on whether their employer runs the programme, on whether payroll consent has been given and on whether a manager has approved. An account is only opened or activated while it stands enrolled or already active, and an enrolment cancelled before the badge is ever used closes without charge. The enrolment charge printed against the plan is raised on the account at activation and never at enrolment, so an enrolment that is cancelled costs the employee nothing. Plans that require payroll consent are not activated until that consent is recorded, and until then the account stays enrolled and the badge is declined at the till. Where the employee does not meet the length of service printed against the plan asked for, the account is opened on the highest plan whose service requirement they do meet, and the employee is told when they will qualify. The badge registered on the account is the badge the employer issued; a replacement badge carries the replacement charge printed against the plan and the account is frozen for the freeze hours printed against the same plan from the moment a loss is reported.

    '
  eligibility:
  - id: enrollment_state
    applies_to:
    - meal_account_opened
    - meal_account_activated
    kind: state
    condition: An account is only opened or activated while it stands enrolled or already active, and an enrolment cancelled before the badge is ever used closes without charge.
    evidence_fields:
    - meal_accounts.status
    - meal_accounts.meal_account_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - meal_accounts.meal_account_id
      action_bindings:
        meal_accounts.meal_account_id: meal_account_id
    state_contract:
      field: meal_accounts.status
      allowed:
      - enrolled
      - active
  params:
    per_tier:
      Pay-As-You-Go Badge Account:
        enrollment_fee_usd: =enrollment_fee_usd
        min_tenure_months: =tier_entry_min_tenure_months
        badge_fee_usd: =badge_replacement_fee_usd
        freeze_hours: =lost_badge_freeze_hours
      Prepaid Declining Balance Account:
        enrollment_fee_usd: =enrollment_fee_usd
        min_tenure_months: =tier_entry_min_tenure_months
        badge_fee_usd: =badge_replacement_fee_usd
        freeze_hours: =lost_badge_freeze_hours
      Payroll Deduction Meal Account:
        enrollment_fee_usd: =enrollment_fee_usd
        min_tenure_months: =tier_entry_min_tenure_months
        badge_fee_usd: =badge_replacement_fee_usd
        freeze_hours: =lost_badge_freeze_hours
      Subsidized Daily Allowance Account:
        enrollment_fee_usd: =enrollment_fee_usd
        min_tenure_months: =tier_entry_min_tenure_months
        badge_fee_usd: =badge_replacement_fee_usd
        freeze_hours: =lost_badge_freeze_hours
      Full Subsidy Employee Meal Account:
        enrollment_fee_usd: =enrollment_fee_usd
        min_tenure_months: =tier_entry_min_tenure_months
        badge_fee_usd: =badge_replacement_fee_usd
        freeze_hours: =lost_badge_freeze_hours
      Executive Dining Charge Account:
        enrollment_fee_usd: =enrollment_fee_usd
        min_tenure_months: =tier_entry_min_tenure_months
        badge_fee_usd: =badge_replacement_fee_usd
        freeze_hours: =lost_badge_freeze_hours
- id: meal_purchase_and_tender_rules
  subject:
  - meal_purchase_posted
  - meal_overdraft_fee_posted
  rule: 'A meal rung on the account is met from the tenders the plan allows, and where more than one is available they are taken in a fixed order: employer allowance first, then stored value, then payroll. A till transaction may not exceed the single transaction ceiling printed against the plan, and the account may not spend more across all tenders in one service day than the daily ceiling printed against the same plan; a meal that would breach either is rung for the part that fits and the rest is taken in cash or on the employee''s own card. A meal is only rung while the account stands active or restricted; a restricted account may still spend stored value and allowance but may not tender against payroll, and an enrolled, parked or closed account is declined at the till. Where stored value is short, the plan''s overdraft limit carries the transaction down to that limit and the overdraft charge printed against the plan is raised; a plan whose overdraft limit is zero declines the transaction instead. No more overdraft charges are raised in a calendar month than the count printed against the plan, and once that count is reached further short transactions are declined rather than charged. A guest meal is only rung on a plan that allows guest meals, carries the guest surcharge printed against the plan, and counts against the monthly guest meal allowance printed against the same plan; the guest surcharge is never met from employer allowance. A meal rung at an outlet outside the plan''s allowance scope is still rung, but is met from stored value or payroll alone, since allowance does not travel outside the outlets the employer funds.

    '
  eligibility:
  - id: spendable_state
    applies_to:
    - meal_purchase_posted
    - meal_overdraft_fee_posted
    kind: state
    condition: A meal is only rung while the account stands active or restricted; a restricted account may still spend stored value and allowance but may not tender against payroll, and an enrolled, parked or closed account is declined at the till.
    evidence_fields:
    - meal_accounts.status
    - meal_accounts.meal_balance_usd
    - meal_accounts.subsidy_allowance_usd
    - meal_accounts.meal_account_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - meal_accounts.meal_account_id
      action_bindings:
        meal_accounts.meal_account_id: meal_account_id
    state_contract:
      field: meal_accounts.status
      allowed:
      - active
      - restricted
  params:
    per_tier:
      Pay-As-You-Go Badge Account:
        per_txn_cap_usd: =per_transaction_cap_usd
        daily_cap_usd: =daily_spend_cap_usd
        overdraft_limit_usd: =overdraft_limit_usd
        overdraft_fee_usd: =overdraft_fee_usd
        overdraft_count_max: =overdraft_fees_per_month_max
        guest_allowed: =guest_meal_allowed
        guest_surcharge_usd: =guest_meal_surcharge_usd
        guest_per_month: =guest_meals_per_month
        stacking: =discount_stacking_basis
      Prepaid Declining Balance Account:
        per_txn_cap_usd: =per_transaction_cap_usd
        daily_cap_usd: =daily_spend_cap_usd
        overdraft_limit_usd: =overdraft_limit_usd
        overdraft_fee_usd: =overdraft_fee_usd
        overdraft_count_max: =overdraft_fees_per_month_max
        guest_allowed: =guest_meal_allowed
        guest_surcharge_usd: =guest_meal_surcharge_usd
        guest_per_month: =guest_meals_per_month
        stacking: =discount_stacking_basis
      Payroll Deduction Meal Account:
        per_txn_cap_usd: =per_transaction_cap_usd
        daily_cap_usd: =daily_spend_cap_usd
        overdraft_limit_usd: =overdraft_limit_usd
        overdraft_fee_usd: =overdraft_fee_usd
        overdraft_count_max: =overdraft_fees_per_month_max
        guest_allowed: =guest_meal_allowed
        guest_surcharge_usd: =guest_meal_surcharge_usd
        guest_per_month: =guest_meals_per_month
        stacking: =discount_stacking_basis
      Subsidized Daily Allowance Account:
        per_txn_cap_usd: =per_transaction_cap_usd
        daily_cap_usd: =daily_spend_cap_usd
        overdraft_limit_usd: =overdraft_limit_usd
        overdraft_fee_usd: =overdraft_fee_usd
        overdraft_count_max: =overdraft_fees_per_month_max
        guest_allowed: =guest_meal_allowed
        guest_surcharge_usd: =guest_meal_surcharge_usd
        guest_per_month: =guest_meals_per_month
        stacking: =discount_stacking_basis
      Full Subsidy Employee Meal Account:
        per_txn_cap_usd: =per_transaction_cap_usd
        daily_cap_usd: =daily_spend_cap_usd
        overdraft_limit_usd: =overdraft_limit_usd
        overdraft_fee_usd: =overdraft_fee_usd
        overdraft_count_max: =overdraft_fees_per_month_max
        guest_allowed: =guest_meal_allowed
        guest_surcharge_usd: =guest_meal_surcharge_usd
        guest_per_month: =guest_meals_per_month
        stacking: =discount_stacking_basis
      Executive Dining Charge Account:
        per_txn_cap_usd: =per_transaction_cap_usd
        daily_cap_usd: =daily_spend_cap_usd
        overdraft_limit_usd: =overdraft_limit_usd
        overdraft_fee_usd: =overdraft_fee_usd
        overdraft_count_max: =overdraft_fees_per_month_max
        guest_allowed: =guest_meal_allowed
        guest_surcharge_usd: =guest_meal_surcharge_usd
        guest_per_month: =guest_meals_per_month
        stacking: =discount_stacking_basis
  formula:
    tender_from_balance_usd: max(0, amount_usd - subsidy_allowance_usd)
    overdraft_charge_usd: overdraft_fee_usd
  measures:
  - meal_msr_overdraft_fees_this_month
  - meal_msr_guest_meals_this_month
- id: meal_load_and_refund_terms
  subject:
  - meal_account_load_posted
  - meal_refund_posted
  rule: 'Stored value is loaded in amounts between the smallest and largest single load printed against the plan, and the account may not be carried above the balance ceiling printed against the same plan; a load that would breach the ceiling is taken down to the amount that fits. Where the plan carries an automatic reload, it fires once the balance falls to the reload threshold printed against the plan and adds the reload amount printed against it, and it fires no more than once in a service day. A load or a refund is only made while the account stands active or restricted, since an account that is parked or closed takes no value and an enrolled account has not yet been activated. A refund of a till transaction is only made where the request reaches Larkspur Table no later than the refund window for the meal plan, counted in calendar days from the day the till transaction was rung. Refund window days are counted as calendar days from the day after the transaction was rung, every day of the week counts, and a request arriving on the boundary day itself is still in time; calendar days are never converted into full 24-hour periods. A refund is returned by the method printed against the plan — to stored value, through payroll, or to the card originally used — and never by a method the employee chooses on the day. A refund smaller than the minimum printed against the plan is not made, and the employee is offered a replacement item instead. A refund of a transaction that was met from employer allowance restores that allowance rather than paying the employee, and the restored allowance keeps the expiry of the lot it came from rather than starting afresh.

    '
  eligibility:
  - id: loadable_state
    applies_to:
    - meal_account_load_posted
    - meal_refund_posted
    kind: state
    condition: A load or a refund is only made while the account stands active or restricted, since an account that is parked or closed takes no value and an enrolled account has not yet been activated.
    evidence_fields:
    - meal_accounts.status
    - meal_accounts.meal_balance_usd
    - meal_accounts.meal_account_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - meal_accounts.meal_account_id
      action_bindings:
        meal_accounts.meal_account_id: meal_account_id
    state_contract:
      field: meal_accounts.status
      allowed:
      - active
      - restricted
  - id: refund_window
    applies_to:
    - meal_refund_posted
    kind: time
    condition: A refund of a till transaction is only made where the request reaches Larkspur Table no later than the refund window for the meal plan, counted in calendar days from the day the till transaction was rung.
    evidence_fields:
    - meal_transactions.posted_date
    - meal_transactions.pos_reference
    - meal_transactions.meal_account_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - meal_transactions.pos_reference
      action_bindings:
        meal_transactions.pos_reference: original_pos_reference
    temporal_basis:
      clock: frozen_time
      anchor_event: the day the till transaction was rung
      anchor_source: meal_transactions.posted_date
      relation: not_after
      duration_source: variants.refund_request_window_days
      unit: calendar_days
      counting_rule: Refund window days are counted as calendar days from the day after the transaction was rung, every day of the week counts, and a request arriving on the boundary day itself is still in time; calendar days are never converted into full 24-hour periods.
      boundary: inclusive
  params:
    per_tier:
      Pay-As-You-Go Badge Account:
        min_load_usd: =min_load_usd
        max_load_usd: =max_load_usd
        max_balance_usd: =max_balance_usd
        reload_threshold_usd: =auto_reload_threshold_usd
        reload_amount_usd: =auto_reload_amount_usd
        refund_window_days: =refund_request_window_days
        refund_method: =refund_method
        refund_min_usd: =refund_min_amount_usd
      Prepaid Declining Balance Account:
        min_load_usd: =min_load_usd
        max_load_usd: =max_load_usd
        max_balance_usd: =max_balance_usd
        reload_threshold_usd: =auto_reload_threshold_usd
        reload_amount_usd: =auto_reload_amount_usd
        refund_window_days: =refund_request_window_days
        refund_method: =refund_method
        refund_min_usd: =refund_min_amount_usd
      Payroll Deduction Meal Account:
        min_load_usd: =min_load_usd
