- id: meal_ext_restriction_lift_balance
  base_policy_refs:
  - meal_restriction_terms
  - meal_payroll_recovery_terms
  overwrite:
  - base_policy: meal_payroll_recovery_terms
    superseded_clause: A meal tendered against payroll is added to the charges awaiting recovery
    replaced_by: The charges an account carries forward at reinstatement are the balance standing less the part the employer's dining programme picks up, and that figure is never read as less than nothing.
  trigger: on_request
  subject:
  - meal_account_reinstated
  computes: arrears_carried_usd
  target_tool: lift_meal_account_restriction_a306574a
  params:
    broad_pickup_share_pct: 12
    narrow_pickup_share_pct: 6
    matched_paydown_uplift_pct: 8
    part_paydown_uplift_pct: 4
    long_service_uplift_pct: 5
    short_service_uplift_pct: 2
    long_service_months: 24
  rule: 'When a spending restriction is taken off an employee meal account, the charges the account carries forward are restated on the spot so that the employee and the payroll office read the same figure. The charges an account carries forward at reinstatement are fixed only after the charges awaiting recovery stand net of the recovery entry due for the payroll period the account''s latest accrued charge belongs to. The charges carried forward are worked out only once the stored value standing on the account has been raised by the paydown the plan calls for. The balance standing is every charge accrued on the account to date less every recovery remitted on it to date, and it is never read as less than nothing. Nothing the employee holds as stored value is taken off the balance standing at reinstatement: stored value is spendable money of the employee''s own, the charges awaiting recovery are met from pay, and the two are never set against each other by this restatement. The employer''s dining programme picks up part of the balance standing, and that part is the base it picks up from taken at the share it picks up. The base the employer''s programme picks up from is nothing. Where the employer holds an active micro market at the account''s site and three or more charges have been accrued on the account in the calendar month running back from the day the account is worked, the base the employer''s programme picks up from is the charges accrued in the calendar month running back from the day the account is worked; where the employer holds an active micro market at the account''s site and fewer than three charges have been accrued on the account in the calendar month running back from the day the account is worked, the base is the charges accrued in the three calendar months running back from the day the account is worked; where neither holds, the base the employer''s programme picks up from is nothing. The share the employer''s programme picks up is the standing share it allows, increased by the uplift it allows for the employee''s own payment and by the uplift it allows for length of service. The standing share the employer''s programme allows is nothing. Where the employer''s cafe programme at the account''s site stands active and serves two or more meal periods a day, the standing share is the broad pickup share; where the employer''s cafe programme at the account''s site stands active and serves one meal period a day, the standing share is the narrow pickup share; where neither holds, the standing share is nothing. The uplift the employer''s programme allows for the employee''s own payment is nothing. Where value has been paid onto the account in the calendar month running back from the day the account is worked and the account has stood restricted for longer than the grace days printed against the plan, that uplift is the matched paydown uplift; where value has been paid onto the account in the calendar month running back from the day the account is worked and the account has stood restricted for no longer than those grace days, that uplift is the part paydown uplift; where neither holds, the uplift the employer''s programme allows for the employee''s own payment is nothing. The uplift the employer''s programme allows for length of service is nothing. Where the whole months between the day the account was activated and the day its restriction began are more than the long service term and three or more charges have been accrued on the account in the calendar month running back from the day the account is worked, that uplift is the long service uplift; where those whole months are more than the long service term and fewer than three charges have been accrued on the account in the calendar month running back from the day the account is worked, that uplift is the short service uplift; where neither holds, the uplift the employer''s programme allows for length of service is nothing. The part the employer''s dining programme picks up is the base it picks up from taken at the share it picks up, rounded to two decimal places at that step, and it is met from the employer''s own funding rather than by the employee. The charges an account carries forward at reinstatement are the balance standing less the part the employer''s dining programme picks up, and that figure is never read as less than nothing. That figure is rounded to two decimal places once, at the end. A window of calendar months in this policy runs back from the day the account is worked and never from the turn of a named month: an entry falls inside such a window while fewer than that many whole months have gone by since the day it was booked, a whole month going by only when the same day of the month comes round again, so an entry exactly that many whole months old falls outside it, and an entry booked after the day the account is worked falls outside it too.'
