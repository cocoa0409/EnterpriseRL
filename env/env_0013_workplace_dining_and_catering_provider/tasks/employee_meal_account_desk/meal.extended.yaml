extended_policies:
- id: meal_ext_period_recovery_amount
  base_policy_refs:
  - meal_payroll_recovery_terms
  overwrite:
  - base_policy: meal_payroll_recovery_terms
    superseded_clause: no more than the deduction ceiling printed against the same plan is recovered in one period
    replaced_by: The amount a period recovers is held to the recovery ceiling worked out above rather than to the deduction ceiling printed against the plan.
  - base_policy: meal_payroll_recovery_terms
    superseded_clause: A payroll period's charges are remitted the number of days after the period closes printed against the plan
    replaced_by: A period's charges are remitted as soon as the charges awaiting recovery on the account stand above the restriction threshold printed against the plan, whatever remittance lag the plan would otherwise fix.
  trigger: state_due
  subject:
  - meal_payroll_deduction_posted
  computes: recovered_amount_usd
  target_tool: post_payroll_recovery_c9e76aa9
  params:
    uplifted_ceiling_share_pct: 160
    eased_ceiling_share_pct: 55
    recovery_recency_window_days: 45
    strong_support_level_usd: 7.0
    deep_deferral_amount_usd: 45.0
    light_deferral_amount_usd: 20.0
  rule: 'The amount one payroll period recovers on an employee meal account is worked out from that account''s own ledger of charges accrued and recoveries remitted, and from nothing else. The balance standing is every charge accrued on the account to date less every recovery already remitted on it, and it is never read as less than nothing. The recoverable balance is that same balance standing, so an ordinary period offers for recovery everything the account still owes. Where the account is recovered on a weekly or a biweekly cycle and a recovery has been remitted within the recovery recency window, the recoverable balance is instead the charges accrued in the calendar month running back from the day the account is worked less the recoveries remitted in that same month; where the account is recovered on a semimonthly or a monthly cycle and a recovery has been remitted within the recovery recency window, it is instead the charges accrued in the three calendar months running back from the day the account is worked less the recoveries remitted in those same three months; where neither holds, it is the balance standing. The recovery ceiling is the deduction ceiling printed against the meal plan the account is held on. Where the account stands restricted and three or more charges have been accrued on it in the calendar month running back from the day the account is worked, the recovery ceiling is instead the uplifted share of that printed deduction ceiling; where the account stands active and no charge has been accrued on it in the calendar month running back from the day the account is worked, it is instead the eased share of that printed deduction ceiling; where neither holds, it is the printed deduction ceiling itself. Nothing of the recoverable balance is treated as met by the employer''s dining programme at the account''s site. Where the employer''s cafe programme at the account''s site stands active and the subsidy that programme publishes for one employee in one service day is at or above the strong support level, the part the employer''s programme meets is that published daily subsidy counted once for each charge accrued on the account in the three calendar months running back from the day the account is worked; where that programme stands active and the subsidy it publishes for one employee in one service day is below the strong support level, the part the employer''s programme meets is half of that published daily subsidy counted once for each such charge; where neither holds, the employer''s programme meets nothing. Nothing of the period''s recovery is deferred into a later period. Where the account stands restricted and two or more overdraft charges have been raised on it in the three calendar months running back from the day the account is worked, the part deferred into a later period is the deep deferral amount; where the account stands restricted and exactly one overdraft charge has been raised on it in the three calendar months running back from the day the account is worked, the part deferred is the light deferral amount; where neither holds, nothing is deferred. The amount recovered is worked out in this order and in no other: the part the employer''s programme meets is taken off the recoverable balance first, and that remainder, never read as less than nothing, is then held to the recovery ceiling; the deferred part is taken off the held figure next, and that result, again never read as less than nothing, is finally held to the balance standing. The amount a period recovers is held to the recovery ceiling worked out above rather than to the deduction ceiling printed against the plan. The figure is rounded to two decimal places once, at the end, and no intermediate step is rounded. The payroll period a remittance is made for is the period carried by the most recent charge accrued on the account. A period''s charges are remitted as soon as the charges awaiting recovery on the account stand above the restriction threshold printed against the plan, whatever remittance lag the plan would otherwise fix. An account carrying no charge awaiting recovery has nothing to recover and no entry is made. A window of calendar months in this policy runs back from the day the account is worked and never from the turn of a named month: an entry falls inside such a window while fewer than that many whole months have gone by since the day it was booked, a whole month going by only when the same day of the month comes round again, so an entry exactly that many whole months old falls outside it, and an entry booked after the day the account is worked falls outside it too.'
