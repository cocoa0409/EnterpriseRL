- id: meal_subsidy_grant_rules
  subject:
  - meal_subsidy_granted
  rule: 'Employer allowance is granted on the basis printed against the plan: a daily basis places the allowance on the account at the start of each service day, a monthly basis on the first day of the calendar month, and a plan whose basis is none is granted nothing at all. Each grant is recorded as its own allowance lot so that spending, lapsing and restoration can be traced lot by lot, and a lot may not exceed the grant ceiling printed against the plan for one grant period. A lot lapses the number of days printed against the plan after it was granted, and what is left of it is written off unless the plan allows rollover, in which case the unspent balance is carried into the next lot. Allowance is only granted while the account stands active or parked for leave, since an enrolled account has no badge in use and a restricted account keeps the allowance it already holds without receiving more. Where the plan prorates allowance for leave, a part month of recorded leave reduces the grant in proportion to the working days the employee was actually available; where it does not, the grant is made in full or not at all. Allowance granted in a year above the taxable benefit ceiling printed against the plan is reported to the employer for payroll treatment, and the grant itself is not reduced. Allowance restored by a refund is granted back to the lot the spending came from, and where that lot has already lapsed the allowance is not restored at all.

    '
  eligibility:
  - id: grantable_state
    applies_to:
    - meal_subsidy_granted
    kind: state
    condition: Allowance is only granted while the account stands active or parked for leave, since an enrolled account has no badge in use and a restricted account keeps the allowance it already holds without receiving more.
    evidence_fields:
    - meal_accounts.status
    - meal_accounts.subsidy_allowance_usd
    - meal_accounts.meal_account_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - meal_accounts.meal_account_id
      action_bindings:
        meal_accounts.meal_account_id: meal_account_id
    state_contract:
      field: meal_accounts.status
      allowed:
      - active
      - suspended
  params:
    per_tier:
      Pay-As-You-Go Badge Account:
        basis: =subsidy_grant_basis
        grant_usd: =subsidy_grant_amount_usd
        period_cap_usd: =subsidy_grant_cap_per_period_usd
        expiry_days: =subsidy_expiry_days
        rollover: =subsidy_rollover_allowed
        taxable_cap_usd: =annual_taxable_benefit_cap_usd
        leave_proration: =leave_subsidy_proration
      Prepaid Declining Balance Account:
        basis: =subsidy_grant_basis
        grant_usd: =subsidy_grant_amount_usd
        period_cap_usd: =subsidy_grant_cap_per_period_usd
        expiry_days: =subsidy_expiry_days
        rollover: =subsidy_rollover_allowed
        taxable_cap_usd: =annual_taxable_benefit_cap_usd
        leave_proration: =leave_subsidy_proration
      Payroll Deduction Meal Account:
        basis: =subsidy_grant_basis
