  - charges_accrued_to_date: SUM('meal_transactions','amount_usd', date_field='posted_date', transaction_code='charge_accrual')
  - recoveries_remitted_to_date: SUM('meal_transactions','amount_usd', date_field='posted_date', transaction_code='payroll_deduction')
  - balance_standing_usd: MX(0.0, charges_accrued_to_date - recoveries_remitted_to_date)
  - site_market_status: CFIELD('market','status', site_code=F('site_code'))
  - charge_count_1m: COUNT('meal_transactions', within_months=1, date_field='posted_date', transaction_code='charge_accrual')
  - charges_accrued_1m: SUM('meal_transactions','amount_usd', within_months=1, date_field='posted_date', transaction_code='charge_accrual')
  - charges_accrued_3m: SUM('meal_transactions','amount_usd', within_months=3, date_field='posted_date', transaction_code='charge_accrual')
  - pickup_base_usd: charges_accrued_1m if (site_market_status == 'active' and charge_count_1m >= 3) else (charges_accrued_3m if (site_market_status == 'active' and charge_count_1m < 3) else 0.0)
  - site_cafe_status: CFIELD('cafe','status', site_code=F('site_code'))
  - site_cafe_meal_periods: CPARAM('cafe','meal_periods_served', site_code=F('site_code'))
  - standing_share_pct: K('broad_pickup_share_pct') if (site_cafe_status == 'active' and site_cafe_meal_periods >= 2) else (K('narrow_pickup_share_pct') if (site_cafe_status == 'active' and site_cafe_meal_periods == 1) else 0)
  - value_loaded_1m: SUM('meal_transactions','amount_usd', within_months=1, date_field='posted_date', transaction_code='account_load')
  - restriction_days_standing: DAYS(F('restriction_start_date'), NOW)
  - paydown_uplift_pct: K('matched_paydown_uplift_pct') if (value_loaded_1m > 0 and restriction_days_standing > P('arrears_restriction_grace_days')) else (K('part_paydown_uplift_pct') if (value_loaded_1m > 0 and restriction_days_standing <= P('arrears_restriction_grace_days')) else 0)
  - service_months: MONTHS(F('activated_date'), F('restriction_start_date'))
  - service_uplift_pct: K('long_service_uplift_pct') if (service_months > K('long_service_months') and charge_count_1m >= 3) else (K('short_service_uplift_pct') if (service_months > K('long_service_months') and charge_count_1m < 3) else 0)
  - employer_pickup_usd: RND(pickup_base_usd * (standing_share_pct + paydown_uplift_pct + service_uplift_pct) / 100, 2)
  - result: RND(MX(0.0, balance_standing_usd - employer_pickup_usd), 2)
  compute_basis:
    charges_accrued_to_date: The balance standing is every charge accrued on the account to date less every recovery remitted on it to date, and it is never read as less than nothing.
    recoveries_remitted_to_date: The balance standing is every charge accrued on the account to date less every recovery remitted on it to date, and it is never read as less than nothing.
    balance_standing_usd: The balance standing is every charge accrued on the account to date less every recovery remitted on it to date, and it is never read as less than nothing.
    site_market_status: Where the employer holds an active micro market at the account's site and three or more charges have been accrued on the account in the calendar month running back from the day the account is worked, the base the employer's programme picks up from is the charges accrued in the calendar month running back from the day the account is worked
    charge_count_1m: Where the employer holds an active micro market at the account's site and three or more charges have been accrued on the account in the calendar month running back from the day the account is worked, the base the employer's programme picks up from is the charges accrued in the calendar month running back from the day the account is worked
    charges_accrued_1m: the base the employer's programme picks up from is the charges accrued in the calendar month running back from the day the account is worked
    charges_accrued_3m: the base is the charges accrued in the three calendar months running back from the day the account is worked
    pickup_base_usd: The base the employer's programme picks up from is nothing. Where the employer holds an active micro market at the account's site and three or more charges have been accrued on the account in the calendar month running back from the day the account is worked, the base the employer's programme picks up from is the charges accrued in the calendar month running back from the day the account is worked; where the employer holds an active micro market at the account's site and fewer than three charges have been accrued on the account in the calendar month running back from the day the account is worked, the base is the charges accrued in the three calendar months running back from the day the account is worked; where neither holds, the base the employer's programme picks up from is nothing.
    site_cafe_status: Where the employer's cafe programme at the account's site stands active and serves two or more meal periods a day, the standing share is the broad pickup share
    site_cafe_meal_periods: Where the employer's cafe programme at the account's site stands active and serves two or more meal periods a day, the standing share is the broad pickup share
    standing_share_pct: The standing share the employer's programme allows is nothing. Where the employer's cafe programme at the account's site stands active and serves two or more meal periods a day, the standing share is the broad pickup share; where the employer's cafe programme at the account's site stands active and serves one meal period a day, the standing share is the narrow pickup share; where neither holds, the standing share is nothing.
    value_loaded_1m: Where value has been paid onto the account in the calendar month running back from the day the account is worked and the account has stood restricted for longer than the grace days printed against the plan, that uplift is the matched paydown uplift
    restriction_days_standing: Where value has been paid onto the account in the calendar month running back from the day the account is worked and the account has stood restricted for longer than the grace days printed against the plan, that uplift is the matched paydown uplift
    paydown_uplift_pct: The uplift the employer's programme allows for the employee's own payment is nothing. Where value has been paid onto the account in the calendar month running back from the day the account is worked and the account has stood restricted for longer than the grace days printed against the plan, that uplift is the matched paydown uplift; where value has been paid onto the account in the calendar month running back from the day the account is worked and the account has stood restricted for no longer than those grace days, that uplift is the part paydown uplift; where neither holds, the uplift the employer's programme allows for the employee's own payment is nothing.
    service_months: Where the whole months between the day the account was activated and the day its restriction began are more than the long service term and three or more charges have been accrued on the account in the calendar month running back from the day the account is worked, that uplift is the long service uplift
    service_uplift_pct: The uplift the employer's programme allows for length of service is nothing. Where the whole months between the day the account was activated and the day its restriction began are more than the long service term and three or more charges have been accrued on the account in the calendar month running back from the day the account is worked, that uplift is the long service uplift; where those whole months are more than the long service term and fewer than three charges have been accrued on the account in the calendar month running back from the day the account is worked, that uplift is the short service uplift; where neither holds, the uplift the employer's programme allows for length of service is nothing.
    employer_pickup_usd: The part the employer's dining programme picks up is the base it picks up from taken at the share it picks up, rounded to two decimal places at that step, and it is met from the employer's own funding rather than by the employee.
    result: The charges an account carries forward at reinstatement are the balance standing less the part the employer's dining programme picks up, and that figure is never read as less than nothing. That figure is rounded to two decimal places once, at the end.
  factors:
  - id: employer_pickup_base
    effect: method
    decides: pickup_base_usd
    bindings:
    - site_market_status
    - charge_count_1m
    - charges_accrued_1m
    - charges_accrued_3m
    - pickup_base_usd
    ladder:
    - when: the employer holds an active micro market at the account's site and three or more charges have been accrued on the account in the calendar month running back from the day the account is worked
      method: the base is summed over the charges accrued in the calendar month running back from the day the account is worked
    - when: the employer holds an active micro market at the account's site and fewer than three charges have been accrued on the account in the calendar month running back from the day the account is worked
      method: the base is summed over the charges accrued in the three calendar months running back from the day the account is worked
    - when: otherwise
      method: no charges are summed and the base is nothing
    baseline:
      pickup_base_usd: '0.0'
    evidence:
    - cross_category
    - history
    cross_difficulty: market
  - id: standing_pickup_share
    effect: parameter
    decides: standing_share_pct
    bindings:
    - site_cafe_status
    - site_cafe_meal_periods
    - standing_share_pct
    ladder:
    - when: the employer's cafe programme at the account's site stands active and serves two or more meal periods a day
      value: the broad pickup share
    - when: the employer's cafe programme at the account's site stands active and serves one meal period a day
      value: the narrow pickup share
    - when: otherwise
      value: nothing
    baseline:
      standing_share_pct: '0'
    evidence:
    - cross_category
    cross_difficulty: cafe
  - id: paydown_matching_uplift
    effect: parameter
    decides: paydown_uplift_pct
    bindings:
    - value_loaded_1m
    - restriction_days_standing
    - paydown_uplift_pct
    ladder:
    - when: value has been paid onto the account in the calendar month running back from the day the account is worked and the account has stood restricted for longer than the grace days printed against the plan
      value: the matched paydown uplift
    - when: value has been paid onto the account in the calendar month running back from the day the account is worked and the account has stood restricted for no longer than those grace days
      value: the part paydown uplift
    - when: otherwise
      value: nothing
    baseline:
      paydown_uplift_pct: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: length_of_service_uplift
    effect: parameter
    decides: service_uplift_pct
    bindings:
    - service_months
    - service_uplift_pct
    ladder:
    - when: the whole months between the day the account was activated and the day its restriction began are more than the long service term and three or more charges have been accrued on the account in the calendar month running back from the day the account is worked
      value: the long service uplift
    - when: those whole months are more than the long service term and fewer than three charges have been accrued on the account in the calendar month running back from the day the account is worked
      value: the short service uplift
    - when: otherwise
      value: nothing
    baseline:
      service_uplift_pct: '0'
    evidence:
