- id: meal_ext_payroll_charge_consent
  base_policy_refs:
  - meal_payroll_recovery_terms
  overwrite:
  - base_policy: meal_payroll_recovery_terms
    superseded_clause: A meal tendered against payroll is added to the charges awaiting recovery and carries the payroll period it belongs to, so that every charge can be matched to the pay packet that will recover it.
    replaced_by: The charge carried to payroll is the meals carried, less the allowance credited, less the stored value taken into account, less the charges already accrued and less the refund credited, with the guest surcharge due added on top, and it is never read as less than nothing.
  trigger: on_request
  subject:
  - meal_charge_accrued
  computes: accrued_amount_usd
  target_tool: confirm_payroll_charge_accrual_6d54e4b8
  params:
    shared_stacking_credit_pct: 50
    stale_refund_credit_pct: 50
  rule: 'What an employee consents to have carried to their pay for the meals they have charged at the counter is worked out from the account''s own ledger, and the employee gives that consent themselves because it is their pay packet that meets it. The charge carried to payroll is fixed only after the largest till transaction rung against payroll on the account carries the allowance application it is owed. The meals carried are every meal rung against payroll on the account to date. Where the account is recovered on a weekly or a biweekly cycle and a charge has been accrued on it in the calendar month running back from the day the account is worked, the meals carried are instead those rung against payroll in the calendar month running back from the day the account is worked; where the account is recovered on a semimonthly or a monthly cycle and a charge has been accrued on it in the calendar month running back from the day the account is worked, the meals carried are instead those rung against payroll in the three calendar months running back from the day the account is worked; where neither holds, the meals carried are every meal rung against payroll to date. No allowance is credited against the meals carried. Where allowance has been applied on the account at least once in the calendar month running back from the day the account is worked and the plan puts allowance before published discounts, the allowance credited is the whole of those applications; where allowance has been applied at least once in the calendar month running back from the day the account is worked and the plan takes published discounts before allowance, the allowance credited is those applications taken at the shared stacking share; where neither holds, no allowance is credited. No account is taken of the stored value the employee already holds. The stored value taken into account is never moved from the account: it stays spendable, the meals it will meet are never charged to payroll, and that is why the charge carried is net of it. Where the stored value standing on the account is at least the smallest single load the plan accepts and no overdraft charge has been raised on the account in the calendar month running back from the day the account is worked, the stored value taken into account is the whole of the stored value standing; where the stored value standing is at least that smallest single load and an overdraft charge has been raised on the account in the calendar month running back from the day the account is worked, the stored value taken into account is the stored value standing less the overdraft limit printed against the plan, never read as less than nothing; where neither holds, no stored value is taken into account. Nothing is taken off for charges already accrued. Where two or more charges have been accrued on the account in the calendar month running back from the day the account is worked and no recovery has been remitted in that month, the amount taken off for charges already accrued is every charge accrued in the three calendar months running back from the day the account is worked, because none of that run has yet been recovered; where two or more charges have been accrued in the calendar month running back from the day the account is worked and a recovery has been remitted in that month, it is the charges accrued in the calendar month running back from the day the account is worked less that recovery, never read as less than nothing; where neither holds, nothing is taken off. No refund is credited against the meals carried. A refund that restores employer allowance is never credited here, because it returns the employer''s own funding rather than the employee''s money. Where the plan returns refunds to stored value and a refund other than one restoring employer allowance has been returned on the account in the calendar month running back from the day the account is worked, the refund credited is the whole of those refunds; where the plan returns refunds to stored value, no such refund has been returned in the calendar month running back from the day the account is worked and one has been returned in the three calendar months running back from the day the account is worked, the refund credited is those refunds taken at the stale refund share; where none of that holds, no refund is credited. No guest surcharge is added. Where the plan allows guest meals and more guest meals have been rung on the account in the three calendar months running back from the day the account is worked than three times the guest meal allowance printed against the plan, one month''s allowance for each of those three months, the guest surcharge due is that printed surcharge counted once for each of them together with the whole value of those guest meals, since the allowance no longer covers them; where the plan allows guest meals and at least one guest meal has been rung in the three calendar months running back from the day the account is worked within that three-month allowance, the guest surcharge due is that printed surcharge counted once for each of them; where neither holds, no guest surcharge is added. The charge carried to payroll is the meals carried, less the allowance credited, less the stored value taken into account, less the charges already accrued and less the refund credited, with the guest surcharge due added on top, and it is never read as less than nothing. The deductions are taken in the order written and the guest surcharge is added last, and the figure is rounded to two decimal places once, at the end. The payroll period the charge is carried in is the period the most recent charge accrued on the account carries. A window of calendar months in this policy runs back from the day the account is worked and never from the turn of a named month: an entry falls inside such a window while fewer than that many whole months have gone by since the day it was booked, a whole month going by only when the same day of the month comes round again, so an entry exactly that many whole months old falls outside it, and an entry booked after the day the account is worked falls outside it too.'
  prerequisite:
  - problem: meal_ext_ticket_allowance_application
    kind: value_input
    gate: allowance_credited_usd
    form: state
    policy_source: The charge carried to payroll is fixed only after the largest till transaction rung against payroll on the account carries the allowance application it is owed.
