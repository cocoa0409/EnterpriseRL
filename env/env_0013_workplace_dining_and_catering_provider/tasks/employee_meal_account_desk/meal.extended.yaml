- id: meal_plan_change_terms
  subject:
  - meal_plan_changed
  rule: 'An employee may move onto a different meal plan without closing the account, provided they meet the entry gate of the plan they are moving to on length of service, payroll consent and manager approval. A change is accepted during the annual change window printed against the plan in force, or at any time on a recorded life event such as a move between sites, a change of employer programme or a return from long leave. A change is only accepted once the cooldown printed against the plan in force has passed since the last plan change on this account, and a plan that has never been changed carries no cooldown. The change takes effect on the basis printed against the plan being moved to — at once, at the start of the next payroll period, or on the first day of the next month — and the administration charge printed against that plan is raised on the account when it takes effect. From the effective day the whole parameter column of the new plan applies together: ceilings, allowance, payroll terms, overdraft, refunds and closure terms all move at once, and no parameter of the old plan survives. Allowance lots granted under the old plan keep their own expiry and are spent under the rules they were granted under, so an employee changing plan mid-month does not lose allowance already on the account. Charges awaiting payroll recovery move with the account and are recovered under the new plan''s deduction ceiling from the effective day onward. Where the employee does not meet the entry gate of the plan asked for, the change is declined and the highest plan whose gate they do meet is offered instead.

    '
  eligibility:
  - id: change_state
    applies_to:
    - meal_plan_changed
    kind: state
    condition: An employee may move onto a different meal plan without closing the account, provided they meet the entry gate of the plan they are moving to on length of service, payroll consent and manager approval.
    evidence_fields:
    - meal_accounts.status
    - meal_accounts.variant_name
    - meal_accounts.plan_change_effective_date
    - meal_accounts.meal_account_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - meal_accounts.meal_account_id
      action_bindings:
        meal_accounts.meal_account_id: meal_account_id
    state_contract:
      field: meal_accounts.status
      allowed:
      - active
      - restricted
  params:
    per_tier:
      Pay-As-You-Go Badge Account:
        change_window_days: =plan_change_window_days
        cooldown_months: =plan_change_cooldown_months
