  baseline:
    rule: 'The employer allowance placed on a meal account for a grant period is worked out from the plan the account is held on, from the employer''s dining programme at the account''s site and from what the account''s own ledger shows has already been granted and spent. The base grant is the grant amount printed against the meal plan the account is held on. The availability share is the whole of the grant period. Nothing is carried into the new lot from allowance the account already holds. The grant period ceiling is the grant ceiling printed against the meal plan the account is held on. Nothing already on the account is treated as standing against the new lot. The allowance granted is worked out in this order and in no other: the base grant is taken at the availability share and rounded to two decimal places at that step; the amount carried in is added to that figure; the sum is then held to the grant period ceiling; and the allowance already standing is taken off last, the result never being read as less than nothing. The figure is rounded to two decimal places at the end, over and above the rounding named above. A window of calendar months in this policy runs back from the day the account is worked and never from the turn of a named month: an entry falls inside such a window while fewer than that many whole months have gone by since the day it was booked, a whole month going by only when the same day of the month comes round again, so an entry exactly that many whole months old falls outside it, and an entry booked after the day the account is worked falls outside it too.'
    params:
    - subsidy_grant_amount_usd
    - subsidy_grant_cap_per_period_usd
  inputs:
    history:
    - table: meal_transactions
      aggregate: sum
      field: amount_usd
      within_months: 1
      filters:
        transaction_code: subsidy_grant
    - table: meal_transactions
      aggregate: sum
      field: amount_usd
      within_months: 1
      filters:
        transaction_code: subsidy_application
    - table: meal_closure_requests
      aggregate: count
      field: request_type
      within_months: 3
      filters:
        request_type: leave_of_absence
    cross_category:
    - cafe
  temporal_basis:
    clock: frozen_time
    anchor_event: the day the account is worked
    anchor_source: frozen_time
    relation: not_before
    duration_source: the window of calendar months named in the sentence that uses it
    unit: calendar_months
    counting_rule: 'A window of calendar months in this policy runs back from the day the account is worked and never from the turn of a named month: an entry falls inside such a window while fewer than that many whole months have gone by since the day it was booked, a whole month going by only when the same day of the month comes round again, so an entry exactly that many whole months old falls outside it, and an entry booked after the day the account is worked falls outside it too.'
    boundary: exclusive
- id: meal_ext_ticket_allowance_application
  base_policy_refs:
  - meal_subsidy_application_rules
  - meal_combination_employer_program_interaction
  overwrite:
  - base_policy: meal_subsidy_application_rules
    superseded_clause: The allowance applied is the plan's share of the eligible ticket, held to the per transaction ceiling printed against the plan and to what is left in the employee's lots for the day.
    replaced_by: The allowance applied to a till transaction is the ticket share, held to the per transaction ceiling printed against the plan and held again to the allowance pot worked out above, and it is never read as less than nothing.
  - base_policy: meal_subsidy_application_rules
    superseded_clause: producing one application row per lot touched
    replaced_by: One application entry is booked for the whole of the allowance applied to a till transaction, whatever lots it draws on.
  - base_policy: meal_combination_employer_program_interaction
    superseded_clause: the employer's own subsidy funding meets the drawdown behind it
    replaced_by: What the employer's counter adds stands beside the employee's own lots in the pot rather than behind them, and is drawn on in the same call.
  trigger: state_due
  subject:
  - meal_subsidy_applied
  computes: applied_amount_usd
  target_tool: apply_allowance_to_ticket_3fbfdeca
  params:
    rollover_netting_pct: 50
    single_dinner_relief_usd: 1.5
    kiosk_share_pct: 30
  rule: 'Employer allowance is spent against a till transaction already rung on the account, and what it may meet is worked out from the ticket itself and from the allowance pot the account''s ledger supports on the day. The allowance applied to a till transaction is not settled before the allowance lot the account is owed for the current grant period stands on its ledger. The ticket is the largest meal rung against payroll on the account, and the ticket share is that ticket taken at the share of an eligible ticket printed against the meal plan, rounded to two decimal places at that step. No window limits which till transaction the ticket may be: the largest meal rung against payroll on the account is taken however long ago it was rung. The lots counted toward the allowance pot are the unspent allowance figure the account carries. Where the plan grants allowance on a daily basis and its lots lapse within two days, the lots counted are instead those granted in the calendar month running back from the day the account is worked; where the plan grants allowance on a monthly basis or its lots lapse after more than two days, the lots counted are instead those granted in the three calendar months running back from the day the account is worked; where neither holds, the unspent allowance figure the account carries is taken as it stands. Nothing is netted off the pot for allowance already applied. Where allowance has been applied on the account on two or more occasions in the calendar month running back from the day the account is worked and the plan does not allow unspent allowance to roll over, the amount netted off is the whole of those applications; where allowance has been applied on two or more occasions in the calendar month running back from the day the account is worked and the plan does allow unspent allowance to roll over, the amount netted off is those applications taken at the rollover netting share; where neither holds, nothing is netted off. The employer''s counter adds nothing to the pot. Where the employer''s cafe programme at the account''s site stands active and funds meals at a fixed amount for each meal, the employer''s counter adds the per employee daily subsidy that programme publishes; where the employer''s cafe programme at the account''s site stands active and funds meals at a percentage of the menu price, the employer''s counter adds that published percentage of the ticket; where neither holds, the employer''s counter adds nothing. Nothing is taken out of the pot for guest meals. Where the plan allows guest meals and two or more guest meals have been rung on the account in the calendar month running back from the day the account is worked, the amount taken out for guest meals is the whole value of those guest meals, since a run of them exhausts what the employer funds; where the plan allows guest meals and exactly one guest meal has been rung on the account in the calendar month running back from the day the account is worked, the amount taken out is the guest surcharge printed against the plan, once; where neither holds, nothing is taken out for guest meals. Nothing is taken out of the pot for meals rung outside the funded meal periods. Where the plan funds fewer than three meal periods a day and two or more dinners have been rung on the account in the calendar month running back from the day the account is worked, the amount taken out is the whole value of those dinners; where the plan funds fewer than three meal periods a day and exactly one dinner has been rung on the account in the calendar month running back from the day the account is worked, the amount taken out is that dinner less the single dinner relief, never read as less than nothing; where neither holds, nothing is taken out for meals outside the funded periods. Nothing is trimmed from the pot for a second counter at the site. Where the plan''s allowance reaches beyond the cafe and the employer''s micro market at the account''s site stands active, the pot is trimmed by the grant ceiling printed against the plan taken at the kiosk share, because a day''s allowance is read across both counters together; where the plan''s allowance reaches beyond the cafe and that micro market is still installing, the pot is trimmed by half of that same figure; where neither holds, nothing is trimmed. The allowance pot is the lots counted plus what the employer''s counter adds, less the amount netted off for allowance already applied, less the amount taken out for guest meals, less the amount taken out for meals outside the funded periods and less the amount trimmed for a second counter, and it is never read as less than nothing. The allowance applied to a till transaction is the ticket share, held to the per transaction ceiling printed against the plan and held again to the allowance pot worked out above, and it is never read as less than nothing. One application entry is booked for the whole of the allowance applied to a till transaction, whatever lots it draws on. What the employer''s counter adds stands beside the employee''s own lots in the pot rather than behind them, and is drawn on in the same call. The figure is rounded to two decimal places at the end, over and above the rounding named above. A window of calendar months in this policy runs back from the day the account is worked and never from the turn of a named month: an entry falls inside such a window while fewer than that many whole months have gone by since the day it was booked, a whole month going by only when the same day of the month comes round again, so an entry exactly that many whole months old falls outside it, and an entry booked after the day the account is worked falls outside it too.'
  prerequisite:
  - problem: meal_ext_daily_allowance_grant
    kind: value_input
    gate: lots_in_window_usd
    form: state
    policy_source: The allowance applied to a till transaction is not settled before the allowance lot the account is owed for the current grant period stands on its ledger.
    condition: the allowance lot owed for the current grant period stands as a grant entry on the account's ledger
    resolved_by: grant_daily_allowance_lot_ed948b99
