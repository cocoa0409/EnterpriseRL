  - payroll_meals_3m: SUM('meal_transactions','amount_usd', within_months=3, date_field='posted_date', transaction_code='meal_purchase', payment_channel='payroll_deduction')
  - payroll_meals_all: SUM('meal_transactions','amount_usd', date_field='posted_date', transaction_code='meal_purchase', payment_channel='payroll_deduction')
  - charges_1m_count: COUNT('meal_transactions', within_months=1, date_field='posted_date', transaction_code='charge_accrual')
  - meals_carried_usd: payroll_meals_1m if ((F('payroll_cycle') == 'weekly' or F('payroll_cycle') == 'biweekly') and charges_1m_count >= 1) else (payroll_meals_3m if ((F('payroll_cycle') == 'semimonthly' or F('payroll_cycle') == 'monthly') and charges_1m_count >= 1) else payroll_meals_all)
  - applications_1m: SUM('meal_transactions','amount_usd', within_months=1, date_field='posted_date', transaction_code='subsidy_application')
  - applications_1m_count: COUNT('meal_transactions', within_months=1, date_field='posted_date', transaction_code='subsidy_application')
  - allowance_credited_usd: applications_1m if (applications_1m_count >= 1 and P('discount_stacking_basis') == 'subsidy_first') else (RND(applications_1m * K('shared_stacking_credit_pct') / 100, 2) if (applications_1m_count >= 1 and P('discount_stacking_basis') == 'additive') else 0.0)
  - overdraft_count_1m: COUNT('meal_transactions', within_months=1, date_field='posted_date', transaction_code='overdraft_fee')
  - stored_value_applied_usd: F('meal_balance_usd') if (F('meal_balance_usd') >= P('min_load_usd') and overdraft_count_1m == 0) else (MX(0.0, F('meal_balance_usd') - P('overdraft_limit_usd')) if (F('meal_balance_usd') >= P('min_load_usd') and overdraft_count_1m >= 1) else 0.0)
  - charges_1m: SUM('meal_transactions','amount_usd', within_months=1, date_field='posted_date', transaction_code='charge_accrual')
  - charges_3m: SUM('meal_transactions','amount_usd', within_months=3, date_field='posted_date', transaction_code='charge_accrual')
  - recoveries_1m: SUM('meal_transactions','amount_usd', within_months=1, date_field='posted_date', transaction_code='payroll_deduction')
  - already_accrued_usd: charges_3m if (charges_1m_count >= 2 and recoveries_1m <= 0) else (MX(0.0, charges_1m - recoveries_1m) if (charges_1m_count >= 2 and recoveries_1m > 0) else 0.0)
  - balance_refunds_1m: MX(0.0, SUM('meal_transactions','amount_usd', within_months=1, date_field='posted_date', transaction_code='refund') - SUM('meal_transactions','amount_usd', within_months=1, date_field='posted_date', transaction_code='refund', payment_channel='subsidy'))
  - balance_refunds_3m: MX(0.0, SUM('meal_transactions','amount_usd', within_months=3, date_field='posted_date', transaction_code='refund') - SUM('meal_transactions','amount_usd', within_months=3, date_field='posted_date', transaction_code='refund', payment_channel='subsidy'))
  - refund_credited_usd: balance_refunds_1m if (P('refund_method') == 'to_balance' and balance_refunds_1m > 0) else (RND(balance_refunds_3m * K('stale_refund_credit_pct') / 100, 2) if (P('refund_method') == 'to_balance' and balance_refunds_1m <= 0 and balance_refunds_3m > 0) else 0.0)
  - guest_count_3m: COUNT('meal_transactions', within_months=3, date_field='posted_date', transaction_code='guest_meal')
  - guest_value_3m: SUM('meal_transactions','amount_usd', within_months=3, date_field='posted_date', transaction_code='guest_meal')
  - guest_surcharge_due_usd: RND(P('guest_meal_surcharge_usd') * guest_count_3m, 2) + guest_value_3m if (P('guest_meal_allowed') and guest_count_3m > P('guest_meals_per_month') * 3) else (RND(P('guest_meal_surcharge_usd') * guest_count_3m, 2) if (P('guest_meal_allowed') and guest_count_3m >= 1) else 0.0)
  - result: RND(MX(0.0, meals_carried_usd - allowance_credited_usd - stored_value_applied_usd - already_accrued_usd - refund_credited_usd + guest_surcharge_due_usd), 2)
  compute_basis:
