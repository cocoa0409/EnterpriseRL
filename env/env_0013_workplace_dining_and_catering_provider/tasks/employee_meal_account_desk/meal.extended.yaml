  - recoveries_remitted_to_date: SUM('meal_transactions','amount_usd', date_field='posted_date', transaction_code='payroll_deduction')
  - balance_standing_usd: MX(0.0, charges_accrued_to_date - recoveries_remitted_to_date)
  - charges_accrued_1m: SUM('meal_transactions','amount_usd', within_months=1, date_field='posted_date', transaction_code='charge_accrual')
  - recoveries_remitted_1m: SUM('meal_transactions','amount_usd', within_months=1, date_field='posted_date', transaction_code='payroll_deduction')
  - charges_accrued_3m: SUM('meal_transactions','amount_usd', within_months=3, date_field='posted_date', transaction_code='charge_accrual')
  - recoveries_remitted_3m: SUM('meal_transactions','amount_usd', within_months=3, date_field='posted_date', transaction_code='payroll_deduction')
  - latest_recovery_day: LATEST('meal_transactions','posted_date', date_field='posted_date', transaction_code='payroll_deduction')
  - days_since_latest_recovery: DAYS(latest_recovery_day, NOW)
  - recoverable_balance_usd: MX(0.0, charges_accrued_1m - recoveries_remitted_1m) if ((F('payroll_cycle') == 'weekly' or F('payroll_cycle') == 'biweekly') and days_since_latest_recovery <= K('recovery_recency_window_days')) else (MX(0.0, charges_accrued_3m - recoveries_remitted_3m) if ((F('payroll_cycle') == 'semimonthly' or F('payroll_cycle') == 'monthly') and days_since_latest_recovery <= K('recovery_recency_window_days')) else MX(0.0, charges_accrued_to_date - recoveries_remitted_to_date))
  - charge_count_1m: COUNT('meal_transactions', within_months=1, date_field='posted_date', transaction_code='charge_accrual')
  - recovery_ceiling_usd: P('payroll_deduction_cap_per_period_usd') * K('uplifted_ceiling_share_pct') / 100 if (F('status') == 'restricted' and charge_count_1m >= 3) else (P('payroll_deduction_cap_per_period_usd') * K('eased_ceiling_share_pct') / 100 if (F('status') == 'active' and charge_count_1m == 0) else P('payroll_deduction_cap_per_period_usd'))
  - site_cafe_status: CFIELD('cafe','status', site_code=F('site_code'))
  - site_cafe_daily_subsidy_usd: CPARAM('cafe','subsidy_cap_per_employee_per_day_usd', site_code=F('site_code'))
  - charge_count_3m: COUNT('meal_transactions', within_months=3, date_field='posted_date', transaction_code='charge_accrual')
  - employer_met_usd: RND(site_cafe_daily_subsidy_usd * charge_count_3m, 2) if (site_cafe_status == 'active' and site_cafe_daily_subsidy_usd >= K('strong_support_level_usd')) else (RND(site_cafe_daily_subsidy_usd * charge_count_3m / 2, 2) if (site_cafe_status == 'active' and site_cafe_daily_subsidy_usd < K('strong_support_level_usd')) else 0.0)
  - overdraft_count_3m: COUNT('meal_transactions', within_months=3, date_field='posted_date', transaction_code='overdraft_fee')
  - deferred_recovery_usd: K('deep_deferral_amount_usd') if (F('status') == 'restricted' and overdraft_count_3m >= 2) else (K('light_deferral_amount_usd') if (F('status') == 'restricted' and overdraft_count_3m == 1) else 0.0)
  - result: RND(MN(MX(0.0, MN(MX(0.0, recoverable_balance_usd - employer_met_usd), recovery_ceiling_usd) - deferred_recovery_usd), balance_standing_usd), 2)
  compute_basis:
