  compute:
  - payroll_meals_max_usd: MAX('meal_transactions','amount_usd', transaction_code='meal_purchase', payment_channel='payroll_deduction')
  - ticket_share_usd: RND(payroll_meals_max_usd * P('subsidy_pct_of_ticket') / 100, 2)
  - grants_1m: SUM('meal_transactions','amount_usd', within_months=1, date_field='posted_date', transaction_code='subsidy_grant')
  - grants_3m: SUM('meal_transactions','amount_usd', within_months=3, date_field='posted_date', transaction_code='subsidy_grant')
  - lots_in_window_usd: grants_1m if (P('subsidy_grant_basis') == 'daily' and P('subsidy_expiry_days') <= 2) else (grants_3m if (P('subsidy_grant_basis') == 'monthly' or P('subsidy_expiry_days') > 2) else F('subsidy_allowance_usd'))
  - applications_1m: SUM('meal_transactions','amount_usd', within_months=1, date_field='posted_date', transaction_code='subsidy_application')
  - applications_1m_count: COUNT('meal_transactions', within_months=1, date_field='posted_date', transaction_code='subsidy_application')
  - applications_netted_usd: applications_1m if (applications_1m_count >= 2 and not P('subsidy_rollover_allowed')) else (RND(applications_1m * K('rollover_netting_pct') / 100, 2) if (applications_1m_count >= 2 and P('subsidy_rollover_allowed')) else 0.0)
  - site_cafe_status: CFIELD('cafe','status', site_code=F('site_code'))
  - site_cafe_model: CPARAM('cafe','subsidy_model', site_code=F('site_code'))
  - site_cafe_daily_cap_usd: CPARAM('cafe','subsidy_cap_per_employee_per_day_usd', site_code=F('site_code'))
  - site_cafe_menu_pct: CPARAM('cafe','subsidy_pct_of_menu_price', site_code=F('site_code'))
  - employer_topup_usd: site_cafe_daily_cap_usd if (site_cafe_status == 'active' and site_cafe_model == 'fixed_per_meal') else (RND(payroll_meals_max_usd * site_cafe_menu_pct / 100, 2) if (site_cafe_status == 'active' and site_cafe_model == 'percent_discount') else 0.0)
  - guest_count_1m: COUNT('meal_transactions', within_months=1, date_field='posted_date', transaction_code='guest_meal')
  - guest_value_1m: SUM('meal_transactions','amount_usd', within_months=1, date_field='posted_date', transaction_code='guest_meal')
  - guest_exclusion_usd: guest_value_1m if (P('guest_meal_allowed') and guest_count_1m >= 2) else (P('guest_meal_surcharge_usd') if (P('guest_meal_allowed') and guest_count_1m == 1) else 0.0)
  - dinner_count_1m: COUNT('meal_transactions', within_months=1, date_field='posted_date', transaction_code='meal_purchase', meal_period='dinner')
  - dinner_value_1m: SUM('meal_transactions','amount_usd', within_months=1, date_field='posted_date', transaction_code='meal_purchase', meal_period='dinner')
  - unfunded_exclusion_usd: dinner_value_1m if (P('subsidy_eligible_meal_periods') < 3 and dinner_count_1m >= 2) else (MX(0.0, dinner_value_1m - K('single_dinner_relief_usd')) if (P('subsidy_eligible_meal_periods') < 3 and dinner_count_1m == 1) else 0.0)
  - site_market_status: CFIELD('market','status', site_code=F('site_code'))
  - kiosk_trim_usd: RND(P('subsidy_grant_cap_per_period_usd') * K('kiosk_share_pct') / 100, 2) if (P('subsidy_venue_scope') != 'cafe_only' and site_market_status == 'active') else (RND(P('subsidy_grant_cap_per_period_usd') * K('kiosk_share_pct') / 200, 2) if (P('subsidy_venue_scope') != 'cafe_only' and site_market_status == 'installing') else 0.0)
  - allowance_pot_usd: MX(0.0, lots_in_window_usd + employer_topup_usd - applications_netted_usd - guest_exclusion_usd - unfunded_exclusion_usd - kiosk_trim_usd)
  - result: RND(MX(0.0, MN(ticket_share_usd, P('subsidy_max_per_transaction_usd'), allowance_pot_usd)), 2)
  compute_basis:
    payroll_meals_max_usd: The ticket is the largest meal rung against payroll on the account, and the ticket share is that ticket taken at the share of an eligible ticket printed against the meal plan, rounded to two decimal places at that step.
    ticket_share_usd: The ticket is the largest meal rung against payroll on the account, and the ticket share is that ticket taken at the share of an eligible ticket printed against the meal plan, rounded to two decimal places at that step.
