    - subsidy_pct_of_ticket
    - subsidy_max_per_transaction_usd
  inputs:
    history:
    - table: meal_transactions
      aggregate: sum
      field: amount_usd
      within_months: 3
      filters:
        transaction_code: subsidy_grant
    - table: meal_transactions
      aggregate: sum
      field: amount_usd
      within_months: 1
      filters:
        transaction_code: subsidy_application
    - table: meal_transactions
      aggregate: max
      field: amount_usd
      within_months: 12
      filters:
        transaction_code: meal_purchase
    cross_category:
    - cafe
    - market
