  - id: market_ext_standby_period_settlement
    base_policy_refs: [market_agg_portfolio_settlement_band, market_settlement_terms, market_combination_dining_interaction]
    overwrite:
      - base_policy: market_agg_portfolio_settlement_band
        superseded_clause: >-
          The discount is applied to the management fee and the equipment lease only; product cost, subsidy true-up, shrink adjustments and one-off charges carry no portfolio discount.
        replaced_by: >-
          No portfolio discount is taken off a settlement raised for a period the market stood shut,
          the standing charge and the fee share already reflecting that the market was not trading.
      - base_policy: market_settlement_terms
        superseded_clause: >-
          a suspended market is invoiced the standby charge printed against its format in place of the equipment lease
        replaced_by: >-
          The settlement raised for a period a market stood shut is the standing charge for each
          month of the closure, together with the management fee printed against the market format
          for those same months at the fee share, and the held-over planogram step.
    trigger: state_due
    subject: [market_monthly_settlement_invoiced]
    computes: standby_settlement_usd
    target_tool: post_market_standby_settlement_ab27821d
    params:
      repeat_closure_count: 2
      prompt_settlement_count: 3
      slow_settlement_count: 1
      prompt_relief_share_pct: 94
      carrying_share_pct: 106
      cafe_pooled_floor_usd: 15000
      pooled_fee_share_pct: 40
      light_pooled_fee_share_pct: 70
      standing_fee_share_pct: 100
      planogram_floor: 2
    rule: >
      The settlement raised for a period a market stood shut is the standing charge for each month
      of the closure, together with the management fee printed against the market format for those
      same months at the fee share, and the held-over planogram step. The three amounts are each
      rounded to the nearest cent, a figure falling exactly on the half-cent going to the nearest even cent as they are taken and are then added, and the sum is rounded the same way; none of them acts on any of the others. No product
      settlement is raised for a period the market stood shut, since nothing was rung at the kiosk.
      No portfolio discount is taken off a settlement raised for a period the market stood shut, the
      standing charge and the fee share already reflecting that the market was not trading.
      The closure is charged as a single month. Where the closure has run at or beyond the minimum
      suspension printed against the market format and the agreement carries at or above the repeat
      closure count of approved suspension requests over the twelve months to the day the settlement
      is raised, the closed calendar days are divided by thirty and rounded up to a whole month.
      Where the closure has run at or beyond the minimum suspension printed against the market format
      and the agreement carries below the repeat closure count of approved suspension requests over
      those twelve months, the closed calendar days are divided by thirty and rounded down to a whole
      month, and never below one.
      The standing charge for a month is the standby charge printed against the market format. Where
      the client settled at or above the prompt settlement count of market settlement invoices over
      the twelve months to the day the settlement is raised and the balance standing unsettled on the
      agreement is below the minimum funding lot printed against the market format, the prompt relief
      share of that charge is taken instead. Where the client settled at or below the slow settlement
      count of market settlement invoices over those twelve months, or the balance standing unsettled
      on the agreement is at or above the minimum funding lot printed against the market format, the
      carrying share of that charge is taken.
      The fee share is the standing fee share. Where the client holds a workplace cafe contract
      standing active and that cafe has met at or above the cafe pooled floor of client subsidy over
      the twelve months to the day the settlement is raised, the pooled fee share is taken instead,
      the cafe carrying the dining programme while the market is shut. Where the client holds a
      workplace cafe contract standing active and that cafe has met below the cafe pooled floor of
      client subsidy over those twelve months, the light pooled fee share is taken.
      No planogram step is added. Where the client had at or above the planogram floor of planogram
      changes approved over the twelve months to the day the settlement is raised and no resumption
      request stands approved over those twelve months, the call-out charge printed against the
      market format is added for the planogram work held over the closure. Where the client had at or
      above the planogram floor of planogram changes approved over those twelve months and a
      resumption request stands approved over them, half the call-out charge printed against the
      market format is added.
    prerequisite: []
    cross_category:
