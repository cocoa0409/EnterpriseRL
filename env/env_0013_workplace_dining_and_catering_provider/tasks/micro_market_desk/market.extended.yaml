        them, and the whole held to the ceiling on credits in one settlement period printed against
        the market format. Each figure is rounded to the nearest cent, a figure falling exactly on the half-cent going to the nearest even cent as it is taken and the result is rounded the same way. The credit is recorded against the kiosk whose lost hours it answers. The hours are read from the kiosk outage
        requests approved on the agreement, each approved request standing for one hour the kiosk
        could not take a payment, and they are read over the three months to the day the credit is
        worked out. The chargeable hours are the hours so read, halved and rounded down to a whole
        hour. The credit rate is the percentage of the settlement printed against the market format.
        No empty-market step is credited. The allowed share is the full allowance share.
      params: [full_allowance_share_pct, outage_credit_pct_per_hour, outage_credit_cap_pct_of_settlement]
    inputs:
      history:
        - {table: market_ledger, aggregate: sum, field: amount_usd, within_months: 2, filters: {event_type: market_monthly_settlement_invoiced}}
        - {table: market_service_intake, aggregate: count, within_months: 6, filters: {request_type: service_credit_claim, request_status: approved}}
        - {table: market_service_intake, aggregate: count, within_months: 12, filters: {request_type: resumption_request, request_status: approved}}
      cross_category: []
  - id: market_ext_settlement_payment_amount
    base_policy_refs: [market_settlement_payment_terms]
    overwrite:
      - base_policy: market_settlement_payment_terms
        superseded_clause: >-
          A part payment settles the named invoice in part and never spills onto another
        replaced_by: >-
          What a client tenders is the balance standing on the agreement over the charge-reading
          window rather than the face of one invoice alone, and the payment is recorded against the
          settlement invoice the client is settling.
    trigger: on_request
    subject: [market_settlement_payment_posted]
    computes: payment_amount_usd
    target_tool: pay_market_settlement_invoice_693f0fba
    params:
      multi_charge_count: 2
      mid_month_cycle_day: 10
      several_credits_count: 2
      partial_credit_share_pct: 60
      most_credit_share_pct: 80
      full_credit_share_pct: 100
      early_settlement_days: 15
      regular_settler_count: 3
      deep_prompt_discount_pct: 1.5
      light_prompt_discount_pct: 0.75
      group_settlement_count: 2
      clear_group_offset_pct: 2.0
      carrying_group_offset_pct: 1.0
    rule: >
      What a client tenders is the balance standing on the agreement over the charge-reading window
      rather than the face of one invoice alone, and the payment is recorded against the settlement
      invoice the client is settling. The balance standing is the settlement charges read over that
      window, plus the shrink adjustments posted over the two months to the day the payment is
      taken, less the credits set against the settlement and less the settlement payments already
      recorded over those same two months, and it is never taken below nothing. From that balance
      the withheld amount is taken off, again never below nothing; the prompt-settlement discount is
      then taken off what is left; and the group-settlement offset is taken off the figure that step
      produces, so that the two reductions act one after the other on a shrinking figure rather than
      being added together and taken once. Each figure is rounded to the nearest cent, a figure falling exactly on the half-cent going to the nearest even cent as
      it is taken and the result is rounded the same way. The amount tendered
      against a settlement invoice is not settled before the product settlement for that period
      stands charged on the agreement. The amount tendered against a settlement invoice is not
      settled before a service credit carrying the kiosk whose lost hours it answers stands allowed
      against that invoice.
      The charge-reading window is the month to the day the payment is taken. Where the agreement
      carries at or above the multi-charge count of settlement charges over the two months to that
      day and the market format is invoiced on or after the mid-month cycle day, the charges are
      read over those two months. Where the agreement carries at or above the multi-charge count of
      settlement charges over those two months and the market format is invoiced before the
      mid-month cycle day, the charges are read over the four months to that day.
      Nothing is withheld from the balance. Where a shrink dispute on the agreement stands in review
      over the six months to the day the payment is taken and the agreement also carries a shrink
      dispute approved over those six months, the whole of the most recent shrink adjustment posted
      on the agreement is withheld. Where a shrink dispute on the agreement stands in review over
      those six months and the agreement carries no shrink dispute approved over those six months,
      half of the most recent shrink adjustment posted on the agreement is withheld.
      The credits standing on the agreement are set against the settlement in full. Where at or
      above the several-credits count of credits stand on the agreement over the two months to the
      day the payment is taken and the balance standing unsettled on the agreement is below the
      minimum funding lot printed against the market format, the partial credit share is set against
      this settlement and the rest is left to the next. Where at or above the several-credits count
      of credits stand on the agreement over those two months and the balance standing unsettled on
      the agreement is at or above the minimum funding lot printed against the market format, the
      greater credit share is set against this settlement and the rest is left to the next.
      The day the invoice was raised is read from the equipment line the settlement invoice
      carries, the equipment lease being raised with the invoice itself.
      No prompt-settlement discount is given. Where the settlement invoice the client is settling
      still has at or above the early-settlement days to run before it falls due and the client
      settled at or above the regular-settler count of market settlement invoices over the twelve
      months to the day the payment is taken, the deep prompt discount is given. Where the invoice
      still has at or above the early-settlement days to run before it falls due and the client
      settled below the regular-settler count of market settlement invoices over those twelve
      months, the light prompt discount is given.
      No group-settlement offset is given. Where the client holds a workplace cafe contract carrying
      nothing unsettled and that cafe has been settled at or above the group-settlement count of
      times over the three months to the day the payment is taken, the clear group offset is given.
      Where the client holds a workplace cafe contract carrying something unsettled and that cafe
      has been settled at or above the group-settlement count of times over those three months, the
      carrying group offset is given.
    prerequisite:
      - problem: market_ext_period_settlement_true_up
        kind: value_input
        gate: charges_side
        form: state
        policy_source: >-
          The amount tendered against a settlement invoice is not settled before the product
          settlement for that period stands charged on the agreement.
        condition: >-
          the market ledger carries the product settlement charge for that settlement period on the
          agreement
        resolved_by: post_market_settlement_true_up_13e3670a
        effect: >-
          the settlement charges read over the charge-reading window rise by the product settlement
          charge, so the charges_side binding, and with it the balance standing, take a larger value
      - problem: market_ext_outage_service_credit
        kind: value_input
        gate: credits_recent
        form: state
        policy_source: >-
          The amount tendered against a settlement invoice is not settled before a service credit
          carrying the kiosk whose lost hours it answers stands allowed against that invoice.
        condition: >-
          the market ledger carries a service credit against that settlement invoice that names the
          kiosk whose lost hours it answers
        resolved_by: issue_market_outage_credit_49294a76
        effect: >-
          the credits standing on the agreement over the two months rise by the outage credit, so
          the credits_recent binding grows and the balance standing falls
    cross_category:
      - category: cafe
        as: branch
        reads: [receivable_balance_usd, cafe_ledger.amount_usd]
        note: the group-settlement offset factor reads whether the client's cafe contract carries anything unsettled and how often that cafe has been settled over the trailing quarter
    compute:
      - charges_1m: "SUM('market_ledger','amount_usd', within_months=1, date_field='posted_date', event_type='market_monthly_settlement_invoiced')"
      - charges_2m: "SUM('market_ledger','amount_usd', within_months=2, date_field='posted_date', event_type='market_monthly_settlement_invoiced')"
      - charges_4m: "SUM('market_ledger','amount_usd', within_months=4, date_field='posted_date', event_type='market_monthly_settlement_invoiced')"
      - charge_count_2m: "COUNT('market_ledger', within_months=2, date_field='posted_date', event_type='market_monthly_settlement_invoiced')"
      - cycle_day: "P('invoice_cycle_day')"
      - charges_side: "charges_2m if (charge_count_2m >= K('multi_charge_count') and cycle_day >= K('mid_month_cycle_day')) else (charges_4m if (charge_count_2m >= K('multi_charge_count') and cycle_day < K('mid_month_cycle_day')) else charges_1m)"
      - shrink_recent: "SUM('market_ledger','amount_usd', within_months=2, date_field='posted_date', event_type='market_shrink_adjustment_posted')"
      - payments_recent: "SUM('market_ledger','amount_usd', within_months=2, date_field='posted_date', event_type='market_settlement_payment_posted')"
      - credits_recent: "SUM('market_ledger','amount_usd', within_months=2, date_field='posted_date', event_type='market_service_credit_issued')"
      - credits_count_2m: "COUNT('market_ledger', within_months=2, date_field='posted_date', event_type='market_service_credit_issued')"
      - unsettled_balance: "F('receivable_balance_usd')"
      - credit_share_pct: "K('partial_credit_share_pct') if (credits_count_2m >= K('several_credits_count') and unsettled_balance < P('subsidy_funding_minimum_usd')) else (K('most_credit_share_pct') if (credits_count_2m >= K('several_credits_count') and unsettled_balance >= P('subsidy_funding_minimum_usd')) else K('full_credit_share_pct'))"
      - open_disputes: "COUNT('market_service_intake', within_months=6, date_field='requested_effective_date', request_type='shrink_dispute', request_status='in_review')"
      - settled_disputes: "COUNT('market_service_intake', within_months=6, date_field='requested_effective_date', request_type='shrink_dispute', request_status='approved')"
      - latest_shrink: "float(LATEST('market_ledger','amount_usd', date_field='posted_date', event_type='market_shrink_adjustment_posted') or 0)"
      - withheld_usd: "latest_shrink if (open_disputes >= 1 and settled_disputes >= 1) else (RND(latest_shrink / 2, 2) if (open_disputes >= 1 and settled_disputes == 0) else 0.0)"
      - invoice_posted_date: "LATEST('market_ledger','posted_date', date_field='posted_date', charge_code='equipment_fee')"
      - days_to_due: "P('payment_terms_days') - DAYS(invoice_posted_date, NOW)"
      - settled_year: "COUNT('market_ledger', within_months=12, date_field='posted_date', event_type='market_settlement_payment_posted')"
      - prompt_discount_pct: "K('deep_prompt_discount_pct') if (days_to_due >= K('early_settlement_days') and settled_year >= K('regular_settler_count')) else (K('light_prompt_discount_pct') if (days_to_due >= K('early_settlement_days') and settled_year < K('regular_settler_count')) else 0.0)"
      - cafe_unsettled: "float(CFIELD('cafe','receivable_balance_usd') or 0)"
      - cafe_payments_q: "XCOUNT('cafe','cafe_ledger', within_months=3, date_field='posted_date', event_type='cafe_invoice_payment_posted')"
      - group_offset_pct: "K('clear_group_offset_pct') if (cafe_unsettled <= 0 and cafe_payments_q >= K('group_settlement_count')) else (K('carrying_group_offset_pct') if (cafe_unsettled > 0 and cafe_payments_q >= K('group_settlement_count')) else 0.0)"
      - net_credits_applied: "RND(credits_recent * credit_share_pct / 100, 2)"
      - standing_balance: "MX(0.0, RND(charges_side + shrink_recent - net_credits_applied - payments_recent, 2))"
      - after_withholding: "MX(0.0, RND(standing_balance - withheld_usd, 2))"
      - after_prompt: "RND(after_withholding * (1 - prompt_discount_pct / 100), 2)"
      - result: "RND(after_prompt * (1 - group_offset_pct / 100), 2)"
    compute_basis:
      charges_1m: "The charge-reading window is the month to the day the payment is taken."
      charges_2m: "Where the agreement carries at or above the multi-charge count of settlement charges over the two months to that day and the market format is invoiced on or after the mid-month cycle day, the charges are read over those two months."
      charges_4m: "Where the agreement carries at or above the multi-charge count of settlement charges over those two months and the market format is invoiced before the mid-month cycle day, the charges are read over the four months to that day."
      charge_count_2m: "Where the agreement carries at or above the multi-charge count of settlement charges over the two months to that day and the market format is invoiced on or after the mid-month cycle day, the charges are read over those two months."
      cycle_day: "Where the agreement carries at or above the multi-charge count of settlement charges over those two months and the market format is invoiced before the mid-month cycle day, the charges are read over the four months to that day."
