      drawdowns_9m: "Where at or above the material drawn amount has been drawn against the agreement and some of what was drawn falls outside the months a lot stays drawable, only what was drawn before those months is set against the lapsed funding, the lots being drawn oldest first."
      drawdowns_12m: "Where at or above the material drawn amount has been drawn against the agreement and some of what was drawn falls outside the months a lot stays drawable, only what was drawn before those months is set against the lapsed funding, the lots being drawn oldest first."
      drawdowns_live: "Where at or above the material drawn amount has been drawn against the agreement and some of what was drawn falls outside the months a lot stays drawable, only what was drawn before those months is set against the lapsed funding, the lots being drawn oldest first."
      drawn_against_lapsed: "Everything drawn against the agreement is set against the lapsed funding. Where at or above the material drawn amount has been drawn against the agreement and some of what was drawn falls outside the months a lot stays drawable, only what was drawn before those months is set against the lapsed funding, the lots being drawn oldest first. Where at or above the material drawn amount has been drawn against the agreement and none of what was drawn falls outside those months, half of everything drawn is set against the lapsed funding."
      unspent_balance: "The unspent balance is the lapsed funding less the drawdowns set against it, never below nothing; the credit is that balance at the credit share, together with the closure relief and the lapse share of the settlement read over the settlement-reading window; and the whole is held to the ceiling on credits in one settlement period printed against the market format, measured against that same settlement."
      funding_lot_count: "Where the client has funded at or above the repeat funding count of subsidy lots on the agreement and settled at or above the prompt settlement count of market settlement invoices over the twelve months to the day the credit is worked out, the full credit share is handed back."
      settlement_payments_y: "Where the client has funded at or above the repeat funding count of subsidy lots on the agreement and settled below the prompt settlement count of market settlement invoices over those twelve months, the retained credit share is handed back."
      credit_share_pct: "The credit share is the standing credit share. Where the client has funded at or above the repeat funding count of subsidy lots on the agreement and settled at or above the prompt settlement count of market settlement invoices over the twelve months to the day the credit is worked out, the full credit share is handed back. Where the client has funded at or above the repeat funding count of subsidy lots on the agreement and settled below the prompt settlement count of market settlement invoices over those twelve months, the retained credit share is handed back."
      suspension_requests_y: "Where the agreement carries an approved suspension request over the twelve months to the day the credit is worked out and at or above the material outage count of approved kiosk outage requests over those twelve months, the call-out charge printed against the market format is credited twice over as closure relief."
      outage_claims_y: "Where the agreement carries an approved suspension request over those twelve months and below the material outage count of approved kiosk outage requests over them, the call-out charge printed against the market format is credited once."
      closure_relief_usd: "No closure relief is credited. Where the agreement carries an approved suspension request over the twelve months to the day the credit is worked out and at or above the material outage count of approved kiosk outage requests over those twelve months, the call-out charge printed against the market format is credited twice over as closure relief. Where the agreement carries an approved suspension request over those twelve months and below the material outage count of approved kiosk outage requests over them, the call-out charge printed against the market format is credited once."
      resumption_requests_y: "Where the agreement carries at or above the repeat resumption count of approved resumption requests over the twelve months to the day the credit is worked out and at or above the planogram floor of approved planogram changes over those twelve months, the high lapse share of the settlement is credited as well."
      planogram_requests_y: "Where the agreement carries at or above the repeat resumption count of approved resumption requests over those twelve months and below the planogram floor of approved planogram changes over them, the low lapse share of the settlement is credited."
      lapse_settlement_pct: "No share of the settlement is credited for the lapse. Where the agreement carries at or above the repeat resumption count of approved resumption requests over the twelve months to the day the credit is worked out and at or above the planogram floor of approved planogram changes over those twelve months, the high lapse share of the settlement is credited as well. Where the agreement carries at or above the repeat resumption count of approved resumption requests over those twelve months and below the planogram floor of approved planogram changes over them, the low lapse share of the settlement is credited."
      settlement_1m: "The settlement-reading window is the month to the day the credit is worked out."
      settlement_2m: "Where the agreement carries at or above the multi-charge count of settlement charges over the two months to that day and the market format is invoiced on or after the mid-month cycle day, the settlement is read over those two months."
      settlement_4m: "Where the agreement carries at or above the multi-charge count of settlement charges over those two months and the market format is invoiced before the mid-month cycle day, the settlement is read over the four months to that day."
      settlement_charge_count_2m: "Where the agreement carries at or above the multi-charge count of settlement charges over the two months to that day and the market format is invoiced on or after the mid-month cycle day, the settlement is read over those two months."
      cycle_day: "Where the agreement carries at or above the multi-charge count of settlement charges over those two months and the market format is invoiced before the mid-month cycle day, the settlement is read over the four months to that day."
      settlement_base: "The settlement-reading window is the month to the day the credit is worked out. Where the agreement carries at or above the multi-charge count of settlement charges over the two months to that day and the market format is invoiced on or after the mid-month cycle day, the settlement is read over those two months. Where the agreement carries at or above the multi-charge count of settlement charges over those two months and the market format is invoiced before the mid-month cycle day, the settlement is read over the four months to that day."
      base_credit: "the credit is that balance at the credit share"
      settlement_step_usd: "No share of the settlement is credited for the lapse."
      gross_credit: "Each figure is rounded to the nearest cent, a figure falling exactly on the half-cent going to the nearest even cent as it is taken and the result is rounded the same way."
      period_ceiling: "and the whole is held to the ceiling on credits in one settlement period printed against the market format, measured against that same settlement"
      result: "Each figure is rounded to the nearest cent, a figure falling exactly on the half-cent going to the nearest even cent as it is taken and the result is rounded the same way."
    factors:
      - id: drawdown_attribution_basis
        effect: method
        decides: drawn_against_lapsed
        bindings: [drawdowns_all, drawn_against_lapsed]
        ladder:
          - when: "at or above the material drawn amount has been drawn against the agreement and some of what was drawn falls outside the months a lot stays drawable"
            method: "only what was drawn before those months is set against the lapsed funding, the lots being drawn oldest first"
          - when: "at or above the material drawn amount has been drawn against the agreement and none of what was drawn falls outside those months"
            method: "half of everything drawn is set against the lapsed funding"
          - when: "otherwise"
            method: "everything drawn against the agreement is set against the lapsed funding"
        baseline:
          drawn_against_lapsed: "drawdowns_all"
        evidence: [history]
        cross_difficulty: null
      - id: settlement_reading_window
        effect: method
        decides: settlement_base
        bindings: [settlement_1m, settlement_2m, settlement_4m, settlement_charge_count_2m, cycle_day, settlement_base]
        ladder:
          - when: "the agreement carries at or above the multi-charge count of settlement charges over the two months to the day the credit is worked out and the market format is invoiced on or after the mid-month cycle day"
            method: "the settlement is read over those two months"
          - when: "the agreement carries at or above the multi-charge count of settlement charges over those two months and the market format is invoiced before the mid-month cycle day"
            method: "the settlement is read over the four months to that day"
          - when: "otherwise"
            method: "the settlement is read over the month to that day"
        baseline:
          settlement_base: "settlement_1m"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: lapsed_credit_share
        effect: parameter
        decides: credit_share_pct
        bindings: [funding_lot_count, settlement_payments_y, credit_share_pct]
        ladder:
          - when: "the client has funded at or above the repeat funding count of subsidy lots on the agreement and settled at or above the prompt settlement count of market settlement invoices over the twelve months to the day the credit is worked out"
            value: "the full credit share"
          - when: "the client has funded at or above the repeat funding count of subsidy lots on the agreement and settled below the prompt settlement count of market settlement invoices over those twelve months"
            value: "the retained credit share"
          - when: "otherwise"
            value: "the standing credit share"
        baseline:
          credit_share_pct: "K('standing_credit_share_pct')"
        evidence: [history]
        cross_difficulty: null
      - id: closure_relief_step
        effect: parameter
        decides: closure_relief_usd
        bindings: [suspension_requests_y, outage_claims_y, closure_relief_usd]
        ladder:
          - when: "the agreement carries an approved suspension request over the twelve months to the day the credit is worked out and at or above the material outage count of approved kiosk outage requests over those twelve months"
            value: "twice the call-out charge printed against the market format"
          - when: "the agreement carries an approved suspension request over those twelve months and below the material outage count of approved kiosk outage requests over them"
            value: "the call-out charge printed against the market format, once"
          - when: "otherwise"
            value: "no closure relief"
        baseline:
          closure_relief_usd: "0.0"
        evidence: [history]
        cross_difficulty: null
      - id: lapse_settlement_share
        effect: parameter
        decides: lapse_settlement_pct
        bindings: [resumption_requests_y, planogram_requests_y, lapse_settlement_pct]
        ladder:
          - when: "the agreement carries at or above the repeat resumption count of approved resumption requests over the twelve months to the day the credit is worked out and at or above the planogram floor of approved planogram changes over those twelve months"
            value: "the high lapse share of the settlement"
          - when: "the agreement carries at or above the repeat resumption count of approved resumption requests over those twelve months and below the planogram floor of approved planogram changes over them"
            value: "the low lapse share of the settlement"
          - when: "otherwise"
            value: "no share of the settlement"
        baseline:
          lapse_settlement_pct: "0.0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        Where a subsidy funding lot has run past the months it stays drawable, the balance left
        unspent in it is credited back to the client against the settlement invoice for the period.
        A lot stays drawable for the months printed against the market format, counted from the day
        the funding cleared, so the lapsed funding is what was paid in before that many months back
        from the day the credit is worked out. The unspent balance is the lapsed funding less the
        drawdowns set against it, never below nothing; the credit is that balance at the credit share,
        together with the closure relief and the lapse share of the settlement read over the
        settlement-reading window; and the whole is held to the ceiling on credits in one settlement
        period printed against the market format, measured against that same settlement. Each figure
        is rounded to the nearest cent, a figure falling exactly on the half-cent going to the nearest even cent as it is taken and the result is rounded the same way.
        The credit is recorded against no kiosk, since it hands back funding rather than answering
        kiosk time. Everything drawn against the agreement is set against the lapsed funding. The
        settlement-reading window is the month to the day the credit is worked out. The credit share
        is the standing credit share. No closure relief is credited. No share of the settlement is
        credited for the lapse.
      params: [standing_credit_share_pct, subsidy_funding_lot_expiry_months, outage_credit_cap_pct_of_settlement, invoice_cycle_day]
    inputs:
      history:
        - {table: market_ledger, aggregate: sum, field: amount_usd, within_months: 12, filters: {event_type: market_subsidy_funding_posted}}
        - {table: market_ledger, aggregate: sum, field: amount_usd, within_months: 12, filters: {event_type: market_subsidy_drawdown_posted}}
        - {table: market_ledger, aggregate: sum, field: amount_usd, within_months: 2, filters: {event_type: market_monthly_settlement_invoiced}}
        - {table: market_service_intake, aggregate: count, within_months: 12, filters: {request_type: service_credit_claim, request_status: approved}}
      cross_category: []
  - id: market_ext_subsidy_funding_lot
    base_policy_refs: [market_subsidy_funding_terms]
    overwrite:
      - base_policy: market_subsidy_funding_terms
        superseded_clause: >-
          A lot may not be smaller than the minimum funding lot printed against the market format, and a client wishing to fund less is asked to combine the amount into the next lot.
        replaced_by: >-
          The lot a client pays in is the subsidy the cover period is expected to need, less the
          share of the funding still drawable that is set against it, plus the handling step.
    trigger: on_request
    subject: [market_subsidy_funding_posted]
    computes: funding_amount_usd
    target_tool: fund_market_subsidy_lot_f6d53aaa
    params:
      long_drawable_life_months: 12
      repeat_funding_count: 2
      standard_cover_months: 3
      subsidy_per_head_per_month_usd: 20.00
      active_kiosk_year_usd: 3000
      wide_range_sku_floor: 250
      heavy_take_up_pct: 35
      light_take_up_pct: 18
      standing_take_up_pct: 25
      low_contingency_pct: 5
      high_contingency_pct: 15
      standing_contingency_pct: 10
    rule: >
      The lot a client pays in is the subsidy the cover period is expected to need, less the share of
      the funding still drawable that is set against it, plus the handling step. The expected need
      for one month is the badged headcount the site reports multiplied by the subsidy allowed for
      one employee for one month and by the take-up share; the cover need is that monthly figure
      multiplied by the cover months and then raised once by the contingency share, the contingency
      acting on the whole cover need rather than on the monthly figure; the drawable share is taken
      off the cover need, and the handling step is added to what is left. Each figure is rounded to the nearest cent, a figure falling exactly on the half-cent going to the nearest even cent as it is taken and the result is rounded the same way.
      The funding still drawable is what was paid in over the twelve months to the day the lot is
      worked out, less what has been drawn at the kiosk over those same twelve months, less what has
      been handed back to the client on a settlement, being the credits standing on the agreement
      that name no kiosk, and never below nothing. Where the lot so worked out falls below the
      minimum funding lot printed against the market format, no lot is taken and the client is asked
      to combine the amount into the next one. The lot the client pays in is not fixed before a
      service credit naming no kiosk stands on the agreement, being the funding handed back to the
      client on a settlement.
      The cover period is the standard cover. Where the market format keeps a funding lot drawable
      for at or beyond the long drawable life and the agreement carries at or above the repeat
      funding count of funding lots, the cover runs to the whole of the drawable life. Where the
      market format keeps a funding lot drawable for below the long drawable life and the agreement
      carries at or above the repeat funding count of funding lots, the cover runs to half the
      drawable life, rounded up to a whole month.
      The take-up share is the standing take-up. Where at or above the active-kiosk year amount has been drawn at the kiosk over the twelve months to the day the lot is worked out and no
      suspension request stands approved on the agreement over those twelve months, the heavy take-up
      applies. Where at or above the active-kiosk year amount has been drawn at the kiosk over those
      twelve months and a suspension request stands approved on the agreement over them, the light
      take-up applies.
      The contingency share is the standing contingency. Where a suspension request stands approved
      on the agreement over the twelve months to the day the lot is worked out and a shrink
      adjustment stands on the agreement over those twelve months, the low contingency applies, the
      market having sold less and lost stock while it was shut. Where a suspension request stands
      approved on the agreement over those twelve months and no shrink adjustment stands on the
      agreement over them, the high contingency applies.
      The whole of the funding still drawable is set against the cover need. Where the agreement
      carries at or above the repeat funding count of funding lots and a suspension request stands
      approved over the twelve months to the day the lot is worked out, half of the funding still
      drawable is set against the cover need, the rest being held back against the reopening. Where
      the agreement carries below the repeat funding count of funding lots and a suspension request
      stands approved over those twelve months, none of the funding still drawable is set against the
      cover need.
      No handling step is added. Where at or above the active-kiosk year amount has been drawn at the kiosk over the twelve months to the day the lot is worked out and the market format carries
      at or above the wide-range product count of distinct products, the call-out charge printed
      against the market format is added as the handling step. Where at or above the active-kiosk year amount has been drawn at the kiosk over those twelve months and the market format carries
      below the wide-range product count of distinct products, half the call-out charge printed
      against the market format is added.
    prerequisite:
      - problem: market_ext_lapsed_lot_settlement_credit
        kind: value_input
        gate: drawable_balance
        form: state
        policy_source: >-
          The lot the client pays in is not fixed before a service credit naming no kiosk stands on
          the agreement, being the funding handed back to the client on a settlement.
        condition: >-
          the market ledger carries a service credit on the agreement that names no kiosk, handing
          back the funding that has run past the months it stays drawable
        resolved_by: issue_lapsed_funding_credit_131d77d2
        effect: >-
          the funding still drawable falls by what has been handed back, so the drawable_balance
          binding shrinks and the lot the client must pay in grows
    cross_category: []
    compute:
      - funding_12m: "SUM('market_ledger','amount_usd', within_months=12, date_field='posted_date', event_type='market_subsidy_funding_posted')"
      - drawdowns_12m: "SUM('market_ledger','amount_usd', within_months=12, date_field='posted_date', event_type='market_subsidy_drawdown_posted')"
      - credits_all: "SUM('market_ledger','amount_usd', event_type='market_service_credit_issued', kiosk_reference='')"
      - drawable_balance: "MX(RND(funding_12m - drawdowns_12m - credits_all, 2), 0.0)"
      - lot_expiry: "P('subsidy_funding_lot_expiry_months')"
      - funding_lot_count: "COUNT('market_ledger', event_type='market_subsidy_funding_posted')"
      - cover_months: "P('subsidy_funding_lot_expiry_months') if (lot_expiry >= K('long_drawable_life_months') and funding_lot_count >= K('repeat_funding_count')) else (MX(int((lot_expiry + 1) / 2), 1) if (lot_expiry < K('long_drawable_life_months') and funding_lot_count >= K('repeat_funding_count')) else K('standard_cover_months'))"
      - drawn_year: "SUM('market_ledger','amount_usd', within_months=12, date_field='posted_date', event_type='market_subsidy_drawdown_posted')"
      - suspension_y_take: "COUNT('market_service_intake', within_months=12, date_field='requested_effective_date', request_type='suspension_request', request_status='approved')"
      - take_up_pct: "K('heavy_take_up_pct') if (drawn_year >= K('active_kiosk_year_usd') and suspension_y_take == 0) else (K('light_take_up_pct') if (drawn_year >= K('active_kiosk_year_usd') and suspension_y_take >= 1) else K('standing_take_up_pct'))"
      - shrink_y: "COUNT('market_ledger', within_months=12, date_field='posted_date', event_type='market_shrink_adjustment_posted')"
      - suspension_y_cont: "COUNT('market_service_intake', within_months=12, date_field='requested_effective_date', request_type='suspension_request', request_status='approved')"
      - contingency_pct: "K('low_contingency_pct') if (suspension_y_cont >= 1 and shrink_y >= 1) else (K('high_contingency_pct') if (suspension_y_cont >= 1 and shrink_y == 0) else K('standing_contingency_pct'))"
      - funding_lot_count_offset: "COUNT('market_ledger', event_type='market_subsidy_funding_posted')"
      - suspension_y_offset: "COUNT('market_service_intake', within_months=12, date_field='requested_effective_date', request_type='suspension_request', request_status='approved')"
      - offset_balance: "RND(drawable_balance / 2, 2) if (funding_lot_count_offset >= K('repeat_funding_count') and suspension_y_offset >= 1) else (0.0 if (funding_lot_count_offset < K('repeat_funding_count') and suspension_y_offset >= 1) else drawable_balance)"
      - drawn_year_handling: "SUM('market_ledger','amount_usd', within_months=12, date_field='posted_date', event_type='market_subsidy_drawdown_posted')"
      - range_sku: "P('sku_count')"
      - handling_step_usd: "P('restocking_call_out_fee_usd') if (drawn_year_handling >= K('active_kiosk_year_usd') and range_sku >= K('wide_range_sku_floor')) else (RND(P('restocking_call_out_fee_usd') / 2, 2) if (drawn_year_handling >= K('active_kiosk_year_usd') and range_sku < K('wide_range_sku_floor')) else 0.0)"
      - monthly_need: "RND(F('headcount_served') * K('subsidy_per_head_per_month_usd') * take_up_pct / 100, 2)"
      - cover_need: "RND(monthly_need * cover_months * (1 + contingency_pct / 100), 2)"
      - result: "RND(cover_need - offset_balance + handling_step_usd, 2)"
    compute_basis:
