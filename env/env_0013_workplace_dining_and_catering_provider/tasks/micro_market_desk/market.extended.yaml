      cover_need: "The expected need for one month is the badged headcount the site reports multiplied by the subsidy allowed for one employee for one month and by the take-up share; the cover need is that monthly figure multiplied by the cover months and then raised once by the contingency share, the contingency acting on the whole cover need rather than on the monthly figure; the drawable share is taken off the cover need, and the handling step is added to what is left."
