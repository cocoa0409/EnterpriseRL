        as: branch
        reads: [status, cafe_ledger.amount_usd]
        note: the fee share factor reads whether the client's cafe contract stands active and how much client subsidy the cafe ledger shows met over the trailing year, to decide what share of the market management fee is charged while the market is shut
    compute:
      - closed_days: "DAYS(F('suspension_start_date'), NOW)"
      - suspension_requests_y: "COUNT('market_service_intake', within_months=12, date_field='requested_effective_date', request_type='suspension_request', request_status='approved')"
      - standby_months: "MX(int((closed_days + 29) / 30), 1) if (closed_days >= P('min_suspension_days') and suspension_requests_y >= K('repeat_closure_count')) else (MX(int(closed_days / 30), 1) if (closed_days >= P('min_suspension_days') and suspension_requests_y < K('repeat_closure_count')) else 1)"
      - paid_settlements_year: "COUNT('market_ledger', within_months=12, date_field='posted_date', event_type='market_settlement_payment_posted')"
      - unsettled_balance: "F('receivable_balance_usd')"
      - standby_monthly_usd: "RND(P('suspension_standby_fee_usd') * K('prompt_relief_share_pct') / 100, 2) if (paid_settlements_year >= K('prompt_settlement_count') and unsettled_balance < P('subsidy_funding_minimum_usd')) else (RND(P('suspension_standby_fee_usd') * K('carrying_share_pct') / 100, 2) if (paid_settlements_year <= K('slow_settlement_count') or unsettled_balance >= P('subsidy_funding_minimum_usd')) else P('suspension_standby_fee_usd'))"
      - cafe_status: "CFIELD('cafe','status')"
      - cafe_subsidy_year: "XSUM('cafe','cafe_ledger','amount_usd', within_months=12, date_field='posted_date', event_type='cafe_subsidy_drawdown_posted')"
      - fee_share_pct: "K('pooled_fee_share_pct') if (cafe_status == 'active' and cafe_subsidy_year >= K('cafe_pooled_floor_usd')) else (K('light_pooled_fee_share_pct') if (cafe_status == 'active' and cafe_subsidy_year < K('cafe_pooled_floor_usd')) else K('standing_fee_share_pct'))"
      - planogram_requests_y: "COUNT('market_service_intake', within_months=12, date_field='requested_effective_date', request_type='planogram_change_request', request_status='approved')"
      - resumption_requests_y: "COUNT('market_service_intake', within_months=12, date_field='requested_effective_date', request_type='resumption_request', request_status='approved')"
      - notice_step_usd: "P('restocking_call_out_fee_usd') if (planogram_requests_y >= K('planogram_floor') and resumption_requests_y == 0) else (RND(P('restocking_call_out_fee_usd') / 2, 2) if (planogram_requests_y >= K('planogram_floor') and resumption_requests_y >= 1) else 0.0)"
      - standby_usd: "RND(standby_months * standby_monthly_usd, 2)"
      - fee_usd: "RND(standby_months * P('management_fee_monthly_usd') * fee_share_pct / 100, 2)"
      - result: "RND(standby_usd + fee_usd + notice_step_usd, 2)"
    compute_basis:
      closed_days: "Where the closure has run at or beyond the minimum suspension printed against the market format and the agreement carries at or above the repeat closure count of approved suspension requests over the twelve months to the day the settlement is raised, the closed calendar days are divided by thirty and rounded up to a whole month."
      suspension_requests_y: "Where the closure has run at or beyond the minimum suspension printed against the market format and the agreement carries below the repeat closure count of approved suspension requests over those twelve months, the closed calendar days are divided by thirty and rounded down to a whole month, and never below one."
      standby_months: "The closure is charged as a single month. Where the closure has run at or beyond the minimum suspension printed against the market format and the agreement carries at or above the repeat closure count of approved suspension requests over the twelve months to the day the settlement is raised, the closed calendar days are divided by thirty and rounded up to a whole month. Where the closure has run at or beyond the minimum suspension printed against the market format and the agreement carries below the repeat closure count of approved suspension requests over those twelve months, the closed calendar days are divided by thirty and rounded down to a whole month, and never below one."
      paid_settlements_year: "Where the client settled at or above the prompt settlement count of market settlement invoices over the twelve months to the day the settlement is raised and the balance standing unsettled on the agreement is below the minimum funding lot printed against the market format, the prompt relief share of that charge is taken instead."
      unsettled_balance: "Where the client settled at or below the slow settlement count of market settlement invoices over those twelve months, or the balance standing unsettled on the agreement is at or above the minimum funding lot printed against the market format, the carrying share of that charge is taken."
      standby_monthly_usd: "The standing charge for a month is the standby charge printed against the market format. Where the client settled at or above the prompt settlement count of market settlement invoices over the twelve months to the day the settlement is raised and the balance standing unsettled on the agreement is below the minimum funding lot printed against the market format, the prompt relief share of that charge is taken instead. Where the client settled at or below the slow settlement count of market settlement invoices over those twelve months, or the balance standing unsettled on the agreement is at or above the minimum funding lot printed against the market format, the carrying share of that charge is taken."
      cafe_status: "Where the client holds a workplace cafe contract standing active and that cafe has met at or above the cafe pooled floor of client subsidy over the twelve months to the day the settlement is raised, the pooled fee share is taken instead, the cafe carrying the dining programme while the market is shut."
      cafe_subsidy_year: "Where the client holds a workplace cafe contract standing active and that cafe has met below the cafe pooled floor of client subsidy over those twelve months, the light pooled fee share is taken."
      fee_share_pct: "The fee share is the standing fee share. Where the client holds a workplace cafe contract standing active and that cafe has met at or above the cafe pooled floor of client subsidy over the twelve months to the day the settlement is raised, the pooled fee share is taken instead, the cafe carrying the dining programme while the market is shut. Where the client holds a workplace cafe contract standing active and that cafe has met below the cafe pooled floor of client subsidy over those twelve months, the light pooled fee share is taken."
      planogram_requests_y: "Where the client had at or above the planogram floor of planogram changes approved over the twelve months to the day the settlement is raised and no resumption request stands approved over those twelve months, the call-out charge printed against the market format is added for the planogram work held over the closure."
      resumption_requests_y: "Where the client had at or above the planogram floor of planogram changes approved over those twelve months and a resumption request stands approved over them, half the call-out charge printed against the market format is added."
      notice_step_usd: "No planogram step is added. Where the client had at or above the planogram floor of planogram changes approved over the twelve months to the day the settlement is raised and no resumption request stands approved over those twelve months, the call-out charge printed against the market format is added for the planogram work held over the closure. Where the client had at or above the planogram floor of planogram changes approved over those twelve months and a resumption request stands approved over them, half the call-out charge printed against the market format is added."
      standby_usd: "The settlement raised for a period a market stood shut is the standing charge for each month of the closure, together with the management fee printed against the market format for those same months at the fee share, and the held-over planogram step."
      fee_usd: "The settlement raised for a period a market stood shut is the standing charge for each month of the closure, together with the management fee printed against the market format for those same months at the fee share, and the held-over planogram step."
      result: "The three amounts are each rounded to the nearest cent, a figure falling exactly on the half-cent going to the nearest even cent as they are taken and are then added, and the sum is rounded the same way; none of them acts on any of the others."
    factors:
      - id: closure_month_basis
        effect: method
        decides: standby_months
        bindings: [closed_days, suspension_requests_y, standby_months]
        ladder:
          - when: "the closure has run at or beyond the minimum suspension printed against the market format and the agreement carries at or above the repeat closure count of approved suspension requests over the twelve months to the day the settlement is raised"
            method: "the closed calendar days are divided by thirty and rounded up to a whole month"
          - when: "the closure has run at or beyond the minimum suspension printed against the market format and the agreement carries below the repeat closure count of approved suspension requests over those twelve months"
            method: "the closed calendar days are divided by thirty and rounded down to a whole month, and never below one"
          - when: "otherwise"
            method: "the closure is charged as a single month"
        baseline:
          standby_months: "1"
        evidence: [date, history]
        cross_difficulty: null
      - id: standing_charge_rate
        effect: parameter
        decides: standby_monthly_usd
        bindings: [paid_settlements_year, unsettled_balance, standby_monthly_usd]
        ladder:
          - when: "the client settled at or above the prompt settlement count of market settlement invoices over the twelve months to the day the settlement is raised and the balance standing unsettled on the agreement is below the minimum funding lot printed against the market format"
            value: "the prompt relief share of the standby charge printed against the market format"
          - when: "the client settled at or below the slow settlement count of market settlement invoices over those twelve months, or the balance standing unsettled on the agreement is at or above the minimum funding lot printed against the market format"
            value: "the carrying share of the standby charge printed against the market format"
          - when: "otherwise"
            value: "the standby charge printed against the market format"
        baseline:
          standby_monthly_usd: "P('suspension_standby_fee_usd')"
        evidence: [history]
        cross_difficulty: null
      - id: management_fee_share
        effect: parameter
        decides: fee_share_pct
        bindings: [cafe_status, cafe_subsidy_year, fee_share_pct]
        ladder:
          - when: "the client holds a workplace cafe contract standing active and that cafe has met at or above the cafe pooled floor of client subsidy over the twelve months to the day the settlement is raised"
            value: "the pooled fee share"
          - when: "the client holds a workplace cafe contract standing active and that cafe has met below the cafe pooled floor of client subsidy over those twelve months"
            value: "the light pooled fee share"
          - when: "otherwise"
            value: "the standing fee share"
        baseline:
          fee_share_pct: "K('standing_fee_share_pct')"
        evidence: [cross_category, history]
        cross_difficulty: cafe
      - id: held_over_planogram_step
        effect: parameter
        decides: notice_step_usd
        bindings: [planogram_requests_y, resumption_requests_y, notice_step_usd]
        ladder:
          - when: "the client had at or above the planogram floor of planogram changes approved over the twelve months to the day the settlement is raised and no resumption request stands approved over those twelve months"
            value: "the call-out charge printed against the market format"
          - when: "the client had at or above the planogram floor of planogram changes approved over those twelve months and a resumption request stands approved over them"
            value: "half the call-out charge printed against the market format"
          - when: "otherwise"
            value: "nothing for planogram work"
        baseline:
          notice_step_usd: "0.0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The settlement raised for a period a market stood shut is the standing charge for each month
        of the closure, together with the management fee printed against the market format for those
        same months at the fee share, and the held-over planogram step. The three amounts are each
        rounded to the nearest cent, a figure falling exactly on the half-cent going to the nearest even cent as they are taken and are then added, and the sum is rounded the same way; none of them acts on any of the others. No product
        settlement is raised for a period the market stood shut, since nothing was rung at the kiosk.
        The closure is charged as a single month. The standing charge for a month is the standby
        charge printed against the market format. The fee share is the standing fee share. No
        planogram step is added.
      params: [standing_fee_share_pct, suspension_standby_fee_usd, management_fee_monthly_usd]
    inputs:
      history:
        - {table: market_service_intake, aggregate: count, within_months: 12, filters: {request_type: suspension_request, request_status: approved}}
        - {table: market_ledger, aggregate: count, within_months: 12, filters: {event_type: market_settlement_payment_posted}}
        - {category: cafe, table: cafe_ledger, aggregate: sum, field: amount_usd, within_months: 12, filters: {event_type: cafe_subsidy_drawdown_posted}}
      cross_category: [cafe]
  - id: market_ext_lapsed_lot_settlement_credit
    base_policy_refs: [market_service_credit_terms, market_subsidy_funding_terms]
    overwrite:
      - base_policy: market_service_credit_terms
        superseded_clause: >-
          Where the kiosk could not take a payment, or the market stood empty because a scheduled restock was missed, the client is credited against the settlement invoice for that period.
        replaced_by: >-
          Where a subsidy funding lot has run past the months it stays drawable, the balance left
          unspent in it is credited back to the client against the settlement invoice for the
          period.
    trigger: state_due
    subject: [market_service_credit_issued]
    computes: lapsed_lot_credit_usd
    target_tool: issue_lapsed_funding_credit_131d77d2
    params:
      material_drawn_usd: 5000
      repeat_funding_count: 2
      prompt_settlement_count: 3
      full_credit_share_pct: 100
      retained_credit_share_pct: 85
      standing_credit_share_pct: 95
      material_outage_count: 4
      repeat_resumption_count: 1
      planogram_floor: 2
      high_lapse_share_pct: 6
      low_lapse_share_pct: 3
      multi_charge_count: 2
      mid_month_cycle_day: 10
    rule: >
      Where a subsidy funding lot has run past the months it stays drawable, the balance left
      unspent in it is credited back to the client against the settlement invoice for the period.
      A lot stays drawable for the months printed against the market format, counted from the day
      the funding cleared, so the lapsed funding is what was paid in before that many months back
      from the day the credit is worked out. The unspent balance is the lapsed funding less the
      drawdowns set against it, never below nothing; the credit is that balance at the credit share,
      together with the closure relief and the lapse share of the settlement read over the
      settlement-reading window; and the whole is held to the ceiling on credits in one settlement
      period printed against the market format, measured against that same settlement. Each figure
      is rounded to the nearest cent, a figure falling exactly on the half-cent going to the nearest even cent as it is taken and the result is rounded the same way.
      The credit is recorded against no kiosk, since it hands back funding rather than answering
      kiosk time. The credit handed back for a lapsed funding lot is fixed only after the monthly
      settlement charge for the period the market stood shut stands on the agreement.
      Everything drawn against the agreement is set against the lapsed funding. Where at or above the material drawn amount has been drawn against the agreement and some of
      what was drawn falls outside the months a lot stays drawable, only what was drawn before those
      months is set against the lapsed funding, the lots being drawn oldest first. Where at or above the material drawn amount has been drawn against the agreement and none of
      what was drawn falls outside those months, half of everything drawn is set against the lapsed
      funding.
      The settlement-reading window is the month to the day the credit is worked out. Where the
      agreement carries at or above the multi-charge count of settlement charges over the two months
      to that day and the market format is invoiced on or after the mid-month cycle day, the
      settlement is read over those two months. Where the agreement carries at or above the
      multi-charge count of settlement charges over those two months and the market format is
      invoiced before the mid-month cycle day, the settlement is read over the four months to that
      day.
      The credit share is the standing credit share. Where the client has funded at or above the
      repeat funding count of subsidy lots on the agreement and settled at or above the prompt
      settlement count of market settlement invoices over the twelve months to the day the credit is
      worked out, the full credit share is handed back. Where the client has funded at or above the
      repeat funding count of subsidy lots on the agreement and settled below the prompt settlement
      count of market settlement invoices over those twelve months, the retained credit share is
      handed back.
      No closure relief is credited. Where the agreement carries an approved suspension request over
      the twelve months to the day the credit is worked out and at or above the material outage count
      of approved kiosk outage requests over those twelve months, the call-out charge printed against
      the market format is credited twice over as closure relief. Where the agreement carries an
      approved suspension request over those twelve months and below the material outage count of
      approved kiosk outage requests over them, the call-out charge printed against the market format
      is credited once.
      No share of the settlement is credited for the lapse. Where the agreement carries at or above
      the repeat resumption count of approved resumption requests over the twelve months to the day
      the credit is worked out and at or above the planogram floor of approved planogram changes over
      those twelve months, the high lapse share of the settlement is credited as well. Where the
      agreement carries at or above the repeat resumption count of approved resumption requests over
      those twelve months and below the planogram floor of approved planogram changes over them, the
      low lapse share of the settlement is credited.
    prerequisite:
      - problem: market_ext_standby_period_settlement
        kind: value_input
        gate: settlement_base
        form: state
        policy_source: >-
          The credit handed back for a lapsed funding lot is fixed only after the monthly settlement
          charge for the period the market stood shut stands on the agreement.
        condition: >-
          the market ledger carries a monthly settlement charge raised for the period the market
          stood shut on the agreement
        resolved_by: post_market_standby_settlement_ab27821d
        effect: >-
          the settlement read over the settlement-reading window rises by the standing charge for the
          closure, so the settlement_base binding, and with it the lapse share and the period
          ceiling, take a larger value
    cross_category: []
    compute:
      - funding_all: "SUM('market_ledger','amount_usd', event_type='market_subsidy_funding_posted')"
      - funding_6m: "SUM('market_ledger','amount_usd', within_months=6, date_field='posted_date', event_type='market_subsidy_funding_posted')"
      - funding_9m: "SUM('market_ledger','amount_usd', within_months=9, date_field='posted_date', event_type='market_subsidy_funding_posted')"
      - funding_12m: "SUM('market_ledger','amount_usd', within_months=12, date_field='posted_date', event_type='market_subsidy_funding_posted')"
      - lot_expiry: "P('subsidy_funding_lot_expiry_months')"
      - funding_live: "funding_6m if lot_expiry <= 6 else (funding_9m if lot_expiry <= 9 else funding_12m)"
      - lapsed_funding: "MX(RND(funding_all - funding_live, 2), 0.0)"
      - drawdowns_all: "SUM('market_ledger','amount_usd', event_type='market_subsidy_drawdown_posted')"
      - drawdowns_6m: "SUM('market_ledger','amount_usd', within_months=6, date_field='posted_date', event_type='market_subsidy_drawdown_posted')"
      - drawdowns_9m: "SUM('market_ledger','amount_usd', within_months=9, date_field='posted_date', event_type='market_subsidy_drawdown_posted')"
      - drawdowns_12m: "SUM('market_ledger','amount_usd', within_months=12, date_field='posted_date', event_type='market_subsidy_drawdown_posted')"
      - drawdowns_live: "drawdowns_6m if lot_expiry <= 6 else (drawdowns_9m if lot_expiry <= 9 else drawdowns_12m)"
      - drawn_against_lapsed: "MX(RND(drawdowns_all - drawdowns_live, 2), 0.0) if (drawdowns_all >= K('material_drawn_usd') and drawdowns_all > drawdowns_live) else (RND(drawdowns_all / 2, 2) if (drawdowns_all >= K('material_drawn_usd') and drawdowns_all <= drawdowns_live) else drawdowns_all)"
      - unspent_balance: "MX(RND(lapsed_funding - drawn_against_lapsed, 2), 0.0)"
      - funding_lot_count: "COUNT('market_ledger', event_type='market_subsidy_funding_posted')"
      - settlement_payments_y: "COUNT('market_ledger', within_months=12, date_field='posted_date', event_type='market_settlement_payment_posted')"
      - credit_share_pct: "K('full_credit_share_pct') if (funding_lot_count >= K('repeat_funding_count') and settlement_payments_y >= K('prompt_settlement_count')) else (K('retained_credit_share_pct') if (funding_lot_count >= K('repeat_funding_count') and settlement_payments_y < K('prompt_settlement_count')) else K('standing_credit_share_pct'))"
      - suspension_requests_y: "COUNT('market_service_intake', within_months=12, date_field='requested_effective_date', request_type='suspension_request', request_status='approved')"
      - outage_claims_y: "COUNT('market_service_intake', within_months=12, date_field='requested_effective_date', request_type='service_credit_claim', request_status='approved')"
      - closure_relief_usd: "RND(P('restocking_call_out_fee_usd') * 2, 2) if (suspension_requests_y >= 1 and outage_claims_y >= K('material_outage_count')) else (P('restocking_call_out_fee_usd') if (suspension_requests_y >= 1 and outage_claims_y < K('material_outage_count')) else 0.0)"
      - resumption_requests_y: "COUNT('market_service_intake', within_months=12, date_field='requested_effective_date', request_type='resumption_request', request_status='approved')"
      - planogram_requests_y: "COUNT('market_service_intake', within_months=12, date_field='requested_effective_date', request_type='planogram_change_request', request_status='approved')"
      - lapse_settlement_pct: "K('high_lapse_share_pct') if (resumption_requests_y >= K('repeat_resumption_count') and planogram_requests_y >= K('planogram_floor')) else (K('low_lapse_share_pct') if (resumption_requests_y >= K('repeat_resumption_count') and planogram_requests_y < K('planogram_floor')) else 0.0)"
      - settlement_1m: "SUM('market_ledger','amount_usd', within_months=1, date_field='posted_date', event_type='market_monthly_settlement_invoiced')"
      - settlement_2m: "SUM('market_ledger','amount_usd', within_months=2, date_field='posted_date', event_type='market_monthly_settlement_invoiced')"
      - settlement_4m: "SUM('market_ledger','amount_usd', within_months=4, date_field='posted_date', event_type='market_monthly_settlement_invoiced')"
      - settlement_charge_count_2m: "COUNT('market_ledger', within_months=2, date_field='posted_date', event_type='market_monthly_settlement_invoiced')"
      - cycle_day: "P('invoice_cycle_day')"
      - settlement_base: "settlement_2m if (settlement_charge_count_2m >= K('multi_charge_count') and cycle_day >= K('mid_month_cycle_day')) else (settlement_4m if (settlement_charge_count_2m >= K('multi_charge_count') and cycle_day < K('mid_month_cycle_day')) else settlement_1m)"
      - base_credit: "RND(unspent_balance * credit_share_pct / 100, 2)"
      - settlement_step_usd: "RND(settlement_base * lapse_settlement_pct / 100, 2)"
      - gross_credit: "RND(base_credit + closure_relief_usd + settlement_step_usd, 2)"
      - period_ceiling: "RND(settlement_base * P('outage_credit_cap_pct_of_settlement') / 100, 2)"
      - result: "RND(MN(gross_credit, period_ceiling), 2)"
    compute_basis:
      funding_all: "A lot stays drawable for the months printed against the market format, counted from the day the funding cleared, so the lapsed funding is what was paid in before that many months back from the day the credit is worked out."
      funding_6m: "A lot stays drawable for the months printed against the market format, counted from the day the funding cleared, so the lapsed funding is what was paid in before that many months back from the day the credit is worked out."
