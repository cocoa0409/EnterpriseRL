    baseline:
      rule: >-
        The product settlement invoiced on a subsidy true-up basis is the client discount met at the
        kiosk over the reading window, taken at the true-up share, together with the card processing
        charge on the shelf value of those trips, the call-out charge for unscheduled planogram work,
        and the fresh handling charge. The four amounts are each rounded to the nearest cent, a figure falling exactly on the half-cent going to the nearest even cent
        as they are taken and are then added, and the sum is rounded the same way;
        none of them acts on any of the others. The shelf value of the trips in the reading window is
        the discount met over that window grossed back at the share of shelf price printed against the
        market format, and the card processing charge acts on that shelf value rather than on the
        discount. Where the market format's subsidy model meets no share of shelf price, no shelf
        value is recovered and no card processing charge is passed through. No shortfall charge is
        invoiced on a subsidy true-up basis, the true-up itself already carrying what the period's
        trading yielded. The reading window is the three months to the day the settlement is raised. The
        true-up share is the standard true-up share. The card processing charge is passed through at
        the rate printed against the market format. No call-out charge is added for planogram work.
        No fresh handling charge is made.
      params: [window_months, standard_true_up_share_pct, subsidy_pct_of_shelf_price, card_processing_fee_pct]
    inputs:
      history:
        - {table: market_ledger, aggregate: sum, field: amount_usd, within_months: 3, filters: {event_type: market_subsidy_drawdown_posted}}
        - {table: market_ledger, aggregate: count, within_months: 12, filters: {event_type: market_settlement_payment_posted}}
        - {table: market_service_intake, aggregate: count, within_months: 3, filters: {request_type: planogram_change_request, request_status: approved}}
      cross_category: []
  - id: market_ext_outage_service_credit
    base_policy_refs: [market_service_credit_terms]
    overwrite:
      - base_policy: market_service_credit_terms
        superseded_clause: >-
          Each hour of kiosk outage inside opening hours earns the percentage of the settlement printed against the market format
        replaced_by: >-
          Each chargeable hour earns the credit rate, applied to the settlement charged on the
          agreement over the two months to the day the credit is worked out.
    trigger: state_due
    subject: [market_service_credit_issued]
    computes: credit_amount_usd
    target_tool: issue_market_outage_credit_49294a76
    params:
      high_uptime_guarantee_pct: 97.5
      busy_outage_count: 5
      material_outage_hours: 8
      settled_market_months: 24
      repeat_outage_count: 3
      young_market_weight: 1.5
      settled_market_weight: 0.75
      empty_market_count: 2
      frequent_restock_visits: 3
      frequent_empty_step_pct: 2.0
      sparse_empty_step_pct: 4.0
      shared_cause_share_pct: 75
      client_cause_share_pct: 50
      full_allowance_share_pct: 100
    rule: >
      Where a client claims for the hours its kiosk could not take a payment, the credit allowed is
      the chargeable hours at the credit rate, applied to the settlement charged on the agreement
      over the two months to the day the credit is worked out, together with the empty-market step
      on that same settlement, the two figures being added before the allowed share is taken of
      them, and the whole held to the ceiling on credits in one settlement period printed against
      the market format. Each chargeable hour earns the credit rate, applied to the settlement
      charged on the agreement over the two months to the day the credit is worked out. Each
      figure is rounded to the nearest cent, a figure falling exactly on the half-cent going to the nearest even cent as it is taken and the result is rounded
      the same way. The credit is recorded against the kiosk whose lost hours it answers. The
      credit allowed for a settlement period is
      fixed only after the product settlement for that period stands charged on the agreement.
      The hours are read from the kiosk outage requests approved on the agreement, each approved
      request standing for one hour the kiosk could not take a payment, and they are read over the
      three months to the day the credit is worked out. Where the market format guarantees kiosk
      availability at or above the high uptime guarantee and the agreement carries at or above the
      busy outage count of approved kiosk outage requests over those three months, the hours are
      read over the six months to that day. Where the market format guarantees kiosk availability
      below the high uptime guarantee and the agreement carries at or above the busy outage count of
      approved kiosk outage requests over those three months, the hours are read over the twelve
      months to that day.
      The chargeable hours are the hours so read, halved and rounded down to a whole hour. Where the
      hours so read are at or above the material outage hours and no kiosk outage request on the
      agreement was declined over the six months to the day the credit is worked out, the hours are
      charged as booked. Where the hours so read are at or above the material outage hours and at
      least one kiosk outage request on the agreement was declined over those six months, the hours
      are charged as booked less one hour for each declined request, and never below nothing.
      The credit rate is the percentage of the settlement printed against the market format. Where
      the market has been open for less than the settled-market age and the agreement carries at or
      above the repeat outage count of approved kiosk outage requests over the three months to the
      day the credit is worked out, the printed percentage is taken at the young-market weight.
      Where the market has been open at or beyond the settled-market age and the agreement carries at
      or above the repeat outage count of approved kiosk outage requests over those three months, the
      printed percentage is taken at the settled-market weight.
      No empty-market step is credited. Where the agreement carries at or above the empty-market
      count of approved resumption requests over the twelve months to the day the credit is worked
      out and the market format is restocked at or above the frequent restock visit count each week,
      the frequent empty step of the settlement is credited as well. Where the agreement carries at
      or above the empty-market count of approved resumption requests over those twelve months and
      the market format is restocked below the frequent restock visit count each week, the sparse
      empty step of the settlement is credited as well.
      The allowed share is the full allowance share. Where the agreement carries an approved
      suspension request over the three months to the day the credit is worked out and at or above
      the material outage hours of approved kiosk outage requests over the six months to that day,
      the shared-cause share is allowed, the rest being time the client had the market closed off.
      Where the agreement carries an approved suspension request over those three months and below
      the material outage hours of approved kiosk outage requests over those six months, the
      client-cause share is allowed.
    prerequisite:
      - problem: market_ext_period_settlement_true_up
        kind: value_input
        gate: settlement_base
        form: state
        policy_source: >-
          The credit allowed for a settlement period is fixed only after the product settlement for
          that period stands charged on the agreement.
        condition: >-
          the market ledger carries the product settlement charge for that settlement period on the
          agreement
        resolved_by: post_market_settlement_true_up_13e3670a
        effect: >-
          the settlement the credit is measured against rises by the product settlement charge, so
          the settlement_base binding, and with it the credit and its ceiling, take a larger value
    cross_category: []
    compute:
      - settlement_base: "SUM('market_ledger','amount_usd', within_months=2, date_field='posted_date', event_type='market_monthly_settlement_invoiced')"
      - approved_hours_q: "COUNT('market_service_intake', within_months=3, date_field='requested_effective_date', request_type='service_credit_claim', request_status='approved')"
      - approved_hours_h1: "COUNT('market_service_intake', within_months=6, date_field='requested_effective_date', request_type='service_credit_claim', request_status='approved')"
      - approved_hours_y: "COUNT('market_service_intake', within_months=12, date_field='requested_effective_date', request_type='service_credit_claim', request_status='approved')"
      - uptime_guarantee: "P('kiosk_uptime_guarantee_pct')"
      - approved_hours: "approved_hours_h1 if (uptime_guarantee >= K('high_uptime_guarantee_pct') and approved_hours_q >= K('busy_outage_count')) else (approved_hours_y if (uptime_guarantee < K('high_uptime_guarantee_pct') and approved_hours_q >= K('busy_outage_count')) else approved_hours_q)"
      - declined_claims_h1: "COUNT('market_service_intake', within_months=6, date_field='requested_effective_date', request_type='service_credit_claim', request_status='declined')"
      - chargeable_hours: "approved_hours if (approved_hours >= K('material_outage_hours') and declined_claims_h1 == 0) else (MX(approved_hours - declined_claims_h1, 0) if (approved_hours >= K('material_outage_hours') and declined_claims_h1 >= 1) else int(approved_hours / 2))"
      - market_age_months: "MONTHS(F('installation_completed_date'), NOW)"
      - outage_events_q: "COUNT('market_service_intake', within_months=3, date_field='requested_effective_date', request_type='service_credit_claim', request_status='approved')"
      - credit_pct_per_hour: "RND(P('outage_credit_pct_per_hour') * K('young_market_weight'), 2) if (market_age_months < K('settled_market_months') and outage_events_q >= K('repeat_outage_count')) else (RND(P('outage_credit_pct_per_hour') * K('settled_market_weight'), 2) if (market_age_months >= K('settled_market_months') and outage_events_q >= K('repeat_outage_count')) else P('outage_credit_pct_per_hour'))"
      - resumption_requests_y: "COUNT('market_service_intake', within_months=12, date_field='requested_effective_date', request_type='resumption_request', request_status='approved')"
      - restock_visits: "P('restock_visits_per_week')"
      - empty_market_step_pct: "K('frequent_empty_step_pct') if (resumption_requests_y >= K('empty_market_count') and restock_visits >= K('frequent_restock_visits')) else (K('sparse_empty_step_pct') if (resumption_requests_y >= K('empty_market_count') and restock_visits < K('frequent_restock_visits')) else 0.0)"
      - suspension_requests_q: "COUNT('market_service_intake', within_months=3, date_field='requested_effective_date', request_type='suspension_request', request_status='approved')"
      - outage_claims_h1: "COUNT('market_service_intake', within_months=6, date_field='requested_effective_date', request_type='service_credit_claim', request_status='approved')"
      - allowed_share_pct: "K('shared_cause_share_pct') if (suspension_requests_q >= 1 and outage_claims_h1 >= K('material_outage_hours')) else (K('client_cause_share_pct') if (suspension_requests_q >= 1 and outage_claims_h1 < K('material_outage_hours')) else K('full_allowance_share_pct'))"
      - raw_credit: "RND(settlement_base * credit_pct_per_hour * chargeable_hours / 100, 2)"
      - empty_credit: "RND(settlement_base * empty_market_step_pct / 100, 2)"
      - allowed_credit: "RND((raw_credit + empty_credit) * allowed_share_pct / 100, 2)"
      - period_ceiling: "RND(settlement_base * P('outage_credit_cap_pct_of_settlement') / 100, 2)"
      - result: "RND(MN(allowed_credit, period_ceiling), 2)"
