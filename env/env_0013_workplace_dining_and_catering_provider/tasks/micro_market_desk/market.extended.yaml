    factors:
      - id: charge_reading_window
        effect: method
        decides: charges_side
        bindings: [charges_1m, charges_2m, charges_4m, charge_count_2m, cycle_day, charges_side]
        ladder:
          - when: "the agreement carries at or above the multi-charge count of settlement charges over the two months to the day the payment is taken and the market format is invoiced on or after the mid-month cycle day"
            method: "the charges are read over the two months to that day"
          - when: "the agreement carries at or above the multi-charge count of settlement charges over those two months and the market format is invoiced before the mid-month cycle day"
            method: "the charges are read over the four months to that day"
          - when: "otherwise"
