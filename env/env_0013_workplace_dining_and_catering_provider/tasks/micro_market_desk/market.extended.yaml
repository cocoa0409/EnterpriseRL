        ladder:
          - when: "the fresh cabinet was shopped at or above the fresh-trip floor of times over the six months to the day the settlement is raised and the coolers were shopped at least once over those six months"
            method: "the call-out charge printed against the market format is apportioned by the share the fresh cabinet trips take of the fresh and chilled trips together"
          - when: "the fresh cabinet was shopped below the fresh-trip floor of times over those six months and the coolers were shopped at least once over those six months"
            method: "the flat fresh share of the call-out charge printed against the market format is taken"
          - when: "otherwise"
            method: "no fresh handling charge is made"
