            method: "the whole of the most recent shrink adjustment posted on the agreement is withheld"
          - when: "a shrink dispute on the agreement stands in review over those six months and the agreement carries no shrink dispute approved over those six months"
            method: "half of the most recent shrink adjustment posted on the agreement is withheld"
