events:
  - type: market_agreement_opened
    target: market_agreements
    mutation: create
    meaning: a micro market agreement is drawn up for a client site and sits as a proposal awaiting signature
    grain: one row per micro market agreement at one client site
    fields:
      customer_id: the client organisation that will hold the agreement
      variant_name: the market format proposed
      status: the agreement opens in the proposed state
      site_code: the workplace site the market will stand at
      agreement_start_date: first day of the proposed term
      agreement_end_date: last day of the proposed term
      kiosk_reference: the kiosk allocated to the market
      headcount_served: badged employee headcount the site reports
      billing_contact_email: where settlement invoices will be sent
      purchase_order_reference: the client's purchase order reference, when they use one
      subsidy_pool_balance_usd: opening subsidy funding, zero until the client funds a lot
      receivable_balance_usd: opening unsettled balance, zero on a new agreement
    triggers: []
  - type: market_installation_scheduled
    target: market_agreements
    mutation: {transition: {from: proposed, to: installing}}
    meaning: the client signs and the fixtures, coolers and kiosk are scheduled into the site
    grain: one row per agreement, on the day installation is scheduled
    fields:
      status: the agreement moves into installing
    triggers:
      - event: market:market_monthly_settlement_invoiced
        map: {charge_code: equipment_fee}
  - type: market_service_commenced
    target: market_agreements
    mutation: {transition: {from: installing, to: active}}
    meaning: the market is stocked, the kiosk goes live and employees may shop
    grain: one row per agreement, on its opening day
    fields:
      status: the agreement moves into active
      installation_completed_date: the day the market opened
    triggers: []
  - type: market_service_suspended
    target: market_agreements
    mutation: {transition: {from: active, to: suspended}}
    meaning: the market is closed off at the client's instruction while the agreement stands
    grain: one row per agreement, on the first day of a closure
    fields:
      status: the agreement moves into suspended
      suspension_start_date: first day of the closure
    triggers: []
  - type: market_service_resumed
    target: market_agreements
    mutation: {transition: {from: suspended, to: active}}
    meaning: the market is restocked and reopens to employees
    grain: one row per agreement, on the day the market reopens
    fields:
      status: the agreement moves back into active
      suspension_start_date: cleared once the market reopens
    triggers: []
  - type: market_agreement_closed
    target: market_agreements
    mutation: {transition: [{from: active, to: closed}, {from: suspended, to: closed}, {from: installing, to: closed}, {from: proposed, to: closed}]}
    meaning: the micro market agreement ends and the fixtures come out of the site
    grain: one row per agreement, on the day it closes
    fields:
      status: the agreement moves into closed
      closed_date: the day the agreement closed
    triggers: []
  - type: market_monthly_settlement_invoiced
    target: market_ledger
    meaning: the monthly market settlement is invoiced to the client, together with equipment and one-off charges
    grain: one row per settled charge, for one settlement period, on one invoice
    distinguish_by: [charge_code, service_period, invoice_reference]
    fields:
      market_agreement_id: the agreement invoiced
      customer_id: the client invoiced
      event_type: the event family of this row
      charge_code: which settled charge this is
      amount_usd: the amount invoiced
      posted_date: the day the invoice was raised
      service_period: the settlement period the charge covers
      invoice_reference: the settlement invoice this charge sits on
      kiosk_reference: the kiosk the charge relates to
      payment_channel: not_applicable while nothing has been tendered
      product_category: other on a charge that is not product specific
    account: market_receivable
    direction: in
    triggers: []
  - type: market_subsidy_funding_posted
    target: market_ledger
    meaning: the client pays a lot of subsidy funding into the market agreement
    grain: one row per funding lot paid in
    distinguish_by: [posted_date, amount_usd, payment_channel]
    fields:
      market_agreement_id: the agreement funded
      customer_id: the client funding it
      event_type: the event family of this row
      charge_code: subsidy_funding on every row of this family
      amount_usd: the amount funded
      posted_date: the day the funding cleared
      service_period: the period the lot is opened against
      payment_channel: how the client paid the lot in
      kiosk_reference: the kiosk the lot funds
    account: market_subsidy
    direction: in
    triggers: []
  - type: market_subsidy_drawdown_posted
    target: market_ledger
    meaning: an employee purchase at the kiosk is discounted out of the client's subsidy funding
    grain: one row per kiosk purchase that draws subsidy
    distinguish_by: [source_reference, posted_date, product_category]
    fields:
      market_agreement_id: the agreement whose funding is drawn
      customer_id: the client whose funding is drawn
      event_type: the event family of this row
      charge_code: subsidy_drawdown on every row of this family
      amount_usd: the subsidy applied to the purchase
      posted_date: the day the purchase was rung
      service_period: the settlement period the drawdown falls in
      source_reference: the employee till transaction that drew the subsidy
      product_category: the product group bought
      kiosk_reference: the kiosk the purchase was rung at
    account: market_subsidy
    direction: out
    triggers: []
  - type: market_settlement_payment_posted
    target: market_ledger
    meaning: the client settles all or part of a market settlement invoice
    grain: one row per payment received against one settlement invoice
    distinguish_by: [invoice_reference, posted_date, payment_channel]
    fields:
      market_agreement_id: the agreement paid against
      customer_id: the client paying
      event_type: the event family of this row
      charge_code: settlement_payment on every row of this family
      amount_usd: the amount received
      posted_date: the day the payment cleared
      service_period: the period of the invoice being settled
      invoice_reference: the settlement invoice settled
      payment_channel: how the client paid
    account: market_receivable
    direction: out
    triggers: []
  - type: market_shrink_adjustment_posted
    target: market_ledger
    meaning: unexplained inventory loss above the allowance is charged to the client after a count
    grain: one row per inventory count, for one settlement period, on one product group
    distinguish_by: [service_period, product_category, source_reference]
    fields:
      market_agreement_id: the agreement charged
      customer_id: the client charged
      event_type: the event family of this row
      charge_code: shrink_adjustment on every row of this family
      amount_usd: the loss charged above the allowance
      posted_date: the day the adjustment was raised
      service_period: the settlement period the count covers
      source_reference: the inventory count the adjustment rests on
      product_category: the product group the loss fell in
      invoice_reference: the settlement invoice the adjustment sits on
      kiosk_reference: the kiosk counted
    account: market_receivable
    direction: in
    triggers: []
  - type: market_service_credit_issued
    target: market_ledger
    meaning: a credit is allowed because the kiosk was out of service or the market stood empty
    grain: one row per credit allowed, for one settlement period, against one invoice
    distinguish_by: [invoice_reference, service_period, charge_code]
    fields:
      market_agreement_id: the agreement credited
      customer_id: the client credited
      event_type: the event family of this row
      charge_code: service_credit on every row of this family
      amount_usd: the credit allowed
      posted_date: the day the credit was allowed
      service_period: the settlement period the credit relates to
      invoice_reference: the settlement invoice credited
      source_reference: the service request the credit answers
      kiosk_reference: the kiosk that was out of service
    account: market_receivable
    direction: out
    triggers: []

measures:
  - id: market_msr_active_market_count
    window: point in time on the day the settlement invoice is raised, across the client's whole micro market portfolio
    measure: count of micro market agreements held by the same client whose status is active or suspended
  - id: market_msr_shrink_rate
    window: the settlement period the inventory count covers
    measure: unexplained inventory loss at retail value over that period divided by sales over the same period, expressed as a percentage
  - id: market_msr_kiosk_outage_hours
    window: the settlement period named on the invoice the claim concerns
    measure: count of opening hours in that period during which the kiosk could not take a payment, as recorded on approved market service requests

policies:
  - id: market_agg_multi_holding
    subject: [market_agreement_opened]
    rule: >
      A client may hold as many micro market agreements as it has sites, and there is no ceiling on the number held at once.
      Each agreement is written against exactly one site and one kiosk reference, and sales, subsidy funding, shrink and settlement belong to that site's agreement alone.
      A further micro market agreement is not opened for a site that already carries an open micro market agreement.
      A site's agreement counts as open while it is proposed, installing, active or suspended, and counts as gone once it is closed, so a site whose earlier market has been removed may take a fresh agreement.
      Where the client wants a second market on another floor of a site already under agreement, that market is added to the existing agreement as a second kiosk rather than opened as a second agreement.
    eligibility:
      - id: one_open_market_per_site
        applies_to: [market_agreement_opened]
        kind: dedup
        condition: A further micro market agreement is not opened for a site that already carries an open micro market agreement.
        evidence_fields: [market_agreements.site_code, market_agreements.customer_id, market_agreements.status, market_agreements.market_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [market_agreements.customer_id, market_agreements.site_code]
          action_bindings:
            market_agreements.customer_id: customer_id
            market_agreements.site_code: site_code
        dedup_contract:
          table: market_agreements
          mode: separate_record
          object_bindings: {customer_id: customer_id, site_code: site_code}
          duplicate_filters: {status: [proposed, installing, active, suspended]}
          distinct_fields: [agreement_start_date, kiosk_reference, variant_name]
    params: {max_per_customer: null, max_open_agreements_per_site: 1}
  - id: market_agg_portfolio_settlement_band
    subject: [market_monthly_settlement_invoiced]
    rule: >
      The settlement a client pays on each micro market is discounted by a portfolio band that reads the client's whole market estate rather than the single site being invoiced.
      The band is found by counting the client's micro market agreements that stand active or suspended on the day the settlement invoice is raised, then taking the highest ladder step whose agreement count does not exceed that number; the ladder is the one printed against the market format of the agreement being invoiced.
      The discount is applied to the management fee and the equipment lease only; product cost, subsidy true-up, shrink adjustments and one-off charges carry no portfolio discount.
      Agreements still proposed or installing and agreements already closed are outside the count.
      Where the estate changes part way through a settlement period, the count taken on the invoice day governs the whole of that invoice, and invoices already raised are not reopened.
    eligibility: []
    params:
      per_tier:
        "Cooler & Snack Wall": {ladder: "=portfolio_fee_discount_ladder", lease_usd: "=equipment_lease_monthly_usd", management_fee_usd: "=management_fee_monthly_usd"}
        "Compact Micro Market": {ladder: "=portfolio_fee_discount_ladder", lease_usd: "=equipment_lease_monthly_usd", management_fee_usd: "=management_fee_monthly_usd"}
        "Standard Micro Market": {ladder: "=portfolio_fee_discount_ladder", lease_usd: "=equipment_lease_monthly_usd", management_fee_usd: "=management_fee_monthly_usd"}
        "Fresh Food Micro Market": {ladder: "=portfolio_fee_discount_ladder", lease_usd: "=equipment_lease_monthly_usd", management_fee_usd: "=management_fee_monthly_usd"}
        "Expanded Campus Micro Market": {ladder: "=portfolio_fee_discount_ladder", lease_usd: "=equipment_lease_monthly_usd", management_fee_usd: "=management_fee_monthly_usd"}
        "Smart Store Micro Market": {ladder: "=portfolio_fee_discount_ladder", lease_usd: "=equipment_lease_monthly_usd", management_fee_usd: "=management_fee_monthly_usd"}
    measures: [market_msr_active_market_count]
  - id: market_installation_terms
    subject: [market_agreement_opened, market_installation_scheduled, market_service_commenced]
    rule: >
      A micro market agreement is drawn up as a proposal, moves into installation on signature, and opens to employees once fixtures, coolers, kiosk and first stocking are in place.
      The installation charge and the equipment lease are those printed against the market format proposed, and the installation charge is invoiced when installation is scheduled rather than at opening.
      The market may not open earlier than the installation lead time for the market format, counted in calendar days from the day the client signs the micro market agreement.
      Calendar days are counted from the day after signature, every day of the week counts, and the boundary day itself is a permitted opening day; calendar days are never converted into full 24-hour periods.
      An agreement is only worked on for installation while it stands proposed, installing or active, and a proposal withdrawn before signature closes with no installation charge falling due.
      Where the site's reported headcount or expected monthly sales do not meet the entry gate of the format proposed, the agreement is written for the highest format whose entry gate the site does meet.
      An installation abandoned after fixtures are ordered closes the agreement and carries the equipment removal charge printed against the format, and nothing more.
    eligibility:
      - id: installation_state
        applies_to: [market_agreement_opened, market_installation_scheduled, market_service_commenced]
        kind: state
        condition: An agreement is only worked on for installation while it stands proposed, installing or active, and a proposal withdrawn before signature closes with no installation charge falling due.
        evidence_fields: [market_agreements.status, market_agreements.market_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [market_agreements.market_agreement_id]
          action_bindings:
            market_agreements.market_agreement_id: market_agreement_id
        state_contract:
          field: market_agreements.status
          allowed: [proposed, installing, active]
      - id: installation_lead_time
        applies_to: [market_service_commenced]
        kind: time
        condition: The market may not open earlier than the installation lead time for the market format, counted in calendar days from the day the client signs the micro market agreement.
        evidence_fields: [market_agreements.agreement_start_date, market_agreements.status, market_agreements.market_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [market_agreements.market_agreement_id]
          action_bindings:
            market_agreements.market_agreement_id: market_agreement_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the day the client signs the micro market agreement
          anchor_source: market_agreements.agreement_start_date
          relation: not_before
          duration_source: variants.install_lead_days
          unit: calendar_days
          counting_rule: Calendar days are counted from the day after signature, every day of the week counts, and the boundary day itself is a permitted opening day; calendar days are never converted into full 24-hour periods.
          boundary: inclusive
    params:
      per_tier:
        "Cooler & Snack Wall": {install_fee_usd: "=install_fee_usd", lease_usd: "=equipment_lease_monthly_usd", lead_days: "=install_lead_days", removal_fee_usd: "=equipment_removal_fee_usd"}
        "Compact Micro Market": {install_fee_usd: "=install_fee_usd", lease_usd: "=equipment_lease_monthly_usd", lead_days: "=install_lead_days", removal_fee_usd: "=equipment_removal_fee_usd"}
        "Standard Micro Market": {install_fee_usd: "=install_fee_usd", lease_usd: "=equipment_lease_monthly_usd", lead_days: "=install_lead_days", removal_fee_usd: "=equipment_removal_fee_usd"}
        "Fresh Food Micro Market": {install_fee_usd: "=install_fee_usd", lease_usd: "=equipment_lease_monthly_usd", lead_days: "=install_lead_days", removal_fee_usd: "=equipment_removal_fee_usd"}
        "Expanded Campus Micro Market": {install_fee_usd: "=install_fee_usd", lease_usd: "=equipment_lease_monthly_usd", lead_days: "=install_lead_days", removal_fee_usd: "=equipment_removal_fee_usd"}
        "Smart Store Micro Market": {install_fee_usd: "=install_fee_usd", lease_usd: "=equipment_lease_monthly_usd", lead_days: "=install_lead_days", removal_fee_usd: "=equipment_removal_fee_usd"}
  - id: market_settlement_terms
    subject: [market_monthly_settlement_invoiced]
    rule: >
      Each settlement period the agreement is invoiced on the basis printed against its market format: a commission basis pays the client a share of sales and invoices only the equipment lease and one-off charges; a subsidy true-up basis invoices the gap between shelf sales and the cost of goods with the subsidy the client has met; and a management fee basis invoices a fixed monthly fee alongside the equipment lease.
      Shelf prices are set from landed product cost at the markup printed against the market format, and the card processing charge printed against the same format is passed through on employee card purchases.
      Where sales for the period fall short of the sales guarantee printed against the market format, the shortfall share printed against that format is invoiced to the client; where sales exceed the guarantee, nothing further is invoiced and no rebate is given.
      A settlement is only invoiced while the agreement stands installing, active or suspended; a suspended market is invoiced the standby charge printed against its format in place of the equipment lease, and no product settlement is raised at all.
      An unscheduled restocking visit asked for by the client carries the call-out charge printed against the market format, and scheduled visits carry nothing.
      A planogram change asked for inside the planogram lead days printed against the format is taken at the next scheduled refresh instead, and the client is told which date that is.
      Where an agreement closes part way through a settlement period, the final settlement covers the days the market was open and the equipment removal charge printed against the format is added to it.
    eligibility:
      - id: settlement_state
        applies_to: [market_monthly_settlement_invoiced]
        kind: state
        condition: A settlement is only invoiced while the agreement stands installing, active or suspended; a suspended market is invoiced the standby charge printed against its format in place of the equipment lease, and no product settlement is raised at all.
        evidence_fields: [market_agreements.status, market_agreements.market_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [market_agreements.market_agreement_id]
          action_bindings:
            market_agreements.market_agreement_id: market_agreement_id
        state_contract:
          field: market_agreements.status
          allowed: [installing, active, suspended]
    params:
      per_tier:
        "Cooler & Snack Wall": {basis: "=management_fee_basis", commission_pct: "=commission_pct_of_sales", management_fee_usd: "=management_fee_monthly_usd", markup_pct: "=product_markup_pct", guarantee_usd: "=monthly_sales_guarantee_usd", shortfall_pct: "=sales_shortfall_subsidy_pct", card_fee_pct: "=card_processing_fee_pct", standby_usd: "=suspension_standby_fee_usd", call_out_usd: "=restocking_call_out_fee_usd", planogram_lead_days: "=planogram_change_lead_days", cycle_day: "=invoice_cycle_day"}
        "Compact Micro Market": {basis: "=management_fee_basis", commission_pct: "=commission_pct_of_sales", management_fee_usd: "=management_fee_monthly_usd", markup_pct: "=product_markup_pct", guarantee_usd: "=monthly_sales_guarantee_usd", shortfall_pct: "=sales_shortfall_subsidy_pct", card_fee_pct: "=card_processing_fee_pct", standby_usd: "=suspension_standby_fee_usd", call_out_usd: "=restocking_call_out_fee_usd", planogram_lead_days: "=planogram_change_lead_days", cycle_day: "=invoice_cycle_day"}
        "Standard Micro Market": {basis: "=management_fee_basis", commission_pct: "=commission_pct_of_sales", management_fee_usd: "=management_fee_monthly_usd", markup_pct: "=product_markup_pct", guarantee_usd: "=monthly_sales_guarantee_usd", shortfall_pct: "=sales_shortfall_subsidy_pct", card_fee_pct: "=card_processing_fee_pct", standby_usd: "=suspension_standby_fee_usd", call_out_usd: "=restocking_call_out_fee_usd", planogram_lead_days: "=planogram_change_lead_days", cycle_day: "=invoice_cycle_day"}
        "Fresh Food Micro Market": {basis: "=management_fee_basis", commission_pct: "=commission_pct_of_sales", management_fee_usd: "=management_fee_monthly_usd", markup_pct: "=product_markup_pct", guarantee_usd: "=monthly_sales_guarantee_usd", shortfall_pct: "=sales_shortfall_subsidy_pct", card_fee_pct: "=card_processing_fee_pct", standby_usd: "=suspension_standby_fee_usd", call_out_usd: "=restocking_call_out_fee_usd", planogram_lead_days: "=planogram_change_lead_days", cycle_day: "=invoice_cycle_day"}
        "Expanded Campus Micro Market": {basis: "=management_fee_basis", commission_pct: "=commission_pct_of_sales", management_fee_usd: "=management_fee_monthly_usd", markup_pct: "=product_markup_pct", guarantee_usd: "=monthly_sales_guarantee_usd", shortfall_pct: "=sales_shortfall_subsidy_pct", card_fee_pct: "=card_processing_fee_pct", standby_usd: "=suspension_standby_fee_usd", call_out_usd: "=restocking_call_out_fee_usd", planogram_lead_days: "=planogram_change_lead_days", cycle_day: "=invoice_cycle_day"}
        "Smart Store Micro Market": {basis: "=management_fee_basis", commission_pct: "=commission_pct_of_sales", management_fee_usd: "=management_fee_monthly_usd", markup_pct: "=product_markup_pct", guarantee_usd: "=monthly_sales_guarantee_usd", shortfall_pct: "=sales_shortfall_subsidy_pct", card_fee_pct: "=card_processing_fee_pct", standby_usd: "=suspension_standby_fee_usd", call_out_usd: "=restocking_call_out_fee_usd", planogram_lead_days: "=planogram_change_lead_days", cycle_day: "=invoice_cycle_day"}
    formula:
      sales_shortfall_usd: max(0, monthly_sales_guarantee_usd - amount_usd)
      shortfall_charge_usd: round(sales_shortfall_usd * sales_shortfall_subsidy_pct / 100, 2)
  - id: market_subsidy_funding_terms
    subject: [market_subsidy_funding_posted]
    rule: >
      Client subsidy for the market is funded in advance in lots, and each lot is recorded against the agreement so that kiosk discounts can be traced back to the money that paid for them.
      A lot may not be smaller than the minimum funding lot printed against the market format, and a client wishing to fund less is asked to combine the amount into the next lot.
      A lot stays drawable for the number of months printed against the market format, counted from the day the funding cleared, and lapses at the end of that period with the unspent balance credited on the next settlement invoice.
      Funding is only accepted onto an agreement that stands installing, active or suspended, since a proposal has no kiosk to spend it at and a closed agreement is being settled out rather than funded.
      A market format whose subsidy model is none takes no funding at all, and a client wishing to discount employee purchases there is moved to a format whose subsidy model permits it.
      Funding paid in for one site's market is never drawn at another site's market, even where the same client holds both.
    eligibility:
      - id: fundable_state
        applies_to: [market_subsidy_funding_posted]
        kind: state
        condition: Funding is only accepted onto an agreement that stands installing, active or suspended, since a proposal has no kiosk to spend it at and a closed agreement is being settled out rather than funded.
        evidence_fields: [market_agreements.status, market_agreements.subsidy_pool_balance_usd, market_agreements.market_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [market_agreements.market_agreement_id]
          action_bindings:
            market_agreements.market_agreement_id: market_agreement_id
        state_contract:
          field: market_agreements.status
          allowed: [installing, active, suspended]
    params:
      per_tier:
        "Cooler & Snack Wall": {min_lot_usd: "=subsidy_funding_minimum_usd", lot_expiry_months: "=subsidy_funding_lot_expiry_months", model: "=subsidy_model"}
        "Compact Micro Market": {min_lot_usd: "=subsidy_funding_minimum_usd", lot_expiry_months: "=subsidy_funding_lot_expiry_months", model: "=subsidy_model"}
        "Standard Micro Market": {min_lot_usd: "=subsidy_funding_minimum_usd", lot_expiry_months: "=subsidy_funding_lot_expiry_months", model: "=subsidy_model"}
        "Fresh Food Micro Market": {min_lot_usd: "=subsidy_funding_minimum_usd", lot_expiry_months: "=subsidy_funding_lot_expiry_months", model: "=subsidy_model"}
        "Expanded Campus Micro Market": {min_lot_usd: "=subsidy_funding_minimum_usd", lot_expiry_months: "=subsidy_funding_lot_expiry_months", model: "=subsidy_model"}
        "Smart Store Micro Market": {min_lot_usd: "=subsidy_funding_minimum_usd", lot_expiry_months: "=subsidy_funding_lot_expiry_months", model: "=subsidy_model"}
  - id: market_subsidy_drawdown_rules
    subject: [market_subsidy_drawdown_posted]
    rule: >
      When an employee buys at the kiosk, the discount met from client funding is calculated from the subsidy model printed against the market format: a percent_discount model meets the stated percentage of shelf price, a fixed_per_visit model meets a flat amount once per shopping visit, and a model of none meets nothing.
      Whatever the model yields is then held to the daily ceiling printed against the market format, measured as the total subsidy already drawn for that employee at that market on that day plus the subsidy this purchase would draw.
      Where no drawable funding remains on the agreement, no drawdown is posted, the employee pays the full shelf price, and the shortfall is reported to the client on the next settlement invoice rather than carried as a negative pool.
      Drawdowns are taken from funding lots in order of the day the lot was funded, oldest lot first, and every drawdown row carries the employee till transaction that caused it so that a reversal can be matched back to the exact drawdown.
      Subsidy is only drawn while the agreement stands active or suspended, since a market that has not opened has rung no purchases and a closed market rings none.
      A purchase reversed at the kiosk reverses its drawdown to the same funding lot it was taken from, and never to the newest lot.
    eligibility:
      - id: drawable_state
        applies_to: [market_subsidy_drawdown_posted]
        kind: state
        condition: Subsidy is only drawn while the agreement stands active or suspended, since a market that has not opened has rung no purchases and a closed market rings none.
        evidence_fields: [market_agreements.status, market_agreements.subsidy_pool_balance_usd, market_agreements.market_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [market_agreements.market_agreement_id]
          action_bindings:
            market_agreements.market_agreement_id: market_agreement_id
        state_contract:
          field: market_agreements.status
          allowed: [active, suspended]
    params:
      per_tier:
        "Cooler & Snack Wall": {model: "=subsidy_model", pct_of_shelf: "=subsidy_pct_of_shelf_price", daily_cap_usd: "=subsidy_cap_per_employee_per_day_usd"}
        "Compact Micro Market": {model: "=subsidy_model", pct_of_shelf: "=subsidy_pct_of_shelf_price", daily_cap_usd: "=subsidy_cap_per_employee_per_day_usd"}
        "Standard Micro Market": {model: "=subsidy_model", pct_of_shelf: "=subsidy_pct_of_shelf_price", daily_cap_usd: "=subsidy_cap_per_employee_per_day_usd"}
        "Fresh Food Micro Market": {model: "=subsidy_model", pct_of_shelf: "=subsidy_pct_of_shelf_price", daily_cap_usd: "=subsidy_cap_per_employee_per_day_usd"}
        "Expanded Campus Micro Market": {model: "=subsidy_model", pct_of_shelf: "=subsidy_pct_of_shelf_price", daily_cap_usd: "=subsidy_cap_per_employee_per_day_usd"}
        "Smart Store Micro Market": {model: "=subsidy_model", pct_of_shelf: "=subsidy_pct_of_shelf_price", daily_cap_usd: "=subsidy_cap_per_employee_per_day_usd"}
    formula:
      subsidy_usd: min(round(amount_usd * subsidy_pct_of_shelf_price / 100, 2), subsidy_cap_per_employee_per_day_usd)
  - id: market_shrink_terms
    subject: [market_shrink_adjustment_posted]
    rule: >
      Unexplained inventory loss is measured at each full count, at the frequency printed against the market format, as loss at retail value over the period against sales over the same period.
      Dated-out fresh stock is credited back at the spoilage percentage printed against the market format before loss is measured, so that a fresh format is not charged for the freshness it was bought for.
      Loss up to the allowance printed against the market format is absorbed in full; loss above the allowance is charged to the client at the share printed against that format, and the charge names the count it rests on.
      A shrink adjustment may be disputed no later than the shrink dispute window for the market format, counted in calendar days from the day the shrink adjustment was posted.
      Dispute days are counted as calendar days from the day after the adjustment was posted, every day of the week counts, and a dispute arriving on the boundary day itself is in time; calendar days are never converted into full 24-hour periods.
      Loss traced to a known cause — a cooler failure, a delivery short-shipped, a theft the client has reported to their own security — is taken out of the count before shrink is measured and is never charged as shrink.
      Where a market stood suspended for part of the period, the allowance is measured against the sales actually made rather than against the guarantee, so a closed market never generates a shrink charge on sales it did not ring.
    eligibility:
      - id: shrink_dispute_window
        applies_to: [market_shrink_adjustment_posted]
        kind: time
        condition: A shrink adjustment may be disputed no later than the shrink dispute window for the market format, counted in calendar days from the day the shrink adjustment was posted.
        evidence_fields: [market_ledger.posted_date, market_ledger.source_reference, market_ledger.market_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [market_ledger.source_reference]
          action_bindings:
            market_ledger.source_reference: source_reference
        temporal_basis:
          clock: frozen_time
          anchor_event: the day the shrink adjustment was posted
          anchor_source: market_ledger.posted_date
          relation: not_after
          duration_source: variants.shrink_dispute_window_days
          unit: calendar_days
          counting_rule: Dispute days are counted as calendar days from the day after the adjustment was posted, every day of the week counts, and a dispute arriving on the boundary day itself is in time; calendar days are never converted into full 24-hour periods.
          boundary: inclusive
    params:
      per_tier:
        "Cooler & Snack Wall": {allowance_pct: "=shrink_allowance_pct_of_sales", charge_pct: "=shrink_charge_pct_above_allowance", count_weeks: "=inventory_count_frequency_weeks", spoilage_pct: "=spoilage_credit_pct", dispute_days: "=shrink_dispute_window_days"}
        "Compact Micro Market": {allowance_pct: "=shrink_allowance_pct_of_sales", charge_pct: "=shrink_charge_pct_above_allowance", count_weeks: "=inventory_count_frequency_weeks", spoilage_pct: "=spoilage_credit_pct", dispute_days: "=shrink_dispute_window_days"}
        "Standard Micro Market": {allowance_pct: "=shrink_allowance_pct_of_sales", charge_pct: "=shrink_charge_pct_above_allowance", count_weeks: "=inventory_count_frequency_weeks", spoilage_pct: "=spoilage_credit_pct", dispute_days: "=shrink_dispute_window_days"}
        "Fresh Food Micro Market": {allowance_pct: "=shrink_allowance_pct_of_sales", charge_pct: "=shrink_charge_pct_above_allowance", count_weeks: "=inventory_count_frequency_weeks", spoilage_pct: "=spoilage_credit_pct", dispute_days: "=shrink_dispute_window_days"}
        "Expanded Campus Micro Market": {allowance_pct: "=shrink_allowance_pct_of_sales", charge_pct: "=shrink_charge_pct_above_allowance", count_weeks: "=inventory_count_frequency_weeks", spoilage_pct: "=spoilage_credit_pct", dispute_days: "=shrink_dispute_window_days"}
        "Smart Store Micro Market": {allowance_pct: "=shrink_allowance_pct_of_sales", charge_pct: "=shrink_charge_pct_above_allowance", count_weeks: "=inventory_count_frequency_weeks", spoilage_pct: "=spoilage_credit_pct", dispute_days: "=shrink_dispute_window_days"}
    formula:
      excess_shrink_pct: max(0, market_msr_shrink_rate - shrink_allowance_pct_of_sales)
      amount_usd: round(amount_usd * excess_shrink_pct * shrink_charge_pct_above_allowance / 10000, 2)
    measures: [market_msr_shrink_rate]
  - id: market_settlement_payment_terms
    subject: [market_settlement_payment_posted]
    rule: >
      Settlement invoices fall due the number of days after the invoice date printed against the market format, and a payment is recorded against the single invoice it settles.
      A payment is accepted while the agreement stands active, suspended or closed, since a closed market may still carry a final settlement.
      A part payment settles the named invoice in part and never spills onto another; an overpayment leaves the excess on the agreement to be applied to the next settlement raised.
      A late charge is the monthly late percentage printed against the market format applied to the amount still outstanding once the grace days printed against the same format have passed, held to the late charge ceiling printed against that format.
      Where a settlement is disputed in writing before the grace days expire, no late charge is raised while the dispute stands open, and the due date is not moved.
      Once a settlement invoice is past due by the credit hold threshold printed against the market format, restocking stops and the market is drawn down to empty rather than replenished, until the balance is settled.
    eligibility:
      - id: payable_state
        applies_to: [market_settlement_payment_posted]
        kind: state
        condition: A payment is accepted while the agreement stands active, suspended or closed, since a closed market may still carry a final settlement.
        evidence_fields: [market_agreements.status, market_agreements.receivable_balance_usd, market_agreements.market_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [market_agreements.market_agreement_id]
          action_bindings:
            market_agreements.market_agreement_id: market_agreement_id
        state_contract:
          field: market_agreements.status
          allowed: [active, suspended, closed]
    params:
      per_tier:
        "Cooler & Snack Wall": {terms_days: "=payment_terms_days", grace_days: "=late_fee_grace_days", late_pct: "=late_fee_monthly_pct", late_cap_usd: "=late_fee_cap_usd", hold_days: "=credit_hold_threshold_days_past_due"}
        "Compact Micro Market": {terms_days: "=payment_terms_days", grace_days: "=late_fee_grace_days", late_pct: "=late_fee_monthly_pct", late_cap_usd: "=late_fee_cap_usd", hold_days: "=credit_hold_threshold_days_past_due"}
        "Standard Micro Market": {terms_days: "=payment_terms_days", grace_days: "=late_fee_grace_days", late_pct: "=late_fee_monthly_pct", late_cap_usd: "=late_fee_cap_usd", hold_days: "=credit_hold_threshold_days_past_due"}
        "Fresh Food Micro Market": {terms_days: "=payment_terms_days", grace_days: "=late_fee_grace_days", late_pct: "=late_fee_monthly_pct", late_cap_usd: "=late_fee_cap_usd", hold_days: "=credit_hold_threshold_days_past_due"}
        "Expanded Campus Micro Market": {terms_days: "=payment_terms_days", grace_days: "=late_fee_grace_days", late_pct: "=late_fee_monthly_pct", late_cap_usd: "=late_fee_cap_usd", hold_days: "=credit_hold_threshold_days_past_due"}
        "Smart Store Micro Market": {terms_days: "=payment_terms_days", grace_days: "=late_fee_grace_days", late_pct: "=late_fee_monthly_pct", late_cap_usd: "=late_fee_cap_usd", hold_days: "=credit_hold_threshold_days_past_due"}
  - id: market_service_credit_terms
    subject: [market_service_credit_issued]
    rule: >
      Where the kiosk could not take a payment, or the market stood empty because a scheduled restock was missed, the client is credited against the settlement invoice for that period.
      Each hour of kiosk outage inside opening hours earns the percentage of the settlement printed against the market format, and the credits allowed in one settlement period are held to the ceiling printed against the same format.
      Outage is measured from the approved market service requests on the agreement for that period, and not from the client's recollection of when the screen was dark.
      A credit is allowed only when the claim reaches Larkspur Table no later than the claim window for the market format, counted in calendar days from the day the settlement invoice was posted.
      Claim window days are counted as calendar days from the day after the settlement invoice posting day, every day of the week counts, and a claim arriving on the boundary day itself is still in time; calendar days are never converted into full 24-hour periods.
      Outage caused by the client — a power cut on their floor, a network they took down, a door they locked — is not kiosk outage for this purpose and earns no credit.
      Where measured availability stayed at or above the uptime guarantee printed against the market format, no credit is allowed however many short interruptions there were.
      Where the credits that would be due exceed the settlement period ceiling, the ceiling is allowed and the balance of the claim is closed rather than carried forward.
    eligibility:
      - id: credit_claim_window
        applies_to: [market_service_credit_issued]
        kind: time
        condition: A credit is allowed only when the claim reaches Larkspur Table no later than the claim window for the market format, counted in calendar days from the day the settlement invoice was posted.
        evidence_fields: [market_ledger.posted_date, market_ledger.invoice_reference, market_ledger.market_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [market_ledger.invoice_reference]
          action_bindings:
            market_ledger.invoice_reference: invoice_reference
        temporal_basis:
          clock: frozen_time
          anchor_event: the day the settlement invoice was posted
          anchor_source: market_ledger.posted_date
          relation: not_after
          duration_source: variants.service_credit_claim_window_days
          unit: calendar_days
          counting_rule: Claim window days are counted as calendar days from the day after the settlement invoice posting day, every day of the week counts, and a claim arriving on the boundary day itself is still in time; calendar days are never converted into full 24-hour periods.
          boundary: inclusive
    params:
      per_tier:
        "Cooler & Snack Wall": {credit_pct_per_hour: "=outage_credit_pct_per_hour", period_cap_pct: "=outage_credit_cap_pct_of_settlement", claim_window_days: "=service_credit_claim_window_days", uptime_guarantee_pct: "=kiosk_uptime_guarantee_pct"}
        "Compact Micro Market": {credit_pct_per_hour: "=outage_credit_pct_per_hour", period_cap_pct: "=outage_credit_cap_pct_of_settlement", claim_window_days: "=service_credit_claim_window_days", uptime_guarantee_pct: "=kiosk_uptime_guarantee_pct"}
        "Standard Micro Market": {credit_pct_per_hour: "=outage_credit_pct_per_hour", period_cap_pct: "=outage_credit_cap_pct_of_settlement", claim_window_days: "=service_credit_claim_window_days", uptime_guarantee_pct: "=kiosk_uptime_guarantee_pct"}
        "Fresh Food Micro Market": {credit_pct_per_hour: "=outage_credit_pct_per_hour", period_cap_pct: "=outage_credit_cap_pct_of_settlement", claim_window_days: "=service_credit_claim_window_days", uptime_guarantee_pct: "=kiosk_uptime_guarantee_pct"}
        "Expanded Campus Micro Market": {credit_pct_per_hour: "=outage_credit_pct_per_hour", period_cap_pct: "=outage_credit_cap_pct_of_settlement", claim_window_days: "=service_credit_claim_window_days", uptime_guarantee_pct: "=kiosk_uptime_guarantee_pct"}
        "Smart Store Micro Market": {credit_pct_per_hour: "=outage_credit_pct_per_hour", period_cap_pct: "=outage_credit_cap_pct_of_settlement", claim_window_days: "=service_credit_claim_window_days", uptime_guarantee_pct: "=kiosk_uptime_guarantee_pct"}
    formula:
      uncapped_credit_usd: round(amount_usd * outage_credit_pct_per_hour * market_msr_kiosk_outage_hours / 100, 2)
      period_ceiling_usd: round(amount_usd * outage_credit_cap_pct_of_settlement / 100, 2)
    measures: [market_msr_kiosk_outage_hours]
  - id: market_suspension_and_closure_terms
    subject: [market_service_suspended, market_service_resumed, market_agreement_closed]
    rule: >
      A client may close the market off without ending the agreement, for a floor move, a building closure or a seasonal shutdown.
      A suspension, a resumption or a closure is only worked while the agreement stands active, suspended or closed, and a market still installing is abandoned rather than suspended.
      A suspension shorter than the minimum printed against the market format is handled as ordinary closed days, and suspended days accumulate against the contract year ceiling printed against the same format; once the ceiling is reached the client is asked either to reopen or to give notice.
      While suspended the standby charge printed against the market format replaces the equipment lease, and perishable stock is removed at the start of the suspension without charge.
      Reopening needs the notice printed against the market format, counted in calendar days, so that the planogram can be rebuilt and the coolers restocked.
      Only the client may end the agreement, and the desk records the request as a termination notice for the client to confirm; notice is the number of calendar days printed against the market format.
      Where the closure day falls before the end of the term, the early removal charge printed against the market format falls due, and on or after the end of the term it does not; the equipment removal charge printed against the format falls due either way.
      On closure the subsidy funding left undrawn is refunded to the client on the final settlement rather than forfeited.
    eligibility:
      - id: lifecycle_state
        applies_to: [market_service_suspended, market_service_resumed, market_agreement_closed]
        kind: state
        condition: A suspension, a resumption or a closure is only worked while the agreement stands active, suspended or closed, and a market still installing is abandoned rather than suspended.
        evidence_fields: [market_agreements.status, market_agreements.suspension_start_date, market_agreements.market_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [market_agreements.market_agreement_id]
          action_bindings:
            market_agreements.market_agreement_id: market_agreement_id
        state_contract:
          field: market_agreements.status
          allowed: [active, suspended, closed]
    params:
      per_tier:
        "Cooler & Snack Wall": {min_days: "=min_suspension_days", annual_cap_days: "=max_suspension_days_per_contract_year", resume_notice_days: "=resumption_lead_days", standby_usd: "=suspension_standby_fee_usd", notice_days: "=termination_notice_days", early_removal_usd: "=early_removal_fee_usd", removal_usd: "=equipment_removal_fee_usd", term_months: "=contract_term_months"}
        "Compact Micro Market": {min_days: "=min_suspension_days", annual_cap_days: "=max_suspension_days_per_contract_year", resume_notice_days: "=resumption_lead_days", standby_usd: "=suspension_standby_fee_usd", notice_days: "=termination_notice_days", early_removal_usd: "=early_removal_fee_usd", removal_usd: "=equipment_removal_fee_usd", term_months: "=contract_term_months"}
        "Standard Micro Market": {min_days: "=min_suspension_days", annual_cap_days: "=max_suspension_days_per_contract_year", resume_notice_days: "=resumption_lead_days", standby_usd: "=suspension_standby_fee_usd", notice_days: "=termination_notice_days", early_removal_usd: "=early_removal_fee_usd", removal_usd: "=equipment_removal_fee_usd", term_months: "=contract_term_months"}
        "Fresh Food Micro Market": {min_days: "=min_suspension_days", annual_cap_days: "=max_suspension_days_per_contract_year", resume_notice_days: "=resumption_lead_days", standby_usd: "=suspension_standby_fee_usd", notice_days: "=termination_notice_days", early_removal_usd: "=early_removal_fee_usd", removal_usd: "=equipment_removal_fee_usd", term_months: "=contract_term_months"}
        "Expanded Campus Micro Market": {min_days: "=min_suspension_days", annual_cap_days: "=max_suspension_days_per_contract_year", resume_notice_days: "=resumption_lead_days", standby_usd: "=suspension_standby_fee_usd", notice_days: "=termination_notice_days", early_removal_usd: "=early_removal_fee_usd", removal_usd: "=equipment_removal_fee_usd", term_months: "=contract_term_months"}
        "Smart Store Micro Market": {min_days: "=min_suspension_days", annual_cap_days: "=max_suspension_days_per_contract_year", resume_notice_days: "=resumption_lead_days", standby_usd: "=suspension_standby_fee_usd", notice_days: "=termination_notice_days", early_removal_usd: "=early_removal_fee_usd", removal_usd: "=equipment_removal_fee_usd", term_months: "=contract_term_months"}
  - id: market_combination_dining_interaction
    subject: [market_monthly_settlement_invoiced, market_subsidy_drawdown_posted]
    rule: >
      What a client holds elsewhere in the dining programme changes what the market settles and where its subsidy may be spent.
      Where the same client holds an active workplace cafe management contract at the site the market stands in, the two subsidy pools are read as one for the employee daily ceiling, and the ceiling printed against the cafe service model governs both outlets together rather than each separately.
      Where there is no cafe contract at the site, the market's own daily ceiling printed against its format governs, and nothing is pooled.
      Where the same client holds an active vending programme at the site, the equipment lease on the market is invoiced in full, and the commission the vending programme pays back is settled on its own statement; the two are never netted against each other.
      A micro market and a full service cafe at the same site are not mutually exclusive, and clients commonly hold both; but a market may not be installed at a site where the cafe contract's service model already includes an unattended grab and go wall, since that wall is the market.
      Where the cafe contract at the site closes, the market's own daily ceiling takes over from the next settlement period, and drawdowns already posted are not reopened.
    eligibility: []
    params:
      per_tier:
        "Cooler & Snack Wall": {pool_with_cafe: false, net_against_vending: false}
        "Compact Micro Market": {pool_with_cafe: true, net_against_vending: false}
        "Standard Micro Market": {pool_with_cafe: true, net_against_vending: false}
        "Fresh Food Micro Market": {pool_with_cafe: true, net_against_vending: false}
        "Expanded Campus Micro Market": {pool_with_cafe: true, net_against_vending: false}
        "Smart Store Micro Market": {pool_with_cafe: true, net_against_vending: false}

extended_policies:
  - id: market_ext_kiosk_catch_up_drawdown
    base_policy_refs: [market_subsidy_drawdown_rules, market_combination_dining_interaction]
    overwrite:
      - base_policy: market_subsidy_drawdown_rules
        superseded_clause: >-
          a fixed_per_visit model meets a flat amount once per shopping visit
        replaced_by: >-
          Where the market format's subsidy model meets no share of shelf price, no shelf figure is
          recovered and no discount is booked at all.
      - base_policy: market_combination_dining_interaction
        superseded_clause: >-
          the ceiling printed against the cafe service model governs both outlets together rather than each separately
        replaced_by: >-
          the discount so obtained is held to the daily ceiling printed against the market format
      - base_policy: market_subsidy_drawdown_rules
        superseded_clause: >-
          a percent_discount model meets the stated percentage of shelf price
        replaced_by: >-
          Where the client holds a workplace cafe contract standing active and that cafe has met at
          or above the cafe pooling floor of client subsidy over the twelve months to the day the
          discount is worked out, the share printed against the cafe service model governs both
          outlets together.
    trigger: state_due
    subject: [market_subsidy_drawdown_posted]
    computes: subsidy_amount_usd
    target_tool: post_kiosk_catch_up_drawdown_96ce656f
    params:
      busy_kiosk_trips: 8
      thin_quarter_trips: 12
      settled_market_months: 12
      cafe_pooling_floor_usd: 18000
      light_use_step_pct: 3.0
      deep_funding_lots: 4
      thin_funding_lots: 1
      deep_funding_step_pct: 2.5
      thin_funding_step_pct: 4.0
    rule: >
      Where a kiosk shopping trip was rung without the client discount the till should have met, the
      discount is booked to the agreement afterwards as a drawdown against the client's funding.
      The trip is valued from the agreement's own drawdown record, that value is grossed back to a
      shelf figure at the share of shelf price printed against the market format, the share that
      applies to the trip is applied to that shelf figure, and the discount so obtained is held to
      the daily ceiling printed against the market format. Where the market format's subsidy model
      meets no share of shelf price, no shelf figure is recovered and no discount is booked at all.
      Every intermediate figure and the result
      are rounded to the nearest cent, a figure falling exactly on the half-cent going to the nearest even cent as they are taken.
      The trip is valued at the most recent drawdown posted against the agreement. Where the kiosk
      posted at or above the busy-kiosk trip count of drawdowns over the three months to the day the
      discount is worked out and the agreement carries an approved kiosk outage request over the
      same three months, the trip is valued instead at the mean drawdown taken over the reading
      window. Where the kiosk posted below the busy-kiosk trip count of drawdowns over those three
      months and the agreement carries an approved kiosk outage request over the same three months,
      the trip is valued at the largest drawdown ever posted against the agreement.
      The mean drawdown is taken over the three months to the day the discount is worked out. Where
      the kiosk posted below the thin-quarter trip count of drawdowns over those three months and the
      market has been open at or beyond the settled-market age, the mean is taken over the twelve
      months to that day instead. Where the kiosk posted below the thin-quarter trip count of
      drawdowns over those three months and the market has been open for less than the
      settled-market age, the mean is taken over every drawdown ever posted against the agreement.
      The share that applies to the trip is the share of shelf price printed against the market
      format. Where the client holds a workplace cafe contract standing active and that cafe has met
      at or above the cafe pooling floor of client subsidy over the twelve months to the day the
      discount is worked out, the share printed against the cafe service model governs both outlets
      together. Where the client holds a workplace cafe contract standing active and that cafe has
      met below the cafe pooling floor of client subsidy over those twelve months, the share printed
      against the cafe service model is stepped back by the light-use step before it is applied.
      Nothing is added to or taken off that share on account of how the client has funded the market.
      Where the client funded at or above the deep-funding lot count of subsidy lots over the twelve
      months to the day the discount is worked out and the funding standing unspent on the agreement
      is at or above the minimum funding lot printed against the market format, the deep-funding step
      is added to the share. Where the client funded at or below the thin-funding lot count of
      subsidy lots over those twelve months, or the funding standing unspent on the agreement is
      below the minimum funding lot printed against the market format, the thin-funding step is taken
      off the share.
    prerequisite: []
    cross_category:
      - category: cafe
        as: branch
        reads: [status, subsidy_pct_of_menu_price, cafe_ledger.amount_usd]
        note: the pooled-share factor reads the site cafe contract's standing and the client subsidy met on the cafe ledger over the trailing year to decide which printed share governs the trip
    compute:
      - drawdown_sum_q: "SUM('market_ledger','amount_usd', within_months=3, date_field='posted_date', event_type='market_subsidy_drawdown_posted')"
      - trip_drawdowns_q: "COUNT('market_ledger', within_months=3, date_field='posted_date', event_type='market_subsidy_drawdown_posted')"
      - drawdown_sum_y: "SUM('market_ledger','amount_usd', within_months=12, date_field='posted_date', event_type='market_subsidy_drawdown_posted')"
      - drawdown_count_y: "COUNT('market_ledger', within_months=12, date_field='posted_date', event_type='market_subsidy_drawdown_posted')"
      - drawdown_sum_all: "SUM('market_ledger','amount_usd', event_type='market_subsidy_drawdown_posted')"
      - drawdown_count_all: "COUNT('market_ledger', event_type='market_subsidy_drawdown_posted')"
      - installed_months: "MONTHS(F('installation_completed_date'), NOW)"
      - window_mean: "RND(drawdown_sum_y / MX(drawdown_count_y, 1), 2) if (trip_drawdowns_q < K('thin_quarter_trips') and installed_months >= K('settled_market_months')) else (RND(drawdown_sum_all / MX(drawdown_count_all, 1), 2) if (trip_drawdowns_q < K('thin_quarter_trips') and installed_months < K('settled_market_months')) else RND(drawdown_sum_q / MX(trip_drawdowns_q, 1), 2))"
      - outage_hours_q: "COUNT('market_service_intake', within_months=3, date_field='requested_effective_date', request_type='service_credit_claim', request_status='approved')"
      - largest_drawdown: "MAX('market_ledger','amount_usd', event_type='market_subsidy_drawdown_posted')"
      - latest_drawdown: "float(LATEST('market_ledger','amount_usd', date_field='posted_date', event_type='market_subsidy_drawdown_posted') or 0)"
      - basket_value: "window_mean if (trip_drawdowns_q >= K('busy_kiosk_trips') and outage_hours_q >= 1) else (largest_drawdown if (trip_drawdowns_q < K('busy_kiosk_trips') and outage_hours_q >= 1) else latest_drawdown)"
      - cafe_status: "CFIELD('cafe','status')"
      - cafe_subsidy_year: "XSUM('cafe','cafe_ledger','amount_usd', within_months=12, date_field='posted_date', event_type='cafe_subsidy_drawdown_posted')"
      - cafe_printed_share: "float(CPARAM('cafe','subsidy_pct_of_menu_price') or 0)"
      - pooled_share_pct: "cafe_printed_share if (cafe_status == 'active' and cafe_subsidy_year >= K('cafe_pooling_floor_usd')) else (RND(cafe_printed_share - K('light_use_step_pct'), 2) if (cafe_status == 'active' and cafe_subsidy_year < K('cafe_pooling_floor_usd')) else P('subsidy_pct_of_shelf_price'))"
      - funding_lots_year: "COUNT('market_ledger', within_months=12, date_field='posted_date', event_type='market_subsidy_funding_posted')"
      - unspent_funding: "F('subsidy_pool_balance_usd')"
      - funding_step_pct: "K('deep_funding_step_pct') if (funding_lots_year >= K('deep_funding_lots') and unspent_funding >= P('subsidy_funding_minimum_usd')) else (-K('thin_funding_step_pct') if (funding_lots_year <= K('thin_funding_lots') or unspent_funding < P('subsidy_funding_minimum_usd')) else 0.0)"
      - applied_share_pct: "RND(pooled_share_pct + funding_step_pct, 2)"
      - trip_shelf_value: "RND(basket_value / (P('subsidy_pct_of_shelf_price') / 100), 2) if P('subsidy_pct_of_shelf_price') > 0 else 0.0"
      - discount_owed: "RND(trip_shelf_value * applied_share_pct / 100, 2)"
      - result: "RND(MN(discount_owed, P('subsidy_cap_per_employee_per_day_usd')), 2)"
    compute_basis:
      drawdown_sum_q: "The mean drawdown is taken over the three months to the day the discount is worked out."
      trip_drawdowns_q: "Where the kiosk posted at or above the busy-kiosk trip count of drawdowns over the three months to the day the discount is worked out and the agreement carries an approved kiosk outage request over the same three months, the trip is valued instead at the mean drawdown taken over the reading window."
      drawdown_sum_y: "Where the kiosk posted below the thin-quarter trip count of drawdowns over those three months and the market has been open at or beyond the settled-market age, the mean is taken over the twelve months to that day instead."
      drawdown_count_y: "Where the kiosk posted below the thin-quarter trip count of drawdowns over those three months and the market has been open at or beyond the settled-market age, the mean is taken over the twelve months to that day instead."
      drawdown_sum_all: "Where the kiosk posted below the thin-quarter trip count of drawdowns over those three months and the market has been open for less than the settled-market age, the mean is taken over every drawdown ever posted against the agreement."
      drawdown_count_all: "Where the kiosk posted below the thin-quarter trip count of drawdowns over those three months and the market has been open for less than the settled-market age, the mean is taken over every drawdown ever posted against the agreement."
      installed_months: "Where the kiosk posted below the thin-quarter trip count of drawdowns over those three months and the market has been open at or beyond the settled-market age, the mean is taken over the twelve months to that day instead."
      window_mean: "The mean drawdown is taken over the three months to the day the discount is worked out. Where the kiosk posted below the thin-quarter trip count of drawdowns over those three months and the market has been open at or beyond the settled-market age, the mean is taken over the twelve months to that day instead. Where the kiosk posted below the thin-quarter trip count of drawdowns over those three months and the market has been open for less than the settled-market age, the mean is taken over every drawdown ever posted against the agreement."
      outage_hours_q: "Where the kiosk posted below the busy-kiosk trip count of drawdowns over those three months and the agreement carries an approved kiosk outage request over the same three months, the trip is valued at the largest drawdown ever posted against the agreement."
      largest_drawdown: "Where the kiosk posted below the busy-kiosk trip count of drawdowns over those three months and the agreement carries an approved kiosk outage request over the same three months, the trip is valued at the largest drawdown ever posted against the agreement."
      latest_drawdown: "The trip is valued at the most recent drawdown posted against the agreement."
      basket_value: "The trip is valued at the most recent drawdown posted against the agreement. Where the kiosk posted at or above the busy-kiosk trip count of drawdowns over the three months to the day the discount is worked out and the agreement carries an approved kiosk outage request over the same three months, the trip is valued instead at the mean drawdown taken over the reading window. Where the kiosk posted below the busy-kiosk trip count of drawdowns over those three months and the agreement carries an approved kiosk outage request over the same three months, the trip is valued at the largest drawdown ever posted against the agreement."
      cafe_status: "Where the client holds a workplace cafe contract standing active and that cafe has met at or above the cafe pooling floor of client subsidy over the twelve months to the day the discount is worked out, the share printed against the cafe service model governs both outlets together."
      cafe_subsidy_year: "Where the client holds a workplace cafe contract standing active and that cafe has met at or above the cafe pooling floor of client subsidy over the twelve months to the day the discount is worked out, the share printed against the cafe service model governs both outlets together."
      cafe_printed_share: "Where the client holds a workplace cafe contract standing active and that cafe has met below the cafe pooling floor of client subsidy over those twelve months, the share printed against the cafe service model is stepped back by the light-use step before it is applied."
      pooled_share_pct: "The share that applies to the trip is the share of shelf price printed against the market format. Where the client holds a workplace cafe contract standing active and that cafe has met at or above the cafe pooling floor of client subsidy over the twelve months to the day the discount is worked out, the share printed against the cafe service model governs both outlets together. Where the client holds a workplace cafe contract standing active and that cafe has met below the cafe pooling floor of client subsidy over those twelve months, the share printed against the cafe service model is stepped back by the light-use step before it is applied."
      funding_lots_year: "Where the client funded at or above the deep-funding lot count of subsidy lots over the twelve months to the day the discount is worked out and the funding standing unspent on the agreement is at or above the minimum funding lot printed against the market format, the deep-funding step is added to the share."
      unspent_funding: "Where the client funded at or below the thin-funding lot count of subsidy lots over those twelve months, or the funding standing unspent on the agreement is below the minimum funding lot printed against the market format, the thin-funding step is taken off the share."
      funding_step_pct: "Nothing is added to or taken off that share on account of how the client has funded the market. Where the client funded at or above the deep-funding lot count of subsidy lots over the twelve months to the day the discount is worked out and the funding standing unspent on the agreement is at or above the minimum funding lot printed against the market format, the deep-funding step is added to the share. Where the client funded at or below the thin-funding lot count of subsidy lots over those twelve months, or the funding standing unspent on the agreement is below the minimum funding lot printed against the market format, the thin-funding step is taken off the share."
      trip_shelf_value: "The trip is valued from the agreement's own drawdown record, that value is grossed back to a shelf figure at the share of shelf price printed against the market format, the share that applies to the trip is applied to that shelf figure, and the discount so obtained is held to the daily ceiling printed against the market format. Where the market format's subsidy model meets no share of shelf price, no shelf figure is recovered and no discount is booked at all."
      discount_owed: "The trip is valued from the agreement's own drawdown record, that value is grossed back to a shelf figure at the share of shelf price printed against the market format, the share that applies to the trip is applied to that shelf figure, and the discount so obtained is held to the daily ceiling printed against the market format."
      result: "Every intermediate figure and the result are rounded to the nearest cent, a figure falling exactly on the half-cent going to the nearest even cent as they are taken."
    factors:
      - id: trip_valuation_basis
        effect: method
        decides: basket_value
        bindings: [drawdown_sum_q, trip_drawdowns_q, outage_hours_q, largest_drawdown, latest_drawdown, basket_value]
        ladder:
          - when: "the kiosk posted at or above the busy-kiosk trip count of drawdowns over the three months to the day the discount is worked out and the agreement carries an approved kiosk outage request over the same three months"
            method: "the trip is valued at the mean drawdown taken over the reading window"
          - when: "the kiosk posted below the busy-kiosk trip count of drawdowns over those three months and the agreement carries an approved kiosk outage request over the same three months"
            method: "the trip is valued at the largest drawdown ever posted against the agreement"
          - when: "otherwise"
            method: "the trip is valued at the most recent drawdown posted against the agreement"
        baseline:
          basket_value: "latest_drawdown"
        evidence: [history]
        cross_difficulty: null
      - id: mean_reading_window
        effect: method
        decides: window_mean
        bindings: [drawdown_sum_y, drawdown_count_y, drawdown_sum_all, drawdown_count_all, installed_months, window_mean]
        ladder:
          - when: "the kiosk posted below the thin-quarter trip count of drawdowns over the three months to the day the discount is worked out and the market has been open at or beyond the settled-market age"
            method: "the mean is taken over the twelve months to that day"
          - when: "the kiosk posted below the thin-quarter trip count of drawdowns over those three months and the market has been open for less than the settled-market age"
            method: "the mean is taken over every drawdown ever posted against the agreement"
          - when: "otherwise"
            method: "the mean is taken over the three months to that day"
        baseline:
          window_mean: "RND(drawdown_sum_q / MX(trip_drawdowns_q, 1), 2)"
        evidence: [history, date]
        cross_difficulty: null
      - id: pooled_dining_share
        effect: parameter
        decides: pooled_share_pct
        bindings: [cafe_status, cafe_subsidy_year, cafe_printed_share, pooled_share_pct]
        ladder:
          - when: "the client holds a workplace cafe contract standing active and that cafe has met at or above the cafe pooling floor of client subsidy over the twelve months to the day the discount is worked out"
            value: "the share of menu price printed against the cafe service model"
          - when: "the client holds a workplace cafe contract standing active and that cafe has met below the cafe pooling floor of client subsidy over those twelve months"
            value: "the share printed against the cafe service model less the light-use step"
          - when: "otherwise"
            value: "the share of shelf price printed against the market format"
        baseline:
          pooled_share_pct: "P('subsidy_pct_of_shelf_price')"
        evidence: [cross_category, history]
        cross_difficulty: cafe
      - id: funding_depth_step
        effect: parameter
        decides: funding_step_pct
        bindings: [funding_lots_year, unspent_funding, funding_step_pct]
        ladder:
          - when: "the client funded at or above the deep-funding lot count of subsidy lots over the twelve months to the day the discount is worked out and the funding standing unspent on the agreement is at or above the minimum funding lot printed against the market format"
            value: "the deep-funding step, added to the share"
          - when: "the client funded at or below the thin-funding lot count of subsidy lots over those twelve months, or the funding standing unspent on the agreement is below the minimum funding lot printed against the market format"
            value: "the thin-funding step, taken off the share"
          - when: "otherwise"
            value: "nothing added to or taken off the share"
        baseline:
          funding_step_pct: "0.0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        Where a kiosk shopping trip was rung without the client discount the till should have met, the
        discount is booked to the agreement afterwards as a drawdown against the client's funding.
        The trip is valued from the agreement's own drawdown record, that value is grossed back to a
        shelf figure at the share of shelf price printed against the market format, the share that
        applies to the trip is applied to that shelf figure, and the discount so obtained is held to
        the daily ceiling printed against the market format. Every intermediate figure and the result
        are rounded to the nearest cent, a figure falling exactly on the half-cent going to the nearest even cent as they are taken. Where the market format's subsidy model meets no
        share of shelf price, no shelf figure is recovered and no discount is booked at all. The trip is valued at the most
        recent drawdown posted against the agreement. The mean drawdown is taken over the three
        months to the day the discount is worked out. The share that applies to the trip is the share
        of shelf price printed against the market format. Nothing is added to or taken off that share
        on account of how the client has funded the market.
      params: [subsidy_pct_of_shelf_price, subsidy_cap_per_employee_per_day_usd]
    inputs:
      history:
        - {table: market_ledger, aggregate: sum, field: amount_usd, within_months: 3, filters: {event_type: market_subsidy_drawdown_posted}}
        - {table: market_ledger, aggregate: count, within_months: 12, filters: {event_type: market_subsidy_funding_posted}}
        - {table: market_service_intake, aggregate: count, within_months: 3, filters: {request_type: service_credit_claim, request_status: approved}}
        - {category: cafe, table: cafe_ledger, aggregate: sum, field: amount_usd, within_months: 12, filters: {event_type: cafe_subsidy_drawdown_posted}}
      cross_category: [cafe]
  - id: market_ext_period_settlement_true_up
    base_policy_refs: [market_agg_portfolio_settlement_band, market_settlement_terms, market_combination_dining_interaction]
    overwrite:
      - base_policy: market_settlement_terms
        superseded_clause: >-
          Where sales for the period fall short of the sales guarantee printed against the market format, the shortfall share printed against that format is invoiced to the client; where sales exceed the guarantee, nothing further is invoiced and no rebate is given.
        replaced_by: >-
          No shortfall charge is invoiced on a subsidy true-up basis, the true-up itself already
          carrying what the period's trading yielded.
      - base_policy: market_settlement_terms
        superseded_clause: >-
          a subsidy true-up basis invoices the gap between shelf sales and the cost of goods with the subsidy the client has met
        replaced_by: >-
          The product settlement invoiced on a subsidy true-up basis is the client discount met at
          the kiosk over the reading window, taken at the true-up share, together with the card
          processing charge on the shelf value of those trips, the call-out charge for unscheduled
          planogram work, and the fresh handling charge.
    trigger: state_due
    subject: [market_monthly_settlement_invoiced]
    computes: settlement_amount_usd
    target_tool: post_market_settlement_true_up_13e3670a
    params:
      window_months: 3
      busy_quarter_trips: 10
      prompt_settlement_count: 3
      slow_settlement_count: 1
      prompt_true_up_share_pct: 97
      carry_true_up_share_pct: 103
      standard_true_up_share_pct: 100
      fresh_share_floor_pct: 33
      card_uplift_pct_points: 0.25
      card_relief_pct_points: 0.20
      planogram_change_floor: 2
      wide_range_sku_floor: 250
      fresh_trip_floor: 6
      fresh_flat_share_pct: 25
    rule: >
      The product settlement invoiced on a subsidy true-up basis is the client discount met at the
      kiosk over the reading window, taken at the true-up share, together with the card processing
      charge on the shelf value of those trips, the call-out charge for unscheduled planogram work,
      and the fresh handling charge. The four amounts are each rounded to the nearest cent, a figure falling exactly on the half-cent going to the nearest even cent
      as they are taken and are then added, and the sum is rounded the same way;
      none of them acts on any of the others. The shelf value of the trips in the reading window is
      the discount met over that window grossed back at the share of shelf price printed against the
      market format, and the card processing charge acts on that shelf value rather than on the
      discount. Where the market format's subsidy model meets no share of shelf price, no shelf
      value is recovered and no card processing charge is passed through. No shortfall charge is
      invoiced on a subsidy true-up basis, the true-up itself already carrying what the period's
      trading yielded. The settlement invoiced for a period is not worked out before the agreement's
      drawdown record carries the client discount owed for every kiosk trip the till failed to meet.
      The reading window is the three months to the day the settlement is raised. Where the kiosk
      posted at or above the busy-quarter trip count of drawdowns over those three months and the
      agreement carries no approved kiosk outage request over the same three months, the reading
      window is the two months to that day. Where the kiosk posted at or above the busy-quarter trip
      count of drawdowns over those three months and the agreement carries an approved kiosk outage
      request over the same three months, the discount met is taken over the six months to that day
      and halved, so that an interrupted quarter is smoothed against the half year around it.
      The true-up share is the standard true-up share. Where the client settled at or above the
      prompt settlement count of market settlement invoices over the twelve months to the day the
      settlement is raised and the balance standing unsettled on the agreement is below the minimum
      funding lot printed against the market format, the prompt true-up share applies instead. Where
      the client settled at or below the slow settlement count of market settlement invoices over
      those twelve months, or the balance standing unsettled on the agreement is at or above the
      minimum funding lot printed against the market format, the carrying true-up share applies.
      The card processing charge is passed through at the rate printed against the market format.
      Where the fresh cabinet took at or above the fresh share floor of the kiosk trips over the
      three months to the day the settlement is raised and the market format carries a frozen unit,
      the printed rate is raised by the card uplift step. Where the fresh cabinet took below the
      fresh share floor of the kiosk trips over those three months and the market format carries a
      frozen unit, the printed rate is lowered by the card relief step.
      No call-out charge is added for planogram work. Where the client had at or above the planogram
      change floor of planogram changes approved over the three months to the day the settlement is
      raised and the market format carries at or above the wide-range product count, the call-out
      charge printed against the market format is added twice over. Where the client had at or above
      the planogram change floor of planogram changes approved over those three months and the market
      format carries below the wide-range product count, the call-out charge printed against the
      market format is added once.
      No fresh handling charge is made. Where the fresh cabinet was shopped at or above the fresh-trip
      floor of times over the six months to the day the settlement is raised and the coolers were
      shopped at least once over those six months, the fresh handling charge is the call-out charge
      printed against the market format apportioned by the share those fresh cabinet trips take of
      the fresh and chilled trips together. Where the fresh cabinet was shopped below the fresh-trip
      floor of times over those six months and the coolers were shopped at least once over those six
      months, the fresh handling charge is the flat fresh share of the call-out charge printed
      against the market format.
    prerequisite:
      - problem: market_ext_kiosk_catch_up_drawdown
        kind: value_input
        gate: window_subsidy
        form: state
        policy_source: >-
          The settlement invoiced for a period is not worked out before the agreement's drawdown
          record carries the client discount owed for every kiosk trip the till failed to meet.
        condition: >-
          every kiosk trip on the agreement that was rung without the client discount carries a
          subsidy drawdown posting on the market ledger
        resolved_by: post_kiosk_catch_up_drawdown_96ce656f
        effect: >-
          the discount met over the reading window rises by the drawdown that was missing, so the
          window_subsidy binding, and with it the true-up and the card processing charge, take a
          larger value
    cross_category: []
    compute:
      - drawdowns_2m: "SUM('market_ledger','amount_usd', within_months=2, date_field='posted_date', event_type='market_subsidy_drawdown_posted')"
      - drawdowns_q: "SUM('market_ledger','amount_usd', within_months=3, date_field='posted_date', event_type='market_subsidy_drawdown_posted')"
      - drawdowns_6m: "SUM('market_ledger','amount_usd', within_months=6, date_field='posted_date', event_type='market_subsidy_drawdown_posted')"
      - trips_q: "COUNT('market_ledger', within_months=3, date_field='posted_date', event_type='market_subsidy_drawdown_posted')"
      - outage_requests_q: "COUNT('market_service_intake', within_months=3, date_field='requested_effective_date', request_type='service_credit_claim', request_status='approved')"
      - window_subsidy: "drawdowns_2m if (trips_q >= K('busy_quarter_trips') and outage_requests_q == 0) else (RND(drawdowns_6m / 2, 2) if (trips_q >= K('busy_quarter_trips') and outage_requests_q >= 1) else drawdowns_q)"
      - shelf_sales: "RND(window_subsidy / (P('subsidy_pct_of_shelf_price') / 100), 2) if P('subsidy_pct_of_shelf_price') > 0 else 0.0"
      - paid_settlements_year: "COUNT('market_ledger', within_months=12, date_field='posted_date', event_type='market_settlement_payment_posted')"
      - unsettled_balance: "F('receivable_balance_usd')"
      - true_up_share_pct: "K('prompt_true_up_share_pct') if (paid_settlements_year >= K('prompt_settlement_count') and unsettled_balance < P('subsidy_funding_minimum_usd')) else (K('carry_true_up_share_pct') if (paid_settlements_year <= K('slow_settlement_count') or unsettled_balance >= P('subsidy_funding_minimum_usd')) else K('standard_true_up_share_pct'))"
      - fresh_trips_q: "COUNT('market_ledger', within_months=3, date_field='posted_date', event_type='market_subsidy_drawdown_posted', product_category='fresh_food')"
      - all_trips_q: "COUNT('market_ledger', within_months=3, date_field='posted_date', event_type='market_subsidy_drawdown_posted')"
      - freezer_flag: "P('freezer_included')"
      - card_share_pct: "RND(P('card_processing_fee_pct') + K('card_uplift_pct_points'), 2) if (fresh_trips_q * 100 >= all_trips_q * K('fresh_share_floor_pct') and freezer_flag) else (RND(P('card_processing_fee_pct') - K('card_relief_pct_points'), 2) if (fresh_trips_q * 100 < all_trips_q * K('fresh_share_floor_pct') and freezer_flag) else P('card_processing_fee_pct'))"
      - planogram_requests_q: "COUNT('market_service_intake', within_months=3, date_field='requested_effective_date', request_type='planogram_change_request', request_status='approved')"
      - range_sku: "P('sku_count')"
      - call_out_usd: "RND(P('restocking_call_out_fee_usd') * 2, 2) if (planogram_requests_q >= K('planogram_change_floor') and range_sku >= K('wide_range_sku_floor')) else (RND(P('restocking_call_out_fee_usd') * 1, 2) if (planogram_requests_q >= K('planogram_change_floor') and range_sku < K('wide_range_sku_floor')) else 0.0)"
      - fresh_trips_6m: "COUNT('market_ledger', within_months=6, date_field='posted_date', event_type='market_subsidy_drawdown_posted', product_category='fresh_food')"
      - chilled_trips_6m: "COUNT('market_ledger', within_months=6, date_field='posted_date', event_type='market_subsidy_drawdown_posted', product_category='cold_beverages')"
      - fresh_handling_usd: "RND(P('restocking_call_out_fee_usd') * fresh_trips_6m / MX(fresh_trips_6m + chilled_trips_6m, 1), 2) if (fresh_trips_6m >= K('fresh_trip_floor') and chilled_trips_6m >= 1) else (RND(P('restocking_call_out_fee_usd') * K('fresh_flat_share_pct') / 100, 2) if (fresh_trips_6m < K('fresh_trip_floor') and chilled_trips_6m >= 1) else 0.0)"
      - true_up_usd: "RND(window_subsidy * true_up_share_pct / 100, 2)"
      - card_usd: "RND(shelf_sales * card_share_pct / 100, 2)"
      - result: "RND(true_up_usd + card_usd + call_out_usd + fresh_handling_usd, 2)"
    compute_basis:
      drawdowns_2m: "Where the kiosk posted at or above the busy-quarter trip count of drawdowns over those three months and the agreement carries no approved kiosk outage request over the same three months, the reading window is the two months to that day."
      drawdowns_q: "The reading window is the three months to the day the settlement is raised."
      drawdowns_6m: "Where the kiosk posted at or above the busy-quarter trip count of drawdowns over those three months and the agreement carries an approved kiosk outage request over the same three months, the discount met is taken over the six months to that day and halved, so that an interrupted quarter is smoothed against the half year around it."
      trips_q: "Where the kiosk posted at or above the busy-quarter trip count of drawdowns over those three months and the agreement carries no approved kiosk outage request over the same three months, the reading window is the two months to that day."
      outage_requests_q: "Where the kiosk posted at or above the busy-quarter trip count of drawdowns over those three months and the agreement carries an approved kiosk outage request over the same three months, the discount met is taken over the six months to that day and halved, so that an interrupted quarter is smoothed against the half year around it."
      window_subsidy: "The reading window is the three months to the day the settlement is raised. Where the kiosk posted at or above the busy-quarter trip count of drawdowns over those three months and the agreement carries no approved kiosk outage request over the same three months, the reading window is the two months to that day. Where the kiosk posted at or above the busy-quarter trip count of drawdowns over those three months and the agreement carries an approved kiosk outage request over the same three months, the discount met is taken over the six months to that day and halved, so that an interrupted quarter is smoothed against the half year around it."
      shelf_sales: "The shelf value of the trips in the reading window is the discount met over that window grossed back at the share of shelf price printed against the market format, and the card processing charge acts on that shelf value rather than on the discount. Where the market format's subsidy model meets no share of shelf price, no shelf value is recovered and no card processing charge is passed through."
      paid_settlements_year: "Where the client settled at or above the prompt settlement count of market settlement invoices over the twelve months to the day the settlement is raised and the balance standing unsettled on the agreement is below the minimum funding lot printed against the market format, the prompt true-up share applies instead."
      unsettled_balance: "Where the client settled at or below the slow settlement count of market settlement invoices over those twelve months, or the balance standing unsettled on the agreement is at or above the minimum funding lot printed against the market format, the carrying true-up share applies."
      true_up_share_pct: "The true-up share is the standard true-up share. Where the client settled at or above the prompt settlement count of market settlement invoices over the twelve months to the day the settlement is raised and the balance standing unsettled on the agreement is below the minimum funding lot printed against the market format, the prompt true-up share applies instead. Where the client settled at or below the slow settlement count of market settlement invoices over those twelve months, or the balance standing unsettled on the agreement is at or above the minimum funding lot printed against the market format, the carrying true-up share applies."
      fresh_trips_q: "Where the fresh cabinet took at or above the fresh share floor of the kiosk trips over the three months to the day the settlement is raised and the market format carries a frozen unit, the printed rate is raised by the card uplift step."
      all_trips_q: "Where the fresh cabinet took below the fresh share floor of the kiosk trips over those three months and the market format carries a frozen unit, the printed rate is lowered by the card relief step."
      freezer_flag: "Where the fresh cabinet took at or above the fresh share floor of the kiosk trips over the three months to the day the settlement is raised and the market format carries a frozen unit, the printed rate is raised by the card uplift step."
      card_share_pct: "The card processing charge is passed through at the rate printed against the market format. Where the fresh cabinet took at or above the fresh share floor of the kiosk trips over the three months to the day the settlement is raised and the market format carries a frozen unit, the printed rate is raised by the card uplift step. Where the fresh cabinet took below the fresh share floor of the kiosk trips over those three months and the market format carries a frozen unit, the printed rate is lowered by the card relief step."
      planogram_requests_q: "Where the client had at or above the planogram change floor of planogram changes approved over the three months to the day the settlement is raised and the market format carries at or above the wide-range product count, the call-out charge printed against the market format is added twice over."
      range_sku: "Where the client had at or above the planogram change floor of planogram changes approved over those three months and the market format carries below the wide-range product count, the call-out charge printed against the market format is added once."
      call_out_usd: "No call-out charge is added for planogram work. Where the client had at or above the planogram change floor of planogram changes approved over the three months to the day the settlement is raised and the market format carries at or above the wide-range product count, the call-out charge printed against the market format is added twice over. Where the client had at or above the planogram change floor of planogram changes approved over those three months and the market format carries below the wide-range product count, the call-out charge printed against the market format is added once."
      fresh_trips_6m: "Where the fresh cabinet was shopped at or above the fresh-trip floor of times over the six months to the day the settlement is raised and the coolers were shopped at least once over those six months, the fresh handling charge is the call-out charge printed against the market format apportioned by the share those fresh cabinet trips take of the fresh and chilled trips together."
      chilled_trips_6m: "Where the fresh cabinet was shopped below the fresh-trip floor of times over those six months and the coolers were shopped at least once over those six months, the fresh handling charge is the flat fresh share of the call-out charge printed against the market format."
      fresh_handling_usd: "No fresh handling charge is made. Where the fresh cabinet was shopped at or above the fresh-trip floor of times over the six months to the day the settlement is raised and the coolers were shopped at least once over those six months, the fresh handling charge is the call-out charge printed against the market format apportioned by the share those fresh cabinet trips take of the fresh and chilled trips together. Where the fresh cabinet was shopped below the fresh-trip floor of times over those six months and the coolers were shopped at least once over those six months, the fresh handling charge is the flat fresh share of the call-out charge printed against the market format."
      true_up_usd: "The product settlement invoiced on a subsidy true-up basis is the client discount met at the kiosk over the reading window, taken at the true-up share, together with the card processing charge on the shelf value of those trips, the call-out charge for unscheduled planogram work, and the fresh handling charge."
      card_usd: "The shelf value of the trips in the reading window is the discount met over that window grossed back at the share of shelf price printed against the market format, and the card processing charge acts on that shelf value rather than on the discount."
      result: "The four amounts are each rounded to the nearest cent, a figure falling exactly on the half-cent going to the nearest even cent as they are taken and are then added, and the sum is rounded the same way; none of them acts on any of the others."
    factors:
      - id: reading_window_basis
        effect: method
        decides: window_subsidy
        bindings: [drawdowns_2m, drawdowns_q, drawdowns_6m, trips_q, outage_requests_q, window_subsidy]
        ladder:
          - when: "the kiosk posted at or above the busy-quarter trip count of drawdowns over the three months to the day the settlement is raised and the agreement carries no approved kiosk outage request over the same three months"
            method: "the discount met is taken over the two months to that day"
          - when: "the kiosk posted at or above the busy-quarter trip count of drawdowns over those three months and the agreement carries an approved kiosk outage request over the same three months"
            method: "the discount met is taken over the six months to that day and halved"
          - when: "otherwise"
            method: "the discount met is taken over the three months to that day"
        baseline:
          window_subsidy: "drawdowns_q"
        evidence: [history]
        cross_difficulty: null
      - id: true_up_share
        effect: parameter
        decides: true_up_share_pct
        bindings: [paid_settlements_year, unsettled_balance, true_up_share_pct]
        ladder:
          - when: "the client settled at or above the prompt settlement count of market settlement invoices over the twelve months to the day the settlement is raised and the balance standing unsettled on the agreement is below the minimum funding lot printed against the market format"
            value: "the prompt true-up share"
          - when: "the client settled at or below the slow settlement count of market settlement invoices over those twelve months, or the balance standing unsettled on the agreement is at or above the minimum funding lot printed against the market format"
            value: "the carrying true-up share"
          - when: "otherwise"
            value: "the standard true-up share"
        baseline:
          true_up_share_pct: "K('standard_true_up_share_pct')"
        evidence: [history]
        cross_difficulty: null
      - id: card_processing_share
        effect: parameter
        decides: card_share_pct
        bindings: [fresh_trips_q, all_trips_q, freezer_flag, card_share_pct]
        ladder:
          - when: "the fresh cabinet took at or above the fresh share floor of the kiosk trips over the three months to the day the settlement is raised and the market format carries a frozen unit"
            value: "the card processing rate printed against the market format raised by the card uplift step"
          - when: "the fresh cabinet took below the fresh share floor of the kiosk trips over those three months and the market format carries a frozen unit"
            value: "the card processing rate printed against the market format lowered by the card relief step"
          - when: "otherwise"
            value: "the card processing rate printed against the market format"
        baseline:
          card_share_pct: "P('card_processing_fee_pct')"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: planogram_call_out_units
        effect: parameter
