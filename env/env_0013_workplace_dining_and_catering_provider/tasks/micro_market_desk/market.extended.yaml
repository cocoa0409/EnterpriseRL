        ladder:
          - when: "at or above the several-credits count of credits stand on the agreement over the two months to the day the payment is taken and the balance standing unsettled on the agreement is below the minimum funding lot printed against the market format"
            value: "the partial credit share"
          - when: "at or above the several-credits count of credits stand on the agreement over those two months and the balance standing unsettled on the agreement is at or above the minimum funding lot printed against the market format"
            value: "the greater credit share"
