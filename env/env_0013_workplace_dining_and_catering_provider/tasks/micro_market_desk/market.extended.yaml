        ladder:
          - when: "the client had at or above the planogram change floor of planogram changes approved over the three months to the day the settlement is raised and the market format carries at or above the wide-range product count"
            value: "twice the call-out charge printed against the market format"
          - when: "the client had at or above the planogram change floor of planogram changes approved over those three months and the market format carries below the wide-range product count"
            value: "the call-out charge printed against the market format, once"
          - when: "otherwise"
