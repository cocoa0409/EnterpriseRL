        effect: method
        decides: cover_months
        bindings: [lot_expiry, funding_lot_count, cover_months]
        ladder:
          - when: "the market format keeps a funding lot drawable for at or beyond the long drawable life and the agreement carries at or above the repeat funding count of funding lots"
            method: "the cover runs to the whole of the drawable life"
          - when: "the market format keeps a funding lot drawable for below the long drawable life and the agreement carries at or above the repeat funding count of funding lots"
            method: "the cover runs to half the drawable life, rounded up to a whole month"
          - when: "otherwise"
            method: "the cover runs to the standard cover"
        baseline:
          cover_months: "K('standard_cover_months')"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: take_up_share
        effect: parameter
        decides: take_up_pct
        bindings: [drawn_year, suspension_y_take, take_up_pct]
        ladder:
          - when: "at or above the active-kiosk year amount has been drawn at the kiosk over the twelve months to the day the lot is worked out and no suspension request stands approved on the agreement over those twelve months"
            value: "the heavy take-up"
          - when: "at or above the active-kiosk year amount has been drawn at the kiosk over those twelve months and a suspension request stands approved on the agreement over them"
            value: "the light take-up"
          - when: "otherwise"
            value: "the standing take-up"
        baseline:
          take_up_pct: "K('standing_take_up_pct')"
        evidence: [history]
        cross_difficulty: null
      - id: contingency_share
        effect: parameter
        decides: contingency_pct
        bindings: [shrink_y, suspension_y_cont, contingency_pct]
        ladder:
          - when: "a suspension request stands approved on the agreement over the twelve months to the day the lot is worked out and a shrink adjustment stands on the agreement over those twelve months"
            value: "the low contingency"
          - when: "a suspension request stands approved on the agreement over those twelve months and no shrink adjustment stands on the agreement over them"
            value: "the high contingency"
          - when: "otherwise"
            value: "the standing contingency"
        baseline:
          contingency_pct: "K('standing_contingency_pct')"
        evidence: [history]
        cross_difficulty: null
      - id: drawable_offset_basis
        effect: method
        decides: offset_balance
        bindings: [funding_lot_count_offset, suspension_y_offset, offset_balance]
        ladder:
          - when: "the agreement carries at or above the repeat funding count of funding lots and a suspension request stands approved over the twelve months to the day the lot is worked out"
            method: "half of the funding still drawable is set against the cover need"
          - when: "the agreement carries below the repeat funding count of funding lots and a suspension request stands approved over those twelve months"
            method: "none of the funding still drawable is set against the cover need"
          - when: "otherwise"
            method: "the whole of the funding still drawable is set against the cover need"
        baseline:
          offset_balance: "drawable_balance"
        evidence: [history]
        cross_difficulty: null
      - id: kiosk_handling_step
        effect: parameter
        decides: handling_step_usd
        bindings: [drawn_year_handling, range_sku, handling_step_usd]
        ladder:
          - when: "at or above the active-kiosk year amount has been drawn at the kiosk over the twelve months to the day the lot is worked out and the market format carries at or above the wide-range product count of distinct products"
            value: "the call-out charge printed against the market format"
          - when: "at or above the active-kiosk year amount has been drawn at the kiosk over those twelve months and the market format carries below the wide-range product count of distinct products"
            value: "half the call-out charge printed against the market format"
          - when: "otherwise"
            value: "no handling step"
        baseline:
          handling_step_usd: "0.0"
        evidence: [history, tier_param]
        cross_difficulty: null
    baseline:
      rule: >-
        The lot a client pays in is the subsidy the cover period is expected to need, less the share of
        the funding still drawable that is set against it, plus the handling step. The expected need
        for one month is the badged headcount the site reports multiplied by the subsidy allowed for
        one employee for one month and by the take-up share; the cover need is that monthly figure
        multiplied by the cover months and then raised once by the contingency share, the contingency
        acting on the whole cover need rather than on the monthly figure; the drawable share is taken
        off the cover need, and the handling step is added to what is left. Each figure is rounded to the nearest cent, a figure falling exactly on the half-cent going to the nearest even cent as it is taken and the result is rounded the same way.
        The funding still drawable is what was paid in over the twelve months to the day the lot is
        worked out, less what has been drawn at the kiosk over those same twelve months, less what has
        been handed back to the client on a settlement, being the credits standing on the agreement
        that name no kiosk, and never below nothing. Where the lot so worked out falls below the
        minimum funding lot printed against the market format, no lot is taken and the client is asked
        to combine the amount into the next one. The cover period is the standard cover. The take-up
        share is the standing take-up. The contingency share is the standing contingency. The whole of
        the funding still drawable is set against the cover need. No handling step is added.
      params: [standard_cover_months, subsidy_per_head_per_month_usd, standing_take_up_pct, standing_contingency_pct, subsidy_funding_minimum_usd]
    inputs:
      history:
        - {table: market_ledger, aggregate: sum, field: amount_usd, within_months: 12, filters: {event_type: market_subsidy_funding_posted}}
        - {table: market_ledger, aggregate: sum, field: amount_usd, filters: {event_type: market_service_credit_issued}}
        - {table: market_ledger, aggregate: count, within_months: 12, filters: {event_type: market_subsidy_drawdown_posted}}
        - {table: market_service_intake, aggregate: count, within_months: 12, filters: {request_type: suspension_request, request_status: approved}}
      cross_category: []
