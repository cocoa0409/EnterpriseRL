      credits_count_2m: "Where at or above the several-credits count of credits stand on the agreement over the two months to the day the payment is taken and the balance standing unsettled on the agreement is below the minimum funding lot printed against the market format, the partial credit share is set against this settlement and the rest is left to the next."
