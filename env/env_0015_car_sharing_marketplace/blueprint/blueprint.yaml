name: env_0015_car_sharing_marketplace
company: Keyturn Mobility, Inc.

background: |
  Keyturn Mobility, Inc. runs Keyturn, a peer-to-peer car sharing marketplace on which private
  vehicle owners put their own cars to work and travellers book them by the hour, the day or the
  month, across roughly two hundred and forty metropolitan markets in the United States and
  Canada. Both sides of the marketplace are consumers, so the same support floor answers a host
  whose vehicle came back with a cracked bumper and a guest who wants to know why a refuelling
  line appeared on their card, and the two sides of one trip are frequently on the phone within
  an hour of each other. A member profile carries a name, a mobile number, an email, a driving
  licence and its expiry, a billing postal code, the date the profile was opened and a
  marketplace driving score, and the same profile serves whether the member rents, shares, or
  does both. Hosts open a Keyturn Vehicle Listing for each car they offer, and every listing
  sits in one of six value classes — Keyturn Economy Class Listing, Keyturn Standard Class
  Listing, Keyturn Premium Class Listing, Keyturn Luxury Class Listing, Keyturn Exotic Class
  Listing and Keyturn Commercial Van Class Listing — which follow the marketplace's own
  valuation of the vehicle and carry their own inspection intervals, photograph standards and
  price bands. Against each listing the host holds a Keyturn Host Protection Plan, written as
  one of the Keyturn Shield 90, Shield 85, Shield 80, Shield 75, Shield 70 or Shield 60 Host
  Plans, a ladder that trades the share of each trip the host keeps against the depth of the
  cover and the size of the deductible they carry. Guests book through a Keyturn Trip Booking,
  priced under the Keyturn Hourly, Daily, Weekend, Weekly, Monthly or Extended Stay Rate Plan
  according to how long they are keeping the car, and each booking accrues its own reserved
  hours, its own included miles and its own running balance. For each trip the guest also makes
  a Keyturn Guest Protection Plan election, choosing between Keyturn Declined Protection,
  Keyturn Minimum Protection, Keyturn Standard Protection, Keyturn Advantage Protection,
  Keyturn Premier Protection and Keyturn Business Traveler Protection, which decides what the
  guest would owe if the car came back damaged. Money owed to a host settles through a single
  Keyturn Host Payout Account, run on the Keyturn Standard, Weekly Batch, Express, Instant,
  Fleet Settlement or Reserve-Backed Settlement Payout Schedule, into which trip earnings,
  commissions, reserves, transfers and corrections are all booked as a running ledger. Two
  optional subscriptions sit alongside the core products: Keyturn Roadside Assistance, written
  as Keyturn Roadside Basic, Plus, Tow, EV, Fleet or Concierge Cover, and the Keyturn Vehicle
  Care Plan, written as the Keyturn Care Essentials, Routine, Complete, Turnaround, Fleet or
  Electric Plan, which keeps a working listing serviced between trips. Every trip leaves a
  trail of records behind it — reservation and fee lines, odometer and fuel readings at both
  handovers, mileage and refuelling settlements, late returns and refunds — and every loss
  leaves a claim record, an appraisal, a deductible and, eventually, a payment. The typical
  guest is a city dweller in their late twenties or thirties without a car of their own, three
  or four trips into their history, who books a weekend car every few months and has never read
  the protection wording closely. The typical host is a salaried owner with one financed car
  earning alongside their day job, though a growing minority run small fleets of five to thirty
  vehicles on commercial plates and treat the payout statement as a business account. Long-term
  guests are a real and growing segment, taking cars for a month or a season while they wait out
  a relocation or a repair, and they generate the longest and most tangled billing histories on
  the marketplace. Calls arrive from every point in the life of a trip, from a guest standing at
  a kerb whose remote unlock will not open the doors, to a host three weeks after a trip ended
  who has just opened a repair invoice, to a fleet operator who cannot see last month's
  settlement on their bank statement.

logs:
  verification_log_table: identity_verifications
  handoff_log_table: agent_handoffs

difficulties:
  - name: trip_booking_and_settlement_desk
    claim:
      categories: [trips]
      event_types: [trips_booking_created, trips_booking_confirmed, trips_trip_started, trips_trip_completed,
                    trips_booking_settled, trips_booking_cancelled, trips_mileage_allowance_granted,
                    trips_mileage_usage_recorded, trips_fuel_level_recorded, trips_reservation_charge_posted,
                    trips_extension_charge_posted, trips_mileage_overage_charged, trips_fuel_overage_charged,
                    trips_late_return_charged, trips_cancellation_fee_charged, trips_refund_issued]
    summary: >
      The callers here are guests at every point in the life of a Keyturn Trip Booking and the hosts
      on the other side of the same trip, and what makes a call hard is that the same question has six
      different answers depending on which rate plan the booking was priced under, how far through its
      lifecycle it has travelled, and what the trip has already accrued. A guest may ring while the
      booking is still requested and unconfirmed, while it is booked but the car has not been collected,
      mid-trip wanting the car for longer, on the day of return disputing the odometer, or weeks after
      settlement about a toll that has only just surfaced; the same caller may hold several bookings at
      once on different plans, one of them an Extended Stay booking whose mileage is metered quite
      differently from their weekend car. Settings that genuinely recur and genuinely complicate the
      judgement include a guest under the young-driver threshold on the first day of a reserved period
      that straddles their birthday, a booking whose vehicle was suspended by the marketplace after the
      booking was confirmed, a trip whose host and telematics odometer readings disagree, a return short
      of fuel on an electric vehicle where the refuelling rather than the recharging terms would be the
      easy mistake, an extension requested inside the lead time and approved after the decision window
      had closed, and a long booking whose weekly and monthly discounts interact.
      The records in play are the booking itself, which carries the rate plan, the status, the reserved
      and actual dates, the daily rate locked in at confirmation, the reserved hours, the unused included
      miles and the running balance; the priced lines raised against it; the mileage and fuel readings
      taken at each handover; and the extension request register, which holds what the guest asked for
      before any of it reaches the booking. The rules that govern them are layered: eligibility gates on
      licence validity and the host acceptance window in trips_booking_intake, portfolio and vehicle-state
      gates in trips_agg_concurrent_exposure, per-plan quantitative rules for the base rate and its
      discounts in trips_evt_reservation_pricing, for the mileage allowance and its consumption in
      trips_evt_mileage_allowance and trips_evt_mileage_overage, for the fuel shortfall in
      trips_evt_fuel_settlement, for lateness and its escalation in trips_evt_late_return, for the free
      window and the fee ladder in trips_cancellation, for extension pricing in trips_evt_extension, for
      reversals in trips_evt_refund, and for the order in which a trip is closed out and settled in
      trips_settlement; the natural order of the domain runs request, confirmation, collection, return,
      settlement, but that order is background to the domain rather than anything a task imposes.
      Most of what the desk does is agent service work — reading the booking and its lines, working out
      what the plan actually prices, posting the settlement lines a return produces, reversing a line
      raised in error — but a handful of steps can only be taken by the member themselves and must be
      handed to them: a guest cancelling their own confirmed booking, a guest asking to keep the vehicle
      longer, and a guest checking the vehicle out or back in are the guest's own acts on their own
      reservation, and the desk sets them up rather than performing them.
      Uncovered ground is real and the desk meets it regularly: no rule here decides what happens when a
      guest asks the marketplace to intervene in a personal dispute with the host, when a guest wants a
      trip repriced because the published price fell after their booking was confirmed, when a traffic
      citation arrives naming a driver the booking never declared, or when a guest asks for compensation
      for a journey they could not make because the vehicle would not start — in all of these the only
      correct route is a POLICY_NOT_COVERED handover to a human representative.
  - name: host_protection_and_claims_desk
    claim:
      categories: [hostplan]
      event_types: [hostplan_enrollment_opened, hostplan_enrollment_activated, hostplan_plan_changed,
                    hostplan_enrollment_suspended, hostplan_enrollment_reinstated, hostplan_enrollment_ended,
                    hostplan_claim_filed, hostplan_claim_appraised, hostplan_supplement_added,
                    hostplan_claim_denied, hostplan_claim_withdrawn, hostplan_deductible_charged,
                    hostplan_reimbursement_paid, hostplan_recovery_received]
    summary: >
      The callers are hosts who hold a Keyturn Host Protection Plan on one or more of their vehicles,
      ringing either because something has happened to a car or because they are trying to work out what
      would happen if it did. The setting varies enormously across the six Shield plans, since the plan a
      host holds decides both the share of each trip they keep and the deductible, the sub-limits and the
      benefits that would meet a loss, and the hardest calls come from hosts who hold different plans on
      different vehicles, or who changed plan between the day of the loss and the day they rang. The state
      of the enrolment matters as much as the plan — cover may be applied for, under review, active,
      suspended for an overdue inspection or an unpaid liability, lapsed, or cancelled — and the history
      matters too, since a host's accepted claims over a rolling year and the months an enrolment has gone
      claim-free both change what happens next. Settings that genuinely arise include a loss reported days
      after the trip ended, a repair invoice arriving after the appraisal has already been settled, a claim
      spanning two kinds of damage each with its own sub-limit, a total loss on a vehicle whose declared
      value and marketplace valuation differ, a host whose payout account is on hold while the claim is
      settled, and a deductible standing against a host while the guest found at fault has not yet paid.
      The records in play are the enrolment, which carries the plan, the state, the region, the declared
      value, the claim-free date and the balances owed to and by the host; the claim records, which carry
      the filing, the appraisal, any supplement, refusals, withdrawals, the deductible, the payment and any
      recovery, each tied to the trip the loss happened on; and the damage report register, which holds
      what the host lodged before a claim was ever opened. The governing rules run from eligibility and
      acceptance in hostplan_enrollment_eligibility, through the portfolio standing tests in
      hostplan_agg_portfolio_standing, the filing window and evidence minimum in hostplan_evt_claim_intake,
      the valuation route, sub-limits, total-loss threshold and supplement ceiling in hostplan_evt_appraisal,
      the deductible and its claim-free discount and waiver in hostplan_evt_deductible, the payment and
      recovery terms in hostplan_evt_reimbursement, refusal and appeal in hostplan_evt_claim_closure, plan
      moves in hostplan_plan_change, standing and suspension in hostplan_lifecycle, and the earnings share
      itself in hostplan_evt_earnings_share, each of them quoting different figures per plan.
      Agent service work covers reading the enrolment and its claim history, opening a claim from a
      complete damage report, recording an appraisal, raising or reversing a deductible and releasing a
      reimbursement; but a host ending cover on their own vehicle, withdrawing their own claim, or lodging
      the damage report and its evidence in the first place are the host's own acts and are handed to them
      rather than performed on their behalf.
      Genuinely uncovered ground includes a host asking the marketplace to pursue a guest for a loss it has
      already refused, a host wanting cover backdated to a trip that ran before the enrolment went active,
      a dispute about the marketplace's valuation of a vehicle written off as a total loss, and a claim for
      loss of earnings while a vehicle sat unrepaired beyond the benefit the plan provides — none of these
      is decidable under any rule here, and the correct route is a POLICY_NOT_COVERED handover.
  - name: guest_protection_desk
    claim:
      categories: [guestplan]
      event_types: [guestplan_election_created, guestplan_election_confirmed, guestplan_election_activated,
                    guestplan_election_completed, guestplan_election_expired, guestplan_election_voided,
                    guestplan_protection_fee_charged, guestplan_level_change_charged,
                    guestplan_secondary_driver_charged, guestplan_deductible_charged,
                    guestplan_deductible_waived, guestplan_protection_refunded]
    summary: >
      The callers are guests asking what their Keyturn Guest Protection Plan election actually covers,
      what it costs and what they now owe after something happened on a trip, and the difficulty is that
      the six levels differ not only in price and deductible but in how the fee is arrived at at all —
      some levels charge a flat daily amount, some a percentage of the trip price, and some the greater
      of the two — so two guests on the same car for the same days can owe quite different sums. The
      setting shifts with the state of the election, which may be quoted but never chosen, chosen but not
      yet running, active mid-trip, completed, voided or expired; with the trip beneath it, since cover
      begins only when the vehicle changes hands and ends when it comes back; and with the guest's own
      history, since losses settled against them over a rolling year can close a level to them for a
      period. Settings that genuinely recur include a guest who declined marketplace protection on the
      strength of their own motor policy without evidencing it, a guest who upgraded midway through a
      trip and then had a loss in the stretch covered by the old level, a trip on a vehicle whose value
      class the elected level excludes, a guest who added drivers beyond what the level approves, a young
      driver whose protection surcharge was never posted, and a deductible being paid in instalments while
      the guest disputes it.
      The records involved are the election itself, carrying the level, the state, the coverage days, the
      outstanding fee and deductible, the declared additional drivers and the guest's own insurer where
      they declined; the protection lines raised against it, each carrying its basis, the days it covers,
      the stretch of the trip it belongs to and the claim it settles; and the change request register,
      which holds what the guest asked for before any level actually moved. The rules that decide them are
      guestplan_election_eligibility for who may elect what and on which vehicles, guestplan_agg_claim_history
      for the rolling claim count and the day ceiling, guestplan_evt_fee_charging for the three charging
      bases and the floor, ceiling and surcharge that shape the fee, guestplan_level_change for what may be
      changed when and how the difference is prorated, guestplan_evt_deductible for what the guest owes on a
      loss and how it may be waived or paid in instalments, guestplan_evt_refund for what comes back,
      guestplan_lifecycle for when cover begins and ends, and guestplan_void for when an election covers
      nothing at all.
      Reading the election, working out the fee the level actually produces, posting a deductible a claim
      settlement has established, waiving one the finding of fault has overturned and refunding a fee line
      are agent service actions; but choosing a protection level in the first place, asking to move to a
      different level and declaring an additional driver are the guest's own decisions about their own
      cover and are handed to them.
      Uncovered ground the desk meets includes a guest asking the marketplace to bill their own insurer
      directly, a guest wanting cover applied to a trip that has already ended, a request to split a
      deductible between two guests who shared the driving, and a dispute about who was actually at the
      wheel when a loss occurred — none is decidable here, and the only correct route is a
      POLICY_NOT_COVERED handover.
  - name: host_payout_desk
    claim:
      categories: [payouts]
      event_types: [payouts_account_opened, payouts_account_verified, payouts_schedule_changed,
                    payouts_account_held, payouts_account_released, payouts_account_suspended,
                    payouts_account_closed, payouts_earning_posted, payouts_deduction_posted,
                    payouts_reserve_held, payouts_reserve_released, payouts_transfer_released,
                    payouts_transfer_returned, payouts_adjustment_posted]
    summary: >
      The callers are hosts who cannot find their money, from a first-time host whose earnings have not
      appeared three days after a trip began to a fleet operator reconciling a monthly settlement against
      a bank statement, and the difficulty is that the balance a host sees is the net of several quite
      different flows — earnings, commissions and protection deductions, routine and claim reserves,
      transfers, returns and corrections — each of which behaves differently on each of the six payout
      schedules. The state of the account changes everything: an account may be applied for, waiting on a
      deposit-details check, active, on hold against an open claim or a disputed chargeback, suspended
      after returned transfers, or closed, and money continues to arrive on a held account while none
      leaves it. Settings that genuinely arise include a new host whose first earnings are subject to the
      new-host reserve rather than the routine one, a host whose available balance looks healthy while
      almost all of it sits in reserve against a claim, a host who changed their deposit details last week
      and is inside the change lockout, a host whose earnings have passed the tax documentation threshold,
      a transfer that came back unpaid and took a fee with it, and a host who moved schedules mid-month
      and is reading last month's rhythm into this month's statement.
      The records in play are the payout account, carrying the schedule, the state, the deposit details,
      the free and reserved balances, the next sweep date, the tax documentation state and any ground
      currently stopping the money; the ledger, in which every earning, deduction, reserve, transfer,
      return and correction is booked with its own basis, its statement month and its bank reference; and
      the payout request register, which holds what a host asked to draw. The governing rules are
      payouts_account_opening for qualification and the deposit check, payouts_agg_multi_holding for the
      single-account rule, payouts_schedule_change for moving schedules and the lockouts that follow,
      payouts_evt_earnings for when an earning becomes payable and on what basis, payouts_evt_deductions
      for commissions, recoveries, negative balances and transfer fees, payouts_evt_reserve for routine,
      new-host and claim reserves and their release, payouts_evt_transfer for the sweep rhythm, minimums,
      ceilings and fees, payouts_evt_transfer_failure for returns and the suspension they can cause,
      payouts_holds for the grounds on which money is stopped, payouts_closure for closing an account and
      payouts_evt_adjustment for correcting an entry, each carrying its own per-schedule figures.
      Reading the account and its ledger, explaining what a balance is made of, posting a correcting entry
      inside the adjustment window, placing and releasing a hold and releasing a scheduled transfer are
      agent service work; but asking to be paid out on an on-request schedule, giving or changing the
      deposit details, and closing the payout account are the host's own acts over their own money and are
      handed to them rather than done for them.
      Uncovered ground includes a host asking for money to be sent to an account in someone else's name, a
      host wanting a payout advanced before the earning has become payable at all, a request to release a
      claim reserve while the claim is still open, and a dispute about a bank's own processing delay after
      the transfer has left — none of these can be decided under any rule here, and the correct route is a
      POLICY_NOT_COVERED handover.
  - name: vehicle_listing_desk
    claim:
      categories: [listings]
      event_types: [listings_vehicle_created, listings_vehicle_submitted, listings_vehicle_published,
                    listings_vehicle_snoozed, listings_vehicle_resumed, listings_vehicle_suspended,
                    listings_vehicle_reinstated, listings_vehicle_delisted, listings_price_updated,
                    listings_class_reassigned, listings_inspection_completed, listings_odometer_reported,
                    listings_defect_reported, listings_valuation_reassessed, listings_document_verified]
    summary: >
      The callers are hosts trying to get a vehicle onto the marketplace, to keep it there, or to
      understand why it has come off, and the difficulty is that the six value classes differ in almost
      every dimension that governs a listing — the value band, the age and odometer limits, the
      photograph standard, whether an inspection is needed before going live, the inspection interval in
      both miles and days, the price band, and how long a suspension may run before the listing is lost.
      The state of the listing shapes every answer, since a vehicle may be in draft, under review, live,
      snoozed by the host, suspended by the marketplace or delisted, and a host's other listings shape it
      too, because the class ceiling counts every listing that is not delisted and an unresolved safety
      suspension anywhere in the fleet stops the rest. Settings that genuinely recur include a financed
      vehicle whose lender consent was never verified, a vehicle whose registration expires during the
      review period, a vehicle whose fresh valuation drops it into a lower class while bookings already
      stand against it, a vehicle whose inspection interval has been overrun on miles but not on days, a
      guest-reported fault that turns out to be an open recall, and a host disputing an odometer reading
      that differs from the telematics figure by more than the class tolerance.
      The records in play are the listing itself, carrying the class, the state, the vehicle's identity
      and valuation, the price asked, the title and any lender, the registration and its expiry, the
      inspection due date and the miles left before it; the condition records, which hold completed
      inspections, odometer readings, reported faults, valuations and verified documents; and the review
      queue, which holds cases awaiting a reviewer. The rules that decide them are listings_onboarding for
      what a vehicle must satisfy to go live, listings_agg_host_fleet for the per-class ceiling and the
      fleet-wide safety test, listings_evt_inspection for the two-dimensional inspection clock and its
      grace, listings_evt_defect for what a reported fault sets running, listings_evt_valuation for
      revaluation and class moves, listings_evt_documents for expiry and verification, listings_price for
      the price band and movement limits, listings_availability for snoozing, and listings_enforcement for
      the grounds of suspension, the reinstatement window and delisting.
      Reviewing and publishing a listing, recording an inspection or a verified document, reassigning a
      class after a revaluation, suspending a vehicle on a stated ground and reinstating it once the
      ground is cleared are agent service work; but snoozing and resuming a listing, changing the price
      asked, and taking a vehicle off the marketplace for good are the host's own decisions about their
      own property and are handed to them.
      Uncovered ground includes a host asking to list a vehicle they do not own but have permission to
      use, a request to waive an inspection because the vehicle was serviced privately last week, a
      dispute about the marketplace's valuation where the host produces a dealer appraisal, and a request
      to transfer a listing and its trip history to another member's profile — none of these is decidable
      under any rule here, and the only correct route is a POLICY_NOT_COVERED handover.
