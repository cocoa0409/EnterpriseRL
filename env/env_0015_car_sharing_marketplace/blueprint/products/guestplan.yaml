category: guestplan
display_name: Keyturn Guest Protection Plan

binding:
  holding_table: guestplan_elections
  event_tables: [guestplan_charges]
  intake_tables: [guestplan_change_requests]
  status_field: status
  variant_field: protection_level_name
  quantity_fields:
    protection_fee_balance_due: protection_fee_due
    deductible_balance_due: guest_deductible

lifecycle:
  states: [quoted, elected, active, completed, voided, expired]
  transitions:
    - {from: quoted, to: elected, by: user, means: The guest chooses a protection level for the trip, which only the guest can do.}
    - {from: quoted, to: expired, by: system, means: The guest never chooses and the quote lapses when the trip starts.}
    - {from: quoted, to: voided, by: agent, means: The quote is cancelled before the guest ever elected anything.}
    - {from: elected, to: active, by: system, means: The trip starts and the protection begins to cover it.}
    - {from: elected, to: voided, by: agent, means: The election is cancelled before cover ever began.}
    - {from: active, to: completed, by: system, means: The trip ends and the protection has run its course.}
    - {from: active, to: voided, by: agent, means: Cover is cancelled mid-trip because the guest was never eligible for it.}

accounts:
  - key: protection_fee_due
    unit: USD
    meaning: Protection fee the guest owes on this election, raised by the daily fee and by level changes and cleared by refunds.
  - key: guest_deductible
    unit: USD
    meaning: The guest's own share of a loss on this trip, raised when a loss is settled against them and cleared when it is waived or paid.

parameter_schema:
  daily_protection_fee_amount: Protection fee for each day of the trip, in USD.
  protection_fee_percent_of_trip_price: Protection fee expressed as a percentage of the trip price.
  protection_fee_charging_basis: How the fee is arrived at, as one of daily_flat, percent_of_trip_price or greater_of_daily_and_percent.
  protection_fee_minimum_amount: Floor under the protection fee for one trip, in USD.
  protection_fee_maximum_amount: Ceiling on the protection fee for one trip, in USD.
  protection_fee_billing_point: When the fee falls due, as one of at_booking, at_trip_start or daily_in_arrears.
  minimum_charge_days: Shortest period the fee is charged for however short the trip, in whole days.
  maximum_trip_days_covered: Longest trip this level will cover, in whole days.
  guest_deductible_amount: The guest's share of each accepted loss, in USD.
  physical_damage_responsibility_amount: Ceiling on what the guest can be held responsible for on the vehicle itself, in USD.
  glass_responsibility_amount: Ceiling on the guest's responsibility for glass damage, in USD.
  tyres_responsibility_amount: Ceiling on the guest's responsibility for tyre and wheel damage, in USD.
  interior_responsibility_amount: Ceiling on the guest's responsibility for interior damage, in USD.
  towing_responsibility_amount: Ceiling on the guest's responsibility for towing and storage, in USD.
  liability_cover_amount: Third-party liability cover carried with this level, in USD.
  liability_cover_source: Where the liability cover comes from, as one of marketplace_policy, state_minimum or own_policy.
  personal_effects_cover_amount: Cover for the guest's own belongings taken in the vehicle, in USD.
  medical_payments_cover_amount: Cover for medical costs arising from a trip incident, in USD.
  loss_of_use_guest_share_percent: Share of the host's loss of use the guest bears, as a percentage.
  appraisal_fee_share_percent: Share of the appraisal cost the guest bears, as a percentage.
  roadside_included: Whether roadside assistance comes with the level (true/false switch).
  roadside_callout_allowance_count: Roadside callouts included for the trip.
  secondary_driver_fee_amount: Fee for each additional approved driver on the trip, in USD.
  secondary_driver_max_count: Additional drivers this level will approve on one trip.
  young_driver_protection_surcharge_percent: Surcharge on the protection fee for a driver under the young-driver threshold, as a percentage.
  minimum_driver_age_years: Youngest driver this level will cover, in whole years.
  minimum_driver_score: Lowest marketplace driver score this level will cover.
  excluded_vehicle_value_above_amount: Vehicle value above which this level will not cover the trip, in USD.
  excluded_value_classes: Listing value classes this level will not cover, as a list of value class names.
  commercial_trip_covered: Whether a trip taken for commercial carriage is covered (true/false switch).
  out_of_state_trip_covered: Whether a trip leaving the vehicle's home state is covered (true/false switch).
  cross_border_trip_covered: Whether a trip crossing an international border is covered (true/false switch).
  upgrade_allowed_before_trip_start: Whether the guest may move up a level before the trip starts (true/false switch).
  upgrade_allowed_mid_trip: Whether the guest may move up a level once the trip has started (true/false switch).
  downgrade_allowed_before_trip_start: Whether the guest may move down a level before the trip starts (true/false switch).
  downgrade_allowed_mid_trip: Whether the guest may move down a level once the trip has started (true/false switch).
  change_request_lead_hours: Hours before the trip starts by which a level change must be asked for.
  change_decision_window_hours: Hours the marketplace has to decide a level change request.
  upgrade_proration_basis: What an upgrade is priced on, as one of remaining_whole_days or whole_trip.
  downgrade_credit_percent: Percentage of the difference credited back on a downgrade.
  mid_trip_change_fee_amount: Fee for changing level once the trip has started, in USD.
  fee_refund_window_hours: Hours after election within which the protection fee is fully refundable.
  refund_proration_allowed: Whether an unused part of the fee is refundable on a shortened trip (true/false switch).
  cancellation_fee_refund_percent: Percentage of the protection fee returned when the trip is cancelled.
  deductible_waiver_available: Whether the deductible can be bought out on this level (true/false switch).
  deductible_waiver_fee_amount: Fee to buy out the deductible for the trip, in USD.
  deductible_installment_count: Instalments the deductible may be paid over.
  deductible_installment_interval_days: Calendar days between two deductible instalments.
  deductible_dispute_window_days: Calendar days after a deductible is raised within which the guest may dispute it.
  own_insurance_evidence_required: Whether the guest must evidence their own motor policy (true/false switch).
  own_insurance_minimum_liability_amount: Lowest third-party limit the guest's own policy must carry, in USD.
  international_licence_accepted: Whether a licence issued outside the country is accepted (true/false switch).
  claim_reporting_window_hours: Hours after an incident within which the guest must report it.
  claim_cooperation_days: Calendar days the guest has to answer questions on a claim against them.
  per_trip_claim_limit_count: Claims this level will meet on one trip.
  annual_claim_limit_count: Claims this level will meet for one guest in a rolling year.
  suspension_after_claims_count: Claims in a rolling year after which the guest may no longer elect this level.
  reinstatement_wait_days: Calendar days a suspended guest waits before electing this level again.

