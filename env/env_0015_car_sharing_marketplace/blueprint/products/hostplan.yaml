  - id: hostplan_evt_deductible
    subject: [hostplan_deductible_charged]
    rule: >-
      Every accepted loss carries the host's own share, and that share is the deductible of the plan in force on the day of the loss rather than the plan in force on the day the claim is settled.
      One deductible is raised for one loss however many kinds of damage the loss spans, and a loss that produces several repair invoices still carries one deductible.
      A host who has gone the plan's qualifying period without an accepted claim has the deductible reduced by the plan's claim-free discount, and a host who reaches the plan's waiver period has it waived entirely on the next accepted claim; the discount and the waiver do not stack, the waiver simply replacing the discount once it is earned.
      Where the guest was found at fault the deductible is still raised against the host and then recovered from the guest, so the host's balance shows the charge and the recovery separately rather than netting to nothing.
      No deductible is raised on a claim that is denied or withdrawn, and a deductible raised on a claim later denied is reversed in full.
      A deductible is raised only while the enrolment is in the active, suspended or lapsed state, since a cancelled enrolment settles nothing further.
    eligibility:
      - id: enrollment_still_settles
        applies_to: [hostplan_deductible_charged]
        kind: state
        condition: A deductible is raised only while the enrolment is in the active, suspended or lapsed state, since a cancelled enrolment settles nothing further.
        evidence_fields: [hostplan_enrollments.status, hostplan_enrollments.enrollment_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[hostplan_enrollments.enrollment_id]]
          action_bindings: {hostplan_enrollments.enrollment_id: enrollment_id}
        state_contract:
          field: hostplan_enrollments.status
          allowed: [active, suspended, lapsed]
    params:
      per_tier:
        Keyturn Shield 90 Host Plan: {host_deductible_amount: "=host_deductible_amount", claim_free_discount_percent: "=claim_free_discount_percent", claim_free_qualifying_months: "=claim_free_qualifying_months", deductible_waiver_after_claim_free_months: "=deductible_waiver_after_claim_free_months"}
        Keyturn Shield 85 Host Plan: {host_deductible_amount: "=host_deductible_amount", claim_free_discount_percent: "=claim_free_discount_percent", claim_free_qualifying_months: "=claim_free_qualifying_months", deductible_waiver_after_claim_free_months: "=deductible_waiver_after_claim_free_months"}
        Keyturn Shield 80 Host Plan: {host_deductible_amount: "=host_deductible_amount", claim_free_discount_percent: "=claim_free_discount_percent", claim_free_qualifying_months: "=claim_free_qualifying_months", deductible_waiver_after_claim_free_months: "=deductible_waiver_after_claim_free_months"}
        Keyturn Shield 75 Host Plan: {host_deductible_amount: "=host_deductible_amount", claim_free_discount_percent: "=claim_free_discount_percent", claim_free_qualifying_months: "=claim_free_qualifying_months", deductible_waiver_after_claim_free_months: "=deductible_waiver_after_claim_free_months"}
        Keyturn Shield 70 Host Plan: {host_deductible_amount: "=host_deductible_amount", claim_free_discount_percent: "=claim_free_discount_percent", claim_free_qualifying_months: "=claim_free_qualifying_months", deductible_waiver_after_claim_free_months: "=deductible_waiver_after_claim_free_months"}
        Keyturn Shield 60 Host Plan: {host_deductible_amount: "=host_deductible_amount", claim_free_discount_percent: "=claim_free_discount_percent", claim_free_qualifying_months: "=claim_free_qualifying_months", deductible_waiver_after_claim_free_months: "=deductible_waiver_after_claim_free_months"}
    formula:
      when: liability_finding != "no_fault"
      amount_delta: round(host_deductible_amount * (1 - claim_free_discount_percent / 100), 2)
    measures: [hostplan_msr_claim_free_months]
  - id: hostplan_evt_reimbursement
    subject: [hostplan_reimbursement_paid, hostplan_recovery_received]
    rule: >-
      Money accepted on a claim reaches the host through their payout account and never by any other route, and it is released within the plan's payment period counted in business days from the day the claim was accepted.
      A claim that has already been paid in full is not paid again, so where a payment record already stands against the same accepted claim and that payment was not itself reversed, the request is a duplicate and no further money moves.
      Part payments are allowed where a claim settles in stages, and several part payments against one claim are allowed as long as their total stays inside what was accepted; each carries its own date so that two part payments of the same amount stay separable.
      Money recovered from a guest or a third party clears the host's liability first and only then reduces what the marketplace has paid out, and the marketplace pursues recovery for the plan's pursuit period before closing it whatever the prospects.
      Where the host's payout account is on hold no claim money is released, since the hold exists precisely to stop money leaving while something is unresolved, and the host is told which hold is blocking it rather than simply that payment is delayed.
      A recovery received after the claim is closed is still applied to the host's liability, because a closed claim does not extinguish a debt already recovered.
    eligibility:
      - id: reimbursement_not_already_paid
        applies_to: [hostplan_reimbursement_paid]
        kind: dedup
        condition: A claim that has already been paid in full is not paid again, so where a payment record already stands against the same accepted claim and that payment was not itself reversed, the request is a duplicate and no further money moves.
        evidence_fields: [hostplan_claims.source_claim_id, hostplan_claims.event_type, hostplan_claims.amount_delta]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[hostplan_claims.source_claim_id]]
          action_bindings: {hostplan_claims.source_claim_id: source_claim_id}
        dedup_contract:
          table: hostplan_claims
          mode: separate_record
          object_bindings: {source_claim_id: source_claim_id}
          duplicate_filters: {event_type: [hostplan_reimbursement_paid]}
          distinct_fields: [claim_date, amount_delta, settlement_reference]
      - id: payout_account_not_on_hold
        applies_to: [hostplan_reimbursement_paid]
        kind: state
        condition: Where the host's payout account is on hold no claim money is released, since the hold exists precisely to stop money leaving while something is unresolved, and the host is told which hold is blocking it rather than simply that payment is delayed.
        evidence_fields: [payouts_accounts.status, payouts_accounts.customer_id, payouts_accounts.payout_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[payouts_accounts.payout_account_id]]
          action_bindings: {payouts_accounts.payout_account_id: payout_account_id}
        state_contract:
          field: payouts_accounts.status
          allowed: [active]
    params:
      per_tier:
        Keyturn Shield 90 Host Plan: {reimbursement_payment_days: "=reimbursement_payment_days", recovery_pursuit_days: "=recovery_pursuit_days"}
        Keyturn Shield 85 Host Plan: {reimbursement_payment_days: "=reimbursement_payment_days", recovery_pursuit_days: "=recovery_pursuit_days"}
        Keyturn Shield 80 Host Plan: {reimbursement_payment_days: "=reimbursement_payment_days", recovery_pursuit_days: "=recovery_pursuit_days"}
        Keyturn Shield 75 Host Plan: {reimbursement_payment_days: "=reimbursement_payment_days", recovery_pursuit_days: "=recovery_pursuit_days"}
        Keyturn Shield 70 Host Plan: {reimbursement_payment_days: "=reimbursement_payment_days", recovery_pursuit_days: "=recovery_pursuit_days"}
        Keyturn Shield 60 Host Plan: {reimbursement_payment_days: "=reimbursement_payment_days", recovery_pursuit_days: "=recovery_pursuit_days"}
  - id: hostplan_evt_claim_closure
    subject: [hostplan_claim_denied, hostplan_claim_withdrawn]
    rule: >-
      A claim is refused where the loss falls outside the plan's cover, where the evidence never reached the plan's minimum, where the trip the loss is attributed to did not run, or where the damage was already recorded before the trip began, and the ground of refusal is recorded so that the host can answer it.
      A refused claim may be appealed inside the plan's appeal window, counted in whole calendar days from the day the refusal is recorded, and each plan allows only its own number of appeals on one claim; an appeal beyond that number is not taken, however new the evidence looks.
      An appeal is decided on evidence that existed at the time of the loss, and photographs taken after a repair has begun are not evidence of the state the vehicle came back in.
      A host may withdraw their own claim at any time before it is paid, and a withdrawn claim is not counted toward the host's accepted claim count for standing purposes; a refused claim is not counted either, since only accepted claims bear on standing.
      Refusal and withdrawal both release any earnings held back against the claim, and the release happens on the day the claim closes rather than at the next statement.
      A claim closed by refusal or withdrawal cannot be reopened; a host who wants it looked at again files an appeal inside the window or, once the window has run, nothing further can be done under the plan.
    eligibility:
      - id: appeal_window
        applies_to: [hostplan_claim_denied]
        kind: time
        condition: A refused claim may be appealed inside the plan's appeal window, counted in whole calendar days from the day the refusal is recorded, and each plan allows only its own number of appeals on one claim; an appeal beyond that number is not taken, however new the evidence looks.
        evidence_fields: [hostplan_claims.claim_date, hostplan_claims.claim_id, hostplan_claims.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[hostplan_claims.claim_id]]
          action_bindings: {hostplan_claims.claim_id: source_claim_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the refusal is recorded
          anchor_source: hostplan_claims.claim_date
          relation: not_after
          duration_source: params.appeal_window_days
          unit: calendar_days
          counting_rule: counted in whole calendar days from the day the refusal is recorded
          boundary: inclusive
    params:
      per_tier:
        Keyturn Shield 90 Host Plan: {appeal_window_days: "=appeal_window_days", appeal_max_count: "=appeal_max_count", liability_finding_review_days: "=liability_finding_review_days"}
        Keyturn Shield 85 Host Plan: {appeal_window_days: "=appeal_window_days", appeal_max_count: "=appeal_max_count", liability_finding_review_days: "=liability_finding_review_days"}
        Keyturn Shield 80 Host Plan: {appeal_window_days: "=appeal_window_days", appeal_max_count: "=appeal_max_count", liability_finding_review_days: "=liability_finding_review_days"}
        Keyturn Shield 75 Host Plan: {appeal_window_days: "=appeal_window_days", appeal_max_count: "=appeal_max_count", liability_finding_review_days: "=liability_finding_review_days"}
        Keyturn Shield 70 Host Plan: {appeal_window_days: "=appeal_window_days", appeal_max_count: "=appeal_max_count", liability_finding_review_days: "=liability_finding_review_days"}
        Keyturn Shield 60 Host Plan: {appeal_window_days: "=appeal_window_days", appeal_max_count: "=appeal_max_count", liability_finding_review_days: "=liability_finding_review_days"}
  - id: hostplan_evt_earnings_share
    subject: [hostplan_enrollment_activated, hostplan_claim_appraised]
    rule: >-
      The plan a host holds decides what the host keeps of every trip on that vehicle, and the share is applied to the trip price before any overage or fee the guest also pays is shared.
      Better cover is bought with a smaller share, so a host moving to a plan with more protection keeps less of each trip, and the marketplace never offers both the larger share and the larger cover.
      Where a plan carries a trip fee offset the host is credited that share of the marketplace trip fee as well, posted to the payout account as its own entry rather than folded into the trip earning.
      Where the same vehicle is covered by an active Keyturn Roadside subscription as well as a plan that already includes roadside assistance, the roadside callouts included in the protection plan are used first and the subscription's own allowance is only drawn on once they are exhausted.
      A share is never applied retrospectively, so a plan change that takes effect mid-month leaves trips before the effective date on the old share and trips after it on the new one.
    eligibility: []
    params:
      per_tier:
        Keyturn Shield 90 Host Plan: {host_earnings_share_percent: "=host_earnings_share_percent", trip_fee_offset_percent: "=trip_fee_offset_percent", roadside_included: "=roadside_included", roadside_callout_allowance_count: "=roadside_callout_allowance_count"}
        Keyturn Shield 85 Host Plan: {host_earnings_share_percent: "=host_earnings_share_percent", trip_fee_offset_percent: "=trip_fee_offset_percent", roadside_included: "=roadside_included", roadside_callout_allowance_count: "=roadside_callout_allowance_count"}
        Keyturn Shield 80 Host Plan: {host_earnings_share_percent: "=host_earnings_share_percent", trip_fee_offset_percent: "=trip_fee_offset_percent", roadside_included: "=roadside_included", roadside_callout_allowance_count: "=roadside_callout_allowance_count"}
        Keyturn Shield 75 Host Plan: {host_earnings_share_percent: "=host_earnings_share_percent", trip_fee_offset_percent: "=trip_fee_offset_percent", roadside_included: "=roadside_included", roadside_callout_allowance_count: "=roadside_callout_allowance_count"}
        Keyturn Shield 70 Host Plan: {host_earnings_share_percent: "=host_earnings_share_percent", trip_fee_offset_percent: "=trip_fee_offset_percent", roadside_included: "=roadside_included", roadside_callout_allowance_count: "=roadside_callout_allowance_count"}
        Keyturn Shield 60 Host Plan: {host_earnings_share_percent: "=host_earnings_share_percent", trip_fee_offset_percent: "=trip_fee_offset_percent", roadside_included: "=roadside_included", roadside_callout_allowance_count: "=roadside_callout_allowance_count"}
