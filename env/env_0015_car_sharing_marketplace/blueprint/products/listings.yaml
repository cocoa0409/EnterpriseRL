        Keyturn Exotic Class Listing: {min_market_value_amount: "=min_market_value_amount", max_market_value_amount: "=max_market_value_amount", max_vehicle_age_years: "=max_vehicle_age_years", max_odometer_miles: "=max_odometer_miles", min_seat_count: "=min_seat_count", max_seat_count: "=max_seat_count", photo_minimum_count: "=photo_minimum_count", exterior_photo_angles_required: "=exterior_photo_angles_required", interior_photo_count_required: "=interior_photo_count_required", photo_resolution_minimum_pixels: "=photo_resolution_minimum_pixels", inspection_required_before_listing: "=inspection_required_before_listing", listing_review_days: "=listing_review_days", listing_activation_fee_amount: "=listing_activation_fee_amount", lienholder_consent_required: "=lienholder_consent_required", out_of_state_registration_allowed: "=out_of_state_registration_allowed", commercial_plate_allowed: "=commercial_plate_allowed"}
        Keyturn Commercial Van Class Listing: {min_market_value_amount: "=min_market_value_amount", max_market_value_amount: "=max_market_value_amount", max_vehicle_age_years: "=max_vehicle_age_years", max_odometer_miles: "=max_odometer_miles", min_seat_count: "=min_seat_count", max_seat_count: "=max_seat_count", photo_minimum_count: "=photo_minimum_count", exterior_photo_angles_required: "=exterior_photo_angles_required", interior_photo_count_required: "=interior_photo_count_required", photo_resolution_minimum_pixels: "=photo_resolution_minimum_pixels", inspection_required_before_listing: "=inspection_required_before_listing", listing_review_days: "=listing_review_days", listing_activation_fee_amount: "=listing_activation_fee_amount", lienholder_consent_required: "=lienholder_consent_required", out_of_state_registration_allowed: "=out_of_state_registration_allowed", commercial_plate_allowed: "=commercial_plate_allowed"}
  - id: listings_evt_inspection
    subject: [listings_inspection_completed, listings_odometer_reported]
    rule: >-
      Every live vehicle carries an inspection clock that runs on two dimensions at once, miles and days, and whichever falls due first is the one that governs.
      A completed inspection grants the class's mileage interval afresh and sets the next due date the class's day interval ahead, counted in whole calendar days from the day of the inspection.
      Odometer readings consume the interval as they are recorded, whether they come from a trip handover, from telematics or from the host's own periodic reading, and the host must report a reading at least once in the class's reporting interval even where the vehicle has taken no trips.
      A telematics reading is authoritative where one exists; a host reading standing more than the class's variance tolerance away from the telematics figure is queried rather than recorded, and the listing is not suspended while the query is open.
      A vehicle past its interval may continue to take trips through the class's mileage and day grace, and is suspended once both the interval and the grace have been overrun; the grace is not a second interval and cannot be granted twice.
      A failed inspection suspends the listing at once whatever the grace says, and the vehicle returns only after a re-inspection passes, for which the class's re-inspection fee is charged.
      Records are written only while the listing is in the listed, snoozed or suspended state, since a draft vehicle has no clock running and a delisted one has none left.
    eligibility:
      - id: inspection_clock_only_while_listed
        applies_to: [listings_inspection_completed, listings_odometer_reported]
        kind: state
        condition: Records are written only while the listing is in the listed, snoozed or suspended state, since a draft vehicle has no clock running and a delisted one has none left.
        evidence_fields: [listings_vehicles.status, listings_vehicles.vehicle_id, listings_vehicles.miles_to_next_inspection]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[listings_vehicles.vehicle_id]]
          action_bindings: {listings_vehicles.vehicle_id: vehicle_id}
        state_contract:
          field: listings_vehicles.status
          allowed: [listed, snoozed, suspended]
    params:
      per_tier:
        Keyturn Economy Class Listing: {inspection_interval_miles: "=inspection_interval_miles", inspection_interval_days: "=inspection_interval_days", inspection_grace_miles: "=inspection_grace_miles", inspection_grace_days: "=inspection_grace_days", inspection_fee_amount: "=inspection_fee_amount", reinspection_fee_amount: "=reinspection_fee_amount", odometer_report_interval_days: "=odometer_report_interval_days", odometer_variance_tolerance_miles: "=odometer_variance_tolerance_miles", inspection_channel_allowed: "=inspection_channel_allowed"}
        Keyturn Standard Class Listing: {inspection_interval_miles: "=inspection_interval_miles", inspection_interval_days: "=inspection_interval_days", inspection_grace_miles: "=inspection_grace_miles", inspection_grace_days: "=inspection_grace_days", inspection_fee_amount: "=inspection_fee_amount", reinspection_fee_amount: "=reinspection_fee_amount", odometer_report_interval_days: "=odometer_report_interval_days", odometer_variance_tolerance_miles: "=odometer_variance_tolerance_miles", inspection_channel_allowed: "=inspection_channel_allowed"}
        Keyturn Premium Class Listing: {inspection_interval_miles: "=inspection_interval_miles", inspection_interval_days: "=inspection_interval_days", inspection_grace_miles: "=inspection_grace_miles", inspection_grace_days: "=inspection_grace_days", inspection_fee_amount: "=inspection_fee_amount", reinspection_fee_amount: "=reinspection_fee_amount", odometer_report_interval_days: "=odometer_report_interval_days", odometer_variance_tolerance_miles: "=odometer_variance_tolerance_miles", inspection_channel_allowed: "=inspection_channel_allowed"}
        Keyturn Luxury Class Listing: {inspection_interval_miles: "=inspection_interval_miles", inspection_interval_days: "=inspection_interval_days", inspection_grace_miles: "=inspection_grace_miles", inspection_grace_days: "=inspection_grace_days", inspection_fee_amount: "=inspection_fee_amount", reinspection_fee_amount: "=reinspection_fee_amount", odometer_report_interval_days: "=odometer_report_interval_days", odometer_variance_tolerance_miles: "=odometer_variance_tolerance_miles", inspection_channel_allowed: "=inspection_channel_allowed"}
        Keyturn Exotic Class Listing: {inspection_interval_miles: "=inspection_interval_miles", inspection_interval_days: "=inspection_interval_days", inspection_grace_miles: "=inspection_grace_miles", inspection_grace_days: "=inspection_grace_days", inspection_fee_amount: "=inspection_fee_amount", reinspection_fee_amount: "=reinspection_fee_amount", odometer_report_interval_days: "=odometer_report_interval_days", odometer_variance_tolerance_miles: "=odometer_variance_tolerance_miles", inspection_channel_allowed: "=inspection_channel_allowed"}
        Keyturn Commercial Van Class Listing: {inspection_interval_miles: "=inspection_interval_miles", inspection_interval_days: "=inspection_interval_days", inspection_grace_miles: "=inspection_grace_miles", inspection_grace_days: "=inspection_grace_days", inspection_fee_amount: "=inspection_fee_amount", reinspection_fee_amount: "=reinspection_fee_amount", odometer_report_interval_days: "=odometer_report_interval_days", odometer_variance_tolerance_miles: "=odometer_variance_tolerance_miles", inspection_channel_allowed: "=inspection_channel_allowed"}
    formula:
      when: inspection_outcome == "passed"
      miles_delta: inspection_interval_miles
    measures: [listings_msr_miles_since_inspection]
  - id: listings_evt_defect
    subject: [listings_defect_reported]
    rule: >-
      A fault reported on a vehicle is recorded against the listing whoever reported it, and a guest's report carries the same weight as a workshop's for the purpose of opening the record.
      What the report does next depends on the fault. A safety fault gives the host the class's safety grace in whole elapsed hours counted from the report, after which the listing is suspended until the fault is put right. An ordinary fault gives the host the class's rectification period in whole calendar days.
      An open safety recall suspends the listing at once with no grace at all, and the vehicle returns only when a recall clearance document has been verified; the host's word that the work has been done is not a clearance.
      Putting a fault right is evidenced by a fresh inspection record, not by the host marking it resolved, and a listing whose fault is still open at the end of its period is suspended rather than warned again.
      A vehicle with more than the recorded number of faults over the rolling twelve months goes to a compliance review however promptly each one was put right, because a pattern of faults is itself a finding.
      A fault reported on a trip does not by itself make the guest liable for it, and liability is settled under the protection rules rather than by the fault record.
    eligibility:
      - id: defect_recorded_while_active_listing
        applies_to: [listings_defect_reported]
        kind: state
        condition: A fault reported on a vehicle is recorded against the listing whoever reported it, and a guest's report carries the same weight as a workshop's for the purpose of opening the record.
        evidence_fields: [listings_vehicles.status, listings_vehicles.vehicle_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[listings_vehicles.vehicle_id]]
          action_bindings: {listings_vehicles.vehicle_id: vehicle_id}
        state_contract:
          field: listings_vehicles.status
          allowed: [pending_review, listed, snoozed, suspended]
    params:
      defect_count_before_compliance_review: 4
      per_tier:
        Keyturn Economy Class Listing: {defect_rectification_days: "=defect_rectification_days", recall_rectification_days: "=recall_rectification_days", safety_defect_grace_hours: "=safety_defect_grace_hours"}
        Keyturn Standard Class Listing: {defect_rectification_days: "=defect_rectification_days", recall_rectification_days: "=recall_rectification_days", safety_defect_grace_hours: "=safety_defect_grace_hours"}
        Keyturn Premium Class Listing: {defect_rectification_days: "=defect_rectification_days", recall_rectification_days: "=recall_rectification_days", safety_defect_grace_hours: "=safety_defect_grace_hours"}
        Keyturn Luxury Class Listing: {defect_rectification_days: "=defect_rectification_days", recall_rectification_days: "=recall_rectification_days", safety_defect_grace_hours: "=safety_defect_grace_hours"}
        Keyturn Exotic Class Listing: {defect_rectification_days: "=defect_rectification_days", recall_rectification_days: "=recall_rectification_days", safety_defect_grace_hours: "=safety_defect_grace_hours"}
        Keyturn Commercial Van Class Listing: {defect_rectification_days: "=defect_rectification_days", recall_rectification_days: "=recall_rectification_days", safety_defect_grace_hours: "=safety_defect_grace_hours"}
    measures: [listings_msr_defects_12m]
  - id: listings_evt_valuation
    subject: [listings_valuation_reassessed, listings_class_reassigned]
    rule: >-
      The marketplace values every live vehicle again at the class's refresh interval, counted in whole calendar days from the date of the last valuation, and the valuation it arrives at governs the class the vehicle sits in.
      Where the fresh valuation puts the vehicle outside the band of the class it is listed in, the listing is moved into the class the valuation names, and the move takes effect on the date the valuation is recorded rather than on the next trip.
      A host who disagrees puts the vehicle to a value class review, and the review takes the class's review period in business days; the vehicle stays in its existing class while the review runs, so trips already booked are unaffected.
      A host's own declared value is accepted where it sits inside the class's tolerance of the marketplace valuation, and where it sits outside, the marketplace valuation governs and the host is told what the vehicle has been valued at.
      Moving up a class requires the settled trip count the target class sets, so a vehicle is not lifted into a higher class on valuation alone; moving down a class carries no such requirement, because a vehicle that has lost value must be priced and protected accordingly.
      A class change moves the price floor and ceiling with it, and a daily price outside the new class's band is brought to the nearer boundary rather than left outside it.
    eligibility:
      - id: valuation_refresh_due
        applies_to: [listings_valuation_reassessed]
        kind: time
        condition: The marketplace values every live vehicle again at the class's refresh interval, counted in whole calendar days from the date of the last valuation, and the valuation it arrives at governs the class the vehicle sits in.
        evidence_fields: [listings_inspections.record_date, listings_inspections.inspection_id, listings_vehicles.vehicle_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[listings_vehicles.vehicle_id]]
          action_bindings: {listings_vehicles.vehicle_id: vehicle_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the class's refresh interval
          anchor_source: listings_inspections.record_date
          relation: not_before
          duration_source: params.valuation_refresh_days
          unit: calendar_days
          counting_rule: counted in whole calendar days from the date of the last valuation
          boundary: inclusive
