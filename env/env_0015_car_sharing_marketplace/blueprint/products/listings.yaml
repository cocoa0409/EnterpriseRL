  - id: listings_availability
    subject: [listings_vehicle_snoozed, listings_vehicle_resumed]
    rule: >-
      A host who cannot offer the vehicle for a while snoozes the listing rather than delisting it, which keeps the listing, its history and its reviews while taking it off the calendar.
      One stretch of snoozing runs no longer than the class allows, counted in whole calendar days from the day the listing was snoozed, and a listing still snoozed at the end of that stretch is resumed or delisted rather than left in between.
      A listing may be snoozed no more times than the class allows over a rolling twelve months, counting stretches rather than days, so a host who snoozes repeatedly for short periods reaches the ceiling as quickly as one who snoozes twice for long ones.
      Snoozing never touches a booking already confirmed, and a host who cannot honour a confirmed booking cancels it and bears the cancellation consequences rather than snoozing out of it.
      The inspection clock keeps running while a listing is snoozed, so a vehicle snoozed past its interval comes back suspended rather than live.
      Only the host snoozes and resumes their own listing, since the vehicle is theirs to offer or withhold.
    eligibility:
      - id: snooze_is_the_hosts_own_act
        applies_to: [listings_vehicle_snoozed, listings_vehicle_resumed]
        kind: caller_fact
        condition: Only the host snoozes and resumes their own listing, since the vehicle is theirs to offer or withhold.
        evidence_fields: [listings_vehicles.customer_id, listings_vehicles.vehicle_id, listings_vehicles.status]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys: [[listings_vehicles.vehicle_id]]
          action_bindings: {listings_vehicles.vehicle_id: vehicle_id}
    params:
      per_tier:
        Keyturn Economy Class Listing: {snooze_max_days: "=snooze_max_days", snooze_count_per_year: "=snooze_count_per_year"}
        Keyturn Standard Class Listing: {snooze_max_days: "=snooze_max_days", snooze_count_per_year: "=snooze_count_per_year"}
        Keyturn Premium Class Listing: {snooze_max_days: "=snooze_max_days", snooze_count_per_year: "=snooze_count_per_year"}
        Keyturn Luxury Class Listing: {snooze_max_days: "=snooze_max_days", snooze_count_per_year: "=snooze_count_per_year"}
        Keyturn Exotic Class Listing: {snooze_max_days: "=snooze_max_days", snooze_count_per_year: "=snooze_count_per_year"}
        Keyturn Commercial Van Class Listing: {snooze_max_days: "=snooze_max_days", snooze_count_per_year: "=snooze_count_per_year"}
  - id: listings_enforcement
    subject: [listings_vehicle_suspended, listings_vehicle_reinstated, listings_vehicle_delisted]
    rule: >-
      A listing is suspended for a stated ground and never without one, the grounds being an overdue inspection, an expired registration, a safety defect, an open recall, a valuation outside the class band, a policy breach and the host's own request.
      A suspension takes the vehicle off the calendar at once, and where the ground is a safety defect, an open recall or an expired registration it also ends the bookings already confirmed on that vehicle, the guests being treated as cancelled on by the marketplace rather than by the host.
      A suspended listing may be put back inside the class's reinstatement window, counted in whole calendar days from the day of suspension, once the ground has been put right and evidenced; reinstatement is reviewed within the class's review period in business days.
      The host may appeal a suspension inside the class's appeal period, and an appeal does not put the vehicle back on the calendar while it is decided, because the ground of suspension stands until it is overturned.
      A listing taken down for good is delisted on the class's notice, and delisting ends the protection enrolment on that vehicle as well, since protection follows the listing and does not outlive it.
      A listing whose reinstatement window has passed is delisted rather than left suspended, and the host who wants the vehicle back lists it afresh and is reviewed as a new listing.
    eligibility:
      - id: suspension_ground_recorded
        applies_to: [listings_vehicle_suspended]
        kind: state
        condition: A listing is suspended for a stated ground and never without one, the grounds being an overdue inspection, an expired registration, a safety defect, an open recall, a valuation outside the class band, a policy breach and the host's own request.
        evidence_fields: [listings_vehicles.status, listings_vehicles.suspension_reason, listings_vehicles.vehicle_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[listings_vehicles.vehicle_id]]
          action_bindings: {listings_vehicles.vehicle_id: vehicle_id}
        state_contract:
          field: listings_vehicles.status
          allowed: [pending_review, listed, snoozed, suspended]
      - id: reinstatement_window
        applies_to: [listings_vehicle_reinstated]
        kind: time
        condition: A suspended listing may be put back inside the class's reinstatement window, counted in whole calendar days from the day of suspension, once the ground has been put right and evidenced; reinstatement is reviewed within the class's review period in business days.
        evidence_fields: [listings_vehicles.delisted_date, listings_vehicles.vehicle_id, listings_vehicles.suspension_reason]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[listings_vehicles.vehicle_id]]
          action_bindings: {listings_vehicles.vehicle_id: vehicle_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the day of suspension
          anchor_source: listings_vehicles.delisted_date
          relation: not_after
          duration_source: params.reinstatement_window_days
          unit: calendar_days
          counting_rule: counted in whole calendar days from the day of suspension
          boundary: inclusive
    params:
      per_tier:
        Keyturn Economy Class Listing: {reinstatement_window_days: "=reinstatement_window_days", reinstatement_review_days: "=reinstatement_review_days", suspension_appeal_days: "=suspension_appeal_days", delist_notice_days: "=delist_notice_days"}
        Keyturn Standard Class Listing: {reinstatement_window_days: "=reinstatement_window_days", reinstatement_review_days: "=reinstatement_review_days", suspension_appeal_days: "=suspension_appeal_days", delist_notice_days: "=delist_notice_days"}
        Keyturn Premium Class Listing: {reinstatement_window_days: "=reinstatement_window_days", reinstatement_review_days: "=reinstatement_review_days", suspension_appeal_days: "=suspension_appeal_days", delist_notice_days: "=delist_notice_days"}
        Keyturn Luxury Class Listing: {reinstatement_window_days: "=reinstatement_window_days", reinstatement_review_days: "=reinstatement_review_days", suspension_appeal_days: "=suspension_appeal_days", delist_notice_days: "=delist_notice_days"}
        Keyturn Exotic Class Listing: {reinstatement_window_days: "=reinstatement_window_days", reinstatement_review_days: "=reinstatement_review_days", suspension_appeal_days: "=suspension_appeal_days", delist_notice_days: "=delist_notice_days"}
        Keyturn Commercial Van Class Listing: {reinstatement_window_days: "=reinstatement_window_days", reinstatement_review_days: "=reinstatement_review_days", suspension_appeal_days: "=suspension_appeal_days", delist_notice_days: "=delist_notice_days"}
