  - id: listings_evt_documents
    subject: [listings_document_verified]
    rule: >-
      A listing depends on documents that expire, and each one is verified by the marketplace rather than accepted on the host's word.
      The host is warned the class's notice period in whole calendar days before a document expires, and where it expires without being renewed the listing is suspended on the day after the class's registration grace runs out.
      Verification takes the class's verification period in business days counted from the day the document is received, and the listing stays live while verification runs where the document was received before the old one expired.
      A document that fails verification is treated as absent, and a listing depending on it is suspended on the same footing as one that never supplied it.
      A lender consent document is verified against the lender named on the title and not merely for its own consistency, so a consent from a lender the title does not name is not accepted.
      Where a class accepts no out-of-state registration, a registration from another state is refused at verification rather than at listing, and the host is told which class would accept it.
    eligibility:
      - id: document_verified_by_marketplace
        applies_to: [listings_document_verified]
        kind: authorization
        condition: A listing depends on documents that expire, and each one is verified by the marketplace rather than accepted on the host's word.
        evidence_fields: [listings_inspections.document_kind, listings_inspections.inspection_outcome, listings_inspections.vehicle_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[listings_inspections.vehicle_id]]
          action_bindings: {listings_inspections.vehicle_id: vehicle_id}
    params:
      per_tier:
        Keyturn Economy Class Listing: {document_expiry_notice_days: "=document_expiry_notice_days", document_verification_days: "=document_verification_days", registration_grace_days: "=registration_grace_days"}
        Keyturn Standard Class Listing: {document_expiry_notice_days: "=document_expiry_notice_days", document_verification_days: "=document_verification_days", registration_grace_days: "=registration_grace_days"}
        Keyturn Premium Class Listing: {document_expiry_notice_days: "=document_expiry_notice_days", document_verification_days: "=document_verification_days", registration_grace_days: "=registration_grace_days"}
        Keyturn Luxury Class Listing: {document_expiry_notice_days: "=document_expiry_notice_days", document_verification_days: "=document_verification_days", registration_grace_days: "=registration_grace_days"}
        Keyturn Exotic Class Listing: {document_expiry_notice_days: "=document_expiry_notice_days", document_verification_days: "=document_verification_days", registration_grace_days: "=registration_grace_days"}
        Keyturn Commercial Van Class Listing: {document_expiry_notice_days: "=document_expiry_notice_days", document_verification_days: "=document_verification_days", registration_grace_days: "=registration_grace_days"}
  - id: listings_price
    subject: [listings_price_updated]
    rule: >-
      The host sets what they ask for their own vehicle, within the floor and ceiling of the class the vehicle sits in, and a price outside that band is refused rather than quietly clamped.
      The daily price may not move by more than the class's daily movement limit in one day, and after a change the price is locked for the class's lockout period in whole elapsed hours, so that a vehicle's price cannot be moved around a booking in progress.
      A price change never touches a booking already confirmed, since every booking carries the price locked in at its own confirmation, and a host who wants a confirmed booking repriced must cancel it and bear the consequences of cancelling.
      Where the class sets a minimum trip price, a booking whose whole price would fall below it is not accepted however short the trip, and the host is told to raise the daily price or set a longer minimum.
      Moving the vehicle to a different home city is a listing change and not a price change, but it takes effect only from the day it is recorded, and deliveries already promised from the old city stand.
      Featuring a listing in search results is charged at the class's placement fee and changes nothing about the price the guest pays.
    eligibility: []
    params:
      per_tier:
        Keyturn Economy Class Listing: {daily_price_floor_amount: "=daily_price_floor_amount", daily_price_ceiling_amount: "=daily_price_ceiling_amount", price_change_max_percent_per_day: "=price_change_max_percent_per_day", price_change_lockout_hours: "=price_change_lockout_hours", minimum_trip_price_amount: "=minimum_trip_price_amount", delivery_radius_miles: "=delivery_radius_miles", airport_delivery_allowed: "=airport_delivery_allowed", feature_placement_fee_amount: "=feature_placement_fee_amount", monthly_listing_fee_amount: "=monthly_listing_fee_amount"}
        Keyturn Standard Class Listing: {daily_price_floor_amount: "=daily_price_floor_amount", daily_price_ceiling_amount: "=daily_price_ceiling_amount", price_change_max_percent_per_day: "=price_change_max_percent_per_day", price_change_lockout_hours: "=price_change_lockout_hours", minimum_trip_price_amount: "=minimum_trip_price_amount", delivery_radius_miles: "=delivery_radius_miles", airport_delivery_allowed: "=airport_delivery_allowed", feature_placement_fee_amount: "=feature_placement_fee_amount", monthly_listing_fee_amount: "=monthly_listing_fee_amount"}
