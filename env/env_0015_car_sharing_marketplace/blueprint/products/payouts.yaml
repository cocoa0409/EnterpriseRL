category: payouts
display_name: Keyturn Host Payout Account

binding:
  holding_table: payouts_accounts
  event_tables: [payouts_ledger]
  intake_tables: [payouts_requests]
  status_field: status
  variant_field: payout_schedule_name
  quantity_fields:
    available_balance: host_earnings
    reserve_balance: payout_reserve

lifecycle:
  states: [applied, verification_pending, active, on_hold, suspended, closed]
  transitions:
    - {from: applied, to: verification_pending, by: system, means: The application is queued for the deposit details to be checked.}
    - {from: applied, to: closed, by: user, means: The host withdraws the application before the deposit details are checked.}
    - {from: verification_pending, to: active, by: agent, means: The deposit details check out and the account can settle money.}
    - {from: verification_pending, to: suspended, by: agent, means: The deposit details fail the check and the account cannot settle.}
    - {from: active, to: on_hold, by: agent, means: Money is stopped from leaving while something is unresolved.}
    - {from: on_hold, to: active, by: agent, means: What stopped the money is resolved and settlement resumes.}
    - {from: active, to: suspended, by: agent, means: The account is closed to settlement pending a risk or compliance decision.}
    - {from: suspended, to: active, by: agent, means: The risk or compliance decision clears and settlement resumes.}
    - {from: on_hold, to: suspended, by: agent, means: A hold turns into a suspension once the underlying matter is serious enough.}
    - {from: active, to: closed, by: user, means: The host closes their own payout account.}
    - {from: on_hold, to: closed, by: user, means: The host closes an account that was on hold, the hold being settled first.}
    - {from: suspended, to: closed, by: agent, means: The marketplace closes a suspended account that will not be reinstated.}

accounts:
  - key: host_earnings
    unit: USD
    meaning: Money in the account that is free to be paid out, raised by earnings and lowered by deductions and transfers.
  - key: payout_reserve
    unit: USD
    meaning: Money held back in the account against open exposure, raised when a reserve is taken and lowered when it is released.

parameter_schema:
  payout_frequency: How often the account is swept, as one of on_trip_completion, daily, weekly, monthly or on_request.
  payout_delay_days_after_trip_start: Calendar days after a trip starts before its earning becomes payable.
  payout_day_of_week: Day the weekly sweep runs, as one of monday through sunday.
  payout_cutoff_local_hour: Hour of the day, on the 24-hour clock, after which a sweep falls to the next run.
  minimum_payout_amount: Smallest sum the account will transfer, in USD.
  maximum_payout_amount_per_transfer: Largest sum one transfer may carry, in USD.
  maximum_payouts_per_month: Transfers the account will make in one calendar month.
  standard_transfer_days: Business days a standard transfer takes to arrive.
  same_day_transfer_cutoff_hour: Hour on the 24-hour clock after which a same-day transfer becomes a next-day transfer.
  instant_payout_fee_percent: Fee for an instant transfer, as a percentage of the sum moved.
  instant_payout_fee_minimum_amount: Floor under the instant transfer fee, in USD.
  instant_payout_fee_maximum_amount: Ceiling on the instant transfer fee, in USD.
  express_payout_flat_fee_amount: Flat fee for an express transfer, in USD.
  wire_transfer_fee_amount: Fee for sending money by wire, in USD.
  paper_cheque_fee_amount: Fee for sending money by cheque, in USD.
  debit_push_fee_percent: Fee for pushing money to a debit card, as a percentage of the sum moved.
  currency_conversion_fee_percent: Fee for converting the payout currency, as a percentage.
  returned_transfer_fee_amount: Fee charged when a transfer comes back unpaid, in USD.
  suspension_after_returned_transfers_count: Returned transfers in a rolling year after which the account is suspended.
  reserve_percent_of_earning: Share of each earning held back as reserve, as a percentage.
  reserve_hold_days: Calendar days a routine reserve is held for.
  reserve_release_trigger: What releases a routine reserve, as one of trip_settled, hold_days_elapsed or claim_closed.
  new_host_reserve_percent: Share held back from a new host's earnings, as a percentage.
  new_host_reserve_trips_count: Settled trips after which the new-host reserve stops being taken.
  claim_reserve_multiple: Multiple of the claimed amount held back while a claim is open.
  claim_reserve_cap_amount: Ceiling on the sum held back against one open claim, in USD.
  chargeback_reserve_percent: Share held back while a guest chargeback is disputed, as a percentage.
  chargeback_recovery_window_days: Calendar days the marketplace has to recover a chargeback from the host.
  negative_balance_grace_days: Calendar days a negative balance may stand before recovery begins.
  negative_balance_recovery_percent: Share of each later earning taken to clear a negative balance, as a percentage.
  bank_verification_required: Whether the deposit account must be verified before settlement (true/false switch).
  bank_verification_days: Business days the deposit account check takes.
  tax_form_required_threshold_amount: Earnings in a calendar year above which tax documentation is required, in USD.
  tax_withholding_percent: Share withheld from payouts where tax documentation is missing, as a percentage.
  statement_close_day: Day of the month the earnings statement closes on.
  statement_delivery_days: Business days after the statement closes before it reaches the host.
  earnings_visibility_days: Calendar days ahead the host can see earnings that are not yet payable.
  payout_hold_notice_days: Calendar days' notice the host is given before money is held.
  hold_review_days: Business days a hold is reviewed within.
  dispute_response_days: Business days the host has to answer a payout dispute.
  adjustment_window_days: Calendar days after an entry within which it may be corrected.
  adjustment_max_amount: Largest correction that may be made without escalation, in USD.
  account_change_lockout_days: Calendar days after a deposit detail change before money may leave again.
  payout_method_change_lockout_days: Calendar days after changing payout method before it may be changed again.
  schedule_change_notice_days: Calendar days' notice to change payout schedule.
  schedule_change_effective_days: Calendar days after notice on which a schedule change takes effect.
  schedule_downgrade_lockout_days: Calendar days before a host may move to a slower schedule again.
  minimum_monthly_earnings_to_qualify: Monthly earnings a host needs to hold this schedule, in USD.
  minimum_completed_trips_to_qualify: Settled trips a host needs to hold this schedule.
  minimum_host_tenure_days: Calendar days a host must have been on the marketplace to hold this schedule.
  closure_notice_days: Calendar days' notice to close the account.
  closure_final_sweep_days: Calendar days after closure notice on which the final sweep runs.
  dormancy_days: Calendar days without activity after which the account is treated as dormant.
  multi_vehicle_consolidation: Whether earnings from several vehicles settle as one transfer (true/false switch).
  per_vehicle_statement: Whether the statement is broken down by vehicle (true/false switch).
  bonus_eligibility_trips_count: Settled trips in a statement month that earn a promotional bonus.

