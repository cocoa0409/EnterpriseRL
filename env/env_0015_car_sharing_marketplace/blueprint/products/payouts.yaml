events:
  - type: payouts_account_opened
    target: payouts_accounts
    mutation: create
    meaning: A host opens the account their marketplace earnings will be settled through.
    grain: One row per host who asks to be paid.
    fields:
      payout_account_id: Reference number of the payout account.
      customer_id: The host the account belongs to.
      payout_schedule_name: The schedule applied for.
      status: Lifecycle state, which a new account enters as applied.
      opened_date: Date the account was applied for.
      bank_account_last4: The deposit account money will be sent to.
      payout_method_default: How money will leave the account.
      available_balance: Money free to be paid out, zero at opening.
      reserve_balance: Money held back, zero at opening.
      tax_form_status: State of the tax documentation at opening.
      statement_delivery: How the host will receive their statement.
      hold_reason: Why money is stopped, which is none at opening.
      next_payout_date: The first date the account is due to be swept.
    triggers: []
  - type: payouts_account_verified
    target: payouts_accounts
    mutation: {transition: {from: verification_pending, to: active}}
    meaning: The deposit details check out and the account may settle money.
    grain: One row per account, updated once when the deposit check passes.
    fields:
      status: Lifecycle state, which becomes active.
      bank_account_last4: The verified deposit account.
      next_payout_date: The first date the account will be swept on.
    triggers:
      - event: payouts:payouts_transfer_released
        map: {customer_id: customer_id, entry_basis: payout_transfer}
  - type: payouts_schedule_changed
    target: payouts_accounts
    mutation: update
    meaning: The host moves to a different payout schedule, or changes how and where money is sent.
    grain: One row per account, updated once per accepted change.
    fields:
      payout_schedule_name: The schedule the account moves to.
      payout_method_default: How money will leave the account from now on.
      bank_account_last4: The deposit account money will be sent to from now on.
      statement_delivery: How the statement will be delivered from now on.
      next_payout_date: The next sweep date under the new schedule.
    triggers: []
  - type: payouts_account_held
    target: payouts_accounts
    mutation: {transition: {from: active, to: on_hold}}
    meaning: Money is stopped from leaving the account while something is unresolved.
    grain: One row per account, updated once per hold.
    fields:
      status: Lifecycle state, which becomes on_hold.
      hold_reason: What stopped the money.
    triggers: []
  - type: payouts_account_released
    target: payouts_accounts
    mutation: {transition: {from: on_hold, to: active}}
    meaning: What stopped the money is resolved and settlement resumes.
    grain: One row per account, updated once per release.
    fields:
      status: Lifecycle state, which becomes active.
      hold_reason: Cleared back to none on release.
      next_payout_date: The next sweep date once settlement resumes.
    triggers: []
  - type: payouts_account_suspended
    target: payouts_accounts
    mutation: {transition: [{from: verification_pending, to: suspended}, {from: active, to: suspended}, {from: on_hold, to: suspended}]}
    meaning: The account is closed to settlement pending a risk, compliance or deposit-detail decision.
    grain: One row per account, updated once per suspension.
    fields:
      status: Lifecycle state, which becomes suspended.
      hold_reason: The ground of the suspension.
    triggers: []
  - type: payouts_account_closed
    target: payouts_accounts
    mutation: {transition: [{from: applied, to: closed}, {from: active, to: closed}, {from: on_hold, to: closed}, {from: suspended, to: closed}]}
    meaning: The payout account is closed and stops settling money for good.
    grain: One row per account, updated once when it closes.
    fields:
      status: Lifecycle state, which becomes closed.
      closed_date: Date the account closed.
      hold_reason: Any ground still standing at closure.
    triggers:
      - event: payouts:payouts_transfer_released
        map: {customer_id: customer_id, entry_basis: payout_transfer}

  - type: payouts_earning_posted
    target: payouts_ledger
    meaning: The host's share of money a trip produced is credited to the account.
    grain: One row per earning credited from one trip on one basis.
    account: host_earnings
    direction: in
    distinguish_by: [entry_date, entry_basis, booking_id, entry_amount]
    fields:
      ledger_id: Reference number of the entry.
      payout_account_id: The account the entry is booked to.
      customer_id: The host being credited.
      booking_id: The trip the money came from.
      event_type: Event family of the entry.
      entry_date: Date the entry was booked.
      entry_amount: Money credited, always positive here.
      entry_basis: What the credit is for.
      statement_period: The statement month the entry falls in.
    triggers:
      - event: payouts:payouts_reserve_held
        map: {customer_id: customer_id, booking_id: booking_id, entry_basis: reserve_hold, hold_reason: none}
  - type: payouts_deduction_posted
    target: payouts_ledger
    meaning: Money the host owes the marketplace or a guest is taken off the account.
    grain: One row per deduction taken on one basis.
    account: host_earnings
    direction: out
    distinguish_by: [entry_date, entry_basis, booking_id, entry_amount]
    fields:
      ledger_id: Reference number of the entry.
      payout_account_id: The account the entry is booked to.
      customer_id: The host being debited.
      booking_id: The trip the deduction arises from, where it arises from one.
      source_ledger_id: The entry the deduction is taken against, where it is taken against one.
      event_type: Event family of the entry.
      entry_date: Date the entry was booked.
      entry_amount: Money taken off, always negative here.
      entry_basis: What the deduction is for.
      statement_period: The statement month the entry falls in.
    triggers: []
  - type: payouts_reserve_held
    target: payouts_ledger
    meaning: Money is moved out of what is payable and held back against open exposure.
    grain: One row per reserve taken on one basis.
    account: payout_reserve
    direction: in
    distinguish_by: [entry_date, entry_basis, hold_reason, entry_amount]
    fields:
      ledger_id: Reference number of the entry.
      payout_account_id: The account the reserve is held on.
      customer_id: The host whose money is held.
      booking_id: The trip the exposure arises from, where it arises from one.
      event_type: Event family of the entry.
      entry_date: Date the reserve was taken.
      entry_amount: Money moved into reserve, always positive here.
      entry_basis: What kind of reserve it is.
      hold_reason: What the reserve is held against.
      statement_period: The statement month the entry falls in.
    triggers: []
  - type: payouts_reserve_released
    target: payouts_ledger
    meaning: Money held back is released and becomes payable again.
    grain: One row per reserve released against one earlier hold.
    account: payout_reserve
    direction: out
    distinguish_by: [entry_date, source_ledger_id, entry_amount]
    fields:
      ledger_id: Reference number of the entry.
      payout_account_id: The account the reserve is released on.
      customer_id: The host whose money is released.
      booking_id: The trip the exposure arose from, where it arose from one.
      source_ledger_id: The hold entry being released.
      event_type: Event family of the entry.
      entry_date: Date the reserve was released.
      entry_amount: Money moved out of reserve, always negative here.
      entry_basis: The release basis.
      hold_reason: Cleared back to none on release.
      statement_period: The statement month the entry falls in.
    triggers: []
  - type: payouts_transfer_released
    target: payouts_ledger
    meaning: Money leaves the account on its way to the host's deposit account.
    grain: One row per transfer sent out of one account.
    account: host_earnings
    direction: out
    distinguish_by: [entry_date, entry_amount, payout_method, settlement_reference]
    fields:
      ledger_id: Reference number of the entry.
      payout_account_id: The account the money left.
      customer_id: The host being paid.
      event_type: Event family of the entry.
      entry_date: Date the transfer was sent.
      entry_amount: Money sent, always negative here.
      entry_basis: The transfer basis.
      payout_method: How the money was sent.
      settlement_reference: The bank reference the host can quote.
      statement_period: The statement month the entry falls in.
    triggers:
      - event: payouts:payouts_deduction_posted
        when: {payout_method: [ach_same_day, debit_push]}
        map: {customer_id: customer_id, entry_basis: instant_payout_fee}
  - type: payouts_transfer_returned
    target: payouts_ledger
    meaning: A transfer comes back unpaid and the money is put back on the account.
    grain: One row per returned transfer against one earlier transfer.
    account: host_earnings
    direction: in
    distinguish_by: [entry_date, source_ledger_id, entry_amount]
    fields:
      ledger_id: Reference number of the entry.
      payout_account_id: The account the money came back to.
      customer_id: The host whose transfer failed.
      source_ledger_id: The transfer that came back.
      event_type: Event family of the entry.
      entry_date: Date the money came back.
      entry_amount: Money put back, always positive here.
      entry_basis: The return basis.
      payout_method: How the failed transfer had been sent.
      settlement_reference: The bank reference of the return.
      statement_period: The statement month the entry falls in.
    triggers:
