        Keyturn Roadside Fleet Cover: {tow_miles_included_per_callout: "=tow_miles_included_per_callout", tow_overage_rate_per_mile: "=tow_overage_rate_per_mile", tow_destination_choice: "=tow_destination_choice", fuel_delivery_gallons_included: "=fuel_delivery_gallons_included", fuel_cost_charged_to_member: "=fuel_cost_charged_to_member", ev_charge_kwh_included: "=ev_charge_kwh_included", winch_recovery_limit_amount: "=winch_recovery_limit_amount", additional_callout_fee_amount: "=additional_callout_fee_amount"}
        Keyturn Roadside Concierge Cover: {tow_miles_included_per_callout: "=tow_miles_included_per_callout", tow_overage_rate_per_mile: "=tow_overage_rate_per_mile", tow_destination_choice: "=tow_destination_choice", fuel_delivery_gallons_included: "=fuel_delivery_gallons_included", fuel_cost_charged_to_member: "=fuel_cost_charged_to_member", ev_charge_kwh_included: "=ev_charge_kwh_included", winch_recovery_limit_amount: "=winch_recovery_limit_amount", additional_callout_fee_amount: "=additional_callout_fee_amount"}
  - id: roadside_evt_credits
    subject: [roadside_credit_granted]
    rule: >-
      The term's callouts are granted in full when cover begins and again at each renewal, and they are granted to the subscription rather than to the member.
      Unused callouts carry into the next term only on the plans that allow it, and no more than the plan's rollover ceiling carries however many are left; the rest simply lapse at the end of the term.
      A carried callout expires the plan's expiry period in whole calendar days from the day it was granted, and an expired callout is not restored on request.
      A goodwill callout may be granted where the marketplace failed to attend within the plan's response target, and it is granted as its own record so that goodwill and entitlement stay separable.
      No callouts are granted while the subscription is suspended, and a subscription reinstated mid-term resumes with the callouts it had rather than a fresh allowance.
    eligibility: []
    params:
      per_tier:
        Keyturn Roadside Basic Cover: {callouts_included_per_term: "=callouts_included_per_term", credit_rollover_allowed: "=credit_rollover_allowed", credit_rollover_max_count: "=credit_rollover_max_count", credit_expiry_days: "=credit_expiry_days", term_length_days: "=term_length_days"}
        Keyturn Roadside Plus Cover: {callouts_included_per_term: "=callouts_included_per_term", credit_rollover_allowed: "=credit_rollover_allowed", credit_rollover_max_count: "=credit_rollover_max_count", credit_expiry_days: "=credit_expiry_days", term_length_days: "=term_length_days"}
        Keyturn Roadside Tow Cover: {callouts_included_per_term: "=callouts_included_per_term", credit_rollover_allowed: "=credit_rollover_allowed", credit_rollover_max_count: "=credit_rollover_max_count", credit_expiry_days: "=credit_expiry_days", term_length_days: "=term_length_days"}
        Keyturn Roadside EV Cover: {callouts_included_per_term: "=callouts_included_per_term", credit_rollover_allowed: "=credit_rollover_allowed", credit_rollover_max_count: "=credit_rollover_max_count", credit_expiry_days: "=credit_expiry_days", term_length_days: "=term_length_days"}
        Keyturn Roadside Fleet Cover: {callouts_included_per_term: "=callouts_included_per_term", credit_rollover_allowed: "=credit_rollover_allowed", credit_rollover_max_count: "=credit_rollover_max_count", credit_expiry_days: "=credit_expiry_days", term_length_days: "=term_length_days"}
        Keyturn Roadside Concierge Cover: {callouts_included_per_term: "=callouts_included_per_term", credit_rollover_allowed: "=credit_rollover_allowed", credit_rollover_max_count: "=credit_rollover_max_count", credit_expiry_days: "=credit_expiry_days", term_length_days: "=term_length_days"}
    formula:
      when: credits_delta > 0
      credits_delta: callouts_included_per_term
  - id: roadside_evt_excess
    subject: [roadside_excess_charged]
    rule: >-
      The member pays the plan's excess toward each callout, and on the plans that waive it for a vehicle on a marketplace trip nothing is charged where the trip record shows the vehicle was out with a guest.
      Towing beyond the included distance is charged at the plan's overage rate on the miles beyond it, not on the whole distance, and the included distance is never charged for.
      A callout taken once the allowance is used is charged at the plan's additional callout price in place of the excess rather than on top of it.
      Where the member uses an operator outside the network on a plan that requires the network, nothing is dispatched and the member claims reimbursement instead, capped at the plan's reimbursement ceiling and submitted inside the plan's submission period counted in whole calendar days from the day of the callout.
      A charge raised in error is reversed against the callout it was raised on, and no charge is raised at all on a callout the operator could not attend.
    eligibility:
      - id: reimbursement_submission_window
        applies_to: [roadside_excess_charged]
        kind: time
        condition: Where the member uses an operator outside the network on a plan that requires the network, nothing is dispatched and the member claims reimbursement instead, capped at the plan's reimbursement ceiling and submitted inside the plan's submission period counted in whole calendar days from the day of the callout.
        evidence_fields: [roadside_callouts.callout_date, roadside_callouts.callout_id, roadside_callouts.outcome]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[roadside_callouts.callout_id]]
          action_bindings: {roadside_callouts.callout_id: source_callout_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the day of the callout
          anchor_source: roadside_callouts.callout_date
          relation: not_after
          duration_source: params.reimbursement_submission_days
          unit: calendar_days
          counting_rule: counted in whole calendar days from the day of the callout
          boundary: inclusive
    params:
      per_tier:
        Keyturn Roadside Basic Cover: {callout_excess_amount: "=callout_excess_amount", excess_waived_on_trip: "=excess_waived_on_trip", tow_overage_rate_per_mile: "=tow_overage_rate_per_mile", partner_network_only: "=partner_network_only", reimbursement_submission_days: "=reimbursement_submission_days", reimbursement_cap_amount: "=reimbursement_cap_amount", claim_documentation_days: "=claim_documentation_days"}
        Keyturn Roadside Plus Cover: {callout_excess_amount: "=callout_excess_amount", excess_waived_on_trip: "=excess_waived_on_trip", tow_overage_rate_per_mile: "=tow_overage_rate_per_mile", partner_network_only: "=partner_network_only", reimbursement_submission_days: "=reimbursement_submission_days", reimbursement_cap_amount: "=reimbursement_cap_amount", claim_documentation_days: "=claim_documentation_days"}
        Keyturn Roadside Tow Cover: {callout_excess_amount: "=callout_excess_amount", excess_waived_on_trip: "=excess_waived_on_trip", tow_overage_rate_per_mile: "=tow_overage_rate_per_mile", partner_network_only: "=partner_network_only", reimbursement_submission_days: "=reimbursement_submission_days", reimbursement_cap_amount: "=reimbursement_cap_amount", claim_documentation_days: "=claim_documentation_days"}
        Keyturn Roadside EV Cover: {callout_excess_amount: "=callout_excess_amount", excess_waived_on_trip: "=excess_waived_on_trip", tow_overage_rate_per_mile: "=tow_overage_rate_per_mile", partner_network_only: "=partner_network_only", reimbursement_submission_days: "=reimbursement_submission_days", reimbursement_cap_amount: "=reimbursement_cap_amount", claim_documentation_days: "=claim_documentation_days"}
        Keyturn Roadside Fleet Cover: {callout_excess_amount: "=callout_excess_amount", excess_waived_on_trip: "=excess_waived_on_trip", tow_overage_rate_per_mile: "=tow_overage_rate_per_mile", partner_network_only: "=partner_network_only", reimbursement_submission_days: "=reimbursement_submission_days", reimbursement_cap_amount: "=reimbursement_cap_amount", claim_documentation_days: "=claim_documentation_days"}
        Keyturn Roadside Concierge Cover: {callout_excess_amount: "=callout_excess_amount", excess_waived_on_trip: "=excess_waived_on_trip", tow_overage_rate_per_mile: "=tow_overage_rate_per_mile", partner_network_only: "=partner_network_only", reimbursement_submission_days: "=reimbursement_submission_days", reimbursement_cap_amount: "=reimbursement_cap_amount", claim_documentation_days: "=claim_documentation_days"}
    formula:
      when: tow_miles > tow_miles_included_per_callout
      callout_fee_amount: round(callout_excess_amount + (tow_miles - tow_miles_included_per_callout) * tow_overage_rate_per_mile, 2)
  - id: roadside_renewal
    subject: [roadside_subscription_renewed]
    rule: >-
      A term renews on its renewal date, and the member is told the plan's notice period in whole calendar days beforehand so that they can change or end it first.
      A plan that renews without the member acting does so at the price then published, and a price change is included in the renewal notice rather than applied silently.
      A member who wants a different plan changes it at renewal without charge; a change mid-term is treated as ending one subscription and opening another, and the minimum term applies to the new one.
      Renewing grants the new term's allowance, and unused callouts carry only as the rollover rules allow.
      A subscription whose fee is unpaid does not renew; it lapses instead, and the member is told what reinstatement would cost.
    eligibility: []
    params:
      per_tier:
        Keyturn Roadside Basic Cover: {renewal_notice_days: "=renewal_notice_days", auto_renewal_enabled: "=auto_renewal_enabled", minimum_term_days: "=minimum_term_days", term_length_days: "=term_length_days"}
        Keyturn Roadside Plus Cover: {renewal_notice_days: "=renewal_notice_days", auto_renewal_enabled: "=auto_renewal_enabled", minimum_term_days: "=minimum_term_days", term_length_days: "=term_length_days"}
        Keyturn Roadside Tow Cover: {renewal_notice_days: "=renewal_notice_days", auto_renewal_enabled: "=auto_renewal_enabled", minimum_term_days: "=minimum_term_days", term_length_days: "=term_length_days"}
        Keyturn Roadside EV Cover: {renewal_notice_days: "=renewal_notice_days", auto_renewal_enabled: "=auto_renewal_enabled", minimum_term_days: "=minimum_term_days", term_length_days: "=term_length_days"}
        Keyturn Roadside Fleet Cover: {renewal_notice_days: "=renewal_notice_days", auto_renewal_enabled: "=auto_renewal_enabled", minimum_term_days: "=minimum_term_days", term_length_days: "=term_length_days"}
        Keyturn Roadside Concierge Cover: {renewal_notice_days: "=renewal_notice_days", auto_renewal_enabled: "=auto_renewal_enabled", minimum_term_days: "=minimum_term_days", term_length_days: "=term_length_days"}
  - id: roadside_lifecycle
    subject: [roadside_subscription_suspended, roadside_subscription_reinstated, roadside_subscription_ended]
    rule: >-
      Cover is suspended where the fee goes unpaid or where the pattern of callouts puts the subscription in front of a reviewer, and the member is told which of the two it is.
      Cover falls away where the fee stays unpaid past the plan's lapse period, counted in whole calendar days from the day it fell due, and a lapse may be put right inside the plan's reinstatement window on payment of the plan's reinstatement fee.
      A reinstated subscription runs to the renewal date it already had rather than starting a fresh term, so reinstatement restores cover without buying more of it.
      The member ends their own cover on the plan's notice, and where the minimum term has not run the plan's cancellation refund percentage of the unused term is returned rather than the whole of it.
      Cover ended by the member does not stop a callout already dispatched, which is completed and charged under the terms that stood when it was called.
      A subscription cancelled outright is not reinstated, and the member who wants cover again takes out a fresh subscription and serves the waiting period afresh.
    eligibility:
      - id: suspension_only_from_active
        applies_to: [roadside_subscription_suspended]
        kind: state
        condition: Cover is suspended where the fee goes unpaid or where the pattern of callouts puts the subscription in front of a reviewer, and the member is told which of the two it is.
        evidence_fields: [roadside_subscriptions.status, roadside_subscriptions.subscription_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[roadside_subscriptions.subscription_id]]
          action_bindings: {roadside_subscriptions.subscription_id: subscription_id}
        state_contract:
          field: roadside_subscriptions.status
          allowed: [active, suspended]
    params:
      per_tier:
        Keyturn Roadside Basic Cover: {lapse_after_unpaid_days: "=lapse_after_unpaid_days", reinstatement_window_days: "=reinstatement_window_days", reinstatement_fee_amount: "=reinstatement_fee_amount", cancellation_notice_days: "=cancellation_notice_days", cancellation_refund_percent: "=cancellation_refund_percent"}
        Keyturn Roadside Plus Cover: {lapse_after_unpaid_days: "=lapse_after_unpaid_days", reinstatement_window_days: "=reinstatement_window_days", reinstatement_fee_amount: "=reinstatement_fee_amount", cancellation_notice_days: "=cancellation_notice_days", cancellation_refund_percent: "=cancellation_refund_percent"}
        Keyturn Roadside Tow Cover: {lapse_after_unpaid_days: "=lapse_after_unpaid_days", reinstatement_window_days: "=reinstatement_window_days", reinstatement_fee_amount: "=reinstatement_fee_amount", cancellation_notice_days: "=cancellation_notice_days", cancellation_refund_percent: "=cancellation_refund_percent"}
        Keyturn Roadside EV Cover: {lapse_after_unpaid_days: "=lapse_after_unpaid_days", reinstatement_window_days: "=reinstatement_window_days", reinstatement_fee_amount: "=reinstatement_fee_amount", cancellation_notice_days: "=cancellation_notice_days", cancellation_refund_percent: "=cancellation_refund_percent"}
        Keyturn Roadside Fleet Cover: {lapse_after_unpaid_days: "=lapse_after_unpaid_days", reinstatement_window_days: "=reinstatement_window_days", reinstatement_fee_amount: "=reinstatement_fee_amount", cancellation_notice_days: "=cancellation_notice_days", cancellation_refund_percent: "=cancellation_refund_percent"}
        Keyturn Roadside Concierge Cover: {lapse_after_unpaid_days: "=lapse_after_unpaid_days", reinstatement_window_days: "=reinstatement_window_days", reinstatement_fee_amount: "=reinstatement_fee_amount", cancellation_notice_days: "=cancellation_notice_days", cancellation_refund_percent: "=cancellation_refund_percent"}
