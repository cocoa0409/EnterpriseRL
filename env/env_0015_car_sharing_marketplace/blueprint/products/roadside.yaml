events:
  - type: roadside_subscription_opened
    target: roadside_subscriptions
    mutation: create
    meaning: A member takes out roadside cover on one of their vehicles.
    grain: One row per vehicle a member covers.
    fields:
      subscription_id: Reference number of the subscription.
      customer_id: The member who holds it.
      vehicle_id: The vehicle covered.
      roadside_plan_name: The plan applied for.
      status: Lifecycle state, which a new subscription enters as applied.
      started_date: Date cover is asked to begin.
      renewal_date: Date the term would next renew.
      callout_credits_remaining: Callouts included, zero until the subscription is activated.
      service_region: The territory the plan dispatches in.
      enrolled_channel: How the member came to hold the subscription.
    triggers: []
  - type: roadside_subscription_activated
    target: roadside_subscriptions
    mutation: {transition: {from: applied, to: active}}
    meaning: Cover begins and the term's callout allowance is granted.
    grain: One row per subscription, updated once when cover begins.
    fields:
      status: Lifecycle state, which becomes active.
      started_date: First date cover runs from.
      renewal_date: Date the term next renews.
    triggers:
      - event: roadside:roadside_credit_granted
        map: {customer_id: customer_id, subscription_id: subscription_id, service_code: none, outcome: completed}
  - type: roadside_subscription_renewed
    target: roadside_subscriptions
    mutation: update
    meaning: The term renews and the plan, region or renewal date is restated.
    grain: One row per subscription, updated once per renewal.
    fields:
      roadside_plan_name: The plan the subscription renews onto.
      renewal_date: The next renewal date.
      service_region: The territory the renewed term dispatches in.
    triggers:
      - event: roadside:roadside_credit_granted
        map: {customer_id: customer_id, subscription_id: subscription_id, service_code: none, outcome: completed}
  - type: roadside_subscription_suspended
    target: roadside_subscriptions
    mutation: {transition: {from: active, to: suspended}}
    meaning: Cover is paused while an unpaid fee or a misuse review is outstanding.
    grain: One row per subscription, updated once per suspension.
    fields:
      status: Lifecycle state, which becomes suspended.
    triggers: []
  - type: roadside_subscription_reinstated
    target: roadside_subscriptions
    mutation: {transition: [{from: suspended, to: active}, {from: lapsed, to: active}]}
    meaning: Cover that was paused or had fallen away is restored.
    grain: One row per subscription, updated once per reinstatement.
    fields:
      status: Lifecycle state, which becomes active.
      started_date: Date cover runs from again.
      renewal_date: The renewal date of the restored term.
    triggers: []
  - type: roadside_subscription_ended
    target: roadside_subscriptions
    mutation: {transition: [{from: active, to: cancelled}, {from: suspended, to: cancelled}, {from: active, to: lapsed}, {from: suspended, to: lapsed}, {from: lapsed, to: cancelled}, {from: applied, to: cancelled}]}
    meaning: Cover comes to an end, whether the member ended it or it fell away.
    grain: One row per subscription, updated once when cover ends.
    fields:
      status: Lifecycle state, which becomes lapsed or cancelled.
      ended_date: Date cover ceased.
    triggers: []

  - type: roadside_credit_granted
    target: roadside_callouts
    meaning: Callouts are added to the subscription at activation, at renewal or as a goodwill gesture.
    grain: One row per grant of callouts to one subscription.
    account: callout_credits
    direction: in
    distinguish_by: [callout_date, credits_delta, dispatch_channel]
    fields:
      callout_id: Reference number of the record.
      subscription_id: The subscription the callouts are granted to.
      customer_id: The member holding the subscription.
      event_type: Event family of the record.
      callout_date: Date the callouts were granted.
      credits_delta: Callouts added, always positive here.
      dispatch_channel: How the grant was recorded.
      service_code: Not applicable on a grant.
      outcome: How the grant was recorded.
    triggers: []
  - type: roadside_callout_dispatched
    target: roadside_callouts
    meaning: An operator is sent out to a vehicle that has broken down or is immobilised.
    grain: One row per dispatch made on one subscription.
    distinguish_by: [callout_date, service_code, dispatch_channel]
    fields:
      callout_id: Reference number of the record.
      subscription_id: The subscription the call is made under.
      customer_id: The member who called.
      booking_id: The trip the vehicle was on, where it was on one.
      event_type: Event family of the record.
      callout_date: Date assistance was called for.
      service_code: The assistance asked for.
      dispatch_channel: How assistance was requested.
      outcome: The state of the callout, which on dispatch is dispatched.
      responder_reference: The operator's job reference.
    triggers: []
  - type: roadside_callout_completed
    target: roadside_callouts
    meaning: The operator reaches the vehicle, provides the assistance and the callout consumes an included credit.
    grain: One row per completed callout on one subscription.
    account: callout_credits
    direction: out
    distinguish_by: [callout_date, service_code, tow_miles, source_callout_id]
    fields:
      callout_id: Reference number of the record.
      subscription_id: The subscription the call was made under.
      customer_id: The member who called.
      booking_id: The trip the vehicle was on, where it was on one.
      source_callout_id: The dispatch this record completes.
      event_type: Event family of the record.
      callout_date: Date the assistance was given.
      service_code: The assistance given.
      credits_delta: Callouts consumed, always negative here.
      tow_miles: Distance the vehicle was towed.
      dispatch_channel: How assistance had been requested.
      outcome: How the callout ended.
      responder_reference: The operator's job reference.
    triggers:
      - event: roadside:roadside_excess_charged
        when: {service_code: [tow, winch_recovery]}
        map: {customer_id: customer_id, subscription_id: subscription_id, outcome: completed}
  - type: roadside_excess_charged
    target: roadside_callouts
    meaning: The member is charged the excess, the towing overage or the price of a callout beyond the allowance.
    grain: One row per charge raised against one callout.
    distinguish_by: [callout_date, callout_fee_amount, source_callout_id]
    fields:
      callout_id: Reference number of the record.
      subscription_id: The subscription the charge belongs to.
      customer_id: The member being charged.
      source_callout_id: The callout the charge belongs to.
      event_type: Event family of the record.
      callout_date: Date the charge was raised.
      callout_fee_amount: Money charged to the member.
      tow_miles: Towing miles the charge was computed on.
      service_code: The assistance the charge arises from.
      dispatch_channel: How the callout had been requested.
      outcome: How the callout ended.
    triggers: []
  - type: roadside_callout_cancelled
    target: roadside_callouts
    meaning: A callout is called off before the assistance is given, whether by the member or because no operator could attend.
    grain: One row per cancellation of one dispatch.
    distinguish_by: [callout_date, source_callout_id, outcome]
    fields:
      callout_id: Reference number of the record.
      subscription_id: The subscription the call was made under.
      customer_id: The member who called.
      source_callout_id: The dispatch being called off.
      event_type: Event family of the record.
      callout_date: Date the call was called off.
      service_code: The assistance that had been asked for.
      outcome: Why it was called off.
      dispatch_channel: How assistance had been requested.
      callout_fee_amount: Any fee charged for calling off.
    triggers: []

measures:
  - id: roadside_msr_callouts_12m
    window: Rolling 12 calendar months counted back from the handling date, the handling date included.
    measure: Count of roadside_callout_completed records on this subscription.

policies:
  - id: roadside_agg_multi_holding
    subject: [roadside_subscription_opened]
    rule: >-
      Roadside cover is taken vehicle by vehicle, so a member may hold as many subscriptions as they have vehicles and there is no ceiling on the number.
      One vehicle carries one live subscription, and a second application on a vehicle already covered is a plan change on the subscription held rather than a second cover.
      Each subscription carries its own callout allowance, and an allowance unused on one vehicle is never drawn on for another.
    eligibility: []
    params: {max_per_customer: null}
  - id: roadside_agg_fleet_allowance
    subject: [roadside_subscription_opened, roadside_callout_completed]
    rule: >-
      A member's subscriptions are read together when the marketplace judges use, even though the allowance is held vehicle by vehicle.
      Completed callouts are counted across every subscription the member holds over the rolling twelve months, and it is that count, not the count on the vehicle attended, that puts the member in front of a reviewer or suspends their cover.
      Where a member holds subscriptions on several plans the most generous plan's response target applies to every vehicle in the fleet, because the operator network is dispatched on the member and not on the vehicle.
      An unpaid subscription fee on any one vehicle suspends dispatch on all of them, since the marketplace does not attend a fleet that owes it money.
    eligibility: []
    params:
      per_tier:
        Keyturn Roadside Basic Cover: {misuse_review_callouts_count: "=misuse_review_callouts_count", suspension_after_callouts_count: "=suspension_after_callouts_count", response_time_target_minutes: "=response_time_target_minutes"}
        Keyturn Roadside Plus Cover: {misuse_review_callouts_count: "=misuse_review_callouts_count", suspension_after_callouts_count: "=suspension_after_callouts_count", response_time_target_minutes: "=response_time_target_minutes"}
        Keyturn Roadside Tow Cover: {misuse_review_callouts_count: "=misuse_review_callouts_count", suspension_after_callouts_count: "=suspension_after_callouts_count", response_time_target_minutes: "=response_time_target_minutes"}
        Keyturn Roadside EV Cover: {misuse_review_callouts_count: "=misuse_review_callouts_count", suspension_after_callouts_count: "=suspension_after_callouts_count", response_time_target_minutes: "=response_time_target_minutes"}
        Keyturn Roadside Fleet Cover: {misuse_review_callouts_count: "=misuse_review_callouts_count", suspension_after_callouts_count: "=suspension_after_callouts_count", response_time_target_minutes: "=response_time_target_minutes"}
        Keyturn Roadside Concierge Cover: {misuse_review_callouts_count: "=misuse_review_callouts_count", suspension_after_callouts_count: "=suspension_after_callouts_count", response_time_target_minutes: "=response_time_target_minutes"}
    measures: [roadside_msr_callouts_12m]
  - id: roadside_enrollment
    subject: [roadside_subscription_opened, roadside_subscription_activated]
    rule: >-
      A vehicle is accepted onto a plan only where it is no older than the plan's age limit, counted in whole years from the model year, and only where its listing sits in one of the plan's eligible value classes.
      Cover does not begin on the day of application. It begins once the plan's waiting period has run, counted in whole calendar days from the day the subscription was accepted, with the day of acceptance itself not counted, and a breakdown during the waiting period is not attended under the plan.
      The plan may be paid monthly or for the year up front, and a member who pays for the year gets the whole term's allowance at once rather than a twelfth of it each month.
      A plan whose electric vehicle cover is the point of it is written only on a vehicle recorded as battery electric, and a combustion vehicle on such a plan is moved to the plan that fits rather than left with cover it cannot use.
      The activation fee, where the plan charges one, falls due when cover begins and is not returned if the member cancels inside the minimum term.
    eligibility:
      - id: waiting_period_elapsed
        applies_to: [roadside_subscription_activated]
        kind: time
        condition: It begins once the plan's waiting period has run, counted in whole calendar days from the day the subscription was accepted, with the day of acceptance itself not counted, and a breakdown during the waiting period is not attended under the plan.
        evidence_fields: [roadside_subscriptions.started_date, roadside_subscriptions.subscription_id, roadside_subscriptions.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[roadside_subscriptions.subscription_id]]
          action_bindings: {roadside_subscriptions.subscription_id: subscription_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the plan's waiting period has run
          anchor_source: roadside_subscriptions.started_date
          relation: not_before
          duration_source: params.waiting_period_days
          unit: calendar_days
          counting_rule: counted in whole calendar days from the day the subscription was accepted, with the day of acceptance itself not counted
          boundary: inclusive
    params:
      per_tier:
        Keyturn Roadside Basic Cover: {waiting_period_days: "=waiting_period_days", vehicle_age_max_years: "=vehicle_age_max_years", eligible_value_classes: "=eligible_value_classes", activation_fee_amount: "=activation_fee_amount", monthly_subscription_fee_amount: "=monthly_subscription_fee_amount", annual_subscription_fee_amount: "=annual_subscription_fee_amount", ev_charge_delivery_included: "=ev_charge_delivery_included"}
        Keyturn Roadside Plus Cover: {waiting_period_days: "=waiting_period_days", vehicle_age_max_years: "=vehicle_age_max_years", eligible_value_classes: "=eligible_value_classes", activation_fee_amount: "=activation_fee_amount", monthly_subscription_fee_amount: "=monthly_subscription_fee_amount", annual_subscription_fee_amount: "=annual_subscription_fee_amount", ev_charge_delivery_included: "=ev_charge_delivery_included"}
        Keyturn Roadside Tow Cover: {waiting_period_days: "=waiting_period_days", vehicle_age_max_years: "=vehicle_age_max_years", eligible_value_classes: "=eligible_value_classes", activation_fee_amount: "=activation_fee_amount", monthly_subscription_fee_amount: "=monthly_subscription_fee_amount", annual_subscription_fee_amount: "=annual_subscription_fee_amount", ev_charge_delivery_included: "=ev_charge_delivery_included"}
        Keyturn Roadside EV Cover: {waiting_period_days: "=waiting_period_days", vehicle_age_max_years: "=vehicle_age_max_years", eligible_value_classes: "=eligible_value_classes", activation_fee_amount: "=activation_fee_amount", monthly_subscription_fee_amount: "=monthly_subscription_fee_amount", annual_subscription_fee_amount: "=annual_subscription_fee_amount", ev_charge_delivery_included: "=ev_charge_delivery_included"}
        Keyturn Roadside Fleet Cover: {waiting_period_days: "=waiting_period_days", vehicle_age_max_years: "=vehicle_age_max_years", eligible_value_classes: "=eligible_value_classes", activation_fee_amount: "=activation_fee_amount", monthly_subscription_fee_amount: "=monthly_subscription_fee_amount", annual_subscription_fee_amount: "=annual_subscription_fee_amount", ev_charge_delivery_included: "=ev_charge_delivery_included"}
        Keyturn Roadside Concierge Cover: {waiting_period_days: "=waiting_period_days", vehicle_age_max_years: "=vehicle_age_max_years", eligible_value_classes: "=eligible_value_classes", activation_fee_amount: "=activation_fee_amount", monthly_subscription_fee_amount: "=monthly_subscription_fee_amount", annual_subscription_fee_amount: "=annual_subscription_fee_amount", ev_charge_delivery_included: "=ev_charge_delivery_included"}
  - id: roadside_evt_dispatch
    subject: [roadside_callout_dispatched, roadside_callout_cancelled]
    rule: >-
      Assistance is dispatched only through the channels the plan allows, and a request made through a channel the plan does not carry is taken but dispatched under the plan's ordinary terms rather than its response target.
      A vehicle outside the plan's service radius is still attended where an operator can reach it, and the miles beyond the radius are charged at the plan's out-of-radius rate.
      A second call for the same fault inside the plan's duplicate window is the same callout and consumes no further credit, however many times the member calls.
      Whoever is with the vehicle may call, but only where the plan covers that person; a plan that does not cover guests will not attend a guest on a trip, and the host must call on the guest's behalf.
      A callout called off after the operator has set out carries the plan's cancellation fee, and one where nobody is with the vehicle when the operator arrives carries the plan's no-show fee instead; the two are never charged together.
      Dispatch is only made while the subscription is in the active state, so a suspended or lapsed subscription is told what it would cost to reinstate rather than attended on credit.
    eligibility:
      - id: dispatch_only_while_active
        applies_to: [roadside_callout_dispatched]
        kind: state
        condition: Dispatch is only made while the subscription is in the active state, so a suspended or lapsed subscription is told what it would cost to reinstate rather than attended on credit.
        evidence_fields: [roadside_subscriptions.status, roadside_subscriptions.subscription_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[roadside_subscriptions.subscription_id]]
          action_bindings: {roadside_subscriptions.subscription_id: subscription_id}
        state_contract:
          field: roadside_subscriptions.status
          allowed: [active]
    params:
      per_tier:
        Keyturn Roadside Basic Cover: {dispatch_channels_allowed: "=dispatch_channels_allowed", service_radius_miles: "=service_radius_miles", out_of_radius_rate_per_mile: "=out_of_radius_rate_per_mile", duplicate_callout_window_hours: "=duplicate_callout_window_hours", guest_callout_covered: "=guest_callout_covered", host_callout_covered: "=host_callout_covered", cancelled_callout_fee_amount: "=cancelled_callout_fee_amount", no_show_callout_fee_amount: "=no_show_callout_fee_amount"}
        Keyturn Roadside Plus Cover: {dispatch_channels_allowed: "=dispatch_channels_allowed", service_radius_miles: "=service_radius_miles", out_of_radius_rate_per_mile: "=out_of_radius_rate_per_mile", duplicate_callout_window_hours: "=duplicate_callout_window_hours", guest_callout_covered: "=guest_callout_covered", host_callout_covered: "=host_callout_covered", cancelled_callout_fee_amount: "=cancelled_callout_fee_amount", no_show_callout_fee_amount: "=no_show_callout_fee_amount"}
        Keyturn Roadside Tow Cover: {dispatch_channels_allowed: "=dispatch_channels_allowed", service_radius_miles: "=service_radius_miles", out_of_radius_rate_per_mile: "=out_of_radius_rate_per_mile", duplicate_callout_window_hours: "=duplicate_callout_window_hours", guest_callout_covered: "=guest_callout_covered", host_callout_covered: "=host_callout_covered", cancelled_callout_fee_amount: "=cancelled_callout_fee_amount", no_show_callout_fee_amount: "=no_show_callout_fee_amount"}
        Keyturn Roadside EV Cover: {dispatch_channels_allowed: "=dispatch_channels_allowed", service_radius_miles: "=service_radius_miles", out_of_radius_rate_per_mile: "=out_of_radius_rate_per_mile", duplicate_callout_window_hours: "=duplicate_callout_window_hours", guest_callout_covered: "=guest_callout_covered", host_callout_covered: "=host_callout_covered", cancelled_callout_fee_amount: "=cancelled_callout_fee_amount", no_show_callout_fee_amount: "=no_show_callout_fee_amount"}
        Keyturn Roadside Fleet Cover: {dispatch_channels_allowed: "=dispatch_channels_allowed", service_radius_miles: "=service_radius_miles", out_of_radius_rate_per_mile: "=out_of_radius_rate_per_mile", duplicate_callout_window_hours: "=duplicate_callout_window_hours", guest_callout_covered: "=guest_callout_covered", host_callout_covered: "=host_callout_covered", cancelled_callout_fee_amount: "=cancelled_callout_fee_amount", no_show_callout_fee_amount: "=no_show_callout_fee_amount"}
        Keyturn Roadside Concierge Cover: {dispatch_channels_allowed: "=dispatch_channels_allowed", service_radius_miles: "=service_radius_miles", out_of_radius_rate_per_mile: "=out_of_radius_rate_per_mile", duplicate_callout_window_hours: "=duplicate_callout_window_hours", guest_callout_covered: "=guest_callout_covered", host_callout_covered: "=host_callout_covered", cancelled_callout_fee_amount: "=cancelled_callout_fee_amount", no_show_callout_fee_amount: "=no_show_callout_fee_amount"}
  - id: roadside_evt_service
    subject: [roadside_callout_completed]
    rule: >-
      What the operator may do is what the plan includes, and a service the plan does not include is provided only where the member agrees to pay for it in full before the operator sets out.
      A tow is included up to the plan's towing distance, measured from where the vehicle stood to where it was taken, and the member chooses the destination only on the plans that allow it; on the others the vehicle goes to the nearest suitable workshop.
      Fuel delivery brings the plan's included gallons, and on the plans that charge for the fuel the fuel itself is charged at cost while the delivery is not.
      Mobile charging is provided only on plans that carry it and brings the plan's included kilowatt hours, enough to reach a charging point rather than to complete a journey.
      A completed callout consumes one credit whatever the service given, so a tow and a jump start each cost one callout, and a callout with no credit left is charged at the plan's additional callout price instead of being refused.
      Where the vehicle was on a marketplace trip when it failed, the trip is dealt with under the trip rules and the callout under these, and neither decides the other.
    eligibility: []
    params:
      per_tier:
        Keyturn Roadside Basic Cover: {tow_miles_included_per_callout: "=tow_miles_included_per_callout", tow_overage_rate_per_mile: "=tow_overage_rate_per_mile", tow_destination_choice: "=tow_destination_choice", fuel_delivery_gallons_included: "=fuel_delivery_gallons_included", fuel_cost_charged_to_member: "=fuel_cost_charged_to_member", ev_charge_kwh_included: "=ev_charge_kwh_included", winch_recovery_limit_amount: "=winch_recovery_limit_amount", additional_callout_fee_amount: "=additional_callout_fee_amount"}
        Keyturn Roadside Plus Cover: {tow_miles_included_per_callout: "=tow_miles_included_per_callout", tow_overage_rate_per_mile: "=tow_overage_rate_per_mile", tow_destination_choice: "=tow_destination_choice", fuel_delivery_gallons_included: "=fuel_delivery_gallons_included", fuel_cost_charged_to_member: "=fuel_cost_charged_to_member", ev_charge_kwh_included: "=ev_charge_kwh_included", winch_recovery_limit_amount: "=winch_recovery_limit_amount", additional_callout_fee_amount: "=additional_callout_fee_amount"}
        Keyturn Roadside Tow Cover: {tow_miles_included_per_callout: "=tow_miles_included_per_callout", tow_overage_rate_per_mile: "=tow_overage_rate_per_mile", tow_destination_choice: "=tow_destination_choice", fuel_delivery_gallons_included: "=fuel_delivery_gallons_included", fuel_cost_charged_to_member: "=fuel_cost_charged_to_member", ev_charge_kwh_included: "=ev_charge_kwh_included", winch_recovery_limit_amount: "=winch_recovery_limit_amount", additional_callout_fee_amount: "=additional_callout_fee_amount"}
