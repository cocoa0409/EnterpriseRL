category: roadside
display_name: Keyturn Roadside Assistance

binding:
  holding_table: roadside_subscriptions
  event_tables: [roadside_callouts]
  status_field: status
  variant_field: roadside_plan_name
  quantity_fields:
    callout_credits_remaining: callout_credits

lifecycle:
  states: [applied, active, suspended, lapsed, cancelled]
  transitions:
    - {from: applied, to: active, by: agent, means: The subscription is accepted and cover begins after the waiting period.}
    - {from: applied, to: cancelled, by: user, means: The member withdraws the application before cover begins.}
    - {from: active, to: suspended, by: agent, means: Cover is paused while an unpaid fee or a misuse review is outstanding.}
    - {from: suspended, to: active, by: agent, means: What paused the cover is resolved and dispatch resumes.}
    - {from: active, to: lapsed, by: system, means: The subscription falls away because the fee went unpaid.}
    - {from: suspended, to: lapsed, by: system, means: A suspension runs past the reinstatement window and cover falls away.}
    - {from: lapsed, to: active, by: agent, means: A lapsed subscription is reinstated inside the reinstatement window.}
    - {from: active, to: cancelled, by: user, means: The member ends their own subscription.}
    - {from: suspended, to: cancelled, by: user, means: The member ends a suspended subscription rather than resolving it.}
    - {from: lapsed, to: cancelled, by: system, means: A lapsed subscription passes its reinstatement window and is closed for good.}

accounts:
  - key: callout_credits
    unit: callouts
    meaning: Assistance callouts still included in the current term, granted at activation and renewal and consumed by each completed callout.

parameter_schema:
  callouts_included_per_term: Assistance callouts included in one term.
  term_length_days: Length of one subscription term, in calendar days.
  monthly_subscription_fee_amount: Fee for one month of cover, in USD.
  annual_subscription_fee_amount: Fee for one year of cover paid up front, in USD.
  activation_fee_amount: One-off fee to start the subscription, in USD.
  waiting_period_days: Calendar days after activation before cover may be used.
  minimum_term_days: Shortest period the subscription must run, in calendar days.
  tow_miles_included_per_callout: Towing miles included in one callout.
  tow_overage_rate_per_mile: Price of each towing mile beyond the included distance, in USD.
  tow_destination_choice: Where the vehicle may be towed to, as one of nearest_shop, member_choice or network_shop.
  jump_start_included: Whether a jump start is included (true/false switch).
  lockout_included: Whether a lockout call is included (true/false switch).
  lockout_key_replacement_limit_amount: Ceiling on replacing a key lost on a lockout call, in USD.
  flat_tyre_included: Whether a wheel change is included (true/false switch).
  spare_tyre_fitting_included: Whether fitting the member's own spare is included (true/false switch).
  fuel_delivery_included: Whether fuel delivery is included (true/false switch).
  fuel_delivery_gallons_included: Gallons of fuel delivered at no charge on one callout.
  fuel_cost_charged_to_member: Whether the fuel itself is charged for (true/false switch).
  ev_charge_delivery_included: Whether mobile charging for an electric vehicle is included (true/false switch).
  ev_charge_kwh_included: Kilowatt hours delivered at no charge on one callout.
  winch_recovery_included: Whether winching a vehicle clear is included (true/false switch).
  winch_recovery_limit_amount: Ceiling on one winch recovery, in USD.
  response_time_target_minutes: Minutes within which the plan aims to reach the vehicle.
  service_radius_miles: Distance from the member's home city within which the plan dispatches, in miles.
  out_of_radius_rate_per_mile: Price of each mile beyond the service radius, in USD.
  dispatch_channels_allowed: How assistance may be requested, as a list of dispatch channel values.
  callout_excess_amount: Amount the member pays toward each callout, in USD.
  excess_waived_on_trip: Whether the excess is waived when the vehicle was on a marketplace trip (true/false switch).
  guest_callout_covered: Whether a guest driving the vehicle may call for assistance (true/false switch).
  host_callout_covered: Whether the host may call for assistance between trips (true/false switch).
  additional_callout_fee_amount: Price of a callout once the included allowance is used, in USD.
  credit_rollover_allowed: Whether unused callouts carry into the next term (true/false switch).
  credit_rollover_max_count: Callouts that may carry into the next term.
  credit_expiry_days: Calendar days an unused callout stays usable for.
  duplicate_callout_window_hours: Hours within which a second call for the same fault counts as the same callout.
  cancelled_callout_fee_amount: Fee for cancelling a callout after the operator has set out, in USD.
  no_show_callout_fee_amount: Fee where nobody is with the vehicle when the operator arrives, in USD.
  misuse_review_callouts_count: Callouts in a rolling year that put the subscription in front of a reviewer.
  suspension_after_callouts_count: Callouts in a rolling year after which cover is suspended.
  concierge_replacement_vehicle_included: Whether a replacement vehicle is provided (true/false switch).
  replacement_vehicle_daily_amount: Daily allowance toward a replacement vehicle, in USD.
  trip_interruption_cover_amount: Cover for a trip cut short by a breakdown, in USD.
  overnight_accommodation_cover_amount: Cover for a night away from home after a breakdown, in USD.
  partner_network_only: Whether only network operators may be used (true/false switch).
  reimbursement_submission_days: Calendar days to submit a claim for an out-of-network callout.
  reimbursement_cap_amount: Ceiling on reimbursing an out-of-network callout, in USD.
  claim_documentation_days: Calendar days to supply documents for a reimbursement claim.
  cancellation_notice_days: Calendar days' notice to end the subscription.
  cancellation_refund_percent: Percentage of the unused term returned on cancellation.
  renewal_notice_days: Calendar days before renewal that the member is told.
  auto_renewal_enabled: Whether the term renews without the member acting (true/false switch).
  lapse_after_unpaid_days: Calendar days an unpaid fee may stand before cover falls away.
  reinstatement_window_days: Calendar days after a lapse within which cover may be restored.
  reinstatement_fee_amount: Fee to restore lapsed cover, in USD.
  vehicle_age_max_years: Oldest vehicle the plan will cover, in whole years.
  eligible_value_classes: Listing value classes the plan will cover, as a list of value class names.

