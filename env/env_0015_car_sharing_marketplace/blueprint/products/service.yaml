  - id: service_evt_credits
    subject: [service_credit_granted]
    rule: >-
      The term's included services are granted in full when the plan starts and again at each renewal, granted to the plan rather than to the host.
      Unused services carry into the next term only on the plans that allow it, and no more than the plan's rollover ceiling carries however many are left.
      A carried service expires the plan's expiry period in whole calendar days from the day it was granted, and an expired service is not restored on request.
      A goodwill service may be granted where the network failed to return the vehicle within the plan's turnaround target, and it is granted as its own record so that goodwill and entitlement stay separable.
      No services are granted while the plan is paused, and a plan resumed mid-term resumes with the services it had rather than a fresh allowance.
    eligibility: []
    params:
      per_tier:
        Keyturn Care Essentials Plan: {included_services_per_term: "=included_services_per_term", credit_rollover_allowed: "=credit_rollover_allowed", credit_rollover_max_count: "=credit_rollover_max_count", credit_expiry_days: "=credit_expiry_days", detail_cleans_per_term: "=detail_cleans_per_term", multipoint_inspections_per_term: "=multipoint_inspections_per_term"}
        Keyturn Care Routine Plan: {included_services_per_term: "=included_services_per_term", credit_rollover_allowed: "=credit_rollover_allowed", credit_rollover_max_count: "=credit_rollover_max_count", credit_expiry_days: "=credit_expiry_days", detail_cleans_per_term: "=detail_cleans_per_term", multipoint_inspections_per_term: "=multipoint_inspections_per_term"}
        Keyturn Care Complete Plan: {included_services_per_term: "=included_services_per_term", credit_rollover_allowed: "=credit_rollover_allowed", credit_rollover_max_count: "=credit_rollover_max_count", credit_expiry_days: "=credit_expiry_days", detail_cleans_per_term: "=detail_cleans_per_term", multipoint_inspections_per_term: "=multipoint_inspections_per_term"}
        Keyturn Care Turnaround Plan: {included_services_per_term: "=included_services_per_term", credit_rollover_allowed: "=credit_rollover_allowed", credit_rollover_max_count: "=credit_rollover_max_count", credit_expiry_days: "=credit_expiry_days", detail_cleans_per_term: "=detail_cleans_per_term", multipoint_inspections_per_term: "=multipoint_inspections_per_term"}
        Keyturn Care Fleet Plan: {included_services_per_term: "=included_services_per_term", credit_rollover_allowed: "=credit_rollover_allowed", credit_rollover_max_count: "=credit_rollover_max_count", credit_expiry_days: "=credit_expiry_days", detail_cleans_per_term: "=detail_cleans_per_term", multipoint_inspections_per_term: "=multipoint_inspections_per_term"}
        Keyturn Care Electric Plan: {included_services_per_term: "=included_services_per_term", credit_rollover_allowed: "=credit_rollover_allowed", credit_rollover_max_count: "=credit_rollover_max_count", credit_expiry_days: "=credit_expiry_days", detail_cleans_per_term: "=detail_cleans_per_term", multipoint_inspections_per_term: "=multipoint_inspections_per_term"}
    formula:
      when: credits_delta > 0
      credits_delta: included_services_per_term
  - id: service_evt_invoicing
    subject: [service_excess_charged, service_plan_billed]
    rule: >-
      The monthly plan fee is billed on the plan's billing day, and where that day does not exist in a short month the fee is billed on the last day of that month instead.
      Work outside the allowance is invoiced at the plan's discounted parts rate with labour capped at the plan's hourly ceiling, and a workshop charging above the cap is paid the cap while the host pays nothing more.
      The host pays the plan's per-visit excess where the plan carries one, and the excess is charged once per visit however many jobs the visit covers.
      Work at a workshop outside the network is reimbursed at the plan's out-of-network share of the invoice, capped at the plan's out-of-network ceiling, and only on the plans that reimburse at all.
      Nothing more is met once the plan's spend ceiling for the term has been reached, and the host is told what has been spent rather than discovering it at the next invoice.
      An invoice may be disputed inside the plan's dispute period, counted in whole calendar days from the day the invoice was raised, and work is guaranteed for the plan's warranty period, within which the same fault is put right at no charge.
    eligibility:
      - id: invoice_dispute_window
        applies_to: [service_excess_charged]
        kind: time
        condition: An invoice may be disputed inside the plan's dispute period, counted in whole calendar days from the day the invoice was raised, and work is guaranteed for the plan's warranty period, within which the same fault is put right at no charge.
        evidence_fields: [service_visits.visit_date, service_visits.visit_id, service_visits.invoice_amount]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[service_visits.visit_id]]
          action_bindings: {service_visits.visit_id: source_visit_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the day the invoice was raised
          anchor_source: service_visits.visit_date
          relation: not_after
          duration_source: params.invoice_dispute_days
          unit: calendar_days
          counting_rule: counted in whole calendar days from the day the invoice was raised
          boundary: inclusive
    params:
      per_tier:
        Keyturn Care Essentials Plan: {monthly_plan_fee_amount: "=monthly_plan_fee_amount", excess_per_visit_amount: "=excess_per_visit_amount", parts_discount_percent: "=parts_discount_percent", labour_rate_cap_amount: "=labour_rate_cap_amount", out_of_network_reimbursement_percent: "=out_of_network_reimbursement_percent", out_of_network_cap_amount: "=out_of_network_cap_amount", annual_spend_cap_amount: "=annual_spend_cap_amount", invoice_dispute_days: "=invoice_dispute_days", warranty_on_work_days: "=warranty_on_work_days", billing_day_change_allowed: "=billing_day_change_allowed"}
        Keyturn Care Routine Plan: {monthly_plan_fee_amount: "=monthly_plan_fee_amount", excess_per_visit_amount: "=excess_per_visit_amount", parts_discount_percent: "=parts_discount_percent", labour_rate_cap_amount: "=labour_rate_cap_amount", out_of_network_reimbursement_percent: "=out_of_network_reimbursement_percent", out_of_network_cap_amount: "=out_of_network_cap_amount", annual_spend_cap_amount: "=annual_spend_cap_amount", invoice_dispute_days: "=invoice_dispute_days", warranty_on_work_days: "=warranty_on_work_days", billing_day_change_allowed: "=billing_day_change_allowed"}
        Keyturn Care Complete Plan: {monthly_plan_fee_amount: "=monthly_plan_fee_amount", excess_per_visit_amount: "=excess_per_visit_amount", parts_discount_percent: "=parts_discount_percent", labour_rate_cap_amount: "=labour_rate_cap_amount", out_of_network_reimbursement_percent: "=out_of_network_reimbursement_percent", out_of_network_cap_amount: "=out_of_network_cap_amount", annual_spend_cap_amount: "=annual_spend_cap_amount", invoice_dispute_days: "=invoice_dispute_days", warranty_on_work_days: "=warranty_on_work_days", billing_day_change_allowed: "=billing_day_change_allowed"}
        Keyturn Care Turnaround Plan: {monthly_plan_fee_amount: "=monthly_plan_fee_amount", excess_per_visit_amount: "=excess_per_visit_amount", parts_discount_percent: "=parts_discount_percent", labour_rate_cap_amount: "=labour_rate_cap_amount", out_of_network_reimbursement_percent: "=out_of_network_reimbursement_percent", out_of_network_cap_amount: "=out_of_network_cap_amount", annual_spend_cap_amount: "=annual_spend_cap_amount", invoice_dispute_days: "=invoice_dispute_days", warranty_on_work_days: "=warranty_on_work_days", billing_day_change_allowed: "=billing_day_change_allowed"}
        Keyturn Care Fleet Plan: {monthly_plan_fee_amount: "=monthly_plan_fee_amount", excess_per_visit_amount: "=excess_per_visit_amount", parts_discount_percent: "=parts_discount_percent", labour_rate_cap_amount: "=labour_rate_cap_amount", out_of_network_reimbursement_percent: "=out_of_network_reimbursement_percent", out_of_network_cap_amount: "=out_of_network_cap_amount", annual_spend_cap_amount: "=annual_spend_cap_amount", invoice_dispute_days: "=invoice_dispute_days", warranty_on_work_days: "=warranty_on_work_days", billing_day_change_allowed: "=billing_day_change_allowed"}
        Keyturn Care Electric Plan: {monthly_plan_fee_amount: "=monthly_plan_fee_amount", excess_per_visit_amount: "=excess_per_visit_amount", parts_discount_percent: "=parts_discount_percent", labour_rate_cap_amount: "=labour_rate_cap_amount", out_of_network_reimbursement_percent: "=out_of_network_reimbursement_percent", out_of_network_cap_amount: "=out_of_network_cap_amount", annual_spend_cap_amount: "=annual_spend_cap_amount", invoice_dispute_days: "=invoice_dispute_days", warranty_on_work_days: "=warranty_on_work_days", billing_day_change_allowed: "=billing_day_change_allowed"}
    formula:
      when: shop_channel == "out_of_network"
      invoice_amount: min(round(invoice_amount * out_of_network_reimbursement_percent / 100, 2), out_of_network_cap_amount)
  - id: service_plan_change
    subject: [service_plan_updated]
    rule: >-
      A host may move the vehicle between care plans, and the move takes effect at the next billing day rather than on the day it is asked for, so that a month already paid for is served on the plan it was bought under.
      Moving to a plan the vehicle does not qualify for is refused, since the age, odometer and fuel limits of the target plan apply on the day the move takes effect.
      The billing day may be moved only on the plans that allow it, and moving it is allowed once in a term so that the fee cannot be pushed ahead of itself month after month.
      A preferred workshop is a preference and not a guarantee, and where it cannot take the vehicle within the plan's turnaround target the network offers another rather than waiting.
      A plan change never changes an allowance already granted for the current term, and the new plan's allowance is granted from the term that follows.
    eligibility: []
    params:
      per_tier:
        Keyturn Care Essentials Plan: {billing_day_change_allowed: "=billing_day_change_allowed", term_length_days: "=term_length_days", partner_shop_network_size: "=partner_shop_network_size", inspection_report_delivery_days: "=inspection_report_delivery_days"}
        Keyturn Care Routine Plan: {billing_day_change_allowed: "=billing_day_change_allowed", term_length_days: "=term_length_days", partner_shop_network_size: "=partner_shop_network_size", inspection_report_delivery_days: "=inspection_report_delivery_days"}
        Keyturn Care Complete Plan: {billing_day_change_allowed: "=billing_day_change_allowed", term_length_days: "=term_length_days", partner_shop_network_size: "=partner_shop_network_size", inspection_report_delivery_days: "=inspection_report_delivery_days"}
        Keyturn Care Turnaround Plan: {billing_day_change_allowed: "=billing_day_change_allowed", term_length_days: "=term_length_days", partner_shop_network_size: "=partner_shop_network_size", inspection_report_delivery_days: "=inspection_report_delivery_days"}
        Keyturn Care Fleet Plan: {billing_day_change_allowed: "=billing_day_change_allowed", term_length_days: "=term_length_days", partner_shop_network_size: "=partner_shop_network_size", inspection_report_delivery_days: "=inspection_report_delivery_days"}
        Keyturn Care Electric Plan: {billing_day_change_allowed: "=billing_day_change_allowed", term_length_days: "=term_length_days", partner_shop_network_size: "=partner_shop_network_size", inspection_report_delivery_days: "=inspection_report_delivery_days"}
  - id: service_lifecycle
    subject: [service_plan_paused, service_plan_resumed, service_plan_reinstated, service_plan_ended]
    rule: >-
      A host who takes the vehicle off the road pauses the plan rather than cancelling it, which stops the fee and keeps the allowance already granted.
      One pause runs no longer than the plan allows, counted in whole calendar days from the day the plan was paused, and a plan still paused at the end of that stretch lapses rather than staying paused.
      A plan may be paused no more times than the plan allows over a rolling twelve months, counting stretches rather than days.
      A plan falls away where the fee stays unpaid past the plan's lapse period, counted in whole calendar days from the day it fell due, and may be restored inside the plan's reinstatement window on payment of the plan's reinstatement fee.
      The host ends their own plan, and where the minimum term has not run the plan's cancellation refund percentage of the unused term is returned rather than the whole of it; work already booked is completed and invoiced under the terms that stood when it was booked.
      A plan cancelled outright is not reinstated, and the host who wants the plan again enrols afresh and serves the waiting period again.
    eligibility:
      - id: pause_only_from_active
        applies_to: [service_plan_paused]
        kind: state
        condition: A host who takes the vehicle off the road pauses the plan rather than cancelling it, which stops the fee and keeps the allowance already granted.
        evidence_fields: [service_plans.status, service_plans.care_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[service_plans.care_plan_id]]
          action_bindings: {service_plans.care_plan_id: care_plan_id}
        state_contract:
          field: service_plans.status
          allowed: [active, paused]
    params:
      per_tier:
        Keyturn Care Essentials Plan: {pause_max_days: "=pause_max_days", pause_count_per_year: "=pause_count_per_year", lapse_after_unpaid_days: "=lapse_after_unpaid_days", reinstatement_window_days: "=reinstatement_window_days", reinstatement_fee_amount: "=reinstatement_fee_amount", cancellation_refund_percent: "=cancellation_refund_percent", renewal_notice_days: "=renewal_notice_days", auto_renewal_enabled: "=auto_renewal_enabled"}
        Keyturn Care Routine Plan: {pause_max_days: "=pause_max_days", pause_count_per_year: "=pause_count_per_year", lapse_after_unpaid_days: "=lapse_after_unpaid_days", reinstatement_window_days: "=reinstatement_window_days", reinstatement_fee_amount: "=reinstatement_fee_amount", cancellation_refund_percent: "=cancellation_refund_percent", renewal_notice_days: "=renewal_notice_days", auto_renewal_enabled: "=auto_renewal_enabled"}
