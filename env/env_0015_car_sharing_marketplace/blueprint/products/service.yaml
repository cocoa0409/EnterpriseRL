category: service
display_name: Keyturn Vehicle Care Plan

binding:
  holding_table: service_plans
  event_tables: [service_visits]
  status_field: status
  variant_field: care_plan_name
  quantity_fields:
    service_credits_remaining: service_credits

lifecycle:
  states: [applied, active, paused, lapsed, cancelled]
  transitions:
    - {from: applied, to: active, by: agent, means: The plan is accepted and the vehicle is enrolled with the workshop network.}
    - {from: applied, to: cancelled, by: user, means: The host withdraws the application before the plan starts.}
    - {from: active, to: paused, by: user, means: The host pauses the plan while the vehicle is off the road.}
    - {from: paused, to: active, by: user, means: The host restarts a paused plan.}
    - {from: active, to: lapsed, by: system, means: The plan falls away because the monthly fee went unpaid.}
    - {from: paused, to: lapsed, by: system, means: A pause runs past its limit and the plan falls away.}
    - {from: lapsed, to: active, by: agent, means: A lapsed plan is restored inside the reinstatement window.}
    - {from: active, to: cancelled, by: user, means: The host ends their own care plan.}
    - {from: paused, to: cancelled, by: user, means: The host ends a paused plan rather than restarting it.}
    - {from: lapsed, to: cancelled, by: system, means: A lapsed plan passes its reinstatement window and is closed for good.}

accounts:
  - key: service_credits
    unit: services
    meaning: Included workshop services still unused in the current term, granted when the plan starts or renews and consumed by each completed visit.

parameter_schema:
  included_services_per_term: Workshop services included in one term.
  term_length_days: Length of one plan term, in calendar days.
  monthly_plan_fee_amount: Fee for one month of the plan, in USD.
  enrollment_fee_amount: One-off fee to enrol the vehicle, in USD.
  waiting_period_days: Calendar days after enrolment before the first included service may be booked.
  minimum_term_days: Shortest period the plan must run, in calendar days.
  oil_change_included: Whether an oil and filter change is included (true/false switch).
  oil_change_interval_miles: Miles between two included oil changes.
  tyre_rotation_included: Whether a tyre rotation is included (true/false switch).
  tyre_rotation_interval_miles: Miles between two included tyre rotations.
  brake_service_included: Whether brake work is included (true/false switch).
  brake_pad_allowance_amount: Allowance toward brake pads and discs in one term, in USD.
  detail_clean_included: Whether an interior and exterior detail is included (true/false switch).
  detail_cleans_per_term: Detail cleans included in one term.
  multipoint_inspection_included: Whether a multi-point inspection is included (true/false switch).
  multipoint_inspections_per_term: Multi-point inspections included in one term.
  wiper_battery_included: Whether wiper blades and the starter battery are included (true/false switch).
  recall_repair_coordination_included: Whether the plan arranges recall work with a franchised dealer (true/false switch).
  tyre_replacement_allowance_amount: Allowance toward replacement tyres in one term, in USD.
  tyre_tread_minimum_thirty_seconds: Tread depth at which a tyre must be replaced, in thirty-seconds of an inch.
  parts_discount_percent: Discount on parts outside the allowance, as a percentage.
  labour_rate_cap_amount: Highest hourly labour rate the plan will meet, in USD.
  out_of_network_reimbursement_percent: Share of an out-of-network invoice the plan reimburses, as a percentage.
  out_of_network_cap_amount: Ceiling on reimbursing one out-of-network visit, in USD.
  mobile_technician_included: Whether a technician may come to the vehicle (true/false switch).
  mobile_technician_surcharge_amount: Surcharge for a mobile visit, in USD.
  booking_lead_days: Calendar days ahead a visit must be booked.
  reschedule_notice_hours: Hours before a visit by which it may be rescheduled at no charge.
  cancellation_notice_hours: Hours before a visit by which it may be cancelled at no charge.
  no_show_fee_amount: Fee where the vehicle is not brought in, in USD.
  turnaround_target_hours: Hours the network aims to return the vehicle within.
  courtesy_vehicle_included: Whether a courtesy vehicle is provided during the work (true/false switch).
  courtesy_vehicle_daily_amount: Daily allowance toward a courtesy vehicle, in USD.
  pickup_and_return_included: Whether the vehicle is collected and returned (true/false switch).
  pickup_radius_miles: Distance within which the vehicle is collected, in miles.
  credit_rollover_allowed: Whether unused services carry into the next term (true/false switch).
  credit_rollover_max_count: Services that may carry into the next term.
  credit_expiry_days: Calendar days an unused service stays usable for.
  excess_per_visit_amount: Amount the host pays toward each visit, in USD.
  annual_spend_cap_amount: Ceiling on what the plan will meet in one term, in USD.
  invoice_dispute_days: Calendar days after an invoice within which the host may dispute it.
  warranty_on_work_days: Calendar days the network guarantees its own work for.
  inspection_report_delivery_days: Business days after a visit before the report reaches the host.
  partner_shop_network_size: Workshops in the network available to this plan.
  billing_day_change_allowed: Whether the host may move the billing day (true/false switch).
  cancellation_refund_percent: Percentage of the unused term returned on cancellation.
  renewal_notice_days: Calendar days before renewal that the host is told.
  auto_renewal_enabled: Whether the term renews without the host acting (true/false switch).
  lapse_after_unpaid_days: Calendar days an unpaid fee may stand before the plan falls away.
  pause_max_days: Longest the plan may stay paused in one stretch, in calendar days.
  pause_count_per_year: Times the plan may be paused in a rolling year.
  reinstatement_window_days: Calendar days after a lapse within which the plan may be restored.
  reinstatement_fee_amount: Fee to restore a lapsed plan, in USD.
  vehicle_age_max_years: Oldest vehicle the plan accepts, in whole years.
  vehicle_odometer_max_miles: Highest odometer reading the plan accepts, in miles.
  eligible_fuel_types: The fuel types the plan services, as a list of fuel type values.

