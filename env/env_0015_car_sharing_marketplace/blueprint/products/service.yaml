events:
  - type: service_plan_opened
    target: service_plans
    mutation: create
    meaning: A host puts one of their vehicles on a care plan.
    grain: One row per vehicle a host enrols for servicing.
    fields:
      care_plan_id: Reference number of the care plan.
      customer_id: The host who holds it.
      vehicle_id: The vehicle to be serviced.
      care_plan_name: The plan applied for.
      status: Lifecycle state, which a new plan enters as applied.
      started_date: Date the plan is asked to begin.
      next_service_due_date: Date the first included service falls due.
      service_credits_remaining: Included services, zero until the plan starts.
      billing_day: Day of the month the plan is billed on.
      preferred_shop_reference: The workshop the host asks to be sent to.
    triggers: []
  - type: service_plan_activated
    target: service_plans
    mutation: {transition: {from: applied, to: active}}
    meaning: The plan starts and the term's included services are granted.
    grain: One row per plan, updated once when it starts.
    fields:
      status: Lifecycle state, which becomes active.
      started_date: First date the plan runs from.
      next_service_due_date: Date the first included service falls due.
    triggers:
      - event: service:service_credit_granted
        map: {customer_id: customer_id, care_plan_id: care_plan_id, service_code: none, outcome: completed}
  - type: service_plan_paused
    target: service_plans
    mutation: {transition: {from: active, to: paused}}
    meaning: The host pauses the plan while the vehicle is off the road.
    grain: One row per plan, updated once per pause.
    fields:
      status: Lifecycle state, which becomes paused.
    triggers: []
  - type: service_plan_resumed
    target: service_plans
    mutation: {transition: {from: paused, to: active}}
    meaning: The host restarts a paused plan and billing begins again.
    grain: One row per plan, updated once per restart.
    fields:
      status: Lifecycle state, which becomes active.
      next_service_due_date: The next service date once the plan restarts.
    triggers: []
  - type: service_plan_reinstated
    target: service_plans
    mutation: {transition: {from: lapsed, to: active}}
    meaning: A plan that had fallen away is restored inside the reinstatement window.
    grain: One row per plan, updated once per reinstatement.
    fields:
      status: Lifecycle state, which becomes active.
      started_date: Date the plan runs from again.
      next_service_due_date: The next service date once the plan is back.
    triggers: []
  - type: service_plan_ended
    target: service_plans
    mutation: {transition: [{from: active, to: cancelled}, {from: paused, to: cancelled}, {from: active, to: lapsed}, {from: paused, to: lapsed}, {from: lapsed, to: cancelled}, {from: applied, to: cancelled}]}
    meaning: The care plan comes to an end, whether the host ended it or it fell away.
    grain: One row per plan, updated once when it ends.
    fields:
      status: Lifecycle state, which becomes lapsed or cancelled.
      ended_date: Date the plan ceased.
    triggers: []
  - type: service_plan_updated
    target: service_plans
    mutation: update
    meaning: The host changes plan, moves the billing day or names a different preferred workshop.
    grain: One row per plan, updated once per accepted change.
    fields:
      care_plan_name: The plan the vehicle moves to.
      billing_day: The day of the month the plan is billed on from now on.
      preferred_shop_reference: The workshop the host now asks for.
    triggers: []

  - type: service_credit_granted
    target: service_visits
    meaning: Included services are added to the plan when it starts, when it renews, or as a goodwill gesture.
    grain: One row per grant of included services to one plan.
    account: service_credits
    direction: in
    distinguish_by: [visit_date, credits_delta, shop_channel]
    fields:
      visit_id: Reference number of the record.
      care_plan_id: The plan the services are granted to.
      customer_id: The host holding the plan.
      vehicle_id: The vehicle the plan covers.
      event_type: Event family of the record.
      visit_date: Date the services were granted.
      credits_delta: Services added, always positive here.
      shop_channel: How the grant was recorded.
      service_code: Not applicable on a grant.
      outcome: How the grant was recorded.
    triggers: []
  - type: service_visit_completed
    target: service_visits
    meaning: Work is carried out on the vehicle and the visit consumes an included service.
    grain: One row per completed visit on one plan.
    account: service_credits
    direction: out
    distinguish_by: [visit_date, service_code, odometer_reading, shop_channel]
    fields:
      visit_id: Reference number of the record.
      care_plan_id: The plan the visit was booked under.
      customer_id: The host whose vehicle was serviced.
      vehicle_id: The vehicle serviced.
      event_type: Event family of the record.
      visit_date: Date of the visit.
      service_code: The work carried out.
      credits_delta: Services consumed, always negative here.
      shop_channel: Where the work was carried out.
      odometer_reading: Odometer recorded at the visit.
      outcome: How the visit ended.
    triggers:
      - event: listings:listings_odometer_reported
        map: {customer_id: customer_id, vehicle_id: vehicle_id, inspection_channel: partner_shop}
      - event: service:service_excess_charged
        when: {shop_channel: out_of_network}
        map: {customer_id: customer_id, care_plan_id: care_plan_id, outcome: billed}
  - type: service_excess_charged
    target: service_visits
    meaning: The host is invoiced the excess, the work beyond the allowance or an out-of-network shortfall.
    grain: One row per invoice raised against one visit.
    distinguish_by: [visit_date, invoice_amount, source_visit_id]
    fields:
      visit_id: Reference number of the record.
      care_plan_id: The plan the invoice belongs to.
      customer_id: The host being invoiced.
      vehicle_id: The vehicle the work was done on.
      source_visit_id: The visit the invoice belongs to.
      event_type: Event family of the record.
      visit_date: Date the invoice was raised.
      invoice_amount: Money invoiced to the host.
      service_code: The work the invoice arises from.
      shop_channel: Where the work was carried out.
      outcome: How the visit ended.
    triggers: []
  - type: service_visit_missed
    target: service_visits
    meaning: A booked visit does not happen, whether the vehicle was not brought in or the workshop turned it away.
    grain: One row per missed visit on one plan.
    distinguish_by: [visit_date, source_visit_id, outcome]
    fields:
      visit_id: Reference number of the record.
      care_plan_id: The plan the visit was booked under.
      customer_id: The host who booked it.
      vehicle_id: The vehicle that was to be serviced.
      source_visit_id: The booking that was missed.
      event_type: Event family of the record.
      visit_date: Date the visit was to have happened.
      service_code: The work that was to have been done.
      shop_channel: Where the work was to have been done.
      invoice_amount: Any fee charged for the missed visit.
      outcome: Why the visit did not happen.
    triggers: []
  - type: service_plan_billed
    target: service_visits
    meaning: The monthly plan fee is billed to the host on the plan's billing day.
    grain: One row per monthly billing run on one plan.
    distinguish_by: [visit_date, invoice_amount, outcome]
    fields:
      visit_id: Reference number of the record.
      care_plan_id: The plan being billed.
      customer_id: The host being billed.
      vehicle_id: The vehicle the plan covers.
      event_type: Event family of the record.
      visit_date: Date the fee was billed.
      invoice_amount: The fee billed.
      shop_channel: How the billing was recorded.
      service_code: Not applicable on a billing run.
      outcome: How the billing run ended.
    triggers: []

measures:
  - id: service_msr_visits_12m
    window: Rolling 12 calendar months counted back from the handling date, the handling date included.
    measure: Count of service_visit_completed records on this plan.
  - id: service_msr_spend_current_term
    window: From the first day of the current plan term to the handling date.
    measure: Sum of invoice_amount over this plan's visit and invoice records in the term.

policies:
  - id: service_agg_multi_holding
    subject: [service_plan_opened]
    rule: >-
      A care plan covers one vehicle, so a host may hold as many plans as they have vehicles and there is no ceiling on the number.
      One vehicle carries one live plan, and a second application on a vehicle already on a plan is a plan change rather than a second plan.
      Each plan carries its own allowance and its own spend ceiling, and an allowance unused on one vehicle is never drawn on for another.
    eligibility: []
    params: {max_per_customer: null}
  - id: service_agg_fleet_spend
    subject: [service_plan_opened, service_visit_completed]
    rule: >-
      A host's care plans are read together when the marketplace judges spend, even though the allowance is held vehicle by vehicle.
      Completed visits are counted across every plan the host holds over the rolling twelve months, and a host whose pattern of visits looks like repair rather than maintenance is put in front of a reviewer whichever vehicles the visits fell on.
      Where a host holds plans on several vehicles the network offers the shortest turnaround target among the plans held, because the workshop network schedules on the host rather than on the vehicle.
      An unpaid plan fee on any one vehicle stops bookings on all of them, since the network does not take in work for a host who owes it money.
    eligibility: []
    params:
      per_tier:
        Keyturn Care Essentials Plan: {annual_spend_cap_amount: "=annual_spend_cap_amount", turnaround_target_hours: "=turnaround_target_hours"}
        Keyturn Care Routine Plan: {annual_spend_cap_amount: "=annual_spend_cap_amount", turnaround_target_hours: "=turnaround_target_hours"}
        Keyturn Care Complete Plan: {annual_spend_cap_amount: "=annual_spend_cap_amount", turnaround_target_hours: "=turnaround_target_hours"}
        Keyturn Care Turnaround Plan: {annual_spend_cap_amount: "=annual_spend_cap_amount", turnaround_target_hours: "=turnaround_target_hours"}
        Keyturn Care Fleet Plan: {annual_spend_cap_amount: "=annual_spend_cap_amount", turnaround_target_hours: "=turnaround_target_hours"}
        Keyturn Care Electric Plan: {annual_spend_cap_amount: "=annual_spend_cap_amount", turnaround_target_hours: "=turnaround_target_hours"}
    measures: [service_msr_visits_12m, service_msr_spend_current_term]
  - id: service_enrollment
    subject: [service_plan_opened, service_plan_activated]
    rule: >-
      A vehicle is accepted onto a plan only where it is no older than the plan's age limit and its odometer is below the plan's ceiling, both read from the listing record rather than from what the host says.
      A plan is written only for the fuel types it services, so an electric vehicle is not put on a plan built around oil changes and a combustion vehicle is not put on the electric plan; the host is moved to the plan that fits rather than enrolled on one that cannot serve them.
      The first included service may be booked only once the plan's waiting period has run, counted in whole calendar days from the day the plan was accepted, with the day of acceptance itself not counted, so that a plan is not taken out to pay for work already needed.
      The enrolment fee, where the plan charges one, falls due when the plan starts and is not returned if the host cancels inside the minimum term.
      The vehicle must carry a live listing on the marketplace, because the care plan exists to keep a working listing on the road and not to service a private vehicle at marketplace rates.
    eligibility:
      - id: waiting_period_elapsed
        applies_to: [service_plan_activated]
        kind: time
        condition: The first included service may be booked only once the plan's waiting period has run, counted in whole calendar days from the day the plan was accepted, with the day of acceptance itself not counted, so that a plan is not taken out to pay for work already needed.
        evidence_fields: [service_plans.started_date, service_plans.care_plan_id, service_plans.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[service_plans.care_plan_id]]
          action_bindings: {service_plans.care_plan_id: care_plan_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the plan's waiting period has run
          anchor_source: service_plans.started_date
          relation: not_before
          duration_source: params.waiting_period_days
          unit: calendar_days
          counting_rule: counted in whole calendar days from the day the plan was accepted, with the day of acceptance itself not counted
          boundary: inclusive
      - id: vehicle_listing_live
        applies_to: [service_plan_opened]
        kind: state
        condition: The vehicle must carry a live listing on the marketplace, because the care plan exists to keep a working listing on the road and not to service a private vehicle at marketplace rates.
        evidence_fields: [listings_vehicles.status, listings_vehicles.vehicle_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[listings_vehicles.vehicle_id]]
          action_bindings: {listings_vehicles.vehicle_id: vehicle_id}
        state_contract:
          field: listings_vehicles.status
          allowed: [listed, snoozed]
    params:
      per_tier:
        Keyturn Care Essentials Plan: {waiting_period_days: "=waiting_period_days", vehicle_age_max_years: "=vehicle_age_max_years", vehicle_odometer_max_miles: "=vehicle_odometer_max_miles", eligible_fuel_types: "=eligible_fuel_types", enrollment_fee_amount: "=enrollment_fee_amount", minimum_term_days: "=minimum_term_days"}
        Keyturn Care Routine Plan: {waiting_period_days: "=waiting_period_days", vehicle_age_max_years: "=vehicle_age_max_years", vehicle_odometer_max_miles: "=vehicle_odometer_max_miles", eligible_fuel_types: "=eligible_fuel_types", enrollment_fee_amount: "=enrollment_fee_amount", minimum_term_days: "=minimum_term_days"}
        Keyturn Care Complete Plan: {waiting_period_days: "=waiting_period_days", vehicle_age_max_years: "=vehicle_age_max_years", vehicle_odometer_max_miles: "=vehicle_odometer_max_miles", eligible_fuel_types: "=eligible_fuel_types", enrollment_fee_amount: "=enrollment_fee_amount", minimum_term_days: "=minimum_term_days"}
        Keyturn Care Turnaround Plan: {waiting_period_days: "=waiting_period_days", vehicle_age_max_years: "=vehicle_age_max_years", vehicle_odometer_max_miles: "=vehicle_odometer_max_miles", eligible_fuel_types: "=eligible_fuel_types", enrollment_fee_amount: "=enrollment_fee_amount", minimum_term_days: "=minimum_term_days"}
        Keyturn Care Fleet Plan: {waiting_period_days: "=waiting_period_days", vehicle_age_max_years: "=vehicle_age_max_years", vehicle_odometer_max_miles: "=vehicle_odometer_max_miles", eligible_fuel_types: "=eligible_fuel_types", enrollment_fee_amount: "=enrollment_fee_amount", minimum_term_days: "=minimum_term_days"}
        Keyturn Care Electric Plan: {waiting_period_days: "=waiting_period_days", vehicle_age_max_years: "=vehicle_age_max_years", vehicle_odometer_max_miles: "=vehicle_odometer_max_miles", eligible_fuel_types: "=eligible_fuel_types", enrollment_fee_amount: "=enrollment_fee_amount", minimum_term_days: "=minimum_term_days"}
  - id: service_evt_visit
    subject: [service_visit_completed, service_visit_missed]
    rule: >-
      A visit is booked the plan's lead time ahead, and a booking made at shorter notice is taken where the network has room but carries no turnaround promise.
      The work a visit may carry is the work the plan includes, at the intervals the plan sets, and an oil change asked for before the plan's mileage interval has run is chargeable work rather than an included service.
      A completed visit consumes one included service whatever the work done, so a detail and a brake service each cost one service, and a visit taken with no service left is invoiced in full at the plan's discounted parts and capped labour rates.
      A visit may be rescheduled at no charge up to the plan's rescheduling notice in whole elapsed hours before it, and cancelled at no charge up to the plan's cancellation notice; inside either, the plan's missed visit fee applies.
      A vehicle not brought in at all carries the missed visit fee and consumes no service, since no work was done.
      Visits are recorded only while the plan is in the active state, so a paused or lapsed plan books nothing and a visit taken while the plan was paused is invoiced in full.
    eligibility:
      - id: visit_only_while_active
        applies_to: [service_visit_completed]
        kind: state
        condition: Visits are recorded only while the plan is in the active state, so a paused or lapsed plan books nothing and a visit taken while the plan was paused is invoiced in full.
        evidence_fields: [service_plans.status, service_plans.care_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[service_plans.care_plan_id]]
          action_bindings: {service_plans.care_plan_id: care_plan_id}
        state_contract:
          field: service_plans.status
          allowed: [active]
