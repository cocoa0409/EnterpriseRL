      history:
        - {table: guestplan_charges, aggregate: sum, field: charge_amount, within_months: null, filters: {charge_basis: daily_protection_fee}}
        - {table: guestplan_charges, aggregate: sum, field: charge_amount, within_months: null, filters: {charge_basis: secondary_driver_fee}}
        - {table: guestplan_charges, aggregate: sum, field: charge_amount, within_months: null, filters: {charge_basis: young_driver_protection_surcharge}}
        - {table: guestplan_charges, aggregate: sum, field: charge_amount, within_months: null, filters: {charge_basis: protection_refund}}
        - {table: guestplan_charges, aggregate: count, field: protection_charge_id, within_months: null, filters: {charge_basis: level_upgrade_difference}}
        - {table: guestplan_change_requests, aggregate: latest, field: requested_level_name, within_months: null, filters: {request_status: approved}}
        - {category: trips, table: trips_charges, aggregate: count, field: charge_id, within_months: 12, filters: {charge_basis: young_driver_surcharge}}
      cross_category: [trips]
  - id: guestplan_ext_level_election_cover
    base_policy_refs: [guestplan_agg_claim_history, guestplan_election_eligibility, guestplan_evt_fee_charging]
    overwrite:
      - base_policy: guestplan_evt_fee_charging
        superseded_clause: >-
          Charged days are the whole days of the trip as reserved, with any part day counted as a whole day, and never fewer than the level's minimum charge days.
        replaced_by: >-
          The covered days of an election are therefore the plan days of the trip with the handover grace and the late-return allowance added to them, held to the cover ceiling that applies.
    trigger: state_due
    subject: [guestplan_election_confirmed]
    computes: covered_days_count
    target_tool: confirm_protection_level_63b6fff8
    params:
      hours_in_a_day: 24
      minimum_cover_days: 1
      long_plan_week_days: 7
      airport_grace_days: 2
      delivered_grace_days: 1
      collected_grace_days: 0
      repeat_late_return_count: 2
      single_late_return_count: 1
      long_late_cover_days: 3
      short_late_cover_days: 2
      no_late_cover_days: 0
      long_reserved_hours: 1400
      medium_reserved_hours: 360
      long_cover_ceiling_days: 120
      medium_cover_ceiling_days: 90
      standard_cover_ceiling_days: 30
    rule: >-
      When a guest settles the protection that will run on a trip, the marketplace fixes at the same time how many
      days of cover the election will carry, so that the guest is told which day cover ends on rather than
      discovering it at a claim.
      The covered days of an election are the reserved hours of the trip divided by the hours in a day and rounded
      up to a whole day, never fewer than the minimum cover days, and never more than the standard cover ceiling.
      The plan days are the stretch of the trip the cover is metered over, and how they are counted follows the
      rate plan the trip is priced under. Where the trip is priced on the extended stay plan, the plan days are the
      whole weeks of the reserved period, each counted as the long plan week days and any part week counted as a
      whole week. Where the trip is priced on the monthly plan or on the weekly plan, the plan days are the
      calendar days from the first reserved day to the last reserved day, both days included. Where the trip is
      priced on any other plan, the plan days are the reserved hours divided by the hours in a day and rounded up
      to a whole day, never fewer than the minimum cover days.
      A handover grace is added for the day the vehicle changes hands, since cover begins when the vehicle changes
      hands rather than at the reserved hour. Where the vehicle is delivered to the guest at an airport, the
      airport grace days are added; where the vehicle is delivered to the guest anywhere else, the delivered grace
      days are added; where the guest collects the vehicle themselves, the collected grace days are added.
      A late-return allowance is added in advance for a guest whose trips have run past their scheduled return,
      since a trip that runs late stays covered on the same level for the late period. Where the guest's trips
      carry the repeat late return count or more late returns charged over the last twelve months and the trip is
      priced on the extended stay plan or on the monthly plan, the long late cover days are added; where the
      guest's trips carry exactly the single late return count of late return charged over the last twelve months
      and the trip is priced on the extended stay plan or on the monthly plan, the short late cover days are added;
      in every other case no late cover days are added.
      The covered days are held to a ceiling that follows how long the vehicle is reserved for. Where the booking
      reserves the long reserved hours or more, the long cover ceiling days apply; where the booking reserves the
      medium reserved hours or more but fewer than the long reserved hours, the medium cover ceiling days apply;
      where the booking reserves fewer, the standard cover ceiling days apply.
      The covered days of an election are therefore the plan days of the trip with the handover grace and the
      late-return allowance added to them, held to the cover ceiling that applies.
    prerequisite: []
    cross_category:
      - category: trips
        as: history
        reads: [rate_plan_name, trip_start_date, trip_end_date, reserved_hours_total, delivery_location_type, trips_charges.charge_basis, trips_charges.charge_date]
        note: The plan days are decided from the rate plan and the reserved period of the trip and the cover ceiling from the hours the booking reserves, the handover grace from where the vehicle is delivered, and the late-return allowance from the guest's own trip ledger.
    compute:
      - trip_first_day: "CFIELD('trips', 'trip_start_date', booking_id=F('booking_id'))"
      - trip_last_day: "CFIELD('trips', 'trip_end_date', booking_id=F('booking_id'))"
      - reserved_hours: "float(CFIELD('trips', 'reserved_hours_total', booking_id=F('booking_id')))"
      - reserved_span_days: "DAYS(trip_first_day, trip_last_day) + 1"
      - trip_plan: "CFIELD('trips', 'rate_plan_name', booking_id=F('booking_id'))"
      - cover_ceiling: "K('long_cover_ceiling_days') if reserved_hours >= K('long_reserved_hours') else (K('medium_cover_ceiling_days') if reserved_hours >= K('medium_reserved_hours') else K('standard_cover_ceiling_days'))"
      - plan_days: "(K('long_plan_week_days') * int((reserved_span_days + K('long_plan_week_days') - 1) / K('long_plan_week_days'))) if trip_plan == 'Keyturn Extended Stay Rate Plan' else (reserved_span_days if (trip_plan == 'Keyturn Monthly Rate Plan' or trip_plan == 'Keyturn Weekly Rate Plan') else MX(K('minimum_cover_days'), int((reserved_hours + K('hours_in_a_day') - 1) / K('hours_in_a_day'))))"
      - delivery_kind: "CFIELD('trips', 'delivery_location_type', booking_id=F('booking_id'))"
      - handover_grace: "K('airport_grace_days') if delivery_kind == 'airport' else (K('delivered_grace_days') if delivery_kind != 'none' else K('collected_grace_days'))"
      - trips_late_return_12m: "XCOUNT('trips', 'trips_charges', within_months=12, date_field='charge_date', charge_basis='late_return')"
