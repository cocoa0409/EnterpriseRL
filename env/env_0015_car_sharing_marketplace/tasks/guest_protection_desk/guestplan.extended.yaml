      earlier_move_lines: "Where cover is already running and the election's charge lines already carry a difference charged for an earlier move of level, the repeat move fee is added; where cover is already running and the election's charge lines carry no earlier difference charged for a move of level, the first move fee is added; where cover has not yet begun, no change fee is added."
      change_fee: "A change fee is added where the move is made once the trip has begun."
