  - id: guestplan_ext_level_change_difference
    base_policy_refs: [guestplan_level_change, guestplan_evt_fee_charging]
    overwrite:
      - base_policy: guestplan_level_change
        superseded_clause: >-
          Where that basis is the remaining whole days, the difference between the two levels' daily fees is charged for the days left in the trip counted from the day of the change, the day of the change itself included.
        replaced_by: >-
          The difference due on a move of level is therefore the cost of the level moved to for the days still to run reduced by the move discount, less the credit for the cover already paid for over those same days, with the change fee, the young-driver step and the party step added to that figure in turn, and the whole rounded half up to the cent at the end.
      - base_policy: guestplan_level_change
        superseded_clause: >-
          A change made once the trip has started carries the level's mid-trip change fee where the level has one, posted as part of the same line rather than separately.
        replaced_by: >-
          A change fee is added where the move is made once the trip has begun.
    trigger: on_request
    subject: [guestplan_level_change_charged]
    computes: difference_amount
    target_tool: price_level_change_f4995b0a
    params:
      level_daily_declined: 0.00
      level_daily_minimum: 14.00
      level_daily_standard: 26.00
      level_daily_advantage: 38.00
      level_daily_premier: 52.00
      level_daily_business: 64.00
      level_share_declined: 0
      level_share_minimum: 15
      level_share_standard: 25
      level_share_advantage: 35
      level_share_premier: 45
      level_share_business: 40
      long_cover_day_threshold: 30
      half_share_of_days: 0.5
      reserved_month_threshold: 1
      long_move_discount_rate: 12.0
      short_move_discount_rate: 6.0
      no_move_discount_rate: 0.0
      repeat_move_fee_amount: 45.00
      first_move_fee_amount: 20.00
      no_change_fee_amount: 0.00
      rate_band_amount: 100.00
      high_young_move_step_amount: 55.00
      low_young_move_step_amount: 30.00
      no_young_move_step_amount: 0.00
      two_driver_threshold: 2
      one_driver_threshold: 1
      larger_party_step_amount: 60.00
      smaller_party_step_amount: 30.00
      no_party_step_amount: 0.00
    rule: >-
      A guest who moves up to a protection level of higher rank than the one first held is charged the difference
      between what the level moved to costs for the days of the trip still to run and the cover already paid for
      over those same days, and the difference is posted against the protection fee line raised for the level first
      held.
      The difference due on a move of level is worked out only after the protection already charged on the election
      for the level first held stands complete, the young-driver surcharge included.
      The days still to run are counted from the day the move is priced to the last reserved day of the trip, the
      day the move is priced included.
      The difference due on a move of level is the level moved to at its daily amount for the days still to run,
      less a credit at the daily amount of the level first held for those same days, and the whole is rounded to two
      decimal places only once it has been worked out.
      The cost of the level moved to follows the basis on which that level arrives at its fee. Where the level moved
      to arrives at its fee as the greater of its daily amount and its share of the trip price, its cost for the
      days still to run is the greater of its daily amount for those days and its share of the trip price for those
      days. Where the level moved to arrives at its fee as a share of the trip price, its cost for the days still to
      run is its share of the trip price for those days. Where the level moved to arrives at its fee as a daily flat
      amount, its cost for the days still to run is its daily amount for those days.
      The protection already charged on the election is the protection fee charged for the trip, the fee for every
      additional driver and the young-driver surcharge, less any protection fee returned against them.
      The credit for the cover already paid for follows how much of the cover has been used. Where cover is already
      running and the election covers the long-cover day threshold or more, the credit is the protection already
      charged on the election spread evenly over the election's covered days and taken for the days still to run.
      Where cover has not yet begun, the credit is the whole of the protection already charged on the election.
      Where cover is already running and the election covers fewer days than the long-cover day threshold, the
      credit is the daily amount of the level first held for the days still to run.
      A move discount is taken off the cost of the level moved to. The move discount is the move discount rate of
      that cost, expressed as a percentage of it. Where half or more of the election's covered days
      are still to run and the trip's reserved period runs for the reserved-month threshold or more whole months,
      the long move discount rate is taken off; where half or more of the election's covered days are still to run
      and the trip's reserved period runs for fewer than the reserved-month threshold whole months, the short move
      discount rate is taken off; where fewer than half of the election's covered days are still to run, no move
      discount is taken off.
      A change fee is added where the move is made once the trip has begun. Where cover is already running and the
      election's charge lines already carry a difference charged for an earlier move of level, the repeat move fee
      is added; where cover is already running and the election's charge lines carry no earlier difference charged
      for a move of level, the first move fee is added; where cover has not yet begun, no change fee is added.
      A young-driver step is added where the trip itself carries a young-driver charge. Where the guest's trips
      carry one or more young-driver surcharges charged over the last twelve months and the daily rate locked in on
      the trip reaches the rate band, the high young-driver move step is added; where the guest's trips carry one or
      more young-driver surcharges charged over the last twelve months and the daily rate locked in on the trip is
      under the rate band, the low young-driver move step is added; where the guest's trips carry no young-driver
      surcharge charged over the last twelve months, no young-driver step is added.
      A party step is added for the drivers the higher cover is extended to. Where the election's charge lines carry
      a fee for the larger party driver count of additional drivers or more, the larger party step is added; where
      they carry a fee for exactly the smaller party driver count of additional driver, the smaller party step is
      added; where they carry no fee for an additional driver, no party step is added.
      The difference due on a move of level is therefore the cost of the level moved to for the days still to run
      reduced by the move discount, less the credit for the cover already paid for over those same days, with the
      change fee, the young-driver step and the party step added to that figure in turn, and the whole rounded half
      up to the cent at the end.
    prerequisite:
      - problem: guestplan_ext_young_driver_surcharge
        kind: value_input
        gate: surcharge_lines_total
        form: state
        policy_source: >-
          The difference due on a move of level is worked out only after the protection already charged on the election for the level first held stands complete, the young-driver surcharge included.
        condition: >-
          The election's charge lines carry the young-driver surcharge owed on the protection for the level first held.
        resolved_by: post_young_driver_surcharge_f46febb9
        effect: >-
          The young-driver surcharge standing on the election rises from nothing to the loading owed, which raises the protection already charged and so the credit set against the cost of the level moved to.
    cross_category:
      - category: trips
        as: history
        reads: [daily_rate_amount, trip_start_date, trip_end_date, trips_charges.charge_basis, trips_charges.charge_date]
        note: The young-driver step is decided from the guest's own trip ledger and from the daily rate locked in on the trip, and the trip price for the days still to run comes from that same locked rate.
    compute:
      - requested_level: "LATEST('guestplan_change_requests', 'requested_level_name', date_field='requested_at', request_status='approved')"
      - old_level_daily: "K('level_daily_declined') if F('protection_level_name') == 'Keyturn Declined Protection' else (K('level_daily_minimum') if F('protection_level_name') == 'Keyturn Minimum Protection' else (K('level_daily_standard') if F('protection_level_name') == 'Keyturn Standard Protection' else (K('level_daily_advantage') if F('protection_level_name') == 'Keyturn Advantage Protection' else (K('level_daily_premier') if F('protection_level_name') == 'Keyturn Premier Protection' else K('level_daily_business')))))"
      - covered_days: "F('coverage_days')"
      - cover_running: "F('status') == 'active'"
      - trip_first_day: "CFIELD('trips', 'trip_start_date', booking_id=F('booking_id'))"
      - trip_last_day: "CFIELD('trips', 'trip_end_date', booking_id=F('booking_id'))"
      - trip_daily_rate: "float(CFIELD('trips', 'daily_rate_amount', booking_id=F('booking_id')))"
      - days_still_to_run: "MX(0, DAYS(NOW, trip_last_day) + 1)"
      - trip_price_for_days_left: "trip_daily_rate * days_still_to_run"
      - reserved_months: "MONTHS(trip_first_day, trip_last_day)"
      - new_level_daily: "K('level_daily_declined') if requested_level == 'Keyturn Declined Protection' else (K('level_daily_minimum') if requested_level == 'Keyturn Minimum Protection' else (K('level_daily_standard') if requested_level == 'Keyturn Standard Protection' else (K('level_daily_advantage') if requested_level == 'Keyturn Advantage Protection' else (K('level_daily_premier') if requested_level == 'Keyturn Premier Protection' else K('level_daily_business')))))"
      - new_level_share: "K('level_share_declined') if requested_level == 'Keyturn Declined Protection' else (K('level_share_minimum') if requested_level == 'Keyturn Minimum Protection' else (K('level_share_standard') if requested_level == 'Keyturn Standard Protection' else (K('level_share_advantage') if requested_level == 'Keyturn Advantage Protection' else (K('level_share_premier') if requested_level == 'Keyturn Premier Protection' else K('level_share_business')))))"
      - new_level_basis: "'daily_flat' if requested_level == 'Keyturn Declined Protection' else ('daily_flat' if requested_level == 'Keyturn Business Traveler Protection' else 'greater_of_daily_and_percent')"
      - new_level_cost: "MX(new_level_daily * days_still_to_run, trip_price_for_days_left * new_level_share / 100) if new_level_basis == 'greater_of_daily_and_percent' else ((trip_price_for_days_left * new_level_share / 100) if new_level_basis == 'percent_of_trip_price' else new_level_daily * days_still_to_run)"
      - fee_lines_total: "SUM('guestplan_charges', 'charge_amount', charge_basis='daily_protection_fee')"
      - driver_lines_total: "SUM('guestplan_charges', 'charge_amount', charge_basis='secondary_driver_fee')"
      - surcharge_lines_total: "SUM('guestplan_charges', 'charge_amount', charge_basis='young_driver_protection_surcharge')"
      - refund_lines_total: "SUM('guestplan_charges', 'charge_amount', charge_basis='protection_refund')"
      - protection_charged: "fee_lines_total + driver_lines_total + surcharge_lines_total + refund_lines_total"
      - credit_for_days_left: "(protection_charged * days_still_to_run / covered_days) if (cover_running and covered_days >= K('long_cover_day_threshold')) else (protection_charged if not cover_running else old_level_daily * days_still_to_run)"
      - days_left_share: "MX(0, DAYS(NOW, trip_last_day) + 1) / covered_days"
      - move_discount_rate: "K('long_move_discount_rate') if (days_left_share >= K('half_share_of_days') and reserved_months >= K('reserved_month_threshold')) else (K('short_move_discount_rate') if (days_left_share >= K('half_share_of_days') and reserved_months < K('reserved_month_threshold')) else K('no_move_discount_rate'))"
      - earlier_move_lines: "COUNT('guestplan_charges', charge_basis='level_upgrade_difference')"
      - change_fee: "K('repeat_move_fee_amount') if (cover_running and earlier_move_lines >= 1) else (K('first_move_fee_amount') if (cover_running and earlier_move_lines == 0) else K('no_change_fee_amount'))"
      - trips_young_driver_12m: "XCOUNT('trips', 'trips_charges', within_months=12, date_field='charge_date', charge_basis='young_driver_surcharge')"
      - young_move_step: "K('high_young_move_step_amount') if (trips_young_driver_12m >= 1 and trip_daily_rate >= K('rate_band_amount')) else (K('low_young_move_step_amount') if (trips_young_driver_12m >= 1 and trip_daily_rate < K('rate_band_amount')) else K('no_young_move_step_amount'))"
      - driver_lines_count: "COUNT('guestplan_charges', charge_basis='secondary_driver_fee')"
      - party_step: "K('larger_party_step_amount') if driver_lines_count >= K('two_driver_threshold') else (K('smaller_party_step_amount') if driver_lines_count == K('one_driver_threshold') else K('no_party_step_amount'))"
      - discounted_new_level_cost: "new_level_cost * (1 - move_discount_rate / 100)"
      - result: "RND(discounted_new_level_cost - credit_for_days_left + change_fee + young_move_step + party_step, 2)"
    compute_basis:
      requested_level: "A guest who moves up to a protection level of higher rank than the one first held is charged the difference between what the level moved to costs for the days of the trip still to run and the cover already paid for over those same days, and the difference is posted against the protection fee line raised for the level first held."
      old_level_daily: "The difference due on a move of level is the level moved to at its daily amount for the days still to run, less a credit at the daily amount of the level first held for those same days, and the whole is rounded half up to the cent only once it has been worked out."
      covered_days: "Where cover is already running and the election covers the long-cover day threshold or more, the credit is the protection already charged on the election spread evenly over the election's covered days and taken for the days still to run."
