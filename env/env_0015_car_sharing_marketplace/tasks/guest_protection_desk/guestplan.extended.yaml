      new_level_daily: "The difference due on a move of level is the level moved to at its daily amount for the days still to run, less a credit at the daily amount of the level first held for those same days, and the whole is rounded half up to the cent only once it has been worked out."
      new_level_share: "Where the level moved to arrives at its fee as the greater of its daily amount and its share of the trip price, its cost for the days still to run is the greater of its daily amount for those days and its share of the trip price for those days."
      new_level_basis: "The cost of the level moved to follows the basis on which that level arrives at its fee."
      new_level_cost: "The cost of the level moved to follows the basis on which that level arrives at its fee."
      fee_lines_total: "Where cover is already running and the election covers the long-cover day threshold or more, the credit is the protection already charged on the election spread evenly over the election's covered days and taken for the days still to run."
