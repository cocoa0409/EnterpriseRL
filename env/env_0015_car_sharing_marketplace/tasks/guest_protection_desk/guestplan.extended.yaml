    compute:
      - level_daily: "K('level_daily_declined') if F('protection_level_name') == 'Keyturn Declined Protection' else (K('level_daily_minimum') if F('protection_level_name') == 'Keyturn Minimum Protection' else (K('level_daily_standard') if F('protection_level_name') == 'Keyturn Standard Protection' else (K('level_daily_advantage') if F('protection_level_name') == 'Keyturn Advantage Protection' else (K('level_daily_premier') if F('protection_level_name') == 'Keyturn Premier Protection' else K('level_daily_business')))))"
      - level_share: "K('level_share_declined') if F('protection_level_name') == 'Keyturn Declined Protection' else (K('level_share_minimum') if F('protection_level_name') == 'Keyturn Minimum Protection' else (K('level_share_standard') if F('protection_level_name') == 'Keyturn Standard Protection' else (K('level_share_advantage') if F('protection_level_name') == 'Keyturn Advantage Protection' else (K('level_share_premier') if F('protection_level_name') == 'Keyturn Premier Protection' else K('level_share_business')))))"
      - level_floor: "K('level_floor_declined') if F('protection_level_name') == 'Keyturn Declined Protection' else (K('level_floor_minimum') if F('protection_level_name') == 'Keyturn Minimum Protection' else (K('level_floor_standard') if F('protection_level_name') == 'Keyturn Standard Protection' else (K('level_floor_advantage') if F('protection_level_name') == 'Keyturn Advantage Protection' else (K('level_floor_premier') if F('protection_level_name') == 'Keyturn Premier Protection' else K('level_floor_business')))))"
      - level_min_charge_days: "K('level_min_days_declined') if F('protection_level_name') == 'Keyturn Declined Protection' else K('level_min_days_other')"
      - level_basis: "'daily_flat' if F('protection_level_name') == 'Keyturn Declined Protection' else ('daily_flat' if F('protection_level_name') == 'Keyturn Business Traveler Protection' else 'greater_of_daily_and_percent')"
      - charged_days: "MX(F('coverage_days'), level_min_charge_days)"
      - trip_first_day: "CFIELD('trips', 'trip_start_date', booking_id=F('booking_id'))"
      - trip_last_day: "CFIELD('trips', 'trip_end_date', booking_id=F('booking_id'))"
      - reserved_days_span: "DAYS(trip_first_day, trip_last_day) + 1"
      - reserved_months: "MONTHS(trip_first_day, trip_last_day)"
      - trip_daily_rate: "float(CFIELD('trips', 'daily_rate_amount', booking_id=F('booking_id')))"
      - trip_price: "trip_daily_rate * reserved_days_span"
      - base_fee: "MX(level_daily * charged_days, trip_price * level_share / 100) if level_basis == 'greater_of_daily_and_percent' else ((trip_price * level_share / 100) if level_basis == 'percent_of_trip_price' else level_daily * charged_days)"
      - trips_base_count_12m: "XCOUNT('trips', 'trips_charges', within_months=12, date_field='charge_date', charge_basis='base_rate')"
      - trips_mileage_overage_12m: "XCOUNT('trips', 'trips_charges', within_months=12, date_field='charge_date', charge_basis='mileage_overage')"
      - loyalty_fee_rate: "K('established_fee_rate') if (trips_base_count_12m >= K('established_trip_count') and trips_mileage_overage_12m == 0) else (K('returning_fee_rate') if (trips_base_count_12m >= K('returning_trip_count') and trips_mileage_overage_12m == 0) else K('standard_fee_rate'))"
      - stay_discount_rate: "K('long_stay_discount_rate') if reserved_days_span >= K('long_stay_days') else (K('medium_stay_discount_rate') if reserved_days_span >= K('medium_stay_days') else K('no_stay_discount_rate'))"
      - trip_fee_ceiling: "K('long_trip_fee_ceiling') if reserved_months >= K('long_reserved_months') else (K('medium_trip_fee_ceiling') if reserved_months >= K('medium_reserved_months') else K('short_trip_fee_ceiling'))"
      - included_miles: "float(CFIELD('trips', 'included_miles_total', booking_id=F('booking_id')))"
      - mileage_step: "K('high_miles_step_amount') if included_miles >= K('high_included_miles') else (K('medium_miles_step_amount') if included_miles >= K('medium_included_miles') else K('no_miles_step_amount'))"
      - discounted_fee: "base_fee * loyalty_fee_rate * (1 - stay_discount_rate / 100)"
      - result: "RND(MN(MX(discounted_fee, level_floor), trip_fee_ceiling) + mileage_step, 2)"
