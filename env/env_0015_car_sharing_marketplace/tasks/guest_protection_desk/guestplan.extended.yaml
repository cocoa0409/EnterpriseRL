      - id: surcharge_ceiling_by_cover_length
        effect: parameter
        decides: surcharge_cap
        bindings: [charged_days_total, surcharge_cap]
        ladder:
          - when: "the protection fee lines standing on the election carry protection for the long-cover day threshold or more"
            value: "K('long_trip_surcharge_ceiling')"
          - when: "the protection fee lines standing on the election carry protection for the medium-cover day threshold or more but fewer than the long-cover day threshold"
            value: "K('medium_trip_surcharge_ceiling')"
          - when: "otherwise"
