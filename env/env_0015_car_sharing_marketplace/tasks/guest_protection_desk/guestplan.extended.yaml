    baseline:
      rule: >-
        When a guest settles the protection that will run on a trip, the marketplace fixes at the same time how many
        days of cover the election will carry, so that the guest is told which day cover ends on rather than
        discovering it at a claim.
        The covered days of an election are the reserved hours of the trip divided by the hours in a day and rounded
        up to a whole day, never fewer than the minimum cover days, and never more than the standard cover ceiling.
      params: [hours_in_a_day, minimum_cover_days, standard_cover_ceiling_days]
    inputs:
      history:
        - {category: trips, table: trips_charges, aggregate: count, field: charge_id, within_months: 12, filters: {charge_basis: late_return}}
      cross_category: [trips]
  - id: guestplan_ext_protection_fee_assessment
    base_policy_refs: [guestplan_evt_fee_charging]
    overwrite:
      - base_policy: guestplan_evt_fee_charging
        superseded_clause: >-
          The fee falls due at the level's billing point, whether at booking, at the start of the trip or daily in arrears, and a level billed daily in arrears posts one line for each completed day rather than one line for the trip.
        replaced_by: >-
          The protection fee for a trip is charged once against the election that carries the cover, on the level the election stands on and for the days of cover the election carries.
      - base_policy: guestplan_evt_fee_charging
        superseded_clause: >-
          Charged days are the whole days of the trip as reserved, with any part day counted as a whole day, and never fewer than the level's minimum charge days.
        replaced_by: >-
          The charged days are the election's covered days, never fewer than the level's minimum charge days.
      - base_policy: guestplan_evt_fee_charging
        superseded_clause: >-
          The fee arrived at is then held between the level's floor and its ceiling, the floor applied first and the ceiling last, so a trip long enough to pass the ceiling pays the ceiling and no more.
        replaced_by: >-
          The protection fee for a trip is therefore the fee the level's basis produces for the charged days, taken at the loyalty rate and then reduced by the long-stay discount, held at the level's floor and then under the trip ceiling that applies, with the mileage step added to that figure, and the whole rounded half up to the cent at the end.
    trigger: state_due
