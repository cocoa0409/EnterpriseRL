      reserved_hours: "The covered days of an election are the reserved hours of the trip divided by the hours in a day and rounded up to a whole day, never fewer than the minimum cover days, and never more than the standard cover ceiling."
      reserved_span_days: "Where the trip is priced on the extended stay plan, the plan days are the whole weeks of the reserved period, each counted as the long plan week days and any part week counted as a whole week."
      trip_plan: "The plan days are the stretch of the trip the cover is metered over, and how they are counted follows the rate plan the trip is priced under."
      cover_ceiling: "Where the booking reserves the long reserved hours or more, the long cover ceiling days apply; where the booking reserves the medium reserved hours or more but fewer than the long reserved hours, the medium cover ceiling days apply; where the booking reserves fewer, the standard cover ceiling days apply."
      plan_days: "The plan days are the stretch of the trip the cover is metered over, and how they are counted follows the rate plan the trip is priced under."
      delivery_kind: "Where the vehicle is delivered to the guest at an airport, the airport grace days are added; where the vehicle is delivered to the guest anywhere else, the delivered grace days are added; where the guest collects the vehicle themselves, the collected grace days are added."
      handover_grace: "A handover grace is added for the day the vehicle changes hands, since cover begins when the vehicle changes hands rather than at the reserved hour."
      trips_late_return_12m: "Where the guest's trips carry the repeat late return count or more late returns charged over the last twelve months and the trip is priced on the extended stay plan or on the monthly plan, the long late cover days are added; where the guest's trips carry exactly the single late return count of late return charged over the last twelve months and the trip is priced on the extended stay plan or on the monthly plan, the short late cover days are added; in every other case no late cover days are added."
      late_return_cover: "A late-return allowance is added in advance for a guest whose trips have run past their scheduled return, since a trip that runs late stays covered on the same level for the late period."
      result: "The covered days of an election are therefore the plan days of the trip with the handover grace and the late-return allowance added to them, held to the cover ceiling that applies."
    factors:
