        decides: young_move_step
        bindings: [trips_young_driver_12m, young_move_step]
        ladder:
          - when: "the guest's trips carry one or more young-driver surcharges charged over the last twelve months and the daily rate locked in on the trip reaches the rate band"
            value: "K('high_young_move_step_amount')"
          - when: "the guest's trips carry one or more young-driver surcharges charged over the last twelve months and the daily rate locked in on the trip is under the rate band"
            value: "K('low_young_move_step_amount')"
          - when: "otherwise"
