            value: "K('long_move_discount_rate')"
          - when: "half or more of the election's covered days are still to run and the trip's reserved period runs for fewer than the reserved-month threshold whole months"
            value: "K('short_move_discount_rate')"
          - when: "otherwise"
            value: "K('no_move_discount_rate')"
        baseline:
