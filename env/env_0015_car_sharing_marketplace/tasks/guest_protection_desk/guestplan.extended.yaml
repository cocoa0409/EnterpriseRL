      result: "The difference due on a move of level is therefore the cost of the level moved to for the days still to run reduced by the move discount, less the credit for the cover already paid for over those same days, with the change fee, the young-driver step and the party step added to that figure in turn, and the whole rounded half up to the cent at the end."
    factors:
      - id: new_level_cost_basis
        effect: method
        decides: new_level_cost
        bindings: [requested_level, new_level_daily, new_level_share, new_level_basis, new_level_cost]
        ladder:
          - when: "the level moved to arrives at its fee as the greater of its daily amount and its share of the trip price"
            method: "its cost for the days still to run is the greater of its daily amount for those days and its share of the trip price for those days"
          - when: "the level moved to arrives at its fee as a share of the trip price"
            method: "its cost for the days still to run is its share of the trip price for those days"
          - when: "the level moved to arrives at its fee as a daily flat amount"
