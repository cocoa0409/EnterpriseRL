      young_move_step: "A young-driver step is added where the trip itself carries a young-driver charge."
      driver_lines_count: "Where the election's charge lines carry a fee for the larger party driver count of additional drivers or more, the larger party step is added; where they carry a fee for exactly the smaller party driver count of additional driver, the smaller party step is added; where they carry no fee for an additional driver, no party step is added."
