    rule: >-
      The protection fee for a trip is charged once against the election that carries the cover, on the level the
      election stands on and for the days of cover the election carries.
      The protection fee for a trip is fixed only once the election has left the quoted state and carries the number
      of days of cover the level will run for.
      The charged days are the election's covered days, never fewer than the level's minimum charge days.
      The protection fee for a trip is the level's daily amount for the charged days, held at the level's floor and
      then under the short trip fee ceiling, and rounded half up to the cent only once the whole of it has been
      worked out.
      The basis the fee is arrived at on is the level's own, and the three bases are not interchangeable. Where the
      level the election stands on arrives at its fee as the greater of its daily amount and its share of the trip
      price, the fee is the greater of the level's daily amount for the charged days and the level's share of the
      trip price. Where the level arrives at its fee as a share of the trip price, the fee is the level's share of
      the trip price. Where the level arrives at its fee as a daily flat amount, the fee is the level's daily amount
      for the charged days. The trip price is the daily rate locked in on the trip taken for each of the reserved
      days.
      The loyalty rate is the share of that fee a guest with a record on the marketplace is asked for, taken on the
      fee the level's basis produces for the charged days and taken before that fee is held at the level's floor or
      under the trip ceiling. Where the
      guest has been charged the trip base rate on the established trip count of trips or more over the last twelve
      months and the guest's trips carry no mileage overage charged in that time, the established fee rate applies;
      where the guest has been charged the trip base rate on the returning trip count of trips or more over the last
      twelve months and the guest's trips carry no mileage overage charged in that time, the returning fee rate
      applies; in every other case the standard fee rate applies.
      A long-stay discount is then taken off, because a guest buying cover for a long reservation buys it in bulk.
      The long-stay discount is the stay discount rate of the figure it is taken off, expressed as a percentage of
      that figure, and it is taken off after the loyalty rate has been applied and before the fee is held at the
      level's floor or under the trip ceiling. Where the reserved period of the trip runs for the long stay days or more, the long stay discount rate is
      taken off; where it runs for the medium stay days or more but fewer than the long stay days, the medium stay
      discount rate is taken off; where it runs for fewer, no stay discount is taken off.
      The ceiling on the protection fee for one trip follows the length of the reservation. Where the reserved
      period runs for the long reserved months or more whole months, the long trip fee ceiling applies; where it
      runs for the medium reserved months or more whole months but fewer than the long reserved months, the medium
      trip fee ceiling applies; where it runs for fewer, the short trip fee ceiling applies.
      A mileage step is added for the exposure the included miles carry. Where the trip includes the high included
      miles or more, the high mileage step is added; where it includes the medium included miles or more but fewer
      than the high included miles, the medium mileage step is added; where it includes fewer, no mileage step is
      added.
      The protection fee for a trip is therefore the fee the level's basis produces for the charged days, taken at
      the loyalty rate and then reduced by the long-stay discount, held at the level's floor and then under the trip
      ceiling that applies, with the mileage step added to that figure, and the whole rounded half up to the cent
      at the end.
    prerequisite:
