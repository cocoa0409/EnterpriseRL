    baseline:
      rule: >-
        The protection fee for a trip is charged once against the election that carries the cover, on the level the
        election stands on and for the days of cover the election carries.
        The charged days are the election's covered days, never fewer than the level's minimum charge days.
        The protection fee for a trip is the level's daily amount for the charged days, held at the level's floor and
        then under the short trip fee ceiling, and rounded half up to the cent only once the whole of it has been
        worked out.
      params: [level_daily_declined, level_daily_minimum, level_daily_standard, level_daily_advantage, level_daily_premier, level_daily_business, level_floor_declined, level_floor_minimum, level_floor_standard, level_floor_advantage, level_floor_premier, level_floor_business, level_min_days_declined, level_min_days_other, short_trip_fee_ceiling]
    inputs:
      history:
        - {category: trips, table: trips_charges, aggregate: count, field: charge_id, within_months: 12, filters: {charge_basis: base_rate}}
        - {category: trips, table: trips_charges, aggregate: count, field: charge_id, within_months: 12, filters: {charge_basis: mileage_overage}}
      cross_category: [trips]
