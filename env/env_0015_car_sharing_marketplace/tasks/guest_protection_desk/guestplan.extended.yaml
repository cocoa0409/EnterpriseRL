events:
  - type: guestplan_election_created
    target: guestplan_elections
    mutation: create
    meaning: A protection quote is opened for one trip, listing what the guest may choose from.
    grain: One row per trip for which protection is quoted.
    fields:
      election_id: Reference number of the election.
      customer_id: The guest the quote is for.
      booking_id: The trip the quote belongs to.
      protection_level_name: The level quoted, which the guest may still change.
      status: Lifecycle state, which a new election enters as quoted.
      elected_date: Date the quote was opened.
      coverage_days: Days of the trip the quote covers, as reserved.
      protection_fee_balance_due: Fee owed, zero at quotation.
      deductible_balance_due: Deductible owed, zero at quotation.
      declared_secondary_driver_count: Additional drivers named on the quote.
      external_insurer_name: The guest's own insurer, where the quote is for declined protection.
      void_reason: Why the election was voided, which is none at quotation.
    triggers: []
  - type: guestplan_election_confirmed
    target: guestplan_elections
    mutation: {transition: {from: quoted, to: elected}}
    meaning: The guest chooses the protection level that will cover the trip.
    grain: One row per election, updated once when the guest chooses.
    fields:
      status: Lifecycle state, which becomes elected.
      protection_level_name: The level the guest chose.
      elected_date: Date the guest chose it.
      external_insurer_name: The guest's own insurer, where they declined marketplace protection.
      declared_secondary_driver_count: Additional drivers the guest declared.
    triggers:
      - event: guestplan:guestplan_protection_fee_charged
        map: {election_id: election_id, customer_id: customer_id, charge_basis: daily_protection_fee, coverage_segment: initial}
  - type: guestplan_election_activated
    target: guestplan_elections
    mutation: {transition: {from: elected, to: active}}
    meaning: The trip starts and the chosen protection begins to cover it.
    grain: One row per election, updated once when cover starts.
    fields:
      status: Lifecycle state, which becomes active.
      effective_date: First date the protection actually covers.
    triggers: []
  - type: guestplan_election_completed
    target: guestplan_elections
    mutation: {transition: {from: active, to: completed}}
    meaning: The trip ends and the protection has run its course.
    grain: One row per election, updated once when cover ends.
    fields:
      status: Lifecycle state, which becomes completed.
      ended_date: Date cover ceased.
      coverage_days: Days actually covered, as finally charged.
    triggers: []
  - type: guestplan_election_expired
    target: guestplan_elections
    mutation: {transition: {from: quoted, to: expired}}
    meaning: The guest never chose a level and the quote lapsed when the trip began.
    grain: One row per election, updated once when the quote lapses.
    fields:
      status: Lifecycle state, which becomes expired.
      ended_date: Date the quote lapsed.
    triggers: []
  - type: guestplan_election_voided
    target: guestplan_elections
    mutation: {transition: [{from: quoted, to: voided}, {from: elected, to: voided}, {from: active, to: voided}]}
    meaning: The election is cancelled because the trip fell away, the guest was never eligible or the same trip was quoted twice.
    grain: One row per election, updated once when it is voided.
    fields:
      status: Lifecycle state, which becomes voided.
      ended_date: Date the election was voided.
      void_reason: Why it was voided.
    triggers:
      - event: guestplan:guestplan_protection_refunded
        when: {void_reason: [booking_cancelled, duplicate_election]}
        map: {election_id: election_id, customer_id: customer_id, charge_basis: protection_refund, adjustment_reason: billing_correction}

  - type: guestplan_protection_fee_charged
    target: guestplan_charges
    meaning: The protection fee for a stretch of the trip is posted to the guest.
    grain: One row per stretch of the trip the fee is charged for on one election.
    account: protection_fee_due
    direction: in
    distinguish_by: [charge_date, coverage_segment, days_covered, charge_amount]
    fields:
      protection_charge_id: Reference number of the line.
      election_id: The election the line belongs to.
      customer_id: The guest being charged.
      booking_id: The trip the protection covers.
      event_type: Event family of the line.
      charge_date: Date the line was posted.
      charge_amount: Fee taken for this stretch.
      charge_basis: The priced item, which is the daily protection fee.
      days_covered: Days of the trip this line covers.
      coverage_segment: Which stretch of the trip the line covers.
      adjustment_reason: Why the line was raised outside the ordinary daily fee.
    triggers: []
  - type: guestplan_level_change_charged
    target: guestplan_charges
    meaning: The difference between the old and the new protection level is charged or credited when the guest moves level.
    grain: One row per accepted level change on one election.
    account: protection_fee_due
    direction: in
    distinguish_by: [charge_date, charge_basis, days_covered, coverage_segment]
    fields:
      protection_charge_id: Reference number of the line.
      election_id: The election being changed.
      customer_id: The guest being charged or credited.
      booking_id: The trip the protection covers.
      source_charge_id: The original fee line the difference is measured against.
      event_type: Event family of the line.
      charge_date: Date the change was priced.
      charge_amount: The difference, positive on an upgrade and negative on a downgrade.
      charge_basis: Whether the line is an upgrade difference or a downgrade credit.
      days_covered: Remaining days the difference was priced on.
      coverage_segment: Which stretch of the trip the new level covers.
      adjustment_reason: Whether the change was made before or during the trip.
    triggers: []
  - type: guestplan_secondary_driver_charged
    target: guestplan_charges
    meaning: An additional approved driver is added to the trip and charged for.
    grain: One row per additional driver added to one election.
    account: protection_fee_due
    direction: in
    distinguish_by: [charge_date, charge_amount, days_covered]
    fields:
      protection_charge_id: Reference number of the line.
      election_id: The election the driver is added to.
      customer_id: The guest being charged.
      booking_id: The trip the driver is added to.
      event_type: Event family of the line.
      charge_date: Date the driver was added.
      charge_amount: Fee for the additional driver.
      charge_basis: The priced item, which is the secondary driver fee.
      days_covered: Days the additional driver is covered for.
      coverage_segment: Which stretch of the trip the driver is added to.
      adjustment_reason: Why the driver was added outside the original election.
    triggers: []
  - type: guestplan_deductible_charged
    target: guestplan_charges
    meaning: The guest's own share of a loss settled against them is posted.
    grain: One row per deductible instalment raised on one election for one claim.
    account: guest_deductible
    direction: in
    distinguish_by: [charge_date, charge_amount, covered_claim_id]
    fields:
      protection_charge_id: Reference number of the line.
      election_id: The election the deductible is raised on.
      customer_id: The guest who owes it.
      booking_id: The trip the loss happened on.
      covered_claim_id: The claim the deductible belongs to.
      event_type: Event family of the line.
      charge_date: Date the deductible was raised.
      charge_amount: Money the guest now owes.
      charge_basis: Whether the line is the deductible itself or a share of loss of use or appraisal.
      days_covered: Days of loss of use the share was computed on.
      coverage_segment: Which stretch of the trip the loss falls in.
      adjustment_reason: Why the line was raised, which on a settlement is the claim settlement.
    triggers:
      - event: payouts:payouts_adjustment_posted
        map: {customer_id: customer_id, booking_id: booking_id, entry_basis: claim_deductible_recovery}
  - type: guestplan_deductible_waived
    target: guestplan_charges
    meaning: A deductible already raised is written off because the level carries no deductible, the guest bought it out, or the finding of fault changed.
    grain: One row per waiver raised against one deductible line.
    account: guest_deductible
    direction: out
    distinguish_by: [charge_date, charge_amount, source_charge_id]
    fields:
      protection_charge_id: Reference number of the waiver line.
      election_id: The election the waiver belongs to.
      customer_id: The guest whose liability is cleared.
      booking_id: The trip the loss happened on.
      covered_claim_id: The claim the waiver belongs to.
      source_charge_id: The deductible line being written off.
      event_type: Event family of the line.
      charge_date: Date the waiver was granted.
      charge_amount: Money cleared, always negative here.
      charge_basis: The ground of the waiver.
      adjustment_reason: Why the waiver was granted.
      coverage_segment: Which stretch of the trip the waived loss falls in.
    triggers: []
  - type: guestplan_protection_refunded
    target: guestplan_charges
    meaning: Protection fee already taken is given back against one identified earlier line.
    grain: One row per refund raised against one earlier protection line.
    account: protection_fee_due
    direction: out
    distinguish_by: [charge_date, source_charge_id, charge_amount]
    fields:
      protection_charge_id: Reference number of the refund line.
      election_id: The election the refund belongs to.
      customer_id: The guest being refunded.
      booking_id: The trip the protection covered.
      source_charge_id: The earlier line the refund gives back against.
      event_type: Event family of the line.
      charge_date: Date the refund was posted.
      charge_amount: Money returned, always negative here.
      charge_basis: The ground the refund is raised on.
      days_covered: Days being credited back.
      coverage_segment: Which stretch of the trip is being credited.
      adjustment_reason: Why the refund was raised.
    triggers: []

measures:
  - id: guestplan_msr_settled_claims_12m
    window: Rolling 12 calendar months counted back from the handling date, the handling date included.
    measure: Count of guestplan_deductible_charged lines raised against this guest across all of their elections.
  - id: guestplan_msr_covered_days_ytd
    window: From the first day of the current calendar year to the handling date, the handling date included.
    measure: Sum of days_covered over this guest's protection fee lines.

policies:
  - id: guestplan_agg_multi_holding
    subject: [guestplan_election_created]
    rule: >-
      Protection is elected trip by trip, so a guest holds one election for each trip and may hold as many elections as they have trips, with no ceiling on the number.
      One trip carries exactly one live election, and a second quote raised on a trip that already carries one is a duplicate to be voided rather than a second cover.
      Each election stands on its own terms, so the level chosen on one trip never carries over to the next and the guest chooses again each time.
    eligibility: []
    params: {max_per_customer: null}
  - id: guestplan_agg_claim_history
    subject: [guestplan_election_created, guestplan_election_confirmed]
    rule: >-
      A guest's elections are read together when the marketplace decides what it will cover them for, even though each election covers a single trip.
      Losses settled against the guest are counted across every election they have held over the rolling twelve months, and where that count reaches the level's suspension threshold the guest may no longer elect that level until the level's waiting period has run, counted in whole calendar days from the day the last loss was settled.
      A guest barred from one level may still elect a lower one, and declining marketplace protection altogether is always open to a guest who can evidence their own motor policy.
      Days already covered in the calendar year are read together as well, and a guest whose covered days would take one trip past the level's maximum trip length is quoted on the level that will carry the whole trip rather than on one that would run out midway.
    eligibility: []
    params:
      per_tier:
        Keyturn Declined Protection: {suspension_after_claims_count: "=suspension_after_claims_count", reinstatement_wait_days: "=reinstatement_wait_days", annual_claim_limit_count: "=annual_claim_limit_count", maximum_trip_days_covered: "=maximum_trip_days_covered"}
        Keyturn Minimum Protection: {suspension_after_claims_count: "=suspension_after_claims_count", reinstatement_wait_days: "=reinstatement_wait_days", annual_claim_limit_count: "=annual_claim_limit_count", maximum_trip_days_covered: "=maximum_trip_days_covered"}
        Keyturn Standard Protection: {suspension_after_claims_count: "=suspension_after_claims_count", reinstatement_wait_days: "=reinstatement_wait_days", annual_claim_limit_count: "=annual_claim_limit_count", maximum_trip_days_covered: "=maximum_trip_days_covered"}
        Keyturn Advantage Protection: {suspension_after_claims_count: "=suspension_after_claims_count", reinstatement_wait_days: "=reinstatement_wait_days", annual_claim_limit_count: "=annual_claim_limit_count", maximum_trip_days_covered: "=maximum_trip_days_covered"}
        Keyturn Premier Protection: {suspension_after_claims_count: "=suspension_after_claims_count", reinstatement_wait_days: "=reinstatement_wait_days", annual_claim_limit_count: "=annual_claim_limit_count", maximum_trip_days_covered: "=maximum_trip_days_covered"}
        Keyturn Business Traveler Protection: {suspension_after_claims_count: "=suspension_after_claims_count", reinstatement_wait_days: "=reinstatement_wait_days", annual_claim_limit_count: "=annual_claim_limit_count", maximum_trip_days_covered: "=maximum_trip_days_covered"}
    measures: [guestplan_msr_settled_claims_12m, guestplan_msr_covered_days_ytd]
  - id: guestplan_election_eligibility
    subject: [guestplan_election_created, guestplan_election_confirmed]
    rule: >-
      A level is open to a guest only where the guest meets its minimum driver age and its minimum marketplace driver score on the day the trip starts, and a guest who meets neither is quoted the levels they do qualify for rather than refused protection altogether.
      A level will not cover a vehicle the marketplace values above the level's exclusion ceiling, nor a vehicle in one of the level's excluded value classes, and where the trip is on such a vehicle the guest must elect a level that does cover it before the trip can start.
      Declining marketplace protection is open only to a guest who evidences their own motor policy carrying at least the level's minimum third-party limit, and the guest's word that they are insured is not evidence of it.
      Commercial carriage, and any trip crossing an international border, are covered only on the levels that say so, and a trip of that kind on a level that does not cover it leaves the guest carrying the loss themselves.
      A guest may choose a level only for a trip that has been confirmed and has not yet started, since a level chosen after the vehicle has been collected would cover a risk already taken.
      Additional drivers are approved up to the level's maximum, each one charged at the level's additional driver fee, and a driver who has not been approved before the trip starts is not covered at all.
    eligibility:
      - id: own_policy_evidenced
        applies_to: [guestplan_election_confirmed]
        kind: authorization
        condition: Declining marketplace protection is open only to a guest who evidences their own motor policy carrying at least the level's minimum third-party limit, and the guest's word that they are insured is not evidence of it.
        evidence_fields: [guestplan_elections.external_insurer_name, guestplan_elections.election_id, guestplan_elections.protection_level_name]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[guestplan_elections.election_id]]
          action_bindings: {guestplan_elections.election_id: election_id}
      - id: trip_confirmed_not_started
        applies_to: [guestplan_election_confirmed]
        kind: state
        condition: A guest may choose a level only for a trip that has been confirmed and has not yet started, since a level chosen after the vehicle has been collected would cover a risk already taken.
        evidence_fields: [trips_bookings.status, trips_bookings.booking_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[trips_bookings.booking_id]]
          action_bindings: {trips_bookings.booking_id: booking_id}
        state_contract:
          field: trips_bookings.status
          allowed: [booked]
    params:
      per_tier:
        Keyturn Declined Protection: {minimum_driver_age_years: "=minimum_driver_age_years", minimum_driver_score: "=minimum_driver_score", excluded_vehicle_value_above_amount: "=excluded_vehicle_value_above_amount", own_insurance_evidence_required: "=own_insurance_evidence_required", own_insurance_minimum_liability_amount: "=own_insurance_minimum_liability_amount", secondary_driver_max_count: "=secondary_driver_max_count", commercial_trip_covered: "=commercial_trip_covered", cross_border_trip_covered: "=cross_border_trip_covered"}
        Keyturn Minimum Protection: {minimum_driver_age_years: "=minimum_driver_age_years", minimum_driver_score: "=minimum_driver_score", excluded_vehicle_value_above_amount: "=excluded_vehicle_value_above_amount", own_insurance_evidence_required: "=own_insurance_evidence_required", own_insurance_minimum_liability_amount: "=own_insurance_minimum_liability_amount", secondary_driver_max_count: "=secondary_driver_max_count", commercial_trip_covered: "=commercial_trip_covered", cross_border_trip_covered: "=cross_border_trip_covered"}
        Keyturn Standard Protection: {minimum_driver_age_years: "=minimum_driver_age_years", minimum_driver_score: "=minimum_driver_score", excluded_vehicle_value_above_amount: "=excluded_vehicle_value_above_amount", own_insurance_evidence_required: "=own_insurance_evidence_required", own_insurance_minimum_liability_amount: "=own_insurance_minimum_liability_amount", secondary_driver_max_count: "=secondary_driver_max_count", commercial_trip_covered: "=commercial_trip_covered", cross_border_trip_covered: "=cross_border_trip_covered"}
        Keyturn Advantage Protection: {minimum_driver_age_years: "=minimum_driver_age_years", minimum_driver_score: "=minimum_driver_score", excluded_vehicle_value_above_amount: "=excluded_vehicle_value_above_amount", own_insurance_evidence_required: "=own_insurance_evidence_required", own_insurance_minimum_liability_amount: "=own_insurance_minimum_liability_amount", secondary_driver_max_count: "=secondary_driver_max_count", commercial_trip_covered: "=commercial_trip_covered", cross_border_trip_covered: "=cross_border_trip_covered"}
        Keyturn Premier Protection: {minimum_driver_age_years: "=minimum_driver_age_years", minimum_driver_score: "=minimum_driver_score", excluded_vehicle_value_above_amount: "=excluded_vehicle_value_above_amount", own_insurance_evidence_required: "=own_insurance_evidence_required", own_insurance_minimum_liability_amount: "=own_insurance_minimum_liability_amount", secondary_driver_max_count: "=secondary_driver_max_count", commercial_trip_covered: "=commercial_trip_covered", cross_border_trip_covered: "=cross_border_trip_covered"}
        Keyturn Business Traveler Protection: {minimum_driver_age_years: "=minimum_driver_age_years", minimum_driver_score: "=minimum_driver_score", excluded_vehicle_value_above_amount: "=excluded_vehicle_value_above_amount", own_insurance_evidence_required: "=own_insurance_evidence_required", own_insurance_minimum_liability_amount: "=own_insurance_minimum_liability_amount", secondary_driver_max_count: "=secondary_driver_max_count", commercial_trip_covered: "=commercial_trip_covered", cross_border_trip_covered: "=cross_border_trip_covered"}
  - id: guestplan_evt_fee_charging
    subject: [guestplan_protection_fee_charged, guestplan_secondary_driver_charged]
    rule: >-
      The protection fee is arrived at on the level's own charging basis, and the three bases are not interchangeable. On a daily flat basis the fee is the level's daily amount multiplied by the charged days. On a percentage basis it is the level's percentage of the trip price. On a greater-of basis both are worked out and the larger of the two is taken, so that neither a cheap long trip nor an expensive short one escapes the fee.
      Charged days are the whole days of the trip as reserved, with any part day counted as a whole day, and never fewer than the level's minimum charge days.
      The fee arrived at is then held between the level's floor and its ceiling, the floor applied first and the ceiling last, so a trip long enough to pass the ceiling pays the ceiling and no more.
      A driver under the young-driver threshold pays the level's protection surcharge on the fee, and the surcharge is posted as its own line so that it can be reversed on its own.
      The fee falls due at the level's billing point, whether at booking, at the start of the trip or daily in arrears, and a level billed daily in arrears posts one line for each completed day rather than one line for the trip.
      Additional drivers are charged the level's additional driver fee once each for the whole trip, not once for each day, and a level that carries no additional driver fee charges nothing however many drivers are approved.
      A fee line is posted only while the election is in the elected or active state, since a quote that was never chosen is never charged.
    eligibility:
      - id: election_chosen_before_charging
        applies_to: [guestplan_protection_fee_charged, guestplan_secondary_driver_charged]
        kind: state
        condition: A fee line is posted only while the election is in the elected or active state, since a quote that was never chosen is never charged.
        evidence_fields: [guestplan_elections.status, guestplan_elections.election_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[guestplan_elections.election_id]]
          action_bindings: {guestplan_elections.election_id: election_id}
        state_contract:
          field: guestplan_elections.status
          allowed: [elected, active]
    params:
      per_tier:
        Keyturn Declined Protection: {daily_protection_fee_amount: "=daily_protection_fee_amount", protection_fee_percent_of_trip_price: "=protection_fee_percent_of_trip_price", protection_fee_charging_basis: "=protection_fee_charging_basis", protection_fee_minimum_amount: "=protection_fee_minimum_amount", protection_fee_maximum_amount: "=protection_fee_maximum_amount", protection_fee_billing_point: "=protection_fee_billing_point", minimum_charge_days: "=minimum_charge_days", secondary_driver_fee_amount: "=secondary_driver_fee_amount", young_driver_protection_surcharge_percent: "=young_driver_protection_surcharge_percent"}
        Keyturn Minimum Protection: {daily_protection_fee_amount: "=daily_protection_fee_amount", protection_fee_percent_of_trip_price: "=protection_fee_percent_of_trip_price", protection_fee_charging_basis: "=protection_fee_charging_basis", protection_fee_minimum_amount: "=protection_fee_minimum_amount", protection_fee_maximum_amount: "=protection_fee_maximum_amount", protection_fee_billing_point: "=protection_fee_billing_point", minimum_charge_days: "=minimum_charge_days", secondary_driver_fee_amount: "=secondary_driver_fee_amount", young_driver_protection_surcharge_percent: "=young_driver_protection_surcharge_percent"}
        Keyturn Standard Protection: {daily_protection_fee_amount: "=daily_protection_fee_amount", protection_fee_percent_of_trip_price: "=protection_fee_percent_of_trip_price", protection_fee_charging_basis: "=protection_fee_charging_basis", protection_fee_minimum_amount: "=protection_fee_minimum_amount", protection_fee_maximum_amount: "=protection_fee_maximum_amount", protection_fee_billing_point: "=protection_fee_billing_point", minimum_charge_days: "=minimum_charge_days", secondary_driver_fee_amount: "=secondary_driver_fee_amount", young_driver_protection_surcharge_percent: "=young_driver_protection_surcharge_percent"}
        Keyturn Advantage Protection: {daily_protection_fee_amount: "=daily_protection_fee_amount", protection_fee_percent_of_trip_price: "=protection_fee_percent_of_trip_price", protection_fee_charging_basis: "=protection_fee_charging_basis", protection_fee_minimum_amount: "=protection_fee_minimum_amount", protection_fee_maximum_amount: "=protection_fee_maximum_amount", protection_fee_billing_point: "=protection_fee_billing_point", minimum_charge_days: "=minimum_charge_days", secondary_driver_fee_amount: "=secondary_driver_fee_amount", young_driver_protection_surcharge_percent: "=young_driver_protection_surcharge_percent"}
        Keyturn Premier Protection: {daily_protection_fee_amount: "=daily_protection_fee_amount", protection_fee_percent_of_trip_price: "=protection_fee_percent_of_trip_price", protection_fee_charging_basis: "=protection_fee_charging_basis", protection_fee_minimum_amount: "=protection_fee_minimum_amount", protection_fee_maximum_amount: "=protection_fee_maximum_amount", protection_fee_billing_point: "=protection_fee_billing_point", minimum_charge_days: "=minimum_charge_days", secondary_driver_fee_amount: "=secondary_driver_fee_amount", young_driver_protection_surcharge_percent: "=young_driver_protection_surcharge_percent"}
        Keyturn Business Traveler Protection: {daily_protection_fee_amount: "=daily_protection_fee_amount", protection_fee_percent_of_trip_price: "=protection_fee_percent_of_trip_price", protection_fee_charging_basis: "=protection_fee_charging_basis", protection_fee_minimum_amount: "=protection_fee_minimum_amount", protection_fee_maximum_amount: "=protection_fee_maximum_amount", protection_fee_billing_point: "=protection_fee_billing_point", minimum_charge_days: "=minimum_charge_days", secondary_driver_fee_amount: "=secondary_driver_fee_amount", young_driver_protection_surcharge_percent: "=young_driver_protection_surcharge_percent"}
    formula:
      when: charge_basis == "daily_protection_fee"
      charged_days: max(minimum_charge_days, days_covered)
      charge_amount: min(max(daily_protection_fee_amount * charged_days, protection_fee_minimum_amount), protection_fee_maximum_amount)
  - id: guestplan_level_change
    subject: [guestplan_level_change_charged]
    rule: >-
      A guest who wants a different level asks for a change, which is taken onto the change request register and priced only once it is approved, so the level on the election never moves on the strength of the request alone.
      What may be changed depends on the level and on whether the trip has started. Moving up before the trip starts is open on every level; moving up once the trip has started is open only on the levels that allow it. Moving down is open only on the levels that allow it, and moving down once the trip has started is open on fewer levels still.
      A change is priced only where the request is recorded no later than the change decision window counted forward from the moment the guest asked for it. The decision window is counted in whole elapsed hours from the timestamp on the change request, never in calendar days, and an hour counts only once it has fully elapsed.
      An upgrade is priced on the level's proration basis. Where that basis is the remaining whole days, the difference between the two levels' daily fees is charged for the days left in the trip counted from the day of the change, the day of the change itself included. Where it is the whole trip, the difference is charged for every day of the trip as if the new level had been chosen at the start.
      A downgrade returns the level's downgrade credit percentage of the same difference and never the whole of it, because cover already run cannot be given back; a level whose downgrade credit is nil returns nothing at all.
      A change made once the trip has started carries the level's mid-trip change fee where the level has one, posted as part of the same line rather than separately.
      Cover after a change is the new level's cover for the rest of the trip and the old level's cover for the part already run, so a loss is settled on the level in force on the day the loss happened.
    eligibility:
      - id: change_decision_window
        applies_to: [guestplan_level_change_charged]
        kind: time
        condition: A change is priced only where the request is recorded no later than the change decision window counted forward from the moment the guest asked for it.
        evidence_fields: [guestplan_change_requests.requested_at, guestplan_change_requests.change_request_id, guestplan_change_requests.request_status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[guestplan_change_requests.change_request_id]]
          action_bindings: {guestplan_change_requests.change_request_id: change_request_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the request is recorded
          anchor_source: guestplan_change_requests.requested_at
          relation: not_after
          duration_source: params.change_decision_window_hours
          unit: elapsed_hours
          counting_rule: The decision window is counted in whole elapsed hours from the timestamp on the change request, never in calendar days, and an hour counts only once it has fully elapsed.
          boundary: inclusive
    params:
      per_tier:
        Keyturn Declined Protection: {upgrade_allowed_before_trip_start: "=upgrade_allowed_before_trip_start", upgrade_allowed_mid_trip: "=upgrade_allowed_mid_trip", downgrade_allowed_before_trip_start: "=downgrade_allowed_before_trip_start", downgrade_allowed_mid_trip: "=downgrade_allowed_mid_trip", change_request_lead_hours: "=change_request_lead_hours", change_decision_window_hours: "=change_decision_window_hours", upgrade_proration_basis: "=upgrade_proration_basis", downgrade_credit_percent: "=downgrade_credit_percent", mid_trip_change_fee_amount: "=mid_trip_change_fee_amount"}
        Keyturn Minimum Protection: {upgrade_allowed_before_trip_start: "=upgrade_allowed_before_trip_start", upgrade_allowed_mid_trip: "=upgrade_allowed_mid_trip", downgrade_allowed_before_trip_start: "=downgrade_allowed_before_trip_start", downgrade_allowed_mid_trip: "=downgrade_allowed_mid_trip", change_request_lead_hours: "=change_request_lead_hours", change_decision_window_hours: "=change_decision_window_hours", upgrade_proration_basis: "=upgrade_proration_basis", downgrade_credit_percent: "=downgrade_credit_percent", mid_trip_change_fee_amount: "=mid_trip_change_fee_amount"}
        Keyturn Standard Protection: {upgrade_allowed_before_trip_start: "=upgrade_allowed_before_trip_start", upgrade_allowed_mid_trip: "=upgrade_allowed_mid_trip", downgrade_allowed_before_trip_start: "=downgrade_allowed_before_trip_start", downgrade_allowed_mid_trip: "=downgrade_allowed_mid_trip", change_request_lead_hours: "=change_request_lead_hours", change_decision_window_hours: "=change_decision_window_hours", upgrade_proration_basis: "=upgrade_proration_basis", downgrade_credit_percent: "=downgrade_credit_percent", mid_trip_change_fee_amount: "=mid_trip_change_fee_amount"}
        Keyturn Advantage Protection: {upgrade_allowed_before_trip_start: "=upgrade_allowed_before_trip_start", upgrade_allowed_mid_trip: "=upgrade_allowed_mid_trip", downgrade_allowed_before_trip_start: "=downgrade_allowed_before_trip_start", downgrade_allowed_mid_trip: "=downgrade_allowed_mid_trip", change_request_lead_hours: "=change_request_lead_hours", change_decision_window_hours: "=change_decision_window_hours", upgrade_proration_basis: "=upgrade_proration_basis", downgrade_credit_percent: "=downgrade_credit_percent", mid_trip_change_fee_amount: "=mid_trip_change_fee_amount"}
        Keyturn Premier Protection: {upgrade_allowed_before_trip_start: "=upgrade_allowed_before_trip_start", upgrade_allowed_mid_trip: "=upgrade_allowed_mid_trip", downgrade_allowed_before_trip_start: "=downgrade_allowed_before_trip_start", downgrade_allowed_mid_trip: "=downgrade_allowed_mid_trip", change_request_lead_hours: "=change_request_lead_hours", change_decision_window_hours: "=change_decision_window_hours", upgrade_proration_basis: "=upgrade_proration_basis", downgrade_credit_percent: "=downgrade_credit_percent", mid_trip_change_fee_amount: "=mid_trip_change_fee_amount"}
        Keyturn Business Traveler Protection: {upgrade_allowed_before_trip_start: "=upgrade_allowed_before_trip_start", upgrade_allowed_mid_trip: "=upgrade_allowed_mid_trip", downgrade_allowed_before_trip_start: "=downgrade_allowed_before_trip_start", downgrade_allowed_mid_trip: "=downgrade_allowed_mid_trip", change_request_lead_hours: "=change_request_lead_hours", change_decision_window_hours: "=change_decision_window_hours", upgrade_proration_basis: "=upgrade_proration_basis", downgrade_credit_percent: "=downgrade_credit_percent", mid_trip_change_fee_amount: "=mid_trip_change_fee_amount"}
    formula:
      when: charge_basis == "level_upgrade_difference"
      charge_amount: round(daily_protection_fee_amount * days_covered + mid_trip_change_fee_amount, 2)
  - id: guestplan_evt_deductible
    subject: [guestplan_deductible_charged, guestplan_deductible_waived]
    rule: >-
      Where a loss on a trip is settled against the guest, what the guest owes is the deductible of the level in force on the day of the loss, capped by that level's responsibility ceiling for the kind of damage, and the ceiling governs wherever it is the lower of the two.
      A level whose deductible is nil charges nothing whatever the loss, and a level that carries a responsibility ceiling of nil leaves the guest owing nothing even where the host's own claim is met in full.
      Where the level allows the deductible to be bought out, a guest who paid the buy-out fee before the trip started owes nothing on the loss, and the buy-out is not sold once the trip has started.
      A deductible may be paid over the level's instalments, spaced by the level's instalment interval, counted in whole calendar days from the day the previous instalment fell due; each instalment is posted as its own line so that the instalments stay separable.
      The guest also bears the level's share of the host's loss of use and of the appraisal cost, each posted as its own line with its own basis rather than folded into the deductible.
      A deductible already raised is written off where the finding of fault changes, where the loss is later refused, or where the level was misapplied, and the write-off names the line it clears.
      The guest may dispute a deductible inside the level's dispute window, counted in whole calendar days from the day the deductible was raised, and a dispute lodged inside the window stops recovery until it is decided.
    eligibility:
      - id: deductible_dispute_window
        applies_to: [guestplan_deductible_waived]
        kind: time
        condition: The guest may dispute a deductible inside the level's dispute window, counted in whole calendar days from the day the deductible was raised, and a dispute lodged inside the window stops recovery until it is decided.
        evidence_fields: [guestplan_charges.charge_date, guestplan_charges.protection_charge_id, guestplan_charges.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[guestplan_charges.protection_charge_id]]
          action_bindings: {guestplan_charges.protection_charge_id: source_charge_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the deductible was raised
          anchor_source: guestplan_charges.charge_date
          relation: not_after
          duration_source: params.deductible_dispute_window_days
          unit: calendar_days
          counting_rule: counted in whole calendar days from the day the deductible was raised
          boundary: inclusive
    params:
      per_tier:
        Keyturn Declined Protection: {guest_deductible_amount: "=guest_deductible_amount", physical_damage_responsibility_amount: "=physical_damage_responsibility_amount", glass_responsibility_amount: "=glass_responsibility_amount", tyres_responsibility_amount: "=tyres_responsibility_amount", interior_responsibility_amount: "=interior_responsibility_amount", towing_responsibility_amount: "=towing_responsibility_amount", loss_of_use_guest_share_percent: "=loss_of_use_guest_share_percent", appraisal_fee_share_percent: "=appraisal_fee_share_percent", deductible_waiver_available: "=deductible_waiver_available", deductible_waiver_fee_amount: "=deductible_waiver_fee_amount", deductible_installment_count: "=deductible_installment_count", deductible_installment_interval_days: "=deductible_installment_interval_days", deductible_dispute_window_days: "=deductible_dispute_window_days"}
        Keyturn Minimum Protection: {guest_deductible_amount: "=guest_deductible_amount", physical_damage_responsibility_amount: "=physical_damage_responsibility_amount", glass_responsibility_amount: "=glass_responsibility_amount", tyres_responsibility_amount: "=tyres_responsibility_amount", interior_responsibility_amount: "=interior_responsibility_amount", towing_responsibility_amount: "=towing_responsibility_amount", loss_of_use_guest_share_percent: "=loss_of_use_guest_share_percent", appraisal_fee_share_percent: "=appraisal_fee_share_percent", deductible_waiver_available: "=deductible_waiver_available", deductible_waiver_fee_amount: "=deductible_waiver_fee_amount", deductible_installment_count: "=deductible_installment_count", deductible_installment_interval_days: "=deductible_installment_interval_days", deductible_dispute_window_days: "=deductible_dispute_window_days"}
        Keyturn Standard Protection: {guest_deductible_amount: "=guest_deductible_amount", physical_damage_responsibility_amount: "=physical_damage_responsibility_amount", glass_responsibility_amount: "=glass_responsibility_amount", tyres_responsibility_amount: "=tyres_responsibility_amount", interior_responsibility_amount: "=interior_responsibility_amount", towing_responsibility_amount: "=towing_responsibility_amount", loss_of_use_guest_share_percent: "=loss_of_use_guest_share_percent", appraisal_fee_share_percent: "=appraisal_fee_share_percent", deductible_waiver_available: "=deductible_waiver_available", deductible_waiver_fee_amount: "=deductible_waiver_fee_amount", deductible_installment_count: "=deductible_installment_count", deductible_installment_interval_days: "=deductible_installment_interval_days", deductible_dispute_window_days: "=deductible_dispute_window_days"}
        Keyturn Advantage Protection: {guest_deductible_amount: "=guest_deductible_amount", physical_damage_responsibility_amount: "=physical_damage_responsibility_amount", glass_responsibility_amount: "=glass_responsibility_amount", tyres_responsibility_amount: "=tyres_responsibility_amount", interior_responsibility_amount: "=interior_responsibility_amount", towing_responsibility_amount: "=towing_responsibility_amount", loss_of_use_guest_share_percent: "=loss_of_use_guest_share_percent", appraisal_fee_share_percent: "=appraisal_fee_share_percent", deductible_waiver_available: "=deductible_waiver_available", deductible_waiver_fee_amount: "=deductible_waiver_fee_amount", deductible_installment_count: "=deductible_installment_count", deductible_installment_interval_days: "=deductible_installment_interval_days", deductible_dispute_window_days: "=deductible_dispute_window_days"}
        Keyturn Premier Protection: {guest_deductible_amount: "=guest_deductible_amount", physical_damage_responsibility_amount: "=physical_damage_responsibility_amount", glass_responsibility_amount: "=glass_responsibility_amount", tyres_responsibility_amount: "=tyres_responsibility_amount", interior_responsibility_amount: "=interior_responsibility_amount", towing_responsibility_amount: "=towing_responsibility_amount", loss_of_use_guest_share_percent: "=loss_of_use_guest_share_percent", appraisal_fee_share_percent: "=appraisal_fee_share_percent", deductible_waiver_available: "=deductible_waiver_available", deductible_waiver_fee_amount: "=deductible_waiver_fee_amount", deductible_installment_count: "=deductible_installment_count", deductible_installment_interval_days: "=deductible_installment_interval_days", deductible_dispute_window_days: "=deductible_dispute_window_days"}
        Keyturn Business Traveler Protection: {guest_deductible_amount: "=guest_deductible_amount", physical_damage_responsibility_amount: "=physical_damage_responsibility_amount", glass_responsibility_amount: "=glass_responsibility_amount", tyres_responsibility_amount: "=tyres_responsibility_amount", interior_responsibility_amount: "=interior_responsibility_amount", towing_responsibility_amount: "=towing_responsibility_amount", loss_of_use_guest_share_percent: "=loss_of_use_guest_share_percent", appraisal_fee_share_percent: "=appraisal_fee_share_percent", deductible_waiver_available: "=deductible_waiver_available", deductible_waiver_fee_amount: "=deductible_waiver_fee_amount", deductible_installment_count: "=deductible_installment_count", deductible_installment_interval_days: "=deductible_installment_interval_days", deductible_dispute_window_days: "=deductible_dispute_window_days"}
    formula:
      when: charge_basis == "deductible"
      charge_amount: min(guest_deductible_amount, physical_damage_responsibility_amount) / deductible_installment_count
  - id: guestplan_evt_refund
    subject: [guestplan_protection_refunded]
    rule: >-
      Protection fee is returned against one identified earlier line, so every refund names the fee line it gives back and never exceeds what that line took.
      A fee line already returned in full is not returned again, so where a refund already stands against the same fee line and that refund was not itself reversed, the request is a duplicate and no further money moves.
      Where the trip is cancelled before it starts the fee is returned at the level's cancellation refund percentage, and where the trip is shortened the unused days are returned only on the levels that allow proration; a level that does not prorate returns nothing for days not taken.
      A guest who changes their mind inside the level's refund window after electing gets the fee back in full, counted in whole elapsed hours from the moment the level was chosen, and after that window only the proration rules apply.
      Nothing is returned on an election that has already met a loss, because the cover was used.
      Money is returned by the route it arrived on and reaches the guest with the trip refunds of the same booking rather than separately.
    eligibility:
      - id: protection_refund_not_duplicated
        applies_to: [guestplan_protection_refunded]
        kind: dedup
        condition: A fee line already returned in full is not returned again, so where a refund already stands against the same fee line and that refund was not itself reversed, the request is a duplicate and no further money moves.
        evidence_fields: [guestplan_charges.source_charge_id, guestplan_charges.event_type, guestplan_charges.charge_amount]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[guestplan_charges.source_charge_id]]
          action_bindings: {guestplan_charges.source_charge_id: source_charge_id}
        dedup_contract:
          table: guestplan_charges
          mode: separate_record
          object_bindings: {source_charge_id: source_charge_id}
          duplicate_filters: {event_type: [guestplan_protection_refunded]}
          distinct_fields: [charge_date, charge_amount, adjustment_reason]
    params:
      per_tier:
        Keyturn Declined Protection: {fee_refund_window_hours: "=fee_refund_window_hours", refund_proration_allowed: "=refund_proration_allowed", cancellation_fee_refund_percent: "=cancellation_fee_refund_percent"}
        Keyturn Minimum Protection: {fee_refund_window_hours: "=fee_refund_window_hours", refund_proration_allowed: "=refund_proration_allowed", cancellation_fee_refund_percent: "=cancellation_fee_refund_percent"}
        Keyturn Standard Protection: {fee_refund_window_hours: "=fee_refund_window_hours", refund_proration_allowed: "=refund_proration_allowed", cancellation_fee_refund_percent: "=cancellation_fee_refund_percent"}
        Keyturn Advantage Protection: {fee_refund_window_hours: "=fee_refund_window_hours", refund_proration_allowed: "=refund_proration_allowed", cancellation_fee_refund_percent: "=cancellation_fee_refund_percent"}
        Keyturn Premier Protection: {fee_refund_window_hours: "=fee_refund_window_hours", refund_proration_allowed: "=refund_proration_allowed", cancellation_fee_refund_percent: "=cancellation_fee_refund_percent"}
        Keyturn Business Traveler Protection: {fee_refund_window_hours: "=fee_refund_window_hours", refund_proration_allowed: "=refund_proration_allowed", cancellation_fee_refund_percent: "=cancellation_fee_refund_percent"}
  - id: guestplan_lifecycle
    subject: [guestplan_election_activated, guestplan_election_completed, guestplan_election_expired]
    rule: >-
      Cover begins when the trip begins and not when the level was chosen, so an incident before the vehicle changed hands is not a trip incident at all.
      Cover ends when the trip ends, including any approved extension, and a trip that runs past its scheduled return stays covered on the same level for the late period rather than falling out of cover at the scheduled hour.
      Where the guest never chose a level, the quote lapses at the moment the trip begins and the trip runs with no marketplace protection, the guest carrying the whole of any loss up to the value of the vehicle; the marketplace does not apply a default level on the guest's behalf.
      Cover is limited to the level's maximum trip length, and a trip extended past that length is covered only to the last covered day, the guest being told which day cover ends on rather than discovering it at a claim.
      A trip that ends early ends cover early, and the days not taken are dealt with under the refund rules rather than by leaving cover running.
      An election that has reached the completed or expired state is never reopened, and a correction after that point is made against the lines that were wrong.
    eligibility:
      - id: cover_starts_with_trip
        applies_to: [guestplan_election_activated]
        kind: state
        condition: Cover begins when the trip begins and not when the level was chosen, so an incident before the vehicle changed hands is not a trip incident at all.
        evidence_fields: [trips_bookings.status, trips_bookings.booking_id, trips_bookings.actual_start_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[trips_bookings.booking_id]]
          action_bindings: {trips_bookings.booking_id: booking_id}
        state_contract:
          field: trips_bookings.status
          allowed: [in_progress]
    params:
      per_tier:
        Keyturn Declined Protection: {maximum_trip_days_covered: "=maximum_trip_days_covered", claim_reporting_window_hours: "=claim_reporting_window_hours", claim_cooperation_days: "=claim_cooperation_days"}
        Keyturn Minimum Protection: {maximum_trip_days_covered: "=maximum_trip_days_covered", claim_reporting_window_hours: "=claim_reporting_window_hours", claim_cooperation_days: "=claim_cooperation_days"}
        Keyturn Standard Protection: {maximum_trip_days_covered: "=maximum_trip_days_covered", claim_reporting_window_hours: "=claim_reporting_window_hours", claim_cooperation_days: "=claim_cooperation_days"}
        Keyturn Advantage Protection: {maximum_trip_days_covered: "=maximum_trip_days_covered", claim_reporting_window_hours: "=claim_reporting_window_hours", claim_cooperation_days: "=claim_cooperation_days"}
        Keyturn Premier Protection: {maximum_trip_days_covered: "=maximum_trip_days_covered", claim_reporting_window_hours: "=claim_reporting_window_hours", claim_cooperation_days: "=claim_cooperation_days"}
        Keyturn Business Traveler Protection: {maximum_trip_days_covered: "=maximum_trip_days_covered", claim_reporting_window_hours: "=claim_reporting_window_hours", claim_cooperation_days: "=claim_cooperation_days"}
  - id: guestplan_void
    subject: [guestplan_election_voided]
    rule: >-
      An election is voided where the trip it belongs to falls away, where the guest turns out never to have been eligible for the level, where the same trip was quoted twice, or where the fee could not be taken at all, and the ground is recorded on the election.
      Voiding is not the same as completing, and a voided election covers nothing for any part of the trip, so a loss during a period later voided is not met.
      Where the election is voided because the trip was cancelled, the fee is returned in full whatever the level's ordinary refund terms, since the guest never had the vehicle.
      Where it is voided because the guest was never eligible, the fee is returned but the guest is told that the trip ran without cover, and any loss stands against them in full.
      An election already voided is not voided again, and an election that has completed is corrected by reversal rather than by voiding.
      Only the marketplace voids an election; a guest who wants to end their cover changes level or cancels the trip instead.
    eligibility:
      - id: void_only_before_completion
        applies_to: [guestplan_election_voided]
        kind: state
        condition: An election already voided is not voided again, and an election that has completed is corrected by reversal rather than by voiding.
        evidence_fields: [guestplan_elections.status, guestplan_elections.election_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[guestplan_elections.election_id]]
          action_bindings: {guestplan_elections.election_id: election_id}
        state_contract:
          field: guestplan_elections.status
          allowed: [quoted, elected, active, voided]
    params: {duplicate_election_void_priority: 1}

extended_policies:
  - id: guestplan_ext_additional_driver_charge
    base_policy_refs: [guestplan_evt_fee_charging]
    overwrite:
      - base_policy: guestplan_evt_fee_charging
        superseded_clause: >-
          Additional drivers are charged the level's additional driver fee once each for the whole trip, not once for each day, and a level that carries no additional driver fee charges nothing however many drivers are approved.
        replaced_by: >-
          The fee for an additional driver is therefore the level's additional driver fee taken at the seat rate for the seat days out of the election's covered days, with the band uplift and the cover load added to that figure, and the whole rounded half up to the cent at the end.
    trigger: state_due
    subject: [guestplan_secondary_driver_charged]
    computes: driver_fee_amount
    target_tool: declare_additional_driver_a214c8dd
    params:
      driver_fee_declined: 25.00
      driver_fee_minimum: 22.00
      driver_fee_standard: 20.00
      driver_fee_advantage: 18.00
      driver_fee_premier: 0.00
      driver_fee_business: 0.00
      seat_rate_established: 0.70
      seat_rate_returning: 0.85
      seat_rate_standard: 1.00
      established_guest_spend_amount: 7500.00
      returning_guest_spend_amount: 3000.00
      long_trip_day_threshold: 30
      upper_rate_band_amount: 140.00
      lower_rate_band_amount: 100.00
      upper_band_uplift_amount: 14.00
      lower_band_uplift_amount: 9.00
      no_band_uplift_amount: 0.00
      high_cover_threshold_amount: 1500.00
      middle_cover_threshold_amount: 600.00
      high_cover_load_percent: 1.0
      middle_cover_load_percent: 0.6
      no_cover_load_percent: 0.0
    rule: >-
      An additional driver is taken onto the protection covering a trip one driver at a time, and what that driver
      costs is settled for the whole of that trip rather than day by day.
      The fee for an additional driver is the level's additional driver fee, taken in full for the whole of the
      election's covered days, and the amount is rounded half up to the cent only once the whole of it has been
      worked out.
      The seat rate is the share of the level's additional driver fee the guest is actually asked for. A guest whose
      trips have carried the trip base rate to the established-guest spend threshold or more over the last twelve
      months and who has had no cancellation fee charged in that time is asked for the established-guest seat rate;
      a guest whose trips have carried the trip base rate to the returning-guest spend threshold or more over the
      last twelve months and who has had no cancellation fee charged in that time is asked for the returning-guest
      seat rate; every other guest is asked for the standard seat rate.
      The seat days are the days of the trip the additional driver's fee is measured across. Where the additional
      driver is taken on once the trip has begun and the election covers the long-trip day threshold or more, the
      seat days are the whole weeks of the trip still to run, counted from the day the driver is taken on and
      rounded up to a whole week, each week counted as seven days. Where the additional driver is taken on once the
      trip has begun and the election covers fewer days than the long-trip day threshold, the seat days are the
      calendar days of the trip still to run, counted from the day the driver is taken on, that day included. Where
      the additional driver is taken on before the trip has begun, the seat days are the whole of the election's
      covered days.
      A band uplift is added for the value of the car the trip is on. Where the daily rate locked in on the trip
      reaches the upper rate band, the upper band uplift is added; where it reaches the lower rate band but not the
      upper rate band, the lower band uplift is added; where it reaches neither, no band uplift is added.
      A cover load is added as a share of the protection already charged on the election for the trip. The
      protection already charged on the election is the protection fee charged for the trip less any protection fee
      returned against it. The cover load is the cover load percentage of the protection already charged, expressed
      as a percentage of that amount. Where the protection already charged reaches the high cover threshold, the
      high cover load percentage is charged on it; where it reaches the middle cover threshold but not the high
      cover threshold, the middle cover load percentage is charged on it; where it reaches neither, no cover load is
      charged.
      The fee for an additional driver is therefore the level's additional driver fee taken at the seat rate for the
      seat days out of the election's covered days, with the band uplift and the cover load added to that figure,
      and the whole rounded half up to the cent at the end.
    prerequisite: []
    cross_category:
      - category: trips
        as: history
        reads: [daily_rate_amount, trip_start_date, trip_end_date, trips_charges.charge_amount, trips_charges.charge_basis, trips_charges.charge_date]
        note: The seat rate is decided from the guest's own trip ledger, and the band uplift from the daily rate locked in on the trip.
    compute:
      - level_driver_fee: "K('driver_fee_declined') if F('protection_level_name') == 'Keyturn Declined Protection' else (K('driver_fee_minimum') if F('protection_level_name') == 'Keyturn Minimum Protection' else (K('driver_fee_standard') if F('protection_level_name') == 'Keyturn Standard Protection' else (K('driver_fee_advantage') if F('protection_level_name') == 'Keyturn Advantage Protection' else (K('driver_fee_premier') if F('protection_level_name') == 'Keyturn Premier Protection' else K('driver_fee_business')))))"
      - covered_days: "F('coverage_days')"
      - trip_first_day: "CFIELD('trips', 'trip_start_date', booking_id=F('booking_id'))"
      - trip_last_day: "CFIELD('trips', 'trip_end_date', booking_id=F('booking_id'))"
      - trip_begun: "DAYS(trip_first_day, NOW) >= 0"
      - days_still_to_run: "MX(0, DAYS(NOW, trip_last_day) + 1)"
      - seat_days: "(7 * int((days_still_to_run + 6) / 7)) if (trip_begun and covered_days >= K('long_trip_day_threshold')) else (days_still_to_run if trip_begun else covered_days)"
      - trips_base_spend_12m: "XSUM('trips', 'trips_charges', 'charge_amount', within_months=12, date_field='charge_date', charge_basis='base_rate')"
      - trips_cancellation_12m: "XCOUNT('trips', 'trips_charges', within_months=12, date_field='charge_date', charge_basis='cancellation_fee')"
      - seat_fee_rate: "K('seat_rate_established') if (trips_base_spend_12m >= K('established_guest_spend_amount') and trips_cancellation_12m == 0) else (K('seat_rate_returning') if (trips_base_spend_12m >= K('returning_guest_spend_amount') and trips_cancellation_12m == 0) else K('seat_rate_standard'))"
      - trip_daily_rate: "float(CFIELD('trips', 'daily_rate_amount', booking_id=F('booking_id')))"
      - vehicle_band_uplift: "K('upper_band_uplift_amount') if trip_daily_rate >= K('upper_rate_band_amount') else (K('lower_band_uplift_amount') if trip_daily_rate >= K('lower_rate_band_amount') else K('no_band_uplift_amount'))"
      - protection_fee_lines_before: "SUM('guestplan_charges', 'charge_amount', charge_basis='daily_protection_fee')"
      - protection_refunds_before: "SUM('guestplan_charges', 'charge_amount', charge_basis='protection_refund')"
      - protection_charged_before: "protection_fee_lines_before + protection_refunds_before"
      - cover_load_percent: "K('high_cover_load_percent') if protection_charged_before >= K('high_cover_threshold_amount') else (K('middle_cover_load_percent') if protection_charged_before >= K('middle_cover_threshold_amount') else K('no_cover_load_percent'))"
      - cover_load_amount: "protection_charged_before * cover_load_percent / 100"
      - result: "RND(level_driver_fee * seat_fee_rate * seat_days / covered_days + vehicle_band_uplift + cover_load_amount, 2)"
    compute_basis:
      level_driver_fee: "The fee for an additional driver is the level's additional driver fee, taken in full for the whole of the election's covered days, and the amount is rounded half up to the cent only once the whole of it has been worked out."
      covered_days: "The fee for an additional driver is the level's additional driver fee, taken in full for the whole of the election's covered days, and the amount is rounded half up to the cent only once the whole of it has been worked out."
      trip_first_day: "Where the additional driver is taken on before the trip has begun, the seat days are the whole of the election's covered days."
      trip_last_day: "Where the additional driver is taken on once the trip has begun and the election covers fewer days than the long-trip day threshold, the seat days are the calendar days of the trip still to run, counted from the day the driver is taken on, that day included."
      trip_begun: "Where the additional driver is taken on before the trip has begun, the seat days are the whole of the election's covered days."
      days_still_to_run: "Where the additional driver is taken on once the trip has begun and the election covers fewer days than the long-trip day threshold, the seat days are the calendar days of the trip still to run, counted from the day the driver is taken on, that day included."
      seat_days: "Where the additional driver is taken on once the trip has begun and the election covers the long-trip day threshold or more, the seat days are the whole weeks of the trip still to run, counted from the day the driver is taken on and rounded up to a whole week, each week counted as seven days."
      trips_base_spend_12m: "A guest whose trips have carried the trip base rate to the established-guest spend threshold or more over the last twelve months and who has had no cancellation fee charged in that time is asked for the established-guest seat rate; a guest whose trips have carried the trip base rate to the returning-guest spend threshold or more over the last twelve months and who has had no cancellation fee charged in that time is asked for the returning-guest seat rate; every other guest is asked for the standard seat rate."
      trips_cancellation_12m: "A guest whose trips have carried the trip base rate to the established-guest spend threshold or more over the last twelve months and who has had no cancellation fee charged in that time is asked for the established-guest seat rate; a guest whose trips have carried the trip base rate to the returning-guest spend threshold or more over the last twelve months and who has had no cancellation fee charged in that time is asked for the returning-guest seat rate; every other guest is asked for the standard seat rate."
      seat_fee_rate: "The seat rate is the share of the level's additional driver fee the guest is actually asked for."
      trip_daily_rate: "Where the daily rate locked in on the trip reaches the upper rate band, the upper band uplift is added; where it reaches the lower rate band but not the upper rate band, the lower band uplift is added; where it reaches neither, no band uplift is added."
      vehicle_band_uplift: "A band uplift is added for the value of the car the trip is on."
      protection_fee_lines_before: "A cover load is added as a share of the protection already charged on the election for the trip."
      protection_refunds_before: "The protection already charged on the election is the protection fee charged for the trip less any protection fee returned against it."
      protection_charged_before: "The protection already charged on the election is the protection fee charged for the trip less any protection fee returned against it."
      cover_load_percent: "Where the protection already charged reaches the high cover threshold, the high cover load percentage is charged on it; where it reaches the middle cover threshold but not the high cover threshold, the middle cover load percentage is charged on it; where it reaches neither, no cover load is charged."
      cover_load_amount: "The cover load is the cover load percentage of the protection already charged, expressed as a percentage of that amount."
      result: "The fee for an additional driver is therefore the level's additional driver fee taken at the seat rate for the seat days out of the election's covered days, with the band uplift and the cover load added to that figure, and the whole rounded half up to the cent at the end."
    factors:
      - id: seat_rate_by_guest_record
        effect: parameter
        decides: seat_fee_rate
        bindings: [trips_base_spend_12m, trips_cancellation_12m, seat_fee_rate]
        ladder:
          - when: "the guest's trips have carried the trip base rate to the established-guest spend threshold or more over the last twelve months and no cancellation fee has been charged to the guest in that time"
            value: "K('seat_rate_established')"
          - when: "the guest's trips have carried the trip base rate to the returning-guest spend threshold or more over the last twelve months and no cancellation fee has been charged to the guest in that time"
            value: "K('seat_rate_returning')"
          - when: "otherwise"
            value: "K('seat_rate_standard')"
        baseline:
          seat_fee_rate: "K('seat_rate_standard')"
        evidence: [cross_category, history]
        cross_difficulty: trips
      - id: seat_days_convention
        effect: method
        decides: seat_days
        bindings: [days_still_to_run, seat_days]
        ladder:
          - when: "the additional driver is taken on once the trip has begun and the election covers the long-trip day threshold or more"
            method: "the seat days are the whole weeks of the trip still to run, counted from the day the driver is taken on and rounded up to a whole week, each week counted as seven days"
          - when: "the additional driver is taken on once the trip has begun and the election covers fewer days than the long-trip day threshold"
            method: "the seat days are the calendar days of the trip still to run, counted from the day the driver is taken on, that day included"
          - when: "the additional driver is taken on before the trip has begun"
            method: "the seat days are the whole of the election's covered days"
        baseline:
          seat_days: "covered_days"
        evidence: [date, cross_category]
        cross_difficulty: null
      - id: vehicle_band_uplift_step
        effect: parameter
        decides: vehicle_band_uplift
        bindings: [trip_daily_rate, vehicle_band_uplift]
        ladder:
          - when: "the daily rate locked in on the trip reaches the upper rate band"
            value: "K('upper_band_uplift_amount')"
          - when: "the daily rate locked in on the trip reaches the lower rate band but not the upper rate band"
            value: "K('lower_band_uplift_amount')"
          - when: "otherwise"
            value: "K('no_band_uplift_amount')"
        baseline:
          vehicle_band_uplift: "K('no_band_uplift_amount')"
        evidence: [cross_category]
        cross_difficulty: null
      - id: cover_load_share
        effect: parameter
        decides: cover_load_percent
        bindings: [protection_fee_lines_before, protection_refunds_before, protection_charged_before, cover_load_percent]
        ladder:
          - when: "the protection already charged on the election for the trip reaches the high cover threshold"
            value: "K('high_cover_load_percent')"
          - when: "the protection already charged on the election for the trip reaches the middle cover threshold but not the high cover threshold"
            value: "K('middle_cover_load_percent')"
          - when: "otherwise"
            value: "K('no_cover_load_percent')"
        baseline:
          cover_load_percent: "K('no_cover_load_percent')"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        An additional driver is taken onto the protection covering a trip one driver at a time, and what that driver
        costs is settled for the whole of that trip rather than day by day.
        The fee for an additional driver is the level's additional driver fee, taken in full for the whole of the
        election's covered days, and the amount is rounded half up to the cent only once the whole of it has been
        worked out.
      params: [driver_fee_declined, driver_fee_minimum, driver_fee_standard, driver_fee_advantage, driver_fee_premier, driver_fee_business]
    inputs:
      history:
        - {category: trips, table: trips_charges, aggregate: sum, field: charge_amount, within_months: 12, filters: {charge_basis: base_rate}}
        - {category: trips, table: trips_charges, aggregate: count, field: charge_id, within_months: 12, filters: {charge_basis: cancellation_fee}}
        - {table: guestplan_charges, aggregate: sum, field: charge_amount, within_months: null, filters: {charge_basis: daily_protection_fee}}
      cross_category: [trips]
  - id: guestplan_ext_young_driver_surcharge
    base_policy_refs: [guestplan_evt_fee_charging]
    overwrite:
      - base_policy: guestplan_evt_fee_charging
        superseded_clause: >-
          A driver under the young-driver threshold pays the level's protection surcharge on the fee, and the surcharge is posted as its own line so that it can be reversed on its own.
        replaced_by: >-
          The young-driver surcharge is therefore the surcharge percentage taken on that base, held to the ceiling that applies, with the trip step added to the capped figure, and the whole rounded half up to the cent at the end.
    trigger: state_due
    subject: [guestplan_protection_fee_charged]
    computes: surcharge_amount
    target_tool: post_young_driver_surcharge_f46febb9
    params:
      level_surcharge_declined: 0
      level_surcharge_minimum: 25
      level_surcharge_standard: 22
      level_surcharge_advantage: 18
      level_surcharge_premier: 15
      level_surcharge_business: 12
      level_daily_declined: 0.00
      level_daily_minimum: 14.00
      level_daily_standard: 26.00
      level_daily_advantage: 38.00
      level_daily_premier: 52.00
      level_daily_business: 64.00
      clean_record_surcharge_percent: 14.0
      watched_record_surcharge_percent: 17.5
      long_cover_day_threshold: 90
      medium_cover_day_threshold: 30
      long_trip_surcharge_ceiling: 900.00
      medium_trip_surcharge_ceiling: 400.00
      short_trip_surcharge_ceiling: 150.00
      long_reserved_month_threshold: 2
      medium_reserved_month_threshold: 1
      long_trip_step_amount: 45.00
      medium_trip_step_amount: 25.00
      no_trip_step_amount: 0.00
    rule: >-
      A guest under the marketplace's young-driver threshold on the first day of a trip carries a loading on the
      protection covering that trip, posted as its own line so that it can be reversed on its own without
      disturbing the cover itself.
      The young-driver surcharge is the level's protection surcharge percentage of the protection charged on the
      election for the daily cover of the trip, held to the short-trip surcharge ceiling, and the amount is rounded
      half up to the cent only once the whole of it has been worked out.
      The protection charged on the election for the daily cover is the protection fee charged for the trip less any
      protection fee returned against it.
      The young-driver surcharge on a trip is not fixed before the election's charge lines carry the fee due for
      every additional driver declared on it.
      The base the surcharge is taken on follows the party the cover carries and how far the trip has got. Where the
      election declares one or more additional drivers and cover is already running, the surcharge is taken on the
      whole of the protection charged on the election for the trip, the fees for additional drivers included. Where
      cover has not yet begun, the surcharge is taken on the level's daily amount for the election's covered days.
      Where cover is already running and the election declares no additional driver, the surcharge is taken on the
      protection charged on the election for the daily cover alone.
      The surcharge percentage follows how the guest has actually driven. Where the guest's trips carry no late
      return charged over the last twelve months and no mileage overage charged in that time, the clean-record
      surcharge percentage applies; where the guest's trips carry no late return charged over the last twelve months
      and one or more mileage overages charged in that time, the watched-record surcharge percentage applies; where
      the guest's trips carry one or more late returns charged over the last twelve months, the level's own
      protection surcharge percentage applies.
      The surcharge for one trip is held to a ceiling that follows the length of the cover charged. Where the
      protection fee lines standing on the election carry protection for the long-cover day threshold or more, the
      long-trip surcharge ceiling applies; where those lines carry protection for the medium-cover day threshold or
      more but fewer than the long-cover day threshold, the medium-trip surcharge ceiling applies; where they carry
      fewer, the short-trip surcharge ceiling applies.
      A trip step is added for how long the guest keeps the car. Where the trip's reserved period runs for the long
      reserved-month threshold or more whole months, the long trip step is added; where it runs for the medium
      reserved-month threshold or more whole months but fewer than the long reserved-month threshold, the medium
      trip step is added; where it runs for fewer, no trip step is added.
      The young-driver surcharge is therefore the surcharge percentage taken on that base, held to the ceiling that
      applies, with the trip step added to the capped figure, and the whole rounded half up to the cent at the
      end.
    prerequisite:
      - problem: guestplan_ext_additional_driver_charge
        kind: value_input
        gate: driver_lines_total
        form: state
        policy_source: >-
          The young-driver surcharge on a trip is not fixed before the election's charge lines carry the fee due for every additional driver declared on it.
        condition: >-
          The election's charge lines carry a line charging the additional driver fee for every additional driver the election declares.
        resolved_by: declare_additional_driver_a214c8dd
        effect: >-
          The additional driver fees standing on the election rise from nothing to the fee charged for the declared driver, which raises the base the surcharge percentage is taken on.
    cross_category:
      - category: trips
        as: history
        reads: [trip_start_date, trip_end_date, trips_charges.charge_basis, trips_charges.charge_date]
        note: The surcharge percentage is decided from the guest's own trip ledger, and the trip step from the reserved period of the trip.
    compute:
      - level_surcharge_percent: "K('level_surcharge_declined') if F('protection_level_name') == 'Keyturn Declined Protection' else (K('level_surcharge_minimum') if F('protection_level_name') == 'Keyturn Minimum Protection' else (K('level_surcharge_standard') if F('protection_level_name') == 'Keyturn Standard Protection' else (K('level_surcharge_advantage') if F('protection_level_name') == 'Keyturn Advantage Protection' else (K('level_surcharge_premier') if F('protection_level_name') == 'Keyturn Premier Protection' else K('level_surcharge_business')))))"
      - level_daily_amount: "K('level_daily_declined') if F('protection_level_name') == 'Keyturn Declined Protection' else (K('level_daily_minimum') if F('protection_level_name') == 'Keyturn Minimum Protection' else (K('level_daily_standard') if F('protection_level_name') == 'Keyturn Standard Protection' else (K('level_daily_advantage') if F('protection_level_name') == 'Keyturn Advantage Protection' else (K('level_daily_premier') if F('protection_level_name') == 'Keyturn Premier Protection' else K('level_daily_business')))))"
      - covered_days: "F('coverage_days')"
      - declared_drivers: "F('declared_secondary_driver_count')"
      - cover_running: "F('status') == 'active'"
      - fee_lines_total: "SUM('guestplan_charges', 'charge_amount', charge_basis='daily_protection_fee')"
      - refund_lines_total: "SUM('guestplan_charges', 'charge_amount', charge_basis='protection_refund')"
      - fee_lines_net: "fee_lines_total + refund_lines_total"
      - driver_lines_total: "SUM('guestplan_charges', 'charge_amount', charge_basis='secondary_driver_fee')"
      - surcharge_base: "(fee_lines_net + driver_lines_total) if (declared_drivers >= 1 and cover_running) else ((level_daily_amount * covered_days) if not cover_running else fee_lines_net)"
      - trips_late_return_12m: "XCOUNT('trips', 'trips_charges', within_months=12, date_field='charge_date', charge_basis='late_return')"
      - trips_mileage_overage_12m: "XCOUNT('trips', 'trips_charges', within_months=12, date_field='charge_date', charge_basis='mileage_overage')"
      - surcharge_rate: "K('clean_record_surcharge_percent') if (trips_late_return_12m == 0 and trips_mileage_overage_12m == 0) else (K('watched_record_surcharge_percent') if (trips_late_return_12m == 0 and trips_mileage_overage_12m >= 1) else level_surcharge_percent)"
      - charged_days_total: "SUM('guestplan_charges', 'days_covered', charge_basis='daily_protection_fee')"
      - surcharge_cap: "K('long_trip_surcharge_ceiling') if charged_days_total >= K('long_cover_day_threshold') else (K('medium_trip_surcharge_ceiling') if charged_days_total >= K('medium_cover_day_threshold') else K('short_trip_surcharge_ceiling'))"
      - trip_first_day: "CFIELD('trips', 'trip_start_date', booking_id=F('booking_id'))"
      - trip_last_day: "CFIELD('trips', 'trip_end_date', booking_id=F('booking_id'))"
      - reserved_months: "MONTHS(trip_first_day, trip_last_day)"
      - trip_step: "K('long_trip_step_amount') if reserved_months >= K('long_reserved_month_threshold') else (K('medium_trip_step_amount') if reserved_months >= K('medium_reserved_month_threshold') else K('no_trip_step_amount'))"
      - result: "RND(MN(surcharge_base * surcharge_rate / 100, surcharge_cap) + trip_step, 2)"
    compute_basis:
      level_surcharge_percent: "The young-driver surcharge is the level's protection surcharge percentage of the protection charged on the election for the daily cover of the trip, held to the short-trip surcharge ceiling, and the amount is rounded half up to the cent only once the whole of it has been worked out."
      level_daily_amount: "Where cover has not yet begun, the surcharge is taken on the level's daily amount for the election's covered days."
      covered_days: "Where cover has not yet begun, the surcharge is taken on the level's daily amount for the election's covered days."
      declared_drivers: "Where the election declares one or more additional drivers and cover is already running, the surcharge is taken on the whole of the protection charged on the election for the trip, the fees for additional drivers included."
      cover_running: "Where cover is already running and the election declares no additional driver, the surcharge is taken on the protection charged on the election for the daily cover alone."
      fee_lines_total: "The young-driver surcharge is the level's protection surcharge percentage of the protection charged on the election for the daily cover of the trip, held to the short-trip surcharge ceiling, and the amount is rounded half up to the cent only once the whole of it has been worked out."
      refund_lines_total: "The protection charged on the election for the daily cover is the protection fee charged for the trip less any protection fee returned against it."
      fee_lines_net: "The protection charged on the election for the daily cover is the protection fee charged for the trip less any protection fee returned against it."
      driver_lines_total: "The young-driver surcharge on a trip is not fixed before the election's charge lines carry the fee due for every additional driver declared on it."
      surcharge_base: "The base the surcharge is taken on follows the party the cover carries and how far the trip has got."
      trips_late_return_12m: "Where the guest's trips carry no late return charged over the last twelve months and no mileage overage charged in that time, the clean-record surcharge percentage applies; where the guest's trips carry no late return charged over the last twelve months and one or more mileage overages charged in that time, the watched-record surcharge percentage applies; where the guest's trips carry one or more late returns charged over the last twelve months, the level's own protection surcharge percentage applies."
      trips_mileage_overage_12m: "Where the guest's trips carry no late return charged over the last twelve months and no mileage overage charged in that time, the clean-record surcharge percentage applies; where the guest's trips carry no late return charged over the last twelve months and one or more mileage overages charged in that time, the watched-record surcharge percentage applies; where the guest's trips carry one or more late returns charged over the last twelve months, the level's own protection surcharge percentage applies."
      surcharge_rate: "The surcharge percentage follows how the guest has actually driven."
      charged_days_total: "Where the protection fee lines standing on the election carry protection for the long-cover day threshold or more, the long-trip surcharge ceiling applies; where those lines carry protection for the medium-cover day threshold or more but fewer than the long-cover day threshold, the medium-trip surcharge ceiling applies; where they carry fewer, the short-trip surcharge ceiling applies."
      surcharge_cap: "The surcharge for one trip is held to a ceiling that follows the length of the cover charged."
      trip_first_day: "A trip step is added for how long the guest keeps the car."
      trip_last_day: "A trip step is added for how long the guest keeps the car."
      reserved_months: "Where the trip's reserved period runs for the long reserved-month threshold or more whole months, the long trip step is added; where it runs for the medium reserved-month threshold or more whole months but fewer than the long reserved-month threshold, the medium trip step is added; where it runs for fewer, no trip step is added."
      trip_step: "A trip step is added for how long the guest keeps the car."
      result: "The young-driver surcharge is therefore the surcharge percentage taken on that base, held to the ceiling that applies, with the trip step added to the capped figure, and the whole rounded half up to the cent at the end."
    factors:
      - id: surcharge_base_selection
        effect: method
        decides: surcharge_base
        bindings: [fee_lines_total, refund_lines_total, fee_lines_net, driver_lines_total, surcharge_base]
        ladder:
          - when: "the election declares one or more additional drivers and cover is already running"
            method: "the surcharge is taken on the whole of the protection charged on the election for the trip, the fees for additional drivers included"
          - when: "cover has not yet begun"
            method: "the surcharge is taken on the level's daily amount for the election's covered days"
          - when: "cover is already running and the election declares no additional driver"
            method: "the surcharge is taken on the protection charged on the election for the daily cover alone"
        baseline:
          surcharge_base: "fee_lines_net"
        evidence: [history]
        cross_difficulty: null
      - id: surcharge_percent_by_driving_record
        effect: parameter
        decides: surcharge_rate
        bindings: [trips_late_return_12m, trips_mileage_overage_12m, surcharge_rate]
        ladder:
          - when: "the guest's trips carry no late return charged over the last twelve months and no mileage overage charged in that time"
            value: "K('clean_record_surcharge_percent')"
          - when: "the guest's trips carry no late return charged over the last twelve months and one or more mileage overages charged in that time"
            value: "K('watched_record_surcharge_percent')"
          - when: "the guest's trips carry one or more late returns charged over the last twelve months"
            value: "the level's own protection surcharge percentage"
        baseline:
