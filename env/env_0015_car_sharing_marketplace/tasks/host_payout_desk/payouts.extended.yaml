        reserve standing is never less than nothing, because freeing more in a period than was taken in it
        leaves the account holding nothing back rather than owing the host more than it holds. Nothing is
        withheld from the
        payable balance for tax documentation. No part of the payable balance is kept back as routine
        reserve. No returned transfer fee is taken from the drawable sum. A quarter of the money credited to
        the account in the month up to that day, counting the earnings and the corrections booked in that
        month, is held back until the statement closes. The drawable sum is the payable balance less those
        four amounts, rounded half to even to two decimal places, and never less than nothing.
      params: [withholding_none, topup_none, return_fee_none, holdback_scheduled]
    inputs:
      history:
        - {table: payouts_ledger, aggregate: sum, field: entry_amount, within_months: 0, filters: {}}
        - {table: payouts_ledger, aggregate: sum, field: entry_amount, within_months: 12, filters: {event_type: payouts_earning_posted}}
        - {table: payouts_ledger, aggregate: count, field: entry_amount, within_months: 12, filters: {event_type: payouts_transfer_returned}}
      cross_category: []
  - id: payouts_ext_negative_balance_recovery
    base_policy_refs: [payouts_evt_deductions, payouts_evt_earnings]
    overwrite:
      - base_policy: payouts_evt_deductions
        superseded_clause: >-
          A deduction never takes the account below zero on the entry that causes it, but where it does the balance stands negative and the marketplace recovers the schedule's share of each later earning until it is cleared, beginning only once the schedule's grace period in whole calendar days from the day the balance went negative has run.
        replaced_by: >-
          The sum recovered is the recovery share of the later earnings, less the part of what stands short that the protection enrolment carries rather than the host, and never less than nothing.
    trigger: state_due
    subject: [payouts_deduction_posted]
    computes: recovery_amount
    target_tool: post_balance_recovery_b10514b8
    params:
      recovery_share_early: 0.25
      recovery_share_mid: 0.50
      recovery_share_standard: 1.00
      grace_days: 14
      quarter_days: 92
      bearing_guest_fault: 0.80
      bearing_shared: 0.90
      bearing_full: 1.00
    rule: >
      Where money charged back by a guest has left a host's payout account short, the marketplace
      recovers what is owed out of the money the account has since earned rather than invoicing the
      host for it.
      The recovery share is the standard recovery share of the later earnings.
      How long the balance has stood short is counted in whole calendar days from the day of the most
      recent entry on which money charged back by a guest was taken off the account, up to that day.
      The recovery share turns on how the account settles and on how long the balance has stood short:
      where the account is swept as each trip completes and the balance has stood short for no longer
      than the schedule's grace period, the early recovery share applies; where the account is swept as
      each trip completes and the balance has stood short for longer than that grace period but no
      longer than a calendar quarter, the middle recovery share applies; in every other case the
      standard recovery share applies.
      The later earnings are the trip earnings credited to the account in the month up to that
      day.
      Which earnings count as later turns on how the account settles and on whether money has lately
      left the account: where the account is swept as each trip completes and a transfer has left it in
      the three months up to that day, the trip earnings credited in the twelve months up to that day
      count as later; where the account is swept as each trip completes and no transfer has left it in
      that period, the trip earnings credited in the three months up to that day count as later; in
      every other case only the trip earnings credited in the month up to that day count as
      later.
      What stands short is the entries booked to the account in the month up to that day,
      netted, taken as a positive sum where that netting falls below nothing and as nothing where it
      does not.
      Which entries are netted to find what stands short turns on how the account settles and on what
      caused the shortfall: where the account is swept as each trip completes and money charged back by
      a guest stands on the account, every entry ever booked to it is netted; where the account is swept
      as each trip completes and no money charged back by a guest stands on it, the entries booked in
      the twelve months up to that day are netted; in every other case only the entries booked in the
      month up to that day are netted.
      The whole of what stands short is borne by the host, so nothing is set aside as carried by the
      protection enrolment.
      The share of what stands short that the host bears turns on where the loss behind it fell and on
      the protection plan in force: where the loss behind the shortfall was found to be the guest's
      fault and the protection enrolment in force is the Keyturn Shield 90 Host Plan or the Keyturn
      Shield 85 Host Plan, the guest-at-fault bearing share applies; where the loss behind the shortfall
      was found to be a third party's or no one's fault and the protection enrolment in force is the
      Keyturn Shield 90 Host Plan or the Keyturn Shield 85 Host Plan, the shared bearing share applies;
      in every other case the host bears the whole of it.
      What the protection enrolment carries is what stands short less the part of it the host bears, and
      that part is not recovered from the host.
      The sum recovered is the recovery share of the later earnings, less the part of what stands short
      that the protection enrolment carries rather than the host, and never less than nothing.
      The recovery entry books that sum, rounded half to even to two decimal places.
    prerequisite: []
    cross_category:
      - category: hostplan
        as: branch
        reads: [protection_plan_name, hostplan_claims.liability_finding]
        note: The protection plan in force and the liability finding on the most recent appraisal decide the share of the shortfall the host bears rather than the enrolment.
    compute:
      - settles_on_completion: "F('payout_schedule_name') == 'Keyturn Standard Payout Schedule'"
      - shortfall_age_days: "DAYS(LATEST('payouts_ledger','entry_date', date_field='entry_date', entry_basis='chargeback_recovery'), NOW)"
      - recovery_share: "K('recovery_share_early') if (settles_on_completion and shortfall_age_days <= K('grace_days')) else (K('recovery_share_mid') if (settles_on_completion and shortfall_age_days <= K('quarter_days')) else K('recovery_share_standard'))"
      - transfers_quarter: "COUNT('payouts_ledger', within_months=3, date_field='entry_date', event_type='payouts_transfer_released')"
      - earn_year: "SUM('payouts_ledger','entry_amount', within_months=12, date_field='entry_date', entry_basis='trip_earning')"
      - earn_quarter: "SUM('payouts_ledger','entry_amount', within_months=3, date_field='entry_date', entry_basis='trip_earning')"
      - earn_month: "SUM('payouts_ledger','entry_amount', within_months=1, date_field='entry_date', entry_basis='trip_earning')"
      - later_earnings: "earn_year if (settles_on_completion and transfers_quarter > 0) else (earn_quarter if (settles_on_completion and transfers_quarter == 0) else earn_month)"
      - chargeback_total: "ABS(SUM('payouts_ledger','entry_amount', entry_basis='chargeback_recovery'))"
      - net_all: "SUM('payouts_ledger','entry_amount')"
      - net_year: "SUM('payouts_ledger','entry_amount', within_months=12, date_field='entry_date')"
      - net_month: "SUM('payouts_ledger','entry_amount', within_months=1, date_field='entry_date')"
      - outstanding: "RND(MX(-net_all, 0), 2) if (settles_on_completion and chargeback_total > 0) else (RND(MX(-net_year, 0), 2) if (settles_on_completion and chargeback_total == 0) else RND(MX(-net_month, 0), 2))"
      - plan_in_force: "CFIELD('hostplan','protection_plan_name', status='active')"
      - loss_finding: "XLATEST('hostplan','hostplan_claims','liability_finding', date_field='claim_date', event_type='hostplan_claim_appraised')"
      - host_bearing_share: "K('bearing_guest_fault') if (loss_finding == 'guest_at_fault' and (plan_in_force == 'Keyturn Shield 90 Host Plan' or plan_in_force == 'Keyturn Shield 85 Host Plan')) else (K('bearing_shared') if ((loss_finding == 'third_party' or loss_finding == 'no_fault') and (plan_in_force == 'Keyturn Shield 90 Host Plan' or plan_in_force == 'Keyturn Shield 85 Host Plan')) else K('bearing_full'))"
      - enrolment_relief: "RND(outstanding - RND(outstanding * host_bearing_share, 2), 2)"
      - result: "RND(MX(RND(later_earnings * recovery_share, 2) - enrolment_relief, 0), 2)"
    compute_basis:
      shortfall_age_days: "How long the balance has stood short is counted in whole calendar days from the day of the most recent entry on which money charged back by a guest was taken off the account, up to that day."
      recovery_share: "The recovery share turns on how the account settles and on how long the balance has stood short: where the account is swept as each trip completes and the balance has stood short for no longer than the schedule's grace period, the early recovery share applies; where the account is swept as each trip completes and the balance has stood short for longer than that grace period but no longer than a calendar quarter, the middle recovery share applies; in every other case the standard recovery share applies."
      transfers_quarter: "where the account is swept as each trip completes and a transfer has left it in the three months up to that day, the trip earnings credited in the twelve months up to that day count as later"
      earn_year: "the trip earnings credited in the twelve months up to that day count as later"
      earn_quarter: "the trip earnings credited in the three months up to that day count as later"
      earn_month: "The later earnings are the trip earnings credited to the account in the month up to that day."
      later_earnings: "Which earnings count as later turns on how the account settles and on whether money has lately left the account: where the account is swept as each trip completes and a transfer has left it in the three months up to that day, the trip earnings credited in the twelve months up to that day count as later; where the account is swept as each trip completes and no transfer has left it in that period, the trip earnings credited in the three months up to that day count as later; in every other case only the trip earnings credited in the month up to that day count as later."
      chargeback_total: "where the account is swept as each trip completes and money charged back by a guest stands on the account, every entry ever booked to it is netted"
      net_all: "every entry ever booked to it is netted"
      net_year: "the entries booked in the twelve months up to that day are netted"
      net_month: "What stands short is the entries booked to the account in the month up to that day, netted, taken as a positive sum where that netting falls below nothing and as nothing where it does not."
      outstanding: "Which entries are netted to find what stands short turns on how the account settles and on what caused the shortfall: where the account is swept as each trip completes and money charged back by a guest stands on the account, every entry ever booked to it is netted; where the account is swept as each trip completes and no money charged back by a guest stands on it, the entries booked in the twelve months up to that day are netted; in every other case only the entries booked in the month up to that day are netted."
      plan_in_force: "The share of what stands short that the host bears turns on where the loss behind it fell and on the protection plan in force"
      loss_finding: "where the loss behind the shortfall was found to be the guest's fault and the protection enrolment in force is the Keyturn Shield 90 Host Plan or the Keyturn Shield 85 Host Plan, the guest-at-fault bearing share applies"
      host_bearing_share: "The share of what stands short that the host bears turns on where the loss behind it fell and on the protection plan in force: where the loss behind the shortfall was found to be the guest's fault and the protection enrolment in force is the Keyturn Shield 90 Host Plan or the Keyturn Shield 85 Host Plan, the guest-at-fault bearing share applies; where the loss behind the shortfall was found to be a third party's or no one's fault and the protection enrolment in force is the Keyturn Shield 90 Host Plan or the Keyturn Shield 85 Host Plan, the shared bearing share applies; in every other case the host bears the whole of it."
      enrolment_relief: "What the protection enrolment carries is what stands short less the part of it the host bears, and that part is not recovered from the host."
      result: "The sum recovered is the recovery share of the later earnings, less the part of what stands short that the protection enrolment carries rather than the host, and never less than nothing."
    factors:
      - id: shortfall_recovery_share
        effect: parameter
        decides: recovery_share
        bindings: [shortfall_age_days, recovery_share]
        ladder:
          - when: "the account is swept as each trip completes and the balance has stood short for no longer than the schedule's grace period"
            value: "K('recovery_share_early')"
          - when: "the account is swept as each trip completes and the balance has stood short for longer than that grace period but no longer than a calendar quarter"
            value: "K('recovery_share_mid')"
          - when: "otherwise"
            value: "K('recovery_share_standard')"
        baseline:
          recovery_share: "K('recovery_share_standard')"
        evidence: [history, date]
        cross_difficulty: null
      - id: later_earnings_measure
        effect: method
        decides: later_earnings
        bindings: [transfers_quarter, earn_year, earn_quarter, earn_month, later_earnings]
        ladder:
          - when: "the account is swept as each trip completes and a transfer has left it in the three months up to that day"
            method: "the trip earnings credited in the twelve months up to that day count as later"
          - when: "the account is swept as each trip completes and no transfer has left it in that period"
            method: "the trip earnings credited in the three months up to that day count as later"
          - when: "otherwise"
            method: "only the trip earnings credited in the month up to that day count as later"
        baseline:
          later_earnings: "earn_month"
        evidence: [history]
        cross_difficulty: null
      - id: shortfall_measure
        effect: method
        decides: outstanding
        bindings: [chargeback_total, net_all, net_year, net_month, outstanding]
        ladder:
          - when: "the account is swept as each trip completes and money charged back by a guest stands on the account"
            method: "every entry ever booked to it is netted"
          - when: "the account is swept as each trip completes and no money charged back by a guest stands on it"
            method: "the entries booked in the twelve months up to that day are netted"
          - when: "otherwise"
            method: "only the entries booked in the month up to that day are netted"
        baseline:
          outstanding: "RND(MX(-net_month, 0), 2)"
        evidence: [history]
        cross_difficulty: null
      - id: host_bearing_of_shortfall
        effect: parameter
        decides: host_bearing_share
        bindings: [plan_in_force, loss_finding, host_bearing_share]
        ladder:
          - when: "the loss behind the shortfall was found to be the guest's fault and the protection enrolment in force is the Keyturn Shield 90 Host Plan or the Keyturn Shield 85 Host Plan"
            value: "K('bearing_guest_fault')"
          - when: "the loss behind the shortfall was found to be a third party's or no one's fault and the protection enrolment in force is the Keyturn Shield 90 Host Plan or the Keyturn Shield 85 Host Plan"
            value: "K('bearing_shared')"
          - when: "otherwise"
            value: "K('bearing_full')"
        baseline:
          host_bearing_share: "K('bearing_full')"
        evidence: [cross_category]
        cross_difficulty: hostplan
    baseline:
      rule: >-
        Where money charged back by a guest has left a host's payout account short, the marketplace
        recovers what is owed out of the money the account has since earned rather than invoicing the
        host for it. The recovery share is the standard recovery share of the later earnings. The later
        earnings are the trip earnings credited to the account in the month up to that day.
        What stands short is the entries booked to the account in the month up to that day,
        netted, taken as a positive sum where that netting falls below nothing and as nothing where it
        does not. The whole of what stands short is borne by the host, so nothing is set aside as
        carried by the protection enrolment. What the protection enrolment carries is what stands short
        less the part of it the host bears, and that part is not recovered from the host. The sum
        recovered is the recovery share of the later earnings, less the part of what stands short that
        the protection enrolment carries rather than the host, and never less than nothing. The recovery
        entry books that sum, rounded half to even to two decimal places.
      params: [recovery_share_standard, bearing_full]
    inputs:
      history:
        - {table: payouts_ledger, aggregate: sum, field: entry_amount, within_months: 12, filters: {entry_basis: trip_earning}}
        - {table: payouts_ledger, aggregate: sum, field: entry_amount, within_months: 0, filters: {}}
        - {category: hostplan, table: hostplan_claims, aggregate: latest, field: liability_finding, within_months: 0, filters: {event_type: hostplan_claim_appraised}}
