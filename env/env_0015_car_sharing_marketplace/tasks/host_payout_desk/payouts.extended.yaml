      - returns_year_fee: "COUNT('payouts_ledger', within_months=12, date_field='entry_date', event_type='payouts_transfer_returned')"
      - return_fee_due: "K('return_fee_single') if returns_year_fee == 1 else (K('return_fee_repeat') if returns_year_fee > 1 else K('return_fee_none'))"
      - transfers_month: "COUNT('payouts_ledger', within_months=1, date_field='entry_date', event_type='payouts_transfer_released')"
      - corrections_month: "COUNT('payouts_ledger', within_months=1, date_field='entry_date', entry_basis='adjustment_correction')"
      - month_credits: "RND(SUM('payouts_ledger','entry_amount', within_months=1, date_field='entry_date', event_type='payouts_earning_posted') + SUM('payouts_ledger','entry_amount', within_months=1, date_field='entry_date', event_type='payouts_adjustment_posted'), 2)"
      - month_holdback_rate: "K('holdback_after_draw') if transfers_month > 0 else (K('holdback_before_draw') if (transfers_month == 0 and corrections_month > 0) else K('holdback_scheduled'))"
      - result: "RND(MX(payable_base - RND(payable_base * withholding_rate, 2) - RND(payable_base * routine_topup_rate, 2) - return_fee_due - RND(month_credits * month_holdback_rate, 2), 0), 2)"
