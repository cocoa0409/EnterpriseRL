  - id: payouts_ext_requested_draw
    base_policy_refs: [payouts_evt_transfer, payouts_account_opening, payouts_evt_reserve, payouts_evt_transfer_failure, payouts_evt_deductions]
    overwrite:
      - base_policy: payouts_evt_transfer
        superseded_clause: >-
          A host on a schedule that pays on request asks for the money themselves, and only the host can make that request, since it is their money being moved.
        replaced_by: >-
          A draw on a schedule that pays on request is made by the host in person on their own account, and the sum that leaves is the drawable sum worked out as this rule sets out.
      - base_policy: payouts_evt_transfer
        superseded_clause: >-
          A sweep carries the payable balance only, which is the available balance less anything held in reserve, and where that balance is under the schedule's minimum nothing goes out and the money waits for the next run.
        replaced_by: >-
          The drawable sum starts from the payable balance, which is the credited sum of the account less the reserve standing on it, and neither of those two quantities is read off the balances the account row carries.
      - base_policy: payouts_account_opening
        superseded_clause: >-
          Where earnings in a calendar year pass the tax documentation threshold, money stops leaving the account until the documentation is on file, and the marketplace withholds the stated share of each payout while the documentation is missing rather than refusing the payout outright.
        replaced_by: >-
          The share withheld for tax documentation turns on the state of that documentation and on what the account has earned: where the tax documentation on the account is not on file and the earnings credited to it in the twelve months up to that day stand above the documentation threshold, the full withholding share applies; where the tax documentation on the account is not on file and the earnings credited to it in the twelve months up to that day stand at or below the documentation threshold, the reduced withholding share applies; in every other case nothing is withheld.
      - base_policy: payouts_evt_reserve
        superseded_clause: >-
          A host in their first trips has the new-host share held from each earning instead of the routine share, and the new-host reserve stops being taken once the host has settled the schedule's qualifying number of trips; the two reserves are never taken together on the same earning, the larger of the two governing.
        replaced_by: >-
          The share of the drawable sum kept back as routine reserve turns on how many trips the account has been credited for and on whether it is still carrying reserves: where fewer trip earnings than the schedule's qualifying number have been credited to the account in the twelve months up to that day, the new-host reserve share applies; where the schedule's qualifying number of trip earnings or more have been credited to it in that period and a reserve has been taken on the account in that period, the routine reserve share applies; in every other case no reserve share is kept back from the drawable sum.
      - base_policy: payouts_evt_transfer_failure
        superseded_clause: >-
          The schedule's returned transfer fee is charged as its own deduction, once for each return, and it is not charged twice where one return is re-sent and returns again on details the host had already corrected.
        replaced_by: >-
          The returned transfer fee still owed turns on how often the account's transfers have come back: where exactly one transfer has come back unpaid on the account in the twelve months up to that day, the single return fee is owed; where two or more transfers have come back unpaid on it in that period, the repeat return fee is owed; in every other case no return fee is owed.
      - base_policy: payouts_evt_deductions
        superseded_clause: >-
          Transfer fees are deductions in their own right and are taken on the day the transfer goes out, so a host who asks for money quickly sees the cost of speed on the same statement line day as the payout itself.
        replaced_by: >-
          The returned transfer fee still owed is taken off the drawable sum itself rather than booked as a deduction of its own, so the sum that leaves is already net of it.
    trigger: on_request
    subject: [payouts_transfer_released]
    computes: draw_amount
    target_tool: release_host_payout_draw_8e4fb8ab
    params:
      tax_threshold: 600.00
      withholding_full: 0.24
      withholding_reduced: 0.10
      withholding_none: 0.00
      qualifying_trip_earnings: 10
      topup_new_host: 0.10
      topup_routine: 0.03
      topup_none: 0.00
      return_fee_single: 20.00
      return_fee_repeat: 40.00
      return_fee_none: 0.00
      holdback_after_draw: 0.50
      holdback_before_draw: 0.00
      holdback_scheduled: 0.25
    rule: >
      A draw on a schedule that pays on request is made by the host in person on their own account, and
      the sum that leaves is the drawable sum worked out as this rule sets out.
      The sum a host may draw is not fixed before every reserve standing against a claim on the account
      carries the release entry that answering that claim calls for.
      The drawable sum starts from the payable balance, which is the credited sum of the account less the
      reserve standing on it, and neither of those two quantities is read off the balances the account row
      carries.
      The credited sum of the account is the entries booked to it in the twelve months up to that day,
      netted, the reserves taken and the reserves freed being left out of that netting because they move
      money within the account rather than into or out of it.
      Which entries are netted turns on whether a transfer has come back unpaid and on whether money has
      gone out since it did: where a transfer has come back unpaid on the account in the twelve months up
      to that day and no transfer has gone out since it came back, every entry ever booked to the account
      is netted and the money put back by a returned transfer is then held out of the credited sum,
      because it has not yet been sent anywhere; where a transfer has come back unpaid on the account in
      the twelve months up to that day and a transfer has gone out since it came back, every entry ever
      booked to the account is netted; in every other case the entries booked to the account in the twelve
      months up to that day are netted.
      The reserve standing on the account is the reserves taken in the month up to that day less the
      reserves freed in that month.
      Whichever stretch is measured, the reserve standing is never less than nothing, because freeing more
      in a period than was taken in it leaves the account holding nothing back rather than owing the host
      more than it holds.
      Which reserves count as standing turns on whether money has lately been freed and on whether a
      reserve has lately been taken: where a reserve has been freed from the account in the month up to
      that day, every reserve ever taken on the account less every reserve ever freed from it counts as
      standing; where no reserve has been freed from the account in that month and a reserve was taken on
      it in that month, the reserves taken in the twelve months up to that day less the reserves freed in
      that same period count as standing; in every other case the reserves taken in the month up to that
      day less the reserves freed in that month count as standing.
      Nothing is withheld from the payable balance for tax documentation.
      The share withheld for tax documentation turns on the state of that documentation and on what the
      account has earned: where the tax documentation on the account is not on file and the earnings
      credited to it in the twelve months up to that day stand above the documentation threshold, the full
      withholding share applies; where the tax documentation on the account is not on file and the
      earnings credited to it in the twelve months up to that day stand at or below the documentation
      threshold, the reduced withholding share applies; in every other case nothing is withheld.
      No part of the payable balance is kept back as routine reserve.
      The share of the drawable sum kept back as routine reserve turns on how many trips the account has
      been credited for and on whether it is still carrying reserves: where fewer trip earnings than the
      schedule's qualifying number have been credited to the account in the twelve months up to that day,
      the new-host reserve share applies; where the schedule's qualifying number of trip earnings or more
      have been credited to it in that period and a reserve has been taken on the account in that period,
      the routine reserve share applies; in every other case no reserve share is kept back from the
      drawable sum.
      No returned transfer fee is taken from the drawable sum.
      The returned transfer fee still owed turns on how often the account's transfers have come back:
      where exactly one transfer has come back unpaid on the account in the twelve months up to that day,
      the single return fee is owed; where two or more transfers have come back unpaid on it in that
      period, the repeat return fee is owed; in every other case no return fee is owed.
      The returned transfer fee still owed is taken off the drawable sum itself rather than booked as a
      deduction of its own, so the sum that leaves is already net of it.
      A quarter of the money credited to the account in the month up to that day, counting the earnings
      and the corrections booked in that month, is held back until the statement closes.
      The share of that month's credits held back turns on whether the host has already drawn in the month
      and on whether the month's entries have been corrected: where a transfer has already been released
      from the account in the month up to that day, half of that month's credits is held back; where no
      transfer has been released from it in that month and a correcting entry has been booked to it in
      that month, none of that month's credits is held back; in every other case a quarter of that month's
      credits is held back.
      The withholding share and the routine reserve share are each taken on the payable balance itself
      rather than one upon the other, the two deductions being worked out separately and then both taken
      off it; the return fee and the held-back share of the month's credits are then taken off in turn.
      The drawable sum is the payable balance less those four amounts, rounded half to even to two decimal
      places, and never less than nothing.
