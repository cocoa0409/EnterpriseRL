    baseline:
      rule: >-
        A deductible recovery taken from a host's payout account is put right against what the protection
        enrolment behind it bears, because the recovery is only ever the host's own share of a settled loss
        and never more. The sum over-recovered is the deductible recoveries booked to the account in the
        month up to the day the correction is worked out, less the deductible the host actually carries on
        the settled loss. The deductible the host carries is
        the appraised sum of the loss, taken at the standard deductible share, and nothing of it is given
        back. The appraised sum of the loss is the appraisal recorded on the most recent appraisal made
        under the enrolment. The deductible the host carries, less whatever of it is given back, is the
        deductible payable, and the sum over-recovered is the recoveries counted less that deductible
        payable. A fifth of the sum over-recovered is put back at once, and the rest follows when the claim
        that produced the recovery is settled. The correcting entry books the
        share of the sum over-recovered that is put back, rounded half to even to two decimal places, and
        never less than nothing.
      params: [deductible_share_standard, refund_share_none, instalment_share_part]
    inputs:
      history:
        - {table: payouts_ledger, aggregate: sum, field: entry_amount, within_months: 1, filters: {entry_basis: claim_deductible_recovery}}
        - {category: hostplan, table: hostplan_claims, aggregate: count, field: appraisal_amount, within_months: 12, filters: {event_type: hostplan_claim_appraised}}
        - {category: hostplan, table: hostplan_claims, aggregate: latest, field: appraisal_amount, within_months: 0, filters: {event_type: hostplan_claim_appraised}}
      cross_category: [hostplan]
  - id: payouts_ext_claim_reserve_release
    base_policy_refs: [payouts_evt_reserve, payouts_evt_transfer_failure]
    overwrite:
      - base_policy: payouts_evt_reserve
        superseded_clause: >-
          that hold stands until the claim is paid, refused or withdrawn whatever the routine hold period says
        replaced_by: >-
          Money held back on a payout account against a claim is freed once the claim it was held against has been answered on the account, so that the host is not left short of money the marketplace no longer has any exposure to.
      - base_policy: payouts_evt_reserve
        superseded_clause: >-
          holds it for the schedule's hold period in whole calendar days counted from the day the earning was posted, releasing it on the trigger the schedule names rather than on request
        replaced_by: >-
          The routine reserve the account must go on carrying is the routine reserves taken in the month up to that day, and a quarter of it is kept back out of the sum freed.
    trigger: state_due
    subject: [payouts_reserve_released]
    computes: release_amount
    target_tool: release_claim_reserve_fb50cb2e
    params:
      residual_matured: 0.00
      residual_fresh: 0.10
      residual_standard: 0.25
      hold_back_fresh: 1.00
      hold_back_recent: 0.50
      hold_back_matured: 0.25
      quarter_days: 92
      week_days: 7
      returns_tolerated: 1
    rule: >
      Money held back on a payout account against a claim is freed once the claim it was held against has
      been answered on the account, so that the host is not left short of money the marketplace no longer
      has any exposure to.
      The sum freed from a claim reserve is worked out only after every deductible recovery standing on
      the account that was taken beyond what the enrolment's records bear carries its own correcting
      entry.
      The standing claim hold is every reserve taken against an open claim on the account, less every
      reserve already freed from it.
      What the settlement money answers is the excess of the correcting entries booked to the account over
      the standing claim hold, and never less than nothing.
      Part of what is answered is kept back against exposure that has not yet cooled, at the standard
      residual share.
      How much of that standing hold the settlement money answers turns on the correcting entries booked
      to the account and on whether its transfers have been coming back: where the correcting entries
      booked to the account meet or exceed the standing claim hold and no more than the tolerated number
      of transfers have come back unpaid on it in the last twelve months, the whole standing hold is
      answered; where the correcting entries booked to the account fall short of the standing claim hold
      and no more than the tolerated number of transfers have come back unpaid on it in the last twelve
      months, only as much of the hold as those correcting entries come to is answered; in every other
      case only the excess of the correcting entries over the standing hold is answered.
      The residual share turns on how the account settles and on how long the claim hold has stood: where
      the account settles only when the host asks and the claim hold has stood for longer than a calendar
      quarter, the matured residual share applies; where the account settles only when the host asks and
      the claim hold has stood for a calendar quarter or less, the fresh residual share applies; in every
      other case the standard residual share applies.
      The routine reserve the account must go on carrying is the routine reserves taken in the month up to
      that day, and a quarter of it is kept back out of the sum freed.
      Which routine reserves count as standing turns on how the account settles and on whether money has
      lately been freed from it: where the account settles only when the host asks and no reserve has been
      freed from it in the last three months, every routine reserve ever taken on the account counts as
      standing; where the account settles only when the host asks and a reserve has been freed from it in
      the last three months, only the routine reserves taken in the three months up to that day count as
      standing; in every other case only the routine reserves taken in the month up to that day count as
      standing.
      How much of the routine reserve standing is kept back out of the sum freed turns on how the account
      settles and on how lately a routine reserve was taken: where the account settles only when the host
      asks and a routine reserve was taken on it within the past week, the whole routine reserve standing
      is kept back; where the account settles only when the host asks and the newest routine reserve on it
      was taken more than a week but no more than a calendar quarter ago, half of the routine reserve
      standing is kept back; in every other case a quarter of the routine reserve standing is kept back.
      The sum freed from a claim reserve is the standing claim hold that the settlement money has
      answered, less the part of it kept back against exposure that has not yet cooled, and less again the
      routine reserve the account must go on carrying.
      The release entry books that sum, rounded half to even to two decimal places, and never less than
      nothing.
    prerequisite:
      - problem: payouts_ext_recovery_correction
        kind: value_input
        gate: settlement_booked
        form: state
        policy_source: >-
          The sum freed from a claim reserve is worked out only after every deductible recovery standing on the account that was taken beyond what the enrolment's records bear carries its own correcting entry.
        condition: >-
          Every deductible recovery entry on the account that was taken beyond the deductible the enrolment's records bear is answered by a correcting entry naming it.
        resolved_by: post_recovery_correction_f20745c1
        effect: >-
          The correcting entries booked to the account rise by the sum put back, so the settlement money answering the standing claim hold, and with it the sum freed, are worked out on a different figure.
    cross_category: []
    compute:
      - settles_on_request: "F('payout_schedule_name') == 'Keyturn Instant Payout Schedule'"
      - claim_hold_total: "SUM('payouts_ledger','entry_amount', event_type='payouts_reserve_held', hold_reason='claim_open')"
      - release_taken: "SUM('payouts_ledger','entry_amount', event_type='payouts_reserve_released')"
      - hold_standing: "RND(claim_hold_total + release_taken, 2)"
      - settlement_booked: "SUM('payouts_ledger','entry_amount', entry_basis='adjustment_correction')"
      - returns_year: "COUNT('payouts_ledger', within_months=12, date_field='entry_date', event_type='payouts_transfer_returned')"
      - release_basis: "hold_standing if (settlement_booked >= hold_standing and returns_year <= K('returns_tolerated')) else (RND(settlement_booked, 2) if (settlement_booked < hold_standing and returns_year <= K('returns_tolerated')) else RND(MX(settlement_booked - hold_standing, 0), 2))"
      - hold_age_days: "DAYS(LATEST('payouts_ledger','entry_date', date_field='entry_date', event_type='payouts_reserve_held', hold_reason='claim_open'), NOW)"
      - residual_rate: "K('residual_matured') if (settles_on_request and hold_age_days > K('quarter_days')) else (K('residual_fresh') if (settles_on_request and hold_age_days <= K('quarter_days')) else K('residual_standard'))"
      - releases_quarter: "COUNT('payouts_ledger', within_months=3, date_field='entry_date', event_type='payouts_reserve_released')"
      - routine_hold_all: "SUM('payouts_ledger','entry_amount', event_type='payouts_reserve_held', hold_reason='none')"
      - routine_hold_quarter: "SUM('payouts_ledger','entry_amount', within_months=3, date_field='entry_date', event_type='payouts_reserve_held', hold_reason='none')"
      - routine_hold_month: "SUM('payouts_ledger','entry_amount', within_months=1, date_field='entry_date', event_type='payouts_reserve_held', hold_reason='none')"
      - routine_standing: "routine_hold_all if (settles_on_request and releases_quarter == 0) else (routine_hold_quarter if (settles_on_request and releases_quarter > 0) else routine_hold_month)"
      - newest_routine_age_days: "DAYS(LATEST('payouts_ledger','entry_date', date_field='entry_date', event_type='payouts_reserve_held', hold_reason='none'), NOW)"
      - routine_hold_back_rate: "K('hold_back_fresh') if (settles_on_request and newest_routine_age_days <= K('week_days')) else (K('hold_back_recent') if (settles_on_request and newest_routine_age_days <= K('quarter_days')) else K('hold_back_matured'))"
      - result: "RND(MX(release_basis - RND(release_basis * residual_rate, 2) - RND(routine_standing * routine_hold_back_rate, 2), 0), 2)"
    compute_basis:
