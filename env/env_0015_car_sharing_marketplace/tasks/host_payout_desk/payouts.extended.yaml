        map: {customer_id: customer_id, entry_basis: adjustment_correction}
  - type: payouts_adjustment_posted
    target: payouts_ledger
    meaning: An earlier entry is corrected, or money from a claim settlement is booked to the account.
    grain: One row per correction made against one earlier entry or claim.
    account: host_earnings
    direction: in
    distinguish_by: [entry_date, entry_basis, source_ledger_id, entry_amount]
    fields:
      ledger_id: Reference number of the entry.
      payout_account_id: The account the correction is booked to.
      customer_id: The host affected.
      booking_id: The trip the correction arises from, where it arises from one.
      source_ledger_id: The entry being corrected, where one is being corrected.
      event_type: Event family of the entry.
      entry_date: Date the correction was booked.
      entry_amount: Money booked by the correction.
      entry_basis: What the correction is for.
      settlement_reference: The reference the host can quote for the correction.
      statement_period: The statement month the entry falls in.
    triggers: []

measures:
  - id: payouts_msr_earnings_90d
    window: Rolling 90 calendar days counted back from the handling date, the handling date included.
    measure: Sum of entry_amount over this account's payouts_earning_posted entries.
  - id: payouts_msr_returned_transfers_12m
    window: Rolling 12 calendar months counted back from the handling date, the handling date included.
    measure: Count of payouts_transfer_returned entries on this account.
  - id: payouts_msr_settled_trips_lifetime
    window: The whole life of the host's account, with no time window.
    measure: Count of settled trips across every vehicle this host lists.

policies:
  - id: payouts_agg_multi_holding
    subject: [payouts_account_opened]
    rule: >-
      A host settles through one payout account and one only, however many vehicles they list, so a second application from a host who already holds an account is a change of deposit details on the account they hold rather than a new account.
      All of a host's earnings, deductions and reserves meet in that one account, which is what makes the balance the host sees the whole truth of what they are owed.
      An account that has been closed is not reopened; a host returning to the marketplace opens a fresh account and the closed one stays closed.
    eligibility: []
    params: {max_per_customer: 1}
  - id: payouts_account_opening
    subject: [payouts_account_opened, payouts_account_verified]
    rule: >-
      An account settles nothing until the deposit details have been checked, and the check takes the schedule's verification period in business days counted from the day the details were given.
      The schedule a host may hold depends on what they have done on the marketplace, so a schedule is open only where the host meets its settled trip count, its monthly earnings floor and its tenure in whole calendar days counted from the day their member profile was opened; a host who meets none of them opens on the entry schedule and moves up later.
      The host is the only person who can give or change their own deposit details, since the money is theirs, and the marketplace never sets them on the host's behalf.
      Where earnings in a calendar year pass the tax documentation threshold, money stops leaving the account until the documentation is on file, and the marketplace withholds the stated share of each payout while the documentation is missing rather than refusing the payout outright.
      An account whose deposit check fails is suspended rather than left pending, and the host is told which detail failed so that they can correct it.
    eligibility:
      - id: deposit_details_verified
        applies_to: [payouts_account_verified]
        kind: authorization
        condition: An account settles nothing until the deposit details have been checked, and the check takes the schedule's verification period in business days counted from the day the details were given.
        evidence_fields: [payouts_accounts.bank_account_last4, payouts_accounts.payout_account_id, payouts_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[payouts_accounts.payout_account_id]]
          action_bindings: {payouts_accounts.payout_account_id: payout_account_id}
    params:
      per_tier:
        Keyturn Standard Payout Schedule: {bank_verification_required: "=bank_verification_required", bank_verification_days: "=bank_verification_days", minimum_completed_trips_to_qualify: "=minimum_completed_trips_to_qualify", minimum_monthly_earnings_to_qualify: "=minimum_monthly_earnings_to_qualify", minimum_host_tenure_days: "=minimum_host_tenure_days", tax_form_required_threshold_amount: "=tax_form_required_threshold_amount", tax_withholding_percent: "=tax_withholding_percent"}
        Keyturn Weekly Batch Payout Schedule: {bank_verification_required: "=bank_verification_required", bank_verification_days: "=bank_verification_days", minimum_completed_trips_to_qualify: "=minimum_completed_trips_to_qualify", minimum_monthly_earnings_to_qualify: "=minimum_monthly_earnings_to_qualify", minimum_host_tenure_days: "=minimum_host_tenure_days", tax_form_required_threshold_amount: "=tax_form_required_threshold_amount", tax_withholding_percent: "=tax_withholding_percent"}
        Keyturn Express Payout Schedule: {bank_verification_required: "=bank_verification_required", bank_verification_days: "=bank_verification_days", minimum_completed_trips_to_qualify: "=minimum_completed_trips_to_qualify", minimum_monthly_earnings_to_qualify: "=minimum_monthly_earnings_to_qualify", minimum_host_tenure_days: "=minimum_host_tenure_days", tax_form_required_threshold_amount: "=tax_form_required_threshold_amount", tax_withholding_percent: "=tax_withholding_percent"}
        Keyturn Instant Payout Schedule: {bank_verification_required: "=bank_verification_required", bank_verification_days: "=bank_verification_days", minimum_completed_trips_to_qualify: "=minimum_completed_trips_to_qualify", minimum_monthly_earnings_to_qualify: "=minimum_monthly_earnings_to_qualify", minimum_host_tenure_days: "=minimum_host_tenure_days", tax_form_required_threshold_amount: "=tax_form_required_threshold_amount", tax_withholding_percent: "=tax_withholding_percent"}
        Keyturn Fleet Settlement Schedule: {bank_verification_required: "=bank_verification_required", bank_verification_days: "=bank_verification_days", minimum_completed_trips_to_qualify: "=minimum_completed_trips_to_qualify", minimum_monthly_earnings_to_qualify: "=minimum_monthly_earnings_to_qualify", minimum_host_tenure_days: "=minimum_host_tenure_days", tax_form_required_threshold_amount: "=tax_form_required_threshold_amount", tax_withholding_percent: "=tax_withholding_percent"}
        Keyturn Reserve-Backed Settlement Schedule: {bank_verification_required: "=bank_verification_required", bank_verification_days: "=bank_verification_days", minimum_completed_trips_to_qualify: "=minimum_completed_trips_to_qualify", minimum_monthly_earnings_to_qualify: "=minimum_monthly_earnings_to_qualify", minimum_host_tenure_days: "=minimum_host_tenure_days", tax_form_required_threshold_amount: "=tax_form_required_threshold_amount", tax_withholding_percent: "=tax_withholding_percent"}
    measures: [payouts_msr_settled_trips_lifetime]
  - id: payouts_schedule_change
    subject: [payouts_schedule_changed]
    rule: >-
      A host may move between payout schedules, and the move takes effect on a future date rather than the day it is asked for, so a sweep already in flight settles on the schedule it started under.
      The host must give the schedule's notice, and the change then takes effect the schedule's effective period after the notice is recorded, counted in whole calendar days from the day the notice is taken, with the day of notice itself not counted.
      A host must meet the target schedule's settled trip count, monthly earnings floor and tenure before moving to it, and a host who has fallen below the floor of the schedule they hold is moved down rather than left on a schedule they no longer qualify for.
      After moving to a slower schedule a host waits the schedule's lockout period before moving again, so that the schedule is not switched back and forth around a single payout.
      Changing the deposit account or the payout method stops money leaving for the schedule's change lockout period counted in whole calendar days from the change, which is a fraud control and is never waived on request.
      A schedule change never alters what is already owed, only when and how it is paid.
    eligibility:
      - id: schedule_change_notice_elapsed
        applies_to: [payouts_schedule_changed]
        kind: time
        condition: The host must give the schedule's notice, and the change then takes effect the schedule's effective period after the notice is recorded, counted in whole calendar days from the day the notice is taken, with the day of notice itself not counted.
        evidence_fields: [payouts_accounts.next_payout_date, payouts_accounts.payout_account_id, payouts_accounts.payout_schedule_name]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[payouts_accounts.payout_account_id]]
          action_bindings: {payouts_accounts.payout_account_id: payout_account_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the notice is recorded
          anchor_source: payouts_accounts.next_payout_date
          relation: not_before
          duration_source: params.schedule_change_effective_days
          unit: calendar_days
          counting_rule: counted in whole calendar days from the day the notice is taken, with the day of notice itself not counted
          boundary: inclusive
    params:
      per_tier:
        Keyturn Standard Payout Schedule: {schedule_change_notice_days: "=schedule_change_notice_days", schedule_change_effective_days: "=schedule_change_effective_days", schedule_downgrade_lockout_days: "=schedule_downgrade_lockout_days", account_change_lockout_days: "=account_change_lockout_days", payout_method_change_lockout_days: "=payout_method_change_lockout_days"}
        Keyturn Weekly Batch Payout Schedule: {schedule_change_notice_days: "=schedule_change_notice_days", schedule_change_effective_days: "=schedule_change_effective_days", schedule_downgrade_lockout_days: "=schedule_downgrade_lockout_days", account_change_lockout_days: "=account_change_lockout_days", payout_method_change_lockout_days: "=payout_method_change_lockout_days"}
        Keyturn Express Payout Schedule: {schedule_change_notice_days: "=schedule_change_notice_days", schedule_change_effective_days: "=schedule_change_effective_days", schedule_downgrade_lockout_days: "=schedule_downgrade_lockout_days", account_change_lockout_days: "=account_change_lockout_days", payout_method_change_lockout_days: "=payout_method_change_lockout_days"}
        Keyturn Instant Payout Schedule: {schedule_change_notice_days: "=schedule_change_notice_days", schedule_change_effective_days: "=schedule_change_effective_days", schedule_downgrade_lockout_days: "=schedule_downgrade_lockout_days", account_change_lockout_days: "=account_change_lockout_days", payout_method_change_lockout_days: "=payout_method_change_lockout_days"}
        Keyturn Fleet Settlement Schedule: {schedule_change_notice_days: "=schedule_change_notice_days", schedule_change_effective_days: "=schedule_change_effective_days", schedule_downgrade_lockout_days: "=schedule_downgrade_lockout_days", account_change_lockout_days: "=account_change_lockout_days", payout_method_change_lockout_days: "=payout_method_change_lockout_days"}
        Keyturn Reserve-Backed Settlement Schedule: {schedule_change_notice_days: "=schedule_change_notice_days", schedule_change_effective_days: "=schedule_change_effective_days", schedule_downgrade_lockout_days: "=schedule_downgrade_lockout_days", account_change_lockout_days: "=account_change_lockout_days", payout_method_change_lockout_days: "=payout_method_change_lockout_days"}
  - id: payouts_evt_earnings
    subject: [payouts_earning_posted]
    rule: >-
      A trip's earning is the guest's trip price less the marketplace's share, worked out on the host protection plan in force on the day the trip started, and it becomes payable the schedule's delay period in whole calendar days counted from the day the trip started, the day of the start itself not counted.
      Overage money the guest pays follows the same share as the trip price, so mileage, fuel, late return and cleaning each post as their own entry on their own basis rather than being folded into the trip earning.
      An earning is posted once for one trip on one basis, so two entries on the same account, the same day and the same basis must belong to different trips; the trip reference is what keeps them apart.
      Money is never posted for a trip that was cancelled before it started, except where the guest bore a cancellation fee, in which case the host's share of that fee posts as its own entry on the cancellation basis.
      Where the host protection plan carries a trip fee offset, the offset posts as its own entry rather than lifting the trip earning, so the statement shows what the marketplace kept and what it gave back.
      An earning is posted only while the account is in the active, on_hold or suspended state, because an account that has closed has nothing further to settle.
    eligibility:
      - id: account_still_settles
        applies_to: [payouts_earning_posted]
        kind: state
        condition: An earning is posted only while the account is in the active, on_hold or suspended state, because an account that has closed has nothing further to settle.
        evidence_fields: [payouts_accounts.status, payouts_accounts.payout_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[payouts_accounts.payout_account_id]]
          action_bindings: {payouts_accounts.payout_account_id: payout_account_id}
        state_contract:
          field: payouts_accounts.status
          allowed: [active, on_hold, suspended]
    params:
      per_tier:
        Keyturn Standard Payout Schedule: {payout_delay_days_after_trip_start: "=payout_delay_days_after_trip_start", earnings_visibility_days: "=earnings_visibility_days", bonus_eligibility_trips_count: "=bonus_eligibility_trips_count"}
        Keyturn Weekly Batch Payout Schedule: {payout_delay_days_after_trip_start: "=payout_delay_days_after_trip_start", earnings_visibility_days: "=earnings_visibility_days", bonus_eligibility_trips_count: "=bonus_eligibility_trips_count"}
        Keyturn Express Payout Schedule: {payout_delay_days_after_trip_start: "=payout_delay_days_after_trip_start", earnings_visibility_days: "=earnings_visibility_days", bonus_eligibility_trips_count: "=bonus_eligibility_trips_count"}
        Keyturn Instant Payout Schedule: {payout_delay_days_after_trip_start: "=payout_delay_days_after_trip_start", earnings_visibility_days: "=earnings_visibility_days", bonus_eligibility_trips_count: "=bonus_eligibility_trips_count"}
        Keyturn Fleet Settlement Schedule: {payout_delay_days_after_trip_start: "=payout_delay_days_after_trip_start", earnings_visibility_days: "=earnings_visibility_days", bonus_eligibility_trips_count: "=bonus_eligibility_trips_count"}
        Keyturn Reserve-Backed Settlement Schedule: {payout_delay_days_after_trip_start: "=payout_delay_days_after_trip_start", earnings_visibility_days: "=earnings_visibility_days", bonus_eligibility_trips_count: "=bonus_eligibility_trips_count"}
    measures: [payouts_msr_earnings_90d]
  - id: payouts_evt_deductions
    subject: [payouts_deduction_posted]
    rule: >-
      What the host owes is taken from the account rather than invoiced, and every deduction names the basis it was taken on so that the host can see what it was for.
      The marketplace commission on each trip, the protection fee the plan charges and any claim deductible the host owes are separate deductions, and none of them is netted against another before it reaches the statement.
      A deduction never takes the account below zero on the entry that causes it, but where it does the balance stands negative and the marketplace recovers the schedule's share of each later earning until it is cleared, beginning only once the schedule's grace period in whole calendar days from the day the balance went negative has run.
      A chargeback a guest raises is held against the host at the schedule's chargeback share while it is disputed, and where the dispute is lost the marketplace recovers it inside the schedule's recovery window; where it is won the hold is released in full.
      Transfer fees are deductions in their own right and are taken on the day the transfer goes out, so a host who asks for money quickly sees the cost of speed on the same statement line day as the payout itself.
      A deduction posted in error is corrected by a correcting entry and never by editing the entry that was wrong.
    eligibility: []
    params:
      per_tier:
        Keyturn Standard Payout Schedule: {negative_balance_grace_days: "=negative_balance_grace_days", negative_balance_recovery_percent: "=negative_balance_recovery_percent", chargeback_reserve_percent: "=chargeback_reserve_percent", chargeback_recovery_window_days: "=chargeback_recovery_window_days", instant_payout_fee_percent: "=instant_payout_fee_percent", instant_payout_fee_minimum_amount: "=instant_payout_fee_minimum_amount", instant_payout_fee_maximum_amount: "=instant_payout_fee_maximum_amount", express_payout_flat_fee_amount: "=express_payout_flat_fee_amount", wire_transfer_fee_amount: "=wire_transfer_fee_amount", paper_cheque_fee_amount: "=paper_cheque_fee_amount", debit_push_fee_percent: "=debit_push_fee_percent", returned_transfer_fee_amount: "=returned_transfer_fee_amount", currency_conversion_fee_percent: "=currency_conversion_fee_percent"}
        Keyturn Weekly Batch Payout Schedule: {negative_balance_grace_days: "=negative_balance_grace_days", negative_balance_recovery_percent: "=negative_balance_recovery_percent", chargeback_reserve_percent: "=chargeback_reserve_percent", chargeback_recovery_window_days: "=chargeback_recovery_window_days", instant_payout_fee_percent: "=instant_payout_fee_percent", instant_payout_fee_minimum_amount: "=instant_payout_fee_minimum_amount", instant_payout_fee_maximum_amount: "=instant_payout_fee_maximum_amount", express_payout_flat_fee_amount: "=express_payout_flat_fee_amount", wire_transfer_fee_amount: "=wire_transfer_fee_amount", paper_cheque_fee_amount: "=paper_cheque_fee_amount", debit_push_fee_percent: "=debit_push_fee_percent", returned_transfer_fee_amount: "=returned_transfer_fee_amount", currency_conversion_fee_percent: "=currency_conversion_fee_percent"}
        Keyturn Express Payout Schedule: {negative_balance_grace_days: "=negative_balance_grace_days", negative_balance_recovery_percent: "=negative_balance_recovery_percent", chargeback_reserve_percent: "=chargeback_reserve_percent", chargeback_recovery_window_days: "=chargeback_recovery_window_days", instant_payout_fee_percent: "=instant_payout_fee_percent", instant_payout_fee_minimum_amount: "=instant_payout_fee_minimum_amount", instant_payout_fee_maximum_amount: "=instant_payout_fee_maximum_amount", express_payout_flat_fee_amount: "=express_payout_flat_fee_amount", wire_transfer_fee_amount: "=wire_transfer_fee_amount", paper_cheque_fee_amount: "=paper_cheque_fee_amount", debit_push_fee_percent: "=debit_push_fee_percent", returned_transfer_fee_amount: "=returned_transfer_fee_amount", currency_conversion_fee_percent: "=currency_conversion_fee_percent"}
        Keyturn Instant Payout Schedule: {negative_balance_grace_days: "=negative_balance_grace_days", negative_balance_recovery_percent: "=negative_balance_recovery_percent", chargeback_reserve_percent: "=chargeback_reserve_percent", chargeback_recovery_window_days: "=chargeback_recovery_window_days", instant_payout_fee_percent: "=instant_payout_fee_percent", instant_payout_fee_minimum_amount: "=instant_payout_fee_minimum_amount", instant_payout_fee_maximum_amount: "=instant_payout_fee_maximum_amount", express_payout_flat_fee_amount: "=express_payout_flat_fee_amount", wire_transfer_fee_amount: "=wire_transfer_fee_amount", paper_cheque_fee_amount: "=paper_cheque_fee_amount", debit_push_fee_percent: "=debit_push_fee_percent", returned_transfer_fee_amount: "=returned_transfer_fee_amount", currency_conversion_fee_percent: "=currency_conversion_fee_percent"}
        Keyturn Fleet Settlement Schedule: {negative_balance_grace_days: "=negative_balance_grace_days", negative_balance_recovery_percent: "=negative_balance_recovery_percent", chargeback_reserve_percent: "=chargeback_reserve_percent", chargeback_recovery_window_days: "=chargeback_recovery_window_days", instant_payout_fee_percent: "=instant_payout_fee_percent", instant_payout_fee_minimum_amount: "=instant_payout_fee_minimum_amount", instant_payout_fee_maximum_amount: "=instant_payout_fee_maximum_amount", express_payout_flat_fee_amount: "=express_payout_flat_fee_amount", wire_transfer_fee_amount: "=wire_transfer_fee_amount", paper_cheque_fee_amount: "=paper_cheque_fee_amount", debit_push_fee_percent: "=debit_push_fee_percent", returned_transfer_fee_amount: "=returned_transfer_fee_amount", currency_conversion_fee_percent: "=currency_conversion_fee_percent"}
        Keyturn Reserve-Backed Settlement Schedule: {negative_balance_grace_days: "=negative_balance_grace_days", negative_balance_recovery_percent: "=negative_balance_recovery_percent", chargeback_reserve_percent: "=chargeback_reserve_percent", chargeback_recovery_window_days: "=chargeback_recovery_window_days", instant_payout_fee_percent: "=instant_payout_fee_percent", instant_payout_fee_minimum_amount: "=instant_payout_fee_minimum_amount", instant_payout_fee_maximum_amount: "=instant_payout_fee_maximum_amount", express_payout_flat_fee_amount: "=express_payout_flat_fee_amount", wire_transfer_fee_amount: "=wire_transfer_fee_amount", paper_cheque_fee_amount: "=paper_cheque_fee_amount", debit_push_fee_percent: "=debit_push_fee_percent", returned_transfer_fee_amount: "=returned_transfer_fee_amount", currency_conversion_fee_percent: "=currency_conversion_fee_percent"}
    formula:
      when: entry_basis == "instant_payout_fee"
      entry_amount: min(max(entry_amount * instant_payout_fee_percent / 100, instant_payout_fee_minimum_amount), instant_payout_fee_maximum_amount)
  - id: payouts_evt_reserve
    subject: [payouts_reserve_held, payouts_reserve_released]
    rule: >-
      A reserve is money the host has earned but cannot yet draw, and it is held for a stated reason rather than as a general precaution.
      Every schedule that carries a routine reserve takes its stated share of each earning and holds it for the schedule's hold period in whole calendar days counted from the day the earning was posted, releasing it on the trigger the schedule names rather than on request.
      A host in their first trips has the new-host share held from each earning instead of the routine share, and the new-host reserve stops being taken once the host has settled the schedule's qualifying number of trips; the two reserves are never taken together on the same earning, the larger of the two governing.
      An open claim holds the claimed amount multiplied by the schedule's claim multiple, capped at the schedule's claim ceiling, and that hold stands until the claim is paid, refused or withdrawn whatever the routine hold period says.
      Releasing a reserve names the hold it releases, and a hold is released once and once only; where the hold has already been released the request changes nothing.
      Nothing is held against a trip that produced no earning, and a reserve is never taken from money that was itself a reserve release.
    eligibility:
      - id: reserve_release_names_its_hold
        applies_to: [payouts_reserve_released]
        kind: dedup
        condition: Releasing a reserve names the hold it releases, and a hold is released once and once only; where the hold has already been released the request changes nothing.
        evidence_fields: [payouts_ledger.source_ledger_id, payouts_ledger.event_type, payouts_ledger.entry_amount]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[payouts_ledger.source_ledger_id]]
          action_bindings: {payouts_ledger.source_ledger_id: source_ledger_id}
        dedup_contract:
          table: payouts_ledger
          mode: separate_record
          object_bindings: {source_ledger_id: source_ledger_id}
          duplicate_filters: {event_type: [payouts_reserve_released]}
          distinct_fields: [entry_date, entry_amount, entry_basis]
    params:
      per_tier:
        Keyturn Standard Payout Schedule: {reserve_percent_of_earning: "=reserve_percent_of_earning", reserve_hold_days: "=reserve_hold_days", reserve_release_trigger: "=reserve_release_trigger", new_host_reserve_percent: "=new_host_reserve_percent", new_host_reserve_trips_count: "=new_host_reserve_trips_count", claim_reserve_multiple: "=claim_reserve_multiple", claim_reserve_cap_amount: "=claim_reserve_cap_amount"}
        Keyturn Weekly Batch Payout Schedule: {reserve_percent_of_earning: "=reserve_percent_of_earning", reserve_hold_days: "=reserve_hold_days", reserve_release_trigger: "=reserve_release_trigger", new_host_reserve_percent: "=new_host_reserve_percent", new_host_reserve_trips_count: "=new_host_reserve_trips_count", claim_reserve_multiple: "=claim_reserve_multiple", claim_reserve_cap_amount: "=claim_reserve_cap_amount"}
        Keyturn Express Payout Schedule: {reserve_percent_of_earning: "=reserve_percent_of_earning", reserve_hold_days: "=reserve_hold_days", reserve_release_trigger: "=reserve_release_trigger", new_host_reserve_percent: "=new_host_reserve_percent", new_host_reserve_trips_count: "=new_host_reserve_trips_count", claim_reserve_multiple: "=claim_reserve_multiple", claim_reserve_cap_amount: "=claim_reserve_cap_amount"}
        Keyturn Instant Payout Schedule: {reserve_percent_of_earning: "=reserve_percent_of_earning", reserve_hold_days: "=reserve_hold_days", reserve_release_trigger: "=reserve_release_trigger", new_host_reserve_percent: "=new_host_reserve_percent", new_host_reserve_trips_count: "=new_host_reserve_trips_count", claim_reserve_multiple: "=claim_reserve_multiple", claim_reserve_cap_amount: "=claim_reserve_cap_amount"}
        Keyturn Fleet Settlement Schedule: {reserve_percent_of_earning: "=reserve_percent_of_earning", reserve_hold_days: "=reserve_hold_days", reserve_release_trigger: "=reserve_release_trigger", new_host_reserve_percent: "=new_host_reserve_percent", new_host_reserve_trips_count: "=new_host_reserve_trips_count", claim_reserve_multiple: "=claim_reserve_multiple", claim_reserve_cap_amount: "=claim_reserve_cap_amount"}
        Keyturn Reserve-Backed Settlement Schedule: {reserve_percent_of_earning: "=reserve_percent_of_earning", reserve_hold_days: "=reserve_hold_days", reserve_release_trigger: "=reserve_release_trigger", new_host_reserve_percent: "=new_host_reserve_percent", new_host_reserve_trips_count: "=new_host_reserve_trips_count", claim_reserve_multiple: "=claim_reserve_multiple", claim_reserve_cap_amount: "=claim_reserve_cap_amount"}
    formula:
      when: entry_basis == "reserve_hold"
      entry_amount: round(entry_amount * max(reserve_percent_of_earning, new_host_reserve_percent) / 100, 2)
  - id: payouts_evt_transfer
    subject: [payouts_transfer_released]
    rule: >-
      Money leaves the account on the schedule's own rhythm, whether when a trip completes, daily, weekly on the schedule's day, monthly, or only when the host asks for it, and a sweep after the schedule's cutoff hour falls to the next run rather than going out late.
      A sweep carries the payable balance only, which is the available balance less anything held in reserve, and where that balance is under the schedule's minimum nothing goes out and the money waits for the next run.
      One transfer never carries more than the schedule's per-transfer ceiling, so a balance above it is sent in several transfers across successive runs, and no more transfers are made in a calendar month than the schedule allows.
      A host on a schedule that pays on request asks for the money themselves, and only the host can make that request, since it is their money being moved.
      Money leaves the account only while it is active, or on the final sweep that accompanies its closure, and an account on hold or suspended pays nothing out however large the balance.
      A same-day or card-push transfer carries the schedule's instant fee, taken as its own deduction on the same day; a standard transfer carries no fee at all, and a wire or cheque carries its own flat fee instead.
    eligibility:
      - id: transfer_only_from_settling_account
        applies_to: [payouts_transfer_released]
        kind: state
        condition: Money leaves the account only while it is active, or on the final sweep that accompanies its closure, and an account on hold or suspended pays nothing out however large the balance.
        evidence_fields: [payouts_accounts.status, payouts_accounts.payout_account_id, payouts_accounts.available_balance]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[payouts_accounts.payout_account_id]]
          action_bindings: {payouts_accounts.payout_account_id: payout_account_id}
        state_contract:
          field: payouts_accounts.status
          allowed: [active, closed]
      - id: payout_request_is_the_hosts_own
        applies_to: [payouts_transfer_released]
        kind: caller_fact
        condition: A host on a schedule that pays on request asks for the money themselves, and only the host can make that request, since it is their money being moved.
        evidence_fields: [payouts_requests.payout_request_id, payouts_requests.customer_id, payouts_requests.requested_amount]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys: [[payouts_requests.payout_request_id]]
          action_bindings: {payouts_requests.payout_request_id: payout_request_id}
    params:
      per_tier:
        Keyturn Standard Payout Schedule: {payout_frequency: "=payout_frequency", payout_day_of_week: "=payout_day_of_week", payout_cutoff_local_hour: "=payout_cutoff_local_hour", minimum_payout_amount: "=minimum_payout_amount", maximum_payout_amount_per_transfer: "=maximum_payout_amount_per_transfer", maximum_payouts_per_month: "=maximum_payouts_per_month", standard_transfer_days: "=standard_transfer_days", same_day_transfer_cutoff_hour: "=same_day_transfer_cutoff_hour"}
        Keyturn Weekly Batch Payout Schedule: {payout_frequency: "=payout_frequency", payout_day_of_week: "=payout_day_of_week", payout_cutoff_local_hour: "=payout_cutoff_local_hour", minimum_payout_amount: "=minimum_payout_amount", maximum_payout_amount_per_transfer: "=maximum_payout_amount_per_transfer", maximum_payouts_per_month: "=maximum_payouts_per_month", standard_transfer_days: "=standard_transfer_days", same_day_transfer_cutoff_hour: "=same_day_transfer_cutoff_hour"}
        Keyturn Express Payout Schedule: {payout_frequency: "=payout_frequency", payout_day_of_week: "=payout_day_of_week", payout_cutoff_local_hour: "=payout_cutoff_local_hour", minimum_payout_amount: "=minimum_payout_amount", maximum_payout_amount_per_transfer: "=maximum_payout_amount_per_transfer", maximum_payouts_per_month: "=maximum_payouts_per_month", standard_transfer_days: "=standard_transfer_days", same_day_transfer_cutoff_hour: "=same_day_transfer_cutoff_hour"}
        Keyturn Instant Payout Schedule: {payout_frequency: "=payout_frequency", payout_day_of_week: "=payout_day_of_week", payout_cutoff_local_hour: "=payout_cutoff_local_hour", minimum_payout_amount: "=minimum_payout_amount", maximum_payout_amount_per_transfer: "=maximum_payout_amount_per_transfer", maximum_payouts_per_month: "=maximum_payouts_per_month", standard_transfer_days: "=standard_transfer_days", same_day_transfer_cutoff_hour: "=same_day_transfer_cutoff_hour"}
        Keyturn Fleet Settlement Schedule: {payout_frequency: "=payout_frequency", payout_day_of_week: "=payout_day_of_week", payout_cutoff_local_hour: "=payout_cutoff_local_hour", minimum_payout_amount: "=minimum_payout_amount", maximum_payout_amount_per_transfer: "=maximum_payout_amount_per_transfer", maximum_payouts_per_month: "=maximum_payouts_per_month", standard_transfer_days: "=standard_transfer_days", same_day_transfer_cutoff_hour: "=same_day_transfer_cutoff_hour"}
        Keyturn Reserve-Backed Settlement Schedule: {payout_frequency: "=payout_frequency", payout_day_of_week: "=payout_day_of_week", payout_cutoff_local_hour: "=payout_cutoff_local_hour", minimum_payout_amount: "=minimum_payout_amount", maximum_payout_amount_per_transfer: "=maximum_payout_amount_per_transfer", maximum_payouts_per_month: "=maximum_payouts_per_month", standard_transfer_days: "=standard_transfer_days", same_day_transfer_cutoff_hour: "=same_day_transfer_cutoff_hour"}
    formula:
      when: entry_basis == "payout_transfer"
      payable_balance: available_balance - reserve_balance
      entry_amount: min(max(payable_balance, 0), maximum_payout_amount_per_transfer)
  - id: payouts_evt_transfer_failure
    subject: [payouts_transfer_returned]
    rule: >-
      A transfer that comes back unpaid puts the money back on the account on the day it returns, so the host's balance is never quietly short while a bank rejects it.
      The schedule's returned transfer fee is charged as its own deduction, once for each return, and it is not charged twice where one return is re-sent and returns again on details the host had already corrected.
      Money that has come back does not go out again until the host has confirmed the deposit details, and confirming them starts the schedule's change lockout period afresh.
      A host whose transfers come back the schedule's number of times in a rolling twelve months has the account suspended, and the count runs on returns rather than on the sums involved.
      Where the return was the marketplace's own error the fee is reversed and the return is not counted toward the suspension threshold.
    eligibility: []
    params:
      per_tier:
        Keyturn Standard Payout Schedule: {returned_transfer_fee_amount: "=returned_transfer_fee_amount", suspension_after_returned_transfers_count: "=suspension_after_returned_transfers_count", account_change_lockout_days: "=account_change_lockout_days"}
        Keyturn Weekly Batch Payout Schedule: {returned_transfer_fee_amount: "=returned_transfer_fee_amount", suspension_after_returned_transfers_count: "=suspension_after_returned_transfers_count", account_change_lockout_days: "=account_change_lockout_days"}
        Keyturn Express Payout Schedule: {returned_transfer_fee_amount: "=returned_transfer_fee_amount", suspension_after_returned_transfers_count: "=suspension_after_returned_transfers_count", account_change_lockout_days: "=account_change_lockout_days"}
        Keyturn Instant Payout Schedule: {returned_transfer_fee_amount: "=returned_transfer_fee_amount", suspension_after_returned_transfers_count: "=suspension_after_returned_transfers_count", account_change_lockout_days: "=account_change_lockout_days"}
        Keyturn Fleet Settlement Schedule: {returned_transfer_fee_amount: "=returned_transfer_fee_amount", suspension_after_returned_transfers_count: "=suspension_after_returned_transfers_count", account_change_lockout_days: "=account_change_lockout_days"}
        Keyturn Reserve-Backed Settlement Schedule: {returned_transfer_fee_amount: "=returned_transfer_fee_amount", suspension_after_returned_transfers_count: "=suspension_after_returned_transfers_count", account_change_lockout_days: "=account_change_lockout_days"}
    measures: [payouts_msr_returned_transfers_12m]
  - id: payouts_holds
    subject: [payouts_account_held, payouts_account_released, payouts_account_suspended]
    rule: >-
      Money is stopped from leaving the account for a stated ground and never without one, the grounds being an open claim, an unfinished deposit check, a disputed chargeback, missing tax documentation and a risk review.
      The host is told the schedule's notice period before a hold takes effect, except where the ground is a risk review, in which case the hold takes effect at once and the host is told afterwards, because notice would defeat the purpose of the review.
      A hold is looked at within the schedule's review period in business days counted from the day it was placed, and a hold whose ground has fallen away is released rather than left standing.
      A hold stops money leaving but never stops money arriving, so earnings continue to post to a held account and the host can see what is accruing.
      Where a hold turns out to rest on something more serious the account is suspended instead, and a suspended account settles nothing in either direction until the decision is taken.
      Only one ground stands on the account at a time; where a second ground arises the more serious of the two is recorded, and the host is told which one is now blocking the money.
    eligibility:
      - id: hold_ground_recorded
        applies_to: [payouts_account_held]
        kind: state
        condition: Money is stopped from leaving the account for a stated ground and never without one, the grounds being an open claim, an unfinished deposit check, a disputed chargeback, missing tax documentation and a risk review.
        evidence_fields: [payouts_accounts.status, payouts_accounts.hold_reason, payouts_accounts.payout_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[payouts_accounts.payout_account_id]]
          action_bindings: {payouts_accounts.payout_account_id: payout_account_id}
        state_contract:
          field: payouts_accounts.status
          allowed: [active, on_hold]
    params:
      per_tier:
        Keyturn Standard Payout Schedule: {payout_hold_notice_days: "=payout_hold_notice_days", hold_review_days: "=hold_review_days", dispute_response_days: "=dispute_response_days"}
        Keyturn Weekly Batch Payout Schedule: {payout_hold_notice_days: "=payout_hold_notice_days", hold_review_days: "=hold_review_days", dispute_response_days: "=dispute_response_days"}
        Keyturn Express Payout Schedule: {payout_hold_notice_days: "=payout_hold_notice_days", hold_review_days: "=hold_review_days", dispute_response_days: "=dispute_response_days"}
        Keyturn Instant Payout Schedule: {payout_hold_notice_days: "=payout_hold_notice_days", hold_review_days: "=hold_review_days", dispute_response_days: "=dispute_response_days"}
        Keyturn Fleet Settlement Schedule: {payout_hold_notice_days: "=payout_hold_notice_days", hold_review_days: "=hold_review_days", dispute_response_days: "=dispute_response_days"}
        Keyturn Reserve-Backed Settlement Schedule: {payout_hold_notice_days: "=payout_hold_notice_days", hold_review_days: "=hold_review_days", dispute_response_days: "=dispute_response_days"}
  - id: payouts_closure
    subject: [payouts_account_closed]
    rule: >-
      A host closes their own payout account, and closing it is the host's own act because the money in it is theirs; the marketplace closes an account only where it has been suspended and will not be reinstated.
      Closure takes the schedule's notice, and the final sweep runs the schedule's sweep period in whole calendar days after the notice, the day of notice itself not counted, so that late-arriving deductions can still be taken before the money goes.
      An account carrying a negative balance is not closed until the balance is cleared, since closure would leave the marketplace with no way to recover it.
      An account with a reserve still held or a claim still open is not closed either; the reserve is released or the claim settled first, and the host is told which one is holding the closure up.
      Once closed the account posts nothing further, and money arriving for the host afterwards waits until a fresh account is opened rather than being sent to the closed deposit details.
      An account with no activity for the schedule's dormancy period is treated as dormant and its balance is dealt with under unclaimed property rules rather than being swept.
    eligibility:
      - id: balance_clear_before_closure
        applies_to: [payouts_account_closed]
        kind: authorization
        condition: An account carrying a negative balance is not closed until the balance is cleared, since closure would leave the marketplace with no way to recover it.
        evidence_fields: [payouts_accounts.available_balance, payouts_accounts.reserve_balance, payouts_accounts.payout_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[payouts_accounts.payout_account_id]]
          action_bindings: {payouts_accounts.payout_account_id: payout_account_id}
    params:
      per_tier:
        Keyturn Standard Payout Schedule: {closure_notice_days: "=closure_notice_days", closure_final_sweep_days: "=closure_final_sweep_days", dormancy_days: "=dormancy_days"}
        Keyturn Weekly Batch Payout Schedule: {closure_notice_days: "=closure_notice_days", closure_final_sweep_days: "=closure_final_sweep_days", dormancy_days: "=dormancy_days"}
        Keyturn Express Payout Schedule: {closure_notice_days: "=closure_notice_days", closure_final_sweep_days: "=closure_final_sweep_days", dormancy_days: "=dormancy_days"}
        Keyturn Instant Payout Schedule: {closure_notice_days: "=closure_notice_days", closure_final_sweep_days: "=closure_final_sweep_days", dormancy_days: "=dormancy_days"}
        Keyturn Fleet Settlement Schedule: {closure_notice_days: "=closure_notice_days", closure_final_sweep_days: "=closure_final_sweep_days", dormancy_days: "=dormancy_days"}
        Keyturn Reserve-Backed Settlement Schedule: {closure_notice_days: "=closure_notice_days", closure_final_sweep_days: "=closure_final_sweep_days", dormancy_days: "=dormancy_days"}
  - id: payouts_evt_adjustment
    subject: [payouts_adjustment_posted]
    rule: >-
      An entry that was wrong is put right by a correcting entry naming the entry it corrects, and the original entry is never edited, so the statement always shows what happened and what was done about it.
      A correction may be made inside the schedule's adjustment window counted in whole calendar days from the day the original entry was booked, and an entry older than that window is not corrected on the account but dealt with as a goodwill payment instead.
      A correction above the schedule's adjustment ceiling is not made by the service desk at all and goes to the settlements team, whatever the host says about the amount.
      Money reaching the account from a claim settlement is booked as a correction on its own basis, so that claim money and trip money never appear as the same kind of entry.
      A correction never moves money out of the account; where money is to be sent it is a transfer, and where money is to be taken it is a deduction.
    eligibility:
      - id: adjustment_window
        applies_to: [payouts_adjustment_posted]
        kind: time
        condition: A correction may be made inside the schedule's adjustment window counted in whole calendar days from the day the original entry was booked, and an entry older than that window is not corrected on the account but dealt with as a goodwill payment instead.
        evidence_fields: [payouts_ledger.entry_date, payouts_ledger.ledger_id, payouts_ledger.entry_basis]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[payouts_ledger.ledger_id]]
          action_bindings: {payouts_ledger.ledger_id: source_ledger_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the original entry was booked
          anchor_source: payouts_ledger.entry_date
          relation: not_after
          duration_source: params.adjustment_window_days
          unit: calendar_days
          counting_rule: counted in whole calendar days from the day the original entry was booked
          boundary: inclusive
    params:
      per_tier:
        Keyturn Standard Payout Schedule: {adjustment_window_days: "=adjustment_window_days", adjustment_max_amount: "=adjustment_max_amount", statement_close_day: "=statement_close_day", statement_delivery_days: "=statement_delivery_days", per_vehicle_statement: "=per_vehicle_statement", multi_vehicle_consolidation: "=multi_vehicle_consolidation"}
        Keyturn Weekly Batch Payout Schedule: {adjustment_window_days: "=adjustment_window_days", adjustment_max_amount: "=adjustment_max_amount", statement_close_day: "=statement_close_day", statement_delivery_days: "=statement_delivery_days", per_vehicle_statement: "=per_vehicle_statement", multi_vehicle_consolidation: "=multi_vehicle_consolidation"}
        Keyturn Express Payout Schedule: {adjustment_window_days: "=adjustment_window_days", adjustment_max_amount: "=adjustment_max_amount", statement_close_day: "=statement_close_day", statement_delivery_days: "=statement_delivery_days", per_vehicle_statement: "=per_vehicle_statement", multi_vehicle_consolidation: "=multi_vehicle_consolidation"}
        Keyturn Instant Payout Schedule: {adjustment_window_days: "=adjustment_window_days", adjustment_max_amount: "=adjustment_max_amount", statement_close_day: "=statement_close_day", statement_delivery_days: "=statement_delivery_days", per_vehicle_statement: "=per_vehicle_statement", multi_vehicle_consolidation: "=multi_vehicle_consolidation"}
        Keyturn Fleet Settlement Schedule: {adjustment_window_days: "=adjustment_window_days", adjustment_max_amount: "=adjustment_max_amount", statement_close_day: "=statement_close_day", statement_delivery_days: "=statement_delivery_days", per_vehicle_statement: "=per_vehicle_statement", multi_vehicle_consolidation: "=multi_vehicle_consolidation"}
        Keyturn Reserve-Backed Settlement Schedule: {adjustment_window_days: "=adjustment_window_days", adjustment_max_amount: "=adjustment_max_amount", statement_close_day: "=statement_close_day", statement_delivery_days: "=statement_delivery_days", per_vehicle_statement: "=per_vehicle_statement", multi_vehicle_consolidation: "=multi_vehicle_consolidation"}

extended_policies:
  - id: payouts_ext_recovery_correction
    base_policy_refs: [payouts_evt_adjustment, payouts_evt_deductions]
    overwrite:
      - base_policy: payouts_evt_adjustment
        superseded_clause: >-
          Money reaching the account from a claim settlement is booked as a correction on its own basis, so that claim money and trip money never appear as the same kind of entry.
        replaced_by: >-
          The correcting entry books the share of the sum over-recovered that is put back, rounded half to even to two decimal places, and never less than nothing.
    trigger: state_due
    subject: [payouts_adjustment_posted]
    computes: correction_amount
    target_tool: post_recovery_correction_f20745c1
    params:
      deductible_share_top: 0.05
      deductible_share_mid: 0.10
      deductible_share_standard: 0.20
      claim_free_top_days: 730
      claim_free_mid_days: 365
      refund_share_at_fault: 0.50
      refund_share_shared: 0.25
      refund_share_none: 0.00
      instalment_share_full: 1.00
      instalment_share_half: 0.50
      instalment_share_part: 0.20
    rule: >
      A deductible recovery taken from a host's payout account is put right against what the protection
      enrolment behind it bears, because the recovery is only ever the host's own share of a settled loss
      and never more.
      The sum over-recovered is the deductible recoveries booked to the account in the month up to the day
      the correction is worked out, less the deductible the host actually carries on the settled loss.
      The deductible the host carries is the appraised sum of the loss, taken at the standard deductible
      share, and nothing of it is given back.
      The appraised sum of the loss is the appraisal recorded on the most recent appraisal made under the
      enrolment.
      The appraised sum of the loss is measured on the route the loss was valued by: where the most recent
      appraisal made under the enrolment was taken from a repair shop invoice, the appraised sum is that
      appraisal together with every supplement added under the enrolment; where the most recent appraisal
      made under the enrolment was taken from a total loss valuation, the appraised sum is the vehicle value
      declared at enrolment, supplements never being added to a total loss; in every other case the
      appraised sum is the appraisal alone.
      The deductible share the host carries turns on the protection plan in force and on how long the
      enrolment has stood free of settled claims: where the plan in force is the Keyturn Shield 90 Host Plan
      or the Keyturn Shield 85 Host Plan and the enrolment has stood free of settled claims for two years or
      longer, the top deductible share applies; where the plan in force is the Keyturn Shield 80 Host Plan
      or the Keyturn Shield 75 Host Plan and the enrolment has stood free of settled claims for a year or
      longer, the middle deductible share applies; in every other case the standard deductible share
      applies.
      Part of the deductible the host carries is given back where the marketplace has recovered money under
      the enrolment: where the loss was found to be the guest's fault and money has been recovered under the
      enrolment, the at-fault refund share of the deductible is given back; where the loss was found to be a
      third party's or no one's fault and money has been recovered under the enrolment, the shared refund
      share of the deductible is given back; in every other case none of the deductible is given back.
      The deductible the host carries, less whatever of it is given back, is the deductible payable, and the
      sum over-recovered is the recoveries counted less that deductible payable.
      A fifth of the sum over-recovered is put back at once, and the rest follows when the claim that
      produced the recovery is settled.
      How much of the sum over-recovered is put back at once turns on how far the claims made under the
      enrolment have got, because the rest follows only when the claim that produced the recovery is
      settled: where money has been paid out on a claim under the enrolment, the whole of the sum
      over-recovered is put back; where no money has been paid out on a claim under the enrolment and a
      claim has been appraised under it in the twelve months up to that day, half of the sum over-recovered
      is put back now; in every other case a fifth of it is put back now.
      The correcting entry books the share of the sum over-recovered that is put back, rounded half to even
      to two decimal places, and never less than nothing.
    prerequisite: []
    cross_category:
      - category: hostplan
        as: history
        reads: [protection_plan_name, claim_free_since_date, vehicle_value_declared_amount, hostplan_claims.appraisal_amount, hostplan_claims.amount_delta, hostplan_claims.appraisal_channel, hostplan_claims.liability_finding]
        note: The protection enrolment and its claim records decide the deductible share the host carries, the route the loss was valued by, whether part of the deductible is given back and how much of the sum over-recovered is put back at once.
    compute:
      - recovered_taken: "ABS(SUM('payouts_ledger','entry_amount', within_months=1, date_field='entry_date', entry_basis='claim_deductible_recovery'))"
      - appraised_sum: "XLATEST('hostplan','hostplan_claims','appraisal_amount', date_field='claim_date', event_type='hostplan_claim_appraised')"
      - supplement_sum: "XSUM('hostplan','hostplan_claims','amount_delta', event_type='hostplan_supplement_added')"
      - declared_value: "CFIELD('hostplan','vehicle_value_declared_amount', status='active')"
      - valuation_route: "XLATEST('hostplan','hostplan_claims','appraisal_channel', date_field='claim_date', event_type='hostplan_claim_appraised')"
      - settlement_gross: "RND(appraised_sum + supplement_sum, 2) if valuation_route == 'repair_shop_invoice' else (RND(declared_value, 2) if valuation_route == 'total_loss_valuation' else RND(appraised_sum, 2))"
      - plan_in_force: "CFIELD('hostplan','protection_plan_name', status='active')"
      - claim_free_days: "DAYS(CFIELD('hostplan','claim_free_since_date', status='active'), NOW)"
      - deductible_share: "K('deductible_share_top') if ((plan_in_force == 'Keyturn Shield 90 Host Plan' or plan_in_force == 'Keyturn Shield 85 Host Plan') and claim_free_days >= K('claim_free_top_days')) else (K('deductible_share_mid') if ((plan_in_force == 'Keyturn Shield 80 Host Plan' or plan_in_force == 'Keyturn Shield 75 Host Plan') and claim_free_days >= K('claim_free_mid_days')) else K('deductible_share_standard'))"
      - deductible_due: "RND(settlement_gross * deductible_share, 2)"
      - liability_finding: "XLATEST('hostplan','hostplan_claims','liability_finding', date_field='claim_date', event_type='hostplan_claim_appraised')"
      - recovery_received: "XSUM('hostplan','hostplan_claims','amount_delta', event_type='hostplan_recovery_received')"
      - refund_rate: "K('refund_share_at_fault') if (liability_finding == 'guest_at_fault' and recovery_received > 0) else (K('refund_share_shared') if ((liability_finding == 'third_party' or liability_finding == 'no_fault') and recovery_received > 0) else K('refund_share_none'))"
      - deductible_payable: "RND(deductible_due - RND(deductible_due * refund_rate, 2), 2)"
      - over_recovery: "RND(recovered_taken - deductible_payable, 2)"
      - reimbursements_paid: "XCOUNT('hostplan','hostplan_claims', event_type='hostplan_reimbursement_paid')"
      - appraisals_year: "XCOUNT('hostplan','hostplan_claims', within_months=12, date_field='claim_date', event_type='hostplan_claim_appraised')"
      - instalment_share: "K('instalment_share_full') if reimbursements_paid > 0 else (K('instalment_share_half') if (reimbursements_paid == 0 and appraisals_year > 0) else K('instalment_share_part'))"
      - result: "RND(MX(RND(over_recovery * instalment_share, 2), 0), 2)"
    compute_basis:
      recovered_taken: "The sum over-recovered is the deductible recoveries booked to the account in the month up to the day the correction is worked out, less the deductible the host actually carries on the settled loss."
      appraised_sum: "The appraised sum of the loss is the appraisal recorded on the most recent appraisal made under the enrolment."
      supplement_sum: "the appraised sum is that appraisal together with every supplement added under the enrolment"
      declared_value: "where the most recent appraisal made under the enrolment was taken from a total loss valuation, the appraised sum is the vehicle value declared at enrolment, supplements never being added to a total loss"
      valuation_route: "The appraised sum of the loss is measured on the route the loss was valued by"
      settlement_gross: "The appraised sum of the loss is measured on the route the loss was valued by: where the most recent appraisal made under the enrolment was taken from a repair shop invoice, the appraised sum is that appraisal together with every supplement added under the enrolment; where the most recent appraisal made under the enrolment was taken from a total loss valuation, the appraised sum is the vehicle value declared at enrolment, supplements never being added to a total loss; in every other case the appraised sum is the appraisal alone."
      plan_in_force: "The deductible share the host carries turns on the protection plan in force and on how long the enrolment has stood free of settled claims"
      claim_free_days: "The deductible share the host carries turns on the protection plan in force and on how long the enrolment has stood free of settled claims"
      deductible_share: "The deductible share the host carries turns on the protection plan in force and on how long the enrolment has stood free of settled claims: where the plan in force is the Keyturn Shield 90 Host Plan or the Keyturn Shield 85 Host Plan and the enrolment has stood free of settled claims for two years or longer, the top deductible share applies; where the plan in force is the Keyturn Shield 80 Host Plan or the Keyturn Shield 75 Host Plan and the enrolment has stood free of settled claims for a year or longer, the middle deductible share applies; in every other case the standard deductible share applies."
      deductible_due: "The deductible the host carries is the appraised sum of the loss, taken at the standard deductible share, and nothing of it is given back."
      liability_finding: "Part of the deductible the host carries is given back where the marketplace has recovered money under the enrolment"
      recovery_received: "where the loss was found to be the guest's fault and money has been recovered under the enrolment, the at-fault refund share of the deductible is given back"
      refund_rate: "Part of the deductible the host carries is given back where the marketplace has recovered money under the enrolment: where the loss was found to be the guest's fault and money has been recovered under the enrolment, the at-fault refund share of the deductible is given back; where the loss was found to be a third party's or no one's fault and money has been recovered under the enrolment, the shared refund share of the deductible is given back; in every other case none of the deductible is given back."
      deductible_payable: "The deductible the host carries, less whatever of it is given back, is the deductible payable, and the sum over-recovered is the recoveries counted less that deductible payable."
      over_recovery: "The deductible the host carries, less whatever of it is given back, is the deductible payable, and the sum over-recovered is the recoveries counted less that deductible payable."
      reimbursements_paid: "where money has been paid out on a claim under the enrolment, the whole of the sum over-recovered is put back"
      appraisals_year: "where no money has been paid out on a claim under the enrolment and a claim has been appraised under it in the twelve months up to that day, half of the sum over-recovered is put back now"
      instalment_share: "How much of the sum over-recovered is put back at once turns on how far the claims made under the enrolment have got, because the rest follows only when the claim that produced the recovery is settled: where money has been paid out on a claim under the enrolment, the whole of the sum over-recovered is put back; where no money has been paid out on a claim under the enrolment and a claim has been appraised under it in the twelve months up to that day, half of the sum over-recovered is put back now; in every other case a fifth of it is put back now."
      result: "The correcting entry books the share of the sum over-recovered that is put back, rounded half to even to two decimal places, and never less than nothing."
    factors:
      - id: valuation_route_measure
        effect: method
        decides: settlement_gross
        bindings: [valuation_route, settlement_gross]
        ladder:
          - when: "the most recent appraisal made under the enrolment was taken from a repair shop invoice"
