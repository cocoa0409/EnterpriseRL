        ladder:
          - when: "money has been paid out on a claim under the enrolment"
            value: "K('instalment_share_full')"
          - when: "no money has been paid out on a claim under the enrolment and a claim has been appraised under it in the twelve months up to that day"
            value: "K('instalment_share_half')"
          - when: "otherwise"
            value: "K('instalment_share_part')"
        baseline:
