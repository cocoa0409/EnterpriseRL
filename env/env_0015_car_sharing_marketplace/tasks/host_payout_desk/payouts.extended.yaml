  - id: payouts_ext_schedule_qualification
    base_policy_refs: [payouts_schedule_change, payouts_account_opening, payouts_evt_earnings, payouts_evt_deductions]
    overwrite:
      - base_policy: payouts_schedule_change
        superseded_clause: >-
          A host must meet the target schedule's settled trip count, monthly earnings floor and tenure before moving to it, and a host who has fallen below the floor of the schedule they hold is moved down rather than left on a schedule they no longer qualify for.
        replaced_by: >-
          A host moves onto the highest-ranked schedule whose qualifying monthly earnings, qualifying settled trips and qualifying tenure they all meet, and onto the entry schedule where they meet none of them.
      - base_policy: payouts_schedule_change
        superseded_clause: >-
          A host may move between payout schedules, and the move takes effect on a future date rather than the day it is asked for, so a sweep already in flight settles on the schedule it started under.
        replaced_by: >-
          The move is recorded once the schedule's effective period has run from the day the notice was taken, and the account settles on the schedule it has moved onto from the day the move is recorded.
      - base_policy: payouts_account_opening
        superseded_clause: >-
          The schedule a host may hold depends on what they have done on the marketplace, so a schedule is open only where the host meets its settled trip count, its monthly earnings floor and its tenure in whole calendar days counted from the day their member profile was opened; a host who meets none of them opens on the entry schedule and moves up later.
        replaced_by: >-
          The qualifying tenure is the whole calendar days from the day the payout account was opened up to that day, and the qualifying settled trips are counted from the trip earnings the account itself carries rather than from the trips the host has run over the whole life of their membership.
    trigger: on_request
    subject: [payouts_schedule_changed]
    computes: payout_schedule_name
    target_tool: change_host_payout_schedule_75a33b7a
    params:
      floor_earn_reserve: 20000.00
      floor_trips_reserve: 150
      floor_tenure_reserve: 365
      floor_earn_fleet: 8000.00
      floor_trips_fleet: 100
      floor_tenure_fleet: 180
      floor_earn_instant: 1200.00
      floor_trips_instant: 25
      floor_tenure_instant: 90
      floor_earn_express: 500.00
      floor_trips_express: 10
      floor_tenure_express: 60
      floor_trips_weekly: 3
      floor_tenure_weekly: 30
      offset_full: 0.10
      offset_half: 0.05
      offset_none: 0.00
      reduction_suspended: 0.25
      reduction_claim: 0.10
      reduction_none: 0.00
      setaside_short: 0.05
      setaside_clear: 0.02
      setaside_none: 0.00
      account_age_year_days: 365
      account_age_quarter_days: 92
    rule: >
      A host moves onto the highest-ranked schedule whose qualifying monthly earnings, qualifying settled
      trips and qualifying tenure they all meet, and onto the entry schedule where they meet none of
      them.
      The move is recorded once the schedule's effective period has run from the day the notice was
      taken, and the account settles on the schedule it has moved onto from the day the move is recorded.
      The schedule a host moves onto is settled only once every ground on which the account stands short
      of money the marketplace is owed carries the recovery entry taken against it.
      The qualifying monthly earnings are the trip earnings credited to the account in the month up to
      that day, with nothing netted into them and nothing set aside.
      Which stretch the qualifying monthly earnings are measured over turns on how the account settles
      and on whether money has lately left it: where the account is swept as each trip completes and a
      transfer has left it in the three months up to that day, the trip earnings credited in the twelve
      months up to that day are taken and divided by twelve; where the account is swept as each trip
      completes and no transfer has left it in that period, the trip earnings credited in the three
      months up to that day are taken and divided by three; in every other case the trip earnings
      credited in the month up to that day are taken as they stand.
      The deductions and corrections booked to the account in the twelve months up to that day are
      netted, and that net, taken at the offset share and spread evenly over twelve months, is added to
      the qualifying monthly earnings; because deductions are booked as negative entries and corrections
      as positive ones, that net lowers the qualifying monthly earnings whenever deductions outweigh
      corrections and lifts them whenever corrections outweigh deductions.
      The offset share turns on how the account settles and on whether its transfers have been coming
      back: where the account is swept as each trip completes and no transfer has come back unpaid on it
      in the twelve months up to that day, the full offset share applies; where the account is swept as
      each trip completes and a transfer has come back unpaid on it in that period, the half offset share
      applies; in every other case nothing is netted into the qualifying monthly earnings.
      A further part of the qualifying monthly earnings is set aside where a claim has lately been
      appraised under the protection cover behind the account, and more of it where that cover is not in
      good standing: where the protection enrolment behind the account stands in good order and a claim
      has been appraised under it in the twelve months up to that day, the claim reduction share is set
      aside; where the protection enrolment behind the account is suspended and a claim has been
      appraised under it in that period, the suspended reduction share is set aside; in every other case
      nothing is set aside on that ground.
      A further part again is set aside where the account itself has lately been left short by money a
      guest charged back: where money charged back by a guest has been booked to the account in the three
      months up to that day and the netting of every entry on the account stands below nothing, the
      short-account set-aside share applies; where money charged back by a guest has been booked to the
      account in that period and the netting of every entry on the account stands at or above nothing,
      the cleared-account set-aside share applies; in every other case nothing is set aside on that
      ground.
      The qualifying settled trips are the trip earnings credited to the account in the month up to that
      day, counted one to a trip.
      Which stretch the qualifying settled trips are counted over turns on how long the payout account
      has been open, because a shorter record is annualised rather than read as a whole year's trading:
      where the account has been open for a year or longer, the trip earnings credited in the twelve
      months up to that day are counted; where the account has been open for a calendar quarter or
      longer but less than a year, the trip earnings credited in the three months up to that day are
      counted and multiplied by four; in every other case only the trip earnings credited in the month up
      to that day are counted.
      The qualifying tenure is the whole calendar days from the day the payout account was opened up to
      that day, and the qualifying settled trips are counted from the trip earnings the account itself
      carries rather than from the trips the host has run over the whole life of their membership.
      The offset and the two set-asides are each worked out on the qualifying monthly earnings as first
      measured rather than one upon the other, and all three are then taken to it in turn; the figure
      that results is rounded half to even to two decimal places before any floor is tested against it.
      The schedule is then settled by testing the three qualifying figures against each schedule's floors
      from the highest-ranked schedule downwards, and the first schedule whose earnings floor, trip floor
      and tenure floor are all met is the schedule the host moves onto.
    prerequisite:
      - problem: payouts_ext_negative_balance_recovery
        kind: value_input
        gate: net_flows_year
        form: state
        policy_source: >-
          The schedule a host moves onto is settled only once every ground on which the account stands short of money the marketplace is owed carries the recovery entry taken against it.
        condition: >-
          Every entry on the account that has left it short of money the marketplace is owed is answered by a recovery entry taken against it.
        resolved_by: post_balance_recovery_b10514b8
        effect: >-
          The deductions booked to the account in the twelve months up to that day fall by the sum recovered, so the offset netted into the qualifying monthly earnings, and with it the schedule settled, are worked out on a different figure.
    cross_category:
      - category: hostplan
        as: branch
        reads: [suspension_reason, hostplan_claims.appraisal_amount]
        note: Whether the protection enrolment is suspended, and whether a claim has been appraised under it in the last twelve months, decide the share of the qualifying monthly earnings set aside on the cover's standing.
    compute:
      - settles_on_completion: "F('payout_schedule_name') == 'Keyturn Standard Payout Schedule'"
      - transfers_quarter: "COUNT('payouts_ledger', within_months=3, date_field='entry_date', event_type='payouts_transfer_released')"
      - earn_year: "SUM('payouts_ledger','entry_amount', within_months=12, date_field='entry_date', entry_basis='trip_earning')"
      - earn_quarter: "SUM('payouts_ledger','entry_amount', within_months=3, date_field='entry_date', entry_basis='trip_earning')"
      - earn_month: "SUM('payouts_ledger','entry_amount', within_months=1, date_field='entry_date', entry_basis='trip_earning')"
      - monthly_basis: "RND(earn_year / 12, 2) if (settles_on_completion and transfers_quarter > 0) else (RND(earn_quarter / 3, 2) if (settles_on_completion and transfers_quarter == 0) else RND(earn_month, 2))"
      - returns_year: "COUNT('payouts_ledger', within_months=12, date_field='entry_date', event_type='payouts_transfer_returned')"
      - offset_share: "K('offset_full') if (settles_on_completion and returns_year == 0) else (K('offset_half') if (settles_on_completion and returns_year > 0) else K('offset_none'))"
      - net_flows_year: "RND(SUM('payouts_ledger','entry_amount', within_months=12, date_field='entry_date', event_type='payouts_deduction_posted') + SUM('payouts_ledger','entry_amount', within_months=12, date_field='entry_date', event_type='payouts_adjustment_posted'), 2)"
      - enrolment_suspension: "CFIELD('hostplan','suspension_reason', status='active')"
      - appraisals_year: "XCOUNT('hostplan','hostplan_claims', within_months=12, date_field='claim_date', event_type='hostplan_claim_appraised')"
      - reduction_share: "K('reduction_claim') if (enrolment_suspension == 'none' and appraisals_year > 0) else (K('reduction_suspended') if (enrolment_suspension != 'none' and appraisals_year > 0) else K('reduction_none'))"
      - chargeback_quarter: "ABS(SUM('payouts_ledger','entry_amount', within_months=3, date_field='entry_date', entry_basis='chargeback_recovery'))"
      - net_all: "SUM('payouts_ledger','entry_amount')"
      - setaside_share: "K('setaside_short') if (chargeback_quarter > 0 and net_all < 0) else (K('setaside_clear') if (chargeback_quarter > 0 and net_all >= 0) else K('setaside_none'))"
      - qualifying_earnings: "RND(monthly_basis + RND(net_flows_year * offset_share / 12, 2) - RND(monthly_basis * reduction_share, 2) - RND(monthly_basis * setaside_share, 2), 2)"
      - account_age_days: "DAYS(F('opened_date'), NOW)"
      - trips_year: "COUNT('payouts_ledger', within_months=12, date_field='entry_date', entry_basis='trip_earning')"
      - trips_quarter: "COUNT('payouts_ledger', within_months=3, date_field='entry_date', entry_basis='trip_earning')"
      - trips_month: "COUNT('payouts_ledger', within_months=1, date_field='entry_date', entry_basis='trip_earning')"
      - qualifying_trips: "trips_year if account_age_days >= K('account_age_year_days') else (trips_quarter * 4 if account_age_days >= K('account_age_quarter_days') else trips_month)"
      - qualifying_tenure: "account_age_days"
      - result: "'Keyturn Reserve-Backed Settlement Schedule' if (qualifying_earnings >= K('floor_earn_reserve') and qualifying_trips >= K('floor_trips_reserve') and qualifying_tenure >= K('floor_tenure_reserve')) else ('Keyturn Fleet Settlement Schedule' if (qualifying_earnings >= K('floor_earn_fleet') and qualifying_trips >= K('floor_trips_fleet') and qualifying_tenure >= K('floor_tenure_fleet')) else ('Keyturn Instant Payout Schedule' if (qualifying_earnings >= K('floor_earn_instant') and qualifying_trips >= K('floor_trips_instant') and qualifying_tenure >= K('floor_tenure_instant')) else ('Keyturn Express Payout Schedule' if (qualifying_earnings >= K('floor_earn_express') and qualifying_trips >= K('floor_trips_express') and qualifying_tenure >= K('floor_tenure_express')) else ('Keyturn Weekly Batch Payout Schedule' if (qualifying_trips >= K('floor_trips_weekly') and qualifying_tenure >= K('floor_tenure_weekly')) else 'Keyturn Standard Payout Schedule'))))"
    compute_basis:
      transfers_quarter: "where the account is swept as each trip completes and a transfer has left it in the three months up to that day, the trip earnings credited in the twelve months up to that day are taken and divided by twelve"
      earn_year: "the trip earnings credited in the twelve months up to that day are taken and divided by twelve"
      earn_quarter: "the trip earnings credited in the three months up to that day are taken and divided by three"
      earn_month: "The qualifying monthly earnings are the trip earnings credited to the account in the month up to that day, with nothing netted into them and nothing set aside."
      monthly_basis: "Which stretch the qualifying monthly earnings are measured over turns on how the account settles and on whether money has lately left it: where the account is swept as each trip completes and a transfer has left it in the three months up to that day, the trip earnings credited in the twelve months up to that day are taken and divided by twelve; where the account is swept as each trip completes and no transfer has left it in that period, the trip earnings credited in the three months up to that day are taken and divided by three; in every other case the trip earnings credited in the month up to that day are taken as they stand."
      returns_year: "where the account is swept as each trip completes and a transfer has come back unpaid on it in that period, the half offset share applies"
      offset_share: "The offset share turns on how the account settles and on whether its transfers have been coming back: where the account is swept as each trip completes and no transfer has come back unpaid on it in the twelve months up to that day, the full offset share applies; where the account is swept as each trip completes and a transfer has come back unpaid on it in that period, the half offset share applies; in every other case nothing is netted into the qualifying monthly earnings."
      net_flows_year: "The deductions and corrections booked to the account in the twelve months up to that day are netted, and that net, taken at the offset share and spread evenly over twelve months, is added to the qualifying monthly earnings; because deductions are booked as negative entries and corrections as positive ones, that net lowers the qualifying monthly earnings whenever deductions outweigh corrections and lifts them whenever corrections outweigh deductions."
      enrolment_suspension: "where the protection enrolment behind the account is suspended and a claim has been appraised under it in that period, the suspended reduction share is set aside"
      appraisals_year: "where the protection enrolment behind the account stands in good order and a claim has been appraised under it in the twelve months up to that day, the claim reduction share is set aside"
      reduction_share: "A further part of the qualifying monthly earnings is set aside where a claim has lately been appraised under the protection cover behind the account, and more of it where that cover is not in good standing: where the protection enrolment behind the account stands in good order and a claim has been appraised under it in the twelve months up to that day, the claim reduction share is set aside; where the protection enrolment behind the account is suspended and a claim has been appraised under it in that period, the suspended reduction share is set aside; in every other case nothing is set aside on that ground."
      chargeback_quarter: "where money charged back by a guest has been booked to the account in the three months up to that day and the netting of every entry on the account stands below nothing, the short-account set-aside share applies"
      net_all: "the netting of every entry on the account stands below nothing"
      setaside_share: "A further part again is set aside where the account itself has lately been left short by money a guest charged back: where money charged back by a guest has been booked to the account in the three months up to that day and the netting of every entry on the account stands below nothing, the short-account set-aside share applies; where money charged back by a guest has been booked to the account in that period and the netting of every entry on the account stands at or above nothing, the cleared-account set-aside share applies; in every other case nothing is set aside on that ground."
      qualifying_earnings: "The offset and the two set-asides are each worked out on the qualifying monthly earnings as first measured rather than one upon the other, and all three are then taken to it in turn; the figure that results is rounded half to even to two decimal places before any floor is tested against it."
      account_age_days: "Which stretch the qualifying settled trips are counted over turns on how long the payout account has been open, because a shorter record is annualised rather than read as a whole year's trading"
      trips_year: "where the account has been open for a year or longer, the trip earnings credited in the twelve months up to that day are counted"
      trips_quarter: "the trip earnings credited in the three months up to that day are counted and multiplied by four"
      trips_month: "The qualifying settled trips are the trip earnings credited to the account in the month up to that day, counted one to a trip."
      qualifying_trips: "Which stretch the qualifying settled trips are counted over turns on how long the payout account has been open, because a shorter record is annualised rather than read as a whole year's trading: where the account has been open for a year or longer, the trip earnings credited in the twelve months up to that day are counted; where the account has been open for a calendar quarter or longer but less than a year, the trip earnings credited in the three months up to that day are counted and multiplied by four; in every other case only the trip earnings credited in the month up to that day are counted."
      qualifying_tenure: "The qualifying tenure is the whole calendar days from the day the payout account was opened up to that day, and the qualifying settled trips are counted from the trip earnings the account itself carries rather than from the trips the host has run over the whole life of their membership."
      result: "The schedule is then settled by testing the three qualifying figures against each schedule's floors from the highest-ranked schedule downwards, and the first schedule whose earnings floor, trip floor and tenure floor are all met is the schedule the host moves onto."
    factors:
      - id: monthly_earnings_measure
        effect: method
        decides: monthly_basis
        bindings: [transfers_quarter, earn_year, earn_quarter, earn_month, monthly_basis]
        ladder:
          - when: "the account is swept as each trip completes and a transfer has left it in the three months up to that day"
            method: "the trip earnings credited in the twelve months up to that day are taken and divided by twelve"
          - when: "the account is swept as each trip completes and no transfer has left it in that period"
            method: "the trip earnings credited in the three months up to that day are taken and divided by three"
          - when: "otherwise"
            method: "the trip earnings credited in the month up to that day are taken as they stand"
        baseline:
          monthly_basis: "RND(earn_month, 2)"
        evidence: [history]
        cross_difficulty: null
      - id: flows_offset_share
        effect: parameter
        decides: offset_share
        bindings: [returns_year, net_flows_year, offset_share]
        ladder:
          - when: "the account is swept as each trip completes and no transfer has come back unpaid on it in the twelve months up to that day"
            value: "K('offset_full')"
          - when: "the account is swept as each trip completes and a transfer has come back unpaid on it in that period"
            value: "K('offset_half')"
          - when: "otherwise"
            value: "K('offset_none')"
        baseline:
          offset_share: "K('offset_none')"
        evidence: [history]
        cross_difficulty: null
      - id: cover_standing_reduction
        effect: parameter
        decides: reduction_share
        bindings: [enrolment_suspension, appraisals_year, reduction_share]
        ladder:
          - when: "the protection enrolment behind the account stands in good order and a claim has been appraised under it in the twelve months up to that day"
            value: "K('reduction_claim')"
          - when: "the protection enrolment behind the account is suspended and a claim has been appraised under it in that period"
            value: "K('reduction_suspended')"
          - when: "otherwise"
            value: "K('reduction_none')"
        baseline:
          reduction_share: "K('reduction_none')"
        evidence: [cross_category, history]
        cross_difficulty: hostplan
      - id: short_account_setaside
        effect: parameter
        decides: setaside_share
        bindings: [chargeback_quarter, net_all, setaside_share]
        ladder:
          - when: "money charged back by a guest has been booked to the account in the three months up to that day and the netting of every entry on the account stands below nothing"
            value: "K('setaside_short')"
          - when: "money charged back by a guest has been booked to the account in that period and the netting of every entry on the account stands at or above nothing"
            value: "K('setaside_clear')"
          - when: "otherwise"
            value: "K('setaside_none')"
        baseline:
          setaside_share: "K('setaside_none')"
        evidence: [history]
        cross_difficulty: null
      - id: settled_trips_measure
        effect: method
        decides: qualifying_trips
        bindings: [account_age_days, trips_year, trips_quarter, trips_month, qualifying_trips]
        ladder:
          - when: "the account has been open for a year or longer"
            method: "the trip earnings credited in the twelve months up to that day are counted"
          - when: "the account has been open for a calendar quarter or longer but less than a year"
            method: "the trip earnings credited in the three months up to that day are counted and multiplied by four"
          - when: "otherwise"
            method: "only the trip earnings credited in the month up to that day are counted"
        baseline:
          qualifying_trips: "trips_month"
        evidence: [history, date]
        cross_difficulty: null
    baseline:
      rule: >-
        A host moves onto the highest-ranked schedule whose qualifying monthly earnings, qualifying settled
        trips and qualifying tenure they all meet, and onto the entry schedule where they meet none of
        them. The qualifying monthly earnings are the trip earnings credited to the account in the month up
        to that day, with nothing netted into them and nothing set aside. The qualifying settled trips are
        the trip earnings credited to the account in the month up to that day, counted one to a trip. The
        qualifying tenure is the whole calendar days from the day the payout account was opened up to that
        day, and the qualifying settled trips are counted from the trip earnings the account itself carries
        rather than from the trips the host has run over the whole life of their membership. The schedule
        is then settled by testing the three qualifying figures against each schedule's floors from the
        highest-ranked schedule downwards, and the first schedule whose earnings floor, trip floor and
        tenure floor are all met is the schedule the host moves onto.
      params: [floor_earn_reserve, floor_trips_reserve, floor_tenure_reserve, floor_earn_fleet, floor_trips_fleet, floor_tenure_fleet, floor_earn_instant, floor_trips_instant, floor_tenure_instant, floor_earn_express, floor_trips_express, floor_tenure_express, floor_trips_weekly, floor_tenure_weekly]
    inputs:
      history:
        - {table: payouts_ledger, aggregate: sum, field: entry_amount, within_months: 12, filters: {entry_basis: trip_earning}}
        - {table: payouts_ledger, aggregate: sum, field: entry_amount, within_months: 12, filters: {event_type: payouts_deduction_posted}}
        - {category: hostplan, table: hostplan_claims, aggregate: count, field: appraisal_amount, within_months: 12, filters: {event_type: hostplan_claim_appraised}}
      cross_category: [hostplan]
