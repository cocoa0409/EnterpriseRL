- id: hostplan_ext_host_share
  base_policy_refs:
  - hostplan_evt_deductible
  overwrite:
  - base_policy: hostplan_evt_deductible
    superseded_clause: Every accepted loss carries the host's own share, and that share is the deductible of the
      plan in force on the day of the loss rather than the plan in force on the day the claim is settled.
    replaced_by: Where the money the plan accepted on the claim is below the marketplace's small-loss mark, the
      share is measured as the marketplace's small-loss proportion of the money accepted; where the money accepted
      reaches the marketplace's major-loss mark, it is measured as the deductible the plan publishes together with
      the marketplace's major-loss proportion of the money accepted above that mark; where the money accepted lies
      between the two marks, it is measured at the deductible the plan publishes.
  - base_policy: hostplan_evt_deductible
    superseded_clause: A host who has gone the plan's qualifying period without an accepted claim has the deductible
      reduced by the plan's claim-free discount, and a host who reaches the plan's waiver period has it waived entirely
      on the next accepted claim; the discount and the waiver do not stack, the waiver simply replacing the discount
      once it is earned.
    replaced_by: Where the plan publishes a waiver period, the enrolment has gone at least that long without a claim
      being accepted on it and nothing stands unpaid on the enrolment, the share is waived altogether; where the
      enrolment has gone at least the plan's qualifying period without a claim being accepted on it but less than
      the waiver period the plan publishes, and nothing stands unpaid on the enrolment, one less the plan's claim-free
      discount is applied to the share; in every other case the share is carried at the whole of the figure it was
      measured at.
