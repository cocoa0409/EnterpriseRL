      where a passed inspection has been recorded within that period, nothing is added on that account.
    listing_odometer: Where no passed inspection has been recorded on the vehicle within the marketplace's inspection
      recency period before the report and the odometer standing on the listing is above the marketplace's high-mileage
      mark, the stale-inspection high-mileage addition is added; where no passed inspection has been recorded within
      that period and the odometer is at or below that mark, the stale-inspection addition is added; where a passed
      inspection has been recorded within that period, nothing is added on that account.
    inspection_addition: Where no passed inspection has been recorded on the vehicle within the marketplace's inspection
      recency period before the report and the odometer standing on the listing is above the marketplace's high-mileage
      mark, the stale-inspection high-mileage addition is added; where no passed inspection has been recorded within
      that period and the odometer is at or below that mark, the stale-inspection addition is added; where a passed
      inspection has been recorded within that period, nothing is added on that account.
    result: The three additions are added to the figure the evidence minimum gives once it has been taken at the
      share the workshop record calls for, and the sum is the count of documents the report carries. The count is
      a whole number of documents and is never below one.
  factors:
  - id: workshop_record_share
    effect: method
    decides: evidence_required
    bindings:
