    note: The care-plan standing and the included services left on it decide the care rate applied to the host's
      share.
  - category: listings
    as: branch
    reads:
    - market_value_amount
    - value_class_name
    note: The vehicle's valuation and value class decide the loading applied to the host's share.
  compute:
  - accepted_standing: MAX('hostplan_claims','amount_delta', event_type='hostplan_claim_appraised')
  - plan_deductible: K('ded_s90') if F('protection_plan_name') == 'Keyturn Shield 90 Host Plan' else (K('ded_s85')
      if F('protection_plan_name') == 'Keyturn Shield 85 Host Plan' else (K('ded_s80') if F('protection_plan_name')
      == 'Keyturn Shield 80 Host Plan' else (K('ded_s75') if F('protection_plan_name') == 'Keyturn Shield 75 Host
      Plan' else (K('ded_s70') if F('protection_plan_name') == 'Keyturn Shield 70 Host Plan' else (K('ded_s60'))))))
  - plan_claim_free_discount: K('cfd_s90') if F('protection_plan_name') == 'Keyturn Shield 90 Host Plan' else (K('cfd_s85')
      if F('protection_plan_name') == 'Keyturn Shield 85 Host Plan' else (K('cfd_s80') if F('protection_plan_name')
      == 'Keyturn Shield 80 Host Plan' else (K('cfd_s75') if F('protection_plan_name') == 'Keyturn Shield 75 Host
      Plan' else (K('cfd_s70') if F('protection_plan_name') == 'Keyturn Shield 70 Host Plan' else (K('cfd_s60'))))))
  - plan_qualifying_months: K('cfq_a_s90') if F('protection_plan_name') == 'Keyturn Shield 90 Host Plan' else (K('cfq_a_s85')
      if F('protection_plan_name') == 'Keyturn Shield 85 Host Plan' else (K('cfq_a_s80') if F('protection_plan_name')
      == 'Keyturn Shield 80 Host Plan' else (K('cfq_a_s75') if F('protection_plan_name') == 'Keyturn Shield 75 Host
      Plan' else (K('cfq_a_s70') if F('protection_plan_name') == 'Keyturn Shield 70 Host Plan' else (K('cfq_a_s60'))))))
  - plan_waiver_months: K('cfw_s90') if F('protection_plan_name') == 'Keyturn Shield 90 Host Plan' else (K('cfw_s85')
      if F('protection_plan_name') == 'Keyturn Shield 85 Host Plan' else (K('cfw_s80') if F('protection_plan_name')
      == 'Keyturn Shield 80 Host Plan' else (K('cfw_s75') if F('protection_plan_name') == 'Keyturn Shield 75 Host
      Plan' else (K('cfw_s70') if F('protection_plan_name') == 'Keyturn Shield 70 Host Plan' else (K('cfw_s60'))))))
  - share_basis: K('small_loss_proportion') * accepted_standing if accepted_standing < K('small_loss_mark') else
      (plan_deductible + K('major_loss_proportion') * (accepted_standing - K('major_loss_mark')) if accepted_standing
      >= K('major_loss_mark') else plan_deductible)
  - months_claim_free: MONTHS(F('claim_free_since_date'), NOW)
  - liability_standing: F('liability_balance_due')
  - claim_free_rate: 0.0 if (plan_waiver_months > 0 and months_claim_free >= plan_waiver_months and liability_standing
      <= 0) else ((1 - plan_claim_free_discount / 100) if (months_claim_free >= plan_qualifying_months and (plan_waiver_months
      <= 0 or months_claim_free < plan_waiver_months) and liability_standing <= 0) else 1.0)
  - care_plan_state: CFIELD('service','status', vehicle_id=F('vehicle_id'))
  - service_credits_left: CFIELD('service','service_credits_remaining', vehicle_id=F('vehicle_id'))
  - care_rate: K('maintained_vehicle_rate') if (care_plan_state == 'active' and service_credits_left > 0) else (K('part_maintained_rate')
