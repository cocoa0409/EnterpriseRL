  rule: 'Every accepted loss carries the host''s own share, booked against the enrolment the claim was made under.
    The host''s share of a loss is fixed only after an appraisal of that loss stands on the enrolment with the money
    it accepts booked as owed to the host. The host''s share of an accepted loss is measured at the deductible the
    plan publishes, carried in full, and it is never more than the money the plan accepted on the claim, which the
    marketplace takes as the largest amount an appraisal on the enrolment has booked as owed to the host. The share
    is rounded half up to two decimal places once, after every rate has been applied, and the ceiling on it is applied
    to that rounded figure. Where the money the plan accepted on the claim is below the marketplace''s small-loss
    mark, the share is measured as the marketplace''s small-loss proportion of the money accepted; where the money
    accepted reaches the marketplace''s major-loss mark, it is measured as the deductible the plan publishes together
    with the marketplace''s major-loss proportion of the money accepted above that mark; where the money accepted
    lies between the two marks, it is measured at the deductible the plan publishes. Where the plan publishes a
    waiver period, the enrolment has gone at least that long without a claim being accepted on it and nothing stands
    unpaid on the enrolment, the share is waived altogether; where the enrolment has gone at least the plan''s qualifying
    period without a claim being accepted on it but less than the waiver period the plan publishes, and nothing
    stands unpaid on the enrolment, one less the plan''s claim-free discount is applied to the share; in every other
    case the share is carried at the whole of the figure it was measured at. Where the vehicle carries an active
    care plan with included services still to run, the share is taken at the marketplace''s maintained-vehicle rate;
    where the vehicle carries an active care plan whose included services are used up, it is taken at the marketplace''s
    part-maintained rate; where the vehicle carries no active care plan, it is taken at the whole of the figure
    the rates before it leave. Where the marketplace''s valuation of the vehicle reaches the marketplace''s high-value
    share mark and the vehicle''s listing sits in a value class above the marketplace''s standard class, the marketplace''s
    high-value loading is applied to the share; where that valuation reaches the mark and the listing sits in the
    standard class or below it, the marketplace''s standard-value loading is applied; where the valuation does not
    reach the mark, no loading is applied. The order is fixed: the share is measured first, the claim-free rate
    is then applied to the figure that step leaves, the care rate is applied to the figure that step leaves, the
    value loading is applied last to that result, and the ceiling of the money accepted on the claim is applied
    to the rounded figure. Every figure the plan publishes, its deductible, its claim-free discount, its qualifying
    period and the waiver period among them, is read from the plan the enrolment is written on.'
