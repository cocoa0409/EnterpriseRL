      damage_category: The kind of loss the deductible belongs to.
      liability_finding: Who was found responsible.
      decision_channel: Who raised it.
    triggers:
      - event: payouts:payouts_deduction_posted
        map: {customer_id: customer_id, booking_id: booking_id, entry_basis: claim_deductible_recovery}
  - type: hostplan_reimbursement_paid
    target: hostplan_claims
    meaning: The money owed to the host on an accepted loss is released to them.
    grain: One row per payment made against one accepted claim.
    account: claim_reimbursement
    direction: out
    distinguish_by: [claim_date, amount_delta, source_claim_id]
    fields:
      claim_id: Reference number of the payment record.
      enrollment_id: The enrolment the payment belongs to.
      customer_id: The host being paid.
      booking_id: The trip the loss happened on.
      source_claim_id: The accepted claim being paid.
      event_type: Event family of the record.
