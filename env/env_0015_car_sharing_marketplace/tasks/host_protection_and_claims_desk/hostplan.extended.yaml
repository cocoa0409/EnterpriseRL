    frequent_reporting_documents: 1
    inspection_recency_months: 6
    high_mileage_mark: 60000
    stale_inspection_high_mileage_documents: 4
    stale_inspection_documents: 2
  rule: When a host reports damage to a vehicle the marketplace protects, the desk settles how many photographs
    and documents the report must carry, and the host lodges that many with the report. The count starts from the
    evidence minimum the plan publishes, taken as published, and nothing further is asked of the report. The count
    is a whole number of documents and is never below one. Where the vehicle carries an active care plan and two
    or more workshop visits on it have been completed in the six months before the report, the evidence minimum
    is taken at half and rounded up to a whole document, the workshop's own record standing for the rest; where
    the vehicle carries an active care plan and fewer than two workshop visits on it have been completed in that
    period, the evidence minimum is taken at three quarters and rounded up to a whole document; where the vehicle
    carries no active care plan, the evidence minimum is taken as published. Where the marketplace's valuation of
    the vehicle reaches the marketplace's high-value documentation mark and the title of the vehicle is held by
    a lienholder or a lessor, the high-value financed addition is added to the count; where that valuation reaches
    the mark and the title is held outright, the high-value owned addition is added; where the valuation does not
    reach the mark, nothing is added on that account. Where two or more damage reports have been lodged on the enrolment
    in the twelve months before and at least one of them was closed incomplete, the unfinished-reporting addition
    is added; where two or more reports have been lodged in that period and none of them was closed incomplete,
    the frequent-reporting addition is added; where fewer than two reports have been lodged in that period, nothing
    is added on that account. Where no passed inspection has been recorded on the vehicle within the marketplace's
    inspection recency period before the report and the odometer standing on the listing is above the marketplace's
    high-mileage mark, the stale-inspection high-mileage addition is added; where no passed inspection has been
    recorded within that period and the odometer is at or below that mark, the stale-inspection addition is added;
    where a passed inspection has been recorded within that period, nothing is added on that account. The three
    additions are added to the figure the evidence minimum gives once it has been taken at the share the workshop
    record calls for, and the sum is the count of documents the report carries. Every figure the plan publishes,
    the evidence minimum among them, is read from the plan the enrolment is written on.
  prerequisite: []
  cross_category:
  - category: service
    as: branch
    reads:
    - status
    - service_visits.outcome
    - service_visits.visit_date
    note: The care-plan standing and the completed workshop visits on the vehicle decide which share of the plan's
