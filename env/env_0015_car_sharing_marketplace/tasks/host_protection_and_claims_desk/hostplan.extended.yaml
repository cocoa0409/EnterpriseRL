  rule: 'An appraisal settles what the marketplace accepts on a loss and books that money as owed to the host. The
    amount the plan accepts on a loss is not settled before a claim for that loss stands opened on the enrolment
    at a stated amount. What the plan accepts on a loss is the cost the appraisal establishes, which the marketplace
    takes as the largest amount a claim stands opened at on the enrolment, accepted at the marketplace''s unmanaged-repair
    rate and with nothing taken off for the condition of the parts replaced. The accepted amount is capped once,
    by the plan''s overall physical damage limit, the ceiling for the kind of loss having already been applied when
    the claim was opened. Loss of use is paid at the plan''s daily sum for the days the vehicle stands off the road,
    never for more days than the plan''s longest period and never for fewer than none, and the days are counted
    from the day the loss is recorded on the most recently opened claim to the day of the appraisal with neither
    end day counted. No share of the marketplace''s out-of-network valuation fee is carried by the host. Where a
    callout on the roadside cover the vehicle carries was completed in the month before the appraisal and the vehicle
    was towed in that month, the days off the road are counted from the day of the most recent completed callout
    on that cover; where a callout was completed on that cover in that month and the vehicle was not towed in it,
    they are counted from the day the most recent report was lodged on the register; where no callout was completed
    on that cover in that month, they are counted from the day the loss is recorded on the most recently opened
    claim. Where a report lodged in the month before the appraisal stands on the register and the vehicle''s listing
    is not live on the marketplace, the days run to the day of the appraisal with both end days counted; where such
    a report stands on the register and the vehicle''s listing is live, they run to that day with the first day
    not counted; where no report lodged in that month stands on the register, they run to that day with neither
    end day counted. Where a defect stands recorded on the vehicle in the six months before the appraisal and two
    or more claims have been opened on the enrolment in the twelve months before, the plan''s daily sum is paid
    at the marketplace''s impaired-earning share, the vehicle having been earning at less than its full rate before
    the loss; where a defect stands recorded in that period and fewer than two claims have been opened on the enrolment
    in the twelve months before, it is paid at the marketplace''s part-earning share; where no defect stands recorded
    in that period, the plan''s daily sum is paid in full. Where no workshop visit on the vehicle in the partner
    network stands in the month before and no passed inspection stands on it in the twelve months before, the host
    carries the plan''s out-of-network valuation share of that fee; where no workshop visit in the partner network
    stands in that month and a passed inspection stands in the twelve months before, the host carries half of that
    share; where a workshop visit in the partner network stands in that month, the host carries none of it. Where
    the vehicle carries an active care plan and two or more workshop visits on it in the partner network stand in
    the six months before, the cost is accepted at the full partner-network rate; where the vehicle carries an active
    care plan and fewer than two such visits stand in that period, it is accepted at the marketplace''s out-of-network
    repair rate; where the vehicle carries no active care plan, it is accepted at the marketplace''s unmanaged-repair
    rate. Where the odometer standing on the listing is above the marketplace''s betterment mileage mark and the
    model year of the vehicle is at or before the marketplace''s betterment model-year mark, the higher betterment
    share is taken off the cost; where the odometer is above that mark and the model year is after that mark, the
    lower betterment share is taken off; where the odometer is at or below that mark, nothing is taken off for betterment.
    The order is fixed: the cost established is taken first at the repair rate the workshop record calls for, the
    betterment share is then taken off the figure that step leaves and that figure is rounded half up to two decimal
    places, the plan''s overall physical damage limit is applied to the rounded figure, the loss-of-use sum is then
    added to it, the host''s share of the valuation fee is taken off last, and the accepted amount is rounded half
    up to two decimal places on that final result. Every figure the plan publishes, its overall physical damage
    limit, its daily sum for loss of use and its longest period for it among them, is read from the plan the enrolment
    is written on.'
  prerequisite:
  - problem: hostplan_ext_claim_opening
    kind: value_input
    gate: opened_amount
    form: state
    policy_source: The amount the plan accepts on a loss is not settled before a claim for that loss stands opened
      on the enrolment at a stated amount.
    condition: A claim record for the loss stands on the enrolment carrying the amount the claim was opened at.
    resolved_by: open_loss_claim_e6dccf7d
    effect: The amount the claim stands opened at is the cost the appraisal starts from, so the binding opened_amount
      takes that amount instead of nothing.
  cross_category:
  - category: service
    as: history
    reads:
    - status
    - service_visits.shop_channel
    - service_visits.visit_date
    note: The care-plan standing and the partner-network workshop visits decide the repair rate the cost is accepted
      at and the share of the valuation fee the host carries.
  - category: listings
    as: branch
    reads:
    - status
    - value_class_name
    - odometer_miles
    - model_year
    - listings_inspections.inspection_outcome
    note: The listing's state and value class decide how the days off the road are counted and the daily sum paid,
      and its odometer and model year decide the betterment share.
  - category: roadside
    as: history
    reads:
    - roadside_callouts.event_type
    - roadside_callouts.callout_date
    - roadside_callouts.tow_miles
    note: The callout record decides the day the vehicle is taken to have gone off the road.
  compute:
  - opened_amount: MAX('hostplan_claims','claim_amount', event_type='hostplan_claim_filed')
  - plan_physical_limit: K('phys_s90') if F('protection_plan_name') == 'Keyturn Shield 90 Host Plan' else (K('phys_s85')
      if F('protection_plan_name') == 'Keyturn Shield 85 Host Plan' else (K('phys_s80') if F('protection_plan_name')
      == 'Keyturn Shield 80 Host Plan' else (K('phys_s75') if F('protection_plan_name') == 'Keyturn Shield 75 Host
      Plan' else (K('phys_s70') if F('protection_plan_name') == 'Keyturn Shield 70 Host Plan' else (K('phys_s60'))))))
  - plan_lou_daily: K('lou_daily_s90') if F('protection_plan_name') == 'Keyturn Shield 90 Host Plan' else (K('lou_daily_s85')
      if F('protection_plan_name') == 'Keyturn Shield 85 Host Plan' else (K('lou_daily_s80') if F('protection_plan_name')
      == 'Keyturn Shield 80 Host Plan' else (K('lou_daily_s75') if F('protection_plan_name') == 'Keyturn Shield
      75 Host Plan' else (K('lou_daily_s70') if F('protection_plan_name') == 'Keyturn Shield 70 Host Plan' else
      (K('lou_daily_s60'))))))
  - plan_lou_max_days: K('lou_max_s90') if F('protection_plan_name') == 'Keyturn Shield 90 Host Plan' else (K('lou_max_s85')
      if F('protection_plan_name') == 'Keyturn Shield 85 Host Plan' else (K('lou_max_s80') if F('protection_plan_name')
      == 'Keyturn Shield 80 Host Plan' else (K('lou_max_s75') if F('protection_plan_name') == 'Keyturn Shield 75
      Host Plan' else (K('lou_max_s70') if F('protection_plan_name') == 'Keyturn Shield 70 Host Plan' else (K('lou_max_s60'))))))
  - plan_valuation_share: K('apr_share_s90') if F('protection_plan_name') == 'Keyturn Shield 90 Host Plan' else
      (K('apr_share_s85') if F('protection_plan_name') == 'Keyturn Shield 85 Host Plan' else (K('apr_share_s80')
      if F('protection_plan_name') == 'Keyturn Shield 80 Host Plan' else (K('apr_share_s75') if F('protection_plan_name')
      == 'Keyturn Shield 75 Host Plan' else (K('apr_share_s70') if F('protection_plan_name') == 'Keyturn Shield
      70 Host Plan' else (K('apr_share_s60'))))))
  - care_plan_state: CFIELD('service','status', vehicle_id=F('vehicle_id'))
  - partner_visits_6m: XCOUNT('service','service_visits', within_months=6, date_field='visit_date', vehicle_id=F('vehicle_id'),
      shop_channel='partner_network')
  - repair_rate: K('full_network_rate') if (care_plan_state == 'active' and partner_visits_6m >= 2) else (K('out_of_network_repair_rate')
      if (care_plan_state == 'active' and partner_visits_6m < 2) else K('unmanaged_repair_rate'))
  - listing_odometer: CFIELD('listings','odometer_miles', vehicle_id=F('vehicle_id'))
  - listing_model_year: CFIELD('listings','model_year', vehicle_id=F('vehicle_id'))
  - betterment_share: K('higher_betterment_share') if (listing_odometer > K('betterment_mileage_mark') and listing_model_year
      <= K('betterment_model_year_mark')) else (K('lower_betterment_share') if (listing_odometer > K('betterment_mileage_mark')
      and listing_model_year > K('betterment_model_year_mark')) else 0.0)
  - repair_element: MN(RND(opened_amount * repair_rate * (1 - betterment_share), 2), plan_physical_limit)
  - tow_callouts_1m: XCOUNT('roadside','roadside_callouts', within_months=1, date_field='callout_date', event_type='roadside_callout_completed')
  - towed_distance: XSUM('roadside','roadside_callouts','tow_miles', within_months=1, date_field='callout_date',
      event_type='roadside_callout_completed')
  - recovery_day: XLATEST('roadside','roadside_callouts','callout_date', date_field='callout_date', event_type='roadside_callout_completed')
  - report_day: LATEST('hostplan_claim_intake','reported_at', date_field='reported_at')
  - loss_day: LATEST('hostplan_claims','loss_date', date_field='claim_date', event_type='hostplan_claim_filed')
  - off_road_anchor: recovery_day if (tow_callouts_1m >= 1 and towed_distance > 0) else (report_day if (tow_callouts_1m
      >= 1 and towed_distance <= 0) else loss_day)
  - reports_on_register: COUNT('hostplan_claim_intake', within_months=1, date_field='reported_at')
  - listing_state: CFIELD('listings','status', vehicle_id=F('vehicle_id'))
  - off_road_days_counted: DAYS(off_road_anchor, NOW) + 1 if (reports_on_register >= 1 and listing_state != 'listed')
      else (DAYS(off_road_anchor, NOW) if (reports_on_register >= 1 and listing_state == 'listed') else DAYS(off_road_anchor,
      NOW) - 1)
  - off_road_days: MN(MX(off_road_days_counted, 0), plan_lou_max_days)
  - defects_6m: XCOUNT('listings','listings_inspections', within_months=6, date_field='record_date', vehicle_id=F('vehicle_id'),
      event_type='listings_defect_reported')
  - claims_opened_12m: COUNT('hostplan_claims', within_months=12, date_field='claim_date', event_type='hostplan_claim_filed')
  - loss_of_use_rate: plan_lou_daily * K('impaired_earning_share') if (defects_6m >= 1 and claims_opened_12m >=
      2) else (plan_lou_daily * K('part_earning_share') if (defects_6m >= 1 and claims_opened_12m < 2) else plan_lou_daily)
  - loss_of_use_element: loss_of_use_rate * off_road_days
  - partner_visits_1m: XCOUNT('service','service_visits', within_months=1, date_field='visit_date', vehicle_id=F('vehicle_id'),
      shop_channel='partner_network')
  - passed_inspections_12m: XCOUNT('listings','listings_inspections', within_months=12, date_field='record_date',
      vehicle_id=F('vehicle_id'), event_type='listings_inspection_completed', inspection_outcome='passed')
  - valuation_share: plan_valuation_share / 100 if (partner_visits_1m < 1 and passed_inspections_12m < 1) else (plan_valuation_share
      / 200 if (partner_visits_1m < 1 and passed_inspections_12m >= 1) else 0.0)
  - valuation_charge: K('out_of_network_valuation_fee') * valuation_share
  - result: RND(repair_element + loss_of_use_element - valuation_charge, 2)
  compute_basis:
    opened_amount: What the plan accepts on a loss is the cost the appraisal establishes, which the marketplace
      takes as the largest amount a claim stands opened at on the enrolment, accepted at the marketplace's unmanaged-repair
      rate and with nothing taken off for the condition of the parts replaced.
    plan_physical_limit: Every figure the plan publishes, its overall physical damage limit, its daily sum for loss
      of use and its longest period for it among them, is read from the plan the enrolment is written on.
    plan_lou_daily: Every figure the plan publishes, its overall physical damage limit, its daily sum for loss of
      use and its longest period for it among them, is read from the plan the enrolment is written on.
    plan_lou_max_days: Every figure the plan publishes, its overall physical damage limit, its daily sum for loss
      of use and its longest period for it among them, is read from the plan the enrolment is written on.
    plan_valuation_share: Where no workshop visit on the vehicle in the partner network stands in the month before
      and no passed inspection stands on it in the twelve months before, the host carries the plan's out-of-network
      valuation share of that fee; where no workshop visit in the partner network stands in that month and a passed
      inspection stands in the twelve months before, the host carries half of that share; where a workshop visit
      in the partner network stands in that month, the host carries none of it.
    care_plan_state: Where the vehicle carries an active care plan and two or more workshop visits on it in the
      partner network stand in the six months before, the cost is accepted at the full partner-network rate; where
      the vehicle carries an active care plan and fewer than two such visits stand in that period, it is accepted
      at the marketplace's out-of-network repair rate; where the vehicle carries no active care plan, it is accepted
      at the marketplace's unmanaged-repair rate.
    partner_visits_6m: Where the vehicle carries an active care plan and two or more workshop visits on it in the
      partner network stand in the six months before, the cost is accepted at the full partner-network rate; where
      the vehicle carries an active care plan and fewer than two such visits stand in that period, it is accepted
      at the marketplace's out-of-network repair rate; where the vehicle carries no active care plan, it is accepted
      at the marketplace's unmanaged-repair rate.
    repair_rate: Where the vehicle carries an active care plan and two or more workshop visits on it in the partner
      network stand in the six months before, the cost is accepted at the full partner-network rate; where the vehicle
      carries an active care plan and fewer than two such visits stand in that period, it is accepted at the marketplace's
      out-of-network repair rate; where the vehicle carries no active care plan, it is accepted at the marketplace's
      unmanaged-repair rate.
    listing_odometer: Where the odometer standing on the listing is above the marketplace's betterment mileage mark
      and the model year of the vehicle is at or before the marketplace's betterment model-year mark, the higher
      betterment share is taken off the cost; where the odometer is above that mark and the model year is after
      that mark, the lower betterment share is taken off; where the odometer is at or below that mark, nothing is
      taken off for betterment.
    listing_model_year: Where the odometer standing on the listing is above the marketplace's betterment mileage
      mark and the model year of the vehicle is at or before the marketplace's betterment model-year mark, the higher
      betterment share is taken off the cost; where the odometer is above that mark and the model year is after
      that mark, the lower betterment share is taken off; where the odometer is at or below that mark, nothing is
      taken off for betterment.
    betterment_share: Where the odometer standing on the listing is above the marketplace's betterment mileage mark
      and the model year of the vehicle is at or before the marketplace's betterment model-year mark, the higher
      betterment share is taken off the cost; where the odometer is above that mark and the model year is after
      that mark, the lower betterment share is taken off; where the odometer is at or below that mark, nothing is
      taken off for betterment.
    repair_element: 'The order is fixed: the cost established is taken first at the repair rate the workshop record
      calls for, the betterment share is then taken off the figure that step leaves and that figure is rounded half
      up to two decimal places, the plan''s overall physical damage limit is applied to the rounded figure, the
      loss-of-use sum is then added to it, the host''s share of the valuation fee is taken off last, and the accepted
      amount is rounded half up to two decimal places on that final result. The accepted amount is capped once,
      by the plan''s overall physical damage limit, the ceiling for the kind of loss having already been applied
      when the claim was opened.'
    tow_callouts_1m: Where a callout on the roadside cover the vehicle carries was completed in the month before
      the appraisal and the vehicle was towed in that month, the days off the road are counted from the day of the
      most recent completed callout on that cover; where a callout was completed on that cover in that month and
      the vehicle was not towed in it, they are counted from the day the most recent report was lodged on the register;
      where no callout was completed on that cover in that month, they are counted from the day the loss is recorded
      on the most recently opened claim.
    towed_distance: Where a callout on the roadside cover the vehicle carries was completed in the month before
      the appraisal and the vehicle was towed in that month, the days off the road are counted from the day of the
      most recent completed callout on that cover; where a callout was completed on that cover in that month and
      the vehicle was not towed in it, they are counted from the day the most recent report was lodged on the register;
      where no callout was completed on that cover in that month, they are counted from the day the loss is recorded
      on the most recently opened claim.
    recovery_day: Where a callout on the roadside cover the vehicle carries was completed in the month before the
      appraisal and the vehicle was towed in that month, the days off the road are counted from the day of the most
      recent completed callout on that cover; where a callout was completed on that cover in that month and the
      vehicle was not towed in it, they are counted from the day the most recent report was lodged on the register;
      where no callout was completed on that cover in that month, they are counted from the day the loss is recorded
      on the most recently opened claim.
    report_day: Where a callout on the roadside cover the vehicle carries was completed in the month before the
      appraisal and the vehicle was towed in that month, the days off the road are counted from the day of the most
      recent completed callout on that cover; where a callout was completed on that cover in that month and the
      vehicle was not towed in it, they are counted from the day the most recent report was lodged on the register;
      where no callout was completed on that cover in that month, they are counted from the day the loss is recorded
      on the most recently opened claim.
    loss_day: Where a callout on the roadside cover the vehicle carries was completed in the month before the appraisal
      and the vehicle was towed in that month, the days off the road are counted from the day of the most recent
      completed callout on that cover; where a callout was completed on that cover in that month and the vehicle
      was not towed in it, they are counted from the day the most recent report was lodged on the register; where
      no callout was completed on that cover in that month, they are counted from the day the loss is recorded on
      the most recently opened claim.
    off_road_anchor: Where a callout on the roadside cover the vehicle carries was completed in the month before
      the appraisal and the vehicle was towed in that month, the days off the road are counted from the day of the
      most recent completed callout on that cover; where a callout was completed on that cover in that month and
      the vehicle was not towed in it, they are counted from the day the most recent report was lodged on the register;
      where no callout was completed on that cover in that month, they are counted from the day the loss is recorded
      on the most recently opened claim.
    reports_on_register: Where a report lodged in the month before the appraisal stands on the register and the
      vehicle's listing is not live on the marketplace, the days run to the day of the appraisal with both end days
      counted; where such a report stands on the register and the vehicle's listing is live, they run to that day
      with the first day not counted; where no report lodged in that month stands on the register, they run to that
      day with neither end day counted.
    listing_state: Where a report lodged in the month before the appraisal stands on the register and the vehicle's
      listing is not live on the marketplace, the days run to the day of the appraisal with both end days counted;
      where such a report stands on the register and the vehicle's listing is live, they run to that day with the
      first day not counted; where no report lodged in that month stands on the register, they run to that day with
      neither end day counted.
    off_road_days_counted: Where a report lodged in the month before the appraisal stands on the register and the
      vehicle's listing is not live on the marketplace, the days run to the day of the appraisal with both end days
      counted; where such a report stands on the register and the vehicle's listing is live, they run to that day
      with the first day not counted; where no report lodged in that month stands on the register, they run to that
      day with neither end day counted.
    off_road_days: Loss of use is paid at the plan's daily sum for the days the vehicle stands off the road, never
      for more days than the plan's longest period and never for fewer than none, and the days are counted from
      the day the loss is recorded on the most recently opened claim to the day of the appraisal with neither end
      day counted.
    defects_6m: Where a defect stands recorded on the vehicle in the six months before the appraisal and two or
      more claims have been opened on the enrolment in the twelve months before, the plan's daily sum is paid at
      the marketplace's impaired-earning share, the vehicle having been earning at less than its full rate before
      the loss; where a defect stands recorded in that period and fewer than two claims have been opened on the
      enrolment in the twelve months before, it is paid at the marketplace's part-earning share; where no defect
      stands recorded in that period, the plan's daily sum is paid in full.
    claims_opened_12m: Where a defect stands recorded on the vehicle in the six months before the appraisal and
      two or more claims have been opened on the enrolment in the twelve months before, the plan's daily sum is
      paid at the marketplace's impaired-earning share, the vehicle having been earning at less than its full rate
      before the loss; where a defect stands recorded in that period and fewer than two claims have been opened
      on the enrolment in the twelve months before, it is paid at the marketplace's part-earning share; where no
      defect stands recorded in that period, the plan's daily sum is paid in full.
    loss_of_use_rate: Where a defect stands recorded on the vehicle in the six months before the appraisal and two
      or more claims have been opened on the enrolment in the twelve months before, the plan's daily sum is paid
      at the marketplace's impaired-earning share, the vehicle having been earning at less than its full rate before
      the loss; where a defect stands recorded in that period and fewer than two claims have been opened on the
      enrolment in the twelve months before, it is paid at the marketplace's part-earning share; where no defect
      stands recorded in that period, the plan's daily sum is paid in full.
    loss_of_use_element: Loss of use is paid at the plan's daily sum for the days the vehicle stands off the road,
      never for more days than the plan's longest period and never for fewer than none, and the days are counted
      from the day the loss is recorded on the most recently opened claim to the day of the appraisal with neither
      end day counted.
    partner_visits_1m: Where no workshop visit on the vehicle in the partner network stands in the month before
      and no passed inspection stands on it in the twelve months before, the host carries the plan's out-of-network
      valuation share of that fee; where no workshop visit in the partner network stands in that month and a passed
      inspection stands in the twelve months before, the host carries half of that share; where a workshop visit
      in the partner network stands in that month, the host carries none of it.
    passed_inspections_12m: Where no workshop visit on the vehicle in the partner network stands in the month before
      and no passed inspection stands on it in the twelve months before, the host carries the plan's out-of-network
      valuation share of that fee; where no workshop visit in the partner network stands in that month and a passed
      inspection stands in the twelve months before, the host carries half of that share; where a workshop visit
      in the partner network stands in that month, the host carries none of it.
    valuation_share: Where no workshop visit on the vehicle in the partner network stands in the month before and
      no passed inspection stands on it in the twelve months before, the host carries the plan's out-of-network
      valuation share of that fee; where no workshop visit in the partner network stands in that month and a passed
      inspection stands in the twelve months before, the host carries half of that share; where a workshop visit
      in the partner network stands in that month, the host carries none of it.
    valuation_charge: No share of the marketplace's out-of-network valuation fee is carried by the host.
    result: 'The order is fixed: the cost established is taken first at the repair rate the workshop record calls
      for, the betterment share is then taken off the figure that step leaves and that figure is rounded half up
      to two decimal places, the plan''s overall physical damage limit is applied to the rounded figure, the loss-of-use
      sum is then added to it, the host''s share of the valuation fee is taken off last, and the accepted amount
