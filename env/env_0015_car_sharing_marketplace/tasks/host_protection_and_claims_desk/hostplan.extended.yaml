  - id: hostplan_evt_appraisal
    subject: [hostplan_claim_appraised, hostplan_supplement_added]
    rule: >-
      The loss is valued before anything is owed, and what the plan accepts is the appraised cost of repair or replacement, never the amount the host asked for.
      A claim worth more than the plan's photo estimate threshold cannot be settled on photographs and goes to an in-person adjuster or a repair shop invoice; a claim at or below the threshold may be settled on photographs alone.
      The accepted amount is capped twice over, first by the sublimit for the kind of loss and then by the plan's overall physical damage limit, and the lower of the two governs; sublimits are not added together where one loss spans several kinds of damage, each kind being capped on its own.
      Where the appraised cost reaches the plan's total loss threshold as a percentage of the marketplace valuation of the vehicle, the claim is settled as a total loss at that valuation less the deductible rather than as a repair.
      Loss of use is paid at the plan's daily rate for the days the vehicle is genuinely off the road, up to the plan's maximum, and is not paid at all on plans that carry no loss of use benefit; a benefit the plan does not carry is not paid at a reduced rate.
      Further cost found after the appraisal is added as a supplement only inside the plan's supplement window and only up to the plan's supplement ceiling as a percentage of the original appraisal; cost found later, or beyond the ceiling, is refused rather than opened as a fresh claim.
      Wear, ordinary cleaning and mechanical failure with no trip event behind it are excluded on every plan, and a plan that includes mechanical cover still excludes failure that would have happened whoever was driving.
