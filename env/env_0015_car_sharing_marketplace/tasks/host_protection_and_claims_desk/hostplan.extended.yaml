- id: hostplan_ext_cover_restoration
  base_policy_refs:
  - hostplan_lifecycle_standing
  overwrite:
  - base_policy: hostplan_lifecycle_standing
    superseded_clause: A lapsed enrolment may be reinstated inside the plan's reinstatement window on payment of
      the plan's reinstatement fee
    replaced_by: Cover that has fallen away is put back into force on a charge the host carries, and cover then
      runs again from the day the restoration is recorded.
  trigger: on_request
  subject:
  - hostplan_enrollment_reinstated
  computes: restoration_charge_amount
  target_tool: restore_protection_cover_3adbf459
  params:
    rfee_s90: 75.0
    rfee_s85: 75.0
    rfee_s80: 95.0
    rfee_s75: 125.0
    rfee_s70: 150.0
    rfee_s60: 200.0
    rwin_s90: 30
    rwin_s85: 30
    rwin_s80: 45
    rwin_s75: 60
    rwin_s70: 90
    rwin_s60: 120
    rev_s90: 2
    rev_s85: 2
    rev_s80: 3
    rev_s75: 3
    rev_s70: 4
    rev_s60: 5
    susp_s90: 4
    susp_s85: 4
    susp_s80: 5
    susp_s75: 5
    susp_s70: 6
    susp_s60: 8
    prompt_restoration_rate: 0.8
    late_restoration_rate: 1.4
    month_charge_share: 0.1
    week_charge_share: 0.025
    high_frequency_loading: 1.5
    review_loading: 1.2
    verified_vehicle_rate: 0.9
    unlisted_vehicle_rate: 0.95
    serviced_vehicle_rate: 0.92
    unserviced_plan_rate: 0.97
    settlement_risk_loading: 1.3
    returned_transfer_loading: 1.15
  rule: 'Cover that has fallen away is put back into force on a charge the host carries, and cover then runs again
    from the day the restoration is recorded. The charge for restoring cover is the reinstatement fee the plan publishes,
    carried in full, with nothing added for the period the enrolment went without cover and nothing taken off for
    the standing of the vehicle or the host. The charge is rounded half up to two decimal places once, on the final
    result, and never at an intermediate step. Where less than half the plan''s reinstatement window has run since
    cover fell away and money stands owed to the host on the enrolment, the fee is taken at the marketplace''s prompt-restoration
    rate; where half that window or more has run since cover fell away, it is taken at the marketplace''s late-restoration
    rate; where less than half that window has run and no money stands owed to the host, the fee is taken in full.
    Where the enrolment went without cover for thirty days or more and no claim has been accepted on it in the twelve
    months before, the period without cover is measured in whole months of thirty days and each month is charged
    at a tenth of the plan''s reinstatement fee; where the enrolment went without cover for thirty days or more
    and a claim has been accepted on it in that period, the period is measured in whole weeks of seven days and
    each week is charged at a fortieth of that fee; where the enrolment went without cover for fewer than thirty
    days, no charge is made for the period. Where the claims accepted on the enrolment in the twelve months before
    reach the number the plan allows before cover is suspended, the charge carries the marketplace''s high-frequency
    loading; where they reach the number the plan allows before the enrolment goes in front of a reviewer but not
    the number before suspension, it carries the review loading; where they reach neither, no loading is carried
    on that account. Where a passed inspection stands on the vehicle in the twelve months before and its listing
    is live on the marketplace, the charge is taken at the marketplace''s verified-vehicle rate; where a passed
    inspection stands in that period and the listing is not live, it is taken at the marketplace''s unlisted-vehicle
    rate; where no passed inspection stands in that period, no rate is applied on that account. Where the vehicle
    carries an active care plan and a workshop visit stands on it in the six months before, the charge is taken
    at the marketplace''s serviced-vehicle rate; where the vehicle carries an active care plan and no workshop visit
    stands in that period, it is taken at the marketplace''s unserviced-plan rate; where the vehicle carries no
    active care plan, no rate is applied on that account. Where a transfer to the host has been returned unpaid
    in the twelve months before and money is currently stopped on the host''s payout account, the charge carries
    the marketplace''s settlement-risk loading; where a transfer has been returned unpaid in that period and no
    money is stopped on the account, it carries the marketplace''s returned-transfer loading; where no transfer
    has been returned in that period, no loading is carried on that account. The order is fixed: the plan''s reinstatement
    fee is taken first at the rate the length of the lapse calls for, the loadings and rates for standing, vehicle,
    care and settlement are then applied one after another to the figure each step leaves, and the charge for the
    period without cover is added to that result last. Every figure the plan publishes, its reinstatement fee, its
    reinstatement window and the numbers of claims it allows before review and before suspension among them, is
    read from the plan the enrolment is written on.'
  prerequisite: []
  cross_category:
  - category: listings
    as: branch
    reads:
    - status
    - listings_inspections.inspection_outcome
    - listings_inspections.record_date
    note: The listing's state and the inspection record decide the vehicle rate applied to the charge.
  - category: service
    as: history
    reads:
    - status
    - service_visits.visit_date
    note: The care-plan standing and the workshop visits decide the care rate applied to the charge.
  - category: payouts
    as: history
    reads:
    - hold_reason
    - payouts_ledger.event_type
    - payouts_ledger.entry_date
    note: Returned transfers on the payout ledger and whether money is stopped on the account decide the settlement
      loading.
  compute:
  - plan_fee: K('rfee_s90') if F('protection_plan_name') == 'Keyturn Shield 90 Host Plan' else (K('rfee_s85') if
      F('protection_plan_name') == 'Keyturn Shield 85 Host Plan' else (K('rfee_s80') if F('protection_plan_name')
      == 'Keyturn Shield 80 Host Plan' else (K('rfee_s75') if F('protection_plan_name') == 'Keyturn Shield 75 Host
      Plan' else (K('rfee_s70') if F('protection_plan_name') == 'Keyturn Shield 70 Host Plan' else (K('rfee_s60'))))))
  - plan_reinstatement_window: K('rwin_s90') if F('protection_plan_name') == 'Keyturn Shield 90 Host Plan' else
      (K('rwin_s85') if F('protection_plan_name') == 'Keyturn Shield 85 Host Plan' else (K('rwin_s80') if F('protection_plan_name')
      == 'Keyturn Shield 80 Host Plan' else (K('rwin_s75') if F('protection_plan_name') == 'Keyturn Shield 75 Host
      Plan' else (K('rwin_s70') if F('protection_plan_name') == 'Keyturn Shield 70 Host Plan' else (K('rwin_s60'))))))
  - plan_review_count: K('rev_s90') if F('protection_plan_name') == 'Keyturn Shield 90 Host Plan' else (K('rev_s85')
      if F('protection_plan_name') == 'Keyturn Shield 85 Host Plan' else (K('rev_s80') if F('protection_plan_name')
      == 'Keyturn Shield 80 Host Plan' else (K('rev_s75') if F('protection_plan_name') == 'Keyturn Shield 75 Host
      Plan' else (K('rev_s70') if F('protection_plan_name') == 'Keyturn Shield 70 Host Plan' else (K('rev_s60'))))))
  - plan_suspension_count: K('susp_s90') if F('protection_plan_name') == 'Keyturn Shield 90 Host Plan' else (K('susp_s85')
      if F('protection_plan_name') == 'Keyturn Shield 85 Host Plan' else (K('susp_s80') if F('protection_plan_name')
      == 'Keyturn Shield 80 Host Plan' else (K('susp_s75') if F('protection_plan_name') == 'Keyturn Shield 75 Host
      Plan' else (K('susp_s70') if F('protection_plan_name') == 'Keyturn Shield 70 Host Plan' else (K('susp_s60'))))))
  - days_without_cover: DAYS(F('ended_date'), NOW)
  - owed_to_host: F('reimbursement_balance_due')
  - lapse_rate: K('prompt_restoration_rate') if (days_without_cover * 2 < plan_reinstatement_window and owed_to_host
      > 0) else (K('late_restoration_rate') if (days_without_cover * 2 >= plan_reinstatement_window) else 1.0)
  - accepted_claims_12m: COUNT('hostplan_claims', within_months=12, date_field='claim_date', event_type='hostplan_claim_appraised')
  - period_charge: int(days_without_cover / 30) * plan_fee * K('month_charge_share') if (days_without_cover >= 30
      and accepted_claims_12m < 1) else (int(days_without_cover / 7) * plan_fee * K('week_charge_share') if (days_without_cover
      >= 30 and accepted_claims_12m >= 1) else 0.0)
  - claims_accepted_for_standing: COUNT('hostplan_claims', within_months=12, date_field='claim_date', event_type='hostplan_claim_appraised')
  - standing_loading: K('high_frequency_loading') if claims_accepted_for_standing >= plan_suspension_count else
      (K('review_loading') if claims_accepted_for_standing >= plan_review_count else 1.0)
  - passed_inspections_12m: XCOUNT('listings','listings_inspections', within_months=12, date_field='record_date',
      vehicle_id=F('vehicle_id'), event_type='listings_inspection_completed', inspection_outcome='passed')
  - listing_state: CFIELD('listings','status', vehicle_id=F('vehicle_id'))
  - vehicle_rate: K('verified_vehicle_rate') if (passed_inspections_12m >= 1 and listing_state == 'listed') else
      (K('unlisted_vehicle_rate') if (passed_inspections_12m >= 1 and listing_state != 'listed') else 1.0)
  - care_plan_state: CFIELD('service','status', vehicle_id=F('vehicle_id'))
  - workshop_visits_6m: XCOUNT('service','service_visits', within_months=6, date_field='visit_date', vehicle_id=F('vehicle_id'))
  - care_rate: K('serviced_vehicle_rate') if (care_plan_state == 'active' and workshop_visits_6m >= 1) else (K('unserviced_plan_rate')
      if (care_plan_state == 'active' and workshop_visits_6m < 1) else 1.0)
  - returned_transfers_12m: XCOUNT('payouts','payouts_ledger', within_months=12, date_field='entry_date', event_type='payouts_transfer_returned')
  - payout_stop: CFIELD('payouts','hold_reason')
  - settlement_loading: K('settlement_risk_loading') if (returned_transfers_12m >= 1 and payout_stop != 'none')
      else (K('returned_transfer_loading') if (returned_transfers_12m >= 1 and payout_stop == 'none') else 1.0)
  - result: RND(plan_fee * lapse_rate * standing_loading * vehicle_rate * care_rate * settlement_loading + period_charge,
      2)
  compute_basis:
    plan_fee: Every figure the plan publishes, its reinstatement fee, its reinstatement window and the numbers of
      claims it allows before review and before suspension among them, is read from the plan the enrolment is written
      on.
    plan_reinstatement_window: Every figure the plan publishes, its reinstatement fee, its reinstatement window
      and the numbers of claims it allows before review and before suspension among them, is read from the plan
      the enrolment is written on.
    plan_review_count: Every figure the plan publishes, its reinstatement fee, its reinstatement window and the
      numbers of claims it allows before review and before suspension among them, is read from the plan the enrolment
      is written on.
    plan_suspension_count: Every figure the plan publishes, its reinstatement fee, its reinstatement window and
      the numbers of claims it allows before review and before suspension among them, is read from the plan the
      enrolment is written on.
    days_without_cover: Where less than half the plan's reinstatement window has run since cover fell away and money
      stands owed to the host on the enrolment, the fee is taken at the marketplace's prompt-restoration rate; where
      half that window or more has run since cover fell away, it is taken at the marketplace's late-restoration
      rate; where less than half that window has run and no money stands owed to the host, the fee is taken in full.
    owed_to_host: Where less than half the plan's reinstatement window has run since cover fell away and money stands
      owed to the host on the enrolment, the fee is taken at the marketplace's prompt-restoration rate; where half
      that window or more has run since cover fell away, it is taken at the marketplace's late-restoration rate;
      where less than half that window has run and no money stands owed to the host, the fee is taken in full.
    lapse_rate: Where less than half the plan's reinstatement window has run since cover fell away and money stands
      owed to the host on the enrolment, the fee is taken at the marketplace's prompt-restoration rate; where half
      that window or more has run since cover fell away, it is taken at the marketplace's late-restoration rate;
      where less than half that window has run and no money stands owed to the host, the fee is taken in full.
    accepted_claims_12m: Where the enrolment went without cover for thirty days or more and no claim has been accepted
      on it in the twelve months before, the period without cover is measured in whole months of thirty days and
      each month is charged at a tenth of the plan's reinstatement fee; where the enrolment went without cover for
      thirty days or more and a claim has been accepted on it in that period, the period is measured in whole weeks
      of seven days and each week is charged at a fortieth of that fee; where the enrolment went without cover for
      fewer than thirty days, no charge is made for the period.
    period_charge: Where the enrolment went without cover for thirty days or more and no claim has been accepted
      on it in the twelve months before, the period without cover is measured in whole months of thirty days and
      each month is charged at a tenth of the plan's reinstatement fee; where the enrolment went without cover for
      thirty days or more and a claim has been accepted on it in that period, the period is measured in whole weeks
      of seven days and each week is charged at a fortieth of that fee; where the enrolment went without cover for
      fewer than thirty days, no charge is made for the period.
    claims_accepted_for_standing: Where the claims accepted on the enrolment in the twelve months before reach the
      number the plan allows before cover is suspended, the charge carries the marketplace's high-frequency loading;
      where they reach the number the plan allows before the enrolment goes in front of a reviewer but not the number
      before suspension, it carries the review loading; where they reach neither, no loading is carried on that
      account.
    standing_loading: Where the claims accepted on the enrolment in the twelve months before reach the number the
      plan allows before cover is suspended, the charge carries the marketplace's high-frequency loading; where
      they reach the number the plan allows before the enrolment goes in front of a reviewer but not the number
      before suspension, it carries the review loading; where they reach neither, no loading is carried on that
      account.
    passed_inspections_12m: Where a passed inspection stands on the vehicle in the twelve months before and its
      listing is live on the marketplace, the charge is taken at the marketplace's verified-vehicle rate; where
      a passed inspection stands in that period and the listing is not live, it is taken at the marketplace's unlisted-vehicle
      rate; where no passed inspection stands in that period, no rate is applied on that account.
    listing_state: Where a passed inspection stands on the vehicle in the twelve months before and its listing is
      live on the marketplace, the charge is taken at the marketplace's verified-vehicle rate; where a passed inspection
      stands in that period and the listing is not live, it is taken at the marketplace's unlisted-vehicle rate;
      where no passed inspection stands in that period, no rate is applied on that account.
    vehicle_rate: Where a passed inspection stands on the vehicle in the twelve months before and its listing is
      live on the marketplace, the charge is taken at the marketplace's verified-vehicle rate; where a passed inspection
      stands in that period and the listing is not live, it is taken at the marketplace's unlisted-vehicle rate;
      where no passed inspection stands in that period, no rate is applied on that account.
    care_plan_state: Where the vehicle carries an active care plan and a workshop visit stands on it in the six
      months before, the charge is taken at the marketplace's serviced-vehicle rate; where the vehicle carries an
      active care plan and no workshop visit stands in that period, it is taken at the marketplace's unserviced-plan
      rate; where the vehicle carries no active care plan, no rate is applied on that account.
    workshop_visits_6m: Where the vehicle carries an active care plan and a workshop visit stands on it in the six
      months before, the charge is taken at the marketplace's serviced-vehicle rate; where the vehicle carries an
      active care plan and no workshop visit stands in that period, it is taken at the marketplace's unserviced-plan
      rate; where the vehicle carries no active care plan, no rate is applied on that account.
    care_rate: Where the vehicle carries an active care plan and a workshop visit stands on it in the six months
      before, the charge is taken at the marketplace's serviced-vehicle rate; where the vehicle carries an active
      care plan and no workshop visit stands in that period, it is taken at the marketplace's unserviced-plan rate;
      where the vehicle carries no active care plan, no rate is applied on that account.
    returned_transfers_12m: Where a transfer to the host has been returned unpaid in the twelve months before and
      money is currently stopped on the host's payout account, the charge carries the marketplace's settlement-risk
      loading; where a transfer has been returned unpaid in that period and no money is stopped on the account,
      it carries the marketplace's returned-transfer loading; where no transfer has been returned in that period,
      no loading is carried on that account.
    payout_stop: Where a transfer to the host has been returned unpaid in the twelve months before and money is
      currently stopped on the host's payout account, the charge carries the marketplace's settlement-risk loading;
      where a transfer has been returned unpaid in that period and no money is stopped on the account, it carries
      the marketplace's returned-transfer loading; where no transfer has been returned in that period, no loading
      is carried on that account.
    settlement_loading: Where a transfer to the host has been returned unpaid in the twelve months before and money
      is currently stopped on the host's payout account, the charge carries the marketplace's settlement-risk loading;
      where a transfer has been returned unpaid in that period and no money is stopped on the account, it carries
      the marketplace's returned-transfer loading; where no transfer has been returned in that period, no loading
      is carried on that account.
    result: 'The order is fixed: the plan''s reinstatement fee is taken first at the rate the length of the lapse
      calls for, the loadings and rates for standing, vehicle, care and settlement are then applied one after another
      to the figure each step leaves, and the charge for the period without cover is added to that result last.
      The charge is rounded half up to two decimal places once, on the final result, and never at an intermediate
      step.'
  factors:
  - id: lapse_length_rate
    effect: parameter
    decides: lapse_rate
    bindings:
    - days_without_cover
    - owed_to_host
    - lapse_rate
    ladder:
    - when: less than half the plan's reinstatement window has run since cover fell away and money stands owed to
        the host on the enrolment
      value: the marketplace's prompt-restoration rate
    - when: half that window or more has run since cover fell away
      value: the marketplace's late-restoration rate
    - when: less than half that window has run and no money stands owed to the host
      value: the fee in full
    baseline:
      lapse_rate: '1.0'
    evidence:
    - date
    cross_difficulty: null
  - id: uncovered_period_measure
    effect: method
    decides: period_charge
    bindings:
    - accepted_claims_12m
    - period_charge
    ladder:
    - when: the enrolment went without cover for thirty days or more and no claim has been accepted on it in the
        twelve months before
      method: the period without cover is measured in whole months of thirty days and each month is charged at a
        tenth of the plan's reinstatement fee
    - when: the enrolment went without cover for thirty days or more and a claim has been accepted on it in that
        period
      method: the period is measured in whole weeks of seven days and each week is charged at a fortieth of that
        fee
    - when: the enrolment went without cover for fewer than thirty days
      method: no charge is made for the period
    baseline:
      period_charge: '0.0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: claim_frequency_loading
    effect: parameter
    decides: standing_loading
    bindings:
    - claims_accepted_for_standing
    - standing_loading
    ladder:
    - when: the claims accepted on the enrolment in the twelve months before reach the number the plan allows before
        cover is suspended
      value: the marketplace's high-frequency loading
    - when: they reach the number the plan allows before the enrolment goes in front of a reviewer but not the number
        before suspension
      value: the review loading
    - when: they reach neither
      value: no loading is carried on that account
    baseline:
      standing_loading: '1.0'
    evidence:
    - history
    cross_difficulty: null
  - id: vehicle_verification_rate
    effect: parameter
    decides: vehicle_rate
    bindings:
    - passed_inspections_12m
    - listing_state
    - vehicle_rate
    ladder:
    - when: a passed inspection stands on the vehicle in the twelve months before and its listing is live on the
        marketplace
      value: the marketplace's verified-vehicle rate
    - when: a passed inspection stands in that period and the listing is not live
      value: the marketplace's unlisted-vehicle rate
    - when: no passed inspection stands in that period
      value: no rate is applied on that account
    baseline:
      vehicle_rate: '1.0'
    evidence:
    - cross_category
    cross_difficulty: listings
  - id: care_standing_rate
    effect: parameter
    decides: care_rate
    bindings:
    - care_plan_state
    - workshop_visits_6m
    - care_rate
    ladder:
    - when: the vehicle carries an active care plan and a workshop visit stands on it in the six months before
      value: the marketplace's serviced-vehicle rate
    - when: the vehicle carries an active care plan and no workshop visit stands in that period
      value: the marketplace's unserviced-plan rate
    - when: the vehicle carries no active care plan
      value: no rate is applied on that account
    baseline:
      care_rate: '1.0'
    evidence:
    - cross_category
    - history
    cross_difficulty: service
  - id: settlement_risk_loading
    effect: parameter
    decides: settlement_loading
    bindings:
    - returned_transfers_12m
    - payout_stop
    - settlement_loading
    ladder:
    - when: a transfer to the host has been returned unpaid in the twelve months before and money is currently stopped
        on the host's payout account
      value: the marketplace's settlement-risk loading
    - when: a transfer has been returned unpaid in that period and no money is stopped on the account
      value: the marketplace's returned-transfer loading
    - when: no transfer has been returned in that period
      value: no loading is carried on that account
    baseline:
      settlement_loading: '1.0'
    evidence:
    - cross_category
    - history
    cross_difficulty: payouts
  baseline:
    rule: Cover that has fallen away is put back into force on a charge the host carries, and cover then runs again
      from the day the restoration is recorded. The charge for restoring cover is the reinstatement fee the plan
      publishes, carried in full, with nothing added for the period the enrolment went without cover and nothing
      taken off for the standing of the vehicle or the host. The charge is rounded half up to two decimal places
      once, on the final result, and never at an intermediate step. Every figure the plan publishes, its reinstatement
      fee, its reinstatement window and the numbers of claims it allows before review and before suspension among
      them, is read from the plan the enrolment is written on.
    params:
    - reinstatement_fee_amount
    - reinstatement_window_days
    - claims_per_year_before_review
    - claims_per_year_before_suspension
  inputs:
    history:
    - table: hostplan_claims
      aggregate: count
      within_months: 12
      filters:
        event_type: hostplan_claim_appraised
    - category: listings
      table: listings_inspections
      aggregate: count
      within_months: 12
      filters:
        event_type: listings_inspection_completed
    - category: service
      table: service_visits
      aggregate: count
      within_months: 6
      filters: {}
    - category: payouts
      table: payouts_ledger
      aggregate: count
      within_months: 12
      filters:
        event_type: payouts_transfer_returned
    cross_category:
    - listings
    - service
    - payouts
- id: hostplan_ext_repair_supplement
  base_policy_refs:
  - hostplan_evt_appraisal
  overwrite: []
  trigger: on_request
  subject:
  - hostplan_supplement_added
  computes: supplement_amount
  target_tool: record_repair_supplement_1a6beabe
  params:
    supmax_s90: 15
    supmax_s85: 20
    supmax_s80: 25
    supmax_s75: 30
    supmax_s70: 35
    supmax_s60: 40
    supwin_s90: 14
    supwin_s85: 21
    supwin_s80: 30
    supwin_s75: 45
    supwin_s70: 60
    supwin_s60: 90
    full_partner_rate: 1.0
    mixed_network_rate: 0.94
    unmanaged_repair_rate: 0.86
    pending_recovery_share: 0.95
    no_fault_share: 0.85
    late_arrears_share: 0.85
    late_notice_share: 0.9
    unreserved_share: 0.95
    stopped_account_share: 0.88
    post_loss_mileage_mark: 500
    driven_since_share: 0.9
    laid_up_share: 0.95
  rule: 'Cost found after a loss has been appraised is added to the claim that settled it rather than opened as
    a fresh claim. Further cost is not added to a claim before the cover the loss was settled under stands in force
    again. The further cost accepted on a claim is the work the workshop has invoiced on the vehicle in the three
    months before, accepted at the marketplace''s unmanaged-repair rate with nothing taken off for how the loss
    was settled, how late the cost is brought, what the host''s payout account holds in reserve or how far the vehicle
    has been driven since, and held to the plan''s supplement ceiling taken as its published share of the largest
    appraisal standing on the enrolment. The further cost is rounded half up to two decimal places once, on the
    final result, and the ceiling is applied to that rounded figure. Where the vehicle carries an active care plan
    and two or more workshop visits on it stand in the three months before, the work counted is what the workshop
    has invoiced on the vehicle in the six months before; where the vehicle carries an active care plan and fewer
    than two workshop visits stand in that period, the work counted is the largest single invoice the workshop has
    raised on the vehicle; where the vehicle carries no active care plan, the work counted is what the workshop
    has invoiced in the three months before. Where two or more workshop visits on the vehicle in the three months
    before were carried out in the partner network, the cost is accepted at the full partner-network rate; where
    exactly one visit in that period was carried out in the partner network, it is accepted at the marketplace''s
    mixed-network rate; where none was, it is accepted at the marketplace''s unmanaged-repair rate. Where the most
    recent appraisal standing on the enrolment found the guest at fault and a recovery stands on the enrolment in
    the six months before, the further cost is accepted in full; where that appraisal found the guest at fault and
    no recovery stands in that period, it is accepted at the marketplace''s pending-recovery share; where that appraisal
    found anyone other than the guest responsible, it is accepted at the marketplace''s no-fault share. Where the
    further cost is brought in the second half of the plan''s supplement window, counted from the day of the most
    recent appraisal standing on the enrolment, and a share stands unpaid on the enrolment, it is accepted at the
    marketplace''s late-arrears share; where it is brought in the second half of that window and nothing stands
    unpaid, it is accepted at the marketplace''s late-notice share; where it is brought in the first half of that
    window, it is accepted in full. Where the reserves standing on the host''s payout account are below everything
    the appraisals on the enrolment have valued and the account is active, the further cost is accepted at the marketplace''s
    unreserved share, the marketplace''s own provision being short of what it has already accepted; where the account
    is not active, it is accepted at the marketplace''s stopped-account share; where those reserves are at least
    everything those appraisals have valued and the account is active, nothing is taken off on that account. Where
    the odometer standing on the listing is more than the marketplace''s post-loss mileage mark above the highest
    reading taken at a workshop visit and the listing is live on the marketplace, the further cost is accepted at
    the marketplace''s driven-since share; where it is more than that mark above and the listing is not live, it
    is accepted at the marketplace''s laid-up share; where it is not more than that mark above, it is accepted in
    full. The order is fixed: the work counted is taken first at the repair rate the network record calls for, the
    shares for the fault finding, for how late the cost is brought, for the reserves held and for the distance driven
    since the last visit are then applied one after another to the figure each step leaves, and the plan''s supplement
    ceiling is applied to the rounded result last. Every figure the plan publishes, its supplement ceiling and its
    supplement window among them, is read from the plan the enrolment is written on.'
  prerequisite:
  - problem: hostplan_ext_cover_restoration
    kind: state_gate
    gate: hostplan_enrollments.status
    form: state
    policy_source: Further cost is not added to a claim before the cover the loss was settled under stands in force
      again.
    condition: The enrolment the claim was made under stands in the active state with no ground recorded against
      it.
    resolved_by: restore_protection_cover_3adbf459
    effect: The enrolment moves out of the lapsed state into the active state, so the cover the loss was settled
      under stands in force again and further cost may be added to the claim.
  cross_category:
  - category: service
    as: history
    reads:
    - status
    - service_visits.invoice_amount
    - service_visits.shop_channel
    - service_visits.visit_date
    - service_visits.odometer_reading
    note: The workshop record decides the work counted, the repair rate and the reading the distance driven since
      is measured from.
  - category: payouts
    as: branch
    reads:
    - status
    - reserve_balance
    note: The reserves standing on the host's payout account and its state decide the share the further cost is
      accepted at.
  - category: listings
    as: branch
    reads:
    - status
    - odometer_miles
    note: The listing's odometer and state decide the share taken for the distance driven since the last workshop
      visit.
  compute:
  - plan_supplement_share: K('supmax_s90') if F('protection_plan_name') == 'Keyturn Shield 90 Host Plan' else (K('supmax_s85')
      if F('protection_plan_name') == 'Keyturn Shield 85 Host Plan' else (K('supmax_s80') if F('protection_plan_name')
      == 'Keyturn Shield 80 Host Plan' else (K('supmax_s75') if F('protection_plan_name') == 'Keyturn Shield 75
      Host Plan' else (K('supmax_s70') if F('protection_plan_name') == 'Keyturn Shield 70 Host Plan' else (K('supmax_s60'))))))
  - plan_supplement_window: K('supwin_s90') if F('protection_plan_name') == 'Keyturn Shield 90 Host Plan' else (K('supwin_s85')
      if F('protection_plan_name') == 'Keyturn Shield 85 Host Plan' else (K('supwin_s80') if F('protection_plan_name')
      == 'Keyturn Shield 80 Host Plan' else (K('supwin_s75') if F('protection_plan_name') == 'Keyturn Shield 75
      Host Plan' else (K('supwin_s70') if F('protection_plan_name') == 'Keyturn Shield 70 Host Plan' else (K('supwin_s60'))))))
  - largest_appraisal: MAX('hostplan_claims','appraisal_amount', event_type='hostplan_claim_appraised')
  - supplement_ceiling: largest_appraisal * plan_supplement_share / 100
  - care_plan_state: CFIELD('service','status', vehicle_id=F('vehicle_id'))
  - visits_3m: XCOUNT('service','service_visits', within_months=3, date_field='visit_date', vehicle_id=F('vehicle_id'))
  - work_counted: XSUM('service','service_visits','invoice_amount', within_months=6, date_field='visit_date', vehicle_id=F('vehicle_id'))
      if (care_plan_state == 'active' and visits_3m >= 2) else (XMAX('service','service_visits','invoice_amount',
      vehicle_id=F('vehicle_id')) if (care_plan_state == 'active' and visits_3m < 2) else XSUM('service','service_visits','invoice_amount',
      within_months=3, date_field='visit_date', vehicle_id=F('vehicle_id')))
  - partner_visits_counted: XCOUNT('service','service_visits', within_months=3, date_field='visit_date', vehicle_id=F('vehicle_id'),
      shop_channel='partner_network')
  - repair_rate: K('full_partner_rate') if partner_visits_counted >= 2 else (K('mixed_network_rate') if partner_visits_counted
      == 1 else K('unmanaged_repair_rate'))
  - settling_finding: LATEST('hostplan_claims','liability_finding', date_field='claim_date', event_type='hostplan_claim_appraised')
  - recoveries_6m: COUNT('hostplan_claims', within_months=6, date_field='claim_date', event_type='hostplan_recovery_received')
  - fault_share: 1.0 if (settling_finding == 'guest_at_fault' and recoveries_6m >= 1) else (K('pending_recovery_share')
      if (settling_finding == 'guest_at_fault' and recoveries_6m < 1) else K('no_fault_share'))
  - days_since_appraisal: DAYS(LATEST('hostplan_claims','claim_date', date_field='claim_date', event_type='hostplan_claim_appraised'),
      NOW)
  - unpaid_share_standing: F('liability_balance_due')
  - late_share: K('late_arrears_share') if (days_since_appraisal * 2 > plan_supplement_window and unpaid_share_standing
      > 0) else (K('late_notice_share') if (days_since_appraisal * 2 > plan_supplement_window and unpaid_share_standing
      <= 0) else 1.0)
  - appraised_total: SUM('hostplan_claims','amount_delta', event_type='hostplan_claim_appraised')
  - payout_reserves: CFIELD('payouts','reserve_balance')
  - payout_state: CFIELD('payouts','status')
  - reserve_share: K('unreserved_share') if (payout_reserves < appraised_total and payout_state == 'active') else
      (K('stopped_account_share') if (payout_state != 'active') else 1.0)
  - listing_odometer: CFIELD('listings','odometer_miles', vehicle_id=F('vehicle_id'))
  - last_visit_reading: XMAX('service','service_visits','odometer_reading', vehicle_id=F('vehicle_id'))
  - listing_state: CFIELD('listings','status', vehicle_id=F('vehicle_id'))
  - driven_share: K('driven_since_share') if (listing_odometer - last_visit_reading > K('post_loss_mileage_mark')
      and listing_state == 'listed') else (K('laid_up_share') if (listing_odometer - last_visit_reading > K('post_loss_mileage_mark')
      and listing_state != 'listed') else 1.0)
  - result: MN(RND(work_counted * repair_rate * fault_share * late_share * reserve_share * driven_share, 2), supplement_ceiling)
  compute_basis:
    plan_supplement_share: Every figure the plan publishes, its supplement ceiling and its supplement window among
      them, is read from the plan the enrolment is written on.
    plan_supplement_window: Every figure the plan publishes, its supplement ceiling and its supplement window among
      them, is read from the plan the enrolment is written on.
    largest_appraisal: The further cost accepted on a claim is the work the workshop has invoiced on the vehicle
      in the three months before, accepted at the marketplace's unmanaged-repair rate with nothing taken off for
      how the loss was settled, how late the cost is brought, what the host's payout account holds in reserve or
      how far the vehicle has been driven since, and held to the plan's supplement ceiling taken as its published
      share of the largest appraisal standing on the enrolment.
    supplement_ceiling: The further cost accepted on a claim is the work the workshop has invoiced on the vehicle
      in the three months before, accepted at the marketplace's unmanaged-repair rate with nothing taken off for
      how the loss was settled, how late the cost is brought, what the host's payout account holds in reserve or
      how far the vehicle has been driven since, and held to the plan's supplement ceiling taken as its published
      share of the largest appraisal standing on the enrolment.
    care_plan_state: Where the vehicle carries an active care plan and two or more workshop visits on it stand in
      the three months before, the work counted is what the workshop has invoiced on the vehicle in the six months
      before; where the vehicle carries an active care plan and fewer than two workshop visits stand in that period,
      the work counted is the largest single invoice the workshop has raised on the vehicle; where the vehicle carries
      no active care plan, the work counted is what the workshop has invoiced in the three months before.
    visits_3m: Where the vehicle carries an active care plan and two or more workshop visits on it stand in the
      three months before, the work counted is what the workshop has invoiced on the vehicle in the six months before;
      where the vehicle carries an active care plan and fewer than two workshop visits stand in that period, the
      work counted is the largest single invoice the workshop has raised on the vehicle; where the vehicle carries
      no active care plan, the work counted is what the workshop has invoiced in the three months before.
    work_counted: Where the vehicle carries an active care plan and two or more workshop visits on it stand in the
      three months before, the work counted is what the workshop has invoiced on the vehicle in the six months before;
      where the vehicle carries an active care plan and fewer than two workshop visits stand in that period, the
      work counted is the largest single invoice the workshop has raised on the vehicle; where the vehicle carries
      no active care plan, the work counted is what the workshop has invoiced in the three months before.
    partner_visits_counted: Where two or more workshop visits on the vehicle in the three months before were carried
      out in the partner network, the cost is accepted at the full partner-network rate; where exactly one visit
      in that period was carried out in the partner network, it is accepted at the marketplace's mixed-network rate;
      where none was, it is accepted at the marketplace's unmanaged-repair rate.
    repair_rate: Where two or more workshop visits on the vehicle in the three months before were carried out in
      the partner network, the cost is accepted at the full partner-network rate; where exactly one visit in that
      period was carried out in the partner network, it is accepted at the marketplace's mixed-network rate; where
      none was, it is accepted at the marketplace's unmanaged-repair rate.
    settling_finding: Where the most recent appraisal standing on the enrolment found the guest at fault and a recovery
      stands on the enrolment in the six months before, the further cost is accepted in full; where that appraisal
      found the guest at fault and no recovery stands in that period, it is accepted at the marketplace's pending-recovery
      share; where that appraisal found anyone other than the guest responsible, it is accepted at the marketplace's
      no-fault share.
    recoveries_6m: Where the most recent appraisal standing on the enrolment found the guest at fault and a recovery
      stands on the enrolment in the six months before, the further cost is accepted in full; where that appraisal
      found the guest at fault and no recovery stands in that period, it is accepted at the marketplace's pending-recovery
      share; where that appraisal found anyone other than the guest responsible, it is accepted at the marketplace's
      no-fault share.
    fault_share: Where the most recent appraisal standing on the enrolment found the guest at fault and a recovery
      stands on the enrolment in the six months before, the further cost is accepted in full; where that appraisal
      found the guest at fault and no recovery stands in that period, it is accepted at the marketplace's pending-recovery
      share; where that appraisal found anyone other than the guest responsible, it is accepted at the marketplace's
      no-fault share.
    days_since_appraisal: Where the further cost is brought in the second half of the plan's supplement window,
      counted from the day of the most recent appraisal standing on the enrolment, and a share stands unpaid on
      the enrolment, it is accepted at the marketplace's late-arrears share; where it is brought in the second half
      of that window and nothing stands unpaid, it is accepted at the marketplace's late-notice share; where it
      is brought in the first half of that window, it is accepted in full.
    unpaid_share_standing: Where the further cost is brought in the second half of the plan's supplement window,
      counted from the day of the most recent appraisal standing on the enrolment, and a share stands unpaid on
      the enrolment, it is accepted at the marketplace's late-arrears share; where it is brought in the second half
      of that window and nothing stands unpaid, it is accepted at the marketplace's late-notice share; where it
      is brought in the first half of that window, it is accepted in full.
    late_share: Where the further cost is brought in the second half of the plan's supplement window, counted from
      the day of the most recent appraisal standing on the enrolment, and a share stands unpaid on the enrolment,
      it is accepted at the marketplace's late-arrears share; where it is brought in the second half of that window
      and nothing stands unpaid, it is accepted at the marketplace's late-notice share; where it is brought in the
      first half of that window, it is accepted in full.
    appraised_total: Where the reserves standing on the host's payout account are below everything the appraisals
      on the enrolment have valued and the account is active, the further cost is accepted at the marketplace's
      unreserved share, the marketplace's own provision being short of what it has already accepted; where the account
      is not active, it is accepted at the marketplace's stopped-account share; where those reserves are at least
      everything those appraisals have valued and the account is active, nothing is taken off on that account.
    payout_reserves: Where the reserves standing on the host's payout account are below everything the appraisals
      on the enrolment have valued and the account is active, the further cost is accepted at the marketplace's
      unreserved share, the marketplace's own provision being short of what it has already accepted; where the account
      is not active, it is accepted at the marketplace's stopped-account share; where those reserves are at least
      everything those appraisals have valued and the account is active, nothing is taken off on that account.
    payout_state: Where the reserves standing on the host's payout account are below everything the appraisals on
      the enrolment have valued and the account is active, the further cost is accepted at the marketplace's unreserved
      share, the marketplace's own provision being short of what it has already accepted; where the account is not
      active, it is accepted at the marketplace's stopped-account share; where those reserves are at least everything
      those appraisals have valued and the account is active, nothing is taken off on that account.
    reserve_share: Where the reserves standing on the host's payout account are below everything the appraisals
      on the enrolment have valued and the account is active, the further cost is accepted at the marketplace's
      unreserved share, the marketplace's own provision being short of what it has already accepted; where the account
      is not active, it is accepted at the marketplace's stopped-account share; where those reserves are at least
      everything those appraisals have valued and the account is active, nothing is taken off on that account.
    listing_odometer: Where the odometer standing on the listing is more than the marketplace's post-loss mileage
      mark above the highest reading taken at a workshop visit and the listing is live on the marketplace, the further
      cost is accepted at the marketplace's driven-since share; where it is more than that mark above and the listing
      is not live, it is accepted at the marketplace's laid-up share; where it is not more than that mark above,
      it is accepted in full.
    last_visit_reading: Where the odometer standing on the listing is more than the marketplace's post-loss mileage
      mark above the highest reading taken at a workshop visit and the listing is live on the marketplace, the further
      cost is accepted at the marketplace's driven-since share; where it is more than that mark above and the listing
      is not live, it is accepted at the marketplace's laid-up share; where it is not more than that mark above,
      it is accepted in full.
    listing_state: Where the odometer standing on the listing is more than the marketplace's post-loss mileage mark
      above the highest reading taken at a workshop visit and the listing is live on the marketplace, the further
      cost is accepted at the marketplace's driven-since share; where it is more than that mark above and the listing
      is not live, it is accepted at the marketplace's laid-up share; where it is not more than that mark above,
      it is accepted in full.
    driven_share: Where the odometer standing on the listing is more than the marketplace's post-loss mileage mark
      above the highest reading taken at a workshop visit and the listing is live on the marketplace, the further
      cost is accepted at the marketplace's driven-since share; where it is more than that mark above and the listing
      is not live, it is accepted at the marketplace's laid-up share; where it is not more than that mark above,
      it is accepted in full.
    result: 'The order is fixed: the work counted is taken first at the repair rate the network record calls for,
      the shares for the fault finding, for how late the cost is brought, for the reserves held and for the distance
      driven since the last visit are then applied one after another to the figure each step leaves, and the plan''s
      supplement ceiling is applied to the rounded result last. The further cost is rounded half up to two decimal
      places once, on the final result, and the ceiling is applied to that rounded figure.'
  factors:
  - id: work_counted_window
    effect: method
    decides: work_counted
    bindings:
    - care_plan_state
    - visits_3m
    - work_counted
    ladder:
    - when: the vehicle carries an active care plan and two or more workshop visits on it stand in the three months
        before
      method: the work counted is what the workshop has invoiced on the vehicle in the six months before
    - when: the vehicle carries an active care plan and fewer than two workshop visits stand in that period
      method: the work counted is the largest single invoice the workshop has raised on the vehicle
    - when: the vehicle carries no active care plan
      method: the work counted is what the workshop has invoiced in the three months before
    baseline:
      work_counted: XSUM('service','service_visits','invoice_amount', within_months=3, date_field='visit_date',
        vehicle_id=F('vehicle_id'))
    evidence:
    - cross_category
    - history
    cross_difficulty: service
  - id: network_repair_rate
    effect: parameter
    decides: repair_rate
    bindings:
    - partner_visits_counted
    - repair_rate
    ladder:
    - when: two or more workshop visits on the vehicle in the three months before were carried out in the partner
        network
      value: the full partner-network rate
    - when: exactly one visit in that period was carried out in the partner network
      value: the marketplace's mixed-network rate
    - when: none was
      value: the marketplace's unmanaged-repair rate
    baseline:
      repair_rate: K('unmanaged_repair_rate')
    evidence:
    - cross_category
    cross_difficulty: service
  - id: settling_fault_share
    effect: parameter
    decides: fault_share
    bindings:
    - settling_finding
    - recoveries_6m
    - fault_share
    ladder:
    - when: the most recent appraisal standing on the enrolment found the guest at fault and a recovery stands on
        the enrolment in the six months before
      value: the further cost is accepted in full
    - when: that appraisal found the guest at fault and no recovery stands in that period
      value: the marketplace's pending-recovery share
    - when: that appraisal found anyone other than the guest responsible
      value: the marketplace's no-fault share
    baseline:
      fault_share: '1.0'
    evidence:
    - history
    cross_difficulty: null
  - id: late_notice_share
    effect: parameter
    decides: late_share
    bindings:
    - days_since_appraisal
    - unpaid_share_standing
    - late_share
    ladder:
    - when: the further cost is brought in the second half of the plan's supplement window, counted from the day
        of the most recent appraisal standing on the enrolment, and a share stands unpaid on the enrolment
      value: the marketplace's late-arrears share
    - when: it is brought in the second half of that window and nothing stands unpaid
      value: the marketplace's late-notice share
    - when: it is brought in the first half of that window
      value: it is accepted in full
    baseline:
      late_share: '1.0'
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: reserved_settlement_share
    effect: parameter
    decides: reserve_share
    bindings:
    - appraised_total
    - payout_reserves
    - payout_state
    - reserve_share
    ladder:
    - when: the reserves standing on the host's payout account are below everything the appraisals on the enrolment
        have valued and the account is active
      value: the marketplace's unreserved share
    - when: the account is not active
      value: the marketplace's stopped-account share
    - when: those reserves are at least everything those appraisals have valued and the account is active
      value: nothing is taken off on that account
    baseline:
      reserve_share: '1.0'
    evidence:
    - cross_category
    cross_difficulty: payouts
  - id: driven_since_share
    effect: parameter
    decides: driven_share
    bindings:
    - listing_odometer
    - last_visit_reading
    - listing_state
    - driven_share
    ladder:
    - when: the odometer standing on the listing is more than the marketplace's post-loss mileage mark above the
        highest reading taken at a workshop visit and the listing is live on the marketplace
      value: the marketplace's driven-since share
    - when: it is more than that mark above and the listing is not live
      value: the marketplace's laid-up share
    - when: it is not more than that mark above
      value: it is accepted in full
    baseline:
      driven_share: '1.0'
    evidence:
    - cross_category
    cross_difficulty: listings
  baseline:
    rule: Cost found after a loss has been appraised is added to the claim that settled it rather than opened as
      a fresh claim. The further cost accepted on a claim is the work the workshop has invoiced on the vehicle in
      the three months before, accepted at the marketplace's unmanaged-repair rate with nothing taken off for how
      the loss was settled, how late the cost is brought, what the host's payout account holds in reserve or how
      far the vehicle has been driven since, and held to the plan's supplement ceiling taken as its published share
      of the largest appraisal standing on the enrolment. The further cost is rounded half up to two decimal places
      once, on the final result, and the ceiling is applied to that rounded figure. Every figure the plan publishes,
      its supplement ceiling and its supplement window among them, is read from the plan the enrolment is written
      on.
    params:
    - supplement_max_percent
    - supplement_window_days
    - unmanaged_repair_rate
  inputs:
    history:
    - table: hostplan_claims
      aggregate: max
      field: appraisal_amount
      filters:
        event_type: hostplan_claim_appraised
    - table: hostplan_claims
      aggregate: count
      within_months: 6
      filters:
        event_type: hostplan_recovery_received
    - category: service
      table: service_visits
      aggregate: sum
      field: invoice_amount
      within_months: 3
      filters: {}
    cross_category:
    - service
    - payouts
    - listings
- id: hostplan_ext_claim_withdrawal
  base_policy_refs:
  - hostplan_evt_claim_closure
  overwrite: []
  trigger: on_request
  subject:
  - hostplan_claim_withdrawn
  computes: released_amount
  target_tool: withdraw_own_claim_4cdcc89b
  params:
    swin3_s90: 14
    swin3_s85: 21
    swin3_s80: 30
    swin3_s75: 45
    swin3_s70: 60
    swin3_s60: 90
    rev3_s90: 2
    rev3_s85: 2
    rev3_s80: 3
    rev3_s75: 3
    rev3_s70: 4
    rev3_s60: 5
    overlapping_claims_share: 0.93
    older_overlap_share: 0.97
    arrears_release_share: 0.95
    reviewed_standing_share: 0.98
    late_withdrawal_share: 0.96
    settled_withdrawal_share: 0.98
    incomplete_record_share: 0.93
    closed_record_share: 0.96
  rule: 'A host may take their own claim back off the enrolment, and doing so releases money that stands booked
    as owed to them on the enrolment''s claims. What a withdrawal releases is the whole of the money the claims
    on the enrolment have booked as owed to the host and not yet paid out, released in full with nothing retained
    for the standing of the enrolment, for how late the withdrawal comes, for claims on the enrolment that overlap
    the one being withdrawn or for the state of the reporting record, and rounded half up to two decimal places
    once, at the end. Where two or more appraisals stand on the enrolment in the two months before and money stands
    booked as owed to the host, the release is measured as that money less the largest appraisal standing, the loss
    being settled once under the appraisal that values it in full; where exactly one appraisal stands in that period
    and money stands booked as owed, the release is measured as the money that appraisal booked; in every other
    case the release is measured as the whole of the money standing booked as owed. Where two or more claims on
    the enrolment name the same kind of loss as the one most recently opened and two or more claims were opened
    on the enrolment in the two months before, the release is taken at the marketplace''s overlapping-claims share,
    what is held back standing on the loss until it is settled which claim covers what; where two or more name the
    same kind of loss and fewer than two claims were opened in the two months before, it is taken at the marketplace''s
    older-overlap share; where fewer than two name the same kind of loss, nothing is held back on that account.
    Where the claims accepted on the enrolment in the twelve months before reach the number the plan allows before
    the enrolment goes in front of a reviewer and a share stands unpaid on it, the release is taken at the marketplace''s
    arrears release share; where they reach that number and nothing stands unpaid, it is taken at the marketplace''s
    reviewed-standing share; where they do not reach that number, nothing is retained on that account. Where the
    latest appraisal standing on the enrolment was recorded more than half the plan''s supplement window ago and
    money stands booked as owed to the host, the release is taken at the marketplace''s late-withdrawal share; where
    it was recorded more than half that window ago and no money stands booked as owed, it is taken at the marketplace''s
    settled-withdrawal share; where it was recorded within half that window, nothing is retained on that account.
    Where a damage report on the enrolment was closed incomplete in the twelve months before and money stands booked
    as owed to the host, the release is taken at the marketplace''s incomplete-record share; where such a report
    was closed incomplete in that period and no money stands booked as owed, it is taken at the marketplace''s closed-record
    share; where no report was closed incomplete in that period, nothing is retained on that account. The order
    is fixed: the money released is measured first, and the shares for the claims that overlap it, for the standing
    of the enrolment, for how late the withdrawal comes and for the reporting record are then applied one after
    another to the figure each step leaves; what is not released stays owed on the enrolment. Every figure the plan
    publishes, its supplement window and the number of claims it allows before review among them, is read from the
    plan the enrolment is written on.'
  prerequisite: []
  cross_category: []
  compute:
  - plan_supplement_window: K('swin3_s90') if F('protection_plan_name') == 'Keyturn Shield 90 Host Plan' else (K('swin3_s85')
      if F('protection_plan_name') == 'Keyturn Shield 85 Host Plan' else (K('swin3_s80') if F('protection_plan_name')
      == 'Keyturn Shield 80 Host Plan' else (K('swin3_s75') if F('protection_plan_name') == 'Keyturn Shield 75 Host
      Plan' else (K('swin3_s70') if F('protection_plan_name') == 'Keyturn Shield 70 Host Plan' else (K('swin3_s60'))))))
  - plan_review_count: K('rev3_s90') if F('protection_plan_name') == 'Keyturn Shield 90 Host Plan' else (K('rev3_s85')
      if F('protection_plan_name') == 'Keyturn Shield 85 Host Plan' else (K('rev3_s80') if F('protection_plan_name')
      == 'Keyturn Shield 80 Host Plan' else (K('rev3_s75') if F('protection_plan_name') == 'Keyturn Shield 75 Host
      Plan' else (K('rev3_s70') if F('protection_plan_name') == 'Keyturn Shield 70 Host Plan' else (K('rev3_s60'))))))
  - appraised_booked: SUM('hostplan_claims','amount_delta', event_type='hostplan_claim_appraised')
  - paid_back: SUM('hostplan_claims','amount_delta', event_type='hostplan_reimbursement_paid')
  - money_booked: appraised_booked + paid_back
  - largest_appraisal: MAX('hostplan_claims','appraisal_amount', event_type='hostplan_claim_appraised')
  - latest_appraisal_booked: LATEST('hostplan_claims','amount_delta', date_field='claim_date', event_type='hostplan_claim_appraised')
  - appraisals_in_window: COUNT('hostplan_claims', within_months=2, date_field='claim_date', event_type='hostplan_claim_appraised')
  - release_basis: money_booked - largest_appraisal if (appraisals_in_window >= 2 and money_booked > 0) else (latest_appraisal_booked
      if (appraisals_in_window == 1 and money_booked > 0) else money_booked)
  - same_kind_filings: COUNT('hostplan_claims', event_type='hostplan_claim_filed', damage_category=LATEST('hostplan_claims','damage_category',
      date_field='claim_date', event_type='hostplan_claim_filed'))
  - filings_2m: COUNT('hostplan_claims', within_months=2, date_field='claim_date', event_type='hostplan_claim_filed')
  - overlap_share: K('overlapping_claims_share') if (same_kind_filings >= 2 and filings_2m >= 2) else (K('older_overlap_share')
      if (same_kind_filings >= 2 and filings_2m < 2) else 1.0)
  - accepted_claims_12m: COUNT('hostplan_claims', within_months=12, date_field='claim_date', event_type='hostplan_claim_appraised')
  - unpaid_standing: F('liability_balance_due')
  - standing_share: K('arrears_release_share') if (accepted_claims_12m >= plan_review_count and unpaid_standing
      > 0) else (K('reviewed_standing_share') if (accepted_claims_12m >= plan_review_count and unpaid_standing <=
      0) else 1.0)
  - days_since_latest_appraisal: DAYS(LATEST('hostplan_claims','claim_date', date_field='claim_date', event_type='hostplan_claim_appraised'),
      NOW)
  - late_share: K('late_withdrawal_share') if (days_since_latest_appraisal * 2 > plan_supplement_window and money_booked
      > 0) else (K('settled_withdrawal_share') if (days_since_latest_appraisal * 2 > plan_supplement_window and
      money_booked <= 0) else 1.0)
  - incomplete_reports_12m: COUNT('hostplan_claim_intake', within_months=12, date_field='reported_at', intake_status='closed_incomplete')
  - record_share: K('incomplete_record_share') if (incomplete_reports_12m >= 1 and money_booked > 0) else (K('closed_record_share')
      if (incomplete_reports_12m >= 1 and money_booked <= 0) else 1.0)
  - result: RND(release_basis * overlap_share * standing_share * late_share * record_share, 2)
  compute_basis:
    plan_supplement_window: Every figure the plan publishes, its supplement window and the number of claims it allows
      before review among them, is read from the plan the enrolment is written on.
    plan_review_count: Every figure the plan publishes, its supplement window and the number of claims it allows
      before review among them, is read from the plan the enrolment is written on.
    appraised_booked: What a withdrawal releases is the whole of the money the claims on the enrolment have booked
      as owed to the host and not yet paid out, released in full with nothing retained for the standing of the enrolment,
      for how late the withdrawal comes, for claims on the enrolment that overlap the one being withdrawn or for
      the state of the reporting record, and rounded half up to two decimal places once, at the end.
    paid_back: What a withdrawal releases is the whole of the money the claims on the enrolment have booked as owed
      to the host and not yet paid out, released in full with nothing retained for the standing of the enrolment,
      for how late the withdrawal comes, for claims on the enrolment that overlap the one being withdrawn or for
      the state of the reporting record, and rounded half up to two decimal places once, at the end.
    money_booked: What a withdrawal releases is the whole of the money the claims on the enrolment have booked as
      owed to the host and not yet paid out, released in full with nothing retained for the standing of the enrolment,
      for how late the withdrawal comes, for claims on the enrolment that overlap the one being withdrawn or for
      the state of the reporting record, and rounded half up to two decimal places once, at the end.
    largest_appraisal: Where two or more appraisals stand on the enrolment in the two months before and money stands
      booked as owed to the host, the release is measured as that money less the largest appraisal standing, the
      loss being settled once under the appraisal that values it in full; where exactly one appraisal stands in
      that period and money stands booked as owed, the release is measured as the money that appraisal booked; in
      every other case the release is measured as the whole of the money standing booked as owed.
    latest_appraisal_booked: Where two or more appraisals stand on the enrolment in the two months before and money
      stands booked as owed to the host, the release is measured as that money less the largest appraisal standing,
      the loss being settled once under the appraisal that values it in full; where exactly one appraisal stands
      in that period and money stands booked as owed, the release is measured as the money that appraisal booked;
      in every other case the release is measured as the whole of the money standing booked as owed.
    appraisals_in_window: Where two or more appraisals stand on the enrolment in the two months before and money
      stands booked as owed to the host, the release is measured as that money less the largest appraisal standing,
      the loss being settled once under the appraisal that values it in full; where exactly one appraisal stands
      in that period and money stands booked as owed, the release is measured as the money that appraisal booked;
      in every other case the release is measured as the whole of the money standing booked as owed.
    release_basis: Where two or more appraisals stand on the enrolment in the two months before and money stands
      booked as owed to the host, the release is measured as that money less the largest appraisal standing, the
      loss being settled once under the appraisal that values it in full; where exactly one appraisal stands in
      that period and money stands booked as owed, the release is measured as the money that appraisal booked; in
      every other case the release is measured as the whole of the money standing booked as owed.
    same_kind_filings: Where two or more claims on the enrolment name the same kind of loss as the one most recently
      opened and two or more claims were opened on the enrolment in the two months before, the release is taken
      at the marketplace's overlapping-claims share, what is held back standing on the loss until it is settled
      which claim covers what; where two or more name the same kind of loss and fewer than two claims were opened
      in the two months before, it is taken at the marketplace's older-overlap share; where fewer than two name
      the same kind of loss, nothing is held back on that account.
    filings_2m: Where two or more claims on the enrolment name the same kind of loss as the one most recently opened
      and two or more claims were opened on the enrolment in the two months before, the release is taken at the
      marketplace's overlapping-claims share, what is held back standing on the loss until it is settled which claim
      covers what; where two or more name the same kind of loss and fewer than two claims were opened in the two
      months before, it is taken at the marketplace's older-overlap share; where fewer than two name the same kind
      of loss, nothing is held back on that account.
    overlap_share: Where two or more claims on the enrolment name the same kind of loss as the one most recently
      opened and two or more claims were opened on the enrolment in the two months before, the release is taken
      at the marketplace's overlapping-claims share, what is held back standing on the loss until it is settled
      which claim covers what; where two or more name the same kind of loss and fewer than two claims were opened
      in the two months before, it is taken at the marketplace's older-overlap share; where fewer than two name
      the same kind of loss, nothing is held back on that account.
    accepted_claims_12m: Where the claims accepted on the enrolment in the twelve months before reach the number
      the plan allows before the enrolment goes in front of a reviewer and a share stands unpaid on it, the release
      is taken at the marketplace's arrears release share; where they reach that number and nothing stands unpaid,
      it is taken at the marketplace's reviewed-standing share; where they do not reach that number, nothing is
      retained on that account.
    unpaid_standing: Where the claims accepted on the enrolment in the twelve months before reach the number the
      plan allows before the enrolment goes in front of a reviewer and a share stands unpaid on it, the release
      is taken at the marketplace's arrears release share; where they reach that number and nothing stands unpaid,
      it is taken at the marketplace's reviewed-standing share; where they do not reach that number, nothing is
      retained on that account.
    standing_share: Where the claims accepted on the enrolment in the twelve months before reach the number the
      plan allows before the enrolment goes in front of a reviewer and a share stands unpaid on it, the release
      is taken at the marketplace's arrears release share; where they reach that number and nothing stands unpaid,
      it is taken at the marketplace's reviewed-standing share; where they do not reach that number, nothing is
      retained on that account.
    days_since_latest_appraisal: Where the latest appraisal standing on the enrolment was recorded more than half
      the plan's supplement window ago and money stands booked as owed to the host, the release is taken at the
      marketplace's late-withdrawal share; where it was recorded more than half that window ago and no money stands
      booked as owed, it is taken at the marketplace's settled-withdrawal share; where it was recorded within half
      that window, nothing is retained on that account.
    late_share: Where the latest appraisal standing on the enrolment was recorded more than half the plan's supplement
      window ago and money stands booked as owed to the host, the release is taken at the marketplace's late-withdrawal
      share; where it was recorded more than half that window ago and no money stands booked as owed, it is taken
      at the marketplace's settled-withdrawal share; where it was recorded within half that window, nothing is retained
      on that account.
    incomplete_reports_12m: Where a damage report on the enrolment was closed incomplete in the twelve months before
      and money stands booked as owed to the host, the release is taken at the marketplace's incomplete-record share;
      where such a report was closed incomplete in that period and no money stands booked as owed, it is taken at
      the marketplace's closed-record share; where no report was closed incomplete in that period, nothing is retained
      on that account.
    record_share: Where a damage report on the enrolment was closed incomplete in the twelve months before and money
      stands booked as owed to the host, the release is taken at the marketplace's incomplete-record share; where
      such a report was closed incomplete in that period and no money stands booked as owed, it is taken at the
      marketplace's closed-record share; where no report was closed incomplete in that period, nothing is retained
      on that account.
    result: 'The order is fixed: the money released is measured first, and the shares for the claims that overlap
      it, for the standing of the enrolment, for how late the withdrawal comes and for the reporting record are
      then applied one after another to the figure each step leaves; what is not released stays owed on the enrolment.'
  factors:
