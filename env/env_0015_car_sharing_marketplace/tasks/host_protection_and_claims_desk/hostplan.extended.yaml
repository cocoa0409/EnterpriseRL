- id: hostplan_ext_claim_opening
  base_policy_refs:
  - hostplan_evt_claim_intake
  overwrite: []
  trigger: on_request
  subject:
  - hostplan_claim_filed
  computes: claim_opened_amount
  target_tool: open_loss_claim_e6dccf7d
  params:
    glass_ceiling_s90: 750.0
    glass_ceiling_s85: 1000.0
    glass_ceiling_s80: 1500.0
    glass_ceiling_s75: 2000.0
    glass_ceiling_s70: 3000.0
    glass_ceiling_s60: 4500.0
    tyre_ceiling_s90: 600.0
    tyre_ceiling_s85: 900.0
    tyre_ceiling_s80: 1200.0
    tyre_ceiling_s75: 1800.0
    tyre_ceiling_s70: 2500.0
    tyre_ceiling_s60: 4000.0
    interior_ceiling_s90: 2500.0
    interior_ceiling_s85: 3500.0
    interior_ceiling_s80: 5000.0
    interior_ceiling_s75: 7500.0
    interior_ceiling_s70: 10000.0
    interior_ceiling_s60: 15000.0
    body_ceiling_s90: 12000.0
    body_ceiling_s85: 18000.0
    body_ceiling_s80: 26000.0
    body_ceiling_s75: 40000.0
    body_ceiling_s70: 60000.0
    body_ceiling_s60: 90000.0
    settled_cover_months: 24
    uncleared_defect_share: 0.2
    cleared_defect_share: 0.08
    provisioned_exposure_mark: 1000.0
    stopped_exposure_share: 0.75
    unprovisioned_exposure_share: 0.9
  rule: 'A claim is opened on an enrolment at a provisional figure, which is what the marketplace puts on the loss
    before anything is appraised. A claim is opened on a loss only after a damage report for that trip stands on
    the register carrying the number of photographs and documents the plan asks of it. The provisional figure starts
    from the ceiling the plan carries for damage to the body and paint of the vehicle. Where the most recent report
    on the register names a kind of loss for which the plan carries its own ceiling, that ceiling governs instead:
    the plan''s glass ceiling where the report names glass, the plan''s tyre and wheel ceiling where it names tyres
    and wheels, and the plan''s interior ceiling where it names the interior. That ceiling is what the claim is
    opened at, and the figure is rounded half up to two decimal places once, at the end. Where the enrolment has
    been in force for at least the marketplace''s settled-cover period and no claim has been accepted on it in the
    twenty-four months before, the enrolment''s reporting record is read over the twelve months before the report;
    where the enrolment has been in force for at least that period and a claim has been accepted on it in the twenty-four
    months before, the reporting record is read over the twenty-four months before the report; where the enrolment
    has been in force for less than that period, the reporting record is read over the whole life of the cover.
    Where four or more damage reports stand on the enrolment in the period the reporting record is read over, the
    ceiling for the kind of loss is taken at half; where two or three reports stand in that period, it is taken
    at three quarters; where fewer than two reports stand in that period, it is taken in full. Where a defect was
    recorded on the vehicle in the six months before and no passed inspection has been recorded on it since that
    defect, the uncleared-defect share is taken off; where a defect was recorded in that period and a passed inspection
    has been recorded on it since, the cleared-defect share is taken off; where no defect was recorded in that period,
    nothing is taken off for the condition the vehicle was already in. Where the reserves standing on the host''s
    payout account are below the marketplace''s provisioned-exposure mark and money is currently stopped on that
    account, the figure is opened at the stopped-exposure share; where those reserves are below that mark and no
    money is stopped on the account, it is opened at the unprovisioned-exposure share; where those reserves reach
    that mark, it is opened in full. Where a callout on the roadside cover the vehicle carries was completed in
    the month before the report and the vehicle was towed, the whole of the recovery billed on the completed callouts
    on that cover in that month is added; where a callout was completed on that cover in that month and the vehicle
    was not towed, half of the recovery billed on them in that month is added; where no callout was completed on
    that cover in that month, nothing is added for recovery. The order is fixed: the ceiling for the kind of loss
    is taken first at the share the reporting record calls for, the share for the condition the vehicle was already
    in is then taken off the figure that step leaves, the unprovisioned-exposure share is then applied to the figure
    that step leaves, and the recovery admitted is added to that result last; the provisional figure is rounded
    half up to two decimal places once, on that final result, and never at an intermediate step. Every figure the
    plan publishes, its ceilings for each kind of loss among them, is read from the plan the enrolment is written
    on.'
  prerequisite:
  - problem: hostplan_ext_damage_report_evidence
    kind: value_input
    gate: reported_damage_kind
    form: state
    policy_source: A claim is opened on a loss only after a damage report for that trip stands on the register carrying
      the number of photographs and documents the plan asks of it.
    condition: A damage report for the trip the loss happened on stands on the damage report register for the enrolment,
      routed to the protection team and carrying at least the number of photographs and documents the plan asks
      of it.
    resolved_by: lodge_damage_report_2cc23be4
    effect: The kind of loss named on the report standing on the register is what the ceiling the provisional figure
      starts from is read off, so the binding reported_damage_kind takes the kind that report names.
  cross_category:
  - category: listings
    as: history
    reads:
    - listings_inspections.event_type
    - listings_inspections.record_date
    - listings_inspections.inspection_outcome
    note: The vehicle's defect and inspection record decides the share taken off for the condition the vehicle was
      already in.
  - category: payouts
    as: branch
    reads:
    - reserve_balance
    - hold_reason
    note: The reserves standing on the host's payout account and whether money is stopped on it decide the share
      the provisional figure is opened at.
  - category: roadside
    as: history
    reads:
    - roadside_callouts.event_type
    - roadside_callouts.callout_date
    - roadside_callouts.tow_miles
    - roadside_callouts.callout_fee_amount
    note: The completed callouts billed on the roadside cover the vehicle carries in the month before decide how
      much of the recovery is added to the provisional figure.
  compute:
  - reported_damage_kind: LATEST('hostplan_claim_intake','damage_category', date_field='reported_at')
  - ceiling_glass: K('glass_ceiling_s90') if F('protection_plan_name') == 'Keyturn Shield 90 Host Plan' else (K('glass_ceiling_s85')
      if F('protection_plan_name') == 'Keyturn Shield 85 Host Plan' else (K('glass_ceiling_s80') if F('protection_plan_name')
      == 'Keyturn Shield 80 Host Plan' else (K('glass_ceiling_s75') if F('protection_plan_name') == 'Keyturn Shield
      75 Host Plan' else (K('glass_ceiling_s70') if F('protection_plan_name') == 'Keyturn Shield 70 Host Plan' else
      (K('glass_ceiling_s60'))))))
  - ceiling_tyres: K('tyre_ceiling_s90') if F('protection_plan_name') == 'Keyturn Shield 90 Host Plan' else (K('tyre_ceiling_s85')
      if F('protection_plan_name') == 'Keyturn Shield 85 Host Plan' else (K('tyre_ceiling_s80') if F('protection_plan_name')
      == 'Keyturn Shield 80 Host Plan' else (K('tyre_ceiling_s75') if F('protection_plan_name') == 'Keyturn Shield
      75 Host Plan' else (K('tyre_ceiling_s70') if F('protection_plan_name') == 'Keyturn Shield 70 Host Plan' else
      (K('tyre_ceiling_s60'))))))
  - ceiling_interior: K('interior_ceiling_s90') if F('protection_plan_name') == 'Keyturn Shield 90 Host Plan' else
      (K('interior_ceiling_s85') if F('protection_plan_name') == 'Keyturn Shield 85 Host Plan' else (K('interior_ceiling_s80')
      if F('protection_plan_name') == 'Keyturn Shield 80 Host Plan' else (K('interior_ceiling_s75') if F('protection_plan_name')
      == 'Keyturn Shield 75 Host Plan' else (K('interior_ceiling_s70') if F('protection_plan_name') == 'Keyturn
      Shield 70 Host Plan' else (K('interior_ceiling_s60'))))))
  - ceiling_body: K('body_ceiling_s90') if F('protection_plan_name') == 'Keyturn Shield 90 Host Plan' else (K('body_ceiling_s85')
      if F('protection_plan_name') == 'Keyturn Shield 85 Host Plan' else (K('body_ceiling_s80') if F('protection_plan_name')
      == 'Keyturn Shield 80 Host Plan' else (K('body_ceiling_s75') if F('protection_plan_name') == 'Keyturn Shield
      75 Host Plan' else (K('body_ceiling_s70') if F('protection_plan_name') == 'Keyturn Shield 70 Host Plan' else
      (K('body_ceiling_s60'))))))
  - kind_ceiling: ceiling_glass if reported_damage_kind == 'glass' else (ceiling_tyres if reported_damage_kind ==
      'tyres_wheels' else (ceiling_interior if reported_damage_kind == 'interior' else ceiling_body))
  - months_in_force: MONTHS(F('effective_date'), NOW)
  - accepted_claims_24m: COUNT('hostplan_claims', within_months=24, date_field='claim_date', event_type='hostplan_claim_appraised')
  - reporting_window_months: 12 if (months_in_force >= K('settled_cover_months') and accepted_claims_24m < 1) else
      (24 if (months_in_force >= K('settled_cover_months') and accepted_claims_24m >= 1) else None)
  - reports_in_window: COUNT('hostplan_claim_intake', within_months=reporting_window_months, date_field='reported_at')
  - provisional_share: 0.5 if reports_in_window >= 4 else (0.75 if reports_in_window >= 2 else 1.0)
  - defects_6m: XCOUNT('listings','listings_inspections', within_months=6, date_field='record_date', vehicle_id=F('vehicle_id'),
      event_type='listings_defect_reported')
  - latest_defect_date: XLATEST('listings','listings_inspections','record_date', date_field='record_date', vehicle_id=F('vehicle_id'),
      event_type='listings_defect_reported')
  - latest_pass_date: XLATEST('listings','listings_inspections','record_date', date_field='record_date', vehicle_id=F('vehicle_id'),
      event_type='listings_inspection_completed', inspection_outcome='passed')
  - preexisting_share: K('uncleared_defect_share') if (defects_6m >= 1 and latest_pass_date < latest_defect_date)
      else (K('cleared_defect_share') if (defects_6m >= 1 and latest_pass_date >= latest_defect_date) else 0.0)
  - payout_reserves: CFIELD('payouts','reserve_balance')
  - payout_stop: CFIELD('payouts','hold_reason')
  - exposure_share: K('stopped_exposure_share') if (payout_reserves < K('provisioned_exposure_mark') and payout_stop
      != 'none') else (K('unprovisioned_exposure_share') if (payout_reserves < K('provisioned_exposure_mark') and
      payout_stop == 'none') else 1.0)
  - callouts_1m: XCOUNT('roadside','roadside_callouts', within_months=1, date_field='callout_date', event_type='roadside_callout_completed')
  - towed_miles: XSUM('roadside','roadside_callouts','tow_miles', within_months=1, date_field='callout_date', event_type='roadside_callout_completed')
  - recovery_billed_1m: XSUM('roadside','roadside_callouts','callout_fee_amount', within_months=1, date_field='callout_date',
      event_type='roadside_callout_completed')
  - recovery_share: 1.0 if (callouts_1m >= 1 and towed_miles > 0) else (0.5 if (callouts_1m >= 1 and towed_miles
      <= 0) else 0.0)
  - recovery_addition: recovery_billed_1m * recovery_share
  - result: RND(kind_ceiling * provisional_share * (1 - preexisting_share) * exposure_share + recovery_addition,
      2)
  compute_basis:
    reported_damage_kind: 'Where the most recent report on the register names a kind of loss for which the plan
      carries its own ceiling, that ceiling governs instead: the plan''s glass ceiling where the report names glass,
      the plan''s tyre and wheel ceiling where it names tyres and wheels, and the plan''s interior ceiling where
      it names the interior.'
    ceiling_glass: Every figure the plan publishes, its ceilings for each kind of loss among them, is read from
      the plan the enrolment is written on.
    ceiling_tyres: Every figure the plan publishes, its ceilings for each kind of loss among them, is read from
      the plan the enrolment is written on.
    ceiling_interior: Every figure the plan publishes, its ceilings for each kind of loss among them, is read from
      the plan the enrolment is written on.
    ceiling_body: The provisional figure starts from the ceiling the plan carries for damage to the body and paint
      of the vehicle.
    kind_ceiling: 'Where the most recent report on the register names a kind of loss for which the plan carries
      its own ceiling, that ceiling governs instead: the plan''s glass ceiling where the report names glass, the
      plan''s tyre and wheel ceiling where it names tyres and wheels, and the plan''s interior ceiling where it
      names the interior.'
    months_in_force: Where the enrolment has been in force for at least the marketplace's settled-cover period and
      no claim has been accepted on it in the twenty-four months before, the enrolment's reporting record is read
      over the twelve months before the report; where the enrolment has been in force for at least that period and
      a claim has been accepted on it in the twenty-four months before, the reporting record is read over the twenty-four
      months before the report; where the enrolment has been in force for less than that period, the reporting record
      is read over the whole life of the cover.
    accepted_claims_24m: Where the enrolment has been in force for at least the marketplace's settled-cover period
      and no claim has been accepted on it in the twenty-four months before, the enrolment's reporting record is
      read over the twelve months before the report; where the enrolment has been in force for at least that period
      and a claim has been accepted on it in the twenty-four months before, the reporting record is read over the
      twenty-four months before the report; where the enrolment has been in force for less than that period, the
      reporting record is read over the whole life of the cover.
    reporting_window_months: Where the enrolment has been in force for at least the marketplace's settled-cover
      period and no claim has been accepted on it in the twenty-four months before, the enrolment's reporting record
      is read over the twelve months before the report; where the enrolment has been in force for at least that
      period and a claim has been accepted on it in the twenty-four months before, the reporting record is read
      over the twenty-four months before the report; where the enrolment has been in force for less than that period,
      the reporting record is read over the whole life of the cover.
    reports_in_window: Where the enrolment has been in force for at least the marketplace's settled-cover period
      and no claim has been accepted on it in the twenty-four months before, the enrolment's reporting record is
      read over the twelve months before the report; where the enrolment has been in force for at least that period
      and a claim has been accepted on it in the twenty-four months before, the reporting record is read over the
      twenty-four months before the report; where the enrolment has been in force for less than that period, the
      reporting record is read over the whole life of the cover.
    provisional_share: Where four or more damage reports stand on the enrolment in the period the reporting record
      is read over, the ceiling for the kind of loss is taken at half; where two or three reports stand in that
      period, it is taken at three quarters; where fewer than two reports stand in that period, it is taken in full.
    defects_6m: Where a defect was recorded on the vehicle in the six months before and no passed inspection has
      been recorded on it since that defect, the uncleared-defect share is taken off; where a defect was recorded
      in that period and a passed inspection has been recorded on it since, the cleared-defect share is taken off;
      where no defect was recorded in that period, nothing is taken off for the condition the vehicle was already
      in.
    latest_defect_date: Where a defect was recorded on the vehicle in the six months before and no passed inspection
      has been recorded on it since that defect, the uncleared-defect share is taken off; where a defect was recorded
      in that period and a passed inspection has been recorded on it since, the cleared-defect share is taken off;
      where no defect was recorded in that period, nothing is taken off for the condition the vehicle was already
      in.
    latest_pass_date: Where a defect was recorded on the vehicle in the six months before and no passed inspection
      has been recorded on it since that defect, the uncleared-defect share is taken off; where a defect was recorded
      in that period and a passed inspection has been recorded on it since, the cleared-defect share is taken off;
      where no defect was recorded in that period, nothing is taken off for the condition the vehicle was already
      in.
    preexisting_share: Where a defect was recorded on the vehicle in the six months before and no passed inspection
      has been recorded on it since that defect, the uncleared-defect share is taken off; where a defect was recorded
      in that period and a passed inspection has been recorded on it since, the cleared-defect share is taken off;
      where no defect was recorded in that period, nothing is taken off for the condition the vehicle was already
      in.
    payout_reserves: Where the reserves standing on the host's payout account are below the marketplace's provisioned-exposure
      mark and money is currently stopped on that account, the figure is opened at the stopped-exposure share; where
      those reserves are below that mark and no money is stopped on the account, it is opened at the unprovisioned-exposure
      share; where those reserves reach that mark, it is opened in full.
    payout_stop: Where the reserves standing on the host's payout account are below the marketplace's provisioned-exposure
      mark and money is currently stopped on that account, the figure is opened at the stopped-exposure share; where
      those reserves are below that mark and no money is stopped on the account, it is opened at the unprovisioned-exposure
      share; where those reserves reach that mark, it is opened in full.
    exposure_share: Where the reserves standing on the host's payout account are below the marketplace's provisioned-exposure
      mark and money is currently stopped on that account, the figure is opened at the stopped-exposure share; where
      those reserves are below that mark and no money is stopped on the account, it is opened at the unprovisioned-exposure
      share; where those reserves reach that mark, it is opened in full.
    callouts_1m: Where a callout on the roadside cover the vehicle carries was completed in the month before the
      report and the vehicle was towed, the whole of the recovery billed on the completed callouts on that cover
      in that month is added; where a callout was completed on that cover in that month and the vehicle was not
      towed, half of the recovery billed on them in that month is added; where no callout was completed on that
      cover in that month, nothing is added for recovery.
    towed_miles: Where a callout on the roadside cover the vehicle carries was completed in the month before the
      report and the vehicle was towed, the whole of the recovery billed on the completed callouts on that cover
      in that month is added; where a callout was completed on that cover in that month and the vehicle was not
      towed, half of the recovery billed on them in that month is added; where no callout was completed on that
      cover in that month, nothing is added for recovery.
    recovery_billed_1m: Where a callout on the roadside cover the vehicle carries was completed in the month before
      the report and the vehicle was towed, the whole of the recovery billed on the completed callouts on that cover
      in that month is added; where a callout was completed on that cover in that month and the vehicle was not
      towed, half of the recovery billed on them in that month is added; where no callout was completed on that
      cover in that month, nothing is added for recovery.
    recovery_share: Where a callout on the roadside cover the vehicle carries was completed in the month before
      the report and the vehicle was towed, the whole of the recovery billed on the completed callouts on that cover
      in that month is added; where a callout was completed on that cover in that month and the vehicle was not
      towed, half of the recovery billed on them in that month is added; where no callout was completed on that
      cover in that month, nothing is added for recovery.
    recovery_addition: Where a callout on the roadside cover the vehicle carries was completed in the month before
      the report and the vehicle was towed, the whole of the recovery billed on the completed callouts on that cover
      in that month is added; where a callout was completed on that cover in that month and the vehicle was not
      towed, half of the recovery billed on them in that month is added; where no callout was completed on that
      cover in that month, nothing is added for recovery.
    result: 'The order is fixed: the ceiling for the kind of loss is taken first at the share the reporting record
      calls for, the share for the condition the vehicle was already in is then taken off the figure that step leaves,
      the unprovisioned-exposure share is then applied to the figure that step leaves, and the recovery admitted
      is added to that result last; the provisional figure is rounded half up to two decimal places once, on that
      final result, and never at an intermediate step.'
  factors:
  - id: loss_kind_ceiling
    effect: parameter
    decides: kind_ceiling
    bindings:
    - reported_damage_kind
    - ceiling_glass
    - ceiling_tyres
    - ceiling_interior
    - ceiling_body
    - kind_ceiling
    ladder:
    - when: the most recent report on the register names glass
      value: the plan's glass ceiling
    - when: the most recent report on the register names tyres and wheels
      value: the plan's tyre and wheel ceiling
    - when: the most recent report on the register names the interior
      value: the plan's interior ceiling
    - when: the most recent report on the register names any other kind of loss
      value: the plan's ceiling for damage to the body and paint of the vehicle
    baseline:
      kind_ceiling: ceiling_body
    evidence:
    - history
    cross_difficulty: null
  - id: reporting_record_window
    effect: method
    decides: reporting_window_months
    bindings:
    - months_in_force
    - accepted_claims_24m
    - reporting_window_months
    ladder:
    - when: the enrolment has been in force for at least the marketplace's settled-cover period and no claim has
        been accepted on it in the twenty-four months before
      method: the enrolment's reporting record is read over the twelve months before the report
    - when: the enrolment has been in force for at least that period and a claim has been accepted on it in the
        twenty-four months before
      method: the reporting record is read over the twenty-four months before the report
    - when: the enrolment has been in force for less than that period
      method: the reporting record is read over the whole life of the cover
    baseline:
      reporting_window_months: None
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: provisional_reporting_share
    effect: parameter
    decides: provisional_share
    bindings:
    - reports_in_window
    - provisional_share
    ladder:
    - when: four or more damage reports stand on the enrolment in the period the reporting record is read over
      value: half of the ceiling for the kind of loss
    - when: two or three reports stand in that period
      value: three quarters of that ceiling
    - when: fewer than two reports stand in that period
      value: the whole of that ceiling
    baseline:
      provisional_share: '1.0'
    evidence:
    - history
    cross_difficulty: null
  - id: prior_condition_share
    effect: parameter
    decides: preexisting_share
    bindings:
    - defects_6m
    - latest_defect_date
    - latest_pass_date
    - preexisting_share
    ladder:
    - when: a defect was recorded on the vehicle in the six months before and no passed inspection has been recorded
        on it since that defect
      value: the uncleared-defect share
    - when: a defect was recorded in that period and a passed inspection has been recorded on it since
      value: the cleared-defect share
    - when: no defect was recorded in that period
      value: nothing is taken off for the condition the vehicle was already in
    baseline:
      preexisting_share: '0.0'
    evidence:
    - cross_category
    - date
    cross_difficulty: listings
  - id: open_exposure_share
    effect: parameter
    decides: exposure_share
    bindings:
    - payout_reserves
    - payout_stop
    - exposure_share
    ladder:
    - when: the reserves standing on the host's payout account are below the marketplace's provisioned-exposure
        mark and money is currently stopped on that account
      value: the stopped-exposure share
    - when: those reserves are below that mark and no money is stopped on the account
      value: the unprovisioned-exposure share
    - when: those reserves reach that mark
      value: the figure is opened in full
    baseline:
      exposure_share: '1.0'
    evidence:
    - cross_category
    cross_difficulty: payouts
  - id: recovery_admitted
    effect: parameter
    decides: recovery_share
    bindings:
    - callouts_1m
    - towed_miles
    - recovery_billed_1m
    - recovery_share
    - recovery_addition
    ladder:
    - when: a callout on the roadside cover the vehicle carries was completed in the month before the report and
        the vehicle was towed
      value: the whole of the recovery billed on the completed callouts on that cover in that month
    - when: a callout was completed on that cover in that month and the vehicle was not towed
      value: half of the recovery billed on them in that month
    - when: no callout was completed on that cover in that month
      value: nothing is added for recovery
    baseline:
      recovery_share: '0.0'
    evidence:
    - cross_category
    - history
    cross_difficulty: roadside
  baseline:
    rule: A claim is opened on an enrolment at a provisional figure, which is what the marketplace puts on the loss
      before anything is appraised. The provisional figure starts from the ceiling the plan carries for damage to
      the body and paint of the vehicle. That ceiling is what the claim is opened at, and the figure is rounded
      half up to two decimal places once, at the end. Every figure the plan publishes, its ceilings for each kind
      of loss among them, is read from the plan the enrolment is written on.
    params:
    - exterior_damage_sublimit_amount
  inputs:
    history:
    - table: hostplan_claim_intake
      aggregate: latest
      field: damage_category
      filters: {}
    - table: hostplan_claims
      aggregate: count
      within_months: 24
      filters:
        event_type: hostplan_claim_appraised
    - category: listings
      table: listings_inspections
      aggregate: count
      within_months: 6
      filters:
        event_type: listings_defect_reported
    - category: roadside
      table: roadside_callouts
      aggregate: sum
      field: callout_fee_amount
      within_months: 1
      filters: {}
    cross_category:
    - listings
    - payouts
    - roadside
- id: hostplan_ext_loss_appraisal
  base_policy_refs:
  - hostplan_evt_appraisal
  - hostplan_evt_earnings_share
  overwrite:
  - base_policy: hostplan_evt_appraisal
    superseded_clause: The accepted amount is capped twice over, first by the sublimit for the kind of loss and
      then by the plan's overall physical damage limit, and the lower of the two governs
    replaced_by: The accepted amount is capped once, by the plan's overall physical damage limit, the ceiling for
      the kind of loss having already been applied when the claim was opened.
  - base_policy: hostplan_evt_appraisal
    superseded_clause: Loss of use is paid at the plan's daily rate for the days the vehicle is genuinely off the
      road, up to the plan's maximum
    replaced_by: Where a defect stands recorded on the vehicle in the six months before the appraisal and two or
      more claims have been opened on the enrolment in the twelve months before, the plan's daily sum is paid at
      the marketplace's impaired-earning share, the vehicle having been earning at less than its full rate before
      the loss; where a defect stands recorded in that period and fewer than two claims have been opened on the
      enrolment in the twelve months before, it is paid at the marketplace's part-earning share; where no defect
      stands recorded in that period, the plan's daily sum is paid in full.
  trigger: on_request
  subject:
  - hostplan_claim_appraised
  computes: accepted_loss_amount
  target_tool: record_loss_appraisal_09001cb5
  params:
    phys_s90: 45000.0
    phys_s85: 70000.0
    phys_s80: 100000.0
    phys_s75: 150000.0
    phys_s70: 200000.0
    phys_s60: 300000.0
    lou_daily_s90: 0.0
    lou_daily_s85: 35.0
    lou_daily_s80: 50.0
    lou_daily_s75: 65.0
    lou_daily_s70: 85.0
    lou_daily_s60: 120.0
    lou_max_s90: 0
    lou_max_s85: 7
    lou_max_s80: 10
    lou_max_s75: 14
    lou_max_s70: 21
    lou_max_s60: 30
    apr_share_s90: 50
    apr_share_s85: 40
    apr_share_s80: 30
    apr_share_s75: 20
    apr_share_s70: 10
    apr_share_s60: 0
    full_network_rate: 1.0
    out_of_network_repair_rate: 0.9
    unmanaged_repair_rate: 0.8
    betterment_mileage_mark: 60000
    betterment_model_year_mark: 2018
    higher_betterment_share: 0.15
    lower_betterment_share: 0.08
    impaired_earning_share: 0.6
    part_earning_share: 0.8
