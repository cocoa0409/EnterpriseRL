  baseline:
    rule: 'An appraisal settles what the marketplace accepts on a loss and books that money as owed to the host.
      What the plan accepts on a loss is the cost the appraisal establishes, which the marketplace takes as the
      largest amount a claim stands opened at on the enrolment, accepted at the marketplace''s unmanaged-repair
      rate and with nothing taken off for the condition of the parts replaced. The accepted amount is capped once,
      by the plan''s overall physical damage limit, the ceiling for the kind of loss having already been applied
      when the claim was opened. Loss of use is paid at the plan''s daily sum for the days the vehicle stands off
      the road, never for more days than the plan''s longest period and never for fewer than none, and the days
      are counted from the day the loss is recorded on the most recently opened claim to the day of the appraisal
      with neither end day counted. No share of the marketplace''s out-of-network valuation fee is carried by the
      host. The order is fixed: the cost established is taken first at the repair rate the workshop record calls
      for, the betterment share is then taken off the figure that step leaves and that figure is rounded half up
      to two decimal places, the plan''s overall physical damage limit is applied to the rounded figure, the loss-of-use
      sum is then added to it, the host''s share of the valuation fee is taken off last, and the accepted amount
      is rounded half up to two decimal places on that final result. Every figure the plan publishes, its overall
      physical damage limit, its daily sum for loss of use and its longest period for it among them, is read from
      the plan the enrolment is written on.'
    params:
    - physical_damage_limit_amount
    - loss_of_use_daily_amount
    - loss_of_use_max_days
    - unmanaged_repair_rate
