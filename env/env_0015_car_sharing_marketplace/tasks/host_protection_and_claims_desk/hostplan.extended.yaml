      value: the marketplace's late-withdrawal share
    - when: it was recorded more than half that window ago and no money stands booked as owed
      value: the marketplace's settled-withdrawal share
    - when: it was recorded within half that window
      value: nothing is retained on that account
    baseline:
      late_share: '1.0'
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: reporting_record_share
    effect: parameter
    decides: record_share
    bindings:
    - incomplete_reports_12m
    - record_share
    ladder:
    - when: a damage report on the enrolment was closed incomplete in the twelve months before and money stands
        booked as owed to the host
      value: the marketplace's incomplete-record share
    - when: such a report was closed incomplete in that period and no money stands booked as owed
      value: the marketplace's closed-record share
    - when: no report was closed incomplete in that period
      value: nothing is retained on that account
    baseline:
      record_share: '1.0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: A host may take their own claim back off the enrolment, and doing so releases money that stands booked
      as owed to them on the enrolment's claims. What a withdrawal releases is the whole of the money the claims
      on the enrolment have booked as owed to the host and not yet paid out, released in full with nothing retained
      for the standing of the enrolment, for how late the withdrawal comes, for claims on the enrolment that overlap
      the one being withdrawn or for the state of the reporting record, and rounded half up to two decimal places
      once, at the end. Every figure the plan publishes, its supplement window and the number of claims it allows
      before review among them, is read from the plan the enrolment is written on.
    params:
    - supplement_window_days
    - claims_per_year_before_review
  inputs:
    history:
    - table: hostplan_claims
      aggregate: sum
      field: amount_delta
      filters:
        event_type: hostplan_claim_appraised
    - table: hostplan_claim_intake
      aggregate: count
      within_months: 12
      filters:
        intake_status: closed_incomplete
    cross_category: []
- id: hostplan_ext_reimbursement_release
  base_policy_refs:
  - hostplan_evt_reimbursement
  overwrite: []
  trigger: on_request
  subject:
  - hostplan_reimbursement_paid
  computes: released_payment_amount
  target_tool: release_claim_payment_a6ef5b4d
  params:
    rev4_s90: 2
    rev4_s85: 2
    rev4_s80: 3
    rev4_s75: 3
    rev4_s70: 4
    rev4_s60: 5
    susp4_s90: 4
    susp4_s85: 4
    susp4_s80: 5
    susp4_s75: 5
    susp4_s70: 6
    susp4_s60: 8
    part_settlement_share: 0.6
    high_exposure_release_share: 0.7
    reviewed_exposure_share: 0.85
    open_repair_share: 0.95
    closed_repair_share: 0.98
    repeat_settlement_share: 0.96
    settled_history_share: 0.99
    backup_withholding_rate: 0.24
    reduced_withholding_rate: 0.1
    earnings_reporting_mark: 600.0
  rule: 'Money accepted on a claim reaches the host through their payout account, and the desk releases it against
    the claim it belongs to. The money released on a claim is not fixed until every further cost accepted on that
    claim stands booked as owed to the host. Money is released on a loss only once every other claim opened on that
    loss carries a withdrawal against it. The money released is the whole of what stands owed to the host on the
    enrolment, with nothing set against it for what the host owes, nothing withheld, and no share taken for the
    standing of the enrolment, the state of the vehicle''s repair or an earlier payment; it is rounded half up to
    two decimal places once, on the final result. Where what stands owed to the host is more than the reserves held
    on their payout account and that account settles on the marketplace''s express or instant schedule, the payment
    is measured as the reserves held on the account; where what stands owed is more than those reserves and the
    account settles on any other schedule, the payment is measured as what stands owed taken at the marketplace''s
    part-settlement share; where what stands owed is no more than those reserves, the payment is measured as the
    whole of what stands owed. Where the claims accepted on the enrolment in the twelve months before reach the
    number the plan allows before cover is suspended and a share stands unpaid on the enrolment, the payment is
    released at the marketplace''s high-exposure release share; where they reach the number the plan allows before
    review but not the number before suspension and a share stands unpaid, it is released at the marketplace''s
    reviewed-exposure share; in every other case no share is taken on that account. Where the vehicle carries an
    active care plan and a workshop visit stands on it in the month before, the payment is released at the marketplace''s
    open-repair share, the vehicle being still in the shop; where the vehicle carries an active care plan and no
    workshop visit stands in that month, it is released at the marketplace''s closed-repair share; where the vehicle
    carries no active care plan, no share is taken on that account. Where a payment already stands on the enrolment
    in the twelve months before and a share stands unpaid on it, the payment is released at the marketplace''s repeat-settlement
    share; where a payment already stands in that period and nothing stands unpaid, it is released at the marketplace''s
    settled-history share; where no payment stands in that period, no share is taken on that account. Where the
    tax documentation on the host''s payout account is missing or has expired and the earnings booked to that account
    in the twelve months before reach the marketplace''s reporting mark, the marketplace withholds at its backup
    withholding rate; where that documentation is missing or has expired and those earnings do not reach that mark,
    it withholds at its reduced withholding rate; where that documentation is on file or is not required, nothing
    is withheld. Where a share raised on the enrolment in the twelve months before stands unpaid and cover on it
    stands in force, the whole of what stands unpaid is set against the payment; where a share raised in that period
    stands unpaid and cover on it does not stand in force, half of it is set against the payment; where no share
    raised in that period stands unpaid, nothing is set against it. The order is fixed: the payment is measured
    first, the shares for the standing of the enrolment, for the state of the repair and for an earlier payment
    are then applied one after another to the figure each step leaves and that figure is rounded half up to two
    decimal places, the withholding is taken from the rounded figure, what is set against the payment is deducted
    after it, and the payment is never less than nothing. Every figure the plan publishes, the numbers of claims
    it allows before review and before suspension among them, is read from the plan the enrolment is written on.'
  prerequisite:
  - problem: hostplan_ext_repair_supplement
    kind: value_input
    gate: owed_standing
    form: state
    policy_source: The money released on a claim is not fixed until every further cost accepted on that claim stands
      booked as owed to the host.
    condition: Every further cost accepted on the claim stands booked as owed to the host on the enrolment, so that
      the balance owed carries the whole of what the loss has cost.
    resolved_by: record_repair_supplement_1a6beabe
    effect: The balance owed to the host rises by the further cost accepted, so the binding owed_standing carries
      that cost as well as the original appraisal.
  - problem: hostplan_ext_claim_withdrawal
    kind: value_input
    gate: owed_standing
    form: state
    policy_source: Money is released on a loss only once every other claim opened on that loss carries a withdrawal
      against it.
    condition: Every other claim opened on the same loss as the claim being paid carries a withdrawal record against
      it on the enrolment.
    resolved_by: withdraw_own_claim_4cdcc89b
    effect: A withdrawal record stands against the second claim and the money it releases comes off the balance
      owed to the host, so the binding owed_standing falls to what the loss is actually owed.
  cross_category:
  - category: payouts
    as: history
    reads:
    - payout_schedule_name
    - reserve_balance
    - tax_form_status
    - payouts_ledger.entry_basis
    - payouts_ledger.entry_amount
    note: The account's schedule and reserves decide what the payment is measured from, and its tax documentation
      and earnings decide the withholding.
  - category: service
    as: history
    reads:
    - status
    - service_visits.visit_date
    note: The care-plan standing and the workshop record decide the share released while the vehicle is still in
      the shop.
  compute:
  - plan_review_count: K('rev4_s90') if F('protection_plan_name') == 'Keyturn Shield 90 Host Plan' else (K('rev4_s85')
      if F('protection_plan_name') == 'Keyturn Shield 85 Host Plan' else (K('rev4_s80') if F('protection_plan_name')
      == 'Keyturn Shield 80 Host Plan' else (K('rev4_s75') if F('protection_plan_name') == 'Keyturn Shield 75 Host
      Plan' else (K('rev4_s70') if F('protection_plan_name') == 'Keyturn Shield 70 Host Plan' else (K('rev4_s60'))))))
  - plan_suspension_count: K('susp4_s90') if F('protection_plan_name') == 'Keyturn Shield 90 Host Plan' else (K('susp4_s85')
      if F('protection_plan_name') == 'Keyturn Shield 85 Host Plan' else (K('susp4_s80') if F('protection_plan_name')
      == 'Keyturn Shield 80 Host Plan' else (K('susp4_s75') if F('protection_plan_name') == 'Keyturn Shield 75 Host
      Plan' else (K('susp4_s70') if F('protection_plan_name') == 'Keyturn Shield 70 Host Plan' else (K('susp4_s60'))))))
  - owed_standing: F('reimbursement_balance_due')
  - payout_reserves: CFIELD('payouts','reserve_balance')
  - payout_schedule: CFIELD('payouts','payout_schedule_name')
  - measured_payment: payout_reserves if (owed_standing > payout_reserves and (payout_schedule == 'Keyturn Express
      Payout Schedule' or payout_schedule == 'Keyturn Instant Payout Schedule')) else (owed_standing * K('part_settlement_share')
      if (owed_standing > payout_reserves) else owed_standing)
  - accepted_claims_12m: COUNT('hostplan_claims', within_months=12, date_field='claim_date', event_type='hostplan_claim_appraised')
  - unpaid_standing: F('liability_balance_due')
  - standing_share: K('high_exposure_release_share') if (accepted_claims_12m >= plan_suspension_count and unpaid_standing
      > 0) else (K('reviewed_exposure_share') if (accepted_claims_12m >= plan_review_count and unpaid_standing >
      0) else 1.0)
  - care_plan_state: CFIELD('service','status', vehicle_id=F('vehicle_id'))
  - visits_1m: XCOUNT('service','service_visits', within_months=1, date_field='visit_date', vehicle_id=F('vehicle_id'))
  - repair_share: K('open_repair_share') if (care_plan_state == 'active' and visits_1m >= 1) else (K('closed_repair_share')
      if (care_plan_state == 'active' and visits_1m < 1) else 1.0)
  - payments_12m: COUNT('hostplan_claims', within_months=12, date_field='claim_date', event_type='hostplan_reimbursement_paid')
  - repeat_share: K('repeat_settlement_share') if (payments_12m >= 1 and unpaid_standing > 0) else (K('settled_history_share')
      if (payments_12m >= 1 and unpaid_standing <= 0) else 1.0)
  - gross_payment: RND(measured_payment * standing_share * repair_share * repeat_share, 2)
  - tax_documentation: CFIELD('payouts','tax_form_status')
  - earnings_12m: XSUM('payouts','payouts_ledger','entry_amount', within_months=12, date_field='entry_date', entry_basis='trip_earning')
  - withholding_rate: K('backup_withholding_rate') if ((tax_documentation == 'expired' or tax_documentation == 'requested')
      and earnings_12m >= K('earnings_reporting_mark')) else (K('reduced_withholding_rate') if ((tax_documentation
      == 'expired' or tax_documentation == 'requested') and earnings_12m < K('earnings_reporting_mark')) else 0.0)
  - withheld: gross_payment * withholding_rate
  - shares_raised_12m: COUNT('hostplan_claims', within_months=12, date_field='claim_date', event_type='hostplan_deductible_charged')
  - cover_in_force: F('status')
  - set_off_rate: 1.0 if (shares_raised_12m >= 1 and unpaid_standing > 0 and cover_in_force == 'active') else (0.5
      if (shares_raised_12m >= 1 and unpaid_standing > 0 and cover_in_force != 'active') else 0.0)
  - set_off: unpaid_standing * set_off_rate
  - result: MX(RND(gross_payment - withheld - set_off, 2), 0.0)
  compute_basis:
    plan_review_count: Every figure the plan publishes, the numbers of claims it allows before review and before
      suspension among them, is read from the plan the enrolment is written on.
    plan_suspension_count: Every figure the plan publishes, the numbers of claims it allows before review and before
      suspension among them, is read from the plan the enrolment is written on.
    owed_standing: The money released is the whole of what stands owed to the host on the enrolment, with nothing
      set against it for what the host owes, nothing withheld, and no share taken for the standing of the enrolment,
      the state of the vehicle's repair or an earlier payment; it is rounded half up to two decimal places once,
      on the final result.
    payout_reserves: Where what stands owed to the host is more than the reserves held on their payout account and
      that account settles on the marketplace's express or instant schedule, the payment is measured as the reserves
      held on the account; where what stands owed is more than those reserves and the account settles on any other
      schedule, the payment is measured as what stands owed taken at the marketplace's part-settlement share; where
      what stands owed is no more than those reserves, the payment is measured as the whole of what stands owed.
    payout_schedule: Where what stands owed to the host is more than the reserves held on their payout account and
      that account settles on the marketplace's express or instant schedule, the payment is measured as the reserves
      held on the account; where what stands owed is more than those reserves and the account settles on any other
      schedule, the payment is measured as what stands owed taken at the marketplace's part-settlement share; where
      what stands owed is no more than those reserves, the payment is measured as the whole of what stands owed.
    measured_payment: Where what stands owed to the host is more than the reserves held on their payout account
      and that account settles on the marketplace's express or instant schedule, the payment is measured as the
      reserves held on the account; where what stands owed is more than those reserves and the account settles on
      any other schedule, the payment is measured as what stands owed taken at the marketplace's part-settlement
      share; where what stands owed is no more than those reserves, the payment is measured as the whole of what
      stands owed.
    accepted_claims_12m: Where the claims accepted on the enrolment in the twelve months before reach the number
      the plan allows before cover is suspended and a share stands unpaid on the enrolment, the payment is released
      at the marketplace's high-exposure release share; where they reach the number the plan allows before review
      but not the number before suspension and a share stands unpaid, it is released at the marketplace's reviewed-exposure
      share; in every other case no share is taken on that account.
    unpaid_standing: Where the claims accepted on the enrolment in the twelve months before reach the number the
      plan allows before cover is suspended and a share stands unpaid on the enrolment, the payment is released
      at the marketplace's high-exposure release share; where they reach the number the plan allows before review
      but not the number before suspension and a share stands unpaid, it is released at the marketplace's reviewed-exposure
      share; in every other case no share is taken on that account.
    standing_share: Where the claims accepted on the enrolment in the twelve months before reach the number the
      plan allows before cover is suspended and a share stands unpaid on the enrolment, the payment is released
      at the marketplace's high-exposure release share; where they reach the number the plan allows before review
      but not the number before suspension and a share stands unpaid, it is released at the marketplace's reviewed-exposure
      share; in every other case no share is taken on that account.
    care_plan_state: Where the vehicle carries an active care plan and a workshop visit stands on it in the month
      before, the payment is released at the marketplace's open-repair share, the vehicle being still in the shop;
      where the vehicle carries an active care plan and no workshop visit stands in that month, it is released at
      the marketplace's closed-repair share; where the vehicle carries no active care plan, no share is taken on
      that account.
    visits_1m: Where the vehicle carries an active care plan and a workshop visit stands on it in the month before,
      the payment is released at the marketplace's open-repair share, the vehicle being still in the shop; where
      the vehicle carries an active care plan and no workshop visit stands in that month, it is released at the
      marketplace's closed-repair share; where the vehicle carries no active care plan, no share is taken on that
      account.
    repair_share: Where the vehicle carries an active care plan and a workshop visit stands on it in the month before,
      the payment is released at the marketplace's open-repair share, the vehicle being still in the shop; where
      the vehicle carries an active care plan and no workshop visit stands in that month, it is released at the
      marketplace's closed-repair share; where the vehicle carries no active care plan, no share is taken on that
      account.
    payments_12m: Where a payment already stands on the enrolment in the twelve months before and a share stands
      unpaid on it, the payment is released at the marketplace's repeat-settlement share; where a payment already
      stands in that period and nothing stands unpaid, it is released at the marketplace's settled-history share;
      where no payment stands in that period, no share is taken on that account.
    repeat_share: Where a payment already stands on the enrolment in the twelve months before and a share stands
      unpaid on it, the payment is released at the marketplace's repeat-settlement share; where a payment already
      stands in that period and nothing stands unpaid, it is released at the marketplace's settled-history share;
      where no payment stands in that period, no share is taken on that account.
    gross_payment: 'The order is fixed: the payment is measured first, the shares for the standing of the enrolment,
      for the state of the repair and for an earlier payment are then applied one after another to the figure each
      step leaves and that figure is rounded half up to two decimal places, the withholding is taken from the rounded
      figure, what is set against the payment is deducted after it, and the payment is never less than nothing.'
    tax_documentation: Where the tax documentation on the host's payout account is missing or has expired and the
      earnings booked to that account in the twelve months before reach the marketplace's reporting mark, the marketplace
      withholds at its backup withholding rate; where that documentation is missing or has expired and those earnings
      do not reach that mark, it withholds at its reduced withholding rate; where that documentation is on file
      or is not required, nothing is withheld.
    earnings_12m: Where the tax documentation on the host's payout account is missing or has expired and the earnings
      booked to that account in the twelve months before reach the marketplace's reporting mark, the marketplace
      withholds at its backup withholding rate; where that documentation is missing or has expired and those earnings
      do not reach that mark, it withholds at its reduced withholding rate; where that documentation is on file
      or is not required, nothing is withheld.
    withholding_rate: Where the tax documentation on the host's payout account is missing or has expired and the
      earnings booked to that account in the twelve months before reach the marketplace's reporting mark, the marketplace
      withholds at its backup withholding rate; where that documentation is missing or has expired and those earnings
      do not reach that mark, it withholds at its reduced withholding rate; where that documentation is on file
      or is not required, nothing is withheld.
    withheld: Where the tax documentation on the host's payout account is missing or has expired and the earnings
      booked to that account in the twelve months before reach the marketplace's reporting mark, the marketplace
      withholds at its backup withholding rate; where that documentation is missing or has expired and those earnings
      do not reach that mark, it withholds at its reduced withholding rate; where that documentation is on file
      or is not required, nothing is withheld.
    shares_raised_12m: Where a share raised on the enrolment in the twelve months before stands unpaid and cover
      on it stands in force, the whole of what stands unpaid is set against the payment; where a share raised in
      that period stands unpaid and cover on it does not stand in force, half of it is set against the payment;
      where no share raised in that period stands unpaid, nothing is set against it.
    cover_in_force: Where a share raised on the enrolment in the twelve months before stands unpaid and cover on
      it stands in force, the whole of what stands unpaid is set against the payment; where a share raised in that
      period stands unpaid and cover on it does not stand in force, half of it is set against the payment; where
      no share raised in that period stands unpaid, nothing is set against it.
    set_off_rate: Where a share raised on the enrolment in the twelve months before stands unpaid and cover on it
      stands in force, the whole of what stands unpaid is set against the payment; where a share raised in that
      period stands unpaid and cover on it does not stand in force, half of it is set against the payment; where
      no share raised in that period stands unpaid, nothing is set against it.
    set_off: Where a share raised on the enrolment in the twelve months before stands unpaid and cover on it stands
      in force, the whole of what stands unpaid is set against the payment; where a share raised in that period
      stands unpaid and cover on it does not stand in force, half of it is set against the payment; where no share
      raised in that period stands unpaid, nothing is set against it.
    result: 'The order is fixed: the payment is measured first, the shares for the standing of the enrolment, for
      the state of the repair and for an earlier payment are then applied one after another to the figure each step
      leaves and that figure is rounded half up to two decimal places, the withholding is taken from the rounded
      figure, what is set against the payment is deducted after it, and the payment is never less than nothing.'
