measures:
  - id: hostplan_msr_accepted_claims_12m
    window: Rolling 12 calendar months counted back from the handling date, the handling date included.
    measure: Count of hostplan_claim_appraised records accepted across all enrolments this host holds.
  - id: hostplan_msr_claim_free_months
    window: From the claim-free date standing on the enrolment to the handling date, counted in whole calendar months.
    measure: Whole calendar months this enrolment has gone without an accepted claim.
  - id: hostplan_msr_open_claim_exposure
    window: Current portfolio state, with no time window.
    measure: Sum of appraisal_amount over this host's claims that have been appraised but not yet paid.

policies:
  - id: hostplan_agg_multi_holding
    subject: [hostplan_enrollment_opened]
    rule: >-
      A host protects each vehicle separately, so one host may hold as many enrolments as they have vehicles and there is no ceiling on the number.
      One vehicle may carry only one live enrolment at a time, and an application for a vehicle that already carries a live enrolment is a plan change on that enrolment rather than a second enrolment.
      Each enrolment carries its own plan, its own deductible and its own claim history, and a claim on one vehicle never moves the deductible or the standing of another.
    eligibility: []
    params: {max_per_customer: null}
  - id: hostplan_agg_portfolio_standing
    subject: [hostplan_enrollment_opened, hostplan_enrollment_suspended]
    rule: >-
      A host's enrolments are read as one portfolio when the marketplace judges standing, even though cover is written vehicle by vehicle.
      Accepted claims are counted across every enrolment the host holds over the rolling twelve months, and it is that portfolio count, not the count on the vehicle being claimed on, that decides whether the host goes in front of a reviewer or has cover suspended.
      An unpaid host liability on any one enrolment blocks a new enrolment for the same host, because the marketplace does not extend fresh cover to a host who owes it money on cover already given.
      Where a host holds enrolments on several plans the strictest standing rule among the plans held applies to the portfolio, and the most generous plan never softens the review threshold of the others.
    eligibility:
      - id: no_unpaid_liability_on_portfolio
        applies_to: [hostplan_enrollment_opened]
        kind: authorization
        condition: An unpaid host liability on any one enrolment blocks a new enrolment for the same host, because the marketplace does not extend fresh cover to a host who owes it money on cover already given.
        evidence_fields: [hostplan_enrollments.liability_balance_due, hostplan_enrollments.customer_id, hostplan_enrollments.enrollment_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[hostplan_enrollments.customer_id]]
          action_bindings: {hostplan_enrollments.customer_id: customer_id}
    params:
      per_tier:
        Keyturn Shield 90 Host Plan: {claims_per_year_before_review: "=claims_per_year_before_review", claims_per_year_before_suspension: "=claims_per_year_before_suspension"}
        Keyturn Shield 85 Host Plan: {claims_per_year_before_review: "=claims_per_year_before_review", claims_per_year_before_suspension: "=claims_per_year_before_suspension"}
        Keyturn Shield 80 Host Plan: {claims_per_year_before_review: "=claims_per_year_before_review", claims_per_year_before_suspension: "=claims_per_year_before_suspension"}
        Keyturn Shield 75 Host Plan: {claims_per_year_before_review: "=claims_per_year_before_review", claims_per_year_before_suspension: "=claims_per_year_before_suspension"}
        Keyturn Shield 70 Host Plan: {claims_per_year_before_review: "=claims_per_year_before_review", claims_per_year_before_suspension: "=claims_per_year_before_suspension"}
        Keyturn Shield 60 Host Plan: {claims_per_year_before_review: "=claims_per_year_before_review", claims_per_year_before_suspension: "=claims_per_year_before_suspension"}
    measures: [hostplan_msr_accepted_claims_12m]
  - id: hostplan_enrollment_eligibility
    subject: [hostplan_enrollment_opened, hostplan_enrollment_activated]
    rule: >-
      A vehicle is accepted onto a plan only where it sits inside that plan's age, odometer, value, title and territory limits, and a vehicle failing any one of them is refused rather than moved to a plan that would take it.
      Vehicle age is counted in whole years from the model year to the year the application is made, so a vehicle of the model year exactly at the plan's limit is still accepted.
      The declared value must sit between the plan's floor and its ceiling, and where the marketplace's own valuation of the vehicle differs from the host's declaration by more than the plan's tolerance, the marketplace's valuation governs and the host is told the plan the vehicle actually qualifies for.
      Cover on plans that require it begins only where a passed inspection already stands on the vehicle record, and a report of an inspection the host says was carried out is not a substitute for the inspection record itself.
      A vehicle whose title status is not among the plan's eligible title statuses is refused, and a financed or leased vehicle is accepted only where the lienholder consent document has been verified on the listing.
      Where the application is accepted, cover starts on the day the protection team records activation and never earlier, so a loss on a trip that ran before activation is not covered however soon afterwards the enrolment went live.
    eligibility:
      - id: inspection_on_record
        applies_to: [hostplan_enrollment_activated]
        kind: authorization
        condition: Cover on plans that require it begins only where a passed inspection already stands on the vehicle record, and a report of an inspection the host says was carried out is not a substitute for the inspection record itself.
        evidence_fields: [listings_vehicles.last_inspection_date, listings_vehicles.vehicle_id, listings_inspections.inspection_outcome]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[listings_vehicles.vehicle_id]]
          action_bindings: {listings_vehicles.vehicle_id: vehicle_id}
      - id: title_status_eligible
        applies_to: [hostplan_enrollment_opened]
        kind: state
        condition: A vehicle whose title status is not among the plan's eligible title statuses is refused, and a financed or leased vehicle is accepted only where the lienholder consent document has been verified on the listing.
        evidence_fields: [listings_vehicles.title_status, listings_vehicles.vehicle_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[listings_vehicles.vehicle_id]]
          action_bindings: {listings_vehicles.vehicle_id: vehicle_id}
        state_contract:
          field: listings_vehicles.title_status
          allowed: [clean, lienholder_financed, lease]
    params:
      declared_value_tolerance_percent: 10
      per_tier:
        Keyturn Shield 90 Host Plan: {vehicle_age_max_years: "=vehicle_age_max_years", vehicle_odometer_max_miles: "=vehicle_odometer_max_miles", declared_value_min_amount: "=declared_value_min_amount", declared_value_max_amount: "=declared_value_max_amount", inspection_required_before_activation: "=inspection_required_before_activation"}
        Keyturn Shield 85 Host Plan: {vehicle_age_max_years: "=vehicle_age_max_years", vehicle_odometer_max_miles: "=vehicle_odometer_max_miles", declared_value_min_amount: "=declared_value_min_amount", declared_value_max_amount: "=declared_value_max_amount", inspection_required_before_activation: "=inspection_required_before_activation"}
        Keyturn Shield 80 Host Plan: {vehicle_age_max_years: "=vehicle_age_max_years", vehicle_odometer_max_miles: "=vehicle_odometer_max_miles", declared_value_min_amount: "=declared_value_min_amount", declared_value_max_amount: "=declared_value_max_amount", inspection_required_before_activation: "=inspection_required_before_activation"}
        Keyturn Shield 75 Host Plan: {vehicle_age_max_years: "=vehicle_age_max_years", vehicle_odometer_max_miles: "=vehicle_odometer_max_miles", declared_value_min_amount: "=declared_value_min_amount", declared_value_max_amount: "=declared_value_max_amount", inspection_required_before_activation: "=inspection_required_before_activation"}
        Keyturn Shield 70 Host Plan: {vehicle_age_max_years: "=vehicle_age_max_years", vehicle_odometer_max_miles: "=vehicle_odometer_max_miles", declared_value_min_amount: "=declared_value_min_amount", declared_value_max_amount: "=declared_value_max_amount", inspection_required_before_activation: "=inspection_required_before_activation"}
        Keyturn Shield 60 Host Plan: {vehicle_age_max_years: "=vehicle_age_max_years", vehicle_odometer_max_miles: "=vehicle_odometer_max_miles", declared_value_min_amount: "=declared_value_min_amount", declared_value_max_amount: "=declared_value_max_amount", inspection_required_before_activation: "=inspection_required_before_activation"}
  - id: hostplan_plan_change
    subject: [hostplan_plan_changed]
    rule: >-
      A host may move a vehicle between plans, and the move takes effect on a future date rather than the day it is asked for, so that cover on a trip already running is never changed underneath it.
      The host must give the plan's notice, and the change then takes effect the plan's effective period after the notice is recorded, counted in whole calendar days from the day the notice is taken, with the day of notice itself not counted.
      Moving to a plan with a larger earnings share is a downgrade of cover, and after a downgrade the host may not downgrade again until the plan's lockout period has run; moving to a plan with a smaller earnings share is an upgrade and carries no lockout.
      A plan change is refused outright while a claim on that enrolment is open, because the plan in force when the loss occurred is the plan that settles it, and changing plans midway would leave the claim under two sets of limits.
      The vehicle must satisfy the target plan's own age, odometer, value and title limits on the day the change takes effect, not merely on the day it is asked for.
      A restated declared value is treated as a plan change where the new value moves the vehicle outside the current plan's value band, and as an ordinary correction where it does not.
    eligibility:
      - id: no_open_claim_during_change
        applies_to: [hostplan_plan_changed]
        kind: authorization
        condition: A plan change is refused outright while a claim on that enrolment is open, because the plan in force when the loss occurred is the plan that settles it, and changing plans midway would leave the claim under two sets of limits.
        evidence_fields: [hostplan_claims.event_type, hostplan_claims.enrollment_id, hostplan_enrollments.enrollment_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[hostplan_enrollments.enrollment_id]]
          action_bindings: {hostplan_enrollments.enrollment_id: enrollment_id}
      - id: plan_change_notice_elapsed
        applies_to: [hostplan_plan_changed]
        kind: time
        condition: The host must give the plan's notice, and the change then takes effect the plan's effective period after the notice is recorded, counted in whole calendar days from the day the notice is taken, with the day of notice itself not counted.
        evidence_fields: [hostplan_enrollments.plan_change_effective_date, hostplan_enrollments.enrollment_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[hostplan_enrollments.enrollment_id]]
          action_bindings: {hostplan_enrollments.enrollment_id: enrollment_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the notice is recorded
          anchor_source: hostplan_enrollments.plan_change_effective_date
          relation: not_before
          duration_source: params.plan_change_effective_rule_days
          unit: calendar_days
          counting_rule: counted in whole calendar days from the day the notice is taken, with the day of notice itself not counted
          boundary: inclusive
    params:
      per_tier:
        Keyturn Shield 90 Host Plan: {plan_change_notice_days: "=plan_change_notice_days", plan_change_effective_rule_days: "=plan_change_effective_rule_days", plan_downgrade_lockout_days: "=plan_downgrade_lockout_days"}
        Keyturn Shield 85 Host Plan: {plan_change_notice_days: "=plan_change_notice_days", plan_change_effective_rule_days: "=plan_change_effective_rule_days", plan_downgrade_lockout_days: "=plan_downgrade_lockout_days"}
        Keyturn Shield 80 Host Plan: {plan_change_notice_days: "=plan_change_notice_days", plan_change_effective_rule_days: "=plan_change_effective_rule_days", plan_downgrade_lockout_days: "=plan_downgrade_lockout_days"}
        Keyturn Shield 75 Host Plan: {plan_change_notice_days: "=plan_change_notice_days", plan_change_effective_rule_days: "=plan_change_effective_rule_days", plan_downgrade_lockout_days: "=plan_downgrade_lockout_days"}
        Keyturn Shield 70 Host Plan: {plan_change_notice_days: "=plan_change_notice_days", plan_change_effective_rule_days: "=plan_change_effective_rule_days", plan_downgrade_lockout_days: "=plan_downgrade_lockout_days"}
        Keyturn Shield 60 Host Plan: {plan_change_notice_days: "=plan_change_notice_days", plan_change_effective_rule_days: "=plan_change_effective_rule_days", plan_downgrade_lockout_days: "=plan_downgrade_lockout_days"}
  - id: hostplan_lifecycle_standing
    subject: [hostplan_enrollment_suspended, hostplan_enrollment_reinstated, hostplan_enrollment_ended]
    rule: >-
      Cover is suspended, never quietly ignored, where an inspection falls overdue, a required document expires, a host liability goes unpaid, a fraud review opens or the host asks for it, and the ground is recorded on the enrolment so that the host is told what must be put right.
      A suspension pauses cover for trips beginning while it stands, but never withdraws cover from a trip already running when it began.
      Cover falls away where a host liability stays unpaid past the plan's lapse period, counted in whole calendar days from the day the liability was raised, and a lapse is not a cancellation, since a lapsed enrolment may be reinstated while a cancelled one may not.
      A lapsed enrolment may be reinstated inside the plan's reinstatement window on payment of the plan's reinstatement fee, and cover then begins again on the day of reinstatement and not retrospectively; nothing that happened while the enrolment was lapsed becomes covered.
      A host may end cover on their own vehicle at any time on the plan's notice, but never before the plan's minimum enrolment period has run, and ending cover is the host's own act rather than something the marketplace does on their behalf.
      Where a claim is open the enrolment may be suspended but not ended, because the claim is settled under the enrolment it was made on.
    eligibility:
      - id: suspension_ground_on_record
        applies_to: [hostplan_enrollment_suspended]
        kind: state
        condition: Cover is suspended, never quietly ignored, where an inspection falls overdue, a required document expires, a host liability goes unpaid, a fraud review opens or the host asks for it, and the ground is recorded on the enrolment so that the host is told what must be put right.
        evidence_fields: [hostplan_enrollments.status, hostplan_enrollments.enrollment_id, hostplan_enrollments.suspension_reason]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[hostplan_enrollments.enrollment_id]]
          action_bindings: {hostplan_enrollments.enrollment_id: enrollment_id}
        state_contract:
          field: hostplan_enrollments.status
          allowed: [active, suspended]
      - id: claim_closed_before_ending
        applies_to: [hostplan_enrollment_ended]
        kind: authorization
        condition: Where a claim is open the enrolment may be suspended but not ended, because the claim is settled under the enrolment it was made on.
        evidence_fields: [hostplan_claims.event_type, hostplan_claims.enrollment_id, hostplan_enrollments.enrollment_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[hostplan_enrollments.enrollment_id]]
          action_bindings: {hostplan_enrollments.enrollment_id: enrollment_id}
    params:
      per_tier:
        Keyturn Shield 90 Host Plan: {reinstatement_window_days: "=reinstatement_window_days", reinstatement_fee_amount: "=reinstatement_fee_amount", lapse_after_unpaid_days: "=lapse_after_unpaid_days", minimum_enrollment_days: "=minimum_enrollment_days", cancellation_notice_days: "=cancellation_notice_days"}
        Keyturn Shield 85 Host Plan: {reinstatement_window_days: "=reinstatement_window_days", reinstatement_fee_amount: "=reinstatement_fee_amount", lapse_after_unpaid_days: "=lapse_after_unpaid_days", minimum_enrollment_days: "=minimum_enrollment_days", cancellation_notice_days: "=cancellation_notice_days"}
        Keyturn Shield 80 Host Plan: {reinstatement_window_days: "=reinstatement_window_days", reinstatement_fee_amount: "=reinstatement_fee_amount", lapse_after_unpaid_days: "=lapse_after_unpaid_days", minimum_enrollment_days: "=minimum_enrollment_days", cancellation_notice_days: "=cancellation_notice_days"}
        Keyturn Shield 75 Host Plan: {reinstatement_window_days: "=reinstatement_window_days", reinstatement_fee_amount: "=reinstatement_fee_amount", lapse_after_unpaid_days: "=lapse_after_unpaid_days", minimum_enrollment_days: "=minimum_enrollment_days", cancellation_notice_days: "=cancellation_notice_days"}
        Keyturn Shield 70 Host Plan: {reinstatement_window_days: "=reinstatement_window_days", reinstatement_fee_amount: "=reinstatement_fee_amount", lapse_after_unpaid_days: "=lapse_after_unpaid_days", minimum_enrollment_days: "=minimum_enrollment_days", cancellation_notice_days: "=cancellation_notice_days"}
        Keyturn Shield 60 Host Plan: {reinstatement_window_days: "=reinstatement_window_days", reinstatement_fee_amount: "=reinstatement_fee_amount", lapse_after_unpaid_days: "=lapse_after_unpaid_days", minimum_enrollment_days: "=minimum_enrollment_days", cancellation_notice_days: "=cancellation_notice_days"}
  - id: hostplan_evt_claim_intake
    subject: [hostplan_claim_filed]
    rule: >-
      A loss is reported first onto the damage report register and becomes a claim only once the report is complete, so that an incomplete report never starts the appraisal clock.
      A claim is opened only where the host reports the loss no later than the plan's filing window counted forward from the end of the trip the loss is said to have happened on. The filing window is counted in whole elapsed hours from the actual return of the vehicle recorded on the trip, never from the scheduled return and never in calendar days, and an hour counts only once it has fully elapsed.
      The report must carry at least the plan's minimum number of photographs before it becomes a claim, and the host has the plan's evidence period to complete it, counted in whole calendar days from the day the report was lodged.
      A report that is still short of evidence when the evidence period runs out is closed incomplete, and a fresh report on the same loss is only accepted where the filing window itself has not yet run out.
      The trip the loss is said to have happened on must be a real trip on that vehicle that has reached the completed or settled state; a loss on a vehicle that was not on a trip is not a marketplace claim at all and belongs to the host's own motor policy.
      Damage already recorded against an earlier trip is not claimed again on a later one, and where the same damage appears on two reports the earlier trip governs.
    eligibility:
