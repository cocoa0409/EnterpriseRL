    evidence:
    - history
    cross_difficulty: null
  - id: claim_free_standing
    effect: parameter
    decides: claim_free_rate
    bindings:
    - months_claim_free
    - liability_standing
    - claim_free_rate
    ladder:
    - when: the plan publishes a waiver period, the enrolment has gone at least that long without a claim being
        accepted on it and nothing stands unpaid on the enrolment
      value: the share is waived altogether
    - when: the enrolment has gone at least the plan's qualifying period without a claim being accepted on it but
        less than the waiver period the plan publishes, and nothing stands unpaid on the enrolment
      value: one less the plan's claim-free discount
    - when: every other case
      value: the whole of the figure the share was measured at
    baseline:
      claim_free_rate: '1.0'
    evidence:
    - date
    cross_difficulty: null
  - id: vehicle_care_standing
    effect: parameter
    decides: care_rate
    bindings:
    - care_plan_state
    - service_credits_left
    - care_rate
    ladder:
    - when: the vehicle carries an active care plan with included services still to run
      value: the marketplace's maintained-vehicle rate
    - when: the vehicle carries an active care plan whose included services are used up
      value: the marketplace's part-maintained rate
    - when: the vehicle carries no active care plan
      value: the whole of the figure the rates before it leave
    baseline:
      care_rate: '1.0'
    evidence:
    - cross_category
    cross_difficulty: service
  - id: vehicle_value_loading
    effect: parameter
    decides: value_loading
    bindings:
    - listing_valuation
    - listing_class
    - value_loading
    ladder:
    - when: the marketplace's valuation of the vehicle reaches the marketplace's high-value share mark and the vehicle's
        listing sits in a value class above the marketplace's standard class
      value: the marketplace's high-value loading
    - when: that valuation reaches the mark and the listing sits in the standard class or below it
      value: the marketplace's standard-value loading
    - when: the valuation does not reach the mark
      value: no loading is applied
    baseline:
      value_loading: '1.0'
    evidence:
    - cross_category
    cross_difficulty: listings
  baseline:
    rule: Every accepted loss carries the host's own share, booked against the enrolment the claim was made under.
      The host's share of an accepted loss is measured at the deductible the plan publishes, carried in full, and
      it is never more than the money the plan accepted on the claim, which the marketplace takes as the largest
      amount an appraisal on the enrolment has booked as owed to the host. The share is rounded half up to two decimal
      places once, after every rate has been applied, and the ceiling on it is applied to that rounded figure. Every
      figure the plan publishes, its deductible, its claim-free discount, its qualifying period and the waiver period
      among them, is read from the plan the enrolment is written on.
    params:
    - host_deductible_amount
    - claim_free_discount_percent
    - claim_free_qualifying_months
    - deductible_waiver_after_claim_free_months
  inputs:
    history:
    - table: hostplan_claims
      aggregate: max
      field: amount_delta
