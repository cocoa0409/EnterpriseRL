category: hostplan
display_name: Keyturn Host Protection Plan

binding:
  holding_table: hostplan_enrollments
  event_tables: [hostplan_claims]
  intake_tables: [hostplan_claim_intake]
  status_field: status
  variant_field: protection_plan_name
  quantity_fields:
    reimbursement_balance_due: claim_reimbursement
    liability_balance_due: host_liability

lifecycle:
  states: [applied, pending_review, active, suspended, lapsed, cancelled]
  transitions:
    - {from: applied, to: pending_review, by: system, means: The application is queued for the protection team to look at.}
    - {from: applied, to: cancelled, by: user, means: The host withdraws the application before it is looked at.}
    - {from: pending_review, to: active, by: agent, means: The protection team accepts the vehicle onto the plan and cover begins.}
    - {from: pending_review, to: cancelled, by: agent, means: The protection team declines the vehicle and no cover begins.}
    - {from: active, to: suspended, by: agent, means: Cover is paused while something about the vehicle or the host is unresolved.}
    - {from: suspended, to: active, by: agent, means: What suspended the cover is resolved and cover resumes.}
    - {from: active, to: lapsed, by: system, means: Cover falls away because the host stopped meeting the plan's standing conditions.}
    - {from: suspended, to: lapsed, by: system, means: A suspension runs past the reinstatement window and the cover falls away.}
    - {from: lapsed, to: active, by: agent, means: A lapsed enrolment is reinstated inside the reinstatement window.}
    - {from: active, to: cancelled, by: user, means: The host ends the protection on their own vehicle.}
    - {from: suspended, to: cancelled, by: user, means: The host ends a suspended protection rather than resolving it.}
    - {from: lapsed, to: cancelled, by: system, means: A lapsed enrolment passes its reinstatement window and is closed for good.}

accounts:
  - key: claim_reimbursement
    unit: USD
    meaning: Money the marketplace owes this host on losses it has accepted, raised by an appraisal and cleared when it is paid.
  - key: host_liability
    unit: USD
    meaning: Money the host owes as their own share of losses, raised by a deductible and cleared when it is recovered.

parameter_schema:
  host_earnings_share_percent: Share of the trip price the host keeps under this plan, as a percentage.
  host_deductible_amount: The host's own share of each accepted loss, in USD.
  physical_damage_limit_amount: Ceiling on what the plan pays for damage to the host's own vehicle, in USD.
  liability_limit_amount: Ceiling on third-party liability cover carried with the plan, in USD.
  exterior_damage_sublimit_amount: Ceiling on body and paint damage within the physical damage limit, in USD.
  interior_damage_sublimit_amount: Ceiling on upholstery and trim damage within the physical damage limit, in USD.
  glass_sublimit_amount: Ceiling on glass and windscreen damage, in USD.
  tyres_wheels_sublimit_amount: Ceiling on tyre and wheel damage, in USD.
  missing_equipment_sublimit_amount: Ceiling on equipment removed from the vehicle, in USD.
  third_party_property_sublimit_amount: Ceiling on damage the guest causes to other people's property, in USD.
  mechanical_cover_included: Whether mechanical breakdown during a trip is covered (true/false switch).
  theft_cover_included: Whether theft and total loss are covered (true/false switch).
  diminished_value_covered: Whether the value a repaired vehicle loses is covered (true/false switch).
  wear_and_tear_excluded: Whether ordinary wear is excluded from cover (true/false switch).
  mechanical_failure_excluded: Whether failure with no trip event behind it is excluded (true/false switch).
  unauthorised_driver_exclusion: Whether a loss under an undeclared driver is excluded (true/false switch).
  loss_of_use_daily_amount: Daily sum paid to the host while the vehicle is off the road, in USD.
  loss_of_use_max_days: Longest period loss of use is paid for, in calendar days.
  towing_and_storage_limit_amount: Ceiling on towing and storage arising from a loss, in USD.
  rental_reimbursement_daily_amount: Daily sum toward a replacement vehicle for the host, in USD.
  claim_filing_window_hours: Hours after the trip ends within which a loss must be reported.
  claim_intake_evidence_days: Calendar days the host has to complete the evidence on a lodged report.
  evidence_minimum_photo_count: Photographs required before a report becomes a claim.
  appraisal_response_days: Business days the marketplace takes to appraise a completed claim.
  photo_estimate_threshold_amount: Claim value above which a photo estimate is not accepted, in USD.
  total_loss_threshold_percent: Repair cost as a percentage of market value above which the vehicle is written off.
  reimbursement_payment_days: Business days from acceptance to the money reaching the host.
  supplement_window_days: Calendar days after appraisal within which further cost may be added to a claim.
  supplement_max_percent: Ceiling on a supplement as a percentage of the original appraisal.
  appeal_window_days: Calendar days after a denial within which the host may appeal.
  appeal_max_count: Appeals allowed on one claim.
  liability_finding_review_days: Business days the marketplace takes to settle who was at fault.
  recovery_pursuit_days: Calendar days the marketplace pursues recovery from a third party before closing it.
  appraisal_share_percent: Share of an out-of-network appraisal the host pays, as a percentage.
  claim_free_discount_percent: Discount on the plan's deductible earned by staying claim free, as a percentage.
  claim_free_qualifying_months: Consecutive claim-free months needed to earn the discount.
  deductible_waiver_after_claim_free_months: Consecutive claim-free months after which the deductible is waived entirely.
  claims_per_year_before_review: Accepted claims in a rolling year that put the enrolment in front of a reviewer.
  claims_per_year_before_suspension: Accepted claims in a rolling year that suspend the enrolment.
  plan_change_notice_days: Calendar days' notice a host must give to change plan.
  plan_change_effective_rule_days: Calendar days after notice on which a plan change takes effect.
  plan_downgrade_lockout_days: Calendar days a host must wait before moving to a lower plan again.
  minimum_enrollment_days: Shortest period an enrolment must run before it may be ended, in calendar days.
  cancellation_notice_days: Calendar days' notice a host must give to end the protection.
  reinstatement_window_days: Calendar days after a lapse within which cover may be restored.
  reinstatement_fee_amount: Fee to restore lapsed cover, in USD.
  lapse_after_unpaid_days: Calendar days an unpaid host liability may stand before cover lapses.
  vehicle_age_max_years: Oldest vehicle the plan accepts, in whole years from the model year.
  vehicle_odometer_max_miles: Highest odometer reading the plan accepts, in miles.
  declared_value_min_amount: Lowest vehicle value the plan accepts, in USD.
  declared_value_max_amount: Highest vehicle value the plan accepts, in USD.
  eligible_title_statuses: The title statuses the plan will write cover on, as a list of title status values.
  eligible_regions: The territories the plan is written for, as a list of protection region values.
  inspection_required_before_activation: Whether a passed inspection is needed before cover begins (true/false switch).
  annual_inspection_required: Whether cover requires an inspection every year (true/false switch).
  roadside_included: Whether roadside assistance comes with the plan (true/false switch).
  roadside_callout_allowance_count: Roadside callouts included in a plan year.
  trip_fee_offset_percent: Share of the marketplace trip fee the plan gives back to the host, as a percentage.
  commercial_use_allowed: Whether the vehicle may be used commercially between trips (true/false switch).
  out_of_region_trip_cover_days: Consecutive days a trip may run outside the enrolment's region and stay covered.

