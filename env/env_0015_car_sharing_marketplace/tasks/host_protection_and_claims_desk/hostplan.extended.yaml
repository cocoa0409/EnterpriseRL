    - title_status
    - odometer_miles
    - listings_inspections.inspection_outcome
    - listings_inspections.record_date
    note: The vehicle's valuation and title decide the high-value addition, and its odometer and inspection record
      decide the stale-inspection addition.
  compute:
  - plan_evidence_minimum: K('evd_s90') if F('protection_plan_name') == 'Keyturn Shield 90 Host Plan' else (K('evd_s85')
      if F('protection_plan_name') == 'Keyturn Shield 85 Host Plan' else (K('evd_s80') if F('protection_plan_name')
      == 'Keyturn Shield 80 Host Plan' else (K('evd_s75') if F('protection_plan_name') == 'Keyturn Shield 75 Host
      Plan' else (K('evd_s70') if F('protection_plan_name') == 'Keyturn Shield 70 Host Plan' else (K('evd_s60'))))))
  - care_plan_status: CFIELD('service','status', vehicle_id=F('vehicle_id'))
  - completed_visits_6m: XCOUNT('service','service_visits', within_months=6, date_field='visit_date', vehicle_id=F('vehicle_id'),
      outcome='completed')
  - evidence_required: (int(plan_evidence_minimum / 2) + (1 if plan_evidence_minimum / 2 > int(plan_evidence_minimum
      / 2) else 0)) if (care_plan_status == 'active' and completed_visits_6m >= 2) else ((int(plan_evidence_minimum
      * 0.75) + (1 if plan_evidence_minimum * 0.75 > int(plan_evidence_minimum * 0.75) else 0)) if (care_plan_status
      == 'active' and completed_visits_6m < 2) else plan_evidence_minimum)
  - listing_valuation: CFIELD('listings','market_value_amount', vehicle_id=F('vehicle_id'))
  - listing_title: CFIELD('listings','title_status', vehicle_id=F('vehicle_id'))
  - high_value_addition: K('high_value_financed_documents') if (listing_valuation >= K('high_value_documentation_amount')
      and listing_title != 'clean') else (K('high_value_owned_documents') if (listing_valuation >= K('high_value_documentation_amount')
      and listing_title == 'clean') else 0)
  - reports_12m: COUNT('hostplan_claim_intake', within_months=12, date_field='reported_at')
  - unfinished_reports_12m: COUNT('hostplan_claim_intake', within_months=12, date_field='reported_at', intake_status='closed_incomplete')
  - reporting_addition: K('unfinished_reporting_documents') if (reports_12m >= 2 and unfinished_reports_12m >= 1)
      else (K('frequent_reporting_documents') if (reports_12m >= 2 and unfinished_reports_12m < 1) else 0)
  - months_since_passed_inspection: MONTHS(XLATEST('listings','listings_inspections','record_date', date_field='record_date',
      vehicle_id=F('vehicle_id'), event_type='listings_inspection_completed', inspection_outcome='passed'), NOW)
  - listing_odometer: CFIELD('listings','odometer_miles', vehicle_id=F('vehicle_id'))
  - inspection_addition: K('stale_inspection_high_mileage_documents') if (months_since_passed_inspection >= K('inspection_recency_months')
      and listing_odometer > K('high_mileage_mark')) else (K('stale_inspection_documents') if (months_since_passed_inspection
      >= K('inspection_recency_months') and listing_odometer <= K('high_mileage_mark')) else 0)
  - result: MX(1, evidence_required + high_value_addition + reporting_addition + inspection_addition)
  compute_basis:
    plan_evidence_minimum: Every figure the plan publishes, the evidence minimum among them, is read from the plan
