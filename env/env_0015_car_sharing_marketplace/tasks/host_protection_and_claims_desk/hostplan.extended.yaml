    condition: An appraisal record stands on the claim with the money the plan accepted booked as owed to the host
      on the enrolment.
    resolved_by: record_loss_appraisal_09001cb5
    effect: The money booked as owed on the claim is what the share is measured against and capped by, so the binding
      accepted_standing takes that amount instead of nothing.
  cross_category:
  - category: service
    as: branch
    reads:
    - status
