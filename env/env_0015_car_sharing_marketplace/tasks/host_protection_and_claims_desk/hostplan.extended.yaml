events:
  - type: hostplan_enrollment_opened
    target: hostplan_enrollments
    mutation: create
    meaning: A host puts one of their vehicles forward for protection under a named plan.
    grain: One row per vehicle a host asks to have protected.
    fields:
      enrollment_id: Reference number of the enrolment.
      customer_id: The host asking for protection.
      vehicle_id: The vehicle to be protected.
      protection_plan_name: The plan applied for.
      status: Lifecycle state, which a new enrolment enters as applied.
      enrolled_date: Date the application was made.
      protection_region: The territory the cover is asked for in.
      vehicle_value_declared_amount: The value the host declares for the vehicle.
      reimbursement_balance_due: Money owed to the host, zero at application.
      liability_balance_due: Money owed by the host, zero at application.
      claim_free_since_date: Date from which this enrolment counts as claim free.
      suspension_reason: Why cover is paused, which is none at application.
    triggers: []
  - type: hostplan_enrollment_activated
    target: hostplan_enrollments
    mutation: {transition: {from: pending_review, to: active}}
    meaning: The protection team accepts the vehicle and cover starts running.
    grain: One row per enrolment, updated once when cover starts.
    fields:
      status: Lifecycle state, which becomes active.
      effective_date: First date on which trips on this vehicle are protected.
      claim_free_since_date: Date the claim-free clock starts from.
    triggers: []
  - type: hostplan_plan_changed
    target: hostplan_enrollments
    mutation: update
    meaning: The host moves the vehicle from one protection plan to another, or restates its declared value.
    grain: One row per enrolment, updated once per accepted plan change.
    fields:
      protection_plan_name: The plan the enrolment moves to.
      plan_change_effective_date: Date the new plan starts applying from.
      vehicle_value_declared_amount: The value declared under the new plan.
    triggers: []
  - type: hostplan_enrollment_suspended
    target: hostplan_enrollments
    mutation: {transition: {from: active, to: suspended}}
    meaning: Cover is paused because something about the vehicle, the host or an unpaid balance is unresolved.
    grain: One row per enrolment, updated once per suspension.
    fields:
      status: Lifecycle state, which becomes suspended.
      suspension_reason: What caused the pause.
    triggers:
      - event: listings:listings_defect_reported
        when: {suspension_reason: inspection_overdue}
        map: {customer_id: customer_id, defect_code: none}
  - type: hostplan_enrollment_reinstated
    target: hostplan_enrollments
    mutation: {transition: [{from: suspended, to: active}, {from: lapsed, to: active}]}
    meaning: Cover that was paused or had fallen away is restored.
    grain: One row per enrolment, updated once per reinstatement.
    fields:
      status: Lifecycle state, which becomes active.
      effective_date: Date cover starts running again from.
      suspension_reason: Cleared back to none on reinstatement.
    triggers: []
  - type: hostplan_enrollment_ended
    target: hostplan_enrollments
    mutation: {transition: [{from: active, to: cancelled}, {from: suspended, to: cancelled}, {from: active, to: lapsed}, {from: suspended, to: lapsed}, {from: lapsed, to: cancelled}]}
    meaning: Protection on the vehicle comes to an end, whether the host ended it or it fell away.
    grain: One row per enrolment, updated once when cover ends.
    fields:
      status: Lifecycle state, which becomes lapsed or cancelled.
      ended_date: Date cover ceased.
      suspension_reason: The standing condition that was never resolved, where cover fell away.
    triggers: []

  - type: hostplan_claim_filed
    target: hostplan_claims
    meaning: A completed damage report becomes a claim on the enrolment, naming the trip the loss happened on.
    grain: One row per loss claimed on one enrolment for one trip.
    distinguish_by: [claim_date, loss_date, damage_category, claim_amount]
    fields:
      claim_id: Reference number of the claim.
      enrollment_id: The enrolment the claim is made under.
      customer_id: The host making the claim.
      booking_id: The trip the loss happened on.
      event_type: Event family of the record.
      claim_date: Date the claim was opened.
      loss_date: Date the loss occurred.
      damage_category: The kind of loss claimed.
      claim_amount: Amount claimed before appraisal.
      evidence_count: Photographs and documents on file.
      settlement_reference: The estimate or report reference the host quotes.
      decision_channel: Who took the record.
    triggers:
      - event: payouts:payouts_reserve_held
        map: {customer_id: customer_id, booking_id: booking_id, entry_basis: reserve_hold, hold_reason: claim_open}
  - type: hostplan_claim_appraised
    target: hostplan_claims
    meaning: The cost of the loss is established and the amount the marketplace accepts is booked as owed to the host.
    grain: One row per appraisal of one claim.
    account: claim_reimbursement
    direction: in
    distinguish_by: [claim_date, appraisal_amount, appraisal_channel, source_claim_id]
    fields:
      claim_id: Reference number of the appraisal record.
      enrollment_id: The enrolment the claim is made under.
      customer_id: The host the money is owed to.
      booking_id: The trip the loss happened on.
      source_claim_id: The claim this appraisal values.
      event_type: Event family of the record.
      claim_date: Date the appraisal was recorded.
      loss_date: Date the loss occurred.
      damage_category: The kind of loss appraised.
      appraisal_amount: What the appraisal says the loss costs.
      amount_delta: Money booked as owed to the host.
      liability_finding: Who was found responsible.
      appraisal_channel: How the loss was valued.
      decision_channel: Who took the decision.
      evidence_count: Photographs and documents relied on.
    triggers:
      - event: guestplan:guestplan_deductible_charged
        when: {liability_finding: guest_at_fault}
        map: {customer_id: customer_id, booking_id: booking_id, charge_basis: deductible, adjustment_reason: claim_settlement}
  - type: hostplan_supplement_added
    target: hostplan_claims
    meaning: Further cost found after the appraisal is added to an accepted claim.
    grain: One row per supplement raised against one appraised claim.
    account: claim_reimbursement
    direction: in
    distinguish_by: [claim_date, appraisal_amount, source_claim_id]
    fields:
      claim_id: Reference number of the supplement record.
      enrollment_id: The enrolment the claim is made under.
      customer_id: The host the money is owed to.
      booking_id: The trip the loss happened on.
      source_claim_id: The appraised claim the supplement adds to.
      event_type: Event family of the record.
      claim_date: Date the supplement was accepted.
      appraisal_amount: The further cost accepted.
      amount_delta: Money added to what is owed to the host.
      damage_category: The kind of loss the supplement belongs to.
      appraisal_channel: How the further cost was evidenced.
      decision_channel: Who accepted the supplement.
      settlement_reference: The supplementary invoice reference.
    triggers: []
  - type: hostplan_claim_denied
    target: hostplan_claims
    meaning: The marketplace refuses a claim and nothing is booked as owed.
    grain: One row per denial of one claim.
    distinguish_by: [claim_date, source_claim_id, damage_category]
    fields:
      claim_id: Reference number of the denial record.
      enrollment_id: The enrolment the claim was made under.
      customer_id: The host whose claim was refused.
      booking_id: The trip the loss was said to have happened on.
      source_claim_id: The claim being refused.
      event_type: Event family of the record.
      claim_date: Date the refusal was recorded.
      damage_category: The kind of loss refused.
      liability_finding: Who was found responsible.
      decision_channel: Who took the decision.
      evidence_count: Photographs and documents considered.
    triggers:
      - event: payouts:payouts_reserve_released
        map: {customer_id: customer_id, booking_id: booking_id, entry_basis: reserve_release, hold_reason: none}
  - type: hostplan_claim_withdrawn
    target: hostplan_claims
    meaning: The host takes their own claim back before it is settled.
    grain: One row per withdrawal of one claim.
    distinguish_by: [claim_date, source_claim_id, damage_category]
    fields:
      claim_id: Reference number of the withdrawal record.
      enrollment_id: The enrolment the claim was made under.
      customer_id: The host withdrawing.
      booking_id: The trip the loss was said to have happened on.
      source_claim_id: The claim being withdrawn.
      event_type: Event family of the record.
      claim_date: Date the withdrawal was recorded.
      damage_category: The kind of loss withdrawn.
      decision_channel: Who recorded the withdrawal.
    triggers:
      - event: payouts:payouts_reserve_released
        map: {customer_id: customer_id, booking_id: booking_id, entry_basis: reserve_release, hold_reason: none}
  - type: hostplan_deductible_charged
    target: hostplan_claims
    meaning: The host's own share of an accepted loss is booked against them.
    grain: One row per deductible raised on one accepted claim.
    account: host_liability
    direction: in
    distinguish_by: [claim_date, amount_delta, source_claim_id]
    fields:
      claim_id: Reference number of the deductible record.
      enrollment_id: The enrolment the deductible is raised on.
      customer_id: The host who owes it.
      booking_id: The trip the loss happened on.
      source_claim_id: The accepted claim the deductible belongs to.
      event_type: Event family of the record.
      claim_date: Date the deductible was raised.
