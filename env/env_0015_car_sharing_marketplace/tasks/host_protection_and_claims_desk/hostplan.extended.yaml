          timing: pre_action
          correlation_keys: [[hostplan_claims.source_claim_id]]
          action_bindings: {hostplan_claims.source_claim_id: source_claim_id}
        dedup_contract:
          table: hostplan_claims
          mode: separate_record
          object_bindings: {source_claim_id: source_claim_id}
          duplicate_filters: {event_type: [hostplan_reimbursement_paid]}
          distinct_fields: [claim_date, amount_delta, settlement_reference]
      - id: payout_account_not_on_hold
        applies_to: [hostplan_reimbursement_paid]
        kind: state
        condition: Where the host's payout account is on hold no claim money is released, since the hold exists precisely to stop money leaving while something is unresolved, and the host is told which hold is blocking it rather than simply that payment is delayed.
        evidence_fields: [payouts_accounts.status, payouts_accounts.customer_id, payouts_accounts.payout_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[payouts_accounts.payout_account_id]]
          action_bindings: {payouts_accounts.payout_account_id: payout_account_id}
        state_contract:
          field: payouts_accounts.status
          allowed: [active]
    params:
      per_tier:
