  - listing_valuation: CFIELD('listings','market_value_amount', vehicle_id=F('vehicle_id'))
  - listing_class: CFIELD('listings','value_class_name', vehicle_id=F('vehicle_id'))
  - value_loading: K('high_value_loading') if (listing_valuation >= K('high_value_share_mark') and listing_class
      != 'Keyturn Economy Class Listing' and listing_class != 'Keyturn Standard Class Listing' and listing_class
