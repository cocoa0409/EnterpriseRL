  - id: trips_evt_mileage_allowance
    subject: [trips_mileage_allowance_granted, trips_mileage_usage_recorded]
    rule: >-
      Included miles are granted to the reservation rather than to the guest: the plan's daily allowance multiplied by the reserved days, capped at the plan's per-booking ceiling however long the reservation runs.
      An approved extension grants further miles at the plan's extension allowance for each extended day, granted as its own record so that the allowance of the original period and of the extension remain separable.
      A guest may buy further miles in whole packages only; part packages are not sold, and a package bought mid-trip is granted in full and charged in full even where fewer miles are eventually driven.
      Where the plan offers unlimited mileage and the vehicle sits in the Keyturn Economy Class Listing or the Keyturn Standard Class Listing value class, no allowance is metered on the reservation and no mileage record is written at all; on any higher value class the plan's daily allowance applies as usual, because unlimited mileage is not offered on vehicles the marketplace values above the standard class.
      Driven miles are read from the odometer at handover and consume the allowance in the order the readings are taken. A telematics reading is authoritative where one exists; a host or guest reading stands only where no telematics reading covers the same handover, and a reading taken during a post-trip audit supersedes the reading taken at the return.
      Allowance records are written only while the reservation is in the booked, in_progress or completed state, so that no allowance can be moved on a reservation that has been cancelled or closed for billing.
    eligibility:
      - id: allowance_window_open
        applies_to: [trips_mileage_allowance_granted, trips_mileage_usage_recorded]
        kind: state
        condition: Allowance records are written only while the reservation is in the booked, in_progress or completed state, so that no allowance can be moved on a reservation that has been cancelled or closed for billing.
        evidence_fields: [trips_bookings.status, trips_bookings.booking_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[trips_bookings.booking_id]]
          action_bindings: {trips_bookings.booking_id: booking_id}
        state_contract:
          field: trips_bookings.status
          allowed: [booked, in_progress, completed]
    params:
      per_tier:
        Keyturn Hourly Rate Plan: {included_miles_per_day: "=included_miles_per_day", included_miles_cap_per_booking: "=included_miles_cap_per_booking", extension_included_miles_per_day: "=extension_included_miles_per_day", extra_miles_package_size_miles: "=extra_miles_package_size_miles", extra_miles_package_price: "=extra_miles_package_price", unlimited_mileage_available: "=unlimited_mileage_available"}
        Keyturn Daily Rate Plan: {included_miles_per_day: "=included_miles_per_day", included_miles_cap_per_booking: "=included_miles_cap_per_booking", extension_included_miles_per_day: "=extension_included_miles_per_day", extra_miles_package_size_miles: "=extra_miles_package_size_miles", extra_miles_package_price: "=extra_miles_package_price", unlimited_mileage_available: "=unlimited_mileage_available"}
        Keyturn Weekend Rate Plan: {included_miles_per_day: "=included_miles_per_day", included_miles_cap_per_booking: "=included_miles_cap_per_booking", extension_included_miles_per_day: "=extension_included_miles_per_day", extra_miles_package_size_miles: "=extra_miles_package_size_miles", extra_miles_package_price: "=extra_miles_package_price", unlimited_mileage_available: "=unlimited_mileage_available"}
        Keyturn Weekly Rate Plan: {included_miles_per_day: "=included_miles_per_day", included_miles_cap_per_booking: "=included_miles_cap_per_booking", extension_included_miles_per_day: "=extension_included_miles_per_day", extra_miles_package_size_miles: "=extra_miles_package_size_miles", extra_miles_package_price: "=extra_miles_package_price", unlimited_mileage_available: "=unlimited_mileage_available"}
        Keyturn Monthly Rate Plan: {included_miles_per_day: "=included_miles_per_day", included_miles_cap_per_booking: "=included_miles_cap_per_booking", extension_included_miles_per_day: "=extension_included_miles_per_day", extra_miles_package_size_miles: "=extra_miles_package_size_miles", extra_miles_package_price: "=extra_miles_package_price", unlimited_mileage_available: "=unlimited_mileage_available"}
        Keyturn Extended Stay Rate Plan: {included_miles_per_day: "=included_miles_per_day", included_miles_cap_per_booking: "=included_miles_cap_per_booking", extension_included_miles_per_day: "=extension_included_miles_per_day", extra_miles_package_size_miles: "=extra_miles_package_size_miles", extra_miles_package_price: "=extra_miles_package_price", unlimited_mileage_available: "=unlimited_mileage_available"}
    formula:
      when: grant_reason == "plan_allowance"
      granted_days: max(1, round(reserved_hours_total / 24 + 0.49))
      miles_delta: min(included_miles_per_day * granted_days, included_miles_cap_per_booking)
  - id: trips_evt_mileage_overage
    subject: [trips_mileage_overage_charged]
    rule: >-
      Mileage is settled once, at the end of the trip, against the allowance standing on the reservation at that moment, including any miles granted by an extension or bought mid-trip.
      Miles beyond the allowance are charged at the plan's overage rate, after the plan's grace miles have been taken off the excess; the grace is a deduction from the excess and never a threshold that has to be crossed before any miles are charged.
      Where the reservation's unused allowance is zero or positive no overage line is raised at all, and no line is raised where the plan offers unlimited mileage on a vehicle eligible for it.
      Where the only odometer readings on file come from the host, the overage is charged on those readings but is capped at the excess the telematics record of the same trip would have produced where one exists; a dispute over the reading is settled on the authoritative reading rather than split between the two.
      The overage line is raised only while the reservation is in the completed or settled state, since the miles cannot be known before the vehicle is back.
    eligibility:
      - id: mileage_settled_after_return
        applies_to: [trips_mileage_overage_charged]
        kind: state
        condition: The overage line is raised only while the reservation is in the completed or settled state, since the miles cannot be known before the vehicle is back.
        evidence_fields: [trips_bookings.status, trips_bookings.booking_id, trips_bookings.miles_remaining]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[trips_bookings.booking_id]]
          action_bindings: {trips_bookings.booking_id: booking_id}
        state_contract:
          field: trips_bookings.status
          allowed: [completed, settled]
    params:
      per_tier:
        Keyturn Hourly Rate Plan: {mileage_overage_rate_per_mile: "=mileage_overage_rate_per_mile", mileage_overage_grace_miles: "=mileage_overage_grace_miles"}
        Keyturn Daily Rate Plan: {mileage_overage_rate_per_mile: "=mileage_overage_rate_per_mile", mileage_overage_grace_miles: "=mileage_overage_grace_miles"}
        Keyturn Weekend Rate Plan: {mileage_overage_rate_per_mile: "=mileage_overage_rate_per_mile", mileage_overage_grace_miles: "=mileage_overage_grace_miles"}
        Keyturn Weekly Rate Plan: {mileage_overage_rate_per_mile: "=mileage_overage_rate_per_mile", mileage_overage_grace_miles: "=mileage_overage_grace_miles"}
        Keyturn Monthly Rate Plan: {mileage_overage_rate_per_mile: "=mileage_overage_rate_per_mile", mileage_overage_grace_miles: "=mileage_overage_grace_miles"}
        Keyturn Extended Stay Rate Plan: {mileage_overage_rate_per_mile: "=mileage_overage_rate_per_mile", mileage_overage_grace_miles: "=mileage_overage_grace_miles"}
    formula:
      when_not: miles_remaining >= 0
      chargeable_miles: max(0, abs(miles_remaining) - mileage_overage_grace_miles)
      charge_amount: round(chargeable_miles * mileage_overage_rate_per_mile, 2)
  - id: trips_evt_fuel_settlement
    subject: [trips_fuel_level_recorded, trips_fuel_overage_charged]
    rule: >-
      The fuel tank or traction battery is read at the start of the trip and again at the return, and the shortfall is the start reading less the return reading, expressed in percentage points.
      A shortfall inside the plan's return tolerance is not charged at all; a shortfall beyond the tolerance is charged on the whole shortfall rather than on the part beyond the tolerance, together with the flat service fee for going out to fill or charge the vehicle.
      Combustion, diesel and hybrid vehicles are settled at the refuelling rate and the refuelling service fee; battery electric vehicles are settled at the recharge rate and the recharge service fee, and the two are never mixed on one reservation.
      Where the return reading is higher than the start reading nothing is charged and nothing is credited, because fuel left in the vehicle is a gift to the host and not a balance the marketplace settles.
      A fuel reading is recorded only while the reservation is in the in_progress, completed or settled state, and a reading taken before the trip started cannot settle it.
    eligibility:
      - id: fuel_reading_window
        applies_to: [trips_fuel_level_recorded, trips_fuel_overage_charged]
        kind: state
        condition: A fuel reading is recorded only while the reservation is in the in_progress, completed or settled state, and a reading taken before the trip started cannot settle it.
        evidence_fields: [trips_bookings.status, trips_bookings.booking_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[trips_bookings.booking_id]]
          action_bindings: {trips_bookings.booking_id: booking_id}
        state_contract:
          field: trips_bookings.status
          allowed: [in_progress, completed, settled]
    params:
      per_tier:
        Keyturn Hourly Rate Plan: {fuel_return_tolerance_percent: "=fuel_return_tolerance_percent", refuel_service_fee_amount: "=refuel_service_fee_amount", refuel_rate_per_percent: "=refuel_rate_per_percent", ev_recharge_service_fee_amount: "=ev_recharge_service_fee_amount", ev_recharge_rate_per_percent: "=ev_recharge_rate_per_percent"}
        Keyturn Daily Rate Plan: {fuel_return_tolerance_percent: "=fuel_return_tolerance_percent", refuel_service_fee_amount: "=refuel_service_fee_amount", refuel_rate_per_percent: "=refuel_rate_per_percent", ev_recharge_service_fee_amount: "=ev_recharge_service_fee_amount", ev_recharge_rate_per_percent: "=ev_recharge_rate_per_percent"}
        Keyturn Weekend Rate Plan: {fuel_return_tolerance_percent: "=fuel_return_tolerance_percent", refuel_service_fee_amount: "=refuel_service_fee_amount", refuel_rate_per_percent: "=refuel_rate_per_percent", ev_recharge_service_fee_amount: "=ev_recharge_service_fee_amount", ev_recharge_rate_per_percent: "=ev_recharge_rate_per_percent"}
        Keyturn Weekly Rate Plan: {fuel_return_tolerance_percent: "=fuel_return_tolerance_percent", refuel_service_fee_amount: "=refuel_service_fee_amount", refuel_rate_per_percent: "=refuel_rate_per_percent", ev_recharge_service_fee_amount: "=ev_recharge_service_fee_amount", ev_recharge_rate_per_percent: "=ev_recharge_rate_per_percent"}
        Keyturn Monthly Rate Plan: {fuel_return_tolerance_percent: "=fuel_return_tolerance_percent", refuel_service_fee_amount: "=refuel_service_fee_amount", refuel_rate_per_percent: "=refuel_rate_per_percent", ev_recharge_service_fee_amount: "=ev_recharge_service_fee_amount", ev_recharge_rate_per_percent: "=ev_recharge_rate_per_percent"}
        Keyturn Extended Stay Rate Plan: {fuel_return_tolerance_percent: "=fuel_return_tolerance_percent", refuel_service_fee_amount: "=refuel_service_fee_amount", refuel_rate_per_percent: "=refuel_rate_per_percent", ev_recharge_service_fee_amount: "=ev_recharge_service_fee_amount", ev_recharge_rate_per_percent: "=ev_recharge_rate_per_percent"}
    formula:
      when: charge_basis == "refuel_service"
      charge_amount: round(refuel_service_fee_amount + quantity_units * refuel_rate_per_percent, 2)
  - id: trips_evt_late_return
    subject: [trips_late_return_charged]
    rule: >-
      Lateness is measured from the scheduled return recorded on the reservation, including any approved extension, to the moment the vehicle is actually back with the host.
      Minutes inside the plan's grace are not charged. Beyond the grace the whole late period is charged by the hour at the plan's hourly late rate, the grace minutes being deducted from the late period before it is priced.
      Once lateness reaches the plan's escalation threshold the hourly charge stops and a whole further day at the locked daily rate is charged instead, and the day charge replaces the hourly charge rather than being added to it. No late-return charge for a single day exceeds the plan's daily cap.
      A guest whose count of late returns over the rolling one hundred and eighty days has reached three loses the grace altogether, and lateness is then charged from the scheduled return itself.
      Where the host could not take the vehicle back at the scheduled time, no late-return charge is raised for the period the host was unavailable, and the lateness is measured from the moment the host was able to receive it.
      A late-return line is raised only while the reservation is in the in_progress, completed or settled state.
    eligibility:
      - id: late_return_state
        applies_to: [trips_late_return_charged]
        kind: state
        condition: A late-return line is raised only while the reservation is in the in_progress, completed or settled state.
        evidence_fields: [trips_bookings.status, trips_bookings.booking_id, trips_bookings.trip_end_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[trips_bookings.booking_id]]
          action_bindings: {trips_bookings.booking_id: booking_id}
        state_contract:
          field: trips_bookings.status
          allowed: [in_progress, completed, settled]
    params:
      late_return_count_threshold: 3
      per_tier:
        Keyturn Hourly Rate Plan: {late_return_grace_minutes: "=late_return_grace_minutes", late_return_fee_per_hour: "=late_return_fee_per_hour", late_return_escalation_hours: "=late_return_escalation_hours", late_return_daily_cap_amount: "=late_return_daily_cap_amount", no_show_grace_minutes: "=no_show_grace_minutes", no_show_fee_amount: "=no_show_fee_amount"}
        Keyturn Daily Rate Plan: {late_return_grace_minutes: "=late_return_grace_minutes", late_return_fee_per_hour: "=late_return_fee_per_hour", late_return_escalation_hours: "=late_return_escalation_hours", late_return_daily_cap_amount: "=late_return_daily_cap_amount", no_show_grace_minutes: "=no_show_grace_minutes", no_show_fee_amount: "=no_show_fee_amount"}
        Keyturn Weekend Rate Plan: {late_return_grace_minutes: "=late_return_grace_minutes", late_return_fee_per_hour: "=late_return_fee_per_hour", late_return_escalation_hours: "=late_return_escalation_hours", late_return_daily_cap_amount: "=late_return_daily_cap_amount", no_show_grace_minutes: "=no_show_grace_minutes", no_show_fee_amount: "=no_show_fee_amount"}
        Keyturn Weekly Rate Plan: {late_return_grace_minutes: "=late_return_grace_minutes", late_return_fee_per_hour: "=late_return_fee_per_hour", late_return_escalation_hours: "=late_return_escalation_hours", late_return_daily_cap_amount: "=late_return_daily_cap_amount", no_show_grace_minutes: "=no_show_grace_minutes", no_show_fee_amount: "=no_show_fee_amount"}
        Keyturn Monthly Rate Plan: {late_return_grace_minutes: "=late_return_grace_minutes", late_return_fee_per_hour: "=late_return_fee_per_hour", late_return_escalation_hours: "=late_return_escalation_hours", late_return_daily_cap_amount: "=late_return_daily_cap_amount", no_show_grace_minutes: "=no_show_grace_minutes", no_show_fee_amount: "=no_show_fee_amount"}
        Keyturn Extended Stay Rate Plan: {late_return_grace_minutes: "=late_return_grace_minutes", late_return_fee_per_hour: "=late_return_fee_per_hour", late_return_escalation_hours: "=late_return_escalation_hours", late_return_daily_cap_amount: "=late_return_daily_cap_amount", no_show_grace_minutes: "=no_show_grace_minutes", no_show_fee_amount: "=no_show_fee_amount"}
    formula:
      when: charge_basis == "late_return"
      billable_late_hours: max(0, quantity_units - late_return_grace_minutes / 60)
      charge_amount: min(round(billable_late_hours * late_return_fee_per_hour, 2), late_return_daily_cap_amount)
    measures: [trips_msr_late_returns_180d]
  - id: trips_cancellation
    subject: [trips_booking_cancelled, trips_cancellation_fee_charged]
    rule: >-
      A reservation can be ended before the trip starts by the guest, by the host or by the marketplace, and who ended it decides entirely what money moves.
      A cancellation fee is raised only where the guest gives notice of the cancellation after the free cancellation window has elapsed, counted forward from the confirmation of the reservation. The free cancellation window is counted in whole elapsed hours from the timestamp of confirmation rather than in calendar days, and the window is exhausted only once the last hour has fully elapsed, so notice given exactly at the boundary is still free.
      Where a fee is due it is a percentage of one locked daily rate plus the plan's flat component, and it never exceeds the plan's cancellation cap; the flat component is added to the percentage rather than taken as the higher of the two.
      A guest who never appears is treated as a no-show once the plan's no-show grace has run from the scheduled start, and the no-show fee replaces the cancellation fee rather than being charged alongside it.
      A cancellation by the host or by the marketplace raises no fee on the guest whatever the notice given; instead the guest is credited the plan's rebooking percentage of the trip price, and the credit lapses after the plan's validity period counted from the day it is issued.
      The marketplace trip fee follows the base rate: it is returned in full where the cancellation is free and kept in full where a cancellation fee is due, and it is never partly returned.
      Ending the reservation releases the reserved hours back to the host's calendar on the same day, and a reservation already in progress is never cancelled but returned early instead.
    eligibility:
      - id: free_window_elapsed
        applies_to: [trips_cancellation_fee_charged]
        kind: time
        condition: A cancellation fee is raised only where the guest gives notice of the cancellation after the free cancellation window has elapsed, counted forward from the confirmation of the reservation.
        evidence_fields: [trips_bookings.confirmed_date, trips_bookings.booking_id, trips_bookings.cancellation_initiator]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[trips_bookings.booking_id]]
          action_bindings: {trips_bookings.booking_id: booking_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the guest gives notice of the cancellation
          anchor_source: trips_bookings.confirmed_date
          relation: not_before
          duration_source: params.free_cancellation_window_hours
          unit: elapsed_hours
          counting_rule: The free cancellation window is counted in whole elapsed hours from the timestamp of confirmation rather than in calendar days, and the window is exhausted only once the last hour has fully elapsed, so notice given exactly at the boundary is still free.
          boundary: exclusive
      - id: cancellation_initiator_stated
        applies_to: [trips_booking_cancelled]
        kind: caller_fact
        condition: A reservation can be ended before the trip starts by the guest, by the host or by the marketplace, and who ended it decides entirely what money moves.
        evidence_fields: [trips_bookings.cancellation_initiator, trips_bookings.booking_id, trips_bookings.customer_id]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys: [[trips_bookings.booking_id]]
          action_bindings: {trips_bookings.booking_id: booking_id}
    params:
      per_tier:
        Keyturn Hourly Rate Plan: {free_cancellation_window_hours: "=free_cancellation_window_hours", cancellation_fee_percent_in_window: "=cancellation_fee_percent_in_window", cancellation_fee_flat_amount: "=cancellation_fee_flat_amount", cancellation_fee_cap_amount: "=cancellation_fee_cap_amount", no_show_grace_minutes: "=no_show_grace_minutes", no_show_fee_amount: "=no_show_fee_amount", rebooking_credit_percent: "=rebooking_credit_percent", rebooking_credit_validity_days: "=rebooking_credit_validity_days"}
        Keyturn Daily Rate Plan: {free_cancellation_window_hours: "=free_cancellation_window_hours", cancellation_fee_percent_in_window: "=cancellation_fee_percent_in_window", cancellation_fee_flat_amount: "=cancellation_fee_flat_amount", cancellation_fee_cap_amount: "=cancellation_fee_cap_amount", no_show_grace_minutes: "=no_show_grace_minutes", no_show_fee_amount: "=no_show_fee_amount", rebooking_credit_percent: "=rebooking_credit_percent", rebooking_credit_validity_days: "=rebooking_credit_validity_days"}
        Keyturn Weekend Rate Plan: {free_cancellation_window_hours: "=free_cancellation_window_hours", cancellation_fee_percent_in_window: "=cancellation_fee_percent_in_window", cancellation_fee_flat_amount: "=cancellation_fee_flat_amount", cancellation_fee_cap_amount: "=cancellation_fee_cap_amount", no_show_grace_minutes: "=no_show_grace_minutes", no_show_fee_amount: "=no_show_fee_amount", rebooking_credit_percent: "=rebooking_credit_percent", rebooking_credit_validity_days: "=rebooking_credit_validity_days"}
        Keyturn Weekly Rate Plan: {free_cancellation_window_hours: "=free_cancellation_window_hours", cancellation_fee_percent_in_window: "=cancellation_fee_percent_in_window", cancellation_fee_flat_amount: "=cancellation_fee_flat_amount", cancellation_fee_cap_amount: "=cancellation_fee_cap_amount", no_show_grace_minutes: "=no_show_grace_minutes", no_show_fee_amount: "=no_show_fee_amount", rebooking_credit_percent: "=rebooking_credit_percent", rebooking_credit_validity_days: "=rebooking_credit_validity_days"}
