# ---- data flow -----------------------------------------------------------------
events:
  - type: trips_booking_created
    target: trips_bookings
    mutation: create
    meaning: A guest opens a reservation on one listed vehicle for one date range.
    grain: One row per reservation a guest opens on one vehicle.
    account: booked_hours
    direction: in
    fields:
      booking_id: Reference number of the reservation.
      customer_id: The guest who is reserving.
      host_customer_id: The host whose vehicle is reserved.
      vehicle_id: The listing being reserved.
      election_id: The guest protection election attached to the reservation once one exists.
      rate_plan_name: The rate plan the reservation is priced under.
      status: Lifecycle state, which a new reservation enters as requested.
      requested_date: Date the reservation was opened.
      trip_start_date: First day reserved.
      trip_end_date: Last day reserved.
      daily_rate_amount: The host's daily price locked in for this reservation.
      reserved_hours_total: Hours of vehicle time the reservation puts on hold.
      included_miles_total: Included miles granted so far, zero at opening.
      miles_remaining: Unused included miles, zero at opening.
      balance_due: Money owed on the reservation, zero at opening.
      pickup_channel: How the guest will take the vehicle.
      delivery_location_type: Where the vehicle is delivered, when it is delivered.
      payment_method_last4: The card the trip charges will be taken from.
      promo_code_applied: Promotional code the guest quoted, when any.
    triggers:
      - event: guestplan:guestplan_election_created
        map: {customer_id: customer_id, booking_id: booking_id}
  - type: trips_booking_confirmed
    target: trips_bookings
    mutation: {transition: {from: requested, to: booked}}
    meaning: The reservation is confirmed against the host's calendar and the guest is committed to the trip.
    grain: One row per reservation, updated once when it is confirmed.
    fields:
      status: Lifecycle state, which becomes booked.
      confirmed_date: Date the reservation was confirmed.
      daily_rate_amount: The daily price locked in at confirmation.
      trip_start_date: First day reserved, as confirmed.
      trip_end_date: Last day reserved, as confirmed.
    triggers:
      - event: trips:trips_reservation_charge_posted
        map: {booking_id: booking_id, customer_id: customer_id, charge_basis: base_rate, billing_period: at_booking}
      - event: trips:trips_mileage_allowance_granted
        map: {booking_id: booking_id, customer_id: customer_id, grant_reason: plan_allowance, reading_point: at_booking}
  - type: trips_trip_started
    target: trips_bookings
    mutation: {transition: {from: booked, to: in_progress}}
    meaning: The guest checks the vehicle out and the trip clock starts running.
    grain: One row per reservation, updated once when the trip starts.
    fields:
      status: Lifecycle state, which becomes in_progress.
      actual_start_date: Date the guest actually took the vehicle.
    triggers:
      - event: trips:trips_fuel_level_recorded
        map: {booking_id: booking_id, customer_id: customer_id, reading_point: trip_start}
      - event: listings:listings_odometer_reported
        map: {customer_id: customer_id}
  - type: trips_trip_completed
    target: trips_bookings
    mutation: {transition: {from: in_progress, to: completed}}
    meaning: The guest returns the vehicle and the trip clock stops.
    grain: One row per reservation, updated once when the vehicle comes back.
    fields:
      status: Lifecycle state, which becomes completed.
      actual_end_date: Date the guest actually returned the vehicle.
    triggers:
      - event: trips:trips_mileage_usage_recorded
        map: {booking_id: booking_id, customer_id: customer_id, reading_point: trip_end}
      - event: trips:trips_fuel_level_recorded
        map: {booking_id: booking_id, customer_id: customer_id, reading_point: trip_end}
      - event: payouts:payouts_earning_posted
        map: {customer_id: customer_id, entry_basis: trip_earning}
  - type: trips_booking_settled
    target: trips_bookings
    mutation: {transition: {from: completed, to: settled}}
    meaning: Every end-of-trip charge has been posted and the reservation is closed for billing.
    grain: One row per reservation, updated once when billing closes.
    fields:
      status: Lifecycle state, which becomes settled.
      settled_date: Date billing was closed.
      balance_due: Money still owed once every end-of-trip line has been posted.
    triggers:
      - event: payouts:payouts_reserve_released
        map: {customer_id: customer_id, entry_basis: reserve_release}
  - type: trips_booking_cancelled
    target: trips_bookings
    mutation: {transition: [{from: requested, to: cancelled}, {from: booked, to: cancelled}]}
    meaning: The reservation ends before the trip starts, whoever ended it.
    grain: One row per reservation, updated once when it is cancelled.
    account: booked_hours
    direction: out
    fields:
      status: Lifecycle state, which becomes cancelled.
      cancelled_date: Date the reservation was ended.
      cancellation_initiator: Who ended it.
      reserved_hours_total: Hours released back to the host's calendar.
    triggers:
      - event: trips:trips_cancellation_fee_charged
        when: {cancellation_initiator: guest}
        map: {booking_id: booking_id, customer_id: customer_id, charge_basis: cancellation_fee, billing_period: at_booking}
      - event: trips:trips_refund_issued
        when: {cancellation_initiator: [host, keyturn]}
        map: {booking_id: booking_id, customer_id: customer_id, charge_basis: rebooking_credit, billing_period: at_booking}
      - event: guestplan:guestplan_election_voided
        map: {void_reason: booking_cancelled}

  - type: trips_mileage_allowance_granted
    target: trips_usage
    meaning: Included miles are added to the reservation, whether by the plan, by an extension or by a package the guest buys.
    grain: One row per grant of included miles to one reservation.
    account: mileage_allowance
    direction: in
    distinguish_by: [usage_date, reading_point, grant_reason, miles_delta]
    fields:
      usage_id: Reference number of the record.
      booking_id: The reservation the miles are granted to.
      customer_id: The guest holding the reservation.
      event_type: Event family of the record.
      usage_date: Date the miles were granted.
      reading_point: The moment in the trip the grant was made at.
      miles_delta: Miles added to the allowance, always positive here.
      grant_reason: Why the miles were granted.
      usage_source: Where the instruction to grant came from.
    triggers:
      - event: trips:trips_reservation_charge_posted
        when: {grant_reason: purchased_package}
        map: {booking_id: booking_id, customer_id: customer_id, charge_basis: extra_miles_package, billing_period: at_trip_start}
  - type: trips_mileage_usage_recorded
    target: trips_usage
    meaning: Driven miles are read off the odometer and consume the reservation's allowance.
    grain: One row per odometer reading taken against one reservation.
    account: mileage_allowance
    direction: out
    distinguish_by: [usage_date, reading_point, odometer_reading]
    fields:
      usage_id: Reference number of the record.
      booking_id: The reservation the miles were driven on.
      customer_id: The guest holding the reservation.
      event_type: Event family of the record.
      usage_date: Date the reading was taken.
      reading_point: The moment in the trip the reading was taken at.
      odometer_reading: The odometer shown at the reading.
      miles_delta: Miles taken off the allowance, always negative here.
      usage_source: Where the reading came from.
    triggers:
      - event: trips:trips_mileage_overage_charged
        when: {reading_point: trip_end}
        map: {booking_id: booking_id, customer_id: customer_id, charge_basis: mileage_overage, billing_period: at_trip_end}
  - type: trips_fuel_level_recorded
    target: trips_usage
    meaning: The fuel tank or traction battery level is read at a handover point.
    grain: One row per fuel or battery reading taken against one reservation.
    distinguish_by: [usage_date, reading_point, fuel_percent]
    fields:
      usage_id: Reference number of the record.
      booking_id: The reservation the reading belongs to.
      customer_id: The guest holding the reservation.
      event_type: Event family of the record.
      usage_date: Date the reading was taken.
      reading_point: The moment in the trip the reading was taken at.
      fuel_percent: Percentage points of tank or battery shown.
      fuel_type: What the vehicle runs on.
      usage_source: Where the reading came from.
    triggers:
      - event: trips:trips_fuel_overage_charged
        when: {reading_point: trip_end, fuel_type: [gasoline, diesel, hybrid]}
        map: {booking_id: booking_id, customer_id: customer_id, charge_basis: refuel_service, billing_period: at_trip_end}
      - event: trips:trips_fuel_overage_charged
        when: {reading_point: trip_end, fuel_type: battery_electric}
        map: {booking_id: booking_id, customer_id: customer_id, charge_basis: ev_recharge, billing_period: at_trip_end}

  - type: trips_reservation_charge_posted
    target: trips_charges
    meaning: One priced line of the reservation is posted to the guest, whether the base rate, the marketplace trip fee, a surcharge or an ancillary bought at booking.
    grain: One row per priced line raised against one reservation.
    account: guest_balance
    direction: in
    distinguish_by: [charge_basis, charge_date, quantity_units]
    fields:
      charge_id: Reference number of the line.
      booking_id: The reservation the line belongs to.
      customer_id: The guest being charged.
      event_type: Event family of the line.
      charge_date: Date the line was posted.
      charge_amount: Money the line takes from the guest.
      charge_basis: The priced item the line stands for.
      quantity_units: Units the line was priced on.
      unit_rate_amount: Price per unit applied.
      billing_period: The point in the trip the line falls due at.
      payment_channel: How the money is taken.
      waiver_code: The ground on which the line was waived, when it was.
    triggers:
      - event: payouts:payouts_deduction_posted
        when: {charge_basis: trip_fee}
        map: {customer_id: customer_id, entry_basis: marketplace_commission}
  - type: trips_extension_charge_posted
    target: trips_charges
    meaning: The extra time an approved extension adds to the reservation is priced and posted to the guest.
    grain: One row per approved extension of one reservation.
    account: guest_balance
    direction: in
    distinguish_by: [charge_date, quantity_units, unit_rate_amount]
    fields:
      charge_id: Reference number of the line.
      booking_id: The reservation being extended.
      customer_id: The guest being charged.
      event_type: Event family of the line.
      charge_date: Date the line was posted.
      charge_amount: Money the extension costs.
      charge_basis: The priced item, which is the extension rate.
      quantity_units: Extra hours priced.
      unit_rate_amount: Price per extended day applied.
      billing_period: The point in the trip the line falls due at.
      payment_channel: How the money is taken.
      waiver_code: The ground on which the line was waived, when it was.
    triggers:
      - event: trips:trips_mileage_allowance_granted
        map: {booking_id: booking_id, customer_id: customer_id, grant_reason: extension_allowance, reading_point: at_extension}
      - event: payouts:payouts_earning_posted
        map: {customer_id: customer_id, entry_basis: extension_earning}
  - type: trips_mileage_overage_charged
    target: trips_charges
    meaning: Miles driven beyond the reservation's allowance are priced and posted to the guest.
    grain: One row per mileage settlement of one reservation.
    account: guest_balance
    direction: in
    distinguish_by: [charge_date, quantity_units, unit_rate_amount]
    fields:
      charge_id: Reference number of the line.
      booking_id: The reservation the miles were driven on.
      customer_id: The guest being charged.
      event_type: Event family of the line.
      charge_date: Date the line was posted.
      charge_amount: Money the overage costs.
      charge_basis: The priced item, which is the mileage overage.
      quantity_units: Chargeable miles priced.
      unit_rate_amount: Price per mile applied.
      billing_period: The point in the trip the line falls due at.
      payment_channel: How the money is taken.
      waiver_code: The ground on which the line was waived, when it was.
    triggers:
      - event: payouts:payouts_earning_posted
        map: {customer_id: customer_id, entry_basis: mileage_overage_share}
  - type: trips_fuel_overage_charged
    target: trips_charges
    meaning: Fuel or charge the vehicle was returned short by is replaced at the guest's cost.
    grain: One row per fuel settlement of one reservation.
    account: guest_balance
    direction: in
    distinguish_by: [charge_basis, charge_date, quantity_units]
    fields:
      charge_id: Reference number of the line.
      booking_id: The reservation the vehicle was returned short on.
      customer_id: The guest being charged.
      event_type: Event family of the line.
      charge_date: Date the line was posted.
      charge_amount: Money the replacement costs.
      charge_basis: Whether the line replaces fuel or charge.
      quantity_units: Percentage points of tank or battery replaced.
      unit_rate_amount: Price per percentage point applied.
      billing_period: The point in the trip the line falls due at.
      payment_channel: How the money is taken.
      waiver_code: The ground on which the line was waived, when it was.
    triggers:
      - event: payouts:payouts_earning_posted
        map: {customer_id: customer_id, entry_basis: fuel_overage_share}
  - type: trips_late_return_charged
    target: trips_charges
    meaning: Time the guest kept the vehicle beyond the scheduled return is priced and posted.
    grain: One row per late-return settlement of one reservation.
    account: guest_balance
    direction: in
    distinguish_by: [charge_date, quantity_units, unit_rate_amount]
    fields:
      charge_id: Reference number of the line.
      booking_id: The reservation returned late.
      customer_id: The guest being charged.
      event_type: Event family of the line.
      charge_date: Date the line was posted.
      charge_amount: Money the late return costs.
      charge_basis: The priced item, which is the late return.
      quantity_units: Late hours priced.
      unit_rate_amount: Price per late hour applied.
      billing_period: The point in the trip the line falls due at.
      payment_channel: How the money is taken.
      waiver_code: The ground on which the line was waived, when it was.
    triggers:
      - event: payouts:payouts_earning_posted
        map: {customer_id: customer_id, entry_basis: late_return_share}
  - type: trips_cancellation_fee_charged
    target: trips_charges
    meaning: A guest who ends a confirmed reservation outside the free window is charged for it.
    grain: One row per cancellation settlement of one reservation.
    account: guest_balance
    direction: in
    distinguish_by: [charge_date, charge_amount, charge_basis]
    fields:
      charge_id: Reference number of the line.
      booking_id: The reservation that was cancelled.
      customer_id: The guest being charged.
      event_type: Event family of the line.
      charge_date: Date the line was posted.
      charge_amount: Money the cancellation costs.
      charge_basis: Whether the line is a cancellation fee or a no-show fee.
      quantity_units: Days of rate the fee was computed on.
      unit_rate_amount: Daily rate the fee was computed from.
      billing_period: The point in the trip the line falls due at.
      payment_channel: How the money is taken.
      waiver_code: The ground on which the line was waived, when it was.
    triggers:
      - event: payouts:payouts_earning_posted
        map: {customer_id: customer_id, entry_basis: cancellation_compensation}
  - type: trips_refund_issued
    target: trips_charges
    meaning: Money already taken from the guest is given back, in whole or in part, against one earlier line.
    grain: One row per refund raised against one earlier charge line.
    account: guest_balance
    direction: out
    distinguish_by: [charge_date, source_charge_id, charge_basis]
    fields:
      charge_id: Reference number of the refund line.
      booking_id: The reservation the refund belongs to.
      customer_id: The guest being refunded.
      source_charge_id: The earlier line this refund gives back against.
      event_type: Event family of the line.
      charge_date: Date the refund was posted.
      charge_amount: Money returned, always negative here.
      charge_basis: The ground the refund is raised on.
      quantity_units: Units being credited back.
      unit_rate_amount: Price per unit being credited back.
      billing_period: The point in the trip the refund is raised at.
      payment_channel: How the money is returned.
      waiver_code: The ground on which the refund was granted.
    triggers: []

# ---- derived measures ----------------------------------------------------------
measures:
  - id: trips_msr_completed_trips_12m
    window: Rolling 12 calendar months counted back from the handling date, the handling date included.
    measure: Count of trips_booking_settled events on bookings held by this guest.
  - id: trips_msr_late_returns_180d
    window: Rolling 180 calendar days counted back from the handling date, the handling date included.
    measure: Count of trips_late_return_charged lines raised against this guest across all of their bookings.
  - id: trips_msr_open_booking_hours
    window: Current portfolio state, with no time window.
    measure: Sum of reserved_hours_total over this guest's bookings in the requested, booked or in_progress states.

# ---- policies ------------------------------------------------------------------
policies:
  - id: trips_agg_multi_holding
    subject: [trips_booking_created]
    rule: >-
      A guest may hold more than one reservation at a time and there is no ceiling on how many reservations a guest may open over their lifetime on the marketplace.
      Each reservation is a contract in its own right: it carries its own rate plan, its own allowance and its own balance, and nothing is netted between two reservations.
      Where a guest holds several reservations, each is priced, cancelled and settled on its own terms, and a credit raised on one reservation is never applied against the balance of another.
    eligibility: []
    params: {max_per_customer: null}
  - id: trips_agg_concurrent_exposure
    subject: [trips_booking_created, trips_booking_confirmed]
    rule: >-
      The reservations a guest holds at once are read as one portfolio, not one at a time. A reservation is confirmed only while the vehicle's listing is live on the marketplace, so a vehicle that has been snoozed, suspended or delisted cannot take a new confirmation however far in advance the request was made.
      The number of reservations a guest may hold simultaneously in the requested, booked or in_progress states is capped per rate plan, and a request that would take the guest past that cap is left unconfirmed until one of the existing reservations settles or is cancelled.
      Two reservations the same guest holds must be separated by the overlap buffer of the higher-ranked of the two plans, measured between the scheduled return of the earlier and the scheduled start of the later; reservations that overlap or fall inside that buffer cannot both be confirmed.
      Where the guest already holds a reservation on the same vehicle over overlapping dates, the second reservation is refused outright rather than buffered, because one vehicle cannot serve two trips at once.
    eligibility:
      - id: vehicle_listing_live
        applies_to: [trips_booking_confirmed]
        kind: state
        condition: A reservation is confirmed only while the vehicle's listing is live on the marketplace, so a vehicle that has been snoozed, suspended or delisted cannot take a new confirmation however far in advance the request was made.
        evidence_fields: [listings_vehicles.status, listings_vehicles.vehicle_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[listings_vehicles.vehicle_id]]
          action_bindings: {listings_vehicles.vehicle_id: vehicle_id}
        state_contract:
          field: listings_vehicles.status
          allowed: [listed]
    params:
      per_tier:
        Keyturn Hourly Rate Plan: {max_concurrent_open_bookings: "=max_concurrent_open_bookings", overlap_buffer_hours: "=overlap_buffer_hours"}
        Keyturn Daily Rate Plan: {max_concurrent_open_bookings: "=max_concurrent_open_bookings", overlap_buffer_hours: "=overlap_buffer_hours"}
        Keyturn Weekend Rate Plan: {max_concurrent_open_bookings: "=max_concurrent_open_bookings", overlap_buffer_hours: "=overlap_buffer_hours"}
        Keyturn Weekly Rate Plan: {max_concurrent_open_bookings: "=max_concurrent_open_bookings", overlap_buffer_hours: "=overlap_buffer_hours"}
        Keyturn Monthly Rate Plan: {max_concurrent_open_bookings: "=max_concurrent_open_bookings", overlap_buffer_hours: "=overlap_buffer_hours"}
        Keyturn Extended Stay Rate Plan: {max_concurrent_open_bookings: "=max_concurrent_open_bookings", overlap_buffer_hours: "=overlap_buffer_hours"}
    measures: [trips_msr_open_booking_hours]
  - id: trips_booking_intake
    subject: [trips_booking_created, trips_booking_confirmed]
    rule: >-
      A reservation is opened against a named driver, and the driver on the reservation is the guest whose profile holds the card the trip charges will be taken from. The driver's licence must be unexpired on the first day of the reserved period, read from the expiry date printed on the licence held on the member profile, and a licence that expires during the reserved period bars the reservation for the whole period rather than part of it.
      The driver must be at least the plan's minimum driver age on the first day of the reserved period, and a driver below the young-driver threshold on that day pays the young-driver surcharge for the whole trip rather than for the days before their birthday.
      A request is confirmed only where the host records acceptance no later than the acceptance window counted forward from the moment the guest opened the reservation. The acceptance window is counted in whole elapsed hours from the timestamp on which the reservation was opened, never in calendar days, and an hour counts only once it has fully elapsed; a request still unaccepted at the boundary expires and must be opened again at the price then current.
      Instant book confirms a request without the host acting, but only on plans that offer it and only for a guest whose count of settled trips over the rolling twelve months reaches the plan's threshold; a guest below the threshold waits for the host however many trips they have taken in earlier years.
      The reserved period may not begin further ahead than the plan's advance booking horizon, and the reserved duration must fall between the plan's shortest and longest accepted reservation. Where the reserved period covers a Saturday night, the plan's weekend minimum applies and a shorter reservation is refused rather than rounded up.
    eligibility:
      - id: driver_licence_unexpired
        applies_to: [trips_booking_created]
        kind: authorization
        condition: The driver's licence must be unexpired on the first day of the reserved period, read from the expiry date printed on the licence held on the member profile, and a licence that expires during the reserved period bars the reservation for the whole period rather than part of it.
        evidence_fields: [customers.licence_expiry_date, customers.driver_licence_number, customers.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[customers.customer_id]]
          action_bindings: {customers.customer_id: customer_id}
      - id: host_acceptance_window
        applies_to: [trips_booking_confirmed]
        kind: time
        condition: A request is confirmed only where the host records acceptance no later than the acceptance window counted forward from the moment the guest opened the reservation.
        evidence_fields: [trips_bookings.requested_date, trips_bookings.booking_id, trips_bookings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[trips_bookings.booking_id]]
          action_bindings: {trips_bookings.booking_id: booking_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the host records acceptance
          anchor_source: trips_bookings.requested_date
          relation: not_after
          duration_source: params.host_acceptance_window_hours
          unit: elapsed_hours
          counting_rule: The acceptance window is counted in whole elapsed hours from the timestamp on which the reservation was opened, never in calendar days, and an hour counts only once it has fully elapsed; a request still unaccepted at the boundary expires and must be opened again at the price then current.
          boundary: inclusive
    params:
      per_tier:
        Keyturn Hourly Rate Plan: {host_acceptance_window_hours: "=host_acceptance_window_hours", minimum_driver_age_years: "=minimum_driver_age_years", advance_booking_max_days: "=advance_booking_max_days", instant_book_enabled: "=instant_book_enabled", min_completed_trips_for_instant_book: "=min_completed_trips_for_instant_book", weekend_minimum_nights: "=weekend_minimum_nights"}
        Keyturn Daily Rate Plan: {host_acceptance_window_hours: "=host_acceptance_window_hours", minimum_driver_age_years: "=minimum_driver_age_years", advance_booking_max_days: "=advance_booking_max_days", instant_book_enabled: "=instant_book_enabled", min_completed_trips_for_instant_book: "=min_completed_trips_for_instant_book", weekend_minimum_nights: "=weekend_minimum_nights"}
        Keyturn Weekend Rate Plan: {host_acceptance_window_hours: "=host_acceptance_window_hours", minimum_driver_age_years: "=minimum_driver_age_years", advance_booking_max_days: "=advance_booking_max_days", instant_book_enabled: "=instant_book_enabled", min_completed_trips_for_instant_book: "=min_completed_trips_for_instant_book", weekend_minimum_nights: "=weekend_minimum_nights"}
        Keyturn Weekly Rate Plan: {host_acceptance_window_hours: "=host_acceptance_window_hours", minimum_driver_age_years: "=minimum_driver_age_years", advance_booking_max_days: "=advance_booking_max_days", instant_book_enabled: "=instant_book_enabled", min_completed_trips_for_instant_book: "=min_completed_trips_for_instant_book", weekend_minimum_nights: "=weekend_minimum_nights"}
        Keyturn Monthly Rate Plan: {host_acceptance_window_hours: "=host_acceptance_window_hours", minimum_driver_age_years: "=minimum_driver_age_years", advance_booking_max_days: "=advance_booking_max_days", instant_book_enabled: "=instant_book_enabled", min_completed_trips_for_instant_book: "=min_completed_trips_for_instant_book", weekend_minimum_nights: "=weekend_minimum_nights"}
        Keyturn Extended Stay Rate Plan: {host_acceptance_window_hours: "=host_acceptance_window_hours", minimum_driver_age_years: "=minimum_driver_age_years", advance_booking_max_days: "=advance_booking_max_days", instant_book_enabled: "=instant_book_enabled", min_completed_trips_for_instant_book: "=min_completed_trips_for_instant_book", weekend_minimum_nights: "=weekend_minimum_nights"}
    measures: [trips_msr_completed_trips_12m]
  - id: trips_evt_reservation_pricing
    subject: [trips_reservation_charge_posted]
    rule: >-
      The reservation is priced from the daily rate the host had published at the moment the reservation was confirmed, never the price showing today, and that locked rate is the basis of every later line raised on the reservation.
      The base rate is the locked daily rate multiplied by the reserved days, where reserved days are the reserved hours divided by twenty-four and rounded up to the next whole day, with a floor of one day. Reservations running a week or more take the plan's weekly discount off the base rate, and reservations running a month or more take the monthly discount instead of the weekly one rather than on top of it.
      The marketplace trip fee is a percentage of the discounted base rate and is never lower than the plan's trip fee floor; where the percentage yields less than the floor, the floor is charged.
      A driver under the young-driver threshold on the first day of the reserved period pays the young-driver surcharge on the discounted base rate, posted as its own line so that it can be reversed on its own if the driver's age is later corrected.
      Delivery is charged only where the vehicle is brought to the guest, and the airport surcharge is added on top of the delivery fee when the delivery point is an airport; where the guest collects the vehicle themselves neither line is raised, and a line that is not raised is not the same as a line raised at zero.
      A refundable deposit is authorised at confirmation unless the guest's driver score reaches the plan's waiver score, in which case no deposit line is raised at all; where a deposit is taken it is released after the plan's hold period counted from the day the trip ends.
      Every line carries the basis it was priced on, so that two lines posted on the same day for the same reservation are always separable, and a line is posted only while the reservation is in the requested, booked or in_progress state.
    eligibility:
      - id: booking_open_for_pricing
        applies_to: [trips_reservation_charge_posted]
        kind: state
        condition: a line is posted only while the reservation is in the requested, booked or in_progress state
        evidence_fields: [trips_bookings.status, trips_bookings.booking_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[trips_bookings.booking_id]]
          action_bindings: {trips_bookings.booking_id: booking_id}
        state_contract:
          field: trips_bookings.status
          allowed: [requested, booked, in_progress]
    params:
      per_tier:
