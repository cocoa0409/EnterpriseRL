    factors:
      - id: lapsed_request_uplift
        effect: parameter
        decides: uplift
        bindings: [days_run_b, expired_count, declined_count, uplift]
        ladder:
          - when: "the reservation carries an extension request that expired without a decision and the trip has run for at least seven days"
            value: "K('uplift_repeat')"
          - when: "the reservation carries no request that expired without a decision but carries one that was declined, and the trip has run for at least seven days"
            value: "K('uplift_declined')"
          - when: "otherwise"
            value: "K('uplift_standard')"
        baseline:
          uplift: "K('uplift_standard')"
        evidence: [history, date]
        cross_difficulty: null
      - id: quoted_time_selection
        effect: method
        decides: extra_hours
        bindings: [expired_hours, declined_hours, extra_hours]
        ladder:
          - when: "the reservation carries an extension request that expired without a decision and the trip has run for at least seven days"
            method: "the extra time quoted is the extra time that expired request asked for, and where more than one such request stands the one read is the latest of them by the time it was put on the register"
          - when: "the reservation carries no request that expired without a decision but carries one that was declined, and the trip has run for at least seven days"
            method: "the extra time quoted is the extra time that declined request asked for, and where more than one such request stands the one read is the latest of them by the time it was put on the register, held to the longest further time the reservation can still take"
          - when: "otherwise"
            method: "the extra time quoted is the longest further time the reservation can still take"
        baseline:
          extra_hours: "K('max_extra_hours')"
        evidence: [history, date]
        cross_difficulty: null
      - id: young_driver_share_basis
        effect: method
        decides: yd_share
        bindings: [surcharge_line, reserved_days_b, yd_share]
        ladder:
          - when: "a young-driver surcharge stands on the reservation and the extra time quoted runs to two days or more"
            method: "the young-driver share is that surcharge - every young-driver surcharge line standing on the reservation taken together, as each was raised and whatever was afterwards done about it - spread evenly over the days of the reserved period - which run from the first day of that period to the last, both days counted - and taken for each extended day, the share being brought to the nearest cent once the spreading and the taking have both been done and at no earlier step"
          - when: "a young-driver surcharge stands on the reservation and the extra time quoted runs to less than two days"
            method: "the young-driver share is that surcharge spread evenly over the days of the reserved period - which run from the first day of that period to the last, both days counted - and taken for one day, the share being brought to the nearest cent once the spreading and the taking have both been done and at no earlier step"
          - when: "otherwise"
            method: "no young-driver share is added"
        baseline:
          yd_share: "0.0"
        evidence: [history, date]
        cross_difficulty: null
      - id: register_lodgement_charge
        effect: parameter
        decides: lodgement_charge
        bindings: [change_count, lodgement_charge]
        ladder:
          - when: "two or more extension requests already stand on the extension request register against the reservation"
            value: "K('lodgement_repeat')"
          - when: "one extension request already stands on the register against the reservation"
            value: "K('lodgement_first')"
          - when: "otherwise"
            value: "K('lodgement_none')"
        baseline:
          lodgement_charge: "K('lodgement_none')"
        evidence: [history]
        cross_difficulty: null
      - id: protection_cover_credit
        effect: parameter
        decides: cover_credit_day
        bindings: [elec_status_b, elec_fees_b, cover_credit_day]
        ladder:
          - when: "the trip's protection election stands active and the daily protection fees charged on it come to at least eight hundred dollars"
            value: "K('cover_credit_high')"
          - when: "the trip's protection election stands active and the daily protection fees charged on it come to less than eight hundred dollars"
            value: "K('cover_credit_low')"
          - when: "otherwise"
            value: "K('cover_credit_none')"
        baseline:
          cover_credit_day: "K('cover_credit_none')"
        evidence: [cross_category, history]
        cross_difficulty: guestplan
    baseline:
      rule: >-
        The quote is the price of the extended time, with the young-driver share and the register lodgement charge added to it and the cover credit taken off it, taken as nothing where that comes out below nothing, and brought to the nearest cent again once those have been put together; the cover credit is itself brought to the nearest cent when the credit for each extended day is taken for all of them.
        The price of the extended time is the locked daily rate of the reservation lifted by the extension uplift, taken for each extended day, where the extended days are the extra time quoted divided by twenty-four and rounded up to the next whole day, never fewer than one day; the lifted daily rate is brought to the nearest cent, and the price of the extended time is brought to the nearest cent in its turn.
        The standard extension uplift is eight per cent, the extra time quoted is the longest further time the reservation can still take, which is seventy-two hours, no young-driver share is added as standard, no register lodgement charge is made as standard, and no cover credit is given as standard.
      params: [uplift_standard, max_extra_hours, hours_in_day, lodgement_none, cover_credit_none]
    inputs:
      history:
        - {table: trips_extension_requests, aggregate: count, field: extension_request_id, within_months: null, filters: {request_status: expired}}
        - {table: trips_extension_requests, aggregate: latest, field: additional_hours, within_months: null, filters: {request_status: expired}}
        - {table: trips_charges, aggregate: sum, field: charge_amount, within_months: null, filters: {charge_basis: young_driver_surcharge}}
        - {category: guestplan, table: guestplan_charges, aggregate: sum, field: charge_amount, within_months: null, filters: {charge_basis: daily_protection_fee}}
      cross_category: [guestplan]
