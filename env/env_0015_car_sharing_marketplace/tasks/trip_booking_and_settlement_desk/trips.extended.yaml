    formula:
      when: charge_basis == "cancellation_fee"
      charge_amount: min(round(daily_rate_amount * cancellation_fee_percent_in_window / 100, 2) + cancellation_fee_flat_amount, cancellation_fee_cap_amount)
  - id: trips_evt_extension
    subject: [trips_extension_charge_posted]
    rule: >-
      A guest who wants the vehicle for longer asks for an extension, which is taken onto the extension request register rather than applied to the reservation straight away; the reservation's scheduled return moves only once the host has approved the request.
      The request must be made at least the plan's lead time before the scheduled return, and an extension asked for later than that is refused rather than priced at a premium. The extension is priced only where the host's decision is recorded no later than the decision window counted forward from the scheduled return of the reservation. The decision window is counted in whole elapsed hours from the scheduled return recorded on the reservation, never in calendar days, and an hour counts only once it has fully elapsed.
      One extension may not add more than the plan's maximum additional hours, and several extensions on one reservation are added together against that maximum rather than each being measured on its own.
      Extended time is priced at the locked daily rate lifted by the plan's uplift percentage, applied to the extended days only; the original period keeps its original price, and no discount for length is recalculated on the extended reservation.
      An approved extension grants the plan's extension mileage allowance for each extended day, and no marketplace trip fee is charged a second time on the extended time.
      A declined or expired request leaves the reservation untouched, and the guest who keeps the vehicle anyway is settled under the late-return rules rather than at the extension price.
    eligibility:
      - id: extension_decision_window
        applies_to: [trips_extension_charge_posted]
        kind: time
        condition: The extension is priced only where the host's decision is recorded no later than the decision window counted forward from the scheduled return of the reservation.
        evidence_fields: [trips_bookings.trip_end_date, trips_bookings.booking_id, trips_extension_requests.request_status, trips_extension_requests.extension_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[trips_extension_requests.extension_request_id], [trips_bookings.booking_id]]
          action_bindings: {trips_extension_requests.extension_request_id: extension_request_id, trips_bookings.booking_id: booking_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the host's decision is recorded
          anchor_source: trips_bookings.trip_end_date
          relation: not_after
          duration_source: params.extension_decision_window_hours
          unit: elapsed_hours
          counting_rule: The decision window is counted in whole elapsed hours from the scheduled return recorded on the reservation, never in calendar days, and an hour counts only once it has fully elapsed.
          boundary: inclusive
    params:
      per_tier:
        Keyturn Hourly Rate Plan: {extension_request_lead_hours: "=extension_request_lead_hours", extension_max_additional_hours: "=extension_max_additional_hours", extension_rate_uplift_percent: "=extension_rate_uplift_percent", extension_decision_window_hours: "=extension_decision_window_hours", extension_included_miles_per_day: "=extension_included_miles_per_day"}
        Keyturn Daily Rate Plan: {extension_request_lead_hours: "=extension_request_lead_hours", extension_max_additional_hours: "=extension_max_additional_hours", extension_rate_uplift_percent: "=extension_rate_uplift_percent", extension_decision_window_hours: "=extension_decision_window_hours", extension_included_miles_per_day: "=extension_included_miles_per_day"}
        Keyturn Weekend Rate Plan: {extension_request_lead_hours: "=extension_request_lead_hours", extension_max_additional_hours: "=extension_max_additional_hours", extension_rate_uplift_percent: "=extension_rate_uplift_percent", extension_decision_window_hours: "=extension_decision_window_hours", extension_included_miles_per_day: "=extension_included_miles_per_day"}
        Keyturn Weekly Rate Plan: {extension_request_lead_hours: "=extension_request_lead_hours", extension_max_additional_hours: "=extension_max_additional_hours", extension_rate_uplift_percent: "=extension_rate_uplift_percent", extension_decision_window_hours: "=extension_decision_window_hours", extension_included_miles_per_day: "=extension_included_miles_per_day"}
        Keyturn Monthly Rate Plan: {extension_request_lead_hours: "=extension_request_lead_hours", extension_max_additional_hours: "=extension_max_additional_hours", extension_rate_uplift_percent: "=extension_rate_uplift_percent", extension_decision_window_hours: "=extension_decision_window_hours", extension_included_miles_per_day: "=extension_included_miles_per_day"}
        Keyturn Extended Stay Rate Plan: {extension_request_lead_hours: "=extension_request_lead_hours", extension_max_additional_hours: "=extension_max_additional_hours", extension_rate_uplift_percent: "=extension_rate_uplift_percent", extension_decision_window_hours: "=extension_decision_window_hours", extension_included_miles_per_day: "=extension_included_miles_per_day"}
    formula:
      when: charge_basis == "extension_rate"
      extension_days: max(1, round(quantity_units / 24 + 0.49))
      charge_amount: round(daily_rate_amount * extension_days * (1 + extension_rate_uplift_percent / 100), 2)
  - id: trips_evt_refund
    subject: [trips_refund_issued]
    rule: >-
      Money is given back against one identified earlier line and never against the reservation as a whole, so every refund names the charge line it reverses and the reversal can never exceed what that line took.
      A line that has already been reversed in full is not reversed again, so where a refund line already stands against the same original charge and the earlier refund was not itself cancelled, the request is a duplicate and no further money moves.
      A partial reversal is allowed where only part of the original line is in dispute, and several partial reversals against one original line are allowed as long as their total stays inside the original amount; each carries its own date and ground so that two partial reversals of the same amount remain separable.
      The ground of the refund is recorded as given: a goodwill gesture, a host error, a marketplace error or a policy waiver, and the ground decides who ultimately bears the cost rather than whether the guest is made whole.
      Refunds reach the guest's card within the plan's processing period counted in business days from the day the refund is posted, and the marketplace does not pay interest for that period.
      Where the original line was taken from wallet credit rather than the card on file, the reversal returns wallet credit, because money is always returned by the route it arrived on.
    eligibility:
      - id: refund_not_already_made
        applies_to: [trips_refund_issued]
        kind: dedup
        condition: A line that has already been reversed in full is not reversed again, so where a refund line already stands against the same original charge and the earlier refund was not itself cancelled, the request is a duplicate and no further money moves.
        evidence_fields: [trips_charges.source_charge_id, trips_charges.event_type, trips_charges.charge_amount]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[trips_charges.source_charge_id]]
          action_bindings: {trips_charges.source_charge_id: source_charge_id}
        dedup_contract:
          table: trips_charges
          mode: separate_record
          object_bindings: {source_charge_id: source_charge_id}
          duplicate_filters: {event_type: [trips_refund_issued]}
          distinct_fields: [charge_date, charge_amount, waiver_code]
    params:
      per_tier:
        Keyturn Hourly Rate Plan: {refund_processing_days: "=refund_processing_days"}
        Keyturn Daily Rate Plan: {refund_processing_days: "=refund_processing_days"}
        Keyturn Weekend Rate Plan: {refund_processing_days: "=refund_processing_days"}
        Keyturn Weekly Rate Plan: {refund_processing_days: "=refund_processing_days"}
        Keyturn Monthly Rate Plan: {refund_processing_days: "=refund_processing_days"}
        Keyturn Extended Stay Rate Plan: {refund_processing_days: "=refund_processing_days"}
  - id: trips_settlement
    subject: [trips_trip_started, trips_trip_completed, trips_booking_settled]
    rule: >-
      A trip starts only once the vehicle has actually changed hands, and the start reading of the odometer and of the fuel level is taken at that moment; a reservation whose start reading is missing cannot later be settled on estimates.
      The trip may be closed out only while the reservation is in progress or already completed, which is what makes an early return a completion rather than a cancellation. Returning the vehicle early closes the trip on the day it comes back; where the plan credits early returns, the unused whole days are credited at the plan's early return percentage of the locked daily rate, and where the plan does not, nothing is credited however much time is left.
      Settlement is performed once every end-of-trip line that can arise has been posted or ruled out: the mileage settlement, the fuel settlement, any late return, and any cleaning, smoking or pet charge the host has evidenced. Settling a reservation with an end-of-trip line still outstanding is not permitted, because the settled state is what releases the host's money.
      Where the reservation carries a Keyturn Business Traveler Protection election, settlement waits until that protection election has itself been completed, since the corporate account is billed as one document covering the trip and its protection together.
      Tolls and citations reaching the marketplace after settlement are passed on to the guest with the plan's administration fee added, posted after settlement against the reservation they arose on rather than opening a new one.
      A reservation that reaches the settled state is never reopened; a correction after settlement is made as a reversal against the line that was wrong.
    eligibility:
      - id: trip_closeout_state
        applies_to: [trips_trip_completed]
        kind: state
        condition: The trip may be closed out only while the reservation is in progress or already completed, which is what makes an early return a completion rather than a cancellation.
        evidence_fields: [trips_bookings.status, trips_bookings.booking_id, trips_bookings.actual_start_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[trips_bookings.booking_id]]
          action_bindings: {trips_bookings.booking_id: booking_id}
        state_contract:
          field: trips_bookings.status
          allowed: [in_progress, completed]
      - id: end_of_trip_lines_posted
        applies_to: [trips_booking_settled]
        kind: authorization
        condition: Settling a reservation with an end-of-trip line still outstanding is not permitted, because the settled state is what releases the host's money.
        evidence_fields: [trips_charges.event_type, trips_charges.billing_period, trips_charges.booking_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[trips_charges.booking_id]]
          action_bindings: {trips_charges.booking_id: booking_id}
    params:
      per_tier:
        Keyturn Hourly Rate Plan: {early_return_credit_allowed: "=early_return_credit_allowed", early_return_credit_percent: "=early_return_credit_percent", toll_admin_fee_amount: "=toll_admin_fee_amount", citation_admin_fee_amount: "=citation_admin_fee_amount", cleaning_fee_amount: "=cleaning_fee_amount", smoking_violation_fee_amount: "=smoking_violation_fee_amount", pet_hair_fee_amount: "=pet_hair_fee_amount"}
        Keyturn Daily Rate Plan: {early_return_credit_allowed: "=early_return_credit_allowed", early_return_credit_percent: "=early_return_credit_percent", toll_admin_fee_amount: "=toll_admin_fee_amount", citation_admin_fee_amount: "=citation_admin_fee_amount", cleaning_fee_amount: "=cleaning_fee_amount", smoking_violation_fee_amount: "=smoking_violation_fee_amount", pet_hair_fee_amount: "=pet_hair_fee_amount"}
        Keyturn Weekend Rate Plan: {early_return_credit_allowed: "=early_return_credit_allowed", early_return_credit_percent: "=early_return_credit_percent", toll_admin_fee_amount: "=toll_admin_fee_amount", citation_admin_fee_amount: "=citation_admin_fee_amount", cleaning_fee_amount: "=cleaning_fee_amount", smoking_violation_fee_amount: "=smoking_violation_fee_amount", pet_hair_fee_amount: "=pet_hair_fee_amount"}
        Keyturn Weekly Rate Plan: {early_return_credit_allowed: "=early_return_credit_allowed", early_return_credit_percent: "=early_return_credit_percent", toll_admin_fee_amount: "=toll_admin_fee_amount", citation_admin_fee_amount: "=citation_admin_fee_amount", cleaning_fee_amount: "=cleaning_fee_amount", smoking_violation_fee_amount: "=smoking_violation_fee_amount", pet_hair_fee_amount: "=pet_hair_fee_amount"}
        Keyturn Monthly Rate Plan: {early_return_credit_allowed: "=early_return_credit_allowed", early_return_credit_percent: "=early_return_credit_percent", toll_admin_fee_amount: "=toll_admin_fee_amount", citation_admin_fee_amount: "=citation_admin_fee_amount", cleaning_fee_amount: "=cleaning_fee_amount", smoking_violation_fee_amount: "=smoking_violation_fee_amount", pet_hair_fee_amount: "=pet_hair_fee_amount"}
        Keyturn Extended Stay Rate Plan: {early_return_credit_allowed: "=early_return_credit_allowed", early_return_credit_percent: "=early_return_credit_percent", toll_admin_fee_amount: "=toll_admin_fee_amount", citation_admin_fee_amount: "=citation_admin_fee_amount", cleaning_fee_amount: "=cleaning_fee_amount", smoking_violation_fee_amount: "=smoking_violation_fee_amount", pet_hair_fee_amount: "=pet_hair_fee_amount"}
  - id: trips_evt_payment_recovery
    subject: [trips_reservation_charge_posted, trips_mileage_overage_charged, trips_fuel_overage_charged, trips_late_return_charged]
    rule: >-
      A trip charge that the card on file declines is re-presented on the plan's retry schedule: the plan's retry count, spaced by the plan's retry interval, and the interval is counted in whole elapsed hours from the previous attempt.
      Once the retries are exhausted the plan's late payment fee is added as its own line, and the reservation is marked as carrying an unpaid balance; the marketplace does not raise a second late payment fee on the same charge however long it stays unpaid.
      A guest carrying an unpaid balance on any reservation may not have a further reservation confirmed until the balance is cleared, and the balance is read per reservation rather than netted across the guest's portfolio.
      Where the guest pays by wallet credit, a shortfall is taken from the card on file for the difference rather than refusing the whole charge, and where neither route carries the charge the balance stays on the reservation.
      No retry, fee or recovery step is taken on a line that is under dispute, and a line the marketplace itself raised in error is reversed rather than retried.
    eligibility: []
    params:
      per_tier:
        Keyturn Hourly Rate Plan: {payment_retry_count: "=payment_retry_count", payment_retry_interval_hours: "=payment_retry_interval_hours", late_payment_fee_amount: "=late_payment_fee_amount", modification_fee_amount: "=modification_fee_amount", modification_free_changes_count: "=modification_free_changes_count"}
        Keyturn Daily Rate Plan: {payment_retry_count: "=payment_retry_count", payment_retry_interval_hours: "=payment_retry_interval_hours", late_payment_fee_amount: "=late_payment_fee_amount", modification_fee_amount: "=modification_fee_amount", modification_free_changes_count: "=modification_free_changes_count"}
        Keyturn Weekend Rate Plan: {payment_retry_count: "=payment_retry_count", payment_retry_interval_hours: "=payment_retry_interval_hours", late_payment_fee_amount: "=late_payment_fee_amount", modification_fee_amount: "=modification_fee_amount", modification_free_changes_count: "=modification_free_changes_count"}
        Keyturn Weekly Rate Plan: {payment_retry_count: "=payment_retry_count", payment_retry_interval_hours: "=payment_retry_interval_hours", late_payment_fee_amount: "=late_payment_fee_amount", modification_fee_amount: "=modification_fee_amount", modification_free_changes_count: "=modification_free_changes_count"}
        Keyturn Monthly Rate Plan: {payment_retry_count: "=payment_retry_count", payment_retry_interval_hours: "=payment_retry_interval_hours", late_payment_fee_amount: "=late_payment_fee_amount", modification_fee_amount: "=modification_fee_amount", modification_free_changes_count: "=modification_free_changes_count"}
        Keyturn Extended Stay Rate Plan: {payment_retry_count: "=payment_retry_count", payment_retry_interval_hours: "=payment_retry_interval_hours", late_payment_fee_amount: "=late_payment_fee_amount", modification_fee_amount: "=modification_fee_amount", modification_free_changes_count: "=modification_free_changes_count"}

# ============================================================================
# extended_policies: the multi-factor calculation policies this difficulty adds
# ============================================================================
extended_policies:
  - id: trips_ext_mileage_topup_grant
    base_policy_refs: [trips_evt_mileage_allowance]
    overwrite:
      - base_policy: trips_evt_mileage_allowance
        superseded_clause: >-
          A guest may buy further miles in whole packages only
        replaced_by: >-
          A top-up of included miles is granted in whole blocks, the standard block being five hundred miles.
      - base_policy: trips_evt_mileage_allowance
        superseded_clause: >-
          a package bought mid-trip is granted in full
        replaced_by: >-
          The miles a top-up must cover are the daily included-mile measure multiplied by the days of the reserved period still to run, less the included miles the reservation still has unused, with the top-up reserve added; where that figure comes out at nothing or less, the top-up must cover nothing.
      - base_policy: trips_evt_mileage_allowance
        superseded_clause: >-
          capped at the plan's per-booking ceiling however long the reservation runs
        replaced_by: >-
          The miles granted are then held down to the room left under the reservation's included-mile ceiling, the standard ceiling being five thousand miles, that room being the ceiling less the included miles already granted to the reservation, whatever those miles were granted for; where no room is left, no miles are granted, and miles are granted as whole miles with no part mile granted.
    trigger: on_request
    subject: [trips_mileage_allowance_granted]
    computes: granted_miles
    target_tool: grant_mileage_topup_0373887d
    params:
      block_standard: 500
      block_medium: 750
      block_large: 900
      allowance_standard: 125
      allowance_steady: 150
      allowance_heavy: 175
      ceiling_standard: 5000
      ceiling_long_clean: 8000
      ceiling_long_charged: 6000
      reserve_standard: 0
      reserve_medium: 400
      reserve_long: 800
      days_run_threshold: 28
      reading_count_threshold: 3
      recent_reading_days: 7
      remaining_days_threshold: 14
      long_reservation_days: 60
      granted_miles_threshold: 3000
      heavy_avg_miles: 85
      steady_avg_miles: 55
      driven_miles_threshold: 3000
    rule: >-
      A guest who asks for more included miles part way through a reservation is granted a top-up of included miles, and how many miles that top-up adds is worked out as follows.
      A top-up of included miles is granted in whole blocks, the standard block being five hundred miles.
      The miles a top-up must cover are the daily included-mile measure multiplied by the days of the reserved period still to run, less the included miles the reservation still has unused, with the top-up reserve added; where that figure comes out at nothing or less, the top-up must cover nothing.
      The standard daily included-mile measure is one hundred and twenty-five miles; the days still to run are counted from the day the top-up is granted to the scheduled return with the day of return left out; the miles still unused are taken as the unused included miles standing on the reservation; and the standard top-up reserve is nil.
      The blocks granted are the smallest whole number of blocks that cover the miles the top-up must cover, and never fewer than one block, and the miles granted are the blocks multiplied by the block.
      The miles granted are then held down to the room left under the reservation's included-mile ceiling, the standard ceiling being five thousand miles, that room being the ceiling less the included miles already granted to the reservation, whatever those miles were granted for; where no room is left, no miles are granted, and miles are granted as whole miles with no part mile granted.
      The readings counted wherever this rule speaks of the reservation's odometer readings are the records its mileage record holds as readings of miles driven, which are the records that book miles against the allowance, and those alone; a reading of the fuel tank or the traction battery is not one of them whatever else it notes, and every reading of miles driven counts whoever took it - the marketplace's telematics, the host or the guest alike - since a reading that another supersedes books no miles against the allowance and so adds nothing to what the readings have booked.
      Where a condition in this rule asks how long the trip has run, the days are counted from the day the trip actually started to the day of handling, the day it started not counted and the day of handling counted; where a condition asks how many days of the reserved period are still to run, they are counted from the day of handling to the scheduled return, the day of handling not counted and the day of return counted; where a condition asks how many days have passed since a reading, they are counted from the day that reading was taken to the day of handling, the day of the reading not counted and the day of handling counted; and the days of the reserved period are counted from the first day of that period to the last, both days counted.
      Where the trip has run for at least four weeks and at least three odometer readings have been booked against the reservation, the miles still unused are worked out from the reservation's own mileage record, as the included miles granted to it less every mile its readings have booked against that allowance; where the trip has run for at least four weeks and fewer than three odometer readings have been booked against the reservation, the miles still unused are worked out from that same mileage record and are then reduced by the standard daily included-mile measure for each day that has passed since the latest reading; in every other case the miles still unused are taken as the unused included miles standing on the reservation.
      Where more than fourteen days of the reserved period are still to run and an odometer reading has been booked against the reservation within the last seven days, the days still to run are counted from the day that latest reading was taken to the scheduled return, both that day and the day of return counted; where more than fourteen days of the reserved period are still to run and no odometer reading has been booked against the reservation within the last seven days, the days still to run are counted from the day the top-up is granted to the scheduled return, both that day and the day of return counted; in every other case the days still to run are counted from the day the top-up is granted to the scheduled return with the day of return left out.
      Where the trip has run for at least four weeks and the miles its odometer readings have booked average more than eighty-five miles for each day it has run, the daily included-mile measure is one hundred and seventy-five miles; where the trip has run for at least four weeks and that average is more than fifty-five miles but not more than eighty-five miles for each day it has run, the daily included-mile measure is one hundred and fifty miles; in every other case the daily included-mile measure is the standard one.
      Where the reserved period runs for sixty days or more and at least three thousand included miles have already been granted to the reservation, the block is nine hundred miles; where the reserved period runs for sixty days or more and fewer than three thousand included miles have been granted to the reservation, the block is seven hundred and fifty miles; in every other case the block is the standard one.
      Where the reserved period runs for sixty days or more and no mileage overage has been charged on the reservation, a line once raised for one counting as charged however it was afterwards treated, the included-mile ceiling is eight thousand miles; where the reserved period runs for sixty days or more and a mileage overage has been charged on the reservation, the included-mile ceiling is six thousand miles; in every other case the included-mile ceiling is the standard one.
      Where the reserved period runs for sixty days or more and the reservation's odometer readings have booked more than three thousand miles, the top-up reserve is eight hundred miles; where the reserved period runs for sixty days or more and those readings have booked three thousand miles or fewer, the top-up reserve is four hundred miles; in every other case the top-up reserve is the standard one.
    prerequisite: []
    cross_category: []
    compute:
      - days_run: "DAYS(F('actual_start_date'), NOW)"
      - reading_count: "COUNT('trips_usage', event_type='trips_mileage_usage_recorded')"
      - ledger_unused: "SUM('trips_usage','miles_delta')"
      - latest_reading_date: "LATEST('trips_usage','usage_date', date_field='usage_date', event_type='trips_mileage_usage_recorded')"
      - days_to_return: "DAYS(NOW, F('trip_end_date'))"
      - days_since_reading: "DAYS(latest_reading_date, NOW)"
      - miles_unused: "ledger_unused if (days_run >= K('days_run_threshold') and reading_count >= K('reading_count_threshold')) else (ledger_unused - K('allowance_standard') * days_since_reading if (days_run >= K('days_run_threshold') and reading_count < K('reading_count_threshold')) else F('miles_remaining'))"
      - days_covered: "DAYS(latest_reading_date, F('trip_end_date')) + 1 if (days_to_return > K('remaining_days_threshold') and days_since_reading <= K('recent_reading_days')) else (days_to_return + 1 if (days_to_return > K('remaining_days_threshold') and days_since_reading > K('recent_reading_days')) else days_to_return)"
      - avg_miles_per_day: "ABS(SUM('trips_usage','miles_delta', event_type='trips_mileage_usage_recorded')) / MX(1, days_run)"
      - daily_allowance: "K('allowance_heavy') if (days_run >= K('days_run_threshold') and avg_miles_per_day > K('heavy_avg_miles')) else (K('allowance_steady') if (days_run >= K('days_run_threshold') and avg_miles_per_day > K('steady_avg_miles')) else K('allowance_standard'))"
      - reserved_days: "DAYS(F('trip_start_date'), F('trip_end_date')) + 1"
      - granted_to_date: "SUM('trips_usage','miles_delta', event_type='trips_mileage_allowance_granted')"
      - block_size: "K('block_large') if (reserved_days >= K('long_reservation_days') and granted_to_date >= K('granted_miles_threshold')) else (K('block_medium') if (reserved_days >= K('long_reservation_days') and granted_to_date < K('granted_miles_threshold')) else K('block_standard'))"
      - overage_count: "COUNT('trips_charges', charge_basis='mileage_overage')"
      - mile_ceiling: "K('ceiling_long_clean') if (reserved_days >= K('long_reservation_days') and overage_count == 0) else (K('ceiling_long_charged') if (reserved_days >= K('long_reservation_days') and overage_count > 0) else K('ceiling_standard'))"
      - driven_miles: "ABS(SUM('trips_usage','miles_delta', event_type='trips_mileage_usage_recorded'))"
      - reserve_miles: "K('reserve_long') if (reserved_days >= K('long_reservation_days') and driven_miles > K('driven_miles_threshold')) else (K('reserve_medium') if (reserved_days >= K('long_reservation_days') and driven_miles <= K('driven_miles_threshold')) else K('reserve_standard'))"
      - shortfall: "MX(0, days_covered * daily_allowance - miles_unused + reserve_miles)"
      - blocks: "MX(1, -(-shortfall // block_size))"
      - granted_raw: "blocks * block_size"
      - headroom: "MX(0, mile_ceiling - granted_to_date)"
      - result: "int(MN(granted_raw, headroom))"
    compute_basis:
      days_run: "Where the trip has run for at least four weeks and at least three odometer readings have been booked against the reservation, the miles still unused are worked out from the reservation's own mileage record, as the included miles granted to it less every mile its readings have booked against that allowance"
      reading_count: "where the trip has run for at least four weeks and fewer than three odometer readings have been booked against the reservation, the miles still unused are worked out from that same mileage record and are then reduced by the standard daily included-mile measure for each day that has passed since the latest reading"
      ledger_unused: "the miles still unused are worked out from the reservation's own mileage record, as the included miles granted to it less every mile its readings have booked against that allowance"
      latest_reading_date: "the days still to run are counted from the day that latest reading was taken to the scheduled return, both that day and the day of return counted"
      days_to_return: "the days still to run are counted from the day the top-up is granted to the scheduled return, both that day and the day of return counted"
      days_since_reading: "Where more than fourteen days of the reserved period are still to run and an odometer reading has been booked against the reservation within the last seven days, the days still to run are counted from the day that latest reading was taken to the scheduled return, both that day and the day of return counted"
      miles_unused: "Where the trip has run for at least four weeks and at least three odometer readings have been booked against the reservation, the miles still unused are worked out from the reservation's own mileage record, as the included miles granted to it less every mile its readings have booked against that allowance; where the trip has run for at least four weeks and fewer than three odometer readings have been booked against the reservation, the miles still unused are worked out from that same mileage record and are then reduced by the standard daily included-mile measure for each day that has passed since the latest reading; in every other case the miles still unused are taken as the unused included miles standing on the reservation."
      days_covered: "Where more than fourteen days of the reserved period are still to run and an odometer reading has been booked against the reservation within the last seven days, the days still to run are counted from the day that latest reading was taken to the scheduled return, both that day and the day of return counted; where more than fourteen days of the reserved period are still to run and no odometer reading has been booked against the reservation within the last seven days, the days still to run are counted from the day the top-up is granted to the scheduled return, both that day and the day of return counted; in every other case the days still to run are counted from the day the top-up is granted to the scheduled return with the day of return left out."
      avg_miles_per_day: "the miles its odometer readings have booked average more than eighty-five miles for each day it has run"
      daily_allowance: "Where the trip has run for at least four weeks and the miles its odometer readings have booked average more than eighty-five miles for each day it has run, the daily included-mile measure is one hundred and seventy-five miles; where the trip has run for at least four weeks and that average is more than fifty-five miles but not more than eighty-five miles for each day it has run, the daily included-mile measure is one hundred and fifty miles; in every other case the daily included-mile measure is the standard one."
      reserved_days: "Where the reserved period runs for sixty days or more and at least three thousand included miles have already been granted to the reservation, the block is nine hundred miles"
      granted_to_date: "that room being the ceiling less the included miles already granted to the reservation, whatever those miles were granted for"
      block_size: "Where the reserved period runs for sixty days or more and at least three thousand included miles have already been granted to the reservation, the block is nine hundred miles; where the reserved period runs for sixty days or more and fewer than three thousand included miles have been granted to the reservation, the block is seven hundred and fifty miles; in every other case the block is the standard one."
      overage_count: "Where the reserved period runs for sixty days or more and no mileage overage has been charged on the reservation, a line once raised for one counting as charged however it was afterwards treated, the included-mile ceiling is eight thousand miles"
      mile_ceiling: "Where the reserved period runs for sixty days or more and no mileage overage has been charged on the reservation, a line once raised for one counting as charged however it was afterwards treated, the included-mile ceiling is eight thousand miles; where the reserved period runs for sixty days or more and a mileage overage has been charged on the reservation, the included-mile ceiling is six thousand miles; in every other case the included-mile ceiling is the standard one."
      driven_miles: "Where the reserved period runs for sixty days or more and the reservation's odometer readings have booked more than three thousand miles, the top-up reserve is eight hundred miles"
      reserve_miles: "Where the reserved period runs for sixty days or more and the reservation's odometer readings have booked more than three thousand miles, the top-up reserve is eight hundred miles; where the reserved period runs for sixty days or more and those readings have booked three thousand miles or fewer, the top-up reserve is four hundred miles; in every other case the top-up reserve is the standard one."
      shortfall: "The miles a top-up must cover are the daily included-mile measure multiplied by the days of the reserved period still to run, less the included miles the reservation still has unused, with the top-up reserve added; where that figure comes out at nothing or less, the top-up must cover nothing."
      blocks: "The blocks granted are the smallest whole number of blocks that cover the miles the top-up must cover, and never fewer than one block, and the miles granted are the blocks multiplied by the block."
      headroom: "The miles granted are then held down to the room left under the reservation's included-mile ceiling, the standard ceiling being five thousand miles, that room being the ceiling less the included miles already granted to the reservation, whatever those miles were granted for; where no room is left, no miles are granted, and miles are granted as whole miles with no part mile granted."
      result: "The miles granted are then held down to the room left under the reservation's included-mile ceiling, the standard ceiling being five thousand miles, that room being the ceiling less the included miles already granted to the reservation, whatever those miles were granted for; where no room is left, no miles are granted, and miles are granted as whole miles with no part mile granted."
    factors:
      - id: unused_miles_basis
        effect: method
        decides: miles_unused
        bindings: [days_run, reading_count, ledger_unused, miles_unused]
        ladder:
          - when: "the trip has run for at least four weeks and at least three odometer readings have been booked against the reservation"
            method: "the miles still unused are worked out from the reservation's own mileage record, as the included miles granted to it less every mile its readings have booked against that allowance"
          - when: "the trip has run for at least four weeks and fewer than three odometer readings have been booked against the reservation"
            method: "the miles still unused are worked out from that same mileage record and are then reduced by the standard daily included-mile measure for each day that has passed since the latest reading"
          - when: "otherwise"
            method: "the miles still unused are taken as the unused included miles standing on the reservation"
        baseline:
          miles_unused: "F('miles_remaining')"
        evidence: [history, date]
        cross_difficulty: null
      - id: covered_period_anchor
        effect: method
        decides: days_covered
        bindings: [latest_reading_date, days_to_return, days_since_reading, days_covered]
        ladder:
          - when: "more than fourteen days of the reserved period are still to run and an odometer reading has been booked against the reservation within the last seven days"
            method: "the days still to run are counted from the day that latest reading was taken to the scheduled return, both that day and the day of return counted"
          - when: "more than fourteen days of the reserved period are still to run and no odometer reading has been booked against the reservation within the last seven days"
            method: "the days still to run are counted from the day the top-up is granted to the scheduled return, both that day and the day of return counted"
          - when: "otherwise"
            method: "the days still to run are counted from the day the top-up is granted to the scheduled return with the day of return left out"
        baseline:
          days_covered: "days_to_return"
        evidence: [history, date]
        cross_difficulty: null
      - id: daily_mile_measure
        effect: parameter
        decides: daily_allowance
        bindings: [avg_miles_per_day, daily_allowance]
        ladder:
          - when: "the trip has run for at least four weeks and the miles its odometer readings have booked average more than eighty-five miles for each day it has run"
            value: "K('allowance_heavy')"
          - when: "the trip has run for at least four weeks and that average is more than fifty-five miles but not more than eighty-five miles for each day it has run"
            value: "K('allowance_steady')"
          - when: "otherwise"
            value: "K('allowance_standard')"
        baseline:
          daily_allowance: "K('allowance_standard')"
        evidence: [history, date]
        cross_difficulty: null
      - id: block_size_tier
        effect: parameter
        decides: block_size
        bindings: [reserved_days, granted_to_date, block_size]
        ladder:
          - when: "the reserved period runs for sixty days or more and at least three thousand included miles have already been granted to the reservation"
            value: "K('block_large')"
          - when: "the reserved period runs for sixty days or more and fewer than three thousand included miles have been granted to the reservation"
            value: "K('block_medium')"
          - when: "otherwise"
            value: "K('block_standard')"
        baseline:
          block_size: "K('block_standard')"
        evidence: [history, date]
        cross_difficulty: null
      - id: included_mile_ceiling_tier
        effect: parameter
        decides: mile_ceiling
        bindings: [overage_count, mile_ceiling]
        ladder:
          - when: "the reserved period runs for sixty days or more and no mileage overage has been charged on the reservation, a line once raised for one counting as charged however it was afterwards treated"
            value: "K('ceiling_long_clean')"
          - when: "the reserved period runs for sixty days or more and a mileage overage has been charged on the reservation"
            value: "K('ceiling_long_charged')"
          - when: "otherwise"
            value: "K('ceiling_standard')"
        baseline:
          mile_ceiling: "K('ceiling_standard')"
        evidence: [history]
        cross_difficulty: null
      - id: top_up_reserve_tier
        effect: parameter
        decides: reserve_miles
        bindings: [driven_miles, reserve_miles]
        ladder:
          - when: "the reserved period runs for sixty days or more and the reservation's odometer readings have booked more than three thousand miles"
            value: "K('reserve_long')"
          - when: "the reserved period runs for sixty days or more and those readings have booked three thousand miles or fewer"
            value: "K('reserve_medium')"
          - when: "otherwise"
            value: "K('reserve_standard')"
        baseline:
          reserve_miles: "K('reserve_standard')"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        A top-up of included miles is granted in whole blocks, the standard block being five hundred miles.
        The miles a top-up must cover are the daily included-mile measure multiplied by the days of the reserved period still to run, less the included miles the reservation still has unused, with the top-up reserve added; where that figure comes out at nothing or less, the top-up must cover nothing.
        The standard daily included-mile measure is one hundred and twenty-five miles; the days still to run are counted from the day the top-up is granted to the scheduled return with the day of return left out; the miles still unused are taken as the unused included miles standing on the reservation; and the standard top-up reserve is nil.
        The blocks granted are the smallest whole number of blocks that cover the miles the top-up must cover, and never fewer than one block, and the miles granted are the blocks multiplied by the block.
        The miles granted are then held down to the room left under the reservation's included-mile ceiling, the standard ceiling being five thousand miles, that room being the ceiling less the included miles already granted to the reservation, whatever those miles were granted for; where no room is left, no miles are granted, and miles are granted as whole miles with no part mile granted.
      params: [block_standard, allowance_standard, ceiling_standard, reserve_standard]
    inputs:
      history:
        - {table: trips_usage, aggregate: sum, field: miles_delta, within_months: null, filters: {}}
        - {table: trips_usage, aggregate: count, field: usage_id, within_months: null, filters: {event_type: trips_mileage_usage_recorded}}
        - {table: trips_usage, aggregate: latest, field: usage_date, within_months: null, filters: {event_type: trips_mileage_usage_recorded}}
        - {table: trips_charges, aggregate: count, field: charge_id, within_months: null, filters: {charge_basis: mileage_overage}}
      cross_category: []

  - id: trips_ext_mileage_topup_pricing
    base_policy_refs: [trips_evt_reservation_pricing, trips_evt_payment_recovery, trips_evt_mileage_allowance]
    overwrite:
      - base_policy: trips_evt_mileage_allowance
        superseded_clause: >-
          charged in full even where fewer miles are eventually driven
        replaced_by: >-
          The standard line price is the block price, less the volume concession, charged for each priced block of five hundred miles the top-up added, a part block counting as a whole block; where the concession would come to more than the block price the block price less the concession is taken as nothing, and the line price is brought to the nearest cent however it is worked out.
    trigger: on_request
    subject: [trips_reservation_charge_posted]
    computes: purchase_amount
    target_tool: pay_for_mileage_topup_d571ad94
    params:
      block_price_standard: 145.00
      block_price_corporate: 125.00
      block_price_unprotected: 165.00
      corporate_fee_threshold: 2000.00
      concession_bulk: 15.00
      concession_volume: 8.00
      concession_none: 0.00
      bulk_miles: 4000
      volume_miles: 2000
      priced_block: 500
      handling_telematics: 0.00
      handling_reported: 12.00
      handling_standard: 6.00
      credit_early: 40.00
      credit_mid: 20.00
      credit_none: 0.00
      early_return_days: 20
      mid_return_days: 8
      credit_driven_miles: 2000
      long_reservation_days: 60
      days_run_threshold: 28
      metered_miles_threshold: 2000
    rule: >-
      What a guest pays for a top-up of included miles is worked out from the miles that top-up added to the reservation's included-mile record, which are the miles granted to it as a purchased top-up and not the allowance granted to it when the reservation was confirmed. The price of a mileage top-up is fixed only after the miles it adds stand on the reservation's included-mile record.
      The price is the line price for the miles the top-up added, with the handling charge added and the early-purchase credit taken off, taken as nothing where that comes out below nothing, and brought to the nearest cent again once those three have been put together.
      The standard line price is the block price, less the volume concession, charged for each priced block of five hundred miles the top-up added, a part block counting as a whole block; where the concession would come to more than the block price the block price less the concession is taken as nothing, and the line price is brought to the nearest cent however it is worked out.
      The standard block price is one hundred and forty-five dollars for a priced block, no volume concession is given as standard, the standard handling charge is six dollars, and no early-purchase credit is given as standard.
      The readings counted wherever this rule speaks of the reservation's odometer readings are the records its mileage record holds as readings of miles driven, which are the records that book miles against the allowance, and those alone; a reading of the fuel tank or the traction battery is not one of them whatever else it notes, and every reading of miles driven counts whoever took it - the marketplace's telematics, the host or the guest alike - since a reading that another supersedes books no miles against the allowance and so adds nothing to what the readings have booked.
      Where a condition in this rule asks how long the trip has run, the days are counted from the day the trip actually started to the day of handling, the day it started not counted and the day of handling counted; where a condition asks how many days of the reserved period are still to run, they are counted from the day of handling to the scheduled return, the day of handling not counted and the day of return counted; where a condition asks how many days have passed since a reading, they are counted from the day that reading was taken to the day of handling, the day of the reading not counted and the day of handling counted; and the days of the reserved period are counted from the first day of that period to the last, both days counted.
      Where the trip's protection election is written as Keyturn Business Traveler Protection, that election stands active, and the daily protection fees charged on it come to at least two thousand dollars, however many lines they stand as and whenever they were raised, the block price is one hundred and twenty-five dollars; where the trip's protection election is written as Keyturn Declined Protection or that election does not stand active, the block price is one hundred and sixty-five dollars; in every other case the block price is the standard one. The fees counted are the daily protection fee lines raised on that election and those alone; a line raised on it for anything else - a young-driver protection surcharge, a level-change difference, an additional-driver fee, a deductible or a credit - is not a daily protection fee and is not counted.
      Where the top-up added four thousand miles or more and the trip has run for at least four weeks, the volume concession is fifteen dollars off each priced block; where the top-up added two thousand miles or more but fewer than four thousand and the trip has run for at least four weeks, the volume concession is eight dollars off each priced block; in every other case no volume concession is given.
      Where the reserved period runs for sixty days or more and the top-up added two thousand miles or more, the line price is the block price, less the volume concession, apportioned over the priced block by the mile and charged for each mile the top-up added; where the reserved period runs for sixty days or more and the top-up added fewer than two thousand miles, the line price is the block price, less the volume concession, charged for each whole priced block the top-up added and nothing for the miles left over; in every other case the line price is worked out in the standard way.
      Where the latest odometer reading booked against the reservation came from the marketplace's telematics and the trip has run for at least four weeks, no handling charge is made; where the latest odometer reading booked against the reservation was reported by the host or by the guest and the trip has run for at least four weeks, the handling charge is twelve dollars; in every other case the handling charge is the standard one.
      Where more than twenty days of the reserved period are still to run and the reservation's odometer readings have booked more than two thousand miles, the early-purchase credit is forty dollars; where at least eight days but not more than twenty days of the reserved period are still to run and those readings have booked more than two thousand miles, the early-purchase credit is twenty dollars; in every other case no early-purchase credit is given.
    prerequisite:
      - problem: trips_ext_mileage_topup_grant
        kind: value_input
        gate: granted_miles
        form: state
        policy_source: >-
          The price of a mileage top-up is fixed only after the miles it adds stand on the reservation's included-mile record.
        condition: >-
          the reservation's mileage record carries a purchased top-up grant whose miles are the miles this purchase is being priced for
        resolved_by: grant_mileage_topup_0373887d
        effect: >-
          the binding granted_miles takes the miles the purchased top-up added to the reservation, where before it stood at nothing and the line price with it
    cross_category:
      - category: guestplan
        as: branch
        reads: [protection_level_name, status, guestplan_charges.charge_amount]
        note: the block-price tier is decided from the protection election standing on this trip and the protection fees charged on it
    compute:
      - granted_miles: "SUM('trips_usage','miles_delta', event_type='trips_mileage_allowance_granted', grant_reason='purchased_package')"
      - days_run_a: "DAYS(F('actual_start_date'), NOW)"
      - elec_level: "CFIELD('guestplan','protection_level_name', booking_id=HID)"
      - elec_status: "CFIELD('guestplan','status', booking_id=HID)"
      - elec_fees: "XSUM('guestplan','guestplan_charges','charge_amount', charge_basis='daily_protection_fee', booking_id=HID)"
      - block_price: "K('block_price_corporate') if (elec_level == 'Keyturn Business Traveler Protection' and elec_status == 'active' and elec_fees >= K('corporate_fee_threshold')) else (K('block_price_unprotected') if (elec_level == 'Keyturn Declined Protection' or elec_status != 'active') else K('block_price_standard'))"
      - concession: "K('concession_bulk') if (granted_miles >= K('bulk_miles') and days_run_a >= K('days_run_threshold')) else (K('concession_volume') if (granted_miles >= K('volume_miles') and days_run_a >= K('days_run_threshold')) else K('concession_none'))"
      - net_block_price: "MX(0, block_price - concession)"
      - reserved_days_a: "DAYS(F('trip_start_date'), F('trip_end_date')) + 1"
      - line_price: "RND(granted_miles * (net_block_price / K('priced_block')), 2) if (reserved_days_a >= K('long_reservation_days') and granted_miles >= K('metered_miles_threshold')) else (RND(int(granted_miles / K('priced_block')) * net_block_price, 2) if (reserved_days_a >= K('long_reservation_days') and granted_miles < K('metered_miles_threshold')) else RND(-(-granted_miles // K('priced_block')) * net_block_price, 2))"
      - latest_source: "LATEST('trips_usage','usage_source', date_field='usage_date', event_type='trips_mileage_usage_recorded')"
      - handling_charge: "K('handling_telematics') if (latest_source == 'telematics' and days_run_a >= K('days_run_threshold')) else (K('handling_reported') if ((latest_source == 'host_report' or latest_source == 'guest_report') and days_run_a >= K('days_run_threshold')) else K('handling_standard'))"
      - days_to_return_a: "DAYS(NOW, F('trip_end_date'))"
      - driven_miles_a: "ABS(SUM('trips_usage','miles_delta', event_type='trips_mileage_usage_recorded'))"
      - early_credit: "K('credit_early') if (days_to_return_a > K('early_return_days') and driven_miles_a > K('credit_driven_miles')) else (K('credit_mid') if (days_to_return_a >= K('mid_return_days') and driven_miles_a > K('credit_driven_miles')) else K('credit_none'))"
      - result: "RND(MX(0, line_price + handling_charge - early_credit), 2)"
    compute_basis:
      granted_miles: "What a guest pays for a top-up of included miles is worked out from the miles that top-up added to the reservation's included-mile record, which are the miles granted to it as a purchased top-up and not the allowance granted to it when the reservation was confirmed."
      days_run_a: "Where the top-up added four thousand miles or more and the trip has run for at least four weeks, the volume concession is fifteen dollars off each priced block"
      elec_level: "Where the trip's protection election is written as Keyturn Business Traveler Protection, that election stands active, and the daily protection fees charged on it come to at least two thousand dollars, however many lines they stand as and whenever they were raised, the block price is one hundred and twenty-five dollars"
      elec_status: "where the trip's protection election is written as Keyturn Declined Protection or that election does not stand active, the block price is one hundred and sixty-five dollars"
      elec_fees: "the daily protection fees charged on it come to at least two thousand dollars"
      block_price: "Where the trip's protection election is written as Keyturn Business Traveler Protection, that election stands active, and the daily protection fees charged on it come to at least two thousand dollars, however many lines they stand as and whenever they were raised, the block price is one hundred and twenty-five dollars; where the trip's protection election is written as Keyturn Declined Protection or that election does not stand active, the block price is one hundred and sixty-five dollars; in every other case the block price is the standard one. The fees counted are the daily protection fee lines raised on that election and those alone; a line raised on it for anything else - a young-driver protection surcharge, a level-change difference, an additional-driver fee, a deductible or a credit - is not a daily protection fee and is not counted."
      concession: "Where the top-up added four thousand miles or more and the trip has run for at least four weeks, the volume concession is fifteen dollars off each priced block; where the top-up added two thousand miles or more but fewer than four thousand and the trip has run for at least four weeks, the volume concession is eight dollars off each priced block; in every other case no volume concession is given."
      net_block_price: "The standard line price is the block price, less the volume concession, charged for each priced block of five hundred miles the top-up added, a part block counting as a whole block; where the concession would come to more than the block price the block price less the concession is taken as nothing, and the line price is brought to the nearest cent however it is worked out."
      reserved_days_a: "Where the reserved period runs for sixty days or more and the top-up added two thousand miles or more, the line price is the block price, less the volume concession, apportioned over the priced block by the mile and charged for each mile the top-up added"
      line_price: "Where the reserved period runs for sixty days or more and the top-up added two thousand miles or more, the line price is the block price, less the volume concession, apportioned over the priced block by the mile and charged for each mile the top-up added; where the reserved period runs for sixty days or more and the top-up added fewer than two thousand miles, the line price is the block price, less the volume concession, charged for each whole priced block the top-up added and nothing for the miles left over; in every other case the line price is worked out in the standard way."
      latest_source: "Where the latest odometer reading booked against the reservation came from the marketplace's telematics and the trip has run for at least four weeks, no handling charge is made"
      handling_charge: "Where the latest odometer reading booked against the reservation came from the marketplace's telematics and the trip has run for at least four weeks, no handling charge is made; where the latest odometer reading booked against the reservation was reported by the host or by the guest and the trip has run for at least four weeks, the handling charge is twelve dollars; in every other case the handling charge is the standard one."
      days_to_return_a: "Where more than twenty days of the reserved period are still to run and the reservation's odometer readings have booked more than two thousand miles, the early-purchase credit is forty dollars"
      driven_miles_a: "where at least eight days but not more than twenty days of the reserved period are still to run and those readings have booked more than two thousand miles, the early-purchase credit is twenty dollars"
      early_credit: "Where more than twenty days of the reserved period are still to run and the reservation's odometer readings have booked more than two thousand miles, the early-purchase credit is forty dollars; where at least eight days but not more than twenty days of the reserved period are still to run and those readings have booked more than two thousand miles, the early-purchase credit is twenty dollars; in every other case no early-purchase credit is given."
      result: "The price is the line price for the miles the top-up added, with the handling charge added and the early-purchase credit taken off, taken as nothing where that comes out below nothing, and brought to the nearest cent again once those three have been put together."
    factors:
      - id: protection_block_price
        effect: parameter
        decides: block_price
        bindings: [elec_level, elec_status, elec_fees, block_price]
        ladder:
          - when: "the trip's protection election is written as Keyturn Business Traveler Protection, that election stands active, and the daily protection fees charged on it come to at least two thousand dollars, however many lines they stand as and whenever they were raised"
            value: "K('block_price_corporate')"
          - when: "the trip's protection election is written as Keyturn Declined Protection or that election does not stand active"
            value: "K('block_price_unprotected')"
          - when: "otherwise"
            value: "K('block_price_standard')"
        baseline:
          block_price: "K('block_price_standard')"
        evidence: [cross_category, history]
        cross_difficulty: guestplan
      - id: volume_concession_tier
        effect: parameter
        decides: concession
        bindings: [granted_miles, days_run_a, concession]
        ladder:
          - when: "the top-up added four thousand miles or more and the trip has run for at least four weeks"
            value: "K('concession_bulk')"
          - when: "the top-up added two thousand miles or more but fewer than four thousand and the trip has run for at least four weeks"
            value: "K('concession_volume')"
          - when: "otherwise"
            value: "K('concession_none')"
        baseline:
          concession: "K('concession_none')"
        evidence: [history, date]
        cross_difficulty: null
      - id: line_price_basis
        effect: method
        decides: line_price
        bindings: [reserved_days_a, line_price]
        ladder:
          - when: "the reserved period runs for sixty days or more and the top-up added two thousand miles or more"
            method: "the line price is the block price, less the volume concession, apportioned over the priced block by the mile and charged for each mile the top-up added"
          - when: "the reserved period runs for sixty days or more and the top-up added fewer than two thousand miles"
            method: "the line price is the block price, less the volume concession, charged for each whole priced block the top-up added and nothing for the miles left over"
          - when: "otherwise"
            method: "the line price is the block price, less the volume concession, charged for each priced block of five hundred miles the top-up added, a part block counting as a whole block"
        baseline:
          line_price: "RND(-(-granted_miles // K('priced_block')) * net_block_price, 2)"
        evidence: [date, history]
        cross_difficulty: null
      - id: reading_handling_charge
        effect: parameter
        decides: handling_charge
        bindings: [latest_source, handling_charge]
        ladder:
          - when: "the latest odometer reading booked against the reservation came from the marketplace's telematics and the trip has run for at least four weeks"
            value: "K('handling_telematics')"
          - when: "the latest odometer reading booked against the reservation was reported by the host or by the guest and the trip has run for at least four weeks"
            value: "K('handling_reported')"
          - when: "otherwise"
            value: "K('handling_standard')"
        baseline:
          handling_charge: "K('handling_standard')"
        evidence: [history]
        cross_difficulty: null
      - id: early_purchase_credit
        effect: parameter
        decides: early_credit
        bindings: [days_to_return_a, driven_miles_a, early_credit]
        ladder:
          - when: "more than twenty days of the reserved period are still to run and the reservation's odometer readings have booked more than two thousand miles"
            value: "K('credit_early')"
          - when: "at least eight days but not more than twenty days of the reserved period are still to run and those readings have booked more than two thousand miles"
            value: "K('credit_mid')"
          - when: "otherwise"
            value: "K('credit_none')"
        baseline:
          early_credit: "K('credit_none')"
        evidence: [history, date]
        cross_difficulty: null
    baseline:
      rule: >-
        What a guest pays for a top-up of included miles is worked out from the miles that top-up added to the reservation's included-mile record, which are the miles granted to it as a purchased top-up and not the allowance granted to it when the reservation was confirmed.
        The price is the line price for the miles the top-up added, with the handling charge added and the early-purchase credit taken off, taken as nothing where that comes out below nothing, and brought to the nearest cent again once those three have been put together.
        The standard line price is the block price, less the volume concession, charged for each priced block of five hundred miles the top-up added, a part block counting as a whole block; where the concession would come to more than the block price the block price less the concession is taken as nothing, and the line price is brought to the nearest cent however it is worked out.
        The standard block price is one hundred and forty-five dollars for a priced block, no volume concession is given as standard, the standard handling charge is six dollars, and no early-purchase credit is given as standard.
      params: [block_price_standard, concession_none, handling_standard, credit_none, priced_block]
    inputs:
      history:
        - {table: trips_usage, aggregate: sum, field: miles_delta, within_months: null, filters: {event_type: trips_mileage_allowance_granted, grant_reason: purchased_package}}
        - {table: trips_usage, aggregate: latest, field: usage_source, within_months: null, filters: {event_type: trips_mileage_usage_recorded}}
        - {category: guestplan, table: guestplan_charges, aggregate: sum, field: charge_amount, within_months: null, filters: {charge_basis: daily_protection_fee}}
      cross_category: [guestplan]

  - id: trips_ext_young_driver_surcharge
    base_policy_refs: [trips_evt_reservation_pricing, trips_evt_payment_recovery]
    overwrite:
      - base_policy: trips_evt_reservation_pricing
        superseded_clause: >-
          pays the young-driver surcharge on the discounted base rate
        replaced_by: >-
          The surcharge is the effective surcharge rate taken on the amount charged over, brought to the nearest cent again once that has been done.
    trigger: state_due
    subject: [trips_reservation_charge_posted]
    computes: surcharge_amount
    target_tool: post_young_driver_surcharge_8e3312c3
    params:
      rate_standard: 15
      rate_long_secured: 9
      rate_long_unsecured: 18
      adjust_protected: -4
      adjust_protected_light: -2
      adjust_none: 0
      adjust_over: 3
      adjust_high: 1
      adjust_conduct_none: 0
      driver_adjust_two: 4
      driver_adjust_one: 2
      driver_adjust_none: 0
      long_period_days: 14
      week_days: 7
      protection_fee_floor: 800.00
      allowance_share: 0.75
    rule: >-
      A driver under the young-driver threshold on the first day of the reserved period owes the young-driver surcharge on the reservation, raised as its own priced line, and what that line comes to is worked out as follows.
      The surcharge is the effective surcharge rate taken on the amount charged over, brought to the nearest cent again once that has been done.
      The amount charged over is the base-rate line standing on the reservation - every line raised for the base rate, taken together and as each was raised, a credit or a reversal raised against one of them being a line of its own and not taken off it - spread evenly over the days of the reserved period and taken for each day charged; the days of the reserved period run from the first day of that period to the last, both days counted, the daily figure the spreading gives is brought to the nearest cent, and the amount charged over is brought to the nearest cent in its turn.
      The standard surcharge rate is fifteen per cent, the days charged are the days the trip has already run, counted from the day the trip actually started to the day the surcharge is raised with that day counted, and the standard protection, conduct and additional-driver adjustments are nil.
      The effective surcharge rate is the surcharge rate with the protection adjustment, the conduct adjustment and the additional-driver adjustment applied to it, each of them in percentage points and all of them added together to the rate before the rate is taken on anything; where that leaves a rate below nothing, no surcharge is owed.
      The readings counted wherever this rule speaks of the reservation's odometer readings are the records its mileage record holds as readings of miles driven, which are the records that book miles against the allowance, and those alone; a reading of the fuel tank or the traction battery is not one of them whatever else it notes, and every reading of miles driven counts whoever took it - the marketplace's telematics, the host or the guest alike - since a reading that another supersedes books no miles against the allowance and so adds nothing to what the readings have booked.
      Where a condition in this rule asks how long the trip has run, the days are counted from the day the trip actually started to the day of handling, the day it started not counted and the day of handling counted.
      Where the reserved period runs for fourteen days or more and a deposit line stands on the reservation, whatever was afterwards done about it, the surcharge rate is nine per cent; where the reserved period runs for fourteen days or more and no deposit line stands on the reservation, the surcharge rate is eighteen per cent; in every other case the surcharge rate is the standard one.
      Where the trip's protection election stands active, is written as Keyturn Premier Protection or as Keyturn Business Traveler Protection, and the daily protection fees charged on it come to at least eight hundred dollars, however many lines they stand as and whenever they were raised, the protection adjustment is four percentage points off; where the trip's protection election stands active, is written as Keyturn Premier Protection or as Keyturn Business Traveler Protection, and the daily protection fees charged on it come to less than eight hundred dollars, the protection adjustment is two percentage points off; in every other case no protection adjustment is made. The fees counted are the daily protection fee lines raised on that election and those alone; a line raised on it for anything else - a young-driver protection surcharge, a level-change difference, an additional-driver fee, a deductible or a credit - is not a daily protection fee and is not counted.
      Where the reservation's odometer readings have booked more miles than the included miles granted to it, whatever those miles were granted for, and the trip has run for at least seven days, the conduct adjustment is three percentage points on; where those readings have booked more than three quarters of the included miles granted to the reservation but not more than that allowance and the trip has run for at least seven days, the conduct adjustment is one percentage point on; in every other case no conduct adjustment is made.
      Where two or more additional drivers are declared on the trip's protection election and the reserved period runs for fourteen days or more, the additional-driver adjustment is four percentage points on; where one additional driver is declared on the trip's protection election and the reserved period runs for fourteen days or more, the additional-driver adjustment is two percentage points on; in every other case no additional-driver adjustment is made.
      Where the trip started later than the first day of the reserved period and has run for at least seven days, the days charged run from the day the trip actually started to the scheduled return, the day of return counted; where the trip started on the first day of the reserved period and has run for at least seven days, the days charged run from the first day of the reserved period to the scheduled return, the day of return counted; in every other case the days charged are counted in the standard way.
    prerequisite: []
    cross_category:
      - category: guestplan
        as: branch
        reads: [protection_level_name, status, declared_secondary_driver_count, guestplan_charges.charge_amount]
        note: the protection adjustment and the additional-driver adjustment are decided from the protection election standing on this trip, the fees charged on it and the additional drivers declared on it
    compute:
      - reserved_days_c: "DAYS(F('trip_start_date'), F('trip_end_date')) + 1"
      - deposit_count: "COUNT('trips_charges', charge_basis='deposit')"
      - surcharge_rate: "K('rate_long_secured') if (reserved_days_c >= K('long_period_days') and deposit_count >= 1) else (K('rate_long_unsecured') if (reserved_days_c >= K('long_period_days') and deposit_count == 0) else K('rate_standard'))"
      - elec_level_c: "CFIELD('guestplan','protection_level_name', booking_id=HID)"
      - elec_status_c: "CFIELD('guestplan','status', booking_id=HID)"
      - elec_fees_c: "XSUM('guestplan','guestplan_charges','charge_amount', charge_basis='daily_protection_fee', booking_id=HID)"
      - protection_adjustment: "K('adjust_protected') if (elec_status_c == 'active' and (elec_level_c == 'Keyturn Premier Protection' or elec_level_c == 'Keyturn Business Traveler Protection') and elec_fees_c >= K('protection_fee_floor')) else (K('adjust_protected_light') if (elec_status_c == 'active' and (elec_level_c == 'Keyturn Premier Protection' or elec_level_c == 'Keyturn Business Traveler Protection') and elec_fees_c < K('protection_fee_floor')) else K('adjust_none'))"
      - granted_miles_c: "SUM('trips_usage','miles_delta', event_type='trips_mileage_allowance_granted')"
      - used_miles_c: "ABS(SUM('trips_usage','miles_delta', event_type='trips_mileage_usage_recorded'))"
      - days_run_c: "DAYS(F('actual_start_date'), NOW)"
      - conduct_adjustment: "K('adjust_over') if (used_miles_c > granted_miles_c and days_run_c >= K('week_days')) else (K('adjust_high') if (used_miles_c > K('allowance_share') * granted_miles_c and days_run_c >= K('week_days')) else K('adjust_conduct_none'))"
      - drivers_declared: "CFIELD('guestplan','declared_secondary_driver_count', booking_id=HID)"
      - driver_adjustment: "K('driver_adjust_two') if (drivers_declared >= 2 and reserved_days_c >= K('long_period_days')) else (K('driver_adjust_one') if (drivers_declared == 1 and reserved_days_c >= K('long_period_days')) else K('driver_adjust_none'))"
      - effective_rate: "MX(0, surcharge_rate + protection_adjustment + conduct_adjustment + driver_adjustment)"
      - days_charged: "DAYS(F('actual_start_date'), F('trip_end_date')) + 1 if (F('actual_start_date') > F('trip_start_date') and days_run_c >= K('week_days')) else (reserved_days_c if (F('actual_start_date') == F('trip_start_date') and days_run_c >= K('week_days')) else days_run_c + 1)"
      - daily_base: "RND(SUM('trips_charges','charge_amount', charge_basis='base_rate') / reserved_days_c, 2)"
      - charged_base: "RND(daily_base * days_charged, 2)"
      - result: "RND(effective_rate / 100 * charged_base, 2)"
    compute_basis:
      reserved_days_c: "The amount charged over is the base-rate line standing on the reservation - every line raised for the base rate, taken together and as each was raised, a credit or a reversal raised against one of them being a line of its own and not taken off it - spread evenly over the days of the reserved period and taken for each day charged; the days of the reserved period run from the first day of that period to the last, both days counted, the daily figure the spreading gives is brought to the nearest cent, and the amount charged over is brought to the nearest cent in its turn."
      deposit_count: "Where the reserved period runs for fourteen days or more and a deposit line stands on the reservation, whatever was afterwards done about it, the surcharge rate is nine per cent"
      surcharge_rate: "Where the reserved period runs for fourteen days or more and a deposit line stands on the reservation, whatever was afterwards done about it, the surcharge rate is nine per cent; where the reserved period runs for fourteen days or more and no deposit line stands on the reservation, the surcharge rate is eighteen per cent; in every other case the surcharge rate is the standard one."
      elec_level_c: "Where the trip's protection election stands active, is written as Keyturn Premier Protection or as Keyturn Business Traveler Protection, and the daily protection fees charged on it come to at least eight hundred dollars, however many lines they stand as and whenever they were raised, the protection adjustment is four percentage points off"
      elec_status_c: "where the trip's protection election stands active, is written as Keyturn Premier Protection or as Keyturn Business Traveler Protection, and the daily protection fees charged on it come to less than eight hundred dollars, the protection adjustment is two percentage points off"
      elec_fees_c: "the daily protection fees charged on it come to at least eight hundred dollars"
      protection_adjustment: "Where the trip's protection election stands active, is written as Keyturn Premier Protection or as Keyturn Business Traveler Protection, and the daily protection fees charged on it come to at least eight hundred dollars, however many lines they stand as and whenever they were raised, the protection adjustment is four percentage points off; where the trip's protection election stands active, is written as Keyturn Premier Protection or as Keyturn Business Traveler Protection, and the daily protection fees charged on it come to less than eight hundred dollars, the protection adjustment is two percentage points off; in every other case no protection adjustment is made. The fees counted are the daily protection fee lines raised on that election and those alone; a line raised on it for anything else - a young-driver protection surcharge, a level-change difference, an additional-driver fee, a deductible or a credit - is not a daily protection fee and is not counted."
      granted_miles_c: "Where the reservation's odometer readings have booked more miles than the included miles granted to it, whatever those miles were granted for, and the trip has run for at least seven days, the conduct adjustment is three percentage points on"
      used_miles_c: "where those readings have booked more than three quarters of the included miles granted to the reservation but not more than that allowance and the trip has run for at least seven days, the conduct adjustment is one percentage point on"
      days_run_c: "the days charged are the days the trip has already run, counted from the day the trip actually started to the day the surcharge is raised with that day counted"
      conduct_adjustment: "Where the reservation's odometer readings have booked more miles than the included miles granted to it, whatever those miles were granted for, and the trip has run for at least seven days, the conduct adjustment is three percentage points on; where those readings have booked more than three quarters of the included miles granted to the reservation but not more than that allowance and the trip has run for at least seven days, the conduct adjustment is one percentage point on; in every other case no conduct adjustment is made."
      drivers_declared: "Where two or more additional drivers are declared on the trip's protection election and the reserved period runs for fourteen days or more, the additional-driver adjustment is four percentage points on"
      driver_adjustment: "Where two or more additional drivers are declared on the trip's protection election and the reserved period runs for fourteen days or more, the additional-driver adjustment is four percentage points on; where one additional driver is declared on the trip's protection election and the reserved period runs for fourteen days or more, the additional-driver adjustment is two percentage points on; in every other case no additional-driver adjustment is made."
      effective_rate: "The effective surcharge rate is the surcharge rate with the protection adjustment, the conduct adjustment and the additional-driver adjustment applied to it, each of them in percentage points and all of them added together to the rate before the rate is taken on anything; where that leaves a rate below nothing, no surcharge is owed."
      days_charged: "Where the trip started later than the first day of the reserved period and has run for at least seven days, the days charged run from the day the trip actually started to the scheduled return, the day of return counted; where the trip started on the first day of the reserved period and has run for at least seven days, the days charged run from the first day of the reserved period to the scheduled return, the day of return counted; in every other case the days charged are counted in the standard way."
      daily_base: "The amount charged over is the base-rate line standing on the reservation - every line raised for the base rate, taken together and as each was raised, a credit or a reversal raised against one of them being a line of its own and not taken off it - spread evenly over the days of the reserved period and taken for each day charged; the days of the reserved period run from the first day of that period to the last, both days counted, the daily figure the spreading gives is brought to the nearest cent, and the amount charged over is brought to the nearest cent in its turn."
      charged_base: "The amount charged over is the base-rate line standing on the reservation - every line raised for the base rate, taken together and as each was raised, a credit or a reversal raised against one of them being a line of its own and not taken off it - spread evenly over the days of the reserved period and taken for each day charged; the days of the reserved period run from the first day of that period to the last, both days counted, the daily figure the spreading gives is brought to the nearest cent, and the amount charged over is brought to the nearest cent in its turn."
      result: "The surcharge is the effective surcharge rate taken on the amount charged over, brought to the nearest cent again once that has been done."
    factors:
      - id: secured_period_rate
        effect: parameter
        decides: surcharge_rate
        bindings: [reserved_days_c, deposit_count, surcharge_rate]
        ladder:
          - when: "the reserved period runs for fourteen days or more and a deposit line stands on the reservation, whatever was afterwards done about it"
            value: "K('rate_long_secured')"
          - when: "the reserved period runs for fourteen days or more and no deposit line stands on the reservation"
            value: "K('rate_long_unsecured')"
          - when: "otherwise"
            value: "K('rate_standard')"
        baseline:
          surcharge_rate: "K('rate_standard')"
        evidence: [history, date]
        cross_difficulty: null
      - id: protection_level_adjustment
        effect: parameter
        decides: protection_adjustment
        bindings: [elec_level_c, elec_status_c, elec_fees_c, protection_adjustment]
        ladder:
          - when: "the trip's protection election stands active, is written as Keyturn Premier Protection or as Keyturn Business Traveler Protection, and the daily protection fees charged on it come to at least eight hundred dollars"
            value: "K('adjust_protected')"
          - when: "the trip's protection election stands active, is written as Keyturn Premier Protection or as Keyturn Business Traveler Protection, and the daily protection fees charged on it come to less than eight hundred dollars"
            value: "K('adjust_protected_light')"
          - when: "otherwise"
            value: "K('adjust_none')"
        baseline:
          protection_adjustment: "K('adjust_none')"
        evidence: [cross_category, history]
        cross_difficulty: guestplan
      - id: allowance_conduct_adjustment
        effect: parameter
        decides: conduct_adjustment
        bindings: [granted_miles_c, used_miles_c, days_run_c, conduct_adjustment]
        ladder:
          - when: "the reservation's odometer readings have booked more miles than the included miles granted to it, whatever those miles were granted for, and the trip has run for at least seven days"
            value: "K('adjust_over')"
          - when: "those readings have booked more than three quarters of the included miles granted to the reservation but not more than that allowance and the trip has run for at least seven days"
            value: "K('adjust_high')"
          - when: "otherwise"
            value: "K('adjust_conduct_none')"
        baseline:
          conduct_adjustment: "K('adjust_conduct_none')"
        evidence: [history, date]
        cross_difficulty: null
      - id: declared_driver_adjustment
        effect: parameter
        decides: driver_adjustment
        bindings: [drivers_declared, driver_adjustment]
        ladder:
          - when: "two or more additional drivers are declared on the trip's protection election and the reserved period runs for fourteen days or more"
            value: "K('driver_adjust_two')"
          - when: "one additional driver is declared on the trip's protection election and the reserved period runs for fourteen days or more"
            value: "K('driver_adjust_one')"
          - when: "otherwise"
            value: "K('driver_adjust_none')"
        baseline:
          driver_adjustment: "K('driver_adjust_none')"
        evidence: [cross_category]
        cross_difficulty: guestplan
      - id: charged_days_anchor
        effect: method
        decides: days_charged
        bindings: [days_charged]
        ladder:
          - when: "the trip started later than the first day of the reserved period and has run for at least seven days"
            method: "the days charged run from the day the trip actually started to the scheduled return, the day of return counted"
          - when: "the trip started on the first day of the reserved period and has run for at least seven days"
            method: "the days charged run from the first day of the reserved period to the scheduled return, the day of return counted"
          - when: "otherwise"
            method: "the days charged are the days the trip has already run, counted from the day the trip actually started to the day the surcharge is raised with that day counted"
        baseline:
          days_charged: "days_run_c + 1"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        The surcharge is the effective surcharge rate taken on the amount charged over, brought to the nearest cent again once that has been done.
        The amount charged over is the base-rate line standing on the reservation - every line raised for the base rate, taken together and as each was raised, a credit or a reversal raised against one of them being a line of its own and not taken off it - spread evenly over the days of the reserved period and taken for each day charged; the days of the reserved period run from the first day of that period to the last, both days counted, the daily figure the spreading gives is brought to the nearest cent, and the amount charged over is brought to the nearest cent in its turn.
        The standard surcharge rate is fifteen per cent, the days charged are the days the trip has already run, counted from the day the trip actually started to the day the surcharge is raised with that day counted, and the standard protection, conduct and additional-driver adjustments are nil.
        The effective surcharge rate is the surcharge rate with the protection adjustment, the conduct adjustment and the additional-driver adjustment applied to it, each of them in percentage points and all of them added together to the rate before the rate is taken on anything; where that leaves a rate below nothing, no surcharge is owed.
      params: [rate_standard, adjust_none, adjust_conduct_none, driver_adjust_none]
    inputs:
      history:
        - {table: trips_charges, aggregate: count, field: charge_id, within_months: null, filters: {charge_basis: deposit}}
        - {table: trips_charges, aggregate: sum, field: charge_amount, within_months: null, filters: {charge_basis: base_rate}}
        - {table: trips_usage, aggregate: sum, field: miles_delta, within_months: null, filters: {event_type: trips_mileage_allowance_granted}}
        - {table: trips_usage, aggregate: sum, field: miles_delta, within_months: null, filters: {event_type: trips_mileage_usage_recorded}}
        - {category: guestplan, table: guestplan_charges, aggregate: sum, field: charge_amount, within_months: null, filters: {charge_basis: daily_protection_fee}}
      cross_category: [guestplan]

  - id: trips_ext_extension_quote
    base_policy_refs: [trips_evt_extension]
    overwrite:
      - base_policy: trips_evt_extension
        superseded_clause: >-
          Extended time is priced at the locked daily rate lifted by the plan's uplift percentage, applied to the extended days only
        replaced_by: >-
          The price of the extended time is the locked daily rate of the reservation lifted by the extension uplift, taken for each extended day, where the extended days are the extra time quoted divided by twenty-four and rounded up to the next whole day, never fewer than one day; the lifted daily rate is brought to the nearest cent, and the price of the extended time is brought to the nearest cent in its turn.
    trigger: on_request
    subject: [trips_extension_charge_posted]
    computes: quoted_amount
    target_tool: submit_extension_request_8f69bfd6
    params:
      uplift_standard: 8
      uplift_repeat: 4
      uplift_declined: 12
      max_extra_hours: 72
      hours_in_day: 24
      lodgement_repeat: 24.00
      lodgement_first: 12.00
      lodgement_none: 0.00
      cover_credit_high: 14.00
      cover_credit_low: 9.00
      cover_credit_none: 0.00
      protection_fee_floor: 800.00
      week_days: 7
      two_day_extension: 2
    rule: >-
      A guest who wants the vehicle for longer is quoted a price for the extra time before the request goes onto the extension request register, and that quote is worked out as follows. A quote for extra time is not fixed before the reservation carries the young-driver surcharge owed on the driver named on it.
      The quote is the price of the extended time, with the young-driver share and the register lodgement charge added to it and the cover credit taken off it, taken as nothing where that comes out below nothing, and brought to the nearest cent again once those have been put together; the cover credit is itself brought to the nearest cent when the credit for each extended day is taken for all of them.
      The price of the extended time is the locked daily rate of the reservation lifted by the extension uplift, taken for each extended day, where the extended days are the extra time quoted divided by twenty-four and rounded up to the next whole day, never fewer than one day; the lifted daily rate is brought to the nearest cent, and the price of the extended time is brought to the nearest cent in its turn.
      The standard extension uplift is eight per cent, the extra time quoted is the longest further time the reservation can still take, which is seventy-two hours, no young-driver share is added as standard, no register lodgement charge is made as standard, and no cover credit is given as standard.
      The readings counted wherever this rule speaks of the reservation's odometer readings are the records its mileage record holds as readings of miles driven, which are the records that book miles against the allowance, and those alone; a reading of the fuel tank or the traction battery is not one of them whatever else it notes, and every reading of miles driven counts whoever took it - the marketplace's telematics, the host or the guest alike - since a reading that another supersedes books no miles against the allowance and so adds nothing to what the readings have booked.
      Where a condition in this rule asks how long the trip has run, the days are counted from the day the trip actually started to the day of handling, the day it started not counted and the day of handling counted.
      Where the reservation carries an extension request that expired without a decision and the trip has run for at least seven days, the extension uplift is four per cent; where the reservation carries no request that expired without a decision but carries one that was declined, and the trip has run for at least seven days, the extension uplift is twelve per cent; in every other case the extension uplift is the standard one.
      Where the reservation carries an extension request that expired without a decision and the trip has run for at least seven days, the extra time quoted is the extra time that expired request asked for, and where more than one such request stands the one read is the latest of them by the time it was put on the register; where the reservation carries no request that expired without a decision but carries one that was declined, and the trip has run for at least seven days, the extra time quoted is the extra time that declined request asked for, and where more than one such request stands the one read is the latest of them by the time it was put on the register, held to the longest further time the reservation can still take; in every other case the extra time quoted is worked out in the standard way.
      Where a young-driver surcharge stands on the reservation and the extra time quoted runs to two days or more, the young-driver share is that surcharge - every young-driver surcharge line standing on the reservation taken together, as each was raised and whatever was afterwards done about it - spread evenly over the days of the reserved period - which run from the first day of that period to the last, both days counted - and taken for each extended day, the share being brought to the nearest cent once the spreading and the taking have both been done and at no earlier step; where a young-driver surcharge stands on the reservation and the extra time quoted runs to less than two days, the young-driver share is that surcharge spread evenly over the days of the reserved period - which run from the first day of that period to the last, both days counted - and taken for one day, the share being brought to the nearest cent once the spreading and the taking have both been done and at no earlier step; in every other case no young-driver share is added.
      Lodging a request neither moves the reservation's scheduled return nor changes its dates, so the register lodgement charge is not the fee the marketplace charges for a date change once a reservation's free date changes are used; it is charged for putting a fresh request on the extension request register while earlier requests already stand there. Where two or more extension requests already stand on the extension request register against the reservation, the register lodgement charge is twenty-four dollars; where one extension request already stands on the register against the reservation, the register lodgement charge is twelve dollars; in every other case no register lodgement charge is made. A request stands on the register whatever has become of it - submitted, under the host's review, approved, declined, expired or withdrawn alike - and each is counted, because what this charge answers to is the request already lodged on the register and not anything the reservation has since done; that a declined or an expired request leaves the reservation itself untouched is why it is the register, and not the reservation, that this count is taken over.
      Where the trip's protection election stands active and the daily protection fees charged on it come to at least eight hundred dollars, however many lines they stand as and whenever they were raised, the cover credit is fourteen dollars for each extended day; where the trip's protection election stands active and the daily protection fees charged on it come to less than eight hundred dollars, the cover credit is nine dollars for each extended day; in every other case no cover credit is given. The fees counted are the daily protection fee lines raised on that election and those alone; a line raised on it for anything else - a young-driver protection surcharge, a level-change difference, an additional-driver fee, a deductible or a credit - is not a daily protection fee and is not counted.
    prerequisite:
      - problem: trips_ext_young_driver_surcharge
        kind: value_input
        gate: yd_share
        form: state
        policy_source: >-
          A quote for extra time is not fixed before the reservation carries the young-driver surcharge owed on the driver named on it.
        condition: >-
          a young-driver surcharge line stands among the priced lines of the reservation the extra time is quoted on
        resolved_by: post_young_driver_surcharge_8e3312c3
        effect: >-
          the binding yd_share takes the share of the surcharge standing on the reservation that falls on the extended days, where with no such line standing it is nothing
    cross_category:
      - category: guestplan
        as: branch
        reads: [status, guestplan_charges.charge_amount]
        note: the cover credit given on the extended days is decided from whether the trip's protection election stands active and from the protection fees charged on it
    compute:
      - days_run_b: "DAYS(F('actual_start_date'), NOW)"
      - expired_count: "COUNT('trips_extension_requests', request_status='expired')"
      - declined_count: "COUNT('trips_extension_requests', request_status='declined')"
      - uplift: "K('uplift_repeat') if (expired_count >= 1 and days_run_b >= K('week_days')) else (K('uplift_declined') if (declined_count >= 1 and days_run_b >= K('week_days')) else K('uplift_standard'))"
      - expired_hours: "LATEST('trips_extension_requests','additional_hours', date_field='created_at', request_status='expired')"
      - declined_hours: "LATEST('trips_extension_requests','additional_hours', date_field='created_at', request_status='declined')"
      - extra_hours: "expired_hours if (expired_count >= 1 and days_run_b >= K('week_days')) else (MN(declined_hours, K('max_extra_hours')) if (declined_count >= 1 and days_run_b >= K('week_days')) else K('max_extra_hours'))"
      - extended_days: "MX(1, -(-extra_hours // K('hours_in_day')))"
      - uplifted_daily: "RND(F('daily_rate_amount') * (1 + uplift / 100), 2)"
      - extension_price: "RND(uplifted_daily * extended_days, 2)"
      - surcharge_line: "SUM('trips_charges','charge_amount', charge_basis='young_driver_surcharge')"
      - reserved_days_b: "DAYS(F('trip_start_date'), F('trip_end_date')) + 1"
      - yd_share: "RND(surcharge_line / reserved_days_b * extended_days, 2) if (surcharge_line > 0 and extended_days >= K('two_day_extension')) else (RND(surcharge_line / reserved_days_b, 2) if (surcharge_line > 0 and extended_days < K('two_day_extension')) else 0.0)"
      - change_count: "COUNT('trips_extension_requests')"
      - lodgement_charge: "K('lodgement_repeat') if (change_count >= 2) else (K('lodgement_first') if (change_count == 1) else K('lodgement_none'))"
      - elec_status_b: "CFIELD('guestplan','status', booking_id=HID)"
      - elec_fees_b: "XSUM('guestplan','guestplan_charges','charge_amount', charge_basis='daily_protection_fee', booking_id=HID)"
      - cover_credit_day: "K('cover_credit_high') if (elec_status_b == 'active' and elec_fees_b >= K('protection_fee_floor')) else (K('cover_credit_low') if (elec_status_b == 'active' and elec_fees_b < K('protection_fee_floor')) else K('cover_credit_none'))"
      - cover_credit: "RND(cover_credit_day * extended_days, 2)"
      - result: "RND(MX(0, extension_price + yd_share + lodgement_charge - cover_credit), 2)"
    compute_basis:
