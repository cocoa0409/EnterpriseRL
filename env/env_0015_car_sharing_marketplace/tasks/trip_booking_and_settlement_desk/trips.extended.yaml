category: trips
display_name: Keyturn Trip Booking

# ---- binding to db_schema.json -------------------------------------------------
binding:
  holding_table: trips_bookings
  event_tables: [trips_charges, trips_usage]
  intake_tables: [trips_extension_requests]
  status_field: status
  variant_field: rate_plan_name
  quantity_fields:
    balance_due: guest_balance
    miles_remaining: mileage_allowance
    reserved_hours_total: booked_hours

# ---- lifecycle -----------------------------------------------------------------
lifecycle:
  states: [requested, booked, in_progress, completed, settled, cancelled]
  transitions:
    - {from: requested, to: booked, by: system, means: The host accepts the request, or instant book confirms it against the calendar.}
    - {from: requested, to: cancelled, by: user, means: The guest withdraws the request before the host has confirmed it.}
    - {from: requested, to: cancelled, by: agent, means: Support withdraws a request the host can no longer serve.}
    - {from: booked, to: in_progress, by: user, means: The guest completes check-in and takes the vehicle.}
    - {from: booked, to: cancelled, by: user, means: The guest cancels a confirmed booking before the trip starts.}
    - {from: booked, to: cancelled, by: agent, means: Support cancels a confirmed booking because the vehicle has become unavailable.}
    - {from: in_progress, to: completed, by: user, means: The guest returns the vehicle and the trip clock stops.}
    - {from: completed, to: settled, by: agent, means: Every end-of-trip charge has been posted and the booking is closed for billing.}

# ---- accounts ------------------------------------------------------------------
accounts:
  - key: guest_balance
    unit: USD
    meaning: What the guest owes on this booking, charges raising it and refunds lowering it.
  - key: mileage_allowance
    unit: miles
    meaning: Included miles still unused on this booking, granted by the plan and consumed by driven miles.
  - key: booked_hours
    unit: hours
    meaning: Hours of vehicle time currently reserved on this booking.

# ---- parameter dictionary ------------------------------------------------------
parameter_schema:
  min_booking_duration_hours: Shortest reservation the plan accepts, in hours.
  max_booking_duration_hours: Longest reservation the plan accepts, in hours.
  billing_increment_hours: Unit of time the reservation is priced in, in hours.
  included_miles_per_day: Miles included for each 24 hours of reserved time.
  included_miles_cap_per_booking: Ceiling on the included miles one booking can accumulate, in miles.
  unlimited_mileage_available: Whether the plan can waive mileage metering altogether (true/false switch).
  mileage_overage_rate_per_mile: Price of each mile driven beyond the allowance, in USD.
  mileage_overage_grace_miles: Miles beyond the allowance that are not charged, in miles.
  extra_miles_package_size_miles: Size of one purchasable block of extra miles, in miles.
  extra_miles_package_price: Price of one block of extra miles, in USD.
  trip_fee_percent: Marketplace trip fee charged to the guest, as a percentage of the base rate.
  trip_fee_minimum_amount: Floor under the marketplace trip fee, in USD.
  booking_deposit_amount: Refundable deposit authorised at booking, in USD.
  deposit_hold_days: Calendar days the deposit stays authorised after the trip ends.
  free_cancellation_window_hours: Hours after confirmation during which cancellation costs nothing.
  cancellation_fee_percent_in_window: Percentage of one day's rate charged when cancelling after the free window.
  cancellation_fee_flat_amount: Flat component added to a chargeable cancellation, in USD.
  cancellation_fee_cap_amount: Ceiling on a cancellation fee, in USD.
  no_show_grace_minutes: Minutes after the scheduled start before a guest counts as a no-show.
  no_show_fee_amount: Fee charged for a no-show, in USD.
  late_return_grace_minutes: Minutes past the scheduled return that are not charged.
  late_return_fee_per_hour: Price of each late hour beyond the grace, in USD.
  late_return_escalation_hours: Late hours after which a whole extra day is charged instead.
  late_return_daily_cap_amount: Ceiling on late-return charges for one day, in USD.
  early_return_credit_allowed: Whether returning early earns a credit (true/false switch).
  early_return_credit_percent: Percentage of the unused reserved time credited back on an early return.
  extension_request_lead_hours: Hours before the scheduled return by which an extension must be asked for.
  extension_max_additional_hours: Longest extension the plan allows on one booking, in hours.
  extension_rate_uplift_percent: Uplift applied to the daily rate for extended time, as a percentage.
  extension_decision_window_hours: Hours the host has to decide an extension request.
  extension_included_miles_per_day: Miles included for each 24 hours of extended time.
  fuel_return_tolerance_percent: Percentage points of tank or battery the vehicle may be returned short by without charge.
  refuel_service_fee_amount: Flat service fee for refuelling a combustion vehicle, in USD.
  refuel_rate_per_percent: Price of each percentage point of fuel replaced, in USD.
  ev_recharge_service_fee_amount: Flat service fee for recharging an electric vehicle, in USD.
  ev_recharge_rate_per_percent: Price of each percentage point of battery replaced, in USD.
  cleaning_fee_amount: Fee for returning a vehicle needing more than ordinary cleaning, in USD.
  smoking_violation_fee_amount: Fee for evidence of smoking in the vehicle, in USD.
  pet_hair_fee_amount: Fee for pet hair requiring specialist cleaning, in USD.
  delivery_fee_amount: Fee for delivering the vehicle to the guest, in USD.
  airport_surcharge_amount: Surcharge added when the handover happens at an airport, in USD.
  young_driver_surcharge_percent: Surcharge on the base rate for drivers under the young-driver threshold, as a percentage.
  young_driver_age_threshold_years: Age below which the young-driver surcharge applies, in whole years.
  minimum_driver_age_years: Youngest age the plan will book a driver at, in whole years.
  advance_booking_max_days: How far ahead of the start date the plan may be booked, in calendar days.
  instant_book_enabled: Whether the plan can confirm without the host accepting (true/false switch).
  host_acceptance_window_hours: Hours the host has to accept a request before it expires.
  weekly_discount_percent: Discount applied to the base rate on reservations of a week or more, as a percentage.
  monthly_discount_percent: Discount applied to the base rate on reservations of a month or more, as a percentage.
  weekend_minimum_nights: Nights a reservation covering a Saturday must run for, in whole nights.
  modification_fee_amount: Fee for changing the dates of a confirmed booking once the free changes are used, in USD.
  modification_free_changes_count: Date changes allowed on one booking before the modification fee applies.
  late_payment_fee_amount: Fee added when a trip charge is still unpaid after the retries are exhausted, in USD.
  payment_retry_count: Times a failed trip charge is re-presented to the card on file.
  payment_retry_interval_hours: Hours between two attempts to re-present a failed charge.
  refund_processing_days: Business days a refund takes to reach the guest's card.
  toll_admin_fee_amount: Administration fee for passing on a toll incurred during the trip, in USD.
  citation_admin_fee_amount: Administration fee for passing on a parking or traffic citation, in USD.
  rebooking_credit_percent: Percentage of the trip price credited when the marketplace has to rebook the guest.
  rebooking_credit_validity_days: Calendar days a rebooking credit stays usable for.
  min_completed_trips_for_instant_book: Completed trips a guest needs before instant book is offered to them.
  max_concurrent_open_bookings: Bookings the guest may hold at once in the requested, booked or in_progress states.
  security_deposit_waiver_driver_score: Driver score at or above which the deposit is not taken.
  overlap_buffer_hours: Hours that must separate two bookings the same guest holds, in hours.

