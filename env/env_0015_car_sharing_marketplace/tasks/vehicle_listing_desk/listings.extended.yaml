    evidence_fields:
    - listings_vehicles.status
    - listings_vehicles.last_inspection_date
    - listings_vehicles.vehicle_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - listings_vehicles.vehicle_id
      action_bindings:
        listings_vehicles.vehicle_id: vehicle_id
    state_contract:
      field: listings_vehicles.status
      allowed:
      - pending_review
      - listed
