- id: listings_evt_defect
  subject:
  - listings_defect_reported
  rule: A fault reported on a vehicle is recorded against the listing whoever reported it, and a guest's report carries the same weight as a workshop's for the purpose of opening the record. What the report does next depends on the fault. A safety fault gives the host the class's safety grace in whole elapsed hours counted from the report, after which the listing is suspended until the fault is put right. An ordinary fault gives the host the class's rectification period in whole calendar days. An open safety recall suspends the listing at once with no grace at all, and the vehicle returns only when a recall clearance document has been verified; the host's word that the work has been done is not a clearance. Putting a fault right is evidenced by a fresh inspection record, not by the host marking it resolved, and a listing whose fault is still open at the end of its period is suspended rather than warned again. A vehicle with more than the recorded number of faults over the rolling twelve months goes to a compliance review however promptly each one was put right, because a pattern of faults is itself a finding. A fault reported on a trip does not by itself make the guest liable for it, and liability is settled under the protection rules rather than by the fault record.
  eligibility:
  - id: defect_recorded_while_active_listing
    applies_to:
    - listings_defect_reported
    kind: state
    condition: A fault reported on a vehicle is recorded against the listing whoever reported it, and a guest's report carries the same weight as a workshop's for the purpose of opening the record.
    evidence_fields:
    - listings_vehicles.status
    - listings_vehicles.vehicle_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - listings_vehicles.vehicle_id
      action_bindings:
        listings_vehicles.vehicle_id: vehicle_id
    state_contract:
      field: listings_vehicles.status
      allowed:
      - pending_review
      - listed
      - snoozed
      - suspended
  params:
    defect_count_before_compliance_review: 4
    per_tier:
      Keyturn Economy Class Listing:
        defect_rectification_days: =defect_rectification_days
        recall_rectification_days: =recall_rectification_days
        safety_defect_grace_hours: =safety_defect_grace_hours
      Keyturn Standard Class Listing:
        defect_rectification_days: =defect_rectification_days
        recall_rectification_days: =recall_rectification_days
        safety_defect_grace_hours: =safety_defect_grace_hours
      Keyturn Premium Class Listing:
