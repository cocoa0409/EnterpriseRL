- id: listings_ext_valuation_assessment
  base_policy_refs:
  - listings_evt_valuation
  overwrite: []
  trigger: state_due
  subject:
  - listings_valuation_reassessed
  computes: assessed_value_amount
  target_tool: record_vehicle_valuation_559b4236
  params:
    heavy_use_depreciation_rate: 0.009
    settled_use_depreciation_rate: 0.0075
    standard_depreciation_rate: 0.006
    recent_fault_pattern_holdback: 0.06
    single_fault_holdback: 0.03
    no_fault_holdback: 0.0
    claim_pattern_holdback: 0.08
    single_claim_holdback: 0.04
    no_claim_holdback: 0.0
    near_interval_advisory_holdback: 0.05
    advisory_holdback: 0.02
    no_advisory_holdback: 0.0
  rule: A marketplace valuation of a Keyturn Vehicle Listing starts from the vehicle value standing on the listing and steps that value down for the time that has passed since the valuation standing on the vehicle's condition record. The standard step-down is six thousandths of the starting value for each whole calendar month counted from the anchor date to the handling date, a part month not counting, and the anchor date is the date of the valuation standing on the condition record. The step-down is worked out as one rate for the whole stretch of months and taken off the starting value once, and is never compounded month by month. The stepped figure is rounded half away from zero to two decimal places, and that rounded figure is the valuation the marketplace records. Where the vehicle's record calls for holdbacks, they are summed into a single rate, that rate is applied once to the stepped figure, and the figure so reduced is rounded half away from zero to two decimal places and recorded in place of the stepped figure. The valuation the marketplace records is fixed only after every fault the vehicle's condition record has been advised of stands on that record as a fault report of its own. A vehicle that has run more than six thousand miles since the valuation standing on its condition record and whose listing has been live for thirty-six whole months or more steps down at nine thousandths of the starting value a month; one that has run more than six thousand miles since that valuation whose listing has been live for fewer than thirty-six whole months steps down at seven and a half thousandths a month; and any other vehicle steps down at the standard rate. Where a completed inspection stands on the vehicle's condition record later than the valuation standing there, the anchor date is the date of that inspection; where no completed inspection stands later than that valuation but an odometer reading does, the anchor date is the date of the most recent such reading; and otherwise the anchor date is the date of the valuation standing on the record. A vehicle carrying three or more fault reports in the rolling twelve months counted back from the handling date, the most recent of them dated later than its last completed inspection, carries a holdback of six hundredths; one carrying one or two such reports in that window with the most recent dated later than its last completed inspection carries a holdback of three hundredths; and any other vehicle carries no holdback on this ground. A vehicle whose host protection enrolment shows two or more claims filed in the rolling twenty-four months counted back from the handling date, or appraisals settled in that window totalling more than five thousand dollars, carries a holdback of eight hundredths; one whose enrolment shows exactly one claim filed in that window with appraisals settled there totalling five thousand dollars or less carries a holdback of four hundredths; and any other vehicle carries no holdback on this ground. A vehicle whose most recent completed inspection passed with advisories and which has fewer than one thousand miles of inspection interval left carries a holdback of five hundredths; one whose most recent completed inspection passed with advisories and which has one thousand miles or more of interval left carries a holdback of two hundredths; and any other vehicle carries no holdback on this ground. A vehicle carrying workshop invoices of one thousand two hundred dollars or more under a Keyturn Vehicle Care Plan in the rolling twenty-four months counted back from the handling date steps down at three quarters of the rate that otherwise applies; one carrying such invoices of four hundred dollars or more but under one thousand two hundred steps down at nine tenths of that rate; and one carrying less than four hundred dollars of such invoices steps down at the rate as it stands. A valuation the marketplace records once its refresh interval has fallen due is its own inspector's assessment of the vehicle, is recorded under that channel, and is made on the odometer standing on the listing at the handling date.
  prerequisite:
  - problem: listings_ext_fault_intake
    kind: value_input
    gate: condition_holdback
    form: state
    policy_source: The valuation the marketplace records is fixed only after every fault the vehicle's condition record has been advised of stands on that record as a fault report of its own.
    condition: Every fault the condition record has been advised of stands on that record as a fault report row of its own at the moment the valuation is worked out.
    resolved_by: log_vehicle_fault_a3e017f7
    effect: Once the advised fault stands as a fault report of its own, the count of fault reports in the rolling twelve months rises by that report and the condition holdback binding is read on the higher count.
  cross_category:
  - category: hostplan
    as: history
    reads:
    - hostplan_claims.event_type
    - hostplan_claims.claim_date
    - hostplan_claims.appraisal_amount
    note: The claims filed and the appraisals settled on the vehicle's host protection enrolment decide which tier of the damage history holdback applies.
  - category: service
    as: history
    reads:
    - service_visits.invoice_amount
    - service_visits.visit_date
    note: The workshop spend under the vehicle's Keyturn Vehicle Care Plan decides which tier of the maintained vehicle step-down rule applies.
  compute:
  - base_value: F('market_value_amount')
  - last_valuation_date: LATEST('listings_inspections', 'record_date', date_field='record_date', event_type='listings_valuation_reassessed')
  - last_valuation_odometer: LATEST('listings_inspections', 'odometer_reading', date_field='record_date', event_type='listings_valuation_reassessed')
  - highest_reading: MAX('listings_inspections', 'odometer_reading')
  - miles_since_valuation: highest_reading - last_valuation_odometer
  - listing_age_months: MONTHS(F('listed_date'), NOW)
  - depreciation_rate: K('heavy_use_depreciation_rate') if (miles_since_valuation > 6000 and listing_age_months >= 36) else (K('settled_use_depreciation_rate') if (miles_since_valuation > 6000 and listing_age_months < 36) else K('standard_depreciation_rate'))
  - last_inspection_date: F('last_inspection_date')
  - last_reading_date: LATEST('listings_inspections', 'record_date', date_field='record_date', event_type='listings_odometer_reported')
  - anchor_date: last_inspection_date if last_inspection_date > last_valuation_date else (last_reading_date if last_reading_date > last_valuation_date else last_valuation_date)
  - anchor_months: MONTHS(anchor_date, NOW)
  - faults_12m: COUNT('listings_inspections', within_months=12, date_field='record_date', event_type='listings_defect_reported')
  - latest_fault_date: LATEST('listings_inspections', 'record_date', date_field='record_date', event_type='listings_defect_reported')
  - condition_holdback: K('recent_fault_pattern_holdback') if (faults_12m >= 3 and latest_fault_date > last_inspection_date) else (K('single_fault_holdback') if (faults_12m >= 1 and faults_12m < 3 and latest_fault_date > last_inspection_date) else K('no_fault_holdback'))
  - claims_filed_24m: XCOUNT('hostplan', 'hostplan_claims', within_months=24, date_field='claim_date', event_type='hostplan_claim_filed')
  - appraised_total_24m: XSUM('hostplan', 'hostplan_claims', 'appraisal_amount', within_months=24, date_field='claim_date', event_type='hostplan_claim_appraised')
  - damage_holdback: K('claim_pattern_holdback') if (claims_filed_24m >= 2 or appraised_total_24m > 5000) else (K('single_claim_holdback') if (claims_filed_24m == 1 and appraised_total_24m <= 5000) else K('no_claim_holdback'))
  - interval_credit_left: F('miles_to_next_inspection')
  - last_inspection_outcome: LATEST('listings_inspections', 'inspection_outcome', date_field='record_date', event_type='listings_inspection_completed')
  - advisory_holdback_rate: K('near_interval_advisory_holdback') if (last_inspection_outcome == 'passed_with_advisories' and interval_credit_left < 1000) else (K('advisory_holdback') if (last_inspection_outcome == 'passed_with_advisories' and interval_credit_left >= 1000) else K('no_advisory_holdback'))
  - workshop_spend_24m: XSUM('service', 'service_visits', 'invoice_amount', within_months=24, date_field='visit_date')
  - effective_rate: RND(depreciation_rate * 0.75, 6) if workshop_spend_24m >= 1200 else (RND(depreciation_rate * 0.90, 6) if workshop_spend_24m >= 400 else depreciation_rate)
  - stepped_value: RND(base_value * (1 - effective_rate * anchor_months), 2)
  - total_holdback: condition_holdback + damage_holdback + advisory_holdback_rate
  - result: RND(stepped_value * (1 - total_holdback), 2)
  compute_basis:
    base_value: A marketplace valuation of a Keyturn Vehicle Listing starts from the vehicle value standing on the listing and steps that value down for the time that has passed since the valuation standing on the vehicle's condition record.
    last_valuation_date: The standard step-down is six thousandths of the starting value for each whole calendar month counted from the anchor date to the handling date, a part month not counting, and the anchor date is the date of the valuation standing on the condition record.
    last_valuation_odometer: A vehicle that has run more than six thousand miles since the valuation standing on its condition record and whose listing has been live for thirty-six whole months or more steps down at nine thousandths of the starting value a month; one that has run more than six thousand miles since that valuation whose listing has been live for fewer than thirty-six whole months steps down at seven and a half thousandths a month; and any other vehicle steps down at the standard rate.
    highest_reading: A vehicle that has run more than six thousand miles since the valuation standing on its condition record and whose listing has been live for thirty-six whole months or more steps down at nine thousandths of the starting value a month; one that has run more than six thousand miles since that valuation whose listing has been live for fewer than thirty-six whole months steps down at seven and a half thousandths a month; and any other vehicle steps down at the standard rate.
    miles_since_valuation: A vehicle that has run more than six thousand miles since the valuation standing on its condition record and whose listing has been live for thirty-six whole months or more steps down at nine thousandths of the starting value a month; one that has run more than six thousand miles since that valuation whose listing has been live for fewer than thirty-six whole months steps down at seven and a half thousandths a month; and any other vehicle steps down at the standard rate.
    listing_age_months: A vehicle that has run more than six thousand miles since the valuation standing on its condition record and whose listing has been live for thirty-six whole months or more steps down at nine thousandths of the starting value a month; one that has run more than six thousand miles since that valuation whose listing has been live for fewer than thirty-six whole months steps down at seven and a half thousandths a month; and any other vehicle steps down at the standard rate.
    depreciation_rate: A vehicle that has run more than six thousand miles since the valuation standing on its condition record and whose listing has been live for thirty-six whole months or more steps down at nine thousandths of the starting value a month; one that has run more than six thousand miles since that valuation whose listing has been live for fewer than thirty-six whole months steps down at seven and a half thousandths a month; and any other vehicle steps down at the standard rate.
    last_inspection_date: Where a completed inspection stands on the vehicle's condition record later than the valuation standing there, the anchor date is the date of that inspection; where no completed inspection stands later than that valuation but an odometer reading does, the anchor date is the date of the most recent such reading; and otherwise the anchor date is the date of the valuation standing on the record.
