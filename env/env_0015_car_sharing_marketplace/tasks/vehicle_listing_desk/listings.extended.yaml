    effective_rate: A vehicle carrying workshop invoices of one thousand two hundred dollars or more under a Keyturn Vehicle Care Plan in the rolling twenty-four months counted back from the handling date steps down at three quarters of the rate that otherwise applies; one carrying such invoices of four hundred dollars or more but under one thousand two hundred steps down at nine tenths of that rate; and one carrying less than four hundred dollars of such invoices steps down at the rate as it stands.
    stepped_value: The step-down is worked out as one rate for the whole stretch of months and taken off the starting value once, and is never compounded month by month.
    total_holdback: Where the vehicle's record calls for holdbacks, they are summed into a single rate, that rate is applied once to the stepped figure, and the figure so reduced is rounded half away from zero to two decimal places and recorded in place of the stepped figure.
    result: Where the vehicle's record calls for holdbacks, they are summed into a single rate, that rate is applied once to the stepped figure, and the figure so reduced is rounded half away from zero to two decimal places and recorded in place of the stepped figure.
