events:
- type: listings_vehicle_created
  target: listings_vehicles
  mutation: create
  meaning: A host begins a listing for one of their vehicles.
  grain: One row per vehicle a host puts forward to list.
  fields:
    vehicle_id: Reference number of the listing.
    customer_id: The host who owns it.
    value_class_name: The value class the listing is opened in.
    status: Lifecycle state, which a new listing enters as draft.
    make: Vehicle make as registered.
    model: Vehicle model as registered.
    model_year: Model year of the vehicle.
    vin_last6: The last six characters of the vehicle identification number.
    odometer_miles: Odometer reading at the time the listing is opened.
    market_value_amount: The marketplace valuation of the vehicle.
    daily_price_amount: The daily price the host asks.
    title_status: How the vehicle is titled.
    lienholder_name: The finance company or lessor on the title, where there is one.
    home_city: Where the vehicle is based.
    seat_count: Seat belts fitted.
    fuel_type: What the vehicle runs on.
    transmission: The transmission fitted.
    registration_state: Where the vehicle is registered.
    registration_expiry_date: When the registration expires.
    miles_to_next_inspection: Miles left before the next inspection, zero until one is granted.
    suspension_reason: Why the listing is suspended, which is none at opening.
  triggers: []
- type: listings_vehicle_submitted
  target: listings_vehicles
  mutation:
    transition:
      from: draft
      to: pending_review
  meaning: The host finishes the listing and sends it to be reviewed.
  grain: One row per listing, updated once when it is submitted.
  fields:
    status: Lifecycle state, which becomes pending_review.
  triggers: []
- type: listings_vehicle_published
  target: listings_vehicles
  mutation:
    transition:
      from: pending_review
      to: listed
  meaning: The listing passes review and the vehicle goes live on the marketplace.
  grain: One row per listing, updated once when it goes live.
  fields:
    status: Lifecycle state, which becomes listed.
    listed_date: Date the vehicle went live.
    inspection_due_date: Date the first inspection falls due.
  triggers: []
- type: listings_vehicle_snoozed
  target: listings_vehicles
  mutation:
    transition:
      from: listed
      to: snoozed
  meaning: The host takes the vehicle off the calendar for a while.
  grain: One row per listing, updated once per snooze.
  fields:
    status: Lifecycle state, which becomes snoozed.
  triggers: []
- type: listings_vehicle_resumed
  target: listings_vehicles
  mutation:
    transition:
      from: snoozed
      to: listed
  meaning: The host puts the vehicle back on the calendar.
  grain: One row per listing, updated once per resumption.
  fields:
    status: Lifecycle state, which becomes listed.
  triggers: []
- type: listings_vehicle_suspended
  target: listings_vehicles
  mutation:
    transition:
    - from: pending_review
      to: suspended
    - from: listed
      to: suspended
    - from: snoozed
      to: suspended
  meaning: The marketplace takes the vehicle off the calendar because something about it must be put right.
  grain: One row per listing, updated once per suspension.
  fields:
    status: Lifecycle state, which becomes suspended.
    suspension_reason: What must be put right.
  triggers:
  - event: trips:trips_booking_cancelled
    when:
      suspension_reason:
      - safety_defect
      - open_recall
      - registration_expired
    map:
      cancellation_initiator: keyturn
- type: listings_vehicle_reinstated
  target: listings_vehicles
  mutation:
    transition:
      from: suspended
      to: listed
  meaning: What suspended the vehicle is put right and it goes back on the calendar.
  grain: One row per listing, updated once per reinstatement.
  fields:
    status: Lifecycle state, which becomes listed.
    suspension_reason: Cleared back to none on reinstatement.
    inspection_due_date: The next inspection date once the vehicle is back.
  triggers: []
- type: listings_vehicle_delisted
  target: listings_vehicles
  mutation:
    transition:
    - from: draft
      to: delisted
    - from: listed
      to: delisted
    - from: snoozed
      to: delisted
    - from: suspended
      to: delisted
  meaning: The vehicle comes off the marketplace for good.
  grain: One row per listing, updated once when it comes down.
  fields:
    status: Lifecycle state, which becomes delisted.
    delisted_date: Date the vehicle came off the marketplace.
    suspension_reason: Any ground still standing when it came down.
  triggers:
  - event: hostplan:hostplan_enrollment_ended
    map:
      suspension_reason: host_request
- type: listings_price_updated
  target: listings_vehicles
  mutation: update
  meaning: The host changes what they ask for the vehicle, or where it is based.
  grain: One row per listing, updated once per accepted price or location change.
  fields:
    daily_price_amount: The new daily price.
    home_city: Where the vehicle is now based.
  triggers: []
- type: listings_class_reassigned
  target: listings_vehicles
  mutation: update
  meaning: The marketplace moves the vehicle into a different value class after revaluing it.
  grain: One row per listing, updated once per accepted class change.
  fields:
    value_class_name: The class the vehicle moves into.
    market_value_amount: The valuation that moved it.
  triggers: []
- type: listings_inspection_completed
  target: listings_inspections
  meaning: A marketplace inspection is carried out and a fresh mileage interval is granted.
  grain: One row per inspection carried out on one vehicle.
  account: inspection_mileage_credit
  direction: in
  distinguish_by:
  - record_date
  - inspection_channel
  - inspection_outcome
  - odometer_reading
  fields:
    inspection_id: Reference number of the record.
    vehicle_id: The listing inspected.
    customer_id: The host who owns it.
    source_inspection_id: The earlier inspection this one re-examines, where it does.
    event_type: Event family of the record.
    record_date: Date of the inspection.
    odometer_reading: Odometer shown at the inspection.
    miles_delta: Miles granted as the next interval, always positive here.
    inspection_outcome: What the inspection found.
    inspection_channel: How the inspection was carried out.
    defect_code: Any fault found.
    photo_count: Photographs taken.
    next_due_miles: The interval granted.
  triggers:
  - event: listings:listings_vehicle_suspended
    when:
      inspection_outcome: failed
    map:
      suspension_reason: safety_defect
- type: listings_odometer_reported
  target: listings_inspections
  meaning: A fresh odometer reading is recorded and the miles driven since the last reading consume the inspection interval.
  grain: One row per odometer reading recorded against one vehicle.
  account: inspection_mileage_credit
  direction: out
  distinguish_by:
  - record_date
  - odometer_reading
  - inspection_channel
  fields:
    inspection_id: Reference number of the record.
    vehicle_id: The listing the reading belongs to.
    customer_id: The host who owns it.
    booking_id: The trip whose handover produced the reading, where one did.
    event_type: Event family of the record.
    record_date: Date of the reading.
    odometer_reading: The odometer shown.
    miles_delta: Miles taken off the inspection interval, always negative here.
    inspection_channel: Where the reading came from.
    inspection_outcome: Not applicable on a reading.
  triggers: []
- type: listings_defect_reported
  target: listings_inspections
  meaning: A fault is reported on the vehicle, whether by a guest, by a host, by a workshop or by a recall notice.
  grain: One row per fault reported on one vehicle.
  distinguish_by:
  - record_date
  - defect_code
  - inspection_channel
  fields:
    inspection_id: Reference number of the record.
    vehicle_id: The listing the fault belongs to.
    customer_id: The host who owns it.
    booking_id: The trip the fault was noticed on, where it was noticed on one.
    event_type: Event family of the record.
    record_date: Date the fault was reported.
    defect_code: The fault reported.
    inspection_channel: Who reported it.
    inspection_outcome: Not applicable on a report.
    photo_count: Photographs attached to the report.
  triggers:
  - event: listings:listings_vehicle_suspended
    when:
      defect_code: open_recall
    map:
      suspension_reason: open_recall
- type: listings_valuation_reassessed
  target: listings_inspections
  meaning: The marketplace values the vehicle again and records which class the valuation puts it in.
  grain: One row per valuation carried out on one vehicle.
  distinguish_by:
  - record_date
  - assessed_value_amount
  - value_class_assessed
  fields:
    inspection_id: Reference number of the record.
    vehicle_id: The listing valued.
    customer_id: The host who owns it.
    source_inspection_id: The earlier valuation this one supersedes, where it does.
    event_type: Event family of the record.
    record_date: Date of the valuation.
    odometer_reading: Odometer the valuation was made on.
    assessed_value_amount: The value the marketplace put on the vehicle.
    value_class_assessed: The class that valuation puts the vehicle in.
    inspection_channel: How the valuation was made.
    inspection_outcome: Not applicable on a valuation.
  triggers: []
- type: listings_document_verified
  target: listings_inspections
  meaning: A document the listing depends on is checked and recorded as verified.
  grain: One row per document verified on one vehicle.
  distinguish_by:
  - record_date
  - document_kind
  - inspection_channel
  fields:
    inspection_id: Reference number of the record.
    vehicle_id: The listing the document belongs to.
    customer_id: The host who owns it.
    event_type: Event family of the record.
    record_date: Date the document was verified.
    document_kind: Which document was checked.
    inspection_channel: Who checked it.
    inspection_outcome: What the check concluded.
    photo_count: Images of the document on file.
  triggers: []
measures:
- id: listings_msr_settled_trips_90d
  window: Rolling 90 calendar days counted back from the handling date, the handling date included.
  measure: Count of settled trips taken on this vehicle.
- id: listings_msr_defects_12m
  window: Rolling 12 calendar months counted back from the handling date, the handling date included.
  measure: Count of listings_defect_reported records on this vehicle.
- id: listings_msr_miles_since_inspection
  window: From the date of the most recent completed inspection to the handling date.
  measure: Sum of the absolute miles_delta of this vehicle's odometer records since that inspection.
policies:
- id: listings_agg_multi_holding
  subject:
  - listings_vehicle_created
  rule: A host lists each vehicle separately, so one host may hold as many listings as they have vehicles, subject only to the per-class ceiling each class sets. One vehicle is listed once and once only, and a second listing raised on a vehicle already listed by the same host is a duplicate to be withdrawn rather than a second listing; the last six characters of the vehicle identification number are what tell two otherwise identical vehicles apart. Each listing carries its own class, its own price and its own inspection clock, and nothing about one listing moves another.
  eligibility: []
  params:
    max_per_customer: null
- id: listings_agg_host_fleet
  subject:
  - listings_vehicle_created
  - listings_vehicle_published
  rule: A host's listings are read as one fleet when the marketplace decides what may go live, even though each listing is reviewed on its own. No host holds more listings in a class than that class allows, counting listings in the draft, pending_review, listed, snoozed and suspended states together, since a suspended vehicle still occupies a place in the fleet; only delisted vehicles free a place. Where a host holds listings in several classes each class's ceiling is counted on its own, and a place free in one class never makes room in another. A host whose rating has fallen below the minimum of a class they hold may keep the listings already live in it but may not publish another in that class until the rating recovers. Where a host carries an unresolved safety suspension on any vehicle, no further listing of theirs is published until it is resolved, because the fleet is judged as a whole on safety.
  eligibility:
  - id: no_unresolved_safety_suspension
    applies_to:
    - listings_vehicle_published
    kind: authorization
    condition: Where a host carries an unresolved safety suspension on any vehicle, no further listing of theirs is published until it is resolved, because the fleet is judged as a whole on safety.
    evidence_fields:
    - listings_vehicles.suspension_reason
    - listings_vehicles.customer_id
    - listings_vehicles.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - listings_vehicles.customer_id
      action_bindings:
        listings_vehicles.customer_id: customer_id
  params:
    per_tier:
      Keyturn Economy Class Listing:
        max_listings_per_host: =max_listings_per_host
        minimum_host_rating: =minimum_host_rating
      Keyturn Standard Class Listing:
        max_listings_per_host: =max_listings_per_host
        minimum_host_rating: =minimum_host_rating
      Keyturn Premium Class Listing:
        max_listings_per_host: =max_listings_per_host
        minimum_host_rating: =minimum_host_rating
      Keyturn Luxury Class Listing:
        max_listings_per_host: =max_listings_per_host
        minimum_host_rating: =minimum_host_rating
      Keyturn Exotic Class Listing:
        max_listings_per_host: =max_listings_per_host
        minimum_host_rating: =minimum_host_rating
      Keyturn Commercial Van Class Listing:
        max_listings_per_host: =max_listings_per_host
        minimum_host_rating: =minimum_host_rating
  measures:
  - listings_msr_settled_trips_90d
- id: listings_onboarding
  subject:
  - listings_vehicle_created
  - listings_vehicle_submitted
  - listings_vehicle_published
  rule: A vehicle goes live only where it sits inside its class's value band, age limit, odometer limit and seat range, and where the class accepts how it is titled and where it is registered. Vehicle age is counted in whole years from the model year to the year the listing is reviewed, so a vehicle of the model year exactly at the class limit is still accepted. A financed or leased vehicle goes live only where the lender's written consent has been verified on the listing, and the host's statement that their lender permits it is not a substitute for the consent document itself. The listing must carry at least the class's minimum photographs, showing the class's required exterior angles and interior views, each at or above the class's minimum resolution; a listing short of any of these goes back to the host rather than live with a note. Where the class requires an inspection before listing, the vehicle goes live only where a passed inspection already stands on the vehicle record. Review takes the class's review period in business days counted from the day the listing was submitted, and a listing whose registration expires during the review is not published until the registration is renewed. The activation fee, where the class charges one, falls due when the listing goes live and not when it is submitted, so a listing that never passes review is never charged for.
  eligibility:
  - id: lienholder_consent_verified
    applies_to:
    - listings_vehicle_published
    kind: authorization
    condition: A financed or leased vehicle goes live only where the lender's written consent has been verified on the listing, and the host's statement that their lender permits it is not a substitute for the consent document itself.
    evidence_fields:
