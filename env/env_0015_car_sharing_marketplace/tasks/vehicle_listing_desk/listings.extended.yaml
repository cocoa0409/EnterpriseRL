- id: listings_ext_interval_grant
  base_policy_refs:
  - listings_evt_inspection
  overwrite:
  - base_policy: listings_evt_inspection
    superseded_clause: A completed inspection grants the class's mileage interval afresh and sets the next due date the class's day interval ahead, counted in whole calendar days from the day of the inspection.
    replaced_by: A completed inspection grants a mileage interval worked out from the standard interval of ten thousand miles, adjusted for what the vehicle's own record shows and finally held to a floor of one thousand miles.
  trigger: state_due
  subject:
  - listings_inspection_completed
  computes: interval_miles_granted
  target_tool: record_vehicle_inspection_59fe0be1
  params:
    standard_interval_miles: 10000
    documented_papers_addition: 1500
    current_papers_addition: 750
    no_papers_addition: 0
    long_overrun_reduction: 2000
    short_overrun_reduction: 1000
    no_overrun_reduction: 0
    full_service_addition: 2000
    partial_service_addition: 750
    no_service_addition: 0
    high_mileage_reduction: 2500
    mid_mileage_reduction: 1000
    no_mileage_reduction: 0
    repeat_recovery_reduction: 1500
    single_recovery_reduction: 500
    no_recovery_reduction: 0
    minimum_interval_miles: 1000
  rule: A completed inspection of a Keyturn Vehicle Listing grants the vehicle a mileage interval, and how many miles it grants is worked out before the inspection is filed. The standard interval is ten thousand miles, and the whole of it is open to a vehicle whose own record calls for nothing further. The interval reached is finally compared with the floor of one thousand miles and the greater of the two is the interval the inspection grants, expressed as a whole number of miles. A completed inspection grants a mileage interval worked out from the standard interval of ten thousand miles, adjusted for what the vehicle's own record shows and finally held to a floor of one thousand miles. The additions and reductions the vehicle's record calls for are summed and applied once to the standard interval, rather than each being applied to the figure the one before it produced, and the figure so reached is a whole number of miles. The interval a completed inspection grants is fixed only after a verification of the vehicle's registration dated within thirty calendar days of the handling date stands on its condition record. A vehicle whose registration has been verified within thirty calendar days of the handling date on a record carrying twelve or more images of it has one thousand five hundred miles added; one whose registration has been verified within thirty calendar days of the handling date on a record carrying fewer than twelve images has seven hundred and fifty miles added; and any other vehicle has nothing added on this ground. A vehicle whose inspection mileage credit stands below zero and whose inspection due date is more than thirty calendar days before the handling date has two thousand miles taken off; one whose credit stands below zero with an inspection due date thirty calendar days or fewer before the handling date has one thousand miles taken off; and any other vehicle has nothing taken off on this ground. A vehicle with three or more completed Keyturn Vehicle Care Plan visits in the rolling twenty-four months counted back from the handling date has two thousand miles added; one with one or two completed care plan visits in that window has seven hundred and fifty miles added; and one with no completed care plan visit in that window has nothing added on this ground. A vehicle whose highest odometer reading standing on the condition record is one hundred and twenty thousand miles or more has two thousand five hundred miles taken off; one whose highest standing reading is eighty thousand miles or more but below one hundred and twenty thousand has one thousand miles taken off; and one below eighty thousand miles has nothing taken off on this ground. A vehicle with two or more completed Keyturn Roadside Assistance callouts in the rolling twenty-four months counted back from the handling date has one thousand five hundred miles taken off; one with exactly one completed callout in that window has five hundred miles taken off; and one with no completed callout in that window has nothing taken off on this ground. A vehicle carrying two or more fault reports in the rolling twelve months counted back from the handling date, the most recent of them dated later than its last completed inspection, has the interval taken at half of what the additions and reductions give, rounded down to the nearer hundred miles; one carrying exactly one such fault report in that window dated later than its last completed inspection has it taken at three quarters, rounded down to the nearer hundred miles; and any other vehicle has the interval taken as the additions and reductions give it. A completed inspection is filed at the odometer the record of the inspection carries, with the finding that record reached, and through the channel the inspection was carried out under.
  prerequisite:
  - problem: listings_ext_document_verification
    kind: value_input
    gate: paper_currency_addition
    form: state
    policy_source: The interval a completed inspection grants is fixed only after a verification of the vehicle's registration dated within thirty calendar days of the handling date stands on its condition record.
    condition: A verification row of a registration whose record date falls within thirty calendar days of the handling date stands on the vehicle's condition record at the moment the interval is worked out.
    resolved_by: verify_listing_document_28456ce9
    effect: Once a registration verification dated within thirty calendar days stands on the condition record, the paper currency addition binding is read on that verification rather than on an older one, and the standard interval is adjusted by what that verification's own record carries.
  cross_category:
  - category: service
    as: history
    reads:
    - service_visits.outcome
    - service_visits.visit_date
    note: The completed Keyturn Vehicle Care Plan visits on the vehicle decide which tier of the serviced vehicle addition the interval carries.
  - category: roadside
    as: history
    reads:
    - roadside_callouts.outcome
    - roadside_callouts.callout_date
    note: The completed Keyturn Roadside Assistance callouts on the vehicle decide which tier of the recovery history reduction the interval carries.
  compute:
  - latest_registration_check: LATEST('listings_inspections', 'record_date', date_field='record_date', event_type='listings_document_verified', document_kind='registration')
  - registration_check_age_days: DAYS(latest_registration_check, NOW)
  - latest_registration_images: LATEST('listings_inspections', 'photo_count', date_field='record_date', event_type='listings_document_verified', document_kind='registration')
  - paper_currency_addition: K('documented_papers_addition') if (registration_check_age_days <= 30 and latest_registration_images >= 12) else (K('current_papers_addition') if (registration_check_age_days <= 30 and latest_registration_images < 12) else K('no_papers_addition'))
  - base_interval: K('standard_interval_miles')
  - credit_standing: F('miles_to_next_inspection')
  - due_age_days: DAYS(F('inspection_due_date'), NOW)
  - overrun_reduction: K('long_overrun_reduction') if (credit_standing < 0 and due_age_days > 30) else (K('short_overrun_reduction') if (credit_standing < 0 and due_age_days <= 30) else K('no_overrun_reduction'))
  - care_visits_24m: XCOUNT('service', 'service_visits', within_months=24, date_field='visit_date', outcome='completed')
  - service_addition: K('full_service_addition') if care_visits_24m >= 3 else (K('partial_service_addition') if care_visits_24m >= 1 else K('no_service_addition'))
  - highest_reading: MAX('listings_inspections', 'odometer_reading')
  - mileage_reduction: K('high_mileage_reduction') if highest_reading >= 120000 else (K('mid_mileage_reduction') if highest_reading >= 80000 else K('no_mileage_reduction'))
  - recovery_callouts_24m: XCOUNT('roadside', 'roadside_callouts', within_months=24, date_field='callout_date', outcome='completed')
  - recovery_reduction: K('repeat_recovery_reduction') if recovery_callouts_24m >= 2 else (K('single_recovery_reduction') if recovery_callouts_24m == 1 else K('no_recovery_reduction'))
  - adjusted_interval: base_interval + paper_currency_addition - overrun_reduction + service_addition - mileage_reduction - recovery_reduction
  - faults_12m: COUNT('listings_inspections', within_months=12, date_field='record_date', event_type='listings_defect_reported')
  - latest_fault_date: LATEST('listings_inspections', 'record_date', date_field='record_date', event_type='listings_defect_reported')
  - last_inspection_date: F('last_inspection_date')
  - granted_interval: int(adjusted_interval * 0.5 / 100) * 100 if (faults_12m >= 2 and latest_fault_date > last_inspection_date) else (int(adjusted_interval * 0.75 / 100) * 100 if (faults_12m == 1 and latest_fault_date > last_inspection_date) else adjusted_interval)
  - result: MX(granted_interval, K('minimum_interval_miles'))
