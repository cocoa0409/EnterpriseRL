- id: listings_ext_price_reset
  base_policy_refs:
  - listings_price
  - listings_evt_valuation
  overwrite:
  - base_policy: listings_price
    superseded_clause: The host sets what they ask for their own vehicle, within the floor and ceiling of the class the vehicle sits in, and a price outside that band is refused rather than quietly clamped.
    replaced_by: The band a listing is read against is settled from the vehicle value standing on the listing rather than from the class the vehicle sits in, and a price standing outside that band is brought inside it rather than refused.
  - base_policy: listings_price
    superseded_clause: The daily price may not move by more than the class's daily movement limit in one day, and after a change the price is locked for the class's lockout period in whole elapsed hours, so that a vehicle's price cannot be moved around a booking in progress.
    replaced_by: The most a price may move in a day is settled from how long the listing has been live and what its fault record shows rather than from the class, and no lockout period runs against the listing after a price is changed.
  - base_policy: listings_evt_valuation
    superseded_clause: A class change moves the price floor and ceiling with it, and a daily price outside the new class's band is brought to the nearer boundary rather than left outside it.
    replaced_by: 'Where a fresh valuation moves the band a listing is read against, the price is not brought to the nearer boundary of the new band and left there: it is carried forward, taken through the share of the band the vehicle''s cover standing leaves open, held to the movement the day allows, and only then brought inside the band.'
  trigger: on_request
  subject:
  - listings_price_updated
  computes: daily_price_amount
  target_tool: set_daily_price_59fd8a00
  params:
    premium_band_ceiling_amount: 320.0
    standard_band_ceiling_amount: 165.0
    entry_band_ceiling_amount: 95.0
    premium_band_floor_amount: 75.0
    standard_band_floor_amount: 38.0
    entry_band_floor_amount: 22.0
    settled_listing_movement_rate: 0.25
    reported_listing_movement_rate: 0.2
    new_listing_movement_rate: 0.15
    clean_cover_band_share: 1.0
    single_claim_band_share: 0.9
