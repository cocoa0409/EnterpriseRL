  rule: The host sets what they ask for their own vehicle, within the floor and ceiling of the class the vehicle sits in, and a price outside that band is refused rather than quietly clamped. The daily price may not move by more than the class's daily movement limit in one day, and after a change the price is locked for the class's lockout period in whole elapsed hours, so that a vehicle's price cannot be moved around a booking in progress. A price change never touches a booking already confirmed, since every booking carries the price locked in at its own confirmation, and a host who wants a confirmed booking repriced must cancel it and bear the consequences of cancelling. Where the class sets a minimum trip price, a booking whose whole price would fall below it is not accepted however short the trip, and the host is told to raise the daily price or set a longer minimum. Moving the vehicle to a different home city is a listing change and not a price change, but it takes effect only from the day it is recorded, and deliveries already promised from the old city stand. Featuring a listing in search results is charged at the class's placement fee and changes nothing about the price the guest pays.
