    declared_value: Where the host's declared value for the vehicle sits within one tenth of the adjusted figure and the host protection enrolment on that vehicle has stood claim free for twenty-four whole months or more, the declared value governs; where it sits within one tenth of the adjusted figure and that enrolment has stood claim free for fewer than twenty-four whole months, the mean of the declared value and the adjusted figure governs, rounded half away from zero to two decimal places; and where it sits outside one tenth of the adjusted figure, the adjusted figure governs.
    claim_free_months: Where the host's declared value for the vehicle sits within one tenth of the adjusted figure and the host protection enrolment on that vehicle has stood claim free for twenty-four whole months or more, the declared value governs; where it sits within one tenth of the adjusted figure and that enrolment has stood claim free for fewer than twenty-four whole months, the mean of the declared value and the adjusted figure governs, rounded half away from zero to two decimal places; and where it sits outside one tenth of the adjusted figure, the adjusted figure governs.
    within_tolerance: Where the host's declared value for the vehicle sits within one tenth of the adjusted figure and the host protection enrolment on that vehicle has stood claim free for twenty-four whole months or more, the declared value governs; where it sits within one tenth of the adjusted figure and that enrolment has stood claim free for fewer than twenty-four whole months, the mean of the declared value and the adjusted figure governs, rounded half away from zero to two decimal places; and where it sits outside one tenth of the adjusted figure, the adjusted figure governs.
    governing_figure: Where the host's declared value for the vehicle sits within one tenth of the adjusted figure and the host protection enrolment on that vehicle has stood claim free for twenty-four whole months or more, the declared value governs; where it sits within one tenth of the adjusted figure and that enrolment has stood claim free for fewer than twenty-four whole months, the mean of the declared value and the adjusted figure governs, rounded half away from zero to two decimal places; and where it sits outside one tenth of the adjusted figure, the adjusted figure governs.
