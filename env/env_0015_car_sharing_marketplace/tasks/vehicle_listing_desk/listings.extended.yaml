    - category: service
      table: service_visits
      aggregate: sum
      field: invoice_amount
      within_months: 24
      filters: {}
    cross_category:
    - hostplan
    - service
- id: listings_ext_class_assignment
  base_policy_refs:
  - listings_evt_valuation
  overwrite:
  - base_policy: listings_evt_valuation
    superseded_clause: A host's own declared value is accepted where it sits inside the class's tolerance of the marketplace valuation, and where it sits outside, the marketplace valuation governs and the host is told what the vehicle has been valued at.
    replaced_by: Where the host's declared value for the vehicle sits within one tenth of the adjusted figure and the host protection enrolment on that vehicle has stood claim free for twenty-four whole months or more, the declared value governs; where it sits within one tenth of the adjusted figure and that enrolment has stood claim free for fewer than twenty-four whole months, the mean of the declared value and the adjusted figure governs, rounded half away from zero to two decimal places; and where it sits outside one tenth of the adjusted figure, the adjusted figure governs.
  trigger: state_due
  subject:
  - listings_class_reassigned
  computes: governing_value_amount
  target_tool: reassign_value_class_4bb6b10c
  params:
    declared_value_tolerance_rate: 0.1
    high_mileage_value_share: 0.94
    mid_mileage_value_share: 0.97
    standard_mileage_value_share: 1.0
    documented_service_uplift: 1.03
    partial_service_uplift: 1.015
    no_service_uplift: 1.0
    recovered_vehicle_share: 0.95
    single_callout_share: 0.98
    no_callout_share: 1.0
  rule: When a Keyturn Vehicle Listing is moved between value classes, the value that governs the listing is settled first and the class the listing is moved into is the class whose value band that governing value falls in. The marketplace figure the settlement starts from is the vehicle value standing on the listing. That figure is rounded half away from zero to two decimal places, and the rounded figure is the value that governs the listing. Where the vehicle's record calls for adjustments to the marketplace figure, each adjustment is a share applied to the figure the one before it produced, taken in the order mileage, service record and recovery history, and the figure so reached is rounded half away from zero to two decimal places before the host's own declared value is weighed against it. The value class a listing is moved into is not settled before a valuation dated within thirty calendar days of the handling date stands on the vehicle's condition record. Where a valuation stands on the vehicle's condition record dated within thirty calendar days of the handling date, that valuation's amount is the marketplace figure; where none stands within thirty calendar days but at least one valuation stands on the record within the rolling twelve months counted back from the handling date, the highest valuation amount standing on the record is the marketplace figure; and otherwise the vehicle value standing on the listing is the marketplace figure. A vehicle whose highest odometer reading standing on the condition record is sixty thousand miles or more is adjusted to ninety-four hundredths of the figure; one whose highest standing reading is thirty-five thousand miles or more but below sixty thousand is adjusted to ninety-seven hundredths; and one whose highest standing reading is below thirty-five thousand miles is carried at the figure unchanged. A vehicle with three or more completed Keyturn Vehicle Care Plan visits in the rolling twenty-four months counted back from the handling date and care credits still standing on that plan is adjusted to one and three hundredths of the figure; one with one or two completed care plan visits in that window, or with three or more and no care credit standing, is adjusted to one and fifteen thousandths; and one with no completed care plan visit in that window is carried at the figure unchanged. A vehicle with two or more completed Keyturn Roadside Assistance callouts in the rolling twenty-four months counted back from the handling date is adjusted to ninety-five hundredths of the figure; one with exactly one completed callout in that window is adjusted to ninety-eight hundredths; and one with no completed callout in that window is carried at the figure unchanged. Where the host's declared value for the vehicle sits within one tenth of the adjusted figure and the host protection enrolment on that vehicle has stood claim free for twenty-four whole months or more, the declared value governs; where it sits within one tenth of the adjusted figure and that enrolment has stood claim free for fewer than twenty-four whole months, the mean of the declared value and the adjusted figure governs, rounded half away from zero to two decimal places; and where it sits outside one tenth of the adjusted figure, the adjusted figure governs.
  prerequisite:
  - problem: listings_ext_valuation_assessment
    kind: value_input
    gate: marketplace_figure
    form: state
    policy_source: The value class a listing is moved into is not settled before a valuation dated within thirty calendar days of the handling date stands on the vehicle's condition record.
    condition: A valuation row whose record date falls within thirty calendar days of the handling date stands on the vehicle's condition record at the moment the governing value is settled.
    resolved_by: record_vehicle_valuation_559b4236
    effect: Once a valuation dated within thirty calendar days stands on the condition record, the marketplace figure binding takes that valuation's amount in place of the highest valuation standing or the value carried on the listing.
  cross_category:
  - category: service
    as: branch
    reads:
    - service_visits.outcome
    - service_visits.visit_date
    - service_credits_remaining
    note: The completed Keyturn Vehicle Care Plan visits on the vehicle and the care credits still standing decide which tier of the documented service adjustment applies.
  - category: roadside
    as: history
    reads:
    - roadside_callouts.outcome
    - roadside_callouts.callout_date
    note: The completed Keyturn Roadside Assistance callouts on the vehicle decide which tier of the recovery history adjustment applies.
  - category: hostplan
    as: branch
    reads:
    - vehicle_value_declared_amount
    - claim_free_since_date
    note: The host's declared value and the claim-free standing of the host protection enrolment decide which tier of the declared value rule the governing figure is settled on.
  compute:
  - latest_valuation_date: LATEST('listings_inspections', 'record_date', date_field='record_date', event_type='listings_valuation_reassessed')
  - days_since_valuation: DAYS(latest_valuation_date, NOW)
  - valuations_12m: COUNT('listings_inspections', within_months=12, date_field='record_date', event_type='listings_valuation_reassessed')
  - latest_valuation_amount: LATEST('listings_inspections', 'assessed_value_amount', date_field='record_date', event_type='listings_valuation_reassessed')
  - highest_valuation_standing: MAX('listings_inspections', 'assessed_value_amount', event_type='listings_valuation_reassessed')
  - marketplace_figure: latest_valuation_amount if days_since_valuation <= 30 else (highest_valuation_standing if valuations_12m >= 1 else F('market_value_amount'))
  - highest_reading: MAX('listings_inspections', 'odometer_reading')
  - mileage_share: K('high_mileage_value_share') if highest_reading >= 60000 else (K('mid_mileage_value_share') if highest_reading >= 35000 else K('standard_mileage_value_share'))
  - care_visits_24m: XCOUNT('service', 'service_visits', within_months=24, date_field='visit_date', outcome='completed')
  - care_credits_standing: CFIELD('service', 'service_credits_remaining', vehicle_id=HID)
  - service_share: K('documented_service_uplift') if (care_visits_24m >= 3 and care_credits_standing > 0) else (K('partial_service_uplift') if care_visits_24m >= 1 else K('no_service_uplift'))
  - recovery_callouts_24m: XCOUNT('roadside', 'roadside_callouts', within_months=24, date_field='callout_date', outcome='completed')
  - roadside_share: K('recovered_vehicle_share') if recovery_callouts_24m >= 2 else (K('single_callout_share') if recovery_callouts_24m == 1 else K('no_callout_share'))
  - adjusted_figure: RND(marketplace_figure * mileage_share * service_share * roadside_share, 2)
  - declared_value: CFIELD('hostplan', 'vehicle_value_declared_amount', vehicle_id=HID)
  - claim_free_months: MONTHS(CFIELD('hostplan', 'claim_free_since_date', vehicle_id=HID), NOW)
  - within_tolerance: ABS(declared_value - adjusted_figure) <= adjusted_figure * K('declared_value_tolerance_rate')
  - governing_figure: declared_value if (within_tolerance and claim_free_months >= 24) else (RND((declared_value + adjusted_figure) / 2, 2) if within_tolerance else adjusted_figure)
  - result: RND(governing_figure, 2)
  compute_basis:
