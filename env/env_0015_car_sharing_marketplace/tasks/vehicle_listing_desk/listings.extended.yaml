    mileage_share: A vehicle whose highest odometer reading standing on the condition record is sixty thousand miles or more is adjusted to ninety-four hundredths of the figure; one whose highest standing reading is thirty-five thousand miles or more but below sixty thousand is adjusted to ninety-seven hundredths; and one whose highest standing reading is below thirty-five thousand miles is carried at the figure unchanged.
