- id: listings_availability
  subject:
  - listings_vehicle_snoozed
  - listings_vehicle_resumed
  rule: A host who cannot offer the vehicle for a while snoozes the listing rather than delisting it, which keeps the listing, its history and its reviews while taking it off the calendar. One stretch of snoozing runs no longer than the class allows, counted in whole calendar days from the day the listing was snoozed, and a listing still snoozed at the end of that stretch is resumed or delisted rather than left in between. A listing may be snoozed no more times than the class allows over a rolling twelve months, counting stretches rather than days, so a host who snoozes repeatedly for short periods reaches the ceiling as quickly as one who snoozes twice for long ones. Snoozing never touches a booking already confirmed, and a host who cannot honour a confirmed booking cancels it and bears the cancellation consequences rather than snoozing out of it. The inspection clock keeps running while a listing is snoozed, so a vehicle snoozed past its interval comes back suspended rather than live. Only the host snoozes and resumes their own listing, since the vehicle is theirs to offer or withhold.
