  rule: 'The daily price a Keyturn Vehicle Listing carries is set within the floor and the ceiling of the value band the listing sits in, and the figure the marketplace writes is worked out before the price is changed. The band a listing is read against is the entry band, whose ceiling is ninety-five dollars a day and whose floor is twenty-two dollars a day. The figure the marketplace starts from is the price the host is asking for the vehicle at the handling date, carried forward as it stands. That carried figure is then taken through the share of the band the vehicle''s cover standing leaves open to it, the share being applied once and the product rounded half away from zero to two decimal places. The share of the band open to a listing is the whole band, expressed as one. A price may not fall in one day by more than the movement rate, which is fifteen hundredths of the price asked, so the price asked less that movement is worked out, rounded half away from zero to two decimal places, and the greater of it and the figure reached in the previous step is taken. The figure so taken is finally brought inside the band, being held to the ceiling where it stands above it and lifted to the floor where it stands below it, and the result is rounded half away from zero to two decimal places. The daily price a host may ask is fixed only once the vehicle value standing on the listing is the value the marketplace has settled on for it. A listing whose vehicle value standing on it is thirty-eight thousand and one dollars or more and which carries at least one valuation in the rolling twelve months counted back from the handling date is read against the premium band, whose ceiling is three hundred and twenty dollars a day and whose floor is seventy-five dollars a day; one whose standing vehicle value is eighteen thousand and one dollars or more but below thirty-eight thousand and one dollars and which carries at least one valuation in that window is read against the standard band, whose ceiling is one hundred and sixty-five dollars a day and whose floor is thirty-eight dollars a day; and any other listing is read against the entry band. A listing that has been live for three hundred and sixty-five calendar days or more with no fault report in the rolling twelve months counted back from the handling date moves at twenty-five hundredths of the price asked in a day; one live for three hundred and sixty-five calendar days or more with at least one fault report in that window moves at twenty hundredths; and any other listing moves at the standard movement rate. Where the price asked stands above the ceiling of the band and the vehicle''s last completed inspection is more than two hundred and seventy calendar days before the handling date, the price is brought to the floor of the band before the movement rule is applied; where the price asked stands above the ceiling of the band and that inspection is within two hundred and seventy calendar days, the price is brought to the ceiling of the band; and otherwise the price asked is carried forward as it stands. A vehicle whose host protection enrolment shows two or more claims filed in the rolling twenty-four months counted back from the handling date has three quarters of the band open to it; one whose enrolment shows exactly one claim filed in that window has nine tenths of the band open to it; and any other vehicle has the whole band open to it. The band a listing is read against is settled from the vehicle value standing on the listing rather than from the class the vehicle sits in, and a price standing outside that band is brought inside it rather than refused. The most a price may move in a day is settled from how long the listing has been live and what its fault record shows rather than from the class, and no lockout period runs against the listing after a price is changed. Where a fresh valuation moves the band a listing is read against, the price is not brought to the nearer boundary of the new band and left there: it is carried forward, taken through the share of the band the vehicle''s cover standing leaves open, held to the movement the day allows, and only then brought inside the band.'
