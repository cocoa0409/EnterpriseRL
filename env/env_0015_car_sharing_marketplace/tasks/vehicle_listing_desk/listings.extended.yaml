    anchor_date: Where a completed inspection stands on the vehicle's condition record later than the valuation standing there, the anchor date is the date of that inspection; where no completed inspection stands later than that valuation but an odometer reading does, the anchor date is the date of the most recent such reading; and otherwise the anchor date is the date of the valuation standing on the record.
    anchor_months: The standard step-down is six thousandths of the starting value for each whole calendar month counted from the anchor date to the handling date, a part month not counting, and the anchor date is the date of the valuation standing on the condition record.
    faults_12m: A vehicle carrying three or more fault reports in the rolling twelve months counted back from the handling date, the most recent of them dated later than its last completed inspection, carries a holdback of six hundredths; one carrying one or two such reports in that window with the most recent dated later than its last completed inspection carries a holdback of three hundredths; and any other vehicle carries no holdback on this ground.
    latest_fault_date: A vehicle carrying three or more fault reports in the rolling twelve months counted back from the handling date, the most recent of them dated later than its last completed inspection, carries a holdback of six hundredths; one carrying one or two such reports in that window with the most recent dated later than its last completed inspection carries a holdback of three hundredths; and any other vehicle carries no holdback on this ground.
