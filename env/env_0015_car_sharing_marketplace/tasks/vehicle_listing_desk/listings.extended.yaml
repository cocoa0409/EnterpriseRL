    listing_state: A vehicle whose registration on file stands more than seven calendar days past its expiry and whose listing is suspended adds four images; one whose registration on file stands more than seven calendar days past its expiry and whose listing is not suspended adds two; and any other vehicle adds none on this ground.
    lapse_addition: A vehicle whose registration on file stands more than seven calendar days past its expiry and whose listing is suspended adds four images; one whose registration on file stands more than seven calendar days past its expiry and whose listing is not suspended adds two; and any other vehicle adds none on this ground.
    image_subtotal: Where the vehicle's own record calls for additions to the standard figure, the additions are summed and the total is added once to that figure, rather than each addition being applied to the figure the one before it produced.
