    care_credits_standing: A vehicle with three or more completed Keyturn Vehicle Care Plan visits in the rolling twenty-four months counted back from the handling date and care credits still standing on that plan is adjusted to one and three hundredths of the figure; one with one or two completed care plan visits in that window, or with three or more and no care credit standing, is adjusted to one and fifteen thousandths; and one with no completed care plan visit in that window is carried at the figure unchanged.
