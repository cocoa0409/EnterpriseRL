- id: listings_enforcement
  subject:
  - listings_vehicle_suspended
  - listings_vehicle_reinstated
  - listings_vehicle_delisted
  rule: A listing is suspended for a stated ground and never without one, the grounds being an overdue inspection, an expired registration, a safety defect, an open recall, a valuation outside the class band, a policy breach and the host's own request. A suspension takes the vehicle off the calendar at once, and where the ground is a safety defect, an open recall or an expired registration it also ends the bookings already confirmed on that vehicle, the guests being treated as cancelled on by the marketplace rather than by the host. A suspended listing may be put back inside the class's reinstatement window, counted in whole calendar days from the day of suspension, once the ground has been put right and evidenced; reinstatement is reviewed within the class's review period in business days. The host may appeal a suspension inside the class's appeal period, and an appeal does not put the vehicle back on the calendar while it is decided, because the ground of suspension stands until it is overturned. A listing taken down for good is delisted on the class's notice, and delisting ends the protection enrolment on that vehicle as well, since protection follows the listing and does not outlive it. A listing whose reinstatement window has passed is delisted rather than left suspended, and the host who wants the vehicle back lists it afresh and is reviewed as a new listing.
  eligibility:
  - id: suspension_ground_recorded
    applies_to:
    - listings_vehicle_suspended
    kind: state
    condition: A listing is suspended for a stated ground and never without one, the grounds being an overdue inspection, an expired registration, a safety defect, an open recall, a valuation outside the class band, a policy breach and the host's own request.
    evidence_fields:
    - listings_vehicles.status
    - listings_vehicles.suspension_reason
    - listings_vehicles.vehicle_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - listings_vehicles.vehicle_id
      action_bindings:
        listings_vehicles.vehicle_id: vehicle_id
    state_contract:
      field: listings_vehicles.status
      allowed:
      - pending_review
      - listed
      - snoozed
      - suspended
  - id: reinstatement_window
    applies_to:
    - listings_vehicle_reinstated
    kind: time
    condition: A suspended listing may be put back inside the class's reinstatement window, counted in whole calendar days from the day of suspension, once the ground has been put right and evidenced; reinstatement is reviewed within the class's review period in business days.
    evidence_fields:
    - listings_vehicles.delisted_date
    - listings_vehicles.vehicle_id
