- id: listings_ext_reported_consumption
  base_policy_refs:
  - listings_evt_inspection
  overwrite:
  - base_policy: listings_evt_inspection
    superseded_clause: A telematics reading is authoritative where one exists; a host reading standing more than the class's variance tolerance away from the telematics figure is queried rather than recorded, and the listing is not suspended while the query is open.
    replaced_by: A reading the host reports is recorded on the vehicle's condition record whatever distance stands between it and the reading the most recent telematics odometer record carries, and that distance is settled by the way the reported stretch is measured rather than by holding the reading back.
  trigger: on_request
  subject:
  - listings_odometer_reported
  computes: reported_miles_consumed
  target_tool: report_vehicle_mileage_90a8825c
  params:
    long_lapse_private_allowance: 60
    short_lapse_private_allowance: 30
    no_lapse_private_allowance: 0
    long_interval_transit_allowance: 40
    short_interval_transit_allowance: 20
    no_interval_transit_allowance: 0
    idle_quarter_allowance: 30
    earning_quarter_allowance: 15
    no_earning_allowance: 0
    queried_reading_margin_miles: 75
  rule: When a host reports the odometer on their own Keyturn Vehicle Listing, the miles that reading takes off the vehicle's inspection interval are worked out before the reading is filed. The reading the host reports is the odometer standing on the listing, and the reported stretch is measured from the reading the vehicle's most recent telematics odometer record carries to it, a reported stretch of less than nothing being counted as nothing. The allowances against the reported stretch that the vehicle's record calls for are summed and taken off the reported stretch once, a result of less than nothing being counted as nothing, and the miles reported are a whole number of miles. The miles a reading the host reports take off the interval are not counted before an odometer record dated the handling date and naming the condition record its reading was taken from stands on the vehicle's condition record. A reading the host reports is recorded on the vehicle's condition record whatever distance stands between it and the reading the most recent telematics odometer record carries, and that distance is settled by the way the reported stretch is measured rather than by holding the reading back. Where the odometer standing on the listing is more than seventy-five miles above the highest reading standing on the vehicle's odometer records and a completed inspection dated within seven calendar days of the handling date stands on the condition record, the reported stretch is measured from that highest standing reading to the odometer standing on the listing; where the odometer standing on the listing is more than seventy-five miles above that highest standing reading and no such inspection stands, the reported stretch is measured from that highest standing reading and then cut back by the seventy-five mile margin the marketplace queries rather than charges; and otherwise the reported stretch is measured from the reading the vehicle's most recent telematics odometer record carries to the odometer standing on the listing. A vehicle whose registration on file stands more than seven calendar days past its expiry and whose registration has been verified within seven calendar days of the handling date is allowed sixty miles of private use against the reported stretch; one whose registration stands more than seven calendar days past its expiry with no registration verified within seven calendar days is allowed thirty miles; and any other vehicle is allowed none on this ground. A vehicle whose most recent completed inspection is dated within seven calendar days of the handling date and granted an interval of five thousand miles or more is allowed forty miles of inspection transit against the reported stretch; one whose most recent completed inspection is dated within seven calendar days and granted an interval below five thousand miles is allowed twenty miles; and any other vehicle is allowed none on this ground. A vehicle whose host has been paid five hundred dollars or more of trip earnings in the rolling twelve months counted back from the handling date and nothing in the rolling three months is allowed thirty miles of idle period use against the reported stretch; one whose host has been paid five hundred dollars or more in the rolling twelve months and something in the rolling three months is allowed fifteen miles; and any other vehicle is allowed none on this ground.
  prerequisite:
  - problem: listings_ext_booked_consumption
    kind: value_input
    gate: reported_stretch
    form: state
    policy_source: The miles a reading the host reports take off the interval are not counted before an odometer record dated the handling date and naming the condition record its reading was taken from stands on the vehicle's condition record.
    condition: An odometer record row whose record date is the handling date and which names the condition record its reading was taken from stands on the vehicle's condition record at the moment the reported miles are worked out.
    resolved_by: record_booked_mileage_82af4bea
    effect: Once an odometer record dated the handling date stands on the condition record, the reported stretch binding is measured from the highest reading standing on the vehicle's odometer records rather than from the reading the most recent telematics record carries.
  cross_category:
  - category: payouts
    as: history
    reads:
    - payouts_ledger.entry_basis
    - payouts_ledger.entry_date
    - payouts_ledger.entry_amount
    note: The trip earnings posted to the host's payout account over the last year and the last quarter decide which tier of the idle period allowance the reported miles carry.
  compute:
  - reported_reading: F('odometer_miles')
  - highest_booked_reading: MAX('listings_inspections', 'odometer_reading', event_type='listings_odometer_reported')
  - latest_telematics_reading: LATEST('listings_inspections', 'odometer_reading', date_field='record_date', event_type='listings_odometer_reported', inspection_channel='telematics_report')
  - inspection_date: LATEST('listings_inspections', 'record_date', date_field='record_date', event_type='listings_inspection_completed')
  - inspection_age_days: DAYS(inspection_date, NOW)
  - reported_stretch: MX(reported_reading - highest_booked_reading, 0) if (reported_reading - highest_booked_reading > K('queried_reading_margin_miles') and inspection_age_days <= 7) else (MX(reported_reading - highest_booked_reading - K('queried_reading_margin_miles'), 0) if (reported_reading - highest_booked_reading > K('queried_reading_margin_miles') and inspection_age_days > 7) else MX(reported_reading - latest_telematics_reading, 0))
  - registration_lapse_days: DAYS(F('registration_expiry_date'), NOW)
  - registration_check_age_days: DAYS(LATEST('listings_inspections', 'record_date', date_field='record_date', event_type='listings_document_verified', document_kind='registration'), NOW)
  - private_use_allowance: K('long_lapse_private_allowance') if (registration_lapse_days > 7 and registration_check_age_days <= 7) else (K('short_lapse_private_allowance') if (registration_lapse_days > 7 and registration_check_age_days > 7) else K('no_lapse_private_allowance'))
  - granted_interval_standing: LATEST('listings_inspections', 'next_due_miles', date_field='record_date', event_type='listings_inspection_completed')
  - inspection_transit_allowance: K('long_interval_transit_allowance') if (inspection_age_days <= 7 and granted_interval_standing >= 5000) else (K('short_interval_transit_allowance') if (inspection_age_days <= 7 and granted_interval_standing < 5000) else K('no_interval_transit_allowance'))
  - trip_earnings_12m: XSUM('payouts', 'payouts_ledger', 'entry_amount', within_months=12, date_field='entry_date', entry_basis='trip_earning')
  - trip_earnings_3m: XSUM('payouts', 'payouts_ledger', 'entry_amount', within_months=3, date_field='entry_date', entry_basis='trip_earning')
  - idle_period_allowance: K('idle_quarter_allowance') if (trip_earnings_12m >= 500 and trip_earnings_3m == 0) else (K('earning_quarter_allowance') if (trip_earnings_12m >= 500 and trip_earnings_3m > 0) else K('no_earning_allowance'))
  - total_allowance: private_use_allowance + inspection_transit_allowance + idle_period_allowance
  - result: MX(reported_stretch - total_allowance, 0)
  compute_basis:
    reported_reading: The reading the host reports is the odometer standing on the listing, and the reported stretch is measured from the reading the vehicle's most recent telematics odometer record carries to it, a reported stretch of less than nothing being counted as nothing.
    highest_booked_reading: Where the odometer standing on the listing is more than seventy-five miles above the highest reading standing on the vehicle's odometer records and a completed inspection dated within seven calendar days of the handling date stands on the condition record, the reported stretch is measured from that highest standing reading to the odometer standing on the listing; where the odometer standing on the listing is more than seventy-five miles above that highest standing reading and no such inspection stands, the reported stretch is measured from that highest standing reading and then cut back by the seventy-five mile margin the marketplace queries rather than charges; and otherwise the reported stretch is measured from the reading the vehicle's most recent telematics odometer record carries to the odometer standing on the listing.
    latest_telematics_reading: Where the odometer standing on the listing is more than seventy-five miles above the highest reading standing on the vehicle's odometer records and a completed inspection dated within seven calendar days of the handling date stands on the condition record, the reported stretch is measured from that highest standing reading to the odometer standing on the listing; where the odometer standing on the listing is more than seventy-five miles above that highest standing reading and no such inspection stands, the reported stretch is measured from that highest standing reading and then cut back by the seventy-five mile margin the marketplace queries rather than charges; and otherwise the reported stretch is measured from the reading the vehicle's most recent telematics odometer record carries to the odometer standing on the listing.
    inspection_date: Where the odometer standing on the listing is more than seventy-five miles above the highest reading standing on the vehicle's odometer records and a completed inspection dated within seven calendar days of the handling date stands on the condition record, the reported stretch is measured from that highest standing reading to the odometer standing on the listing; where the odometer standing on the listing is more than seventy-five miles above that highest standing reading and no such inspection stands, the reported stretch is measured from that highest standing reading and then cut back by the seventy-five mile margin the marketplace queries rather than charges; and otherwise the reported stretch is measured from the reading the vehicle's most recent telematics odometer record carries to the odometer standing on the listing.
    inspection_age_days: Where the odometer standing on the listing is more than seventy-five miles above the highest reading standing on the vehicle's odometer records and a completed inspection dated within seven calendar days of the handling date stands on the condition record, the reported stretch is measured from that highest standing reading to the odometer standing on the listing; where the odometer standing on the listing is more than seventy-five miles above that highest standing reading and no such inspection stands, the reported stretch is measured from that highest standing reading and then cut back by the seventy-five mile margin the marketplace queries rather than charges; and otherwise the reported stretch is measured from the reading the vehicle's most recent telematics odometer record carries to the odometer standing on the listing.
    reported_stretch: Where the odometer standing on the listing is more than seventy-five miles above the highest reading standing on the vehicle's odometer records and a completed inspection dated within seven calendar days of the handling date stands on the condition record, the reported stretch is measured from that highest standing reading to the odometer standing on the listing; where the odometer standing on the listing is more than seventy-five miles above that highest standing reading and no such inspection stands, the reported stretch is measured from that highest standing reading and then cut back by the seventy-five mile margin the marketplace queries rather than charges; and otherwise the reported stretch is measured from the reading the vehicle's most recent telematics odometer record carries to the odometer standing on the listing.
    registration_lapse_days: A vehicle whose registration on file stands more than seven calendar days past its expiry and whose registration has been verified within seven calendar days of the handling date is allowed sixty miles of private use against the reported stretch; one whose registration stands more than seven calendar days past its expiry with no registration verified within seven calendar days is allowed thirty miles; and any other vehicle is allowed none on this ground.
    registration_check_age_days: A vehicle whose registration on file stands more than seven calendar days past its expiry and whose registration has been verified within seven calendar days of the handling date is allowed sixty miles of private use against the reported stretch; one whose registration stands more than seven calendar days past its expiry with no registration verified within seven calendar days is allowed thirty miles; and any other vehicle is allowed none on this ground.
    private_use_allowance: A vehicle whose registration on file stands more than seven calendar days past its expiry and whose registration has been verified within seven calendar days of the handling date is allowed sixty miles of private use against the reported stretch; one whose registration stands more than seven calendar days past its expiry with no registration verified within seven calendar days is allowed thirty miles; and any other vehicle is allowed none on this ground.
    granted_interval_standing: A vehicle whose most recent completed inspection is dated within seven calendar days of the handling date and granted an interval of five thousand miles or more is allowed forty miles of inspection transit against the reported stretch; one whose most recent completed inspection is dated within seven calendar days and granted an interval below five thousand miles is allowed twenty miles; and any other vehicle is allowed none on this ground.
    inspection_transit_allowance: A vehicle whose most recent completed inspection is dated within seven calendar days of the handling date and granted an interval of five thousand miles or more is allowed forty miles of inspection transit against the reported stretch; one whose most recent completed inspection is dated within seven calendar days and granted an interval below five thousand miles is allowed twenty miles; and any other vehicle is allowed none on this ground.
    trip_earnings_12m: A vehicle whose host has been paid five hundred dollars or more of trip earnings in the rolling twelve months counted back from the handling date and nothing in the rolling three months is allowed thirty miles of idle period use against the reported stretch; one whose host has been paid five hundred dollars or more in the rolling twelve months and something in the rolling three months is allowed fifteen miles; and any other vehicle is allowed none on this ground.
