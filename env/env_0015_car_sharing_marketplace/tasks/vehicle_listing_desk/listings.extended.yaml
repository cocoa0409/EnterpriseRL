  rule: When the marketplace records a document of a Keyturn Vehicle Listing as verified, it files with that record the images of the document it holds, and how many images it holds is worked out before the record is filed. The standard figure is three images, which is what the marketplace holds for a document on a vehicle whose own record calls for nothing further. The figure reached is finally held to a ceiling of sixteen images, so that no verification record carries more, and the result is a whole number of images. Where the vehicle's own record calls for additions to the standard figure, the additions are summed and the total is added once to that figure, rather than each addition being applied to the figure the one before it produced. Where a registration has been verified on the vehicle's condition record at any time in the rolling twenty-four months counted back from the handling date, the standard figure is taken as the image count that most recent registration verification carried; where no registration has been verified in that window but some other document has, the standard figure is taken as the highest image count standing on any verification of that vehicle; and otherwise the standard figure is the marketplace's own figure of three. A vehicle carrying two or more verified documents in the rolling twenty-four months counted back from the handling date, at least one of which failed its check, adds three images; one carrying two or more verified documents in that window with none failing adds one; and any other vehicle adds none on this ground. A vehicle carrying two or more verified lender consent documents on its condition record adds three images; one carrying exactly one verified lender consent document adds two; and one carrying none adds none on this ground. A vehicle whose registration on file stands more than seven calendar days past its expiry and whose listing is suspended adds four images; one whose registration on file stands more than seven calendar days past its expiry and whose listing is not suspended adds two; and any other vehicle adds none on this ground. A document is checked by the marketplace's own inspector against the vehicle rather than on the host's word, and the verification is recorded under that channel whoever sent the document in.
  prerequisite: []
  cross_category: []
  compute:
  - registration_checks_24m: COUNT('listings_inspections', within_months=24, date_field='record_date', event_type='listings_document_verified', document_kind='registration')
  - document_checks_24m: COUNT('listings_inspections', within_months=24, date_field='record_date', event_type='listings_document_verified')
  - latest_registration_images: LATEST('listings_inspections', 'photo_count', date_field='record_date', event_type='listings_document_verified', document_kind='registration')
  - highest_document_images: MAX('listings_inspections', 'photo_count', event_type='listings_document_verified')
  - standard_images: latest_registration_images if registration_checks_24m >= 1 else (highest_document_images if document_checks_24m >= 1 else K('standard_verification_images'))
  - failed_checks_24m: COUNT('listings_inspections', within_months=24, date_field='record_date', event_type='listings_document_verified', inspection_outcome='failed')
  - pattern_addition: K('failed_check_pattern_addition') if (document_checks_24m >= 2 and failed_checks_24m >= 1) else (K('clean_check_pattern_addition') if (document_checks_24m >= 2 and failed_checks_24m == 0) else K('no_check_pattern_addition'))
  - consent_documents: COUNT('listings_inspections', event_type='listings_document_verified', document_kind='lienholder_consent')
  - consent_addition: K('multiple_consent_addition') if consent_documents >= 2 else (K('single_consent_addition') if consent_documents == 1 else K('no_consent_addition'))
  - registration_lapse_days: DAYS(F('registration_expiry_date'), NOW)
  - listing_state: F('status')
  - lapse_addition: K('long_lapse_addition') if (registration_lapse_days > 7 and listing_state == 'suspended') else (K('short_lapse_addition') if (registration_lapse_days > 7 and listing_state != 'suspended') else K('no_lapse_addition'))
  - image_subtotal: standard_images + pattern_addition + consent_addition + lapse_addition
  - result: MN(image_subtotal, K('verification_image_cap'))
