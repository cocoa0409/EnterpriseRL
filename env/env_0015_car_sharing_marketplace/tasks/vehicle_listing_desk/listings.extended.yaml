extended_policies:
- id: listings_ext_fault_intake
  base_policy_refs:
  - listings_evt_defect
  overwrite: []
  trigger: state_due
  subject:
  - listings_defect_reported
  computes: attached_photo_count
  target_tool: log_vehicle_fault_a3e017f7
  params:
    standard_report_photo_count: 4
    heavy_pattern_photo_count: 10
    split_pattern_photo_count: 8
    running_gear_photo_count: 6
    stale_clock_near_interval_addition: 3
    stale_clock_addition: 2
    no_clock_addition: 0
    open_recall_addition: 3
    cleared_recall_addition: 1
    no_recall_addition: 0
    high_mileage_addition: 4
    mid_mileage_addition: 2
    no_mileage_addition: 0
    high_value_addition: 3
    mid_value_addition: 1
    no_value_addition: 0
    minimum_report_photo_count: 3
  rule: A fault found on a Keyturn Vehicle Listing is opened on that vehicle's condition record carrying the number of photographs the marketplace's evidence standard calls for on a fault report. The standard evidence figure is four photographs, which is what the marketplace files with a fault report on a vehicle whose own record calls for nothing further. The figure reached is finally compared with the floor of three photographs and the greater of the two is the number of photographs the fault record is opened with, expressed as a whole number. Where the vehicle's own record calls for additions to the standard evidence figure, the additions are summed and the total is added once to that figure, rather than each addition being applied to the figure the one before it produced. A vehicle carrying three or more fault reports in the rolling twelve months counted back from the handling date, at least one of them a tyre tread or brake wear fault, takes ten photographs in place of the standard evidence figure; one carrying three or more such reports with no tyre tread or brake wear fault among them takes eight; one carrying fewer than three fault reports in that window with at least one tyre tread or brake wear fault among them takes six; and any other vehicle takes the standard evidence figure. A vehicle whose last completed inspection is more than one hundred and eighty calendar days before the handling date and which has fewer than two thousand miles of inspection interval left adds three photographs; one more than one hundred and eighty calendar days past its last completed inspection with two thousand miles or more of interval left adds two; and any other vehicle adds none on this ground. A vehicle carrying an open recall fault report on its condition record with no recall clearance document verified there adds three photographs; one carrying an open recall fault report with a recall clearance document verified adds one; and a vehicle carrying no open recall fault report adds none on this ground. A vehicle whose highest odometer reading standing on the condition record is sixty thousand miles or more adds four photographs; one whose highest standing reading is thirty thousand miles or more but below sixty thousand adds two; and one whose highest standing reading is below thirty thousand miles adds none on this ground. A vehicle whose most recently recorded marketplace valuation is sixty thousand dollars or more adds three photographs; one whose most recently recorded valuation is thirty thousand dollars or more but below sixty thousand adds one; and one whose most recently recorded valuation is below thirty thousand dollars adds none on this ground. A vehicle with two or more completed Keyturn Vehicle Care Plan visits in the rolling twelve months counted back from the handling date has the figure taken at two thirds of what the standard evidence figure and its additions give, rounded up to a whole photograph; one with exactly one completed care plan visit in that window has it taken at three quarters of that figure, rounded up to a whole photograph; and one with no completed care plan visit in that window has the figure taken as the standard evidence figure and its additions give it. A fault carried across from a condition record already standing on the vehicle is recorded under the fault that record names and through the channel that record was produced under, since the marketplace records a fault as the record that found it reports it.
  prerequisite: []
  cross_category:
  - category: service
    as: history
    reads:
    - service_visits.outcome
    - service_visits.visit_date
    note: The count of completed Keyturn Vehicle Care Plan visits on this vehicle decides which tier of the workshop documentation rule the evidence figure is taken on.
  compute:
  - faults_12m: COUNT('listings_inspections', within_months=12, date_field='record_date', event_type='listings_defect_reported')
  - running_gear_faults_12m: COUNT('listings_inspections', within_months=12, date_field='record_date', event_type='listings_defect_reported', defect_code='tyre_tread') + COUNT('listings_inspections', within_months=12, date_field='record_date', event_type='listings_defect_reported', defect_code='brake_wear')
  - repeat_report_standard: K('heavy_pattern_photo_count') if (faults_12m >= 3 and running_gear_faults_12m >= 1) else (K('split_pattern_photo_count') if (faults_12m >= 3 and running_gear_faults_12m == 0) else (K('running_gear_photo_count') if (faults_12m < 3 and running_gear_faults_12m >= 1) else K('standard_report_photo_count')))
  - days_since_inspection: DAYS(F('last_inspection_date'), NOW)
  - interval_credit_left: F('miles_to_next_inspection')
  - clock_addition: K('stale_clock_near_interval_addition') if (days_since_inspection > 180 and interval_credit_left < 2000) else (K('stale_clock_addition') if (days_since_inspection > 180 and interval_credit_left >= 2000) else K('no_clock_addition'))
  - recall_reports: COUNT('listings_inspections', event_type='listings_defect_reported', defect_code='open_recall')
  - recall_clearances: COUNT('listings_inspections', event_type='listings_document_verified', document_kind='recall_clearance', inspection_outcome='passed')
  - recall_addition: K('open_recall_addition') if (recall_reports >= 1 and recall_clearances == 0) else (K('cleared_recall_addition') if (recall_reports >= 1 and recall_clearances >= 1) else K('no_recall_addition'))
  - highest_reading: MAX('listings_inspections', 'odometer_reading')
  - mileage_addition: K('high_mileage_addition') if highest_reading >= 60000 else (K('mid_mileage_addition') if highest_reading >= 30000 else K('no_mileage_addition'))
  - latest_valuation_amount: LATEST('listings_inspections', 'assessed_value_amount', date_field='record_date', event_type='listings_valuation_reassessed')
  - valuation_addition: K('high_value_addition') if latest_valuation_amount >= 60000 else (K('mid_value_addition') if latest_valuation_amount >= 30000 else K('no_value_addition'))
  - report_subtotal: repeat_report_standard + clock_addition + recall_addition + mileage_addition + valuation_addition
  - care_visits_12m: XCOUNT('service', 'service_visits', within_months=12, date_field='visit_date', outcome='completed')
  - documented_requirement: (int(report_subtotal * 2 / 3) + (1 if report_subtotal * 2 / 3 > int(report_subtotal * 2 / 3) else 0)) if care_visits_12m >= 2 else ((int(report_subtotal * 3 / 4) + (1 if report_subtotal * 3 / 4 > int(report_subtotal * 3 / 4) else 0)) if care_visits_12m == 1 else report_subtotal)
  - result: MX(documented_requirement, K('minimum_report_photo_count'))
  compute_basis:
    faults_12m: A vehicle carrying three or more fault reports in the rolling twelve months counted back from the handling date, at least one of them a tyre tread or brake wear fault, takes ten photographs in place of the standard evidence figure; one carrying three or more such reports with no tyre tread or brake wear fault among them takes eight; one carrying fewer than three fault reports in that window with at least one tyre tread or brake wear fault among them takes six; and any other vehicle takes the standard evidence figure.
    running_gear_faults_12m: A vehicle carrying three or more fault reports in the rolling twelve months counted back from the handling date, at least one of them a tyre tread or brake wear fault, takes ten photographs in place of the standard evidence figure; one carrying three or more such reports with no tyre tread or brake wear fault among them takes eight; one carrying fewer than three fault reports in that window with at least one tyre tread or brake wear fault among them takes six; and any other vehicle takes the standard evidence figure.
    repeat_report_standard: A vehicle carrying three or more fault reports in the rolling twelve months counted back from the handling date, at least one of them a tyre tread or brake wear fault, takes ten photographs in place of the standard evidence figure; one carrying three or more such reports with no tyre tread or brake wear fault among them takes eight; one carrying fewer than three fault reports in that window with at least one tyre tread or brake wear fault among them takes six; and any other vehicle takes the standard evidence figure.
    days_since_inspection: A vehicle whose last completed inspection is more than one hundred and eighty calendar days before the handling date and which has fewer than two thousand miles of inspection interval left adds three photographs; one more than one hundred and eighty calendar days past its last completed inspection with two thousand miles or more of interval left adds two; and any other vehicle adds none on this ground.
    interval_credit_left: A vehicle whose last completed inspection is more than one hundred and eighty calendar days before the handling date and which has fewer than two thousand miles of inspection interval left adds three photographs; one more than one hundred and eighty calendar days past its last completed inspection with two thousand miles or more of interval left adds two; and any other vehicle adds none on this ground.
    clock_addition: A vehicle whose last completed inspection is more than one hundred and eighty calendar days before the handling date and which has fewer than two thousand miles of inspection interval left adds three photographs; one more than one hundred and eighty calendar days past its last completed inspection with two thousand miles or more of interval left adds two; and any other vehicle adds none on this ground.
    recall_reports: A vehicle carrying an open recall fault report on its condition record with no recall clearance document verified there adds three photographs; one carrying an open recall fault report with a recall clearance document verified adds one; and a vehicle carrying no open recall fault report adds none on this ground.
    recall_clearances: A vehicle carrying an open recall fault report on its condition record with no recall clearance document verified there adds three photographs; one carrying an open recall fault report with a recall clearance document verified adds one; and a vehicle carrying no open recall fault report adds none on this ground.
    recall_addition: A vehicle carrying an open recall fault report on its condition record with no recall clearance document verified there adds three photographs; one carrying an open recall fault report with a recall clearance document verified adds one; and a vehicle carrying no open recall fault report adds none on this ground.
    highest_reading: A vehicle whose highest odometer reading standing on the condition record is sixty thousand miles or more adds four photographs; one whose highest standing reading is thirty thousand miles or more but below sixty thousand adds two; and one whose highest standing reading is below thirty thousand miles adds none on this ground.
    mileage_addition: A vehicle whose highest odometer reading standing on the condition record is sixty thousand miles or more adds four photographs; one whose highest standing reading is thirty thousand miles or more but below sixty thousand adds two; and one whose highest standing reading is below thirty thousand miles adds none on this ground.
    latest_valuation_amount: A vehicle whose most recently recorded marketplace valuation is sixty thousand dollars or more adds three photographs; one whose most recently recorded valuation is thirty thousand dollars or more but below sixty thousand adds one; and one whose most recently recorded valuation is below thirty thousand dollars adds none on this ground.
    valuation_addition: A vehicle whose most recently recorded marketplace valuation is sixty thousand dollars or more adds three photographs; one whose most recently recorded valuation is thirty thousand dollars or more but below sixty thousand adds one; and one whose most recently recorded valuation is below thirty thousand dollars adds none on this ground.
    report_subtotal: Where the vehicle's own record calls for additions to the standard evidence figure, the additions are summed and the total is added once to that figure, rather than each addition being applied to the figure the one before it produced.
    care_visits_12m: A vehicle with two or more completed Keyturn Vehicle Care Plan visits in the rolling twelve months counted back from the handling date has the figure taken at two thirds of what the standard evidence figure and its additions give, rounded up to a whole photograph; one with exactly one completed care plan visit in that window has it taken at three quarters of that figure, rounded up to a whole photograph; and one with no completed care plan visit in that window has the figure taken as the standard evidence figure and its additions give it.
    documented_requirement: A vehicle with two or more completed Keyturn Vehicle Care Plan visits in the rolling twelve months counted back from the handling date has the figure taken at two thirds of what the standard evidence figure and its additions give, rounded up to a whole photograph; one with exactly one completed care plan visit in that window has it taken at three quarters of that figure, rounded up to a whole photograph; and one with no completed care plan visit in that window has the figure taken as the standard evidence figure and its additions give it.
    result: The figure reached is finally compared with the floor of three photographs and the greater of the two is the number of photographs the fault record is opened with, expressed as a whole number.
