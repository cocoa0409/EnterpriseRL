    inspection_reading: The reading being booked is the one the vehicle's most recent completed inspection carries, and the booked stretch is the miles between the anchor reading and that reading, a booked stretch of less than nothing being counted as nothing.
    inspection_date: Where a completed inspection dated within seven calendar days of the handling date stands on the vehicle's condition record, the anchor reading is the highest reading standing on that vehicle's odometer records; where no such inspection stands but an odometer record dated within thirty calendar days of the handling date does, the anchor reading is the reading that most recent odometer record carries; and otherwise the anchor reading is the odometer standing on the listing.
    inspection_age_days: Where a completed inspection dated within seven calendar days of the handling date stands on the vehicle's condition record, the anchor reading is the highest reading standing on that vehicle's odometer records; where no such inspection stands but an odometer record dated within thirty calendar days of the handling date does, the anchor reading is the reading that most recent odometer record carries; and otherwise the anchor reading is the odometer standing on the listing.
    highest_booked_reading: Where a completed inspection dated within seven calendar days of the handling date stands on the vehicle's condition record, the anchor reading is the highest reading standing on that vehicle's odometer records; where no such inspection stands but an odometer record dated within thirty calendar days of the handling date does, the anchor reading is the reading that most recent odometer record carries; and otherwise the anchor reading is the odometer standing on the listing.
    latest_reading_date: Where a completed inspection dated within seven calendar days of the handling date stands on the vehicle's condition record, the anchor reading is the highest reading standing on that vehicle's odometer records; where no such inspection stands but an odometer record dated within thirty calendar days of the handling date does, the anchor reading is the reading that most recent odometer record carries; and otherwise the anchor reading is the odometer standing on the listing.
    latest_reading_age_days: Where a completed inspection dated within seven calendar days of the handling date stands on the vehicle's condition record, the anchor reading is the highest reading standing on that vehicle's odometer records; where no such inspection stands but an odometer record dated within thirty calendar days of the handling date does, the anchor reading is the reading that most recent odometer record carries; and otherwise the anchor reading is the odometer standing on the listing.
    latest_booked_reading: Where a completed inspection dated within seven calendar days of the handling date stands on the vehicle's condition record, the anchor reading is the highest reading standing on that vehicle's odometer records; where no such inspection stands but an odometer record dated within thirty calendar days of the handling date does, the anchor reading is the reading that most recent odometer record carries; and otherwise the anchor reading is the odometer standing on the listing.
    anchor_reading: Where a completed inspection dated within seven calendar days of the handling date stands on the vehicle's condition record, the anchor reading is the highest reading standing on that vehicle's odometer records; where no such inspection stands but an odometer record dated within thirty calendar days of the handling date does, the anchor reading is the reading that most recent odometer record carries; and otherwise the anchor reading is the odometer standing on the listing.
    raw_stretch: The reading being booked is the one the vehicle's most recent completed inspection carries, and the booked stretch is the miles between the anchor reading and that reading, a booked stretch of less than nothing being counted as nothing.
    care_visits_3m: A vehicle with two or more completed Keyturn Vehicle Care Plan visits in the rolling three months counted back from the handling date is allowed one hundred and twenty miles of workshop transit against the booked stretch; one with exactly one completed care plan visit in that window is allowed sixty miles; and one with no completed care plan visit in that window is allowed none on this ground.
    workshop_allowance: A vehicle with two or more completed Keyturn Vehicle Care Plan visits in the rolling three months counted back from the handling date is allowed one hundred and twenty miles of workshop transit against the booked stretch; one with exactly one completed care plan visit in that window is allowed sixty miles; and one with no completed care plan visit in that window is allowed none on this ground.
    recovery_callouts_12m: A vehicle with two or more completed Keyturn Roadside Assistance callouts in the rolling twelve months counted back from the handling date is allowed eighty miles of recovery transit against the booked stretch; one with exactly one completed callout in that window is allowed forty miles; and one with no completed callout in that window is allowed none on this ground.
    recovery_allowance: A vehicle with two or more completed Keyturn Roadside Assistance callouts in the rolling twelve months counted back from the handling date is allowed eighty miles of recovery transit against the booked stretch; one with exactly one completed callout in that window is allowed forty miles; and one with no completed callout in that window is allowed none on this ground.
    listing_state: A vehicle whose listing is suspended and whose most recent odometer record is more than thirty calendar days before the handling date is allowed two hundred and fifty miles of private use against the booked stretch; one whose listing is suspended with an odometer record within thirty calendar days is allowed one hundred and twenty-five miles; and any other vehicle is allowed none on this ground.
    suspension_allowance: A vehicle whose listing is suspended and whose most recent odometer record is more than thirty calendar days before the handling date is allowed two hundred and fifty miles of private use against the booked stretch; one whose listing is suspended with an odometer record within thirty calendar days is allowed one hundred and twenty-five miles; and any other vehicle is allowed none on this ground.
    claims_filed_12m: A vehicle whose host protection enrolment shows two or more claims filed in the rolling twelve months counted back from the handling date is allowed one hundred and twenty miles of repair transit against the booked stretch; one whose enrolment shows exactly one claim filed in that window is allowed sixty miles; and one whose enrolment shows no claim filed in that window is allowed none on this ground.
    claim_allowance: A vehicle whose host protection enrolment shows two or more claims filed in the rolling twelve months counted back from the handling date is allowed one hundred and twenty miles of repair transit against the booked stretch; one whose enrolment shows exactly one claim filed in that window is allowed sixty miles; and one whose enrolment shows no claim filed in that window is allowed none on this ground.
    total_allowance: The allowances against the booked stretch that the vehicle's record calls for are summed and taken off the booked stretch once, a result of less than nothing being counted as nothing, and the miles booked are a whole number of miles.
    result: The allowances against the booked stretch that the vehicle's record calls for are summed and taken off the booked stretch once, a result of less than nothing being counted as nothing, and the miles booked are a whole number of miles.
