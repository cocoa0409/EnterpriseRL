      value: K('settled_use_depreciation_rate')
    - when: otherwise
      value: K('standard_depreciation_rate')
    baseline:
      depreciation_rate: K('standard_depreciation_rate')
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: step_down_anchor_basis
    effect: method
    decides: anchor_date
    bindings:
    - last_inspection_date
    - last_reading_date
    - anchor_date
    ladder:
    - when: a completed inspection standing on the condition record later than the valuation standing there
      method: the months are counted from the date of that completed inspection
    - when: no completed inspection later than that valuation but an odometer reading standing later than it
      method: the months are counted from the date of the most recent such odometer reading
    - when: otherwise
      method: the months are counted from the date of the valuation standing on the condition record
    baseline:
      anchor_date: last_valuation_date
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: fault_pattern_holdback
    effect: parameter
    decides: condition_holdback
    bindings:
    - faults_12m
    - latest_fault_date
    - condition_holdback
    ladder:
    - when: three or more fault reports in the rolling twelve months counted back from the handling date and the most recent of them dated later than the last completed inspection
      value: K('recent_fault_pattern_holdback')
    - when: one or two fault reports in that window and the most recent of them dated later than the last completed inspection
      value: K('single_fault_holdback')
    - when: otherwise
      value: K('no_fault_holdback')
    baseline:
      condition_holdback: K('no_fault_holdback')
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: damage_history_holdback
    effect: parameter
    decides: damage_holdback
    bindings:
    - claims_filed_24m
    - appraised_total_24m
    - damage_holdback
    ladder:
    - when: two or more claims filed on the vehicle's host protection enrolment in the rolling twenty-four months counted back from the handling date, or appraisals settled in that window totalling more than five thousand dollars
      value: K('claim_pattern_holdback')
    - when: exactly one claim filed on that enrolment in the window and appraisals settled there totalling five thousand dollars or less
      value: K('single_claim_holdback')
    - when: otherwise
      value: K('no_claim_holdback')
    baseline:
      damage_holdback: K('no_claim_holdback')
    evidence:
    - cross_category
    - history
    cross_difficulty: hostplan
  - id: advisory_condition_holdback
    effect: parameter
    decides: advisory_holdback_rate
    bindings:
    - interval_credit_left
    - last_inspection_outcome
    - advisory_holdback_rate
    ladder:
    - when: the most recent completed inspection passed with advisories and fewer than one thousand miles of inspection interval left
      value: K('near_interval_advisory_holdback')
    - when: the most recent completed inspection passed with advisories and one thousand miles or more of interval left
      value: K('advisory_holdback')
    - when: otherwise
      value: K('no_advisory_holdback')
    baseline:
      advisory_holdback_rate: K('no_advisory_holdback')
    evidence:
    - history
    cross_difficulty: null
  - id: maintained_vehicle_step_basis
    effect: method
    decides: effective_rate
    bindings:
    - workshop_spend_24m
    - effective_rate
    ladder:
    - when: workshop invoices of one thousand two hundred dollars or more under a Keyturn Vehicle Care Plan in the rolling twenty-four months counted back from the handling date
      method: the step-down is taken at three quarters of the rate that otherwise applies
    - when: such invoices of four hundred dollars or more but under one thousand two hundred in that window
      method: the step-down is taken at nine tenths of the rate that otherwise applies
    - when: otherwise
      method: the step-down is taken at the rate as it stands
    baseline:
      effective_rate: depreciation_rate
    evidence:
    - cross_category
    cross_difficulty: service
  baseline:
    rule: A marketplace valuation of a Keyturn Vehicle Listing starts from the vehicle value standing on the listing and steps that value down for the time that has passed since the valuation standing on the vehicle's condition record. The standard step-down is six thousandths of the starting value for each whole calendar month counted from the anchor date to the handling date, a part month not counting, and the anchor date is the date of the valuation standing on the condition record. The step-down is worked out as one rate for the whole stretch of months and taken off the starting value once, and is never compounded month by month. The stepped figure is rounded half away from zero to two decimal places, and that rounded figure is the valuation the marketplace records.
    params:
    - standard_depreciation_rate
  inputs:
    history:
    - table: listings_inspections
      aggregate: latest
      field: record_date
      within_months: null
      filters:
