    standard_images: Where a registration has been verified on the vehicle's condition record at any time in the rolling twenty-four months counted back from the handling date, the standard figure is taken as the image count that most recent registration verification carried; where no registration has been verified in that window but some other document has, the standard figure is taken as the highest image count standing on any verification of that vehicle; and otherwise the standard figure is the marketplace's own figure of three.
    failed_checks_24m: A vehicle carrying two or more verified documents in the rolling twenty-four months counted back from the handling date, at least one of which failed its check, adds three images; one carrying two or more verified documents in that window with none failing adds one; and any other vehicle adds none on this ground.
