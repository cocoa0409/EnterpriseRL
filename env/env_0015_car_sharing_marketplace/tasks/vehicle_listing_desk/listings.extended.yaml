    claims_filed_24m: A vehicle whose host protection enrolment shows two or more claims filed in the rolling twenty-four months counted back from the handling date, or appraisals settled in that window totalling more than five thousand dollars, carries a holdback of eight hundredths; one whose enrolment shows exactly one claim filed in that window with appraisals settled there totalling five thousand dollars or less carries a holdback of four hundredths; and any other vehicle carries no holdback on this ground.
    appraised_total_24m: A vehicle whose host protection enrolment shows two or more claims filed in the rolling twenty-four months counted back from the handling date, or appraisals settled in that window totalling more than five thousand dollars, carries a holdback of eight hundredths; one whose enrolment shows exactly one claim filed in that window with appraisals settled there totalling five thousand dollars or less carries a holdback of four hundredths; and any other vehicle carries no holdback on this ground.
    damage_holdback: A vehicle whose host protection enrolment shows two or more claims filed in the rolling twenty-four months counted back from the handling date, or appraisals settled in that window totalling more than five thousand dollars, carries a holdback of eight hundredths; one whose enrolment shows exactly one claim filed in that window with appraisals settled there totalling five thousand dollars or less carries a holdback of four hundredths; and any other vehicle carries no holdback on this ground.
