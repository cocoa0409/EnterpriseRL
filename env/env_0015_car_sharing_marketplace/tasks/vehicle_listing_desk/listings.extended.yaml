    idle_period_allowance: A vehicle whose host has been paid five hundred dollars or more of trip earnings in the rolling twelve months counted back from the handling date and nothing in the rolling three months is allowed thirty miles of idle period use against the reported stretch; one whose host has been paid five hundred dollars or more in the rolling twelve months and something in the rolling three months is allowed fifteen miles; and any other vehicle is allowed none on this ground.
    total_allowance: The allowances against the reported stretch that the vehicle's record calls for are summed and taken off the reported stretch once, a result of less than nothing being counted as nothing, and the miles reported are a whole number of miles.
    result: The allowances against the reported stretch that the vehicle's record calls for are summed and taken off the reported stretch once, a result of less than nothing being counted as nothing, and the miles reported are a whole number of miles.
