- id: listings_evt_valuation
  subject:
  - listings_valuation_reassessed
  - listings_class_reassigned
  rule: The marketplace values every live vehicle again at the class's refresh interval, counted in whole calendar days from the date of the last valuation, and the valuation it arrives at governs the class the vehicle sits in. Where the fresh valuation puts the vehicle outside the band of the class it is listed in, the listing is moved into the class the valuation names, and the move takes effect on the date the valuation is recorded rather than on the next trip. A host who disagrees puts the vehicle to a value class review, and the review takes the class's review period in business days; the vehicle stays in its existing class while the review runs, so trips already booked are unaffected. A host's own declared value is accepted where it sits inside the class's tolerance of the marketplace valuation, and where it sits outside, the marketplace valuation governs and the host is told what the vehicle has been valued at. Moving up a class requires the settled trip count the target class sets, so a vehicle is not lifted into a higher class on valuation alone; moving down a class carries no such requirement, because a vehicle that has lost value must be priced and protected accordingly. A class change moves the price floor and ceiling with it, and a daily price outside the new class's band is brought to the nearer boundary rather than left outside it.
