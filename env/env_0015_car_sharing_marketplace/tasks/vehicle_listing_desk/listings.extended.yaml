- id: listings_evt_inspection
  subject:
  - listings_inspection_completed
  - listings_odometer_reported
  rule: Every live vehicle carries an inspection clock that runs on two dimensions at once, miles and days, and whichever falls due first is the one that governs. A completed inspection grants the class's mileage interval afresh and sets the next due date the class's day interval ahead, counted in whole calendar days from the day of the inspection. Odometer readings consume the interval as they are recorded, whether they come from a trip handover, from telematics or from the host's own periodic reading, and the host must report a reading at least once in the class's reporting interval even where the vehicle has taken no trips. A telematics reading is authoritative where one exists; a host reading standing more than the class's variance tolerance away from the telematics figure is queried rather than recorded, and the listing is not suspended while the query is open. A vehicle past its interval may continue to take trips through the class's mileage and day grace, and is suspended once both the interval and the grace have been overrun; the grace is not a second interval and cannot be granted twice. A failed inspection suspends the listing at once whatever the grace says, and the vehicle returns only after a re-inspection passes, for which the class's re-inspection fee is charged. Records are written only while the listing is in the listed, snoozed or suspended state, since a draft vehicle has no clock running and a delisted one has none left.
  eligibility:
  - id: inspection_clock_only_while_listed
    applies_to:
    - listings_inspection_completed
    - listings_odometer_reported
    kind: state
    condition: Records are written only while the listing is in the listed, snoozed or suspended state, since a draft vehicle has no clock running and a delisted one has none left.
    evidence_fields:
    - listings_vehicles.status
    - listings_vehicles.vehicle_id
    - listings_vehicles.miles_to_next_inspection
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - listings_vehicles.vehicle_id
      action_bindings:
        listings_vehicles.vehicle_id: vehicle_id
    state_contract:
      field: listings_vehicles.status
      allowed:
      - listed
      - snoozed
      - suspended
  params:
    per_tier:
      Keyturn Economy Class Listing:
        inspection_interval_miles: =inspection_interval_miles
        inspection_interval_days: =inspection_interval_days
        inspection_grace_miles: =inspection_grace_miles
        inspection_grace_days: =inspection_grace_days
        inspection_fee_amount: =inspection_fee_amount
        reinspection_fee_amount: =reinspection_fee_amount
        odometer_report_interval_days: =odometer_report_interval_days
        odometer_variance_tolerance_miles: =odometer_variance_tolerance_miles
        inspection_channel_allowed: =inspection_channel_allowed
      Keyturn Standard Class Listing:
        inspection_interval_miles: =inspection_interval_miles
        inspection_interval_days: =inspection_interval_days
        inspection_grace_miles: =inspection_grace_miles
        inspection_grace_days: =inspection_grace_days
        inspection_fee_amount: =inspection_fee_amount
        reinspection_fee_amount: =reinspection_fee_amount
        odometer_report_interval_days: =odometer_report_interval_days
        odometer_variance_tolerance_miles: =odometer_variance_tolerance_miles
        inspection_channel_allowed: =inspection_channel_allowed
      Keyturn Premium Class Listing:
        inspection_interval_miles: =inspection_interval_miles
        inspection_interval_days: =inspection_interval_days
        inspection_grace_miles: =inspection_grace_miles
