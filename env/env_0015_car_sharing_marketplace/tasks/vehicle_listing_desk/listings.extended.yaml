- id: listings_evt_documents
  subject:
  - listings_document_verified
  rule: A listing depends on documents that expire, and each one is verified by the marketplace rather than accepted on the host's word. The host is warned the class's notice period in whole calendar days before a document expires, and where it expires without being renewed the listing is suspended on the day after the class's registration grace runs out. Verification takes the class's verification period in business days counted from the day the document is received, and the listing stays live while verification runs where the document was received before the old one expired. A document that fails verification is treated as absent, and a listing depending on it is suspended on the same footing as one that never supplied it. A lender consent document is verified against the lender named on the title and not merely for its own consistency, so a consent from a lender the title does not name is not accepted. Where a class accepts no out-of-state registration, a registration from another state is refused at verification rather than at listing, and the host is told which class would accept it.
