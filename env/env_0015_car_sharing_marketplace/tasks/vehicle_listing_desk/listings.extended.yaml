- id: listings_ext_booked_consumption
  base_policy_refs:
  - listings_evt_inspection
  overwrite: []
  trigger: state_due
  subject:
  - listings_odometer_reported
  computes: booked_miles_consumed
  target_tool: record_booked_mileage_82af4bea
  params:
    repeat_workshop_allowance: 120
    single_workshop_allowance: 60
    no_workshop_allowance: 0
    repeat_recovery_allowance: 80
    single_recovery_allowance: 40
    no_recovery_allowance: 0
    long_idle_suspension_allowance: 250
    short_idle_suspension_allowance: 125
    no_suspension_allowance: 0
    repeat_claim_allowance: 120
    single_claim_allowance: 60
    no_claim_allowance: 0
  rule: When the marketplace books an odometer reading it has taken on a Keyturn Vehicle Listing, the miles that reading takes off the vehicle's inspection interval are worked out before the reading is booked. The reading being booked is the one the vehicle's most recent completed inspection carries, and the booked stretch is the miles between the anchor reading and that reading, a booked stretch of less than nothing being counted as nothing. The anchor reading is the odometer standing on the listing. The allowances against the booked stretch that the vehicle's record calls for are summed and taken off the booked stretch once, a result of less than nothing being counted as nothing, and the miles booked are a whole number of miles. The reading booked is recorded through the channel the completed inspection it is taken from was carried out under, since the reading the marketplace books is that inspection's own. The miles a reading the marketplace books takes off the interval are not counted before a completed inspection dated within seven calendar days of the handling date stands on the vehicle's condition record. Where a completed inspection dated within seven calendar days of the handling date stands on the vehicle's condition record, the anchor reading is the highest reading standing on that vehicle's odometer records; where no such inspection stands but an odometer record dated within thirty calendar days of the handling date does, the anchor reading is the reading that most recent odometer record carries; and otherwise the anchor reading is the odometer standing on the listing. A vehicle with two or more completed Keyturn Vehicle Care Plan visits in the rolling three months counted back from the handling date is allowed one hundred and twenty miles of workshop transit against the booked stretch; one with exactly one completed care plan visit in that window is allowed sixty miles; and one with no completed care plan visit in that window is allowed none on this ground. A vehicle with two or more completed Keyturn Roadside Assistance callouts in the rolling twelve months counted back from the handling date is allowed eighty miles of recovery transit against the booked stretch; one with exactly one completed callout in that window is allowed forty miles; and one with no completed callout in that window is allowed none on this ground. A vehicle whose listing is suspended and whose most recent odometer record is more than thirty calendar days before the handling date is allowed two hundred and fifty miles of private use against the booked stretch; one whose listing is suspended with an odometer record within thirty calendar days is allowed one hundred and twenty-five miles; and any other vehicle is allowed none on this ground. A vehicle whose host protection enrolment shows two or more claims filed in the rolling twelve months counted back from the handling date is allowed one hundred and twenty miles of repair transit against the booked stretch; one whose enrolment shows exactly one claim filed in that window is allowed sixty miles; and one whose enrolment shows no claim filed in that window is allowed none on this ground.
  prerequisite:
  - problem: listings_ext_interval_grant
    kind: value_input
    gate: anchor_reading
    form: state
    policy_source: The miles a reading the marketplace books takes off the interval are not counted before a completed inspection dated within seven calendar days of the handling date stands on the vehicle's condition record.
    condition: A completed inspection row whose record date falls within seven calendar days of the handling date stands on the vehicle's condition record at the moment the booked miles are worked out.
    resolved_by: record_vehicle_inspection_59fe0be1
    effect: Once a completed inspection dated within seven calendar days stands on the condition record, the anchor reading binding takes the highest reading standing on the vehicle's odometer records in place of the odometer standing on the listing, and the reading being booked is the one that inspection carries.
  cross_category:
  - category: service
    as: history
    reads:
    - service_visits.outcome
    - service_visits.visit_date
    note: The completed Keyturn Vehicle Care Plan visits in the last quarter decide which tier of the workshop transit allowance the booked miles carry.
  - category: roadside
    as: history
    reads:
    - roadside_callouts.outcome
    - roadside_callouts.callout_date
    note: The completed Keyturn Roadside Assistance callouts decide which tier of the recovery transit allowance the booked miles carry.
  - category: hostplan
    as: history
    reads:
    - hostplan_claims.event_type
    - hostplan_claims.claim_date
    note: The claims filed on the vehicle's host protection enrolment decide which tier of the repair transit allowance the booked miles carry.
  compute:
  - inspection_reading: LATEST('listings_inspections', 'odometer_reading', date_field='record_date', event_type='listings_inspection_completed')
  - inspection_date: LATEST('listings_inspections', 'record_date', date_field='record_date', event_type='listings_inspection_completed')
  - inspection_age_days: DAYS(inspection_date, NOW)
  - highest_booked_reading: MAX('listings_inspections', 'odometer_reading', event_type='listings_odometer_reported')
  - latest_reading_date: LATEST('listings_inspections', 'record_date', date_field='record_date', event_type='listings_odometer_reported')
  - latest_reading_age_days: DAYS(latest_reading_date, NOW)
  - latest_booked_reading: LATEST('listings_inspections', 'odometer_reading', date_field='record_date', event_type='listings_odometer_reported')
  - anchor_reading: highest_booked_reading if inspection_age_days <= 7 else (latest_booked_reading if latest_reading_age_days <= 30 else F('odometer_miles'))
  - raw_stretch: MX(inspection_reading - anchor_reading, 0)
  - care_visits_3m: XCOUNT('service', 'service_visits', within_months=3, date_field='visit_date', outcome='completed')
  - workshop_allowance: K('repeat_workshop_allowance') if care_visits_3m >= 2 else (K('single_workshop_allowance') if care_visits_3m == 1 else K('no_workshop_allowance'))
  - recovery_callouts_12m: XCOUNT('roadside', 'roadside_callouts', within_months=12, date_field='callout_date', outcome='completed')
  - recovery_allowance: K('repeat_recovery_allowance') if recovery_callouts_12m >= 2 else (K('single_recovery_allowance') if recovery_callouts_12m == 1 else K('no_recovery_allowance'))
  - listing_state: F('status')
  - suspension_allowance: K('long_idle_suspension_allowance') if (listing_state == 'suspended' and latest_reading_age_days > 30) else (K('short_idle_suspension_allowance') if (listing_state == 'suspended' and latest_reading_age_days <= 30) else K('no_suspension_allowance'))
  - claims_filed_12m: XCOUNT('hostplan', 'hostplan_claims', within_months=12, date_field='claim_date', event_type='hostplan_claim_filed')
  - claim_allowance: K('repeat_claim_allowance') if claims_filed_12m >= 2 else (K('single_claim_allowance') if claims_filed_12m == 1 else K('no_claim_allowance'))
  - total_allowance: workshop_allowance + recovery_allowance + suspension_allowance + claim_allowance
  - result: MX(raw_stretch - total_allowance, 0)
