category: listings
display_name: Keyturn Vehicle Listing
binding:
  holding_table: listings_vehicles
  event_tables:
  - listings_inspections
  intake_tables:
  - listings_review_queue
  status_field: status
  variant_field: value_class_name
  quantity_fields:
    miles_to_next_inspection: inspection_mileage_credit
lifecycle:
  states:
  - draft
  - pending_review
  - listed
  - snoozed
  - suspended
  - delisted
  transitions:
  - from: draft
    to: pending_review
    by: system
    means: The host finishes the listing and sends it to be looked at.
  - from: draft
    to: delisted
    by: user
    means: The host abandons a listing they never published.
  - from: pending_review
    to: listed
    by: agent
    means: The listing passes review and the vehicle goes live on the marketplace.
  - from: pending_review
    to: suspended
    by: agent
    means: The listing fails review and cannot go live until what failed is put right.
  - from: listed
    to: snoozed
    by: user
    means: The host takes the vehicle off the calendar for a while without giving up the listing.
  - from: snoozed
    to: listed
    by: user
    means: The host puts the vehicle back on the calendar.
  - from: listed
    to: suspended
    by: agent
    means: The marketplace takes the vehicle off the calendar because something about it must be put right.
  - from: snoozed
    to: suspended
    by: agent
    means: A snoozed vehicle is suspended because something about it must be put right before it can return.
  - from: suspended
    to: listed
    by: agent
    means: What suspended the vehicle is put right and it goes back on the calendar.
  - from: listed
    to: delisted
    by: user
    means: The host takes the vehicle off the marketplace for good.
  - from: snoozed
    to: delisted
    by: user
    means: The host gives up a snoozed listing for good.
  - from: suspended
    to: delisted
    by: agent
    means: The marketplace removes a suspended vehicle that will not be put right.
accounts:
- key: inspection_mileage_credit
  unit: miles
  meaning: Miles the vehicle may still be driven before the next marketplace inspection falls due, granted by a completed inspection and consumed by the miles reported on it.
parameter_schema:
  min_market_value_amount: Lowest vehicle value this class accepts, in USD.
  max_market_value_amount: Highest vehicle value this class accepts, in USD.
  max_vehicle_age_years: Oldest vehicle this class accepts, in whole years from the model year.
  max_odometer_miles: Highest odometer reading this class accepts, in miles.
  min_seat_count: Fewest seat belts this class accepts.
  max_seat_count: Most seat belts this class accepts.
  eligible_title_statuses: The title statuses this class will list, as a list of title status values.
  lienholder_consent_required: Whether written lender consent is needed to list a financed vehicle (true/false switch).
  out_of_state_registration_allowed: Whether a vehicle registered outside its home market may be listed (true/false switch).
  commercial_plate_allowed: Whether a commercially plated vehicle may be listed (true/false switch).
  registration_grace_days: Calendar days a listing may stay live past registration expiry.
  document_expiry_notice_days: Calendar days before a document expires that the host is warned.
  document_verification_days: Business days the marketplace takes to verify a document.
  listing_review_days: Business days a new listing waits to be reviewed.
  photo_minimum_count: Photographs a listing must carry before it goes live.
  photo_resolution_minimum_pixels: Shortest edge a listing photograph may have, in pixels.
  exterior_photo_angles_required: Distinct exterior angles a listing must show.
  interior_photo_count_required: Interior photographs a listing must show.
  inspection_required_before_listing: Whether a passed inspection is needed before the vehicle goes live (true/false switch).
  inspection_interval_miles: Miles between two required inspections.
  inspection_interval_days: Calendar days between two required inspections.
  inspection_grace_miles: Miles the interval may be overrun by before the listing is suspended.
  inspection_grace_days: Calendar days the interval may be overrun by before the listing is suspended.
  inspection_channel_allowed: The ways an inspection may be carried out, as a list of inspection channel values.
  inspection_fee_amount: Fee for a scheduled inspection, in USD.
  reinspection_fee_amount: Fee for re-inspecting a vehicle that failed, in USD.
  odometer_report_interval_days: Calendar days between two required odometer readings.
  odometer_variance_tolerance_miles: Miles by which a host reading may differ from telematics before it is queried.
  valuation_refresh_days: Calendar days between two marketplace valuations of the vehicle.
  valuation_tolerance_percent: Percentage by which a host's declared value may differ from the marketplace valuation.
  value_class_review_days: Business days a value class change waits to be reviewed.
  minimum_trips_before_class_upgrade: Settled trips a listing needs before it may move up a class.
  daily_price_floor_amount: Lowest daily price this class may be listed at, in USD.
  daily_price_ceiling_amount: Highest daily price this class may be listed at, in USD.
  price_change_max_percent_per_day: Most the daily price may move in one day, as a percentage.
  price_change_lockout_hours: Hours after a price change before it may be changed again.
  minimum_trip_price_amount: Lowest total trip price this class will accept a booking at, in USD.
  delivery_radius_miles: Furthest the vehicle may be delivered from its home city, in miles.
  airport_delivery_allowed: Whether the vehicle may be handed over at an airport (true/false switch).
  telematics_required: Whether a telematics unit must be fitted (true/false switch).
  required_equipment_list: Equipment the vehicle must carry, as a list of equipment codes.
  cleaning_standard_code: The cleaning standard the vehicle is held to, as one of standard, enhanced or concierge.
  minimum_host_rating: Lowest host rating allowed to hold a listing in this class.
  max_listings_per_host: Listings one host may hold in this class.
  snooze_max_days: Longest a listing may stay snoozed in one stretch, in calendar days.
  snooze_count_per_year: Times a listing may be snoozed in a rolling year.
  delist_notice_days: Calendar days' notice before a listing is taken down for good.
  reinstatement_window_days: Calendar days after suspension within which a listing may be put back.
  reinstatement_review_days: Business days a reinstatement request waits to be reviewed.
  suspension_appeal_days: Calendar days after suspension within which the host may appeal.
  defect_rectification_days: Calendar days the host has to put a reported defect right.
  recall_rectification_days: Calendar days the host has to clear an open safety recall.
  safety_defect_grace_hours: Hours a safety defect may stand before the listing is suspended.
  listing_activation_fee_amount: Fee to put a listing live, in USD.
  monthly_listing_fee_amount: Monthly fee for keeping the listing live, in USD.
  feature_placement_fee_amount: Fee for featuring the listing in search results, in USD.
