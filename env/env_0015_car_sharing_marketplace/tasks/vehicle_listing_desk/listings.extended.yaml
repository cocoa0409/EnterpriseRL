- id: listings_ext_document_verification
  base_policy_refs:
  - listings_evt_documents
  overwrite: []
  trigger: state_due
  subject:
  - listings_document_verified
  computes: verification_image_count
  target_tool: verify_listing_document_28456ce9
  params:
    standard_verification_images: 3
    failed_check_pattern_addition: 3
    clean_check_pattern_addition: 1
    no_check_pattern_addition: 0
