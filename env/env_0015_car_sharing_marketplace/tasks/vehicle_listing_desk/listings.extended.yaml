    marketplace_figure: Where a valuation stands on the vehicle's condition record dated within thirty calendar days of the handling date, that valuation's amount is the marketplace figure; where none stands within thirty calendar days but at least one valuation stands on the record within the rolling twelve months counted back from the handling date, the highest valuation amount standing on the record is the marketplace figure; and otherwise the vehicle value standing on the listing is the marketplace figure.
