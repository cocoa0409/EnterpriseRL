name: env_0020_national_network_airline
company: Crestline Airways

background: |
  Crestline Airways is a United States national network airline headquartered in Kansas City, flying about 1,150 daily departures from hubs in Denver, Charlotte and Seattle to 214 destinations across North America, Central America, the Caribbean, Europe and Asia.
  Its Reservations and Loyalty desk serves individual travelers and the companies that send employees on the network, and its tone is courteous, precise and plain-spoken.
  Every seat is sold as a ticket for one passenger under one of six fare brands: Crestline Basic Economy, Crestline Main Cabin, Crestline Main Plus, Crestline Main Flexible, Crestline Premium Economy and Crestline First.
  A ticket moves from a held reservation to an issued ticket and then through flown coupons, and every fare collection, exchange, seat purchase, checked bag, paid upgrade, refund and irregular-operations rebooking or compensation is booked against it.
  When a ticket is cancelled, exchanged down or a trip goes wrong, its value can live on as a flight credit or travel voucher: the Crestline Residual Travel Credit, Crestline Flight Credit, Crestline Trip Credit, Crestline Service Recovery eCertificate, Crestline Disruption Voucher and Crestline Denied Boarding Voucher each carry their own number, balance and expiry date.
  Travelers collect miles in the Crestline Summit loyalty program, whose tiers are Summit Member, Summit Silver, Summit Gold, Summit Platinum, Summit Diamond and the invitation-only Summit Chairman.
  A Summit membership keeps a running ledger of award miles, qualifying dollars and upgrade certificates, fed by flown coupons, partners, purchases and transfers, and drawn down by award tickets, upgrades and expiries.
  Holders of the Crestline co-branded card and top-tier Summit members receive companion products, from the Crestline Companion Certificate Main Cabin, Main Plus, Premium Economy and First to the Crestline Companion Pass Semiannual and Annual, each holding a count of bookable companion trips.
  Companies travel under corporate travel agreements whose tiers run from Crestline Business Connect and Crestline Business Connect Plus to Crestline Corporate Select, Crestline Corporate Preferred, Crestline Corporate Premier and Crestline Corporate Strategic, each with a roster of travelers, a company points balance, a running agreement-year spend and, for larger accounts, invoices.
  Frequent travelers also buy Summit Club lounge memberships, from Summit Club Essential through Summit Club Individual, Individual Plus, Executive and Corporate to Summit Club Lifetime, which record visits, guest passes and dues.
  Some customers add seat and bag subscriptions, the Crestline Bag Pass One and Two, the Crestline Seat Pass Domestic and Network and the Crestline Seat and Bag Pass Domestic and Network, which record every covered bag and seat they use.
  A typical caller is a Summit member holding two or three tickets across fare brands, one or more open credits, perhaps a companion certificate from the card, and a history of changes, flown segments and disruptions behind them.
  Business callers are travel managers and arrangers who speak for a company profile and ask about their roster, points, invoices and the tickets their travelers booked under the agreement.
  Customers arrive with a long event trail, so the same person may have an expired credit, a partially flown ticket, a pending upgrade request and a recent cancelled flight all on file at once.

logs:
  verification_log_table: identity_verifications
  handoff_log_table: agent_handoffs

difficulties:
  - name: ticket_changes_refunds_and_disruptions
    claim:
      categories: [ticket]
      event_types: [ticket_exchange, ticket_change_fee, ticket_add_collect, ticket_residual, ticket_itinerary_update, ticket_void, ticket_cancel, ticket_credit_conversion, ticket_refund, ticket_refund_payout, ticket_value_forfeit, ticket_name_correction, ticket_seat_purchase, ticket_bag_charge, ticket_upgrade_purchase, ticket_fee_refund, ticket_reaccommodation, ticket_compensation]
    summary: >
      Callers are ticket holders on any of the six fare brands, often Summit members and sometimes travelers booked under a corporate agreement, who want to change or cancel a trip, get money back, buy or dispute a seat, bag or upgrade fee, fix a name, or be rebooked and compensated after a delay, cancellation, denied boarding, downgrade or delayed bag.
      The setting varies by fare brand, ticket status (held, ticketed, partially flown and beyond), itinerary class and journey origin, how long ago the ticket was issued and how close departure is, whether the ticket was paid by card, credit, miles or a companion certificate, what the passenger's Summit tier and any active corporate agreement add, and what exchanges, fees, flown coupons and disruption records are already on file.
      The governing rules are the ticket charter's policies: the risk-free window of ticket_risk_free_cancellation, the change permission, cutoff, fee and fare-difference settlement of ticket_voluntary_change and ticket_same_day_change, the fee retention and credit amount of ticket_cancel_for_credit, the refund grounds of ticket_refunds, the fare-brand, elite and corporate allowances of ticket_evt_seat_fees and ticket_evt_bag_fees, the one-time reversal rule of ticket_evt_fee_refunds, and the controllable-cause, banding, cap and choice rules of ticket_evt_irrops_reaccommodation, ticket_evt_irrops_compensation, ticket_evt_denied_boarding and ticket_evt_involuntary_downgrade, with ticket_corporate_agreement_benefits layering an agreement's waivers on top; in the natural course of a trip a disruption record precedes any rebooking or compensation that rests on it, and an exchange entry precedes its fee and fare settlement.
      The agent quotes and records exchanges, fees, refunds, rebookings and compensation, while only the customer can confirm disposing of the ticket itself — a void or a cancellation into credit — and only the customer can choose a voucher over cash or decline a rebooking.
      Requests outside every rule, such as compensation for an uncontrollable weather delay beyond rebooking, transferring a ticket to a different person on a personal booking, a refund of a nonrefundable fare the customer simply no longer wants in cash, or damages for a missed event, have no policy that decides them and go to a human representative as POLICY_NOT_COVERED.

  - name: flight_credits_and_vouchers
    claim:
      categories: [credit]
      event_types: [credit_issue, credit_value_load, credit_activate, credit_void, credit_redemption, credit_balance_forfeit, credit_deplete, credit_redemption_reversal, credit_restore, credit_extend, credit_service_fee, credit_fee_refund, credit_reinstate, credit_reinstatement_restore, credit_refund, credit_refund_payout, credit_name_correction]
    summary: >
      Callers hold one or several flight credits or travel vouchers — residual credits, flight credits, trip credits, service-recovery certificates, disruption vouchers and denied-boarding vouchers — and want to use them on a new ticket, combine them, extend or revive them, get cash back, fix the name on them, accept a voucher, or ask for a service-recovery certificate after a poor flight.
      The setting varies by instrument, credit status (issued, active, depleted, expired and beyond), how the expiry anchor and validity combine for that instrument, how much value remains and what earlier redemptions, reversals, extensions, reinstatements and fees are on file, whether the source ticket was booked under a corporate agreement, and what the holder's Summit tier waives.
      The governing rules are the credit charter's policies: instrument choice, expiry arithmetic and voucher acceptance in credit_issuance, beneficiary, eligible-amount, channel-fee and partial-use rules in credit_redemption_rules with ordering and combination limits in credit_agg_combination, the void-driven reversal of credit_redemption_reversal_rule, the windows, counts and fees of credit_extension and credit_reinstatement, the two cash grounds of credit_refunds, the amounts, uplift, cap and agent authority of credit_service_recovery, the refund-instead-of-credit bonus of credit_choose_credit_bonus and the agreement restriction of credit_corporate_origin; in the natural course of a credit's life value is loaded before it is redeemed, and an expiry write-off precedes any reinstatement that restores it.
      The agent applies credits, extends, reinstates, refunds and issues service-recovery certificates within those rules, while accepting a voucher in place of cash and choosing a trip credit over a refund are the customer's own decisions.
      Requests no rule decides — extending an instrument that does not allow it beyond its window, merging several credits into one, converting a non-refundable credit to cash, or a service-recovery amount above the agent's authority or for an unlisted failure — go to a human representative as POLICY_NOT_COVERED.

  - name: summit_miles_status_and_upgrades
    claim:
      categories: [loyalty]
      event_types: [loyalty_enroll, loyalty_retro_credit, loyalty_mqd_accrual, loyalty_partner_accrual, loyalty_accrual_reversal, loyalty_miles_purchase, loyalty_award_redemption, loyalty_award_redeposit, loyalty_miles_reinstatement, loyalty_miles_transfer_out, loyalty_miles_transfer_in, loyalty_tier_change, loyalty_choice_benefit_select, loyalty_certificate_issue, loyalty_bonus_credit, loyalty_upgrade_request, loyalty_upgrade_clear, loyalty_certificate_redeem, loyalty_close, loyalty_miles_expiry]
    summary: >
      Callers are Summit members at every tier, from new Summit Members to Summit Chairman, who report missing miles, want to book or cancel an award, buy or share miles, revive expired miles, understand or change their tier, make their choice-benefit selections, waitlist an upgrade, or close their account.
      The setting varies by tier and how it was obtained, membership status (enrolled, active, dormant, closed), the mile, qualifying-dollar and certificate balances, how long since the last qualifying activity, the fare brands and flown coupons of the tickets that name the membership, and the award, transfer, purchase, choice and upgrade history already posted this year.
      The governing rules are the loyalty charter's policies: earning on flown coupons in loyalty_flight_earning with the claim window and once-only crediting of loyalty_retro_credit_claims and loyalty_partner_earning, award pricing, fees, cutoff and single redeposit in loyalty_award_redemptions, dormancy and forfeiture in loyalty_inactivity_expiry with the window and fee ladder of loyalty_miles_reinstatement_rules, the minimums, annual caps and fees of loyalty_miles_transfers and loyalty_miles_purchases, thresholds, validity, soft landing and challenges in loyalty_tier_qualification, selection counts and options in loyalty_choice_benefits, method, eligibility, priority and certificate or miles cost in loyalty_upgrades_policy, and loyalty_account_closure; in the natural course of a membership miles post before they can be redeemed, and a forfeiture is posted before any reinstatement can undo it.
      The agent posts claims, redemptions, redeposits, transfers, purchases, reinstatements, choice selections and upgrade requests within those rules, while only the member can confirm closing the membership and forfeiting its balances.
      Requests no rule decides — goodwill miles for a reason outside the disruption rule, merging two memberships, restoring miles forfeited on closure, a status match outside the challenge rules, or crediting a partner flight the partner never reported — go to a human representative as POLICY_NOT_COVERED.

  - name: companion_certificates_and_passes
    claim:
      categories: [companion]
      event_types: [companion_trip_redeem, companion_fare_charge, companion_mark_used, companion_trip_reinstate, companion_restore, companion_fare_refund, companion_designate, companion_revoke, companion_trip_forfeit]
    summary: >
      Callers hold one or more companion certificates from the co-branded card or a Summit choice benefit, or a semiannual or annual companion pass, and want to book a companion, understand what the companion pays, cancel and get the trip back, change the designated companion on a pass, or ask why a certificate cannot be used.
      The setting varies by product, certificate status (issued, active, used, expired, revoked), book-by date and trips remaining, the holder's Summit membership status, the fare brand, route and dates of the intended trip including blackout periods and advance-booking limits, the booking channel, and the companion bookings, reinstatements and designation changes already on file.
      The governing rules are the companion charter's policies: eligible fare brands, route scope, blackouts, advance booking, monthly limits and charges in companion_booking_rules, per-product holding limits and the one-product-per-trip exclusion in companion_agg_holding_limits, cutoff, fee, refund and irregular-operations extension in companion_cancellation, the change allowance of companion_designation, forfeiture and revocation in companion_expiry_and_revocation and the one-time refund rule of companion_refund_controls; in the natural course of a trip the companion booking is recorded before its charges, and a booking must exist before it can be reinstated.
      The agent books, charges, reinstates and refunds within those rules, while designating or changing the named companion on a pass is the holder's own choice.
      Requests no rule decides — transferring a certificate to another person, using it on a partner flight or with an award ticket, reissuing an expired certificate, or a certificate that has not arrived after its deposit period — go to a human representative as POLICY_NOT_COVERED.

  - name: corporate_travel_agreements
    claim:
      categories: [business]
      event_types: [business_enroll, business_approve, business_decline, business_traveler_add, business_traveler_remove, business_points_accrual, business_spend_post, business_bonus_points, business_points_redemption, business_invoice_payment, business_late_fee, business_reinstate, business_tier_change, business_terminate]
    summary: >
      Callers are travel managers and travel arrangers speaking for a company's business profile, who want to apply for an agreement, add or remove travelers, claim points for trips booked without the agreement, redeem company points for awards, upgrades or Summit status, sort out invoices and late fees, get a suspended agreement back, or end the agreement.
      The setting varies by agreement tier, agreement status (applied, active, under review, suspended, terminated, declined), roster size and roles, the points balance and its earning months, this agreement year's spend against thresholds and milestones, the open invoice balance, due dates and credit limit, and which tickets carry the agreement.
      The governing rules are the business charter's policies: eligibility and tier entry in business_enrollment with the one-agreement rule of business_agg_multi_holding, the one-roster-per-traveler and caps of business_agg_traveler_rosters, earning, once-only crediting, claim window and bonuses in business_points_earning, beneficiaries, award prices and status-award limits in business_points_redemptions, expiry in business_points_expiry_rule, retention and drops in business_tier_review, terms, limits, late fees and suspension in business_billing, notice in business_termination and the negotiated discount and ticket benefits of business_negotiated_benefits; in the natural course of an agreement it is approved before travelers accrue points, and a late fee follows only an invoice that is past due.
      The agent records roster changes, points claims, redemptions, payments, late fees and reinstatements within those rules, while only the company's authorized representative can confirm terminating the agreement.
      Requests no rule decides — negotiating a new discount or a Corporate-tier contract, moving points to another company or to a traveler's Summit miles, waiving a late fee the rule imposes, or reinstating expired points — go to a human representative as POLICY_NOT_COVERED.
