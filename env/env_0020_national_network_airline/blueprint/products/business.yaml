        post_termination_redemption_days: =post_termination_redemption_days
- id: business_negotiated_benefits
  subject:
  - business_invoice_charge
  - business_points_accrual
  rule: A ticket counts as booked under the agreement only when it was booked through one of the booking_channels_eligible,
    carries the agreement's tour_code when tour_code_required is true, and is for a traveler on the active roster
    on the booking date. The negotiated discount applies to the base fare of tickets in the discount_eligible_fare_brands
    at fare_discount_percent_domestic for domestic and short-haul international itineraries and fare_discount_percent_international
    for long-haul international itineraries, and never to taxes when discount_applies_to_taxes is false. These tickets
    also receive the waivers and allowances the ticket charter applies from change_fee_waiver and corporate_free_checked_bags,
    may be reassigned to another active roster traveler when ticket_name_change_between_travelers is true, and their
    credits may pay for another roster traveler's ticket under the same agreement when credit_pooling_across_travelers
    is true. Crestline Basic Economy, award tickets and companion tickets are never booked under an agreement. The
    negotiated discount is not combined with any other promotional fare discount; the lower resulting fare is charged.
