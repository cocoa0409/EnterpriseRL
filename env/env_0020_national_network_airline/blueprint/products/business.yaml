- id: business_points_expiry_rule
  subject:
  - business_points_expiry
  rule: Points earned in a calendar month expire at the end of the month points_expiry_months calendar months later
    if still unredeemed; redemptions always use the oldest unexpired points first, and the points due to expire
    are measured by business_msr_expired_points_due. Expired points are posted in one expiry entry per earning month
    and are never reinstated. On termination, points not redeemed within post_termination_redemption_days calendar
    days after termination expire at the end of that period whatever their earning month.
  eligibility: []
  params:
    per_tier:
      Crestline Business Connect:
        points_expiry_months: =points_expiry_months
        post_termination_redemption_days: =post_termination_redemption_days
      Crestline Business Connect Plus:
        points_expiry_months: =points_expiry_months
        post_termination_redemption_days: =post_termination_redemption_days
      Crestline Corporate Select:
        points_expiry_months: =points_expiry_months
        post_termination_redemption_days: =post_termination_redemption_days
      Crestline Corporate Preferred:
        points_expiry_months: =points_expiry_months
        post_termination_redemption_days: =post_termination_redemption_days
      Crestline Corporate Premier:
        points_expiry_months: =points_expiry_months
        post_termination_redemption_days: =post_termination_redemption_days
      Crestline Corporate Strategic:
        points_expiry_months: =points_expiry_months
        post_termination_redemption_days: =post_termination_redemption_days
  measures:
  - business_msr_expired_points_due
- id: business_tier_review
  subject:
  - business_review_open
  - business_review_close
  - business_tier_change
  - business_spend_reset
  rule: 'At each anniversary of approved_date the agreement year''s spend is compared with retention_spend_percent_of_threshold
    percent of the current tier''s annual_spend_threshold_usd; at or above it the tier is kept, below it a review
    opens. A review is decided within review_period_days calendar days of review_opened_date: the tier is lowered
    to the highest tier whose retention level the spend meets, by at most max_tier_drop_per_review tiers, and the
    agreement returns to active with a new agreement_end_date; when the spend meets no tier''s retention level other
    than Crestline Business Connect and the company is on a Corporate tier, the agreement is not renewed and is
    terminated. After the comparison the agreement year''s spend is reset to zero in one reset entry dated on the
    anniversary. Crestline Business Connect has no retention level and is never reviewed. A review never changes
    the point_balance or the roster.'
  eligibility: []
  params:
    per_tier:
      Crestline Business Connect:
        annual_spend_threshold_usd: =annual_spend_threshold_usd
        retention_spend_percent_of_threshold: =retention_spend_percent_of_threshold
        max_tier_drop_per_review: =max_tier_drop_per_review
        review_period_days: =review_period_days
      Crestline Business Connect Plus:
        annual_spend_threshold_usd: =annual_spend_threshold_usd
        retention_spend_percent_of_threshold: =retention_spend_percent_of_threshold
        max_tier_drop_per_review: =max_tier_drop_per_review
        review_period_days: =review_period_days
