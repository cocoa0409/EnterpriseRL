        overdue_suspension_days: =overdue_suspension_days
        suspension_termination_days: =suspension_termination_days
        late_payment_fee_percent: =late_payment_fee_percent
        late_payment_fee_min_usd: =late_payment_fee_min_usd
  measures:
  - business_msr_days_overdue
  formula:
    late_fee: max(late_payment_fee_min_usd, round(amount * late_payment_fee_percent / 100, 2))
- id: business_termination
  subject:
  - business_terminate
  rule: The company may terminate its agreement at any time by giving notice; the termination takes effect termination_notice_days
    calendar days after the notice, or on the notice date when termination_notice_days is zero, and only the company's
    authorized representative can confirm it. Crestline terminates an agreement only through the billing rule or
    the tier review, never at a support agent's discretion. On termination the roster closes, remaining points stay
    redeemable for post_termination_redemption_days calendar days, open invoices remain payable, and tickets already
    booked keep their corporate benefits through travel.
  eligibility: []
  params:
    per_tier:
      Crestline Business Connect:
        termination_notice_days: =termination_notice_days
        post_termination_redemption_days: =post_termination_redemption_days
