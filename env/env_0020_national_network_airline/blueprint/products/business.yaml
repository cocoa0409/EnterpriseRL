- id: business_billing
  subject:
  - business_invoice_charge
  - business_invoice_payment
  - business_late_fee
  - business_suspend
  - business_reinstate
  rule: 'Tickets booked under the agreement are billed on invoice only when invoice_billing_permitted is true; otherwise
    they are paid by card at booking. A ticket is invoiced only while the agreement is active or under_review, and
    only when the invoice_balance plus the ticket total stays within credit_limit_usd; a ticket that would exceed
    the limit is paid by card. Each invoice is due invoice_payment_terms_days calendar days after its invoice date.
    An invoice still unpaid after its due date is charged one late fee of late_payment_fee_percent percent of its
    unpaid amount, at least late_payment_fee_min_usd, rounded to the cent. When business_msr_days_overdue exceeds
    overdue_suspension_days the agreement is suspended: no new tickets are invoiced, points stop accruing and corporate
    ticket benefits are not applied to new bookings. Payments are applied to the invoice named in the payment, and
    a suspended agreement returns to active once every overdue invoice and its late fee are paid in full. An agreement
    still unpaid suspension_termination_days calendar days after suspended_date is terminated.'
  eligibility:
  - id: invoice_agreement_open
    applies_to:
    - business_invoice_charge
    kind: state
    condition: A ticket is invoiced only while the agreement is active or under_review
    evidence_fields:
    - business_holdings.business_account_id
    - business_holdings.status
    - business_holdings.invoice_balance
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - business_holdings.business_account_id
      action_bindings:
        business_holdings.business_account_id: business_account_id
    state_contract:
      field: business_holdings.status
      allowed:
      - active
      - under_review
  - id: one_late_fee
    applies_to:
    - business_late_fee
    kind: dedup
    condition: An invoice still unpaid after its due date is charged one late fee
    evidence_fields:
    - business_invoices.invoice_number
    - business_invoices.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - business_invoices.invoice_number
      action_bindings:
        business_invoices.invoice_number: invoice_number
    dedup_contract:
      table: business_invoices
      mode: separate_record
      object_bindings:
        invoice_number: invoice_number
      duplicate_filters:
        event_type:
        - business_late_fee
      distinct_fields: []
  params:
    per_tier:
      Crestline Business Connect:
        invoice_billing_permitted: =invoice_billing_permitted
        invoice_payment_terms_days: =invoice_payment_terms_days
        credit_limit_usd: =credit_limit_usd
        overdue_suspension_days: =overdue_suspension_days
        suspension_termination_days: =suspension_termination_days
        late_payment_fee_percent: =late_payment_fee_percent
        late_payment_fee_min_usd: =late_payment_fee_min_usd
      Crestline Business Connect Plus:
        invoice_billing_permitted: =invoice_billing_permitted
        invoice_payment_terms_days: =invoice_payment_terms_days
        credit_limit_usd: =credit_limit_usd
        overdue_suspension_days: =overdue_suspension_days
        suspension_termination_days: =suspension_termination_days
        late_payment_fee_percent: =late_payment_fee_percent
        late_payment_fee_min_usd: =late_payment_fee_min_usd
      Crestline Corporate Select:
        invoice_billing_permitted: =invoice_billing_permitted
        invoice_payment_terms_days: =invoice_payment_terms_days
        credit_limit_usd: =credit_limit_usd
        overdue_suspension_days: =overdue_suspension_days
        suspension_termination_days: =suspension_termination_days
        late_payment_fee_percent: =late_payment_fee_percent
        late_payment_fee_min_usd: =late_payment_fee_min_usd
      Crestline Corporate Preferred:
        invoice_billing_permitted: =invoice_billing_permitted
        invoice_payment_terms_days: =invoice_payment_terms_days
        credit_limit_usd: =credit_limit_usd
        overdue_suspension_days: =overdue_suspension_days
        suspension_termination_days: =suspension_termination_days
        late_payment_fee_percent: =late_payment_fee_percent
        late_payment_fee_min_usd: =late_payment_fee_min_usd
      Crestline Corporate Premier:
        invoice_billing_permitted: =invoice_billing_permitted
        invoice_payment_terms_days: =invoice_payment_terms_days
        credit_limit_usd: =credit_limit_usd
        overdue_suspension_days: =overdue_suspension_days
        suspension_termination_days: =suspension_termination_days
        late_payment_fee_percent: =late_payment_fee_percent
        late_payment_fee_min_usd: =late_payment_fee_min_usd
      Crestline Corporate Strategic:
        invoice_billing_permitted: =invoice_billing_permitted
