- id: club_elite_benefit_membership
  subject:
  - club_enroll
  - club_charge
  rule: A Summit Diamond or Summit Chairman member who takes club_membership as a choice benefit receives a Summit
    Club Individual membership with enrollment_source elite_choice_benefit, settled with payment_method benefit
    at no charge, for one membership year; only memberships with elite_choice_benefit_eligible true can be granted
    this way. A benefit membership is granted only when the customer holds no other lounge membership in pending,
    active or grace status; a member who already holds one receives no refund or extension in its place. At the
    end of the benefit year the membership lapses unless the member pays renewal dues, since benefit_membership_auto_renew
    is false.
  eligibility: []
  params:
    per_tier:
      Summit Club Essential:
        elite_choice_benefit_eligible: =elite_choice_benefit_eligible
        benefit_membership_auto_renew: =benefit_membership_auto_renew
