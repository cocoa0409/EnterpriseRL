events:
- type: club_enroll
  target: club_holdings
  mutation: create
  meaning: A lounge membership is purchased or granted.
  grain: One row per membership.
  fields:
    variant_name: membership
    membership_number: number
    enrollment_source: source
    business_account_id: paying agreement
    start_date: first day
    renewal_date: end of first year
    auto_renew: renewal setting
  triggers: []
- type: club_activate
  target: club_holdings
  mutation:
    transition:
      from: pending
      to: active
  meaning: The membership starts.
  grain: One per membership.
  fields:
    start_date: first day
  triggers:
  - event: club:club_guest_pass_grant
    map:
      entry_date: start_date
      membership_year_start: start_date
- type: club_charge
  target: club_ledger
  meaning: Dues, a lifetime price, a guest fee, an extra-visit fee or an upgrade difference is charged.
  grain: One entry per charge.
  distinguish_by:
  - charge_type
  - membership_year_start
  - entry_date
  - club_location
  fields:
    entry_date: date charged
    amount: amount
    charge_type: kind
    payment_method: settlement
    membership_year_start: year covered
    club_location: club of a guest or visit fee
  account: club_charges
  direction: in
  triggers: []
- type: club_charge_refund
  target: club_ledger
  meaning: A club charge is refunded in full or in part.
  grain: One entry per charge refunded.
  distinguish_by:
  - reversed_entry_id
  fields:
    entry_date: date refunded
    amount: amount refunded
    reversed_entry_id: charge refunded
    charge_type: kind refunded
  account: club_charges
  direction: out
  triggers: []
- type: club_visit
  target: club_ledger
  meaning: The member enters a club.
  grain: One entry per member visit day per club.
  distinguish_by:
  - entry_date
  - club_location
  fields:
    entry_date: visit date
    club_location: club
    guests: guests entering with the member
  triggers: []
- type: club_guest_pass_grant
  target: club_ledger
  meaning: The year's guest passes are granted.
  grain: One entry per membership year.
  distinguish_by:
  - membership_year_start
  fields:
    entry_date: date granted
    passes: passes granted
    membership_year_start: year covered
  account: guest_passes
  direction: in
  triggers: []
- type: club_guest_entry
  target: club_ledger
  meaning: Guest passes are used to admit guests.
  grain: One entry per club visit using passes.
  distinguish_by:
  - entry_date
  - club_location
  fields:
    entry_date: visit date
    club_location: club
    passes: passes used
    guests: guests admitted
  account: guest_passes
  direction: out
  triggers: []
- type: club_guest_pass_expiry
  target: club_ledger
  meaning: Unused guest passes expire or are forfeited.
  grain: One entry per expiring grant.
  distinguish_by:
  - membership_year_start
  fields:
    entry_date: date expired
    passes: passes expired
    membership_year_start: year of the grant
  account: guest_passes
  direction: out
  triggers: []
- type: club_renewal_lapse
  target: club_holdings
  mutation:
    transition:
      from: active
      to: grace
  meaning: The renewal date passed unpaid.
  grain: One per membership year.
  fields:
    renewal_date: unchanged renewal date
  triggers: []
- type: club_renew
  target: club_holdings
  mutation:
    transition:
      from: grace
      to: active
  meaning: Renewal dues are paid inside the grace period.
  grain: One per renewal.
  fields:
    renewal_date: new renewal date
  triggers: []
- type: club_renewal_update
  target: club_holdings
  mutation: update
  meaning: The renewal date or the auto-renew setting of an active membership changes after an on-time renewal or
    on the member's instruction.
  grain: One row per membership (the membership record itself).
  fields:
    renewal_date: new renewal date
    auto_renew: new setting
  triggers: []
- type: club_lapse
  target: club_holdings
  mutation:
    transition:
      from: grace
      to: lapsed
  meaning: The grace period ended without renewal.
  grain: One per membership.
  fields:
    closed_date: date lapsed
  triggers:
  - event: club:club_guest_pass_expiry
    map:
      entry_date: closed_date
- type: club_cancel
  target: club_holdings
  mutation:
    transition:
    - from: pending
      to: cancelled
    - from: active
      to: cancelled
  meaning: The member cancels the membership.
  grain: One per membership.
  fields:
    closed_date: date cancelled
  triggers:
  - event: club:club_guest_pass_expiry
    map:
      entry_date: closed_date
- type: club_tier_change
  target: club_holdings
  mutation: update
  meaning: The membership is upgraded to a higher membership during the year.
  grain: One row per membership (the membership record itself).
  fields:
    variant_name: new membership
  triggers: []
measures:
- id: club_msr_visit_days_this_year
  window: Current membership year, from the latest start_date anniversary to the handling date.
  measure: Count of distinct entry_date values among club_visit entries of the membership inside the window.
policies:
- id: club_agg_multi_holding
  subject:
  - club_enroll
  rule: A person may hold only one lounge membership; a new membership is not opened while the customer has one
    in pending, active or grace status, and a higher membership is reached by upgrade instead.
  eligibility:
  - id: one_membership
    applies_to:
    - club_enroll
    kind: dedup
    condition: a new membership is not opened while the customer has one in pending, active or grace status
    evidence_fields:
    - club_holdings.customer_id
    - club_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - club_holdings.customer_id
      action_bindings:
        club_holdings.customer_id: customer_id
    dedup_contract:
      table: club_holdings
      mode: separate_record
