- id: club_membership_changes
  subject:
  - club_tier_change
  - club_charge
  rule: A membership may be upgraded to a higher membership during the year when tier_upgrade_permitted is true;
    the member pays the new membership's annual dues less, when tier_upgrade_credit_basis is prorated_remaining_months,
    the current dues prorated over the unused full calendar months, charged as an upgrade_difference. The renewal_date
    does not change on an upgrade. A membership is changed only while it is active. Downgrades take effect only
    at renewal when midterm_downgrade_permitted is false, and a membership is never transferred to another person.
  eligibility:
  - id: change_active
    applies_to:
    - club_tier_change
    kind: state
    condition: A membership is changed only while it is active.
    evidence_fields:
    - club_holdings.club_membership_id
    - club_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - club_holdings.club_membership_id
      action_bindings:
        club_holdings.club_membership_id: club_membership_id
    state_contract:
      field: club_holdings.status
      allowed:
      - active
  params:
    per_tier:
      Summit Club Essential:
        tier_upgrade_permitted: =tier_upgrade_permitted
        tier_upgrade_credit_basis: =tier_upgrade_credit_basis
        midterm_downgrade_permitted: =midterm_downgrade_permitted
      Summit Club Individual:
        tier_upgrade_permitted: =tier_upgrade_permitted
        tier_upgrade_credit_basis: =tier_upgrade_credit_basis
        midterm_downgrade_permitted: =midterm_downgrade_permitted
      Summit Club Individual Plus:
        tier_upgrade_permitted: =tier_upgrade_permitted
        tier_upgrade_credit_basis: =tier_upgrade_credit_basis
        midterm_downgrade_permitted: =midterm_downgrade_permitted
      Summit Club Executive:
