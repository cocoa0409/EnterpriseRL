- id: club_renewal
  subject:
  - club_renewal_lapse
  - club_renew
  - club_lapse
  - club_renewal_update
  - club_charge
  rule: Renewal dues for the next membership year fall due on the renewal_date and are charged automatically when
    auto_renew is true; the member may pay them from early_renewal_window_days calendar days before the renewal_date.
    A membership whose renewal_date passes unpaid enters grace, and renewal dues can be paid no later than the renewal
    date plus renewal_grace_days. The grace period is counted in calendar days from the renewal_date, and a payment
    on its last day is accepted; the renewed year still starts on the old renewal_date, and a membership not renewed
    by then lapses. The member may switch auto_renew on or off at any time while the membership is active, and a
    membership granted as a choice benefit renews at the member's expense only when benefit_membership_auto_renew
    is true. Summit Club Lifetime memberships never renew and never enter grace.
  eligibility:
  - id: grace_window
    applies_to:
    - club_renew
    kind: time
    condition: renewal dues can be paid no later than the renewal date plus renewal_grace_days.
    evidence_fields:
    - club_holdings.club_membership_id
    - club_holdings.renewal_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - club_holdings.club_membership_id
      action_bindings:
        club_holdings.club_membership_id: club_membership_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the renewal date
      anchor_source: club_holdings.renewal_date
      relation: not_after
      duration_source: variants.renewal_grace_days
      unit: calendar_days
      counting_rule: The grace period is counted in calendar days from the renewal_date, and a payment on its last
        day is accepted
      boundary: inclusive
  params:
    per_tier:
      Summit Club Essential:
        auto_renew_default: =auto_renew_default
        renewal_grace_days: =renewal_grace_days
        early_renewal_window_days: =early_renewal_window_days
        benefit_membership_auto_renew: =benefit_membership_auto_renew
        lifetime_membership: =lifetime_membership
      Summit Club Individual:
