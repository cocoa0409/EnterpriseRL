# Product charter: Crestline Summit Club Lounge Memberships (category key: club).
# Policy constants live only here; the runtime never reads this file.
category: club
display_name: Crestline Summit Club Lounge Memberships
binding:
  holding_table: club_holdings
  event_tables:
  - club_ledger
  status_field: status
  variant_field: variant_name
  quantity_fields:
    guest_passes_remaining: guest_passes
lifecycle:
  states:
  - pending
  - active
  - grace
  - lapsed
  - cancelled
  transitions:
  - from: pending
    to: active
    by: system
    means: The dues or purchase price is settled
    or the membership is granted as a benefit: null
    and the membership starts.: null
  - from: active
    to: grace
    by: system
    means: The renewal date passed without the renewal dues being paid.
  - from: grace
    to: active
    by: agent
    means: The renewal dues are paid inside the grace period.
  - from: grace
    to: lapsed
    by: system
    means: The grace period ended without renewal.
  - from: pending
    to: cancelled
    by: user
    means: The customer cancels the membership before it starts.
  - from: active
    to: cancelled
    by: user
    means: The customer cancels an active membership.
accounts:
- key: guest_passes
  unit: passes
  meaning: One-time guest passes available to the member; annual grants add, guest entries and expiries deduct.
- key: club_charges
  unit: USD
  meaning: Dues, lifetime purchase price, guest fees and extra-visit fees paid by the member, less refunds.
parameter_schema:
  annual_dues_usd: Dues per membership year; 0 for a lifetime membership (USD)
  lifetime_purchase_price_usd: One-time price of a lifetime membership; 0 where not applicable (USD)
  lifetime_membership: Whether the membership never renews and never expires (boolean)
  membership_term_months: Calendar months of one membership year from start_date (integer, months)
  summit_elite_dues_discount_usd: Dues discount for Summit Gold and higher members (USD)
  miles_payment_permitted: Whether dues may be paid entirely with Summit miles (boolean)
  miles_dues_price: Summit miles that pay one year of dues when miles payment is permitted (integer, miles)
  dues_paid_by_company: Whether the dues are billed to a corporate travel agreement (boolean)
  minimum_member_age_years: Youngest age at which a person may hold a membership (integer, years)
  summit_membership_required: Whether an open Summit membership is required to hold and use the membership (boolean)
  visit_limit_applies: Whether visits per membership year are capped (boolean)
  annual_visit_limit: Visits per membership year included before extra-visit fees; 0 where no cap applies (integer,
    visit days)
  extra_visit_fee_usd: Fee per visit day beyond annual_visit_limit (USD)
  same_day_reentry_counts_once: Whether several entries on one calendar day count as one visit day (boolean)
  same_day_boarding_pass_required: Whether entry requires a boarding pass for a same-day departing Crestline or
    partner flight (boolean)
  basic_economy_access_permitted: Whether a member traveling on Crestline Basic Economy may enter (boolean)
  access_hours_before_departure: Earliest entry before the scheduled departure of the member's flight (integer,
    hours)
  arrival_access_permitted: Whether the member may enter on arrival from a Crestline flight (boolean)
  partner_lounge_access: Whether partner airline lounges may be used when flying the partner (boolean)
  reserve_lounge_access: Whether the premium Summit Club Reserve locations may be used (boolean)
  family_access: Whether the member's spouse or domestic partner and children younger than family_child_age_under
    enter free with the member (boolean)
  family_child_age_under: Children younger than this age count as family under family_access (integer, years)
  child_free_age_under: Children younger than this age enter free with the member on any membership (integer, years)
  guests_per_visit_included: Guests who enter free with the member on each visit (integer, persons)
  max_guests_per_visit: Most guests who may enter with the member on one visit, free or paid (integer, persons)
  guest_entry_fee_usd: Fee per guest entry not covered by an included guest or a guest pass (USD)
  guest_passes_per_year: One-time guest passes granted at the start of each membership year (integer, passes)
  guest_pass_validity_months: Calendar months a granted guest pass stays valid (integer, months)
  guest_pass_usable_without_member: Whether a guest pass may admit its holder without the member present (boolean)
  cancellation_refund_window_days: Calendar days after start_date within which a cancelled membership with no visit
    is fully refunded (integer, calendar days)
  prorated_refund_permitted: Whether a cancellation after the window refunds the unused full months (boolean)
  auto_renew_default: Whether a new membership renews automatically unless switched off (boolean)
  renewal_grace_days: Calendar days after the renewal date during which renewal dues may still be paid (integer,
    calendar days)
  early_renewal_window_days: Calendar days before the renewal date from which renewal dues may be paid (integer,
    calendar days)
  multi_year_prepay_years: Membership years that may be prepaid at once (integer, years)
  multi_year_prepay_discount_percent: Discount on each year's dues when prepaying multi_year_prepay_years years
    (integer, percent)
  tier_upgrade_permitted: Whether the membership may be upgraded to a higher membership during the year (boolean)
  tier_upgrade_credit_basis: 'Credit given for the current dues on an upgrade (enum: prorated_remaining_months |
    none)'
  midterm_downgrade_permitted: Whether the membership may be downgraded before the renewal date (boolean)
  transferable: Whether the membership may be transferred to another person (boolean)
  elite_choice_benefit_eligible: Whether this membership may be granted as a Summit choice benefit (boolean)
  benefit_membership_auto_renew: Whether a membership granted as a choice benefit renews automatically at the member's
    expense (boolean)
  connection_access_permitted: Whether entry is allowed during a connection on a same-day itinerary (boolean)
  max_visit_hours_before_departure_exception_irrops: Hours before a delayed flight's new departure from which entry
    is allowed during a disruption (integer, hours)
  shower_suite_access: Whether shower suites at hub clubs are included (boolean)
  spa_credit_usd: Annual spa credit at Summit Club Reserve locations (USD)
  dues_payable_with_flight_credit: Whether dues may be paid with a Crestline flight credit (boolean)
  visit_count_resets_on_renewal: Whether the visit count starts again at each renewal date (boolean)
  lapse_forfeits_guest_passes: Whether unused guest passes are forfeited when the membership lapses or is cancelled
    (boolean)
