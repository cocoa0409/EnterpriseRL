- id: club_cancellation_refunds
  subject:
  - club_cancel
  - club_charge_refund
  rule: Only the member can cancel a lounge membership. A membership cancelled within cancellation_refund_window_days
    calendar days after start_date with no club_visit entry is refunded in full; after that window, or once a visit
    has been made, dues are refunded only when prorated_refund_permitted is true, for the unused full calendar months
    of the membership year. Guest fees and extra-visit fees are never refunded once the entry took place, and dues
    paid with miles are refunded as miles to the Summit membership rather than as cash. Each charge can be refunded
    at most once. A Summit Club Lifetime membership is refundable only inside the cancellation window, and a membership
    granted as a choice benefit is cancelled without any refund.
  eligibility:
  - id: refund_once
    applies_to:
    - club_charge_refund
    kind: dedup
    condition: Each charge can be refunded at most once.
