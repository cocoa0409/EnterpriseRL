  window: The calendar month of the travel_date of the trip being booked.
  measure: Count of companion_trip_redeem entries on the same certificate or pass whose travel_date falls in that
    month, less those later reinstated.
- id: companion_msr_active_same_variant
  window: Current portfolio at the handling moment.
  measure: Count of the customer's companion holdings of the same variant_name with status issued or active.
policies:
- id: companion_agg_multi_holding
  subject:
  - companion_issue
  rule: A customer may hold several companion certificates and passes at the same time, including several of the
    same product, subject to the per-product limit of the holding-limits rule.
  eligibility: []
  params:
    max_per_customer: null
- id: companion_agg_holding_limits
  subject:
  - companion_issue
  - companion_trip_redeem
  rule: 'A customer may hold at most max_active_same_variant certificates or passes of one product in issued or
    active status, as counted by companion_msr_active_same_variant; an issue that would exceed it is not made and
    the entitlement stays with the issuing source. Only one companion product may be used on one reservation: a
    certificate and a pass, or two certificates, are never combined for the same trip when combinable_with_other_companion_products
    is false, and one certificate covers at most max_companions_per_booking companions. When the holder has several
    eligible products for the same trip, the one with the earliest book_by_date is used unless the holder names
    another. Companion products are never combined with an award ticket for the holder, with a corporate agreement
    fare or with Crestline Basic Economy.'
