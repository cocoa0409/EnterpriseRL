- id: companion_refund_controls
  subject:
  - companion_fare_refund
  rule: Each charge entry can be refunded at most once, and a refund equals the amount of the charge it names. A
    refund is made only for a companion ticket that was cancelled or whose charge was made in error; a flown companion
    trip is never refunded.
