- id: companion_expiry_and_revocation
  subject:
  - companion_expire
  - companion_revoke
  - companion_trip_forfeit
  rule: A certificate or pass still active at the end of its book_by_date expires on the following day and its remaining
    trips are forfeited in one forfeiture entry; trips already booked are unaffected. A certificate or pass is revoked
    when revocation_on_membership_closure is true and the holder's Summit membership is closed, and its remaining
    trips are forfeited; a certificate issued in error is revoked before it becomes active. A forfeiture is booked
    only on a certificate or pass whose status is expired or revoked. Expired or revoked products are never reinstated,
    extended or reissued by a support agent, except through the irregular-operations extension of the cancellation
    rule for a trip Crestline cancelled.
  eligibility:
  - id: forfeit_after_close
    applies_to:
    - companion_trip_forfeit
    kind: state
    condition: A forfeiture is booked only on a certificate or pass whose status is expired or revoked.
    evidence_fields:
    - companion_holdings.companion_id
    - companion_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - companion_holdings.companion_id
      action_bindings:
        companion_holdings.companion_id: companion_id
    state_contract:
      field: companion_holdings.status
      allowed:
      - expired
      - revoked
  params:
    per_tier:
      Crestline Companion Certificate Main Cabin:
        validity_months: =validity_months
        revocation_on_membership_closure: =revocation_on_membership_closure
      Crestline Companion Certificate Main Plus:
        validity_months: =validity_months
        revocation_on_membership_closure: =revocation_on_membership_closure
      Crestline Companion Certificate Premium Economy:
        validity_months: =validity_months
        revocation_on_membership_closure: =revocation_on_membership_closure
      Crestline Companion Certificate First:
        validity_months: =validity_months
        revocation_on_membership_closure: =revocation_on_membership_closure
      Crestline Companion Pass Semiannual:
        validity_months: =validity_months
        revocation_on_membership_closure: =revocation_on_membership_closure
      Crestline Companion Pass Annual:
        validity_months: =validity_months
        revocation_on_membership_closure: =revocation_on_membership_closure
- id: companion_designation
  subject:
  - companion_designate
  - companion_fare_charge
  rule: A pass holder designates one named companion when designation_required is true, and may change the designated
    companion at most designation_changes_allowed times over the life of the pass, as recorded in designation_changes_used;
    the first designation is not a change. A designation change is made only while the pass is active and only when
    no unflown companion trip is booked for the current companion. A change carries designation_change_fee_usd,
    charged as its own charge entry, and the new companion may travel from the moment of the change. Certificates
    have no designated companion and may be used for any companion the holder names at booking.
  eligibility:
  - id: designate_active
    applies_to:
    - companion_designate
    kind: state
    condition: A designation change is made only while the pass is active
    evidence_fields:
    - companion_holdings.companion_id
    - companion_holdings.status
    - companion_holdings.designation_changes_used
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - companion_holdings.companion_id
      action_bindings:
        companion_holdings.companion_id: companion_id
    state_contract:
      field: companion_holdings.status
      allowed:
      - active
  params:
    per_tier:
      Crestline Companion Certificate Main Cabin:
        designation_required: =designation_required
        designation_changes_allowed: =designation_changes_allowed
        designation_change_fee_usd: =designation_change_fee_usd
      Crestline Companion Certificate Main Plus:
        designation_required: =designation_required
        designation_changes_allowed: =designation_changes_allowed
        designation_change_fee_usd: =designation_change_fee_usd
      Crestline Companion Certificate Premium Economy:
