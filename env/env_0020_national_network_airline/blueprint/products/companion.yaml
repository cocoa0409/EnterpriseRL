        companion_fare_refund_form: =companion_fare_refund_form
        irrops_reinstatement_extension_days: =irrops_reinstatement_extension_days
      Crestline Companion Certificate First:
        cancellation_cutoff_hours_before_departure: =cancellation_cutoff_hours_before_departure
        cancellation_reinstates_trip: =cancellation_reinstates_trip
        reinstatement_fee_usd: =reinstatement_fee_usd
        reinstated_trip_keeps_book_by_date: =reinstated_trip_keeps_book_by_date
        companion_cancelled_with_holder: =companion_cancelled_with_holder
