- id: companion_cancellation
  subject:
  - companion_trip_reinstate
  - companion_restore
  - companion_fare_refund
  - companion_fare_charge
  rule: Cancelling the holder's ticket cancels the companion's ticket too when companion_cancelled_with_holder is
    true; the companion ticket may be cancelled alone, and the holder then travels on their own ticket. A voluntary
    cancellation returns the trip only when cancellation_reinstates_trip is true and the companion booking is cancelled
    no later than the first scheduled departure of the companion booking minus cancellation_cutoff_hours_before_departure.
    The cutoff is counted back in full elapsed hours from the scheduled departure of the companion's first flight,
    and a cancellation exactly at the cutoff is accepted; after it the trip is used up. A reinstated trip keeps
    the original book_by_date when reinstated_trip_keeps_book_by_date is true, so a trip reinstated after the book_by_date
    has passed can no longer be booked and is forfeited at expiry. A voluntary reinstatement carries reinstatement_fee_usd,
    charged as its own charge entry. When Crestline cancels the companion's flight and the holder does not accept
    rebooking, the trip is reinstated with reinstatement_ground crestline_cancellation without fee, and if the book_by_date
    has passed or falls within irrops_reinstatement_extension_days calendar days it is moved to the reinstatement
    date plus irrops_reinstatement_extension_days. On every cancellation the companion fare and taxes are refunded
    in the companion_fare_refund_form, one refund entry per charge entry; phone booking fees are not refunded. Each
    companion booking can be reinstated at most once. A reinstated trip on a used product makes it active again.
  eligibility:
  - id: reinstatement_cutoff
    applies_to:
    - companion_trip_reinstate
    kind: time
    condition: A voluntary cancellation returns the trip only when cancellation_reinstates_trip is true and the
      companion booking is cancelled no later than the first scheduled departure of the companion booking minus
      cancellation_cutoff_hours_before_departure.
    evidence_fields:
    - ticket_holdings.ticket_number
    - ticket_holdings.next_departure_at
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - ticket_holdings.ticket_number
      action_bindings:
        ticket_holdings.ticket_number: companion_ticket_number
    temporal_basis:
      clock: frozen_time
      anchor_event: the first scheduled departure of the companion booking
      anchor_source: ticket_holdings.next_departure_at
      relation: not_after
      duration_source: variants.cancellation_cutoff_hours_before_departure
      unit: elapsed_hours
      counting_rule: The cutoff is counted back in full elapsed hours from the scheduled departure of the companion's
        first flight, and a cancellation exactly at the cutoff is accepted
      boundary: inclusive
  - id: reinstate_once
    applies_to:
    - companion_trip_reinstate
    kind: dedup
    condition: Each companion booking can be reinstated at most once.
    evidence_fields:
    - companion_ledger.companion_entry_id
    - companion_ledger.reversed_entry_id
    - companion_ledger.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - companion_ledger.companion_entry_id
      action_bindings:
        companion_ledger.companion_entry_id: reversed_entry_id
    dedup_contract:
      table: companion_ledger
      mode: separate_record
      object_bindings:
        reversed_entry_id: reversed_entry_id
      duplicate_filters:
        event_type:
        - companion_trip_reinstate
      distinct_fields: []
  params:
    per_tier:
      Crestline Companion Certificate Main Cabin:
        cancellation_cutoff_hours_before_departure: =cancellation_cutoff_hours_before_departure
        cancellation_reinstates_trip: =cancellation_reinstates_trip
        reinstatement_fee_usd: =reinstatement_fee_usd
        reinstated_trip_keeps_book_by_date: =reinstated_trip_keeps_book_by_date
        companion_cancelled_with_holder: =companion_cancelled_with_holder
        companion_fare_refund_form: =companion_fare_refund_form
        irrops_reinstatement_extension_days: =irrops_reinstatement_extension_days
      Crestline Companion Certificate Main Plus:
        cancellation_cutoff_hours_before_departure: =cancellation_cutoff_hours_before_departure
        cancellation_reinstates_trip: =cancellation_reinstates_trip
        reinstatement_fee_usd: =reinstatement_fee_usd
        reinstated_trip_keeps_book_by_date: =reinstated_trip_keeps_book_by_date
        companion_cancelled_with_holder: =companion_cancelled_with_holder
        companion_fare_refund_form: =companion_fare_refund_form
        irrops_reinstatement_extension_days: =irrops_reinstatement_extension_days
      Crestline Companion Certificate Premium Economy:
        cancellation_cutoff_hours_before_departure: =cancellation_cutoff_hours_before_departure
        cancellation_reinstates_trip: =cancellation_reinstates_trip
        reinstatement_fee_usd: =reinstatement_fee_usd
        reinstated_trip_keeps_book_by_date: =reinstated_trip_keeps_book_by_date
