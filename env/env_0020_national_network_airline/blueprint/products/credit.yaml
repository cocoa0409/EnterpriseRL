        choose_credit_bonus_cap_usd: =choose_credit_bonus_cap_usd
- id: credit_fee_refunds
  subject:
  - credit_fee_refund
  rule: A credit service fee is refunded in full when it was charged in error — a fee charged although the customer's
    Summit tier waives it, a telephone fee on an instrument that cannot be redeemed online, or a fee for an extension
    or reinstatement that was not granted. Each fee entry can be refunded at most once. A fee for an extension or
    reinstatement that was granted is never refunded, even if the credit is later unused.
  eligibility:
  - id: one_fee_refund
    applies_to:
    - credit_fee_refund
    kind: dedup
    condition: Each fee entry can be refunded at most once.
    evidence_fields:
    - credit_ledger.credit_entry_id
