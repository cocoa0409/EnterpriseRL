      mode: separate_record
      object_bindings:
        reversed_entry_id: reversed_entry_id
      duplicate_filters:
        event_type:
        - credit_fee_refund
      distinct_fields: []
- id: credit_name_rules
  subject:
  - credit_name_correction
  rule: The traveler_name on a credit may be corrected by at most credit_name_correction_max_characters characters
    to match the government ID, or updated to a legal name change already shown on the customer profile. A name
    correction is made only while the credit is issued or active. A named_traveler_only credit is never re-issued
    to a different person; for other instruments the beneficiary_scope already governs who may travel, so the name
    is not changed to add a traveler.
