# Product charter: Crestline Flight Credits and Travel Vouchers (category key: credit).
# Policy constants live only here; the runtime never reads this file.
category: credit
display_name: Crestline Flight Credits and Travel Vouchers
binding:
  holding_table: credit_holdings
  event_tables:
  - credit_ledger
  status_field: status
  variant_field: variant_name
  quantity_fields:
    remaining_value: credit_balance
lifecycle:
  states:
  - issued
  - active
  - depleted
  - expired
  - refunded
  - voided
  transitions:
  - from: issued
    to: active
    by: system
    means: A credit whose activation_mode is automatic becomes usable as soon as its value is loaded.
  - from: issued
    to: active
    by: user
    means: The passenger accepts a voucher whose activation_mode is passenger_acceptance in place of cash.
  - from: issued
    to: voided
    by: agent
    means: A voucher not accepted is withdrawn
    or a credit issued in error is cancelled before use.: null
  - from: active
    to: depleted
    by: system
    means: The remaining value reached zero through redemptions or a forfeited remainder.
  - from: depleted
    to: active
    by: system
    means: A reversed redemption restored value to a depleted credit.
  - from: active
    to: expired
    by: system
    means: The credit passed the end of its expiry_date with value remaining.
  - from: expired
    to: active
    by: agent
    means: An expired credit is reinstated within the reinstatement window.
  - from: active
    to: refunded
    by: agent
    means: The remaining value is paid out in cash under the refund rule.
accounts:
- key: credit_balance
  unit: USD
  meaning: Unused value on the credit; loads, reversals and reinstatements increase it, redemptions, forfeited remainders,
    expiry write-offs and refunds reduce it.
- key: credit_fees
  unit: USD
  meaning: Service fees paid in connection with the credit (extension, reinstatement and telephone redemption fees)
    less fees refunded.
parameter_schema:
  validity_months: Calendar months of validity counted from the expiry anchor (integer, months)
  expiry_anchor: 'Date the validity is counted from (enum: original_ticket_issue | credit_issue)'
  travel_completion_required_by_expiry: Whether travel on a ticket paid with the credit must also begin by the expiry_date,
    rather than only the booking (boolean)
  beneficiary_scope: 'Who may travel on a ticket paid with the credit (enum: named_traveler_only | holder_reservation
    | anyone)'
  max_beneficiaries_per_credit: Most distinct passengers who may be ticketed with value from one credit (integer,
    passengers)
  remaining_balance_on_partial_use: 'Treatment of value left after a redemption smaller than the balance (enum:
    forfeit | retain)'
  combinable_with_other_credits: Whether the credit may be applied to a ticket together with other credits (boolean)
  usable_for_taxes: Whether the credit may pay government taxes and fees on a ticket, not only the base fare (boolean)
  usable_for_seat_and_upgrade_fees: Whether the credit may pay seat fees and paid upgrades (boolean)
  usable_for_bag_fees: Whether the credit may pay checked bag fees (boolean)
  usable_on_partner_flights: Whether the credit may pay for tickets on partner-operated flights sold under a partner's
    code (boolean)
  combinable_with_miles_payment: Whether the credit may be combined with an award or miles-plus-cash ticket (boolean)
  usable_for_companion_ticket: Whether the credit may pay the companion fare and taxes of a companion ticket (boolean)
  online_redemption_permitted: Whether the credit can be redeemed on the website or app (boolean)
  phone_redemption_fee: Ticketing service charge when the credit is redeemed through the reservations call center
    (USD)
  extension_permitted: Whether the expiry_date may be extended before it passes (boolean)
  extension_months: Calendar months added to the expiry_date by one extension (integer, months)
  extension_fee: Fee per extension (USD)
  max_extensions: Most extensions one credit may receive (integer, count)
  extension_request_window_days_before_expiry: Calendar days before the expiry_date at which extension requests
    are first accepted (integer, calendar days)
  reinstatement_permitted: Whether an expired credit may be reinstated (boolean)
  reinstatement_window_days_after_expiry: Calendar days after the expiry_date during which reinstatement may be
    requested (integer, calendar days)
  reinstatement_fee: Fee per reinstatement (USD)
  reinstated_validity_months: Calendar months of validity from the reinstatement date (integer, months)
  max_reinstatements: Most reinstatements one credit may receive (integer, count)
  activation_mode: 'How the issued credit becomes usable (enum: automatic | passenger_acceptance)'
  acceptance_window_days: Calendar days after issue within which the passenger must accept the voucher; 0 where
    acceptance is not needed (integer, calendar days)
  cash_conversion_permitted: Whether an accepted voucher may later be exchanged for cash (boolean)
  cash_conversion_window_days: Calendar days after issue within which a cash exchange may be requested (integer,
    calendar days)
  cash_conversion_value_percent: Cash paid on a cash exchange, as a percent of the remaining value (integer, percent)
  involuntary_origin_refundable: Whether a credit issued for a Crestline-cancelled flight or in place of a refund
    may be refunded in cash on request (boolean)
  refund_processing_business_days: Business days within which a cash refund of credit value is processed (integer,
    business days)
  minimum_face_value_usd: Smallest value for which the credit is issued; smaller amounts are not issued (USD)
  face_value_rounding: 'Rounding of the face value at issue (enum: cent | whole_dollar, whole_dollar rounding half
    up)'
  sr_amount_inoperative_seat: Service-recovery value for an inoperative seat recline, tray or power outlet on a
    flown segment (USD)
  sr_amount_entertainment_failure: Service-recovery value for a failed seatback or streaming entertainment system
    on a flown segment (USD)
  sr_amount_wifi_failure: Service-recovery value for purchased Wi-Fi that did not work (USD)
  sr_amount_cabin_cleanliness: Service-recovery value for a documented cabin cleanliness failure (USD)
  sr_amount_crew_conduct: Service-recovery value for a substantiated crew or agent conduct complaint (USD)
  sr_amount_catering_unavailable: Service-recovery value for a pre-selected premium meal that was not boarded (USD)
  sr_elite_uplift_percent: Increase of the service-recovery value for Summit Platinum, Summit Diamond and Summit
    Chairman members (integer, percent)
  sr_agent_authority_cap_usd: Highest service-recovery value a support agent may issue on one case (USD)
  sr_max_per_12_months: Most service-recovery certificates one customer may receive within the window of credit_msr_service_recovery_in_last_12_months
    (integer, count)
  reissue_keeps_original_expiry: Whether value returned from a refunded or cancelled ticket paid with this credit
    is re-issued with the original expiry_date (boolean)
  choose_credit_bonus_percent: Bonus value added when a customer entitled to a refund chooses this credit instead
    (integer, percent of the refundable amount)
  choose_credit_bonus_cap_usd: Largest bonus added under choose_credit_bonus_percent (USD)
  corporate_origin_redemption_restricted: Whether a credit from a ticket booked under a corporate agreement may
    be redeemed only on bookings under the same agreement (boolean)
  credit_name_correction_max_characters: Most characters of the traveler name on the credit that may be corrected
    (integer, characters)
