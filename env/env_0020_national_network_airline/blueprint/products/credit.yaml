- id: credit_refunds
  subject:
  - credit_refund
  - credit_refund_payout
  rule: 'Credit value is paid out in cash in two situations only. First, a credit whose issue_reason is involuntary_cancellation
    or refund_alternative is refunded in full to the original form of payment on request when involuntary_origin_refundable
    is true, because the customer was entitled to a refund when the credit was issued; the payout equals the remaining_value,
    and any choose-credit bonus included in it is removed first. Second, an accepted voucher whose cash_conversion_permitted
    is true may be exchanged for cash within the cash-exchange window, and the cash paid is cash_conversion_value_percent
    percent of the remaining_value, rounded to the cent. A cash exchange must be requested no later than cash_conversion_window_days
    calendar days after the voucher was issued. The cash-exchange window is counted in calendar days from the issue_date,
    and a request on the last day is accepted. A refund payout is booked only on a credit whose status is refunded.
    Cash refunds are processed within refund_processing_business_days business days. Every other credit is non-refundable:
    a partly used credit is refunded only for its remaining_value, and a voluntary-cancellation or residual credit
    is never paid out in cash.'
  eligibility:
  - id: cash_exchange_window
    applies_to:
    - credit_refund
    kind: time
    condition: A cash exchange must be requested no later than cash_conversion_window_days calendar days after the
      voucher was issued.
    evidence_fields:
    - credit_holdings.credit_id
    - credit_holdings.issue_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - credit_holdings.credit_id
      action_bindings:
        credit_holdings.credit_id: credit_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the voucher was issued
      anchor_source: credit_holdings.issue_date
      relation: not_after
      duration_source: variants.cash_conversion_window_days
      unit: calendar_days
      counting_rule: The cash-exchange window is counted in calendar days from the issue_date, and a request on
        the last day is accepted.
      boundary: inclusive
  - id: payout_after_refund
    applies_to:
    - credit_refund_payout
    kind: state
    condition: A refund payout is booked only on a credit whose status is refunded.
    evidence_fields:
    - credit_holdings.credit_id
    - credit_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - credit_holdings.credit_id
      action_bindings:
        credit_holdings.credit_id: credit_id
    state_contract:
      field: credit_holdings.status
      allowed:
      - refunded
  params:
    per_tier:
      Crestline Residual Travel Credit:
        involuntary_origin_refundable: =involuntary_origin_refundable
        cash_conversion_permitted: =cash_conversion_permitted
        cash_conversion_window_days: =cash_conversion_window_days
        cash_conversion_value_percent: =cash_conversion_value_percent
        refund_processing_business_days: =refund_processing_business_days
      Crestline Flight Credit:
        involuntary_origin_refundable: =involuntary_origin_refundable
        cash_conversion_permitted: =cash_conversion_permitted
        cash_conversion_window_days: =cash_conversion_window_days
        cash_conversion_value_percent: =cash_conversion_value_percent
        refund_processing_business_days: =refund_processing_business_days
      Crestline Trip Credit:
        involuntary_origin_refundable: =involuntary_origin_refundable
        cash_conversion_permitted: =cash_conversion_permitted
        cash_conversion_window_days: =cash_conversion_window_days
        cash_conversion_value_percent: =cash_conversion_value_percent
        refund_processing_business_days: =refund_processing_business_days
      Crestline Service Recovery eCertificate:
        involuntary_origin_refundable: =involuntary_origin_refundable
        cash_conversion_permitted: =cash_conversion_permitted
        cash_conversion_window_days: =cash_conversion_window_days
        cash_conversion_value_percent: =cash_conversion_value_percent
        refund_processing_business_days: =refund_processing_business_days
      Crestline Disruption Voucher:
        involuntary_origin_refundable: =involuntary_origin_refundable
        cash_conversion_permitted: =cash_conversion_permitted
        cash_conversion_window_days: =cash_conversion_window_days
        cash_conversion_value_percent: =cash_conversion_value_percent
        refund_processing_business_days: =refund_processing_business_days
      Crestline Denied Boarding Voucher:
        involuntary_origin_refundable: =involuntary_origin_refundable
        cash_conversion_permitted: =cash_conversion_permitted
        cash_conversion_window_days: =cash_conversion_window_days
        cash_conversion_value_percent: =cash_conversion_value_percent
        refund_processing_business_days: =refund_processing_business_days
  formula:
    dbc_cash_paid: round(remaining_value * cash_conversion_value_percent / 100, 2)
- id: credit_service_recovery
  subject:
  - credit_issue
  rule: 'A Crestline Service Recovery eCertificate compensates one documented service failure on a flown segment
    of the customer''s own ticket, and its value is the amount for the service_recovery_reason: sr_amount_inoperative_seat,
    sr_amount_entertainment_failure, sr_amount_wifi_failure, sr_amount_cabin_cleanliness, sr_amount_crew_conduct
    or sr_amount_catering_unavailable. For a customer whose Summit tier is Summit Platinum, Summit Diamond or Summit
    Chairman the value is increased by sr_elite_uplift_percent percent before rounding. A customer receives at most
    sr_max_per_12_months service-recovery certificates as counted by credit_msr_service_recovery_in_last_12_months.
    A certificate is issued only for a segment the customer actually flew, shown by a coupon-flown entry on the
    source ticket. One service failure on one segment earns one certificate; several failures on the same segment
    earn only the single highest amount. A value above sr_agent_authority_cap_usd, or a failure outside the listed
    reasons, is beyond support-agent authority and is transferred to a human representative as a request no policy
    covers. Irregular-operations delays and cancellations are never service-recovery reasons; they are compensated
    under the ticket charter.'
  eligibility:
  - id: sr_cap
    applies_to:
    - credit_issue
    kind: authorization
    condition: A customer receives at most sr_max_per_12_months service-recovery certificates as counted by credit_msr_service_recovery_in_last_12_months.
    evidence_fields:
    - credit_holdings.customer_id
    - credit_holdings.issue_reason
    - credit_holdings.issue_date
    - credit_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - credit_holdings.customer_id
      action_bindings:
        credit_holdings.customer_id: customer_id
  - id: flown_segment
    applies_to:
    - credit_issue
    kind: authorization
    condition: A certificate is issued only for a segment the customer actually flew, shown by a coupon-flown entry
      on the source ticket.
    evidence_fields:
