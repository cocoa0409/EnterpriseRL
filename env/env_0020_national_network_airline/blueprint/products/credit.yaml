- id: credit_redemption_reversal_rule
  subject:
  - credit_redemption_reversal
  - credit_restore
  rule: When a ticket paid with credit value is voided inside the ticket's risk-free window, the value of each redemption
    on that ticket returns to the credit it came from, in one reversal entry per redemption, and keeps that credit's
    expiry_date. A redemption is reversed only when the ticket it paid for has status voided. Each redemption can
    be reversed at most once. A reversal that gives a depleted credit value again makes it active; a remainder that
    was forfeited under the single-use rule is not restored by the reversal. A ticket paid with credit that is refunded
    or cancelled for credit after the risk-free window does not reverse the redemption; its value comes back as
    a new credit under the credit_redeposit rule instead.
  eligibility:
  - id: reversal_on_void
    applies_to:
    - credit_redemption_reversal
    kind: state
    condition: A redemption is reversed only when the ticket it paid for has status voided.
    evidence_fields:
    - ticket_holdings.ticket_id
    - ticket_holdings.status
    - ticket_holdings.ticket_number
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - ticket_holdings.ticket_number
      action_bindings:
        ticket_holdings.ticket_number: applied_ticket_number
    state_contract:
      field: ticket_holdings.status
      allowed:
      - voided
  - id: one_reversal
    applies_to:
    - credit_redemption_reversal
    kind: dedup
    condition: Each redemption can be reversed at most once.
    evidence_fields:
    - credit_ledger.credit_entry_id
    - credit_ledger.reversed_entry_id
    - credit_ledger.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - credit_ledger.credit_entry_id
      action_bindings:
        credit_ledger.credit_entry_id: reversed_entry_id
    dedup_contract:
      table: credit_ledger
      mode: separate_record
      object_bindings:
        reversed_entry_id: reversed_entry_id
      duplicate_filters:
        event_type:
        - credit_redemption_reversal
      distinct_fields: []
- id: credit_expiry
  subject:
  - credit_expire
  - credit_expiry_writeoff
  rule: A credit that is still active at the end of its expiry_date expires on the following calendar day, and its
    entire remaining_value is written off in one write-off entry. An expiry write-off is booked only on a credit
    whose status is expired. A depleted, refunded or voided credit never expires, and an issued voucher awaiting
    acceptance is voided rather than expired. Travel already ticketed with the credit's value is unaffected by the
    credit's later expiry. After expiry the only way back to the value is reinstatement under the reinstatement
    rule; there is no automatic grace period.
  eligibility:
  - id: writeoff_after_expire
    applies_to:
    - credit_expiry_writeoff
    kind: state
    condition: An expiry write-off is booked only on a credit whose status is expired.
    evidence_fields:
    - credit_holdings.credit_id
    - credit_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - credit_holdings.credit_id
      action_bindings:
        credit_holdings.credit_id: credit_id
    state_contract:
      field: credit_holdings.status
      allowed:
      - expired
  params:
    per_tier:
      Crestline Residual Travel Credit:
        validity_months: =validity_months
      Crestline Flight Credit:
        validity_months: =validity_months
      Crestline Trip Credit:
        validity_months: =validity_months
      Crestline Service Recovery eCertificate:
        validity_months: =validity_months
      Crestline Disruption Voucher:
        validity_months: =validity_months
      Crestline Denied Boarding Voucher:
        validity_months: =validity_months
- id: credit_extension
  subject:
  - credit_extend
  - credit_service_fee
  rule: An active credit's expiry_date may be extended by extension_months calendar months when extension_permitted
    is true and the credit's extension_count is below max_extensions. An extension can be requested no earlier than
    extension_request_window_days_before_expiry calendar days before the credit's expiry date as recorded on the
    credit. The window opens that many calendar days before the expiry_date, a request on the opening day is accepted,
    and the request must be made on or before the expiry_date itself; an expired credit is handled by reinstatement
    instead. The new expiry_date is the old expiry_date plus extension_months calendar months, keeping the day-of-month
    and falling back to the last day of the month when that day does not exist, and extension_count increases by
    one. The extension_fee is charged as a separate fee entry at the time of the extension, and is waived when the
    customer's Summit tier has credit_service_fees_waived set to true in the loyalty charter; a waived fee is not
    recorded. A credit fee entry is charged only on a credit whose status is active or expired. An extension never
    changes the face value, the traveler_name or the beneficiary_scope.
  eligibility:
  - id: extension_window
    applies_to:
    - credit_extend
    kind: time
    condition: An extension can be requested no earlier than extension_request_window_days_before_expiry calendar
      days before the credit's expiry date as recorded on the credit.
    evidence_fields:
    - credit_holdings.credit_id
    - credit_holdings.expiry_date
    - credit_holdings.extension_count
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - credit_holdings.credit_id
      action_bindings:
        credit_holdings.credit_id: credit_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the credit's expiry date as recorded on the credit
      anchor_source: credit_holdings.expiry_date
      relation: not_before
      duration_source: variants.extension_request_window_days_before_expiry
      unit: calendar_days
      counting_rule: The window opens that many calendar days before the expiry_date, a request on the opening day
        is accepted, and the request must be made on or before the expiry_date itself
      boundary: inclusive
  - id: fee_on_live_credit
    applies_to:
    - credit_service_fee
    kind: state
    condition: A credit fee entry is charged only on a credit whose status is active or expired.
    evidence_fields:
    - credit_holdings.credit_id
    - credit_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - credit_holdings.credit_id
      action_bindings:
        credit_holdings.credit_id: credit_id
    state_contract:
      field: credit_holdings.status
      allowed:
      - active
      - expired
  params:
    per_tier:
      Crestline Residual Travel Credit:
        extension_permitted: =extension_permitted
        extension_months: =extension_months
        extension_fee: =extension_fee
        max_extensions: =max_extensions
        extension_request_window_days_before_expiry: =extension_request_window_days_before_expiry
      Crestline Flight Credit:
        extension_permitted: =extension_permitted
        extension_months: =extension_months
        extension_fee: =extension_fee
        max_extensions: =max_extensions
        extension_request_window_days_before_expiry: =extension_request_window_days_before_expiry
      Crestline Trip Credit:
        extension_permitted: =extension_permitted
        extension_months: =extension_months
        extension_fee: =extension_fee
        max_extensions: =max_extensions
        extension_request_window_days_before_expiry: =extension_request_window_days_before_expiry
      Crestline Service Recovery eCertificate:
        extension_permitted: =extension_permitted
        extension_months: =extension_months
        extension_fee: =extension_fee
        max_extensions: =max_extensions
        extension_request_window_days_before_expiry: =extension_request_window_days_before_expiry
      Crestline Disruption Voucher:
        extension_permitted: =extension_permitted
        extension_months: =extension_months
        extension_fee: =extension_fee
        max_extensions: =max_extensions
        extension_request_window_days_before_expiry: =extension_request_window_days_before_expiry
      Crestline Denied Boarding Voucher:
        extension_permitted: =extension_permitted
        extension_months: =extension_months
        extension_fee: =extension_fee
        max_extensions: =max_extensions
        extension_request_window_days_before_expiry: =extension_request_window_days_before_expiry
- id: credit_reinstatement
  subject:
  - credit_reinstate
  - credit_reinstatement_restore
  - credit_service_fee
  rule: An expired credit may be reinstated when reinstatement_permitted is true and its reinstatement_count is
    below max_reinstatements. A reinstatement must be requested no later than reinstatement_window_days_after_expiry
    calendar days after the credit's expiry date as recorded on the credit. The window is counted in calendar days
    from the day after the expiry_date, and a request on the last day of the window is accepted. Reinstatement restores
    exactly the value written off at expiry in one restore entry, sets the new expiry_date to the reinstatement
    date plus reinstated_validity_months calendar months with the same month-end fallback as issuance, and increases
    reinstatement_count by one. A restore entry is booked only on a credit whose status is active. The reinstatement_fee
    is charged as a separate fee entry before the credit is reinstated and is waived when the customer's Summit
    tier has credit_service_fees_waived set to true in the loyalty charter; a waived fee is not recorded. A credit
    whose instrument does not permit reinstatement, or whose window has passed, cannot be revived, and the value
    is lost.
  eligibility:
  - id: reinstatement_window
    applies_to:
    - credit_reinstate
    kind: time
    condition: A reinstatement must be requested no later than reinstatement_window_days_after_expiry calendar days
      after the credit's expiry date as recorded on the credit.
