- id: credit_choose_credit_bonus
  subject:
  - credit_issue
  - credit_value_load
  rule: A customer who is entitled to a cash refund of a ticket — a refundable fare brand cancelled voluntarily
    or an involuntary refund under the ticket charter — may choose a Crestline Trip Credit instead, with issue_reason
    refund_alternative. The Trip Credit's face value is the refundable amount plus a bonus of choose_credit_bonus_percent
    percent of that amount, the bonus capped at choose_credit_bonus_cap_usd. The choice is the customer's alone
    and is made before the refund is paid; once a refund payout exists for the ticket the Trip Credit is no longer
    available. A customer who is not entitled to a refund receives a Crestline Flight Credit under the cancellation
    rule and never a bonus.
  eligibility:
  - id: refund_not_yet_paid
    applies_to:
    - credit_issue
    kind: dedup
    condition: once a refund payout exists for the ticket the Trip Credit is no longer available
    evidence_fields:
    - ticket_transactions.ticket_id
    - ticket_transactions.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - ticket_transactions.ticket_id
      action_bindings:
        ticket_transactions.ticket_id: source_ticket_id
    dedup_contract:
      table: ticket_transactions
      mode: separate_record
      object_bindings:
        ticket_id: source_ticket_id
      duplicate_filters:
        event_type:
        - ticket_refund_payout
      distinct_fields: []
  - id: customer_chooses_credit
    applies_to:
    - credit_issue
    kind: caller_fact
    condition: The choice is the customer's alone and is made before the refund is paid
    evidence_fields:
    - ticket_holdings.ticket_id
    evidence_contract:
      authority: caller_statement
      timing: pre_action
      correlation_keys:
      - - ticket_holdings.ticket_id
      action_bindings:
        ticket_holdings.ticket_id: source_ticket_id
  params:
    per_tier:
      Crestline Residual Travel Credit:
        choose_credit_bonus_percent: =choose_credit_bonus_percent
        choose_credit_bonus_cap_usd: =choose_credit_bonus_cap_usd
      Crestline Flight Credit:
        choose_credit_bonus_percent: =choose_credit_bonus_percent
        choose_credit_bonus_cap_usd: =choose_credit_bonus_cap_usd
      Crestline Trip Credit:
        choose_credit_bonus_percent: =choose_credit_bonus_percent
        choose_credit_bonus_cap_usd: =choose_credit_bonus_cap_usd
      Crestline Service Recovery eCertificate:
        choose_credit_bonus_percent: =choose_credit_bonus_percent
        choose_credit_bonus_cap_usd: =choose_credit_bonus_cap_usd
      Crestline Disruption Voucher:
        choose_credit_bonus_percent: =choose_credit_bonus_percent
        choose_credit_bonus_cap_usd: =choose_credit_bonus_cap_usd
      Crestline Denied Boarding Voucher:
