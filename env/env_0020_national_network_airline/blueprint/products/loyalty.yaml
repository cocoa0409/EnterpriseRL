  rule: 'Each Summit tier carries travel benefits that the other charters apply to the member''s own tickets and
    credits: elite_free_checked_bags checked bags per direction, complimentary preferred seating when complimentary_preferred_seating
    is true, complimentary extra-legroom seating when complimentary_extra_legroom_seating is true, a waived same-day
    change fee when same_day_change_fee_waived is true, and waived credit extension, reinstatement and telephone
    redemption fees when credit_service_fees_waived is true. A benefit follows the tier held on the date the fee
    would be charged — the check-in date for a bag, the purchase date for a seat or same-day change, and the date
    of the extension, reinstatement or redemption for a credit fee — so a tier change applies to charges made from
    the day of the change onward and never refunds a fee charged before it. The benefits cover the member only,
    never other passengers on the same reservation, and require the member''s Summit number to be on the ticket.
    A membership in dormant or closed status carries no travel benefits.'
