  - loyalty_bonus_credit
  rule: 'A member at Summit Platinum, Summit Diamond or Summit Chairman earns choice_benefits_count selections for
    each qualification year in which that tier was earned, and makes them one at a time. The selections already
    made for a qualification year are counted by loyalty_msr_choice_selections_for_year, and a new selection is
    accepted only while that count is below choice_benefits_count of the tier held. Each selection is one of: upgrade_certificates,
    which issues choice_upgrade_certificates_per_selection Summit Upgrade Certificates expiring certificate_validity_months
    calendar months after issue; bonus_miles, which credits choice_bonus_miles_per_selection miles; companion_certificate,
    available only when choice_companion_certificate_available is true, which issues one companion certificate under
    the companion charter; or club_membership, available only when choice_club_membership_available is true, which
    enrolls the member in a one-year Summit Club Individual membership under the club charter. A selection is final
    once made and cannot be exchanged for another option; unmade selections lapse at the end of the tier_valid_through
    date of the tier that earned them. Choice-benefit bonus miles do not count as qualifying activity.'
