    miles_reinstatement_window_days: 180
    reinstatement_fee_ladder:
    - from_miles: 1
      to_miles: 30000
      fee_usd: 150
    - from_miles: 30001
      to_miles: 75000
      fee_usd: 250
    - from_miles: 75001
      to_miles: 999999999
      fee_usd: 400
    transfer_increment_miles: 1000
    min_transfer_miles: 1000
    transfer_fee_per_1000_miles_usd: 0
    transfer_processing_fee_usd: 0
    max_transfer_out_per_calendar_year: 200000
    purchase_increment_miles: 1000
