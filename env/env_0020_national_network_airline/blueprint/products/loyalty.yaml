events:
- type: loyalty_enroll
  target: loyalty_holdings
  mutation: create
  meaning: An individual customer opens a Summit membership.
  grain: One row per membership.
  fields:
    variant_name: always Summit Member at enrollment
    summit_number: number assigned
    enrolled_date: date opened
    tier_basis: base
    mile_balance: opens at zero
    qualifying_dollars_ytd: opens at zero
    upgrade_certificate_balance: opens at zero
  triggers: []
- type: loyalty_activate
  target: loyalty_holdings
  mutation:
    transition:
      from: enrolled
      to: active
  meaning: The first activity posts to a new membership.
  grain: One per membership.
  fields:
    last_activity_date: date of the first activity
  triggers: []
- type: loyalty_flight_accrual
  target: loyalty_activity
  meaning: Award miles are credited for a flown Crestline coupon.
  grain: One entry per flown segment credited.
  distinguish_by:
  - source_ticket_id
  - segment_number
  fields:
    activity_date: posting date
    miles: award miles credited
    source_ticket_id: ticket flown
    segment_number: segment flown
    flight_number: flight
    flight_date: flight date
    eligible_fare_usd: segment base fare
  account: award_miles
  direction: in
  triggers:
  - event: loyalty:loyalty_mqd_accrual
    map:
      source_ticket_id: source_ticket_id
      segment_number: segment_number
      flight_date: flight_date
      activity_date: activity_date
- type: loyalty_mqd_accrual
  target: loyalty_activity
  meaning: Qualifying dollars are credited for a flown Crestline coupon.
  grain: One entry per flown segment credited.
  distinguish_by:
  - source_ticket_id
  - segment_number
  fields:
    activity_date: posting date
    qualifying_dollars: qualifying dollars credited
    source_ticket_id: ticket flown
    segment_number: segment flown
    flight_date: flight date
  account: qualifying_dollars
  direction: in
  triggers: []
- type: loyalty_retro_credit
  target: loyalty_activity
  meaning: A Crestline flight missing from the account is credited after the member's claim.
  grain: One entry per claimed segment.
  distinguish_by:
  - source_ticket_id
  - segment_number
  fields:
    activity_date: posting date
    miles: award miles credited
    source_ticket_id: ticket flown
    segment_number: segment flown
    flight_number: flight
    flight_date: flight date
    eligible_fare_usd: segment base fare
  account: award_miles
  direction: in
  triggers:
  - event: loyalty:loyalty_mqd_accrual
    map:
      source_ticket_id: source_ticket_id
      segment_number: segment_number
      flight_date: flight_date
      activity_date: activity_date
- type: loyalty_partner_accrual
  target: loyalty_activity
  meaning: Miles earned with a partner airline, hotel, car rental, card or dining partner are credited.
  grain: One entry per partner transaction.
  distinguish_by:
  - partner_code
  - partner_reference
  fields:
    activity_date: posting date
    miles: miles credited including any elite bonus
    partner_code: kind of partner
    partner_reference: partner transaction number
  account: award_miles
  direction: in
  triggers: []
- type: loyalty_goodwill_credit
  target: loyalty_activity
  meaning: Goodwill miles computed under the ticket charter for a disruption are credited.
  grain: One entry per disrupted ticket compensated in miles.
  distinguish_by:
  - source_ticket_id
  - activity_date
  fields:
    activity_date: posting date
    miles: goodwill miles
    source_ticket_id: disrupted ticket
  account: award_miles
  direction: in
  triggers: []
- type: loyalty_bonus_credit
  target: loyalty_activity
  meaning: Bonus miles from a choice-benefit selection or a published promotion are credited.
  grain: One entry per bonus award.
  distinguish_by:
  - bonus_reason
  - choice_year
  - activity_date
  fields:
    activity_date: posting date
    miles: bonus miles
    bonus_reason: ground of bonus
    choice_year: qualification year of a choice bonus
  account: award_miles
  direction: in
  triggers: []
- type: loyalty_miles_purchase
  target: loyalty_activity
  meaning: The member buys award miles.
  grain: One entry per purchase.
  distinguish_by:
  - activity_date
  - miles
  fields:
    activity_date: purchase date
    miles: miles bought
    purchase_amount_usd: price paid
  account: award_miles
  direction: in
  triggers: []
- type: loyalty_award_redemption
  target: loyalty_activity
  meaning: Miles are redeemed for an award ticket or a miles upgrade.
  grain: One entry per award ticket or upgraded segment.
  distinguish_by:
  - award_ticket_number
  - source_ticket_id
  - segment_number
  fields:
    activity_date: redemption date
    miles: miles redeemed
    award_ticket_number: award ticket issued
    award_zone: chart zone
    award_cabin: cabin
    award_type: price level
    fee_usd: close-in, telephone or upgrade co-pay fee
    source_ticket_id: ticket upgraded with miles
    segment_number: segment upgraded with miles
  account: award_miles
  direction: out
  triggers:
  - event: ticket:ticket_book
    when:
      award_type:
      - saver
      - standard
    map: {}
- type: loyalty_award_redeposit
  target: loyalty_activity
  meaning: An award ticket is cancelled and its miles are returned to the account.
  grain: One entry per award ticket cancelled.
  distinguish_by:
  - reversed_activity_id
  fields:
    activity_date: redeposit date
    miles: miles returned
    reversed_activity_id: redemption returned
    award_ticket_number: award ticket cancelled
    fee_usd: redeposit fee
  account: award_miles
  direction: in
  triggers: []
- type: loyalty_accrual_reversal
  target: loyalty_activity
  meaning: Miles posted in error (duplicate posting or posting to the wrong member) are reversed.
  grain: One entry per reversed posting.
  distinguish_by:
  - reversed_activity_id
  fields:
    activity_date: reversal date
    miles: miles removed
    reversed_activity_id: posting reversed
  account: award_miles
  direction: out
  triggers: []
- type: loyalty_miles_expiry
  target: loyalty_activity
  meaning: The whole mile balance is forfeited through inactivity or account closure.
  grain: One entry per forfeiture.
  distinguish_by:
  - forfeit_reason
  - activity_date
  fields:
    activity_date: forfeiture date
    miles: miles forfeited
    forfeit_reason: ground
  account: award_miles
  direction: out
  triggers: []
- type: loyalty_miles_reinstatement
  target: loyalty_activity
  meaning: Miles forfeited through inactivity are reinstated for a fee.
  grain: One entry per reinstated forfeiture.
  distinguish_by:
  - reversed_activity_id
  fields:
    activity_date: reinstatement date
    miles: miles reinstated
    reversed_activity_id: forfeiture reinstated
    fee_usd: reinstatement fee
  account: award_miles
  direction: in
  triggers: []
- type: loyalty_miles_transfer_out
  target: loyalty_activity
  meaning: The member transfers miles to another Summit member.
  grain: One entry per transfer sent.
  distinguish_by:
  - counterpart_summit_number
  - activity_date
  fields:
    activity_date: transfer date
    miles: miles sent
    counterpart_summit_number: recipient
    fee_usd: transfer fees charged to the sender
  account: award_miles
  direction: out
  triggers:
  - event: loyalty:loyalty_miles_transfer_in
    map:
      miles: miles
      activity_date: activity_date
- type: loyalty_miles_transfer_in
  target: loyalty_activity
  meaning: Miles transferred by another Summit member arrive.
  grain: One entry per transfer received.
  distinguish_by:
  - counterpart_summit_number
  - activity_date
  fields:
    activity_date: transfer date
    miles: miles received
    counterpart_summit_number: sender
  account: award_miles
  direction: in
  triggers: []
- type: loyalty_mqd_reset
  target: loyalty_activity
  meaning: Qualifying dollars are reset to zero at the end of the calendar year after requalification.
  grain: One entry per membership per year end.
  distinguish_by:
  - activity_date
  fields:
    activity_date: first day of the new year
    qualifying_dollars: qualifying dollars removed
  account: qualifying_dollars
  direction: out
  triggers: []
- type: loyalty_tier_change
  target: loyalty_holdings
  mutation: update
  meaning: The member's tier changes through qualification, requalification, a status challenge or an invitation.
  grain: One row per membership (the membership record itself).
  fields:
    variant_name: new tier
    tier_basis: how the tier was obtained
    tier_valid_through: last valid day
    challenge_end_date: challenge end when granted by challenge
  triggers: []
- type: loyalty_choice_benefit_select
  target: loyalty_activity
  meaning: A Summit Platinum, Summit Diamond or Summit Chairman member makes one choice-benefit selection.
  grain: One entry per selection.
  distinguish_by:
  - choice_year
  - choice_benefit
  - activity_date
  fields:
    activity_date: selection date
    choice_benefit: option chosen
    choice_year: qualification year
  triggers:
  - event: loyalty:loyalty_certificate_issue
    when:
      choice_benefit: upgrade_certificates
    map:
      choice_year: choice_year
      activity_date: activity_date
  - event: loyalty:loyalty_bonus_credit
    when:
      choice_benefit: bonus_miles
    map:
      choice_year: choice_year
      activity_date: activity_date
      bonus_reason: choice_benefit
  - event: companion:companion_issue
    when:
      choice_benefit: companion_certificate
    map:
      issue_date: activity_date
      issue_source: elite_choice_benefit
  - event: club:club_enroll
    when:
      choice_benefit: club_membership
    map:
      start_date: activity_date
      variant_name: Summit Club Individual
      enrollment_source: elite_choice_benefit
- type: loyalty_certificate_issue
  target: loyalty_activity
  meaning: Upgrade certificates are issued for a choice selection.
  grain: One entry per choice selection of certificates.
  distinguish_by:
  - choice_year
  - activity_date
  fields:
    activity_date: issue date
    certificate_count: certificates issued
    certificate_expiry_date: expiry of this batch
    choice_year: qualification year
  account: upgrade_certificates
  direction: in
  triggers: []
- type: loyalty_certificate_redeem
  target: loyalty_activity
  meaning: Upgrade certificates are consumed by a cleared certificate upgrade.
  grain: One entry per upgraded segment.
  distinguish_by:
  - source_ticket_id
  - segment_number
  fields:
    activity_date: clearance date
    certificate_count: certificates consumed
    source_ticket_id: ticket upgraded
    segment_number: segment upgraded
  account: upgrade_certificates
  direction: out
  triggers: []
- type: loyalty_certificate_expiry
  target: loyalty_activity
  meaning: Unused upgrade certificates of one batch expire.
  grain: One entry per expiring batch.
  distinguish_by:
  - certificate_expiry_date
  fields:
    activity_date: day after the batch expiry
    certificate_count: certificates expired
    certificate_expiry_date: expiry of the batch
  account: upgrade_certificates
  direction: out
  triggers: []
- type: loyalty_upgrade_request
  target: loyalty_upgrades
  meaning: The member waitlists a segment for a complimentary, certificate or miles upgrade.
  grain: One entry per segment waitlisted.
  distinguish_by:
  - source_ticket_id
  - segment_number
  fields:
    request_date: date waitlisted
    source_ticket_id: ticket
    segment_number: segment
    segment_miles: segment distance
    upgrade_method: method
    target_cabin: cabin requested
  triggers: []
- type: loyalty_upgrade_clear
  target: loyalty_upgrades
  meaning: A waitlisted upgrade clears and the member is confirmed in the higher cabin.
  grain: One entry per request cleared.
  distinguish_by:
  - source_request_id
  fields:
    request_date: clearance date
    source_request_id: request fulfilled
    source_ticket_id: ticket
    segment_number: segment
    upgrade_method: method
    target_cabin: cabin confirmed
    miles_used: miles charged
    certificates_used: certificates consumed
    copay_usd: co-pay charged
  triggers:
  - event: loyalty:loyalty_certificate_redeem
    when:
      upgrade_method: certificate
    map:
      certificate_count: certificates_used
      source_ticket_id: source_ticket_id
      segment_number: segment_number
      activity_date: request_date
  - event: loyalty:loyalty_award_redemption
    when:
      upgrade_method: miles
    map:
      miles: miles_used
      fee_usd: copay_usd
      source_ticket_id: source_ticket_id
      segment_number: segment_number
      activity_date: request_date
      award_type: upgrade
- type: loyalty_go_dormant
  target: loyalty_holdings
  mutation:
    transition:
      from: active
      to: dormant
  meaning: The membership passed the inactivity period.
  grain: One per dormancy.
  fields:
    last_activity_date: unchanged date of the latest activity
  triggers:
  - event: loyalty:loyalty_miles_expiry
    map:
      forfeit_reason: inactivity
- type: loyalty_reactivate
  target: loyalty_holdings
  mutation:
    transition:
      from: dormant
      to: active
  meaning: New qualifying activity makes a dormant membership active again.
  grain: One per reactivation.
  fields:
    last_activity_date: date of the new activity
  triggers: []
- type: loyalty_close
  target: loyalty_holdings
  mutation:
    transition:
    - from: enrolled
      to: closed
    - from: active
      to: closed
    - from: dormant
      to: closed
  meaning: The member closes the membership.
  grain: One per membership.
  fields:
    closed_date: date closed
  triggers:
  - event: loyalty:loyalty_miles_expiry
    map:
      forfeit_reason: account_closure
      activity_date: closed_date
  - event: companion:companion_revoke
    map:
      revocation_reason: membership_closed
      closed_date: closed_date
measures:
- id: loyalty_msr_months_since_last_activity
  window: From last_activity_date on the membership to the handling date, in whole calendar months.
  measure: Whole calendar months elapsed since the latest qualifying activity; qualifying activity is any accrual,
    retro credit, partner accrual, purchase, transfer in or out, or redemption posting, and never a goodwill, bonus,
    reversal or forfeiture posting.
- id: loyalty_msr_miles_transferred_out_this_year
  window: Calendar year of the handling date, January 1 to December 31, US Central time.
  measure: Sum of miles on loyalty_miles_transfer_out entries of the membership dated inside the window.
- id: loyalty_msr_miles_purchased_this_year
  window: Calendar year of the handling date, January 1 to December 31, US Central time.
  measure: Sum of miles on loyalty_miles_purchase entries of the membership dated inside the window.
- id: loyalty_msr_choice_selections_for_year
  window: The qualification year named by choice_year.
  measure: Count of loyalty_choice_benefit_select entries of the membership carrying that choice_year.
- id: loyalty_msr_challenge_qualifying_dollars
  window: From the day the status challenge was granted through challenge_end_date, inclusive.
  measure: Sum of qualifying_dollars on loyalty_mqd_accrual entries of the membership whose flight_date falls inside
    the window.
policies:
- id: loyalty_agg_multi_holding
  subject:
  - loyalty_enroll
  rule: A person may hold only one Summit membership. A new membership is not opened for a customer who already
    has a membership in enrolled, active or dormant status; the existing membership is used, and a duplicate found
    later is merged by a human representative, never by a support agent. A customer whose earlier membership was
    closed may enroll again, starting at Summit Member with a zero balance; closed balances are never carried over.
  eligibility:
  - id: one_open_membership
    applies_to:
    - loyalty_enroll
    kind: dedup
    condition: A new membership is not opened for a customer who already has a membership in enrolled, active or
      dormant status
    evidence_fields:
    - loyalty_holdings.customer_id
    - loyalty_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - loyalty_holdings.customer_id
      action_bindings:
        loyalty_holdings.customer_id: customer_id
    dedup_contract:
      table: loyalty_holdings
      mode: separate_record
      object_bindings:
        customer_id: customer_id
      duplicate_filters:
        status:
        - enrolled
        - active
        - dormant
      distinct_fields: []
  params:
    max_per_customer: 1
- id: loyalty_enrollment
  subject:
  - loyalty_enroll
  - loyalty_activate
  rule: Summit membership is open only to individual travelers; a business profile cannot enroll, and a company's
    travel is credited through a corporate travel agreement instead. A membership is opened only for a customer
    profile whose customer_type is individual. Every new membership starts at Summit Member with tier_basis base
    and zero balances, whatever the traveler's past spend. Summit Chairman is granted only by invitation, recorded
    as tier_basis invitation, and never by qualification alone. The membership becomes active when its first activity
    posts, and it can earn from that first activity onward; flights taken before enrolled_date are credited only
    through a retro-credit claim inside the retro window.
  eligibility:
  - id: individual_only
    applies_to:
    - loyalty_enroll
    kind: state
    condition: A membership is opened only for a customer profile whose customer_type is individual.
    evidence_fields:
    - customers.customer_id
    - customers.customer_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - customers.customer_id
      action_bindings:
        customers.customer_id: customer_id
    state_contract:
      field: customers.customer_type
      allowed:
      - individual
  params:
    per_tier:
      Summit Member:
        qualifying_dollars_threshold: =qualifying_dollars_threshold
      Summit Silver:
        qualifying_dollars_threshold: =qualifying_dollars_threshold
      Summit Gold:
        qualifying_dollars_threshold: =qualifying_dollars_threshold
      Summit Platinum:
        qualifying_dollars_threshold: =qualifying_dollars_threshold
      Summit Diamond:
        qualifying_dollars_threshold: =qualifying_dollars_threshold
      Summit Chairman:
        qualifying_dollars_threshold: =qualifying_dollars_threshold
- id: loyalty_flight_earning
  subject:
  - loyalty_flight_accrual
  - loyalty_mqd_accrual
  rule: Every flown Crestline coupon on a ticket that names the membership earns award miles and qualifying dollars
    on the segment's eligible_fare_usd, which is the base fare share of the segment excluding government taxes.
    Award miles are eligible_fare_usd times award_miles_per_dollar of the tier the member held on the flight_date,
    rounded to the nearest whole mile, plus the fare brand's premium_cabin_bonus_percent from the ticket charter
    applied to those base miles. Qualifying dollars are eligible_fare_usd times the fare brand's status_credit_percent
    from the ticket charter taken as a percentage, rounded to the cent. Accrual posts only to a membership whose
    status is enrolled, active or dormant. Award tickets, companion tickets paid with a companion certificate and
    tickets paid entirely with a Crestline credit that itself came from a voucher earn neither award miles nor qualifying
    dollars on the segments they pay for. Each flown segment is credited once; a segment already credited by flight
    accrual or retro credit is never credited again. Posting any accrual sets last_activity_date and makes an enrolled
    or dormant membership active.
  eligibility:
  - id: open_membership
    applies_to:
    - loyalty_flight_accrual
    - loyalty_mqd_accrual
    kind: state
    condition: Accrual posts only to a membership whose status is enrolled, active or dormant.
    evidence_fields:
    - loyalty_holdings.membership_id
    - loyalty_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - loyalty_holdings.membership_id
      action_bindings:
        loyalty_holdings.membership_id: membership_id
    state_contract:
      field: loyalty_holdings.status
      allowed:
      - enrolled
      - active
      - dormant
  - id: credited_once
    applies_to:
    - loyalty_flight_accrual
    kind: dedup
    condition: Each flown segment is credited once; a segment already credited by flight accrual or retro credit
      is never credited again.
    evidence_fields:
    - loyalty_activity.source_ticket_id
    - loyalty_activity.segment_number
    - loyalty_activity.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - loyalty_activity.source_ticket_id
        - loyalty_activity.segment_number
      action_bindings:
        loyalty_activity.source_ticket_id: source_ticket_id
        loyalty_activity.segment_number: segment_number
    dedup_contract:
      table: loyalty_activity
      mode: separate_record
      object_bindings:
        source_ticket_id: source_ticket_id
        segment_number: segment_number
      duplicate_filters:
        event_type:
        - loyalty_flight_accrual
        - loyalty_retro_credit
      distinct_fields: []
  params:
    per_tier:
      Summit Member:
        award_miles_per_dollar: =award_miles_per_dollar
      Summit Silver:
        award_miles_per_dollar: =award_miles_per_dollar
      Summit Gold:
        award_miles_per_dollar: =award_miles_per_dollar
      Summit Platinum:
        award_miles_per_dollar: =award_miles_per_dollar
      Summit Diamond:
        award_miles_per_dollar: =award_miles_per_dollar
      Summit Chairman:
        award_miles_per_dollar: =award_miles_per_dollar
  formula:
    base_award_miles: round(eligible_fare_usd * award_miles_per_dollar)
- id: loyalty_retro_credit_claims
  subject:
  - loyalty_retro_credit
  - loyalty_mqd_accrual
  rule: A member may claim a Crestline flight that did not post, usually because the Summit number was missing from
    the booking or the name did not match. A missing flight can be claimed only on a ticket whose coupon for that
    segment has been flown and whose passenger_name matches the member's profile name. A missing Crestline flight
    can be claimed no later than the flight date of the missing flight plus retro_credit_window_days. The claim
    window is counted in calendar days from the flight_date of the coupon, and a claim on the last day is accepted;
    a claim is also not accepted until retro_credit_min_days_after_flight calendar days after the flight_date, because
    automatic posting may still complete. The retro credit earns exactly what the flight would have earned on its
    flight_date under the flight-earning rule, at the tier held on that date, and posts qualifying dollars to the
    current calendar year only when the flight_date falls in the current calendar year. Each flown segment is credited
    once; a segment already credited by flight accrual or retro credit is never credited again. Missing partner
    activity is claimed within retro_credit_partner_window_days of the partner activity date and is posted as a
    partner accrual carrying the partner's own partner_reference.
  eligibility:
  - id: retro_window
    applies_to:
    - loyalty_retro_credit
    kind: time
    condition: A missing Crestline flight can be claimed no later than the flight date of the missing flight plus
      retro_credit_window_days.
    evidence_fields:
    - ticket_transactions.ticket_id
    - ticket_transactions.segment_number
    - ticket_transactions.flight_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - ticket_transactions.ticket_id
        - ticket_transactions.segment_number
      action_bindings:
        ticket_transactions.ticket_id: source_ticket_id
        ticket_transactions.segment_number: segment_number
    temporal_basis:
      clock: frozen_time
