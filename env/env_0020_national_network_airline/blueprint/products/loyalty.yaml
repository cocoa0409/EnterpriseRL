        premium_economy: 85000
        first: 115000
    close_in_window_days: 21
    close_in_award_fee_usd: 0
    award_phone_booking_fee_usd: 0
    award_redeposit_fee_usd: 0
    award_cancel_cutoff_hours_before_departure: 1
    miles_expiry_applies: false
