- id: loyalty_award_redemptions
  subject:
  - loyalty_award_redemption
  - loyalty_award_redeposit
  rule: Award tickets are priced one way per passenger from award_chart_saver_one_way when saver seats are available
    on every flight and from award_chart_standard_one_way otherwise, by the award_zone of the itinerary and the
    award_cabin; a round trip is two one-way prices. Miles can be redeemed only from a membership whose status is
    active. The mile_balance must cover the full award price at the moment of redemption; miles cannot go negative
    and there is no miles-plus-credit combination. An award ticket booked fewer than close_in_window_days calendar
    days before its first departure carries close_in_award_fee_usd, and an award booked through the reservations
    call center carries award_phone_booking_fee_usd; both fees are recorded on the redemption entry and both follow
    the member's tier on the redemption date. An award ticket may be issued for any passenger the member names;
    the miles always come from the member's own membership. An award ticket can be cancelled with its miles redeposited
    only when the cancellation is made no later than the first scheduled departure of the award ticket minus award_cancel_cutoff_hours_before_departure.
    The cutoff is counted back in full elapsed hours from the award ticket's next_departure_at, and a cancellation
    at exactly the cutoff is accepted; after it the miles are forfeited with the unused award. A redeposit returns
    exactly the miles of the redemption entry and charges award_redeposit_fee_usd of the tier held on the redeposit
    date; close-in and telephone fees are not refunded. Each redemption can be redeposited at most once. Award tickets
    earn no miles or qualifying dollars and are never booked on Crestline Basic Economy.
  eligibility:
  - id: redeem_active
    applies_to:
    - loyalty_award_redemption
    kind: state
    condition: Miles can be redeemed only from a membership whose status is active.
    evidence_fields:
    - loyalty_holdings.membership_id
    - loyalty_holdings.status
    - loyalty_holdings.mile_balance
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - loyalty_holdings.membership_id
      action_bindings:
        loyalty_holdings.membership_id: membership_id
    state_contract:
      field: loyalty_holdings.status
      allowed:
      - active
  - id: redeposit_cutoff
    applies_to:
    - loyalty_award_redeposit
    kind: time
    condition: An award ticket can be cancelled with its miles redeposited only when the cancellation is made no
      later than the first scheduled departure of the award ticket minus award_cancel_cutoff_hours_before_departure.
    evidence_fields:
    - ticket_holdings.ticket_number
    - ticket_holdings.next_departure_at
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - ticket_holdings.ticket_number
      action_bindings:
        ticket_holdings.ticket_number: award_ticket_number
    temporal_basis:
      clock: frozen_time
      anchor_event: the first scheduled departure of the award ticket
      anchor_source: ticket_holdings.next_departure_at
      relation: not_after
      duration_source: variants.award_cancel_cutoff_hours_before_departure
      unit: elapsed_hours
      counting_rule: The cutoff is counted back in full elapsed hours from the award ticket's next_departure_at,
        and a cancellation at exactly the cutoff is accepted
      boundary: inclusive
  - id: redeposit_once
    applies_to:
    - loyalty_award_redeposit
    kind: dedup
    condition: Each redemption can be redeposited at most once.
    evidence_fields:
    - loyalty_activity.loyalty_activity_id
    - loyalty_activity.reversed_activity_id
    - loyalty_activity.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - loyalty_activity.loyalty_activity_id
      action_bindings:
        loyalty_activity.loyalty_activity_id: reversed_activity_id
    dedup_contract:
      table: loyalty_activity
      mode: separate_record
      object_bindings:
        reversed_activity_id: reversed_activity_id
      duplicate_filters:
        event_type:
        - loyalty_award_redeposit
      distinct_fields: []
  params:
    per_tier:
      Summit Member:
        award_chart_saver_one_way: =award_chart_saver_one_way
        award_chart_standard_one_way: =award_chart_standard_one_way
        close_in_window_days: =close_in_window_days
        close_in_award_fee_usd: =close_in_award_fee_usd
        award_phone_booking_fee_usd: =award_phone_booking_fee_usd
        award_redeposit_fee_usd: =award_redeposit_fee_usd
        award_cancel_cutoff_hours_before_departure: =award_cancel_cutoff_hours_before_departure
      Summit Silver:
        award_chart_saver_one_way: =award_chart_saver_one_way
        award_chart_standard_one_way: =award_chart_standard_one_way
        close_in_window_days: =close_in_window_days
        close_in_award_fee_usd: =close_in_award_fee_usd
        award_phone_booking_fee_usd: =award_phone_booking_fee_usd
        award_redeposit_fee_usd: =award_redeposit_fee_usd
        award_cancel_cutoff_hours_before_departure: =award_cancel_cutoff_hours_before_departure
      Summit Gold:
        award_chart_saver_one_way: =award_chart_saver_one_way
        award_chart_standard_one_way: =award_chart_standard_one_way
        close_in_window_days: =close_in_window_days
