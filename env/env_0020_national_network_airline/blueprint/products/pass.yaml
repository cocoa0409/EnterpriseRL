- id: pass_bag_benefit
  subject:
  - pass_bag_use
  rule: A bag subscription covers bags_per_direction checked bags up to bag_weight_limit_lb for the subscriber and
    each covered companion on the same reservation, per direction, on itineraries whose route_type is in bag_route_types;
    overweight and oversize charges stay payable unless overweight_covered or oversize_covered is true. Benefits
    are used only while the subscription is active. Benefits never apply on partner flights when applies_to_partner_flights
    is false, on Crestline Basic Economy unless applies_to_basic_economy is true, or on group fares unless applies_to_group_bookings
    is true, and apply on award and companion-certificate tickets as applies_to_award_tickets and applies_to_companion_tickets
    say. Uses in the term, counted by pass_msr_uses_this_term, may not exceed max_benefit_uses_per_term. Bag fees
    already paid on directions flown within retro_bag_fee_refund_days calendar days before the purchase date are
    refunded under the ticket charter's fee-refund rule as charged in error. No one other than the subscriber and
    covered companions may use the benefit when household_sharing is false.
  eligibility:
  - id: bag_use_active
    applies_to:
