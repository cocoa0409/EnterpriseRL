      action_bindings:
        pass_holdings.pass_id: pass_id
    state_contract:
      field: pass_holdings.status
      allowed:
      - active
  params:
    per_tier:
      Crestline Bag Pass One:
        bags_per_direction: =bags_per_direction
        bag_weight_limit_lb: =bag_weight_limit_lb
        bag_route_types: =bag_route_types
