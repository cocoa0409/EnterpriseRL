events:
- type: pass_purchase
  target: pass_holdings
  mutation: create
  meaning: A subscription is bought.
  grain: One row per subscription.
  fields:
    variant_name: subscription
    pass_number: number
    purchase_date: date bought
    start_date: first day
    end_date: last day
    billing_plan: payment plan
    companions_covered: companions included
    auto_renew: renewal setting
  triggers: []
- type: pass_activate
  target: pass_holdings
  mutation:
    transition:
      from: purchased
      to: active
  meaning: The subscription term starts.
  grain: One per subscription.
  fields:
    start_date: first day
  triggers: []
- type: pass_charge
  target: pass_ledger
  meaning: A term price, installment, add-on, upgrade difference or early termination fee is charged.
  grain: One entry per charge.
  distinguish_by:
  - charge_type
  - installment_month
  - entry_date
  fields:
    entry_date: date charged
    amount: amount
    charge_type: kind
    installment_month: month covered
  account: pass_charges
  direction: in
  triggers: []
- type: pass_refund
  target: pass_ledger
  meaning: A subscription charge is refunded in full or in part.
  grain: One entry per charge refunded.
  distinguish_by:
  - reversed_entry_id
  fields:
    entry_date: date refunded
    amount: amount refunded
    reversed_entry_id: charge refunded
    charge_type: kind refunded
  account: pass_charges
  direction: out
  triggers: []
- type: pass_bag_use
  target: pass_ledger
  meaning: Covered checked bags are applied to one direction of a ticket.
  grain: One entry per traveler per ticket direction.
  distinguish_by:
  - source_ticket_id
  - travel_direction
  - beneficiary_name
  fields:
    entry_date: date used
    source_ticket_id: ticket
    travel_direction: direction
    bags_covered: bags covered
    beneficiary_name: traveler
  triggers: []
- type: pass_seat_use
  target: pass_ledger
  meaning: A covered seat is assigned on one segment of a ticket.
  grain: One entry per traveler per segment.
  distinguish_by:
  - source_ticket_id
  - segment_number
  - beneficiary_name
  fields:
    entry_date: date assigned
    source_ticket_id: ticket
    segment_number: segment
    seat_number: seat
    beneficiary_name: traveler
  triggers: []
- type: pass_cancel
  target: pass_holdings
  mutation:
    transition:
    - from: purchased
      to: cancelled
    - from: active
      to: cancelled
  meaning: The subscriber cancels the subscription.
  grain: One per subscription.
  fields:
    closed_date: date cancelled
  triggers: []
- type: pass_expire
  target: pass_holdings
  mutation:
    transition:
      from: active
      to: expired
  meaning: The term ended without renewal.
  grain: One per subscription.
  fields:
    closed_date: day after the end_date
  triggers: []
- type: pass_renew
  target: pass_holdings
  mutation: update
  meaning: The subscription renews for another term, or its auto-renew setting changes.
  grain: One row per subscription (the subscription record itself).
  fields:
    start_date: first day of the new term
    end_date: last day of the new term
    auto_renew: renewal setting
  triggers: []
- type: pass_change
  target: pass_holdings
  mutation: update
  meaning: A companion is added or the subscription is upgraded during the term.
  grain: One row per subscription (the subscription record itself).
  fields:
    variant_name: subscription after an upgrade
    companions_covered: companions covered after the change
  triggers: []
measures:
- id: pass_msr_uses_this_term
  window: Current term, from start_date to the handling date.
  measure: Count of pass_bag_use and pass_seat_use entries of the subscription dated inside the window.
policies:
- id: pass_agg_multi_holding
  subject:
  - pass_purchase
  rule: A customer may hold at most two subscriptions at a time, and only when one covers bags and the other covers
    seats; the holding-overlap rule governs which pairs are allowed.
  eligibility: []
  params:
    max_per_customer: 2
- id: pass_agg_benefit_overlap
  subject:
  - pass_purchase
  - pass_bag_use
  - pass_seat_use
  rule: 'Subscriptions a customer holds are combined by benefit type: a customer may not hold two subscriptions
    in purchased or active status that both cover bags or both cover seats, so a Seat and Bag Pass excludes any
    other subscription and a Bag Pass may be held only alongside a Seat Pass. A subscription is not bought while
    the customer holds another subscription in purchased or active status covering the same benefit type. Pass bags
    are compared with the fare brand, Summit elite and corporate allowances under the ticket charter''s most-generous-allowance
    rule and never added to them when stacks_with_fare_brand_allowance is false, and no part of the price is refunded
    because another entitlement already covered the same bag or seat when elite_overlap_refund is false.'
  eligibility:
  - id: no_overlap
    applies_to:
    - pass_purchase
    kind: authorization
    condition: A subscription is not bought while the customer holds another subscription in purchased or active
      status covering the same benefit type.
    evidence_fields:
    - pass_holdings.customer_id
    - pass_holdings.variant_name
    - pass_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - pass_holdings.customer_id
      action_bindings:
        pass_holdings.customer_id: customer_id
  params:
    per_tier:
      Crestline Bag Pass One:
        stacks_with_fare_brand_allowance: =stacks_with_fare_brand_allowance
        elite_overlap_refund: =elite_overlap_refund
      Crestline Bag Pass Two:
        stacks_with_fare_brand_allowance: =stacks_with_fare_brand_allowance
        elite_overlap_refund: =elite_overlap_refund
      Crestline Seat Pass Domestic:
        stacks_with_fare_brand_allowance: =stacks_with_fare_brand_allowance
        elite_overlap_refund: =elite_overlap_refund
      Crestline Seat Pass Network:
        stacks_with_fare_brand_allowance: =stacks_with_fare_brand_allowance
        elite_overlap_refund: =elite_overlap_refund
      Crestline Seat and Bag Pass Domestic:
        stacks_with_fare_brand_allowance: =stacks_with_fare_brand_allowance
        elite_overlap_refund: =elite_overlap_refund
      Crestline Seat and Bag Pass Network:
        stacks_with_fare_brand_allowance: =stacks_with_fare_brand_allowance
        elite_overlap_refund: =elite_overlap_refund
- id: pass_purchase_rules
  subject:
  - pass_purchase
  - pass_activate
  - pass_charge
  rule: A subscription is sold only to a customer with an open Summit membership who is at least minimum_age_years
    old. A subscription is bought only when the customer's Summit membership status is enrolled, active or dormant.
    The term starts start_delay_days calendar days after purchase and runs pass_term_months calendar months to the
    end_date. The price is annual_price_usd up front, monthly_price_usd per month when monthly_billing_permitted
    is true with at least min_commitment_months installments owed, or miles_price miles when purchasable_with_miles
    is true; Summit Silver and higher members receive summit_elite_discount_percent percent off cash prices, and
    a flight credit is never accepted. A monthly installment that fails for installment_failure_cancel_days calendar
    days cancels the subscription.
  eligibility:
  - id: summit_open
    applies_to:
    - pass_purchase
    kind: state
    condition: A subscription is bought only when the customer's Summit membership status is enrolled, active or
      dormant.
