- id: pass_cancellation_rules
  subject:
  - pass_cancel
  - pass_refund
  - pass_charge
  rule: Only the subscriber can cancel a subscription. A subscription cancelled within cancellation_full_refund_days
    calendar days after purchase with no benefit use is refunded in full; otherwise an up-front price is refunded
    for unused full months only when prorated_refund_after_window is true, and a monthly subscription stops at the
    end of the paid month. A monthly-billed subscription cancelled before min_commitment_months installments are
    paid carries early_termination_fee_usd, charged as its own charge. Each charge can be refunded at most once,
    and a miles price is refunded as miles to the Summit membership. Subscriptions are never transferred to another
    person when transferable is false.
  eligibility:
  - id: refund_once
    applies_to:
    - pass_refund
    kind: dedup
    condition: Each charge can be refunded at most once
    evidence_fields:
    - pass_ledger.pass_entry_id
    - pass_ledger.reversed_entry_id
    - pass_ledger.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - pass_ledger.pass_entry_id
      action_bindings:
        pass_ledger.pass_entry_id: reversed_entry_id
    dedup_contract:
      table: pass_ledger
      mode: separate_record
      object_bindings:
        reversed_entry_id: reversed_entry_id
      duplicate_filters:
        event_type:
        - pass_refund
      distinct_fields: []
  params:
    per_tier:
      Crestline Bag Pass One:
        cancellation_full_refund_days: =cancellation_full_refund_days
        prorated_refund_after_window: =prorated_refund_after_window
        early_termination_fee_usd: =early_termination_fee_usd
        min_commitment_months: =min_commitment_months
        transferable: =transferable
      Crestline Bag Pass Two:
        cancellation_full_refund_days: =cancellation_full_refund_days
        prorated_refund_after_window: =prorated_refund_after_window
        early_termination_fee_usd: =early_termination_fee_usd
        min_commitment_months: =min_commitment_months
        transferable: =transferable
      Crestline Seat Pass Domestic:
        cancellation_full_refund_days: =cancellation_full_refund_days
        prorated_refund_after_window: =prorated_refund_after_window
        early_termination_fee_usd: =early_termination_fee_usd
        min_commitment_months: =min_commitment_months
        transferable: =transferable
