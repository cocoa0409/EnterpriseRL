# Product charter: Crestline Seat and Bag Subscriptions (category key: pass).
# Policy constants live only here; the runtime never reads this file.
category: pass
display_name: Crestline Seat and Bag Subscriptions
binding:
  holding_table: pass_holdings
  event_tables:
  - pass_ledger
  status_field: status
  variant_field: variant_name
lifecycle:
  states:
  - purchased
  - active
  - expired
  - cancelled
  transitions:
  - from: purchased
    to: active
    by: system
    means: The subscription starts on its start_date.
  - from: purchased
    to: cancelled
    by: user
    means: The customer cancels before the subscription starts.
  - from: active
    to: cancelled
    by: user
    means: The customer cancels an active subscription.
  - from: active
    to: expired
    by: system
    means: The end_date passed without renewal.
accounts:
- key: pass_charges
  unit: USD
  meaning: Subscription prices, installments, add-ons and fees paid by the customer, less refunds.
parameter_schema:
  pass_term_months: Calendar months of one subscription term from start_date (integer, months)
  annual_price_usd: Price of one term paid up front (USD)
  monthly_billing_permitted: Whether the term may be paid in monthly installments (boolean)
  monthly_price_usd: Monthly installment when billed monthly (USD)
  min_commitment_months: Installments owed before a monthly-billed subscription can end without the early termination
    fee (integer, months)
  early_termination_fee_usd: Fee for cancelling a monthly-billed subscription before min_commitment_months installments
    (USD)
  summit_elite_discount_percent: Discount on the price for Summit Silver and higher members (integer, percent)
  purchasable_with_miles: Whether an up-front term may be paid entirely with Summit miles (boolean)
  miles_price: Summit miles for one up-front term (integer, miles)
  payable_with_flight_credit: Whether the price may be paid with a Crestline flight credit (boolean)
  minimum_age_years: Youngest age at which a person may buy a subscription (integer, years)
  summit_membership_required: Whether an open Summit membership is required (boolean)
  bags_per_direction: Checked bags covered per covered traveler per direction (integer, bags)
  bag_weight_limit_lb: Heaviest bag covered; weight above it is charged under the ticket charter (integer, pounds)
  bag_route_types: Itinerary classes on which bags are covered (list of route_type values)
  overweight_covered: Whether overweight charges are covered (boolean)
  oversize_covered: Whether oversize charges are covered (boolean)
  seat_benefit: 'Seat covered (enum: none | extra_legroom)'
  seat_includes_preferred: Whether preferred seats are also covered (boolean)
  seat_route_types: Itinerary classes on which seats are covered (list of route_type values)
  seat_assignment_timing: 'When a covered seat may be assigned (enum: none | at_check_in | at_booking)'
  companions_covered_max: Companions on the same reservation covered without an add-on (integer, persons)
  companion_add_on_permitted: Whether coverage for one companion may be added for a fee (boolean)
  companion_add_on_price_usd: Price of adding one companion's coverage for the rest of the term (USD)
  companions_same_reservation_required: Whether a covered companion must be on the holder's reservation and flights
    (boolean)
  applies_to_basic_economy: Whether benefits apply on Crestline Basic Economy tickets (boolean)
  applies_to_award_tickets: Whether benefits apply on Summit award tickets (boolean)
  applies_to_partner_flights: Whether benefits apply on partner-operated flights (boolean)
  applies_to_companion_tickets: Whether benefits apply on companion-certificate tickets (boolean)
  applies_to_group_bookings: Whether benefits apply on group fares of ten or more passengers (boolean)
  max_benefit_uses_per_term: Most benefit uses (bag directions or seat segments) per term, counted by pass_msr_uses_this_term
    (integer, uses)
  retro_bag_fee_refund_days: Calendar days before the purchase date within which bag fees already paid on flown
    directions are refunded (integer, calendar days)
  retro_seat_fee_refund_days: Calendar days before the purchase date within which seat fees already paid on unflown
    segments are refunded (integer, calendar days)
  cancellation_full_refund_days: Calendar days after purchase within which an unused subscription is fully refunded
    (integer, calendar days)
  prorated_refund_after_window: Whether an up-front term cancelled after the window refunds unused full months (boolean)
  auto_renew_default: Whether a new subscription renews automatically (boolean)
  renewal_price_basis: 'Price charged at renewal (enum: current_list_price)'
  upgrade_permitted: Whether the subscription may be upgraded to a higher one during the term (boolean)
  upgrade_credit_basis: 'Credit for the current price on an upgrade (enum: prorated_remaining_months | none)'
  downgrade_permitted: Whether the subscription may be downgraded before the term ends (boolean)
  transferable: Whether the subscription may be transferred to another person (boolean)
  elite_overlap_refund: Whether any part of the price is refunded because the holder's Summit tier already includes
    the same benefit (boolean)
  stacks_with_fare_brand_allowance: Whether pass bags are added on top of the fare brand's free bags rather than
    compared with them (boolean)
  covered_seat_refund_on_reassignment: Whether a covered seat lost to an involuntary reassignment earns anything
    beyond reassignment to another covered seat (boolean)
  missed_benefit_refund_usd: Amount refunded when a covered bag or seat was charged in error and the charge could
    not be reversed on the ticket (USD, per occurrence)
  installment_failure_cancel_days: Calendar days after a failed monthly installment after which the subscription
    is cancelled (integer, calendar days)
  start_delay_days: Calendar days from purchase to start_date (integer, calendar days)
  household_sharing: Whether household members other than covered companions may use the benefits (boolean)
