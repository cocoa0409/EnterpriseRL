events:
- type: ticket_book
  target: ticket_holdings
  mutation: create
  meaning: A reservation for one passenger on one fare brand is created and placed on hold.
  grain: One row per passenger reservation.
  fields:
    variant_name: fare brand booked
    record_locator: booking reference
    passenger_name: passenger as booked
    membership_id: Summit membership credited
    corporate_account_id: corporate agreement booked under
    booking_channel: channel of booking
    origin: origin airport
    destination: destination airport
    origin_region: region of journey origin
    route_type: itinerary class
    trip_type: one way or round trip
    next_departure_at: first scheduled departure
    booked_at: moment of booking
    base_fare: fare quoted
    taxes_and_fees: taxes quoted
  triggers: []
- type: ticket_issue
  target: ticket_holdings
  mutation:
    transition:
      from: held
      to: ticketed
  meaning: Payment is captured and the electronic ticket is issued.
  grain: One per ticket.
  fields:
    ticket_number: ticket number issued
    issued_at: moment of issue
    payment_form: form of payment
    residual_value: opening value equal to base fare plus taxes
  triggers:
  - event: ticket:ticket_fare_collect
    map:
      payment_form: payment_form
  - event: credit:credit_redemption
    when:
      payment_form: flight_credit
    map:
      applied_ticket_number: ticket_number
  - event: companion:companion_trip_redeem
    when:
      payment_form: companion_certificate
    map:
      companion_ticket_number: ticket_number
- type: ticket_hold_lapse
  target: ticket_holdings
  mutation:
    transition:
      from: held
      to: lapsed
  meaning: An unpaid courtesy hold expired and the reservation was released.
  grain: One per reservation.
  fields:
    closed_date: date the hold lapsed
  triggers: []
- type: ticket_fare_collect
  target: ticket_transactions
  meaning: The full fare and taxes are collected at ticketing.
  grain: One entry per ticket issue.
  distinguish_by:
  - transaction_date
  fields:
    transaction_date: date collected
    amount: base fare plus taxes and fees
    payment_form: form of payment
  account: ticket_value
  direction: in
  triggers: []
- type: ticket_exchange
  target: ticket_transactions
  meaning: The unflown itinerary is exchanged for a new one, voluntarily or as a same-day confirmed change.
  grain: One entry per exchange on the ticket.
  distinguish_by:
  - exchange_sequence
  fields:
    transaction_date: date of exchange
    amount: always 0.00 (documentary)
    exchange_sequence: ordinal of this exchange
    exchange_type: standard or same-day
    new_origin: new origin
    new_destination: new destination
    new_departure_at: first departure of the new itinerary
    fare_difference_direction: outcome of fare comparison
  triggers:
  - event: ticket:ticket_itinerary_update
    map:
      origin: new_origin
      destination: new_destination
      next_departure_at: new_departure_at
  - event: ticket:ticket_add_collect
    when:
      fare_difference_direction: collect
    map:
      exchange_sequence: exchange_sequence
      transaction_date: transaction_date
  - event: ticket:ticket_residual
    when:
      fare_difference_direction: residual
    map:
      exchange_sequence: exchange_sequence
      transaction_date: transaction_date
- type: ticket_add_collect
  target: ticket_transactions
  meaning: A positive fare difference is collected on an exchange.
  grain: One entry per exchange with a higher new fare.
  distinguish_by:
  - exchange_sequence
  fields:
    transaction_date: date collected
    amount: fare difference collected
    exchange_sequence: exchange it belongs to
    payment_form: form of payment
  account: ticket_value
  direction: in
  triggers: []
- type: ticket_residual
  target: ticket_transactions
  meaning: A negative fare difference on an exchange leaves the ticket as a residual credit, a refund or a forfeiture.
  grain: One entry per exchange with a lower new fare.
  distinguish_by:
  - exchange_sequence
  fields:
    transaction_date: date settled
    amount: fare difference moved out of the ticket
    exchange_sequence: exchange it belongs to
    residual_disposition: how the residual was settled
  account: ticket_value
  direction: out
  triggers:
  - event: credit:credit_issue
    when:
      residual_disposition: residual_credit
    map:
      source_ticket_id: ticket_id
      face_value: amount
      issue_date: transaction_date
      issue_reason: exchange_residual
      variant_name: Crestline Residual Travel Credit
- type: ticket_itinerary_update
  target: ticket_holdings
  mutation: update
  meaning: The ticket's itinerary fields are updated after an exchange or a reaccommodation.
  grain: One row per ticket (the ticket record itself).
  fields:
    origin: new origin
    destination: new destination
    route_type: itinerary class of the new itinerary
    next_departure_at: next scheduled departure
  triggers: []
- type: ticket_change_fee
  target: ticket_services
  meaning: A change fee or same-day change fee is charged for an exchange.
  grain: One entry per charged exchange.
  distinguish_by:
  - related_transaction_id
  fields:
    service_date: date charged
    service_type: change_fee or same_day_change_fee
    amount: fee charged
    sales_channel: channel
    related_transaction_id: exchange entry charged for
    segment_number: 0 for itinerary-level fees
  account: fee_charges
  direction: in
  triggers: []
- type: ticket_void
  target: ticket_holdings
  mutation:
    transition:
      from: ticketed
      to: voided
  meaning: The ticket is cancelled within the risk-free window for a full refund.
  grain: One per ticket.
  fields:
    closed_date: date voided
  triggers:
  - event: ticket:ticket_refund_payout
    map:
      refund_reason: risk_free_cancellation
- type: ticket_cancel
  target: ticket_holdings
  mutation:
    transition:
    - from: ticketed
      to: cancelled_to_credit
    - from: partially_flown
      to: cancelled_to_credit
  meaning: The unflown ticket is cancelled voluntarily and its value kept as a flight credit.
  grain: One per ticket.
  fields:
    closed_date: date cancelled
  triggers:
  - event: ticket:ticket_credit_conversion
    map:
      transaction_date: closed_date
- type: ticket_credit_conversion
  target: ticket_transactions
  meaning: The net unused value of a cancelled ticket moves out of the ticket into a Crestline Flight Credit.
  grain: One entry per cancelled ticket.
  distinguish_by:
  - transaction_date
  fields:
    transaction_date: date converted
    amount: residual value less any cancellation fee
  account: ticket_value
  direction: out
  triggers:
  - event: credit:credit_issue
    map:
      source_ticket_id: ticket_id
      face_value: amount
      issue_date: transaction_date
      issue_reason: voluntary_cancellation
      variant_name: Crestline Flight Credit
- type: ticket_refund
  target: ticket_holdings
  mutation:
    transition:
    - from: ticketed
      to: refunded
    - from: partially_flown
      to: refunded
  meaning: The ticket or its unflown remainder is refunded under the refund rule.
  grain: One per ticket.
  fields:
    closed_date: date refunded
  triggers:
  - event: ticket:ticket_refund_payout
    map:
      transaction_date: closed_date
- type: ticket_refund_payout
  target: ticket_transactions
  meaning: Refunded ticket value is paid back to the original form of payment.
  grain: One entry per refund ground on a ticket.
  distinguish_by:
  - refund_reason
  - transaction_date
  fields:
    transaction_date: date refunded
    amount: value refunded
    refund_reason: ground of refund
    source_disruption_id: disruption the refund rests on
    payment_form: form refunded to
  account: ticket_value
  direction: out
  triggers: []
- type: ticket_coupon_flown
  target: ticket_transactions
  meaning: A flight segment on the ticket was flown and its coupon value consumed.
  grain: One entry per flown segment.
  distinguish_by:
  - segment_number
  fields:
    transaction_date: date flown
    amount: coupon value consumed
    segment_number: segment flown
    flight_number: flight flown
    flight_date: date of flight
    cabin_flown: cabin actually flown
    is_final_coupon: last coupon or not
  account: ticket_value
  direction: out
  triggers:
  - event: loyalty:loyalty_flight_accrual
    map:
      flight_number: flight_number
      flight_date: flight_date
      source_ticket_id: ticket_id
      segment_number: segment_number
      activity_date: transaction_date
  - event: ticket:ticket_first_flown
    when:
      segment_number: 1
      is_final_coupon: false
    map: {}
  - event: ticket:ticket_fully_flown
    when:
      is_final_coupon: true
    map:
      closed_date: transaction_date
- type: ticket_first_flown
  target: ticket_holdings
  mutation:
    transition:
      from: ticketed
      to: partially_flown
  meaning: The first coupon of a multi-segment ticket was flown.
  grain: One per ticket.
  fields:
    next_departure_at: departure of the next unflown flight
  triggers: []
- type: ticket_fully_flown
  target: ticket_holdings
  mutation:
    transition:
    - from: ticketed
      to: flown
    - from: partially_flown
      to: flown
  meaning: The final coupon of the ticket was flown.
  grain: One per ticket.
  fields:
    closed_date: date the final coupon was flown
  triggers: []
- type: ticket_no_show
  target: ticket_holdings
  mutation:
    transition:
    - from: ticketed
      to: forfeited
    - from: partially_flown
      to: forfeited
  meaning: The passenger did not cancel and did not board, on a fare brand that forfeits unflown value.
  grain: One per ticket.
  fields:
    closed_date: date of the missed departure
  triggers:
  - event: ticket:ticket_value_forfeit
    map:
      forfeit_reason: no_show
      transaction_date: closed_date
- type: ticket_value_forfeit
  target: ticket_transactions
  meaning: Ticket value is retained by Crestline for a no-show or as a cancellation fee.
  grain: One entry per forfeiture ground on a ticket.
  distinguish_by:
  - forfeit_reason
  fields:
    transaction_date: date retained
    amount: value retained
    forfeit_reason: ground of retention
  account: ticket_value
  direction: out
  triggers: []
- type: ticket_name_correction
  target: ticket_holdings
  mutation: update
  meaning: The passenger name on the ticket is corrected to match the government ID.
  grain: One row per ticket (the ticket record itself).
  fields:
    passenger_name: corrected passenger name
  triggers: []
- type: ticket_seat_purchase
  target: ticket_services
  meaning: An advance seat is purchased for one segment.
  grain: One entry per purchased seat per segment.
  distinguish_by:
  - segment_number
  - seat_number
  fields:
    service_date: date purchased
    service_type: standard_seat, preferred_seat or extra_legroom_seat
    segment_number: segment
    segment_miles: segment distance
    seat_number: seat purchased
    amount: fee charged
    sales_channel: channel
  account: fee_charges
  direction: in
  triggers: []
- type: ticket_bag_charge
  target: ticket_services
  meaning: A checked bag, or a weight or size charge on a checked bag, is recorded for one direction of travel.
  grain: One entry per bag per charge component (sequence charge, overweight or oversize) per direction.
  distinguish_by:
  - travel_direction
  - bag_tag_number
  - service_type
  fields:
    service_date: date checked
    service_type: bag sequence or weight/size component
    travel_direction: direction
    bag_tag_number: bag tag
    bag_weight_lb: weighed weight
    bag_linear_inches: linear size
    amount: charge (0.00 inside allowance)
    sales_channel: channel
    segment_number: first segment of the direction
  account: fee_charges
  direction: in
  triggers: []
- type: ticket_upgrade_purchase
  target: ticket_services
  meaning: A paid cabin upgrade is purchased for one segment.
  grain: One entry per segment upgraded.
  distinguish_by:
  - segment_number
  fields:
    service_date: date purchased
    service_type: upgrade_premium_economy or upgrade_first
    segment_number: segment
    segment_miles: segment distance
    amount: fee charged
    sales_channel: channel
  account: fee_charges
  direction: in
  triggers: []
- type: ticket_fee_refund
  target: ticket_services
  meaning: One earlier service fee is refunded to the original payment.
  grain: One entry per refunded fee entry.
  distinguish_by:
  - refunded_service_id
  fields:
    service_date: date refunded
    service_type: kind of fee refunded
    amount: amount refunded
    refunded_service_id: fee entry reversed
    fee_refund_reason: ground of refund
    source_disruption_id: disruption the refund rests on
  account: fee_charges
  direction: out
  triggers: []
- type: ticket_disruption_record
  target: ticket_disruptions
  meaning: An irregular operation affecting a ticketed segment is recorded by operations control.
  grain: One entry per disruption type per segment per flight date.
  distinguish_by:
  - segment_number
  - disruption_type
  - flight_date
  fields:
    recorded_date: date recorded
    segment_number: segment
    flight_number: flight
    flight_date: flight date
    disruption_type: kind
    disruption_cause: controllable or not
    arrival_delay_minutes: arrival lateness or shift
    bag_delay_hours: bag delivery delay
    scheduled_block_minutes: scheduled duration
    segment_fare_amount: one-way segment fare
  triggers: []
- type: ticket_reaccommodation
  target: ticket_disruptions
  meaning: The passenger is rebooked onto another flight because of a disruption.
  grain: One entry per rebooked flight per disruption.
  distinguish_by:
  - source_disruption_id
  - new_flight_number
  fields:
    recorded_date: date rebooked
    source_disruption_id: disruption rebooked for
    segment_number: segment replaced
    disruption_type: type of the disruption rebooked for
    new_flight_number: rebooked flight
    new_departure_at: rebooked departure
    rebooking_carrier: carrier
  triggers:
  - event: ticket:ticket_itinerary_update
    map:
      next_departure_at: new_departure_at
- type: ticket_compensation
  target: ticket_disruptions
  meaning: Care or compensation is given for a disruption.
  grain: One entry per compensation type per disruption.
  distinguish_by:
  - source_disruption_id
  - compensation_type
  fields:
    recorded_date: date given
    source_disruption_id: disruption compensated
    segment_number: segment
    disruption_type: type of the disruption compensated
    compensation_type: kind
    compensation_amount: value
    compensation_miles: miles
  triggers:
  - event: credit:credit_issue
    when:
      compensation_type: goodwill_ecertificate
    map:
      source_ticket_id: ticket_id
      source_disruption_id: source_disruption_id
      face_value: compensation_amount
      issue_date: recorded_date
      issue_reason: irrops_goodwill
      variant_name: Crestline Disruption Voucher
  - event: credit:credit_issue
    when:
      compensation_type: denied_boarding_voucher
    map:
      source_ticket_id: ticket_id
      source_disruption_id: source_disruption_id
      face_value: compensation_amount
      issue_date: recorded_date
      issue_reason: denied_boarding
      variant_name: Crestline Denied Boarding Voucher
  - event: loyalty:loyalty_goodwill_credit
    when:
      compensation_type: goodwill_miles
    map:
      miles: compensation_miles
      activity_date: recorded_date
      source_ticket_id: ticket_id
measures:
- id: ticket_msr_bags_checked_in_direction
  window: The current ticket and travel_direction, from ticket issue up to the moment of the charge.
  measure: Count of ticket_bag_charge entries with service_type first_bag, second_bag or third_bag on the same ticket
    and travel_direction; weight and size components are not counted.
- id: ticket_msr_goodwill_in_last_12_months
  window: Rolling 365 calendar days ending on, and including, the flight_date of the disruption being compensated.
  measure: Count of ticket_compensation entries with compensation_type goodwill_ecertificate or goodwill_miles across
    every ticket held by the same customer, dated by the flight_date of the disruption each rests on.
policies:
- id: ticket_booking_and_ticketing
  subject:
  - ticket_book
  - ticket_issue
  - ticket_fare_collect
  - ticket_hold_lapse
  rule: A reservation is created in the held state for one passenger on one fare brand, and the fare brand's entry_gate
    must hold at booking. When the fare brand's courtesy_hold_hours is zero the reservation must be paid and ticketed
    in the same transaction. A held reservation can be ticketed only while its courtesy hold is open, that is no
    later than the moment the reservation is placed on courtesy hold plus courtesy_hold_hours. The hold window is
    counted in full elapsed hours from the booked_at timestamp, and a ticketing attempt at exactly the end of the
    window is still inside it. A hold that passes the end of its window unpaid lapses and its seats are released;
    a lapsed reservation is never reinstated, and the customer books again at the fare then available. Ticketing
    collects the full fare, base_fare plus taxes_and_fees, in one fare-collection entry in the form of payment recorded
    on the ticket, and the ticket's residual_value opens at that amount. A ticket paid with a flight credit draws
    that value from the credit, a ticket paid with award miles has its miles taken by the Summit award redemption,
    and a companion ticket draws one companion trip from the companion certificate or pass. Travel on the ticket
    must begin within ticket_validity_months calendar months of issue, counted from the issued_at date to the same
    day-of-month, falling back to the last day of the month when that day does not exist. The residual_value always
    equals every fare-collection and add-collect entry less every coupon, conversion, refund, residual and forfeiture
    entry on the ticket.
  eligibility:
  - id: hold_window
    applies_to:
    - ticket_issue
    kind: time
    condition: A held reservation can be ticketed only while its courtesy hold is open, that is no later than the
      moment the reservation is placed on courtesy hold plus courtesy_hold_hours.
    evidence_fields:
    - ticket_holdings.ticket_id
    - ticket_holdings.booked_at
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - ticket_holdings.ticket_id
      action_bindings:
        ticket_holdings.ticket_id: ticket_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the reservation is placed on courtesy hold
      anchor_source: ticket_holdings.booked_at
      relation: not_after
      duration_source: variants.courtesy_hold_hours
      unit: elapsed_hours
      counting_rule: The hold window is counted in full elapsed hours from the booked_at timestamp, and a ticketing
        attempt at exactly the end of the window is still inside it.
      boundary: inclusive
  params:
    per_tier:
      Crestline Basic Economy:
        courtesy_hold_hours: =courtesy_hold_hours
        ticket_validity_months: =ticket_validity_months
      Crestline Main Cabin:
        courtesy_hold_hours: =courtesy_hold_hours
        ticket_validity_months: =ticket_validity_months
      Crestline Main Plus:
        courtesy_hold_hours: =courtesy_hold_hours
        ticket_validity_months: =ticket_validity_months
      Crestline Main Flexible:
        courtesy_hold_hours: =courtesy_hold_hours
        ticket_validity_months: =ticket_validity_months
      Crestline Premium Economy:
        courtesy_hold_hours: =courtesy_hold_hours
        ticket_validity_months: =ticket_validity_months
      Crestline First:
        courtesy_hold_hours: =courtesy_hold_hours
        ticket_validity_months: =ticket_validity_months
  formula:
    opening_value: base_fare + taxes_and_fees
- id: ticket_agg_multi_holding
  subject:
  - ticket_book
  rule: A customer may hold any number of tickets at the same time, on any mix of fare brands, because each ticket
    covers exactly one passenger on one journey. There is no cap on open tickets per customer; duplicate protection
    is governed separately by the duplicate-booking rule.
  eligibility: []
  params:
    max_per_customer: null
- id: ticket_agg_duplicate_bookings
  subject:
  - ticket_book
  - ticket_issue
  rule: Tickets held by one customer are evaluated together only for duplicate protection, and never pool their
    entitlements. A customer may not hold two reservations for the same passenger_name that are both held or ticketed
    with the same origin, destination and next_departure_at; the second such reservation is not created. Where two
    such reservations already exist, only the one with the earlier booked_at may be ticketed and the later one is
    left to lapse. Baggage allowances, seat entitlements, fee waivers and residual values belong to the individual
    ticket on which they arise; they are never transferred to, added to or netted against another ticket of the
    same customer, and a waiver used on one ticket never reduces the waivers available on another.
  eligibility:
  - id: no_duplicate_open_reservation
    applies_to:
    - ticket_book
    kind: dedup
    condition: A customer may not hold two reservations for the same passenger_name that are both held or ticketed
      with the same origin, destination and next_departure_at; the second such reservation is not created.
    evidence_fields:
    - ticket_holdings.customer_id
    - ticket_holdings.passenger_name
    - ticket_holdings.origin
    - ticket_holdings.destination
    - ticket_holdings.next_departure_at
    - ticket_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - ticket_holdings.customer_id
        - ticket_holdings.passenger_name
        - ticket_holdings.next_departure_at
      action_bindings:
        ticket_holdings.customer_id: customer_id
        ticket_holdings.passenger_name: passenger_name
        ticket_holdings.next_departure_at: next_departure_at
    dedup_contract:
      table: ticket_holdings
      mode: separate_record
      object_bindings:
        customer_id: customer_id
        passenger_name: passenger_name
        origin: origin
        destination: destination
        next_departure_at: next_departure_at
      duplicate_filters:
        status:
        - held
        - ticketed
      distinct_fields:
      - record_locator
- id: ticket_risk_free_cancellation
  subject:
  - ticket_void
  - ticket_refund_payout
  rule: Every fare brand, Crestline Basic Economy included, may be cancelled without penalty inside the risk-free
    window. A ticket may be voided for a full refund only when the cancellation is confirmed no later than the ticket
    was issued plus risk_free_cancel_hours. The window is counted in full elapsed hours from the issued_at timestamp
    on the ticket, and a cancellation confirmed at exactly the end of the window is still inside it. A void is not
    available on a ticket that has already been exchanged. The ticket must still be ticketed with no coupon flown,
    and its next_departure_at must not have passed. A void refunds the entire residual_value to the original form
    of payment with no cancellation fee, and every seat, bag and upgrade fee on the ticket is refunded with it under
    the fee-refund rule; the refund is processed within refund_processing_business_days_card business days for card
    payments and refund_processing_calendar_days_other calendar days for any other form. After the window closes
    the ticket falls under the cancellation-for-credit and refund rules instead.
  eligibility:
  - id: risk_free_window
    applies_to:
    - ticket_void
    kind: time
    condition: A ticket may be voided for a full refund only when the cancellation is confirmed no later than the
      ticket was issued plus risk_free_cancel_hours.
    evidence_fields:
    - ticket_holdings.ticket_id
    - ticket_holdings.issued_at
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - ticket_holdings.ticket_id
      action_bindings:
        ticket_holdings.ticket_id: ticket_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the ticket was issued
      anchor_source: ticket_holdings.issued_at
      relation: not_after
      duration_source: variants.risk_free_cancel_hours
      unit: elapsed_hours
      counting_rule: The window is counted in full elapsed hours from the issued_at timestamp on the ticket, and
        a cancellation confirmed at exactly the end of the window is still inside it.
      boundary: inclusive
  - id: not_exchanged
    applies_to:
    - ticket_void
    kind: dedup
    condition: A void is not available on a ticket that has already been exchanged.
    evidence_fields:
    - ticket_transactions.ticket_id
    - ticket_transactions.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - ticket_transactions.ticket_id
      action_bindings:
        ticket_transactions.ticket_id: ticket_id
    dedup_contract:
      table: ticket_transactions
      mode: separate_record
      object_bindings:
        ticket_id: ticket_id
      duplicate_filters:
        event_type:
        - ticket_exchange
      distinct_fields: []
  params:
    per_tier:
      Crestline Basic Economy:
        risk_free_cancel_hours: =risk_free_cancel_hours
        refund_processing_business_days_card: =refund_processing_business_days_card
        refund_processing_calendar_days_other: =refund_processing_calendar_days_other
      Crestline Main Cabin:
        risk_free_cancel_hours: =risk_free_cancel_hours
        refund_processing_business_days_card: =refund_processing_business_days_card
        refund_processing_calendar_days_other: =refund_processing_calendar_days_other
      Crestline Main Plus:
        risk_free_cancel_hours: =risk_free_cancel_hours
        refund_processing_business_days_card: =refund_processing_business_days_card
        refund_processing_calendar_days_other: =refund_processing_calendar_days_other
      Crestline Main Flexible:
        risk_free_cancel_hours: =risk_free_cancel_hours
        refund_processing_business_days_card: =refund_processing_business_days_card
        refund_processing_calendar_days_other: =refund_processing_calendar_days_other
      Crestline Premium Economy:
        risk_free_cancel_hours: =risk_free_cancel_hours
        refund_processing_business_days_card: =refund_processing_business_days_card
        refund_processing_calendar_days_other: =refund_processing_calendar_days_other
      Crestline First:
        risk_free_cancel_hours: =risk_free_cancel_hours
        refund_processing_business_days_card: =refund_processing_business_days_card
        refund_processing_calendar_days_other: =refund_processing_calendar_days_other
  formula:
    void_refund_amount: residual_value
- id: ticket_voluntary_change
  subject:
  - ticket_exchange
  - ticket_add_collect
  - ticket_residual
  - ticket_itinerary_update
  - ticket_change_fee
  rule: 'A voluntary change exchanges the unflown portion of a ticket for a new itinerary for the same passenger.
    A voluntary change is available only when the ticket''s fare brand has voluntary_change_permitted set to true;
    Crestline Basic Economy can therefore never be changed, and its holder''s options are the risk-free void or
    a cancellation for credit. A voluntary change can be made only while the ticket is ticketed or partially_flown.
    A voluntary change must be completed no later than the scheduled departure of the first unflown flight minus
    change_cutoff_hours_before_departure. The cutoff is counted back in full elapsed hours from next_departure_at
    in the departure airport''s local time, and a change completed exactly at the cutoff is still accepted. Each
    exchange is numbered by exchange_sequence, starting at one for the first exchange on the ticket. The change
    fee is change_fee_us_origin when origin_region is united_states; when the journey originates outside the United
    States it is change_fee_non_us_origin_short_haul for domestic and short-haul international itineraries and change_fee_non_us_origin_long_haul
    for long-haul international itineraries. A change fee is charged as a separate fee entry linked to the exchange
    entry, and a fee of zero is not recorded. The fare difference is the new itinerary''s total fare minus the ticket''s
    residual_value at the moment of exchange: a positive difference is collected in full as an add-collect, a zero
    difference settles even, and a negative difference is settled by lower_fare_residual_handling — residual_credit
    issues the difference as a Crestline Residual Travel Credit, refund_to_original_form refunds it to the original
    payment, and forfeit keeps it. The change fee is never deducted from a residual and a residual is never used
    to pay the change fee. The ticket''s origin, destination, route_type and next_departure_at are updated to the
    new itinerary, but the fare brand never changes on a voluntary change; moving to another fare brand is a new
    purchase. A change to another flight on the same date and route in the same cabin is handled by the same-day
    change rule, and a ticket whose flight is disrupted by Crestline is rebooked under the irregular-operations
    rule without fee or fare difference.'
  eligibility:
  - id: change_permitted_brand
    applies_to:
    - ticket_exchange
    kind: state
    condition: A voluntary change is available only when the ticket's fare brand has voluntary_change_permitted
      set to true
    evidence_fields:
    - ticket_holdings.ticket_id
    - ticket_holdings.variant_name
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - ticket_holdings.ticket_id
      action_bindings:
        ticket_holdings.ticket_id: ticket_id
    state_contract:
      field: ticket_holdings.variant_name
      allowed:
      - Crestline Main Cabin
      - Crestline Main Plus
      - Crestline Main Flexible
      - Crestline Premium Economy
      - Crestline First
  - id: changeable_status
    applies_to:
    - ticket_exchange
    kind: state
    condition: A voluntary change can be made only while the ticket is ticketed or partially_flown.
    evidence_fields:
    - ticket_holdings.ticket_id
    - ticket_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - ticket_holdings.ticket_id
      action_bindings:
        ticket_holdings.ticket_id: ticket_id
    state_contract:
      field: ticket_holdings.status
      allowed:
      - ticketed
      - partially_flown
  - id: change_cutoff
    applies_to:
    - ticket_exchange
    kind: time
    condition: A voluntary change must be completed no later than the scheduled departure of the first unflown flight
      minus change_cutoff_hours_before_departure.
    evidence_fields:
    - ticket_holdings.ticket_id
    - ticket_holdings.next_departure_at
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - ticket_holdings.ticket_id
      action_bindings:
        ticket_holdings.ticket_id: ticket_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the scheduled departure of the first unflown flight
      anchor_source: ticket_holdings.next_departure_at
      relation: not_after
      duration_source: variants.change_cutoff_hours_before_departure
      unit: elapsed_hours
      counting_rule: The cutoff is counted back in full elapsed hours from next_departure_at in the departure airport's
        local time, and a change completed exactly at the cutoff is still accepted.
      boundary: inclusive
  params:
    per_tier:
      Crestline Basic Economy:
        voluntary_change_permitted: =voluntary_change_permitted
        change_fee_us_origin: =change_fee_us_origin
        change_fee_non_us_origin_short_haul: =change_fee_non_us_origin_short_haul
        change_fee_non_us_origin_long_haul: =change_fee_non_us_origin_long_haul
        change_cutoff_hours_before_departure: =change_cutoff_hours_before_departure
        lower_fare_residual_handling: =lower_fare_residual_handling
      Crestline Main Cabin:
        voluntary_change_permitted: =voluntary_change_permitted
        change_fee_us_origin: =change_fee_us_origin
        change_fee_non_us_origin_short_haul: =change_fee_non_us_origin_short_haul
        change_fee_non_us_origin_long_haul: =change_fee_non_us_origin_long_haul
        change_cutoff_hours_before_departure: =change_cutoff_hours_before_departure
        lower_fare_residual_handling: =lower_fare_residual_handling
      Crestline Main Plus:
        voluntary_change_permitted: =voluntary_change_permitted
        change_fee_us_origin: =change_fee_us_origin
        change_fee_non_us_origin_short_haul: =change_fee_non_us_origin_short_haul
        change_fee_non_us_origin_long_haul: =change_fee_non_us_origin_long_haul
        change_cutoff_hours_before_departure: =change_cutoff_hours_before_departure
        lower_fare_residual_handling: =lower_fare_residual_handling
      Crestline Main Flexible:
        voluntary_change_permitted: =voluntary_change_permitted
        change_fee_us_origin: =change_fee_us_origin
        change_fee_non_us_origin_short_haul: =change_fee_non_us_origin_short_haul
        change_fee_non_us_origin_long_haul: =change_fee_non_us_origin_long_haul
        change_cutoff_hours_before_departure: =change_cutoff_hours_before_departure
        lower_fare_residual_handling: =lower_fare_residual_handling
      Crestline Premium Economy:
        voluntary_change_permitted: =voluntary_change_permitted
        change_fee_us_origin: =change_fee_us_origin
        change_fee_non_us_origin_short_haul: =change_fee_non_us_origin_short_haul
        change_fee_non_us_origin_long_haul: =change_fee_non_us_origin_long_haul
        change_cutoff_hours_before_departure: =change_cutoff_hours_before_departure
        lower_fare_residual_handling: =lower_fare_residual_handling
      Crestline First:
        voluntary_change_permitted: =voluntary_change_permitted
        change_fee_us_origin: =change_fee_us_origin
        change_fee_non_us_origin_short_haul: =change_fee_non_us_origin_short_haul
        change_fee_non_us_origin_long_haul: =change_fee_non_us_origin_long_haul
        change_cutoff_hours_before_departure: =change_cutoff_hours_before_departure
        lower_fare_residual_handling: =lower_fare_residual_handling
  formula:
    change_fee: change_fee_us_origin if origin_region == 'united_states' else (change_fee_non_us_origin_short_haul
      if route_type in ['domestic', 'short_haul_international'] else change_fee_non_us_origin_long_haul)
- id: ticket_same_day_change
  subject:
  - ticket_exchange
  - ticket_change_fee
  rule: A same-day confirmed change moves the passenger to another Crestline flight between the same origin and
    destination on the same calendar date as the original flight and in the same cabin, without any fare difference.
    A same-day confirmed change is available only when the ticket's fare brand has same_day_change_permitted set
    to true. A same-day confirmed change can be requested no earlier than the scheduled departure of the flight
    being changed minus same_day_change_window_hours. The window opens a full same_day_change_window_hours elapsed
    hours before next_departure_at, and a request at exactly the opening moment is accepted; the request must also
    be made before the original flight departs. The fee is same_day_confirmed_change_fee per passenger per direction,
    recorded as a same_day_change_fee entry linked to the exchange entry. The fee is waived when the passenger's
    Summit membership tier has same_day_change_fee_waived set to true in the loyalty charter, or when the ticket's
    corporate agreement waives change fees; a waived fee is not recorded. A same-day change never generates an add-collect
    or a residual; a request that changes the origin, destination, date or cabin is a voluntary change instead.
  eligibility:
  - id: same_day_brand
    applies_to:
    - ticket_exchange
    kind: state
    condition: A same-day confirmed change is available only when the ticket's fare brand has same_day_change_permitted
      set to true.
    evidence_fields:
    - ticket_holdings.ticket_id
    - ticket_holdings.variant_name
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - ticket_holdings.ticket_id
      action_bindings:
        ticket_holdings.ticket_id: ticket_id
    state_contract:
      field: ticket_holdings.variant_name
      allowed:
      - Crestline Main Cabin
      - Crestline Main Plus
      - Crestline Main Flexible
      - Crestline Premium Economy
      - Crestline First
  - id: same_day_window
    applies_to:
    - ticket_exchange
    kind: time
    condition: A same-day confirmed change can be requested no earlier than the scheduled departure of the flight
      being changed minus same_day_change_window_hours.
    evidence_fields:
    - ticket_holdings.ticket_id
    - ticket_holdings.next_departure_at
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - ticket_holdings.ticket_id
      action_bindings:
        ticket_holdings.ticket_id: ticket_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the scheduled departure of the flight being changed
      anchor_source: ticket_holdings.next_departure_at
      relation: not_before
      duration_source: variants.same_day_change_window_hours
      unit: elapsed_hours
      counting_rule: The window opens a full same_day_change_window_hours elapsed hours before next_departure_at,
        and a request at exactly the opening moment is accepted; the request must also be made before the original
        flight departs.
      boundary: inclusive
  params:
    per_tier:
      Crestline Basic Economy:
        same_day_change_permitted: =same_day_change_permitted
        same_day_change_window_hours: =same_day_change_window_hours
        same_day_confirmed_change_fee: =same_day_confirmed_change_fee
      Crestline Main Cabin:
        same_day_change_permitted: =same_day_change_permitted
        same_day_change_window_hours: =same_day_change_window_hours
        same_day_confirmed_change_fee: =same_day_confirmed_change_fee
      Crestline Main Plus:
        same_day_change_permitted: =same_day_change_permitted
        same_day_change_window_hours: =same_day_change_window_hours
        same_day_confirmed_change_fee: =same_day_confirmed_change_fee
      Crestline Main Flexible:
        same_day_change_permitted: =same_day_change_permitted
        same_day_change_window_hours: =same_day_change_window_hours
        same_day_confirmed_change_fee: =same_day_confirmed_change_fee
      Crestline Premium Economy:
        same_day_change_permitted: =same_day_change_permitted
        same_day_change_window_hours: =same_day_change_window_hours
        same_day_confirmed_change_fee: =same_day_confirmed_change_fee
      Crestline First:
        same_day_change_permitted: =same_day_change_permitted
        same_day_change_window_hours: =same_day_change_window_hours
        same_day_confirmed_change_fee: =same_day_confirmed_change_fee
- id: ticket_cancel_for_credit
  subject:
  - ticket_cancel
  - ticket_credit_conversion
  - ticket_value_forfeit
  rule: A customer may cancel a ticket that is ticketed or partially_flown and keep its unused value as a Crestline
    Flight Credit in the passenger's name when the fare brand has cancel_for_credit_permitted set to true. A cancellation
    for credit must be confirmed no later than the scheduled departure of the first unflown flight minus cancel_cutoff_hours_before_departure.
    The cutoff is counted back in full elapsed hours from next_departure_at, and a cancellation confirmed exactly
    at the cutoff is still accepted; after it the ticket is handled as a no-show. The cancellation fee is cancellation_fee_domestic,
    cancellation_fee_short_haul_international or cancellation_fee_long_haul_international according to the ticket's
    route_type, and it is retained from the ticket value as a forfeiture entry with forfeit_reason cancellation_fee;
    a fee of zero is not recorded. The credit amount is the residual_value less the cancellation fee; when the fee
    equals or exceeds the residual_value the whole residual is retained as the fee and no credit is issued. The
    credit-conversion entry moves the net value out of the ticket and a Crestline Flight Credit is issued for exactly
    that amount, after which the credit's validity and use follow the flight credit charter. A credit conversion
    is booked only on a ticket whose status is cancelled_to_credit. A credit conversion is made only for a ticket
    whose payment_form is credit_card, debit_card, flight_credit or corporate_invoice; an award ticket is cancelled
    through the Summit award redeposit rule and a companion ticket through the companion reinstatement rule. Seat,
    bag, change and upgrade fees are not refunded on a voluntary cancellation for credit and are never added to
    the credit. A refundable fare brand may be cancelled for credit only when the customer chooses a credit over
    the refund.
  eligibility:
  - id: cancel_cutoff
    applies_to:
    - ticket_cancel
    kind: time
    condition: A cancellation for credit must be confirmed no later than the scheduled departure of the first unflown
      flight minus cancel_cutoff_hours_before_departure.
    evidence_fields:
    - ticket_holdings.ticket_id
    - ticket_holdings.next_departure_at
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - ticket_holdings.ticket_id
      action_bindings:
        ticket_holdings.ticket_id: ticket_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the scheduled departure of the first unflown flight
