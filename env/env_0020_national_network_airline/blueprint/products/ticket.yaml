# Product charter: Crestline Tickets by Fare Brand (category key: ticket).
# Policy constants live only here; the runtime never reads this file.
category: ticket
display_name: Crestline Tickets by Fare Brand
binding:
  holding_table: ticket_holdings
  event_tables:
  - ticket_transactions
  - ticket_services
  - ticket_disruptions
  status_field: status
  variant_field: variant_name
  quantity_fields:
    residual_value: ticket_value
lifecycle:
  states:
  - held
  - ticketed
  - partially_flown
  - flown
  - cancelled_to_credit
  - refunded
  - voided
  - forfeited
  - lapsed
  transitions:
  - from: held
    to: ticketed
    by: agent
    means: Payment is captured for the full fare and the ticket number is issued.
  - from: held
    to: lapsed
    by: system
    means: The courtesy hold reached the end of its window unpaid and the seats were released.
  - from: ticketed
    to: voided
    by: user
    means: The customer confirms cancelling the ticket inside the risk-free window for a full refund.
  - from: ticketed
    to: partially_flown
    by: system
    means: The first coupon of a multi-segment ticket was flown.
  - from: ticketed
    to: flown
    by: system
    means: The only coupon of a single-segment ticket was flown.
  - from: partially_flown
    to: flown
    by: system
    means: The final coupon of the ticket was flown.
  - from: ticketed
    to: cancelled_to_credit
    by: user
    means: The customer confirms cancelling an unflown ticket and keeping its value as a flight credit.
  - from: partially_flown
    to: cancelled_to_credit
    by: user
    means: The customer confirms cancelling the unflown remainder of a ticket and keeping its value as a flight
      credit.
  - from: ticketed
    to: refunded
    by: agent
    means: The ticket is refunded to the original form of payment under the refund rule.
  - from: partially_flown
    to: refunded
    by: agent
    means: The unflown remainder of the ticket is refunded to the original form of payment under the refund rule.
  - from: ticketed
    to: forfeited
    by: system
    means: The passenger was a no-show on a fare brand whose unflown value is forfeited.
  - from: partially_flown
    to: forfeited
    by: system
    means: The passenger was a no-show on the remaining segments of a fare brand whose unflown value is forfeited.
accounts:
- key: ticket_value
  unit: USD
  meaning: Unused fare value remaining on the ticket; fare collected and add-collects increase it, flown coupons,
    credit conversions, refunds, residuals and forfeitures reduce it.
- key: fee_charges
  unit: USD
  meaning: Net ancillary and service fees paid on the ticket (change, seat, bag and paid-upgrade fees) less fees
    refunded.
parameter_schema:
  courtesy_hold_hours: Hours a reservation may be held unpaid before it lapses; 0 means no courtesy hold is offered
    and the fare must be ticketed at booking (integer, hours)
  risk_free_cancel_hours: Hours after ticket issue during which the ticket may be voided for a full refund (integer,
    elapsed hours)
  ticket_validity_months: Calendar months from ticket issue during which travel on the ticket must begin (integer,
    months)
  name_correction_max_characters: Maximum total characters of the passenger name that may be corrected without a
    recorded legal name change (integer, characters)
  voluntary_change_permitted: Whether the unflown itinerary may be exchanged voluntarily (boolean)
  change_fee_us_origin: Change fee per passenger per exchange when the journey originates in the United States (USD)
  change_fee_non_us_origin_short_haul: Change fee per passenger per exchange for domestic or short-haul international
    itineraries originating outside the United States (USD)
  change_fee_non_us_origin_long_haul: Change fee per passenger per exchange for long-haul international itineraries
    originating outside the United States (USD)
  change_cutoff_hours_before_departure: Latest point for a voluntary change, counted back from the scheduled departure
    of the first unflown flight (integer, elapsed hours)
  lower_fare_residual_handling: 'Disposition of a negative fare difference on an exchange (enum: forfeit | residual_credit
    | refund_to_original_form)'
  same_day_change_permitted: Whether a same-day confirmed change to another flight on the same date and route is
    sold (boolean)
  same_day_change_window_hours: Hours before the scheduled departure of the original flight at which the same-day
    change window opens (integer, elapsed hours)
  same_day_confirmed_change_fee: Fee per passenger per direction for a same-day confirmed change (USD)
  cancel_for_credit_permitted: Whether an unflown ticket may be cancelled voluntarily and its value kept as a flight
    credit (boolean)
  cancel_cutoff_hours_before_departure: Latest point for a cancellation for credit, counted back from the scheduled
    departure of the first unflown flight (integer, elapsed hours)
  cancellation_fee_domestic: Fee retained from ticket value on a voluntary cancellation for credit, domestic itineraries
    (USD)
  cancellation_fee_short_haul_international: Fee retained from ticket value on a voluntary cancellation for credit,
    short-haul international itineraries (USD)
  cancellation_fee_long_haul_international: Fee retained from ticket value on a voluntary cancellation for credit,
    long-haul international itineraries (USD)
  refundable_fare: Whether a voluntary cancellation is refunded to the original form of payment (boolean)
  refund_processing_business_days_card: Business days within which a refund to a credit or debit card is processed
    (integer, business days)
  refund_processing_calendar_days_other: Calendar days within which a refund to any other form of payment is processed
    (integer, calendar days)
  no_show_handling: 'Treatment of the unflown value when the passenger is a no-show (enum: forfeit_all | retain_value)'
  advance_seat_selection: 'Advance seat entitlement of the fare brand (enum: paid_only | standard_included | extra_legroom_included
    | premium_cabin_included)'
  segment_length_threshold_miles: Segment distance at or below which short-segment seat and upgrade prices apply
    (integer, statute miles)
  standard_seat_fee_short_segment: Advance standard seat fee per segment on short segments (USD)
  standard_seat_fee_long_segment: Advance standard seat fee per segment on long segments (USD)
  preferred_seat_fee_short_segment: Preferred seat fee per segment on short segments (USD)
  preferred_seat_fee_long_segment: Preferred seat fee per segment on long segments (USD)
  extra_legroom_seat_fee_short_segment: Extra-legroom Main Plus seat fee per segment on short segments (USD)
  extra_legroom_seat_fee_long_segment: Extra-legroom Main Plus seat fee per segment on long segments (USD)
  free_checked_bags_domestic: Checked bags included per passenger per direction on domestic itineraries (integer,
    bags)
  free_checked_bags_short_haul_international: Checked bags included per passenger per direction on short-haul international
    itineraries (integer, bags)
  free_checked_bags_long_haul_international: Checked bags included per passenger per direction on long-haul international
    itineraries (integer, bags)
  first_bag_fee_domestic_online: First checked bag fee on domestic itineraries when prepaid online or in the app
    (USD)
  first_bag_fee_domestic_airport: First checked bag fee on domestic itineraries when paid at the airport (USD)
  second_bag_fee_domestic: Second checked bag fee on domestic itineraries (USD)
  first_bag_fee_short_haul_international: First checked bag fee on short-haul international itineraries (USD)
  second_bag_fee_short_haul_international: Second checked bag fee on short-haul international itineraries (USD)
  first_bag_fee_long_haul_international: First checked bag fee on long-haul international itineraries (USD)
  second_bag_fee_long_haul_international: Second checked bag fee on long-haul international itineraries (USD)
  third_bag_fee_domestic_and_short_haul: Fee for the third and each further checked bag on domestic and short-haul
    international itineraries (USD)
  third_bag_fee_long_haul: Fee for the third and each further checked bag on long-haul international itineraries
    (USD)
  checked_bag_weight_allowance_lb: Weight up to which a checked bag carries no weight charge (integer, pounds)
  overweight_band_limit_lb: Upper weight of the first overweight band (integer, pounds)
  max_checked_bag_weight_lb: Heaviest checked bag accepted; heavier items must travel as cargo (integer, pounds)
  overweight_fee_first_band: Charge for a bag above the weight allowance up to overweight_band_limit_lb (USD)
  overweight_fee_second_band: Charge for a bag above overweight_band_limit_lb up to max_checked_bag_weight_lb (USD)
  standard_bag_linear_inches: Largest length plus width plus height carried without an oversize charge (integer,
    inches)
  oversize_limit_linear_inches: Largest length plus width plus height accepted as checked baggage (integer, inches)
  oversize_fee: Charge for a bag above standard_bag_linear_inches up to oversize_limit_linear_inches (USD)
  bag_fee_refund_delay_hours_domestic: Delivery delay beyond which the bag fee is refunded on a domestic itinerary
    (integer, hours)
  bag_fee_refund_delay_hours_international: Delivery delay beyond which the bag fee is refunded on an international
    flight of scheduled duration up to international_long_flight_threshold_hours (integer, hours)
  bag_fee_refund_delay_hours_international_long_flight: Delivery delay beyond which the bag fee is refunded on an
    international flight scheduled longer than international_long_flight_threshold_hours (integer, hours)
  international_long_flight_threshold_hours: Scheduled flight duration above which the long-flight bag delay threshold
    applies (integer, hours)
  status_credit_percent: Share of the segment fare counted as Summit qualifying dollars when the coupon is flown
    (integer, percent)
  premium_cabin_bonus_percent: Bonus award miles on a flown coupon of this fare brand, as a percent of the base
    award miles (integer, percent)
  complimentary_upgrade_eligible: Whether the fare brand may clear a complimentary Summit elite upgrade or an upgrade
    certificate (boolean)
  paid_upgrade_permitted: Whether a paid cabin upgrade may be purchased on the ticket (boolean)
  paid_upgrade_to_premium_economy_fee: Fee per segment for a paid upgrade into Premium Economy; 0 where not sold
    (USD)
  paid_upgrade_to_first_fee_short_segment: Fee per short segment for a paid upgrade into First; 0 where not sold
    (USD)
  paid_upgrade_to_first_fee_long_segment: Fee per long segment for a paid upgrade into First; 0 where not sold (USD)
  significant_change_hours_domestic: Departure or arrival shift that makes a domestic schedule change significant
    (integer, hours)
  significant_change_hours_international: Departure or arrival shift that makes an international schedule change
    significant (integer, hours)
  partner_reaccommodation_min_delay_hours: Minimum lateness of the earliest Crestline alternative, versus the original
    scheduled arrival, before rebooking on a partner carrier is offered (integer, hours)
  meal_voucher_min_delay_hours: Controllable arrival delay at which a meal voucher is issued (integer, hours)
  meal_voucher_amount: Face value of one meal voucher per passenger per disruption (USD)
  overnight_hotel_controllable: Whether a hotel night is provided when a controllable cancellation or misconnection
    forces an overnight stay away from home (boolean)
  goodwill_band_1_min_delay_hours: Controllable arrival delay at which the first goodwill band is reached (integer,
    hours)
  goodwill_band_2_min_delay_hours: Controllable arrival delay at which the second goodwill band is reached (integer,
    hours)
  delay_goodwill_band_1_usd: Goodwill value for a controllable delay in the first band (USD)
  delay_goodwill_band_2_usd: Goodwill value for a controllable delay in the second band (USD)
  cancellation_goodwill_usd: Goodwill value for a controllable cancellation or missed connection (USD)
  goodwill_miles_per_usd: Summit award miles given per dollar of goodwill when the customer takes miles instead
    of a voucher (integer, miles per USD)
  goodwill_max_per_12_months: Most goodwill payments one customer may receive within the rolling window of ticket_msr_goodwill_in_last_12_months
    (integer, count)
  downgrade_compensation_percent: Compensation for an involuntary downgrade on a segment, as a percent of that segment's
    fare (integer, percent)
  dbc_min_arrival_delay_hours: Arrival lateness of the alternate transportation below which denied-boarding compensation
    is not owed (integer, hours)
  dbc_low_band_upper_hours_domestic: Upper arrival lateness of the lower denied-boarding band on domestic flights
    (integer, hours)
  dbc_low_band_upper_hours_international: Upper arrival lateness of the lower denied-boarding band on international
    flights (integer, hours)
  dbc_low_band_percent_of_fare: Lower-band denied-boarding compensation as a percent of the one-way segment fare
    (integer, percent)
  dbc_low_band_cap_usd: Maximum lower-band denied-boarding compensation (USD)
  dbc_high_band_percent_of_fare: Upper-band denied-boarding compensation as a percent of the one-way segment fare
    (integer, percent)
  dbc_high_band_cap_usd: Maximum upper-band denied-boarding compensation (USD)
  dbc_voucher_uplift_percent: Increase over the cash amount when the passenger chooses a denied-boarding voucher
    instead of cash (integer, percent)
