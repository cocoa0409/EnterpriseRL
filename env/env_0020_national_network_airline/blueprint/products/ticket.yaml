        cancellation_goodwill_usd: =cancellation_goodwill_usd
        goodwill_miles_per_usd: =goodwill_miles_per_usd
        goodwill_max_per_12_months: =goodwill_max_per_12_months
      Crestline Premium Economy:
        meal_voucher_min_delay_hours: =meal_voucher_min_delay_hours
        meal_voucher_amount: =meal_voucher_amount
        overnight_hotel_controllable: =overnight_hotel_controllable
        goodwill_band_1_min_delay_hours: =goodwill_band_1_min_delay_hours
        goodwill_band_2_min_delay_hours: =goodwill_band_2_min_delay_hours
        delay_goodwill_band_1_usd: =delay_goodwill_band_1_usd
        delay_goodwill_band_2_usd: =delay_goodwill_band_2_usd
        cancellation_goodwill_usd: =cancellation_goodwill_usd
        goodwill_miles_per_usd: =goodwill_miles_per_usd
        goodwill_max_per_12_months: =goodwill_max_per_12_months
      Crestline First:
        meal_voucher_min_delay_hours: =meal_voucher_min_delay_hours
        meal_voucher_amount: =meal_voucher_amount
        overnight_hotel_controllable: =overnight_hotel_controllable
        goodwill_band_1_min_delay_hours: =goodwill_band_1_min_delay_hours
        goodwill_band_2_min_delay_hours: =goodwill_band_2_min_delay_hours
        delay_goodwill_band_1_usd: =delay_goodwill_band_1_usd
        delay_goodwill_band_2_usd: =delay_goodwill_band_2_usd
        cancellation_goodwill_usd: =cancellation_goodwill_usd
        goodwill_miles_per_usd: =goodwill_miles_per_usd
        goodwill_max_per_12_months: =goodwill_max_per_12_months
  measures:
  - ticket_msr_goodwill_in_last_12_months
  formula:
    when: disruption_cause == 'controllable'
    goodwill_usd: cancellation_goodwill_usd if disruption_type in ['cancellation', 'missed_connection'] else (delay_goodwill_band_2_usd
      if arrival_delay_minutes >= goodwill_band_2_min_delay_hours * 60 else (delay_goodwill_band_1_usd if arrival_delay_minutes
      >= goodwill_band_1_min_delay_hours * 60 else 0))
    goodwill_miles: goodwill_usd * goodwill_miles_per_usd
- id: ticket_evt_denied_boarding
  subject:
  - ticket_compensation
  rule: A passenger holding a confirmed ticketed reservation who checked in on time and is denied boarding involuntarily
    because the flight is oversold is owed denied-boarding compensation on every fare brand. Denied-boarding compensation
    requires a disruption record of type denied_boarding on the segment. No compensation is owed when the alternate
    transportation Crestline arranges arrives less than dbc_min_arrival_delay_hours hours after the original scheduled
    arrival, or when the passenger volunteered to give up the seat. Otherwise the compensation is dbc_low_band_percent_of_fare
    percent of the segment_fare_amount, capped at dbc_low_band_cap_usd, when the alternate transportation arrives
    at most dbc_low_band_upper_hours_domestic hours late on a domestic flight or at most dbc_low_band_upper_hours_international
    hours late on an international flight, and dbc_high_band_percent_of_fare percent capped at dbc_high_band_cap_usd
    when it arrives later or no alternate transportation is offered. The amount is paid in cash as denied_boarding_cash
    by default. A Crestline Denied Boarding Voucher is issued only when the passenger chooses it over cash, and
    its face value is the cash amount increased by dbc_voucher_uplift_percent percent, rounded to the cent. Denied-boarding
    compensation replaces goodwill for the same disruption and is additional to the rebooking.
  eligibility:
  - id: denied_boarding_record
    applies_to:
    - ticket_compensation
    kind: state
    condition: Denied-boarding compensation requires a disruption record of type denied_boarding on the segment.
    evidence_fields:
    - ticket_disruptions.disruption_id
    - ticket_disruptions.disruption_type
    - ticket_disruptions.arrival_delay_minutes
    - ticket_disruptions.segment_fare_amount
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - ticket_disruptions.disruption_id
      action_bindings:
        ticket_disruptions.disruption_id: source_disruption_id
    state_contract:
      field: ticket_disruptions.disruption_type
      allowed:
      - denied_boarding
  - id: voucher_by_choice
    applies_to:
    - ticket_compensation
    kind: caller_fact
    condition: A Crestline Denied Boarding Voucher is issued only when the passenger chooses it over cash
    evidence_fields:
    - ticket_disruptions.disruption_id
    evidence_contract:
      authority: caller_statement
      timing: pre_action
      correlation_keys:
      - - ticket_disruptions.disruption_id
      action_bindings:
        ticket_disruptions.disruption_id: source_disruption_id
  params:
    per_tier:
      Crestline Basic Economy:
        dbc_min_arrival_delay_hours: =dbc_min_arrival_delay_hours
        dbc_low_band_upper_hours_domestic: =dbc_low_band_upper_hours_domestic
        dbc_low_band_upper_hours_international: =dbc_low_band_upper_hours_international
        dbc_low_band_percent_of_fare: =dbc_low_band_percent_of_fare
        dbc_low_band_cap_usd: =dbc_low_band_cap_usd
        dbc_high_band_percent_of_fare: =dbc_high_band_percent_of_fare
        dbc_high_band_cap_usd: =dbc_high_band_cap_usd
        dbc_voucher_uplift_percent: =dbc_voucher_uplift_percent
      Crestline Main Cabin:
        dbc_min_arrival_delay_hours: =dbc_min_arrival_delay_hours
        dbc_low_band_upper_hours_domestic: =dbc_low_band_upper_hours_domestic
        dbc_low_band_upper_hours_international: =dbc_low_band_upper_hours_international
        dbc_low_band_percent_of_fare: =dbc_low_band_percent_of_fare
        dbc_low_band_cap_usd: =dbc_low_band_cap_usd
        dbc_high_band_percent_of_fare: =dbc_high_band_percent_of_fare
        dbc_high_band_cap_usd: =dbc_high_band_cap_usd
        dbc_voucher_uplift_percent: =dbc_voucher_uplift_percent
