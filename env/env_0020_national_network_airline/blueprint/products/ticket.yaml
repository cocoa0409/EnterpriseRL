- id: ticket_refunds
  subject:
  - ticket_refund
  - ticket_refund_payout
  rule: 'A ticket is refunded to the original form of payment in three situations: the fare brand has refundable_fare
    set to true and the customer asks to cancel; Crestline cancelled a flight on the ticket or made a significant
    schedule change to it and the customer declines the rebooking offered; or the risk-free void applies. A significant
    schedule change moves a departure or arrival by at least significant_change_hours_domestic hours on a domestic
    itinerary or significant_change_hours_international hours on an international itinerary, measured by arrival_delay_minutes
    on the disruption record, with the threshold itself counting as significant. An involuntary refund requires
    a disruption record on an unflown segment of the ticket whose disruption_type is cancellation or schedule_change.
    A customer who accepts the rebooking has no refund right for that disruption. A refundable-fare cancellation
    refunds the full residual_value; an involuntary refund refunds the residual_value, is available on every fare
    brand including Crestline Basic Economy, and the fees for services on the unflown segments are refunded alongside
    it under the fee-refund rule. A refund payout is made only on a ticket whose status is voided or refunded. Refunds
    to a card are processed within refund_processing_business_days_card business days and other forms within refund_processing_calendar_days_other
    calendar days. A ticket paid with award miles has its miles returned through the Summit award redeposit rule
    instead, and the portion of a ticket paid with a flight credit is re-issued as a flight credit rather than paid
    out. A nonrefundable fare brand cancelled voluntarily is never refunded; it can only be cancelled for credit.'
  eligibility:
  - id: involuntary_ground
    applies_to:
    - ticket_refund
    kind: state
    condition: An involuntary refund requires a disruption record on an unflown segment of the ticket whose disruption_type
      is cancellation or schedule_change.
    evidence_fields:
    - ticket_disruptions.disruption_id
    - ticket_disruptions.disruption_type
    - ticket_disruptions.arrival_delay_minutes
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - ticket_disruptions.disruption_id
      action_bindings:
        ticket_disruptions.disruption_id: source_disruption_id
    state_contract:
      field: ticket_disruptions.disruption_type
      allowed:
      - cancellation
      - schedule_change
  - id: rebooking_declined
    applies_to:
    - ticket_refund
    kind: caller_fact
    condition: A customer who accepts the rebooking has no refund right for that disruption.
    evidence_fields:
    - ticket_disruptions.disruption_id
    evidence_contract:
      authority: caller_statement
      timing: pre_action
      correlation_keys:
      - - ticket_disruptions.disruption_id
      action_bindings:
        ticket_disruptions.disruption_id: source_disruption_id
  - id: payout_after_status
    applies_to:
    - ticket_refund_payout
    kind: state
    condition: A refund payout is made only on a ticket whose status is voided or refunded.
    evidence_fields:
    - ticket_holdings.ticket_id
    - ticket_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - ticket_holdings.ticket_id
      action_bindings:
        ticket_holdings.ticket_id: ticket_id
    state_contract:
      field: ticket_holdings.status
      allowed:
      - voided
      - refunded
  params:
    per_tier:
      Crestline Basic Economy:
        refundable_fare: =refundable_fare
        significant_change_hours_domestic: =significant_change_hours_domestic
        significant_change_hours_international: =significant_change_hours_international
        refund_processing_business_days_card: =refund_processing_business_days_card
        refund_processing_calendar_days_other: =refund_processing_calendar_days_other
      Crestline Main Cabin:
        refundable_fare: =refundable_fare
        significant_change_hours_domestic: =significant_change_hours_domestic
        significant_change_hours_international: =significant_change_hours_international
        refund_processing_business_days_card: =refund_processing_business_days_card
        refund_processing_calendar_days_other: =refund_processing_calendar_days_other
      Crestline Main Plus:
        refundable_fare: =refundable_fare
