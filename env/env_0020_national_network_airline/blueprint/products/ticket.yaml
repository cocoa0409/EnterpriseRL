- id: ticket_evt_irrops_reaccommodation
  subject:
  - ticket_disruption_record
  - ticket_reaccommodation
  - ticket_itinerary_update
  rule: Operations control records every irregular operation affecting a ticketed segment as a disruption record
    — delay, cancellation, missed_connection caused by an inbound Crestline delay, schedule_change, denied_boarding,
    involuntary_downgrade or bag_delayed — each with its disruption_cause. A disruption is controllable when it
    arises from crew, maintenance, IT, catering, fueling or other causes within Crestline's control, and uncontrollable
    when it arises from weather, air traffic control, airport authority, security or medical diversions; the cause
    on the disruption record is authoritative and a customer's account of the cause never replaces it. When a flight
    is cancelled, a connection is missed, the passenger is denied boarding or a schedule change is significant,
    the passenger is rebooked free of change fee and fare difference on the next Crestline flight with a seat in
    the same cabin to the same destination, on every fare brand including Crestline Basic Economy. A reaccommodation
    is recorded only against an existing disruption record on the same ticket whose disruption_type is cancellation,
    missed_connection, denied_boarding or schedule_change. Reaccommodation is available only while the ticket is
    ticketed or partially_flown. Rebooking on a partner carrier is offered only when the earliest Crestline alternative
    arrives at least partner_reaccommodation_min_delay_hours hours after the original scheduled arrival. The rebooked
    flight replaces the disrupted segment and the ticket's next_departure_at is updated to it. A customer may decline
    the rebooking and take an involuntary refund under the refund rule instead; the two are mutually exclusive for
    the same disruption. A delay below the significant schedule-change thresholds on a flight that still operates
    gives no rebooking right; the customer may buy a same-day change under that rule.
  eligibility:
  - id: rebook_ticket_open
    applies_to:
    - ticket_reaccommodation
    kind: state
    condition: Reaccommodation is available only while the ticket is ticketed or partially_flown.
    evidence_fields:
    - ticket_holdings.ticket_id
    - ticket_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - ticket_holdings.ticket_id
      action_bindings:
        ticket_holdings.ticket_id: ticket_id
    state_contract:
      field: ticket_holdings.status
      allowed:
      - ticketed
      - partially_flown
  - id: rebook_ground
    applies_to:
    - ticket_reaccommodation
    kind: state
    condition: A reaccommodation is recorded only against an existing disruption record on the same ticket whose
      disruption_type is cancellation, missed_connection, denied_boarding or schedule_change.
    evidence_fields:
    - ticket_disruptions.disruption_id
    - ticket_disruptions.disruption_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - ticket_disruptions.disruption_id
      action_bindings:
        ticket_disruptions.disruption_id: source_disruption_id
    state_contract:
      field: ticket_disruptions.disruption_type
      allowed:
      - cancellation
      - missed_connection
      - denied_boarding
      - schedule_change
  params:
    per_tier:
      Crestline Basic Economy:
        partner_reaccommodation_min_delay_hours: =partner_reaccommodation_min_delay_hours
        significant_change_hours_domestic: =significant_change_hours_domestic
        significant_change_hours_international: =significant_change_hours_international
      Crestline Main Cabin:
        partner_reaccommodation_min_delay_hours: =partner_reaccommodation_min_delay_hours
        significant_change_hours_domestic: =significant_change_hours_domestic
        significant_change_hours_international: =significant_change_hours_international
      Crestline Main Plus:
        partner_reaccommodation_min_delay_hours: =partner_reaccommodation_min_delay_hours
        significant_change_hours_domestic: =significant_change_hours_domestic
        significant_change_hours_international: =significant_change_hours_international
      Crestline Main Flexible:
        partner_reaccommodation_min_delay_hours: =partner_reaccommodation_min_delay_hours
        significant_change_hours_domestic: =significant_change_hours_domestic
        significant_change_hours_international: =significant_change_hours_international
      Crestline Premium Economy:
        partner_reaccommodation_min_delay_hours: =partner_reaccommodation_min_delay_hours
        significant_change_hours_domestic: =significant_change_hours_domestic
        significant_change_hours_international: =significant_change_hours_international
      Crestline First:
        partner_reaccommodation_min_delay_hours: =partner_reaccommodation_min_delay_hours
        significant_change_hours_domestic: =significant_change_hours_domestic
        significant_change_hours_international: =significant_change_hours_international
- id: ticket_evt_irrops_compensation
  subject:
  - ticket_compensation
  rule: 'Meal vouchers, hotel nights and goodwill are provided only when the disruption record''s disruption_cause
    is controllable; an uncontrollable disruption receives rebooking but no meal voucher, hotel night or goodwill.
    A controllable disruption whose arrival_delay_minutes reaches meal_voucher_min_delay_hours hours earns one meal_voucher
    of meal_voucher_amount per passenger. A controllable cancellation or missed connection that forces an overnight
    stay away from the passenger''s home airport earns one hotel_night when overnight_hotel_controllable is true.
    Goodwill is paid once per disruption: delay_goodwill_band_1_usd when a controllable delay''s arrival_delay_minutes
    reaches goodwill_band_1_min_delay_hours hours, delay_goodwill_band_2_usd when it reaches goodwill_band_2_min_delay_hours
    hours, and cancellation_goodwill_usd for a controllable cancellation or missed connection; the bands do not
    add, and only the single highest amount reached is paid. The customer takes the goodwill either as a Crestline
    Disruption Voucher of that amount (goodwill_ecertificate) or as Summit miles at goodwill_miles_per_usd miles
    per dollar (goodwill_miles) credited to the passenger''s membership; the two forms never combine and a customer
    without a Summit membership receives the voucher. A customer receives goodwill at most goodwill_max_per_12_months
    times as counted by ticket_msr_goodwill_in_last_12_months, using the fare brand of the disrupted ticket; beyond
    that cap the disruption receives meal and hotel care only. Each disruption record receives at most one compensation
    entry of each compensation_type. Denied boarding and involuntary downgrades are compensated under their own
    rules and never also receive goodwill for the same disruption.'
  eligibility:
  - id: controllable_only
    applies_to:
    - ticket_compensation
    kind: state
    condition: Meal vouchers, hotel nights and goodwill are provided only when the disruption record's disruption_cause
      is controllable
    evidence_fields:
    - ticket_disruptions.disruption_id
    - ticket_disruptions.disruption_cause
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - ticket_disruptions.disruption_id
      action_bindings:
        ticket_disruptions.disruption_id: source_disruption_id
    state_contract:
      field: ticket_disruptions.disruption_cause
      allowed:
      - controllable
  - id: one_per_type
    applies_to:
    - ticket_compensation
    kind: dedup
    condition: Each disruption record receives at most one compensation entry of each compensation_type.
    evidence_fields:
    - ticket_disruptions.source_disruption_id
    - ticket_disruptions.compensation_type
    - ticket_disruptions.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - ticket_disruptions.source_disruption_id
        - ticket_disruptions.compensation_type
      action_bindings:
        ticket_disruptions.source_disruption_id: source_disruption_id
        ticket_disruptions.compensation_type: compensation_type
    dedup_contract:
      table: ticket_disruptions
      mode: separate_record
      object_bindings:
        source_disruption_id: source_disruption_id
        compensation_type: compensation_type
      duplicate_filters:
        event_type:
        - ticket_compensation
      distinct_fields: []
  params:
    per_tier:
      Crestline Basic Economy:
        meal_voucher_min_delay_hours: =meal_voucher_min_delay_hours
        meal_voucher_amount: =meal_voucher_amount
        overnight_hotel_controllable: =overnight_hotel_controllable
        goodwill_band_1_min_delay_hours: =goodwill_band_1_min_delay_hours
        goodwill_band_2_min_delay_hours: =goodwill_band_2_min_delay_hours
        delay_goodwill_band_1_usd: =delay_goodwill_band_1_usd
        delay_goodwill_band_2_usd: =delay_goodwill_band_2_usd
        cancellation_goodwill_usd: =cancellation_goodwill_usd
        goodwill_miles_per_usd: =goodwill_miles_per_usd
        goodwill_max_per_12_months: =goodwill_max_per_12_months
      Crestline Main Cabin:
        meal_voucher_min_delay_hours: =meal_voucher_min_delay_hours
        meal_voucher_amount: =meal_voucher_amount
        overnight_hotel_controllable: =overnight_hotel_controllable
        goodwill_band_1_min_delay_hours: =goodwill_band_1_min_delay_hours
        goodwill_band_2_min_delay_hours: =goodwill_band_2_min_delay_hours
        delay_goodwill_band_1_usd: =delay_goodwill_band_1_usd
        delay_goodwill_band_2_usd: =delay_goodwill_band_2_usd
        cancellation_goodwill_usd: =cancellation_goodwill_usd
        goodwill_miles_per_usd: =goodwill_miles_per_usd
        goodwill_max_per_12_months: =goodwill_max_per_12_months
      Crestline Main Plus:
        meal_voucher_min_delay_hours: =meal_voucher_min_delay_hours
        meal_voucher_amount: =meal_voucher_amount
        overnight_hotel_controllable: =overnight_hotel_controllable
        goodwill_band_1_min_delay_hours: =goodwill_band_1_min_delay_hours
        goodwill_band_2_min_delay_hours: =goodwill_band_2_min_delay_hours
        delay_goodwill_band_1_usd: =delay_goodwill_band_1_usd
        delay_goodwill_band_2_usd: =delay_goodwill_band_2_usd
        cancellation_goodwill_usd: =cancellation_goodwill_usd
        goodwill_miles_per_usd: =goodwill_miles_per_usd
        goodwill_max_per_12_months: =goodwill_max_per_12_months
      Crestline Main Flexible:
        meal_voucher_min_delay_hours: =meal_voucher_min_delay_hours
        meal_voucher_amount: =meal_voucher_amount
        overnight_hotel_controllable: =overnight_hotel_controllable
        goodwill_band_1_min_delay_hours: =goodwill_band_1_min_delay_hours
        goodwill_band_2_min_delay_hours: =goodwill_band_2_min_delay_hours
        delay_goodwill_band_1_usd: =delay_goodwill_band_1_usd
