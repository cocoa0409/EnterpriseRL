- id: ticket_evt_fee_refunds
  subject:
  - ticket_fee_refund
  rule: 'A fee refund reverses exactly one earlier fee entry on the same ticket, named by refunded_service_id, and
    refunds its full amount to the original payment. A fee is refunded when a purchased seat was not provided because
    Crestline reassigned the passenger (seat_not_provided); when a checked bag was delivered late beyond the threshold
    (bag_delayed); when a paid upgrade was not provided (upgrade_not_provided); when an irregular operation moved
    the passenger off the segment or the ticket was refunded involuntarily so the service went unused (service_unused_involuntary_change);
    when the ticket was voided inside the risk-free window (risk_free_cancellation); or when the fee was charged
    in error (charged_in_error). A bag fee is refunded for delay only when a disruption record of type bag_delayed
    on the same ticket shows a bag_delay_hours strictly greater than the applicable threshold: bag_fee_refund_delay_hours_domestic
    on a domestic itinerary, bag_fee_refund_delay_hours_international on an international flight whose scheduled_block_minutes
    is at most international_long_flight_threshold_hours hours, and bag_fee_refund_delay_hours_international_long_flight
    on a longer international flight. Each fee entry can be refunded at most once. Change fees and same-day change
    fees are refunded only on a risk-free void or when charged in error. A service the passenger actually used is
    never refunded on request, and fees on a ticket cancelled voluntarily for credit are not refunded.'
  eligibility:
  - id: one_refund_per_fee
    applies_to:
    - ticket_fee_refund
    kind: dedup
    condition: Each fee entry can be refunded at most once.
    evidence_fields:
    - ticket_services.service_id
    - ticket_services.refunded_service_id
    - ticket_services.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - ticket_services.service_id
      action_bindings:
        ticket_services.service_id: refunded_service_id
    dedup_contract:
      table: ticket_services
      mode: separate_record
      object_bindings:
        refunded_service_id: refunded_service_id
      duplicate_filters:
        event_type:
        - ticket_fee_refund
      distinct_fields: []
  - id: bag_delay_record
    applies_to:
    - ticket_fee_refund
    kind: authorization
    condition: A bag fee is refunded for delay only when a disruption record of type bag_delayed on the same ticket
      shows a bag_delay_hours strictly greater than the applicable threshold
    evidence_fields:
    - ticket_disruptions.disruption_id
    - ticket_disruptions.disruption_type
    - ticket_disruptions.bag_delay_hours
    - ticket_disruptions.scheduled_block_minutes
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - ticket_disruptions.disruption_id
      action_bindings:
        ticket_disruptions.disruption_id: source_disruption_id
  params:
    per_tier:
      Crestline Basic Economy:
        bag_fee_refund_delay_hours_domestic: =bag_fee_refund_delay_hours_domestic
        bag_fee_refund_delay_hours_international: =bag_fee_refund_delay_hours_international
        bag_fee_refund_delay_hours_international_long_flight: =bag_fee_refund_delay_hours_international_long_flight
        international_long_flight_threshold_hours: =international_long_flight_threshold_hours
      Crestline Main Cabin:
        bag_fee_refund_delay_hours_domestic: =bag_fee_refund_delay_hours_domestic
        bag_fee_refund_delay_hours_international: =bag_fee_refund_delay_hours_international
        bag_fee_refund_delay_hours_international_long_flight: =bag_fee_refund_delay_hours_international_long_flight
        international_long_flight_threshold_hours: =international_long_flight_threshold_hours
      Crestline Main Plus:
