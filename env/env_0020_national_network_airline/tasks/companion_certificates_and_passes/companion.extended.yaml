events:
- type: companion_issue
  target: companion_holdings
  mutation: create
  meaning: A companion certificate or pass is issued to a holder.
  grain: One row per certificate or pass.
  fields:
    variant_name: product issued
    certificate_number: number
    issue_source: ground of issue
    membership_id: holder's membership
    issue_date: date issued
    book_by_date: computed book-by date
    designation_changes_used: opens at zero
  triggers:
  - event: companion:companion_trip_grant
    map:
      entry_date: issue_date
- type: companion_trip_grant
  target: companion_ledger
  meaning: The companion trips of a newly issued certificate or pass are granted.
  grain: One entry per certificate or pass.
  distinguish_by:
  - entry_date
  fields:
    entry_date: date granted
    trips: trips granted
  account: companion_trips
  direction: in
  triggers:
  - event: companion:companion_activate
    map: {}
- type: companion_activate
  target: companion_holdings
  mutation:
    transition:
      from: issued
      to: active
  meaning: The certificate or pass becomes bookable.
  grain: One per certificate or pass.
  fields:
    trips_remaining: trips granted
  triggers: []
- type: companion_trip_redeem
  target: companion_ledger
  meaning: A companion trip is booked on the holder's reservation.
  grain: One entry per companion ticket issued.
  distinguish_by:
  - companion_ticket_number
  fields:
    entry_date: booking date
    trips: one trip consumed
    companion_ticket_number: companion ticket
    primary_ticket_number: holder's ticket
    companion_name: companion
    travel_date: first departure
    booking_channel: channel
  account: companion_trips
  direction: out
  triggers:
  - event: companion:companion_fare_charge
    map:
      companion_ticket_number: companion_ticket_number
      entry_date: entry_date
      charge_component: companion_fare
- type: companion_fare_charge
  target: companion_ledger
  meaning: The companion fare, taxes or a companion service fee is charged to the holder.
  grain: One entry per charge component per companion ticket or service.
  distinguish_by:
  - companion_ticket_number
  - charge_component
  - entry_date
  fields:
    entry_date: date charged
    amount: amount charged
    charge_component: component
    companion_ticket_number: companion ticket charged for
  account: companion_charges
  direction: in
  triggers: []
- type: companion_mark_used
  target: companion_holdings
  mutation:
    transition:
      from: active
      to: used
  meaning: The last companion trip was booked.
  grain: One per exhaustion.
  fields:
    closed_date: date the last trip was booked
  triggers: []
- type: companion_trip_reinstate
  target: companion_ledger
  meaning: A cancelled companion booking returns its trip.
  grain: One entry per cancelled companion ticket.
  distinguish_by:
  - reversed_entry_id
  fields:
    entry_date: date reinstated
    trips: one trip returned
    reversed_entry_id: booking reversed
    companion_ticket_number: companion ticket cancelled
    reinstatement_ground: why reinstated
  account: companion_trips
  direction: in
  triggers: []
- type: companion_restore
  target: companion_holdings
  mutation:
    transition:
      from: used
      to: active
  meaning: A used certificate or pass becomes bookable again after a trip is reinstated.
  grain: One per restoration.
  fields:
    book_by_date: book-by date after any irregular-operations extension
    closed_date: cleared to empty
  triggers: []
- type: companion_fare_refund
  target: companion_ledger
  meaning: A companion charge is refunded.
  grain: One entry per charge refunded.
  distinguish_by:
  - reversed_entry_id
  fields:
    entry_date: date refunded
    amount: amount refunded
    reversed_entry_id: charge refunded
    charge_component: component refunded
    companion_ticket_number: companion ticket
  account: companion_charges
  direction: out
  triggers: []
- type: companion_expire
  target: companion_holdings
  mutation:
    transition:
      from: active
      to: expired
  meaning: The book_by_date passed with trips remaining.
  grain: One per certificate or pass.
  fields:
    closed_date: day after the book_by_date
  triggers:
  - event: companion:companion_trip_forfeit
    map:
      forfeit_reason: expiry
      entry_date: closed_date
- type: companion_revoke
  target: companion_holdings
  mutation:
    transition:
    - from: issued
      to: revoked
    - from: active
      to: revoked
  meaning: The certificate or pass is withdrawn.
  grain: One per certificate or pass.
  fields:
    revocation_reason: ground
    closed_date: date revoked
  triggers:
  - event: companion:companion_trip_forfeit
    map:
      forfeit_reason: revocation
      entry_date: closed_date
- type: companion_trip_forfeit
  target: companion_ledger
  meaning: Remaining companion trips are forfeited on expiry or revocation.
  grain: One entry per forfeiture.
  distinguish_by:
  - forfeit_reason
  fields:
    entry_date: date forfeited
    trips: trips forfeited
    forfeit_reason: ground
  account: companion_trips
  direction: out
  triggers: []
- type: companion_designate
  target: companion_holdings
  mutation: update
  meaning: The companion named on a pass is designated or changed.
  grain: One row per pass (the pass record itself).
  fields:
