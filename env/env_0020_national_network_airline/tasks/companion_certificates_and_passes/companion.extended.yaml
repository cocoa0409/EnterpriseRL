# ============================================================================
# extended_policies (erl-task-instantiate): multi-factor calculation policies of this difficulty
# ============================================================================
extended_policies:
- id: companion_ext_cancelled_fare_refund
  base_policy_refs:
  - companion_cancellation
  - companion_refund_controls
  overwrite:
  - base_policy: companion_refund_controls
    superseded_clause: >-
      a refund equals the amount of the charge it names
    replaced_by: >-
      The companion fare refund equals the most recent companion fare charge on the certificate less the final
      cancellation retention, never below zero, rounded half up to the cent.
  trigger: state_due
  subject:
  - companion_fare_refund
  computes: amount
  target_tool: refund_companion_fare_charge_1d800070
  params:
    late_notice_days: 7
    short_notice_days: 21
    late_retention_pct: 30
    short_retention_usd: 40
    third_booking_multiplier: 1.25
    second_booking_multiplier: 1.1
    long_tenure_months: 120
    mid_tenure_months: 60
    long_tenure_waiver_pct: 40
    mid_tenure_waiver_pct: 20
    high_spend_usd: 15000
    mid_spend_usd: 5000
    high_spend_waiver_pct: 30
    mid_spend_waiver_pct: 15
  rule: >-
    Every rounding in this rule is half up to the cent, a value lying exactly on a half cent going up to the next cent. When a companion booking is cancelled, the companion fare charged for it is refunded to the holder by the
    companion desk in one refund entry that names that companion fare charge, and the refund is fixed as the
    companion fare less any cancellation retention. The refund of the companion fare of a cancelled booking is the
    amount of the most recent companion fare charge on the certificate, refunded in full with no cancellation
    retention. The cancellation retention starts from how the booking was cancelled, read from the most recent
    trip reinstatement on the certificate and the travel date of the most recent companion booking: a voluntary
    cancellation whose reinstatement date is late_notice_days calendar days or fewer before that travel date
    carries a retention of late_retention_pct percent of the companion fare charge, rounded half up to the cent; a
    voluntary cancellation whose reinstatement date is more than late_notice_days but no more than
    short_notice_days calendar days before that travel date carries a flat retention of short_retention_usd;
    every other cancellation, including every cancellation Crestline made, carries no retention. The days before
    travel are counted from the reinstatement date to the travel date, the reinstatement date excluded and the
    travel date included. The retention is then scaled by how often the certificate has been booked, counting
    every companion booking entry on the certificate: a certificate booked three or more times multiplies the
    retention by third_booking_multiplier, a certificate booked exactly twice multiplies it by
    second_booking_multiplier, and a certificate booked once leaves it unscaled. Two waivers reduce the scaled
    retention, and they are first added into one waiver percentage that is applied once to the scaled retention,
    never one after the other. The membership-age waiver is read from the whole calendar months between the
    enrolled date of the holder's Summit membership and the handling date: long_tenure_months months or more
    waive long_tenure_waiver_pct percent, mid_tenure_months to fewer than long_tenure_months months waive
    mid_tenure_waiver_pct percent, and fewer than mid_tenure_months months waive nothing. The qualifying-spend
    waiver is read from the qualifying dollars credited to the holder's Summit membership by qualifying-dollar
    accrual entries dated in the last 12 months counted back from the handling date: high_spend_usd or more waive
    high_spend_waiver_pct percent, mid_spend_usd to less than high_spend_usd waive mid_spend_waiver_pct percent,
    and less than mid_spend_usd waives nothing. The final cancellation retention is the retention multiplied by
    the booking-count factor and then by one minus the combined waiver percentage, rounded half up to the cent once at
    that point. The companion fare refund equals the most recent companion fare charge on the certificate less
    the final cancellation retention, never below zero, rounded half up to the cent.
  prerequisite: []
  cross_category:
  - category: loyalty
    as: branch
    reads:
    - enrolled_date
    - loyalty_activity.qualifying_dollars
    note: The membership-age waiver reads the Summit enrolled date and the qualifying-spend waiver aggregates the
      holder's qualifying-dollar accrual entries of the last 12 months.
  compute:
  - fare_charged: "LATEST('companion_ledger', 'amount', date_field='entry_date', event_type='companion_fare_charge', charge_component='companion_fare')"
  - cancel_ground: "LATEST('companion_ledger', 'reinstatement_ground', date_field='entry_date', event_type='companion_trip_reinstate')"
  - cancel_date: "LATEST('companion_ledger', 'entry_date', date_field='entry_date', event_type='companion_trip_reinstate')"
  - cancelled_travel_date: "LATEST('companion_ledger', 'travel_date', date_field='entry_date', event_type='companion_trip_redeem')"
  - notice_days: "DAYS(cancel_date, cancelled_travel_date)"
  - retention_core: "RND(fare_charged * K('late_retention_pct') / 100 + 0.0000001, 2) if (cancel_ground == 'voluntary_cancellation' and notice_days <= K('late_notice_days')) else (K('short_retention_usd') if (cancel_ground == 'voluntary_cancellation' and notice_days <= K('short_notice_days')) else 0)"
  - bookings_on_certificate: "COUNT('companion_ledger', date_field='entry_date', event_type='companion_trip_redeem')"
  - booking_count_factor: "K('third_booking_multiplier') if bookings_on_certificate >= 3 else (K('second_booking_multiplier') if bookings_on_certificate == 2 else 1)"
  - membership_months: "MONTHS(CFIELD('loyalty', 'enrolled_date'), NOW)"
  - tenure_waiver_pct: "K('long_tenure_waiver_pct') if membership_months >= K('long_tenure_months') else (K('mid_tenure_waiver_pct') if membership_months >= K('mid_tenure_months') else 0)"
  - qualifying_dollars_12m: "XSUM('loyalty', 'loyalty_activity', 'qualifying_dollars', within_months=12, date_field='activity_date', event_type='loyalty_mqd_accrual')"
  - spend_waiver_pct: "K('high_spend_waiver_pct') if qualifying_dollars_12m >= K('high_spend_usd') else (K('mid_spend_waiver_pct') if qualifying_dollars_12m >= K('mid_spend_usd') else 0)"
  - final_retention: "RND(retention_core * booking_count_factor * (1 - (tenure_waiver_pct + spend_waiver_pct) / 100) + 0.0000001, 2)"
  - result: "MX(0, RND(fare_charged - final_retention + 0.0000001, 2))"
  compute_basis:
    fare_charged: "The refund of the companion fare of a cancelled booking is the amount of the most recent companion fare charge on the certificate, refunded in full with no cancellation retention."
    cancel_ground: "The cancellation retention starts from how the booking was cancelled, read from the most recent trip reinstatement on the certificate and the travel date of the most recent companion booking"
    notice_days: "The days before travel are counted from the reinstatement date to the travel date, the reinstatement date excluded and the travel date included."
    retention_core: "a voluntary cancellation whose reinstatement date is late_notice_days calendar days or fewer before that travel date carries a retention of late_retention_pct percent of the companion fare charge, rounded half up to the cent; a voluntary cancellation whose reinstatement date is more than late_notice_days but no more than short_notice_days calendar days before that travel date carries a flat retention of short_retention_usd; every other cancellation, including every cancellation Crestline made, carries no retention."
    bookings_on_certificate: "counting every companion booking entry on the certificate"
    booking_count_factor: "a certificate booked three or more times multiplies the retention by third_booking_multiplier, a certificate booked exactly twice multiplies it by second_booking_multiplier, and a certificate booked once leaves it unscaled."
    membership_months: "The membership-age waiver is read from the whole calendar months between the enrolled date of the holder's Summit membership and the handling date"
    tenure_waiver_pct: "long_tenure_months months or more waive long_tenure_waiver_pct percent, mid_tenure_months to fewer than long_tenure_months months waive mid_tenure_waiver_pct percent, and fewer than mid_tenure_months months waive nothing."
    qualifying_dollars_12m: "The qualifying-spend waiver is read from the qualifying dollars credited to the holder's Summit membership by qualifying-dollar accrual entries dated in the last 12 months counted back from the handling date"
    spend_waiver_pct: "high_spend_usd or more waive high_spend_waiver_pct percent, mid_spend_usd to less than high_spend_usd waive mid_spend_waiver_pct percent, and less than mid_spend_usd waives nothing."
    final_retention: "The final cancellation retention is the retention multiplied by the booking-count factor and then by one minus the combined waiver percentage, rounded half up to the cent once at that point."
    result: "The companion fare refund equals the most recent companion fare charge on the certificate less the final cancellation retention, never below zero, rounded half up to the cent."
  factors:
  - id: fare_cancellation_retention
    effect: method
    decides: retention_core
    bindings: [cancel_ground, cancel_date, cancelled_travel_date, notice_days, retention_core]
    ladder:
    - when: "a voluntary cancellation whose reinstatement date is late_notice_days calendar days or fewer before the travel date of the cancelled booking"
      method: "the retention is late_retention_pct percent of the companion fare charge, rounded half up to the cent"
    - when: "a voluntary cancellation whose reinstatement date is more than late_notice_days but no more than short_notice_days calendar days before that travel date"
      method: "the retention is the flat amount short_retention_usd, whatever the companion fare"
    - when: "otherwise, including every cancellation Crestline made"
      method: "no retention is taken and the companion fare is refunded in full"
    baseline:
      retention_core: "0"
    evidence: [history, date]
    cross_difficulty: null
  - id: fare_retention_booking_count
    effect: parameter
    decides: booking_count_factor
    bindings: [bookings_on_certificate, booking_count_factor]
    ladder:
    - when: "the certificate carries three or more companion booking entries"
      value: "K('third_booking_multiplier')"
    - when: "the certificate carries exactly two companion booking entries"
      value: "K('second_booking_multiplier')"
    - when: "otherwise (one booking entry)"
      value: "1"
    baseline:
      booking_count_factor: "1"
    evidence: [history]
    cross_difficulty: null
  - id: fare_retention_membership_age_waiver
    effect: parameter
    decides: tenure_waiver_pct
    bindings: [membership_months, tenure_waiver_pct]
    ladder:
    - when: "the holder's Summit membership was enrolled long_tenure_months or more whole months before the handling date"
      value: "K('long_tenure_waiver_pct')"
    - when: "enrolled mid_tenure_months to fewer than long_tenure_months whole months before the handling date"
      value: "K('mid_tenure_waiver_pct')"
    - when: "otherwise"
      value: "0"
    baseline:
      tenure_waiver_pct: "0"
    evidence: [cross_category, date]
    cross_difficulty: loyalty
  - id: fare_retention_qualifying_spend_waiver
    effect: parameter
    decides: spend_waiver_pct
    bindings: [qualifying_dollars_12m, spend_waiver_pct]
    ladder:
    - when: "qualifying-dollar accruals of the last 12 months total high_spend_usd or more"
      value: "K('high_spend_waiver_pct')"
    - when: "they total mid_spend_usd to less than high_spend_usd"
      value: "K('mid_spend_waiver_pct')"
    - when: "otherwise"
      value: "0"
    baseline:
      spend_waiver_pct: "0"
    evidence: [cross_category, history]
    cross_difficulty: loyalty
  baseline:
    rule: >-
      The refund of the companion fare of a cancelled booking is the amount of the most recent companion fare charge
      on the certificate, refunded in full with no cancellation retention.
    params: []
  inputs:
    history:
    - {table: companion_ledger, aggregate: latest, field: amount, filters: {event_type: companion_fare_charge, charge_component: companion_fare}}
    - {table: companion_ledger, aggregate: count, field: companion_entry_id, filters: {event_type: companion_trip_redeem}}
    - {category: loyalty, table: loyalty_activity, aggregate: sum, field: qualifying_dollars, within_months: 12, filters: {event_type: loyalty_mqd_accrual}}
    cross_category: [loyalty]
- id: companion_ext_cancelled_surcharge_refund
  base_policy_refs:
  - companion_cancellation
  - companion_refund_controls
  overwrite:
  - base_policy: companion_refund_controls
    superseded_clause: >-
      a refund equals the amount of the charge it names
    replaced_by: >-
      The Hawaii surcharge refund equals the most recent Hawaii surcharge charge on the certificate less the final
      surcharge retention, never below zero, rounded half up to the cent.
  trigger: state_due
  subject:
  - companion_fare_refund
  computes: amount
  target_tool: refund_companion_hawaii_surcharge_2c74daac
  params:
    proportional_below_ratio: 0.9
    surcharge_handling_usd: 25
    repeat_two_factor: 1.5
    repeat_one_factor: 1.2
    top_tier_waiver_pct: 50
    mid_tier_waiver_pct: 25
    long_lead_days: 45
    mid_lead_days: 21
    long_lead_waiver_pct: 20
    mid_lead_waiver_pct: 10
  rule: >-
    Every rounding in this rule is half up to the cent, a value lying exactly on a half cent going up to the next cent. When a companion booking that carried a Hawaii surcharge is cancelled, the surcharge is refunded to the holder
    by the companion desk in one refund entry that names that Hawaii surcharge charge. The refund of a cancelled
    booking's Hawaii surcharge is fixed only after the certificate's ledger carries the refund of that booking's
    companion fare. The refund of the Hawaii surcharge of a cancelled booking is the amount of the most recent
    Hawaii surcharge charge on the certificate, refunded in full. How much of the surcharge comes back follows the
    share of the companion fare that came back, that share being the most recent companion fare refund on the
    certificate divided by the most recent companion fare charge on the certificate: when that share is below
    proportional_below_ratio, the surcharge is refunded in that same share, rounded half up to the cent; when the share is
    proportional_below_ratio or more but below one, the surcharge is refunded less a flat surcharge handling amount
    of surcharge_handling_usd; when the whole companion fare came back, the surcharge is refunded in full. The
    surcharge retention is the surcharge charge less the refund that share gives. The surcharge retention is then
    scaled by the Hawaii surcharge refunds already recorded on the certificate with an entry date in the last 12
    months counted back from the handling date: two or more such refunds multiply it by repeat_two_factor,
    exactly one multiplies it by repeat_one_factor, and none leaves it unscaled. Two waivers reduce the scaled
    surcharge retention, first added into one waiver percentage that is applied once, never one after the other.
    The status waiver follows the current tier of the holder's Summit membership: Summit Diamond or Summit
    Chairman waives top_tier_waiver_pct percent, Summit Gold or Summit Platinum waives mid_tier_waiver_pct percent,
    and any other tier waives nothing. The advance-planning waiver follows the calendar days from the entry date
    of the most recent companion booking on the certificate to its travel date, the entry date excluded and the
    travel date included: long_lead_days days or more waive long_lead_waiver_pct percent, mid_lead_days to fewer
    than long_lead_days days waive mid_lead_waiver_pct percent, and fewer than mid_lead_days days waive nothing.
    The final surcharge retention is the surcharge retention multiplied by the repeat factor and then by one minus
    the combined waiver percentage, rounded half up to the cent once at that point. The Hawaii surcharge refund equals the
    most recent Hawaii surcharge charge on the certificate less the final surcharge retention, never below zero,
    rounded half up to the cent.
  prerequisite:
  - problem: companion_ext_cancelled_fare_refund
    kind: value_input
    gate: fare_refunded
    form: state
    policy_source: >-
      The refund of a cancelled booking's Hawaii surcharge is fixed only after the certificate's ledger carries the
      refund of that booking's companion fare.
    condition: >-
      The certificate's ledger carries a refund entry of component companion fare that names the cancelled
      booking's companion fare charge, so the most recent companion fare refund on the certificate is the one for
      that booking.
    resolved_by: refund_companion_fare_charge_1d800070
    effect: >-
      Once the companion fare refund of the cancelled booking is posted, the fare share read by the surcharge
      refund is that booking's refunded fare over its charged fare; before it, the most recent companion fare
      refund on the certificate belongs to an earlier booking and the share, and with it the surcharge refund,
      comes out different.
  cross_category:
  - category: loyalty
    as: branch
    reads:
    - variant_name
    note: The status waiver on the surcharge retention is decided by the current Summit tier of the holder.
  compute:
  - surcharge_charged: "LATEST('companion_ledger', 'amount', date_field='entry_date', event_type='companion_fare_charge', charge_component='hawaii_surcharge')"
  - fare_charged_for_share: "LATEST('companion_ledger', 'amount', date_field='entry_date', event_type='companion_fare_charge', charge_component='companion_fare')"
  - fare_refunded: "LATEST('companion_ledger', 'amount', date_field='entry_date', event_type='companion_fare_refund', charge_component='companion_fare') or 0"
  - fare_refund_share: "fare_refunded / fare_charged_for_share"
  - surcharge_share_refund: "RND(surcharge_charged * fare_refund_share + 0.0000001, 2) if fare_refund_share < K('proportional_below_ratio') else (surcharge_charged - K('surcharge_handling_usd') if fare_refund_share < 1 else surcharge_charged)"
  - surcharge_retention: "RND(surcharge_charged - surcharge_share_refund + 0.0000001, 2)"
  - surcharge_refunds_12m: "COUNT('companion_ledger', within_months=12, date_field='entry_date', event_type='companion_fare_refund', charge_component='hawaii_surcharge')"
  - surcharge_repeat_factor: "K('repeat_two_factor') if surcharge_refunds_12m >= 2 else (K('repeat_one_factor') if surcharge_refunds_12m == 1 else 1)"
  - summit_tier: "CFIELD('loyalty', 'variant_name')"
  - status_waiver_pct: "K('top_tier_waiver_pct') if (summit_tier == 'Summit Diamond' or summit_tier == 'Summit Chairman') else (K('mid_tier_waiver_pct') if (summit_tier == 'Summit Gold' or summit_tier == 'Summit Platinum') else 0)"
  - booking_entry_date: "LATEST('companion_ledger', 'entry_date', date_field='entry_date', event_type='companion_trip_redeem')"
  - booking_travel_date: "LATEST('companion_ledger', 'travel_date', date_field='entry_date', event_type='companion_trip_redeem')"
  - booking_lead_days: "DAYS(booking_entry_date, booking_travel_date)"
  - lead_waiver_pct: "K('long_lead_waiver_pct') if booking_lead_days >= K('long_lead_days') else (K('mid_lead_waiver_pct') if booking_lead_days >= K('mid_lead_days') else 0)"
  - final_surcharge_retention: "RND(surcharge_retention * surcharge_repeat_factor * (1 - (status_waiver_pct + lead_waiver_pct) / 100) + 0.0000001, 2)"
  - result: "MX(0, RND(surcharge_charged - final_surcharge_retention + 0.0000001, 2))"
  compute_basis:
    surcharge_charged: "The refund of the Hawaii surcharge of a cancelled booking is the amount of the most recent Hawaii surcharge charge on the certificate, refunded in full."
    fare_refund_share: "that share being the most recent companion fare refund on the certificate divided by the most recent companion fare charge on the certificate"
    surcharge_share_refund: "when that share is below proportional_below_ratio, the surcharge is refunded in that same share, rounded half up to the cent; when the share is proportional_below_ratio or more but below one, the surcharge is refunded less a flat surcharge handling amount of surcharge_handling_usd; when the whole companion fare came back, the surcharge is refunded in full."
    surcharge_retention: "The surcharge retention is the surcharge charge less the refund that share gives."
    surcharge_refunds_12m: "The surcharge retention is then scaled by the Hawaii surcharge refunds already recorded on the certificate with an entry date in the last 12 months counted back from the handling date"
    surcharge_repeat_factor: "two or more such refunds multiply it by repeat_two_factor, exactly one multiplies it by repeat_one_factor, and none leaves it unscaled."
    status_waiver_pct: "Summit Diamond or Summit Chairman waives top_tier_waiver_pct percent, Summit Gold or Summit Platinum waives mid_tier_waiver_pct percent, and any other tier waives nothing."
    booking_lead_days: "The advance-planning waiver follows the calendar days from the entry date of the most recent companion booking on the certificate to its travel date, the entry date excluded and the travel date included"
    lead_waiver_pct: "long_lead_days days or more waive long_lead_waiver_pct percent, mid_lead_days to fewer than long_lead_days days waive mid_lead_waiver_pct percent, and fewer than mid_lead_days days waive nothing."
    final_surcharge_retention: "The final surcharge retention is the surcharge retention multiplied by the repeat factor and then by one minus the combined waiver percentage, rounded half up to the cent once at that point."
    result: "The Hawaii surcharge refund equals the most recent Hawaii surcharge charge on the certificate less the final surcharge retention, never below zero, rounded half up to the cent."
  factors:
  - id: surcharge_fare_share_method
    effect: method
    decides: surcharge_share_refund
    bindings: [fare_charged_for_share, fare_refunded, fare_refund_share, surcharge_share_refund]
    ladder:
    - when: "the most recent companion fare refund is below proportional_below_ratio of the most recent companion fare charge"
      method: "the surcharge is refunded in the same share as the companion fare, rounded half up to the cent"
    - when: "that share is proportional_below_ratio or more but below one"
      method: "the surcharge is refunded less a flat handling amount of surcharge_handling_usd"
    - when: "otherwise (the whole companion fare came back)"
      method: "the surcharge is refunded in full"
    baseline:
      surcharge_share_refund: "surcharge_charged"
    evidence: [history]
    cross_difficulty: null
  - id: surcharge_repeat_refunds
    effect: parameter
    decides: surcharge_repeat_factor
    bindings: [surcharge_refunds_12m, surcharge_repeat_factor]
    ladder:
    - when: "two or more Hawaii surcharge refunds recorded on the certificate in the last 12 months"
      value: "K('repeat_two_factor')"
    - when: "exactly one such refund"
      value: "K('repeat_one_factor')"
    - when: "otherwise (none)"
      value: "1"
    baseline:
      surcharge_repeat_factor: "1"
    evidence: [history]
    cross_difficulty: null
  - id: surcharge_status_waiver
    effect: parameter
    decides: status_waiver_pct
    bindings: [summit_tier, status_waiver_pct]
    ladder:
    - when: "the holder's Summit tier is Summit Diamond or Summit Chairman"
      value: "K('top_tier_waiver_pct')"
    - when: "the holder's Summit tier is Summit Gold or Summit Platinum"
      value: "K('mid_tier_waiver_pct')"
    - when: "otherwise"
      value: "0"
    baseline:
      status_waiver_pct: "0"
    evidence: [cross_category]
    cross_difficulty: loyalty
  - id: surcharge_advance_planning_waiver
    effect: parameter
    decides: lead_waiver_pct
    bindings: [booking_entry_date, booking_travel_date, booking_lead_days, lead_waiver_pct]
    ladder:
    - when: "the cancelled booking was made long_lead_days or more calendar days before its travel date"
      value: "K('long_lead_waiver_pct')"
    - when: "it was made mid_lead_days to fewer than long_lead_days days before"
      value: "K('mid_lead_waiver_pct')"
    - when: "otherwise"
      value: "0"
    baseline:
      lead_waiver_pct: "0"
    evidence: [history, date]
    cross_difficulty: null
  baseline:
    rule: >-
      The refund of the Hawaii surcharge of a cancelled booking is the amount of the most recent Hawaii surcharge
      charge on the certificate, refunded in full.
    params: []
  inputs:
    history:
    - {table: companion_ledger, aggregate: latest, field: amount, filters: {event_type: companion_fare_refund, charge_component: companion_fare}}
    - {table: companion_ledger, aggregate: count, field: companion_entry_id, within_months: 12, filters: {event_type: companion_fare_refund, charge_component: hawaii_surcharge}}
    cross_category: [loyalty]
- id: companion_ext_cancelled_taxes_refund
  base_policy_refs:
  - companion_cancellation
  - companion_refund_controls
  overwrite:
  - base_policy: companion_refund_controls
    superseded_clause: >-
      a refund equals the amount of the charge it names
    replaced_by: >-
      The taxes-and-fees refund equals the refund the fare-side share gives less the final refund processing charge,
      never below zero, rounded half up to the cent.
  trigger: state_due
  subject:
  - companion_fare_refund
  computes: amount
  target_tool: refund_companion_taxes_and_fees_22c15e93
  params:
    proportional_below_share: 0.85
    ticket_tax_pct: 7.5
    many_refunds: 4
    some_refunds: 2
    many_refunds_processing_usd: 9
    some_refunds_processing_usd: 6
    top_club_waiver_pct: 50
    base_club_waiver_pct: 25
    high_card_miles: 60000
    mid_card_miles: 25000
    high_card_waiver_pct: 40
    mid_card_waiver_pct: 20
  rule: >-
    Every rounding in this rule is half up to the cent, a value lying exactly on a half cent going up to the next cent. When a companion booking is cancelled, the taxes and fees charged for it are refunded to the holder by the
    companion desk in one refund entry that names that taxes-and-fees charge. The taxes-and-fees refund of a
    cancelled booking is not worked out until the certificate's ledger carries the refund of that booking's
    companion fare. For a booking that carried a Hawaii surcharge, the taxes-and-fees refund is not worked out
    until the certificate's ledger also carries the refund of that surcharge. The refund of the taxes and fees of
    a cancelled booking is the amount of the most recent taxes-and-fees charge on the certificate, refunded in
    full. The fare-side value of the booking is its most recent companion fare charge plus the most recent Hawaii
    surcharge charge when that surcharge was charged on the same entry date as the companion fare; the fare-side
    value refunded is the most recent companion fare refund plus the most recent Hawaii surcharge refund when that
    surcharge refund was recorded on the same entry date as the companion fare refund; the fare-side share is the
    fare-side value refunded divided by the fare-side value. Because the ticket tax follows the fare value that
    actually comes back, the taxes refund follows that share: when the fare-side share is below
    proportional_below_share, the taxes and fees are refunded in that same share, rounded half up to the cent; when the
    share is proportional_below_share or more but below one, the taxes and fees are refunded less the ticket tax
    of ticket_tax_pct percent on the fare-side value that was not refunded, rounded half up to the cent; when the whole
    fare-side value came back, the taxes and fees are refunded in full. A voluntary cancellation, read from the
    most recent trip reinstatement on the certificate, also carries a refund processing charge set by the refund
    entries already recorded on the certificate with an entry date in the last 12 months counted back from the
    handling date: a voluntary cancellation with many_refunds or more such refund entries carries
    many_refunds_processing_usd, a voluntary cancellation with some_refunds to fewer than many_refunds such entries
    carries some_refunds_processing_usd, and every other cancellation carries none. Two waivers reduce the
    processing charge, first added into one waiver percentage that is applied once, never one after the other.
    The lounge waiver follows the holder's active Summit Club membership: Summit Club Executive or Summit Club
    Lifetime waives top_club_waiver_pct percent, Summit Club Individual or Summit Club Individual Plus waives
    base_club_waiver_pct percent, and no active membership or any other club product waives nothing. The
    co-brand card waiver follows the miles credited to the holder's Summit membership by co-brand card partner
    accrual entries dated in the last 12 months counted back from the handling date: high_card_miles or more waive
    high_card_waiver_pct percent, mid_card_miles to fewer than high_card_miles waive mid_card_waiver_pct percent,
    and fewer than mid_card_miles waive nothing. The final refund processing charge is the processing charge
    multiplied by one minus the combined waiver percentage, rounded half up to the cent. The taxes-and-fees refund equals
    the refund the fare-side share gives less the final refund processing charge, never below zero, rounded half up to the
    cent.
  prerequisite:
  - problem: companion_ext_cancelled_fare_refund
    kind: value_input
    gate: fare_refunded_for_tax
    form: state
    policy_source: >-
      The taxes-and-fees refund of a cancelled booking is not worked out until the certificate's ledger carries the
      refund of that booking's companion fare.
    condition: >-
      The certificate's ledger carries a refund entry of component companion fare that names the cancelled
      booking's companion fare charge.
    resolved_by: refund_companion_fare_charge_1d800070
    effect: >-
      Once the companion fare refund of the cancelled booking is posted, the fare-side value refunded reads that
      refund; before it, the most recent companion fare refund belongs to an earlier booking, the fare-side share is
      different and so is the taxes-and-fees refund.
  - problem: companion_ext_cancelled_surcharge_refund
    kind: value_input
    gate: surcharge_refunded_for_tax
    form: state
    policy_source: >-
      For a booking that carried a Hawaii surcharge, the taxes-and-fees refund is not worked out until the
      certificate's ledger also carries the refund of that surcharge.
    condition: >-
      For a booking that carried a Hawaii surcharge, the certificate's ledger carries a refund entry of component
      Hawaii surcharge that names that booking's Hawaii surcharge charge.
    resolved_by: refund_companion_hawaii_surcharge_2c74daac
    effect: >-
      Once the surcharge refund is posted on the same date as the companion fare refund, it enters the fare-side
      value refunded; before it, no same-date surcharge refund exists, the fare-side share drops and the
      taxes-and-fees refund comes out different.
  cross_category:
  - category: club
    as: branch
    reads:
    - variant_name
    - status
    note: The lounge waiver on the refund processing charge is decided by the holder's active Summit Club product.
  - category: loyalty
    as: history
    reads:
    - loyalty_activity.miles
    note: The co-brand card waiver aggregates the holder's co-brand card partner accruals of the last 12 months.
  compute:
  - taxes_charged: "LATEST('companion_ledger', 'amount', date_field='entry_date', event_type='companion_fare_charge', charge_component='taxes_and_fees')"
  - fare_charged_for_tax: "LATEST('companion_ledger', 'amount', date_field='entry_date', event_type='companion_fare_charge', charge_component='companion_fare')"
  - fare_charge_date: "LATEST('companion_ledger', 'entry_date', date_field='entry_date', event_type='companion_fare_charge', charge_component='companion_fare')"
  - surcharge_charged_for_tax: "(LATEST('companion_ledger', 'amount', date_field='entry_date', event_type='companion_fare_charge', charge_component='hawaii_surcharge') or 0) if LATEST('companion_ledger', 'entry_date', date_field='entry_date', event_type='companion_fare_charge', charge_component='hawaii_surcharge') == fare_charge_date else 0"
  - fare_refunded_for_tax: "LATEST('companion_ledger', 'amount', date_field='entry_date', event_type='companion_fare_refund', charge_component='companion_fare') or 0"
  - fare_refund_date: "LATEST('companion_ledger', 'entry_date', date_field='entry_date', event_type='companion_fare_refund', charge_component='companion_fare')"
  - surcharge_refunded_for_tax: "(LATEST('companion_ledger', 'amount', date_field='entry_date', event_type='companion_fare_refund', charge_component='hawaii_surcharge') or 0) if LATEST('companion_ledger', 'entry_date', date_field='entry_date', event_type='companion_fare_refund', charge_component='hawaii_surcharge') == fare_refund_date else 0"
  - fare_side_charged: "fare_charged_for_tax + surcharge_charged_for_tax"
  - fare_side_refunded: "fare_refunded_for_tax + surcharge_refunded_for_tax"
  - fare_side_share: "fare_side_refunded / fare_side_charged"
  - tax_share_refund: "RND(taxes_charged * fare_side_share + 0.0000001, 2) if fare_side_share < K('proportional_below_share') else (RND(taxes_charged - K('ticket_tax_pct') / 100 * (fare_side_charged - fare_side_refunded) + 0.0000001, 2) if fare_side_share < 1 else taxes_charged)"
  - latest_cancel_ground: "LATEST('companion_ledger', 'reinstatement_ground', date_field='entry_date', event_type='companion_trip_reinstate')"
  - refunds_12m: "COUNT('companion_ledger', within_months=12, date_field='entry_date', event_type='companion_fare_refund')"
  - processing_charge: "K('many_refunds_processing_usd') if (latest_cancel_ground == 'voluntary_cancellation' and refunds_12m >= K('many_refunds')) else (K('some_refunds_processing_usd') if (latest_cancel_ground == 'voluntary_cancellation' and refunds_12m >= K('some_refunds')) else 0)"
  - club_product: "CFIELD('club', 'variant_name', status='active')"
  - lounge_waiver_pct: "K('top_club_waiver_pct') if (club_product == 'Summit Club Executive' or club_product == 'Summit Club Lifetime') else (K('base_club_waiver_pct') if (club_product == 'Summit Club Individual' or club_product == 'Summit Club Individual Plus') else 0)"
  - card_miles_12m: "XSUM('loyalty', 'loyalty_activity', 'miles', within_months=12, date_field='activity_date', event_type='loyalty_partner_accrual', partner_code='cobrand_card')"
  - card_waiver_pct: "K('high_card_waiver_pct') if card_miles_12m >= K('high_card_miles') else (K('mid_card_waiver_pct') if card_miles_12m >= K('mid_card_miles') else 0)"
  - final_processing_charge: "RND(processing_charge * (1 - (lounge_waiver_pct + card_waiver_pct) / 100) + 0.0000001, 2)"
  - result: "MX(0, RND(tax_share_refund - final_processing_charge + 0.0000001, 2))"
  compute_basis:
    taxes_charged: "The refund of the taxes and fees of a cancelled booking is the amount of the most recent taxes-and-fees charge on the certificate, refunded in full."
    surcharge_charged_for_tax: "The fare-side value of the booking is its most recent companion fare charge plus the most recent Hawaii surcharge charge when that surcharge was charged on the same entry date as the companion fare"
    surcharge_refunded_for_tax: "the fare-side value refunded is the most recent companion fare refund plus the most recent Hawaii surcharge refund when that surcharge refund was recorded on the same entry date as the companion fare refund"
    fare_side_share: "the fare-side share is the fare-side value refunded divided by the fare-side value."
    tax_share_refund: "when the fare-side share is below proportional_below_share, the taxes and fees are refunded in that same share, rounded half up to the cent; when the share is proportional_below_share or more but below one, the taxes and fees are refunded less the ticket tax of ticket_tax_pct percent on the fare-side value that was not refunded, rounded half up to the cent; when the whole fare-side value came back, the taxes and fees are refunded in full."
    latest_cancel_ground: "A voluntary cancellation, read from the most recent trip reinstatement on the certificate"
    refunds_12m: "set by the refund entries already recorded on the certificate with an entry date in the last 12 months counted back from the handling date"
    processing_charge: "a voluntary cancellation with many_refunds or more such refund entries carries many_refunds_processing_usd, a voluntary cancellation with some_refunds to fewer than many_refunds such entries carries some_refunds_processing_usd, and every other cancellation carries none."
    lounge_waiver_pct: "Summit Club Executive or Summit Club Lifetime waives top_club_waiver_pct percent, Summit Club Individual or Summit Club Individual Plus waives base_club_waiver_pct percent, and no active membership or any other club product waives nothing."
    card_miles_12m: "The co-brand card waiver follows the miles credited to the holder's Summit membership by co-brand card partner accrual entries dated in the last 12 months counted back from the handling date"
    card_waiver_pct: "high_card_miles or more waive high_card_waiver_pct percent, mid_card_miles to fewer than high_card_miles waive mid_card_waiver_pct percent, and fewer than mid_card_miles waive nothing."
    final_processing_charge: "The final refund processing charge is the processing charge multiplied by one minus the combined waiver percentage, rounded half up to the cent."
    result: "The taxes-and-fees refund equals the refund the fare-side share gives less the final refund processing charge, never below zero, rounded half up to the cent."
  factors:
  - id: taxes_fare_side_share_method
    effect: method
    decides: tax_share_refund
    bindings: [fare_charged_for_tax, fare_charge_date, surcharge_charged_for_tax, fare_refunded_for_tax, fare_refund_date, surcharge_refunded_for_tax, fare_side_charged, fare_side_refunded, fare_side_share, tax_share_refund]
    ladder:
    - when: "the fare-side value refunded is below proportional_below_share of the fare-side value charged"
      method: "the taxes and fees are refunded in that same share, rounded half up to the cent"
    - when: "the fare-side share is proportional_below_share or more but below one"
      method: "the taxes and fees are refunded less the ticket tax of ticket_tax_pct percent on the fare-side value not refunded"
    - when: "otherwise (the whole fare-side value came back)"
      method: "the taxes and fees are refunded in full"
    baseline:
      tax_share_refund: "taxes_charged"
    evidence: [history]
    cross_difficulty: null
  - id: taxes_refund_processing_charge
    effect: parameter
    decides: processing_charge
    bindings: [latest_cancel_ground, refunds_12m, processing_charge]
    ladder:
    - when: "a voluntary cancellation and many_refunds or more refund entries on the certificate in the last 12 months"
      value: "K('many_refunds_processing_usd')"
    - when: "a voluntary cancellation and some_refunds to fewer than many_refunds such refund entries"
      value: "K('some_refunds_processing_usd')"
    - when: "otherwise"
      value: "0"
    baseline:
      processing_charge: "0"
    evidence: [history]
    cross_difficulty: null
  - id: taxes_processing_lounge_waiver
    effect: parameter
    decides: lounge_waiver_pct
    bindings: [club_product, lounge_waiver_pct]
    ladder:
    - when: "the holder's active Summit Club product is Summit Club Executive or Summit Club Lifetime (refund processing charge)"
      value: "K('top_club_waiver_pct')"
    - when: "it is Summit Club Individual or Summit Club Individual Plus (refund processing charge)"
      value: "K('base_club_waiver_pct')"
    - when: "otherwise"
      value: "0"
    baseline:
      lounge_waiver_pct: "0"
    evidence: [cross_category]
    cross_difficulty: club
  - id: taxes_processing_card_waiver
    effect: parameter
    decides: card_waiver_pct
    bindings: [card_miles_12m, card_waiver_pct]
    ladder:
    - when: "co-brand card partner accruals of the last 12 months total high_card_miles miles or more (refund processing charge)"
      value: "K('high_card_waiver_pct')"
    - when: "they total mid_card_miles to fewer than high_card_miles miles (refund processing charge)"
      value: "K('mid_card_waiver_pct')"
    - when: "otherwise"
      value: "0"
    baseline:
      card_waiver_pct: "0"
    evidence: [cross_category, history]
    cross_difficulty: loyalty
  baseline:
    rule: >-
      The refund of the taxes and fees of a cancelled booking is the amount of the most recent taxes-and-fees charge
      on the certificate, refunded in full.
    params: []
  inputs:
    history:
    - {table: companion_ledger, aggregate: latest, field: amount, filters: {event_type: companion_fare_refund}}
    - {table: companion_ledger, aggregate: count, field: companion_entry_id, within_months: 12, filters: {event_type: companion_fare_refund}}
    - {category: loyalty, table: loyalty_activity, aggregate: sum, field: miles, within_months: 12, filters: {event_type: loyalty_partner_accrual, partner_code: cobrand_card}}
    cross_category: [club, loyalty]
- id: companion_ext_voluntary_reinstatement_fee
  base_policy_refs:
  - companion_booking_rules
  - companion_cancellation
  - companion_designation
  overwrite:
  - base_policy: companion_cancellation
    superseded_clause: >-
      A voluntary reinstatement carries reinstatement_fee_usd, charged as its own charge entry.
    replaced_by: >-
      The reinstatement fee equals the adjusted fee less the lounge credit and the co-brand card credit, never below
      zero, rounded half up to the cent.
  trigger: state_due
  subject:
  - companion_fare_charge
  computes: amount
  target_tool: pay_companion_reinstatement_fee_0c05ba56
  params:
    second_cancel_share_pct: 25
    short_validity_days: 30
    mid_validity_days: 90
    short_validity_factor: 0.5
    mid_validity_factor: 0.75
    top_relief_flights: 12
    mid_relief_flights: 6
    top_relief_pct: 50
    mid_relief_pct: 25
    top_club_credit_usd: 15
    base_club_credit_usd: 8
    high_card_miles: 60000
    mid_card_miles: 25000
    high_card_credit_usd: 20
    mid_card_credit_usd: 10
  rule: >-
    Every rounding in this rule is half up to the cent, a value lying exactly on a half cent going up to the next cent. A trip returned to a certificate or pass by a voluntary cancellation carries a reinstatement fee, which the
    holder pays in person as its own charge entry of component reinstatement fee on the ledger of that certificate
    or pass, naming the companion ticket of the cancelled booking. The reinstatement fee for a voluntary
    cancellation is not fixed until the certificate's ledger carries the refund of the cancelled booking's taxes
    and fees. A voluntary reinstatement carries the product's reinstatement fee, reinstatement_fee_usd, charged
    once. How the fee is worked out follows the number of trip reinstatements on the certificate or pass whose
    ground is a voluntary cancellation, the one being settled included: three or more such reinstatements make the
    fee the product's reinstatement fee multiplied by that number; exactly two make the fee
    second_cancel_share_pct percent of the value refunded on the cancelled booking, rounded half up to the cent; a single
    one leaves the fee at the product's reinstatement fee. The value refunded on the cancelled booking is the most
    recent taxes-and-fees refund on the ledger plus the most recent companion fare refund and the most recent
    Hawaii surcharge refund, each of these two counted only when it was recorded on the same entry date as that
    taxes-and-fees refund. The fee is then scaled by the booking time left on the product, counted in calendar days
    from the entry date of the most recent trip reinstatement to the book-by date, the reinstatement date excluded
    and the book-by date included: short_validity_days days or fewer multiply the fee by short_validity_factor,
    more than short_validity_days and up to mid_validity_days days multiply it by mid_validity_factor, and more
    than mid_validity_days days leave it unscaled. A frequent-flyer relief follows the holder's current Summit tier
    together with the Crestline flight accrual entries posted to the membership in the last 12 months counted back
    from the handling date: Summit Diamond or Summit Chairman with top_relief_flights or more such flights relieves
    top_relief_pct percent, Summit Gold or Summit Platinum with mid_relief_flights or more such flights relieves
    mid_relief_pct percent, and every other holder is relieved of nothing. The adjusted fee is the fee multiplied
    by the booking-time factor and then by one minus the relief percentage, rounded half up to the cent. Two credits are
    then subtracted together from the adjusted fee. The lounge credit follows the holder's active Summit Club
    membership: Summit Club Executive or Summit Club Lifetime gives top_club_credit_usd, Summit Club Individual or
    Summit Club Individual Plus gives base_club_credit_usd, and no active membership or any other club product
    gives nothing. The co-brand card credit follows the miles credited to the holder's Summit membership by
    co-brand card partner accrual entries dated in the last 12 months counted back from the handling date:
    high_card_miles or more give high_card_credit_usd, mid_card_miles to fewer than high_card_miles give
    mid_card_credit_usd, and fewer than mid_card_miles give nothing. The reinstatement fee equals the adjusted fee
    less the lounge credit and the co-brand card credit, never below zero, rounded half up to the cent.
  prerequisite:
  - problem: companion_ext_cancelled_taxes_refund
    kind: value_input
    gate: refunded_value
    form: state
    policy_source: >-
      The reinstatement fee for a voluntary cancellation is not fixed until the certificate's ledger carries the
      refund of the cancelled booking's taxes and fees.
    condition: >-
      The certificate's ledger carries a refund entry of component taxes and fees that names the cancelled
      booking's taxes-and-fees charge.
    resolved_by: refund_companion_taxes_and_fees_22c15e93
    effect: >-
      Once the taxes-and-fees refund of the cancelled booking is posted, the value refunded on the booking is that
      refund plus the same-date companion fare and surcharge refunds; before it, the most recent taxes-and-fees
      refund belongs to an earlier booking, the same-date refunds drop out, and a fee worked out as a share of the
      value refunded comes out different.
  cross_category:
  - category: loyalty
    as: branch
    reads:
    - variant_name
    - loyalty_activity.activity_date
    - loyalty_activity.miles
    note: The frequent-flyer relief reads the Summit tier and counts the flight accrual entries of the last 12
      months; the co-brand card credit sums the co-brand card partner accruals of the last 12 months.
  - category: club
    as: branch
    reads:
    - variant_name
    - status
    note: The lounge credit is decided by the holder's active Summit Club product.
  compute:
  - standard_fee: "P('reinstatement_fee_usd')"
  - taxes_refund_date: "LATEST('companion_ledger', 'entry_date', date_field='entry_date', event_type='companion_fare_refund', charge_component='taxes_and_fees')"
  - refunded_taxes: "LATEST('companion_ledger', 'amount', date_field='entry_date', event_type='companion_fare_refund', charge_component='taxes_and_fees') or 0"
  - refunded_fare_same_date: "(LATEST('companion_ledger', 'amount', date_field='entry_date', event_type='companion_fare_refund', charge_component='companion_fare') or 0) if LATEST('companion_ledger', 'entry_date', date_field='entry_date', event_type='companion_fare_refund', charge_component='companion_fare') == taxes_refund_date else 0"
  - refunded_surcharge_same_date: "(LATEST('companion_ledger', 'amount', date_field='entry_date', event_type='companion_fare_refund', charge_component='hawaii_surcharge') or 0) if LATEST('companion_ledger', 'entry_date', date_field='entry_date', event_type='companion_fare_refund', charge_component='hawaii_surcharge') == taxes_refund_date else 0"
  - refunded_value: "RND(refunded_taxes + refunded_fare_same_date + refunded_surcharge_same_date + 0.0000001, 2)"
  - voluntary_reinstatements: "COUNT('companion_ledger', date_field='entry_date', event_type='companion_trip_reinstate', reinstatement_ground='voluntary_cancellation')"
  - fee_core: "RND(standard_fee * voluntary_reinstatements + 0.0000001, 2) if voluntary_reinstatements >= 3 else (RND(refunded_value * K('second_cancel_share_pct') / 100 + 0.0000001, 2) if voluntary_reinstatements == 2 else standard_fee)"
  - reinstatement_date: "LATEST('companion_ledger', 'entry_date', date_field='entry_date', event_type='companion_trip_reinstate')"
  - booking_time_left_days: "DAYS(reinstatement_date, F('book_by_date'))"
  - booking_time_factor: "K('short_validity_factor') if booking_time_left_days <= K('short_validity_days') else (K('mid_validity_factor') if booking_time_left_days <= K('mid_validity_days') else 1)"
  - summit_tier_for_relief: "CFIELD('loyalty', 'variant_name')"
  - flights_12m: "XCOUNT('loyalty', 'loyalty_activity', within_months=12, date_field='activity_date', event_type='loyalty_flight_accrual')"
  - flyer_relief_pct: "K('top_relief_pct') if ((summit_tier_for_relief == 'Summit Diamond' or summit_tier_for_relief == 'Summit Chairman') and flights_12m >= K('top_relief_flights')) else (K('mid_relief_pct') if ((summit_tier_for_relief == 'Summit Gold' or summit_tier_for_relief == 'Summit Platinum') and flights_12m >= K('mid_relief_flights')) else 0)"
  - adjusted_fee: "RND(fee_core * booking_time_factor * (1 - flyer_relief_pct / 100) + 0.0000001, 2)"
  - club_product_for_credit: "CFIELD('club', 'variant_name', status='active')"
  - lounge_credit: "K('top_club_credit_usd') if (club_product_for_credit == 'Summit Club Executive' or club_product_for_credit == 'Summit Club Lifetime') else (K('base_club_credit_usd') if (club_product_for_credit == 'Summit Club Individual' or club_product_for_credit == 'Summit Club Individual Plus') else 0)"
  - card_miles_for_credit: "XSUM('loyalty', 'loyalty_activity', 'miles', within_months=12, date_field='activity_date', event_type='loyalty_partner_accrual', partner_code='cobrand_card')"
  - card_credit: "K('high_card_credit_usd') if card_miles_for_credit >= K('high_card_miles') else (K('mid_card_credit_usd') if card_miles_for_credit >= K('mid_card_miles') else 0)"
  - result: "MX(0, RND(adjusted_fee - lounge_credit - card_credit + 0.0000001, 2))"
  compute_basis:
    standard_fee: "A voluntary reinstatement carries the product's reinstatement fee, reinstatement_fee_usd, charged once."
    refunded_value: "The value refunded on the cancelled booking is the most recent taxes-and-fees refund on the ledger plus the most recent companion fare refund and the most recent Hawaii surcharge refund, each of these two counted only when it was recorded on the same entry date as that taxes-and-fees refund."
    voluntary_reinstatements: "How the fee is worked out follows the number of trip reinstatements on the certificate or pass whose ground is a voluntary cancellation, the one being settled included"
    fee_core: "three or more such reinstatements make the fee the product's reinstatement fee multiplied by that number; exactly two make the fee second_cancel_share_pct percent of the value refunded on the cancelled booking, rounded half up to the cent; a single one leaves the fee at the product's reinstatement fee."
    booking_time_left_days: "The fee is then scaled by the booking time left on the product, counted in calendar days from the entry date of the most recent trip reinstatement to the book-by date, the reinstatement date excluded and the book-by date included"
    booking_time_factor: "short_validity_days days or fewer multiply the fee by short_validity_factor, more than short_validity_days and up to mid_validity_days days multiply it by mid_validity_factor, and more than mid_validity_days days leave it unscaled."
    flights_12m: "A frequent-flyer relief follows the holder's current Summit tier together with the Crestline flight accrual entries posted to the membership in the last 12 months counted back from the handling date"
    flyer_relief_pct: "Summit Diamond or Summit Chairman with top_relief_flights or more such flights relieves top_relief_pct percent, Summit Gold or Summit Platinum with mid_relief_flights or more such flights relieves mid_relief_pct percent, and every other holder is relieved of nothing."
    adjusted_fee: "The adjusted fee is the fee multiplied by the booking-time factor and then by one minus the relief percentage, rounded half up to the cent."
    lounge_credit: "Summit Club Executive or Summit Club Lifetime gives top_club_credit_usd, Summit Club Individual or Summit Club Individual Plus gives base_club_credit_usd, and no active membership or any other club product gives nothing."
    card_miles_for_credit: "The co-brand card credit follows the miles credited to the holder's Summit membership by co-brand card partner accrual entries dated in the last 12 months counted back from the handling date"
    card_credit: "high_card_miles or more give high_card_credit_usd, mid_card_miles to fewer than high_card_miles give mid_card_credit_usd, and fewer than mid_card_miles give nothing."
    result: "The reinstatement fee equals the adjusted fee less the lounge credit and the co-brand card credit, never below zero, rounded half up to the cent."
  factors:
  - id: reinstatement_fee_repeat_method
    effect: method
    decides: fee_core
    bindings: [voluntary_reinstatements, fee_core]
    ladder:
    - when: "three or more trip reinstatements on the product have a voluntary-cancellation ground"
      method: "the fee is the product's reinstatement fee multiplied by the number of those reinstatements"
    - when: "exactly two such reinstatements"
      method: "the fee is second_cancel_share_pct percent of the value refunded on the cancelled booking, rounded half up to the cent"
    - when: "otherwise (a single one)"
      method: "the fee is the product's reinstatement fee, charged once"
    baseline:
      fee_core: "standard_fee"
    evidence: [history]
    cross_difficulty: null
  - id: reinstatement_fee_booking_time_left
    effect: parameter
    decides: booking_time_factor
    bindings: [reinstatement_date, booking_time_left_days, booking_time_factor]
    ladder:
    - when: "short_validity_days calendar days or fewer from the reinstatement date to the book-by date"
      value: "K('short_validity_factor')"
    - when: "more than short_validity_days and up to mid_validity_days days"
      value: "K('mid_validity_factor')"
    - when: "otherwise"
      value: "1"
    baseline:
      booking_time_factor: "1"
    evidence: [history, date]
    cross_difficulty: null
  - id: reinstatement_fee_frequent_flyer_relief
    effect: parameter
    decides: flyer_relief_pct
    bindings: [summit_tier_for_relief, flights_12m, flyer_relief_pct]
    ladder:
    - when: "Summit Diamond or Summit Chairman AND top_relief_flights or more flight accrual entries in the last 12 months"
      value: "K('top_relief_pct')"
    - when: "Summit Gold or Summit Platinum AND mid_relief_flights or more flight accrual entries in the last 12 months"
      value: "K('mid_relief_pct')"
    - when: "otherwise"
      value: "0"
    baseline:
      flyer_relief_pct: "0"
    evidence: [cross_category, history]
    cross_difficulty: loyalty
  - id: reinstatement_fee_lounge_credit
    effect: parameter
    decides: lounge_credit
    bindings: [club_product_for_credit, lounge_credit]
    ladder:
    - when: "the holder's active Summit Club product is Summit Club Executive or Summit Club Lifetime (reinstatement fee)"
      value: "K('top_club_credit_usd')"
    - when: "it is Summit Club Individual or Summit Club Individual Plus (reinstatement fee)"
      value: "K('base_club_credit_usd')"
    - when: "otherwise"
      value: "0"
    baseline:
      lounge_credit: "0"
    evidence: [cross_category]
    cross_difficulty: club
  - id: reinstatement_fee_card_credit
    effect: parameter
    decides: card_credit
    bindings: [card_miles_for_credit, card_credit]
    ladder:
    - when: "co-brand card partner accruals of the last 12 months total high_card_miles miles or more (reinstatement fee)"
      value: "K('high_card_credit_usd')"
    - when: "they total mid_card_miles to fewer than high_card_miles miles (reinstatement fee)"
      value: "K('mid_card_credit_usd')"
    - when: "otherwise"
      value: "0"
    baseline:
      card_credit: "0"
    evidence: [cross_category, history]
    cross_difficulty: loyalty
  baseline:
    rule: >-
      A voluntary reinstatement carries the product's reinstatement fee, reinstatement_fee_usd, charged once.
    params:
    - reinstatement_fee_usd
  inputs:
    history:
    - {table: companion_ledger, aggregate: count, field: companion_entry_id, filters: {event_type: companion_trip_reinstate, reinstatement_ground: voluntary_cancellation}}
    - {table: companion_ledger, aggregate: latest, field: amount, filters: {event_type: companion_fare_refund}}
    - {category: loyalty, table: loyalty_activity, aggregate: count, field: loyalty_activity_id, within_months: 12, filters: {event_type: loyalty_flight_accrual}}
    - {category: loyalty, table: loyalty_activity, aggregate: sum, field: miles, within_months: 12, filters: {event_type: loyalty_partner_accrual, partner_code: cobrand_card}}
    cross_category: [loyalty, club]
- id: companion_ext_booking_companion_fare
  base_policy_refs:
  - companion_booking_rules
  - companion_cancellation
  - companion_designation
  overwrite:
  - base_policy: companion_booking_rules
    superseded_clause: >-
      The holder pays companion_base_fare_usd
    replaced_by: >-
      The companion fare charged equals the fare after the activity discount less the lounge fare credit, the
      rebooking goodwill credit and the holder-fare credit, never below zero, rounded half up to the cent.
  trigger: state_due
  subject:
  - companion_fare_charge
  computes: amount
  target_tool: pay_companion_fare_charge_130546ae
  params:
    close_in_days: 21
    close_in_supplement_usd: 20
    early_days: 60
    early_factor: 0.9
    high_activity_dollars: 15000
    high_activity_flights: 12
    base_activity_dollars: 5000
    base_activity_flights: 6
    high_activity_discount_pct: 12
    base_activity_discount_pct: 6
    top_club_fare_credit_usd: 12
    base_club_fare_credit_usd: 6
    repeat_rebooking_credit_usd: 25
    single_rebooking_credit_usd: 12
    high_holder_fare_usd: 400
    mid_holder_fare_usd: 250
    high_holder_fare_credit_usd: 10
    mid_holder_fare_credit_usd: 5
  rule: >-
    Every rounding in this rule is half up to the cent, a value lying exactly on a half cent going up to the next cent. Every companion booking carries a companion fare, which the holder pays in person as its own charge entry of
    component companion fare on the ledger of the certificate or pass, naming the companion ticket of the booking.
    The companion fare of a booking is the product's companion base fare, companion_base_fare_usd. The fare the
    holder pays starts from how far ahead the booking was made, counted in calendar days from the entry date of
    the most recent companion booking on the certificate or pass to its travel date, the entry date excluded and
    the travel date included: a booking made close_in_days days or fewer ahead pays the companion base fare plus a
    close-in supplement of close_in_supplement_usd; a booking made early_days days or more ahead pays the
    companion base fare multiplied by early_factor, rounded half up to the cent; any other booking pays the companion
    base fare. An activity discount follows two records of the holder's Summit membership together, the
    qualifying dollars credited by qualifying-dollar accrual entries dated in the last 12 months and the number of
    Crestline flight accrual entries dated in the same 12 months, both counted back from the handling date: a
    holder with high_activity_dollars or more qualifying dollars and high_activity_flights or more flights
    receives high_activity_discount_pct percent; a holder with base_activity_dollars or more qualifying dollars and
    base_activity_flights or more flights who does not reach both of those higher marks receives
    base_activity_discount_pct percent; every other holder receives no activity discount. The fare after the
    activity discount is the starting fare multiplied by one minus the activity discount percentage. Three credits
    are then subtracted together from it. The lounge fare credit follows the holder's active Summit Club
    membership: Summit Club Executive or Summit Club Lifetime gives top_club_fare_credit_usd, Summit Club Individual
    or Summit Club Individual Plus gives base_club_fare_credit_usd, and no active membership or any other club
    product gives nothing. The rebooking goodwill credit follows the trip reinstatements on the certificate or pass
    whose ground is a cancellation Crestline made: two or more such reinstatements give
    repeat_rebooking_credit_usd, exactly one gives single_rebooking_credit_usd, and none gives nothing. The holder-fare credit
    follows the base fare of the holder's own ticketed reservation paid by credit card: high_holder_fare_usd or
    more gives high_holder_fare_credit_usd, mid_holder_fare_usd to less than high_holder_fare_usd gives
    mid_holder_fare_credit_usd, and a lower fare or no such ticket gives nothing. The companion fare charged
    equals the fare after the activity discount less the lounge fare credit, the rebooking goodwill credit and
    the holder-fare credit, never below zero, rounded half up to the cent.
  prerequisite: []
  cross_category:
  - category: loyalty
    as: history
    reads:
    - loyalty_activity.qualifying_dollars
    - loyalty_activity.activity_date
    note: The activity discount aggregates the holder's qualifying-dollar accruals and counts the flight accruals of
      the last 12 months.
  - category: club
    as: branch
    reads:
    - variant_name
    - status
    note: The lounge fare credit is decided by the holder's active Summit Club product.
  - category: ticket
    as: branch
    reads:
    - base_fare
    - status
    - payment_form
    note: The holder-fare credit reads the base fare of the holder's own ticketed reservation paid by credit card.
  compute:
  - product_fare: "P('companion_base_fare_usd')"
  - booking_entry_date_for_fare: "LATEST('companion_ledger', 'entry_date', date_field='entry_date', event_type='companion_trip_redeem')"
  - booking_travel_date_for_fare: "LATEST('companion_ledger', 'travel_date', date_field='entry_date', event_type='companion_trip_redeem')"
  - booking_ahead_days: "DAYS(booking_entry_date_for_fare, booking_travel_date_for_fare)"
  - starting_fare: "RND(product_fare + K('close_in_supplement_usd') + 0.0000001, 2) if booking_ahead_days <= K('close_in_days') else (RND(product_fare * K('early_factor') + 0.0000001, 2) if booking_ahead_days >= K('early_days') else product_fare)"
  - activity_dollars_12m: "XSUM('loyalty', 'loyalty_activity', 'qualifying_dollars', within_months=12, date_field='activity_date', event_type='loyalty_mqd_accrual')"
  - activity_flights_12m: "XCOUNT('loyalty', 'loyalty_activity', within_months=12, date_field='activity_date', event_type='loyalty_flight_accrual')"
  - activity_discount_pct: "K('high_activity_discount_pct') if (activity_dollars_12m >= K('high_activity_dollars') and activity_flights_12m >= K('high_activity_flights')) else (K('base_activity_discount_pct') if (activity_dollars_12m >= K('base_activity_dollars') and activity_flights_12m >= K('base_activity_flights')) else 0)"
  - club_product_for_fare: "CFIELD('club', 'variant_name', status='active')"
  - lounge_fare_credit: "K('top_club_fare_credit_usd') if (club_product_for_fare == 'Summit Club Executive' or club_product_for_fare == 'Summit Club Lifetime') else (K('base_club_fare_credit_usd') if (club_product_for_fare == 'Summit Club Individual' or club_product_for_fare == 'Summit Club Individual Plus') else 0)"
  - crestline_reinstatements: "COUNT('companion_ledger', date_field='entry_date', event_type='companion_trip_reinstate', reinstatement_ground='crestline_cancellation')"
  - rebooking_goodwill_credit: "K('repeat_rebooking_credit_usd') if crestline_reinstatements >= 2 else (K('single_rebooking_credit_usd') if crestline_reinstatements == 1 else 0)"
  - holder_ticket_fare: "CFIELD('ticket', 'base_fare', status='ticketed', payment_form='credit_card') or 0"
  - holder_fare_credit: "K('high_holder_fare_credit_usd') if holder_ticket_fare >= K('high_holder_fare_usd') else (K('mid_holder_fare_credit_usd') if holder_ticket_fare >= K('mid_holder_fare_usd') else 0)"
  - result: "MX(0, RND(starting_fare * (1 - activity_discount_pct / 100) - lounge_fare_credit - rebooking_goodwill_credit - holder_fare_credit + 0.0000001, 2))"
  compute_basis:
    product_fare: "The companion fare of a booking is the product's companion base fare, companion_base_fare_usd."
    booking_ahead_days: "The fare the holder pays starts from how far ahead the booking was made, counted in calendar days from the entry date of the most recent companion booking on the certificate or pass to its travel date, the entry date excluded and the travel date included"
    starting_fare: "a booking made close_in_days days or fewer ahead pays the companion base fare plus a close-in supplement of close_in_supplement_usd; a booking made early_days days or more ahead pays the companion base fare multiplied by early_factor, rounded half up to the cent; any other booking pays the companion base fare."
    activity_dollars_12m: "the qualifying dollars credited by qualifying-dollar accrual entries dated in the last 12 months"
    activity_flights_12m: "the number of Crestline flight accrual entries dated in the same 12 months, both counted back from the handling date"
    activity_discount_pct: "a holder with high_activity_dollars or more qualifying dollars and high_activity_flights or more flights receives high_activity_discount_pct percent; a holder with base_activity_dollars or more qualifying dollars and base_activity_flights or more flights who does not reach both of those higher marks receives base_activity_discount_pct percent; every other holder receives no activity discount."
    lounge_fare_credit: "Summit Club Executive or Summit Club Lifetime gives top_club_fare_credit_usd, Summit Club Individual or Summit Club Individual Plus gives base_club_fare_credit_usd, and no active membership or any other club product gives nothing."
    crestline_reinstatements: "The rebooking goodwill credit follows the trip reinstatements on the certificate or pass whose ground is a cancellation Crestline made"
    rebooking_goodwill_credit: "two or more such reinstatements give repeat_rebooking_credit_usd, exactly one gives single_rebooking_credit_usd, and none gives nothing."
    holder_ticket_fare: "The holder-fare credit follows the base fare of the holder's own ticketed reservation paid by credit card"
    holder_fare_credit: "high_holder_fare_usd or more gives high_holder_fare_credit_usd, mid_holder_fare_usd to less than high_holder_fare_usd gives mid_holder_fare_credit_usd, and a lower fare or no such ticket gives nothing."
    result: "The companion fare charged equals the fare after the activity discount less the lounge fare credit, the rebooking goodwill credit and the holder-fare credit, never below zero, rounded half up to the cent."
  factors:
  - id: companion_fare_booking_ahead_method
    effect: method
    decides: starting_fare
    bindings: [booking_entry_date_for_fare, booking_travel_date_for_fare, booking_ahead_days, starting_fare]
    ladder:
    - when: "the booking was made close_in_days calendar days or fewer ahead of its travel date"
      method: "the companion base fare plus a flat close-in supplement of close_in_supplement_usd"
    - when: "the booking was made early_days days or more ahead"
      method: "the companion base fare multiplied by early_factor, rounded half up to the cent"
    - when: "otherwise"
      method: "the companion base fare as published"
    baseline:
      starting_fare: "product_fare"
    evidence: [history, date]
    cross_difficulty: null
  - id: companion_fare_activity_discount
    effect: parameter
    decides: activity_discount_pct
    bindings: [activity_dollars_12m, activity_flights_12m, activity_discount_pct]
    ladder:
    - when: "qualifying dollars of the last 12 months reach high_activity_dollars AND flight accruals of the same 12 months reach high_activity_flights"
      value: "K('high_activity_discount_pct')"
    - when: "qualifying dollars reach base_activity_dollars AND flight accruals reach base_activity_flights, without reaching both higher marks"
      value: "K('base_activity_discount_pct')"
    - when: "otherwise"
      value: "0"
    baseline:
      activity_discount_pct: "0"
    evidence: [cross_category, history]
    cross_difficulty: loyalty
  - id: companion_fare_lounge_credit
    effect: parameter
    decides: lounge_fare_credit
    bindings: [club_product_for_fare, lounge_fare_credit]
    ladder:
    - when: "the holder's active Summit Club product is Summit Club Executive or Summit Club Lifetime (companion fare)"
      value: "K('top_club_fare_credit_usd')"
    - when: "it is Summit Club Individual or Summit Club Individual Plus (companion fare)"
      value: "K('base_club_fare_credit_usd')"
    - when: "otherwise"
      value: "0"
    baseline:
      lounge_fare_credit: "0"
    evidence: [cross_category]
    cross_difficulty: club
  - id: companion_fare_rebooking_goodwill
    effect: parameter
    decides: rebooking_goodwill_credit
    bindings: [crestline_reinstatements, rebooking_goodwill_credit]
    ladder:
    - when: "two or more trip reinstatements on the product have a Crestline-cancellation ground"
      value: "K('repeat_rebooking_credit_usd')"
    - when: "exactly one such reinstatement"
      value: "K('single_rebooking_credit_usd')"
    - when: "otherwise (none)"
      value: "0"
    baseline:
      rebooking_goodwill_credit: "0"
    evidence: [history]
    cross_difficulty: null
  - id: companion_fare_holder_fare_credit
    effect: parameter
    decides: holder_fare_credit
    bindings: [holder_ticket_fare, holder_fare_credit]
    ladder:
    - when: "the holder's own ticketed reservation paid by credit card has a base fare of high_holder_fare_usd or more"
      value: "K('high_holder_fare_credit_usd')"
    - when: "that base fare is mid_holder_fare_usd to less than high_holder_fare_usd"
      value: "K('mid_holder_fare_credit_usd')"
    - when: "otherwise"
      value: "0"
    baseline:
      holder_fare_credit: "0"
    evidence: [cross_category]
    cross_difficulty: ticket
  baseline:
    rule: >-
      The companion fare of a booking is the product's companion base fare, companion_base_fare_usd.
    params:
    - companion_base_fare_usd
  inputs:
    history:
    - {table: companion_ledger, aggregate: latest, field: travel_date, filters: {event_type: companion_trip_redeem}}
    - {table: companion_ledger, aggregate: count, field: companion_entry_id, filters: {event_type: companion_trip_reinstate, reinstatement_ground: crestline_cancellation}}
    - {category: loyalty, table: loyalty_activity, aggregate: sum, field: qualifying_dollars, within_months: 12, filters: {event_type: loyalty_mqd_accrual}}
    - {category: loyalty, table: loyalty_activity, aggregate: count, field: loyalty_activity_id, within_months: 12, filters: {event_type: loyalty_flight_accrual}}
    cross_category: [loyalty, club, ticket]
- id: companion_ext_booking_phone_fee
  base_policy_refs:
  - companion_booking_rules
  - companion_cancellation
  - companion_designation
  overwrite:
  - base_policy: companion_booking_rules
    superseded_clause: >-
      and phone_booking_fee_usd when booked through the call center, each as its own charge entry
    replaced_by: >-
      The phone booking fee charged equals the raw phone booking fee less the part of it covered by the phone
      booking fees still standing on the certificate or pass, never below zero, rounded half up to the cent
  trigger: state_due
  subject:
  - companion_fare_charge
  computes: amount
  target_tool: pay_companion_phone_booking_fee_ff06513e
  params:
    rebooking_window_days: 90
    crestline_rebooking_factor: 0.5
    voluntary_rebooking_handling_usd: 10
    many_phone_bookings: 3
    many_phone_bookings_pct: 40
    two_phone_bookings_pct: 20
    top_status_phone_waiver_pct: 60
    mid_status_phone_waiver_pct: 30
    high_card_miles: 60000
    mid_card_miles: 25000
    high_card_phone_credit_usd: 5
    mid_card_phone_credit_usd: 3
  rule: >-
    Every rounding in this rule is half up to the cent, a value lying exactly on a half cent going up to the next cent. A companion booking made through the reservations call center carries a phone booking fee, which the holder
    pays in person as its own charge entry of component phone booking fee on the ledger of the certificate or
    pass, naming the companion ticket of the booking. The phone booking fee of a call-center booking is the
    product's phone booking fee, phone_booking_fee_usd. The phone booking fee of a new booking is fixed only after
    the certificate's ledger carries the phone booking fee refund owed on every booking of that certificate that
    Crestline cancelled. How the fee is worked out follows the most recent trip reinstatement on the certificate
    or pass and the calendar days from its entry date to the entry date of the most recent companion booking, the
    reinstatement date excluded and the booking date included: a booking made rebooking_window_days days or fewer
    after a reinstatement whose ground is a cancellation Crestline made pays the product's phone booking fee
    multiplied by crestline_rebooking_factor, rounded half up to the cent; a booking made rebooking_window_days days or
    fewer after a reinstatement whose ground is a voluntary cancellation pays the product's phone booking fee plus
    a rebooking handling amount of voluntary_rebooking_handling_usd; any other booking, including one with no
    reinstatement on the product, pays the product's phone booking fee. The fee is then raised by the companion
    bookings made through the call center on the certificate or pass with an entry date in the last 12 months
    counted back from the handling date, the booking being charged included: many_phone_bookings or more such
    bookings raise it by many_phone_bookings_pct percent, exactly two raise it by two_phone_bookings_pct percent,
    and a single one leaves it unraised. A status waiver follows the holder's current Summit tier: Summit Diamond
    or Summit Chairman waives top_status_phone_waiver_pct percent of the raised fee, Summit Gold or Summit
    Platinum waives mid_status_phone_waiver_pct percent, and any other tier waives nothing. A co-brand card phone
    credit follows the miles credited to the holder's Summit membership by co-brand card partner accrual entries
    dated in the last 12 months counted back from the handling date: high_card_miles or more give
    high_card_phone_credit_usd, mid_card_miles to fewer than high_card_miles give mid_card_phone_credit_usd, and
    fewer than mid_card_miles give nothing. The raw phone booking fee is the fee multiplied by one plus the raise
    percentage, then by one minus the status waiver percentage, less the co-brand card phone credit, never below
    zero, rounded half up to the cent. The phone booking fees still standing on the certificate or pass are all phone
    booking fee charges on its ledger less all phone booking fee refunds on its ledger, and a fee still standing
    from an earlier booking covers the new fee up to its own amount. The phone booking fee charged equals the raw
    phone booking fee less the part of it covered by the phone booking fees still standing on the certificate or
    pass, never below zero, rounded half up to the cent; a fee covered in full is still recorded, at zero.
  prerequisite:
  - problem: companion_ext_crestline_cancel_phone_fee_refund
    kind: value_input
    gate: standing_phone_fees
    form: state
    policy_source: >-
      The phone booking fee of a new booking is fixed only after the certificate's ledger carries the phone booking
      fee refund owed on every booking of that certificate that Crestline cancelled.
    condition: >-
      Every booking on the certificate whose trip was reinstated on a Crestline-cancellation ground and whose
      phone booking fee is refundable has a phone booking fee refund entry on the certificate's ledger naming that
      fee.
    resolved_by: refund_companion_phone_booking_fee_90a9c390
    effect: >-
      Once the phone booking fee refund of the Crestline-cancelled booking is posted, the phone booking fees still
      standing on the certificate fall by the amount refunded, so less of the new fee is covered and the fee
      charged rises; before it, the earlier fee stands in full and covers the new fee.
  cross_category:
  - category: loyalty
    as: branch
    reads:
    - variant_name
    - loyalty_activity.miles
    note: The status waiver reads the Summit tier; the co-brand card phone credit sums the co-brand card partner
      accruals of the last 12 months.
  compute:
  - product_phone_fee: "P('phone_booking_fee_usd')"
  - return_ground_for_phone: "LATEST('companion_ledger', 'reinstatement_ground', date_field='entry_date', event_type='companion_trip_reinstate')"
  - return_date_for_phone: "LATEST('companion_ledger', 'entry_date', date_field='entry_date', event_type='companion_trip_reinstate')"
  - booking_date_for_phone: "LATEST('companion_ledger', 'entry_date', date_field='entry_date', event_type='companion_trip_redeem')"
  - days_since_return: "DAYS(return_date_for_phone, booking_date_for_phone) if return_date_for_phone else K('rebooking_window_days') + 1"
  - phone_fee_core: "RND(product_phone_fee * K('crestline_rebooking_factor') + 0.0000001, 2) if (return_ground_for_phone == 'crestline_cancellation' and days_since_return <= K('rebooking_window_days')) else (RND(product_phone_fee + K('voluntary_rebooking_handling_usd') + 0.0000001, 2) if (return_ground_for_phone == 'voluntary_cancellation' and days_since_return <= K('rebooking_window_days')) else product_phone_fee)"
  - phone_bookings_12m: "COUNT('companion_ledger', within_months=12, date_field='entry_date', event_type='companion_trip_redeem', booking_channel='call_center')"
  - phone_raise_pct: "K('many_phone_bookings_pct') if phone_bookings_12m >= K('many_phone_bookings') else (K('two_phone_bookings_pct') if phone_bookings_12m == 2 else 0)"
  - summit_tier_for_phone: "CFIELD('loyalty', 'variant_name')"
  - phone_status_waiver_pct: "K('top_status_phone_waiver_pct') if (summit_tier_for_phone == 'Summit Diamond' or summit_tier_for_phone == 'Summit Chairman') else (K('mid_status_phone_waiver_pct') if (summit_tier_for_phone == 'Summit Gold' or summit_tier_for_phone == 'Summit Platinum') else 0)"
  - card_miles_for_phone: "XSUM('loyalty', 'loyalty_activity', 'miles', within_months=12, date_field='activity_date', event_type='loyalty_partner_accrual', partner_code='cobrand_card')"
  - phone_card_credit: "K('high_card_phone_credit_usd') if card_miles_for_phone >= K('high_card_miles') else (K('mid_card_phone_credit_usd') if card_miles_for_phone >= K('mid_card_miles') else 0)"
  - raw_phone_fee: "MX(0, RND(phone_fee_core * (1 + phone_raise_pct / 100) * (1 - phone_status_waiver_pct / 100) - phone_card_credit + 0.0000001, 2))"
  - standing_phone_fees: "MX(0, RND(SUM('companion_ledger', 'amount', date_field='entry_date', event_type='companion_fare_charge', charge_component='phone_booking_fee') - SUM('companion_ledger', 'amount', date_field='entry_date', event_type='companion_fare_refund', charge_component='phone_booking_fee') + 0.0000001, 2))"
  - result: "MX(0, RND(raw_phone_fee - MN(raw_phone_fee, standing_phone_fees) + 0.0000001, 2))"
  compute_basis:
    product_phone_fee: "The phone booking fee of a call-center booking is the product's phone booking fee, phone_booking_fee_usd."
    days_since_return: "How the fee is worked out follows the most recent trip reinstatement on the certificate or pass and the calendar days from its entry date to the entry date of the most recent companion booking, the reinstatement date excluded and the booking date included"
    phone_fee_core: "a booking made rebooking_window_days days or fewer after a reinstatement whose ground is a cancellation Crestline made pays the product's phone booking fee multiplied by crestline_rebooking_factor, rounded half up to the cent; a booking made rebooking_window_days days or fewer after a reinstatement whose ground is a voluntary cancellation pays the product's phone booking fee plus a rebooking handling amount of voluntary_rebooking_handling_usd; any other booking, including one with no reinstatement on the product, pays the product's phone booking fee."
    phone_bookings_12m: "The fee is then raised by the companion bookings made through the call center on the certificate or pass with an entry date in the last 12 months counted back from the handling date, the booking being charged included"
    phone_raise_pct: "many_phone_bookings or more such bookings raise it by many_phone_bookings_pct percent, exactly two raise it by two_phone_bookings_pct percent, and a single one leaves it unraised."
    phone_status_waiver_pct: "Summit Diamond or Summit Chairman waives top_status_phone_waiver_pct percent of the raised fee, Summit Gold or Summit Platinum waives mid_status_phone_waiver_pct percent, and any other tier waives nothing."
    card_miles_for_phone: "A co-brand card phone credit follows the miles credited to the holder's Summit membership by co-brand card partner accrual entries dated in the last 12 months counted back from the handling date"
    phone_card_credit: "high_card_miles or more give high_card_phone_credit_usd, mid_card_miles to fewer than high_card_miles give mid_card_phone_credit_usd, and fewer than mid_card_miles give nothing."
    raw_phone_fee: "The raw phone booking fee is the fee multiplied by one plus the raise percentage, then by one minus the status waiver percentage, less the co-brand card phone credit, never below zero, rounded half up to the cent."
    standing_phone_fees: "The phone booking fees still standing on the certificate or pass are all phone booking fee charges on its ledger less all phone booking fee refunds on its ledger, and a fee still standing from an earlier booking covers the new fee up to its own amount."
    result: "The phone booking fee charged equals the raw phone booking fee less the part of it covered by the phone booking fees still standing on the certificate or pass, never below zero, rounded half up to the cent; a fee covered in full is still recorded, at zero."
  factors:
  - id: phone_fee_rebooking_context_method
    effect: method
    decides: phone_fee_core
    bindings: [return_ground_for_phone, return_date_for_phone, booking_date_for_phone, days_since_return, phone_fee_core]
    ladder:
    - when: "the booking was made rebooking_window_days days or fewer after a trip reinstatement whose ground is a cancellation Crestline made"
      method: "the product's phone booking fee multiplied by crestline_rebooking_factor, rounded half up to the cent"
    - when: "the booking was made rebooking_window_days days or fewer after a trip reinstatement whose ground is a voluntary cancellation"
      method: "the product's phone booking fee plus a flat rebooking handling amount of voluntary_rebooking_handling_usd"
    - when: "otherwise, including a product with no reinstatement"
      method: "the product's phone booking fee as published"
    baseline:
      phone_fee_core: "product_phone_fee"
    evidence: [history, date]
    cross_difficulty: null
  - id: phone_fee_repeat_call_center
    effect: parameter
    decides: phone_raise_pct
    bindings: [phone_bookings_12m, phone_raise_pct]
    ladder:
    - when: "many_phone_bookings or more call-center companion bookings on the product in the last 12 months"
      value: "K('many_phone_bookings_pct')"
    - when: "exactly two such bookings"
      value: "K('two_phone_bookings_pct')"
    - when: "otherwise (a single one)"
      value: "0"
    baseline:
      phone_raise_pct: "0"
    evidence: [history]
    cross_difficulty: null
  - id: phone_fee_status_waiver
    effect: parameter
    decides: phone_status_waiver_pct
    bindings: [summit_tier_for_phone, phone_status_waiver_pct]
    ladder:
    - when: "the holder's Summit tier is Summit Diamond or Summit Chairman (phone booking fee)"
      value: "K('top_status_phone_waiver_pct')"
    - when: "the holder's Summit tier is Summit Gold or Summit Platinum (phone booking fee)"
      value: "K('mid_status_phone_waiver_pct')"
    - when: "otherwise"
      value: "0"
    baseline:
      phone_status_waiver_pct: "0"
    evidence: [cross_category]
    cross_difficulty: loyalty
  - id: phone_fee_card_credit
    effect: parameter
    decides: phone_card_credit
    bindings: [card_miles_for_phone, phone_card_credit]
    ladder:
    - when: "co-brand card partner accruals of the last 12 months total high_card_miles miles or more (phone booking fee)"
      value: "K('high_card_phone_credit_usd')"
    - when: "they total mid_card_miles to fewer than high_card_miles miles (phone booking fee)"
      value: "K('mid_card_phone_credit_usd')"
    - when: "otherwise"
      value: "0"
    baseline:
      phone_card_credit: "0"
    evidence: [cross_category, history]
    cross_difficulty: loyalty
  baseline:
    rule: >-
      The phone booking fee of a call-center booking is the product's phone booking fee, phone_booking_fee_usd.
    params:
    - phone_booking_fee_usd
  inputs:
    history:
    - {table: companion_ledger, aggregate: count, field: companion_entry_id, within_months: 12, filters: {event_type: companion_trip_redeem, booking_channel: call_center}}
    - {table: companion_ledger, aggregate: sum, field: amount, filters: {event_type: companion_fare_charge, charge_component: phone_booking_fee}}
    - {table: companion_ledger, aggregate: sum, field: amount, filters: {event_type: companion_fare_refund, charge_component: phone_booking_fee}}
    - {category: loyalty, table: loyalty_activity, aggregate: sum, field: miles, within_months: 12, filters: {event_type: loyalty_partner_accrual, partner_code: cobrand_card}}
    cross_category: [loyalty]
- id: companion_ext_booking_taxes_and_fees
  base_policy_refs:
  - companion_booking_rules
  - companion_cancellation
  - companion_designation
  overwrite:
  - base_policy: companion_booking_rules
    superseded_clause: >-
      the companion's taxes and fees when companion_pays_taxes is true
    replaced_by: >-
      The taxes and fees charged equal the gross taxes and fees less the cardholder tax credit, the rebooking tax
      credit and the frequent-flyer tax credit, never below zero, rounded half up to the cent.
  trigger: state_due
  subject:
  - companion_fare_charge
  computes: amount
  target_tool: pay_companion_taxes_and_fees_93ccd8f8
  params:
    ticket_tax_pct: 7.5
    hawaii_tax_share: 0.6
    flight_fees_usd: 23.2
    high_card_miles: 60000
    mid_card_miles: 25000
    high_cardholder_tax_credit_usd: 12
    mid_cardholder_tax_credit_usd: 6
    many_bookings: 3
    many_bookings_tax_credit_usd: 6
    two_bookings_tax_credit_usd: 3
    top_flyer_flights: 12
    mid_flyer_flights: 6
    top_flyer_tax_credit_usd: 8
    mid_flyer_tax_credit_usd: 4
  rule: >-
    Every rounding in this rule is half up to the cent, a value lying exactly on a half cent going up to the next cent. When companion_pays_taxes is true, every companion booking carries the companion's taxes and fees, which the
    holder pays in person as its own charge entry of component taxes and fees on the ledger of the certificate or
    pass, naming the companion ticket of the booking. The taxes and fees of a companion booking are fixed only
    after the certificate's ledger carries that booking's companion fare charge. For a booking made through the
    reservations call center, the taxes and fees are not worked out until the certificate's ledger also carries
    that booking's phone booking fee charge. The taxes and fees of a booking are the ticket tax of ticket_tax_pct
    percent on its most recent companion fare charge, rounded half up to the cent, plus the flight fees of
    flight_fees_usd. The base the ticket tax is taken on follows the itinerary and the channel of the most recent
    companion booking: a booking whose Hawaii surcharge was charged on the same entry date as its companion fare
    is taxed on the companion fare plus that surcharge, taken at hawaii_tax_share of that sum because only the
    part of the journey over United States territory is taxed, rounded half up to the cent; a booking without such a
    surcharge made through the reservations call center is taxed on the companion fare plus the most recent phone
    booking fee charge, rounded half up to the cent; any other booking is taxed on the companion fare alone. The gross
    taxes and fees are that ticket tax plus the flight fees. Three credits are then subtracted together from the
    gross taxes and fees. The cardholder tax credit follows how the certificate or pass was issued together with
    the miles credited to the holder's Summit membership by co-brand card partner accrual entries dated in the
    last 12 months counted back from the handling date: a product issued on a co-brand card anniversary with
    high_card_miles or more such miles gives high_cardholder_tax_credit_usd; a product issued on a co-brand card
    anniversary with mid_card_miles to fewer than high_card_miles such miles gives mid_cardholder_tax_credit_usd;
    every other product gives nothing. The rebooking tax credit follows the companion booking entries on the
    certificate or pass, the booking being charged included: many_bookings or more give
    many_bookings_tax_credit_usd, exactly two give two_bookings_tax_credit_usd, and a single one gives nothing.
    The frequent-flyer tax credit follows the Crestline flight accrual entries posted to the holder's Summit
    membership in the last 12 months counted back from the handling date: top_flyer_flights or more give
    top_flyer_tax_credit_usd, mid_flyer_flights to fewer than top_flyer_flights give mid_flyer_tax_credit_usd, and
    fewer than mid_flyer_flights give nothing. The taxes and fees charged equal the gross taxes and fees less the
    cardholder tax credit, the rebooking tax credit and the frequent-flyer tax credit, never below zero, rounded half up to
    the cent.
  prerequisite:
  - problem: companion_ext_booking_companion_fare
    kind: value_input
    gate: fare_posted_for_tax
    form: state
    policy_source: >-
      The taxes and fees of a companion booking are fixed only after the certificate's ledger carries that
      booking's companion fare charge.
    condition: >-
      The certificate's ledger carries a charge entry of component companion fare for the booking's companion
      ticket, so the most recent companion fare charge on the certificate is the one for that booking.
    resolved_by: pay_companion_fare_charge_130546ae
    effect: >-
      Once the booking's companion fare charge is posted, the ticket tax is taken on that fare; before it, the most
      recent companion fare charge belongs to an earlier booking and the ticket tax, and so the taxes and fees,
      come out different.
  - problem: companion_ext_booking_phone_fee
    kind: value_input
    gate: phone_posted_for_tax
    form: state
    policy_source: >-
      For a booking made through the reservations call center, the taxes and fees are not worked out until the
      certificate's ledger also carries that booking's phone booking fee charge.
    condition: >-
      For a call-center booking, the certificate's ledger carries a charge entry of component phone booking fee for
      the booking's companion ticket, so the most recent phone booking fee charge is the one for that booking.
    resolved_by: pay_companion_phone_booking_fee_ff06513e
    effect: >-
      Once the booking's phone booking fee charge is posted, the call-center tax base is the companion fare plus
      that fee; before it, the most recent phone booking fee charge belongs to an earlier booking and the ticket
      tax comes out different.
  cross_category:
  - category: loyalty
    as: history
    reads:
    - loyalty_activity.miles
    - loyalty_activity.activity_date
    note: The cardholder tax credit sums the co-brand card partner accruals of the last 12 months; the
      frequent-flyer tax credit counts the flight accruals of the last 12 months.
  compute:
  - fare_posted_for_tax: "LATEST('companion_ledger', 'amount', date_field='entry_date', event_type='companion_fare_charge', charge_component='companion_fare')"
  - fare_posted_date: "LATEST('companion_ledger', 'entry_date', date_field='entry_date', event_type='companion_fare_charge', charge_component='companion_fare')"
  - surcharge_posted_same_date: "(LATEST('companion_ledger', 'amount', date_field='entry_date', event_type='companion_fare_charge', charge_component='hawaii_surcharge') or 0) if LATEST('companion_ledger', 'entry_date', date_field='entry_date', event_type='companion_fare_charge', charge_component='hawaii_surcharge') == fare_posted_date else 0"
  - booking_channel_for_tax: "LATEST('companion_ledger', 'booking_channel', date_field='entry_date', event_type='companion_trip_redeem')"
  - phone_posted_for_tax: "LATEST('companion_ledger', 'amount', date_field='entry_date', event_type='companion_fare_charge', charge_component='phone_booking_fee') or 0"
  - ticket_tax: "RND(K('ticket_tax_pct') / 100 * (fare_posted_for_tax + surcharge_posted_same_date) * K('hawaii_tax_share') + 0.0000001, 2) if surcharge_posted_same_date > 0 else (RND(K('ticket_tax_pct') / 100 * (fare_posted_for_tax + phone_posted_for_tax) + 0.0000001, 2) if booking_channel_for_tax == 'call_center' else RND(K('ticket_tax_pct') / 100 * fare_posted_for_tax + 0.0000001, 2))"
  - gross_taxes: "RND(ticket_tax + K('flight_fees_usd') + 0.0000001, 2)"
  - card_miles_for_tax: "XSUM('loyalty', 'loyalty_activity', 'miles', within_months=12, date_field='activity_date', event_type='loyalty_partner_accrual', partner_code='cobrand_card')"
  - cardholder_tax_credit: "K('high_cardholder_tax_credit_usd') if (F('issue_source') == 'cobrand_card_anniversary' and card_miles_for_tax >= K('high_card_miles')) else (K('mid_cardholder_tax_credit_usd') if (F('issue_source') == 'cobrand_card_anniversary' and card_miles_for_tax >= K('mid_card_miles')) else 0)"
  - bookings_for_tax: "COUNT('companion_ledger', date_field='entry_date', event_type='companion_trip_redeem')"
  - rebooking_tax_credit: "K('many_bookings_tax_credit_usd') if bookings_for_tax >= K('many_bookings') else (K('two_bookings_tax_credit_usd') if bookings_for_tax == 2 else 0)"
  - flights_for_tax: "XCOUNT('loyalty', 'loyalty_activity', within_months=12, date_field='activity_date', event_type='loyalty_flight_accrual')"
  - flyer_tax_credit: "K('top_flyer_tax_credit_usd') if flights_for_tax >= K('top_flyer_flights') else (K('mid_flyer_tax_credit_usd') if flights_for_tax >= K('mid_flyer_flights') else 0)"
  - result: "MX(0, RND(gross_taxes - cardholder_tax_credit - rebooking_tax_credit - flyer_tax_credit + 0.0000001, 2))"
  compute_basis:
    fare_posted_for_tax: "The taxes and fees of a booking are the ticket tax of ticket_tax_pct percent on its most recent companion fare charge, rounded half up to the cent, plus the flight fees of flight_fees_usd."
    surcharge_posted_same_date: "a booking whose Hawaii surcharge was charged on the same entry date as its companion fare"
    booking_channel_for_tax: "The base the ticket tax is taken on follows the itinerary and the channel of the most recent companion booking"
    ticket_tax: "a booking whose Hawaii surcharge was charged on the same entry date as its companion fare is taxed on the companion fare plus that surcharge, taken at hawaii_tax_share of that sum because only the part of the journey over United States territory is taxed, rounded half up to the cent; a booking without such a surcharge made through the reservations call center is taxed on the companion fare plus the most recent phone booking fee charge, rounded half up to the cent; any other booking is taxed on the companion fare alone."
    gross_taxes: "The gross taxes and fees are that ticket tax plus the flight fees."
    card_miles_for_tax: "the miles credited to the holder's Summit membership by co-brand card partner accrual entries dated in the last 12 months counted back from the handling date"
    cardholder_tax_credit: "a product issued on a co-brand card anniversary with high_card_miles or more such miles gives high_cardholder_tax_credit_usd; a product issued on a co-brand card anniversary with mid_card_miles to fewer than high_card_miles such miles gives mid_cardholder_tax_credit_usd; every other product gives nothing."
    bookings_for_tax: "The rebooking tax credit follows the companion booking entries on the certificate or pass, the booking being charged included"
    rebooking_tax_credit: "many_bookings or more give many_bookings_tax_credit_usd, exactly two give two_bookings_tax_credit_usd, and a single one gives nothing."
    flights_for_tax: "The frequent-flyer tax credit follows the Crestline flight accrual entries posted to the holder's Summit membership in the last 12 months counted back from the handling date"
    flyer_tax_credit: "top_flyer_flights or more give top_flyer_tax_credit_usd, mid_flyer_flights to fewer than top_flyer_flights give mid_flyer_tax_credit_usd, and fewer than mid_flyer_flights give nothing."
    result: "The taxes and fees charged equal the gross taxes and fees less the cardholder tax credit, the rebooking tax credit and the frequent-flyer tax credit, never below zero, rounded half up to the cent."
  factors:
  - id: taxes_ticket_tax_base_method
    effect: method
    decides: ticket_tax
    bindings: [fare_posted_date, surcharge_posted_same_date, booking_channel_for_tax, phone_posted_for_tax, ticket_tax]
    ladder:
    - when: "the booking's Hawaii surcharge was charged on the same entry date as its companion fare"
      method: "ticket tax on the companion fare plus the surcharge, taken at hawaii_tax_share of that sum"
    - when: "no such surcharge and the booking was made through the reservations call center"
      method: "ticket tax on the companion fare plus the most recent phone booking fee charge"
    - when: "otherwise"
      method: "ticket tax on the companion fare alone"
    baseline:
      ticket_tax: "RND(K('ticket_tax_pct') / 100 * fare_posted_for_tax + 0.0000001, 2)"
    evidence: [history]
    cross_difficulty: null
  - id: taxes_cardholder_credit
    effect: parameter
    decides: cardholder_tax_credit
    bindings: [card_miles_for_tax, cardholder_tax_credit]
    ladder:
    - when: "the product was issued on a co-brand card anniversary AND co-brand card partner accruals of the last 12 months total high_card_miles miles or more"
      value: "K('high_cardholder_tax_credit_usd')"
    - when: "the product was issued on a co-brand card anniversary AND those accruals total mid_card_miles to fewer than high_card_miles miles"
      value: "K('mid_cardholder_tax_credit_usd')"
    - when: "otherwise"
      value: "0"
    baseline:
      cardholder_tax_credit: "0"
    evidence: [cross_category, history]
    cross_difficulty: loyalty
  - id: taxes_rebooking_credit
    effect: parameter
    decides: rebooking_tax_credit
    bindings: [bookings_for_tax, rebooking_tax_credit]
    ladder:
    - when: "many_bookings or more companion booking entries on the product"
      value: "K('many_bookings_tax_credit_usd')"
    - when: "exactly two companion booking entries on the product"
      value: "K('two_bookings_tax_credit_usd')"
    - when: "otherwise (a single one)"
      value: "0"
    baseline:
      rebooking_tax_credit: "0"
    evidence: [history]
    cross_difficulty: null
  - id: taxes_frequent_flyer_credit
    effect: parameter
    decides: flyer_tax_credit
    bindings: [flights_for_tax, flyer_tax_credit]
    ladder:
    - when: "top_flyer_flights or more flight accrual entries on the Summit membership in the last 12 months (taxes and fees)"
      value: "K('top_flyer_tax_credit_usd')"
    - when: "mid_flyer_flights to fewer than top_flyer_flights such entries (taxes and fees)"
      value: "K('mid_flyer_tax_credit_usd')"
    - when: "otherwise"
      value: "0"
    baseline:
      flyer_tax_credit: "0"
    evidence: [cross_category, history]
    cross_difficulty: loyalty
  baseline:
    rule: >-
      The taxes and fees of a booking are the ticket tax of ticket_tax_pct percent on its most recent companion fare
      charge, rounded half up to the cent, plus the flight fees of flight_fees_usd.
    params:
    - ticket_tax_pct
    - flight_fees_usd
  inputs:
    history:
    - {table: companion_ledger, aggregate: latest, field: amount, filters: {event_type: companion_fare_charge}}
    - {table: companion_ledger, aggregate: count, field: companion_entry_id, filters: {event_type: companion_trip_redeem}}
    - {category: loyalty, table: loyalty_activity, aggregate: sum, field: miles, within_months: 12, filters: {event_type: loyalty_partner_accrual, partner_code: cobrand_card}}
    - {category: loyalty, table: loyalty_activity, aggregate: count, field: loyalty_activity_id, within_months: 12, filters: {event_type: loyalty_flight_accrual}}
    cross_category: [loyalty]
- id: companion_ext_crestline_cancel_phone_fee_refund
  base_policy_refs:
  - companion_cancellation
  - companion_refund_controls
  overwrite:
  - base_policy: companion_cancellation
    superseded_clause: >-
      phone booking fees are not refunded
    replaced_by: >-
      The phone booking fee refund equals the claim-window refund multiplied by one plus the combined uplift
      percentage, rounded half up to the cent, and never more than the phone booking fees still standing on the certificate
      or pass.
  - base_policy: companion_refund_controls
    superseded_clause: >-
      a refund equals the amount of the charge it names
    replaced_by: >-
      The phone booking fee refund equals the claim-window refund multiplied by one plus the combined uplift
      percentage, rounded half up to the cent, and never more than the phone booking fees still standing on the certificate
      or pass.
  trigger: state_due
  subject:
  - companion_fare_refund
  computes: amount
  target_tool: refund_companion_phone_booking_fee_90a9c390
  params:
    full_refund_days: 30
    claim_window_days: 120
    top_status_uplift_pct: 20
    mid_status_uplift_pct: 10
    long_member_months: 120
    mid_member_months: 60
    long_member_uplift_pct: 10
    mid_member_uplift_pct: 5
    top_club_uplift_pct: 10
    base_club_uplift_pct: 5
  rule: >-
    Every rounding in this rule is half up to the cent, a value lying exactly on a half cent going up to the next cent. A voluntary cancellation never returns a phone booking fee, but when Crestline cancels a companion booking the
    phone booking fee paid on it is refunded by the companion desk in one refund entry that names that phone
    booking fee charge. The phone booking fee still standing on the certificate or pass is all phone booking fee
    charges on its ledger less all phone booking fee refunds on its ledger. The phone booking fee refund of a
    booking is nothing, as the standing product rule gives it. How much comes back follows the most recent trip
    reinstatement on the certificate or pass and the calendar days from its entry date to the handling date, the
    reinstatement date excluded and the handling date included: when that reinstatement's ground is a
    cancellation Crestline made and full_refund_days days or fewer have passed, the whole standing fee comes back;
    when its ground is a cancellation Crestline made and more than full_refund_days but no more than
    claim_window_days days have passed, the standing fee comes back pro-rated over the rest of the claim window,
    that is multiplied by claim_window_days less the days passed and divided by claim_window_days less
    full_refund_days, rounded half up to the cent; in every other case nothing comes back. That gives the claim-window
    refund. Three uplifts raise the claim-window refund, first added into one uplift percentage that is applied
    once. The status uplift follows the holder's current Summit tier: Summit Diamond or Summit Chairman adds
    top_status_uplift_pct percent, Summit Gold or Summit Platinum adds mid_status_uplift_pct percent, and any
    other tier adds nothing. The membership-age uplift follows the whole calendar months from the enrolled date of
    the holder's Summit membership to the handling date: long_member_months months or more add
    long_member_uplift_pct percent, mid_member_months to fewer than long_member_months months add
    mid_member_uplift_pct percent, and fewer than mid_member_months months add nothing. The lounge uplift follows
    the holder's active Summit Club membership: Summit Club Executive or Summit Club Lifetime adds
    top_club_uplift_pct percent, Summit Club Individual or Summit Club Individual Plus adds base_club_uplift_pct
    percent, and no active membership or any other club product adds nothing. The phone booking fee refund equals
    the claim-window refund multiplied by one plus the combined uplift percentage, rounded half up to the cent, and never
    more than the phone booking fees still standing on the certificate or pass.
  prerequisite: []
  cross_category:
  - category: loyalty
    as: branch
    reads:
    - variant_name
    - enrolled_date
    note: The status uplift reads the Summit tier and the membership-age uplift reads the Summit enrolled date.
  - category: club
    as: branch
    reads:
    - variant_name
    - status
    note: The lounge uplift is decided by the holder's active Summit Club product.
  compute:
  - standing_fee_for_refund: "MX(0, RND(SUM('companion_ledger', 'amount', date_field='entry_date', event_type='companion_fare_charge', charge_component='phone_booking_fee') - SUM('companion_ledger', 'amount', date_field='entry_date', event_type='companion_fare_refund', charge_component='phone_booking_fee') + 0.0000001, 2))"
  - refund_return_ground: "LATEST('companion_ledger', 'reinstatement_ground', date_field='entry_date', event_type='companion_trip_reinstate')"
  - refund_return_date: "LATEST('companion_ledger', 'entry_date', date_field='entry_date', event_type='companion_trip_reinstate')"
  - days_since_crestline_return: "DAYS(refund_return_date, NOW) if refund_return_date else K('claim_window_days') + 1"
  - claim_window_refund: "standing_fee_for_refund if (refund_return_ground == 'crestline_cancellation' and days_since_crestline_return <= K('full_refund_days')) else (RND(standing_fee_for_refund * (K('claim_window_days') - days_since_crestline_return) / (K('claim_window_days') - K('full_refund_days')) + 0.0000001, 2) if (refund_return_ground == 'crestline_cancellation' and days_since_crestline_return <= K('claim_window_days')) else 0)"
  - summit_tier_for_uplift: "CFIELD('loyalty', 'variant_name')"
  - status_uplift_pct: "K('top_status_uplift_pct') if (summit_tier_for_uplift == 'Summit Diamond' or summit_tier_for_uplift == 'Summit Chairman') else (K('mid_status_uplift_pct') if (summit_tier_for_uplift == 'Summit Gold' or summit_tier_for_uplift == 'Summit Platinum') else 0)"
  - member_months_for_uplift: "MONTHS(CFIELD('loyalty', 'enrolled_date'), NOW)"
  - member_uplift_pct: "K('long_member_uplift_pct') if member_months_for_uplift >= K('long_member_months') else (K('mid_member_uplift_pct') if member_months_for_uplift >= K('mid_member_months') else 0)"
  - club_product_for_uplift: "CFIELD('club', 'variant_name', status='active')"
  - lounge_uplift_pct: "K('top_club_uplift_pct') if (club_product_for_uplift == 'Summit Club Executive' or club_product_for_uplift == 'Summit Club Lifetime') else (K('base_club_uplift_pct') if (club_product_for_uplift == 'Summit Club Individual' or club_product_for_uplift == 'Summit Club Individual Plus') else 0)"
  - result: "MX(0, MN(standing_fee_for_refund, RND(claim_window_refund * (1 + (status_uplift_pct + member_uplift_pct + lounge_uplift_pct) / 100) + 0.0000001, 2)))"
  compute_basis:
    standing_fee_for_refund: "The phone booking fee still standing on the certificate or pass is all phone booking fee charges on its ledger less all phone booking fee refunds on its ledger."
    days_since_crestline_return: "How much comes back follows the most recent trip reinstatement on the certificate or pass and the calendar days from its entry date to the handling date, the reinstatement date excluded and the handling date included"
    claim_window_refund: "when that reinstatement's ground is a cancellation Crestline made and full_refund_days days or fewer have passed, the whole standing fee comes back; when its ground is a cancellation Crestline made and more than full_refund_days but no more than claim_window_days days have passed, the standing fee comes back pro-rated over the rest of the claim window, that is multiplied by claim_window_days less the days passed and divided by claim_window_days less full_refund_days, rounded half up to the cent; in every other case nothing comes back."
    status_uplift_pct: "Summit Diamond or Summit Chairman adds top_status_uplift_pct percent, Summit Gold or Summit Platinum adds mid_status_uplift_pct percent, and any other tier adds nothing."
    member_months_for_uplift: "The membership-age uplift follows the whole calendar months from the enrolled date of the holder's Summit membership to the handling date"
    member_uplift_pct: "long_member_months months or more add long_member_uplift_pct percent, mid_member_months to fewer than long_member_months months add mid_member_uplift_pct percent, and fewer than mid_member_months months add nothing."
    lounge_uplift_pct: "Summit Club Executive or Summit Club Lifetime adds top_club_uplift_pct percent, Summit Club Individual or Summit Club Individual Plus adds base_club_uplift_pct percent, and no active membership or any other club product adds nothing."
    result: "The phone booking fee refund equals the claim-window refund multiplied by one plus the combined uplift percentage, rounded half up to the cent, and never more than the phone booking fees still standing on the certificate or pass."
  factors:
  - id: phone_refund_claim_window_method
    effect: method
    decides: claim_window_refund
    bindings: [refund_return_ground, refund_return_date, days_since_crestline_return, claim_window_refund]
    ladder:
    - when: "the most recent trip reinstatement is a cancellation Crestline made and full_refund_days days or fewer have passed since it"
      method: "the whole standing phone booking fee comes back"
    - when: "it is a cancellation Crestline made and more than full_refund_days but no more than claim_window_days days have passed"
      method: "the standing fee pro-rated over the rest of the claim window: multiplied by claim_window_days less the days passed, divided by claim_window_days less full_refund_days"
    - when: "otherwise, including every voluntary cancellation"
      method: "nothing comes back"
    baseline:
      claim_window_refund: "0"
    evidence: [history, date]
    cross_difficulty: null
  - id: phone_refund_status_uplift
    effect: parameter
    decides: status_uplift_pct
    bindings: [summit_tier_for_uplift, status_uplift_pct]
    ladder:
    - when: "the holder's Summit tier is Summit Diamond or Summit Chairman (phone fee refund)"
      value: "K('top_status_uplift_pct')"
    - when: "the holder's Summit tier is Summit Gold or Summit Platinum (phone fee refund)"
      value: "K('mid_status_uplift_pct')"
    - when: "otherwise"
      value: "0"
    baseline:
      status_uplift_pct: "0"
    evidence: [cross_category]
    cross_difficulty: loyalty
  - id: phone_refund_membership_age_uplift
    effect: parameter
    decides: member_uplift_pct
    bindings: [member_months_for_uplift, member_uplift_pct]
    ladder:
    - when: "the Summit membership was enrolled long_member_months or more whole months before the handling date (phone fee refund)"
      value: "K('long_member_uplift_pct')"
    - when: "enrolled mid_member_months to fewer than long_member_months months before (phone fee refund)"
      value: "K('mid_member_uplift_pct')"
    - when: "otherwise"
      value: "0"
    baseline:
      member_uplift_pct: "0"
    evidence: [cross_category, date]
    cross_difficulty: loyalty
  - id: phone_refund_lounge_uplift
    effect: parameter
    decides: lounge_uplift_pct
    bindings: [club_product_for_uplift, lounge_uplift_pct]
    ladder:
    - when: "the holder's active Summit Club product is Summit Club Executive or Summit Club Lifetime (phone fee refund)"
      value: "K('top_club_uplift_pct')"
    - when: "it is Summit Club Individual or Summit Club Individual Plus (phone fee refund)"
      value: "K('base_club_uplift_pct')"
    - when: "otherwise"
      value: "0"
    baseline:
      lounge_uplift_pct: "0"
    evidence: [cross_category]
    cross_difficulty: club
  baseline:
    rule: >-
      The phone booking fee refund of a booking is nothing, as the standing product rule gives it.
    params: []
  inputs:
    history:
    - {table: companion_ledger, aggregate: sum, field: amount, filters: {event_type: companion_fare_charge, charge_component: phone_booking_fee}}
    - {table: companion_ledger, aggregate: sum, field: amount, filters: {event_type: companion_fare_refund, charge_component: phone_booking_fee}}
    - {table: companion_ledger, aggregate: latest, field: entry_date, filters: {event_type: companion_trip_reinstate}}
    cross_category: [loyalty, club]
