- id: companion_issuance
  subject:
  - companion_issue
  - companion_trip_grant
  - companion_activate
  rule: 'Each product is issued only from the sources in its entry_gate: card-anniversary certificates within deposit_days_after_trigger
    calendar days after the card anniversary once the card year''s purchases reach cobrand_spend_requirement_usd,
    choice-benefit certificates when a Summit member of the listed tier makes a companion_certificate selection
    under the loyalty charter, and passes within deposit_days_after_trigger calendar days after the holder''s promotion
    qualification. A companion product is issued only to a customer whose Summit membership status is enrolled,
    active or dormant. The book_by_date is the issue_date plus validity_months calendar months, keeping the day-of-month
    and falling back to the last day of the month when that day does not exist. On issue the product receives trips_granted
    companion trips in one grant entry and becomes active. A trip grant is booked only on a certificate or pass
    whose status is issued. A support agent does not issue card-anniversary certificates or passes; a customer whose
    certificate has not arrived within deposit_days_after_trigger is transferred to a human representative, while
    one who asks before that period ends is told when it will arrive.'
