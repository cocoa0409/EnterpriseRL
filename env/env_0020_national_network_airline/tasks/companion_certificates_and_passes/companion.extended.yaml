# Product charter: Crestline Companion Certificates and Passes (category key: companion).
# Policy constants live only here; the runtime never reads this file.
category: companion
display_name: Crestline Companion Certificates and Passes
binding:
  holding_table: companion_holdings
  event_tables:
  - companion_ledger
  status_field: status
  variant_field: variant_name
  quantity_fields:
    trips_remaining: companion_trips
lifecycle:
  states:
  - issued
  - active
  - used
  - expired
  - revoked
  transitions:
  - from: issued
    to: active
    by: system
    means: The companion trips are granted and the certificate or pass becomes bookable.
  - from: issued
    to: revoked
    by: agent
    means: A certificate issued in error is withdrawn before it becomes bookable.
  - from: active
    to: used
    by: system
    means: The last companion trip was booked.
  - from: used
    to: active
    by: system
    means: A cancelled companion booking returned a trip to a used certificate or pass.
  - from: active
    to: expired
    by: system
    means: The book_by_date passed with trips remaining.
  - from: active
    to: revoked
    by: agent
    means: The certificate or pass is withdrawn because its holder no longer meets the holding conditions.
accounts:
- key: companion_trips
  unit: trips
  meaning: Companion trips still bookable on the certificate or pass; grants and reinstatements add, bookings and
    forfeitures deduct.
- key: companion_charges
  unit: USD
  meaning: Companion fares, taxes and companion service fees paid by the holder, less amounts refunded.
parameter_schema:
  eligible_fare_brands: Fare brands in which the holder and the companion may be ticketed together (list of official
    fare brand names)
  route_scope: 'Itinerary classes on which the companion may travel (enum: domestic | domestic_and_short_haul)'
  trip_definition: 'What one companion trip covers (enum: round_trip | one_way)'
  trips_granted: Companion trips granted when the certificate or pass becomes active (integer, trips)
  max_trips_per_calendar_month: Most companion trips whose outbound travel date falls in one calendar month (integer,
    trips)
  validity_months: Calendar months from issue_date to the book_by_date (integer, months)
  travel_must_complete_by_book_by_date: Whether the companion's last flight must also depart on or before the book_by_date
    (boolean)
  advance_booking_min_days: Calendar days before the first departure by which the companion trip must be booked
    (integer, calendar days)
  blackout_periods: Travel periods in which no companion flight may depart (list of {from, to} as MM-DD, inclusive,
    repeating every year)
  companion_base_fare_usd: Base fare the holder pays for the companion per trip, before taxes (USD)
  companion_pays_taxes: Whether government taxes and fees on the companion ticket are paid by the holder (boolean)
  phone_booking_fee_usd: Fee per companion trip booked through the reservations call center (USD)
  max_companions_per_booking: Companions per reservation using this certificate or pass (integer, persons)
  same_reservation_required: Whether the companion must be on the same reservation and flights as the holder (boolean)
  holder_must_travel: Whether the certificate or pass holder must be the primary traveler (boolean)
  transferable: Whether the certificate or pass may be given to another customer (boolean)
  summit_membership_required: Whether the holder must have an open Summit membership to book (boolean)
  partner_flights_eligible: Whether partner-operated flights may be booked with it (boolean)
  award_primary_eligible: Whether the holder may travel on an award ticket (boolean)
  combinable_with_other_companion_products: Whether another companion certificate or pass may be used on the same
    reservation (boolean)
  companion_fare_payable_with_credit: Whether the companion fare and taxes may be paid with a Crestline credit whose
    own rules allow it (boolean)
  companion_earns_miles: Whether the companion ticket earns Summit miles or qualifying dollars (boolean)
  companion_fare_includes_first_bag: Whether the companion's first checked bag is free regardless of fare brand
    (boolean)
  companion_same_day_change_permitted: Whether the holder and companion may make a same-day confirmed change together
    (boolean)
  cancellation_cutoff_hours_before_departure: Latest point for cancelling a companion booking with the trip reinstated,
    counted back from the first scheduled departure (integer, elapsed hours)
  cancellation_reinstates_trip: Whether cancelling an unflown companion booking returns the trip (boolean)
  reinstatement_fee_usd: Fee to reinstate a trip after a voluntary cancellation (USD)
  reinstated_trip_keeps_book_by_date: Whether a reinstated trip keeps the original book_by_date (boolean)
  companion_cancelled_with_holder: Whether cancelling the holder's ticket automatically cancels the companion's
    (boolean)
  companion_fare_refund_form: 'Form in which the companion fare and taxes are refunded on a cancellation (enum:
    original_form | flight_credit)'
  irrops_reinstatement_extension_days: Calendar days added to the book_by_date when a trip is reinstated because
    Crestline cancelled the companion's flight after the book_by_date passed (integer, calendar days)
  designation_required: Whether a named companion must be designated on the pass before booking (boolean)
  designation_changes_allowed: Changes of the designated companion allowed over the life of the pass (integer, changes)
  designation_change_fee_usd: Fee per change of the designated companion (USD)
  deposit_days_after_trigger: Calendar days after the card anniversary or promotion qualification within which the
    certificate or pass is issued (integer, calendar days)
  cobrand_spend_requirement_usd: Card purchases in the card membership year required for the anniversary certificate;
    0 means none (USD)
  max_active_same_variant: Most certificates or passes of this variant one customer may hold in issued or active
    status at once (integer, count)
  companion_seat_selection_matches_holder: Whether the companion receives the same advance seat entitlement as the
    holder's fare brand (boolean)
  companion_bag_allowance_matches_holder: Whether the companion receives the holder's fare-brand checked bag allowance
    (boolean)
  complimentary_upgrade_for_companion: Whether the companion may clear an upgrade with the holder under the holder's
    Summit companion upgrade entitlement (boolean)
  stopovers_permitted: Whether a stopover longer than 24 hours is allowed within one companion trip (boolean)
  one_way_trip_counts_as_full_trip: Whether a one-way booking on a round-trip certificate consumes the whole certificate
    (boolean)
  minimum_age_companion_years: Youngest companion who may travel without the holder's adult booking rules applying
    (integer, years)
  name_change_on_companion_ticket_permitted: Whether the companion's name may be changed on an issued companion
    ticket beyond a name correction (boolean)
  hawaii_eligible: Whether travel to or from Hawaii counts as domestic for this product (boolean)
  hawaii_surcharge_usd: Additional companion fare per trip for travel to or from Hawaii when eligible (USD)
  max_segments_per_direction: Most flight segments in each direction of one companion trip, connections included
    (integer, segments)
  revocation_on_membership_closure: Whether closing the holder's Summit membership revokes the unused certificate
    or pass (boolean)
