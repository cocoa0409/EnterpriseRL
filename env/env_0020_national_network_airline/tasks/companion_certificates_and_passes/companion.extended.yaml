- id: companion_booking_rules
  subject:
  - companion_trip_redeem
  - companion_fare_charge
  - companion_mark_used
  rule: A companion trip can be booked only while the certificate or pass is active. A companion trip can be booked
    only on or before the book-by date shown on the certificate or pass. The book-by date is inclusive and counted
    in calendar days in US Central time; when travel_must_complete_by_book_by_date is true every companion flight
    must also depart on or before it. The holder must travel as primary passenger when holder_must_travel is true,
    and the companion must be on the same reservation and flights when same_reservation_required is true; both are
    ticketed in one of the eligible_fare_brands in the same cabin, never on partner flights, and the holder never
    on an award ticket. The itinerary must be within route_scope, where domestic_and_short_haul adds short-haul
    international itineraries and travel to or from Hawaii counts as domestic only when hawaii_eligible is true.
    No companion flight may depart inside the blackout_periods, no direction may have more than max_segments_per_direction
    segments, and the trip must be booked at least advance_booking_min_days calendar days before its first departure.
    A pass must have a designated_companion_name before any booking when designation_required is true, and only
    that person may travel as its companion. The trips booked for one travel month, counted by companion_msr_trips_in_travel_month,
    may not exceed max_trips_per_calendar_month. Each booking consumes one trip as defined by trip_definition; a
    one-way booking on a round-trip certificate consumes the whole certificate when one_way_trip_counts_as_full_trip
    is true. The holder pays companion_base_fare_usd, the hawaii_surcharge_usd when the itinerary touches Hawaii,
    the companion's taxes and fees when companion_pays_taxes is true, and phone_booking_fee_usd when booked through
    the call center, each as its own charge entry; the companion fare may be paid with a Crestline credit only when
    both this product and the credit allow it. The companion ticket earns no miles or qualifying dollars, and the
    companion receives the holder's fare-brand seat and bag entitlements, with a free first bag when companion_fare_includes_first_bag
    is true. When trips_remaining reaches zero the product becomes used. A companion trip is booked only when the
    holder's Summit membership is not closed.
  eligibility:
  - id: book_active
    applies_to:
    - companion_trip_redeem
    kind: state
    condition: A companion trip can be booked only while the certificate or pass is active.
    evidence_fields:
    - companion_holdings.companion_id
    - companion_holdings.status
    - companion_holdings.trips_remaining
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - companion_holdings.companion_id
      action_bindings:
        companion_holdings.companion_id: companion_id
    state_contract:
      field: companion_holdings.status
      allowed:
      - active
  - id: book_by
    applies_to:
    - companion_trip_redeem
    kind: time
    condition: A companion trip can be booked only on or before the book-by date shown on the certificate or pass.
    evidence_fields:
    - companion_holdings.companion_id
    - companion_holdings.book_by_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - companion_holdings.companion_id
      action_bindings:
        companion_holdings.companion_id: companion_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the book-by date shown on the certificate or pass
      anchor_source: companion_holdings.book_by_date
      relation: not_after
      duration_source: params.book_by_grace_days
      unit: calendar_days
      counting_rule: The book-by date is inclusive and counted in calendar days in US Central time
      boundary: inclusive
  - id: holder_membership_open
    applies_to:
    - companion_trip_redeem
    kind: state
    condition: A companion trip is booked only when the holder's Summit membership is not closed.
    evidence_fields:
    - loyalty_holdings.membership_id
    - loyalty_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - loyalty_holdings.membership_id
      action_bindings:
        loyalty_holdings.membership_id: membership_id
    state_contract:
      field: loyalty_holdings.status
      allowed:
      - enrolled
      - active
      - dormant
  params:
    book_by_grace_days: 0
    per_tier:
      Crestline Companion Certificate Main Cabin:
        eligible_fare_brands: =eligible_fare_brands
        max_segments_per_direction: =max_segments_per_direction
        route_scope: =route_scope
        trip_definition: =trip_definition
        max_trips_per_calendar_month: =max_trips_per_calendar_month
        travel_must_complete_by_book_by_date: =travel_must_complete_by_book_by_date
        advance_booking_min_days: =advance_booking_min_days
        blackout_periods: =blackout_periods
        companion_base_fare_usd: =companion_base_fare_usd
        companion_pays_taxes: =companion_pays_taxes
        phone_booking_fee_usd: =phone_booking_fee_usd
        same_reservation_required: =same_reservation_required
        holder_must_travel: =holder_must_travel
        partner_flights_eligible: =partner_flights_eligible
        award_primary_eligible: =award_primary_eligible
        designation_required: =designation_required
        companion_fare_payable_with_credit: =companion_fare_payable_with_credit
        companion_earns_miles: =companion_earns_miles
