- id: companion_cancellation
  subject:
  - companion_trip_reinstate
  - companion_restore
  - companion_fare_refund
  - companion_fare_charge
  rule: Cancelling the holder's ticket cancels the companion's ticket too when companion_cancelled_with_holder is
    true; the companion ticket may be cancelled alone, and the holder then travels on their own ticket. A voluntary
    cancellation returns the trip only when cancellation_reinstates_trip is true and the companion booking is cancelled
    no later than the first scheduled departure of the companion booking minus cancellation_cutoff_hours_before_departure.
    The cutoff is counted back in full elapsed hours from the scheduled departure of the companion's first flight,
    and a cancellation exactly at the cutoff is accepted; after it the trip is used up. A reinstated trip keeps
    the original book_by_date when reinstated_trip_keeps_book_by_date is true, so a trip reinstated after the book_by_date
    has passed can no longer be booked and is forfeited at expiry. A voluntary reinstatement carries reinstatement_fee_usd,
    charged as its own charge entry. When Crestline cancels the companion's flight and the holder does not accept
