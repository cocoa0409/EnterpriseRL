events:
- type: business_enroll
  target: business_holdings
  mutation: create
  meaning: A company applies for a corporate travel agreement.
  grain: One row per agreement.
  fields:
    variant_name: tier applied for
    agreement_number: agreement number
    tour_code: corporate code
    travel_manager_name: travel manager
    enrolled_date: application date
  triggers: []
- type: business_approve
  target: business_holdings
  mutation:
    transition:
      from: applied
      to: active
  meaning: The application is approved and the agreement starts.
  grain: One per agreement.
  fields:
    approved_date: start date
    agreement_end_date: end of first term
  triggers: []
- type: business_decline
  target: business_holdings
  mutation:
    transition:
      from: applied
      to: declined
  meaning: The application is declined.
  grain: One per agreement.
  fields:
    closed_date: date declined
  triggers: []
- type: business_traveler_add
  target: business_roster
  meaning: A traveler is added to the agreement's roster.
  grain: One entry per traveler addition.
  distinguish_by:
  - traveler_customer_id
  - roster_date
  fields:
    roster_date: effective date
    traveler_customer_id: traveler
    traveler_role: role
  triggers: []
- type: business_traveler_remove
  target: business_roster
  meaning: A traveler is removed from the agreement's roster.
  grain: One entry per traveler removal.
  distinguish_by:
  - traveler_customer_id
  - roster_date
  fields:
    roster_date: effective date
    traveler_customer_id: traveler
    removal_reason: why
  triggers: []
- type: business_points_accrual
  target: business_activity
  meaning: Points are credited for a flown segment of a ticket booked under the agreement.
  grain: One entry per flown segment credited.
  distinguish_by:
  - source_ticket_id
  - segment_number
  fields:
    activity_date: posting date
    points: points credited
    spend_usd: eligible spend of the segment
    source_ticket_id: ticket flown
    segment_number: segment flown
    traveler_customer_id: traveler
  account: business_points
  direction: in
  triggers:
  - event: business:business_spend_post
    map:
      spend_usd: spend_usd
      source_ticket_id: source_ticket_id
      segment_number: segment_number
      activity_date: activity_date
      traveler_customer_id: traveler_customer_id
- type: business_spend_post
  target: business_activity
  meaning: Eligible flown spend of a segment is added to the agreement year.
  grain: One entry per flown segment credited.
  distinguish_by:
  - source_ticket_id
  - segment_number
  fields:
    activity_date: posting date
    spend_usd: spend added
    source_ticket_id: ticket flown
    segment_number: segment flown
    traveler_customer_id: traveler
  account: qualifying_spend
  direction: in
  triggers: []
- type: business_bonus_points
  target: business_activity
  meaning: Enrollment, milestone or promotion bonus points are credited.
  grain: One entry per bonus earned.
  distinguish_by:
  - bonus_reason
  - agreement_year_start
  fields:
    activity_date: posting date
    points: bonus points
    bonus_reason: ground
    agreement_year_start: agreement year of a milestone or the approval date for an enrollment bonus
  account: business_points
  direction: in
  triggers: []
- type: business_points_redemption
  target: business_activity
  meaning: Points are redeemed for an award ticket, an upgrade or a Summit status award for a roster traveler.
  grain: One entry per award redeemed.
  distinguish_by:
  - redemption_type
  - traveler_customer_id
  - source_ticket_id
  - segment_number
  - activity_date
  fields:
    activity_date: redemption date
    points: points redeemed
    redemption_type: what for
    award_description: award
    traveler_customer_id: beneficiary traveler
    source_ticket_id: ticket issued or upgraded
    segment_number: segment upgraded
  account: business_points
  direction: out
  triggers: []
- type: business_points_expiry
  target: business_activity
  meaning: Unredeemed points reach the end of their validity.
  grain: One entry per earning month expiring.
  distinguish_by:
  - earned_month
  fields:
    activity_date: expiry date
    points: points expired
    earned_month: month earned
  account: business_points
  direction: out
  triggers: []
- type: business_spend_reset
  target: business_activity
  meaning: Agreement-year spend resets to zero at the agreement anniversary.
  grain: One entry per agreement year.
  distinguish_by:
  - agreement_year_start
  fields:
    activity_date: anniversary date
    spend_usd: spend removed
    agreement_year_start: new agreement year
  account: qualifying_spend
  direction: out
  triggers: []
- type: business_review_open
  target: business_holdings
  mutation:
    transition:
      from: active
      to: under_review
  meaning: The agreement-year review finds spend below the retention level.
  grain: One per review.
  fields:
    review_opened_date: date opened
  triggers: []
- type: business_review_close
  target: business_holdings
  mutation:
    transition:
      from: under_review
      to: active
  meaning: The review closes with the tier kept or lowered.
  grain: One per review.
  fields:
    review_opened_date: cleared to empty
    agreement_end_date: end of the renewed term
  triggers: []
- type: business_tier_change
  target: business_holdings
  mutation: update
  meaning: The agreement tier changes after approval, a review or a qualifying spend increase.
  grain: One row per agreement (the agreement record itself).
  fields:
    variant_name: new tier
  triggers: []
- type: business_invoice_charge
  target: business_invoices
  meaning: A ticket booked under the agreement is billed on invoice.
  grain: One entry per invoiced ticket.
  distinguish_by:
  - invoice_number
  - source_ticket_id
  fields:
    invoice_number: invoice
    entry_date: invoice date
    due_date: due date
    amount: ticket total billed
    source_ticket_id: ticket billed
  account: invoice_balance
  direction: in
  triggers: []
- type: business_invoice_payment
  target: business_invoices
  meaning: The company pays an invoice in whole or in part.
  grain: One entry per payment received.
  distinguish_by:
  - invoice_number
  - payment_reference
  fields:
    invoice_number: invoice paid
    entry_date: payment date
    amount: amount paid
    payment_reference: remittance reference
  account: invoice_balance
  direction: out
  triggers: []
- type: business_late_fee
  target: business_invoices
  meaning: A late fee is charged on an overdue invoice.
  grain: One entry per overdue invoice.
  distinguish_by:
  - invoice_number
  fields:
    invoice_number: overdue invoice
    entry_date: date charged
    due_date: due date of the overdue invoice
    amount: late fee
  account: invoice_balance
  direction: in
  triggers: []
- type: business_suspend
  target: business_holdings
  mutation:
    transition:
      from: active
      to: suspended
  meaning: The agreement is suspended for overdue invoices.
  grain: One per suspension.
  fields:
    suspended_date: date suspended
  triggers: []
- type: business_reinstate
  target: business_holdings
  mutation:
    transition:
      from: suspended
      to: active
  meaning: The suspended agreement resumes after the overdue balance is paid.
  grain: One per reinstatement.
  fields:
    suspended_date: cleared to empty
  triggers: []
- type: business_terminate
  target: business_holdings
  mutation:
    transition:
    - from: active
      to: terminated
    - from: under_review
      to: terminated
    - from: suspended
      to: terminated
  meaning: The agreement ends.
  grain: One per agreement.
  fields:
    closed_date: date terminated
  triggers: []
measures:
- id: business_msr_active_roster
  window: Roster history up to the handling date.
  measure: Count of distinct traveler_customer_id with a business_traveler_add entry not followed by a later business_traveler_remove
    entry for the same traveler on the agreement, optionally restricted to one traveler_role.
- id: business_msr_status_awards_this_year
  window: Current agreement year, from the latest anniversary of approved_date to the handling date.
  measure: Count of business_points_redemption entries with redemption_type status_award dated inside the window.
- id: business_msr_expired_points_due
  window: Earning months whose validity ended on or before the handling date.
  measure: Points earned in each such month (accruals and bonuses by activity month) less the redemptions allocated
    to them oldest-first and less expiries already posted for that month.
- id: business_msr_days_overdue
  window: Open invoices of the agreement at the handling date.
  measure: Calendar days between the earliest due_date among invoices whose charges and late fees exceed their payments
    and the handling date; 0 when no invoice is past due.
policies:
- id: business_agg_multi_holding
  subject:
  - business_enroll
  rule: A company may hold only one Crestline corporate travel agreement; a new application is not accepted from
    a business profile that already has an agreement in applied, active, under_review or suspended status. A company
    whose agreement was terminated or declined may apply again as a new agreement starting from a zero point balance.
  eligibility:
  - id: one_agreement
    applies_to:
    - business_enroll
    kind: dedup
    condition: a new application is not accepted from a business profile that already has an agreement in applied,
      active, under_review or suspended status
    evidence_fields:
    - business_holdings.customer_id
    - business_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - business_holdings.customer_id
      action_bindings:
        business_holdings.customer_id: customer_id
    dedup_contract:
      table: business_holdings
      mode: separate_record
      object_bindings:
        customer_id: customer_id
      duplicate_filters:
        status:
        - applied
        - active
        - under_review
        - suspended
      distinct_fields: []
  params:
    max_per_customer: 1
- id: business_agg_traveler_rosters
  subject:
  - business_traveler_add
  - business_traveler_remove
  rule: 'Rosters of different agreements are evaluated together: a traveler may be on the active roster of only
    one corporate agreement at a time, counted across every agreement by business_msr_active_roster. A traveler
    already on another company''s active roster must be removed there by that company before being added here. The
    agreement''s active roster may not exceed roster_cap_travelers, and the travel_arranger entries may not exceed
    max_travel_arrangers. A roster traveler must have an individual customer profile. A roster change is made only
    while the agreement is active or under_review. A removal takes effect for bookings made after roster_date; tickets
    already booked under the agreement keep their corporate benefits.'
  eligibility:
  - id: roster_agreement_open
    applies_to:
    - business_traveler_add
    - business_traveler_remove
    kind: state
    condition: A roster change is made only while the agreement is active or under_review.
    evidence_fields:
    - business_holdings.business_account_id
    - business_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - business_holdings.business_account_id
      action_bindings:
        business_holdings.business_account_id: business_account_id
    state_contract:
      field: business_holdings.status
      allowed:
      - active
      - under_review
  - id: traveler_individual
    applies_to:
    - business_traveler_add
    kind: state
    condition: A roster traveler must have an individual customer profile.
    evidence_fields:
    - customers.customer_id
    - customers.customer_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - customers.customer_id
      action_bindings:
        customers.customer_id: traveler_customer_id
    state_contract:
      field: customers.customer_type
      allowed:
      - individual
  params:
    per_tier:
      Crestline Business Connect:
        roster_cap_travelers: =roster_cap_travelers
        max_travel_arrangers: =max_travel_arrangers
      Crestline Business Connect Plus:
        roster_cap_travelers: =roster_cap_travelers
        max_travel_arrangers: =max_travel_arrangers
      Crestline Corporate Select:
        roster_cap_travelers: =roster_cap_travelers
        max_travel_arrangers: =max_travel_arrangers
      Crestline Corporate Preferred:
        roster_cap_travelers: =roster_cap_travelers
        max_travel_arrangers: =max_travel_arrangers
      Crestline Corporate Premier:
        roster_cap_travelers: =roster_cap_travelers
        max_travel_arrangers: =max_travel_arrangers
      Crestline Corporate Strategic:
        roster_cap_travelers: =roster_cap_travelers
        max_travel_arrangers: =max_travel_arrangers
  measures:
  - business_msr_active_roster
- id: business_enrollment
  subject:
  - business_enroll
  - business_approve
  - business_decline
  - business_tier_change
  rule: 'A corporate travel agreement is available only to a customer profile whose customer_type is business. The
    tier applied for must meet its entry_gate: the company''s documented annual Crestline spend reaches annual_spend_threshold_usd,
    and at approval the active roster counted by business_msr_active_roster reaches min_enrolled_travelers; Corporate
    tiers also require a negotiated contract signed by the company, which only a human representative can arrange.
    An application meeting the Crestline Business Connect or Crestline Business Connect Plus entry conditions is
    approved on the approved_date with an agreement_end_date agreement_term_months calendar months later; one that
    meets no tier is declined. When the spend in the current agreement year reaches the threshold of a higher tier,
    the agreement moves up to that tier from the next day; moves to a Corporate tier additionally require the negotiated
    contract. The approval date sets the agreement year, which runs from each anniversary of approved_date.'
  eligibility:
  - id: business_profile_only
    applies_to:
    - business_enroll
    kind: state
    condition: A corporate travel agreement is available only to a customer profile whose customer_type is business.
    evidence_fields:
    - customers.customer_id
    - customers.customer_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - customers.customer_id
      action_bindings:
        customers.customer_id: customer_id
    state_contract:
      field: customers.customer_type
      allowed:
      - business
  params:
    per_tier:
      Crestline Business Connect:
        annual_spend_threshold_usd: =annual_spend_threshold_usd
        min_enrolled_travelers: =min_enrolled_travelers
        agreement_term_months: =agreement_term_months
      Crestline Business Connect Plus:
        annual_spend_threshold_usd: =annual_spend_threshold_usd
        min_enrolled_travelers: =min_enrolled_travelers
        agreement_term_months: =agreement_term_months
      Crestline Corporate Select:
        annual_spend_threshold_usd: =annual_spend_threshold_usd
        min_enrolled_travelers: =min_enrolled_travelers
        agreement_term_months: =agreement_term_months
      Crestline Corporate Preferred:
        annual_spend_threshold_usd: =annual_spend_threshold_usd
        min_enrolled_travelers: =min_enrolled_travelers
        agreement_term_months: =agreement_term_months
      Crestline Corporate Premier:
        annual_spend_threshold_usd: =annual_spend_threshold_usd
        min_enrolled_travelers: =min_enrolled_travelers
        agreement_term_months: =agreement_term_months
      Crestline Corporate Strategic:
        annual_spend_threshold_usd: =annual_spend_threshold_usd
        min_enrolled_travelers: =min_enrolled_travelers
        agreement_term_months: =agreement_term_months
  measures:
  - business_msr_active_roster
- id: business_points_earning
  subject:
  - business_points_accrual
  - business_spend_post
  - business_bonus_points
  rule: A flown Crestline segment earns business points when its ticket carries the agreement as corporate_account_id,
    carried the tour_code at booking when tour_code_required is true, and the passenger was on the active roster
    on the flight date; partner-operated flights earn nothing when points_on_partner_flights is false. Points are
    the segment's eligible spend times points_per_dollar of the tier held on the flight date, rounded down to the
    whole point, where eligible spend is the base fare share of the segment after the negotiated discount and excluding
    taxes. The same spend is added to the agreement year's qualifying spend. The traveler also earns personal Summit
    miles on the same flight when traveler_earns_summit_miles is true. Points accrue only while the agreement is
    active or under_review; segments flown while the agreement is suspended earn nothing and are never credited
    later. A segment already credited is never credited again. Points for an eligible ticket booked without the
    agreement may be claimed within retroactive_points_window_days calendar days after the flight date. The enrollment
    bonus of enrollment_bonus_points is credited once when the agreement's flown spend since approval first reaches
    enrollment_bonus_min_flown_spend_usd, and the milestone bonus of spend_milestone_bonus_points is credited once
    per agreement year when the agreement year's spend first reaches spend_milestone_usd of the tier then held.
  eligibility:
  - id: accrual_agreement_open
    applies_to:
    - business_points_accrual
    - business_spend_post
    - business_bonus_points
    kind: state
    condition: Points accrue only while the agreement is active or under_review
    evidence_fields:
    - business_holdings.business_account_id
    - business_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - business_holdings.business_account_id
      action_bindings:
        business_holdings.business_account_id: business_account_id
    state_contract:
      field: business_holdings.status
      allowed:
      - active
      - under_review
  - id: segment_once
    applies_to:
    - business_points_accrual
    kind: dedup
    condition: A segment already credited is never credited again.
    evidence_fields:
    - business_activity.source_ticket_id
    - business_activity.segment_number
    - business_activity.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - business_activity.source_ticket_id
        - business_activity.segment_number
      action_bindings:
        business_activity.source_ticket_id: source_ticket_id
        business_activity.segment_number: segment_number
    dedup_contract:
      table: business_activity
      mode: separate_record
      object_bindings:
        source_ticket_id: source_ticket_id
        segment_number: segment_number
      duplicate_filters:
        event_type:
        - business_points_accrual
      distinct_fields: []
  - id: retro_points_window
    applies_to:
    - business_points_accrual
    kind: time
    condition: Points for an eligible ticket booked without the agreement may be claimed within retroactive_points_window_days
      calendar days after the flight date.
    evidence_fields:
    - ticket_transactions.ticket_id
    - ticket_transactions.segment_number
    - ticket_transactions.flight_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - ticket_transactions.ticket_id
        - ticket_transactions.segment_number
      action_bindings:
        ticket_transactions.ticket_id: source_ticket_id
        ticket_transactions.segment_number: segment_number
    temporal_basis:
      clock: frozen_time
      anchor_event: the flight date
      anchor_source: ticket_transactions.flight_date
      relation: not_after
      duration_source: variants.retroactive_points_window_days
      unit: calendar_days
      counting_rule: within retroactive_points_window_days calendar days after the flight date
      boundary: inclusive
  params:
    per_tier:
      Crestline Business Connect:
        points_per_dollar: =points_per_dollar
        traveler_earns_summit_miles: =traveler_earns_summit_miles
        points_on_partner_flights: =points_on_partner_flights
        retroactive_points_window_days: =retroactive_points_window_days
        enrollment_bonus_points: =enrollment_bonus_points
        enrollment_bonus_min_flown_spend_usd: =enrollment_bonus_min_flown_spend_usd
        spend_milestone_usd: =spend_milestone_usd
        spend_milestone_bonus_points: =spend_milestone_bonus_points
        tour_code_required: =tour_code_required
      Crestline Business Connect Plus:
        points_per_dollar: =points_per_dollar
        traveler_earns_summit_miles: =traveler_earns_summit_miles
        points_on_partner_flights: =points_on_partner_flights
        retroactive_points_window_days: =retroactive_points_window_days
        enrollment_bonus_points: =enrollment_bonus_points
        enrollment_bonus_min_flown_spend_usd: =enrollment_bonus_min_flown_spend_usd
        spend_milestone_usd: =spend_milestone_usd
        spend_milestone_bonus_points: =spend_milestone_bonus_points
        tour_code_required: =tour_code_required
      Crestline Corporate Select:
        points_per_dollar: =points_per_dollar
        traveler_earns_summit_miles: =traveler_earns_summit_miles
        points_on_partner_flights: =points_on_partner_flights
        retroactive_points_window_days: =retroactive_points_window_days
        enrollment_bonus_points: =enrollment_bonus_points
        enrollment_bonus_min_flown_spend_usd: =enrollment_bonus_min_flown_spend_usd
        spend_milestone_usd: =spend_milestone_usd
        spend_milestone_bonus_points: =spend_milestone_bonus_points
        tour_code_required: =tour_code_required
      Crestline Corporate Preferred:
        points_per_dollar: =points_per_dollar
        traveler_earns_summit_miles: =traveler_earns_summit_miles
        points_on_partner_flights: =points_on_partner_flights
        retroactive_points_window_days: =retroactive_points_window_days
        enrollment_bonus_points: =enrollment_bonus_points
        enrollment_bonus_min_flown_spend_usd: =enrollment_bonus_min_flown_spend_usd
        spend_milestone_usd: =spend_milestone_usd
        spend_milestone_bonus_points: =spend_milestone_bonus_points
        tour_code_required: =tour_code_required
      Crestline Corporate Premier:
        points_per_dollar: =points_per_dollar
        traveler_earns_summit_miles: =traveler_earns_summit_miles
        points_on_partner_flights: =points_on_partner_flights
        retroactive_points_window_days: =retroactive_points_window_days
        enrollment_bonus_points: =enrollment_bonus_points
        enrollment_bonus_min_flown_spend_usd: =enrollment_bonus_min_flown_spend_usd
        spend_milestone_usd: =spend_milestone_usd
        spend_milestone_bonus_points: =spend_milestone_bonus_points
        tour_code_required: =tour_code_required
      Crestline Corporate Strategic:
        points_per_dollar: =points_per_dollar
        traveler_earns_summit_miles: =traveler_earns_summit_miles
        points_on_partner_flights: =points_on_partner_flights
        retroactive_points_window_days: =retroactive_points_window_days
        enrollment_bonus_points: =enrollment_bonus_points
        enrollment_bonus_min_flown_spend_usd: =enrollment_bonus_min_flown_spend_usd
        spend_milestone_usd: =spend_milestone_usd
        spend_milestone_bonus_points: =spend_milestone_bonus_points
        tour_code_required: =tour_code_required
  formula:
    points: round(spend_usd * points_per_dollar - 0.5)
- id: business_points_redemptions
  subject:
  - business_points_redemption
  rule: Points belong to the company and are redeemed only at the request of the travel manager or a travel_arranger
    on the roster, for a beneficiary who is on the active roster on the redemption date. Points are redeemed only
    while the agreement is active, or within post_termination_redemption_days calendar days after termination. Award
    tickets cost award_points_domestic_main_round_trip, award_points_domestic_first_round_trip, award_points_short_haul_main_round_trip,
    award_points_long_haul_main_round_trip or award_points_long_haul_premium_round_trip; upgrades cost upgrade_points_short_segment
    or upgrade_points_long_segment per segment by the ticket charter's segment_length_threshold_miles; and when
    status_awards_available is true a roster traveler may receive Summit Silver for status_award_points_summit_silver
    or Summit Gold for status_award_points_summit_gold, lasting status_award_validity_months calendar months, never
    lowering a higher tier the traveler already holds. Status awards in one agreement year, counted by business_msr_status_awards_this_year,
    may not exceed max_status_awards_per_agreement_year. The point_balance must cover the whole award; points are
    never combined with a traveler's Summit miles, never converted to cash and never transferred to another agreement.
    Award tickets from points follow the fare rules of Crestline Main Cabin, Crestline Premium Economy or Crestline
    First as issued and earn no points or miles.
  eligibility:
  - id: redeem_agreement_active
    applies_to:
    - business_points_redemption
    kind: state
    condition: Points are redeemed only while the agreement is active, or within post_termination_redemption_days
      calendar days after termination.
    evidence_fields:
    - business_holdings.business_account_id
    - business_holdings.status
    - business_holdings.closed_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - business_holdings.business_account_id
      action_bindings:
        business_holdings.business_account_id: business_account_id
    state_contract:
      field: business_holdings.status
      allowed:
      - active
      - terminated
  params:
    per_tier:
      Crestline Business Connect:
        award_points_domestic_main_round_trip: =award_points_domestic_main_round_trip
        award_points_domestic_first_round_trip: =award_points_domestic_first_round_trip
        award_points_short_haul_main_round_trip: =award_points_short_haul_main_round_trip
        award_points_long_haul_main_round_trip: =award_points_long_haul_main_round_trip
        award_points_long_haul_premium_round_trip: =award_points_long_haul_premium_round_trip
        upgrade_points_short_segment: =upgrade_points_short_segment
        upgrade_points_long_segment: =upgrade_points_long_segment
        status_awards_available: =status_awards_available
        status_award_points_summit_silver: =status_award_points_summit_silver
        status_award_points_summit_gold: =status_award_points_summit_gold
        status_award_validity_months: =status_award_validity_months
        max_status_awards_per_agreement_year: =max_status_awards_per_agreement_year
        post_termination_redemption_days: =post_termination_redemption_days
      Crestline Business Connect Plus:
        award_points_domestic_main_round_trip: =award_points_domestic_main_round_trip
        award_points_domestic_first_round_trip: =award_points_domestic_first_round_trip
        award_points_short_haul_main_round_trip: =award_points_short_haul_main_round_trip
        award_points_long_haul_main_round_trip: =award_points_long_haul_main_round_trip
        award_points_long_haul_premium_round_trip: =award_points_long_haul_premium_round_trip
        upgrade_points_short_segment: =upgrade_points_short_segment
        upgrade_points_long_segment: =upgrade_points_long_segment
        status_awards_available: =status_awards_available
        status_award_points_summit_silver: =status_award_points_summit_silver
        status_award_points_summit_gold: =status_award_points_summit_gold
        status_award_validity_months: =status_award_validity_months
        max_status_awards_per_agreement_year: =max_status_awards_per_agreement_year
        post_termination_redemption_days: =post_termination_redemption_days
      Crestline Corporate Select:
        award_points_domestic_main_round_trip: =award_points_domestic_main_round_trip
        award_points_domestic_first_round_trip: =award_points_domestic_first_round_trip
        award_points_short_haul_main_round_trip: =award_points_short_haul_main_round_trip
        award_points_long_haul_main_round_trip: =award_points_long_haul_main_round_trip
        award_points_long_haul_premium_round_trip: =award_points_long_haul_premium_round_trip
        upgrade_points_short_segment: =upgrade_points_short_segment
        upgrade_points_long_segment: =upgrade_points_long_segment
        status_awards_available: =status_awards_available
        status_award_points_summit_silver: =status_award_points_summit_silver
        status_award_points_summit_gold: =status_award_points_summit_gold
