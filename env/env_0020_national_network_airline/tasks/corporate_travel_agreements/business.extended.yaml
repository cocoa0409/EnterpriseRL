category: business
display_name: Crestline Corporate Travel Agreements
binding:
  holding_table: business_holdings
  event_tables:
  - business_activity
  - business_roster
  - business_invoices
  status_field: status
  variant_field: variant_name
  quantity_fields:
    point_balance: business_points
    spend_this_agreement_year: qualifying_spend
    invoice_balance: invoice_balance
lifecycle:
  states:
  - applied
  - active
  - under_review
  - suspended
  - terminated
  - declined
  transitions:
  - from: applied
    to: active
    by: agent
    means: The application is approved and the agreement starts.
  - from: applied
    to: declined
    by: agent
    means: The application does not meet the entry conditions of any tier.
  - from: active
    to: under_review
    by: system
    means: The agreement-year review finds spend below the retention level of the tier.
  - from: under_review
    to: active
    by: agent
    means: The review closes with the tier kept or lowered.
  - from: under_review
    to: terminated
    by: agent
    means: The review closes without renewal because spend fell below every tier's retention level.
  - from: active
    to: suspended
    by: agent
    means: Invoiced billing is overdue beyond the tier's suspension point.
  - from: suspended
    to: active
    by: agent
    means: The overdue balance is paid and the agreement resumes.
  - from: suspended
    to: terminated
    by: agent
    means: The overdue balance stayed unpaid beyond the tier's termination point.
  - from: active
    to: terminated
    by: user
    means: The company gives notice and terminates the agreement.
accounts:
- key: business_points
  unit: points
  meaning: Company-owned Crestline Business points; accruals and bonuses add, redemptions and expiries deduct.
- key: qualifying_spend
  unit: USD
  meaning: Eligible flown spend in the current agreement year, used for tier review and milestones; flown spend
    posts add, the agreement-year reset deducts.
- key: invoice_balance
  unit: USD
  meaning: Amount the company owes Crestline on invoiced tickets; invoice charges and late fees add, payments deduct.
parameter_schema:
  annual_spend_threshold_usd: Eligible Crestline spend per agreement year required to hold the tier (USD)
  retention_spend_percent_of_threshold: Share of the tier's threshold that keeps the tier at the agreement-year
    review (integer, percent)
  max_tier_drop_per_review: Most tiers an agreement falls at one review (integer, tiers)
  min_enrolled_travelers: Travelers on the roster required at approval (integer, travelers)
  roster_cap_travelers: Most travelers on the roster at one time (integer, travelers)
  max_travel_arrangers: Most roster entries with the travel_arranger role (integer, persons)
  agreement_term_months: Calendar months of one agreement term from approval (integer, months)
  termination_notice_days: Calendar days of notice the company must give to terminate before the term ends (integer,
    calendar days)
  review_period_days: Calendar days from the opening of a review to its decision (integer, calendar days)
  fare_discount_percent_domestic: Negotiated discount on the base fare of eligible domestic and short-haul international
    tickets (integer, percent)
  fare_discount_percent_international: Negotiated discount on the base fare of eligible long-haul international
    tickets (integer, percent)
  discount_eligible_fare_brands: Fare brands the negotiated discount applies to (list of official fare brand names)
  discount_applies_to_taxes: Whether the negotiated discount reduces government taxes and fees (boolean)
  booking_channels_eligible: Booking channels through which a ticket is booked under the agreement (list of booking_channel
    values)
  change_fee_waiver: Whether change fees and same-day change fees are waived on tickets booked under the agreement
    (boolean)
  ticket_name_change_between_travelers: Whether an unflown ticket booked under the agreement may be reassigned to
    another traveler on the active roster (boolean)
  corporate_free_checked_bags: Checked bags included per direction on tickets booked under the agreement (integer,
    bags)
  credit_pooling_across_travelers: Whether a credit from a ticket booked under the agreement may pay for another
    roster traveler's ticket under the same agreement (boolean)
  points_per_dollar: Business points per US dollar of eligible flown spend (number, points per USD)
  traveler_earns_summit_miles: Whether the traveler also earns personal Summit miles on the same flight (boolean)
  points_on_partner_flights: Whether partner-operated flights earn business points (boolean)
  retroactive_points_window_days: Calendar days after the flight within which points for an eligible ticket missing
    the agreement may be claimed (integer, calendar days)
  points_expiry_months: Calendar months after the month of earning at whose end unredeemed points expire (integer,
    months)
  enrollment_bonus_points: One-time points once the agreement's first enrollment_bonus_min_flown_spend_usd of flown
    spend posts (integer, points)
  enrollment_bonus_min_flown_spend_usd: Flown spend after approval that releases the enrollment bonus (USD)
  spend_milestone_usd: Agreement-year spend at which the milestone bonus is earned (USD)
  spend_milestone_bonus_points: Points for reaching spend_milestone_usd in an agreement year (integer, points)
  award_points_domestic_main_round_trip: Points for a domestic Main Cabin round-trip award (integer, points)
  award_points_domestic_first_round_trip: Points for a domestic First round-trip award (integer, points)
  award_points_short_haul_main_round_trip: Points for a short-haul international Main Cabin round-trip award (integer,
    points)
  award_points_long_haul_main_round_trip: Points for a long-haul international Main Cabin round-trip award (integer,
    points)
  award_points_long_haul_premium_round_trip: Points for a long-haul international Premium Economy round-trip award
    (integer, points)
  upgrade_points_short_segment: Points per segment for a confirmed upgrade on segments up to the ticket charter's
    segment_length_threshold_miles (integer, points)
  upgrade_points_long_segment: Points per segment for a confirmed upgrade on longer segments (integer, points)
  status_awards_available: Whether points may buy a Summit tier for a roster traveler (boolean)
  status_award_points_summit_silver: Points for a Summit Silver status award (integer, points)
  status_award_points_summit_gold: Points for a Summit Gold status award (integer, points)
  status_award_validity_months: Calendar months a status award tier lasts from the award date (integer, months)
  max_status_awards_per_agreement_year: Most status awards redeemed in one agreement year (integer, awards)
  post_termination_redemption_days: Calendar days after termination during which remaining points may still be redeemed
    (integer, calendar days)
  invoice_billing_permitted: Whether tickets may be billed to the company on invoice instead of a card (boolean)
  invoice_payment_terms_days: Calendar days from invoice date to due date (integer, calendar days)
  credit_limit_usd: Largest open invoice balance allowed; a ticket that would exceed it cannot be invoiced (USD)
  overdue_suspension_days: Calendar days past an invoice's due date after which the agreement is suspended (integer,
    calendar days)
  suspension_termination_days: Calendar days in suspension after which the agreement is terminated if still unpaid
    (integer, calendar days)
  late_payment_fee_percent: Late fee per overdue invoice, as a percent of its unpaid amount, charged once when it
    becomes overdue (number, percent)
  late_payment_fee_min_usd: Smallest late fee per overdue invoice (USD)
  tour_code_required: Whether the agreement's tour_code must be on the booking for the ticket to count under the
    agreement (boolean)
