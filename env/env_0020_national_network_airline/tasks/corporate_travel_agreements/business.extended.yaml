    result: The points redeemed for the Summit Gold status award are the Gold award price so charged.
  factors:
  - id: payment_record_percent
    effect: parameter
    decides: record_percent
    bindings:
    - late_fees_for_gold
    - record_percent
    ladder:
    - when: at least the repeat-record count of late fees charged on the agreement in the Gold record window
      value: K('repeat_record_percent')
    - when: exactly the single-record count of late fees in that window
      value: K('single_record_percent')
    - when: otherwise (no late fee in that window)
      value: K('full_price_percent')
    baseline:
      record_percent: K('full_price_percent')
    evidence:
    - history
    cross_difficulty: null
  - id: network_percent
    effect: parameter
    decides: network_percent
    bindings:
    - gold_invoiced_fares
    - gold_flown_coupons
    - network_percent
    ladder:
    - when: fares collected on invoice in the Gold network window reach the high-network fares and flown coupons
        in that window reach the high-network coupons
      value: K('high_network_percent')
    - when: those fares reach the middle-network fares and those coupons reach the middle-network coupons, without
        both high-network conditions being met
      value: K('middle_network_percent')
    - when: otherwise
      value: K('full_price_percent')
    baseline:
      network_percent: K('full_price_percent')
    evidence:
    - cross_category
    - history
    cross_difficulty: ticket
  - id: repeat_award_percent
    effect: parameter
    decides: repeat_award_percent
    bindings:
    - status_awards_for_gold
    - repeat_award_percent
    ladder:
    - when: at least the repeat-award count of status awards redeemed on the agreement in the Gold award window
      value: K('repeat_award_percent')
    - when: exactly the single-award count of status awards in that window
      value: K('single_award_percent')
    - when: otherwise (no status award in that window)
      value: K('full_price_percent')
    baseline:
      repeat_award_percent: K('full_price_percent')
    evidence:
    - history
    cross_difficulty: null
  - id: earning_percent
    effect: parameter
    decides: earning_percent
    bindings:
    - accrued_for_gold
    - bonus_for_gold
    - points_earned_for_gold
    - earning_percent
    ladder:
    - when: points accrued and bonus points posted in the Gold earning window at or above the high earning points
      value: K('high_earning_percent')
    - when: those points at or above the middle earning points but below the high earning points
      value: K('middle_earning_percent')
    - when: otherwise (below the middle earning points)
      value: K('full_price_percent')
    baseline:
      earning_percent: K('full_price_percent')
    evidence:
    - history
    cross_difficulty: null
  - id: gold_tenure_allowance
    effect: parameter
    decides: gold_tenure_allowance
    bindings:
    - gold_tenure_months
    - gold_tenure_allowance
    ladder:
    - when: agreement approved at least the long Gold-tenure months before the redemption date
      value: K('long_gold_tenure_allowance')
    - when: approved at least the middle Gold-tenure months but fewer than the long ones before the redemption date
      value: K('middle_gold_tenure_allowance')
    - when: otherwise (a younger agreement)
      value: '0'
    baseline:
      gold_tenure_allowance: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: remaining_term_charge
    effect: method
    decides: gold_price_charged
    bindings:
    - remaining_term_months
    - gold_price_charged
    ladder:
    - when: fewer than the short-term months remain to the agreement's term end date
      method: the short-term share of the net Gold award price, rounded up to the next whole price step
    - when: at least the short-term months but fewer than the tier's status-award validity months remain
      method: the net Gold award price times the remaining months divided by the validity months, rounded up to
        the next whole price step
    - when: otherwise (the validity months or more remain)
      method: the net Gold award price charged in full
    baseline:
      gold_price_charged: gold_price_net
    evidence:
    - date
    cross_difficulty: null
  baseline:
