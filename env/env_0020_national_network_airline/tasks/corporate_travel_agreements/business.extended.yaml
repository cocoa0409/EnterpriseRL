    - table: business_activity
      aggregate: sum
      field: spend_usd
      within_months: 12
      filters:
        event_type: business_spend_post
    cross_category:
    - ticket
- id: business_ext_gold_status_award_price
  base_policy_refs:
  - business_points_redemptions
  overwrite:
  - base_policy: business_points_redemptions
    superseded_clause: Summit Gold for status_award_points_summit_gold
    replaced_by: The points redeemed for the Summit Gold status award are the Gold award price so charged.
  trigger: on_request
  subject:
  - business_points_redemption
  computes: points
  target_tool: redeem_gold_status_award_92a33401
  params:
    gold_record_window_months: 12
    repeat_record_count: 2
    single_record_count: 1
    repeat_record_percent: 125
    single_record_percent: 110
    full_price_percent: 100
    gold_network_window_months: 12
    high_network_fares_usd: 90000
    high_network_coupons: 24
    middle_network_fares_usd: 45000
    middle_network_coupons: 12
    high_network_percent: 85
    middle_network_percent: 92
    gold_award_window_months: 12
    repeat_award_count: 2
    single_award_count: 1
    repeat_award_percent: 130
    single_award_percent: 115
    gold_earning_window_months: 12
    high_earning_points: 200000
    middle_earning_points: 100000
    high_earning_percent: 94
    middle_earning_percent: 97
    long_gold_tenure_months: 36
    middle_gold_tenure_months: 24
    long_gold_tenure_allowance: 300
    middle_gold_tenure_allowance: 150
    short_term_months: 6
    short_term_share_percent: 50
    price_step_points: 100
  rule: 'A Summit Gold status award is redeemed from company points at the request of the travel manager or a travel
    arranger on the roster, for a traveler on the active roster on the redemption date, and it is booked as one
    redemption entry naming that traveler. The standard Gold award price is the tier''s Summit Gold status-award
    points, and the standard Gold award price is charged in full. A Summit Gold status award is priced only after
    every invoice of the agreement that stands unpaid past its due date carries a late fee entry. A Summit Gold
    status award is not priced until every flown segment of a ticket booked under the agreement and paid by card
    carries its points entry. The agreement''s payment record sets the Gold record percentage from the late fees
    charged on the agreement in the Gold record window up to and including the redemption date: at least the repeat-record
    count of late fees sets the repeat-record percentage, exactly the single-record count sets the single-record
    percentage, and no late fee sets the full-price percentage. The company''s Gold network measures are the fares
    collected on invoice on the company''s tickets, by collection date, and the flown coupons on the company''s
    tickets, by flight date, both in the Gold network window up to and including the redemption date. The Gold network
    percentage is the high-network percentage when those invoiced fares reach the high-network fares and those flown
    coupons reach the high-network coupons together; it is the middle-network percentage when the fares reach the
    middle-network fares and the coupons reach the middle-network coupons together without both high-network conditions
    being met; and it is the full-price percentage in every other case. Status awards already redeemed on the agreement
    in the Gold award window up to and including the redemption date set the Gold repeat-award percentage: at least
    the repeat-award count sets the repeat-award percentage, exactly the single-award count sets the single-award
    percentage, and none sets the full-price percentage. The points the agreement earned for Gold pricing are the
    points of every points accrual entry and every bonus entry posted to the agreement in the Gold earning window
    up to and including the redemption date. Those earned points set the Gold earning percentage: at or above the
    high earning points it is the high-earning percentage, at or above the middle earning points but below the high
    earning points it is the middle-earning percentage, and below the middle earning points it is the full-price
    percentage. The adjusted Gold award price is the standard Gold award price multiplied by the Gold record percentage,
    the Gold network percentage, the Gold repeat-award percentage and the Gold earning percentage, each divided
    by one hundred, all four applied together to the standard price and rounded to the nearest whole point once.
    The Gold tenure allowance is taken off the adjusted Gold award price: an agreement approved at least the long
    Gold-tenure months before the redemption date takes off the long Gold-tenure allowance, one approved at least
    the middle Gold-tenure months but fewer than the long ones takes off the middle Gold-tenure allowance, and a
    younger agreement takes off nothing. The remaining term is the number of whole calendar months from the redemption
    date to the agreement''s current term end date. The remaining term decides how the net Gold award price is charged:
    with fewer than the short-term months remaining the price is the short-term share of the net price rounded up
    to the next whole price step, with at least the short-term months but fewer than the tier''s status-award validity
    months remaining the price is the net price times the remaining months divided by the validity months rounded
    up to the next whole price step, and with the validity months or more remaining the net price is charged in
    full. The points redeemed for the Summit Gold status award are the Gold award price so charged.'
  prerequisite:
  - problem: business_ext_overdue_invoice_late_fee
    kind: value_input
    gate: late_fees_for_gold
    form: state
    policy_source: A Summit Gold status award is priced only after every invoice of the agreement that stands unpaid
      past its due date carries a late fee entry.
    condition: Every invoice number of the agreement whose charge plus late fees exceeds its payments after its
      due date carries a business_late_fee entry in business_invoices.
    resolved_by: assess_invoice_late_fee_9e8e2547
    effect: Once the late fee is booked, the late fees counted in the Gold record window rise by one and the Gold
      record percentage moves to the next tier of its ladder.
  - problem: business_ext_card_paid_ticket_points
    kind: value_input
    gate: points_earned_for_gold
    form: state
    policy_source: A Summit Gold status award is not priced until every flown segment of a ticket booked under the
      agreement and paid by card carries its points entry.
    condition: Every flown coupon of a ticket whose corporate_account_id is the agreement and whose payment_form
      is credit_card has a business_points_accrual entry on its ticket and segment.
    resolved_by: post_card_ticket_points_2b97bc4a
    effect: Once the card-paid segment's points entry is posted, the points earned in the Gold earning window rise
      by those points, which can move the Gold earning percentage to a lower-priced tier.
  cross_category:
  - category: ticket
    as: history
    reads:
    - ticket_transactions.amount
    - ticket_transactions.event_type
    - ticket_transactions.payment_form
    - ticket_transactions.transaction_date
    - ticket_transactions.flight_date
    note: The Gold network percentage is decided from the fares collected on invoice and the flown coupons on the
      company's tickets.
  compute:
  - late_fees_for_gold: COUNT('business_invoices', within_months=K('gold_record_window_months'), date_field='entry_date',
      event_type='business_late_fee')
  - record_percent: K('repeat_record_percent') if late_fees_for_gold >= K('repeat_record_count') else (K('single_record_percent')
      if late_fees_for_gold == K('single_record_count') else K('full_price_percent'))
  - gold_invoiced_fares: XSUM('ticket','ticket_transactions','amount', within_months=K('gold_network_window_months'),
      date_field='transaction_date', event_type='ticket_fare_collect', payment_form='corporate_invoice')
  - gold_flown_coupons: XCOUNT('ticket','ticket_transactions', within_months=K('gold_network_window_months'), date_field='flight_date',
      event_type='ticket_coupon_flown')
  - network_percent: K('high_network_percent') if (gold_invoiced_fares >= K('high_network_fares_usd') and gold_flown_coupons
      >= K('high_network_coupons')) else (K('middle_network_percent') if (gold_invoiced_fares >= K('middle_network_fares_usd')
      and gold_flown_coupons >= K('middle_network_coupons')) else K('full_price_percent'))
  - status_awards_for_gold: COUNT('business_activity', within_months=K('gold_award_window_months'), date_field='activity_date',
      event_type='business_points_redemption', redemption_type='status_award')
  - repeat_award_percent: K('repeat_award_percent') if status_awards_for_gold >= K('repeat_award_count') else (K('single_award_percent')
      if status_awards_for_gold == K('single_award_count') else K('full_price_percent'))
  - accrued_for_gold: SUM('business_activity','points', within_months=K('gold_earning_window_months'), date_field='activity_date',
      event_type='business_points_accrual')
  - bonus_for_gold: SUM('business_activity','points', within_months=K('gold_earning_window_months'), date_field='activity_date',
      event_type='business_bonus_points')
  - points_earned_for_gold: accrued_for_gold + bonus_for_gold
  - earning_percent: K('high_earning_percent') if points_earned_for_gold >= K('high_earning_points') else (K('middle_earning_percent')
      if points_earned_for_gold >= K('middle_earning_points') else K('full_price_percent'))
  - gold_price_adjusted: int(RND(P('status_award_points_summit_gold') * record_percent / 100 * network_percent /
      100 * repeat_award_percent / 100 * earning_percent / 100, 0))
  - gold_tenure_months: MONTHS(F('approved_date'), NOW)
  - gold_tenure_allowance: K('long_gold_tenure_allowance') if gold_tenure_months >= K('long_gold_tenure_months')
      else (K('middle_gold_tenure_allowance') if gold_tenure_months >= K('middle_gold_tenure_months') else 0)
  - gold_price_net: gold_price_adjusted - gold_tenure_allowance
  - remaining_term_months: MONTHS(NOW, F('agreement_end_date'))
  - gold_price_charged: (-(-(gold_price_net * K('short_term_share_percent') / 100) // K('price_step_points')) *
      K('price_step_points')) if remaining_term_months < K('short_term_months') else ((-(-(gold_price_net * remaining_term_months
      / P('status_award_validity_months')) // K('price_step_points')) * K('price_step_points')) if remaining_term_months
      < P('status_award_validity_months') else gold_price_net)
  - result: int(gold_price_charged)
  compute_basis:
    late_fees_for_gold: 'The agreement''s payment record sets the Gold record percentage from the late fees charged
      on the agreement in the Gold record window up to and including the redemption date: at least the repeat-record
      count of late fees sets the repeat-record percentage, exactly the single-record count sets the single-record
      percentage, and no late fee sets the full-price percentage.'
    record_percent: 'The agreement''s payment record sets the Gold record percentage from the late fees charged
      on the agreement in the Gold record window up to and including the redemption date: at least the repeat-record
      count of late fees sets the repeat-record percentage, exactly the single-record count sets the single-record
      percentage, and no late fee sets the full-price percentage.'
    gold_invoiced_fares: The company's Gold network measures are the fares collected on invoice on the company's
      tickets, by collection date, and the flown coupons on the company's tickets, by flight date, both in the Gold
      network window up to and including the redemption date.
    gold_flown_coupons: The company's Gold network measures are the fares collected on invoice on the company's
      tickets, by collection date, and the flown coupons on the company's tickets, by flight date, both in the Gold
      network window up to and including the redemption date.
    network_percent: The Gold network percentage is the high-network percentage when those invoiced fares reach
      the high-network fares and those flown coupons reach the high-network coupons together; it is the middle-network
      percentage when the fares reach the middle-network fares and the coupons reach the middle-network coupons
