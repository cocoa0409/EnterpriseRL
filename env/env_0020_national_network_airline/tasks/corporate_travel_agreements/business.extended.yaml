      card-paid ticket, which already carries the negotiated discount applied at booking: the whole base fare for
      a one-way ticket and half of it for a round trip.'
    card_segment_spend: 'The card-paid segment''s eligible spend is its equal share of the base fare recorded on
      the card-paid ticket, which already carries the negotiated discount applied at booking: the whole base fare
