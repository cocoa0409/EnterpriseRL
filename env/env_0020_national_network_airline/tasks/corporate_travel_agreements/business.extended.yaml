    - table: business_activity
      aggregate: count
      field: business_activity_id
      filters:
        event_type: business_points_redemption
    - category: ticket
      table: ticket_transactions
      aggregate: sum
      field: amount
      within_months: 12
      filters:
        event_type: ticket_fare_collect
    - category: ticket
