- id: business_ext_retro_claim_points
  base_policy_refs:
  - business_points_earning
  - business_negotiated_benefits
  overwrite:
  - base_policy: business_points_earning
    superseded_clause: Points are the segment's eligible spend times points_per_dollar of the tier held on the flight
      date, rounded down to the whole point
    replaced_by: The points credited for the retroactive claim are the settled claim points.
  trigger: on_request
  subject:
  - business_points_accrual
  computes: points
  target_tool: claim_retro_segment_points_a26ae9c7
  params:
    round_trip_segments: 2
    one_way_segments: 1
    near_milestone_share_percent: 95
    approach_share_percent: 80
    near_milestone_uplift: 10
    approach_uplift: 5
    claim_fare_volume_window_months: 12
    high_claim_fare_volume_usd: 120000
    middle_claim_fare_volume_usd: 60000
    high_fare_volume_uplift: 8
    middle_fare_volume_uplift: 4
    outside_channel_claim_share: 50
    self_service_claim_share: 90
    whole_claim_share: 100
    late_claim_days: 21
    prompt_claim_days: 8
    late_claim_divisor: 2
    prompt_claim_multiplier: 0.75
  rule: 'A retroactive claim credits company points for one flown segment of a ticket the company booked without
    the agreement, when the claim is made within the tier''s retroactive claim window after the flight, and it posts
    the points entry and the matching spend entry on the claim date; a ticket booked through a channel outside the
    tier''s eligible booking channels may still be claimed, at the outside-channel claim share. The claim spend
    starts from the claimed ticket''s base fare shared equally among its segments, which is the whole base fare
    for a one-way ticket and half of it for a round trip. The standard claim spend is that share of the base fare
    as paid, and the standard claim points are the standard claim spend times the tier''s points per dollar, rounded
    down to the whole point. The negotiated discount that booking under the agreement would have applied reduces
    the claim spend: when the claimed ticket''s fare brand is among the tier''s discount-eligible fare brands and
    its route class is long-haul international, the spend is reduced by the tier''s international discount percentage;
    when the brand is eligible and the route class is domestic or short-haul international, it is reduced by the
    tier''s domestic discount percentage; and when the brand is not eligible it is not reduced. The claim spend
    is the shared base fare times one hundred less the discount percentage, divided by one hundred, rounded to the
    cent, and the claim points before uplift are that spend times the tier''s points per dollar, rounded down to
    the whole point. The claim''s milestone approach is the spend posted to the agreement in its current agreement
    year, taken as every spend entry less every reset entry, as a percentage of the tier''s spend milestone. The
    milestone approach adds the approach uplift: at or above the near-milestone share it adds the near-milestone
    uplift, at or above the approach share but below the near-milestone share it adds the approach uplift, and below
    the approach share it adds nothing. The company''s claim fare volume is the total of the fares collected on
    the company''s tickets, by collection date, in the claim fare-volume window up to and including the claim date.
    Claim fare volume adds the fare-volume uplift: at or above the high claim fare volume it adds the high fare-volume
    uplift, at or above the middle claim fare volume but below the high one it adds the middle fare-volume uplift,
    and below the middle claim fare volume it adds nothing. The uplifted claim points are the claim points before
    uplift times one hundred plus the approach uplift and the fare-volume uplift, divided by one hundred, rounded
    down to the whole point. The claimed ticket''s booking channel sets the claim share: a ticket booked through
    a channel outside the tier''s eligible booking channels keeps the outside-channel claim share, a ticket booked
    through the Crestline app or the Crestline website when that channel is eligible keeps the self-service claim
    share, and a ticket booked through any other eligible channel keeps the whole claim. The shared claim points
    are the uplifted claim points times the claim share divided by one hundred, rounded down to the whole point.
    The claim lag is the number of calendar days from the date the claimed ticket closed as flown to the claim date.
    The claim lag decides how the shared claim points are settled: with a lag of at least the late-claim days they
    are divided by the late-claim divisor and rounded down to the whole point, with a lag of at least the prompt-claim
    days but below the late-claim days they are multiplied by the prompt-claim multiplier and rounded up to the
    whole point, and with a shorter lag they are credited as they stand. The points credited for the retroactive
    claim are the settled claim points.'
  prerequisite: []
  cross_category:
  - category: ticket
    as: branch
    reads:
    - base_fare
    - trip_type
    - variant_name
    - route_type
    - booking_channel
    - closed_date
    - corporate_account_id
    - ticket_transactions.amount
    - ticket_transactions.event_type
    - ticket_transactions.transaction_date
    note: The claimed ticket's fare, trip type, brand, route class, channel and flown date, and the company's collected
      fares, are read from the ticket records and fare ledger.
  compute:
  - claim_ticket_fare: CFIELD('ticket','base_fare', corporate_account_id=None)
  - claim_ticket_trip: CFIELD('ticket','trip_type', corporate_account_id=None)
  - claim_shared_fare: RND(claim_ticket_fare / (K('round_trip_segments') if claim_ticket_trip == 'round_trip' else
      K('one_way_segments')), 2)
  - claim_brand_eligible: CFIELD('ticket','variant_name', corporate_account_id=None) in P('discount_eligible_fare_brands')
  - claim_route: CFIELD('ticket','route_type', corporate_account_id=None)
  - claim_discount_percent: P('fare_discount_percent_international') if (claim_brand_eligible and claim_route ==
      'long_haul_international') else (P('fare_discount_percent_domestic') if (claim_brand_eligible and claim_route
      != 'long_haul_international') else 0)
  - claim_spend: RND(claim_shared_fare * (100 - claim_discount_percent) / 100, 2)
  - claim_points_before_uplift: int(claim_spend * P('points_per_dollar'))
  - claim_year_spend: SUM('business_activity','spend_usd', event_type='business_spend_post') - SUM('business_activity','spend_usd',
      event_type='business_spend_reset')
  - approach_uplift: K('near_milestone_uplift') if claim_year_spend * 100 / P('spend_milestone_usd') >= K('near_milestone_share_percent')
      else (K('approach_uplift') if claim_year_spend * 100 / P('spend_milestone_usd') >= K('approach_share_percent')
      else 0)
  - claim_fare_volume: XSUM('ticket','ticket_transactions','amount', within_months=K('claim_fare_volume_window_months'),
      date_field='transaction_date', event_type='ticket_fare_collect')
  - fare_volume_uplift: K('high_fare_volume_uplift') if claim_fare_volume >= K('high_claim_fare_volume_usd') else
      (K('middle_fare_volume_uplift') if claim_fare_volume >= K('middle_claim_fare_volume_usd') else 0)
  - uplifted_claim_points: int(claim_points_before_uplift * (100 + approach_uplift + fare_volume_uplift) / 100)
  - claim_channel: CFIELD('ticket','booking_channel', corporate_account_id=None)
  - claim_share: K('outside_channel_claim_share') if not (claim_channel in P('booking_channels_eligible')) else
      (K('self_service_claim_share') if (claim_channel == 'crestline_app' or claim_channel == 'crestline_website')
      else K('whole_claim_share'))
  - shared_claim_points: int(uplifted_claim_points * claim_share / 100)
  - claim_flown_date: CFIELD('ticket','closed_date', corporate_account_id=None)
  - claim_lag_days: DAYS(claim_flown_date, NOW)
  - settled_claim_points: int(shared_claim_points / K('late_claim_divisor')) if claim_lag_days >= K('late_claim_days')
      else (int(-(-(shared_claim_points * K('prompt_claim_multiplier')) // 1)) if claim_lag_days >= K('prompt_claim_days')
      else shared_claim_points)
  - result: settled_claim_points
  compute_basis:
    claim_ticket_fare: The claim spend starts from the claimed ticket's base fare shared equally among its segments,
      which is the whole base fare for a one-way ticket and half of it for a round trip.
    claim_ticket_trip: The claim spend starts from the claimed ticket's base fare shared equally among its segments,
      which is the whole base fare for a one-way ticket and half of it for a round trip.
    claim_shared_fare: The claim spend starts from the claimed ticket's base fare shared equally among its segments,
      which is the whole base fare for a one-way ticket and half of it for a round trip.
    claim_brand_eligible: 'The negotiated discount that booking under the agreement would have applied reduces the
      claim spend: when the claimed ticket''s fare brand is among the tier''s discount-eligible fare brands and
      its route class is long-haul international, the spend is reduced by the tier''s international discount percentage;
      when the brand is eligible and the route class is domestic or short-haul international, it is reduced by the
      tier''s domestic discount percentage; and when the brand is not eligible it is not reduced.'
    claim_route: 'The negotiated discount that booking under the agreement would have applied reduces the claim
      spend: when the claimed ticket''s fare brand is among the tier''s discount-eligible fare brands and its route
      class is long-haul international, the spend is reduced by the tier''s international discount percentage; when
      the brand is eligible and the route class is domestic or short-haul international, it is reduced by the tier''s
      domestic discount percentage; and when the brand is not eligible it is not reduced.'
    claim_discount_percent: 'The negotiated discount that booking under the agreement would have applied reduces
      the claim spend: when the claimed ticket''s fare brand is among the tier''s discount-eligible fare brands
      and its route class is long-haul international, the spend is reduced by the tier''s international discount
      percentage; when the brand is eligible and the route class is domestic or short-haul international, it is
      reduced by the tier''s domestic discount percentage; and when the brand is not eligible it is not reduced.'
    claim_spend: The claim spend is the shared base fare times one hundred less the discount percentage, divided
      by one hundred, rounded to the cent, and the claim points before uplift are that spend times the tier's points
      per dollar, rounded down to the whole point.
    claim_points_before_uplift: The claim spend is the shared base fare times one hundred less the discount percentage,
      divided by one hundred, rounded to the cent, and the claim points before uplift are that spend times the tier's
      points per dollar, rounded down to the whole point.
    claim_year_spend: The claim's milestone approach is the spend posted to the agreement in its current agreement
      year, taken as every spend entry less every reset entry, as a percentage of the tier's spend milestone.
    approach_uplift: 'The milestone approach adds the approach uplift: at or above the near-milestone share it adds
      the near-milestone uplift, at or above the approach share but below the near-milestone share it adds the approach
      uplift, and below the approach share it adds nothing.'
    claim_fare_volume: The company's claim fare volume is the total of the fares collected on the company's tickets,
      by collection date, in the claim fare-volume window up to and including the claim date.
    fare_volume_uplift: 'Claim fare volume adds the fare-volume uplift: at or above the high claim fare volume it
      adds the high fare-volume uplift, at or above the middle claim fare volume but below the high one it adds
      the middle fare-volume uplift, and below the middle claim fare volume it adds nothing.'
    uplifted_claim_points: The uplifted claim points are the claim points before uplift times one hundred plus the
      approach uplift and the fare-volume uplift, divided by one hundred, rounded down to the whole point.
    claim_channel: 'The claimed ticket''s booking channel sets the claim share: a ticket booked through a channel
      outside the tier''s eligible booking channels keeps the outside-channel claim share, a ticket booked through
      the Crestline app or the Crestline website when that channel is eligible keeps the self-service claim share,
      and a ticket booked through any other eligible channel keeps the whole claim.'
    claim_share: 'The claimed ticket''s booking channel sets the claim share: a ticket booked through a channel
      outside the tier''s eligible booking channels keeps the outside-channel claim share, a ticket booked through
      the Crestline app or the Crestline website when that channel is eligible keeps the self-service claim share,
      and a ticket booked through any other eligible channel keeps the whole claim.'
    shared_claim_points: The shared claim points are the uplifted claim points times the claim share divided by
      one hundred, rounded down to the whole point.
    claim_flown_date: The claim lag is the number of calendar days from the date the claimed ticket closed as flown
      to the claim date.
    claim_lag_days: The claim lag is the number of calendar days from the date the claimed ticket closed as flown
      to the claim date.
    settled_claim_points: 'The claim lag decides how the shared claim points are settled: with a lag of at least
      the late-claim days they are divided by the late-claim divisor and rounded down to the whole point, with a
      lag of at least the prompt-claim days but below the late-claim days they are multiplied by the prompt-claim
      multiplier and rounded up to the whole point, and with a shorter lag they are credited as they stand.'
    result: The points credited for the retroactive claim are the settled claim points.
  factors:
  - id: claim_discount
    effect: parameter
    decides: claim_discount_percent
    bindings:
    - claim_brand_eligible
    - claim_route
    - claim_discount_percent
    ladder:
    - when: the claimed ticket's fare brand is discount-eligible for the tier and its route class is long-haul international
      value: P('fare_discount_percent_international')
    - when: the fare brand is discount-eligible and the route class is domestic or short-haul international
      value: P('fare_discount_percent_domestic')
    - when: otherwise (the fare brand is not discount-eligible)
      value: '0'
    baseline:
      claim_discount_percent: '0'
    evidence:
    - cross_category
    - tier_param
    cross_difficulty: ticket
  - id: claim_milestone_approach
    effect: parameter
    decides: approach_uplift
    bindings:
    - claim_year_spend
    - approach_uplift
    ladder:
    - when: current agreement-year spend at or above the near-milestone share of the tier's spend milestone
      value: K('near_milestone_uplift')
    - when: that spend at or above the approach share but below the near-milestone share
      value: K('approach_uplift')
    - when: otherwise (below the approach share)
      value: '0'
    baseline:
      approach_uplift: '0'
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: claim_fare_volume
    effect: parameter
    decides: fare_volume_uplift
    bindings:
    - claim_fare_volume
    - fare_volume_uplift
    ladder:
    - when: fares collected on the company's tickets in the claim fare-volume window at or above the high claim
        fare volume
      value: K('high_fare_volume_uplift')
    - when: those fares at or above the middle claim fare volume but below the high one
      value: K('middle_fare_volume_uplift')
    - when: otherwise (below the middle claim fare volume)
      value: '0'
    baseline:
      fare_volume_uplift: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: ticket
  - id: claim_channel_share
    effect: parameter
    decides: claim_share
    bindings:
    - claim_channel
    - claim_share
    ladder:
    - when: the claimed ticket was booked through a channel outside the tier's eligible booking channels
      value: K('outside_channel_claim_share')
    - when: it was booked through the Crestline app or the Crestline website and that channel is eligible for the
        tier
      value: K('self_service_claim_share')
    - when: otherwise (another eligible channel)
      value: K('whole_claim_share')
    baseline:
      claim_share: K('whole_claim_share')
    evidence:
    - cross_category
    - tier_param
    cross_difficulty: ticket
  - id: claim_lag_settlement
    effect: method
    decides: settled_claim_points
    bindings:
    - claim_flown_date
    - claim_lag_days
    - settled_claim_points
    ladder:
    - when: the claim is made at least the late-claim days after the claimed ticket closed as flown
      method: the shared claim points are divided by the late-claim divisor and rounded down to the whole point
    - when: the claim is made at least the prompt-claim days but fewer than the late-claim days after
      method: the shared claim points are multiplied by the prompt-claim multiplier and rounded up to the whole
        point
    - when: otherwise (a shorter lag)
      method: the shared claim points are credited as they stand
    baseline:
      settled_claim_points: shared_claim_points
    evidence:
    - date
    - cross_category
    cross_difficulty: ticket
  baseline:
    rule: A retroactive claim credits company points for one flown segment of a ticket the company booked without
      the agreement, when the claim is made within the tier's retroactive claim window after the flight, and it
      posts the points entry and the matching spend entry on the claim date; a ticket booked through a channel outside
      the tier's eligible booking channels may still be claimed, at the outside-channel claim share. The claim spend
      starts from the claimed ticket's base fare shared equally among its segments, which is the whole base fare
      for a one-way ticket and half of it for a round trip. The standard claim spend is that share of the base fare
      as paid, and the standard claim points are the standard claim spend times the tier's points per dollar, rounded
      down to the whole point.
    params:
    - points_per_dollar
  inputs:
    history:
    - table: business_activity
      aggregate: sum
      field: spend_usd
      filters:
        event_type: business_spend_post
    - table: business_activity
      aggregate: sum
      field: spend_usd
      filters:
        event_type: business_spend_reset
    - category: ticket
      table: ticket_transactions
      aggregate: sum
      field: amount
      within_months: 12
      filters:
        event_type: ticket_fare_collect
    cross_category:
    - ticket
- id: business_ext_enrollment_bonus_late_credit
  base_policy_refs:
  - business_points_earning
  overwrite:
  - base_policy: business_points_earning
    superseded_clause: The enrollment bonus of enrollment_bonus_points is credited once when the agreement's flown
      spend since approval first reaches enrollment_bonus_min_flown_spend_usd
    replaced_by: The enrollment bonus credited is the bonus so settled when the flown spend since approval has reached
      the tier's enrollment-bonus spend, and nothing when it has not or when the tier carries no enrollment-bonus
      points.
  trigger: state_due
  subject:
  - business_bonus_points
  computes: points
  target_tool: credit_enrollment_bonus_fc1a1a80
  params:
    late_bonus_months: 6
    long_late_months: 9
    high_enrollment_spend_usd: 50000
    middle_enrollment_spend_usd: 10000
    high_enrollment_spend_uplift: 20
    middle_enrollment_spend_uplift: 10
    enrollment_fare_window_months: 12
    high_enrollment_fares_usd: 100000
    middle_enrollment_fares_usd: 50000
    high_enrollment_fare_uplift: 10
    middle_enrollment_fare_uplift: 5
    enrollment_coupon_window_months: 12
    high_enrollment_coupon_count: 30
    middle_enrollment_coupon_count: 15
    high_coupon_allowance: 500
    middle_coupon_allowance: 300
    repeat_redemption_count: 2
    first_redemption_count: 1
    repeat_redemption_allowance: 300
    first_redemption_allowance: 150
    long_late_multiplier: 1.25
    long_late_step: 100
    late_multiplier: 1.1
    late_step: 50
  rule: 'The enrollment bonus is credited once to an agreement whose flown spend since approval has reached the
    tier''s enrollment-bonus spend, as one bonus entry tied to the approval date, and an agreement whose flown spend
    has not reached it earns no enrollment bonus. The flown spend since approval is the total of every spend entry
    posted to the agreement. The standard enrollment bonus is the tier''s enrollment-bonus points, credited as they
    stand. The enrollment-bonus lateness is the number of whole calendar months from the agreement''s approval date
    to the date the enrollment bonus is credited. A late enrollment bonus earns a spend uplift: when the lateness
    reaches the late-bonus months and the flown spend since approval reaches the high enrollment spend it earns
    the high enrollment spend uplift, when the lateness reaches the late-bonus months and that spend reaches the
    middle enrollment spend but not the high one it earns the middle enrollment spend uplift, and otherwise it earns
    no spend uplift. The enrollment fare measure is the total of the fares collected on the company''s tickets,
    by collection date, in the enrollment fare window up to and including the credit date. A late enrollment bonus
    earns a fare uplift: when the lateness reaches the late-bonus months and the enrollment fare measure reaches
    the high enrollment fares it earns the high enrollment fare uplift, when the lateness reaches the late-bonus
    months and that measure reaches the middle enrollment fares but not the high ones it earns the middle enrollment
    fare uplift, and otherwise it earns no fare uplift. The enrollment bonus before allowances is the standard enrollment
    bonus times one hundred plus the spend uplift and the fare uplift, divided by one hundred, rounded down to the
    whole point. A late enrollment bonus earns a coupon allowance from the flown coupons on the company''s tickets,
    by flight date, in the enrollment coupon window: when the lateness reaches the late-bonus months and those coupons
    reach the high enrollment coupon count it earns the high coupon allowance, when the lateness reaches the late-bonus
    months and they reach the middle enrollment coupon count but not the high one it earns the middle coupon allowance,
    and otherwise no coupon allowance. A late enrollment bonus earns an award allowance from the points redemptions
    booked on the agreement: when the lateness reaches the late-bonus months and at least the repeat-redemption
    count of redemptions is on file it earns the repeat-redemption allowance, when the lateness reaches the late-bonus
    months and exactly one redemption is on file it earns the first-redemption allowance, and otherwise no award
    allowance. The enrollment bonus with allowances is the enrollment bonus before allowances plus the coupon allowance
    and the award allowance. The enrollment-bonus lateness decides how the bonus with allowances is credited: at
    the long-late months or later it is multiplied by the long-late multiplier and rounded up to the next long-late
    step, at the late-bonus months or later but before the long-late months it is multiplied by the late multiplier
    and rounded down to the next lower late step, and earlier it is credited as it stands. The enrollment bonus
    credited is the bonus so settled when the flown spend since approval has reached the tier''s enrollment-bonus
    spend, and nothing when it has not or when the tier carries no enrollment-bonus points.'
  prerequisite: []
  cross_category:
  - category: ticket
    as: history
    reads:
    - ticket_transactions.amount
    - ticket_transactions.event_type
    - ticket_transactions.transaction_date
    - ticket_transactions.flight_date
    note: The fare and coupon allowances of a late enrollment bonus are decided from the company's fare ledger.
  compute:
  - enroll_flown_spend: SUM('business_activity','spend_usd', event_type='business_spend_post')
  - enroll_standard_bonus: P('enrollment_bonus_points')
  - enroll_lateness: MONTHS(F('approved_date'), NOW)
  - enroll_spend_uplift: K('high_enrollment_spend_uplift') if (enroll_lateness >= K('late_bonus_months') and enroll_flown_spend
      >= K('high_enrollment_spend_usd')) else (K('middle_enrollment_spend_uplift') if (enroll_lateness >= K('late_bonus_months')
      and enroll_flown_spend >= K('middle_enrollment_spend_usd')) else 0)
  - enroll_fares: XSUM('ticket','ticket_transactions','amount', within_months=K('enrollment_fare_window_months'),
      date_field='transaction_date', event_type='ticket_fare_collect')
  - enroll_fare_uplift: K('high_enrollment_fare_uplift') if (enroll_lateness >= K('late_bonus_months') and enroll_fares
      >= K('high_enrollment_fares_usd')) else (K('middle_enrollment_fare_uplift') if (enroll_lateness >= K('late_bonus_months')
      and enroll_fares >= K('middle_enrollment_fares_usd')) else 0)
  - enroll_before_allowances: int(enroll_standard_bonus * (100 + enroll_spend_uplift + enroll_fare_uplift) / 100)
  - enroll_coupons: XCOUNT('ticket','ticket_transactions', within_months=K('enrollment_coupon_window_months'), date_field='flight_date',
      event_type='ticket_coupon_flown')
  - enroll_coupon_allowance: K('high_coupon_allowance') if (enroll_lateness >= K('late_bonus_months') and enroll_coupons
      >= K('high_enrollment_coupon_count')) else (K('middle_coupon_allowance') if (enroll_lateness >= K('late_bonus_months')
      and enroll_coupons >= K('middle_enrollment_coupon_count')) else 0)
  - enroll_redemptions: COUNT('business_activity', event_type='business_points_redemption')
  - enroll_award_allowance: K('repeat_redemption_allowance') if (enroll_lateness >= K('late_bonus_months') and enroll_redemptions
      >= K('repeat_redemption_count')) else (K('first_redemption_allowance') if (enroll_lateness >= K('late_bonus_months')
      and enroll_redemptions == K('first_redemption_count')) else 0)
  - enroll_with_allowances: enroll_before_allowances + enroll_coupon_allowance + enroll_award_allowance
  - enroll_settled: int(-(-(enroll_with_allowances * K('long_late_multiplier')) // K('long_late_step')) * K('long_late_step'))
      if enroll_lateness >= K('long_late_months') else (int((enroll_with_allowances * K('late_multiplier')) // K('late_step')
      * K('late_step')) if enroll_lateness >= K('late_bonus_months') else enroll_with_allowances)
  - result: enroll_settled if (enroll_flown_spend >= P('enrollment_bonus_min_flown_spend_usd') and enroll_standard_bonus
      > 0) else 0
  compute_basis:
    enroll_flown_spend: The flown spend since approval is the total of every spend entry posted to the agreement.
    enroll_standard_bonus: The standard enrollment bonus is the tier's enrollment-bonus points, credited as they
      stand.
    enroll_lateness: The enrollment-bonus lateness is the number of whole calendar months from the agreement's approval
      date to the date the enrollment bonus is credited.
    enroll_spend_uplift: 'A late enrollment bonus earns a spend uplift: when the lateness reaches the late-bonus
      months and the flown spend since approval reaches the high enrollment spend it earns the high enrollment spend
      uplift, when the lateness reaches the late-bonus months and that spend reaches the middle enrollment spend
      but not the high one it earns the middle enrollment spend uplift, and otherwise it earns no spend uplift.'
    enroll_fares: The enrollment fare measure is the total of the fares collected on the company's tickets, by collection
      date, in the enrollment fare window up to and including the credit date.
    enroll_fare_uplift: 'A late enrollment bonus earns a fare uplift: when the lateness reaches the late-bonus months
      and the enrollment fare measure reaches the high enrollment fares it earns the high enrollment fare uplift,
      when the lateness reaches the late-bonus months and that measure reaches the middle enrollment fares but not
      the high ones it earns the middle enrollment fare uplift, and otherwise it earns no fare uplift.'
    enroll_before_allowances: The enrollment bonus before allowances is the standard enrollment bonus times one
      hundred plus the spend uplift and the fare uplift, divided by one hundred, rounded down to the whole point.
    enroll_coupons: 'A late enrollment bonus earns a coupon allowance from the flown coupons on the company''s tickets,
      by flight date, in the enrollment coupon window: when the lateness reaches the late-bonus months and those
      coupons reach the high enrollment coupon count it earns the high coupon allowance, when the lateness reaches
      the late-bonus months and they reach the middle enrollment coupon count but not the high one it earns the
      middle coupon allowance, and otherwise no coupon allowance.'
    enroll_coupon_allowance: 'A late enrollment bonus earns a coupon allowance from the flown coupons on the company''s
      tickets, by flight date, in the enrollment coupon window: when the lateness reaches the late-bonus months
      and those coupons reach the high enrollment coupon count it earns the high coupon allowance, when the lateness
      reaches the late-bonus months and they reach the middle enrollment coupon count but not the high one it earns
      the middle coupon allowance, and otherwise no coupon allowance.'
    enroll_redemptions: 'A late enrollment bonus earns an award allowance from the points redemptions booked on
      the agreement: when the lateness reaches the late-bonus months and at least the repeat-redemption count of
      redemptions is on file it earns the repeat-redemption allowance, when the lateness reaches the late-bonus
      months and exactly one redemption is on file it earns the first-redemption allowance, and otherwise no award
      allowance.'
    enroll_award_allowance: 'A late enrollment bonus earns an award allowance from the points redemptions booked
      on the agreement: when the lateness reaches the late-bonus months and at least the repeat-redemption count
      of redemptions is on file it earns the repeat-redemption allowance, when the lateness reaches the late-bonus
      months and exactly one redemption is on file it earns the first-redemption allowance, and otherwise no award
      allowance.'
    enroll_with_allowances: The enrollment bonus with allowances is the enrollment bonus before allowances plus
      the coupon allowance and the award allowance.
    enroll_settled: 'The enrollment-bonus lateness decides how the bonus with allowances is credited: at the long-late
      months or later it is multiplied by the long-late multiplier and rounded up to the next long-late step, at
      the late-bonus months or later but before the long-late months it is multiplied by the late multiplier and
      rounded down to the next lower late step, and earlier it is credited as it stands.'
    result: The enrollment bonus credited is the bonus so settled when the flown spend since approval has reached
      the tier's enrollment-bonus spend, and nothing when it has not or when the tier carries no enrollment-bonus
      points.
  factors:
  - id: late_bonus_spend_uplift
    effect: parameter
    decides: enroll_spend_uplift
    bindings:
    - enroll_flown_spend
    - enroll_spend_uplift
    ladder:
    - when: the bonus is credited at least the late-bonus months after approval and flown spend since approval reaches
        the high enrollment spend
      value: K('high_enrollment_spend_uplift')
    - when: credited at least the late-bonus months after approval and that spend reaches the middle enrollment
        spend but not the high one
      value: K('middle_enrollment_spend_uplift')
    - when: otherwise
      value: '0'
    baseline:
      enroll_spend_uplift: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: late_bonus_fare_uplift
    effect: parameter
    decides: enroll_fare_uplift
    bindings:
    - enroll_fares
    - enroll_fare_uplift
    ladder:
    - when: credited at least the late-bonus months after approval and the fares collected on the company's tickets
        in the enrollment fare window reach the high enrollment fares
      value: K('high_enrollment_fare_uplift')
    - when: credited at least the late-bonus months after approval and those fares reach the middle enrollment fares
        but not the high ones
      value: K('middle_enrollment_fare_uplift')
    - when: otherwise
      value: '0'
    baseline:
      enroll_fare_uplift: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: ticket
  - id: late_bonus_coupon_allowance
    effect: parameter
    decides: enroll_coupon_allowance
    bindings:
    - enroll_coupons
    - enroll_coupon_allowance
    ladder:
    - when: credited at least the late-bonus months after approval and the flown coupons on the company's tickets
        in the enrollment coupon window reach the high enrollment coupon count
      value: K('high_coupon_allowance')
    - when: credited at least the late-bonus months after approval and those coupons reach the middle enrollment
        coupon count but not the high one
      value: K('middle_coupon_allowance')
    - when: otherwise
      value: '0'
    baseline:
      enroll_coupon_allowance: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: ticket
  - id: late_bonus_award_allowance
    effect: parameter
    decides: enroll_award_allowance
    bindings:
    - enroll_redemptions
    - enroll_award_allowance
    ladder:
    - when: credited at least the late-bonus months after approval with at least the repeat-redemption count of
        redemptions on file
      value: K('repeat_redemption_allowance')
    - when: credited at least the late-bonus months after approval with exactly one redemption on file
      value: K('first_redemption_allowance')
    - when: otherwise
      value: '0'
    baseline:
      enroll_award_allowance: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: late_bonus_settlement
    effect: method
    decides: enroll_settled
    bindings:
    - enroll_lateness
    - enroll_settled
    ladder:
    - when: the bonus is credited at the long-late months after approval or later
      method: the bonus with allowances is multiplied by the long-late multiplier and rounded up to the next long-late
        step
    - when: credited at the late-bonus months or later but before the long-late months
      method: the bonus with allowances is multiplied by the late multiplier and rounded down to the next lower
        late step
    - when: otherwise (credited earlier)
      method: the bonus with allowances is credited as it stands
    baseline:
      enroll_settled: enroll_with_allowances
    evidence:
    - date
    cross_difficulty: null
  baseline:
    rule: The enrollment bonus is credited once to an agreement whose flown spend since approval has reached the
      tier's enrollment-bonus spend, as one bonus entry tied to the approval date, and an agreement whose flown
      spend has not reached it earns no enrollment bonus. The flown spend since approval is the total of every spend
      entry posted to the agreement. The standard enrollment bonus is the tier's enrollment-bonus points, credited
      as they stand.
    params:
    - enrollment_bonus_points
    - enrollment_bonus_min_flown_spend_usd
  inputs:
    history:
    - table: business_activity
      aggregate: sum
      field: spend_usd
      filters:
