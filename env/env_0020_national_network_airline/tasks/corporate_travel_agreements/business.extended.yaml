extended_policies:
- id: business_ext_overdue_invoice_late_fee
  base_policy_refs:
  - business_billing
  overwrite:
  - base_policy: business_billing
    superseded_clause: late_payment_fee_percent percent of its unpaid amount, at least late_payment_fee_min_usd,
      rounded to the cent
    replaced_by: The fee before tenure is the unpaid amount past due times the late-fee rate divided by one hundred,
      times the kept share divided by one hundred, rounded to the cent once at the end.
  trigger: state_due
  subject:
  - business_late_fee
  computes: amount
  target_tool: assess_invoice_late_fee_9e8e2547
  params:
    past_due_lookback_months: 600
    late_fee_record_window_months: 12
    repeat_fee_count: 2
    second_fee_count: 1
    repeat_fee_rate_percent: 2.5
    second_fee_rate_percent: 2.0
    high_credit_use_ratio: 0.9
    middle_credit_use_ratio: 0.6
    high_credit_use_addition: 0.5
    middle_credit_use_addition: 0.25
    long_payment_gap_days: 45
    short_payment_gap_days: 21
    long_payment_gap_addition: 0.5
    short_payment_gap_addition: 0.25
    invoiced_flying_window_months: 12
    high_invoiced_flying_usd: 150000
    middle_invoiced_flying_usd: 60000
    high_volume_share_percent: 60
    middle_volume_share_percent: 80
    whole_fee_share_percent: 100
    long_tenure_months: 36
    middle_tenure_months: 12
    long_tenure_divisor: 2
    middle_tenure_multiplier: 0.75
  rule: 'A late fee is charged once on each invoice of the agreement that is still unpaid after its due date, dated
    on the day it is charged, and it is booked against that invoice''s number and due date. The unpaid amount past
    due is read from the agreement''s invoice entries as every invoice charge whose due date falls on or before
    the fee date, plus every late fee already charged, less every payment received. The standard late fee is the
    tier''s late-payment fee percentage of the unpaid amount past due, rounded to the cent, and never less than
    the tier''s minimum late fee. The starting late-fee rate follows the agreement''s record of late fees charged
    in the late-fee record window up to and including the fee date: when at least the repeat-fee count of late fees
    was charged it is the repeat-fee rate, when exactly the second-fee count was charged it is the second-fee rate,
    and when none was charged it is the tier''s late-payment fee percentage. The agreement''s open invoice balance
    is read from its invoice entries as every invoice charge plus every late fee less every payment, and its credit
    use is that balance divided by the tier''s credit limit. Credit use raises the late-fee rate: at or above the
    high credit-use ratio the rate rises by the high credit-use addition, at or above the middle credit-use ratio
    but below the high one it rises by the middle credit-use addition, and below the middle credit-use ratio it
    does not rise. The payment gap is the number of calendar days from the date of the latest payment entry on the
    agreement to the fee date. The payment gap raises the late-fee rate: at or above the long payment-gap days the
    rate rises by the long payment-gap addition, at or above the short payment-gap days but below the long ones
    it rises by the short payment-gap addition, and below the short payment-gap days it does not rise. The late-fee
    rate is the starting late-fee rate plus the credit-use addition plus the payment-gap addition, all in percentage
    points, added together before the rate is applied. The company''s invoiced flying is the total of the fares
    collected on invoice on the company''s tickets, by collection date, in the invoiced-flying window up to and
    including the fee date. Invoiced flying decides the share of the fee that is kept: at or above the high invoiced-flying
    amount the high-volume share is kept, at or above the middle invoiced-flying amount but below the high one the
    middle-volume share is kept, and below the middle invoiced-flying amount the whole fee is kept. The fee before
    tenure is the unpaid amount past due times the late-fee rate divided by one hundred, times the kept share divided
    by one hundred, rounded to the cent once at the end. Tenure is the number of whole calendar months from the
    agreement''s approval date to the fee date. Tenure decides how the fee before tenure is settled: for tenure
    of at least the long-tenure months the fee is divided by the long-tenure divisor and rounded down to the whole
    dollar, for tenure of at least the middle-tenure months but below the long-tenure months the fee is multiplied
    by the middle-tenure multiplier and rounded up to the whole dollar, and for shorter tenure the fee before tenure
    stands as computed to the cent. The late fee charged is the larger of the settled fee and the tier''s minimum
    late fee.'
  prerequisite: []
  cross_category:
  - category: ticket
    as: history
    reads:
    - ticket_transactions.amount
    - ticket_transactions.event_type
    - ticket_transactions.payment_form
    - ticket_transactions.transaction_date
    note: The invoiced-flying share of the late fee is decided from the fares collected on invoice on the company's
      tickets in the ticket fare ledger.
  compute:
  - charges_past_due: SUM('business_invoices','amount', within_months=K('past_due_lookback_months'), date_field='due_date',
      event_type='business_invoice_charge')
  - fees_charged: SUM('business_invoices','amount', event_type='business_late_fee')
  - payments_received: SUM('business_invoices','amount', event_type='business_invoice_payment')
  - unpaid_past_due: RND(charges_past_due + fees_charged - payments_received, 2)
  - late_fees_in_window: COUNT('business_invoices', within_months=K('late_fee_record_window_months'), date_field='entry_date',
      event_type='business_late_fee')
  - starting_fee_rate: K('repeat_fee_rate_percent') if late_fees_in_window >= K('repeat_fee_count') else (K('second_fee_rate_percent')
      if late_fees_in_window == K('second_fee_count') else P('late_payment_fee_percent'))
  - charges_all: SUM('business_invoices','amount', event_type='business_invoice_charge')
  - open_invoice_balance: RND(charges_all + fees_charged - payments_received, 2)
  - credit_use: open_invoice_balance / P('credit_limit_usd')
  - credit_use_addition: K('high_credit_use_addition') if credit_use >= K('high_credit_use_ratio') else (K('middle_credit_use_addition')
      if credit_use >= K('middle_credit_use_ratio') else 0)
  - latest_payment_date: LATEST('business_invoices','entry_date', date_field='entry_date', event_type='business_invoice_payment')
  - payment_gap_days: DAYS(latest_payment_date, NOW)
  - payment_gap_addition: K('long_payment_gap_addition') if payment_gap_days >= K('long_payment_gap_days') else
      (K('short_payment_gap_addition') if payment_gap_days >= K('short_payment_gap_days') else 0)
  - late_fee_rate: starting_fee_rate + credit_use_addition + payment_gap_addition
  - invoiced_flying: XSUM('ticket','ticket_transactions','amount', within_months=K('invoiced_flying_window_months'),
      date_field='transaction_date', event_type='ticket_fare_collect', payment_form='corporate_invoice')
  - kept_share_percent: K('high_volume_share_percent') if invoiced_flying >= K('high_invoiced_flying_usd') else
      (K('middle_volume_share_percent') if invoiced_flying >= K('middle_invoiced_flying_usd') else K('whole_fee_share_percent'))
  - fee_before_tenure: RND(unpaid_past_due * late_fee_rate / 100 * kept_share_percent / 100, 2)
  - tenure_months: MONTHS(F('approved_date'), NOW)
  - settled_fee: float(int(fee_before_tenure / K('long_tenure_divisor'))) if tenure_months >= K('long_tenure_months')
      else (float(-(-(fee_before_tenure * K('middle_tenure_multiplier')) // 1)) if tenure_months >= K('middle_tenure_months')
      else fee_before_tenure)
  - result: MX(P('late_payment_fee_min_usd'), settled_fee)
  compute_basis:
    charges_past_due: The unpaid amount past due is read from the agreement's invoice entries as every invoice charge
      whose due date falls on or before the fee date, plus every late fee already charged, less every payment received.
    fees_charged: The unpaid amount past due is read from the agreement's invoice entries as every invoice charge
      whose due date falls on or before the fee date, plus every late fee already charged, less every payment received.
    payments_received: The unpaid amount past due is read from the agreement's invoice entries as every invoice
      charge whose due date falls on or before the fee date, plus every late fee already charged, less every payment
      received.
    unpaid_past_due: The unpaid amount past due is read from the agreement's invoice entries as every invoice charge
      whose due date falls on or before the fee date, plus every late fee already charged, less every payment received.
    late_fees_in_window: 'The starting late-fee rate follows the agreement''s record of late fees charged in the
      late-fee record window up to and including the fee date: when at least the repeat-fee count of late fees was
      charged it is the repeat-fee rate, when exactly the second-fee count was charged it is the second-fee rate,
      and when none was charged it is the tier''s late-payment fee percentage.'
    starting_fee_rate: 'The starting late-fee rate follows the agreement''s record of late fees charged in the late-fee
      record window up to and including the fee date: when at least the repeat-fee count of late fees was charged
      it is the repeat-fee rate, when exactly the second-fee count was charged it is the second-fee rate, and when
      none was charged it is the tier''s late-payment fee percentage.'
    charges_all: The agreement's open invoice balance is read from its invoice entries as every invoice charge plus
      every late fee less every payment, and its credit use is that balance divided by the tier's credit limit.
    open_invoice_balance: The agreement's open invoice balance is read from its invoice entries as every invoice
      charge plus every late fee less every payment, and its credit use is that balance divided by the tier's credit
      limit.
    credit_use: The agreement's open invoice balance is read from its invoice entries as every invoice charge plus
      every late fee less every payment, and its credit use is that balance divided by the tier's credit limit.
    credit_use_addition: 'Credit use raises the late-fee rate: at or above the high credit-use ratio the rate rises
      by the high credit-use addition, at or above the middle credit-use ratio but below the high one it rises by
      the middle credit-use addition, and below the middle credit-use ratio it does not rise.'
    latest_payment_date: The payment gap is the number of calendar days from the date of the latest payment entry
      on the agreement to the fee date.
    payment_gap_days: The payment gap is the number of calendar days from the date of the latest payment entry on
      the agreement to the fee date.
    payment_gap_addition: 'The payment gap raises the late-fee rate: at or above the long payment-gap days the rate
      rises by the long payment-gap addition, at or above the short payment-gap days but below the long ones it
      rises by the short payment-gap addition, and below the short payment-gap days it does not rise.'
    late_fee_rate: The late-fee rate is the starting late-fee rate plus the credit-use addition plus the payment-gap
      addition, all in percentage points, added together before the rate is applied.
    invoiced_flying: The company's invoiced flying is the total of the fares collected on invoice on the company's
      tickets, by collection date, in the invoiced-flying window up to and including the fee date.
    kept_share_percent: 'Invoiced flying decides the share of the fee that is kept: at or above the high invoiced-flying
      amount the high-volume share is kept, at or above the middle invoiced-flying amount but below the high one
      the middle-volume share is kept, and below the middle invoiced-flying amount the whole fee is kept.'
    fee_before_tenure: The fee before tenure is the unpaid amount past due times the late-fee rate divided by one
      hundred, times the kept share divided by one hundred, rounded to the cent once at the end.
    tenure_months: Tenure is the number of whole calendar months from the agreement's approval date to the fee date.
    settled_fee: 'Tenure decides how the fee before tenure is settled: for tenure of at least the long-tenure months
      the fee is divided by the long-tenure divisor and rounded down to the whole dollar, for tenure of at least
      the middle-tenure months but below the long-tenure months the fee is multiplied by the middle-tenure multiplier
      and rounded up to the whole dollar, and for shorter tenure the fee before tenure stands as computed to the
      cent.'
    result: The late fee charged is the larger of the settled fee and the tier's minimum late fee.
  factors:
  - id: late_fee_record_rate
    effect: parameter
    decides: starting_fee_rate
    bindings:
    - late_fees_in_window
    - starting_fee_rate
    ladder:
    - when: at least the repeat-fee count of late fees charged on the agreement in the late-fee record window up
        to and including the fee date
      value: K('repeat_fee_rate_percent')
    - when: exactly the second-fee count of late fees charged in that window
      value: K('second_fee_rate_percent')
    - when: otherwise (no late fee charged in that window)
      value: P('late_payment_fee_percent')
    baseline:
      starting_fee_rate: P('late_payment_fee_percent')
    evidence:
    - history
    cross_difficulty: null
  - id: credit_use_addition
    effect: parameter
    decides: credit_use_addition
    bindings:
    - charges_all
    - open_invoice_balance
    - credit_use
    - credit_use_addition
    ladder:
    - when: open invoice balance divided by the tier's credit limit at or above the high credit-use ratio
      value: K('high_credit_use_addition')
    - when: that ratio at or above the middle credit-use ratio but below the high one
      value: K('middle_credit_use_addition')
    - when: otherwise (below the middle credit-use ratio)
      value: '0'
    baseline:
      credit_use_addition: '0'
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: payment_gap_addition
    effect: parameter
    decides: payment_gap_addition
    bindings:
    - latest_payment_date
    - payment_gap_days
    - payment_gap_addition
    ladder:
    - when: latest payment entry at least the long payment-gap days before the fee date
      value: K('long_payment_gap_addition')
    - when: latest payment entry at least the short payment-gap days but fewer than the long payment-gap days before
        the fee date
      value: K('short_payment_gap_addition')
    - when: otherwise (fewer than the short payment-gap days)
      value: '0'
    baseline:
      payment_gap_addition: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: invoiced_flying_share
    effect: parameter
    decides: kept_share_percent
    bindings:
    - invoiced_flying
    - kept_share_percent
    ladder:
    - when: fares collected on invoice on the company's tickets in the invoiced-flying window at or above the high
        invoiced-flying amount
      value: K('high_volume_share_percent')
    - when: those fares at or above the middle invoiced-flying amount but below the high one
      value: K('middle_volume_share_percent')
    - when: otherwise (below the middle invoiced-flying amount)
      value: K('whole_fee_share_percent')
    baseline:
      kept_share_percent: K('whole_fee_share_percent')
    evidence:
    - cross_category
    - history
    cross_difficulty: ticket
  - id: tenure_settlement
    effect: method
    decides: settled_fee
    bindings:
    - tenure_months
    - settled_fee
    ladder:
    - when: agreement approved at least the long-tenure months before the fee date
      method: the fee before tenure is divided by the long-tenure divisor and rounded down to the whole dollar
    - when: agreement approved at least the middle-tenure months but fewer than the long-tenure months before the
        fee date
      method: the fee before tenure is multiplied by the middle-tenure multiplier and rounded up to the whole dollar
    - when: otherwise (a shorter tenure)
      method: the fee before tenure stands as computed to the cent
    baseline:
      settled_fee: fee_before_tenure
    evidence:
    - date
    cross_difficulty: null
  baseline:
    rule: A late fee is charged once on each invoice of the agreement that is still unpaid after its due date, dated
      on the day it is charged, and it is booked against that invoice's number and due date. The unpaid amount past
      due is read from the agreement's invoice entries as every invoice charge whose due date falls on or before
      the fee date, plus every late fee already charged, less every payment received. The standard late fee is the
      tier's late-payment fee percentage of the unpaid amount past due, rounded to the cent, and never less than
      the tier's minimum late fee.
    params:
    - late_payment_fee_percent
    - late_payment_fee_min_usd
  inputs:
    history:
    - table: business_invoices
      aggregate: sum
      field: amount
      within_months: 600
      filters:
        event_type: business_invoice_charge
    - table: business_invoices
      aggregate: sum
      field: amount
      filters:
        event_type: business_late_fee
    - table: business_invoices
      aggregate: sum
      field: amount
      filters:
        event_type: business_invoice_payment
    - table: business_invoices
      aggregate: count
      field: invoice_entry_id
      within_months: 12
      filters:
        event_type: business_late_fee
    - table: business_invoices
      aggregate: latest
      field: entry_date
      filters:
        event_type: business_invoice_payment
    - category: ticket
      table: ticket_transactions
      aggregate: sum
      field: amount
      within_months: 12
      filters:
        event_type: ticket_fare_collect
        payment_form: corporate_invoice
    cross_category:
    - ticket
- id: business_ext_card_paid_ticket_points
  base_policy_refs:
  - business_points_earning
  - business_negotiated_benefits
  overwrite:
  - base_policy: business_points_earning
    superseded_clause: Points are the segment's eligible spend times points_per_dollar of the tier held on the flight
      date, rounded down to the whole point
    replaced_by: The card-paid segment points posted are the earned points times one hundred plus the card-paid
      uplift, divided by one hundred, rounded down to the whole point once at the end.
  trigger: state_due
  subject:
  - business_points_accrual
  computes: points
  target_tool: post_card_ticket_points_2b97bc4a
  params:
    flexible_fare_segment_points: 250
    premium_fare_multiplier: 2
    long_haul_route_uplift: 20
    short_haul_route_uplift: 10
    long_posting_delay_days: 30
    short_posting_delay_days: 14
    long_posting_delay_uplift: 20
    short_posting_delay_uplift: 10
    segment_activity_window_months: 12
    high_segment_activity_count: 30
    middle_segment_activity_count: 15
    high_activity_uplift: 12
    middle_activity_uplift: 6
    spend_standing_window_months: 12
    threshold_uplift: 10
    retention_uplift: 5
    card_round_trip_segments: 2
    card_one_way_segments: 1
  rule: 'A flown segment of a ticket booked under the agreement whose fare was paid by card rather than on invoice
    earns company points like every other segment flown under the agreement, and when its points entry is missing
    it is posted with its spend entry on the day the omission is corrected. The card-paid segment''s eligible spend
    is its equal share of the base fare recorded on the card-paid ticket, which already carries the negotiated discount
    applied at booking: the whole base fare for a one-way ticket and half of it for a round trip. The standard card-paid
    segment points are the eligible spend times the tier''s points per dollar, rounded down to the whole point,
    with no addition. The ticket''s fare brand decides how the card-paid segment points are earned: on Crestline
    Premium Economy or Crestline First the standard points are multiplied by the premium-fare multiplier, on Crestline
    Main Flexible or Crestline Main Plus the flexible-fare segment points are added to the standard points, and
    on any other fare brand the standard points are earned as they are. The ticket''s route class adds to the card-paid
    uplift: a long-haul international ticket adds the long-haul route uplift, a short-haul international ticket
    adds the short-haul route uplift, and a domestic ticket adds nothing. The posting delay is the number of calendar
    days from the date the card-paid ticket was flown to the posting date. The posting delay adds to the card-paid
    uplift: a delay of at least the long posting-delay days adds the long posting-delay uplift, a delay of at least
    the short posting-delay days but below the long ones adds the short posting-delay uplift, and a shorter delay
    adds nothing. The company''s segment activity is the number of flown coupons on the company''s tickets, by flight
    date, in the segment-activity window up to and including the posting date. Segment activity adds to the card-paid
    uplift: at or above the high segment-activity count it adds the high activity uplift, at or above the middle
    segment-activity count but below the high one it adds the middle activity uplift, and below the middle count
    it adds nothing. The agreement''s spend standing is the eligible spend posted to the agreement in the spend-standing
    window up to and including the posting date. Spend standing adds to the card-paid uplift: spend at or above
    the tier''s annual spend threshold adds the threshold uplift, spend at or above the tier''s retention level
    (the tier''s retention percentage of that threshold) but below the threshold adds the retention uplift, and
    lower spend adds nothing. The card-paid uplift is the route, posting-delay, segment-activity and spend-standing
    uplifts added together, in percentage points. The card-paid segment points posted are the earned points times
    one hundred plus the card-paid uplift, divided by one hundred, rounded down to the whole point once at the end.'
  prerequisite: []
  cross_category:
  - category: ticket
    as: history
    reads:
    - base_fare
    - trip_type
    - variant_name
    - route_type
    - closed_date
    - corporate_account_id
    - payment_form
    - ticket_transactions.event_type
    - ticket_transactions.flight_date
    note: The card-paid ticket's fare, brand, route class and flight date, and the company's flown coupons, are
      read from the company's ticket records and fare ledger.
  compute:
  - card_ticket_fare: CFIELD('ticket','base_fare', corporate_account_id=HID, payment_form='credit_card')
  - card_ticket_trip: CFIELD('ticket','trip_type', corporate_account_id=HID, payment_form='credit_card')
  - card_segment_spend: RND(card_ticket_fare / (K('card_round_trip_segments') if card_ticket_trip == 'round_trip'
      else K('card_one_way_segments')), 2)
  - standard_card_points: int(card_segment_spend * P('points_per_dollar'))
  - card_ticket_brand: CFIELD('ticket','variant_name', corporate_account_id=HID, payment_form='credit_card')
  - earned_card_points: standard_card_points * K('premium_fare_multiplier') if (card_ticket_brand == 'Crestline
      Premium Economy' or card_ticket_brand == 'Crestline First') else (standard_card_points + K('flexible_fare_segment_points')
      if (card_ticket_brand == 'Crestline Main Flexible' or card_ticket_brand == 'Crestline Main Plus') else standard_card_points)
  - card_ticket_route: CFIELD('ticket','route_type', corporate_account_id=HID, payment_form='credit_card')
  - route_uplift: K('long_haul_route_uplift') if card_ticket_route == 'long_haul_international' else (K('short_haul_route_uplift')
      if card_ticket_route == 'short_haul_international' else 0)
  - card_flight_date: CFIELD('ticket','closed_date', corporate_account_id=HID, payment_form='credit_card')
  - posting_delay_days: DAYS(card_flight_date, NOW)
  - posting_delay_uplift: K('long_posting_delay_uplift') if posting_delay_days >= K('long_posting_delay_days') else
      (K('short_posting_delay_uplift') if posting_delay_days >= K('short_posting_delay_days') else 0)
  - segment_activity: XCOUNT('ticket','ticket_transactions', within_months=K('segment_activity_window_months'),
      date_field='flight_date', event_type='ticket_coupon_flown')
  - activity_uplift: K('high_activity_uplift') if segment_activity >= K('high_segment_activity_count') else (K('middle_activity_uplift')
      if segment_activity >= K('middle_segment_activity_count') else 0)
  - spend_standing: SUM('business_activity','spend_usd', within_months=K('spend_standing_window_months'), date_field='activity_date',
      event_type='business_spend_post')
  - standing_uplift: K('threshold_uplift') if spend_standing >= P('annual_spend_threshold_usd') else (K('retention_uplift')
      if spend_standing >= P('annual_spend_threshold_usd') * P('retention_spend_percent_of_threshold') / 100 else
      0)
  - card_uplift: route_uplift + posting_delay_uplift + activity_uplift + standing_uplift
  - result: int(earned_card_points * (100 + card_uplift) / 100)
  compute_basis:
