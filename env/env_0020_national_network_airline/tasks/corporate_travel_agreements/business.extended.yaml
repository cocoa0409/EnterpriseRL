- id: business_ext_spend_milestone_bonus
  base_policy_refs:
  - business_points_earning
  overwrite:
  - base_policy: business_points_earning
    superseded_clause: the milestone bonus of spend_milestone_bonus_points is credited once per agreement year when
      the agreement year's spend first reaches spend_milestone_usd of the tier then held
    replaced_by: The milestone bonus credited is the bonus so settled when the milestone year spend has reached
      the tier's spend milestone, and nothing when it has not.
  trigger: state_due
  subject:
  - business_bonus_points
  computes: points
  target_tool: credit_milestone_bonus_a908f78d
  params:
    months_per_agreement_year: 12
    fast_pace_months: 8
    steady_pace_months: 10
    fast_pace_uplift: 40
    steady_pace_uplift: 15
    premium_share_window_months: 12
    high_premium_share_percent: 50
    middle_premium_share_percent: 25
    high_premium_uplift: 20
    middle_premium_uplift: 10
    high_segment_count: 30
    middle_segment_count: 15
    high_segment_uplift: 10
    middle_segment_uplift: 5
    momentum_window_months: 3
    high_momentum_share_percent: 40
    middle_momentum_share_percent: 25
    high_momentum_uplift: 10
    middle_momentum_uplift: 5
    high_redemption_points: 3000
    high_redemption_allowance: 250
    low_redemption_allowance: 100
    first_year_multiplier: 2
    first_year_step: 100
    second_year_multiplier: 1.5
    second_year_step: 100
  rule: 'The spend-milestone bonus is credited once for an agreement year whose spend has reached the tier''s spend
    milestone, as one bonus entry tied to the first day of that agreement year, and an agreement year whose spend
    has not reached the milestone earns no milestone bonus. A spend-milestone bonus is fixed only after every flown
    segment of a ticket the company booked without the agreement that is still inside the claim window carries its
    points entry. The milestone year spend is the total of the spend entries posted to the agreement less the spend
    removed by its agreement-year reset entries. The standard milestone bonus is the tier''s spend-milestone bonus
    points, credited as they stand. The milestone pace is the number of whole calendar months the current agreement
    year has run, counted from the latest anniversary of the approval date. The milestone pace adds a pace uplift:
    within the fast-pace months it adds the fast-pace uplift, after the fast-pace months but within the steady-pace
    months it adds the steady-pace uplift, and later it adds nothing. The premium cabin share is the flown coupons
    on the company''s tickets flown in First or Premium Economy divided by all flown coupons on the company''s tickets,
    both by flight date in the premium-share window, in percent. The premium cabin share adds a premium uplift:
    at or above the high premium share it adds the high premium uplift, at or above the middle premium share but
    below the high one it adds the middle premium uplift, and below the middle premium share it adds nothing. The
    segments credited in the current agreement year, counted as the points accrual entries dated fewer whole calendar
    months before the credit date than the milestone pace plus one, add a segment uplift: at or above the high segment
    count the high segment uplift, at or above the middle segment count but below the high one the middle segment
    uplift, and below the middle segment count nothing. The milestone momentum is the spend entries posted in the
    momentum window up to and including the credit date as a percentage of the milestone year spend. The milestone
    momentum adds a momentum uplift: at or above the high momentum share it adds the high momentum uplift, at or
    above the middle momentum share but below the high one it adds the middle momentum uplift, and below the middle
    momentum share it adds nothing. The milestone bonus before its allowance is the standard milestone bonus times
    one hundred plus the pace, premium, segment and momentum uplifts, divided by one hundred, rounded down to the
    whole point. Points redeemed from the agreement in its current agreement year, counted as the redemption entries
    dated fewer whole calendar months before the credit date than the milestone pace plus one, add a redemption
    allowance: at or above the high redemption points the high redemption allowance, at least one point but below
    the high redemption points the low redemption allowance, and none redeemed nothing. The milestone bonus with
    its allowance is the milestone bonus before its allowance plus the redemption allowance. The agreement year''s
    order decides how the milestone bonus with its allowance is credited: in the first agreement year it is multiplied
    by the first-year multiplier and rounded down to the next lower first-year step, in the second agreement year
    it is multiplied by the second-year multiplier and rounded up to the next second-year step, and in any later
    agreement year it is credited as it stands. The milestone bonus credited is the bonus so settled when the milestone
    year spend has reached the tier''s spend milestone, and nothing when it has not.'
  prerequisite:
  - problem: business_ext_retro_claim_points
    kind: value_input
    gate: milestone_segments
    form: state
    policy_source: A spend-milestone bonus is fixed only after every flown segment of a ticket the company booked
      without the agreement that is still inside the claim window carries its points entry.
    condition: Every flown coupon of a company-held ticket with no corporate_account_id, flown within the tier's
      retroactive_points_window_days before the credit date, has a business_points_accrual entry (with its business_spend_post
      entry) on its ticket and segment.
    resolved_by: claim_retro_segment_points_a26ae9c7
    effect: Once the claimed segment's points and spend entries are posted, the milestone year spend and the segments
      credited in the current agreement year both rise, which can carry the spend to the spend milestone or move
      the segment uplift to a higher tier, and so change the milestone bonus.
  cross_category:
  - category: ticket
    as: history
    reads:
    - ticket_transactions.event_type
    - ticket_transactions.cabin_flown
    - ticket_transactions.flight_date
    note: The premium uplift of the milestone bonus is decided from the cabins flown on the company's coupons.
  compute:
  - milestone_year_spend: SUM('business_activity','spend_usd', event_type='business_spend_post') - SUM('business_activity','spend_usd',
      event_type='business_spend_reset')
  - milestone_standard_bonus: P('spend_milestone_bonus_points') if milestone_year_spend >= P('spend_milestone_usd')
      else 0
  - milestone_pace_months: MONTHS(F('approved_date'), NOW) % K('months_per_agreement_year')
  - pace_uplift: K('fast_pace_uplift') if milestone_pace_months <= K('fast_pace_months') else (K('steady_pace_uplift')
      if milestone_pace_months <= K('steady_pace_months') else 0)
  - premium_first_coupons: XCOUNT('ticket','ticket_transactions', within_months=K('premium_share_window_months'),
      date_field='flight_date', event_type='ticket_coupon_flown', cabin_flown='first')
  - premium_pe_coupons: XCOUNT('ticket','ticket_transactions', within_months=K('premium_share_window_months'), date_field='flight_date',
      event_type='ticket_coupon_flown', cabin_flown='premium_economy')
  - premium_all_coupons: XCOUNT('ticket','ticket_transactions', within_months=K('premium_share_window_months'),
      date_field='flight_date', event_type='ticket_coupon_flown')
  - premium_share_percent: (premium_first_coupons + premium_pe_coupons) * 100 / MX(premium_all_coupons, 1)
  - premium_uplift: K('high_premium_uplift') if premium_share_percent >= K('high_premium_share_percent') else (K('middle_premium_uplift')
      if premium_share_percent >= K('middle_premium_share_percent') else 0)
  - milestone_segments: COUNT('business_activity', within_months=milestone_pace_months + 1, date_field='activity_date',
      event_type='business_points_accrual')
  - segment_uplift: K('high_segment_uplift') if milestone_segments >= K('high_segment_count') else (K('middle_segment_uplift')
      if milestone_segments >= K('middle_segment_count') else 0)
  - momentum_spend: SUM('business_activity','spend_usd', within_months=K('momentum_window_months'), date_field='activity_date',
      event_type='business_spend_post')
  - momentum_share_percent: momentum_spend * 100 / MX(milestone_year_spend, 1)
  - momentum_uplift: K('high_momentum_uplift') if momentum_share_percent >= K('high_momentum_share_percent') else
      (K('middle_momentum_uplift') if momentum_share_percent >= K('middle_momentum_share_percent') else 0)
  - milestone_before_allowance: int(milestone_standard_bonus * (100 + pace_uplift + premium_uplift + segment_uplift
      + momentum_uplift) / 100)
  - milestone_redeemed: SUM('business_activity','points', within_months=milestone_pace_months + 1, date_field='activity_date',
      event_type='business_points_redemption')
  - redemption_allowance: K('high_redemption_allowance') if milestone_redeemed >= K('high_redemption_points') else
      (K('low_redemption_allowance') if milestone_redeemed > 0 else 0)
  - milestone_with_allowance: milestone_before_allowance + redemption_allowance
  - milestone_year_order: MONTHS(F('approved_date'), NOW) // K('months_per_agreement_year') + 1
  - milestone_settled: int((milestone_with_allowance * K('first_year_multiplier')) // K('first_year_step') * K('first_year_step'))
      if milestone_year_order == 1 else (int(-(-(milestone_with_allowance * K('second_year_multiplier')) // K('second_year_step'))
      * K('second_year_step')) if milestone_year_order == 2 else milestone_with_allowance)
  - result: milestone_settled if milestone_year_spend >= P('spend_milestone_usd') else 0
  compute_basis:
    milestone_year_spend: The milestone year spend is the total of the spend entries posted to the agreement less
      the spend removed by its agreement-year reset entries.
    milestone_standard_bonus: The standard milestone bonus is the tier's spend-milestone bonus points, credited
      as they stand.
    milestone_pace_months: The milestone pace is the number of whole calendar months the current agreement year
      has run, counted from the latest anniversary of the approval date.
    pace_uplift: 'The milestone pace adds a pace uplift: within the fast-pace months it adds the fast-pace uplift,
      after the fast-pace months but within the steady-pace months it adds the steady-pace uplift, and later it
      adds nothing.'
    premium_first_coupons: The premium cabin share is the flown coupons on the company's tickets flown in First
      or Premium Economy divided by all flown coupons on the company's tickets, both by flight date in the premium-share
      window, in percent.
    premium_pe_coupons: The premium cabin share is the flown coupons on the company's tickets flown in First or
      Premium Economy divided by all flown coupons on the company's tickets, both by flight date in the premium-share
      window, in percent.
    premium_all_coupons: The premium cabin share is the flown coupons on the company's tickets flown in First or
      Premium Economy divided by all flown coupons on the company's tickets, both by flight date in the premium-share
      window, in percent.
    premium_share_percent: The premium cabin share is the flown coupons on the company's tickets flown in First
      or Premium Economy divided by all flown coupons on the company's tickets, both by flight date in the premium-share
      window, in percent.
    premium_uplift: 'The premium cabin share adds a premium uplift: at or above the high premium share it adds the
      high premium uplift, at or above the middle premium share but below the high one it adds the middle premium
      uplift, and below the middle premium share it adds nothing.'
    milestone_segments: 'The segments credited in the current agreement year, counted as the points accrual entries
      dated fewer whole calendar months before the credit date than the milestone pace plus one, add a segment uplift:
      at or above the high segment count the high segment uplift, at or above the middle segment count but below
      the high one the middle segment uplift, and below the middle segment count nothing.'
    segment_uplift: 'The segments credited in the current agreement year, counted as the points accrual entries
      dated fewer whole calendar months before the credit date than the milestone pace plus one, add a segment uplift:
      at or above the high segment count the high segment uplift, at or above the middle segment count but below
      the high one the middle segment uplift, and below the middle segment count nothing.'
    momentum_spend: The milestone momentum is the spend entries posted in the momentum window up to and including
      the credit date as a percentage of the milestone year spend.
    momentum_share_percent: The milestone momentum is the spend entries posted in the momentum window up to and
      including the credit date as a percentage of the milestone year spend.
    momentum_uplift: 'The milestone momentum adds a momentum uplift: at or above the high momentum share it adds
      the high momentum uplift, at or above the middle momentum share but below the high one it adds the middle
      momentum uplift, and below the middle momentum share it adds nothing.'
    milestone_before_allowance: The milestone bonus before its allowance is the standard milestone bonus times one
      hundred plus the pace, premium, segment and momentum uplifts, divided by one hundred, rounded down to the
      whole point.
    milestone_redeemed: 'Points redeemed from the agreement in its current agreement year, counted as the redemption
      entries dated fewer whole calendar months before the credit date than the milestone pace plus one, add a redemption
      allowance: at or above the high redemption points the high redemption allowance, at least one point but below
      the high redemption points the low redemption allowance, and none redeemed nothing.'
    redemption_allowance: 'Points redeemed from the agreement in its current agreement year, counted as the redemption
      entries dated fewer whole calendar months before the credit date than the milestone pace plus one, add a redemption
      allowance: at or above the high redemption points the high redemption allowance, at least one point but below
      the high redemption points the low redemption allowance, and none redeemed nothing.'
    milestone_with_allowance: The milestone bonus with its allowance is the milestone bonus before its allowance
      plus the redemption allowance.
    milestone_year_order: 'The agreement year''s order decides how the milestone bonus with its allowance is credited:
      in the first agreement year it is multiplied by the first-year multiplier and rounded down to the next lower
      first-year step, in the second agreement year it is multiplied by the second-year multiplier and rounded up
      to the next second-year step, and in any later agreement year it is credited as it stands.'
    milestone_settled: 'The agreement year''s order decides how the milestone bonus with its allowance is credited:
      in the first agreement year it is multiplied by the first-year multiplier and rounded down to the next lower
      first-year step, in the second agreement year it is multiplied by the second-year multiplier and rounded up
      to the next second-year step, and in any later agreement year it is credited as it stands.'
    result: The milestone bonus credited is the bonus so settled when the milestone year spend has reached the tier's
      spend milestone, and nothing when it has not.
  factors:
  - id: milestone_pace
    effect: parameter
    decides: pace_uplift
    bindings:
    - milestone_pace_months
    - pace_uplift
    ladder:
    - when: the current agreement year has run no more than the fast-pace months
      value: K('fast_pace_uplift')
    - when: it has run more than the fast-pace months but no more than the steady-pace months
      value: K('steady_pace_uplift')
    - when: otherwise (a later point in the agreement year)
      value: '0'
    baseline:
      pace_uplift: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: premium_cabin_share
    effect: parameter
    decides: premium_uplift
    bindings:
    - premium_first_coupons
    - premium_pe_coupons
    - premium_all_coupons
    - premium_share_percent
    - premium_uplift
    ladder:
    - when: First and Premium Economy coupons at or above the high premium share of all flown coupons in the premium-share
        window
      value: K('high_premium_uplift')
    - when: that share at or above the middle premium share but below the high one
      value: K('middle_premium_uplift')
    - when: otherwise (below the middle premium share)
      value: '0'
    baseline:
      premium_uplift: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: ticket
  - id: milestone_segments
    effect: parameter
    decides: segment_uplift
    bindings:
    - milestone_segments
    - segment_uplift
    ladder:
    - when: points accrual entries in the current agreement year at or above the high segment count
      value: K('high_segment_uplift')
    - when: that count at or above the middle segment count but below the high one
      value: K('middle_segment_uplift')
    - when: otherwise (below the middle segment count)
      value: '0'
    baseline:
      segment_uplift: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: milestone_momentum
    effect: parameter
    decides: momentum_uplift
    bindings:
    - momentum_spend
    - momentum_share_percent
    - momentum_uplift
    ladder:
    - when: spend posted in the momentum window at or above the high momentum share of the milestone year spend
      value: K('high_momentum_uplift')
    - when: that share at or above the middle momentum share but below the high one
      value: K('middle_momentum_uplift')
    - when: otherwise (below the middle momentum share)
      value: '0'
    baseline:
      momentum_uplift: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: milestone_redemption_allowance
    effect: parameter
    decides: redemption_allowance
    bindings:
    - milestone_redeemed
    - redemption_allowance
    ladder:
    - when: points redeemed in the current agreement year at or above the high redemption points
      value: K('high_redemption_allowance')
    - when: at least one point but below the high redemption points redeemed
      value: K('low_redemption_allowance')
    - when: otherwise (nothing redeemed)
      value: '0'
    baseline:
      redemption_allowance: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: agreement_year_settlement
    effect: method
    decides: milestone_settled
    bindings:
    - milestone_year_order
    - milestone_settled
    ladder:
    - when: the milestone belongs to the agreement's first agreement year
      method: the bonus with its allowance is multiplied by the first-year multiplier and rounded down to the next
        lower first-year step
    - when: it belongs to the second agreement year
      method: the bonus with its allowance is multiplied by the second-year multiplier and rounded up to the next
        second-year step
    - when: otherwise (a later agreement year)
      method: the bonus with its allowance is credited as it stands
    baseline:
      milestone_settled: milestone_with_allowance
    evidence:
    - date
    cross_difficulty: null
  baseline:
    rule: The spend-milestone bonus is credited once for an agreement year whose spend has reached the tier's spend
      milestone, as one bonus entry tied to the first day of that agreement year, and an agreement year whose spend
      has not reached the milestone earns no milestone bonus. The milestone year spend is the total of the spend
      entries posted to the agreement less the spend removed by its agreement-year reset entries. The standard milestone
      bonus is the tier's spend-milestone bonus points, credited as they stand.
    params:
    - spend_milestone_bonus_points
    - spend_milestone_usd
  inputs:
    history:
    - table: business_activity
      aggregate: sum
      field: spend_usd
      filters:
        event_type: business_spend_post
    - table: business_activity
      aggregate: sum
      field: spend_usd
      filters:
        event_type: business_spend_reset
    - table: business_activity
      aggregate: count
      field: business_activity_id
      filters:
        event_type: business_points_accrual
    - table: business_activity
      aggregate: sum
      field: spend_usd
      within_months: 3
      filters:
        event_type: business_spend_post
    - table: business_activity
      aggregate: sum
      field: points
      filters:
        event_type: business_points_redemption
    - category: ticket
      table: ticket_transactions
      aggregate: count
      field: transaction_id
      within_months: 12
      filters:
        event_type: ticket_coupon_flown
    cross_category:
    - ticket
- id: business_ext_domestic_award_price
  base_policy_refs:
  - business_points_redemptions
  overwrite:
  - base_policy: business_points_redemptions
    superseded_clause: Award tickets cost award_points_domestic_main_round_trip
    replaced_by: The points redeemed for the domestic award are the domestic award price so charged.
  trigger: on_request
  subject:
  - business_points_redemption
  computes: points
  target_tool: redeem_domestic_award_ffdd59aa
  params:
    award_earning_window_months: 12
    high_award_earning_points: 120000
    middle_award_earning_points: 60000
    high_award_earning_percent: 88
    middle_award_earning_percent: 94
    listed_price_percent: 100
    award_coupon_window_months: 12
    high_award_coupon_count: 30
    middle_award_coupon_count: 15
    high_award_coupon_percent: 92
    middle_award_coupon_percent: 96
    months_per_agreement_year: 12
    frequent_award_count: 3
    frequent_award_percent: 110
    returning_award_percent: 105
    award_approach_share_percent: 80
    milestone_reached_percent: 95
    milestone_approach_percent: 98
    long_award_gap_days: 120
    short_award_gap_days: 60
    long_award_gap_percent: 97
    short_award_gap_percent: 99
    rich_balance_multiple: 50
    ample_balance_multiple: 10
    rich_balance_share_percent: 90
    award_step_points: 50
    ample_balance_reduction: 100
  rule: 'A domestic Crestline Main Cabin round-trip award is redeemed from company points at the request of the
    travel manager or a travel arranger on the roster, for a traveler on the active roster on the redemption date,
    as one award-ticket redemption entry naming that traveler. The standard domestic award price is the tier''s
    domestic Main Cabin round-trip award points, charged as listed. A domestic Main Cabin round-trip award is not
    priced until the points account carries the spend-milestone bonus of every agreement year whose spend has reached
    the tier''s spend milestone. A domestic Main Cabin round-trip award is priced only after the points account
    carries the enrollment bonus once the agreement''s flown spend since approval has reached the tier''s enrollment-bonus
    spend. The award earning measure is the points of every points accrual entry and every bonus entry posted to
    the agreement in the award earning window up to and including the redemption date. The award earning measure
    sets the award earning percentage: at or above the high award-earning points it is the high award-earning percentage,
    at or above the middle award-earning points but below the high ones it is the middle award-earning percentage,
    and below them it is the listed-price percentage. Flown coupons on the company''s tickets, by flight date, in
    the award coupon window set the award coupon percentage: at or above the high award coupon count it is the high
    award coupon percentage, at or above the middle award coupon count but below the high one it is the middle award
    coupon percentage, and below it the listed-price percentage. Award tickets already redeemed on the agreement
    in its current agreement year, counted as the award-ticket redemption entries dated fewer whole calendar months
    before the redemption date than the whole months that agreement year has run plus one, set the award repeat
    percentage: at least the frequent-award count sets the frequent-award percentage, at least one but fewer than
    the frequent-award count sets the returning-award percentage, and none sets the listed-price percentage. The
    award milestone percentage follows the current agreement year''s spend, taken as every spend entry less every
    reset entry: a spend that has reached the tier''s spend milestone sets the milestone-reached percentage, a spend
    at or above the award approach share of the milestone but below it sets the milestone-approach percentage, and
    a lower spend sets the listed-price percentage. The days from the latest points redemption on the agreement
    to the redemption date set the award recency percentage: at least the long award-gap days set the long award-gap
    percentage, at least the short award-gap days but fewer than the long ones set the short award-gap percentage,
    and fewer days, or no earlier redemption on file, set the listed-price percentage. The adjusted domestic award
    price is the standard domestic award price multiplied by the award earning, coupon, repeat, milestone and recency
    percentages, each divided by one hundred, all five applied together to the standard price and rounded to the
    nearest whole point once. The award points balance is read from the agreement''s points entries as every accrual
    and bonus less every redemption and expiry. The award points balance decides how the adjusted domestic award
    price is charged: a balance of at least the rich-balance multiple of the standard domestic award price takes
    the rich-balance share of the adjusted price rounded down to the next lower award step, a balance of at least
    the ample-balance multiple but below the rich-balance multiple takes the ample-balance reduction off the adjusted
    price, and a smaller balance pays the adjusted price as it stands. The points redeemed for the domestic award
    are the domestic award price so charged.'
  prerequisite:
  - problem: business_ext_spend_milestone_bonus
    kind: value_input
    gate: award_earned_points
    form: state
    policy_source: A domestic Main Cabin round-trip award is not priced until the points account carries the spend-milestone
      bonus of every agreement year whose spend has reached the tier's spend milestone.
    condition: For every agreement year whose spend (spend_post less resets) has reached spend_milestone_usd, business_activity
      carries a business_bonus_points entry with bonus_reason spend_milestone for that agreement_year_start.
    resolved_by: credit_milestone_bonus_a908f78d
    effect: Once the milestone bonus entry is posted, the award earning measure rises by the bonus points, which
      can move the award earning percentage to a lower-priced tier.
  - problem: business_ext_enrollment_bonus_late_credit
    kind: value_input
    gate: award_earned_points
    form: state
    policy_source: A domestic Main Cabin round-trip award is priced only after the points account carries the enrollment
      bonus once the agreement's flown spend since approval has reached the tier's enrollment-bonus spend.
    condition: When the spend_post total since approval has reached enrollment_bonus_min_flown_spend_usd, business_activity
      carries a business_bonus_points entry with bonus_reason enrollment_bonus.
    resolved_by: credit_enrollment_bonus_fc1a1a80
    effect: Once the enrollment bonus entry is posted, the award earning measure rises by the bonus points, which
      can move the award earning percentage to a lower-priced tier.
  cross_category:
  - category: ticket
    as: history
    reads:
    - ticket_transactions.event_type
    - ticket_transactions.flight_date
    note: The award coupon percentage is decided from the flown coupons on the company's tickets.
  compute:
  - award_accrued: SUM('business_activity','points', within_months=K('award_earning_window_months'), date_field='activity_date',
      event_type='business_points_accrual')
  - award_bonus: SUM('business_activity','points', within_months=K('award_earning_window_months'), date_field='activity_date',
      event_type='business_bonus_points')
  - award_earned_points: award_accrued + award_bonus
  - award_earning_percent: K('high_award_earning_percent') if award_earned_points >= K('high_award_earning_points')
      else (K('middle_award_earning_percent') if award_earned_points >= K('middle_award_earning_points') else K('listed_price_percent'))
  - award_coupons: XCOUNT('ticket','ticket_transactions', within_months=K('award_coupon_window_months'), date_field='flight_date',
      event_type='ticket_coupon_flown')
  - award_coupon_percent: K('high_award_coupon_percent') if award_coupons >= K('high_award_coupon_count') else (K('middle_award_coupon_percent')
      if award_coupons >= K('middle_award_coupon_count') else K('listed_price_percent'))
  - award_year_months: MONTHS(F('approved_date'), NOW) % K('months_per_agreement_year') + 1
  - award_tickets_this_year: COUNT('business_activity', within_months=award_year_months, date_field='activity_date',
      event_type='business_points_redemption', redemption_type='award_ticket')
  - award_repeat_percent: K('frequent_award_percent') if award_tickets_this_year >= K('frequent_award_count') else
      (K('returning_award_percent') if award_tickets_this_year >= 1 else K('listed_price_percent'))
  - award_year_spend: SUM('business_activity','spend_usd', event_type='business_spend_post') - SUM('business_activity','spend_usd',
      event_type='business_spend_reset')
  - award_milestone_percent: K('milestone_reached_percent') if award_year_spend >= P('spend_milestone_usd') else
      (K('milestone_approach_percent') if award_year_spend * 100 / P('spend_milestone_usd') >= K('award_approach_share_percent')
      else K('listed_price_percent'))
  - award_last_redemption: LATEST('business_activity','activity_date', date_field='activity_date', event_type='business_points_redemption')
  - award_gap_days: DAYS(award_last_redemption, NOW) if award_last_redemption else 0
  - award_recency_percent: K('long_award_gap_percent') if award_gap_days >= K('long_award_gap_days') else (K('short_award_gap_percent')
      if award_gap_days >= K('short_award_gap_days') else K('listed_price_percent'))
  - award_price_adjusted: int(RND(P('award_points_domestic_main_round_trip') * award_earning_percent / 100 * award_coupon_percent
      / 100 * award_repeat_percent / 100 * award_milestone_percent / 100 * award_recency_percent / 100, 0))
  - award_balance: SUM('business_activity','points', event_type='business_points_accrual') + SUM('business_activity','points',
      event_type='business_bonus_points') - SUM('business_activity','points', event_type='business_points_redemption')
      - SUM('business_activity','points', event_type='business_points_expiry')
  - award_price_charged: int((award_price_adjusted * K('rich_balance_share_percent') / 100) // K('award_step_points')
      * K('award_step_points')) if award_balance >= K('rich_balance_multiple') * P('award_points_domestic_main_round_trip')
      else (award_price_adjusted - K('ample_balance_reduction') if award_balance >= K('ample_balance_multiple')
      * P('award_points_domestic_main_round_trip') else award_price_adjusted)
  - result: award_price_charged
  compute_basis:
    award_accrued: The award earning measure is the points of every points accrual entry and every bonus entry posted
      to the agreement in the award earning window up to and including the redemption date.
    award_bonus: The award earning measure is the points of every points accrual entry and every bonus entry posted
      to the agreement in the award earning window up to and including the redemption date.
    award_earned_points: The award earning measure is the points of every points accrual entry and every bonus entry
      posted to the agreement in the award earning window up to and including the redemption date.
    award_earning_percent: 'The award earning measure sets the award earning percentage: at or above the high award-earning
      points it is the high award-earning percentage, at or above the middle award-earning points but below the
      high ones it is the middle award-earning percentage, and below them it is the listed-price percentage.'
    award_coupons: 'Flown coupons on the company''s tickets, by flight date, in the award coupon window set the
      award coupon percentage: at or above the high award coupon count it is the high award coupon percentage, at
      or above the middle award coupon count but below the high one it is the middle award coupon percentage, and
      below it the listed-price percentage.'
    award_coupon_percent: 'Flown coupons on the company''s tickets, by flight date, in the award coupon window set
      the award coupon percentage: at or above the high award coupon count it is the high award coupon percentage,
      at or above the middle award coupon count but below the high one it is the middle award coupon percentage,
      and below it the listed-price percentage.'
    award_year_months: 'Award tickets already redeemed on the agreement in its current agreement year, counted as
      the award-ticket redemption entries dated fewer whole calendar months before the redemption date than the
      whole months that agreement year has run plus one, set the award repeat percentage: at least the frequent-award
      count sets the frequent-award percentage, at least one but fewer than the frequent-award count sets the returning-award
      percentage, and none sets the listed-price percentage.'
    award_tickets_this_year: 'Award tickets already redeemed on the agreement in its current agreement year, counted
      as the award-ticket redemption entries dated fewer whole calendar months before the redemption date than the
      whole months that agreement year has run plus one, set the award repeat percentage: at least the frequent-award
      count sets the frequent-award percentage, at least one but fewer than the frequent-award count sets the returning-award
      percentage, and none sets the listed-price percentage.'
    award_repeat_percent: 'Award tickets already redeemed on the agreement in its current agreement year, counted
      as the award-ticket redemption entries dated fewer whole calendar months before the redemption date than the
      whole months that agreement year has run plus one, set the award repeat percentage: at least the frequent-award
      count sets the frequent-award percentage, at least one but fewer than the frequent-award count sets the returning-award
      percentage, and none sets the listed-price percentage.'
    award_year_spend: 'The award milestone percentage follows the current agreement year''s spend, taken as every
      spend entry less every reset entry: a spend that has reached the tier''s spend milestone sets the milestone-reached
      percentage, a spend at or above the award approach share of the milestone but below it sets the milestone-approach
      percentage, and a lower spend sets the listed-price percentage.'
    award_milestone_percent: 'The award milestone percentage follows the current agreement year''s spend, taken
      as every spend entry less every reset entry: a spend that has reached the tier''s spend milestone sets the
      milestone-reached percentage, a spend at or above the award approach share of the milestone but below it sets
      the milestone-approach percentage, and a lower spend sets the listed-price percentage.'
    award_last_redemption: 'The days from the latest points redemption on the agreement to the redemption date set
      the award recency percentage: at least the long award-gap days set the long award-gap percentage, at least
      the short award-gap days but fewer than the long ones set the short award-gap percentage, and fewer days,
      or no earlier redemption on file, set the listed-price percentage.'
    award_gap_days: 'The days from the latest points redemption on the agreement to the redemption date set the
      award recency percentage: at least the long award-gap days set the long award-gap percentage, at least the
      short award-gap days but fewer than the long ones set the short award-gap percentage, and fewer days, or no
      earlier redemption on file, set the listed-price percentage.'
    award_recency_percent: 'The days from the latest points redemption on the agreement to the redemption date set
      the award recency percentage: at least the long award-gap days set the long award-gap percentage, at least
      the short award-gap days but fewer than the long ones set the short award-gap percentage, and fewer days,
      or no earlier redemption on file, set the listed-price percentage.'
    award_price_adjusted: The adjusted domestic award price is the standard domestic award price multiplied by the
      award earning, coupon, repeat, milestone and recency percentages, each divided by one hundred, all five applied
      together to the standard price and rounded to the nearest whole point once.
    award_balance: The award points balance is read from the agreement's points entries as every accrual and bonus
      less every redemption and expiry.
    award_price_charged: 'The award points balance decides how the adjusted domestic award price is charged: a balance
      of at least the rich-balance multiple of the standard domestic award price takes the rich-balance share of
      the adjusted price rounded down to the next lower award step, a balance of at least the ample-balance multiple
      but below the rich-balance multiple takes the ample-balance reduction off the adjusted price, and a smaller
      balance pays the adjusted price as it stands.'
    result: The points redeemed for the domestic award are the domestic award price so charged.
  factors:
  - id: award_earning
    effect: parameter
    decides: award_earning_percent
    bindings:
    - award_accrued
    - award_bonus
    - award_earned_points
    - award_earning_percent
    ladder:
    - when: points accrued and bonus points posted in the award earning window at or above the high award-earning
        points
      value: K('high_award_earning_percent')
    - when: those points at or above the middle award-earning points but below the high ones
      value: K('middle_award_earning_percent')
    - when: otherwise (below the middle award-earning points)
      value: K('listed_price_percent')
    baseline:
      award_earning_percent: K('listed_price_percent')
    evidence:
    - history
    cross_difficulty: null
  - id: award_coupons
    effect: parameter
    decides: award_coupon_percent
    bindings:
    - award_coupons
    - award_coupon_percent
    ladder:
    - when: flown coupons on the company's tickets in the award coupon window at or above the high award coupon
        count
      value: K('high_award_coupon_percent')
    - when: that count at or above the middle award coupon count but below the high one
      value: K('middle_award_coupon_percent')
    - when: otherwise (below the middle award coupon count)
      value: K('listed_price_percent')
    baseline:
      award_coupon_percent: K('listed_price_percent')
    evidence:
    - cross_category
    - history
    cross_difficulty: ticket
  - id: award_repeat
    effect: parameter
    decides: award_repeat_percent
    bindings:
    - award_year_months
    - award_tickets_this_year
    - award_repeat_percent
    ladder:
    - when: at least the frequent-award count of award tickets redeemed in the current agreement year
      value: K('frequent_award_percent')
    - when: at least one but fewer than the frequent-award count
      value: K('returning_award_percent')
    - when: otherwise (none redeemed)
      value: K('listed_price_percent')
    baseline:
      award_repeat_percent: K('listed_price_percent')
    evidence:
    - history
    cross_difficulty: null
  - id: award_milestone
    effect: parameter
    decides: award_milestone_percent
    bindings:
    - award_year_spend
    - award_milestone_percent
    ladder:
    - when: the current agreement year's spend has reached the tier's spend milestone
      value: K('milestone_reached_percent')
    - when: that spend is at or above the award approach share of the milestone but below it
      value: K('milestone_approach_percent')
    - when: otherwise (a lower spend)
      value: K('listed_price_percent')
    baseline:
      award_milestone_percent: K('listed_price_percent')
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: award_recency
    effect: parameter
    decides: award_recency_percent
    bindings:
    - award_last_redemption
    - award_gap_days
    - award_recency_percent
    ladder:
    - when: the latest points redemption on the agreement is at least the long award-gap days before the redemption
        date
      value: K('long_award_gap_percent')
    - when: at least the short award-gap days but fewer than the long ones
      value: K('short_award_gap_percent')
    - when: otherwise (fewer days, or no redemption on file)
      value: K('listed_price_percent')
    baseline:
      award_recency_percent: K('listed_price_percent')
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: award_balance_charge
    effect: method
    decides: award_price_charged
    bindings:
    - award_balance
    - award_price_charged
    ladder:
    - when: the award points balance is at least the rich-balance multiple of the standard domestic award price
      method: the rich-balance share of the adjusted price, rounded down to the next lower award step
    - when: the balance is at least the ample-balance multiple but below the rich-balance multiple
      method: the ample-balance reduction taken off the adjusted price
    - when: otherwise (a smaller balance)
      method: the adjusted price as it stands
    baseline:
      award_price_charged: award_price_adjusted
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: A domestic Crestline Main Cabin round-trip award is redeemed from company points at the request of the
      travel manager or a travel arranger on the roster, for a traveler on the active roster on the redemption date,
      as one award-ticket redemption entry naming that traveler. The standard domestic award price is the tier's
      domestic Main Cabin round-trip award points, charged as listed.
    params:
    - award_points_domestic_main_round_trip
  inputs:
    history:
    - table: business_activity
      aggregate: sum
      field: points
      within_months: 12
      filters:
        event_type: business_points_accrual
    - table: business_activity
      aggregate: sum
      field: points
      within_months: 12
      filters:
        event_type: business_bonus_points
    - table: business_activity
      aggregate: count
      field: business_activity_id
      filters:
        event_type: business_points_redemption
        redemption_type: award_ticket
    - table: business_activity
      aggregate: sum
      field: spend_usd
      filters:
        event_type: business_spend_post
    - table: business_activity
      aggregate: latest
      field: activity_date
      filters:
        event_type: business_points_redemption
    - category: ticket
      table: ticket_transactions
      aggregate: count
      field: transaction_id
      within_months: 12
      filters:
        event_type: ticket_coupon_flown
    cross_category:
    - ticket
