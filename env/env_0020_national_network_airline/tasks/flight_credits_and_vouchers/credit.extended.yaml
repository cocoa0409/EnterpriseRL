- id: credit_corporate_origin
  subject:
  - credit_redemption
  rule: When corporate_origin_redemption_restricted is true, a credit whose source ticket carries a corporate_account_id
    may pay only for a ticket booked under that same corporate agreement, because the company paid the original
    fare; while that agreement is active the credit cannot be used for personal travel. A restricted credit is redeemed
    only on a new ticket whose corporate_account_id equals the source ticket's corporate_account_id. When the agreement
    tier's credit_pooling_across_travelers in the business charter is true, such a credit may also pay for another
    active roster traveler's ticket under the same agreement, overriding a named_traveler_only beneficiary_scope
    for that purpose only. When the agreement is terminated the restriction lapses and the credit may be used by
    the named traveler for any booking allowed by its beneficiary_scope. Credits from tickets not booked under a
    corporate agreement, and instruments whose corporate_origin_redemption_restricted is false, carry no such restriction.
  eligibility:
  - id: same_agreement
    applies_to:
    - credit_redemption
    kind: authorization
    condition: A restricted credit is redeemed only on a new ticket whose corporate_account_id equals the source
      ticket's corporate_account_id.
    evidence_fields:
    - ticket_holdings.ticket_id
    - ticket_holdings.corporate_account_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - ticket_holdings.ticket_id
      action_bindings:
        ticket_holdings.ticket_id: source_ticket_id
