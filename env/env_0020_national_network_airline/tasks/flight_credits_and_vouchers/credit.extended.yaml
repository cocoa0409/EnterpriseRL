- id: credit_ext_extension_fee
  base_policy_refs: [credit_redemption_rules, credit_extension, credit_reinstatement]
  overwrite:
  - base_policy: credit_extension
    superseded_clause: >-
      The extension_fee is charged as a separate fee entry at the time of the extension
    replaced_by: >-
      The extension fee is worked out in this order: first the extension-fee basis is set from the credit's remaining
      value; then the extension-fee fee-count rate, member rate, source-fare rate and cardmember rate are multiplied
      with one another into one combined rate; then the basis is multiplied once by that combined rate, and only that
      product is rounded to the nearest cent.
  trigger: on_request
  subject: [credit_service_fee]
  computes: fee_amount
  target_tool: pay_credit_extension_fee_5a6cc7fd
  params:
    fee_window_months: 12
    many_fee_entries: 2
    many_fee_rate: 0.60
    one_fee_rate: 0.80
    small_balance_usd: 150
    mid_balance_usd: 400
    small_balance_percent: 40
    mid_balance_percent: 30
    gold_qualifier_rate: 0.70
    silver_qualifier_rate: 0.85
    refundable_brand_rate: 0.70
    upper_brand_rate: 0.85
    pass_holder_rate: 0.80
    cobrand_certificate_rate: 0.90
  rule: >-
    The extension fee is charged to the holder as a separate fee entry on the credit, and it is waived when the
    customer's Summit tier has credit_service_fees_waived set to true in the loyalty charter; a waived fee is not
    recorded. The extension fee is not worked out until every call-center redemption on the credit that owes a
    telephone fee carries its own linked telephone fee entry. The standard extension fee is the instrument's
    extension_fee, charged as one flat amount in US dollars to the cent. The extension fee is worked out in this
    order: first the extension-fee basis is set from the credit's remaining value; then the extension-fee fee-count
    rate, member rate, source-fare rate and cardmember rate are multiplied with one another into one combined rate;
    then the basis is multiplied once by that combined rate, and only that product is rounded to the nearest cent.
    The credit's remaining value for the extension fee is the value its ledger shows: loads, reversals and restores
    less redemptions, forfeited remainders, expiry write-offs and refund payouts. The extension-fee basis is
    small_balance_percent percent of the remaining value when the remaining value is below small_balance_usd, the
    lesser of the instrument's extension_fee and mid_balance_percent percent of the remaining value when it is at
    least small_balance_usd but below mid_balance_usd, and the instrument's extension_fee when it is at least
    mid_balance_usd. An extension-fee window of the last so many calendar months holds the entries dated fewer than that many whole calendar months before the date the extension fee is worked out, so it rolls back from that date and is not a count of completed calendar months. The extension-fee fee-count rate counts the service-fee entries booked on the credit in the last
    fee_window_months calendar months, and is many_fee_rate for at least many_fee_entries such entries, one_fee_rate
    for exactly one, and 1 for none. The extension-fee member rate is gold_qualifier_rate for a Summit Gold member
    whose qualifying dollars this year have reached the qualifying_dollars_threshold of Summit Gold in the loyalty
    charter, silver_qualifier_rate for a Summit Silver member whose qualifying dollars this year have reached the
    qualifying_dollars_threshold of Summit Silver, and 1 for every other customer. The extension-fee source-fare
    rate is refundable_brand_rate when the ticket the credit arose from was sold as Crestline Main Flexible or
    Crestline First, upper_brand_rate when it was sold as Crestline Main Plus or Crestline Premium Economy, and 1 for
    any other fare brand. The extension-fee cardmember rate is pass_holder_rate for a customer holding an active
    Crestline Companion Pass Semiannual or Crestline Companion Pass Annual, cobrand_certificate_rate for a customer
    holding no active companion pass but an active companion certificate issued as the co-branded card anniversary
    benefit, and 1 for every other customer.
  baseline:
    rule: >-
      The standard extension fee is the instrument's extension_fee, charged as one flat amount in US dollars to the
      cent.
    params: [extension_fee]
  prerequisite:
  - problem: credit_ext_telephone_fee
    kind: value_input
    gate: xf_recent_fee_entries
    form: state
    policy_source: >-
      The extension fee is not worked out until every call-center redemption on the credit that owes a telephone fee
      carries its own linked telephone fee entry.
    condition: >-
      The call-center redemption that owes a telephone fee under the telephone-fee rule - the latest credit_redemption
      entry on the credit with redemption_channel call_center, on an instrument whose online_redemption_permitted is
      true and for a customer whose Summit tier does not waive credit service fees - has a credit_service_fee entry of
      fee_type phone_redemption_fee whose related_entry_id points at it.
    resolved_by: charge_credit_phone_fee_f43f310b
    effect: >-
      xf_recent_fee_entries rises by the newly booked telephone fee entry, which moves the extension-fee fee-count
      rate to its next tier and so changes the fee.
  cross_category:
  - category: loyalty
    as: branch
    reads: [variant_name, qualifying_dollars_ytd, qualifying_dollars_threshold, credit_service_fees_waived]
    note: The extension-fee member rate reads the Summit tier, qualifying dollars and tier threshold; the fee waiver is read from the tier.
  - category: ticket
    as: branch
    reads: [variant_name]
    note: The extension-fee source-fare rate reads the fare brand of the ticket the credit arose from.
  - category: companion
    as: branch
    reads: [variant_name, issue_source, status]
    note: The extension-fee cardmember rate reads the customer's active companion pass or co-branded card companion certificate.
  compute:
  - xf_fee_waived: "CPARAM('loyalty','credit_service_fees_waived')"
  - xf_remaining_value: "SUM('credit_ledger','amount', event_type='credit_value_load') + SUM('credit_ledger','amount', event_type='credit_redemption_reversal') + SUM('credit_ledger','amount', event_type='credit_reinstatement_restore') - SUM('credit_ledger','amount', event_type='credit_redemption') - SUM('credit_ledger','amount', event_type='credit_balance_forfeit') - SUM('credit_ledger','amount', event_type='credit_expiry_writeoff') - SUM('credit_ledger','amount', event_type='credit_refund_payout')"
  - xf_fee_basis: "(xf_remaining_value * K('small_balance_percent') / 100) if xf_remaining_value < K('small_balance_usd') else (MN(P('extension_fee'), xf_remaining_value * K('mid_balance_percent') / 100) if xf_remaining_value < K('mid_balance_usd') else P('extension_fee'))"
  - xf_recent_fee_entries: "COUNT('credit_ledger', within_months=K('fee_window_months'), date_field='entry_date', event_type='credit_service_fee')"
  - xf_fee_count_rate: "K('many_fee_rate') if xf_recent_fee_entries >= K('many_fee_entries') else (K('one_fee_rate') if xf_recent_fee_entries == 1 else 1.0)"
  - xf_member_tier: "CFIELD('loyalty','variant_name')"
  - xf_qualifying_dollars: "CFIELD('loyalty','qualifying_dollars_ytd')"
  - xf_qualifying_threshold: "CPARAM('loyalty','qualifying_dollars_threshold')"
  - xf_member_rate: "K('gold_qualifier_rate') if (xf_member_tier == 'Summit Gold' and xf_qualifying_dollars >= xf_qualifying_threshold) else (K('silver_qualifier_rate') if (xf_member_tier == 'Summit Silver' and xf_qualifying_dollars >= xf_qualifying_threshold) else 1.0)"
  - xf_source_brand: "CFIELD('ticket','variant_name', ticket_id=F('source_ticket_id'))"
  - xf_brand_rate: "K('refundable_brand_rate') if (xf_source_brand == 'Crestline Main Flexible' or xf_source_brand == 'Crestline First') else (K('upper_brand_rate') if (xf_source_brand == 'Crestline Main Plus' or xf_source_brand == 'Crestline Premium Economy') else 1.0)"
  - xf_holds_pass: "EXISTS('companion', variant_name='Crestline Companion Pass Semiannual', status='active') or EXISTS('companion', variant_name='Crestline Companion Pass Annual', status='active')"
  - xf_holds_cobrand_certificate: "EXISTS('companion', issue_source='cobrand_card_anniversary', status='active')"
  - xf_cardmember_rate: "K('pass_holder_rate') if xf_holds_pass else (K('cobrand_certificate_rate') if xf_holds_cobrand_certificate else 1.0)"
  - xf_combined_rate: "xf_fee_count_rate * xf_member_rate * xf_brand_rate * xf_cardmember_rate"
  - result: "0.0 if xf_fee_waived else RND(xf_fee_basis * xf_combined_rate, 2)"
  compute_basis:
    xf_fee_waived: "The extension fee is charged to the holder as a separate fee entry on the credit, and it is waived when the customer's Summit tier has credit_service_fees_waived set to true in the loyalty charter; a waived fee is not recorded."
    xf_remaining_value: "The credit's remaining value for the extension fee is the value its ledger shows: loads, reversals and restores less redemptions, forfeited remainders, expiry write-offs and refund payouts."
    xf_fee_basis: "The extension-fee basis is small_balance_percent percent of the remaining value when the remaining value is below small_balance_usd, the lesser of the instrument's extension_fee and mid_balance_percent percent of the remaining value when it is at least small_balance_usd but below mid_balance_usd, and the instrument's extension_fee when it is at least mid_balance_usd."
    xf_recent_fee_entries: "An extension-fee window of the last so many calendar months holds the entries dated fewer than that many whole calendar months before the date the extension fee is worked out, so it rolls back from that date and is not a count of completed calendar months."
    xf_fee_count_rate: "The extension-fee fee-count rate counts the service-fee entries booked on the credit in the last fee_window_months calendar months, and is many_fee_rate for at least many_fee_entries such entries, one_fee_rate for exactly one, and 1 for none."
    xf_member_tier: "The extension-fee member rate is gold_qualifier_rate for a Summit Gold member whose qualifying dollars this year have reached the qualifying_dollars_threshold of Summit Gold in the loyalty charter, silver_qualifier_rate for a Summit Silver member whose qualifying dollars this year have reached the qualifying_dollars_threshold of Summit Silver, and 1 for every other customer."
    xf_qualifying_dollars: "The extension-fee member rate is gold_qualifier_rate for a Summit Gold member whose qualifying dollars this year have reached the qualifying_dollars_threshold of Summit Gold in the loyalty charter, silver_qualifier_rate for a Summit Silver member whose qualifying dollars this year have reached the qualifying_dollars_threshold of Summit Silver, and 1 for every other customer."
    xf_qualifying_threshold: "The extension-fee member rate is gold_qualifier_rate for a Summit Gold member whose qualifying dollars this year have reached the qualifying_dollars_threshold of Summit Gold in the loyalty charter, silver_qualifier_rate for a Summit Silver member whose qualifying dollars this year have reached the qualifying_dollars_threshold of Summit Silver, and 1 for every other customer."
    xf_member_rate: "The extension-fee member rate is gold_qualifier_rate for a Summit Gold member whose qualifying dollars this year have reached the qualifying_dollars_threshold of Summit Gold in the loyalty charter, silver_qualifier_rate for a Summit Silver member whose qualifying dollars this year have reached the qualifying_dollars_threshold of Summit Silver, and 1 for every other customer."
    xf_source_brand: "The extension-fee source-fare rate is refundable_brand_rate when the ticket the credit arose from was sold as Crestline Main Flexible or Crestline First, upper_brand_rate when it was sold as Crestline Main Plus or Crestline Premium Economy, and 1 for any other fare brand."
    xf_brand_rate: "The extension-fee source-fare rate is refundable_brand_rate when the ticket the credit arose from was sold as Crestline Main Flexible or Crestline First, upper_brand_rate when it was sold as Crestline Main Plus or Crestline Premium Economy, and 1 for any other fare brand."
    xf_holds_pass: "The extension-fee cardmember rate is pass_holder_rate for a customer holding an active Crestline Companion Pass Semiannual or Crestline Companion Pass Annual, cobrand_certificate_rate for a customer holding no active companion pass but an active companion certificate issued as the co-branded card anniversary benefit, and 1 for every other customer."
    xf_holds_cobrand_certificate: "The extension-fee cardmember rate is pass_holder_rate for a customer holding an active Crestline Companion Pass Semiannual or Crestline Companion Pass Annual, cobrand_certificate_rate for a customer holding no active companion pass but an active companion certificate issued as the co-branded card anniversary benefit, and 1 for every other customer."
    xf_cardmember_rate: "The extension-fee cardmember rate is pass_holder_rate for a customer holding an active Crestline Companion Pass Semiannual or Crestline Companion Pass Annual, cobrand_certificate_rate for a customer holding no active companion pass but an active companion certificate issued as the co-branded card anniversary benefit, and 1 for every other customer."
    xf_combined_rate: "The extension fee is worked out in this order: first the extension-fee basis is set from the credit's remaining value; then the extension-fee fee-count rate, member rate, source-fare rate and cardmember rate are multiplied with one another into one combined rate; then the basis is multiplied once by that combined rate, and only that product is rounded to the nearest cent."
    result: "The extension fee is worked out in this order: first the extension-fee basis is set from the credit's remaining value; then the extension-fee fee-count rate, member rate, source-fare rate and cardmember rate are multiplied with one another into one combined rate; then the basis is multiplied once by that combined rate, and only that product is rounded to the nearest cent."
  factors:
  - id: extension_fee_basis
    effect: method
    decides: xf_fee_basis
    bindings: [xf_remaining_value, xf_fee_basis]
    ladder:
    - when: "the credit's remaining value is below small_balance_usd"
      method: "the basis is small_balance_percent percent of the remaining value (a share of the value)"
    - when: "the remaining value is at least small_balance_usd and below mid_balance_usd"
      method: "the basis is the lesser of the instrument's extension_fee and mid_balance_percent percent of the remaining value (the smaller of the flat fee and a share of the value)"
    - when: "otherwise"
      method: "the basis is the instrument's extension_fee (the flat fee)"
    baseline:
      xf_fee_basis: "P('extension_fee')"
    evidence: [history]
    cross_difficulty: null
  - id: extension_fee_count_rate
    effect: parameter
    decides: xf_fee_count_rate
    bindings: [xf_recent_fee_entries, xf_fee_count_rate]
    ladder:
    - when: "at least many_fee_entries service-fee entries booked on the credit in the last fee_window_months calendar months"
      value: "K('many_fee_rate')"
    - when: "exactly one such entry"
      value: "K('one_fee_rate')"
    - when: "otherwise"
      value: "1"
    baseline:
      xf_fee_count_rate: "1.0"
    evidence: [history]
    cross_difficulty: null
  - id: extension_fee_member_rate
    effect: parameter
    decides: xf_member_rate
    bindings: [xf_member_tier, xf_qualifying_dollars, xf_qualifying_threshold, xf_member_rate]
    ladder:
    - when: "Summit Gold member whose qualifying dollars this year have reached the Summit Gold qualifying threshold"
      value: "K('gold_qualifier_rate')"
    - when: "Summit Silver member whose qualifying dollars this year have reached the Summit Silver qualifying threshold"
      value: "K('silver_qualifier_rate')"
    - when: "otherwise"
      value: "1"
    baseline:
      xf_member_rate: "1.0"
    evidence: [cross_category, tier_param]
    cross_difficulty: loyalty
  - id: extension_fee_source_fare_rate
    effect: parameter
    decides: xf_brand_rate
    bindings: [xf_source_brand, xf_brand_rate]
    ladder:
    - when: "the ticket the credit arose from was sold as Crestline Main Flexible or Crestline First"
      value: "K('refundable_brand_rate')"
    - when: "the ticket the credit arose from was sold as Crestline Main Plus or Crestline Premium Economy"
      value: "K('upper_brand_rate')"
    - when: "otherwise"
      value: "1"
    baseline:
      xf_brand_rate: "1.0"
    evidence: [cross_category]
    cross_difficulty: ticket
  - id: extension_fee_cardmember_rate
    effect: parameter
    decides: xf_cardmember_rate
    bindings: [xf_holds_pass, xf_holds_cobrand_certificate, xf_cardmember_rate]
    ladder:
    - when: "the customer holds an active Crestline Companion Pass Semiannual or Crestline Companion Pass Annual"
      value: "K('pass_holder_rate')"
    - when: "the customer holds no active companion pass but an active companion certificate issued as the co-branded card anniversary benefit"
      value: "K('cobrand_certificate_rate')"
    - when: "otherwise"
      value: "1"
    baseline:
      xf_cardmember_rate: "1.0"
    evidence: [cross_category]
    cross_difficulty: companion
  inputs:
    history:
    - {table: credit_ledger, aggregate: sum, field: amount, filters: {event_type: credit_value_load}}
    - {table: credit_ledger, aggregate: sum, field: amount, filters: {event_type: credit_redemption}}
    - {table: credit_ledger, aggregate: count, field: credit_entry_id, within_months: 12, filters: {event_type: credit_service_fee}}
    cross_category: [loyalty, ticket, companion]
- id: credit_ext_extension_term
  base_policy_refs: [credit_extension]
  overwrite:
  - base_policy: credit_extension
    superseded_clause: >-
      An active credit's expiry_date may be extended by extension_months calendar months
    replaced_by: >-
      An active credit may be extended by the extension term worked out below when extension_permitted is true and
      the credit's extension_count is below max_extensions.
  - base_policy: credit_extension
    superseded_clause: >-
      The new expiry_date is the old expiry_date plus extension_months calendar months
    replaced_by: >-
      The new expiry date is the old expiry date as recorded on the credit plus the extension term in calendar
      months, keeping the day-of-month and falling back to the last day of the month when that day does not exist,
      and extension_count increases by one.
  trigger: on_request
  subject: [credit_extend]
  computes: extension_months
  target_tool: extend_credit_f94665bb
  params:
    long_tenure_months: 60
    upper_tenured_term_months: 8
    middle_tenured_term_months: 7
    many_redemptions: 3
    many_redemption_extra_months: 2
    some_redemption_extra_months: 1
    disruption_window_months: 12
    many_disruptions: 2
    many_disruption_extra_months: 2
    one_disruption_extra_months: 1
    long_haul_extra_months: 2
    short_haul_extra_months: 1
    halving_within_days: 15
    three_quarter_within_days: 30
  rule: >-
    An active credit may be extended by the extension term worked out below when extension_permitted is true and the
    credit's extension_count is below max_extensions. For a credit whose extension fee is not waived, the new expiry
    date from an extension is recorded only after the credit carries an extension fee entry dated on the day of the
    extension. The standard extension term is the instrument's extension_months. The new expiry date is the old
    expiry date as recorded on the credit plus the extension term in calendar months, keeping the day-of-month and
    falling back to the last day of the month when that day does not exist, and extension_count increases by one.
    The extension term is worked out in this order: first the tenured-member term, the prior-use months, the
    disruption months and the source-route months are added together; then that sum is adjusted for how close to
    the expiry date the extension is requested. The tenured-member term of an extension is upper_tenured_term_months for a Summit Platinum, Summit Diamond or Summit Chairman member and for a Summit Gold member whose Summit membership was enrolled at least long_tenure_months whole calendar months before the request date, middle_tenured_term_months for any other Summit Gold member and for a Summit Silver member enrolled at least long_tenure_months whole calendar months before the request date, and the standard extension term for every other holder. The
    prior-use months of an extension are many_redemption_extra_months when the credit carries at least
    many_redemptions redemption entries, some_redemption_extra_months when it carries at least one but fewer than
    many_redemptions, and none when it carries no redemption entry. An extension-term window of the last so many calendar months holds the entries dated fewer than that many whole calendar months before the request date, so it rolls back from that date and is not a count of completed calendar months. The disruption months of an extension count the
    disruption records with a controllable cause recorded on the customer's tickets in the last
    disruption_window_months calendar months, and are many_disruption_extra_months for at least many_disruptions
    such records, one_disruption_extra_months for exactly one, and none for none. The source-route months of an
    extension are long_haul_extra_months when the ticket the credit arose from was a long-haul international
    itinerary, short_haul_extra_months when it was a short-haul international itinerary, and none when it was
    domestic. The closeness of an extension request is the number of calendar days from the request date to the
    credit's expiry date as recorded on the credit: when no more than halving_within_days days remain the summed
    months are halved and rounded up to a whole month; when more than halving_within_days but no more than
    three_quarter_within_days days remain the summed months are multiplied by three quarters and rounded down to a
    whole month; when more than three_quarter_within_days days remain the summed months are used as they stand.
  baseline:
    rule: >-
      The standard extension term is the instrument's extension_months. The new expiry date is the old expiry date
      as recorded on the credit plus the extension term in calendar months, keeping the day-of-month and falling back
      to the last day of the month when that day does not exist, and extension_count increases by one.
    params: [extension_months]
  prerequisite:
  - problem: credit_ext_extension_fee
    kind: state_gate
    gate: credit_ledger.fee_type
    form: state
    policy_source: >-
      For a credit whose extension fee is not waived, the new expiry date from an extension is recorded only after
      the credit carries an extension fee entry dated on the day of the extension.
    condition: >-
      The credit's ledger carries a credit_service_fee entry with fee_type extension_fee whose entry_date is the
      extension date, unless the holder's Summit tier waives credit service fees.
    resolved_by: pay_credit_extension_fee_5a6cc7fd
    effect: >-
      The extension fee entry now stands on the credit, so the gate on recording the extended expiry date is met;
      without it the extension has no fee entry behind it and the terminal ledger lacks the fee row.
  cross_category:
  - category: loyalty
    as: branch
    reads: [variant_name, enrolled_date]
    note: The tenured-member term reads the Summit tier and the membership enrolment date.
  - category: ticket
    as: history
    reads: [route_type, ticket_disruptions.disruption_cause, ticket_disruptions.recorded_date]
    note: The disruption months count controllable disruption records on the customer's tickets; the source-route months read the itinerary class of the ticket the credit arose from.
  compute:
  - et_member_tier: "CFIELD('loyalty','variant_name')"
  - et_membership_months: "MONTHS(CFIELD('loyalty','enrolled_date'), NOW)"
  - et_tenured_term: "K('upper_tenured_term_months') if (et_member_tier == 'Summit Platinum' or et_member_tier == 'Summit Diamond' or et_member_tier == 'Summit Chairman' or (et_member_tier == 'Summit Gold' and et_membership_months >= K('long_tenure_months'))) else (K('middle_tenured_term_months') if (et_member_tier == 'Summit Gold' or (et_member_tier == 'Summit Silver' and et_membership_months >= K('long_tenure_months'))) else P('extension_months'))"
  - et_redemption_count: "COUNT('credit_ledger', event_type='credit_redemption')"
  - et_prior_use_months: "K('many_redemption_extra_months') if et_redemption_count >= K('many_redemptions') else (K('some_redemption_extra_months') if et_redemption_count >= 1 else 0)"
  - et_recent_disruptions: "XCOUNT('ticket','ticket_disruptions', within_months=K('disruption_window_months'), date_field='recorded_date', event_type='ticket_disruption_record', disruption_cause='controllable')"
  - et_disruption_months: "K('many_disruption_extra_months') if et_recent_disruptions >= K('many_disruptions') else (K('one_disruption_extra_months') if et_recent_disruptions == 1 else 0)"
  - et_source_route: "CFIELD('ticket','route_type', ticket_id=F('source_ticket_id'))"
  - et_route_months: "K('long_haul_extra_months') if et_source_route == 'long_haul_international' else (K('short_haul_extra_months') if et_source_route == 'short_haul_international' else 0)"
  - et_summed_months: "et_tenured_term + et_prior_use_months + et_disruption_months + et_route_months"
  - et_days_to_expiry: "DAYS(NOW, F('expiry_date'))"
  - et_closeness_adjusted: "((et_summed_months + 1) // 2) if et_days_to_expiry <= K('halving_within_days') else (((et_summed_months * 3) // 4) if et_days_to_expiry <= K('three_quarter_within_days') else et_summed_months)"
  - result: "et_closeness_adjusted"
  compute_basis:
    et_member_tier: "The tenured-member term of an extension is upper_tenured_term_months for a Summit Platinum, Summit Diamond or Summit Chairman member and for a Summit Gold member whose Summit membership was enrolled at least long_tenure_months whole calendar months before the request date, middle_tenured_term_months for any other Summit Gold member and for a Summit Silver member enrolled at least long_tenure_months whole calendar months before the request date, and the standard extension term for every other holder."
    et_membership_months: "The tenured-member term of an extension is upper_tenured_term_months for a Summit Platinum, Summit Diamond or Summit Chairman member and for a Summit Gold member whose Summit membership was enrolled at least long_tenure_months whole calendar months before the request date, middle_tenured_term_months for any other Summit Gold member and for a Summit Silver member enrolled at least long_tenure_months whole calendar months before the request date, and the standard extension term for every other holder."
    et_tenured_term: "The tenured-member term of an extension is upper_tenured_term_months for a Summit Platinum, Summit Diamond or Summit Chairman member and for a Summit Gold member whose Summit membership was enrolled at least long_tenure_months whole calendar months before the request date, middle_tenured_term_months for any other Summit Gold member and for a Summit Silver member enrolled at least long_tenure_months whole calendar months before the request date, and the standard extension term for every other holder."
    et_redemption_count: "The prior-use months of an extension are many_redemption_extra_months when the credit carries at least many_redemptions redemption entries, some_redemption_extra_months when it carries at least one but fewer than many_redemptions, and none when it carries no redemption entry."
    et_prior_use_months: "The prior-use months of an extension are many_redemption_extra_months when the credit carries at least many_redemptions redemption entries, some_redemption_extra_months when it carries at least one but fewer than many_redemptions, and none when it carries no redemption entry."
    et_recent_disruptions: "An extension-term window of the last so many calendar months holds the entries dated fewer than that many whole calendar months before the request date, so it rolls back from that date and is not a count of completed calendar months."
    et_disruption_months: "The disruption months of an extension count the disruption records with a controllable cause recorded on the customer's tickets in the last disruption_window_months calendar months, and are many_disruption_extra_months for at least many_disruptions such records, one_disruption_extra_months for exactly one, and none for none."
    et_source_route: "The source-route months of an extension are long_haul_extra_months when the ticket the credit arose from was a long-haul international itinerary, short_haul_extra_months when it was a short-haul international itinerary, and none when it was domestic."
    et_route_months: "The source-route months of an extension are long_haul_extra_months when the ticket the credit arose from was a long-haul international itinerary, short_haul_extra_months when it was a short-haul international itinerary, and none when it was domestic."
    et_summed_months: "The extension term is worked out in this order: first the tenured-member term, the prior-use months, the disruption months and the source-route months are added together; then that sum is adjusted for how close to the expiry date the extension is requested."
    et_days_to_expiry: "The closeness of an extension request is the number of calendar days from the request date to the credit's expiry date as recorded on the credit: when no more than halving_within_days days remain the summed months are halved and rounded up to a whole month; when more than halving_within_days but no more than three_quarter_within_days days remain the summed months are multiplied by three quarters and rounded down to a whole month; when more than three_quarter_within_days days remain the summed months are used as they stand."
    et_closeness_adjusted: "The closeness of an extension request is the number of calendar days from the request date to the credit's expiry date as recorded on the credit: when no more than halving_within_days days remain the summed months are halved and rounded up to a whole month; when more than halving_within_days but no more than three_quarter_within_days days remain the summed months are multiplied by three quarters and rounded down to a whole month; when more than three_quarter_within_days days remain the summed months are used as they stand."
    result: "The extension term is worked out in this order: first the tenured-member term, the prior-use months, the disruption months and the source-route months are added together; then that sum is adjusted for how close to the expiry date the extension is requested."
  factors:
  - id: tenured_member_term
    effect: parameter
    decides: et_tenured_term
    bindings: [et_member_tier, et_membership_months, et_tenured_term]
    ladder:
    - when: "Summit Platinum, Summit Diamond or Summit Chairman member, or Summit Gold member enrolled at least long_tenure_months whole calendar months before the request date"
      value: "K('upper_tenured_term_months')"
    - when: "any other Summit Gold member, or Summit Silver member enrolled at least long_tenure_months whole calendar months before the request date"
      value: "K('middle_tenured_term_months')"
    - when: "otherwise"
      value: "P('extension_months')"
    baseline:
      et_tenured_term: "P('extension_months')"
    evidence: [cross_category, date]
    cross_difficulty: loyalty
  - id: extension_prior_use_months
    effect: parameter
    decides: et_prior_use_months
    bindings: [et_redemption_count, et_prior_use_months]
    ladder:
    - when: "the credit carries at least many_redemptions redemption entries"
      value: "K('many_redemption_extra_months')"
    - when: "the credit carries at least one and fewer than many_redemptions redemption entries"
      value: "K('some_redemption_extra_months')"
    - when: "otherwise"
      value: "0"
    baseline:
      et_prior_use_months: "0"
    evidence: [history]
    cross_difficulty: null
  - id: extension_disruption_months
    effect: parameter
    decides: et_disruption_months
    bindings: [et_recent_disruptions, et_disruption_months]
    ladder:
    - when: "at least many_disruptions controllable-cause disruption records on the customer's tickets in the last disruption_window_months calendar months"
      value: "K('many_disruption_extra_months')"
    - when: "exactly one such record"
      value: "K('one_disruption_extra_months')"
    - when: "otherwise"
      value: "0"
    baseline:
      et_disruption_months: "0"
    evidence: [cross_category, history]
    cross_difficulty: ticket
  - id: extension_source_route_months
    effect: parameter
    decides: et_route_months
    bindings: [et_source_route, et_route_months]
    ladder:
    - when: "the ticket the credit arose from was a long-haul international itinerary"
      value: "K('long_haul_extra_months')"
    - when: "the ticket the credit arose from was a short-haul international itinerary"
      value: "K('short_haul_extra_months')"
    - when: "otherwise"
      value: "0"
    baseline:
      et_route_months: "0"
    evidence: [cross_category]
    cross_difficulty: ticket
  - id: extension_request_closeness
    effect: method
    decides: et_closeness_adjusted
    bindings: [et_days_to_expiry, et_closeness_adjusted]
    ladder:
    - when: "no more than halving_within_days calendar days remain from the request date to the expiry date"
      method: "the summed months are halved and rounded up to a whole month"
    - when: "more than halving_within_days and no more than three_quarter_within_days calendar days remain"
      method: "the summed months are multiplied by three quarters and rounded down to a whole month"
    - when: "otherwise"
      method: "the summed months are used as they stand"
    baseline:
      et_closeness_adjusted: "et_summed_months"
    evidence: [date]
    cross_difficulty: null
  inputs:
    history:
    - {table: credit_ledger, aggregate: count, field: credit_entry_id, filters: {event_type: credit_redemption}}
    - {category: ticket, table: ticket_disruptions, aggregate: count, field: disruption_id, within_months: 12, filters: {event_type: ticket_disruption_record, disruption_cause: controllable}}
    cross_category: [loyalty, ticket]
