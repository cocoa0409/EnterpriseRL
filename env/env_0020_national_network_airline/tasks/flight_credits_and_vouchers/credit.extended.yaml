extended_policies:
- id: credit_ext_reinstated_validity
  base_policy_refs: [credit_reinstatement, credit_expiry]
  overwrite:
  - base_policy: credit_reinstatement
    superseded_clause: >-
      sets the new expiry_date to the reinstatement date plus reinstated_validity_months calendar months with the
      same month-end fallback as issuance
    replaced_by: >-
      The new expiry date is the reinstatement date plus the reinstated term in calendar months, keeping the
      day-of-month and falling back to the last day of the month when that day does not exist.
  trigger: on_request
  subject: [credit_reinstate]
  computes: validity_months
  target_tool: reinstate_credit_8e2d0d7d
  params:
    upper_standing_term_months: 8
    middle_standing_term_months: 7
    high_writeoff_usd: 500
    mid_writeoff_usd: 250
    high_writeoff_extra_months: 2
    mid_writeoff_extra_months: 1
    long_tenure_months: 120
    mid_tenure_months: 60
    long_tenure_extra_months: 2
    mid_tenure_extra_months: 1
    many_redemptions: 2
    many_redemption_extra_months: 2
    some_redemption_extra_months: 1
    halving_after_days: 30
    three_quarter_from_days: 15
    max_term_months: 12
  rule: >-
    Reinstating an expired credit gives it a new term of validity counted in whole calendar months. The standard
    reinstated term is the instrument's reinstated_validity_months. The new expiry date is the reinstatement date
    plus the reinstated term in calendar months, keeping the day-of-month and falling back to the last day of the
    month when that day does not exist. The reinstated term is worked out in this order: first the member-standing
    term, the written-off-value months, the membership-tenure months and the prior-use months are added together;
    then that sum is adjusted for the lateness of the reinstatement; finally the adjusted figure is capped at
    max_term_months. The member-standing term of a reinstated credit is upper_standing_term_months for a Summit Platinum, Summit Diamond or Summit Chairman member and for a Summit Gold member whose qualifying dollars this year have reached the qualifying_dollars_threshold of Summit Gold in the loyalty charter, middle_standing_term_months for any other Summit Gold member and for a Summit Silver member whose qualifying dollars this year have reached the qualifying_dollars_threshold of Summit Silver, and the standard reinstated term for every other holder. The written-off-value months of a reinstated credit are high_writeoff_extra_months when the value written
    off at its expiry is at least high_writeoff_usd, mid_writeoff_extra_months when that value is at least
    mid_writeoff_usd but below high_writeoff_usd, and none when it is below mid_writeoff_usd. The membership-tenure
    months of a reinstated credit are long_tenure_extra_months when the holder's Summit membership was enrolled at
    least long_tenure_months whole calendar months before the reinstatement date, mid_tenure_extra_months when it was
    enrolled at least mid_tenure_months but fewer than long_tenure_months whole calendar months before, and none
    when it was enrolled fewer than mid_tenure_months whole calendar months before. The prior-use months of a
    reinstated credit are many_redemption_extra_months when the credit carries at least many_redemptions redemption
    entries, some_redemption_extra_months when it carries at least one but fewer than many_redemptions redemption
    entries, and none when it carries no redemption entry. The lateness of a reinstatement is the number of calendar
    days from the credit's expiry date as recorded on the credit to the reinstatement date: when more than
    halving_after_days days have passed the summed months are halved and rounded up to a whole month; when at least
    three_quarter_from_days days and no more than halving_after_days days have passed the summed months are
    multiplied by three quarters and rounded down to a whole month; when fewer than three_quarter_from_days days have
    passed the summed months are used as they stand.
  baseline:
    rule: >-
      Reinstating an expired credit gives it a new term of validity counted in whole calendar months. The standard
      reinstated term is the instrument's reinstated_validity_months. The new expiry date is the reinstatement date
      plus the reinstated term in calendar months, keeping the day-of-month and falling back to the last day of the
      month when that day does not exist.
    params: [reinstated_validity_months]
  prerequisite: []
  cross_category:
  - category: loyalty
    as: branch
    reads: [variant_name, qualifying_dollars_ytd, enrolled_date, qualifying_dollars_threshold]
    note: The member-standing term reads the holder's Summit tier, qualifying dollars and tier threshold; the membership-tenure months read the Summit enrolment date.
  compute:
  - rt_member_tier: "CFIELD('loyalty','variant_name')"
  - rt_qualifying_dollars: "CFIELD('loyalty','qualifying_dollars_ytd')"
  - rt_qualifying_threshold: "CPARAM('loyalty','qualifying_dollars_threshold')"
  - rt_standing_term: "K('upper_standing_term_months') if (rt_member_tier == 'Summit Platinum' or rt_member_tier == 'Summit Diamond' or rt_member_tier == 'Summit Chairman' or (rt_member_tier == 'Summit Gold' and rt_qualifying_dollars >= rt_qualifying_threshold)) else (K('middle_standing_term_months') if (rt_member_tier == 'Summit Gold' or (rt_member_tier == 'Summit Silver' and rt_qualifying_dollars >= rt_qualifying_threshold)) else P('reinstated_validity_months'))"
  - rt_written_off_value: "SUM('credit_ledger','amount', event_type='credit_expiry_writeoff')"
  - rt_writeoff_months: "K('high_writeoff_extra_months') if rt_written_off_value >= K('high_writeoff_usd') else (K('mid_writeoff_extra_months') if rt_written_off_value >= K('mid_writeoff_usd') else 0)"
  - rt_membership_months: "MONTHS(CFIELD('loyalty','enrolled_date'), NOW)"
  - rt_tenure_months: "K('long_tenure_extra_months') if rt_membership_months >= K('long_tenure_months') else (K('mid_tenure_extra_months') if rt_membership_months >= K('mid_tenure_months') else 0)"
  - rt_redemption_count: "COUNT('credit_ledger', event_type='credit_redemption')"
  - rt_prior_use_months: "K('many_redemption_extra_months') if rt_redemption_count >= K('many_redemptions') else (K('some_redemption_extra_months') if rt_redemption_count >= 1 else 0)"
  - rt_summed_months: "rt_standing_term + rt_writeoff_months + rt_tenure_months + rt_prior_use_months"
  - rt_days_late: "DAYS(F('expiry_date'), NOW)"
  - rt_lateness_adjusted: "((rt_summed_months + 1) // 2) if rt_days_late > K('halving_after_days') else (((rt_summed_months * 3) // 4) if rt_days_late >= K('three_quarter_from_days') else rt_summed_months)"
  - result: "MN(K('max_term_months'), rt_lateness_adjusted)"
  compute_basis:
    rt_member_tier: "The member-standing term of a reinstated credit is upper_standing_term_months for a Summit Platinum, Summit Diamond or Summit Chairman member and for a Summit Gold member whose qualifying dollars this year have reached the qualifying_dollars_threshold of Summit Gold in the loyalty charter, middle_standing_term_months for any other Summit Gold member and for a Summit Silver member whose qualifying dollars this year have reached the qualifying_dollars_threshold of Summit Silver, and the standard reinstated term for every other holder."
    rt_qualifying_dollars: "The member-standing term of a reinstated credit is upper_standing_term_months for a Summit Platinum, Summit Diamond or Summit Chairman member and for a Summit Gold member whose qualifying dollars this year have reached the qualifying_dollars_threshold of Summit Gold in the loyalty charter, middle_standing_term_months for any other Summit Gold member and for a Summit Silver member whose qualifying dollars this year have reached the qualifying_dollars_threshold of Summit Silver, and the standard reinstated term for every other holder."
    rt_qualifying_threshold: "The member-standing term of a reinstated credit is upper_standing_term_months for a Summit Platinum, Summit Diamond or Summit Chairman member and for a Summit Gold member whose qualifying dollars this year have reached the qualifying_dollars_threshold of Summit Gold in the loyalty charter, middle_standing_term_months for any other Summit Gold member and for a Summit Silver member whose qualifying dollars this year have reached the qualifying_dollars_threshold of Summit Silver, and the standard reinstated term for every other holder."
    rt_standing_term: "The member-standing term of a reinstated credit is upper_standing_term_months for a Summit Platinum, Summit Diamond or Summit Chairman member and for a Summit Gold member whose qualifying dollars this year have reached the qualifying_dollars_threshold of Summit Gold in the loyalty charter, middle_standing_term_months for any other Summit Gold member and for a Summit Silver member whose qualifying dollars this year have reached the qualifying_dollars_threshold of Summit Silver, and the standard reinstated term for every other holder."
    rt_written_off_value: "The written-off-value months of a reinstated credit are high_writeoff_extra_months when the value written off at its expiry is at least high_writeoff_usd, mid_writeoff_extra_months when that value is at least mid_writeoff_usd but below high_writeoff_usd, and none when it is below mid_writeoff_usd."
    rt_writeoff_months: "The written-off-value months of a reinstated credit are high_writeoff_extra_months when the value written off at its expiry is at least high_writeoff_usd, mid_writeoff_extra_months when that value is at least mid_writeoff_usd but below high_writeoff_usd, and none when it is below mid_writeoff_usd."
    rt_membership_months: "The membership-tenure months of a reinstated credit are long_tenure_extra_months when the holder's Summit membership was enrolled at least long_tenure_months whole calendar months before the reinstatement date, mid_tenure_extra_months when it was enrolled at least mid_tenure_months but fewer than long_tenure_months whole calendar months before, and none when it was enrolled fewer than mid_tenure_months whole calendar months before."
    rt_tenure_months: "The membership-tenure months of a reinstated credit are long_tenure_extra_months when the holder's Summit membership was enrolled at least long_tenure_months whole calendar months before the reinstatement date, mid_tenure_extra_months when it was enrolled at least mid_tenure_months but fewer than long_tenure_months whole calendar months before, and none when it was enrolled fewer than mid_tenure_months whole calendar months before."
    rt_redemption_count: "The prior-use months of a reinstated credit are many_redemption_extra_months when the credit carries at least many_redemptions redemption entries, some_redemption_extra_months when it carries at least one but fewer than many_redemptions redemption entries, and none when it carries no redemption entry."
    rt_prior_use_months: "The prior-use months of a reinstated credit are many_redemption_extra_months when the credit carries at least many_redemptions redemption entries, some_redemption_extra_months when it carries at least one but fewer than many_redemptions redemption entries, and none when it carries no redemption entry."
    rt_summed_months: "The reinstated term is worked out in this order: first the member-standing term, the written-off-value months, the membership-tenure months and the prior-use months are added together; then that sum is adjusted for the lateness of the reinstatement; finally the adjusted figure is capped at max_term_months."
    rt_days_late: "The lateness of a reinstatement is the number of calendar days from the credit's expiry date as recorded on the credit to the reinstatement date: when more than halving_after_days days have passed the summed months are halved and rounded up to a whole month; when at least three_quarter_from_days days and no more than halving_after_days days have passed the summed months are multiplied by three quarters and rounded down to a whole month; when fewer than three_quarter_from_days days have passed the summed months are used as they stand."
    rt_lateness_adjusted: "The lateness of a reinstatement is the number of calendar days from the credit's expiry date as recorded on the credit to the reinstatement date: when more than halving_after_days days have passed the summed months are halved and rounded up to a whole month; when at least three_quarter_from_days days and no more than halving_after_days days have passed the summed months are multiplied by three quarters and rounded down to a whole month; when fewer than three_quarter_from_days days have passed the summed months are used as they stand."
    result: "The reinstated term is worked out in this order: first the member-standing term, the written-off-value months, the membership-tenure months and the prior-use months are added together; then that sum is adjusted for the lateness of the reinstatement; finally the adjusted figure is capped at max_term_months."
  factors:
  - id: member_standing_term
    effect: parameter
    decides: rt_standing_term
    bindings: [rt_member_tier, rt_qualifying_dollars, rt_qualifying_threshold, rt_standing_term]
    ladder:
    - when: "the holder is a Summit Platinum, Summit Diamond or Summit Chairman member, or a Summit Gold member whose qualifying dollars this year have reached the Summit Gold qualifying threshold"
      value: "K('upper_standing_term_months')"
    - when: "the holder is any other Summit Gold member, or a Summit Silver member whose qualifying dollars this year have reached the Summit Silver qualifying threshold"
      value: "K('middle_standing_term_months')"
    - when: "otherwise"
      value: "P('reinstated_validity_months')"
    baseline:
      rt_standing_term: "P('reinstated_validity_months')"
    evidence: [cross_category, tier_param]
    cross_difficulty: loyalty
  - id: written_off_value_months
    effect: parameter
    decides: rt_writeoff_months
    bindings: [rt_written_off_value, rt_writeoff_months]
    ladder:
    - when: "the value written off at expiry is at least high_writeoff_usd"
      value: "K('high_writeoff_extra_months')"
    - when: "the value written off at expiry is at least mid_writeoff_usd and below high_writeoff_usd"
      value: "K('mid_writeoff_extra_months')"
    - when: "otherwise"
      value: "0"
    baseline:
      rt_writeoff_months: "0"
    evidence: [history]
    cross_difficulty: null
  - id: membership_tenure_months
    effect: parameter
    decides: rt_tenure_months
    bindings: [rt_membership_months, rt_tenure_months]
    ladder:
    - when: "the Summit membership was enrolled at least long_tenure_months whole calendar months before the reinstatement date"
      value: "K('long_tenure_extra_months')"
    - when: "the Summit membership was enrolled at least mid_tenure_months and fewer than long_tenure_months whole calendar months before"
      value: "K('mid_tenure_extra_months')"
    - when: "otherwise"
      value: "0"
    baseline:
      rt_tenure_months: "0"
    evidence: [cross_category, date]
    cross_difficulty: loyalty
  - id: prior_use_months
    effect: parameter
    decides: rt_prior_use_months
    bindings: [rt_redemption_count, rt_prior_use_months]
    ladder:
    - when: "the credit carries at least many_redemptions redemption entries"
      value: "K('many_redemption_extra_months')"
    - when: "the credit carries at least one and fewer than many_redemptions redemption entries"
      value: "K('some_redemption_extra_months')"
    - when: "otherwise"
      value: "0"
    baseline:
      rt_prior_use_months: "0"
    evidence: [history]
    cross_difficulty: null
  - id: reinstatement_lateness
    effect: method
    decides: rt_lateness_adjusted
    bindings: [rt_days_late, rt_lateness_adjusted]
    ladder:
    - when: "more than halving_after_days calendar days have passed from the expiry date to the reinstatement date"
      method: "the summed months are halved and rounded up to a whole month"
    - when: "at least three_quarter_from_days and no more than halving_after_days calendar days have passed"
      method: "the summed months are multiplied by three quarters and rounded down to a whole month"
    - when: "otherwise"
      method: "the summed months are used as they stand"
    baseline:
      rt_lateness_adjusted: "rt_summed_months"
    evidence: [date]
    cross_difficulty: null
  inputs:
    history:
    - {table: credit_ledger, aggregate: sum, field: amount, filters: {event_type: credit_expiry_writeoff}}
    - {table: credit_ledger, aggregate: count, field: credit_entry_id, filters: {event_type: credit_redemption}}
    cross_category: [loyalty]
- id: credit_ext_reinstatement_fee
  base_policy_refs: [credit_redemption_rules, credit_extension, credit_reinstatement]
  overwrite:
  - base_policy: credit_reinstatement
    superseded_clause: >-
      The reinstatement_fee is charged as a separate fee entry before the credit is reinstated
    replaced_by: >-
      The reinstatement fee is fixed only after the credit carries the restore entry that brings back the value
      written off at its expiry.
  trigger: on_request
  subject: [credit_service_fee]
  computes: fee_amount
  target_tool: pay_credit_reinstatement_fee_177d2025
  params:
    small_restore_usd: 250
    mid_restore_usd: 600
    small_restore_percent: 30
    mid_restore_percent: 35
    flight_window_months: 12
    active_flight_accruals: 4
    gold_flyer_rate: 0.70
    silver_flyer_rate: 0.85
    premium_brand_rate: 0.80
    plus_brand_rate: 0.90
    fees_high_usd: 50
    fees_high_rate: 0.80
    fees_some_rate: 0.90
    disruption_window_months: 12
    many_disruptions: 2
    many_disruption_rate: 0.75
    one_disruption_rate: 0.90
    pass_holder_rate: 0.80
    cobrand_certificate_rate: 0.90
  rule: >-
    The reinstatement fee is charged as a separate fee entry on the credit, and it is waived when the customer's Summit tier has credit_service_fees_waived set to true in the loyalty charter; a
    waived fee is not recorded. The reinstatement fee is fixed only after the credit carries the restore entry that
    brings back the value written off at its expiry. The standard reinstatement fee is the instrument's
    reinstatement_fee, charged as one flat amount in US dollars to the cent. The reinstatement fee is worked out in
    this order: first the reinstatement-fee basis is set from the value restored; then the reinstatement-fee
    member rate, source-fare rate, fee-history rate, disruption rate and cardmember rate are multiplied with one
    another into one combined rate; then the basis is multiplied once by that combined rate, and only that product
    is rounded to the nearest cent. The reinstatement-fee basis is small_restore_percent percent of the value
    restored when the value restored by the reinstatement is below small_restore_usd, the lesser of the
    instrument's reinstatement_fee and mid_restore_percent percent of the value restored when the value restored is
    at least small_restore_usd but below mid_restore_usd, and the instrument's reinstatement_fee when the value
    restored is at least mid_restore_usd. A reinstatement-fee window of the last so many calendar months holds the entries dated fewer than that many whole calendar months before the date the reinstatement fee is worked out, so it rolls back from that date and is not a count of completed calendar months. The reinstatement-fee member rate is gold_flyer_rate for a Summit Gold
    member with at least active_flight_accruals flight accruals posted to the Summit account in the last
    flight_window_months calendar months, silver_flyer_rate for a Summit Silver member with at least
    active_flight_accruals such flight accruals, and 1 for every other customer. The reinstatement-fee source-fare
    rate is premium_brand_rate when the ticket the credit arose from was sold as Crestline First or Crestline
    Premium Economy, plus_brand_rate when it was sold as Crestline Main Plus or Crestline Main Flexible, and 1 for
    any other fare brand. The reinstatement-fee fee-history rate is fees_high_rate when the service fees charged on
    the credit less the service fees refunded on it come to at least fees_high_usd, fees_some_rate when they come to
    more than zero but less than fees_high_usd, and 1 when they come to zero. The reinstatement-fee disruption rate
    counts the disruption records with a controllable cause recorded on the customer's tickets in the last
    disruption_window_months calendar months, and is many_disruption_rate for at least many_disruptions such
    records, one_disruption_rate for exactly one, and 1 for none. The reinstatement-fee cardmember rate is
    pass_holder_rate for a customer holding an active Crestline Companion Pass Semiannual or Crestline Companion
    Pass Annual, cobrand_certificate_rate for a customer holding no active companion pass but an active companion
    certificate issued as the co-branded card anniversary benefit, and 1 for every other customer.
  baseline:
    rule: >-
      The standard reinstatement fee is the instrument's reinstatement_fee, charged as one flat amount in US dollars
      to the cent.
    params: [reinstatement_fee]
  prerequisite:
  - problem: credit_ext_reinstated_validity
    kind: value_input
    gate: rf_restored_value
    form: state
    policy_source: >-
      The reinstatement fee is fixed only after the credit carries the restore entry that brings back the value
      written off at its expiry.
    condition: >-
      The credit's ledger carries a credit_reinstatement_restore entry for the amount of its credit_expiry_writeoff
      entry, and the credit's status is active.
    resolved_by: reinstate_credit_8e2d0d7d
    effect: >-
      rf_restored_value moves from zero to the value restored, which selects the reinstatement-fee basis tier and
      its amount, and so the fee.
  cross_category:
  - category: loyalty
    as: history
    reads: [variant_name, credit_service_fees_waived, loyalty_activity.event_type, loyalty_activity.activity_date]
    note: The reinstatement-fee member rate is decided from the Summit tier and the flight accruals posted in the window; the fee waiver is read from the tier.
  - category: ticket
    as: history
    reads: [variant_name, ticket_disruptions.disruption_cause, ticket_disruptions.recorded_date]
    note: The source-fare rate reads the fare brand of the ticket the credit arose from; the disruption rate counts controllable disruption records on the customer's tickets.
  - category: companion
    as: branch
    reads: [variant_name, issue_source, status]
    note: The cardmember rate is decided from whether the customer holds any active companion pass, or else any active co-branded card companion certificate.
  compute:
  - rf_fee_waived: "CPARAM('loyalty','credit_service_fees_waived')"
  - rf_restored_value: "SUM('credit_ledger','amount', event_type='credit_reinstatement_restore')"
  - rf_fee_basis: "(rf_restored_value * K('small_restore_percent') / 100) if rf_restored_value < K('small_restore_usd') else (MN(P('reinstatement_fee'), rf_restored_value * K('mid_restore_percent') / 100) if rf_restored_value < K('mid_restore_usd') else P('reinstatement_fee'))"
  - rf_member_tier: "CFIELD('loyalty','variant_name')"
  - rf_recent_flights: "XCOUNT('loyalty','loyalty_activity', within_months=K('flight_window_months'), date_field='activity_date', event_type='loyalty_flight_accrual')"
  - rf_member_rate: "K('gold_flyer_rate') if (rf_member_tier == 'Summit Gold' and rf_recent_flights >= K('active_flight_accruals')) else (K('silver_flyer_rate') if (rf_member_tier == 'Summit Silver' and rf_recent_flights >= K('active_flight_accruals')) else 1.0)"
  - rf_source_brand: "CFIELD('ticket','variant_name', ticket_id=F('source_ticket_id'))"
  - rf_brand_rate: "K('premium_brand_rate') if (rf_source_brand == 'Crestline First' or rf_source_brand == 'Crestline Premium Economy') else (K('plus_brand_rate') if (rf_source_brand == 'Crestline Main Plus' or rf_source_brand == 'Crestline Main Flexible') else 1.0)"
  - rf_net_fees: "SUM('credit_ledger','amount', event_type='credit_service_fee') - SUM('credit_ledger','amount', event_type='credit_fee_refund')"
  - rf_fee_history_rate: "K('fees_high_rate') if rf_net_fees >= K('fees_high_usd') else (K('fees_some_rate') if rf_net_fees > 0 else 1.0)"
  - rf_recent_disruptions: "XCOUNT('ticket','ticket_disruptions', within_months=K('disruption_window_months'), date_field='recorded_date', event_type='ticket_disruption_record', disruption_cause='controllable')"
  - rf_disruption_rate: "K('many_disruption_rate') if rf_recent_disruptions >= K('many_disruptions') else (K('one_disruption_rate') if rf_recent_disruptions == 1 else 1.0)"
  - rf_holds_pass: "EXISTS('companion', variant_name='Crestline Companion Pass Semiannual', status='active') or EXISTS('companion', variant_name='Crestline Companion Pass Annual', status='active')"
  - rf_holds_cobrand_certificate: "EXISTS('companion', issue_source='cobrand_card_anniversary', status='active')"
  - rf_cardmember_rate: "K('pass_holder_rate') if rf_holds_pass else (K('cobrand_certificate_rate') if rf_holds_cobrand_certificate else 1.0)"
  - rf_combined_rate: "rf_member_rate * rf_brand_rate * rf_fee_history_rate * rf_disruption_rate * rf_cardmember_rate"
  - result: "0.0 if rf_fee_waived else RND(rf_fee_basis * rf_combined_rate, 2)"
  compute_basis:
    rf_fee_waived: "The reinstatement fee is charged as a separate fee entry on the credit, and it is waived when the customer's Summit tier has credit_service_fees_waived set to true in the loyalty charter; a waived fee is not recorded."
    rf_restored_value: "The reinstatement-fee basis is small_restore_percent percent of the value restored when the value restored by the reinstatement is below small_restore_usd, the lesser of the instrument's reinstatement_fee and mid_restore_percent percent of the value restored when the value restored is at least small_restore_usd but below mid_restore_usd, and the instrument's reinstatement_fee when the value restored is at least mid_restore_usd."
    rf_fee_basis: "The reinstatement-fee basis is small_restore_percent percent of the value restored when the value restored by the reinstatement is below small_restore_usd, the lesser of the instrument's reinstatement_fee and mid_restore_percent percent of the value restored when the value restored is at least small_restore_usd but below mid_restore_usd, and the instrument's reinstatement_fee when the value restored is at least mid_restore_usd."
    rf_member_tier: "The reinstatement-fee member rate is gold_flyer_rate for a Summit Gold member with at least active_flight_accruals flight accruals posted to the Summit account in the last flight_window_months calendar months, silver_flyer_rate for a Summit Silver member with at least active_flight_accruals such flight accruals, and 1 for every other customer."
    rf_recent_flights: "A reinstatement-fee window of the last so many calendar months holds the entries dated fewer than that many whole calendar months before the date the reinstatement fee is worked out, so it rolls back from that date and is not a count of completed calendar months."
    rf_member_rate: "The reinstatement-fee member rate is gold_flyer_rate for a Summit Gold member with at least active_flight_accruals flight accruals posted to the Summit account in the last flight_window_months calendar months, silver_flyer_rate for a Summit Silver member with at least active_flight_accruals such flight accruals, and 1 for every other customer."
    rf_source_brand: "The reinstatement-fee source-fare rate is premium_brand_rate when the ticket the credit arose from was sold as Crestline First or Crestline Premium Economy, plus_brand_rate when it was sold as Crestline Main Plus or Crestline Main Flexible, and 1 for any other fare brand."
    rf_brand_rate: "The reinstatement-fee source-fare rate is premium_brand_rate when the ticket the credit arose from was sold as Crestline First or Crestline Premium Economy, plus_brand_rate when it was sold as Crestline Main Plus or Crestline Main Flexible, and 1 for any other fare brand."
    rf_net_fees: "The reinstatement-fee fee-history rate is fees_high_rate when the service fees charged on the credit less the service fees refunded on it come to at least fees_high_usd, fees_some_rate when they come to more than zero but less than fees_high_usd, and 1 when they come to zero."
    rf_fee_history_rate: "The reinstatement-fee fee-history rate is fees_high_rate when the service fees charged on the credit less the service fees refunded on it come to at least fees_high_usd, fees_some_rate when they come to more than zero but less than fees_high_usd, and 1 when they come to zero."
    rf_recent_disruptions: "A reinstatement-fee window of the last so many calendar months holds the entries dated fewer than that many whole calendar months before the date the reinstatement fee is worked out, so it rolls back from that date and is not a count of completed calendar months."
    rf_disruption_rate: "The reinstatement-fee disruption rate counts the disruption records with a controllable cause recorded on the customer's tickets in the last disruption_window_months calendar months, and is many_disruption_rate for at least many_disruptions such records, one_disruption_rate for exactly one, and 1 for none."
    rf_holds_pass: "The reinstatement-fee cardmember rate is pass_holder_rate for a customer holding an active Crestline Companion Pass Semiannual or Crestline Companion Pass Annual, cobrand_certificate_rate for a customer holding no active companion pass but an active companion certificate issued as the co-branded card anniversary benefit, and 1 for every other customer."
    rf_holds_cobrand_certificate: "The reinstatement-fee cardmember rate is pass_holder_rate for a customer holding an active Crestline Companion Pass Semiannual or Crestline Companion Pass Annual, cobrand_certificate_rate for a customer holding no active companion pass but an active companion certificate issued as the co-branded card anniversary benefit, and 1 for every other customer."
    rf_cardmember_rate: "The reinstatement-fee cardmember rate is pass_holder_rate for a customer holding an active Crestline Companion Pass Semiannual or Crestline Companion Pass Annual, cobrand_certificate_rate for a customer holding no active companion pass but an active companion certificate issued as the co-branded card anniversary benefit, and 1 for every other customer."
    rf_combined_rate: "The reinstatement fee is worked out in this order: first the reinstatement-fee basis is set from the value restored; then the reinstatement-fee member rate, source-fare rate, fee-history rate, disruption rate and cardmember rate are multiplied with one another into one combined rate; then the basis is multiplied once by that combined rate, and only that product is rounded to the nearest cent."
    result: "The reinstatement fee is worked out in this order: first the reinstatement-fee basis is set from the value restored; then the reinstatement-fee member rate, source-fare rate, fee-history rate, disruption rate and cardmember rate are multiplied with one another into one combined rate; then the basis is multiplied once by that combined rate, and only that product is rounded to the nearest cent."
  factors:
  - id: reinstatement_fee_basis
    effect: method
    decides: rf_fee_basis
    bindings: [rf_restored_value, rf_fee_basis]
    ladder:
    - when: "the value restored by the reinstatement is below small_restore_usd"
      method: "the basis is small_restore_percent percent of the value restored (a share of the value)"
    - when: "the value restored is at least small_restore_usd and below mid_restore_usd"
      method: "the basis is the lesser of the instrument's reinstatement_fee and mid_restore_percent percent of the value restored (the smaller of the flat fee and a share of the value)"
    - when: "otherwise"
      method: "the basis is the instrument's reinstatement_fee (the flat fee)"
    baseline:
      rf_fee_basis: "P('reinstatement_fee')"
    evidence: [history]
    cross_difficulty: null
  - id: reinstatement_fee_member_rate
    effect: parameter
    decides: rf_member_rate
    bindings: [rf_member_tier, rf_recent_flights, rf_member_rate]
    ladder:
    - when: "Summit Gold member and at least active_flight_accruals flight accruals posted in the last flight_window_months calendar months"
      value: "K('gold_flyer_rate')"
    - when: "Summit Silver member and at least active_flight_accruals flight accruals posted in the last flight_window_months calendar months"
      value: "K('silver_flyer_rate')"
    - when: "otherwise"
      value: "1"
    baseline:
      rf_member_rate: "1.0"
    evidence: [cross_category, history]
    cross_difficulty: loyalty
  - id: reinstatement_fee_source_fare_rate
    effect: parameter
    decides: rf_brand_rate
    bindings: [rf_source_brand, rf_brand_rate]
    ladder:
    - when: "the ticket the credit arose from was sold as Crestline First or Crestline Premium Economy"
      value: "K('premium_brand_rate')"
    - when: "the ticket the credit arose from was sold as Crestline Main Plus or Crestline Main Flexible"
      value: "K('plus_brand_rate')"
    - when: "otherwise"
      value: "1"
    baseline:
      rf_brand_rate: "1.0"
    evidence: [cross_category]
    cross_difficulty: ticket
  - id: reinstatement_fee_history_rate
    effect: parameter
    decides: rf_fee_history_rate
    bindings: [rf_net_fees, rf_fee_history_rate]
    ladder:
    - when: "service fees charged on the credit less service fees refunded come to at least fees_high_usd"
      value: "K('fees_high_rate')"
    - when: "they come to more than zero and less than fees_high_usd"
      value: "K('fees_some_rate')"
    - when: "otherwise"
      value: "1"
    baseline:
      rf_fee_history_rate: "1.0"
    evidence: [history]
    cross_difficulty: null
  - id: reinstatement_fee_disruption_rate
    effect: parameter
    decides: rf_disruption_rate
    bindings: [rf_recent_disruptions, rf_disruption_rate]
    ladder:
    - when: "at least many_disruptions controllable-cause disruption records on the customer's tickets in the last disruption_window_months calendar months"
      value: "K('many_disruption_rate')"
    - when: "exactly one such record"
      value: "K('one_disruption_rate')"
    - when: "otherwise"
      value: "1"
    baseline:
      rf_disruption_rate: "1.0"
    evidence: [cross_category, history]
    cross_difficulty: ticket
  - id: reinstatement_fee_cardmember_rate
    effect: parameter
    decides: rf_cardmember_rate
    bindings: [rf_holds_pass, rf_holds_cobrand_certificate, rf_cardmember_rate]
    ladder:
    - when: "the customer holds an active Crestline Companion Pass Semiannual or Crestline Companion Pass Annual"
      value: "K('pass_holder_rate')"
    - when: "the customer holds no active companion pass but an active companion certificate issued as the co-branded card anniversary benefit"
      value: "K('cobrand_certificate_rate')"
    - when: "otherwise"
      value: "1"
    baseline:
      rf_cardmember_rate: "1.0"
    evidence: [cross_category]
    cross_difficulty: companion
  inputs:
    history:
    - {table: credit_ledger, aggregate: sum, field: amount, filters: {event_type: credit_reinstatement_restore}}
    - {table: credit_ledger, aggregate: sum, field: amount, filters: {event_type: credit_service_fee}}
    - {table: credit_ledger, aggregate: sum, field: amount, filters: {event_type: credit_fee_refund}}
    - {category: loyalty, table: loyalty_activity, aggregate: count, field: loyalty_activity_id, within_months: 12, filters: {event_type: loyalty_flight_accrual}}
    - {category: ticket, table: ticket_disruptions, aggregate: count, field: disruption_id, within_months: 12, filters: {event_type: ticket_disruption_record, disruption_cause: controllable}}
    cross_category: [loyalty, ticket, companion]
- id: credit_ext_telephone_fee
  base_policy_refs: [credit_redemption_rules, credit_extension, credit_reinstatement]
  overwrite:
  - base_policy: credit_redemption_rules
    superseded_clause: >-
      A redemption through the reservations call center carries phone_redemption_fee per ticket, charged as a separate
      fee entry linked to the redemption
    replaced_by: >-
      The telephone fee is worked out in this order: first the telephone-fee basis is set from the value the credit
      paid toward the ticket of that redemption; then the telephone-fee member rate, billing-delay rate, route rate
      and card-spend rate are multiplied with one another into one combined rate; then the basis is multiplied once
      by that combined rate, and only that product is rounded to the nearest cent.
  trigger: state_due
  subject: [credit_service_fee]
  computes: fee_amount
  target_tool: charge_credit_phone_fee_f43f310b
  params:
    small_ticket_usd: 100
    mid_ticket_usd: 250
    small_ticket_percent: 12
    mid_ticket_percent: 16
    flight_window_months: 6
    active_flight_accruals: 3
    gold_flyer_rate: 0.50
    silver_flyer_rate: 0.75
    long_delay_days: 21
    short_delay_days: 8
    long_delay_rate: 0.60
    short_delay_rate: 0.80
    long_haul_rate: 0.60
    short_haul_rate: 0.80
    card_window_months: 3
    many_card_accruals: 3
    many_card_rate: 0.80
    some_card_rate: 0.90
  rule: >-
    A redemption through the reservations call center is charged a telephone fee as a separate fee entry linked to
    that redemption, unless the instrument's online_redemption_permitted is false or the customer's Summit tier has
    credit_service_fees_waived set to true in the loyalty charter; a waived fee is not recorded. A telephone fee is owed only for the latest call-center redemption on the credit, and only while no telephone fee entry is linked to it; an earlier call-center redemption that was left unbilled when a later call-center redemption was made is no longer owed a telephone fee. The standard telephone fee is the instrument's
    phone_redemption_fee per ticket, charged as one flat amount in US dollars to the cent. The telephone fee is
    worked out in this order: first the telephone-fee basis is set from the value the credit paid toward the ticket
    of that redemption; then the telephone-fee member rate, billing-delay rate, route rate and card-spend rate are
    multiplied with one another into one combined rate; then the basis is multiplied once by that combined rate, and
    only that product is rounded to the nearest cent. The telephone-fee basis is small_ticket_percent percent of the
    value the credit paid toward that ticket when that value is below small_ticket_usd, the lesser of the
    instrument's phone_redemption_fee and mid_ticket_percent percent of that value when it is at least
    small_ticket_usd but below mid_ticket_usd, and the instrument's phone_redemption_fee when it is at least
    mid_ticket_usd. A telephone-fee window of the last so many calendar months holds the entries dated fewer than that many whole calendar months before the date the telephone fee is booked, so it rolls back from that date and is not a count of completed calendar months. The telephone-fee member rate is gold_flyer_rate for a Summit Gold member with at least
    active_flight_accruals flight accruals posted to the Summit account in the last flight_window_months calendar
    months, silver_flyer_rate for a Summit Silver member with at least active_flight_accruals such flight accruals,
    and 1 for every other customer. The telephone-fee billing-delay rate counts the calendar days from the date of
    the redemption to the date the telephone fee is booked, and is long_delay_rate when more than long_delay_days
    days have passed, short_delay_rate when at least short_delay_days and no more than long_delay_days days have
    passed, and 1 when fewer than short_delay_days days have passed. The telephone-fee route rate is long_haul_rate
    when the ticket the redemption paid for is a long-haul international itinerary, short_haul_rate when it is a
    short-haul international itinerary, and 1 when it is domestic. The telephone-fee card-spend rate counts the
    co-branded card partner accruals posted to the customer's Summit account in the last card_window_months calendar
    months, and is many_card_rate for at least many_card_accruals such accruals, some_card_rate for one or more but
    fewer than many_card_accruals, and 1 for none.
  baseline:
    rule: >-
      The standard telephone fee is the instrument's phone_redemption_fee per ticket, charged as one flat amount in US
      dollars to the cent.
    params: [phone_redemption_fee]
  prerequisite: []
  cross_category:
  - category: loyalty
    as: history
    reads: [variant_name, credit_service_fees_waived, loyalty_activity.event_type, loyalty_activity.activity_date, loyalty_activity.partner_code]
    note: The telephone-fee member rate reads the Summit tier and the flight accruals of the last six months; the card-spend rate counts co-branded card partner accruals of the last three months.
  - category: ticket
    as: branch
    reads: [route_type, ticket_number]
    note: The telephone-fee route rate reads the itinerary class of the ticket the call-center redemption paid for.
  compute:
  - tp_fee_waived: "CPARAM('loyalty','credit_service_fees_waived')"
  - tp_redemption_entry: "LATEST('credit_ledger','credit_entry_id', date_field='entry_date', event_type='credit_redemption', redemption_channel='call_center')"
  - tp_already_billed: "COUNT('credit_ledger', event_type='credit_service_fee', fee_type='phone_redemption_fee', related_entry_id=tp_redemption_entry)"
  - tp_ticket_number: "LATEST('credit_ledger','applied_ticket_number', date_field='entry_date', event_type='credit_redemption', redemption_channel='call_center')"
  - tp_value_paid: "SUM('credit_ledger','amount', event_type='credit_redemption', applied_ticket_number=tp_ticket_number)"
  - tp_fee_basis: "(tp_value_paid * K('small_ticket_percent') / 100) if tp_value_paid < K('small_ticket_usd') else (MN(P('phone_redemption_fee'), tp_value_paid * K('mid_ticket_percent') / 100) if tp_value_paid < K('mid_ticket_usd') else P('phone_redemption_fee'))"
  - tp_member_tier: "CFIELD('loyalty','variant_name')"
  - tp_recent_flights: "XCOUNT('loyalty','loyalty_activity', within_months=K('flight_window_months'), date_field='activity_date', event_type='loyalty_flight_accrual')"
  - tp_member_rate: "K('gold_flyer_rate') if (tp_member_tier == 'Summit Gold' and tp_recent_flights >= K('active_flight_accruals')) else (K('silver_flyer_rate') if (tp_member_tier == 'Summit Silver' and tp_recent_flights >= K('active_flight_accruals')) else 1.0)"
  - tp_redemption_date: "LATEST('credit_ledger','entry_date', date_field='entry_date', event_type='credit_redemption', redemption_channel='call_center')"
  - tp_delay_days: "DAYS(tp_redemption_date, NOW)"
  - tp_delay_rate: "K('long_delay_rate') if tp_delay_days > K('long_delay_days') else (K('short_delay_rate') if tp_delay_days >= K('short_delay_days') else 1.0)"
  - tp_route_type: "CFIELD('ticket','route_type', ticket_number=tp_ticket_number)"
  - tp_route_rate: "K('long_haul_rate') if tp_route_type == 'long_haul_international' else (K('short_haul_rate') if tp_route_type == 'short_haul_international' else 1.0)"
  - tp_card_accruals: "XCOUNT('loyalty','loyalty_activity', within_months=K('card_window_months'), date_field='activity_date', event_type='loyalty_partner_accrual', partner_code='cobrand_card')"
  - tp_card_rate: "K('many_card_rate') if tp_card_accruals >= K('many_card_accruals') else (K('some_card_rate') if tp_card_accruals >= 1 else 1.0)"
  - tp_combined_rate: "tp_member_rate * tp_delay_rate * tp_route_rate * tp_card_rate"
  - result: "0.0 if (tp_fee_waived or not P('online_redemption_permitted') or tp_already_billed > 0) else RND(tp_fee_basis * tp_combined_rate, 2)"
  compute_basis:
    tp_fee_waived: "A redemption through the reservations call center is charged a telephone fee as a separate fee entry linked to that redemption, unless the instrument's online_redemption_permitted is false or the customer's Summit tier has credit_service_fees_waived set to true in the loyalty charter; a waived fee is not recorded."
    tp_redemption_entry: "A telephone fee is owed only for the latest call-center redemption on the credit, and only while no telephone fee entry is linked to it; an earlier call-center redemption that was left unbilled when a later call-center redemption was made is no longer owed a telephone fee."
    tp_already_billed: "A telephone fee is owed only for the latest call-center redemption on the credit, and only while no telephone fee entry is linked to it; an earlier call-center redemption that was left unbilled when a later call-center redemption was made is no longer owed a telephone fee."
    tp_ticket_number: "A telephone fee is owed only for the latest call-center redemption on the credit, and only while no telephone fee entry is linked to it; an earlier call-center redemption that was left unbilled when a later call-center redemption was made is no longer owed a telephone fee."
