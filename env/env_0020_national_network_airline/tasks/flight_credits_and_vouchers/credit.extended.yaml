events:
- type: credit_issue
  target: credit_holdings
  mutation: create
  meaning: A credit or voucher is issued to a customer.
  grain: One row per credit issued.
  fields:
    variant_name: instrument issued
    credit_number: credit number
    traveler_name: name on the credit
    source_ticket_id: source ticket
    source_disruption_id: disruption compensated
    source_credit_id: earlier credit whose value returns
    issue_reason: ground of issue
    service_recovery_reason: service failure compensated
    issue_date: date issued
    original_ticket_issue_date: source ticket issue date
    expiry_date: computed expiry
    face_value: value issued
  triggers:
  - event: credit:credit_value_load
    map:
      amount: face_value
      entry_date: issue_date
  - event: credit:credit_activate
    when:
      issue_reason:
        not: denied_boarding
    map:
      issue_date: issue_date
- type: credit_value_load
  target: credit_ledger
  meaning: The face value of a newly issued credit is loaded onto it.
  grain: One entry per credit issued.
  distinguish_by:
  - entry_date
  fields:
    entry_date: date loaded
    amount: face value loaded
  account: credit_balance
  direction: in
  triggers: []
- type: credit_activate
  target: credit_holdings
  mutation:
    transition:
      from: issued
      to: active
  meaning: The credit becomes usable, automatically or on the passenger's acceptance of a voucher.
  grain: One per credit.
  fields:
    issue_date: date the credit was issued
  triggers: []
- type: credit_void
  target: credit_holdings
  mutation:
    transition:
      from: issued
      to: voided
  meaning: A voucher not accepted in time, or a credit issued in error, is withdrawn before use.
  grain: One per credit.
  fields:
    closed_date: date voided
  triggers: []
- type: credit_redemption
  target: credit_ledger
  meaning: Credit value pays for a new ticket or an eligible fee.
  grain: One entry per ticket paid from the credit.
  distinguish_by:
  - applied_ticket_number
  fields:
    entry_date: date redeemed
    amount: value applied
    applied_ticket_number: ticket paid for
    beneficiary_name: passenger ticketed
    redemption_channel: channel
  account: credit_balance
  direction: out
  triggers: []
- type: credit_balance_forfeit
  target: credit_ledger
  meaning: The remainder of a single-use credit is forfeited after a smaller redemption.
  grain: One entry per redemption that leaves a forfeited remainder.
  distinguish_by:
  - related_entry_id
  fields:
    entry_date: date forfeited
    amount: remainder forfeited
    related_entry_id: redemption it follows
  account: credit_balance
  direction: out
  triggers: []
- type: credit_deplete
  target: credit_holdings
  mutation:
    transition:
      from: active
      to: depleted
  meaning: The credit's remaining value reached zero.
  grain: One per depletion.
  fields:
    closed_date: date depleted
  triggers: []
- type: credit_redemption_reversal
  target: credit_ledger
  meaning: Value from a redemption returns to the same credit because the ticket it paid for was voided.
  grain: One entry per reversed redemption.
  distinguish_by:
  - reversed_entry_id
  fields:
    entry_date: date reversed
    amount: value returned
    reversed_entry_id: redemption reversed
    applied_ticket_number: ticket voided
  account: credit_balance
  direction: in
  triggers: []
- type: credit_restore
  target: credit_holdings
  mutation:
    transition:
      from: depleted
      to: active
  meaning: A depleted credit becomes usable again after a reversal restored value.
  grain: One per restoration.
  fields:
    closed_date: cleared to empty
  triggers: []
- type: credit_expire
  target: credit_holdings
  mutation:
    transition:
      from: active
      to: expired
  meaning: The credit passed its expiry_date with value remaining.
  grain: One per expiry.
  fields:
    closed_date: day after the expiry_date
  triggers:
  - event: credit:credit_expiry_writeoff
    map:
      entry_date: closed_date
- type: credit_expiry_writeoff
  target: credit_ledger
  meaning: The remaining value of an expired credit is written off.
  grain: One entry per expiry of the credit.
  distinguish_by:
  - entry_date
  fields:
    entry_date: date written off
    amount: value written off
  account: credit_balance
  direction: out
  triggers: []
- type: credit_reinstate
  target: credit_holdings
  mutation:
    transition:
      from: expired
      to: active
  meaning: An expired credit is reinstated with a new expiry_date.
  grain: One per reinstatement.
  fields:
    expiry_date: new expiry date
    reinstatement_count: count after this reinstatement
    closed_date: cleared to empty
  triggers:
  - event: credit:credit_reinstatement_restore
    map: {}
- type: credit_reinstatement_restore
  target: credit_ledger
  meaning: The value written off at expiry is restored on reinstatement.
  grain: One entry per reinstatement.
  distinguish_by:
  - entry_date
  fields:
    entry_date: date restored
    amount: value restored
    reversed_entry_id: expiry write-off restored
  account: credit_balance
  direction: in
  triggers: []
- type: credit_extend
  target: credit_holdings
  mutation: update
  meaning: The expiry_date of an active credit is extended.
  grain: One row per credit (the credit record itself).
  fields:
    expiry_date: new expiry date
    extension_count: count after this extension
  triggers: []
- type: credit_service_fee
  target: credit_ledger
  meaning: An extension, reinstatement or telephone redemption fee is charged.
  grain: One entry per fee charged.
  distinguish_by:
  - fee_type
  - entry_date
  - related_entry_id
  fields:
    entry_date: date charged
    amount: fee charged
    fee_type: kind of fee
    related_entry_id: redemption a telephone fee follows
  account: credit_fees
  direction: in
  triggers: []
- type: credit_fee_refund
  target: credit_ledger
  meaning: A credit service fee is refunded.
  grain: One entry per fee refunded.
  distinguish_by:
  - reversed_entry_id
  fields:
    entry_date: date refunded
    amount: fee refunded
    reversed_entry_id: fee entry refunded
    fee_type: kind of fee refunded
  account: credit_fees
  direction: out
  triggers: []
- type: credit_refund
  target: credit_holdings
  mutation:
    transition:
      from: active
      to: refunded
  meaning: The remaining value of the credit is paid out in cash.
  grain: One per credit.
  fields:
    closed_date: date refunded
  triggers:
  - event: credit:credit_refund_payout
    map:
      entry_date: closed_date
- type: credit_refund_payout
  target: credit_ledger
  meaning: Credit value leaves the credit as a cash payment.
  grain: One entry per refunded credit.
  distinguish_by:
  - refund_ground
  fields:
    entry_date: date paid
    amount: value removed from the credit
    refund_ground: ground of refund
  account: credit_balance
  direction: out
  triggers: []
- type: credit_name_correction
  target: credit_holdings
  mutation: update
  meaning: The traveler name on the credit is corrected.
  grain: One row per credit (the credit record itself).
  fields:
    traveler_name: corrected name
  triggers: []
measures:
- id: credit_msr_service_recovery_in_last_12_months
  window: Rolling 365 calendar days ending on, and including, the date the new certificate would be issued.
  measure: Count of credit holdings of the same customer with issue_reason service_recovery and issue_date inside
    the window, whatever their status, excluding voided ones.
- id: credit_msr_credits_on_ticket
  window: The ticket being paid, from its first redemption to the moment of the new redemption.
  measure: Count of distinct credits with a credit_redemption entry whose applied_ticket_number is that ticket,
    less those whose redemption was reversed.
policies:
- id: credit_agg_multi_holding
  subject:
  - credit_issue
  rule: A customer may hold any number of credits and vouchers of any instrument at the same time; each credit is
    a separate record with its own number, value and expiry_date, and credits are never merged into one another.
  eligibility: []
  params:
    max_per_customer: null
- id: credit_agg_combination
  subject:
  - credit_redemption
  - credit_balance_forfeit
  rule: Several credits may pay for the same ticket, up to max_credits_per_ticket credits as counted by credit_msr_credits_on_ticket,
    but only credits whose combinable_with_other_credits is true may be combined; a credit whose combinable_with_other_credits
    is false must be the only credit on the ticket. Unless the customer names the credits and the order, credits
    are applied in order of earliest expiry_date first and, for equal dates, lowest remaining_value first, each
    drawing as much of the eligible amount as it holds. Credits never combine with an award or miles-plus-cash payment
    on the same ticket, and a credit is never applied to another customer's credit or converted into miles. The
    eligible amount a credit may pay is the base fare, plus the taxes when usable_for_taxes is true, plus seat and
    upgrade fees when usable_for_seat_and_upgrade_fees is true; bag fees are never payable with credit value.
  eligibility: []
  params:
    max_credits_per_ticket: 5
  measures:
  - credit_msr_credits_on_ticket
- id: credit_issuance
  subject:
  - credit_issue
  - credit_value_load
  - credit_activate
  - credit_void
  rule: 'The instrument is fixed by the issue_reason and each instrument''s entry_gate: exchange residuals become
    a Crestline Residual Travel Credit, voluntary and involuntary cancellations a Crestline Flight Credit, a refund
    taken as credit a Crestline Trip Credit, service recovery a Crestline Service Recovery eCertificate, irregular-operations
    goodwill a Crestline Disruption Voucher and denied-boarding compensation a Crestline Denied Boarding Voucher.
    A credit_redeposit returns value from a refunded or cancelled ticket that was paid with a credit, and is issued
    as the same instrument as the credit that paid; when reissue_keeps_original_expiry is true it keeps that credit''s
    expiry_date. Every credit is issued in the traveler_name of the passenger on the source ticket. The face value
    is rounded by face_value_rounding, and a value below minimum_face_value_usd is not issued at all. The expiry_date
    is the expiry anchor plus validity_months calendar months, where the anchor is the original_ticket_issue_date
    when expiry_anchor is original_ticket_issue and the issue_date when it is credit_issue; adding months keeps
    the day-of-month and falls back to the last day of the month when that day does not exist. Issuing a credit
    loads its face value in one load entry. A credit whose activation_mode is automatic becomes active immediately
    after the load; a voucher whose activation_mode is passenger_acceptance becomes active only when the passenger
    accepts it in place of cash. A voucher can be accepted only within acceptance_window_days calendar days after
    the voucher was issued. The acceptance window is counted in calendar days from the issue_date, and acceptance
    on the last day of the window is accepted; a voucher not accepted by then is voided and the cash compensation
    is paid under the ticket charter instead. A credit issued in error may be voided only while it is still issued,
    before any use.'
  eligibility:
  - id: acceptance_window
    applies_to:
    - credit_activate
    kind: time
    condition: A voucher can be accepted only within acceptance_window_days calendar days after the voucher was
      issued.
    evidence_fields:
    - credit_holdings.credit_id
    - credit_holdings.issue_date
    - credit_holdings.variant_name
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - credit_holdings.credit_id
      action_bindings:
        credit_holdings.credit_id: credit_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the voucher was issued
      anchor_source: credit_holdings.issue_date
      relation: not_after
      duration_source: variants.acceptance_window_days
      unit: calendar_days
      counting_rule: The acceptance window is counted in calendar days from the issue_date, and acceptance on the
        last day of the window is accepted
      boundary: inclusive
  params:
    per_tier:
      Crestline Residual Travel Credit:
        validity_months: =validity_months
        expiry_anchor: =expiry_anchor
        minimum_face_value_usd: =minimum_face_value_usd
        face_value_rounding: =face_value_rounding
        activation_mode: =activation_mode
        acceptance_window_days: =acceptance_window_days
        reissue_keeps_original_expiry: =reissue_keeps_original_expiry
      Crestline Flight Credit:
        validity_months: =validity_months
        expiry_anchor: =expiry_anchor
        minimum_face_value_usd: =minimum_face_value_usd
        face_value_rounding: =face_value_rounding
        activation_mode: =activation_mode
        acceptance_window_days: =acceptance_window_days
        reissue_keeps_original_expiry: =reissue_keeps_original_expiry
      Crestline Trip Credit:
        validity_months: =validity_months
        expiry_anchor: =expiry_anchor
        minimum_face_value_usd: =minimum_face_value_usd
        face_value_rounding: =face_value_rounding
        activation_mode: =activation_mode
        acceptance_window_days: =acceptance_window_days
        reissue_keeps_original_expiry: =reissue_keeps_original_expiry
      Crestline Service Recovery eCertificate:
        validity_months: =validity_months
        expiry_anchor: =expiry_anchor
        minimum_face_value_usd: =minimum_face_value_usd
        face_value_rounding: =face_value_rounding
        activation_mode: =activation_mode
        acceptance_window_days: =acceptance_window_days
        reissue_keeps_original_expiry: =reissue_keeps_original_expiry
      Crestline Disruption Voucher:
        validity_months: =validity_months
        expiry_anchor: =expiry_anchor
        minimum_face_value_usd: =minimum_face_value_usd
        face_value_rounding: =face_value_rounding
        activation_mode: =activation_mode
        acceptance_window_days: =acceptance_window_days
        reissue_keeps_original_expiry: =reissue_keeps_original_expiry
      Crestline Denied Boarding Voucher:
        validity_months: =validity_months
        expiry_anchor: =expiry_anchor
        minimum_face_value_usd: =minimum_face_value_usd
        face_value_rounding: =face_value_rounding
        activation_mode: =activation_mode
        acceptance_window_days: =acceptance_window_days
        reissue_keeps_original_expiry: =reissue_keeps_original_expiry
- id: credit_redemption_rules
  subject:
  - credit_redemption
  - credit_balance_forfeit
  - credit_deplete
  - credit_service_fee
  rule: 'A credit can be redeemed only while its status is active. A credit can be redeemed only on or before its
    expiry date as recorded on the credit, plus redemption_grace_days. The expiry date is inclusive, so a booking
    made on the expiry_date itself is accepted, counted in calendar days in US Central time. When travel_completion_required_by_expiry
    is true the first flight of the ticket paid must also depart on or before the expiry_date; otherwise travel
    may take place after it. The passenger ticketed must satisfy the beneficiary_scope: named_traveler_only requires
    the passenger to be the traveler_name on the credit, holder_reservation requires the traveler_name to be ticketed
    on the same reservation, and anyone allows any passenger; no credit pays for more than max_beneficiaries_per_credit
    distinct passengers. A credit may pay a companion ticket only when usable_for_companion_ticket is true, and
    may never pay a partner-operated ticket when usable_on_partner_flights is false. A redemption through the reservations
    call center carries phone_redemption_fee per ticket, charged as a separate fee entry linked to the redemption,
    unless online_redemption_permitted is false for the instrument or the customer''s Summit tier has credit_service_fees_waived
    set to true in the loyalty charter. When a redemption uses less than the remaining_value, the remainder stays
    on the credit when remaining_balance_on_partial_use is retain and is forfeited in a separate forfeit entry when
    it is forfeit. When the remaining_value reaches zero the credit becomes depleted.'
  eligibility:
  - id: redeem_active
    applies_to:
    - credit_redemption
    - credit_balance_forfeit
    kind: state
    condition: A credit can be redeemed only while its status is active.
    evidence_fields:
    - credit_holdings.credit_id
    - credit_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - credit_holdings.credit_id
      action_bindings:
        credit_holdings.credit_id: credit_id
    state_contract:
      field: credit_holdings.status
      allowed:
      - active
  - id: redeem_by_expiry
    applies_to:
    - credit_redemption
    kind: time
    condition: A credit can be redeemed only on or before its expiry date as recorded on the credit, plus redemption_grace_days.
    evidence_fields:
    - credit_holdings.credit_id
    - credit_holdings.expiry_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - credit_holdings.credit_id
      action_bindings:
        credit_holdings.credit_id: credit_id
    temporal_basis:
      clock: frozen_time
      anchor_event: its expiry date as recorded on the credit
      anchor_source: credit_holdings.expiry_date
      relation: not_after
      duration_source: params.redemption_grace_days
      unit: calendar_days
      counting_rule: The expiry date is inclusive, so a booking made on the expiry_date itself is accepted, counted
        in calendar days in US Central time.
      boundary: inclusive
  params:
    redemption_grace_days: 0
    per_tier:
      Crestline Residual Travel Credit:
        travel_completion_required_by_expiry: =travel_completion_required_by_expiry
        beneficiary_scope: =beneficiary_scope
        max_beneficiaries_per_credit: =max_beneficiaries_per_credit
        remaining_balance_on_partial_use: =remaining_balance_on_partial_use
        usable_for_companion_ticket: =usable_for_companion_ticket
        usable_on_partner_flights: =usable_on_partner_flights
        online_redemption_permitted: =online_redemption_permitted
        phone_redemption_fee: =phone_redemption_fee
        usable_for_taxes: =usable_for_taxes
        usable_for_seat_and_upgrade_fees: =usable_for_seat_and_upgrade_fees
        usable_for_bag_fees: =usable_for_bag_fees
        combinable_with_miles_payment: =combinable_with_miles_payment
      Crestline Flight Credit:
        travel_completion_required_by_expiry: =travel_completion_required_by_expiry
        beneficiary_scope: =beneficiary_scope
        max_beneficiaries_per_credit: =max_beneficiaries_per_credit
        remaining_balance_on_partial_use: =remaining_balance_on_partial_use
        usable_for_companion_ticket: =usable_for_companion_ticket
        usable_on_partner_flights: =usable_on_partner_flights
