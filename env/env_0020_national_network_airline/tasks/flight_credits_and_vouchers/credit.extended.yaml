    tp_fee_basis: "The telephone-fee basis is small_ticket_percent percent of the value the credit paid toward that ticket when that value is below small_ticket_usd, the lesser of the instrument's phone_redemption_fee and mid_ticket_percent percent of that value when it is at least small_ticket_usd but below mid_ticket_usd, and the instrument's phone_redemption_fee when it is at least mid_ticket_usd."
    tp_member_tier: "The telephone-fee member rate is gold_flyer_rate for a Summit Gold member with at least active_flight_accruals flight accruals posted to the Summit account in the last flight_window_months calendar months, silver_flyer_rate for a Summit Silver member with at least active_flight_accruals such flight accruals, and 1 for every other customer."
    tp_recent_flights: "A telephone-fee window of the last so many calendar months holds the entries dated fewer than that many whole calendar months before the date the telephone fee is booked, so it rolls back from that date and is not a count of completed calendar months."
    tp_member_rate: "The telephone-fee member rate is gold_flyer_rate for a Summit Gold member with at least active_flight_accruals flight accruals posted to the Summit account in the last flight_window_months calendar months, silver_flyer_rate for a Summit Silver member with at least active_flight_accruals such flight accruals, and 1 for every other customer."
    tp_redemption_date: "The telephone-fee billing-delay rate counts the calendar days from the date of the redemption to the date the telephone fee is booked, and is long_delay_rate when more than long_delay_days days have passed, short_delay_rate when at least short_delay_days and no more than long_delay_days days have passed, and 1 when fewer than short_delay_days days have passed."
    tp_delay_days: "The telephone-fee billing-delay rate counts the calendar days from the date of the redemption to the date the telephone fee is booked, and is long_delay_rate when more than long_delay_days days have passed, short_delay_rate when at least short_delay_days and no more than long_delay_days days have passed, and 1 when fewer than short_delay_days days have passed."
    tp_delay_rate: "The telephone-fee billing-delay rate counts the calendar days from the date of the redemption to the date the telephone fee is booked, and is long_delay_rate when more than long_delay_days days have passed, short_delay_rate when at least short_delay_days and no more than long_delay_days days have passed, and 1 when fewer than short_delay_days days have passed."
    tp_route_type: "The telephone-fee route rate is long_haul_rate when the ticket the redemption paid for is a long-haul international itinerary, short_haul_rate when it is a short-haul international itinerary, and 1 when it is domestic."
    tp_route_rate: "The telephone-fee route rate is long_haul_rate when the ticket the redemption paid for is a long-haul international itinerary, short_haul_rate when it is a short-haul international itinerary, and 1 when it is domestic."
    tp_card_accruals: "A telephone-fee window of the last so many calendar months holds the entries dated fewer than that many whole calendar months before the date the telephone fee is booked, so it rolls back from that date and is not a count of completed calendar months."
    tp_card_rate: "The telephone-fee card-spend rate counts the co-branded card partner accruals posted to the customer's Summit account in the last card_window_months calendar months, and is many_card_rate for at least many_card_accruals such accruals, some_card_rate for one or more but fewer than many_card_accruals, and 1 for none."
    tp_combined_rate: "The telephone fee is worked out in this order: first the telephone-fee basis is set from the value the credit paid toward the ticket of that redemption; then the telephone-fee member rate, billing-delay rate, route rate and card-spend rate are multiplied with one another into one combined rate; then the basis is multiplied once by that combined rate, and only that product is rounded to the nearest cent."
    result: "A redemption through the reservations call center is charged a telephone fee as a separate fee entry linked to that redemption, unless the instrument's online_redemption_permitted is false or the customer's Summit tier has credit_service_fees_waived set to true in the loyalty charter; a waived fee is not recorded."
  factors:
