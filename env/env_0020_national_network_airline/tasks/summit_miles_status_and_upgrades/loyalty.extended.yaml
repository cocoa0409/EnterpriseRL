  rule: A member qualifies for a tier when qualifying_dollars_ytd reaches that tier's qualifying_dollars_threshold
    within one calendar year; Summit Chairman additionally requires an invitation and is never reached by qualifying
    dollars alone. A tier reached during the year takes effect immediately, with tier_basis earned, and is valid
    through the last day of month tier_validity_end_month of the year tier_validity_year_offset years after the
    qualification year. At the end of each calendar year the member's tier for the new year is set from the qualifying
    dollars of the year just ended, then qualifying_dollars_ytd is reset to zero in one reset entry dated the first
    day of the new calendar year. A member who earned less than the current tier's threshold drops at most max_tier_drop_per_year
    tiers at that requalification, with tier_basis soft_landing, keeping the higher tier through its tier_valid_through
    date before the drop applies. A member of another airline's program may be granted Summit Silver, Summit Gold
    or Summit Platinum provisionally by status challenge when status_challenge_available is true for that tier,
    once per lifetime; the challenged tier is kept only when loyalty_msr_challenge_qualifying_dollars reaches status_challenge_mqd_requirement
    by challenge_end_date, which is status_challenge_days calendar days after the grant, and otherwise the member
    returns to the tier held before the challenge. A tier change never alters mile_balance, and a tier lower than
    the one currently held is never set before tier_valid_through has passed.
