# Product charter: Crestline Summit Loyalty Program (category key: loyalty).
# Policy constants live only here; the runtime never reads this file.
category: loyalty
display_name: Crestline Summit Loyalty Program
binding:
  holding_table: loyalty_holdings
  event_tables:
  - loyalty_activity
  - loyalty_upgrades
  status_field: status
  variant_field: variant_name
  quantity_fields:
    mile_balance: award_miles
    qualifying_dollars_ytd: qualifying_dollars
    upgrade_certificate_balance: upgrade_certificates
lifecycle:
  states:
  - enrolled
  - active
  - dormant
  - closed
  transitions:
  - from: enrolled
    to: active
    by: system
    means: The first mileage activity posts to a newly enrolled membership.
  - from: active
    to: dormant
    by: system
    means: The membership passed the inactivity period with no qualifying activity.
  - from: dormant
    to: active
    by: system
    means: New qualifying activity posts to a dormant membership.
  - from: enrolled
    to: closed
    by: user
    means: The member asks to close a membership that never had activity.
  - from: active
    to: closed
    by: user
    means: The member asks to close the membership and forfeit its balances.
  - from: dormant
    to: closed
    by: user
    means: The member asks to close a dormant membership.
accounts:
- key: award_miles
  unit: miles
  meaning: Redeemable Summit award miles in the membership; accruals, purchases, transfers in, redeposits and reinstatements
    add, redemptions, transfers out, reversals and forfeitures deduct.
- key: qualifying_dollars
  unit: USD
  meaning: Summit qualifying dollars earned in the current calendar year toward elite status; flown and retro-credited
    coupons add, the year-end reset deducts.
- key: upgrade_certificates
  unit: certificates
  meaning: Unused Summit Upgrade Certificates in the membership; choice-benefit issues add, certificates applied
    to upgrades and expired certificates deduct.
parameter_schema:
  qualifying_dollars_threshold: Qualifying dollars earned in one calendar year that qualify for the tier (USD)
  tier_validity_end_month: Calendar month whose last day ends the validity of a tier earned in a qualification year
    (integer, 1-12)
  tier_validity_year_offset: Years after the qualification year in which the tier validity ends (integer, years)
  max_tier_drop_per_year: Most tiers a member can fall at one annual requalification (integer, tiers)
  status_challenge_available: Whether this tier can be granted provisionally through a status challenge for members
    of another airline's program (boolean)
  status_challenge_mqd_requirement: Qualifying dollars that must be earned inside the challenge period to confirm
    a challenged tier (USD)
  status_challenge_days: Calendar days of the status challenge period from the day the challenge is granted (integer,
    calendar days)
  award_miles_per_dollar: Award miles earned per US dollar of eligible fare on a flown Crestline coupon (integer,
    miles per USD)
  partner_elite_bonus_percent: Elite bonus on miles earned from partner airline flights, as a percent of the partner's
    base miles (integer, percent)
  retro_credit_min_days_after_flight: Calendar days after the flight before a missing-flight claim is accepted,
    allowing automatic posting to complete (integer, calendar days)
  retro_credit_window_days: Calendar days after the flight date within which a missing Crestline flight may be claimed
    (integer, calendar days)
  retro_credit_partner_window_days: Calendar days after the activity date within which missing partner activity
    may be claimed (integer, calendar days)
  award_chart_saver_one_way: Saver award price per one-way passenger by award zone and cabin (mapping zone -> cabin
    -> miles)
  award_chart_standard_one_way: Standard (any-seat) award price per one-way passenger by award zone and cabin (mapping
    zone -> cabin -> miles)
  close_in_window_days: Calendar days before departure inside which an award booking is close-in (integer, calendar
    days)
  close_in_award_fee_usd: Fee per award ticket booked inside the close-in window (USD)
  award_phone_booking_fee_usd: Fee per award ticket booked through the reservations call center (USD)
  award_redeposit_fee_usd: Fee per award ticket to cancel it and redeposit its miles (USD)
  award_cancel_cutoff_hours_before_departure: Latest point for cancelling an award ticket with redeposit, counted
    back from its first scheduled departure (integer, elapsed hours)
  miles_expiry_applies: Whether the member's miles can expire through inactivity (boolean)
  inactivity_months_before_expiry: Calendar months without qualifying activity after which the membership becomes
    dormant and its miles expire (integer, months)
  miles_reinstatement_window_days: Calendar days after an inactivity expiry within which the expired miles may be
    reinstated (integer, calendar days)
  reinstatement_fee_ladder: Fee to reinstate expired miles, banded by the miles reinstated (list of {from_miles,
    to_miles, fee_usd}, bounds inclusive)
  transfer_increment_miles: Miles in each transfer must be a whole multiple of this number (integer, miles)
  min_transfer_miles: Smallest number of miles in one member-to-member transfer (integer, miles)
  transfer_fee_per_1000_miles_usd: Fee per 1,000 miles transferred, charged to the sender (USD)
  transfer_processing_fee_usd: Processing fee per transfer, charged to the sender (USD)
  max_transfer_out_per_calendar_year: Most miles a member may transfer out in one calendar year, counted by loyalty_msr_miles_transferred_out_this_year
    (integer, miles)
  purchase_increment_miles: Miles in each purchase must be a whole multiple of this number (integer, miles)
  min_miles_purchase: Smallest purchase of miles (integer, miles)
  miles_purchase_price_per_1000_usd: Price per 1,000 miles purchased (USD)
  max_miles_purchase_per_calendar_year: Most miles a member may purchase in one calendar year, counted by loyalty_msr_miles_purchased_this_year
    (integer, miles)
  complimentary_upgrade_eligible: Whether the member may request complimentary upgrades (boolean)
  complimentary_upgrade_window_hours: Hours before scheduled departure at which complimentary upgrade requests begin
    to clear (integer, elapsed hours)
  upgrade_priority_rank: Clearance order among waitlisted requests, 1 clearing first (integer, rank)
  companion_upgrade_permitted: Whether one companion on the same reservation is upgraded together with the member
    (boolean)
  upgrade_on_award_tickets: Whether complimentary upgrades and certificates may be used on award tickets (boolean)
  certificates_per_short_segment: Upgrade certificates consumed per domestic or short-haul international segment
    (integer, certificates)
  certificates_per_long_haul_segment: Upgrade certificates consumed per long-haul international segment (integer,
    certificates)
  certificate_validity_months: Calendar months an upgrade certificate stays valid after issue (integer, months)
  miles_upgrade_cost_short_segment: Miles per segment to upgrade with miles on segments up to the ticket charter's
    segment_length_threshold_miles (integer, miles)
  miles_upgrade_cost_long_segment: Miles per segment to upgrade with miles on longer segments (integer, miles)
  miles_upgrade_copay_usd: Cash co-pay per segment for an upgrade with miles (USD)
  choice_benefits_count: Choice-benefit selections earned for each qualification year at this tier (integer, selections)
  choice_upgrade_certificates_per_selection: Upgrade certificates given by one choice selection of upgrade_certificates
    (integer, certificates)
  choice_bonus_miles_per_selection: Bonus miles given by one choice selection of bonus_miles (integer, miles)
  choice_companion_certificate_available: Whether a companion certificate may be taken as a choice selection (boolean)
  choice_club_membership_available: Whether a one-year Summit Club Individual membership may be taken as a choice
    selection (boolean)
  elite_free_checked_bags: Checked bags included per direction for the member on any fare brand (integer, bags)
  complimentary_preferred_seating: Whether preferred seats are assigned free at booking (boolean)
  complimentary_extra_legroom_seating: Whether extra-legroom Main Plus seats are assigned free at booking (boolean)
  same_day_change_fee_waived: Whether the same-day confirmed change fee is waived (boolean)
  credit_service_fees_waived: Whether flight-credit extension, reinstatement and telephone redemption fees are waived
    (boolean)
