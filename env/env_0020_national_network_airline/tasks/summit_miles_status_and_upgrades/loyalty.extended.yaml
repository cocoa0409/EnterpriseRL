# ============================================================================
# extended_policies — the multi-factor calculation policies of this difficulty
# ============================================================================
extended_policies:
- id: loyalty_ext_retro_credit_miles
  base_policy_refs: [loyalty_retro_credit_claims, loyalty_flight_earning, loyalty_inactivity_expiry]
  overwrite:
  - base_policy: loyalty_retro_credit_claims
    superseded_clause: >-
      The retro credit earns exactly what the flight would have earned on its flight_date under the flight-earning
      rule, at the tier held on that date
    replaced_by: >-
      The miles a retro credit carries are its base miles plus five additions, each computed separately on the base
      miles or on the eligible fare and then added, never compounded on one another.
  trigger: state_due
  subject: [loyalty_retro_credit]
  computes: miles
  target_tool: post_retro_credit_03268362
  params:
    long_haul_bonus_miles: 1500
    short_haul_bonus_miles: 500
    returning_share_percent: 25
    returning_near_days: 90
    returning_far_days: 365
    returning_flat_miles: 1000
    app_booking_percent: 10
    web_booking_percent: 5
    premium_lounge_miles_per_usd: 1
    standard_lounge_miles_per_usd: 0.5
  rule: >-
    A flown Crestline segment that never posted to a Summit membership, because the ticket in the member's name
    carried no Summit membership, is credited by one retro credit entry, and this rule fixes the miles a retro
    credit carries. The segment credited is the flown coupon of the member's flown ticket that names no Summit
    membership, and its eligible fare is the base fare of that one-segment ticket. The standard retro credit
    carries base miles only: the eligible fare times the award_miles_per_dollar of the tier the member holds on
    the day the credit posts, rounded to the nearest whole mile with halves rounded up, and no bonus of any kind is
    added. The miles a retro credit carries are its base miles plus five additions, each computed separately on
    the base miles or on the eligible fare and then added, never compounded on one another. The retro cabin bonus
    follows the ticket's fare brand: a Crestline First ticket adds the premium_cabin_bonus_percent that the ticket
    charter sets for Crestline First, a Crestline Premium Economy ticket adds the premium_cabin_bonus_percent that
    the ticket charter sets for Crestline Premium Economy, and a ticket of any other fare brand adds no retro cabin
    bonus; the percent is taken of the base miles and rounded to the nearest whole mile with halves rounded up.
    The retro long-haul bonus follows the ticket's itinerary class: a long-haul international ticket adds
    long_haul_bonus_miles, a short-haul international ticket adds short_haul_bonus_miles, and a domestic ticket
    adds no retro long-haul bonus. The retro returning-member bonus follows the calendar days from the latest
    inactivity forfeiture entry on the membership to the flight date of the credited segment: a segment flown 0
    to returning_near_days days after that forfeiture adds returning_share_percent percent of the base miles
    rounded up to the next hundred miles, a segment flown more than returning_near_days and up to
    returning_far_days days after it adds a flat returning_flat_miles, and a segment flown before any inactivity
    forfeiture, more than returning_far_days days after one, or on a membership with no inactivity forfeiture adds
    no retro returning-member bonus. The retro booking bonus follows the channel the ticket was booked through: a
    ticket booked in the Crestline app adds app_booking_percent percent of the base miles, a ticket booked on the
    Crestline website adds web_booking_percent percent of the base miles, each rounded down to the whole mile, and
    a ticket booked through any other channel adds no retro booking bonus. The retro lounge bonus follows the
    member's Summit Club membership: an active Summit Club Executive, Summit Club Corporate or Summit Club
    Lifetime membership adds premium_lounge_miles_per_usd miles per dollar of eligible fare, an active Summit
    Club Essential, Summit Club Individual or Summit Club Individual Plus membership adds
    standard_lounge_miles_per_usd miles per dollar of eligible fare, each rounded down to the whole mile, and a
    member with no active Summit Club membership adds no retro lounge bonus. The retro credit carries no
    qualifying dollars itself; they are posted as their own entry for the credited segment.
  prerequisite: []
  cross_category:
  - category: ticket
    as: branch
    reads: [ticket_id, base_fare, variant_name, route_type, booking_channel, ticket_transactions.flight_date]
    note: The flown ticket naming no membership gives the eligible fare, and its fare brand, itinerary class and booking channel decide the retro cabin, long-haul and booking bonuses.
  - category: club
    as: branch
    reads: [variant_name, status]
    note: The member's Summit Club membership product and status decide the retro lounge bonus.
  compute:
  - retro_ticket: "CFIELD('ticket', 'ticket_id', membership_id=None, status='flown')"
  - fare: "CFIELD('ticket', 'base_fare', ticket_id=retro_ticket)"
  - base_miles: "int(fare * P('award_miles_per_dollar') + 0.5)"
  - brand: "CFIELD('ticket', 'variant_name', ticket_id=retro_ticket)"
  - cabin_bonus_pct: "CPARAM('ticket', 'premium_cabin_bonus_percent', ticket_id=retro_ticket) if brand == 'Crestline First' else (CPARAM('ticket', 'premium_cabin_bonus_percent', ticket_id=retro_ticket) if brand == 'Crestline Premium Economy' else 0)"
  - cabin_bonus: "int(base_miles * cabin_bonus_pct / 100 + 0.5)"
  - itinerary: "CFIELD('ticket', 'route_type', ticket_id=retro_ticket)"
  - long_haul_bonus: "K('long_haul_bonus_miles') if itinerary == 'long_haul_international' else (K('short_haul_bonus_miles') if itinerary == 'short_haul_international' else 0)"
  - flight_day: "XLATEST('ticket', 'ticket_transactions', 'flight_date', date_field='transaction_date', event_type='ticket_coupon_flown', ticket_id=retro_ticket)"
  - forfeitures: "COUNT('loyalty_activity', date_field='activity_date', event_type='loyalty_miles_expiry', forfeit_reason='inactivity')"
  - last_forfeiture: "LATEST('loyalty_activity', 'activity_date', date_field='activity_date', event_type='loyalty_miles_expiry', forfeit_reason='inactivity')"
  - days_after_forfeiture: "DAYS(last_forfeiture, flight_day) if forfeitures > 0 else -1"
  - returning_bonus: "(-((-(base_miles * K('returning_share_percent') / 100)) // 100)) * 100 if (days_after_forfeiture >= 0 and days_after_forfeiture <= K('returning_near_days')) else (K('returning_flat_miles') if (days_after_forfeiture > K('returning_near_days') and days_after_forfeiture <= K('returning_far_days')) else 0)"
  - channel: "CFIELD('ticket', 'booking_channel', ticket_id=retro_ticket)"
  - booking_bonus: "int(base_miles * K('app_booking_percent') / 100) if channel == 'crestline_app' else (int(base_miles * K('web_booking_percent') / 100) if channel == 'crestline_website' else 0)"
  - club_product: "CFIELD('club', 'variant_name')"
  - club_state: "CFIELD('club', 'status')"
  - lounge_bonus: "int(fare * K('premium_lounge_miles_per_usd')) if ((club_product == 'Summit Club Executive' or club_product == 'Summit Club Corporate' or club_product == 'Summit Club Lifetime') and club_state == 'active') else (int(fare * K('standard_lounge_miles_per_usd')) if ((club_product == 'Summit Club Essential' or club_product == 'Summit Club Individual' or club_product == 'Summit Club Individual Plus') and club_state == 'active') else 0)"
  - result: "int(base_miles + cabin_bonus + long_haul_bonus + returning_bonus + booking_bonus + lounge_bonus)"
  compute_basis:
    retro_ticket: "The segment credited is the flown coupon of the member's flown ticket that names no Summit membership, and its eligible fare is the base fare of that one-segment ticket."
    fare: "The segment credited is the flown coupon of the member's flown ticket that names no Summit membership, and its eligible fare is the base fare of that one-segment ticket."
    base_miles: "The standard retro credit carries base miles only: the eligible fare times the award_miles_per_dollar of the tier the member holds on the day the credit posts, rounded to the nearest whole mile with halves rounded up, and no bonus of any kind is added."
    brand: "The retro cabin bonus follows the ticket's fare brand"
    cabin_bonus_pct: "a Crestline First ticket adds the premium_cabin_bonus_percent that the ticket charter sets for Crestline First, a Crestline Premium Economy ticket adds the premium_cabin_bonus_percent that the ticket charter sets for Crestline Premium Economy, and a ticket of any other fare brand adds no retro cabin bonus"
    cabin_bonus: "the percent is taken of the base miles and rounded to the nearest whole mile with halves rounded up."
    itinerary: "The retro long-haul bonus follows the ticket's itinerary class"
    long_haul_bonus: "a long-haul international ticket adds long_haul_bonus_miles, a short-haul international ticket adds short_haul_bonus_miles, and a domestic ticket adds no retro long-haul bonus."
    flight_day: "The retro returning-member bonus follows the calendar days from the latest inactivity forfeiture entry on the membership to the flight date of the credited segment"
    forfeitures: "or on a membership with no inactivity forfeiture adds no retro returning-member bonus."
    last_forfeiture: "The retro returning-member bonus follows the calendar days from the latest inactivity forfeiture entry on the membership to the flight date of the credited segment"
    days_after_forfeiture: "The retro returning-member bonus follows the calendar days from the latest inactivity forfeiture entry on the membership to the flight date of the credited segment"
    returning_bonus: "a segment flown 0 to returning_near_days days after that forfeiture adds returning_share_percent percent of the base miles rounded up to the next hundred miles, a segment flown more than returning_near_days and up to returning_far_days days after it adds a flat returning_flat_miles, and a segment flown before any inactivity forfeiture, more than returning_far_days days after one, or on a membership with no inactivity forfeiture adds no retro returning-member bonus."
    channel: "The retro booking bonus follows the channel the ticket was booked through"
    booking_bonus: "a ticket booked in the Crestline app adds app_booking_percent percent of the base miles, a ticket booked on the Crestline website adds web_booking_percent percent of the base miles, each rounded down to the whole mile, and a ticket booked through any other channel adds no retro booking bonus."
    club_product: "The retro lounge bonus follows the member's Summit Club membership"
    club_state: "The retro lounge bonus follows the member's Summit Club membership"
    lounge_bonus: "an active Summit Club Executive, Summit Club Corporate or Summit Club Lifetime membership adds premium_lounge_miles_per_usd miles per dollar of eligible fare, an active Summit Club Essential, Summit Club Individual or Summit Club Individual Plus membership adds standard_lounge_miles_per_usd miles per dollar of eligible fare, each rounded down to the whole mile, and a member with no active Summit Club membership adds no retro lounge bonus."
    result: "The miles a retro credit carries are its base miles plus five additions, each computed separately on the base miles or on the eligible fare and then added, never compounded on one another."
  factors:
  - id: retro_cabin_bonus
    effect: parameter
    decides: cabin_bonus_pct
    bindings: [brand, cabin_bonus_pct, cabin_bonus]
    ladder:
    - when: "the credited ticket's fare brand is Crestline First"
      value: "the premium_cabin_bonus_percent the ticket charter sets for Crestline First, of the base miles"
    - when: "the credited ticket's fare brand is Crestline Premium Economy"
      value: "the premium_cabin_bonus_percent the ticket charter sets for Crestline Premium Economy, of the base miles"
    - when: "otherwise"
      value: "no retro cabin bonus (0 percent)"
    baseline:
      cabin_bonus_pct: "0"
    evidence: [cross_category]
    cross_difficulty: ticket
  - id: retro_long_haul_bonus
    effect: parameter
    decides: long_haul_bonus
    bindings: [itinerary, long_haul_bonus]
    ladder:
    - when: "the credited ticket's itinerary class is long-haul international"
      value: "K('long_haul_bonus_miles')"
    - when: "the credited ticket's itinerary class is short-haul international"
      value: "K('short_haul_bonus_miles')"
    - when: "otherwise (a domestic ticket)"
      value: "0"
    baseline:
      long_haul_bonus: "0"
    evidence: [cross_category]
    cross_difficulty: ticket
  - id: retro_returning_member_bonus
    effect: method
    decides: returning_bonus
    bindings: [flight_day, forfeitures, last_forfeiture, days_after_forfeiture, returning_bonus]
    ladder:
    - when: "the credited segment was flown 0 to returning_near_days calendar days after the latest inactivity forfeiture entry on the membership"
      method: "returning_share_percent percent of the base miles, rounded up to the next hundred miles"
    - when: "the credited segment was flown more than returning_near_days and up to returning_far_days calendar days after that forfeiture"
      method: "a flat returning_flat_miles, independent of the base miles"
    - when: "otherwise (no inactivity forfeiture on the membership, a flight before it, or more than returning_far_days days after it)"
      method: "no returning-member bonus is computed"
    baseline:
      returning_bonus: "0"
    evidence: [history, date]
    cross_difficulty: null
  - id: retro_booking_bonus
    effect: parameter
    decides: booking_bonus
    bindings: [channel, booking_bonus]
    ladder:
    - when: "the credited ticket was booked in the Crestline app"
      value: "K('app_booking_percent') percent of the base miles, rounded down"
    - when: "the credited ticket was booked on the Crestline website"
      value: "K('web_booking_percent') percent of the base miles, rounded down"
    - when: "otherwise"
      value: "0"
    baseline:
      booking_bonus: "0"
    evidence: [cross_category]
    cross_difficulty: ticket
  - id: retro_lounge_bonus
    effect: parameter
    decides: lounge_bonus
    bindings: [club_product, club_state, lounge_bonus]
    ladder:
    - when: "the member's Summit Club membership is Summit Club Executive, Summit Club Corporate or Summit Club Lifetime AND its status is active"
      value: "K('premium_lounge_miles_per_usd') miles per dollar of eligible fare, rounded down"
    - when: "the member's Summit Club membership is Summit Club Essential, Summit Club Individual or Summit Club Individual Plus AND its status is active"
      value: "K('standard_lounge_miles_per_usd') miles per dollar of eligible fare, rounded down"
    - when: "otherwise (no active Summit Club membership)"
      value: "0"
    baseline:
      lounge_bonus: "0"
    evidence: [cross_category]
    cross_difficulty: null
  baseline:
    rule: >-
      The segment credited is the flown coupon of the member's flown ticket that names no Summit membership, and its
      eligible fare is the base fare of that one-segment ticket. The standard retro credit carries base miles only:
      the eligible fare times the award_miles_per_dollar of the tier the member holds on the day the credit posts,
      rounded to the nearest whole mile with halves rounded up, and no bonus of any kind is added.
    params: [award_miles_per_dollar]
  inputs:
    history:
    - {table: loyalty_activity, aggregate: count, field: loyalty_activity_id, filters: {event_type: loyalty_miles_expiry, forfeit_reason: inactivity}}
    - {table: loyalty_activity, aggregate: latest, field: activity_date, filters: {event_type: loyalty_miles_expiry, forfeit_reason: inactivity}}
    - {category: ticket, table: ticket_transactions, aggregate: latest, field: flight_date, filters: {event_type: ticket_coupon_flown}}
    cross_category: [ticket, club]
- id: loyalty_ext_retro_segment_qualifying_dollars
  base_policy_refs: [loyalty_flight_earning, loyalty_retro_credit_claims, loyalty_inactivity_expiry]
  overwrite:
  - base_policy: loyalty_retro_credit_claims
    superseded_clause: >-
      The retro credit earns exactly what the flight would have earned on its flight_date under the
      flight-earning rule, at the tier held on that date
    replaced_by: >-
      The qualifying dollars a retro-credited segment posts, in place of what the flight would have earned,
      are worked from its share qualifying dollars by the rules below and rounded to the cent.
  trigger: state_due
  subject: [loyalty_mqd_accrual]
  computes: qualifying_dollars
  target_tool: post_segment_qualifying_dollars_d0ee7d28
  params:
    standard_qd_share_percent: 100
    premium_qd_uplift_percent: 25
    returning_near_days: 90
    returning_far_days: 365
    returning_near_multiplier: 1.5
    returning_near_minimum_usd: 500
    returning_far_bonus_usd: 250
    card_recency_months: 12
    long_haul_qd_bonus_usd: 150
    short_haul_qd_bonus_usd: 60
    premium_card_qd_percent: 10
    standard_card_qd_percent: 5
  rule: >-
    A segment credited by a retro credit posts its Summit qualifying dollars as its own qualifying-dollar entry,
    and this rule fixes the qualifying dollars a retro-credited segment posts. Qualifying dollars for a flown
    Crestline segment of a ticket that names no Summit membership are posted only after the membership's
    activity carries the retro credit entry for that segment, whose eligible fare they are computed on. The
    segment is the one named by the latest retro credit entry on the membership, and its eligible fare, ticket
    and flight date are the ones that entry records. The share qualifying dollars of the segment are its
    eligible fare times its qualifying share percent, rounded to the cent, and the qualifying share percent is
    standard_qd_share_percent. The standard qualifying-dollar posting is the share qualifying dollars, with no
    bonus added. The qualifying dollars a retro-credited segment posts, in place of what the flight would have
    earned, are worked from its share qualifying dollars by the rules below and rounded to the cent. The
    qualifying share percent follows the fare brand of the segment's ticket: a Crestline First or Crestline
    Premium Economy ticket takes its brand's status_credit_percent from the ticket charter plus
    premium_qd_uplift_percent percentage points, a Crestline Basic Economy ticket takes its brand's
    status_credit_percent from the ticket charter, and a ticket of any other fare brand takes
    standard_qd_share_percent percent. The returning-member treatment decides what the posting counts in place
    of the share qualifying dollars, by the calendar days from the latest inactivity forfeiture entry on the
    membership to the segment's flight date: a segment flown 0 to returning_near_days days after that forfeiture
    counts the greater of its share qualifying dollars multiplied by returning_near_multiplier and rounded down
    to the whole dollar, and its share qualifying dollars plus the flat returning_near_minimum_usd, a segment
    flown more than returning_near_days and up to returning_far_days days after it counts its share qualifying
    dollars plus the flat returning_far_bonus_usd, and any other segment, including one on a membership with no
    inactivity forfeiture, counts its share qualifying dollars unchanged. The route qualifying bonus is a flat
    amount added to the qualifying dollars the segment posts; it follows the itinerary class of the segment's
    ticket: a long-haul international ticket adds long_haul_qd_bonus_usd, a short-haul international ticket adds
    short_haul_qd_bonus_usd, and a domestic ticket adds no route qualifying bonus. The card qualifying bonus is
    a percent of the share qualifying dollars, rounded to the cent and added to the qualifying dollars the
    segment posts; it follows the Crestline co-branded card the member holds, shown by a companion certificate
    issued on a card anniversary, and how the segment's ticket was paid: a ticket paid by credit card of a
    member whose card anniversary certificate is a Crestline Companion Certificate First or Premium Economy
    issued within the last card_recency_months months adds premium_card_qd_percent percent, a ticket paid by
    credit card of a member whose card anniversary certificate is a Crestline Companion Certificate Main Cabin
    or Main Plus issued within the last card_recency_months months adds standard_card_qd_percent percent, and
    any other segment adds no card qualifying bonus.
  prerequisite:
  - problem: loyalty_ext_retro_credit_miles
    kind: value_input
    gate: segment_fare
    form: state
    policy_source: >-
      Qualifying dollars for a flown Crestline segment of a ticket that names no Summit membership are posted only after the membership's activity carries the retro credit entry for that segment, whose eligible fare they are computed on.
    condition: >-
      For the ticket_coupon_flown of a ticket in the member's name whose membership_id is empty, the membership's
      loyalty_activity holds a loyalty_retro_credit entry for the same source ticket and segment number, recording
      the segment's eligible fare and flight date.
    resolved_by: post_retro_credit_03268362
    effect: >-
      segment_fare, credited_ticket and segment_flight_day are read from that retro credit entry; while it does not
      stand they are empty and no qualifying-dollar figure exists for the segment.
  cross_category:
  - category: ticket
    as: branch
    reads: [variant_name, route_type]
    note: The fare brand and itinerary class of the retro-credited ticket decide the qualifying share and the route qualifying bonus.
  - category: companion
    as: branch
    reads: [variant_name, issue_source, issue_date]
    note: The member's card-anniversary companion certificate product and issue date decide the card qualifying bonus.
  compute:
  - credited_ticket: "LATEST('loyalty_activity', 'source_ticket_id', date_field='activity_date', event_type='loyalty_retro_credit')"
  - segment_fare: "LATEST('loyalty_activity', 'eligible_fare_usd', date_field='activity_date', event_type='loyalty_retro_credit')"
  - segment_flight_day: "LATEST('loyalty_activity', 'flight_date', date_field='activity_date', event_type='loyalty_retro_credit')"
  - segment_brand: "CFIELD('ticket', 'variant_name', ticket_id=credited_ticket)"
  - qd_share_pct: "CPARAM('ticket', 'status_credit_percent', ticket_id=credited_ticket) + K('premium_qd_uplift_percent') if (segment_brand == 'Crestline First' or segment_brand == 'Crestline Premium Economy') else (CPARAM('ticket', 'status_credit_percent', ticket_id=credited_ticket) if segment_brand == 'Crestline Basic Economy' else K('standard_qd_share_percent'))"
  - share_qd: "RND(segment_fare * qd_share_pct / 100, 2)"
  - qd_forfeitures: "COUNT('loyalty_activity', date_field='activity_date', event_type='loyalty_miles_expiry', forfeit_reason='inactivity')"
  - qd_last_forfeiture: "LATEST('loyalty_activity', 'activity_date', date_field='activity_date', event_type='loyalty_miles_expiry', forfeit_reason='inactivity')"
  - qd_days_after_forfeiture: "DAYS(qd_last_forfeiture, segment_flight_day) if qd_forfeitures > 0 else -1"
  - treated_qd: "MX(int(share_qd * K('returning_near_multiplier')), share_qd + K('returning_near_minimum_usd')) if (qd_days_after_forfeiture >= 0 and qd_days_after_forfeiture <= K('returning_near_days')) else (share_qd + K('returning_far_bonus_usd') if (qd_days_after_forfeiture > K('returning_near_days') and qd_days_after_forfeiture <= K('returning_far_days')) else share_qd)"
  - segment_itinerary: "CFIELD('ticket', 'route_type', ticket_id=credited_ticket)"
  - route_qd_bonus: "K('long_haul_qd_bonus_usd') if segment_itinerary == 'long_haul_international' else (K('short_haul_qd_bonus_usd') if segment_itinerary == 'short_haul_international' else 0)"
  - segment_payment: "CFIELD('ticket', 'payment_form', ticket_id=credited_ticket)"
  - card_certificate: "CFIELD('companion', 'variant_name', issue_source='cobrand_card_anniversary')"
  - card_certificate_issued: "CFIELD('companion', 'issue_date', issue_source='cobrand_card_anniversary')"
  - card_certificate_age: "MONTHS(card_certificate_issued, NOW) if card_certificate_issued else 999"
  - card_qd_pct: "K('premium_card_qd_percent') if (segment_payment == 'credit_card' and (card_certificate == 'Crestline Companion Certificate First' or card_certificate == 'Crestline Companion Certificate Premium Economy') and card_certificate_age < K('card_recency_months')) else (K('standard_card_qd_percent') if (segment_payment == 'credit_card' and (card_certificate == 'Crestline Companion Certificate Main Cabin' or card_certificate == 'Crestline Companion Certificate Main Plus') and card_certificate_age < K('card_recency_months')) else 0)"
  - card_qd_bonus: "RND(share_qd * card_qd_pct / 100, 2)"
  - result: "RND(treated_qd + route_qd_bonus + card_qd_bonus, 2)"
  compute_basis:
    credited_ticket: "The segment is the one named by the latest retro credit entry on the membership, and its eligible fare, ticket and flight date are the ones that entry records."
    segment_fare: "The segment is the one named by the latest retro credit entry on the membership, and its eligible fare, ticket and flight date are the ones that entry records."
    segment_flight_day: "The segment is the one named by the latest retro credit entry on the membership, and its eligible fare, ticket and flight date are the ones that entry records."
    segment_brand: "The qualifying share percent follows the fare brand of the segment's ticket"
    qd_share_pct: "a Crestline First or Crestline Premium Economy ticket takes its brand's status_credit_percent from the ticket charter plus premium_qd_uplift_percent percentage points, a Crestline Basic Economy ticket takes its brand's status_credit_percent from the ticket charter, and a ticket of any other fare brand takes standard_qd_share_percent percent."
    share_qd: "The share qualifying dollars of the segment are its eligible fare times its qualifying share percent, rounded to the cent"
    qd_forfeitures: "including one on a membership with no inactivity forfeiture, counts its share qualifying dollars unchanged."
    qd_last_forfeiture: "by the calendar days from the latest inactivity forfeiture entry on the membership to the segment's flight date"
    qd_days_after_forfeiture: "by the calendar days from the latest inactivity forfeiture entry on the membership to the segment's flight date"
    treated_qd: "a segment flown 0 to returning_near_days days after that forfeiture counts the greater of its share qualifying dollars multiplied by returning_near_multiplier and rounded down to the whole dollar, and its share qualifying dollars plus the flat returning_near_minimum_usd, a segment flown more than returning_near_days and up to returning_far_days days after it counts its share qualifying dollars plus the flat returning_far_bonus_usd, and any other segment, including one on a membership with no inactivity forfeiture, counts its share qualifying dollars unchanged."
    segment_itinerary: "it follows the itinerary class of the segment's ticket"
    route_qd_bonus: "a long-haul international ticket adds long_haul_qd_bonus_usd, a short-haul international ticket adds short_haul_qd_bonus_usd, and a domestic ticket adds no route qualifying bonus."
    segment_payment: "it follows the Crestline co-branded card the member holds, shown by a companion certificate issued on a card anniversary, and how the segment's ticket was paid"
    card_certificate: "it follows the Crestline co-branded card the member holds, shown by a companion certificate issued on a card anniversary, and how the segment's ticket was paid"
    card_certificate_issued: "it follows the Crestline co-branded card the member holds, shown by a companion certificate issued on a card anniversary, and how the segment's ticket was paid"
    card_certificate_age: "issued within the last card_recency_months months"
    card_qd_pct: "a ticket paid by credit card of a member whose card anniversary certificate is a Crestline Companion Certificate First or Premium Economy issued within the last card_recency_months months adds premium_card_qd_percent percent, a ticket paid by credit card of a member whose card anniversary certificate is a Crestline Companion Certificate Main Cabin or Main Plus issued within the last card_recency_months months adds standard_card_qd_percent percent, and any other segment adds no card qualifying bonus."
    card_qd_bonus: "The card qualifying bonus is a percent of the share qualifying dollars, rounded to the cent and added to the qualifying dollars the segment posts"
    result: "The qualifying dollars a retro-credited segment posts, in place of what the flight would have earned, are worked from its share qualifying dollars by the rules below and rounded to the cent."
  factors:
  - id: qualifying_share
    effect: parameter
    decides: qd_share_pct
    bindings: [segment_brand, qd_share_pct]
    ladder:
    - when: "the segment's ticket is Crestline First or Crestline Premium Economy"
      value: "a qualifying share percent of the brand's status_credit_percent from the ticket charter plus K('premium_qd_uplift_percent') points"
    - when: "the segment's ticket is Crestline Basic Economy"
      value: "a qualifying share percent of the brand's status_credit_percent from the ticket charter"
    - when: "otherwise"
      value: "a qualifying share percent of K('standard_qd_share_percent')"
    baseline:
      qd_share_pct: "K('standard_qd_share_percent')"
    evidence: [cross_category]
    cross_difficulty: ticket
  - id: returning_member_qualifying_treatment
    effect: method
    decides: treated_qd
    bindings: [qd_forfeitures, qd_last_forfeiture, qd_days_after_forfeiture, treated_qd]
    ladder:
    - when: "the segment was flown 0 to returning_near_days calendar days after the latest inactivity forfeiture entry on the membership"
      method: "the posting counts, in place of the share qualifying dollars, the greater of the share qualifying dollars times returning_near_multiplier rounded down to the whole dollar and the share qualifying dollars plus the flat returning_near_minimum_usd"
    - when: "the segment was flown more than returning_near_days and up to returning_far_days calendar days after that forfeiture"
      method: "the posting counts, in place of the share qualifying dollars, the share qualifying dollars plus the flat returning_far_bonus_usd"
    - when: "otherwise (no inactivity forfeiture, or the flight falls outside those spans)"
      method: "the posting counts the share qualifying dollars unchanged, to the cent"
    baseline:
      treated_qd: "share_qd"
    evidence: [history, date]
    cross_difficulty: null
  - id: route_qualifying_bonus
    effect: parameter
    decides: route_qd_bonus
    bindings: [segment_itinerary, route_qd_bonus]
    ladder:
    - when: "the segment's ticket is long-haul international"
      value: "the flat K('long_haul_qd_bonus_usd') added to the qualifying dollars the segment posts"
    - when: "the segment's ticket is short-haul international"
      value: "the flat K('short_haul_qd_bonus_usd') added to the qualifying dollars the segment posts"
    - when: "otherwise (domestic)"
      value: "nothing added"
    baseline:
      route_qd_bonus: "0"
    evidence: [cross_category]
    cross_difficulty: ticket
  - id: card_qualifying_bonus
    effect: parameter
    decides: card_qd_pct
    bindings: [segment_payment, card_certificate, card_certificate_issued, card_certificate_age, card_qd_pct, card_qd_bonus]
    ladder:
    - when: "the segment's ticket was paid by credit card AND the member's card-anniversary certificate is Crestline Companion Certificate First or Premium Economy AND it was issued within the last card_recency_months months"
      value: "K('premium_card_qd_percent') percent of the share qualifying dollars, rounded to the cent, added to the qualifying dollars the segment posts"
    - when: "the segment's ticket was paid by credit card AND the member's card-anniversary certificate is Crestline Companion Certificate Main Cabin or Main Plus AND it was issued within the last card_recency_months months"
      value: "K('standard_card_qd_percent') percent of the share qualifying dollars, rounded to the cent, added to the qualifying dollars the segment posts"
    - when: "otherwise"
      value: "nothing added"
    baseline:
      card_qd_pct: "0"
    evidence: [cross_category, date]
    cross_difficulty: companion
  baseline:
    rule: >-
      The segment is the one named by the latest retro credit entry on the membership, and its eligible fare,
      ticket and flight date are the ones that entry records. The share qualifying dollars of the segment are
      its eligible fare times its qualifying share percent, rounded to the cent, and the qualifying share
      percent is standard_qd_share_percent. The standard qualifying-dollar posting is the share qualifying
      dollars, with no bonus added.
    params: [standard_qd_share_percent]
  inputs:
    history:
    - {table: loyalty_activity, aggregate: latest, field: eligible_fare_usd, filters: {event_type: loyalty_retro_credit}}
    - {table: loyalty_activity, aggregate: count, field: loyalty_activity_id, filters: {event_type: loyalty_miles_expiry, forfeit_reason: inactivity}}
    cross_category: [ticket, companion]
- id: loyalty_ext_tier_requalification
  base_policy_refs: [loyalty_tier_qualification, loyalty_elite_travel_benefits]
  overwrite:
  - base_policy: loyalty_tier_qualification
    superseded_clause: >-
      A member qualifies for a tier when qualifying_dollars_ytd reaches that tier's qualifying_dollars_threshold
      within one calendar year
    replaced_by: >-
      A member qualifies for the highest tier whose qualifying_dollars_threshold the counted qualifying dollars of
      the calendar year reach, and never falls below the tier already held by this count; Summit Chairman stays
      reachable by invitation only.
  trigger: state_due
  subject: [loyalty_tier_change]
  computes: new_tier
  target_tool: record_tier_requalification_84e40849
  params:
    silver_threshold_usd: 4500
    gold_threshold_usd: 9000
    platinum_threshold_usd: 14000
    diamond_threshold_usd: 26000
    long_tenure_years: 10
    mid_tenure_years: 5
    long_tenure_multiplier: 1.1
    long_tenure_minimum_usd: 250
    mid_tenure_credit_usd: 200
    premium_card_headstart_usd: 1500
    standard_card_headstart_usd: 750
    headstart_recency_months: 12
    seat_and_bag_pass_credit_usd: 400
    single_pass_credit_usd: 200
    first_cabin_status_credit_usd: 500
    premium_economy_status_credit_usd: 250
    ancillary_high_usd: 250
    ancillary_low_usd: 75
    ancillary_high_credit_usd: 300
    ancillary_low_credit_usd: 150
  rule: >-
    During the calendar year the tier a member holds is set from the counted qualifying dollars of the year, and
    this rule fixes the tier a requalification records. The tier is not set until every Crestline segment the member flew in the calendar year carries its qualifying-dollar entry on the membership's activity. A member qualifies for the
    highest tier whose qualifying_dollars_threshold the counted qualifying dollars of the calendar year reach, and
    never falls below the tier already held by this count; Summit Chairman stays reachable by invitation only. The
    thresholds compared are the qualifying_dollars_threshold of each tier: silver_threshold_usd for Summit Silver,
    gold_threshold_usd for Summit Gold, platinum_threshold_usd for Summit Platinum and diamond_threshold_usd for
    Summit Diamond. The standard count is the qualifying dollars posted on the membership for the calendar year,
    as the membership's qualifying-dollar total shows them, taken as posted with nothing added. The counted
    qualifying dollars are the tenure-treated posted qualifying dollars plus four status credits, each added once
    and never multiplied. The tenure treatment follows the whole years since the membership's enrolled date: a membership enrolled long_tenure_years or more whole years ago counts the greater of its posted qualifying dollars multiplied by long_tenure_multiplier and rounded down to the whole dollar, and its posted qualifying dollars plus the flat long_tenure_minimum_usd, one enrolled mid_tenure_years to fewer than long_tenure_years whole years ago counts them as posted with the flat mid_tenure_credit_usd added, and a younger membership counts them as posted. The card headstart follows the companion certificate
    issued on a Crestline co-branded card anniversary: a Crestline Companion Certificate First or Premium Economy
    issued within the last headstart_recency_months months adds premium_card_headstart_usd, a Crestline Companion
    Certificate Main Cabin or Main Plus issued within the last headstart_recency_months months adds
    standard_card_headstart_usd, and a member with no such certificate issued in that span adds no card headstart.
    The pass status credit follows the member's seat and bag subscription: an active Crestline Seat and Bag Pass
    Domestic or Network adds seat_and_bag_pass_credit_usd, an active Crestline Bag Pass One or Two or Crestline
    Seat Pass Domestic or Network adds single_pass_credit_usd, and a member with no active subscription adds no
    pass status credit. The premium cabin status credit follows the coupons the member flew in the last twelve
    months: a member with at least one coupon flown in the First cabin adds first_cabin_status_credit_usd, a member
    whose premium coupons in that span were flown in Premium Economy only adds premium_economy_status_credit_usd,
    and a member with no premium-cabin coupon in that span adds no premium cabin status credit. The ancillary
    status credit follows the seat purchases and checked-bag charges paid on the member's tickets in the last
    twelve months: a total of ancillary_high_usd or more adds ancillary_high_credit_usd, a total of
    ancillary_low_usd up to less than ancillary_high_usd adds ancillary_low_credit_usd, and a smaller total adds no
    ancillary status credit. A tier reached takes effect at once with tier basis earned and is valid through the
    last day of month tier_validity_end_month of the year tier_validity_year_offset years after the qualification
    year.
  prerequisite:
  - problem: loyalty_ext_retro_segment_qualifying_dollars
    kind: value_input
    gate: posted_qd
    form: state
    policy_source: >-
      The tier is not set until every Crestline segment the member flew in the calendar year carries its qualifying-dollar entry on the membership's activity.
    condition: >-
      Every ticket_coupon_flown of the calendar year on a ticket in the member's name has a loyalty_mqd_accrual entry
      for the same source ticket and segment, so qualifying_dollars_ytd includes that segment's qualifying dollars.
    resolved_by: post_segment_qualifying_dollars_d0ee7d28
    effect: >-
      posted_qd (the membership's qualifying-dollar total) rises by the segment's qualifying dollars, which moves the
      counted qualifying dollars and can lift the tier reached.
  cross_category:
  - category: companion
    as: branch
    reads: [variant_name, issue_source, issue_date]
    note: The card-anniversary companion certificate and its issue date decide the card headstart.
  - category: pass
    as: branch
    reads: [variant_name, status]
    note: The member's seat and bag subscription decides the pass status credit.
  - category: ticket
    as: history
    reads: [ticket_transactions.cabin_flown, ticket_services.amount]
    note: The coupons flown and the seat and bag charges paid in the last twelve months decide the premium cabin and ancillary status credits.
  compute:
  - posted_qd: "F('qualifying_dollars_ytd')"
  - tenure_years: "MONTHS(F('enrolled_date'), NOW) // 12"
  - tenure_counted_qd: "MX(int(posted_qd * K('long_tenure_multiplier')), posted_qd + K('long_tenure_minimum_usd')) if tenure_years >= K('long_tenure_years') else (posted_qd + K('mid_tenure_credit_usd') if tenure_years >= K('mid_tenure_years') else posted_qd)"
  - headstart_certificate: "CFIELD('companion', 'variant_name', issue_source='cobrand_card_anniversary')"
  - headstart_certificate_issued: "CFIELD('companion', 'issue_date', issue_source='cobrand_card_anniversary')"
  - headstart_certificate_age: "MONTHS(headstart_certificate_issued, NOW) if headstart_certificate_issued else 999"
  - card_headstart: "K('premium_card_headstart_usd') if ((headstart_certificate == 'Crestline Companion Certificate First' or headstart_certificate == 'Crestline Companion Certificate Premium Economy') and headstart_certificate_age < K('headstart_recency_months')) else (K('standard_card_headstart_usd') if ((headstart_certificate == 'Crestline Companion Certificate Main Cabin' or headstart_certificate == 'Crestline Companion Certificate Main Plus') and headstart_certificate_age < K('headstart_recency_months')) else 0)"
  - subscription_product: "CFIELD('pass', 'variant_name')"
  - subscription_state: "CFIELD('pass', 'status')"
  - pass_status_credit: "K('seat_and_bag_pass_credit_usd') if ((subscription_product == 'Crestline Seat and Bag Pass Domestic' or subscription_product == 'Crestline Seat and Bag Pass Network') and subscription_state == 'active') else (K('single_pass_credit_usd') if ((subscription_product == 'Crestline Bag Pass One' or subscription_product == 'Crestline Bag Pass Two' or subscription_product == 'Crestline Seat Pass Domestic' or subscription_product == 'Crestline Seat Pass Network') and subscription_state == 'active') else 0)"
  - first_coupons: "XCOUNT('ticket', 'ticket_transactions', within_months=12, date_field='flight_date', event_type='ticket_coupon_flown', cabin_flown='first')"
  - premium_economy_coupons: "XCOUNT('ticket', 'ticket_transactions', within_months=12, date_field='flight_date', event_type='ticket_coupon_flown', cabin_flown='premium_economy')"
  - premium_cabin_credit: "K('first_cabin_status_credit_usd') if first_coupons > 0 else (K('premium_economy_status_credit_usd') if premium_economy_coupons > 0 else 0)"
  - ancillary_spend: "XSUM('ticket', 'ticket_services', 'amount', within_months=12, date_field='service_date', event_type='ticket_seat_purchase') + XSUM('ticket', 'ticket_services', 'amount', within_months=12, date_field='service_date', event_type='ticket_bag_charge')"
  - ancillary_credit: "K('ancillary_high_credit_usd') if ancillary_spend >= K('ancillary_high_usd') else (K('ancillary_low_credit_usd') if ancillary_spend >= K('ancillary_low_usd') else 0)"
  - counted_qd: "tenure_counted_qd + card_headstart + pass_status_credit + premium_cabin_credit + ancillary_credit"
  - reached_threshold: "K('diamond_threshold_usd') if counted_qd >= K('diamond_threshold_usd') else (K('platinum_threshold_usd') if counted_qd >= K('platinum_threshold_usd') else (K('gold_threshold_usd') if counted_qd >= K('gold_threshold_usd') else (K('silver_threshold_usd') if counted_qd >= K('silver_threshold_usd') else 0)))"
  - kept_threshold: "MX(reached_threshold, P('qualifying_dollars_threshold'))"
  - result: "'Summit Chairman' if F('variant_name') == 'Summit Chairman' else ('Summit Diamond' if kept_threshold >= K('diamond_threshold_usd') else ('Summit Platinum' if kept_threshold >= K('platinum_threshold_usd') else ('Summit Gold' if kept_threshold >= K('gold_threshold_usd') else ('Summit Silver' if kept_threshold >= K('silver_threshold_usd') else 'Summit Member'))))"
  compute_basis:
    posted_qd: "The standard count is the qualifying dollars posted on the membership for the calendar year, as the membership's qualifying-dollar total shows them, taken as posted with nothing added."
    tenure_years: "The tenure treatment follows the whole years since the membership's enrolled date"
    tenure_counted_qd: "a membership enrolled long_tenure_years or more whole years ago counts the greater of its posted qualifying dollars multiplied by long_tenure_multiplier and rounded down to the whole dollar, and its posted qualifying dollars plus the flat long_tenure_minimum_usd, one enrolled mid_tenure_years to fewer than long_tenure_years whole years ago counts them as posted with the flat mid_tenure_credit_usd added, and a younger membership counts them as posted."
    headstart_certificate: "The card headstart follows the companion certificate issued on a Crestline co-branded card anniversary"
    headstart_certificate_issued: "The card headstart follows the companion certificate issued on a Crestline co-branded card anniversary"
    headstart_certificate_age: "issued within the last headstart_recency_months months"
    card_headstart: "a Crestline Companion Certificate First or Premium Economy issued within the last headstart_recency_months months adds premium_card_headstart_usd, a Crestline Companion Certificate Main Cabin or Main Plus issued within the last headstart_recency_months months adds standard_card_headstart_usd, and a member with no such certificate issued in that span adds no card headstart."
    subscription_product: "The pass status credit follows the member's seat and bag subscription"
    subscription_state: "The pass status credit follows the member's seat and bag subscription"
    pass_status_credit: "an active Crestline Seat and Bag Pass Domestic or Network adds seat_and_bag_pass_credit_usd, an active Crestline Bag Pass One or Two or Crestline Seat Pass Domestic or Network adds single_pass_credit_usd, and a member with no active subscription adds no pass status credit."
    first_coupons: "The premium cabin status credit follows the coupons the member flew in the last twelve months"
    premium_economy_coupons: "The premium cabin status credit follows the coupons the member flew in the last twelve months"
    premium_cabin_credit: "a member with at least one coupon flown in the First cabin adds first_cabin_status_credit_usd, a member whose premium coupons in that span were flown in Premium Economy only adds premium_economy_status_credit_usd, and a member with no premium-cabin coupon in that span adds no premium cabin status credit."
    ancillary_spend: "The ancillary status credit follows the seat purchases and checked-bag charges paid on the member's tickets in the last twelve months"
    ancillary_credit: "a total of ancillary_high_usd or more adds ancillary_high_credit_usd, a total of ancillary_low_usd up to less than ancillary_high_usd adds ancillary_low_credit_usd, and a smaller total adds no ancillary status credit."
    counted_qd: "The counted qualifying dollars are the tenure-treated posted qualifying dollars plus four status credits, each added once and never multiplied."
    reached_threshold: "The thresholds compared are the qualifying_dollars_threshold of each tier: silver_threshold_usd for Summit Silver, gold_threshold_usd for Summit Gold, platinum_threshold_usd for Summit Platinum and diamond_threshold_usd for Summit Diamond."
    kept_threshold: "A member qualifies for the highest tier whose qualifying_dollars_threshold the counted qualifying dollars of the calendar year reach, and never falls below the tier already held by this count; Summit Chairman stays reachable by invitation only."
    result: "A member qualifies for the highest tier whose qualifying_dollars_threshold the counted qualifying dollars of the calendar year reach, and never falls below the tier already held by this count; Summit Chairman stays reachable by invitation only."
  factors:
  - id: tenure_treatment
    effect: method
    decides: tenure_counted_qd
    bindings: [tenure_years, tenure_counted_qd]
    ladder:
    - when: "the membership was enrolled long_tenure_years or more whole years ago"
      method: "the greater of posted qualifying dollars times long_tenure_multiplier rounded down to the whole dollar, and posted qualifying dollars plus the flat long_tenure_minimum_usd"
    - when: "the membership was enrolled mid_tenure_years to fewer than long_tenure_years whole years ago"
      method: "posted qualifying dollars plus the flat mid_tenure_credit_usd, no scaling"
    - when: "otherwise"
      method: "posted qualifying dollars counted as posted"
    baseline:
      tenure_counted_qd: "posted_qd"
    evidence: [date]
    cross_difficulty: null
  - id: card_headstart
    effect: parameter
    decides: card_headstart
    bindings: [headstart_certificate, headstart_certificate_issued, headstart_certificate_age, card_headstart]
    ladder:
    - when: "the card-anniversary companion certificate is Crestline Companion Certificate First or Premium Economy AND it was issued within the last headstart_recency_months months"
      value: "K('premium_card_headstart_usd')"
    - when: "the card-anniversary companion certificate is Crestline Companion Certificate Main Cabin or Main Plus AND it was issued within the last headstart_recency_months months"
      value: "K('standard_card_headstart_usd')"
    - when: "otherwise"
      value: "0"
    baseline:
      card_headstart: "0"
    evidence: [cross_category, date]
    cross_difficulty: companion
  - id: pass_status_credit
    effect: parameter
    decides: pass_status_credit
    bindings: [subscription_product, subscription_state, pass_status_credit]
    ladder:
    - when: "the member's subscription is Crestline Seat and Bag Pass Domestic or Network AND it is active"
      value: "K('seat_and_bag_pass_credit_usd')"
    - when: "the member's subscription is Crestline Bag Pass One or Two or Crestline Seat Pass Domestic or Network AND it is active"
      value: "K('single_pass_credit_usd')"
    - when: "otherwise (no active subscription)"
      value: "0"
    baseline:
      pass_status_credit: "0"
    evidence: [cross_category]
    cross_difficulty: null
  - id: premium_cabin_status_credit
    effect: parameter
    decides: premium_cabin_credit
    bindings: [first_coupons, premium_economy_coupons, premium_cabin_credit]
    ladder:
    - when: "at least one coupon was flown in the First cabin in the last twelve months"
      value: "K('first_cabin_status_credit_usd')"
    - when: "no First coupon but at least one Premium Economy coupon was flown in the last twelve months"
      value: "K('premium_economy_status_credit_usd')"
    - when: "otherwise"
      value: "0"
    baseline:
      premium_cabin_credit: "0"
    evidence: [cross_category, history]
    cross_difficulty: ticket
  - id: ancillary_status_credit
    effect: parameter
    decides: ancillary_credit
    bindings: [ancillary_spend, ancillary_credit]
    ladder:
    - when: "seat purchases and checked-bag charges of the last twelve months total ancillary_high_usd or more"
      value: "K('ancillary_high_credit_usd')"
    - when: "they total ancillary_low_usd up to less than ancillary_high_usd"
      value: "K('ancillary_low_credit_usd')"
    - when: "otherwise"
      value: "0"
    baseline:
      ancillary_credit: "0"
    evidence: [cross_category, history]
    cross_difficulty: ticket
  baseline:
    rule: >-
      A member qualifies for the highest tier whose qualifying_dollars_threshold the counted qualifying dollars of
      the calendar year reach, and never falls below the tier already held by this count; Summit Chairman stays
      reachable by invitation only. The thresholds compared are the qualifying_dollars_threshold of each tier:
      silver_threshold_usd for Summit Silver, gold_threshold_usd for Summit Gold, platinum_threshold_usd for Summit
      Platinum and diamond_threshold_usd for Summit Diamond. The standard count is the qualifying dollars posted on
      the membership for the calendar year, as the membership's qualifying-dollar total shows them, taken as posted
      with nothing added.
    params: [qualifying_dollars_threshold]
  inputs:
    history:
    - {category: ticket, table: ticket_transactions, aggregate: count, field: transaction_id, within_months: 12, filters: {event_type: ticket_coupon_flown}}
    - {category: ticket, table: ticket_services, aggregate: sum, field: amount, within_months: 12, filters: {event_type: ticket_seat_purchase}}
    - {category: ticket, table: ticket_services, aggregate: sum, field: amount, within_months: 12, filters: {event_type: ticket_bag_charge}}
    cross_category: [companion, pass, ticket]
- id: loyalty_ext_reinstatement_fee
  base_policy_refs: [loyalty_miles_reinstatement_rules, loyalty_inactivity_expiry]
  overwrite:
  - base_policy: loyalty_miles_reinstatement_rules
    superseded_clause: >-
      for a fee from reinstatement_fee_ladder chosen by the number of miles reinstated, the band bounds being
      inclusive
    replaced_by: >-
      The reinstatement fee is the fee to pay once the rules below have set it from the band fee, charged in
      whole dollars and cents.
  trigger: on_request
  subject: [loyalty_miles_reinstatement]
  computes: fee_usd
  target_tool: reinstate_expired_miles_d28241c8
  params:
    first_band_fee_usd: 150
    middle_band_from_miles: 30001
    middle_band_fee_usd: 250
    top_band_from_miles: 75001
    top_band_fee_usd: 400
    prompt_near_days: 30
    prompt_far_days: 90
    prompt_near_fee_usd: 50
    prompt_far_share_percent: 75
    returning_qd_floor_usd: 2500
    returning_high_reduction_usd: 60
    returning_low_reduction_usd: 30
    gold_plus_reduction_usd: 100
    silver_reduction_usd: 50
    premium_card_reduction_usd: 40
    standard_card_reduction_usd: 20
    card_recency_months: 12
    repeat_two_surcharge_usd: 100
    repeat_one_surcharge_usd: 50
  rule: >-
    Miles forfeited through inactivity are reinstated from the latest inactivity forfeiture entry on the
    membership, returning exactly its miles, and this rule fixes the reinstatement fee the member pays for it.
    The reinstatement fee is fixed only after the membership's tier is up to date with the qualifying dollars of
    every Crestline segment the member flew in the calendar year. The reinstatement fee is not fixed until every
    flown coupon of a ticket in the member's name carries a flight accrual or retro credit entry on the
    membership's activity. The band fee of the forfeiture is first_band_fee_usd, the first band of
    reinstatement_fee_ladder. The fee to pay is the band fee, and the standard reinstatement fee is the fee to
    pay, charged once for the forfeiture in dollars and cents. The reinstatement fee is the fee to pay once the
    rules below have set it from the band fee, charged in whole dollars and cents. The band fee follows the
    miles of the forfeiture entry, band bounds inclusive: middle_band_from_miles miles or more up to
    top_band_from_miles less one set a band fee of middle_band_fee_usd, top_band_from_miles miles or more set a
    band fee of top_band_fee_usd, and fewer miles keep the band fee of first_band_fee_usd. The prompt-request
    treatment sets the fee to pay from the band fee, before any amount is taken off it or added to it, by the
    calendar days from the forfeiture entry's date to the day of the reinstatement: a request up to
    prompt_near_days days after the forfeiture sets the fee to pay at the flat prompt_near_fee_usd, whatever
    band its miles fall in, a request more than prompt_near_days and up to prompt_far_days days after it sets
    the fee to pay at prompt_far_share_percent percent of the band fee rounded up to the whole dollar, and a
    later request keeps the fee to pay at the band fee. The returning-flyer reduction is taken off the fee to
    pay and never takes it below zero; it follows whether a Crestline flight credit, a flight accrual or retro
    credit entry, is dated after the forfeiture and the qualifying dollars the membership shows for the calendar
    year: such a credit together with qualifying dollars of returning_qd_floor_usd or more takes off
    returning_high_reduction_usd, such a credit with qualifying dollars below returning_qd_floor_usd takes off
    returning_low_reduction_usd, and a membership with no flight credit after the forfeiture takes nothing off.
    The elite reduction is taken off the fee to pay and never takes it below zero; it follows the tier the
    member holds and whether its validity runs through the day of the reinstatement: Summit Gold, Summit
    Platinum, Summit Diamond or Summit Chairman still valid takes off gold_plus_reduction_usd, Summit Silver
    still valid takes off silver_reduction_usd, and Summit Member takes nothing off. The card reduction is taken
    off the fee to pay and never takes it below zero; it follows the companion certificate issued on a Crestline
    co-branded card anniversary: a Crestline Companion Certificate First or Premium Economy issued within the
    last card_recency_months months takes off premium_card_reduction_usd, a Crestline Companion Certificate Main
    Cabin or Main Plus issued within the last card_recency_months months takes off standard_card_reduction_usd,
    and a member with no such certificate in that span takes nothing off. The repeat surcharge is added to the
    fee to pay once every amount taken off it has been taken off, and it is never itself reduced; it follows the
    earlier reinstatement entries on the membership: two or more add repeat_two_surcharge_usd, exactly one adds
    repeat_one_surcharge_usd, and none adds no repeat surcharge.
  prerequisite:
  - problem: loyalty_ext_tier_requalification
    kind: value_input
    gate: held_tier
    form: state
    policy_source: >-
      The reinstatement fee is fixed only after the membership's tier is up to date with the qualifying dollars of every Crestline segment the member flew in the calendar year.
    condition: >-
      loyalty_holdings.variant_name is the tier the counted qualifying dollars give once the qualifying dollars of
      every Crestline segment flown in the calendar year are posted (or the tier already held when that is higher),
      with tier_valid_through set for it.
    resolved_by: record_tier_requalification_84e40849
    effect: >-
      held_tier and held_tier_days_left become the requalified tier and its validity, which moves the elite
      reduction from nothing to the reduction of the tier reached.
  - problem: loyalty_ext_retro_credit_miles
    kind: value_input
    gate: credited_after_forfeiture
    form: state
    policy_source: >-
      The reinstatement fee is not fixed until every flown coupon of a ticket in the member's name carries a
      flight accrual or retro credit entry on the membership's activity.
    condition: >-
      Every ticket_coupon_flown of a ticket in the member's name has a loyalty_flight_accrual or loyalty_retro_credit
      entry for the same ticket and segment on the membership's loyalty_activity.
    resolved_by: post_retro_credit_03268362
    effect: >-
      A retro credit dated after the forfeiture makes credited_after_forfeiture true, which moves the returning-flyer
      reduction from nothing to one of its reductions.
  cross_category:
  - category: companion
    as: branch
    reads: [variant_name, issue_source, issue_date]
    note: The card-anniversary companion certificate and its issue date decide the card reduction.
  compute:
  - forfeited_miles: "LATEST('loyalty_activity', 'miles', date_field='activity_date', event_type='loyalty_miles_expiry', forfeit_reason='inactivity')"
  - forfeiture_day: "LATEST('loyalty_activity', 'activity_date', date_field='activity_date', event_type='loyalty_miles_expiry', forfeit_reason='inactivity')"
  - banded_fee: "K('top_band_fee_usd') if forfeited_miles >= K('top_band_from_miles') else (K('middle_band_fee_usd') if forfeited_miles >= K('middle_band_from_miles') else K('first_band_fee_usd'))"
  - days_since_forfeiture: "DAYS(forfeiture_day, NOW)"
  - prompt_fee: "K('prompt_near_fee_usd') if days_since_forfeiture <= K('prompt_near_days') else (-((-(banded_fee * K('prompt_far_share_percent') / 100)) // 1) if days_since_forfeiture <= K('prompt_far_days') else banded_fee)"
  - last_retro_day: "LATEST('loyalty_activity', 'activity_date', date_field='activity_date', event_type='loyalty_retro_credit')"
  - last_accrual_day: "LATEST('loyalty_activity', 'activity_date', date_field='activity_date', event_type='loyalty_flight_accrual')"
  - credited_after_forfeiture: "(last_retro_day != None and DAYS(forfeiture_day, last_retro_day) > 0) or (last_accrual_day != None and DAYS(forfeiture_day, last_accrual_day) > 0)"
  - year_qd: "F('qualifying_dollars_ytd')"
  - returning_reduction: "K('returning_high_reduction_usd') if (credited_after_forfeiture and year_qd >= K('returning_qd_floor_usd')) else (K('returning_low_reduction_usd') if (credited_after_forfeiture and year_qd < K('returning_qd_floor_usd')) else 0)"
  - held_tier: "F('variant_name')"
  - held_tier_days_left: "DAYS(NOW, F('tier_valid_through')) if F('tier_valid_through') else -1"
  - elite_reduction: "K('gold_plus_reduction_usd') if ((held_tier == 'Summit Gold' or held_tier == 'Summit Platinum' or held_tier == 'Summit Diamond' or held_tier == 'Summit Chairman') and held_tier_days_left >= 0) else (K('silver_reduction_usd') if (held_tier == 'Summit Silver' and held_tier_days_left >= 0) else 0)"
  - reduction_certificate: "CFIELD('companion', 'variant_name', issue_source='cobrand_card_anniversary')"
  - reduction_certificate_issued: "CFIELD('companion', 'issue_date', issue_source='cobrand_card_anniversary')"
  - reduction_certificate_age: "MONTHS(reduction_certificate_issued, NOW) if reduction_certificate_issued else 999"
  - card_reduction: "K('premium_card_reduction_usd') if ((reduction_certificate == 'Crestline Companion Certificate First' or reduction_certificate == 'Crestline Companion Certificate Premium Economy') and reduction_certificate_age < K('card_recency_months')) else (K('standard_card_reduction_usd') if ((reduction_certificate == 'Crestline Companion Certificate Main Cabin' or reduction_certificate == 'Crestline Companion Certificate Main Plus') and reduction_certificate_age < K('card_recency_months')) else 0)"
  - earlier_reinstatements: "COUNT('loyalty_activity', date_field='activity_date', event_type='loyalty_miles_reinstatement')"
  - repeat_surcharge: "K('repeat_two_surcharge_usd') if earlier_reinstatements >= 2 else (K('repeat_one_surcharge_usd') if earlier_reinstatements == 1 else 0)"
  - reduced_fee: "MX(0, prompt_fee - returning_reduction - elite_reduction - card_reduction)"
  - result: "RND(reduced_fee + repeat_surcharge, 2)"
  compute_basis:
    forfeited_miles: "Miles forfeited through inactivity are reinstated from the latest inactivity forfeiture entry on the membership, returning exactly its miles"
    forfeiture_day: "Miles forfeited through inactivity are reinstated from the latest inactivity forfeiture entry on the membership, returning exactly its miles"
    banded_fee: "The band fee follows the miles of the forfeiture entry, band bounds inclusive: middle_band_from_miles miles or more up to top_band_from_miles less one set a band fee of middle_band_fee_usd, top_band_from_miles miles or more set a band fee of top_band_fee_usd, and fewer miles keep the band fee of first_band_fee_usd."
    days_since_forfeiture: "by the calendar days from the forfeiture entry's date to the day of the reinstatement"
    prompt_fee: "a request up to prompt_near_days days after the forfeiture sets the fee to pay at the flat prompt_near_fee_usd, whatever band its miles fall in, a request more than prompt_near_days and up to prompt_far_days days after it sets the fee to pay at prompt_far_share_percent percent of the band fee rounded up to the whole dollar, and a later request keeps the fee to pay at the band fee."
    last_retro_day: "it follows whether a Crestline flight credit, a flight accrual or retro credit entry, is dated after the forfeiture"
    last_accrual_day: "it follows whether a Crestline flight credit, a flight accrual or retro credit entry, is dated after the forfeiture"
    credited_after_forfeiture: "it follows whether a Crestline flight credit, a flight accrual or retro credit entry, is dated after the forfeiture"
    year_qd: "and the qualifying dollars the membership shows for the calendar year"
    returning_reduction: "such a credit together with qualifying dollars of returning_qd_floor_usd or more takes off returning_high_reduction_usd, such a credit with qualifying dollars below returning_qd_floor_usd takes off returning_low_reduction_usd, and a membership with no flight credit after the forfeiture takes nothing off."
    held_tier: "it follows the tier the member holds and whether its validity runs through the day of the reinstatement"
    held_tier_days_left: "it follows the tier the member holds and whether its validity runs through the day of the reinstatement"
    elite_reduction: "Summit Gold, Summit Platinum, Summit Diamond or Summit Chairman still valid takes off gold_plus_reduction_usd, Summit Silver still valid takes off silver_reduction_usd, and Summit Member takes nothing off."
    reduction_certificate: "it follows the companion certificate issued on a Crestline co-branded card anniversary"
    reduction_certificate_issued: "it follows the companion certificate issued on a Crestline co-branded card anniversary"
    reduction_certificate_age: "issued within the last card_recency_months months"
    card_reduction: "a Crestline Companion Certificate First or Premium Economy issued within the last card_recency_months months takes off premium_card_reduction_usd, a Crestline Companion Certificate Main Cabin or Main Plus issued within the last card_recency_months months takes off standard_card_reduction_usd, and a member with no such certificate in that span takes nothing off."
    earlier_reinstatements: "it follows the earlier reinstatement entries on the membership"
    repeat_surcharge: "two or more add repeat_two_surcharge_usd, exactly one adds repeat_one_surcharge_usd, and none adds no repeat surcharge."
    reduced_fee: "is taken off the fee to pay and never takes it below zero"
    result: "The repeat surcharge is added to the fee to pay once every amount taken off it has been taken off, and it is never itself reduced"
  factors:
  - id: forfeiture_band
    effect: parameter
    decides: banded_fee
    bindings: [forfeited_miles, banded_fee]
    ladder:
    - when: "the forfeiture entry carries top_band_from_miles miles or more"
      value: "a band fee of K('top_band_fee_usd')"
    - when: "it carries middle_band_from_miles up to top_band_from_miles less one miles"
      value: "a band fee of K('middle_band_fee_usd')"
    - when: "otherwise"
      value: "a band fee of K('first_band_fee_usd')"
    baseline:
      banded_fee: "K('first_band_fee_usd')"
    evidence: [history]
    cross_difficulty: null
  - id: prompt_request_treatment
    effect: method
    decides: prompt_fee
    bindings: [forfeiture_day, days_since_forfeiture, prompt_fee]
    ladder:
    - when: "the reinstatement is requested up to prompt_near_days calendar days after the forfeiture entry"
      method: "the fee to pay is set from the band fee at the flat prompt_near_fee_usd, whatever the band, before any amount is taken off it or added to it"
    - when: "it is requested more than prompt_near_days and up to prompt_far_days days after it"
      method: "the fee to pay is set at prompt_far_share_percent percent of the band fee, rounded up to the whole dollar, before any amount is taken off it or added to it"
    - when: "otherwise"
      method: "the fee to pay is kept at the band fee"
    baseline:
      prompt_fee: "banded_fee"
    evidence: [history, date]
    cross_difficulty: null
  - id: returning_flyer_reduction
    effect: parameter
    decides: returning_reduction
    bindings: [last_retro_day, last_accrual_day, credited_after_forfeiture, year_qd, returning_reduction]
    ladder:
    - when: "a flight accrual or retro credit entry is dated after the forfeiture AND the calendar year's qualifying dollars are returning_qd_floor_usd or more"
      value: "K('returning_high_reduction_usd') taken off the fee to pay, never taking it below zero"
    - when: "a flight accrual or retro credit entry is dated after the forfeiture AND the calendar year's qualifying dollars are below returning_qd_floor_usd"
      value: "K('returning_low_reduction_usd') taken off the fee to pay, never taking it below zero"
    - when: "otherwise (no flight credit after the forfeiture)"
      value: "nothing taken off the fee to pay"
    baseline:
      returning_reduction: "0"
    evidence: [history]
    cross_difficulty: null
  - id: elite_reduction
    effect: parameter
    decides: elite_reduction
    bindings: [held_tier, held_tier_days_left, elite_reduction]
    ladder:
    - when: "the tier held is Summit Gold, Summit Platinum, Summit Diamond or Summit Chairman AND its validity runs through the day of the reinstatement"
      value: "K('gold_plus_reduction_usd') taken off the fee to pay, never taking it below zero"
    - when: "the tier held is Summit Silver AND its validity runs through the day of the reinstatement"
      value: "K('silver_reduction_usd') taken off the fee to pay, never taking it below zero"
    - when: "otherwise (Summit Member)"
      value: "nothing taken off the fee to pay"
    baseline:
      elite_reduction: "0"
    evidence: [tier_param, date]
    cross_difficulty: null
  - id: card_reduction
    effect: parameter
    decides: card_reduction
    bindings: [reduction_certificate, reduction_certificate_issued, reduction_certificate_age, card_reduction]
    ladder:
    - when: "the card-anniversary companion certificate is Crestline Companion Certificate First or Premium Economy AND it was issued within the last card_recency_months months"
      value: "K('premium_card_reduction_usd') taken off the fee to pay, never taking it below zero"
    - when: "the card-anniversary companion certificate is Crestline Companion Certificate Main Cabin or Main Plus AND it was issued within the last card_recency_months months"
      value: "K('standard_card_reduction_usd') taken off the fee to pay, never taking it below zero"
    - when: "otherwise"
      value: "nothing taken off the fee to pay"
    baseline:
      card_reduction: "0"
    evidence: [cross_category, date]
    cross_difficulty: companion
  - id: repeat_surcharge
    effect: parameter
    decides: repeat_surcharge
    bindings: [earlier_reinstatements, repeat_surcharge]
    ladder:
    - when: "two or more earlier reinstatement entries stand on the membership"
      value: "K('repeat_two_surcharge_usd') added to the fee to pay once every amount taken off it has been taken off; never itself reduced"
    - when: "exactly one earlier reinstatement entry stands on the membership"
      value: "K('repeat_one_surcharge_usd') added to the fee to pay once every amount taken off it has been taken off; never itself reduced"
    - when: "otherwise"
      value: "nothing added to the fee to pay"
    baseline:
      repeat_surcharge: "0"
    evidence: [history]
    cross_difficulty: null
  baseline:
    rule: >-
      The band fee of the forfeiture is first_band_fee_usd, the first band of reinstatement_fee_ladder. The
      fee to pay is the band fee, and the standard reinstatement fee is the fee to pay, charged once for the
      forfeiture in dollars and cents.
    params: [first_band_fee_usd, reinstatement_fee_ladder]
  inputs:
    history:
    - {table: loyalty_activity, aggregate: latest, field: miles, filters: {event_type: loyalty_miles_expiry, forfeit_reason: inactivity}}
    - {table: loyalty_activity, aggregate: latest, field: activity_date, filters: {event_type: loyalty_retro_credit}}
    - {table: loyalty_activity, aggregate: count, field: loyalty_activity_id, filters: {event_type: loyalty_miles_reinstatement}}
    cross_category: [companion]
- id: loyalty_ext_choice_bonus_miles
  base_policy_refs: [loyalty_choice_benefits, loyalty_goodwill_and_bonus]
  overwrite:
  - base_policy: loyalty_choice_benefits
    superseded_clause: >-
      bonus_miles, which credits choice_bonus_miles_per_selection miles
    replaced_by: >-
      The miles a choice-benefit bonus credit carries are the selection miles after the late-posting treatment,
      plus a card bonus, a flown-segment bonus and a tenure bonus, each added once and never multiplied.
  trigger: state_due
  subject: [loyalty_bonus_credit]
  computes: miles
  target_tool: post_choice_bonus_miles_029b6e8c
  params:
    late_far_days: 180
    late_near_days: 30
    late_far_multiplier: 1.25
    late_near_bonus_miles: 1000
    premium_card_bonus_percent: 10
    standard_card_bonus_percent: 5
    card_recency_months: 12
    many_segments: 12
    some_segments: 6
    many_segments_bonus_miles: 3000
    some_segments_bonus_miles: 1500
    long_tenure_years: 10
    mid_tenure_years: 5
    long_tenure_bonus_miles: 2000
    mid_tenure_bonus_miles: 1000
  rule: >-
    A choice-benefit selection of bonus miles is fulfilled by one bonus credit entry carrying the selection's
    qualification year, and this rule fixes the miles a choice-benefit bonus credit carries. The selection
    fulfilled is the latest selection of bonus miles on the membership. The standard bonus credit carries the
    selection miles only: the choice_bonus_miles_per_selection of the tier the member holds, with nothing added.
    The miles a choice-benefit bonus credit carries are the selection miles after the late-posting treatment,
    plus a card bonus, a flown-segment bonus and a tenure bonus, each added once and never multiplied. The
    late-posting treatment follows the calendar days from the selection's date to the day the credit posts: more
    than late_far_days days multiplies the selection miles by late_far_multiplier and rounds up to the next
    thousand miles, more than late_near_days and up to late_far_days days adds the flat late_near_bonus_miles to them, and a credit posted within late_near_days days carries the selection
    miles unchanged. The card bonus follows the companion certificate issued on a Crestline co-branded card
    anniversary: a Crestline Companion Certificate First or Premium Economy issued within the last
    card_recency_months months adds premium_card_bonus_percent percent of the selection miles, a Crestline
    Companion Certificate Main Cabin or Main Plus issued within the last card_recency_months months adds
    standard_card_bonus_percent percent of the selection miles, each rounded down to the whole mile, and a member
    with no such certificate in that span adds no card bonus. The flown-segment bonus follows the flight accrual
    entries posted on the membership in the last twelve months: many_segments or more add
    many_segments_bonus_miles, some_segments up to fewer than many_segments add some_segments_bonus_miles, and
    fewer add no flown-segment bonus. The tenure bonus follows the whole years since the membership's enrolled
    date: long_tenure_years or more add long_tenure_bonus_miles, mid_tenure_years to fewer than long_tenure_years
    add mid_tenure_bonus_miles, and a younger membership adds no tenure bonus.
  prerequisite: []
  cross_category:
  - category: companion
    as: branch
    reads: [variant_name, issue_source, issue_date]
    note: The card-anniversary companion certificate and its issue date decide the card bonus.
  compute:
  - bonus_selection_day: "LATEST('loyalty_activity', 'activity_date', date_field='activity_date', event_type='loyalty_choice_benefit_select', choice_benefit='bonus_miles')"
  - selection_miles: "P('choice_bonus_miles_per_selection')"
  - days_unposted: "DAYS(bonus_selection_day, NOW)"
  - treated_selection_miles: "(-((-(selection_miles * K('late_far_multiplier'))) // 1000)) * 1000 if days_unposted > K('late_far_days') else (selection_miles + K('late_near_bonus_miles') if days_unposted > K('late_near_days') else selection_miles)"
  - bonus_card_certificate: "CFIELD('companion', 'variant_name', issue_source='cobrand_card_anniversary')"
  - bonus_card_issued: "CFIELD('companion', 'issue_date', issue_source='cobrand_card_anniversary')"
  - bonus_card_age: "MONTHS(bonus_card_issued, NOW) if bonus_card_issued else 999"
  - card_bonus_pct: "K('premium_card_bonus_percent') if ((bonus_card_certificate == 'Crestline Companion Certificate First' or bonus_card_certificate == 'Crestline Companion Certificate Premium Economy') and bonus_card_age < K('card_recency_months')) else (K('standard_card_bonus_percent') if ((bonus_card_certificate == 'Crestline Companion Certificate Main Cabin' or bonus_card_certificate == 'Crestline Companion Certificate Main Plus') and bonus_card_age < K('card_recency_months')) else 0)"
  - card_bonus: "int(selection_miles * card_bonus_pct / 100)"
  - recent_segments: "COUNT('loyalty_activity', within_months=12, date_field='activity_date', event_type='loyalty_flight_accrual')"
  - segment_bonus: "K('many_segments_bonus_miles') if recent_segments >= K('many_segments') else (K('some_segments_bonus_miles') if recent_segments >= K('some_segments') else 0)"
  - membership_years: "MONTHS(F('enrolled_date'), NOW) // 12"
  - tenure_bonus: "K('long_tenure_bonus_miles') if membership_years >= K('long_tenure_years') else (K('mid_tenure_bonus_miles') if membership_years >= K('mid_tenure_years') else 0)"
  - result: "int(treated_selection_miles + card_bonus + segment_bonus + tenure_bonus)"
  compute_basis:
    bonus_selection_day: "The selection fulfilled is the latest selection of bonus miles on the membership."
    selection_miles: "The standard bonus credit carries the selection miles only: the choice_bonus_miles_per_selection of the tier the member holds, with nothing added."
    days_unposted: "The late-posting treatment follows the calendar days from the selection's date to the day the credit posts"
    treated_selection_miles: "more than late_far_days days multiplies the selection miles by late_far_multiplier and rounds up to the next thousand miles, more than late_near_days and up to late_far_days days adds the flat late_near_bonus_miles to them, and a credit posted within late_near_days days carries the selection miles unchanged."
    bonus_card_certificate: "The card bonus follows the companion certificate issued on a Crestline co-branded card anniversary"
    bonus_card_issued: "The card bonus follows the companion certificate issued on a Crestline co-branded card anniversary"
    bonus_card_age: "issued within the last card_recency_months months"
    card_bonus_pct: "a Crestline Companion Certificate First or Premium Economy issued within the last card_recency_months months adds premium_card_bonus_percent percent of the selection miles, a Crestline Companion Certificate Main Cabin or Main Plus issued within the last card_recency_months months adds standard_card_bonus_percent percent of the selection miles, each rounded down to the whole mile, and a member with no such certificate in that span adds no card bonus."
    card_bonus: "each rounded down to the whole mile"
    recent_segments: "The flown-segment bonus follows the flight accrual entries posted on the membership in the last twelve months"
    segment_bonus: "many_segments or more add many_segments_bonus_miles, some_segments up to fewer than many_segments add some_segments_bonus_miles, and fewer add no flown-segment bonus."
    membership_years: "The tenure bonus follows the whole years since the membership's enrolled date"
    tenure_bonus: "long_tenure_years or more add long_tenure_bonus_miles, mid_tenure_years to fewer than long_tenure_years add mid_tenure_bonus_miles, and a younger membership adds no tenure bonus."
    result: "The miles a choice-benefit bonus credit carries are the selection miles after the late-posting treatment, plus a card bonus, a flown-segment bonus and a tenure bonus, each added once and never multiplied."
  factors:
  - id: late_posting_treatment
    effect: method
    decides: treated_selection_miles
    bindings: [bonus_selection_day, days_unposted, treated_selection_miles]
    ladder:
    - when: "the credit posts more than late_far_days calendar days after the selection's date"
      method: "selection miles times late_far_multiplier, rounded up to the next thousand miles"
    - when: "it posts more than late_near_days and up to late_far_days days after it"
      method: "selection miles plus the flat late_near_bonus_miles, no scaling"
    - when: "otherwise"
      method: "selection miles unchanged"
    baseline:
      treated_selection_miles: "selection_miles"
    evidence: [history, date]
    cross_difficulty: null
  - id: bonus_card_bonus
    effect: parameter
    decides: card_bonus_pct
    bindings: [bonus_card_certificate, bonus_card_issued, bonus_card_age, card_bonus_pct, card_bonus]
    ladder:
    - when: "the card-anniversary companion certificate is Crestline Companion Certificate First or Premium Economy AND it was issued within the last card_recency_months months"
      value: "K('premium_card_bonus_percent') percent of the selection miles"
    - when: "the card-anniversary companion certificate is Crestline Companion Certificate Main Cabin or Main Plus AND it was issued within the last card_recency_months months"
      value: "K('standard_card_bonus_percent') percent of the selection miles"
    - when: "otherwise"
      value: "0"
    baseline:
      card_bonus_pct: "0"
    evidence: [cross_category, date]
    cross_difficulty: companion
  - id: flown_segment_bonus
    effect: parameter
    decides: segment_bonus
    bindings: [recent_segments, segment_bonus]
    ladder:
    - when: "many_segments or more flight accrual entries were posted in the last twelve months"
      value: "K('many_segments_bonus_miles')"
    - when: "some_segments up to fewer than many_segments were posted"
      value: "K('some_segments_bonus_miles')"
    - when: "otherwise"
      value: "0"
    baseline:
      segment_bonus: "0"
    evidence: [history]
    cross_difficulty: null
  - id: tenure_bonus
    effect: parameter
    decides: tenure_bonus
    bindings: [membership_years, tenure_bonus]
    ladder:
    - when: "the membership was enrolled long_tenure_years or more whole years ago"
      value: "K('long_tenure_bonus_miles')"
    - when: "it was enrolled mid_tenure_years to fewer than long_tenure_years whole years ago"
      value: "K('mid_tenure_bonus_miles')"
    - when: "otherwise"
      value: "0"
    baseline:
      tenure_bonus: "0"
    evidence: [date]
    cross_difficulty: null
  baseline:
    rule: >-
      The selection fulfilled is the latest selection of bonus miles on the membership. The standard bonus credit
      carries the selection miles only: the choice_bonus_miles_per_selection of the tier the member holds, with
      nothing added.
    params: [choice_bonus_miles_per_selection]
  inputs:
    history:
    - {table: loyalty_activity, aggregate: latest, field: activity_date, filters: {event_type: loyalty_choice_benefit_select, choice_benefit: bonus_miles}}
    - {table: loyalty_activity, aggregate: count, field: loyalty_activity_id, within_months: 12, filters: {event_type: loyalty_flight_accrual}}
    cross_category: [companion]
- id: loyalty_ext_miles_upgrade_charge
  base_policy_refs: [loyalty_award_redemptions, loyalty_upgrades_policy]
  overwrite:
  - base_policy: loyalty_upgrades_policy
    superseded_clause: >-
      plus miles_upgrade_copay_usd per segment
    replaced_by: >-
      The co-pay a cleared miles upgrade is charged is the co-pay to charge once the rules below have set it
      from the shared co-pay, in dollars and cents.
  trigger: state_due
  subject: [loyalty_award_redemption]
  computes: fee_usd
  target_tool: post_miles_upgrade_charge_7f00044a
  params:
    flexible_copay_share_percent: 50
    plus_copay_share_percent: 75
    standard_copay_share_percent: 100
    very_long_surcharge_usd: 40
    long_multiplier: 1.5
    premium_card_copay_reduction_usd: 20
    standard_card_copay_reduction_usd: 10
    card_recency_months: 12
    same_day_reduction_usd: 10
    near_day_reduction_usd: 5
    near_days: 3
    premium_lounge_copay_reduction_usd: 15
    standard_lounge_copay_reduction_usd: 7.5
  rule: >-
    A waitlisted miles upgrade that has cleared is charged by one redemption entry of the upgrade kind for its
    segment, carrying the miles and the cash co-pay, and this rule fixes the co-pay a cleared miles upgrade is
    charged. The upgrade charged is the latest miles upgrade clearance on the membership, on the ticket and
    segment that clearance names; its miles are the base miles upgrade cost for that segment's length, as the
    upgrades policy sets them. The shared co-pay of the segment is the miles_upgrade_copay_usd of the tier the
    member holds times its co-pay share percent, and the co-pay share percent is standard_copay_share_percent.
    The co-pay to charge is the shared co-pay, and the standard co-pay is the co-pay to charge, charged for the
    segment in dollars and cents. The co-pay a cleared miles upgrade is charged is the co-pay to charge once the
    rules below have set it from the shared co-pay, in dollars and cents. The co-pay share percent follows the
    fare brand of the upgraded ticket: a Crestline Main Flexible ticket takes flexible_copay_share_percent
    percent, a Crestline Main Plus ticket takes plus_copay_share_percent percent, and a ticket of any other fare
    brand takes standard_copay_share_percent percent. The distance treatment sets the co-pay to charge from the
    shared co-pay, before any amount is taken off it, by the upgraded segment's distance against the ticket
    charter's segment_length_threshold_miles for that ticket: a segment longer than twice the threshold sets it
    at the shared co-pay plus the flat very_long_surcharge_usd, capped at the shared co-pay itself, a segment
    longer than the threshold and up to twice it sets it at the shared co-pay multiplied by long_multiplier and
    rounded up to the whole dollar, and a segment up to the threshold keeps it at the shared co-pay. The card
    co-pay reduction is taken off the co-pay to charge and never takes it below zero; it follows the companion
    certificate issued on a Crestline co-branded card anniversary: a Crestline Companion Certificate First or
    Premium Economy issued within the last card_recency_months months takes off
    premium_card_copay_reduction_usd, a Crestline Companion Certificate Main Cabin or Main Plus issued within
    the last card_recency_months months takes off standard_card_copay_reduction_usd, and a member with no such
    certificate in that span takes nothing off. The clearance-timing reduction is taken off the co-pay to charge
    and never takes it below zero; it follows the calendar days from the clearance to the flight date of the
    upgraded segment: a clearance on the day of the flight takes off same_day_reduction_usd, a clearance 1 to
    near_days days before the flight takes off near_day_reduction_usd, and an earlier clearance takes nothing
    off. The lounge co-pay reduction is taken off the co-pay to charge and never takes it below zero; it follows
    the member's Summit Club membership: an active Summit Club Executive, Summit Club Corporate or Summit Club
    Lifetime membership takes off premium_lounge_copay_reduction_usd, an active Summit Club Essential, Summit
    Club Individual or Summit Club Individual Plus membership takes off standard_lounge_copay_reduction_usd, and
    a member with no active Summit Club membership takes nothing off.
  prerequisite: []
  cross_category:
  - category: ticket
    as: branch
    reads: [variant_name, segment_length_threshold_miles, ticket_transactions.flight_date]
    note: The upgraded ticket's fare brand decides the co-pay share, its segment length threshold the distance treatment and its flown coupon the clearance timing.
  - category: companion
    as: branch
    reads: [variant_name, issue_source, issue_date]
    note: The card-anniversary companion certificate decides the card co-pay reduction.
  - category: club
    as: branch
    reads: [variant_name, status]
    note: The member's Summit Club membership decides the lounge co-pay reduction.
  compute:
  - cleared_ticket: "LATEST('loyalty_upgrades', 'source_ticket_id', date_field='request_date', event_type='loyalty_upgrade_clear', upgrade_method='miles')"
  - cleared_request: "LATEST('loyalty_upgrades', 'source_request_id', date_field='request_date', event_type='loyalty_upgrade_clear', upgrade_method='miles')"
  - cleared_day: "LATEST('loyalty_upgrades', 'request_date', date_field='request_date', event_type='loyalty_upgrade_clear', upgrade_method='miles')"
  - cleared_segment: "LATEST('loyalty_upgrades', 'segment_number', date_field='request_date', event_type='loyalty_upgrade_clear', upgrade_method='miles')"
  - standard_copay: "P('miles_upgrade_copay_usd')"
  - upgraded_brand: "CFIELD('ticket', 'variant_name', ticket_id=cleared_ticket)"
  - copay_share_pct: "K('flexible_copay_share_percent') if upgraded_brand == 'Crestline Main Flexible' else (K('plus_copay_share_percent') if upgraded_brand == 'Crestline Main Plus' else K('standard_copay_share_percent'))"
  - shared_copay: "standard_copay * copay_share_pct / 100"
  - upgraded_distance: "MAX('loyalty_upgrades', 'segment_miles', event_type='loyalty_upgrade_request', upgrade_id=cleared_request)"
  - upgraded_threshold: "CPARAM('ticket', 'segment_length_threshold_miles', ticket_id=cleared_ticket)"
  - distance_copay: "shared_copay + MN(K('very_long_surcharge_usd'), shared_copay) if upgraded_distance > 2 * upgraded_threshold else ((-((-(shared_copay * K('long_multiplier'))) // 1)) if upgraded_distance > upgraded_threshold else shared_copay)"
  - copay_card_certificate: "CFIELD('companion', 'variant_name', issue_source='cobrand_card_anniversary')"
  - copay_card_issued: "CFIELD('companion', 'issue_date', issue_source='cobrand_card_anniversary')"
  - copay_card_age: "MONTHS(copay_card_issued, NOW) if copay_card_issued else 999"
  - card_copay_reduction: "K('premium_card_copay_reduction_usd') if ((copay_card_certificate == 'Crestline Companion Certificate First' or copay_card_certificate == 'Crestline Companion Certificate Premium Economy') and copay_card_age < K('card_recency_months')) else (K('standard_card_copay_reduction_usd') if ((copay_card_certificate == 'Crestline Companion Certificate Main Cabin' or copay_card_certificate == 'Crestline Companion Certificate Main Plus') and copay_card_age < K('card_recency_months')) else 0)"
  - upgraded_flight_day: "XLATEST('ticket', 'ticket_transactions', 'flight_date', date_field='transaction_date', event_type='ticket_coupon_flown', ticket_id=cleared_ticket, segment_number=cleared_segment)"
  - clearance_lead_days: "DAYS(cleared_day, upgraded_flight_day)"
  - timing_reduction: "K('same_day_reduction_usd') if clearance_lead_days == 0 else (K('near_day_reduction_usd') if (clearance_lead_days >= 1 and clearance_lead_days <= K('near_days')) else 0)"
  - copay_lounge_product: "CFIELD('club', 'variant_name')"
  - copay_lounge_state: "CFIELD('club', 'status')"
  - lounge_copay_reduction: "K('premium_lounge_copay_reduction_usd') if ((copay_lounge_product == 'Summit Club Executive' or copay_lounge_product == 'Summit Club Corporate' or copay_lounge_product == 'Summit Club Lifetime') and copay_lounge_state == 'active') else (K('standard_lounge_copay_reduction_usd') if ((copay_lounge_product == 'Summit Club Essential' or copay_lounge_product == 'Summit Club Individual' or copay_lounge_product == 'Summit Club Individual Plus') and copay_lounge_state == 'active') else 0)"
  - result: "RND(MX(0, distance_copay - card_copay_reduction - timing_reduction - lounge_copay_reduction), 2)"
  compute_basis:
    cleared_ticket: "The upgrade charged is the latest miles upgrade clearance on the membership, on the ticket and segment that clearance names"
    cleared_request: "The upgrade charged is the latest miles upgrade clearance on the membership, on the ticket and segment that clearance names"
    cleared_day: "it follows the calendar days from the clearance to the flight date of the upgraded segment"
    cleared_segment: "The upgrade charged is the latest miles upgrade clearance on the membership, on the ticket and segment that clearance names"
    standard_copay: "The shared co-pay of the segment is the miles_upgrade_copay_usd of the tier the member holds times its co-pay share percent"
    upgraded_brand: "The co-pay share percent follows the fare brand of the upgraded ticket"
    copay_share_pct: "a Crestline Main Flexible ticket takes flexible_copay_share_percent percent, a Crestline Main Plus ticket takes plus_copay_share_percent percent, and a ticket of any other fare brand takes standard_copay_share_percent percent."
    shared_copay: "The shared co-pay of the segment is the miles_upgrade_copay_usd of the tier the member holds times its co-pay share percent, and the co-pay share percent is standard_copay_share_percent."
    upgraded_distance: "by the upgraded segment's distance against the ticket charter's segment_length_threshold_miles for that ticket"
    upgraded_threshold: "by the upgraded segment's distance against the ticket charter's segment_length_threshold_miles for that ticket"
    distance_copay: "a segment longer than twice the threshold sets it at the shared co-pay plus the flat very_long_surcharge_usd, capped at the shared co-pay itself, a segment longer than the threshold and up to twice it sets it at the shared co-pay multiplied by long_multiplier and rounded up to the whole dollar, and a segment up to the threshold keeps it at the shared co-pay."
    copay_card_certificate: "it follows the companion certificate issued on a Crestline co-branded card anniversary"
    copay_card_issued: "it follows the companion certificate issued on a Crestline co-branded card anniversary"
    copay_card_age: "issued within the last card_recency_months months"
    card_copay_reduction: "a Crestline Companion Certificate First or Premium Economy issued within the last card_recency_months months takes off premium_card_copay_reduction_usd, a Crestline Companion Certificate Main Cabin or Main Plus issued within the last card_recency_months months takes off standard_card_copay_reduction_usd, and a member with no such certificate in that span takes nothing off."
    upgraded_flight_day: "it follows the calendar days from the clearance to the flight date of the upgraded segment"
    clearance_lead_days: "it follows the calendar days from the clearance to the flight date of the upgraded segment"
    timing_reduction: "a clearance on the day of the flight takes off same_day_reduction_usd, a clearance 1 to near_days days before the flight takes off near_day_reduction_usd, and an earlier clearance takes nothing off."
    copay_lounge_product: "it follows the member's Summit Club membership"
    copay_lounge_state: "it follows the member's Summit Club membership"
    lounge_copay_reduction: "an active Summit Club Executive, Summit Club Corporate or Summit Club Lifetime membership takes off premium_lounge_copay_reduction_usd, an active Summit Club Essential, Summit Club Individual or Summit Club Individual Plus membership takes off standard_lounge_copay_reduction_usd, and a member with no active Summit Club membership takes nothing off."
    result: "is taken off the co-pay to charge and never takes it below zero"
  factors:
  - id: copay_share
    effect: parameter
    decides: copay_share_pct
    bindings: [upgraded_brand, copay_share_pct, shared_copay]
    ladder:
    - when: "the upgraded ticket is Crestline Main Flexible"
      value: "a co-pay share percent of K('flexible_copay_share_percent')"
    - when: "the upgraded ticket is Crestline Main Plus"
      value: "a co-pay share percent of K('plus_copay_share_percent')"
    - when: "otherwise"
      value: "a co-pay share percent of K('standard_copay_share_percent')"
    baseline:
      copay_share_pct: "K('standard_copay_share_percent')"
    evidence: [cross_category]
    cross_difficulty: ticket
  - id: distance_treatment
    effect: method
    decides: distance_copay
    bindings: [upgraded_distance, upgraded_threshold, distance_copay]
    ladder:
    - when: "the upgraded segment is longer than twice the ticket's segment length threshold"
      method: "the co-pay to charge is set, before any amount is taken off it, at the shared co-pay plus the flat very_long_surcharge_usd capped at the shared co-pay"
    - when: "it is longer than the threshold and up to twice it"
      method: "the co-pay to charge is set, before any amount is taken off it, at the shared co-pay times long_multiplier, rounded up to the whole dollar"
    - when: "otherwise"
      method: "the co-pay to charge is kept at the shared co-pay"
    baseline:
      distance_copay: "shared_copay"
    evidence: [history, cross_category]
    cross_difficulty: ticket
  - id: card_copay_reduction
    effect: parameter
    decides: card_copay_reduction
    bindings: [copay_card_certificate, copay_card_issued, copay_card_age, card_copay_reduction]
    ladder:
    - when: "the card-anniversary companion certificate is Crestline Companion Certificate First or Premium Economy AND it was issued within the last card_recency_months months"
      value: "K('premium_card_copay_reduction_usd') taken off the co-pay to charge, never taking it below zero"
    - when: "the card-anniversary companion certificate is Crestline Companion Certificate Main Cabin or Main Plus AND it was issued within the last card_recency_months months"
      value: "K('standard_card_copay_reduction_usd') taken off the co-pay to charge, never taking it below zero"
    - when: "otherwise"
      value: "nothing taken off the co-pay to charge"
    baseline:
      card_copay_reduction: "0"
    evidence: [cross_category, date]
    cross_difficulty: companion
  - id: clearance_timing_reduction
    effect: parameter
    decides: timing_reduction
    bindings: [cleared_day, cleared_segment, upgraded_flight_day, clearance_lead_days, timing_reduction]
    ladder:
    - when: "the upgrade cleared on the day of the segment's flight"
      value: "K('same_day_reduction_usd') taken off the co-pay to charge, never taking it below zero"
    - when: "it cleared 1 to near_days days before the flight"
      value: "K('near_day_reduction_usd') taken off the co-pay to charge, never taking it below zero"
    - when: "otherwise"
      value: "nothing taken off the co-pay to charge"
    baseline:
      timing_reduction: "0"
    evidence: [history, date]
    cross_difficulty: ticket
  - id: lounge_copay_reduction
    effect: parameter
    decides: lounge_copay_reduction
    bindings: [copay_lounge_product, copay_lounge_state, lounge_copay_reduction]
    ladder:
    - when: "the member's Summit Club membership is Summit Club Executive, Summit Club Corporate or Summit Club Lifetime AND it is active"
      value: "K('premium_lounge_copay_reduction_usd') taken off the co-pay to charge, never taking it below zero"
    - when: "the member's Summit Club membership is Summit Club Essential, Summit Club Individual or Summit Club Individual Plus AND it is active"
      value: "K('standard_lounge_copay_reduction_usd') taken off the co-pay to charge, never taking it below zero"
    - when: "otherwise"
      value: "nothing taken off the co-pay to charge"
    baseline:
      lounge_copay_reduction: "0"
    evidence: [cross_category]
    cross_difficulty: null
  baseline:
    rule: >-
      The upgrade charged is the latest miles upgrade clearance on the membership, on the ticket and segment
      that clearance names; its miles are the base miles upgrade cost for that segment's length, as the
      upgrades policy sets them. The shared co-pay of the segment is the miles_upgrade_copay_usd of the tier
      the member holds times its co-pay share percent, and the co-pay share percent is
      standard_copay_share_percent. The co-pay to charge is the shared co-pay, and the standard co-pay is the
      co-pay to charge, charged for the segment in dollars and cents.
    params: [miles_upgrade_copay_usd, standard_copay_share_percent]
  inputs:
    history:
    - {table: loyalty_upgrades, aggregate: latest, field: source_ticket_id, filters: {event_type: loyalty_upgrade_clear, upgrade_method: miles}}
    - {table: loyalty_upgrades, aggregate: max, field: segment_miles, filters: {event_type: loyalty_upgrade_request}}
    - {category: ticket, table: ticket_transactions, aggregate: latest, field: flight_date, filters: {event_type: ticket_coupon_flown}}
    cross_category: [ticket, companion, club]
- id: loyalty_ext_choice_upgrade_certificates
  base_policy_refs: [loyalty_choice_benefits, loyalty_upgrades_policy]
  overwrite:
  - base_policy: loyalty_choice_benefits
    superseded_clause: >-
      upgrade_certificates, which issues choice_upgrade_certificates_per_selection Summit Upgrade Certificates
    replaced_by: >-
      The certificates a choice-benefit certificate issue carries are the selection certificates after the
      late-issue treatment, plus a card certificate award, a premium-flyer certificate award, a lounge certificate
      award and a certificate-user award, each added once, in whole certificates.
  trigger: state_due
  subject: [loyalty_certificate_issue]
  computes: certificate_count
  target_tool: issue_choice_upgrade_certificates_458899d3
  params:
    late_far_days: 180
    late_near_days: 30
    late_far_multiplier: 1.5
    late_near_extra_certificates: 1
    premium_card_certificates: 2
    standard_card_certificates: 1
    card_recency_months: 12
    frequent_first_coupons: 4
    frequent_first_certificates: 2
    occasional_first_certificates: 1
    premium_lounge_certificates: 2
    standard_lounge_certificates: 1
    frequent_redemptions: 2
    frequent_user_certificates: 2
    occasional_user_certificates: 1
  rule: >-
    A choice-benefit selection of upgrade certificates is fulfilled by one certificate issue entry carrying the
    selection's qualification year, the certificates issued and the batch expiry, and this rule fixes the
    certificates a choice-benefit certificate issue carries. The selection fulfilled is the latest selection of
    upgrade certificates on the membership, and the batch expires certificate_validity_months calendar months after
    the day it is issued. The standard certificate issue carries the selection certificates only: the
    choice_upgrade_certificates_per_selection of the tier the member holds, with nothing added. The certificates a
    choice-benefit certificate issue carries are the selection certificates after the late-issue treatment, plus a
    card certificate award, a premium-flyer certificate award, a lounge certificate award and a certificate-user
    award, each added once, in whole certificates. The late-issue treatment follows the calendar days from the
    selection's date to the day of the issue: more than late_far_days days multiplies the selection certificates by
    late_far_multiplier and rounds up to the whole certificate, more than late_near_days and up to late_far_days
    days adds late_near_extra_certificates to them, and an issue within late_near_days days carries them unchanged.
    The card certificate award follows the companion certificate issued on a Crestline co-branded card
    anniversary: a Crestline Companion Certificate First or Premium Economy issued within the last
    card_recency_months months adds premium_card_certificates, a Crestline Companion Certificate Main Cabin or Main
    Plus issued within the last card_recency_months months adds standard_card_certificates, and a member with no
    such certificate in that span adds none. The premium-flyer certificate award follows the coupons the member
    flew in the First cabin in the last twelve months: frequent_first_coupons or more add
    frequent_first_certificates, one up to fewer than frequent_first_coupons add occasional_first_certificates, and
    none adds no premium-flyer award. The lounge certificate award follows the member's Summit Club membership: an
    active Summit Club Executive, Summit Club Corporate or Summit Club Lifetime membership adds
    premium_lounge_certificates, an active Summit Club Essential, Summit Club Individual or Summit Club Individual
    Plus membership adds standard_lounge_certificates, and a member with no active Summit Club membership adds
    none. The certificate-user award follows the certificate redemption entries posted on the membership in the
    last twelve months: frequent_redemptions or more add frequent_user_certificates, exactly one adds
    occasional_user_certificates, and none adds no certificate-user award.
  prerequisite: []
  cross_category:
  - category: companion
    as: branch
    reads: [variant_name, issue_source, issue_date]
    note: The card-anniversary companion certificate decides the card certificate award.
  - category: ticket
    as: history
    reads: [ticket_transactions.cabin_flown]
    note: The coupons flown in the First cabin in the last twelve months decide the premium-flyer certificate award.
  - category: club
    as: branch
    reads: [variant_name, status]
    note: The member's Summit Club membership decides the lounge certificate award.
  compute:
  - certificate_selection_day: "LATEST('loyalty_activity', 'activity_date', date_field='activity_date', event_type='loyalty_choice_benefit_select', choice_benefit='upgrade_certificates')"
  - selection_certificates: "P('choice_upgrade_certificates_per_selection')"
  - days_unissued: "DAYS(certificate_selection_day, NOW)"
  - treated_certificates: "-((-(selection_certificates * K('late_far_multiplier'))) // 1) if days_unissued > K('late_far_days') else (selection_certificates + K('late_near_extra_certificates') if days_unissued > K('late_near_days') else selection_certificates)"
  - award_card_certificate: "CFIELD('companion', 'variant_name', issue_source='cobrand_card_anniversary')"
  - award_card_issued: "CFIELD('companion', 'issue_date', issue_source='cobrand_card_anniversary')"
  - award_card_age: "MONTHS(award_card_issued, NOW) if award_card_issued else 999"
  - card_certificates: "K('premium_card_certificates') if ((award_card_certificate == 'Crestline Companion Certificate First' or award_card_certificate == 'Crestline Companion Certificate Premium Economy') and award_card_age < K('card_recency_months')) else (K('standard_card_certificates') if ((award_card_certificate == 'Crestline Companion Certificate Main Cabin' or award_card_certificate == 'Crestline Companion Certificate Main Plus') and award_card_age < K('card_recency_months')) else 0)"
  - first_cabin_coupons: "XCOUNT('ticket', 'ticket_transactions', within_months=12, date_field='flight_date', event_type='ticket_coupon_flown', cabin_flown='first')"
  - premium_flyer_certificates: "K('frequent_first_certificates') if first_cabin_coupons >= K('frequent_first_coupons') else (K('occasional_first_certificates') if first_cabin_coupons >= 1 else 0)"
  - award_lounge_product: "CFIELD('club', 'variant_name')"
  - award_lounge_state: "CFIELD('club', 'status')"
  - lounge_certificates: "K('premium_lounge_certificates') if ((award_lounge_product == 'Summit Club Executive' or award_lounge_product == 'Summit Club Corporate' or award_lounge_product == 'Summit Club Lifetime') and award_lounge_state == 'active') else (K('standard_lounge_certificates') if ((award_lounge_product == 'Summit Club Essential' or award_lounge_product == 'Summit Club Individual' or award_lounge_product == 'Summit Club Individual Plus') and award_lounge_state == 'active') else 0)"
  - recent_redemptions: "COUNT('loyalty_activity', within_months=12, date_field='activity_date', event_type='loyalty_certificate_redeem')"
  - user_certificates: "K('frequent_user_certificates') if recent_redemptions >= K('frequent_redemptions') else (K('occasional_user_certificates') if recent_redemptions == 1 else 0)"
  - result: "int(treated_certificates + card_certificates + premium_flyer_certificates + lounge_certificates + user_certificates)"
  compute_basis:
    certificate_selection_day: "The selection fulfilled is the latest selection of upgrade certificates on the membership, and the batch expires certificate_validity_months calendar months after the day it is issued."
    selection_certificates: "The standard certificate issue carries the selection certificates only: the choice_upgrade_certificates_per_selection of the tier the member holds, with nothing added."
    days_unissued: "The late-issue treatment follows the calendar days from the selection's date to the day of the issue"
    treated_certificates: "more than late_far_days days multiplies the selection certificates by late_far_multiplier and rounds up to the whole certificate, more than late_near_days and up to late_far_days days adds late_near_extra_certificates to them, and an issue within late_near_days days carries them unchanged."
    award_card_certificate: "The card certificate award follows the companion certificate issued on a Crestline co-branded card anniversary"
    award_card_issued: "The card certificate award follows the companion certificate issued on a Crestline co-branded card anniversary"
    award_card_age: "issued within the last card_recency_months months"
    card_certificates: "a Crestline Companion Certificate First or Premium Economy issued within the last card_recency_months months adds premium_card_certificates, a Crestline Companion Certificate Main Cabin or Main Plus issued within the last card_recency_months months adds standard_card_certificates, and a member with no such certificate in that span adds none."
    first_cabin_coupons: "The premium-flyer certificate award follows the coupons the member flew in the First cabin in the last twelve months"
    premium_flyer_certificates: "frequent_first_coupons or more add frequent_first_certificates, one up to fewer than frequent_first_coupons add occasional_first_certificates, and none adds no premium-flyer award."
    award_lounge_product: "The lounge certificate award follows the member's Summit Club membership"
    award_lounge_state: "The lounge certificate award follows the member's Summit Club membership"
    lounge_certificates: "an active Summit Club Executive, Summit Club Corporate or Summit Club Lifetime membership adds premium_lounge_certificates, an active Summit Club Essential, Summit Club Individual or Summit Club Individual Plus membership adds standard_lounge_certificates, and a member with no active Summit Club membership adds none."
    recent_redemptions: "The certificate-user award follows the certificate redemption entries posted on the membership in the last twelve months"
    user_certificates: "frequent_redemptions or more add frequent_user_certificates, exactly one adds occasional_user_certificates, and none adds no certificate-user award."
    result: "The certificates a choice-benefit certificate issue carries are the selection certificates after the late-issue treatment, plus a card certificate award, a premium-flyer certificate award, a lounge certificate award and a certificate-user award, each added once, in whole certificates."
  factors:
  - id: late_issue_treatment
    effect: method
    decides: treated_certificates
    bindings: [certificate_selection_day, days_unissued, treated_certificates]
    ladder:
    - when: "the issue comes more than late_far_days calendar days after the selection's date"
      method: "selection certificates times late_far_multiplier, rounded up to the whole certificate"
    - when: "it comes more than late_near_days and up to late_far_days days after it"
      method: "selection certificates plus late_near_extra_certificates"
    - when: "otherwise"
      method: "selection certificates unchanged"
    baseline:
      treated_certificates: "selection_certificates"
    evidence: [history, date]
    cross_difficulty: null
  - id: card_certificate_award
    effect: parameter
    decides: card_certificates
    bindings: [award_card_certificate, award_card_issued, award_card_age, card_certificates]
    ladder:
    - when: "the card-anniversary companion certificate is Crestline Companion Certificate First or Premium Economy AND it was issued within the last card_recency_months months"
      value: "K('premium_card_certificates')"
    - when: "the card-anniversary companion certificate is Crestline Companion Certificate Main Cabin or Main Plus AND it was issued within the last card_recency_months months"
      value: "K('standard_card_certificates')"
    - when: "otherwise"
      value: "0"
    baseline:
      card_certificates: "0"
    evidence: [cross_category, date]
    cross_difficulty: companion
  - id: premium_flyer_award
    effect: parameter
    decides: premium_flyer_certificates
    bindings: [first_cabin_coupons, premium_flyer_certificates]
    ladder:
    - when: "frequent_first_coupons or more coupons were flown in the First cabin in the last twelve months"
      value: "K('frequent_first_certificates')"
    - when: "one up to fewer than frequent_first_coupons were"
      value: "K('occasional_first_certificates')"
    - when: "otherwise"
      value: "0"
    baseline:
      premium_flyer_certificates: "0"
    evidence: [cross_category, history]
    cross_difficulty: ticket
  - id: lounge_certificate_award
    effect: parameter
    decides: lounge_certificates
    bindings: [award_lounge_product, award_lounge_state, lounge_certificates]
    ladder:
    - when: "the member's Summit Club membership is Summit Club Executive, Summit Club Corporate or Summit Club Lifetime AND it is active"
      value: "K('premium_lounge_certificates')"
    - when: "the member's Summit Club membership is Summit Club Essential, Summit Club Individual or Summit Club Individual Plus AND it is active"
      value: "K('standard_lounge_certificates')"
    - when: "otherwise"
      value: "0"
    baseline:
      lounge_certificates: "0"
    evidence: [cross_category]
    cross_difficulty: null
  - id: certificate_user_award
    effect: parameter
    decides: user_certificates
    bindings: [recent_redemptions, user_certificates]
    ladder:
    - when: "frequent_redemptions or more certificate redemption entries were posted in the last twelve months"
      value: "K('frequent_user_certificates')"
    - when: "exactly one was posted"
      value: "K('occasional_user_certificates')"
    - when: "otherwise"
      value: "0"
    baseline:
      user_certificates: "0"
    evidence: [history]
    cross_difficulty: null
  baseline:
    rule: >-
      The selection fulfilled is the latest selection of upgrade certificates on the membership, and the batch
      expires certificate_validity_months calendar months after the day it is issued. The standard certificate issue
      carries the selection certificates only: the choice_upgrade_certificates_per_selection of the tier the member
      holds, with nothing added.
    params: [choice_upgrade_certificates_per_selection]
  inputs:
    history:
    - {table: loyalty_activity, aggregate: latest, field: activity_date, filters: {event_type: loyalty_choice_benefit_select, choice_benefit: upgrade_certificates}}
    - {table: loyalty_activity, aggregate: count, field: loyalty_activity_id, within_months: 12, filters: {event_type: loyalty_certificate_redeem}}
    - {category: ticket, table: ticket_transactions, aggregate: count, field: transaction_id, within_months: 12, filters: {event_type: ticket_coupon_flown, cabin_flown: first}}
    cross_category: [companion, ticket, club]
- id: loyalty_ext_upgrade_topup_purchase
  base_policy_refs: [loyalty_miles_purchases, loyalty_upgrades_policy]
  overwrite:
  - base_policy: loyalty_miles_purchases
    superseded_clause: >-
      at miles_purchase_price_per_1000_usd for each thousand miles
    replaced_by: >-
      A top-up purchase is priced from the miles bought and the net price per thousand by the rules below and
      rounded to the cent, and a purchase that covers no waitlisted miles upgrade is priced at
      miles_purchase_price_per_1000_usd for each thousand miles, outside this rule.
  trigger: on_request
  subject: [loyalty_miles_purchase]
  computes: purchase_amount_usd
  target_tool: buy_miles_4af9ade8
  params:
    diamond_price_per_1000_usd: 28
    platinum_price_per_1000_usd: 30
    repeat_buyer_reduction_usd: 3
    returning_buyer_share: 0.95
    repeat_buyer_purchases: 2
    premium_lounge_reduction_per_1000_usd: 2
    standard_lounge_reduction_per_1000_usd: 1
    first_upgrade_reduction_per_1000_usd: 1.5
    premium_economy_upgrade_reduction_per_1000_usd: 0.75
    close_trip_days: 21
    premium_card_discount_percent: 10
    standard_card_discount_percent: 5
    card_recency_months: 12
    seat_and_bag_pass_discount_percent: 4
    single_pass_discount_percent: 2
  rule: >-
    A member whose miles do not cover the waitlisted miles upgrades of an upcoming trip may buy the miles short,
    and this rule fixes the miles a top-up purchase buys and the price of a top-up purchase. The miles a top-up
    purchase buys are worked out only after every choice selection of bonus miles on the membership carries its
    bonus credit. The miles a top-up purchase buys are not worked out until every miles upgrade that has cleared
    on the membership carries its miles charge on the membership's activity. A top-up purchase is recorded only
    after every choice selection of upgrade certificates on the membership carries its certificate issue. The
    trip covered is the ticket of the latest waitlisted miles upgrade request; every miles upgrade request on
    that ticket with no clearance is costed at the miles upgrade cost for the segment's length against the
    ticket charter's segment_length_threshold_miles, miles_upgrade_cost_long_segment above the threshold and
    miles_upgrade_cost_short_segment otherwise, the out and back segments of one trip having one length. The
    miles short are those costs added together less the membership's mile balance; when the balance covers them
    nothing is bought, and otherwise the miles bought are the miles short rounded up to the next
    purchase_increment_miles, and never fewer than min_miles_purchase. The tier price per thousand is
    miles_purchase_price_per_1000_usd, and the net price per thousand is the tier price per thousand. The
    standard price is the miles bought, in thousands, times the net price per thousand, rounded to the cent. A
    top-up purchase is priced from the miles bought and the net price per thousand by the rules below and
    rounded to the cent, and a purchase that covers no waitlisted miles upgrade is priced at
    miles_purchase_price_per_1000_usd for each thousand miles, outside this rule. The tier price per thousand
    follows the tier the member holds and whether its validity runs through the day of the purchase: Summit
    Diamond or Summit Chairman still valid pays diamond_price_per_1000_usd, Summit Platinum still valid pays
    platinum_price_per_1000_usd, and any other tier pays miles_purchase_price_per_1000_usd. The repeat-buyer
    treatment sets the net price per thousand from the tier price per thousand, before any amount per thousand
    is taken off it, by the purchase entries posted on the membership in the last twelve months:
    repeat_buyer_purchases or more set it at the tier price per thousand less the flat
    repeat_buyer_reduction_usd, exactly one sets it at the tier price per thousand multiplied by
    returning_buyer_share and rounded to the cent, and none keeps it at the tier price per thousand. The lounge
    reduction is taken off the net price per thousand; it follows the member's Summit Club membership: an active
    Summit Club Executive, Summit Club Corporate or Summit Club Lifetime membership takes off
    premium_lounge_reduction_per_1000_usd, an active Summit Club Essential, Summit Club Individual or Summit
    Club Individual Plus membership takes off standard_lounge_reduction_per_1000_usd, and a member with no
    active Summit Club membership takes nothing off. The departure-cabin reduction is taken off the net price
    per thousand; it follows the calendar days from the purchase to the scheduled departure of the trip covered,
    as its ticket shows it, and the cabin its latest waitlisted miles upgrade request asks for: a trip departing
    within close_trip_days days whose request asks for First takes off first_upgrade_reduction_per_1000_usd, a
    trip departing within close_trip_days days whose request asks for Premium Economy takes off
    premium_economy_upgrade_reduction_per_1000_usd, and a trip departing more than close_trip_days days after
    the purchase takes nothing off. The card discount is a percent of the price; every percentage discount on
    one top-up purchase is added together and taken off the price once, before the price is rounded to the cent;
    the card discount follows the companion certificate issued on a Crestline co-branded card anniversary: a
    Crestline Companion Certificate First or Premium Economy issued within the last card_recency_months months
    gives premium_card_discount_percent percent, a Crestline Companion Certificate Main Cabin or Main Plus
    issued within the last card_recency_months months gives standard_card_discount_percent percent, and a member
    with no such certificate in that span gets none. The subscription discount is a percent of the price, added
    together with every other percentage discount on the purchase and taken off the price once; it follows the
    member's seat and bag subscription: an active Crestline Seat and Bag Pass Domestic or Network gives
    seat_and_bag_pass_discount_percent percent, an active Crestline Bag Pass One or Two or Crestline Seat Pass
    Domestic or Network gives single_pass_discount_percent percent, and a member with no active subscription
    gets none.
  prerequisite:
  - problem: loyalty_ext_choice_bonus_miles
    kind: value_input
    gate: member_balance
    form: state
    policy_source: >-
      The miles a top-up purchase buys are worked out only after every choice selection of bonus miles on the
      membership carries its bonus credit.
    condition: >-
      Every loyalty_choice_benefit_select entry with choice_benefit bonus_miles has a loyalty_bonus_credit entry with
      bonus_reason choice_benefit and the same choice_year on the membership.
    resolved_by: post_choice_bonus_miles_029b6e8c
    effect: >-
      member_balance (the mile balance) rises by the bonus credited, which lowers the miles short and so the miles
      bought and the price.
  - problem: loyalty_ext_miles_upgrade_charge
    kind: value_input
    gate: member_balance
    form: state
    policy_source: >-
      The miles a top-up purchase buys are not worked out until every miles upgrade that has cleared on the
      membership carries its miles charge on the membership's activity.
    condition: >-
      Every loyalty_upgrade_clear entry with upgrade_method miles has a loyalty_award_redemption entry with award_type
      upgrade for the same source ticket and segment on the membership.
    resolved_by: post_miles_upgrade_charge_7f00044a
    effect: >-
      member_balance falls by the miles charged, which raises the miles short and so the miles bought and the price.
  - problem: loyalty_ext_choice_upgrade_certificates
    kind: state_gate
    gate: loyalty_activity.event_type
    form: state
    policy_source: >-
      A top-up purchase is recorded only after every choice selection of upgrade certificates on the membership
      carries its certificate issue.
    condition: >-
      Every loyalty_choice_benefit_select entry with choice_benefit upgrade_certificates has a
      loyalty_certificate_issue entry with the same choice_year on the membership.
    resolved_by: issue_choice_upgrade_certificates_458899d3
    effect: >-
      Once the certificate issue stands the purchase may be recorded; the purchase figures themselves do not read
      the certificates.
  cross_category:
  - category: ticket
    as: branch
    reads: [segment_length_threshold_miles, next_departure_at]
    note: The ticket charter's segment length threshold of the waitlisted trip's ticket decides the miles upgrade cost per segment, and the ticket's scheduled departure decides the departure-cabin reduction.
  - category: club
    as: branch
    reads: [variant_name, status]
    note: The member's Summit Club membership decides the lounge reduction.
  - category: companion
    as: branch
    reads: [variant_name, issue_source, issue_date]
    note: The card-anniversary companion certificate decides the card discount.
  - category: pass
    as: branch
    reads: [variant_name, status]
    note: The member's seat and bag subscription decides the subscription discount.
  compute:
  - trip_ticket: "LATEST('loyalty_upgrades', 'source_ticket_id', date_field='request_date', event_type='loyalty_upgrade_request', upgrade_method='miles')"
  - trip_requests: "COUNT('loyalty_upgrades', date_field='request_date', event_type='loyalty_upgrade_request', upgrade_method='miles', source_ticket_id=trip_ticket)"
  - trip_clearances: "COUNT('loyalty_upgrades', date_field='request_date', event_type='loyalty_upgrade_clear', upgrade_method='miles', source_ticket_id=trip_ticket)"
  - trip_distance: "MAX('loyalty_upgrades', 'segment_miles', event_type='loyalty_upgrade_request', upgrade_method='miles', source_ticket_id=trip_ticket)"
  - trip_threshold: "CPARAM('ticket', 'segment_length_threshold_miles', ticket_id=trip_ticket)"
  - miles_per_segment: "P('miles_upgrade_cost_long_segment') if trip_distance > trip_threshold else P('miles_upgrade_cost_short_segment')"
  - miles_needed: "(trip_requests - trip_clearances) * miles_per_segment"
  - member_balance: "F('mile_balance')"
  - miles_short: "miles_needed - member_balance"
  - miles_bought: "0 if miles_short <= 0 else MX(P('min_miles_purchase'), (-((-miles_short) // P('purchase_increment_miles'))) * P('purchase_increment_miles'))"
  - held_tier: "F('variant_name')"
  - held_tier_days_left: "DAYS(NOW, F('tier_valid_through')) if F('tier_valid_through') else -1"
  - elite_price: "K('diamond_price_per_1000_usd') if ((held_tier == 'Summit Diamond' or held_tier == 'Summit Chairman') and held_tier_days_left >= 0) else (K('platinum_price_per_1000_usd') if (held_tier == 'Summit Platinum' and held_tier_days_left >= 0) else P('miles_purchase_price_per_1000_usd'))"
  - recent_purchases: "COUNT('loyalty_activity', within_months=12, date_field='activity_date', event_type='loyalty_miles_purchase')"
  - buyer_price: "elite_price - K('repeat_buyer_reduction_usd') if recent_purchases >= K('repeat_buyer_purchases') else (RND(elite_price * K('returning_buyer_share'), 2) if recent_purchases == 1 else elite_price)"
  - price_lounge_product: "CFIELD('club', 'variant_name')"
  - price_lounge_state: "CFIELD('club', 'status')"
  - lounge_reduction: "K('premium_lounge_reduction_per_1000_usd') if ((price_lounge_product == 'Summit Club Executive' or price_lounge_product == 'Summit Club Corporate' or price_lounge_product == 'Summit Club Lifetime') and price_lounge_state == 'active') else (K('standard_lounge_reduction_per_1000_usd') if ((price_lounge_product == 'Summit Club Essential' or price_lounge_product == 'Summit Club Individual' or price_lounge_product == 'Summit Club Individual Plus') and price_lounge_state == 'active') else 0)"
  - trip_cabin: "LATEST('loyalty_upgrades', 'target_cabin', date_field='request_date', event_type='loyalty_upgrade_request', upgrade_method='miles', source_ticket_id=trip_ticket)"
  - trip_departure: "CFIELD('ticket', 'next_departure_at', ticket_id=trip_ticket)"
  - days_to_trip: "DAYS(NOW, trip_departure)"
  - cabin_reduction: "K('first_upgrade_reduction_per_1000_usd') if (days_to_trip <= K('close_trip_days') and trip_cabin == 'first') else (K('premium_economy_upgrade_reduction_per_1000_usd') if (days_to_trip <= K('close_trip_days') and trip_cabin == 'premium_economy') else 0)"
  - net_price_per_1000: "buyer_price - lounge_reduction - cabin_reduction"
  - price_card_certificate: "CFIELD('companion', 'variant_name', issue_source='cobrand_card_anniversary')"
  - price_card_issued: "CFIELD('companion', 'issue_date', issue_source='cobrand_card_anniversary')"
  - price_card_age: "MONTHS(price_card_issued, NOW) if price_card_issued else 999"
  - card_discount_pct: "K('premium_card_discount_percent') if ((price_card_certificate == 'Crestline Companion Certificate First' or price_card_certificate == 'Crestline Companion Certificate Premium Economy') and price_card_age < K('card_recency_months')) else (K('standard_card_discount_percent') if ((price_card_certificate == 'Crestline Companion Certificate Main Cabin' or price_card_certificate == 'Crestline Companion Certificate Main Plus') and price_card_age < K('card_recency_months')) else 0)"
  - price_pass_product: "CFIELD('pass', 'variant_name')"
  - price_pass_state: "CFIELD('pass', 'status')"
  - pass_discount_pct: "K('seat_and_bag_pass_discount_percent') if ((price_pass_product == 'Crestline Seat and Bag Pass Domestic' or price_pass_product == 'Crestline Seat and Bag Pass Network') and price_pass_state == 'active') else (K('single_pass_discount_percent') if ((price_pass_product == 'Crestline Bag Pass One' or price_pass_product == 'Crestline Bag Pass Two' or price_pass_product == 'Crestline Seat Pass Domestic' or price_pass_product == 'Crestline Seat Pass Network') and price_pass_state == 'active') else 0)"
  - result: "RND(miles_bought / 1000 * net_price_per_1000 * (100 - card_discount_pct - pass_discount_pct) / 100, 2)"
  compute_basis:
    trip_ticket: "The trip covered is the ticket of the latest waitlisted miles upgrade request"
    trip_requests: "every miles upgrade request on that ticket with no clearance is costed at the miles upgrade cost for the segment's length"
    trip_clearances: "every miles upgrade request on that ticket with no clearance is costed at the miles upgrade cost for the segment's length"
    trip_distance: "the out and back segments of one trip having one length."
    trip_threshold: "against the ticket charter's segment_length_threshold_miles"
    miles_per_segment: "miles_upgrade_cost_long_segment above the threshold and miles_upgrade_cost_short_segment otherwise"
    miles_needed: "The miles short are those costs added together less the membership's mile balance"
    member_balance: "The miles short are those costs added together less the membership's mile balance"
    miles_short: "The miles short are those costs added together less the membership's mile balance; when the balance covers them nothing is bought"
    miles_bought: "when the balance covers them nothing is bought, and otherwise the miles bought are the miles short rounded up to the next purchase_increment_miles, and never fewer than min_miles_purchase."
    held_tier: "The tier price per thousand follows the tier the member holds and whether its validity runs through the day of the purchase"
    held_tier_days_left: "The tier price per thousand follows the tier the member holds and whether its validity runs through the day of the purchase"
    elite_price: "Summit Diamond or Summit Chairman still valid pays diamond_price_per_1000_usd, Summit Platinum still valid pays platinum_price_per_1000_usd, and any other tier pays miles_purchase_price_per_1000_usd."
    recent_purchases: "by the purchase entries posted on the membership in the last twelve months"
    buyer_price: "repeat_buyer_purchases or more set it at the tier price per thousand less the flat repeat_buyer_reduction_usd, exactly one sets it at the tier price per thousand multiplied by returning_buyer_share and rounded to the cent, and none keeps it at the tier price per thousand."
    price_lounge_product: "it follows the member's Summit Club membership"
    price_lounge_state: "it follows the member's Summit Club membership"
    lounge_reduction: "an active Summit Club Executive, Summit Club Corporate or Summit Club Lifetime membership takes off premium_lounge_reduction_per_1000_usd, an active Summit Club Essential, Summit Club Individual or Summit Club Individual Plus membership takes off standard_lounge_reduction_per_1000_usd, and a member with no active Summit Club membership takes nothing off."
    trip_cabin: "and the cabin its latest waitlisted miles upgrade request asks for"
    trip_departure: "it follows the calendar days from the purchase to the scheduled departure of the trip covered, as its ticket shows it"
    days_to_trip: "it follows the calendar days from the purchase to the scheduled departure of the trip covered, as its ticket shows it"
    cabin_reduction: "a trip departing within close_trip_days days whose request asks for First takes off first_upgrade_reduction_per_1000_usd, a trip departing within close_trip_days days whose request asks for Premium Economy takes off premium_economy_upgrade_reduction_per_1000_usd, and a trip departing more than close_trip_days days after the purchase takes nothing off."
    net_price_per_1000: "The lounge reduction is taken off the net price per thousand"
    price_card_certificate: "the card discount follows the companion certificate issued on a Crestline co-branded card anniversary"
    price_card_issued: "the card discount follows the companion certificate issued on a Crestline co-branded card anniversary"
    price_card_age: "issued within the last card_recency_months months"
    card_discount_pct: "a Crestline Companion Certificate First or Premium Economy issued within the last card_recency_months months gives premium_card_discount_percent percent, a Crestline Companion Certificate Main Cabin or Main Plus issued within the last card_recency_months months gives standard_card_discount_percent percent, and a member with no such certificate in that span gets none."
    price_pass_product: "it follows the member's seat and bag subscription"
    price_pass_state: "it follows the member's seat and bag subscription"
    pass_discount_pct: "an active Crestline Seat and Bag Pass Domestic or Network gives seat_and_bag_pass_discount_percent percent, an active Crestline Bag Pass One or Two or Crestline Seat Pass Domestic or Network gives single_pass_discount_percent percent, and a member with no active subscription gets none."
    result: "every percentage discount on one top-up purchase is added together and taken off the price once, before the price is rounded to the cent"
  factors:
  - id: elite_purchase_price
    effect: parameter
    decides: elite_price
    bindings: [held_tier, held_tier_days_left, elite_price]
    ladder:
    - when: "the tier held is Summit Diamond or Summit Chairman AND its validity runs through the day of the purchase"
      value: "a tier price per thousand of K('diamond_price_per_1000_usd')"
    - when: "the tier held is Summit Platinum AND its validity runs through the day of the purchase"
      value: "a tier price per thousand of K('platinum_price_per_1000_usd')"
    - when: "otherwise"
      value: "a tier price per thousand of P('miles_purchase_price_per_1000_usd')"
    baseline:
      elite_price: "P('miles_purchase_price_per_1000_usd')"
    evidence: [tier_param, date]
    cross_difficulty: null
  - id: repeat_buyer_treatment
    effect: method
    decides: buyer_price
    bindings: [recent_purchases, buyer_price]
    ladder:
    - when: "repeat_buyer_purchases or more purchase entries were posted in the last twelve months"
      method: "the net price per thousand is set, before any amount per thousand is taken off it, at the tier price per thousand less the flat repeat_buyer_reduction_usd"
    - when: "exactly one purchase entry was posted"
      method: "the net price per thousand is set, before any amount per thousand is taken off it, at the tier price per thousand times returning_buyer_share, rounded to the cent"
    - when: "otherwise"
      method: "the net price per thousand is kept at the tier price per thousand"
    baseline:
      buyer_price: "elite_price"
    evidence: [history]
    cross_difficulty: null
  - id: lounge_price_reduction
    effect: parameter
    decides: lounge_reduction
    bindings: [price_lounge_product, price_lounge_state, lounge_reduction]
    ladder:
    - when: "the member's Summit Club membership is Summit Club Executive, Summit Club Corporate or Summit Club Lifetime AND it is active"
      value: "K('premium_lounge_reduction_per_1000_usd') taken off the net price per thousand"
    - when: "the member's Summit Club membership is Summit Club Essential, Summit Club Individual or Summit Club Individual Plus AND it is active"
      value: "K('standard_lounge_reduction_per_1000_usd') taken off the net price per thousand"
    - when: "otherwise"
      value: "nothing taken off the net price per thousand"
    baseline:
      lounge_reduction: "0"
    evidence: [cross_category]
    cross_difficulty: null
  - id: departure_cabin_reduction
    effect: parameter
    decides: cabin_reduction
    bindings: [trip_cabin, trip_departure, days_to_trip, cabin_reduction]
    ladder:
    - when: "the trip covered departs within close_trip_days days of the purchase AND its latest waitlisted miles upgrade request asks for First"
      value: "K('first_upgrade_reduction_per_1000_usd') taken off the net price per thousand"
    - when: "the trip covered departs within close_trip_days days of the purchase AND its latest waitlisted miles upgrade request asks for Premium Economy"
      value: "K('premium_economy_upgrade_reduction_per_1000_usd') taken off the net price per thousand"
    - when: "otherwise (the trip departs more than close_trip_days days after the purchase)"
      value: "nothing taken off the net price per thousand"
    baseline:
      cabin_reduction: "0"
    evidence: [history, cross_category, date]
    cross_difficulty: ticket
  - id: card_purchase_discount
    effect: parameter
    decides: card_discount_pct
    bindings: [price_card_certificate, price_card_issued, price_card_age, card_discount_pct]
    ladder:
    - when: "the card-anniversary companion certificate is Crestline Companion Certificate First or Premium Economy AND it was issued within the last card_recency_months months"
      value: "K('premium_card_discount_percent') percent of the price, added to every other percentage discount and taken off the price once, before rounding to the cent"
    - when: "the card-anniversary companion certificate is Crestline Companion Certificate Main Cabin or Main Plus AND it was issued within the last card_recency_months months"
      value: "K('standard_card_discount_percent') percent of the price, added to every other percentage discount and taken off the price once, before rounding to the cent"
    - when: "otherwise"
      value: "no percentage discount"
    baseline:
      card_discount_pct: "0"
    evidence: [cross_category, date]
    cross_difficulty: companion
  - id: subscription_purchase_discount
    effect: parameter
    decides: pass_discount_pct
    bindings: [price_pass_product, price_pass_state, pass_discount_pct]
    ladder:
    - when: "the member's subscription is Crestline Seat and Bag Pass Domestic or Network AND it is active"
      value: "K('seat_and_bag_pass_discount_percent') percent of the price, added to every other percentage discount and taken off the price once, before rounding to the cent"
    - when: "the member's subscription is Crestline Bag Pass One or Two or Crestline Seat Pass Domestic or Network AND it is active"
      value: "K('single_pass_discount_percent') percent of the price, added to every other percentage discount and taken off the price once, before rounding to the cent"
    - when: "otherwise"
      value: "no percentage discount"
    baseline:
      pass_discount_pct: "0"
    evidence: [cross_category]
    cross_difficulty: null
  baseline:
    rule: >-
      The trip covered is the ticket of the latest waitlisted miles upgrade request; every miles upgrade
      request on that ticket with no clearance is costed at the miles upgrade cost for the segment's length
      against the ticket charter's segment_length_threshold_miles, miles_upgrade_cost_long_segment above the
      threshold and miles_upgrade_cost_short_segment otherwise, the out and back segments of one trip having
      one length. The miles short are those costs added together less the membership's mile balance; when the
      balance covers them nothing is bought, and otherwise the miles bought are the miles short rounded up to
      the next purchase_increment_miles, and never fewer than min_miles_purchase. The tier price per thousand
      is miles_purchase_price_per_1000_usd, and the net price per thousand is the tier price per thousand. The
      standard price is the miles bought, in thousands, times the net price per thousand, rounded to the cent.
    params: [miles_purchase_price_per_1000_usd]
  inputs:
    history:
    - {table: loyalty_upgrades, aggregate: count, field: upgrade_id, filters: {event_type: loyalty_upgrade_request, upgrade_method: miles}}
    - {table: loyalty_upgrades, aggregate: count, field: upgrade_id, filters: {event_type: loyalty_upgrade_clear, upgrade_method: miles}}
    - {table: loyalty_activity, aggregate: count, field: loyalty_activity_id, within_months: 12, filters: {event_type: loyalty_miles_purchase}}
    cross_category: [ticket, club, companion, pass]
