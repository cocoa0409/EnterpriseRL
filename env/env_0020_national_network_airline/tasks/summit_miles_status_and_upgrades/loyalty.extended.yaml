- id: loyalty_upgrades_policy
  subject:
  - loyalty_upgrade_request
  - loyalty_upgrade_clear
  - loyalty_certificate_redeem
  - loyalty_certificate_expiry
  rule: 'A member may waitlist an unflown segment of a ticket that names the membership for an upgrade by exactly
    one upgrade_method: complimentary, certificate or miles. An upgrade is requested only on a ticket whose fare
    brand has complimentary_upgrade_eligible set to true in the ticket charter; Crestline Basic Economy is never
    upgraded and Crestline First has no higher cabin. A complimentary upgrade is available only when complimentary_upgrade_eligible
    is true for the member''s tier, clears no earlier than complimentary_upgrade_window_hours before departure,
    and competes with other requests by upgrade_priority_rank of the tier held on the flight date, ties broken by
    the earlier request_date. A certificate upgrade consumes certificates_per_short_segment certificates on a domestic
    or short-haul international segment and certificates_per_long_haul_segment on a long-haul international segment,
    drawn from the batch expiring first, and may be requested at any time after ticketing. A miles upgrade costs
    miles_upgrade_cost_short_segment miles on segments up to the ticket charter''s segment_length_threshold_miles
    and miles_upgrade_cost_long_segment miles on longer segments, plus miles_upgrade_copay_usd per segment. On award
    tickets complimentary and certificate upgrades are available only when upgrade_on_award_tickets is true for
    the member''s tier. When companion_upgrade_permitted is true one companion on the same reservation is upgraded
    together with the member for no additional certificates or miles. Certificates and miles are charged only when
    the upgrade clears; a request that never clears costs nothing. Certificates are consumed only from a membership
    whose status is active. Certificates not used by their certificate_expiry_date expire the following day, batch
    by batch, and are never extended or reissued. A segment already confirmed in the higher cabin by a paid upgrade
    is never waitlisted again.'
  eligibility:
  - id: certificate_member_active
    applies_to:
    - loyalty_certificate_redeem
    kind: state
    condition: Certificates are consumed only from a membership whose status is active.
    evidence_fields:
    - loyalty_holdings.membership_id
    - loyalty_holdings.status
    - loyalty_holdings.upgrade_certificate_balance
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - loyalty_holdings.membership_id
      action_bindings:
        loyalty_holdings.membership_id: membership_id
    state_contract:
      field: loyalty_holdings.status
      allowed:
      - active
  - id: upgradeable_brand
    applies_to:
    - loyalty_upgrade_request
    kind: state
    condition: An upgrade is requested only on a ticket whose fare brand has complimentary_upgrade_eligible set
      to true in the ticket charter
    evidence_fields:
    - ticket_holdings.ticket_id
    - ticket_holdings.variant_name
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - ticket_holdings.ticket_id
      action_bindings:
        ticket_holdings.ticket_id: source_ticket_id
    state_contract:
      field: ticket_holdings.variant_name
      allowed:
      - Crestline Main Cabin
      - Crestline Main Plus
      - Crestline Main Flexible
      - Crestline Premium Economy
  params:
    per_tier:
      Summit Member:
        complimentary_upgrade_eligible: =complimentary_upgrade_eligible
        complimentary_upgrade_window_hours: =complimentary_upgrade_window_hours
        upgrade_priority_rank: =upgrade_priority_rank
        companion_upgrade_permitted: =companion_upgrade_permitted
        upgrade_on_award_tickets: =upgrade_on_award_tickets
        certificates_per_short_segment: =certificates_per_short_segment
        certificates_per_long_haul_segment: =certificates_per_long_haul_segment
        miles_upgrade_cost_short_segment: =miles_upgrade_cost_short_segment
        miles_upgrade_cost_long_segment: =miles_upgrade_cost_long_segment
        miles_upgrade_copay_usd: =miles_upgrade_copay_usd
        certificate_validity_months: =certificate_validity_months
