- id: loyalty_inactivity_expiry
  subject:
  - loyalty_go_dormant
  - loyalty_miles_expiry
  - loyalty_reactivate
  - loyalty_activate
  rule: When miles_expiry_applies is true for the member's tier and loyalty_msr_months_since_last_activity reaches
    inactivity_months_before_expiry, the membership becomes dormant and its entire mile_balance is forfeited with
    forfeit_reason inactivity. Members of every elite tier have miles_expiry_applies set to false, so their miles
    never expire while they hold that tier; the clock applies again from the day a member falls to Summit Member.
    Goodwill, bonus, reversal and forfeiture postings never count as activity and never keep miles alive. A forfeiture
    entry is booked only on a membership whose status is dormant or closed. Any later qualifying activity makes
    a dormant membership active again, but forfeited miles return only through reinstatement. Qualifying dollars
    and upgrade certificates are not affected by dormancy.
  eligibility:
  - id: forfeit_status
    applies_to:
    - loyalty_miles_expiry
    kind: state
    condition: A forfeiture entry is booked only on a membership whose status is dormant or closed.
    evidence_fields:
    - loyalty_holdings.membership_id
    - loyalty_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - loyalty_holdings.membership_id
      action_bindings:
        loyalty_holdings.membership_id: membership_id
    state_contract:
      field: loyalty_holdings.status
      allowed:
      - dormant
      - closed
  params:
    per_tier:
      Summit Member:
        miles_expiry_applies: =miles_expiry_applies
        inactivity_months_before_expiry: =inactivity_months_before_expiry
      Summit Silver:
        miles_expiry_applies: =miles_expiry_applies
        inactivity_months_before_expiry: =inactivity_months_before_expiry
      Summit Gold:
        miles_expiry_applies: =miles_expiry_applies
        inactivity_months_before_expiry: =inactivity_months_before_expiry
      Summit Platinum:
        miles_expiry_applies: =miles_expiry_applies
        inactivity_months_before_expiry: =inactivity_months_before_expiry
      Summit Diamond:
        miles_expiry_applies: =miles_expiry_applies
        inactivity_months_before_expiry: =inactivity_months_before_expiry
      Summit Chairman:
        miles_expiry_applies: =miles_expiry_applies
        inactivity_months_before_expiry: =inactivity_months_before_expiry
  measures:
  - loyalty_msr_months_since_last_activity
- id: loyalty_miles_reinstatement_rules
  subject:
  - loyalty_miles_reinstatement
  rule: Miles forfeited through inactivity may be reinstated in full once, for a fee from reinstatement_fee_ladder
    chosen by the number of miles reinstated, the band bounds being inclusive. Expired miles can be reinstated no
    later than the inactivity forfeiture was posted plus miles_reinstatement_window_days. The window is counted
    in calendar days from the activity_date of the forfeiture entry, and a request on the last day is accepted.
    Reinstatement returns exactly the miles of one inactivity forfeiture entry, never part of it, and each forfeiture
    can be reinstated at most once. Miles forfeited on account closure can never be reinstated. Reinstatement is
    a customer-paid service and does not itself count as qualifying activity; the member must also have, or post,
    qualifying activity for a dormant membership to become active.
  eligibility:
  - id: reinstatement_window
    applies_to:
    - loyalty_miles_reinstatement
    kind: time
    condition: Expired miles can be reinstated no later than the inactivity forfeiture was posted plus miles_reinstatement_window_days.
    evidence_fields:
    - loyalty_activity.loyalty_activity_id
    - loyalty_activity.activity_date
    - loyalty_activity.forfeit_reason
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - loyalty_activity.loyalty_activity_id
      action_bindings:
        loyalty_activity.loyalty_activity_id: reversed_activity_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the inactivity forfeiture was posted
      anchor_source: loyalty_activity.activity_date
      relation: not_after
      duration_source: variants.miles_reinstatement_window_days
      unit: calendar_days
      counting_rule: The window is counted in calendar days from the activity_date of the forfeiture entry, and
        a request on the last day is accepted.
      boundary: inclusive
  - id: reinstate_once
    applies_to:
    - loyalty_miles_reinstatement
    kind: dedup
    condition: each forfeiture can be reinstated at most once
    evidence_fields:
    - loyalty_activity.loyalty_activity_id
    - loyalty_activity.reversed_activity_id
    - loyalty_activity.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - loyalty_activity.loyalty_activity_id
      action_bindings:
        loyalty_activity.loyalty_activity_id: reversed_activity_id
    dedup_contract:
      table: loyalty_activity
      mode: separate_record
      object_bindings:
        reversed_activity_id: reversed_activity_id
      duplicate_filters:
        event_type:
        - loyalty_miles_reinstatement
      distinct_fields: []
  params:
    per_tier:
      Summit Member:
        miles_reinstatement_window_days: =miles_reinstatement_window_days
        reinstatement_fee_ladder: =reinstatement_fee_ladder
      Summit Silver:
        miles_reinstatement_window_days: =miles_reinstatement_window_days
        reinstatement_fee_ladder: =reinstatement_fee_ladder
      Summit Gold:
        miles_reinstatement_window_days: =miles_reinstatement_window_days
        reinstatement_fee_ladder: =reinstatement_fee_ladder
      Summit Platinum:
        miles_reinstatement_window_days: =miles_reinstatement_window_days
        reinstatement_fee_ladder: =reinstatement_fee_ladder
      Summit Diamond:
        miles_reinstatement_window_days: =miles_reinstatement_window_days
        reinstatement_fee_ladder: =reinstatement_fee_ladder
      Summit Chairman:
        miles_reinstatement_window_days: =miles_reinstatement_window_days
        reinstatement_fee_ladder: =reinstatement_fee_ladder
- id: loyalty_miles_transfers
  subject:
  - loyalty_miles_transfer_out
  - loyalty_miles_transfer_in
  rule: A member may transfer miles to another person's Summit membership in whole multiples of transfer_increment_miles,
    at least min_transfer_miles in one transfer. Miles can be transferred out only from a membership whose status
    is active, and only to a recipient membership whose status is enrolled or active. The miles transferred out
    in the calendar year, as counted by loyalty_msr_miles_transferred_out_this_year together with the new transfer,
    may not exceed max_transfer_out_per_calendar_year of the sender's tier. The sender pays transfer_fee_per_1000_miles_usd
    for each thousand miles transferred plus transfer_processing_fee_usd per transfer, recorded as fee_usd on the
    transfer-out entry; the recipient pays nothing. A completed transfer is final and is never reversed on request,
    and transferred miles never earn qualifying dollars. Transfers count as qualifying activity for both memberships.
  eligibility:
  - id: sender_active
    applies_to:
    - loyalty_miles_transfer_out
    kind: state
    condition: Miles can be transferred out only from a membership whose status is active
    evidence_fields:
    - loyalty_holdings.membership_id
    - loyalty_holdings.status
    - loyalty_holdings.mile_balance
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - loyalty_holdings.membership_id
      action_bindings:
        loyalty_holdings.membership_id: membership_id
    state_contract:
      field: loyalty_holdings.status
      allowed:
      - active
  params:
    per_tier:
      Summit Member:
        transfer_increment_miles: =transfer_increment_miles
        min_transfer_miles: =min_transfer_miles
        transfer_fee_per_1000_miles_usd: =transfer_fee_per_1000_miles_usd
        transfer_processing_fee_usd: =transfer_processing_fee_usd
        max_transfer_out_per_calendar_year: =max_transfer_out_per_calendar_year
      Summit Silver:
        transfer_increment_miles: =transfer_increment_miles
        min_transfer_miles: =min_transfer_miles
