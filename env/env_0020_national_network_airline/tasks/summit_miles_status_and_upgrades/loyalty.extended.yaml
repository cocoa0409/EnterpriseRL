- id: loyalty_goodwill_and_bonus
  subject:
  - loyalty_goodwill_credit
  - loyalty_bonus_credit
  rule: Goodwill miles are posted only as computed by the ticket charter's compensation rule for a controllable
    disruption, to the membership named on the disrupted ticket, and in exactly that number of miles; a support
    agent never grants discretionary miles outside that rule. Bonus miles are posted only for a choice-benefit selection
    or a published promotion recorded with its bonus_reason. Goodwill and bonus credits post to a membership whose
    status is enrolled, active or dormant, but they never count as qualifying activity and never earn qualifying
    dollars. A request for goodwill miles for a reason no rule covers is transferred to a human representative.
  eligibility:
  - id: goodwill_open_membership
    applies_to:
    - loyalty_goodwill_credit
    - loyalty_bonus_credit
    kind: state
    condition: Goodwill and bonus credits post to a membership whose status is enrolled, active or dormant
    evidence_fields:
    - loyalty_holdings.membership_id
    - loyalty_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - loyalty_holdings.membership_id
      action_bindings:
        loyalty_holdings.membership_id: membership_id
    state_contract:
      field: loyalty_holdings.status
      allowed:
      - enrolled
      - active
      - dormant
- id: loyalty_accrual_corrections
  subject:
  - loyalty_accrual_reversal
  rule: A posting made in error — the same segment credited twice, activity credited to the wrong member, or a partner
    posting the partner has cancelled — is reversed in full by one reversal entry naming the posting. Each posting
    can be reversed at most once. A reversal may take the mile_balance below the miles it removes only down to zero;
    the remainder is left unrecovered and referred to a human representative. A posting the member merely disputes
    the amount of is not reversed; the correct amount is re-derived under the earning rules and any shortfall is
    posted as a retro credit.
  eligibility:
  - id: reverse_once
    applies_to:
    - loyalty_accrual_reversal
    kind: dedup
    condition: Each posting can be reversed at most once.
    evidence_fields:
    - loyalty_activity.loyalty_activity_id
    - loyalty_activity.reversed_activity_id
    - loyalty_activity.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - loyalty_activity.loyalty_activity_id
      action_bindings:
        loyalty_activity.loyalty_activity_id: reversed_activity_id
    dedup_contract:
      table: loyalty_activity
      mode: separate_record
      object_bindings:
        reversed_activity_id: reversed_activity_id
      duplicate_filters:
        event_type:
        - loyalty_accrual_reversal
      distinct_fields: []
- id: loyalty_account_closure
  subject:
  - loyalty_close
  - loyalty_miles_expiry
  rule: Only the member can close a Summit membership, by confirming the closure personally. Closing forfeits the
    entire mile_balance with forfeit_reason account_closure, and all unused upgrade certificates and unmade choice
    selections lapse; none of these can ever be reinstated. A membership cannot be closed while it has an open waitlisted
    upgrade or an unflown award ticket issued from it; those must be cancelled first. Companion certificates and
    passes are revoked with their remaining trips under the companion charter, a club membership issued as a choice
    benefit runs to its renewal date and is not renewed as a benefit, and credits or tickets in the customer's name
    are unaffected.
  eligibility:
  - id: no_open_awards
    applies_to:
    - loyalty_close
    kind: authorization
    condition: A membership cannot be closed while it has an open waitlisted upgrade or an unflown award ticket
      issued from it
    evidence_fields:
    - loyalty_activity.award_ticket_number
    - loyalty_activity.event_type
    - ticket_holdings.ticket_number
    - ticket_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - ticket_holdings.ticket_number
      action_bindings:
        ticket_holdings.ticket_number: award_ticket_number
