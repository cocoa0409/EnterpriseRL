      Crestline First:
        name_correction_max_characters: =name_correction_max_characters
- id: ticket_evt_paid_upgrade
  subject:
  - ticket_upgrade_purchase
  rule: A paid upgrade moves the passenger on one unflown segment into a higher cabin for a fixed fee. A paid upgrade
    is available only when the ticket's fare brand has paid_upgrade_permitted set to true. The fee is paid_upgrade_to_premium_economy_fee
    for a move into Premium Economy, and paid_upgrade_to_first_fee_short_segment or paid_upgrade_to_first_fee_long_segment
    for a move into First on segments up to and including segment_length_threshold_miles or longer. A paid upgrade
    can be purchased only while the ticket is ticketed or partially_flown, and only for a segment not yet flown.
    The fare brand, the ticket's refund and change rules and its accrual basis are unchanged by a paid upgrade.
    A cabin already confirmed on the segment through a complimentary Summit upgrade or an upgrade certificate is
    never sold again as a paid upgrade. A paid upgrade that is not provided is refunded under the fee-refund rule.
