- id: ticket_evt_seat_fees
  subject:
  - ticket_seat_purchase
  rule: 'Advance seat selection follows the fare brand''s advance_seat_selection value: paid_only means every advance
    seat is purchased and a standard seat is otherwise assigned free at check-in; standard_included means standard
    seats are free and preferred or extra-legroom seats are purchased; extra_legroom_included means preferred and
    extra-legroom seats are free; premium_cabin_included means the passenger sits in the premium cabin and no main-cabin
    seat fee applies. A seat fee is charged per passenger per flight segment, chosen by the service_type purchased
    and the segment_miles: segments up to and including segment_length_threshold_miles use the short-segment price
    and longer segments use the long-segment price of standard_seat_fee, preferred_seat_fee or extra_legroom_seat_fee
    for the fare brand. A seat can be purchased only while the ticket is ticketed or partially_flown. When the passenger''s
    Summit membership tier includes the seat in the loyalty charter (complimentary_preferred_seating or complimentary_extra_legroom_seating),
    the seat is assigned at no charge and no fee entry is written; the fare-brand inclusion and the elite inclusion
    never combine into a credit, and the lowest applicable price, zero where either includes the seat, is the one
    charged. A seat already confirmed on the segment must be released before another is purchased; the released
    seat''s fee is not refunded unless the fee-refund rule applies. A seat Crestline later fails to provide is refunded
    under the fee-refund rule.'
