        dbc_high_band_percent_of_fare: =dbc_high_band_percent_of_fare
        dbc_high_band_cap_usd: =dbc_high_band_cap_usd
        dbc_voucher_uplift_percent: =dbc_voucher_uplift_percent
      Crestline Main Flexible:
        dbc_min_arrival_delay_hours: =dbc_min_arrival_delay_hours
        dbc_low_band_upper_hours_domestic: =dbc_low_band_upper_hours_domestic
        dbc_low_band_upper_hours_international: =dbc_low_band_upper_hours_international
        dbc_low_band_percent_of_fare: =dbc_low_band_percent_of_fare
        dbc_low_band_cap_usd: =dbc_low_band_cap_usd
        dbc_high_band_percent_of_fare: =dbc_high_band_percent_of_fare
        dbc_high_band_cap_usd: =dbc_high_band_cap_usd
        dbc_voucher_uplift_percent: =dbc_voucher_uplift_percent
      Crestline Premium Economy:
        dbc_min_arrival_delay_hours: =dbc_min_arrival_delay_hours
        dbc_low_band_upper_hours_domestic: =dbc_low_band_upper_hours_domestic
        dbc_low_band_upper_hours_international: =dbc_low_band_upper_hours_international
        dbc_low_band_percent_of_fare: =dbc_low_band_percent_of_fare
        dbc_low_band_cap_usd: =dbc_low_band_cap_usd
        dbc_high_band_percent_of_fare: =dbc_high_band_percent_of_fare
        dbc_high_band_cap_usd: =dbc_high_band_cap_usd
        dbc_voucher_uplift_percent: =dbc_voucher_uplift_percent
      Crestline First:
        dbc_min_arrival_delay_hours: =dbc_min_arrival_delay_hours
        dbc_low_band_upper_hours_domestic: =dbc_low_band_upper_hours_domestic
        dbc_low_band_upper_hours_international: =dbc_low_band_upper_hours_international
        dbc_low_band_percent_of_fare: =dbc_low_band_percent_of_fare
        dbc_low_band_cap_usd: =dbc_low_band_cap_usd
        dbc_high_band_percent_of_fare: =dbc_high_band_percent_of_fare
        dbc_high_band_cap_usd: =dbc_high_band_cap_usd
        dbc_voucher_uplift_percent: =dbc_voucher_uplift_percent
  formula:
    when_not: arrival_delay_minutes < dbc_min_arrival_delay_hours * 60
    dbc_cash: min(dbc_low_band_cap_usd, segment_fare_amount * dbc_low_band_percent_of_fare / 100) if arrival_delay_minutes
      <= (dbc_low_band_upper_hours_domestic if route_type == 'domestic' else dbc_low_band_upper_hours_international)
      * 60 else min(dbc_high_band_cap_usd, segment_fare_amount * dbc_high_band_percent_of_fare / 100)
    dbc_voucher: round(dbc_cash * (100 + dbc_voucher_uplift_percent) / 100, 2)
- id: ticket_evt_involuntary_downgrade
  subject:
  - ticket_compensation
  rule: A passenger moved involuntarily to a lower cabin, or off the extra-legroom seating their fare brand includes,
    on a segment because of an equipment swap or an oversold premium cabin receives a downgrade_refund of downgrade_compensation_percent
    percent of that segment's segment_fare_amount, paid to the original form of payment, whatever the disruption_cause.
    A downgrade is compensated only when a disruption record of type involuntary_downgrade exists on the segment.
    A fare brand whose downgrade_compensation_percent is zero has no cabin or seating entitlement it can be moved
    below, and receives no downgrade refund. A move requested by the passenger is never compensated. Any seat or
    upgrade fee paid for the segment is refunded in full under the fee-refund rule in addition to this compensation,
    and no goodwill is paid for the same disruption.
  eligibility:
  - id: downgrade_record
    applies_to:
    - ticket_compensation
    kind: state
    condition: A downgrade is compensated only when a disruption record of type involuntary_downgrade exists on
      the segment.
    evidence_fields:
    - ticket_disruptions.disruption_id
    - ticket_disruptions.disruption_type
    - ticket_disruptions.segment_fare_amount
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - ticket_disruptions.disruption_id
      action_bindings:
        ticket_disruptions.disruption_id: source_disruption_id
    state_contract:
      field: ticket_disruptions.disruption_type
      allowed:
      - involuntary_downgrade
  params:
    per_tier:
      Crestline Basic Economy:
        downgrade_compensation_percent: =downgrade_compensation_percent
      Crestline Main Cabin:
        downgrade_compensation_percent: =downgrade_compensation_percent
      Crestline Main Plus:
        downgrade_compensation_percent: =downgrade_compensation_percent
      Crestline Main Flexible:
        downgrade_compensation_percent: =downgrade_compensation_percent
      Crestline Premium Economy:
        downgrade_compensation_percent: =downgrade_compensation_percent
      Crestline First:
        downgrade_compensation_percent: =downgrade_compensation_percent
  formula:
    downgrade_refund: round(segment_fare_amount * downgrade_compensation_percent / 100, 2)
- id: ticket_travel_and_no_show
  subject:
  - ticket_coupon_flown
  - ticket_first_flown
  - ticket_fully_flown
  - ticket_no_show
  - ticket_value_forfeit
  rule: 'Each flown segment consumes its coupon value from the ticket: the coupon entry records segment_number,
    flight_number, flight_date and cabin_flown and moves that segment''s share of the fare out of the ticket value.
    A coupon is flown only on a ticket that is ticketed or partially_flown. The first flown coupon of a multi-segment
    ticket moves it to partially_flown and the final coupon moves it to flown. Every flown coupon passes to the
    passenger''s Summit membership for accrual on the fare brand''s earning basis: qualifying dollars on status_credit_percent
    percent of the segment fare, and a cabin bonus of premium_cabin_bonus_percent percent of the base award miles;
    the per-dollar earning rates belong to the loyalty charter. A passenger who neither cancels before the cancellation
    cutoff nor boards is a no-show, and the remaining itinerary is cancelled. When no_show_handling is forfeit_all
    the ticket moves to forfeited and its entire residual_value is forfeited with forfeit_reason no_show; when it
    is retain_value the unflown value stays on the ticket, which remains ticketed for a later cancellation or refund.
    A passenger who missed a flight because of a Crestline disruption recorded on that segment is reaccommodated
    and is never treated as a no-show. A no-show forfeiture is booked only on a ticket whose status is forfeited,
    and a cancellation-fee retention only on a ticket whose status is cancelled_to_credit.'
  eligibility:
  - id: coupon_ticket_open
    applies_to:
    - ticket_coupon_flown
    kind: state
    condition: A coupon is flown only on a ticket that is ticketed or partially_flown.
    evidence_fields:
    - ticket_holdings.ticket_id
    - ticket_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - ticket_holdings.ticket_id
      action_bindings:
        ticket_holdings.ticket_id: ticket_id
    state_contract:
      field: ticket_holdings.status
      allowed:
      - ticketed
      - partially_flown
  - id: forfeit_status
    applies_to:
    - ticket_value_forfeit
    kind: state
    condition: A no-show forfeiture is booked only on a ticket whose status is forfeited, and a cancellation-fee
      retention only on a ticket whose status is cancelled_to_credit.
    evidence_fields:
    - ticket_holdings.ticket_id
    - ticket_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - ticket_holdings.ticket_id
      action_bindings:
        ticket_holdings.ticket_id: ticket_id
    state_contract:
      field: ticket_holdings.status
      allowed:
      - forfeited
      - cancelled_to_credit
  params:
    per_tier:
      Crestline Basic Economy:
        no_show_handling: =no_show_handling
        status_credit_percent: =status_credit_percent
        premium_cabin_bonus_percent: =premium_cabin_bonus_percent
      Crestline Main Cabin:
        no_show_handling: =no_show_handling
        status_credit_percent: =status_credit_percent
        premium_cabin_bonus_percent: =premium_cabin_bonus_percent
      Crestline Main Plus:
        no_show_handling: =no_show_handling
        status_credit_percent: =status_credit_percent
        premium_cabin_bonus_percent: =premium_cabin_bonus_percent
      Crestline Main Flexible:
        no_show_handling: =no_show_handling
        status_credit_percent: =status_credit_percent
        premium_cabin_bonus_percent: =premium_cabin_bonus_percent
      Crestline Premium Economy:
        no_show_handling: =no_show_handling
        status_credit_percent: =status_credit_percent
        premium_cabin_bonus_percent: =premium_cabin_bonus_percent
      Crestline First:
        no_show_handling: =no_show_handling
        status_credit_percent: =status_credit_percent
        premium_cabin_bonus_percent: =premium_cabin_bonus_percent
- id: ticket_name_rules
  subject:
  - ticket_name_correction
  rule: A ticket is issued to one named passenger and can never be transferred to another person, except a ticket
    booked under a corporate agreement whose tier allows reassignment under the corporate-agreement rule. The passenger_name
    may be corrected to match the passenger's government ID when the correction changes no more than name_correction_max_characters
    characters in total, or when the passenger's legal name changed after issue and the customer profile name already
    shows the new legal name; a permitted correction is free. A name correction is made only while the ticket is
    held or ticketed. A request that would change the person travelling, or that exceeds the character limit without
    a legal name change shown on the profile, is refused, and the customer may cancel under the cancellation rules
    instead.
  eligibility:
  - id: correction_status
    applies_to:
    - ticket_name_correction
    kind: state
    condition: A name correction is made only while the ticket is held or ticketed.
    evidence_fields:
    - ticket_holdings.ticket_id
    - ticket_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - ticket_holdings.ticket_id
      action_bindings:
        ticket_holdings.ticket_id: ticket_id
    state_contract:
      field: ticket_holdings.status
      allowed:
      - held
      - ticketed
  params:
    per_tier:
      Crestline Basic Economy:
        name_correction_max_characters: =name_correction_max_characters
      Crestline Main Cabin:
        name_correction_max_characters: =name_correction_max_characters
      Crestline Main Plus:
        name_correction_max_characters: =name_correction_max_characters
      Crestline Main Flexible:
