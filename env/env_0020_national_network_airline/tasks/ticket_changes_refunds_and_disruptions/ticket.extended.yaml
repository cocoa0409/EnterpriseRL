extended_policies:
- id: ticket_ext_same_day_change_fee
  base_policy_refs:
  - ticket_voluntary_change
  - ticket_same_day_change
  - ticket_corporate_agreement_benefits
  overwrite:
  - base_policy: ticket_same_day_change
    superseded_clause: >-
      The fee is same_day_confirmed_change_fee per passenger per direction, recorded as a same_day_change_fee entry
      linked to the exchange entry.
    replaced_by: >-
      The same-day waiver rate, the delay relief rate and the fare band rate are multiplied together into one combined
      rate that acts once on the same-day change fee, and that product, rounded to the cent only at the end, is the
      same-day change fee posted.
  trigger: state_due
  subject:
  - ticket_change_fee
  computes: fee_amount
  target_tool: post_same_day_change_fee_61b8e8ae
  params:
    preferred_member_rate: 0.65
    member_min_flights: 6
    delay_waiver_minutes: 120
    delay_relief_minutes: 60
    delay_relief_rate: 0.45
    high_fare_floor: 300
    high_fare_rate: 0.5
    mid_fare_floor: 150
    mid_fare_rate: 0.8
  rule: >-
    This rule sets the same-day change fee owed for the latest same-day confirmed exchange recorded on a ticket. The
    fee is owed while no same-day change fee entry is linked to that exchange, whether or not the customer raises it,
    and it is posted through the call center as one same-day change fee entry linked to that exchange entry; a fee
    worked out at zero is not recorded, and an exchange whose fee works out at zero owes no same-day change fee.
    The same-day change fee is the fare brand's same-day confirmed change fee, charged once for each same-day
    confirmed exchange.
    The same-day waiver rate follows the Summit membership the ticket credits and the corporate travel agreement it
    names: an active membership whose tier waives the same-day change fee, or an active agreement whose tier waives
    change fees, gives a same-day waiver rate of zero; an active membership whose tier includes complimentary
    preferred seating but does not waive the same-day change fee, on a ticket naming no agreement that waives change
    fees, and whose holder has at least the minimum member flight count of Summit flight accruals dated within the
    last 12 months, gives the reduced preferred member rate; any other passenger has a same-day waiver rate of one.
    The delay relief rate follows the longest arrival delay shown on a delay record of the segment being changed for
    the flight date of that exchange: a delay of at least the waiver threshold in minutes gives a delay relief rate of
    zero, a delay of at least the relief threshold but below the waiver threshold gives the reduced delay relief rate,
    and a shorter delay or no delay record gives a delay relief rate of one.
    The fare the changed direction carries is measured by one of three conventions set by the state of the ticket:
    on a ticket with at least one flown coupon it is the fare collected less the coupon value already flown; on a
    round-trip ticket with no flown coupon it is half the fare collected; on any other ticket it is the whole fare
    collected.
    The fare collected is every fare-collection and add-collect entry on the ticket, and the coupon value already
    flown is every flown-coupon entry on it.
    The fare band rate follows the fare the changed direction carries: at or above the high fare floor it is the high
    fare band rate, at or above the middle fare floor but below the high fare floor it is the middle fare band rate,
    and below the middle fare floor it is one.
    The same-day waiver rate, the delay relief rate and the fare band rate are multiplied together into one combined
    rate that acts once on the same-day change fee, and that product, rounded to the cent only at the end, is the
    same-day change fee posted.
  prerequisite: []
  cross_category:
  - category: loyalty
    as: branch
    reads:
    - status
    - variant_name
    - loyalty_activity.event_type
    - loyalty_activity.activity_date
    note: The same-day waiver rate is decided from the Summit membership the ticket credits (tier waiver, preferred
      seating, active status) and from the count of that member's Summit flight accruals in the last 12 months.
  - category: business
    as: branch
    reads:
    - status
    - variant_name
    note: The same-day waiver rate is zero when the ticket names an active corporate agreement whose tier waives
      change fees.
  compute:
  - flown_coupons: "COUNT('ticket_transactions', event_type='ticket_coupon_flown')"
  - next_segment: "flown_coupons + 1"
  - sd_exchange_date: "LATEST('ticket_transactions', 'transaction_date', date_field='transaction_date', event_type='ticket_exchange', exchange_type='same_day_confirmed')"
  - member_active: "CFIELD('loyalty', 'status', membership_id=F('membership_id')) == 'active'"
  - member_waives: "CPARAM('loyalty', 'same_day_change_fee_waived', membership_id=F('membership_id')) == True"
  - member_preferred: "CPARAM('loyalty', 'complimentary_preferred_seating', membership_id=F('membership_id')) == True"
  - member_flights: "XCOUNT('loyalty', 'loyalty_activity', within_months=12, date_field='activity_date', event_type='loyalty_flight_accrual')"
  - agreement_waives: "(CFIELD('business', 'status', business_account_id=F('corporate_account_id')) == 'active') and (CPARAM('business', 'change_fee_waiver', business_account_id=F('corporate_account_id')) == True)"
  - member_rate: "0.0 if ((member_waives and member_active) or agreement_waives) else (K('preferred_member_rate') if (member_preferred and member_active and not member_waives and not agreement_waives and member_flights >= K('member_min_flights')) else 1.0)"
  - delay_minutes: "MAX('ticket_disruptions', 'arrival_delay_minutes', event_type='ticket_disruption_record', disruption_type='delay', segment_number=next_segment, flight_date=sd_exchange_date)"
  - delay_rate: "0.0 if delay_minutes >= K('delay_waiver_minutes') else (K('delay_relief_rate') if delay_minutes >= K('delay_relief_minutes') else 1.0)"
  - fare_collected: "SUM('ticket_transactions', 'amount', date_field='transaction_date', event_type='ticket_fare_collect') + SUM('ticket_transactions', 'amount', date_field='transaction_date', event_type='ticket_add_collect')"
  - fare_flown: "SUM('ticket_transactions', 'amount', date_field='transaction_date', event_type='ticket_coupon_flown')"
  - direction_fare: "(fare_collected - fare_flown) if flown_coupons > 0 else ((fare_collected / 2) if F('trip_type') == 'round_trip' else fare_collected)"
  - fare_rate: "K('high_fare_rate') if direction_fare >= K('high_fare_floor') else (K('mid_fare_rate') if direction_fare >= K('mid_fare_floor') else 1.0)"
  - result: "RND(P('same_day_confirmed_change_fee') * member_rate * delay_rate * fare_rate, 2)"
  compute_basis:
    flown_coupons: "on a ticket with at least one flown coupon it is the fare collected less the coupon value already flown"
    sd_exchange_date: "This rule sets the same-day change fee owed for the latest same-day confirmed exchange recorded on a ticket."
    member_active: "an active membership whose tier waives the same-day change fee"
    member_waives: "an active membership whose tier waives the same-day change fee"
    member_preferred: "an active membership whose tier includes complimentary preferred seating but does not waive the same-day change fee"
    member_flights: "whose holder has at least the minimum member flight count of Summit flight accruals dated within the last 12 months"
    agreement_waives: "or an active agreement whose tier waives change fees, gives a same-day waiver rate of zero"
    member_rate: "an active membership whose tier waives the same-day change fee, or an active agreement whose tier waives change fees, gives a same-day waiver rate of zero; an active membership whose tier includes complimentary preferred seating but does not waive the same-day change fee, on a ticket naming no agreement that waives change fees, and whose holder has at least the minimum member flight count of Summit flight accruals dated within the last 12 months, gives the reduced preferred member rate; any other passenger has a same-day waiver rate of one."
    delay_minutes: "The delay relief rate follows the longest arrival delay shown on a delay record of the segment being changed for the flight date of that exchange"
    delay_rate: "a delay of at least the waiver threshold in minutes gives a delay relief rate of zero, a delay of at least the relief threshold but below the waiver threshold gives the reduced delay relief rate, and a shorter delay or no delay record gives a delay relief rate of one."
    fare_collected: "The fare collected is every fare-collection and add-collect entry on the ticket"
    fare_flown: "the coupon value already flown is every flown-coupon entry on it."
    direction_fare: "on a ticket with at least one flown coupon it is the fare collected less the coupon value already flown; on a round-trip ticket with no flown coupon it is half the fare collected; on any other ticket it is the whole fare collected."
    fare_rate: "at or above the high fare floor it is the high fare band rate, at or above the middle fare floor but below the high fare floor it is the middle fare band rate, and below the middle fare floor it is one."
    result: "The same-day waiver rate, the delay relief rate and the fare band rate are multiplied together into one combined rate that acts once on the same-day change fee, and that product, rounded to the cent only at the end, is the same-day change fee posted."
  factors:
  - id: same_day_member_rate
    effect: parameter
    decides: member_rate
    bindings: [member_active, member_waives, member_preferred, member_flights, agreement_waives, member_rate]
    ladder:
    - when: "an active Summit membership whose tier waives the same-day change fee, or an active corporate agreement named on the ticket whose tier waives change fees"
      value: "0 (the fee is waived)"
    - when: "an active Summit membership whose tier includes complimentary preferred seating but does not waive the fee, on a ticket naming no waiving agreement, and at least the minimum member flight count of flight accruals in the last 12 months"
      value: "K('preferred_member_rate')"
    - when: "otherwise"
      value: "1"
    baseline:
      member_rate: "1.0"
    evidence: [cross_category, history]
    cross_difficulty: loyalty
  - id: same_day_delay_relief
    effect: parameter
    decides: delay_rate
    bindings: [sd_exchange_date, delay_minutes, delay_rate]
    ladder:
    - when: "the longest delay on a delay record of the segment for the flight date of the exchange reaches the waiver threshold"
      value: "0"
    - when: "that delay reaches the relief threshold but not the waiver threshold"
      value: "K('delay_relief_rate')"
    - when: "otherwise (a shorter delay or no delay record)"
      value: "1"
    baseline:
      delay_rate: "1.0"
    evidence: [history]
    cross_difficulty: null
  - id: same_day_fare_band
    effect: parameter
    decides: fare_rate
    bindings: [fare_collected, fare_flown, fare_rate]
    ladder:
    - when: "the fare the changed direction carries is at or above the high fare floor"
      value: "K('high_fare_rate')"
    - when: "it is at or above the middle fare floor but below the high fare floor"
      value: "K('mid_fare_rate')"
    - when: "otherwise"
      value: "1"
    baseline:
      fare_rate: "1.0"
    evidence: [history]
    cross_difficulty: null
  - id: same_day_direction_fare
    effect: method
    decides: direction_fare
    bindings: [flown_coupons, direction_fare]
    ladder:
    - when: "the ticket has at least one flown coupon"
      method: "the fare the changed direction carries is the fare collected less the coupon value already flown"
    - when: "a round-trip ticket with no flown coupon"
      method: "it is half the fare collected"
    - when: "otherwise"
      method: "it is the whole fare collected"
    baseline:
      direction_fare: "fare_collected"
    evidence: [history]
    cross_difficulty: null
  baseline:
    rule: >-
      The same-day change fee is the fare brand's same-day confirmed change fee, charged once for each same-day
      confirmed exchange.
    params: [same_day_confirmed_change_fee]
  inputs:
    history:
    - {table: ticket_transactions, aggregate: latest, field: transaction_date, filters: {event_type: ticket_exchange, exchange_type: same_day_confirmed}}
    - {table: ticket_transactions, aggregate: count, field: transaction_id, filters: {event_type: ticket_coupon_flown}}
    - {table: ticket_transactions, aggregate: sum, field: amount, filters: {event_type: ticket_fare_collect}}
    - {table: ticket_transactions, aggregate: sum, field: amount, filters: {event_type: ticket_add_collect}}
    - {table: ticket_transactions, aggregate: sum, field: amount, filters: {event_type: ticket_coupon_flown}}
    - {table: ticket_disruptions, aggregate: max, field: arrival_delay_minutes, filters: {event_type: ticket_disruption_record, disruption_type: delay}}
    - {category: loyalty, table: loyalty_activity, aggregate: count, field: loyalty_activity_id, within_months: 12, filters: {event_type: loyalty_flight_accrual}}
    cross_category: [loyalty, business]
- id: ticket_ext_seat_charge_correction
  base_policy_refs:
  - ticket_evt_fee_refunds
  - ticket_evt_seat_fees
  overwrite:
  - base_policy: ticket_evt_fee_refunds
    superseded_clause: >-
      A fee refund reverses exactly one earlier fee entry on the same ticket, named by refunded_service_id, and
      refunds its full amount to the original payment.
    replaced_by: >-
      The excess is refunded to the original payment as one fee refund entry against that seat charge, with the
      ground charged in error and no disruption record, and a correction worked out at zero is not recorded.
  - base_policy: ticket_evt_seat_fees
    superseded_clause: >-
      A seat fee is charged per passenger per flight segment, chosen by the service_type purchased and the
      segment_miles: segments up to and including segment_length_threshold_miles use the short-segment price and
      longer segments use the long-segment price of standard_seat_fee, preferred_seat_fee or extra_legroom_seat_fee
      for the fare brand.
    replaced_by: >-
      The member seat rate, the advance purchase rate and the channel rate are multiplied together into one combined
      rate that acts once on the seat price, and that product, rounded to the cent, is the seat price the seat
      correction uses.
  trigger: state_due
  subject:
  - ticket_fee_refund
  computes: refund_amount
  target_tool: refund_seat_charge_excess_9145fc3e
  params:
    preferred_member_seat_rate: 0.7
    issue_window_days: 14
    early_days: 35
    early_rate: 0.85
    advance_days: 21
    advance_rate: 0.9
    online_rate: 0.95
    airport_rate: 1.15
  rule: >-
    This rule corrects the advance seat charge standing on a ticket's first unflown segment, that is the latest seat
    charge recorded for that segment, when the amount charged on that seat entry is above the seat price these rules
    give, a charge made in error that is owed back as soon as the
    records show it, whether or not the customer raises it. The excess is refunded to the original payment as one fee
    refund entry against that seat charge, with the ground charged in error and no disruption record, and a
    correction worked out at zero is not recorded.
    The seat price is the fare brand's price for the kind of seat bought, the short-segment price when the segment
    distance recorded on the seat entry is at most the segment length threshold and the long-segment price otherwise.
    The seat correction is the amount charged on the seat entry less the seat price, never below zero, rounded to the
    cent.
    The member seat rate follows the Summit membership the ticket credits: an active membership whose tier includes
    the kind of seat bought gives a member seat rate of zero; an active membership whose tier includes complimentary
    preferred seating but not the kind of seat bought gives the preferred member seat rate; any other passenger has a
    member seat rate of one.
    The advance days of a seat charge are counted by one of three conventions: for a seat paid online or through the
    call center within the issue window of days after the ticket was issued, on a ticket that credits an active
    Summit membership, they run from the ticket's issue date to the segment's scheduled departure date; for a seat
    paid at the airport they are zero whatever the purchase date; for any other seat they run from the seat's
    purchase date to the segment's scheduled departure date.
    The advance purchase rate follows the advance days: at least the early threshold of days gives the early purchase
    rate, at least the advance threshold but fewer than the early threshold gives the advance purchase rate, and fewer
    days give a rate of one.
    The channel rate follows the channel the seat was paid through: a seat paid online gives the online channel rate,
    a seat paid at the airport gives the airport channel rate, and a seat paid through the call center gives a rate
    of one.
    The member seat rate, the advance purchase rate and the channel rate are multiplied together into one combined
    rate that acts once on the seat price, and that product, rounded to the cent, is the seat price the seat
    correction uses.
  prerequisite: []
  cross_category:
  - category: loyalty
    as: branch
    reads:
    - status
    - variant_name
    note: The member seat rate and the issue-date convention for advance days are decided from the Summit membership
      the ticket credits (its active status and the seats its tier includes).
  compute:
  - next_seat_segment: "COUNT('ticket_transactions', event_type='ticket_coupon_flown') + 1"
  - seat_miles: "LATEST('ticket_services', 'segment_miles', date_field='service_date', event_type='ticket_seat_purchase', segment_number=next_seat_segment)"
  - seat_kind: "LATEST('ticket_services', 'service_type', date_field='service_date', event_type='ticket_seat_purchase', segment_number=next_seat_segment)"
  - seat_charged: "LATEST('ticket_services', 'amount', date_field='service_date', event_type='ticket_seat_purchase', segment_number=next_seat_segment)"
  - seat_list_price: "((P('extra_legroom_seat_fee_short_segment') if seat_miles <= P('segment_length_threshold_miles') else P('extra_legroom_seat_fee_long_segment')) if seat_kind == 'extra_legroom_seat' else ((P('preferred_seat_fee_short_segment') if seat_miles <= P('segment_length_threshold_miles') else P('preferred_seat_fee_long_segment')) if seat_kind == 'preferred_seat' else (P('standard_seat_fee_short_segment') if seat_miles <= P('segment_length_threshold_miles') else P('standard_seat_fee_long_segment'))))"
  - seat_member_active: "CFIELD('loyalty', 'status', membership_id=F('membership_id')) == 'active'"
  - seat_member_preferred: "CPARAM('loyalty', 'complimentary_preferred_seating', membership_id=F('membership_id')) == True"
  - seat_member_legroom: "CPARAM('loyalty', 'complimentary_extra_legroom_seating', membership_id=F('membership_id')) == True"
  - seat_kind_included: "(seat_kind == 'extra_legroom_seat' and seat_member_legroom) or (seat_kind == 'preferred_seat' and seat_member_preferred)"
  - member_seat_rate: "0.0 if (seat_kind_included and seat_member_active) else (K('preferred_member_seat_rate') if (seat_member_preferred and seat_member_active and not seat_kind_included) else 1.0)"
  - seat_bought_on: "LATEST('ticket_services', 'service_date', date_field='service_date', event_type='ticket_seat_purchase', segment_number=next_seat_segment)"
  - seat_channel: "LATEST('ticket_services', 'sales_channel', date_field='service_date', event_type='ticket_seat_purchase', segment_number=next_seat_segment)"
  - advance_days_counted: "DAYS(F('issued_at'), F('next_departure_at')) if (seat_channel != 'airport' and seat_member_active and DAYS(F('issued_at'), seat_bought_on) <= K('issue_window_days')) else (0 if seat_channel == 'airport' else DAYS(seat_bought_on, F('next_departure_at')))"
  - advance_purchase_rate: "K('early_rate') if advance_days_counted >= K('early_days') else (K('advance_rate') if advance_days_counted >= K('advance_days') else 1.0)"
  - channel_rate: "K('online_rate') if seat_channel == 'online' else (K('airport_rate') if seat_channel == 'airport' else 1.0)"
  - advance_seat_price: "RND(seat_list_price * member_seat_rate * advance_purchase_rate * channel_rate, 2)"
  - result: "RND(MX(0, seat_charged - advance_seat_price), 2)"
  compute_basis:
    next_seat_segment: "This rule corrects the advance seat charge standing on a ticket's first unflown segment, that is the latest seat charge recorded for that segment"
    seat_miles: "the short-segment price when the segment distance recorded on the seat entry is at most the segment length threshold and the long-segment price otherwise."
    seat_kind: "The seat price is the fare brand's price for the kind of seat bought"
    seat_charged: "The seat correction is the amount charged on the seat entry less the seat price, never below zero, rounded to the cent."
    seat_list_price: "The seat price is the fare brand's price for the kind of seat bought, the short-segment price when the segment distance recorded on the seat entry is at most the segment length threshold and the long-segment price otherwise."
    seat_member_active: "an active membership whose tier includes the kind of seat bought gives a member seat rate of zero"
    seat_member_preferred: "an active membership whose tier includes complimentary preferred seating but not the kind of seat bought gives the preferred member seat rate"
    seat_member_legroom: "an active membership whose tier includes the kind of seat bought gives a member seat rate of zero"
    member_seat_rate: "an active membership whose tier includes the kind of seat bought gives a member seat rate of zero; an active membership whose tier includes complimentary preferred seating but not the kind of seat bought gives the preferred member seat rate; any other passenger has a member seat rate of one."
    seat_bought_on: "for any other seat they run from the seat's purchase date to the segment's scheduled departure date."
    seat_channel: "The channel rate follows the channel the seat was paid through"
    advance_days_counted: "for a seat paid online or through the call center within the issue window of days after the ticket was issued, on a ticket that credits an active Summit membership, they run from the ticket's issue date to the segment's scheduled departure date; for a seat paid at the airport they are zero whatever the purchase date; for any other seat they run from the seat's purchase date to the segment's scheduled departure date."
    advance_purchase_rate: "at least the early threshold of days gives the early purchase rate, at least the advance threshold but fewer than the early threshold gives the advance purchase rate, and fewer days give a rate of one."
    channel_rate: "a seat paid online gives the online channel rate, a seat paid at the airport gives the airport channel rate, and a seat paid through the call center gives a rate of one."
    advance_seat_price: "The member seat rate, the advance purchase rate and the channel rate are multiplied together into one combined rate that acts once on the seat price, and that product, rounded to the cent, is the seat price the seat correction uses."
    result: "The seat correction is the amount charged on the seat entry less the seat price, never below zero, rounded to the cent."
  factors:
  - id: member_seat_rate
    effect: parameter
    decides: member_seat_rate
    bindings: [seat_member_active, seat_member_preferred, seat_member_legroom, seat_kind_included, member_seat_rate]
    ladder:
    - when: "an active Summit membership whose tier includes the kind of seat bought"
      value: "0"
    - when: "an active Summit membership whose tier includes complimentary preferred seating but not the kind of seat bought"
      value: "K('preferred_member_seat_rate')"
    - when: "otherwise"
      value: "1"
    baseline:
      member_seat_rate: "1.0"
    evidence: [cross_category]
    cross_difficulty: loyalty
  - id: seat_advance_purchase_rate
    effect: parameter
    decides: advance_purchase_rate
    bindings: [seat_bought_on, advance_purchase_rate]
    ladder:
    - when: "the advance days reach the early threshold"
      value: "K('early_rate')"
    - when: "the advance days reach the advance threshold but not the early threshold"
      value: "K('advance_rate')"
    - when: "otherwise"
      value: "1"
    baseline:
      advance_purchase_rate: "1.0"
    evidence: [history, date]
    cross_difficulty: null
  - id: seat_channel_rate
    effect: parameter
    decides: channel_rate
    bindings: [seat_channel, channel_rate]
    ladder:
    - when: "the seat was paid online"
      value: "K('online_rate')"
    - when: "the seat was paid at the airport"
      value: "K('airport_rate')"
    - when: "otherwise (paid through the call center)"
      value: "1"
    baseline:
      channel_rate: "1.0"
    evidence: [history]
    cross_difficulty: null
  - id: seat_advance_days_convention
    effect: method
    decides: advance_days_counted
    bindings: [advance_days_counted]
    ladder:
    - when: "a seat paid online or through the call center within the issue window after ticket issue, on a ticket crediting an active Summit membership"
      method: "advance days run from the ticket's issue date to the segment's scheduled departure date"
    - when: "a seat paid at the airport"
      method: "advance days are zero whatever the purchase date"
    - when: "otherwise"
      method: "advance days run from the seat's purchase date to the segment's scheduled departure date"
    baseline:
      advance_days_counted: "DAYS(seat_bought_on, F('next_departure_at'))"
    evidence: [date, history]
    cross_difficulty: null
  baseline:
    rule: >-
      The seat price is the fare brand's price for the kind of seat bought, the short-segment price when the segment
      distance recorded on the seat entry is at most the segment length threshold and the long-segment price
      otherwise. The seat correction is the amount charged on the seat entry less the seat price, never below zero,
      rounded to the cent.
    params: [extra_legroom_seat_fee_short_segment, extra_legroom_seat_fee_long_segment, preferred_seat_fee_short_segment,
      preferred_seat_fee_long_segment, standard_seat_fee_short_segment, standard_seat_fee_long_segment,
      segment_length_threshold_miles]
  inputs:
    history:
    - {table: ticket_transactions, aggregate: count, field: transaction_id, filters: {event_type: ticket_coupon_flown}}
    - {table: ticket_services, aggregate: latest, field: amount, filters: {event_type: ticket_seat_purchase}}
    - {table: ticket_services, aggregate: latest, field: service_date, filters: {event_type: ticket_seat_purchase}}
    - {table: ticket_services, aggregate: latest, field: sales_channel, filters: {event_type: ticket_seat_purchase}}
    cross_category: [loyalty]
- id: ticket_ext_first_upgrade_charge
  base_policy_refs:
  - ticket_evt_paid_upgrade
  - ticket_evt_seat_fees
  overwrite:
  - base_policy: ticket_evt_paid_upgrade
    superseded_clause: >-
      The fee is paid_upgrade_to_premium_economy_fee for a move into Premium Economy, and
      paid_upgrade_to_first_fee_short_segment or paid_upgrade_to_first_fee_long_segment for a move into First on
      segments up to and including segment_length_threshold_miles or longer.
    replaced_by: >-
      The spend rate, the upgrade member rate and the departure-day rate are multiplied together into one combined
      rate that acts once on the First upgrade charge, the seat credit is then taken off that product, and the result,
      never below zero and rounded to the cent only at the end, is the First upgrade charge the buyer pays.
  - base_policy: ticket_evt_paid_upgrade
    superseded_clause: >-
      A paid upgrade moves the passenger on one unflown segment into a higher cabin for a fixed fee.
    replaced_by: >-
      The spend rate, the upgrade member rate and the departure-day rate are multiplied together into one combined
      rate that acts once on the First upgrade charge, the seat credit is then taken off that product, and the result,
      never below zero and rounded to the cent only at the end, is the First upgrade charge the buyer pays.
  trigger: on_request
  subject:
  - ticket_upgrade_purchase
  computes: upgrade_fee
  target_tool: purchase_first_upgrade_fa17fda8
  params:
    preferred_credit_share: 0.5
    top_spend_floor: 400
    top_spend_rate: 0.8
    high_spend_floor: 250
    high_spend_rate: 0.85
    mid_spend_floor: 200
    mid_spend_rate: 0.92
    top_member_flights: 8
    top_member_rate: 0.8
    silver_member_flights: 6
    silver_member_rate: 0.9
    same_day_rate: 0.85
    near_departure_days: 3
    near_departure_rate: 0.95
  rule: >-
    This rule prices a paid upgrade into First bought, on request, for the ticket's first unflown segment; the ticket
    holder, or for a company-held ticket the company's travel manager, confirms and pays it in person.
    The First upgrade charge is the fare brand's First upgrade price for that segment, the short-segment price when
    the segment distance recorded on the segment's seat entry is at most the segment length threshold and the
    long-segment price otherwise.
    The First upgrade charge is not fixed until the latest same-day confirmed exchange recorded on the ticket carries
    its same-day change fee entry, whenever that exchange owes a same-day change fee.
    The First upgrade charge on a segment is fixed only after the latest seat charge on that segment carries a refund
    entry for any part of it charged in error above the seat price.
    The seat credit follows the seat standing on the upgraded segment, that is the latest seat charge recorded for
    the segment less every refund entry against that charge: an extra-legroom seat credits its whole standing
    amount, a preferred seat credits the preferred credit share of its standing amount, and a standard seat or no
    paid seat credits nothing.
    The trip spend of the ticket is its fare part plus every seat charge and every same-day change fee charged on the
    ticket, less every refund entry against a seat charge.
    The fare part of the trip spend is measured by one of three conventions: on a ticket with at least one flown
    coupon it is the fare still unflown, the fare collected less the coupon value already flown; on a round-trip
    ticket with no flown coupon it is half the fare collected; on any other ticket it is the whole fare collected,
    the fare collected being every fare-collection and add-collect entry.
    The spend rate follows the trip spend: at least the top spend floor gives the top spend rate, at least the high
    spend floor but below the top spend floor gives the high spend rate, at least the middle spend floor but below the
    high spend floor gives the middle spend rate, and less gives a rate of one.
    The upgrade member rate follows the membership the ticket credits and the member's Summit flight accruals dated
    within the last 12 months: an active membership of upgrade priority rank four or better with at least the top
    member flight count gives the top upgrade member rate; an active membership of upgrade priority rank five with at
    least the Silver member flight count gives the Silver upgrade member rate; any other passenger has an upgrade
    member rate of one.
    The departure-day rate follows the whole days from today to the segment's scheduled departure date: on the
    departure date itself it is the same-day upgrade rate, one day up to the near-departure days before it is the
    near-departure rate, and more days give a rate of one.
    The spend rate, the upgrade member rate and the departure-day rate are multiplied together into one combined
    rate that acts once on the First upgrade charge, the seat credit is then taken off that product, and the result,
    never below zero and rounded to the cent only at the end, is the First upgrade charge the buyer pays.
  prerequisite:
  - problem: ticket_ext_same_day_change_fee
    kind: value_input
    gate: up_same_day_fees
    form: state
    policy_source: >-
      The First upgrade charge is not fixed until the latest same-day confirmed exchange recorded on the ticket
      carries its same-day change fee entry, whenever that exchange owes a same-day change fee.
    condition: >-
      When the latest ticket_transactions entry of event_type ticket_exchange with exchange_type same_day_confirmed
      owes a same-day change fee above zero under the same-day change fee rule, a ticket_change_fee entry of
      service_type same_day_change_fee names it through related_transaction_id.
    resolved_by: post_same_day_change_fee_61b8e8ae
    effect: >-
      The same-day change fee entry adds its amount to the same-day change fees in the trip spend, which can move the
      spend rate to another band.
  - problem: ticket_ext_seat_charge_correction
    kind: value_input
    gate: up_seat_standing
    form: state
    policy_source: >-
      The First upgrade charge on a segment is fixed only after the latest seat charge on that segment carries a
      refund entry for any part of it charged in error above the seat price.
    condition: >-
      When the latest seat_purchase entry of the first unflown segment is charged above the seat price of the seat
      charge correction rule, a ticket_fee_refund entry with fee_refund_reason charged_in_error names it through
      refunded_service_id.
    resolved_by: refund_seat_charge_excess_9145fc3e
    effect: >-
      The refund entry lowers the seat standing on the upgraded segment, and with it the seat credit taken off the
      charge, and lowers the trip spend by the amount refunded.
  cross_category:
  - category: loyalty
    as: branch
    reads:
    - status
    - variant_name
    - loyalty_activity.event_type
    - loyalty_activity.activity_date
    note: The upgrade member rate is decided from the membership's tier rank and active status and from the count of
      the holder's Summit flight accruals in the last 12 months.
  compute:
  - up_flown: "COUNT('ticket_transactions', event_type='ticket_coupon_flown')"
  - up_segment: "up_flown + 1"
  - up_miles: "LATEST('ticket_services', 'segment_miles', date_field='service_date', event_type='ticket_seat_purchase', segment_number=up_segment)"
  - up_list_price: "P('paid_upgrade_to_first_fee_short_segment') if up_miles <= P('segment_length_threshold_miles') else P('paid_upgrade_to_first_fee_long_segment')"
  - up_seat_id: "LATEST('ticket_services', 'service_id', date_field='service_date', event_type='ticket_seat_purchase', segment_number=up_segment)"
  - up_seat_kind: "LATEST('ticket_services', 'service_type', date_field='service_date', event_type='ticket_seat_purchase', segment_number=up_segment)"
  - up_seat_paid: "LATEST('ticket_services', 'amount', date_field='service_date', event_type='ticket_seat_purchase', segment_number=up_segment) or 0"
  - up_seat_standing: "up_seat_paid - SUM('ticket_services', 'amount', date_field='service_date', event_type='ticket_fee_refund', refunded_service_id=up_seat_id)"
  - seat_credit: "up_seat_standing if up_seat_kind == 'extra_legroom_seat' else (RND(up_seat_standing * K('preferred_credit_share'), 2) if up_seat_kind == 'preferred_seat' else 0)"
  - up_fare_collected: "SUM('ticket_transactions', 'amount', date_field='transaction_date', event_type='ticket_fare_collect') + SUM('ticket_transactions', 'amount', date_field='transaction_date', event_type='ticket_add_collect')"
  - up_fare_flown: "SUM('ticket_transactions', 'amount', date_field='transaction_date', event_type='ticket_coupon_flown')"
  - up_fare_part: "(up_fare_collected - up_fare_flown) if up_flown > 0 else ((up_fare_collected / 2) if F('trip_type') == 'round_trip' else up_fare_collected)"
  - up_seat_fees: "SUM('ticket_services', 'amount', date_field='service_date', event_type='ticket_seat_purchase')"
  - up_same_day_fees: "SUM('ticket_services', 'amount', date_field='service_date', event_type='ticket_change_fee', service_type='same_day_change_fee')"
  - up_seat_refunds: "SUM('ticket_services', 'amount', date_field='service_date', event_type='ticket_fee_refund', service_type='extra_legroom_seat') + SUM('ticket_services', 'amount', date_field='service_date', event_type='ticket_fee_refund', service_type='preferred_seat') + SUM('ticket_services', 'amount', date_field='service_date', event_type='ticket_fee_refund', service_type='standard_seat')"
  - trip_spend: "up_fare_part + up_seat_fees + up_same_day_fees - up_seat_refunds"
  - spend_rate: "K('top_spend_rate') if trip_spend >= K('top_spend_floor') else (K('high_spend_rate') if trip_spend >= K('high_spend_floor') else (K('mid_spend_rate') if trip_spend >= K('mid_spend_floor') else 1.0))"
  - up_member_active: "CFIELD('loyalty', 'status', membership_id=F('membership_id')) == 'active'"
  - up_member_rank: "CPARAM('loyalty', 'upgrade_priority_rank', membership_id=F('membership_id')) or 99"
  - up_member_flights: "XCOUNT('loyalty', 'loyalty_activity', within_months=12, date_field='activity_date', event_type='loyalty_flight_accrual')"
  - up_member_rate: "K('top_member_rate') if (up_member_active and up_member_rank <= 4 and up_member_flights >= K('top_member_flights')) else (K('silver_member_rate') if (up_member_active and up_member_rank == 5 and up_member_flights >= K('silver_member_flights')) else 1.0)"
  - days_to_departure: "DAYS(NOW, F('next_departure_at'))"
  - departure_day_rate: "K('same_day_rate') if days_to_departure == 0 else (K('near_departure_rate') if days_to_departure <= K('near_departure_days') else 1.0)"
  - result: "RND(MX(0, up_list_price * spend_rate * up_member_rate * departure_day_rate - seat_credit), 2)"
  compute_basis:
    up_flown: "This rule prices a paid upgrade into First bought, on request, for the ticket's first unflown segment"
    up_miles: "the short-segment price when the segment distance recorded on the segment's seat entry is at most the segment length threshold and the long-segment price otherwise."
    up_list_price: "The First upgrade charge is the fare brand's First upgrade price for that segment, the short-segment price when the segment distance recorded on the segment's seat entry is at most the segment length threshold and the long-segment price otherwise."
    up_seat_id: "that is the latest seat charge recorded for the segment less every refund entry against that charge"
    up_seat_kind: "an extra-legroom seat credits its whole standing amount, a preferred seat credits the preferred credit share of its standing amount, and a standard seat or no paid seat credits nothing."
    up_seat_paid: "that is the latest seat charge recorded for the segment less every refund entry against that charge"
    up_seat_standing: "that is the latest seat charge recorded for the segment less every refund entry against that charge"
    seat_credit: "an extra-legroom seat credits its whole standing amount, a preferred seat credits the preferred credit share of its standing amount, and a standard seat or no paid seat credits nothing."
    up_fare_collected: "the fare collected being every fare-collection and add-collect entry."
    up_fare_flown: "the fare collected less the coupon value already flown"
    up_fare_part: "on a ticket with at least one flown coupon it is the fare still unflown, the fare collected less the coupon value already flown; on a round-trip ticket with no flown coupon it is half the fare collected; on any other ticket it is the whole fare collected"
    up_seat_fees: "plus every seat charge and every same-day change fee charged on the ticket"
    up_same_day_fees: "plus every seat charge and every same-day change fee charged on the ticket"
    up_seat_refunds: "less every refund entry against a seat charge."
    spend_rate: "at least the top spend floor gives the top spend rate, at least the high spend floor but below the top spend floor gives the high spend rate, at least the middle spend floor but below the high spend floor gives the middle spend rate, and less gives a rate of one."
    up_member_active: "an active membership of upgrade priority rank four or better with at least the top member flight count gives the top upgrade member rate"
    up_member_rank: "an active membership of upgrade priority rank five with at least the Silver member flight count gives the Silver upgrade member rate"
    up_member_flights: "The upgrade member rate follows the membership the ticket credits and the member's Summit flight accruals dated within the last 12 months"
    up_member_rate: "an active membership of upgrade priority rank four or better with at least the top member flight count gives the top upgrade member rate; an active membership of upgrade priority rank five with at least the Silver member flight count gives the Silver upgrade member rate; any other passenger has an upgrade member rate of one."
    days_to_departure: "The departure-day rate follows the whole days from today to the segment's scheduled departure date"
    departure_day_rate: "on the departure date itself it is the same-day upgrade rate, one day up to the near-departure days before it is the near-departure rate, and more days give a rate of one."
    result: "The spend rate, the upgrade member rate and the departure-day rate are multiplied together into one combined rate that acts once on the First upgrade charge, the seat credit is then taken off that product, and the result, never below zero and rounded to the cent only at the end, is the First upgrade charge the buyer pays."
  factors:
  - id: upgrade_seat_credit
    effect: parameter
    decides: seat_credit
    bindings: [up_seat_id, up_seat_kind, up_seat_paid, up_seat_standing, seat_credit]
    ladder:
    - when: "an extra-legroom seat stands paid on the upgraded segment"
      value: "the whole standing amount of that seat"
    - when: "a preferred seat stands paid on the upgraded segment"
      value: "K('preferred_credit_share') of its standing amount"
    - when: "otherwise (a standard seat or no paid seat)"
      value: "0"
    baseline:
      seat_credit: "0"
    evidence: [history]
    cross_difficulty: null
  - id: upgrade_spend_rate
    effect: parameter
    decides: spend_rate
    bindings: [up_seat_fees, up_same_day_fees, up_seat_refunds, trip_spend, spend_rate]
    ladder:
    - when: "the trip spend reaches the top spend floor"
      value: "K('top_spend_rate')"
    - when: "the trip spend reaches the high spend floor but not the top spend floor"
      value: "K('high_spend_rate')"
    - when: "the trip spend reaches the middle spend floor but not the high spend floor"
      value: "K('mid_spend_rate')"
    - when: "otherwise"
      value: "1"
    baseline:
      spend_rate: "1.0"
    evidence: [history]
    cross_difficulty: null
  - id: upgrade_fare_part_convention
    effect: method
    decides: up_fare_part
    bindings: [up_fare_collected, up_fare_flown, up_fare_part]
    ladder:
    - when: "a ticket with at least one flown coupon"
      method: "the fare part of the trip spend is the fare still unflown: the fare collected less the coupon value already flown"
    - when: "a round-trip ticket with no flown coupon"
      method: "the fare part of the trip spend is half the fare collected"
    - when: "otherwise"
      method: "the fare part of the trip spend is the whole fare collected"
    baseline:
      up_fare_part: "up_fare_collected"
    evidence: [history]
    cross_difficulty: null
  - id: upgrade_member_rate
    effect: parameter
    decides: up_member_rate
    bindings: [up_member_active, up_member_rank, up_member_flights, up_member_rate]
    ladder:
    - when: "an active membership of upgrade priority rank four or better and at least the top member flight count of flight accruals in the last 12 months"
      value: "K('top_member_rate')"
    - when: "an active membership of upgrade priority rank five and at least the Silver member flight count of flight accruals in the last 12 months"
      value: "K('silver_member_rate')"
    - when: "otherwise"
      value: "1"
    baseline:
      up_member_rate: "1.0"
    evidence: [cross_category, history]
    cross_difficulty: loyalty
  - id: upgrade_departure_day_rate
    effect: parameter
    decides: departure_day_rate
    bindings: [days_to_departure, departure_day_rate]
    ladder:
    - when: "today is the segment's scheduled departure date"
      value: "K('same_day_rate')"
    - when: "the departure is one day up to the near-departure days away"
      value: "K('near_departure_rate')"
    - when: "otherwise"
      value: "1"
    baseline:
      departure_day_rate: "1.0"
    evidence: [date]
    cross_difficulty: null
  baseline:
    rule: >-
      The First upgrade charge is the fare brand's First upgrade price for that segment, the short-segment price when
      the segment distance recorded on the segment's seat entry is at most the segment length threshold and the
      long-segment price otherwise.
    params: [paid_upgrade_to_first_fee_short_segment, paid_upgrade_to_first_fee_long_segment, segment_length_threshold_miles]
  inputs:
    history:
    - {table: ticket_transactions, aggregate: count, field: transaction_id, filters: {event_type: ticket_coupon_flown}}
    - {table: ticket_transactions, aggregate: sum, field: amount, filters: {event_type: ticket_fare_collect}}
    - {table: ticket_transactions, aggregate: sum, field: amount, filters: {event_type: ticket_coupon_flown}}
    - {table: ticket_services, aggregate: sum, field: amount, filters: {event_type: ticket_seat_purchase}}
    - {table: ticket_services, aggregate: sum, field: amount, filters: {event_type: ticket_change_fee, service_type: same_day_change_fee}}
    - {table: ticket_services, aggregate: sum, field: amount, filters: {event_type: ticket_fee_refund}}
    - {category: loyalty, table: loyalty_activity, aggregate: count, field: loyalty_activity_id, within_months: 12, filters: {event_type: loyalty_flight_accrual}}
    cross_category: [loyalty]
- id: ticket_ext_change_fee_posting
  base_policy_refs:
  - ticket_voluntary_change
  - ticket_same_day_change
  - ticket_corporate_agreement_benefits
  overwrite:
  - base_policy: ticket_voluntary_change
    superseded_clause: >-
      The change fee is change_fee_us_origin when origin_region is united_states; when the journey originates outside
      the United States it is change_fee_non_us_origin_short_haul for domestic and short-haul international itineraries
      and change_fee_non_us_origin_long_haul for long-haul international itineraries.
    replaced_by: >-
      The agreement relief rate, the notice rate, the fare band rate and the brand rate are multiplied together into
      one combined rate that acts once on the change fee, and that product, rounded to the cent only at the end, is
      the change fee posted.
  trigger: state_due
  subject:
  - ticket_change_fee
  computes: fee_amount
  target_tool: post_change_fee_ac050962
  params:
    spend_relief_rate: 0.6
    long_notice_days: 14
    long_notice_rate: 0.8
    short_notice_days: 7
    short_notice_rate: 0.9
    high_fare_floor: 600
    high_fare_rate: 0.92
    mid_fare_floor: 400
    mid_fare_rate: 0.96
    eligible_brand_rate: 0.9
    other_brand_rate: 0.97
  rule: >-
    This rule sets the change fee owed for the latest voluntary, standard exchange recorded on a ticket. The fee is
    owed while no change fee entry is linked to that exchange, whether or not the customer raises it, and it is
    posted through the call center as one itinerary-level change fee entry linked to that exchange entry; a fee
    worked out at zero is not recorded, and an exchange whose fee works out at zero owes no change fee.
    The change fee is the fare brand's United States-origin change fee when the ticket's journey originates in the
    United States; when the journey originates outside the United States it is the fare brand's short-haul change
    fee for domestic and short-haul international itineraries and its long-haul change fee for long-haul
    international itineraries.
    The agreement relief rate follows the corporate travel agreement the ticket names: an active agreement whose tier
    waives change fees gives a rate of zero; an active agreement whose tier does not waive change fees and whose
    spend this agreement year is at least its tier's annual spend threshold gives the spend relief rate; any other
    ticket has an agreement relief rate of one.
    The notice rate follows the whole days from the date of that exchange to the first departure of the new
    itinerary: at least the long notice days give the long notice rate, at least the short notice days but fewer than
    the long notice days give the short notice rate, and fewer days give a rate of one.
    The fare that bands the change fee is measured by one of three conventions: on a ticket naming an active
    corporate agreement it is the fare collected less the ticket's taxes and fees, the negotiated fare before taxes;
    on any other ticket
    with at least one flown coupon it is the fare still unflown, the fare collected less the coupon value already
    flown; on any other ticket it is the fare collected, every fare-collection and add-collect entry.
    The fare band rate follows the fare that bands the change fee: at least the high fare floor gives the high fare
    band rate, at least the middle fare floor but below the high fare floor gives the middle fare band rate, and less
    gives a rate of one.
    The brand rate follows the agreement's discount-eligible fare brands: a ticket naming an active agreement whose
    fare brand is one the agreement discounts gives the eligible brand rate; a ticket naming an active agreement whose
    fare brand the agreement does not discount gives the other brand rate; any other ticket has a brand rate of one.
    The agreement relief rate, the notice rate, the fare band rate and the brand rate are multiplied together into
    one combined rate that acts once on the change fee, and that product, rounded to the cent only at the end, is
    the change fee posted.
  prerequisite: []
  cross_category:
  - category: business
    as: branch
    reads:
    - status
    - variant_name
    - spend_this_agreement_year
    note: The agreement relief rate, the fare convention and the brand rate are decided from the agreement the ticket
      names (status, tier waiver, spend against the tier threshold, discount-eligible brands).
  compute:
  - chg_exchange_date: "LATEST('ticket_transactions', 'transaction_date', date_field='transaction_date', event_type='ticket_exchange', exchange_type='standard_change')"
  - chg_new_departure: "LATEST('ticket_transactions', 'new_departure_at', date_field='transaction_date', event_type='ticket_exchange', exchange_type='standard_change')"
  - chg_base_fee: "P('change_fee_us_origin') if F('origin_region') == 'united_states' else (P('change_fee_non_us_origin_short_haul') if F('route_type') != 'long_haul_international' else P('change_fee_non_us_origin_long_haul'))"
  - chg_active: "CFIELD('business', 'status', business_account_id=F('corporate_account_id')) == 'active'"
  - chg_waiver: "CPARAM('business', 'change_fee_waiver', business_account_id=F('corporate_account_id')) == True"
  - chg_spend: "CFIELD('business', 'spend_this_agreement_year', business_account_id=F('corporate_account_id')) or 0"
  - chg_threshold: "CPARAM('business', 'annual_spend_threshold_usd', business_account_id=F('corporate_account_id')) or 0"
  - chg_agreement_rate: "0.0 if (chg_waiver and chg_active) else (K('spend_relief_rate') if (chg_active and not chg_waiver and chg_spend >= chg_threshold) else 1.0)"
  - chg_notice_days: "DAYS(chg_exchange_date, chg_new_departure)"
  - chg_notice_rate: "K('long_notice_rate') if chg_notice_days >= K('long_notice_days') else (K('short_notice_rate') if chg_notice_days >= K('short_notice_days') else 1.0)"
  - chg_flown: "COUNT('ticket_transactions', event_type='ticket_coupon_flown')"
  - chg_fare_collected: "SUM('ticket_transactions', 'amount', date_field='transaction_date', event_type='ticket_fare_collect') + SUM('ticket_transactions', 'amount', date_field='transaction_date', event_type='ticket_add_collect')"
  - chg_fare_flown: "SUM('ticket_transactions', 'amount', date_field='transaction_date', event_type='ticket_coupon_flown')"
  - chg_banding_fare: "(chg_fare_collected - F('taxes_and_fees')) if chg_active else ((chg_fare_collected - chg_fare_flown) if chg_flown > 0 else chg_fare_collected)"
  - chg_fare_rate: "K('high_fare_rate') if chg_banding_fare >= K('high_fare_floor') else (K('mid_fare_rate') if chg_banding_fare >= K('mid_fare_floor') else 1.0)"
  - chg_brand_eligible: "F('variant_name') in (CPARAM('business', 'discount_eligible_fare_brands', business_account_id=F('corporate_account_id')) or '')"
  - chg_brand_rate: "K('eligible_brand_rate') if (chg_active and chg_brand_eligible) else (K('other_brand_rate') if (chg_active and not chg_brand_eligible) else 1.0)"
  - result: "RND(chg_base_fee * chg_agreement_rate * chg_notice_rate * chg_fare_rate * chg_brand_rate, 2)"
  compute_basis:
    chg_exchange_date: "This rule sets the change fee owed for the latest voluntary, standard exchange recorded on a ticket."
    chg_new_departure: "the whole days from the date of that exchange to the first departure of the new itinerary"
    chg_base_fee: "The change fee is the fare brand's United States-origin change fee when the ticket's journey originates in the United States; when the journey originates outside the United States it is the fare brand's short-haul change fee for domestic and short-haul international itineraries and its long-haul change fee for long-haul international itineraries."
    chg_active: "an active agreement whose tier waives change fees gives a rate of zero"
    chg_waiver: "an active agreement whose tier waives change fees gives a rate of zero"
    chg_spend: "whose spend this agreement year is at least its tier's annual spend threshold"
    chg_threshold: "whose spend this agreement year is at least its tier's annual spend threshold"
    chg_agreement_rate: "an active agreement whose tier waives change fees gives a rate of zero; an active agreement whose tier does not waive change fees and whose spend this agreement year is at least its tier's annual spend threshold gives the spend relief rate; any other ticket has an agreement relief rate of one."
    chg_notice_days: "The notice rate follows the whole days from the date of that exchange to the first departure of the new itinerary"
    chg_notice_rate: "at least the long notice days give the long notice rate, at least the short notice days but fewer than the long notice days give the short notice rate, and fewer days give a rate of one."
    chg_flown: "on any other ticket with at least one flown coupon it is the fare still unflown"
    chg_fare_collected: "on any other ticket it is the fare collected, every fare-collection and add-collect entry."
    chg_fare_flown: "the fare collected less the coupon value already flown"
    chg_banding_fare: "on a ticket naming an active corporate agreement it is the fare collected less the ticket's taxes and fees, the negotiated fare before taxes; on any other ticket with at least one flown coupon it is the fare still unflown, the fare collected less the coupon value already flown; on any other ticket it is the fare collected, every fare-collection and add-collect entry."
    chg_fare_rate: "at least the high fare floor gives the high fare band rate, at least the middle fare floor but below the high fare floor gives the middle fare band rate, and less gives a rate of one."
    chg_brand_eligible: "The brand rate follows the agreement's discount-eligible fare brands"
    chg_brand_rate: "a ticket naming an active agreement whose fare brand is one the agreement discounts gives the eligible brand rate; a ticket naming an active agreement whose fare brand the agreement does not discount gives the other brand rate; any other ticket has a brand rate of one."
    result: "The agreement relief rate, the notice rate, the fare band rate and the brand rate are multiplied together into one combined rate that acts once on the change fee, and that product, rounded to the cent only at the end, is the change fee posted."
  factors:
  - id: change_agreement_relief
    effect: parameter
    decides: chg_agreement_rate
    bindings: [chg_active, chg_waiver, chg_spend, chg_threshold, chg_agreement_rate]
    ladder:
    - when: "an active agreement whose tier waives change fees"
      value: "0"
    - when: "an active agreement whose tier does not waive change fees and whose spend this agreement year reaches its tier's annual spend threshold"
      value: "K('spend_relief_rate')"
    - when: "otherwise"
      value: "1"
    baseline:
      chg_agreement_rate: "1.0"
    evidence: [cross_category]
    cross_difficulty: business
  - id: change_notice_rate
    effect: parameter
    decides: chg_notice_rate
    bindings: [chg_exchange_date, chg_new_departure, chg_notice_days, chg_notice_rate]
    ladder:
    - when: "at least the long notice days from the exchange to the new itinerary's first departure"
      value: "K('long_notice_rate')"
    - when: "at least the short notice days but fewer than the long notice days"
      value: "K('short_notice_rate')"
    - when: "otherwise"
      value: "1"
    baseline:
      chg_notice_rate: "1.0"
    evidence: [history, date]
    cross_difficulty: null
  - id: change_banding_fare_convention
    effect: method
    decides: chg_banding_fare
    bindings: [chg_flown, chg_fare_flown, chg_banding_fare]
    ladder:
    - when: "a ticket naming an active corporate agreement"
      method: "the fare that bands the change fee is the fare collected less the ticket's taxes and fees"
    - when: "any other ticket with at least one flown coupon"
      method: "the fare that bands the change fee is the fare still unflown: the fare collected less the coupon value flown"
    - when: "otherwise"
      method: "the fare that bands the change fee is the fare collected"
    baseline:
      chg_banding_fare: "chg_fare_collected"
    evidence: [history, cross_category]
    cross_difficulty: null
  - id: change_fare_band
    effect: parameter
    decides: chg_fare_rate
    bindings: [chg_fare_collected, chg_fare_rate]
    ladder:
    - when: "the fare that bands the change fee reaches the high fare floor"
      value: "K('high_fare_rate')"
    - when: "it reaches the middle fare floor but not the high fare floor"
      value: "K('mid_fare_rate')"
    - when: "otherwise"
      value: "1"
    baseline:
      chg_fare_rate: "1.0"
    evidence: [history]
    cross_difficulty: null
  - id: change_brand_rate
    effect: parameter
    decides: chg_brand_rate
    bindings: [chg_brand_eligible, chg_brand_rate]
    ladder:
    - when: "a ticket naming an active agreement whose fare brand the agreement discounts"
      value: "K('eligible_brand_rate')"
    - when: "a ticket naming an active agreement whose fare brand the agreement does not discount"
      value: "K('other_brand_rate')"
    - when: "otherwise"
      value: "1"
    baseline:
      chg_brand_rate: "1.0"
    evidence: [cross_category]
    cross_difficulty: business
  baseline:
    rule: >-
      The change fee is the fare brand's United States-origin change fee when the ticket's journey originates in the
      United States; when the journey originates outside the United States it is the fare brand's short-haul change
      fee for domestic and short-haul international itineraries and its long-haul change fee for long-haul
      international itineraries.
    params: [change_fee_us_origin, change_fee_non_us_origin_short_haul, change_fee_non_us_origin_long_haul]
  inputs:
    history:
    - {table: ticket_transactions, aggregate: latest, field: transaction_date, filters: {event_type: ticket_exchange, exchange_type: standard_change}}
    - {table: ticket_transactions, aggregate: latest, field: new_departure_at, filters: {event_type: ticket_exchange, exchange_type: standard_change}}
    - {table: ticket_transactions, aggregate: count, field: transaction_id, filters: {event_type: ticket_coupon_flown}}
    - {table: ticket_transactions, aggregate: sum, field: amount, filters: {event_type: ticket_fare_collect}}
    - {table: ticket_transactions, aggregate: sum, field: amount, filters: {event_type: ticket_coupon_flown}}
    cross_category: [business]
- id: ticket_ext_bag_sequence_charge
  base_policy_refs:
  - ticket_evt_bag_fees
  - ticket_corporate_agreement_benefits
  overwrite:
  - base_policy: ticket_evt_bag_fees
    superseded_clause: >-
      on international itineraries the first and second bag fees for the route_type apply in every channel
    replaced_by: >-
      The posting rate, the fare band rate and the check-in channel rate are multiplied together into one combined
      rate that acts once on the bag's list charge, and that product, rounded to the cent only at the end, is the bag
      charge posted.
  - base_policy: ticket_evt_bag_fees
    superseded_clause: >-
      the third and each further bag costs third_bag_fee_domestic_and_short_haul or third_bag_fee_long_haul
    replaced_by: >-
      The posting rate, the fare band rate and the check-in channel rate are multiplied together into one combined
      rate that acts once on the bag's list charge, and that product, rounded to the cent only at the end, is the bag
      charge posted.
  trigger: state_due
  subject:
  - ticket_bag_charge
  computes: charge_amount
  target_tool: post_bag_sequence_charge_b2992c63
  params:
    busy_postings: 6
    busy_posting_rate: 0.8
    steady_postings: 3
    steady_posting_rate: 0.9
    high_fare_floor: 500
    high_fare_rate: 0.9
    mid_fare_floor: 300
    mid_fare_rate: 0.95
    airport_rate: 1.1
    online_rate: 0.9
  rule: >-
    This rule sets the checked-bag charge owed for each bag of a ticket's first unflown segment that carries a weight
    or size entry but no first, second or third bag charge. The charge is owed as soon as the records show the bag
    checked, whether or not the customer raises it, and it is posted through the call center as one bag charge for
    that bag tag carrying its place in the count; a charge worked out at zero is still recorded as a bag inside the
    free allowance.
    The bag's direction is the return on a partially flown round trip and the outbound otherwise.
    The free allowance is the most generous of the fare brand's checked-bag allowance for the ticket's itinerary
    class, the elite checked-bag allowance of an active Summit membership the ticket credits, and, on a ticket naming
    an active corporate agreement, the agreement tier's corporate checked-bag allowance; the allowances never add
    together.
    The bag's place in the count is the number of first, second and third bag charges already recorded in the bag's
    direction plus one.
    The bag's list charge is zero when its place in the count is within the free allowance; beyond it, a first bag on
    a domestic itinerary costs the fare brand's online first-bag fee when the segment's check-in channel is online
    and its airport first-bag fee otherwise, a second domestic bag costs the second-bag fee, a first or second bag on
    an international itinerary costs the first-bag or second-bag fee of its itinerary class, and a third or later bag
    costs the third-bag fee of domestic and short-haul itineraries or of long-haul itineraries.
    The bag charge posted is the bag's list charge rounded to the cent.
    The segment's check-in channel is the airport when any bag charge of that segment was paid at the airport, online
    when a bag charge of that segment was paid online and none at the airport, and the call center otherwise.
    The posting rate follows the agreement the ticket names and its flown-spend postings dated within the last 6
    months: an active agreement with at least the busy posting count gives the busy posting rate; an active agreement
    with at least the steady posting count but fewer than the busy posting count gives the steady posting rate; any
    other ticket has a posting rate of one.
    The fare that bands the bag charge is measured by one of three conventions: on a ticket with at least one flown
    coupon it is the fare still unflown, the fare collected less the coupon value already flown; on a ticket with no
    flown coupon that names an active corporate agreement it is the ticket's base fare, before taxes and fees; on any
    other ticket it is the fare collected, every fare-collection and add-collect entry.
    The fare band rate follows the fare that bands the bag charge: at least the high fare floor gives the high fare
    band rate, at least the middle fare floor but below the high fare floor gives the middle fare band rate, and less
    gives a rate of one.
    The check-in channel rate follows the segment's check-in channel: the airport gives the airport check-in rate,
    online gives the online check-in rate, and the call center gives a rate of one.
    The posting rate, the fare band rate and the check-in channel rate are multiplied together into one combined
    rate that acts once on the bag's list charge, and that product, rounded to the cent only at the end, is the bag
    charge posted.
  prerequisite: []
  cross_category:
  - category: business
    as: branch
    reads:
    - status
    - variant_name
    - business_activity.event_type
    - business_activity.activity_date
    note: The posting rate, the corporate allowance and the base-fare convention are decided from the agreement the
      ticket names and from the count of its flown-spend postings in the last 6 months.
  - category: loyalty
    as: branch
    reads:
    - status
    - variant_name
    note: The elite checked-bag allowance of an active Summit membership the ticket credits competes in the free
      allowance.
  compute:
  - seq_flown: "COUNT('ticket_transactions', event_type='ticket_coupon_flown')"
  - seq_segment: "seq_flown + 1"
  - seq_direction: "'return' if (seq_flown > 0 and F('trip_type') == 'round_trip') else 'outbound'"
  - seq_channel: "'airport' if COUNT('ticket_services', event_type='ticket_bag_charge', segment_number=seq_segment, sales_channel='airport') > 0 else ('online' if COUNT('ticket_services', event_type='ticket_bag_charge', segment_number=seq_segment, sales_channel='online') > 0 else 'call_center')"
  - seq_active: "CFIELD('business', 'status', business_account_id=F('corporate_account_id')) == 'active'"
  - seq_corporate_bags: "(CPARAM('business', 'corporate_free_checked_bags', business_account_id=F('corporate_account_id')) or 0) if seq_active else 0"
  - seq_elite_bags: "(CPARAM('loyalty', 'elite_free_checked_bags', membership_id=F('membership_id')) or 0) if (CFIELD('loyalty', 'status', membership_id=F('membership_id')) == 'active') else 0"
  - seq_allowance: "MX(P('free_checked_bags_domestic') if F('route_type') == 'domestic' else (P('free_checked_bags_short_haul_international') if F('route_type') == 'short_haul_international' else P('free_checked_bags_long_haul_international')), seq_corporate_bags, seq_elite_bags)"
  - seq_position: "COUNT('ticket_services', event_type='ticket_bag_charge', service_type='first_bag', travel_direction=seq_direction) + COUNT('ticket_services', event_type='ticket_bag_charge', service_type='second_bag', travel_direction=seq_direction) + COUNT('ticket_services', event_type='ticket_bag_charge', service_type='third_bag', travel_direction=seq_direction) + 1"
  - seq_list_charge: "0 if seq_position <= seq_allowance else (((P('first_bag_fee_domestic_online') if seq_channel == 'online' else P('first_bag_fee_domestic_airport')) if seq_position == 1 else (P('second_bag_fee_domestic') if seq_position == 2 else P('third_bag_fee_domestic_and_short_haul'))) if F('route_type') == 'domestic' else ((P('first_bag_fee_short_haul_international') if seq_position == 1 else (P('second_bag_fee_short_haul_international') if seq_position == 2 else P('third_bag_fee_domestic_and_short_haul'))) if F('route_type') == 'short_haul_international' else (P('first_bag_fee_long_haul_international') if seq_position == 1 else (P('second_bag_fee_long_haul_international') if seq_position == 2 else P('third_bag_fee_long_haul')))))"
  - seq_postings: "XCOUNT('business', 'business_activity', within_months=6, date_field='activity_date', event_type='business_spend_post')"
  - seq_posting_rate: "K('busy_posting_rate') if (seq_active and seq_postings >= K('busy_postings')) else (K('steady_posting_rate') if (seq_active and seq_postings >= K('steady_postings') and seq_postings < K('busy_postings')) else 1.0)"
  - seq_fare_collected: "SUM('ticket_transactions', 'amount', date_field='transaction_date', event_type='ticket_fare_collect') + SUM('ticket_transactions', 'amount', date_field='transaction_date', event_type='ticket_add_collect')"
  - seq_fare_flown: "SUM('ticket_transactions', 'amount', date_field='transaction_date', event_type='ticket_coupon_flown')"
  - seq_banding_fare: "(seq_fare_collected - seq_fare_flown) if seq_flown > 0 else (F('base_fare') if seq_active else seq_fare_collected)"
  - seq_fare_rate: "K('high_fare_rate') if seq_banding_fare >= K('high_fare_floor') else (K('mid_fare_rate') if seq_banding_fare >= K('mid_fare_floor') else 1.0)"
  - seq_channel_rate: "K('airport_rate') if seq_channel == 'airport' else (K('online_rate') if seq_channel == 'online' else 1.0)"
  - result: "RND(seq_list_charge * seq_posting_rate * seq_fare_rate * seq_channel_rate, 2)"
  compute_basis:
    seq_flown: "The bag's direction is the return on a partially flown round trip and the outbound otherwise."
    seq_channel: "The segment's check-in channel is the airport when any bag charge of that segment was paid at the airport, online when a bag charge of that segment was paid online and none at the airport, and the call center otherwise."
    seq_active: "on a ticket naming an active corporate agreement, the agreement tier's corporate checked-bag allowance"
    seq_corporate_bags: "on a ticket naming an active corporate agreement, the agreement tier's corporate checked-bag allowance; the allowances never add together."
    seq_elite_bags: "the elite checked-bag allowance of an active Summit membership the ticket credits"
    seq_allowance: "The free allowance is the most generous of the fare brand's checked-bag allowance for the ticket's itinerary class, the elite checked-bag allowance of an active Summit membership the ticket credits, and, on a ticket naming an active corporate agreement, the agreement tier's corporate checked-bag allowance; the allowances never add together."
    seq_position: "The bag's place in the count is the number of first, second and third bag charges already recorded in the bag's direction plus one."
    seq_list_charge: "The bag's list charge is zero when its place in the count is within the free allowance; beyond it, a first bag on a domestic itinerary costs the fare brand's online first-bag fee when the segment's check-in channel is online and its airport first-bag fee otherwise, a second domestic bag costs the second-bag fee, a first or second bag on an international itinerary costs the first-bag or second-bag fee of its itinerary class, and a third or later bag costs the third-bag fee of domestic and short-haul itineraries or of long-haul itineraries."
    seq_postings: "The posting rate follows the agreement the ticket names and its flown-spend postings dated within the last 6 months"
    seq_posting_rate: "an active agreement with at least the busy posting count gives the busy posting rate; an active agreement with at least the steady posting count but fewer than the busy posting count gives the steady posting rate; any other ticket has a posting rate of one."
    seq_fare_collected: "on any other ticket it is the fare collected, every fare-collection and add-collect entry."
    seq_fare_flown: "the fare collected less the coupon value already flown"
    seq_banding_fare: "on a ticket with at least one flown coupon it is the fare still unflown, the fare collected less the coupon value already flown; on a ticket with no flown coupon that names an active corporate agreement it is the ticket's base fare, before taxes and fees; on any other ticket it is the fare collected, every fare-collection and add-collect entry."
    seq_fare_rate: "at least the high fare floor gives the high fare band rate, at least the middle fare floor but below the high fare floor gives the middle fare band rate, and less gives a rate of one."
    seq_channel_rate: "the airport gives the airport check-in rate, online gives the online check-in rate, and the call center gives a rate of one."
    result: "The posting rate, the fare band rate and the check-in channel rate are multiplied together into one combined rate that acts once on the bag's list charge, and that product, rounded to the cent only at the end, is the bag charge posted."
  factors:
  - id: bag_posting_rate
    effect: parameter
    decides: seq_posting_rate
    bindings: [seq_postings, seq_posting_rate]
    ladder:
    - when: "an active agreement with at least the busy posting count of flown-spend postings in the last 6 months"
      value: "K('busy_posting_rate')"
    - when: "an active agreement with at least the steady posting count but fewer than the busy posting count"
      value: "K('steady_posting_rate')"
    - when: "otherwise"
      value: "1"
    baseline:
      seq_posting_rate: "1.0"
    evidence: [cross_category, history]
    cross_difficulty: business
  - id: bag_fare_band
    effect: parameter
    decides: seq_fare_rate
    bindings: [seq_fare_collected, seq_fare_rate]
    ladder:
    - when: "the fare that bands the bag charge reaches the high fare floor"
      value: "K('high_fare_rate')"
    - when: "it reaches the middle fare floor but not the high fare floor"
      value: "K('mid_fare_rate')"
    - when: "otherwise"
      value: "1"
    baseline:
      seq_fare_rate: "1.0"
    evidence: [history]
    cross_difficulty: null
  - id: bag_check_in_channel_rate
    effect: parameter
    decides: seq_channel_rate
    bindings: [seq_channel, seq_channel_rate]
    ladder:
    - when: "a bag charge of the segment was paid at the airport"
      value: "K('airport_rate')"
    - when: "a bag charge of the segment was paid online and none at the airport"
      value: "K('online_rate')"
    - when: "otherwise (the call center)"
      value: "1"
    baseline:
      seq_channel_rate: "1.0"
    evidence: [history]
    cross_difficulty: null
  - id: bag_banding_fare_convention
    effect: method
    decides: seq_banding_fare
    bindings: [seq_fare_flown, seq_banding_fare]
    ladder:
    - when: "a ticket with at least one flown coupon"
      method: "the fare that bands the bag charge is the fare still unflown: the fare collected less the coupon value flown"
    - when: "a ticket with no flown coupon that names an active corporate agreement"
      method: "the fare that bands the bag charge is the base fare, before taxes and fees"
    - when: "otherwise"
      method: "the fare that bands the bag charge is the fare collected"
    baseline:
      seq_banding_fare: "seq_fare_collected"
    evidence: [history]
    cross_difficulty: null
  baseline:
    rule: >-
      The bag's direction is the return on a partially flown round trip and the outbound otherwise.
      The free allowance is the most generous of the fare brand's checked-bag allowance for the ticket's itinerary
      class, the elite checked-bag allowance of an active Summit membership the ticket credits, and, on a ticket naming
      an active corporate agreement, the agreement tier's corporate checked-bag allowance; the allowances never add
      together.
      The bag's place in the count is the number of first, second and third bag charges already recorded in the bag's
      direction plus one.
      The bag's list charge is zero when its place in the count is within the free allowance; beyond it, a first bag on
      a domestic itinerary costs the fare brand's online first-bag fee when the segment's check-in channel is online
      and its airport first-bag fee otherwise, a second domestic bag costs the second-bag fee, a first or second bag on
      an international itinerary costs the first-bag or second-bag fee of its itinerary class, and a third or later bag
      costs the third-bag fee of domestic and short-haul itineraries or of long-haul itineraries.
      The bag charge posted is the bag's list charge rounded to the cent.
      The segment's check-in channel is the airport when any bag charge of that segment was paid at the airport, online
      when a bag charge of that segment was paid online and none at the airport, and the call center otherwise.
    params: [first_bag_fee_domestic_online, first_bag_fee_domestic_airport, second_bag_fee_domestic,
      first_bag_fee_short_haul_international, second_bag_fee_short_haul_international, first_bag_fee_long_haul_international,
      second_bag_fee_long_haul_international, third_bag_fee_domestic_and_short_haul, third_bag_fee_long_haul,
