- id: ticket_evt_bag_fees
  subject:
  - ticket_bag_charge
  rule: 'Every checked bag is recorded as a bag entry for its travel_direction, with an amount of zero when it falls
    inside the free allowance. The sequence of a bag is ticket_msr_bags_checked_in_direction plus one, so the first
    bag checked in a direction is the first bag even when bags are checked at different times. The free allowance
    is free_checked_bags_domestic, free_checked_bags_short_haul_international or free_checked_bags_long_haul_international
    by route_type, compared with the passenger''s Summit tier elite_free_checked_bags in the loyalty charter and,
    on a ticket with an active corporate agreement, the agreement tier''s corporate_free_checked_bags in the business
    charter; the single most generous allowance applies and allowances never add together. A bag beyond the allowance
    is charged by its sequence: on domestic itineraries a first bag costs first_bag_fee_domestic_online when prepaid
    online or in the app and first_bag_fee_domestic_airport when paid at the airport or through the call center,
    and a second bag costs second_bag_fee_domestic; on international itineraries the first and second bag fees for
    the route_type apply in every channel; the third and each further bag costs third_bag_fee_domestic_and_short_haul
    or third_bag_fee_long_haul. Weight and size charges are separate entries on the same bag and are added on top
    of the sequence charge, even for a bag inside the free allowance: a bag heavier than checked_bag_weight_allowance_lb
    up to overweight_band_limit_lb pays overweight_fee_first_band, a bag heavier than overweight_band_limit_lb up
    to max_checked_bag_weight_lb pays overweight_fee_second_band, and a bag larger than standard_bag_linear_inches
    up to oversize_limit_linear_inches pays oversize_fee. When a bag is both overweight and oversize only the higher
    of the two charges is recorded. A bag heavier than max_checked_bag_weight_lb or larger than oversize_limit_linear_inches
    is not accepted as checked baggage. Bags are charged only while the ticket is ticketed or partially_flown. A
    bag fee is refunded under the fee-refund rule when the bag is delivered late beyond the refund threshold.'
