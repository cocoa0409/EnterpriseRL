- id: ticket_ext_bag_weight_charge
  base_policy_refs:
  - ticket_evt_bag_fees
  - ticket_corporate_agreement_benefits
  overwrite:
  - base_policy: ticket_evt_bag_fees
    superseded_clause: >-
      a bag heavier than checked_bag_weight_allowance_lb up to overweight_band_limit_lb pays overweight_fee_first_band,
      a bag heavier than overweight_band_limit_lb up to max_checked_bag_weight_lb pays overweight_fee_second_band
    replaced_by: >-
      The points rate, the fare band rate, the repeat rate and the weight excess rate are multiplied together into one
      combined rate that acts once on the bag's weight-or-size list charge, and that product, rounded to the cent only
      at the end, is the weight-or-size charge posted.
  - base_policy: ticket_evt_bag_fees
    superseded_clause: >-
      a bag larger than standard_bag_linear_inches up to oversize_limit_linear_inches pays oversize_fee
    replaced_by: >-
      The points rate, the fare band rate, the repeat rate and the weight excess rate are multiplied together into one
      combined rate that acts once on the bag's weight-or-size list charge, and that product, rounded to the cent only
      at the end, is the weight-or-size charge posted.
  trigger: state_due
  subject:
  - ticket_bag_charge
  computes: charge_amount
  target_tool: post_bag_weight_charge_02a99017
  params:
    scale_tolerance_lb: 3
    high_points: 15000
    high_points_rate: 0.8
    mid_points: 5000
    mid_points_rate: 0.9
    high_fare_floor: 600
    high_fare_rate: 0.95
    mid_fare_floor: 400
    mid_fare_rate: 0.97
    repeat_two_rate: 1.2
    repeat_one_rate: 1.1
    near_excess_lb: 5
    near_excess_rate: 0.5
    mid_excess_lb: 20
    mid_excess_rate: 0.8
  rule: >-
    This rule sets the weight-or-size charge owed for the heaviest bag carrying a first, second or third bag charge
    on a ticket's first unflown segment when that bag carries no weight or size entry. The charge is owed as soon as
    the records show the bag checked, whether or not the customer raises it, and it is posted through the call center
    as one entry for that bag tag of the component that is higher; a charge worked out at zero is not recorded, and a
    bag whose charge works out at zero owes no weight or size charge.
    The bag's recorded weight, size and check-in channel are those of its bag charge.
    The weight list charge is zero when the weight counted is at most the fare brand's weight allowance, the first
    overweight band fee when it is above the allowance and at most the first band limit, and the second overweight
    band fee when it is above the first band limit; the size list charge is zero when the recorded size is at most the
    standard linear inches and the oversize fee otherwise; the bag's weight-or-size list charge is the higher of the
    two, and only that component is recorded.
    The weight counted is the recorded weight, and the weight-or-size charge posted is the weight-or-size list charge
    rounded to the cent.
    The weight counted is set by one of three conventions by where the bag was checked: a bag checked at the airport
    counter is counted at its recorded weight less the scale tolerance in pounds; a bag checked online is counted at
    its declared weight rounded up to the next multiple of five pounds; a bag checked through the call center is
    counted at its recorded weight.
    The points rate follows the agreement the ticket names: an active agreement holding at least the high points
    balance gives the high points rate; an active agreement holding at least the middle points balance but less than
    the high points balance gives the middle points rate; any other ticket has a points rate of one.
    The fare band rate follows the fare collected on the ticket, every fare-collection and add-collect entry: at least
    the high fare floor gives the high fare band rate, at least the middle fare floor but below the high fare floor
    gives the middle fare band rate, and less gives a rate of one.
    The repeat rate follows the weight and size entries already standing on the ticket: two or more give the higher
    repeat rate, exactly one gives the lower repeat rate, and none gives a rate of one.
    The weight excess rate follows the pounds by which the weight counted exceeds the fare brand's weight allowance,
    when the weight charge is the component recorded: an excess of at most the near excess in pounds gives the near
    excess rate, an excess above the near excess and at most the middle excess in pounds gives the middle excess
    rate, and a larger excess, or a size charge recorded instead, gives a rate of one.
    The points rate, the fare band rate, the repeat rate and the weight excess rate are multiplied together into one
    combined rate that acts once on the bag's weight-or-size list charge, and that product, rounded to the cent only
    at the end, is the weight-or-size charge posted.
  prerequisite: []
  cross_category:
  - category: business
    as: branch
    reads:
    - status
    - point_balance
    note: The points rate is decided from the status and points balance of the agreement the ticket names.
  compute:
  - w_flown: "COUNT('ticket_transactions', event_type='ticket_coupon_flown')"
  - w_segment: "w_flown + 1"
  - w_weight: "MX(MAX('ticket_services', 'bag_weight_lb', event_type='ticket_bag_charge', service_type='first_bag', segment_number=w_segment), MAX('ticket_services', 'bag_weight_lb', event_type='ticket_bag_charge', service_type='second_bag', segment_number=w_segment), MAX('ticket_services', 'bag_weight_lb', event_type='ticket_bag_charge', service_type='third_bag', segment_number=w_segment))"
  - w_tag: "LATEST('ticket_services', 'bag_tag_number', date_field='service_date', event_type='ticket_bag_charge', segment_number=w_segment, bag_weight_lb=int(w_weight))"
  - w_linear: "LATEST('ticket_services', 'bag_linear_inches', date_field='service_date', event_type='ticket_bag_charge', bag_tag_number=w_tag)"
  - w_channel: "LATEST('ticket_services', 'sales_channel', date_field='service_date', event_type='ticket_bag_charge', bag_tag_number=w_tag)"
  - w_counted: "(w_weight - K('scale_tolerance_lb')) if w_channel == 'airport' else ((int((w_weight + 4) / 5) * 5) if w_channel == 'online' else w_weight)"
  - w_weight_charge: "0 if w_counted <= P('checked_bag_weight_allowance_lb') else (P('overweight_fee_first_band') if w_counted <= P('overweight_band_limit_lb') else P('overweight_fee_second_band'))"
  - w_size_charge: "0 if w_linear <= P('standard_bag_linear_inches') else P('oversize_fee')"
  - w_list_charge: "MX(w_weight_charge, w_size_charge)"
  - w_active: "CFIELD('business', 'status', business_account_id=F('corporate_account_id')) == 'active'"
  - w_points: "CFIELD('business', 'point_balance', business_account_id=F('corporate_account_id')) or 0"
  - w_points_rate: "K('high_points_rate') if (w_active and w_points >= K('high_points')) else (K('mid_points_rate') if (w_active and w_points >= K('mid_points') and w_points < K('high_points')) else 1.0)"
  - w_fare_collected: "SUM('ticket_transactions', 'amount', date_field='transaction_date', event_type='ticket_fare_collect') + SUM('ticket_transactions', 'amount', date_field='transaction_date', event_type='ticket_add_collect')"
  - w_fare_rate: "K('high_fare_rate') if w_fare_collected >= K('high_fare_floor') else (K('mid_fare_rate') if w_fare_collected >= K('mid_fare_floor') else 1.0)"
  - w_repeat: "COUNT('ticket_services', event_type='ticket_bag_charge', service_type='overweight_bag') + COUNT('ticket_services', event_type='ticket_bag_charge', service_type='oversize_bag')"
  - w_repeat_rate: "K('repeat_two_rate') if w_repeat >= 2 else (K('repeat_one_rate') if w_repeat == 1 else 1.0)"
  - w_excess: "w_counted - P('checked_bag_weight_allowance_lb')"
  - w_excess_rate: "K('near_excess_rate') if (w_weight_charge >= w_size_charge and w_weight_charge > 0 and w_excess <= K('near_excess_lb')) else (K('mid_excess_rate') if (w_weight_charge >= w_size_charge and w_weight_charge > 0 and w_excess > K('near_excess_lb') and w_excess <= K('mid_excess_lb')) else 1.0)"
  - result: "RND(w_list_charge * w_points_rate * w_fare_rate * w_repeat_rate * w_excess_rate, 2)"
  compute_basis:
    w_flown: "the heaviest bag carrying a first, second or third bag charge on a ticket's first unflown segment"
    w_weight: "the heaviest bag carrying a first, second or third bag charge on a ticket's first unflown segment"
    w_tag: "The bag's recorded weight, size and check-in channel are those of its bag charge."
    w_linear: "The bag's recorded weight, size and check-in channel are those of its bag charge."
    w_channel: "The bag's recorded weight, size and check-in channel are those of its bag charge."
    w_counted: "a bag checked at the airport counter is counted at its recorded weight less the scale tolerance in pounds; a bag checked online is counted at its declared weight rounded up to the next multiple of five pounds; a bag checked through the call center is counted at its recorded weight."
    w_weight_charge: "The weight list charge is zero when the weight counted is at most the fare brand's weight allowance, the first overweight band fee when it is above the allowance and at most the first band limit, and the second overweight band fee when it is above the first band limit"
    w_size_charge: "the size list charge is zero when the recorded size is at most the standard linear inches and the oversize fee otherwise"
    w_list_charge: "the bag's weight-or-size list charge is the higher of the two, and only that component is recorded."
    w_active: "an active agreement holding at least the high points balance gives the high points rate"
    w_points: "an active agreement holding at least the high points balance gives the high points rate"
    w_points_rate: "an active agreement holding at least the high points balance gives the high points rate; an active agreement holding at least the middle points balance but less than the high points balance gives the middle points rate; any other ticket has a points rate of one."
    w_fare_collected: "The fare band rate follows the fare collected on the ticket, every fare-collection and add-collect entry"
    w_fare_rate: "at least the high fare floor gives the high fare band rate, at least the middle fare floor but below the high fare floor gives the middle fare band rate, and less gives a rate of one."
    w_repeat: "The repeat rate follows the weight and size entries already standing on the ticket"
    w_repeat_rate: "two or more give the higher repeat rate, exactly one gives the lower repeat rate, and none gives a rate of one."
    w_excess: "The weight excess rate follows the pounds by which the weight counted exceeds the fare brand's weight allowance, when the weight charge is the component recorded"
    w_excess_rate: "an excess of at most the near excess in pounds gives the near excess rate, an excess above the near excess and at most the middle excess in pounds gives the middle excess rate, and a larger excess, or a size charge recorded instead, gives a rate of one."
    result: "The points rate, the fare band rate, the repeat rate and the weight excess rate are multiplied together into one combined rate that acts once on the bag's weight-or-size list charge, and that product, rounded to the cent only at the end, is the weight-or-size charge posted."
  factors:
  - id: weight_counted_convention
    effect: method
    decides: w_counted
    bindings: [w_weight, w_tag, w_channel, w_counted]
    ladder:
    - when: "the bag was checked at the airport counter"
      method: "the weight counted is the recorded weight less the scale tolerance in pounds"
    - when: "the bag was checked online"
      method: "the weight counted is the declared weight rounded up to the next multiple of five pounds"
    - when: "otherwise (through the call center)"
      method: "the weight counted is the recorded weight"
    baseline:
      w_counted: "w_weight"
    evidence: [history]
    cross_difficulty: null
  - id: weight_points_rate
    effect: parameter
    decides: w_points_rate
    bindings: [w_active, w_points, w_points_rate]
    ladder:
    - when: "an active agreement holding at least the high points balance"
      value: "K('high_points_rate')"
    - when: "an active agreement holding at least the middle points balance but less than the high points balance"
      value: "K('mid_points_rate')"
    - when: "otherwise"
      value: "1"
    baseline:
      w_points_rate: "1.0"
    evidence: [cross_category]
    cross_difficulty: business
  - id: weight_fare_band
    effect: parameter
    decides: w_fare_rate
    bindings: [w_fare_collected, w_fare_rate]
    ladder:
    - when: "the fare collected reaches the high fare floor"
      value: "K('high_fare_rate')"
    - when: "the fare collected reaches the middle fare floor but not the high fare floor"
      value: "K('mid_fare_rate')"
    - when: "otherwise"
      value: "1"
    baseline:
      w_fare_rate: "1.0"
    evidence: [history]
    cross_difficulty: null
  - id: weight_repeat_rate
    effect: parameter
    decides: w_repeat_rate
    bindings: [w_repeat, w_repeat_rate]
    ladder:
    - when: "two or more weight or size entries already stand on the ticket"
      value: "K('repeat_two_rate')"
    - when: "exactly one weight or size entry already stands on the ticket"
      value: "K('repeat_one_rate')"
    - when: "otherwise"
      value: "1"
    baseline:
      w_repeat_rate: "1.0"
    evidence: [history]
    cross_difficulty: null
  - id: weight_excess_rate
    effect: parameter
    decides: w_excess_rate
    bindings: [w_linear, w_weight_charge, w_size_charge, w_excess, w_excess_rate]
    ladder:
    - when: "the weight charge is recorded and the weight counted exceeds the weight allowance by at most the near excess in pounds"
      value: "K('near_excess_rate')"
    - when: "the weight charge is recorded and the excess is above the near excess and at most the middle excess in pounds"
      value: "K('mid_excess_rate')"
    - when: "otherwise (a larger excess, or a size charge recorded instead)"
      value: "1"
    baseline:
      w_excess_rate: "1.0"
    evidence: [history]
    cross_difficulty: null
  baseline:
    rule: >-
      The bag's recorded weight, size and check-in channel are those of its bag charge.
      The weight list charge is zero when the weight counted is at most the fare brand's weight allowance, the first
      overweight band fee when it is above the allowance and at most the first band limit, and the second overweight
      band fee when it is above the first band limit; the size list charge is zero when the recorded size is at most the
      standard linear inches and the oversize fee otherwise; the bag's weight-or-size list charge is the higher of the
      two, and only that component is recorded.
      The weight counted is the recorded weight, and the weight-or-size charge posted is the weight-or-size list charge
      rounded to the cent.
    params: [checked_bag_weight_allowance_lb, overweight_band_limit_lb, overweight_fee_first_band, overweight_fee_second_band,
      standard_bag_linear_inches, oversize_fee]
  inputs:
    history:
    - {table: ticket_services, aggregate: max, field: bag_weight_lb, filters: {event_type: ticket_bag_charge}}
    - {table: ticket_services, aggregate: latest, field: sales_channel, filters: {event_type: ticket_bag_charge}}
    - {table: ticket_services, aggregate: count, field: service_id, filters: {event_type: ticket_bag_charge, service_type: overweight_bag}}
    - {table: ticket_transactions, aggregate: sum, field: amount, filters: {event_type: ticket_fare_collect}}
    cross_category: [business]
- id: ticket_ext_premium_economy_upgrade_charge
  base_policy_refs:
  - ticket_evt_paid_upgrade
  overwrite:
  - base_policy: ticket_evt_paid_upgrade
    superseded_clause: >-
      The fee is paid_upgrade_to_premium_economy_fee for a move into Premium Economy, and
      paid_upgrade_to_first_fee_short_segment or paid_upgrade_to_first_fee_long_segment for a move into First on
      segments up to and including segment_length_threshold_miles or longer.
    replaced_by: >-
      The corporate upgrade rate, the travel-day rate, the fare band rate and the booking lead rate are multiplied
      together into one combined rate that acts once on the Premium Economy upgrade price, the trip-charge credit is
      then taken off that product, and the result, never below zero and rounded to the cent only at the end, is the
      Premium Economy upgrade charge.
  - base_policy: ticket_evt_paid_upgrade
    superseded_clause: >-
      A paid upgrade moves the passenger on one unflown segment into a higher cabin for a fixed fee.
    replaced_by: >-
      The corporate upgrade rate, the travel-day rate, the fare band rate and the booking lead rate are multiplied
      together into one combined rate that acts once on the Premium Economy upgrade price, the trip-charge credit is
      then taken off that product, and the result, never below zero and rounded to the cent only at the end, is the
      Premium Economy upgrade charge.
  trigger: on_request
  subject:
  - ticket_upgrade_purchase
  computes: upgrade_fee
  target_tool: purchase_premium_economy_upgrade_2477ee45
  params:
    deep_discount_percent: 10
    deep_discount_rate: 0.8
    some_discount_percent: 1
    some_discount_rate: 0.9
    departure_day_rate: 0.85
    near_travel_days: 3
    near_travel_rate: 0.95
    high_fare_floor: 600
    high_fare_rate: 0.93
    mid_fare_floor: 400
    mid_fare_rate: 0.97
    long_lead_days: 21
    long_lead_rate: 0.95
    short_lead_days: 7
    short_lead_rate: 0.98
    active_channel_share: 0.1
    review_channel_share: 0.05
  rule: >-
    This rule prices a paid upgrade into Premium Economy that the ticket holder buys, on request, for the ticket's
    first unflown segment; the ticket holder, or for a company-held ticket the company's travel manager, confirms and
    pays it in person.
    The Premium Economy upgrade price is the fare brand's Premium Economy upgrade fee for the segment, and the
    Premium Economy upgrade charge is that price rounded to the cent.
    The Premium Economy upgrade charge is fixed only after the latest standard exchange recorded on the ticket
    carries its change fee entry, whenever that exchange owes a change fee.
    The Premium Economy upgrade charge on a segment is not fixed until every bag of that segment carrying a weight or
    size entry also carries its first, second or third bag charge.
    Before the Premium Economy upgrade charge on a segment is fixed, the heaviest bag charged by count on that segment
    must carry its weight or size entry whenever it owes a weight or size charge.
    The corporate upgrade rate follows the agreement the ticket names and the tier's negotiated discount for the
    ticket's itinerary class, the domestic discount for domestic and short-haul international itineraries and the
    international discount for long-haul international itineraries: an active agreement whose discount is at least
    the deep discount percent gives the deep corporate upgrade rate; an active agreement whose discount is at least
    the some-discount percent but below the deep discount percent gives the partial corporate upgrade rate; any other
    ticket has a corporate upgrade rate of one.
    The travel-day rate follows the whole days from today to the segment's scheduled departure date: travel today
    gives the departure-day rate, travel one day up to the near-travel days away gives the near-travel rate, and
    later travel gives a rate of one.
    The fare band rate follows the fare collected on the ticket, every fare-collection and add-collect entry: at least
    the high fare floor gives the high fare band rate, at least the middle fare floor but below the high fare floor
    gives the middle fare band rate, and less gives a rate of one.
    The booking lead rate follows the whole days from the ticket's issue to the ticket's first flight: at least the
    long lead days give the long lead rate, at least the short lead days but fewer than the long lead days give the
    short lead rate, and fewer days give a rate of one.
    The trip charges are the change, bag and upgrade charges of the ticket, measured by one of three conventions: on a
    ticket with at least one flown coupon they are the charges recorded against the first unflown segment plus the
    itinerary-level charges recorded against no segment; on a round-trip ticket with no flown coupon they are half of
    every such charge on the ticket; on any other ticket they are every such charge on the ticket.
    The trip-charge credit share follows the agreement the ticket names and its eligible booking channels: an active
    agreement that lists the ticket's booking channel gives the active-agreement credit share; an agreement under
    review that lists the ticket's booking channel gives the under-review credit share; any other ticket has a credit
    share of zero; the trip-charge credit is the credit share of the trip charges.
    The corporate upgrade rate, the travel-day rate, the fare band rate and the booking lead rate are multiplied
    together into one combined rate that acts once on the Premium Economy upgrade price, the trip-charge credit is
    then taken off that product, and the result, never below zero and rounded to the cent only at the end, is the
    Premium Economy upgrade charge.
  prerequisite:
  - problem: ticket_ext_change_fee_posting
    kind: value_input
    gate: pe_trip_charges
    form: state
    policy_source: >-
      The Premium Economy upgrade charge is fixed only after the latest standard exchange recorded on the ticket
      carries its change fee entry, whenever that exchange owes a change fee.
    condition: >-
      When the latest ticket_transactions entry of event_type ticket_exchange with exchange_type standard_change owes a
      change fee above zero under the change fee rule, a ticket_change_fee entry of service_type change_fee names it
      through related_transaction_id.
    resolved_by: post_change_fee_ac050962
    effect: >-
      The change fee entry is an itinerary-level charge, so it enters the trip charges of the first unflown segment
      and raises the trip-charge credit taken off the upgrade.
  - problem: ticket_ext_bag_sequence_charge
    kind: value_input
    gate: pe_trip_charges
    form: state
    policy_source: >-
      The Premium Economy upgrade charge on a segment is not fixed until every bag of that segment carrying a weight or
      size entry also carries its first, second or third bag charge.
    condition: >-
      Every bag_tag_number that appears on a ticket_bag_charge entry of service_type overweight_bag or oversize_bag on
      the first unflown segment also appears on a ticket_bag_charge entry of service_type first_bag, second_bag or
      third_bag.
    resolved_by: post_bag_sequence_charge_b2992c63
    effect: >-
      The bag charge of the bag on the first unflown segment enters the trip charges of that segment and raises the
      trip-charge credit taken off the upgrade.
  - problem: ticket_ext_bag_weight_charge
    kind: value_input
    gate: pe_trip_charges
    form: state
    policy_source: >-
      Before the Premium Economy upgrade charge on a segment is fixed, the heaviest bag charged by count on that
      segment must carry its weight or size entry whenever it owes a weight or size charge.
    condition: >-
      When the heaviest bag with a first_bag, second_bag or third_bag entry on the first unflown segment owes a weight
      or size charge above zero under the bag weight charge rule, a ticket_bag_charge entry of service_type
      overweight_bag or oversize_bag stands under the same bag_tag_number.
    resolved_by: post_bag_weight_charge_02a99017
    effect: >-
      The weight-or-size charge of the bag on the first unflown segment enters the trip charges of that segment and
      raises the trip-charge credit taken off the upgrade.
  cross_category:
  - category: business
    as: branch
    reads:
    - status
    - variant_name
    note: The corporate upgrade rate and the trip-charge credit share are decided from the agreement the ticket names
      (status, the tier's negotiated discount for the itinerary class and its eligible booking channels).
  compute:
  - pe_flown: "COUNT('ticket_transactions', event_type='ticket_coupon_flown')"
  - pe_segment: "pe_flown + 1"
  - pe_price: "P('paid_upgrade_to_premium_economy_fee')"
  - pe_active: "CFIELD('business', 'status', business_account_id=F('corporate_account_id')) == 'active'"
  - pe_discount: "(CPARAM('business', 'fare_discount_percent_international', business_account_id=F('corporate_account_id')) or 0) if F('route_type') == 'long_haul_international' else (CPARAM('business', 'fare_discount_percent_domestic', business_account_id=F('corporate_account_id')) or 0)"
  - pe_corporate_rate: "K('deep_discount_rate') if (pe_active and pe_discount >= K('deep_discount_percent')) else (K('some_discount_rate') if (pe_active and pe_discount >= K('some_discount_percent') and pe_discount < K('deep_discount_percent')) else 1.0)"
  - pe_travel_days: "DAYS(NOW, F('next_departure_at'))"
  - pe_travel_rate: "K('departure_day_rate') if pe_travel_days == 0 else (K('near_travel_rate') if pe_travel_days <= K('near_travel_days') else 1.0)"
  - pe_fare_collected: "SUM('ticket_transactions', 'amount', date_field='transaction_date', event_type='ticket_fare_collect') + SUM('ticket_transactions', 'amount', date_field='transaction_date', event_type='ticket_add_collect')"
  - pe_fare_rate: "K('high_fare_rate') if pe_fare_collected >= K('high_fare_floor') else (K('mid_fare_rate') if pe_fare_collected >= K('mid_fare_floor') else 1.0)"
  - pe_first_flight: "LATEST('ticket_transactions', 'flight_date', date_field='transaction_date', event_type='ticket_coupon_flown', segment_number=1)"
  - pe_lead_days: "DAYS(F('issued_at'), pe_first_flight or F('next_departure_at'))"
  - pe_lead_rate: "K('long_lead_rate') if pe_lead_days >= K('long_lead_days') else (K('short_lead_rate') if pe_lead_days >= K('short_lead_days') else 1.0)"
  - pe_segment_charges: "SUM('ticket_services', 'amount', date_field='service_date', event_type='ticket_change_fee', segment_number=pe_segment) + SUM('ticket_services', 'amount', date_field='service_date', event_type='ticket_bag_charge', segment_number=pe_segment) + SUM('ticket_services', 'amount', date_field='service_date', event_type='ticket_upgrade_purchase', segment_number=pe_segment) + SUM('ticket_services', 'amount', date_field='service_date', event_type='ticket_change_fee', segment_number=0) + SUM('ticket_services', 'amount', date_field='service_date', event_type='ticket_bag_charge', segment_number=0) + SUM('ticket_services', 'amount', date_field='service_date', event_type='ticket_upgrade_purchase', segment_number=0)"
  - pe_all_charges: "SUM('ticket_services', 'amount', date_field='service_date', event_type='ticket_change_fee') + SUM('ticket_services', 'amount', date_field='service_date', event_type='ticket_bag_charge') + SUM('ticket_services', 'amount', date_field='service_date', event_type='ticket_upgrade_purchase')"
  - pe_trip_charges: "pe_segment_charges if pe_flown > 0 else ((pe_all_charges / 2) if F('trip_type') == 'round_trip' else pe_all_charges)"
  - pe_channel_listed: "F('booking_channel') in (CPARAM('business', 'booking_channels_eligible', business_account_id=F('corporate_account_id')) or '')"
  - pe_under_review: "CFIELD('business', 'status', business_account_id=F('corporate_account_id')) == 'under_review'"
  - pe_credit_share: "K('active_channel_share') if (pe_active and pe_channel_listed) else (K('review_channel_share') if (pe_under_review and pe_channel_listed) else 0.0)"
  - result: "RND(MX(0, pe_price * pe_corporate_rate * pe_travel_rate * pe_fare_rate * pe_lead_rate - pe_credit_share * pe_trip_charges), 2)"
  compute_basis:
    pe_flown: "This rule prices a paid upgrade into Premium Economy that the ticket holder buys, on request, for the ticket's first unflown segment"
    pe_price: "The Premium Economy upgrade price is the fare brand's Premium Economy upgrade fee for the segment, and the Premium Economy upgrade charge is that price rounded to the cent."
    pe_active: "an active agreement whose discount is at least the deep discount percent gives the deep corporate upgrade rate"
    pe_discount: "the tier's negotiated discount for the ticket's itinerary class, the domestic discount for domestic and short-haul international itineraries and the international discount for long-haul international itineraries"
    pe_corporate_rate: "an active agreement whose discount is at least the deep discount percent gives the deep corporate upgrade rate; an active agreement whose discount is at least the some-discount percent but below the deep discount percent gives the partial corporate upgrade rate; any other ticket has a corporate upgrade rate of one."
    pe_travel_days: "The travel-day rate follows the whole days from today to the segment's scheduled departure date"
    pe_travel_rate: "travel today gives the departure-day rate, travel one day up to the near-travel days away gives the near-travel rate, and later travel gives a rate of one."
    pe_fare_collected: "The fare band rate follows the fare collected on the ticket, every fare-collection and add-collect entry"
    pe_fare_rate: "at least the high fare floor gives the high fare band rate, at least the middle fare floor but below the high fare floor gives the middle fare band rate, and less gives a rate of one."
    pe_first_flight: "The booking lead rate follows the whole days from the ticket's issue to the ticket's first flight"
    pe_lead_days: "The booking lead rate follows the whole days from the ticket's issue to the ticket's first flight"
    pe_lead_rate: "at least the long lead days give the long lead rate, at least the short lead days but fewer than the long lead days give the short lead rate, and fewer days give a rate of one."
    pe_segment_charges: "on a ticket with at least one flown coupon they are the charges recorded against the first unflown segment plus the itinerary-level charges recorded against no segment"
    pe_all_charges: "on any other ticket they are every such charge on the ticket."
    pe_trip_charges: "on a ticket with at least one flown coupon they are the charges recorded against the first unflown segment plus the itinerary-level charges recorded against no segment; on a round-trip ticket with no flown coupon they are half of every such charge on the ticket; on any other ticket they are every such charge on the ticket."
    pe_channel_listed: "an active agreement that lists the ticket's booking channel gives the active-agreement credit share"
    pe_under_review: "an agreement under review that lists the ticket's booking channel gives the under-review credit share"
    pe_credit_share: "an active agreement that lists the ticket's booking channel gives the active-agreement credit share; an agreement under review that lists the ticket's booking channel gives the under-review credit share; any other ticket has a credit share of zero; the trip-charge credit is the credit share of the trip charges."
    result: "The corporate upgrade rate, the travel-day rate, the fare band rate and the booking lead rate are multiplied together into one combined rate that acts once on the Premium Economy upgrade price, the trip-charge credit is then taken off that product, and the result, never below zero and rounded to the cent only at the end, is the Premium Economy upgrade charge."
  factors:
  - id: pe_corporate_upgrade_rate
    effect: parameter
    decides: pe_corporate_rate
    bindings: [pe_active, pe_discount, pe_corporate_rate]
    ladder:
    - when: "an active agreement whose tier's negotiated discount for the itinerary class is at least the deep discount percent"
      value: "K('deep_discount_rate')"
    - when: "an active agreement whose discount is at least the some-discount percent but below the deep discount percent"
      value: "K('some_discount_rate')"
    - when: "otherwise"
      value: "1"
    baseline:
      pe_corporate_rate: "1.0"
    evidence: [cross_category]
    cross_difficulty: business
  - id: pe_travel_day_rate
    effect: parameter
    decides: pe_travel_rate
    bindings: [pe_travel_days, pe_travel_rate]
    ladder:
    - when: "the segment departs today"
      value: "K('departure_day_rate')"
    - when: "the segment departs one day up to the near-travel days away"
      value: "K('near_travel_rate')"
    - when: "otherwise"
      value: "1"
    baseline:
      pe_travel_rate: "1.0"
    evidence: [date]
    cross_difficulty: null
  - id: pe_fare_band
    effect: parameter
    decides: pe_fare_rate
    bindings: [pe_fare_collected, pe_fare_rate]
    ladder:
    - when: "the fare collected reaches the high fare floor"
      value: "K('high_fare_rate')"
    - when: "the fare collected reaches the middle fare floor but not the high fare floor"
      value: "K('mid_fare_rate')"
    - when: "otherwise"
      value: "1"
    baseline:
      pe_fare_rate: "1.0"
    evidence: [history]
    cross_difficulty: null
  - id: pe_booking_lead_rate
    effect: parameter
    decides: pe_lead_rate
    bindings: [pe_first_flight, pe_lead_days, pe_lead_rate]
    ladder:
    - when: "at least the long lead days from issue to the first flight"
      value: "K('long_lead_rate')"
    - when: "at least the short lead days but fewer than the long lead days"
      value: "K('short_lead_rate')"
    - when: "otherwise"
      value: "1"
    baseline:
      pe_lead_rate: "1.0"
    evidence: [date, history]
    cross_difficulty: null
  - id: pe_trip_charge_credit
    effect: parameter
    decides: pe_credit_share
    bindings: [pe_channel_listed, pe_under_review, pe_credit_share]
    ladder:
    - when: "an active agreement that lists the ticket's booking channel among its eligible channels"
      value: "K('active_channel_share')"
    - when: "an agreement under review that lists the ticket's booking channel"
      value: "K('review_channel_share')"
    - when: "otherwise"
      value: "0"
    baseline:
      pe_credit_share: "0.0"
    evidence: [cross_category]
    cross_difficulty: business
  - id: pe_trip_charges_measure
    effect: method
    decides: pe_trip_charges
    bindings: [pe_segment_charges, pe_all_charges, pe_trip_charges]
    ladder:
    - when: "a ticket with at least one flown coupon"
      method: "trip charges are the change, bag and upgrade charges recorded against the first unflown segment plus those recorded against no segment"
    - when: "a round-trip ticket with no flown coupon"
      method: "trip charges are half of every change, bag and upgrade charge on the ticket"
    - when: "otherwise"
      method: "trip charges are every change, bag and upgrade charge on the ticket"
    baseline:
      pe_trip_charges: "pe_all_charges"
    evidence: [history]
    cross_difficulty: null
  baseline:
    rule: >-
      The Premium Economy upgrade price is the fare brand's Premium Economy upgrade fee for the segment, and the
      Premium Economy upgrade charge is that price rounded to the cent.
    params: [paid_upgrade_to_premium_economy_fee]
  inputs:
    history:
    - {table: ticket_transactions, aggregate: count, field: transaction_id, filters: {event_type: ticket_coupon_flown}}
    - {table: ticket_transactions, aggregate: sum, field: amount, filters: {event_type: ticket_fare_collect}}
    - {table: ticket_services, aggregate: sum, field: amount, filters: {event_type: ticket_bag_charge}}
    - {table: ticket_services, aggregate: sum, field: amount, filters: {event_type: ticket_change_fee}}
    cross_category: [business]
