- id: ticket_corporate_agreement_benefits
  subject:
  - ticket_change_fee
  - ticket_bag_charge
  - ticket_name_correction
  rule: 'A ticket whose corporate_account_id names a Crestline corporate travel agreement receives that agreement''s
    benefits: when the agreement tier''s change_fee_waiver in the business charter is true no change fee or same-day
    change fee is charged, its corporate_free_checked_bags allowance competes with the fare brand and Summit allowances
    under the most-generous-allowance rule, and when its ticket_name_change_between_travelers is true an unflown
    ticket may be reassigned to another traveler on the agreement''s active roster, which is the only exception
    to the rule that a ticket is never transferred. Corporate benefits are applied only while the business agreement
    named by corporate_account_id has status active. Award tickets, companion tickets and Crestline Basic Economy
    tickets never carry a corporate_account_id and never receive corporate benefits, even when the traveler appears
    on a corporate roster. Corporate waivers and Summit elite waivers of the same fee do not stack into a credit;
    a fee waived by either is simply not charged.'
  eligibility:
  - id: agreement_active
    applies_to:
    - ticket_change_fee
    - ticket_bag_charge
    - ticket_name_correction
    kind: state
    condition: Corporate benefits are applied only while the business agreement named by corporate_account_id has
      status active.
    evidence_fields:
    - business_holdings.business_account_id
    - business_holdings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - business_holdings.business_account_id
      action_bindings:
        business_holdings.business_account_id: corporate_account_id
    state_contract:
      field: business_holdings.status
      allowed:
