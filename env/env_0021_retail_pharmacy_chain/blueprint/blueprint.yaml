name: env_0021_retail_pharmacy_chain
company: Kestrel Pharmacy

background: |
  Kestrel Pharmacy is a national retail pharmacy chain headquartered in Columbus, Ohio, running 4,186 neighborhood stores across 37 states and the District of Columbia, a central-fill and mail facility in Groveport, Ohio, and a specialty pharmacy in Memphis, Tennessee.
  Its Patient Care Desk answers calls and chats from patients and caregivers about prescriptions, insurance, savings programs, vaccinations, deliveries and rewards, in a calm, plain-spoken clinical tone.
  Every patient has one Kestrel profile carrying their identity details, home address and preferred store, and everything they hold at Kestrel hangs off that profile.
  Prescriptions are held on the profile as individual prescription records, each in one handling class: Non-Controlled Acute Prescription, Non-Controlled Maintenance Prescription, Schedule V Controlled Prescription, Schedule III-IV Controlled Prescription, Schedule II Controlled Prescription or Specialty Limited-Distribution Prescription.
  Every original fill, refill, partial fill, balance completion, return to stock, pickup, dispensing-error return and renewal request sent to a prescriber is booked against the prescription it belongs to.
  Prescription insurance is kept on the profile as coverage records classed as Medicaid Managed Care Pharmacy Benefit, Medicare Part D Standard Plan, Medicare Part D Enhanced Plan, Medicare Advantage Prescription Drug Plan, Commercial High-Deductible Health Plan, Commercial Copay Plan or Workers' Compensation Pharmacy Benefit, and each claim paid, rejected or reversed and each prior authorization step is logged against the coverage it was billed to.
  Savings and copay assistance is held as program enrollments: the free Kestrel Rx Discount Card, the paid Kestrel Rx Savings Club Individual and Kestrel Rx Savings Club Family memberships, and Manufacturer Copay Card, Manufacturer Bridge Program and Charitable Foundation Copay Grant enrollments, with every benefit period opened, benefit applied or reversed and membership fee charged or refunded booked as it happens.
  Automated refilling is held per prescription as an enrollment in Kestrel Auto Refill 30-Day, Kestrel Auto Refill 90-Day, Kestrel Med Sync Monthly, Kestrel Med Sync 90-Day, Kestrel Med Sync with Adherence Packaging or Kestrel Home Delivery Auto Refill, and each automated cycle, skip and pause is logged.
  Immunization services are held as one course per vaccine, among Seasonal Influenza Standard-Dose Vaccination, Seasonal Influenza High-Dose Vaccination, COVID-19 Updated Vaccination, RSV Older Adult Vaccination, Pneumococcal Conjugate Vaccination, Recombinant Zoster Two-Dose Series and Hepatitis B Three-Dose Series, with every appointment booked, cancelled or missed and every dose administered recorded against its course.
  Delivery is held as a delivery plan, one of Kestrel Pay-Per-Delivery, Kestrel Mail Delivery, Kestrel Delivery Pass Monthly, Kestrel Senior Delivery Pass, Kestrel Delivery Pass Annual and Kestrel Specialty Courier Service, whose orders, delivery attempts, subscription and order fees and refunds are booked per order and per billing cycle.
  The Kestrel Care Rewards loyalty program is held as one membership per patient at the Kestrel Care Rewards Member, Kestrel Care Rewards Silver, Kestrel Care Rewards Gold or Kestrel Care Rewards Platinum level, or as a paid Kestrel Care Rewards Plus Monthly or Kestrel Care Rewards Plus Annual membership, and points earned, redeemed, expired, reversed and credited as goodwill are booked to it.
  Callers are mostly adults managing chronic conditions, older adults on Medicare, and parents or adult children handling medications for a family member, with a steady stream of patients who are between insurance plans.
  A typical caller holds several maintenance prescriptions, one or two coverage records, a rewards membership and often a delivery plan or savings program, and brings months to years of fill, claim and pickup history.
  Many call with something already in motion: a refill that was rejected, a prior authorization still waiting on the plan, a fill sitting in will-call, a second vaccine dose coming due, a delivery that never arrived or a bottle that does not look like last month's.
  Specialty patients on high-cost therapies commonly combine commercial insurance with a manufacturer copay card or foundation grant and cold-chain courier delivery.

logs:
  verification_log_table: identity_verifications
  handoff_log_table: human_handoffs


difficulties:
  - name: prescription_fills_and_refills
    claim:
      categories: [rx]
      event_types: [rx_new_fill, rx_refill, rx_partial_fill, rx_balance_completion, rx_balance_cancelled, rx_return_to_stock, rx_pickup, rx_emergency_supply, rx_error_return, rx_error_remake, rx_renewal_requested, rx_transferred_out, rx_store_changed, rx_discontinued]
    summary: >
      Patients and caregivers call about getting a prescription filled or refilled: asking for a refill before the
      bottle runs out, booking a pickup date, collecting a fill that sat in will-call, finishing a quantity owed from a
      short fill, moving a prescription to another Kestrel store or an outside pharmacy, or reporting that a bottle
      looks wrong. The setting varies by the handling class of each prescription (from Non-Controlled Acute
      Prescription to Schedule II Controlled Prescription and Specialty Limited-Distribution Prescription), by its
      status and remaining refills, by several prescriptions for the same drug, and by the fill, pickup, owed-balance
      and error-report history on file. The governing records are the prescription, its fill ledger, its prescriber
      requests and any dispensing-error report, and the rules are shaped by state gates on the prescription status
      (rx_evt_refill_authorization, rx_new_fill_rules), per-class timing and quantity rules such as the refill-eligible
      date (rx_evt_refill_timing), early-fill exceptions (rx_evt_early_fill_exceptions), owed-balance windows
      (rx_evt_partial_fill), will-call holds (rx_evt_will_call), release and ID rules (rx_evt_pickup_release),
      dispensing-error windows and refunds (rx_evt_dispensing_error), emergency supplies (rx_evt_emergency_supply),
      renewal requests (rx_evt_renewal_request), transfers (rx_transfer_and_move) and same-drug aggregation
      (rx_agg_same_drug); in the ordinary course a prescription is entered, filled, released and refilled until its
      refills or validity run out. Dispensing, reversing, releasing, requesting renewals and recording confirmed-error
      returns are agent service actions on a verified patient, while the dispensing-error report itself is the
      patient's own statement and a transfer destination is taken exactly as the patient gives it. Requests no charter
      decides, such as compensation for costs beyond the refund, remake and goodwill a dispensing error earns,
      or a clinical judgement about whether a dose is right for the patient, are handed off as POLICY_NOT_COVERED.

  - name: insurance_rejections_and_prior_auth
    claim:
      categories: [coverage]
      event_types: [coverage_plan_added, coverage_plan_verified, coverage_plan_details_updated, coverage_plan_removed, coverage_claim_paid, coverage_claim_rejected, coverage_claim_reversed, coverage_m3p_notice, coverage_pa_initiated, coverage_pa_approved, coverage_pa_denied, coverage_appeal_filed]
    summary: >
      Patients call because the pharmacy told them insurance rejected a prescription, because a prior authorization is
      taking too long, because they have a new insurance card, or because they are paying far more than expected. The
      setting varies by the plan class on file (Medicaid Managed Care Pharmacy Benefit through Workers' Compensation
      Pharmacy Benefit), by whether a second plan is on file, by the plan's effective and termination dates, and by the
      claim, reversal and prior-authorization history for each prescription. The governing records are the coverage
      records and their claim and prior-authorization ledgers, and the rules are shaped by the active-coverage state
      gate and per-class billing limits (coverage_evt_claim_billing), plan refill dates and override codes
      (coverage_evt_refill_too_soon), prior-authorization deadlines and emergency supplies
      (coverage_evt_prior_authorization), transition fills (coverage_evt_transition_fill), appeal windows
      (coverage_evt_appeal), coordination of benefits (coverage_agg_coordination_of_benefits), reversals and cash
      re-billing (coverage_evt_claim_reversal), payment plan notices (coverage_evt_payment_plan_notice) and the
      effect of the plan class on other programs (coverage_program_restrictions); in the ordinary course a plan is
      added, verified and billed, and a rejection leads to its class's resolution route. Adding and updating card
      details, billing, reversing and starting prior authorizations are agent service actions, while filing an appeal
      and taking an active plan off the profile are the patient's own acts, handed over to the patient. Requests no
      charter decides, such as questions about the plan's premiums or medical benefits, or a request that Kestrel
      itself absorb the difference the plan would not pay, are handed off as POLICY_NOT_COVERED.

  - name: copay_assistance_and_discount_cards
    claim:
      categories: [copay]
      event_types: [copay_enrolled, copay_activated, copay_household_updated, copay_suspended, copay_reinstated, copay_cancelled, copay_benefit_applied, copay_benefit_reversed, copay_discount_applied, copay_bridge_fill, copay_membership_fee_charged, copay_membership_fee_refunded]
    summary: >
      Patients call to use a manufacturer copay card, a foundation grant or a bridge program with a prescription, to
      join or leave the Kestrel Rx Savings Club, to ask why a discount did not apply, or to get money back for a
      membership fee or a benefit that should have paid. The setting varies by program type (Kestrel Rx Discount Card
      through Charitable Foundation Copay Grant), by enrollment status and remaining benefit dollars, by the patient's
      coverage class and prior-authorization state for the drug, by several programs held at once, and by the benefit,
      discount and fee history. The governing records are the program enrollments and their activity ledger, read
      together with coverage records, claims and fills, and the rules are shaped by enrollment eligibility gates
      (copay_enrollment_eligibility), activation and term rules (copay_activation_and_term), the benefit formula with
      per-fill caps, minimum patient pay and fill-count caps (copay_evt_benefit_application), benefit periods
      (copay_evt_benefit_period), discount pricing (copay_evt_discount_pricing), bridge supply limits
      (copay_evt_bridge_supply), fee refund windows (copay_evt_membership_fees), suspension and cancellation
      (copay_suspension_and_cancellation) and one-program-per-fill stacking (copay_agg_program_stacking); in the
      ordinary course a program is enrolled, activated, applied fill by fill and closed out at the end of its period.
      Recording enrollments, applying and reversing benefits and discounts, and refunding fees are agent service
      actions, while attesting household income and cancelling a program are the patient's own acts handed over to the
      patient. Requests no charter decides, such as disputing a manufacturer's or foundation's own eligibility decision or asking
      Kestrel to top up a program whose benefit dollars are used up, are handed off as POLICY_NOT_COVERED.

  - name: immunization_appointments
    claim:
      categories: [vax]
      event_types: [vax_course_opened, vax_course_billing_updated, vax_course_cancelled, vax_appointment_booked, vax_appointment_cancelled, vax_appointment_no_show, vax_consent_signed, vax_dose_administered, vax_dose_invalidated]
    summary: >
      Patients and parents call to book, move or cancel a vaccination, to schedule the next dose of a series, to ask
      what a shot will cost, or to sort out a missed appointment or a dose that came too early. The setting varies by
      vaccination (Seasonal Influenza Standard-Dose Vaccination through Hepatitis B Three-Dose Series), by the
      patient's age, attested risk conditions and immunocompromised status, by the season, by the course's status and
      doses remaining, by the coverage class that pays, and by the booking, no-show and dose history across all courses.
      The governing records are the vaccination courses and their event ledger, read together with the patient's
      coverage and savings programs, and the rules are shaped by eligibility and repeat rules
      (vax_course_eligibility), season and same-visit aggregation (vax_agg_visit_and_season), booking windows,
      open-appointment limits and no-show suspension (vax_evt_booking), cancellation cutoffs
      (vax_evt_cancellation_no_show), consent validity and dose intervals with the grace period
      (vax_evt_dose_administration), the billing route order and cash prices (vax_evt_billing) and invalid-dose repeats
      (vax_evt_invalid_dose); in the ordinary course a course is opened, a dose is booked, consented to and given, and a
      series continues dose by dose until complete. Opening courses, booking, cancelling and recording doses and billing
      routes are agent service actions, while signing the screening and consent form and cancelling the whole course
      are the patient's own acts handed over to the patient. Requests no charter decides, such as a vaccine Kestrel does
      not offer, a clinical question about whether the patient should be vaccinated, or a request for in-home
      vaccination, are handed off as POLICY_NOT_COVERED.

  - name: delivery_and_pickup
    claim:
      categories: [delivery]
      event_types: [delivery_plan_enrolled, delivery_plan_details_updated, delivery_plan_cancelled, delivery_order_placed, delivery_order_cancelled, delivery_order_fee_charged, delivery_fee_refunded, delivery_attempt_failed, delivery_returned_to_store]
    summary: >
      Patients call to have prescriptions delivered, to join, switch or cancel a delivery plan, to chase an order that
      is late or never arrived, to arrange a redelivery after a missed attempt, or to dispute a delivery fee. The
      setting varies by delivery plan (Kestrel Pay-Per-Delivery through Kestrel Specialty Courier Service), by plan
      status and billing cycle, by what the order carries (controlled substances, cold-chain items, store items), by
      distance from the store, by the patient's rewards level, and by the order, attempt, fee and refund history. The
      governing records are the delivery plan with its order and fee ledgers, read together with the prescriptions
      being delivered, and the rules are shaped by the open-plan state gate and speed, distance and content limits
      (delivery_evt_order_eligibility), fee rules and waivers (delivery_evt_order_fees), handover and signature rules
      (delivery_evt_handover), failed attempts and returns to store (delivery_evt_failed_attempts), late, lost and
      cancellation refunds with their windows (delivery_evt_refunds), subscription billing and grace
      (delivery_evt_subscription_billing), enrollment and switching (delivery_plan_enrollment) and cancellation timing
      (delivery_plan_cancellation); in the ordinary course a plan is enrolled, orders are placed and delivered, and fees
      are charged per cycle and per order. Placing and cancelling orders, recording attempts and returns, charging and
      refunding fees and updating the plan are agent service actions, while cancelling the plan is the patient's own
      act handed over to the patient. Requests no charter decides, such as reimbursing a patient's own travel to the
      store after a failed delivery or compensating for the value of items beyond the order's fees, are handed off as
      POLICY_NOT_COVERED.
