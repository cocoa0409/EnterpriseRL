events:
  - type: coverage_plan_added
    target: coverage_plans
    mutation: create
    meaning: A prescription insurance plan is added to the patient's profile from the member card details.
    grain: one row per plan added
    fields:
      coverage_id: id of the coverage record
      customer_id: the patient
      variant_name: plan class
      status: pending_verification
      payer_name: payer name as printed on the card
      bin: 6-digit BIN from the card
      pcn: PCN from the card
      group_number: group number from the card
      member_number: member ID from the card
      person_code: 2-digit person code from the card
      cardholder_relationship: self, spouse or dependent
      coverage_order: primary or secondary
      effective_date: plan effective date from the card or eligibility response
      employer_claim_number: injury claim number for workers' compensation, else empty
      opened_date: date added
    triggers: []
  - type: coverage_plan_verified
    target: coverage_plans
    mutation: {transition: {from: pending_verification, to: active}}
    meaning: The plan's eligibility is confirmed and the plan becomes billable.
    grain: one row per transaction
    fields:
      coverage_id: the coverage record verified
      status: active
    triggers: []
  - type: coverage_plan_details_updated
    target: coverage_plans
    mutation: update
    meaning: Card details or the billing order of a plan on file are corrected or replaced by a new card for the same plan.
    grain: one row per transaction
    fields:
      coverage_id: the coverage record updated
      bin: new BIN
      pcn: new PCN
      group_number: new group number
      member_number: new member ID
      person_code: new person code
      coverage_order: new billing order
    triggers: []
  - type: coverage_plan_terminated
    target: coverage_plans
    mutation: {transition: {from: active, to: terminated}}
    meaning: The plan ended on the payer's termination date.
    grain: one row per transaction
    fields:
      coverage_id: the coverage record terminated
      status: terminated
      termination_date: last covered date reported by the payer
      closed_date: the day after termination_date
    triggers: []
  - type: coverage_plan_removed
    target: coverage_plans
    mutation: {transition: [{from: pending_verification, to: removed}, {from: active, to: removed}]}
    meaning: The plan is taken off the profile and no longer billed.
    grain: one row per transaction
    fields:
      coverage_id: the coverage record removed
      status: removed
      closed_date: date removed
    triggers: []
  - type: coverage_claim_paid
    target: coverage_claims
    meaning: A pharmacy claim for a fill is paid by the plan.
    grain: one row per paid claim response
    distinguish_by: [prescription_id, fill_number, event_date, claim_basis]
    fields:
      claim_id: id of this claim
      coverage_id: plan billed
      customer_id: the patient
      event_date: date of service
      prescription_id: prescription billed
      fill_number: fill number billed
      claim_basis: basis on which the claim was submitted
      submission_clarification_code: override code submitted, none when no override
      days_supply_billed: days supply billed
      quantity_billed: quantity billed
      plan_paid_usd: amount the plan paid
      patient_pay_usd: patient pay the plan assigned
      deductible_applied_usd: part of patient pay applied to the deductible
      pa_id: approved prior authorization the claim relies on, else empty
    account: patient_cost_share
    direction: in
    triggers: []
  - type: coverage_claim_rejected
    target: coverage_claims
    meaning: A pharmacy claim for a fill is rejected by the plan.
    grain: one row per rejected claim response
    distinguish_by: [prescription_id, fill_number, event_date, reject_code]
    fields:
      claim_id: id of this claim
      coverage_id: plan billed
      customer_id: the patient
      event_date: date of service
      prescription_id: prescription billed
      fill_number: fill number billed
      claim_basis: basis on which the claim was submitted
      submission_clarification_code: override code submitted, none when no override
      days_supply_billed: days supply billed
      reject_code: reject reason returned by the plan
    triggers:
      - event: coverage:coverage_pa_initiated
        when: {reject_code: prior_authorization_required}
        map: {coverage_id: coverage_id, customer_id: customer_id, prescription_id: prescription_id, event_date: event_date, review_type: standard}
  - type: coverage_claim_reversed
    target: coverage_claims
    meaning: A paid claim is reversed, cancelling the plan payment and the patient pay it assigned.
    grain: one row per paid claim reversed
    distinguish_by: [source_claim_id]
    fields:
      claim_id: id of this reversal
      coverage_id: plan of the claim reversed
      customer_id: the patient
      event_date: date of the reversal
      source_claim_id: the paid claim reversed
      reversal_reason: why the claim was reversed
      patient_pay_usd: patient pay of the claim reversed
    account: patient_cost_share
    direction: out
    triggers: []
  - type: coverage_m3p_notice
    target: coverage_claims
    meaning: Kestrel gives the Medicare Prescription Payment Plan likely-to-benefit notice on a high patient-pay claim.
    grain: one row per notice given
    distinguish_by: [source_claim_id]
    fields:
      claim_id: id of this notice
      coverage_id: plan of the claim
      customer_id: the patient
      event_date: date the notice was given
      source_claim_id: the paid claim that met the threshold
    triggers: []
  - type: coverage_pa_initiated
    target: coverage_prior_auths
    meaning: Kestrel starts a prior authorization request with the plan and the prescriber for a prescription.
    grain: one row per prior authorization request started
    distinguish_by: [prescription_id, event_date]
    fields:
      pa_id: id of this request
      coverage_id: plan asked
      customer_id: the patient
      event_date: date submitted
      prescription_id: prescription the request covers
      review_type: standard or expedited
      submission_channel: channel used
      decision_due_date: date by which the plan must decide
    triggers: []
  - type: coverage_pa_approved
    target: coverage_prior_auths
    meaning: The plan approves a prior authorization request.
    grain: one row per request approved
    distinguish_by: [source_pa_id]
    fields:
      pa_id: id of this decision
      coverage_id: plan
      customer_id: the patient
      event_date: date of approval
      prescription_id: prescription covered
      source_pa_id: the request approved
      approval_end_date: last date the approval covers
    triggers: []
  - type: coverage_pa_denied
    target: coverage_prior_auths
    meaning: The plan denies a prior authorization request.
    grain: one row per request denied
    distinguish_by: [source_pa_id]
    fields:
      pa_id: id of this decision
      coverage_id: plan
      customer_id: the patient
      event_date: date of denial
      prescription_id: prescription concerned
      source_pa_id: the request denied
      denial_reason: reason given by the plan
    triggers: []
  - type: coverage_appeal_filed
    target: coverage_prior_auths
    meaning: The patient files an appeal of a prior authorization denial with the plan.
    grain: one row per appeal filed
    distinguish_by: [source_pa_id]
    fields:
      pa_id: id of this appeal
      coverage_id: plan
      customer_id: the patient
      event_date: date filed
      prescription_id: prescription concerned
      source_pa_id: the denial appealed
      review_type: standard or expedited
      decision_due_date: date by which the plan must decide
    triggers: []
  - type: coverage_appeal_decided
    target: coverage_prior_auths
    meaning: The plan decides an appeal.
    grain: one row per appeal decided
    distinguish_by: [source_pa_id]
    fields:
      pa_id: id of this decision
      coverage_id: plan
      customer_id: the patient
      event_date: date decided
      prescription_id: prescription concerned
      source_pa_id: the appeal decided
      appeal_outcome: overturned or upheld
      approval_end_date: last date covered when overturned, else empty
    triggers: []

measures:
  - id: coverage_msr_plan_year_patient_pay
    window: the current plan year of the coverage record, per its class's plan_year_basis (1 January to 31 December, or effective-date anniversary to the day before the next anniversary)
    measure: sum of patient_pay_usd of coverage_claim_paid rows minus patient_pay_usd of coverage_claim_reversed rows on the coverage record with event_date in the window
  - id: coverage_msr_vacation_overrides_plan_year
    window: the current plan year of the coverage record
    measure: count of coverage_claim_paid rows for the prescription with submission_clarification_code vacation_supply, not reversed, with event_date in the window
  - id: coverage_msr_lost_overrides_plan_year
    window: the current plan year of the coverage record
    measure: count of coverage_claim_paid rows for the prescription with submission_clarification_code lost_or_stolen, not reversed, with event_date in the window
  - id: coverage_msr_courtesy_fills_plan_year
    window: the current plan year of the coverage record
    measure: count of coverage_claim_paid rows for the prescription with days_supply_billed of 34 or less, not reversed, with event_date in the window
  - id: coverage_msr_transition_fills
    window: from the coverage effective_date through effective_date plus transition_window_days
    measure: count of coverage_claim_paid rows for the prescription with claim_basis transition_fill, not reversed

policies:
  - id: coverage_agg_multi_holding
    subject: [coverage_plan_added]
    rule: >-
      A patient may have at most two coverage records in pending_verification or active status at the same time, one
      with coverage_order primary and one with coverage_order secondary; terminated and removed records stay on the
      profile as history and do not count. A third plan is added only after one of the two open records is removed or
      terminated. Two open records never share the same coverage_order.
    eligibility: []
    params:
      max_per_customer: 2
  - id: coverage_agg_coordination_of_benefits
    subject: [coverage_claim_paid, coverage_plan_added, coverage_plan_details_updated]
    rule: >-
      When a patient has two open coverage records, every fill is billed first to the primary and then, for the
      patient pay the primary assigned, to the secondary with claim_basis cob_secondary. A plan class whose
      payer_of_last_resort is true is always the secondary whatever the card says, and the other plan is set primary.
      A secondary claim is billed only where the secondary's cob_secondary_allowed is true and no later than the primary
      claim's date of service plus secondary_billing_window_days. Calendar days are counted with the primary claim's
      date of service as day 0. The patient's final pay is the secondary claim's
      patient pay. A Medicare class and a commercial class held together follow the order the payers report: an
      employer plan of an active employee is primary and the Medicare class secondary, otherwise Medicare is primary.
      A manufacturer copay card or discount program is never a coverage record; it is applied after all coverage
      under the copay charter.
    eligibility:
      - id: secondary_window
        applies_to: [coverage_claim_paid]
        kind: time
        condition: A secondary claim is billed only where the secondary's cob_secondary_allowed is true and no later than the primary claim's date of service plus secondary_billing_window_days.
        evidence_fields: [coverage_claims.event_date, coverage_claims.claim_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [coverage_claims.claim_id]
          action_bindings:
            coverage_claims.claim_id: claim_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the primary claim's date of service
          anchor_source: coverage_claims.event_date
          relation: not_after
          duration_source: variants.secondary_billing_window_days
          unit: calendar_days
          counting_rule: Calendar days are counted with the primary claim's date of service as day 0.
          boundary: inclusive
    params:
      per_tier:
        Medicaid Managed Care Pharmacy Benefit: {cob_secondary_allowed: =cob_secondary_allowed, payer_of_last_resort: =payer_of_last_resort, secondary_billing_window_days: =secondary_billing_window_days}
        Medicare Part D Standard Plan: {cob_secondary_allowed: =cob_secondary_allowed, payer_of_last_resort: =payer_of_last_resort, secondary_billing_window_days: =secondary_billing_window_days}
        Medicare Part D Enhanced Plan: {cob_secondary_allowed: =cob_secondary_allowed, payer_of_last_resort: =payer_of_last_resort, secondary_billing_window_days: =secondary_billing_window_days}
        Medicare Advantage Prescription Drug Plan: {cob_secondary_allowed: =cob_secondary_allowed, payer_of_last_resort: =payer_of_last_resort, secondary_billing_window_days: =secondary_billing_window_days}
        Commercial High-Deductible Health Plan: {cob_secondary_allowed: =cob_secondary_allowed, payer_of_last_resort: =payer_of_last_resort, secondary_billing_window_days: =secondary_billing_window_days}
        Commercial Copay Plan: {cob_secondary_allowed: =cob_secondary_allowed, payer_of_last_resort: =payer_of_last_resort, secondary_billing_window_days: =secondary_billing_window_days}
        Workers' Compensation Pharmacy Benefit: {cob_secondary_allowed: =cob_secondary_allowed, payer_of_last_resort: =payer_of_last_resort, secondary_billing_window_days: =secondary_billing_window_days}
  - id: coverage_plan_intake
    subject: [coverage_plan_added, coverage_plan_verified, coverage_plan_removed]
    rule: >-
      A plan is added from the card details the patient reads out, copied exactly, and starts in pending_verification.
      A dependent is added only where the class's dependents_covered is true and the patient's age in whole years on
      the day of adding is no more than dependent_max_age_years. A workers' compensation plan is added only when the
      patient states the employer's injury claim number where claim_number_required is true. The plan becomes active
      when the payer's eligibility response or a paid claim confirms it. A pending plan whose eligibility is still
      unconfirmed is removed no earlier than the date the plan was added plus the eligibility verification days,
      counted in calendar days with the adding date as day 0. An active plan is taken off the profile only at the
      patient's own request, which the patient confirms themselves; Kestrel never removes an active plan on its own
      initiative.
    eligibility:
      - id: injury_claim_number_stated
        applies_to: [coverage_plan_added]
        kind: caller_fact
        condition: A workers' compensation plan is added only when the patient states the employer's injury claim number where claim_number_required is true.
        evidence_fields: [coverage_plans.employer_claim_number, coverage_plans.customer_id]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys:
            - [coverage_plans.customer_id]
          action_bindings:
            coverage_plans.customer_id: customer_id
      - id: verification_window_elapsed
        applies_to: [coverage_plan_removed]
        kind: time
        condition: A pending plan whose eligibility is still unconfirmed is removed no earlier than the date the plan was added plus the eligibility verification days, counted in calendar days with the adding date as day 0.
        evidence_fields: [coverage_plans.opened_date, coverage_plans.coverage_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [coverage_plans.coverage_id]
          action_bindings:
            coverage_plans.coverage_id: coverage_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the date the plan was added
          anchor_source: coverage_plans.opened_date
          relation: not_before
          duration_source: variants.eligibility_verification_days
          unit: calendar_days
          counting_rule: counted in calendar days with the adding date as day 0
          boundary: inclusive
    params:
      per_tier:
        Medicaid Managed Care Pharmacy Benefit: {dependents_covered: =dependents_covered, dependent_max_age_years: =dependent_max_age_years, claim_number_required: =claim_number_required, eligibility_verification_days: =eligibility_verification_days}
        Medicare Part D Standard Plan: {dependents_covered: =dependents_covered, dependent_max_age_years: =dependent_max_age_years, claim_number_required: =claim_number_required, eligibility_verification_days: =eligibility_verification_days}
        Medicare Part D Enhanced Plan: {dependents_covered: =dependents_covered, dependent_max_age_years: =dependent_max_age_years, claim_number_required: =claim_number_required, eligibility_verification_days: =eligibility_verification_days}
        Medicare Advantage Prescription Drug Plan: {dependents_covered: =dependents_covered, dependent_max_age_years: =dependent_max_age_years, claim_number_required: =claim_number_required, eligibility_verification_days: =eligibility_verification_days}
        Commercial High-Deductible Health Plan: {dependents_covered: =dependents_covered, dependent_max_age_years: =dependent_max_age_years, claim_number_required: =claim_number_required, eligibility_verification_days: =eligibility_verification_days}
        Commercial Copay Plan: {dependents_covered: =dependents_covered, dependent_max_age_years: =dependent_max_age_years, claim_number_required: =claim_number_required, eligibility_verification_days: =eligibility_verification_days}
        Workers' Compensation Pharmacy Benefit: {dependents_covered: =dependents_covered, dependent_max_age_years: =dependent_max_age_years, claim_number_required: =claim_number_required, eligibility_verification_days: =eligibility_verification_days}
  - id: coverage_evt_claim_billing
    subject: [coverage_claim_paid, coverage_claim_rejected]
    rule: >-
      A claim is billed only to a coverage record in active status. A claim bills no more than max_days_supply_per_claim
      and is submitted no later than the date of service plus timely_filing_days. Where maintenance_90_day_mandate is
      true, once coverage_msr_courtesy_fills_plan_year reaches courtesy_30_day_fills for a maintenance prescription the
      next claim must bill a 90-day supply, and a claim for 34 days or less is rejected plan_limits_exceeded. Where
      deductible_phase_applies is true the patient pays the plan's full negotiated price until the deductible is met,
      except that a drug on the plan's preventive list is exempt where preventive_drug_deductible_waiver is true. Where
      brand_dispense_penalty_applies is true and the patient asked for the brand when a generic is available, the patient
      also pays the brand-generic difference; where brand_requires_pa_when_generic_available is true the brand is
      rejected prior_authorization_required instead. Where patient_pay_cap_applies is true the patient never pays more
      than patient_pay_cap_usd per claim, and where dispense_if_copay_unpaid is true a covered fill is dispensed even
      when the patient cannot pay. Where oop_cap_applies is true and coverage_msr_plan_year_patient_pay has reached
      annual_oop_cap_usd, patient pay is 0.00 for the rest of the plan year. The plan year runs by the class's
      plan_year_basis: 1 January to 31 December for calendar_year, or from the coverage effective_date's anniversary to
      the day before the next anniversary for effective_date_anniversary. A specialty prescription is billed through
      Kestrel only where kestrel_specialty_in_network is true, otherwise it is rejected specialty_pharmacy_required and
      the patient may transfer it to the plan's specialty pharmacy. Where injury_related_drugs_only is true only drugs
      for the accepted injury are billed. Every rejection is resolved by the route the class's reject_resolution_map
      gives for its reject_code; a route the Patient Care Desk cannot carry out is explained to the patient, who may pay
      cash or use a discount program where discount_card_in_lieu_allowed is true.
    eligibility:
      - id: bill_active_coverage_only
        applies_to: [coverage_claim_paid, coverage_claim_rejected]
        kind: state
        condition: A claim is billed only to a coverage record in active status.
        evidence_fields: [coverage_plans.status, coverage_plans.coverage_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [coverage_plans.coverage_id]
          action_bindings:
            coverage_plans.coverage_id: coverage_id
        state_contract:
          field: coverage_plans.status
          allowed: [active]
    params:
      per_tier:
        Medicaid Managed Care Pharmacy Benefit: {max_days_supply_per_claim: =max_days_supply_per_claim, maintenance_90_day_mandate: =maintenance_90_day_mandate, courtesy_30_day_fills: =courtesy_30_day_fills, patient_pay_cap_applies: =patient_pay_cap_applies, patient_pay_cap_usd: =patient_pay_cap_usd, oop_cap_applies: =oop_cap_applies, annual_oop_cap_usd: =annual_oop_cap_usd, plan_year_basis: =plan_year_basis}
        Medicare Part D Standard Plan: {max_days_supply_per_claim: =max_days_supply_per_claim, maintenance_90_day_mandate: =maintenance_90_day_mandate, courtesy_30_day_fills: =courtesy_30_day_fills, patient_pay_cap_applies: =patient_pay_cap_applies, patient_pay_cap_usd: =patient_pay_cap_usd, oop_cap_applies: =oop_cap_applies, annual_oop_cap_usd: =annual_oop_cap_usd, plan_year_basis: =plan_year_basis}
        Medicare Part D Enhanced Plan: {max_days_supply_per_claim: =max_days_supply_per_claim, maintenance_90_day_mandate: =maintenance_90_day_mandate, courtesy_30_day_fills: =courtesy_30_day_fills, patient_pay_cap_applies: =patient_pay_cap_applies, patient_pay_cap_usd: =patient_pay_cap_usd, oop_cap_applies: =oop_cap_applies, annual_oop_cap_usd: =annual_oop_cap_usd, plan_year_basis: =plan_year_basis}
        Medicare Advantage Prescription Drug Plan: {max_days_supply_per_claim: =max_days_supply_per_claim, maintenance_90_day_mandate: =maintenance_90_day_mandate, courtesy_30_day_fills: =courtesy_30_day_fills, patient_pay_cap_applies: =patient_pay_cap_applies, patient_pay_cap_usd: =patient_pay_cap_usd, oop_cap_applies: =oop_cap_applies, annual_oop_cap_usd: =annual_oop_cap_usd, plan_year_basis: =plan_year_basis}
        Commercial High-Deductible Health Plan: {max_days_supply_per_claim: =max_days_supply_per_claim, maintenance_90_day_mandate: =maintenance_90_day_mandate, courtesy_30_day_fills: =courtesy_30_day_fills, patient_pay_cap_applies: =patient_pay_cap_applies, patient_pay_cap_usd: =patient_pay_cap_usd, oop_cap_applies: =oop_cap_applies, annual_oop_cap_usd: =annual_oop_cap_usd, plan_year_basis: =plan_year_basis}
        Commercial Copay Plan: {max_days_supply_per_claim: =max_days_supply_per_claim, maintenance_90_day_mandate: =maintenance_90_day_mandate, courtesy_30_day_fills: =courtesy_30_day_fills, patient_pay_cap_applies: =patient_pay_cap_applies, patient_pay_cap_usd: =patient_pay_cap_usd, oop_cap_applies: =oop_cap_applies, annual_oop_cap_usd: =annual_oop_cap_usd, plan_year_basis: =plan_year_basis}
        Workers' Compensation Pharmacy Benefit: {max_days_supply_per_claim: =max_days_supply_per_claim, maintenance_90_day_mandate: =maintenance_90_day_mandate, courtesy_30_day_fills: =courtesy_30_day_fills, patient_pay_cap_applies: =patient_pay_cap_applies, patient_pay_cap_usd: =patient_pay_cap_usd, oop_cap_applies: =oop_cap_applies, annual_oop_cap_usd: =annual_oop_cap_usd, plan_year_basis: =plan_year_basis}
    formula:
      patient_pay_after_cap: min(patient_pay_usd, patient_pay_cap_usd)
    measures: [coverage_msr_courtesy_fills_plan_year, coverage_msr_plan_year_patient_pay]
  - id: coverage_evt_refill_too_soon
    subject: [coverage_claim_paid, coverage_claim_rejected]
    rule: >-
      The plan pays a routine claim for a prescription no earlier than the date of service of the previous paid claim
      for this prescription plus the plan refill days. The plan refill days are the previous paid claim's
      days_supply_billed multiplied by the class's plan_early_refill_threshold_pct and divided by 100, with any fraction
      of a day dropped; the previous date of service is day 0 and calendar days are counted. An earlier claim is
      rejected refill_too_soon unless it carries a submission_clarification_code listed in the class's
      refill_too_soon_override_codes and the override count allows it: vacation_supply while
      coverage_msr_vacation_overrides_plan_year is below vacation_override_per_plan_year, lost_or_stolen while
      coverage_msr_lost_overrides_plan_year is below lost_stolen_override_per_plan_year, and therapy_change where
      therapy_change_override_allowed is true. The plan's date and Kestrel's own refill-eligible date under the
      Prescriptions charter both apply and the later of the two governs a routine refill; a plan override never lets
      Kestrel dispense before its own date unless the Prescriptions charter also allows that early-fill reason.
    eligibility:
      - id: plan_refill_date
        applies_to: [coverage_claim_paid]
        kind: time
        condition: The plan pays a routine claim for a prescription no earlier than the date of service of the previous paid claim for this prescription plus the plan refill days.
        evidence_fields: [coverage_claims.event_date, coverage_claims.days_supply_billed, coverage_claims.prescription_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [coverage_claims.prescription_id]
          action_bindings:
            coverage_claims.prescription_id: prescription_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the date of service of the previous paid claim for this prescription
          anchor_source: coverage_claims.event_date
          relation: not_before
          duration_source: params.plan_early_refill_threshold_pct
          unit: calendar_days
          counting_rule: The plan refill days are the previous paid claim's days_supply_billed multiplied by the class's plan_early_refill_threshold_pct and divided by 100, with any fraction of a day dropped; the previous date of service is day 0 and calendar days are counted.
          boundary: inclusive
    params:
      per_tier:
        Medicaid Managed Care Pharmacy Benefit: {plan_early_refill_threshold_pct: =plan_early_refill_threshold_pct, refill_too_soon_override_codes: =refill_too_soon_override_codes, vacation_override_per_plan_year: =vacation_override_per_plan_year, lost_stolen_override_per_plan_year: =lost_stolen_override_per_plan_year}
        Medicare Part D Standard Plan: {plan_early_refill_threshold_pct: =plan_early_refill_threshold_pct, refill_too_soon_override_codes: =refill_too_soon_override_codes, vacation_override_per_plan_year: =vacation_override_per_plan_year, lost_stolen_override_per_plan_year: =lost_stolen_override_per_plan_year}
        Medicare Part D Enhanced Plan: {plan_early_refill_threshold_pct: =plan_early_refill_threshold_pct, refill_too_soon_override_codes: =refill_too_soon_override_codes, vacation_override_per_plan_year: =vacation_override_per_plan_year, lost_stolen_override_per_plan_year: =lost_stolen_override_per_plan_year}
        Medicare Advantage Prescription Drug Plan: {plan_early_refill_threshold_pct: =plan_early_refill_threshold_pct, refill_too_soon_override_codes: =refill_too_soon_override_codes, vacation_override_per_plan_year: =vacation_override_per_plan_year, lost_stolen_override_per_plan_year: =lost_stolen_override_per_plan_year}
        Commercial High-Deductible Health Plan: {plan_early_refill_threshold_pct: =plan_early_refill_threshold_pct, refill_too_soon_override_codes: =refill_too_soon_override_codes, vacation_override_per_plan_year: =vacation_override_per_plan_year, lost_stolen_override_per_plan_year: =lost_stolen_override_per_plan_year}
        Commercial Copay Plan: {plan_early_refill_threshold_pct: =plan_early_refill_threshold_pct, refill_too_soon_override_codes: =refill_too_soon_override_codes, vacation_override_per_plan_year: =vacation_override_per_plan_year, lost_stolen_override_per_plan_year: =lost_stolen_override_per_plan_year}
        Workers' Compensation Pharmacy Benefit: {plan_early_refill_threshold_pct: =plan_early_refill_threshold_pct, refill_too_soon_override_codes: =refill_too_soon_override_codes, vacation_override_per_plan_year: =vacation_override_per_plan_year, lost_stolen_override_per_plan_year: =lost_stolen_override_per_plan_year}
    formula:
      plan_refill_days: days_supply_billed * plan_early_refill_threshold_pct / 100
    measures: [coverage_msr_vacation_overrides_plan_year, coverage_msr_lost_overrides_plan_year]
  - id: coverage_evt_prior_authorization
    subject: [coverage_pa_initiated, coverage_pa_approved, coverage_pa_denied, coverage_claim_paid]
    rule: >-
      A claim rejected prior_authorization_required starts a prior authorization request the same day through the class's
      pa_submission_channel. A prescription has at most one open request per coverage record: a new request is started
      only when no earlier request for the same prescription and coverage is still waiting for a decision. The request is
      expedited only when the prescriber attests that waiting could seriously jeopardize the patient's health; otherwise
      it is standard. Its decision_due_date is the submission date plus pa_standard_decision_hours, or plus
      pa_expedited_decision_hours when expedited, counted in elapsed hours from the submission and rounded up to the
      calendar date on which the last hour falls. While a request is waiting, a plan whose pa_emergency_supply_days is
      above 0 pays one emergency supply of up to that many days with claim_basis emergency_pa_supply. An approval covers
      claims for that prescription on that coverage from its approval date to its approval_end_date, which is the
      approval date plus pa_approval_default_months unless the plan states another date; claims under it carry the
      pa_id and claim_basis pa_approved. A renewal request is started no earlier than pa_renewal_lead_days before the
      approval_end_date. A denial ends the request; the patient may then pay cash, use a discount program where allowed,
      or appeal under coverage_evt_appeal. Kestrel never tells a patient that a request will be approved.
    eligibility:
      - id: one_open_request
        applies_to: [coverage_pa_initiated]
        kind: dedup
        condition: "A prescription has at most one open request per coverage record: a new request is started only when no earlier request for the same prescription and coverage is still waiting for a decision."
        evidence_fields: [coverage_prior_auths.prescription_id, coverage_prior_auths.coverage_id, coverage_prior_auths.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [coverage_prior_auths.prescription_id, coverage_prior_auths.coverage_id]
          action_bindings:
            coverage_prior_auths.prescription_id: prescription_id
            coverage_prior_auths.coverage_id: coverage_id
        dedup_contract:
          table: coverage_prior_auths
          mode: separate_record
          object_bindings: {prescription_id: prescription_id, coverage_id: coverage_id}
          duplicate_filters: {event_type: [coverage_pa_initiated]}
          distinct_fields: [event_date]
    params:
      per_tier:
        Medicaid Managed Care Pharmacy Benefit: {pa_submission_channel: =pa_submission_channel, pa_standard_decision_hours: =pa_standard_decision_hours, pa_expedited_decision_hours: =pa_expedited_decision_hours, pa_emergency_supply_days: =pa_emergency_supply_days, pa_approval_default_months: =pa_approval_default_months, pa_renewal_lead_days: =pa_renewal_lead_days}
        Medicare Part D Standard Plan: {pa_submission_channel: =pa_submission_channel, pa_standard_decision_hours: =pa_standard_decision_hours, pa_expedited_decision_hours: =pa_expedited_decision_hours, pa_emergency_supply_days: =pa_emergency_supply_days, pa_approval_default_months: =pa_approval_default_months, pa_renewal_lead_days: =pa_renewal_lead_days}
        Medicare Part D Enhanced Plan: {pa_submission_channel: =pa_submission_channel, pa_standard_decision_hours: =pa_standard_decision_hours, pa_expedited_decision_hours: =pa_expedited_decision_hours, pa_emergency_supply_days: =pa_emergency_supply_days, pa_approval_default_months: =pa_approval_default_months, pa_renewal_lead_days: =pa_renewal_lead_days}
        Medicare Advantage Prescription Drug Plan: {pa_submission_channel: =pa_submission_channel, pa_standard_decision_hours: =pa_standard_decision_hours, pa_expedited_decision_hours: =pa_expedited_decision_hours, pa_emergency_supply_days: =pa_emergency_supply_days, pa_approval_default_months: =pa_approval_default_months, pa_renewal_lead_days: =pa_renewal_lead_days}
        Commercial High-Deductible Health Plan: {pa_submission_channel: =pa_submission_channel, pa_standard_decision_hours: =pa_standard_decision_hours, pa_expedited_decision_hours: =pa_expedited_decision_hours, pa_emergency_supply_days: =pa_emergency_supply_days, pa_approval_default_months: =pa_approval_default_months, pa_renewal_lead_days: =pa_renewal_lead_days}
        Commercial Copay Plan: {pa_submission_channel: =pa_submission_channel, pa_standard_decision_hours: =pa_standard_decision_hours, pa_expedited_decision_hours: =pa_expedited_decision_hours, pa_emergency_supply_days: =pa_emergency_supply_days, pa_approval_default_months: =pa_approval_default_months, pa_renewal_lead_days: =pa_renewal_lead_days}
        Workers' Compensation Pharmacy Benefit: {pa_submission_channel: =pa_submission_channel, pa_standard_decision_hours: =pa_standard_decision_hours, pa_expedited_decision_hours: =pa_expedited_decision_hours, pa_emergency_supply_days: =pa_emergency_supply_days, pa_approval_default_months: =pa_approval_default_months, pa_renewal_lead_days: =pa_renewal_lead_days}
  - id: coverage_evt_transition_fill
    subject: [coverage_claim_paid]
    rule: >-
      Where transition_fill_allowed is true, a drug the patient was already taking that the plan rejects
      product_not_covered or prior_authorization_required is paid once per prescription as a transition fill with
      claim_basis transition_fill and a days supply of at most transition_fill_days_supply. A transition fill is billed
      no later than the plan's effective date plus the transition window days, counted in calendar days with the
      effective date as day 0. Only one transition fill is paid per prescription, measured by
      coverage_msr_transition_fills. A transition fill gives the patient time to switch drugs or obtain a prior
      authorization and is never repeated when the window ends. Where the class's first_fill_before_acceptance_days is
      above 0, the first fill after an injury is paid for up to that many days with claim_basis first_fill before the
      injury claim is accepted.
    eligibility:
      - id: within_transition_window
        applies_to: [coverage_claim_paid]
        kind: time
        condition: A transition fill is billed no later than the plan's effective date plus the transition window days, counted in calendar days with the effective date as day 0.
        evidence_fields: [coverage_plans.effective_date, coverage_plans.coverage_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [coverage_plans.coverage_id]
          action_bindings:
            coverage_plans.coverage_id: coverage_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the plan's effective date
          anchor_source: coverage_plans.effective_date
          relation: not_after
          duration_source: params.transition_window_days
          unit: calendar_days
          counting_rule: counted in calendar days with the effective date as day 0
          boundary: inclusive
    params:
      per_tier:
        Medicaid Managed Care Pharmacy Benefit: {transition_fill_allowed: =transition_fill_allowed, transition_fill_days_supply: =transition_fill_days_supply, transition_window_days: =transition_window_days, first_fill_before_acceptance_days: =first_fill_before_acceptance_days}
        Medicare Part D Standard Plan: {transition_fill_allowed: =transition_fill_allowed, transition_fill_days_supply: =transition_fill_days_supply, transition_window_days: =transition_window_days, first_fill_before_acceptance_days: =first_fill_before_acceptance_days}
        Medicare Part D Enhanced Plan: {transition_fill_allowed: =transition_fill_allowed, transition_fill_days_supply: =transition_fill_days_supply, transition_window_days: =transition_window_days, first_fill_before_acceptance_days: =first_fill_before_acceptance_days}
        Medicare Advantage Prescription Drug Plan: {transition_fill_allowed: =transition_fill_allowed, transition_fill_days_supply: =transition_fill_days_supply, transition_window_days: =transition_window_days, first_fill_before_acceptance_days: =first_fill_before_acceptance_days}
        Commercial High-Deductible Health Plan: {transition_fill_allowed: =transition_fill_allowed, transition_fill_days_supply: =transition_fill_days_supply, transition_window_days: =transition_window_days, first_fill_before_acceptance_days: =first_fill_before_acceptance_days}
        Commercial Copay Plan: {transition_fill_allowed: =transition_fill_allowed, transition_fill_days_supply: =transition_fill_days_supply, transition_window_days: =transition_window_days, first_fill_before_acceptance_days: =first_fill_before_acceptance_days}
        Workers' Compensation Pharmacy Benefit: {transition_fill_allowed: =transition_fill_allowed, transition_fill_days_supply: =transition_fill_days_supply, transition_window_days: =transition_window_days, first_fill_before_acceptance_days: =first_fill_before_acceptance_days}
    measures: [coverage_msr_transition_fills]
  - id: coverage_evt_appeal
    subject: [coverage_appeal_filed, coverage_appeal_decided]
    rule: >-
      An appeal is the patient's own request to the plan and is filed only by the patient, never by Kestrel on the
      patient's behalf. An appeal of a denial is filed no later than the date the plan denied the prior authorization
      plus the appeal filing window days, counted in calendar days with the denial date as day 0. One appeal is filed
      per denial. Its decision_due_date is the filing date plus appeal_decision_standard_days, or, when the prescriber
      attests urgency, the filing moment plus appeal_decision_expedited_hours rounded up to the calendar date on which
      the last hour falls. An overturned appeal is recorded with its approval_end_date and claims then follow the
      approval rules of coverage_evt_prior_authorization; an upheld denial is final at the Patient Care Desk and any
      further review is between the patient and the plan.
    eligibility:
      - id: within_appeal_window
        applies_to: [coverage_appeal_filed]
        kind: time
        condition: An appeal of a denial is filed no later than the date the plan denied the prior authorization plus the appeal filing window days, counted in calendar days with the denial date as day 0.
        evidence_fields: [coverage_prior_auths.event_date, coverage_prior_auths.pa_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [coverage_prior_auths.pa_id]
          action_bindings:
            coverage_prior_auths.pa_id: source_pa_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the date the plan denied the prior authorization
          anchor_source: coverage_prior_auths.event_date
          relation: not_after
          duration_source: params.appeal_filing_window_days
          unit: calendar_days
          counting_rule: counted in calendar days with the denial date as day 0
          boundary: inclusive
      - id: one_appeal_per_denial
        applies_to: [coverage_appeal_filed]
        kind: dedup
        condition: One appeal is filed per denial.
        evidence_fields: [coverage_prior_auths.source_pa_id, coverage_prior_auths.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [coverage_prior_auths.source_pa_id]
          action_bindings:
            coverage_prior_auths.source_pa_id: source_pa_id
        dedup_contract:
          table: coverage_prior_auths
          mode: separate_record
          object_bindings: {source_pa_id: source_pa_id}
          duplicate_filters: {event_type: [coverage_appeal_filed]}
          distinct_fields: []
    params:
      per_tier:
        Medicaid Managed Care Pharmacy Benefit: {appeal_filing_window_days: =appeal_filing_window_days, appeal_decision_standard_days: =appeal_decision_standard_days, appeal_decision_expedited_hours: =appeal_decision_expedited_hours}
        Medicare Part D Standard Plan: {appeal_filing_window_days: =appeal_filing_window_days, appeal_decision_standard_days: =appeal_decision_standard_days, appeal_decision_expedited_hours: =appeal_decision_expedited_hours}
        Medicare Part D Enhanced Plan: {appeal_filing_window_days: =appeal_filing_window_days, appeal_decision_standard_days: =appeal_decision_standard_days, appeal_decision_expedited_hours: =appeal_decision_expedited_hours}
        Medicare Advantage Prescription Drug Plan: {appeal_filing_window_days: =appeal_filing_window_days, appeal_decision_standard_days: =appeal_decision_standard_days, appeal_decision_expedited_hours: =appeal_decision_expedited_hours}
        Commercial High-Deductible Health Plan: {appeal_filing_window_days: =appeal_filing_window_days, appeal_decision_standard_days: =appeal_decision_standard_days, appeal_decision_expedited_hours: =appeal_decision_expedited_hours}
        Commercial Copay Plan: {appeal_filing_window_days: =appeal_filing_window_days, appeal_decision_standard_days: =appeal_decision_standard_days, appeal_decision_expedited_hours: =appeal_decision_expedited_hours}
        Workers' Compensation Pharmacy Benefit: {appeal_filing_window_days: =appeal_filing_window_days, appeal_decision_standard_days: =appeal_decision_standard_days, appeal_decision_expedited_hours: =appeal_decision_expedited_hours}
  - id: coverage_evt_claim_reversal
    subject: [coverage_claim_reversed, coverage_claim_paid]
    rule: >-
      A paid claim whose fill is not picked up is reversed when the fill is returned to stock, and in any case the
      reversal is recorded no later than the date of service plus claim_reversal_deadline_days; a fill still in will-call
      on that day is returned to stock first. A paid claim is also reversed when its fill is confirmed as a dispensing
      error, or to correct a billing mistake. Each paid claim is reversed at most once and the reversal books back
      exactly its patient_pay_usd. A fill the patient paid in cash is re-billed to a coverage record added afterwards
      only when the fill is re-billed no later than the date the cash fill was dispensed plus the cash rebill window
      days, counted in calendar days with the fill date as day 0; the re-billed claim carries claim_basis retro_rebill
      and the patient is refunded the difference between the cash paid and the new patient pay by the original payment
      method.
    eligibility:
      - id: one_reversal_per_claim
        applies_to: [coverage_claim_reversed]
        kind: dedup
        condition: Each paid claim is reversed at most once and the reversal books back exactly its patient_pay_usd.
        evidence_fields: [coverage_claims.source_claim_id, coverage_claims.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [coverage_claims.source_claim_id]
          action_bindings:
            coverage_claims.source_claim_id: source_claim_id
        dedup_contract:
          table: coverage_claims
          mode: separate_record
          object_bindings: {source_claim_id: source_claim_id}
          duplicate_filters: {event_type: [coverage_claim_reversed]}
          distinct_fields: []
      - id: cash_rebill_window
        applies_to: [coverage_claim_paid]
        kind: time
        condition: A fill the patient paid in cash is re-billed to a coverage record added afterwards only when the fill is re-billed no later than the date the cash fill was dispensed plus the cash rebill window days, counted in calendar days with the fill date as day 0; the re-billed claim carries claim_basis retro_rebill and the patient is refunded the difference between the cash paid and the new patient pay by the original payment method.
        evidence_fields: [rx_fills.event_date, rx_fills.fill_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rx_fills.fill_id]
          action_bindings:
            rx_fills.fill_id: fill_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the date the cash fill was dispensed
          anchor_source: rx_fills.event_date
          relation: not_after
          duration_source: params.cash_rebill_window_days
          unit: calendar_days
          counting_rule: counted in calendar days with the fill date as day 0
          boundary: inclusive
    params:
      per_tier:
        Medicaid Managed Care Pharmacy Benefit: {claim_reversal_deadline_days: =claim_reversal_deadline_days, cash_rebill_window_days: =cash_rebill_window_days}
        Medicare Part D Standard Plan: {claim_reversal_deadline_days: =claim_reversal_deadline_days, cash_rebill_window_days: =cash_rebill_window_days}
        Medicare Part D Enhanced Plan: {claim_reversal_deadline_days: =claim_reversal_deadline_days, cash_rebill_window_days: =cash_rebill_window_days}
        Medicare Advantage Prescription Drug Plan: {claim_reversal_deadline_days: =claim_reversal_deadline_days, cash_rebill_window_days: =cash_rebill_window_days}
        Commercial High-Deductible Health Plan: {claim_reversal_deadline_days: =claim_reversal_deadline_days, cash_rebill_window_days: =cash_rebill_window_days}
        Commercial Copay Plan: {claim_reversal_deadline_days: =claim_reversal_deadline_days, cash_rebill_window_days: =cash_rebill_window_days}
        Workers' Compensation Pharmacy Benefit: {claim_reversal_deadline_days: =claim_reversal_deadline_days, cash_rebill_window_days: =cash_rebill_window_days}
  - id: coverage_evt_payment_plan_notice
    subject: [coverage_m3p_notice]
    rule: >-
      Where m3p_available is true, Kestrel gives the Medicare Prescription Payment Plan likely-to-benefit notice when a
      single paid claim's patient_pay_usd is at or above m3p_notice_threshold_usd. The notice is given once per such
      claim, on the date of service or, for a claim found later, on the day it is found. The notice only informs the
      patient; enrolling in the payment plan is done by the patient with the plan, and Kestrel still collects the
      claim's patient pay unless the plan reports the patient as enrolled. No notice is given for classes where
      m3p_available is false.
    eligibility:
      - id: one_notice_per_claim
        applies_to: [coverage_m3p_notice]
        kind: dedup
        condition: The notice is given once per such claim, on the date of service or, for a claim found later, on the day it is found.
        evidence_fields: [coverage_claims.source_claim_id, coverage_claims.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [coverage_claims.source_claim_id]
          action_bindings:
            coverage_claims.source_claim_id: source_claim_id
        dedup_contract:
          table: coverage_claims
          mode: separate_record
          object_bindings: {source_claim_id: source_claim_id}
          duplicate_filters: {event_type: [coverage_m3p_notice]}
          distinct_fields: []
    params:
      per_tier:
        Medicaid Managed Care Pharmacy Benefit: {m3p_available: =m3p_available, m3p_notice_threshold_usd: =m3p_notice_threshold_usd}
        Medicare Part D Standard Plan: {m3p_available: =m3p_available, m3p_notice_threshold_usd: =m3p_notice_threshold_usd}
        Medicare Part D Enhanced Plan: {m3p_available: =m3p_available, m3p_notice_threshold_usd: =m3p_notice_threshold_usd}
        Medicare Advantage Prescription Drug Plan: {m3p_available: =m3p_available, m3p_notice_threshold_usd: =m3p_notice_threshold_usd}
        Commercial High-Deductible Health Plan: {m3p_available: =m3p_available, m3p_notice_threshold_usd: =m3p_notice_threshold_usd}
        Commercial Copay Plan: {m3p_available: =m3p_available, m3p_notice_threshold_usd: =m3p_notice_threshold_usd}
        Workers' Compensation Pharmacy Benefit: {m3p_available: =m3p_available, m3p_notice_threshold_usd: =m3p_notice_threshold_usd}
  - id: coverage_program_restrictions
    subject: [coverage_claim_paid, coverage_claim_rejected]
    rule: >-
      The plan class on file changes what other Kestrel programs may do for the same fill. Where government_program is
      true, no manufacturer copay card is applied to a claim billed to that plan, and where
      manufacturer_copay_card_allowed is false the copay charter treats the fill as ineligible for card benefits. Where
      rx_rewards_points_allowed is false, fills billed to that plan earn no rewards points under the rewards charter. Where
      discount_card_in_lieu_allowed is true the patient may choose, before the claim is billed, to pay through a Kestrel
      discount program instead; that fill is then not billed to the plan at all, and its cost does not count toward the
      plan's deductible or out-of-pocket totals. Where discount_card_in_lieu_allowed is false the covered fill is always
      billed to the plan. Where dur_override_allowed_at_pharmacy is true a dur_reject may be resubmitted with claim_basis
      dur_override after the pharmacist reviews it; otherwise the prescriber must clarify.
    eligibility: []
    params:
      per_tier:
        Medicaid Managed Care Pharmacy Benefit: {government_program: =government_program, manufacturer_copay_card_allowed: =manufacturer_copay_card_allowed, rx_rewards_points_allowed: =rx_rewards_points_allowed, discount_card_in_lieu_allowed: =discount_card_in_lieu_allowed, dur_override_allowed_at_pharmacy: =dur_override_allowed_at_pharmacy}
        Medicare Part D Standard Plan: {government_program: =government_program, manufacturer_copay_card_allowed: =manufacturer_copay_card_allowed, rx_rewards_points_allowed: =rx_rewards_points_allowed, discount_card_in_lieu_allowed: =discount_card_in_lieu_allowed, dur_override_allowed_at_pharmacy: =dur_override_allowed_at_pharmacy}
        Medicare Part D Enhanced Plan: {government_program: =government_program, manufacturer_copay_card_allowed: =manufacturer_copay_card_allowed, rx_rewards_points_allowed: =rx_rewards_points_allowed, discount_card_in_lieu_allowed: =discount_card_in_lieu_allowed, dur_override_allowed_at_pharmacy: =dur_override_allowed_at_pharmacy}
        Medicare Advantage Prescription Drug Plan: {government_program: =government_program, manufacturer_copay_card_allowed: =manufacturer_copay_card_allowed, rx_rewards_points_allowed: =rx_rewards_points_allowed, discount_card_in_lieu_allowed: =discount_card_in_lieu_allowed, dur_override_allowed_at_pharmacy: =dur_override_allowed_at_pharmacy}
        Commercial High-Deductible Health Plan: {government_program: =government_program, manufacturer_copay_card_allowed: =manufacturer_copay_card_allowed, rx_rewards_points_allowed: =rx_rewards_points_allowed, discount_card_in_lieu_allowed: =discount_card_in_lieu_allowed, dur_override_allowed_at_pharmacy: =dur_override_allowed_at_pharmacy}
        Commercial Copay Plan: {government_program: =government_program, manufacturer_copay_card_allowed: =manufacturer_copay_card_allowed, rx_rewards_points_allowed: =rx_rewards_points_allowed, discount_card_in_lieu_allowed: =discount_card_in_lieu_allowed, dur_override_allowed_at_pharmacy: =dur_override_allowed_at_pharmacy}
        Workers' Compensation Pharmacy Benefit: {government_program: =government_program, manufacturer_copay_card_allowed: =manufacturer_copay_card_allowed, rx_rewards_points_allowed: =rx_rewards_points_allowed, discount_card_in_lieu_allowed: =discount_card_in_lieu_allowed, dur_override_allowed_at_pharmacy: =dur_override_allowed_at_pharmacy}
  - id: coverage_plan_termination
    subject: [coverage_plan_terminated, coverage_plan_removed, coverage_plan_details_updated]
    rule: >-
      A plan is terminated on the day after the termination date the payer reports; claims with a date of service after
      the termination date are rejected patient_not_covered and the patient is asked for their new coverage, which is
      added as a new coverage record rather than written over the old one. A new card for the same plan and member only
      updates the card details of the existing record. Changing coverage_order is an update of the record and must keep
      no two open records with the same order. Paid claims before termination stay as they are; a claim paid in error
      after termination is reversed under coverage_evt_claim_reversal and re-billed.
    eligibility: []
