events:
  - type: delivery_plan_enrolled
    target: delivery_plans
    mutation: create
    meaning: The patient enrolls in a delivery plan.
    grain: one row per plan enrollment
    fields:
      delivery_plan_id: id of the plan
      customer_id: the patient
      variant_name: delivery plan
      status: enrolled
      delivery_address: delivery street address as the patient states it
      delivery_zip: 5-digit delivery ZIP code
      store_id: fulfilling store
      trial_end_date: enrollment date plus trial_days, the enrollment date itself when trial_days is 0
      opened_date: date of enrollment
    triggers: []
  - type: delivery_plan_activated
    target: delivery_plans
    mutation: {transition: {from: enrolled, to: active}}
    meaning: The plan leaves its trial and becomes a paying or standing plan.
    grain: one row per transaction
    fields:
      delivery_plan_id: the plan
      variant_name: delivery plan (read, not changed)
      status: active
      cycle_start_date: first day of the first billing cycle
      cycle_end_date: last day of the first billing cycle
    triggers:
      - event: delivery:delivery_subscription_charged
        when: {variant_name: [Kestrel Delivery Pass Monthly, Kestrel Senior Delivery Pass, Kestrel Delivery Pass Annual]}
        map: {delivery_plan_id: delivery_plan_id, cycle_start_date: cycle_start_date, fee_type: subscription}
  - type: delivery_plan_renewed
    target: delivery_plans
    mutation: update
    meaning: A subscription plan starts a new billing cycle.
    grain: one row per transaction
    fields:
      delivery_plan_id: the plan
      cycle_start_date: first day of the new cycle
      cycle_end_date: last day of the new cycle
    triggers:
      - event: delivery:delivery_subscription_charged
        map: {delivery_plan_id: delivery_plan_id, cycle_start_date: cycle_start_date, fee_type: subscription}
  - type: delivery_plan_details_updated
    target: delivery_plans
    mutation: update
    meaning: The delivery address, fulfilling store or plan of an enrolled or active plan is changed.
    grain: one row per transaction
    fields:
      delivery_plan_id: the plan
      variant_name: new delivery plan when switching
      delivery_address: new delivery street address
      delivery_zip: new delivery ZIP code
      store_id: new fulfilling store
    triggers: []
  - type: delivery_plan_past_due
    target: delivery_plans
    mutation: {transition: {from: active, to: past_due}}
    meaning: A subscription fee could not be collected.
    grain: one row per transaction
    fields:
      delivery_plan_id: the plan
      status: past_due
      past_due_since: date the charge failed
    triggers: []
  - type: delivery_plan_recovered
    target: delivery_plans
    mutation: {transition: {from: past_due, to: active}}
    meaning: The overdue fee is collected and the plan is back in good standing.
    grain: one row per transaction
    fields:
      delivery_plan_id: the plan
      status: active
      past_due_since: cleared
    triggers: []
  - type: delivery_plan_lapsed
    target: delivery_plans
    mutation: {transition: {from: past_due, to: cancelled}}
    meaning: The plan ends because the overdue fee was not paid within the grace period.
    grain: one row per transaction
    fields:
      delivery_plan_id: the plan
      status: cancelled
      closed_date: date the plan ended
    triggers: []
  - type: delivery_plan_cancelled
    target: delivery_plans
    mutation: {transition: [{from: enrolled, to: cancelled}, {from: active, to: cancelled}]}
    meaning: The patient cancels the plan.
    grain: one row per transaction
    fields:
      delivery_plan_id: the plan
      status: cancelled
      cancellation_effective_date: date the cancellation takes effect
      closed_date: date the plan ended
    triggers: []
  - type: delivery_order_placed
    target: delivery_orders
    meaning: A delivery order for dispensed prescriptions, with any store items, is placed for a date and speed.
    grain: one row per order
    distinguish_by: [scheduled_date, speed, source_order_id]
    fields:
      order_id: id of the order
      delivery_plan_id: the plan
      customer_id: the patient
      event_date: date the order was placed
      speed: delivery speed chosen
      scheduled_date: date the order is to be delivered
      promised_window_end: end of the promised delivery window, store local time
      order_value_usd: value of the order's items
      includes_controlled: whether the order carries a controlled-substance prescription
      includes_cold_chain: whether the order carries a temperature-controlled item
      includes_front_store: whether store items are included
      distance_miles: road distance from the fulfilling store
      carrier: who carries the order
      source_order_id: the failed order this redelivery replaces, empty for a first order
      store_id: fulfilling store
    triggers: []
  - type: delivery_attempt_failed
    target: delivery_orders
    meaning: A delivery attempt fails.
    grain: one row per failed attempt
    distinguish_by: [source_order_id, attempt_number]
    fields:
      order_id: id of this attempt record
      delivery_plan_id: the plan
      customer_id: the patient
      event_date: date of the attempt
      source_order_id: the order attempted
      attempt_number: attempt sequence on the order
      failure_reason: why the attempt failed
    triggers: []
  - type: delivery_completed
    target: delivery_orders
    meaning: An order is handed over or left at the door.
    grain: one row per order delivered
    distinguish_by: [source_order_id]
    fields:
      order_id: id of this delivery record
      delivery_plan_id: the plan
      customer_id: the patient
      event_date: date delivered
      source_order_id: the order delivered
      delivered_time: time delivered, store local time
      handover: how the order was handed over
    triggers: []
  - type: delivery_order_cancelled
    target: delivery_orders
    meaning: An order is cancelled before it is dispatched.
    grain: one row per order cancelled
    distinguish_by: [source_order_id]
    fields:
      order_id: id of this cancellation
      delivery_plan_id: the plan
      customer_id: the patient
      event_date: date cancelled
      source_order_id: the order cancelled
      cancel_reason: why it was cancelled
    triggers: []
  - type: delivery_returned_to_store
    target: delivery_orders
    meaning: An order that could not be delivered goes back to the fulfilling store for pickup.
    grain: one row per order returned
    distinguish_by: [source_order_id]
    fields:
      order_id: id of this return
      delivery_plan_id: the plan
      customer_id: the patient
      event_date: date returned to the store
      source_order_id: the order returned
      store_id: store holding the returned order
    triggers: []
  - type: delivery_subscription_charged
    target: delivery_charges
    meaning: The subscription fee for a billing cycle is charged.
    grain: one row per billing cycle charged
    distinguish_by: [cycle_start_date]
    fields:
      charge_id: id of this charge
      delivery_plan_id: the plan
      customer_id: the patient
      event_date: date charged
      fee_type: subscription
      cycle_start_date: first day of the cycle paid for
      amount_usd: fee charged
    account: delivery_fees
    direction: in
    triggers: []
  - type: delivery_order_fee_charged
    target: delivery_charges
    meaning: A fee is charged on one order.
    grain: one row per fee type per order
    distinguish_by: [source_order_id, fee_type]
    fields:
      charge_id: id of this charge
      delivery_plan_id: the plan
      customer_id: the patient
      event_date: date charged
      source_order_id: the order the fee is for
      fee_type: same_day_fee, express_fee, extended_radius_fee or redelivery_fee
      amount_usd: fee charged
    account: delivery_fees
    direction: in
    triggers: []
  - type: delivery_fee_refunded
    target: delivery_charges
    meaning: A subscription or order fee is refunded.
    grain: one row per fee refunded
    distinguish_by: [source_charge_id]
    fields:
      charge_id: id of this refund
      delivery_plan_id: the plan
      customer_id: the patient
      event_date: date refunded
      source_charge_id: the fee refunded
      source_order_id: the order concerned, empty for a subscription refund
      refund_reason: why the fee was refunded
      amount_usd: amount refunded
    account: delivery_fees
    direction: out
    triggers: []

measures:
  - id: delivery_msr_free_express_month
    window: the calendar month of the order's scheduled_date
    measure: count of delivery_order_placed rows on the plan with speed express_1hr and no express_fee delivery_order_fee_charged row, excluding cancelled orders
  - id: delivery_msr_late_refunds_cycle
    window: the current billing cycle of the plan, or the calendar month for plans without a subscription
    measure: count of delivery_fee_refunded rows on the plan with refund_reason late_delivery and event_date in the window
  - id: delivery_msr_rush_orders_day
    window: the calendar day of the order's scheduled_date
    measure: count of delivery_order_placed rows of the patient with speed same_day or express_1hr and that scheduled_date, excluding cancelled orders
  - id: delivery_msr_failed_attempts
    window: all history of the order
    measure: count of delivery_attempt_failed rows whose source_order_id is the order, together with those of the redelivery orders that replace it

policies:
  - id: delivery_agg_multi_holding
    subject: [delivery_plan_enrolled]
    rule: >-
      A patient holds at most one delivery plan in enrolled, active or past_due status. A patient who wants a different
      plan switches the existing one where plan_switch_allowed is true, rather than enrolling a second plan; a cancelled
      plan stays on the profile as history.
    eligibility: []
    params:
      max_per_customer: 1
  - id: delivery_plan_enrollment
    subject: [delivery_plan_enrolled, delivery_plan_details_updated]
    rule: >-
      The enrolling patient must be at least min_age_years old on the enrollment date. For a courier plan the delivery
      address must lie within extended_radius_miles of the fulfilling store; a mail plan delivers to any US address. The
      Kestrel Specialty Courier Service is enrolled only for a patient with a Specialty Limited-Distribution Prescription
      in received or active status. The delivery address is recorded exactly as the patient states it. A plan switch is
      an update of the same plan, allowed only where the current plan's plan_switch_allowed is true and the plan is in
      enrolled or active status; a switch to a subscription plan starts that plan's billing on the switch date with no
      new trial when the patient has had a trial before, and a switch from the annual pass refunds under
      delivery_evt_refunds as a cancellation would.
    eligibility:
      - id: specialty_prescription_held
        applies_to: [delivery_plan_enrolled]
        kind: state
        condition: The Kestrel Specialty Courier Service is enrolled only for a patient with a Specialty Limited-Distribution Prescription in received or active status.
        evidence_fields: [rx_prescriptions.status, rx_prescriptions.variant_name, rx_prescriptions.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rx_prescriptions.customer_id]
          action_bindings:
            rx_prescriptions.customer_id: customer_id
        state_contract:
          field: rx_prescriptions.status
          allowed: [received, active]
    params:
      per_tier:
        Kestrel Pay-Per-Delivery: {min_age_years: =min_age_years, extended_radius_miles: =extended_radius_miles, plan_switch_allowed: =plan_switch_allowed}
        Kestrel Mail Delivery: {min_age_years: =min_age_years, extended_radius_miles: =extended_radius_miles, plan_switch_allowed: =plan_switch_allowed}
        Kestrel Delivery Pass Monthly: {min_age_years: =min_age_years, extended_radius_miles: =extended_radius_miles, plan_switch_allowed: =plan_switch_allowed}
        Kestrel Senior Delivery Pass: {min_age_years: =min_age_years, extended_radius_miles: =extended_radius_miles, plan_switch_allowed: =plan_switch_allowed}
        Kestrel Delivery Pass Annual: {min_age_years: =min_age_years, extended_radius_miles: =extended_radius_miles, plan_switch_allowed: =plan_switch_allowed}
        Kestrel Specialty Courier Service: {min_age_years: =min_age_years, extended_radius_miles: =extended_radius_miles, plan_switch_allowed: =plan_switch_allowed}
  - id: delivery_evt_subscription_billing
    subject: [delivery_plan_activated, delivery_plan_renewed, delivery_subscription_charged, delivery_plan_past_due, delivery_plan_recovered, delivery_plan_lapsed]
    rule: >-
      A plan activates on its trial_end_date, which is the enrollment date plus trial_days; a plan with a subscription_fee_usd above 0.00 is charged that fee for its
      first cycle on activation and for every later cycle on the cycle's first day, each cycle lasting
      billing_cycle_months calendar months with the month-end falling back to the last day of a shorter month. Each
      cycle is charged once. A charge that cannot be collected puts the plan past due; while past due, where
      benefits_suspended_when_past_due is true, orders are priced as Kestrel Pay-Per-Delivery orders. A past-due plan
      whose fee is collected no later than the date the charge failed plus the past-due grace days, counted in calendar
      days with the failure date as day 0, returns to active; otherwise it lapses on the next day. Plans without a
      subscription never go past due.
    eligibility:
      - id: one_charge_per_cycle
        applies_to: [delivery_subscription_charged]
        kind: dedup
        condition: Each cycle is charged once.
        evidence_fields: [delivery_charges.delivery_plan_id, delivery_charges.cycle_start_date, delivery_charges.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [delivery_charges.delivery_plan_id, delivery_charges.cycle_start_date]
          action_bindings:
            delivery_charges.delivery_plan_id: delivery_plan_id
            delivery_charges.cycle_start_date: cycle_start_date
        dedup_contract:
          table: delivery_charges
          mode: separate_record
          object_bindings: {delivery_plan_id: delivery_plan_id, cycle_start_date: cycle_start_date}
          duplicate_filters: {event_type: [delivery_subscription_charged]}
          distinct_fields: []
      - id: grace_period
        applies_to: [delivery_plan_recovered]
        kind: time
        condition: A past-due plan whose fee is collected no later than the date the charge failed plus the past-due grace days, counted in calendar days with the failure date as day 0, returns to active; otherwise it lapses on the next day.
        evidence_fields: [delivery_plans.past_due_since, delivery_plans.delivery_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [delivery_plans.delivery_plan_id]
          action_bindings:
            delivery_plans.delivery_plan_id: delivery_plan_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the date the charge failed
          anchor_source: delivery_plans.past_due_since
          relation: not_after
          duration_source: params.past_due_grace_days
          unit: calendar_days
          counting_rule: counted in calendar days with the failure date as day 0
          boundary: inclusive
    params:
      per_tier:
        Kestrel Pay-Per-Delivery: {subscription_fee_usd: =subscription_fee_usd, billing_cycle_months: =billing_cycle_months, trial_days: =trial_days, past_due_grace_days: =past_due_grace_days, benefits_suspended_when_past_due: =benefits_suspended_when_past_due}
        Kestrel Mail Delivery: {subscription_fee_usd: =subscription_fee_usd, billing_cycle_months: =billing_cycle_months, trial_days: =trial_days, past_due_grace_days: =past_due_grace_days, benefits_suspended_when_past_due: =benefits_suspended_when_past_due}
        Kestrel Delivery Pass Monthly: {subscription_fee_usd: =subscription_fee_usd, billing_cycle_months: =billing_cycle_months, trial_days: =trial_days, past_due_grace_days: =past_due_grace_days, benefits_suspended_when_past_due: =benefits_suspended_when_past_due}
        Kestrel Senior Delivery Pass: {subscription_fee_usd: =subscription_fee_usd, billing_cycle_months: =billing_cycle_months, trial_days: =trial_days, past_due_grace_days: =past_due_grace_days, benefits_suspended_when_past_due: =benefits_suspended_when_past_due}
        Kestrel Delivery Pass Annual: {subscription_fee_usd: =subscription_fee_usd, billing_cycle_months: =billing_cycle_months, trial_days: =trial_days, past_due_grace_days: =past_due_grace_days, benefits_suspended_when_past_due: =benefits_suspended_when_past_due}
        Kestrel Specialty Courier Service: {subscription_fee_usd: =subscription_fee_usd, billing_cycle_months: =billing_cycle_months, trial_days: =trial_days, past_due_grace_days: =past_due_grace_days, benefits_suspended_when_past_due: =benefits_suspended_when_past_due}
    formula:
      amount_usd: subscription_fee_usd
  - id: delivery_evt_order_eligibility
    subject: [delivery_order_placed]
    rule: >-
      An order is placed only on a plan in enrolled, active or past_due status; a past-due plan's orders are priced
      as Kestrel Pay-Per-Delivery orders under delivery_evt_subscription_billing and a cancelled plan takes no orders. A speed is
      offered only where the plan offers it: mail_standard where standard_mail_available is true, same_day where
      same_day_available is true and the order is placed by same_day_order_cutoff_time, express_1hr where
      express_1hr_available is true, and cold_chain_courier only on the Kestrel Specialty Courier Service. A courier order
      goes no farther than extended_radius_miles. An order carries a controlled-substance prescription only where
      controlled_substance_delivery_allowed is true and the prescription's class is delivery_eligible under the
      Prescriptions charter; a temperature-controlled item only where cold_chain_supported is true; store items only
      where front_store_items_included is true. The scheduled_date is no more than scheduled_delivery_max_days_ahead days
      after today and falls on one of the plan's delivery_days_per_week delivery days (Monday to Friday when it is 5,
      every day when it is 7), never a Sunday where sunday_delivery_available is false. Orders are carried by the
      plan's fulfillment_carrier. The promised_window_end of a same_day order is the window start plus
      same_day_window_minutes and of an express_1hr order the placing time plus express_window_minutes; a mail_standard
      order is promised within mail_transit_business_days business days of dispatch. A
      patient places no more than max_same_day_orders_per_day same-day and express orders per day, measured by
      delivery_msr_rush_orders_day. A redelivery is placed as a new order naming the failed order. A redelivery is
      scheduled no later than the date of the failed attempt plus the redelivery window days, counted in calendar days
      with the failed attempt date as day 0.
    eligibility:
      - id: order_on_open_plan
        applies_to: [delivery_order_placed]
        kind: state
        condition: An order is placed only on a plan in enrolled, active or past_due status; a past-due plan's orders are priced as Kestrel Pay-Per-Delivery orders under delivery_evt_subscription_billing and a cancelled plan takes no orders.
        evidence_fields: [delivery_plans.status, delivery_plans.delivery_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [delivery_plans.delivery_plan_id]
          action_bindings:
            delivery_plans.delivery_plan_id: delivery_plan_id
        state_contract:
          field: delivery_plans.status
          allowed: [enrolled, active, past_due]
      - id: redelivery_window
        applies_to: [delivery_order_placed]
        kind: time
        condition: A redelivery is scheduled no later than the date of the failed attempt plus the redelivery window days, counted in calendar days with the failed attempt date as day 0.
        evidence_fields: [delivery_orders.event_date, delivery_orders.source_order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [delivery_orders.source_order_id]
          action_bindings:
            delivery_orders.source_order_id: source_order_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the date of the failed attempt
          anchor_source: delivery_orders.event_date
          relation: not_after
          duration_source: params.redelivery_window_days
          unit: calendar_days
          counting_rule: counted in calendar days with the failed attempt date as day 0
          boundary: inclusive
    params:
      per_tier:
        Kestrel Pay-Per-Delivery: {standard_mail_available: =standard_mail_available, same_day_available: =same_day_available, same_day_order_cutoff_time: =same_day_order_cutoff_time, express_1hr_available: =express_1hr_available, extended_radius_miles: =extended_radius_miles, controlled_substance_delivery_allowed: =controlled_substance_delivery_allowed, cold_chain_supported: =cold_chain_supported, front_store_items_included: =front_store_items_included, scheduled_delivery_max_days_ahead: =scheduled_delivery_max_days_ahead, delivery_days_per_week: =delivery_days_per_week, sunday_delivery_available: =sunday_delivery_available, max_same_day_orders_per_day: =max_same_day_orders_per_day, redelivery_window_days: =redelivery_window_days, fulfillment_carrier: =fulfillment_carrier}
        Kestrel Mail Delivery: {standard_mail_available: =standard_mail_available, same_day_available: =same_day_available, same_day_order_cutoff_time: =same_day_order_cutoff_time, express_1hr_available: =express_1hr_available, extended_radius_miles: =extended_radius_miles, controlled_substance_delivery_allowed: =controlled_substance_delivery_allowed, cold_chain_supported: =cold_chain_supported, front_store_items_included: =front_store_items_included, scheduled_delivery_max_days_ahead: =scheduled_delivery_max_days_ahead, delivery_days_per_week: =delivery_days_per_week, sunday_delivery_available: =sunday_delivery_available, max_same_day_orders_per_day: =max_same_day_orders_per_day, redelivery_window_days: =redelivery_window_days, fulfillment_carrier: =fulfillment_carrier}
        Kestrel Delivery Pass Monthly: {standard_mail_available: =standard_mail_available, same_day_available: =same_day_available, same_day_order_cutoff_time: =same_day_order_cutoff_time, express_1hr_available: =express_1hr_available, extended_radius_miles: =extended_radius_miles, controlled_substance_delivery_allowed: =controlled_substance_delivery_allowed, cold_chain_supported: =cold_chain_supported, front_store_items_included: =front_store_items_included, scheduled_delivery_max_days_ahead: =scheduled_delivery_max_days_ahead, delivery_days_per_week: =delivery_days_per_week, sunday_delivery_available: =sunday_delivery_available, max_same_day_orders_per_day: =max_same_day_orders_per_day, redelivery_window_days: =redelivery_window_days, fulfillment_carrier: =fulfillment_carrier}
        Kestrel Senior Delivery Pass: {standard_mail_available: =standard_mail_available, same_day_available: =same_day_available, same_day_order_cutoff_time: =same_day_order_cutoff_time, express_1hr_available: =express_1hr_available, extended_radius_miles: =extended_radius_miles, controlled_substance_delivery_allowed: =controlled_substance_delivery_allowed, cold_chain_supported: =cold_chain_supported, front_store_items_included: =front_store_items_included, scheduled_delivery_max_days_ahead: =scheduled_delivery_max_days_ahead, delivery_days_per_week: =delivery_days_per_week, sunday_delivery_available: =sunday_delivery_available, max_same_day_orders_per_day: =max_same_day_orders_per_day, redelivery_window_days: =redelivery_window_days, fulfillment_carrier: =fulfillment_carrier}
        Kestrel Delivery Pass Annual: {standard_mail_available: =standard_mail_available, same_day_available: =same_day_available, same_day_order_cutoff_time: =same_day_order_cutoff_time, express_1hr_available: =express_1hr_available, extended_radius_miles: =extended_radius_miles, controlled_substance_delivery_allowed: =controlled_substance_delivery_allowed, cold_chain_supported: =cold_chain_supported, front_store_items_included: =front_store_items_included, scheduled_delivery_max_days_ahead: =scheduled_delivery_max_days_ahead, delivery_days_per_week: =delivery_days_per_week, sunday_delivery_available: =sunday_delivery_available, max_same_day_orders_per_day: =max_same_day_orders_per_day, redelivery_window_days: =redelivery_window_days, fulfillment_carrier: =fulfillment_carrier}
        Kestrel Specialty Courier Service: {standard_mail_available: =standard_mail_available, same_day_available: =same_day_available, same_day_order_cutoff_time: =same_day_order_cutoff_time, express_1hr_available: =express_1hr_available, extended_radius_miles: =extended_radius_miles, controlled_substance_delivery_allowed: =controlled_substance_delivery_allowed, cold_chain_supported: =cold_chain_supported, front_store_items_included: =front_store_items_included, scheduled_delivery_max_days_ahead: =scheduled_delivery_max_days_ahead, delivery_days_per_week: =delivery_days_per_week, sunday_delivery_available: =sunday_delivery_available, max_same_day_orders_per_day: =max_same_day_orders_per_day, redelivery_window_days: =redelivery_window_days, fulfillment_carrier: =fulfillment_carrier}
    measures: [delivery_msr_rush_orders_day]
  - id: delivery_evt_order_fees
    subject: [delivery_order_fee_charged]
    rule: >-
      Order fees are set by the plan in force on the day the order is placed. A same_day order is charged
      same_day_fee_usd, waived when order_value_usd is at or above free_same_day_min_order_usd and that threshold is
      above 0.00. An express_1hr order is charged express_1hr_fee_usd, waived while delivery_msr_free_express_month is
      below free_express_per_month. A mail_standard order is charged mail_fee_usd. A courier order whose distance_miles
      is above delivery_radius_miles is also charged extended_radius_fee_usd. A redelivery is charged redelivery_fee_usd.
      Each fee type is charged at most once per order, and a waived fee is not charged at all rather than charged and
      refunded. Where the plan is past due and benefits_suspended_when_past_due is true, the Kestrel Pay-Per-Delivery
      fees apply instead. A patient who holds a Kestrel Care Rewards membership in active status whose level has
      free_rx_delivery true is charged no same_day or express fee on an order that carries prescriptions, whatever the
      delivery plan; distance and redelivery fees still apply.
    eligibility:
      - id: one_fee_type_per_order
        applies_to: [delivery_order_fee_charged]
        kind: dedup
        condition: Each fee type is charged at most once per order, and a waived fee is not charged at all rather than charged and refunded.
        evidence_fields: [delivery_charges.source_order_id, delivery_charges.fee_type, delivery_charges.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [delivery_charges.source_order_id, delivery_charges.fee_type]
          action_bindings:
            delivery_charges.source_order_id: source_order_id
            delivery_charges.fee_type: fee_type
        dedup_contract:
          table: delivery_charges
          mode: separate_record
          object_bindings: {source_order_id: source_order_id, fee_type: fee_type}
          duplicate_filters: {event_type: [delivery_order_fee_charged]}
          distinct_fields: []
    params:
      per_tier:
        Kestrel Pay-Per-Delivery: {same_day_fee_usd: =same_day_fee_usd, free_same_day_min_order_usd: =free_same_day_min_order_usd, express_1hr_fee_usd: =express_1hr_fee_usd, free_express_per_month: =free_express_per_month, mail_fee_usd: =mail_fee_usd, delivery_radius_miles: =delivery_radius_miles, extended_radius_fee_usd: =extended_radius_fee_usd, redelivery_fee_usd: =redelivery_fee_usd}
        Kestrel Mail Delivery: {same_day_fee_usd: =same_day_fee_usd, free_same_day_min_order_usd: =free_same_day_min_order_usd, express_1hr_fee_usd: =express_1hr_fee_usd, free_express_per_month: =free_express_per_month, mail_fee_usd: =mail_fee_usd, delivery_radius_miles: =delivery_radius_miles, extended_radius_fee_usd: =extended_radius_fee_usd, redelivery_fee_usd: =redelivery_fee_usd}
        Kestrel Delivery Pass Monthly: {same_day_fee_usd: =same_day_fee_usd, free_same_day_min_order_usd: =free_same_day_min_order_usd, express_1hr_fee_usd: =express_1hr_fee_usd, free_express_per_month: =free_express_per_month, mail_fee_usd: =mail_fee_usd, delivery_radius_miles: =delivery_radius_miles, extended_radius_fee_usd: =extended_radius_fee_usd, redelivery_fee_usd: =redelivery_fee_usd}
        Kestrel Senior Delivery Pass: {same_day_fee_usd: =same_day_fee_usd, free_same_day_min_order_usd: =free_same_day_min_order_usd, express_1hr_fee_usd: =express_1hr_fee_usd, free_express_per_month: =free_express_per_month, mail_fee_usd: =mail_fee_usd, delivery_radius_miles: =delivery_radius_miles, extended_radius_fee_usd: =extended_radius_fee_usd, redelivery_fee_usd: =redelivery_fee_usd}
        Kestrel Delivery Pass Annual: {same_day_fee_usd: =same_day_fee_usd, free_same_day_min_order_usd: =free_same_day_min_order_usd, express_1hr_fee_usd: =express_1hr_fee_usd, free_express_per_month: =free_express_per_month, mail_fee_usd: =mail_fee_usd, delivery_radius_miles: =delivery_radius_miles, extended_radius_fee_usd: =extended_radius_fee_usd, redelivery_fee_usd: =redelivery_fee_usd}
        Kestrel Specialty Courier Service: {same_day_fee_usd: =same_day_fee_usd, free_same_day_min_order_usd: =free_same_day_min_order_usd, express_1hr_fee_usd: =express_1hr_fee_usd, free_express_per_month: =free_express_per_month, mail_fee_usd: =mail_fee_usd, delivery_radius_miles: =delivery_radius_miles, extended_radius_fee_usd: =extended_radius_fee_usd, redelivery_fee_usd: =redelivery_fee_usd}
    measures: [delivery_msr_free_express_month]
  - id: delivery_evt_handover
    subject: [delivery_completed]
    rule: >-
      An order needs a signature on handover where signature_required_default is true, where its order_value_usd is at or
      above signature_required_order_value_usd and that threshold is above 0.00, or where it carries a prescription
      whose class requires a delivery signature under the Prescriptions charter. An order carrying a controlled
      substance is handed only to an adult who shows photo ID where id_check_on_controlled_delivery is true, recorded as
      id_checked_signature. An order that needs no signature may be left at the door where contactless_drop_allowed is
      true, recorded as contactless_drop. An order is delivered at most once. A delivery is late when delivered_time is
      more than late_threshold_minutes after promised_window_end on the scheduled date, or when it arrives on a later
      date.
    eligibility:
      - id: deliver_once
        applies_to: [delivery_completed]
        kind: dedup
        condition: An order is delivered at most once.
        evidence_fields: [delivery_orders.source_order_id, delivery_orders.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [delivery_orders.source_order_id]
          action_bindings:
            delivery_orders.source_order_id: source_order_id
        dedup_contract:
          table: delivery_orders
          mode: separate_record
          object_bindings: {source_order_id: source_order_id}
          duplicate_filters: {event_type: [delivery_completed, delivery_order_cancelled, delivery_returned_to_store]}
          distinct_fields: []
    params:
      per_tier:
        Kestrel Pay-Per-Delivery: {signature_required_default: =signature_required_default, signature_required_order_value_usd: =signature_required_order_value_usd, id_check_on_controlled_delivery: =id_check_on_controlled_delivery, contactless_drop_allowed: =contactless_drop_allowed, late_threshold_minutes: =late_threshold_minutes, same_day_window_minutes: =same_day_window_minutes, express_window_minutes: =express_window_minutes, mail_transit_business_days: =mail_transit_business_days}
        Kestrel Mail Delivery: {signature_required_default: =signature_required_default, signature_required_order_value_usd: =signature_required_order_value_usd, id_check_on_controlled_delivery: =id_check_on_controlled_delivery, contactless_drop_allowed: =contactless_drop_allowed, late_threshold_minutes: =late_threshold_minutes, same_day_window_minutes: =same_day_window_minutes, express_window_minutes: =express_window_minutes, mail_transit_business_days: =mail_transit_business_days}
        Kestrel Delivery Pass Monthly: {signature_required_default: =signature_required_default, signature_required_order_value_usd: =signature_required_order_value_usd, id_check_on_controlled_delivery: =id_check_on_controlled_delivery, contactless_drop_allowed: =contactless_drop_allowed, late_threshold_minutes: =late_threshold_minutes, same_day_window_minutes: =same_day_window_minutes, express_window_minutes: =express_window_minutes, mail_transit_business_days: =mail_transit_business_days}
        Kestrel Senior Delivery Pass: {signature_required_default: =signature_required_default, signature_required_order_value_usd: =signature_required_order_value_usd, id_check_on_controlled_delivery: =id_check_on_controlled_delivery, contactless_drop_allowed: =contactless_drop_allowed, late_threshold_minutes: =late_threshold_minutes, same_day_window_minutes: =same_day_window_minutes, express_window_minutes: =express_window_minutes, mail_transit_business_days: =mail_transit_business_days}
        Kestrel Delivery Pass Annual: {signature_required_default: =signature_required_default, signature_required_order_value_usd: =signature_required_order_value_usd, id_check_on_controlled_delivery: =id_check_on_controlled_delivery, contactless_drop_allowed: =contactless_drop_allowed, late_threshold_minutes: =late_threshold_minutes, same_day_window_minutes: =same_day_window_minutes, express_window_minutes: =express_window_minutes, mail_transit_business_days: =mail_transit_business_days}
        Kestrel Specialty Courier Service: {signature_required_default: =signature_required_default, signature_required_order_value_usd: =signature_required_order_value_usd, id_check_on_controlled_delivery: =id_check_on_controlled_delivery, contactless_drop_allowed: =contactless_drop_allowed, late_threshold_minutes: =late_threshold_minutes, same_day_window_minutes: =same_day_window_minutes, express_window_minutes: =express_window_minutes, mail_transit_business_days: =mail_transit_business_days}
  - id: delivery_evt_failed_attempts
    subject: [delivery_attempt_failed, delivery_returned_to_store]
    rule: >-
      A failed attempt is recorded with its reason and attempt number. After max_delivery_attempts failed attempts,
      counted by delivery_msr_failed_attempts across the order and its redeliveries, or when no redelivery is scheduled
      within redelivery_window_days of the last failed attempt, the order is returned to the fulfilling store. A
      returned order waits for pickup for returned_order_hold_days from the return date, and its prescriptions are
      returned to stock no earlier than the later of that day and the end of their will-call hold under the
      Prescriptions charter; a temperature-controlled item is never
      redelivered after being returned. An order is returned at most once.
    eligibility:
      - id: return_once
        applies_to: [delivery_returned_to_store]
        kind: dedup
        condition: An order is returned at most once.
        evidence_fields: [delivery_orders.source_order_id, delivery_orders.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [delivery_orders.source_order_id]
          action_bindings:
            delivery_orders.source_order_id: source_order_id
        dedup_contract:
          table: delivery_orders
          mode: separate_record
          object_bindings: {source_order_id: source_order_id}
          duplicate_filters: {event_type: [delivery_returned_to_store, delivery_completed]}
          distinct_fields: []
    params:
      per_tier:
        Kestrel Pay-Per-Delivery: {max_delivery_attempts: =max_delivery_attempts, redelivery_window_days: =redelivery_window_days, returned_order_hold_days: =returned_order_hold_days}
        Kestrel Mail Delivery: {max_delivery_attempts: =max_delivery_attempts, redelivery_window_days: =redelivery_window_days, returned_order_hold_days: =returned_order_hold_days}
        Kestrel Delivery Pass Monthly: {max_delivery_attempts: =max_delivery_attempts, redelivery_window_days: =redelivery_window_days, returned_order_hold_days: =returned_order_hold_days}
        Kestrel Senior Delivery Pass: {max_delivery_attempts: =max_delivery_attempts, redelivery_window_days: =redelivery_window_days, returned_order_hold_days: =returned_order_hold_days}
        Kestrel Delivery Pass Annual: {max_delivery_attempts: =max_delivery_attempts, redelivery_window_days: =redelivery_window_days, returned_order_hold_days: =returned_order_hold_days}
        Kestrel Specialty Courier Service: {max_delivery_attempts: =max_delivery_attempts, redelivery_window_days: =redelivery_window_days, returned_order_hold_days: =returned_order_hold_days}
    measures: [delivery_msr_failed_attempts]
  - id: delivery_evt_refunds
    subject: [delivery_fee_refunded, delivery_order_cancelled]
    rule: >-
      Each fee is refunded at most once and never for more than was charged. A late order has its order fees refunded at
      late_delivery_refund_pct percent, as refund_reason late_delivery, where late_credit_applies is true and
      delivery_msr_late_refunds_cycle is below late_credit_max_per_cycle; a late order on a plan that charged it no fee
      earns nothing. An order cancelled before dispatch has its order fees refunded in full where
      order_cancel_refund_before_dispatch is true; an order already dispatched cannot be cancelled. A missing order is
      claimed no later than the scheduled delivery date plus the lost package claim window days, counted in calendar
      days with the scheduled date as day 0. A missing order is declared lost and its fees refunded as lost_package no
      earlier than the scheduled delivery date plus the carrier trace business days, counted in business days Monday to
      Friday excluding Kestrel's published holidays with the scheduled date as day 0; replacing the medication is a new
      fill decided under the Prescriptions charter. A subscription fee is refunded in full as trial_or_window_cancellation
      when the plan is cancelled no later than full_refund_window_days after that fee was charged; after that, where
      prorated_refund_after_window is true, the unused whole months of the cycle are refunded as
      prorated_cancellation, each month worth subscription_fee_usd divided by billing_cycle_months and rounded to the
      cent half up; otherwise nothing is refunded.
    eligibility:
      - id: refund_once
        applies_to: [delivery_fee_refunded]
        kind: dedup
        condition: Each fee is refunded at most once and never for more than was charged.
        evidence_fields: [delivery_charges.source_charge_id, delivery_charges.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [delivery_charges.source_charge_id]
          action_bindings:
            delivery_charges.source_charge_id: source_charge_id
        dedup_contract:
          table: delivery_charges
          mode: separate_record
          object_bindings: {source_charge_id: source_charge_id}
          duplicate_filters: {event_type: [delivery_fee_refunded]}
          distinct_fields: []
      - id: lost_claim_window
        applies_to: [delivery_fee_refunded]
        kind: time
        condition: A missing order is claimed no later than the scheduled delivery date plus the lost package claim window days, counted in calendar days with the scheduled date as day 0.
        evidence_fields: [delivery_orders.scheduled_date, delivery_orders.order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [delivery_orders.order_id]
          action_bindings:
            delivery_orders.order_id: source_order_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the scheduled delivery date
          anchor_source: delivery_orders.scheduled_date
          relation: not_after
          duration_source: params.lost_package_claim_window_days
          unit: calendar_days
          counting_rule: counted in calendar days with the scheduled date as day 0
          boundary: inclusive
      - id: trace_complete
        applies_to: [delivery_fee_refunded]
        kind: time
        condition: A missing order is declared lost and its fees refunded as lost_package no earlier than the scheduled delivery date plus the carrier trace business days, counted in business days Monday to Friday excluding Kestrel's published holidays with the scheduled date as day 0; replacing the medication is a new fill decided under the Prescriptions charter.
        evidence_fields: [delivery_orders.scheduled_date, delivery_orders.order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [delivery_orders.order_id]
          action_bindings:
            delivery_orders.order_id: source_order_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the scheduled delivery date
          anchor_source: delivery_orders.scheduled_date
          relation: not_before
          duration_source: params.lost_package_trace_business_days
          unit: business_days
          counting_rule: counted in business days Monday to Friday excluding Kestrel's published holidays with the scheduled date as day 0
          boundary: inclusive
    params:
      per_tier:
        Kestrel Pay-Per-Delivery: {late_credit_applies: =late_credit_applies, late_delivery_refund_pct: =late_delivery_refund_pct, late_credit_max_per_cycle: =late_credit_max_per_cycle, order_cancel_refund_before_dispatch: =order_cancel_refund_before_dispatch, lost_package_claim_window_days: =lost_package_claim_window_days, lost_package_trace_business_days: =lost_package_trace_business_days, full_refund_window_days: =full_refund_window_days, prorated_refund_after_window: =prorated_refund_after_window}
        Kestrel Mail Delivery: {late_credit_applies: =late_credit_applies, late_delivery_refund_pct: =late_delivery_refund_pct, late_credit_max_per_cycle: =late_credit_max_per_cycle, order_cancel_refund_before_dispatch: =order_cancel_refund_before_dispatch, lost_package_claim_window_days: =lost_package_claim_window_days, lost_package_trace_business_days: =lost_package_trace_business_days, full_refund_window_days: =full_refund_window_days, prorated_refund_after_window: =prorated_refund_after_window}
        Kestrel Delivery Pass Monthly: {late_credit_applies: =late_credit_applies, late_delivery_refund_pct: =late_delivery_refund_pct, late_credit_max_per_cycle: =late_credit_max_per_cycle, order_cancel_refund_before_dispatch: =order_cancel_refund_before_dispatch, lost_package_claim_window_days: =lost_package_claim_window_days, lost_package_trace_business_days: =lost_package_trace_business_days, full_refund_window_days: =full_refund_window_days, prorated_refund_after_window: =prorated_refund_after_window}
        Kestrel Senior Delivery Pass: {late_credit_applies: =late_credit_applies, late_delivery_refund_pct: =late_delivery_refund_pct, late_credit_max_per_cycle: =late_credit_max_per_cycle, order_cancel_refund_before_dispatch: =order_cancel_refund_before_dispatch, lost_package_claim_window_days: =lost_package_claim_window_days, lost_package_trace_business_days: =lost_package_trace_business_days, full_refund_window_days: =full_refund_window_days, prorated_refund_after_window: =prorated_refund_after_window}
        Kestrel Delivery Pass Annual: {late_credit_applies: =late_credit_applies, late_delivery_refund_pct: =late_delivery_refund_pct, late_credit_max_per_cycle: =late_credit_max_per_cycle, order_cancel_refund_before_dispatch: =order_cancel_refund_before_dispatch, lost_package_claim_window_days: =lost_package_claim_window_days, lost_package_trace_business_days: =lost_package_trace_business_days, full_refund_window_days: =full_refund_window_days, prorated_refund_after_window: =prorated_refund_after_window}
        Kestrel Specialty Courier Service: {late_credit_applies: =late_credit_applies, late_delivery_refund_pct: =late_delivery_refund_pct, late_credit_max_per_cycle: =late_credit_max_per_cycle, order_cancel_refund_before_dispatch: =order_cancel_refund_before_dispatch, lost_package_claim_window_days: =lost_package_claim_window_days, lost_package_trace_business_days: =lost_package_trace_business_days, full_refund_window_days: =full_refund_window_days, prorated_refund_after_window: =prorated_refund_after_window}
    measures: [delivery_msr_late_refunds_cycle]
  - id: delivery_plan_cancellation
    subject: [delivery_plan_cancelled]
    rule: >-
      A plan is cancelled only at the patient's own request, which the patient confirms themselves. A plan cancelled
      while still enrolled in its trial is never charged. Where cancellation_effective_timing is end_of_cycle the plan
      keeps its prices until the end of the paid cycle and cancellation_effective_date is the cycle_end_date; where it is
      immediate the cancellation takes effect the same day. Orders already placed are delivered at the prices in force
      when they were placed. Refunds of a subscription fee follow delivery_evt_refunds.
    eligibility: []
    params:
      per_tier:
        Kestrel Pay-Per-Delivery: {cancellation_effective_timing: =cancellation_effective_timing}
        Kestrel Mail Delivery: {cancellation_effective_timing: =cancellation_effective_timing}
        Kestrel Delivery Pass Monthly: {cancellation_effective_timing: =cancellation_effective_timing}
        Kestrel Senior Delivery Pass: {cancellation_effective_timing: =cancellation_effective_timing}
        Kestrel Delivery Pass Annual: {cancellation_effective_timing: =cancellation_effective_timing}
        Kestrel Specialty Courier Service: {cancellation_effective_timing: =cancellation_effective_timing}
