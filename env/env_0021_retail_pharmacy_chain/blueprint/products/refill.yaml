category: refill
display_name: Auto Refill & Medication Sync

binding:
  holding_table: refill_enrollments
  event_tables: [refill_cycles]
  status_field: status
  variant_field: variant_name
  quantity_fields: {skips_remaining: skips}

lifecycle:
  states: [enrolled, active, paused, unenrolled, ended]
  transitions:
    - {from: enrolled, to: active, by: system, means: The first automated cycle is scheduled.}
    - {from: active, to: paused, by: user, means: The patient pauses automated refills for a period.}
    - {from: paused, to: active, by: system, means: The pause ends on its end date or when the patient resumes early.}
    - {from: enrolled, to: unenrolled, by: user, means: The patient withdraws before the first cycle.}
    - {from: active, to: unenrolled, by: user, means: The patient stops automated refills.}
    - {from: paused, to: unenrolled, by: user, means: The patient stops automated refills while paused.}
    - {from: enrolled, to: ended, by: system, means: The enrollment ends because the prescription closed or the program rules end it.}
    - {from: active, to: ended, by: system, means: The enrollment ends because the prescription closed or the program rules end it.}
    - {from: paused, to: ended, by: system, means: The enrollment ends because the prescription closed or the program rules end it.}

accounts:
  - key: skips
    unit: skipped cycles
    meaning: Cycles the patient may still skip in the current program year; credited when the yearly allowance is granted, debited when a cycle is skipped.

parameter_schema:
  days_supply_per_cycle: Days supply dispensed by each automated cycle, integer days.
  cycle_date_basis: What sets the next cycle date, enum last_fill_date | sync_day.
  refill_lead_days: Calendar days before the cycle date on which the refill is processed, integer days.
  confirmation_required: Whether the patient must confirm each cycle before it is filled, boolean.
  confirmation_window_hours: Hours after the confirmation request within which the patient must confirm, integer hours.
  no_confirmation_action: What happens when a required confirmation does not arrive, enum fill_anyway | hold_cycle.
  medicare_shipment_confirmation_required: Whether each cycle for a patient whose primary coverage is a Medicare class must be confirmed before it ships, boolean.
  annual_consent_renewal_required: Whether the patient must renew consent to the program every program year, boolean.
  cycle_cancel_cutoff_hours: Hours before processing up to which a scheduled cycle may be skipped, integer hours.
  skips_per_program_year: Cycles that may be skipped per program year, integer.
  max_consecutive_skips: Most cycles in a row that may be skipped, integer.
  pause_allowed: Whether the enrollment may be paused, boolean.
  max_pause_days: Longest pause, integer calendar days.
  pauses_per_program_year: Pauses allowed per program year, integer.
  auto_resume_after_pause: Whether the enrollment resumes by itself when the pause ends, boolean.
  consecutive_rts_unenroll_threshold: Automated fills in a row returned to stock unpicked that end the enrollment, integer.
  consecutive_failures_pause_threshold: Cycles in a row held without filling that pause the enrollment, integer.
  re_enrollment_wait_days: Calendar days after the program ended the enrollment before the same prescription may be enrolled again, integer days.
  max_prescriptions_per_program: Most prescriptions of one patient enrolled in this program at once, integer.
  sync_anchor_rule: How the sync day is chosen, enum patient_choice | pharmacist_choice | not_applicable.
  sync_day_earliest: Earliest day of the month allowed as a sync day, integer.
  sync_day_latest: Latest day of the month allowed as a sync day, integer.
  sync_day_change_per_year: Times per program year the sync day may be changed, integer.
  sync_short_fill_allowed: Whether a short fill may be dispensed to bring a prescription onto the sync day, boolean.
  short_fill_min_days: Fewest days to the sync day for which a short fill is dispensed; fewer days are carried to the following sync day, integer days.
  short_fill_prorated_copay: Whether the patient pays a copay prorated by days on a short fill, boolean.
  mid_cycle_new_rx_handling: How a new prescription joining mid-cycle is handled, enum short_fill_to_sync | add_next_cycle | not_applicable.
  adherence_packaging: Whether doses are dispensed in multi-dose adherence packs, boolean.
  packaging_prep_days: Extra calendar days of lead time needed to prepare packs, integer days.
  packaging_card_days: Days covered by one set of adherence cards, integer days; 0 when no packaging.
  packaging_change_cutoff_days: Calendar days before processing by which a dose change must be on file to be in the next packs, integer days.
  controlled_in_packaging_allowed: Whether controlled substances may be placed in adherence packs, boolean.
  pharmacist_review_per_cycle: Whether a pharmacist reviews the whole medication list each cycle, boolean.
  fulfillment_methods_allowed: Fulfilment methods offered, list of enum store_pickup | home_delivery.
  default_delivery_speed: Delivery speed used for delivered cycles, enum none | mail_standard | same_day.
  fill_location: Where cycles are dispensed, enum holding_store | central_fill.
  requires_delivery_plan: Whether the patient must hold a delivery plan in enrolled or active status, boolean.
  rx_eligibility_flag: Which Prescriptions charter eligibility switch the prescription's class must have true, enum auto_refill_eligible | med_sync_eligible | adherence_packaging_eligible.
  requires_ninety_day_supply_allowed: Whether the prescription's class must allow a 90-day supply, boolean.
  min_prior_fills: Dispensed fills of the prescription at Kestrel needed before enrollment, integer.
  ninety_day_conversion_after_cycles: Filled cycles after which Kestrel offers conversion to the 90-day program, integer; 0 when not offered.
  reject_retry_days: Calendar days an insurance rejection is retried before the cycle is held, integer days.
  auto_renewal_request: Whether a renewal request is sent automatically when a cycle finds no refill remaining, boolean.
  price_change_hold_threshold_usd: Rise in patient pay against the previous fill above which the cycle is held for the patient's approval, USD.
  hold_on_insurance_change: Whether a cycle is held when the coverage billed differs from the previous fill's, boolean.
  caregiver_confirmation_allowed: Whether a caregiver on the profile may confirm cycles, boolean.
  text_confirmation_allowed: Whether a cycle may be confirmed by text reply, boolean.
  enrollment_fee_usd: Fee to enroll, USD.

