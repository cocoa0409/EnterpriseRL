events:
  - type: refill_enrolled
    target: refill_enrollments
    mutation: create
    meaning: The patient enrolls one prescription in an automated refill program.
    grain: one row per enrollment
    fields:
      refill_enrollment_id: id of the enrollment
      customer_id: the patient
      prescription_id: the prescription enrolled
      variant_name: refill program
      status: enrolled
      sync_day: day of the month cycles align to, empty for Auto Refill programs
      next_cycle_date: date the first cycle is due
      fulfillment_method: store_pickup or home_delivery
      skips_remaining: 0 until the yearly allowance is granted
      program_year_start: first day of the current program year, the enrollment date
      opened_date: date of enrollment
    triggers:
      - event: refill:refill_skip_allowance_granted
        map: {refill_enrollment_id: refill_enrollment_id, customer_id: customer_id, prescription_id: prescription_id, program_year_start: program_year_start}
  - type: refill_activated
    target: refill_enrollments
    mutation: {transition: {from: enrolled, to: active}}
    meaning: The first automated cycle is scheduled.
    grain: one row per transaction
    fields:
      refill_enrollment_id: the enrollment
      status: active
    triggers: []
  - type: refill_paused
    target: refill_enrollments
    mutation: {transition: {from: active, to: paused}}
    meaning: The patient pauses automated refills.
    grain: one row per transaction
    fields:
      refill_enrollment_id: the enrollment
      status: paused
      pause_until_date: last day of the pause
    triggers: []
  - type: refill_resumed
    target: refill_enrollments
    mutation: {transition: {from: paused, to: active}}
    meaning: Automated refills resume after a pause.
    grain: one row per transaction
    fields:
      refill_enrollment_id: the enrollment
      status: active
      pause_until_date: cleared
      next_cycle_date: next cycle date after resuming
    triggers: []
  - type: refill_unenrolled
    target: refill_enrollments
    mutation: {transition: [{from: enrolled, to: unenrolled}, {from: active, to: unenrolled}, {from: paused, to: unenrolled}]}
    meaning: The patient stops automated refills for the prescription.
    grain: one row per transaction
    fields:
      refill_enrollment_id: the enrollment
      status: unenrolled
      closed_date: date stopped
      unenroll_reason: patient_request
    triggers: []
  - type: refill_auto_unenrolled
    target: refill_enrollments
    mutation: {transition: [{from: enrolled, to: ended}, {from: active, to: ended}, {from: paused, to: ended}]}
    meaning: The enrollment ends because the prescription closed or the program's rules end it.
    grain: one row per transaction
    fields:
      refill_enrollment_id: the enrollment
      prescription_id: the prescription enrolled
      status: ended
      closed_date: date ended
      unenroll_reason: why the enrollment ended
    triggers: []
  - type: refill_settings_updated
    target: refill_enrollments
    mutation: update
    meaning: The sync day, next cycle date, fulfilment method or program year of an enrollment is changed.
    grain: one row per transaction
    fields:
      refill_enrollment_id: the enrollment
      sync_day: new sync day
      next_cycle_date: new next cycle date
      fulfillment_method: new fulfilment method
      program_year_start: new program year start at the anniversary
    triggers: []
  - type: refill_skip_allowance_granted
    target: refill_cycles
    meaning: The yearly allowance of skips is credited at enrollment and at each program-year anniversary.
    grain: one row per program year
    distinguish_by: [program_year_start]
    fields:
      cycle_id: id of this entry
      refill_enrollment_id: the enrollment
      customer_id: the patient
      prescription_id: the prescription
      event_date: date granted
      program_year_start: first day of the program year
      skips_granted: skips credited (skips_per_program_year)
    account: skips
    direction: in
    triggers: []
  - type: refill_cycle_scheduled
    target: refill_cycles
    meaning: An automated cycle is queued for its cycle date.
    grain: one row per cycle
    distinguish_by: [cycle_date]
    fields:
      cycle_id: id of the cycle
      refill_enrollment_id: the enrollment
      customer_id: the patient
      prescription_id: the prescription
      event_date: date queued
      cycle_date: date the cycle is due
      days_supply: days supply the cycle will dispense
      sync_short_fill: whether the cycle is a short fill to reach the sync day
    triggers: []
  - type: refill_cycle_confirmed
    target: refill_cycles
    meaning: The patient or their caregiver confirms a cycle.
    grain: one row per cycle confirmed
    distinguish_by: [source_cycle_id]
    fields:
      cycle_id: id of this confirmation
      refill_enrollment_id: the enrollment
      customer_id: the patient
      prescription_id: the prescription
      event_date: date confirmed
      source_cycle_id: the cycle confirmed
      confirmed_by: patient or caregiver
      confirmation_channel: text or phone
    triggers: []
  - type: refill_cycle_filled
    target: refill_cycles
    meaning: A cycle is dispensed as a fill of the prescription.
    grain: one row per cycle filled
    distinguish_by: [source_cycle_id]
    fields:
      cycle_id: id of this entry
      refill_enrollment_id: the enrollment
      customer_id: the patient
      prescription_id: the prescription
      event_date: date filled
      source_cycle_id: the cycle filled
      fill_id: the fill dispensed
      days_supply: days supply dispensed
    triggers: []
  - type: refill_cycle_skipped
    target: refill_cycles
    meaning: The patient skips a scheduled cycle.
    grain: one row per cycle skipped
    distinguish_by: [source_cycle_id]
    fields:
      cycle_id: id of this entry
      refill_enrollment_id: the enrollment
      customer_id: the patient
      prescription_id: the prescription
      event_date: date skipped
      source_cycle_id: the cycle skipped
    account: skips
    direction: out
    triggers: []
  - type: refill_cycle_held
    target: refill_cycles
    meaning: A cycle is held instead of filled.
    grain: one row per cycle held
    distinguish_by: [source_cycle_id]
    fields:
      cycle_id: id of this entry
      refill_enrollment_id: the enrollment
      customer_id: the patient
      prescription_id: the prescription
      event_date: date held
      source_cycle_id: the cycle held
      hold_reason: why the cycle was held
    triggers:
      - event: rx:rx_renewal_requested
        when: {hold_reason: no_refills_remaining}
        map: {prescription_id: prescription_id, customer_id: customer_id, event_date: event_date, request_reason: no_refills_remaining}

measures:
  - id: refill_msr_consecutive_rts
    window: the enrollment's filled cycles, most recent first, stopping at the first one whose fill was picked up
    measure: count of refill_cycle_filled rows whose fill_id is the source_fill_id of an rx_return_to_stock row
  - id: refill_msr_consecutive_skips
    window: the enrollment's cycles, most recent first, stopping at the first cycle not skipped
    measure: count of refill_cycle_skipped rows
  - id: refill_msr_consecutive_holds
    window: the enrollment's cycles, most recent first, stopping at the first cycle filled
    measure: count of refill_cycle_held rows
  - id: refill_msr_pauses_program_year
    window: the current program year of the enrollment, from program_year_start for one year
    measure: count of refill_paused transitions on the enrollment in the window
  - id: refill_msr_program_enrollments
    window: current state of the patient's profile
    measure: count of the patient's refill enrollments of the same program in enrolled, active or paused status

policies:
  - id: refill_agg_multi_holding
    subject: [refill_enrolled]
    rule: >-
      A patient may enroll many prescriptions, each as its own enrollment, but a prescription has at most one
      enrollment in enrolled, active or paused status at a time, whatever the program. The number of the patient's open
      enrollments in one program never exceeds that program's max_prescriptions_per_program, measured by
      refill_msr_program_enrollments.
    eligibility: []
    params:
      max_per_customer: null
    measures: [refill_msr_program_enrollments]
  - id: refill_agg_sync_group
    subject: [refill_enrolled, refill_settings_updated, refill_cycle_scheduled]
    rule: >-
      All of a patient's open Med Sync enrollments form one sync group sharing one sync_day between sync_day_earliest
      and sync_day_latest, chosen under sync_anchor_rule; changing it for one enrollment changes it for the whole group,
      at most sync_day_change_per_year times per program year. A patient who joins any Med Sync program has every open
      Auto Refill enrollment for a med-sync-eligible prescription ended as program_change and re-enrolled in the sync
      group, so that Auto Refill and Med Sync never run on the same patient's eligible prescriptions at the same time. A
      prescription joining the group mid-cycle follows mid_cycle_new_rx_handling.
    eligibility: []
    params:
      per_tier:
        Kestrel Auto Refill 30-Day: {sync_anchor_rule: =sync_anchor_rule, sync_day_earliest: =sync_day_earliest, sync_day_latest: =sync_day_latest, sync_day_change_per_year: =sync_day_change_per_year, mid_cycle_new_rx_handling: =mid_cycle_new_rx_handling}
        Kestrel Auto Refill 90-Day: {sync_anchor_rule: =sync_anchor_rule, sync_day_earliest: =sync_day_earliest, sync_day_latest: =sync_day_latest, sync_day_change_per_year: =sync_day_change_per_year, mid_cycle_new_rx_handling: =mid_cycle_new_rx_handling}
        Kestrel Med Sync Monthly: {sync_anchor_rule: =sync_anchor_rule, sync_day_earliest: =sync_day_earliest, sync_day_latest: =sync_day_latest, sync_day_change_per_year: =sync_day_change_per_year, mid_cycle_new_rx_handling: =mid_cycle_new_rx_handling}
        Kestrel Med Sync 90-Day: {sync_anchor_rule: =sync_anchor_rule, sync_day_earliest: =sync_day_earliest, sync_day_latest: =sync_day_latest, sync_day_change_per_year: =sync_day_change_per_year, mid_cycle_new_rx_handling: =mid_cycle_new_rx_handling}
        Kestrel Med Sync with Adherence Packaging: {sync_anchor_rule: =sync_anchor_rule, sync_day_earliest: =sync_day_earliest, sync_day_latest: =sync_day_latest, sync_day_change_per_year: =sync_day_change_per_year, mid_cycle_new_rx_handling: =mid_cycle_new_rx_handling}
        Kestrel Home Delivery Auto Refill: {sync_anchor_rule: =sync_anchor_rule, sync_day_earliest: =sync_day_earliest, sync_day_latest: =sync_day_latest, sync_day_change_per_year: =sync_day_change_per_year, mid_cycle_new_rx_handling: =mid_cycle_new_rx_handling}
  - id: refill_enrollment_rules
    subject: [refill_enrolled]
    rule: >-
      Enrolling is the patient's own consent to automated refills and is done by the patient. A prescription is enrolled
      only while it is in received or active status and its class has the Prescriptions charter switch named by
      rx_eligibility_flag set to true. Where requires_ninety_day_supply_allowed is true the class must allow a 90-day
      supply. The prescription must have at least min_prior_fills dispensed fills at Kestrel. A program whose
      requires_delivery_plan is true is enrolled only while the patient holds a delivery plan in enrolled or active
      status, and the fulfilment method must be one of fulfillment_methods_allowed. A prescription whose enrollment was
      ended by the program is not enrolled again before closed_date plus re_enrollment_wait_days. Where
      annual_consent_renewal_required is true the patient renews the enrollment at each program-year anniversary or it
      ends as consent_not_renewed. Enrollment costs enrollment_fee_usd.
    eligibility:
      - id: prescription_open
        applies_to: [refill_enrolled]
        kind: state
        condition: A prescription is enrolled only while it is in received or active status and its class has the Prescriptions charter switch named by rx_eligibility_flag set to true.
        evidence_fields: [rx_prescriptions.status, rx_prescriptions.variant_name, rx_prescriptions.prescription_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rx_prescriptions.prescription_id]
          action_bindings:
            rx_prescriptions.prescription_id: prescription_id
        state_contract:
          field: rx_prescriptions.status
          allowed: [received, active]
      - id: delivery_plan_held
        applies_to: [refill_enrolled]
        kind: state
        condition: A program whose requires_delivery_plan is true is enrolled only while the patient holds a delivery plan in enrolled or active status, and the fulfilment method must be one of fulfillment_methods_allowed.
        evidence_fields: [delivery_plans.status, delivery_plans.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [delivery_plans.customer_id]
          action_bindings:
            delivery_plans.customer_id: customer_id
        state_contract:
          field: delivery_plans.status
          allowed: [enrolled, active]
    params:
      per_tier:
        Kestrel Auto Refill 30-Day: {rx_eligibility_flag: =rx_eligibility_flag, requires_ninety_day_supply_allowed: =requires_ninety_day_supply_allowed, min_prior_fills: =min_prior_fills, requires_delivery_plan: =requires_delivery_plan, fulfillment_methods_allowed: =fulfillment_methods_allowed, re_enrollment_wait_days: =re_enrollment_wait_days, annual_consent_renewal_required: =annual_consent_renewal_required, enrollment_fee_usd: =enrollment_fee_usd}
        Kestrel Auto Refill 90-Day: {rx_eligibility_flag: =rx_eligibility_flag, requires_ninety_day_supply_allowed: =requires_ninety_day_supply_allowed, min_prior_fills: =min_prior_fills, requires_delivery_plan: =requires_delivery_plan, fulfillment_methods_allowed: =fulfillment_methods_allowed, re_enrollment_wait_days: =re_enrollment_wait_days, annual_consent_renewal_required: =annual_consent_renewal_required, enrollment_fee_usd: =enrollment_fee_usd}
        Kestrel Med Sync Monthly: {rx_eligibility_flag: =rx_eligibility_flag, requires_ninety_day_supply_allowed: =requires_ninety_day_supply_allowed, min_prior_fills: =min_prior_fills, requires_delivery_plan: =requires_delivery_plan, fulfillment_methods_allowed: =fulfillment_methods_allowed, re_enrollment_wait_days: =re_enrollment_wait_days, annual_consent_renewal_required: =annual_consent_renewal_required, enrollment_fee_usd: =enrollment_fee_usd}
        Kestrel Med Sync 90-Day: {rx_eligibility_flag: =rx_eligibility_flag, requires_ninety_day_supply_allowed: =requires_ninety_day_supply_allowed, min_prior_fills: =min_prior_fills, requires_delivery_plan: =requires_delivery_plan, fulfillment_methods_allowed: =fulfillment_methods_allowed, re_enrollment_wait_days: =re_enrollment_wait_days, annual_consent_renewal_required: =annual_consent_renewal_required, enrollment_fee_usd: =enrollment_fee_usd}
        Kestrel Med Sync with Adherence Packaging: {rx_eligibility_flag: =rx_eligibility_flag, requires_ninety_day_supply_allowed: =requires_ninety_day_supply_allowed, min_prior_fills: =min_prior_fills, requires_delivery_plan: =requires_delivery_plan, fulfillment_methods_allowed: =fulfillment_methods_allowed, re_enrollment_wait_days: =re_enrollment_wait_days, annual_consent_renewal_required: =annual_consent_renewal_required, enrollment_fee_usd: =enrollment_fee_usd}
        Kestrel Home Delivery Auto Refill: {rx_eligibility_flag: =rx_eligibility_flag, requires_ninety_day_supply_allowed: =requires_ninety_day_supply_allowed, min_prior_fills: =min_prior_fills, requires_delivery_plan: =requires_delivery_plan, fulfillment_methods_allowed: =fulfillment_methods_allowed, re_enrollment_wait_days: =re_enrollment_wait_days, annual_consent_renewal_required: =annual_consent_renewal_required, enrollment_fee_usd: =enrollment_fee_usd}
  - id: refill_evt_cycle_scheduling
    subject: [refill_cycle_scheduled, refill_cycle_filled, refill_activated]
    rule: >-
      A cycle is scheduled only while the enrollment is in active status, except the first cycle, which is scheduled at
      activation. Where cycle_date_basis is last_fill_date the cycle date is the prescription's refill-eligible date under
      the Prescriptions charter; where it is sync_day the cycle date is the next sync day on or after that refill-eligible
      date. The refill is processed refill_lead_days before the cycle date, plus packaging_prep_days for adherence
      packs, and dispenses days_supply_per_cycle, never more than the class and coverage allow. Where
      sync_short_fill_allowed is true and the prescription's next due date is at least short_fill_min_days before the
      sync day, a short fill covering exactly the days to the sync day is dispensed with sync_short_fill true and, where
      short_fill_prorated_copay is true, a copay prorated by those days over days_supply_per_cycle, rounded to the cent
      half up; fewer days are carried to the following sync day. A cycle is filled only once and only after any required
      confirmation. Cycles are dispensed at fill_location and delivered at default_delivery_speed where the enrollment
      is set to home_delivery. After ninety_day_conversion_after_cycles filled cycles, where above 0, Kestrel offers the
      patient the 90-day program; the patient decides.
    eligibility:
      - id: schedule_when_active
        applies_to: [refill_cycle_scheduled]
        kind: state
        condition: A cycle is scheduled only while the enrollment is in active status, except the first cycle, which is scheduled at activation.
        evidence_fields: [refill_enrollments.status, refill_enrollments.refill_enrollment_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [refill_enrollments.refill_enrollment_id]
          action_bindings:
            refill_enrollments.refill_enrollment_id: refill_enrollment_id
        state_contract:
          field: refill_enrollments.status
          allowed: [active]
      - id: fill_once
        applies_to: [refill_cycle_filled]
        kind: dedup
        condition: A cycle is filled only once and only after any required confirmation.
        evidence_fields: [refill_cycles.source_cycle_id, refill_cycles.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [refill_cycles.source_cycle_id]
          action_bindings:
            refill_cycles.source_cycle_id: source_cycle_id
        dedup_contract:
          table: refill_cycles
          mode: separate_record
          object_bindings: {source_cycle_id: source_cycle_id}
          duplicate_filters: {event_type: [refill_cycle_filled, refill_cycle_skipped]}
          distinct_fields: []
    params:
      per_tier:
        Kestrel Auto Refill 30-Day: {cycle_date_basis: =cycle_date_basis, refill_lead_days: =refill_lead_days, packaging_prep_days: =packaging_prep_days, days_supply_per_cycle: =days_supply_per_cycle, sync_short_fill_allowed: =sync_short_fill_allowed, short_fill_min_days: =short_fill_min_days, short_fill_prorated_copay: =short_fill_prorated_copay, fill_location: =fill_location, default_delivery_speed: =default_delivery_speed, ninety_day_conversion_after_cycles: =ninety_day_conversion_after_cycles}
        Kestrel Auto Refill 90-Day: {cycle_date_basis: =cycle_date_basis, refill_lead_days: =refill_lead_days, packaging_prep_days: =packaging_prep_days, days_supply_per_cycle: =days_supply_per_cycle, sync_short_fill_allowed: =sync_short_fill_allowed, short_fill_min_days: =short_fill_min_days, short_fill_prorated_copay: =short_fill_prorated_copay, fill_location: =fill_location, default_delivery_speed: =default_delivery_speed, ninety_day_conversion_after_cycles: =ninety_day_conversion_after_cycles}
        Kestrel Med Sync Monthly: {cycle_date_basis: =cycle_date_basis, refill_lead_days: =refill_lead_days, packaging_prep_days: =packaging_prep_days, days_supply_per_cycle: =days_supply_per_cycle, sync_short_fill_allowed: =sync_short_fill_allowed, short_fill_min_days: =short_fill_min_days, short_fill_prorated_copay: =short_fill_prorated_copay, fill_location: =fill_location, default_delivery_speed: =default_delivery_speed, ninety_day_conversion_after_cycles: =ninety_day_conversion_after_cycles}
        Kestrel Med Sync 90-Day: {cycle_date_basis: =cycle_date_basis, refill_lead_days: =refill_lead_days, packaging_prep_days: =packaging_prep_days, days_supply_per_cycle: =days_supply_per_cycle, sync_short_fill_allowed: =sync_short_fill_allowed, short_fill_min_days: =short_fill_min_days, short_fill_prorated_copay: =short_fill_prorated_copay, fill_location: =fill_location, default_delivery_speed: =default_delivery_speed, ninety_day_conversion_after_cycles: =ninety_day_conversion_after_cycles}
        Kestrel Med Sync with Adherence Packaging: {cycle_date_basis: =cycle_date_basis, refill_lead_days: =refill_lead_days, packaging_prep_days: =packaging_prep_days, days_supply_per_cycle: =days_supply_per_cycle, sync_short_fill_allowed: =sync_short_fill_allowed, short_fill_min_days: =short_fill_min_days, short_fill_prorated_copay: =short_fill_prorated_copay, fill_location: =fill_location, default_delivery_speed: =default_delivery_speed, ninety_day_conversion_after_cycles: =ninety_day_conversion_after_cycles}
        Kestrel Home Delivery Auto Refill: {cycle_date_basis: =cycle_date_basis, refill_lead_days: =refill_lead_days, packaging_prep_days: =packaging_prep_days, days_supply_per_cycle: =days_supply_per_cycle, sync_short_fill_allowed: =sync_short_fill_allowed, short_fill_min_days: =short_fill_min_days, short_fill_prorated_copay: =short_fill_prorated_copay, fill_location: =fill_location, default_delivery_speed: =default_delivery_speed, ninety_day_conversion_after_cycles: =ninety_day_conversion_after_cycles}
  - id: refill_evt_confirmation_and_holds
    subject: [refill_cycle_confirmed, refill_cycle_held]
    rule: >-
      A cycle needs the patient's confirmation where confirmation_required is true, and also where
      medicare_shipment_confirmation_required is true and the patient's primary coverage is a Medicare class. The
      confirmation is the patient's own act, made by the patient or, where caregiver_confirmation_allowed is true, a
      caregiver, by phone or, where text_confirmation_allowed is true, by text reply. A cycle is confirmed at most once.
      A required confirmation not received within confirmation_window_hours of the request holds the cycle as
      no_confirmation where no_confirmation_action is hold_cycle. A cycle is also held as price_change when its patient
      pay exceeds the previous fill's by more than price_change_hold_threshold_usd, as insurance_change where
      hold_on_insurance_change is true and the coverage differs from the previous fill's, as claim_rejected when the
      insurance rejection persists for reject_retry_days, and as no_refills_remaining when the prescription has no
      refill left, in which case a renewal request is sent where auto_renewal_request is true. After
      consecutive_failures_pause_threshold held cycles in a row, measured by refill_msr_consecutive_holds, no further
      cycle is scheduled until the patient confirms the enrollment should continue.
    eligibility:
      - id: confirm_once
        applies_to: [refill_cycle_confirmed]
        kind: dedup
        condition: A cycle is confirmed at most once.
        evidence_fields: [refill_cycles.source_cycle_id, refill_cycles.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [refill_cycles.source_cycle_id]
          action_bindings:
            refill_cycles.source_cycle_id: source_cycle_id
        dedup_contract:
          table: refill_cycles
          mode: separate_record
          object_bindings: {source_cycle_id: source_cycle_id}
          duplicate_filters: {event_type: [refill_cycle_confirmed]}
          distinct_fields: []
    params:
      per_tier:
        Kestrel Auto Refill 30-Day: {confirmation_required: =confirmation_required, medicare_shipment_confirmation_required: =medicare_shipment_confirmation_required, caregiver_confirmation_allowed: =caregiver_confirmation_allowed, text_confirmation_allowed: =text_confirmation_allowed, confirmation_window_hours: =confirmation_window_hours, no_confirmation_action: =no_confirmation_action, price_change_hold_threshold_usd: =price_change_hold_threshold_usd, hold_on_insurance_change: =hold_on_insurance_change, reject_retry_days: =reject_retry_days, auto_renewal_request: =auto_renewal_request, consecutive_failures_pause_threshold: =consecutive_failures_pause_threshold}
        Kestrel Auto Refill 90-Day: {confirmation_required: =confirmation_required, medicare_shipment_confirmation_required: =medicare_shipment_confirmation_required, caregiver_confirmation_allowed: =caregiver_confirmation_allowed, text_confirmation_allowed: =text_confirmation_allowed, confirmation_window_hours: =confirmation_window_hours, no_confirmation_action: =no_confirmation_action, price_change_hold_threshold_usd: =price_change_hold_threshold_usd, hold_on_insurance_change: =hold_on_insurance_change, reject_retry_days: =reject_retry_days, auto_renewal_request: =auto_renewal_request, consecutive_failures_pause_threshold: =consecutive_failures_pause_threshold}
        Kestrel Med Sync Monthly: {confirmation_required: =confirmation_required, medicare_shipment_confirmation_required: =medicare_shipment_confirmation_required, caregiver_confirmation_allowed: =caregiver_confirmation_allowed, text_confirmation_allowed: =text_confirmation_allowed, confirmation_window_hours: =confirmation_window_hours, no_confirmation_action: =no_confirmation_action, price_change_hold_threshold_usd: =price_change_hold_threshold_usd, hold_on_insurance_change: =hold_on_insurance_change, reject_retry_days: =reject_retry_days, auto_renewal_request: =auto_renewal_request, consecutive_failures_pause_threshold: =consecutive_failures_pause_threshold}
        Kestrel Med Sync 90-Day: {confirmation_required: =confirmation_required, medicare_shipment_confirmation_required: =medicare_shipment_confirmation_required, caregiver_confirmation_allowed: =caregiver_confirmation_allowed, text_confirmation_allowed: =text_confirmation_allowed, confirmation_window_hours: =confirmation_window_hours, no_confirmation_action: =no_confirmation_action, price_change_hold_threshold_usd: =price_change_hold_threshold_usd, hold_on_insurance_change: =hold_on_insurance_change, reject_retry_days: =reject_retry_days, auto_renewal_request: =auto_renewal_request, consecutive_failures_pause_threshold: =consecutive_failures_pause_threshold}
        Kestrel Med Sync with Adherence Packaging: {confirmation_required: =confirmation_required, medicare_shipment_confirmation_required: =medicare_shipment_confirmation_required, caregiver_confirmation_allowed: =caregiver_confirmation_allowed, text_confirmation_allowed: =text_confirmation_allowed, confirmation_window_hours: =confirmation_window_hours, no_confirmation_action: =no_confirmation_action, price_change_hold_threshold_usd: =price_change_hold_threshold_usd, hold_on_insurance_change: =hold_on_insurance_change, reject_retry_days: =reject_retry_days, auto_renewal_request: =auto_renewal_request, consecutive_failures_pause_threshold: =consecutive_failures_pause_threshold}
        Kestrel Home Delivery Auto Refill: {confirmation_required: =confirmation_required, medicare_shipment_confirmation_required: =medicare_shipment_confirmation_required, caregiver_confirmation_allowed: =caregiver_confirmation_allowed, text_confirmation_allowed: =text_confirmation_allowed, confirmation_window_hours: =confirmation_window_hours, no_confirmation_action: =no_confirmation_action, price_change_hold_threshold_usd: =price_change_hold_threshold_usd, hold_on_insurance_change: =hold_on_insurance_change, reject_retry_days: =reject_retry_days, auto_renewal_request: =auto_renewal_request, consecutive_failures_pause_threshold: =consecutive_failures_pause_threshold}
    measures: [refill_msr_consecutive_holds]
  - id: refill_evt_skips
    subject: [refill_cycle_skipped, refill_skip_allowance_granted]
    rule: >-
      The enrollment is credited skips_per_program_year skips at enrollment and at each program-year anniversary; unused
      skips lapse at the anniversary and are not carried over. A cycle is skipped only when skips_remaining is at least
      1, when refill_msr_consecutive_skips is below max_consecutive_skips, and when the skip is asked for no later than
      cycle_cancel_cutoff_hours before the cycle is processed. A skipped cycle moves the next cycle to the following
      cycle date and consumes one skip. A skip is the patient's own request. Once no skip remains the patient may pause
      or unenroll instead.
    eligibility:
      - id: skip_available
        applies_to: [refill_cycle_skipped]
        kind: authorization
        condition: A cycle is skipped only when skips_remaining is at least 1, when refill_msr_consecutive_skips is below max_consecutive_skips, and when the skip is asked for no later than cycle_cancel_cutoff_hours before the cycle is processed.
        evidence_fields: [refill_enrollments.skips_remaining, refill_enrollments.refill_enrollment_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [refill_enrollments.refill_enrollment_id]
          action_bindings:
            refill_enrollments.refill_enrollment_id: refill_enrollment_id
    params:
      per_tier:
        Kestrel Auto Refill 30-Day: {skips_per_program_year: =skips_per_program_year, max_consecutive_skips: =max_consecutive_skips, cycle_cancel_cutoff_hours: =cycle_cancel_cutoff_hours}
        Kestrel Auto Refill 90-Day: {skips_per_program_year: =skips_per_program_year, max_consecutive_skips: =max_consecutive_skips, cycle_cancel_cutoff_hours: =cycle_cancel_cutoff_hours}
        Kestrel Med Sync Monthly: {skips_per_program_year: =skips_per_program_year, max_consecutive_skips: =max_consecutive_skips, cycle_cancel_cutoff_hours: =cycle_cancel_cutoff_hours}
        Kestrel Med Sync 90-Day: {skips_per_program_year: =skips_per_program_year, max_consecutive_skips: =max_consecutive_skips, cycle_cancel_cutoff_hours: =cycle_cancel_cutoff_hours}
        Kestrel Med Sync with Adherence Packaging: {skips_per_program_year: =skips_per_program_year, max_consecutive_skips: =max_consecutive_skips, cycle_cancel_cutoff_hours: =cycle_cancel_cutoff_hours}
        Kestrel Home Delivery Auto Refill: {skips_per_program_year: =skips_per_program_year, max_consecutive_skips: =max_consecutive_skips, cycle_cancel_cutoff_hours: =cycle_cancel_cutoff_hours}
    formula:
      skips_granted: skips_per_program_year
    measures: [refill_msr_consecutive_skips]
  - id: refill_pause_resume
    subject: [refill_paused, refill_resumed]
    rule: >-
      An enrollment is paused only where pause_allowed is true, for no more than max_pause_days, and only while
      refill_msr_pauses_program_year is below pauses_per_program_year; pausing is the patient's own request. Where
      auto_resume_after_pause is true the enrollment resumes on the day after pause_until_date, and the next cycle date
      is recalculated from the prescription's refill-eligible date; where it is false it resumes only after a pharmacist
      review of the medication list, and a pause left unresolved beyond max_pause_days ends the enrollment as
      pause_expired.
    eligibility: []
    params:
      per_tier:
        Kestrel Auto Refill 30-Day: {pause_allowed: =pause_allowed, max_pause_days: =max_pause_days, pauses_per_program_year: =pauses_per_program_year, auto_resume_after_pause: =auto_resume_after_pause}
        Kestrel Auto Refill 90-Day: {pause_allowed: =pause_allowed, max_pause_days: =max_pause_days, pauses_per_program_year: =pauses_per_program_year, auto_resume_after_pause: =auto_resume_after_pause}
        Kestrel Med Sync Monthly: {pause_allowed: =pause_allowed, max_pause_days: =max_pause_days, pauses_per_program_year: =pauses_per_program_year, auto_resume_after_pause: =auto_resume_after_pause}
        Kestrel Med Sync 90-Day: {pause_allowed: =pause_allowed, max_pause_days: =max_pause_days, pauses_per_program_year: =pauses_per_program_year, auto_resume_after_pause: =auto_resume_after_pause}
        Kestrel Med Sync with Adherence Packaging: {pause_allowed: =pause_allowed, max_pause_days: =max_pause_days, pauses_per_program_year: =pauses_per_program_year, auto_resume_after_pause: =auto_resume_after_pause}
        Kestrel Home Delivery Auto Refill: {pause_allowed: =pause_allowed, max_pause_days: =max_pause_days, pauses_per_program_year: =pauses_per_program_year, auto_resume_after_pause: =auto_resume_after_pause}
    measures: [refill_msr_pauses_program_year]
  - id: refill_unenrollment
    subject: [refill_unenrolled, refill_auto_unenrolled, refill_settings_updated]
    rule: >-
      The patient may stop an enrollment at any time; stopping is the patient's own request and does not cancel a cycle
      already dispensed. The program ends an enrollment as prescription_closed when its prescription expires, is
      transferred out or is discontinued; as consecutive_unpicked when refill_msr_consecutive_rts reaches
      consecutive_rts_unenroll_threshold; as program_change when the patient's prescriptions move into a Med Sync group;
      as consent_not_renewed where annual renewal was required and not given; and as pause_expired under
      refill_pause_resume. A patient may change the fulfilment method to another of fulfillment_methods_allowed and, for
      Med Sync, the sync day under refill_agg_sync_group, effective from the next unprocessed cycle.
    eligibility: []
    params:
      per_tier:
        Kestrel Auto Refill 30-Day: {consecutive_rts_unenroll_threshold: =consecutive_rts_unenroll_threshold, fulfillment_methods_allowed: =fulfillment_methods_allowed}
        Kestrel Auto Refill 90-Day: {consecutive_rts_unenroll_threshold: =consecutive_rts_unenroll_threshold, fulfillment_methods_allowed: =fulfillment_methods_allowed}
        Kestrel Med Sync Monthly: {consecutive_rts_unenroll_threshold: =consecutive_rts_unenroll_threshold, fulfillment_methods_allowed: =fulfillment_methods_allowed}
        Kestrel Med Sync 90-Day: {consecutive_rts_unenroll_threshold: =consecutive_rts_unenroll_threshold, fulfillment_methods_allowed: =fulfillment_methods_allowed}
        Kestrel Med Sync with Adherence Packaging: {consecutive_rts_unenroll_threshold: =consecutive_rts_unenroll_threshold, fulfillment_methods_allowed: =fulfillment_methods_allowed}
        Kestrel Home Delivery Auto Refill: {consecutive_rts_unenroll_threshold: =consecutive_rts_unenroll_threshold, fulfillment_methods_allowed: =fulfillment_methods_allowed}
    measures: [refill_msr_consecutive_rts]
  - id: refill_adherence_packaging
    subject: [refill_cycle_filled]
    rule: >-
      Where adherence_packaging is true each cycle is dispensed as cards covering packaging_card_days, prepared with
      packaging_prep_days of extra lead time. A dose change reaches the next packs only when it is on file at least
      packaging_change_cutoff_days before processing; a later change is dispensed separately in a vial until the next
      cycle. Where controlled_in_packaging_allowed is false controlled substances are never placed in the packs and stay
      in vials. Where pharmacist_review_per_cycle is true a pharmacist reviews the patient's whole medication list before
      each cycle is dispensed. Where adherence_packaging is false the cycle is dispensed in ordinary vials.
    eligibility: []
    params:
      per_tier:
        Kestrel Auto Refill 30-Day: {adherence_packaging: =adherence_packaging, packaging_card_days: =packaging_card_days, packaging_prep_days: =packaging_prep_days, packaging_change_cutoff_days: =packaging_change_cutoff_days, controlled_in_packaging_allowed: =controlled_in_packaging_allowed, pharmacist_review_per_cycle: =pharmacist_review_per_cycle}
        Kestrel Auto Refill 90-Day: {adherence_packaging: =adherence_packaging, packaging_card_days: =packaging_card_days, packaging_prep_days: =packaging_prep_days, packaging_change_cutoff_days: =packaging_change_cutoff_days, controlled_in_packaging_allowed: =controlled_in_packaging_allowed, pharmacist_review_per_cycle: =pharmacist_review_per_cycle}
        Kestrel Med Sync Monthly: {adherence_packaging: =adherence_packaging, packaging_card_days: =packaging_card_days, packaging_prep_days: =packaging_prep_days, packaging_change_cutoff_days: =packaging_change_cutoff_days, controlled_in_packaging_allowed: =controlled_in_packaging_allowed, pharmacist_review_per_cycle: =pharmacist_review_per_cycle}
        Kestrel Med Sync 90-Day: {adherence_packaging: =adherence_packaging, packaging_card_days: =packaging_card_days, packaging_prep_days: =packaging_prep_days, packaging_change_cutoff_days: =packaging_change_cutoff_days, controlled_in_packaging_allowed: =controlled_in_packaging_allowed, pharmacist_review_per_cycle: =pharmacist_review_per_cycle}
        Kestrel Med Sync with Adherence Packaging: {adherence_packaging: =adherence_packaging, packaging_card_days: =packaging_card_days, packaging_prep_days: =packaging_prep_days, packaging_change_cutoff_days: =packaging_change_cutoff_days, controlled_in_packaging_allowed: =controlled_in_packaging_allowed, pharmacist_review_per_cycle: =pharmacist_review_per_cycle}
        Kestrel Home Delivery Auto Refill: {adherence_packaging: =adherence_packaging, packaging_card_days: =packaging_card_days, packaging_prep_days: =packaging_prep_days, packaging_change_cutoff_days: =packaging_change_cutoff_days, controlled_in_packaging_allowed: =controlled_in_packaging_allowed, pharmacist_review_per_cycle: =pharmacist_review_per_cycle}
