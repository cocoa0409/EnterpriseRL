category: rewards
display_name: Kestrel Care Rewards

binding:
  holding_table: rewards_memberships
  event_tables: [rewards_activity]
  status_field: status
  variant_field: variant_name
  quantity_fields: {points_balance: points, kestrel_cash_balance_usd: kestrel_cash, plus_fees_net_usd: plus_fees}

lifecycle:
  states: [enrolled, active, suspended, closed]
  transitions:
    - {from: enrolled, to: active, by: system, means: The membership is linked to the patient's profile and its first qualifying activity or Plus fee posts.}
    - {from: active, to: suspended, by: agent, means: A Plus fee could not be collected after its grace period.}
    - {from: suspended, to: active, by: agent, means: The unpaid Plus fee is collected within the reinstatement window.}
    - {from: enrolled, to: closed, by: user, means: The patient closes the membership before it is activated.}
    - {from: active, to: closed, by: user, means: The patient closes the membership.}
    - {from: suspended, to: closed, by: system, means: The reinstatement window ends without payment, or the membership is closed for inactivity.}

accounts:
  - key: points
    unit: points
    meaning: Unconverted rewards points; credited when points are earned or given as goodwill, debited when points are converted to Kestrel Cash, expire or are reversed.
  - key: kestrel_cash
    unit: USD
    meaning: Kestrel Cash rewards available to spend; credited when cash is issued, debited when it is redeemed or expires.
  - key: plus_fees
    unit: USD
    meaning: Plus membership fees paid net of refunds; credited when a fee is charged, debited when a fee is refunded.

parameter_schema:
  membership_fee_usd: Fee per billing cycle of a paid membership, USD.
  fee_billing_cycle_months: Calendar months per billing cycle of a paid membership, integer months; 0 for free levels.
  plus_trial_days: Calendar days of free trial before the first Plus fee, integer days.
  fee_refund_window_days: Calendar days after a fee is charged within which it is refunded in full on cancellation, integer days.
  annual_prorated_refund: Whether cancelling after the refund window refunds the unused whole months, boolean.
  plus_cancellation_effective: When a Plus cancellation takes effect, enum end_of_cycle | immediate | not_applicable.
  fee_failure_grace_days: Calendar days after a failed Plus fee before the membership is suspended, integer days.
  suspension_on_fee_failure: Whether an unpaid fee suspends the membership, boolean.
  reinstatement_window_days: Calendar days after suspension within which the membership may be reinstated, integer days.
  min_age_years: Minimum age in whole years to enroll, integer years.
  tier_year_basis: Period over which qualifying spend is measured, enum calendar_year | not_applicable.
  qualifying_spend_min_usd: Qualifying front-store spend in the tier year needed to reach or keep the level, USD.
  tier_hold_months_after_year_end: Calendar months into the new tier year that a level is kept before it is reviewed, integer months.
  welcome_bonus_points: Points credited when the membership is opened at this level, integer points.
  points_per_dollar_front_store: Points per whole dollar of eligible front-store spend, integer points.
  points_per_dollar_store_brand: Points per whole dollar of Kestrel store-brand spend, integer points.
  front_store_points_cap_per_day: Most front-store points earned per calendar day, integer points.
  points_per_rx_fill: Points per eligible prescription fill picked up, integer points.
  rx_points_cap_per_365_days: Most prescription points in any rolling 365 days, integer points.
  rx_milestone_fills: Eligible prescription fills that earn one milestone reward, integer.
  rx_milestone_reward_usd: Kestrel Cash issued at each prescription milestone, USD.
  points_per_vaccination: Points per eligible vaccine dose, integer points.
  vaccination_points_cap_per_365_days: Most vaccination points in any rolling 365 days, integer points.
  double_points_days_per_year: Promotional days per calendar year on which front-store points are doubled, integer.
  birthday_bonus_points: Points credited once a year in the patient's birth month, integer points.
  points_pending_days: Calendar days after purchase before front-store points post, integer days.
  points_per_cash_block: Points converted into one block of Kestrel Cash, integer points.
  cash_per_block_usd: Kestrel Cash issued per converted block, USD.
  auto_convert: Whether whole blocks convert to Kestrel Cash automatically, boolean.
  points_expire: Whether unconverted points expire after inactivity, boolean.
  points_inactivity_expiry_months: Calendar months without earning activity after which unconverted points expire, integer months.
  cash_validity_days: Calendar days a Kestrel Cash reward stays usable after issue, integer days.
  cash_reissue_allowed_if_expired: Whether an expired Kestrel Cash reward may be reissued once as a courtesy, boolean.
  cash_reissue_window_days: Calendar days after expiry within which a courtesy reissue may be made, integer days.
  max_cash_reissues_per_365_days: Most courtesy reissues in any rolling 365 days, integer.
  redemption_max_per_transaction_usd: Most Kestrel Cash applied to one purchase, USD.
  cash_redeemable_on_rx_copay: Whether Kestrel Cash may pay a prescription copay, boolean.
  plus_monthly_credit_usd: Kestrel Cash issued to a Plus member each calendar month, USD.
  plus_monthly_credit_validity_days: Calendar days the monthly Plus credit stays usable, integer days.
  store_brand_discount_pct: Percent off Kestrel store-brand items at checkout, integer percent.
  free_rx_delivery: Whether prescription deliveries carry no same-day or express fee for the member, boolean.
  goodwill_points_dispensing_error: Points credited for a confirmed dispensing error, integer points.
  goodwill_points_delivery_failure: Points credited for a failed or lost prescription delivery, integer points.
  goodwill_points_service_recovery: Points credited for another documented service failure, integer points.
  max_goodwill_credits_per_365_days: Most goodwill credits in any rolling 365 days, integer.
  receipt_lookback_days: Calendar days after a purchase within which missing points may be claimed, integer days.
  missing_points_claims_per_365_days: Most missing-points claims in any rolling 365 days, integer.
  inactivity_close_months: Calendar months without any activity after which a free membership closes, integer months; 0 means never.

