events:
  - type: rewards_enrolled
    target: rewards_memberships
    mutation: create
    meaning: The patient joins Kestrel Care Rewards.
    grain: one row per membership
    fields:
      membership_id: id of the membership
      customer_id: the patient
      variant_name: membership level
      status: enrolled
      member_number: 11-digit rewards card number
      tier_year_start: 1 January of the current year for free levels, empty for Plus
      opened_date: date joined
    triggers:
      - event: rewards:rewards_points_earned
        when: {variant_name: [Kestrel Care Rewards Member, Kestrel Care Rewards Plus Monthly, Kestrel Care Rewards Plus Annual]}
        map: {membership_id: membership_id, customer_id: customer_id, event_date: opened_date, earn_source: welcome_bonus}
  - type: rewards_activated
    target: rewards_memberships
    mutation: {transition: {from: enrolled, to: active}}
    meaning: The membership becomes active.
    grain: one row per transaction
    fields:
      membership_id: the membership
      status: active
      cycle_start_date: first day of the first Plus billing cycle, empty for free levels
    triggers: []
  - type: rewards_tier_changed
    target: rewards_memberships
    mutation: update
    meaning: The membership moves to another level, by qualifying spend or by joining or leaving Plus.
    grain: one row per transaction
    fields:
      membership_id: the membership
      variant_name: new level
      tier_year_start: tier year the new level is measured in
      cycle_start_date: first Plus billing cycle when moving to Plus, else unchanged
    triggers: []
  - type: rewards_suspended
    target: rewards_memberships
    mutation: {transition: {from: active, to: suspended}}
    meaning: A Plus membership is suspended for an unpaid fee.
    grain: one row per transaction
    fields:
      membership_id: the membership
      status: suspended
      suspended_date: date suspended
    triggers: []
  - type: rewards_reinstated
    target: rewards_memberships
    mutation: {transition: {from: suspended, to: active}}
    meaning: A suspended membership is reinstated after payment.
    grain: one row per transaction
    fields:
      membership_id: the membership
      status: active
      suspended_date: cleared
    triggers: []
  - type: rewards_closed
    target: rewards_memberships
    mutation: {transition: [{from: enrolled, to: closed}, {from: active, to: closed}]}
    meaning: The patient closes the membership.
    grain: one row per transaction
    fields:
      membership_id: the membership
      status: closed
      closed_date: date closed
    triggers: []
  - type: rewards_closed_inactive
    target: rewards_memberships
    mutation: {transition: {from: suspended, to: closed}}
    meaning: A suspended membership closes because it was not reinstated in time.
    grain: one row per transaction
    fields:
      membership_id: the membership
      status: closed
      closed_date: date closed
    triggers: []
  - type: rewards_points_earned
    target: rewards_activity
    meaning: Points are credited for a purchase, a prescription, a vaccination or a bonus.
    grain: one row per earning occasion
    distinguish_by: [earn_source, source_ref_id, event_date]
    fields:
      activity_id: id of this entry
      membership_id: the membership
      customer_id: the patient
      event_date: date the points posted
      earn_source: what earned the points
      source_ref_id: the purchase, fill or dose that earned them, empty for bonuses
      purchase_amount_usd: eligible spend for a purchase, 0.00 otherwise
      points_multiplier: 2 on a double-points day, else 1
      points: points credited
      store_id: store of the purchase, fill or dose
    account: points
    direction: in
    triggers: []
  - type: rewards_goodwill_credit
    target: rewards_activity
    meaning: Goodwill points are credited to make up for a documented service failure.
    grain: one row per goodwill credit
    distinguish_by: [source_ref_id, credit_reason]
    fields:
      activity_id: id of this entry
      membership_id: the membership
      customer_id: the patient
      event_date: date credited
      source_ref_id: the record documenting the failure
      credit_reason: dispensing_error, delivery_failure or service_recovery
      points: points credited
    account: points
    direction: in
    triggers: []
  - type: rewards_points_reversed
    target: rewards_activity
    meaning: Points earned on a purchase that was returned or a fill that was reversed are taken back.
    grain: one row per earning entry reversed
    distinguish_by: [source_activity_id]
    fields:
      activity_id: id of this entry
      membership_id: the membership
      customer_id: the patient
      event_date: date reversed
      source_activity_id: the earning entry reversed
      points: points taken back
    account: points
    direction: out
    triggers: []
  - type: rewards_points_expired
    target: rewards_activity
    meaning: Unconverted points expire after the inactivity period.
    grain: one row per expiry run on the membership
    distinguish_by: [event_date]
    fields:
      activity_id: id of this entry
      membership_id: the membership
      customer_id: the patient
      event_date: date expired
      points: points expired
    account: points
    direction: out
    triggers: []
  - type: rewards_points_converted
    target: rewards_activity
    meaning: Whole blocks of points are converted into Kestrel Cash.
    grain: one row per conversion
    distinguish_by: [event_date]
    fields:
      activity_id: id of this entry
      membership_id: the membership
      customer_id: the patient
      event_date: date converted
      points: points converted, a whole number of blocks
    account: points
    direction: out
    triggers:
      - event: rewards:rewards_cash_issued
        map: {membership_id: membership_id, customer_id: customer_id, event_date: event_date, source_activity_id: activity_id, issue_reason: points_conversion}
  - type: rewards_cash_issued
    target: rewards_activity
    meaning: A Kestrel Cash reward is issued.
    grain: one row per reward issued
    distinguish_by: [issue_reason, source_activity_id, event_date]
    fields:
      activity_id: id of this entry
      membership_id: the membership
      customer_id: the patient
      event_date: date issued
      issue_reason: points_conversion, plus_monthly_credit, rx_milestone or courtesy_reissue
      source_activity_id: the conversion or expired reward it comes from, empty otherwise
      amount_usd: amount issued
      cash_expiration_date: last day the reward can be used
    account: kestrel_cash
    direction: in
    triggers: []
  - type: rewards_cash_redeemed
    target: rewards_activity
    meaning: Kestrel Cash is applied to a purchase.
    grain: one row per purchase paid with Kestrel Cash
    distinguish_by: [source_ref_id]
    fields:
      activity_id: id of this entry
      membership_id: the membership
      customer_id: the patient
      event_date: date redeemed
      source_ref_id: the purchase it was applied to
      amount_usd: amount applied
      store_id: store of the purchase
    account: kestrel_cash
    direction: out
    triggers: []
  - type: rewards_cash_expired
    target: rewards_activity
    meaning: An unused Kestrel Cash reward expires.
    grain: one row per reward expired
    distinguish_by: [source_activity_id]
    fields:
      activity_id: id of this entry
      membership_id: the membership
      customer_id: the patient
      event_date: date expired
      source_activity_id: the reward that expired
      amount_usd: unused amount expired
    account: kestrel_cash
    direction: out
    triggers: []
  - type: rewards_plus_fee_charged
    target: rewards_activity
    meaning: A Plus membership fee is charged for a billing cycle.
    grain: one row per cycle charged
    distinguish_by: [billing_period_start]
    fields:
      activity_id: id of this entry
      membership_id: the membership
      customer_id: the patient
      event_date: date charged
      billing_period_start: first day of the cycle paid for
      amount_usd: fee charged
    account: plus_fees
    direction: in
    triggers: []
  - type: rewards_plus_fee_refunded
    target: rewards_activity
    meaning: A Plus membership fee is refunded.
    grain: one row per fee refunded
    distinguish_by: [source_activity_id]
    fields:
      activity_id: id of this entry
      membership_id: the membership
      customer_id: the patient
      event_date: date refunded
      source_activity_id: the fee refunded
      amount_usd: amount refunded
    account: plus_fees
    direction: out
    triggers: []

measures:
  - id: rewards_msr_qualifying_spend
    window: the tier year, 1 January to 31 December
    measure: sum of purchase_amount_usd of rewards_points_earned rows with earn_source front_store_purchase in the window, less those reversed
  - id: rewards_msr_rx_points_365d
    window: rolling 365 calendar days ending on today, inclusive
    measure: sum of points of rewards_points_earned rows with earn_source prescription_fill, not reversed
  - id: rewards_msr_vax_points_365d
    window: rolling 365 calendar days ending on today, inclusive
    measure: sum of points of rewards_points_earned rows with earn_source vaccination, not reversed
  - id: rewards_msr_goodwill_365d
    window: rolling 365 calendar days ending on today, inclusive
    measure: count of rewards_goodwill_credit rows on the membership
  - id: rewards_msr_missing_claims_365d
    window: rolling 365 calendar days ending on today, inclusive
    measure: count of rewards_points_earned rows with earn_source missing_points_claim
  - id: rewards_msr_reissues_365d
    window: rolling 365 calendar days ending on today, inclusive
    measure: count of rewards_cash_issued rows with issue_reason courtesy_reissue
  - id: rewards_msr_rx_fills_since_milestone
    window: since the most recent rewards_cash_issued row with issue_reason rx_milestone, or since enrollment
    measure: count of rewards_points_earned rows with earn_source prescription_fill, not reversed

policies:
  - id: rewards_agg_multi_holding
    subject: [rewards_enrolled]
    rule: >-
      A patient holds at most one Kestrel Care Rewards membership that is not closed. Moving between levels, including
      joining or leaving Plus, changes the level of the same membership and keeps its points and Kestrel Cash; a closed
      membership stays on the profile as history and a new one may then be opened.
    eligibility: []
    params:
      max_per_customer: 1
  - id: rewards_tier_qualification
    subject: [rewards_enrolled, rewards_tier_changed]
    rule: >-
      A new free membership starts at Kestrel Care Rewards Member; the patient must be at least min_age_years old.
      Qualifying spend is measured over the tier year named by tier_year_basis, which for free levels is the calendar
      year. A free
      membership moves up to the highest free level whose qualifying_spend_min_usd is met by rewards_msr_qualifying_spend
      on the day it is met. At the start of a tier year the level is kept for tier_hold_months_after_year_end months and
      then set to the highest free level the previous tier year's qualifying spend met. Prescription purchases never count
      toward qualifying spend. A patient joins Plus Monthly or Plus Annual by paying its fee, which moves the membership
      to that level whatever its spend; leaving Plus returns it to the free level its current qualifying spend meets.
    eligibility: []
    params:
      per_tier:
        Kestrel Care Rewards Member: {qualifying_spend_min_usd: =qualifying_spend_min_usd, tier_hold_months_after_year_end: =tier_hold_months_after_year_end, min_age_years: =min_age_years, tier_year_basis: =tier_year_basis}
        Kestrel Care Rewards Silver: {qualifying_spend_min_usd: =qualifying_spend_min_usd, tier_hold_months_after_year_end: =tier_hold_months_after_year_end, min_age_years: =min_age_years, tier_year_basis: =tier_year_basis}
        Kestrel Care Rewards Gold: {qualifying_spend_min_usd: =qualifying_spend_min_usd, tier_hold_months_after_year_end: =tier_hold_months_after_year_end, min_age_years: =min_age_years, tier_year_basis: =tier_year_basis}
        Kestrel Care Rewards Platinum: {qualifying_spend_min_usd: =qualifying_spend_min_usd, tier_hold_months_after_year_end: =tier_hold_months_after_year_end, min_age_years: =min_age_years, tier_year_basis: =tier_year_basis}
        Kestrel Care Rewards Plus Monthly: {qualifying_spend_min_usd: =qualifying_spend_min_usd, tier_hold_months_after_year_end: =tier_hold_months_after_year_end, min_age_years: =min_age_years, tier_year_basis: =tier_year_basis}
        Kestrel Care Rewards Plus Annual: {qualifying_spend_min_usd: =qualifying_spend_min_usd, tier_hold_months_after_year_end: =tier_hold_months_after_year_end, min_age_years: =min_age_years, tier_year_basis: =tier_year_basis}
    measures: [rewards_msr_qualifying_spend]
  - id: rewards_evt_points_earning
    subject: [rewards_points_earned]
    rule: >-
      Points are earned only while the membership is enrolled or active; the welcome bonus posts on enrollment. The
      welcome bonus is welcome_bonus_points, credited once when the membership opens at a level where it is above 0.
      Front-store spend earns points_per_dollar_front_store per whole dollar, store-brand spend
      points_per_dollar_store_brand, times points_multiplier, which is 2 on one of the double_points_days_per_year
      promotional days and 1 otherwise, no more than front_store_points_cap_per_day per day, posting
      points_pending_days after the purchase. A prescription fill earns points_per_rx_fill when picked up, and a vaccine
      dose points_per_vaccination when given, but neither earns anything when it was dispensed at a store in one of the
      rx_points_excluded_states, when it was billed to a coverage class whose rx_rewards_points_allowed is false, or when a
      savings program whose rewards_points_on_program_fills is false paid part of it; prescription points stop at
      rx_points_cap_per_365_days and vaccination points at vaccination_points_cap_per_365_days. Every rx_milestone_fills
      point-earning fills issue rx_milestone_reward_usd of Kestrel Cash. The birthday bonus of birthday_bonus_points posts
      once a year in the birth month.
      An occasion earns points once.
    eligibility:
      - id: earn_on_open_membership
        applies_to: [rewards_points_earned]
        kind: state
        condition: Points are earned only while the membership is enrolled or active; the welcome bonus posts on enrollment.
        evidence_fields: [rewards_memberships.status, rewards_memberships.membership_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rewards_memberships.membership_id]
          action_bindings:
            rewards_memberships.membership_id: membership_id
        state_contract:
          field: rewards_memberships.status
          allowed: [enrolled, active]
      - id: earn_once
        applies_to: [rewards_points_earned]
        kind: dedup
        condition: An occasion earns points once.
        evidence_fields: [rewards_activity.source_ref_id, rewards_activity.earn_source, rewards_activity.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rewards_activity.source_ref_id, rewards_activity.earn_source]
          action_bindings:
            rewards_activity.source_ref_id: source_ref_id
            rewards_activity.earn_source: earn_source
        dedup_contract:
          table: rewards_activity
          mode: separate_record
          object_bindings: {source_ref_id: source_ref_id, earn_source: earn_source}
          duplicate_filters: {event_type: [rewards_points_earned]}
          distinct_fields: [event_date]
    params:
      rx_points_excluded_states: [AL, AR, MS, NJ, NY, OR, PR]
      per_tier:
        Kestrel Care Rewards Member: {welcome_bonus_points: =welcome_bonus_points, points_per_dollar_front_store: =points_per_dollar_front_store, points_per_dollar_store_brand: =points_per_dollar_store_brand, front_store_points_cap_per_day: =front_store_points_cap_per_day, points_pending_days: =points_pending_days, double_points_days_per_year: =double_points_days_per_year, points_per_rx_fill: =points_per_rx_fill, rx_points_cap_per_365_days: =rx_points_cap_per_365_days, points_per_vaccination: =points_per_vaccination, vaccination_points_cap_per_365_days: =vaccination_points_cap_per_365_days, rx_milestone_fills: =rx_milestone_fills, rx_milestone_reward_usd: =rx_milestone_reward_usd, birthday_bonus_points: =birthday_bonus_points}
        Kestrel Care Rewards Silver: {welcome_bonus_points: =welcome_bonus_points, points_per_dollar_front_store: =points_per_dollar_front_store, points_per_dollar_store_brand: =points_per_dollar_store_brand, front_store_points_cap_per_day: =front_store_points_cap_per_day, points_pending_days: =points_pending_days, double_points_days_per_year: =double_points_days_per_year, points_per_rx_fill: =points_per_rx_fill, rx_points_cap_per_365_days: =rx_points_cap_per_365_days, points_per_vaccination: =points_per_vaccination, vaccination_points_cap_per_365_days: =vaccination_points_cap_per_365_days, rx_milestone_fills: =rx_milestone_fills, rx_milestone_reward_usd: =rx_milestone_reward_usd, birthday_bonus_points: =birthday_bonus_points}
        Kestrel Care Rewards Gold: {welcome_bonus_points: =welcome_bonus_points, points_per_dollar_front_store: =points_per_dollar_front_store, points_per_dollar_store_brand: =points_per_dollar_store_brand, front_store_points_cap_per_day: =front_store_points_cap_per_day, points_pending_days: =points_pending_days, double_points_days_per_year: =double_points_days_per_year, points_per_rx_fill: =points_per_rx_fill, rx_points_cap_per_365_days: =rx_points_cap_per_365_days, points_per_vaccination: =points_per_vaccination, vaccination_points_cap_per_365_days: =vaccination_points_cap_per_365_days, rx_milestone_fills: =rx_milestone_fills, rx_milestone_reward_usd: =rx_milestone_reward_usd, birthday_bonus_points: =birthday_bonus_points}
        Kestrel Care Rewards Platinum: {welcome_bonus_points: =welcome_bonus_points, points_per_dollar_front_store: =points_per_dollar_front_store, points_per_dollar_store_brand: =points_per_dollar_store_brand, front_store_points_cap_per_day: =front_store_points_cap_per_day, points_pending_days: =points_pending_days, double_points_days_per_year: =double_points_days_per_year, points_per_rx_fill: =points_per_rx_fill, rx_points_cap_per_365_days: =rx_points_cap_per_365_days, points_per_vaccination: =points_per_vaccination, vaccination_points_cap_per_365_days: =vaccination_points_cap_per_365_days, rx_milestone_fills: =rx_milestone_fills, rx_milestone_reward_usd: =rx_milestone_reward_usd, birthday_bonus_points: =birthday_bonus_points}
        Kestrel Care Rewards Plus Monthly: {welcome_bonus_points: =welcome_bonus_points, points_per_dollar_front_store: =points_per_dollar_front_store, points_per_dollar_store_brand: =points_per_dollar_store_brand, front_store_points_cap_per_day: =front_store_points_cap_per_day, points_pending_days: =points_pending_days, double_points_days_per_year: =double_points_days_per_year, points_per_rx_fill: =points_per_rx_fill, rx_points_cap_per_365_days: =rx_points_cap_per_365_days, points_per_vaccination: =points_per_vaccination, vaccination_points_cap_per_365_days: =vaccination_points_cap_per_365_days, rx_milestone_fills: =rx_milestone_fills, rx_milestone_reward_usd: =rx_milestone_reward_usd, birthday_bonus_points: =birthday_bonus_points}
        Kestrel Care Rewards Plus Annual: {welcome_bonus_points: =welcome_bonus_points, points_per_dollar_front_store: =points_per_dollar_front_store, points_per_dollar_store_brand: =points_per_dollar_store_brand, front_store_points_cap_per_day: =front_store_points_cap_per_day, points_pending_days: =points_pending_days, double_points_days_per_year: =double_points_days_per_year, points_per_rx_fill: =points_per_rx_fill, rx_points_cap_per_365_days: =rx_points_cap_per_365_days, points_per_vaccination: =points_per_vaccination, vaccination_points_cap_per_365_days: =vaccination_points_cap_per_365_days, rx_milestone_fills: =rx_milestone_fills, rx_milestone_reward_usd: =rx_milestone_reward_usd, birthday_bonus_points: =birthday_bonus_points}
    formula:
      points: purchase_amount_usd * points_per_dollar_front_store * points_multiplier
    measures: [rewards_msr_rx_points_365d, rewards_msr_vax_points_365d, rewards_msr_rx_fills_since_milestone]
  - id: rewards_evt_missing_points
    subject: [rewards_points_earned]
    rule: >-
      Points missing from a purchase are credited with earn_source missing_points_claim only when the claim is made no
      later than the date of the purchase plus the receipt lookback days, counted in calendar days with the purchase
      date as day 0, only while rewards_msr_missing_claims_365d is below missing_points_claims_per_365_days, and only for
      a purchase on the patient's own receipt that earned nothing. The points credited are those the purchase would have
      earned at the level held on the purchase date.
    eligibility:
      - id: lookback_window
        applies_to: [rewards_points_earned]
        kind: time
        condition: Points missing from a purchase are credited with earn_source missing_points_claim only when the claim is made no later than the date of the purchase plus the receipt lookback days, counted in calendar days with the purchase date as day 0, only while rewards_msr_missing_claims_365d is below missing_points_claims_per_365_days, and only for a purchase on the patient's own receipt that earned nothing.
        evidence_fields: [rewards_activity.event_date, rewards_activity.source_ref_id]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys:
            - [rewards_activity.source_ref_id]
          action_bindings:
            rewards_activity.source_ref_id: source_ref_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the date of the purchase
          anchor_source: rewards_activity.event_date
          relation: not_after
          duration_source: params.receipt_lookback_days
          unit: calendar_days
          counting_rule: counted in calendar days with the purchase date as day 0
          boundary: inclusive
    params:
      per_tier:
        Kestrel Care Rewards Member: {receipt_lookback_days: =receipt_lookback_days, missing_points_claims_per_365_days: =missing_points_claims_per_365_days}
        Kestrel Care Rewards Silver: {receipt_lookback_days: =receipt_lookback_days, missing_points_claims_per_365_days: =missing_points_claims_per_365_days}
        Kestrel Care Rewards Gold: {receipt_lookback_days: =receipt_lookback_days, missing_points_claims_per_365_days: =missing_points_claims_per_365_days}
        Kestrel Care Rewards Platinum: {receipt_lookback_days: =receipt_lookback_days, missing_points_claims_per_365_days: =missing_points_claims_per_365_days}
        Kestrel Care Rewards Plus Monthly: {receipt_lookback_days: =receipt_lookback_days, missing_points_claims_per_365_days: =missing_points_claims_per_365_days}
        Kestrel Care Rewards Plus Annual: {receipt_lookback_days: =receipt_lookback_days, missing_points_claims_per_365_days: =missing_points_claims_per_365_days}
    measures: [rewards_msr_missing_claims_365d]
  - id: rewards_evt_cash
    subject: [rewards_points_converted, rewards_cash_issued, rewards_cash_redeemed, rewards_cash_expired]
    rule: >-
      Where auto_convert is true, every whole points_per_cash_block points convert to cash_per_block_usd of Kestrel Cash
      on the day the balance reaches a block, leftover points staying in the balance. A Kestrel Cash reward is usable for
      cash_validity_days from issue, and the monthly Plus credit of plus_monthly_credit_usd for
      plus_monthly_credit_validity_days; the reward expires on the day after its cash_expiration_date for whatever is
      unused. No more than redemption_max_per_transaction_usd is applied to one purchase, oldest reward first. Where
      cash_redeemable_on_rx_copay is false Kestrel Cash never pays a prescription copay. Where
      cash_reissue_allowed_if_expired is true an expired reward is reissued once as courtesy_reissue with a fresh
      validity period when the patient asks no later than the date the reward expired plus the cash reissue window
      days, counted in calendar days with the expiry date as day 0, and while rewards_msr_reissues_365d is below
      max_cash_reissues_per_365_days. Kestrel Cash has no cash value and is never paid out.
    eligibility:
      - id: reissue_window
        applies_to: [rewards_cash_issued]
        kind: time
        condition: Where cash_reissue_allowed_if_expired is true an expired reward is reissued once as courtesy_reissue with a fresh validity period when the patient asks no later than the date the reward expired plus the cash reissue window days, counted in calendar days with the expiry date as day 0, and while rewards_msr_reissues_365d is below max_cash_reissues_per_365_days.
        evidence_fields: [rewards_activity.event_date, rewards_activity.activity_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rewards_activity.activity_id]
          action_bindings:
            rewards_activity.activity_id: source_activity_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the date the reward expired
          anchor_source: rewards_activity.event_date
          relation: not_after
          duration_source: params.cash_reissue_window_days
          unit: calendar_days
          counting_rule: counted in calendar days with the expiry date as day 0
          boundary: inclusive
    params:
      per_tier:
        Kestrel Care Rewards Member: {auto_convert: =auto_convert, points_per_cash_block: =points_per_cash_block, cash_per_block_usd: =cash_per_block_usd, cash_validity_days: =cash_validity_days, plus_monthly_credit_usd: =plus_monthly_credit_usd, plus_monthly_credit_validity_days: =plus_monthly_credit_validity_days, redemption_max_per_transaction_usd: =redemption_max_per_transaction_usd, cash_redeemable_on_rx_copay: =cash_redeemable_on_rx_copay, cash_reissue_allowed_if_expired: =cash_reissue_allowed_if_expired, cash_reissue_window_days: =cash_reissue_window_days, max_cash_reissues_per_365_days: =max_cash_reissues_per_365_days}
        Kestrel Care Rewards Silver: {auto_convert: =auto_convert, points_per_cash_block: =points_per_cash_block, cash_per_block_usd: =cash_per_block_usd, cash_validity_days: =cash_validity_days, plus_monthly_credit_usd: =plus_monthly_credit_usd, plus_monthly_credit_validity_days: =plus_monthly_credit_validity_days, redemption_max_per_transaction_usd: =redemption_max_per_transaction_usd, cash_redeemable_on_rx_copay: =cash_redeemable_on_rx_copay, cash_reissue_allowed_if_expired: =cash_reissue_allowed_if_expired, cash_reissue_window_days: =cash_reissue_window_days, max_cash_reissues_per_365_days: =max_cash_reissues_per_365_days}
        Kestrel Care Rewards Gold: {auto_convert: =auto_convert, points_per_cash_block: =points_per_cash_block, cash_per_block_usd: =cash_per_block_usd, cash_validity_days: =cash_validity_days, plus_monthly_credit_usd: =plus_monthly_credit_usd, plus_monthly_credit_validity_days: =plus_monthly_credit_validity_days, redemption_max_per_transaction_usd: =redemption_max_per_transaction_usd, cash_redeemable_on_rx_copay: =cash_redeemable_on_rx_copay, cash_reissue_allowed_if_expired: =cash_reissue_allowed_if_expired, cash_reissue_window_days: =cash_reissue_window_days, max_cash_reissues_per_365_days: =max_cash_reissues_per_365_days}
        Kestrel Care Rewards Platinum: {auto_convert: =auto_convert, points_per_cash_block: =points_per_cash_block, cash_per_block_usd: =cash_per_block_usd, cash_validity_days: =cash_validity_days, plus_monthly_credit_usd: =plus_monthly_credit_usd, plus_monthly_credit_validity_days: =plus_monthly_credit_validity_days, redemption_max_per_transaction_usd: =redemption_max_per_transaction_usd, cash_redeemable_on_rx_copay: =cash_redeemable_on_rx_copay, cash_reissue_allowed_if_expired: =cash_reissue_allowed_if_expired, cash_reissue_window_days: =cash_reissue_window_days, max_cash_reissues_per_365_days: =max_cash_reissues_per_365_days}
        Kestrel Care Rewards Plus Monthly: {auto_convert: =auto_convert, points_per_cash_block: =points_per_cash_block, cash_per_block_usd: =cash_per_block_usd, cash_validity_days: =cash_validity_days, plus_monthly_credit_usd: =plus_monthly_credit_usd, plus_monthly_credit_validity_days: =plus_monthly_credit_validity_days, redemption_max_per_transaction_usd: =redemption_max_per_transaction_usd, cash_redeemable_on_rx_copay: =cash_redeemable_on_rx_copay, cash_reissue_allowed_if_expired: =cash_reissue_allowed_if_expired, cash_reissue_window_days: =cash_reissue_window_days, max_cash_reissues_per_365_days: =max_cash_reissues_per_365_days}
        Kestrel Care Rewards Plus Annual: {auto_convert: =auto_convert, points_per_cash_block: =points_per_cash_block, cash_per_block_usd: =cash_per_block_usd, cash_validity_days: =cash_validity_days, plus_monthly_credit_usd: =plus_monthly_credit_usd, plus_monthly_credit_validity_days: =plus_monthly_credit_validity_days, redemption_max_per_transaction_usd: =redemption_max_per_transaction_usd, cash_redeemable_on_rx_copay: =cash_redeemable_on_rx_copay, cash_reissue_allowed_if_expired: =cash_reissue_allowed_if_expired, cash_reissue_window_days: =cash_reissue_window_days, max_cash_reissues_per_365_days: =max_cash_reissues_per_365_days}
    formula:
      amount_usd: points / points_per_cash_block * cash_per_block_usd
    measures: [rewards_msr_reissues_365d]
  - id: rewards_evt_points_expiry
    subject: [rewards_points_expired]
    rule: >-
      Where points_expire is true, the whole unconverted points balance expires when points_inactivity_expiry_months
      calendar months pass without any rewards_points_earned or rewards_goodwill_credit entry, the month-end falling back
      to the last day of a shorter month. Any earning entry restarts the period. Where points_expire is false points never
      expire while the membership is open. All points and Kestrel Cash lapse when the membership closes.
    eligibility: []
    params:
      per_tier:
        Kestrel Care Rewards Member: {points_expire: =points_expire, points_inactivity_expiry_months: =points_inactivity_expiry_months}
        Kestrel Care Rewards Silver: {points_expire: =points_expire, points_inactivity_expiry_months: =points_inactivity_expiry_months}
        Kestrel Care Rewards Gold: {points_expire: =points_expire, points_inactivity_expiry_months: =points_inactivity_expiry_months}
        Kestrel Care Rewards Platinum: {points_expire: =points_expire, points_inactivity_expiry_months: =points_inactivity_expiry_months}
        Kestrel Care Rewards Plus Monthly: {points_expire: =points_expire, points_inactivity_expiry_months: =points_inactivity_expiry_months}
        Kestrel Care Rewards Plus Annual: {points_expire: =points_expire, points_inactivity_expiry_months: =points_inactivity_expiry_months}
  - id: rewards_evt_goodwill
    subject: [rewards_goodwill_credit]
    rule: >-
      Goodwill points are credited only to a membership that is not closed. A confirmed dispensing error on a
      prescription class whose error_goodwill_eligible is true earns goodwill_points_dispensing_error; a failed or lost
      prescription delivery earns goodwill_points_delivery_failure; another service failure documented in a Kestrel
      record earns goodwill_points_service_recovery. Each documenting record earns goodwill once per reason. No goodwill
      is credited once rewards_msr_goodwill_365d has reached max_goodwill_credits_per_365_days. A patient without a
      membership receives no goodwill points and no substitute. Goodwill points follow the ordinary conversion and
      expiry rules.
    eligibility:
      - id: goodwill_on_open_membership
        applies_to: [rewards_goodwill_credit]
        kind: state
        condition: Goodwill points are credited only to a membership that is not closed.
        evidence_fields: [rewards_memberships.status, rewards_memberships.membership_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rewards_memberships.membership_id]
          action_bindings:
            rewards_memberships.membership_id: membership_id
        state_contract:
          field: rewards_memberships.status
          allowed: [enrolled, active, suspended]
      - id: goodwill_once
        applies_to: [rewards_goodwill_credit]
        kind: dedup
        condition: Each documenting record earns goodwill once per reason.
