  - id: rewards_evt_points_reversal
    subject: [rewards_points_reversed]
    rule: >-
      When a purchase is returned or a prescription fill or vaccine dose that earned points is reversed, exactly the
      points of that earning entry are taken back. An earning entry is reversed at most once. Points already converted
      are taken back from the current balance, which may go below zero until later points cover it; Kestrel Cash already
      issued is not clawed back.
    eligibility:
      - id: reverse_once
        applies_to: [rewards_points_reversed]
        kind: dedup
        condition: An earning entry is reversed at most once.
        evidence_fields: [rewards_activity.source_activity_id, rewards_activity.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rewards_activity.source_activity_id]
          action_bindings:
            rewards_activity.source_activity_id: source_activity_id
        dedup_contract:
          table: rewards_activity
          mode: separate_record
          object_bindings: {source_activity_id: source_activity_id}
          duplicate_filters: {event_type: [rewards_points_reversed]}
          distinct_fields: []
  - id: rewards_plus_membership
    subject: [rewards_plus_fee_charged, rewards_plus_fee_refunded, rewards_suspended, rewards_reinstated, rewards_activated]
    rule: >-
      A Plus membership pays membership_fee_usd every fee_billing_cycle_months months, the first charge falling after
      plus_trial_days of free trial. Each cycle is charged once. A Plus member receives plus_monthly_credit_usd of Kestrel
      Cash on the first day of each calendar month, store_brand_discount_pct off Kestrel store-brand items, and, where
      free_rx_delivery is true, prescription deliveries without same-day or express fees under the delivery charter. A
      fee not collected for fee_failure_grace_days suspends the membership where suspension_on_fee_failure is true, and
      a suspended membership earns and redeems nothing. A suspended membership is reinstated only when the fee is
      collected no later than the date it was suspended plus the reinstatement window days, counted in calendar days
      with the suspension date as day 0; otherwise it closes. A fee is refunded in full when the membership is cancelled
      no later than fee_refund_window_days after the fee was charged; after that, where annual_prorated_refund is true
      the unused whole months are refunded at membership_fee_usd divided by fee_billing_cycle_months each, rounded to
      the cent half up, and otherwise nothing is refunded. A fee is refunded at most once.
    eligibility:
      - id: reinstatement_window
        applies_to: [rewards_reinstated]
        kind: time
        condition: A suspended membership is reinstated only when the fee is collected no later than the date it was suspended plus the reinstatement window days, counted in calendar days with the suspension date as day 0; otherwise it closes.
        evidence_fields: [rewards_memberships.suspended_date, rewards_memberships.membership_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rewards_memberships.membership_id]
          action_bindings:
            rewards_memberships.membership_id: membership_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the date it was suspended
          anchor_source: rewards_memberships.suspended_date
          relation: not_after
          duration_source: params.reinstatement_window_days
          unit: calendar_days
          counting_rule: counted in calendar days with the suspension date as day 0
          boundary: inclusive
      - id: plus_fee_refund_once
        applies_to: [rewards_plus_fee_refunded]
        kind: dedup
        condition: A fee is refunded at most once.
        evidence_fields: [rewards_activity.source_activity_id, rewards_activity.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rewards_activity.source_activity_id]
          action_bindings:
            rewards_activity.source_activity_id: source_activity_id
        dedup_contract:
          table: rewards_activity
          mode: separate_record
          object_bindings: {source_activity_id: source_activity_id}
          duplicate_filters: {event_type: [rewards_plus_fee_refunded]}
          distinct_fields: []
    params:
      per_tier:
        Kestrel Care Rewards Member: {membership_fee_usd: =membership_fee_usd, fee_billing_cycle_months: =fee_billing_cycle_months, plus_trial_days: =plus_trial_days, store_brand_discount_pct: =store_brand_discount_pct, free_rx_delivery: =free_rx_delivery, fee_failure_grace_days: =fee_failure_grace_days, suspension_on_fee_failure: =suspension_on_fee_failure, reinstatement_window_days: =reinstatement_window_days, fee_refund_window_days: =fee_refund_window_days, annual_prorated_refund: =annual_prorated_refund}
        Kestrel Care Rewards Silver: {membership_fee_usd: =membership_fee_usd, fee_billing_cycle_months: =fee_billing_cycle_months, plus_trial_days: =plus_trial_days, store_brand_discount_pct: =store_brand_discount_pct, free_rx_delivery: =free_rx_delivery, fee_failure_grace_days: =fee_failure_grace_days, suspension_on_fee_failure: =suspension_on_fee_failure, reinstatement_window_days: =reinstatement_window_days, fee_refund_window_days: =fee_refund_window_days, annual_prorated_refund: =annual_prorated_refund}
        Kestrel Care Rewards Gold: {membership_fee_usd: =membership_fee_usd, fee_billing_cycle_months: =fee_billing_cycle_months, plus_trial_days: =plus_trial_days, store_brand_discount_pct: =store_brand_discount_pct, free_rx_delivery: =free_rx_delivery, fee_failure_grace_days: =fee_failure_grace_days, suspension_on_fee_failure: =suspension_on_fee_failure, reinstatement_window_days: =reinstatement_window_days, fee_refund_window_days: =fee_refund_window_days, annual_prorated_refund: =annual_prorated_refund}
        Kestrel Care Rewards Platinum: {membership_fee_usd: =membership_fee_usd, fee_billing_cycle_months: =fee_billing_cycle_months, plus_trial_days: =plus_trial_days, store_brand_discount_pct: =store_brand_discount_pct, free_rx_delivery: =free_rx_delivery, fee_failure_grace_days: =fee_failure_grace_days, suspension_on_fee_failure: =suspension_on_fee_failure, reinstatement_window_days: =reinstatement_window_days, fee_refund_window_days: =fee_refund_window_days, annual_prorated_refund: =annual_prorated_refund}
        Kestrel Care Rewards Plus Monthly: {membership_fee_usd: =membership_fee_usd, fee_billing_cycle_months: =fee_billing_cycle_months, plus_trial_days: =plus_trial_days, store_brand_discount_pct: =store_brand_discount_pct, free_rx_delivery: =free_rx_delivery, fee_failure_grace_days: =fee_failure_grace_days, suspension_on_fee_failure: =suspension_on_fee_failure, reinstatement_window_days: =reinstatement_window_days, fee_refund_window_days: =fee_refund_window_days, annual_prorated_refund: =annual_prorated_refund}
        Kestrel Care Rewards Plus Annual: {membership_fee_usd: =membership_fee_usd, fee_billing_cycle_months: =fee_billing_cycle_months, plus_trial_days: =plus_trial_days, store_brand_discount_pct: =store_brand_discount_pct, free_rx_delivery: =free_rx_delivery, fee_failure_grace_days: =fee_failure_grace_days, suspension_on_fee_failure: =suspension_on_fee_failure, reinstatement_window_days: =reinstatement_window_days, fee_refund_window_days: =fee_refund_window_days, annual_prorated_refund: =annual_prorated_refund}
  - id: rewards_closure
    subject: [rewards_closed, rewards_closed_inactive]
    rule: >-
      A membership is closed at the patient's own request, which the patient confirms themselves; closing forfeits every
      unconverted point and unused Kestrel Cash. A Plus cancellation takes effect as plus_cancellation_effective says,
      at the end of the paid cycle or the same day, with refunds under rewards_plus_membership. A free membership with no
      activity of any kind for inactivity_close_months closes, where that value is above 0. A suspended membership not
      reinstated within its window closes.
    eligibility: []
    params:
      per_tier:
        Kestrel Care Rewards Member: {plus_cancellation_effective: =plus_cancellation_effective, inactivity_close_months: =inactivity_close_months}
        Kestrel Care Rewards Silver: {plus_cancellation_effective: =plus_cancellation_effective, inactivity_close_months: =inactivity_close_months}
        Kestrel Care Rewards Gold: {plus_cancellation_effective: =plus_cancellation_effective, inactivity_close_months: =inactivity_close_months}
        Kestrel Care Rewards Platinum: {plus_cancellation_effective: =plus_cancellation_effective, inactivity_close_months: =inactivity_close_months}
        Kestrel Care Rewards Plus Monthly: {plus_cancellation_effective: =plus_cancellation_effective, inactivity_close_months: =inactivity_close_months}
        Kestrel Care Rewards Plus Annual: {plus_cancellation_effective: =plus_cancellation_effective, inactivity_close_months: =inactivity_close_months}
