category: rx
display_name: Prescriptions

binding:
  holding_table: rx_prescriptions
  event_tables: [rx_fills, rx_prescriber_requests]
  intake_tables: [rx_error_reports]
  status_field: status
  variant_field: variant_name
  quantity_fields: {refills_remaining: refills, owed_quantity: owed_units}

lifecycle:
  states: [received, active, expired, transferred_out, discontinued]
  transitions:
    - {from: received, to: active, by: system, means: The original fill of the prescription is dispensed and the prescription becomes refillable.}
    - {from: active, to: received, by: system, means: The only dispensed fill of the prescription was returned to stock unpicked, so the prescription is back to never-dispensed.}
    - {from: received, to: expired, by: system, means: The prescription validity period ended before any fill was dispensed.}
    - {from: active, to: expired, by: system, means: The prescription validity period ended; no further fill may be dispensed on it.}
    - {from: received, to: transferred_out, by: agent, means: The prescription is transferred to a pharmacy outside Kestrel before any fill.}
    - {from: active, to: transferred_out, by: agent, means: The remaining refills are transferred to a pharmacy outside Kestrel.}
    - {from: received, to: discontinued, by: agent, means: The prescription is inactivated on the prescriber's cancellation, the patient's request or replacement by a newer prescription for the same drug.}
    - {from: active, to: discontinued, by: agent, means: The prescription is inactivated on the prescriber's cancellation, the patient's request or replacement by a newer prescription for the same drug.}

accounts:
  - key: refills
    unit: refills
    meaning: Number of authorized refills still available on the prescription; credited when the prescription is entered or a refill fill is returned to stock, debited when a refill is dispensed or the prescription is transferred out.
  - key: owed_units
    unit: dosage units
    meaning: Quantity the pharmacy still owes the patient after a partial fill; credited by the partial fill, debited by the balance completion or cancellation.

parameter_schema:
  max_refills_allowed: Highest number of refills Kestrel records on a prescription of this class, integer; refills written above it are recorded at this cap.
  rx_validity_days: Calendar days from the written date during which the prescription can be filled, integer days; the written date is day 0.
  early_refill_threshold_pct: Percent of the previous fill's days supply that must have elapsed before the next routine fill, integer percent.
  max_days_supply_per_fill: Largest days supply one fill of this class may carry, integer days.
  min_days_supply_per_fill: Smallest days supply one fill of this class may carry, integer days.
  ninety_day_supply_allowed: Whether a fill of this class may be dispensed as a 90-day supply, boolean.
  vacation_override_allowed: Whether a routine refill may be dispensed before the refill-eligible date for travel, boolean.
  vacation_override_max_per_365_days: Most vacation-override refills per prescription in any rolling 365 days, integer.
  vacation_override_max_days: Largest days supply of one vacation-override refill, integer days.
  lost_stolen_replacement_allowed: Whether a refill may be dispensed early to replace lost or stolen medication, boolean.
  lost_stolen_max_per_365_days: Most lost-or-stolen replacements per prescription in any rolling 365 days, integer.
  lost_stolen_police_report_required: Whether a lost-or-stolen replacement requires the police report number, boolean.
  dosage_change_early_fill_allowed: Whether a refill may be dispensed early because the prescriber changed the dose on file, boolean.
  emergency_supply_allowed: Whether the pharmacist may dispense an emergency supply when no refill is available and the prescriber cannot be reached, boolean.
  emergency_supply_max_days: Largest days supply of one emergency supply, integer days.
  emergency_supply_max_per_365_days: Most emergency supplies per prescription in any rolling 365 days, integer.
  partial_fill_allowed: Whether a fill may be dispensed short of the prescribed quantity with the balance owed, boolean.
  partial_fill_completion_days: Calendar days allowed to complete an owed balance, counted from the anchor named by partial_fill_completion_anchor, integer days.
  partial_fill_completion_anchor: Which date the owed-balance window counts from, enum written_date | partial_fill_date.
  max_open_owed_balances: Most owed balances open at the same time on one prescription, integer.
  will_call_hold_days: Calendar days a ready fill waits in will-call, counted from its ready date, before it is returned to stock, integer days.
  id_required_at_pickup: Whether the patient must show government photo ID to collect a fill, boolean.
  caregiver_pickup_allowed: Whether someone other than the patient may collect a fill, boolean.
  caregiver_id_required: Whether a caregiver collecting a fill must show government photo ID, boolean.
  minimum_pickup_age_years: Minimum age in whole years of the person collecting a fill, integer years.
  locker_pickup_allowed: Whether a fill of this class may be released through a self-service pickup locker, boolean.
  drive_thru_pickup_allowed: Whether a fill of this class may be released at the drive-thru window, boolean.
  delivery_eligible: Whether a fill of this class may be sent by home delivery, boolean.
  delivery_signature_required: Whether a delivered fill of this class needs an adult signature on handover, boolean.
  auto_refill_eligible: Whether a prescription of this class may be enrolled in an Auto Refill program, boolean.
  med_sync_eligible: Whether a prescription of this class may be enrolled in a Med Sync program, boolean.
  adherence_packaging_eligible: Whether a prescription of this class may be dispensed in adherence packaging, boolean.
  store_move_allowed: Whether the prescription may be moved to another Kestrel store, boolean.
  store_move_before_first_fill_only: Whether a move to another Kestrel store is allowed only while the prescription has never been dispensed, boolean.
  transfer_in_allowed: Whether a prescription of this class may be transferred in from a pharmacy outside Kestrel, boolean.
  external_transfer_out_allowed: Whether a prescription of this class may be transferred to a pharmacy outside Kestrel, boolean.
  transfer_out_requires_no_prior_transfer: Whether transfer out is allowed only when the prescription has never been transferred before, boolean.
  transfer_out_requires_unfilled: Whether transfer out is allowed only while the prescription has never been dispensed, boolean.
  transfer_out_requires_electronic_origin: Whether transfer out is allowed only for a prescription received as an electronic prescription, boolean.
  short_count_report_window_days: Calendar days after pickup within which a short-count error is accepted, integer days; 0 means only on the pickup date.
  error_report_window_days: Calendar days after pickup within which any other dispensing error is accepted, integer days.
  error_remake_ready_days: Calendar days after the return within which the corrected remake is ready, integer days.
  error_goodwill_eligible: Whether a confirmed dispensing error on this class earns the rewards goodwill credit, boolean.
  renewal_request_allowed: Whether Kestrel sends renewal requests to the prescriber for this class, boolean.
  renewal_request_window_days: Calendar days before the expiration date from which a renewal request may be sent while refills remain, integer days.
  renewal_fax_permitted: Whether a renewal request for this class may go by fax when the prescriber cannot receive it electronically, boolean.
  renewal_request_resend_business_days: Business days without a prescriber reply after which the request may be sent again, integer business days.
  renewal_requests_max_per_30_days: Most renewal requests per prescription in any rolling 30 days, integer.
  refill_booking_max_advance_days: Most calendar days ahead of today a refill pickup date may be booked, integer days.
  standard_ready_days: Calendar days from booking until a fill is ready for pickup, integer days; 0 means same day.
  first_fill_split_days: Days supply of each split fill at the start of therapy, integer days; 0 means no split fill.
  split_fill_count: Number of initial fills dispensed as split fills, integer.
  generic_substitution_default: Whether an A-rated generic is dispensed unless the prescriber wrote dispense-as-written, boolean.

