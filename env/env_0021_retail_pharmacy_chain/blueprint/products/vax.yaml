category: vax
display_name: Immunization Services

binding:
  holding_table: vax_courses
  event_tables: [vax_events]
  status_field: status
  variant_field: variant_name
  quantity_fields: {doses_remaining: doses}

lifecycle:
  states: [scheduled, in_progress, completed, cancelled]
  transitions:
    - {from: scheduled, to: in_progress, by: system, means: The first dose of a multi-dose series is administered.}
    - {from: scheduled, to: completed, by: system, means: The only dose of a single-dose vaccination is administered.}
    - {from: in_progress, to: completed, by: system, means: The final dose of the series is administered.}
    - {from: completed, to: in_progress, by: system, means: The dose that completed the course is found invalid and must be repeated.}
    - {from: scheduled, to: cancelled, by: user, means: The patient decides not to receive the vaccination.}
    - {from: in_progress, to: cancelled, by: user, means: The patient decides not to finish the series at Kestrel.}

accounts:
  - key: doses
    unit: doses
    meaning: Valid doses still needed to complete the course; credited when the course opens and when a dose is found invalid, debited when a dose is administered.

parameter_schema:
  min_age_years: Youngest age in whole years on the dose date at which Kestrel pharmacists give this vaccine, integer years.
  max_age_years: Oldest age in whole years on the dose date for this vaccine, integer years.
  risk_condition_required_below_age: Age in whole years below which the patient must attest a qualifying risk condition, integer years; 0 means never required.
  guardian_consent_under_age: Age in whole years below which a parent or legal guardian must sign the consent, integer years.
  doses_in_series: Valid doses that complete the course for a patient without a pediatric second dose, integer.
  dose2_min_interval_days: Minimum calendar days from dose 1 to dose 2, integer days; 0 for single-dose courses.
  dose2_recommended_max_interval_days: Latest recommended calendar days from dose 1 to dose 2, integer days; a later dose 2 is still valid.
  dose3_min_interval_days_from_dose2: Minimum calendar days from dose 2 to dose 3, integer days.
  dose3_min_interval_days_from_dose1: Minimum calendar days from dose 1 to dose 3, integer days.
  grace_period_days: Calendar days before a minimum interval ends within which a dose still counts as valid, integer days.
  immunocompromised_dose2_min_interval_days: Minimum calendar days from dose 1 to dose 2 for a patient who attests being immunocompromised, integer days; 0 when no shorter interval exists.
  pediatric_second_dose_max_age_years: Highest age in whole years at which a child with fewer than two lifetime doses needs a second dose this season, integer years; 0 when not applicable.
  pediatric_second_dose_interval_days: Minimum calendar days between the two pediatric doses, integer days.
  series_restart_on_delay: Whether a series is restarted when a later dose comes after the recommended interval, boolean.
  repeat_course_allowed: Whether the patient may receive another course of this vaccine after completing one, boolean.
  min_days_since_previous_course: Minimum calendar days from the last dose of the previous course of this vaccine, integer days; 0 when the season rule governs instead.
  seasonal: Whether the vaccine is given by season, boolean.
  season_start_mmdd: First day of the season as MM-DD, or not_seasonal.
  season_end_mmdd: Last day of the season as MM-DD in the following year, or not_seasonal.
  walk_in_allowed: Whether a dose may be given without an appointment, boolean.
  appointment_required_under_age: Age in whole years below which an appointment is required even where walk-ins are allowed, integer years; 0 means never.
  booking_window_days_ahead: Most calendar days ahead of today an appointment may be booked, integer days.
  second_dose_auto_book: Whether the next dose is booked automatically when a series dose is given, boolean.
  dose_auto_book_offset_days: Calendar days after the dose just given on which the next dose is auto-booked, integer days.
  max_open_appointments_per_course: Most booked appointments a course may have open at once, integer.
  cancellation_cutoff_hours: Hours before the appointment by which a cancellation must be made, integer hours.
  late_cancellation_counts_as_no_show: Whether a cancellation after the cutoff is recorded as a no-show, boolean.
  late_arrival_grace_minutes: Minutes after the appointment time after which a patient who has not arrived is a no-show, integer minutes.
  no_show_limit_365_days: No-shows in rolling 365 days that suspend online and phone booking for the patient, integer.
  online_booking_suspension_days: Calendar days booking stays suspended after the limit is reached, integer days.
  appointment_slot_minutes: Length of one appointment slot, integer minutes.
  same_day_booking_cutoff_minutes: Minutes before a slot after which it can no longer be booked the same day, integer minutes.
  cash_price_usd: Cash price per dose including administration, USD.
  medicare_part_b_billable: Whether the dose is billed to Medicare Part B for a Medicare patient, boolean.
  medicare_part_d_billable: Whether the dose is billed to the patient's Part D plan for a Medicare patient, boolean.
  insured_zero_cost_share: Whether an insured patient who meets the recommendation pays nothing for the dose, boolean.
  vfc_program_available: Whether the dose can be given from Vaccines for Children stock, boolean.
  vfc_max_age_years: Highest age in whole years for Vaccines for Children stock, integer years.
  vfc_admin_fee_usd: Administration fee charged for a Vaccines for Children dose, USD.
  substitute_variant_if_unavailable: Official name of the vaccination that may be given instead when this one is out of stock, or none.
  coadministration_allowed: Whether the vaccine may be given at the same visit as other vaccines, boolean.
  immunocompromised_extra_dose_allowed: Whether an immunocompromised patient may receive an additional dose in the same season, boolean.
  extra_dose_min_interval_days: Minimum calendar days from the previous dose to an additional dose, integer days.
  observation_minutes: Minutes the patient is observed after the dose, integer minutes.
  extended_observation_minutes: Minutes the patient is observed after the dose when they report a history of severe allergic reaction, integer minutes.
  consent_validity_days: Calendar days a signed screening and consent form remains valid for a dose, integer days.
  registry_report_deadline_days: Calendar days after the dose by which it is reported to the state immunization registry, integer days.
  outside_record_accepted: Whether a dose documented by another provider counts toward the course, boolean.

