events:
  - type: copay_enrolled
    target: copay_enrollments
    mutation: create
    meaning: A savings or copay assistance program is put on the patient's profile.
    grain: one row per enrollment
    fields:
      enrollment_id: id of the enrollment
      customer_id: the enrolling patient
      variant_name: program type
      status: pending_activation
      program_name: program name as printed on the card or award letter
      drug_name: drug the program is for, empty for Kestrel discount programs
      bin: BIN from the card
      pcn: PCN from the card
      group_number: group number from the card
      member_number: member ID from the card
      enrollment_source: who enrolled the patient
      linked_coverage_id: coverage the program pays after, empty for cash programs
      prescription_id: prescription the program is tied to, empty for Kestrel discount programs
      household_member_count: people covered, 1 unless a family membership
      income_attested: whether the patient attested household income
      expiration_date: program end date, empty where the program has no expiration
      opened_date: date of enrollment
    triggers: []
  - type: copay_activated
    target: copay_enrollments
    mutation: {transition: {from: pending_activation, to: active}}
    meaning: The program becomes usable.
    grain: one row per transaction
    fields:
      enrollment_id: the enrollment activated
      variant_name: program type of the enrollment (read, not changed)
      status: active
      benefit_period_start: first day of the first benefit period or term
      benefit_period_end: last day of the first benefit period or term
      expiration_date: activation date plus membership_term_months where the program expires
    triggers:
      - event: copay:copay_benefit_period_opened
        when: {variant_name: [Manufacturer Copay Card, Charitable Foundation Copay Grant]}
        map: {enrollment_id: enrollment_id}
      - event: copay:copay_membership_fee_charged
        when: {variant_name: [Kestrel Rx Savings Club Individual, Kestrel Rx Savings Club Family]}
        map: {enrollment_id: enrollment_id, fee_type: annual_membership}
  - type: copay_renewed
    target: copay_enrollments
    mutation: update
    meaning: An auto-renewing membership renews for another term at expiration.
    grain: one row per transaction
    fields:
      enrollment_id: the enrollment renewed
      expiration_date: new expiration date
      benefit_period_start: first day of the new term
      benefit_period_end: last day of the new term
    triggers:
      - event: copay:copay_membership_fee_charged
        map: {enrollment_id: enrollment_id, fee_type: annual_renewal, benefit_period_start: benefit_period_start}
  - type: copay_household_updated
    target: copay_enrollments
    mutation: update
    meaning: The number of household members covered by a family membership changes.
    grain: one row per transaction
    fields:
      enrollment_id: the family membership
      household_member_count: new number of people covered
    triggers: []
  - type: copay_suspended
    target: copay_enrollments
    mutation: {transition: {from: active, to: suspended}}
    meaning: The program stops paying because a continuing eligibility condition no longer holds.
    grain: one row per transaction
    fields:
      enrollment_id: the enrollment suspended
      status: suspended
      suspended_date: date of suspension
    triggers: []
  - type: copay_reinstated
    target: copay_enrollments
    mutation: {transition: {from: suspended, to: active}}
    meaning: A suspended program resumes paying.
    grain: one row per transaction
    fields:
      enrollment_id: the enrollment reinstated
      status: active
      suspended_date: cleared on reinstatement
    triggers: []
  - type: copay_expired
    target: copay_enrollments
    mutation: {transition: [{from: pending_activation, to: expired}, {from: active, to: expired}, {from: suspended, to: expired}]}
    meaning: The program ends on its expiration date or activation or resume deadline.
    grain: one row per transaction
    fields:
      enrollment_id: the enrollment expired
      variant_name: program type of the enrollment (read, not changed)
      status: expired
      closed_date: date it ended
    triggers:
      - event: copay:copay_benefit_period_closed
        when: {variant_name: [Manufacturer Copay Card, Charitable Foundation Copay Grant]}
        map: {enrollment_id: enrollment_id, event_date: closed_date}
  - type: copay_cancelled
    target: copay_enrollments
    mutation: {transition: [{from: pending_activation, to: cancelled}, {from: active, to: cancelled}]}
    meaning: The patient cancels the program.
    grain: one row per transaction
    fields:
      enrollment_id: the enrollment cancelled
      status: cancelled
      closed_date: date cancelled
    triggers: []
  - type: copay_benefit_period_opened
    target: copay_activity
    meaning: A new benefit period starts and the program's benefit dollars for it are credited.
    grain: one row per benefit period
    distinguish_by: [benefit_period_start]
    fields:
      activity_id: id of this entry
      enrollment_id: the enrollment
      customer_id: the patient
      event_date: date credited
      benefit_period_start: first day of the benefit period
      amount_usd: benefit dollars credited (annual_benefit_max_usd)
    account: benefit_budget
    direction: in
    triggers: []
  - type: copay_benefit_applied
    target: copay_activity
    meaning: The program pays part of the patient's share of one fill after insurance.
    grain: one row per fill paid by the program
    distinguish_by: [fill_id]
    fields:
      activity_id: id of this entry
      enrollment_id: the enrollment
      customer_id: the patient
      event_date: date applied
      prescription_id: prescription filled
      fill_id: the fill the benefit pays
      claim_id: the insurance claim whose patient pay the benefit reduces
      days_supply: days supply of the fill
      patient_pay_before_usd: patient pay before the program
      amount_usd: amount the program paid
      patient_pay_after_usd: patient pay after the program
    account: benefit_budget
    direction: out
    triggers: []
  - type: copay_benefit_reversed
    target: copay_activity
    meaning: A benefit applied to a fill is reversed and its dollars restored to the benefit period.
    grain: one row per applied benefit reversed
    distinguish_by: [source_activity_id]
    fields:
      activity_id: id of this entry
      enrollment_id: the enrollment
      customer_id: the patient
      event_date: date reversed
      fill_id: the fill whose benefit is reversed
      source_activity_id: the benefit entry reversed
      amount_usd: amount restored
    account: benefit_budget
    direction: in
    triggers: []
  - type: copay_benefit_period_closed
    target: copay_activity
    meaning: A benefit period ends and the dollars left in it lapse.
    grain: one row per benefit period closed
    distinguish_by: [benefit_period_start]
    fields:
      activity_id: id of this entry
      enrollment_id: the enrollment
      customer_id: the patient
      event_date: date closed
      benefit_period_start: first day of the benefit period closed
      amount_usd: dollars lapsed
    account: benefit_budget
    direction: out
    triggers: []
  - type: copay_discount_applied
    target: copay_activity
    meaning: A Kestrel discount program price is applied to a cash fill.
    grain: one row per fill priced by the program
    distinguish_by: [fill_id]
    fields:
      activity_id: id of this entry
      enrollment_id: the enrollment
      customer_id: the patient
      event_date: date applied
      prescription_id: prescription filled
      fill_id: the fill priced
      days_supply: days supply of the fill
      usual_price_usd: usual and customary price of the fill
      amount_usd: savings off the usual price
      patient_pay_after_usd: price the patient paid
    triggers: []
  - type: copay_bridge_fill
    target: copay_activity
    meaning: A manufacturer bridge program supplies a fill at no cost while coverage is being sorted out.
    grain: one row per bridge fill
    distinguish_by: [fill_id]
    fields:
      activity_id: id of this entry
      enrollment_id: the enrollment
      customer_id: the patient
      event_date: date dispensed
      prescription_id: prescription filled
      fill_id: the fill supplied
      days_supply: days supply of the fill
      patient_pay_after_usd: 0.00
    triggers: []
  - type: copay_membership_fee_charged
    target: copay_activity
    meaning: A membership fee is charged for a term of a paid program.
    grain: one row per fee charged
    distinguish_by: [benefit_period_start, fee_type]
    fields:
      activity_id: id of this entry
      enrollment_id: the enrollment
      customer_id: the patient
      event_date: date charged
      fee_type: annual_membership or annual_renewal
      benefit_period_start: first day of the term the fee pays for
      amount_usd: fee charged
    account: membership_fees
    direction: in
    triggers: []
  - type: copay_membership_fee_refunded
    target: copay_activity
    meaning: A membership fee is refunded to the patient.
    grain: one row per fee refunded
    distinguish_by: [source_activity_id]
    fields:
      activity_id: id of this entry
      enrollment_id: the enrollment
      customer_id: the patient
      event_date: date refunded
      source_activity_id: the fee entry refunded
      refund_reason: why it was refunded
      amount_usd: amount refunded
    account: membership_fees
    direction: out
    triggers: []

measures:
  - id: copay_msr_benefit_fills_period
    window: the current benefit period of the enrollment, from benefit_period_start to benefit_period_end inclusive
    measure: count of copay_benefit_applied and copay_bridge_fill rows on the enrollment in the window, less those reversed by a copay_benefit_reversed row
  - id: copay_msr_discount_uses_since_fee
    window: from the event_date of the fee entry being refunded to today, inclusive
    measure: count of copay_discount_applied rows on the enrollment in the window

policies:
  - id: copay_agg_multi_holding
    subject: [copay_enrolled]
    rule: >-
      A patient may hold several program enrollments at once, because manufacturer and foundation programs are tied to
      one drug each. Open enrollments (pending_activation, active or suspended) of the same program type for the same
      drug_name never exceed that type's max_enrollments_per_drug. How the patient's programs combine on a fill is
      decided by copay_agg_program_stacking.
    eligibility: []
    params:
      max_per_customer: null
  - id: copay_agg_program_stacking
    subject: [copay_enrolled, copay_benefit_applied, copay_discount_applied, copay_bridge_fill]
    rule: >-
      Exactly one program is applied to any one fill. Among the patient's active programs that are eligible for the
      fill, the one with the lowest application_priority is applied and the others are not applied to that fill,
      whatever amounts they would give. Each program is applied at the counter by its adjudication_method: a
      cash_price_table program prices a cash fill, a secondary_claim program is billed after the insurance claim, and a
      free_drug_claim program supplies the fill at no cost. A program whose combinable_with_insurance is false is applied only to a fill
      that is not billed to insurance, and a program whose combinable_with_insurance is true only after the insurance
      claim is paid, to the patient pay that claim assigned. A Kestrel Rx Discount Card and a Kestrel Rx Savings Club
      membership are never open at the same time: when a club membership is activated, an open discount card on the
      same profile is cancelled the same day. A patient covered as a household member of another patient's Kestrel Rx
      Savings Club Family membership does not also hold an individual club membership. A Manufacturer Bridge Program
      is never used for a fill that a manufacturer copay card for the same drug could pay after an approved insurance
      claim.
    eligibility: []
    params:
      per_tier:
        Kestrel Rx Discount Card: {application_priority: =application_priority, combinable_with_insurance: =combinable_with_insurance, adjudication_method: =adjudication_method}
        Kestrel Rx Savings Club Individual: {application_priority: =application_priority, combinable_with_insurance: =combinable_with_insurance, adjudication_method: =adjudication_method}
        Kestrel Rx Savings Club Family: {application_priority: =application_priority, combinable_with_insurance: =combinable_with_insurance, adjudication_method: =adjudication_method}
        Manufacturer Copay Card: {application_priority: =application_priority, combinable_with_insurance: =combinable_with_insurance, adjudication_method: =adjudication_method}
        Manufacturer Bridge Program: {application_priority: =application_priority, combinable_with_insurance: =combinable_with_insurance, adjudication_method: =adjudication_method}
        Charitable Foundation Copay Grant: {application_priority: =application_priority, combinable_with_insurance: =combinable_with_insurance, adjudication_method: =adjudication_method}
  - id: copay_enrollment_eligibility
    subject: [copay_enrolled]
    rule: >-
      Enrollment details are copied exactly from the card, award letter or hub confirmation the patient reads out. A
      program whose requires_commercial_coverage is true is enrolled only when the patient has a coverage record in
      active status whose class is not a government program. Where government_coverage_disallowed is true the program is
      not enrolled while the patient's primary coverage is a government class. Where enrollment_requires_valid_rx is
      true the program is enrolled only for a drug with a Kestrel prescription in received or active status. A program whose
      requires_pa_pending_or_denied is true is enrolled only while the patient's most recent prior authorization for the drug is waiting for a
      decision or was denied. The enrolling patient must be at least min_age_years old on the day of enrollment. Where
      income_attestation_required is true the program is enrolled only after the patient attests that household income
      is no more than income_limit_pct_fpl percent of the federal poverty level, which is recorded as income_attested
      true; Kestrel records the attestation and never checks income documents. A family membership covers no more than
      max_covered_members people, all at the enrolling patient's address where members_must_share_address is true.
      Kestrel enrolls patients itself only in programs whose enrollment_channel is pharmacy_enrolled; for the others it
      records the enrollment the patient already obtained from the manufacturer hub or foundation.
    eligibility:
      - id: commercial_coverage_active
        applies_to: [copay_enrolled]
        kind: state
        condition: A program whose requires_commercial_coverage is true is enrolled only when the patient has a coverage record in active status whose class is not a government program.
        evidence_fields: [coverage_plans.status, coverage_plans.variant_name, coverage_plans.coverage_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [coverage_plans.coverage_id]
          action_bindings:
            coverage_plans.coverage_id: linked_coverage_id
        state_contract:
          field: coverage_plans.status
          allowed: [active]
      - id: prescription_on_file
        applies_to: [copay_enrolled]
        kind: state
        condition: Where enrollment_requires_valid_rx is true the program is enrolled only for a drug with a Kestrel prescription in received or active status.
        evidence_fields: [rx_prescriptions.status, rx_prescriptions.prescription_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rx_prescriptions.prescription_id]
          action_bindings:
            rx_prescriptions.prescription_id: prescription_id
        state_contract:
          field: rx_prescriptions.status
          allowed: [received, active]
      - id: income_attested
        applies_to: [copay_enrolled]
        kind: caller_fact
        condition: Where income_attestation_required is true the program is enrolled only after the patient attests that household income is no more than income_limit_pct_fpl percent of the federal poverty level, which is recorded as income_attested true; Kestrel records the attestation and never checks income documents.
        evidence_fields: [copay_enrollments.income_attested, copay_enrollments.customer_id]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys:
            - [copay_enrollments.customer_id]
          action_bindings:
            copay_enrollments.customer_id: customer_id
    params:
      per_tier:
        Kestrel Rx Discount Card: {requires_commercial_coverage: =requires_commercial_coverage, government_coverage_disallowed: =government_coverage_disallowed, enrollment_requires_valid_rx: =enrollment_requires_valid_rx, requires_pa_pending_or_denied: =requires_pa_pending_or_denied, min_age_years: =min_age_years, income_attestation_required: =income_attestation_required, income_limit_pct_fpl: =income_limit_pct_fpl, max_covered_members: =max_covered_members, members_must_share_address: =members_must_share_address, enrollment_channel: =enrollment_channel}
        Kestrel Rx Savings Club Individual: {requires_commercial_coverage: =requires_commercial_coverage, government_coverage_disallowed: =government_coverage_disallowed, enrollment_requires_valid_rx: =enrollment_requires_valid_rx, requires_pa_pending_or_denied: =requires_pa_pending_or_denied, min_age_years: =min_age_years, income_attestation_required: =income_attestation_required, income_limit_pct_fpl: =income_limit_pct_fpl, max_covered_members: =max_covered_members, members_must_share_address: =members_must_share_address, enrollment_channel: =enrollment_channel}
        Kestrel Rx Savings Club Family: {requires_commercial_coverage: =requires_commercial_coverage, government_coverage_disallowed: =government_coverage_disallowed, enrollment_requires_valid_rx: =enrollment_requires_valid_rx, requires_pa_pending_or_denied: =requires_pa_pending_or_denied, min_age_years: =min_age_years, income_attestation_required: =income_attestation_required, income_limit_pct_fpl: =income_limit_pct_fpl, max_covered_members: =max_covered_members, members_must_share_address: =members_must_share_address, enrollment_channel: =enrollment_channel}
        Manufacturer Copay Card: {requires_commercial_coverage: =requires_commercial_coverage, government_coverage_disallowed: =government_coverage_disallowed, enrollment_requires_valid_rx: =enrollment_requires_valid_rx, requires_pa_pending_or_denied: =requires_pa_pending_or_denied, min_age_years: =min_age_years, income_attestation_required: =income_attestation_required, income_limit_pct_fpl: =income_limit_pct_fpl, max_covered_members: =max_covered_members, members_must_share_address: =members_must_share_address, enrollment_channel: =enrollment_channel}
        Manufacturer Bridge Program: {requires_commercial_coverage: =requires_commercial_coverage, government_coverage_disallowed: =government_coverage_disallowed, enrollment_requires_valid_rx: =enrollment_requires_valid_rx, requires_pa_pending_or_denied: =requires_pa_pending_or_denied, min_age_years: =min_age_years, income_attestation_required: =income_attestation_required, income_limit_pct_fpl: =income_limit_pct_fpl, max_covered_members: =max_covered_members, members_must_share_address: =members_must_share_address, enrollment_channel: =enrollment_channel}
        Charitable Foundation Copay Grant: {requires_commercial_coverage: =requires_commercial_coverage, government_coverage_disallowed: =government_coverage_disallowed, enrollment_requires_valid_rx: =enrollment_requires_valid_rx, requires_pa_pending_or_denied: =requires_pa_pending_or_denied, min_age_years: =min_age_years, income_attestation_required: =income_attestation_required, income_limit_pct_fpl: =income_limit_pct_fpl, max_covered_members: =max_covered_members, members_must_share_address: =members_must_share_address, enrollment_channel: =enrollment_channel}
  - id: copay_activation_and_term
    subject: [copay_activated, copay_expired, copay_renewed, copay_household_updated]
    rule: >-
      Where activation_required is false the program is activated on the day it is enrolled. Otherwise it is activated
      by its first paid program claim where activation_by_first_claim is true, by the award letter's start date for a
      foundation grant, or by payment of the membership fee for a club. An enrollment is activated no later than the
      date the patient enrolled plus the activation window days, counted in calendar days with the enrollment date as
      day 0; an enrollment not activated by then expires. Where has_expiration is true the expiration_date is the
      activation date plus membership_term_months, the month-end falling back to the last day of a shorter month, and
      the program expires on the day after it. A membership whose auto_renew is true renews at expiration for another
      membership_term_months and charges enrollment_fee_usd again as an annual_renewal; where that charge cannot be
      collected, program prices are still honored for renewal_grace_days and the membership then expires. A program
      whose reenrollment_allowed_after_expiry is false is never enrolled again for the same drug, and one whose
      reenrollment_allowed_after_expiry is true may be renewed or re-applied for no earlier than renewal_lead_days before
      its expiration_date. Household members are
      added or removed only on a family membership and never above max_covered_members.
    eligibility:
      - id: activation_window
        applies_to: [copay_activated]
        kind: time
        condition: An enrollment is activated no later than the date the patient enrolled plus the activation window days, counted in calendar days with the enrollment date as day 0; an enrollment not activated by then expires.
        evidence_fields: [copay_enrollments.opened_date, copay_enrollments.enrollment_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [copay_enrollments.enrollment_id]
          action_bindings:
            copay_enrollments.enrollment_id: enrollment_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the date the patient enrolled
          anchor_source: copay_enrollments.opened_date
          relation: not_after
          duration_source: params.activation_window_days
          unit: calendar_days
          counting_rule: counted in calendar days with the enrollment date as day 0
          boundary: inclusive
    params:
      per_tier:
        Kestrel Rx Discount Card: {renewal_lead_days: =renewal_lead_days, activation_required: =activation_required, activation_window_days: =activation_window_days, activation_by_first_claim: =activation_by_first_claim, has_expiration: =has_expiration, membership_term_months: =membership_term_months, auto_renew: =auto_renew, renewal_grace_days: =renewal_grace_days, reenrollment_allowed_after_expiry: =reenrollment_allowed_after_expiry}
        Kestrel Rx Savings Club Individual: {renewal_lead_days: =renewal_lead_days, activation_required: =activation_required, activation_window_days: =activation_window_days, activation_by_first_claim: =activation_by_first_claim, has_expiration: =has_expiration, membership_term_months: =membership_term_months, auto_renew: =auto_renew, renewal_grace_days: =renewal_grace_days, reenrollment_allowed_after_expiry: =reenrollment_allowed_after_expiry}
        Kestrel Rx Savings Club Family: {renewal_lead_days: =renewal_lead_days, activation_required: =activation_required, activation_window_days: =activation_window_days, activation_by_first_claim: =activation_by_first_claim, has_expiration: =has_expiration, membership_term_months: =membership_term_months, auto_renew: =auto_renew, renewal_grace_days: =renewal_grace_days, reenrollment_allowed_after_expiry: =reenrollment_allowed_after_expiry}
        Manufacturer Copay Card: {renewal_lead_days: =renewal_lead_days, activation_required: =activation_required, activation_window_days: =activation_window_days, activation_by_first_claim: =activation_by_first_claim, has_expiration: =has_expiration, membership_term_months: =membership_term_months, auto_renew: =auto_renew, renewal_grace_days: =renewal_grace_days, reenrollment_allowed_after_expiry: =reenrollment_allowed_after_expiry}
        Manufacturer Bridge Program: {renewal_lead_days: =renewal_lead_days, activation_required: =activation_required, activation_window_days: =activation_window_days, activation_by_first_claim: =activation_by_first_claim, has_expiration: =has_expiration, membership_term_months: =membership_term_months, auto_renew: =auto_renew, renewal_grace_days: =renewal_grace_days, reenrollment_allowed_after_expiry: =reenrollment_allowed_after_expiry}
        Charitable Foundation Copay Grant: {renewal_lead_days: =renewal_lead_days, activation_required: =activation_required, activation_window_days: =activation_window_days, activation_by_first_claim: =activation_by_first_claim, has_expiration: =has_expiration, membership_term_months: =membership_term_months, auto_renew: =auto_renew, renewal_grace_days: =renewal_grace_days, reenrollment_allowed_after_expiry: =reenrollment_allowed_after_expiry}
  - id: copay_evt_benefit_period
    subject: [copay_benefit_period_opened, copay_benefit_period_closed]
    rule: >-
      A program with a dollar budget opens a benefit period at activation and at the start of each new period under its
      benefit_period_basis, crediting annual_benefit_max_usd. A period's dollars belong to that period only: when the
      period ends, or the program expires or is cancelled, whatever is left is closed out and never carried into the
      next period. A benefit period is opened only while the enrollment is in active status. A period is opened and
      closed once each.
    eligibility:
      - id: open_only_when_active
        applies_to: [copay_benefit_period_opened]
        kind: state
        condition: A benefit period is opened only while the enrollment is in active status.
        evidence_fields: [copay_enrollments.status, copay_enrollments.enrollment_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [copay_enrollments.enrollment_id]
          action_bindings:
            copay_enrollments.enrollment_id: enrollment_id
        state_contract:
          field: copay_enrollments.status
          allowed: [active]
    params:
      per_tier:
        Kestrel Rx Discount Card: {annual_benefit_max_usd: =annual_benefit_max_usd, benefit_period_basis: =benefit_period_basis}
        Kestrel Rx Savings Club Individual: {annual_benefit_max_usd: =annual_benefit_max_usd, benefit_period_basis: =benefit_period_basis}
        Kestrel Rx Savings Club Family: {annual_benefit_max_usd: =annual_benefit_max_usd, benefit_period_basis: =benefit_period_basis}
        Manufacturer Copay Card: {annual_benefit_max_usd: =annual_benefit_max_usd, benefit_period_basis: =benefit_period_basis}
        Manufacturer Bridge Program: {annual_benefit_max_usd: =annual_benefit_max_usd, benefit_period_basis: =benefit_period_basis}
        Charitable Foundation Copay Grant: {annual_benefit_max_usd: =annual_benefit_max_usd, benefit_period_basis: =benefit_period_basis}
    formula:
      amount_usd: annual_benefit_max_usd
  - id: copay_evt_benefit_application
    subject: [copay_benefit_applied, copay_benefit_reversed]
    rule: >-
      A benefit is applied only while the enrollment is in active status. It is applied to the patient pay of a paid
      insurance claim for the program's drug, for a fill of no more than max_days_supply_per_benefit_fill days. The
      amount is the patient pay less patient_minimum_pay_usd, limited to per_fill_benefit_max_usd where
      per_fill_cap_applies is true, and limited to the benefit_remaining_usd of the enrollment; the patient pays the
      rest. Where fill_count_cap_applies is true no benefit is applied once copay_msr_benefit_fills_period has reached
      max_fills_per_benefit_period. A benefit is applied once per fill. A benefit is applied to a fill already paid by
      the patient no later than the date of that fill plus the retro claim window days, counted in calendar days with
      the fill date as day 0, and the patient is refunded the benefit amount. When the insurance claim a benefit was
      applied to is reversed, the benefit is reversed for its full amount and the dollars return to the same benefit
      period.
    eligibility:
      - id: apply_only_when_active
        applies_to: [copay_benefit_applied]
        kind: state
        condition: A benefit is applied only while the enrollment is in active status.
        evidence_fields: [copay_enrollments.status, copay_enrollments.enrollment_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [copay_enrollments.enrollment_id]
          action_bindings:
            copay_enrollments.enrollment_id: enrollment_id
        state_contract:
          field: copay_enrollments.status
          allowed: [active]
      - id: once_per_fill
        applies_to: [copay_benefit_applied]
        kind: dedup
        condition: A benefit is applied once per fill.
        evidence_fields: [copay_activity.fill_id, copay_activity.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [copay_activity.fill_id]
          action_bindings:
            copay_activity.fill_id: fill_id
        dedup_contract:
          table: copay_activity
          mode: separate_record
          object_bindings: {fill_id: fill_id}
          duplicate_filters: {event_type: [copay_benefit_applied]}
          distinct_fields: []
      - id: retro_window
        applies_to: [copay_benefit_applied]
        kind: time
        condition: A benefit is applied to a fill already paid by the patient no later than the date of that fill plus the retro claim window days, counted in calendar days with the fill date as day 0, and the patient is refunded the benefit amount.
        evidence_fields: [rx_fills.event_date, rx_fills.fill_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rx_fills.fill_id]
          action_bindings:
            rx_fills.fill_id: fill_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the date of that fill
          anchor_source: rx_fills.event_date
          relation: not_after
          duration_source: params.retro_claim_window_days
          unit: calendar_days
          counting_rule: counted in calendar days with the fill date as day 0
          boundary: inclusive
    params:
      per_tier:
        Kestrel Rx Discount Card: {patient_minimum_pay_usd: =patient_minimum_pay_usd, per_fill_cap_applies: =per_fill_cap_applies, per_fill_benefit_max_usd: =per_fill_benefit_max_usd, fill_count_cap_applies: =fill_count_cap_applies, max_fills_per_benefit_period: =max_fills_per_benefit_period, max_days_supply_per_benefit_fill: =max_days_supply_per_benefit_fill, retro_claim_window_days: =retro_claim_window_days}
        Kestrel Rx Savings Club Individual: {patient_minimum_pay_usd: =patient_minimum_pay_usd, per_fill_cap_applies: =per_fill_cap_applies, per_fill_benefit_max_usd: =per_fill_benefit_max_usd, fill_count_cap_applies: =fill_count_cap_applies, max_fills_per_benefit_period: =max_fills_per_benefit_period, max_days_supply_per_benefit_fill: =max_days_supply_per_benefit_fill, retro_claim_window_days: =retro_claim_window_days}
        Kestrel Rx Savings Club Family: {patient_minimum_pay_usd: =patient_minimum_pay_usd, per_fill_cap_applies: =per_fill_cap_applies, per_fill_benefit_max_usd: =per_fill_benefit_max_usd, fill_count_cap_applies: =fill_count_cap_applies, max_fills_per_benefit_period: =max_fills_per_benefit_period, max_days_supply_per_benefit_fill: =max_days_supply_per_benefit_fill, retro_claim_window_days: =retro_claim_window_days}
        Manufacturer Copay Card: {patient_minimum_pay_usd: =patient_minimum_pay_usd, per_fill_cap_applies: =per_fill_cap_applies, per_fill_benefit_max_usd: =per_fill_benefit_max_usd, fill_count_cap_applies: =fill_count_cap_applies, max_fills_per_benefit_period: =max_fills_per_benefit_period, max_days_supply_per_benefit_fill: =max_days_supply_per_benefit_fill, retro_claim_window_days: =retro_claim_window_days}
        Manufacturer Bridge Program: {patient_minimum_pay_usd: =patient_minimum_pay_usd, per_fill_cap_applies: =per_fill_cap_applies, per_fill_benefit_max_usd: =per_fill_benefit_max_usd, fill_count_cap_applies: =fill_count_cap_applies, max_fills_per_benefit_period: =max_fills_per_benefit_period, max_days_supply_per_benefit_fill: =max_days_supply_per_benefit_fill, retro_claim_window_days: =retro_claim_window_days}
        Charitable Foundation Copay Grant: {patient_minimum_pay_usd: =patient_minimum_pay_usd, per_fill_cap_applies: =per_fill_cap_applies, per_fill_benefit_max_usd: =per_fill_benefit_max_usd, fill_count_cap_applies: =fill_count_cap_applies, max_fills_per_benefit_period: =max_fills_per_benefit_period, max_days_supply_per_benefit_fill: =max_days_supply_per_benefit_fill, retro_claim_window_days: =retro_claim_window_days}
    formula:
      amount_usd: min(patient_pay_before_usd - patient_minimum_pay_usd, per_fill_benefit_max_usd, benefit_remaining_usd) if per_fill_cap_applies else min(patient_pay_before_usd - patient_minimum_pay_usd, benefit_remaining_usd)
      patient_pay_after_usd: patient_pay_before_usd - amount_usd
    measures: [copay_msr_benefit_fills_period]
  - id: copay_evt_discount_pricing
    subject: [copay_discount_applied]
    rule: >-
      A discount price is applied only while the enrollment is in active status, and only to a fill that is not billed
      to insurance. Where value_list_available is true, a generic on the Kestrel Value Generics list is priced at
      value_generic_30_day_price_usd for up to 30 days or value_generic_90_day_price_usd for 31 to
      value_list_max_days_supply days. Any other generic is priced at the usual and customary price less
      generic_discount_pct percent, and a brand at the usual price less brand_discount_pct percent, rounded to the cent
      half up. The price is never below minimum_cash_price_usd and never above the usual price. Where
      excludes_specialty_drugs is true a specialty prescription gets no discount. A cash vaccine is discounted by
      vaccine_discount_pct under the immunization charter. The discount applies to prescriptions of the enrolling patient
      and, for a family membership, of the covered household members only.
    eligibility:
      - id: discount_only_when_active
        applies_to: [copay_discount_applied]
        kind: state
        condition: A discount price is applied only while the enrollment is in active status, and only to a fill that is not billed to insurance.
        evidence_fields: [copay_enrollments.status, copay_enrollments.enrollment_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [copay_enrollments.enrollment_id]
          action_bindings:
            copay_enrollments.enrollment_id: enrollment_id
        state_contract:
          field: copay_enrollments.status
          allowed: [active]
    params:
      per_tier:
        Kestrel Rx Discount Card: {value_list_available: =value_list_available, value_generic_30_day_price_usd: =value_generic_30_day_price_usd, value_generic_90_day_price_usd: =value_generic_90_day_price_usd, value_list_max_days_supply: =value_list_max_days_supply, generic_discount_pct: =generic_discount_pct, brand_discount_pct: =brand_discount_pct, minimum_cash_price_usd: =minimum_cash_price_usd, excludes_specialty_drugs: =excludes_specialty_drugs, vaccine_discount_pct: =vaccine_discount_pct}
        Kestrel Rx Savings Club Individual: {value_list_available: =value_list_available, value_generic_30_day_price_usd: =value_generic_30_day_price_usd, value_generic_90_day_price_usd: =value_generic_90_day_price_usd, value_list_max_days_supply: =value_list_max_days_supply, generic_discount_pct: =generic_discount_pct, brand_discount_pct: =brand_discount_pct, minimum_cash_price_usd: =minimum_cash_price_usd, excludes_specialty_drugs: =excludes_specialty_drugs, vaccine_discount_pct: =vaccine_discount_pct}
        Kestrel Rx Savings Club Family: {value_list_available: =value_list_available, value_generic_30_day_price_usd: =value_generic_30_day_price_usd, value_generic_90_day_price_usd: =value_generic_90_day_price_usd, value_list_max_days_supply: =value_list_max_days_supply, generic_discount_pct: =generic_discount_pct, brand_discount_pct: =brand_discount_pct, minimum_cash_price_usd: =minimum_cash_price_usd, excludes_specialty_drugs: =excludes_specialty_drugs, vaccine_discount_pct: =vaccine_discount_pct}
        Manufacturer Copay Card: {value_list_available: =value_list_available, value_generic_30_day_price_usd: =value_generic_30_day_price_usd, value_generic_90_day_price_usd: =value_generic_90_day_price_usd, value_list_max_days_supply: =value_list_max_days_supply, generic_discount_pct: =generic_discount_pct, brand_discount_pct: =brand_discount_pct, minimum_cash_price_usd: =minimum_cash_price_usd, excludes_specialty_drugs: =excludes_specialty_drugs, vaccine_discount_pct: =vaccine_discount_pct}
        Manufacturer Bridge Program: {value_list_available: =value_list_available, value_generic_30_day_price_usd: =value_generic_30_day_price_usd, value_generic_90_day_price_usd: =value_generic_90_day_price_usd, value_list_max_days_supply: =value_list_max_days_supply, generic_discount_pct: =generic_discount_pct, brand_discount_pct: =brand_discount_pct, minimum_cash_price_usd: =minimum_cash_price_usd, excludes_specialty_drugs: =excludes_specialty_drugs, vaccine_discount_pct: =vaccine_discount_pct}
        Charitable Foundation Copay Grant: {value_list_available: =value_list_available, value_generic_30_day_price_usd: =value_generic_30_day_price_usd, value_generic_90_day_price_usd: =value_generic_90_day_price_usd, value_list_max_days_supply: =value_list_max_days_supply, generic_discount_pct: =generic_discount_pct, brand_discount_pct: =brand_discount_pct, minimum_cash_price_usd: =minimum_cash_price_usd, excludes_specialty_drugs: =excludes_specialty_drugs, vaccine_discount_pct: =vaccine_discount_pct}
    formula:
      amount_usd: usual_price_usd - patient_pay_after_usd
  - id: copay_evt_bridge_supply
    subject: [copay_bridge_fill]
    rule: >-
      A bridge fill is supplied only while the enrollment is in active status and the patient's prior authorization for
      the drug is still waiting for a decision or was denied; once an approval is recorded the drug is billed to
      insurance and any copay card applies instead. Each bridge fill carries no more than
      max_days_supply_per_benefit_fill days, costs the patient nothing, and where specialty_pharmacy_only is true is
      dispensed by Kestrel Specialty Pharmacy. No bridge fill is supplied once copay_msr_benefit_fills_period has
      reached max_fills_per_benefit_period.
    eligibility:
      - id: bridge_only_when_active
        applies_to: [copay_bridge_fill]
        kind: state
        condition: A bridge fill is supplied only while the enrollment is in active status and the patient's prior authorization for the drug is still waiting for a decision or was denied; once an approval is recorded the drug is billed to insurance and any copay card applies instead.
        evidence_fields: [copay_enrollments.status, copay_enrollments.enrollment_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [copay_enrollments.enrollment_id]
          action_bindings:
            copay_enrollments.enrollment_id: enrollment_id
        state_contract:
          field: copay_enrollments.status
          allowed: [active]
    params:
      per_tier:
        Kestrel Rx Discount Card: {max_fills_per_benefit_period: =max_fills_per_benefit_period, specialty_pharmacy_only: =specialty_pharmacy_only, adjudication_method: =adjudication_method}
        Kestrel Rx Savings Club Individual: {max_fills_per_benefit_period: =max_fills_per_benefit_period, specialty_pharmacy_only: =specialty_pharmacy_only, adjudication_method: =adjudication_method}
        Kestrel Rx Savings Club Family: {max_fills_per_benefit_period: =max_fills_per_benefit_period, specialty_pharmacy_only: =specialty_pharmacy_only, adjudication_method: =adjudication_method}
        Manufacturer Copay Card: {max_fills_per_benefit_period: =max_fills_per_benefit_period, specialty_pharmacy_only: =specialty_pharmacy_only, adjudication_method: =adjudication_method}
        Manufacturer Bridge Program: {max_fills_per_benefit_period: =max_fills_per_benefit_period, specialty_pharmacy_only: =specialty_pharmacy_only, adjudication_method: =adjudication_method}
        Charitable Foundation Copay Grant: {max_fills_per_benefit_period: =max_fills_per_benefit_period, specialty_pharmacy_only: =specialty_pharmacy_only, adjudication_method: =adjudication_method}
    measures: [copay_msr_benefit_fills_period]
  - id: copay_evt_membership_fees
    subject: [copay_membership_fee_charged, copay_membership_fee_refunded]
    rule: >-
      A paid membership charges enrollment_fee_usd at activation and at each renewal, once per term. A fee is refunded in
      full only when the refund is made no later than the date the fee was charged plus the fee refund window days,
      counted in calendar days with the charge date as day 0, and, where fee_refund_requires_no_use is true, only when
      copay_msr_discount_uses_since_fee is 0. A fee is refunded at most once. A fee outside the window, or after a
      discounted fill, is not refunded, and cancelling the membership then only stops the next renewal. A fee charged
      twice for the same term is refunded as duplicate_charge whatever the window.
    eligibility:
      - id: fee_refund_window
        applies_to: [copay_membership_fee_refunded]
        kind: time
        condition: A fee is refunded in full only when the refund is made no later than the date the fee was charged plus the fee refund window days, counted in calendar days with the charge date as day 0, and, where fee_refund_requires_no_use is true, only when copay_msr_discount_uses_since_fee is 0.
        evidence_fields: [copay_activity.event_date, copay_activity.activity_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [copay_activity.activity_id]
          action_bindings:
            copay_activity.activity_id: source_activity_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the date the fee was charged
          anchor_source: copay_activity.event_date
          relation: not_after
          duration_source: params.fee_refund_window_days
          unit: calendar_days
          counting_rule: counted in calendar days with the charge date as day 0
          boundary: inclusive
      - id: refund_once
        applies_to: [copay_membership_fee_refunded]
        kind: dedup
        condition: A fee is refunded at most once.
        evidence_fields: [copay_activity.source_activity_id, copay_activity.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [copay_activity.source_activity_id]
          action_bindings:
            copay_activity.source_activity_id: source_activity_id
        dedup_contract:
          table: copay_activity
          mode: separate_record
          object_bindings: {source_activity_id: source_activity_id}
          duplicate_filters: {event_type: [copay_membership_fee_refunded]}
          distinct_fields: []
    params:
      per_tier:
        Kestrel Rx Discount Card: {enrollment_fee_usd: =enrollment_fee_usd, fee_refund_window_days: =fee_refund_window_days, fee_refund_requires_no_use: =fee_refund_requires_no_use}
        Kestrel Rx Savings Club Individual: {enrollment_fee_usd: =enrollment_fee_usd, fee_refund_window_days: =fee_refund_window_days, fee_refund_requires_no_use: =fee_refund_requires_no_use}
        Kestrel Rx Savings Club Family: {enrollment_fee_usd: =enrollment_fee_usd, fee_refund_window_days: =fee_refund_window_days, fee_refund_requires_no_use: =fee_refund_requires_no_use}
        Manufacturer Copay Card: {enrollment_fee_usd: =enrollment_fee_usd, fee_refund_window_days: =fee_refund_window_days, fee_refund_requires_no_use: =fee_refund_requires_no_use}
        Manufacturer Bridge Program: {enrollment_fee_usd: =enrollment_fee_usd, fee_refund_window_days: =fee_refund_window_days, fee_refund_requires_no_use: =fee_refund_requires_no_use}
        Charitable Foundation Copay Grant: {enrollment_fee_usd: =enrollment_fee_usd, fee_refund_window_days: =fee_refund_window_days, fee_refund_requires_no_use: =fee_refund_requires_no_use}
    formula:
      amount_usd: enrollment_fee_usd
    measures: [copay_msr_discount_uses_since_fee]
  - id: copay_suspension_and_cancellation
    subject: [copay_suspended, copay_reinstated, copay_cancelled]
    rule: >-
      Where suspension_on_government_coverage is true the program is suspended as soon as the patient's primary coverage
      on file is a government class, and where requires_commercial_coverage is true also when the commercial coverage it
      is linked to is terminated or removed. A suspended program is reinstated no later than the date it was suspended
      plus the suspension resume window days, counted in calendar days with the suspension date as day 0, and only once
      the cause is gone; after that it expires. A program is cancelled only at the patient's own request, which the
      patient confirms themselves; cancelling keeps every benefit already applied and refunds a membership fee only as
      copay_evt_membership_fees allows. Where rewards_points_on_program_fills is false, fills paid with the program's
      help earn no rewards points under the rewards charter.
    eligibility:
      - id: resume_window
        applies_to: [copay_reinstated]
        kind: time
        condition: A suspended program is reinstated no later than the date it was suspended plus the suspension resume window days, counted in calendar days with the suspension date as day 0, and only once the cause is gone; after that it expires.
        evidence_fields: [copay_enrollments.suspended_date, copay_enrollments.enrollment_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [copay_enrollments.enrollment_id]
          action_bindings:
            copay_enrollments.enrollment_id: enrollment_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the date it was suspended
          anchor_source: copay_enrollments.suspended_date
          relation: not_after
          duration_source: params.suspension_resume_window_days
          unit: calendar_days
          counting_rule: counted in calendar days with the suspension date as day 0
          boundary: inclusive
    params:
      per_tier:
        Kestrel Rx Discount Card: {suspension_on_government_coverage: =suspension_on_government_coverage, suspension_resume_window_days: =suspension_resume_window_days, rewards_points_on_program_fills: =rewards_points_on_program_fills}
        Kestrel Rx Savings Club Individual: {suspension_on_government_coverage: =suspension_on_government_coverage, suspension_resume_window_days: =suspension_resume_window_days, rewards_points_on_program_fills: =rewards_points_on_program_fills}
        Kestrel Rx Savings Club Family: {suspension_on_government_coverage: =suspension_on_government_coverage, suspension_resume_window_days: =suspension_resume_window_days, rewards_points_on_program_fills: =rewards_points_on_program_fills}
        Manufacturer Copay Card: {suspension_on_government_coverage: =suspension_on_government_coverage, suspension_resume_window_days: =suspension_resume_window_days, rewards_points_on_program_fills: =rewards_points_on_program_fills}
        Manufacturer Bridge Program: {suspension_on_government_coverage: =suspension_on_government_coverage, suspension_resume_window_days: =suspension_resume_window_days, rewards_points_on_program_fills: =rewards_points_on_program_fills}
        Charitable Foundation Copay Grant: {suspension_on_government_coverage: =suspension_on_government_coverage, suspension_resume_window_days: =suspension_resume_window_days, rewards_points_on_program_fills: =rewards_points_on_program_fills}

extended_policies:
- id: copay_ext_club_cash_price
  base_policy_refs:
  - copay_agg_program_stacking
  - copay_evt_discount_pricing
  - copay_activation_and_term
  overwrite:
  - base_policy: copay_evt_discount_pricing
    superseded_clause: Any other generic is priced at the usual and customary price less generic_discount_pct percent,
      and a brand at the usual price less brand_discount_pct percent, rounded to the cent half up.
    replaced_by: The generic discount percentage, the member-years points and the days-supply points are first added
      into one total percentage, and the usual and customary price is reduced once by that total percentage and
      rounded to the cent half up; the percentages never act one after another.
  - base_policy: copay_activation_and_term
    superseded_clause: where that charge cannot be collected, program prices are still honored for renewal_grace_days
      and the membership then expires.
    replaced_by: A club price for a fill is fixed only after the membership fees account carries a fee charge for
      the membership term in which the fill date falls. A membership whose renewal fee cannot be collected still
      expires once the renewal grace days pass without a renewal fee charge for the new term.
  trigger: on_request
  subject:
  - copay_discount_applied
  computes: patient_pay_after_usd
  target_tool: apply_club_cash_price_c625f91d
  params:
    platinum_rate_pct: 35
    platinum_pickups: 10
    gold_rate_pct: 30
    gold_pickups: 6
    years_top_charges: 5
    years_mid_charges: 4
    years_pts_top: 6
    years_pts_mid: 4
    supply_long_days: 84
    supply_short_days: 30
    supply_pts_long: 3
    supply_pts_mid: 1
    adherence_credit_usd: 2.0
    refill_multiplier: 0.98
  rule: 'This policy sets the club price of a prescription fill sold for cash, not billed to insurance, under an
    active Kestrel Rx Savings Club membership, for a generic that is not on the Kestrel Value Generics list and
    for a brand; a value-list generic keeps its fixed value price. A club price for a fill is fixed only after the
    membership fees account carries a fee charge for the membership term in which the fill date falls. A membership
    whose renewal fee cannot be collected still expires once the renewal grace days pass without a renewal fee charge
    for the new term. The usual and customary price of the fill is the patient pay that the fill ledger shows on
    the patient''s latest cash fill, which is the fill being priced, and its days supply is the days supply dispensed
    on that fill. The standard club price of a generic fill is the usual and customary price less the program''s
    generic discount percentage, rounded to the cent half up. The club price is never below the program''s minimum
    cash price and never above the usual and customary price. The generic discount percentage a club price starts
    from depends on the patient''s Kestrel Care Rewards level and on the prescription pickups the fill ledger shows
    dated fewer than 12 whole months before today: a Kestrel Care Rewards Platinum member with 10 or more such pickups
    gets 35 percent, a Kestrel Care Rewards Gold member with 6 or more such pickups gets 30 percent, and every other
    patient gets the program''s generic discount percentage. Member-years points on the club price are set by the
    membership fee charges standing on the membership, counted as every fee charge booked less every fee charge
    refunded: 5 or more standing charges add 6 percentage points, exactly 4 standing charges add 4 percentage points,
    and fewer add none. Days-supply points on the club price are set by the days supply dispensed on the fill: 84
    days or more add 3 percentage points, 31 to 83 days add 1 percentage point, and 30 days or fewer add none. The
    generic discount percentage, the member-years points and the days-supply points are first added into one total
    percentage, and the usual and customary price is reduced once by that total percentage and rounded to the cent
    half up; the percentages never act one after another. The patient''s active automated refill enrollment then
    decides how that rounded discounted price is finished: under Kestrel Auto Refill 90-Day or Kestrel Med Sync
    90-Day a flat 90-day adherence credit of 2.00 dollars is taken off it, under any other automated refill program
    in active status it is multiplied by 0.98 and rounded to the cent half up, and with no automated refill enrollment
    in active status it stands as it is. The minimum cash price and the usual-price limit are applied to the finished
    price. A brand fill is priced at the usual and customary price less the program''s brand discount percentage,
    rounded to the cent half up, and none of the percentages, points or refill adjustments above applies to it.

    '
  prerequisite:
  - problem: copay_ext_club_renewal_fee
    kind: value_input
    gate: fee_charges_standing
    form: state
    policy_source: A club price for a fill is fixed only after the membership fees account carries a fee charge
      for the membership term in which the fill date falls.
    condition: The copay_activity ledger of the club enrollment carries a copay_membership_fee_charged entry whose
      benefit_period_start equals the enrollment's current benefit_period_start.
    resolved_by: pay_club_renewal_fee_425b5cbe
    effect: The renewal fee charge for the current term raises the standing fee charges by one, which can move the
      member-years points of the club price to a higher tier.
  cross_category:
  - category: rx
    as: history
    reads:
    - rx_fills.patient_pay_usd
    - rx_fills.days_supply_dispensed
    - rx_fills.product_dispensed
    - rx_fills.event_type
    note: The fill being priced and the prescription pickups in the last 12 whole months come from the fill ledger;
      the pickups decide the generic discount percentage tier and the days supply decides the days-supply points.
  - category: rewards
    as: branch
    reads:
    - variant_name
    - status
    note: The Kestrel Care Rewards level decides the generic discount percentage tier.
  - category: refill
    as: branch
    reads:
    - variant_name
    - status
    note: The active automated refill program decides how the discounted price is finished.
  compute:
  - fill_usual: XLATEST('rx', 'rx_fills', 'patient_pay_usd', payment_basis='cash')
  - fill_days: XLATEST('rx', 'rx_fills', 'days_supply_dispensed', payment_basis='cash')
  - fill_is_brand: XLATEST('rx', 'rx_fills', 'product_dispensed', payment_basis='cash') == 'brand'
  - rewards_level: CFIELD('rewards', 'variant_name', status='active')
  - pickups_12m: XCOUNT('rx', 'rx_fills', within_months=12, event_type='rx_pickup')
  - generic_rate_pct: K('platinum_rate_pct') if (rewards_level == 'Kestrel Care Rewards Platinum' and pickups_12m
      >= K('platinum_pickups')) else (K('gold_rate_pct') if (rewards_level == 'Kestrel Care Rewards Gold' and pickups_12m
      >= K('gold_pickups')) else P('generic_discount_pct'))
  - fee_charges_standing: COUNT('copay_activity', event_type='copay_membership_fee_charged') - COUNT('copay_activity',
      event_type='copay_membership_fee_refunded')
  - member_years_pts: K('years_pts_top') if fee_charges_standing >= K('years_top_charges') else (K('years_pts_mid')
      if fee_charges_standing == K('years_mid_charges') else 0)
  - supply_pts: K('supply_pts_long') if fill_days >= K('supply_long_days') else (K('supply_pts_mid') if fill_days
      > K('supply_short_days') else 0)
  - discounted_price: RND(fill_usual * (1 - (generic_rate_pct + member_years_pts + supply_pts) / 100.0), 2)
  - refill_program: CFIELD('refill', 'variant_name', status='active')
  - finished_price: RND(discounted_price - K('adherence_credit_usd'), 2) if (refill_program == 'Kestrel Auto Refill
      90-Day' or refill_program == 'Kestrel Med Sync 90-Day') else (RND(discounted_price * K('refill_multiplier'),
      2) if refill_program != None else discounted_price)
  - brand_price: RND(fill_usual * (1 - P('brand_discount_pct') / 100.0), 2)
  - result: MX(P('minimum_cash_price_usd'), MN(fill_usual, brand_price if fill_is_brand else finished_price))
  compute_basis:
    fill_usual: The usual and customary price of the fill is the patient pay that the fill ledger shows on the patient's
      latest cash fill, which is the fill being priced, and its days supply is the days supply dispensed on that
      fill.
    fill_days: The usual and customary price of the fill is the patient pay that the fill ledger shows on the patient's
      latest cash fill, which is the fill being priced, and its days supply is the days supply dispensed on that
      fill.
    fill_is_brand: A brand fill is priced at the usual and customary price less the program's brand discount percentage,
      rounded to the cent half up, and none of the percentages, points or refill adjustments above applies to it.
    rewards_level: The generic discount percentage a club price starts from depends on the patient's Kestrel Care
      Rewards level and on the prescription pickups the fill ledger shows dated fewer than 12 whole months before
      today
    pickups_12m: The generic discount percentage a club price starts from depends on the patient's Kestrel Care
      Rewards level and on the prescription pickups the fill ledger shows dated fewer than 12 whole months before
      today
    generic_rate_pct: a Kestrel Care Rewards Platinum member with 10 or more such pickups gets 35 percent, a Kestrel
      Care Rewards Gold member with 6 or more such pickups gets 30 percent, and every other patient gets the program's
      generic discount percentage.
    fee_charges_standing: Member-years points on the club price are set by the membership fee charges standing on
      the membership, counted as every fee charge booked less every fee charge refunded
    member_years_pts: 5 or more standing charges add 6 percentage points, exactly 4 standing charges add 4 percentage
      points, and fewer add none.
    supply_pts: 'Days-supply points on the club price are set by the days supply dispensed on the fill: 84 days
      or more add 3 percentage points, 31 to 83 days add 1 percentage point, and 30 days or fewer add none.'
    discounted_price: The generic discount percentage, the member-years points and the days-supply points are first
      added into one total percentage, and the usual and customary price is reduced once by that total percentage
      and rounded to the cent half up; the percentages never act one after another.
    refill_program: The patient's active automated refill enrollment then decides how that rounded discounted price
      is finished
    finished_price: under Kestrel Auto Refill 90-Day or Kestrel Med Sync 90-Day a flat 90-day adherence credit of
      2.00 dollars is taken off it, under any other automated refill program in active status it is multiplied by
      0.98 and rounded to the cent half up, and with no automated refill enrollment in active status it stands as
      it is.
    brand_price: A brand fill is priced at the usual and customary price less the program's brand discount percentage,
      rounded to the cent half up, and none of the percentages, points or refill adjustments above applies to it.
    result: The club price is never below the program's minimum cash price and never above the usual and customary
      price. The minimum cash price and the usual-price limit are applied to the finished price.
  factors:
  - id: generic_rate_by_rewards_and_pickups
    effect: parameter
    decides: generic_rate_pct
    bindings:
    - rewards_level
    - pickups_12m
    - generic_rate_pct
    ladder:
    - when: Kestrel Care Rewards Platinum member AND 10 or more prescription pickups dated fewer than 12 whole months
        before today
      value: K('platinum_rate_pct') = 35 percent
    - when: Kestrel Care Rewards Gold member AND 6 or more prescription pickups dated fewer than 12 whole months
        before today
      value: K('gold_rate_pct') = 30 percent
    - when: otherwise
      value: P('generic_discount_pct'), the program's generic discount percentage
    baseline:
      generic_rate_pct: P('generic_discount_pct')
    evidence:
    - cross_category
    - history
    cross_difficulty: rewards
  - id: member_years_points
    effect: parameter
    decides: member_years_pts
    bindings:
    - fee_charges_standing
    - member_years_pts
    ladder:
    - when: 5 or more membership fee charges standing (charges booked less charges refunded)
      value: K('years_pts_top') = 6 percentage points
    - when: exactly 4 membership fee charges standing
      value: K('years_pts_mid') = 4 percentage points
    - when: otherwise
      value: 0 percentage points
    baseline:
      member_years_pts: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: days_supply_points
    effect: parameter
    decides: supply_pts
    bindings:
    - fill_days
    - supply_pts
    ladder:
    - when: the fill's days supply dispensed is 84 days or more
      value: K('supply_pts_long') = 3 percentage points
    - when: the fill's days supply dispensed is 31 to 83 days
      value: K('supply_pts_mid') = 1 percentage point
    - when: otherwise (30 days or fewer)
      value: 0 percentage points
    baseline:
      supply_pts: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: rx
  - id: refill_program_finish
    effect: method
    decides: finished_price
    bindings:
    - refill_program
    - finished_price
    ladder:
    - when: an automated refill enrollment in active status under Kestrel Auto Refill 90-Day or Kestrel Med Sync
        90-Day
      method: a flat 90-day adherence credit of 2.00 dollars is subtracted from the rounded discounted price
    - when: an automated refill enrollment in active status under any other refill program
      method: the rounded discounted price is multiplied by 0.98 and rounded to the cent half up
    - when: otherwise (no automated refill enrollment in active status)
      method: the rounded discounted price stands as it is
    baseline:
      finished_price: discounted_price
    evidence:
    - cross_category
    cross_difficulty: refill
  baseline:
    rule: The usual and customary price of the fill is the patient pay that the fill ledger shows on the patient's
      latest cash fill, which is the fill being priced, and its days supply is the days supply dispensed on that
      fill. The standard club price of a generic fill is the usual and customary price less the program's generic
      discount percentage, rounded to the cent half up. The club price is never below the program's minimum cash
      price and never above the usual and customary price.
    params:
    - generic_discount_pct
    - minimum_cash_price_usd
  inputs:
    history:
    - category: rx
      table: rx_fills
      aggregate: latest
      field: patient_pay_usd
      filters:
        payment_basis: cash
    - category: rx
      table: rx_fills
      aggregate: latest
      field: days_supply_dispensed
      filters:
        payment_basis: cash
    - category: rx
      table: rx_fills
      aggregate: count
      field: fill_id
      within_months: 12
      filters:
        event_type: rx_pickup
    - table: copay_activity
      aggregate: count
      field: activity_id
      filters:
        event_type: copay_membership_fee_charged
    - table: copay_activity
      aggregate: count
      field: activity_id
      filters:
        event_type: copay_membership_fee_refunded
    cross_category:
