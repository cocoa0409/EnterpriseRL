- id: copay_ext_card_paid_fill_reimbursement
  base_policy_refs:
  - copay_agg_program_stacking
  - copay_evt_benefit_application
  overwrite:
  - base_policy: copay_evt_benefit_application
    superseded_clause: The amount is the patient pay less patient_minimum_pay_usd, limited to per_fill_benefit_max_usd
      where per_fill_cap_applies is true, and limited to the benefit_remaining_usd of the enrollment; the patient
      pays the rest.
    replaced_by: 'The reimbursement is worked out in this order: the claim''s patient pay is first limited to the
      reimbursement limit, the reimbursement minimum pay is then taken off that limited amount, the late-claim handling
      is then applied to what remains, and the result is finally held to the benefit dollars left on the program
      and never set below zero, rounded to the cent half up.'
  trigger: state_due
  subject:
  - copay_benefit_applied
  computes: amount_usd
  target_tool: submit_copay_card_reimbursement_c6a4b4a1
  params:
    cap_high: 1000.0
    cap_mid: 900.0
    cadence_high: 10
    cadence_mid: 6
    allow_high: 150.0
    allow_mid: 75.0
    allow_high_fills: 7
    allow_mid_fills: 4
    tenure_high: 50.0
    tenure_mid: 25.0
    tenure_high_months: 6
    tenure_mid_months: 3
    supply_triple_days: 84
    supply_double_days: 56
    min_high: 10.0
    min_mid: 7.5
    min_high_pay: 1000.0
    min_mid_pay: 500.0
    withhold_mid: 20.0
    withhold_mid_days: 30
    withhold_late_days: 90
    late_multiplier: 0.95
  rule: 'This policy sets the reimbursement a patient claims from a Manufacturer Copay Card for a fill of the card''s
    prescription that the patient already paid in full, the program not having been applied at the counter; the
    fill being reimbursed is the latest fill of the card''s prescription that the fill ledger shows settled by insurance
    alone, and its patient pay is the patient pay on the paid insurance claim for that fill number. The standard
    reimbursement on a fill the patient already paid is that fill''s claim patient pay limited to the program''s
    per-fill benefit maximum, less the program''s patient minimum pay, and never more than the benefit dollars left
    on the program, rounded to the cent half up. The benefit dollars left on the program are the credits of its
    period-opening entries and benefit reversals less its benefit entries and closing entries. The reimbursement
    limit per 28 days of supply starts from the patient''s plan and fill cadence: a patient whose linked coverage
    is a Commercial High-Deductible Health Plan with 10 or more refills of the card''s prescription dated fewer
    than 12 whole months before today gets 1,000.00 dollars, such a patient with 6 to 9 of those refills gets 900.00
    dollars, and every other patient gets the program''s per-fill benefit maximum. A standing allowance is added
    to that limit for the benefit entries standing on the program, counted as benefit entries less benefit reversals:
    7 or more add 150.00 dollars, 4 to 6 add 75.00 dollars, and fewer add nothing. A tenure allowance is added for
    the whole months from the date the program was opened to the fill date: 6 months or more add 50.00 dollars,
    3 to 5 months add 25.00 dollars, and fewer add nothing. The days supply of the fill then decides how that limit
    covers the fill: a fill of 84 days or more gets three times the limit, a fill of 56 to 83 days gets twice the
    limit, and a shorter fill gets the limit once. The reimbursement minimum pay follows the size of the claim''s
    patient pay: 1,000.00 dollars or more keeps 10.00 dollars with the patient, 500.00 to 999.99 dollars keeps 7.50
    dollars, and a smaller patient pay keeps the program''s patient minimum pay. The late-claim handling follows
    the calendar days from the fill date to today: more than 90 days has the reimbursement so far multiplied by
    0.95 and rounded to the cent half up, 31 to 90 days has a flat 20.00 dollars withheld from it, and 30 days or
    fewer leaves it as it is. The reimbursement is worked out in this order: the claim''s patient pay is first limited
    to the reimbursement limit, the reimbursement minimum pay is then taken off that limited amount, the late-claim
    handling is then applied to what remains, and the result is finally held to the benefit dollars left on the
    program and never set below zero, rounded to the cent half up.'
  prerequisite: []
  cross_category:
  - category: rx
    as: history
    reads:
    - rx_fills.fill_number
    - rx_fills.event_date
    - rx_fills.days_supply_dispensed
    - rx_fills.payment_basis
    - rx_fills.event_type
    note: The fill being reimbursed, its days supply and the refill cadence of the card's prescription come from
      the fill ledger.
  - category: coverage
    as: branch
    reads:
    - variant_name
    - coverage_claims.patient_pay_usd
    note: The linked plan class decides the reimbursement limit tier; the claim gives the patient pay.
  compute:
  - reimb_fill_number: XLATEST('rx', 'rx_fills', 'fill_number', payment_basis='insurance', prescription_id=F('prescription_id'))
  - reimb_fill_date: XLATEST('rx', 'rx_fills', 'event_date', payment_basis='insurance', prescription_id=F('prescription_id'))
  - reimb_fill_days: XLATEST('rx', 'rx_fills', 'days_supply_dispensed', payment_basis='insurance', prescription_id=F('prescription_id'))
  - reimb_patient_pay: XLATEST('coverage', 'coverage_claims', 'patient_pay_usd', event_type='coverage_claim_paid',
      prescription_id=F('prescription_id'), fill_number=reimb_fill_number)
  - reimb_plan: CFIELD('coverage', 'variant_name', coverage_id=F('linked_coverage_id'))
  - reimb_refills_12m: XCOUNT('rx', 'rx_fills', within_months=12, event_type='rx_refill', prescription_id=F('prescription_id'))
  - reimb_unit_limit: K('cap_high') if (reimb_plan == 'Commercial High-Deductible Health Plan' and reimb_refills_12m
      >= K('cadence_high')) else (K('cap_mid') if (reimb_plan == 'Commercial High-Deductible Health Plan' and reimb_refills_12m
      >= K('cadence_mid')) else P('per_fill_benefit_max_usd'))
  - reimb_standing_benefits: COUNT('copay_activity', event_type='copay_benefit_applied') - COUNT('copay_activity',
      event_type='copay_benefit_reversed')
  - reimb_standing_allowance: K('allow_high') if reimb_standing_benefits >= K('allow_high_fills') else (K('allow_mid')
      if reimb_standing_benefits >= K('allow_mid_fills') else 0)
  - reimb_tenure_months: MONTHS(F('opened_date'), reimb_fill_date)
  - reimb_tenure_allowance: K('tenure_high') if reimb_tenure_months >= K('tenure_high_months') else (K('tenure_mid')
      if reimb_tenure_months >= K('tenure_mid_months') else 0)
  - reimb_limit: (reimb_unit_limit + reimb_standing_allowance + reimb_tenure_allowance) * 3 if reimb_fill_days >=
      K('supply_triple_days') else ((reimb_unit_limit + reimb_standing_allowance + reimb_tenure_allowance) * 2 if
      reimb_fill_days >= K('supply_double_days') else (reimb_unit_limit + reimb_standing_allowance + reimb_tenure_allowance))
  - reimb_min_pay: K('min_high') if reimb_patient_pay >= K('min_high_pay') else (K('min_mid') if reimb_patient_pay
      >= K('min_mid_pay') else P('patient_minimum_pay_usd'))
  - reimb_days_waited: DAYS(reimb_fill_date, NOW)
  - reimb_dollars_left: SUM('copay_activity', 'amount_usd', event_type='copay_benefit_period_opened') + SUM('copay_activity',
      'amount_usd', event_type='copay_benefit_reversed') - SUM('copay_activity', 'amount_usd', event_type='copay_benefit_applied')
      - SUM('copay_activity', 'amount_usd', event_type='copay_benefit_period_closed')
  - reimb_before_late: MN(reimb_patient_pay, reimb_limit) - reimb_min_pay
  - reimb_after_late: RND(reimb_before_late * K('late_multiplier'), 2) if reimb_days_waited > K('withhold_late_days')
      else (reimb_before_late - K('withhold_mid') if reimb_days_waited > K('withhold_mid_days') else reimb_before_late)
  - result: RND(MX(0, MN(reimb_dollars_left, reimb_after_late)), 2)
  compute_basis:
    reimb_fill_number: the fill being reimbursed is the latest fill of the card's prescription that the fill ledger
      shows settled by insurance alone, and its patient pay is the patient pay on the paid insurance claim for that
      fill number.
    reimb_fill_date: the fill being reimbursed is the latest fill of the card's prescription that the fill ledger
      shows settled by insurance alone
    reimb_fill_days: The days supply of the fill then decides how that limit covers the fill
    reimb_patient_pay: its patient pay is the patient pay on the paid insurance claim for that fill number.
    reimb_plan: a patient whose linked coverage is a Commercial High-Deductible Health Plan with 10 or more refills
      of the card's prescription dated fewer than 12 whole months before today gets 1,000.00 dollars
    reimb_refills_12m: a patient whose linked coverage is a Commercial High-Deductible Health Plan with 10 or more
      refills of the card's prescription dated fewer than 12 whole months before today gets 1,000.00 dollars
    reimb_unit_limit: a patient whose linked coverage is a Commercial High-Deductible Health Plan with 10 or more
      refills of the card's prescription dated fewer than 12 whole months before today gets 1,000.00 dollars, such
      a patient with 6 to 9 of those refills gets 900.00 dollars, and every other patient gets the program's per-fill
      benefit maximum.
    reimb_standing_benefits: A standing allowance is added to that limit for the benefit entries standing on the
      program, counted as benefit entries less benefit reversals
    reimb_standing_allowance: 7 or more add 150.00 dollars, 4 to 6 add 75.00 dollars, and fewer add nothing.
    reimb_tenure_months: A tenure allowance is added for the whole months from the date the program was opened to
      the fill date
    reimb_tenure_allowance: 6 months or more add 50.00 dollars, 3 to 5 months add 25.00 dollars, and fewer add nothing.
    reimb_limit: a fill of 84 days or more gets three times the limit, a fill of 56 to 83 days gets twice the limit,
      and a shorter fill gets the limit once.
    reimb_min_pay: 'The reimbursement minimum pay follows the size of the claim''s patient pay: 1,000.00 dollars
      or more keeps 10.00 dollars with the patient, 500.00 to 999.99 dollars keeps 7.50 dollars, and a smaller patient
      pay keeps the program''s patient minimum pay.'
    reimb_days_waited: The late-claim handling follows the calendar days from the fill date to today
    reimb_dollars_left: The benefit dollars left on the program are the credits of its period-opening entries and
      benefit reversals less its benefit entries and closing entries.
    result: the late-claim handling is then applied to what remains, and the result is finally held to the benefit
      dollars left on the program and never set below zero, rounded to the cent half up.
    reimb_before_late: the claim's patient pay is first limited to the reimbursement limit, the reimbursement minimum
      pay is then taken off that limited amount
    reimb_after_late: more than 90 days has the reimbursement so far multiplied by 0.95 and rounded to the cent
      half up, 31 to 90 days has a flat 20.00 dollars withheld from it, and 30 days or fewer leaves it as it is.
  factors:
  - id: reimbursement_limit_by_plan_and_cadence
    effect: parameter
    decides: reimb_unit_limit
    bindings:
    - reimb_plan
    - reimb_refills_12m
    - reimb_unit_limit
    ladder:
    - when: linked coverage is a Commercial High-Deductible Health Plan AND 10 or more refills of the card's prescription
        in the last 12 whole months
      value: K('cap_high') = 1,000.00 dollars per 28 days
    - when: linked coverage is a Commercial High-Deductible Health Plan AND 6 to 9 such refills
      value: K('cap_mid') = 900.00 dollars per 28 days
    - when: otherwise
      value: P('per_fill_benefit_max_usd'), the program's per-fill benefit maximum
    baseline:
      reimb_unit_limit: P('per_fill_benefit_max_usd')
    evidence:
    - cross_category
    - history
    cross_difficulty: coverage
  - id: standing_benefit_allowance
    effect: parameter
    decides: reimb_standing_allowance
    bindings:
    - reimb_standing_benefits
    - reimb_standing_allowance
    ladder:
    - when: 7 or more benefit entries standing (benefit entries less reversals)
      value: K('allow_high') = 150.00 dollars
    - when: 4 to 6 standing benefit entries
      value: K('allow_mid') = 75.00 dollars
    - when: otherwise
      value: '0'
    baseline:
      reimb_standing_allowance: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: program_tenure_allowance
    effect: parameter
    decides: reimb_tenure_allowance
    bindings:
    - reimb_tenure_months
    - reimb_tenure_allowance
    ladder:
    - when: 6 or more whole months from the program's opening date to the fill date
      value: K('tenure_high') = 50.00 dollars
    - when: 3 to 5 whole months
      value: K('tenure_mid') = 25.00 dollars
    - when: otherwise
      value: '0'
    baseline:
      reimb_tenure_allowance: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: days_supply_coverage_of_limit
    effect: parameter
    decides: reimb_limit
    bindings:
    - reimb_fill_days
    - reimb_limit
    ladder:
    - when: the fill carries 84 days or more
      value: three times the reimbursement limit
    - when: the fill carries 56 to 83 days
      value: twice the reimbursement limit
    - when: otherwise (55 days or fewer)
      value: the reimbursement limit once
    baseline:
      reimb_limit: reimb_unit_limit + reimb_standing_allowance + reimb_tenure_allowance
    evidence:
    - cross_category
    - history
    cross_difficulty: rx
  - id: reimbursement_minimum_pay
    effect: parameter
    decides: reimb_min_pay
    bindings:
    - reimb_patient_pay
    - reimb_min_pay
    ladder:
    - when: the claim's patient pay is 1,000.00 dollars or more
      value: K('min_high') = 10.00 dollars
    - when: the claim's patient pay is 500.00 to 999.99 dollars
      value: K('min_mid') = 7.50 dollars
    - when: otherwise
      value: P('patient_minimum_pay_usd'), the program's patient minimum pay
    baseline:
      reimb_min_pay: P('patient_minimum_pay_usd')
    evidence:
    - cross_category
    cross_difficulty: coverage
  - id: late_claim_handling
    effect: method
    decides: reimb_after_late
    bindings:
    - reimb_days_waited
    - reimb_after_late
    ladder:
    - when: more than 90 calendar days from the fill date to today
      method: the reimbursement so far is multiplied by 0.95 and rounded to the cent half up
    - when: 31 to 90 calendar days
      method: a flat 20.00 dollars is withheld from the reimbursement so far
    - when: otherwise (30 days or fewer)
      method: the reimbursement so far stands as it is
    baseline:
      reimb_after_late: reimb_before_late
    evidence:
    - date
    cross_difficulty: null
  baseline:
    rule: The standard reimbursement on a fill the patient already paid is that fill's claim patient pay limited
      to the program's per-fill benefit maximum, less the program's patient minimum pay, and never more than the
      benefit dollars left on the program, rounded to the cent half up. The benefit dollars left on the program
      are the credits of its period-opening entries and benefit reversals less its benefit entries and closing entries.
    params:
    - per_fill_benefit_max_usd
    - patient_minimum_pay_usd
  inputs:
    history:
    - category: rx
      table: rx_fills
      aggregate: latest
      field: fill_number
      filters:
        payment_basis: insurance
    - category: rx
      table: rx_fills
      aggregate: count
      field: fill_id
      within_months: 12
      filters:
        event_type: rx_refill
    - category: coverage
      table: coverage_claims
      aggregate: latest
      field: patient_pay_usd
      filters:
        event_type: coverage_claim_paid
    - table: copay_activity
      aggregate: count
      field: activity_id
      filters:
        event_type: copay_benefit_applied
    - table: copay_activity
      aggregate: sum
      field: amount_usd
      filters:
        event_type: copay_benefit_period_opened
    cross_category:
    - rx
    - coverage
- id: copay_ext_card_period_closeout
  base_policy_refs:
  - copay_evt_benefit_period
  overwrite:
  - base_policy: copay_evt_benefit_period
    superseded_clause: 'A period''s dollars belong to that period only: when the period ends, or the program expires
      or is cancelled, whatever is left is closed out and never carried into the next period.'
    replaced_by: When a benefit period of a Manufacturer Copay Card ends, a carry-forward is kept on the program
      and every other dollar left lapses in the closing entry; the closing entry books the dollars left less the
      carry-forward.
  trigger: state_due
  subject:
  - copay_benefit_period_closed
  computes: amount_usd
  target_tool: close_program_benefit_period_88a9291d
  params:
    share_high: 0.3
    share_mid: 0.15
    share_high_entries: 8
    share_mid_entries: 5
    limit_high: 1000.0
    limit_mid: 600.0
    limit_standard: 400.0
    deductible_threshold: 2000.0
    full_period_months: 9
    short_period_months: 6
    expiry_far_months: 6
    expiry_near_months: 3
    expiry_half: 0.5
  rule: 'When a benefit period of a Manufacturer Copay Card ends, a carry-forward is kept on the program and every
    other dollar left lapses in the closing entry; the closing entry books the dollars left less the carry-forward.
    The closing entry of a benefit period is booked only after every fill of the card''s prescription dated inside
    that period and settled by insurance alone carries a benefit entry on the program. The standard closing entry
    lapses every dollar left for the period, keeping no carry-forward. The dollars left are the credits of the period-opening
    entries and benefit reversals less the benefit entries and earlier closing entries. The carry-forward share
    follows the benefit entries standing on the program, counted as benefit entries less benefit reversals: 8 or
    more keep 30 percent of the dollars left, 5 to 7 keep 15 percent, and fewer keep nothing. The dollars left times
    that share, rounded to the cent half up, are held to the carry-forward limit, which follows the linked plan
    and the deductible the plan applied on the patient''s paid claims dated fewer than 12 whole months before today:
    a Commercial High-Deductible Health Plan with 2,000.00 dollars or more of such deductible has a limit of 1,000.00
    dollars, a Commercial High-Deductible Health Plan with less has 600.00 dollars, and any other plan has 400.00
    dollars. The length of the closing period, in whole months from its first day to its last day, then decides
    how much of the limited amount carries: a period of 6 to 8 whole months carries the limited amount times its
    whole months over 12, rounded to the cent half up; a period of fewer than 6 whole months carries nothing; and
    a longer period carries the limited amount whole. The whole months from the last day of the closing period to
    the program''s expiration date finally set the part kept: 3 to 5 months keep half of it, rounded to the cent
    half up, fewer than 3 months keep none of it, and 6 months or more keep all of it. The closing entry books the
    dollars left less the carry-forward so worked out, rounded to the cent half up.'
  prerequisite:
  - problem: copay_ext_card_paid_fill_reimbursement
    kind: value_input
    gate: close_dollars_left
    form: state
    policy_source: The closing entry of a benefit period is booked only after every fill of the card's prescription
      dated inside that period and settled by insurance alone carries a benefit entry on the program.
    condition: Every rx_fills entry of the card's prescription dated inside the closing period with payment_basis
      insurance (paid in full without the program) has a copay_benefit_applied entry on the enrollment naming its
      fill_id.
    resolved_by: submit_copay_card_reimbursement_c6a4b4a1
    effect: The reimbursement's benefit entry takes its amount out of the dollars left, so the closing entry and
      the carry-forward are worked out on a smaller balance.
  cross_category:
  - category: coverage
    as: history
    reads:
    - variant_name
    - coverage_claims.deductible_applied_usd
    - coverage_claims.event_date
    note: The linked plan class and the deductible applied on claims in the last 12 whole months decide the carry-forward
      limit.
  compute:
  - close_dollars_left: SUM('copay_activity', 'amount_usd', event_type='copay_benefit_period_opened') + SUM('copay_activity',
      'amount_usd', event_type='copay_benefit_reversed') - SUM('copay_activity', 'amount_usd', event_type='copay_benefit_applied')
      - SUM('copay_activity', 'amount_usd', event_type='copay_benefit_period_closed')
  - close_standing_benefits: COUNT('copay_activity', event_type='copay_benefit_applied') - COUNT('copay_activity',
      event_type='copay_benefit_reversed')
  - carry_share: K('share_high') if close_standing_benefits >= K('share_high_entries') else (K('share_mid') if close_standing_benefits
      >= K('share_mid_entries') else 0)
  - close_plan: CFIELD('coverage', 'variant_name', coverage_id=F('linked_coverage_id'))
  - close_deductible_12m: XSUM('coverage', 'coverage_claims', 'deductible_applied_usd', within_months=12, event_type='coverage_claim_paid')
  - carry_limit: K('limit_high') if (close_plan == 'Commercial High-Deductible Health Plan' and close_deductible_12m
      >= K('deductible_threshold')) else (K('limit_mid') if (close_plan == 'Commercial High-Deductible Health Plan'
      and close_deductible_12m < K('deductible_threshold')) else K('limit_standard'))
  - limited_carry: MN(carry_limit, RND(close_dollars_left * carry_share, 2))
  - closing_period_months: MONTHS(F('benefit_period_start'), F('benefit_period_end'))
  - period_carry: RND(limited_carry * closing_period_months / 12.0, 2) if (closing_period_months >= K('short_period_months')
      and closing_period_months < K('full_period_months')) else (0 if closing_period_months < K('short_period_months')
      else limited_carry)
  - months_to_expiry: MONTHS(F('benefit_period_end'), F('expiration_date'))
  - carry_forward: RND(period_carry * K('expiry_half'), 2) if (months_to_expiry >= K('expiry_near_months') and months_to_expiry
      < K('expiry_far_months')) else (0 if months_to_expiry < K('expiry_near_months') else period_carry)
  - result: RND(close_dollars_left - carry_forward, 2)
  compute_basis:
    close_dollars_left: The dollars left are the credits of the period-opening entries and benefit reversals less
      the benefit entries and earlier closing entries.
    close_standing_benefits: The carry-forward share follows the benefit entries standing on the program, counted
      as benefit entries less benefit reversals
    carry_share: 8 or more keep 30 percent of the dollars left, 5 to 7 keep 15 percent, and fewer keep nothing.
    close_plan: which follows the linked plan and the deductible the plan applied on the patient's paid claims dated
      fewer than 12 whole months before today
    close_deductible_12m: which follows the linked plan and the deductible the plan applied on the patient's paid
      claims dated fewer than 12 whole months before today
    carry_limit: a Commercial High-Deductible Health Plan with 2,000.00 dollars or more of such deductible has a
      limit of 1,000.00 dollars, a Commercial High-Deductible Health Plan with less has 600.00 dollars, and any
      other plan has 400.00 dollars.
    limited_carry: The dollars left times that share, rounded to the cent half up, are held to the carry-forward
      limit
    closing_period_months: The length of the closing period, in whole months from its first day to its last day,
      then decides how much of the limited amount carries
    period_carry: a period of 6 to 8 whole months carries the limited amount times its whole months over 12, rounded
      to the cent half up; a period of fewer than 6 whole months carries nothing; and a longer period carries the
      limited amount whole.
    months_to_expiry: The whole months from the last day of the closing period to the program's expiration date
      finally set the part kept
    carry_forward: 3 to 5 months keep half of it, rounded to the cent half up, fewer than 3 months keep none of
      it, and 6 months or more keep all of it.
    result: The closing entry books the dollars left less the carry-forward so worked out, rounded to the cent half
      up.
  factors:
  - id: carry_forward_share
    effect: parameter
    decides: carry_share
    bindings:
    - close_standing_benefits
    - carry_share
    ladder:
    - when: 8 or more benefit entries standing on the program
      value: K('share_high') = 30 percent of the dollars left
    - when: 5 to 7 standing benefit entries
      value: K('share_mid') = 15 percent
    - when: otherwise
      value: 0 percent (nothing carries)
    baseline:
      carry_share: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: carry_forward_limit
    effect: parameter
    decides: carry_limit
    bindings:
    - close_plan
    - close_deductible_12m
    - carry_limit
    ladder:
    - when: Commercial High-Deductible Health Plan AND 2,000.00 dollars or more of deductible applied on paid claims
        in the last 12 whole months
      value: K('limit_high') = 1,000.00 dollars
    - when: Commercial High-Deductible Health Plan AND less than 2,000.00 dollars of such deductible
      value: K('limit_mid') = 600.00 dollars
    - when: otherwise (any other plan)
      value: K('limit_standard') = 400.00 dollars
    baseline:
      carry_limit: K('limit_standard')
    evidence:
    - cross_category
    - history
    cross_difficulty: coverage
  - id: closing_period_length
    effect: method
    decides: period_carry
    bindings:
    - closing_period_months
    - period_carry
    ladder:
    - when: the closing period runs 6 to 8 whole months
      method: the limited amount is multiplied by the period's whole months over 12 and rounded to the cent half
        up
    - when: the closing period runs fewer than 6 whole months
      method: nothing carries
    - when: otherwise (9 whole months or more)
      method: the limited amount carries whole
    baseline:
      period_carry: limited_carry
    evidence:
    - date
    cross_difficulty: null
  - id: expiry_horizon_share
    effect: parameter
    decides: carry_forward
    bindings:
    - months_to_expiry
    - carry_forward
    ladder:
    - when: 3 to 5 whole months from the period's last day to the program's expiration date
      value: K('expiry_half') = half is kept
    - when: fewer than 3 whole months
      value: none is kept
    - when: otherwise (6 months or more)
      value: all is kept
    baseline:
      carry_forward: period_carry
    evidence:
    - date
    cross_difficulty: null
  baseline:
    rule: The standard closing entry lapses every dollar left for the period, keeping no carry-forward. The dollars
      left are the credits of the period-opening entries and benefit reversals less the benefit entries and earlier
      closing entries.
    params: []
  inputs:
    history:
    - table: copay_activity
      aggregate: sum
      field: amount_usd
      filters:
        event_type: copay_benefit_applied
    - table: copay_activity
      aggregate: count
      field: activity_id
      filters:
        event_type: copay_benefit_applied
    - category: coverage
      table: coverage_claims
      aggregate: sum
      field: deductible_applied_usd
      within_months: 12
      filters:
        event_type: coverage_claim_paid
    cross_category:
    - coverage
- id: copay_ext_card_period_opening
  base_policy_refs:
  - copay_evt_benefit_period
  overwrite:
  - base_policy: copay_evt_benefit_period
    superseded_clause: A program with a dollar budget opens a benefit period at activation and at the start of each
      new period under its benefit_period_basis, crediting annual_benefit_max_usd.
    replaced_by: 'The opening credit is worked out in this order: the annual maximum is first set by the plan tier,
      the term rule is then applied to it and the result rounded to the cent half up, the carry-forward absorption
      is then taken off, and the adherence credit and the tenure credit are finally added, rounded to the cent half
      up.'
  trigger: state_due
  subject:
  - copay_benefit_period_opened
  computes: amount_usd
  target_tool: open_program_benefit_period_c8eb05d0
  params:
    max_high: 12000.0
    max_mid: 10800.0
    deductible_threshold: 2000.0
    short_term_months: 6
    full_term_months: 12
    carry_quarter: 0.25
    adherence_high: 600.0
    adherence_mid: 300.0
    adherence_high_entries: 8
    adherence_mid_entries: 4
    tenure_credit_high: 200.0
    tenure_credit_mid: 100.0
    tenure_high_months: 6
    tenure_mid_months: 3
    carry_half: 0.5
  rule: 'This policy sets the dollars credited when a Manufacturer Copay Card opens the benefit period of a new
    calendar year, the period running from January 1 to December 31. A new benefit period is not credited until
    the budget account carries the closing entry of the period before it. The standard opening credit is the program''s
    annual benefit maximum. The annual maximum follows the linked plan and the deductible the plan applied on the
    patient''s paid claims dated fewer than 12 whole months before today: a Commercial High-Deductible Health Plan
    with 2,000.00 dollars or more of such deductible opens with 12,000.00 dollars, a Commercial High-Deductible
    Health Plan with less opens with 10,800.00 dollars, and any other plan opens with the program''s annual benefit
    maximum. The whole months from today to the program''s expiration date then set the term rule: fewer than 6
    months credit half of the annual maximum, 6 to 11 months credit the annual maximum times those whole months
    over 12, and 12 months or more credit the annual maximum whole. The dollars still standing on the budget account
    from the period before, the carry-forward, are partly absorbed according to the linked plan: under a Commercial
    High-Deductible Health Plan a quarter of the carry-forward, rounded to the cent half up, is taken off the credit;
    under a Commercial Copay Plan half of it, rounded to the cent half up, is taken off; and under any other plan
    nothing is taken off. An adherence credit follows the benefit entries on the program dated fewer than 12 whole
    months before today: 8 or more add 600.00 dollars, 4 to 7 add 300.00 dollars, and fewer add nothing. A tenure
    credit follows the whole months from the date the program was opened to today: 6 months or more add 200.00 dollars,
    3 to 5 months add 100.00 dollars, and fewer add nothing. The opening credit is worked out in this order: the
    annual maximum is first set by the plan tier, the term rule is then applied to it and the result rounded to
    the cent half up, the carry-forward absorption is then taken off, and the adherence credit and the tenure credit
    are finally added, rounded to the cent half up.'
  prerequisite:
  - problem: copay_ext_card_period_closeout
    kind: value_input
    gate: carried_balance
    form: state
    policy_source: A new benefit period is not credited until the budget account carries the closing entry of the
      period before it.
    condition: The copay_activity ledger of the card carries a copay_benefit_period_closed entry whose benefit_period_start
      equals the start of the period before the new one.
    resolved_by: close_program_benefit_period_88a9291d
    effect: The closing entry lapses every dollar of the old period except the carry-forward, so the carry-forward
      the opening credit absorbs falls to the kept amount.
  cross_category:
  - category: coverage
    as: history
    reads:
    - variant_name
    - coverage_claims.deductible_applied_usd
    - coverage_claims.event_date
    note: The linked plan class and the deductible applied on claims in the last 12 whole months decide the annual
      maximum tier.
  compute:
  - open_plan: CFIELD('coverage', 'variant_name', coverage_id=F('linked_coverage_id'))
  - open_deductible_12m: XSUM('coverage', 'coverage_claims', 'deductible_applied_usd', within_months=12, event_type='coverage_claim_paid')
  - annual_max: K('max_high') if (open_plan == 'Commercial High-Deductible Health Plan' and open_deductible_12m
      >= K('deductible_threshold')) else (K('max_mid') if (open_plan == 'Commercial High-Deductible Health Plan'
      and open_deductible_12m < K('deductible_threshold')) else P('annual_benefit_max_usd'))
  - months_card_left: MONTHS(NOW, F('expiration_date'))
  - term_max: RND(annual_max * K('short_term_months') / 12.0, 2) if months_card_left < K('short_term_months') else
      (RND(annual_max * months_card_left / 12.0, 2) if months_card_left < K('full_term_months') else annual_max)
  - carried_balance: SUM('copay_activity', 'amount_usd', event_type='copay_benefit_period_opened') + SUM('copay_activity',
      'amount_usd', event_type='copay_benefit_reversed') - SUM('copay_activity', 'amount_usd', event_type='copay_benefit_applied')
      - SUM('copay_activity', 'amount_usd', event_type='copay_benefit_period_closed')
  - carry_absorbed: RND(carried_balance * K('carry_quarter'), 2) if open_plan == 'Commercial High-Deductible Health
      Plan' else (RND(carried_balance * K('carry_half'), 2) if open_plan == 'Commercial Copay Plan' else 0)
  - open_benefit_entries_12m: COUNT('copay_activity', within_months=12, event_type='copay_benefit_applied')
  - adherence_credit: K('adherence_high') if open_benefit_entries_12m >= K('adherence_high_entries') else (K('adherence_mid')
      if open_benefit_entries_12m >= K('adherence_mid_entries') else 0)
  - open_tenure_months: MONTHS(F('opened_date'), NOW)
  - tenure_credit: K('tenure_credit_high') if open_tenure_months >= K('tenure_high_months') else (K('tenure_credit_mid')
      if open_tenure_months >= K('tenure_mid_months') else 0)
  - result: RND(term_max - carry_absorbed + adherence_credit + tenure_credit, 2)
  compute_basis:
    open_plan: The annual maximum follows the linked plan and the deductible the plan applied on the patient's paid
      claims dated fewer than 12 whole months before today
    open_deductible_12m: The annual maximum follows the linked plan and the deductible the plan applied on the patient's
      paid claims dated fewer than 12 whole months before today
    annual_max: a Commercial High-Deductible Health Plan with 2,000.00 dollars or more of such deductible opens
      with 12,000.00 dollars, a Commercial High-Deductible Health Plan with less opens with 10,800.00 dollars, and
      any other plan opens with the program's annual benefit maximum.
    months_card_left: The whole months from today to the program's expiration date then set the term rule
    term_max: fewer than 6 months credit half of the annual maximum, 6 to 11 months credit the annual maximum times
      those whole months over 12, and 12 months or more credit the annual maximum whole.
    carried_balance: The dollars still standing on the budget account from the period before, the carry-forward,
      are partly absorbed according to the linked plan
    carry_absorbed: under a Commercial High-Deductible Health Plan a quarter of the carry-forward, rounded to the
      cent half up, is taken off the credit; under a Commercial Copay Plan half of it, rounded to the cent half
      up, is taken off; and under any other plan nothing is taken off.
    open_benefit_entries_12m: An adherence credit follows the benefit entries on the program dated fewer than 12
      whole months before today
    adherence_credit: 8 or more add 600.00 dollars, 4 to 7 add 300.00 dollars, and fewer add nothing.
    open_tenure_months: A tenure credit follows the whole months from the date the program was opened to today
    tenure_credit: 6 months or more add 200.00 dollars, 3 to 5 months add 100.00 dollars, and fewer add nothing.
    result: the annual maximum is first set by the plan tier, the term rule is then applied to it and the result
      rounded to the cent half up, the carry-forward absorption is then taken off, and the adherence credit and
      the tenure credit are finally added, rounded to the cent half up.
  factors:
  - id: annual_maximum_by_plan
    effect: parameter
    decides: annual_max
    bindings:
    - open_plan
    - open_deductible_12m
    - annual_max
    ladder:
    - when: Commercial High-Deductible Health Plan AND 2,000.00 dollars or more of deductible applied on paid claims
        in the last 12 whole months
      value: K('max_high') = 12,000.00 dollars
    - when: Commercial High-Deductible Health Plan AND less than 2,000.00 dollars of such deductible
      value: K('max_mid') = 10,800.00 dollars
    - when: otherwise (any other plan)
      value: P('annual_benefit_max_usd'), the program's annual benefit maximum
    baseline:
      annual_max: P('annual_benefit_max_usd')
    evidence:
    - cross_category
    - history
    cross_difficulty: coverage
  - id: card_term_rule
    effect: method
    decides: term_max
    bindings:
    - months_card_left
    - term_max
    ladder:
    - when: fewer than 6 whole months from today to the program's expiration date
      method: half of the annual maximum is credited
    - when: 6 to 11 whole months
      method: the annual maximum times those whole months over 12, rounded to the cent half up
    - when: otherwise (12 months or more)
      method: the annual maximum is credited whole
    baseline:
      term_max: annual_max
    evidence:
    - date
    cross_difficulty: null
  - id: carry_forward_absorption
    effect: parameter
    decides: carry_absorbed
    bindings:
    - carried_balance
    - carry_absorbed
    ladder:
    - when: linked coverage is a Commercial High-Deductible Health Plan
      value: K('carry_quarter') = a quarter of the carry-forward
    - when: linked coverage is a Commercial Copay Plan
      value: K('carry_half') = half of the carry-forward
    - when: otherwise (any other plan)
      value: none of the carry-forward
    baseline:
      carry_absorbed: '0'
    evidence:
    - history
    - cross_category
    cross_difficulty: null
  - id: adherence_credit_by_entries
    effect: parameter
    decides: adherence_credit
    bindings:
    - open_benefit_entries_12m
    - adherence_credit
    ladder:
    - when: 8 or more benefit entries dated in the last 12 whole months
      value: K('adherence_high') = 600.00 dollars
    - when: 4 to 7 such entries
      value: K('adherence_mid') = 300.00 dollars
    - when: otherwise
      value: '0'
    baseline:
      adherence_credit: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: opening_tenure_credit
    effect: parameter
    decides: tenure_credit
    bindings:
    - open_tenure_months
    - tenure_credit
    ladder:
    - when: 6 or more whole months from the program's opening date to today
      value: K('tenure_credit_high') = 200.00 dollars
    - when: 3 to 5 whole months
      value: K('tenure_credit_mid') = 100.00 dollars
    - when: otherwise
      value: '0'
    baseline:
      tenure_credit: '0'
    evidence:
    - date
    cross_difficulty: null
  baseline:
    rule: The standard opening credit is the program's annual benefit maximum.
    params:
    - annual_benefit_max_usd
  inputs:
    history:
    - table: copay_activity
      aggregate: sum
      field: amount_usd
      filters:
        event_type: copay_benefit_period_closed
    - table: copay_activity
      aggregate: count
      field: activity_id
      within_months: 12
      filters:
        event_type: copay_benefit_applied
    - category: coverage
      table: coverage_claims
      aggregate: sum
      field: deductible_applied_usd
      within_months: 12
      filters:
        event_type: coverage_claim_paid
    cross_category:
    - coverage
- id: copay_ext_card_counter_benefit
  base_policy_refs:
  - copay_agg_program_stacking
  - copay_evt_benefit_application
  overwrite:
  - base_policy: copay_evt_benefit_application
    superseded_clause: The amount is the patient pay less patient_minimum_pay_usd, limited to per_fill_benefit_max_usd
      where per_fill_cap_applies is true, and limited to the benefit_remaining_usd of the enrollment; the patient
      pays the rest.
    replaced_by: 'The counter benefit is worked out in this order: the benefit base is first limited to the counter
      limit, the counter minimum pay is then taken off, the cadence allowance, the new-year allowance and the renewal
      allowance are then added, and the result is finally held to the benefit dollars left on the program and never
      set below zero, rounded to the cent half up.'
  trigger: on_request
  subject:
  - copay_benefit_applied
  computes: amount_usd
  target_tool: apply_copay_card_benefit_5e8b0a9f
  params:
    deductible_share: 0.5
    counter_cap_high: 2500.0
    counter_cap_mid: 1500.0
    counter_deductible_high: 2000.0
    min_copay_plan: 10.0
    cadence_bonus_high: 100.0
    cadence_bonus_mid: 50.0
    cadence_high_refills: 10
    cadence_mid_refills: 6
    new_year_early: 300.0
    new_year_early_days: 45
    new_year_late_days: 90
    renewal_current: 100.0
    renewal_earlier: 50.0
    new_year_rate: 0.05
  rule: 'This policy sets the Manufacturer Copay Card benefit billed at the counter on the patient pay of a paid
    insurance claim for the card''s prescription whose fill is waiting for pickup; the claim is the latest paid
    insurance claim of the card''s prescription. A counter benefit on a claim is fixed only after the budget account
    carries the opening entry of the benefit period the claim date falls in. The standard counter benefit on a claim
    is the claim''s patient pay limited to the program''s per-fill benefit maximum, less the program''s patient
    minimum pay, and never more than the benefit dollars left on the program, rounded to the cent half up. The benefit
    dollars left on the program are the credits of its period-opening entries and benefit reversals less its benefit
    entries and closing entries. The benefit base leaves out part of the deductible the plan applied on the claim
    according to the linked plan: under a Commercial High-Deductible Health Plan half of the claim''s deductible
    portion is left out of the patient pay; under a Commercial Copay Plan the whole deductible portion is left out;
    and under any other plan the whole patient pay is the base. The counter limit follows the plan and the deductible
    on the claim: a Commercial High-Deductible Health Plan claim with 2,000.00 dollars or more of deductible has
    a limit of 2,500.00 dollars, a Commercial High-Deductible Health Plan claim with less than 2,000.00 dollars
    of deductible but some has 1,500.00 dollars, and every other claim has the program''s per-fill benefit maximum.
    The counter minimum pay follows the linked plan: nothing on a Commercial High-Deductible Health Plan, 10.00
    dollars on a Commercial Copay Plan, and the program''s patient minimum pay on any other plan. A cadence allowance
    follows the refills of the card''s prescription dated fewer than 12 whole months before today: 10 or more add
    100.00 dollars, 6 to 9 add 50.00 dollars, and fewer add nothing. A new-year allowance follows the calendar days
    from the first day of the program''s current benefit period to the claim date: 0 to 45 days add a flat 300.00
    dollars, 46 to 90 days add 5 percent of the limited benefit less the counter minimum pay, rounded to the cent
    half up, and any other count adds nothing. A renewal allowance follows the latest prior authorization approval
    on file for the card''s prescription: an approval dated on or after the first day of the current benefit period
    adds 100.00 dollars, an earlier approval adds 50.00 dollars, and no approval adds nothing. The counter benefit
    is worked out in this order: the benefit base is first limited to the counter limit, the counter minimum pay
    is then taken off, the cadence allowance, the new-year allowance and the renewal allowance are then added, and
    the result is finally held to the benefit dollars left on the program and never set below zero, rounded to the
    cent half up.'
  prerequisite:
  - problem: copay_ext_card_period_opening
    kind: value_input
    gate: counter_dollars_left
    form: state
    policy_source: A counter benefit on a claim is fixed only after the budget account carries the opening entry
      of the benefit period the claim date falls in.
    condition: The copay_activity ledger of the card carries a copay_benefit_period_opened entry whose benefit_period_start
      is the first day of the calendar year of the claim date, and the enrollment's benefit_period_start shows that
      day.
    resolved_by: open_program_benefit_period_c8eb05d0
    effect: The opening entry credits the new period's dollars, so the dollars left that hold the counter benefit
      rise from the carry-forward alone to the carry-forward plus the opening credit, and the new-year allowance
      counts from the new period's first day.
  cross_category:
  - category: coverage
    as: history
    reads:
    - variant_name
    - coverage_claims.patient_pay_usd
    - coverage_claims.deductible_applied_usd
    - coverage_claims.event_date
    - coverage_prior_auths.event_date
    note: The claim's patient pay and deductible, the linked plan class and the latest prior authorization approval
      decide the base, the limit, the minimum pay and the renewal allowance.
  - category: rx
    as: history
    reads:
    - rx_fills.event_type
    - rx_fills.event_date
    note: The refills of the card's prescription in the last 12 whole months decide the cadence allowance.
  compute:
  - counter_patient_pay: XLATEST('coverage', 'coverage_claims', 'patient_pay_usd', event_type='coverage_claim_paid',
      prescription_id=F('prescription_id'))
  - counter_deductible: XLATEST('coverage', 'coverage_claims', 'deductible_applied_usd', event_type='coverage_claim_paid',
      prescription_id=F('prescription_id'))
  - counter_claim_date: XLATEST('coverage', 'coverage_claims', 'event_date', event_type='coverage_claim_paid', prescription_id=F('prescription_id'))
  - counter_plan: CFIELD('coverage', 'variant_name', coverage_id=F('linked_coverage_id'))
  - counter_base: counter_patient_pay - counter_deductible * K('deductible_share') if counter_plan == 'Commercial
      High-Deductible Health Plan' else (counter_patient_pay - counter_deductible if counter_plan == 'Commercial
      Copay Plan' else counter_patient_pay)
  - counter_limit: K('counter_cap_high') if (counter_plan == 'Commercial High-Deductible Health Plan' and counter_deductible
      >= K('counter_deductible_high')) else (K('counter_cap_mid') if (counter_plan == 'Commercial High-Deductible
      Health Plan' and counter_deductible > 0) else P('per_fill_benefit_max_usd'))
  - counter_min_pay: 0 if counter_plan == 'Commercial High-Deductible Health Plan' else (K('min_copay_plan') if
      counter_plan == 'Commercial Copay Plan' else P('patient_minimum_pay_usd'))
  - counter_refills_12m: XCOUNT('rx', 'rx_fills', within_months=12, event_type='rx_refill', prescription_id=F('prescription_id'))
  - cadence_allowance: K('cadence_bonus_high') if counter_refills_12m >= K('cadence_high_refills') else (K('cadence_bonus_mid')
      if counter_refills_12m >= K('cadence_mid_refills') else 0)
  - days_into_period: DAYS(F('benefit_period_start'), counter_claim_date)
  - new_year_allowance: K('new_year_early') if (days_into_period >= 0 and days_into_period <= K('new_year_early_days'))
      else (RND((MN(counter_base, counter_limit) - counter_min_pay) * K('new_year_rate'), 2) if (days_into_period
      > K('new_year_early_days') and days_into_period <= K('new_year_late_days')) else 0)
  - latest_pa_approval: XLATEST('coverage', 'coverage_prior_auths', 'event_date', event_type='coverage_pa_approved',
      prescription_id=F('prescription_id'))
  - renewal_allowance: K('renewal_current') if (latest_pa_approval != None and DAYS(F('benefit_period_start'), latest_pa_approval)
      >= 0) else (K('renewal_earlier') if latest_pa_approval != None else 0)
  - counter_dollars_left: SUM('copay_activity', 'amount_usd', event_type='copay_benefit_period_opened') + SUM('copay_activity',
      'amount_usd', event_type='copay_benefit_reversed') - SUM('copay_activity', 'amount_usd', event_type='copay_benefit_applied')
      - SUM('copay_activity', 'amount_usd', event_type='copay_benefit_period_closed')
  - result: RND(MX(0, MN(counter_dollars_left, MN(counter_base, counter_limit) - counter_min_pay + cadence_allowance
      + new_year_allowance + renewal_allowance)), 2)
  compute_basis:
    counter_patient_pay: the claim is the latest paid insurance claim of the card's prescription.
    counter_deductible: The benefit base leaves out part of the deductible the plan applied on the claim according
      to the linked plan
    counter_claim_date: A new-year allowance follows the calendar days from the first day of the program's current
      benefit period to the claim date
    counter_plan: 'The counter minimum pay follows the linked plan: nothing on a Commercial High-Deductible Health
      Plan, 10.00 dollars on a Commercial Copay Plan, and the program''s patient minimum pay on any other plan.'
    counter_base: under a Commercial High-Deductible Health Plan half of the claim's deductible portion is left
      out of the patient pay; under a Commercial Copay Plan the whole deductible portion is left out; and under
      any other plan the whole patient pay is the base.
    counter_limit: a Commercial High-Deductible Health Plan claim with 2,000.00 dollars or more of deductible has
      a limit of 2,500.00 dollars, a Commercial High-Deductible Health Plan claim with less than 2,000.00 dollars
      of deductible but some has 1,500.00 dollars, and every other claim has the program's per-fill benefit maximum.
    counter_min_pay: 'The counter minimum pay follows the linked plan: nothing on a Commercial High-Deductible Health
      Plan, 10.00 dollars on a Commercial Copay Plan, and the program''s patient minimum pay on any other plan.'
    counter_refills_12m: A cadence allowance follows the refills of the card's prescription dated fewer than 12
      whole months before today
    cadence_allowance: 10 or more add 100.00 dollars, 6 to 9 add 50.00 dollars, and fewer add nothing.
    days_into_period: A new-year allowance follows the calendar days from the first day of the program's current
      benefit period to the claim date
    new_year_allowance: 0 to 45 days add a flat 300.00 dollars, 46 to 90 days add 5 percent of the limited benefit
      less the counter minimum pay, rounded to the cent half up, and any other count adds nothing.
    latest_pa_approval: A renewal allowance follows the latest prior authorization approval on file for the card's
      prescription
    renewal_allowance: an approval dated on or after the first day of the current benefit period adds 100.00 dollars,
      an earlier approval adds 50.00 dollars, and no approval adds nothing.
    counter_dollars_left: The benefit dollars left on the program are the credits of its period-opening entries
      and benefit reversals less its benefit entries and closing entries.
    result: the benefit base is first limited to the counter limit, the counter minimum pay is then taken off, the
      cadence allowance, the new-year allowance and the renewal allowance are then added, and the result is finally
      held to the benefit dollars left on the program and never set below zero, rounded to the cent half up.
  factors:
  - id: deductible_left_out_by_plan
    effect: parameter
    decides: counter_base
    bindings:
    - counter_patient_pay
    - counter_base
    ladder:
    - when: linked coverage is a Commercial High-Deductible Health Plan
      value: K('deductible_share') = half of the claim's deductible portion left out
    - when: linked coverage is a Commercial Copay Plan
      value: the whole deductible portion left out
    - when: otherwise (any other plan)
      value: nothing left out (the whole patient pay)
    baseline:
      counter_base: counter_patient_pay
    evidence:
    - cross_category
    cross_difficulty: coverage
  - id: counter_limit_by_deductible
    effect: parameter
    decides: counter_limit
    bindings:
    - counter_deductible
    - counter_limit
    ladder:
    - when: Commercial High-Deductible Health Plan claim AND 2,000.00 dollars or more of deductible on it
      value: K('counter_cap_high') = 2,500.00 dollars
    - when: Commercial High-Deductible Health Plan claim AND 0.01 to 1,999.99 dollars of deductible on it
      value: K('counter_cap_mid') = 1,500.00 dollars
    - when: otherwise
      value: P('per_fill_benefit_max_usd'), the program's per-fill benefit maximum
    baseline:
      counter_limit: P('per_fill_benefit_max_usd')
    evidence:
    - cross_category
    cross_difficulty: coverage
  - id: counter_minimum_pay_by_plan
    effect: parameter
    decides: counter_min_pay
    bindings:
    - counter_plan
    - counter_min_pay
    ladder:
    - when: linked coverage is a Commercial High-Deductible Health Plan
      value: 0.00 dollars
    - when: linked coverage is a Commercial Copay Plan
      value: K('min_copay_plan') = 10.00 dollars
    - when: otherwise
      value: P('patient_minimum_pay_usd'), the program's patient minimum pay
    baseline:
      counter_min_pay: P('patient_minimum_pay_usd')
    evidence:
    - cross_category
    cross_difficulty: coverage
  - id: cadence_allowance_by_refills
    effect: parameter
    decides: cadence_allowance
    bindings:
    - counter_refills_12m
    - cadence_allowance
    ladder:
    - when: 10 or more refills of the card's prescription in the last 12 whole months
      value: K('cadence_bonus_high') = 100.00 dollars
    - when: 6 to 9 such refills
      value: K('cadence_bonus_mid') = 50.00 dollars
    - when: otherwise
      value: '0'
    baseline:
      cadence_allowance: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: rx
  - id: new_year_allowance_by_claim_date
    effect: method
    decides: new_year_allowance
    bindings:
    - counter_claim_date
    - days_into_period
    - new_year_allowance
    ladder:
    - when: the claim date is 0 to 45 calendar days after the first day of the current benefit period
      method: a flat 300.00 dollars is added
    - when: 46 to 90 calendar days after it
      method: 5 percent of the limited benefit less the counter minimum pay, rounded to the cent half up, is added
    - when: otherwise
      method: nothing is added
    baseline:
      new_year_allowance: '0'
    evidence:
    - date
    - cross_category
    cross_difficulty: coverage
  - id: renewal_allowance_by_approval
    effect: parameter
    decides: renewal_allowance
    bindings:
    - latest_pa_approval
    - renewal_allowance
    ladder:
    - when: the latest prior authorization approval for the prescription is dated on or after the first day of the
        current benefit period
      value: K('renewal_current') = 100.00 dollars
    - when: the latest approval is dated earlier
      value: K('renewal_earlier') = 50.00 dollars
    - when: otherwise (no approval on file)
      value: '0'
    baseline:
      renewal_allowance: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: coverage
  baseline:
    rule: The standard counter benefit on a claim is the claim's patient pay limited to the program's per-fill benefit
      maximum, less the program's patient minimum pay, and never more than the benefit dollars left on the program,
      rounded to the cent half up. The benefit dollars left on the program are the credits of its period-opening
      entries and benefit reversals less its benefit entries and closing entries.
    params:
    - per_fill_benefit_max_usd
    - patient_minimum_pay_usd
  inputs:
    history:
    - category: coverage
      table: coverage_claims
      aggregate: latest
      field: patient_pay_usd
      filters:
        event_type: coverage_claim_paid
    - category: coverage
      table: coverage_prior_auths
      aggregate: latest
      field: event_date
      filters:
        event_type: coverage_pa_approved
    - category: rx
      table: rx_fills
      aggregate: count
      field: fill_id
      within_months: 12
      filters:
        event_type: rx_refill
    - table: copay_activity
      aggregate: sum
      field: amount_usd
      filters:
        event_type: copay_benefit_applied
    cross_category:
    - coverage
    - rx
