category: copay
display_name: Savings & Copay Assistance Programs

binding:
  holding_table: copay_enrollments
  event_tables: [copay_activity]
  status_field: status
  variant_field: variant_name
  quantity_fields: {benefit_remaining_usd: benefit_budget, membership_fees_net_usd: membership_fees}

lifecycle:
  states: [pending_activation, active, suspended, expired, cancelled]
  transitions:
    - {from: pending_activation, to: active, by: agent, means: The program is activated, by its first paid claim, its award letter or payment of the membership fee.}
    - {from: pending_activation, to: expired, by: system, means: The program was not activated within its activation window.}
    - {from: pending_activation, to: cancelled, by: user, means: The patient withdraws the enrollment before it is activated.}
    - {from: active, to: suspended, by: agent, means: The patient no longer meets a continuing eligibility condition, such as the coverage the program depends on.}
    - {from: suspended, to: active, by: agent, means: The condition that caused the suspension is resolved within the resume window.}
    - {from: active, to: expired, by: system, means: The program's expiration date has passed without renewal.}
    - {from: suspended, to: expired, by: system, means: The expiration date or the resume window passed while suspended.}
    - {from: active, to: cancelled, by: user, means: The patient cancels the program.}

accounts:
  - key: benefit_budget
    unit: USD
    meaning: Program dollars still available to pay the patient's share in the current benefit period; credited when a benefit period opens or an applied benefit is reversed, debited when a benefit is applied or the period closes with money left.
  - key: membership_fees
    unit: USD
    meaning: Net membership fees the patient has paid for the program; credited when a fee is charged, debited when a fee is refunded.

parameter_schema:
  enrollment_fee_usd: Membership fee charged when the program is activated and at each renewal, USD.
  has_expiration: Whether the program has an expiration date at all, boolean.
  membership_term_months: Calendar months from activation (or from the previous expiration at renewal) to the expiration date, integer months; 0 when has_expiration is false.
  auto_renew: Whether the program renews itself at expiration and charges the fee again, boolean.
  fee_refund_window_days: Calendar days after a fee is charged within which it may be refunded, integer days.
  fee_refund_requires_no_use: Whether a fee is refunded only when no discounted fill used the program since the fee was charged, boolean.
  max_covered_members: Most people covered by one enrollment, integer.
  members_must_share_address: Whether every covered member must live at the enrolling patient's home address, boolean.
  value_list_available: Whether the program prices drugs on the Kestrel Value Generics list at fixed prices, boolean.
  value_generic_30_day_price_usd: Fixed price of a value-list generic fill of up to 30 days, USD.
  value_generic_90_day_price_usd: Fixed price of a value-list generic fill of 31 to 90 days, USD.
  value_list_max_days_supply: Largest days supply priced from the value list, integer days.
  generic_discount_pct: Percent off the usual and customary price for a generic not on the value list, integer percent.
  brand_discount_pct: Percent off the usual and customary price for a brand drug, integer percent.
  minimum_cash_price_usd: Lowest price charged for any discounted fill, USD.
  excludes_specialty_drugs: Whether specialty drugs are excluded from the program, boolean.
  vaccine_discount_pct: Percent off the cash price of a vaccine paid in cash, integer percent.
  combinable_with_insurance: Whether the program pays after the patient's insurance on the same fill, boolean.
  requires_commercial_coverage: Whether the patient must have active commercial prescription coverage, boolean.
  government_coverage_disallowed: Whether the program cannot be used while the fill is billed to a government plan, boolean.
  requires_pa_pending_or_denied: Whether the program applies only while the patient's prior authorization for the drug is pending or denied, boolean.
  enrollment_requires_valid_rx: Whether enrollment needs a received or active Kestrel prescription for the drug, boolean.
  annual_benefit_max_usd: Program dollars available per benefit period, USD.
  per_fill_cap_applies: Whether a per-fill benefit maximum applies, boolean.
  per_fill_benefit_max_usd: Most the program pays on one fill where the per-fill cap applies, USD.
  patient_minimum_pay_usd: Amount the patient always pays per fill after the program, USD.
  fill_count_cap_applies: Whether a limit on benefit fills per benefit period applies, boolean.
  max_fills_per_benefit_period: Most fills the program pays per benefit period where the fill-count cap applies, integer.
  max_days_supply_per_benefit_fill: Largest days supply of a fill the program pays, integer days.
  benefit_period_basis: What starts a benefit period, enum calendar_year | enrollment_anniversary | grant_award_date | not_applicable.
  reenrollment_allowed_after_expiry: Whether the patient may enroll again after the program expires, boolean.
  renewal_lead_days: Calendar days before expiration from which renewal or re-application may be done, integer days.
  renewal_grace_days: Calendar days after an auto-renewal fee fails during which program prices are still honored, integer days.
  activation_required: Whether the enrollment must be activated before use, boolean.
  activation_window_days: Calendar days from enrollment within which activation must happen, integer days.
  activation_by_first_claim: Whether the first paid program claim itself activates the enrollment, boolean.
  min_age_years: Minimum age in whole years of the enrolling patient, integer years.
  income_attestation_required: Whether the patient must attest household income at enrollment, boolean.
  income_limit_pct_fpl: Highest household income, as a percent of the federal poverty level, that qualifies, integer percent; 0 when no income test applies.
  max_enrollments_per_drug: Most open enrollments of this program type per drug, integer.
  application_priority: Order in which programs are considered for the same fill, lower first, integer.
  rewards_points_on_program_fills: Whether fills paid with this program's help may earn rewards points, boolean.
  suspension_on_government_coverage: Whether the program is suspended when the patient's primary coverage becomes a government plan, boolean.
  suspension_resume_window_days: Calendar days after suspension within which the program may be reinstated, integer days.
  adjudication_method: How the program is applied at the counter, enum cash_price_table | secondary_claim | free_drug_claim.
  specialty_pharmacy_only: Whether program fills are dispensed only by Kestrel Specialty Pharmacy, boolean.
  enrollment_channel: Who enrolls the patient, enum pharmacy_enrolled | manufacturer_hub | foundation_application.
  retro_claim_window_days: Calendar days after a fill within which the program may be applied to that already-paid fill, integer days.

