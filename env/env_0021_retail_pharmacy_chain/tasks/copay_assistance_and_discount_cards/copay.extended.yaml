- id: copay_ext_club_renewal_fee
  base_policy_refs:
  - copay_evt_membership_fees
  - copay_activation_and_term
  overwrite:
  - base_policy: copay_evt_membership_fees
    superseded_clause: A paid membership charges enrollment_fee_usd at activation and at each renewal, once per
      term.
    replaced_by: The loyalty points, the rewards-level points, the coverage points and the pickup points are first
      added into one total percentage, and the enrollment fee is reduced once by that total percentage and rounded
      to the cent half up; the points never act one after another.
  - base_policy: copay_activation_and_term
    superseded_clause: A membership whose auto_renew is true renews at expiration for another membership_term_months
      and charges enrollment_fee_usd again as an annual_renewal
    replaced_by: A membership whose auto-renewal is on renews at expiration for another membership term, and the
      fee charged for that renewal is the renewal fee this policy sets.
  trigger: state_due
  subject:
  - copay_membership_fee_charged
  computes: amount_usd
  target_tool: pay_club_renewal_fee_425b5cbe
  params:
    loyalty_top_charges: 4
    loyalty_mid_charges: 3
    loyalty_pts_top: 15
    loyalty_pts_mid: 10
    rewards_pts_platinum: 10
    rewards_pts_gold: 5
    coverage_pts_recent_loss: 10
    coverage_pts_uninsured: 5
    coverage_lookback_months: 12
    pickup_top_count: 12
    pickup_mid_count: 6
    pickup_pts_top: 5
    pickup_pts_mid: 2
    guarantee_multiplier: 0.9
  rule: 'This policy sets the renewal fee a Kestrel Rx Savings Club member pays in person for the membership term
    the membership is in when the automatic renewal charge for that term could not be collected. The renewal fee
    for a membership term is not fixed until every second fee charge booked for one earlier membership term carries
    its refund on the membership fees account. The standard renewal fee is the program''s enrollment fee, charged
    in full for the term. A paid membership still charges the program''s enrollment fee in full at activation, and
    a fee is charged once per membership term. A membership whose auto-renewal is on renews at expiration for another
    membership term, and the fee charged for that renewal is the renewal fee this policy sets. The renewal fee''s
    loyalty points are set by the fee charges standing on the membership when the renewal fee is worked out, counted
    as every fee charge booked less every fee charge refunded: 4 or more standing charges earn 15 points off, exactly
    3 standing charges earn 10 points off, and fewer earn none. The renewal fee''s rewards-level points are 10 points
    off for a Kestrel Care Rewards Platinum member, 5 points off for a Kestrel Care Rewards Gold member, and none
    for any other patient. The renewal fee''s coverage points depend on the patient''s prescription insurance records:
    a patient with no coverage record in active status whose latest terminated coverage record closed fewer than
    12 whole months before today earns 10 points off, a patient with no coverage record in active status and no
    terminated coverage record closed in those 12 months earns 5 points off, and a patient with a coverage record
    in active status earns none. The renewal fee''s pickup points are set by the prescription pickups the fill ledger
    shows dated fewer than 12 whole months before today: 12 or more pickups earn 5 points off, 6 to 11 pickups earn
    2 points off, and fewer earn none. The loyalty points, the rewards-level points, the coverage points and the
    pickup points are first added into one total percentage, and the enrollment fee is reduced once by that total
    percentage and rounded to the cent half up; the points never act one after another. The reduced renewal fee
    is then finished by the club savings guarantee, which compares the savings the membership gave on discounted
    fills dated fewer than 12 whole months before today with the fee most recently charged on the membership: where
    those savings are less than half of that fee, the whole shortfall (that fee less those savings) is taken off
    the reduced renewal fee; where they are at least half of that fee but less than the whole of it, the reduced
    renewal fee is multiplied by 0.90 and rounded to the cent half up; and where they reach that fee, the reduced
    renewal fee stands as it is. The renewal fee is never below zero.

    '
  prerequisite:
  - problem: copay_ext_duplicate_fee_refund
    kind: value_input
    gate: renewal_charges_standing
    form: state
    policy_source: The renewal fee for a membership term is not fixed until every second fee charge booked for one
      earlier membership term carries its refund on the membership fees account.
    condition: Every copay_membership_fee_charged entry that is the later of two charges carrying the same benefit_period_start
      has a copay_membership_fee_refunded entry whose source_activity_id names it.
    resolved_by: refund_club_membership_fee_7fa4dd89
    effect: The refund of a second charge lowers the standing fee charges by one, which can move the renewal fee's
      loyalty points to a lower tier.
  cross_category:
  - category: rewards
    as: branch
    reads:
    - variant_name
    - status
    note: The Kestrel Care Rewards level decides the rewards-level points of the renewal fee.
  - category: coverage
    as: branch
    reads:
    - status
    - closed_date
    note: Whether a coverage record is active and when the latest terminated one closed decide the coverage points.
  - category: rx
    as: history
    reads:
    - rx_fills.event_type
    - rx_fills.event_date
    note: The prescription pickups dated in the last 12 whole months decide the pickup points.
  compute:
  - renewal_charges_standing: COUNT('copay_activity', event_type='copay_membership_fee_charged') - COUNT('copay_activity',
      event_type='copay_membership_fee_refunded')
  - loyalty_pts: K('loyalty_pts_top') if renewal_charges_standing >= K('loyalty_top_charges') else (K('loyalty_pts_mid')
      if renewal_charges_standing == K('loyalty_mid_charges') else 0)
  - renewal_rewards_level: CFIELD('rewards', 'variant_name', status='active')
  - rewards_pts: K('rewards_pts_platinum') if renewal_rewards_level == 'Kestrel Care Rewards Platinum' else (K('rewards_pts_gold')
      if renewal_rewards_level == 'Kestrel Care Rewards Gold' else 0)
  - has_active_coverage: EXISTS('coverage', status='active')
  - last_terminated_close: CFIELD('coverage', 'closed_date', status='terminated')
  - months_since_coverage_closed: MONTHS(last_terminated_close, NOW) if last_terminated_close != None else 999
  - coverage_pts: K('coverage_pts_recent_loss') if ((not has_active_coverage) and months_since_coverage_closed <
      K('coverage_lookback_months')) else (K('coverage_pts_uninsured') if ((not has_active_coverage) and months_since_coverage_closed
      >= K('coverage_lookback_months')) else 0)
  - renewal_pickups_12m: XCOUNT('rx', 'rx_fills', within_months=12, event_type='rx_pickup')
  - pickup_pts: K('pickup_pts_top') if renewal_pickups_12m >= K('pickup_top_count') else (K('pickup_pts_mid') if
      renewal_pickups_12m >= K('pickup_mid_count') else 0)
  - reduced_fee: RND(P('enrollment_fee_usd') * (1 - (loyalty_pts + rewards_pts + coverage_pts + pickup_pts) / 100.0),
      2)
  - club_savings_12m: SUM('copay_activity', 'amount_usd', within_months=12, event_type='copay_discount_applied')
  - last_fee_charged: LATEST('copay_activity', 'amount_usd', event_type='copay_membership_fee_charged')
  - guaranteed_fee: reduced_fee - (last_fee_charged - club_savings_12m) if club_savings_12m < last_fee_charged /
      2.0 else (RND(reduced_fee * K('guarantee_multiplier'), 2) if club_savings_12m < last_fee_charged else reduced_fee)
  - result: RND(MX(0, guaranteed_fee), 2)
  compute_basis:
    renewal_charges_standing: The renewal fee's loyalty points are set by the fee charges standing on the membership
      when the renewal fee is worked out, counted as every fee charge booked less every fee charge refunded
    loyalty_pts: 4 or more standing charges earn 15 points off, exactly 3 standing charges earn 10 points off, and
      fewer earn none.
    renewal_rewards_level: The renewal fee's rewards-level points are 10 points off for a Kestrel Care Rewards Platinum
      member, 5 points off for a Kestrel Care Rewards Gold member, and none for any other patient.
    rewards_pts: The renewal fee's rewards-level points are 10 points off for a Kestrel Care Rewards Platinum member,
      5 points off for a Kestrel Care Rewards Gold member, and none for any other patient.
    has_active_coverage: The renewal fee's coverage points depend on the patient's prescription insurance records
    last_terminated_close: a patient with no coverage record in active status whose latest terminated coverage record
      closed fewer than 12 whole months before today earns 10 points off
    months_since_coverage_closed: a patient with no coverage record in active status whose latest terminated coverage
      record closed fewer than 12 whole months before today earns 10 points off
    coverage_pts: a patient with no coverage record in active status whose latest terminated coverage record closed
      fewer than 12 whole months before today earns 10 points off, a patient with no coverage record in active status
      and no terminated coverage record closed in those 12 months earns 5 points off, and a patient with a coverage
      record in active status earns none.
    renewal_pickups_12m: The renewal fee's pickup points are set by the prescription pickups the fill ledger shows
      dated fewer than 12 whole months before today
    pickup_pts: 12 or more pickups earn 5 points off, 6 to 11 pickups earn 2 points off, and fewer earn none.
    reduced_fee: The loyalty points, the rewards-level points, the coverage points and the pickup points are first
      added into one total percentage, and the enrollment fee is reduced once by that total percentage and rounded
      to the cent half up; the points never act one after another.
    club_savings_12m: which compares the savings the membership gave on discounted fills dated fewer than 12 whole
      months before today with the fee most recently charged on the membership
    last_fee_charged: which compares the savings the membership gave on discounted fills dated fewer than 12 whole
      months before today with the fee most recently charged on the membership
    guaranteed_fee: where those savings are less than half of that fee, the whole shortfall (that fee less those
      savings) is taken off the reduced renewal fee; where they are at least half of that fee but less than the
      whole of it, the reduced renewal fee is multiplied by 0.90 and rounded to the cent half up; and where they
      reach that fee, the reduced renewal fee stands as it is.
    result: The renewal fee is never below zero.
  factors:
  - id: renewal_loyalty_points
    effect: parameter
    decides: loyalty_pts
    bindings:
    - renewal_charges_standing
    - loyalty_pts
    ladder:
    - when: 4 or more fee charges standing on the membership (charges booked less charges refunded)
      value: K('loyalty_pts_top') = 15 points off
    - when: exactly 3 fee charges standing
      value: K('loyalty_pts_mid') = 10 points off
    - when: otherwise
      value: 0 points
    baseline:
      loyalty_pts: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: renewal_rewards_level_points
    effect: parameter
    decides: rewards_pts
    bindings:
    - renewal_rewards_level
    - rewards_pts
    ladder:
    - when: Kestrel Care Rewards Platinum member
      value: K('rewards_pts_platinum') = 10 points off
    - when: Kestrel Care Rewards Gold member
      value: K('rewards_pts_gold') = 5 points off
    - when: otherwise
      value: 0 points
    baseline:
      rewards_pts: '0'
    evidence:
    - cross_category
    cross_difficulty: rewards
  - id: renewal_coverage_points
    effect: parameter
    decides: coverage_pts
    bindings:
    - has_active_coverage
    - last_terminated_close
    - months_since_coverage_closed
    - coverage_pts
    ladder:
    - when: no coverage record in active status AND the latest terminated coverage record closed fewer than 12 whole
        months before today
      value: K('coverage_pts_recent_loss') = 10 points off
    - when: no coverage record in active status AND no terminated coverage record closed in those 12 months
      value: K('coverage_pts_uninsured') = 5 points off
    - when: otherwise (a coverage record in active status)
      value: 0 points
    baseline:
      coverage_pts: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: coverage
  - id: renewal_pickup_points
    effect: parameter
    decides: pickup_pts
    bindings:
    - renewal_pickups_12m
    - pickup_pts
    ladder:
    - when: 12 or more prescription pickups dated fewer than 12 whole months before today
      value: K('pickup_pts_top') = 5 points off
    - when: 6 to 11 such pickups
      value: K('pickup_pts_mid') = 2 points off
    - when: otherwise
      value: 0 points
    baseline:
      pickup_pts: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: rx
  - id: club_savings_guarantee
    effect: method
    decides: guaranteed_fee
    bindings:
    - club_savings_12m
    - last_fee_charged
    - guaranteed_fee
    ladder:
    - when: savings on discounted fills in the last 12 whole months are less than half of the fee most recently
        charged
      method: the whole shortfall (that fee less those savings) is subtracted from the reduced renewal fee
    - when: those savings are at least half of that fee but less than the whole of it
      method: the reduced renewal fee is multiplied by 0.90 and rounded to the cent half up
    - when: otherwise (those savings reach that fee)
      method: the reduced renewal fee stands as it is
    baseline:
      guaranteed_fee: reduced_fee
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: The standard renewal fee is the program's enrollment fee, charged in full for the term.
    params:
    - enrollment_fee_usd
  inputs:
    history:
    - table: copay_activity
      aggregate: count
      field: activity_id
      filters:
        event_type: copay_membership_fee_charged
    - table: copay_activity
      aggregate: count
      field: activity_id
      filters:
        event_type: copay_membership_fee_refunded
    - table: copay_activity
      aggregate: sum
      field: amount_usd
      within_months: 12
      filters:
        event_type: copay_discount_applied
    - table: copay_activity
      aggregate: latest
      field: amount_usd
      filters:
        event_type: copay_membership_fee_charged
    - category: rx
      table: rx_fills
      aggregate: count
      field: fill_id
      within_months: 12
      filters:
        event_type: rx_pickup
    cross_category:
    - rewards
    - coverage
    - rx
- id: copay_ext_duplicate_fee_refund
  base_policy_refs:
  - copay_evt_membership_fees
  overwrite:
  - base_policy: copay_evt_membership_fees
    superseded_clause: A fee is refunded in full only when the refund is made no later than the date the fee was
      charged plus the fee refund window days, counted in calendar days with the charge date as day 0, and, where
      fee_refund_requires_no_use is true, only when copay_msr_discount_uses_since_fee is 0.
    replaced_by: This policy sets the refund of a Kestrel Rx Savings Club fee charge that was booked a second time
      for a membership term that already carried a fee charge; the later-dated of the two charges is the second
      charge, and it is refunded as a duplicate charge whatever the fee refund window and whatever discounted fills
      followed it.
  - base_policy: copay_evt_membership_fees
    superseded_clause: A fee outside the window, or after a discounted fill, is not refunded, and cancelling the
      membership then only stops the next renewal.
    replaced_by: the later-dated of the two charges is the second charge, and it is refunded as a duplicate charge
      whatever the fee refund window and whatever discounted fills followed it.
  trigger: state_due
  subject:
  - copay_membership_fee_refunded
  computes: amount_usd
  target_tool: refund_club_membership_fee_7fa4dd89
  params:
    courtesy_monthly_days: 180
    courtesy_flat_days: 30
    courtesy_flat_usd: 2.0
    frequent_use_fills: 2
    rate_top_charges: 4
    rate_mid_charges: 3
    rate_top_usd: 0.3
    rate_mid_usd: 0.28
    rate_standard_usd: 0.25
    limit_platinum_usd: 6.0
    limit_gold_usd: 4.0
    limit_standard_usd: 3.0
  rule: 'This policy sets the refund of a Kestrel Rx Savings Club fee charge that was booked a second time for a
    membership term that already carried a fee charge; the later-dated of the two charges is the second charge,
    and it is refunded as a duplicate charge whatever the fee refund window and whatever discounted fills followed
    it. A fee charge that is not a second charge for its term is not refunded under this policy, and such a charge
    is still not refunded outside the fee refund window or after a discounted fill, cancelling the membership then
    only stopping the next renewal. The standard refund of a second charge is the amount booked on that charge,
    with no courtesy credit. A courtesy credit for the time the second charge stood on the membership is added to
    the amount booked, and the refund is the amount booked plus that credit, rounded to the cent half up. How the
    courtesy credit is worked out depends on the calendar days from the date of the second charge to today: 180
    days or more earn the courtesy months times the courtesy rate per month, rounded to the cent half up and then
    held to the courtesy limit; 30 to 179 days earn a flat 2.00 dollars; and fewer than 30 days earn no courtesy
    credit. The courtesy months run from the date of the second charge to today: a member with 2 or more discounted
    fills dated fewer than 12 whole months before today has the month in progress counted, so the courtesy months
    are the whole months plus one; a member with no such discounted fill has only the whole months after the first
    counted, so the courtesy months are the whole months less one; and a member with exactly 1 such discounted fill
    has the whole months counted. The courtesy rate per month is set by the fee charges standing on the membership,
    counted as every fee charge booked less every fee charge refunded: 4 or more standing charges earn 0.30 dollars
    a month, exactly 3 standing charges earn 0.28 dollars a month, and fewer earn 0.25 dollars a month. The courtesy
    limit is 6.00 dollars for a Kestrel Care Rewards Platinum member, 4.00 dollars for a Kestrel Care Rewards Gold
    member, and 3.00 dollars for any other patient. A refund is booked once for a second charge.

    '
  prerequisite: []
  cross_category:
  - category: rewards
    as: branch
    reads:
    - variant_name
    - status
    note: The Kestrel Care Rewards level decides the courtesy limit.
  compute:
  - second_charge_amount: LATEST('copay_activity', 'amount_usd', event_type='copay_membership_fee_charged')
  - second_charge_date: LATEST('copay_activity', 'event_date', event_type='copay_membership_fee_charged')
  - days_charge_stood: DAYS(second_charge_date, NOW)
  - whole_months_stood: MONTHS(second_charge_date, NOW)
  - discounted_fills_12m: COUNT('copay_activity', within_months=12, event_type='copay_discount_applied')
  - courtesy_months: whole_months_stood + 1 if discounted_fills_12m >= K('frequent_use_fills') else (whole_months_stood
      - 1 if discounted_fills_12m == 0 else whole_months_stood)
  - refund_charges_standing: COUNT('copay_activity', event_type='copay_membership_fee_charged') - COUNT('copay_activity',
      event_type='copay_membership_fee_refunded')
  - courtesy_rate: K('rate_top_usd') if refund_charges_standing >= K('rate_top_charges') else (K('rate_mid_usd')
      if refund_charges_standing == K('rate_mid_charges') else K('rate_standard_usd'))
  - refund_rewards_level: CFIELD('rewards', 'variant_name', status='active')
  - courtesy_limit: K('limit_platinum_usd') if refund_rewards_level == 'Kestrel Care Rewards Platinum' else (K('limit_gold_usd')
      if refund_rewards_level == 'Kestrel Care Rewards Gold' else K('limit_standard_usd'))
  - courtesy_credit: MN(courtesy_limit, RND(courtesy_months * courtesy_rate, 2)) if days_charge_stood >= K('courtesy_monthly_days')
      else (K('courtesy_flat_usd') if days_charge_stood >= K('courtesy_flat_days') else 0)
  - result: RND(second_charge_amount + courtesy_credit, 2)
  compute_basis:
    second_charge_amount: The standard refund of a second charge is the amount booked on that charge, with no courtesy
      credit.
    second_charge_date: the later-dated of the two charges is the second charge
    days_charge_stood: How the courtesy credit is worked out depends on the calendar days from the date of the second
      charge to today
    whole_months_stood: The courtesy months run from the date of the second charge to today
    discounted_fills_12m: a member with 2 or more discounted fills dated fewer than 12 whole months before today
      has the month in progress counted
    courtesy_months: a member with 2 or more discounted fills dated fewer than 12 whole months before today has
      the month in progress counted, so the courtesy months are the whole months plus one; a member with no such
      discounted fill has only the whole months after the first counted, so the courtesy months are the whole months
      less one; and a member with exactly 1 such discounted fill has the whole months counted.
    refund_charges_standing: The courtesy rate per month is set by the fee charges standing on the membership, counted
      as every fee charge booked less every fee charge refunded
    courtesy_rate: 4 or more standing charges earn 0.30 dollars a month, exactly 3 standing charges earn 0.28 dollars
      a month, and fewer earn 0.25 dollars a month.
    refund_rewards_level: The courtesy limit is 6.00 dollars for a Kestrel Care Rewards Platinum member, 4.00 dollars
      for a Kestrel Care Rewards Gold member, and 3.00 dollars for any other patient.
    courtesy_limit: The courtesy limit is 6.00 dollars for a Kestrel Care Rewards Platinum member, 4.00 dollars
      for a Kestrel Care Rewards Gold member, and 3.00 dollars for any other patient.
    courtesy_credit: 180 days or more earn the courtesy months times the courtesy rate per month, rounded to the
      cent half up and then held to the courtesy limit; 30 to 179 days earn a flat 2.00 dollars; and fewer than
      30 days earn no courtesy credit.
    result: the refund is the amount booked plus that credit, rounded to the cent half up.
  factors:
  - id: courtesy_credit_method
    effect: method
    decides: courtesy_credit
    bindings:
    - second_charge_date
    - days_charge_stood
    - courtesy_credit
    ladder:
    - when: 180 or more calendar days from the date of the second charge to today
      method: courtesy months times the courtesy rate per month, rounded to the cent half up, then held to the courtesy
        limit
    - when: 30 to 179 calendar days
      method: a flat 2.00 dollars
    - when: otherwise (fewer than 30 days)
      method: no courtesy credit
    baseline:
      courtesy_credit: '0'
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: courtesy_month_count
    effect: parameter
    decides: courtesy_months
    bindings:
    - whole_months_stood
    - discounted_fills_12m
    - courtesy_months
    ladder:
    - when: 2 or more discounted fills dated fewer than 12 whole months before today
      value: whole months plus one
    - when: no discounted fill dated in those 12 months
      value: whole months less one
    - when: otherwise (exactly 1 such discounted fill)
      value: whole months as counted
    baseline:
      courtesy_months: whole_months_stood
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: courtesy_rate_by_standing_charges
    effect: parameter
    decides: courtesy_rate
    bindings:
    - refund_charges_standing
    - courtesy_rate
    ladder:
    - when: 4 or more fee charges standing on the membership
      value: K('rate_top_usd') = 0.30 dollars a month
    - when: exactly 3 fee charges standing
      value: K('rate_mid_usd') = 0.28 dollars a month
    - when: otherwise
      value: K('rate_standard_usd') = 0.25 dollars a month
    baseline:
      courtesy_rate: K('rate_standard_usd')
    evidence:
