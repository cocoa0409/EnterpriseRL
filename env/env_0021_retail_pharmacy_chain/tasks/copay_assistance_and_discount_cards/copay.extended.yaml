    - courtesy_limit
    ladder:
    - when: Kestrel Care Rewards Platinum member
      value: K('limit_platinum_usd') = 6.00 dollars
    - when: Kestrel Care Rewards Gold member
      value: K('limit_gold_usd') = 4.00 dollars
    - when: otherwise
      value: K('limit_standard_usd') = 3.00 dollars
    baseline:
      courtesy_limit: K('limit_standard_usd')
    evidence:
    - cross_category
    cross_difficulty: rewards
  baseline:
    rule: The standard refund of a second charge is the amount booked on that charge, with no courtesy credit.
    params: []
  inputs:
