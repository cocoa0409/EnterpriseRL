    - rewards
- id: delivery_ext_express_order_fee
  base_policy_refs:
  - delivery_evt_order_fees
  - delivery_evt_subscription_billing
  - delivery_evt_order_eligibility
  overwrite:
  - base_policy: delivery_evt_order_fees
    superseded_clause: >-
      An express_1hr order is charged express_1hr_fee_usd, waived while delivery_msr_free_express_month is below free_express_per_month.
    replaced_by: >-
      The express fee is the express speed charge plus the supplements the order still carries once they have been adjusted
      for the plan's age, rounded to the cent.
  - base_policy: delivery_evt_order_fees
    superseded_clause: >-
      Where the plan is past due and benefits_suspended_when_past_due is true, the Kestrel Pay-Per-Delivery fees apply instead.
    replaced_by: >-
      The express fee of an order placed while its plan is past due is not fixed until the subscription fee of the billing
      cycle in which the order was placed stands collected on the plan's ledger.
  - base_policy: delivery_evt_subscription_billing
    superseded_clause: >-
      while past due, where benefits_suspended_when_past_due is true, orders are priced as Kestrel Pay-Per-Delivery orders
    replaced_by: >-
      The express fee of an order placed while its plan is past due is not fixed until the subscription fee of the billing
      cycle in which the order was placed stands collected on the plan's ledger.
  - base_policy: delivery_evt_order_eligibility
    superseded_clause: >-
      a past-due plan's orders are priced as Kestrel Pay-Per-Delivery orders under delivery_evt_subscription_billing
    replaced_by: >-
      Once it stands collected, the order is priced at the plan's own express fee like any order of a plan in good standing;
      an order of a plan that has lapsed is priced as a Kestrel Pay-Per-Delivery order and falls outside this computation.
  trigger: state_due
  subject:
  - delivery_order_fee_charged
  computes: amount_usd
  target_tool: charge_order_fee_01b49350
  params:
    high_value_threshold_usd: 250.0
    mid_value_threshold_usd: 100.0
    high_value_supplement_usd: 2.0
    mid_value_supplement_usd: 1.0
    far_express_miles: 12.0
    far_express_supplement_usd: 2.5
    near_express_supplement_usd: 1.25
    controlled_with_store_items_supplement_usd: 2.0
    controlled_only_supplement_usd: 1.0
    late_evening_from: '20:00'
    evening_from: '18:00'
    late_evening_supplement_usd: 1.75
    evening_supplement_usd: 0.9
    long_tenure_months: 36
    mid_tenure_months: 12
    long_tenure_share_pct: 50
    mid_tenure_share_pct: 75
    maintenance_high_count: 6
    maintenance_low_count: 3
    maintenance_high_discount_pct: 20
    maintenance_low_discount_pct: 10
  rule: >-
    An express order that the free express allowance does not cover is charged the plan's express fee, rounded to the cent.
    The free express allowance itself is counted as the Delivery & Pickup Services charter counts it, and an order it covers
    is not charged at all. Likewise, a patient who holds a Kestrel Care Rewards membership in active status whose level
    carries free prescription delivery is charged no express fee on an order that carries prescriptions, as that charter
    provides, and such an order is not charged at all. The express order concerned is the one most recently placed on the
    plan, and its express fee is worked out when it is booked, from that order's own record: its value, its road distance,
    what it carries and its promised window. An express fee is booked while its order is still the most recently placed
    express order on the plan; a fee left unbooked once a later express order has been placed falls outside this computation.
    The express fee of an order placed while its plan is past due is not fixed until the subscription fee of the billing
    cycle in which the order was placed stands collected on the plan's ledger. Once it stands collected, the order is priced
    at the plan's own express fee like any order of a plan in good standing; an order of a plan that has lapsed is priced
    as a Kestrel Pay-Per-Delivery order and falls outside this computation. The express speed charge is the plan's express_1hr_fee_usd
    reduced by the maintenance delivery discount, and the discount applies only where the plan has no subscription or the
    subscription fee of the billing cycle in which the order was placed stands collected. The maintenance delivery discount
    depends on the patient's prescription history in the 6 months up to the day the fee is booked, counting refills dispensed
    and prescription pickups released by home delivery: maintenance_high_count or more of both earns maintenance_high_discount_pct
    percent; at least maintenance_low_count of both, but fewer than maintenance_high_count of at least one, earns maintenance_low_discount_pct
    percent; anything less earns no discount. The high-value supplement depends on the express order's value: high_value_threshold_usd
    or more carries high_value_supplement_usd, at least mid_value_threshold_usd but below high_value_threshold_usd carries
    mid_value_supplement_usd, and a lower value carries none. The long-distance express supplement depends on the express
    order's road distance from the fulfilling store: more than far_express_miles carries far_express_supplement_usd, more
    than the plan's delivery_radius_miles but not more than far_express_miles carries near_express_supplement_usd, and a
    distance within the plan's delivery_radius_miles carries none. The ID-check handling supplement depends on what the
    express order carries: a controlled-substance prescription together with store items carries controlled_with_store_items_supplement_usd,
    a controlled-substance prescription without store items carries controlled_only_supplement_usd, and an order with no
    controlled-substance prescription carries none. The evening express supplement depends on the end of the express order's
    promised window: late_evening_from or later carries late_evening_supplement_usd, evening_from or later but before late_evening_from
    carries evening_supplement_usd, and an earlier window end carries none. The four supplements are added together, and
    the sum is then adjusted by the age of the plan in whole months from its enrollment date to the day the fee is booked:
    a plan long_tenure_months or more months old keeps long_tenure_share_pct percent of the sum, rounded down to the cent;
    a plan at least mid_tenure_months but fewer than long_tenure_months months old keeps mid_tenure_share_pct percent of
    the sum, rounded up to the cent; a younger plan keeps the whole sum. The express fee is the express speed charge plus
    the supplements the order still carries once they have been adjusted for the plan's age, rounded to the cent.
  prerequisite:
  - problem: delivery_ext_overdue_cycle_settlement
    kind: value_input
    gate: cycle_fee_collected
    form: state
    policy_source: >-
      The express fee of an order placed while its plan is past due is not fixed until the subscription fee of the billing
      cycle in which the order was placed stands collected on the plan's ledger.
    condition: >-
      The plan's fee ledger carries a collected subscription fee entry whose cycle start date is the plan's current cycle
      start date, the cycle in which the express order was placed.
    resolved_by: settle_overdue_pass_fee_c99b5804
    effect: >-
      The collected cycle fee turns the count of subscription fee entries for the current cycle from zero to one, so the
      maintenance delivery discount starts to apply to the express speed charge and the express fee takes the plan-in-good-standing
      value.
  cross_category:
  - category: rx
    as: history
    reads:
    - rx_fills.event_type
    - rx_fills.pickup_channel
    - rx_fills.event_date
    note: >-
      The maintenance delivery discount tier is decided from the patient's refills and home-delivery pickups in the prescription
      fill ledger.
  compute:
  - cycle_fee_collected: >-
      COUNT('delivery_charges', event_type='delivery_subscription_charged', cycle_start_date=F('cycle_start_date'))
  - standing_ok: P('subscription_fee_usd') <= 0 or cycle_fee_collected > 0
  - express_rate: P('express_1hr_fee_usd')
  - home_delivery_pickups: XCOUNT('rx', 'rx_fills', within_months=6, event_type='rx_pickup', pickup_channel='home_delivery')
  - refills_6m: XCOUNT('rx', 'rx_fills', within_months=6, event_type='rx_refill')
  - maintenance_discount_pct: >-
      K('maintenance_high_discount_pct') if (home_delivery_pickups >= K('maintenance_high_count') and refills_6m >= K('maintenance_high_count'))
      else (K('maintenance_low_discount_pct') if (home_delivery_pickups >= K('maintenance_low_count') and refills_6m >=
      K('maintenance_low_count')) else 0)
  - discount_applied: maintenance_discount_pct if standing_ok else 0
  - speed_charge: express_rate * (100 - discount_applied) / 100
  - order_value: >-
      LATEST('delivery_orders', 'order_value_usd', event_type='delivery_order_placed', speed='express_1hr')
  - value_supplement: >-
      K('high_value_supplement_usd') if order_value >= K('high_value_threshold_usd') else (K('mid_value_supplement_usd')
      if order_value >= K('mid_value_threshold_usd') else 0.0)
  - order_distance: LATEST('delivery_orders', 'distance_miles', event_type='delivery_order_placed', speed='express_1hr')
  - distance_supplement: >-
      K('far_express_supplement_usd') if order_distance > K('far_express_miles') else (K('near_express_supplement_usd')
      if order_distance > P('delivery_radius_miles') else 0.0)
  - carries_controlled: >-
      LATEST('delivery_orders', 'includes_controlled', event_type='delivery_order_placed', speed='express_1hr')
  - carries_store_items: >-
      LATEST('delivery_orders', 'includes_front_store', event_type='delivery_order_placed', speed='express_1hr')
  - handling_supplement: >-
      K('controlled_with_store_items_supplement_usd') if (carries_controlled == True and carries_store_items == True) else
      (K('controlled_only_supplement_usd') if (carries_controlled == True and carries_store_items == False) else 0.0)
  - window_end: >-
      LATEST('delivery_orders', 'promised_window_end', event_type='delivery_order_placed', speed='express_1hr')
  - evening_supplement: >-
      K('late_evening_supplement_usd') if window_end >= K('late_evening_from') else (K('evening_supplement_usd') if window_end
      >= K('evening_from') else 0.0)
  - supplements_total: value_supplement + distance_supplement + handling_supplement + evening_supplement
  - plan_age_months: MONTHS(F('opened_date'), NOW)
  - supplements_kept: >-
      int(supplements_total * K('long_tenure_share_pct')) / 100 if plan_age_months >= K('long_tenure_months') else (-((-supplements_total
      * K('mid_tenure_share_pct')) // 1) / 100 if plan_age_months >= K('mid_tenure_months') else supplements_total)
  - result: RND(speed_charge + supplements_kept, 2)
  compute_basis:
    cycle_fee_collected: >-
      The express fee of an order placed while its plan is past due is not fixed until the subscription fee of the billing
      cycle in which the order was placed stands collected on the plan's ledger.
    standing_ok: >-
      the discount applies only where the plan has no subscription or the subscription fee of the billing cycle in which
      the order was placed stands collected.
    express_rate: >-
      An express order that the free express allowance does not cover is charged the plan's express fee, rounded to the
      cent.
    home_delivery_pickups: >-
      The maintenance delivery discount depends on the patient's prescription history in the 6 months up to the day the
      fee is booked, counting refills dispensed and prescription pickups released by home delivery
    refills_6m: >-
      The maintenance delivery discount depends on the patient's prescription history in the 6 months up to the day the
      fee is booked, counting refills dispensed and prescription pickups released by home delivery
    maintenance_discount_pct: >-
      maintenance_high_count or more of both earns maintenance_high_discount_pct percent; at least maintenance_low_count
      of both, but fewer than maintenance_high_count of at least one, earns maintenance_low_discount_pct percent; anything
      less earns no discount.
    discount_applied: >-
      The express speed charge is the plan's express_1hr_fee_usd reduced by the maintenance delivery discount, and the discount
      applies only where the plan has no subscription or the subscription fee of the billing cycle in which the order was
      placed stands collected.
    speed_charge: >-
      The express speed charge is the plan's express_1hr_fee_usd reduced by the maintenance delivery discount
    order_value: >-
      The express order concerned is the one most recently placed on the plan, and its express fee is worked out when it
      is booked, from that order's own record: its value, its road distance, what it carries and its promised window.
    value_supplement: >-
      The high-value supplement depends on the express order's value: high_value_threshold_usd or more carries high_value_supplement_usd,
      at least mid_value_threshold_usd but below high_value_threshold_usd carries mid_value_supplement_usd, and a lower
      value carries none.
    order_distance: >-
      The express order concerned is the one most recently placed on the plan, and its express fee is worked out when it
      is booked, from that order's own record: its value, its road distance, what it carries and its promised window.
    distance_supplement: >-
      The long-distance express supplement depends on the express order's road distance from the fulfilling store: more
      than far_express_miles carries far_express_supplement_usd, more than the plan's delivery_radius_miles but not more
      than far_express_miles carries near_express_supplement_usd, and a distance within the plan's delivery_radius_miles
      carries none.
    carries_controlled: >-
      The express order concerned is the one most recently placed on the plan, and its express fee is worked out when it
      is booked, from that order's own record: its value, its road distance, what it carries and its promised window.
    carries_store_items: >-
      The express order concerned is the one most recently placed on the plan, and its express fee is worked out when it
      is booked, from that order's own record: its value, its road distance, what it carries and its promised window.
    handling_supplement: >-
      The ID-check handling supplement depends on what the express order carries: a controlled-substance prescription together
      with store items carries controlled_with_store_items_supplement_usd, a controlled-substance prescription without store
      items carries controlled_only_supplement_usd, and an order with no controlled-substance prescription carries none.
    window_end: >-
      The express order concerned is the one most recently placed on the plan, and its express fee is worked out when it
      is booked, from that order's own record: its value, its road distance, what it carries and its promised window.
    evening_supplement: >-
      The evening express supplement depends on the end of the express order's promised window: late_evening_from or later
      carries late_evening_supplement_usd, evening_from or later but before late_evening_from carries evening_supplement_usd,
      and an earlier window end carries none.
    supplements_total: The four supplements are added together
    plan_age_months: >-
      the sum is then adjusted by the age of the plan in whole months from its enrollment date to the day the fee is booked
    supplements_kept: >-
      a plan long_tenure_months or more months old keeps long_tenure_share_pct percent of the sum, rounded down to the cent;
      a plan at least mid_tenure_months but fewer than long_tenure_months months old keeps mid_tenure_share_pct percent
      of the sum, rounded up to the cent; a younger plan keeps the whole sum.
    result: >-
      The express fee is the express speed charge plus the supplements the order still carries once they have been adjusted
      for the plan's age, rounded to the cent.
  factors:
  - id: maintenance_delivery_discount
    effect: parameter
    decides: maintenance_discount_pct
    bindings:
    - home_delivery_pickups
    - refills_6m
    - maintenance_discount_pct
    ladder:
    - when: >-
        maintenance_high_count or more prescription pickups released by home delivery and maintenance_high_count or more
        refills dispensed in the 6 months up to the day the fee is booked
      value: K('maintenance_high_discount_pct')
    - when: >-
        at least maintenance_low_count home-delivery pickups and at least maintenance_low_count refills in those 6 months,
        but fewer than maintenance_high_count of at least one
      value: K('maintenance_low_discount_pct')
    - when: otherwise
      value: '0'
    baseline:
      maintenance_discount_pct: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: rx
  - id: high_value_supplement
    effect: parameter
    decides: value_supplement
    bindings:
    - order_value
    - value_supplement
    ladder:
    - when: the express order's value is high_value_threshold_usd or more
      value: K('high_value_supplement_usd')
    - when: the express order's value is at least mid_value_threshold_usd but below high_value_threshold_usd
      value: K('mid_value_supplement_usd')
    - when: otherwise
      value: '0.00'
    baseline:
      value_supplement: '0.0'
    evidence:
    - history
    cross_difficulty: null
  - id: long_distance_express_supplement
    effect: parameter
    decides: distance_supplement
    bindings:
    - order_distance
    - distance_supplement
    ladder:
    - when: the express order's road distance is more than far_express_miles
      value: K('far_express_supplement_usd')
    - when: the road distance is more than the plan's delivery_radius_miles but not more than far_express_miles
      value: K('near_express_supplement_usd')
    - when: otherwise
      value: '0.00'
    baseline:
      distance_supplement: '0.0'
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: id_check_handling_supplement
    effect: parameter
    decides: handling_supplement
    bindings:
    - carries_controlled
    - carries_store_items
    - handling_supplement
    ladder:
    - when: the express order carries a controlled-substance prescription and carries store items
      value: K('controlled_with_store_items_supplement_usd')
    - when: the express order carries a controlled-substance prescription and carries no store items
      value: K('controlled_only_supplement_usd')
    - when: otherwise
      value: '0.00'
    baseline:
      handling_supplement: '0.0'
    evidence:
    - history
    cross_difficulty: null
  - id: evening_express_supplement
    effect: parameter
    decides: evening_supplement
    bindings:
    - window_end
    - evening_supplement
    ladder:
    - when: the express order's promised window ends at late_evening_from or later
      value: K('late_evening_supplement_usd')
    - when: the promised window ends at evening_from or later but before late_evening_from
      value: K('evening_supplement_usd')
    - when: otherwise
      value: '0.00'
    baseline:
      evening_supplement: '0.0'
    evidence:
    - history
    cross_difficulty: null
  - id: plan_age_supplement_adjustment
    effect: method
    decides: supplements_kept
    bindings:
    - plan_age_months
    - supplements_kept
    ladder:
    - when: the plan is long_tenure_months or more whole months old on the day the fee is booked
      method: keep long_tenure_share_pct percent of the supplements' sum, rounded down to the cent
    - when: the plan is at least mid_tenure_months but fewer than long_tenure_months whole months old
      method: keep mid_tenure_share_pct percent of the supplements' sum, rounded up to the cent
    - when: otherwise
      method: keep the whole sum of the supplements
    baseline:
      supplements_kept: supplements_total
    evidence:
    - date
    cross_difficulty: null
  baseline:
    rule: >-
      An express order that the free express allowance does not cover is charged the plan's express fee, rounded to the
      cent.
    params:
    - express_1hr_fee_usd
  inputs:
    history:
    - table: delivery_charges
      aggregate: count
      field: charge_id
      filters:
        event_type: delivery_subscription_charged
    - table: delivery_orders
      aggregate: latest
      field: order_value_usd
      filters:
        event_type: delivery_order_placed
        speed: express_1hr
    - category: rx
      table: rx_fills
      aggregate: count
      field: fill_id
      within_months: 6
      filters:
        event_type: rx_pickup
        pickup_channel: home_delivery
    - category: rx
      table: rx_fills
      aggregate: count
      field: fill_id
      within_months: 6
      filters:
        event_type: rx_refill
    cross_category:
    - rx
- id: delivery_ext_late_delivery_refund
  base_policy_refs:
  - delivery_evt_refunds
  overwrite:
  - base_policy: delivery_evt_refunds
    superseded_clause: >-
      A late order has its order fees refunded at late_delivery_refund_pct percent, as refund_reason late_delivery, where
      late_credit_applies is true and delivery_msr_late_refunds_cycle is below late_credit_max_per_cycle; a late order on
      a plan that charged it no fee earns nothing.
    replaced_by: >-
      The late-delivery refund of a speed fee is the fee multiplied by the fault share, then by the frequency share, then
      by the handover share, each taken as a percentage and applied one after another to the result of the previous step,
      then adjusted for the rewards level, never more than the fee itself and rounded to the cent.
  trigger: on_request
  subject:
  - delivery_fee_refunded
  computes: amount_usd
  target_tool: refund_late_delivery_fee_e6f66314
  params:
    patient_fault_pct: 50
    access_fault_pct: 75
    weather_pct: 90
    full_share_pct: 100
    frequent_late_high_count: 6
    frequent_late_high_pct: 50
    frequent_late_mid_pct: 80
    express_controlled_share_pct: 90
    same_day_controlled_share_pct: 95
    platinum_boost_pct: 200
    gold_boost_pct: 150
  rule: >-
    A late order is one whose delivery was completed more than the plan's late_threshold_minutes after the end of its promised
    window on the scheduled date, or on a later date; where the plan's late_credit_applies is true, the speed fee charged
    on a late order, its same-day fee or its express fee, is refunded as a late-delivery refund; a late order's distance
    or redelivery fee earns no late-delivery refund, and a late order that carries no speed fee earns nothing. A late order's
    speed fee is refunded at late_delivery_refund_pct percent of that speed fee, rounded to the cent. A late-delivery refund
    is worked out only after the late order's speed fee stands booked on the plan's charge ledger; the fee refunded is that
    speed fee. The late order concerned is the one whose delivery was most recently completed on the plan. The fault share
    of a late-delivery refund depends on the reason recorded for a failed delivery attempt on that order, the most recent
    attempt on that order deciding where it has more than one: an attempt that failed because no one was available to sign
    or because no ID was presented sets the fault share at patient_fault_pct percent; an attempt that failed for building
    access or because the address was not found sets it at access_fault_pct percent; an attempt that failed for weather
    or a road closure sets it at weather_pct percent; an order with no failed attempt keeps the fault share at late_delivery_refund_pct
    percent. The frequency share of a late-delivery refund depends on the late-delivery refunds already booked on the plan
    in the 3 months up to today: frequent_late_high_count or more sets it at frequent_late_high_pct percent; at least the
    plan's late_credit_max_per_cycle but fewer than frequent_late_high_count sets it at frequent_late_mid_pct percent; fewer
    than the plan's late_credit_max_per_cycle keeps it at full_share_pct percent. The handover share of a late-delivery
    refund depends on the late order's speed and contents: an express order carrying a controlled-substance prescription
    sets it at express_controlled_share_pct percent, a same-day order carrying a controlled-substance prescription sets
    it at same_day_controlled_share_pct percent, and any other order keeps it at full_share_pct percent. The late-delivery
    refund of a speed fee is the fee multiplied by the fault share, then by the frequency share, then by the handover share,
    each taken as a percentage and applied one after another to the result of the previous step, then adjusted for the rewards
    level, never more than the fee itself and rounded to the cent. The rewards level adjustment of a late-delivery refund
    depends on the patient's Kestrel Care Rewards membership in active status: a Kestrel Care Rewards Platinum member has
    the late-delivery refund multiplied by platinum_boost_pct percent and rounded up to the cent, a Kestrel Care Rewards
    Gold member has it multiplied by gold_boost_pct percent and rounded up to the cent, and every other patient keeps the
    late-delivery refund as worked out; the adjusted late-delivery refund is then limited to that speed fee.
  prerequisite:
  - problem: delivery_ext_express_order_fee
    kind: value_input
    gate: fee_booked
    form: state
    policy_source: >-
      A late-delivery refund is worked out only after the late order's speed fee stands booked on the plan's charge ledger;
      the fee refunded is that speed fee.
    condition: >-
      The plan's fee ledger carries an order fee entry of the late order's speed fee type (express_fee for an express order,
      same_day_fee for a same-day order) whose order reference is the late order.
    resolved_by: charge_order_fee_01b49350
    effect: >-
      The booked speed fee raises the late order's speed fee from zero to the amount booked, which is the base every share
      of the late-delivery refund acts on.
  cross_category:
  - category: rewards
    as: branch
    reads:
    - variant_name
    - status
    note: >-
      The rewards level adjustment of the refund is decided by the patient's active Kestrel Care Rewards level.
  compute:
  - late_order: LATEST('delivery_orders', 'source_order_id', event_type='delivery_completed')
  - late_speed: LATEST('delivery_orders', 'speed', event_type='delivery_order_placed', order_id=late_order)
  - speed_fee_type: >-
      'express_fee' if late_speed == 'express_1hr' else ('same_day_fee' if late_speed == 'same_day' else 'no_speed_fee')
  - fee_booked: >-
      SUM('delivery_charges', 'amount_usd', event_type='delivery_order_fee_charged', source_order_id=late_order, fee_type=speed_fee_type)
  - attempt_reason: >-
      LATEST('delivery_orders', 'failure_reason', event_type='delivery_attempt_failed', source_order_id=late_order)
  - fault_share: >-
      K('patient_fault_pct') if (attempt_reason == 'no_one_available_for_signature' or attempt_reason == 'id_not_presented')
      else (K('access_fault_pct') if (attempt_reason == 'building_access' or attempt_reason == 'address_not_found') else
      (K('weather_pct') if attempt_reason == 'weather_or_road_closure' else P('late_delivery_refund_pct')))
  - late_refunds_3m: >-
      COUNT('delivery_charges', within_months=3, event_type='delivery_fee_refunded', refund_reason='late_delivery')
  - frequency_share: >-
      K('frequent_late_high_pct') if late_refunds_3m >= K('frequent_late_high_count') else (K('frequent_late_mid_pct') if
      late_refunds_3m >= P('late_credit_max_per_cycle') else K('full_share_pct'))
  - late_controlled: >-
      LATEST('delivery_orders', 'includes_controlled', event_type='delivery_order_placed', order_id=late_order)
  - handover_share: >-
      K('express_controlled_share_pct') if (late_speed == 'express_1hr' and late_controlled == True) else (K('same_day_controlled_share_pct')
      if (late_speed == 'same_day' and late_controlled == True) else K('full_share_pct'))
  - refund_worked: fee_booked * fault_share / 100 * frequency_share / 100 * handover_share / 100
  - rewards_level: CFIELD('rewards', 'variant_name', status='active')
  - refund_adjusted: >-
      -((-refund_worked * K('platinum_boost_pct')) // 1) / 100 if rewards_level == 'Kestrel Care Rewards Platinum' else
      (-((-refund_worked * K('gold_boost_pct')) // 1) / 100 if rewards_level == 'Kestrel Care Rewards Gold' else refund_worked)
  - result: RND(MN(fee_booked, refund_adjusted), 2)
  compute_basis:
    late_order: The late order concerned is the one whose delivery was most recently completed on the plan.
    fee_booked: >-
      A late-delivery refund is worked out only after the late order's speed fee stands booked on the plan's charge ledger;
      the fee refunded is that speed fee.
    attempt_reason: >-
      The fault share of a late-delivery refund depends on the reason recorded for a failed delivery attempt on that order,
      the most recent attempt on that order deciding where it has more than one
    fault_share: >-
      an attempt that failed because no one was available to sign or because no ID was presented sets the fault share at
      patient_fault_pct percent; an attempt that failed for building access or because the address was not found sets it
      at access_fault_pct percent; an attempt that failed for weather or a road closure sets it at weather_pct percent;
      an order with no failed attempt keeps the fault share at late_delivery_refund_pct percent.
    late_refunds_3m: >-
      The frequency share of a late-delivery refund depends on the late-delivery refunds already booked on the plan in the
      3 months up to today
    frequency_share: >-
      frequent_late_high_count or more sets it at frequent_late_high_pct percent; at least the plan's late_credit_max_per_cycle
      but fewer than frequent_late_high_count sets it at frequent_late_mid_pct percent; fewer than the plan's late_credit_max_per_cycle
      keeps it at full_share_pct percent.
    late_speed: The handover share of a late-delivery refund depends on the late order's speed and contents
    late_controlled: The handover share of a late-delivery refund depends on the late order's speed and contents
    handover_share: >-
      an express order carrying a controlled-substance prescription sets it at express_controlled_share_pct percent, a same-day
      order carrying a controlled-substance prescription sets it at same_day_controlled_share_pct percent, and any other
      order keeps it at full_share_pct percent.
    refund_worked: >-
      The late-delivery refund of a speed fee is the fee multiplied by the fault share, then by the frequency share, then
      by the handover share, each taken as a percentage and applied one after another to the result of the previous step
    rewards_level: >-
      The rewards level adjustment of a late-delivery refund depends on the patient's Kestrel Care Rewards membership in
      active status
    refund_adjusted: >-
      a Kestrel Care Rewards Platinum member has the late-delivery refund multiplied by platinum_boost_pct percent and rounded
      up to the cent, a Kestrel Care Rewards Gold member has it multiplied by gold_boost_pct percent and rounded up to the
      cent, and every other patient keeps the late-delivery refund as worked out
    result: the adjusted late-delivery refund is then limited to that speed fee.
    speed_fee_type: >-
      the speed fee charged on a late order, its same-day fee or its express fee, is refunded as a late-delivery refund;
      a late order's distance or redelivery fee earns no late-delivery refund, and a late order that carries no speed fee
      earns nothing.
  factors:
  - id: fault_share
    effect: parameter
    decides: fault_share
    bindings:
    - attempt_reason
    - fault_share
    ladder:
    - when: >-
        a failed attempt on the late order was recorded because no one was available to sign or because no ID was presented
      value: K('patient_fault_pct')
    - when: >-
        a failed attempt on the late order was recorded for building access or because the address was not found
      value: K('access_fault_pct')
    - when: a failed attempt on the late order was recorded for weather or a road closure
      value: K('weather_pct')
    - when: otherwise (no failed attempt on the late order)
      value: P('late_delivery_refund_pct')
    baseline:
      fault_share: P('late_delivery_refund_pct')
    evidence:
    - history
    cross_difficulty: null
  - id: late_refund_frequency_share
    effect: parameter
    decides: frequency_share
    bindings:
    - late_refunds_3m
    - frequency_share
    ladder:
    - when: >-
        frequent_late_high_count or more late-delivery refunds booked on the plan in the 3 months up to today
      value: K('frequent_late_high_pct')
    - when: at least the plan's late_credit_max_per_cycle but fewer than frequent_late_high_count such refunds
      value: K('frequent_late_mid_pct')
    - when: otherwise
      value: K('full_share_pct')
    baseline:
      frequency_share: K('full_share_pct')
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: controlled_handover_share
    effect: parameter
    decides: handover_share
    bindings:
    - late_speed
    - late_controlled
    - handover_share
    ladder:
    - when: the late order was an express order and carried a controlled-substance prescription
      value: K('express_controlled_share_pct')
    - when: the late order was a same-day order and carried a controlled-substance prescription
      value: K('same_day_controlled_share_pct')
    - when: otherwise
      value: K('full_share_pct')
    baseline:
      handover_share: K('full_share_pct')
    evidence:
    - history
    cross_difficulty: null
  - id: rewards_refund_adjustment
    effect: method
    decides: refund_adjusted
    bindings:
    - rewards_level
    - refund_adjusted
    ladder:
    - when: the patient is an active Kestrel Care Rewards Platinum member
      method: multiply the late-delivery refund by platinum_boost_pct percent and round up to the cent
    - when: the patient is an active Kestrel Care Rewards Gold member
      method: multiply the late-delivery refund by gold_boost_pct percent and round up to the cent
    - when: otherwise
      method: keep the late-delivery refund as worked out
    baseline:
      refund_adjusted: refund_worked
    evidence:
    - cross_category
    cross_difficulty: null
  baseline:
    rule: >-
      A late order's speed fee is refunded at late_delivery_refund_pct percent of that speed fee, rounded to the cent.
    params:
    - late_delivery_refund_pct
  inputs:
    history:
    - table: delivery_charges
      aggregate: sum
      field: amount_usd
      filters:
        event_type: delivery_order_fee_charged
        fee_type: express_fee | same_day_fee (the late order's speed)
    - table: delivery_charges
      aggregate: count
      field: charge_id
      within_months: 3
      filters:
        event_type: delivery_fee_refunded
        refund_reason: late_delivery
    - table: delivery_orders
      aggregate: latest
      field: failure_reason
      filters:
        event_type: delivery_attempt_failed
    cross_category:
    - rewards
- id: delivery_ext_dispatch_cancellation_refund
  base_policy_refs:
  - delivery_evt_refunds
  overwrite:
  - base_policy: delivery_evt_refunds
    superseded_clause: >-
      An order cancelled before dispatch has its order fees refunded in full where order_cancel_refund_before_dispatch is
      true
    replaced_by: >-
      The cancellation refund is the speed fee charged on the cancelled order less the retained cancellation charges as
      adjusted for the rewards level, never below zero and rounded to the cent.
  trigger: state_due
  subject:
  - delivery_fee_refunded
  computes: amount_usd
  target_tool: refund_cancelled_order_fee_665693af
  params:
    later_day_packing_usd: 2.0
    same_day_packing_usd: 1.0
    repeat_cancel_high_count: 3
    repeat_cancel_low_count: 2
    repeat_cancel_high_usd: 1.5
    repeat_cancel_low_usd: 0.75
    restock_high_value_usd: 150.0
    restock_mid_value_usd: 75.0
    restock_high_charge_usd: 1.0
    restock_mid_charge_usd: 0.5
    platinum_keep_pct: 50
    gold_keep_pct: 75
  rule: >-
    Where the plan's order_cancel_refund_before_dispatch is true, each fee charged on an order that was cancelled before
    dispatch is refunded by its own cancellation refund. The order's speed fee, its same-day fee or its express fee, is
    refunded under this computation; a distance or redelivery fee on such an order is refunded in full and falls outside
    this computation. An order cancelled before dispatch has its speed fee refunded in full, rounded to the cent. The cancelled
    order concerned is the one most recently cancelled on the plan, and the fee refunded is the speed fee charged on that
    order. The packing charge retained on a cancellation depends on who cancelled and when: an order cancelled at the patient's
    request on a later day than the day it was placed keeps later_day_packing_usd, an order cancelled at the patient's request
    on the day it was placed keeps same_day_packing_usd, and an order cancelled for an item being unavailable or the address
    being outside the delivery area keeps no packing charge. The repeat cancellation charge retained depends on the orders
    cancelled at the patient's request on the plan in the 6 months up to today, the cancelled order included: repeat_cancel_high_count
    or more keeps repeat_cancel_high_usd, repeat_cancel_low_count keeps repeat_cancel_low_usd, and a single one keeps no
    repeat charge. The restocking charge retained depends on the cancelled order's value: restock_high_value_usd or more
    keeps restock_high_charge_usd, at least restock_mid_value_usd but below restock_high_value_usd keeps restock_mid_charge_usd,
    and a lower value keeps no restocking charge. The retained cancellation charges are the packing, repeat cancellation
    and restocking charges added together, and that sum is then adjusted for the patient's Kestrel Care Rewards membership
    in active status: a Kestrel Care Rewards Platinum member keeps platinum_keep_pct percent of it, rounded down to the
    cent; a Kestrel Care Rewards Gold member keeps gold_keep_pct percent of it, rounded up to the cent; every other patient
    keeps the whole sum. The cancellation refund is the speed fee charged on the cancelled order less the retained cancellation
    charges as adjusted for the rewards level, never below zero and rounded to the cent.
  prerequisite: []
  cross_category:
  - category: rewards
    as: branch
    reads:
    - variant_name
    - status
    note: >-
      The rewards level adjustment of the retained cancellation charges is decided by the patient's active Kestrel Care
      Rewards level.
  compute:
  - cancelled_order: LATEST('delivery_orders', 'source_order_id', event_type='delivery_order_cancelled')
  - cancelled_speed: LATEST('delivery_orders', 'speed', event_type='delivery_order_placed', order_id=cancelled_order)
  - speed_fee_type: >-
      'express_fee' if cancelled_speed == 'express_1hr' else ('same_day_fee' if cancelled_speed == 'same_day' else 'no_speed_fee')
  - fee_charged: >-
      SUM('delivery_charges', 'amount_usd', event_type='delivery_order_fee_charged', source_order_id=cancelled_order, fee_type=speed_fee_type)
  - cancel_reason: >-
      LATEST('delivery_orders', 'cancel_reason', event_type='delivery_order_cancelled', source_order_id=cancelled_order)
  - placed_date: >-
      LATEST('delivery_orders', 'event_date', event_type='delivery_order_placed', order_id=cancelled_order)
  - cancel_gap_days: >-
      DAYS(placed_date, LATEST('delivery_orders', 'event_date', event_type='delivery_order_cancelled', source_order_id=cancelled_order))
  - packing_charge: >-
      K('later_day_packing_usd') if (cancel_reason == 'patient_request' and cancel_gap_days >= 1) else (K('same_day_packing_usd')
      if (cancel_reason == 'patient_request' and cancel_gap_days < 1) else 0.0)
  - patient_cancels_6m: >-
      COUNT('delivery_orders', within_months=6, event_type='delivery_order_cancelled', cancel_reason='patient_request')
  - repeat_charge: >-
      K('repeat_cancel_high_usd') if patient_cancels_6m >= K('repeat_cancel_high_count') else (K('repeat_cancel_low_usd')
      if patient_cancels_6m >= K('repeat_cancel_low_count') else 0.0)
  - cancelled_value: >-
      LATEST('delivery_orders', 'order_value_usd', event_type='delivery_order_placed', order_id=cancelled_order)
  - restock_charge: >-
      K('restock_high_charge_usd') if cancelled_value >= K('restock_high_value_usd') else (K('restock_mid_charge_usd') if
      cancelled_value >= K('restock_mid_value_usd') else 0.0)
  - retained_total: packing_charge + repeat_charge + restock_charge
  - rewards_level: CFIELD('rewards', 'variant_name', status='active')
  - retained_kept: >-
      int(retained_total * K('platinum_keep_pct')) / 100 if rewards_level == 'Kestrel Care Rewards Platinum' else (-((-retained_total
      * K('gold_keep_pct')) // 1) / 100 if rewards_level == 'Kestrel Care Rewards Gold' else retained_total)
  - result: RND(MX(0, fee_charged - retained_kept), 2)
  compute_basis:
    cancelled_order: >-
      The cancelled order concerned is the one most recently cancelled on the plan, and the fee refunded is the speed fee
      charged on that order.
    fee_charged: >-
      The cancelled order concerned is the one most recently cancelled on the plan, and the fee refunded is the speed fee
      charged on that order.
    cancel_reason: The packing charge retained on a cancellation depends on who cancelled and when
    placed_date: The packing charge retained on a cancellation depends on who cancelled and when
    cancel_gap_days: >-
      an order cancelled at the patient's request on a later day than the day it was placed keeps later_day_packing_usd,
      an order cancelled at the patient's request on the day it was placed keeps same_day_packing_usd
    packing_charge: >-
      an order cancelled at the patient's request on a later day than the day it was placed keeps later_day_packing_usd,
      an order cancelled at the patient's request on the day it was placed keeps same_day_packing_usd, and an order cancelled
      for an item being unavailable or the address being outside the delivery area keeps no packing charge.
    patient_cancels_6m: >-
      The repeat cancellation charge retained depends on the orders cancelled at the patient's request on the plan in the
      6 months up to today, the cancelled order included
    repeat_charge: >-
      repeat_cancel_high_count or more keeps repeat_cancel_high_usd, repeat_cancel_low_count keeps repeat_cancel_low_usd,
      and a single one keeps no repeat charge.
    cancelled_value: The restocking charge retained depends on the cancelled order's value
    restock_charge: >-
      restock_high_value_usd or more keeps restock_high_charge_usd, at least restock_mid_value_usd but below restock_high_value_usd
      keeps restock_mid_charge_usd, and a lower value keeps no restocking charge.
    retained_total: >-
      The retained cancellation charges are the packing, repeat cancellation and restocking charges added together
    rewards_level: that sum is then adjusted for the patient's Kestrel Care Rewards membership in active status
    retained_kept: >-
      a Kestrel Care Rewards Platinum member keeps platinum_keep_pct percent of it, rounded down to the cent; a Kestrel
      Care Rewards Gold member keeps gold_keep_pct percent of it, rounded up to the cent; every other patient keeps the
      whole sum.
    result: >-
      The cancellation refund is the speed fee charged on the cancelled order less the retained cancellation charges as
      adjusted for the rewards level, never below zero and rounded to the cent.
    cancelled_speed: The order's speed fee, its same-day fee or its express fee, is refunded under this computation
    speed_fee_type: >-
      The order's speed fee, its same-day fee or its express fee, is refunded under this computation; a distance or redelivery
      fee on such an order is refunded in full and falls outside this computation.
  factors:
  - id: packing_charge
    effect: parameter
    decides: packing_charge
    bindings:
    - cancel_reason
    - placed_date
    - cancel_gap_days
    - packing_charge
    ladder:
    - when: the order was cancelled at the patient's request and on a later day than the day it was placed
      value: K('later_day_packing_usd')
    - when: the order was cancelled at the patient's request and on the day it was placed
      value: K('same_day_packing_usd')
    - when: otherwise (cancelled for an unavailable item or an address outside the delivery area)
      value: '0.00'
    baseline:
      packing_charge: '0.0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: repeat_cancellation_charge
    effect: parameter
    decides: repeat_charge
    bindings:
    - patient_cancels_6m
    - repeat_charge
    ladder:
    - when: >-
        repeat_cancel_high_count or more orders cancelled at the patient's request on the plan in the 6 months up to today
      value: K('repeat_cancel_high_usd')
    - when: exactly repeat_cancel_low_count such orders
      value: K('repeat_cancel_low_usd')
    - when: otherwise
      value: '0.00'
    baseline:
      repeat_charge: '0.0'
    evidence:
    - history
    cross_difficulty: null
  - id: restocking_charge
    effect: parameter
    decides: restock_charge
    bindings:
    - cancelled_value
    - restock_charge
    ladder:
    - when: the cancelled order's value is restock_high_value_usd or more
      value: K('restock_high_charge_usd')
    - when: the cancelled order's value is at least restock_mid_value_usd but below restock_high_value_usd
      value: K('restock_mid_charge_usd')
    - when: otherwise
      value: '0.00'
    baseline:
      restock_charge: '0.0'
    evidence:
    - history
    cross_difficulty: null
  - id: rewards_retained_adjustment
    effect: method
    decides: retained_kept
    bindings:
    - rewards_level
    - retained_kept
    ladder:
    - when: the patient is an active Kestrel Care Rewards Platinum member
      method: keep platinum_keep_pct percent of the retained sum, rounded down to the cent
    - when: the patient is an active Kestrel Care Rewards Gold member
      method: keep gold_keep_pct percent of the retained sum, rounded up to the cent
    - when: otherwise
      method: keep the whole retained sum
    baseline:
      retained_kept: retained_total
    evidence:
    - cross_category
    cross_difficulty: null
  baseline:
    rule: An order cancelled before dispatch has its speed fee refunded in full, rounded to the cent.
    params:
    - order_cancel_refund_before_dispatch
  inputs:
    history:
    - table: delivery_charges
      aggregate: sum
      field: amount_usd
      filters:
        event_type: delivery_order_fee_charged
    - table: delivery_orders
      aggregate: count
      field: order_id
      within_months: 6
      filters:
        event_type: delivery_order_cancelled
        cancel_reason: patient_request
    cross_category:
    - rewards
- id: delivery_ext_annual_pass_switch_charge
  base_policy_refs:
  - delivery_plan_enrollment
  - delivery_evt_subscription_billing
  overwrite:
  - base_policy: delivery_evt_subscription_billing
    superseded_clause: >-
      a plan with a subscription_fee_usd above 0.00 is charged that fee for its first cycle on activation and for every
      later cycle on the cycle's first day
    replaced_by: >-
      The switch charge is the annual switch price less the unused-cycle credit, the recent-fees credit, the Medicare member
      credit, the maintenance delivery credit, the missed-delivery credit and the delivery spend credit, all subtracted
      together, never below zero and rounded to the cent.
  trigger: on_request
  subject:
  - delivery_plan_details_updated
  - delivery_subscription_charged
  computes: amount_usd
  target_tool: switch_delivery_pass_b46d5026
  params:
    annual_switch_price_usd: 48.0
    long_tenure_months: 18
    mid_tenure_months: 6
    days_per_week: 7
    busy_deliveries_3m: 6
    full_credit_pct: 100
    partial_credit_pct: 75
    standard_credit_pct: 50
    advantage_credit_usd: 3.0
    part_d_credit_usd: 1.5
    maintenance_high_refills: 6
    maintenance_high_pickups: 3
    maintenance_low_refills: 3
    maintenance_low_pickups: 1
    maintenance_high_credit_usd: 4.0
    maintenance_low_credit_usd: 2.0
    missed_high_count: 2
    missed_low_count: 1
    missed_high_credit_usd: 2.0
    missed_low_credit_usd: 1.0
    spend_high_usd: 600.0
    spend_low_usd: 300.0
    spend_high_credit_usd: 1.5
    spend_low_credit_usd: 0.75
  rule: >-
    A patient holding a Kestrel Delivery Pass Monthly or Kestrel Senior Delivery Pass in active status may switch to the
    Kestrel Delivery Pass Annual and pays the switch charge for the annual pass's opening cycle, which starts on the switch
    date; the payment is booked as the subscription fee of that cycle. This charge applies to a patient who has had a Delivery
    Pass trial before; a patient who has not starts a trial, pays nothing on the switch and falls outside this computation.
    The switch into the Kestrel Delivery Pass Annual is charged the annual switch price, annual_switch_price_usd, less a
    recent-fees credit of standard_credit_pct percent of the order fees charged on the plan in the month up to the switch
    date net of the refunds booked on the plan in that month, that net amount never below zero, rounded to the cent. The
    switch charge for the Kestrel Delivery Pass Annual is fixed only after every order of the plan cancelled before dispatch
    carries a refund entry for each fee charged on it. The unused-cycle credit of a switch depends on the plan's age in
    whole months from its enrollment date to the switch date: a plan long_tenure_months or more months old is credited the
    current subscription fee multiplied by the unused days of the current cycle and divided by the days in that cycle, rounded
    to the cent; a plan at least mid_tenure_months but fewer than long_tenure_months months old is credited only for whole
    unused weeks, the current subscription fee multiplied by days_per_week times the whole weeks and divided by the days
    in the cycle, rounded to the cent; a younger plan is credited nothing. The unused days are the days from the switch
    date to the current cycle's end date, the switch date not counted and the end date counted, and the days in the cycle
    count both its start date and its end date. The recent-fees credit of a switch is a share of the order fees charged
    on the plan in the month up to the switch date less the refunds booked on the plan in that month, that net amount never
    below zero, and the credit is rounded to the cent. Its share depends on the patient's Kestrel Care Rewards membership
    in active status together with the deliveries completed on the plan in the 3 months up to the switch date: a Kestrel
    Care Rewards Gold or Platinum member with busy_deliveries_3m or more completed deliveries is credited full_credit_pct
    percent; a Kestrel Care Rewards Member or Silver member with busy_deliveries_3m or more completed deliveries is credited
    partial_credit_pct percent; every other patient is credited standard_credit_pct percent. The Medicare member credit
    of a switch depends on the patient's primary prescription insurance record in active status: a Medicare Advantage Prescription
    Drug Plan earns advantage_credit_usd, a Medicare Part D Standard Plan or Medicare Part D Enhanced Plan earns part_d_credit_usd,
    and any other insurance record, or none, earns nothing. The maintenance delivery credit of a switch depends on the patient's
    prescription history in the 6 months up to the switch date: maintenance_high_refills or more refills dispensed together
    with maintenance_high_pickups or more pickups released by home delivery earns maintenance_high_credit_usd; at least
    maintenance_low_refills refills together with at least maintenance_low_pickups home-delivery pickup, short of the higher
    tier, earns maintenance_low_credit_usd; anything less earns nothing. The missed-delivery credit of a switch depends
    on the failed delivery attempts on the plan in the 3 months up to the switch date: missed_high_count or more earns missed_high_credit_usd,
    at least missed_low_count but fewer than missed_high_count earns missed_low_credit_usd, and none earns nothing. The
    delivery spend credit of a switch depends on the total value of the orders placed on the plan in the 3 months up to
    the switch date, cancelled orders included: spend_high_usd or more earns spend_high_credit_usd, at least spend_low_usd
    but below spend_high_usd earns spend_low_credit_usd, and less earns nothing. The switch charge is the annual switch
    price less the unused-cycle credit, the recent-fees credit, the Medicare member credit, the maintenance delivery credit,
    the missed-delivery credit and the delivery spend credit, all subtracted together, never below zero and rounded to the
    cent.
  prerequisite:
  - problem: delivery_ext_dispatch_cancellation_refund
    kind: value_input
    gate: net_recent_fees
    form: state
    policy_source: >-
      The switch charge for the Kestrel Delivery Pass Annual is fixed only after every order of the plan cancelled before
      dispatch carries a refund entry for each fee charged on it.
    condition: >-
      For every order of the plan with a cancellation entry, each order fee entry on that order has a refund entry on the
      plan's fee ledger naming it.
    resolved_by: refund_cancelled_order_fee_665693af
    effect: >-
      The cancellation refund booked in the month up to the switch date lowers the order fees net of refunds in that month,
      which is the base of the recent-fees credit, so the recent-fees credit falls and the switch charge rises.
  cross_category:
  - category: coverage
    as: branch
    reads:
    - variant_name
    - status
    - coverage_order
    note: >-
      The Medicare member credit is decided by the class of the patient's primary prescription insurance record in active
      status.
  - category: rewards
    as: branch
    reads:
    - variant_name
    - status
    note: >-
      The share of the recent-fees credit is decided by the active Kestrel Care Rewards level together with the plan's completed
      deliveries.
  - category: rx
    as: history
    reads:
    - rx_fills.event_type
    - rx_fills.pickup_channel
    - rx_fills.event_date
    note: >-
      The maintenance delivery credit is decided from the patient's refills and home-delivery pickups in the prescription
      fill ledger.
  compute:
  - switch_price: K('annual_switch_price_usd')
  - current_fee: P('subscription_fee_usd')
  - plan_age_months: MONTHS(F('opened_date'), NOW)
  - unused_days: DAYS(NOW, F('cycle_end_date'))
  - cycle_days: DAYS(F('cycle_start_date'), F('cycle_end_date')) + 1
  - unused_cycle_credit: >-
      RND(current_fee * unused_days / cycle_days, 2) if plan_age_months >= K('long_tenure_months') else (RND(current_fee
      * K('days_per_week') * int(unused_days / K('days_per_week')) / cycle_days, 2) if plan_age_months >= K('mid_tenure_months')
      else 0.0)
  - fees_1m: SUM('delivery_charges', 'amount_usd', within_months=1, event_type='delivery_order_fee_charged')
  - refunds_1m: SUM('delivery_charges', 'amount_usd', within_months=1, event_type='delivery_fee_refunded')
  - net_recent_fees: MX(0, fees_1m - refunds_1m)
  - rewards_level: CFIELD('rewards', 'variant_name', status='active')
  - deliveries_3m: COUNT('delivery_orders', within_months=3, event_type='delivery_completed')
  - recent_credit_pct: >-
      K('full_credit_pct') if ((rewards_level == 'Kestrel Care Rewards Gold' or rewards_level == 'Kestrel Care Rewards Platinum')
      and deliveries_3m >= K('busy_deliveries_3m')) else (K('partial_credit_pct') if ((rewards_level == 'Kestrel Care Rewards
      Member' or rewards_level == 'Kestrel Care Rewards Silver') and deliveries_3m >= K('busy_deliveries_3m')) else K('standard_credit_pct'))
  - recent_fees_credit: RND(net_recent_fees * recent_credit_pct / 100, 2)
  - insurance_class: CFIELD('coverage', 'variant_name', status='active', coverage_order='primary')
  - medicare_credit: >-
      K('advantage_credit_usd') if insurance_class == 'Medicare Advantage Prescription Drug Plan' else (K('part_d_credit_usd')
      if (insurance_class == 'Medicare Part D Standard Plan' or insurance_class == 'Medicare Part D Enhanced Plan') else
      0.0)
  - refills_6m: XCOUNT('rx', 'rx_fills', within_months=6, event_type='rx_refill')
  - home_delivery_pickups: XCOUNT('rx', 'rx_fills', within_months=6, event_type='rx_pickup', pickup_channel='home_delivery')
  - maintenance_credit: >-
      K('maintenance_high_credit_usd') if (refills_6m >= K('maintenance_high_refills') and home_delivery_pickups >= K('maintenance_high_pickups'))
      else (K('maintenance_low_credit_usd') if (refills_6m >= K('maintenance_low_refills') and home_delivery_pickups >=
      K('maintenance_low_pickups')) else 0.0)
  - failed_attempts_3m: COUNT('delivery_orders', within_months=3, event_type='delivery_attempt_failed')
  - missed_credit: >-
      K('missed_high_credit_usd') if failed_attempts_3m >= K('missed_high_count') else (K('missed_low_credit_usd') if failed_attempts_3m
      >= K('missed_low_count') else 0.0)
  - spend_3m: SUM('delivery_orders', 'order_value_usd', within_months=3, event_type='delivery_order_placed')
  - spend_credit: >-
      K('spend_high_credit_usd') if spend_3m >= K('spend_high_usd') else (K('spend_low_credit_usd') if spend_3m >= K('spend_low_usd')
      else 0.0)
  - result: >-
      RND(MX(0, switch_price - unused_cycle_credit - recent_fees_credit - medicare_credit - maintenance_credit - missed_credit
      - spend_credit), 2)
  compute_basis:
    switch_price: >-
      The switch into the Kestrel Delivery Pass Annual is charged the annual switch price, annual_switch_price_usd, less
      a recent-fees credit of standard_credit_pct percent of the order fees charged on the plan in the month up to the switch
      date net of the refunds booked on the plan in that month, that net amount never below zero, rounded to the cent.
    current_fee: >-
      is credited the current subscription fee multiplied by the unused days of the current cycle and divided by the days
      in that cycle, rounded to the cent
    plan_age_months: >-
      The unused-cycle credit of a switch depends on the plan's age in whole months from its enrollment date to the switch
      date
    unused_days: >-
      The unused days are the days from the switch date to the current cycle's end date, the switch date not counted and
      the end date counted
    cycle_days: the days in the cycle count both its start date and its end date.
    unused_cycle_credit: >-
      a plan long_tenure_months or more months old is credited the current subscription fee multiplied by the unused days
      of the current cycle and divided by the days in that cycle, rounded to the cent; a plan at least mid_tenure_months
      but fewer than long_tenure_months months old is credited only for whole unused weeks, the current subscription fee
      multiplied by days_per_week times the whole weeks and divided by the days in the cycle, rounded to the cent; a younger
      plan is credited nothing.
    fees_1m: >-
      The recent-fees credit of a switch is a share of the order fees charged on the plan in the month up to the switch
      date less the refunds booked on the plan in that month, that net amount never below zero, and the credit is rounded
      to the cent.
    refunds_1m: >-
      The recent-fees credit of a switch is a share of the order fees charged on the plan in the month up to the switch
      date less the refunds booked on the plan in that month, that net amount never below zero, and the credit is rounded
      to the cent.
    net_recent_fees: less the refunds booked on the plan in that month, that net amount never below zero
    rewards_level: >-
      Its share depends on the patient's Kestrel Care Rewards membership in active status together with the deliveries completed
      on the plan in the 3 months up to the switch date
    deliveries_3m: >-
      Its share depends on the patient's Kestrel Care Rewards membership in active status together with the deliveries completed
      on the plan in the 3 months up to the switch date
    recent_credit_pct: >-
      a Kestrel Care Rewards Gold or Platinum member with busy_deliveries_3m or more completed deliveries is credited full_credit_pct
      percent; a Kestrel Care Rewards Member or Silver member with busy_deliveries_3m or more completed deliveries is credited
      partial_credit_pct percent; every other patient is credited standard_credit_pct percent.
    recent_fees_credit: >-
      The recent-fees credit of a switch is a share of the order fees charged on the plan in the month up to the switch
      date less the refunds booked on the plan in that month, that net amount never below zero, and the credit is rounded
      to the cent.
    insurance_class: >-
      The Medicare member credit of a switch depends on the patient's primary prescription insurance record in active status
    medicare_credit: >-
      a Medicare Advantage Prescription Drug Plan earns advantage_credit_usd, a Medicare Part D Standard Plan or Medicare
      Part D Enhanced Plan earns part_d_credit_usd, and any other insurance record, or none, earns nothing.
    refills_6m: >-
      The maintenance delivery credit of a switch depends on the patient's prescription history in the 6 months up to the
      switch date
    home_delivery_pickups: >-
      The maintenance delivery credit of a switch depends on the patient's prescription history in the 6 months up to the
      switch date
    maintenance_credit: >-
      maintenance_high_refills or more refills dispensed together with maintenance_high_pickups or more pickups released
      by home delivery earns maintenance_high_credit_usd; at least maintenance_low_refills refills together with at least
      maintenance_low_pickups home-delivery pickup, short of the higher tier, earns maintenance_low_credit_usd; anything
      less earns nothing.
    failed_attempts_3m: >-
      The missed-delivery credit of a switch depends on the failed delivery attempts on the plan in the 3 months up to the
      switch date
    missed_credit: >-
      missed_high_count or more earns missed_high_credit_usd, at least missed_low_count but fewer than missed_high_count
      earns missed_low_credit_usd, and none earns nothing.
    spend_3m: >-
      The delivery spend credit of a switch depends on the total value of the orders placed on the plan in the 3 months
      up to the switch date, cancelled orders included
    spend_credit: >-
      spend_high_usd or more earns spend_high_credit_usd, at least spend_low_usd but below spend_high_usd earns spend_low_credit_usd,
      and less earns nothing.
    result: >-
      The switch charge is the annual switch price less the unused-cycle credit, the recent-fees credit, the Medicare member
      credit, the maintenance delivery credit, the missed-delivery credit and the delivery spend credit, all subtracted
      together, never below zero and rounded to the cent.
  factors:
  - id: unused_cycle_credit
    effect: method
    decides: unused_cycle_credit
    bindings:
    - plan_age_months
    - unused_days
    - cycle_days
    - unused_cycle_credit
    ladder:
    - when: the plan is long_tenure_months or more whole months old on the switch date
      method: >-
        credit the current subscription fee multiplied by the unused days of the cycle and divided by the days in the cycle,
        rounded to the cent
    - when: the plan is at least mid_tenure_months but fewer than long_tenure_months whole months old
      method: >-
        credit only whole unused weeks: the current subscription fee multiplied by days_per_week times the whole weeks,
        divided by the days in the cycle, rounded to the cent
    - when: otherwise
      method: no credit; the rest of the current cycle is forgone
    baseline:
      unused_cycle_credit: '0.0'
    evidence:
    - date
    cross_difficulty: null
  - id: recent_fees_credit_share
    effect: parameter
    decides: recent_credit_pct
    bindings:
    - rewards_level
    - deliveries_3m
    - recent_credit_pct
    ladder:
    - when: >-
        an active Kestrel Care Rewards Gold or Platinum member and busy_deliveries_3m or more deliveries completed on the
        plan in the 3 months up to the switch date
      value: K('full_credit_pct')
    - when: >-
        an active Kestrel Care Rewards Member or Silver member and busy_deliveries_3m or more such deliveries
      value: K('partial_credit_pct')
    - when: otherwise
      value: K('standard_credit_pct')
    baseline:
      recent_credit_pct: K('standard_credit_pct')
    evidence:
    - cross_category
    - history
    cross_difficulty: null
  - id: medicare_member_credit
    effect: parameter
    decides: medicare_credit
    bindings:
    - insurance_class
    - medicare_credit
    ladder:
    - when: >-
        the patient's primary insurance record in active status is a Medicare Advantage Prescription Drug Plan
      value: K('advantage_credit_usd')
    - when: >-
        the patient's primary insurance record in active status is a Medicare Part D Standard Plan or Medicare Part D Enhanced
        Plan
      value: K('part_d_credit_usd')
    - when: otherwise (any other primary insurance record in active status, or none)
      value: '0.00'
    baseline:
      medicare_credit: '0.0'
    evidence:
    - cross_category
    cross_difficulty: coverage
  - id: maintenance_delivery_credit
    effect: parameter
    decides: maintenance_credit
    bindings:
    - refills_6m
    - home_delivery_pickups
    - maintenance_credit
    ladder:
    - when: >-
        maintenance_high_refills or more refills dispensed and maintenance_high_pickups or more pickups released by home
        delivery in the 6 months up to the switch date
      value: K('maintenance_high_credit_usd')
    - when: >-
        at least maintenance_low_refills refills and at least maintenance_low_pickups home-delivery pickup in those 6 months,
        short of the higher tier
      value: K('maintenance_low_credit_usd')
    - when: otherwise
      value: '0.00'
    baseline:
      maintenance_credit: '0.0'
    evidence:
    - cross_category
    - history
    cross_difficulty: rx
  - id: missed_delivery_credit
    effect: parameter
    decides: missed_credit
    bindings:
    - failed_attempts_3m
    - missed_credit
    ladder:
    - when: missed_high_count or more failed delivery attempts on the plan in the 3 months up to the switch date
      value: K('missed_high_credit_usd')
    - when: >-
        at least missed_low_count but fewer than missed_high_count failed delivery attempts in those 3 months
      value: K('missed_low_credit_usd')
    - when: otherwise
      value: '0.00'
    baseline:
      missed_credit: '0.0'
    evidence:
    - history
    cross_difficulty: null
  - id: delivery_spend_credit
    effect: parameter
    decides: spend_credit
    bindings:
    - spend_3m
    - spend_credit
    ladder:
    - when: >-
        the orders placed on the plan in the 3 months up to the switch date, cancelled orders included, total spend_high_usd
        or more
      value: K('spend_high_credit_usd')
    - when: they total at least spend_low_usd but below spend_high_usd
      value: K('spend_low_credit_usd')
    - when: otherwise
      value: '0.00'
    baseline:
      spend_credit: '0.0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: >-
      The switch into the Kestrel Delivery Pass Annual is charged the annual switch price, annual_switch_price_usd, less
      a recent-fees credit of standard_credit_pct percent of the order fees charged on the plan in the month up to the switch
      date net of the refunds booked on the plan in that month, that net amount never below zero, rounded to the cent.
    params:
    - annual_switch_price_usd
    - standard_credit_pct
  inputs:
    history:
    - table: delivery_charges
      aggregate: sum
      field: amount_usd
      within_months: 1
      filters:
        event_type: delivery_order_fee_charged
    - table: delivery_charges
      aggregate: sum
      field: amount_usd
      within_months: 1
      filters:
        event_type: delivery_fee_refunded
    - table: delivery_orders
      aggregate: count
      field: order_id
      within_months: 3
      filters:
        event_type: delivery_completed
    - table: delivery_orders
      aggregate: count
      field: order_id
      within_months: 3
      filters:
        event_type: delivery_attempt_failed
    - table: delivery_orders
      aggregate: sum
      field: order_value_usd
      within_months: 3
      filters:
        event_type: delivery_order_placed
    - category: rx
      table: rx_fills
      aggregate: count
      field: fill_id
      within_months: 6
      filters:
        event_type: rx_refill
    - category: rx
      table: rx_fills
      aggregate: count
      field: fill_id
      within_months: 6
      filters:
        event_type: rx_pickup
        pickup_channel: home_delivery
    cross_category:
    - coverage
    - rewards
    - rx
