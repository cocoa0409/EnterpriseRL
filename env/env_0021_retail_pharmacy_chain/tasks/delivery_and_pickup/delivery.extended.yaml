category: delivery
display_name: Delivery & Pickup Services

binding:
  holding_table: delivery_plans
  event_tables: [delivery_orders, delivery_charges]
  status_field: status
  variant_field: variant_name
  quantity_fields: {fees_net_usd: delivery_fees}

lifecycle:
  states: [enrolled, active, past_due, cancelled]
  transitions:
    - {from: enrolled, to: active, by: system, means: The free trial ends and the first subscription fee is collected, or a plan without a fee is set up.}
    - {from: enrolled, to: cancelled, by: user, means: The patient cancels during the free trial.}
    - {from: active, to: past_due, by: system, means: A subscription fee could not be collected.}
    - {from: past_due, to: active, by: system, means: The overdue subscription fee is collected within the grace period.}
    - {from: past_due, to: cancelled, by: system, means: The grace period ends with the fee still unpaid.}
    - {from: active, to: cancelled, by: user, means: The patient cancels the plan.}

accounts:
  - key: delivery_fees
    unit: USD
    meaning: Delivery subscription and order fees the patient has paid net of refunds; credited when a fee is charged, debited when a fee is refunded.

parameter_schema:
  subscription_fee_usd: Fee charged per billing cycle, USD; 0.00 for plans without a subscription.
  billing_cycle_months: Calendar months in one billing cycle, integer months; 0 for plans without a subscription.
  trial_days: Calendar days of free trial from enrollment before the first subscription fee, integer days.
  standard_mail_available: Whether orders may be sent by standard mail from the central-fill facility, boolean.
  mail_fee_usd: Fee per standard mail order, USD.
  mail_transit_business_days: Business days from dispatch within which a standard mail order is promised, integer business days.
  same_day_available: Whether same-day courier delivery is offered, boolean.
  same_day_fee_usd: Fee per same-day order, USD.
  same_day_order_cutoff_time: Store local time by which a same-day order must be placed, HH:MM or none.
  free_same_day_min_order_usd: Order value at or above which the same-day fee is waived, USD; 0.00 when the fee never depends on order value.
  same_day_window_minutes: Length of the promised same-day delivery window, integer minutes.
  express_1hr_available: Whether one-hour express delivery is offered, boolean.
  express_1hr_fee_usd: Fee per express order beyond the free express orders, USD.
  express_window_minutes: Minutes from order placement within which an express order is promised, integer minutes.
  free_express_per_month: Express orders per calendar month with the express fee waived, integer.
  delivery_radius_miles: Road distance from the fulfilling store within which courier delivery carries no distance fee, miles.
  extended_radius_miles: Largest road distance from the fulfilling store to which courier delivery is made, miles.
  extended_radius_fee_usd: Fee per courier order beyond delivery_radius_miles up to extended_radius_miles, USD.
  delivery_days_per_week: Days per week on which deliveries are made, integer.
  sunday_delivery_available: Whether deliveries are made on Sundays, boolean.
  scheduled_delivery_max_days_ahead: Most calendar days ahead a delivery date may be scheduled, integer days.
  max_same_day_orders_per_day: Most same-day and express orders per patient per calendar day, integer.
  fulfillment_carrier: Who carries the orders, enum third_party_courier | national_carrier | kestrel_specialty_courier.
  max_delivery_attempts: Delivery attempts made before an order is returned to the store, integer.
  redelivery_fee_usd: Fee for each redelivery after a failed attempt, USD.
  redelivery_window_days: Calendar days after a failed attempt within which a redelivery may be scheduled, integer days.
  returned_order_hold_days: Calendar days a returned order waits at the store for pickup, integer days.
  signature_required_default: Whether every order needs a signature on handover, boolean.
  signature_required_order_value_usd: Order value at or above which a signature is needed, USD; 0.00 when signature_required_default governs alone.
  controlled_substance_delivery_allowed: Whether orders may carry controlled-substance prescriptions, boolean.
  id_check_on_controlled_delivery: Whether the recipient's photo ID is checked when an order carries a controlled substance, boolean.
  cold_chain_supported: Whether temperature-controlled items may be carried, boolean.
  contactless_drop_allowed: Whether an order needing no signature may be left at the door, boolean.
  front_store_items_included: Whether non-prescription store items may be added to an order, boolean.
  late_credit_applies: Whether a late order earns a refund of its fees, boolean.
  late_threshold_minutes: Minutes after the promised window end after which an order is late, integer minutes.
  late_delivery_refund_pct: Percent of the order's fees refunded when it is late, integer percent.
  late_credit_max_per_cycle: Most late refunds per billing cycle, or per calendar month for plans without a subscription, integer.
  lost_package_claim_window_days: Calendar days from the scheduled delivery date within which a missing order may be claimed, integer days.
  lost_package_trace_business_days: Business days the carrier trace runs before a missing order is declared lost, integer business days.
  order_cancel_refund_before_dispatch: Whether an order cancelled before dispatch has its fees refunded in full, boolean.
  full_refund_window_days: Calendar days after a subscription fee is charged within which cancelling refunds it in full, integer days.
  prorated_refund_after_window: Whether cancelling after the full-refund window refunds the unused whole months, boolean.
  cancellation_effective_timing: When a patient's cancellation takes effect, enum immediate | end_of_cycle.
  plan_switch_allowed: Whether the patient may switch to another delivery plan without cancelling, boolean.
  min_age_years: Minimum age in whole years of the enrolling patient on the enrollment date, integer years.
  past_due_grace_days: Calendar days after a failed subscription charge before an unpaid plan lapses, integer days.
  benefits_suspended_when_past_due: Whether plan prices stop applying while the plan is past due, boolean.

