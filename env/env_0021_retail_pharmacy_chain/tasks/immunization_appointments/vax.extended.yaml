events:
  - type: vax_course_opened
    target: vax_courses
    mutation: create
    meaning: A vaccination course is opened for the patient, for one vaccine and, where seasonal, one season.
    grain: one row per course
    fields:
      course_id: id of the course
      customer_id: the patient
      variant_name: the vaccination
      status: scheduled
      season_label: season as YYYY-YYYY for seasonal vaccines, empty otherwise
      doses_required: valid doses needed to complete the course
      doses_remaining: equal to doses_required at opening
      immunocompromised: whether the patient attests being immunocompromised
      risk_condition_attested: whether the patient attests a qualifying risk condition
      billing_route: how doses will be paid
      coverage_id: coverage billed, empty for cash or Vaccines for Children
      store_id: store where the course is given
      opened_date: date opened
    account: doses
    direction: in
    triggers: []
  - type: vax_series_started
    target: vax_courses
    mutation: {transition: {from: scheduled, to: in_progress}}
    meaning: The first dose of a multi-dose series is given.
    grain: one row per transaction
    fields:
      course_id: the course
      status: in_progress
    triggers: []
  - type: vax_course_completed
    target: vax_courses
    mutation: {transition: [{from: scheduled, to: completed}, {from: in_progress, to: completed}]}
    meaning: The last valid dose of the course is given.
    grain: one row per transaction
    fields:
      course_id: the course
      status: completed
      closed_date: date of the completing dose
    triggers: []
  - type: vax_course_reopened
    target: vax_courses
    mutation: {transition: {from: completed, to: in_progress}}
    meaning: The dose that completed the course is found invalid, so the course needs a repeat dose.
    grain: one row per transaction
    fields:
      course_id: the course
      status: in_progress
      closed_date: cleared
    triggers: []
  - type: vax_course_cancelled
    target: vax_courses
    mutation: {transition: [{from: scheduled, to: cancelled}, {from: in_progress, to: cancelled}]}
    meaning: The patient stops the course.
    grain: one row per transaction
    fields:
      course_id: the course
      status: cancelled
      closed_date: date cancelled
    triggers: []
  - type: vax_course_billing_updated
    target: vax_courses
    mutation: update
    meaning: How the course's remaining doses will be paid is changed.
    grain: one row per transaction
    fields:
      course_id: the course
      billing_route: new billing route
      coverage_id: coverage now billed, empty for cash or Vaccines for Children
    triggers: []
  - type: vax_appointment_booked
    target: vax_events
    meaning: A vaccination appointment is booked for one dose of the course.
    grain: one row per appointment booked
    distinguish_by: [appointment_date, appointment_time, dose_number]
    fields:
      vax_event_id: id of this appointment
      course_id: the course
      customer_id: the patient
      event_date: date the booking was made
      appointment_date: date of the appointment
      appointment_time: start time of the slot
      store_id: store of the appointment
      dose_number: dose the appointment is for
      booking_channel: online, phone, walk_in or auto_booked
    triggers: []
  - type: vax_appointment_cancelled
    target: vax_events
    meaning: A booked appointment is cancelled before the cutoff.
    grain: one row per appointment cancelled
    distinguish_by: [source_event_id]
    fields:
      vax_event_id: id of this cancellation
      course_id: the course
      customer_id: the patient
      event_date: date cancelled
      source_event_id: the appointment cancelled
      cancel_reason: why it was cancelled
    triggers: []
  - type: vax_appointment_no_show
    target: vax_events
    meaning: The patient missed a booked appointment or cancelled it after the cutoff.
    grain: one row per appointment missed
    distinguish_by: [source_event_id]
    fields:
      vax_event_id: id of this no-show
      course_id: the course
      customer_id: the patient
      event_date: date of the missed appointment
      source_event_id: the appointment missed
    triggers: []
  - type: vax_consent_signed
    target: vax_events
    meaning: The patient, or their parent or guardian, signs the screening and consent form for a dose.
    grain: one row per consent form signed
    distinguish_by: [dose_number, event_date]
    fields:
      vax_event_id: id of this consent
      course_id: the course
      customer_id: the patient
      event_date: date signed
      dose_number: dose the consent covers
      signed_by: patient or guardian
    triggers: []
  - type: vax_dose_administered
    target: vax_events
    meaning: A pharmacist gives one dose of the vaccine.
    grain: one row per dose given
    distinguish_by: [dose_number, event_date]
    fields:
      vax_event_id: id of this dose
      course_id: the course
      customer_id: the patient
      event_date: date given
      dose_number: dose given
      is_final_dose: whether this dose completes the course
      lot_number: vaccine lot number
      store_id: store where given
      source_event_id: the appointment, empty for a walk-in
      billing_route: how the dose was paid
      coverage_id: coverage billed, empty for cash or Vaccines for Children
      patient_pay_usd: amount the patient paid
      observation_minutes: minutes the patient was observed
      auto_book_next: true when the vaccination's second_dose_auto_book is true and this dose is not final
    account: doses
    direction: out
    triggers:
      - event: vax:vax_series_started
        when: {dose_number: 1, is_final_dose: false}
        map: {course_id: course_id}
      - event: vax:vax_course_completed
        when: {is_final_dose: true}
        map: {course_id: course_id, closed_date: event_date}
      - event: vax:vax_appointment_booked
        when: {auto_book_next: true}
        map: {course_id: course_id, customer_id: customer_id, event_date: event_date, store_id: store_id, booking_channel: auto_booked}
  - type: vax_dose_invalidated
    target: vax_events
    meaning: A dose already given is found not to count, because it came too early or the patient was below the minimum age.
    grain: one row per dose invalidated
    distinguish_by: [source_event_id]
    fields:
      vax_event_id: id of this invalidation
      course_id: the course
      customer_id: the patient
      event_date: date found
      source_event_id: the dose invalidated
      invalid_reason: why the dose does not count
      is_final_dose: whether the invalidated dose had completed the course
    account: doses
    direction: in
    triggers:
      - event: vax:vax_course_reopened
        when: {is_final_dose: true}
        map: {course_id: course_id}
  - type: vax_registry_reported
    target: vax_events
    meaning: A dose given at Kestrel is reported to the state immunization registry.
    grain: one row per dose reported
    distinguish_by: [source_event_id]
    fields:
      vax_event_id: id of this report
      course_id: the course
      customer_id: the patient
      event_date: date reported
      source_event_id: the dose reported
    triggers: []

measures:
  - id: vax_msr_no_shows_365d
    window: rolling 365 calendar days ending on today, inclusive
    measure: count of vax_appointment_no_show rows across all of the patient's courses with event_date in the window
  - id: vax_msr_doses_same_visit
    window: the calendar day of the dose
    measure: count of vax_dose_administered rows across all of the patient's courses with event_date equal to that day
  - id: vax_msr_open_appointments
    window: all history of the course
    measure: count of vax_appointment_booked rows on the course whose vax_event_id is not the source_event_id of any vax_appointment_cancelled, vax_appointment_no_show or vax_dose_administered row

policies:
  - id: vax_agg_multi_holding
    subject: [vax_course_opened]
    rule: >-
      A patient may hold any number of vaccination courses, one per vaccine and, for seasonal vaccines, one per season.
      A second course of the same vaccination is opened only when no course of it is in scheduled or in_progress status,
      and for a seasonal vaccine only when no course of it exists for the same season_label.
    eligibility: []
    params:
      max_per_customer: null
  - id: vax_agg_visit_and_season
    subject: [vax_course_opened, vax_dose_administered]
    rule: >-
      The two influenza vaccinations are one choice per season: a patient never holds a Seasonal Influenza Standard-Dose
      Vaccination course and a Seasonal Influenza High-Dose Vaccination course for the same season_label, and a patient
      aged 65 or older is offered the high-dose course, the standard-dose course being given only as its listed
      substitute when high-dose stock is out. Several vaccines may be given at one visit where each one's
      coadministration_allowed is true, but no more than max_vaccines_per_visit doses per patient per day, measured by
      vax_msr_doses_same_visit; further doses are booked for another day.
    eligibility: []
    params:
      max_vaccines_per_visit: 4
    measures: [vax_msr_doses_same_visit]
  - id: vax_course_eligibility
    subject: [vax_course_opened]
    rule: >-
      A course is opened only for a patient whose age in whole years on the planned first-dose date is at least
      min_age_years and no more than max_age_years. Below risk_condition_required_below_age a course is opened only when
      the patient attests a qualifying risk condition, recorded as risk_condition_attested true; Kestrel records the
      attestation and never asks for medical records. Below guardian_consent_under_age the course is opened only with a
      parent or legal guardian present to sign the consent. Where repeat_course_allowed is false a course is not opened
      when the patient has a completed course of the same vaccination, at Kestrel or documented by another provider where
      outside_record_accepted is true. Where min_days_since_previous_course is above 0 the course is opened only when
      that many days have passed since the last dose of the previous course. A seasonal course is opened only between
      season_start_mmdd and season_end_mmdd of its season. The course's doses_required is doses_in_series, plus one for a
      child aged no more than pediatric_second_dose_max_age_years with fewer than two lifetime influenza doses, plus one
      for an immunocompromised patient where immunocompromised_extra_dose_allowed is true.
    eligibility:
      - id: risk_condition_attested
        applies_to: [vax_course_opened]
        kind: caller_fact
        condition: Below risk_condition_required_below_age a course is opened only when the patient attests a qualifying risk condition, recorded as risk_condition_attested true; Kestrel records the attestation and never asks for medical records.
        evidence_fields: [vax_courses.risk_condition_attested, vax_courses.customer_id, customers.date_of_birth]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys:
            - [vax_courses.customer_id]
          action_bindings:
            vax_courses.customer_id: customer_id
    params:
      per_tier:
        Seasonal Influenza Standard-Dose Vaccination: {min_age_years: =min_age_years, max_age_years: =max_age_years, risk_condition_required_below_age: =risk_condition_required_below_age, guardian_consent_under_age: =guardian_consent_under_age, repeat_course_allowed: =repeat_course_allowed, min_days_since_previous_course: =min_days_since_previous_course, doses_in_series: =doses_in_series, pediatric_second_dose_max_age_years: =pediatric_second_dose_max_age_years, immunocompromised_extra_dose_allowed: =immunocompromised_extra_dose_allowed, seasonal: =seasonal, season_start_mmdd: =season_start_mmdd, season_end_mmdd: =season_end_mmdd, outside_record_accepted: =outside_record_accepted}
        Seasonal Influenza High-Dose Vaccination: {min_age_years: =min_age_years, max_age_years: =max_age_years, risk_condition_required_below_age: =risk_condition_required_below_age, guardian_consent_under_age: =guardian_consent_under_age, repeat_course_allowed: =repeat_course_allowed, min_days_since_previous_course: =min_days_since_previous_course, doses_in_series: =doses_in_series, pediatric_second_dose_max_age_years: =pediatric_second_dose_max_age_years, immunocompromised_extra_dose_allowed: =immunocompromised_extra_dose_allowed, seasonal: =seasonal, season_start_mmdd: =season_start_mmdd, season_end_mmdd: =season_end_mmdd, outside_record_accepted: =outside_record_accepted}
        COVID-19 Updated Vaccination: {min_age_years: =min_age_years, max_age_years: =max_age_years, risk_condition_required_below_age: =risk_condition_required_below_age, guardian_consent_under_age: =guardian_consent_under_age, repeat_course_allowed: =repeat_course_allowed, min_days_since_previous_course: =min_days_since_previous_course, doses_in_series: =doses_in_series, pediatric_second_dose_max_age_years: =pediatric_second_dose_max_age_years, immunocompromised_extra_dose_allowed: =immunocompromised_extra_dose_allowed, seasonal: =seasonal, season_start_mmdd: =season_start_mmdd, season_end_mmdd: =season_end_mmdd, outside_record_accepted: =outside_record_accepted}
        RSV Older Adult Vaccination: {min_age_years: =min_age_years, max_age_years: =max_age_years, risk_condition_required_below_age: =risk_condition_required_below_age, guardian_consent_under_age: =guardian_consent_under_age, repeat_course_allowed: =repeat_course_allowed, min_days_since_previous_course: =min_days_since_previous_course, doses_in_series: =doses_in_series, pediatric_second_dose_max_age_years: =pediatric_second_dose_max_age_years, immunocompromised_extra_dose_allowed: =immunocompromised_extra_dose_allowed, seasonal: =seasonal, season_start_mmdd: =season_start_mmdd, season_end_mmdd: =season_end_mmdd, outside_record_accepted: =outside_record_accepted}
        Pneumococcal Conjugate Vaccination: {min_age_years: =min_age_years, max_age_years: =max_age_years, risk_condition_required_below_age: =risk_condition_required_below_age, guardian_consent_under_age: =guardian_consent_under_age, repeat_course_allowed: =repeat_course_allowed, min_days_since_previous_course: =min_days_since_previous_course, doses_in_series: =doses_in_series, pediatric_second_dose_max_age_years: =pediatric_second_dose_max_age_years, immunocompromised_extra_dose_allowed: =immunocompromised_extra_dose_allowed, seasonal: =seasonal, season_start_mmdd: =season_start_mmdd, season_end_mmdd: =season_end_mmdd, outside_record_accepted: =outside_record_accepted}
        Recombinant Zoster Two-Dose Series: {min_age_years: =min_age_years, max_age_years: =max_age_years, risk_condition_required_below_age: =risk_condition_required_below_age, guardian_consent_under_age: =guardian_consent_under_age, repeat_course_allowed: =repeat_course_allowed, min_days_since_previous_course: =min_days_since_previous_course, doses_in_series: =doses_in_series, pediatric_second_dose_max_age_years: =pediatric_second_dose_max_age_years, immunocompromised_extra_dose_allowed: =immunocompromised_extra_dose_allowed, seasonal: =seasonal, season_start_mmdd: =season_start_mmdd, season_end_mmdd: =season_end_mmdd, outside_record_accepted: =outside_record_accepted}
        Hepatitis B Three-Dose Series: {min_age_years: =min_age_years, max_age_years: =max_age_years, risk_condition_required_below_age: =risk_condition_required_below_age, guardian_consent_under_age: =guardian_consent_under_age, repeat_course_allowed: =repeat_course_allowed, min_days_since_previous_course: =min_days_since_previous_course, doses_in_series: =doses_in_series, pediatric_second_dose_max_age_years: =pediatric_second_dose_max_age_years, immunocompromised_extra_dose_allowed: =immunocompromised_extra_dose_allowed, seasonal: =seasonal, season_start_mmdd: =season_start_mmdd, season_end_mmdd: =season_end_mmdd, outside_record_accepted: =outside_record_accepted}
  - id: vax_evt_booking
    subject: [vax_appointment_booked]
    rule: >-
      An appointment is booked only on a course in scheduled or in_progress status. A course has no more than
      max_open_appointments_per_course open appointments, counted by vax_msr_open_appointments; a patient who wants a
      different time has the open appointment cancelled first. The appointment date is no more than
      booking_window_days_ahead days after today, a same-day slot is bookable only until same_day_booking_cutoff_minutes
      before it starts, and slots start on the store's appointment_slot_minutes grid. For a later dose the appointment
      date is no earlier than the earliest valid date for that dose under vax_evt_dose_administration. Where
      second_dose_auto_book is true the next dose is booked automatically when a series dose is given, on the date of
      that dose plus dose_auto_book_offset_days, at the same store and time, with booking_channel auto_booked. A walk-in
      dose needs no booking where walk_in_allowed is true and the patient is at least appointment_required_under_age.
      When vax_msr_no_shows_365d has reached no_show_limit_365_days, online and phone booking is closed to the patient
      for online_booking_suspension_days from the latest no-show and only walk-in doses may be given.
    eligibility:
      - id: book_on_open_course
        applies_to: [vax_appointment_booked]
        kind: state
        condition: An appointment is booked only on a course in scheduled or in_progress status.
        evidence_fields: [vax_courses.status, vax_courses.course_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [vax_courses.course_id]
          action_bindings:
            vax_courses.course_id: course_id
        state_contract:
          field: vax_courses.status
          allowed: [scheduled, in_progress]
      - id: one_open_appointment
        applies_to: [vax_appointment_booked]
        kind: dedup
        condition: A course has no more than max_open_appointments_per_course open appointments, counted by vax_msr_open_appointments; a patient who wants a different time has the open appointment cancelled first.
        evidence_fields: [vax_events.course_id, vax_events.event_type, vax_events.source_event_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [vax_events.course_id]
          action_bindings:
            vax_events.course_id: course_id
        dedup_contract:
          table: vax_events
          mode: separate_record
          object_bindings: {course_id: course_id}
          duplicate_filters: {event_type: [vax_appointment_booked]}
          distinct_fields: [appointment_date, appointment_time, dose_number]
    params:
      per_tier:
        Seasonal Influenza Standard-Dose Vaccination: {walk_in_allowed: =walk_in_allowed, appointment_required_under_age: =appointment_required_under_age, booking_window_days_ahead: =booking_window_days_ahead, second_dose_auto_book: =second_dose_auto_book, dose_auto_book_offset_days: =dose_auto_book_offset_days, max_open_appointments_per_course: =max_open_appointments_per_course, no_show_limit_365_days: =no_show_limit_365_days, online_booking_suspension_days: =online_booking_suspension_days, appointment_slot_minutes: =appointment_slot_minutes, same_day_booking_cutoff_minutes: =same_day_booking_cutoff_minutes}
        Seasonal Influenza High-Dose Vaccination: {walk_in_allowed: =walk_in_allowed, appointment_required_under_age: =appointment_required_under_age, booking_window_days_ahead: =booking_window_days_ahead, second_dose_auto_book: =second_dose_auto_book, dose_auto_book_offset_days: =dose_auto_book_offset_days, max_open_appointments_per_course: =max_open_appointments_per_course, no_show_limit_365_days: =no_show_limit_365_days, online_booking_suspension_days: =online_booking_suspension_days, appointment_slot_minutes: =appointment_slot_minutes, same_day_booking_cutoff_minutes: =same_day_booking_cutoff_minutes}
        COVID-19 Updated Vaccination: {walk_in_allowed: =walk_in_allowed, appointment_required_under_age: =appointment_required_under_age, booking_window_days_ahead: =booking_window_days_ahead, second_dose_auto_book: =second_dose_auto_book, dose_auto_book_offset_days: =dose_auto_book_offset_days, max_open_appointments_per_course: =max_open_appointments_per_course, no_show_limit_365_days: =no_show_limit_365_days, online_booking_suspension_days: =online_booking_suspension_days, appointment_slot_minutes: =appointment_slot_minutes, same_day_booking_cutoff_minutes: =same_day_booking_cutoff_minutes}
        RSV Older Adult Vaccination: {walk_in_allowed: =walk_in_allowed, appointment_required_under_age: =appointment_required_under_age, booking_window_days_ahead: =booking_window_days_ahead, second_dose_auto_book: =second_dose_auto_book, dose_auto_book_offset_days: =dose_auto_book_offset_days, max_open_appointments_per_course: =max_open_appointments_per_course, no_show_limit_365_days: =no_show_limit_365_days, online_booking_suspension_days: =online_booking_suspension_days, appointment_slot_minutes: =appointment_slot_minutes, same_day_booking_cutoff_minutes: =same_day_booking_cutoff_minutes}
        Pneumococcal Conjugate Vaccination: {walk_in_allowed: =walk_in_allowed, appointment_required_under_age: =appointment_required_under_age, booking_window_days_ahead: =booking_window_days_ahead, second_dose_auto_book: =second_dose_auto_book, dose_auto_book_offset_days: =dose_auto_book_offset_days, max_open_appointments_per_course: =max_open_appointments_per_course, no_show_limit_365_days: =no_show_limit_365_days, online_booking_suspension_days: =online_booking_suspension_days, appointment_slot_minutes: =appointment_slot_minutes, same_day_booking_cutoff_minutes: =same_day_booking_cutoff_minutes}
        Recombinant Zoster Two-Dose Series: {walk_in_allowed: =walk_in_allowed, appointment_required_under_age: =appointment_required_under_age, booking_window_days_ahead: =booking_window_days_ahead, second_dose_auto_book: =second_dose_auto_book, dose_auto_book_offset_days: =dose_auto_book_offset_days, max_open_appointments_per_course: =max_open_appointments_per_course, no_show_limit_365_days: =no_show_limit_365_days, online_booking_suspension_days: =online_booking_suspension_days, appointment_slot_minutes: =appointment_slot_minutes, same_day_booking_cutoff_minutes: =same_day_booking_cutoff_minutes}
        Hepatitis B Three-Dose Series: {walk_in_allowed: =walk_in_allowed, appointment_required_under_age: =appointment_required_under_age, booking_window_days_ahead: =booking_window_days_ahead, second_dose_auto_book: =second_dose_auto_book, dose_auto_book_offset_days: =dose_auto_book_offset_days, max_open_appointments_per_course: =max_open_appointments_per_course, no_show_limit_365_days: =no_show_limit_365_days, online_booking_suspension_days: =online_booking_suspension_days, appointment_slot_minutes: =appointment_slot_minutes, same_day_booking_cutoff_minutes: =same_day_booking_cutoff_minutes}
    measures: [vax_msr_no_shows_365d, vax_msr_open_appointments]
  - id: vax_evt_cancellation_no_show
    subject: [vax_appointment_cancelled, vax_appointment_no_show]
    rule: >-
      An appointment is cancelled with no consequence when the cancellation is made at least cancellation_cutoff_hours
      before the appointment time. Where late_cancellation_counts_as_no_show is true, a cancellation made later is
      recorded as a no-show instead of a cancellation. A patient not arrived late_arrival_grace_minutes after the
      appointment time is recorded as a no-show. Each appointment ends at most once, by a cancellation, a no-show or a
      dose. Kestrel charges no fee for a cancellation or a no-show; the only consequence is the booking suspension under
      vax_evt_booking.
    eligibility:
      - id: one_outcome_per_appointment
        applies_to: [vax_appointment_cancelled, vax_appointment_no_show]
        kind: dedup
        condition: Each appointment ends at most once, by a cancellation, a no-show or a dose.
        evidence_fields: [vax_events.source_event_id, vax_events.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [vax_events.source_event_id]
          action_bindings:
            vax_events.source_event_id: source_event_id
        dedup_contract:
          table: vax_events
          mode: separate_record
          object_bindings: {source_event_id: source_event_id}
          duplicate_filters: {event_type: [vax_appointment_cancelled, vax_appointment_no_show, vax_dose_administered]}
          distinct_fields: []
    params:
      per_tier:
        Seasonal Influenza Standard-Dose Vaccination: {cancellation_cutoff_hours: =cancellation_cutoff_hours, late_cancellation_counts_as_no_show: =late_cancellation_counts_as_no_show, late_arrival_grace_minutes: =late_arrival_grace_minutes}
        Seasonal Influenza High-Dose Vaccination: {cancellation_cutoff_hours: =cancellation_cutoff_hours, late_cancellation_counts_as_no_show: =late_cancellation_counts_as_no_show, late_arrival_grace_minutes: =late_arrival_grace_minutes}
        COVID-19 Updated Vaccination: {cancellation_cutoff_hours: =cancellation_cutoff_hours, late_cancellation_counts_as_no_show: =late_cancellation_counts_as_no_show, late_arrival_grace_minutes: =late_arrival_grace_minutes}
        RSV Older Adult Vaccination: {cancellation_cutoff_hours: =cancellation_cutoff_hours, late_cancellation_counts_as_no_show: =late_cancellation_counts_as_no_show, late_arrival_grace_minutes: =late_arrival_grace_minutes}
        Pneumococcal Conjugate Vaccination: {cancellation_cutoff_hours: =cancellation_cutoff_hours, late_cancellation_counts_as_no_show: =late_cancellation_counts_as_no_show, late_arrival_grace_minutes: =late_arrival_grace_minutes}
        Recombinant Zoster Two-Dose Series: {cancellation_cutoff_hours: =cancellation_cutoff_hours, late_cancellation_counts_as_no_show: =late_cancellation_counts_as_no_show, late_arrival_grace_minutes: =late_arrival_grace_minutes}
        Hepatitis B Three-Dose Series: {cancellation_cutoff_hours: =cancellation_cutoff_hours, late_cancellation_counts_as_no_show: =late_cancellation_counts_as_no_show, late_arrival_grace_minutes: =late_arrival_grace_minutes}
  - id: vax_evt_dose_administration
    subject: [vax_dose_administered, vax_consent_signed]
    rule: >-
      A dose is given only on a course in scheduled or in_progress status. A dose is given only when a screening and
      consent form for that dose was signed no more than the consent validity days before, counted in calendar days
      with the signing date as day 0; the form is signed by the patient, or below guardian_consent_under_age by a parent
      or guardian, and never by Kestrel staff for them. Dose 2 is given no earlier than the date of dose 1 plus the dose 2
      minimum interval less the grace period days, counted in calendar days with the dose 1 date as day 0, using
      immunocompromised_dose2_min_interval_days in place of dose2_min_interval_days where the course records the patient
      as immunocompromised and that value is above 0. Dose 3 is given no earlier than both the date of dose 2 plus
      dose3_min_interval_days_from_dose2 and the date of dose 1 plus dose3_min_interval_days_from_dose1, each less
      grace_period_days. A pediatric second influenza dose follows pediatric_second_dose_interval_days the same way. A
      dose later than dose2_recommended_max_interval_days is still valid and, where series_restart_on_delay is false, the
      series is never restarted. An additional dose for an immunocompromised patient, where
      immunocompromised_extra_dose_allowed is true, is given no earlier than extra_dose_min_interval_days after the
      previous dose less grace_period_days. The patient is observed for observation_minutes, or extended_observation_minutes when
      they report a history of severe allergic reaction, and the minutes are recorded with the dose. The dose that brings
      the course's valid doses to doses_required is recorded as is_final_dose true.
    eligibility:
      - id: dose_on_open_course
        applies_to: [vax_dose_administered, vax_consent_signed]
        kind: state
        condition: A dose is given only on a course in scheduled or in_progress status.
        evidence_fields: [vax_courses.status, vax_courses.course_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [vax_courses.course_id]
          action_bindings:
            vax_courses.course_id: course_id
        state_contract:
          field: vax_courses.status
          allowed: [scheduled, in_progress]
      - id: consent_current
        applies_to: [vax_dose_administered]
        kind: time
        condition: A dose is given only when a screening and consent form for that dose was signed no more than the consent validity days before, counted in calendar days with the signing date as day 0; the form is signed by the patient, or below guardian_consent_under_age by a parent or guardian, and never by Kestrel staff for them.
        evidence_fields: [vax_events.event_date, vax_events.course_id, vax_events.dose_number]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [vax_events.course_id, vax_events.dose_number]
          action_bindings:
            vax_events.course_id: course_id
            vax_events.dose_number: dose_number
        temporal_basis:
          clock: frozen_time
          anchor_event: a screening and consent form for that dose was signed
          anchor_source: vax_events.event_date
          relation: not_after
          duration_source: params.consent_validity_days
          unit: calendar_days
          counting_rule: counted in calendar days with the signing date as day 0
          boundary: inclusive
      - id: dose2_interval
        applies_to: [vax_dose_administered]
        kind: time
        condition: Dose 2 is given no earlier than the date of dose 1 plus the dose 2 minimum interval less the grace period days, counted in calendar days with the dose 1 date as day 0, using immunocompromised_dose2_min_interval_days in place of dose2_min_interval_days where the course records the patient as immunocompromised and that value is above 0.
        evidence_fields: [vax_events.event_date, vax_events.course_id, vax_courses.immunocompromised]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [vax_events.course_id]
          action_bindings:
            vax_events.course_id: course_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the date of dose 1
          anchor_source: vax_events.event_date
          relation: not_before
          duration_source: params.dose2_min_interval_days
          unit: calendar_days
          counting_rule: counted in calendar days with the dose 1 date as day 0
