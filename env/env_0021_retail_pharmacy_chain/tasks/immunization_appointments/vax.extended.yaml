  - id: vax_ext_series_dose_booking
    base_policy_refs:
    - vax_evt_booking
    - vax_evt_dose_administration
    - vax_evt_invalid_dose
    overwrite:
    - base_policy: vax_evt_invalid_dose
      superseded_clause: which is given no earlier than the invalid dose's date plus the same minimum interval
      replaced_by: 'Where the series history carries an invalidation entry for a dose given too early and the latest
        dose came after dose 1, the next dose repeats the invalid dose: it is given no earlier than the invalid dose''s
        date plus the full minimum interval that separates the invalid dose from the dose before it, with no grace
        period, and a repeated dose 3 is also given no earlier than the date of dose 1 plus the dose 3 minimum interval
        from dose 1 less the grace period days.'
    trigger: on_request
    subject:
    - vax_appointment_booked
    computes: days_ahead
    target_tool: book_series_dose_9b68cabc
    params:
      allowance_two_no_shows: 2
      allowance_one_no_show: 1
      allowance_plan_repeat_rejects: 2
      allowance_plan_one_reject: 1
      allowance_closed_recently: 1
      allowance_closed_long_ago: 2
      allowance_outside_reviewed: 1
      allowance_outside_unreviewed: 3
    rule: 'A phone appointment for the next dose of a series is booked a whole number of calendar days after today,
      on the earliest date that dose may be given plus Kestrel''s scheduling allowance. The earliest date is the date
      of the latest dose on the series history plus the minimum interval to the next dose less the grace period days,
      counted in calendar days with that dose date as day 0; the minimum interval to the next dose is the dose 2 minimum
      interval after dose 1, and after dose 2 or a later dose it is the dose 3 minimum interval from dose 2, with
      dose 3 also no earlier than the date of dose 1 plus the dose 3 minimum interval from dose 1 less the grace period
      days. The days ahead are the earliest date''s distance from today, and where that date is today or already past
      the appointment is booked one day ahead. Where the earliest date lies within the booking window, the appointment
      is never booked more than the booking window days ahead of today; where the earliest date itself lies beyond
      the booking window, no appointment is booked today. The earliest date follows one of three clocks. Where the
      series history carries an invalidation entry for a dose given too early and the latest dose came after dose
      1, the next dose repeats the invalid dose: it is given no earlier than the invalid dose''s date plus the full
      minimum interval that separates the invalid dose from the dose before it, with no grace period, and a repeated
      dose 3 is also given no earlier than the date of dose 1 plus the dose 3 minimum interval from dose 1 less the
      grace period days. Where the series history carries an invalidation entry for a dose given below the minimum
      age, the clock runs from the latest dose''s date with the minimum interval of that dose less the grace period
      days. In every other case the clock is the one set out for the earliest date above. Kestrel''s scheduling allowance
      is made up of four allowances. The missed-visit allowance is allowance_two_no_shows days where the series history
      shows two or more no-shows in the last 12 calendar months, allowance_one_no_show days where it shows exactly
      one no-show in the last 12 calendar months, and nothing where it shows none. The plan-check allowance is allowance_plan_repeat_rejects
      days where the patient''s active insurance plan is not a government program and two or more of the patient''s
      claims were rejected in the last 3 calendar months, allowance_plan_one_reject days where the active plan is
      not a government program and exactly one claim was rejected in the last 3 calendar months, and nothing otherwise.
      The resumed-series allowance is allowance_closed_recently days where the course the series history is on was
      closed 60 days ago or less, allowance_closed_long_ago days where it was closed more than 60 days ago, and nothing
      where it is not closed. The outside-record allowance is allowance_outside_reviewed days where the series history
      carries a dose entry not reported by Kestrel and an invalidation entry, allowance_outside_unreviewed days where
      it carries a dose entry not reported by Kestrel and no invalidation entry, and nothing where every dose entry
      was reported by Kestrel. The allowances combine in one of three ways. Where the course the series history is
      on is closed and holds at least one dose entry, the four allowances are added together. Where that course is
      open and holds at least one dose entry, only the largest of the four applies. Where it holds no dose entry,
      no allowance applies. The combined allowance is added to the days ahead after the one-day-ahead rule and before
      the booking window is applied. An appointment for the next dose of a series is not booked until a screening
      and consent form for that dose stands signed on the open course of the vaccination. Before the days ahead of
      that appointment are fixed, every dose on the series history given sooner than its minimum interval less the
      grace period must carry its invalidation entry.'
    prerequisite:
    - problem: vax_ext_resumed_dose_consent
      kind: state_gate
      gate: vax_events.event_type
      form: state
      policy_source: An appointment for the next dose of a series is not booked until a screening and consent form
        for that dose stands signed on the open course of the vaccination.
      condition: The open course of the vaccination carries a signed screening and consent form entry for the dose
        the appointment is for.
      resolved_by: sign_dose_consent_2c77f168
      effect: Once the signed form for the dose stands on the open course, the appointment for that dose may be booked.
    - problem: vax_ext_dose_invalidation_balance
      kind: value_input
      gate: series_clock_days
      form: state
      policy_source: Before the days ahead of that appointment are fixed, every dose on the series history given sooner
        than its minimum interval less the grace period must carry its invalidation entry.
      condition: Every dose on the series history given sooner than its minimum interval less the grace period carries
        a dose invalidation entry.
      resolved_by: invalidate_series_dose_51b39017
      effect: Once the invalidation entry stands, the clock runs from the invalid dose's date with the full interval
        of the dose it repeats instead of the standard clock, which moves the days ahead.
    cross_category:
    - category: coverage
      as: history
      reads:
      - coverage_plans.variant_name
      - coverage_claims.event_type
      note: The plan-check allowance reads whether the active plan is a government program and counts rejected claims
        in the last 3 months.
    compute:
    - series_first_dose: LATEST('vax_events', 'event_date', event_type='vax_dose_administered', dose_number=1)
    - series_latest_dose: LATEST('vax_events', 'event_date', event_type='vax_dose_administered')
    - series_latest_number: LATEST('vax_events', 'dose_number', event_type='vax_dose_administered')
    - too_early_entries: COUNT('vax_events', event_type='vax_dose_invalidated', invalid_reason='interval_too_short')
    - under_age_entries: COUNT('vax_events', event_type='vax_dose_invalidated', invalid_reason='below_minimum_age')
    - series_clock_days: MX((P('dose2_min_interval_days') if series_latest_number <= 2 else P('dose3_min_interval_days_from_dose2'))
        - DAYS(series_latest_dose, NOW), (P('dose3_min_interval_days_from_dose1') - P('grace_period_days') - DAYS(series_first_dose,
        NOW)) if series_latest_number >= 3 else -9999) if (too_early_entries >= 1 and DAYS(series_first_dose, series_latest_dose)
        > 0) else (((P('dose2_min_interval_days') if series_latest_number <= 2 else P('dose3_min_interval_days_from_dose2'))
        - P('grace_period_days') - DAYS(series_latest_dose, NOW)) if under_age_entries >= 1 else ((P('dose2_min_interval_days')
        - P('grace_period_days') - DAYS(series_latest_dose, NOW)) if series_latest_number <= 1 else MX(P('dose3_min_interval_days_from_dose2')
        - P('grace_period_days') - DAYS(series_latest_dose, NOW), P('dose3_min_interval_days_from_dose1') - P('grace_period_days')
        - DAYS(series_first_dose, NOW))))
    - earliest_days_ahead: MX(1, series_clock_days)
    - no_shows_12m: COUNT('vax_events', within_months=12, event_type='vax_appointment_no_show')
    - missed_visit_allowance: K('allowance_two_no_shows') if no_shows_12m >= 2 else (K('allowance_one_no_show') if
        no_shows_12m == 1 else 0)
    - plan_government: CPARAM('coverage', 'government_program', status='active')
    - plan_rejects_3m: XCOUNT('coverage', 'coverage_claims', within_months=3, event_type='coverage_claim_rejected')
    - plan_check_allowance: K('allowance_plan_repeat_rejects') if (plan_government == False and plan_rejects_3m >=
        2) else (K('allowance_plan_one_reject') if (plan_government == False and plan_rejects_3m == 1) else 0)
    - history_closed_days: DAYS(F('closed_date'), NOW) if F('closed_date') else -1
    - resumed_series_allowance: K('allowance_closed_recently') if (history_closed_days >= 0 and history_closed_days
        <= 60) else (K('allowance_closed_long_ago') if history_closed_days > 60 else 0)
    - history_dose_entries: COUNT('vax_events', event_type='vax_dose_administered')
    - history_reported: COUNT('vax_events', event_type='vax_registry_reported')
    - history_invalidations: COUNT('vax_events', event_type='vax_dose_invalidated')
    - outside_record_allowance: K('allowance_outside_reviewed') if (history_dose_entries - history_reported >= 1 and
        history_invalidations >= 1) else (K('allowance_outside_unreviewed') if (history_dose_entries - history_reported
        >= 1 and history_invalidations == 0) else 0)
    - combine_dose_entries: COUNT('vax_events', event_type='vax_dose_administered')
    - combined_allowance: (missed_visit_allowance + plan_check_allowance + resumed_series_allowance + outside_record_allowance)
        if (history_closed_days >= 0 and combine_dose_entries >= 1) else (MX(missed_visit_allowance, plan_check_allowance,
        resumed_series_allowance, outside_record_allowance) if (history_closed_days < 0 and combine_dose_entries >=
        1) else 0)
    - result: MN(P('booking_window_days_ahead'), earliest_days_ahead + combined_allowance) if earliest_days_ahead
        <= P('booking_window_days_ahead') else earliest_days_ahead
    compute_basis:
      series_first_dose: The earliest date is the date of the latest dose on the series history plus the minimum interval
        to the next dose less the grace period days, counted in calendar days with that dose date as day 0; the minimum
        interval to the next dose is the dose 2 minimum interval after dose 1, and after dose 2 or a later dose it
        is the dose 3 minimum interval from dose 2, with dose 3 also no earlier than the date of dose 1 plus the dose
        3 minimum interval from dose 1 less the grace period days.
      series_latest_dose: The earliest date is the date of the latest dose on the series history plus the minimum
