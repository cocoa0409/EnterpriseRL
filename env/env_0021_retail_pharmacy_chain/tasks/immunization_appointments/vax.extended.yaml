        1 plus the dose 3 minimum interval from dose 1 less the grace period days.
      too_early_entries: 'Where the series history carries an invalidation entry for a dose given too early and the
        latest dose came after dose 1, the next dose repeats the invalid dose: it is given no earlier than the invalid
        dose''s date plus the full minimum interval that separates the invalid dose from the dose before it, with
