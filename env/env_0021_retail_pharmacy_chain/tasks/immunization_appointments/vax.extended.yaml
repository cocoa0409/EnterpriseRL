      baseline:
        positions_held: dose_entries
      evidence:
      - history
      cross_difficulty: null
    - id: copy_match_window
      effect: parameter
      decides: copy_match_days
      bindings:
      - copy_match_days
      - kestrel_latest_dose_on
      - copy_candidate_on
      - copy_gap_days
      - matched_copies
      ladder:
      - when: Kestrel reported a dose of the course to the state registry
        value: K('copy_match_days_reported')
      - when: Kestrel reported none and a documented cash-paid entry from another provider is on the course
        value: K('copy_match_days_documented')
      - when: otherwise
        value: K('copy_match_days_other')
      baseline:
        copy_match_days: K('copy_match_days_other')
      evidence:
      - history
      - date
      cross_difficulty: null
    - id: copy_position_rule
      effect: parameter
      decides: copy_positions
      bindings:
      - reports_on_course
      - cash_outside
      - unlotted_entries
      - copy_positions
      ladder:
      - when: Kestrel reported a dose of the course
        value: K('copy_positions_reported')
      - when: Kestrel reported none and a documented cash-paid outside entry exists
        value: K('copy_positions_unreported')
      - when: otherwise
        value: matched_copies (one each)
      baseline:
        copy_positions: matched_copies
      evidence:
      - history
      cross_difficulty: null
    - id: undocumented_position_rule
      effect: parameter
      decides: unlotted_positions
      bindings:
      - outside_entries
      - unlotted_positions
      ladder:
      - when: a documented cash-paid outside entry is on the course
        value: K('unlotted_positions_with_documented')
      - when: none is and Kestrel reported a dose of the course
        value: K('unlotted_positions_reported')
      - when: otherwise
        value: unlotted_entries (one each)
      baseline:
        unlotted_positions: unlotted_entries
      evidence:
      - history
      cross_difficulty: null
    - id: live_zoster_records
      effect: method
      decides: live_set_aside
      bindings:
      - live_records
      - live_set_aside
      ladder:
      - when: a Recombinant Zoster Two-Dose Series course whose Kestrel dose is reported to the state registry
        method: set aside every entry dated before the recombinant vaccine was available
      - when: a Recombinant Zoster Two-Dose Series course with a Kestrel dose not yet reported
        method: set aside all but one such entry until the pharmacist confirms the product
      - when: otherwise
        method: set aside no entry for its date
      baseline:
        live_set_aside: '0'
      evidence:
      - history
      - date
      cross_difficulty: null
    baseline:
      rule: The posted dose takes the dose number one past the dose entries on the course.
      params: []
    inputs:
      history:
      - table: vax_events
        aggregate: count
        field: vax_event_id
        filters:
          event_type: vax_dose_administered
      - table: vax_events
        aggregate: latest
        field: event_date
        filters:
          event_type: vax_dose_administered
      cross_category: []
  - id: vax_ext_dose_charge_settlement
    base_policy_refs:
    - vax_agg_visit_and_season
    - vax_evt_dose_administration
    - vax_evt_billing
    overwrite:
    - base_policy: vax_evt_billing
      superseded_clause: Every other dose is paid in cash at cash_price_usd, less the savings program's vaccine discount
        where the patient holds an active Kestrel Rx Savings Club membership, rounded to the cent half up.
      replaced_by: The Savings Club discount, the coverage continuity reduction and the pharmacy-patient reduction
        are first added into one total reduction percent, which is then held to the cap; the starting price is reduced
        once by that capped total, the on-time credit is subtracted from the reduced price, the result is never below
        zero, and it is rounded to the cent half up only at the end.
    trigger: on_request
    subject:
    - vax_dose_administered
    computes: patient_pay_usd
    target_tool: settle_dose_charge_857cec2f
    params:
      bundle_pct: 90
      club_pct_unpaid_fee: 5
      continuity_pct_recent: 20
      continuity_pct_older: 10
      loyal_pct_regular: 5
      loyal_pct_occasional: 2
      cap_pct_club_loyal: 22
      cap_pct_club: 18
      cap_pct_none: 100
      on_time_credit_kestrel: 10.0
      on_time_credit_outside: 5.0
    rule: 'A patient settles by phone the charge for a dose given at Kestrel that is paid in cash and whose payment
      is still open on the dose record. The charge is the vaccination''s cash price, rounded to the cent half up.
      The price the charge starts from is set in one of three ways. Where the course shows no valid doses still needed
      once the dose stands on it and every earlier dose of it was paid in cash at a Kestrel store, the price is the
      series bundle price, which is the cash price times the doses the course requires times bundle_pct percent, less
      what the patient already paid for the earlier doses. Where the course shows no valid doses still needed once
      the dose stands on it and an earlier dose of it was billed to an insurance plan, the price is the dose''s share
      of the series bundle price, the cash price times bundle_pct percent. Otherwise the price is the vaccination''s
      cash price. The Savings Club discount is the vaccine discount percent of the patient''s active savings program
      where it is above zero and a membership fee was charged in the last 12 calendar months, club_pct_unpaid_fee
      percent where that discount is above zero and no membership fee was charged in the last 12 calendar months,
      and nothing otherwise. The coverage continuity reduction is continuity_pct_recent percent where the insurance
      plan the course is billed to ended, by its termination date, 60 days ago or less and an earlier dose of the
      course was billed to a plan, continuity_pct_older percent where that plan ended more than 60 and no more than
      365 days ago and an earlier dose was billed to a plan, and nothing otherwise. The pharmacy-patient reduction
      is loyal_pct_regular percent where three or more prescription pickups and three or more prescription refills
      were recorded at Kestrel in the last 3 calendar months, loyal_pct_occasional percent where one or two pickups
      were recorded in that time, and nothing otherwise. The reductions are capped: at cap_pct_club_loyal percent
      where a membership fee was charged in the last 12 calendar months and the pharmacy-patient reduction applies,
      at cap_pct_club percent where a membership fee was charged in that time and it does not, and at cap_pct_none
      percent otherwise. An on-time series credit is subtracted: on_time_credit_kestrel dollars where the dose is
      dose 2 given no later than the recommended maximum interval after the dose 1 Kestrel gave at the course''s store,
      on_time_credit_outside dollars where dose 2 came on time after a dose 1 that no Kestrel store gave, and nothing
      otherwise. The Savings Club discount, the coverage continuity reduction and the pharmacy-patient reduction are
      first added into one total reduction percent, which is then held to the cap; the starting price is reduced once
      by that capped total, the on-time credit is subtracted from the reduced price, the result is never below zero,
      and it is rounded to the cent half up only at the end. The charge for a dose is settled only after the course
      history carries that dose as a given dose with its observation minutes recorded.'
    prerequisite:
    - problem: vax_ext_missed_dose_posting
      kind: value_input
      gate: starting_price
      form: state
      policy_source: The charge for a dose is settled only after the course history carries that dose as a given dose
        with its observation minutes recorded.
      condition: The course history carries the dose-given entry of the dose being paid for, with its observation
        minutes.
      resolved_by: post_missed_dose_006fe732
      effect: 'Once the dose stands on the history, the course shows it as the completing dose: the starting price
        becomes the dose''s share of the series bundle price and the on-time credit applies.'
    cross_category:
    - category: copay
      as: branch
      reads:
      - copay_enrollments.variant_name
      - copay_activity.event_type
      note: The Savings Club discount and the cap read the active savings program and its membership fee in the last
        12 months.
    - category: coverage
      as: branch
      reads:
      - coverage_plans.termination_date
      note: The continuity reduction reads when the plan the course is billed to ended.
    - category: rx
      as: history
      reads:
      - rx_fills.event_type
      note: The pharmacy-patient reduction counts prescription pickups and refills in the last 3 months.
    compute:
    - cash_price: P('cash_price_usd')
    - outside_on_record: COUNT('vax_events', event_type='vax_dose_administered', store_id=None)
    - plan_billed_doses: COUNT('vax_events', event_type='vax_dose_administered', billing_route='pharmacy_benefit')
    - paid_before: SUM('vax_events', 'patient_pay_usd', event_type='vax_dose_administered')
    - starting_price: (cash_price * F('doses_required') * K('bundle_pct') / 100 - paid_before) if (F('doses_remaining')
        == 0 and plan_billed_doses == 0 and outside_on_record == 0) else ((cash_price * K('bundle_pct') / 100) if
        (F('doses_remaining') == 0 and plan_billed_doses >= 1) else cash_price)
    - program_discount: CPARAM('copay', 'vaccine_discount_pct', status='active') or 0
    - fees_12m: XCOUNT('copay', 'copay_activity', within_months=12, event_type='copay_membership_fee_charged')
    - club_pct: program_discount if (program_discount > 0 and fees_12m >= 1) else (K('club_pct_unpaid_fee') if (program_discount
        > 0 and fees_12m == 0) else 0)
    - plan_end: CFIELD('coverage', 'termination_date', coverage_id=F('coverage_id'))
    - plan_ended_days: DAYS(plan_end, NOW) if plan_end else -1
    - continuity_pct: K('continuity_pct_recent') if (plan_ended_days >= 0 and plan_ended_days <= 60 and plan_billed_doses
        >= 1) else (K('continuity_pct_older') if (plan_ended_days > 60 and plan_ended_days <= 365 and plan_billed_doses
        >= 1) else 0)
    - pickups_3m: XCOUNT('rx', 'rx_fills', within_months=3, event_type='rx_pickup')
    - rx_refills_3m: XCOUNT('rx', 'rx_fills', within_months=3, event_type='rx_refill')
    - loyalty_pct: K('loyal_pct_regular') if (pickups_3m >= 3 and rx_refills_3m >= 3) else (K('loyal_pct_occasional')
        if (pickups_3m >= 1 and pickups_3m < 3) else 0)
    - reduction_cap: K('cap_pct_club_loyal') if (fees_12m >= 1 and loyalty_pct > 0) else (K('cap_pct_club') if (fees_12m
        >= 1 and loyalty_pct == 0) else K('cap_pct_none'))
    - total_reduction: MN(reduction_cap, club_pct + continuity_pct + loyalty_pct)
    - first_dose_on: LATEST('vax_events', 'event_date', event_type='vax_dose_administered', dose_number=1, store_id=F('store_id'))
        or LATEST('vax_events', 'event_date', event_type='vax_dose_administered', dose_number=1)
    - second_dose_on: LATEST('vax_events', 'event_date', event_type='vax_dose_administered', dose_number=2)
    - course_store_first_doses: COUNT('vax_events', event_type='vax_dose_administered', dose_number=1, store_id=F('store_id'))
    - kestrel_first_doses: COUNT('vax_events', event_type='vax_dose_administered', dose_number=1) - COUNT('vax_events',
        event_type='vax_dose_administered', dose_number=1, store_id=None)
    - dose_gap_days: DAYS(first_dose_on, second_dose_on) if (first_dose_on and second_dose_on) else 99999
    - on_time_credit: K('on_time_credit_kestrel') if (dose_gap_days <= P('dose2_recommended_max_interval_days') and
        course_store_first_doses >= 1) else (K('on_time_credit_outside') if (dose_gap_days <= P('dose2_recommended_max_interval_days')
        and kestrel_first_doses == 0) else 0)
    - result: RND(MX(0, starting_price * (1 - total_reduction / 100) - on_time_credit), 2)
    compute_basis:
      cash_price: The charge is the vaccination's cash price, rounded to the cent half up. Otherwise the price is
        the vaccination's cash price.
      plan_billed_doses: Where the course shows no valid doses still needed once the dose stands on it and an earlier
        dose of it was billed to an insurance plan, the price is the dose's share of the series bundle price, the
        cash price times bundle_pct percent. The coverage continuity reduction is continuity_pct_recent percent where
        the insurance plan the course is billed to ended, by its termination date, 60 days ago or less and an earlier
        dose of the course was billed to a plan, continuity_pct_older percent where that plan ended more than 60 and
        no more than 365 days ago and an earlier dose was billed to a plan, and nothing otherwise.
      paid_before: Where the course shows no valid doses still needed once the dose stands on it and every earlier
        dose of it was paid in cash at a Kestrel store, the price is the series bundle price, which is the cash price
        times the doses the course requires times bundle_pct percent, less what the patient already paid for the earlier
        doses.
      starting_price: Where the course shows no valid doses still needed once the dose stands on it and every earlier
        dose of it was paid in cash at a Kestrel store, the price is the series bundle price, which is the cash price
        times the doses the course requires times bundle_pct percent, less what the patient already paid for the earlier
        doses. Where the course shows no valid doses still needed once the dose stands on it and an earlier dose of
        it was billed to an insurance plan, the price is the dose's share of the series bundle price, the cash price
        times bundle_pct percent. Otherwise the price is the vaccination's cash price.
      program_discount: The Savings Club discount is the vaccine discount percent of the patient's active savings
        program where it is above zero and a membership fee was charged in the last 12 calendar months, club_pct_unpaid_fee
        percent where that discount is above zero and no membership fee was charged in the last 12 calendar months,
        and nothing otherwise.
      fees_12m: 'The Savings Club discount is the vaccine discount percent of the patient''s active savings program
        where it is above zero and a membership fee was charged in the last 12 calendar months, club_pct_unpaid_fee
        percent where that discount is above zero and no membership fee was charged in the last 12 calendar months,
        and nothing otherwise. The reductions are capped: at cap_pct_club_loyal percent where a membership fee was
        charged in the last 12 calendar months and the pharmacy-patient reduction applies, at cap_pct_club percent
        where a membership fee was charged in that time and it does not, and at cap_pct_none percent otherwise.'
      club_pct: The Savings Club discount is the vaccine discount percent of the patient's active savings program
        where it is above zero and a membership fee was charged in the last 12 calendar months, club_pct_unpaid_fee
        percent where that discount is above zero and no membership fee was charged in the last 12 calendar months,
        and nothing otherwise.
      plan_end: The coverage continuity reduction is continuity_pct_recent percent where the insurance plan the course
        is billed to ended, by its termination date, 60 days ago or less and an earlier dose of the course was billed
        to a plan, continuity_pct_older percent where that plan ended more than 60 and no more than 365 days ago and
        an earlier dose was billed to a plan, and nothing otherwise.
      plan_ended_days: The coverage continuity reduction is continuity_pct_recent percent where the insurance plan
        the course is billed to ended, by its termination date, 60 days ago or less and an earlier dose of the course
        was billed to a plan, continuity_pct_older percent where that plan ended more than 60 and no more than 365
        days ago and an earlier dose was billed to a plan, and nothing otherwise.
      continuity_pct: The coverage continuity reduction is continuity_pct_recent percent where the insurance plan
        the course is billed to ended, by its termination date, 60 days ago or less and an earlier dose of the course
        was billed to a plan, continuity_pct_older percent where that plan ended more than 60 and no more than 365
        days ago and an earlier dose was billed to a plan, and nothing otherwise.
      pickups_3m: The pharmacy-patient reduction is loyal_pct_regular percent where three or more prescription pickups
        and three or more prescription refills were recorded at Kestrel in the last 3 calendar months, loyal_pct_occasional
        percent where one or two pickups were recorded in that time, and nothing otherwise.
      rx_refills_3m: The pharmacy-patient reduction is loyal_pct_regular percent where three or more prescription
        pickups and three or more prescription refills were recorded at Kestrel in the last 3 calendar months, loyal_pct_occasional
        percent where one or two pickups were recorded in that time, and nothing otherwise.
      loyalty_pct: The pharmacy-patient reduction is loyal_pct_regular percent where three or more prescription pickups
        and three or more prescription refills were recorded at Kestrel in the last 3 calendar months, loyal_pct_occasional
        percent where one or two pickups were recorded in that time, and nothing otherwise.
      reduction_cap: 'The reductions are capped: at cap_pct_club_loyal percent where a membership fee was charged
        in the last 12 calendar months and the pharmacy-patient reduction applies, at cap_pct_club percent where a
        membership fee was charged in that time and it does not, and at cap_pct_none percent otherwise.'
      total_reduction: The Savings Club discount, the coverage continuity reduction and the pharmacy-patient reduction
        are first added into one total reduction percent, which is then held to the cap; the starting price is reduced
        once by that capped total, the on-time credit is subtracted from the reduced price, the result is never below
        zero, and it is rounded to the cent half up only at the end.
      first_dose_on: 'An on-time series credit is subtracted: on_time_credit_kestrel dollars where the dose is dose
        2 given no later than the recommended maximum interval after the dose 1 Kestrel gave at the course''s store,
        on_time_credit_outside dollars where dose 2 came on time after a dose 1 that no Kestrel store gave, and nothing
        otherwise.'
      second_dose_on: 'An on-time series credit is subtracted: on_time_credit_kestrel dollars where the dose is dose
        2 given no later than the recommended maximum interval after the dose 1 Kestrel gave at the course''s store,
        on_time_credit_outside dollars where dose 2 came on time after a dose 1 that no Kestrel store gave, and nothing
        otherwise.'
      dose_gap_days: 'An on-time series credit is subtracted: on_time_credit_kestrel dollars where the dose is dose
        2 given no later than the recommended maximum interval after the dose 1 Kestrel gave at the course''s store,
        on_time_credit_outside dollars where dose 2 came on time after a dose 1 that no Kestrel store gave, and nothing
        otherwise.'
      on_time_credit: 'An on-time series credit is subtracted: on_time_credit_kestrel dollars where the dose is dose
        2 given no later than the recommended maximum interval after the dose 1 Kestrel gave at the course''s store,
        on_time_credit_outside dollars where dose 2 came on time after a dose 1 that no Kestrel store gave, and nothing
        otherwise.'
      result: The Savings Club discount, the coverage continuity reduction and the pharmacy-patient reduction are
        first added into one total reduction percent, which is then held to the cap; the starting price is reduced
        once by that capped total, the on-time credit is subtracted from the reduced price, the result is never below
        zero, and it is rounded to the cent half up only at the end. The charge is the vaccination's cash price, rounded
        to the cent half up.
      outside_on_record: Where the course shows no valid doses still needed once the dose stands on it and every earlier
        dose of it was paid in cash at a Kestrel store, the price is the series bundle price, which is the cash price
        times the doses the course requires times bundle_pct percent, less what the patient already paid for the earlier
        doses. Where the course shows no valid doses still needed once the dose stands on it and an earlier dose of
        it was billed to an insurance plan, the price is the dose's share of the series bundle price, the cash price
        times bundle_pct percent.
      kestrel_first_doses: 'An on-time series credit is subtracted: on_time_credit_kestrel dollars where the dose
        is dose 2 given no later than the recommended maximum interval after the dose 1 Kestrel gave at the course''s
        store, on_time_credit_outside dollars where dose 2 came on time after a dose 1 that no Kestrel store gave,
        and nothing otherwise.'
      course_store_first_doses: 'An on-time series credit is subtracted: on_time_credit_kestrel dollars where the
        dose is dose 2 given no later than the recommended maximum interval after the dose 1 Kestrel gave at the course''s
        store, on_time_credit_outside dollars where dose 2 came on time after a dose 1 that no Kestrel store gave,
        and nothing otherwise.'
    factors:
    - id: series_bundle
      effect: method
      decides: starting_price
      bindings:
      - outside_on_record
      - plan_billed_doses
      - paid_before
      - starting_price
      ladder:
      - when: the course shows no doses still needed once the dose stands and every earlier dose was paid in cash
          at a Kestrel store
        method: the series bundle price less what was already paid
      - when: the course shows no doses still needed once the dose stands and an earlier dose was billed to an insurance
          plan
        method: the dose's share of the series bundle price
      - when: otherwise
        method: the vaccination's cash price
      baseline:
        starting_price: cash_price
      evidence:
      - history
      cross_difficulty: null
    - id: savings_club
      effect: parameter
      decides: club_pct
      bindings:
      - program_discount
      - club_pct
      ladder:
      - when: the active savings program's vaccine discount is above zero and a membership fee was charged in the
          last 12 calendar months
        value: CPARAM('copay', 'vaccine_discount_pct')
      - when: that discount is above zero and no membership fee was charged in the last 12 calendar months
        value: K('club_pct_unpaid_fee')
      - when: otherwise
        value: '0'
      baseline:
        club_pct: '0'
      evidence:
      - cross_category
      - history
      cross_difficulty: copay
    - id: coverage_continuity
      effect: parameter
      decides: continuity_pct
      bindings:
      - plan_end
      - plan_ended_days
      - continuity_pct
      ladder:
      - when: the plan the course is billed to ended 60 days ago or less and an earlier dose was billed to a plan
        value: K('continuity_pct_recent')
      - when: that plan ended more than 60 and no more than 365 days ago and an earlier dose was billed to a plan
        value: K('continuity_pct_older')
      - when: otherwise
        value: '0'
      baseline:
        continuity_pct: '0'
      evidence:
      - cross_category
      - date
      cross_difficulty: coverage
    - id: pharmacy_patient
      effect: parameter
      decides: loyalty_pct
      bindings:
      - pickups_3m
      - rx_refills_3m
      - loyalty_pct
      ladder:
      - when: three or more prescription pickups and three or more refills at Kestrel in the last 3 calendar months
        value: K('loyal_pct_regular')
      - when: one or two pickups in the last 3 calendar months
        value: K('loyal_pct_occasional')
      - when: otherwise
        value: '0'
      baseline:
        loyalty_pct: '0'
      evidence:
      - cross_category
      - history
      cross_difficulty: rx
    - id: reduction_ceiling
      effect: parameter
      decides: reduction_cap
      bindings:
      - fees_12m
      - reduction_cap
      ladder:
      - when: a membership fee was charged in the last 12 calendar months and the pharmacy-patient reduction applies
        value: K('cap_pct_club_loyal')
      - when: a membership fee was charged in that time and the pharmacy-patient reduction does not apply
        value: K('cap_pct_club')
      - when: otherwise
        value: K('cap_pct_none')
      baseline:
        reduction_cap: K('cap_pct_none')
      evidence:
      - cross_category
      cross_difficulty: copay
    - id: on_time_series
      effect: parameter
      decides: on_time_credit
      bindings:
      - first_dose_on
      - second_dose_on
      - course_store_first_doses
      - kestrel_first_doses
      - dose_gap_days
      - on_time_credit
      ladder:
      - when: dose 2 given no later than the recommended maximum interval after the dose 1 Kestrel gave at the course's
          store
        value: K('on_time_credit_kestrel')
      - when: dose 2 given on time after a dose 1 that no Kestrel store gave
        value: K('on_time_credit_outside')
      - when: otherwise
        value: '0'
      baseline:
        on_time_credit: '0'
      evidence:
      - history
      - date
      cross_difficulty: null
    baseline:
      params:
      - cash_price_usd
      rule: The charge is the vaccination's cash price, rounded to the cent half up.
    inputs:
      history:
      - table: vax_events
        aggregate: count
        field: vax_event_id
        filters:
          event_type: vax_dose_administered
      - table: vax_events
        aggregate: sum
        field: patient_pay_usd
        filters:
          event_type: vax_dose_administered
      - category: copay
        table: copay_activity
        aggregate: count
        field: activity_id
        within_months: 12
        filters:
          event_type: copay_membership_fee_charged
      - category: rx
        table: rx_fills
        aggregate: count
        field: fill_id
        within_months: 3
        filters:
          event_type: rx_pickup
      cross_category:
      - copay
      - coverage
      - rx
