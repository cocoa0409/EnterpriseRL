        is the dose 3 minimum interval from dose 2, with dose 3 also no earlier than the date of dose 1 plus the dose
        3 minimum interval from dose 1 less the grace period days.'
      earliest_days_ahead: The days ahead are the earliest date's distance from today, and where that date is today
        or already past the appointment is booked one day ahead.
      no_shows_12m: The missed-visit allowance is allowance_two_no_shows days where the series history shows two or
        more no-shows in the last 12 calendar months, allowance_one_no_show days where it shows exactly one no-show
        in the last 12 calendar months, and nothing where it shows none.
      missed_visit_allowance: The missed-visit allowance is allowance_two_no_shows days where the series history shows
        two or more no-shows in the last 12 calendar months, allowance_one_no_show days where it shows exactly one
        no-show in the last 12 calendar months, and nothing where it shows none.
      plan_government: The plan-check allowance is allowance_plan_repeat_rejects days where the patient's active insurance
        plan is not a government program and two or more of the patient's claims were rejected in the last 3 calendar
        months, allowance_plan_one_reject days where the active plan is not a government program and exactly one claim
        was rejected in the last 3 calendar months, and nothing otherwise.
      plan_rejects_3m: The plan-check allowance is allowance_plan_repeat_rejects days where the patient's active insurance
        plan is not a government program and two or more of the patient's claims were rejected in the last 3 calendar
        months, allowance_plan_one_reject days where the active plan is not a government program and exactly one claim
        was rejected in the last 3 calendar months, and nothing otherwise.
      plan_check_allowance: The plan-check allowance is allowance_plan_repeat_rejects days where the patient's active
        insurance plan is not a government program and two or more of the patient's claims were rejected in the last
        3 calendar months, allowance_plan_one_reject days where the active plan is not a government program and exactly
        one claim was rejected in the last 3 calendar months, and nothing otherwise.
      history_closed_days: The resumed-series allowance is allowance_closed_recently days where the course the series
        history is on was closed 60 days ago or less, allowance_closed_long_ago days where it was closed more than
        60 days ago, and nothing where it is not closed.
      resumed_series_allowance: The resumed-series allowance is allowance_closed_recently days where the course the
        series history is on was closed 60 days ago or less, allowance_closed_long_ago days where it was closed more
        than 60 days ago, and nothing where it is not closed.
      history_dose_entries: The outside-record allowance is allowance_outside_reviewed days where the series history
        carries a dose entry not reported by Kestrel and an invalidation entry, allowance_outside_unreviewed days
        where it carries a dose entry not reported by Kestrel and no invalidation entry, and nothing where every dose
        entry was reported by Kestrel.
      history_reported: The outside-record allowance is allowance_outside_reviewed days where the series history carries
        a dose entry not reported by Kestrel and an invalidation entry, allowance_outside_unreviewed days where it
        carries a dose entry not reported by Kestrel and no invalidation entry, and nothing where every dose entry
        was reported by Kestrel.
      history_invalidations: The outside-record allowance is allowance_outside_reviewed days where the series history
        carries a dose entry not reported by Kestrel and an invalidation entry, allowance_outside_unreviewed days
        where it carries a dose entry not reported by Kestrel and no invalidation entry, and nothing where every dose
        entry was reported by Kestrel.
      outside_record_allowance: The outside-record allowance is allowance_outside_reviewed days where the series history
        carries a dose entry not reported by Kestrel and an invalidation entry, allowance_outside_unreviewed days
        where it carries a dose entry not reported by Kestrel and no invalidation entry, and nothing where every dose
        entry was reported by Kestrel.
      combine_dose_entries: Where the course the series history is on is closed and holds at least one dose entry,
        the four allowances are added together. Where that course is open and holds at least one dose entry, only
        the largest of the four applies. Where it holds no dose entry, no allowance applies.
      combined_allowance: Where the course the series history is on is closed and holds at least one dose entry, the
        four allowances are added together. Where that course is open and holds at least one dose entry, only the
        largest of the four applies. Where it holds no dose entry, no allowance applies. The combined allowance is
        added to the days ahead after the one-day-ahead rule and before the booking window is applied.
      result: Where the earliest date lies within the booking window, the appointment is never booked more than the
        booking window days ahead of today; where the earliest date itself lies beyond the booking window, no appointment
        is booked today. The combined allowance is added to the days ahead after the one-day-ahead rule and before
        the booking window is applied.
    factors:
    - id: next_dose_clock
      effect: method
      decides: series_clock_days
      bindings:
      - series_first_dose
      - series_latest_dose
      - series_latest_number
      - too_early_entries
      - under_age_entries
      - series_clock_days
      ladder:
      - when: an invalidation entry for a dose given too early is on the series history and the latest dose came after
          dose 1
        method: run the clock from the invalid dose's date with the full minimum interval separating it from the dose
          before it and no grace period, a repeated dose 3 also keeping the dose 3 interval from dose 1 less the grace
          period days
      - when: an invalidation entry for a dose given below the minimum age is on the series history
        method: run the clock from the latest dose's date with that dose's minimum interval less the grace period
          days
      - when: otherwise
        method: run the clock from the latest dose's date with the minimum interval to the next dose less the grace
          period days, and for dose 3 no earlier than dose 1 plus the dose 3 minimum interval from dose 1 less the
          grace period days
      baseline:
        series_clock_days: (P('dose2_min_interval_days') - P('grace_period_days') - DAYS(series_latest_dose, NOW))
          if series_latest_number <= 1 else MX(P('dose3_min_interval_days_from_dose2') - P('grace_period_days') -
          DAYS(series_latest_dose, NOW), P('dose3_min_interval_days_from_dose1') - P('grace_period_days') - DAYS(series_first_dose,
          NOW))
      evidence:
      - history
      - date
      cross_difficulty: null
    - id: missed_visit
      effect: parameter
      decides: missed_visit_allowance
      bindings:
      - no_shows_12m
      - missed_visit_allowance
      ladder:
      - when: two or more no-shows in the last 12 calendar months
        value: K('allowance_two_no_shows')
      - when: exactly one no-show in the last 12 calendar months
        value: K('allowance_one_no_show')
      - when: otherwise (no no-show in that time)
        value: '0'
      baseline:
        missed_visit_allowance: '0'
      evidence:
      - history
      - date
      cross_difficulty: null
    - id: plan_check
      effect: parameter
      decides: plan_check_allowance
      bindings:
      - plan_government
      - plan_rejects_3m
      - plan_check_allowance
      ladder:
      - when: the active plan is not a government program and two or more claims were rejected in the last 3 calendar
          months
        value: K('allowance_plan_repeat_rejects')
      - when: the active plan is not a government program and exactly one claim was rejected in the last 3 calendar
          months
        value: K('allowance_plan_one_reject')
      - when: otherwise
        value: '0'
      baseline:
        plan_check_allowance: '0'
      evidence:
      - cross_category
      - history
      cross_difficulty: coverage
    - id: resumed_series
      effect: parameter
      decides: resumed_series_allowance
      bindings:
      - history_closed_days
      - resumed_series_allowance
      ladder:
      - when: the course the series history is on closed 60 days ago or less
        value: K('allowance_closed_recently')
      - when: it closed more than 60 days ago
        value: K('allowance_closed_long_ago')
      - when: otherwise
        value: '0'
      baseline:
        resumed_series_allowance: '0'
      evidence:
      - date
      cross_difficulty: null
    - id: outside_record
      effect: parameter
      decides: outside_record_allowance
      bindings:
      - history_dose_entries
      - history_reported
      - history_invalidations
      - outside_record_allowance
      ladder:
      - when: a dose entry not reported by Kestrel and an invalidation entry are on the series history
        value: K('allowance_outside_reviewed')
      - when: a dose entry not reported by Kestrel and no invalidation entry are on it
        value: K('allowance_outside_unreviewed')
      - when: otherwise
        value: '0'
      baseline:
        outside_record_allowance: '0'
      evidence:
      - history
      cross_difficulty: null
    - id: allowance_combination
      effect: method
      decides: combined_allowance
      bindings:
      - combine_dose_entries
      - combined_allowance
      ladder:
      - when: the course the series history is on is closed and holds at least one dose entry
        method: add the four allowances together
      - when: that course is open and holds at least one dose entry
        method: apply only the largest of the four
      - when: otherwise
        method: apply no allowance
      baseline:
        combined_allowance: '0'
      evidence:
      - history
      - date
      cross_difficulty: null
    baseline:
      params:
      - dose2_min_interval_days
      - dose3_min_interval_days_from_dose2
      - dose3_min_interval_days_from_dose1
      - grace_period_days
      - booking_window_days_ahead
      rule: The earliest date is the date of the latest dose on the series history plus the minimum interval to the
        next dose less the grace period days, counted in calendar days with that dose date as day 0; the minimum interval
        to the next dose is the dose 2 minimum interval after dose 1, and after dose 2 or a later dose it is the dose
        3 minimum interval from dose 2, with dose 3 also no earlier than the date of dose 1 plus the dose 3 minimum
        interval from dose 1 less the grace period days. The days ahead are the earliest date's distance from today,
        and where that date is today or already past the appointment is booked one day ahead. Where the earliest date
        lies within the booking window, the appointment is never booked more than the booking window days ahead of
        today; where the earliest date itself lies beyond the booking window, no appointment is booked today.
    inputs:
      history:
      - table: vax_events
        aggregate: latest
        field: event_date
        filters:
          event_type: vax_dose_administered
      - table: vax_events
        aggregate: count
        field: vax_event_id
        within_months: 12
        filters:
          event_type: vax_appointment_no_show
      - table: vax_events
        aggregate: count
        field: vax_event_id
        filters:
          event_type: vax_dose_invalidated
      - category: coverage
        table: coverage_claims
        aggregate: count
        field: claim_id
        within_months: 3
        filters:
          event_type: coverage_claim_rejected
      cross_category:
      - coverage
  - id: vax_ext_missed_dose_posting
    base_policy_refs:
    - vax_agg_visit_and_season
    - vax_evt_dose_administration
    - vax_evt_billing
    overwrite:
    - base_policy: vax_evt_dose_administration
      superseded_clause: A dose is given only when a screening and consent form for that dose was signed no more than
        the consent validity days before, counted in calendar days with the signing date as day 0; the form is signed
        by the patient, or below guardian_consent_under_age by a parent or guardian, and never by Kestrel staff for
        them.
      replaced_by: A dose posted after the visit is covered by the screening and consent form signed for the appointment
        it was given at no more than the consent validity days before, counted in calendar days with the signing date
        as day 0, whatever dose number the appointment and the form print; the form is signed by the patient, or below
        the guardian-consent age by a parent or guardian, and never by Kestrel staff for them. A dose given and recorded
        at the visit itself is given only when a screening and consent form for that dose was signed no more than
        the consent validity days before, counted in calendar days with the signing date as day 0.
    trigger: state_due
    subject:
    - vax_dose_administered
    computes: dose_number
    target_tool: post_missed_dose_006fe732
    params:
      copy_match_days_reported: 3
      copy_match_days_documented: 1
      copy_match_days_other: 0
      copy_positions_reported: 0
      copy_positions_unreported: 1
      unlotted_positions_with_documented: 0
      unlotted_positions_reported: 1
      recombinant_available_on: '2017-10-20'
    rule: 'When a dose a Kestrel pharmacist gave today did not reach the record, the desk posts it, and the posted
      dose takes the dose number of the series that Kestrel''s record conventions give it. The posted dose takes the
      dose number one past the dose entries on the course. A dose posted after the visit is covered by the screening
      and consent form signed for the appointment it was given at no more than the consent validity days before, counted
      in calendar days with the signing date as day 0, whatever dose number the appointment and the form print; the
      form is signed by the patient, or below the guardian-consent age by a parent or guardian, and never by Kestrel
      staff for them. A dose given and recorded at the visit itself is given only when a screening and consent form
      for that dose was signed no more than the consent validity days before, counted in calendar days with the signing
      date as day 0. The dose number printed on the appointment or the form is the booking system''s own count and
      is not the number the posted dose takes. The dose number is counted in one of three ways. Where the course''s
      dose history holds more dose entries than its required doses less its doses still needed account for and Kestrel
      gave a dose of the course at one of its stores, the number is counted from positions: one past the entries that
      hold a position once matched registry copies, undocumented entries and live zoster records are set aside. Where
      the dose history holds no more dose entries than that and Kestrel gave a dose of the course, the number is one
      past the course''s required doses less its doses still needed. Where Kestrel gave no dose of the course, the
      number is one past every dose entry on it. A plan-billed entry recorded from another provider is matched as
      a registry copy when it is dated no more than a match window of days after the latest dose Kestrel gave on the
      course at the course''s store: copy_match_days_reported days where Kestrel reported a dose of the course to
      the state registry, copy_match_days_documented days where it reported none and a documented cash-paid entry
      from another provider is on the course, and copy_match_days_other days, that is the same day only, otherwise.
      Where the number is counted from positions, matched registry copies hold positions as follows: copy_positions_reported
      each where Kestrel reported a dose of the course, copy_positions_unreported between them where it reported none
      and a documented cash-paid outside entry exists, and one each otherwise. Where the number is counted from positions,
      cash-paid entries recorded from another provider without a lot number hold positions as follows: unlotted_positions_with_documented
      each where a documented cash-paid outside entry is on the course, unlotted_positions_reported between them where
      none is and Kestrel reported a dose of the course, and one each otherwise. Where the number is counted from
      positions on a Recombinant Zoster Two-Dose Series course, entries dated before recombinant_available_on are
      records of the earlier live zoster vaccine: where Kestrel reported its dose of the course to the state registry
      every such entry is set aside, and where Kestrel gave a dose it has not yet reported all but one of them are
      set aside until the pharmacist confirms the product; otherwise no entry is set aside for its date.'
    prerequisite: []
    cross_category: []
    compute:
    - dose_entries: COUNT('vax_events', event_type='vax_dose_administered')
    - outside_entries: COUNT('vax_events', event_type='vax_dose_administered', store_id=None)
    - kestrel_given: dose_entries - outside_entries
    - account_given: F('doses_required') - F('doses_remaining')
    - reports_on_course: COUNT('vax_events', event_type='vax_registry_reported')
    - cash_outside: COUNT('vax_events', event_type='vax_dose_administered', store_id=None, billing_route='cash')
    - unlotted_entries: COUNT('vax_events', event_type='vax_dose_administered', store_id=None, lot_number=None)
    - copy_match_days: K('copy_match_days_reported') if reports_on_course >= 1 else (K('copy_match_days_documented')
        if cash_outside - unlotted_entries >= 1 else K('copy_match_days_other'))
    - kestrel_latest_dose_on: LATEST('vax_events', 'event_date', event_type='vax_dose_administered', store_id=F('store_id'))
    - copy_candidate_on: LATEST('vax_events', 'event_date', event_type='vax_dose_administered', store_id=None, billing_route='pharmacy_benefit')
    - copy_gap_days: DAYS(kestrel_latest_dose_on, copy_candidate_on) if (kestrel_latest_dose_on and copy_candidate_on)
        else -99
    - matched_copies: COUNT('vax_events', event_type='vax_dose_administered', store_id=None, billing_route='pharmacy_benefit')
        if (copy_gap_days >= 0 and copy_gap_days <= copy_match_days) else 0
    - copy_positions: (matched_copies * K('copy_positions_reported')) if reports_on_course >= 1 else (MN(matched_copies,
        K('copy_positions_unreported')) if cash_outside - unlotted_entries >= 1 else matched_copies)
    - unlotted_positions: (unlotted_entries * K('unlotted_positions_with_documented')) if cash_outside - unlotted_entries
        >= 1 else (MN(unlotted_entries, K('unlotted_positions_reported')) if reports_on_course >= 1 else unlotted_entries)
    - live_records: dose_entries - COUNT('vax_events', within_months=MONTHS(K('recombinant_available_on'), NOW), event_type='vax_dose_administered')
    - live_set_aside: live_records if (F('variant_name') == 'Recombinant Zoster Two-Dose Series' and reports_on_course
        >= 1) else (MX(0, live_records - 1) if (F('variant_name') == 'Recombinant Zoster Two-Dose Series' and kestrel_given
        >= 1 and reports_on_course == 0) else 0)
    - positions_held: (dose_entries - (matched_copies - copy_positions) - (unlotted_entries - unlotted_positions)
        - live_set_aside) if (dose_entries > account_given and kestrel_given >= 1) else (account_given if (dose_entries
        <= account_given and kestrel_given >= 1) else dose_entries)
    - result: positions_held + 1
